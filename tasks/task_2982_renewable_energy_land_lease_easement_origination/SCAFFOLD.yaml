# =============================================================================
# PRD Benchmark Seed Tables — Renewable Energy Land Lease & Easement Origination
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  2982. Renewable Energy Land Lease & Easement Origination (utility-scale renewable land team):
  parcel screening for interconnection proximity, resource quality, buildability and title
  condition, landowner outreach with option agreement terms, option payments and extension
  rights, lease rent structures from per-acre payments to production royalties with escalators,
  title curative work including mineral severance, mortgage subordination and access easements,
  setback, zoning and neighbor consent requirements affecting buildable area, crossing
  agreements for collection lines and interconnection routes, decommissioning security and
  reclamation obligations, option exercise, notice of lease recording and payment administration

domain_name: renewable-land-origination
api_prefix: /land-origination

complexity_profile:
  difficulty_level: expert_plus     # beyond the §0.4 Expert band: 12 entities, 54 endpoints, 7 calculations, 10 state machines
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection directly under /land-origination with
  # explicit foreign keys in request bodies; no entity id is nested inside
  # another entity's collection path. Deliberately chosen over `hybrid`.

  state_machine_shape: cyclic
  # OptionAgreement negotiates in rounds: SENT -> COUNTERED -> REVISED -> SENT.
  # LeaseAgreement additionally carries two independent state dimensions
  # (rent_status x recording_status), and Parcel reverts QUALIFIED -> SCREENING
  # when a granted neighbor consent is revoked.

  relationship_patterns:
    - one_to_many          # Parcel -> TitleCurativeItem / NeighborConsent / SiteAccessBooking
    - self_referential     # TitleCurativeItem.blocks_item_id -> TitleCurativeItem.id
    - cross_aggregate      # CrossingAgreement joins Corridor and Parcel; LeaseAgreement joins OptionAgreement, Parcel, Landowner

  role_model: segregation_of_duties
  # The PortfolioManager user id that executed an OptionAgreement may not be the
  # user id that exercises it; the TitleCounsel user id that created a curative
  # item may not be the user id that waives it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- Landowner
  - name: Landowner
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the owner of record as it appears on the deed"
        constraints: "1..200 chars, non-blank"
      - name: entity_type
        type: enum
        source: input
        description: "Legal form of the landowner, drives signature-block requirements"
        constraints: "one of INDIVIDUAL, TRUST, LLC, PARTNERSHIP"
      - name: mailing_state
        type: string
        source: input
        description: "Two-letter USPS state code for payment and notice mailing"
        constraints: "exactly 2 uppercase letters"
      - name: contact_email
        type: string
        source: input
        description: "Notice email for option and lease correspondence"
        constraints: "must contain '@'"
      - name: w9_on_file
        type: boolean
        source: input
        description: "True when a signed W-9 has been collected; gates memorandum-of-lease recording"
        default: false
      - name: payment_hold
        type: boolean
        source: input
        description: "True when payment administration has frozen all cash movement for this landowner"
        default: false
      - name: status
        type: enum
        source: system
        description: "Relationship posture, advanced only by cascades from Parcel, OptionAgreement and LeaseAgreement transitions"
        default: PROSPECT
        constraints: "one of PROSPECT, ENGAGED, UNDER_OPTION, UNDER_LEASE"
      - name: total_paid_cents
        type: integer
        source: computed
        description: "Signed option-payment ledger balance for this landowner; recomputed by calculation landowner_paid_ledger on every OptionPayment insert"
        default: 0

  # ------------------------------------------------------------------- Parcel
  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - name: apn
        type: string
        source: input
        description: "Assessor parcel number"
        constraints: "1..40 chars; unique per (county_fips, apn)"
      - name: county_fips
        type: string
        source: input
        description: "Five-digit county FIPS code; joins SetbackRule.jurisdiction_code"
        constraints: "exactly 5 digits"
      - name: landowner_id
        type: string
        source: input
        description: "FK -> Landowner.id; owner of record for this parcel"
      - name: gross_acres
        type: number
        source: input
        description: "Deeded gross acreage"
        constraints: "> 0, at most 2 decimal places"
      - name: interconnection_distance_km
        type: number
        source: input
        description: "Straight-line distance from parcel centroid to the nearest interconnection point of delivery"
        constraints: ">= 0, at most 2 decimal places"
      - name: resource_capacity_factor
        type: number
        source: input
        description: "Modelled net capacity factor for the resource at this parcel"
        constraints: "> 0 and <= 1, at most 4 decimal places"
      - name: slope_pct
        type: number
        source: input
        description: "Mean terrain slope in percent; drives the slope-exclusion tier"
        constraints: ">= 0 and <= 100, at most 1 decimal place"
      - name: title_condition_grade
        type: enum
        source: input
        description: "Grade from the desktop title report before any curative work"
        constraints: "one of A, B, C, D"
      - name: zoning_code
        type: string
        source: input
        description: "Local zoning designation; codes in PROHIBITED_ZONING_CODES cannot be optioned"
        constraints: "1..12 chars"
      - name: screen_mode
        type: enum
        source: system
        description: "Which variant of calculation parcel_screening_score produced the current screening_score"
        default: DESKTOP
        constraints: "one of DESKTOP, FIELD_VERIFIED"
      - name: screening_score
        type: number
        source: computed
        description: "Weighted screening score from calculation parcel_screening_score, 2 decimal places"
      - name: screening_tier
        type: enum
        source: computed
        description: "Tier derived from screening_score by calculation parcel_screening_score"
        constraints: "one of PRIORITY, STANDARD, DEFERRED, REJECTED"
      - name: slope_excluded_acres
        type: number
        source: computed
        description: "Acres excluded by the slope tier, from calculation buildable_acres_derivation"
      - name: raw_setback_acres
        type: number
        source: computed
        description: "Sum of per-SetbackRule encumbered acres before neighbor-consent release, from calculation buildable_acres_derivation"
      - name: consent_released_acres
        type: number
        source: computed
        description: "Acres released by GRANTED NeighborConsent rows, from calculation buildable_acres_derivation"
      - name: setback_encumbered_acres
        type: number
        source: computed
        description: "raw_setback_acres minus consent_released_acres, floored at 0.00"
      - name: buildable_acres
        type: number
        source: computed
        description: "gross_acres minus slope_excluded_acres minus setback_encumbered_acres, floored at 0.00"
      - name: blocking_curative_open_count
        type: integer
        source: computed
        description: "Count of TitleCurativeItem rows on this parcel with severity == BLOCKING and status IN {BLOCKED, OPEN}"
        default: 0
      - name: waived_blocking_count
        type: integer
        source: computed
        description: "Count of TitleCurativeItem rows on this parcel with severity == BLOCKING and status == WAIVED"
        default: 0
      - name: curative_cost_cents
        type: integer
        source: computed
        description: "Sum of curative_cost_cents over TitleCurativeItem rows on this parcel with status == CLEARED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Origination lifecycle state of the parcel"
        default: SCREENING
        constraints: "one of SCREENING, QUALIFIED, DISQUALIFIED, OPTIONED, LEASED"

  # ---------------------------------------------------------------- SetbackRule
  - name: SetbackRule
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_code
        type: string
        source: input
        description: "Five-digit county FIPS code this rule applies to; matched against Parcel.county_fips"
        constraints: "exactly 5 digits"
      - name: rule_type
        type: enum
        source: input
        description: "Which setback the rule imposes"
        constraints: "one of PROPERTY_LINE, OCCUPIED_DWELLING, PUBLIC_ROAD, WETLAND; unique per (jurisdiction_code, rule_type)"
      - name: setback_feet
        type: integer
        source: input
        description: "Ordinance setback distance in feet, carried for documentation"
        constraints: ">= 0"
      - name: encumbrance_rate_per_acre
        type: number
        source: input
        description: "Acres encumbered per gross acre by this setback"
        constraints: ">= 0 and <= 1, at most 4 decimal places"
      - name: consent_waivable
        type: boolean
        source: input
        description: "True when a GRANTED NeighborConsent can release part of this rule's encumbrance"

  # ------------------------------------------------------------ NeighborConsent
  - name: NeighborConsent
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel whose buildable area the consent enlarges"
      - name: setback_rule_id
        type: string
        source: input
        description: "FK -> SetbackRule.id; the setback the neighbor is consenting to waive"
      - name: neighbor_name
        type: string
        source: input
        description: "Name of the adjoining owner or dwelling occupant granting consent"
        constraints: "1..200 chars, non-blank"
      - name: consent_expiry_days
        type: integer
        source: input
        description: "Days from creation after which an ungranted request lapses"
        default: 60
        constraints: ">= 1 and <= 365"
      - name: requested_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the consent request was created"
      - name: consent_expiry_at
        type: datetime
        source: computed
        description: "requested_at plus consent_expiry_days days"
      - name: granted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the neighbor granted consent; null until GRANTED"
      - name: revoked_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the consent was revoked; null unless REVOKED"
      - name: released_acres
        type: number
        source: computed
        description: "Acres this consent releases while GRANTED, from calculation buildable_acres_derivation; 0.00 in every other status"
        default: 0.00
      - name: status
        type: enum
        source: system
        description: "Consent lifecycle state"
        default: REQUESTED
        constraints: "one of REQUESTED, GRANTED, REVOKED, EXPIRED"

  # -------------------------------------------------------- TitleCurativeItem
  - name: TitleCurativeItem
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel whose title this item cures"
      - name: blocks_item_id
        type: string
        source: input
        description: "FK -> TitleCurativeItem.id; predecessor item that must reach CLEARED or WAIVED before this item leaves BLOCKED. Null when the item has no predecessor."
        default: null
      - name: item_type
        type: enum
        source: input
        description: "Nature of the title defect"
        constraints: "one of MINERAL_SEVERANCE, MORTGAGE_SUBORDINATION, ACCESS_EASEMENT_GAP, TAX_LIEN, HEIRSHIP_GAP"
      - name: severity
        type: enum
        source: input
        description: "BLOCKING items gate option exercise, crossing creation and memorandum submission; MATERIAL and ADVISORY items never gate"
        constraints: "one of BLOCKING, MATERIAL, ADVISORY"
      - name: curative_cost_cents
        type: integer
        source: input
        description: "Budgeted counsel cost, added to Parcel.curative_cost_cents only when the item reaches CLEARED"
        constraints: ">= 0"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TitleCounsel that created the item; the same user id may not waive it"
      - name: cleared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TitleCounsel that cleared the item; null unless CLEARED"
      - name: cleared_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the item reached CLEARED; null otherwise"
      - name: waiver_note
        type: string
        source: system
        description: "Justification recorded when the item reached WAIVED; null otherwise"
      - name: status
        type: enum
        source: system
        description: "Curative lifecycle state; BLOCKED at creation when the predecessor is not yet CLEARED or WAIVED"
        default: OPEN
        constraints: "one of BLOCKED, OPEN, CLEARED, WAIVED"

  # --------------------------------------------------------- OptionAgreement
  - name: OptionAgreement
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel under option"
      - name: landowner_id
        type: string
        source: input
        description: "FK -> Landowner.id; must equal Parcel.landowner_id of parcel_id"
      - name: option_term_days
        type: integer
        source: input
        description: "Days from execution during which the option may be exercised"
        constraints: ">= 1 and <= 1825"
      - name: option_fee_per_acre_cents
        type: integer
        source: input
        description: "Initial option fee rate applied to Parcel.gross_acres at execution"
        constraints: ">= 0"
      - name: extension_count_allowed
        type: integer
        source: input
        description: "Maximum number of extensions the developer may buy"
        default: 0
        constraints: ">= 0 and <= 3"
      - name: extension_fee_per_acre_cents
        type: integer
        source: input
        description: "First-extension fee rate applied to Parcel.gross_acres; later extensions step up by EXTENSION_STEP_UP_BPS"
        constraints: ">= 0"
      - name: rent_structure_type
        type: enum
        source: input
        description: "PER_ACRE pays only the escalated per-acre component; ROYALTY_HYBRID pays the greater of the per-acre component and the production royalty"
        constraints: "one of PER_ACRE, ROYALTY_HYBRID"
      - name: base_rent_per_acre_cents
        type: integer
        source: input
        description: "Year-1 rent rate per acre before escalation"
        constraints: ">= 0"
      - name: royalty_rate_bps
        type: integer
        source: input
        description: "Production royalty rate in basis points; must be 0 when rent_structure_type == PER_ACRE"
        constraints: ">= 0 and <= 2000"
      - name: escalator_pct_bps
        type: integer
        source: input
        description: "Annual rent escalator in basis points"
        constraints: ">= 0 and <= 1000"
      - name: escalator_mode
        type: enum
        source: input
        description: "SIMPLE multiplies the escalator by elapsed years; COMPOUND raises (1 + escalator) to elapsed years"
        constraints: "one of SIMPLE, COMPOUND"
      - name: round_index
        type: integer
        source: computed
        description: "Number of completed landowner counters; incremented on every SENT -> COUNTERED transition and capped by MAX_NEGOTIATION_ROUNDS"
        default: 0
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the ACCEPTED -> EXECUTED transition"
      - name: executed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PortfolioManager that executed the option; the same user id may not exercise it"
      - name: option_expiry_at
        type: datetime
        source: computed
        description: "executed_at plus option_term_days days, plus EXTENSION_TERM_DAYS days per purchased extension"
      - name: extensions_used
        type: integer
        source: computed
        description: "Number of extensions purchased so far"
        default: 0
      - name: total_option_paid_cents
        type: integer
        source: computed
        description: "Signed sum of this agreement's OptionPayment rows: DEBIT_DEVELOPER amounts minus CREDIT_DEVELOPER amounts"
        default: 0
      - name: exercised_at
        type: datetime
        source: system
        description: "Logical-clock instant of the EXECUTED -> EXERCISED transition"
      - name: withdraw_reason
        type: string
        source: system
        description: "Free-text reason recorded on withdrawal; null unless WITHDRAWN"
      - name: status
        type: enum
        source: system
        description: "Negotiation and option lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT, SENT, COUNTERED, REVISED, ACCEPTED, EXECUTED, EXERCISED, EXPIRED, WITHDRAWN"

  # ------------------------------------------------------------ OptionPayment
  - name: OptionPayment
    parent: null
    common_fields: false
    fields:
      - name: option_agreement_id
        type: string
        source: system
        description: "FK -> OptionAgreement.id; the agreement this ledger row belongs to"
      - name: sequence_no
        type: integer
        source: system
        description: "1-based insertion index within the owning agreement, assigned in created_at ASC order"
      - name: payment_kind
        type: enum
        source: system
        description: "Which transition minted the row"
        constraints: "one of INITIAL_OPTION_FEE, EXTENSION_FEE, REFUND_REVERSAL"
      - name: ledger_direction
        type: enum
        source: system
        description: "DEBIT_DEVELOPER increases Landowner.total_paid_cents; CREDIT_DEVELOPER decreases it"
        constraints: "one of DEBIT_DEVELOPER, CREDIT_DEVELOPER"
      - name: amount_cents
        type: integer
        source: computed
        description: "Row amount from calculation option_fee_schedule, always non-negative; direction carries the sign"
      - name: acres_basis
        type: number
        source: computed
        description: "Parcel.gross_acres snapshot used to compute amount_cents; 0.00 on REFUND_REVERSAL rows"

  # ----------------------------------------------------------------- Corridor
  - name: Corridor
    parent: null
    common_fields: true
    fields:
      - name: route_name
        type: string
        source: input
        description: "Human label for the collection or gen-tie route"
        constraints: "1..120 chars, non-blank"
      - name: total_length_m
        type: integer
        source: input
        description: "Total centreline length in metres; station values must fall inside [0, total_length_m]"
        constraints: ">= 1"
      - name: voltage_class
        type: enum
        source: input
        description: "Electrical class of the corridor"
        constraints: "one of COLLECTION_34_5KV, GENTIE_138KV, GENTIE_345KV"
      - name: buffer_m
        type: integer
        source: input
        description: "Exclusion buffer in metres applied on both sides of every occupied station interval when testing corridor conflicts"
        constraints: ">= 0 and <= 500"
      - name: permitted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the corridor was permitted; null while PLANNED"
      - name: granted_crossing_count
        type: integer
        source: computed
        description: "Count of CrossingAgreement rows on this corridor with status == GRANTED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Corridor permitting state; crossings may only be granted on a PERMITTED corridor"
        default: PLANNED
        constraints: "one of PLANNED, PERMITTED"

  # -------------------------------------------------------- CrossingAgreement
  - name: CrossingAgreement
    parent: null
    common_fields: true
    fields:
      - name: corridor_id
        type: string
        source: input
        description: "FK -> Corridor.id; the corridor whose stationing this crossing occupies"
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel crossed by the route"
      - name: crossing_kind
        type: enum
        source: input
        description: "Which facility crosses the parcel; selects the per-metre compensation rate"
        constraints: "one of COLLECTION_LINE, INTERCONNECTION_ROUTE, ACCESS_ROAD"
      - name: station_start_m
        type: integer
        source: input
        description: "Inclusive start station on the corridor centreline"
        constraints: ">= 0 and < station_end_m"
      - name: station_end_m
        type: integer
        source: input
        description: "Inclusive end station on the corridor centreline"
        constraints: "> station_start_m and <= Corridor.total_length_m"
      - name: occupancy_window_start
        type: datetime
        source: input
        description: "Half-open occupancy window start, inclusive"
      - name: occupancy_window_end
        type: datetime
        source: input
        description: "Half-open occupancy window end, exclusive; must be strictly after occupancy_window_start"
      - name: occupied_m
        type: integer
        source: computed
        description: "station_end_m minus station_start_m"
      - name: duration_days
        type: integer
        source: computed
        description: "ceil((occupancy_window_end - occupancy_window_start) / 86400 seconds)"
      - name: long_occupancy_surcharge_bps
        type: integer
        source: computed
        description: "Surcharge basis points from calculation crossing_compensation, capped at LONG_OCCUPANCY_CAP_BPS"
        default: 0
      - name: compensation_cents
        type: integer
        source: computed
        description: "Crossing compensation from calculation crossing_compensation"
      - name: granted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the crossing was granted; null while PROPOSED"
      - name: status
        type: enum
        source: system
        description: "Crossing lifecycle state"
        default: PROPOSED
        constraints: "one of PROPOSED, GRANTED"

  # -------------------------------------------------------- SiteAccessBooking
  - name: SiteAccessBooking
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel whose crew capacity the booking consumes"
      - name: purpose
        type: enum
        source: input
        description: "Field activity the crews will perform"
        constraints: "one of TITLE_SURVEY, GEOTECH, ENV_SURVEY, CONSTRUCTION_STAGING"
      - name: window_start
        type: datetime
        source: input
        description: "Half-open access window start, inclusive"
      - name: window_end
        type: datetime
        source: input
        description: "Half-open access window end, exclusive; must be strictly after window_start"
      - name: crew_count
        type: integer
        source: input
        description: "Simultaneous crews the booking occupies against PARCEL_MAX_CONCURRENT_CREWS"
        constraints: ">= 1 and <= 3"
      - name: cancelled_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the booking was cancelled; null unless CANCELLED"
      - name: status
        type: enum
        source: system
        description: "Booking lifecycle state; only BOOKED rows consume crew capacity"
        default: BOOKED
        constraints: "one of BOOKED, CANCELLED, COMPLETED"

  # ----------------------------------------------------------- LeaseAgreement
  - name: LeaseAgreement
    parent: null
    common_fields: true
    fields:
      - name: option_agreement_id
        type: string
        source: system
        description: "FK -> OptionAgreement.id; the exercised option that minted this lease"
      - name: parcel_id
        type: string
        source: system
        description: "FK -> Parcel.id; copied from the exercised option"
      - name: landowner_id
        type: string
        source: system
        description: "FK -> Landowner.id; copied from the exercised option"
      - name: exercise_notice_reference
        type: string
        source: input
        description: "Developer's exercise-notice document reference, supplied on the exercise call"
        constraints: "1..60 chars, non-blank"
      - name: term_start_date
        type: datetime
        source: computed
        description: "Logical-clock instant of the exercise call"
      - name: term_years
        type: integer
        source: computed
        description: "Fixed at LEASE_TERM_YEARS"
      - name: acre_basis_at_exercise
        type: number
        source: computed
        description: "Parcel.buildable_acres snapshot taken at exercise; drives decommissioning security"
      - name: gross_security_cents
        type: integer
        source: computed
        description: "Step 1 of calculation decommissioning_security_amount"
      - name: admin_rate_bps
        type: integer
        source: computed
        description: "Step 2 of calculation decommissioning_security_amount; tier keyed on gross_security_cents, never on the total"
      - name: admin_loading_cents
        type: integer
        source: computed
        description: "Step 3 of calculation decommissioning_security_amount"
      - name: total_security_required_cents
        type: integer
        source: computed
        description: "Step 4 of calculation decommissioning_security_amount: gross_security_cents plus admin_loading_cents"
      - name: security_posted_cents
        type: integer
        source: computed
        description: "Cumulative reclamation security posted through POST /leases/{leaseId}/post-security"
        default: 0
      - name: memo_submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the memorandum of lease was submitted for recording"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the county returned the recorded memorandum"
      - name: recording_instrument_no
        type: string
        source: system
        description: "County instrument number captured on the record-memo call"
      - name: last_paid_invoice_year
        type: integer
        source: computed
        description: "Highest period_year among this lease's RentInvoice rows with status == PAID; 0 when none"
        default: 0
      - name: rent_status
        type: enum
        source: system
        description: "Payment dimension of the lease, independent of recording_status"
        default: PENDING_FIRST_RENT
        constraints: "one of PENDING_FIRST_RENT, CURRENT, DELINQUENT"
      - name: recording_status
        type: enum
        source: system
        description: "Recording dimension of the lease, independent of rent_status"
        default: UNRECORDED
        constraints: "one of UNRECORDED, MEMO_SUBMITTED, RECORDED"

  # --------------------------------------------------------------- RentInvoice
  - name: RentInvoice
    parent: null
    common_fields: true
    fields:
      - name: lease_agreement_id
        type: string
        source: input
        description: "FK -> LeaseAgreement.id; the lease being invoiced"
      - name: period_year
        type: integer
        source: input
        description: "1-based lease year the invoice covers; unique per lease across RentInvoice rows with status IN {DRAFT, ISSUED, PAID}"
        constraints: ">= 1 and <= 35"
      - name: production_mwh
        type: number
        source: input
        description: "Metered net generation attributable to the parcel for the period"
        default: 0
        constraints: ">= 0, at most 2 decimal places"
      - name: rent_variant
        type: enum
        source: computed
        description: "Which variant of calculation annual_rent_amount produced this invoice, fixed at creation from LeaseAgreement.recording_status"
        constraints: "one of PROVISIONAL, FINAL_AS_BUILT"
      - name: acre_basis
        type: number
        source: computed
        description: "Acreage the per-acre component was computed on: Parcel.gross_acres under PROVISIONAL, Parcel.buildable_acres under FINAL_AS_BUILT"
      - name: per_acre_component_cents
        type: integer
        source: computed
        description: "Escalated per-acre rent component, rounded to whole cents before any comparison"
      - name: royalty_component_cents
        type: integer
        source: computed
        description: "Production royalty component, rounded to whole cents before any comparison; always 0 under PROVISIONAL"
      - name: gross_rent_cents
        type: integer
        source: computed
        description: "Invoice total from calculation annual_rent_amount"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of the DRAFT -> ISSUED transition"
      - name: due_at
        type: datetime
        source: computed
        description: "issued_at plus INVOICE_NET_DAYS days; null while DRAFT"
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock instant of the ISSUED -> PAID transition"
      - name: paid_amount_cents
        type: integer
        source: system
        description: "Amount recorded on the pay call; must equal gross_rent_cents"
      - name: void_reason
        type: string
        source: system
        description: "Reason recorded on the void call; null unless VOID"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, PAID, VOID"

# =============================================================================
# §1.2 State Machine Table
#
# Named cascade procedures referenced from side_effects below. Each is a single
# deterministic routine; every invocation refreshes updated_at and increments
# version on each row it touches.
#
#   RECOMPUTE_PARCEL_ACREAGE(p)
#     Runs calculation buildable_acres_derivation for parcel p and writes
#     slope_excluded_acres, raw_setback_acres, consent_released_acres,
#     setback_encumbered_acres, buildable_acres. Also writes released_acres on
#     every NeighborConsent row of p (the rule's share while GRANTED, 0.00 in
#     every other status).
#
#   RECOMPUTE_PARCEL_SCREENING(p)
#     Runs calculation parcel_screening_score for parcel p under the variant
#     named by p.screen_mode and writes screening_score and screening_tier.
#
#   REEVALUATE_PARCEL_QUALIFICATION(p)
#     If p.status == SCREENING and p.buildable_acres >= MIN_BUILDABLE_ACRES and
#     p.screening_tier IN {PRIORITY, STANDARD} and
#     p.blocking_curative_open_count == 0  -> SCREENING -> QUALIFIED.
#     If p.status == QUALIFIED and (p.buildable_acres < MIN_BUILDABLE_ACRES or
#     p.screening_tier IN {DEFERRED, REJECTED} or
#     p.blocking_curative_open_count > 0)  -> QUALIFIED -> SCREENING.
#     Never fires when p.status IN {DISQUALIFIED, OPTIONED, LEASED}.
#
#   LANDOWNER_POSTURE_SYNC(l)
#     Recomputes Landowner l.status from its owned rows, evaluated in this fixed
#     order and stopping at the first match:
#       UNDER_LEASE  if l owns >= 1 LeaseAgreement with recording_status == RECORDED
#       UNDER_OPTION if l owns >= 1 OptionAgreement with status IN {EXECUTED, EXERCISED}
#       ENGAGED      if l owns >= 1 Parcel with status IN {QUALIFIED, OPTIONED, LEASED}
#       PROSPECT     otherwise
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Landowner
  - entity: Landowner
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: ENGAGED
        trigger: "system: LANDOWNER_POSTURE_SYNC after one of the landowner's Parcels enters QUALIFIED"
        actor: system
        preconditions: ["landowner owns >= 1 Parcel with status IN {QUALIFIED, OPTIONED, LEASED}"]
        side_effects: ["Landowner.status = ENGAGED", "Landowner.updated_at refreshed, Landowner.version incremented by 1"]
      - from: ENGAGED
        to: UNDER_OPTION
        trigger: "system: LANDOWNER_POSTURE_SYNC after POST /land-origination/option-agreements/{optionId}/execute"
        actor: system
        preconditions: ["landowner owns >= 1 OptionAgreement with status IN {EXECUTED, EXERCISED}"]
        side_effects: ["Landowner.status = UNDER_OPTION", "Landowner.version incremented by 1"]
      - from: UNDER_OPTION
        to: UNDER_LEASE
        trigger: "system: LANDOWNER_POSTURE_SYNC after POST /land-origination/leases/{leaseId}/record-memo"
        actor: system
        preconditions: ["landowner owns >= 1 LeaseAgreement with recording_status == RECORDED"]
        side_effects: ["Landowner.status = UNDER_LEASE", "Landowner.version incremented by 1"]
      - from: UNDER_OPTION
        to: ENGAGED
        trigger: "system: LANDOWNER_POSTURE_SYNC after the owning OptionAgreement leaves EXECUTED for EXPIRED or WITHDRAWN"
        actor: system
        preconditions:
          - "landowner owns 0 OptionAgreement with status IN {EXECUTED, EXERCISED}"
          - "landowner owns 0 LeaseAgreement with recording_status == RECORDED"
          - "landowner owns >= 1 Parcel with status IN {QUALIFIED, OPTIONED, LEASED}"
        side_effects: ["Landowner.status = ENGAGED", "Landowner.version incremented by 1"]
        note: "Compensating direction of the ENGAGED -> UNDER_OPTION hop; leaves total_paid_cents untouched."
      - from: ENGAGED
        to: PROSPECT
        trigger: "system: LANDOWNER_POSTURE_SYNC after the last QUALIFIED Parcel reverts to SCREENING"
        actor: system
        preconditions: ["landowner owns 0 Parcel with status IN {QUALIFIED, OPTIONED, LEASED}"]
        side_effects: ["Landowner.status = PROSPECT", "Landowner.version incremented by 1"]

  # ------------------------------------------------------------------- Parcel
  - entity: Parcel
    initial_state: SCREENING
    terminal_states: [DISQUALIFIED, LEASED]
    transitions:
      - from: SCREENING
        to: QUALIFIED
        trigger: "POST /land-origination/parcels/{parcelId}/rescreen, or system: REEVALUATE_PARCEL_QUALIFICATION invoked from a NeighborConsent grant or a TitleCurativeItem clear/waive cascade"
        actor: LandAgent | system
        preconditions:
          - "Parcel.buildable_acres >= MIN_BUILDABLE_ACRES (80.00), evaluated with >= so exactly 80.00 qualifies"
          - "Parcel.screening_tier IN {PRIORITY, STANDARD}"
          - "Parcel.blocking_curative_open_count == 0"
        side_effects:
          - "Parcel.status = QUALIFIED"
          - "LANDOWNER_POSTURE_SYNC(Parcel.landowner_id) -> may advance Landowner PROSPECT -> ENGAGED"
      - from: SCREENING
        to: DISQUALIFIED
        trigger: "POST /land-origination/parcels/{parcelId}/rescreen"
        actor: LandAgent
        preconditions: ["Parcel.screening_tier == REJECTED after RECOMPUTE_PARCEL_SCREENING"]
        side_effects:
          - "Parcel.status = DISQUALIFIED"
          - "no cascade to Landowner: a DISQUALIFIED parcel does not count toward ENGAGED"
        note: "Terminal. A DISQUALIFIED parcel can never be optioned even if later curative work would raise its tier."
      - from: QUALIFIED
        to: SCREENING
        trigger: "system: REEVALUATE_PARCEL_QUALIFICATION invoked from POST /land-origination/neighbor-consents/{consentId}/revoke or from a newly created BLOCKING TitleCurativeItem"
        actor: system
        preconditions: ["Parcel.buildable_acres < MIN_BUILDABLE_ACRES or Parcel.screening_tier IN {DEFERRED, REJECTED} or Parcel.blocking_curative_open_count > 0"]
        side_effects:
          - "Parcel.status = SCREENING"
          - "LANDOWNER_POSTURE_SYNC(Parcel.landowner_id) -> may revert Landowner ENGAGED -> PROSPECT"
        note: "Reverse edge of SCREENING -> QUALIFIED; makes the Parcel machine cyclic."
      - from: QUALIFIED
        to: OPTIONED
        trigger: "POST /land-origination/option-agreements/{optionId}/execute"
        actor: PortfolioManager
        preconditions: ["the executing OptionAgreement.parcel_id == this Parcel.id", "Parcel.status == QUALIFIED"]
        side_effects:
          - "Parcel.status = OPTIONED"
          - "LANDOWNER_POSTURE_SYNC(Parcel.landowner_id) -> Landowner ENGAGED -> UNDER_OPTION"
      - from: OPTIONED
        to: QUALIFIED
        trigger: "POST /land-origination/option-agreements/{optionId}/withdraw, or system: option-expiry sweep inside POST /_clock/set_current_utc"
        actor: LandAgent | system
        preconditions: ["the owning OptionAgreement leaves EXECUTED for WITHDRAWN or EXPIRED", "Parcel.status == OPTIONED"]
        side_effects:
          - "Parcel.status = QUALIFIED"
          - "LANDOWNER_POSTURE_SYNC(Parcel.landowner_id) -> Landowner UNDER_OPTION -> ENGAGED"
        note: "Compensating edge: releases the parcel without touching acreage or screening fields."
      - from: OPTIONED
        to: LEASED
        trigger: "POST /land-origination/leases/{leaseId}/record-memo"
        actor: PortfolioManager
        preconditions: ["the recording LeaseAgreement.parcel_id == this Parcel.id", "LeaseAgreement.recording_status transitions MEMO_SUBMITTED -> RECORDED"]
        side_effects:
          - "Parcel.status = LEASED"
          - "LANDOWNER_POSTURE_SYNC(Parcel.landowner_id) -> Landowner UNDER_OPTION -> UNDER_LEASE"
        note: "Terminal for the Parcel machine."

  # ------------------------------------------------------------ NeighborConsent
  - entity: NeighborConsent
    initial_state: REQUESTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /land-origination/neighbor-consents/{consentId}/grant"
        actor: LandAgent
        preconditions:
          - "NeighborConsent.status == REQUESTED"
          - "current logical clock < NeighborConsent.consent_expiry_at (equality lapses: at exactly consent_expiry_at the request is EXPIRED, not grantable)"
          - "Parcel.status NOT IN {DISQUALIFIED, LEASED}"
        side_effects:
          - "NeighborConsent.status = GRANTED, granted_at = current logical clock"
          - "cascade hop 1 -> RECOMPUTE_PARCEL_ACREAGE(parcel_id): consent_released_acres rises, setback_encumbered_acres falls, buildable_acres rises"
          - "cascade hop 2 -> because buildable_acres changed, REEVALUATE_PARCEL_QUALIFICATION(parcel_id) runs"
          - "cascade hop 3 -> if that promotes the Parcel to QUALIFIED, LANDOWNER_POSTURE_SYNC(Parcel.landowner_id) runs"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /land-origination/neighbor-consents/{consentId}/revoke"
        actor: LandAgent
        preconditions: ["NeighborConsent.status == GRANTED", "Parcel.status NOT IN {LEASED}"]
        side_effects:
          - "NeighborConsent.status = REVOKED, revoked_at = current logical clock, released_acres reset to 0.00"
          - "cascade hop 1 -> RECOMPUTE_PARCEL_ACREAGE(parcel_id) restores setback_encumbered_acres and buildable_acres to the exact values they held before the grant (acreage conservation invariant)"
          - "cascade hop 2 -> REEVALUATE_PARCEL_QUALIFICATION(parcel_id) may revert Parcel QUALIFIED -> SCREENING"
          - "cascade hop 3 -> LANDOWNER_POSTURE_SYNC(Parcel.landowner_id) may revert Landowner ENGAGED -> PROSPECT"
        note: "Exact compensating action for REQUESTED -> GRANTED."
      - from: REQUESTED
        to: EXPIRED
        trigger: "system: consent-expiry sweep S2 inside POST /_clock/set_current_utc"
        actor: system
        preconditions: ["NeighborConsent.status == REQUESTED", "NeighborConsent.consent_expiry_at <= the new logical clock value"]
        side_effects: ["NeighborConsent.status = EXPIRED", "no acreage recompute: an ungranted consent never released acres"]

  # -------------------------------------------------------- TitleCurativeItem
  - entity: TitleCurativeItem
    initial_state: OPEN
    terminal_states: [CLEARED, WAIVED]
    transitions:
      - from: BLOCKED
        to: OPEN
        trigger: "system: successor promotion after the predecessor named by blocks_item_id reaches CLEARED or WAIVED"
        actor: system
        preconditions: ["TitleCurativeItem.status == BLOCKED", "the row named by blocks_item_id has status IN {CLEARED, WAIVED}"]
        side_effects:
          - "TitleCurativeItem.status = OPEN"
          - "successors are promoted in created_at ASC order"
      - from: OPEN
        to: CLEARED
        trigger: "POST /land-origination/title-curative-items/{itemId}/clear"
        actor: TitleCounsel
        preconditions:
          - "TitleCurativeItem.status == OPEN (a BLOCKED item is rejected with ERR_CURATIVE_BLOCKED_PREDECESSOR)"
          - "X-User-ID != TitleCurativeItem.created_by_user_id (segregation of duties)"
          - "Parcel.status != DISQUALIFIED"
        side_effects:
          - "cascade hop 1 -> status = CLEARED, cleared_at and cleared_by_user_id set; Parcel.curative_cost_cents += this row's curative_cost_cents"
          - "cascade hop 2 -> because this row reached CLEARED, every TitleCurativeItem with blocks_item_id == this id and status == BLOCKED transitions BLOCKED -> OPEN"
          - "cascade hop 3 -> because those successor statuses changed, Parcel.blocking_curative_open_count is recomputed"
          - "cascade hop 4 -> because blocking_curative_open_count changed, RECOMPUTE_PARCEL_SCREENING(parcel_id) reruns under Parcel.screen_mode, then REEVALUATE_PARCEL_QUALIFICATION(parcel_id) runs, which may itself run LANDOWNER_POSTURE_SYNC"
      - from: OPEN
        to: WAIVED
        trigger: "POST /land-origination/title-curative-items/{itemId}/waive"
        actor: TitleCounsel
        preconditions:
          - "TitleCurativeItem.status == OPEN"
          - "X-User-ID != TitleCurativeItem.created_by_user_id (segregation of duties)"
          - "if severity == BLOCKING then Parcel.waived_blocking_count < MAX_WAIVED_BLOCKING_PER_PARCEL (1)"
        side_effects:
          - "status = WAIVED, waiver_note set; Parcel.curative_cost_cents is NOT changed (divergent from the CLEARED branch)"
          - "cascade hop 2 -> successors with blocks_item_id == this id and status == BLOCKED transition BLOCKED -> OPEN"
          - "cascade hop 3 -> Parcel.blocking_curative_open_count and Parcel.waived_blocking_count recomputed"
          - "cascade hop 4 -> RECOMPUTE_PARCEL_SCREENING(parcel_id) then REEVALUATE_PARCEL_QUALIFICATION(parcel_id)"
        note: "Branch sibling of OPEN -> CLEARED with a deliberately different side-effect set: no curative cost is capitalised and the waiver counter advances."

  # --------------------------------------------------------- OptionAgreement
  - entity: OptionAgreement
    initial_state: DRAFT
    terminal_states: [EXERCISED, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /land-origination/option-agreements/{optionId}/send"
        actor: LandAgent
        preconditions:
          - "OptionAgreement.status IN {DRAFT, REVISED}"
          - "Parcel.status == QUALIFIED"
        side_effects: ["OptionAgreement.status = SENT"]
      - from: REVISED
        to: SENT
        trigger: "POST /land-origination/option-agreements/{optionId}/send"
        actor: LandAgent
        preconditions: ["OptionAgreement.status == REVISED", "Parcel.status == QUALIFIED"]
        side_effects: ["OptionAgreement.status = SENT"]
        note: "Closes the negotiation cycle SENT -> COUNTERED -> REVISED -> SENT."
      - from: SENT
        to: COUNTERED
        trigger: "POST /land-origination/option-agreements/{optionId}/counter"
        actor: Landowner
        preconditions:
          - "OptionAgreement.status == SENT"
          - "X-User-ID == OptionAgreement.landowner_id"
          - "OptionAgreement.round_index < MAX_NEGOTIATION_ROUNDS (3)"
        side_effects:
          - "OptionAgreement.status = COUNTERED, round_index incremented by 1"
          - "every term field supplied in the request overwrites the agreement's corresponding field immediately (option_fee_per_acre_cents, extension_fee_per_acre_cents, base_rent_per_acre_cents, royalty_rate_bps, escalator_pct_bps, escalator_mode, option_term_days); omitted fields keep their current value"
      - from: COUNTERED
        to: REVISED
        trigger: "POST /land-origination/option-agreements/{optionId}/revise"
        actor: LandAgent
        preconditions: ["OptionAgreement.status == COUNTERED"]
        side_effects:
          - "OptionAgreement.status = REVISED"
          - "supplied term fields overwrite option_fee_per_acre_cents, extension_fee_per_acre_cents, base_rent_per_acre_cents, royalty_rate_bps, escalator_pct_bps, escalator_mode, option_term_days and rent_structure_type; omitted fields keep their current value"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /land-origination/option-agreements/{optionId}/accept"
        actor: Landowner
        preconditions: ["OptionAgreement.status == SENT", "X-User-ID == OptionAgreement.landowner_id"]
        side_effects: ["OptionAgreement.status = ACCEPTED"]
      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /land-origination/option-agreements/{optionId}/execute"
        actor: PortfolioManager
        preconditions:
          - "OptionAgreement.status == ACCEPTED"
          - "Parcel.status == QUALIFIED"
          - "Landowner.payment_hold == false"
        side_effects:
          - "OptionAgreement.status = EXECUTED, executed_at = current logical clock, executed_by_user_id = X-User-ID"
          - "option_expiry_at = executed_at + option_term_days days"
          - "one OptionPayment row inserted: payment_kind = INITIAL_OPTION_FEE, ledger_direction = DEBIT_DEVELOPER, amount_cents from calculation option_fee_schedule, acres_basis = Parcel.gross_acres, sequence_no = 1"
          - "OptionAgreement.total_option_paid_cents recomputed"
          - "Landowner.total_paid_cents recomputed by calculation landowner_paid_ledger"
          - "Parcel QUALIFIED -> OPTIONED"
          - "LANDOWNER_POSTURE_SYNC(landowner_id) -> ENGAGED -> UNDER_OPTION"
      - from: EXECUTED
        to: EXECUTED
        trigger: "POST /land-origination/option-agreements/{optionId}/extend"
        actor: PortfolioManager
        preconditions:
          - "OptionAgreement.status == EXECUTED"
          - "OptionAgreement.extensions_used < extension_count_allowed"
          - "Landowner.payment_hold == false"
        side_effects:
          - "extensions_used incremented by 1"
          - "option_expiry_at += EXTENSION_TERM_DAYS (180) days"
          - "one OptionPayment row inserted: payment_kind = EXTENSION_FEE, ledger_direction = DEBIT_DEVELOPER, amount_cents from calculation option_fee_schedule for this extension index"
          - "OptionAgreement.total_option_paid_cents and Landowner.total_paid_cents recomputed"
        note: "Self-loop on EXECUTED; the extension index makes each traversal charge a different amount."
      - from: EXECUTED
        to: EXERCISED
        trigger: "POST /land-origination/option-agreements/{optionId}/exercise"
        actor: PortfolioManager
        preconditions:
          - "OptionAgreement.status == EXECUTED"
          - "current logical clock < OptionAgreement.option_expiry_at"
          - "X-User-ID != OptionAgreement.executed_by_user_id (segregation of duties)"
          - "Parcel.status == OPTIONED"
          - "Parcel.blocking_curative_open_count == 0"
          - "Parcel.buildable_acres >= MIN_BUILDABLE_ACRES (80.00)"
          - "Landowner.payment_hold == false"
        side_effects:
          - "OptionAgreement.status = EXERCISED, exercised_at = current logical clock"
          - "one LeaseAgreement row created with rent_status = PENDING_FIRST_RENT, recording_status = UNRECORDED, term_start_date = exercised_at, term_years = LEASE_TERM_YEARS (35), acre_basis_at_exercise = Parcel.buildable_acres"
          - "calculation decommissioning_security_amount writes gross_security_cents, admin_rate_bps, admin_loading_cents and total_security_required_cents on the new lease"
          - "Parcel.status stays OPTIONED until the memorandum is recorded"
      - from: EXECUTED
        to: EXPIRED
        trigger: "system: option-expiry sweep S1 inside POST /_clock/set_current_utc"
        actor: system
        preconditions: ["OptionAgreement.status == EXECUTED", "OptionAgreement.option_expiry_at <= the new logical clock value"]
        side_effects:
          - "cascade hop 1 -> OptionAgreement.status = EXPIRED"
          - "cascade hop 2 -> Parcel OPTIONED -> QUALIFIED"
          - "cascade hop 3 -> LANDOWNER_POSTURE_SYNC(landowner_id) -> UNDER_OPTION -> ENGAGED"
          - "OptionPayment rows are never reversed by expiry: total_paid_cents is unchanged"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /land-origination/option-agreements/{optionId}/withdraw"
        actor: LandAgent
        preconditions: ["OptionAgreement.status == DRAFT"]
        side_effects: ["OptionAgreement.status = WITHDRAWN, withdraw_reason recorded"]
      - from: SENT
        to: WITHDRAWN
        trigger: "POST /land-origination/option-agreements/{optionId}/withdraw"
        actor: LandAgent
        preconditions: ["OptionAgreement.status == SENT"]
        side_effects: ["OptionAgreement.status = WITHDRAWN, withdraw_reason recorded"]
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /land-origination/option-agreements/{optionId}/withdraw"
        actor: LandAgent
        preconditions: ["OptionAgreement.status == COUNTERED"]
        side_effects: ["OptionAgreement.status = WITHDRAWN, withdraw_reason recorded"]
      - from: REVISED
        to: WITHDRAWN
        trigger: "POST /land-origination/option-agreements/{optionId}/withdraw"
        actor: LandAgent
        preconditions: ["OptionAgreement.status == REVISED"]
        side_effects: ["OptionAgreement.status = WITHDRAWN, withdraw_reason recorded"]
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /land-origination/option-agreements/{optionId}/withdraw"
        actor: LandAgent
        preconditions: ["OptionAgreement.status == ACCEPTED"]
        side_effects: ["OptionAgreement.status = WITHDRAWN, withdraw_reason recorded"]
      - from: EXECUTED
        to: WITHDRAWN
        trigger: "POST /land-origination/option-agreements/{optionId}/withdraw"
        actor: LandAgent
        preconditions: ["OptionAgreement.status == EXECUTED"]
        side_effects:
          - "OptionAgreement.status = WITHDRAWN, withdraw_reason recorded"
          - "if refund_extension_fees == true and extensions_used > 0: one OptionPayment row inserted with payment_kind = REFUND_REVERSAL, ledger_direction = CREDIT_DEVELOPER, amount_cents = sum of this agreement's EXTENSION_FEE rows, acres_basis = 0.00"
          - "OptionAgreement.total_option_paid_cents and Landowner.total_paid_cents recomputed: the ledger returns to exactly its post-execution value (option-payment conservation invariant)"
          - "Parcel OPTIONED -> QUALIFIED"
          - "LANDOWNER_POSTURE_SYNC(landowner_id) -> UNDER_OPTION -> ENGAGED"
        note: "Compensating action for ACCEPTED -> EXECUTED plus every EXECUTED self-loop extension."

  # ----------------------------------------------------------------- Corridor
  - entity: Corridor
    initial_state: PLANNED
    terminal_states: [PERMITTED]
    transitions:
      - from: PLANNED
        to: PERMITTED
        trigger: "POST /land-origination/corridors/{corridorId}/permit"
        actor: PortfolioManager
        preconditions: ["Corridor.status == PLANNED"]
        side_effects: ["Corridor.status = PERMITTED, permitted_at = current logical clock"]

  # -------------------------------------------------------- CrossingAgreement
  - entity: CrossingAgreement
    initial_state: PROPOSED
    terminal_states: [GRANTED]
    transitions:
      - from: PROPOSED
        to: GRANTED
        trigger: "POST /land-origination/crossing-agreements/{crossingId}/grant"
        actor: PortfolioManager
        preconditions:
          - "CrossingAgreement.status == PROPOSED"
          - "Corridor.status == PERMITTED (cross-entity gate; a PLANNED corridor yields ERR_CORRIDOR_NOT_PERMITTED)"
        side_effects:
          - "CrossingAgreement.status = GRANTED, granted_at = current logical clock"
          - "Corridor.granted_crossing_count recomputed"

  # -------------------------------------------------------- SiteAccessBooking
  - entity: SiteAccessBooking
    initial_state: BOOKED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /land-origination/site-access-bookings/{bookingId}/cancel"
        actor: LandAgent
        preconditions: ["SiteAccessBooking.status == BOOKED"]
        side_effects:
          - "SiteAccessBooking.status = CANCELLED, cancelled_at = current logical clock"
          - "the booking's crew_count stops counting against PARCEL_MAX_CONCURRENT_CREWS for every overlapping window (crew-capacity conservation invariant)"
      - from: BOOKED
        to: COMPLETED
        trigger: "system: booking-completion sweep S3 inside POST /_clock/set_current_utc"
        actor: system
        preconditions: ["SiteAccessBooking.status == BOOKED", "SiteAccessBooking.window_end <= the new logical clock value"]
        side_effects:
          - "SiteAccessBooking.status = COMPLETED"
          - "the booking's crew_count stops counting against PARCEL_MAX_CONCURRENT_CREWS"

  # --------------------------------------------- LeaseAgreement (dimension 1)
  - entity: LeaseAgreement
    state_dimension: rent_status
    initial_state: PENDING_FIRST_RENT
    terminal_states: []
    note: "Independent of the recording_status dimension below: a lease can reach CURRENT while still UNRECORDED, and can be RECORDED while still PENDING_FIRST_RENT."
    transitions:
      - from: PENDING_FIRST_RENT
        to: CURRENT
        trigger: "POST /land-origination/rent-invoices/{invoiceId}/pay"
        actor: PaymentAdministrator
        preconditions: ["the paid RentInvoice belongs to this lease", "RentInvoice.status transitions ISSUED -> PAID"]
        side_effects: ["LeaseAgreement.rent_status = CURRENT", "LeaseAgreement.last_paid_invoice_year recomputed"]
      - from: CURRENT
        to: DELINQUENT
        trigger: "system: delinquency sweep S4 inside POST /_clock/set_current_utc"
        actor: system
        preconditions: ["LeaseAgreement.rent_status IN {PENDING_FIRST_RENT, CURRENT}", "the lease has >= 1 RentInvoice with status == ISSUED and due_at <= the new logical clock value"]
        side_effects: ["LeaseAgreement.rent_status = DELINQUENT"]
      - from: PENDING_FIRST_RENT
        to: DELINQUENT
        trigger: "system: delinquency sweep S4 inside POST /_clock/set_current_utc"
        actor: system
        preconditions: ["LeaseAgreement.rent_status == PENDING_FIRST_RENT", "the lease has >= 1 RentInvoice with status == ISSUED and due_at <= the new logical clock value"]
        side_effects: ["LeaseAgreement.rent_status = DELINQUENT"]
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /land-origination/rent-invoices/{invoiceId}/pay"
        actor: PaymentAdministrator
        preconditions: ["after the payment the lease has 0 RentInvoice rows with status == ISSUED and due_at <= the current logical clock"]
        side_effects: ["LeaseAgreement.rent_status = CURRENT", "LeaseAgreement.last_paid_invoice_year recomputed"]
        note: "Reverse edge of CURRENT -> DELINQUENT; makes the rent dimension cyclic."

  # --------------------------------------------- LeaseAgreement (dimension 2)
  - entity: LeaseAgreement
    state_dimension: recording_status
    initial_state: UNRECORDED
    terminal_states: [RECORDED]
    transitions:
      - from: UNRECORDED
        to: MEMO_SUBMITTED
        trigger: "POST /land-origination/leases/{leaseId}/submit-memo"
        actor: PortfolioManager
        preconditions:
          - "LeaseAgreement.recording_status == UNRECORDED"
          - "LeaseAgreement.security_posted_cents == LeaseAgreement.total_security_required_cents"
          - "Parcel.blocking_curative_open_count == 0"
        side_effects: ["LeaseAgreement.recording_status = MEMO_SUBMITTED, memo_submitted_at = current logical clock"]
      - from: MEMO_SUBMITTED
        to: RECORDED
        trigger: "POST /land-origination/leases/{leaseId}/record-memo"
        actor: PortfolioManager
        preconditions:
          - "LeaseAgreement.recording_status == MEMO_SUBMITTED"
          - "Landowner.w9_on_file == true (cross-entity gate)"
        side_effects:
          - "cascade hop 1 -> recording_status = RECORDED, recorded_at set, recording_instrument_no stored"
          - "cascade hop 2 -> Parcel OPTIONED -> LEASED"
          - "cascade hop 3 -> LANDOWNER_POSTURE_SYNC(landowner_id) -> UNDER_OPTION -> UNDER_LEASE"

  # --------------------------------------------------------------- RentInvoice
  - entity: RentInvoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /land-origination/rent-invoices/{invoiceId}/issue"
        actor: PaymentAdministrator
        preconditions: ["RentInvoice.status == DRAFT"]
        side_effects: ["RentInvoice.status = ISSUED, issued_at = current logical clock, due_at = issued_at + INVOICE_NET_DAYS (45) days"]
      - from: ISSUED
        to: PAID
        trigger: "POST /land-origination/rent-invoices/{invoiceId}/pay"
        actor: PaymentAdministrator
        preconditions:
          - "RentInvoice.status == ISSUED"
          - "paid_amount_cents in the request == RentInvoice.gross_rent_cents"
          - "Landowner.payment_hold == false"
        side_effects:
          - "RentInvoice.status = PAID, paid_at = current logical clock, paid_amount_cents stored"
          - "LeaseAgreement.last_paid_invoice_year recomputed"
          - "LeaseAgreement rent dimension advances to CURRENT when no ISSUED invoice remains past due"
      - from: DRAFT
        to: VOID
        trigger: "POST /land-origination/rent-invoices/{invoiceId}/void"
        actor: PaymentAdministrator
        preconditions: ["RentInvoice.status == DRAFT"]
        side_effects:
          - "RentInvoice.status = VOID, void_reason recorded"
          - "the (lease_agreement_id, period_year) pair is freed so a replacement invoice may be created"
      - from: ISSUED
        to: VOID
        trigger: "POST /land-origination/rent-invoices/{invoiceId}/void"
        actor: PaymentAdministrator
        preconditions: ["RentInvoice.status == ISSUED"]
        side_effects:
          - "RentInvoice.status = VOID, void_reason recorded"
          - "the (lease_agreement_id, period_year) pair is freed so a replacement invoice may be created"
          - "the voided invoice stops counting toward the S4 delinquency sweep"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: option-create-stale-parcel
    parent_entity: Parcel
    write_endpoint: "POST /land-origination/option-agreements"
    occ_field: "expected_parcel_version"
    description: |
      Creating an OptionAgreement against a Parcel whose version has advanced
      since the client last observed it is rejected. A parcel may legitimately
      carry a newer DRAFT option that supersedes an older one, and a parcel's
      acreage, screening tier and curative counters all move under cascade, so
      the option terms a client computed against a stale parcel snapshot are no
      longer the terms the product intends to book. The check compares the
      supplied expected_parcel_version against the stored Parcel.version.
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-lease
    parent_entity: LeaseAgreement
    write_endpoint: "POST /land-origination/leases/{leaseId}/rent-invoices"
    occ_field: "expected_lease_agreement_version"
    description: |
      Creating a RentInvoice against a LeaseAgreement whose version has advanced
      since the client last observed it is rejected. A replacement invoice for a
      period whose prior invoice was voided legitimately supersedes it, and the
      variant the invoice is computed under (PROVISIONAL vs FINAL_AS_BUILT) is
      read from LeaseAgreement.recording_status at creation, so a stale lease
      snapshot would silently bill the wrong variant. The check compares the
      supplied expected_lease_agreement_version against the stored
      LeaseAgreement.version.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Global precision rules, applied everywhere unless a calculation overrides:
#   * acreage values: 2 decimal places, round_half_up
#   * money values:   whole integer cents, round_half_up
#   * scores:         2 decimal places, round_half_up
#   * No calculation, selector, ordering or tie-break in this scaffold reads any
#     entity's `id`. Every order-sensitive step sorts by created_at ASC.
# =============================================================================
calculations:

  # ---------------------------------------------------------------- (dual variant)
  - name: parcel_screening_score
    trigger: "RECOMPUTE_PARCEL_SCREENING(p): on POST /land-origination/parcels (creation), on POST /land-origination/parcels/{parcelId}/rescreen, and as cascade hop 4 of the TitleCurativeItem OPEN -> CLEARED and OPEN -> WAIVED transitions. Writes Parcel.screening_score, Parcel.screening_tier and Parcel.screen_mode."
    algorithm: weighted_scoring
    formula: |
      # --- four sub-scores, each on a 0..100 scale -------------------------
      interconnect_sub = clamp(100 - 8 * interconnection_distance_km, 0, 100)
      resource_sub     = round_half_up(resource_capacity_factor * 250, 2)
      buildability_sub = clamp(100 - 4 * slope_pct, 0, 100)

      # --- title sub-score depends on the VARIANT (see variants below) -----
      effective_grade  = <per variant>
      title_sub        = TITLE_GRADE_POINTS[effective_grade]

      # --- weighted sum, single rounding at the end ------------------------
      screening_score = round_half_up(
            W_INTERCONNECT  * interconnect_sub
          + W_RESOURCE      * resource_sub
          + W_BUILDABILITY  * buildability_sub
          + W_TITLE         * title_sub, 2)

      # --- tier is a threshold ladder evaluated top-down, all >= ----------
      screening_tier =
          PRIORITY  if screening_score >= TIER_PRIORITY_MIN   (82.00)
          STANDARD  if screening_score >= TIER_STANDARD_MIN   (65.00)
          DEFERRED  if screening_score >= TIER_DEFERRED_MIN   (45.00)
          REJECTED  otherwise
    input_set: |
      Only the Parcel's own input fields plus, under the FIELD_VERIFIED variant,
      the count of TitleCurativeItem rows on that parcel with
      severity == BLOCKING and status IN {BLOCKED, OPEN}
      (Parcel.blocking_curative_open_count). Rows with status IN {CLEARED, WAIVED}
      and rows with severity IN {MATERIAL, ADVISORY} are excluded.
    constants:
      W_INTERCONNECT: 0.30
      W_RESOURCE: 0.25
      W_BUILDABILITY: 0.20
      W_TITLE: 0.25
      TITLE_GRADE_POINTS: { A: 100, B: 80, C: 55, D: 20 }
      GRADE_LADDER: [A, B, C, D]
      TIER_PRIORITY_MIN: 82.00
      TIER_STANDARD_MIN: 65.00
      TIER_DEFERRED_MIN: 45.00
      INTERCONNECT_PENALTY_PER_KM: 8
      RESOURCE_SCALE: 250
      SLOPE_PENALTY_PER_PCT: 4
    precision: "sub-scores 2 decimal places, final screening_score 2 decimal places, round_half_up"
    variants:
      - name: DESKTOP
        when: "Parcel creation, and POST /parcels/{parcelId}/rescreen called with screen_mode == DESKTOP. Sets Parcel.screen_mode = DESKTOP."
        difference: "effective_grade = Parcel.title_condition_grade exactly as reported by the desktop title report; open curative items are ignored entirely."
      - name: FIELD_VERIFIED
        when: "POST /parcels/{parcelId}/rescreen called with screen_mode == FIELD_VERIFIED, and every later cascade recompute while Parcel.screen_mode == FIELD_VERIFIED. Sets Parcel.screen_mode = FIELD_VERIFIED."
        difference: |
          effective_grade = GRADE_LADDER[min(index_of(title_condition_grade)
                            + blocking_curative_open_count, 3)] — one grade step
          down per BLOCKING item still in {BLOCKED, OPEN}, floored at D. The two
          variants therefore return different screening_score values and can land
          in different screening_tier bands for byte-identical parcel input.

  # ------------------------------------------------- (combinatorial, mode (a)+(b))
  - name: buildable_acres_derivation
    trigger: "RECOMPUTE_PARCEL_ACREAGE(p): on POST /land-origination/parcels (creation), on POST /land-origination/setback-rules whose jurisdiction_code matches an existing Parcel.county_fips, as cascade hop 1 of NeighborConsent REQUESTED -> GRANTED and GRANTED -> REVOKED, and on POST /land-origination/parcels/{parcelId}/rescreen. Writes Parcel.slope_excluded_acres, Parcel.raw_setback_acres, Parcel.consent_released_acres, Parcel.setback_encumbered_acres, Parcel.buildable_acres and NeighborConsent.released_acres."
    algorithm: constraint_propagation
    formula: |
      # --- step 1: slope exclusion, tiered on slope_pct --------------------
      slope_rate = 0.00  if slope_pct <= 5.0
                   0.10  if 5.0  < slope_pct <= 10.0
                   0.25  if 10.0 < slope_pct <= 15.0
                   0.50  if slope_pct > 15.0
      slope_excluded_acres = round_half_up(gross_acres * slope_rate, 2)

      # --- step 2: raw setback, ROUNDED PER RULE THEN SUMMED ---------------
      # Rounding order is pinned: each SetbackRule's contribution is rounded to
      # 2 decimals FIRST and the rounded contributions are then summed. Summing
      # the rates first and rounding once is WRONG and produces a different
      # answer (e.g. gross_acres 15.00 with rates 0.0550 and 0.0750 gives 1.96
      # under the pinned order and 1.95 under sum-then-round).
      raw_setback_acres = SUM over r in APPLICABLE_RULES, in created_at ASC order,
                            of round_half_up(gross_acres * r.encumbrance_rate_per_acre, 2)

      # --- step 3: consent release, also rounded per consent then summed ---
      consent_released_acres = SUM over c in RELEASING_CONSENTS, in created_at ASC order,
                            of round_half_up(gross_acres
                                             * rule_of(c).encumbrance_rate_per_acre
                                             * CONSENT_RELEASE_FRACTION, 2)
      # each such c also gets NeighborConsent.released_acres = its own rounded term;
      # every non-releasing consent gets released_acres = 0.00

      # --- step 4: nested floors ------------------------------------------
      setback_encumbered_acres = max(0.00,
                                     round_half_up(raw_setback_acres - consent_released_acres, 2))
      buildable_acres          = max(0.00,
                                     round_half_up(gross_acres
                                                   - slope_excluded_acres
                                                   - setback_encumbered_acres, 2))

      # --- acreage conservation invariant ---------------------------------
      # Whenever buildable_acres > 0.00:
      #   gross_acres == buildable_acres + slope_excluded_acres + setback_encumbered_acres
    input_set: |
      APPLICABLE_RULES = every SetbackRule r with
        r.jurisdiction_code == Parcel.county_fips (no status filter: SetbackRule
        has no lifecycle), ordered by r.created_at ASC.
      RELEASING_CONSENTS = every NeighborConsent c with
        c.parcel_id == Parcel.id AND c.status == GRANTED AND
        rule_of(c).consent_waivable == true, ordered by c.created_at ASC.
        Consents in {REQUESTED, REVOKED, EXPIRED} and consents whose rule has
        consent_waivable == false release nothing.
    constants:
      CONSENT_RELEASE_FRACTION: 0.80
      SLOPE_TIER_BREAKS: [5.0, 10.0, 15.0]
      SLOPE_TIER_RATES: [0.00, 0.10, 0.25, 0.50]
      MIN_BUILDABLE_ACRES: 80.00
    precision: "2 decimal places, round_half_up, applied per term before summation"
    variants: []

  # -------------------------------------------------------- (step-up schedule)
  - name: option_fee_schedule
    trigger: "OptionAgreement ACCEPTED -> EXECUTED (INITIAL_OPTION_FEE row) and the EXECUTED -> EXECUTED extend self-loop (EXTENSION_FEE row). Writes OptionPayment.amount_cents and OptionPayment.acres_basis."
    algorithm: tiered_pricing
    formula: |
      # INITIAL_OPTION_FEE, minted once by the execute transition
      initial_option_fee_cents =
          round_half_up(option_fee_per_acre_cents * Parcel.gross_acres)

      # EXTENSION_FEE, minted by the n-th extend call where
      # n = OptionAgreement.extensions_used AFTER the increment (1-based)
      extension_fee_cents(n) =
          round_half_up(extension_fee_per_acre_cents * Parcel.gross_acres
                        * (1 + EXTENSION_STEP_UP_BPS / 10000) ** (n - 1))

      # REFUND_REVERSAL, minted by the EXECUTED -> WITHDRAWN transition when
      # refund_extension_fees == true
      refund_reversal_cents =
          SUM of amount_cents over this agreement's OptionPayment rows with
          payment_kind == EXTENSION_FEE, in created_at ASC order
    input_set: |
      Parcel.gross_acres is always the acreage basis for option fees — never
      buildable_acres. Only OptionPayment rows of the same
      option_agreement_id enter refund_reversal_cents; INITIAL_OPTION_FEE and
      earlier REFUND_REVERSAL rows are excluded.
    constants:
      EXTENSION_STEP_UP_BPS: 1500
      EXTENSION_TERM_DAYS: 180
    precision: "whole integer cents, round_half_up, applied once per ledger row"
    variants: []

  # ------------------------------------------------------------- (dual variant)
  - name: annual_rent_amount
    trigger: "POST /land-origination/leases/{leaseId}/rent-invoices. Writes RentInvoice.rent_variant, RentInvoice.acre_basis, RentInvoice.per_acre_component_cents, RentInvoice.royalty_component_cents and RentInvoice.gross_rent_cents."
    algorithm: tiered_pricing
    formula: |
      # --- component 1: escalated per-acre rent ---------------------------
      base_cents = round_half_up(OptionAgreement.base_rent_per_acre_cents * acre_basis)
      escalation_factor =
          (1 + escalator_pct_bps / 10000) ** (period_year - 1)   if escalator_mode == COMPOUND
          1 + (escalator_pct_bps / 10000) * (period_year - 1)     if escalator_mode == SIMPLE
      per_acre_component_cents = round_half_up(base_cents * escalation_factor)

      # --- component 2: production royalty --------------------------------
      royalty_component_cents = round_half_up(production_mwh
                                              * ROYALTY_PRICE_CENTS_PER_MWH
                                              * royalty_rate_bps / 10000)

      # --- combination: ROUND EACH COMPONENT FIRST, THEN COMPARE ----------
      # Rounding order is pinned. Both components are rounded to whole cents
      # BEFORE the greater-of comparison; comparing unrounded reals and rounding
      # the winner afterwards is WRONG.
      gross_rent_cents =
          per_acre_component_cents                                    if rent_structure_type == PER_ACRE
          max(per_acre_component_cents, royalty_component_cents)      if rent_structure_type == ROYALTY_HYBRID
    input_set: |
      Terms are read from the LeaseAgreement's originating OptionAgreement
      (base_rent_per_acre_cents, royalty_rate_bps, escalator_pct_bps,
      escalator_mode, rent_structure_type). acre_basis and the royalty treatment
      depend on the variant. production_mwh is the request value on the invoice
      being created; no other invoice's production enters the formula.
    constants:
      ROYALTY_PRICE_CENTS_PER_MWH: 4200
      LEASE_TERM_YEARS: 35
      INVOICE_NET_DAYS: 45
    precision: "whole integer cents, round_half_up, applied per component before the greater-of comparison"
    variants:
      - name: PROVISIONAL
        when: "LeaseAgreement.recording_status != RECORDED at the instant the invoice is created. RentInvoice.rent_variant = PROVISIONAL."
        difference: |
          acre_basis = Parcel.gross_acres (the deeded acreage), and
          royalty_component_cents is forced to 0 regardless of production_mwh
          and royalty_rate_bps, so gross_rent_cents == per_acre_component_cents
          even under ROYALTY_HYBRID.
      - name: FINAL_AS_BUILT
        when: "LeaseAgreement.recording_status == RECORDED at the instant the invoice is created. RentInvoice.rent_variant = FINAL_AS_BUILT."
        difference: |
          acre_basis = Parcel.buildable_acres (the as-built developable acreage),
          and royalty_component_cents is computed and enters the greater-of
          comparison. For identical lease terms and identical production the two
          variants return different gross_rent_cents.

  # ------------------------------------------- (combinatorial, mode (c): pinned order)
  - name: decommissioning_security_amount
    trigger: "OptionAgreement EXECUTED -> EXERCISED. Writes LeaseAgreement.gross_security_cents, LeaseAgreement.admin_rate_bps, LeaseAgreement.admin_loading_cents and LeaseAgreement.total_security_required_cents."
    algorithm: threshold
    formula: |
      # The definition LOOKS circular: the administrative loading is a rate on
      # the security amount, and the total security is the amount plus that
      # loading. The evaluation order below is PINNED so the value is
      # well-defined: the tier is keyed on gross_security_cents, NEVER on
      # total_security_required_cents.
      #
      # step 1
      gross_security_cents = round_half_up(SECURITY_PER_ACRE_CENTS
                                           * LeaseAgreement.acre_basis_at_exercise)
      # step 2 — tier ladder read top-down against GROSS, all comparisons >= / <
      admin_rate_bps = ADMIN_RATE_LOW_BPS   (600)  if gross_security_cents <  SECURITY_TIER_1_CENTS
                       ADMIN_RATE_MID_BPS   (450)  if SECURITY_TIER_1_CENTS <= gross_security_cents < SECURITY_TIER_2_CENTS
                       ADMIN_RATE_HIGH_BPS  (300)  if gross_security_cents >= SECURITY_TIER_2_CENTS
      # step 3
      admin_loading_cents = round_half_up(gross_security_cents * admin_rate_bps / 10000)
      # step 4
      total_security_required_cents = gross_security_cents + admin_loading_cents
      #
      # Consequence worth noting: because the rate falls as gross rises, the
      # total is NOT monotonic in acreage across a tier break. 99.99 buildable
      # acres requires 5,299,470 cents while 100.00 buildable acres requires
      # only 5,225,000 cents.
    input_set: |
      LeaseAgreement.acre_basis_at_exercise, which is the snapshot of
      Parcel.buildable_acres taken at the instant of the exercise call. Later
      changes to the parcel's acreage do not restate an existing lease's
      security requirement.
    constants:
      SECURITY_PER_ACRE_CENTS: 50000
      SECURITY_TIER_1_CENTS: 5000000
      SECURITY_TIER_2_CENTS: 15000000
      ADMIN_RATE_LOW_BPS: 600
      ADMIN_RATE_MID_BPS: 450
      ADMIN_RATE_HIGH_BPS: 300
    precision: "whole integer cents, round_half_up, applied once at step 1 and once at step 3"
    variants: []

  # ------------------------------------------------------------------ (ledger)
  - name: landowner_paid_ledger
    trigger: "Every OptionPayment insert — OptionAgreement ACCEPTED -> EXECUTED, the EXECUTED -> EXECUTED extend self-loop, and EXECUTED -> WITHDRAWN with refund_extension_fees == true. Writes Landowner.total_paid_cents and OptionAgreement.total_option_paid_cents."
    algorithm: aggregation
    formula: |
      # per agreement
      OptionAgreement.total_option_paid_cents =
            SUM(amount_cents where ledger_direction == DEBIT_DEVELOPER)
          - SUM(amount_cents where ledger_direction == CREDIT_DEVELOPER)
        over OptionPayment rows with option_agreement_id == this agreement,
        applied in created_at ASC, sequence_no ASC order.

      # per landowner
      Landowner.total_paid_cents =
            SUM over OptionAgreement a with a.landowner_id == this landowner
            of a.total_option_paid_cents
        # every agreement of the landowner contributes regardless of its status:
        # WITHDRAWN and EXPIRED agreements keep their unrefunded rows in the sum.

      # option-payment conservation invariant
      #   After EXECUTED -> WITHDRAWN with refund_extension_fees == true,
      #   Landowner.total_paid_cents equals exactly the value it held
      #   immediately after the ACCEPTED -> EXECUTED transition of the same
      #   agreement, for any number of intervening extensions.
    input_set: |
      Every OptionPayment row of every OptionAgreement of the landowner, with no
      status filter on the agreement. Rows are never deleted or mutated; a
      reversal is a new CREDIT_DEVELOPER row.
    constants: {}
    precision: "whole integer cents; no rounding occurs because every term is already an integer"
    variants: []

  # --------------------------------------------------- (tiered surcharge)
  - name: crossing_compensation
    trigger: "POST /land-origination/crossing-agreements. Writes CrossingAgreement.occupied_m, CrossingAgreement.duration_days, CrossingAgreement.long_occupancy_surcharge_bps and CrossingAgreement.compensation_cents."
    algorithm: tiered_pricing
    formula: |
      occupied_m    = station_end_m - station_start_m
      duration_days = ceil((occupancy_window_end - occupancy_window_start)
                           / 86400 seconds)
      base_cents    = occupied_m * CROSSING_RATE_CENTS_PER_M[crossing_kind]
      long_occupancy_surcharge_bps =
            0                                                   if duration_days <= LONG_OCCUPANCY_FREE_DAYS
            min(LONG_OCCUPANCY_CAP_BPS,
                LONG_OCCUPANCY_BPS_PER_DAY * (duration_days - LONG_OCCUPANCY_FREE_DAYS))
                                                                otherwise
      compensation_cents = base_cents
                         + round_half_up(base_cents * long_occupancy_surcharge_bps / 10000)
    input_set: |
      Only the crossing's own request fields plus the rate table keyed on
      crossing_kind. No other CrossingAgreement on the corridor affects the
      compensation; corridor occupancy only affects admissibility (§1.4
      priority 38), never price.
    constants:
      CROSSING_RATE_CENTS_PER_M: { COLLECTION_LINE: 1800, INTERCONNECTION_ROUTE: 3400, ACCESS_ROAD: 900 }
      LONG_OCCUPANCY_FREE_DAYS: 30
      LONG_OCCUPANCY_BPS_PER_DAY: 50
      LONG_OCCUPANCY_CAP_BPS: 2500
    precision: "whole integer cents, round_half_up applied once to the surcharge term"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated in strict ascending priority order;
# the FIRST violated rule determines the response and no later rule is
# evaluated)
#
# Domain priority rationale (renewable land origination):
#   auth -> existence -> request shape -> optimistic concurrency -> temporal
#   staleness of an instrument (expiry) -> generic from-state -> title &
#   security compliance (safety) -> deal-structure constraints -> corridor and
#   crew temporal conflicts -> money (fiscal, last). Title/compliance outranks
#   money because a developer must never be told "your payment is on hold" for
#   a parcel whose title defects make the deal illegal in the first place.
#
# Three deliberate priority-conflict pairs are pinned by these numbers:
#   * priority 22 ERR_OPTION_EXPIRED (state) BEATS priority 41
#     ERR_LANDOWNER_PAYMENT_HOLD (business_fiscal) on option exercise.
#   * priority 26 ERR_TITLE_CURATIVE_BLOCKING (business_safety) BEATS
#     priority 38 ERR_CORRIDOR_STATION_CONFLICT (business_temporal) on
#     crossing-agreement creation.
#   * priority 33 ERR_EXTENSION_LIMIT_REACHED (business_constraint) BEATS
#     priority 41 ERR_LANDOWNER_PAYMENT_HOLD (business_fiscal) on extend.
# =============================================================================
validations:

  # ---------------------------------------------------------------- auth
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty on every request"
    error_id: ERR_MISSING_USER_ID
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in §1.7 AND that role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # ------------------------------------------------------------ existence
  # Path ids are resolved strictly left-to-right; body FK ids are resolved
  # afterwards in the field order declared by the endpoint's input list.
  - priority: 3
    category: existence
    check: "Landowner referenced by path {landownerId} or by body landowner_id exists"
    error_id: ERR_LANDOWNER_NOT_FOUND
    http_status: 404
    applies_to: "GET /landowners/{landownerId}, PATCH /landowners/{landownerId}, POST /parcels, POST /option-agreements"

  - priority: 4
    category: existence
    check: "Parcel referenced by path {parcelId} or by body parcel_id exists"
    error_id: ERR_PARCEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /parcels/{parcelId}, POST /parcels/{parcelId}/rescreen, POST /neighbor-consents, POST /title-curative-items, POST /option-agreements, POST /crossing-agreements, POST /site-access-bookings"

  - priority: 5
    category: existence
    check: "SetbackRule referenced by body setback_rule_id exists"
    error_id: ERR_SETBACK_RULE_NOT_FOUND
    http_status: 404
    applies_to: "POST /neighbor-consents"

  - priority: 6
    category: existence
    check: "NeighborConsent referenced by path {consentId} exists"
    error_id: ERR_NEIGHBOR_CONSENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /neighbor-consents/{consentId}/grant, POST /neighbor-consents/{consentId}/revoke"

  - priority: 7
    category: existence
    check: "TitleCurativeItem referenced by path {itemId} or by body blocks_item_id exists"
    error_id: ERR_TITLE_CURATIVE_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "POST /title-curative-items, POST /title-curative-items/{itemId}/clear, POST /title-curative-items/{itemId}/waive"

  - priority: 8
    category: existence
    check: "OptionAgreement referenced by path {optionId} exists"
    error_id: ERR_OPTION_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all POST /option-agreements/{optionId}/* action endpoints"

  - priority: 9
    category: existence
    check: "Corridor referenced by path {corridorId} or by body corridor_id exists"
    error_id: ERR_CORRIDOR_NOT_FOUND
    http_status: 404
    applies_to: "GET /corridors/{corridorId}, POST /corridors/{corridorId}/permit, POST /crossing-agreements"

  - priority: 10
    category: existence
    check: "CrossingAgreement referenced by path {crossingId} exists"
    error_id: ERR_CROSSING_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /crossing-agreements/{crossingId}, POST /crossing-agreements/{crossingId}/grant"

  - priority: 11
    category: existence
    check: "SiteAccessBooking referenced by path {bookingId} exists"
    error_id: ERR_SITE_ACCESS_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: "GET /site-access-bookings/{bookingId}, POST /site-access-bookings/{bookingId}/cancel"

  - priority: 12
    category: existence
    check: "LeaseAgreement referenced by path {leaseId} exists"
    error_id: ERR_LEASE_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /leases/{leaseId}, GET /leases/{leaseId}/rent-projection, POST /leases/{leaseId}/post-security, POST /leases/{leaseId}/submit-memo, POST /leases/{leaseId}/record-memo, POST /leases/{leaseId}/rent-invoices"

  - priority: 13
    category: existence
    check: "RentInvoice referenced by path {invoiceId} exists"
    error_id: ERR_RENT_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /rent-invoices/{invoiceId}, POST /rent-invoices/{invoiceId}/issue, POST /rent-invoices/{invoiceId}/pay, POST /rent-invoices/{invoiceId}/void"

  # ------------------------------------------------------- request shape
  - priority: 14
    category: business_referential
    check: "Body parses as JSON, every required input field is present and non-null, every field has the declared JSON type, and every enum-typed field carries a declared enum member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 15
    category: business_referential
    check: "limit is an integer in [1,100] and offset is an integer >= 0 on every list endpoint"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all list GET endpoints"

  - priority: 16
    category: business_referential
    check: "Numeric domains hold: gross_acres > 0; 0 <= slope_pct <= 100; 0 < resource_capacity_factor <= 1; interconnection_distance_km >= 0; every *_bps field in [0,10000]; every *_cents field >= 0; option_term_days >= 1; extension_count_allowed >= 0; crew_count in [1,3]; buffer_m >= 0; total_length_m > 0; period_year >= 1; production_mwh >= 0; consent_expiry_days >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints carrying the named fields"

  - priority: 17
    category: business_referential
    check: "station_end_m > station_start_m AND 0 <= station_start_m AND station_end_m <= Corridor.total_length_m"
    error_id: ERR_INVALID_STATION_RANGE
    http_status: 422
    applies_to: "POST /crossing-agreements"

  - priority: 18
    category: business_referential
    check: "The half-open interval is well formed: occupancy_window_end > occupancy_window_start on a crossing, and window_end > window_start on a site-access booking"
    error_id: ERR_INVALID_WINDOW_RANGE
    http_status: 422
    applies_to: "POST /crossing-agreements, POST /site-access-bookings"

  # ------------------------------------------- optimistic concurrency (§1.2.1)
  - priority: 19
    category: state
    check: "expected_parcel_version equals the referenced Parcel's current version"
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412
    applies_to: "POST /option-agreements"

  - priority: 20
    category: state
    check: "expected_lease_agreement_version equals the referenced LeaseAgreement's current version"
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
    applies_to: "POST /leases/{leaseId}/rent-invoices"

  # -------------------------------------------------- instrument staleness
  # These two rules sit ABOVE the generic from-state check (priority 23) on
  # purpose: an instrument whose clock has run out must report its own expiry,
  # not a generic "wrong state" — and must report it in preference to any
  # money-side objection further down the ladder.
  - priority: 21
    category: state
    check: "The NeighborConsent's consent_expiry_at is strictly after the current logical clock"
    error_id: ERR_CONSENT_EXPIRED
    http_status: 422
    applies_to: "POST /neighbor-consents/{consentId}/grant"

  - priority: 22
    category: state
    check: "The OptionAgreement's option_expiry_at is strictly after the current logical clock"
    error_id: ERR_OPTION_EXPIRED
    http_status: 422
    applies_to: "POST /option-agreements/{optionId}/accept, POST /option-agreements/{optionId}/execute, POST /option-agreements/{optionId}/extend, POST /option-agreements/{optionId}/exercise"

  # --------------------------------------------------------- generic state
  - priority: 23
    category: state
    check: "The target entity's current status admits the requested transition per its §1.2 machine (including the rent_status and recording_status dimensions of LeaseAgreement); a repeat of an already-applied transition is rejected here"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 24
    category: state
    check: "The LeaseAgreement's recording_status is not already RECORDED when a memo submission or recording is requested"
    error_id: ERR_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /leases/{leaseId}/submit-memo, POST /leases/{leaseId}/record-memo"

  # ----------------------------------------------- safety / title compliance
  - priority: 25
    category: business_safety
    check: "Segregation of duties on the acting X-User-ID: it must differ from TitleCurativeItem.created_by_user_id when clearing or waiving that item, and from OptionAgreement.executed_by_user_id when exercising that option"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /title-curative-items/{itemId}/clear, POST /title-curative-items/{itemId}/waive, POST /option-agreements/{optionId}/exercise"

  - priority: 26
    category: business_safety
    check: "The Parcel has blocking_curative_open_count == 0 — no TitleCurativeItem of severity BLOCKING remains in status BLOCKED or OPEN"
    error_id: ERR_TITLE_CURATIVE_BLOCKING
    http_status: 422
    applies_to: "POST /crossing-agreements, POST /option-agreements/{optionId}/exercise, POST /leases/{leaseId}/submit-memo"

  - priority: 27
    category: business_safety
    check: "Every TitleCurativeItem named by this item's blocks_item_id chain has already reached CLEARED or WAIVED, i.e. the item is not still in status BLOCKED"
    error_id: ERR_CURATIVE_BLOCKED_PREDECESSOR
    http_status: 422
    applies_to: "POST /title-curative-items/{itemId}/clear, POST /title-curative-items/{itemId}/waive"

  - priority: 28
    category: business_safety
    check: "LeaseAgreement.security_posted_cents >= LeaseAgreement.total_security_required_cents — the decommissioning security is fully posted before the lease may be memorialised"
    error_id: ERR_SECURITY_NOT_POSTED
    http_status: 422
    applies_to: "POST /leases/{leaseId}/submit-memo"

  - priority: 29
    category: business_safety
    check: "The Landowner on the lease has w9_on_file == true — no instrument may be recorded for a payee the developer cannot report"
    error_id: ERR_W9_MISSING
    http_status: 422
    applies_to: "POST /leases/{leaseId}/record-memo"

  # ------------------------------------------ deal-structure constraints
  - priority: 30
    category: business_constraint
    check: "No other Parcel already exists with the same (apn, county_fips) pair"
    error_id: ERR_PARCEL_APN_DUPLICATE
    http_status: 409
    applies_to: "POST /parcels"

  - priority: 31
    category: business_constraint
    check: "zoning_code is not a member of PROHIBITED_ZONING_CODES"
    error_id: ERR_PROHIBITED_ZONING
    http_status: 422
    applies_to: "POST /parcels"

  - priority: 32
    category: business_constraint
    check: "The Parcel referenced by the option is in status QUALIFIED (buildable_acres >= MIN_BUILDABLE_ACRES, screening_tier in {PRIORITY, STANDARD} and no open BLOCKING curative item) before terms may be sent to the landowner"
    error_id: ERR_PARCEL_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /option-agreements/{optionId}/send"

  - priority: 33
    category: business_constraint
    check: "OptionAgreement.extensions_used < OptionAgreement.extension_count_allowed"
    error_id: ERR_EXTENSION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /option-agreements/{optionId}/extend"

  - priority: 34
    category: business_constraint
    check: "OptionAgreement.round_index < MAX_NEGOTIATION_ROUNDS (3) before another counter is accepted"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /option-agreements/{optionId}/counter"

  - priority: 35
    category: business_constraint
    check: "Parcel.waived_blocking_count < MAX_WAIVED_BLOCKING_PER_PARCEL (1) — at most one BLOCKING title defect per parcel may be waived rather than cured"
    error_id: ERR_WAIVER_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /title-curative-items/{itemId}/waive"

  - priority: 36
    category: business_constraint
    check: "The Corridor referenced by the crossing is in status PERMITTED"
    error_id: ERR_CORRIDOR_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /crossing-agreements/{crossingId}/grant"

  - priority: 37
    category: business_constraint
    check: "period_year is an integer in [1, LEASE_TERM_YEARS] (1..35) and no RentInvoice with status in {DRAFT, ISSUED, PAID} already exists on this lease for that period_year"
    error_id: ERR_DUPLICATE_INVOICE_PERIOD
    http_status: 409
    applies_to: "POST /leases/{leaseId}/rent-invoices"

  # ------------------------------------------------------ temporal conflicts
  - priority: 38
    category: business_temporal
    check: |
      No other CrossingAgreement in status {PROPOSED, GRANTED} on the same
      Corridor conflicts. A conflict requires BOTH a buffer-expanded station
      overlap and a half-open time overlap:
        new.station_start_m < existing.station_end_m + Corridor.buffer_m
        AND new.station_end_m + Corridor.buffer_m > existing.station_start_m
        AND new.occupancy_window_start < existing.occupancy_window_end
        AND new.occupancy_window_end   > existing.occupancy_window_start
      Touching at exactly the buffer edge, or windows that merely abut, do not
      conflict.
    error_id: ERR_CORRIDOR_STATION_CONFLICT
    http_status: 409
    applies_to: "POST /crossing-agreements"

  - priority: 39
    category: business_temporal
    check: |
      Aggregate crew capacity on the Parcel is respected. Over every
      SiteAccessBooking in status {BOOKED, COMPLETED} on the same parcel whose
      half-open [window_start, window_end) intersects the requested window,
      SUM(crew_count) + requested crew_count <= PARCEL_MAX_CONCURRENT_CREWS (3).
      Each booking may be individually admissible while the collective sum is
      not; back-to-back windows (previous end == next start) never intersect.
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /site-access-bookings"

  - priority: 40
    category: business_temporal
    check: "window_start is greater than or equal to the current logical clock — crews cannot be booked into the past"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /site-access-bookings"

  # ------------------------------------------------------- fiscal (last)
  - priority: 41
    category: business_fiscal
    check: "The Landowner on the instrument has payment_hold == false — no cash may move to a landowner under a payment hold"
    error_id: ERR_LANDOWNER_PAYMENT_HOLD
    http_status: 422
    applies_to: "POST /option-agreements/{optionId}/execute, POST /option-agreements/{optionId}/extend, POST /option-agreements/{optionId}/exercise, POST /rent-invoices/{invoiceId}/pay"

  - priority: 42
    category: business_fiscal
    check: "LeaseAgreement.security_posted_cents + amount_cents <= LeaseAgreement.total_security_required_cents — the developer may not over-post decommissioning security"
    error_id: ERR_SECURITY_OVERPOSTED
    http_status: 422
    applies_to: "POST /leases/{leaseId}/post-security"

  - priority: 43
    category: business_fiscal
    check: "paid_amount_cents equals RentInvoice.gross_rent_cents exactly — partial and over payments are rejected"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /rent-invoices/{invoiceId}/pay"

# =============================================================================
# §1.5 API Endpoint Table
#
# Topology: FLAT. Every entity has its own peer collection directly under the
# api_prefix `/land-origination`, so every child is discoverable through a
# filtered list carrying its foreign keys. Path ids are NOT repeated in the
# `input:` list — `input:` names body fields for writes and query parameters
# for reads.
#
# Reads first (single-resource, then filtered lists, then the one computed
# read), then writes grouped by aggregate, then the logical-clock endpoint.
# =============================================================================
endpoints:

  # ------------------------------------------------- single-resource reads
  - method: GET
    path: "/land-origination/landowners/{landownerId}"
    description: "Fetch one landowner, including the derived total_paid_cents ledger figure."
    roles: [LandAgent, TitleCounsel, PortfolioManager, PaymentAdministrator, Landowner]
    code: 200
    input: []
    output: Landowner
    side_effects: []

  - method: GET
    path: "/land-origination/parcels/{parcelId}"
    description: "Fetch one parcel with its full derived acreage breakdown and screening result."
    roles: [LandAgent, TitleCounsel, PortfolioManager, PaymentAdministrator]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  - method: GET
    path: "/land-origination/setback-rules/{ruleId}"
    description: "Fetch one jurisdictional setback rule."
    roles: [LandAgent, TitleCounsel, PortfolioManager]
    code: 200
    input: []
    output: SetbackRule
    side_effects: []

  - method: GET
    path: "/land-origination/neighbor-consents/{consentId}"
    description: "Fetch one neighbor consent request, including its released_acres contribution."
    roles: [LandAgent, TitleCounsel, PortfolioManager]
    code: 200
    input: []
    output: NeighborConsent
    side_effects: []

  - method: GET
    path: "/land-origination/title-curative-items/{itemId}"
    description: "Fetch one title curative item."
    roles: [LandAgent, TitleCounsel, PortfolioManager]
    code: 200
    input: []
    output: TitleCurativeItem
    side_effects: []

  - method: GET
    path: "/land-origination/option-agreements/{optionId}"
    description: "Fetch one option agreement with its negotiated terms and payment total."
    roles: [LandAgent, TitleCounsel, PortfolioManager, PaymentAdministrator, Landowner]
    code: 200
    input: []
    output: OptionAgreement
    side_effects: []

  - method: GET
    path: "/land-origination/option-payments/{paymentId}"
    description: "Fetch one immutable option-payment ledger row."
    roles: [PortfolioManager, PaymentAdministrator, Landowner]
    code: 200
    input: []
    output: OptionPayment
    side_effects: []

  - method: GET
    path: "/land-origination/corridors/{corridorId}"
    description: "Fetch one collection/interconnection corridor."
    roles: [LandAgent, PortfolioManager]
    code: 200
    input: []
    output: Corridor
    side_effects: []

  - method: GET
    path: "/land-origination/crossing-agreements/{crossingId}"
    description: "Fetch one crossing agreement with its computed compensation."
    roles: [LandAgent, PortfolioManager, PaymentAdministrator]
    code: 200
    input: []
    output: CrossingAgreement
    side_effects: []

  - method: GET
    path: "/land-origination/site-access-bookings/{bookingId}"
    description: "Fetch one site-access crew booking."
    roles: [LandAgent, TitleCounsel, PortfolioManager]
    code: 200
    input: []
    output: SiteAccessBooking
    side_effects: []

  - method: GET
    path: "/land-origination/leases/{leaseId}"
    description: "Fetch one lease agreement with its security, recording and rent-status dimensions."
    roles: [LandAgent, TitleCounsel, PortfolioManager, PaymentAdministrator, Landowner]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: []

  - method: GET
    path: "/land-origination/rent-invoices/{invoiceId}"
    description: "Fetch one rent invoice with its variant, components and gross amount."
    roles: [PortfolioManager, PaymentAdministrator, Landowner]
    code: 200
    input: []
    output: RentInvoice
    side_effects: []

  # ------------------------------------------------------- filtered lists
  # Every list is paginated with limit/offset and returns meta.total_count and
  # meta.has_more per §1.0. Default ordering is created_at ASC, never id.
  - method: GET
    path: "/land-origination/landowners"
    description: "List landowners, newest last (created_at ASC)."
    roles: [LandAgent, TitleCounsel, PortfolioManager, PaymentAdministrator]
    code: 200
    input: ["status?", "payment_hold?", "limit?", "offset?"]
    output: Landowner[]
    side_effects: []

  - method: GET
    path: "/land-origination/parcels"
    description: "List parcels, filterable by owning landowner, county, screening tier or status."
    roles: [LandAgent, TitleCounsel, PortfolioManager, PaymentAdministrator]
    code: 200
    input: ["landowner_id?", "county_fips?", "screening_tier?", "status?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []

  - method: GET
    path: "/land-origination/setback-rules"
    description: "List setback rules, filterable by jurisdiction_code."
    roles: [LandAgent, TitleCounsel, PortfolioManager]
    code: 200
    input: ["jurisdiction_code?", "rule_type?", "limit?", "offset?"]
    output: SetbackRule[]
    side_effects: []

  - method: GET
    path: "/land-origination/neighbor-consents"
    description: "List neighbor consents, filterable by parcel_id and setback_rule_id."
    roles: [LandAgent, TitleCounsel, PortfolioManager]
    code: 200
    input: ["parcel_id?", "setback_rule_id?", "status?", "limit?", "offset?"]
    output: NeighborConsent[]
    side_effects: []

  - method: GET
    path: "/land-origination/title-curative-items"
    description: "List title curative items, filterable by parcel_id, by the predecessor they wait on (blocks_item_id), by severity and by status."
    roles: [LandAgent, TitleCounsel, PortfolioManager]
    code: 200
    input: ["parcel_id?", "blocks_item_id?", "severity?", "status?", "limit?", "offset?"]
    output: TitleCurativeItem[]
    side_effects: []

  - method: GET
    path: "/land-origination/option-agreements"
    description: "List option agreements, filterable by parcel_id, landowner_id and status."
    roles: [LandAgent, TitleCounsel, PortfolioManager, PaymentAdministrator, Landowner]
    code: 200
    input: ["parcel_id?", "landowner_id?", "status?", "limit?", "offset?"]
    output: OptionAgreement[]
    side_effects: []

  - method: GET
    path: "/land-origination/option-payments"
    description: "List option-payment ledger rows, filterable by option_agreement_id and payment_kind, ordered created_at ASC then sequence_no ASC. This is the only discovery channel for payment rows, which are minted exclusively by cascades."
    roles: [PortfolioManager, PaymentAdministrator, Landowner]
    code: 200
    input: ["option_agreement_id?", "payment_kind?", "limit?", "offset?"]
    output: OptionPayment[]
    side_effects: []

  - method: GET
    path: "/land-origination/corridors"
    description: "List corridors, filterable by status."
    roles: [LandAgent, PortfolioManager]
    code: 200
    input: ["status?", "voltage_class?", "limit?", "offset?"]
    output: Corridor[]
    side_effects: []

  - method: GET
    path: "/land-origination/crossing-agreements"
    description: "List crossing agreements, filterable by corridor_id and parcel_id."
    roles: [LandAgent, PortfolioManager, PaymentAdministrator]
    code: 200
    input: ["corridor_id?", "parcel_id?", "crossing_kind?", "status?", "limit?", "offset?"]
    output: CrossingAgreement[]
    side_effects: []

  - method: GET
    path: "/land-origination/site-access-bookings"
    description: "List site-access bookings, filterable by parcel_id and status."
    roles: [LandAgent, TitleCounsel, PortfolioManager]
    code: 200
    input: ["parcel_id?", "status?", "limit?", "offset?"]
    output: SiteAccessBooking[]
    side_effects: []

  - method: GET
    path: "/land-origination/leases"
    description: "List lease agreements, filterable by option_agreement_id, parcel_id and landowner_id."
    roles: [LandAgent, TitleCounsel, PortfolioManager, PaymentAdministrator, Landowner]
    code: 200
    input: ["option_agreement_id?", "parcel_id?", "landowner_id?", "rent_status?", "recording_status?", "limit?", "offset?"]
    output: LeaseAgreement[]
    side_effects: []

  - method: GET
    path: "/land-origination/rent-invoices"
    description: "List rent invoices, filterable by lease_agreement_id, period_year and status."
    roles: [PortfolioManager, PaymentAdministrator, Landowner]
    code: 200
    input: ["lease_agreement_id?", "period_year?", "rent_variant?", "status?", "limit?", "offset?"]
    output: RentInvoice[]
    side_effects: []

  # ---------------------------------------------------------- computed read
  - method: GET
    path: "/land-origination/leases/{leaseId}/rent-projection"
    description: "Computed read. Projects the escalated per-acre rent for a future period_year under both §1.3 annual_rent_amount variants without persisting anything, so the developer can compare a PROVISIONAL (gross-acre, royalty-suppressed) figure against a FINAL_AS_BUILT (buildable-acre, greater-of-royalty) figure for the same production assumption."
    roles: [PortfolioManager, PaymentAdministrator]
    code: 200
    input: [period_year, production_mwh]
    output: { lease_agreement_id: string, period_year: integer, provisional_acre_basis: number, provisional_gross_rent_cents: integer, final_acre_basis: number, final_per_acre_component_cents: integer, final_royalty_component_cents: integer, final_gross_rent_cents: integer, variant_delta_cents: integer }
    side_effects: []

  # ---------------------------------------------------------- landowners
  - method: POST
    path: "/land-origination/landowners"
    description: "Register a prospective landowner. Starts in PROSPECT with total_paid_cents 0."
    roles: [LandAgent]
    code: 201
    input: [legal_name, entity_type, mailing_state, contact_email, "w9_on_file?", "payment_hold?"]
    output: Landowner
    side_effects: ["status := PROSPECT", "total_paid_cents := 0"]

  - method: PATCH
    path: "/land-origination/landowners/{landownerId}"
    description: "Update the landowner's payable administration flags. Only the tax/payment attributes are mutable; legal_name and entity_type are fixed at registration."
    roles: [PaymentAdministrator]
    code: 200
    input: ["contact_email?", "w9_on_file?", "payment_hold?"]
    output: Landowner
    side_effects: ["version += 1"]

  # -------------------------------------------------------------- parcels
  - method: POST
    path: "/land-origination/parcels"
    description: "Register a candidate parcel and screen it immediately. Runs RECOMPUTE_PARCEL_ACREAGE then RECOMPUTE_PARCEL_SCREENING under the DESKTOP variant, then REEVALUATE_PARCEL_QUALIFICATION and LANDOWNER_POSTURE_SYNC."
    roles: [LandAgent]
    code: 201
    input: [apn, county_fips, landowner_id, gross_acres, interconnection_distance_km, resource_capacity_factor, slope_pct, title_condition_grade, zoning_code]
    output: Parcel
    side_effects:
      - "screen_mode := DESKTOP"
      - "calculations.buildable_acres_derivation (slope_excluded_acres, raw_setback_acres, consent_released_acres, setback_encumbered_acres, buildable_acres)"
      - "calculations.parcel_screening_score variant DESKTOP (screening_score, screening_tier)"
      - "REEVALUATE_PARCEL_QUALIFICATION: status := QUALIFIED or SCREENING or DISQUALIFIED"
      - "LANDOWNER_POSTURE_SYNC(landowner_id)"

  - method: POST
    path: "/land-origination/parcels/{parcelId}/rescreen"
    description: "Re-run screening for the parcel under the requested screen_mode. Persists screen_mode so every later cascade recompute uses the same variant."
    roles: [LandAgent]
    code: 200
    input: [screen_mode]
    output: Parcel
    side_effects:
      - "screen_mode := <requested>"
      - "calculations.buildable_acres_derivation"
      - "calculations.parcel_screening_score under the persisted variant"
      - "REEVALUATE_PARCEL_QUALIFICATION"
      - "LANDOWNER_POSTURE_SYNC(landowner_id)"
      - "version += 1"

  # -------------------------------------------------------- setback rules
  - method: POST
    path: "/land-origination/setback-rules"
    description: "Publish a jurisdictional setback rule. Every existing Parcel whose county_fips equals jurisdiction_code is re-derived in created_at ASC order, so publishing a rule can revert already-QUALIFIED parcels."
    roles: [TitleCounsel]
    code: 201
    input: [jurisdiction_code, rule_type, setback_feet, encumbrance_rate_per_acre, consent_waivable]
    output: SetbackRule
    side_effects:
      - "for each matching Parcel in created_at ASC: RECOMPUTE_PARCEL_ACREAGE, RECOMPUTE_PARCEL_SCREENING, REEVALUATE_PARCEL_QUALIFICATION, LANDOWNER_POSTURE_SYNC"

  # ----------------------------------------------------- neighbor consents
  - method: POST
    path: "/land-origination/neighbor-consents"
    description: "Request a neighbor's written consent to waive a setback encumbrance. Stamps requested_at from the logical clock and consent_expiry_at = requested_at + consent_expiry_days (default 60)."
    roles: [LandAgent]
    code: 201
    input: [parcel_id, setback_rule_id, neighbor_name, "consent_expiry_days?"]
    output: NeighborConsent
    side_effects: ["status := REQUESTED", "requested_at := clock", "consent_expiry_at := requested_at + consent_expiry_days days", "released_acres := 0.00"]

  - method: POST
    path: "/land-origination/neighbor-consents/{consentId}/grant"
    description: "Record the neighbor's consent. Releases CONSENT_RELEASE_FRACTION of that rule's encumbrance and cascades through acreage, screening, qualification and landowner posture."
    roles: [LandAgent]
    code: 200
    input: []
    output: NeighborConsent
    side_effects:
      - "status := GRANTED, granted_at := clock"
      - "RECOMPUTE_PARCEL_ACREAGE(parcel): consent_released_acres, setback_encumbered_acres, buildable_acres, and this consent's released_acres"
      - "RECOMPUTE_PARCEL_SCREENING(parcel)"
      - "REEVALUATE_PARCEL_QUALIFICATION(parcel)"
      - "LANDOWNER_POSTURE_SYNC(parcel.landowner_id)"
      - "version += 1 on consent and on parcel"

  - method: POST
    path: "/land-origination/neighbor-consents/{consentId}/revoke"
    description: "The neighbor withdraws consent. Compensating transition: the released acreage is returned to the encumbrance and every derived figure returns to its pre-grant value exactly."
    roles: [LandAgent]
    code: 200
    input: []
    output: NeighborConsent
    side_effects:
      - "status := REVOKED, revoked_at := clock, released_acres := 0.00"
      - "RECOMPUTE_PARCEL_ACREAGE(parcel)"
      - "RECOMPUTE_PARCEL_SCREENING(parcel)"
      - "REEVALUATE_PARCEL_QUALIFICATION(parcel) — may revert QUALIFIED to SCREENING"
      - "LANDOWNER_POSTURE_SYNC(parcel.landowner_id)"

  # ------------------------------------------------ title curative items
  - method: POST
    path: "/land-origination/title-curative-items"
    description: "Raise a title defect (mineral severance, mortgage subordination, missing access easement, unreleased lien). Stamps created_by_user_id from X-User-ID. Starts BLOCKED when blocks_item_id names a predecessor still in {BLOCKED, OPEN}, otherwise OPEN."
    roles: [TitleCounsel]
    code: 201
    input: [parcel_id, item_type, severity, curative_cost_cents, "blocks_item_id?"]
    output: TitleCurativeItem
    side_effects:
      - "created_by_user_id := X-User-ID"
      - "status := BLOCKED if predecessor unresolved else OPEN"
      - "parcel.blocking_curative_open_count recount (BLOCKED and OPEN items of severity BLOCKING); parcel.curative_cost_cents is NOT touched at creation — cost is capitalised only by the CLEARED branch"
      - "RECOMPUTE_PARCEL_SCREENING(parcel) — only moves the score under the FIELD_VERIFIED variant"
      - "REEVALUATE_PARCEL_QUALIFICATION(parcel)"
      - "LANDOWNER_POSTURE_SYNC(parcel.landowner_id)"

  - method: POST
    path: "/land-origination/title-curative-items/{itemId}/clear"
    description: "Curative work completed and title cured. Requires a different X-User-ID from the item's created_by_user_id."
    roles: [TitleCounsel]
    code: 200
    input: []
    output: TitleCurativeItem
    side_effects:
      - "status := CLEARED, cleared_at := clock, cleared_by_user_id := X-User-ID"
      - "every successor item whose blocks_item_id is this item and whose remaining predecessors are all resolved: BLOCKED -> OPEN, in created_at ASC order"
      - "parcel.blocking_curative_open_count recount"
      - "RECOMPUTE_PARCEL_SCREENING(parcel)"
      - "REEVALUATE_PARCEL_QUALIFICATION(parcel)"
      - "LANDOWNER_POSTURE_SYNC(parcel.landowner_id)"

  - method: POST
    path: "/land-origination/title-curative-items/{itemId}/waive"
    description: "Accept the defect on the record with counsel's written note instead of curing it. Releases successors exactly as clear does, but diverges from clear in two ways: it increments parcel.waived_blocking_count (capped by MAX_WAIVED_BLOCKING_PER_PARCEL) and it does NOT capitalise curative_cost_cents onto the parcel."
    roles: [TitleCounsel]
    code: 200
    input: [waiver_note]
    output: TitleCurativeItem
    side_effects:
      - "status := WAIVED, cleared_at := clock, cleared_by_user_id := X-User-ID"
      - "parcel.waived_blocking_count += 1 when severity == BLOCKING"
      - "successors with blocks_item_id == this item transition BLOCKED -> OPEN in created_at ASC order, exactly as in the CLEARED branch"
      - "parcel.curative_cost_cents is NOT increased — this is the branch's divergence from clear"
      - "parcel.blocking_curative_open_count recount"
      - "RECOMPUTE_PARCEL_SCREENING(parcel)"
      - "REEVALUATE_PARCEL_QUALIFICATION(parcel)"
      - "LANDOWNER_POSTURE_SYNC(parcel.landowner_id)"

  # ----------------------------------------------------- option agreements
  - method: POST
    path: "/land-origination/option-agreements"
    description: "Draft an option agreement over a parcel. Guarded by optimistic concurrency (§1.2.1 option-create-stale-parcel): expected_parcel_version must equal the parcel's current version, which every acreage/screening/curative cascade bumps."
    roles: [LandAgent]
    code: 201
    input: [parcel_id, landowner_id, expected_parcel_version, option_term_days, option_fee_per_acre_cents, extension_count_allowed, extension_fee_per_acre_cents, rent_structure_type, base_rent_per_acre_cents, royalty_rate_bps, escalator_pct_bps, escalator_mode]
    output: OptionAgreement
    side_effects:
      - "status := DRAFT, round_index := 0, extensions_used := 0, total_option_paid_cents := 0"
      - "parcel.version += 1 (OCC parent bump)"

  - method: POST
    path: "/land-origination/option-agreements/{optionId}/send"
    description: "Send the drafted or revised terms to the landowner. Requires the underlying parcel to be QUALIFIED at this instant."
    roles: [LandAgent]
    code: 200
    input: []
    output: OptionAgreement
    side_effects: ["status := SENT"]

  - method: POST
    path: "/land-origination/option-agreements/{optionId}/counter"
    description: "The landowner counters the sent terms. Any omitted term keeps its current value. Increments round_index; accepted only while round_index < MAX_NEGOTIATION_ROUNDS (3), so the fourth counter is refused by ERR_NEGOTIATION_ROUND_LIMIT."
    roles: [Landowner]
    code: 200
    input: ["option_fee_per_acre_cents?", "extension_fee_per_acre_cents?", "base_rent_per_acre_cents?", "royalty_rate_bps?", "escalator_pct_bps?", "escalator_mode?", "option_term_days?"]
    output: OptionAgreement
    side_effects: ["status := COUNTERED", "round_index += 1", "named terms overwritten"]

  - method: POST
    path: "/land-origination/option-agreements/{optionId}/revise"
    description: "The land agent answers the counter with revised terms, returning the instrument to the negotiation loop."
    roles: [LandAgent]
    code: 200
    input: ["option_fee_per_acre_cents?", "extension_fee_per_acre_cents?", "base_rent_per_acre_cents?", "royalty_rate_bps?", "escalator_pct_bps?", "escalator_mode?", "option_term_days?", "rent_structure_type?"]
    output: OptionAgreement
    side_effects: ["status := REVISED", "named terms overwritten"]

  - method: POST
    path: "/land-origination/option-agreements/{optionId}/accept"
    description: "The landowner accepts the terms on the table."
    roles: [Landowner]
    code: 200
    input: []
    output: OptionAgreement
    side_effects: ["status := ACCEPTED"]

  - method: POST
    path: "/land-origination/option-agreements/{optionId}/execute"
    description: "Execute the option: stamps executed_at and option_expiry_at = executed_at + option_term_days, mints the INITIAL_OPTION_FEE ledger row on gross acreage, and moves the landowner to UNDER_OPTION."
    roles: [PortfolioManager]
    code: 200
    input: []
    output: OptionAgreement
    side_effects:
      - "status := EXECUTED, executed_at := clock, executed_by_user_id := X-User-ID"
      - "option_expiry_at := executed_at + option_term_days days"
      - "OptionPayment insert: payment_kind INITIAL_OPTION_FEE, ledger_direction DEBIT_DEVELOPER, sequence_no 1, acres_basis := parcel.gross_acres, amount_cents := calculations.option_fee_schedule initial term"
      - "calculations.landowner_paid_ledger (total_option_paid_cents, landowner.total_paid_cents)"
      - "parcel.status := OPTIONED"
      - "LANDOWNER_POSTURE_SYNC(landowner_id) -> UNDER_OPTION"

  - method: POST
    path: "/land-origination/option-agreements/{optionId}/extend"
    description: "Exercise an extension right. Self-loop on EXECUTED: pushes option_expiry_at out by EXTENSION_TERM_DAYS and mints a step-up EXTENSION_FEE row priced at the compounding step-up rate."
    roles: [PortfolioManager]
    code: 200
    input: []
    output: OptionAgreement
    side_effects:
      - "extensions_used += 1"
      - "option_expiry_at += EXTENSION_TERM_DAYS days"
      - "OptionPayment insert: payment_kind EXTENSION_FEE, ledger_direction DEBIT_DEVELOPER, sequence_no := prior max + 1, acres_basis := parcel.gross_acres, amount_cents := calculations.option_fee_schedule extension term for n = extensions_used"
      - "calculations.landowner_paid_ledger"

  - method: POST
    path: "/land-origination/option-agreements/{optionId}/exercise"
    description: "Exercise the option and originate the lease. Snapshots the parcel's buildable acreage, sizes the decommissioning security under §1.3 decommissioning_security_amount, and returns the newly created LeaseAgreement."
    roles: [PortfolioManager]
    code: 201
    input: [exercise_notice_reference]
    output: LeaseAgreement
    side_effects:
      - "option.status := EXERCISED, option.exercised_at := clock"
      - "LeaseAgreement insert: acre_basis_at_exercise := parcel.buildable_acres, term_start_date := exercised_at, term_years := LEASE_TERM_YEARS, rent_status := PENDING_FIRST_RENT, recording_status := UNRECORDED, security_posted_cents := 0, last_paid_invoice_year := 0"
      - "calculations.decommissioning_security_amount (gross_security_cents, admin_rate_bps, admin_loading_cents, total_security_required_cents)"
      - "parcel.status stays OPTIONED — it becomes LEASED only when the memorandum is recorded"
      - "requires an X-User-ID different from the option's executed_by_user_id"

  - method: POST
    path: "/land-origination/option-agreements/{optionId}/withdraw"
    description: "Withdraw from the option at any pre-exercise stage. When called from EXECUTED with refund_extension_fees true, mints one REFUND_REVERSAL credit that returns the ledger to its post-execution value exactly and releases the parcel back to QUALIFIED."
    roles: [LandAgent, PortfolioManager]
    code: 200
    input: [withdraw_reason, "refund_extension_fees?"]
    output: OptionAgreement
    side_effects:
      - "status := WITHDRAWN, withdraw_reason := <input>"
      - "when called from EXECUTED and refund_extension_fees == true: OptionPayment insert with payment_kind REFUND_REVERSAL, ledger_direction CREDIT_DEVELOPER, amount_cents := sum of this agreement's EXTENSION_FEE rows"
      - "calculations.landowner_paid_ledger"
      - "when called from EXECUTED: parcel.status := QUALIFIED (compensating release)"
      - "LANDOWNER_POSTURE_SYNC(landowner_id)"

  # ------------------------------------------------------------ corridors
  - method: POST
    path: "/land-origination/corridors"
    description: "Plan a collection-line or interconnection corridor. buffer_m defaults to 50 and widens the station-conflict test for every crossing on the corridor."
    roles: [LandAgent]
    code: 201
    input: [route_name, total_length_m, voltage_class, "buffer_m?"]
    output: Corridor
    side_effects: ["status := PLANNED", "granted_crossing_count := 0"]

  - method: POST
    path: "/land-origination/corridors/{corridorId}/permit"
    description: "Record the corridor's route permit. No crossing may be granted until the corridor is PERMITTED."
    roles: [PortfolioManager]
    code: 200
    input: []
    output: Corridor
    side_effects: ["status := PERMITTED", "permitted_at := clock"]

  # -------------------------------------------------- crossing agreements
  - method: POST
    path: "/land-origination/crossing-agreements"
    description: "Propose a crossing over a parcel for a station range and occupancy window. Prices the crossing per §1.3 crossing_compensation and rejects buffer-expanded station overlaps that also overlap in time."
    roles: [LandAgent]
    code: 201
    input: [corridor_id, parcel_id, crossing_kind, station_start_m, station_end_m, occupancy_window_start, occupancy_window_end]
    output: CrossingAgreement
    side_effects:
      - "status := PROPOSED"
      - "calculations.crossing_compensation (occupied_m, duration_days, long_occupancy_surcharge_bps, compensation_cents)"

  - method: POST
    path: "/land-origination/crossing-agreements/{crossingId}/grant"
    description: "Landowner grant of the proposed crossing, countersigned by the portfolio manager. Requires the corridor to be PERMITTED."
    roles: [PortfolioManager]
    code: 200
    input: []
    output: CrossingAgreement
    side_effects: ["status := GRANTED", "granted_at := clock", "corridor.granted_crossing_count += 1"]

  # ------------------------------------------------- site access bookings
  - method: POST
    path: "/land-origination/site-access-bookings"
    description: "Book a survey/geotech/title-inspection crew onto a parcel for a half-open window. Aggregate crew_count across intersecting BOOKED and COMPLETED windows may not exceed PARCEL_MAX_CONCURRENT_CREWS."
    roles: [LandAgent, TitleCounsel]
    code: 201
    input: [parcel_id, purpose, window_start, window_end, crew_count]
    output: SiteAccessBooking
    side_effects: ["status := BOOKED"]

  - method: POST
    path: "/land-origination/site-access-bookings/{bookingId}/cancel"
    description: "Cancel a booking, freeing its crew allocation for other bookings in the same window."
    roles: [LandAgent, TitleCounsel]
    code: 200
    input: []
    output: SiteAccessBooking
    side_effects: ["status := CANCELLED", "cancelled_at := clock", "crew allocation released"]

  # -------------------------------------------------------------- leases
  - method: POST
    path: "/land-origination/leases/{leaseId}/post-security"
    description: "Post decommissioning/reclamation security against the lease's total_security_required_cents. May be posted in instalments; over-posting is refused."
    roles: [PaymentAdministrator]
    code: 200
    input: [amount_cents]
    output: LeaseAgreement
    side_effects: ["security_posted_cents += amount_cents", "version += 1"]

  - method: POST
    path: "/land-origination/leases/{leaseId}/submit-memo"
    description: "Submit the memorandum (notice) of lease to the county for recording. Requires the decommissioning security to be fully posted."
    roles: [PortfolioManager]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: ["recording_status := MEMO_SUBMITTED", "memo_submitted_at := clock"]

  - method: POST
    path: "/land-origination/leases/{leaseId}/record-memo"
    description: "Record the memorandum of lease with the county recorder. Requires the landowner's W-9 on file. Flips the invoice variant selector: every RentInvoice created after this point is FINAL_AS_BUILT."
    roles: [PortfolioManager]
    code: 200
    input: [recording_instrument_no]
    output: LeaseAgreement
    side_effects:
      - "recording_status := RECORDED, recorded_at := clock, recording_instrument_no := <input>"
      - "parcel.status := LEASED (OPTIONED -> LEASED)"
      - "LANDOWNER_POSTURE_SYNC(landowner_id) -> UNDER_OPTION -> UNDER_LEASE"

  - method: POST
    path: "/land-origination/leases/{leaseId}/rent-invoices"
    description: "Raise the annual rent invoice for one period_year. Guarded by optimistic concurrency (§1.2.1 invoice-create-stale-lease): expected_lease_agreement_version must equal the lease's current version, which post-security, submit-memo and record-memo all bump. The recording_status at this instant selects the PROVISIONAL or FINAL_AS_BUILT variant of §1.3 annual_rent_amount."
    roles: [PaymentAdministrator]
    code: 201
    input: [expected_lease_agreement_version, period_year, production_mwh]
    output: RentInvoice
    side_effects:
      - "status := DRAFT"
      - "calculations.annual_rent_amount (rent_variant, acre_basis, per_acre_component_cents, royalty_component_cents, gross_rent_cents)"
      - "lease.version += 1 (OCC parent bump)"

  - method: POST
    path: "/land-origination/rent-invoices/{invoiceId}/issue"
    description: "Issue the invoice to the landowner. Stamps due_at = issued_at + INVOICE_NET_DAYS."
    roles: [PaymentAdministrator]
    code: 200
    input: []
    output: RentInvoice
    side_effects: ["status := ISSUED", "issued_at := clock", "due_at := issued_at + INVOICE_NET_DAYS days"]

  - method: POST
    path: "/land-origination/rent-invoices/{invoiceId}/pay"
    description: "Record payment of the invoice in full. Clears any delinquency on the lease and advances last_paid_invoice_year."
    roles: [PaymentAdministrator]
    code: 200
    input: [paid_amount_cents]
    output: RentInvoice
    side_effects:
      - "status := PAID, paid_at := clock, paid_amount_cents := <input>"
      - "lease.last_paid_invoice_year := period_year"
      - "lease.rent_status := CURRENT"
      - "landowner ledger unaffected (rent is not option consideration)"

  - method: POST
    path: "/land-origination/rent-invoices/{invoiceId}/void"
    description: "Void a draft or issued invoice, freeing its period_year for a re-issue under whichever variant then applies."
    roles: [PaymentAdministrator]
    code: 200
    input: [void_reason]
    output: RentInvoice
    side_effects: ["status := VOID", "void_reason := <input>", "the (lease, period_year) slot becomes available again"]

  # ------------------------------------------------------- logical clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Test-driving endpoint (§1.5 priority ladder rung 3). Sets the server's
      logical clock, then runs the four time sweeps in this pinned order, each
      over its candidate set in created_at ASC order:
        S1 option expiry: every OptionAgreement in status EXECUTED whose
           option_expiry_at is <= the new clock becomes EXPIRED; its parcel
           returns from OPTIONED to QUALIFIED and LANDOWNER_POSTURE_SYNC runs.
           option_expiry_at is null before execution, so no pre-execution status
           is ever swept.
        S2 consent expiry: every NeighborConsent in REQUESTED whose
           consent_expiry_at <= the new clock becomes EXPIRED (a REQUESTED
           consent releases no acreage, so no acreage cascade fires).
        S3 booking completion: every SiteAccessBooking in BOOKED whose
           window_end <= the new clock becomes COMPLETED.
        S4 lease delinquency: every LeaseAgreement whose rent_status is
           CURRENT or PENDING_FIRST_RENT and which has at least one RentInvoice
           in ISSUED with due_at <= the new clock becomes DELINQUENT.
      The server's startup default logical clock is exactly
      2026-08-01T00:00:00Z: before any call to this endpoint the clock reads
      that instant and MUST NOT fall back to real wall-clock time.
    roles: [LandAgent, TitleCounsel, PortfolioManager, PaymentAdministrator]
    code: 200
    input: [current_utc]
    output: { current_utc: string, expired_option_count: integer, expired_consent_count: integer, completed_booking_count: integer, delinquent_lease_count: integer }
    side_effects:
      - "S1 option expiry sweep, then S2 consent expiry sweep, then S3 booking completion sweep, then S4 lease delinquency sweep"

# =============================================================================
# §1.6 Error Code Catalog — 41 codes, every one triggerable by at least one
# §1.5 endpoint. Grouped: auth (2), not-found (11), request shape (3),
# concurrency + state (6), safety/title (5), deal constraints (8),
# temporal (3), fiscal (3).
# =============================================================================
errors:

  - id: ERR_MISSING_USER_ID
    http: 401
    condition: "X-User-ID or X-User-Role header absent or empty on any request."

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not a declared role, or is not listed in the target endpoint's roles."

  - id: ERR_LANDOWNER_NOT_FOUND
    http: 404
    condition: "No Landowner exists with the id given in the path or in landowner_id."

  - id: ERR_PARCEL_NOT_FOUND
    http: 404
    condition: "No Parcel exists with the id given in the path or in parcel_id."

  - id: ERR_SETBACK_RULE_NOT_FOUND
    http: 404
    condition: "No SetbackRule exists with the id given in setback_rule_id."

  - id: ERR_NEIGHBOR_CONSENT_NOT_FOUND
    http: 404
    condition: "No NeighborConsent exists with the id given in the path."

  - id: ERR_TITLE_CURATIVE_ITEM_NOT_FOUND
    http: 404
    condition: "No TitleCurativeItem exists with the id given in the path or in blocks_item_id."

  - id: ERR_OPTION_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No OptionAgreement exists with the id given in the path or in option_agreement_id."

  - id: ERR_CORRIDOR_NOT_FOUND
    http: 404
    condition: "No Corridor exists with the id given in the path or in corridor_id."

  - id: ERR_CROSSING_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No CrossingAgreement exists with the id given in the path."

  - id: ERR_SITE_ACCESS_BOOKING_NOT_FOUND
    http: 404
    condition: "No SiteAccessBooking exists with the id given in the path."

  - id: ERR_LEASE_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No LeaseAgreement exists with the id given in the path."

  - id: ERR_RENT_INVOICE_NOT_FOUND
    http: 404
    condition: "No RentInvoice exists with the id given in the path."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Unparseable body, missing or null required field, wrong JSON type, unknown enum member, out-of-range numeric domain, or out-of-range limit/offset."

  - id: ERR_INVALID_STATION_RANGE
    http: 422
    condition: "station_end_m <= station_start_m, station_start_m < 0, or station_end_m > Corridor.total_length_m on a crossing proposal."

  - id: ERR_INVALID_WINDOW_RANGE
    http: 422
    condition: "The half-open interval is empty or inverted: occupancy_window_end <= occupancy_window_start, or window_end <= window_start."

  - id: ERR_STALE_PARCEL_VERSION
    http: 412
    condition: "expected_parcel_version does not equal the referenced Parcel's current version on POST /land-origination/option-agreements."

  - id: ERR_STALE_LEASE_VERSION
    http: 412
    condition: "expected_lease_agreement_version does not equal the referenced LeaseAgreement's current version on POST /land-origination/leases/{leaseId}/rent-invoices."

  - id: ERR_CONSENT_EXPIRED
    http: 422
    condition: "A grant is attempted on a NeighborConsent whose consent_expiry_at is at or before the current logical clock."

  - id: ERR_OPTION_EXPIRED
    http: 422
    condition: "An accept, execute, extend or exercise is attempted on an OptionAgreement whose option_expiry_at is at or before the current logical clock. Reported in preference to ERR_LANDOWNER_PAYMENT_HOLD."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity's current status does not admit the requested transition, including repeats of an already-applied transition."

  - id: ERR_ALREADY_RECORDED
    http: 409
    condition: "A memo submission or recording is attempted on a LeaseAgreement whose recording_status is already RECORDED."

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "The X-User-ID clearing or waiving a TitleCurativeItem equals the created_by_user_id that raised it, or the X-User-ID exercising an OptionAgreement equals the executed_by_user_id that executed it."

  - id: ERR_TITLE_CURATIVE_BLOCKING
    http: 422
    condition: "A crossing proposal, an option exercise, or a memorandum submission touches a Parcel whose blocking_curative_open_count is greater than zero. Reported in preference to ERR_CORRIDOR_STATION_CONFLICT."

  - id: ERR_CURATIVE_BLOCKED_PREDECESSOR
    http: 422
    condition: "A clear or waive is attempted on a TitleCurativeItem still in status BLOCKED because the item named by blocks_item_id is unresolved."

  - id: ERR_SECURITY_NOT_POSTED
    http: 422
    condition: "A memorandum of lease is submitted while security_posted_cents is below total_security_required_cents."

  - id: ERR_W9_MISSING
    http: 422
    condition: "A memorandum of lease is recorded while the lease's Landowner has w9_on_file false."

  - id: ERR_PARCEL_APN_DUPLICATE
    http: 409
    condition: "A Parcel already exists with the same (apn, county_fips) pair."

  - id: ERR_PROHIBITED_ZONING
    http: 422
    condition: "zoning_code is a member of PROHIBITED_ZONING_CODES (RES1, CONS1)."

  - id: ERR_PARCEL_NOT_QUALIFIED
    http: 422
    condition: "Option terms are sent to the landowner while the underlying Parcel is not in status QUALIFIED."

  - id: ERR_EXTENSION_LIMIT_REACHED
    http: 422
    condition: "An extension is requested when extensions_used already equals extension_count_allowed. Reported in preference to ERR_LANDOWNER_PAYMENT_HOLD."

  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 422
    condition: "A counter is submitted when round_index already equals MAX_NEGOTIATION_ROUNDS (3)."

  - id: ERR_WAIVER_LIMIT_REACHED
    http: 422
    condition: "A BLOCKING title defect is waived when the Parcel's waived_blocking_count already equals MAX_WAIVED_BLOCKING_PER_PARCEL (1)."

  - id: ERR_CORRIDOR_NOT_PERMITTED
    http: 422
    condition: "A crossing is granted while its Corridor is still in status PLANNED."

  - id: ERR_DUPLICATE_INVOICE_PERIOD
    http: 409
    condition: "period_year is outside [1, LEASE_TERM_YEARS], or a RentInvoice in DRAFT, ISSUED or PAID already exists on the lease for that period_year."

  - id: ERR_CORRIDOR_STATION_CONFLICT
    http: 409
    condition: "A proposed crossing overlaps another PROPOSED or GRANTED crossing on the same corridor in both the buffer-expanded station range and the half-open occupancy window."

  - id: ERR_CREW_CAPACITY_EXCEEDED
    http: 409
    condition: "The sum of crew_count over intersecting BOOKED and COMPLETED bookings on the parcel plus the requested crew_count exceeds PARCEL_MAX_CONCURRENT_CREWS (3)."

  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "A site-access booking's window_start is strictly before the current logical clock."

  - id: ERR_LANDOWNER_PAYMENT_HOLD
    http: 422
    condition: "A cash-moving operation (execute, extend, exercise, invoice payment) targets a Landowner with payment_hold true."

  - id: ERR_SECURITY_OVERPOSTED
    http: 422
    condition: "security_posted_cents + amount_cents would exceed total_security_required_cents."

  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "paid_amount_cents does not equal the invoice's gross_rent_cents exactly."

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
#
# The origination pipeline splits into four operator functions plus the
# counterparty. The two segregation rules that carry teeth:
#   * the TitleCounsel user who RAISES a curative item may not be the
#     TitleCounsel user who CLEARS or WAIVES it (validation priority 25);
#   * commercial terms are negotiated by LandAgent and the Landowner, but only
#     PortfolioManager can execute, extend or exercise the instrument, and only
#     PaymentAdministrator can touch payable flags, security and rent.
# =============================================================================
roles:

  - name: LandAgent
    description: "Origination agent. Screens parcels, requests neighbor consents, drafts and revises option terms, plans corridors, proposes crossings and books crews. Cannot execute an instrument, cannot clear title, cannot move money."
    identity: "opaque"
    exclusive_operations:
      - "POST /land-origination/landowners"
      - "POST /land-origination/parcels"
      - "POST /land-origination/parcels/{parcelId}/rescreen"
      - "POST /land-origination/neighbor-consents"
      - "POST /land-origination/neighbor-consents/{consentId}/grant"
      - "POST /land-origination/neighbor-consents/{consentId}/revoke"
      - "POST /land-origination/option-agreements"
      - "POST /land-origination/option-agreements/{optionId}/send"
      - "POST /land-origination/option-agreements/{optionId}/revise"
      - "POST /land-origination/corridors"
      - "POST /land-origination/crossing-agreements"
    shared_operations:
      - "POST /land-origination/option-agreements/{optionId}/withdraw (with PortfolioManager)"
      - "POST /land-origination/site-access-bookings (with TitleCounsel)"
      - "POST /land-origination/site-access-bookings/{bookingId}/cancel (with TitleCounsel)"
      - "POST /_clock/set_current_utc (with all operator roles)"
      - "all GET reads except the option-payment and rent-invoice ledgers"

  - name: TitleCounsel
    description: "Title attorney. Publishes jurisdictional setback rules, raises title defects, and clears or waives them. Subject to segregation of duties: cannot resolve an item they themselves raised."
    identity: "opaque"
    exclusive_operations:
      - "POST /land-origination/setback-rules"
      - "POST /land-origination/title-curative-items"
      - "POST /land-origination/title-curative-items/{itemId}/clear"
      - "POST /land-origination/title-curative-items/{itemId}/waive"
    shared_operations:
      - "POST /land-origination/site-access-bookings (with LandAgent)"
      - "POST /land-origination/site-access-bookings/{bookingId}/cancel (with LandAgent)"
      - "POST /_clock/set_current_utc (with all operator roles)"
      - "GET reads on landowners, parcels, setback rules, consents, curative items, options, bookings and leases"

  - name: PortfolioManager
    description: "Deal principal. Executes, extends, exercises and withdraws option instruments, permits corridors, grants crossings, and drives the lease through memorandum submission and recording."
    identity: "opaque"
    exclusive_operations:
      - "POST /land-origination/option-agreements/{optionId}/execute"
      - "POST /land-origination/option-agreements/{optionId}/extend"
      - "POST /land-origination/option-agreements/{optionId}/exercise"
      - "POST /land-origination/corridors/{corridorId}/permit"
      - "POST /land-origination/crossing-agreements/{crossingId}/grant"
      - "POST /land-origination/leases/{leaseId}/submit-memo"
      - "POST /land-origination/leases/{leaseId}/record-memo"
    shared_operations:
      - "POST /land-origination/option-agreements/{optionId}/withdraw (with LandAgent)"
      - "GET /land-origination/leases/{leaseId}/rent-projection (with PaymentAdministrator)"
      - "POST /_clock/set_current_utc (with all operator roles)"
      - "all GET reads including the option-payment and rent-invoice ledgers"

  - name: PaymentAdministrator
    description: "Payables and compliance administrator. Owns the landowner payable flags (W-9, payment hold), decommissioning security postings, and the whole rent-invoice lifecycle. Cannot originate, negotiate or execute an instrument."
    identity: "opaque"
    exclusive_operations:
      - "PATCH /land-origination/landowners/{landownerId}"
      - "POST /land-origination/leases/{leaseId}/post-security"
      - "POST /land-origination/leases/{leaseId}/rent-invoices"
      - "POST /land-origination/rent-invoices/{invoiceId}/issue"
      - "POST /land-origination/rent-invoices/{invoiceId}/pay"
      - "POST /land-origination/rent-invoices/{invoiceId}/void"
    shared_operations:
      - "GET /land-origination/leases/{leaseId}/rent-projection (with PortfolioManager)"
      - "POST /_clock/set_current_utc (with all operator roles)"
      - "GET reads on landowners, parcels, options, option payments, crossings, leases and rent invoices"

  - name: Landowner
    description: "The counterparty. X-User-ID is the id of a Landowner row; the landowner may only counter or accept option terms on their own instruments and read their own instruments, payments, leases and invoices."
    identity: "entity_backed:Landowner"
    exclusive_operations:
      - "POST /land-origination/option-agreements/{optionId}/counter"
      - "POST /land-origination/option-agreements/{optionId}/accept"
    shared_operations:
      - "GET /land-origination/landowners/{landownerId} (own record)"
      - "GET /land-origination/option-agreements and /land-origination/option-agreements/{optionId} (own instruments)"
      - "GET /land-origination/option-payments and /land-origination/option-payments/{paymentId} (own consideration)"
      - "GET /land-origination/leases and /land-origination/leases/{leaseId} (own leases)"
      - "GET /land-origination/rent-invoices and /land-origination/rent-invoices/{invoiceId} (own invoices)"
