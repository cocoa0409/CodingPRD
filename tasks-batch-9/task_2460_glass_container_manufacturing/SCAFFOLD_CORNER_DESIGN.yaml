      - name: campaign_window_order_invalid_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_33
          - errors.ERR_WINDOW_ORDER_INVALID
          - endpoints.POST_/glass-plant/campaigns
        distinguishing_aspect: |
          window_end_at must be strictly after window_start_at, and because priority 4 inspects each field
          only in isolation this cross-field violation surfaces as 422 ERR_WINDOW_ORDER_INVALID rather than
          400 ERR_VALIDATION; equal endpoints are refused, one second later is accepted.
        test_recipe:
          setup:
            - "Furnace FUR-V5 (300.00 tpd, life 100000.00)"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-V5", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
