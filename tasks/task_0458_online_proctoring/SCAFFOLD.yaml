    roles: [SchedulingCoordinator, ReviewOfficer]
    code: 200
    input: []
    output: Institution
    side_effects: []

  # ---- Proctor ----
  - method: POST
    path: "/proctors"
    description: "Register a proctor / review officer"
    roles: [SchedulingCoordinator]
    code: 201
    input: [institution_id, full_name, "concurrent_capacity?"]
    output: Proctor
    side_effects: ["status=AVAILABLE, active_session_count=0, load_factor=0"]

  - method: GET
    path: "/proctors/{proctor_id}"
