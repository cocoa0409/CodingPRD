          trigger:
            - { call: "POST /assignments", payload: { section_id: "${s2_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SECTION_NOT_ASSIGNABLE (state, priority 5)"
            - "error_id != ERR_MEETING_TIME_CONFLICT (business_temporal, priority 7), even though 09:30-10:30 overlaps S1's 09:00-10:00 on MON"

      - name: referential_precedes_constraint_on_assignment_create
