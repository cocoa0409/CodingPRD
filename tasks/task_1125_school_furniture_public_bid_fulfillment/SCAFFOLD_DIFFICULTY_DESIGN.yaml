  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: po_intake_requires_award_accepted
        grounds:
          - state_machines.PurchaseOrder.transitions
          - validations[priority=7]
          - entities.Award.fields.status
        distinguishing_aspect: |
          Entity pair PurchaseOrder -> Award: POST /v1/purchase-orders against an Award still in
          ISSUED (never accepted) is rejected with ERR_AWARD_NOT_ACTIVE; the same call succeeds
          after Award accept — a different entity pair than WarrantyClaim -> POLine.
        test_recipe:
          setup:
            - "District D1; spec published and closed; award created and left in ISSUED (no accept call)"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id, award_status: $.data.status } }
          trigger:
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id, po_status: $.data.status } }
          assert:
            - "award_status == ISSUED at setup"
            - "err == ERR_AWARD_NOT_ACTIVE (PO intake gated on Award state)"
            - "After accept, the identical call succeeds: po_status == RECEIVED"

      - name: warranty_claim_requires_poline_verified
        grounds:
          - state_machines.WarrantyClaim.transitions
          - validations[priority=7]
          - entities.POLine.fields.status
