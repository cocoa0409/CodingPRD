    code: 200
    input: [start_date, end_date]
    output: Subscription
    side_effects: ["status = PAUSED; current_pause_start_date and current_pause_end_date set; next_cycle_charge recomputed (pause_proration variant)", "increments Subscription.version by 1"]

  - method: POST
    path: "/subscriptions/{id}/resume"
    description: "Close the open pause window and return to ACTIVE"
    roles: [Subscriber, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
