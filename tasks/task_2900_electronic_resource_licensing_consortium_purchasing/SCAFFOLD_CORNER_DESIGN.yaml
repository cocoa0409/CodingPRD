          - endpoints.POST_/erm/renewal-decisions/{id}/open-vote
        distinguishing_aspect: |
          open-vote is an action endpoint with two preconditions (decision DRAFT, subscription ACTIVE with
          at least one CONFIRMED commitment) and a calculation side effect: the preliminary offer must be
          stamped in the same call. With vendor_requested_increase_pct 0.00, no usage and no SLA credit the
          offer is exactly the current 9000000 cents, band NO_USE, and the decision moves to VOTING with
          quorum_met still false.
        test_recipe:
          setup:
            - "The subscription is signed at 9000000 cents and ACTIVE from 2027-01-02 with Alpha as its single CONFIRMED participant at 4500000 cents."
            - "A RENEW decision with vendor_requested_increase_pct 0.00 was created against the observed subscription version and is still DRAFT, so no offer figures have been computed yet."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
