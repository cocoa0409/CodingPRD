          window_end: '2026-08-05T00:00:00Z'
        as: IncidentCommander
      - call: POST /emergency/alternate-care-sites/${site_id}/activate
        as: IncidentCommander
      - call: POST /emergency/patient-records
        payload:
          incident_id: ${inc_id}
          patient_ref: P-1
          triage_category: DELAYED
          arrival_at: '2026-08-01T00:05:00Z'
        as: PlanningChief
        captures:
          p1: $.data.id
      - call: POST /emergency/patient-records
        payload:
          incident_id: ${inc_id}
          patient_ref: P-2
          triage_category: DELAYED
          arrival_at: '2026-08-01T00:06:00Z'
        as: PlanningChief
        captures:
          p2: $.data.id
      - call: POST /emergency/patient-records
        payload:
          incident_id: ${inc_id}
          patient_ref: P-3
          triage_category: MINOR
          arrival_at: '2026-08-01T00:07:00Z'
        as: PlanningChief
        captures:
          p3: $.data.id
      - call: POST /emergency/patient-records/${p1}/transfer
        payload:
          site_id: ${site_id}
        as: PlanningChief
      - call: POST /emergency/patient-records/${p2}/transfer
        payload:
          site_id: ${site_id}
        as: PlanningChief
      trigger:
      - call: POST /emergency/patient-records/${p3}/transfer
        payload:
          site_id: ${site_id}
        as: PlanningChief
        captures:
          err: $.data.error_id
      - call: POST /emergency/patient-records/${p1}/discharge
        as: PlanningChief
      - call: POST /emergency/patient-records/${p3}/transfer
        payload:
          site_id: ${site_id}
        as: PlanningChief
      - call: GET /emergency/alternate-care-sites/${site_id}
        as: PlanningChief
        captures:
          census: $.data.current_census
      assert:
      - ${err} == ERR_ACS_AT_CAPACITY (HTTP 422) at census 2 == capacity 2
      - Discharging the TRANSFERRED p1 releases the bed (census back to 1)
      - ${census} == 2 after p3's retry succeeds
  - name: tier_excludes_committed_not_activated_sites
