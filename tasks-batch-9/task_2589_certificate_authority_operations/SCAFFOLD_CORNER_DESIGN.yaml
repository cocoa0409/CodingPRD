            - call: "POST /ca/misissuance-incidents"
              payload: { title: "Scope incident including the certificate", category: "DOMAIN_MISISSUANCE", scope_profile_id: "${profile_id}", scope_issued_from: "2026-08-01T00:30:00Z", scope_issued_to: "2026-08-01T00:31:00Z" }
              as: COMPLIANCE_AUDITOR
