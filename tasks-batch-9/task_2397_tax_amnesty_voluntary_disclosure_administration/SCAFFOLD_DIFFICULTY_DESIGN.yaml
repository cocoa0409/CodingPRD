  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: participation_window_closes_at_the_exact_instant
        grounds:
          - validations[priority=23]
          - entities.AmnestyProgram.fields.window_close_at
          - errors[ERR_PROGRAM_WINDOW_CLOSED]
        distinguishing_aspect: |
          The window predicate is STRICT: at 2026-11-30T23:59:59Z, one second before close,
          drafting succeeds; at exactly 2026-12-01T00:00:00Z it fails with
          ERR_PROGRAM_WINDOW_CLOSED even though the program row is still OPEN, so an
          implementation using clock_now <= window_close_at admits one extra participant.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with window_close_at 2026-12-01T00:00:00Z and one SALES_USE term"
            - "Taxpayer Kestrel Logistics is registered and has no enforcement cases"
            - "The clock is advanced to 2026-11-30T23:59:59Z, one second inside the window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
