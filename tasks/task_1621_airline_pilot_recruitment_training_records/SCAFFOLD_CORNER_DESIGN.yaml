            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en}", instructor_id: "${ca1}", phase: "IOE", event_type: "SESSION", scheduled_start: "2026-08-15T11:00:00Z", scheduled_end: "2026-08-15T11:30:00Z" }, as: TrainingCoordinator, captures: { io3: $.data.id } }
