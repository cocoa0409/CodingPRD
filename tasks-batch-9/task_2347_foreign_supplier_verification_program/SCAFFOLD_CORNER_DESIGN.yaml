              payload: { action: "CLAIM", exemption_type: "SMALL_IMPORTER_MODIFIED", basis_note: "Very small importer relying on modified requirements for this combination" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
          trigger:
            - call: "POST /fsvp/supplier-food-pairs/${pair1}/exemption"
              payload: { action: "VERIFY", determination_note: "Small importer status verified from the filed sales records" }
              as: ComplianceOfficer
              captures: { pair_exemption: $.data.exemption_status }
          assert:
            - "HTTP 200"
            - "SupplierFoodPair.${pair1}.exemption_status == VERIFIED and exemption_type == SMALL_IMPORTER_MODIFIED"
            - "SupplierFoodPair.${pair1}.modified_requirements_only == true"
            - "SupplierFoodPair.${pair1}.entry_eligibility_status == ELIGIBLE while verification_status stays DRAFT"
            - "SupplierFoodPair.${pair1}.version == 3 (create 1, CLAIM 2, VERIFY 3)"
            - "Importer.${imp}.record_retention_months == 36, so a record performed 2026-10-06 would retain until 2029-10-06 rather than 2028-10-06"

      - name: cascading_side_effects_across_the_full_suspension_chain
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: fail_attestation_suspension_chain
          rationale: "That §1.8 instance walks all six hops end to end from one attestation — record → supplier score → supplier status → pair lapse → corrective action → importer rollup — and pins the ordering-sensitive pre_action_blocked_pair_count read, which is strictly stronger than any single-hop corner check."
      - name: cascade_ordering_and_partial_replan_on_an_import_alert
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: import_alert_replanning_chain
          rationale: "The compliance-status PATCH cascade — recompute, then lapse only the pairs whose plan no longer clears its floor, then push their APPROVED activities back to CHANGES_REQUESTED — is asserted there hop by hop, including the pairs deliberately left untouched."
      - name: dual_variant_supplier_performance_scores
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: supplier_performance_provisional_diverges_from_final_on_unattested_fail
          rationale: "Both variants and the delta on switch are computed there from the same record set, and its companion §1.8 instance pair_adequacy_planned_diverges_from_realized_after_one_attestation does the same for the adequacy pair."

