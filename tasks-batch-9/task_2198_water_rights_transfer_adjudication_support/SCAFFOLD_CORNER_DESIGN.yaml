      - name: sm_decree_docket_reranks_seniority_and_bubbles_up_on_last_decree
        claim_type: side_effect_execution
        grounds:
          - state_machines.DecreeDocket.OBJECTION_PERIOD_to_DECREE_ENTERED
          - state_machines.AdjudicationClaim.EXAMINED_to_DECREED
