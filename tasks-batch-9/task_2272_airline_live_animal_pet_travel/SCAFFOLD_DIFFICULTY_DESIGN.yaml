          trigger:
            - { call: "POST /segment-assignments/${seg1}/accept", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          assert:
            - "SegmentAssignment.${seg1}.fee_variant == FINAL_AT_ACCEPTANCE and SegmentAssignment.${seg1}.segment_fee_amount == 37560"
            - "SegmentAssignment.${seg2}.fee_variant == PROVISIONAL_AT_RESERVATION and SegmentAssignment.${seg2}.segment_fee_amount == 27650"
            - "Reservation.${res1}.subtotal_amount == 65210"
            - "Reservation.${res1}.loyalty_tier_pct == 0.05"
            - "Reservation.${res1}.loyalty_discount_amount == 3261"
            - "Reservation.${res1}.net_payable_amount == 61949"

  - rule_id: combinatorial_formula
    instances:
      - name: container_requirement_matrix_emits_ordered_deficiency_codes
        grounds:
          - calculations.container_compliance_evaluation
          - entities.AnimalRecord.fields.deficiency_codes
          - entities.AnimalRecord.fields.container_compliance_state
          - state_machines.AnimalRecord.DRAFT_to_SCREENED
        distinguishing_aspect: |
          Mode (a) instance: the container verdict is a non-linear function of five inputs (shoulder height,
          nose-to-tail length, chargeable weight derived from max(gross, volumetric), container geometry and
          the reservation routing) whose thresholds are ceilings and step functions, and it emits the four
          deficiency codes HEIGHT, LENGTH, VENT_PCT, VENT_SIDES in a fixed order for a 30 kg animal.
        test_recipe:
          setup:
            - "SpeciesProfile DOG, ContainerModel K9-L (60x40x45 cm, tare 7 kg, vent 15 pct, 3 ventilated sides)"
            - "CHECKED reservation with an AnimalRecord of height 45 cm, length 60 cm, declared 30 kg, so gross 37 kg beats volumetric 18 kg and chargeable_weight_kg is 37"
            - "Required values are height 53 cm, length 69 cm, ventilation 16 pct and 4 ventilated sides - the container fails all four"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Ito", contact_email: "ito@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Kuma", breed_name: "Akita", declared_weight_kg: 30, height_at_shoulder_cm: 45, length_nose_to_tail_cm: 60, age_weeks: 60 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
          trigger:
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          assert:
            - "AnimalRecord.${an1}.status == SCREENED"
            - "AnimalRecord.${an1}.chargeable_weight_kg == 37"
            - "AnimalRecord.${an1}.container_compliance_state == DEFICIENT"
            - "AnimalRecord.${an1}.deficiency_codes == [HEIGHT, LENGTH, VENT_PCT, VENT_SIDES]"

      - name: snub_nosed_cargo_fee_rounds_per_segment_before_summing
        grounds:
          - calculations.animal_travel_fee
          - calculations.reservation_charge_assembly
          - entities.BreedRestriction.fields.restriction_type
          - entities.SegmentAssignment.fields.segment_fee_amount
        distinguishing_aspect: |
          Mode (b) instance: rounding order is the whole point. The snub-nosed multiplier gives 40422.5 on
          each 27 kg CARGO segment, and the long-haul multiplier is applied to the ALREADY-ROUNDED 40423,
          yielding 48508 + 40423 = 88931; summing the unrounded segment values first and rounding once would
          yield 88930, so the pinned round-per-segment-then-sum order is observable in the subtotal.
        test_recipe:
          setup:
            - "SpeciesProfile DOG with an ACTIVE SNUB_NOSED BreedRestriction for Bulldog"
            - "ContainerModel K9-L (tare 7 kg, volumetric 18 kg); animal declared 20 kg so chargeable_weight_kg is 27 and the CARGO weight component is 7650"
            - "CARGO reservation with two RESERVED segments: AN101 HKG->LAX with block_minutes 780 (long-haul) and AN205 LAX->JFK with block_minutes 300 (not long-haul), connection 120 minutes which is exactly the CARGO minimum"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /breed-restrictions", payload: { species_profile_id: "${sp_dog}", breed_name: "Bulldog", restriction_type: "SNUB_NOSED" }, as: ProgramAdmin, as_user_id: "admin-01", captures: { br_snub: $.data.id } }
