# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_0453_creator_membership  |  Difficulty tier: EXPERT
# Breadth probe across claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: creator_create_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Creator.fields.platform_plan, entities.Creator.fields.billing_mode, entities.Creator.fields.charge_timing]
        distinguishing_aspect: "POST /creators with only required fields returns 201; platform_plan defaults STARTER, billing_mode MONTHLY, charge_timing UP_FRONT, status ACTIVE, pending_payout_cents 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /creators"
              payload: { display_name: "Solo", email: "solo@x.com", payout_account_ref: "acct_solo" }
              as: Creator
              captures: { c_id: $.data.id, plan: $.data.platform_plan }
          assert:
            - "response code 201; Creator.${c_id}.platform_plan == STARTER"
            - "Creator.${c_id}.billing_mode == MONTHLY and charge_timing == UP_FRONT and status == ACTIVE and pending_payout_cents == 0 and version == 1"

      - name: creator_get_nonexistent_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_CREATOR_NOT_FOUND]"]
        distinguishing_aspect: "GET /creators/{bogus} returns 404 ERR_CREATOR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /creators/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "GET returns 404 ERR_CREATOR_NOT_FOUND"

      - name: tier_create_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Tier.fields.billing_model, "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /tiers missing billing_model (required) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A creator exists."]
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", email: "ctier@x.com", payout_account_ref: "acct_t" }
              as: Creator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "T", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /tiers returns 400 ERR_INVALID_REQUEST (billing_model missing)"

      - name: patron_wallet_credit_is_system_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Patron.fields.wallet_credit_cents]
        distinguishing_aspect: "wallet_credit_cents is computed: POST /patrons ignores any client-supplied wallet value and starts at 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patrons"
              payload: { display_name: "P", email: "pcomp@x.com" }
              as: Patron
              captures: { p_id: $.data.id, wallet: $.data.wallet_credit_cents }
          assert:
            - "Patron.${p_id}.wallet_credit_cents == 0 and status == ACTIVE"

      - name: postaccess_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.PostAccess]
        distinguishing_aspect: "PostAccess has common_fields:false — its grant carries id + created_at only, no version, and no update endpoint exists."
        test_recipe:
          setup: ["A published rank-0 (public) post exists; patron requests access."]
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", email: "cpa@x.com", payout_account_ref: "acct_pa" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /posts"
              payload: { creator_id: "${c_id}", title: "free", body: "b", min_tier_rank: 0 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { post_id: $.data.id }
            - call: "POST /posts/${post_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "P", email: "ppa@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /posts/${post_id}/access"
              payload: { patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { grant_id: $.data.id, rank: $.data.granted_tier_rank }
          assert:
            - "PostAccess grant created with code 201; granted_tier_rank == 0 (public access snapshot)"
            - "response has no version field on the PostAccess object"

      - name: tier_invalid_enum_billing_model_rejected
        claim_type: Type Constraints
        grounds: [entities.Tier.fields.billing_model, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /tiers with billing_model not in {MONTHLY, PER_CREATION} returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A creator exists."]
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", email: "cenum@x.com", payout_account_ref: "acct_e" }
              as: Creator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "T", billing_model: "HOURLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /tiers returns 400 ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: tier_publish_from_published_returns_not_published
        claim_type: Invalid Transitions
        grounds: [state_machines.Tier.DRAFT_to_PUBLISHED, "errors[ERR_TIER_NOT_PUBLISHED]"]
        distinguishing_aspect: "Publishing an already-PUBLISHED tier (not in DRAFT) returns 409 ERR_TIER_NOT_PUBLISHED; no side effects fire."
        test_recipe:
          setup: ["A PUBLISHED tier exists."]
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", email: "cpub@x.com", payout_account_ref: "acct_p" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "T", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Second publish returns 409 ERR_TIER_NOT_PUBLISHED"

      - name: pledge_resume_from_active_returns_not_paused
        claim_type: Invalid Transitions
        grounds: [state_machines.Pledge.PAUSED_to_ACTIVE, "errors[ERR_PLEDGE_NOT_PAUSED]"]
        distinguishing_aspect: "Resuming an ACTIVE (not PAUSED) pledge returns 409 ERR_PLEDGE_NOT_PAUSED."
        test_recipe:
          setup: ["An ACTIVE pledge exists."]
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", email: "cres@x.com", payout_account_ref: "acct_r" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "T", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "P", email: "pres@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /charges/${ch_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /pledges/${pl_id}"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /pledges/${pl_id}/resume"
              payload: { expected_pledge_version: "${v0}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Resume on ACTIVE pledge returns 409 ERR_PLEDGE_NOT_PAUSED"

      - name: charge_settle_from_succeeded_returns_not_pending
        claim_type: Idempotency
        grounds: [state_machines.Charge.PENDING_to_SUCCEEDED, "errors[ERR_CHARGE_NOT_PENDING]"]
        distinguishing_aspect: "Settling a charge already SUCCEEDED a second time returns 409 ERR_CHARGE_NOT_PENDING (terminal-state lockdown)."
        test_recipe:
          setup: ["A SUCCEEDED charge exists."]
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", email: "cset@x.com", payout_account_ref: "acct_s" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "T", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "P", email: "pset@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /charges/${ch_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /charges/${ch_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Second settle returns 409 ERR_CHARGE_NOT_PENDING; charge stays SUCCEEDED"

      - name: payout_reverse_from_paid_returns_not_reversible
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Payout.PENDING_to_PAID, "errors[ERR_PAYOUT_NOT_REVERSIBLE]"]
        distinguishing_aspect: "Reversing a PAID (terminal) payout returns 409 ERR_PAYOUT_NOT_REVERSIBLE."
        test_recipe:
          setup: ["A PAID payout exists (one SUCCEEDED charge swept then marked paid)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C", email: "cpaid@x.com", payout_account_ref: "acct_pd" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "T", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "P", email: "ppaid@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /charges/${ch_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /payouts"
              payload: { creator_id: "${c_id}", cycle_anchor_date: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { payout_id: $.data.id }
            - call: "POST /payouts/${payout_id}/mark-paid"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /payouts/${payout_id}/reverse"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Reverse on PAID payout returns 409 ERR_PAYOUT_NOT_REVERSIBLE"

      - name: conversation_close_then_message_returns_closed
        claim_type: Invalid Transitions
        grounds: [state_machines.Conversation.OPEN_to_CLOSED, "errors[ERR_CONVERSATION_CLOSED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ppvc_state_vs_messaging_gate
          rationale: "Posting to a CLOSED conversation returning ERR_CONVERSATION_CLOSED is the asserted outcome of the named §1.8 priority-conflict instance."

      - name: pledge_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.Pledge.DRAFT_to_ACTIVE, entities.Pledge.fields.lifecycle_status]
        distinguishing_aspect: "A freshly created pledge (before first charge settles) starts lifecycle_status=DRAFT, billing_status=CURRENT."
        test_recipe:
          setup: ["A PUBLISHED tier; UP_FRONT creator. Pledge created but its INITIAL_PRORATION charge not yet settled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C", email: "cinit@x.com", payout_account_ref: "acct_i" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "T", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "P", email: "pinit@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id, life: $.data.lifecycle_status }
          assert:
            - "Pledge.${pl_id}.lifecycle_status == DRAFT and billing_status == CURRENT immediately after create"

      - name: pledge_activates_on_first_charge_settle
        claim_type: Side Effect Execution
        grounds: [state_machines.Charge.PENDING_to_SUCCEEDED, state_machines.Pledge.DRAFT_to_ACTIVE, calculations.active_pledge_count]
        distinguishing_aspect: "Settling the first INITIAL_PRORATION charge SUCCEEDED bubbles the pledge DRAFT→ACTIVE and increments Tier.active_pledge_count to 1."
        test_recipe:
          setup: ["A DRAFT pledge with a PENDING INITIAL_PRORATION charge (UP_FRONT, June 16)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C", email: "cact@x.com", payout_account_ref: "acct_a" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "T", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "P", email: "pact@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch_id: "$.data[0].id" }
          trigger:
            - call: "POST /charges/${ch_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /pledges/${pl_id}"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { life: $.data.lifecycle_status }
          assert:
            - "Pledge.${pl_id}.lifecycle_status == ACTIVE after settle"
            - "Tier.${tier_id}.active_pledge_count == 1"
            - "Pledge.${pl_id}.current_cycle_charged_cents == 750"

      - name: cancel_closes_orphaned_conversation_cascade
        claim_type: Cross-entity
        grounds: [state_machines.Pledge.ACTIVE_to_CANCELLED, state_machines.Conversation.OPEN_to_CLOSED]
        distinguishing_aspect: "Cancelling the patron's only ACTIVE/PAUSED pledge to a creator cascades the OPEN conversation with that creator to CLOSED."
        test_recipe:
          setup: ["An ACTIVE pledge and an OPEN conversation between the same patron and creator."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C", email: "ccc@x.com", payout_account_ref: "acct_cc" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "T", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /tiers/${tier_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "P", email: "pcc@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${tier_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /charges/${ch_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /conversations"
              payload: { creator_id: "${c_id}", patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { conv_id: $.data.id }
          trigger:
            - call: "POST /pledges/${pl_id}/cancel"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
            - call: "GET /conversations/${conv_id}"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { conv_status: $.data.status }
          assert:
            - "Conversation.${conv_id}.status == CLOSED after the pledge is cancelled"

  # ===========================================================================
  - section: calculations
    instances:
      - name: upgrade_up_front_charges_proration_delta
        claim_type: Variant Selection
        grounds: [calculations.initial_proration, entities.Charge.fields.charge_kind, state_machines.Pledge.ACTIVE_to_PAUSED]
        distinguishing_aspect: "Upgrading BASIC(800)→PLUS(1500) mid-cycle on an UP_FRONT creator at 2026-06-16 creates an UPGRADE_PRORATION charge of gross 350 (= round_half_up((1500-800)*15/30))."
        test_recipe:
          setup: ["ACTIVE BASIC pledge (800) on UP_FRONT creator with a PUBLISHED PLUS tier (1500); clock 2026-06-16."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creators"
              payload: { display_name: "C", email: "cup@x.com", payout_account_ref: "acct_u" }
              as: Creator
              captures: { c_id: $.data.id }
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "BASIC", billing_model: "MONTHLY", rank: 1, monthly_fee_cents: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { basic_id: $.data.id }
            - call: "POST /tiers/${basic_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /tiers"
              payload: { creator_id: "${c_id}", name: "PLUS", billing_model: "MONTHLY", rank: 2, monthly_fee_cents: 1500 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { plus_id: $.data.id }
            - call: "POST /tiers/${plus_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
            - call: "POST /patrons"
              payload: { display_name: "P", email: "pup@x.com" }
              as: Patron
              captures: { p_id: $.data.id }
            - call: "POST /pledges"
              payload: { patron_id: "${p_id}", creator_id: "${c_id}", tier_id: "${basic_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "GET /charges?pledge_id=${pl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { init_id: "$.data[0].id" }
            - call: "POST /charges/${init_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /pledges/${pl_id}"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /pledges/${pl_id}/upgrade"
              payload: { new_tier_id: "${plus_id}", expected_pledge_version: "${v0}" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "GET /charges?pledge_id=${pl_id}&status=PENDING"
              payload: {}
              as: PlatformAdmin
