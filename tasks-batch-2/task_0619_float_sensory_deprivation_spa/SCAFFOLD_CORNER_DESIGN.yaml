          setup: ["an inactive plan and a PENDING membership on it"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "OLD", monthly_fee_cents: 8000, included_floats_per_cycle: 4, rollover_cap: 4, retail_float_cents: 5000, active: false }
