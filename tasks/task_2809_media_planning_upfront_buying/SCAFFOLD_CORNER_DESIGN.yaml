      - name: placement_overcommit_cascade_is_observable_end_to_end
        claim_type: Cascade Executed
        grounds:
          - "endpoints[POST /upfront/buys/{buyId}/place]"
          - "state_machines.Campaign.plan_status.APPROVED_to_REVISION_REQUIRED"
        excluded_because:
          difficulty_instance: placement_overcommit_cascades_four_links_and_revokes_plan_approval
          rationale: |
            The four-link placement cascade - allocation committed_cents, allocation posture, campaign
            plan_posture, then plan_status APPROVED -> REVISION_REQUIRED with LOCKED allocations
            returning to DRAFT - is already asserted link by link, with literal cent values at every
            link, by the transitive_cascade instance in §1.8. Repeating it here would duplicate the same
            request sequence and the same assertions with nothing added.

      - name: provisional_and_final_delivery_indices_diverge_on_one_report_set
        claim_type: Variant Divergence
        grounds:
          - "calculations.post_buy_delivery_index"
          - "entities.Buy.fields.provisional_delivery_index"
        excluded_because:
          difficulty_instance: provisional_vs_final_delivery_index_diverge_on_same_reports
          rationale: |
            The dual-variant layer is exercised in §1.8 on the same input set, showing the PROVISIONAL
            index at 1.0250 while the FINAL index reads 0.4500 because acceptance and dispute change the
            membership of each variant's input set. A corner-case instance here could only re-run that
            comparison with different numbers.

      - name: outstanding_receivable_reconciles_across_issue_and_full_payment
        claim_type: Derived Field Reconciled
        grounds:
          - "entities.Advertiser.fields.outstanding_receivable_cents"
          - "endpoints[POST /upfront/invoices/{invoiceId}/issue]"
          - "endpoints[POST /upfront/invoices/{invoiceId}/record-client-payment]"
          - "calculations.invoice_net_payable"
        distinguishing_aspect: |
          The receivable is a derived rollup on a third entity: a DRAFT invoice contributes nothing, an
          ISSUED one contributes its full net_payable_cents (2,354,000) and a fully paid one contributes
          nothing again, so the field must return to exactly 0 rather than drifting by the payment. The
          reconciliation must hold on the Advertiser row while the Invoice keeps client_paid_cents at
          2,354,000 - the two views are not the same number and must not be confused.
        test_recipe:
          setup:
            - "a buy aired and billed for 2,354,000 cents, with the campaign funded for that amount"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
