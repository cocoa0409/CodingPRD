            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /repair-orders/${ro_id}/start", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/activate", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T15:00:00Z" }, as: SystemAdmin }
            - { call: "POST /repair-orders/${ro_id}/complete", payload: {}, as: RepairShop, as_user_id: "${shop_id}", captures: { actual_done: $.data.actual_completion_date } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /rental-reservations/${res_id}/return", payload: {}, as: RentalPartner, as_user_id: "${rp_id}", captures: { und: $.data.unnecessary_days } }
            - { call: "GET /claims/${cl_id}/recovery-cases", payload: {}, as: RecoverySpecialist }
          assert:
            - "Reservation.${res_id}.unnecessary_days == 0 (max(0, (2026-08-15 - (2026-08-14 + 1 day)))) — zero boundary"
            - "GET /claims/${cl_id}/recovery-cases returns total_count == 0 (empty set: no RecoveryCase created at the boundary)"
            - "Claim.recovery_balance_cents == 0"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_requires_verified_coverage
        grounds:
          - validations[priority=7]
          - errors[ERR_COVERAGE_NOT_VERIFIED]
          - state_machines.Claim
        distinguishing_aspect: |
          Entity pair Claim -> RentalReservation: reservation creation is gated
          on Claim.rental_track_status == COVERAGE_VERIFIED; on an unverified
          claim the create fails with ERR_COVERAGE_NOT_VERIFIED, and after the
          verification decision the identical payload succeeds.
        test_recipe:
          setup:
            - "Claim OPEN with rental_track_status == OPEN (no verification); repair order APPROVED; partner ACTIVE; clock default 2026-08-01"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v}" }, as: RentalDeskAgent, captures: { err: $.data.error_id } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id, res_status: $.data.status } }
          assert:
            - "Before verification: error_id == ERR_COVERAGE_NOT_VERIFIED"
            - "After VERIFIED decision: identical payload returns 201 with Reservation.status == DRAFT"

      - name: reservation_close_blocked_by_unsettled_invoice
        grounds:
          - state_machines.RentalReservation.RETURNED_to_CLOSED
          - errors[ERR_RESERVATION_CLOSE_BLOCKED]
        distinguishing_aspect: |
          Entity pair Invoice -> RentalReservation (distinct from Claim ->
          RentalReservation): a RETURNED reservation cannot close while one of
          its invoices is MANUAL_REVIEW; only after the invoice reaches SETTLED
          does the same close call succeed.
        test_recipe:
          setup:
            - "Base fixture through return at 2026-08-15; over-window invoice pending in MANUAL_REVIEW"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /repair-orders/${ro_id}/start", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/activate", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/return", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "POST /invoices", payload: { reservation_id: "${res_id}", invoice_number: "INV-W", period_start: "2026-08-05", period_end: "2026-08-16", daily_rate_cents: 6000, tax_cents: 4800, fees_cents: 0 }, as: RentalPartner, as_user_id: "${rp_id}", captures: { inv_id: $.data.id, inv_st: $.data.status } }
          trigger:
            - { call: "POST /rental-reservations/${res_id}/close", payload: {}, as: RentalDeskAgent, captures: { err: $.data.error_id } }
            - { call: "POST /invoices/${inv_id}/audit-decision", payload: { decision: "ADJUST_TO_AUTHORIZED" }, as: ClaimsAdjuster }
            - { call: "POST /invoices/${inv_id}/settle", payload: {}, as: SettlementApprover }
            - { call: "POST /rental-reservations/${res_id}/close", payload: {}, as: RentalDeskAgent, captures: { rst: $.data.status } }
          assert:
            - "First close: error_id == ERR_RESERVATION_CLOSE_BLOCKED (invoice ${inv_id} still MANUAL_REVIEW)"
            - "After audit-decision + settle: close succeeds with Reservation.status == CLOSED"
            - "Claim.rental_track_status == RENTAL_CLOSED after the close (all reservations terminal)"

      - name: extension_approve_requires_repair_in_progress
        grounds:
          - state_machines.ExtensionRequest.SUBMITTED_to_APPROVED
          - errors[ERR_REPAIR_ORDER_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair RepairOrder -> ExtensionRequest (third distinct pair): an
          extension may only be approved while the repair is IN_PROGRESS; once
          the shop completes the repair, the pending extension's approve fails
          with ERR_REPAIR_ORDER_INVALID_STATE.
        test_recipe:
          setup:
            - "Base fixture; reservation EXTENSION_REVIEW with a SUBMITTED extension request; repair order then COMPLETED before the decision"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /repair-orders/${ro_id}/start", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/activate", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "POST /repair-orders/${ro_id}/milestones", payload: { milestone_type: "DELAY_REPORTED", new_estimated_completion_date: "2026-08-18" }, as: RepairShop, as_user_id: "${shop_id}", captures: { ms_id: $.data.id } }
            - { call: "GET /rental-reservations/${res_id}", payload: {}, as: RentalDeskAgent, captures: { res_v: $.data.version } }
            - { call: "POST /extension-requests", payload: { reservation_id: "${res_id}", milestone_id: "${ms_id}", requested_additional_days: 4, expected_reservation_version: "${res_v}" }, as: RentalDeskAgent, captures: { er_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/complete", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
          trigger:
            - { call: "POST /extension-requests/${er_id}/approve", payload: {}, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPAIR_ORDER_INVALID_STATE (repair order COMPLETED at decision time)"
            - "ExtensionRequest.${er_id} remains SUBMITTED and Reservation remains EXTENSION_REVIEW"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_half_open_overlap_on_claim
        grounds:
          - errors[ERR_RESERVATION_PERIOD_OVERLAP]
          - calculations.rental_day_count
          - validations[priority=12]
        distinguishing_aspect: |
          Resource = Claim; interval semantics = HALF-OPEN [pickup_date,
          authorized_return_date). A back-to-back booking (pickup == prior
          authorized_return_date) MUST succeed while a one-day-into-the-window
          booking MUST fail with ERR_RESERVATION_PERIOD_OVERLAP — adjacency is
          permitted, intersection is not.
        test_recipe:
          setup:
            - "Claim verified; repair order APPROVED; R1 AUTHORIZED 2026-08-05..2026-08-15 (10 days)"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 2, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { r1_id: $.data.id } }
            - { call: "POST /rental-reservations/${r1_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v4: $.data.version } }
          trigger:
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-15", authorized_return_date: "2026-08-18", expected_claim_version: "${cl_v4}" }, as: RentalDeskAgent, captures: { r2_id: $.data.id, r2_status: $.data.status } }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v5: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-14", authorized_return_date: "2026-08-16", expected_claim_version: "${cl_v5}" }, as: RentalDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "Back-to-back arm: R2 (pickup 2026-08-15 == R1 authorized_return_date) created with status == DRAFT — half-open adjacency allowed"
            - "Overlap arm: R3 ([2026-08-14, 2026-08-16) intersects R1) -> error_id == ERR_RESERVATION_PERIOD_OVERLAP"
            - "GET /claims/${cl_id}/rental-reservations returns total_count == 2 (R3 not persisted)"

      - name: fleet_capacity_per_day_aggregate
        grounds:
          - errors[ERR_FLEET_CAPACITY_EXCEEDED]
          - state_machines.RentalReservation.DRAFT_to_AUTHORIZED
        distinguishing_aspect: |
          Resource = RentalPartner (a DIFFERENT resource entity) with AGGREGATE
          per-day capacity semantics (count of occupying reservations per class
          per day vs fleet capacity) rather than interval-intersection
          semantics: two STANDARD reservations on different claims collide only
          because they share calendar days; a touching [08-15, 08-20) window
          shares no day with [08-05, 08-15) and authorizes cleanly even at
          capacity 1.
        test_recipe:
          setup:
            - "Partner standard_capacity == 1; claim A with R-A STANDARD 2026-08-05..2026-08-15 AUTHORIZED (occupies all 10 days)"
            - "Claim B (verified, own repair order APPROVED) with R-B STANDARD 2026-08-05..2026-08-15 DRAFT and R-C STANDARD 2026-08-15..2026-08-20 DRAFT"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cla_id: $.data.id, cla_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cla_id}", expected_claim_version: "${cla_v}" }, as: ClaimsAdjuster, captures: { cva_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cva_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: false }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cla_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { roa_id: $.data.id } }
            - { call: "POST /repair-orders/${roa_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /claims/${cla_id}", payload: {}, as: ClaimsAdjuster, captures: { cla_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cla_id}", rental_partner_id: "${rp_id}", repair_order_id: "${roa_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cla_v3}" }, as: RentalDeskAgent, captures: { ra_id: $.data.id } }
            - { call: "POST /rental-reservations/${ra_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-29", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { clb_id: $.data.id, clb_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${clb_id}", expected_claim_version: "${clb_v}" }, as: ClaimsAdjuster, captures: { cvb_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cvb_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: false }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${clb_id}", estimated_completion_date: "2026-08-19", labor_hours_estimate: 8 }, as: RepairShop, as_user_id: "${shop_id}", captures: { rob_id: $.data.id } }
            - { call: "POST /repair-orders/${rob_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /claims/${clb_id}", payload: {}, as: ClaimsAdjuster, captures: { clb_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${clb_id}", rental_partner_id: "${rp_id}", repair_order_id: "${rob_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${clb_v3}" }, as: RentalDeskAgent, captures: { rb_id: $.data.id } }
            - { call: "GET /claims/${clb_id}", payload: {}, as: ClaimsAdjuster, captures: { clb_v4: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${clb_id}", rental_partner_id: "${rp_id}", repair_order_id: "${rob_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-15", authorized_return_date: "2026-08-20", expected_claim_version: "${clb_v4}" }, as: RentalDeskAgent, captures: { rc_id: $.data.id } }
          trigger:
            - { call: "POST /rental-reservations/${rb_id}/authorize", payload: {}, as: RentalDeskAgent, captures: { err: $.data.error_id } }
            - { call: "POST /rental-reservations/${rc_id}/authorize", payload: {}, as: RentalDeskAgent, captures: { rc_status: $.data.status } }
          assert:
            - "R-B authorize -> error_id == ERR_FLEET_CAPACITY_EXCEEDED (on every day 08-05..08-14 the partner already has 1 STANDARD reservation occupying, == capacity 1)"
            - "R-C authorize succeeds with status == AUTHORIZED (adjacent window [08-15, 08-20) shares no calendar day with R-A)"
            - "R-B remains DRAFT after the failed authorize"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: authorize_cancel_reserve_conservation
        grounds:
          - calculations.rental_reserve_reconciliation
          - state_machines.RentalReservation.DRAFT_to_AUTHORIZED
          - state_machines.RentalReservation.AUTHORIZED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = Claim.rental_reserve_cents (money exposure).
          authorize debits 60000 and its compensating action cancel credits it
          back: the reserve after the round trip equals the pre-authorize value
          120000 exactly, with zero drift.
        test_recipe:
          setup:
            - "Claim verified (reserve initialized 120000 = 6000 x 20); reservation DRAFT 10 days STANDARD (estimate 60000)"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
