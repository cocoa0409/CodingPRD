  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_amendment_with_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[event-amendment-stale-version]", "errors[ERR_STALE_EVENT_VERSION]"]
        distinguishing_aspect: "After a first amendment advances the event to version 3, a second amendment still carrying expected_event_version == 2 fails with ERR_STALE_EVENT_VERSION (412) — the stale writer's view predates the current terms."
        test_recipe:
          setup: ["ACME; SPLIT event CONFIRMED (version 2); one amendment already applied (version 3)"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPG00001", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2", captures: { ev_v: $.data.version } }
            - { call: "POST /api/events/${ev_id}/amendments", payload: { amended_terms: { ratio_num: 3, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, reason: "first revision", expected_event_version: "${ev_v}" }, as: EventAnalyst, as_user_id: "analyst-1", captures: { amd1: $.data.amendment_seq } }
          trigger:
            - { call: "POST /api/events/${ev_id}/amendments", payload: { amended_terms: { ratio_num: 4, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, reason: "stale second revision", expected_event_version: "${ev_v}" }, as: EventAnalyst, as_user_id: "analyst-2", captures: { err: $.data.error_id } }
          assert:
            - "First amendment applied (amendment_seq ${amd1} == 1, event now version 3)"
            - "Stale amendment fails: error_id == ERR_STALE_EVENT_VERSION (412); GET /api/events/${ev_id}/amendments total_count == 1"

      - name: occ_election_with_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[election-submit-stale-terms]", "errors[ERR_STALE_EVENT_VERSION]"]
        distinguishing_aspect: "Election creation supersedes the account's prior SUBMITTED election, so it is OCC-guarded: a second submit carrying the pre-first-submit event version (2, now 3) fails with ERR_STALE_EVENT_VERSION (412)."
        test_recipe:
          setup: ["ACME + NEWCO; account A1 (10 sh); MERGER CONFIRMED (version 2); A1 already submitted CASH (version 3); clock 2026-05-15"]
          setup_api_calls:
