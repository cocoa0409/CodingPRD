      - name: park_inspection_is_patroller_only_and_the_builder_may_never_inspect_his_own_build
        claim_type: exclusive_operations
        grounds:
          - roles[Patroller]
          - endpoints[POST /mountain-ops/terrain-areas/{id}/park-build]
          - endpoints[POST /mountain-ops/terrain-areas/{id}/park-inspection]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_SOD_VIOLATION]
          - validations[priority=19]
        distinguishing_aspect: |
          Two permissions stack on the same park: the build is shared by GroomingLead and Patroller, the
          inspection is Patroller-only, and on top of the role rule a segregation-of-duties rule keys on
          X-User-ID. Building AS a Patroller is what makes the pair observable - the builder holds the
          inspecting role and is still refused, with a 409 rather than a 403, so the two mechanisms must be
          separate. The GroomingLead who could legally build is then refused on the inspection with a 403,
          which is the mirror image.
        test_recipe:
          setup:
            - "A PRESEASON season with one inspected lift, one CLOSED PARK-class area of 18.0 acres, and patrollers P1 (EMT) and P2 (PARAMEDIC) both on duty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
