              payload: { solicitation_id: "${rep_sol_id}", carrier_id: "${car2_id}", aircraft_type_id: "${ac_sf34_id}", service_level: "ENHANCED", weekly_round_trips: 14, seats_per_departure: 30, annual_subsidy_request_usd: 2900000.00, term_months: 24, payment_basis: "SCHEDULED_FLIGHT_FLAT" }
              as: Carrier
              as_user_id: "${car2_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /eas/proposals/${p2_id}/actions"
              payload: { action: "SUBMIT" }
              as: Carrier
              as_user_id: "${car2_id}"
            - call: "POST /eas/solicitations/${rep_sol_id}/actions"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
            - call: "POST /eas/solicitations/${rep_sol_id}/selection-order"
              payload: { order_note: "replacement carrier secured" }
              as: SelectionOfficer
              as_user_id: "officer-1"
              captures: { agr2_id: $.data.id }
          assert:
            - "Level 1 — Proposal.${p2_id}.evaluation_state == SELECTED and composite_score == 60.0000"
            - "Level 1 — Solicitation.${rep_sol_id}.status == AWARDED, created_reason == REPLACEMENT, closes_at == 2026-09-30T00:00:00Z"
            - "Level 2 — ServiceAgreement.${agr2_id}.status == ACTIVE and carrier_id == ${car2_id}"
            - "Level 2 — ServiceAgreement.${agr2_id}.predecessor_agreement_id == ${agr1_id}"
            - "Level 3 — ServiceAgreement.${agr1_id}.status == TERMINATED and terminated_at == 2026-08-01T00:00:00Z"
            - "Level 3 — ServiceAgreement.${agr1_id}.total_committed_usd == 115096.03"
            - "Level 3 — ServiceAgreement.${agr1_id}.obligated_remaining_usd == 0.00"
            - "Level 3 — ServiceAgreement.${agr1_id}.disbursed_to_date_usd == 115096.03 (unchanged by the release)"
            - "Level 4 — TerminationPetition.${pet_id}.status == CLOSED"
            - "Level 5 — Community.${comm_id}.status == SUBSIDIZED and active_agreement_count == 1"
            - "ServicePeriod.${per1_id}.status == PAID is untouched by the cascade"

      - name: hold_in_grant_cascade_opens_the_replacement_solicitation
        grounds:
