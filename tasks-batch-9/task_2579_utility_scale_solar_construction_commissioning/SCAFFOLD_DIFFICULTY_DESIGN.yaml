      - name: punch_item_closure_cycle_repeats_before_terminal_close
        grounds:
          - state_machines.PunchListItem
          - entities.PunchListItem.fields.rejection_count
          - entities.PunchListItem.fields.submitted_by_user_id
          - entities.Project.fields.open_critical_punch_count
          - validations[priority=9]
        distinguishing_aspect: |
          Non-linearity is a CYCLE with a counter: OPEN -> CLOSURE_SUBMITTED ->
          OPEN is traversed twice before the terminal CLOSED, rejection_count
          records 2, and the project's open-item counters stay at 1 for the whole
          loop and only drop on the terminal hop.
        test_recipe:
          setup:
            - "One project with one OPEN CRITICAL punch list item and no other punch items"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Alkali Rim", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/punch-list-items"
              payload: { title: "Combiner box missing arc-flash label", category: "ELECTRICAL", severity: "CRITICAL", estimated_cost_cents: 40000 }
              as: OwnerEngineer
              captures: { pi: $.data.id }
          trigger:
            - call: "POST /solar/punch-list-items/${pi}/closure-submissions"
              payload: { closure_evidence_ref: "PHOTO-1" }
              as: InstallationForeman
              as_user_id: "IF-31"
            - call: "POST /solar/punch-list-items/${pi}/closure-decisions"
              payload: { decision: "REJECT", note: "label illegible" }
              as: OwnerEngineer
              as_user_id: "OE-12"
              captures: { s1: $.data.status, rc1: $.data.rejection_count }
            - call: "POST /solar/punch-list-items/${pi}/closure-submissions"
              payload: { closure_evidence_ref: "PHOTO-2" }
              as: InstallationForeman
              as_user_id: "IF-31"
            - call: "POST /solar/punch-list-items/${pi}/closure-decisions"
              payload: { decision: "REJECT", note: "wrong panel" }
              as: OwnerEngineer
              as_user_id: "OE-12"
              captures: { s2: $.data.status, rc2: $.data.rejection_count }
            - call: "POST /solar/punch-list-items/${pi}/closure-submissions"
              payload: { closure_evidence_ref: "PHOTO-3" }
              as: InstallationForeman
              as_user_id: "IF-31"
            - call: "POST /solar/punch-list-items/${pi}/closure-decisions"
              payload: { decision: "APPROVE", note: "verified" }
              as: OwnerEngineer
              as_user_id: "OE-12"
              captures: { s3: $.data.status, rc3: $.data.rejection_count }
          assert:
            - "${s1} == OPEN and ${rc1} == 1"
            - "${s2} == OPEN and ${rc2} == 2"
            - "${s3} == CLOSED and ${rc3} == 2 (the terminal approval does not touch the loop counter)"
            - "PunchListItem.${pi}.submitted_by_user_id == IF-31 and decided_by_user_id == OE-12"
            - "Project.${proj}.open_punch_item_count == 1 and open_critical_punch_count == 1 after each rejection, and both == 0 after the approval"
            - "PunchListItem.${pi}.version == 7 (six accepted transitions on top of creation)"

