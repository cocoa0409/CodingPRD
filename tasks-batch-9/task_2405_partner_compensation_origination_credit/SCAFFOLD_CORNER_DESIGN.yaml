              as: CycleAdmin
              captures: { arb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-GT", client_display_name: "Gated Client Co", matter_type: "NEW", practice_group: "CORPORATE", opened_on: "2026-02-10", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id", mv: "$.data.version" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "Sourced through my network." }
              as: Partner
              as_user_id: "${pp}"
              captures: { cl: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pp}"
          trigger:
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /comp/credit-claims/${cl}/adjudicate"
              payload: { decision: "REJECT", expected_matter_version: "${mv}" }
              as: CreditArbiter
              as_user_id: "${arb}"
              captures: { clst: "$.data.state" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
              captures: { cyst: "$.data.state" }
          assert:
            - "${err} == ERR_UNRESOLVED_CLAIMS with HTTP 409"
            - "the refused advance left CompensationCycle.${cy}.state == OPEN_INTAKE and did not bump its version"
            - "${clst} == REJECTED and CreditClaim.${cl}.approved_pct == 0.00"
            - "${cyst} == SELF_ASSESSMENT, so a terminal REJECTED claim is not in-flight"
            - "the REJECT branch left an ORIGINATING allocation for ${pp} at 100.00 with source DEFAULT_BILLING"

      - name: open_intake_refuses_a_non_adjacent_target_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines[CompensationCycle].transitions
          - errors[ERR_INVALID_CYCLE_TRANSITION]
          - validations[priority=70]
        distinguishing_aspect: |
          From OPEN_INTAKE the only declared edge is to SELF_ASSESSMENT: asking for
          DELIBERATION, AWARDS_PUBLISHED, TRUE_UP_OPEN or CLOSED each returns
          ERR_INVALID_CYCLE_TRANSITION 409 at priority 70 - the stage machine is not
          skippable even when every downstream gate would be trivially satisfied on an
          otherwise empty firm.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE with no partners, so every completeness gate downstream is vacuously true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id", v0: "$.data.version" }
          trigger:
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
              captures: { e1: "$.data.error_id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "AWARDS_PUBLISHED" }
              as: CycleAdmin
              captures: { e2: "$.data.error_id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "TRUE_UP_OPEN" }
              as: CycleAdmin
              captures: { e3: "$.data.error_id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "CLOSED" }
              as: CycleAdmin
              captures: { e4: "$.data.error_id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "OPEN_INTAKE" }
              as: CycleAdmin
              captures: { e5: "$.data.error_id" }
          assert:
            - "${e1} == ERR_INVALID_CYCLE_TRANSITION with HTTP 409"
            - "${e2} == ERR_INVALID_CYCLE_TRANSITION with HTTP 409"
            - "${e3} == ERR_INVALID_CYCLE_TRANSITION with HTTP 409"
            - "${e4} == ERR_INVALID_CYCLE_TRANSITION with HTTP 409"
            - "${e5} == ERR_INVALID_CYCLE_TRANSITION with HTTP 409, since no self-loop is declared"
            - "CompensationCycle.${cy}.state == OPEN_INTAKE and version == ${v0} after all five refusals"
            - "no CommitteeBallot and no CompensationAward exists"

      - name: closed_cycle_refuses_every_further_advance_and_stays_locked
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines[CompensationCycle].terminal_states
          - entities.CompensationCycle.fields.confidentiality_locked
          - errors[ERR_INVALID_CYCLE_TRANSITION]
        distinguishing_aspect: |
          CLOSED is terminal in both directions: neither a forward advance to TRUE_UP_OPEN
          nor a reconsideration reopen to DELIBERATION is accepted, both fail with
          ERR_INVALID_CYCLE_TRANSITION 409 rather than ERR_CYCLE_NOT_REOPENABLE, and
          confidentiality_locked stays true.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 has been carried all the way to CLOSED."
            - "The firm consists of two committee members with evaluation_required false, so no assessment, ballot or award is ever required and every gate is vacuous."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Lock One", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2004, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Lock Two", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2006, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "AWARDS_PUBLISHED" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "TRUE_UP_OPEN" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "CLOSED" }
              as: CycleAdmin
              captures: { closed: "$.data.state", lockv: "$.data.version" }
          trigger:
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "TRUE_UP_OPEN" }
              as: CycleAdmin
              captures: { e1: "$.data.error_id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
              captures: { e2: "$.data.error_id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "CLOSED" }
              as: CycleAdmin
              captures: { e3: "$.data.error_id" }
          assert:
            - "${closed} == CLOSED and CompensationCycle.${cy}.confidentiality_locked == true"
            - "${e1} == ERR_INVALID_CYCLE_TRANSITION with HTTP 409"
            - "${e2} == ERR_INVALID_CYCLE_TRANSITION with HTTP 409, not ERR_CYCLE_NOT_REOPENABLE - the reopen edge exists only from AWARDS_PUBLISHED"
            - "${e3} == ERR_INVALID_CYCLE_TRANSITION with HTTP 409"
            - "CompensationCycle.${cy}.version == ${lockv} after all three refusals"
            - "CompensationCycle.${cy}.unsettled_award_count == 0 and reopen_count == 0"

      - name: second_submit_of_the_same_claim_is_refused_not_replayed
        claim_type: Idempotency
        grounds:
          - state_machines[CreditClaim].transitions[DRAFT->SUBMITTED]
          - errors[ERR_CLAIM_NOT_IN_DRAFT]
          - validations[priority=70]
        distinguishing_aspect: |
          The submit endpoint is a state transition, not an idempotent upsert: replaying it
          on an already-SUBMITTED claim returns ERR_CLAIM_NOT_IN_DRAFT 409 and leaves
          version, revision_count and remand_count exactly as the first submit left them -
          it does not return 200 with the same body.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partner P holds one DRAFT NEW_CLIENT claim on OPEN Matter M."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ida Idem", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-ID", client_display_name: "Idempotent Industries", matter_type: "NEW", practice_group: "CORPORATE", opened_on: "2026-02-15", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "Introduced by me at a conference." }
              as: Partner
              as_user_id: "${pp}"
              captures: { cl: "$.data.id" }
          trigger:
            - call: "POST /comp/credit-claims/${cl}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pp}"
              captures: { v1: "$.data.version", s1: "$.data.state" }
            - call: "POST /comp/credit-claims/${cl}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pp}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${s1} == SUBMITTED and ${v1} == 2"
            - "${err} == ERR_CLAIM_NOT_IN_DRAFT with HTTP 409"
            - "CreditClaim.${cl}.version == ${v1}, unchanged by the replay"
            - "CreditClaim.${cl}.revision_count == 0 and remand_count == 0"
            - "GET /comp/credit-claims with cycle_id ${cy} still returns exactly 1 row"

      - name: write_off_cascades_supersession_to_every_allocation_on_the_matter
        claim_type: Cascade down
        grounds:
          - state_machines[Matter].transitions[OPEN->WRITTEN_OFF]
          - state_machines[CreditAllocation].terminal_states
          - entities.CreditAllocation.fields.credit_through
          - endpoints[POST /comp/matters/{id}/status]
        distinguishing_aspect: |
          Writing a matter off supersedes all three of its allocations in one call -
          ORIGINATING, BILLING and RESPONSIBLE - stamping credit_through with the logical
          clock's date 2026-08-01 rather than deleting the rows, and it decrements nothing
          on the ORIGINATING claim, which stays ALLOCATED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partner P holds an ALLOCATED 100.00 ORIGINATING claim on OPEN Matter M, so M carries three ACTIVE allocations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Cass Cade", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Arb Three", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true, evaluation_required: false }
              as: CycleAdmin
              captures: { arb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-WO", client_display_name: "Written Off Ventures", matter_type: "NEW", practice_group: "CORPORATE", opened_on: "2026-02-20", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id", mv: "$.data.version" }
            - call: "POST /comp/matters/${m}/financials"
              payload: { billed_delta_cents: 5000000, collected_delta_cents: 4000000, direct_cost_delta_cents: 1000000, expected_matter_version: "${mv}" }
              as: CycleAdmin
              captures: { mv2: "$.data.version" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "New client sourced by me." }
              as: Partner
              as_user_id: "${pp}"
              captures: { cl: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pp}"
            - call: "POST /comp/credit-claims/${cl}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 100.00, expected_matter_version: "${mv2}" }
              as: CreditArbiter
              as_user_id: "${arb}"
          trigger:
            - call: "POST /comp/matters/${m}/status"
              payload: { target_state: "WRITTEN_OFF", written_off_reason: "Client insolvent; receivable uncollectible." }
              as: CycleAdmin
              captures: { mst: "$.data.state" }
            - call: "GET /comp/matters/${m}/credit-allocations"
              payload: { state: "SUPERSEDED" }
              as: CycleAdmin
              captures: { s0: "$.data[0].state", s0_through: "$.data[0].credit_through", s1: "$.data[1].state", s2: "$.data[2].state" }
          assert:
            - "${mst} == WRITTEN_OFF and Matter.${m}.written_off_reason is set"
            - "GET /comp/matters/${m}/credit-allocations with state SUPERSEDED returns exactly 3 rows, covering ORIGINATING, BILLING and RESPONSIBLE"
            - "${s0} == SUPERSEDED, ${s1} == SUPERSEDED and ${s2} == SUPERSEDED"
            - "${s0_through} == 2026-08-01, taken from the logical clock rather than from the matter's opened_on"
            - "GET /comp/matters/${m}/credit-allocations with state ACTIVE returns an empty list"
            - "CreditClaim.${cl}.state is still ALLOCATED, so the claim is not rolled back"
            - "Partner.${pp}.credited_collection_provisional_cents == 0, because the matter left both variant input sets"

      - name: cyclic_shape_loop_bound
        claim_type: cyclic
        grounds:
          - "state_machines[CreditClaim].transitions[DISPUTED->DRAFT]"
          - "governance_constants.MAX_REMANDS"
        excluded_because:
          difficulty_instance: non_linear_state_machine / credit_claim_remand_cycle_bounded_at_max_remands
          rationale: "The claim that a cyclic machine bounds its own loop is asserted end-to-end by scaffold_difficulty_design instance credit_claim_remand_cycle_bounded_at_max_remands, which drives DRAFT -> SUBMITTED -> DISPUTED -> DRAFT exactly MAX_REMANDS times and then shows the third remand refused with ERR_CLAIM_NOT_ADJUDICABLE while remand_count stays at 2."

      - name: parallel_shape_independent_dimensions
        claim_type: parallel
        grounds:
          - "state_machines[CompensationAward]"
          - "state_machines[CompensationAward.payment_state]"
        excluded_because:
          difficulty_instance: non_linear_state_machine / award_state_and_payment_state_are_independent_dimensions
          rationale: "Independent movement of two state dimensions on one entity is asserted by scaffold_difficulty_design instance award_state_and_payment_state_are_independent_dimensions, which moves CompensationAward.award_state and CompensationAward.payment_state separately and checks every reachable combination."

      - name: guarded_transition_cross_entity_precondition
        claim_type: guarded transitions
        grounds:
          - "state_machines[CommitteeBallot].transitions[PENDING->CAST]"
          - "validations[priority=75]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ballot_cast_requires_subject_assessment_accepted
          rationale: "The 'A->B only if entity C is in state X' guard is asserted by scaffold_difficulty_design instance ballot_cast_requires_subject_assessment_accepted, where the ballot may only be cast once the subject's SelfAssessment has reached ACCEPTED."

      - name: cross_entity_side_effect_chain
        claim_type: Cross-entity
        grounds:
          - "state_machines[CreditClaim].transitions[SUBMITTED->ALLOCATED]"
          - "calculations.credited_collection_split"
        excluded_because:
          difficulty_instance: transitive_cascade / split_adjudication_cascade_matter_allocation_partner_cycle
          rationale: "Entity-A-change-adjusts-entity-B is asserted by scaffold_difficulty_design instance split_adjudication_cascade_matter_allocation_partner_cycle, which follows one SPLIT adjudication through CreditAllocation, Matter, both Partners and CompensationCycle and checks each hop's fields."

      - name: ledger_sync_derived_ancestor_field
        claim_type: Ledger sync
        grounds:
          - "endpoints[POST /comp/contribution-records/{id}/verify]"
          - "entities.Partner.fields.verified_billable_hours"
        excluded_because:
          difficulty_instance: transitive_cascade / hours_verification_cascade_allocation_matter_partner_cycle
          rationale: "The state-change-updates-ancestor-derived-field claim, reconciled before and after, is asserted by scaffold_difficulty_design instance hours_verification_cascade_allocation_matter_partner_cycle, which verifies one ContributionRecord and reconciles Matter.verified_billable_hours, Partner.verified_billable_hours and CompensationCycle.total_formula_score."

      - name: compensating_undo_reverses_all_side_effects
        claim_type: Compensation
        grounds:
          - "state_machines[CompensationCycle].transitions[AWARDS_PUBLISHED->DELIBERATION]"
          - "entities.CompensationCycle.fields.undistributed_cash_cents"
        excluded_because:
          difficulty_instance: compensating_invariant / cycle_undistributed_cash_conserved_across_draw_and_reopen
          rationale: "The undo-transition-reverses-every-side-effect claim is asserted by scaffold_difficulty_design instance cycle_undistributed_cash_conserved_across_draw_and_reopen, which reopens AWARDS_PUBLISHED -> DELIBERATION and shows the draw ledger, award payment_state, Partner.ytd_draw_paid_cents and CompensationCycle.undistributed_cash_cents all restored with no drift."

      - name: conditional_cascade_applies_only_to_children_in_one_state
        claim_type: Conditional cascade
        grounds:
          - "state_machines[SelfAssessment].transitions[SUBMITTED->DRAFT]"
          - "state_machines[PeerReview].transitions[ASSIGNED->SCORED]"
        excluded_because:
          difficulty_instance: non_linear_state_machine / self_assessment_return_cycle_resets_peer_review_dimension
          rationale: "The side-effect-only-when-child-is-in-a-specific-state claim is asserted by scaffold_difficulty_design instance self_assessment_return_cycle_resets_peer_review_dimension, where a RETURN decision resets only the SCORED PeerReview rows and leaves a RECUSED sibling untouched."

  # =====================================================================
  - section: calculations
    instances:

      - name: trimmed_mean_discards_exactly_one_high_and_one_low_ballot
        claim_type: Correct Result
        grounds:
          - calculations.committee_points_trimmed_mean
          - entities.Partner.fields.committee_points
          - entities.CompensationCycle.fields.total_committee_points
          - endpoints[POST /comp/ballots/{id}/cast]
        distinguishing_aspect: |
          With three CAST ballots proposing 900.00, 500.00 and 700.00, the trim threshold of
          3 is reached and only the middle proposal survives, so committee_points is exactly
          700.00 - not the untrimmed mean 700.00 reached by a different route, which is why
          the test also checks the two-ballot prefix where the plain mean of 900.00 and
          500.00 is 700.00 and then watches the value stay 700.00 for a different reason.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026."
            - "Subject S is DISCRETIONARY and evaluation_required; C1, C2 and C3 are committee members with evaluation_required false."
            - "S's assessment is ACCEPTED after two SCORED reviews, and the cycle has reached DELIBERATION, so three PENDING ballots exist on S."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
