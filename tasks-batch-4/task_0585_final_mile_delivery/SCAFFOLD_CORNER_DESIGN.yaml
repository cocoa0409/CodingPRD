  # =========================================================================
  # Section: cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_order_version_on_window_reserve
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[window-reserve-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first reserve advances the order to version 2, a second reserve still carrying the pre-supersede expected_order_version (1) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A SCHEDULED order whose version advanced to 2 after its first window reservation; the client still holds the stale version 1 captured at create."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 660, window_end_min: 780, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_STALE_VERSION'"
            - "trigger response HTTP status == 412"

      - name: order_version_increments_on_window_reserve
        claim_type: optimistic_concurrency
        grounds: [entities.DeliveryOrder.fields.version, "concurrency_rules[window-reserve-stale-order]"]
        distinguishing_aspect: "A successful window reservation increments DeliveryOrder.version from 1 to 2."
        test_recipe:
          setup: ["A CREATED order at version 1 with an ACTIVE team and matching-region customer."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
          assert:
            - "DeliveryOrder.${order_id}.version == 2"
            - "DeliveryOrder.${order_id}.status == 'SCHEDULED'"

