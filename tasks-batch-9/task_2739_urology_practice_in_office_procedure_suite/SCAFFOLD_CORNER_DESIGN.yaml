        grounds:
          - state_machines[ProcedureCase.schedule_status] SCHEDULED -> IN_ROOM preconditions
          - state_machines[ScopeAsset.status]
        excluded_because:
          difficulty_instance: ce_checkin_blocked_by_scope_state
          rationale: "The guarded-transition claim for check-in — A -> B only if the assigned ScopeAsset carries a non-null hld_pass_at and a null reprocess_due_at — is driven there in both polarities, failing first and succeeding after commissioning attests the disinfection."

