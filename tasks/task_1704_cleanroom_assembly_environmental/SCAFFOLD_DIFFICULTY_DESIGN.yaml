# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1704: Cleanroom Assembly & Environmental Monitoring
# Two instances per §0.5 rule; every instance grounds in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains. Instance A: EnvironmentalSample classification (excursion
  # detection) vs RoomCertification grade — the SAME room limits drive two
  # different verdicts (per-sample >= vs mean <). Instance B: Cleanroom
  # certification expiry vs GowningQualification expiry — same >= boundary
  # shape on different entity domains (room vs personnel).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: per_sample_alert_trips_while_mean_certification_passes
        grounds:
          - calculations.sample_classification
          - calculations.certification_grade_check
          - entities.EnvironmentalSample.fields.classification
          - entities.RoomCertification.fields.grade_passed
        distinguishing_aspect: |
          Two valid readings of "did the room exceed its particle limit" diverge:
          per-sample excursion detection trips ALERT on ANY single result >=
          alert limit (302000 >= 300000), while the ISO-style certification grade
          uses the MEAN across locations (295750.0 < 300000) and passes. The
          scaffold pins per-sample for excursions and mean for certification —
          one dataset, two opposite answers on the same entity room, but the
          variant domains differ (EnvironmentalSample.classification vs
          RoomCertification.grade_passed).
        test_recipe:
          setup:
            - "Room CR-A ISO_7, particle alert 300000 / action 352000, recert 180d"
            - "One ACTIVE PARTICLE sampling point SP-A in CR-A"
            - "A VALIDATED cleaning program for CR-A (3 verified PASS cycles)"
            - "No open excursions after the sample's excursion is closed via a NONE-impact approved investigation"
            - "Clock at 2026-08-01T00:00:00Z (default)"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-A", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_a: $.data.id, room_a_v: $.data.version }
            - call: "POST /cleanroom/rooms/${room_a}/sampling-points"
              payload: { point_code: "SP-A", metric: "PARTICLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
              captures: { sp_a: $.data.id }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_a}", method_code: "MOP-1", required_consecutive_passes: 3 }
              as: QualityAssurance
              captures: { prog_a: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_a}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_a}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_a1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_a1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_a}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_a2: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_a2}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_a}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_a3: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_a3}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_a}", result_value: 302000, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              as_user_id: "tech-a"
              captures: { samp_alert: $.data.id, exc_alert: $.data.triggered_excursion_id }
            - call: "POST /cleanroom/excursions/${exc_alert}/investigations"
              payload: { root_cause: "HEPA diffuser seal degraded over shift", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-a1"
              captures: { inv_alert: $.data.id }
            - call: "POST /cleanroom/investigations/${inv_alert}/approve"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-a2"
            - call: "GET /cleanroom/rooms/${room_a}"
              as: QualityAssurance
              captures: { room_a_v2: $.data.version }
          trigger:
            - call: "POST /cleanroom/rooms/${room_a}/certifications"
              payload: { executed_at: "2026-08-01T12:00:00Z", location_mean_values: [302000, 290000, 295000, 296000], expected_room_version: "${room_a_v2}" }
              as: QualityAssurance
              captures: { cert_a: $.data.id }
          assert:
            - "EnvironmentalSample.${samp_alert}.classification == ALERT_EXCEEDED  (per-sample variant: 302000 >= 300000 trips ALERT)"
            - "RoomCertification.${cert_a}.grade_passed == true  (mean variant: mean=295750.0 < 300000 passes)"
            - "RoomCertification.${cert_a}.result == PASS"
            - "Cleanroom.${room_a}.certification_status == CERTIFIED"
            - "Cleanroom.${room_a}.environment_posture == IN_CONTROL"

      - name: room_certification_expiry_vs_gowning_expiry_same_boundary_operator
        grounds:
          - calculations.certification_expiry
          - calculations.gowning_qualification_expiry
          - entities.Cleanroom.fields.certification_status
          - entities.GowningQualification.fields.status
        distinguishing_aspect: |
          The same >= expiry boundary operator is applied on two different
          entity domains: a Cleanroom certification (180-day interval, lazy
          CERTIFIED -> CERTIFICATION_EXPIRED) and a Personnel gowning
          qualification (365-day validity, lazy QUALIFIED -> EXPIRED). At the
          exact expiry instant both deny; one day before both allow — the test
          pins both domains so the boundary rule is not inferred from a single
          entity.
        test_recipe:
          setup:
            - "Room CR-B ISO_8 (alert 3500000/action 3520000 viable 100/200, recert 180d) with a VALIDATED cleaning program and a PASS certification executed 2026-08-01T00:00:00Z"
            - "Personnel P-B with a gowning qualification for CR-B granted 2026-08-01T00:00:00Z (expires 2027-08-01T00:00:00Z)"
            - "Clock advanced so that certification is past 180d but qualification still valid: 2027-01-28T00:00:00Z is exactly certified_at+180d -> certification EXPIRED, qualification still QUALIFIED"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-B", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_b: $.data.id, room_b_v: $.data.version }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_b}", method_code: "MOP-2", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_b: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_b}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_b}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_b1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_b1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_b}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [1000, 2000], expected_room_version: "${room_b_v}" }
              as: QualityAssurance
            - call: "POST /cleanroom/personnel"
              payload: { employee_code: "EMP-B", full_name: "Bee Operator", role_title: "Assembler" }
              as: QualityAssurance
              captures: { pers_b: $.data.id }
            - call: "POST /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_b}", cleanroom_id: "${room_b}" }
              as: QualityAssurance
              captures: { gq_b: $.data.id }
            - call: "POST /cleanroom/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-27T23:59:59Z" }
              as: QualityAssurance
            - call: "GET /cleanroom/rooms/${room_b}"
              as: QualityAssurance
              captures: { room_b_pre: $.data.certification_status }
            - call: "POST /cleanroom/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-28T00:00:00Z" }
              as: QualityAssurance
          trigger:
            - call: "GET /cleanroom/rooms/${room_b}"
              as: QualityAssurance
            - call: "GET /cleanroom/gowning-qualifications"
              payload: {}
              as: QualityAssurance
          assert:
            - "At 2027-01-27T23:59:59Z (one second before certified_at + 180d): Cleanroom.${room_b}.certification_status == CERTIFIED"
            - "At 2027-01-28T00:00:00Z (exactly certified_at + 180d): Cleanroom.${room_b}.certification_status == CERTIFICATION_EXPIRED  (boundary is >=)"
            - "Same instant, GowningQualification.${gq_b}.status == QUALIFIED  (365-day domain unaffected by 180-day domain)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes.
  # Instance A (mode a): excursion_severity_score — >= 3 inputs (metric base,
  # zone multiplier, recurrence count) with conditional branch on metric and
  # nested multiplication. Instance B (mode c): certification result depends on
  # grade_passed which depends on room limits while open-excursion gate depends
  # on excursions whose closure depends on investigations — a circular-looking
  # dependency chain whose evaluation order the scaffold pins.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: severity_score_three_input_nonlinear
        grounds:
          - calculations.excursion_severity_score
          - entities.Excursion.fields.severity_score
        distinguishing_aspect: |
          Mode (a): severity_score = base(metric) * zone(zone_iso_class) *
          (1 + 0.25 * recurrence_count) — three inputs with a conditional branch
          on metric (VIABLE base 10 vs PARTICLE base 4) and non-linear
          interaction (multiplicative zone, additive recurrence term inside the
          multiplier). VIABLE/ISO_5 with recurrence_count=2 gives exactly 45.0,
          not 30.0 and not 60.0.
        test_recipe:
          setup:
            - "Room CR-C ISO_5 (particle alert 100000/action 352000, viable alert 10/action 20, recert 180d)"
            - "ACTIVE VIABLE sampling point SP-C (zone ISO_5) in CR-C"
            - "Two CLOSED excursions at SP-C with sampled_at 2026-08-01T09:00:00Z and 2026-08-01T10:00:00Z (both closed via NONE-impact approved investigations)"
            - "Clock at 2026-08-20T00:00:00Z so both prior excursions fall inside the trailing 30-day half-open window [2026-07-21, 2026-08-20) relative to a new sample at 2026-08-20T00:00:00Z"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-C", iso_class: "ISO_5", particle_alert_limit: 100000, particle_action_limit: 352000, viable_alert_limit: 10, viable_action_limit: 20, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_c: $.data.id }
            - call: "POST /cleanroom/rooms/${room_c}/sampling-points"
              payload: { point_code: "SP-C", metric: "VIABLE", zone_iso_class: "ISO_5" }
              as: QualityAssurance
              captures: { sp_c: $.data.id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_c}", result_value: 25, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              as_user_id: "tech-c"
              captures: { exc_c1: $.data.triggered_excursion_id }
            - call: "POST /cleanroom/excursions/${exc_c1}/investigations"
              payload: { root_cause: "First root cause narrative here", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-c1"
              captures: { inv_c1: $.data.id }
            - call: "POST /cleanroom/investigations/${inv_c1}/approve"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-c2"
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_c}", result_value: 30, sampled_at: "2026-08-01T10:00:00Z" }
              as: EnvironmentTech
              as_user_id: "tech-c"
              captures: { exc_c2: $.data.triggered_excursion_id }
            - call: "POST /cleanroom/excursions/${exc_c2}/investigations"
              payload: { root_cause: "Second root cause narrative here", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-c1"
              captures: { inv_c2: $.data.id }
            - call: "POST /cleanroom/investigations/${inv_c2}/approve"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-c2"
            - call: "POST /cleanroom/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: QualityAssurance
          trigger:
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_c}", result_value: 25, sampled_at: "2026-08-20T00:00:00Z" }
              as: EnvironmentTech
              captures: { exc_c3: $.data.triggered_excursion_id }
          assert:
            - "Excursion.${exc_c3}.severity == ACTION  (25 >= viable action 20)"
            - "Excursion.${exc_c3}.severity_score == 45.0  (base 10 * zone 3 * (1 + 0.25*2))"
            - "Excursion.${exc_c1}.severity_score == 30.0  (recurrence_count 0 at its creation)"
            - "Excursion.${exc_c2}.severity_score == 37.5  (recurrence_count 1: exc_c1 closed before exc_c2 creation)"

      - name: certification_result_circular_evaluation_order
        grounds:
          - calculations.certification_grade_check
          - state_machines.Cleanroom.transitions
          - validations[priority=12]
        distinguishing_aspect: |
          Mode (c): certification result looks circular — result depends on
          grade_passed (which reads room.particle_alert_limit) AND on zero open
          excursions (whose count changes as investigations are approved) AND on
          a VALIDATED cleaning program (whose count changes as cycles verify).
          The scaffold pins the evaluation order: (1) grade_passed from the
          input means, (2) open-excursion gate, (3) cleaning-program gate —
          short-circuiting in that order so a grade failure reports
          ERR_CERTIFICATION_GRADE_FAILED even when excursions are also open.
        test_recipe:
          setup:
            - "Room CR-D ISO_7 (alert 300000/action 352000, viable 50/100, recert 180d)"
            - "ACTIVE PARTICLE point SP-D; one open ACTION excursion (sample 400000) never investigated"
            - "Cleaning program for CR-D exists and is VALIDATED"
            - "Clock default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-D", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_d: $.data.id, room_d_v: $.data.version }
            - call: "POST /cleanroom/rooms/${room_d}/sampling-points"
              payload: { point_code: "SP-D", metric: "PARTICLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
              captures: { sp_d: $.data.id }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_d}", method_code: "MOP-4", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_d: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_d}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_d}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_d1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_d1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_d}", result_value: 400000, sampled_at: "2026-08-01T08:00:00Z" }
              as: EnvironmentTech
              captures: { exc_d1: $.data.triggered_excursion_id }
            - call: "GET /cleanroom/rooms/${room_d}"
              as: QualityAssurance
              captures: { room_d_v2: $.data.version }
          trigger:
            - call: "POST /cleanroom/rooms/${room_d}/certifications"
              payload: { executed_at: "2026-08-01T12:00:00Z", location_mean_values: [400000, 400000], expected_room_version: "${room_d_v2}" }
              as: QualityAssurance
              captures: { err_d: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_CERTIFICATION_GRADE_FAILED  (grade gate evaluated first: mean 400000.0 >= 300000 fails)"
            - "error_id != ERR_OPEN_EXCURSIONS_BLOCK_CERTIFICATION  (excursion gate is second in the pinned order)"
            - "Cleanroom.${room_d}.certification_status == UNCERTIFIED"
            - "Excursion.${exc_d1}.status == OPEN  (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: two non-linear machines on DIFFERENT
  # entities. Instance A: Cleanroom's two PARALLEL dimensions
  # (certification_status × environment_posture) evolve independently.
  # Instance B: Excursion's CYCLE OPEN -> UNDER_INVESTIGATION -> OPEN via
  # rejected investigation.
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: cleanroom_parallel_dimensions_move_independently
        grounds:
          - state_machines.Cleanroom
          - entities.Cleanroom.fields.certification_status
          - entities.Cleanroom.fields.environment_posture
        distinguishing_aspect: |
          Cleanroom carries two parallel state dimensions: a single ALERT
          excursion moves environment_posture IN_CONTROL -> ALERT while
          certification_status stays CERTIFIED; closing the excursion returns
          posture to IN_CONTROL without any certification transition. The two
          dimensions are observable independently on the same row.
        test_recipe:
          setup:
            - "Room CR-E ISO_8 (alert 3500000/action 3520000, viable 100/200, recert 180d), VALIDATED cleaning program, PASS certification executed 2026-08-01T00:00:00Z"
            - "ACTIVE VIABLE point SP-E (alert 100/action 200)"
            - "Clock default"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-E", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_e: $.data.id, room_e_v: $.data.version }
            - call: "POST /cleanroom/rooms/${room_e}/sampling-points"
              payload: { point_code: "SP-E", metric: "VIABLE", zone_iso_class: "ISO_8" }
              as: QualityAssurance
              captures: { sp_e: $.data.id }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_e}", method_code: "MOP-5", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_e: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_e}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_e}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_e1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_e1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_e}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [100, 200], expected_room_version: "${room_e_v}" }
              as: QualityAssurance
          trigger:
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_e}", result_value: 150, sampled_at: "2026-08-01T11:00:00Z" }
              as: EnvironmentTech
              as_user_id: "tech-e"
              captures: { exc_e1: $.data.triggered_excursion_id }
            - call: "GET /cleanroom/rooms/${room_e}"
              as: QualityAssurance
              captures: { posture_mid: $.data.environment_posture, cert_mid: $.data.certification_status }
            - call: "POST /cleanroom/excursions/${exc_e1}/investigations"
              payload: { root_cause: "Investigation narrative for CR-E alert", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-e1"
              captures: { inv_e1: $.data.id }
            - call: "POST /cleanroom/investigations/${inv_e1}/approve"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-e2"
            - call: "GET /cleanroom/rooms/${room_e}"
              as: QualityAssurance
              captures: { posture_end: $.data.environment_posture, cert_end: $.data.certification_status }
          assert:
            - "After the ALERT sample: Cleanroom.${room_e}.environment_posture == ALERT AND Cleanroom.${room_e}.certification_status == CERTIFIED  (posture moved, certification untouched)"
            - "After investigation approval: Cleanroom.${room_e}.environment_posture == IN_CONTROL AND Cleanroom.${room_e}.certification_status == CERTIFIED"
            - "EnvironmentalSample classification for 150 with viable alert 100/action 200 == ALERT_EXCEEDED"

      - name: excursion_investigation_rejection_cycle
        grounds:
          - state_machines.Excursion
          - state_machines.ExcursionInvestigation
        distinguishing_aspect: |
          Excursion has a true cycle: OPEN -> UNDER_INVESTIGATION -> OPEN when
          the investigation is REJECTED, and the loop is repeatable — a second
          investigation can be opened after the rejection, which a linear
          pipeline would forbid.
        test_recipe:
          setup:
            - "Room CR-F ISO_7 (alert 300000/action 352000, viable 50/100, recert 180d)"
            - "ACTIVE PARTICLE point SP-F; one ALERT excursion (sample 300500) created by EnvironmentTech user tech-1"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-F", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_f: $.data.id }
            - call: "POST /cleanroom/rooms/${room_f}/sampling-points"
              payload: { point_code: "SP-F", metric: "PARTICLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
              captures: { sp_f: $.data.id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_f}", result_value: 300500, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              as_user_id: "tech-1"
              captures: { exc_f1: $.data.triggered_excursion_id }
          trigger:
            - call: "POST /cleanroom/excursions/${exc_f1}/investigations"
              payload: { root_cause: "Initial investigation, rejected later", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-1"
              captures: { inv_f1: $.data.id }
            - call: "POST /cleanroom/investigations/${inv_f1}/reject"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-2"
            - call: "POST /cleanroom/excursions/${exc_f1}/investigations"
              payload: { root_cause: "Second investigation after rejection loop", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-1"
              captures: { inv_f2: $.data.id }
          assert:
            - "ExcursionInvestigation.${inv_f1}.status == REJECTED"
            - "After rejection, Excursion.${exc_f1}.status == OPEN  (cycled back)"
            - "Second investigation ${inv_f2} created successfully with status == DRAFT and Excursion.${exc_f1}.status == UNDER_INVESTIGATION  (loop is repeatable)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: two cascades from DIFFERENT triggers.
  # Instance A (depth >= 3): sample -> excursion -> investigation approval with
  # CONFIRMED impact -> room SHUTDOWN -> batches ON_HOLD (and staged transfers
  # REJECTED). Instance B (depth >= 2): FAIL cleaning cycle -> program counter
  # reset -> program VALIDATED -> RE_VALIDATION_REQUIRED.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: confirmed_excursion_cascades_to_shutdown_holds_and_transfer_rejection
        grounds:
          - state_machines.Cleanroom
          - state_machines.Excursion
          - state_machines.AssemblyBatch
          - state_machines.MaterialTransfer
          - state_machines.ExcursionInvestigation
        distinguishing_aspect: |
          Depth-4 chain where each link is caused by the previous one, not by
          the original action: sample record creates an OPEN excursion (1);
          investigation approval closes the excursion (2); the approval's
          product_impact=CONFIRMED flips room posture to SHUTDOWN (3); the
          SHUTDOWN posture cascade moves the room's OPEN/IN_PROGRESS batch to
          ON_HOLD and its STAGED transfer to REJECTED (4). Fan-out at the final
          hop (batch + transfer) is allowed because both are caused by the
          posture change.
        test_recipe:
          setup:
            - "Room CR-G ISO_7 (alert 300000/action 352000, viable 50/100, recert 180d), VALIDATED cleaning, PASS certification, posture IN_CONTROL"
            - "ACTIVE PARTICLE point SP-G"
            - "Personnel P-G with QUALIFIED gowning for CR-G"
            - "Batch B-G OPEN in CR-G with one traveler step (so the batch moves to IN_PROGRESS when started)"
            - "Material transfer T-G STAGED in CR-G (wiped_down=true, dwell 30)"
            - "Clock 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-G", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_g: $.data.id, room_g_v: $.data.version }
            - call: "POST /cleanroom/rooms/${room_g}/sampling-points"
              payload: { point_code: "SP-G", metric: "PARTICLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
              captures: { sp_g: $.data.id }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_g}", method_code: "MOP-7", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_g: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_g}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_g}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_g1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_g1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_g}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [1000, 2000], expected_room_version: "${room_g_v}" }
              as: QualityAssurance
            - call: "POST /cleanroom/personnel"
              payload: { employee_code: "EMP-G", full_name: "Gee Operator", role_title: "Assembler" }
              as: QualityAssurance
              captures: { pers_g: $.data.id }
            - call: "POST /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_g}", cleanroom_id: "${room_g}" }
              as: QualityAssurance
            - call: "POST /cleanroom/batches"
              payload: { cleanroom_id: "${room_g}", batch_number: "B-G", product_code: "PWB-1" }
              as: ProductionOperator
              as_user_id: "op-g"
              captures: { batch_g: $.data.id }
            - call: "POST /cleanroom/batches/${batch_g}/travelers"
              payload: { step_sequence: 1, step_description: "Place component" }
              as: ProductionOperator
              as_user_id: "op-g"
              captures: { trav_g1: $.data.id }
            - call: "POST /cleanroom/travelers/${trav_g1}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-g"
            - call: "POST /cleanroom/material-transfers"
              payload: { cleanroom_id: "${room_g}", material_lot: "LOT-G", item_description: "Housing", dwell_minutes: 30, wiped_down: true }
              as: MaterialHandler
              captures: { xfer_g: $.data.id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_g}", result_value: 400000, sampled_at: "2026-08-01T12:00:00Z" }
              as: EnvironmentTech
              as_user_id: "tech-g"
              captures: { exc_g: $.data.triggered_excursion_id }
            - call: "POST /cleanroom/excursions/${exc_g}/investigations"
              payload: { root_cause: "Confirmed product impact from seal breach", product_impact: "CONFIRMED", disposition: "REJECT" }
              as: QualityAssurance
              as_user_id: "qa-g1"
              captures: { inv_g: $.data.id }
          trigger:
            - call: "POST /cleanroom/investigations/${inv_g}/approve"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-g2"
          assert:
            - "Excursion.${exc_g}.status == CLOSED  (link 2)"
            - "Cleanroom.${room_g}.environment_posture == SHUTDOWN  (link 3, caused by CONFIRMED approval)"
            - "AssemblyBatch.${batch_g}.status == ON_HOLD AND AssemblyBatch.${batch_g}.hold_reason == EXCURSION_PRODUCT_IMPACT  (link 4)"
            - "MaterialTransfer.${xfer_g}.status == REJECTED  (link 4, second fan-out of the posture change)"
            - "ExcursionInvestigation.${inv_g}.status == APPROVED"

      - name: failed_cleaning_cycle_cascades_program_revalidation
        grounds:
          - state_machines.CleaningCycle
          - state_machines.CleaningValidationProgram
          - calculations.consecutive_pass_count
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (cycle recording, not sample
          recording): a FAIL cycle is recorded as REJECTED (1); that rejection
          resets the program's consecutive_pass_count to 0 (2); the reset drops
          a VALIDATED program to RE_VALIDATION_REQUIRED (3). Originating
          trigger differs from the excursion cascade.
        test_recipe:
          setup:
            - "Room CR-H ISO_8 (alert 3500000/action 3520000, viable 100/200, recert 180d)"
            - "Cleaning program PROG-H (required_consecutive_passes=2) VALIDATED via 2 verified PASS cycles"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-H", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_h: $.data.id }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_h}", method_code: "MOP-8", required_consecutive_passes: 2 }
              as: QualityAssurance
              captures: { prog_h: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_h}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_h}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_h1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_h1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_h}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_h2: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_h2}/verify"
              payload: {}
              as: QualityAssurance
          trigger:
            - call: "POST /cleanroom/cleaning-programs/${prog_h}/cycles"
              payload: { result: "FAIL" }
              as: EnvironmentTech
              captures: { cyc_h3: $.data.id }
          assert:
            - "CleaningCycle.${cyc_h3}.status == REJECTED  (link 1: FAIL recorded directly as REJECTED)"
            - "CleaningValidationProgram.${prog_h}.consecutive_pass_count == 0  (link 2: counter reset)"
            - "CleaningValidationProgram.${prog_h}.status == RE_VALIDATION_REQUIRED  (link 3: VALIDATED dropped)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: two dual-failure conflicts over
  # DIFFERENT error-category pairs.
  # Instance A: state (priority 5) vs business_safety segregation (priority 8)
  #   — approving an already-approved investigation by the same user must yield
  #   ERR_INVESTIGATION_NOT_DRAFT, not ERR_SEGREGATION_OF_DUTIES.
  # Instance B: business_safety posture (priority 6) vs business_temporal
  #   dwell (priority 11) — introducing a transfer while the room is ALERT and
  #   the dwell is unmet must yield ERR_ROOM_NOT_IN_CONTROL first.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_beats_segregation_of_duties
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - state_machines.ExcursionInvestigation
        distinguishing_aspect: |
          Category pair state vs business_safety: when the SAME QA user who
          investigated tries to approve an investigation that is ALREADY
          APPROVED, both rule 5 (not DRAFT -> ERR_INVESTIGATION_NOT_DRAFT,
          priority 5) and rule 8 (approver == investigator ->
          ERR_SEGREGATION_OF_DUTIES, priority 8) are violated; the scaffold's
          priority order pins ERR_INVESTIGATION_NOT_DRAFT as the winner.
        test_recipe:
          setup:
            - "Room CR-I ISO_7 with ACTIVE PARTICLE point SP-I; ALERT excursion recorded by tech-i; investigation opened by qa-i1 and APPROVED by qa-i2"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-I", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_i: $.data.id }
            - call: "POST /cleanroom/rooms/${room_i}/sampling-points"
              payload: { point_code: "SP-I", metric: "PARTICLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
              captures: { sp_i: $.data.id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_i}", result_value: 300500, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              as_user_id: "tech-i"
              captures: { exc_i: $.data.triggered_excursion_id }
            - call: "POST /cleanroom/excursions/${exc_i}/investigations"
              payload: { root_cause: "Investigation narrative for CR-I alert", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-i1"
              captures: { inv_i: $.data.id }
            - call: "POST /cleanroom/investigations/${inv_i}/approve"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-i2"
          trigger:
            - call: "POST /cleanroom/investigations/${inv_i}/approve"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-i1"
              captures: { err_i: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVESTIGATION_NOT_DRAFT  (priority 5 state check wins)"
            - "error_id != ERR_SEGREGATION_OF_DUTIES  (priority 8 would also be violated: qa-i1 == investigated_by)"
            - "ExcursionInvestigation.${inv_i}.status == APPROVED  (unchanged)"

      - name: posture_gate_beats_dwell_temporal_check
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.MaterialTransfer
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: introducing a
          transfer whose dwell time is NOT yet met while the room posture is
          ALERT violates both ERR_DWELL_TIME_NOT_MET (priority 11) and
          ERR_ROOM_NOT_IN_CONTROL (priority 6); the posture error wins because
          safety gates precede temporal gates.
        test_recipe:
          setup:
            - "Room CR-J ISO_7 with ACTIVE VIABLE point SP-J (viable alert 50); an open ALERT excursion keeps posture at ALERT"
            - "Transfer T-J STAGED at 2026-08-01T10:00:00Z with dwell_minutes=60, wiped_down=true"
            - "Clock at 2026-08-01T10:30:00Z — only 30 of 60 dwell minutes elapsed"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-J", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_j: $.data.id }
            - call: "POST /cleanroom/rooms/${room_j}/sampling-points"
              payload: { point_code: "SP-J", metric: "VIABLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
              captures: { sp_j: $.data.id }
            - call: "POST /cleanroom/material-transfers"
              payload: { cleanroom_id: "${room_j}", material_lot: "LOT-J", item_description: "Seal kit", dwell_minutes: 60, wiped_down: true }
              as: MaterialHandler
              captures: { xfer_j: $.data.id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_j}", result_value: 75, sampled_at: "2026-08-01T10:05:00Z" }
              as: EnvironmentTech
              captures: { exc_j: $.data.triggered_excursion_id }
            - call: "POST /cleanroom/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:30:00Z" }
              as: QualityAssurance
          trigger:
            - call: "POST /cleanroom/material-transfers/${xfer_j}/introduce"
              payload: {}
              as: MaterialHandler
              captures: { err_j: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_ROOM_NOT_IN_CONTROL  (priority 6 posture gate wins)"
            - "error_id != ERR_DWELL_TIME_NOT_MET  (priority 11 also violated: 30 < 60 minutes)"
            - "MaterialTransfer.${xfer_j}.status == STAGED  (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT metrics via
  # DIFFERENT endpoints. Instance A: sample exactly AT alert limit (>=) via
  # POST /cleanroom/samples. Instance B: dwell exactly met (>=) via
  # POST /cleanroom/material-transfers/{id}/introduce.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: sample_exactly_at_alert_limit_trips_excursion
        grounds:
          - calculations.sample_classification
          - entities.EnvironmentalSample.fields.classification
        distinguishing_aspect: |
          Metric 1 (particle count vs alert limit) via POST /cleanroom/samples:
          result_value exactly EQUAL to the alert limit (300000) classifies as
          ALERT_EXCEEDED (boundary is >=), while 299999 is IN_CONTROL. The pair
          of adjacent integers pins the >= operator.
        test_recipe:
          setup:
            - "Room CR-K ISO_7 (particle alert 300000/action 352000, viable 50/100, recert 180d) with ACTIVE PARTICLE point SP-K"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-K", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_k: $.data.id }
            - call: "POST /cleanroom/rooms/${room_k}/sampling-points"
              payload: { point_code: "SP-K", metric: "PARTICLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
              captures: { sp_k: $.data.id }
          trigger:
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_k}", result_value: 299999, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              captures: { samp_k_lo: $.data.id, exc_k_lo: $.data.triggered_excursion_id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_k}", result_value: 300000, sampled_at: "2026-08-01T09:05:00Z" }
              as: EnvironmentTech
              captures: { samp_k_hi: $.data.id, exc_k_hi: $.data.triggered_excursion_id }
          assert:
            - "EnvironmentalSample.${samp_k_lo}.classification == IN_CONTROL AND triggered_excursion_id == null  (299999 < 300000)"
            - "EnvironmentalSample.${samp_k_hi}.classification == ALERT_EXCEEDED AND triggered_excursion_id != null  (300000 >= 300000: boundary inclusive)"
            - "Excursion for ${samp_k_hi} has severity == ALERT  (300000 < action 352000)"

      - name: dwell_exactly_met_allows_introduction
        grounds:
          - state_machines.MaterialTransfer
          - validations[priority=11]
        distinguishing_aspect: |
          Metric 2 (elapsed dwell minutes) via
          POST /cleanroom/material-transfers/{id}/introduce: at exactly
          staged_at + dwell_minutes the introduction is ALLOWED (boundary >=);
          one second earlier it is rejected with ERR_DWELL_TIME_NOT_MET. The
          two clock positions pin the >= operator on a different metric than
          the particle count boundary.
        test_recipe:
          setup:
            - "Room CR-L ISO_8, VALIDATED cleaning, PASS certification, posture IN_CONTROL"
            - "Transfer T-L STAGED at 2026-08-01T10:00:00Z, dwell_minutes=30, wiped_down=true"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-L", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_l: $.data.id, room_l_v: $.data.version }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_l}", method_code: "MOP-12", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_l: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_l}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_l}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_l1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_l1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_l}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [100, 200], expected_room_version: "${room_l_v}" }
              as: QualityAssurance
            - call: "POST /cleanroom/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: QualityAssurance
            - call: "POST /cleanroom/material-transfers"
              payload: { cleanroom_id: "${room_l}", material_lot: "LOT-L", item_description: "Fasteners", dwell_minutes: 30, wiped_down: true }
              as: MaterialHandler
              captures: { xfer_l: $.data.id }
            - call: "POST /cleanroom/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:29:59Z" }
              as: QualityAssurance
            - call: "POST /cleanroom/material-transfers/${xfer_l}/introduce"
              payload: {}
              as: MaterialHandler
              captures: { err_l: $.data.error_id }
            - call: "POST /cleanroom/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:30:00Z" }
              as: QualityAssurance
          trigger:
            - call: "POST /cleanroom/material-transfers/${xfer_l}/introduce"
              payload: {}
              as: MaterialHandler
          assert:
            - "At 10:29:59 (1s early): HTTP 409 error_id == ERR_DWELL_TIME_NOT_MET, transfer stays STAGED"
            - "At 10:30:00 (exactly staged_at + 30m): introduction succeeds, MaterialTransfer.${xfer_l}.status == INTRODUCED  (boundary is >=)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency: two dependencies across DIFFERENT
  # entity pairs. Instance A: AssemblyTraveler start gated on Cleanroom posture
  # (Traveler -> Cleanroom). Instance B: CustomerAudit close gated on
  # AuditFinding children (Audit -> Finding).
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: traveler_start_gated_on_room_posture
        grounds:
          - state_machines.AssemblyTraveler
          - state_machines.Cleanroom
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair Traveler -> Cleanroom: a traveler step may start only
          when the PARENT BATCH's room has environment_posture == IN_CONTROL;
          an open ALERT excursion on the room (a sibling aggregate) blocks the
          traveler even though the batch and traveler rows are themselves in
          valid states.
        test_recipe:
          setup:
            - "Room CR-M ISO_7, VALIDATED cleaning, PASS certification, posture IN_CONTROL"
            - "Personnel P-M QUALIFIED for CR-M; batch B-M OPEN with traveler step 1"
            - "ACTIVE VIABLE point SP-M (viable alert 50/action 100)"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-M", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_m: $.data.id, room_m_v: $.data.version }
            - call: "POST /cleanroom/rooms/${room_m}/sampling-points"
              payload: { point_code: "SP-M", metric: "VIABLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
              captures: { sp_m: $.data.id }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_m}", method_code: "MOP-13", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_m: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_m}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_m}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_m1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_m1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_m}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [1000, 2000], expected_room_version: "${room_m_v}" }
              as: QualityAssurance
            - call: "POST /cleanroom/personnel"
              payload: { employee_code: "EMP-M", full_name: "Em Operator", role_title: "Assembler" }
              as: QualityAssurance
              captures: { pers_m: $.data.id }
            - call: "POST /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_m}", cleanroom_id: "${room_m}" }
              as: QualityAssurance
            - call: "POST /cleanroom/batches"
              payload: { cleanroom_id: "${room_m}", batch_number: "B-M", product_code: "PWB-2" }
              as: ProductionOperator
              as_user_id: "op-m"
              captures: { batch_m: $.data.id }
            - call: "POST /cleanroom/batches/${batch_m}/travelers"
              payload: { step_sequence: 1, step_description: "Solder joint" }
              as: ProductionOperator
              as_user_id: "op-m"
              captures: { trav_m1: $.data.id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_m}", result_value: 75, sampled_at: "2026-08-01T11:00:00Z" }
              as: EnvironmentTech
              captures: { exc_m: $.data.triggered_excursion_id }
          trigger:
            - call: "POST /cleanroom/travelers/${trav_m1}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-m"
              captures: { err_m: $.data.error_id }
          assert:
            - "HTTP 409 error_id == ERR_ROOM_NOT_IN_CONTROL  (room posture ALERT blocks traveler start)"
            - "AssemblyTraveler.${trav_m1}.status == PENDING  (unchanged)"
            - "AssemblyBatch.${batch_m}.status == OPEN  (no auto-transition fired)"

      - name: audit_close_gated_on_finding_states
        grounds:
          - state_machines.CustomerAudit
          - state_machines.AuditFinding
          - validations[priority=12]
        distinguishing_aspect: |
          Entity pair CustomerAudit -> AuditFinding (different pair than
          Traveler -> Cleanroom): the audit may close only when EVERY child
          finding is CAPA_VERIFIED; a single finding still CAPA_SUBMITTED holds
          the parent IN_PROGRESS even though the parent's own transition
          (IN_PROGRESS -> CLOSED) is otherwise well-formed.
        test_recipe:
          setup:
            - "Room CR-N ISO_8; audit AU-N opened (window started) with two findings; finding 1 CAPA_VERIFIED, finding 2 only CAPA_SUBMITTED"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-N", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_n: $.data.id }
            - call: "POST /cleanroom/audits"
              payload: { customer_code: "CUST-N", cleanroom_id: "${room_n}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: QualityAssurance
              captures: { aud_n: $.data.id }
            - call: "POST /cleanroom/audits/${aud_n}/open"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/audits/${aud_n}/findings"
              payload: { severity: "MINOR", description: "Log gap on second shift" }
              as: QualityAssurance
              captures: { find_n1: $.data.id }
            - call: "POST /cleanroom/audits/${aud_n}/findings"
              payload: { severity: "MAJOR", description: "Missing wipe-down record" }
              as: QualityAssurance
              captures: { find_n2: $.data.id }
            - call: "POST /cleanroom/audit-findings/${find_n1}/submit-capa"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/audit-findings/${find_n1}/verify-capa"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/audit-findings/${find_n2}/submit-capa"
              payload: {}
              as: QualityAssurance
          trigger:
            - call: "POST /cleanroom/audits/${aud_n}/close"
              payload: {}
              as: QualityAssurance
              captures: { err_n: $.data.error_id }
          assert:
            - "HTTP 409 error_id == ERR_AUDIT_FINDINGS_OPEN  (finding ${find_n2} is CAPA_SUBMITTED, not CAPA_VERIFIED)"
            - "CustomerAudit.${aud_n}.status == IN_PROGRESS  (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: two interval-collision rules with
  # DIFFERENT interval semantics on DIFFERENT resources.
  # Instance A: EntryLog double-entry (half-open occupancy: a personnel may not
  # enter a room while an open [entered_at, exited_at) interval exists — the
  # "collision" is with an OPEN interval, not a bounded one).
  # Instance B: CleaningValidationProgram single-ACTIVE-per-room (point-in-time
  # membership semantics: the constraint is not time-overlap arithmetic but
  # one ACTIVE/VALIDATED program per room at any instant — a capacity-of-1
  # resource with state-scoped, not interval-scoped, exclusion).
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: personnel_open_entry_interval_blocks_second_entry
        grounds:
          - entities.EntryLog
          - validations[priority=12]
        distinguishing_aspect: |
          Interval semantics: half-open OCCUPANCY interval [entered_at,
          exited_at) on the (personnel, room) resource — while exited_at is
          null the interval is unbounded, and a second entry collides. After
          exit the interval closes and re-entry is allowed. This is not
          bounded-interval-vs-bounded-interval overlap arithmetic.
        test_recipe:
          setup:
            - "Room CR-O ISO_8, VALIDATED cleaning, PASS certification, posture IN_CONTROL"
            - "Personnel P-O QUALIFIED for CR-O"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-O", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_o: $.data.id, room_o_v: $.data.version }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_o}", method_code: "MOP-15", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_o: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_o}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_o}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_o1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_o1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_o}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [100, 200], expected_room_version: "${room_o_v}" }
              as: QualityAssurance
            - call: "POST /cleanroom/personnel"
              payload: { employee_code: "EMP-O", full_name: "Oh Operator", role_title: "Assembler" }
              as: QualityAssurance
              captures: { pers_o: $.data.id }
            - call: "POST /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_o}", cleanroom_id: "${room_o}" }
              as: QualityAssurance
            - call: "POST /cleanroom/entry-logs"
              payload: { personnel_id: "${pers_o}", cleanroom_id: "${room_o}" }
              as: ProductionOperator
              as_user_id: "op-o"
              captures: { entry_o1: $.data.id }
          trigger:
            - call: "POST /cleanroom/entry-logs"
              payload: { personnel_id: "${pers_o}", cleanroom_id: "${room_o}" }
              as: ProductionOperator
              as_user_id: "op-o"
              captures: { err_o: $.data.error_id }
            - call: "POST /cleanroom/entry-logs/${entry_o1}/exit"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-o"
            - call: "POST /cleanroom/entry-logs"
              payload: { personnel_id: "${pers_o}", cleanroom_id: "${room_o}" }
              as: ProductionOperator
              as_user_id: "op-o"
              captures: { entry_o2: $.data.id }
          assert:
            - "Second entry while first is open: HTTP 409 error_id == ERR_ENTRY_ALREADY_OPEN  (open occupancy interval collides)"
            - "EntryLog.${entry_o1}.exited_at != null after exit call"
            - "Third entry after exit succeeds: EntryLog.${entry_o2}.id != null AND exited_at == null  (interval closed, re-entry allowed)"

      - name: single_active_cleaning_program_per_room
        grounds:
          - state_machines.CleaningValidationProgram
          - validations[priority=12]
        distinguishing_aspect: |
          Different interval semantics: POINT-IN-TIME capacity-1 membership on
          the room resource — at any instant at most one program per room may
          be in {ACTIVE, VALIDATED}; no time arithmetic is involved (no start/
          end overlap), the exclusion is state-scoped. Activating a second
          DRAFT program while the first is VALIDATED is rejected.
        test_recipe:
          setup:
            - "Room CR-P ISO_8 with program PROG-P1 VALIDATED; second program PROG-P2 in DRAFT"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-P", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_p: $.data.id }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_p}", method_code: "MOP-16A", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_p1: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_p1}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_p1}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_p1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_p1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_p}", method_code: "MOP-16B", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_p2: $.data.id }
          trigger:
            - call: "POST /cleanroom/cleaning-programs/${prog_p2}/activate"
              payload: {}
              as: QualityAssurance
              captures: { err_p: $.data.error_id }
          assert:
            - "HTTP 409 error_id == ERR_PROGRAM_ALREADY_ACTIVE  (PROG-P1 is VALIDATED; capacity-1 membership violated)"
            - "CleaningValidationProgram.${prog_p2}.status == DRAFT  (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: two forward/compensate pairs conserving
  # DIFFERENT quantities. Instance A: cycle verify (+1) then reject (-reset)
  # conserves the invariant that consecutive_pass_count equals the number of
  # VERIFIED PASS cycles since the last reset. Instance B: investigation
  # approve (excursion closes, posture may recover) then a NEW sample re-raises
  # — the conserved quantity is "room posture reflects the set of OPEN/
  # UNDER_INVESTIGATION excursions": after any sequence of raises and closes,
  # posture == IN_CONTROL iff zero excursions are open.
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cleaning_cycle_verify_reject_conserves_pass_count_derivation
        grounds:
          - calculations.consecutive_pass_count
          - state_machines.CleaningCycle
        distinguishing_aspect: |
          Conserved quantity: consecutive_pass_count == count of VERIFIED
          result=PASS cycles since the last reset event. Verify (+1) then
          reject of a different cycle (reset to 0) then two verifies must leave
          the counter at exactly 2 — the derived counter never drifts from the
          replayed event sequence.
        test_recipe:
          setup:
            - "Room CR-Q ISO_8; program PROG-Q (required 3) ACTIVE"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-Q", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_q: $.data.id }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_q}", method_code: "MOP-17", required_consecutive_passes: 3 }
              as: QualityAssurance
              captures: { prog_q: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_q}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_q}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_q1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_q1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_q}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_q2: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_q2}/reject"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_q}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_q3: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_q3}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_q}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_q4: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_q4}/verify"
              payload: {}
              as: QualityAssurance
          trigger:
            - call: "GET /cleanroom/cleaning-programs"
              payload: {}
              as: QualityAssurance
          assert:
            - "CleaningValidationProgram.${prog_q}.consecutive_pass_count == 2  (1 verified, reset, then 2 verified: 0+1->0->1->2)"
            - "CleaningValidationProgram.${prog_q}.status == ACTIVE  (2 < required 3, not yet VALIDATED)"
            - "CleaningCycle.${cyc_q2}.status == REJECTED AND CleaningCycle.${cyc_q1}/${cyc_q3}/${cyc_q4} status == VERIFIED"

      - name: excursion_raise_close_conserves_posture_derivation
        grounds:
          - state_machines.Cleanroom
          - state_machines.Excursion
          - entities.Cleanroom.fields.environment_posture
        distinguishing_aspect: |
          Different conserved quantity: environment_posture ==
          f(open excursion set) — after any interleaved sequence of excursion
          raises (sample) and closes (investigation approval with NONE impact),
          posture is IN_CONTROL iff the count of excursions in {OPEN,
          UNDER_INVESTIGATION} is zero. Two raises then two closes must return
          the room to IN_CONTROL with zero residual drift, and the intermediate
          state with one open excursion must be ALERT.
        test_recipe:
          setup:
            - "Room CR-R ISO_7, VALIDATED cleaning, PASS certification, posture IN_CONTROL"
            - "ACTIVE VIABLE point SP-R (alert 50/action 100)"
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-R", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_r: $.data.id, room_r_v: $.data.version }
            - call: "POST /cleanroom/rooms/${room_r}/sampling-points"
              payload: { point_code: "SP-R", metric: "VIABLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
              captures: { sp_r: $.data.id }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_r}", method_code: "MOP-18", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_r: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_r}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_r}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_r1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_r1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_r}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [100, 200], expected_room_version: "${room_r_v}" }
              as: QualityAssurance
          trigger:
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_r}", result_value: 75, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              captures: { exc_r1: $.data.triggered_excursion_id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_r}", result_value: 80, sampled_at: "2026-08-01T09:30:00Z" }
              as: EnvironmentTech
              captures: { exc_r2: $.data.triggered_excursion_id }
            - call: "POST /cleanroom/excursions/${exc_r1}/investigations"
              payload: { root_cause: "First excursion investigation narrative", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-r1"
              captures: { inv_r1: $.data.id }
            - call: "POST /cleanroom/investigations/${inv_r1}/approve"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-r2"
            - call: "GET /cleanroom/rooms/${room_r}"
              as: QualityAssurance
              captures: { posture_r_mid: $.data.environment_posture }
            - call: "POST /cleanroom/excursions/${exc_r2}/investigations"
              payload: { root_cause: "Second excursion investigation narrative", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-r1"
              captures: { inv_r2: $.data.id }
            - call: "POST /cleanroom/investigations/${inv_r2}/approve"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-r2"
            - call: "GET /cleanroom/rooms/${room_r}"
              as: QualityAssurance
              captures: { posture_r_end: $.data.environment_posture }
          assert:
            - "After closing 1 of 2 open excursions: Cleanroom.${room_r}.environment_posture == ALERT  (one still open)"
            - "After closing both: Cleanroom.${room_r}.environment_posture == IN_CONTROL  (zero open -> full recovery, no drift)"
            - "Excursion.${exc_r1}.status == CLOSED AND Excursion.${exc_r2}.status == CLOSED"
            - "Cleanroom.${room_r}.certification_status == CERTIFIED  (posture dimension recovered without touching certification)"
