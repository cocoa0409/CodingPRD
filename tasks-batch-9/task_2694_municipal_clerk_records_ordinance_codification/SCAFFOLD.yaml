  # ---- motions ------------------------------------------------------
  - method: POST
    path: "/clerk/motions"
    description: "Records a moved-and-seconded motion at an IN_SESSION meeting. A motion enters the register already SECONDED; an unseconded motion is never recorded."
    roles: [CityClerk, DeputyClerk]
    code: 201
    input: [meeting_id, motion_type, majority_rule, moved_by_member_id, seconded_by_member_id, "agenda_item_id?", "instrument_id?", "target_minutes_id?"]
    output: Motion
    side_effects:
      - "motion.status = SECONDED; motion.outcome = PENDING; motion.result_official = false"
      - "validation 94 enforces the motion_type / target pairing with ERR_MOTION_TARGET_INVALID"
  - method: GET
    path: "/clerk/motions/{motion_id}"
    description: "Reads one motion, including the vote arithmetic and result_official."
    roles: [CityClerk, DeputyClerk, PresidingOfficer, RecordsOfficer, CodificationEditor]
    code: 200
    input: []
    output: Motion
    side_effects: []
  - method: GET
    path: "/clerk/motions"
    description: "Lists motions, optionally filtered by meeting, agenda item, instrument, target minutes or status."
    roles: [CityClerk, DeputyClerk, PresidingOfficer, RecordsOfficer, CodificationEditor]
    code: 200
    input: ["meeting_id?", "agenda_item_id?", "instrument_id?", "target_minutes_id?", "status?", "limit?", "offset?"]
    output: Motion[]
    side_effects: []
  - method: POST
    path: "/clerk/motions/{motion_id}/tally"
    description: "Records the vote and resolves the motion. For a MINUTES_APPROVAL motion this is the head of the four-hop officialization cascade."
    roles: [CityClerk]
    code: 200
    input: [yes_count, no_count, abstain_count, recused_count, "presiding_tie_break?"]
    output: Motion
    side_effects:
      - "motion.effective_base, required_yes, outcome, tie_break_used = calculation motion_vote_outcome; motion.status SECONDED -> TALLIED"
      - "hop 1 (MINUTES_APPROVAL, passing): target MinutesRecord SUBMITTED -> APPROVED with approved_on set"
      - "hop 2: every Motion of the approved minutes' meeting sets result_official = true"
      - "hop 3: each such ORDINANCE_ADOPTION or RESOLUTION_ADOPTION motion that passed moves its instrument ADOPTED_UNOFFICIAL -> ADOPTED, mints assigned_number = '{prefix}-{series_year}-{next_sequence:03d}', and advances NumberSeries.next_sequence and minted_count by 1"
      - "hop 4: an ORDINANCE gains a DRAFT PublicationNotice with notice_type, required_publication_count and publication_deadline_on from calculation publication_requirement; a RESOLUTION instead takes effective_date_basis ADOPTION_IMMEDIATE and goes ADOPTED -> EFFECTIVE"
      - "MINUTES_CORRECTION: the target minutes returns CORRECTION_PENDING -> APPROVED, adopting pending_correction_text and bumping revision_number on a pass, discarding it on a fail"
      - "VETO_OVERRIDE (passing, FOUR_FIFTHS): instrument VETOED -> VETO_OVERRIDDEN and a replacement DRAFT PublicationNotice is created"
      - "ORDINANCE_ADOPTION (failing): instrument FIRST_READING_PASSED -> FAILED and no number is minted"

  # ---- publication notices ------------------------------------------
  - method: GET
    path: "/clerk/publication-notices/{notice_id}"
    description: "Reads one publication notice, including its invoice arithmetic."
    roles: [CityClerk, DeputyClerk, PresidingOfficer, RecordsOfficer, CodificationEditor]
    code: 200
    input: []
    output: PublicationNotice
    side_effects: []
  - method: GET
    path: "/clerk/publication-notices"
    description: "Lists publication notices, optionally filtered by instrument, meeting or status."
    roles: [CityClerk, DeputyClerk, PresidingOfficer, RecordsOfficer, CodificationEditor]
    code: 200
    input: ["instrument_id?", "meeting_id?", "status?", "limit?", "offset?"]
    output: PublicationNotice[]
    side_effects: []
  - method: POST
    path: "/clerk/publication-notices/{notice_id}/order"
    description: "Places the insertion order with the newspaper of record and prices the invoice."
    roles: [CityClerk, DeputyClerk]
    code: 200
    input: [newspaper_name, column_inches, publication_dates, affidavit_required]
    output: PublicationNotice
    side_effects:
      - "notice.status DRAFT -> ORDERED; notice.newspaper_name, column_inches and publication_dates are stored"
      - "notice.gross_cost_cents, discount_pct and invoice_total_cents = calculation publication_invoice_total"
      - "validation 68 enforces the insertion count, the deadline and the minimum gap"
  - method: POST
    path: "/clerk/publication-notices/{notice_id}/certify-publication"
    description: "Certifies that the ordered insertions ran. For an instrument notice this is the head of the four-hop publication-to-codification cascade."
    roles: [CityClerk]
    code: 200
    input: [publication_completed_on]
    output: PublicationNotice
    side_effects:
      - "hop 1: notice.status ORDERED -> PUBLISHED; notice.publication_completed_on = input publication_completed_on"
      - "hop 2 (instrument notices): instrument.publication_completed_on mirrored, effective_date_basis and effective_date = calculation instrument_effective_date, instrument ADOPTED|VETO_OVERRIDDEN -> PUBLISHED (and on to EFFECTIVE when the computed effective_date is already reached and the category is not CODE_AMENDMENT)"
      - "hop 3 (ordinance_category == CODE_AMENDMENT): auto-enrols CodificationSubmission{origin: CASCADE, action: AMEND, cycle_id: the selected cycle, instrument_id, code_section_ref: instrument.code_section_ref, status: PENDING}. Cycle selector: status OPEN, code_title_id == instrument.code_title_id, window_open_on <= clock date <= window_close_on; ranked by window_close_on ASC, tie-broken by created_at ASC; an empty selection raises ERR_NO_OPEN_SUPPLEMENT_CYCLE"
      - "hop 4: cycle.submission_count += 1; when another PENDING or IN_REVIEW submission in that cycle carries the same code_section_ref for a DIFFERENT instrument, both rows go to CONFLICT_HELD, point conflict_with_submission_id at each other, and cycle.conflict_count += 1"
      - "no cascade for MEETING_AGENDA or CANCELLATION notices"

