# =============================================================================
# task_2919 — §1.9 Scaffold Corner Design (Breadth Probe)
# Sections and claim_type values are taken verbatim (snake_cased) from
# references/claim-extraction-guide.md. Corners already asserted by a §1.8
# instance are emitted as `excluded_because:` stubs naming that instance.
# Every numeric literal was computed against the §1.3 formulas.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: provider_creation_defaults_every_compliance_counter
        claim_type: creation
        grounds:
          - entities.Provider.fields.rmd_filing_status
          - entities.Provider.fields.auth_posture
          - entities.Provider.fields.penalty_points
          - "endpoints[POST /rmd/providers]"
        distinguishing_aspect: "A freshly registered Provider returns 201 with rmd_filing_status UNFILED, auth_posture SIGNING_SUSPENDED, active_certificate_id null and every counter at 0 — no provider can sign calls at registration time."
        test_recipe:
          setup:
            - "Empty database; logical clock at the 2026-08-01T00:00:00Z startup default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "POST /rmd/providers"
              payload: { legal_name: "Kestrel Voice LLC", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object"
            - "Provider.${prov_id}.rmd_filing_status == UNFILED"
            - "Provider.${prov_id}.auth_posture == SIGNING_SUSPENDED"
            - "Provider.${prov_id}.active_certificate_id == null"
            - "Provider.${prov_id}.penalty_points == 0"
            - "Provider.${prov_id}.overdue_traceback_count == 0"
            - "Provider.${prov_id}.open_notice_count == 0"
            - "Provider.${prov_id}.active_assigned_number_count == 0"
            - "Provider.${prov_id}.outstanding_forfeiture_cents == 0"
            - "Provider.${prov_id}.blocking_false_positive_rate == 0.0"
            - "Provider.${prov_id}.sweep_index == 0"
            - "Provider.${prov_id}.version == 1"

      - name: certificate_retrieval_echoes_stored_validity_interval
        claim_type: retrieval
        grounds:
          - entities.Certificate.fields.not_before
          - entities.Certificate.fields.not_after
          - "endpoints[GET /rmd/certificates/{certificateId}]"
        distinguishing_aspect: "GET /rmd/certificates/{certificateId} returns the stored REQUESTED certificate with not_before/not_after exactly as supplied, renewal_generation 1 and predecessor_certificate_id null."
        test_recipe:
          setup:
            - "One provider with one certificate requested but not yet issued"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Marlin Voice Inc", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/certificates"
              payload: { provider_id: "${prov_id}", spc_token: "SPC-1001", public_key_fingerprint: "fp-1001", not_before: "2026-08-01T00:00:00Z", not_after: "2027-08-01T00:00:00Z" }
              as: PolicyAdministrator
              captures: { cert_id: $.data.id }
          trigger:
            - call: "GET /rmd/certificates/${cert_id}"
              payload: {}
              as: PolicyAdministrator
          assert:
            - "HTTP 200 and Certificate.${cert_id}.status == REQUESTED"
            - "Certificate.${cert_id}.not_before == 2026-08-01T00:00:00Z"
            - "Certificate.${cert_id}.not_after == 2027-08-01T00:00:00Z"
            - "Certificate.${cert_id}.spc_token == SPC-1001"
            - "Certificate.${cert_id}.renewal_generation == 1"
            - "Certificate.${cert_id}.predecessor_certificate_id == null"
            - "Certificate.${cert_id}.issued_at == null"

      - name: customer_listing_filters_by_provider_and_paginates
        claim_type: listing
        grounds:
          - "endpoints[GET /rmd/customers]"
          - entities.Customer.fields.provider_id
        distinguishing_aspect: "GET /rmd/customers?provider_id=&limit=2&offset=0 returns exactly 2 of provider A's 3 customers with total_count 3 and has_more true, and none of provider B's customer."
        test_recipe:
          setup:
            - "Provider A with three customers, provider B with one customer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Provider A Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_a_id: $.data.id }
            - call: "POST /rmd/providers"
              payload: { legal_name: "Provider B Voice", provider_type: "GATEWAY" }
              as: Regulator
              captures: { prov_b_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_a_id}", legal_name: "A One", contact_email: "one@a.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_a_id}"
              captures: { cust_a1_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_a_id}", legal_name: "A Two", contact_email: "two@a.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_a_id}"
              captures: { cust_a2_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_a_id}", legal_name: "A Three", contact_email: "three@a.example", kyc_evidence_level: "SELF_ATTESTED" }
              as: ProviderAdmin
              as_user_id: "${prov_a_id}"
              captures: { cust_a3_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_b_id}", legal_name: "B One", contact_email: "one@b.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_b_id}"
              captures: { cust_b1_id: $.data.id }
          trigger:
            - call: "GET /rmd/customers"
              payload: { provider_id: "${prov_a_id}", limit: 2, offset: 0 }
              as: Regulator
          assert:
            - "HTTP 200 and response_type == array"
            - "data contains exactly 2 customers, total_count == 3, has_more == true"
            - "Every returned customer has provider_id == ${prov_a_id}"
            - "Customer ${cust_b1_id} is absent from the result"

      - name: traceback_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_TRACEBACK_NOT_FOUND]
          - "endpoints[GET /rmd/traceback-requests/{tracebackId}]"
        distinguishing_aspect: "A syntactically valid but unknown tracebackId returns 404 ERR_TRACEBACK_NOT_FOUND, not 200 with an empty body."
        test_recipe:
          setup:
            - "Empty database; clock at the startup default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "GET /rmd/traceback-requests/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Regulator
              expect: { status: 404, error_id: ERR_TRACEBACK_NOT_FOUND }
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_TRACEBACK_NOT_FOUND"

      - name: customer_creation_missing_kyc_evidence_level_rejected
        claim_type: required_fields
        grounds:
          - entities.Customer.fields.kyc_evidence_level
          - errors[ERR_INVALID_REQUEST]
          - "endpoints[POST /rmd/customers]"
        distinguishing_aspect: "kyc_evidence_level has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST and creates no Customer row."
        test_recipe:
          setup:
            - "One registered provider"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Osprey Voice LLC", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Missing Evidence Co", contact_email: "ops@missing.example" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect: { status: 400, error_id: ERR_INVALID_REQUEST }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /rmd/customers?provider_id=${prov_id} returns total_count == 0"

      - name: customer_defaults_pending_kyc_and_disabled_origination
        claim_type: defaults
        grounds:
          - entities.Customer.fields.kyc_state
          - entities.Customer.fields.origination_state
          - entities.Customer.fields.risk_tier
        distinguishing_aspect: "A newly created Customer defaults to kyc_state PENDING, origination_state DISABLED, traffic_risk_index 0.0, risk_tier LOW, observation_count 0 and suspension_cause null — origination is never granted implicitly."
        test_recipe:
          setup:
            - "One registered provider"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Petrel Voice LLC", provider_type: "NON_FACILITIES_RESELLER" }
              as: Regulator
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Default State Co", contact_email: "ops@default.example", kyc_evidence_level: "SELF_ATTESTED" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
          assert:
            - "HTTP 201 and Customer.${cust_id}.kyc_state == PENDING"
            - "Customer.${cust_id}.origination_state == DISABLED"
            - "Customer.${cust_id}.traffic_risk_index == 0.0"
            - "Customer.${cust_id}.risk_tier == LOW"
            - "Customer.${cust_id}.observation_count == 0"
            - "Customer.${cust_id}.false_positive_count == 0"
            - "Customer.${cust_id}.suspension_cause == null"
            - "Provider.${prov_id}.active_assigned_number_count == 0"

      - name: attestation_level_a_computed_for_fully_verified_owned_number
        claim_type: computed_fields
        grounds:
          - calculations.attestation_level_assignment
          - entities.CallAttestation.fields.attestation_level
          - entities.CallAttestation.fields.passport_identity_token
        distinguishing_aspect: "With FULL_ATTESTATION posture, BUSINESS_REGISTRY_VERIFIED KYC, LOW risk and DIRECT_ALLOCATION ownership of the calling number, the computed attestation_level is A with reason FULL_KYC_AND_OWNERSHIP, ownership_verified true and a non-null passport_identity_token — none of which the client supplied."
        test_recipe:
          setup:
            - "Provider with an ACTIVE certificate and an ACCEPTED plan (auth_posture FULL_ATTESTATION)"
            - "One BUSINESS_REGISTRY_VERIFIED, kyc-VERIFIED, origination-ENABLED customer owning +12025550111 from 2026-08-01T00:00:00Z with no observations (risk_tier LOW)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Auklet Voice LLC", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/certificates"
              payload: { provider_id: "${prov_id}", spc_token: "SPC-1007", public_key_fingerprint: "fp-1007", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }
              as: PolicyAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /rmd/certificates/${cert_id}/issue"
              payload: {}
              as: PolicyAdministrator
            - call: "POST /rmd/certificates/${cert_id}/activate"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_v0: $.data.version }
            - call: "POST /rmd/mitigation-plans"
              payload: { provider_id: "${prov_id}", prevention_practices: ["KYC_ONBOARDING", "TRACEBACK_COOPERATION", "TRAFFIC_PATTERN_MONITORING"], expected_provider_version: "${prov_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /rmd/mitigation-plans/${plan_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /rmd/mitigation-plans/${plan_id}/decision"
              payload: { decision: "ACCEPT" }
              as: Regulator
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Verified Outreach Co", contact_email: "ops@verified.example", kyc_evidence_level: "BUSINESS_REGISTRY_VERIFIED" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /rmd/customers/${cust_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025550111", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /rmd/call-attestations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", calling_number: "+12025550111", called_number: "+12025550999", origination_time: "2026-08-01T12:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { att_id: $.data.id }
          assert:
            - "HTTP 201 and CallAttestation.${att_id}.attestation_level == A"
            - "CallAttestation.${att_id}.attestation_reason_code == FULL_KYC_AND_OWNERSHIP"
            - "CallAttestation.${att_id}.ownership_verified == true"
            - "CallAttestation.${att_id}.risk_tier_at_signing == LOW"
            - "CallAttestation.${att_id}.certificate_id == ${cert_id}"
            - "CallAttestation.${att_id}.passport_identity_token != null"

      - name: observation_recorded_by_user_id_is_system_assigned
        claim_type: system_fields
        grounds:
          - entities.TrafficObservation.fields.recorded_by_user_id
          - entities.TrafficObservation.fields.window_subscore
        distinguishing_aspect: "recorded_by_user_id is stamped from the ProviderAdmin's X-User-ID rather than from the body, and window_subscore/resulting_risk_index are computed on write: (1000,500,500,0) yields 0.40 and 0.4000."
        test_recipe:
          setup:
            - "One provider with one customer in default state (no KYC needed to record monitoring data)"
            - "Clock at the 2026-08-01T00:00:00Z default so a July window is closed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Curlew Voice LLC", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Monitored Co", contact_email: "ops@monitored.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /rmd/traffic-observations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z", total_call_count: 1000, short_duration_call_count: 500, unanswered_call_count: 500, complaint_count: 0 }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { obs_id: $.data.id }
          assert:
            - "HTTP 201 and TrafficObservation.${obs_id}.recorded_by_user_id == ${prov_id}"
            - "TrafficObservation.${obs_id}.window_subscore == 0.40"
            - "TrafficObservation.${obs_id}.resulting_risk_index == 0.4000"
            - "TrafficObservation.${obs_id}.triggered_suspension == false"
            - "Customer.${cust_id}.risk_tier == ELEVATED"
            - "Customer.${cust_id}.observation_count == 1"

      - name: provider_type_rejects_undeclared_enum_member
        claim_type: type_constraints
        grounds:
          - entities.Provider.fields.provider_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "provider_type accepts only FACILITIES_BASED, NON_FACILITIES_RESELLER or GATEWAY; the undeclared member WHOLESALE returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database; clock at the startup default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "POST /rmd/providers"
              payload: { legal_name: "Bogus Enum Voice", provider_type: "WHOLESALE" }
              as: Regulator
              expect: { status: 400, error_id: ERR_INVALID_REQUEST }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /rmd/providers returns total_count == 0"

      - name: traffic_observation_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.TrafficObservation.fields.window_subscore
          - "endpoints[GET /rmd/traffic-observations/{observationId}]"
        distinguishing_aspect: "TrafficObservation is declared common_fields: false, so its GET response carries no version field and §1.5 declares no update or delete endpoint for it — the recorded window can only be superseded by a new, non-overlapping window."
        test_recipe:
          setup:
            - "One provider, one customer and one recorded observation over [2026-07-01T00:00:00Z, 2026-07-02T00:00:00Z]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Plover Voice LLC", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Immutable Co", contact_email: "ops@immutable.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /rmd/traffic-observations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z", total_call_count: 10, short_duration_call_count: 1, unanswered_call_count: 1, complaint_count: 0 }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { obs_id: $.data.id }
          trigger:
            - call: "GET /rmd/traffic-observations/${obs_id}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fraud-1"
          assert:
            - "HTTP 200 and the data object contains no `version` key"
            - "TrafficObservation.${obs_id}.window_subscore == 0.08"
            - "No PATCH, PUT or DELETE endpoint for /rmd/traffic-observations/{observationId} exists in §1.5"

      - name: blocking_event_with_unknown_customer_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - entities.BlockingEvent.fields.customer_id
          - "endpoints[POST /rmd/blocking-events]"
        distinguishing_aspect: "Flat topology FK integrity: a body FK (customer_id) pointing at no Customer returns 404 ERR_CUSTOMER_NOT_FOUND at priority 7, before any analytics-score business check at priority 27."
        test_recipe:
          setup:
            - "One provider and no customers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Godwit Voice LLC", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /rmd/blocking-events"
              payload: { provider_id: "${prov_id}", customer_id: "00000000-0000-0000-0000-000000000000", calling_number: "+12025550111", analytics_score: 0.10, reason: "ANALYTICS_SCORE" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              expect: { status: 404, error_id: ERR_CUSTOMER_NOT_FOUND }
          assert:
            - "HTTP 404 with data.error_id == ERR_CUSTOMER_NOT_FOUND (not ERR_SCORE_BELOW_BLOCKING_THRESHOLD, although analytics_score 0.10 also violates priority 27)"
            - "Provider.${prov_id}.blocking_false_positive_rate == 0.0"

  - section: state_machines
    instances:
      - name: certificate_request_moves_to_issued_on_issue_trigger
        claim_type: valid_transition
        grounds:
          - state_machines.Certificate.REQUESTED_to_ISSUED
          - "endpoints[POST /rmd/certificates/{certificateId}/issue]"
        distinguishing_aspect: "The declared REQUESTED -> ISSUED transition fires, stamps issued_at from the logical clock and bumps Certificate.version to 2 while activated_at stays null."
        test_recipe:
          setup:
            - "One provider with one REQUESTED certificate; clock at 2026-08-02T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Transition Voice LLC", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/certificates"
              payload: { provider_id: "${prov_id}", spc_token: "SPC-2001", public_key_fingerprint: "fp-2001", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }
              as: PolicyAdministrator
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /rmd/certificates/${cert_id}/issue"
              payload: {}
              as: PolicyAdministrator
          assert:
            - "HTTP 200 and Certificate.${cert_id}.status == ISSUED"
            - "Certificate.${cert_id}.issued_at == 2026-08-02T09:00:00Z"
            - "Certificate.${cert_id}.activated_at == null"
            - "Certificate.${cert_id}.version == 2"
            - "Provider.${prov_id}.active_certificate_id == null and auth_posture == SIGNING_SUSPENDED (issuance alone does not enable signing)"

      - name: second_certificate_activation_rejected_while_one_is_active
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Certificate.ISSUED_to_ACTIVE
          - "validations[priority=11]"
          - errors[ERR_CERTIFICATE_STATE_INVALID]
