# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2813
# Grocery Delivery Shopper Network & Batch Dispatch
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7; every asserted number was executed against the
# §1.3 formulas and their constants before being written here.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: order_authorization_estimate_vs_final_capture
        grounds:
          - calculations.order_estimate_authorization
          - calculations.checkout_split_tender_capture
          - calculations.checkout_line_pricing
          - entities.Order.fields.authorized_ebt_cents
          - entities.Order.fields.ebt_captured_cents
          - state_machines.Order.payment_status.UNAUTHORIZED_to_AUTHORIZED
          - state_machines.Order.payment_status.AUTHORIZED_to_CAPTURED
        distinguishing_aspect: |
          The ESTIMATE variant buffers the basket by AUTH_BUFFER_MULT and derives the EBT slice
          from requested weights, while the FINAL variant applies no buffer and caps the EBT slice
          a third time by authorized_ebt_cents, so on the same Order one weighed line settling at
          2.3 lb instead of 2.0 lb makes authorized_card_cents (2900) differ from
          card_captured_cents (2486) while ebt stays pinned at its authorized ceiling of 2758.
        test_recipe:
          setup:
            - "Retailer R1: catalog_markup_pct 0.15, ebt_snap_enabled true, concurrent_shopper_cap 2."
            - "Items: I1 EACH in_store 400 EBT-eligible unit_weight 1.0 (catalog 460); I2 PER_LB in_store 599 EBT-eligible (catalog 689); I3 EACH in_store 1200 non-EBT unit_weight 2.5 (catalog 1380)."
            - "Customer C1 with ebt_snap_balance_cents 5000; Shopper S1 with vehicle_capacity_units 10 in area SF-01."
            - "Order O1: ebt_requested true, tip 500, distance 12.0; lines L1 = I1 x3, L2 = I2 @ 2.0 lb, L3 = I3 x1."
            - "Batch B1 in SF-01 window 08:00-11:00 with tier_access_floor PROBATION, holding O1, claimed by S1 and in SHOPPING with all three lines picked (L2 weighed at 2.3 lb)."
            - "Logical clock at 2026-08-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15, parity_disclosure_required: true, ebt_snap_enabled: true, concurrent_shopper_cap: 2 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-EACH-EBT", name: "Canned Beans", pricing_unit: "EACH", in_store_price_cents: 400, is_ebt_eligible: true, unit_weight_lb: 1.0 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i1: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-LB-EBT", name: "Ground Coffee Bulk", pricing_unit: "PER_LB", in_store_price_cents: 599, is_ebt_eligible: true, estimated_weight_lb: 2.0 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i2: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-EACH-NOEBT", name: "Laundry Detergent", pricing_unit: "EACH", in_store_price_cents: 1200, is_ebt_eligible: false, unit_weight_lb: 2.5 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i3: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Dana Ortiz", card_last4: "4242", ebt_snap_balance_cents: 5000 }
              as: CustomerSupport
              captures: { c1: $.data.id }
            - call: "POST /shoppers"
              payload: { display_name: "Sam Reyes", service_area_code: "SF-01", vehicle_capacity_units: 10 }
              as: DispatchAdmin
              captures: { s1: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1}", retailer_id: "${r1}", delivery_distance_mi: 12.0, delivery_deadline: "2026-08-01T11:00:00Z", ebt_requested: true, tip_amount_cents: 500 }
              as: Customer
              as_user_id: "${c1}"
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/lines"
              payload: { catalog_item_id: "${i1}", requested_qty: 3 }
              as: Customer
              as_user_id: "${c1}"
              captures: { l1: $.data.id }
            - call: "POST /orders/${o1}/lines"
              payload: { catalog_item_id: "${i2}", requested_weight_lb: 2.0 }
              as: Customer
              as_user_id: "${c1}"
              captures: { l2: $.data.id }
            - call: "POST /orders/${o1}/lines"
              payload: { catalog_item_id: "${i3}", requested_qty: 1 }
              as: Customer
              as_user_id: "${c1}"
              captures: { l3: $.data.id }
            - call: "POST /orders/${o1}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c1}"
              captures: { o1_est: $.data.estimated_subtotal_cents, o1_ceiling: $.data.authorization_ceiling_cents, o1_auth_ebt: $.data.authorized_ebt_cents, o1_auth_card: $.data.authorized_card_cents }
            - call: "POST /batches"
              payload: { service_area_code: "SF-01", shop_window_start: "2026-08-01T08:00:00Z", shop_window_end: "2026-08-01T11:00:00Z", tier_access_floor: "PROBATION" }
              as: DispatchAdmin
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /batches/${b1}/orders"
              payload: { order_id: "${o1}", expected_batch_version: "${b1_v}" }
              as: DispatchAdmin
            - call: "POST /batches/${b1}/dispatch"
              payload: {}
              as: DispatchAdmin
            - call: "POST /batches/${b1}/claim"
              payload: {}
              as: Shopper
              as_user_id: "${s1}"
            - call: "POST /batches/${b1}/start-shopping"
              payload: {}
              as: Shopper
              as_user_id: "${s1}"
            - call: "POST /order-lines/${l1}/pick"
              payload: { picked_qty: 3 }
              as: Shopper
              as_user_id: "${s1}"
            - call: "POST /order-lines/${l2}/pick"
              payload: { final_weight_lb: 2.3 }
              as: Shopper
              as_user_id: "${s1}"
            - call: "POST /order-lines/${l3}/pick"
              payload: { picked_qty: 1 }
              as: Shopper
              as_user_id: "${s1}"
          trigger:
            - call: "POST /batches/${b1}/checkout"
              payload: {}
              as: Shopper
              as_user_id: "${s1}"
          assert:
            - "ESTIMATE variant at submit: Order.${o1}.estimated_subtotal_cents == 4138"
            - "ESTIMATE variant at submit: Order.${o1}.authorization_ceiling_cents == 5658"
            - "ESTIMATE variant at submit: Order.${o1}.authorized_ebt_cents == 2758 and Order.${o1}.authorized_card_cents == 2900"
            - "FINAL variant at checkout: OrderLine.${l2}.final_price_cents == 1585 and Order.${o1}.captured_subtotal_cents == 4345"
            - "FINAL variant at checkout: Order.${o1}.ebt_captured_cents == 2758 (min of live balance 5000, eligible picked money 2965, authorized ceiling 2758)"
            - "FINAL variant at checkout: Order.${o1}.card_captured_cents == 2486, which differs from authorized_card_cents 2900"
            - "Customer.${c1}.ebt_snap_balance_cents == 2242 and Customer.${c1}.ebt_captured_total_cents == 2758"
            - "Order.${o1}.captured_subtotal_cents != Order.${o1}.estimated_subtotal_cents (4345 vs 4138)"

      - name: shopper_tier_rolling_vs_lifetime_divergence
        grounds:
          - calculations.shopper_tier_scoring
          - entities.Shopper.fields.tier
          - entities.Shopper.fields.lifetime_tier
          - entities.Shopper.fields.rolling_tier_score
          - entities.Shopper.fields.lifetime_tier_score
          - validations[priority=12]
        distinguishing_aspect: |
          On the Shopper reputation domain (not the Order money domain of the sibling instance) the
          ROLLING_5 variant averages only the newest 5 ratings while the LIFETIME variant averages
          all 8, so the same star history [1,1,1,1,5,5,5,5] yields rolling_tier_score 0.8600 with
          tier PLATINUM but lifetime_tier_score 0.6500 with lifetime_tier STANDARD.
        test_recipe:
          setup:
            - "Shopper S1 in area SF-01 with vehicle_capacity_units 10 and no abandonments."
            - "Eight ratings injected in chronological order: 1,1,1,1,5,5,5,5 (sequence_no 1..8)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /shoppers"
              payload: { display_name: "Sam Reyes", service_area_code: "SF-01", vehicle_capacity_units: 10 }
              as: DispatchAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /_ratings/backfill"
              payload: { shopper_id: "${s1}", stars_sequence: [1, 1, 1, 1, 5, 5, 5, 5] }
              as: DispatchAdmin
              captures: { s1_tier: $.data.tier, s1_life_tier: $.data.lifetime_tier }
          assert:
            - "Shopper.${s1}.rolling_recent_avg == 4.2 (mean of the newest five ratings 1,5,5,5,5)"
            - "Shopper.${s1}.lifetime_rating_avg == 3.0 (mean of all eight ratings)"
            - "Shopper.${s1}.rolling_tier_score == 0.8600 and Shopper.${s1}.lifetime_tier_score == 0.6500"
            - "Shopper.${s1}.tier == PLATINUM while Shopper.${s1}.lifetime_tier == STANDARD"
            - "Shopper.${s1}.tier != Shopper.${s1}.lifetime_tier for identical input data"

  - rule_id: combinatorial_formula
    instances:
      - name: weighted_line_round_per_line_then_sum
        grounds:
          - calculations.checkout_line_pricing
          - calculations.order_estimate_authorization
          - entities.OrderLine.fields.final_price_cents
          - entities.Order.fields.captured_subtotal_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding instance: two PER_LB lines at 689 cents/lb x 2.5 lb each round to
          1723 cents per line for a subtotal of 3446, whereas summing the unrounded products first
          (689 * 2.5 * 2 = 3445.0) and rounding once yields 3445 — a one-cent divergence that pins
          round-per-line-then-sum as the only correct order.
        test_recipe:
          setup:
            - "Retailer R1 with catalog_markup_pct 0.15; item I2 PER_LB in_store 599 (catalog 689)."
            - "Customer C2 with no EBT balance; Shopper S1 with vehicle_capacity_units 10 in SF-01."
            - "Order O2: ebt_requested false, tip 0, distance 5.0, two PER_LB lines of I2 each requested at 2.5 lb."
            - "Batch B2 holding O2, claimed by S1, in SHOPPING with both lines weighed at exactly 2.5 lb."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-LB-EBT", name: "Ground Coffee Bulk", pricing_unit: "PER_LB", in_store_price_cents: 599, is_ebt_eligible: true, estimated_weight_lb: 2.5 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i2: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Ravi Menon", card_last4: "1881" }
              as: CustomerSupport
              captures: { c2: $.data.id }
            - call: "POST /shoppers"
              payload: { display_name: "Sam Reyes", service_area_code: "SF-01", vehicle_capacity_units: 10 }
              as: DispatchAdmin
              captures: { s1: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c2}", retailer_id: "${r1}", delivery_distance_mi: 5.0, delivery_deadline: "2026-08-01T11:00:00Z", ebt_requested: false, tip_amount_cents: 0 }
              as: Customer
              as_user_id: "${c2}"
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/lines"
              payload: { catalog_item_id: "${i2}", requested_weight_lb: 2.5 }
              as: Customer
              as_user_id: "${c2}"
              captures: { m1: $.data.id }
            - call: "POST /orders/${o2}/lines"
              payload: { catalog_item_id: "${i2}", requested_weight_lb: 2.5 }
              as: Customer
              as_user_id: "${c2}"
              captures: { m2: $.data.id }
            - call: "POST /orders/${o2}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c2}"
              captures: { o2_est: $.data.estimated_subtotal_cents }
            - call: "POST /batches"
              payload: { service_area_code: "SF-01", shop_window_start: "2026-08-01T08:00:00Z", shop_window_end: "2026-08-01T11:00:00Z", tier_access_floor: "PROBATION" }
              as: DispatchAdmin
              captures: { b2: $.data.id, b2_v: $.data.version }
            - call: "POST /batches/${b2}/orders"
              payload: { order_id: "${o2}", expected_batch_version: "${b2_v}" }
              as: DispatchAdmin
            - call: "POST /batches/${b2}/dispatch"
              payload: {}
              as: DispatchAdmin
            - call: "POST /batches/${b2}/claim"
              payload: {}
              as: Shopper
              as_user_id: "${s1}"
            - call: "POST /batches/${b2}/start-shopping"
              payload: {}
              as: Shopper
              as_user_id: "${s1}"
            - call: "POST /order-lines/${m1}/pick"
              payload: { final_weight_lb: 2.5 }
              as: Shopper
              as_user_id: "${s1}"
            - call: "POST /order-lines/${m2}/pick"
              payload: { final_weight_lb: 2.5 }
              as: Shopper
              as_user_id: "${s1}"
          trigger:
            - call: "POST /batches/${b2}/checkout"
              payload: {}
              as: Shopper
              as_user_id: "${s1}"
          assert:
            - "OrderLine.${m1}.final_price_cents == 1723 and OrderLine.${m2}.final_price_cents == 1723"
            - "Order.${o2}.captured_subtotal_cents == 3446, NOT 3445"
            - "Order.${o2}.estimated_subtotal_cents == 3446 (the same per-line-first order is used at submit)"
            - "Order.${o2}.authorization_ceiling_cents == 4362"
            - "Order.${o2}.card_captured_cents == 3845 and Order.${o2}.ebt_captured_cents == 0"

      - name: payout_guarantee_topup_after_tip_protection_ordering
        grounds:
          - calculations.payout_finalization
          - calculations.shopper_batch_pay
          - entities.ShopperPayout.fields.guarantee_top_up_cents
          - entities.ShopperPayout.fields.total_payout_cents
          - state_machines.Batch.CHECKED_OUT_to_DELIVERED
        distinguishing_aspect: |
          Mode (c) evaluation-order instance: the guarantee floor is applied at step S5 to the
          tip-inclusive subtotal, so a 20-unit batch paying batch_pay 1200 with a 300-cent tip tops
          up by only 100 to reach total_payout_cents 1600, whereas topping up from batch_pay alone
          before adding the tip would produce 1900 for the same inputs.
        test_recipe:
          setup:
            - "Retailer R3 with catalog_markup_pct 0.15; item I5 EACH in_store 100 unit_weight_lb 0.5 (catalog 115)."
            - "Customer C3; Shopper S3 with vehicle_capacity_units 20 in SF-03."
            - "Order O5: 1 line of I5 with requested_qty 20, tip 300, distance 8.0 (exactly the free-mileage boundary, so mileage_bonus_cents is 0)."
            - "Batch B5 holding O5, claimed by S3, all lines picked and checked out."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Valley Grocers Inc", store_code: "VG-03", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r3: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r3}", sku: "SKU-SNACK", name: "Granola Bar", pricing_unit: "EACH", in_store_price_cents: 100, is_ebt_eligible: false, unit_weight_lb: 0.5 }
              as: RetailerManager
              as_user_id: "${r3}"
              captures: { i5: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Ana Whit", card_last4: "7788" }
              as: CustomerSupport
              captures: { c3: $.data.id }
            - call: "POST /shoppers"
              payload: { display_name: "Tess Nakamura", service_area_code: "SF-03", vehicle_capacity_units: 20 }
              as: DispatchAdmin
              captures: { s3: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c3}", retailer_id: "${r3}", delivery_distance_mi: 8.0, delivery_deadline: "2026-08-01T11:00:00Z", ebt_requested: false, tip_amount_cents: 300 }
              as: Customer
              as_user_id: "${c3}"
              captures: { o5: $.data.id }
            - call: "POST /orders/${o5}/lines"
              payload: { catalog_item_id: "${i5}", requested_qty: 20 }
              as: Customer
              as_user_id: "${c3}"
              captures: { n1: $.data.id }
            - call: "POST /orders/${o5}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c3}"
            - call: "POST /batches"
              payload: { service_area_code: "SF-03", shop_window_start: "2026-08-01T08:00:00Z", shop_window_end: "2026-08-01T11:00:00Z", tier_access_floor: "PROBATION" }
              as: DispatchAdmin
              captures: { b5: $.data.id, b5_v: $.data.version }
            - call: "POST /batches/${b5}/orders"
              payload: { order_id: "${o5}", expected_batch_version: "${b5_v}" }
              as: DispatchAdmin
            - call: "POST /batches/${b5}/dispatch"
              payload: {}
              as: DispatchAdmin
            - call: "POST /batches/${b5}/claim"
              payload: {}
              as: Shopper
              as_user_id: "${s3}"
            - call: "POST /batches/${b5}/start-shopping"
              payload: {}
              as: Shopper
              as_user_id: "${s3}"
            - call: "POST /order-lines/${n1}/pick"
              payload: { picked_qty: 20 }
              as: Shopper
              as_user_id: "${s3}"
            - call: "POST /batches/${b5}/checkout"
              payload: {}
              as: Shopper
              as_user_id: "${s3}"
          trigger:
            - call: "POST /batches/${b5}/deliver"
              payload: {}
              as: Shopper
              as_user_id: "${s3}"
          assert:
            - "Batch.${b5}.total_units == 20 and Batch.${b5}.total_weight_lb == 10.0 and Batch.${b5}.total_distance_mi == 8.0"
            - "ShopperPayout for Batch.${b5}: base_pay_cents == 1200, heavy_pay_cents == 0, mileage_bonus_cents == 0, multi_store_bonus_cents == 0"
            - "ShopperPayout for Batch.${b5}: tip_pass_through_cents == 300 and tip_protection_cents == 0"
            - "ShopperPayout for Batch.${b5}: guarantee_top_up_cents == 100 (floor 1600 minus tip-inclusive subtotal 1500)"
            - "ShopperPayout for Batch.${b5}: total_payout_cents == 1600, NOT 1900"
            - "ShopperPayout for Batch.${b5}: status == PROVISIONAL"

  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Order.fulfillment_status.PLACED_to_IN_BATCH
          - state_machines.Order.fulfillment_status.IN_BATCH_to_SHOPPING
          - state_machines.Order.payment_status.AUTHORIZED_to_REAUTH_HELD
          - state_machines.Order.payment_status.REAUTH_HELD_to_AUTHORIZED
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Order carries two independent state dimensions on one row: the payment axis moves
          AUTHORIZED -> REAUTH_HELD -> AUTHORIZED because of an approved substitution and a
          re-authorization while the fulfillment axis stays pinned at SHOPPING throughout, so
          neither dimension is derivable from the other.
        test_recipe:
          setup:
            - "Retailer R1 (markup 0.15); item I1 EACH in_store 400 EBT-eligible (catalog 460); item I3 EACH in_store 1200 non-EBT (catalog 1380)."
            - "Customer C1; Shopper S1 with vehicle_capacity_units 10 in SF-01."
            - "Order O3: ebt_requested false, tip 0, one line of I1 x1 -> estimated_subtotal 460 and authorization_ceiling 928."
            - "Batch B3 holding O3, claimed by S1 and in SHOPPING; a PENDING ReplacementRequest proposes I3 for the line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
