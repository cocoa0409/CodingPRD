          difficulty_instance: boundary_precision_check / loan_coverage_equal_passes_strict_less_rejects
          rationale: "ERR_INSUFFICIENT_COVERAGE strict-less rejection is asserted by the named §1.8 boundary instance."

      - name: schedule_conflict_error_excluded
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SCHEDULE_CONFLICT]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / loan_window_half_open_overlap_same_artwork
          rationale: "ERR_SCHEDULE_CONFLICT is triggered by the named §1.8 overlap instance."

      - name: lease_artwork_not_out_error
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LEASE_ARTWORK_NOT_OUT]"
          - "state_machines.LeaseAgreement.ACTIVE_to_CONVERTED"
        distinguishing_aspect: "Convert is only reachable while the lease is ACTIVE; ERR_LEASE_ARTWORK_NOT_OUT covers an ACTIVE lease whose artwork is not ON_LOAN (e.g. already RESERVED via a parallel sale before convert)."
        test_recipe:
          setup: ["Lease ACTIVE but its artwork has been moved to RESERVED by a separate sale (artwork not ON_LOAN)."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Lo", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Lo A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Lo W", list_price_cents: 500000, insured_value_cents: 500000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /leases"
              payload: { artwork_id: "${aw}", lessee_name: "Lo L", monthly_rate_cents: 50000, term_months: 12, starts_utc: "2026-04-01T00:00:00Z", purchase_credit_bps: 2000 }
              as: SalesAssociate
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/return"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Lo B", buyer_state_code: "NY", gross_amount_cents: 500000 }
              as: SalesAssociate
              captures: { s: $.data.id }
          trigger:
            - call: "POST /leases/${ls}/convert"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (lease no longer ACTIVE after return)"
            - "Artwork.${aw}.status == RESERVED"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: sales_associate_cannot_create_gallery
        claim_type: role_denied
        grounds:
          - "roles"
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "POST /galleries is GalleryAdmin-exclusive; as SalesAssociate -> ERR_FORBIDDEN 403."
        test_recipe:
          setup: ["No preconditions."]
          setup_api_calls: []
          trigger:
            - call: "POST /galleries"
              payload: { name: "Nope", home_state_code: "CA", sales_tax_rate_bps: 875 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"
            - "http status == 403"

      - name: artist_cannot_post_payout
        claim_type: role_denied
        grounds:
          - "roles"
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Payout creation is GalleryAdmin-exclusive; an Artist acting on their own gallery -> ERR_FORBIDDEN 403."
        test_recipe:
          setup: ["Gallery + one artist."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Ap", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Ap A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
          trigger:
            - call: "POST /payouts"
              payload: { artist_id: "${a}", requested_cents: 1000 }
              as: Artist
              as_user_id: "${a}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"
            - "http status == 403"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: missing_auth
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request whose X-User-Role is an unknown role value -> ERR_UNAUTHENTICATED 401."
        test_recipe:
          setup: ["Gallery exists."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Au", home_state_code: "CA", sales_tax_rate_bps: 875 }
              as: GalleryAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "GET /galleries/${g}"
              payload: {}
              as: Ghost
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "http status == 401"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_wallslot_stale_exhibition_version_excluded
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[wallslot-place-stale-exhibition]"
        distinguishing_aspect: "Stale expected_exhibition_version on wall-slot placement -> ERR_STALE_VERSION 412 (covered as the standalone OCC corner below for breadth)."
        test_recipe:
          setup: ["Exhibition capacity 2 with one slot already placed (version advanced to 2); client still holds version 1."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Oc", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Oc A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Oc1", list_price_cents: 100000, insured_value_cents: 100000 }
              as: GalleryAdmin
              captures: { aw1: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Oc2", list_price_cents: 100000, insured_value_cents: 100000 }
              as: GalleryAdmin
              captures: { aw2: $.data.id }
            - call: "POST /exhibitions"
              payload: { gallery_id: "${g}", title: "Oc Show", wall_capacity: 2, opens_utc: "2026-04-10T00:00:00Z", closes_utc: "2026-05-10T00:00:00Z" }
              as: GalleryAdmin
              captures: { ex: $.data.id, exv1: $.data.version }
            - call: "POST /exhibitions/${ex}/wall-slots"
              payload: { artwork_id: "${aw1}", wall_label: "OC-1", position_index: 0, expected_exhibition_version: "${exv1}" }
              as: Registrar
          trigger:
            - call: "POST /exhibitions/${ex}/wall-slots"
              payload: { artwork_id: "${aw2}", wall_label: "OC-2", position_index: 1, expected_exhibition_version: "${exv1}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_STALE_VERSION"
            - "http status == 412"

      - name: occ_payment_stale_sale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[payment-post-stale-sale]"
        distinguishing_aspect: "Posting a payment with a stale expected_sale_version (one behind current) -> ERR_STALE_VERSION 412; the prior payment already bumped Sale.version."
        test_recipe:
          setup: ["Invoiced sale buyer_total 400000 (buyer NY); one payment of 100000 posted so Sale.version advanced; client replays the pre-payment version."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Ops", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Ops A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Ops W", list_price_cents: 400000, insured_value_cents: 400000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Ops B", buyer_state_code: "NY", gross_amount_cents: 400000 }
              as: SalesAssociate
              captures: { s: $.data.id }
            - call: "POST /sales/${s}/invoice"
              payload: {}
              as: SalesAssociate
              captures: { sv1: $.data.version }
            - call: "POST /sales/${s}/payments"
              payload: { amount_cents: 100000, expected_sale_version: "${sv1}" }
              as: SalesAssociate
          trigger:
            - call: "POST /sales/${s}/payments"
              payload: { amount_cents: 100000, expected_sale_version: "${sv1}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_STALE_VERSION"
            - "http status == 412"

      - name: occ_version_increments_on_each_payment
        claim_type: optimistic_concurrency
        grounds:
          - "entities.Sale.fields.amount_collected_cents"
          - "concurrency_rules[payment-post-stale-sale]"
        distinguishing_aspect: "Each successful payment increments Sale.version by exactly 1; a correct expected_sale_version following the prior response succeeds."
        test_recipe:
          setup: ["Invoiced sale buyer_total 400000 (buyer NY)."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Vi", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Vi A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Vi W", list_price_cents: 400000, insured_value_cents: 400000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Vi B", buyer_state_code: "NY", gross_amount_cents: 400000 }
              as: SalesAssociate
              captures: { s: $.data.id }
            - call: "POST /sales/${s}/invoice"
              payload: {}
              as: SalesAssociate
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /sales/${s}/payments"
              payload: { amount_cents: 100000, expected_sale_version: "${sv1}" }
              as: SalesAssociate
              captures: { sv2: $.data.version }
            - call: "POST /sales/${s}/payments"
              payload: { amount_cents: 100000, expected_sale_version: "${sv2}" }
              as: SalesAssociate
              captures: { sv3: $.data.version }
          assert:
            - "Sale.${s}.amount_collected_cents == 200000 after two payments"
            - "Sale.${s}.settlement_status == PARTIALLY_PAID"

      - name: scheduled_clock_default_before_set
        claim_type: scheduled_actions
        grounds: [endpoints, entities.Gallery.fields.clock_utc]
        distinguishing_aspect: "Before any /_clock/set_current_utc call, a freshly created gallery's clock_utc reads the fixed default 2026-04-01T00:00:00Z, not wall-clock."
        test_recipe:
          setup: ["Empty DB; no clock set."]
          setup_api_calls: []
          trigger:
            - call: "POST /galleries"
              payload: { name: "Ck", home_state_code: "CA", sales_tax_rate_bps: 875 }
              as: GalleryAdmin
              captures: { g: $.data.id, ck: $.data.clock_utc }
          assert:
            - "Gallery.${g}.clock_utc == 2026-04-01T00:00:00Z"

      - name: cascade_void_cancels_payment_plan
        claim_type: cascading_side_effects
        grounds: [state_machines.Sale.PARTIALLY_PAID_to_VOID, state_machines.PaymentPlan.ACTIVE_to_CANCELLED]
        distinguishing_aspect: "Voiding a partially-paid sale that has an ACTIVE plan cascades the plan to CANCELLED and reverts the artwork to CONSIGNED."
        test_recipe:
          setup: ["Invoiced sale buyer_total 400000 with an ACTIVE plan and one 100000 payment; artwork RESERVED."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Cv", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Cv A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Cv W", list_price_cents: 400000, insured_value_cents: 400000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Cv B", buyer_state_code: "NY", gross_amount_cents: 400000 }
              as: SalesAssociate
              captures: { s: $.data.id }
            - call: "POST /sales/${s}/invoice"
              payload: {}
              as: SalesAssociate
              captures: { sv: $.data.version }
            - call: "POST /payment-plans"
              payload: { sale_id: "${s}", installment_count: 4, cadence_days: 30, first_due_utc: "2026-05-01T00:00:00Z" }
              as: SalesAssociate
              captures: { pl: $.data.id }
            - call: "POST /sales/${s}/payments"
              payload: { amount_cents: 100000, expected_sale_version: "${sv}" }
              as: SalesAssociate
          trigger:
            - call: "POST /sales/${s}/void"
              payload: {}
              as: SalesAssociate
            - call: "GET /payment-plans/${pl}"
              payload: {}
              as: SalesAssociate
              captures: { pst: $.data.status }
          assert:
            - "PaymentPlan.${pl}.status == CANCELLED"
            - "Artwork.${aw}.status == CONSIGNED"
            - "Sale.${s}.settlement_status == VOID"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: settle_cascade_visible_in_same_request
