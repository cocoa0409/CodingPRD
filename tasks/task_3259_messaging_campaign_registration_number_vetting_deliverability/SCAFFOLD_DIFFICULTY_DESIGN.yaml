  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: campaign_submit_gated_on_brand_verified
        grounds:
          - state_machines.Campaign.DRAFT_to_PENDING_REVIEW
          - entities.Brand.fields.status
          - errors[ERR_BRAND_NOT_VERIFIED]
        distinguishing_aspect: |
          Pair Campaign -> Brand: campaign submit is only valid when the linked
          Brand.status == VERIFIED; an UNVERIFIED brand blocks the transition
          with ERR_BRAND_NOT_VERIFIED, and verifying the brand then unblocks the
          identical request.
        test_recipe:
          setup:
            - "Brand submitted but failed once (UNVERIFIED); DRAFT TEN_DLC campaign referencing it"
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "Acme", plan_tier: "PREMIUM", country_code: "US" }
              as: PlatformAdmin
