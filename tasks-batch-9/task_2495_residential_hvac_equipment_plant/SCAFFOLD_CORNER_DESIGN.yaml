        claim_type: violation_to_error
        grounds:
          - validations.duplicate-active-certification
          - errors.ERR_DUPLICATE_CERTIFICATION
          - state_machines.CertificationRecord.DRAFT_to_SUPERSEDED
        distinguishing_aspect: "Supersession is limited to DRAFT, SUBMITTED, and REJECTED records: a second filing for a region that already holds a CERTIFIED record is refused with 409 ERR_DUPLICATE_CERTIFICATION instead of quietly superseding a live certification."
