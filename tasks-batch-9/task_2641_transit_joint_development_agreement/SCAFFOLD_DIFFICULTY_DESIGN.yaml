          - entities.StagingWindow.fields.capacity_released
        distinguishing_aspect: |
          The conserved quantity is an INTEGER COUNT of physical bays, not money, and the compensation is
          guarded by the capacity_released flag rather than by a determination enum: closing the 4-bay window
          returns available_bay_capacity from 2 to 6, and a second close attempt is refused with 409 so the
          bays are never credited twice — available + sum(bays of APPROVED windows) == total_bay_capacity 6
          before and after.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "BOARD_APPROVED agreement whose negotiation period runs 2026-08-15..2027-01-15"
            - "SharedFacility with total_bay_capacity 6, initially available_bay_capacity 6"
            - "APPROVED StagingWindow occupying 4 bays over [2026-09-01T08:00:00Z, 2026-09-20T08:00:00Z), leaving available_bay_capacity 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-E-002", name: "Fir Street Bay Yard", address_line: "18 Fir St", parcel_area_sqft: 97000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id }
            - call: "POST /jda/assessments/${asmt_a}/certify"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/sites/${site_a}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/developers"
              payload: { legal_name: "Alder Transit Partners LLC", contact_email: "dev-a@example.com", prequalified: true, debarment_status: "CLEAR" }
              as: RealEstateOfficer
              captures: { dev_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/solicitations"
              payload: { solicitation_type: "RFP", response_deadline: "2026-09-15T00:00:00Z", benchmark_value_cents: 48500000, affordable_housing_min_pct: 15, min_proposals_required: 1, joint_use_required: false }
              as: RealEstateOfficer
              captures: { sol_a: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/issue"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/solicitations/${sol_a}/proposals"
              payload: { developer_id: "${dev_a}", proposed_structure: "GROUND_LEASE", proposed_annual_rent_cents: 2400000, affordable_units: 50, total_units: 200, transit_ridership_uplift: 600, design_compliance_score: 88, joint_use_committed: false }
              as: Developer
              as_user_id: "${dev_a}"
              captures: { prop_a: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/close"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/solicitations/${sol_a}/award"
              payload: { proposal_id: "${prop_a}", negotiation_start_date: "2026-08-15", negotiation_end_date: "2027-01-15" }
              as: RealEstateOfficer
            - call: "GET /jda/sites/${site_a}"
              payload: { }
              as: ValuationOfficer
              captures: { site_v1: $.data.version }
            - call: "POST /jda/sites/${site_a}/valuations"
              payload: { method: "INCOME_APPROACH", appraised_value_cents: 48500000, transit_supportive_use_pct: 60, affordable_units_pct: 25, transfer_basis: "TRANSIT_SUPPORTIVE_BELOW_MARKET", effective_date: "2026-08-20", expected_site_version: "${site_v1}" }
              as: ValuationOfficer
              captures: { val_a: $.data.id }
            - call: "POST /jda/valuations/${val_a}/certify"
              payload: { }
              as: ValuationOfficer
            - call: "POST /jda/agreements"
              payload: { site_id: "${site_a}", developer_id: "${dev_a}", proposal_id: "${prop_a}", valuation_id: "${val_a}", structure: "GROUND_LEASE", term_years: 20, base_rent_cents: 2000000, revenue_share_pct: 0.05, projected_gross_revenue_cents: 12000000, affordable_units_committed: 50, total_units: 200, site_area_share_pct: 60, joint_use_committed: false }
              as: RealEstateOfficer
              captures: { jda_a: $.data.id }
            - call: "POST /jda/agreements/${jda_a}/submit-for-review"
              payload: { }
              as: RealEstateOfficer
              as_user_id: "reo-001"
            - call: "POST /jda/agreements/${jda_a}/board-approve"
              payload: { resolution_number: "R-2026-122" }
              as: BoardSecretary
              as_user_id: "bsec-001"
            - call: "POST /jda/sites/${site_a}/shared-facilities"
              payload: { facility_type: "BUS_BAY", total_bay_capacity: 6, maintenance_responsibility: "SHARED", cost_share_pct_developer: 0.35 }
              as: TransitOperationsManager
              captures: { sf_a: $.data.id, total_bays: $.data.total_bay_capacity, avail_initial: $.data.available_bay_capacity, sf_v1: $.data.version }
            - call: "POST /jda/staging-windows"
              payload: { jda_id: "${jda_a}", shared_facility_id: "${sf_a}", start_at: "2026-09-01T08:00:00Z", end_at: "2026-09-20T08:00:00Z", bays_occupied: 4, purpose: "Foundation staging", expected_facility_version: "${sf_v1}" }
              as: Developer
              as_user_id: "${dev_a}"
              captures: { sw_a: $.data.id, released_at_create: $.data.capacity_released }
            - call: "POST /jda/staging-windows/${sw_a}/decision"
              payload: { decision: "APPROVE" }
              as: TransitOperationsManager
              captures: { sw_status_approved: $.data.status }
            - call: "GET /jda/shared-facilities/${sf_a}"
              payload: { }
              as: TransitOperationsManager
              captures: { avail_before_close: $.data.available_bay_capacity }
          trigger:
            - call: "POST /jda/staging-windows/${sw_a}/close"
              payload: { }
              as: TransitOperationsManager
              captures: { sw_status_closed: $.data.status, released_after_close: $.data.capacity_released }
            - call: "GET /jda/shared-facilities/${sf_a}"
              payload: { }
              as: TransitOperationsManager
              captures: { avail_after_close: $.data.available_bay_capacity }
            - call: "POST /jda/staging-windows/${sw_a}/close"
              payload: { }
              as: TransitOperationsManager
              captures: { err_reclose: $.data.error_id }
            - call: "GET /jda/shared-facilities/${sf_a}"
              payload: { }
              as: TransitOperationsManager
              captures: { avail_after_reclose: $.data.available_bay_capacity }
          assert:
            - "${total_bays} == 6"
            - "${avail_initial} == 6"
            - "${released_at_create} == false"
            - "${sw_status_approved} == APPROVED"
            - "${avail_before_close} == 2"
            - "First close returns HTTP 200"
            - "${sw_status_closed} == CLOSED"
            - "${released_after_close} == true"
            - "${avail_after_close} == 6"
            - "Second close returns HTTP 409"
            - "${err_reclose} == ERR_STAGING_WINDOW_NOT_CLOSABLE"
            - "${avail_after_reclose} == 6"
            - "StagingWindow.${sw_a}.status == CLOSED"
            - "Invariant available_bay_capacity + sum(bays_occupied over APPROVED windows) == 6 holds before close (2 + 4) and after close (6 + 0) and after the refused re-close (6 + 0)"
