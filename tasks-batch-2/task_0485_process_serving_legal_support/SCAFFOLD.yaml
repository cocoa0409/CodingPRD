    roles: [Admin, Dispatcher, Client]
    code: 200
    input: []
    output: InvoiceLine[]
    side_effects: []

  # ---- Assignment ----
  - method: GET
    path: "/assignments/{id}"
    description: "Get an Assignment"
    roles: [Admin, Dispatcher, Server]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/assignments/{id}/accept"
    description: "Server accepts an OFFERED assignment (auto-advances ACCEPTED->ACTIVE)"
