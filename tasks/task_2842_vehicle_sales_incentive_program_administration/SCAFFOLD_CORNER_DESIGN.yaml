              captures: { b_id: $.data.id, b_status: $.data.status }
            - call: "POST /incentives/programs/${b_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "NORTH", build_date_from: "2026-06-01T00:00:00.000Z", build_date_to: "2026-08-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { b_rule_id: $.data.id }
            - call: "POST /incentives/programs/${b_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err_overlap: $.data.error_id }
            - call: "GET /incentives/programs/${b_id}"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { b_status_after_fail: $.data.status, b_version_after_fail: $.data.version }
            - call: "POST /incentives/programs/${a_id}/close"
              payload: { closure_note: "making room for the challenger" }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { a_closed: $.data.status }
            - call: "POST /incentives/programs/${b_id}/submit"
              payload: {}
