            - "the follow-up list returns an empty data array: no QualificationRequest was created"
            - "Subscriber.${sub_i_id}.qualification_status is still UNQUALIFIED and version is still ${sub_i_ver} — the OCC counter is not consumed by a rejected write"
            - "SourceDocument.${doc_i_id}.purge_status == PURGED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: statement_period_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=61]
          - entities.CirculationStatement.fields.period_start
          - entities.CirculationStatement.fields.period_end
          - state_machines.CirculationStatement.DRAFT_to_FILED
        distinguishing_aspect: |
          Contended resource: the PUBLICATION's statement calendar. Interval semantics: HALF-OPEN
          [period_start, period_end), so [2026-01-01, 2026-04-01) and [2026-04-01, 2026-07-01) touch
          at a shared endpoint and are both certifiable, while [2026-03-01, 2026-06-01) genuinely
          intersects both and is refused. The check fires at certification, not at creation.
        test_recipe:
          setup:
            - "publication with no recipients, so every statement reports 0 copies and certification turns only on the period test"
            - "clock at the default 2026-08-01T00:00:00Z, after all three candidate periods have closed"
            - "statement A for [2026-01-01, 2026-04-01) and statement B for [2026-04-01, 2026-07-01) both already certified FILED"
            - "statement C for [2026-03-01, 2026-06-01) created and still DRAFT"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Calendar Test Quarterly", frequency: "QUARTERLY", industry_code: "LOGISTICS" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver_1: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_1}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_a_id: $.data.id }
            - call: "POST /circulation/statements/${st_a_id}/certify"
              payload: { certification_note: "Q1" }
              as: PublisherExecutive
              as_user_id: "exec-01"
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver_2: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_2}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_b_id: $.data.id }
            - call: "POST /circulation/statements/${st_b_id}/certify"
              payload: { certification_note: "Q2, adjacent to Q1" }
              as: PublisherExecutive
              as_user_id: "exec-01"
              captures: { st_b_status: $.data.status }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver_3: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_3}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_c_id: $.data.id, st_c_status: $.data.status }
          trigger:
            - call: "POST /circulation/statements/${st_c_id}/certify"
              payload: { certification_note: "straddles both filed periods" }
              as: PublisherExecutive
              as_user_id: "exec-01"
              captures: { err: $.data.error_id }
          assert:
            - "${st_b_status} == FILED — exact adjacency at 2026-04-01T00:00:00Z is not an overlap"
            - "${st_c_status} == DRAFT — creation never applies the period test"
            - "the trigger returns HTTP 409 with ${err} == ERR_STATEMENT_PERIOD_OVERLAP"
            - "CirculationStatement.${st_c_id}.status is still DRAFT, filed_at is null and certified_by_user_id is null"
            - "CirculationStatement.${st_a_id}.status == FILED and CirculationStatement.${st_b_id}.status == FILED are untouched"

      - name: qualification_window_overlap_rejected_then_grace_renewal_truncates
        grounds:
          - validations[priority=60]
          - entities.Subscriber.fields.qualification_expires_at
          - entities.QualificationRequest.fields.effective_from
          - entities.QualificationRequest.fields.effective_to
          - entities.Publication.fields.renewal_grace_days
        distinguishing_aspect: |
          A different contended resource (a SUBSCRIBER's qualification timeline, not a publication's
          statement calendar) with different interval semantics: CLOSED windows [qualified_at,
          qualification_expires_at] where touching endpoints DO collide, and the collision is excused
          only inside the renewal grace window, which then truncates the predecessor's effective_to
          instead of rejecting the write.
        test_recipe:
          setup:
            - "publication with qualification_validity_months 36 and renewal_grace_days 90, all three qualification rules defined"
            - "recipient SI verified at the default clock, so its running window is [2026-08-01, 2029-08-01]"
            - "clock moved to 2026-09-01 and a renewal request created (signed 2026-08-15) and reviewed, so the recipient is PENDING_QUALIFICATION"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Renewal Cycle Review", frequency: "MONTHLY", industry_code: "MANUFACTURING", qualification_validity_months: 36, renewal_grace_days: 90 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "JOB_FUNCTION", allowed_values: ["ENGINEERING_MGMT"], points: 45, is_mandatory: true }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "INDUSTRY", allowed_values: ["MANUFACTURING"], points: 30, is_mandatory: false }
