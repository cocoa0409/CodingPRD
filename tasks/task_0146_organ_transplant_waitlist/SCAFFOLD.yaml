# =============================================================================
# Organ Transplant Waitlist — benchmark seed tables (SCAFFOLD.yaml)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Organ Transplant Waitlist: candidate registration/listing status, MELD/PELC
  scoring, donor match (HLA/blood type/size), allocation policy run, offer
  accept/decline, active/inactive status, post-transplant follow-up, UNOS
  reporting

domain_name: organ-transplant-waitlist
api_prefix: ""

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - "Dual-variant calculation"     # MELD (adult) vs PELD (pediatric) clinical scoring
    - "Cascading side effects"        # offer accept -> transplant -> candidate withdraw -> match invalidate
    - "Selector policy"               # allocation run ranks candidates from a candidate pool
    - "Optimistic concurrency"        # OCC on DonorOrgan.version for offer issuance vs re-run

  entity_topology: flat
  # Peer entities linked by foreign keys. Candidate, DonorOrgan, MatchRun,
  # Offer, Transplant are top-level resources connected by FK references; no
  # deep URL nesting. Sub-resources (registrations, clinical-scores, follow-ups)
  # hang off their owning entity for reverse-reachability.

  state_machine_shape: parallel
  # Candidate carries two independent state dimensions: listing_status
  # (the UNOS listing lifecycle) x medical_status (ACTIVE / INACTIVE clinical
  # readiness). Offer is cyclic/branching (OFFERED -> DECLINED -> next candidate
  # re-offer; OFFERED -> ACCEPTED -> terminal). DonorOrgan and MatchRun add
  # further machines.

  relationship_patterns:
    - one_to_many        # Candidate 1..* ClinicalScore, 1..* WaitlistRegistration, 1..* FollowUp
    - cross_aggregate    # Offer references both Candidate and DonorOrgan; Transplant references Offer

  role_model: peer_roles
  # TransplantCenter owns its Candidates/Offers/Transplants; OrganProcurementOrg
  # owns DonorOrgans and runs allocation; UNOSAdmin is the regulator/operator.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TransplantCenter
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Center name" }
      - { name: unos_center_code, type: string, source: input, description: "UNOS-assigned center code; unique", constraints: "unique across TransplantCenter" }
      - { name: region_code, type: integer, source: input, description: "OPTN region 1-11", constraints: "1 <= region_code <= 11" }
      - { name: latitude, type: number, source: input, description: "Center latitude in decimal degrees" }
      - { name: longitude, type: number, source: input, description: "Center longitude in decimal degrees" }

  - name: OrganProcurementOrg
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "OPO name" }
      - { name: opo_code, type: string, source: input, description: "OPO identifier; unique", constraints: "unique across OrganProcurementOrg" }
      - { name: region_code, type: integer, source: input, description: "OPTN region 1-11", constraints: "1 <= region_code <= 11" }
      - { name: latitude, type: number, source: input, description: "OPO recovery-site latitude in decimal degrees" }
      - { name: longitude, type: number, source: input, description: "OPO recovery-site longitude in decimal degrees" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> TransplantCenter.id; the listing center that owns this candidate" }
      - { name: mrn, type: string, source: input, description: "Center medical record number; unique per center", constraints: "unique per (center_id, mrn)" }
      - { name: organ_type, type: enum, source: input, description: "Organ sought", constraints: "one of {LIVER, KIDNEY, HEART, LUNG}" }
      - { name: blood_type, type: enum, source: input, description: "ABO blood group", constraints: "one of {O, A, B, AB}" }
      - { name: date_of_birth, type: datetime, source: input, description: "DOB; drives MELD-vs-PELD selection at scoring time" }
      - { name: height_cm, type: number, source: input, description: "Height in centimetres; size-matching input", constraints: "> 0" }
      - { name: weight_kg, type: number, source: input, description: "Weight in kilograms; size-matching input", constraints: "> 0" }
      - { name: hla_a, type: array, source: input, description: "Two HLA-A antigen alleles", constraints: "array length exactly 2 of strings" }
      - { name: hla_b, type: array, source: input, description: "Two HLA-B antigen alleles", constraints: "array length exactly 2 of strings" }
      - { name: hla_dr, type: array, source: input, description: "Two HLA-DR antigen alleles", constraints: "array length exactly 2 of strings" }
      - { name: unacceptable_antigens, type: array, source: input, default: [], description: "Antigens (strings) to which the candidate is sensitized; a donor carrying any of these is a positive virtual crossmatch and is incompatible" }
      - { name: listing_status, type: enum, source: system, description: "UNOS listing lifecycle dimension", constraints: "one of {DRAFT, LISTED, TRANSPLANTED, REMOVED}" }
      - { name: medical_status, type: enum, source: system, default: ACTIVE, description: "Clinical-readiness dimension, independent of listing_status", constraints: "one of {ACTIVE, INACTIVE}" }
      - { name: current_meld_peld, type: integer, source: computed, default: 0, description: "Latest finalized allocation score (MELD-Na for adults, PELD for pediatrics) from the most recent FINALIZED ClinicalScore by effective_at; 0 until first score finalized" }
      - { name: is_pediatric, type: boolean, source: computed, description: "True when age in years at listing time (= floor((listed_at - date_of_birth)/365.25 days)) < 12; selects PELD over MELD" }
      - { name: listed_at, type: datetime, source: system, description: "UTC timestamp when listing_status first became LISTED; null while DRAFT; anchors waiting-time accrual" }
      - { name: waiting_time_days, type: integer, source: computed, default: 0, description: "Whole days the candidate has been continuously LISTED and medical_status ACTIVE, summed across active intervals up to the current clock; INACTIVE intervals do not accrue" }
      - { name: removal_reason, type: enum, source: system, default: null, description: "Set when listing_status -> REMOVED", constraints: "one of {TRANSPLANTED, DECEASED, IMPROVED, TRANSFERRED, OTHER}" }

  - name: ClinicalScore
    parent: Candidate
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; the candidate this lab panel scores" }
      - { name: bilirubin_mg_dl, type: number, source: input, description: "Serum total bilirubin (mg/dL); MELD/PELD input", constraints: "> 0" }
      - { name: inr, type: number, source: input, description: "International normalized ratio; MELD/PELD input", constraints: "> 0" }
      - { name: creatinine_mg_dl, type: number, source: input, description: "Serum creatinine (mg/dL); MELD input", constraints: "> 0" }
      - { name: sodium_mmol_l, type: number, source: input, description: "Serum sodium (mmol/L); MELD-Na input", constraints: "> 0" }
      - { name: albumin_g_dl, type: number, source: input, description: "Serum albumin (g/dL); PELD input", constraints: "> 0" }
      - { name: growth_failure, type: boolean, source: input, default: false, description: "Growth failure flag; PELD input" }
      - { name: on_dialysis_twice_in_week, type: boolean, source: input, default: false, description: "If true, creatinine is clamped to 4.0 for MELD per UNOS dialysis rule" }
      - { name: effective_at, type: datetime, source: input, description: "Lab draw timestamp; ties broken by created_at" }
      - { name: score_kind, type: enum, source: computed, description: "Which algorithm was applied", constraints: "one of {MELD_NA, PELD}" }
      - { name: raw_score, type: number, source: computed, description: "Unrounded MELD-Na or PELD value before clamp/round" }
      - { name: allocation_score, type: integer, source: computed, description: "Final integer score after clamp to [6,40] and rounding" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Score lifecycle", constraints: "one of {DRAFT, FINALIZED, SUPERSEDED}" }

  - name: WaitlistRegistration
    parent: Candidate
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; the candidate placed on the waitlist" }
      - { name: organ_type, type: enum, source: system, description: "Copied from candidate at listing; the organ pool this registration competes in", constraints: "one of {LIVER, KIDNEY, HEART, LUNG}" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Registration lifecycle", constraints: "one of {ACTIVE, SUSPENDED, WITHDRAWN}" }
      - { name: suspended_at, type: datetime, source: system, default: null, description: "UTC timestamp of last SUSPEND; null when ACTIVE" }
      - { name: withdrawn_reason, type: enum, source: system, default: null, description: "Set when status -> WITHDRAWN", constraints: "one of {TRANSPLANTED, DECEASED, IMPROVED, TRANSFERRED, OTHER}" }

  - name: DonorOrgan
    parent: null
    common_fields: true
    fields:
      - { name: opo_id, type: string, source: input, description: "FK -> OrganProcurementOrg.id; the OPO that recovered this organ" }
      - { name: organ_type, type: enum, source: input, description: "Recovered organ", constraints: "one of {LIVER, KIDNEY, HEART, LUNG}" }
      - { name: blood_type, type: enum, source: input, description: "Donor ABO group", constraints: "one of {O, A, B, AB}" }
      - { name: donor_height_cm, type: number, source: input, description: "Donor height (cm); size-matching input", constraints: "> 0" }
      - { name: donor_weight_kg, type: number, source: input, description: "Donor weight (kg); size-matching input", constraints: "> 0" }
      - { name: hla_a, type: array, source: input, description: "Two HLA-A antigen alleles" }
      - { name: hla_b, type: array, source: input, description: "Two HLA-B antigen alleles" }
      - { name: hla_dr, type: array, source: input, description: "Two HLA-DR antigen alleles" }
      - { name: recovered_at, type: datetime, source: input, description: "UTC timestamp the organ was recovered; cold-ischemia clock start" }
      - { name: max_cold_ischemia_hours, type: number, source: input, description: "Viability window in hours from recovered_at; offers may not extend past recovered_at + this window", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "Organ allocation lifecycle", constraints: "one of {AVAILABLE, MATCHING, ALLOCATED, TRANSPLANTED, DISCARDED}" }
      - { name: open_offer_count, type: integer, source: computed, default: 0, description: "Count of Offer rows for this organ in status OFFERED (conserved-quantity invariant target)" }

  - name: MatchRun
    parent: null
    common_fields: true
    fields:
      - { name: donor_organ_id, type: string, source: input, description: "FK -> DonorOrgan.id; the organ this allocation run ranks candidates for" }
      - { name: expected_donor_organ_version, type: integer, source: input, description: "OCC token: DonorOrgan.version the caller last observed; rejected if stale" }
      - { name: policy_code, type: enum, source: input, description: "Allocation policy applied", constraints: "one of {STANDARD, BROADER_SHARING}" }
      - { name: ranked_count, type: integer, source: computed, description: "Number of eligible candidates ranked into this run's match list" }
      - { name: status, type: enum, source: system, default: COMPLETED, description: "Run lifecycle", constraints: "one of {COMPLETED, INVALIDATED}" }

  - name: MatchListEntry
    parent: MatchRun
    common_fields: false   # carries only id, created_at (append-only ranking row)
    fields:
      - { name: match_run_id, type: string, source: system, description: "FK -> MatchRun.id; the run that produced this ranking row" }
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; the ranked candidate" }
      - { name: rank, type: integer, source: computed, description: "1-based position in the ranked list; 1 = highest priority" }
      - { name: priority_points, type: number, source: computed, description: "Composite allocation score for this candidate in this run (see allocation_priority_points calc)" }
      - { name: hla_mismatch_count, type: integer, source: computed, description: "Number of donor HLA-A/B/DR antigens not shared with the candidate (0-6)" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: donor_organ_id, type: string, source: input, description: "FK -> DonorOrgan.id; the organ being offered" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; the candidate receiving the offer" }
      - { name: match_run_id, type: string, source: input, description: "FK -> MatchRun.id; the allocation run that produced this offer" }
      - { name: expected_donor_organ_version, type: integer, source: input, description: "OCC token: DonorOrgan.version the caller last observed; rejected if stale" }
      - { name: rank_at_offer, type: integer, source: system, description: "Copied from the candidate's MatchListEntry.rank when the offer was issued" }
      - { name: offered_at, type: datetime, source: system, description: "UTC timestamp the offer was issued; response-window clock start" }
      - { name: response_deadline_at, type: datetime, source: computed, description: "offered_at + OFFER_RESPONSE_WINDOW_HOURS, but never later than donor recovered_at + max_cold_ischemia_hours" }
      - { name: status, type: enum, source: system, default: OFFERED, description: "Offer negotiation lifecycle", constraints: "one of {OFFERED, ACCEPTED, DECLINED, EXPIRED, RESCINDED}" }
      - { name: decline_reason, type: enum, source: system, default: null, description: "Set when status -> DECLINED", constraints: "one of {SIZE_MISMATCH, MEDICAL_UNSUITABLE, CANDIDATE_UNAVAILABLE, CENTER_DECLINE, OTHER}" }

  - name: Transplant
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: input, description: "FK -> Offer.id; the accepted offer this transplant fulfills" }
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; recipient, copied from the offer" }
      - { name: donor_organ_id, type: string, source: system, description: "FK -> DonorOrgan.id; the transplanted organ, copied from the offer" }
      - { name: transplanted_at, type: datetime, source: input, description: "UTC timestamp of the transplant operation" }
      - { name: cold_ischemia_hours_actual, type: number, source: computed, description: "(transplanted_at - donor.recovered_at) in hours, rounded to 2 decimals" }
      - { name: graft_status, type: enum, source: system, default: FUNCTIONING, description: "Post-transplant graft lifecycle", constraints: "one of {FUNCTIONING, AT_RISK, FAILED}" }

  - name: FollowUp
    parent: Transplant
    common_fields: true
    fields:
      - { name: transplant_id, type: string, source: input, description: "FK -> Transplant.id; the transplant being followed up" }
      - { name: interval_label, type: enum, source: input, description: "Protocol follow-up milestone", constraints: "one of {M1, M6, M12, M24}" }
      - { name: scheduled_for, type: datetime, source: input, description: "UTC timestamp the follow-up is due" }
      - { name: graft_functioning, type: boolean, source: input, default: true, description: "Clinician finding at this visit; false escalates graft_status" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Follow-up lifecycle", constraints: "one of {SCHEDULED, COMPLETED, MISSED}" }

  - name: UnosReport
    parent: null
    common_fields: true
    fields:
      - { name: report_kind, type: enum, source: input, description: "Report subject", constraints: "one of {TRANSPLANT, REMOVAL, FOLLOWUP}" }
      - { name: transplant_id, type: string, source: input, default: null, description: "FK -> Transplant.id; required when report_kind in {TRANSPLANT, FOLLOWUP}" }
      - { name: candidate_id, type: string, source: input, default: null, description: "FK -> Candidate.id; required when report_kind == REMOVAL" }
      - { name: submitted_at, type: datetime, source: system, description: "UTC timestamp the report was accepted by UNOS" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Report lifecycle", constraints: "one of {SUBMITTED, ACCEPTED, REJECTED}" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Free text set when status -> REJECTED" }

  - name: SystemClock
    parent: null
    common_fields: false   # singleton holding the deterministic test clock
    fields:
      - { name: current_utc, type: datetime, source: system, description: "Deterministic system clock; all 'now' reads (waiting_time, deadlines, expiry) use this value" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Candidate dimension 1: listing_status (UNOS listing lifecycle) -------
  - entity: Candidate
    dimension: listing_status
    initial_state: DRAFT
    terminal_states: [TRANSPLANTED, REMOVED]
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "POST /candidates/{id}/list"
        actor: TransplantCenter
        preconditions:
          - "candidate has >= 1 ClinicalScore in status FINALIZED (so current_meld_peld > 0)"
          - "candidate.medical_status == ACTIVE"
        side_effects:
          - "set listed_at = SystemClock.current_utc"
          - "create a WaitlistRegistration { candidate_id, organ_type = candidate.organ_type, status = ACTIVE }"
          - "begin waiting_time_days accrual from listed_at"
      - from: LISTED
        to: TRANSPLANTED
        trigger: "system (cascade from Offer OFFERED -> ACCEPTED on this candidate)"
        actor: system
        preconditions:
          - "an Offer for this candidate transitioned to ACCEPTED"
        side_effects:
          - "set removal_reason = TRANSPLANTED"
          - "cascade: this candidate's ACTIVE WaitlistRegistration -> WITHDRAWN (withdrawn_reason = TRANSPLANTED) [hop 2]"
          - "stop waiting_time_days accrual"
      - from: LISTED
        to: REMOVED
        trigger: "POST /candidates/{id}/remove"
        actor: TransplantCenter
        preconditions:
          - "removal_reason in {DECEASED, IMPROVED, TRANSFERRED, OTHER} supplied in body"
          - "candidate.listing_status == LISTED"
        side_effects:
          - "set removal_reason from body"
          - "cascade: ACTIVE WaitlistRegistration -> WITHDRAWN (withdrawn_reason = removal_reason) [hop 2]"
          - "cascade: every OFFERED Offer for this candidate -> RESCINDED, and each rescind decrements its DonorOrgan.open_offer_count by 1 [hop 3]"
          - "stop waiting_time_days accrual"

  # ---- Candidate dimension 2: medical_status (clinical readiness) -----------
  - entity: Candidate
    dimension: medical_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /candidates/{id}/deactivate"
        actor: TransplantCenter
        preconditions:
          - "candidate.listing_status in {DRAFT, LISTED}"
        side_effects:
          - "if listing_status == LISTED: close the current waiting-time accrual interval at SystemClock.current_utc (INACTIVE intervals do not accrue)"
          - "cascade: this candidate's ACTIVE WaitlistRegistration -> SUSPENDED (suspended_at = SystemClock.current_utc)"
        note: "Independent of listing_status; a LISTED candidate stays LISTED while INACTIVE but is excluded from match runs."
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /candidates/{id}/reactivate"
        actor: TransplantCenter
        preconditions:
          - "candidate.listing_status in {DRAFT, LISTED}"
        side_effects:
          - "if listing_status == LISTED: open a new waiting-time accrual interval starting at SystemClock.current_utc"
          - "cascade: this candidate's SUSPENDED WaitlistRegistration -> ACTIVE (clear suspended_at)"
        note: "Cyclic with the ACTIVE -> INACTIVE edge; a candidate may toggle readiness any number of times."

  # ---- ClinicalScore: linear with supersede ---------------------------------
  - entity: ClinicalScore
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /clinical-scores/{id}/finalize"
        actor: TransplantCenter
        preconditions:
          - "score.status == DRAFT"
          - "parent Candidate.listing_status != REMOVED"
        side_effects:
          - "compute score_kind, raw_score, allocation_score (see meld_na_score / peld_score calcs)"
          - "if a prior FINALIZED ClinicalScore exists for this candidate, set that prior score.status = SUPERSEDED [hop 2]"
          - "recompute Candidate.current_meld_peld = allocation_score of the now-most-recent FINALIZED score by effective_at (tie: created_at)"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (a newer ClinicalScore for the same candidate is FINALIZED)"
        actor: system
        preconditions:
          - "a newer ClinicalScore for the same candidate reached FINALIZED"
        side_effects:
          - "no further effect; superseded scores are retained for audit"

  # ---- DonorOrgan: allocation lifecycle (branching) -------------------------
  - entity: DonorOrgan
    initial_state: AVAILABLE
    terminal_states: [TRANSPLANTED, DISCARDED]
    transitions:
      - from: AVAILABLE
        to: MATCHING
        trigger: "POST /match-runs"
        actor: OrganProcurementOrg
        preconditions:
          - "donor.status == AVAILABLE"
          - "expected_donor_organ_version matches donor.version (OCC)"
        side_effects:
          - "create MatchRun + ranked MatchListEntry rows for eligible candidates"
          - "increments DonorOrgan.version by 1"
      - from: MATCHING
        to: ALLOCATED
        trigger: "system (cascade from Offer OFFERED -> ACCEPTED for this organ)"
        actor: system
        preconditions:
          - "an Offer for this organ transitioned to ACCEPTED"
        side_effects:
          - "cascade: every other OFFERED Offer for this organ -> RESCINDED; each decrements open_offer_count by 1 [hop 2]"
          - "set open_offer_count = 0"
          - "increments DonorOrgan.version by 1"
      - from: ALLOCATED
        to: TRANSPLANTED
        trigger: "POST /transplants"
        actor: TransplantCenter
        preconditions:
          - "a Transplant was created referencing the accepted Offer for this organ"
        side_effects:
          - "increments DonorOrgan.version by 1"
      - from: MATCHING
        to: DISCARDED
        trigger: "POST /donor-organs/{id}/discard"
        actor: OrganProcurementOrg
        preconditions:
          - "donor.status == MATCHING"
          - "SystemClock.current_utc > recovered_at + max_cold_ischemia_hours OR no OFFERED/ACCEPTED offer exists"
        side_effects:
          - "cascade: every OFFERED Offer for this organ -> EXPIRED; each decrements open_offer_count by 1 [hop 2]"
          - "cascade: the organ's MatchRun -> INVALIDATED [hop 2]"
          - "increments DonorOrgan.version by 1"
      - from: AVAILABLE
        to: DISCARDED
        trigger: "POST /donor-organs/{id}/discard"
        actor: OrganProcurementOrg
        preconditions:
          - "donor.status == AVAILABLE"
        side_effects:
          - "increments DonorOrgan.version by 1"

  # ---- MatchRun: linear with invalidation -----------------------------------
  - entity: MatchRun
    initial_state: COMPLETED
    terminal_states: [INVALIDATED]
    transitions:
      - from: COMPLETED
        to: INVALIDATED
        trigger: "system (cascade from Offer ACCEPT on this run's organ, organ DISCARD, or candidate REMOVE of a ranked candidate)"
        actor: system
        preconditions:
          - "the run's DonorOrgan became ALLOCATED or DISCARDED, OR a ranked candidate was REMOVED"
        side_effects:
          - "run results are frozen; no new offers may cite this run"

  # ---- Offer: cyclic/branching negotiation ----------------------------------
  - entity: Offer
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, RESCINDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /offers/{id}/accept"
        actor: TransplantCenter
        preconditions:
          - "offer.status == OFFERED"
          - "SystemClock.current_utc <= response_deadline_at"
          - "candidate.medical_status == ACTIVE"
          - "candidate.listing_status == LISTED"
          - "donor.status == MATCHING"
          - "expected_donor_organ_version matches donor.version (OCC)"
        side_effects:
          - "decrement DonorOrgan.open_offer_count by 1 for this offer"
          - "cascade: DonorOrgan MATCHING -> ALLOCATED (which RESCINDS sibling OFFERED offers) [hop 2]"
          - "cascade: Candidate LISTED -> TRANSPLANTED [hop 2], which WITHDRAWs the candidate's ACTIVE WaitlistRegistration [hop 3]"
          - "cascade: the offer's MatchRun -> INVALIDATED [hop 2]"
          - "increments DonorOrgan.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /offers/{id}/decline"
        actor: TransplantCenter
        preconditions:
          - "offer.status == OFFERED"
          - "decline_reason supplied in body"
        side_effects:
          - "set decline_reason from body"
          - "decrement DonorOrgan.open_offer_count by 1"
        note: "After decline, the OPO may issue the next-ranked offer via POST /donor-organs/{id}/offer-next (cyclic re-offer loop)."
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /offers/{id}/expire"
        actor: OrganProcurementOrg
        preconditions:
          - "offer.status == OFFERED"
          - "SystemClock.current_utc > response_deadline_at"
        side_effects:
          - "decrement DonorOrgan.open_offer_count by 1"
      - from: OFFERED
        to: RESCINDED
        trigger: "system (cascade: organ ALLOCATED elsewhere, candidate REMOVED, or organ DISCARDED)"
        actor: system
        preconditions:
          - "offer.status == OFFERED at the moment of the triggering cascade"
        side_effects:
          - "decrement DonorOrgan.open_offer_count by 1"

  # ---- Transplant: post-transplant graft lifecycle --------------------------
  - entity: Transplant
    initial_state: FUNCTIONING
    terminal_states: [FAILED]
    transitions:
      - from: FUNCTIONING
        to: AT_RISK
        trigger: "system (a FollowUp with graft_functioning=false is COMPLETED)"
        actor: system
        preconditions:
          - "a COMPLETED FollowUp for this transplant has graft_functioning == false"
        side_effects:
          - "graft_status = AT_RISK"
      - from: AT_RISK
        to: FUNCTIONING
        trigger: "system (a later FollowUp with graft_functioning=true is COMPLETED)"
        actor: system
        preconditions:
          - "a later COMPLETED FollowUp for this transplant has graft_functioning == true"
        side_effects:
          - "graft_status = FUNCTIONING"
        note: "Cyclic with FUNCTIONING -> AT_RISK across successive follow-up visits."
      - from: AT_RISK
        to: FAILED
        trigger: "POST /transplants/{id}/mark-graft-failed"
        actor: TransplantCenter
        preconditions:
          - "transplant.graft_status == AT_RISK"
        side_effects:
          - "graft_status = FAILED (terminal)"

  # ---- FollowUp: linear ------------------------------------------------------
  - entity: FollowUp
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /follow-ups/{id}/complete"
        actor: TransplantCenter
        preconditions:
          - "followup.status == SCHEDULED"
          - "parent Transplant.graft_status != FAILED"
        side_effects:
          - "if graft_functioning == false: cascade Transplant FUNCTIONING -> AT_RISK [hop 2]"
          - "if graft_functioning == true and Transplant.graft_status == AT_RISK: cascade AT_RISK -> FUNCTIONING [hop 2]"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /follow-ups/{id}/mark-missed"
        actor: TransplantCenter
        preconditions:
          - "followup.status == SCHEDULED"
          - "SystemClock.current_utc > scheduled_for"
        side_effects:
          - "no graft-status change"

  # ---- UnosReport: linear with reject ---------------------------------------
  - entity: UnosReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /unos-reports/{id}/accept"
        actor: UNOSAdmin
        preconditions:
          - "report.status == SUBMITTED"
          - "report_kind == TRANSPLANT implies the referenced Transplant exists; report_kind == REMOVAL implies referenced Candidate.listing_status == REMOVED"
        side_effects:
          - "stamp acceptance"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /unos-reports/{id}/reject"
        actor: UNOSAdmin
        preconditions:
          - "report.status == SUBMITTED"
          - "rejection_reason supplied in body"
        side_effects:
          - "set rejection_reason from body"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: offer-issue-stale-organ
    parent_entity: DonorOrgan
    write_endpoint: "POST /offers"
    occ_field: "expected_donor_organ_version"
    description: |
      Issuing an Offer against a DonorOrgan whose version has advanced since the
      client last observed it is rejected. The new plan legitimately supersedes
      the client's stale view — e.g. another writer just accepted an offer (which
      moved the organ to ALLOCATED and bumped version) or re-ran the match — so a
      second issuance carrying the old version is a stale-version write and must
      be rejected rather than create an offer on an organ that is no longer
      AVAILABLE/MATCHING for that view.
    error_id: ERR_STALE_ORGAN_VERSION
    http_status: 412

  - rule_id: match-run-stale-organ
    parent_entity: DonorOrgan
    write_endpoint: "POST /match-runs"
    occ_field: "expected_donor_organ_version"
    description: |
      Starting a new MatchRun against a DonorOrgan whose version has advanced
      since the client last observed it is rejected. A prior run (or discard)
      already advanced the organ's version; the current caller's view is stale,
      so the re-run carrying the old version is rejected with a stale-version
      error instead of producing a ranking against an out-of-date organ state.
    error_id: ERR_STALE_ORGAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- DUAL-VARIANT pair, instance A: clinical scoring (Candidate domain) ----
  - name: meld_na_score
    trigger: "POST /clinical-scores/{id}/finalize when candidate is_pediatric == false"
    algorithm: weighted_scoring
    formula: |
      # MELD-Na for adults (is_pediatric == false). All logs are natural log.
      # Step 1 clamp inputs (UNOS lower bounds):
      bili = max(bilirubin_mg_dl, 1.0)
      inr_c = max(inr, 1.0)
      if on_dialysis_twice_in_week: creat = 4.0
      else: creat = min(max(creatinine_mg_dl, 1.0), 4.0)
      # Step 2 base MELD(i):
      meld_i = 0.957*ln(creat) + 0.378*ln(bili) + 1.120*ln(inr_c) + 0.643
      meld_i = round(meld_i * 10)            # round to nearest integer (half_up)
      # Step 3 sodium adjustment only when meld_i > 11:
      if meld_i > 11:
        na = min(max(sodium_mmol_l, 125.0), 137.0)
        raw = meld_i + 1.32*(137 - na) - (0.033*meld_i*(137 - na))
      else:
        raw = meld_i
      # Step 4 clamp to allocation band:
      allocation_score = round_half_up(clamp(raw, 6, 40))   # integer 6..40
    input_set: "Single ClinicalScore row being finalized; uses its own lab fields."
    constants: { MELD_FLOOR: 6, MELD_CEIL: 40, NA_LOW: 125, NA_HIGH: 137, DIALYSIS_CREAT: 4.0 }
    precision: "raw kept full precision; allocation_score integer, round_half_up, clamp [6,40]"
    variants:
      - name: dialysis_clamp
        when: "on_dialysis_twice_in_week == true"
        difference: "creatinine forced to 4.0 regardless of measured value before the ln term"

  - name: peld_score
    trigger: "POST /clinical-scores/{id}/finalize when candidate is_pediatric == true"
    algorithm: weighted_scoring
    formula: |
      # PELD for pediatrics (is_pediatric == true). Different inputs & weights
      # than MELD-Na: uses albumin and growth_failure, NOT creatinine/sodium.
      bili = max(bilirubin_mg_dl, 1.0)
      inr_c = max(inr, 1.0)
      alb = albumin_g_dl                       # albumin is NOT floored
      gf = 0.667 if growth_failure else 0.0
      raw = 0.480*ln(bili) + 1.857*ln(inr_c) - 0.687*ln(alb) + gf + 0.436
      raw = round(raw * 10)                     # PELD reported x10, round half_up
      allocation_score = round_half_up(clamp(raw, 6, 40))   # integer 6..40
    input_set: "Single ClinicalScore row being finalized; uses bilirubin, inr, albumin, growth_failure."
    constants: { PELD_FLOOR: 6, PELD_CEIL: 40, GROWTH_FAILURE_POINTS: 0.667 }
    precision: "raw full precision; allocation_score integer, round_half_up, clamp [6,40]"
    variants:
      - name: growth_failure_bonus
        when: "growth_failure == true"
        difference: "adds 0.667 to the linear sum before x10 and rounding"

  # ---- DUAL-VARIANT pair, instance B: allocation priority (Offer/Match domain)
  - name: allocation_priority_points
    trigger: "POST /match-runs (computed per ranked MatchListEntry)"
    algorithm: weighted_scoring
    formula: |
      # Composite priority for ranking candidates against one donor organ.
      # Inputs per candidate: current_meld_peld (s), waiting_time_days (w),
      # hla_mismatch_count (m, 0..6), is_pediatric (p).
      # NESTED ROUNDING — per-component round then sum (PINNED ORDER):
      med_pts   = round_half_up(s * 2.5, 0)                 # round each component first
      wait_pts  = round_half_up(min(w, 365) / 365 * 10, 0)  # capped contribution, then round
      hla_pts   = round_half_up((6 - m) * 1.5, 0)
      ped_pts   = 8 if p else 0
      priority_points = med_pts + wait_pts + hla_pts + ped_pts   # sum AFTER rounding each
    input_set: "Eligible candidates for the run (see allocation_match_pool); one priority_points per candidate."
    constants: { MED_WEIGHT: 2.5, WAIT_CAP_DAYS: 365, WAIT_WEIGHT: 10, HLA_WEIGHT: 1.5, PEDIATRIC_BONUS: 8 }
    precision: "each component rounded half_up to integer BEFORE summing; sum is exact"
    variants:
      - name: standard_policy
        when: "MatchRun.policy_code == STANDARD"
        difference: "candidates restricted to the donor's region_code (region match required)"
      - name: broader_sharing_policy
        when: "MatchRun.policy_code == BROADER_SHARING"
        difference: "candidates from any region eligible, but out-of-region candidates' priority_points are multiplied by 0.9 AFTER the component sum, then re-rounded half_up"

  # ---- Combinatorial mode (a): non-linear, >=3 inputs, conditional branches --
  - name: size_match_ratio
    trigger: "POST /match-runs and POST /offers (eligibility gate)"
    algorithm: threshold
    formula: |
      # Size compatibility gate using donor/recipient weight ratio with an
      # organ-type-conditional acceptance band (>=3 inputs: donor_weight,
      # candidate_weight, organ_type; nested min/max via band selection).
      ratio = donor_weight_kg / weight_kg
      if organ_type == HEART or organ_type == LUNG:
        lo, hi = 0.80, 1.20      # thoracic organs: tight band
      else:                       # LIVER, KIDNEY
        lo, hi = 0.70, 1.50      # abdominal organs: wide band
      size_compatible = (ratio >= lo) and (ratio <= hi)   # INCLUSIVE both ends
    input_set: "One donor + one candidate; organ_type taken from the candidate (must equal donor.organ_type to be considered)."
    constants: { THORACIC_LO: 0.80, THORACIC_HI: 1.20, ABDOMINAL_LO: 0.70, ABDOMINAL_HI: 1.50 }
    precision: "ratio full precision; boundary inclusive (>= lo AND <= hi)"

  # ---- ABO compatibility (eligibility input to match pool) ------------------
  - name: abo_compatible
    trigger: "POST /match-runs and POST /offers (eligibility gate)"
    algorithm: threshold
    formula: |
      # Donor ABO -> recipient ABO compatibility (clinical ABO rules):
      # O -> {O, A, B, AB}; A -> {A, AB}; B -> {B, AB}; AB -> {AB}
      compatible = recipient_blood_type in COMPAT_MAP[donor_blood_type]
    input_set: "One donor + one candidate blood type."
    constants:
      COMPAT_MAP: "{ O: [O,A,B,AB], A: [A,AB], B: [B,AB], AB: [AB] }"
    precision: "exact set membership"

  # ---- allocation_match_pool: who is eligible & ranked ---------------------
  - name: allocation_match_pool
    trigger: "POST /match-runs (selector that builds the ranked candidate set)"
    algorithm: aggregation
    formula: |
      # Build the candidate set for a donor organ, then rank.
      eligible = all Candidate c where:
        c.listing_status == LISTED
        AND c.medical_status == ACTIVE
        AND c.organ_type == donor.organ_type
        AND abo_compatible(donor.blood_type, c.blood_type)
        AND size_match_ratio(donor, c).size_compatible == true
        AND no antigen in donor.{hla_a,hla_b,hla_dr} appears in c.unacceptable_antigens
        AND (policy_code == BROADER_SHARING OR c.center.region_code == donor.opo.region_code)
      rank eligible DESC by priority_points;
        tie-break 1: higher current_meld_peld first;
        tie-break 2: more waiting_time_days first;
        tie-break 3: earlier Candidate.created_at first
      ranked_count = len(eligible)
    input_set: "All Candidate rows at run time, filtered as above. INACTIVE / non-LISTED / wrong-organ / ABO-incompatible / size-incompatible / sensitized excluded."
    constants: {}
    precision: "deterministic ordering; final tie-break uses created_at ASC, never id"

  # ---- Combinatorial mode (c): circular-looking dependency, pinned order ----
  - name: offer_response_deadline
    trigger: "POST /offers (sets response_deadline_at) and offer expiry checks"
    algorithm: interval_merge
    formula: |
      # Two competing windows; the binding deadline is the EARLIER of the two,
      # so the value depends on the donor's cold-ischemia ceiling AND the per-
      # offer response window. Evaluation order is pinned: compute both then min.
      window_end   = offered_at + OFFER_RESPONSE_WINDOW_HOURS hours
      ischemia_end = donor.recovered_at + donor.max_cold_ischemia_hours hours
      response_deadline_at = min(window_end, ischemia_end)
      # An accept/expire at exactly response_deadline_at: accept allowed
      # (<=), expire requires strictly-after (>). See boundary checks.
    input_set: "One offer + its donor organ."
    constants: { OFFER_RESPONSE_WINDOW_HOURS: 1 }
    precision: "timestamps to the second; accept valid when now <= deadline, expire valid when now > deadline"

  # ---- waiting time accrual (conserved-quantity / aggregation) --------------
  - name: waiting_time_days
    trigger: "GET /candidates/{id} (read-time recompute) and at every accrual-interval boundary"
    algorithm: aggregation
    formula: |
      # Sum of whole days across closed [start,end) accrual intervals plus the
      # currently-open interval up to SystemClock.current_utc. An interval is
      # open while listing_status==LISTED AND medical_status==ACTIVE; it closes
      # on deactivate/remove/transplant and re-opens on reactivate.
      total_seconds = sum over accrual intervals of (end - start) in seconds,
                      where the open interval uses end = SystemClock.current_utc
      waiting_time_days = floor(total_seconds / 86400)
    input_set: "The candidate's accrual intervals derived from listing/medical transitions."
    constants: { SECONDS_PER_DAY: 86400 }
    precision: "floor to whole days; INACTIVE and non-LISTED spans contribute zero"

  # ---- cold ischemia actual (post-transplant, derived) ----------------------
  - name: cold_ischemia_hours_actual
    trigger: "POST /transplants"
    algorithm: aggregation
    formula: |
      cold_ischemia_hours_actual = round_half_up((transplanted_at - donor.recovered_at) / 3600, 2)
    input_set: "One transplant + its donor organ."
    constants: { SECONDS_PER_HOUR: 3600 }
    precision: "2 decimals, round_half_up"

  # ---- open_offer_count (conserved quantity) --------------------------------
  - name: open_offer_count
    trigger: "every Offer transition into/out of OFFERED"
    algorithm: aggregation
    formula: |
      open_offer_count = count of Offer rows where donor_organ_id == organ.id
                         AND status == OFFERED
    input_set: "All Offer rows for the organ."
    constants: {}
    precision: "exact integer; invariant: equals the number of OFFERED offers at all times"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and valid", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "Role permitted for this operation per §1.7", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 3, category: existence, check: "All path/body referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: all }
  - { priority: 4, category: business_referential, check: "Acting TransplantCenter owns the Candidate/Offer/Transplant it mutates (X-User-ID == resource center_id, directly or via FK)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "candidate mutations, offer accept/decline, transplant create, follow-up ops" }
  - { priority: 5, category: business_constraint, check: "Required body fields present and well-typed (enums in range, arrays correct length, numbers > 0)", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: "all create/finalize endpoints" }
  - { priority: 6, category: business_constraint, check: "Uniqueness: (center_id, mrn) for Candidate; unos_center_code; opo_code", error_id: ERR_DUPLICATE_RESOURCE, http_status: 409, applies_to: "POST /candidates, POST /transplant-centers, POST /organ-procurement-orgs" }
  - { priority: 7, category: state, check: "Target resource is in a state from which this transition is defined (§1.2 from:)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 8, category: state, check: "OCC: expected_donor_organ_version equals DonorOrgan.version for offer issuance and match-run", error_id: ERR_STALE_ORGAN_VERSION, http_status: 412, applies_to: "POST /offers, POST /match-runs" }
  - { priority: 9, category: business_safety, check: "Listing requires >= 1 FINALIZED ClinicalScore (current_meld_peld > 0)", error_id: ERR_NO_FINALIZED_SCORE, http_status: 409, applies_to: "POST /candidates/{id}/list" }
  - { priority: 10, category: business_safety, check: "Offer accept requires candidate.medical_status == ACTIVE and listing_status == LISTED", error_id: ERR_CANDIDATE_NOT_ACTIVE, http_status: 409, applies_to: "POST /offers/{id}/accept" }
  - { priority: 11, category: business_safety, check: "ABO incompatibility (donor->recipient) rejects an offer", error_id: ERR_ABO_INCOMPATIBLE, http_status: 409, applies_to: "POST /offers, POST /donor-organs/{id}/offer-next" }
  - { priority: 12, category: business_safety, check: "Positive virtual crossmatch: a donor antigen appears in candidate.unacceptable_antigens", error_id: ERR_POSITIVE_CROSSMATCH, http_status: 409, applies_to: "POST /offers, POST /donor-organs/{id}/offer-next" }
  - { priority: 13, category: business_constraint, check: "Size incompatibility: donor/recipient weight ratio outside the organ-type band", error_id: ERR_SIZE_INCOMPATIBLE, http_status: 409, applies_to: "POST /offers, POST /donor-organs/{id}/offer-next" }
  - { priority: 14, category: business_temporal, check: "Offer accept only while SystemClock.current_utc <= response_deadline_at", error_id: ERR_OFFER_WINDOW_CLOSED, http_status: 409, applies_to: "POST /offers/{id}/accept" }
  - { priority: 15, category: business_temporal, check: "Offer expire only while SystemClock.current_utc > response_deadline_at", error_id: ERR_OFFER_WINDOW_OPEN, http_status: 409, applies_to: "POST /offers/{id}/expire" }
  - { priority: 16, category: business_temporal, check: "Cannot create an offer whose computed response_deadline_at <= offered_at (cold-ischemia window already closed)", error_id: ERR_ISCHEMIA_WINDOW_CLOSED, http_status: 409, applies_to: "POST /offers, POST /donor-organs/{id}/offer-next" }
  - { priority: 17, category: business_constraint, check: "An organ may have at most one OFFERED offer to a given candidate at a time; candidate already has an OFFERED offer for this organ", error_id: ERR_DUPLICATE_OPEN_OFFER, http_status: 409, applies_to: "POST /offers, POST /donor-organs/{id}/offer-next" }
  - { priority: 18, category: business_referential, check: "offer-next requires the next-ranked eligible candidate from the run who has no terminal offer yet; empty pool returns this error", error_id: ERR_NO_NEXT_CANDIDATE, http_status: 409, applies_to: "POST /donor-organs/{id}/offer-next" }
  - { priority: 19, category: business_constraint, check: "Transplant create requires offer.status == ACCEPTED and no existing Transplant for that offer", error_id: ERR_OFFER_NOT_ACCEPTED, http_status: 409, applies_to: "POST /transplants" }
  - { priority: 20, category: business_temporal, check: "FollowUp scheduled_for must be >= parent Transplant.transplanted_at", error_id: ERR_FOLLOWUP_BEFORE_TRANSPLANT, http_status: 422, applies_to: "POST /transplants/{id}/follow-ups" }
  - { priority: 21, category: business_referential, check: "UnosReport TRANSPLANT/FOLLOWUP requires transplant_id; REMOVAL requires candidate_id whose listing_status == REMOVED", error_id: ERR_REPORT_SUBJECT_INVALID, http_status: 422, applies_to: "POST /unos-reports" }
  - { priority: 22, category: business_constraint, check: "match-run/offer organ_type must equal candidate.organ_type", error_id: ERR_ORGAN_TYPE_MISMATCH, http_status: 409, applies_to: "POST /offers, POST /donor-organs/{id}/offer-next" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Reference data --------------------------------------------------------
  - { method: POST, path: "/transplant-centers", description: "Register a transplant center", roles: [UNOSAdmin], code: 201, input: [name, unos_center_code, region_code, latitude, longitude], output: TransplantCenter, side_effects: [] }
  - { method: GET, path: "/transplant-centers/{id}", description: "Fetch a center", roles: [UNOSAdmin, TransplantCenter, OrganProcurementOrg], code: 200, input: [], output: TransplantCenter, side_effects: [] }
  - { method: POST, path: "/organ-procurement-orgs", description: "Register an OPO", roles: [UNOSAdmin], code: 201, input: [name, opo_code, region_code, latitude, longitude], output: OrganProcurementOrg, side_effects: [] }
  - { method: GET, path: "/organ-procurement-orgs/{id}", description: "Fetch an OPO", roles: [UNOSAdmin, TransplantCenter, OrganProcurementOrg], code: 200, input: [], output: OrganProcurementOrg, side_effects: [] }

  # ---- Candidate lifecycle ---------------------------------------------------
  - { method: POST, path: "/candidates", description: "Create a candidate in DRAFT/ACTIVE", roles: [TransplantCenter], code: 201, input: [center_id, mrn, organ_type, blood_type, date_of_birth, height_cm, weight_kg, hla_a, hla_b, hla_dr, "unacceptable_antigens?"], output: Candidate, side_effects: ["listing_status=DRAFT", "medical_status=ACTIVE"] }
  - { method: GET, path: "/candidates", description: "List candidates; filter by center_id/organ_type/listing_status", roles: [UNOSAdmin, TransplantCenter, OrganProcurementOrg], code: 200, input: ["center_id?", "organ_type?", "listing_status?", "limit?", "offset?"], output: "Candidate[]", side_effects: [] }
  - { method: GET, path: "/candidates/{id}", description: "Fetch a candidate (recomputes waiting_time_days at read)", roles: [UNOSAdmin, TransplantCenter, OrganProcurementOrg], code: 200, input: [], output: Candidate, side_effects: ["recompute waiting_time_days vs SystemClock"] }
  - { method: POST, path: "/candidates/{id}/list", description: "List candidate (DRAFT->LISTED)", roles: [TransplantCenter], code: 200, input: [], output: Candidate, side_effects: ["set listed_at", "create ACTIVE WaitlistRegistration", "begin waiting-time accrual"] }
  - { method: POST, path: "/candidates/{id}/deactivate", description: "Set medical_status ACTIVE->INACTIVE", roles: [TransplantCenter], code: 200, input: [], output: Candidate, side_effects: ["close accrual interval", "SUSPEND WaitlistRegistration"] }
  - { method: POST, path: "/candidates/{id}/reactivate", description: "Set medical_status INACTIVE->ACTIVE", roles: [TransplantCenter], code: 200, input: [], output: Candidate, side_effects: ["open accrual interval", "ACTIVATE WaitlistRegistration"] }
  - { method: POST, path: "/candidates/{id}/remove", description: "Remove candidate (LISTED->REMOVED)", roles: [TransplantCenter], code: 200, input: [removal_reason], output: Candidate, side_effects: ["WITHDRAW WaitlistRegistration", "RESCIND OFFERED offers", "stop accrual"] }

  # ---- Clinical scores (sub-resource of candidate; reverse-reachable) -------
  - { method: POST, path: "/candidates/{id}/clinical-scores", description: "Create a DRAFT clinical score for a candidate", roles: [TransplantCenter], code: 201, input: [bilirubin_mg_dl, inr, creatinine_mg_dl, sodium_mmol_l, albumin_g_dl, "growth_failure?", "on_dialysis_twice_in_week?", effective_at], output: ClinicalScore, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/candidates/{id}/clinical-scores", description: "List a candidate's clinical scores (reverse-reachability for ClinicalScore.candidate_id)", roles: [UNOSAdmin, TransplantCenter], code: 200, input: ["status?"], output: "ClinicalScore[]", side_effects: [] }
  - { method: GET, path: "/clinical-scores/{id}", description: "Fetch a clinical score", roles: [UNOSAdmin, TransplantCenter], code: 200, input: [], output: ClinicalScore, side_effects: [] }
  - { method: POST, path: "/clinical-scores/{id}/finalize", description: "Finalize a score (DRAFT->FINALIZED); computes MELD-Na or PELD", roles: [TransplantCenter], code: 200, input: [], output: ClinicalScore, side_effects: ["compute score_kind/raw_score/allocation_score", "SUPERSEDE prior FINALIZED", "recompute Candidate.current_meld_peld"] }

  # ---- Waitlist registrations (sub-resource; reverse-reachable) -------------
  - { method: GET, path: "/candidates/{id}/registrations", description: "List a candidate's waitlist registrations (reverse-reachability for WaitlistRegistration.candidate_id)", roles: [UNOSAdmin, TransplantCenter, OrganProcurementOrg], code: 200, input: ["status?"], output: "WaitlistRegistration[]", side_effects: [] }

  # ---- Donor organs ----------------------------------------------------------
  - { method: POST, path: "/donor-organs", description: "Register a recovered donor organ (AVAILABLE)", roles: [OrganProcurementOrg], code: 201, input: [opo_id, organ_type, blood_type, donor_height_cm, donor_weight_kg, hla_a, hla_b, hla_dr, recovered_at, max_cold_ischemia_hours], output: DonorOrgan, side_effects: ["status=AVAILABLE", "open_offer_count=0"] }
  - { method: GET, path: "/donor-organs", description: "List donor organs; filter by opo_id/organ_type/status", roles: [UNOSAdmin, OrganProcurementOrg, TransplantCenter], code: 200, input: ["opo_id?", "organ_type?", "status?", "limit?", "offset?"], output: "DonorOrgan[]", side_effects: [] }
  - { method: GET, path: "/donor-organs/{id}", description: "Fetch a donor organ", roles: [UNOSAdmin, OrganProcurementOrg, TransplantCenter], code: 200, input: [], output: DonorOrgan, side_effects: [] }
  - { method: POST, path: "/donor-organs/{id}/discard", description: "Discard an organ (AVAILABLE/MATCHING->DISCARDED)", roles: [OrganProcurementOrg], code: 200, input: [], output: DonorOrgan, side_effects: ["EXPIRE OFFERED offers", "INVALIDATE MatchRun"] }
  - { method: POST, path: "/donor-organs/{id}/offer-next", description: "Issue an offer to the next-ranked eligible candidate from the organ's latest COMPLETED run", roles: [OrganProcurementOrg], code: 201, input: [expected_donor_organ_version], output: Offer, side_effects: ["create OFFERED Offer", "increment open_offer_count", "increment DonorOrgan.version"] }

  # ---- Match runs ------------------------------------------------------------
  - { method: POST, path: "/match-runs", description: "Run allocation policy for a donor organ (AVAILABLE->MATCHING); ranks eligible candidates", roles: [OrganProcurementOrg], code: 201, input: [donor_organ_id, expected_donor_organ_version, policy_code], output: MatchRun, side_effects: ["create MatchListEntry rows", "increment DonorOrgan.version", "set ranked_count"] }
  - { method: GET, path: "/match-runs/{id}", description: "Fetch a match run", roles: [UNOSAdmin, OrganProcurementOrg, TransplantCenter], code: 200, input: [], output: MatchRun, side_effects: [] }
  - { method: GET, path: "/match-runs", description: "List match runs; filter by donor_organ_id (reverse-reachability for MatchRun.donor_organ_id)", roles: [UNOSAdmin, OrganProcurementOrg, TransplantCenter], code: 200, input: ["donor_organ_id?", "status?", "limit?", "offset?"], output: "MatchRun[]", side_effects: [] }
  - { method: GET, path: "/match-runs/{id}/entries", description: "List a run's ranked entries (reverse-reachability for MatchListEntry.match_run_id)", roles: [UNOSAdmin, OrganProcurementOrg, TransplantCenter], code: 200, input: [], output: "MatchListEntry[]", side_effects: [] }
  - { method: GET, path: "/match-list-entries/{id}", description: "Fetch a single match-list entry (anchors the match-list-entries collection segment)", roles: [UNOSAdmin, OrganProcurementOrg, TransplantCenter], code: 200, input: [], output: MatchListEntry, side_effects: [] }
  - { method: GET, path: "/match-list-entries", description: "List match-list entries; filter by candidate_id (reverse-reachability for MatchListEntry.candidate_id)", roles: [UNOSAdmin, OrganProcurementOrg, TransplantCenter], code: 200, input: ["candidate_id?", "match_run_id?", "limit?", "offset?"], output: "MatchListEntry[]", side_effects: [] }

  # ---- Offers ----------------------------------------------------------------
  - { method: POST, path: "/offers", description: "Issue an offer to a specific candidate from a run", roles: [OrganProcurementOrg], code: 201, input: [donor_organ_id, candidate_id, match_run_id, expected_donor_organ_version], output: Offer, side_effects: ["create OFFERED Offer", "set rank_at_offer/response_deadline_at", "increment open_offer_count", "increment DonorOrgan.version"] }
  - { method: GET, path: "/offers/{id}", description: "Fetch an offer", roles: [UNOSAdmin, OrganProcurementOrg, TransplantCenter], code: 200, input: [], output: Offer, side_effects: [] }
  - { method: GET, path: "/offers", description: "List offers; filter by donor_organ_id/candidate_id/match_run_id/status", roles: [UNOSAdmin, OrganProcurementOrg, TransplantCenter], code: 200, input: ["donor_organ_id?", "candidate_id?", "match_run_id?", "status?", "limit?", "offset?"], output: "Offer[]", side_effects: [] }
  - { method: POST, path: "/offers/{id}/accept", description: "Accept an offer (OFFERED->ACCEPTED); cascades organ ALLOCATED + candidate TRANSPLANTED", roles: [TransplantCenter], code: 200, input: [expected_donor_organ_version], output: Offer, side_effects: ["organ MATCHING->ALLOCATED", "candidate LISTED->TRANSPLANTED", "WaitlistRegistration WITHDRAWN", "RESCIND sibling offers", "INVALIDATE MatchRun", "increment DonorOrgan.version"] }
  - { method: POST, path: "/offers/{id}/decline", description: "Decline an offer (OFFERED->DECLINED)", roles: [TransplantCenter], code: 200, input: [decline_reason], output: Offer, side_effects: ["set decline_reason", "decrement open_offer_count"] }
  - { method: POST, path: "/offers/{id}/expire", description: "Expire an offer past its deadline (OFFERED->EXPIRED)", roles: [OrganProcurementOrg], code: 200, input: [], output: Offer, side_effects: ["decrement open_offer_count"] }

  # ---- Transplants & follow-up ----------------------------------------------
  - { method: POST, path: "/transplants", description: "Record a transplant from an accepted offer (organ ALLOCATED->TRANSPLANTED)", roles: [TransplantCenter], code: 201, input: [offer_id, transplanted_at], output: Transplant, side_effects: ["copy candidate_id/donor_organ_id", "compute cold_ischemia_hours_actual", "organ->TRANSPLANTED", "graft_status=FUNCTIONING"] }
  - { method: GET, path: "/transplants/{id}", description: "Fetch a transplant", roles: [UNOSAdmin, TransplantCenter], code: 200, input: [], output: Transplant, side_effects: [] }
  - { method: GET, path: "/transplants", description: "List transplants; filter by candidate_id/donor_organ_id/offer_id (reverse-reachability for Transplant.offer_id, candidate_id, donor_organ_id)", roles: [UNOSAdmin, TransplantCenter, OrganProcurementOrg], code: 200, input: ["offer_id?", "candidate_id?", "donor_organ_id?", "limit?", "offset?"], output: "Transplant[]", side_effects: [] }
  - { method: POST, path: "/transplants/{id}/mark-graft-failed", description: "Mark graft FAILED (AT_RISK->FAILED)", roles: [TransplantCenter], code: 200, input: [], output: Transplant, side_effects: ["graft_status=FAILED"] }
  - { method: POST, path: "/transplants/{id}/follow-ups", description: "Schedule a follow-up for a transplant", roles: [TransplantCenter], code: 201, input: [interval_label, scheduled_for, "graft_functioning?"], output: FollowUp, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/transplants/{id}/follow-ups", description: "List a transplant's follow-ups (reverse-reachability for FollowUp.transplant_id)", roles: [UNOSAdmin, TransplantCenter], code: 200, input: ["status?"], output: "FollowUp[]", side_effects: [] }
  - { method: GET, path: "/follow-ups/{id}", description: "Fetch a follow-up", roles: [UNOSAdmin, TransplantCenter], code: 200, input: [], output: FollowUp, side_effects: [] }
  - { method: POST, path: "/follow-ups/{id}/complete", description: "Complete a follow-up (SCHEDULED->COMPLETED); may escalate/restore graft_status", roles: [TransplantCenter], code: 200, input: [], output: FollowUp, side_effects: ["graft FUNCTIONING<->AT_RISK per graft_functioning"] }
  - { method: POST, path: "/follow-ups/{id}/mark-missed", description: "Mark a follow-up MISSED (SCHEDULED->MISSED) after scheduled_for", roles: [TransplantCenter], code: 200, input: [], output: FollowUp, side_effects: [] }

  # ---- UNOS reports ----------------------------------------------------------
  - { method: POST, path: "/unos-reports", description: "Submit a UNOS report", roles: [TransplantCenter], code: 201, input: [report_kind, "transplant_id?", "candidate_id?"], output: UnosReport, side_effects: ["status=SUBMITTED", "stamp submitted_at"] }
  - { method: GET, path: "/unos-reports/{id}", description: "Fetch a UNOS report", roles: [UNOSAdmin, TransplantCenter], code: 200, input: [], output: UnosReport, side_effects: [] }
  - { method: GET, path: "/unos-reports", description: "List UNOS reports; filter by transplant_id/candidate_id (reverse-reachability for UnosReport.transplant_id, candidate_id)", roles: [UNOSAdmin, TransplantCenter], code: 200, input: ["transplant_id?", "candidate_id?", "report_kind?", "status?", "limit?", "offset?"], output: "UnosReport[]", side_effects: [] }
  - { method: POST, path: "/unos-reports/{id}/accept", description: "Accept a report (SUBMITTED->ACCEPTED)", roles: [UNOSAdmin], code: 200, input: [], output: UnosReport, side_effects: ["stamp acceptance"] }
  - { method: POST, path: "/unos-reports/{id}/reject", description: "Reject a report (SUBMITTED->REJECTED)", roles: [UNOSAdmin], code: 200, input: [rejection_reason], output: UnosReport, side_effects: ["set rejection_reason"] }

  # ---- Test-driving clock ----------------------------------------------------
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the deterministic system clock (test-driving)", roles: [UNOSAdmin], code: 200, input: [to_iso8601], output: SystemClock, side_effects: ["SystemClock.current_utc = to_iso8601; subsequent now-reads use it"] }
  - { method: GET, path: "/_clock", description: "Read the deterministic system clock", roles: [UNOSAdmin, TransplantCenter, OrganProcurementOrg], code: 200, input: [], output: SystemClock, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting TransplantCenter does not own the candidate/offer/transplant being mutated" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/malformed required field, bad enum, wrong array length, non-positive number" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Uniqueness violation: (center_id,mrn) / unos_center_code / opo_code" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_STALE_ORGAN_VERSION, http: 412, condition: "expected_donor_organ_version does not match DonorOrgan.version (OCC)" }
  - { id: ERR_NO_FINALIZED_SCORE, http: 409, condition: "Listing attempted with no FINALIZED ClinicalScore (current_meld_peld == 0)" }
  - { id: ERR_CANDIDATE_NOT_ACTIVE, http: 409, condition: "Offer accept while candidate medical_status != ACTIVE or listing_status != LISTED" }
  - { id: ERR_ABO_INCOMPATIBLE, http: 409, condition: "Donor->recipient ABO blood groups incompatible" }
  - { id: ERR_POSITIVE_CROSSMATCH, http: 409, condition: "A donor antigen appears in candidate.unacceptable_antigens (positive virtual crossmatch)" }
  - { id: ERR_SIZE_INCOMPATIBLE, http: 409, condition: "Donor/recipient weight ratio outside organ-type acceptance band" }
  - { id: ERR_OFFER_WINDOW_CLOSED, http: 409, condition: "Accept attempted after response_deadline_at (now > deadline)" }
  - { id: ERR_OFFER_WINDOW_OPEN, http: 409, condition: "Expire attempted while still within window (now <= deadline)" }
  - { id: ERR_ISCHEMIA_WINDOW_CLOSED, http: 409, condition: "New offer's computed response_deadline_at <= offered_at (cold-ischemia window already past)" }
  - { id: ERR_DUPLICATE_OPEN_OFFER, http: 409, condition: "Candidate already holds an OFFERED offer for this organ" }
  - { id: ERR_NO_NEXT_CANDIDATE, http: 409, condition: "offer-next found no further eligible un-offered candidate in the run" }
  - { id: ERR_OFFER_NOT_ACCEPTED, http: 409, condition: "Transplant create against an offer not in ACCEPTED, or a transplant already exists for it" }
  - { id: ERR_FOLLOWUP_BEFORE_TRANSPLANT, http: 422, condition: "FollowUp.scheduled_for earlier than parent Transplant.transplanted_at" }
  - { id: ERR_REPORT_SUBJECT_INVALID, http: 422, condition: "UnosReport subject missing or REMOVAL candidate not in REMOVED" }
  - { id: ERR_ORGAN_TYPE_MISMATCH, http: 409, condition: "Offer/match organ_type differs from candidate.organ_type" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: UNOSAdmin
    description: "UNOS regulator/operator: manages reference data, accepts/rejects reports, sets the clock"
    identity: opaque
    exclusive_operations:
      - "POST /transplant-centers"
      - "POST /organ-procurement-orgs"
      - "POST /unos-reports/{id}/accept"
      - "POST /unos-reports/{id}/reject"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (read) on all resources"

  - name: TransplantCenter
    description: "A listing center: owns its candidates, clinical scores, accepts/declines offers, records transplants and follow-ups, submits reports"
    identity: "entity_backed:TransplantCenter"
    exclusive_operations:
      - "POST /candidates"
      - "POST /candidates/{id}/list"
      - "POST /candidates/{id}/deactivate"
      - "POST /candidates/{id}/reactivate"
      - "POST /candidates/{id}/remove"
      - "POST /candidates/{id}/clinical-scores"
      - "POST /clinical-scores/{id}/finalize"
      - "POST /offers/{id}/accept"
      - "POST /offers/{id}/decline"
      - "POST /transplants"
      - "POST /transplants/{id}/mark-graft-failed"
      - "POST /transplants/{id}/follow-ups"
      - "POST /follow-ups/{id}/complete"
      - "POST /follow-ups/{id}/mark-missed"
      - "POST /unos-reports"
    shared_operations:
      - "GET (read) on candidates, scores, organs, runs, offers, transplants, follow-ups, reports"

  - name: OrganProcurementOrg
    description: "OPO: registers recovered donor organs, runs allocation, issues offers, expires offers, discards organs"
    identity: "entity_backed:OrganProcurementOrg"
    exclusive_operations:
      - "POST /donor-organs"
      - "POST /donor-organs/{id}/discard"
      - "POST /donor-organs/{id}/offer-next"
      - "POST /match-runs"
      - "POST /offers"
      - "POST /offers/{id}/expire"
    shared_operations:
      - "GET (read) on candidates, organs, runs, offers, transplants, registrations"
