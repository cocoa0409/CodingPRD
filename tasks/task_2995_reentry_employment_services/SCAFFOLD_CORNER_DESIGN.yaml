      assert:
      - HTTP 200
      - data.status == "CANCELLED"
      - GET /placements/${pl1_id} returns projected_subsidy_cents == 7400 and actual_subsidy_cents == 0
      - GET /placements/${pl1_id}/work-shifts returns total_count == 3
      - GET /placements/${pl1_id}/work-shifts?status=SCHEDULED returns total_count == 2
      - GET /grants/${g1_id}/ledger returns committed_cents == 7400 and available_cents == 22600
  - name: subsidy_ladder_straddle_rounds_once_per_shift
    claim_type: tiered_pricing
    grounds:
    - calculations.wage_subsidy_total.constants
    - endpoints[POST /placements/{id}/work-shifts]
    distinguishing_aspect: 'The 10th shift straddles the 80-hour boundary: 8.0h at 0.50 plus 1.0h at 0.25 is 7400
      + 462.5 = 7862.5, and ROUND_HALF_UP is applied once to the shift total (7863), not per segment (7400 + 463 =
      7863 by luck) and not to the whole placement. Charging the whole 9 hours at one rate gives 8325 or 4163 instead.'
