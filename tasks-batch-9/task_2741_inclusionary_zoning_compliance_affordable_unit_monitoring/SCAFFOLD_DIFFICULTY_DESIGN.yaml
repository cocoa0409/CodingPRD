# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2741 — Inclusionary Zoning Compliance & Affordable Unit Monitoring
#
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1–§1.7.
# Every numeric assertion below was produced by executing the relevant §1.3
# `formula:` against its `constants:` — no estimates, no unresolved expressions.
#
# Shared fixture literals used throughout (all derived from §1.3 formulas):
#   Ordinance IZ-2024-01  effective 2024-01-01, min_project_units_threshold 10,
#     set_aside {R-2: 1000, R-4: 1500, C-2: 2000}, fee_gap_level_bps 5000,
#     gap_basis_cents_by_level["5000"] = 24000000, surcharge_bps 350,
#     surcharge_cap_cents 5000000, tiers [0/0bps, 20000000/150bps, 100000000/400bps],
#     fee_due_days 45, alternative_paths_allowed [IN_LIEU_FEE, OFFSITE]
#   AmiSchedule 2026 medians {1: 9868000, 2: 11278000, 3: 12669800, 4: 14082000, 5: 15214000}
#   AmiSchedule 2028 medians {1: 10559000, 2: 12067000, 3: 13555700, 4: 15068000, 5: 16279000}
#   utility allowances {0: 8500, 1: 11000, 2: 14500, 3: 18000}
#   income_limit(size 3, 5000 bps, 2026) = 6334900
#   max_allowed_rent(2br, 5000 bps, 2026) = 143872
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: resale_price_ami_indexed_vs_shared_appreciation_diverge
        grounds:
          - calculations.max_resale_price
          - entities.RegulatoryAgreement.fields.resale_formula
          - entities.ResaleTransaction.fields.indexed_base_cents
          - entities.ResaleTransaction.fields.max_resale_price_cents
          - entities.AffordableUnit.fields.ami_income_at_purchase_cents
        distinguishing_aspect: |
          This dual variant lives in the resale-pricing domain on ResaleTransaction: with
          byte-identical transaction inputs and an identical unit basis, the AMI_INDEXED
          variant returns max_resale_price_cents 36872471 (it reads the AmiSchedule and
          ignores appraised_value_cents) while SHARED_APPRECIATION returns 36725000 (it
          reads appraised_value_cents and ignores the AmiSchedule) — a delta of 147471.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P1 (R-2, 10 units, approved 2026-01-15) screened SUBJECT with required_affordable_units 1, ONSITE path, agreement A1 with resale_formula AMI_INDEXED recorded."
            - "Project P2 identical to P1 but agreement A2 carries resale_formula SHARED_APPRECIATION."
            - "One OWNERSHIP 2-bedroom unit per project, deed restriction recorded at original_purchase_price_cents 32500000 while AmiSchedule 2026 is ACTIVE, so ami_income_at_purchase_cents is 12669800 on both."
            - "AmiSchedule 2028 then published, so the ACTIVE median for household size 3 becomes 13555700."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /iz-compliance/ordinances"
              payload:
                code: "IZ-2024-01"
                effective_date: "2024-01-01"
                min_project_units_threshold: 10
                set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }
                gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }
                fee_gap_level_bps: 5000
                surcharge_bps: 350
                surcharge_cap_cents: 5000000
                discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ]
                fee_due_days: 45
                alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"]
              as: ProgramAdministrator
              captures: { ord_id: $.data.id }
            - call: "POST /iz-compliance/ami-schedules"
              payload:
                effective_year: 2026
                median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }
                utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 }
              as: ProgramAdministrator
              captures: { ami26_id: $.data.id }
            - call: "POST /iz-compliance/projects"
              payload: { name: "Larkspur Row", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }
              as: Developer
              as_user_id: "dev-1"
              captures: { p1_id: $.data.id }
            - call: "POST /iz-compliance/projects/${p1_id}/screen"
              payload: {}
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
            - call: "POST /iz-compliance/projects/${p1_id}/elect-path"
              payload: { compliance_path: "ONSITE" }
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /iz-compliance/regulatory-agreements"
              payload: { project_id: "${p1_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
              captures: { a1_id: $.data.id }
            - call: "POST /iz-compliance/regulatory-agreements/${a1_id}/record"
              payload: { doc_number: "DOC-P1-0001", recorded_at: "2026-08-01" }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
            - call: "POST /iz-compliance/affordable-units"
              payload: { project_id: "${p1_id}", agreement_id: "${a1_id}", unit_number: "L-101", bedrooms: 2, sqft: 950, market_comparable_sqft: 1100, tenure: "OWNERSHIP", affordability_level_bps: 5000 }
              as: Developer
              as_user_id: "dev-1"
              captures: { u1_id: $.data.id }
            - call: "POST /iz-compliance/affordable-units/${u1_id}/record-restriction"
              payload: { original_purchase_price_cents: 32500000, recorded_at: "2026-08-01" }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
            - call: "POST /iz-compliance/projects"
              payload: { name: "Marigold Court", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }
              as: Developer
              as_user_id: "dev-2"
              captures: { p2_id: $.data.id }
            - call: "POST /iz-compliance/projects/${p2_id}/screen"
              payload: {}
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
            - call: "POST /iz-compliance/projects/${p2_id}/elect-path"
              payload: { compliance_path: "ONSITE" }
              as: Developer
              as_user_id: "dev-2"
            - call: "POST /iz-compliance/regulatory-agreements"
              payload: { project_id: "${p2_id}", term_years: 45, resale_formula: "SHARED_APPRECIATION", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
              captures: { a2_id: $.data.id }
            - call: "POST /iz-compliance/regulatory-agreements/${a2_id}/record"
              payload: { doc_number: "DOC-P2-0001", recorded_at: "2026-08-01" }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
            - call: "POST /iz-compliance/affordable-units"
              payload: { project_id: "${p2_id}", agreement_id: "${a2_id}", unit_number: "M-101", bedrooms: 2, sqft: 950, market_comparable_sqft: 1100, tenure: "OWNERSHIP", affordability_level_bps: 5000 }
              as: Developer
              as_user_id: "dev-2"
              captures: { u2_id: $.data.id }
            - call: "POST /iz-compliance/affordable-units/${u2_id}/record-restriction"
              payload: { original_purchase_price_cents: 32500000, recorded_at: "2026-08-01" }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
            - call: "POST /iz-compliance/ami-schedules"
              payload:
                effective_year: 2028
                median_income_cents_by_size: { "1": 10559000, "2": 12067000, "3": 13555700, "4": 15068000, "5": 16279000 }
                utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 }
              as: ProgramAdministrator
              captures: { ami28_id: $.data.id }
            - call: "GET /iz-compliance/affordable-units/${u1_id}"
              payload: {}
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
              captures: { u1_v: $.data.version }
            - call: "GET /iz-compliance/affordable-units/${u2_id}"
              payload: {}
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
              captures: { u2_v: $.data.version }
          trigger:
            - call: "POST /iz-compliance/resale-transactions"
              payload: { unit_id: "${u1_id}", expected_unit_version: "${u1_v}", proposed_price_cents: 36872471, appraised_value_cents: 41000000, capital_improvements_cents: 2500000, deferred_maintenance_cents: 400000, broker_fee_cents: 1000000 }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
              captures: { t1_id: $.data.id }
            - call: "POST /iz-compliance/resale-transactions"
              payload: { unit_id: "${u2_id}", expected_unit_version: "${u2_v}", proposed_price_cents: 36725000, appraised_value_cents: 41000000, capital_improvements_cents: 2500000, deferred_maintenance_cents: 400000, broker_fee_cents: 1000000 }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
              captures: { t2_id: $.data.id }
          assert:
            - "ResaleTransaction.${t1_id}.resale_formula_applied == AMI_INDEXED"
            - "ResaleTransaction.${t1_id}.improvement_credit_cents == 2500000"
            - "ResaleTransaction.${t1_id}.indexed_base_cents == 34772471"
            - "ResaleTransaction.${t1_id}.max_resale_price_cents == 36872471"
            - "ResaleTransaction.${t2_id}.resale_formula_applied == SHARED_APPRECIATION"
            - "ResaleTransaction.${t2_id}.improvement_credit_cents == 2500000"
            - "ResaleTransaction.${t2_id}.indexed_base_cents == 34625000"
            - "ResaleTransaction.${t2_id}.max_resale_price_cents == 36725000"
            - "ResaleTransaction.${t1_id}.max_resale_price_cents - ResaleTransaction.${t2_id}.max_resale_price_cents == 147471"
            - "AffordableUnit.${u1_id}.ami_income_at_purchase_cents == 12669800 and AffordableUnit.${u2_id}.ami_income_at_purchase_cents == 12669800 (identical bases, so the divergence comes only from the formula variant)"

      - name: funder_report_entitlement_vs_occupancy_diverge
        grounds:
          - calculations.funder_report_metrics
          - calculations.project_obligation_equivalents
          - entities.Project.fields.total_obligation_bps
          - entities.AffordableUnit.fields.occupancy_status
        distinguishing_aspect: |
          This dual variant lives in the program-reporting domain on Project, not on
          ResaleTransaction: for one project at one instant with total_obligation_bps
          80000, two units built and exactly one of them OCCUPIED and COMPLIANT, basis
          ENTITLEMENT reports compliance_ratio_bps 2500 while basis OCCUPANCY reports
          1250 — the same delivered units are credited on paper but only half of them
          are credited as housed.
        test_recipe:
          setup:
            - "Ordinance IZ-2024-01 and AmiSchedule 2026 published; clock at 2026-08-01T00:00:00Z."
            - "Project C-2 with 40 total_units screened SUBJECT: required_affordable_units 8, fractional_obligation_bps 0, total_obligation_bps 80000; ONSITE path; agreement recorded."
            - "Two RENTAL 2-bedroom units at 5000 bps created, so onsite_unit_equivalents_bps is 20000 and no in-lieu fee exists."
            - "Household H1 (size 3, income 6000000 which is within the 6334900 limit) certified against unit 1, so unit 1 becomes OCCUPIED and COMPLIANT while unit 2 stays PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /iz-compliance/ordinances"
              payload:
                code: "IZ-2024-01"
                effective_date: "2024-01-01"
                min_project_units_threshold: 10
                set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }
                gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }
                fee_gap_level_bps: 5000
                surcharge_bps: 350
                surcharge_cap_cents: 5000000
                discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ]
                fee_due_days: 45
                alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"]
              as: ProgramAdministrator
              captures: { ord_id: $.data.id }
            - call: "POST /iz-compliance/ami-schedules"
              payload:
                effective_year: 2026
                median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }
                utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 }
              as: ProgramAdministrator
              captures: { ami26_id: $.data.id }
            - call: "POST /iz-compliance/projects"
              payload: { name: "Cedar Yards", zoning_district: "C-2", total_units: 40, approval_date: "2026-01-15" }
              as: Developer
              as_user_id: "dev-1"
              captures: { p_id: $.data.id }
            - call: "POST /iz-compliance/projects/${p_id}/screen"
              payload: {}
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
            - call: "POST /iz-compliance/projects/${p_id}/elect-path"
              payload: { compliance_path: "ONSITE" }
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /iz-compliance/regulatory-agreements"
              payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
              captures: { a_id: $.data.id }
            - call: "POST /iz-compliance/regulatory-agreements/${a_id}/record"
              payload: { doc_number: "DOC-CY-0001", recorded_at: "2026-08-01" }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
            - call: "POST /iz-compliance/affordable-units"
              payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "C-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }
              as: Developer
              as_user_id: "dev-1"
              captures: { u1_id: $.data.id }
            - call: "POST /iz-compliance/affordable-units"
              payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "C-102", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }
              as: Developer
              as_user_id: "dev-1"
              captures: { u2_id: $.data.id }
            - call: "POST /iz-compliance/households"
              payload: { applicant_name: "Nadia Okonjo", household_size: 3, gross_annual_income_cents: 6000000 }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
              captures: { h1_id: $.data.id }
            - call: "POST /iz-compliance/income-certifications"
              payload: { household_id: "${h1_id}", unit_id: "${u1_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-01" }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "GET /iz-compliance/funder-reports"
              payload: { project_id: "${p_id}", basis: "ENTITLEMENT" }
              as: FundAuditor
              as_user_id: "aud-1"
            - call: "GET /iz-compliance/funder-reports"
              payload: { project_id: "${p_id}", basis: "OCCUPANCY" }
              as: FundAuditor
              as_user_id: "aud-1"
          assert:
            - "the ENTITLEMENT response data.total_obligation_bps == 80000"
            - "the ENTITLEMENT response data.delivered_equivalents_bps == 20000"
            - "the ENTITLEMENT response data.compliance_ratio_bps == 2500"
            - "the OCCUPANCY response data.occupied_equivalents_bps == 10000"
            - "the OCCUPANCY response data.compliance_ratio_bps == 1250"
            - "both responses report open_findings_count == 0 and total_fees_assessed_cents == 0, so the 2500-vs-1250 divergence is attributable only to the basis variant"
            - "Project.${p_id}.onsite_unit_equivalents_bps == 20000 and Project.${p_id}.fee_covered_equivalents_bps == 0"

  # ===========================================================================
  # RULE 2 — combinatorial formulas, one instance per mode (a) / (b) / (c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: in_lieu_fee_capped_surcharge_and_post_surcharge_tier_scan
        mode: "(a) three or more inputs interacting non-linearly: a basis branch, a min() clamp and a tiered selection"
        grounds:
          - calculations.in_lieu_fee_assessment
          - calculations.project_obligation_equivalents
          - entities.Ordinance.fields.surcharge_cap_cents
          - entities.Ordinance.fields.discount_tiers
          - entities.InLieuFee.fields.pre_discount_total_cents
        distinguishing_aspect: |
          Mode (a). Three independent inputs must all be honoured and none can be dropped:
          the FULL basis branch prices total_obligation_bps 80000, the surcharge is clamped
          by min(cap 5000000, 6720000) so the cap binds, and the discount tier is scanned
          against the POST-surcharge total 197000000 rather than the base 192000000. Every
          single mistake yields a different, distinguishable answer with this ordinance:
          honouring the cap and scanning on pre-discount gives assessed 194045000; skipping
          the cap gives 198720000 pre-discount, tier 400 bps and assessed 190771200;
          scanning the tier on base_amount_cents gives tier 0 bps and assessed 197000000.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; a single ordinance whose discount_tiers are tuned so the tier boundary 196000000 sits between the base amount 192000000 and the post-surcharge total 197000000, and the next boundary 198000000 sits just above the post-surcharge total but below the unclamped 198720000."
            - "Project (C-2, 40 units) screened SUBJECT: required_affordable_units 8, fractional_obligation_bps 0, total_obligation_bps 80000."
            - "Compliance path IN_LIEU_FEE elected, so onsite_unit_equivalents_bps and fee_covered_equivalents_bps are both 0 and the FULL basis prices the entire 80000 bps."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 196000000, discount_bps: 150 }, { min_pre_discount_cents: 198000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Foundry Block", zoning_district: "C-2", total_units: 40, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "IN_LIEU_FEE" }, as: Developer, as_user_id: "dev-1", captures: { p_v: $.data.version } }
          trigger:
            - call: "POST /iz-compliance/in-lieu-fees"
              payload: { project_id: "${p_id}", basis: "FULL", expected_project_version: "${p_v}" }
              as: ProgramAdministrator
              captures: { fee_id: $.data.id }
          assert:
            - "InLieuFee.${fee_id}.unit_equivalent_bps == 80000"
            - "InLieuFee.${fee_id}.base_amount_cents == 192000000"
            - "InLieuFee.${fee_id}.surcharge_cents == 5000000 (the cap binds; the unclamped surcharge would be 6720000)"
            - "InLieuFee.${fee_id}.pre_discount_total_cents == 197000000"
            - "InLieuFee.${fee_id}.discount_bps_applied == 150 (scanning the tier on base_amount_cents would give 0; scanning it on an unclamped 198720000 would give 400)"
            - "InLieuFee.${fee_id}.discount_cents == 2955000"
            - "InLieuFee.${fee_id}.assessed_amount_cents == 194045000"
            - "InLieuFee.${fee_id}.paid_amount_cents == 0 and InLieuFee.${fee_id}.state == ASSESSED"
            - "InLieuFee.${fee_id}.due_date == 2026-09-15"
            - "InLieuFee.${fee_id}.ordinance_id == ${ord_id}"

      - name: max_allowed_rent_pinned_rounding_order_yields_one_cent_less
        mode: "(b) nested rounding where the order matters and one order is pinned"
        grounds:
          - calculations.max_allowed_rent
          - calculations.income_limit
          - entities.IncomeCertification.fields.max_rent_cents
          - entities.AffordableUnit.fields.max_allowed_rent_cents
        distinguishing_aspect: |
          Mode (b). Four rounding steps are pinned in sequence: income_limit rounds half up
          to whole dollars (6334900), the monthly figure TRUNCATES (527908, discarding
          .333...), the 30% burden rounds half up (158372) and only then is the 2-bedroom
          utility allowance 14500 subtracted, giving 143872. Reassociating the pipeline into
          one expression — round_half_up(6334900 / 12 * 3000 / 10000) — rounds 158372.5 up to
          158373 and yields 143873, exactly one cent more. The pinned order is observable
          because the truncation at step 2 must destroy the third-of-a-cent BEFORE step 3
          rounds.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published (median for size 3 is 12669800, 2-bedroom utility allowance 14500)."
            - "Project (C-2, 40 units) screened SUBJECT, ONSITE path, agreement recorded."
            - "One RENTAL 2-bedroom unit at affordability_level_bps 5000, so the certification's household size basis is bedrooms + 1 == 3."
            - "Household of size 3 with gross_annual_income_cents 6000000, which is at or below the 6334900 limit."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
