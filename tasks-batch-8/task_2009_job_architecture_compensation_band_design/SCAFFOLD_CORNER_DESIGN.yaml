      - name: geo_differential_compounding
        claim_type: correct_result
        grounds: ["calculations.geo_effective_ratio", "entities.GeoZone.fields.effective_ratio"]
        distinguishing_aspect: "The self-referential chain compounds with per-step 6-decimal rounding root-to-leaf: US-NAT 1.000000 -> US-BAY 1.180000 -> US-SFD 1.239000 (1.18 * 1.05 computed on the rounded parent value)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id, nat_r: $.data.effective_ratio } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-BAY", name: "SF Bay", differential_ratio: 1.180000, parent_zone_id: "${nat}" }, as: CompAdmin, captures: { bay: $.data.id, bay_r: $.data.effective_ratio } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-SFD", name: "SF Downtown", differential_ratio: 1.050000, parent_zone_id: "${bay}" }, as: CompAdmin, captures: { sfd: $.data.id, sfd_r: $.data.effective_ratio } }
          assert:
            - "US-NAT.effective_ratio == 1.000000 (root)"
            - "US-BAY.effective_ratio == 1.180000"
            - "US-SFD.effective_ratio == 1.239000 (round6(1.180000 * 1.050000))"

