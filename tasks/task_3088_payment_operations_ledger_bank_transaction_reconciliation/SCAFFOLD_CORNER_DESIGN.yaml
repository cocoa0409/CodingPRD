- section: validations
  instances:
  - name: role_check_precedes_not_found_on_a_single_role_endpoint
    claim_type: Priority Ordering
    grounds:
    - validations[priority=2]
    - validations[priority=3]
    - validations[priority=4]
    - errors[ERR_FORBIDDEN_FOR_ROLE]
    - endpoints.POST_/ledgers/{id}/close-period
    distinguishing_aspect: On a single-role endpoint the authorization check at priority 2/3 outranks existence
      at priority 4, so a PaymentOpsAnalyst closing a period that does not exist is told ERR_FORBIDDEN_FOR_ROLE
      rather than ERR_LEDGER_NOT_FOUND.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z. One ledger exists at version 1; the ledger id named in the path is a
        different, unallocated one.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /ledgers
        payload:
          name: Priority Ledger
          currency: USD
        as: PlatformAdmin
        captures:
          c19_ledger: $.data.id
          c19_ledger_v: $.data.version
      trigger:
      - call: POST /ledgers/00000000-0000-4000-8000-000000000000/close-period
        payload:
          expected_ledger_version: ${c19_ledger_v} - 1
          force_resolve_exceptions: false
        as: PaymentOpsAnalyst
        captures:
          c19_err: $.data.error_id
      assert:
      - the response is 403 and error_id == ERR_FORBIDDEN_FOR_ROLE
      - error_id != ERR_LEDGER_NOT_FOUND even though the ledger also does not exist
      - the same call from a LedgerController returns 404 ERR_LEDGER_NOT_FOUND, so both checks exist and only their
        priority decides which is reported
