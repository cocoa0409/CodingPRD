      - name: program_approval_cycles_back_through_changes_requested_to_submitted
        claim_type: cyclic
        grounds:
          - state_machines.ProgramOfStudy.COMMITTEE_REVIEW_to_CHANGES_REQUESTED
          - state_machines.ProgramOfStudy.CHANGES_REQUESTED_to_SUBMITTED
          - entities.ProgramOfStudy.fields.approval_round
          - entities.ProgramOfStudy.fields.open_finding_codes
        excluded_because:
          difficulty_instance: non_linear_state_machine / program_approval_revision_cycle_with_independent_clna_axis
          rationale: "That instance drives request-changes and the resubmit, asserting approval_round 1 then 2 and open_finding_codes filling then clearing."

      - name: improvement_plan_loop_terminates_at_the_third_revision_round
        claim_type: cyclic
        grounds:
          - state_machines.ImprovementPlan.SUBMITTED_to_RETURNED
          - state_machines.ImprovementPlan.RETURNED_to_SUBMITTED
          - state_machines.ImprovementPlan.SUBMITTED_to_REJECTED_FINAL
        excluded_because:
          difficulty_instance: non_linear_state_machine / improvement_plan_return_resubmit_cycle_terminates_in_rejected_final
          rationale: "That instance walks the return/resubmit loop and asserts the terminal REJECTED_FINAL on the third round."

      - name: committee_review_entry_is_guarded_by_the_endorsement_minutes_of_another_entity
        claim_type: guarded_transitions
        grounds:
          - state_machines.ProgramOfStudy.SUBMITTED_to_COMMITTEE_REVIEW
          - entities.CommitteeMeeting.fields.endorsement_passed
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / program_reaches_committee_review_only_through_passing_endorsement_minutes
          rationale: "That instance asserts the guard in both directions: a failing vote strands the program in SUBMITTED, a passing vote advances it."

      - name: closing_a_missed_reporting_year_cascades_down_to_program_and_expenditures
        claim_type: cascade_down
        grounds:
          - state_machines.PerformanceIndicator.NOT_MET_to_NOT_MET
          - state_machines.ProgramOfStudy.STATE_APPROVED_to_SUSPENDED
          - state_machines.Expenditure.REQUESTED_to_BLOCKED
        excluded_because:
          difficulty_instance: transitive_cascade / close_reporting_year_cascades_miss_count_to_program_suspension_and_expenditure_block
          rationale: "That instance verifies the whole four-link chain end to end, including that only non-terminal expenditures are blocked."

      - name: accepting_an_improvement_plan_conditionally_unblocks_only_blocked_expenditures
        claim_type: conditional_cascade
        grounds:
          - state_machines.ImprovementPlan.SUBMITTED_to_ACCEPTED
          - state_machines.Expenditure.BLOCKED_to_REQUESTED
          - state_machines.ProgramOfStudy.SUSPENDED_to_CHANGES_REQUESTED
        excluded_because:
          difficulty_instance: transitive_cascade / accept_improvement_plan_cascades_monitoring_reinstatement_and_expenditure_unblock
          rationale: "That instance asserts the reinstatement cascade and that expenditures outside BLOCKED are left untouched."

      - name: certification_syncs_the_ancestor_grant_ledger
        claim_type: ledger_sync
        grounds:
          - calculations.grant_obligation_rollup
          - entities.GrantAward.fields.direct_obligated_cents
          - entities.GrantAward.fields.obligated_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / federal_share_rounds_per_line_before_the_grant_rollup_sums
          rationale: "That instance reconciles every ledger field before and after two certifications with pre-computed literals."

      - name: voiding_reverses_every_original_certification_side_effect_without_drift
        claim_type: compensation
        grounds:
          - state_machines.Expenditure.CERTIFIED_to_VOIDED
          - calculations.grant_obligation_rollup
        excluded_because:
          difficulty_instance: compensating_invariant / voiding_recomputes_the_grant_ledger_from_scratch_instead_of_decrementing_it
          rationale: "That instance pins the exact post-void ledger and the allocation == obligated + remaining identity."

