  # ===========================================================================
  # Section 5 — Endpoints (§1.5)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: clock_endpoint_sets_the_instant_stamped_on_later_writes
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.ReadinessTask.fields.created_at
        distinguishing_aspect: |
          The logical clock is the single source of every timestamp in the system: the
          instant it is set to is echoed in the setter's own response and is the exact value
          stamped into created_at, updated_at, notice_sent_on and closed_at by every
          later write, so advancing the clock changes what subsequent writes record
          without touching anything already stored.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { early_acq_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T14:30:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /readiness-tasks"
              payload: { acquisition_id: "${early_acq_id}", task_code: "COMPLIANCE_TRAINING", is_blocking: true, due_on: "2026-10-25" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { task_id: "$.data.id" }
          assert:
            - "the second POST /_clock/set_current_utc response body carries current_utc == 2026-09-05T14:30:00Z"
            - "Acquisition.${early_acq_id}.created_at == 2026-08-01T00:00:00Z, unchanged by the clock move"
            - "ReadinessTask.${task_id}.created_at == 2026-09-05T14:30:00Z"
            - "the readiness recompute triggered by the new task sets Acquisition.${early_acq_id}.updated_at to 2026-09-05T14:30:00Z"
            - "the clock endpoint accepts DealLead and ComplianceOfficer as well as IntegrationManager, and a PracticePhysician caller is refused with ERR_FORBIDDEN_ROLE (403)"

      - name: action_endpoint_returns_the_whole_updated_entity
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /readiness-tasks/{taskId}/status]
          - response_envelope
        distinguishing_aspect: |
          An action endpoint's response body is the full updated entity, not a bare
          acknowledgement: the new status, the bumped version, the refreshed updated_at
          and every unchanged field all come back in the same response, so no follow-up
          GET is needed to observe the transition.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING with one blocking ReadinessTask in status OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /readiness-tasks"
              payload: { acquisition_id: "${acq_id}", task_code: "IT_DATA_MIGRATION", is_blocking: true, due_on: "2026-10-20" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { task_id: "$.data.id", task_v1: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /readiness-tasks/${task_id}/status"
              payload: { target_status: "IN_PROGRESS" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { task_v2: "$.data.version" }
          assert:
            - "HTTP status is 200 and the response body is the ReadinessTask object, not an empty acknowledgement"
            - "the response carries status == IN_PROGRESS, task_code == IT_DATA_MIGRATION, domain == IT and is_blocking == true"
            - "${task_v2} == ${task_v1} + 1 and the response updated_at == 2026-08-02T09:00:00Z while created_at stays 2026-08-01T00:00:00Z"
            - "a following GET /readiness-tasks/${task_id} returns a body identical to the action response"

      - name: filtered_listing_narrows_by_acquisition_and_status_together
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /readiness-tasks]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The list endpoint applies its filters conjunctively and scopes strictly by
          foreign key, so tasks belonging to a second acquisition never leak into the
          first acquisition's list and total_count reflects the filtered set rather than
          the whole table.
        test_recipe:
          setup:
            - "Two Acquisitions; acquisition A has three ReadinessTasks (one moved to IN_PROGRESS) and acquisition B has one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_a_id: "$.data.id" }
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Northgate Cardiology Associates", specialty: "CARDIOLOGY", structure: "EQUITY", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 9600000, trailing_annual_collections_cents: 900000000, target_close_on: "2026-12-01", required_staff_headcount: 8, retention_pool_total_cents: 6000000, escrow_total_cents: 20000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_b_id: "$.data.id" }
            - call: "POST /readiness-tasks"
              payload: { acquisition_id: "${acq_a_id}", task_code: "COMPLIANCE_TRAINING", is_blocking: true, due_on: "2026-10-25" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { task_a1_id: "$.data.id" }
            - call: "POST /readiness-tasks"
              payload: { acquisition_id: "${acq_a_id}", task_code: "IT_DATA_MIGRATION", is_blocking: true, due_on: "2026-10-20" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { task_a2_id: "$.data.id" }
            - call: "POST /readiness-tasks"
              payload: { acquisition_id: "${acq_a_id}", task_code: "SIGNAGE_UPDATE", is_blocking: false, due_on: "2026-10-30" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { task_a3_id: "$.data.id" }
            - call: "POST /readiness-tasks"
              payload: { acquisition_id: "${acq_b_id}", task_code: "COMPLIANCE_TRAINING", is_blocking: true, due_on: "2026-11-25" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { task_b1_id: "$.data.id" }
            - call: "POST /readiness-tasks/${task_a2_id}/status"
              payload: { target_status: "IN_PROGRESS" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "GET /readiness-tasks"
              payload: { acquisition_id: "${acq_a_id}", status: "OPEN" }
              as: IntegrationManager
              as_user_id: "im-1"
          assert:
            - "the filtered list returns exactly ${task_a1_id} and ${task_a3_id} with total_count == 2 and has_more == false"
            - "${task_a2_id} is excluded by the status filter and ${task_b1_id} by the acquisition_id filter"
            - "GET /readiness-tasks with acquisition_id ${acq_a_id} alone reports total_count == 3"
            - "GET /readiness-tasks with acquisition_id ${acq_a_id} and is_blocking true reports total_count == 2, excluding the SIGNAGE_UPDATE line"
            - "GET /readiness-tasks with no filter at all reports total_count == 4, so the same task_code COMPLIANCE_TRAINING is legal on two different acquisitions"

      - name: pagination_limit_above_one_hundred_returns_invalid_request
        claim_type: Standard CRUD
        grounds:
          - validations[priority=3]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          limit is constrained to 1..100 and offset to non-negative values, and the
          bounds are enforced rather than silently clamped: 100 is accepted, 101 is a
          400, and an offset past the end of the collection is a legal empty page rather
          than an error.
        test_recipe:
          setup:
            - "Two Acquisitions."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
