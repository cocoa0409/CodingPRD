      - 'GET /investor-accounts?production_id=${pr}: total_count == 2 (investors ${iv2} and ${iv3} only)'
  - name: subscription_cure_cycle_exhaustion_branches_to_rejected
    grounds:
    - '§1.2 Subscription: SUBMITTED -> RETURNED_FOR_CURE vs REJECTED branch on cure_round_count + 1 > MAX_CURE_ROUNDS'
    - '§1.2 Subscription: RETURNED_FOR_CURE -> SUBMITTED via resubmit (cycle)'
    - §1.1 Subscription.cure_round_count
    - §1.6 ERR_INVALID_SUBSCRIPTION_STATE
    distinguishing_aspect: |
      The same return-for-cure trigger produces RETURNED_FOR_CURE on rounds 1 and 2 but
      REJECTED on round 3, because MAX_CURE_ROUNDS is 2 and the branch is evaluated on
      cure_round_count + 1. REJECTED is terminal, so a subsequent resubmit must fail with
      ERR_INVALID_SUBSCRIPTION_STATE (409) rather than restarting the cycle. An
      implementation that compares cure_round_count (not +1) rejects one round early; one
      with an unbounded cycle never reaches REJECTED at all.
