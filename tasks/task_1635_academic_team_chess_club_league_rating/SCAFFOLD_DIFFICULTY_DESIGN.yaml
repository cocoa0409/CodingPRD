          assert:
            - "invoice.dues_subtotal_cents == 40000 (two PAID memberships; the WAIVED one contributes 0)"
            - "invoice.entries_subtotal_cents == 2796 (3 x 932)"
            - "invoice.volume_credit_cents == 2140 (round_half_up(42796 * 0.05)); tier keyed on PRE-credit subtotal 42796 (>= 40000, < 80000)"
