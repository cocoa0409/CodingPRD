  - rule_id: boundary_precision_check
    instances:

      - name: bpc_deposit_threshold_at_exactly_500000_reserve
        grounds:
          - calculations.bidder_deposit_requirement
          - calculations.bidder_deposit_requirement.constants.DEPOSIT_THRESHOLD_CENTS
          - calculations.asset_fair_market_value.variants[auction_reserve]
          - entities.AuctionLot.fields.required_deposit_cents
        distinguishing_aspect: |
          The threshold is crossed by the rounding of the reserve itself. Two assets one cent apart in
          fair_market_value_cents produce reserves of 500000 and 499999 because 833333 * 0.60 is 499999.8
          and rounds up while 833332 * 0.60 is 499999.2 and rounds down; the >= comparison then makes the
          first lot require a 50000 deposit and the second require none. A truncating implementation
          computes 499999 for both and silently drops the deposit requirement.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one STATE_AGENCY organization DOT-01 with an ACCEPTED turn-in holding two 2026 furniture clusters"
            - "asset H: cost 833333, acquired 2026-01-10 (full_years 0, age_factor 1.00), assessed C1 / functional / repair 0 -> fair_market_value_cents 833333"
            - "asset L: cost 833332, same date and assessment -> fair_market_value_cents 833332"
            - "both assets carried through all four screening tiers to AUCTION_ELIGIBLE and listed at AUS-01, whose concurrent_lot_capacity is 2"
