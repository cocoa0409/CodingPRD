# =========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2237 - Direct-to-Consumer Hearing Aid & Remote Fitting
#
# Every instance below is reachable from an EMPTY database using only
# endpoints declared in SCAFFOLD.yaml 1.5. The logical clock starts at
# exactly 2026-08-01T00:00:00Z and is only ever moved with
# POST /_clock/set_current_utc (no wall-clock waits anywhere).
# All numbers are pre-computed literals derived from SCAFFOLD.yaml 1.4.
# =========================================================================
scaffold_difficulty_design:

  # =======================================================================
  # 0.5 rule 1: dual_variant_calc
  # Two calculations where two plausible readings diverge, on DIFFERENT
  # entity domains (Patient candidacy vs ReturnAuthorization/DeviceOrder cash).
  # =======================================================================
  dual_variant_calc:

    - name: candidacy_provisional_vs_provider_adjusted_identical_measurements
      grounds:
        - "calculations.candidacy_risk_score"
        - "state_machines.Patient.SCREENING_IN_PROGRESS_to_CANDIDATE_APPROVED"
        - "state_machines.Patient.REFERRAL_REQUIRED_to_PROVIDER_CLEARED"
        - "entities.Patient.fields.candidacy_risk_variant"
        - "entities.ProviderReferral.fields.cleared_finding_count"
      distinguishing_aspect: >-
        Two patients submit byte-identical screening measurements
        (pure_tone_avg_db 45.0, asymmetry_db 5.0, self_reported_difficulty_score 20,
        speech_in_noise_pct 70.0) yet end with DIFFERENT candidacy_risk_score:
        41.5 under PROVISIONAL_SELF_REPORTED (raw weighted sum) and 41.3 under
        PROVIDER_ADJUSTED (base * 0.85 + 6.0 * cleared_mandatory_finding_count).
        An implementation that picks the variant by caller input, or that reuses the
        provisional score after a clearance, cannot produce 41.3 - and an
        implementation that attenuates without adding the cleared-flag points
        produces 35.3 instead. Variant selection is by TRIGGER, never by payload.
      test_recipe:
        setup:
          - "Empty DB. Logical clock pinned to the 2026-08-01T00:00:00Z startup default."
          - "One CA StatePolicy (otc_sales_permitted true, min_age_years 18, waiver_required false, referral_validity_days 180)."
          - "One LICENSED_AUDIOLOGIST Provider licensed in CA with daily_capacity_minutes 480 and buffer_minutes 10."
          - "Patient X screens clean (symptom_codes []) so the submit writes the PROVISIONAL_SELF_REPORTED score."
          - "Patient Y screens with symptom_codes ['VERTIGO'] so red_flag_referral_trigger emits exactly one MANDATORY_REFERRAL finding, outcome RED_FLAG, and NO provisional score is written."
          - "Patient Y's REFERRAL_EVALUATION session is booked, started and completed so the referral reaches EVALUATED and the determination becomes legal."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /providers"
            payload: { provider_type: "LICENSED_AUDIOLOGIST", npi: "1234567893", full_name: "Dr. Ada Reyes", licensed_state_codes: ["CA"], daily_capacity_minutes: 480, buffer_minutes: 10 }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { aud: "$.data.id" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "x@example.com", full_name: "Patient X", age_years: 65 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat_x: "$.data.id" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "y@example.com", full_name: "Patient Y", age_years: 65 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat_y: "$.data.id" }
          - call: "POST /patients/${pat_x}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat_x}"
            captures: { scr_x: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr_x}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_x}" }
          - { call: "POST /screening-sessions/${scr_x}/submit", payload: {}, as: Patient, as_user_id: "${pat_x}" }
          - call: "POST /patients/${pat_y}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat_y}"
            captures: { scr_y: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr_y}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: ["VERTIGO"] }, as: Patient, as_user_id: "${pat_y}" }
          - { call: "POST /screening-sessions/${scr_y}/submit", payload: {}, as: Patient, as_user_id: "${pat_y}" }
          - call: "GET /provider-referrals"
            payload: { patient_id: "${pat_y}" }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { ref_y: "$.data[0].id" }
          - call: "POST /remote-fitting-sessions"
            payload: { patient_id: "${pat_y}", session_type: "REFERRAL_EVALUATION", scheduled_start_utc: "2026-08-05T09:00:00Z", scheduled_end_utc: "2026-08-05T10:00:00Z", provider_id: "${aud}", provider_referral_id: "${ref_y}" }
            as: Patient
            as_user_id: "${pat_y}"
            captures: { sess_y: "$.data.id" }
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /remote-fitting-sessions/${sess_y}/start", payload: {}, as: LicensedAudiologist, as_user_id: "${aud}" }
          - { call: "POST /remote-fitting-sessions/${sess_y}/complete", payload: {}, as: LicensedAudiologist, as_user_id: "${aud}" }
        trigger:
          - { call: "POST /provider-referrals/${ref_y}/determination", payload: { clearance_outcome: "CLEARED", clearance_note: "No pathology on otoscopy." }, as: LicensedAudiologist, as_user_id: "${aud}" }
        assert:
          - "GET /screening-sessions/${scr_x}: data.status == \"SCORED\" and data.screening_outcome == \"PASS\""
          - "GET /patients/${pat_x}: data.status == \"CANDIDATE_APPROVED\""
          - "GET /patients/${pat_x}: data.candidacy_risk_variant == \"PROVISIONAL_SELF_REPORTED\""
          - "GET /patients/${pat_x}: data.candidacy_risk_score == 41.5"
          - "GET /patients/${pat_x}: data.candidacy_risk_band == \"MODERATE\""
          - "GET /screening-sessions/${scr_y}: data.screening_outcome == \"RED_FLAG\""
          - "GET /provider-referrals/${ref_y}: data.status == \"CLEARED\" and data.cleared_finding_count == 1"
          - "GET /patients/${pat_y}: data.status == \"PROVIDER_CLEARED\""
          - "GET /patients/${pat_y}: data.candidacy_risk_variant == \"PROVIDER_ADJUSTED\""
          - "GET /patients/${pat_y}: data.candidacy_risk_score == 41.3"
          - "GET /patients/${pat_y}: data.candidacy_risk_score != 41.5 (the provisional reading) and != 35.3 (attenuation without cleared-flag points)"
          - "GET /patients/${pat_y}: data.candidacy_risk_band == \"MODERATE\""
          - "GET /patients/${pat_y}: data.open_mandatory_flag_count == 0 and data.advisory_weight_total == 0.0"

    - name: return_settlement_flat_pct_vs_prorated_daily_same_day_return
      grounds:
        - "calculations.return_refund_settlement"
        - "entities.StatePolicy.fields.restocking_fee_mode"
        - "entities.ReturnAuthorization.fields.restocking_variant"
        - "state_machines.ReturnAuthorization.RECEIVED_to_INSPECTED"
        - "concurrency_rules[return-authorization-create-stale-trial]"
      distinguishing_aspect: >-
        Two structurally identical orders (list_price_cents 199900,
        discount_cents 9900, accessory_subtotal_cents 4500, shipping_cents 1495,
        captured_cents 210096) returned on the SAME trial day
        (days_used_at_issue 6) with the SAME inspection_grade RESELLABLE settle to
        DIFFERENT refunds: 189376 under FLAT_PCT (restocking scales with the device
        subtotal, 19000 + 225) and 193601 under PRORATED_DAILY (restocking scales
        with min(days_used_at_issue, pinned_trial_days) * 2500 = 15000 and the
        accessory component is 0). The 4225-cent gap is unreachable if the variant
        is chosen by anything other than the PINNED StatePolicy.restocking_fee_mode.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with restocking_fee_mode FLAT_PCT, restocking_fee_pct 0.1000, restocking_fee_cap_cents 0, shipping_refundable false, trial_period_days 30."
          - "StatePolicy TX with restocking_fee_mode PRORATED_DAILY, restocking_daily_rate_cents 2500, restocking_fee_cap_cents 0, shipping_refundable false, trial_period_days 30."
          - "One InventoryPool NEO/M/OPEN restocked with 5 units and two IN_STOCK NEO devices."
          - "One CA patient and one TX patient, both age 65, both screening clean so confirm-fit is not blocked by an open mandatory flag."
          - "Both orders authorized, fit-confirmed, shipped and DELIVERED at 2026-08-01T00:00:00Z, so both TrialPeriod rows start then."
          - "Clock advanced to 2026-08-07T00:00:00Z, i.e. exactly 6 * 86400 seconds of elapsed trial, then the two return authorizations are issued under OCC on the trial version read back from GET /trial-periods."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol_ca: "$.data.id" }
          - call: "POST /state-policies"
            payload: { state_code: "TX", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "PRORATED_DAILY", restocking_daily_rate_cents: 2500, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol_tx: "$.data.id" }
          - call: "POST /inventory-pools"
            payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pool: "$.data.id" }
          - { call: "POST /inventory-pools/${pool}/restock", payload: { units: 5 }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /devices", payload: { serial_number: "SN-CA-0001", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /devices", payload: { serial_number: "SN-TX-0001", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol_ca}", email: "ca@example.com", full_name: "Cara Ash", age_years: 65 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat_ca: "$.data.id" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol_tx}", email: "tx@example.com", full_name: "Tex Bell", age_years: 65 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat_tx: "$.data.id" }
          - call: "POST /patients/${pat_ca}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat_ca}"
            captures: { scr_ca: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr_ca}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_ca}" }
          - { call: "POST /screening-sessions/${scr_ca}/submit", payload: {}, as: Patient, as_user_id: "${pat_ca}" }
          - call: "POST /patients/${pat_tx}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat_tx}"
            captures: { scr_tx: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr_tx}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_tx}" }
          - { call: "POST /screening-sessions/${scr_tx}/submit", payload: {}, as: Patient, as_user_id: "${pat_tx}" }
          - call: "POST /patients/${pat_ca}/device-orders"
            payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 199900, discount_cents: 9900, accessory_subtotal_cents: 4500, shipping_cents: 1495 }
            as: Patient
            as_user_id: "${pat_ca}"
            captures: { ord_ca: "$.data.id" }
          - call: "POST /patients/${pat_tx}/device-orders"
            payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 199900, discount_cents: 9900, accessory_subtotal_cents: 4500, shipping_cents: 1495 }
            as: Patient
            as_user_id: "${pat_tx}"
            captures: { ord_tx: "$.data.id" }
          - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord_ca}", outcome: "AUTHORIZED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord_tx}", outcome: "AUTHORIZED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /device-orders/${ord_ca}/confirm-fit", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /device-orders/${ord_ca}/ship", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /device-orders/${ord_tx}/confirm-fit", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /device-orders/${ord_tx}/ship", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord_ca}", event: "DELIVERED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord_tx}", event: "DELIVERED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "GET /trial-periods"
            payload: { device_order_id: "${ord_ca}" }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { trial_ca: "$.data[0].id", trial_ca_v: "$.data[0].version" }
          - call: "GET /trial-periods"
            payload: { device_order_id: "${ord_tx}" }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { trial_tx: "$.data[0].id", trial_tx_v: "$.data[0].version" }
          - call: "POST /trial-periods/${trial_ca}/return-authorizations"
            payload: { expected_trial_period_version: "${trial_ca_v}" }
            as: Patient
            as_user_id: "${pat_ca}"
            captures: { ra_ca: "$.data.id" }
          - call: "POST /trial-periods/${trial_tx}/return-authorizations"
            payload: { expected_trial_period_version: "${trial_tx_v}" }
            as: Patient
            as_user_id: "${pat_tx}"
            captures: { ra_tx: "$.data.id" }
          - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord_ca}", event: "RETURN_PICKED_UP" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord_tx}", event: "RETURN_PICKED_UP" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /return-authorizations/${ra_ca}/receive", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /return-authorizations/${ra_tx}/receive", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
        trigger:
          - { call: "POST /return-authorizations/${ra_ca}/inspect", payload: { inspection_grade: "RESELLABLE" }, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /return-authorizations/${ra_tx}/inspect", payload: { inspection_grade: "RESELLABLE" }, as: CareOpsAgent, as_user_id: "ops_1" }
        assert:
          - "GET /device-orders/${ord_ca}: data.tax_cents == 14101 and data.total_cents == 210096 and data.captured_cents == 210096"
          - "GET /device-orders/${ord_tx}: data.tax_cents == 14101 and data.total_cents == 210096 and data.captured_cents == 210096"
          - "GET /return-authorizations/${ra_ca}: data.days_used_at_issue == 6"
          - "GET /return-authorizations/${ra_tx}: data.days_used_at_issue == 6"
          - "GET /return-authorizations/${ra_ca}: data.restocking_variant == \"FLAT_PCT\""
          - "GET /return-authorizations/${ra_ca}: data.restocking_fee_cents == 19225"
          - "GET /return-authorizations/${ra_ca}: data.non_refundable_shipping_cents == 1495"
          - "GET /return-authorizations/${ra_ca}: data.refund_amount_cents == 189376"
          - "GET /return-authorizations/${ra_tx}: data.restocking_variant == \"PRORATED_DAILY\""
          - "GET /return-authorizations/${ra_tx}: data.restocking_fee_cents == 15000"
          - "GET /return-authorizations/${ra_tx}: data.non_refundable_shipping_cents == 1495"
          - "GET /return-authorizations/${ra_tx}: data.refund_amount_cents == 193601"
          - "The two refunds differ by exactly 4225 cents (193601 - 189376) for identical orders returned on identical trial days"
          - "GET /device-orders/${ord_ca}: data.pinned_restocking_mode == \"FLAT_PCT\" and data.pinned_trial_days == 30"
          - "GET /device-orders/${ord_tx}: data.pinned_restocking_mode == \"PRORATED_DAILY\" and data.pinned_trial_days == 30"

  # =======================================================================
  # 0.5 rule 2: combinatorial_formula
  # Three instances in three DIFFERENT modes:
  #   (b) nested rounding where order matters   -> restocking components
  #   (c) circular-looking dependency, pinned   -> care plan cycle charge
  #   (a) >=3 inputs with non-linear interaction -> warranty deductible
  # =======================================================================
  combinatorial_formula:

    - name: restocking_per_component_rounding_before_sum
      grounds:
        - "calculations.return_refund_settlement"
        - "entities.StatePolicy.fields.restocking_fee_pct"
        - "entities.ReturnAuthorization.fields.inspection_grade"
        - "state_machines.ReturnAuthorization.RECEIVED_to_INSPECTED"
      distinguishing_aspect: >-
        MODE (b) - nested rounding where the ORDER of rounding changes the cents.
        The three restocking components round to 7254 (device: 100050 * 0.0725 =
        7253.625), 121 (accessory: 3333 * 0.0725 * 0.5 = 120.82125) and 5003
        (REFURBISHABLE damage: 100050 * 0.05 = 5002.5, round_half_up on an exact
        half) and only then sum to 12378. Summing the unrounded reals first
        (12376.94625) and rounding the total yields 12377 - one cent lower - and a
        refund of 99996 instead of 99995. The scaffold pins per-component rounding.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy NV with restocking_fee_mode FLAT_PCT, restocking_fee_pct 0.0725, restocking_fee_cap_cents 20000 (deliberately above the raw fee so the cap does not mask the rounding), shipping_refundable true, trial_period_days 30."
          - "One InventoryPool NEO/S/CLOSED with 3 units and one IN_STOCK NEO device."
          - "Patient age 70 screens clean; order priced so all three components land on non-trivial fractions: list_price_cents 110000, discount_cents 9950, accessory_subtotal_cents 3333, shipping_cents 1495."
          - "Delivered at 2026-08-01T00:00:00Z; clock moved to 2026-08-04T00:00:00Z so days_used_at_issue == 3 and the variant is FLAT_PCT (not the zero-day WAIVED edge)."
          - "Inspection grade REFURBISHABLE so the third (damage) component is non-zero and independently rounded."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "NV", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.0725, restocking_fee_cap_cents: 20000, shipping_refundable: true, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /inventory-pools"
            payload: { sku: "NEO-S-CLOSED", model: "NEO", dome_size: "S", tip_type: "CLOSED" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pool: "$.data.id" }
          - { call: "POST /inventory-pools/${pool}/restock", payload: { units: 3 }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /devices", payload: { serial_number: "SN-NV-0001", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "nv@example.com", full_name: "Nina Vale", age_years: 70 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat: "$.data.id" }
          - call: "POST /patients/${pat}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat}"
            captures: { scr: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat}" }
          - { call: "POST /screening-sessions/${scr}/submit", payload: {}, as: Patient, as_user_id: "${pat}" }
          - call: "POST /patients/${pat}/device-orders"
            payload: { model: "NEO", dome_size: "S", tip_type: "CLOSED", list_price_cents: 110000, discount_cents: 9950, accessory_subtotal_cents: 3333, shipping_cents: 1495 }
            as: Patient
            as_user_id: "${pat}"
            captures: { ord: "$.data.id" }
          - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord}", outcome: "AUTHORIZED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /device-orders/${ord}/confirm-fit", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /device-orders/${ord}/ship", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
