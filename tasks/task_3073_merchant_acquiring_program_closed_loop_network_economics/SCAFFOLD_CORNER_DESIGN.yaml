              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_v1: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_v1}", merchant_name: "Validation Merchant 1", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_v1: $.data.id, m_v1_v: $.data.version }
            - call: "POST /network/merchants/${m_v1}/accept"
              payload: { expected_merchant_version: "${m_v1_v}" }
