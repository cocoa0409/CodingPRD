      - name: a_request_with_no_role_header_is_unauthenticated
        claim_type: Authentication
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
          - "response_envelope.error_id"
        distinguishing_aspect: |
          Authentication sits at priority 1, ahead of the role check, the body-shape check
          and every 404. So a headerless request carrying an unknown path id and a
          malformed body must still answer 401 - a server that parses the body first leaks
          which resources exist to an unauthenticated caller.
        test_recipe:
          setup:
            - "One plan exists."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "GET /plans/${plan_id}"
              payload: {}
              captures: { e_get: "$.data.error_id" }
            - call: "POST /plans"
              payload: { name: "Phantom Fund" }
              captures: { e_post: "$.data.error_id" }
            - call: "GET /employers/00000000-0000-0000-0000-0000000000e1"
              payload: {}
              captures: { e_404: "$.data.error_id" }
            - call: "POST /collection-sweeps"
              payload: {}
              captures: { e_body: "$.data.error_id" }
          assert:
            - "Every call returns HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\"."
            - "The read of an existing plan returns 401 rather than 200, and the read of a non-existent employer returns 401 rather than 404."
            - "The sweep with no plan_id at all returns 401 rather than 400 ERR_INVALID_REQUEST, and no installment or review request anywhere changed state."
            - "Each error response carries a non-null message and request_id with data null."

      - name: an_employer_representative_cannot_act_on_another_employers_resources
        claim_type: Peer roles
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
          - "roles.EmployerRepresentative"
        distinguishing_aspect: |
          The EmployerRepresentative is entity-backed, so the same role and the same
          endpoint are legitimate or forbidden purely on the X-User-ID. Ownership resolves
          through a four-hop chain for installments (Installment -> PaymentSchedule ->
          LiabilityAssessment -> WithdrawalEvent -> Employer), and it must be checked at
          priority 6 - BEFORE the state check at priority 8 - so the stranger learns
          nothing about whether the installment is payable.
