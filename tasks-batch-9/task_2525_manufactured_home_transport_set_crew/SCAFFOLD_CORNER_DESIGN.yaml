        distinguishing_aspect: |
          REVERSED is terminal, so all four claim triggers are refused from it -
          including review, which IS a legal re-entry point from DISPUTED, and
          reverse itself, which is not idempotent. The 90000 approved amount that
          the reversal removed must not reappear on the hauler's ledger after any
          of the four rejected calls.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, one ACTIVE Hauler, one SetCrew, a single-section AZ order with the section created"
            - "a 100000-cent claim discovered IN_TRANSIT, reviewed, adjudicated on the STAGE basis (approved 90000, all of it to the hauler, which stays ACTIVE because 90000 is below the 500000 suspension threshold) and then reversed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
