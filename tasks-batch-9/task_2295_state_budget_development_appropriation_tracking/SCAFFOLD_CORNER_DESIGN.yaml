        grounds:
          - validations[priority=30]
          - validations[priority=31]
          - validations[priority=32]
          - validations[priority=34]
          - errors[ERR_TRANSFER_SAME_APPROPRIATION]
          - errors[ERR_TRANSFER_FUND_TYPE_MISMATCH]
          - errors[ERR_TRANSFER_TYPE_MISMATCH]
          - errors[ERR_TRANSFER_EXCEEDS_AUTHORITY_CAP]
        distinguishing_aspect: |
          Walks the four transfer-shape rules in ascending priority against one fixture, each
          call violating exactly one rule so the mapping error-code-to-rule is unambiguous,
          and finishes with the boundary case: 100000001 cents exceeds the 10 percent
          authority cap on a 1000000000 appropriation while exactly 100000000 is accepted.
        setup_note: "Two agencies in phase EXECUTION, three enacted appropriations across two fund types, so every mismatch shape is constructible."
        test_recipe:
          setup:
            - "Agencies DOH and DOT; BudgetCycle 2027 in phase EXECUTION with ADOPTED GENERAL revenue of 10000000000 cents"
            - "DOH GENERAL Appropriation P100 enacted 1000000000 and DOH DEDICATED Appropriation P300 enacted 1000000000"
