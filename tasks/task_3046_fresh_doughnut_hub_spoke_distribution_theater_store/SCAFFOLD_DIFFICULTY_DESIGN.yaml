  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: maintenance_start_cancels_batch_recomputes_hub_then_posture
        grounds:
          - state_machines.EquipmentLine.OPERATIONAL_to_MAINTENANCE
          - state_machines.ProductionBatch.COMMITTED_to_CANCELLED
          - calculations.network_posture
        distinguishing_aspect: |
          Depth-3 cascade: maintenance/start on line (A) cancels COMMITTED batch (B);
          batch cancellation decrements Hub.committed_dozens_today (C); the hub
          mutation triggers network_posture recompute on Network (D). Each link is
          caused by the previous link, not by the original maintenance call.
        test_recipe:
          setup:
            - "Network N7, hub H7 (cap 500, region R7), line L7 OPERATIONAL"
            - "Batch B7 COMMITTED (planned 100) so Hub.committed_dozens_today == 100"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N7", display_name: "Net Seven" }
              as: NetworkAdmin
              captures: { n7: $.data.id }
            - call: "POST /networks/${n7}/hubs"
              payload: { hub_code: "H7", daily_capacity_dozens: 500, territory_region: "R7" }
              as: NetworkAdmin
              captures: { h7: $.data.id, h7_v: $.data.version }
            - call: "POST /networks/${n7}/hubs/${h7}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 100 }
              as: HubManager
              captures: { l7: $.data.id }
            - call: "POST /networks/${n7}/hubs/${h7}/batches"
              payload: { equipment_line_id: "${l7}", production_date: "2026-09-01", planned_dozens: 100 }
              as: HubManager
              captures: { b7: $.data.id }
            - call: "POST /networks/${n7}/hubs/${h7}/batches/${b7}/commit"
              payload: { expected_hub_version: "${h7_v}" }
              as: HubManager
          trigger:
            - call: "POST /networks/${n7}/hubs/${h7}/lines/${l7}/maintenance/start"
              payload: {}
              as: HubManager
          assert:
            - "EquipmentLine.${l7}.line_status == MAINTENANCE"
            - "ProductionBatch.${b7}.batch_status == CANCELLED (link A->B)"
            - "Hub.${h7}.committed_dozens_today == 0 (link B->C: 100 - 100)"
            - "Network.${n7}.network_posture == SUSPENDED (link C->D: hub left with zero OPERATIONAL/DEGRADED lines)"

      - name: dispute_threshold_suspends_door_then_halts_allocation
        grounds:
          - state_machines.StaleCredit.PROVISIONAL_to_DISPUTED
          - state_machines.Door.ACTIVE_to_SUSPENDED
          - state_machines.Shipment
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: disputing a third StaleCredit
          (A) increments Door.open_dispute_count (B); crossing the >= 3 threshold
          itself flips Door.door_status ACTIVE -> SUSPENDED (C) — a conditional
          cascade fired by the count mutation, not by the dispute call directly.
        test_recipe:
          setup:
            - "Network N8, hub H8 (cap 500, R8), line L8 OPERATIONAL; door D8 (SPOKE, FRANCHISE, R8, hub H8)"
            - "Batch B8 COMPLETED 60 dozen; route RT8 dispatched with stop S8 (window covers 09:00); three shipments SH8a/SH8b/SH8c of 20 each all DELIVERED 20"
            - "Three stale pulls of 4 dozen each created (PROVISIONAL); two already disputed (open_dispute_count == 2)"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N8", display_name: "Net Eight" }
              as: NetworkAdmin
              captures: { n8: $.data.id }
            - call: "POST /networks/${n8}/hubs"
              payload: { hub_code: "H8", daily_capacity_dozens: 500, territory_region: "R8" }
