  # ---------------------------------------------------------------------------
  # From Table 6 (Errors) — errors whose trigger lives in §1.8 are stubs
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_welder_not_qualified_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_WELDER_NOT_QUALIFIED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / weld_safety_over_double_booking
          rationale: "Asserted as the winning error of the safety-vs-constraint priority pair."
      - name: error_double_booked_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_WELDER_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / welder_window_half_open_overlap
          rationale: "Asserted on the overlapping 10:30-12:00 weld."
      - name: error_weight_tolerance_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_WEIGHT_OUT_OF_TOLERANCE]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / mill_receive_exactly_tolerance
          rationale: "Asserted on received 110001 vs ordered 100000."
      - name: error_load_overweight_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOAD_OVERWEIGHT]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / load_weight_exactly_capacity
          rationale: "Asserted on the 10001st pound."
      - name: error_laydown_conflict_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_LAYDOWN_SLOT_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / laydown_slot_buffered_date_conflict
          rationale: "Asserted on the 2-day-apart delivery."
      - name: error_drawing_not_approved_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DRAWING_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / piece_start_requires_drawing_approved
          rationale: "Asserted on the first start attempt; also exercised by corner start_fabrication_requires_approved_drawing."
      - name: error_job_not_fabricating_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_JOB_NOT_FABRICATING]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / sequence_release_requires_job_fabricating
          rationale: "Asserted on the first release attempt."
      - name: error_invalid_state_on_double_settle_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / settle_state_over_fiscal
          rationale: "Asserted as the winning error of the state-vs-fiscal priority pair."

      - name: settle_exceeding_billed_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_BACKCHARGE_EXCEEDS_EARNED]", "validations[priority=10]"]
        distinguishing_aspect: "With billed_to_date_cents == 0, settling an ACCEPTED backcharge for any positive amount fails with the fiscal error (the state is valid — only the fiscal rule fires)."
        test_recipe:
          setup: ["piece SHIPPED; fix approved; backcharge ACCEPTED; no billings"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job ER1", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jr1: $.data.id } }
            - { call: "POST /jobs/${jr1}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jr1}", drawing_number: "D-1" }, as: DETAILER, captures: { dr1: $.data.id } }
            - { call: "POST /shop-drawings/${dr1}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dr1}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jr1}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jr1}", seq_number: 1 }, as: FOREMAN, captures: { sr1: $.data.id } }
            - { call: "POST /erection-sequences/${sr1}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jr1}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mr1: $.data.id } }
            - { call: "POST /mill-orders/${mr1}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jr1}", piece_mark: "P1", weight_lbs: 1000, drawing_id: "${dr1}", sequence_id: "${sr1}" }, as: FOREMAN, captures: { pr1: $.data.id } }
            - { call: "POST /pieces/${pr1}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${jr1}", kind: "FINAL_PIECE", piece_id: "${pr1}" }, as: QC_INSPECTOR, captures: { ir1: $.data.id } }
            - { call: "POST /inspections/${ir1}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${jr1}", load_number: "L-1", laydown_slot: "Y-ER1", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { lr1: $.data.id } }
            - { call: "POST /shipping-loads/${lr1}/lines", payload: { piece_id: "${pr1}" }, as: FOREMAN }
            - { call: "POST /shipping-loads/${lr1}/ship", as: FOREMAN }
            - { call: "POST /field-fixes", payload: { job_id: "${jr1}", piece_id: "${pr1}", description: "Ream hole", repair_lines: [ { labor_hours: 1, labor_rate_cents: 100, material_cents: 0 } ] }, as: FOREMAN, captures: { fr1: $.data.id } }
            - { call: "POST /field-fixes/${fr1}/approve", as: GC_PM }
            - { call: "GET /backcharges", payload: { field_fix_id: "${fr1}" }, as: GC_PM, captures: { br1: "$.data[0].id" } }
            - { call: "POST /backcharges/${br1}/respond", payload: { response: "ACCEPT" }, as: GC_PM }
          trigger:
            - { call: "POST /backcharges/${br1}/settle", payload: { settled_amount_cents: 999999 }, as: FABRICATOR_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_BACKCHARGE_EXCEEDS_EARNED (0 + 999999 > billed_to_date_cents 0)"
            - "Backcharge.${br1}.status remains ACCEPTED"

      - name: inspection_target_shape_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSPECTION_TARGET_INVALID]", "entities.Inspection.fields.kind"]
        distinguishing_aspect: "WELD_VISUAL without weld_id fails with ERR_INSPECTION_TARGET_INVALID; the kind dictates the required target shape."
        test_recipe:
          setup: ["job exists"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job ER2", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jr2: $.data.id } }
          trigger:
            - { call: "POST /inspections", payload: { job_id: "${jr2}", kind: "WELD_VISUAL" }, as: QC_INSPECTOR, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSPECTION_TARGET_INVALID"

      - name: duplicate_sequence_number_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEQUENCE_NUMBER_NOT_UNIQUE]", "entities.ErectionSequence.fields.seq_number"]
        distinguishing_aspect: "Second sequence with seq_number 1 in the same job fails; the same number in another job is fine."
        test_recipe:
          setup: ["job with sequence 1"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job ER3", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jr3: $.data.id } }
            - { call: "POST /erection-sequences", payload: { job_id: "${jr3}", seq_number: 1 }, as: FOREMAN }
          trigger:
            - { call: "POST /erection-sequences", payload: { job_id: "${jr3}", seq_number: 1 }, as: FOREMAN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SEQUENCE_NUMBER_NOT_UNIQUE"

      - name: duplicate_load_number_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOAD_NUMBER_NOT_UNIQUE]", "entities.ShippingLoad.fields.load_number"]
        distinguishing_aspect: "Second load with load_number L-1 in the same job fails."
        test_recipe:
          setup: ["job with load L-1"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job ER4", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jr4: $.data.id } }
            - { call: "POST /shipping-loads", payload: { job_id: "${jr4}", load_number: "L-1", laydown_slot: "Y-ER4", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN }
          trigger:
            - { call: "POST /shipping-loads", payload: { job_id: "${jr4}", load_number: "L-1", laydown_slot: "Y-ER4B", delivery_date: "2026-09-05", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LOAD_NUMBER_NOT_UNIQUE"

      - name: duplicate_drawing_number_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DRAWING_NOT_UNIQUE]", "entities.ShopDrawing.fields.drawing_number"]
        distinguishing_aspect: "Creating revision 1 of an existing drawing_number in the same job fails; revisions beyond 1 come only from revise."
        test_recipe:
          setup: ["job with drawing D-1 rev 1"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job ER5", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jr5: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${jr5}", drawing_number: "D-1" }, as: DETAILER }
          trigger:
            - { call: "POST /shop-drawings", payload: { job_id: "${jr5}", drawing_number: "D-1" }, as: DETAILER, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DRAWING_NOT_UNIQUE"

      - name: mill_order_on_estimating_job_rejected
        claim_type: violation_to_error
        grounds: ["state_machines.MillOrder", "errors[ERR_INVALID_STATE]", "validations[priority=6]"]
        distinguishing_aspect: "Placing a mill order while the job is still ESTIMATING fails with ERR_INVALID_STATE — material cannot be ordered before award."
        test_recipe:
          setup: ["job ESTIMATING"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job ER6", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jr6: $.data.id } }
          trigger:
            - { call: "POST /mill-orders", payload: { job_id: "${jr6}", material_grade: "A36", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  # From Table 7 (RBAC)
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: inspector_decide_drawing_forbidden
        claim_type: role_denial
        grounds: ["roles", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "QC_INSPECTOR calling the EOR-exclusive decide endpoint is rejected with ERR_FORBIDDEN."
        test_recipe:
          setup: ["drawing SUBMITTED"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job RB1", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jrb1: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${jrb1}", drawing_number: "D-1" }, as: DETAILER, captures: { drb1: $.data.id } }
            - { call: "POST /shop-drawings/${drb1}/submit", as: DETAILER, as_user_id: "det-1" }
          trigger:
            - { call: "POST /shop-drawings/${drb1}/decide", payload: { decision: "APPROVE" }, as: QC_INSPECTOR, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: welder_cannot_weld_for_other_welder
        claim_type: role_denial
        grounds: ["roles", "errors[ERR_FORBIDDEN]", "entities.Weld.fields.welder_id"]
        distinguishing_aspect: "A WELDER caller whose X-User-ID does not equal the payload welder_id is rejected with ERR_FORBIDDEN — entity_backed identity enforcement."
        test_recipe:
          setup: ["piece IN_SHOP; two ACTIVE welders WA and WB"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job RB2", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jrb2: $.data.id } }
            - { call: "POST /jobs/${jrb2}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jrb2}", drawing_number: "D-1" }, as: DETAILER, captures: { drb2: $.data.id } }
            - { call: "POST /shop-drawings/${drb2}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${drb2}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jrb2}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jrb2}", seq_number: 1 }, as: FOREMAN, captures: { srb2: $.data.id } }
            - { call: "POST /erection-sequences/${srb2}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jrb2}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mrb2: $.data.id } }
            - { call: "POST /mill-orders/${mrb2}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jrb2}", piece_mark: "P1", weight_lbs: 800, drawing_id: "${drb2}", sequence_id: "${srb2}" }, as: FOREMAN, captures: { prb2: $.data.id } }
            - { call: "POST /pieces/${prb2}/start", as: FOREMAN }
            - { call: "POST /welders", payload: { full_name: "Welder A", qual_process: "FCAW", qual_expires_on: "2027-01-01" }, as: FABRICATOR_ADMIN, captures: { wa: $.data.id } }
            - { call: "POST /welders", payload: { full_name: "Welder B", qual_process: "FCAW", qual_expires_on: "2027-01-01" }, as: FABRICATOR_ADMIN, captures: { wb: $.data.id } }
          trigger:
            - { call: "POST /welds", payload: { piece_id: "${prb2}", welder_id: "${wb}", process: "FCAW", weld_date: "2026-08-01", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z" }, as: WELDER, as_user_id: "${wa}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (caller WA may not log welds as WB)"

      - name: gc_pm_cannot_create_pieces
        claim_type: role_denial
        grounds: ["roles", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "GC_PM calling the FOREMAN-exclusive piece creation is rejected with ERR_FORBIDDEN — peer roles own disjoint resource types."
        test_recipe:
          setup: ["job with drawing and sequence"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job RB3", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jrb3: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${jrb3}", drawing_number: "D-1" }, as: DETAILER, captures: { drb3: $.data.id } }
            - { call: "POST /erection-sequences", payload: { job_id: "${jrb3}", seq_number: 1 }, as: FOREMAN, captures: { srb3: $.data.id } }
          trigger:
            - { call: "POST /pieces", payload: { job_id: "${jrb3}", piece_mark: "P1", weight_lbs: 800, drawing_id: "${drb3}", sequence_id: "${srb3}" }, as: GC_PM, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN"

  # ---------------------------------------------------------------------------
  # Cross-cutting complexity layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_layer_covered
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[drawing-revise-stale-version]", "concurrency_rules[billing-create-stale-job]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / settle_state_over_fiscal
          rationale: "OCC stale-version behavior is asserted by corner instances occ_stale_drawing_revise_rejected and occ_stale_billing_rejected (412 paths); both rules exercised."
      - name: cascade_layer_covered
        claim_type: cascading_side_effects
        grounds: ["state_machines.ShopDrawing.SUBMITTED_to_APPROVED", "state_machines.FieldFix.PRICED_to_APPROVED"]
        excluded_because:
          difficulty_instance: transitive_cascade / drawing_supersede_load_cascade
          rationale: "Depth-3 supersede cascade asserted there; depth-2 fix-approve cascade asserted in field_fix_approve_backcharge_cascade."
      - name: version_pinning_layer_covered
        claim_type: version_pinning
        grounds: ["entities.Piece.fields.drawing_id", "entities.Piece.fields.stale_revision"]
        excluded_because:
          difficulty_instance: transitive_cascade / drawing_supersede_load_cascade
          rationale: "Stale-revision flagging on supersede asserted there; start-blocking on stale pieces asserted in corner stale_piece_start_rejected."

  # ---------------------------------------------------------------------------
  # Consistency model (immediate)
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: mutation_visible_in_same_response
        claim_type: immediate_consistency
        grounds: ["complexity_profile", "state_machines.ShopDrawing.DRAFT_to_SUBMITTED"]
        distinguishing_aspect: "The submit response itself carries status SUBMITTED and submitted_by_user_id det-1 — no re-read needed (immediate consistency)."
        test_recipe:
          setup: ["job with DRAFT drawing"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job CM1", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jcm1: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${jcm1}", drawing_number: "D-1" }, as: DETAILER, captures: { dcm1: $.data.id } }
          trigger:
            - { call: "POST /shop-drawings/${dcm1}/submit", as: DETAILER, as_user_id: "det-1", captures: { st: $.data.status, sub: $.data.submitted_by_user_id } }
          assert:
            - "st == SUBMITTED in the mutation response"
            - "sub == det-1 in the mutation response"
