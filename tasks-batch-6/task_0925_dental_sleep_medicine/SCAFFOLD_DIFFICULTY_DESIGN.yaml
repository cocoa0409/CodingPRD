  - rule_id: compensating_invariant
    instances:

      - name: advancement_conservation_across_held_and_reduced
        grounds:
          - calculations.cumulative_advancement
          - calculations.titration_applied_increment
          - state_machines.TitrationVisit.SCHEDULED_to_HELD
          - state_machines.TitrationVisit.HELD_to_REDUCED
          - entities.Appliance.fields.current_advancement_mm
        distinguishing_aspect: |
          Conserved quantity one is millimetres of protrusion. The forward action (+1.00 mm) and its
          compensating action (a SEVERE reduction of -0.50 mm), with a zero-valued HELD leg in between,
          must leave current_advancement_mm exactly equal to starting_advancement_mm plus the sum of
          every APPLIED and REDUCED increment: 4.75 + 1.00 - 0.50 = 5.25, with the HELD leg
          contributing exactly 0.00 and never entering applied_visit_count.
        test_recipe:
          setup:
            - "A delivered appliance, starting_advancement_mm 4.75, one applied visit of +1.00 mm on 2026-06-01."
            - "A second SCHEDULED visit requesting 1.00 mm."
