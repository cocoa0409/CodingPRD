            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { q1: $.data.id } }
            - { call: "POST /referrals/${q1}/accept", as: ReferralCoordinator }
