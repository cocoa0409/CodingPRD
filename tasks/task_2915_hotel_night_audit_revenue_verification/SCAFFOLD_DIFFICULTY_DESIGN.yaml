              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd_p1_id: "$.data.id", period_aug_id: "$.data.accounting_period_id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd_p1_id}", confirmation_code: "CF-TIE1", guest_name: "Wen Ivar", room_number: "1101", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_tie_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_tie_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd_p1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd_p1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd_p1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "GET /night-audit/business-dates/${bd_p1_id}"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bdp_v1: "$.data.version" }
            - call: "POST /night-audit/revenue-reports"
              payload: { business_date_id: "${bd_p1_id}", pace_basis: "CALENDAR_ALIGNED", recipient_role_list: ["Controller"], expected_business_date_version: "${bdp_v1}" }
              as: RevenueManager
              as_user_id: "u_rm_1"
              captures: { rpt_tie_id: "$.data.id" }
            - call: "POST /night-audit/revenue-reports/${rpt_tie_id}/distribute"
              payload: {}
              as: RevenueManager
              as_user_id: "u_rm_1"
            - call: "POST /night-audit/business-dates/${bd_p1_id}/balance"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd_p1_id}/close"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-02", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
