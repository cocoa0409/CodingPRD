              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Iris Vega", badge_number: "B-101", rank: "FIELD_INSPECTOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { insp1_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Sam Cole", badge_number: "B-200", rank: "SUPERVISOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "HARBORAGE", reporter_type: "RESIDENT", description: "Burrows along the alley fence", reported_severity: "HIGH" }
              as: IntakeClerk
              captures: { comp_id: $.data.id }
            - call: "POST /vector-control/complaints/${comp_id}/triage"
              payload: { severity: "HIGH" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /vector-control/inspections"
              payload: { kind: "INITIAL", complaint_id: "${comp_id}", officer_id: "${insp1_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T10:00:00Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/inspections/${visit_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "POST /vector-control/inspections/${visit_id}/assessments"
              payload: { harborage_score: 8, attractant_score: 7, sanitation_score: 6, burrow_count: 4 }
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:45:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /vector-control/inspections/${visit_id}/complete"
              payload: { result: "VIOLATION_FOUND" }
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "GET /vector-control/complaints/${comp_id}"
              as: IntakeClerk
              captures: { cs: $.data.status }
            - call: "GET /vector-control/properties/${prop_id}"
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { cf: $.data.chronic_flag }
            - call: "GET /vector-control/zones/${zone_id}"
              as: ProgramAdmin
              captures: { cpc: $.data.chronic_property_count }
          assert:
            - "Complaint.${comp_id}.status == INSPECTED on the very first read after the completion"
            - "Property.${prop_id}.chronic_flag == true and chronic_score == 83.50 on the very first read"
            - "Zone.${zone_id}.chronic_property_count == 1 on the very first read"
            - "Repeating all three reads returns identical values (no eventual settling)"

  - section: errors
    instances:
      - name: corner_error_order_not_served_on_reinspection
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ORDER_NOT_SERVED]
        excluded_because:
          difficulty_instance: order_not_served_outranks_reinspection_too_early
          rationale: "Asserted as the winning error of the named priority-conflict instance."

      - name: corner_error_complaint_not_triaged_on_scheduling
        claim_type: violation_to_error
        grounds:
          - errors[ERR_COMPLAINT_NOT_TRIAGED]
        excluded_because:
          difficulty_instance: initial_inspection_requires_triaged_complaint
          rationale: "Asserted as the failure path of the named cross-entity dependency instance."

      - name: corner_error_order_not_abated_on_invoice
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ORDER_NOT_ABATED]
        excluded_because:
          difficulty_instance: cost_recovery_invoice_requires_city_abated_order
          rationale: "Asserted as the failure path of the named cross-entity dependency instance."

      - name: corner_error_self_approval_and_approval_limit
        claim_type: priority_ordering
        grounds:
          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
          - errors[ERR_APPROVAL_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: self_approval_outranks_approval_limit
          rationale: "Both codes are asserted in sequence by the named priority-conflict instance."

      - name: corner_error_officer_schedule_conflict
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFICER_SCHEDULE_CONFLICT]
        excluded_because:
          difficulty_instance: officer_calendar_collides_inside_travel_buffer
          rationale: "Asserted as the rejection arm of the named overlap instance."

      - name: corner_error_property_inspection_overlap
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROPERTY_INSPECTION_OVERLAP]
        excluded_because:
          difficulty_instance: property_calendar_allows_touching_windows
          rationale: "Asserted as the rejection arm of the named overlap instance."

