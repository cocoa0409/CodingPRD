          - "errors[ERR_HOLD_INVALID_STATE]"
          - "errors[ERR_SUBSTITUTION_INVALID_STATE]"
        distinguishing_aspect: "Each remaining machine's invalid-from rejection: publish a PUBLISHED quote; finalize a FINAL assessment; clear a DRAFT document; release a RELEASED hold; approve an APPLIED substitution."
