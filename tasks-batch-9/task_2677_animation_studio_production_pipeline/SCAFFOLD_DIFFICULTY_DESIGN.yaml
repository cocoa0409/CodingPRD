scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual-variant calculations on different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: shot_bcwp_stage_weight_vs_hours_progress
        grounds:
          - calculations.shot_earned_value
          - entities.Shot.fields.bcwp_cents
          - entities.ShotStageTask.fields.actual_hours
          - endpoints["GET /studio/shots/{id}/earned-value"]
        distinguishing_aspect: |
          Cost-accounting on the Shot domain: with LAYOUT approved and 12 of 50 budgeted hours
          logged, STAGE_WEIGHT earns 100000 cents while HOURS_PROGRESS earns 240000 cents from the
          identical data, so cpi moves from 0.9259 to 2.2222 on the same row.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE with a single SCRIPT gate approved"
            - "Shot AD01_010_0010 has budget 1,000,000 cents and the planned window 2026-08-01 -> 2026-09-30"
            - "its LAYOUT stage task is APPROVED with 12.0 actual hours against the default 10.0 budgeted hours per stage (50.0 for the shot)"
            - "the logical clock stands at 2026-08-16T00:00:00Z, exactly a quarter through the planned window"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, approved_color_spaces: ["ACEScg", "Rec709"], gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z", difficulty_factor: 1.25 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { t_layout_id: "$.data[0].id" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/stage-tasks/${t_layout_id}/log-hours"
              payload: { hours: 12.0 }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/stage-tasks/${t_layout_id}/submit"
              payload: {}
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/stage-tasks/${t_layout_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Supervisor
              as_user_id: "u-sup-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
          trigger:
            - call: "GET /studio/shots/${shot_id}/earned-value"
              as: Supervisor
              as_user_id: "u-sup-01"
              captures: { ev_default_bcwp: "$.data.bcwp_cents", ev_default_cpi: "$.data.cpi", ev_default_variant: "$.data.variant" }
            - call: "GET /studio/shots/${shot_id}/earned-value?variant=HOURS_PROGRESS"
              as: Supervisor
              as_user_id: "u-sup-01"
              captures: { ev_hours_bcwp: "$.data.bcwp_cents", ev_hours_cpi: "$.data.cpi" }
          assert:
            - "${ev_default_variant} == STAGE_WEIGHT (variant defaults to STAGE_WEIGHT when the query parameter is omitted)"
            - "${ev_default_bcwp} == 100000"
            - "${ev_hours_bcwp} == 240000"
            - "${ev_default_cpi} == 0.9259"
            - "${ev_hours_cpi} == 2.2222"
            - "both variants report bcws_cents == 250000 and acwp_cents == 108000"
            - "GET /studio/shots/${shot_id} reports Shot.bcwp_cents == 100000, Shot.cpi == 0.9259, Shot.spi == 0.4000 (the persisted rollup uses STAGE_WEIGHT)"
      - name: partner_quality_rolling_window_vs_lifetime
        grounds:
          - calculations.partner_quality_score
          - entities.OutsourcePartner.fields.quality_score_rolling
          - entities.OutsourcePartner.fields.quality_score_lifetime
          - state_machines.OutsourcePackage.DELIVERED_to_QC_FAILED
        distinguishing_aspect: |
          Risk scoring on the OutsourcePartner domain — a different entity domain from the Shot cost
          accounting above: the same two QC decisions yield quality_score_rolling 90.00 (the 100-day-old
          TIER3 failure falls outside the 90-day window) and quality_score_lifetime 56.67 (it is kept and
          weighted 2.0).
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE with one shot and its five NOT_STARTED stage tasks"
            - "Partner Northwind Animation is APPROVED at certification TIER3 with MFA enforced"
            - "package AD01-PKG-B (TIER3, quality_min_score 45.00) was QC-failed with score 40.00 while the clock stood at 2026-08-01"
            - "package AD01-PKG-A (TIER1, quality_min_score 40.00) was QC-passed with score 90.00 while the clock stood at 2026-10-30"
            - "the clock then stands at 2026-11-09, making the failure 100 days old and the pass 10 days old"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              captures: { t_layout_id: "$.data[0].id", t_anim_id: "$.data[1].id" }
            - call: "POST /studio/outsource-partners"
              payload: { legal_name: "Northwind Animation", security_certification_level: "TIER3", mfa_enforced: true, watermark_required: false }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
              captures: { partner_id: "$.data.id" }
            - call: "POST /studio/outsource-partners/${partner_id}/status"
              payload: { status: "APPROVED" }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
            - call: "POST /studio/outsource-packages"
              payload: { production_id: "${prod_id}", partner_id: "${partner_id}", package_code: "AD01-PKG-B", security_tier: "TIER3", fee_cents: 100000, stage_task_ids: ["${t_anim_id}"], quality_min_score: 45.00 }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
              captures: { pkg_b_id: "$.data.id" }
            - call: "POST /studio/outsource-packages/${pkg_b_id}/issue"
              payload: {}
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
            - call: "POST /studio/outsource-packages/${pkg_b_id}/accept"
              payload: {}
              as: PartnerRepresentative
              as_user_id: "${partner_id}"
            - call: "POST /studio/outsource-packages/${pkg_b_id}/deliver"
              payload: { watermark_applied: false }
              as: PartnerRepresentative
              as_user_id: "${partner_id}"
            - call: "POST /studio/outsource-packages/${pkg_b_id}/qc-decision"
              payload: { decision: "FAIL", qc_score: 40.00 }
              as: Supervisor
              as_user_id: "u-sup-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/outsource-packages"
              payload: { production_id: "${prod_id}", partner_id: "${partner_id}", package_code: "AD01-PKG-A", security_tier: "TIER1", fee_cents: 100000, stage_task_ids: ["${t_layout_id}"], quality_min_score: 40.00 }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
              captures: { pkg_a_id: "$.data.id" }
            - call: "POST /studio/outsource-packages/${pkg_a_id}/issue"
              payload: {}
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
            - call: "POST /studio/outsource-packages/${pkg_a_id}/accept"
              payload: {}
              as: PartnerRepresentative
              as_user_id: "${partner_id}"
            - call: "POST /studio/outsource-packages/${pkg_a_id}/deliver"
              payload: { watermark_applied: false }
              as: PartnerRepresentative
              as_user_id: "${partner_id}"
            - call: "POST /studio/outsource-packages/${pkg_a_id}/qc-decision"
              payload: { decision: "PASS", qc_score: 90.00 }
              as: Supervisor
              as_user_id: "u-sup-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-09T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
          trigger:
            - call: "GET /studio/outsource-partners/${partner_id}"
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
              captures: { q_rolling: "$.data.quality_score_rolling", q_lifetime: "$.data.quality_score_lifetime", q_count: "$.data.qc_decided_package_count" }
          assert:
            - "${q_rolling} == 90.00"
            - "${q_lifetime} == 56.67"
            - "${q_count} == 2"
            - "the two variants differ on identical decision history because ROLLING_90D excludes the 100-day-old TIER3 failure that LIFETIME keeps at weight 2.0"

  # =========================================================================
  # Rule 2 — combinatorial formulas in different modes (b), (a), (c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: render_cost_rounds_per_frame_before_multiplying
        grounds:
          - calculations.render_job_cost
          - entities.RenderJob.fields.cost_per_frame_cents
          - entities.RenderJob.fields.estimated_cost_cents
          - state_machines.RenderJob.null_to_RESERVED
        distinguishing_aspect: |
          Mode (b) nested rounding: 3 cores at 175 cents per core-hour and 50 s/frame gives a raw
          7.291666... cents per frame, so rounding per frame first yields 7 * 120 = 840 cents while
          summing first and rounding once would yield 875 — the scaffold pins the per-frame order.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE with shot AD01_010_0010 and its LAYOUT task IN_PROGRESS"
            - "render pool FARM-A has 100 cores at 175 cents per core-hour and no reservations"
            - "the logical clock stands at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              captures: { t_layout_id: "$.data[0].id" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/render-pools"
              payload: { name: "FARM-A", total_cores: 100, cost_per_core_hour_cents: 175 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { pool_id: "$.data.id" }
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_v0: "$.data.version" }
          trigger:
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${t_layout_id}", priority: "NORMAL", requested_cores: 3, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T06:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v0}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { job_id: "$.data.id", job_cpf: "$.data.cost_per_frame_cents", job_est: "$.data.estimated_cost_cents", job_cch: "$.data.committed_core_hours" }
          assert:
            - "${job_cpf} == 7"
            - "${job_est} == 840"
            - "${job_est} != 875 (summing unrounded per-frame values and rounding once is the forbidden order)"
            - "${job_cch} == 18.00"
            - "GET /studio/render-pools/${pool_id} reports committed_core_hours == 18.00, reserved_job_count == 1, version == 2"
            - "GET /studio/shots/${shot_id} reports render_cost_committed_cents == 840"
            - "GET /studio/productions/${prod_id} reports render_committed_cents == 840 and render_actual_cents == 0"
      - name: render_admission_tiered_headroom_nonlinear
        grounds:
          - calculations.render_pool_admission
          - entities.RenderPool.fields.total_cores
          - validations[priority=33]
          - errors[ERR_RENDER_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Mode (a) non-linear interaction of three inputs — total_cores, the priority-keyed headroom
          percentage and the peak concurrent commitment: with 60 of 100 cores already reserved a NORMAL
          request is capped at 30 cores while a HIGH request over the same window is capped at 40, so
          31 NORMAL and 41 HIGH are both rejected and 40 HIGH is admitted.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE with shot AD01_010_0010 and its LAYOUT task IN_PROGRESS"
            - "render pool FARM-A has 100 cores at 175 cents per core-hour"
            - "one NORMAL job already holds 60 cores over 2026-08-10 00:00 -> 06:00"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              captures: { t_layout_id: "$.data[0].id" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/render-pools"
              payload: { name: "FARM-A", total_cores: 100, cost_per_core_hour_cents: 175 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { pool_id: "$.data.id" }
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_v0: "$.data.version" }
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${t_layout_id}", priority: "NORMAL", requested_cores: 60, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T06:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v0}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { job_base_id: "$.data.id" }
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_v1: "$.data.version" }
          trigger:
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${t_layout_id}", priority: "NORMAL", requested_cores: 31, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T06:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v1}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${t_layout_id}", priority: "HIGH", requested_cores: 41, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T06:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v1}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${t_layout_id}", priority: "HIGH", requested_cores: 40, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T06:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v1}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { job_high_id: "$.data.id", job_high_status: "$.data.status" }
          assert:
            - "the 31-core NORMAL request returns 409 with error_id ERR_RENDER_CAPACITY_EXCEEDED (ceiling 100 - ceil(100*0.10) = 90, peak 60, available 30)"
            - "the 41-core HIGH request returns 409 with error_id ERR_RENDER_CAPACITY_EXCEEDED (ceiling 100 - 0 = 100, available 40)"
            - "${job_high_status} == RESERVED for the 40-core HIGH request"
            - "GET /studio/render-pools/${pool_id} reports committed_core_hours == 600.00 and reserved_job_count == 2"
            - "the two rejected requests left RenderPool.version unchanged at ${pool_v1}; only the admitted job advanced it"
      - name: production_overhead_tier_pinned_to_direct_committed
        grounds:
          - calculations.production_budget_position
          - entities.Production.fields.overhead_fee_cents
          - entities.Production.fields.total_committed_cents
          - state_machines.OutsourcePackage.ISSUED_to_IN_PROGRESS
        distinguishing_aspect: |
          Mode (c) pinned evaluation order on a circular-looking dependency: overhead is a tier keyed on
          the pre-overhead direct figure, so a 4,900,000-cent direct commitment takes 0.15 for a total of
          5,635,000 — keying the tier on the resulting total (which lands in the 0.12 band) would give
          5,488,000.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE with budget 100,000,000 cents and contingency 0.10, so the spend ceiling is 110,000,000"
            - "Partner Northwind Animation is APPROVED at certification TIER1"
            - "package AD01-PKG-A carries fee 4,900,000 cents, is issued, and nobody has logged any hours or settled any render job"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              captures: { t_layout_id: "$.data[0].id" }
            - call: "POST /studio/outsource-partners"
              payload: { legal_name: "Northwind Animation", security_certification_level: "TIER1", mfa_enforced: false, watermark_required: false }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
              captures: { partner_id: "$.data.id" }
