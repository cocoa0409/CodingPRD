              payload: { crs_cycle_id: "${cycle_id}", target_property_count: 1 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_OUTREACH_TARGET_BELOW_ANALYZED'"
            - "RepetitiveLossArea.${area_id}.property_count == 2"
            - "RepetitiveLossArea.${area_id}.outreach_status == NOT_STARTED"
            - "RepetitiveLossArea.${area_id}.target_property_count == 0"
            - "RepetitiveLossArea.${area_id}.status == DESIGNATED"

      - name: delivery_increment_beyond_the_target_is_rejected
        claim_type: aggregate_validation
        grounds:
          - validations.priority_90
          - errors.ERR_DELIVERY_EXCEEDS_TARGET
          - endpoints."POST /floodplain/repetitive-loss-areas/{areaId}/record-outreach-delivery"
        distinguishing_aspect: |
          Each increment is individually plausible, but 2 + 2 exceeds the target of 3, so the
          second delivery is refused with 422 ERR_DELIVERY_EXCEEDS_TARGET and coverage_pct
          stays at the 66.67 the first delivery produced instead of clamping to 100.00.
        test_recipe:
          setup:
            - "Community, EFFECTIVE panel, one parcel in RLA-1; area analyzed and DESIGNATED; CrsCycle 2026 OPEN."
            - "Outreach launched with target_property_count 3 and one delivery of 2 already recorded."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas"
              payload: { community_id: "${comm_id}", area_code: "RLA-1", boundary_description: "Bayou bend north bank" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { area_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/analyze"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/designate"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/crs-cycles"
              payload: { community_id: "${comm_id}", cycle_year: 2026, cycle_start_date: "2026-01-01T00:00:00Z", cycle_end_date: "2026-12-31T00:00:00Z", due_at: "2027-03-01T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { cycle_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/outreach"
              payload: { crs_cycle_id: "${cycle_id}", target_property_count: 3 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/record-outreach-delivery"
              payload: { delivered_increment: 2 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/record-outreach-delivery"
              payload: { delivered_increment: 2 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_DELIVERY_EXCEEDS_TARGET'"
            - "RepetitiveLossArea.${area_id}.delivered_count == 2"
            - "RepetitiveLossArea.${area_id}.coverage_pct == 66.67"
            - "RepetitiveLossArea.${area_id}.outreach_status == IN_PROGRESS"

      - name: issue_gate_priority_pair_between_state_and_suspension
        claim_type: priority_ordering
        grounds:
          - validations.priority_40
          - validations.priority_56
        excluded_because:
          difficulty_instance: issue_state_precondition_outranks_community_suspension_gate
          rationale: |
            That §1.8 priority_pair_validation_conflict instance violates the priority-40 state
            gate and the priority-56 suspension gate in one call and asserts
            ERR_PERMIT_NOT_APPROVED, which is exactly this ordering claim.

      - name: appeal_decision_priority_pair_between_state_and_duties
        claim_type: priority_ordering
        grounds:
          - validations.priority_40
          - validations.priority_70
        excluded_because:
          difficulty_instance: appeal_decision_state_precondition_outranks_segregation_of_duties
          rationale: |
            That §1.8 instance already has the determining administrator attempt a decision on
            a case that is not APPEALED, proving ERR_APPEAL_NOT_PENDING wins over
            ERR_SEGREGATION_OF_DUTIES.

      - name: permit_submit_priority_pair_between_ownership_and_state
        claim_type: priority_ordering
        grounds:
          - validations.priority_15
          - validations.priority_40
        excluded_because:
          difficulty_instance: permit_submit_owner_check_outranks_state_precondition
          rationale: |
            That §1.8 instance submits an already ISSUED permit as the wrong PropertyOwner and
            asserts ERR_NOT_PROPERTY_OWNER, covering the priority-15 versus priority-40
            ordering.

      - name: cycle_submit_priority_pair_between_state_and_due_date
        claim_type: priority_ordering
        grounds:
          - validations.priority_40
          - validations.priority_62
        excluded_because:
          difficulty_instance: cycle_submit_state_precondition_outranks_past_due_window
          rationale: |
            That §1.8 instance re-submits an already SUBMITTED cycle after its due_at has
            passed and asserts ERR_CYCLE_NOT_OPEN rather than ERR_CYCLE_PAST_DUE.

      - name: panel_interval_geometry_is_enforced_on_filing
        claim_type: temporal_validation
        grounds:
          - validations.priority_73
          - errors.ERR_PANEL_EFFECTIVE_DATE_OVERLAP
        excluded_because:
          difficulty_instance: panel_effective_date_must_be_strictly_after_incumbent
          rationale: |
            The half-open panel geometry — a revision sharing the incumbent's effective_date is
            rejected while one day later is accepted — is that §1.8 resource_temporal_overlap
            instance's whole subject.

      - name: cycle_interval_geometry_treats_shared_endpoints_as_overlap
        claim_type: temporal_validation
        grounds:
          - validations.priority_74
          - errors.ERR_CYCLE_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: crs_cycle_windows_are_closed_so_shared_endpoint_is_an_overlap
          rationale: |
            That §1.8 resource_temporal_overlap instance contrasts a cycle starting on the
            incumbent's end date (rejected) with one starting the next day (accepted), which is
            the closed-interval claim in full.

      - name: sweep_interval_geometry_expands_by_the_buffer
        claim_type: temporal_validation
        grounds:
          - validations.priority_75
          - errors.ERR_SWEEP_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: inspection_sweep_windows_conflict_after_buffer_expansion
          rationale: |
            That §1.8 instance builds two sweeps that are disjoint on their raw windows but
            intersect once SWEEP_BUFFER_DAYS 7 is applied, which is the only interesting case
            of this rule.

      - name: approval_requires_a_resolved_determination_case
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_54
          - errors.ERR_DETERMINATION_REQUIRED
        excluded_because:
          difficulty_instance: permit_approval_requires_resolved_determination_case
          rationale: |
            That §1.8 cross_entity_state_dependency instance approves an improvement permit at
            or above the 50.00% cost ratio with the case still OPEN (refused) and again after
            the determination (allowed), covering both halves of this rule.

  # ===========================================================================
  # Guide section 5 — From Table 5 (Endpoints)
  # Rows walked: Standard CRUD, Action endpoint, Bulk action,
  # Cross-reference link, Computed read, Conditional action.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: patch_of_adopted_standards_leaves_issued_permits_on_their_snapshot
        claim_type: standard_crud
        grounds:
          - endpoints."PATCH /floodplain/communities/{communityId}"
          - entities.DevelopmentPermit.fields.freeboard_applied_ft
        distinguishing_aspect: |
          Raising the adopted freeboard from 1.5 to 2.5 ft stamps standards_adopted_at at the
          logical clock and bumps the community version, but the already ISSUED permit keeps
          freeboard_applied_ft 1.5 and required_lowest_floor_elevation_ft 13.5 — the update
          endpoint is deliberately not retroactive.
        test_recipe:
          setup:
            - "Canonical base fixture; permit ISSUED with determined_bfe_ft 12.0 and requirement 13.5."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "NEW_CONSTRUCTION", declared_project_cost_usd: 20000.00, proposed_lowest_floor_elevation_ft: 20.0 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /floodplain/permits/${permit_id}/submit"
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /floodplain/permits/${permit_id}/review"
              payload: { decision: "APPROVE" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/permits/${permit_id}/issue"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "PATCH /floodplain/communities/${comm_id}"
              payload: { freeboard_ft: 2.5 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 200"
            - "Community.${comm_id}.freeboard_ft == 2.5"
            - "Community.${comm_id}.cumulative_period_years == 10"
            - "Community.${comm_id}.standards_adopted_at == '2026-08-01T00:00:00Z'"
            - "Community.${comm_id}.version == 2"
            - "DevelopmentPermit.${permit_id}.freeboard_applied_ft == 1.5"
            - "DevelopmentPermit.${permit_id}.required_lowest_floor_elevation_ft == 13.5"
            - "DevelopmentPermit.${permit_id}.status == ISSUED"

      - name: sweep_of_a_community_without_eligible_structures_creates_nothing
        claim_type: bulk_action
        grounds:
          - endpoints."POST /floodplain/communities/{communityId}/inspection-sweep"
          - entities.PostDisasterInspection
        distinguishing_aspect: |
          The only structure sits behind an EFFECTIVE panel mapped zone X, which fails the
          special-flood-hazard-area filter, so the sweep still returns 201 with
          inspections_created 0 and an empty inspection_ids list rather than 404 or an error —
          the empty-set branch is a success, not a failure.
        test_recipe:
          setup:
            - "Community; EFFECTIVE panel with flood_zone X; one property and one structure behind it."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0300", suffix: "H", flood_zone: "X", effective_date: "2020-01-01T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_x_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_x_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_x_id}", parcel_id: "P-0900", mapped_area_code: "RLA-9", owner_name: "Dry Owner", owner_email: "dry@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_x_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_x_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 2001, market_value_usd: 150000.00, highest_adjacent_grade_ft: 30.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_x_id: $.data.id }
          trigger:
            - call: "POST /floodplain/communities/${comm_id}/inspection-sweep"
              payload: { declaration_code: "DR-4801", event_date: "2026-07-15T00:00:00Z", inspection_window_days: 30 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 201"
            - "data.inspections_created == 0"
            - "data.inspection_ids == []"
            - "data.deadline_at == '2026-08-14T00:00:00Z'"
            - "Structure.${struct_x_id}.compliance_status is unchanged"

      - name: sweep_schedules_both_structures_of_the_hazard_area_property
        claim_type: bulk_action
        grounds:
          - endpoints."POST /floodplain/communities/{communityId}/inspection-sweep"
          - calculations.derived_deadlines_and_loop_limits.constants.SWEEP_BUFFER_DAYS
        distinguishing_aspect: |
          The sweep is per structure, not per property: one AE property carrying two structures
          yields two SCHEDULED inspections in created_at order while the zone X property in the
          same community contributes none, so inspections_created is 2 rather than 1 or 3.
        test_recipe:
          setup:
            - "Community; EFFECTIVE AE panel with two structures on one parcel; EFFECTIVE zone X panel with one structure."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0300", suffix: "H", flood_zone: "X", effective_date: "2020-01-01T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_x_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_x_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_x_id}", parcel_id: "P-0900", mapped_area_code: "RLA-9", owner_name: "Dry Owner", owner_email: "dry@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_x_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_a_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "NON_RESIDENTIAL", pre_firm: true, construction_year: 1971, market_value_usd: 90000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_b_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_x_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 2001, market_value_usd: 150000.00, highest_adjacent_grade_ft: 30.0 }
              as: FloodplainAdministrator
