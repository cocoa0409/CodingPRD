  - section: consistency_model
    instances:
      - name: immediate_consistency_open_bay_count_visible_same_response
        claim_type: immediate
        grounds:
          - "entities.Shop.fields.open_bay_count"
          - "state_machines.Bay.OPEN_to_OCCUPIED"
        distinguishing_aspect: "open_bay_count reflects bay creation immediately: after creating two bays, GET /shops/{id} returns open_bay_count == 2 in the same request (no lag)."
        test_recipe:
          setup: ["Shop with two bays created."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
