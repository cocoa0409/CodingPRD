            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-04T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { s_closed: "$.data[0].status", s_outcome: "$.data[0].outcome" } }
