      - name: cancelling_an_already_cancelled_window_is_an_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.SurchargeWindow.status
          - validations[priority=22]  # ERR_WINDOW_NOT_IN_STATE
        distinguishing_aspect: |
          CANCELLED is terminal for a SurchargeWindow: a second cancel and an activate both
          return 409 ERR_WINDOW_NOT_IN_STATE, so no edge leaves the terminal state even
          though SCHEDULED -> CANCELLED and ACTIVE -> CANCELLED are both legal edges into it.
        test_recipe:
          setup:
            - "One SCHEDULED DEMAND window DEM-AUG covering [2026-08-01, 2026-08-15) at 150 per package exists; nothing else is needed."
          setup_api_calls:
            - call: "POST /surcharge-windows"
              payload: { code: "DEM-AUG", kind: "DEMAND", start_date: "2026-08-01", end_date: "2026-08-15", per_package_cents: 150 }
              as: CarrierAdmin
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /surcharge-windows/${w1}/cancel"
              payload: {}
              as: CarrierAdmin
              captures: { st1: $.data.status, v1: $.data.version }
            - call: "POST /surcharge-windows/${w1}/cancel"
              payload: {}
              as: CarrierAdmin
              captures: { err_cancel: $.data.error_id }
            - call: "POST /surcharge-windows/${w1}/activate"
              payload: {}
              as: CarrierAdmin
              captures: { err_activate: $.data.error_id }
          assert:
            - "The first cancel returns HTTP 200 with ${st1} == CANCELLED and ${v1} == 2"
            - "The second cancel returns HTTP 409 with ${err_cancel} == ERR_WINDOW_NOT_IN_STATE"
            - "The activate returns HTTP 409 with ${err_activate} == ERR_WINDOW_NOT_IN_STATE — a cancelled window can never be revived"
            - "SurchargeWindow.${w1}.version is still 2 — the two rejected calls did not bump the version"

      - name: a_verified_measurement_is_locked_against_further_scans
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Shipment.measurement_status.PENDING_SCAN_to_VERIFIED
          - validations[priority=23]  # ERR_MEASUREMENT_FINAL
        distinguishing_aspect: |
          VERIFIED is the terminal state of the measurement axis: after one MANUAL_REWEIGH,
          both a further AUTOMATED_DWS scan and a further MANUAL_REWEIGH return 409
          ERR_MEASUREMENT_FINAL with a correct expected_shipment_version, so the governing
          measurement can never be overwritten.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139) and ServiceLevel EXPRESS."
            - "Shipment 1Z-V-0001 declared 10 x 10 x 20 in at 30.0 lb, zone 2, is IN_TRANSIT and PENDING_SCAN."
