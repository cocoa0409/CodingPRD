      - name: training_coverage_rounding_then_threshold_mode_b
        grounds:
          - calculations.staff_training_coverage_ratio
          - calculations.school_posture_derivation
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins
          round(ratio*100, 2) BEFORE comparing to the 0.95 threshold (via
          staff_training_coverage_ratio feeding school_posture_derivation's
          training_gap input). Test exercises three ratios: 20/20 = 1.00
          (no gap), 20/21 ≈ 0.9524 → pct 95.24 (no gap; >= 0.95),
          20/22 ≈ 0.9091 → pct 90.91 (gap; < 0.95). The rounding step is
          observable: an implementation that compared the raw ratio to 0.95
          without intermediate rounding could disagree at fractional
          boundaries like 0.94999 (raw < 0.95 but rounded pct = 95.00).
          Distinct from mode (a) instance above.
        test_recipe:
          setup:
            - "School S2 with 20 active staff, all 20 trained (trained_at 2026-01-01, clock 2026-08-01 — well within 2-year expiry)"
            - "Expected: coverage_ratio = 20/20 = 1.0; coverage_pct = 100.00; training_gap_weight = 0"
            - "Then add a 21st staff member (untrained) → coverage_ratio = 20/21 ≈ 0.9524 → pct = 95.24; still no gap (>= 0.95)"
            - "Then add a 22nd staff member (untrained) → coverage_ratio = 20/22 ≈ 0.9091 → pct = 90.91; training_gap = 25"
