  # ==========================================================================
  # Section: consistency_model (immediate)
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: mutations_visible_in_same_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.POST /rate-sheets/{id}/submit"]
        distinguishing_aspect: "Immediate consistency: every mutation's result is fully visible in its own response body (status, version, computed fields) — no re-read required to observe the new state."
        test_recipe:
          setup: ["P-IC; DRAFT sheet (floor 0)"]
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "IC", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_ic: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_ic}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_ic: $.data.id } }
          trigger:
            - { call: "POST /rate-sheets/${s_ic}/submit", payload: {}, as: PricingAnalyst, captures: { ic_st: $.data.status, ic_v: $.data.version, ic_upd: $.data.updated_at } }
          assert:
            - "submit response itself shows status == COMMITTEE_REVIEW and version == 2 (mutation + derived fields in one response)"
