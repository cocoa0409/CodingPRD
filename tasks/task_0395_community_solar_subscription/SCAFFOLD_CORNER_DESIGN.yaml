        distinguishing_aspect: "With committed_kw 50, ceil(50*50)=2500 so cap = min(ROLLOVER_CAP_KWH 2000, 2500) = 2000; overproduction 10000 → rollover 2000, forfeited 8000 (ROLLOVER_CAP_KWH binds)."
