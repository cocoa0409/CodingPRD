  # ===========================================================================
  # RULE 2 — combinatorial_formula  (3 instances in three DIFFERENT §0.5 modes:
  #          (a) nested conditional branching, (b) nested rounding order,
  #          (c) pinned evaluation order for a self-referential input)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: oral_to_poster_to_waitlist_waterfall_nested_branching
        grounds:
          - calculations.format_capacity_waterfall
          - entities.Abstract.fields.decision_downgraded
          - entities.Conference.fields.accepted_oral_count
          - entities.Conference.fields.waitlisted_count
          - state_machines.Abstract.SCORED_to_ACCEPTED
          - state_machines.Abstract.SCORED_to_WAITLISTED
        distinguishing_aspect: |
          Mode (a) nested conditional branching: three identical ORAL requests
          against oral_slot_capacity 1 and poster_slot_capacity 1 take three
          different branches of the same formula - straight ORAL, downgraded
          POSTER with decision_downgraded true, and WAITLISTED with decision
          null - decided by the interaction of requested_format,
          allow_format_downgrade and two remaining-capacity counters.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z."
            - "Conference GOS26 with oral_slot_capacity 1, poster_slot_capacity 1, workshop_slot_capacity 0."
            - "Category EDU with allowed_formats [ORAL, POSTER] and min_reviews_required 2."
            - "Three abstracts by Ada, all requested_format ORAL, each with two SUBMITTED reviews and therefore SCORED."
            - "Conference at REVIEW_CLOSED with no open DiscrepancyCase."
