      - name: award_allocation_axis_locks_while_payment_axis_defers_then_pays
        grounds:
          - state_machines.ParticipantAward
          - entities.ParticipantAward.fields.allocation_status
          - entities.ParticipantAward.fields.payment_status
          - calculations.payout_verdict
          - endpoints."POST /payout-runs/{payoutRunId}/execute"
          - endpoints."POST /disputes/{disputeId}/resolve"
        distinguishing_aspect: |
          The award carries two independent dimensions. Execution drives the
          payment axis PENDING -> DEFERRED (because a live dispute exists)
          while leaving the allocation axis on LOCKED, and dispute resolution
          then drives payment DEFERRED -> PAID without ever touching the
          allocation axis. A single-state-field implementation cannot express
          "LOCKED + DEFERRED" and will either unlock the award or pay it at
          execute time; the plan's paid_total_cents is 0 immediately after
          execute and 4,000,000 only after resolution.
