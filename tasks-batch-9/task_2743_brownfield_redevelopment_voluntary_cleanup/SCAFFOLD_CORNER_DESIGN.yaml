# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design
# Task: task_2743_brownfield_redevelopment_voluntary_cleanup
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7, walked row-by-row against
# references/claim-extraction-guide.md. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml)
# is the depth probe; every corner it already asserts appears here as an
# `excluded_because:` stub naming the covering §1.8 instance.
#
# Anchors are per-file, so this file re-defines its own `&c_*` call anchors.
# The shared prefix mirrors §1.8's:
#   clock 2026-08-01 -> parties -> laboratory -> site -> liability protection
#   -> PHASE_I (finding, submit, APPROVE) -> inquiry completion -> acquisition
#   -> PHASE_II (findings, submit, APPROVE) -> cleanup goals -> VCP enrollment
#   -> eligibility ENROLL -> remedial action plan -> control -> submit
#   -> technical PASS -> public comment close -> approve -> quote -> bind
#
# All money/date literals were computed by executing the §1.3 formulas
# (Decimal, ROUND_HALF_UP) against the pinned fixtures.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # §1.1 Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: create_site_returns_declared_system_and_computed_defaults
        claim_type: creation
        grounds:
          - entities.Site
          - entities.Site.fields.acquisition_status
          - entities.Site.fields.delineation_status
          - entities.Site.fields.cleanup_posture
          - entities.Site.fields.impaired_control_count
          - endpoints[POST /sites]
        distinguishing_aspect: "POST /sites with all required inputs returns HTTP 201 and every declared field: acquisition_status UNDER_CONTRACT, acquisition_date null, delineation_status NONE, cleanup_posture OPEN, impaired_control_count 0, version 1."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One REDEVELOPER party registered to own the site."
          setup_api_calls:
            - &c_clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &c_redev
              call: "POST /parties"
              payload: { legal_name: "Ironbridge Redevelopment LLC", party_type: REDEVELOPER, state_code: "OH" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { redev_id: $.data.id }
            - &c_consult
              call: "POST /parties"
              payload: { legal_name: "Terraline Environmental PC", party_type: CONSULTANT, state_code: "OH", licence_number: "OH-PG-4417" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { consult_id: $.data.id }
            - &c_insurer
              call: "POST /parties"
              payload: { legal_name: "Meridian Specialty Insurance Co", party_type: INSURER, state_code: "OH", licence_number: "OH-INS-2290" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { insurer_id: $.data.id }
            - &c_lab
              call: "POST /laboratories"
              payload: { lab_name: "GreatLakes Analytical", certification_code: "NELAP-OH-118", concurrent_capacity: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { lab_id: $.data.id }
          trigger:
            - &c_site
              call: "POST /sites"
              payload:
                owner_party_id: "${redev_id}"
                site_name: "Kinnickinnic Rail Yard"
                county_code: "OH-039"
                acreage: 12.4
                intended_reuse: COMMERCIAL
                planned_acquisition_date: "2026-10-15"
                institutional_control_committed: true
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { site_id: $.data.id, site_v0: $.data.version }
          assert:
            - "HTTP 201 with response_type 'object' and meta.api_request_id present per §1.0"
            - "Site.${site_id}.owner_party_id == ${redev_id}, site_name == 'Kinnickinnic Rail Yard', county_code == 'OH-039', acreage == 12.4, intended_reuse == 'COMMERCIAL', planned_acquisition_date == '2026-10-15', institutional_control_committed == true"
            - "Site.${site_id}.acquisition_status == 'UNDER_CONTRACT' and acquisition_date == null"
            - "Site.${site_id}.delineation_status == 'NONE'"
            - "Site.${site_id}.cleanup_posture == 'OPEN' and impaired_control_count == 0"
            - "Site.${site_id}.id, created_at, updated_at are present and version == 1"

      - name: create_site_omitting_institutional_control_applies_false_default
        claim_type: defaults
        grounds:
          - entities.Site.fields.institutional_control_committed
          - endpoints[POST /sites]
        distinguishing_aspect: "institutional_control_committed is the only optional input on POST /sites; omitting it must store false, not null and not true."
        test_recipe:
          setup:
            - "Clock 2026-08-01 and one REDEVELOPER party."
          setup_api_calls:
            - *c_clock0
            - *c_redev
          trigger:
            - &c_site_nocommit
              call: "POST /sites"
              payload:
                owner_party_id: "${redev_id}"
                site_name: "Cuyahoga Tannery Parcel"
                county_code: "OH-035"
                acreage: 3.75
                intended_reuse: RESIDENTIAL
                planned_acquisition_date: "2026-11-01"
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { site_nc_id: $.data.id }
          assert:
            - "Site.${site_nc_id}.institutional_control_committed == false (declared default applied, not null)"
            - "Site.${site_nc_id}.intended_reuse == 'RESIDENTIAL' and cleanup_posture == 'OPEN'"
            - "GET /sites/${site_nc_id} echoes institutional_control_committed == false"

      - name: create_site_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Site.fields.acquisition_status
          - entities.Site.fields.acquisition_date
          - entities.Site.fields.cleanup_posture
          - endpoints[POST /sites]
        distinguishing_aspect: "acquisition_status, acquisition_date, cleanup_posture and impaired_control_count are source system/computed; supplying them in the create body must not change the stored values."
        test_recipe:
          setup:
            - "Clock 2026-08-01 and one REDEVELOPER party."
          setup_api_calls:
            - *c_clock0
            - *c_redev
          trigger:
            - &c_site_sysinput
              call: "POST /sites"
              payload:
                owner_party_id: "${redev_id}"
                site_name: "Maumee Foundry Block"
                county_code: "OH-095"
                acreage: 8.0
                intended_reuse: INDUSTRIAL
                planned_acquisition_date: "2026-12-01"
                acquisition_status: ACQUIRED
                acquisition_date: "2026-01-01"
                cleanup_posture: FROZEN
                impaired_control_count: 9
                version: 42
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { site_si_id: $.data.id }
          assert:
            - "Site.${site_si_id}.acquisition_status == 'UNDER_CONTRACT' (supplied ACQUIRED ignored)"
            - "Site.${site_si_id}.acquisition_date == null (supplied '2026-01-01' ignored)"
            - "Site.${site_si_id}.cleanup_posture == 'OPEN' (supplied FROZEN ignored)"
            - "Site.${site_si_id}.impaired_control_count == 0 and version == 1 (supplied 9 and 42 ignored)"

      - name: create_site_missing_required_intended_reuse_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Site.fields.intended_reuse
          - validations[3].ERR_INVALID_REQUEST
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "intended_reuse has source input with no declared default, so omitting it must return HTTP 422 ERR_INVALID_REQUEST and persist no Site."
        test_recipe:
          setup:
            - "Clock 2026-08-01 and one REDEVELOPER party."
          setup_api_calls:
            - *c_clock0
            - *c_redev
          trigger:
            - call: "POST /sites"
              payload:
                owner_party_id: "${redev_id}"
                site_name: "Scioto Gasworks"
                county_code: "OH-049"
                acreage: 5.0
                planned_acquisition_date: "2026-12-15"
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { missing_reuse_err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == 'ERR_INVALID_REQUEST' and response_type 'error'"
            - "GET /sites?owner_party_id=${redev_id} returns total_count == 0 — nothing was persisted"

      - name: create_party_invalid_enum_party_type_rejected
        claim_type: type_constraints
        grounds:
          - entities.Party.fields.party_type
          - entities.Party.fields.state_code
          - validations[3].ERR_INVALID_REQUEST
        distinguishing_aspect: "party_type accepts only REDEVELOPER, CONSULTANT or INSURER and state_code must be exactly two uppercase letters; LENDER and 'Ohio' must each return HTTP 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Clock 2026-08-01; empty party registry."
          setup_api_calls:
            - *c_clock0
          trigger:
            - call: "POST /parties"
              payload: { legal_name: "Fifth Third Bank", party_type: LENDER, state_code: "OH" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { bad_enum_err: $.data.error_id }
            - call: "POST /parties"
              payload: { legal_name: "Terraline Environmental PC", party_type: CONSULTANT, state_code: "Ohio" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { bad_state_err: $.data.error_id }
          assert:
            - "the LENDER create returns HTTP 422 error_id == 'ERR_INVALID_REQUEST' (LENDER is a §1.7 role, not a Party.party_type member)"
            - "the state_code 'Ohio' create returns HTTP 422 error_id == 'ERR_INVALID_REQUEST'"
            - "GET /parties returns total_count == 0"

      - name: get_site_with_unknown_id_returns_site_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_SITE_NOT_FOUND]
          - validations[4]
          - endpoints[GET /sites/{id}]
        distinguishing_aspect: "GET /sites/{id} for an id no create ever minted returns HTTP 404 ERR_SITE_NOT_FOUND, not an empty 200 envelope."
        test_recipe:
          setup:
            - "Clock 2026-08-01; one REDEVELOPER party and one real site so the collection is non-empty."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_site
          trigger:
            - call: "GET /sites/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { site_404: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == 'ERR_SITE_NOT_FOUND'"
            - "GET /sites/${site_id} still returns HTTP 200 for the real site"

      - name: list_sites_pagination_envelope_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - endpoints[GET /sites]
          - entities.Site.fields.cleanup_posture
        distinguishing_aspect: "With three sites owned by the same party, GET /sites limit 2 offset 0 returns 2 rows with total_count 3 and has_more true; limit 2 offset 2 returns 1 row with total_count 3 and has_more false; the cleanup_posture filter narrows total_count to the filtered set, not the whole table."
        test_recipe:
          setup:
            - "Clock 2026-08-01; one REDEVELOPER party; three sites created in a fixed order (Kinnickinnic Rail Yard, Cuyahoga Tannery Parcel, Maumee Foundry Block)."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_site
            - *c_site_nocommit
            - &c_site3
              call: "POST /sites"
              payload:
                owner_party_id: "${redev_id}"
                site_name: "Maumee Foundry Block"
                county_code: "OH-095"
                acreage: 8.0
                intended_reuse: INDUSTRIAL
                planned_acquisition_date: "2026-12-01"
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { site3_id: $.data.id }
          trigger:
            - call: "GET /sites"
              payload: { owner_party_id: "${redev_id}", limit: 2, offset: 0 }
              as: Redeveloper
              as_user_id: "${redev_id}"
            - call: "GET /sites"
              payload: { owner_party_id: "${redev_id}", limit: 2, offset: 2 }
              as: Redeveloper
              as_user_id: "${redev_id}"
            - call: "GET /sites"
              payload: { cleanup_posture: FROZEN }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
          assert:
            - "first page: 2 data rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: 1 data row, total_count == 3, has_more == false, limit == 2, offset == 2"
            - "the two pages together contain each of ${site_id}, ${site_nc_id} and ${site3_id} exactly once"
            - "the cleanup_posture=FROZEN query returns 0 rows with total_count == 0 and has_more == false"
            - "response_type == 'array' on every list response per §1.0"

      - name: contaminant_finding_exceedance_factor_is_computed_and_immutable
        claim_type: computed_fields
        grounds:
          - entities.ContaminantFinding.fields.exceedance_factor
          - entities.ContaminantFinding.fields.delineated
          - endpoints[POST /assessment-phases/{id}/contaminant-findings]
          - endpoints[GET /contaminant-findings/{id}]
        distinguishing_aspect: "exceedance_factor is source computed = max_concentration_ugl / screening_level_ugl to 2 decimals: 480.0 / 5.0 stores 96.00, and ContaminantFinding has common_fields false so its read exposes no version and no update endpoint exists in §1.5."
        test_recipe:
          setup:
            - "Clock 2026-08-01; parties and laboratory registered; site created."
            - "One DRAFT PHASE_I assessment phase with aai_report_date 2026-07-20."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
            - *c_lab
            - *c_site
            - &c_prot
              call: "POST /liability-protections"
              payload: { site_id: "${site_id}" }
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { prot_id: $.data.id }
            - &c_p1
              call: "POST /assessment-phases"
              payload:
                site_id: "${site_id}"
                consultant_party_id: "${consult_id}"
                phase_type: PHASE_I
                field_start_date: "2026-06-01"
                field_end_date: "2026-07-10"
                delineation_confidence: SCREENING
                aai_report_date: "2026-07-20"
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { p1_id: $.data.id }
          trigger:
            - &c_p1f
              call: "POST /assessment-phases/${p1_id}/contaminant-findings"
              payload:
                contaminant_code: "TCE"
                media: SOIL_VAPOR
                sample_location_code: "SV-01"
                max_concentration_ugl: 480.0
                screening_level_ugl: 5.0
                delineated: false
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { f1_id: $.data.id }
          assert:
            - "ContaminantFinding.${f1_id}.exceedance_factor == 96.00"
            - "ContaminantFinding.${f1_id}.assessment_phase_id == ${p1_id} and delineated == false"
            - "GET /contaminant-findings/${f1_id} returns id and created_at but no version and no updated_at (common_fields false)"
            - "AssessmentPhase.${p1_id}.findings_count == 1 and max_exceedance_factor == 96.00"
            - "§1.5 declares no PATCH, PUT or DELETE for /contaminant-findings/{id} — the entity is immutable once written"

      - name: create_finding_under_unknown_phase_returns_phase_not_found
        claim_type: parent_relationships
        grounds:
          - errors[ERR_PHASE_NOT_FOUND]
          - validations[4]
          - entities.ContaminantFinding.fields.assessment_phase_id
        distinguishing_aspect: "ContaminantFinding declares parent AssessmentPhase; posting a finding under an unminted phase id returns HTTP 404 ERR_PHASE_NOT_FOUND and stores nothing, and posting supersedes_phase_id for an unminted phase on POST /assessment-phases returns the same error."
        test_recipe:
          setup:
            - "Clock 2026-08-01; parties and site created; one real DRAFT PHASE_I exists."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_lab
            - *c_site
            - *c_prot
            - *c_p1
          trigger:
            - call: "POST /assessment-phases/22222222-2222-4222-8222-222222222222/contaminant-findings"
              payload:
                contaminant_code: "PCE"
                media: SOIL
                sample_location_code: "SB-09"
                max_concentration_ugl: 12.0
                screening_level_ugl: 3.0
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { finding_parent_404: $.data.error_id }
            - call: "POST /assessment-phases"
              payload:
                site_id: "${site_id}"
                consultant_party_id: "${consult_id}"
                phase_type: SUPPLEMENTAL
                field_start_date: "2026-07-15"
                field_end_date: "2026-07-25"
                delineation_confidence: PARTIAL
                supersedes_phase_id: "22222222-2222-4222-8222-222222222222"
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { supersedes_404: $.data.error_id }
          assert:
            - "the finding create returns HTTP 404 error_id == 'ERR_PHASE_NOT_FOUND'"
            - "the SUPPLEMENTAL phase create returns HTTP 404 error_id == 'ERR_PHASE_NOT_FOUND'"
            - "GET /assessment-phases/${p1_id}/contaminant-findings returns total_count == 0 and GET /assessment-phases?site_id=${site_id} returns total_count == 1"

      - name: site_cannot_be_given_a_second_liability_protection
        claim_type: type_constraints
        grounds:
          - errors[ERR_DUPLICATE_LIABILITY_PROTECTION]
          - validations[9]
          - endpoints[POST /liability-protections]
        distinguishing_aspect: "LiabilityProtection is 0..1 per Site: the second POST /liability-protections for the same site_id returns HTTP 409 ERR_DUPLICATE_LIABILITY_PROTECTION and GET /sites/{id}/liability-protections still returns exactly one element."
        test_recipe:
          setup:
            - "Clock 2026-08-01; one REDEVELOPER party; one site with one liability protection already opened."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_site
            - *c_prot
          trigger:
            - call: "POST /liability-protections"
              payload: { site_id: "${site_id}" }
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { dup_prot_err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == 'ERR_DUPLICATE_LIABILITY_PROTECTION'"
            - "GET /sites/${site_id}/liability-protections returns exactly 1 element whose id == ${prot_id}"
            - "LiabilityProtection.${prot_id}.inquiry_state == 'AAI_PENDING', obligation_state == 'OBLIGATIONS_NONE', bfpp_status == 'NOT_ESTABLISHED', compliance_pct == 1.0, obligations_total_weight == 0"

      - name: cleanup_goal_upsert_on_repeat_triple_bumps_version
        claim_type: creation
        grounds:
          - endpoints[POST /sites/{id}/cleanup-goals]
          - entities.CleanupGoal.fields.goal_ugl
          - entities.CleanupGoal.fields.basis
          - calculations.risk_based_cleanup_goal
        distinguishing_aspect: "The triple (site_id, contaminant_code, media) is unique: re-posting TCE/SOIL_VAPOR upserts the same CleanupGoal row (same id) with a bumped version and a recomputed goal_ugl of 166.67 for UNRESTRICTED, rather than creating a second row."
        test_recipe:
          setup:
            - "Shared prefix through the APPROVED PHASE_I and PHASE_II so contaminant_count_in_media for SOIL_VAPOR is 2 (TCE and PCE)."
            - "One RESTRICTED TCE SOIL_VAPOR goal already derived at 250.00 with cumulative_cap_applied true."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
            - *c_lab
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
            - &c_p1sub
              call: "POST /assessment-phases/${p1_id}/submit"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &c_p1app
              call: "POST /assessment-phases/${p1_id}/review"
              payload: { decision: APPROVE, review_comment: "All appropriate inquiries record accepted." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &c_inq
              call: "POST /liability-protections/${prot_id}/inquiry-completion"
              payload: { aai_phase_id: "${p1_id}" }
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &c_clock_acq
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &c_acq
              call: "POST /sites/${site_id}/acquisition"
              payload: { acquisition_date: "2026-10-15" }
              as: Redeveloper
              as_user_id: "${redev_id}"
            - &c_clock_dec
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &c_p2
              call: "POST /assessment-phases"
              payload:
                site_id: "${site_id}"
                consultant_party_id: "${consult_id}"
                phase_type: PHASE_II
                field_start_date: "2026-11-01"
                field_end_date: "2026-12-05"
                delineation_confidence: FULL
                delineation_complete: true
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { p2_id: $.data.id }
            - &c_p2fa
              call: "POST /assessment-phases/${p2_id}/contaminant-findings"
              payload:
                contaminant_code: "TCE"
                media: SOIL_VAPOR
                sample_location_code: "SV-11"
                max_concentration_ugl: 24.0
                screening_level_ugl: 5.0
                delineated: true
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &c_p2fb
              call: "POST /assessment-phases/${p2_id}/contaminant-findings"
              payload:
                contaminant_code: "PCE"
                media: SOIL_VAPOR
                sample_location_code: "SV-12"
                max_concentration_ugl: 4.75
                screening_level_ugl: 2.5
                delineated: true
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &c_p2fc
              call: "POST /assessment-phases/${p2_id}/contaminant-findings"
              payload:
                contaminant_code: "BENZENE"
                media: GROUNDWATER
                sample_location_code: "MW-03"
                max_concentration_ugl: 22.5
                screening_level_ugl: 5.0
                delineated: true
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &c_p2sub
              call: "POST /assessment-phases/${p2_id}/submit"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &c_p2app
              call: "POST /assessment-phases/${p2_id}/review"
              payload: { decision: APPROVE, review_comment: "Delineation complete; remedial planning may proceed." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &c_g1
              call: "POST /sites/${site_id}/cleanup-goals"
              payload:
                contaminant_code: "TCE"
                media: SOIL_VAPOR
                screening_level_ugl: 5.0
                basis: RESTRICTED
                control_credit_type: VAPOR_MITIGATION
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - &c_g2
              call: "POST /sites/${site_id}/cleanup-goals"
              payload:
                contaminant_code: "PCE"
                media: SOIL_VAPOR
                screening_level_ugl: 5.0
                basis: UNRESTRICTED
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { g2_id: $.data.id }
          trigger:
            - &c_g1_upsert
              call: "POST /sites/${site_id}/cleanup-goals"
              payload:
                contaminant_code: "TCE"
                media: SOIL_VAPOR
                screening_level_ugl: 5.0
                basis: UNRESTRICTED
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { g1_again_id: $.data.id, g1_v2: $.data.version }
          assert:
            - "the upsert response id ${g1_again_id} equals ${g1_id} — no second row was created"
            - "CleanupGoal.${g1_id}.basis == 'UNRESTRICTED' and goal_ugl == 166.67 (recomputed from RESIDENTIAL 1.0 with no control credit over attenuation 0.03)"
            - "CleanupGoal.${g1_id}.cumulative_cap_applied == false after the upsert (166.67 sits below the 250.00 cumulative cap)"
            - "CleanupGoal.${g1_id}.version == ${g1_v} + 1"
            - "GET /sites/${site_id}/cleanup-goals returns total_count == 2 (${g1_id} and ${g2_id})"
            - "the upsert succeeded as Redeveloper — POST /sites/{id}/cleanup-goals is a §1.7 shared operation"

  # ===========================================================================
  # §1.2 State Machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: entities_start_in_declared_initial_states_after_create
        claim_type: initial_state
        grounds:
          - state_machines.RemedialActionPlan.initial_state
          - state_machines.SiteControl.initial_state
          - state_machines.FundingAward.initial_state
          - state_machines.MonitoringEvent.initial_state
          - state_machines.VcpEnrollment.initial_state
        distinguishing_aspect: "Every freshly created entity sits in its §1.2 initial_state with its counters zeroed: RemedialActionPlan DRAFT / NOT_STARTED / NOT_STARTED / revision_round 0, SiteControl PROPOSED / impairment_count 0, FundingAward APPLIED / allocated_cents 0, MonitoringEvent SCHEDULED / result_status PENDING, and VcpEnrollment is never observable in APPLIED because the automatic follow-on to ELIGIBILITY_REVIEW fires in the same request."
        test_recipe:
          setup:
            - "Shared prefix through the APPROVED PHASE_I and PHASE_II, both cleanup goals and the ENROLLED enrollment; clock 2026-12-10."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_insurer
            - *c_lab
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
            - *c_p1sub
            - *c_p1app
            - *c_inq
            - *c_clock_acq
            - *c_acq
            - *c_clock_dec
            - *c_p2
            - *c_p2fa
            - *c_p2fb
            - *c_p2fc
            - *c_p2sub
            - *c_p2app
            - *c_g1
            - *c_g2
            - &c_enr
              call: "POST /vcp-enrollments"
              payload:
                site_id: "${site_id}"
                program_track: RESTRICTED_CLOSURE
                applicant_statement: "Rail yard redevelopment to commercial reuse with vapor mitigation."
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { enr_id: $.data.id, enr_status_at_create: $.data.status }
            - &c_elig
              call: "POST /vcp-enrollments/${enr_id}/eligibility-decision"
              payload: { decision: ENROLL, decision_note: "AAI complete and institutional control committed." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { enr_v1: $.data.version }
          trigger:
            - &c_plan
              call: "POST /remedial-action-plans"
              payload:
                vcp_enrollment_id: "${enr_id}"
                site_id: "${site_id}"
                remedy_narrative: "Excavation and off-site disposal of impacted soil, pump-and-treat of the shallow aquifer, sub-slab vapor mitigation and 5-year performance monitoring."
                basis_assessment_phase_id: "${p2_id}"
                years_to_construction_start: 3
                cost_lines: &C_LINES
                  - { cost_category: EXCAVATION_DISPOSAL, media: SOIL, quantity: 100.13, unit_cost_cents: 4325 }
                  - { cost_category: EXCAVATION_DISPOSAL, media: SOIL, quantity: 200.13, unit_cost_cents: 4325 }
                  - { cost_category: EXCAVATION_DISPOSAL, media: SOIL, quantity: 12500, unit_cost_cents: 4325 }
                  - { cost_category: GW_TREATMENT, media: GROUNDWATER, quantity: 875.25, unit_cost_cents: 15750 }
                  - { cost_category: VAPOR_MITIGATION, media: SOIL_VAPOR, quantity: 3.5, unit_cost_cents: 2875000 }
                  - { cost_category: MONITORING, media: GROUNDWATER, quantity: 48, unit_cost_cents: 65500 }
                expected_vcp_enrollment_version: "${enr_v1}"
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - &c_ctl
              call: "POST /site-controls"
              payload:
                site_id: "${site_id}"
                remedial_action_plan_id: "${plan_id}"
                control_type: VAPOR_MITIGATION
                sub_area_code: "BLDG-A-SLAB"
                coverage_from: "2027-01-01"
                coverage_to: "2027-12-31"
                inspection_interval_days: 90
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { ctl_id: $.data.id }
            - &c_award
              call: "POST /funding-awards"
              payload:
                site_id: "${site_id}"
                program_code: "OH-BROWNFIELD-CLEANUP"
                funding_kind: GRANT
                program_priority: 1
                max_award_cents: 30000000
                max_share_pct: 0.40
                match_requirement_pct: 0.20
                eligible_cost_categories: [EXCAVATION_DISPOSAL, MONITORING]
                eligibility_documents: [SITE_CONTROL_EVIDENCE, PHASE_II_REPORT, COST_ESTIMATE, MATCH_COMMITMENT]
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { award_id: $.data.id }
            - &c_me
              call: "POST /monitoring-events"
              payload:
                site_id: "${site_id}"
                laboratory_id: "${lab_id}"
                cleanup_goal_id: "${g1_id}"
                event_type: SAMPLING
                monitoring_period_code: "2027-M02"
                sample_date: "2027-02-05"
                window_start: "2027-02-01"
                window_end: "2027-02-15"
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { me_id: $.data.id }
          assert:
            - "RemedialActionPlan.${plan_id}.status == 'DRAFT', technical_review_state == 'NOT_STARTED', public_comment_state == 'NOT_STARTED', public_comment_count == 0, revision_round == 0, pinned_cleanup_goal_versions == [], approved_by_user_id == null, approved_at == null"
            - "SiteControl.${ctl_id}.status == 'PROPOSED', control_class == 'ENGINEERING', impairment_count == 0, last_certified_on == null, impaired_since == null, next_certification_due_on == '2027-04-01' (coverage_from 2027-01-01 + 90 days)"
            - "FundingAward.${award_id}.status == 'APPLIED', allocated_cents == 0, decided_by_user_id == null"
            - "MonitoringEvent.${me_id}.status == 'SCHEDULED', result_status == 'PENDING', result_value_ugl == null, control_condition == null"
            - "VcpEnrollment.${enr_id}.status == 'ENROLLED' after the eligibility decision, and the create response status ${enr_status_at_create} was already 'ELIGIBILITY_REVIEW' — APPLIED is not observable after the request completes"
            - "LiabilityProtection.${prot_id}.inquiry_state == 'AAI_COMPLETE' and Site.${site_id}.acquisition_status == 'ACQUIRED', so bfpp_status == 'ESTABLISHED'"

      - name: submit_assessment_phase_advances_to_under_review_with_side_effects
        claim_type: valid_transition
        grounds:
          - state_machines.AssessmentPhase.DRAFT_to_SUBMITTED
          - state_machines.AssessmentPhase.SUBMITTED_to_UNDER_REVIEW
          - entities.AssessmentPhase.fields.submitted_at
          - entities.AssessmentPhase.fields.review_round
          - entities.AssessmentPhase.fields.max_exceedance_factor
        distinguishing_aspect: "One POST /assessment-phases/{id}/submit executes DRAFT -> SUBMITTED and the automatic SUBMITTED -> UNDER_REVIEW in the same request, so the observable status is UNDER_REVIEW with submitted_at 2026-08-01T00:00:00Z, review_round 1 and max_exceedance_factor recomputed to 96.00 — SUBMITTED is never observable."
        test_recipe:
          setup:
            - "Clock 2026-08-01; parties, laboratory and site created; liability protection opened."
            - "One DRAFT PHASE_I with a single TCE SOIL_VAPOR finding at 480.0 against a 5.0 screening level."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_lab
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
          trigger:
            - *c_p1sub
          assert:
            - "HTTP 200; AssessmentPhase.${p1_id}.status == 'UNDER_REVIEW' (not 'SUBMITTED')"
            - "AssessmentPhase.${p1_id}.submitted_at == '2026-08-01T00:00:00Z' (the logical clock, not wall time)"
            - "AssessmentPhase.${p1_id}.review_round == 1 and findings_count == 1"
            - "AssessmentPhase.${p1_id}.max_exceedance_factor == 96.00"
            - "AssessmentPhase.${p1_id}.version == 2 and reviewed_by_user_id == null"
            - "Site.${site_id}.delineation_status == 'NONE' — the SCREENED cascade only fires on APPROVE"

      - name: submit_assessment_phase_with_no_findings_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.AssessmentPhase.DRAFT_to_SUBMITTED
          - validations[37].ERR_NO_FINDINGS
          - errors[ERR_NO_FINDINGS]
        distinguishing_aspect: "The findings_count >= 1 precondition on DRAFT -> SUBMITTED returns HTTP 422 ERR_NO_FINDINGS and leaves status DRAFT, review_round 0 and submitted_at null."
        test_recipe:
          setup:
            - "Clock 2026-08-01; parties and site created; liability protection opened."
            - "One DRAFT PHASE_I with zero contaminant findings."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_site
            - *c_prot
            - *c_p1
          trigger:
            - call: "POST /assessment-phases/${p1_id}/submit"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { no_findings_err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == 'ERR_NO_FINDINGS'"
            - "AssessmentPhase.${p1_id}.status == 'DRAFT', review_round == 0, submitted_at == null, version == 1"

      - name: review_assessment_phase_still_in_draft_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.AssessmentPhase.UNDER_REVIEW_to_APPROVED
          - validations[12].ERR_INVALID_PHASE_STATE
          - errors[ERR_INVALID_PHASE_STATE]
        distinguishing_aspect: "APPROVE is declared only from UNDER_REVIEW; issuing it against a DRAFT phase (never submitted) returns HTTP 409 ERR_INVALID_PHASE_STATE with no delineation cascade and no reviewed_by_user_id written."
        test_recipe:
          setup:
            - "Clock 2026-08-01; parties and site created; liability protection opened."
            - "One DRAFT PHASE_I carrying one finding, never submitted."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
          trigger:
            - call: "POST /assessment-phases/${p1_id}/review"
              payload: { decision: APPROVE, review_comment: "Premature approval attempt." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { draft_review_err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == 'ERR_INVALID_PHASE_STATE'"
            - "AssessmentPhase.${p1_id}.status == 'DRAFT' and reviewed_by_user_id == null"
            - "Site.${site_id}.delineation_status == 'NONE' and LiabilityProtection.${prot_id}.inquiry_state == 'AAI_PENDING'"

      - name: denied_funding_award_terminal_state_rejects_second_decision
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FundingAward.APPLIED_to_DENIED
          - validations[12].ERR_INVALID_AWARD_STATE
          - errors[ERR_INVALID_AWARD_STATE]
        distinguishing_aspect: "DENIED is terminal on FundingAward: a subsequent AWARD decision on the same application returns HTTP 409 ERR_INVALID_AWARD_STATE, allocated_cents stays 0 and decided_by_user_id keeps the first reviewer's id."
        test_recipe:
          setup:
            - "Clock 2026-08-01; one REDEVELOPER party and one site."
            - "One funding application filed and already DENIED by reviewer-alpha."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_site
            - &c_award_std
              call: "POST /funding-awards"
              payload:
                site_id: "${site_id}"
                program_code: "OH-BROWNFIELD-CLEANUP"
                funding_kind: GRANT
                program_priority: 1
                max_award_cents: 30000000
                max_share_pct: 0.40
                match_requirement_pct: 0.20
                eligible_cost_categories: [EXCAVATION_DISPOSAL, MONITORING]
                eligibility_documents: [SITE_CONTROL_EVIDENCE, PHASE_II_REPORT, COST_ESTIMATE, MATCH_COMMITMENT]
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { award_std_id: $.data.id }
            - &c_award_deny
              call: "POST /funding-awards/${award_std_id}/decision"
              payload: { decision: DENY, decision_note: "Programme oversubscribed." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
          trigger:
            - call: "POST /funding-awards/${award_std_id}/decision"
              payload: { decision: AWARD, decision_note: "Reconsideration attempt." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-beta"
              captures: { terminal_award_err: $.data.error_id }
          assert:
            - "the DENY returned HTTP 200 with FundingAward.${award_std_id}.status == 'DENIED' and decided_by_user_id == 'reviewer-alpha'"
            - "the AWARD attempt returns HTTP 409 with error_id == 'ERR_INVALID_AWARD_STATE'"
            - "FundingAward.${award_std_id}.status == 'DENIED' still, allocated_cents == 0 and decided_by_user_id == 'reviewer-alpha' (not overwritten by reviewer-beta)"

      - name: second_site_acquisition_rejected_as_already_acquired
        claim_type: idempotency
        grounds:
          - state_machines.Site
          - entities.Site.fields.acquisition_status
          - validations[12].ERR_SITE_ALREADY_ACQUIRED
          - errors[ERR_SITE_ALREADY_ACQUIRED]
        distinguishing_aspect: "Recording acquisition is not idempotent: the second POST /sites/{id}/acquisition returns HTTP 409 ERR_SITE_ALREADY_ACQUIRED and acquisition_date keeps the first value 2026-10-15 rather than being overwritten with 2026-10-20."
        test_recipe:
          setup:
