        test_recipe:
          setup:
            - "A DSCR loan file in UNDERWRITING with one 600000 origination fee, a PASS fee test and an EXEMPT ATR determination."
          setup_api_calls:
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "DSCR"
                name: "Investor DSCR Immediate"
                min_dscr: 1.1000
                max_ltv_pct: 85.00
                min_fico: 660
                min_reserves_months: 6
                min_residual_income_cents: 0
                second_valuation_ltv_threshold_pct: 90.00
                second_valuation_loan_amount_threshold_cents: 150000000
                atr_exempt_flag: true
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
              captures: { prog_id: "$.data.id" }
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { legal_name: "Cascade Cara", fico_score: 700, monthly_debt_obligations_cents: 0, verified_liquid_assets_cents: 5000000, age_years: 50 }
              captures: { borr_id: "$.data.id" }
            - call: "POST /loan-files"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { borrower_id: "${borr_id}", program_id: "${prog_id}", investor_code: "INV-ALPHA", loan_amount_cents: 60000000, purchase_price_cents: 80000000, property_value_cents: 80000000, occupancy: "INVESTMENT", purpose: "PURCHASE", lien_position: "FIRST", note_rate_pct: 8.750, apor_pct: 6.100, term_months: 360, amortization_type: "INTEREST_ONLY", monthly_taxes_cents: 60000, monthly_insurance_cents: 20000, gross_market_rent_cents: 620000, lease_rent_cents: 640000 }
              captures: { lf_id: "$.data.id" }
            - call: "POST /loan-files/${lf_id}/doc-type-selection"
              as: Underwriter
              as_user_id: "uw-1"
              payload: { doc_type: "DSCR" }
            - call: "POST /points-and-fees-items"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { loan_file_id: "${lf_id}", fee_code: "F-ORIG", fee_category: "ORIGINATION_POINTS", amount_cents: 600000, prepaid_finance_charge_flag: true }
              captures: { fee_orig_id: "$.data.id" }
            - call: "POST /loan-files/${lf_id}/submit-to-underwriting"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: {}
            - call: "POST /loan-files/${lf_id}/points-and-fees-test"
              as: Underwriter
              as_user_id: "uw-1"
              payload: {}
            - call: "POST /loan-files/${lf_id}/atr-determination"
              as: Underwriter
              as_user_id: "uw-1"
              payload: {}
          trigger:
            - call: "GET /loan-files/${lf_id}"
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /points-and-fees-items"
              as: Underwriter
              as_user_id: "uw-1"
              payload: { loan_file_id: "${lf_id}", fee_code: "F-LLPA", fee_category: "LOAN_LEVEL_PRICE_ADJUSTMENT", amount_cents: 2500000 }
              captures: { fee_llpa_id: "$.data.id" }
            - call: "GET /loan-files/${lf_id}"
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /points-and-fees-items/${fee_llpa_id}/void"
              as: Underwriter
              as_user_id: "uw-1"
              payload: { void_reason: "Fee waived by the investor" }
            - call: "GET /loan-files/${lf_id}"
              as: Underwriter
              as_user_id: "uw-1"
          assert:
            - "First trigger call: total_loan_amount_cents == 59400000, points_and_fees_cap_cents == 2970000, points_and_fees_total_cents == 600000, points_and_fees_test_result == PASS, atr_documentation_status == EXEMPT and safe_harbor_class == EXEMPT_BUSINESS_PURPOSE"
            - "Second trigger call returns 201 with a PointsAndFeesItem body only - it does not return the loan file, so the loan file's new state can only be observed by reading it"
            - "Third trigger call, the very next read: points_and_fees_total_cents == 3100000, points_and_fees_test_result == FAIL, and because the result changed, atr_documentation_status == INCOMPLETE and safe_harbor_class == NOT_EVALUATED - all three cascaded fields are already correct on the first read, with no second write and no delay"
            - "The cap itself is unchanged at 2970000 and total_loan_amount_cents at 59400000, because the new fee is not a prepaid finance charge"
            - "Fifth trigger call, immediately after the void: points_and_fees_total_cents == 600000 and points_and_fees_test_result == PASS again, restored exactly, while atr_documentation_status stays INCOMPLETE - the invalidation is not undone by the void, only a fresh atr-determination can clear it"
