            - "ordering: links 3 and 4 both read link 2's available_energy_mwh / cumulative_throughput_mwh, so applying link 2 after them would yield derated_committed_mw 25.0 and an unchanged 37.00 price"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_outranks_safety_lockout_on_capacity_test_start
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_TEST_NOT_SCHEDULED]
          - errors[ERR_ASSET_SAFETY_LOCKOUT]
          - endpoints[POST /capacity-tests/{id}/start]
        distinguishing_aspect: |
          Category pair state (priority 9) versus business_safety (priority 11). One request
          violates both: the CapacityTest is already IN_PROGRESS and the asset is in thermal
          LOCKOUT. The response must be ERR_TEST_NOT_SCHEDULED (409) from the earlier rule, and a
          control request that violates only priority 11 proves the lower rule is really live.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A1 registered and commissioned"
            - "CapacityTest T1 scheduled 2026-08-05, started, so its status is IN_PROGRESS"
            - "a manual THERMAL_RUNAWAY CRITICAL SafetyEvent opened by so_1, which imposes LOCKOUT and suspends the asset"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a1}", scheduled_date: "2026-08-05T00:00:00Z" }
              as: AssetManager
              captures: { t1: $.data.id }
            - call: "POST /capacity-tests/${t1}/start"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
              captures: { t1_status: $.data.status }
            - call: "POST /safety-events"
              payload: { asset_id: "${a1}", event_type: "THERMAL_RUNAWAY", severity: "CRITICAL", detected_max_cell_temp_c: 82.0 }
              as: SafetyOfficer
              as_user_id: "so_1"
              captures: { ev: $.data.id, ev_imposed: $.data.imposed_safety_state }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { safety_now: $.data.safety_state }
          trigger:
            - call: "POST /capacity-tests/${t1}/start"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
              captures: { err_pair: $.data.error_id }
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a1}", scheduled_date: "2026-08-20T00:00:00Z" }
              as: AssetManager
              captures: { err_solo: $.data.error_id }
          assert:
            - "preconditions for the conflict: ${t1_status} == IN_PROGRESS, ${ev_imposed} == LOCKOUT, ${safety_now} == LOCKOUT"
            - "both rules are violated by the first trigger, and ${err_pair} == ERR_TEST_NOT_SCHEDULED with HTTP 409 — priority 9 (state) outranks priority 11 (business_safety)"
            - "the second trigger violates only priority 11, and ${err_solo} == ERR_ASSET_SAFETY_LOCKOUT with HTTP 409 — the lower rule is genuinely enforced and was merely masked"
            - "CapacityTest.${t1}.status == IN_PROGRESS is unchanged and no new CapacityTest row exists for 2026-08-20"

      - name: market_availability_outranks_soc_insufficiency_on_reservation_create
        grounds:
          - validations[priority=12]
          - validations[priority=33]
          - errors[ERR_ASSET_NOT_MARKET_AVAILABLE]
          - errors[ERR_SOC_INSUFFICIENT]
          - endpoints[POST /soc-reservations]
        distinguishing_aspect: |
          A different category pair on a different endpoint: business_safety (priority 12) versus
          business_fiscal (priority 33). One 90.0 MWh request against a never-commissioned
          (OFFLINE) asset violates both — the asset is not market-available AND 90.0 exceeds the
          70.0 MWh free_dispatchable headroom — and must return ERR_ASSET_NOT_MARKET_AVAILABLE
          (409). After commissioning, the identical body returns ERR_SOC_INSUFFICIENT (422).
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A1 registered but NOT commissioned, so market_state is OFFLINE while safety_state is NORMAL (priority 11 stays satisfied)"
            - "the asset's free_dispatchable_mwh is 70.0 == min(80.0 soc, 95.0 ceiling) - 10.0 floor"
            - "the correct expected_asset_version is used in both trigger calls so that priority 10 never fires"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id, a1_v0: $.data.version, a1_market0: $.data.market_state, a1_safety0: $.data.safety_state, a1_free0: $.data.free_dispatchable_mwh }
          trigger:
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 90.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${a1_v0}" }
              as: MarketTrader
              captures: { err_pair: $.data.error_id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { a1_v1: $.data.version, a1_market1: $.data.market_state }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 90.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${a1_v1}" }
              as: MarketTrader
              captures: { err_solo: $.data.error_id }
          assert:
            - "baseline: ${a1_market0} == OFFLINE, ${a1_safety0} == NORMAL, ${a1_free0} == 70.0"
            - "both rules are violated by the first trigger, and ${err_pair} == ERR_ASSET_NOT_MARKET_AVAILABLE with HTTP 409 — priority 12 (business_safety) outranks priority 33 (business_fiscal)"
            - "${a1_market1} == AVAILABLE after commissioning"
            - "with only priority 33 violated the identical body returns ${err_solo} == ERR_SOC_INSUFFICIENT with HTTP 422"
            - "no SocReservation row exists for the asset and StorageAsset.${a1}.reserved_mwh_total == 0.0 — a rejected request performs no partial write"

  - rule_id: boundary_precision_check
    instances:
      - name: soc_headroom_exact_equality_accepted_and_one_hundredth_over_rejected
        grounds:
          - calculations.soc_reservation_availability
          - validations[priority=33]
          - entities.StorageAsset.fields.free_dispatchable_mwh
          - endpoints[POST /soc-reservations]
        distinguishing_aspect: |
          Metric: energy headroom in MWh on POST /soc-reservations. The acceptance test is
          `req.reserved_mwh <= available_mwh`, so the three-point probe is 40.0 (below), then
          exactly 30.0 (equal to the remaining 30.0 headroom — must be ACCEPTED), then 0.01
          against a headroom of 0.0 (must be REJECTED). The equality case is the one an
          implementation using a strict `<` silently gets wrong.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A1 registered and commissioned: usable 80.0 == min(soc 80.0, 100.0 * 95%), floor 10.0, so free_dispatchable_mwh is 70.0"
            - "SocReservation R1 ENERGY_ARBITRAGE 40.0 MWh, window 2026-08-10T12:00:00Z .. 20:00:00Z (below headroom)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version, free0: $.data.free_dispatchable_mwh }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id, r1_status: $.data.status }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { v2: $.data.version, free1: $.data.free_dispatchable_mwh }
          trigger:
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ANCILLARY", reserved_mwh: 30.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v2}" }
              as: MarketTrader
              captures: { r2: $.data.id, r2_status: $.data.status }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { v3: $.data.version, reserved2: $.data.reserved_mwh_total, free2: $.data.free_dispatchable_mwh }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ANCILLARY", reserved_mwh: 0.01, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v3}" }
              as: MarketTrader
              captures: { err_over: $.data.error_id }
          assert:
            - "${free0} == 70.0 and, after R1, ${free1} == 30.0 == round(80.0 - 10.0 - 40.0, 3)"
            - "at the boundary: ${r2_status} == HELD — a request exactly equal to the 30.0 MWh headroom is ACCEPTED, and ${r1_status} == HELD is untouched"
            - "${reserved2} == 70.0 and ${free2} == 0.0 == max(0, round(80.0 - 10.0 - 70.0, 3))"
            - "one hundredth over: ${err_over} == ERR_SOC_INSUFFICIENT with HTTP 422, because 0.01 > 0.0"
            - "GET /soc-reservations?asset_id=${a1}&status=HELD returns exactly 2 rows with total_count 2 — the rejected 0.01 MWh request created nothing"

      - name: composite_score_exactly_at_performance_floor_charges_nothing
        grounds:
          - calculations.dispatch_performance_score
          - entities.DispatchInstruction.fields.non_performance_charge_usd
          - state_machines.DispatchInstruction.scoring_status.PROVISIONAL_to_SETTLED
          - endpoints[POST /dispatch-instructions/{id}/settle-score]
        distinguishing_aspect: |
          A different metric (a dimensionless performance score) on a different endpoint
          (POST /dispatch-instructions/{id}/settle-score). PERFORMANCE_FLOOR_SCORE is 75.00 and
          the charge term is max(0, 75.00 - composite_score) * instructed_mw * 4.00. Asset A
          lands on exactly 75.00 and must be charged 0.00; asset B lands on 74.99 — one hundredth
          of a score point below — and must be charged 0.80.
