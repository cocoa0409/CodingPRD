            - call: "POST /transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", issuer_id: "${iss}", share_quantity: 50, expected_account_version: "${a_v}" }
              as: TransferExaminer
              captures: { t: $.data.id }
            - call: "POST /transfer-requests/${t}/flag-deficient"
              payload: { deficiency_reason: "signature mismatch" }
              as: TransferExaminer
