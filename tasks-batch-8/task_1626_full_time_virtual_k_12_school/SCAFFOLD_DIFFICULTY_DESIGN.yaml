  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: stipend_issuance_and_return_conserve_funds
        grounds:
          - state_machines.DeviceStipend.REQUESTED_to_ISSUED
          - state_machines.DeviceStipend.RETURN_REQUESTED_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity: outstanding_liability = sum over stipends with
          issue_status in {ISSUED, RETURN_REQUESTED} of (amount_cents -
          clawback_cents). Issue adds amount_cents to the liability;
          mark-returned removes the full amount_cents and sets
          clawback_cents=0. Forward (issue) + compensating (mark-returned)
          leaves the invariant at zero net liability.
        test_recipe:
          setup:
            - "Student S enrolled; DEVICE stipend 50000 cents issued -> outstanding liability = 50000"
            - "S withdrawn -> stipend RETURN_REQUESTED -> liability still 50000"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-080", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 10 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Wendy", date_of_birth: "2011-04-20T00:00:00Z", grade_level: 8, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/stipends"
              payload: { student_id: "${student_id}", stipend_type: "DEVICE", amount_cents: 50000 }
              as: FinanceOfficer
              captures: { stipend_id: $.data.id }
            - call: "POST /vks/stipends/${stipend_id}/issue"
              payload: {}
              as: FinanceOfficer
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/withdraw"
              payload: { withdrawal_reason: "MOVED_DISTRICT" }
              as: EnrollmentOfficer
          trigger:
            - call: "POST /vks/stipends/${stipend_id}/mark-returned"
              payload: {}
              as: FinanceOfficer
          assert:
            - "DeviceStipend.${stipend_id}.issue_status == RETURNED"
            - "DeviceStipend.${stipend_id}.clawback_cents == 0"
            - "DeviceStipend.${stipend_id}.amount_cents == 50000"
      - name: proctor_seat_booking_and_cancel_conserve_occupancy
        grounds:
          - state_machines.ProctorAssignment.BOOKED_to_CANCELLED
          - entities.TestSite.fields.seats_booked
        distinguishing_aspect: |
          Conserved quantity: TestSite.seats_booked = count of
          ProctorAssignment rows at this site in BOOKED state. Booking adds
          1; cancelling subtracts 1; the pair leaves seats_booked invariant
          at its pre-booking value. Different conserved quantity (seat count)
          than the stipend liability above.
        test_recipe:
          setup:
            - "TestSite TS seat_capacity=3, seats_booked starts at 0"
            - "Student S1 enrolled; ProctorAssignment PA booked -> seats_booked=1"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-081", state_code: "OR", funding_rate_cents: 400, enrollment_cap: 10 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/test-sites"
              payload: { site_name: "Portland Site", state_code: "OR", seat_capacity: 3 }
              as: ProctorCoordinator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /vks/assessment-windows"
              payload: { assessment_name: "Winter Sci", subject: "SCIENCE", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T17:00:00Z" }
              as: ProctorCoordinator
              captures: { window_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Xena", date_of_birth: "2012-05-25T00:00:00Z", grade_level: 7, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/proctor-assignments"
              payload: { student_id: "${student_id}", assessment_window_id: "${window_id}", test_site_id: "${site_id}", expected_test_site_version: "${site_v0}" }
              as: ProctorCoordinator
              captures: { pa_id: $.data.id }
            - call: "GET /vks/test-sites/${site_id}"
              payload: {}
              as: ProctorCoordinator
              captures: { booked_count: $.data.seats_booked }
          trigger:
            - call: "POST /vks/proctor-assignments/${pa_id}/cancel"
              payload: {}
              as: ProctorCoordinator
          assert:
            - "booked_count == 1"
            - "ProctorAssignment.${pa_id}.assignment_status == CANCELLED"
            - "TestSite.${site_id}.seats_booked == 0"
