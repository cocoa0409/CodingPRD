              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item1}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item1}/lifecycle"
