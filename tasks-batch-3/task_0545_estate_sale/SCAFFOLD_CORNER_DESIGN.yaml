# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage) — task_0545 estate-sale
# Enumerates testable claims across §1.1–§1.7 not already probed by §1.8.
# excluded_because stubs point at the §1.8 instance that already covers the corner.
# =============================================================================
scaffold_corner_design:

  # --------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: client_create_returns_all_fields
        claim_type: creation
        grounds: [entities.Client.fields.name, entities.Client.fields.phone]
        distinguishing_aspect: "POST /estate/clients with name+phone -> 201 and echoes name, phone, a server-minted id and created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /estate/clients", payload: { name: "Test Owner", phone: "555-9000", email: "t@x.com" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
          assert:
            - "Client.${cli_id}.name == 'Test Owner'"
            - "Client.${cli_id}.phone == '555-9000'"
            - "Client.${cli_id}.email == 't@x.com'"

      - name: project_computed_counters_zero_on_create
        claim_type: computed_fields
        grounds: [entities.Project.fields.gross_sales_cents, entities.Project.fields.unsold_lot_count]
        distinguishing_aspect: "A freshly created project has gross_sales_cents==0, buyout_advances_cents==0, unsold_lot_count==0, status==LEAD, version==1."
        test_recipe:
          setup: ["one client"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Ce Owner", phone: "555-9001" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
          trigger:
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "1 A St", estimated_total_value_cents: 1000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
          assert:
            - "Project.${proj_id}.gross_sales_cents == 0"
            - "Project.${proj_id}.unsold_lot_count == 0"
            - "Project.${proj_id}.status == LEAD"
            - "Project.${proj_id}.version == 1"

      - name: lot_defaults_applied_on_create
        claim_type: defaults
        grounds: [entities.Lot.fields.handling_type, entities.Lot.fields.is_bid_lot]
        distinguishing_aspect: "Omitting handling_type/is_bid_lot defaults handling_type=CONSIGNMENT, is_bid_lot=false, status=NEW."
        test_recipe:
          setup: ["project CONTRACTED"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "De Owner", phone: "555-9002" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "2 B St", estimated_total_value_cents: 1000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
          trigger:
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Box of books" }, as: Appraiser, captures: { lot_id: "$.data.id" } }
          assert:
            - "Lot.${lot_id}.handling_type == CONSIGNMENT"
            - "Lot.${lot_id}.is_bid_lot == false"
            - "Lot.${lot_id}.status == NEW"

      - name: project_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_PROJECT_NOT_FOUND]"]
        distinguishing_aspect: "GET /estate/projects/{unknown-uuid} -> 404 ERR_PROJECT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /estate/projects/00000000-0000-4000-8000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PROJECT_NOT_FOUND"

      - name: lot_create_missing_title_returns_validation
        claim_type: required_fields
        grounds: ["errors[ERR_VALIDATION]", entities.Lot.fields.title]
        distinguishing_aspect: "POST /estate/lots without the required title -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["project CONTRACTED"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Ee Owner", phone: "555-9003" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "3 C St", estimated_total_value_cents: 1000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
          trigger:
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}" }, as: Appraiser, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION"

  # --------------------------------------------------------- state_machines ---
  - section: state_machines
    instances:
      - name: lot_invalid_transition_new_to_listed_rejected
        claim_type: invalid_transitions
        grounds: [state_machines.Lot.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PATCH a NEW lot straight to LISTED (skipping RESEARCHED/PRICED/STAGED/TAGGED) -> ERR_INVALID_STATE; lot stays NEW."
        test_recipe:
          setup: ["project CONTRACTED with a NEW lot"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Fe Owner", phone: "555-9004" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "4 D St", estimated_total_value_cents: 1000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Toolbox", list_price_cents: 3000, reserve_price_cents: 100 }, as: Appraiser, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "LISTED" }, as: Appraiser, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Lot.${lot_id}.status == NEW"

      - name: project_terminal_blocks_further_patch
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Project.terminal_states, "errors[ERR_PROJECT_TERMINAL]"]
        distinguishing_aspect: "After cancel (CANCELLED terminal), PATCH /estate/projects/{id} -> ERR_PROJECT_TERMINAL."
        test_recipe:
          setup: ["project cancelled from LEAD"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Ge Owner", phone: "555-9005" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "5 E St", estimated_total_value_cents: 1000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "POST /estate/projects/${proj_id}/cancel", payload: {}, as: SaleManager }
          trigger:
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PROJECT_TERMINAL"
            - "Project.${proj_id}.status == CANCELLED"

      - name: sale_event_close_from_scheduled_rejected
        claim_type: invalid_transitions
        grounds: [state_machines.SaleEvent.OPEN_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /estate/sale-events/{id}/close while the event is SCHEDULED (never OPENed) -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["a SCHEDULED sale-event"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "He Owner", phone: "555-9006" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "6 F St", estimated_total_value_cents: 1000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "POST /estate/crews", payload: { name: "Crew Z1" }, as: PlatformAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T17:00:00Z" }, as: SaleManager, captures: { se_id: "$.data.id" } }
          trigger:
            - { call: "POST /estate/sale-events/${se_id}/close", payload: {}, as: SaleManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "SaleEvent.${se_id}.status == SCHEDULED"

  # ----------------------------------------------------------- calculations ---
  - section: calculations
    instances:
      - name: markdown_day2_price_correct
        claim_type: correct_result
        grounds: [calculations.markdown_price, entities.SaleEvent.fields.markdown_day2_pct]
        distinguishing_aspect: "On day index 2 (clock 2026-06-03T00:00:00Z vs start 2026-06-01T00:00:00Z), a 10000 lot sells at markdown_day2_pct 0.50 -> final_price_cents 5000."
        test_recipe:
          setup: ["LISTED lot list 10000 reserve 100; sale OPEN; clock at day index 2"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /estate/clients", payload: { name: "Ie Owner", phone: "555-9007" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "7 G St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Painting", list_price_cents: 10000, reserve_price_cents: 100 }, as: Appraiser, captures: { lot_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_SETUP" }, as: SaleManager }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "POST /estate/crews", payload: { name: "Crew Z2" }, as: PlatformAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-04T00:00:00Z" }, as: SaleManager, captures: { se_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_LIVE" }, as: SaleManager }
            - { call: "PATCH /estate/sale-events/${se_id}", payload: { status: "OPEN" }, as: SaleManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /estate/transactions", payload: { sale_event_id: "${se_id}", lot_id: "${lot_id}", payment_method: "CASH" }, as: Cashier, captures: { tx_id: "$.data.id" } }
          assert:
            - "Transaction.${tx_id}.final_price_cents == 5000"

      - name: approve_buyout_records_advance_and_converts
        claim_type: correct_result
        grounds: [entities.Lot.fields.handling_type, entities.Lot.fields.buyout_price_cents, entities.Project.fields.buyout_advances_cents]
        distinguishing_aspect: "approve-buyout by a different operator converts a RESEARCHED consignment lot to BUYOUT, stamps buyout_price_cents=5000 and Project.buyout_advances_cents=5000."
        test_recipe:
          setup: ["project CONTRACTED with a RESEARCHED consignment lot researched by user APP1"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Je Owner", phone: "555-9008" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "8 H St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Antique desk", list_price_cents: 8000, reserve_price_cents: 100 }, as: Appraiser, as_user_id: "APP1", captures: { lot_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "RESEARCHED", research_notes: "solid oak" }, as: Appraiser, as_user_id: "APP1" }
          trigger:
            - { call: "POST /estate/lots/${lot_id}/approve-buyout", payload: { buyout_price_cents: 5000 }, as: SaleManager, as_user_id: "MGR1" }
          assert:
            - "Lot.${lot_id}.handling_type == BUYOUT"
            - "Lot.${lot_id}.buyout_price_cents == 5000"
            - "Project.${proj_id}.buyout_advances_cents == 5000"

      - name: markdown_day1_boundary_covered_by_difficulty
        claim_type: correct_result
        grounds: [calculations.markdown_price]
        excluded_because:
          difficulty_instance: boundary_precision_check / markdown_day_index_boundary_at_exactly_one_day
          rationale: "The day-index >= 1 boundary and the 25% markdown price are asserted by the named §1.8 instance."

      - name: commission_tiered_covered_by_difficulty
        claim_type: correct_result
        grounds: [calculations.commission_tiered]
        excluded_because:
          difficulty_instance: combinatorial_formula / commission_marginal_tiered_rate
          rationale: "The marginal tiered commission is asserted by the named §1.8 instance."

      - name: card_fee_rounding_covered_by_difficulty
        claim_type: precision
        grounds: [calculations.card_processing_fee]
        excluded_because:
          difficulty_instance: combinatorial_formula / card_fee_round_per_transaction_then_sum
          rationale: "Per-transaction round-then-sum ordering is asserted by the named §1.8 instance."

      - name: winning_bid_variant_covered_by_difficulty
        claim_type: variant_selection
        grounds: [calculations.winning_bid_price]
        excluded_because:
          difficulty_instance: dual_variant_calc / winning_bid_first_price_vs_second_price
          rationale: "FIRST_PRICE vs SECOND_PRICE resolution is asserted by the named §1.8 instance."

  # ------------------------------------------------------------ validations ---
  - section: validations
    instances:
      - name: bid_below_reserve_returns_bid_too_low
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_BID_TOO_LOW]"]
        distinguishing_aspect: "A bid of 5000 on a bid lot with reserve 10000 -> 422 ERR_BID_TOO_LOW."
        test_recipe:
          setup: ["project SALE_SETUP with a LISTED bid lot, reserve 10000"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Ke Owner", phone: "555-9009" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "9 I St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Stamp album", is_bid_lot: true, bid_mode: "FIRST_PRICE", list_price_cents: 20000, reserve_price_cents: 10000, min_increment_cents: 1000 }, as: Appraiser, captures: { lot_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_SETUP" }, as: SaleManager }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "LISTED" }, as: Appraiser }
          trigger:
            - { call: "POST /estate/bids", payload: { lot_id: "${lot_id}", amount_cents: 5000, bidder_name: "low" }, as: Cashier, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_BID_TOO_LOW"

      - name: below_reserve_blocks_fixed_sale
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_BELOW_RESERVE]"]
        distinguishing_aspect: "A fixed lot list 5000 reserve 5000 sold on day 1 (25% -> 3750 < reserve) -> 422 ERR_BELOW_RESERVE; lot stays LISTED."
        test_recipe:
          setup: ["LISTED lot list 5000 reserve 5000; sale OPEN; clock at day index 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /estate/clients", payload: { name: "Le Owner", phone: "555-9010" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "10 J St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Nightstand", list_price_cents: 5000, reserve_price_cents: 5000 }, as: Appraiser, captures: { lot_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_SETUP" }, as: SaleManager }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "POST /estate/crews", payload: { name: "Crew Z3" }, as: PlatformAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-03T00:00:00Z" }, as: SaleManager, captures: { se_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_LIVE" }, as: SaleManager }
            - { call: "PATCH /estate/sale-events/${se_id}", payload: { status: "OPEN" }, as: SaleManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /estate/transactions", payload: { sale_event_id: "${se_id}", lot_id: "${lot_id}", payment_method: "CASH" }, as: Cashier, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_BELOW_RESERVE"
            - "Lot.${lot_id}.status == LISTED"

      - name: sale_window_too_long_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SALE_WINDOW_TOO_LONG]"]
        distinguishing_aspect: "A single sale-event spanning 7 days (no crew overlap) -> 422 ERR_SALE_WINDOW_TOO_LONG (> 4-day max)."
        test_recipe:
          setup: ["a project and a free crew"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Me Owner", phone: "555-9011" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "11 K St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "POST /estate/crews", payload: { name: "Crew Z4" }, as: PlatformAdmin, captures: { crew_id: "$.data.id" } }
          trigger:
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-08T09:00:00Z" }, as: SaleManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SALE_WINDOW_TOO_LONG"

      - name: state_beats_fiscal_conflict_covered_by_difficulty
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_resale_below_reserve
          rationale: "The state-vs-fiscal priority ordering is asserted by the named §1.8 instance."

  # -------------------------------------------------------------- endpoints ---
  - section: endpoints
    instances:
      - name: projects_list_pagination_and_filter
        claim_type: listing
        grounds: [endpoints, entities.Project.fields.client_id]
        distinguishing_aspect: "GET /estate/projects?client_id=..&limit=2 over 3 same-client projects returns total_count==3 and has_more==true."
        test_recipe:
          setup: ["one client with three projects"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Ne Owner", phone: "555-9012" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "P1", estimated_total_value_cents: 1000 }, as: PlatformAdmin }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "P2", estimated_total_value_cents: 1000 }, as: PlatformAdmin }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "P3", estimated_total_value_cents: 1000 }, as: PlatformAdmin }
          trigger:
            - { call: "GET /estate/projects", payload: { client_id: "${cli_id}", limit: 2, offset: 0 }, as: PlatformAdmin }
          assert:
            - "response total_count == 3"
            - "response has_more == true"

  # ------------------------------------------------------------------ rbac ---
  - section: rbac
    instances:
      - name: appraiser_cannot_ring_transaction
        claim_type: unauthorized_operation
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /estate/transactions as Appraiser (a Cashier-exclusive op) -> 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["LISTED lot; sale OPEN"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /estate/clients", payload: { name: "Oe Owner", phone: "555-9013" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "12 L St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Kettle", list_price_cents: 3000, reserve_price_cents: 100 }, as: Appraiser, captures: { lot_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_SETUP" }, as: SaleManager }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "POST /estate/crews", payload: { name: "Crew Z5" }, as: PlatformAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-02T00:00:00Z" }, as: SaleManager, captures: { se_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_LIVE" }, as: SaleManager }
            - { call: "PATCH /estate/sale-events/${se_id}", payload: { status: "OPEN" }, as: SaleManager }
          trigger:
            - { call: "POST /estate/transactions", payload: { sale_event_id: "${se_id}", lot_id: "${lot_id}", payment_method: "CASH" }, as: Appraiser, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: client_cannot_patch_foreign_project
        claim_type: unauthorized_operation
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Client whose X-User-ID != Project.client_id cannot sign the contract (PROPOSED->CONTRACTED) -> 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["project owned by client A, sitting in PROPOSED; a second client B exists"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Owner A", phone: "555-9014" }, as: PlatformAdmin, captures: { cliA_id: "$.data.id" } }
            - { call: "POST /estate/clients", payload: { name: "Owner B", phone: "555-9015" }, as: PlatformAdmin, captures: { cliB_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cliA_id}", address: "13 M St", estimated_total_value_cents: 1000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
          trigger:
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cliB_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "Project.${proj_id}.status == PROPOSED"

      - name: segregation_of_duties_blocks_self_buyout
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.Lot.fields.researched_by_user_id]
        distinguishing_aspect: "approve-buyout by the same X-User-ID that researched the lot -> 403 ERR_SEGREGATION_OF_DUTIES; handling_type stays CONSIGNMENT."
        test_recipe:
          setup: ["project CONTRACTED with a lot RESEARCHED by user U1"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Pe Owner", phone: "555-9016" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "14 N St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Silverware", list_price_cents: 9000, reserve_price_cents: 100 }, as: Appraiser, as_user_id: "U1", captures: { lot_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "RESEARCHED", research_notes: "sterling" }, as: Appraiser, as_user_id: "U1" }
          trigger:
            - { call: "POST /estate/lots/${lot_id}/approve-buyout", payload: { buyout_price_cents: 4000 }, as: SaleManager, as_user_id: "U1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Lot.${lot_id}.handling_type == CONSIGNMENT"

      - name: unauthenticated_request_missing_auth_header_rejected
        claim_type: unauthorized_operation
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A write with the X-User-Role / X-User-ID headers omitted -> 401 ERR_UNAUTHENTICATED (the test issues POST /estate/clients with no auth headers)."
        test_recipe:
          setup: ["empty DB; the request under test carries NO X-User-Role/X-User-ID headers"]
          setup_api_calls: []
          trigger:
            - { call: "POST /estate/clients", payload: { name: "No Auth", phone: "555-0000" }, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"

  # ------------------------------------------- cross_cutting_complexity_layers ---
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_project_version_rejected_on_settlement
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[settlement-create-stale-project]", "errors[ERR_STALE_PROJECT_VERSION]"]
        distinguishing_aspect: "Settlement create with expected_project_version one behind the current Project.version -> 412 ERR_STALE_PROJECT_VERSION; project stays SETTLING."
        test_recipe:
          setup: ["project driven to SETTLING (no lots); caller holds a version one behind current"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Qe Owner", phone: "555-9017" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "15 O St", estimated_total_value_cents: 1000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_SETUP" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_LIVE" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SETTLING" }, as: SaleManager, captures: { proj_v: "$.data.version" } }
          trigger:
            - { call: "POST /estate/settlement-statements", payload: { project_id: "${proj_id}", expected_project_version: "${proj_v} - 1" }, as: SaleManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_PROJECT_VERSION"
            - "Project.${proj_id}.status == SETTLING"

      - name: project_version_increments_on_each_write
        claim_type: optimistic_concurrency
        grounds: [entities.Project.fields.status]
        distinguishing_aspect: "Project.version starts at 1 on create and is 2 after a single PATCH (ASSESSED)."
        test_recipe:
          setup: ["a freshly created project"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Re Owner", phone: "555-9018" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "16 P St", estimated_total_value_cents: 1000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
          trigger:
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
          assert:
            - "Project.${proj_id}.version == 2"

      - name: project_cancel_cascade_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.Project.transitions.to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / project_cancel_withdraws_lot_voids_bids
          rationale: "The multi-level cancel cascade is asserted end-to-end by the named §1.8 instance."

      - name: gross_sales_derived_reconciliation_covered_by_difficulty
        claim_type: derived_field_reconciliation
        grounds: [calculations.project_gross_sales]
        excluded_because:
          difficulty_instance: compensating_invariant / gross_sales_conserved_across_sale_and_void
          rationale: "Recompute of gross_sales_cents on record and on void is asserted by the named §1.8 instance."

  # ----------------------------------------------------------- consistency ---
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visible
        claim_type: immediate
        grounds: [entities.Project.fields.status]
        distinguishing_aspect: "A project created via POST is immediately readable via GET /estate/projects/{id} in the same sequence, with status LEAD."
        test_recipe:
          setup: ["one client"]
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Se Owner", phone: "555-9019" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "17 Q St", estimated_total_value_cents: 1000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
          trigger:
            - { call: "GET /estate/projects/${proj_id}", payload: {}, as: PlatformAdmin }
          assert:
            - "Project.${proj_id}.status == LEAD"
            - "Project.${proj_id}.address == '17 Q St'"
