      - name: rack_returns_from_suspect_to_intact_on_a_clean_audit
        claim_type: side_effect_execution
        grounds:
          - state_machines.CardRack.SUSPECT_to_INTACT
          - state_machines.RetailStore.HEIGHTENED_to_OPEN
          - calculations.rack_tamper_classification
          - calculations.store_floor_posture
        distinguishing_aspect: "SUSPECT is re-derived, not sticky (unlike TAMPERED): a rack at 9-of-10 becomes SUSPECT and drives its store to HEIGHTENED, then a clean 10-of-10 audit returns the rack to INTACT and the store to OPEN with suspect_rack_count back to 0 — no clear-tamper call is needed."
        test_recipe:
          setup:
            - "One RetailStore with floor_posture OPEN and one CardRack with expected_card_count 10, never audited."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Shrink Watch Store", region_code: "MW", address_line: "9 Shrink St" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-SW", expected_card_count: 10 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
          trigger:
            - call: "POST /card-racks/${rack1_id}/audits"
              payload: { observed_card_count: 9, seal_breaks_observed: 0 }
              as: PosAssociate
              captures: { state_a: $.data.tamper_state, missing_a: $.data.missing_card_count }
            - call: "GET /stores/${store1_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-48"
              captures: { floor_a: $.data.floor_posture, suspect_a: $.data.suspect_rack_count }
            - call: "POST /card-racks/${rack1_id}/audits"
              payload: { observed_card_count: 10, seal_breaks_observed: 0 }
              as: PosAssociate
              captures: { state_b: $.data.tamper_state, missing_b: $.data.missing_card_count }
            - call: "GET /stores/${store1_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-48"
              captures: { floor_b: $.data.floor_posture, suspect_b: $.data.suspect_rack_count }
          assert:
            - "${state_a} == SUSPECT — missing_card_count 1 clears the >= 1 branch but not the shrink threshold 3"
            - "${missing_a} == 1"
            - "${floor_a} == HEIGHTENED and ${suspect_a} == 1"
            - "${state_b} == INTACT — the classification is re-derived from the newest audit"
            - "${missing_b} == 0"
            - "${floor_b} == OPEN and ${suspect_b} == 0"
            - "RetailStore.${store1_id}.tampered_rack_count == 0 at both checkpoints"
            - "CardRack.${rack1_id}.observed_card_count == 10 and seal_breaks_observed == 0 and remediation_note == null"

      - name: alert_reopen_returns_a_dismissed_alert_to_open
        claim_type: cyclic
