      - name: corner_val_priority_between_spend_freeze_and_renovation_balance
        claim_type: Priority Ordering
        grounds:
          - validations.priority_18_ERR_PACKAGE_SPEND_FROZEN
          - validations.priority_43_ERR_INSUFFICIENT_TRANCHE_BALANCE
        distinguishing_aspect: "A single call can violate a state rule and a fiscal rule at once; the lower priority number must win, so the spend-axis error outranks the balance error."
        excluded_because:
          difficulty_instance: award_spend_axis_frozen_outranks_insufficient_renovation_balance
          rationale: "The difficulty instance constructs exactly this double violation on one /award call and then repairs only the state defect to prove the second error is genuinely armed underneath, which is the complete priority-ordering claim for this pair."

      - name: corner_val_priority_between_missing_assignment_and_room_under_renovation
        claim_type: Priority Ordering
        grounds:
          - validations.priority_22_ERR_SPACE_NOT_ASSIGNED_TO_FACULTY
          - validations.priority_23_ERR_SPACE_NOT_READY_FOR_INSTALL
        distinguishing_aspect: "Two adjacent install preconditions can fail together on the same room, and priority 22 must be reported ahead of priority 23."
        excluded_because:
          difficulty_instance: install_missing_assignment_outranks_room_under_renovation
          rationale: "The difficulty instance fails both checks on one /install call and then grants the assignment so the same call surfaces ERR_SPACE_NOT_READY_FOR_INSTALL, proving both the ordering and that the second rule was armed all along."

  - section: endpoints
    instances:
      - name: corner_ep_delete_scheduled_tranche_returns_204_and_recomputes_totals
        claim_type: Standard CRUD
        grounds:
          - endpoints.DELETE_/startup-packages/{id}/tranches/{tranche_id}
          - calculations.package_spend_rollup
        distinguishing_aspect: "The only destructive endpoint in the API: it answers 204 with no body at all (output is None, so nothing can be captured from it), hard-deletes the row rather than soft-deleting it, and re-runs package_spend_rollup so the package's computed totals shrink."
        test_recipe:
          setup:
            - "MINI-UNITS, then a DRAFT package of 20000000 carrying two SCHEDULED tranches: EQUIPMENT 12000000 and PERSONNEL 8000000. The package is never submitted, so it is still in DRAFT and both tranches are still SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { e1_col: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${e1_col}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { e1_dept: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${e1_col}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { e1_dean: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${e1_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { e1_fac: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${e1_fac}", package_kind: "INITIAL", dean_unit_id: "${e1_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { e1_pkg: $.data.id }
            - call: "POST /startup-packages/${e1_pkg}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 12000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { e1_keep: $.data.id }
            - call: "POST /startup-packages/${e1_pkg}/tranches"
              payload: { category: "PERSONNEL", fiscal_year: 2027, amount_cents: 8000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { e1_drop: $.data.id }
          trigger:
            - call: "DELETE /startup-packages/${e1_pkg}/tranches/${e1_drop}"
              payload: {}
              as: DeanOffice
          assert:
            - "response code is 204 with an empty body - no envelope, no data key, nothing to capture"
            - "GET /commitment-tranches/${e1_drop} now returns 404 ERR_TRANCHE_NOT_FOUND: the row is hard-deleted, not soft-deleted"
            - "GET /startup-packages/${e1_pkg}/tranches returns exactly one row, ${e1_keep}"
            - "StartupPackage.${e1_pkg}.total_committed_cents dropped from 20000000 to 12000000 and total_available_cents from 20000000 to 12000000"
            - "StartupPackage.${e1_pkg}.proposed_total_cents is still 20000000 - the negotiated headline is input-only and is NOT rewritten by the delete, which is exactly why a later /submit now fails package_tranche_consistency with ERR_TRANCHE_SUM_MISMATCH"
            - "spend_down_ratio is still 0.0 and no SpendTransaction row was written"
            - "a second DELETE of ${e1_drop} returns 404 ERR_TRANCHE_NOT_FOUND rather than a second 204"

      - name: corner_ep_spend_summary_computed_read_matches_the_ledger
        claim_type: Computed read
        grounds:
          - endpoints.GET_/startup-packages/{id}/spend-summary
          - calculations.package_spend_rollup
          - calculations.tranche_balance_identity
          - calculations.cost_share_split
        distinguishing_aspect: "A pure derived read with an inline output shape: it re-derives the whole spend-down position from the tranche rows and asserts the tranche budget identity in the response itself via balance_identity_holds, and its spend_down_ratio lands on 0.60005 - a value where ROUND_HALF_UP (0.6001) and banker's rounding or truncation (0.6000) disagree."
        test_recipe:
          setup:
            - "MINI-ACTIVE (one OPEN EQUIPMENT tranche of 20000000, shares 45/35/20) with a single EquipmentOrder of 12001000 placed, so the tranche holds encumbered 12001000 and available 7999000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
