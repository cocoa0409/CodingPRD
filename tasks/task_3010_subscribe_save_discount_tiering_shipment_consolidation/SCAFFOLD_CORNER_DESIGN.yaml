              as: Customer
              as_user_id: "${ko2_cust}"
              captures: { ko2_sub: $.data.id }
            - call: "POST /sns/subscriptions/${ko2_sub}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${ko2_cust}"
            - call: "POST /sns/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /sns/subscriptions/${ko2_sub}"
              payload: {}
              as: Customer
              as_user_id: "${ko2_cust}"
            - call: "GET /sns/subscriptions/${ko2_sub}/retention-offers"
              payload: {}
