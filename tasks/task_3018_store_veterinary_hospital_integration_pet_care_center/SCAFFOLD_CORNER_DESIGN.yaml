            - call: "POST /stores"
              payload: { store_code: "ST-1701", city: "Medford", state_code: "CA", service_bay_count: 2, hospital_capacity: 1 }
              as: PlatformAdmin
              captures: { s: $.data.id, s_v: $.data.version }
            - call: "POST /stores/members"
              payload: { full_name: "Ilse Baur", email: "ilse@example.com", state_code: "CA", home_store_id: "${s}" }
