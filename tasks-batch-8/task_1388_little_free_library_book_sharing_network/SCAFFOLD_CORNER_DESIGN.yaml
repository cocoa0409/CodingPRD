          assert:
            - "Rejected with error_id == ERR_DRIVE_WINDOW_INVALID (captured ${err}), HTTP 422"

      - name: invalid_enum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_INVALID_REQUEST]", "entities.MaintenanceRequest.fields.category"]
        distinguishing_aspect: "A category value outside the declared enum (FLOOD) is rejected with ERR_INVALID_REQUEST even when the target box is valid."
        test_recipe:
          setup: ["CHARTERED box exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Enum Tester", email: "enum@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
