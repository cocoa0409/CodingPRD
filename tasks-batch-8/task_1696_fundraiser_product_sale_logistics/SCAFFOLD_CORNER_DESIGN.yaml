            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
              captures: { gA: $.data.id }
          trigger:
            - { call: "POST /fundraiser/groups/${gA}/adjustments", payload: { amount_cents: 500, memo: "seed" }, as: Treasurer, as_user_id: "treas-1" }
            - { call: "POST /fundraiser/groups/${gA}/adjustments", payload: { amount_cents: -200, memo: "correction" }, as: Treasurer, as_user_id: "treas-1" }
            - call: "GET /fundraiser/groups/${gA}/ledger"
              payload: {}
              as: Treasurer
              captures: { e1_seq: "$.data[0].seq", e1_bal: "$.data[0].balance_after_cents", e2_seq: "$.data[1].seq", e2_bal: "$.data[1].balance_after_cents", e2_type: "$.data[1].entry_type" }
            - call: "GET /fundraiser/groups/${gA}"
              payload: {}
              as: Treasurer
              captures: { bal: $.data.proceeds_balance_cents }
          assert:
            - "e1_seq == 1 and e1_bal == 500"
            - "e2_seq == 2 and e2_bal == 300 and e2_type == MANUAL_ADJUSTMENT"
            - "bal == 300 (balance equals the last entry's balance_after_cents)"

