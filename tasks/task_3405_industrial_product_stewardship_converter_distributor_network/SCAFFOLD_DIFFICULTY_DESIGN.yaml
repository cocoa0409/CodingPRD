          trigger:
            - call: "POST /stewardship/phase-out-programs/${pop_id}/advance"
              payload: {}
              as: RegulatoryManager
              as_user_id: "rm-1"
          assert:
            - "PhaseOutProgram.${pop_id}.status == ENFORCED"
            - "link 1: JurisdictionClearance.${cl3_id}.status == SUSPENDED and Formulation.${f3_id}.active_clearance_count == 0"
            - "link 1 exclusion: successor clearance JurisdictionClearance.${cls_id}.status stays CLEARED (F-300R has no component >= 1000ppm of the substance)"
            - "link 2: Order.${o31_id}.compliance_status == FLAGGED (SHIPPED) and Order.${o32_id}.compliance_status == FLAGGED (PENDING)"
            - "link 3: RebateAccrual.${acc3_id}.excluded_order_count == 1 (only the SHIPPED order counts) while provisional_amount_cents == 1000 unchanged"

      - name: counterfeit_confirm_cascades_converter_suspension_and_order_flags
        grounds:
          - state_machines.CounterfeitReport.REPORTED_to_CONFIRMED_COUNTERFEIT
          - state_machines.Converter.AUTHORIZED_to_SUSPENDED
          - calculations.counterfeit_confirmation_sweep
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (disposition, not phase-out):
          CONFIRMED_COUNTERFEIT (1) suspends the implicated AUTHORIZED converter
          and (2) flags both the lot-matched order and the converter's other
          in-flight orders; a follow-on order then fails with
          ERR_CONVERTER_NOT_AUTHORIZED because the converter state moved.
        test_recipe:
          setup:
            - "Clock at 2026-10-01. Formulation ACTIVE; converter AUTHORIZED with SLITTING/DE authorization; converter-tier agreement; order O qty 4 lot L-9 ALLOCATED."
            - "Counterfeit report on (F, L-9) implicating the converter."
          setup_api_calls:
