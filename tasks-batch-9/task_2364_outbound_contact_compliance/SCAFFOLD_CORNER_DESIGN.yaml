      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          phone_number: '+18005550000'
          source: FTC_DNC_DOWNLOAD
          source_refreshed_at: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
        captures:
          sup_id: $.data.id
      - call: POST /compliance/suppression-entries/${sup_id}/remove
        payload:
          removal_reason: REGISTRY_DELISTING
        as: ComplianceOfficer
      trigger:
      - call: POST /compliance/suppression-entries/${sup_id}/remove
        payload:
          removal_reason: DATA_ERROR
        as: ComplianceOfficer
        captures:
          err_id: $.data.error_id
      assert:
