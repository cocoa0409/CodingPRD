            - "${st} == 'ACTIVE' AND ${elig} == false AND ${comp} == 85.00 — no events, so the scorecard sits on BASE_SCORE"
            - "${e_stale} == 'ERR_STALE_INSTALLER_VERSION' with HTTP 412 — priority 11 fires before the eligibility rule, even though the eligibility rule would also have failed"
            - "${e_elig} == 'ERR_REMOVAL_NOT_ELIGIBLE' with HTTP 409 — removal_eligible is false"
            - "Installer.${inst_id}.status == 'ACTIVE' AND removed_at == null AND version == ${iv} after both refusals"

  # ==========================================================================
  # SECTION — rbac  (claim-extraction-guide Table 7; role_model peer_roles)
  # ==========================================================================
  - section: rbac
    instances:

      - name: each_roles_exclusive_operations_are_closed_to_every_other_role
        claim_type: exclusive_operations
        grounds:
