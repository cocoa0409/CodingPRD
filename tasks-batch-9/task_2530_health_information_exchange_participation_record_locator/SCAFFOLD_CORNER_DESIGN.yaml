      - name: invoice_payment_settles_only_on_the_exact_remaining_balance
        claim_type: Conditional action
        grounds:
          - endpoints.POST_hie_participation_invoices_id_payment
          - endpoints.POST_hie_participation_invoices_id_administrative_transitions
          - validations.priority_33
          - errors.ERR_PAYMENT_AMOUNT_MISMATCH
          - state_machines.ParticipationInvoice.ISSUED_to_PAID
          - state_machines.ParticipationInvoice.ISSUED_to_DELINQUENT
        distinguishing_aspect: |
          The payment action is allowed only under one condition - amount_paid_cents equal to the
          remaining balance - so 267499 (one cent short) and 267501 (one cent over) are both refused with
          ERR_PAYMENT_AMOUNT_MISMATCH and leave the invoice ISSUED with amount_paid_cents 0.
          DECLARE_DELINQUENT is likewise conditional on the clock passing due_date, so at
          2026-09-01T00:00:00Z against a due_date of 2026-09-15T00:00:00Z it returns
          ERR_INVALID_STATE_TRANSITION. The exact payment then settles the invoice, drops the
          outstanding balance to 0, and a repeat payment hits ERR_TERMINAL_STATE because PAID is terminal.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with declared_annual_patient_volume 120000; the clock is advanced to 2026-09-01T00:00:00Z and one PROVISIONAL invoice of 267500 cents is ISSUED with due_date 2026-09-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Northgate Valley Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 120000, primary_contact_email: "hie@northgate.example" }
              as: HieAdmin
              captures: { pE5_id: $.data.id }
            - call: "POST /hie/participants/${pE5_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pE5_id}"
            - call: "POST /hie/participants/${pE5_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HieAdmin
            - call: "POST /hie/participants/${pE5_id}/participation-invoices"
              payload: { billing_period_start: "2026-08-01T00:00:00Z", billing_period_end: "2026-09-01T00:00:00Z", basis_variant: "PROVISIONAL", due_date: "2026-09-15T00:00:00Z" }
              as: HieAdmin
              captures: { invE5_id: $.data.id, invE5_total: $.data.total_cents, invE5_paid_0: $.data.amount_paid_cents }
          trigger:
            - call: "POST /hie/participation-invoices/${invE5_id}/payment"
              payload: { amount_paid_cents: 267499 }
              as: ParticipantAdmin
              as_user_id: "${pE5_id}"
              captures: { errE5_a: $.data.error_id }
            - call: "POST /hie/participation-invoices/${invE5_id}/payment"
              payload: { amount_paid_cents: 267501 }
              as: ParticipantAdmin
              as_user_id: "${pE5_id}"
              captures: { errE5_b: $.data.error_id }
            - call: "POST /hie/participation-invoices/${invE5_id}/administrative-transitions"
              payload: { action: "DECLARE_DELINQUENT", reason: "Premature delinquency declaration" }
              as: HieAdmin
              captures: { errE5_c: $.data.error_id }
            - call: "GET /hie/participation-invoices/${invE5_id}"
              payload: {}
              as: HieAdmin
              captures: { invE5_status_mid: $.data.status, invE5_paid_mid: $.data.amount_paid_cents }
            - call: "POST /hie/participation-invoices/${invE5_id}/payment"
              payload: { amount_paid_cents: 267500 }
              as: ParticipantAdmin
              as_user_id: "${pE5_id}"
              captures: { invE5_status_paid: $.data.status, invE5_paid_full: $.data.amount_paid_cents }
            - call: "GET /hie/participants/${pE5_id}"
              payload: {}
              as: HieAdmin
              captures: { pE5_balance: $.data.outstanding_balance_cents }
            - call: "POST /hie/participation-invoices/${invE5_id}/payment"
              payload: { amount_paid_cents: 267500 }
              as: ParticipantAdmin
              as_user_id: "${pE5_id}"
              captures: { errE5_d: $.data.error_id }
          assert:
            - "${invE5_total} == 267500"
            - "${invE5_paid_0} == 0"
            - "${errE5_a} == ERR_PAYMENT_AMOUNT_MISMATCH"
            - "${errE5_b} == ERR_PAYMENT_AMOUNT_MISMATCH"
            - "${errE5_c} == ERR_INVALID_STATE_TRANSITION"
            - "${invE5_status_mid} == ISSUED"
            - "${invE5_paid_mid} == 0"
            - "${invE5_status_paid} == PAID"
            - "${invE5_paid_full} == 267500"
            - "${pE5_balance} == 0"
            - "${errE5_d} == ERR_TERMINAL_STATE"
