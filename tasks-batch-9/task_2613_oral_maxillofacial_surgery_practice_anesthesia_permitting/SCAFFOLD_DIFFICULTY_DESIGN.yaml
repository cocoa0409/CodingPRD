      - name: sentinel_event_three_hop_probation_cascade
        grounds:
          - state_machines.AnesthesiaPermit.ACTIVE_to_PROBATION
          - state_machines.SurgicalCase.CLEARED_to_DEFERRED
          - validations[priority=41]
          - errors.ERR_CASE_NOT_CLEARED
          - entities.AdverseEvent.fields.reporting_deadline_at
        cascade_depth: 3
        distinguishing_aspect: |
          A different trigger with a different chain: filing a SENTINEL adverse event, not an
          inspection outcome.
            hop 1  the SENTINEL report drives AnesthesiaPermit ACTIVE -> PROBATION with
                   last_enforcement_reason SENTINEL_EVENT and a 30-day remediation window
            hop 2  because the permit is on PROBATION, Practice.sedation_privilege_state becomes
                   RESTRICTED, whose scope is narrower than SUSPENDED - only DEEP cases are hit
            hop 3  because the privilege is RESTRICTED, the CLEARED DEEP_SEDATION_GENERAL case
                   moves to clearance_status DEFERRED, so its later confirmation is refused by
                   validation priority 41 even though its evaluation is still VERIFIED
