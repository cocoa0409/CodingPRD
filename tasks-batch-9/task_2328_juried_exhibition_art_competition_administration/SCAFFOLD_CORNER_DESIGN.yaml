  # =========================================================================
  # SECTION: errors
  # Table 6: every code in §1.6 must be triggerable. Codes already driven by a
  # §1.8 instance appear as excluded_because stubs at the end of the section.
  # =========================================================================
  - section: errors
    instances:
      - name: unknown_ids_across_every_entity_family_return_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ARTIST_NOT_FOUND]
          - errors[ERR_ENTRY_NOT_FOUND]
          - errors[ERR_ARTWORK_NOT_FOUND]
          - errors[ERR_JUROR_NOT_FOUND]
          - errors[ERR_JURY_ROUND_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_WALL_SEGMENT_NOT_FOUND]
          - errors[ERR_AWARD_NOT_FOUND]
          - errors[ERR_SALE_NOT_FOUND]
          - errors[ERR_SCORE_NOT_FOUND]
        distinguishing_aspect: "Each entity family owns its own 404 code: a syntactically valid but unknown id must produce the code named after that family, never a generic 404 and never ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty store apart from the logical clock; every id below is a well-formed UUID that was never issued."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
          trigger:
            - { call: "GET /artists/00000000-0000-4000-8000-000000000001", payload: {}, as: CallManager, captures: { e_artist: $.data.error_id } }
            - { call: "GET /entries/00000000-0000-4000-8000-000000000010", payload: {}, as: CallManager, captures: { e_entry: $.data.error_id } }
            - { call: "GET /artworks/00000000-0000-4000-8000-000000000002", payload: {}, as: Registrar, captures: { e_artwork: $.data.error_id } }
            - { call: "GET /jurors/00000000-0000-4000-8000-000000000003", payload: {}, as: JuryChair, captures: { e_juror: $.data.error_id } }
            - { call: "GET /jury-rounds/00000000-0000-4000-8000-000000000004", payload: {}, as: JuryChair, captures: { e_round: $.data.error_id } }
            - { call: "GET /juror-assignments/00000000-0000-4000-8000-000000000005", payload: {}, as: JuryChair, captures: { e_asg: $.data.error_id } }
            - { call: "GET /wall-segments/00000000-0000-4000-8000-000000000006", payload: {}, as: Registrar, captures: { e_wall: $.data.error_id } }
            - { call: "GET /awards/00000000-0000-4000-8000-000000000007", payload: {}, as: JuryChair, captures: { e_award: $.data.error_id } }
            - { call: "GET /sales/00000000-0000-4000-8000-000000000008", payload: {}, as: FinanceOfficer, captures: { e_sale: $.data.error_id } }
            - { call: "GET /scores/00000000-0000-4000-8000-000000000009", payload: {}, as: JuryChair, captures: { e_score: $.data.error_id } }
          assert:
            - "each call returns HTTP 404 with the envelope error_id set, in order: ERR_ARTIST_NOT_FOUND, ERR_ENTRY_NOT_FOUND, ERR_ARTWORK_NOT_FOUND, ERR_JUROR_NOT_FOUND, ERR_JURY_ROUND_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_WALL_SEGMENT_NOT_FOUND, ERR_AWARD_NOT_FOUND, ERR_SALE_NOT_FOUND, ERR_SCORE_NOT_FOUND"
            - "every response carries the standard envelope with data == null and a human-readable message"

      - name: entity_state_invalid_codes_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ENTRY_STATE_INVALID]
          - errors[ERR_ARTWORK_STATE_INVALID]
          - errors[ERR_JURY_ROUND_STATE_INVALID]
          - errors[ERR_ASSIGNMENT_STATE_INVALID]
        distinguishing_aspect: "Four separate 409 codes must not collapse into one: the entity whose state blocks the call decides the code, so a re-submit is ENTRY, an install of an unplanned work is ARTWORK, a second OPEN is JURY_ROUND and a second cancel is ASSIGNMENT."
        test_recipe:
          setup: ["Exhibition OPEN_FOR_ENTRIES; entry submitted (PENDING_FEE) with one imaged work; later the exhibition reaches JURYING with a confirmed juror, an OPEN round and a booked assignment."]
