scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: deposit_credit_provisional_vs_final_diverge_on_same_ticket
        grounds:
          - calculations.deposit_credit_amount
          - entities.DepositTicket.fields.provisional_credit_cents
          - entities.DepositTicket.fields.final_settlement_cents
          - entities.DepositTicket.fields.settlement_delta_cents
          - state_machines.DepositTicket.VERIFIED_to_PROVISIONAL_CREDITED
          - state_machines.DepositTicket.SETTLEMENT_READY_to_SETTLED
        distinguishing_aspect: |
          This instance lives in the DepositTicket money-accounting domain: for one
          unchanged set of bags the PROVISIONAL variant reads declared amounts with a
          2% STANDARD-tier haircut and yields 205800, while the FINAL variant reads
          counted settlement amounts net of the volume-discounted processing fee and
          yields 209485 — a 3685 gap persisted as settlement_delta_cents.
        test_recipe:
          setup:
            - "Vault CV-01 OPEN; CustomerAccount ACC-1001 tier STANDARD, status ACTIVE, all balances 0."
            - "CountingMachine SORT-A of type CURRENCY_SORTER on that vault, status AVAILABLE."
            - "DepositTicket MAN-001 with declared_bag_count 2, both bags custody_status VAULT_RECEIVED, ticket VERIFIED then PROVISIONAL_CREDITED at 205800."
            - "Bag S-0001 declared 100000 counted 100000 over 100 notes; bag S-0002 declared 110000 counted 110000 over 300 notes; both count_status COUNTED, ticket auto-advanced to SETTLEMENT_READY with processing_fee_total_cents 515 and material_variance_open_count 0."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-01", name: "Central Cash Vault" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { vault_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-1001", customer_name: "Northside Grocers", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { acct_id: $.data.id }
            - call: "POST /cash-vault/counting-machines"
              payload: { vault_id: "${vault_id}", machine_code: "SORT-A", machine_type: "CURRENCY_SORTER", status: "AVAILABLE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { mach_id: $.data.id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${acct_id}", vault_id: "${vault_id}", courier_manifest_number: "MAN-001", declared_bag_count: 2 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { ticket_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${ticket_id}", seal_number: "S-0001", bag_type: "CURRENCY", declared_amount_cents: 100000, declared_note_count: 100, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { bag1_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${ticket_id}", seal_number: "S-0002", bag_type: "CURRENCY", declared_amount_cents: 110000, declared_note_count: 300, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { bag2_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags/${bag1_id}/custody-events"
              payload: { event_type: "PICKUP", location_code: "SITE-CUST", observed_seal_number: "S-0001" }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/sealed-bags/${bag1_id}/custody-events"
              payload: { event_type: "VAULT_RECEIPT", location_code: "CV-01-DOCK", observed_seal_number: "S-0001" }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/sealed-bags/${bag2_id}/custody-events"
              payload: { event_type: "PICKUP", location_code: "SITE-CUST", observed_seal_number: "S-0002" }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/sealed-bags/${bag2_id}/custody-events"
              payload: { event_type: "VAULT_RECEIPT", location_code: "CV-01-DOCK", observed_seal_number: "S-0002" }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/deposit-tickets/${ticket_id}/verify"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/deposit-tickets/${ticket_id}/provisional-credit"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { prov_credit: $.data.provisional_credit_cents }
            - call: "GET /cash-vault/sealed-bags/${bag1_id}"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { bag1_v: $.data.version }
            - call: "POST /cash-vault/count-sessions"
              payload: { sealed_bag_id: "${bag1_id}", counting_machine_id: "${mach_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_sealed_bag_version: "${bag1_v}" }
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { sess1_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags/${bag1_id}/custody-events"
              payload: { event_type: "OPEN", location_code: "CV-01-FLOOR", observed_seal_number: "S-0001" }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/count-sessions/${sess1_id}/start"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/count-sessions/${sess1_id}/complete"
              payload: { counted_amount_cents: 100000, counted_note_count: 100, counted_coin_weight_grams: 0, lots: [ { category: "FIT", denomination_cents: 1000, note_count: 100 } ] }
              as: VaultTeller
              as_user_id: "u-tel-2"
            - call: "GET /cash-vault/sealed-bags/${bag2_id}"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { bag2_v: $.data.version }
            - call: "POST /cash-vault/count-sessions"
              payload: { sealed_bag_id: "${bag2_id}", counting_machine_id: "${mach_id}", window_start: "2026-08-03T10:15:00Z", window_end: "2026-08-03T11:00:00Z", expected_sealed_bag_version: "${bag2_v}" }
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { sess2_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags/${bag2_id}/custody-events"
              payload: { event_type: "OPEN", location_code: "CV-01-FLOOR", observed_seal_number: "S-0002" }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/count-sessions/${sess2_id}/start"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/count-sessions/${sess2_id}/complete"
              payload: { counted_amount_cents: 110000, counted_note_count: 300, counted_coin_weight_grams: 0, lots: [ { category: "FIT", denomination_cents: 500, note_count: 200 }, { category: "UNFIT", denomination_cents: 100, note_count: 100 } ] }
              as: VaultTeller
              as_user_id: "u-tel-2"
          trigger:
            - call: "POST /cash-vault/deposit-tickets/${ticket_id}/settle"
              payload: {}
              as: VaultManager
              as_user_id: "u-mgr-1"
          assert:
            - "${prov_credit} == 205800"
            - "DepositTicket.${ticket_id}.final_settlement_cents == 209485"
            - "DepositTicket.${ticket_id}.settlement_delta_cents == 3685"
            - "DepositTicket.${ticket_id}.provisional_credit_cents == 0"
            - "DepositTicket.${ticket_id}.status == SETTLED"
            - "CustomerAccount.${acct_id}.ledger_balance_cents == 209485"
            - "CustomerAccount.${acct_id}.provisional_credit_cents == 0"
            - "CustomerAccount.${acct_id}.available_balance_cents == 209485"

      - name: customer_risk_grade_settled_only_vs_point_in_time_diverge
        grounds:
          - calculations.customer_risk_grade
          - entities.CustomerAccount.fields.risk_score
          - entities.CustomerAccount.fields.risk_grade
          - endpoints.GET_/cash-vault/customer-accounts/{id}/statement
        distinguishing_aspect: |
          This instance lives in the CustomerAccount risk-scoring domain, not the
          ticket money domain: with the same stored rows the persisted SETTLED_ONLY
          variant reads only the one SETTLED ticket and scores 100.00 grade A, while
          the POINT_IN_TIME variant on the statement also reads the SETTLEMENT_READY
          ticket's 120000 variance and scores 40.00 grade C.
        test_recipe:
          setup:
            - "Vault CV-02 OPEN, CustomerAccount ACC-2001 tier STANDARD, machine SORT-B CURRENCY_SORTER."
            - "Ticket MAN-201 (1 bag, declared 100000, counted 100000, variance 0) fully SETTLED; CustomerAccount.risk_score persisted at 100.00 grade A, ledger_balance_cents 99746."
