            - { call: "GET /oncology/billing-claims/${clm}", payload: {}, as: BillingCoordinator, as_user_id: "bill_a", captures: { clm_st: $.data.status, clm_final: $.data.final_total_cents } }
          assert:
            - "st == ADAPTATION_REQUIRED (10.0% weight loss triggers)"
            - "pl_st == SUPERSEDED (hop 1: course mutation superseded the ACTIVE plan)"
            - "FractionSession.${f1}.status == DELIVERED (untouched) and FractionSession.${f2}/${f3}.status == CANCELLED with cancellation_reason ADAPTATION (hop 2)"
            - "clm_st == DRAFT (hop 3: the cancelled billable schedule auto-reopened the FINALIZED claim)"
            - "clm_final == 369000 (monetary totals retained verbatim across the auto-reopen)"

      - name: machine_down_cascade_sessions_interruption_course_counter
