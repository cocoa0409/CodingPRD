# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3151_air_hub_sort_operations_next_day_commitment
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7 — every testable claim the
# scaffold declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already
# exercise. Corners §1.8 already covers appear as `excluded_because:` stubs
# with no test_recipe.
#
# Shared fixture anchors (same literals as §1.8; see the §1.8 preamble for the
# clock convention and the derived thresholds):
#   Clock -> hub minute: (UTC hour*60 + minute) + 1440 when the UTC time is
#     strictly before 12:00Z. 23:00Z -> 1380; 23:20Z -> 1400; 23:35Z -> 1415;
#     23:50Z -> 1430; 00:00Z -> 1440; 00:30Z -> 1470; 01:00Z -> 1500;
#     01:10Z -> 1510; 01:30Z -> 1530; 01:40Z -> 1540; 02:00Z -> 1560;
#     02:01Z -> 1561; 02:21Z -> 1581; 02:40Z -> 1600; 02:50Z -> 1610;
#     04:01Z -> 1681; 06:01Z -> 1801.
#   SDF hub window 1380-1560; thresholds 360000 (CONGESTED >) and 900000.
#   Shift N-A 1380-1560, headcount 40, productivity 4200, forecast 380000,
#     capacity 504000, RED needs live > 504000, SATURATED needs variance
#     >= 0.15 (live >= 437000), GREEN needs |variance| < 0.10.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: hub_create_returns_every_declared_field_and_starts_open
        claim_type: Creation
        grounds:
          - entities.Hub
          - endpoints.POST_/airhub/hubs
        distinguishing_aspect: "A hub created with only its code, name and window comes back 201 with posture OPEN, contingency_mode false, ops_run_index 0, live_planned_package_total 0 and version 1 — none of those five is client-supplied."
        test_recipe:
          setup:
            - "Clock 23:00Z (minute 1380). Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T23:00:00Z" }
              as: HubOpsManager
          trigger:
            - call: "POST /airhub/hubs"
              payload: { iata_code: "SDF", name: "Worldport Louisville", sort_window_open_minutes: 1380, sort_window_close_minutes: 1560 }
              as: HubOpsManager
              captures: { hub_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Hub.${hub_id}.iata_code == \"SDF\" and name == \"Worldport Louisville\""
            - "Hub.${hub_id}.posture == OPEN"
            - "Hub.${hub_id}.contingency_mode == false and ops_run_index == 0"
            - "Hub.${hub_id}.live_planned_package_total == 0 and alternate_hub_id is null"
            - "Hub.${hub_id}.version == 1 and meta.api_request_id is present"

      - name: package_get_round_trips_all_four_state_planes
        claim_type: Retrieval
        grounds:
          - entities.Package
          - endpoints.GET_/airhub/packages/{package_id}
        distinguishing_aspect: "Every declared Package field round-trips through GET exactly as stored, including the four independent status planes, the null last_sort_minutes and the commitment_cutoff_minutes of 1560 derived from NEXT_DAY_AIR."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, lanes P-01 and S-01, BANK_A with N701UP landed and unloaded, shift N-A, one GENERAL package rated 30000 grams."
          setup_api_calls:
            - *c_clock
            - &c_alt
              call: "POST /airhub/hubs"
              payload: { iata_code: "IND", name: "Indianapolis Gateway", sort_window_open_minutes: 1380, sort_window_close_minutes: 1560 }
              as: HubOpsManager
              captures: { ind_hub_id: $.data.id }
            - &c_hub
              call: "POST /airhub/hubs"
              payload: { iata_code: "SDF", name: "Worldport Louisville", sort_window_open_minutes: 1380, sort_window_close_minutes: 1560, alternate_hub_id: "${ind_hub_id}" }
              as: HubOpsManager
              captures: { hub_id: $.data.id }
            - &c_lane_p1
              call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - &c_lane_s1
              call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "S-01", lane_kind: "SECONDARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_s1_id: $.data.id }
            - &c_bank
              call: "POST /airhub/banks"
              payload: { hub_id: "${hub_id}", bank_code: "BANK_A", scheduled_start_minutes: 1400, scheduled_end_minutes: 1520, hydraulic_crew_available: true }
              as: HubOpsManager
              captures: { bank_id: $.data.id }
            - &c_ac1
              call: "POST /airhub/aircraft"
              payload: { bank_id: "${bank_id}", tail_number: "N701UP", origin_station_code: "LAX", scheduled_arrival_minutes: 1395, capacity_weight_grams: 200000 }
              as: GatewayCoordinator
              captures: { ac1_id: $.data.id }
            - &c_ac2
              call: "POST /airhub/aircraft"
              payload: { bank_id: "${bank_id}", tail_number: "N702UP", origin_station_code: "ORD", scheduled_arrival_minutes: 1402, capacity_weight_grams: 200000 }
              as: GatewayCoordinator
              captures: { ac2_id: $.data.id }
            - &c_shift
              call: "POST /airhub/shifts"
              payload: { hub_id: "${hub_id}", shift_code: "N-A", start_minutes: 1380, end_minutes: 1560, headcount: 40, productivity_grams_per_operator_hour: 4200, forecast_volume_grams: 380000, certified_for_hazmat: true }
              as: SortSupervisor
              captures: { shift_id: $.data.id }
            - &c_clock1400
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T23:20:00Z" }
              as: HubOpsManager
            - &c_ac1_depart
              call: "POST /airhub/aircraft/${ac1_id}/depart-origin"
              payload: {}
              as: GatewayCoordinator
            - &c_ac1_land
              call: "POST /airhub/aircraft/${ac1_id}/land"
              payload: { inbound_weight_grams: 60000 }
              as: GatewayCoordinator
            - &c_bank_unload
              call: "POST /airhub/banks/${bank_id}/begin-unload"
              payload: {}
              as: SortSupervisor
            - &c_ac1_begun
              call: "POST /airhub/aircraft/${ac1_id}/begin-unload"
              payload: {}
              as: SortSupervisor
            - &c_ac1_done
              call: "POST /airhub/aircraft/${ac1_id}/complete-unload"
              payload: { unload_completed_minutes: 1401 }
              as: SortSupervisor
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-D-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 30000, dimension_weight_grams: 30000 }
              as: SortOperator
              captures: { pkg_d: $.data.id }
          trigger:
            - call: "GET /airhub/packages/${pkg_d}"
              payload: {}
              as: SortOperator
          assert:
            - "the response status is 200 and response_type is object"
            - "Package.${pkg_d}.induction_status == NOT_INDUCTED, sort_status == UNSORTED, commitment_status == COMMITTED, handling_status == NORMAL"
            - "Package.${pkg_d}.handling_posture == STANDARD and commitment_posture == COMMITTED_OK"
            - "Package.${pkg_d}.commitment_cutoff_minutes == 1560 and last_sort_minutes is null"
            - "Package.${pkg_d}.rated_weight_grams is null before induction and dimension_weight_grams == 30000"
            - "Package.${pkg_d}.assigned_lane_id, staged_feeder_id and buildup_id are all null"

      - name: packages_list_paginates_and_filters_across_four_state_planes
        claim_type: Listing
        grounds:
          - endpoints.GET_/airhub/packages
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three packages on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true while offset=2 returns the remaining row with has_more false, and the four status-plane filters plus the lane filter each narrow the set independently — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, lanes P-01 and S-01, BANK_A with N701UP landed and unloaded, shift N-A, three GENERAL packages rated 20000 grams each, all inducted, with the first primary-sorted onto P-01."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-E-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_e1: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-E-0002", commodity_class: "GENERAL", destination_hub_code: "ORD", service_level: "SECOND_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_e2: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-E-0003", commodity_class: "GENERAL", destination_hub_code: "SEA", service_level: "GROUND", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_e1}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_e2}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_e1}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
          trigger:
            - call: "GET /airhub/packages"
              payload: { hub_id: "${hub_id}", limit: 2, offset: 0 }
              as: SortSupervisor
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /airhub/packages"
              payload: { hub_id: "${hub_id}", limit: 2, offset: 2 }
              as: SortSupervisor
            - call: "GET /airhub/packages"
              payload: { hub_id: "${hub_id}", assigned_lane_id: "${lane_p1_id}" }
              as: SortSupervisor
            - call: "GET /airhub/packages"
              payload: { hub_id: "${hub_id}", sort_status: "PRIMARY_SORTED" }
              as: SortSupervisor
            - call: "GET /airhub/packages"
              payload: { hub_id: "${hub_id}", induction_status: "INDUCTED" }
              as: SortSupervisor
            - call: "GET /airhub/packages"
              payload: { hub_id: "${hub_id}", service_level: "GROUND" }
              as: SortSupervisor
          assert:
            - "the first page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "the second page returns exactly 1 row with total_count == 3 and has_more == false"
            - "the assigned_lane_id filter returns exactly 1 row, the package on P-01"
            - "the sort_status=PRIMARY_SORTED filter returns exactly 1 row and the induction_status=INDUCTED filter returns exactly 2 rows"
            - "a request with no limit and no offset returns 3 rows, so limit defaults to 10 and offset to 0"
            - "response_type is array on every one of these reads"

      - name: hub_get_with_an_unknown_id_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/airhub/hubs/{hub_id}
          - errors.ERR_RESOURCE_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id in a path segment produces the 404 ERR_RESOURCE_NOT_FOUND, not a 400 and not a 409."
        test_recipe:
          setup:
            - "Clock 1400. No hub has been created."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /airhub/hubs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HubOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and ${err} == ERR_RESOURCE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: package_create_missing_planned_weight_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Package.fields.planned_weight_grams
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "planned_weight_grams is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check and leaves no Package row behind."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, BANK_A with N701UP landed and unloaded, shift N-A."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
          trigger:
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-F-9001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /airhub/packages?hub_id=${hub_id} returns 0 rows"
            - "Hub.${hub_id}.live_planned_package_total == 0"

      - name: buildup_create_omitting_the_optional_fields_defaults_them_and_load_move_id_is_required
        claim_type: Defaults
        grounds:
          - entities.Buildup.fields.hazardous_cap_grams
          - entities.Buildup.fields.requires_container
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "hazardous_cap_grams and requires_container each declare a default, so omitting both stores 0 and false rather than null, while load_move_id has no default and its omission is a 400 ERR_INVALID_REQUEST on the same endpoint."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, BANK_A with N701UP landed and unloaded, N702UP the outbound aircraft, shift N-A, and a load move M."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_ac2
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/moves"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", weight_limit_grams: 400000 }
              as: LoadPlanner
              captures: { move_id: $.data.id }
          trigger:
            - call: "POST /airhub/buildups"
              payload: { hub_id: "${hub_id}", load_move_id: "${move_id}", destination_gateway_code: "LAX", container_limit_grams: 70000 }
              as: LoadPlanner
              captures: { bd_id: $.data.id }
            - call: "POST /airhub/buildups"
              payload: { hub_id: "${hub_id}", destination_gateway_code: "ORD", container_limit_grams: 70000 }
              as: LoadPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the first creation returns 201 with Buildup.${bd_id}.hazardous_cap_grams == 0 and requires_container == false"
            - "Buildup.${bd_id}.rated_weight_grams == 0 and hazardous_weight_grams == 0 and status == OPEN"
            - "Buildup.${bd_id}.load_plan_tier == UNDER_CAPACITY"
            - "the second creation omitting load_move_id returns 400 with ${err} == ERR_INVALID_REQUEST"
            - "GET /airhub/buildups?hub_id=${hub_id} returns exactly 1 row"

      - name: hub_create_rejects_a_client_supplied_computed_posture
        claim_type: Computed Fields
        grounds:
          - entities.Hub.fields.posture
          - entities.Hub.fields.live_planned_package_total
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "posture and live_planned_package_total are source: computed and are not declared inputs, so a client that tries to pin posture is rejected as an unknown field rather than having its value silently ignored and overwritten."
        test_recipe:
          setup:
            - "Clock 1400. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /airhub/hubs"
              payload: { iata_code: "SDF", name: "Worldport Louisville", sort_window_open_minutes: 1380, sort_window_close_minutes: 1560, posture: "LOCKDOWN", live_planned_package_total: 999999 }
              as: HubOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and ${err} == ERR_INVALID_REQUEST"
            - "no Hub was persisted: GET /airhub/hubs returns 0 rows"
            - "the rejected fields are exactly the two computed ones, so an unknown-field rejection is not the same claim as a defaulted omission"

      - name: package_create_starts_on_four_system_set_state_planes
        claim_type: System Fields
        grounds:
          - entities.Package.fields.induction_status
          - entities.Package.fields.sort_status
          - entities.Package.fields.commitment_status
          - entities.Package.fields.handling_status
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "All four status planes are source: system and start at fixed initial members regardless of any client input, and supplying any of them is a 400 unknown-field rejection, so no path lets a client seed a package mid-lifecycle."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, BANK_A with N701UP landed and unloaded, shift N-A."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
          trigger:
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-H-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_h: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-H-0002", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000, sort_status: "LOADED", commitment_status: "DOWNGRADED" }
              as: SortOperator
              captures: { err: $.data.error_id }
          assert:
            - "the clean creation returns 201 with induction_status NOT_INDUCTED, sort_status UNSORTED, commitment_status COMMITTED, handling_status NORMAL"
            - "Package.${pkg_h}.version == 1 regardless of any supplied version"
            - "the second creation is refused with ${err} == ERR_INVALID_REQUEST"
            - "no package carries sort_status LOADED: GET /airhub/packages?sort_status=LOADED returns 0 rows"

      - name: package_create_with_an_out_of_enum_service_level_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Package.fields.service_level
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "service_level is a closed three-member enum, so SAME_DAY_AIR is rejected at 400 ERR_INVALID_REQUEST rather than silently defaulting to NEXT_DAY_AIR or being coerced into the cutoff formula."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, BANK_A with N701UP landed and unloaded, shift N-A."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
          trigger:
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-J-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "SAME_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /airhub/packages?hub_id=${hub_id} returns 0 rows"

      - name: ops_run_is_immutable_and_terminal_after_it_advances
        claim_type: Immutability
        grounds:
          - entities.OpsRun
          - state_machines.OpsRun.transitions.HELD_to_ADVANCED
          - endpoints.GET_/airhub/ops-runs/{ops_run_id}
        distinguishing_aspect: "OpsRun declares common_fields: false, so it carries only id and created_at — no version and no updated_at — and once ADVANCED its single remaining transition is unavailable, so a second advance is ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, BANK_A with N701UP landed and unloaded, shift N-A."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/hubs/${hub_id}/declare-contingency"
              payload: {}
              as: WeatherOfficer
            - call: "POST /airhub/hubs/${hub_id}/run-ops"
              payload: { minute_of_day: 1400, level: "MAJOR" }
              as: HubOpsManager
              captures: { ops_run_id: $.data.id, ops_run_created: $.data.created_at }
          trigger:
            - call: "GET /airhub/ops-runs/${ops_run_id}"
              payload: {}
              as: HubOpsManager
            - call: "POST /airhub/ops-runs/${ops_run_id}/advance"
              payload: {}
              as: HubOpsManager
              captures: { verdict: $.data.verdict }
            - call: "POST /airhub/ops-runs/${ops_run_id}/advance"
              payload: {}
              as: HubOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "the checkpoint reads run_index == 1, minute_of_day == 1400, level == MAJOR and verdict == HELD"
            - "the read carries id and created_at (${ops_run_created}) and no version and no updated_at field at all"
            - "the first advance reports ${verdict} == ADVANCED"
            - "the second advance returns 409 with ${err} == ERR_INVALID_STATE"
            - "Hub.${hub_id}.ops_run_index == 1 after the single successful advance, so the second call did not double-count"

      - name: aircraft_create_with_an_unknown_bank_returns_resource_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=3]
          - endpoints.POST_/airhub/aircraft
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "The bank_id foreign key is validated at priority 3 before the row is written, so an unallocated parent reference fails with the shared 404 rather than orphaning an aircraft."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub exists; no bank has been created on it."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
