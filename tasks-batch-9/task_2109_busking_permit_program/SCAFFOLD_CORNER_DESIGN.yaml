        claim_type: error_triggerable
        grounds: ["errors[ERR_QUIET_HOURS_VIOLATION]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_quiet_hours_outranks_constraint_pitch_slot_overlap
          rationale: "Asserted as the 422 winner of that instance's dual-failure booking request."

      - name: corner_error_pitch_slot_overlap
        claim_type: error_triggerable
        grounds: ["errors[ERR_PITCH_SLOT_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pitch_changeover_buffer_rejects_back_to_back_sessions
