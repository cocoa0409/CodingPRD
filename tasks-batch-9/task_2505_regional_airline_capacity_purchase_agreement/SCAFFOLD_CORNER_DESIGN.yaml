              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "AIRPORT_FEES", estimated_amount_usd: 10000.00 }
              as: RegionalOpsController
              as_user_id: "ops-1"
              captures: { c1: $.data.id }
            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "INSURANCE", estimated_amount_usd: 5000.00 }
              as: RegionalOpsController
              as_user_id: "ops-1"
              captures: { c2: $.data.id }
            - call: "POST /cpa/pass-through-claims/${c1}/submit-actual"
              payload: { actual_amount_usd: 10500.00, supporting_doc_ref: "DOC-C1" }
              as: RegionalOpsController
              as_user_id: "ops-1"
            - call: "POST /cpa/pass-through-claims/${c2}/submit-actual"
