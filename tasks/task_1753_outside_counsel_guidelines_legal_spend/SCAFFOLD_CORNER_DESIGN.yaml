      - name: forecast_put_creates_then_updates
        claim_type: standard_crud
        grounds: [endpoints: "PUT /legal-departments/{deptId}/matters/{matterId}/forecast"]
        distinguishing_aspect: "PUT forecast is upsert: first call creates the 1:1 MatterForecast; second call updates lifecycle_estimate_cents in place and recomputes variance_cents."
        test_recipe:
          setup: ["matter ENGAGED"]
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
