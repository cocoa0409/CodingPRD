              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/pay"
              payload: {}
              as: BillingClerk
            - call: "POST /boutique/orders/${order_id}/fulfill"
              payload: {}
              as: StoreManager
            - call: "GET /boutique/reminders"
              payload: { order_line_id: "${line_id}" }
              as: StoreManager
              captures: { reminder_id: "$.data[0].id" }
            - call: "POST /boutique/exchanges"
              payload: { order_id: "${order_id}", order_line_id: "${line_id}", item_condition: "SEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { exch_id: $.data.id }
            - call: "POST /boutique/exchanges/${exch_id}/approve"
              payload: {}
              as: StoreManager
          trigger:
            - call: "GET /boutique/reminders/${reminder_id}"
              payload: {}
              as: StoreManager
              captures: { st: $.data.status }
          assert:
            - "st == CANCELLED"

      - name: appointment_version_increments_on_mutation
        claim_type: derived_field_reconciliation
        grounds: [entities.FittingAppointment.fields.version]
        distinguishing_aspect: "A freshly booked appointment has version 1; after one confirm mutation version is 2."
        test_recipe:
          setup: ["A booked appointment."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Ver Sion", email: "ver.sion@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/fitters"
              payload: { full_name: "Ver Fitter" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /boutique/rooms"
              payload: { room_name: "Ver Room", capacity: 5 }
              as: StoreManager
              captures: { room_id: $.data.id }
            - call: "POST /boutique/appointments"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}", room_id: "${room_id}", fitting_type: "STANDARD", scheduled_start: "2026-07-14T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /boutique/appointments/${appt_id}/confirm"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
              captures: { v: $.data.version }
          assert:
            - "v == 2"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_orders_pagination_has_more
        claim_type: Listing
        grounds: [entities.Order.fields.customer_id]
        distinguishing_aspect: "With two orders for one customer and limit=1, GET /boutique/orders returns total_count 2 and has_more true."
        test_recipe:
          setup: ["One customer with two DRAFT orders."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Pag Ing", email: "pag.ing@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /boutique/orders"
              payload: { customer_id: "${cust_id}", limit: 1, offset: 0 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "response.meta pagination total_count == 2"
            - "response.meta pagination has_more == true"
            - "data length == 1"

      - name: filtered_list_skus_by_product_fk_reverse
        claim_type: Retrieval
        grounds: [entities.SKU.fields.product_id]
        distinguishing_aspect: "GET /boutique/skus?product_id returns exactly the two SKUs created for that product (FK reverse-reachability)."
        test_recipe:
          setup: ["A product with two SKUs."]
          setup_api_calls:
            - call: "POST /boutique/products"
              payload: { style_name: "Fk Bra", brand: "Panache", category: "EVERYDAY_BRA", base_price_cents: 2000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 34, cup_size: "C", sku_code: "FK-34C", initial_stock: 2 }
              as: StoreManager
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 36, cup_size: "C", sku_code: "FK-36C", initial_stock: 2 }
              as: StoreManager
          trigger:
            - call: "GET /boutique/skus"
              payload: { product_id: "${prod_id}" }
              as: StoreManager
          assert:
            - "data length == 2"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_insufficient_stock_covered_by_difficulty
        claim_type: Violation → Error
        grounds: ["errors[ERR_INSUFFICIENT_STOCK]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / place_zero_available_stock_edge
          rationale: "ERR_INSUFFICIENT_STOCK is the asserted outcome of the named §1.8 zero-stock boundary instance."

      - name: error_fitter_not_certified_covered_by_difficulty
        claim_type: Violation → Error
        grounds: ["errors[ERR_FITTER_NOT_CERTIFIED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / confirm_postsurgical_requires_certified_fitter
          rationale: "ERR_FITTER_NOT_CERTIFIED is the asserted outcome of the named §1.8 cross-entity instance."

      - name: error_room_at_capacity_covered_by_difficulty
        claim_type: Violation → Error
        grounds: ["errors[ERR_ROOM_AT_CAPACITY]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / room_capacity_overlap_reject
          rationale: "ERR_ROOM_AT_CAPACITY is the asserted outcome of the named §1.8 room-overlap instance."
