            - "CompetitorProductLink.${l_id}.status == PROPOSED and review_round == 0"
            - "PriceObservation.${o_id}.status == ACTIVE and void_reason == null"
            - "PriceChangeOrder.${ord_id}.status == DRAFT and signage_status == NOT_REQUIRED and label_batch_id == null"
            - "PriceChangeOrder.${ord_id}.proposed_price_cents == 19000, floor_binding == false, authored_by_user_id == analyst-1, decided_by_user_id == null"
            - "LabelPrintBatch.${b_id}.status == SCHEDULED, item_count == 0, queued_order_ids == []"
            - "Store.${s_id}.label_slots_used_today == 0 and label_slots_remaining_today == 5 — an empty SCHEDULED batch consumes no slot"

      - name: corner_void_observation_transitions_active_to_voided
        claim_type: valid_transition
        grounds: [state_machines.PriceObservation.transitions.ACTIVE_to_VOIDED, "endpoints.POST_/pricing/observations/{id}/void", calculations.effective_competitor_price]
        distinguishing_aspect: "The declared ACTIVE -> VOIDED edge fires and its documented side effect runs: the link that had one qualifying observation falls back to data_status INSUFFICIENT with null latest_effective_price_cents, null selected_observation_id and null gap_bp."
