              payload: { actual_deposit_cents: 100000 }
              as: TreasuryOfficer
            - call: "POST /portal/settlement-batches/${batch_id}/reconcile"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/agencies/${ag_id}/offboard"
              payload: {}
              as: PlatformAdmin
          assert:
            - "first offboard: 409 and err_id == ERR_OFFBOARD_BLOCKED (transaction CAPTURED = unsettled exposure)"
            - "after the batch reaches RECONCILED, offboard returns 200 and Agency.${ag_id}.status == OFFBOARDED"
            - "the offboard cascade leaves ServiceCatalogItem.${svc_id} DEACTIVATED and the consumed quote untouched"

      - name: unknown_ids_return_resource_specific_not_found
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SERVICE_NOT_FOUND
          - errors.ERR_BATCH_NOT_FOUND
          - errors.ERR_ACCOUNT_NOT_FOUND
          - errors.ERR_AUTHORIZATION_NOT_FOUND
