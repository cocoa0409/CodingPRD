        distinguishing_aspect: "The action endpoint both writes its payload field and drives the transition: sampled_unit_count is stored and status moves OPENED -> SAMPLED in one call, while sampled_unit_count 0 is refused by the >= 1 constraint even though the field's create-time default is 0."
        test_recipe:
