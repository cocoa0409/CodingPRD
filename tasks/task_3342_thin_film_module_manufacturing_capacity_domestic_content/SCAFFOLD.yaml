# =============================================================================
# PRD Benchmark Scaffold — Thin-Film Module Manufacturing Capacity &
# Domestic Content Qualification (task_3342)
#
# Sections §1.0–§1.7. Difficulty design (§1.8) lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design (§1.9) in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Thin-Film Module Manufacturing Capacity & Domestic Content Qualification
  (First Solar): manufacturing capacity reservation contracts with customers
  booking years of output ahead with deposits and price terms, module
  technology differences affecting energy yield modeling and project financing
  assumptions, domestic manufacturing expansion to support content requirements
  for customer tax credit qualification with documentation, supply chain
  traceability for feedstock and components with audit-ready records,
  production ramp of new lines with yield improvement curves and bin
  distribution, module recycling program with end-of-life collection
  commitments and recovery processing, warranty and performance guarantee
  administration over multi-decade terms, customer delivery scheduling aligned
  to project construction windows.

domain_name: thin-film-manufacturing-capacity
api_prefix: /v1

complexity_profile:
  primary_archetype: quota_allocation          # annual line capacity competed for by reservations
  secondary_archetype: compliance_audit        # domestic-content qualification + traceability with audit trail
  complexity_layers:
    - optimistic_concurrency                   # OCC on ProductionLine.version for reservation creation
    - cascading_side_effects                   # traceability failure -> deliveries recalled -> reservations constrained
    - dual_variant_calculation                 # nominal vs actual-yield energy model; printed vs adjusted cost content
    - derived_field_reconciliation             # committed/delivered/warranty-capacity aggregates on lines
    - scheduled_deferred_actions               # ops quarter-close advances ramp curves and delivery windows
  entity_topology: flat                        # peer entities with FK references, no nested URL hierarchy
  state_machine_shape: branching               # plus one cyclic (ProductionLine RAMPING<->AT_CAPACITY) and parallel dims on Delivery
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Customer legal entity name" }
      - { name: credit_tier, type: enum, source: input, description: "TIER_A | TIER_B | TIER_C; drives minimum deposit fraction" }
      - { name: tax_credit_flag, type: boolean, source: input, description: "True when the customer's projects rely on the domestic-content tax credit adder; gates which deliveries qualify" }

  - name: ModuleSeries
    parent: null
    common_fields: true
    fields:
      - { name: series_code, type: string, source: input, description: "Manufacturer series code, unique per record (e.g. S6, S7)" }
      - { name: technology, type: enum, source: input, description: "CDTE_THIN_FILM | CDTE_THIN_FILM_CUTE; technology family used by yield modeling" }
      - { name: nominal_wattage, type: number, source: input, description: "Nameplate watts DC of the reference module, > 0" }
      - { name: bin_profile, type: array, source: input, description: "Array of {bin_code, wattage, fraction}; fractions must sum to 1.0 exactly; bins ordered by wattage descending" }
      - { name: temp_coefficient, type: number, source: input, description: "Power temperature coefficient (fraction per degree C, negative)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED; DISCONTINUED series reject new reservations", default: "ACTIVE" }

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique line code (e.g. OH-L3, TX-L1)" }
      - { name: site_country, type: string, source: input, description: "ISO 3166-1 alpha-2 country of the factory site" }
      - { name: annual_capacity_mw, type: number, source: input, description: "Nameplate annual capacity in MW DC, > 0" }
      - { name: committed_capacity_mw, type: number, source: computed, description: "Sum of contracted_mw of reservations in ACTIVE or CONSTRAINED status on this line; never exceeds annual_capacity_mw" }
      - { name: reserved_capacity_mw, type: number, source: computed, description: "Sum of contracted_mw of reservations in PENDING or DEPOSIT_HELD status on this line" }
      - { name: available_capacity_mw, type: number, source: computed, description: "annual_capacity_mw - committed_capacity_mw - reserved_capacity_mw" }
      - { name: warranty_reserved_mw, type: number, source: computed, description: "Sum of contracted_mw of ACTIVE/CONSTRAINED reservations whose deliveries qualify for warranty coverage; feeds the line-level warranty capacity cap" }
      - { name: ramp_quarter_index, type: integer, source: system, description: "Zero-based ramp quarter; set 0 at COMMISSIONING, advanced by 1 per closed quarter while RAMPING; frozen at AT_CAPACITY or SUSPENDED", default: 0 }
      - { name: actual_yield_rate, type: number, source: computed, description: "Weighted-average yield rate across ProductionRuns of the most recently closed quarter; null before first quarter close" }
      - { name: qualification_tier, type: enum, source: computed, description: "QUALIFIED | PROVISIONAL | UNQUALIFIED per domestic_content_qualification; derived from the latest closed compliance attestation for the line" }
      - { name: status, type: enum, source: system, description: "COMMISSIONING | RAMPING | AT_CAPACITY | SUSPENDED | DECOMMISSIONED" }

  - name: CapacityReservation
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; booking party" }
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id; line whose annual output is reserved" }
      - { name: series_id, type: string, source: input, description: "FK -> ModuleSeries.id; module series the customer is booking" }
      - { name: delivery_year, type: integer, source: input, description: "Calendar year of first deliveries; must be >= the logical-clock current year" }
      - { name: contracted_mw, type: number, source: input, description: "Annual reserved volume in MW DC, > 0" }
      - { name: price_usd_per_w, type: number, source: input, description: "Fixed price terms in USD per watt DC, > 0" }
      - { name: deposit_usd, type: number, source: input, description: "Deposit posted at booking; minimum per deposit_requirement calculation by customer credit tier" }
      - { name: term_years, type: integer, source: input, description: "Booking horizon in years, 1..5" }
      - { name: delivered_mw, type: number, source: computed, description: "Cumulative delivered MW against this reservation (DELIVERED deliveries)", default: 0 }
      - { name: deposit_forfeited_usd, type: number, source: computed, description: "Portion of deposit forfeited per deposit_forfeiture at close-out", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | DEPOSIT_HELD | ACTIVE | CONSTRAINED | COMPLETED | CANCELLED" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id; producing line" }
      - { name: series_id, type: string, source: input, description: "FK -> ModuleSeries.id; series produced; must match the line's configured series (line produces the series of its reservations)" }
      - { name: quarter, type: integer, source: input, description: "Quarter-of-ramp index this run belongs to; must equal the line's current ramp_quarter_index" }
      - { name: input_modules, type: integer, source: input, description: "Modules started into the line, > 0" }
      - { name: good_modules, type: integer, source: input, description: "Modules passing end-of-line test, 0 <= good_modules <= input_modules" }
      - { name: bin_counts, type: array, source: input, description: "Array of {bin_code, count}; counts must sum to good_modules; bin_code must exist in the series bin_profile" }
      - { name: run_yield_rate, type: number, source: computed, description: "good_modules / input_modules, 4 decimal places round_half_up" }

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> CapacityReservation.id; reservation drawing down" }
      - { name: scheduled_window_start, type: datetime, source: input, description: "Construction-window-aligned delivery window start (ISO8601)" }
      - { name: scheduled_window_end, type: datetime, source: input, description: "Delivery window end; must be > scheduled_window_start; windows for the same reservation must not overlap (touching allowed)" }
      - { name: volume_mw, type: number, source: input, description: "Delivered volume in MW DC, > 0; cumulative SCHEDULED+DELIVERED volume must not exceed contracted_mw" }
      - { name: lot_ids, type: array, source: input, description: "Array of ComponentLot.id covering the modules shipped; every lot must be VERIFIED at scheduling time" }
      - { name: schedule_status, type: enum, source: system, description: "SCHEDULED | RESCHEDULED | DELIVERED | RECALLED | CANCELLED — schedule dimension of the parallel state pair" }
      - { name: content_status, type: enum, source: system, description: "UNEVALUATED | QUALIFIED_DOMESTIC | NON_QUALIFYING — content dimension of the parallel state pair; evaluated at schedule time and re-evaluated on attestation change" }

  - name: ComponentLot
    parent: null
    common_fields: true
    fields:
      - { name: supplier_name, type: string, source: input, description: "Supplier of record" }
      - { name: lot_code, type: string, source: input, description: "Supplier lot code; unique per record" }
      - { name: component_type, type: enum, source: input, description: "SEMICONDUCTOR_FEEDSTOCK | GLASS | BACKSHEET | FRAME | JUNCTION_BOX" }
      - { name: country_of_origin, type: string, source: input, description: "ISO 3166-1 alpha-2 origin country used in manufactured_products_pct" }
      - { name: lot_cost_usd, type: number, source: input, description: "Lot acquisition cost, >= 0; feeds the manufactured products cost numerator when country_of_origin == site country" }
      - { name: status, type: enum, source: system, description: "PENDING_INSPECTION | VERIFIED | QUARANTINED" }

  - name: ComplianceAttestation
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id; attested line" }
      - { name: period_year, type: integer, source: input, description: "Attestation calendar year" }
      - { name: labor_cost_usd, type: number, source: input, description: "Direct labor cost (domestic), >= 0" }
      - { name: feedstock_cost_usd, type: number, source: input, description: "Semiconductor feedstock cost from VERIFIED domestic lots, >= 0" }
      - { name: glass_cost_usd, type: number, source: input, description: "Glass cost from VERIFIED domestic lots, >= 0" }
      - { name: balance_of_system_cost_usd, type: number, source: input, description: "Backsheet/frame/junction-box cost from VERIFIED domestic lots, >= 0" }
      - { name: overhead_cost_usd, type: number, source: input, description: "Factory overhead cost (domestic), >= 0" }
      - { name: total_manufactured_cost_usd, type: number, source: input, description: "Total manufactured product cost (all origins), >= 0 and >= sum of the five domestic cost fields" }
      - { name: printed_content_pct, type: number, source: computed, description: "Printed (unadjusted) domestic manufactured-products cost percentage per domestic_content_qualification" }
      - { name: adjusted_content_pct, type: number, source: computed, description: "Adjusted percentage including the direct-cost adjustment amount per domestic_content_qualification variant" }
      - { name: manufactured_products_pct, type: number, source: computed, description: "Percentage of VERIFIED lot cost from domestic origin across the attestation's period" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | QUALIFIED | REJECTED" }

  - name: RecyclingObligation
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; obligated customer" }
      - { name: period_year, type: integer, source: input, description: "Program year" }
      - { name: shipped_volume_mw, type: number, source: input, description: "Customer's shipped volume in the prior year (program baseline), >= 0" }
      - { name: required_collected_mw, type: number, source: computed, description: "shipped_volume_mw * recovery_min_pct constant (0.90), 4 decimals round_half_up" }
      - { name: collected_volume_mw, type: number, source: computed, description: "Cumulative collected volume from RECOVERED collection events", default: 0 }
      - { name: fulfillment_pct, type: number, source: computed, description: "collected_volume_mw / required_collected_mw when required > 0; 1.0 when required == 0" }
      - { name: status, type: enum, source: system, description: "OPEN | COLLECTING | RECOVERED | SETTLED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> CapacityReservation.id; reservation whose delivered modules are claimed" }
      - { name: claim_type, type: enum, source: input, description: "PRODUCT_DEFECT | PERFORMANCE_SHORTFALL" }
      - { name: claimed_mw, type: number, source: input, description: "Claimed module volume in MW DC, > 0" }
      - { name: measured_energy_kwh, type: number, source: input, description: "Measured first-year energy for PERFORMANCE_SHORTFALL claims; required for that type, forbidden otherwise" }
      - { name: claim_amount_usd, type: number, source: computed, description: "Liquidated amount per warranty_liquidated_amount (performance) or claimed_mw * reservation price (defect)" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | PAID | DENIED | WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProductionLine
    field: status
    initial_state: COMMISSIONING
    terminal_states: [DECOMMISSIONED]
    note: "Cyclic: AT_CAPACITY -> RAMPING is allowed when a new module series is introduced on the line (re-ramp)."
    transitions:
      - from: COMMISSIONING
        to: RAMPING
        trigger: "POST /v1/production-lines/{id}/commission"
        actor: PlantManager
        preconditions:
          - "line has at least one ProductionRun posted (first article run) — enforced as ERR_LINE_NOT_COMMISSIONABLE otherwise"
        side_effects:
          - "sets ramp_quarter_index = 0"
          - "increments ProductionLine.version by 1"

      - from: RAMPING
        to: AT_CAPACITY
        trigger: "system (POST /v1/_ops/close_quarter when line.actual_yield_rate >= yield_floor_cap_exit constant 0.85 AND ramp_quarter_index >= 2)"
        actor: system
        preconditions:
          - "actual_yield_rate of the just-closed quarter >= 0.85"
          - "ramp_quarter_index (before increment) >= 2"
        side_effects:
          - "line eligible for new reservation activation of any size"
          - "increments ProductionLine.version by 1"

      - from: AT_CAPACITY
        to: RAMPING
        trigger: "POST /v1/production-lines/{id}/reintroduce (new module series introduced on the line)"
        actor: PlantManager
        preconditions:
          - "series_id in the payload is ACTIVE and differs from the series of the line's most recent ProductionRun"
        side_effects:
          - "resets ramp_quarter_index = 0 and actual_yield_rate = null"
          - "increments ProductionLine.version by 1"

      - from: [RAMPING, AT_CAPACITY]
        to: SUSPENDED
        trigger: "POST /v1/production-lines/{id}/suspend"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "every ACTIVE CapacityReservation on this line whose series is discontinued OR whose required line output is blocked transitions to CONSTRAINED (cascade hop 1)"
          - "increments ProductionLine.version by 1"

      - from: SUSPENDED
        to: RAMPING
        trigger: "POST /v1/production-lines/{id}/resume"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "every CONSTRAINED CapacityReservation on this line returns to ACTIVE (compensation of the suspend cascade)"
          - "increments ProductionLine.version by 1"

      - from: [COMMISSIONING, RAMPING, AT_CAPACITY, SUSPENDED]
        to: DECOMMISSIONED
        trigger: "POST /v1/production-lines/{id}/decommission"
        actor: PlantManager
        preconditions:
          - "no CapacityReservation on this line in PENDING, DEPOSIT_HELD, ACTIVE, or CONSTRAINED status (ERR_LINE_HAS_OPEN_RESERVATIONS)"
        side_effects:
          - "increments ProductionLine.version by 1"

  - entity: CapacityReservation
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: DEPOSIT_HELD
        trigger: "POST /v1/capacity-reservations/{id}/post-deposit"
        actor: CustomerAdmin
        preconditions:
          - "reservation customer matches X-User-ID (ownership)"
          - "posted deposit_usd >= required minimum per deposit_requirement calculation"
        side_effects:
          - "line.reserved_capacity_mw recomputed (unchanged total, status bucket only)"

      - from: DEPOSIT_HELD
        to: ACTIVE
        trigger: "POST /v1/capacity-reservations/{id}/activate"
        actor: ContractsOfficer
        preconditions:
          - "line.status in {RAMPING, AT_CAPACITY}"
          - "line.available_capacity_mw >= reservation.contracted_mw (ERR_CAPACITY_UNAVAILABLE)"
          - "series.status == ACTIVE (ERR_SERIES_DISCONTINUED)"
        side_effects:
          - "line.reserved_capacity_mw -= contracted_mw; line.committed_capacity_mw += contracted_mw; line.available_capacity_mw recomputed"
          - "line.warranty_reserved_mw recomputed per warranty_capacity_reservation"
          - "increments ProductionLine.version by 1"

      - from: ACTIVE
        to: CONSTRAINED
        trigger: "system (cascade from ProductionLine RAMPING/AT_CAPACITY -> SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "new deliveries against this reservation rejected with ERR_RESERVATION_CONSTRAINED while CONSTRAINED"

      - from: CONSTRAINED
        to: ACTIVE
        trigger: "system (cascade from ProductionLine SUSPENDED -> RAMPING)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: COMPLETED
        trigger: "system (reservation close-out sweep on POST /v1/_ops/close_quarter when the logical-clock year > delivery_year + term_years - 1)"
        actor: system
        preconditions:
          - "booking term has fully elapsed"
        side_effects:
          - "deposit_forfeiture calculation runs; deposit_forfeited_usd set; forfeited amount leaves any refundable balance"
          - "line.committed_capacity_mw -= contracted_mw; available recomputed; increments ProductionLine.version by 1"

      - from: [PENDING, DEPOSIT_HELD, ACTIVE, CONSTRAINED]
        to: CANCELLED
        trigger: "POST /v1/capacity-reservations/{id}/cancel"
        actor: CustomerAdmin
        preconditions:
          - "reservation customer matches X-User-ID"
        side_effects:
          - "if was PENDING/DEPOSIT_HELD: line.reserved_capacity_mw -= contracted_mw; if was ACTIVE/CONSTRAINED: line.committed_capacity_mw -= contracted_mw; available recomputed; increments ProductionLine.version by 1"
          - "if was ACTIVE/CONSTRAINED: deposit_forfeiture runs immediately with delivered_mw to date"

  - entity: ComplianceAttestation
    field: status
    initial_state: DRAFT
    terminal_states: [QUALIFIED, REJECTED]
    note: "Branching fork: SUBMITTED -> QUALIFIED or SUBMITTED -> REJECTED with divergent side-effect sets."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /v1/compliance-attestations/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "all five domestic cost fields and total_manufactured_cost_usd present and consistent (total >= sum of domestic parts)"
        side_effects:
          - "computed percentages (printed_content_pct, adjusted_content_pct, manufactured_products_pct) frozen at submission"

      - from: SUBMITTED
        to: QUALIFIED
        trigger: "POST /v1/compliance-attestations/{id}/adjudicate with outcome=QUALIFY"
        actor: ComplianceOfficer
        preconditions:
          - "manufactured_products_pct >= manufactured_products_threshold (constant 0.40) AND printed_content_pct >= 0.40 — else adjudication MUST be REJECT (ERR_CONTENT_THRESHOLD_NOT_MET)"
        side_effects:
          - "line.qualification_tier := QUALIFIED"
          - "every SCHEDULED/RESCHEDULED Delivery whose reservation is on this line and whose customer.tax_credit_flag is true gets content_status re-evaluated to QUALIFIED_DOMESTIC"
          - "increments ProductionLine.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /v1/compliance-attestations/{id}/adjudicate with outcome=REJECT"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "line.qualification_tier := UNQUALIFIED"
          - "every SCHEDULED/RESCHEDULED Delivery whose reservation is on this line gets content_status := NON_QUALIFYING"
          - "increments ProductionLine.version by 1"

  - entity: Delivery
    field: schedule_status
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, RECALLED, CANCELLED]
    note: "Parallel state dimensions: schedule_status (this machine) x content_status (UNEVALUATED/QUALIFIED_DOMESTIC/NON_QUALIFYING, mutated only by attestation side effects and lot quarantine cascades) evolve independently on the same row."
    transitions:
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "PATCH /v1/deliveries/{id} (window change)"
        actor: CustomerAdmin
        preconditions:
          - "reservation customer matches X-User-ID"
          - "new window does not overlap any other non-terminal Delivery window of the same reservation (touching allowed)"
        side_effects: []

      - from: [SCHEDULED, RESCHEDULED]
        to: DELIVERED
        trigger: "POST /v1/deliveries/{id}/confirm"
        actor: LogisticsCoordinator
        preconditions:
          - "logical-clock now within [scheduled_window_start, scheduled_window_end] (ERR_DELIVERY_WINDOW_NOT_OPEN)"
          - "reservation.status == ACTIVE (ERR_RESERVATION_CONSTRAINED if CONSTRAINED)"
          - "every lot in lot_ids still VERIFIED (ERR_LOT_NOT_VERIFIED)"
        side_effects:
          - "reservation.delivered_mw += volume_mw; increments CapacityReservation.version by 1"

      - from: [SCHEDULED, RESCHEDULED]
        to: RECALLED
        trigger: "system (cascade hop 2: any lot in lot_ids transitions VERIFIED -> QUARANTINED)"
        actor: system
        preconditions: []
        side_effects:
          - "content_status := NON_QUALIFYING"

      - from: [SCHEDULED, RESCHEDULED]
        to: CANCELLED
        trigger: "POST /v1/deliveries/{id}/cancel"
        actor: CustomerAdmin
        preconditions:
          - "reservation customer matches X-User-ID"
        side_effects: []

  - entity: ComponentLot
    field: status
    initial_state: PENDING_INSPECTION
    terminal_states: []
    note: "Branching with revert: QUARANTINED -> VERIFIED allowed once remediation is recorded (cycle PENDING->VERIFIED->QUARANTINED->VERIFIED)."
    transitions:
      - from: PENDING_INSPECTION
        to: VERIFIED
        trigger: "POST /v1/component-lots/{id}/verify"
        actor: SupplyChainAuditor
        preconditions: []
        side_effects: []

      - from: PENDING_INSPECTION
        to: QUARANTINED
        trigger: "POST /v1/component-lots/{id}/quarantine"
        actor: SupplyChainAuditor
        preconditions: []
        side_effects: []

      - from: VERIFIED
        to: QUARANTINED
        trigger: "POST /v1/component-lots/{id}/quarantine"
        actor: SupplyChainAuditor
        preconditions: []
        side_effects:
          - "cascade hop 2: every Delivery in SCHEDULED/RESCHEDULED with this lot in lot_ids transitions to RECALLED (content_status := NON_QUALIFYING)"
          - "cascade hop 3: each recalled Delivery's reservation, if its only qualified supply path is broken, remains ACTIVE but blocks confirm; no automatic reservation transition"

      - from: QUARANTINED
        to: VERIFIED
        trigger: "POST /v1/component-lots/{id}/verify"
        actor: SupplyChainAuditor
        preconditions: []
        side_effects: []

  - entity: RecyclingObligation
    field: status
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: COLLECTING
        trigger: "system (first POST /v1/recycling-obligations/{id}/collections with volume_mw > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "collected_volume_mw += volume_mw; fulfillment_pct recomputed"

      - from: COLLECTING
        to: COLLECTING
        trigger: "POST /v1/recycling-obligations/{id}/collections (self-loop accumulation)"
        actor: RecyclingCoordinator
        preconditions: []
        side_effects:
          - "collected_volume_mw += volume_mw; fulfillment_pct recomputed"

      - from: COLLECTING
        to: RECOVERED
        trigger: "system (collection event brings fulfillment_pct >= 1.0 — boundary: exactly 1.0 qualifies)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RECOVERED
        to: SETTLED
        trigger: "POST /v1/recycling-obligations/{id}/settle"
        actor: RecyclingCoordinator
        preconditions:
          - "status == RECOVERED"
        side_effects: []

      - from: OPEN
        to: SETTLED
        trigger: "POST /v1/recycling-obligations/{id}/settle"
        actor: RecyclingCoordinator
        preconditions:
          - "required_collected_mw == 0 (zero-shipment baseline; fulfillment_pct == 1.0 by definition)"
        side_effects: []

  - entity: WarrantyClaim
    field: status
    initial_state: FILED
    terminal_states: [PAID, DENIED, WITHDRAWN]
    note: "Branching with cyclic review loop: UNDER_REVIEW -> FILED (refile after information request) is allowed."
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /v1/warranty-claims/{id}/review"
        actor: WarrantyAdministrator
        preconditions:
          - "reservation.status in {ACTIVE, CONSTRAINED, COMPLETED} (claims against CANCELLED reservations rejected ERR_CLAIM_ON_CANCELLED)"
        side_effects: []

      - from: UNDER_REVIEW
        to: FILED
        trigger: "POST /v1/warranty-claims/{id}/request-info (returns to FILED pending customer data)"
        actor: WarrantyAdministrator
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /v1/warranty-claims/{id}/adjudicate with outcome=APPROVE"
        actor: WarrantyAdministrator
        preconditions:
          - "for PERFORMANCE_SHORTFALL: measured_energy_kwh < guaranteed_energy_kwh per warranty_liquidated_amount (else MUST DENY)"
          - "reservation.warranty pool: claimed_mw <= line warranty cap remainder per warranty_capacity_reservation (ERR_WARRANTY_CAP_EXCEEDED)"
        side_effects:
          - "claim_amount_usd computed and frozen"
          - "line.warranty_reserved_mw recomputed"

      - from: APPROVED
        to: PAID
        trigger: "POST /v1/warranty-claims/{id}/pay"
        actor: WarrantyAdministrator
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /v1/warranty-claims/{id}/adjudicate with outcome=DENY"
        actor: WarrantyAdministrator
        preconditions: []
        side_effects: []

      - from: [FILED, UNDER_REVIEW]
        to: WITHDRAWN
        trigger: "POST /v1/warranty-claims/{id}/withdraw"
        actor: CustomerAdmin
        preconditions:
          - "reservation customer matches X-User-ID"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-line
    parent_entity: ProductionLine
    write_endpoint: "POST /v1/capacity-reservations"
    occ_field: "expected_line_version"
    description: |
      Creating a CapacityReservation against a ProductionLine whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just activated or cancelled a reservation
      (which legitimately moves capacity between buckets on the line) and the
      current writer's view of available_capacity_mw is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bin_energy_wh
    description: "First-year modeled energy per module from the bin distribution; dual-variant (nominal vs actual-yield) with different results for identical bookings."
    trigger: "on delivery confirmation (per delivered module batch) and on GET /v1/module-series/{id}/energy-model"
    algorithm: weighted_scoring
    formula: |
      # NOMINAL variant (financing model, uses series bin_profile):
      #   E_nominal = SUM over bins( wattage_b * fraction_b ) * performance_ratio * hours_year
      # ACTUAL_YIELD variant (settlement model, uses the ProductionRun's bin_counts):
      #   E_actual  = SUM over bins( wattage_b * (count_b / good_modules) ) * performance_ratio * hours_year * run_yield_rate
      # performance_ratio and hours_year are constants; bin fractions vs realized
      # counts differ, so E_nominal != E_actual for the same shipment.
    input_set: "ModuleSeries.bin_profile (nominal variant) or ProductionRun.bin_counts + run_yield_rate (actual variant)"
    constants:
      PERFORMANCE_RATIO: 0.85
      HOURS_YEAR: 8760
      ENERGY_SCALE: 0.001   # Wh -> kWh handled by caller; per-module watt-hours basis
    precision: "2 decimal places, round_half_up"
    variants:
      - name: nominal
        when: "project financing model read (GET energy-model) and guarantee baselines"
        difference: "uses declared bin_profile fractions; ignores realized run yield"
      - name: actual_yield
        when: "delivery settlement and PERFORMANCE_SHORTFALL adjudication"
        difference: "uses realized bin counts divided by good_modules, multiplied by the run's yield rate"

  - name: domestic_content_qualification
    description: "Domestic manufactured-products cost percentage for tax-credit qualification; dual-variant (printed vs adjusted cost)."
    trigger: "on ComplianceAttestation submit (both variants computed and frozen)"
    algorithm: threshold
    formula: |
      # printed_pct  = (labor + feedstock + glass + bos + overhead) / total_manufactured_cost
      # adjusted_pct = (labor + feedstock + glass + bos + overhead + ADJUSTMENT) /
      #                (total_manufactured_cost + ADJUSTMENT)
      # qualification rule: manufactured_products_pct >= MANUFACTURED_PRODUCTS_MIN
      #                     AND printed_pct >= PRINTED_MIN
      # Ordering is pinned: compute manufactured_products_pct first (lot-cost
      # aggregation), then printed, then adjusted; percentages compared with >=.
    input_set: "attestation cost fields; VERIFIED ComponentLot rows for manufactured_products_pct (lots in PENDING_INSPECTION or QUARANTINED excluded)"
    constants:
      PRINTED_MIN: 0.40
      MANUFACTURED_PRODUCTS_MIN: 0.40
      ADJUSTMENT_USD: 4.0
    precision: "4 decimal places, round_half_up"
    variants:
      - name: printed
        when: "statutory qualification test (the binding one)"
        difference: "unadjusted cost ratio"
      - name: adjusted
        when: "safe-harbor disclosure reported alongside"
        difference: "adds the fixed direct-cost adjustment to numerator and denominator, always raising the percentage"

  - name: ramp_yield_rate
    description: "Target yield curve for a ramping line; combinatorial mode (a) — 3+ inputs with non-linear interaction."
    trigger: "on POST /v1/_ops/close_quarter for each RAMPING line"
    algorithm: threshold
    formula: |
      # target(q) = YIELD_FLOOR + (YIELD_CAP - YIELD_FLOOR) * (1 - (1 - RAMP_RATE)^q)
      # where q = ramp_quarter_index of the quarter being closed.
      # Line exits RAMPING when actual_yield_rate >= RAMP_EXIT (0.85) and q >= 2.
      # actual_yield_rate = SUM(run.good_modules) / SUM(run.input_modules) over
      # runs whose quarter == q; empty run set -> actual_yield_rate stays null
      # and the line does NOT advance (quarter still increments).
    input_set: "ProductionRun rows with quarter == closing quarter on the line"
    constants:
      YIELD_FLOOR: 0.60
      YIELD_CAP: 0.95
      RAMP_RATE: 0.30
      RAMP_EXIT: 0.85
    precision: "4 decimal places, round_half_up"

  - name: deposit_requirement
    description: "Minimum deposit fraction by customer credit tier; boundary precision at exact threshold."
    trigger: "on CapacityReservation create and on post-deposit"
    algorithm: threshold
    formula: |
      # required_deposit = contracted_mw * 1e6 * price_usd_per_w * tier_fraction
      # tier_fraction: TIER_A 0.05, TIER_B 0.10, TIER_C 0.20
      # Acceptance boundary: deposit_usd >= required_deposit (exactly equal passes).
    input_set: "reservation contracted_mw, price_usd_per_w, customer.credit_tier"
    constants:
      TIER_A_FRACTION: 0.05
      TIER_B_FRACTION: 0.10
      TIER_C_FRACTION: 0.20
    precision: "2 decimal places, round_half_up"

  - name: deposit_forfeiture
    description: "Deposit forfeited at close-out or cancellation; combinatorial mode (c) — circular-looking dependency pinned by evaluation order."
    trigger: "on reservation COMPLETED or CANCELLED from ACTIVE/CONSTRAINED"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned (resolves the circular look where the refund
      # depends on the forfeit and the forfeit depends on the delivered value):
      #   1. delivered_value = delivered_mw * 1e6 * price_usd_per_w
      #   2. contract_value  = contracted_mw * 1e6 * price_usd_per_w
      #   3. IF delivered_value >= PERFORMANCE_FLOOR * contract_value THEN forfeit = 0
      #      ELSE forfeit = MIN(deposit_usd, FORFEIT_RATE * (contract_value - delivered_value))
      #   4. refund = deposit_usd - forfeit
    input_set: "reservation fields only"
    constants:
      PERFORMANCE_FLOOR: 0.80
      FORFEIT_RATE: 0.15
    precision: "2 decimal places, round_half_up"

  - name: warranty_liquidated_amount
    description: "Performance shortfall liquidation; combinatorial mode (b) — nested rounding order pinned (per-MWh then sum)."
    trigger: "on WarrantyClaim adjudicate APPROVE for PERFORMANCE_SHORTFALL"
    algorithm: aggregation
    formula: |
      # guaranteed_kwh = claimed_mw * 1e3 * bin_energy_wh(nominal) * ENERGY_SCALE * HOURS guarantee factor
      # Simplified pinned form:
      #   guaranteed_energy_kwh = round(claimed_mw * 1000 * guaranteed_kwh_per_kw, 2)
      #   IF measured_energy_kwh >= guaranteed_energy_kwh THEN not payable (must DENY)
      #   ELSE shortfall_kwh = guaranteed - measured
      #        amount = round(shortfall_kwh * liquidated_rate, 2)   # round ONCE after multiply
      # Rounding order pinned: compute per-claim rounded guaranteed_energy first,
      # then subtract, then multiply and round — never sum unrounded components.
    input_set: "claim measured_energy_kwh, claimed_mw"
    constants:
      GUARANTEED_KWH_PER_KW: 1700.0
      LIQUIDATED_RATE_PER_KWH: 0.05
    precision: "2 decimal places, round_half_up"

  - name: warranty_capacity_reservation
    description: "Line-level warranty capacity cap: the sum of claimed_mw across APPROVED/PAID claims on reservations of a line must not exceed WARRANTY_CAP_FRACTION * line.annual_capacity_mw."
    trigger: "on WarrantyClaim adjudicate APPROVE"
    algorithm: threshold
    formula: |
      # approved_claimed_mw = SUM(claimed_mw) over claims in {APPROVED, PAID}
      #   joined through reservations on this line
      # cap = WARRANTY_CAP_FRACTION * annual_capacity_mw
      # approve allowed iff approved_claimed_mw + this.claimed_mw <= cap
      # (boundary: exactly at cap passes).
    input_set: "WarrantyClaim rows in APPROVED or PAID status for reservations whose line_id == this line"
    constants:
      WARRANTY_CAP_FRACTION: 0.10
    precision: "4 decimal places, round_half_up"

  - name: delivery_window_conflict
    description: "Delivery windows of one reservation must not overlap; half-open interval semantics [start, end) — touching windows allowed."
    trigger: "on Delivery create and PATCH reschedule"
    algorithm: interval_merge
    formula: |
      # conflict iff new_start < existing_end AND existing_start < new_end
      # (strict inequalities: new_start == existing_end is NOT a conflict)
      # existing windows considered: SCHEDULED, RESCHEDULED only.
    input_set: "Delivery rows of the same reservation in SCHEDULED or RESCHEDULED"

  - name: recovery_obligation
    description: "Recycling recovery requirement; boundary at exactly 100% fulfillment."
    trigger: "on RecyclingObligation create and each collection event"
    algorithm: aggregation
    formula: |
      # required_collected_mw = round(shipped_volume_mw * RECOVERY_MIN_PCT, 4)
      # fulfillment_pct = collected / required when required > 0 else 1.0
      # RECOVERED when fulfillment_pct >= 1.0 (exactly 1.0 qualifies).
    input_set: "obligation fields and collection events"
    constants:
      RECOVERY_MIN_PCT: 0.90
    precision: "4 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership: for CustomerAdmin writes, X-User-ID must equal the reservation/delivery customer's Customer.id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /v1/capacity-reservations/{id}/post-deposit, POST /v1/capacity-reservations/{id}/cancel, PATCH /v1/deliveries/{id}, POST /v1/deliveries/{id}/cancel, POST /v1/warranty-claims/{id}/withdraw, POST /v1/deliveries"
  - priority: 4
    category: existence
    check: "Path and body referenced resources exist, validated left-to-right (line, series, customer, reservation, delivery, lot, attestation, claim)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Target resource in a state from which the requested transition is defined per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Traceability: every lot_id on a delivery create must be VERIFIED; lot in PENDING_INSPECTION or QUARANTINED rejects the schedule"
    error_id: ERR_LOT_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /v1/deliveries, POST /v1/deliveries/{id}/confirm"
  - priority: 7
    category: business_constraint
    check: "Reservation create: delivery_year >= logical-clock current year; contracted_mw > 0; term_years in 1..5; series.status == ACTIVE"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /v1/capacity-reservations"
  - priority: 8
    category: business_temporal
    check: "Delivery window: scheduled_window_end > scheduled_window_start and no overlap with sibling SCHEDULED/RESCHEDULED windows (half-open, touching allowed)"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /v1/deliveries, PATCH /v1/deliveries/{id}"
  - priority: 9
    category: business_constraint
    check: "Delivery cumulative volume: sum(volume_mw) over SCHEDULED+RESCHEDULED+DELIVERED + new volume <= reservation.contracted_mw"
    error_id: ERR_VOLUME_EXCEEDS_CONTRACT
    http_status: 422
    applies_to: "POST /v1/deliveries"
  - priority: 10
    category: business_fiscal
    check: "Reservation activation: line.available_capacity_mw >= contracted_mw"
    error_id: ERR_CAPACITY_UNAVAILABLE
    http_status: 422
    applies_to: "POST /v1/capacity-reservations/{id}/activate"
  - priority: 11
    category: business_fiscal
    check: "Deposit: posted deposit_usd >= deposit_requirement minimum (>= boundary passes)"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /v1/capacity-reservations/{id}/post-deposit"
  - priority: 12
    category: business_constraint
    check: "ProductionRun: good_modules <= input_modules; bin_counts sum == good_modules; quarter == line.ramp_quarter_index"
    error_id: ERR_RUN_INCONSISTENT
    http_status: 422
    applies_to: "POST /v1/production-runs"
  - priority: 13
    category: business_constraint
    check: "Attestation: total_manufactured_cost_usd >= sum of five domestic cost fields; adjudicate QUALIFY requires manufactured_products_pct >= 0.40 AND printed_content_pct >= 0.40"
    error_id: ERR_CONTENT_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /v1/compliance-attestations/{id}/adjudicate"
  - priority: 14
    category: business_fiscal
    check: "Warranty approve: line approved+paid claimed_mw + this.claimed_mw <= 0.10 * annual_capacity_mw (at cap passes)"
    error_id: ERR_WARRANTY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /v1/warranty-claims/{id}/adjudicate"
  - priority: 15
    category: business_temporal
    check: "Delivery confirm: logical-clock now within [scheduled_window_start, scheduled_window_end]"
    error_id: ERR_DELIVERY_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /v1/deliveries/{id}/confirm"
  - priority: 16
    category: state
    check: "Delivery confirm: reservation must be ACTIVE (CONSTRAINED or otherwise rejects)"
    error_id: ERR_RESERVATION_CONSTRAINED
    http_status: 409
    applies_to: "POST /v1/deliveries, POST /v1/deliveries/{id}/confirm"
  - priority: 17
    category: business_constraint
    check: "Recycling settle from OPEN requires required_collected_mw == 0; settle from COLLECTING requires RECOVERED first"
    error_id: ERR_OBLIGATION_NOT_MET
    http_status: 422
    applies_to: "POST /v1/recycling-obligations/{id}/settle"

# =============================================================================
# §1.5 API Endpoint Table (32 endpoints)
# =============================================================================
endpoints:
  - method: POST
    path: "/v1/customers"
    description: "Register a customer"
    roles: [ContractsOfficer]
    code: 201
    input: [legal_name, credit_tier, tax_credit_flag]
    output: Customer
    side_effects: []
  - method: GET
    path: "/v1/customers"
    description: "List customers (paginated)"
    roles: [ContractsOfficer, ComplianceOfficer, WarrantyAdministrator, RecyclingCoordinator]
    code: 200
    input: ["credit_tier?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []
  - method: GET
    path: "/v1/customers/{id}"
    description: "Fetch a customer"
    roles: [ContractsOfficer, ComplianceOfficer, CustomerAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/v1/customers/{id}/recycling-obligations"
    description: "Sub-resource: recycling obligations of a customer (FK reverse reachability)"
    roles: [RecyclingCoordinator, CustomerAdmin]
    code: 200
    input: []
    output: "RecyclingObligation[]"
    side_effects: []

  - method: POST
    path: "/v1/module-series"
    description: "Register a module series"
    roles: [PlantManager]
    code: 201
    input: [series_code, technology, nominal_wattage, bin_profile, temp_coefficient]
    output: ModuleSeries
    side_effects: []
  - method: GET
    path: "/v1/module-series/{id}"
    description: "Fetch a module series"
    roles: [PlantManager, ContractsOfficer, CustomerAdmin, LogisticsCoordinator]
    code: 200
    input: []
    output: ModuleSeries
    side_effects: []
  - method: GET
    path: "/v1/module-series/{id}/energy-model"
    description: "Computed read: nominal-variant bin energy model (kWh per kW first-year) for project financing"
    roles: [PlantManager, ContractsOfficer, CustomerAdmin]
    code: 200
    input: []
    output: "{ nominal_kwh_per_kw: number, variant: string }"
    side_effects: [bin_energy_wh (nominal variant)]

  - method: POST
    path: "/v1/production-lines"
    description: "Register a production line"
    roles: [PlantManager]
    code: 201
    input: [line_code, site_country, annual_capacity_mw]
    output: ProductionLine
    side_effects: []
  - method: GET
    path: "/v1/production-lines/{id}"
    description: "Fetch a production line"
    roles: [PlantManager, ContractsOfficer, ComplianceOfficer, SupplyChainAuditor, CustomerAdmin]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []
  - method: POST
    path: "/v1/production-lines/{id}/commission"
    description: "COMMISSIONING -> RAMPING"
    roles: [PlantManager]
    code: 200
    input: []
    output: ProductionLine
    side_effects: ["ramp_quarter_index := 0", "increments ProductionLine.version by 1"]
  - method: POST
    path: "/v1/production-lines/{id}/reintroduce"
    description: "AT_CAPACITY -> RAMPING (new series re-ramp cycle)"
    roles: [PlantManager]
    code: 200
    input: [series_id]
    output: ProductionLine
    side_effects: ["ramp_quarter_index := 0", "actual_yield_rate := null", "increments ProductionLine.version by 1"]
  - method: POST
    path: "/v1/production-lines/{id}/suspend"
    description: "RAMPING/AT_CAPACITY -> SUSPENDED; cascades reservations to CONSTRAINED"
    roles: [PlantManager]
    code: 200
    input: []
    output: ProductionLine
    side_effects: ["ACTIVE reservations on line -> CONSTRAINED", "increments ProductionLine.version by 1"]
  - method: POST
    path: "/v1/production-lines/{id}/resume"
    description: "SUSPENDED -> RAMPING; compensates constrained reservations back to ACTIVE"
    roles: [PlantManager]
    code: 200
    input: []
    output: ProductionLine
    side_effects: ["CONSTRAINED reservations on line -> ACTIVE", "increments ProductionLine.version by 1"]
  - method: POST
    path: "/v1/production-lines/{id}/decommission"
    description: "-> DECOMMISSIONED; requires no open reservations"
    roles: [PlantManager]
    code: 200
    input: []
    output: ProductionLine
    side_effects: ["increments ProductionLine.version by 1"]
  - method: GET
    path: "/v1/production-lines/{id}/capacity-reservations"
    description: "Sub-resource: reservations booked on this line (FK reverse reachability)"
    roles: [PlantManager, ContractsOfficer]
    code: 200
    input: []
    output: "CapacityReservation[]"
    side_effects: []

  - method: POST
    path: "/v1/production-runs"
    description: "Post a production run (bin counts, yield) against a line"
    roles: [PlantManager]
    code: 201
    input: [line_id, series_id, quarter, input_modules, good_modules, bin_counts]
    output: ProductionRun
    side_effects: ["run_yield_rate computed"]
  - method: GET
    path: "/v1/production-lines/{id}/production-runs"
    description: "Sub-resource: production runs of this line (FK reverse reachability)"
    roles: [PlantManager, SupplyChainAuditor]
    code: 200
    input: []
    output: "ProductionRun[]"
    side_effects: []
  - method: GET
    path: "/v1/customers/{id}/capacity-reservations"
    description: "Sub-resource: reservations booked by this customer (FK reverse reachability)"
    roles: [ContractsOfficer, CustomerAdmin]
    code: 200
    input: []
    output: "CapacityReservation[]"
    side_effects: []
  - method: GET
    path: "/v1/module-series/{id}/capacity-reservations"
    description: "Sub-resource: reservations booked on this series (FK reverse reachability)"
    roles: [PlantManager, ContractsOfficer]
    code: 200
    input: []
    output: "CapacityReservation[]"
    side_effects: []
  - method: GET
    path: "/v1/module-series/{id}/production-runs"
    description: "Sub-resource: production runs of this series (FK reverse reachability)"
    roles: [PlantManager, SupplyChainAuditor]
    code: 200
    input: []
    output: "ProductionRun[]"
    side_effects: []
  - method: GET
    path: "/v1/capacity-reservations/{id}/warranty-claims"
    description: "Sub-resource: warranty claims filed against this reservation (FK reverse reachability)"
    roles: [WarrantyAdministrator, CustomerAdmin, ContractsOfficer]
    code: 200
    input: []
    output: "WarrantyClaim[]"
    side_effects: []

  - method: POST
    path: "/v1/capacity-reservations"
    description: "Create a capacity reservation (OCC-guarded on ProductionLine.version)"
    roles: [CustomerAdmin]
    code: 201
    input: [customer_id, line_id, series_id, delivery_year, contracted_mw, price_usd_per_w, deposit_usd, term_years, expected_line_version]
    output: CapacityReservation
    side_effects: ["line.reserved_capacity_mw += contracted_mw; available recomputed", "increments ProductionLine.version by 1"]
  - method: GET
    path: "/v1/capacity-reservations/{id}"
    description: "Fetch a reservation"
    roles: [ContractsOfficer, CustomerAdmin, WarrantyAdministrator, LogisticsCoordinator]
    code: 200
    input: []
    output: CapacityReservation
    side_effects: []
  - method: POST
    path: "/v1/capacity-reservations/{id}/post-deposit"
    description: "PENDING -> DEPOSIT_HELD; enforces tier minimum"
    roles: [CustomerAdmin]
    code: 200
    input: []
    output: CapacityReservation
    side_effects: []
  - method: POST
    path: "/v1/capacity-reservations/{id}/activate"
    description: "DEPOSIT_HELD -> ACTIVE; moves capacity reserved->committed"
    roles: [ContractsOfficer]
    code: 200
    input: []
    output: CapacityReservation
    side_effects: ["line buckets recomputed (reserved -=, committed +=)", "increments ProductionLine.version by 1"]
  - method: POST
    path: "/v1/capacity-reservations/{id}/cancel"
    description: "-> CANCELLED; forfeiture sweep if previously ACTIVE"
    roles: [CustomerAdmin]
    code: 200
    input: []
    output: CapacityReservation
    side_effects: ["line buckets recomputed", "deposit_forfeiture when ACTIVE/CONSTRAINED", "increments ProductionLine.version by 1"]
  - method: GET
    path: "/v1/capacity-reservations/{id}/deliveries"
    description: "Sub-resource: deliveries scheduled against this reservation (FK reverse reachability)"
    roles: [CustomerAdmin, LogisticsCoordinator, ContractsOfficer]
    code: 200
    input: []
    output: "Delivery[]"
    side_effects: []

  - method: POST
    path: "/v1/deliveries"
    description: "Schedule a delivery against a reservation (construction-window aligned)"
    roles: [CustomerAdmin]
    code: 201
    input: [reservation_id, scheduled_window_start, scheduled_window_end, volume_mw, lot_ids]
    output: Delivery
    side_effects: ["content_status := UNEVALUATED or per line.qualification_tier"]
  - method: GET
    path: "/v1/deliveries/{id}"
    description: "Fetch a delivery"
    roles: [CustomerAdmin, LogisticsCoordinator, ContractsOfficer]
    code: 200
    input: []
    output: Delivery
    side_effects: []
  - method: PATCH
    path: "/v1/deliveries/{id}"
    description: "Reschedule window (SCHEDULED -> RESCHEDULED)"
    roles: [CustomerAdmin]
    code: 200
    input: [scheduled_window_start, scheduled_window_end]
    output: Delivery
    side_effects: []
  - method: POST
    path: "/v1/deliveries/{id}/confirm"
    description: "-> DELIVERED within window; accrues delivered_mw on reservation"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Delivery
    side_effects: ["reservation.delivered_mw += volume_mw", "increments CapacityReservation.version by 1"]
  - method: POST
    path: "/v1/deliveries/{id}/cancel"
    description: "-> CANCELLED"
    roles: [CustomerAdmin]
    code: 200
    input: []
    output: Delivery
    side_effects: []

  - method: POST
    path: "/v1/component-lots"
    description: "Register a component lot (feedstock/component traceability record)"
    roles: [SupplyChainAuditor]
    code: 201
    input: [supplier_name, lot_code, component_type, country_of_origin, lot_cost_usd]
    output: ComponentLot
    side_effects: []
  - method: POST
    path: "/v1/component-lots/{id}/verify"
    description: "PENDING_INSPECTION or QUARANTINED -> VERIFIED"
    roles: [SupplyChainAuditor]
    code: 200
    input: []
    output: ComponentLot
    side_effects: []
  - method: POST
    path: "/v1/component-lots/{id}/quarantine"
    description: "-> QUARANTINED; from VERIFIED cascades deliveries to RECALLED"
    roles: [SupplyChainAuditor]
    code: 200
    input: []
    output: ComponentLot
    side_effects: ["SCHEDULED/RESCHEDULED deliveries containing lot -> RECALLED (content_status := NON_QUALIFYING)"]
  - method: GET
    path: "/v1/production-lines/{id}/compliance-attestations"
    description: "Sub-resource: attestations filed for this line (FK reverse reachability)"
    roles: [ComplianceOfficer, ContractsOfficer, CustomerAdmin]
    code: 200
    input: []
    output: "ComplianceAttestation[]"
    side_effects: []

  - method: POST
    path: "/v1/compliance-attestations"
    description: "Create a domestic-content attestation (DRAFT)"
    roles: [ComplianceOfficer]
    code: 201
    input: [line_id, period_year, labor_cost_usd, feedstock_cost_usd, glass_cost_usd, balance_of_system_cost_usd, overhead_cost_usd, total_manufactured_cost_usd]
    output: ComplianceAttestation
    side_effects: []
  - method: POST
    path: "/v1/compliance-attestations/{id}/submit"
    description: "DRAFT -> SUBMITTED; freezes computed percentages"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceAttestation
    side_effects: ["domestic_content_qualification (both variants) computed and frozen"]
  - method: POST
    path: "/v1/compliance-attestations/{id}/adjudicate"
    description: "SUBMITTED -> QUALIFIED or REJECTED; re-evaluates delivery content_status"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: ComplianceAttestation
    side_effects: ["line.qualification_tier updated", "delivery content_status sweep", "increments ProductionLine.version by 1"]

  - method: POST
    path: "/v1/recycling-obligations"
    description: "Open a recycling obligation for a customer-year"
    roles: [RecyclingCoordinator]
    code: 201
    input: [customer_id, period_year, shipped_volume_mw]
    output: RecyclingObligation
    side_effects: ["required_collected_mw computed"]
  - method: POST
    path: "/v1/recycling-obligations/{id}/collections"
    description: "Record a collection event (OPEN->COLLECTING, accumulates)"
    roles: [RecyclingCoordinator]
    code: 201
    input: [volume_mw]
    output: RecyclingObligation
    side_effects: ["collected_volume_mw += volume_mw", "fulfillment_pct recomputed", "auto RECOVERED at fulfillment_pct >= 1.0"]
  - method: POST
    path: "/v1/recycling-obligations/{id}/settle"
    description: "RECOVERED -> SETTLED (or OPEN -> SETTLED when required == 0)"
    roles: [RecyclingCoordinator]
    code: 200
    input: []
    output: RecyclingObligation
    side_effects: []

  - method: POST
    path: "/v1/warranty-claims"
    description: "File a warranty or performance-guarantee claim"
    roles: [CustomerAdmin]
    code: 201
    input: [reservation_id, claim_type, claimed_mw, "measured_energy_kwh?"]
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/v1/warranty-claims/{id}/review"
    description: "FILED -> UNDER_REVIEW"
    roles: [WarrantyAdministrator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/v1/warranty-claims/{id}/request-info"
    description: "UNDER_REVIEW -> FILED (review loop)"
    roles: [WarrantyAdministrator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/v1/warranty-claims/{id}/adjudicate"
    description: "UNDER_REVIEW -> APPROVED or DENIED; computes claim_amount_usd; enforces warranty cap"
    roles: [WarrantyAdministrator]
    code: 200
    input: [outcome]
    output: WarrantyClaim
    side_effects: ["warranty_liquidated_amount / defect amount frozen", "line.warranty_reserved_mw recomputed"]
  - method: POST
    path: "/v1/warranty-claims/{id}/pay"
    description: "APPROVED -> PAID"
    roles: [WarrantyAdministrator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/v1/warranty-claims/{id}/withdraw"
    description: "FILED/UNDER_REVIEW -> WITHDRAWN"
    roles: [CustomerAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any set call the logical clock reads this default and MUST NOT fall back to wall-clock time."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []
  - method: POST
    path: "/v1/_ops/close_quarter"
    description: "Test-driving endpoint: closes the current quarter — advances ramp_quarter_index on RAMPING lines, recomputes actual_yield_rate, evaluates AT_CAPACITY promotion, runs the reservation close-out sweep"
    roles: [PlantManager]
    code: 200
    input: []
    output: "{ closed_quarter: integer, lines_promoted: integer, reservations_completed: integer }"
    side_effects: [ramp_yield_rate, deposit_forfeiture (close-out sweep)]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or CustomerAdmin acting on another customer's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema/field validation failure (bad enum, non-positive quantity, delivery_year in past, bin_profile fractions not summing to 1.0)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the entity's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_line_version does not match ProductionLine.version (OCC)" }
  - { id: ERR_CAPACITY_UNAVAILABLE, http: 422, condition: "line.available_capacity_mw < contracted_mw at activation" }
  - { id: ERR_SERIES_DISCONTINUED, http: 422, condition: "ModuleSeries.status == DISCONTINUED on reservation create or activate" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 422, condition: "deposit_usd below the credit-tier minimum fraction" }
  - { id: ERR_LINE_NOT_COMMISSIONABLE, http: 422, condition: "commission attempted before any ProductionRun (first-article) exists on the line" }
  - { id: ERR_LINE_HAS_OPEN_RESERVATIONS, http: 422, condition: "decommission with reservations in PENDING/DEPOSIT_HELD/ACTIVE/CONSTRAINED" }
  - { id: ERR_RUN_INCONSISTENT, http: 422, condition: "good_modules > input_modules, bin_counts sum mismatch, or run quarter != line ramp_quarter_index" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Delivery window overlaps a sibling SCHEDULED/RESCHEDULED window (half-open semantics)" }
  - { id: ERR_DELIVERY_WINDOW_NOT_OPEN, http: 409, condition: "confirm outside [scheduled_window_start, scheduled_window_end]" }
  - { id: ERR_VOLUME_EXCEEDS_CONTRACT, http: 422, condition: "Cumulative delivery volume would exceed reservation.contracted_mw" }
  - { id: ERR_LOT_NOT_VERIFIED, http: 422, condition: "Delivery references a lot not in VERIFIED status" }
  - { id: ERR_RESERVATION_CONSTRAINED, http: 409, condition: "Delivery schedule/confirm while reservation is CONSTRAINED (or not ACTIVE)" }
  - { id: ERR_CONTENT_THRESHOLD_NOT_MET, http: 422, condition: "Adjudicate QUALIFY with manufactured_products_pct or printed_content_pct below 0.40" }
  - { id: ERR_WARRANTY_CAP_EXCEEDED, http: 422, condition: "Approval would push line approved+paid claimed_mw over 10% of annual_capacity_mw" }
  - { id: ERR_CLAIM_ON_CANCELLED, http: 409, condition: "Warranty review against a CANCELLED reservation" }
  - { id: ERR_OBLIGATION_NOT_MET, http: 422, condition: "Settle attempted before RECOVERED (or nonzero requirement from OPEN)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Factory operations: lines, series, production runs, ramp, ops quarter close, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/production-lines* (all line lifecycle actions)"
      - "POST /v1/production-runs"
      - "POST /v1/module-series"
      - "POST /v1/_ops/close_quarter"
      - "POST /v1/_clock/set_current_utc"
    shared_operations: ["GET on lines, series, runs, lots"]
  - name: ContractsOfficer
    description: "Commercial desk: customers, reservation activation, contract reads"
    identity: opaque
    exclusive_operations:
      - "POST /v1/customers"
      - "POST /v1/capacity-reservations/{id}/activate"
    shared_operations: ["GET on customers, reservations, deliveries, claims, series"]
  - name: CustomerAdmin
    description: "Customer-side administrator; entity-backed so ownership checks compare X-User-ID to Customer.id"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /v1/capacity-reservations (create)"
      - "POST /v1/capacity-reservations/{id}/post-deposit, /cancel"
      - "POST /v1/deliveries, PATCH /v1/deliveries/{id}, POST /v1/deliveries/{id}/cancel"
      - "POST /v1/warranty-claims, POST /v1/warranty-claims/{id}/withdraw"
    shared_operations: ["GET on own reservations, deliveries, attestations, series"]
  - name: SupplyChainAuditor
    description: "Traceability: component lots, inspection, quarantine; audit-ready records"
    identity: opaque
    exclusive_operations:
      - "POST /v1/component-lots, /verify, /quarantine"
    shared_operations: ["GET on lots, lines, runs"]
  - name: ComplianceOfficer
    description: "Domestic-content attestation lifecycle and adjudication"
    identity: opaque
    exclusive_operations:
      - "POST /v1/compliance-attestations, /submit, /adjudicate"
    shared_operations: ["GET on attestations, lines, lots, customers"]
  - name: LogisticsCoordinator
    description: "Confirms deliveries inside construction windows"
    identity: opaque
    exclusive_operations:
      - "POST /v1/deliveries/{id}/confirm"
    shared_operations: ["GET on deliveries, series, reservations"]
  - name: WarrantyAdministrator
    description: "Warranty and performance guarantee administration over multi-decade terms"
    identity: opaque
    exclusive_operations:
      - "POST /v1/warranty-claims/{id}/review, /request-info, /adjudicate, /pay"
    shared_operations: ["GET on claims, reservations, customers"]
  - name: RecyclingCoordinator
    description: "End-of-life collection commitments and recovery processing"
    identity: opaque
    exclusive_operations:
      - "POST /v1/recycling-obligations, /collections, /settle"
    shared_operations: ["GET on obligations, customers"]
