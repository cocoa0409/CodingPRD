scenario: |
  2455. Minimum Advertised Price & Authorized Reseller Enforcement (consumer brand channel policy):
  unilateral pricing policy drafting with advertised price definitions and non-negotiation requirements,
  authorized reseller agreement with sales channel restrictions and quality obligations, price monitoring
  across marketplaces and retailer sites with violation evidence capture, violation notice ladder with
  warning, suspension and termination of supply, unauthorized seller identification through serialized
  product tracing and test purchases, distributor accountability for downstream diversion with contractual
  remedies, antitrust guardrails limiting agreement, communication and dealer input on pricing, exception
  handling for clearance, bundles and promotional events

domain_name: map-authorized-reseller-enforcement
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection (`/violations/{id}`,
  # `/enforcement-notices/{id}`); relationships are expressed as FK fields in request bodies
  # and discovered through filtered list endpoints. No nested ownership URLs.

  state_machine_shape: parallel
  # Reseller carries two independent axes (`authorization_status` x `supply_status`); Violation and
  # DistributorChargeback carry revision/dispute cycles; ResellerAgreement forks COUNTERSIGN vs DECLINE;
  # PricingPolicy loops DRAFT -> IN_LEGAL_REVIEW -> DRAFT.

  relationship_patterns:
    - one_to_many
    - self_referential      # PricingPolicy.superseded_by_policy_id -> PricingPolicy.id
    - cross_aggregate       # SerialUnit links Distributor and Reseller aggregates; TestPurchase links
                            # PriceObservation and SerialUnit; DistributorChargeback links Distributor and TestPurchase

  role_model: segregation_of_duties
  # A TERMINATION notice must be issued by BrandLegalCounsel under a different X-User-ID than the
  # X-User-ID that issued the reseller's governing SUSPENSION notice (four-eyes on supply cut-off).

  consistency_model: immediate

  difficulty_level: expert_plus
  # Deliberately above the §0.4 Expert band (12 entities, 60 endpoints, 40 error codes, 9 calculations,
  # 8 state machines) because the task brief asks for "harder than expert level". The extra surface is
  # structural, not padding: 23 of the 60 endpoints are the reverse-reachability reads §1.5 owes the
  # 21 declared foreign keys.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PricingPolicy
    parent: null
    common_fields: true
    fields:
      - name: policy_code
        type: string
        source: input
        description: "Human-readable code for the unilateral MAP policy document"
        constraints: "1-40 chars; unique across all PricingPolicy rows"
      - name: revision_number
        type: integer
        source: system
        description: "Incremented every time legal returns the draft for revision"
        default: 1
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of the policy document"
        default: DRAFT
        constraints: "DRAFT | IN_LEGAL_REVIEW | APPROVED | PUBLISHED | SUPERSEDED | WITHDRAWN"
      - name: effective_from
        type: datetime
        source: input
        description: "Instant from which the published policy governs observations; supplied at publish"
        default: null
      - name: shipping_counts_as_advertised
        type: boolean
        source: input
        description: "Advertised-price definition: whether shipping charges are added to the advertised price"
        default: false
      - name: auto_coupon_counts_as_advertised
        type: boolean
        source: input
        description: "Advertised-price definition: whether an auto-applied on-page coupon is deducted"
        default: true
      - name: promo_code_counts_as_advertised
        type: boolean
        source: input
        description: "Advertised-price definition: whether a typed promo-code discount is deducted"
        default: false
      - name: max_discount_attribution_pct
        type: number
        source: input
        description: "Cap on the fraction of gross price that any single discount may reduce for MAP purposes"
        default: 0.40
        constraints: "0.00 <= value <= 1.00; 2 decimals"
      - name: non_negotiation_ack_required
        type: boolean
        source: input
        description: "Whether a reseller must acknowledge the policy is unilateral and non-negotiable before activation"
        default: true
      - name: cure_window_days
        type: integer
        source: input
        description: "Days a reseller has to cure a noticed violation before it escalates"
        default: 10
        constraints: "1 <= value <= 60"
      - name: suspension_points_threshold
        type: integer
        source: input
        description: "Cumulative violation points at or above which the points-rung is SUSPENSION"
        default: 6
        constraints: "value >= 1"
      - name: termination_points_threshold
        type: integer
        source: input
        description: "Cumulative violation points at or above which the points-rung is TERMINATION"
        default: 12
        constraints: "value > suspension_points_threshold"
      - name: suspension_cooling_off_days
        type: integer
        source: input
        description: "Mandatory gap between the end of one suspension window and the start of the next"
        default: 14
        constraints: "0 <= value <= 180"
      - name: legal_review_notes
        type: string
        source: system
        description: "Notes recorded by the most recent legal review decision"
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BrandLegalCounsel who last recorded a review decision"
        default: null
      - name: published_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BrandLegalCounsel who published the policy"
        default: null
      - name: superseded_by_policy_id
        type: string
        source: system
        description: "FK -> PricingPolicy.id; set on the previously PUBLISHED policy when a newer one is published"
        default: null
      - name: withdrawn_reason
        type: string
        source: system
        description: "Reason recorded when the policy is withdrawn"
        default: null

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Stock keeping unit code"
        constraints: "1-40 chars; unique across all Product rows"
      - name: name
        type: string
        source: input
        description: "Product display name"
      - name: msrp_cents
        type: integer
        source: input
        description: "Manufacturer suggested retail price in cents"
        constraints: "value > 0"
      - name: standard_map_floor_cents
        type: integer
        source: input
        description: "Standard minimum advertised price floor in cents"
        constraints: "0 < value <= msrp_cents"
      - name: lifecycle_status
        type: enum
        source: input
        description: "Commercial lifecycle stage, gates which exception types may be approved"
        default: ACTIVE
        constraints: "ACTIVE | CLEARANCE | DISCONTINUED"
      - name: clearance_discount_pct
        type: number
        source: input
        description: "Fraction subtracted from the standard floor when a CLEARANCE exception is approved"
        default: 0.20
        constraints: "0.00 <= value <= 0.60; 2 decimals"
      - name: serialization_enabled
        type: boolean
        source: input
        description: "Whether units of this product carry traceable serial numbers"
        default: true
      - name: governing_policy_id
        type: string
        source: input
        description: "FK -> PricingPolicy.id; must be in status PUBLISHED when the product is created"
      - name: open_exception_count
        type: integer
        source: computed
        description: "Count of this product's PricingException rows in status APPROVED (see calculations.product_open_exception_count)"
        default: 0

  - name: Reseller
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Reseller legal entity name"
      - name: contact_email
        type: string
        source: input
        description: "Notice delivery address"
      - name: primary_channel
        type: enum
        source: input
        description: "Channel the reseller principally sells through"
        constraints: "MARKETPLACE | RETAILER_SITE | OWN_WEBSITE | PHYSICAL_RETAIL"
      - name: authorization_status
        type: enum
        source: system
        description: "Authorization axis of the reseller's parallel state machine"
        default: APPLIED
        constraints: "APPLIED | PENDING_AGREEMENT | AUTHORIZED | SUSPENDED | TERMINATED"
      - name: supply_status
        type: enum
        source: system
        description: "Supply axis of the reseller's parallel state machine; evolves independently of authorization_status"
        default: HOLD
        constraints: "OPEN | HOLD | CUT_OFF"
      - name: hold_reason
        type: enum
        source: system
        description: "Why supply is not OPEN; determines which actor may release the hold"
        default: PENDING_AUTHORIZATION
        constraints: "NONE | PENDING_AUTHORIZATION | QUALITY_OBLIGATION | SUSPENSION | AGREEMENT_EXPIRED | TERMINATION"
      - name: violation_points_total
        type: number
        source: computed
        description: "Running compliance-points ledger (see calculations.reseller_points_ledger)"
        default: 0
      - name: review_required
        type: boolean
        source: computed
        description: "Derived diversion flag (see calculations.reseller_review_required)"
        default: false
      - name: sourcing_distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the distributor this reseller buys from, null for direct accounts"
        default: null
      - name: suspension_ends_at
        type: datetime
        source: system
        description: "End instant of the currently governing suspension window; null when not suspended"
        default: null
      - name: last_suspension_ended_at
        type: datetime
        source: system
        description: "End instant of the most recent completed or reversed suspension; anchors the cooling-off buffer"
        default: null
      - name: terminated_at
        type: datetime
        source: system
        description: "Instant supply was terminated"
        default: null

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Distributor legal entity name"
      - name: annual_chargeback_cap_cents
        type: integer
        source: input
        description: "Contractual ceiling on cumulative diversion chargebacks"
        constraints: "value > 0"
      - name: standing
        type: enum
        source: computed
        description: "Derived from diversion_score (see calculations.distributor_chargeback_ledger)"
        default: GOOD
        constraints: "GOOD | PROBATION | SUSPENDED"
      - name: diversion_score
        type: number
        source: computed
        description: "Running diversion score, 1 decimal (see calculations.distributor_chargeback_ledger)"
        default: 0
      - name: chargeback_balance_cents
        type: integer
        source: computed
        description: "Running chargeback money ledger (see calculations.distributor_chargeback_ledger)"
        default: 0
      - name: shipped_units_total
        type: integer
        source: computed
        description: "Count of SerialUnit rows whose shipped_distributor_id equals this distributor, any status"
        default: 0
      - name: probation_entered_at
        type: datetime
        source: system
        description: "Instant standing last became PROBATION; null while GOOD"
        default: null

  - name: ResellerAgreement
    parent: null
    common_fields: true
    fields:
      - name: reseller_id
        type: string
        source: input
        description: "FK -> Reseller.id; the counterparty"
      - name: policy_id
        type: string
        source: input
        description: "FK -> PricingPolicy.id; the unilateral policy the agreement references, must be PUBLISHED"
      - name: status
        type: enum
        source: system
        description: "Agreement lifecycle; forks at the reseller's response"
        default: DRAFT
        constraints: "DRAFT | SENT | COUNTERSIGNED | DECLINED | ACTIVE | TERMINATED | EXPIRED"
      - name: permitted_channels
        type: array
        source: input
        description: "Sales channel restriction; array of MARKETPLACE | RETAILER_SITE | OWN_WEBSITE | PHYSICAL_RETAIL"
        constraints: "1-4 distinct members; must contain the reseller's primary_channel"
      - name: quality_obligations
        type: array
        source: input
        description: "Array of AUTHENTICITY_LABELING | WARRANTY_HONORED | PACKAGING_INTACT | AUTHORIZED_SERVICE_ONLY"
        constraints: "0-4 distinct members"
      - name: term_ends_at
        type: datetime
        source: input
        description: "Agreement expiry instant, enforced by the enforcement sweep"
      - name: price_terms_included
        type: boolean
        source: input
        description: "Antitrust self-declaration; a true value is rejected because price terms may not be agreed"
        default: false
      - name: non_negotiation_acknowledged
        type: boolean
        source: system
        description: "Set from the reseller's COUNTERSIGN payload; required before activation when the policy demands it"
        default: false
      - name: sent_at
        type: datetime
        source: system
        description: "Instant the agreement was sent for countersignature"
        default: null
      - name: countersigned_at
        type: datetime
        source: system
        description: "Instant the reseller countersigned"
        default: null
      - name: countersigned_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Reseller principal who countersigned"
        default: null
      - name: activated_at
        type: datetime
        source: system
        description: "Instant the agreement became ACTIVE"
        default: null
      - name: closed_reason
        type: string
        source: system
        description: "Reason recorded on DECLINED, TERMINATED or EXPIRED"
        default: null

  - name: PriceObservation
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the monitored SKU"
      - name: channel
        type: enum
        source: input
        description: "Where the listing was observed"
        constraints: "MARKETPLACE | RETAILER_SITE | OWN_WEBSITE | PHYSICAL_RETAIL"
      - name: marketplace_name
        type: string
        source: input
        description: "Marketplace or retailer site name captured with the evidence"
        default: null
      - name: seller_display_name
        type: string
        source: input
        description: "Storefront name shown on the listing"
      - name: listing_url
        type: string
        source: input
        description: "Evidence URL of the listing"
      - name: listed_price_cents
        type: integer
        source: input
        description: "Advertised item price as displayed, in cents"
        constraints: "value >= 0"
      - name: shipping_cents
        type: integer
        source: input
        description: "Shipping charge displayed for the listing"
        default: 0
        constraints: "value >= 0"
      - name: auto_coupon_cents
        type: integer
        source: input
        description: "On-page automatically applied coupon amount"
        default: 0
        constraints: "value >= 0"
      - name: promo_code_cents
        type: integer
        source: input
        description: "Discount obtainable only by typing a promo code"
        default: 0
        constraints: "value >= 0"
      - name: is_bundle
        type: boolean
        source: input
        description: "Whether the listing sells the SKU inside a multi-item bundle"
        default: false
      - name: bundle_total_price_cents
        type: integer
        source: input
        description: "Advertised price of the whole bundle; required when is_bundle is true"
        default: null
        constraints: "value > 0 when is_bundle is true"
      - name: bundle_components
        type: array
        source: input
        description: "Array of objects { sku: string, msrp_cents: integer } evidencing the bundle contents"
        default: null
        constraints: "required when is_bundle is true; >= 2 members; must contain the observed product's sku; every msrp_cents > 0"
      - name: matched_reseller_id
        type: string
        source: input
        description: "FK -> Reseller.id; null when the storefront could not be matched to an authorized reseller"
        default: null
      - name: observed_at
        type: datetime
        source: input
        description: "Instant the listing was observed"
        constraints: "must be <= logical clock now and >= now minus 30 days"
      - name: evidence_hash
        type: string
        source: input
        description: "SHA-256 hex digest of the captured screenshot evidence"
        constraints: "exactly 64 lowercase hex characters"
      - name: evidence_captured_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MonitoringAnalyst who captured the evidence"
      - name: allocated_component_price_cents
        type: integer
        source: computed
        description: "Bundle allocation for the observed SKU (see calculations.bundle_component_allocation); null for non-bundles"
        default: null
      - name: effective_advertised_price_cents
        type: integer
        source: computed
        description: "Advertised price per the policy definition (see calculations.effective_advertised_price)"
        default: null
      - name: effective_map_floor_cents
        type: integer
        source: computed
        description: "Floor resolved as of observed_at (see calculations.effective_map_floor)"
        default: null
      - name: deviation_cents
        type: integer
        source: computed
        description: "effective_map_floor_cents minus effective_advertised_price_cents, floored at 0"
        default: null
      - name: deviation_pct
        type: number
        source: computed
        description: "deviation_cents divided by effective_map_floor_cents, 4 decimals"
        default: null
      - name: evaluation_status
        type: enum
        source: system
        description: "Evidence evaluation state"
        default: CAPTURED
        constraints: "CAPTURED | EVALUATED_COMPLIANT | EVALUATED_BREACH"
      - name: unauthorized_seller_confirmed
        type: boolean
        source: system
        description: "Set true when a test purchase against this listing confirms an unauthorized seller"
        default: false

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: observation_id
        type: string
        source: system
        description: "FK -> PriceObservation.id; the evidence the violation was opened from"
      - name: reseller_id
        type: string
        source: system
        description: "FK -> Reseller.id; copied from the observation's matched_reseller_id at evaluation"
      - name: cited_policy_id
        type: string
        source: system
        description: "FK -> PricingPolicy.id; the policy in force at observation.observed_at"
      - name: status
        type: enum
        source: system
        description: "Violation lifecycle; loops between NOTICED and DISPUTED"
        default: DETECTED
        constraints: "DETECTED | NOTICED | DISPUTED | CURED | ESCALATED | VOIDED | CLOSED_MOOT"
      - name: provisional_floor_cents
        type: integer
        source: computed
        description: "Floor resolved as of observed_at, snapshotted at detection"
      - name: provisional_points
        type: number
        source: computed
        description: "PROVISIONAL_AT_DETECTION variant of calculations.violation_points"
      - name: assessed_floor_cents
        type: integer
        source: computed
        description: "Floor resolved as of notice issuance; null until a notice is issued"
        default: null
      - name: assessed_points
        type: number
        source: computed
        description: "FINAL_AT_NOTICE variant of calculations.violation_points; null until a notice is issued"
        default: null
      - name: cure_deadline_at
        type: datetime
        source: system
        description: "Deadline to submit cure evidence; set at notice issuance, extended on a rejected dispute"
        default: null
      - name: dispute_rounds
        type: integer
        source: system
        description: "Number of disputes the reseller has already had rejected"
        default: 0
      - name: dispute_reason
        type: string
        source: system
        description: "Reason text from the most recent dispute"
        default: null
      - name: resolution_reason
        type: string
        source: system
        description: "Reason recorded on CURED, VOIDED, ESCALATED or CLOSED_MOOT"
        default: null

  - name: EnforcementNotice
    parent: null
    common_fields: true
    fields:
      - name: violation_id
        type: string
        source: input
        description: "FK -> Violation.id; the violation the notice is grounded in"
      - name: reseller_id
        type: string
        source: input
        description: "FK -> Reseller.id; must equal the violation's reseller_id"
      - name: rung
        type: enum
        source: computed
        description: "Ladder rung actually issued (see calculations.ladder_rung_selection)"
        constraints: "WARNING | SUSPENSION | TERMINATION"
      - name: status
        type: enum
        source: system
        description: "Notice lifecycle"
        default: ISSUED
        constraints: "ISSUED | ACKNOWLEDGED | SATISFIED | RESCINDED"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the issuer; anchors the segregation-of-duties check on TERMINATION"
      - name: cumulative_points_at_issue
        type: number
        source: computed
        description: "Reseller.violation_points_total plus this violation's assessed_points, snapshotted at issuance"
      - name: assessed_points
        type: number
        source: computed
        description: "FINAL_AT_NOTICE points charged by this notice; mirrored onto the violation"
      - name: suspension_starts_at
        type: datetime
        source: input
        description: "Start of the supply suspension window; required when the issued rung is SUSPENSION"
        default: null
      - name: suspension_ends_at
        type: datetime
        source: input
        description: "End of the supply suspension window; required when the issued rung is SUSPENSION"
        default: null
      - name: delivery_channel
        type: enum
        source: input
        description: "How the unilateral notice was delivered"
        constraints: "EMAIL | CERTIFIED_MAIL | PORTAL"
      - name: contains_pricing_discussion
        type: boolean
        source: input
        description: "Antitrust self-declaration; a true value is rejected because notices must be unilateral"
        default: false
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Instant the reseller acknowledged the notice"
        default: null
      - name: closed_reason
        type: string
        source: system
        description: "Reason recorded on SATISFIED or RESCINDED"
        default: null

  - name: PricingException
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the SKU the exception covers"
      - name: exception_type
        type: enum
        source: input
        description: "Nature of the exception"
        constraints: "CLEARANCE | BUNDLE | PROMOTIONAL_EVENT"
      - name: channel_scope
        type: enum
        source: input
        description: "Channels the exception covers; ALL intersects every channel"
        default: ALL
        constraints: "ALL | MARKETPLACE | RETAILER_SITE | OWN_WEBSITE | PHYSICAL_RETAIL"
      - name: starts_at
        type: datetime
        source: input
        description: "Window start, inclusive"
      - name: ends_at
        type: datetime
        source: input
        description: "Window end, exclusive"
        constraints: "must be strictly after starts_at; window duration <= 180 days"
      - name: requested_override_floor_cents
        type: integer
        source: input
        description: "Requested replacement floor; required for BUNDLE and PROMOTIONAL_EVENT, ignored for CLEARANCE"
        default: null
      - name: override_floor_cents
        type: integer
        source: computed
        description: "Floor the exception installs, snapshotted at approval (see calculations.exception_override_floor)"
        default: null
      - name: status
        type: enum
        source: system
        description: "Exception lifecycle"
        default: REQUESTED
        constraints: "REQUESTED | APPROVED | REJECTED | EXPIRED | VOIDED"
      - name: retroactive
        type: boolean
        source: computed
        description: "True when starts_at is strictly before the logical clock at creation time"
        default: false
      - name: dealer_input_source
        type: enum
        source: input
        description: "Provenance of the exception request; RESELLER_PRICING_REQUEST is an antitrust-prohibited dealer price input"
        default: NONE
        constraints: "NONE | RESELLER_PRICING_REQUEST | RETAILER_INVENTORY_REPORT | BRAND_MARKETING_PLAN"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BrandChannelManager who requested the exception"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BrandLegalCounsel who decided the exception"
        default: null
      - name: decision_reason
        type: string
        source: system
        description: "Reason recorded on APPROVED, REJECTED or VOIDED"
        default: null
      - name: voided_violation_count
        type: integer
        source: computed
        description: "Number of violations voided by this exception's approval cascade"
        default: 0

  - name: SerialUnit
    parent: null
    common_fields: true
    fields:
      - name: serial_number
        type: string
        source: input
        description: "Serialized unit identifier printed on the carton"
        constraints: "1-40 chars; unique across all SerialUnit rows"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; must have serialization_enabled true"
      - name: lot_code
        type: string
        source: input
        description: "Shipment lot the unit belongs to; anchors lot-prorated diversion attribution"
        constraints: "1-40 chars"
      - name: shipped_distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the distributor the unit was shipped to"
      - name: downstream_reseller_id
        type: string
        source: system
        description: "FK -> Reseller.id; set when the distributor reports a downstream shipment"
        default: null
      - name: status
        type: enum
        source: system
        description: "Physical custody / tracing state"
        default: SHIPPED_TO_DISTRIBUTOR
        constraints: "SHIPPED_TO_DISTRIBUTOR | SHIPPED_TO_RESELLER | TRACED_UNAUTHORIZED | RECALLED"
      - name: shipped_downstream_at
        type: datetime
        source: system
        description: "Instant the distributor reported the downstream shipment"
        default: null
      - name: traced_at
        type: datetime
        source: system
        description: "Instant a confirmed test purchase traced this unit to an unauthorized seller"
        default: null

  - name: TestPurchase
    parent: null
    common_fields: true
    fields:
      - name: observation_id
        type: string
        source: input
        description: "FK -> PriceObservation.id; the suspect listing the buy was placed against"
      - name: ordered_at
        type: datetime
        source: input
        description: "Instant the test purchase was ordered"
        constraints: "must be <= logical clock now"
      - name: purchase_price_cents
        type: integer
        source: input
        description: "Amount actually paid for the test unit"
        constraints: "value > 0"
      - name: purchaser_user_id
        type: string
        source: system
        description: "X-User-ID of the MonitoringAnalyst who placed the buy"
      - name: status
        type: enum
        source: system
        description: "Test purchase lifecycle"
        default: ORDERED
        constraints: "ORDERED | SERIAL_CAPTURED | CONFIRMED_UNAUTHORIZED | CLEARED"
      - name: captured_serial_number
        type: string
        source: system
        description: "Serial number read off the received unit"
        default: null
      - name: traced_serial_unit_id
        type: string
        source: system
        description: "FK -> SerialUnit.id; the unit the captured serial resolved to"
        default: null
      - name: outcome_reason
        type: string
        source: system
        description: "Reason recorded on CONFIRMED_UNAUTHORIZED or CLEARED"
        default: null

  - name: DistributorChargeback
    parent: null
    common_fields: true
    fields:
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the accountable distributor"
      - name: test_purchase_id
        type: string
        source: input
        description: "FK -> TestPurchase.id; must be CONFIRMED_UNAUTHORIZED and traced to this distributor"
      - name: diverted_units
        type: integer
        source: input
        description: "Units charged back for this diversion event"
        constraints: "value >= 1"
      - name: tier_rate_cents_per_unit
        type: integer
        source: computed
        description: "Per-unit rate selected from the pre-increment diversion score (see calculations.chargeback_assessment)"
      - name: amount_cents
        type: integer
        source: computed
        description: "tier_rate_cents_per_unit multiplied by diverted_units"
      - name: score_delta_applied
        type: number
        source: computed
        description: "Diversion-score increment this chargeback contributed; reversed verbatim on REVERSED"
      - name: status
        type: enum
        source: system
        description: "Chargeback lifecycle; loops between UPHELD and DISPUTED"
        default: ASSESSED
        constraints: "ASSESSED | DISPUTED | UPHELD | REVERSED"
      - name: dispute_rounds
        type: integer
        source: system
        description: "Number of dispute rounds already decided"
        default: 0
      - name: dispute_reason
        type: string
        source: system
        description: "Reason text from the most recent dispute"
        default: null
      - name: decision_reason
        type: string
        source: system
        description: "Reason recorded on UPHELD or REVERSED"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PricingPolicy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: IN_LEGAL_REVIEW
        trigger: "POST /pricing-policies/{policy_id}/submit-review"
        actor: BrandChannelManager
        preconditions:
          - "status == DRAFT"
          - "termination_points_threshold > suspension_points_threshold"
        side_effects:
          - "increments PricingPolicy.version by 1"
      - from: IN_LEGAL_REVIEW
        to: DRAFT
        trigger: "POST /pricing-policies/{policy_id}/review-decision with decision == RETURN_FOR_REVISION"
        actor: BrandLegalCounsel
        preconditions:
          - "status == IN_LEGAL_REVIEW"
        side_effects:
          - "sets PricingPolicy.revision_number = revision_number + 1"
          - "sets PricingPolicy.legal_review_notes and reviewed_by_user_id"
          - "increments PricingPolicy.version by 1"
        note: "Revision loop; the same draft may cycle DRAFT -> IN_LEGAL_REVIEW -> DRAFT any number of times."
      - from: IN_LEGAL_REVIEW
        to: APPROVED
        trigger: "POST /pricing-policies/{policy_id}/review-decision with decision == APPROVE_FOR_PUBLICATION"
        actor: BrandLegalCounsel
        preconditions:
          - "status == IN_LEGAL_REVIEW"
        side_effects:
          - "sets PricingPolicy.legal_review_notes and reviewed_by_user_id"
          - "increments PricingPolicy.version by 1"
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /pricing-policies/{policy_id}/publish"
        actor: BrandLegalCounsel
        preconditions:
          - "status == APPROVED"
          - "effective_from in the request is >= the logical clock now"
        side_effects:
          - "sets PricingPolicy.effective_from and published_by_user_id"
          - "for the single other PricingPolicy in status PUBLISHED, if any (there is at most one): sets its status = SUPERSEDED, sets its superseded_by_policy_id = this policy's id, increments its version by 1"
          - "increments PricingPolicy.version by 1"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /pricing-policies/{policy_id}/withdraw"
        actor: BrandLegalCounsel
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "sets PricingPolicy.withdrawn_reason"
          - "increments PricingPolicy.version by 1"
        note: "Withdrawal does not cascade to products or violations; instead it blocks new EnforcementNotice issuance for violations citing this policy (§1.4 priority 10)."
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system event: another APPROVED policy is published"
        actor: system
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "sets PricingPolicy.superseded_by_policy_id to the newly published policy's id"
          - "increments PricingPolicy.version by 1"

  - entity: ResellerAgreement
    initial_state: DRAFT
    terminal_states: [DECLINED, TERMINATED, EXPIRED]
    shape: branching
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /reseller-agreements/{agreement_id}/send"
        actor: BrandChannelManager
        preconditions:
          - "status == DRAFT"
          - "the referenced Reseller.authorization_status == APPLIED"
          - "the referenced PricingPolicy.status == PUBLISHED"
        side_effects:
          - "sets ResellerAgreement.sent_at = clock now"
          - "sets Reseller.authorization_status = PENDING_AGREEMENT and increments Reseller.version by 1"
          - "increments ResellerAgreement.version by 1"
      - from: SENT
        to: COUNTERSIGNED
        trigger: "POST /reseller-agreements/{agreement_id}/respond with decision == COUNTERSIGN"
        actor: Reseller
        preconditions:
          - "status == SENT"
          - "the referenced Reseller.authorization_status == PENDING_AGREEMENT"
          - "request omits counter_price_proposal_cents (antitrust)"
        side_effects:
          - "sets ResellerAgreement.countersigned_at, countersigned_by_user_id, non_negotiation_acknowledged"
          - "increments ResellerAgreement.version by 1"
        note: "Fork branch A. No Reseller field changes here; authorization advances only at activation."
      - from: SENT
        to: DECLINED
        trigger: "POST /reseller-agreements/{agreement_id}/respond with decision == DECLINE"
        actor: Reseller
        preconditions:
          - "status == SENT"
          - "the referenced Reseller.authorization_status == PENDING_AGREEMENT"
        side_effects:
          - "sets ResellerAgreement.closed_reason from decline_reason"
          - "sets Reseller.authorization_status = APPLIED, supply_status = HOLD, hold_reason = PENDING_AUTHORIZATION, increments Reseller.version by 1"
          - "increments ResellerAgreement.version by 1"
        note: "Fork branch B; divergent side-effect set from branch A (the reseller is rolled back to APPLIED instead of held at PENDING_AGREEMENT)."
      - from: COUNTERSIGNED
        to: ACTIVE
        trigger: "POST /reseller-agreements/{agreement_id}/activate"
        actor: BrandChannelManager
        preconditions:
          - "status == COUNTERSIGNED"
          - "non_negotiation_acknowledged == true when the referenced policy has non_negotiation_ack_required == true"
          - "the referenced PricingPolicy.status == PUBLISHED"
        side_effects:
          - "sets ResellerAgreement.activated_at = clock now"
          - "sets Reseller.authorization_status = AUTHORIZED, supply_status = OPEN, hold_reason = NONE, increments Reseller.version by 1"
          - "increments ResellerAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: POST /enforcement-sweeps observes term_ends_at <= clock now"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "term_ends_at <= clock now"
        side_effects:
          - "sets ResellerAgreement.closed_reason = 'TERM_EXPIRED'"
          - "sets Reseller.supply_status = HOLD and hold_reason = AGREEMENT_EXPIRED, leaves Reseller.authorization_status unchanged, increments Reseller.version by 1"
          - "increments ResellerAgreement.version by 1"
        note: "Demonstrates axis independence: the supply axis moves to HOLD while the authorization axis stays AUTHORIZED."
      - from: ACTIVE
        to: TERMINATED
        trigger: "system event: a TERMINATION EnforcementNotice sets the reseller's authorization_status = TERMINATED"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the referenced Reseller.authorization_status == TERMINATED"
        side_effects:
          - "sets ResellerAgreement.closed_reason = 'SUPPLY_TERMINATED'"
          - "for every SerialUnit whose downstream_reseller_id == this agreement's reseller_id and status == SHIPPED_TO_RESELLER: sets status = RECALLED and increments its version by 1"
          - "increments ResellerAgreement.version by 1"
        note: "Link 3 of cascade chain A; the SerialUnit recall is caused by this agreement transition, not by the notice."

  - entity: Reseller
    initial_state: "APPLIED / HOLD"
    terminal_states: ["TERMINATED / CUT_OFF"]
    shape: parallel
    note: |
      Two independent axes on the same row. Axis A is authorization_status
      (APPLIED -> PENDING_AGREEMENT -> AUTHORIZED <-> SUSPENDED -> TERMINATED). Axis B is supply_status
      (OPEN <-> HOLD -> CUT_OFF) with hold_reason recording the cause. Axis B can move without Axis A
      (quality-obligation hold, agreement expiry) and Axis A moves force Axis B only on SUSPENDED and TERMINATED.
    transitions:
      - from: "authorization_status == APPLIED"
        to: "authorization_status == PENDING_AGREEMENT"
        trigger: "POST /reseller-agreements/{agreement_id}/send"
        actor: BrandChannelManager
        preconditions:
          - "authorization_status == APPLIED"
        side_effects:
          - "increments Reseller.version by 1"
      - from: "authorization_status == PENDING_AGREEMENT"
        to: "authorization_status == AUTHORIZED, supply_status == OPEN, hold_reason == NONE"
        trigger: "POST /reseller-agreements/{agreement_id}/activate"
        actor: BrandChannelManager
        preconditions:
          - "authorization_status == PENDING_AGREEMENT"
          - "the agreement's status == COUNTERSIGNED"
        side_effects:
          - "increments Reseller.version by 1"
      - from: "authorization_status == AUTHORIZED"
        to: "authorization_status == SUSPENDED, supply_status == HOLD, hold_reason == SUSPENSION"
        trigger: "POST /enforcement-notices resolving to rung == SUSPENSION"
        actor: BrandChannelManager
        preconditions:
          - "authorization_status IN {AUTHORIZED, SUSPENDED}"
          - "authorization_status != TERMINATED"
        side_effects:
          - "sets Reseller.suspension_ends_at = the notice's suspension_ends_at"
          - "increments Reseller.version by 1"
      - from: "authorization_status == SUSPENDED"
        to: "authorization_status == AUTHORIZED, supply_status == OPEN, hold_reason == NONE"
        trigger: "system event: POST /enforcement-sweeps observes suspension_ends_at <= clock now"
        actor: system
        preconditions:
          - "authorization_status == SUSPENDED"
          - "hold_reason == SUSPENSION"
          - "suspension_ends_at <= clock now"
        side_effects:
          - "sets Reseller.last_suspension_ended_at = suspension_ends_at, suspension_ends_at = null"
          - "sets the governing SUSPENSION EnforcementNotice.status = SATISFIED and increments its version by 1"
          - "increments Reseller.version by 1"
        note: "Reinstatement cycle: AUTHORIZED -> SUSPENDED -> AUTHORIZED."
      - from: "authorization_status == SUSPENDED"
        to: "authorization_status == AUTHORIZED, supply_status == OPEN, hold_reason == NONE"
        trigger: "POST /enforcement-notices/{notice_id}/rescind on the governing SUSPENSION notice"
        actor: BrandLegalCounsel
        preconditions:
          - "authorization_status == SUSPENDED"
          - "the notice's rung == SUSPENSION and status IN {ISSUED, ACKNOWLEDGED}"
        side_effects:
          - "sets Reseller.last_suspension_ended_at = clock now, suspension_ends_at = null"
          - "decrements Reseller.violation_points_total by the notice's assessed_points"
          - "increments Reseller.version by 1"
      - from: "authorization_status IN {AUTHORIZED, SUSPENDED}"
        to: "authorization_status == TERMINATED, supply_status == CUT_OFF, hold_reason == TERMINATION"
        trigger: "POST /enforcement-notices resolving to rung == TERMINATION"
        actor: BrandLegalCounsel
        preconditions:
          - "authorization_status IN {AUTHORIZED, SUSPENDED}"
        side_effects:
          - "sets Reseller.terminated_at = clock now, suspension_ends_at = null"
          - "for every Violation of this reseller with status IN {DETECTED, NOTICED, DISPUTED}: sets status = CLOSED_MOOT, resolution_reason = 'RESELLER_TERMINATED', increments its version by 1 (assessed_points are retained in the ledger)"
          - "for the ResellerAgreement of this reseller in status ACTIVE: sets status = TERMINATED (which in turn recalls its SHIPPED_TO_RESELLER SerialUnits)"
          - "increments Reseller.version by 1"
        note: "Links 2 and 3 of cascade chain A."
      - from: "supply_status == OPEN"
        to: "supply_status == HOLD, hold_reason == QUALITY_OBLIGATION"
        trigger: "POST /resellers/{reseller_id}/supply-status with supply_status == HOLD"
        actor: BrandChannelManager
        preconditions:
          - "supply_status == OPEN"
          - "authorization_status != TERMINATED"
        side_effects:
          - "increments Reseller.version by 1"
        note: "Axis B moves alone; authorization_status stays AUTHORIZED."
      - from: "supply_status == HOLD, hold_reason IN {QUALITY_OBLIGATION, AGREEMENT_EXPIRED}"
        to: "supply_status == OPEN, hold_reason == NONE"
        trigger: "POST /resellers/{reseller_id}/supply-status with supply_status == OPEN"
        actor: BrandChannelManager
        preconditions:
          - "supply_status == HOLD"
          - "hold_reason IN {QUALITY_OBLIGATION, AGREEMENT_EXPIRED}"
          - "authorization_status == AUTHORIZED"
        side_effects:
          - "increments Reseller.version by 1"
        note: "A SUSPENSION or TERMINATION hold may not be released on this axis (ERR_SUPPLY_BLOCKED_BY_AUTHORIZATION)."

  - entity: PriceObservation
    initial_state: CAPTURED
    terminal_states: [EVALUATED_COMPLIANT, EVALUATED_BREACH]
    shape: branching
    transitions:
      - from: CAPTURED
        to: EVALUATED_COMPLIANT
        trigger: "POST /price-observations/{observation_id}/evaluate"
        actor: MonitoringAnalyst
        preconditions:
          - "evaluation_status == CAPTURED"
          - "the product's governing PricingPolicy has status IN {PUBLISHED, SUPERSEDED, WITHDRAWN} and effective_from <= observed_at"
        side_effects:
          - "sets allocated_component_price_cents (bundles only), effective_advertised_price_cents, effective_map_floor_cents, deviation_cents = 0, deviation_pct = 0"
          - "increments PriceObservation.version by 1"
        note: "Compliant branch: effective_advertised_price_cents >= effective_map_floor_cents. No Violation row is created."
      - from: CAPTURED
        to: EVALUATED_BREACH
        trigger: "POST /price-observations/{observation_id}/evaluate"
        actor: MonitoringAnalyst
        preconditions:
          - "evaluation_status == CAPTURED"
          - "effective_advertised_price_cents < effective_map_floor_cents"
        side_effects:
          - "sets allocated_component_price_cents (bundles only), effective_advertised_price_cents, effective_map_floor_cents, deviation_cents, deviation_pct"
          - "when matched_reseller_id is not null: creates a Violation in status DETECTED with provisional_floor_cents and provisional_points"
          - "when matched_reseller_id is null: creates no Violation; the breach is routed to test purchasing instead"
          - "increments PriceObservation.version by 1"
        note: "Divergent side-effect sets on the same target state depending on whether the storefront was matched."

  - entity: Violation
    initial_state: DETECTED
    terminal_states: [CURED, ESCALATED, VOIDED, CLOSED_MOOT]
    shape: cyclic
    transitions:
      - from: DETECTED
        to: NOTICED
        trigger: "POST /enforcement-notices"
        actor: "BrandChannelManager | BrandLegalCounsel"
        preconditions:
          - "status == DETECTED"
          - "cited_policy_id resolves to a PricingPolicy with status == PUBLISHED"
          - "the reseller's authorization_status != TERMINATED"
          - "the FINAL_AT_NOTICE points are > 0"
        side_effects:
          - "sets assessed_floor_cents and assessed_points from the FINAL_AT_NOTICE variant"
          - "sets cure_deadline_at = clock now + cited policy cure_window_days"
          - "increments Reseller.violation_points_total by assessed_points and increments Reseller.version by 1"
          - "increments Violation.version by 1"
      - from: NOTICED
        to: CURED
        trigger: "POST /violations/{violation_id}/cure-submission"
        actor: Reseller
        preconditions:
          - "status == NOTICED"
          - "clock now <= cure_deadline_at"
        side_effects:
          - "sets resolution_reason = 'CURE_ACCEPTED'"
          - "sets the latest non-RESCINDED EnforcementNotice for this violation to status = SATISFIED and increments its version by 1"
          - "leaves assessed_points in the reseller ledger (a cured violation still counts toward the ladder)"
          - "increments Violation.version by 1"
      - from: NOTICED
        to: DISPUTED
        trigger: "POST /violations/{violation_id}/dispute"
        actor: Reseller
        preconditions:
          - "status == NOTICED"
          - "dispute_rounds < 2"
        side_effects:
          - "sets dispute_reason"
          - "increments Violation.version by 1"
      - from: DISPUTED
        to: NOTICED
        trigger: "POST /violations/{violation_id}/dispute-decision with decision == REJECT"
        actor: BrandChannelManager
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "sets dispute_rounds = dispute_rounds + 1"
          - "sets cure_deadline_at = cure_deadline_at + 5 days (DISPUTE_EXTENSION_DAYS)"
          - "sets resolution_reason = null"
          - "increments Violation.version by 1"
        note: "Dispute cycle NOTICED -> DISPUTED -> NOTICED, capped at 2 rejected rounds."
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /violations/{violation_id}/dispute-decision with decision == SUSTAIN"
        actor: BrandChannelManager
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "sets resolution_reason = 'DISPUTE_SUSTAINED'"
          - "decrements Reseller.violation_points_total by assessed_points, then sets assessed_points = null and assessed_floor_cents = null and cure_deadline_at = null, increments Reseller.version by 1"
          - "sets the latest non-RESCINDED EnforcementNotice for this violation to status = RESCINDED (which, when its rung == SUSPENSION, reinstates the reseller)"
          - "increments Violation.version by 1"
      - from: NOTICED
        to: ESCALATED
        trigger: "system event: POST /enforcement-sweeps observes cure_deadline_at <= clock now"
        actor: system
        preconditions:
          - "status == NOTICED"
          - "cure_deadline_at <= clock now"
        side_effects:
          - "sets resolution_reason = 'CURE_WINDOW_LAPSED'"
          - "leaves assessed_points in the reseller ledger"
          - "increments Violation.version by 1"
      - from: "DETECTED | NOTICED | DISPUTED"
        to: VOIDED
        trigger: "system event: POST /pricing-exceptions/{exception_id}/decision with decision == APPROVE covers this violation and lifts it above the new floor"
        actor: system
        preconditions:
          - "status IN {DETECTED, NOTICED, DISPUTED}"
          - "the observation's channel is in the exception's scope, observed_at is inside [starts_at, ends_at), and observation.effective_advertised_price_cents >= exception.override_floor_cents"
        side_effects:
          - "sets resolution_reason = 'RETROACTIVE_EXCEPTION'"
          - "when assessed_points is not null: decrements Reseller.violation_points_total by assessed_points, sets assessed_points = null, increments Reseller.version by 1"
          - "sets any ISSUED or ACKNOWLEDGED EnforcementNotice for this violation to status = RESCINDED"
          - "increments Violation.version by 1"
      - from: "DETECTED | NOTICED | DISPUTED"
        to: CLOSED_MOOT
        trigger: "system event: the reseller's authorization_status becomes TERMINATED"
        actor: system
        preconditions:
          - "status IN {DETECTED, NOTICED, DISPUTED}"
        side_effects:
          - "sets resolution_reason = 'RESELLER_TERMINATED'"
          - "retains assessed_points in the reseller ledger"
          - "increments Violation.version by 1"
        note: "Link 2b of cascade chain A."

  - entity: EnforcementNotice
    initial_state: ISSUED
    terminal_states: [SATISFIED, RESCINDED]
    shape: branching
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /enforcement-notices/{notice_id}/acknowledge"
        actor: Reseller
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "sets acknowledged_at = clock now"
          - "increments EnforcementNotice.version by 1"
      - from: "ISSUED | ACKNOWLEDGED"
        to: SATISFIED
        trigger: "system event: the cited Violation reaches CURED, or the suspension window ends during POST /enforcement-sweeps"
        actor: system
        preconditions:
          - "status IN {ISSUED, ACKNOWLEDGED}"
        side_effects:
          - "sets closed_reason = 'VIOLATION_CURED' or 'SUSPENSION_SERVED'"
          - "increments EnforcementNotice.version by 1"
      - from: "ISSUED | ACKNOWLEDGED"
        to: RESCINDED
        trigger: "POST /enforcement-notices/{notice_id}/rescind, or a sustained dispute / retroactive exception on the cited Violation"
        actor: "BrandLegalCounsel | system"
        preconditions:
          - "status IN {ISSUED, ACKNOWLEDGED}"
          - "rung != TERMINATION"
        side_effects:
          - "sets closed_reason from rescinded_reason"
          - "when invoked directly: sets the cited Violation back to status = DETECTED with assessed_points = null, assessed_floor_cents = null, cure_deadline_at = null, and decrements Reseller.violation_points_total by this notice's assessed_points"
          - "when rung == SUSPENSION and the reseller is SUSPENDED: sets Reseller.authorization_status = AUTHORIZED, supply_status = OPEN, hold_reason = NONE, last_suspension_ended_at = clock now"
          - "increments EnforcementNotice.version by 1"
        note: "A TERMINATION notice is not rescindable (ERR_TERMINATION_NOT_RESCINDABLE)."

  - entity: PricingException
    initial_state: REQUESTED
    terminal_states: [REJECTED, EXPIRED, VOIDED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /pricing-exceptions/{exception_id}/decision with decision == APPROVE"
        actor: BrandLegalCounsel
        preconditions:
          - "status == REQUESTED"
          - "when exception_type == CLEARANCE: the referenced Product.lifecycle_status == CLEARANCE"
          - "the referenced Product.lifecycle_status != DISCONTINUED"
        side_effects:
          - "sets override_floor_cents per calculations.exception_override_floor and approved_by_user_id"
          - "increments Product.open_exception_count by 1 and increments Product.version by 1"
          - "voids every covered Violation lifted above the new floor and sets voided_violation_count accordingly"
          - "increments PricingException.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /pricing-exceptions/{exception_id}/decision with decision == REJECT"
        actor: BrandLegalCounsel
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "sets decision_reason and approved_by_user_id"
          - "increments PricingException.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system event: POST /enforcement-sweeps observes ends_at <= clock now"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "ends_at <= clock now"
        side_effects:
          - "decrements Product.open_exception_count by 1 and increments Product.version by 1"
          - "increments PricingException.version by 1"
      - from: "REQUESTED | APPROVED"
        to: VOIDED
        trigger: "system event: PATCH /products/{product_id} sets lifecycle_status = DISCONTINUED"
        actor: system
        preconditions:
          - "status IN {REQUESTED, APPROVED}"
        side_effects:
          - "sets decision_reason = 'PRODUCT_DISCONTINUED'"
          - "when the prior status was APPROVED: decrements Product.open_exception_count by 1"
          - "increments PricingException.version by 1"

  - entity: SerialUnit
    initial_state: SHIPPED_TO_DISTRIBUTOR
    terminal_states: [RECALLED]
    shape: linear
    transitions:
      - from: SHIPPED_TO_DISTRIBUTOR
        to: SHIPPED_TO_RESELLER
        trigger: "POST /serial-units/{serial_unit_id}/ship-downstream"
        actor: Distributor
        preconditions:
          - "status == SHIPPED_TO_DISTRIBUTOR"
          - "the acting Distributor's id == shipped_distributor_id"
          - "the target Reseller.supply_status == OPEN"
        side_effects:
          - "sets downstream_reseller_id and shipped_downstream_at = clock now"
          - "increments SerialUnit.version by 1"
      - from: "SHIPPED_TO_DISTRIBUTOR | SHIPPED_TO_RESELLER"
        to: TRACED_UNAUTHORIZED
        trigger: "system event: POST /test-purchases/{test_purchase_id}/confirm-outcome with outcome == UNAUTHORIZED"
        actor: system
        preconditions:
          - "status IN {SHIPPED_TO_DISTRIBUTOR, SHIPPED_TO_RESELLER}"
        side_effects:
          - "sets traced_at = clock now"
          - "when downstream_reseller_id is not null: recomputes that Reseller.review_required and increments its version by 1"
          - "increments SerialUnit.version by 1"
      - from: SHIPPED_TO_RESELLER
        to: RECALLED
        trigger: "system event: the reseller's ResellerAgreement becomes TERMINATED"
        actor: system
        preconditions:
          - "status == SHIPPED_TO_RESELLER"
        side_effects:
          - "increments SerialUnit.version by 1"
        note: "Link 4 of cascade chain A."

  - entity: TestPurchase
    initial_state: ORDERED
    terminal_states: [CONFIRMED_UNAUTHORIZED, CLEARED]
    shape: branching
    transitions:
      - from: ORDERED
        to: SERIAL_CAPTURED
        trigger: "POST /test-purchases/{test_purchase_id}/serial-capture"
        actor: MonitoringAnalyst
        preconditions:
          - "status == ORDERED"
          - "a SerialUnit with the submitted serial_number exists and its status IN {SHIPPED_TO_DISTRIBUTOR, SHIPPED_TO_RESELLER}"
        side_effects:
          - "sets captured_serial_number and traced_serial_unit_id"
          - "increments TestPurchase.version by 1"
      - from: SERIAL_CAPTURED
        to: CONFIRMED_UNAUTHORIZED
        trigger: "POST /test-purchases/{test_purchase_id}/confirm-outcome with outcome == UNAUTHORIZED"
        actor: MonitoringAnalyst
        preconditions:
          - "status == SERIAL_CAPTURED"
          - "traced_serial_unit_id is not null"
        side_effects:
          - "sets outcome_reason"
          - "sets the linked PriceObservation.unauthorized_seller_confirmed = true and increments its version by 1"
          - "sets the traced SerialUnit.status = TRACED_UNAUTHORIZED (which recomputes the downstream reseller's review_required)"
          - "increments TestPurchase.version by 1"
      - from: SERIAL_CAPTURED
        to: CLEARED
        trigger: "POST /test-purchases/{test_purchase_id}/confirm-outcome with outcome == AUTHORIZED"
        actor: MonitoringAnalyst
        preconditions:
          - "status == SERIAL_CAPTURED"
        side_effects:
          - "sets outcome_reason"
          - "leaves the traced SerialUnit and the observation untouched"
          - "increments TestPurchase.version by 1"

  - entity: DistributorChargeback
    initial_state: ASSESSED
    terminal_states: [REVERSED]
    shape: cyclic
    transitions:
      - from: "ASSESSED | UPHELD"
        to: DISPUTED
        trigger: "POST /distributor-chargebacks/{chargeback_id}/dispute"
        actor: Distributor
        preconditions:
          - "status IN {ASSESSED, UPHELD}"
          - "dispute_rounds < 2"
          - "the acting Distributor's id == distributor_id"
        side_effects:
          - "sets dispute_reason"
          - "increments DistributorChargeback.version by 1"
      - from: DISPUTED
        to: UPHELD
        trigger: "POST /distributor-chargebacks/{chargeback_id}/dispute-decision with decision == UPHOLD"
        actor: BrandLegalCounsel
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "sets dispute_rounds = dispute_rounds + 1 and decision_reason"
          - "leaves amount_cents in Distributor.chargeback_balance_cents and score_delta_applied in Distributor.diversion_score"
          - "increments DistributorChargeback.version by 1"
        note: "Cycle: UPHELD may be disputed again until dispute_rounds reaches 2."
      - from: DISPUTED
        to: REVERSED
        trigger: "POST /distributor-chargebacks/{chargeback_id}/dispute-decision with decision == REVERSE"
        actor: BrandLegalCounsel
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "sets decision_reason"
          - "decrements Distributor.chargeback_balance_cents by amount_cents and Distributor.diversion_score by score_delta_applied, recomputes standing, increments Distributor.version by 1"
          - "recomputes review_required for every Reseller whose sourcing_distributor_id == distributor_id, incrementing each changed Reseller's version by 1"
          - "increments DistributorChargeback.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: notice-issue-stale-reseller
    parent_entity: Reseller
    write_endpoint: "POST /enforcement-notices"
    occ_field: "expected_reseller_version"
    description: |
      Issuing an EnforcementNotice against a Reseller whose version has advanced since the client last
      read it is rejected. The rung a notice carries is derived from the reseller's cumulative points and
      highest previously issued rung, so a client working from a stale reseller view would install a rung
      that the current ledger does not support. Any earlier notice, rescission, sweep reinstatement or
      exception-driven point reversal advances the version and invalidates the client's view.
    error_id: ERR_STALE_RESELLER_VERSION
    http_status: 412

  - rule_id: chargeback-create-stale-distributor
    parent_entity: Distributor
    write_endpoint: "POST /distributor-chargebacks"
    occ_field: "expected_distributor_version"
    description: |
      Assessing a DistributorChargeback against a Distributor whose version has advanced since the client
      last read it is rejected. The per-unit tier rate is selected from the distributor's pre-increment
      diversion_score, so a stale view silently prices the chargeback at the wrong tier; the OCC check
      converts that into a deterministic 412 instead.
    error_id: ERR_STALE_DISTRIBUTOR_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bundle_component_allocation
    trigger: "POST /price-observations/{observation_id}/evaluate, only when observation.is_bundle == true"
    algorithm: waterfall_allocation
    formula: |
      # Allocates the advertised bundle price across the evidenced components.
      # ROUNDING ORDER IS PINNED: round each component share to whole cents FIRST, then give the
      # residual to the last component in the ordering. "Sum then round" is explicitly NOT used.
      components = observation.bundle_components            # [{sku, msrp_cents}, ...] as captured in evidence
      total_component_msrp_cents = sum(c.msrp_cents for c in components)
      ordered = sort(components, key = (c.msrp_cents DESC, c.sku ASC))     # tie-break on sku, never on id
      running_cents = 0
      for i, c in enumerate(ordered):
          if i < len(ordered) - 1:
              share_cents[c.sku] = round_half_up(
                  observation.bundle_total_price_cents * c.msrp_cents / total_component_msrp_cents)
              running_cents += share_cents[c.sku]
          else:
              share_cents[c.sku] = observation.bundle_total_price_cents - running_cents   # residual
      allocated_component_price_cents = share_cents[product.sku]
    input_set: "The component array supplied on the observation as evidence (NOT the Product.msrp_cents of sibling SKUs); every member participates regardless of whether the brand sells it"
    constants:
      RESIDUAL_RECIPIENT: "last member of (msrp_cents DESC, sku ASC)"
    precision: "whole cents, round_half_up per component, residual absorbs the rounding drift so sum(share_cents) == bundle_total_price_cents exactly"

  - name: effective_advertised_price
    trigger: "POST /price-observations/{observation_id}/evaluate"
    algorithm: constraint_propagation
    formula: |
      base_price_cents = observation.allocated_component_price_cents if observation.is_bundle
                         else observation.listed_price_cents
      gross_cents = base_price_cents
                    + (observation.shipping_cents if policy.shipping_counts_as_advertised else 0)
      qualifying = []
      if policy.auto_coupon_counts_as_advertised:  qualifying.append(observation.auto_coupon_cents)
      if policy.promo_code_counts_as_advertised:   qualifying.append(observation.promo_code_cents)
      # Only the single LARGEST qualifying discount is attributable; discounts are never summed.
      discount_candidate_cents = max(qualifying) if len(qualifying) > 0 else 0
      attribution_cap_cents = floor(gross_cents * policy.max_discount_attribution_pct)
      effective_advertised_price_cents = gross_cents - min(discount_candidate_cents, attribution_cap_cents)
    input_set: "policy = the PricingPolicy in force at observation.observed_at (see effective_policy_selection); all four money inputs come from the observation row"
    constants:
      DISCOUNT_COMBINATION: "max, never sum"
      CAP_ROUNDING: "floor"
    precision: "integer cents throughout; floor on the attribution cap, no other rounding"

  - name: effective_policy_selection
    trigger: "POST /price-observations/{observation_id}/evaluate and POST /enforcement-notices"
    algorithm: chronological
    formula: |
      candidates = PricingPolicy rows where status IN {PUBLISHED, SUPERSEDED, WITHDRAWN}
                   AND effective_from is not null AND effective_from <= as_of
      if candidates is empty: reject with ERR_NO_GOVERNING_POLICY
      selected = sort(candidates, key = (effective_from DESC, created_at ASC))[0]
    input_set: "as_of = observation.observed_at at evaluation; the violation's cited_policy_id is frozen at detection and reused verbatim at notice issuance"
    constants:
      TIE_BREAK: "created_at ASC (never id)"
    precision: "n/a"

  - name: exception_override_floor
    trigger: "POST /pricing-exceptions/{exception_id}/decision with decision == APPROVE"
    algorithm: threshold
    formula: |
      if exception.exception_type == CLEARANCE:
          # requested_override_floor_cents is IGNORED for CLEARANCE
          override_floor_cents = round_half_up(
              product.standard_map_floor_cents * (1 - product.clearance_discount_pct))
      else:   # BUNDLE or PROMOTIONAL_EVENT
          override_floor_cents = exception.requested_override_floor_cents
          require override_floor_cents < product.standard_map_floor_cents
          require override_floor_cents >= floor(product.standard_map_floor_cents * MIN_FLOOR_RATIO)
          otherwise reject with ERR_OVERRIDE_FLOOR_OUT_OF_RANGE
    input_set: "the Product row as it stands at approval time; the resulting floor is a snapshot and does not move if the product is later re-priced"
    constants:
      MIN_FLOOR_RATIO: 0.50
    precision: "whole cents, round_half_up; floor() on the MIN_FLOOR_RATIO guard"

  - name: effective_map_floor
    trigger: "POST /price-observations/{observation_id}/evaluate, POST /enforcement-notices, GET /products/{product_id}/effective-floor"
    algorithm: interval_merge
    formula: |
      eligible = PricingException rows where
            product_id == product.id
        AND status == APPROVED
        AND starts_at <= as_of AND as_of < ends_at            # half-open [starts_at, ends_at)
        AND (channel_scope == 'ALL' OR channel_scope == channel)
        AND (exception_type != 'BUNDLE' OR is_bundle == true)  # BUNDLE exceptions only cover bundle listings
      if eligible is empty:
          effective_map_floor_cents = product.standard_map_floor_cents ; source = 'STANDARD'
      else:
          selected = sort(eligible, key = (
                        (channel_scope == channel) DESC,      # channel-specific beats ALL
                        starts_at DESC,
                        created_at ASC))[0]                    # never id
          effective_map_floor_cents = selected.override_floor_cents ; source = 'EXCEPTION'
    input_set: "as_of, channel and is_bundle come from the caller: the observation at evaluation, the same observation replayed at notice issuance, or the query parameters of the computed read"
    constants:
      INTERVAL_SEMANTICS: "half-open [starts_at, ends_at); a window starting exactly at another's ends_at is adjacent, not overlapping"
    precision: "integer cents"

  - name: violation_points
    trigger: "POST /price-observations/{observation_id}/evaluate (PROVISIONAL_AT_DETECTION) and POST /enforcement-notices (FINAL_AT_NOTICE)"
    algorithm: weighted_scoring
    formula: |
      floor_cents = effective_map_floor(as_of)
      deviation_cents = max(0, floor_cents - observation.effective_advertised_price_cents)
      if deviation_cents == 0: points = 0
      deviation_pct = round_half_up(deviation_cents / floor_cents, 4)
      base_points = 1 if deviation_pct <= 0.0500
                    else 2 if deviation_pct <= 0.1500
                    else 4 if deviation_pct <= 0.3000
                    else 6
      channel_multiplier = CHANNEL_MULTIPLIERS[observation.channel]
      prior_noticed = count(Violation v where v.reseller_id == this.reseller_id
                            AND v.id != this.id
                            AND v.status IN {NOTICED, DISPUTED, CURED, ESCALATED, CLOSED_MOOT}
                            AND v.assessed_points is not null
                            AND v.cure_deadline_at is not null
                            AND v.created_at >= as_of - POINTS_LOOKBACK_DAYS)
      repeat_multiplier = 1.00 + REPEAT_STEP * min(prior_noticed, REPEAT_CAP)
      points = round_half_up(base_points * channel_multiplier * repeat_multiplier, 0)   # single terminal rounding
    input_set: "Only violations of the SAME reseller that have actually been noticed (assessed_points not null) and were created within the 180-day lookback count as repeats; VOIDED and DETECTED violations never count"
    constants:
      CHANNEL_MULTIPLIERS: { MARKETPLACE: 1.5, RETAILER_SITE: 1.0, OWN_WEBSITE: 1.0, PHYSICAL_RETAIL: 0.5 }
      DEVIATION_TIER_BREAKS: [0.0500, 0.1500, 0.3000]
      DEVIATION_TIER_POINTS: [1, 2, 4, 6]
      REPEAT_STEP: 0.25
      REPEAT_CAP: 4
      POINTS_LOOKBACK_DAYS: 180
    precision: "deviation_pct to 4 decimals round_half_up; points to whole points round_half_up applied ONCE at the end (never per factor)"
    variants:
      - name: PROVISIONAL_AT_DETECTION
        when: "computed during evaluate and stored as Violation.provisional_points"
        difference: "as_of = observation.observed_at, so the floor is the one in force when the listing was seen; prior_noticed is counted as of observed_at"
      - name: FINAL_AT_NOTICE
        when: "recomputed during POST /enforcement-notices and stored as Violation.assessed_points"
        difference: "as_of = the logical clock at issuance, so a retroactive PricingException approved between detection and notice changes the floor, the deviation tier and therefore the points; prior_noticed is recounted at issuance and may have grown"

  - name: ladder_rung_selection
    trigger: "POST /enforcement-notices"
    algorithm: threshold
    formula: |
      cumulative_points = reseller.violation_points_total + final_points     # FINAL_AT_NOTICE points
      points_rung = WARNING     if cumulative_points <  policy.suspension_points_threshold
                    SUSPENSION  if policy.suspension_points_threshold <= cumulative_points
                                   < policy.termination_points_threshold
                    TERMINATION if cumulative_points >= policy.termination_points_threshold
      highest_issued = the maximum RUNG_ORDINAL over EnforcementNotice rows for this reseller with
                       status IN {ISSUED, ACKNOWLEDGED, SATISFIED}      # RESCINDED notices are ignored
                       or 0 when none exist
      max_next_rung = RUNG_BY_ORDINAL[min(highest_issued + 1, 3)]
      rung = RUNG_BY_ORDINAL[min(RUNG_ORDINAL[points_rung], RUNG_ORDINAL[max_next_rung])]
      # The ladder advances at most one rung per notice: points may justify TERMINATION, but a reseller
      # that has never been warned can only be warned.
      if request.rung is present and request.rung != rung: reject with ERR_LADDER_RUNG_MISMATCH
    input_set: "policy = the violation's cited PricingPolicy; the reseller ledger is read BEFORE this notice's points are added, then final_points is added once"
    constants:
      RUNG_ORDINAL: { WARNING: 1, SUSPENSION: 2, TERMINATION: 3 }
      RUNG_BY_ORDINAL: { 1: WARNING, 2: SUSPENSION, 3: TERMINATION }
    precision: "integer ordinals; thresholds are inclusive at the lower bound (>=)"

  - name: chargeback_assessment
    trigger: "POST /distributor-chargebacks"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency, pinned: the tier is priced from the PRE-increment score, and only
      # afterwards is the score raised. Evaluating the tier after the increment (the other reading of
      # "the distributor's diversion score") would price the very first chargeback one tier too high.
      score_pre = distributor.diversion_score                       # snapshot BEFORE this event
      tier_rate_cents_per_unit = 2500 if score_pre < 10.0
                                 else 4000 if score_pre < 25.0
                                 else 6000
      amount_cents = tier_rate_cents_per_unit * chargeback.diverted_units
      score_delta_applied = SCORE_PER_UNIT * chargeback.diverted_units
      # then, in this order:
      distributor.chargeback_balance_cents += amount_cents
      distributor.diversion_score = score_pre + score_delta_applied
      distributor.standing = GOOD if diversion_score < 10.0 else PROBATION if diversion_score < 25.0 else SUSPENDED
    input_set: "score_pre is the persisted diversion_score, which equals the sum of score_delta_applied over this distributor's chargebacks in status {ASSESSED, DISPUTED, UPHELD}"
    constants:
      TIER_BREAKS: [10.0, 25.0]
      TIER_RATES_CENTS: [2500, 4000, 6000]
      SCORE_PER_UNIT: 2.5
      STANDING_BREAKS: [10.0, 25.0]
    precision: "amount_cents integer; diversion_score to 1 decimal; tier and standing boundaries are inclusive at the lower bound (>=)"

  - name: distributor_diversion_exposure
    trigger: "GET /distributors/{distributor_id}/diversion-exposure"
    algorithm: aggregation
    formula: |
      tier_rate_cents_per_unit = 2500 if distributor.diversion_score < 10.0
                                 else 4000 if distributor.diversion_score < 25.0
                                 else 6000
      # variant TRACE_ATTRIBUTED
      units_counted = count(SerialUnit s where s.shipped_distributor_id == distributor.id
                            AND s.status == TRACED_UNAUTHORIZED)
      exposure_cents = tier_rate_cents_per_unit * units_counted
      # variant LOT_PRORATED
      units_counted = 0
      for lot in distinct lot_codes of SerialUnit rows where shipped_distributor_id == distributor.id
                  (ordered by lot_code ASC):
          lot_traced_total = count(SerialUnit s where s.lot_code == lot AND s.status == TRACED_UNAUTHORIZED)
          if lot_traced_total == 0: continue
          lot_shipped_total = count(SerialUnit s where s.lot_code == lot)          # any status
          own_shipped = count(SerialUnit s where s.lot_code == lot
                              AND s.shipped_distributor_id == distributor.id)      # any status
          units_counted += round_half_up(lot_traced_total * own_shipped / lot_shipped_total, 2)
      exposure_cents = round_half_up(tier_rate_cents_per_unit * units_counted, 0)
    input_set: "TRACE_ATTRIBUTED counts only units whose shipping record names this distributor; LOT_PRORATED spreads each lot's traced units across every distributor that received units from that lot, in proportion to shipped-unit share. Empty candidate set yields units_counted = 0 and exposure_cents = 0 with no division performed."
    constants:
      TIER_BREAKS: [10.0, 25.0]
      TIER_RATES_CENTS: [2500, 4000, 6000]
    precision: "units_counted to 2 decimals round_half_up per lot; exposure_cents whole cents round_half_up once at the end"
    variants:
      - name: TRACE_ATTRIBUTED
        when: "variant == TRACE_ATTRIBUTED (the default the chargeback workflow bills from)"
        difference: "each traced unit is charged 100% to the distributor named on its shipping record"
      - name: LOT_PRORATED
        when: "variant == LOT_PRORATED (the distributor-facing settlement view used when a lot was split across distributors)"
        difference: "traced units are prorated by shipped-unit share within their lot, so a distributor that received 6 of 10 units in a lot carries only 60% of that lot's traced units"

  - name: reseller_points_ledger
    trigger: "recomputed on every EnforcementNotice issuance, rescission, sustained dispute and retroactive-exception void"
    algorithm: aggregation
    formula: |
      Reseller.violation_points_total = sum(v.assessed_points
          for v in Violation where v.reseller_id == reseller.id
          AND v.assessed_points is not null
          AND v.status IN {NOTICED, DISPUTED, CURED, ESCALATED, CLOSED_MOOT})
      # INVARIANT: after any forward action and its compensating action (issue then rescind, notice then
      # sustained dispute, notice then retroactive-exception void) this sum is unchanged from its value
      # before the forward action. VOIDED violations carry assessed_points = null and drop out of the sum.
    input_set: "Violations of this reseller only; DETECTED (never noticed) and VOIDED (points reversed) violations are excluded by the status filter and the not-null filter"
    constants:
      LEDGER_STATUSES: [NOTICED, DISPUTED, CURED, ESCALATED, CLOSED_MOOT]
    precision: "whole points; the running field and the recomputed sum must be equal at every observable instant"

  - name: distributor_chargeback_ledger
    trigger: "recomputed on POST /distributor-chargebacks and on every chargeback dispute-decision"
    algorithm: aggregation
    formula: |
      Distributor.chargeback_balance_cents = sum(c.amount_cents
          for c in DistributorChargeback where c.distributor_id == distributor.id
          AND c.status IN {ASSESSED, DISPUTED, UPHELD})
      Distributor.diversion_score = sum(c.score_delta_applied for the same filtered set)
      Distributor.standing = GOOD if diversion_score < 10.0 else PROBATION if diversion_score < 25.0 else SUSPENDED
      # INVARIANT: assess then REVERSE leaves both conserved quantities at their pre-assessment values,
      # and standing is re-derived from the restored score (PROBATION can fall back to GOOD).
    input_set: "REVERSED chargebacks are excluded from both sums; a REVERSED row keeps its historical amount_cents and score_delta_applied for audit but contributes nothing"
    constants:
      LEDGER_STATUSES: [ASSESSED, DISPUTED, UPHELD]
      STANDING_BREAKS: [10.0, 25.0]
    precision: "cents integer; score to 1 decimal"

  - name: reseller_review_required
    trigger: "recomputed when a Distributor.standing changes, when a SerialUnit becomes TRACED_UNAUTHORIZED, and when a Reseller is created"
    algorithm: constraint_propagation
    formula: |
      Reseller.review_required =
            (reseller.sourcing_distributor_id is not null
             AND Distributor[reseller.sourcing_distributor_id].standing IN {PROBATION, SUSPENDED})
         OR exists(SerialUnit s where s.downstream_reseller_id == reseller.id
                   AND s.status == TRACED_UNAUTHORIZED)
    input_set: "Only the reseller's declared sourcing distributor is consulted; units shipped by other distributors matter only through the TRACED_UNAUTHORIZED clause"
    constants:
      FLAGGING_STANDINGS: [PROBATION, SUSPENDED]
    precision: "boolean; recomputation must be idempotent (no version bump when the value does not change)"

  - name: product_open_exception_count
    trigger: "recomputed on exception approval, expiry and voiding"
    algorithm: aggregation
    formula: |
      Product.open_exception_count = count(PricingException e where e.product_id == product.id
                                           AND e.status == APPROVED)
    input_set: "APPROVED only; REQUESTED, REJECTED, EXPIRED and VOIDED exceptions are excluded"
    constants: {}
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body schema: required fields present, types correct, enum members valid, numeric ranges honored, evidence_hash is 64 lowercase hex chars, permitted_channels members distinct, bundle_components well-formed when is_bundle is true, suspension window duration <= 90 days, diverted_units >= 1"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Every path-templated resource exists, validated left to right"
    error_id: "ERR_POLICY_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_RESELLER_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_OBSERVATION_NOT_FOUND | ERR_VIOLATION_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_EXCEPTION_NOT_FOUND | ERR_SERIAL_UNIT_NOT_FOUND | ERR_TEST_PURCHASE_NOT_FOUND | ERR_CHARGEBACK_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are listed in §1.5 input"
    error_id: "ERR_POLICY_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_RESELLER_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_OBSERVATION_NOT_FOUND | ERR_VIOLATION_NOT_FOUND | ERR_TEST_PURCHASE_NOT_FOUND | ERR_SERIAL_NOT_REGISTERED"
    http_status: 404
    applies_to: "POST /products, POST /resellers, POST /reseller-agreements, POST /price-observations, POST /enforcement-notices, POST /pricing-exceptions, POST /serial-units, POST /serial-units/{serial_unit_id}/ship-downstream, POST /test-purchases, POST /distributor-chargebacks"

  - priority: 6
    category: auth
    check: "For entity_backed roles the acting X-User-ID must equal the resource's owning foreign key: Reseller acts only on its own agreements, violations and notices; Distributor acts only on its own serial units and chargebacks"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /reseller-agreements/{agreement_id}/respond, POST /violations/{violation_id}/cure-submission, POST /violations/{violation_id}/dispute, POST /enforcement-notices/{notice_id}/acknowledge, POST /serial-units/{serial_unit_id}/ship-downstream, POST /distributor-chargebacks/{chargeback_id}/dispute, and every GET whose row is owned"

  - priority: 7
    category: state
    check: "The target resource is in a state from which this transition is declared in §1.2 (includes the sub-checks: observation.evaluation_status == CAPTURED, violation.status == DETECTED for notice issuance, violation.status == NOTICED for cure and dispute, violation.status == DISPUTED for dispute-decision, notice.status IN {ISSUED, ACKNOWLEDGED}, exception.status == REQUESTED, chargeback.status IN {ASSESSED, UPHELD} for dispute)"
    error_id: "ERR_INVALID_STATE | ERR_ALREADY_EVALUATED | ERR_VIOLATION_NOT_NOTICEABLE | ERR_RESELLER_TERMINATED | ERR_TERMINATION_NOT_RESCINDABLE | ERR_SUPPLY_BLOCKED_BY_AUTHORIZATION"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 8
    category: state
    check: "Optimistic concurrency: expected_reseller_version equals Reseller.version (POST /enforcement-notices); expected_distributor_version equals Distributor.version (POST /distributor-chargebacks)"
    error_id: "ERR_STALE_RESELLER_VERSION | ERR_STALE_DISTRIBUTOR_VERSION"
    http_status: 412
    applies_to: "POST /enforcement-notices, POST /distributor-chargebacks"

  - priority: 9
    category: business_safety
    check: "Antitrust guardrails, checked before every other business rule: an agreement may not carry price_terms_included == true; a countersignature may not carry counter_price_proposal_cents; an enforcement notice may not carry contains_pricing_discussion == true; a pricing exception may not carry dealer_input_source == RESELLER_PRICING_REQUEST"
    error_id: "ERR_ANTITRUST_PRICE_TERM_IN_AGREEMENT | ERR_ANTITRUST_NEGOTIATION_PROHIBITED | ERR_ANTITRUST_DEALER_PRICE_INPUT"
    http_status: 422
    applies_to: "POST /reseller-agreements, POST /reseller-agreements/{agreement_id}/respond, POST /enforcement-notices, POST /pricing-exceptions"

  - priority: 10
    category: business_referential
    check: "Cross-entity referential preconditions: the product's governing policy is PUBLISHED at product creation; the agreement's policy is PUBLISHED at send and activate; the violation's cited policy is PUBLISHED at notice issuance; the notice's reseller_id equals the violation's reseller_id; a CLEARANCE exception's product is in lifecycle_status CLEARANCE; the chargeback's test purchase is CONFIRMED_UNAUTHORIZED and its traced serial unit's shipped_distributor_id equals the chargeback's distributor_id; the non-negotiation acknowledgement is present when the policy requires it; a governing policy exists for the observation instant"
    error_id: "ERR_POLICY_NOT_PUBLISHED | ERR_VIOLATION_RESELLER_MISMATCH | ERR_PRODUCT_NOT_IN_CLEARANCE | ERR_TEST_PURCHASE_NOT_CONFIRMED | ERR_DIVERSION_NOT_ATTRIBUTED | ERR_NON_NEGOTIATION_ACK_MISSING | ERR_NO_GOVERNING_POLICY | ERR_SERIAL_NOT_TRACEABLE | ERR_PRODUCT_NOT_SERIALIZED"
    http_status: "409 | 422"
    applies_to: "POST /products, POST /reseller-agreements/{agreement_id}/send, POST /reseller-agreements/{agreement_id}/activate, POST /price-observations/{observation_id}/evaluate, POST /enforcement-notices, POST /pricing-exceptions/{exception_id}/decision, POST /serial-units, POST /test-purchases/{test_purchase_id}/serial-capture, POST /distributor-chargebacks"

  - priority: 11
    category: business_temporal
    check: "Window and clock rules: observation.observed_at within [now - 30 days, now]; test purchase ordered_at <= now; exception ends_at strictly after starts_at and window <= 180 days; a retroactive exception's starts_at not earlier than now - 30 days; no overlapping REQUESTED/APPROVED exception on the same product with intersecting channel scope using half-open [starts_at, ends_at) semantics; a SUSPENSION window must not intersect an existing non-rescinded suspension window (closed interval) and must start at or after last_suspension_ended_at + suspension_cooling_off_days; cure submission at or before cure_deadline_at"
    error_id: "ERR_OBSERVATION_STALE | ERR_EXCEPTION_WINDOW_OVERLAP | ERR_RETROACTIVE_WINDOW_TOO_OLD | ERR_SUSPENSION_COOLING_OFF | ERR_CURE_WINDOW_EXPIRED"
    http_status: "409 | 422"
    applies_to: "POST /price-observations, POST /test-purchases, POST /pricing-exceptions, POST /enforcement-notices, POST /violations/{violation_id}/cure-submission"

  - priority: 12
    category: business_constraint
    check: "Domain constraints: sku and serial_number uniqueness; permitted_channels must contain the reseller's primary_channel; the observed channel must be inside the reseller's permitted_channels for a matched observation; requested rung must equal the computed rung; dispute_rounds must be below 2; a TERMINATION notice must be issued by BrandLegalCounsel and by a different X-User-ID than the issuer of the governing SUSPENSION notice; FINAL_AT_NOTICE points must be greater than zero; an override floor must sit inside [50% of standard floor, standard floor)"
    error_id: "ERR_DUPLICATE_SKU | ERR_DUPLICATE_SERIAL | ERR_CHANNEL_NOT_PERMITTED | ERR_LADDER_RUNG_MISMATCH | ERR_DISPUTE_ROUNDS_EXHAUSTED | ERR_TERMINATION_REQUIRES_COUNSEL | ERR_SEGREGATION_OF_DUTIES | ERR_NO_BREACH_AT_FINAL_FLOOR | ERR_OVERRIDE_FLOOR_OUT_OF_RANGE"
    http_status: "403 | 409 | 422"
    applies_to: "POST /products, POST /serial-units, POST /reseller-agreements, POST /price-observations, POST /enforcement-notices, POST /violations/{violation_id}/dispute, POST /distributor-chargebacks/{chargeback_id}/dispute, POST /pricing-exceptions/{exception_id}/decision"

  - priority: 13
    category: business_fiscal
    check: "Fiscal ceiling, checked last: Distributor.chargeback_balance_cents + the new chargeback's amount_cents must not exceed annual_chargeback_cap_cents (equality is allowed)"
    error_id: ERR_CHARGEBACK_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /distributor-chargebacks"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- PricingPolicy ---------------------------------------------------------
  - method: POST
    path: /pricing-policies
    purpose: "Draft a unilateral minimum advertised price policy revision"
    input: [policy_code, "shipping_counts_as_advertised?", "auto_coupon_counts_as_advertised?", "promo_code_counts_as_advertised?", "max_discount_attribution_pct?", "non_negotiation_ack_required?", "cure_window_days?", "suspension_points_threshold?", "termination_points_threshold?", "suspension_cooling_off_days?"]
    output: PricingPolicy
    status: 201
    roles: [BrandChannelManager]
    side_effects:
      - "creates PricingPolicy in status DRAFT with revision_number = 1 + count of existing policies sharing policy_code"

  - method: POST
    path: /pricing-policies/{policy_id}/submit-review
    purpose: "Send a drafted policy to legal counsel for antitrust review"
    input: []
    output: PricingPolicy
    status: 200
    roles: [BrandChannelManager]
    side_effects:
      - "sets status = IN_LEGAL_REVIEW"

  - method: POST
    path: /pricing-policies/{policy_id}/review-decision
    purpose: "Counsel approves the policy or returns it to drafting"
    input: [decision, "legal_review_notes?"]
    output: PricingPolicy
    status: 200
    roles: [BrandLegalCounsel]
    side_effects:
      - "decision APPROVE sets status = APPROVED and reviewed_by_user_id = X-User-ID"
      - "decision RETURN sets status = DRAFT and reviewed_by_user_id = X-User-ID"

  - method: POST
    path: /pricing-policies/{policy_id}/publish
    purpose: "Publish an approved policy, superseding the prior published revision"
    input: [effective_from]
    output: PricingPolicy
    status: 200
    roles: [BrandLegalCounsel]
    side_effects:
      - "sets status = PUBLISHED, effective_from and published_by_user_id = X-User-ID"
      - "sets the prior PUBLISHED policy sharing policy_code to SUPERSEDED and its superseded_by_policy_id to this policy id"

  - method: POST
    path: /pricing-policies/{policy_id}/withdraw
    purpose: "Withdraw a published policy from the effective set"
    input: [withdrawn_reason]
    output: PricingPolicy
    status: 200
    roles: [BrandLegalCounsel]
    side_effects:
      - "sets status = WITHDRAWN and withdrawn_reason"

  - method: GET
    path: /pricing-policies/{policy_id}
    purpose: "Read one policy revision"
    input: []
    output: PricingPolicy
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller, Distributor]
    side_effects: []

  - method: GET
    path: /pricing-policies
    purpose: "List policy revisions, optionally by status or by the revision that superseded them"
    input: ["status?", "policy_code?", "superseded_by_policy_id?", "limit?", "offset?"]
    output: PricingPolicy[]
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller, Distributor]
    side_effects: []

  # --- Product ---------------------------------------------------------------
  - method: POST
    path: /products
    purpose: "Register a branded product with its standard advertised price floor"
    input: [sku, name, msrp_cents, standard_map_floor_cents, governing_policy_id, "lifecycle_status?", "clearance_discount_pct?", "serialization_enabled?"]
    output: Product
    status: 201
    roles: [BrandChannelManager]
    side_effects:
      - "creates Product with open_exception_count = 0"

  - method: PATCH
    path: /products/{product_id}
    purpose: "Adjust product lifecycle, clearance depth or standard floor"
    input: ["lifecycle_status?", "clearance_discount_pct?", "standard_map_floor_cents?"]
    output: Product
    status: 200
    roles: [BrandChannelManager]
    side_effects:
      - "lifecycle_status DISCONTINUED voids every REQUESTED and APPROVED PricingException on the product and recomputes open_exception_count"
      - "increments Product.version by 1"

  - method: GET
    path: /products/{product_id}
    purpose: "Read one product"
    input: []
    output: Product
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller, Distributor]
    side_effects: []

  - method: GET
    path: /products
    purpose: "List products, optionally by governing policy, lifecycle or sku"
    input: ["governing_policy_id?", "lifecycle_status?", "sku?", "limit?", "offset?"]
    output: Product[]
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller, Distributor]
    side_effects: []

  - method: GET
    path: /products/{product_id}/effective-floor
    purpose: "Computed read of the effective advertised price floor for a channel at an instant"
    input: [channel, "as_of?", "is_bundle?"]
    output: "{ product_id: string, channel: string, as_of: string, effective_map_floor_cents: integer, floor_source: string, applied_exception_id: string, standard_map_floor_cents: integer }"
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller, Distributor]
    side_effects: []

  # --- Distributor -----------------------------------------------------------
  - method: POST
    path: /distributors
    purpose: "Register an authorized distributor with an annual chargeback ceiling"
    input: [legal_name, annual_chargeback_cap_cents]
    output: Distributor
    status: 201
    roles: [BrandChannelManager]
    side_effects:
      - "creates Distributor in standing GOOD with diversion_score 0.00, chargeback_balance_cents 0 and shipped_units_total 0"

  - method: GET
    path: /distributors/{distributor_id}
    purpose: "Read one distributor"
    input: []
    output: Distributor
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Distributor]
    side_effects: []

  - method: GET
    path: /distributors
    purpose: "List distributors, optionally by standing"
    input: ["standing?", "limit?", "offset?"]
    output: Distributor[]
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Distributor]
    side_effects: []

  - method: GET
    path: /distributors/{distributor_id}/diversion-exposure
    purpose: "Computed read of downstream diversion exposure under a chosen attribution variant"
    input: [variant]
    output: "{ distributor_id: string, variant: string, traced_unit_count: integer, units_counted: number, exposure_cents: integer, tier_rate_cents_per_unit: integer, diversion_score: number }"
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Distributor]
    side_effects: []

  # --- Reseller --------------------------------------------------------------
  - method: POST
    path: /resellers
    purpose: "Record a reseller application and its sourcing distributor"
    input: [legal_name, contact_email, primary_channel, "sourcing_distributor_id?"]
    output: Reseller
    status: 201
    roles: [BrandChannelManager]
    side_effects:
      - "creates Reseller with authorization_status APPLIED, supply_status HOLD, hold_reason PENDING_AUTHORIZATION, violation_points_total 0 and review_required false"

  - method: POST
    path: /resellers/{reseller_id}/supply-status
    purpose: "Move the independent supply axis for quality-obligation reasons"
    input: [supply_status, "hold_reason?", "note?"]
    output: Reseller
    status: 200
    roles: [BrandChannelManager]
    side_effects:
      - "sets supply_status and hold_reason without touching authorization_status"
      - "increments Reseller.version by 1"

  - method: GET
    path: /resellers/{reseller_id}
    purpose: "Read one reseller"
    input: []
    output: Reseller
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller, Distributor]
    side_effects: []

  - method: GET
    path: /resellers
    purpose: "List resellers, optionally by sourcing distributor, authorization, supply state or review flag"
    input: ["sourcing_distributor_id?", "authorization_status?", "supply_status?", "review_required?", "limit?", "offset?"]
    output: Reseller[]
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller, Distributor]
    side_effects: []

  - method: GET
    path: /resellers/{reseller_id}/compliance-summary
    purpose: "Computed read reconciling the reseller point ledger against its contributing violations"
    input: ["as_of?"]
    output: "{ reseller_id: string, violation_points_total: integer, contributing_violation_count: integer, summed_assessed_points: integer, highest_issued_rung: string, next_rung: string, points_to_suspension: integer, points_to_termination: integer }"
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller]
    side_effects: []

  # --- ResellerAgreement -----------------------------------------------------
  - method: POST
    path: /reseller-agreements
    purpose: "Draft an authorized reseller agreement with channel restrictions and quality obligations"
    input: [reseller_id, policy_id, permitted_channels, quality_obligations, term_ends_at, "price_terms_included?"]
    output: ResellerAgreement
    status: 201
    roles: [BrandChannelManager]
    side_effects:
      - "creates ResellerAgreement in status DRAFT with non_negotiated flags unset"

  - method: POST
    path: /reseller-agreements/{agreement_id}/send
    purpose: "Send the agreement to the reseller for countersignature"
    input: []
    output: ResellerAgreement
    status: 200
    roles: [BrandChannelManager]
    side_effects:
      - "sets status = SENT and sent_at = current clock"
      - "sets Reseller.authorization_status = PENDING_AGREEMENT"

  - method: POST
    path: /reseller-agreements/{agreement_id}/respond
    purpose: "Reseller countersigns on a take-it-or-leave-it basis, or declines"
    input: [decision, "non_negotiation_acknowledged?", "decline_reason?", "counter_price_proposal_cents?"]
    output: ResellerAgreement
    status: 200
    roles: [Reseller]
    side_effects:
      - "decision COUNTERSIGN sets status = COUNTERSIGNED, countersigned_at, countersigned_by_user_id and non_negotiation_acknowledged = true"
      - "decision DECLINE sets status = DECLINED, closed_reason and returns Reseller.authorization_status to APPLIED"

  - method: POST
    path: /reseller-agreements/{agreement_id}/activate
    purpose: "Activate a countersigned agreement and open supply"
    input: []
    output: ResellerAgreement
    status: 200
    roles: [BrandChannelManager]
    side_effects:
      - "sets status = ACTIVE and activated_at = current clock"
      - "sets Reseller.authorization_status = AUTHORIZED, supply_status = OPEN and hold_reason = NONE"

  - method: GET
    path: /reseller-agreements/{agreement_id}
    purpose: "Read one agreement"
    input: []
    output: ResellerAgreement
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller]
    side_effects: []

  - method: GET
    path: /reseller-agreements
    purpose: "List agreements, optionally by reseller, cited policy or status"
    input: ["reseller_id?", "policy_id?", "status?", "limit?", "offset?"]
    output: ResellerAgreement[]
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller]
    side_effects: []

  # --- PriceObservation ------------------------------------------------------
  - method: POST
    path: /price-observations
    purpose: "Capture a monitored listing with its advertised price evidence"
    input: [product_id, channel, seller_display_name, listing_url, listed_price_cents, observed_at, evidence_hash, "marketplace_name?", "shipping_cents?", "auto_coupon_cents?", "promo_code_cents?", "is_bundle?", "bundle_total_price_cents?", "bundle_components?", "matched_reseller_id?"]
    output: PriceObservation
    status: 201
    roles: [MonitoringAnalyst]
    side_effects:
      - "creates PriceObservation in evaluation_status CAPTURED with evidence_captured_by_user_id = X-User-ID"
      - "computes allocated_component_price_cents when is_bundle is true"

  - method: POST
    path: /price-observations/{observation_id}/evaluate
    purpose: "Evaluate the captured listing against the effective floor and open a violation on breach"
    input: []
    output: "{ observation_id: string, evaluation_status: string, allocated_component_price_cents: integer, effective_advertised_price_cents: integer, effective_map_floor_cents: integer, floor_source: string, deviation_cents: integer, deviation_pct: number, cited_policy_id: string, violation_id: string, provisional_points: integer, unauthorized_seller_confirmed: boolean }"
    status: 200
    roles: [MonitoringAnalyst]
    side_effects:
      - "sets evaluation_status to EVALUATED_COMPLIANT or EVALUATED_BREACH and stores effective_advertised_price_cents, effective_map_floor_cents, deviation_cents and deviation_pct"
      - "on breach with a matched reseller creates a Violation in status DETECTED carrying provisional_floor_cents and provisional_points"
      - "on breach without a matched reseller sets unauthorized_seller_confirmed = false and creates no Violation"

  - method: GET
    path: /price-observations/{observation_id}
    purpose: "Read one observation with its captured evidence"
    input: []
    output: PriceObservation
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller]
    side_effects: []

  - method: GET
    path: /price-observations
    purpose: "List observations, optionally by product, matched reseller, channel or evaluation state"
    input: ["product_id?", "matched_reseller_id?", "evaluation_status?", "channel?", "limit?", "offset?"]
    output: PriceObservation[]
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller]
    side_effects: []

  # --- Violation -------------------------------------------------------------
  - method: POST
    path: /violations/{violation_id}/cure-submission
    purpose: "Reseller submits corrected pricing evidence inside the cure window"
    input: [cure_evidence_url, corrected_price_cents, evidence_hash]
    output: Violation
    status: 200
    roles: [Reseller]
    side_effects:
      - "sets status = CURED and resolution_reason"
      - "removes the violation's assessed_points from Reseller.violation_points_total"

  - method: POST
    path: /violations/{violation_id}/dispute
    purpose: "Reseller disputes a noticed violation"
    input: [dispute_reason]
    output: Violation
    status: 200
    roles: [Reseller]
    side_effects:
      - "sets status = DISPUTED, increments dispute_rounds by 1 and extends cure_deadline_at by 5 days"

  - method: POST
    path: /violations/{violation_id}/dispute-decision
    purpose: "Brand resolves a disputed violation"
    input: [decision, decision_reason]
    output: Violation
    status: 200
    roles: [BrandChannelManager]
    side_effects:
      - "decision UPHOLD returns status to NOTICED and leaves assessed_points in the reseller ledger"
      - "decision REVERSE sets status = VOIDED, clears assessed_points and removes them from Reseller.violation_points_total"

  - method: GET
    path: /violations/{violation_id}
    purpose: "Read one violation"
    input: []
    output: Violation
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller]
    side_effects: []

  - method: GET
    path: /violations
    purpose: "List violations, optionally by observation, reseller, cited policy or status"
    input: ["observation_id?", "reseller_id?", "cited_policy_id?", "status?", "limit?", "offset?"]
    output: Violation[]
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller]
    side_effects: []

  # --- EnforcementNotice -----------------------------------------------------
  - method: POST
    path: /enforcement-notices
    purpose: "Issue the next rung of the enforcement ladder against a detected violation"
    input: [reseller_id, violation_id, delivery_channel, expected_reseller_version, "rung?", "suspension_starts_at?", "suspension_ends_at?", "contains_pricing_discussion?"]
    output: EnforcementNotice
    status: 201
    roles: [BrandChannelManager, BrandLegalCounsel]
    side_effects:
      - "assesses FINAL_AT_NOTICE points onto the violation, sets its status = NOTICED and cure_deadline_at = current clock + policy cure_window_days"
      - "adds the assessed points to Reseller.violation_points_total and increments Reseller.version by 1"
      - "computes rung, sets cumulative_points_at_issue and issued_by_user_id, and creates the notice in status ISSUED"
      - "rung SUSPENSION sets Reseller.authorization_status = SUSPENDED, supply_status = HOLD, hold_reason = SUSPENSION and suspension_ends_at"
      - "rung TERMINATION sets Reseller.authorization_status = TERMINATED, supply_status = CUT_OFF, hold_reason = TERMINATION and terminated_at, terminates the ACTIVE agreement, recalls that reseller's SHIPPED_TO_RESELLER serial units and closes its open violations as CLOSED_MOOT"

  - method: POST
    path: /enforcement-notices/{notice_id}/acknowledge
    purpose: "Reseller acknowledges receipt of a notice"
    input: []
    output: EnforcementNotice
    status: 200
    roles: [Reseller]
    side_effects:
      - "sets status = ACKNOWLEDGED and acknowledged_at = current clock"

  - method: POST
    path: /enforcement-notices/{notice_id}/rescind
    purpose: "Counsel rescinds a warning or suspension notice and reverses its consequences"
    input: [rescinded_reason]
    output: EnforcementNotice
    status: 200
    roles: [BrandLegalCounsel]
    side_effects:
      - "sets status = RESCINDED and closed_reason"
      - "sets the cited violation to VOIDED, clears its assessed_points and subtracts them from Reseller.violation_points_total"
      - "a rescinded SUSPENSION returns Reseller.authorization_status = AUTHORIZED, supply_status = OPEN, hold_reason = NONE, clears suspension_ends_at and sets last_suspension_ended_at to the current clock"
      - "increments Reseller.version by 1"

  - method: GET
    path: /enforcement-notices/{notice_id}
    purpose: "Read one enforcement notice"
    input: []
    output: EnforcementNotice
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller]
    side_effects: []

  - method: GET
    path: /enforcement-notices
    purpose: "List notices, optionally by reseller, cited violation, rung or status"
    input: ["reseller_id?", "violation_id?", "rung?", "status?", "limit?", "offset?"]
    output: EnforcementNotice[]
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller]
    side_effects: []

  # --- PricingException ------------------------------------------------------
  - method: POST
    path: /pricing-exceptions
    purpose: "Request a clearance, bundle or promotional-event exception to the standard floor"
    input: [product_id, exception_type, starts_at, ends_at, "channel_scope?", "requested_override_floor_cents?", "dealer_input_source?"]
    output: PricingException
    status: 201
    roles: [BrandChannelManager]
    side_effects:
      - "creates PricingException in status REQUESTED and marks retroactive when starts_at precedes the current clock"

  - method: POST
    path: /pricing-exceptions/{exception_id}/decision
    purpose: "Counsel approves or rejects a requested exception"
    input: [decision, decision_reason]
    output: PricingException
    status: 200
    roles: [BrandLegalCounsel]
    side_effects:
      - "decision APPROVE sets status = APPROVED, computes override_floor_cents and increments Product.open_exception_count"
      - "an approved retroactive exception voids the DETECTED and NOTICED violations whose observations fall inside the window and are compliant at the override floor, and records voided_violation_count"
      - "decision REJECT sets status = REJECTED and decision_reason"

  - method: GET
    path: /pricing-exceptions/{exception_id}
    purpose: "Read one pricing exception"
    input: []
    output: PricingException
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Reseller]
    side_effects: []

  - method: GET
    path: /pricing-exceptions
