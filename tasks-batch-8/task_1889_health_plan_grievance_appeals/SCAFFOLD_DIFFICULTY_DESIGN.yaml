scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: effectuation_timeliness_calendar_vs_business_hours
        grounds:
          - calculations.effectuation_timeliness_calculation
          - entities.Effectuation.fields.timeliness_percent
        distinguishing_aspect: |
          Same decided_at/completed_at pair produces different timeliness_percent
          under the default calendar-hours variant vs the business_hours_variant
          on the Effectuation entity — a calculation dual-variant in the
          effectuation domain (distinct from the CTM member-domain instance below).
        test_recipe:
          setup:
            - "Member M (MEDICARE), Provider P with w9_on_file=true, policies for (MEDICARE, APPEAL, STANDARD) resolution 168h / effectuation 72h"
            - "Case C: APPEAL, STANDARD, triaged at T0=2026-08-01T00:00:00Z, decided FULLY_FAVORABLE at T0+24h with payment 50000"
            - "Effectuation created at decide time; case.effectuation_due_at = decided_at + 72h"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-DV1", full_name: "Dora Vance", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_dv1: $.data.id }
            - call: "POST /appeals/providers"
              payload: { npi: "1234567893", legal_name: "Vance Clinic", contract_status: "CONTRACTED", w9_on_file: true }
              as: PlatformAdmin
              captures: { p_dv1: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "APPEAL", priority_track: "STANDARD", resolution_hours: 168, extension_hours: 24, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_dv1}", provider_id: "${p_dv1}", case_kind: "APPEAL" }
              as: IntakeSpecialist
              captures: { c_dv1: $.data.id }
            - call: "POST /appeals/cases/${c_dv1}/triage"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "intake-dv1"
            - call: "POST /appeals/cases/${c_dv1}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_dv1}/clinical-reviews"
              payload: {}
              as: CaseAnalyst
              captures: { cr_dv1: $.data.id }
            - call: "POST /appeals/clinical-reviews/${cr_dv1}/assign"
              payload: { reviewer_physician_id: "md-001" }
              as: MedicalDirector
              as_user_id: "md-admin"
            - call: "POST /appeals/clinical-reviews/${cr_dv1}/draft-determination"
              payload: { severity: 8, acuity: 6, guideline_match: 9, comorbidity: 4, functional_impairment: 5 }
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "POST /appeals/clinical-reviews/${cr_dv1}/finalize-determination"
              payload: { determination: "OVERTURN_SERVICE" }
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases/${c_dv1}/decide"
              payload: { decision_outcome: "FULLY_FAVORABLE", payment_amount_cents: 50000 }
              as: MedicalDirector
              as_user_id: "md-002"
          trigger:
            - call: "GET /appeals/cases/${c_dv1}/effectuations"
              payload: {}
              as: ClaimsProcessor
              captures: { e_dv1: "$.data[0].id" }
            - call: "POST /appeals/effectuations/${e_dv1}/start"
              payload: {}
              as: ClaimsProcessor
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: PlatformAdmin
            - call: "GET /appeals/effectuations/${e_dv1}"
              payload: {}
              as: ClaimsProcessor
              captures: { e_dv1_ver: $.data.version }
            - call: "POST /appeals/effectuations/${e_dv1}/complete"
              payload: { expected_effectuation_version: "${e_dv1_ver}" }
              as: ClaimsProcessor
          assert:
            - "Effectuation.${e_dv1}.timeliness_percent == 83.33 (consumed 60h of 72h calendar-hours variant: decided 2026-08-02T00:00, completed 2026-08-03T12:00)"
            - "Under business_hours_variant the same wall-clock interval would count only Mon-Fri 08:00-17:00 UTC hours and yield a strictly smaller percent; the stored value proves the calendar variant was applied for a MEDICARE case"

      - name: ctm_provisional_vs_final_weight_tier_flip
        grounds:
          - calculations.ctm_linkage_weighting
          - entities.Member.fields.ctm_linked_case_count
        distinguishing_aspect: |
          Identical CTM link data yields a different exposure tier when cases are
          pre-triage (provisional half-weight) vs post-triage (full weight) — a
          dual-variant on the Member entity domain, distinct from the Effectuation
          domain instance above.
        test_recipe:
          setup:
            - "Member M; two CTM-linked cases still in RECEIVED (pre-triage, provisional weight 0.5 each = 1.0 total, ceil(1.0) = 1 -> LOW)"
            - "After triaging both, full weight 2.0 (count 2 -> LOW); the provisional_weight field exposes the variant switch"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-DV2", full_name: "Carl Myles", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_dv2: $.data.id }
            - call: "POST /appeals/providers"
              payload: { npi: "1093817465", legal_name: "Myles Clinic", contract_status: "CONTRACTED", w9_on_file: true }
              as: PlatformAdmin
              captures: { p_dv2: $.data.id }
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_dv2}", provider_id: "${p_dv2}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_dv2a: $.data.id }
            - call: "POST /appeals/cases/${c_dv2a}/events"
              payload: { event_type: "CTM_LINKED", body: "ctm-1" }
              as: IntakeSpecialist
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_dv2}", provider_id: "${p_dv2}", case_kind: "APPEAL" }
              as: IntakeSpecialist
              captures: { c_dv2b: $.data.id }
            - call: "POST /appeals/cases/${c_dv2b}/events"
              payload: { event_type: "CTM_LINKED", body: "ctm-2" }
              as: IntakeSpecialist
          trigger:
            - call: "GET /appeals/members/${m_dv2}/ctm-exposure"
              payload: {}
              as: ComplianceOfficer
              captures: { tier_pre: $.data.tier }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "APPEAL", priority_track: "STANDARD", resolution_hours: 168, extension_hours: 24, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/cases/${c_dv2a}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_dv2b}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "GET /appeals/members/${m_dv2}/ctm-exposure"
              payload: {}
              as: ComplianceOfficer
              captures: { tier_post: $.data.tier, prov_post: $.data.provisional_weight }
          assert:
            - "Pre-triage: provisional_weight == 1.0 (two links x 0.5) and tier == LOW (ceil(1.0) == 1, 1..2 band)"
            - "Post-triage: provisional_weight == 2.0 (full weight) and tier == LOW (count 2 in 1..2 band) — the variant switch from half to full weight is observable in provisional_weight even though tier stays LOW at this count"
            - "Member.${m_dv2}.ctm_linked_case_count == 2"

      - name: audit_universe_raw_vs_compliance_attribution_rate
        grounds:
          - calculations.audit_universe_aggregation
          - calculations.case_deadline_calculation
        distinguishing_aspect: |
          The same snapshot rows produce a different resolution timeliness rate
          under the raw snapshot variant vs the compliance_attribution variant
          (which reclassifies acknowledgement-late cases as INTAKE_DELAY) — a
          dual-variant on the AuditUniverseRecord entity domain.
        test_recipe:
          setup:
            - "One MEDICARE GRIEVANCE STANDARD case decided in period 2026-08"
            - "Case A: received 2026-08-01T00:00, triaged at +2h (within the 24h ack window), decided at 2026-08-08T01:00 = +169h against a 168h policy -> late, reviewer-attributable in the compliance variant"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-DV3", full_name: "Ari Gold", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_dv3: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 168, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_dv3}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_dv3a: $.data.id }
            - call: "POST /appeals/cases/${c_dv3a}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_dv3a}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases/${c_dv3a}/decide"
              payload: { decision_outcome: "UNFAVORABLE" }
              as: CaseAnalyst
          trigger:
            - call: "POST /appeals/audit-universe/snapshot"
              payload: { report_period: "2026-08" }
              as: ComplianceOfficer
            - call: "GET /appeals/audit-universe/compliance-summary"
              payload: { report_period: "2026-08" }
              as: ComplianceOfficer
              captures: { raw_total: $.data.total_cases, timely: $.data.resolution_timely_count, intake_delay: $.data.intake_delay_count, reviewer_late: $.data.reviewer_late_count }
          assert:
            - "total_cases == 1 (only the decided case falls in the 2026-08 half-open window)"
            - "resolution_timely_count == 0 (decided at +169h > 168h policy, so raw variant marks it late)"
            - "intake_delay_count == 0 and reviewer_late_count == 1 (acknowledgement at +2h was within 24h, so the compliance_attribution variant keeps the lateness on the reviewer; the two variants diverge only when acknowledged_at - received_at > 24h)"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: notification_completeness_per_element_round_then_sum
        grounds:
          - calculations.notification_completeness_scoring
          - entities.Notification.fields.completeness_score
        distinguishing_aspect: |
          Mode (b) nested rounding: per-element contributions rounded to 4
          decimals THEN summed THEN rounded to 2 — pinned order. Supplying all
          elements except appeal_rights yields exactly 0.75 under the pinned
          order; a sum-then-round implementation over raw weights coincides here
          but the DECISION/MEMBER matrix for an UNFAVORABLE APPEAL (6 of 7
          elements; missing ire_notice is required for UNFAVORABLE) exercises
          the per-element rounding path explicitly.
        test_recipe:
          setup:
            - "Member, provider, and (MEDICARE, APPEAL, STANDARD) policy exist"
            - "Case decided UNFAVORABLE at 2026-08-02T00:00 (no effectuation)"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-CF1", full_name: "Nina Fox", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_cf1: $.data.id }
            - call: "POST /appeals/providers"
              payload: { npi: "1029384756", legal_name: "Fox Medical", contract_status: "CONTRACTED", w9_on_file: true }
              as: PlatformAdmin
              captures: { p_cf1: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "APPEAL", priority_track: "STANDARD", resolution_hours: 168, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_cf1}", provider_id: "${p_cf1}", case_kind: "APPEAL" }
              as: IntakeSpecialist
              captures: { c_cf1: $.data.id }
            - call: "POST /appeals/cases/${c_cf1}/triage"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "intake-cf1"
            - call: "POST /appeals/cases/${c_cf1}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_cf1}/clinical-reviews"
              payload: {}
              as: CaseAnalyst
              captures: { cr_cf1: $.data.id }
            - call: "POST /appeals/clinical-reviews/${cr_cf1}/assign"
              payload: { reviewer_physician_id: "md-101" }
              as: MedicalDirector
              as_user_id: "md-admin"
            - call: "POST /appeals/clinical-reviews/${cr_cf1}/draft-determination"
              payload: { severity: 5, acuity: 5, guideline_match: 5, comorbidity: 5, functional_impairment: 5 }
              as: MedicalDirector
              as_user_id: "md-101"
            - call: "POST /appeals/clinical-reviews/${cr_cf1}/finalize-determination"
              payload: { determination: "UPHOLD_SERVICE" }
              as: MedicalDirector
              as_user_id: "md-101"
            - call: "POST /appeals/cases/${c_cf1}/decide"
              payload: { decision_outcome: "UNFAVORABLE" }
              as: MedicalDirector
              as_user_id: "md-102"
          trigger:
            - call: "POST /appeals/cases/${c_cf1}/notifications"
              payload: { recipient_kind: "MEMBER", notification_kind: "DECISION", supplied_elements: ["citation_of_criteria", "decision_rationale", "expedited_availability", "ire_notice", "contact_information", "language_assistance"] }
              as: MemberServicesRep
              captures: { n_cf1: $.data.id, score: $.data.completeness_score }
          assert:
            - "Notification.${n_cf1}.completeness_score == 0.75 (all required elements except appeal_rights=0.25 under the pinned per-element-round-then-sum order)"
            - "POST mark-sent on ${n_cf1} would be rejected ERR_NOTIFICATION_INCOMPLETE at this score"

      - name: case_deadline_multivariate_threshold_selection
        grounds:
          - calculations.case_deadline_calculation
          - entities.GrievanceAppealCase.fields.resolution_due_at
        distinguishing_aspect: |
          Mode (a) formula with >=3 inputs and non-linear interaction: the
          deadline depends on (program x case_kind x priority_track) policy
          selection, the extension_applied boolean branch, and the expedite
          in-place re-anchor — nested conditional branches on entity state
          rather than a single linear formula.
        test_recipe:
          setup:
            - "MEDICARE APPEAL policies: STANDARD 168h ext 24h; EXPEDITED 72h ext 0h"
            - "Case received 2026-08-01T00:00, expedited_requested=false -> STANDARD at triage; then expedited in-place; then extension attempt on EXPEDITED policy (extension_hours 0) must fail ERR_EXTENSION_CONSUMED"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-CF2", full_name: "Omar Ray", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_cf2: $.data.id }
            - call: "POST /appeals/providers"
              payload: { npi: "5647382910", legal_name: "Ray Health", contract_status: "CONTRACTED", w9_on_file: true }
              as: PlatformAdmin
              captures: { p_cf2: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "APPEAL", priority_track: "STANDARD", resolution_hours: 168, extension_hours: 24, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "APPEAL", priority_track: "EXPEDITED", resolution_hours: 72, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_cf2}", provider_id: "${p_cf2}", case_kind: "APPEAL" }
              as: IntakeSpecialist
              captures: { c_cf2: $.data.id }
            - call: "POST /appeals/cases/${c_cf2}/triage"
              payload: {}
              as: IntakeSpecialist
              captures: { due_std: $.data.resolution_due_at }
          trigger:
            - call: "POST /appeals/cases/${c_cf2}/expedite"
              payload: {}
              as: MedicalDirector
              captures: { due_exp: $.data.resolution_due_at, ver: $.data.version }
            - call: "POST /appeals/cases/${c_cf2}/extensions"
              payload: { expected_case_version: "${ver}" }
              as: MemberServicesRep
              captures: { err: $.data.error_id }
          assert:
            - "Standard deadline after triage == 2026-08-08T00:00:00Z (received + 168h)"
            - "After expedite: priority_track == EXPEDITED and resolution_due_at == 2026-08-04T00:00:00Z (received + 72h — anchor stays at received_at, NOT the upgrade time)"
            - "Extension attempt on the EXPEDITED track fails with ERR_EXTENSION_CONSUMED (policy extension_hours == 0)"

      - name: ctm_tier_threshold_circular_count_dependency
        grounds:
          - calculations.ctm_linkage_weighting
          - entities.Member.fields.ctm_linked_case_count
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the
          exposure tier depends on ctm_linked_case_count, which itself changes
          when cases close — closing a CTM-linked case decrements the count that
          defines the tier; the scaffold pins that the count is recomputed from
          the case set FIRST and the tier read SECOND, never interleaved.
        test_recipe:
          setup:
            - "Member with three CTM-linked GRIEVANCE cases, all triaged (full weight 3 -> MEDIUM)"
            - "Close path for grievances: decide from IN_REVIEW, then DECISION notification complete + sent, then close"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-CF3", full_name: "Pam Wexler", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_cf3: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_cf3}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_cf3a: $.data.id }
            - call: "POST /appeals/cases/${c_cf3a}/events"
              payload: { event_type: "CTM_LINKED", body: "ctm-a" }
              as: IntakeSpecialist
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_cf3}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_cf3b: $.data.id }
            - call: "POST /appeals/cases/${c_cf3b}/events"
              payload: { event_type: "CTM_LINKED", body: "ctm-b" }
              as: IntakeSpecialist
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_cf3}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_cf3c: $.data.id }
            - call: "POST /appeals/cases/${c_cf3c}/events"
              payload: { event_type: "CTM_LINKED", body: "ctm-c" }
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_cf3a}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_cf3a}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_cf3a}/decide"
              payload: { decision_outcome: "FULLY_FAVORABLE" }
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_cf3a}/notifications"
              payload: { recipient_kind: "MEMBER", notification_kind: "DECISION", supplied_elements: ["citation_of_criteria", "appeal_rights", "decision_rationale", "expedited_availability", "ire_notice", "contact_information", "language_assistance"] }
              as: MemberServicesRep
              captures: { n_cf3: $.data.id }
            - call: "POST /appeals/notifications/${n_cf3}/mark-sent"
              payload: {}
              as: MemberServicesRep
            - call: "GET /appeals/cases/${c_cf3a}/effectuations"
              payload: {}
              as: ComplianceOfficer
              captures: { e_cf3: "$.data[0].id" }
            - call: "POST /appeals/effectuations/${e_cf3}/waive"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /appeals/members/${m_cf3}/ctm-exposure"
              payload: {}
              as: ComplianceOfficer
              captures: { tier_before: $.data.tier }
          trigger:
            - call: "POST /appeals/cases/${c_cf3a}/close"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /appeals/members/${m_cf3}/ctm-exposure"
              payload: {}
              as: ComplianceOfficer
              captures: { tier_after: $.data.tier }
          assert:
            - "Before close: tier == MEDIUM (count 3 in 3..5 band, weight 2)"
            - "After close: Member.ctm_linked_case_count == 2 and tier == LOW (count 2 in 1..2 band) — the count recomputed before tier evaluation, so the tier reflects the post-close set, not the pre-close set"

  # ==========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_cyclic_reopen_closed_to_reopened_to_closed
        grounds:
          - state_machines.GrievanceAppealCase.CLOSED_to_REOPENED
          - state_machines.Reopening.UNDER_REVIEW_to_GRANTED
        distinguishing_aspect: |
          GrievanceAppealCase has a true cycle CLOSED -> REOPENED -> CLOSED
          driven by the Reopening aggregate — a cyclic shape on the Case entity,
          distinct from the Notification self-loop machine below.
        test_recipe:
          setup:
            - "Fully processed MEDICARE GRIEVANCE case: decided UNFAVORABLE (no effectuation), notified, closed at 2026-08-05"
            - "Reopening requested with NEW_EVIDENCE within 180 days"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-NL1", full_name: "Quinn Hale", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_nl1: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_nl1}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_nl1: $.data.id }
            - call: "POST /appeals/cases/${c_nl1}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_nl1}/begin-review"
              payload: {}
              as: CaseAnalyst
