          Metric = aggregate countered cents ratio; endpoint = counter-bills create. The cap is
          floor(0.60 x 6000) == 3600 and the comparison is inclusive: a counter that lands the
          aggregate exactly at 3600 is ACCEPTED; a subsequent 1c counter (3601 > 3600) is
          rejected with ERR_COUNTER_BILL_EXCEEDS_CEILING. Distinct metric (cents, not hours)
          and distinct endpoint from the dwell boundary.
