              payload: { decision: "APPROVE", decision_reason: "Committee signoff" }
            - call: "POST /exception-requests/${er_id}/decision"
              as: CreditCommittee
              as_user_id: "cc-2"
              payload: { decision: "APPROVE", decision_reason: "Second committee member" }
              captures: { err_cc_second: "$.data.error_id" }
            - call: "POST /exception-requests/${er_id}/decision"
              as: ChiefCreditOfficer
              as_user_id: "cc-1"
              payload: { decision: "APPROVE", decision_reason: "Same person, bigger hat" }
              captures: { err_same_signer: "$.data.error_id" }
            - call: "POST /exception-requests/${er_id}/decision"
              as: ChiefCreditOfficer
              as_user_id: "cco-1"
              payload: { decision: "APPROVE", decision_reason: "Second signature" }
            - call: "POST /exception-requests/${er_id}/decision"
              as: ChiefCreditOfficer
              as_user_id: "cco-1"
              payload: { decision: "DENY", decision_reason: "Changed my mind" }
              captures: { err_already_decided: "$.data.error_id" }
            - call: "POST /loan-files/${lf_id}/points-and-fees-test"
              as: Underwriter
              as_user_id: "uw-1"
              payload: {}
          assert:
            - "The exception request was created with required_authority_tier == 2 (max(overlay tier 2, MINOR -> 1)), requested_by_user_id == uw-1, pinned_metric_value == 700 and status == PENDING_REVIEW"
            - "First trigger call: HTTP status == 422 and error_id == ERR_SEGREGATION_OF_DUTIES - uw-2 holds the Underwriter role but is not assigned_underwriter_id"
            - "Second trigger call: HTTP status == 422 and error_id == ERR_SEGREGATION_OF_DUTIES, NOT ERR_EXCEPTION_AUTHORITY_INSUFFICIENT - the CreditCommittee role is the right authority for a tier-2 first signoff, but the acting X-User-ID equals requested_by_user_id"
            - "Third trigger call: HTTP status == 422 and error_id == ERR_EXCEPTION_AUTHORITY_INSUFFICIENT - a ChiefCreditOfficer may not supply the tier-2 first signature"
            - "Fourth trigger call: HTTP status == 200, status == AWAITING_SECOND_SIGNATURE, first_signoff_user_id == cc-1, second_signoff_user_id == null; GET /loan-files/${lf_id} still shows unresolved_overlay_breach_count == 1 and overlay_breach_codes == [OV-FICO-740] because the fork does not waive anything yet"
            - "Fifth trigger call: HTTP status == 422 and error_id == ERR_EXCEPTION_AUTHORITY_INSUFFICIENT - cc-2 is a different person but still only CreditCommittee authority"
            - "Sixth trigger call: HTTP status == 422 and error_id == ERR_SEGREGATION_OF_DUTIES - cc-1 now carries the ChiefCreditOfficer role, so authority is sufficient and only the acting-user clause can refuse it"
            - "Seventh trigger call: HTTP status == 200, status == APPROVED, first_signoff_user_id == cc-1, second_signoff_user_id == cco-1; GET /loan-files/${lf_id} now shows unresolved_overlay_breach_count == 0 and investor_notification_required == true"
            - "Eighth trigger call: HTTP status == 422 and error_id == ERR_EXCEPTION_STATE_INVALID - APPROVED accepts no further decision, and the request still reads decision_reason from the seventh call"
            - "Ninth trigger call: HTTP status == 200 - the identical request refused as the first trigger call succeeds for the assigned underwriter uw-1, so the refusal was the user binding and nothing else"

  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_worksheet_create_rejects_stale_loan_file_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.worksheet-create-stale-loan-file
          - errors.ERR_STALE_LOAN_FILE_VERSION
          - validations[priority=8]
          - endpoints.POST /income-worksheets
        distinguishing_aspect: "The declared write endpoint POST /income-worksheets is guarded only by expected_loan_file_version: the same request body is refused with 412 while the client echoes the pre-suspension version and accepted once it echoes the post-suspension version, and the version it must echo advanced because of a suspend the client never made. Nothing about the worksheet payload changed between the two attempts."
        test_recipe:
          setup:
            - "An ASSET_DEPLETION loan file in UNDERWRITING whose version has just been advanced by a suspend the worksheet author did not observe."
          setup_api_calls:
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "ASSET_DEPLETION"
                name: "Asset Depletion OCC"
                depletion_horizon_months: 84
                max_ltv_pct: 80.00
                min_fico: 660
                min_reserves_months: 6
                max_dti_pct: 50.00
                min_residual_income_cents: 250000
                second_valuation_ltv_threshold_pct: 90.00
                second_valuation_loan_amount_threshold_cents: 150000000
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
              captures: { prog_id: "$.data.id" }
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { legal_name: "Stale Stan", fico_score: 720, monthly_debt_obligations_cents: 90000, verified_liquid_assets_cents: 67222226, age_years: 50 }
              captures: { borr_id: "$.data.id" }
            - call: "POST /loan-files"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { borrower_id: "${borr_id}", program_id: "${prog_id}", investor_code: "INV-ALPHA", loan_amount_cents: 30000000, purchase_price_cents: 40000000, property_value_cents: 40000000, occupancy: "PRIMARY", purpose: "PURCHASE", lien_position: "FIRST", note_rate_pct: 7.500, apor_pct: 6.100, term_months: 360, amortization_type: "FULLY_AMORTIZING", monthly_taxes_cents: 50000, monthly_insurance_cents: 15000 }
              captures: { lf_id: "$.data.id" }
            - call: "POST /loan-files/${lf_id}/doc-type-selection"
              as: Underwriter
              as_user_id: "uw-1"
              payload: { doc_type: "ASSET_DEPLETION" }
            - call: "POST /points-and-fees-items"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { loan_file_id: "${lf_id}", fee_code: "F-ORIG", fee_category: "ORIGINATION_POINTS", amount_cents: 300000, prepaid_finance_charge_flag: true }
            - call: "POST /loan-files/${lf_id}/submit-to-underwriting"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: {}
            - call: "GET /loan-files/${lf_id}"
              as: Underwriter
              as_user_id: "uw-1"
              captures: { v_before: "$.data.version" }
            - call: "POST /loan-files/${lf_id}/suspend"
              as: Underwriter
              as_user_id: "uw-1"
              payload: { suspension_reason: "Awaiting updated brokerage statement" }
          trigger:
            - call: "POST /income-worksheets"
              as: Underwriter
              as_user_id: "uw-1"
              payload: { loan_file_id: "${lf_id}", method: "ASSET_DEPLETION", expected_loan_file_version: "${v_before}", asset_bucket_checking_cents: 15000000, asset_bucket_brokerage_cents: 22222225, asset_bucket_retirement_cents: 30000001 }
              captures: { err_stale: "$.data.error_id" }
            - call: "GET /loan-files/${lf_id}"
              as: Underwriter
              as_user_id: "uw-1"
              captures: { v_after: "$.data.version" }
            - call: "POST /income-worksheets"
              as: Underwriter
              as_user_id: "uw-1"
              payload: { loan_file_id: "${lf_id}", method: "ASSET_DEPLETION", expected_loan_file_version: "${v_after}", asset_bucket_checking_cents: 15000000, asset_bucket_brokerage_cents: 22222225, asset_bucket_retirement_cents: 30000001 }
              captures: { ws_id: "$.data.id" }
          assert:
            - "First trigger call: HTTP status == 412 and error_id == ERR_STALE_LOAN_FILE_VERSION - the loan file's version advanced past ${v_before} when the suspend was applied"
            - "Second trigger call: version == ${v_before} + 1, and status == SUSPENDED"
            - "Third trigger call: HTTP status == 201 with the identical body except for expected_loan_file_version, method == ASSET_DEPLETION and status == DRAFT; the loan file is still SUSPENDED, so no state precondition rejected the first attempt"
            - "The refused first attempt created nothing: GET /loan-files/${lf_id}/income-worksheets returns total_count == 1 and its single row id == ${ws_id}"
            - "The loan file's version after the successful create is ${v_after} + 1, proving every accepted write increments it"

      - name: corner_occ_pool_writes_reject_stale_pool_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.pool-assignment-stale-pool
          - errors.ERR_STALE_POOL_VERSION
          - validations[priority=9]
          - endpoints.POST /securitization-pools/{id}/loans
          - endpoints.POST /securitization-pools/{id}/removals
          - calculations.pool_metrics_recompute
        distinguishing_aspect: "Both pool writes carry expected_pool_version, and a stale value returns 412 ERR_STALE_POOL_VERSION even when the request would also have failed at priority 33 (the loan is already a member) or priority 16 (the pool would be settling) - the version check at priority 9 runs first. Replaying with the version returned by the previous write succeeds every time, and the version increments on the assignment, the removal and the settlement alike."
