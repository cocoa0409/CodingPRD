          setup:
            - "Program FA26 ACTIVE with stores 0101(A, capacity 48), 0102(B, capacity 24) and 0103(C, capacity 48)"
            - "Three SEASONAL items on TOP-4SZ: SKU-1001, SKU-2001 and SKU-3001"
