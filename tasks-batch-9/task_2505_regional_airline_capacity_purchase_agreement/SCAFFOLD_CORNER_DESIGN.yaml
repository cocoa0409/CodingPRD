# =============================================================================
# task_2505 — Regional Airline Capacity Purchase Agreement
# §1.9 Scaffold Corner Design — breadth walk of references/claim-extraction-guide.md
# against this scaffold's §1.1–§1.7. Depth probes live in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners already asserted there appear here as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Guide section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_agreement_returns_201_with_system_defaults
        claim_type: creation
        grounds:
          - entities.Agreement
          - endpoints[POST /cpa/agreements]
          - response_envelope.success
        distinguishing_aspect: "A brand-new Agreement is DRAFT with every derived money field at 0.00 and activated_at null; the caller cannot preset any of them."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
          assert:
            - "HTTP 201 with response_type == \"object\" and meta.api_request_id present"
            - "data.status == \"DRAFT\", data.extension_round_count == 0, data.settled_to_date_usd == 0.00, data.open_invoice_count == 0, data.activated_at == null"
            - "data.block_hour_rate_usd == 1450.75 and data.term_end_date == \"2029-12-31\" — inputs echoed exactly"
            - "data.id is a non-empty string, data.version == 1, data.created_at and data.updated_at are present"

      - name: get_crew_base_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - entities.CrewBase
          - endpoints[GET /cpa/crew-bases/{baseId}]
        distinguishing_aspect: "A freshly created CrewBase reads back with its two input capacities intact and every staffing derivation at its empty-base value, including staffing_posture STAFFED with zero aircraft."
        test_recipe:
          setup:
            - "One DRAFT agreement with one CrewBase and no pilots or aircraft."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 2, aircraft_allocation_cap: 3 }
              as: RegionalOpsController
              captures: { base: $.data.id }
          trigger:
            - call: "GET /cpa/crew-bases/${base}"
              payload: {}
              as: RegionalOpsController
          assert:
            - "HTTP 200 with data.id == ${base} and data.agreement_id == ${ag}"
            - "data.station_code == \"MKE\", data.pilots_required_per_aircraft == 2, data.aircraft_allocation_cap == 3"
            - "data.lifecycle_status == \"ACTIVE\", data.line_qualified_pilot_count == 0, data.in_training_pilot_count == 0, data.assigned_aircraft_count == 0"
            - "data.required_pilot_count == 0, data.headcount_shortfall == 0, data.pipeline_shortfall == 0, data.staffing_posture == \"STAFFED\", data.allocatable_aircraft_count == 0"

      - name: list_flight_legs_filtered_by_cycle_with_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /cpa/flight-legs]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The cycle filter and the offset window compose: three legs of one cycle paginate 2 + 1 in created_at ASC order with total_count fixed at 3 and has_more flipping true → false."
        test_recipe:
          setup:
            - "ACTIVE agreement, one base, one LINE_QUALIFIED captain, one IN_SERVICE tail, OPEN cycle 2026-09 with published_departures 10."
            - "Three SCHEDULED legs created in order SM6001, SM6002, SM6003 on separate days."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-2001", seat: "CAPTAIN", hire_class_date: "2026-06-01" }
              as: RegionalOpsController
              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N2001RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 10 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM6001", origin: "MKE", destination: "ORD", scheduled_departure_utc: "2026-09-02T08:00:00Z", scheduled_arrival_utc: "2026-09-02T09:00:00Z", planned_block_hours: 1.000 }
              as: MainlineScheduler
              captures: { l1: $.data.id }
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM6002", origin: "MKE", destination: "DTW", scheduled_departure_utc: "2026-09-04T08:00:00Z", scheduled_arrival_utc: "2026-09-04T09:00:00Z", planned_block_hours: 1.000 }
              as: MainlineScheduler
              captures: { l2: $.data.id }
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM6003", origin: "MKE", destination: "MSP", scheduled_departure_utc: "2026-09-06T08:00:00Z", scheduled_arrival_utc: "2026-09-06T09:00:00Z", planned_block_hours: 1.000 }
              as: MainlineScheduler
              captures: { l3: $.data.id }
          trigger:
            - call: "GET /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", limit: 2, offset: 0 }
              as: MainlineScheduler
            - call: "GET /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", limit: 2, offset: 2 }
              as: MainlineScheduler
          assert:
            - "First page: HTTP 200, response_type == \"array\", len(data) == 2, data[0].id == ${l1}, data[1].id == ${l2}, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: len(data) == 1, data[0].id == ${l3}, total_count == 3, has_more == false, offset == 2"
            - "Every returned row has cycle_id == ${cyc} and status == \"SCHEDULED\""

      - name: get_aircraft_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_AIRCRAFT_NOT_FOUND]
          - validations[priority=3]
          - endpoints[GET /cpa/aircraft/{aircraftId}]
        distinguishing_aspect: "An id-shaped string that matches no Aircraft row yields the entity-specific 404 code, not a generic reference error."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /cpa/aircraft/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalOpsController
          assert:
            - "HTTP 404 with response_type == \"error\" and data.error_id == \"ERR_AIRCRAFT_NOT_FOUND\""

      - name: create_pilot_missing_seat_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /cpa/pilots]
        distinguishing_aspect: "Omitting the required `seat` enum fails validation at priority 5 before any base-state reasoning happens, and creates no Pilot row."
        test_recipe:
          setup:
            - "ACTIVE agreement with one CrewBase."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
          trigger:
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-2101", hire_class_date: "2026-06-01" }
              as: RegionalOpsController
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /cpa/pilots?base_id=${base} returns data == [] and total_count == 0"
            - "CrewBase.${base}.line_qualified_pilot_count == 0 and in_training_pilot_count == 0"

      - name: new_schedule_cycle_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ScheduleCycle
          - endpoints[POST /cpa/schedule-cycles]
          - state_machines.ScheduleCycle.initial_state
        distinguishing_aspect: "A cycle is born PLANNED with every counter at its declared default and passthrough_settlement_usd at 0.00 — published_departures is the only figure the caller supplies."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
          trigger:
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-11", published_departures: 40 }
              as: MainlineScheduler
          assert:
            - "HTTP 201 with data.status == \"PLANNED\" and data.published_departures == 40"
            - "data.recorded_completed_legs == 0, data.open_leg_count == 0, data.cancelled_controllable_count == 0, data.cancelled_uncontrollable_count == 0"
            - "data.metric_completed_departures == 40 and data.departure_ledger_total == 40 — the ledger invariant holds from creation"
            - "data.credited_block_hours == 0.000, data.enplaned_bags_total == 0, data.mishandled_bags_total == 0, data.on_time_leg_count == 0"
            - "data.estimated_passthrough_total_usd == 0.00, data.passthrough_settlement_usd == 0.00, data.closed_at == null"

      - name: leg_completion_computes_variable_payment_and_on_time_flag
        claim_type: computed_fields
        grounds:
          - entities.FlightLeg.fields.leg_variable_payment_usd
          - entities.FlightLeg.fields.on_time
          - calculations.variable_flight_payment
        distinguishing_aspect: "leg_variable_payment_usd and on_time are computed from the completion report, not supplied: 1.500 actual hours at 1450.75 plus one departure at 320.00 is 2496.13 after round-half-up of 2176.125."
        test_recipe:
          setup:
            - "ACTIVE agreement, one base, one LINE_QUALIFIED captain, one IN_SERVICE tail, OPEN cycle 2026-09 (published_departures 10) with one SCHEDULED leg arriving 2026-09-02T09:30:00Z."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-2201", seat: "CAPTAIN", hire_class_date: "2026-06-01" }
              as: RegionalOpsController
              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N2101RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 10 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM6101", origin: "MKE", destination: "ORD", scheduled_departure_utc: "2026-09-02T08:00:00Z", scheduled_arrival_utc: "2026-09-02T09:30:00Z", planned_block_hours: 1.500 }
              as: MainlineScheduler
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /cpa/flight-legs/${l1}/complete"
              payload: { actual_block_hours: 1.500, actual_arrival_utc: "2026-09-02T09:20:00Z", enplaned_bags: 90, mishandled_bags: 1 }
              as: RegionalOpsController
          assert:
            - "HTTP 200 with data.status == \"COMPLETED\" and data.on_time == true — 10 minutes early is inside the grace window"
            - "data.leg_variable_payment_usd == 2496.13 — round2(1.500 * 1450.75) == 2176.13 plus the 320.00 departure rate"
            - "ScheduleCycle.${cyc}.credited_block_hours == 1.500, recorded_completed_legs == 1, on_time_leg_count == 1"
            - "ScheduleCycle.${cyc}.enplaned_bags_total == 90 and mishandled_bags_total == 1"
            - "ScheduleCycle.${cyc}.open_leg_count == 0 and departure_ledger_total == 10"

      - name: brand_audit_system_fields_generated_not_accepted
        claim_type: system_fields
        grounds:
          - entities.BrandAudit
          - endpoints[POST /cpa/brand-audits]
        distinguishing_aspect: "finding_status, remediation_status and evidence_ref are system-owned: a creation request that also carries them is rejected by the payload contract, and the accepted request sets them from §1.2's initial state."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
          trigger:
            - call: "POST /cpa/brand-audits"
              payload: { base_id: "${base}", audit_scope: "CABIN_PRODUCT", findings_count: 1, severity: "MINOR" }
              as: BrandAuditor
          assert:
            - "HTTP 201 with data.finding_status == \"OPEN\", data.remediation_status == \"NOT_STARTED\", data.evidence_ref == null"
            - "data.id, data.created_at, data.updated_at are system-generated and data.version == 1"
            - "data.base_id == ${base}, data.audit_scope == \"CABIN_PRODUCT\", data.findings_count == 1, data.severity == \"MINOR\""

      - name: create_aircraft_invalid_ownership_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.Aircraft.fields.ownership
        distinguishing_aspect: "`ownership` accepts only its declared enum members; a plausible-looking LEASED_FROM_MAINLINE value is a 400, and seat_count is unaffected by the rejection."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
          trigger:
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N2201RG", seat_count: 76, ownership: "LEASED_FROM_MAINLINE" }
              as: RegionalOpsController
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /cpa/aircraft?agreement_id=${ag} returns data == [] and total_count == 0"

      - name: create_flight_leg_with_unknown_pilot_reference_rejected
        claim_type: foreign_key_integrity
        grounds:
          - validations[priority=4]
          - errors[ERR_REFERENCE_NOT_FOUND]
          - endpoints[POST /cpa/flight-legs]
        distinguishing_aspect: "Flat topology means every relationship is a body FK: an unresolvable captain_pilot_id is a 404 ERR_REFERENCE_NOT_FOUND at priority 4, ahead of the qualification and availability rules at priorities 30–32."
        test_recipe:
          setup:
            - "ACTIVE agreement, one base, one IN_SERVICE tail, OPEN cycle 2026-09 with published_departures 10."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-2301", seat: "CAPTAIN", hire_class_date: "2026-06-01" }
              as: RegionalOpsController
              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N2301RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 10 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
          trigger:
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "00000000-0000-0000-0000-000000000000", flight_number: "SM6201", origin: "MKE", destination: "ORD", scheduled_departure_utc: "2026-09-02T08:00:00Z", scheduled_arrival_utc: "2026-09-02T09:00:00Z", planned_block_hours: 1.000 }
              as: MainlineScheduler
          assert:
            - "HTTP 404 with data.error_id == \"ERR_REFERENCE_NOT_FOUND\""
            - "ScheduleCycle.${cyc}.open_leg_count == 0"

      - name: create_pilot_under_unknown_base_rejected
