scenario: |
  Campus EHS & Laboratory Chemical Inventory (university environmental health & safety): chemical inventory by lab & container barcode, hazardous-material threshold & permit reporting, waste pickup request & accumulation-area compliance, lab inspection schedule & corrective action, training assignment by hazard & role, incident/spill response & near-miss reporting, lab closeout/decommissioning at PI departure, controlled-substance and select-agent registration coordination

domain_name: campus-ehs-lab-chemical-inventory
api_prefix: /ehs

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - rate_threshold_triggers
    - cascading_side_effects
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all associations via FKs)
# =============================================================================
entities:
  - name: Lab
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Lab display name" }
      - { name: department, type: string, source: input, description: "Owning academic department" }
      - { name: building, type: string, source: input, description: "Building name" }
      - { name: room, type: string, source: input, description: "Room identifier" }
      - { name: pi_worker_id, type: string, source: system, description: "FK -> LabWorker.id; nullable; auto-set when the lab's first PI-role worker is created", constraints: "nullable; at most one PI per lab" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: ACTIVE, constraints: "ACTIVE | CLOSING | DECOMMISSIONED" }
      - { name: posture, type: enum, source: computed, description: "Derived safety posture gating child operations (see lab_posture_derivation)", default: NORMAL, constraints: "NORMAL | RESTRICTED | FROZEN" }
      - { name: hazard_totals_physical, type: object, source: computed, description: "Map hazard_class -> total quantity_value over this lab's containers in state IN_USE only" }
      - { name: hazard_totals_regulatory, type: object, source: computed, description: "Map hazard_class -> total quantity_value over containers in state IN_USE or WASTE_TAGGED (PICKED_UP excluded)" }
      - { name: permit_report_required, type: boolean, source: computed, description: "True when any hazard class regulatory total is > 0 and >= its PERMIT_THRESHOLDS_GAL entry" }

  - name: LabWorker
    parent: null
    common_fields: true
    fields:
      - { name: lab_id, type: string, source: input, description: "FK -> Lab.id" }
      - { name: full_name, type: string, source: input, description: "Worker name" }
      - { name: role_in_lab, type: enum, source: input, description: "Appointment kind; PI creation auto-assigns Lab.pi_worker_id", constraints: "PI | RESEARCHER | STUDENT" }

  - name: ChemicalContainer
    parent: null
    common_fields: true
    fields:
      - { name: lab_id, type: string, source: input, description: "FK -> Lab.id" }
      - { name: barcode, type: string, source: input, description: "Container barcode; unique within the owning lab", constraints: "unique per lab_id" }
      - { name: chemical_name, type: string, source: input, description: "Chemical name" }
      - { name: hazard_class, type: enum, source: input, description: "Primary hazard classification", constraints: "FLAMMABLE | OXIDIZER | CORROSIVE | TOXIC | CONTROLLED_SUBSTANCE | SELECT_AGENT" }
      - { name: quantity_value, type: number, source: input, description: "Amount normalized to gallons-equivalent at receipt", constraints: "> 0" }
      - { name: quantity_unit, type: enum, source: input, description: "Original unit as received (informational; quantity_value is already normalized)", default: GAL, constraints: "GAL | L | KG | LB" }
      - { name: state, type: enum, source: system, description: "Container lifecycle", default: IN_USE, constraints: "IN_USE | WASTE_TAGGED | PICKED_UP" }
      - { name: accumulation_area_id, type: string, source: system, description: "FK -> AccumulationArea.id; nullable; set by tag-waste, cleared by untag-waste", constraints: "nullable" }
      - { name: tagged_at, type: datetime, source: system, description: "Logical-clock timestamp when tagged as waste; null unless WASTE_TAGGED", constraints: "nullable" }
      - { name: pickup_request_id, type: string, source: system, description: "FK -> WastePickupRequest.id; nullable; set by add-item, cleared by remove-item / cancel / untag-waste", constraints: "nullable" }
      - { name: access_blocked, type: boolean, source: computed, description: "True when hazard_class is CONTROLLED_SUBSTANCE or SELECT_AGENT and the lab has no ACTIVE Registration of the matching material_type" }

  - name: AccumulationArea
    parent: null
    common_fields: true
    fields:
      - { name: lab_id, type: string, source: input, description: "FK -> Lab.id" }
      - { name: name, type: string, source: input, description: "Area label" }
      - { name: area_type, type: enum, source: input, description: "Satellite or central accumulation area", constraints: "SAA | CAA" }
      - { name: capacity_containers, type: integer, source: input, description: "Maximum number of WASTE_TAGGED containers the area may hold at once", constraints: "> 0" }
      - { name: current_container_count, type: integer, source: computed, description: "Count of ChemicalContainers with state WASTE_TAGGED and accumulation_area_id = this area" }
      - { name: has_overstay_containers, type: boolean, source: computed, description: "True when any linked WASTE_TAGGED container has been tagged for strictly more than ACCUMULATION_MAX_DAYS (365) days" }

  - name: WastePickupRequest
    parent: null
    common_fields: true
    fields:
      - { name: lab_id, type: string, source: input, description: "FK -> Lab.id" }
      - { name: status, type: enum, source: system, description: "Pickup lifecycle", default: DRAFT, constraints: "DRAFT | SUBMITTED | REJECTED | SCHEDULED | COMPLETED | CANCELLED" }
      - { name: dock_id, type: string, source: system, description: "Loading dock reserved at schedule time; null until SCHEDULED", constraints: "nullable" }
      - { name: window_start, type: datetime, source: system, description: "Pickup window start set at schedule; null until SCHEDULED", constraints: "nullable" }
      - { name: window_end, type: datetime, source: system, description: "Pickup window end set at schedule; null until SCHEDULED", constraints: "nullable" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded by reject; cleared on re-submit", constraints: "nullable" }
      - { name: estimated_quantity_total, type: number, source: computed, description: "Sum of quantity_value over linked containers with state WASTE_TAGGED" }
      - { name: estimated_cost, type: number, source: computed, description: "Disposal cost estimate; see pickup_cost_estimate (per-item rounding, then sum, then base fee)" }

  - name: LabInspection
    parent: null
    common_fields: true
    fields:
      - { name: lab_id, type: string, source: input, description: "FK -> Lab.id" }
      - { name: inspector_id, type: string, source: input, description: "Opaque EHSInspector operator id assigned to perform the inspection" }
      - { name: scheduled_start, type: datetime, source: input, description: "Inspection window start (half-open interval start)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Inspection window end (half-open interval end; must be > scheduled_start)" }
      - { name: status, type: enum, source: system, description: "Inspection lifecycle", default: SCHEDULED, constraints: "SCHEDULED | COMPLETED | CANCELLED" }
      - { name: findings, type: array, source: system, description: "Array of {severity: MAJOR|MINOR, description: string} recorded at completion" }
      - { name: score_weighted, type: number, source: computed, description: "100 - (20 per MAJOR + 5 per MINOR); null until COMPLETED", constraints: "nullable" }
      - { name: score_flat, type: number, source: computed, description: "100 - (10 per finding regardless of severity); null until COMPLETED", constraints: "nullable" }
      - { name: outcome, type: enum, source: computed, description: "PASS when score_weighted >= 70 else FAIL; null until COMPLETED", constraints: "nullable; PASS | FAIL" }
      - { name: completed_by_inspector_id, type: string, source: system, description: "X-User-ID that completed the inspection; drives segregation-of-duties on verification", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock completion timestamp", constraints: "nullable" }

  - name: CorrectiveAction
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: system, description: "FK -> LabInspection.id" }
      - { name: lab_id, type: string, source: system, description: "FK -> Lab.id; copied from the parent inspection" }
      - { name: description, type: string, source: system, description: "Copied from the triggering finding" }
      - { name: severity, type: enum, source: system, description: "Copied from the triggering finding", constraints: "MAJOR | MINOR" }
      - { name: status, type: enum, source: system, description: "Corrective-action lifecycle (cyclic rework loop)", default: OPEN, constraints: "OPEN | SUBMITTED | REOPENED | VERIFIED" }
      - { name: due_date, type: datetime, source: system, description: "inspection.completed_at + 14 days (MAJOR) or + 30 days (MINOR)" }
      - { name: resolution_note, type: string, source: input, description: "PI's remediation narrative supplied at submit; nullable", constraints: "nullable" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of the verifying inspector; null until VERIFIED", constraints: "nullable" }
      - { name: overdue, type: boolean, source: computed, description: "True when status in {OPEN, REOPENED} and logical now > due_date" }

  - name: TrainingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: lab_id, type: string, source: input, description: "FK -> Lab.id" }
      - { name: worker_id, type: string, source: input, description: "FK -> LabWorker.id" }
      - { name: hazard_class, type: enum, source: input, description: "Hazard class this training certifies", constraints: "FLAMMABLE | OXIDIZER | CORROSIVE | TOXIC | CONTROLLED_SUBSTANCE | SELECT_AGENT" }
      - { name: status, type: enum, source: system, description: "Assignment lifecycle", default: ASSIGNED, constraints: "ASSIGNED | COMPLETED | EXPIRED" }
      - { name: due_date, type: datetime, source: input, description: "Completion deadline; assignment auto-expires when the logical clock passes it" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock completion timestamp; null until COMPLETED", constraints: "nullable" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: lab_id, type: string, source: input, description: "FK -> Lab.id" }
      - { name: title, type: string, source: input, description: "Short incident title" }
      - { name: description, type: string, source: input, description: "What happened (spill, exposure, near-miss)" }
      - { name: severity, type: enum, source: input, description: "Severity classification", constraints: "LOW | MEDIUM | HIGH" }
      - { name: near_miss, type: boolean, source: input, description: "True for near-miss reports (no release/injury)", default: false }
      - { name: status, type: enum, source: system, description: "Incident lifecycle", default: REPORTED, constraints: "REPORTED | CLOSED" }
      - { name: reported_by, type: string, source: system, description: "X-User-ID of the reporter" }
      - { name: resolution, type: string, source: input, description: "Closure narrative supplied at close; nullable", constraints: "nullable" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: lab_id, type: string, source: input, description: "FK -> Lab.id" }
      - { name: material_type, type: enum, source: input, description: "Regulated material category", constraints: "CONTROLLED_SUBSTANCE | SELECT_AGENT" }
      - { name: registration_number, type: string, source: input, description: "External regulator registration identifier" }
      - { name: status, type: enum, source: system, description: "Registration lifecycle (cyclic suspend/reinstate)", default: PENDING, constraints: "PENDING | ACTIVE | SUSPENDED | SURRENDERED | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Lab
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: CLOSING
        trigger: "POST /ehs/labs/{id}/closeout"
        actor: PrincipalInvestigator | EHSAdmin
        preconditions:
          - "lab.status == ACTIVE (else ERR_LAB_STATE)"
          - "if actor role is PrincipalInvestigator, X-User-ID must equal lab.pi_worker_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "every LabInspection of this lab in status SCHEDULED transitions to CANCELLED"
          - "recompute lab.posture via lab_posture_derivation"
          - "increments Lab.version by 1"
      - from: CLOSING
        to: DECOMMISSIONED
        trigger: "POST /ehs/labs/{id}/decommission"
        actor: EHSAdmin
        preconditions:
          - "lab.status == CLOSING (else ERR_LAB_STATE)"
          - "no ChemicalContainer of this lab with state != PICKED_UP"
          - "no WastePickupRequest of this lab with status in {DRAFT, SUBMITTED, REJECTED, SCHEDULED}"
          - "no CorrectiveAction of this lab with status in {OPEN, SUBMITTED, REOPENED}"
          - "no Registration of this lab with status in {PENDING, ACTIVE, SUSPENDED}"
          - "no Incident of this lab with status REPORTED"
          - "any violation of the five set-emptiness checks -> ERR_DECOMMISSION_BLOCKED"
        side_effects:
          - "lab.posture := FROZEN"
          - "increments Lab.version by 1"

  - entity: ChemicalContainer
    initial_state: IN_USE
    terminal_states: [PICKED_UP]
    transitions:
      - from: IN_USE
        to: WASTE_TAGGED
        trigger: "POST /ehs/containers/{id}/tag-waste"
        actor: PrincipalInvestigator | LabMember
        preconditions:
          - "container.state == IN_USE (else ERR_CONTAINER_STATE)"
          - "lab.status in {ACTIVE, CLOSING} (else ERR_LAB_STATE)"
          - "lab.posture != FROZEN (else ERR_LAB_FROZEN)"
          - "acting worker (X-User-ID) has a TrainingAssignment in this lab with matching hazard_class and status COMPLETED (else ERR_REQUIRED_TRAINING_INCOMPLETE)"
          - "accumulation_area.lab_id == container.lab_id (else ERR_CROSS_LAB_REFERENCE)"
          - "area.current_container_count < area.capacity_containers (else ERR_AREA_CAPACITY_EXCEEDED)"
        side_effects:
          - "container.accumulation_area_id := area.id; container.tagged_at := logical now"
          - "area.current_container_count recomputed (+1)"
          - "re-screen lab hazard totals (hazard_threshold_screening; container joins regulatory set)"
          - "recompute lab.posture"
          - "increments ChemicalContainer.version by 1"
      - from: WASTE_TAGGED
        to: IN_USE
        trigger: "POST /ehs/containers/{id}/untag-waste"
        actor: PrincipalInvestigator | LabMember
        preconditions:
          - "container.state == WASTE_TAGGED (else ERR_CONTAINER_STATE)"
          - "container.pickup_request_id is null OR the linked WastePickupRequest.status in {REJECTED, CANCELLED} (else ERR_CONTAINER_STATE)"
        side_effects:
          - "container.accumulation_area_id := null; tagged_at := null; pickup_request_id := null"
          - "previous area.current_container_count recomputed (-1)"
          - "re-screen lab hazard totals; recompute lab.posture"
          - "increments ChemicalContainer.version by 1"
      - from: WASTE_TAGGED
        to: PICKED_UP
        trigger: "system: parent WastePickupRequest complete"
        actor: system
        preconditions:
          - "container linked to the completing pickup request"
        side_effects:
          - "state := PICKED_UP (accumulation_area_id retained for audit; excluded from counts because count filters on state == WASTE_TAGGED)"
          - "area.current_container_count recomputed (-1)"
          - "re-screen lab hazard totals -> lab.permit_report_required may flip false"
          - "recompute lab.posture"
          - "increments ChemicalContainer.version by 1"

  - entity: WastePickupRequest
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ehs/waste-pickup-requests/{id}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "status in {DRAFT, REJECTED} (else ERR_PICKUP_STATE)"
          - "at least one linked container (count >= 1; else ERR_PICKUP_EMPTY)"
          - "lab.posture != FROZEN (else ERR_LAB_FROZEN)"
          - "X-User-ID == lab.pi_worker_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["rejection_reason := null", "increments WastePickupRequest.version by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /ehs/waste-pickup-requests/{id}/submit"
        actor: PrincipalInvestigator
        preconditions: ["same as DRAFT -> SUBMITTED (revision loop: items editable while REJECTED)"]
        side_effects: ["rejection_reason := null", "increments WastePickupRequest.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ehs/waste-pickup-requests/{id}/reject"
        actor: EHSAdmin
        preconditions: ["status == SUBMITTED (else ERR_PICKUP_STATE)"]
        side_effects: ["rejection_reason := reason", "container links preserved (containers stay WASTE_TAGGED with pickup_request_id intact)", "increments WastePickupRequest.version by 1"]
      - from: SUBMITTED
        to: SCHEDULED
        trigger: "POST /ehs/waste-pickup-requests/{id}/schedule"
        actor: EHSAdmin
        preconditions:
          - "status == SUBMITTED (else ERR_PICKUP_STATE)"
          - "window_end > window_start (else ERR_INVALID_WINDOW)"
          - "no other SCHEDULED pickup at same dock_id whose [window_start, window_end] is within DOCK_BUFFER_MINUTES (30) of the new window on either side; a gap of exactly 30 minutes is allowed (else ERR_DOCK_WINDOW_CONFLICT)"
        side_effects: ["dock_id/window_start/window_end stored", "increments WastePickupRequest.version by 1"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /ehs/waste-pickup-requests/{id}/complete"
        actor: EHSAdmin
        preconditions: ["status == SCHEDULED (else ERR_PICKUP_STATE)"]
        side_effects:
          - "cascade link 1: every linked container WASTE_TAGGED -> PICKED_UP (its own side effects fire: area count -1 per container)"
          - "cascade link 2: each container's departure from the regulatory set re-screens lab hazard totals -> lab.permit_report_required recomputed"
          - "recompute lab.posture"
          - "increments WastePickupRequest.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ehs/waste-pickup-requests/{id}/cancel"
        actor: EHSAdmin
        preconditions: ["status == SCHEDULED (else ERR_PICKUP_STATE)"]
        side_effects: ["compensation: every linked container's pickup_request_id := null (containers remain WASTE_TAGGED in their areas; area counts unchanged)", "increments WastePickupRequest.version by 1"]

  - entity: LabInspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /ehs/inspections/{id}/complete"
        actor: EHSInspector
        preconditions:
          - "status == SCHEDULED (else ERR_INSPECTION_STATE)"
          - "X-User-ID == inspection.inspector_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "inspection_scoring: score_weighted, score_flat, outcome computed from findings"
          - "completed_by_inspector_id := X-User-ID; completed_at := logical now"
          - "one CorrectiveAction (status OPEN) created per finding; due_date = completed_at + 14d (MAJOR) or + 30d (MINOR)"
          - "cascade link 1: lab.posture recomputed via lab_posture_derivation (FAIL with >= 1 MAJOR finding forces FROZEN)"
          - "cascade link 2 (only when posture becomes FROZEN): every Registration of the lab in status ACTIVE transitions to SUSPENDED"
          - "cascade link 3 (from each registration suspension): every container of the lab whose hazard_class matches the suspended material_type has access_blocked recomputed to true"
          - "increments LabInspection.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: parent Lab closeout"
        actor: system
        preconditions: ["lab transitions ACTIVE -> CLOSING"]
        side_effects: ["increments LabInspection.version by 1"]

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /ehs/corrective-actions/{id}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "status in {OPEN, REOPENED} (else ERR_CORRECTIVE_ACTION_STATE)"
          - "X-User-ID == lab.pi_worker_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["resolution_note stored", "recompute lab.posture", "increments CorrectiveAction.version by 1"]
      - from: REOPENED
        to: SUBMITTED
        trigger: "POST /ehs/corrective-actions/{id}/submit"
        actor: PrincipalInvestigator
        preconditions: ["same as OPEN -> SUBMITTED (rework loop)"]
        side_effects: ["resolution_note overwritten", "recompute lab.posture", "increments CorrectiveAction.version by 1"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /ehs/corrective-actions/{id}/verify with decision=APPROVE"
        actor: EHSInspector
        preconditions:
          - "status == SUBMITTED (else ERR_CORRECTIVE_ACTION_STATE)"
          - "X-User-ID != parent inspection.completed_by_inspector_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["verified_by := X-User-ID", "recompute lab.posture", "increments CorrectiveAction.version by 1"]
      - from: SUBMITTED
        to: REOPENED
        trigger: "POST /ehs/corrective-actions/{id}/verify with decision=REJECT"
        actor: EHSInspector
        preconditions: ["same as SUBMITTED -> VERIFIED"]
        side_effects: ["recompute lab.posture", "increments CorrectiveAction.version by 1"]

  - entity: TrainingAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /ehs/training-assignments/{id}/complete"
        actor: LabMember | PrincipalInvestigator
        preconditions:
          - "status == ASSIGNED (else ERR_TRAINING_STATE)"
          - "X-User-ID == assignment.worker_id OR X-User-ID == lab.pi_worker_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["completed_at := logical now", "recompute lab.posture", "increments TrainingAssignment.version by 1"]
      - from: ASSIGNED
        to: EXPIRED
        trigger: "system: POST /ehs/_clock/set_current_utc sweep — any ASSIGNED assignment with due_date < new logical now"
        actor: system
        preconditions: ["due_date < logical now"]
        side_effects: ["recompute lab.posture (expired_training_count input)", "increments TrainingAssignment.version by 1"]

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: CLOSED
        trigger: "POST /ehs/incidents/{id}/close"
        actor: EHSAdmin
        preconditions: ["status == REPORTED (else ERR_INCIDENT_STATE)"]
        side_effects: ["resolution stored", "recompute lab.posture (open_high_incident_count input)", "increments Incident.version by 1"]

  - entity: Registration
    initial_state: PENDING
    terminal_states: [SURRENDERED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /ehs/registrations/{id}/activate"
        actor: EHSAdmin
        preconditions: ["status in {PENDING, SUSPENDED} (else ERR_REGISTRATION_STATE)"]
        side_effects: ["recompute access_blocked for the lab's containers of this material_type (-> false)", "increments Registration.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /ehs/registrations/{id}/activate"
        actor: EHSAdmin
        preconditions: ["status in {PENDING, SUSPENDED} (else ERR_REGISTRATION_STATE)"]
        side_effects: ["recompute access_blocked for matching containers (-> false)", "increments Registration.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /ehs/registrations/{id}/suspend OR system cascade when lab.posture becomes FROZEN"
        actor: EHSAdmin | system
        preconditions: ["status == ACTIVE (else ERR_REGISTRATION_STATE)"]
        side_effects: ["recompute access_blocked for matching containers (-> true)", "increments Registration.version by 1"]
      - from: ACTIVE
        to: SURRENDERED
        trigger: "POST /ehs/registrations/{id}/surrender"
        actor: EHSAdmin
        preconditions: ["status in {ACTIVE, SUSPENDED} (else ERR_REGISTRATION_STATE)"]
        side_effects: ["recompute access_blocked for matching containers (-> true)", "increments Registration.version by 1"]
      - from: SUSPENDED
        to: SURRENDERED
        trigger: "POST /ehs/registrations/{id}/surrender"
        actor: EHSAdmin
        preconditions: ["status in {ACTIVE, SUSPENDED} (else ERR_REGISTRATION_STATE)"]
        side_effects: ["recompute access_blocked for matching containers (-> true)", "increments Registration.version by 1"]
      - from: PENDING
        to: SUPERSEDED
        trigger: "system: a new Registration with the same (lab_id, material_type) is created"
        actor: system
        preconditions: ["existing registration status == PENDING"]
        side_effects: ["increments superseded Registration.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: registration-create-stale-lab
    parent_entity: Lab
    write_endpoint: "POST /ehs/registrations"
    occ_field: expected_lab_version
    description: |
      Creating a Registration against a Lab whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just created a registration of the same (lab_id, material_type),
      which legitimately supersedes the prior PENDING one, and the current
      writer's view of the lab is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: hazard_threshold_screening
    trigger: "on ChemicalContainer create, tag-waste, untag-waste, and WASTE_TAGGED -> PICKED_UP"
    algorithm: threshold
    formula: |
      for each hazard_class H in {FLAMMABLE, OXIDIZER, CORROSIVE, TOXIC, CONTROLLED_SUBSTANCE, SELECT_AGENT}:
        physical_total[H]   = sum(quantity_value of lab containers with state == IN_USE and hazard_class == H)
        regulatory_total[H] = sum(quantity_value of lab containers with state in {IN_USE, WASTE_TAGGED} and hazard_class == H)
      class_flagged[H] = (regulatory_total[H] > 0) AND (regulatory_total[H] >= PERMIT_THRESHOLDS_GAL[H])
      lab.permit_report_required = any(class_flagged)
      Boundary: the comparison is >= (inclusive) — a regulatory total exactly equal to the threshold flags the class.
    input_set: "ChemicalContainers of one Lab; PICKED_UP containers excluded from both totals"
    constants:
      PERMIT_THRESHOLDS_GAL: { FLAMMABLE: 10.0, OXIDIZER: 10.0, CORROSIVE: 5.0, TOXIC: 1.0, CONTROLLED_SUBSTANCE: 0.0, SELECT_AGENT: 0.0 }
    precision: "2 decimal places, round_half_up on stored totals"
    variants:
      - name: physical_count
        when: "hazard_totals_physical read"
        difference: "counts only state == IN_USE; a tagged-but-not-yet-picked-up container drops out of this total"
      - name: regulatory_count
        when: "hazard_totals_regulatory read and permit_report_required"
        difference: "counts IN_USE + WASTE_TAGGED, so identical container data yields a larger total and can flip permit_report_required"

  - name: pickup_cost_estimate
    trigger: "on WastePickupRequest add-item and remove-item"
    algorithm: aggregation
    formula: |
      estimated_quantity_total = sum(quantity_value of containers with pickup_request_id == request.id AND state == WASTE_TAGGED)
      per_item_fee(c) = round_half_up(c.quantity_value * DISPOSAL_RATE_PER_GAL[c.hazard_class], 2)
      estimated_cost = BASE_FEE + sum(per_item_fee(c) for c in linked WASTE_TAGGED containers)
      PINNED ROUNDING ORDER: round each per-item fee to 2 decimals FIRST, then sum the rounded
      items, then add BASE_FEE. (Sum-then-round is a valid alternative interpretation that can
      differ by cents; it is NOT the pinned order.)
    input_set: "containers linked to the request with state WASTE_TAGGED"
    constants:
      BASE_FEE: 75.00
      DISPOSAL_RATE_PER_GAL: { FLAMMABLE: 12.50, OXIDIZER: 11.00, CORROSIVE: 9.75, TOXIC: 21.20, CONTROLLED_SUBSTANCE: 45.00, SELECT_AGENT: 60.00 }
    precision: "2 decimal places, round_half_up, per item before summation"

  - name: lab_posture_derivation
    trigger: "on every mutation of CorrectiveAction, LabInspection, TrainingAssignment, Incident, ChemicalContainer state, Lab status, and on every clock-set sweep"
    algorithm: constraint_propagation
    formula: |
      inputs (all recomputed from source entities at read/mutation time):
        overdue_ca_count        = CorrectiveActions of lab with status in {OPEN, REOPENED} and due_date < now
        open_ca_count           = CorrectiveActions of lab with status in {OPEN, SUBMITTED, REOPENED}
        latest_failed_major     = the most recently COMPLETED LabInspection of the lab (by completed_at,
                                  tie-break created_at ASC) has outcome == FAIL AND >= 1 MAJOR finding
        open_high_incidents     = Incidents of lab with status REPORTED and severity == HIGH
        expired_training_count  = TrainingAssignments of lab with status == EXPIRED
        overstay_containers     = containers of lab with state == WASTE_TAGGED and (now - tagged_at) > 365 days
      evaluation order (first match wins):
        1. lab.status == DECOMMISSIONED            -> FROZEN
        2. overdue_ca_count >= 1                   -> FROZEN
        3. latest_failed_major                     -> FROZEN
        4. open_high_incidents >= 2                -> FROZEN
        5. open_ca_count >= 1                      -> RESTRICTED
        6. open_high_incidents == 1                -> RESTRICTED
        7. expired_training_count >= 1             -> RESTRICTED
        8. overstay_containers >= 1                -> RESTRICTED
        9. otherwise                               -> NORMAL
      Gates while FROZEN: POST /ehs/containers, POST /ehs/containers/{id}/tag-waste,
      POST /ehs/waste-pickup-requests, POST /ehs/waste-pickup-requests/{id}/submit
      all fail with ERR_LAB_FROZEN. Becoming FROZEN cascades: ACTIVE Registrations -> SUSPENDED,
      which recomputes access_blocked=true on matching controlled containers.
    input_set: "per-lab aggregates over CorrectiveAction, LabInspection, Incident, TrainingAssignment, ChemicalContainer"
    constants:
      CA_DUE_DAYS: { MAJOR: 14, MINOR: 30 }
      ACCUMULATION_MAX_DAYS: 365
    precision: "datetime comparisons at 1-second granularity; overstay is strictly greater than 365 days"

  - name: inspection_scoring
    trigger: "on POST /ehs/inspections/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      score_weighted = 100 - (20 * count(MAJOR findings)) - (5 * count(MINOR findings))
      score_flat     = 100 - (10 * count(all findings))
      outcome = PASS if score_weighted >= 70 else FAIL
      PASS boundary is inclusive: score_weighted == 70 is a PASS.
    input_set: "the findings array supplied at completion (may be empty -> both scores 100, outcome PASS)"
    constants:
      MAJOR_DEDUCTION: 20
      MINOR_DEDUCTION: 5
      FLAT_DEDUCTION: 10
      PASS_THRESHOLD: 70
    precision: "integer arithmetic; no rounding"
    variants:
      - name: severity_weighted
        when: "score_weighted and the authoritative outcome"
        difference: "deducts 20 per MAJOR and 5 per MINOR"
      - name: flat_count
        when: "score_flat (advisory alternate metric exposed on the same entity)"
        difference: "deducts a flat 10 per finding regardless of severity; identical findings can yield a different score and a different would-be outcome (e.g. 2 MAJOR + 1 MINOR: weighted 55 FAIL vs flat 70)"

  - name: accumulation_age_tracking
    trigger: "on tag-waste and on every clock-set sweep"
    algorithm: chronological
    formula: |
      for each container with state == WASTE_TAGGED:
        age_days = floor((now - tagged_at) / 86400)
        overstay(c) = age_days > ACCUMULATION_MAX_DAYS   # strictly greater; exactly 365 days is compliant
      area.has_overstay_containers = any linked container overstay
      feeds lab_posture_derivation input overstay_containers
    input_set: "containers with state == WASTE_TAGGED and tagged_at set"
    constants:
      ACCUMULATION_MAX_DAYS: 365
    precision: "day granularity via floor on whole days; boundary evaluated at 1-second precision before flooring"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: existence, check: "request body well-formed: required fields present, enum values in range, quantity_value > 0, capacity_containers > 0", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 3, category: auth, check: "role permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 4, category: auth, check: "ownership scope: PI acts only on own lab (X-User-ID == lab.pi_worker_id); inspector completes only assigned inspection; worker completes only own training (PI of the lab may also complete)", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "closeout, pickup create/submit, corrective-action submit, inspection complete, training complete" }
  - { priority: 5, category: existence, check: "referenced resources exist, validated left-to-right: path ids, then body FKs (lab_id, container_id, accumulation_area_id, worker_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "target resource state precondition for the requested transition", error_id: "ERR_LAB_STATE | ERR_CONTAINER_STATE | ERR_PICKUP_STATE | ERR_INSPECTION_STATE | ERR_CORRECTIVE_ACTION_STATE | ERR_REGISTRATION_STATE | ERR_TRAINING_STATE | ERR_INCIDENT_STATE", http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 7, category: business_safety, check: "lab.posture != FROZEN for gated mutations (container create, tag-waste, pickup create, pickup submit)", error_id: ERR_LAB_FROZEN, http_status: 409, applies_to: "POST /ehs/containers, POST /ehs/containers/{id}/tag-waste, POST /ehs/waste-pickup-requests, POST /ehs/waste-pickup-requests/{id}/submit" }
  - { priority: 8, category: business_safety, check: "container with hazard_class CONTROLLED_SUBSTANCE or SELECT_AGENT requires an ACTIVE Registration of matching material_type in the lab", error_id: ERR_CONTROLLED_MATERIAL_UNREGISTERED, http_status: 422, applies_to: "POST /ehs/containers" }
  - { priority: 9, category: business_safety, check: "acting worker holds a COMPLETED TrainingAssignment for the container's hazard_class in this lab", error_id: ERR_REQUIRED_TRAINING_INCOMPLETE, http_status: 422, applies_to: "POST /ehs/containers/{id}/tag-waste" }
  - { priority: 10, category: business_safety, check: "segregation of duties: verifying inspector X-User-ID != inspection.completed_by_inspector_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /ehs/corrective-actions/{id}/verify" }
  - { priority: 11, category: business_constraint, check: "barcode unique within lab", error_id: ERR_DUPLICATE_BARCODE, http_status: 409, applies_to: "POST /ehs/containers" }
  - { priority: 12, category: business_constraint, check: "at most one PI-role worker per lab", error_id: ERR_PI_ALREADY_ASSIGNED, http_status: 409, applies_to: "POST /ehs/workers" }
  - { priority: 13, category: business_constraint, check: "no second Registration with same (lab_id, material_type) while one is ACTIVE or SUSPENDED (a PENDING one is auto-SUPERSEDED instead)", error_id: ERR_DUPLICATE_ACTIVE_REGISTRATION, http_status: 409, applies_to: "POST /ehs/registrations" }
  - { priority: 14, category: business_constraint, check: "area.current_container_count < area.capacity_containers before tagging", error_id: ERR_AREA_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /ehs/containers/{id}/tag-waste" }
  - { priority: 15, category: business_constraint, check: "pickup submit requires >= 1 linked container", error_id: ERR_PICKUP_EMPTY, http_status: 422, applies_to: "POST /ehs/waste-pickup-requests/{id}/submit" }
  - { priority: 16, category: business_temporal, check: "window_end > window_start (strictly)", error_id: ERR_INVALID_WINDOW, http_status: 400, applies_to: "POST /ehs/inspections, POST /ehs/waste-pickup-requests/{id}/schedule" }
  - { priority: 17, category: business_temporal, check: "inspector half-open overlap: no other SCHEDULED inspection for the same inspector_id with (new_start < existing_end AND existing_start < new_end); touching endpoints allowed", error_id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /ehs/inspections" }
  - { priority: 18, category: business_temporal, check: "dock buffered overlap: no other SCHEDULED pickup at same dock_id unless the gap between windows is >= 30 minutes on both sides; exactly 30 minutes allowed", error_id: ERR_DOCK_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /ehs/waste-pickup-requests/{id}/schedule" }
  - { priority: 19, category: business_referential, check: "cross-lab references forbidden: area.lab_id == container.lab_id on tag-waste; container.lab_id == request.lab_id on add-item", error_id: ERR_CROSS_LAB_REFERENCE, http_status: 422, applies_to: "POST /ehs/containers/{id}/tag-waste, POST /ehs/waste-pickup-requests/{id}/add-item" }
  - { priority: 20, category: business_constraint, check: "decommission aggregate preconditions (no non-PICKED_UP containers, no open pickups/CAs/registrations/incidents)", error_id: ERR_DECOMMISSION_BLOCKED, http_status: 409, applies_to: "POST /ehs/labs/{id}/decommission" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/ehs/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Server startup default is 2026-08-01T00:00:00Z (never falls back to wall-clock). Sweep side effects: ASSIGNED TrainingAssignments with due_date < now become EXPIRED; accumulation overstay and all lab postures recomputed.", roles: [EHSAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["training expiry sweep", "posture recompute for all labs"] }

  - { method: POST, path: "/ehs/labs", description: "Create a lab (status ACTIVE, posture NORMAL)", roles: [EHSAdmin], code: 201, input: [name, department, building, room], output: Lab, side_effects: [] }
  - { method: GET, path: "/ehs/labs", description: "List labs with optional filters and pagination", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: ["posture?", "status?", "pi_worker_id?", "limit?", "offset?"], output: "Lab[]", side_effects: [] }
  - { method: GET, path: "/ehs/labs/{id}", description: "Get one lab incl. computed posture, hazard totals, permit flag", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: [], output: Lab, side_effects: [] }
  - { method: POST, path: "/ehs/labs/{id}/closeout", description: "Initiate closeout at PI departure (ACTIVE -> CLOSING); cancels SCHEDULED inspections", roles: [PrincipalInvestigator, EHSAdmin], code: 200, input: [], output: Lab, side_effects: ["cancel SCHEDULED LabInspections", "posture recompute", "increments Lab.version by 1"] }
  - { method: POST, path: "/ehs/labs/{id}/decommission", description: "Finalize decommissioning (CLOSING -> DECOMMISSIONED) with aggregate cleanliness preconditions", roles: [EHSAdmin], code: 200, input: [], output: Lab, side_effects: ["posture := FROZEN", "increments Lab.version by 1"] }

  - { method: POST, path: "/ehs/workers", description: "Add a worker to a lab; role_in_lab=PI auto-assigns lab.pi_worker_id (one PI max)", roles: [EHSAdmin, PrincipalInvestigator], code: 201, input: [lab_id, full_name, role_in_lab], output: LabWorker, side_effects: ["if role_in_lab == PI: lab.pi_worker_id := new worker id (increments Lab.version by 1)"] }
  - { method: GET, path: "/ehs/labs/{id}/workers", description: "List workers of a lab", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: ["limit?", "offset?"], output: "LabWorker[]", side_effects: [] }
  - { method: GET, path: "/ehs/workers/{id}", description: "Get one worker", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: [], output: LabWorker, side_effects: [] }

  - { method: POST, path: "/ehs/containers", description: "Register a barcoded container (state IN_USE); controlled classes need ACTIVE registration; gated by posture/status", roles: [PrincipalInvestigator, LabMember], code: 201, input: [lab_id, barcode, chemical_name, hazard_class, quantity_value, "quantity_unit?"], output: ChemicalContainer, side_effects: ["re-screen lab hazard totals", "posture recompute"] }
  - { method: GET, path: "/ehs/containers", description: "List containers with filters (covers FK reverse-reachability for lab_id, accumulation_area_id, pickup_request_id)", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: ["lab_id?", "accumulation_area_id?", "pickup_request_id?", "state?", "hazard_class?", "limit?", "offset?"], output: "ChemicalContainer[]", side_effects: [] }
  - { method: GET, path: "/ehs/containers/{id}", description: "Get one container", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: [], output: ChemicalContainer, side_effects: [] }
  - { method: POST, path: "/ehs/containers/{id}/tag-waste", description: "Tag container as waste into an accumulation area (IN_USE -> WASTE_TAGGED)", roles: [PrincipalInvestigator, LabMember], code: 200, input: [accumulation_area_id], output: ChemicalContainer, side_effects: ["area count +1", "tagged_at := now", "hazard re-screen", "posture recompute", "increments ChemicalContainer.version by 1"] }
  - { method: POST, path: "/ehs/containers/{id}/untag-waste", description: "Compensating action: return tagged container to inventory (WASTE_TAGGED -> IN_USE)", roles: [PrincipalInvestigator, LabMember], code: 200, input: [], output: ChemicalContainer, side_effects: ["area count -1", "clear area/tagged_at/pickup link", "hazard re-screen", "posture recompute", "increments ChemicalContainer.version by 1"] }

  - { method: POST, path: "/ehs/accumulation-areas", description: "Create a satellite/central accumulation area for a lab", roles: [EHSAdmin], code: 201, input: [lab_id, name, area_type, capacity_containers], output: AccumulationArea, side_effects: [] }
  - { method: GET, path: "/ehs/labs/{id}/accumulation-areas", description: "List accumulation areas of a lab", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: ["limit?", "offset?"], output: "AccumulationArea[]", side_effects: [] }

  - { method: POST, path: "/ehs/waste-pickup-requests", description: "Create a DRAFT waste pickup request for own lab (posture FROZEN blocks)", roles: [PrincipalInvestigator], code: 201, input: [lab_id], output: WastePickupRequest, side_effects: [] }
  - { method: GET, path: "/ehs/waste-pickup-requests", description: "List pickup requests with filters", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: ["lab_id?", "status?", "limit?", "offset?"], output: "WastePickupRequest[]", side_effects: [] }
  - { method: GET, path: "/ehs/waste-pickup-requests/{id}", description: "Get one pickup request incl. computed totals", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: [], output: WastePickupRequest, side_effects: [] }
  - { method: POST, path: "/ehs/waste-pickup-requests/{id}/add-item", description: "Link a WASTE_TAGGED container to a DRAFT or REJECTED request", roles: [PrincipalInvestigator, LabMember], code: 200, input: [container_id], output: WastePickupRequest, side_effects: ["container.pickup_request_id := request.id", "recompute estimated_quantity_total and estimated_cost", "increments WastePickupRequest.version by 1"] }
  - { method: POST, path: "/ehs/waste-pickup-requests/{id}/remove-item", description: "Compensating action: unlink a container from a DRAFT or REJECTED request", roles: [PrincipalInvestigator, LabMember], code: 200, input: [container_id], output: WastePickupRequest, side_effects: ["container.pickup_request_id := null", "recompute estimated_quantity_total and estimated_cost", "increments WastePickupRequest.version by 1"] }
  - { method: POST, path: "/ehs/waste-pickup-requests/{id}/submit", description: "Submit for EHS review (from DRAFT or REJECTED)", roles: [PrincipalInvestigator], code: 200, input: [], output: WastePickupRequest, side_effects: ["increments WastePickupRequest.version by 1"] }
  - { method: POST, path: "/ehs/waste-pickup-requests/{id}/reject", description: "Reject a SUBMITTED request with reason (items preserved for revision)", roles: [EHSAdmin], code: 200, input: [reason], output: WastePickupRequest, side_effects: ["rejection_reason stored", "increments WastePickupRequest.version by 1"] }
  - { method: POST, path: "/ehs/waste-pickup-requests/{id}/schedule", description: "Schedule a SUBMITTED request into a dock window (30-minute buffered overlap check)", roles: [EHSAdmin], code: 200, input: [dock_id, window_start, window_end], output: WastePickupRequest, side_effects: ["dock/window stored", "increments WastePickupRequest.version by 1"] }
  - { method: POST, path: "/ehs/waste-pickup-requests/{id}/complete", description: "Mark pickup executed; cascades containers to PICKED_UP and re-screens lab hazard totals", roles: [EHSAdmin], code: 200, input: [], output: WastePickupRequest, side_effects: ["cascade: linked containers WASTE_TAGGED -> PICKED_UP", "area counts recomputed", "hazard re-screen (permit flag may flip)", "posture recompute", "increments WastePickupRequest.version by 1"] }
  - { method: POST, path: "/ehs/waste-pickup-requests/{id}/cancel", description: "Cancel a SCHEDULED request; compensates by unlinking containers (they stay WASTE_TAGGED)", roles: [EHSAdmin], code: 200, input: [], output: WastePickupRequest, side_effects: ["container pickup_request_id := null for all linked", "increments WastePickupRequest.version by 1"] }

  - { method: POST, path: "/ehs/inspections", description: "Schedule a lab inspection for an inspector (half-open overlap check per inspector)", roles: [EHSAdmin], code: 201, input: [lab_id, inspector_id, scheduled_start, scheduled_end], output: LabInspection, side_effects: [] }
  - { method: GET, path: "/ehs/inspections", description: "List inspections with filters", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: ["lab_id?", "inspector_id?", "status?", "limit?", "offset?"], output: "LabInspection[]", side_effects: [] }
  - { method: GET, path: "/ehs/inspections/{id}", description: "Get one inspection incl. computed scores/outcome", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: [], output: LabInspection, side_effects: [] }
  - { method: POST, path: "/ehs/inspections/{id}/complete", description: "Complete with findings; computes scores/outcome, spawns one CorrectiveAction per finding, may cascade to FROZEN posture", roles: [EHSInspector], code: 200, input: [findings], output: LabInspection, side_effects: ["inspection_scoring", "create CorrectiveAction per finding (OPEN, due +14d/+30d)", "posture recompute; if FROZEN: cascade suspends ACTIVE registrations -> containers access_blocked", "increments LabInspection.version by 1"] }

  - { method: GET, path: "/ehs/labs/{id}/corrective-actions", description: "List corrective actions of a lab", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: ["status?", "limit?", "offset?"], output: "CorrectiveAction[]", side_effects: [] }
  - { method: GET, path: "/ehs/inspections/{id}/corrective-actions", description: "List corrective actions spawned by one inspection", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: ["limit?", "offset?"], output: "CorrectiveAction[]", side_effects: [] }
  - { method: POST, path: "/ehs/corrective-actions/{id}/submit", description: "PI submits remediation evidence (OPEN or REOPENED -> SUBMITTED)", roles: [PrincipalInvestigator], code: 200, input: [resolution_note], output: CorrectiveAction, side_effects: ["posture recompute", "increments CorrectiveAction.version by 1"] }
  - { method: POST, path: "/ehs/corrective-actions/{id}/verify", description: "Inspector verifies (decision=APPROVE -> VERIFIED, REJECT -> REOPENED); verifying inspector must differ from completing inspector (SoD)", roles: [EHSInspector], code: 200, input: [decision], output: CorrectiveAction, side_effects: ["posture recompute", "increments CorrectiveAction.version by 1"] }

  - { method: POST, path: "/ehs/training-assignments", description: "Assign hazard-class training to a worker with a due date", roles: [EHSAdmin, PrincipalInvestigator], code: 201, input: [lab_id, worker_id, hazard_class, due_date], output: TrainingAssignment, side_effects: [] }
  - { method: GET, path: "/ehs/labs/{id}/training-assignments", description: "List training assignments of a lab", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: ["status?", "limit?", "offset?"], output: "TrainingAssignment[]", side_effects: [] }
  - { method: GET, path: "/ehs/workers/{id}/training-assignments", description: "List training assignments of a worker", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: ["status?", "limit?", "offset?"], output: "TrainingAssignment[]", side_effects: [] }
  - { method: POST, path: "/ehs/training-assignments/{id}/complete", description: "Worker (or lab PI) marks assigned training complete", roles: [LabMember, PrincipalInvestigator], code: 200, input: [], output: TrainingAssignment, side_effects: ["completed_at := now", "posture recompute", "increments TrainingAssignment.version by 1"] }

  - { method: POST, path: "/ehs/incidents", description: "Report a spill/incident/near-miss for a lab", roles: [LabMember, PrincipalInvestigator, EHSAdmin], code: 201, input: [lab_id, title, description, severity, "near_miss?"], output: Incident, side_effects: ["posture recompute (HIGH open incidents input)"] }
  - { method: GET, path: "/ehs/labs/{id}/incidents", description: "List incidents of a lab", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: ["status?", "severity?", "limit?", "offset?"], output: "Incident[]", side_effects: [] }
  - { method: POST, path: "/ehs/incidents/{id}/close", description: "Close a reported incident with a resolution", roles: [EHSAdmin], code: 200, input: [resolution], output: Incident, side_effects: ["posture recompute", "increments Incident.version by 1"] }

  - { method: POST, path: "/ehs/registrations", description: "Create a controlled-substance/select-agent registration (PENDING). OCC: expected_lab_version must match Lab.version; supersedes any PENDING same-type registration; error if an ACTIVE/SUSPENDED same-type registration exists.", roles: [PrincipalInvestigator, EHSAdmin], code: 201, input: [lab_id, material_type, registration_number, expected_lab_version], output: Registration, side_effects: ["supersede prior PENDING same-type registration (-> SUPERSEDED)", "increments Lab.version by 1"] }
  - { method: GET, path: "/ehs/labs/{id}/registrations", description: "List registrations of a lab", roles: [EHSAdmin, EHSInspector, PrincipalInvestigator, LabMember], code: 200, input: ["status?", "limit?", "offset?"], output: "Registration[]", side_effects: [] }
  - { method: POST, path: "/ehs/registrations/{id}/activate", description: "Activate a PENDING registration or reinstate a SUSPENDED one", roles: [EHSAdmin], code: 200, input: [], output: Registration, side_effects: ["recompute access_blocked for matching containers (-> false)", "increments Registration.version by 1"] }
  - { method: POST, path: "/ehs/registrations/{id}/suspend", description: "Suspend an ACTIVE registration", roles: [EHSAdmin], code: 200, input: [], output: Registration, side_effects: ["recompute access_blocked for matching containers (-> true)", "increments Registration.version by 1"] }
  - { method: POST, path: "/ehs/registrations/{id}/surrender", description: "Surrender an ACTIVE or SUSPENDED registration (terminal; required before decommission)", roles: [EHSAdmin], code: 200, input: [], output: Registration, side_effects: ["recompute access_blocked for matching containers (-> true)", "increments Registration.version by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, enum value out of range, quantity_value <= 0, capacity_containers <= 0" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not in endpoint's allowed roles" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "ownership scope violated (PI not the lab's PI; inspector not assigned; worker completing another worker's training)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "referenced resource id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_lab_version does not match current Lab.version on registration create (OCC)" }
  - { id: ERR_LAB_STATE, http: 409, condition: "lab not in required status (e.g., container create requires ACTIVE; closeout requires ACTIVE; decommission requires CLOSING)" }
  - { id: ERR_CONTAINER_STATE, http: 409, condition: "container not in required state (tag requires IN_USE; untag requires WASTE_TAGGED and no link to a non-terminal pickup)" }
  - { id: ERR_PICKUP_STATE, http: 409, condition: "pickup request not in required status for the transition" }
  - { id: ERR_INSPECTION_STATE, http: 409, condition: "inspection not SCHEDULED on complete" }
  - { id: ERR_CORRECTIVE_ACTION_STATE, http: 409, condition: "corrective action not in required status (submit needs OPEN/REOPENED; verify needs SUBMITTED)" }
  - { id: ERR_REGISTRATION_STATE, http: 409, condition: "registration not in required status for activate/suspend/surrender" }
  - { id: ERR_TRAINING_STATE, http: 409, condition: "training assignment not ASSIGNED on complete" }
  - { id: ERR_INCIDENT_STATE, http: 409, condition: "incident not REPORTED on close" }
  - { id: ERR_LAB_FROZEN, http: 409, condition: "lab.posture == FROZEN blocks container create, tag-waste, pickup create, pickup submit" }
  - { id: ERR_CONTROLLED_MATERIAL_UNREGISTERED, http: 422, condition: "creating CONTROLLED_SUBSTANCE/SELECT_AGENT container without ACTIVE registration of matching material_type" }
  - { id: ERR_REQUIRED_TRAINING_INCOMPLETE, http: 422, condition: "acting worker lacks COMPLETED training for the container's hazard_class on tag-waste" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "verifying inspector is the same X-User-ID that completed the parent inspection" }
  - { id: ERR_DUPLICATE_BARCODE, http: 409, condition: "barcode already exists within the lab" }
  - { id: ERR_PI_ALREADY_ASSIGNED, http: 409, condition: "lab already has a PI-role worker" }
  - { id: ERR_DUPLICATE_ACTIVE_REGISTRATION, http: 409, condition: "an ACTIVE or SUSPENDED registration of the same (lab_id, material_type) already exists" }
  - { id: ERR_AREA_CAPACITY_EXCEEDED, http: 409, condition: "tagging would exceed area.capacity_containers" }
  - { id: ERR_PICKUP_EMPTY, http: 422, condition: "submitting a pickup request with zero linked containers" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "window_end <= window_start" }
  - { id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http: 409, condition: "half-open overlap with another SCHEDULED inspection for the same inspector" }
  - { id: ERR_DOCK_WINDOW_CONFLICT, http: 409, condition: "dock window violates the 30-minute buffer against another SCHEDULED pickup at the same dock" }
  - { id: ERR_CROSS_LAB_REFERENCE, http: 422, condition: "referenced child resource belongs to a different lab" }
  - { id: ERR_DECOMMISSION_BLOCKED, http: 409, condition: "decommission preconditions unmet (non-PICKED_UP containers, open pickups/CAs/registrations/incidents remain)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EHSAdmin
    description: "University EHS office administrator; platform-level operator with override power over scheduling, verification workflow setup, and decommissioning"
    identity: opaque
    exclusive_operations:
      - "create labs, accumulation areas; schedule inspections"
      - "reject/schedule/complete/cancel waste pickup requests"
      - "activate/suspend/surrender registrations"
      - "decommission labs; close incidents; set logical clock"
    shared_operations:
      - "read any resource"
      - "create workers and training assignments"
      - "report incidents"
  - name: EHSInspector
    description: "Field inspector who performs assigned inspections and verifies corrective actions; cannot verify an inspection they completed (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "complete an assigned inspection with findings"
      - "verify or reject submitted corrective actions"
    shared_operations: ["read any resource"]
  - name: PrincipalInvestigator
    description: "Lab PI; owns the lab's compliance workflow (closeout, pickup submission, corrective-action response)"
    identity: "entity_backed:LabWorker"
    exclusive_operations:
      - "initiate closeout of own lab"
      - "create and submit waste pickup requests for own lab"
      - "submit corrective actions for own lab"
    shared_operations:
      - "create/tag/untag containers; add/remove pickup items"
      - "create workers, training assignments; report incidents; complete training; read lab resources"
  - name: LabMember
    description: "Lab worker (researcher/student); handles day-to-day container and waste operations"
    identity: "entity_backed:LabWorker"
    exclusive_operations: []
    shared_operations:
      - "create/tag/untag containers; add/remove pickup items"
      - "report incidents; complete own training; read lab resources"
