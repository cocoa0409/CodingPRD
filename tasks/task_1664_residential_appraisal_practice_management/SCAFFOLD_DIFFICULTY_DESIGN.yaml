  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_buffer_expanded_overlap_semantics
        grounds:
          - state_machines.Appointment.PROPOSED_to_CONFIRMED
          - validations[priority=9]
          - errors[ERR_APPOINTMENT_OVERLAP]
        distinguishing_aspect: |
          Resource: Appraiser (schedule capacity). Interval semantics:
          buffer-expanded half-open — each CONFIRMED window occupies
          [start-30min, end+30min); a window starting at 10:30 after a
          09:00-10:00 appointment conflicts (buffered intervals intersect),
          while 11:00 is exactly buffer-to-buffer adjacency and is allowed.
        test_recipe:
          setup:
            - "Inspection order ASSIGNED to appraiser A; one CONFIRMED appointment 2026-08-02 09:00-10:00"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "AMC Eighteen", client_type: AMC, contact_email: "ops@amc18.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 45000, rush_multiplier_bps: 1500, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "Ann Appraiser", license_level: CERTIFIED_RESIDENTIAL, license_number: "CR-1001", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { a_id: $.data.id }
            - call: "POST /appraisal/panel-memberships"
              payload: { client_id: "${c_id}", appraiser_id: "${a_id}" }
              as: FirmAdmin
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "10 Oak Ave", property_type: SFR, estimated_value_cents: 45000000, loan_type: CONVENTIONAL, requested_turn_days: 14 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /appraisal/orders/${o_id}/determine-scope", payload: {}, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/accept", payload: {}, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/assign", payload: { appraiser_id: "${a_id}" }, as: FirmAdmin }
            - call: "POST /appraisal/appointments"
              payload: { order_id: "${o_id}", appraiser_id: "${a_id}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T10:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { ap1: $.data.id }
            - { call: "POST /appraisal/appointments/${ap1}/confirm", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "POST /appraisal/appointments"
              payload: { order_id: "${o_id}", appraiser_id: "${a_id}", window_start: "2026-08-02T10:30:00Z", window_end: "2026-08-02T11:30:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { ap2: $.data.id }
            - call: "POST /appraisal/appointments"
              payload: { order_id: "${o_id}", appraiser_id: "${a_id}", window_start: "2026-08-02T11:00:00Z", window_end: "2026-08-02T12:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { ap3: $.data.id }
          trigger:
            - call: "POST /appraisal/appointments/${ap2}/confirm"
              payload: {}
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
            - call: "POST /appraisal/appointments/${ap3}/confirm"
              payload: {}
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { ap3_status: $.data.status }
          assert:
            - "10:30 start conflicts: error_id == ERR_APPOINTMENT_OVERLAP (buffered [10:00,12:00) intersects [08:30,10:30); captured ${err})"
            - "11:00 start allowed: status CONFIRMED — buffers exactly touch ([08:30,10:30) vs [10:30,12:30) empty intersection; captured ${ap3_status})"

      - name: fee_schedule_half_open_window_adjacency_vs_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_SCHEDULE_WINDOW_OVERLAP]
          - concurrency_rules[fee-schedule-create-stale-client]
          - entities.FeeSchedule.fields.effective_to
        distinguishing_aspect: |
          Resource: the (client, tier) fee-window timeline — pure half-open
          [effective_from, effective_to) with NO buffer (different semantics
          from the appointment rule): effective_from exactly equal to the prior
          window's effective_to is legal adjacency, while a from-date inside
          the prior window is ERR_SCHEDULE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Client with STANDARD schedule A [2026-07-01, 2026-08-01); version threaded via GET before each create"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "AMC Nineteen", client_type: AMC, contact_email: "ops@amc19.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 40000, rush_multiplier_bps: 1000, revision_fee_cents: 12000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
              captures: { fs_a: $.data.id }
            - call: "GET /appraisal/clients/${c_id}"
              as: FirmAdmin
              captures: { c_v2: $.data.version }
          trigger:
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 52000, rush_multiplier_bps: 1000, revision_fee_cents: 12000, effective_from: "2026-08-01T00:00:00Z", expected_client_version: "${c_v2}" }
              as: FirmAdmin
              captures: { fs_b: $.data.id }
            - call: "GET /appraisal/clients/${c_id}"
              as: FirmAdmin
              captures: { c_v3: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 60000, rush_multiplier_bps: 1000, revision_fee_cents: 12000, effective_from: "2026-07-15T00:00:00Z", expected_client_version: "${c_v3}" }
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent window B [2026-08-01, open) created (== A.effective_to, half-open touch is not overlap; captured ${fs_b})"
            - "Overlapping window C from 2026-07-15 rejected: error_id == ERR_SCHEDULE_WINDOW_OVERLAP (captured ${err})"

  - rule_id: compensating_invariant
    instances:
      - name: appointment_confirm_then_cancel_preserves_committed_minutes
        grounds:
          - calculations.turn_time_scorecard
          - state_machines.Appointment.PROPOSED_to_CONFIRMED
          - state_machines.Appointment.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: schedule minutes. confirmed_minutes = sum over
          CONFIRMED appointments of (window_end - window_start); the forward
          action (confirm of a 90-minute window) moves it 0 -> 90 and the
          compensating action (cancel) returns it to exactly 0 — no drift.
        test_recipe:
          setup:
            - "Inspection order ASSIGNED to appraiser A; scorecard confirmed_minutes baseline 0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "AMC Twenty", client_type: AMC, contact_email: "ops@amc20.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 45000, rush_multiplier_bps: 1500, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "Ann Appraiser", license_level: CERTIFIED_RESIDENTIAL, license_number: "CR-1001", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { a_id: $.data.id }
            - call: "POST /appraisal/panel-memberships"
              payload: { client_id: "${c_id}", appraiser_id: "${a_id}" }
              as: FirmAdmin
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "10 Oak Ave", property_type: SFR, estimated_value_cents: 45000000, loan_type: CONVENTIONAL, requested_turn_days: 14 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /appraisal/orders/${o_id}/determine-scope", payload: {}, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/accept", payload: {}, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/assign", payload: { appraiser_id: "${a_id}" }, as: FirmAdmin }
            - call: "GET /appraisal/appraisers/${a_id}/scorecard"
              as: FirmAdmin
              captures: { m0: $.data.confirmed_minutes }
            - call: "POST /appraisal/appointments"
              payload: { order_id: "${o_id}", appraiser_id: "${a_id}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T10:30:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { ap_id: $.data.id }
          trigger:
            - { call: "POST /appraisal/appointments/${ap_id}/confirm", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "GET /appraisal/appraisers/${a_id}/scorecard"
              as: FirmAdmin
              captures: { m1: $.data.confirmed_minutes }
            - { call: "POST /appraisal/appointments/${ap_id}/cancel", payload: {}, as: FirmAdmin }
            - call: "GET /appraisal/appraisers/${a_id}/scorecard"
              as: FirmAdmin
              captures: { m2: $.data.confirmed_minutes }
          assert:
            - "baseline confirmed_minutes == 0 (captured ${m0})"
            - "after confirm: confirmed_minutes == 90 (captured ${m1})"
            - "after cancel: confirmed_minutes == 0 — forward + compensating action conserve the committed-minutes invariant (captured ${m2})"

      - name: revision_fee_accept_then_equal_waiver_preserves_fee_current
        grounds:
          - state_machines.RevisionRequest.OPEN_to_ACCEPTED
          - entities.AppraisalOrder.fields.fee_current_cents
          - validations[priority=11]
        distinguishing_aspect: |
          Conserved quantity: order fee cents. Accepting a revision request
          adds the schedule's revision fee (45000 -> 60000 with
          revision_fees_collected_cents == 15000); a compensating WAIVER fee
          adjustment of the same 15000 returns fee_current_cents to exactly
