            - "GET /shipments/${p1}/accessorials returns total_count == 1 with the single row id ${ac1} and shipment_id ${p1}"
            - "GET /shipments/${p2}/accessorials returns total_count == 0 — the sibling's MANUAL charge never leaks across the FK"
            - "GET /shipments/${p2}/scans returns total_count == 0 while ${p1} owns scan ${scan1}"
            - "GET /invoices with shipper_id ${sh} returns total_count == 1 and Invoice.${inv}.line_count == 2 with transportation_subtotal_cents == 5320 (2 x 2660) and accessorial_subtotal_cents == 2200"

  # =====================================================================
  # SECTION 2 — STATE MACHINES (§1.2)
  # =====================================================================
  - section: state_machines
    instances:
      - name: every_entity_is_born_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.ShipperAccount.status
          - state_machines.RateContract.status
          - state_machines.SurchargeWindow.status
          - state_machines.Shipment.measurement_status
          - state_machines.Shipment.movement_status
          - state_machines.Shipment.billing_status
          - state_machines.Invoice.status
          - state_machines.BillingAdjustment.status
          - state_machines.Dispute.status
        distinguishing_aspect: |
          Creation never skips ahead: a fresh ShipperAccount is ACTIVE, a fresh RateContract
          is DRAFT (not ACTIVE), a fresh SurchargeWindow is SCHEDULED (not ACTIVE), a fresh
          Shipment is PENDING_SCAN / IN_TRANSIT / UNBILLED on its three independent axes, a
          swept Invoice is OPEN, a proposed BillingAdjustment is PROPOSED and a filed Dispute
          is SUBMITTED with round_count 0.
        test_recipe:
          setup:
            - "Empty database. The logical clock reads 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version, sh_status: $.data.status }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id, c1_status: $.data.status }
            - call: "POST /surcharge-windows"
              payload: { code: "DEM-AUG", kind: "DEMAND", start_date: "2026-08-01", end_date: "2026-08-15", per_package_cents: 150 }
              as: CarrierAdmin
              captures: { w1: $.data.id, w1_status: $.data.status }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-N-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
            - call: "POST /shipments/${p}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id, inv_status: $.data.status }
            - call: "POST /invoices/${inv}/issue"
              payload: {}
              as: BillingOps
              captures: { inv_v: $.data.version }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv}" }
              as: BillingOps
              captures: { line: "$.data[0].id" }
            - call: "POST /billing-adjustments"
              payload: { invoice_line_id: "${line}", reason: "MANUAL", delta_cents: -100, expected_invoice_version: "${inv_v}" }
              as: BillingOps
              as_user_id: "billing.one"
              captures: { adj: $.data.id, adj_status: $.data.status }
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line}", claim_type: "WEIGHT", claimed_reason: "billed weight looks wrong" }
              as: ShipperUser
              as_user_id: "${sh}"
              captures: { dsp: $.data.id, dsp_status: $.data.status }
          assert:
            - "${sh_status} == ACTIVE — a new shipper is immediately usable"
            - "${c1_status} == DRAFT with activated_at null — creation alone never activates a contract"
            - "${w1_status} == SCHEDULED — a window must be activated before it prices anything"
            - "Shipment.${p} was created with measurement_status PENDING_SCAN, movement_status IN_TRANSIT and billing_status UNBILLED — three independent axes, each at its own initial state"
            - "${inv_status} == OPEN — the sweep creates an OPEN invoice, never an ISSUED one"
            - "${adj_status} == PROPOSED with applied_by_user_id null and applied_at null"
            - "${dsp_status} == SUBMITTED with round_count == 0, accepted_evidence_count == 0, granted_credit_cents == 0, required_item_type null and resolved_at null"
            - "Invoice.${inv}.pending_adjustment_count == 1 and has_pending_adjustments == true — the PROPOSED adjustment is already counted even though no money has moved"

      - name: activating_a_scheduled_window_admits_it_to_the_pricing_set
        claim_type: valid_transition
        grounds:
          - state_machines.SurchargeWindow.SCHEDULED_to_ACTIVE
          - calculations.transportation_charge
        distinguishing_aspect: |
          The SCHEDULED -> ACTIVE transition is what admits a window to the surcharge
          candidate set: the same billing preview reads 2660 while the window is SCHEDULED
          and 2810 immediately after activation, with no change to the parcel itself.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
            - "Shipment 1Z-W-0001 (12 x 10 x 8 in, 6.0 lb, zone 2, non-residential) is IN_TRANSIT with pickup_date 2026-08-01: cube 960, dim weight 7 lb, billable 7 lb DIMENSIONAL, rate 380 -> transportation 2660."
            - "A DEMAND window DEM-AUG covering [2026-08-01, 2026-08-15) at 150 per package has been created but NOT activated."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /surcharge-windows"
              payload: { code: "DEM-AUG", kind: "DEMAND", start_date: "2026-08-01", end_date: "2026-08-15", per_package_cents: 150 }
              as: CarrierAdmin
              captures: { w1: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-W-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
          trigger:
            - call: "GET /shipments/${p}/billing-preview"
              payload: {}
              as: BillingOps
              captures: { before: $.data.line_total_cents }
            - call: "POST /surcharge-windows/${w1}/activate"
              payload: {}
              as: CarrierAdmin
              captures: { w1_status: $.data.status, w1_v: $.data.version }
            - call: "GET /shipments/${p}/billing-preview"
              payload: {}
              as: BillingOps
              captures: { after: $.data.line_total_cents }
          assert:
            - "${before} == 2660 with surcharge_cents == 0 — a SCHEDULED window prices nothing"
            - "The activate call returns HTTP 200 with ${w1_status} == ACTIVE and ${w1_v} == 2"
            - "${after} == 2810 with surcharge_cents == 150 and transportation_base_cents still 2660"
            - "GET /surcharge-windows with kind DEMAND and status ACTIVE returns total_count == 1"

      - name: delivering_a_refused_parcel_is_blocked_by_the_movement_precondition
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Shipment.movement_status.IN_TRANSIT_to_REFUSED
          - validations[priority=24]  # ERR_SHIPMENT_NOT_IN_TRANSIT
        distinguishing_aspect: |
          movement_status IN_TRANSIT is a hard precondition shared by deliver and exceptions:
          once a parcel is REFUSED, both POST deliver and a second POST exceptions return 409
          ERR_SHIPMENT_NOT_IN_TRANSIT, and no delivered_at is ever stamped.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 and ServiceLevel EXPRESS."
            - "Shipment 1Z-X-0001 (12 x 10 x 8 in, 6.0 lb, zone 2) has been refused by the consignee, so movement_status == REFUSED."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
