              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${pa_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${pa_id}"
              captures: { ta_id: $.data.id }
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${pb_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${pb_id}"
              captures: { tb_tk_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GuestPatron
              as_user_id: "${pb_id}"
              captures: { tb_v_shared: $.data.version }
            - call: "POST /tickets/${ta_id}/confirm"
              payload: { expected_time_block_version: "${tb_v_shared}" }
              as: GuestPatron
              as_user_id: "${pa_id}"
          trigger:
            - call: "POST /tickets/${tb_tk_id}/confirm"
              payload: { expected_time_block_version: "${tb_v_shared}" }
              as: GuestPatron
              as_user_id: "${pb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response error_id == ERR_STALE_VERSION"
            - "SessionTicket.${tb_tk_id}.lifecycle_state == RESERVED"

      - name: group_hold_stale_block_version_already_listed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[group-hold-stale-lane-block]
        excluded_because:
          difficulty_instance: dual_variant_calc / group_deposit_shared_floor_vs_exclusive_flat
          rationale: "The group-hold OCC write_endpoint and version bump are exercised by the dual-variant group_deposit chain, which holds two reservations sequentially re-reading the block version between holds; an explicit stale-version negative re-uses the same write_endpoint and is structurally identical to the confirm OCC instance above."

      - name: capacity_remaining_reconciled_after_confirm_and_refund
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Park.fields.total_capacity_remaining
          - entities.TimeBlock.fields.committed_rider_count
        distinguishing_aspect: "Park.total_capacity_remaining reconciles down by 1 after a confirm and back up by 1 after a refund: with one OPEN lane cap 5, remaining goes 5 -> 4 -> 5 across confirm then refund."
        test_recipe:
          setup:
