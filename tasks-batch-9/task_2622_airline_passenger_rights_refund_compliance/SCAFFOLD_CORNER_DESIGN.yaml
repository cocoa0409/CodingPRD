              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ900", origin_iata: "ORD", destination_iata: "LHR", is_international: true, scheduled_departure_utc: "2026-08-10T18:00:00Z", scheduled_arrival_utc: "2026-08-11T08:00:00Z", segment_fare_cents: 90000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg1_id: "$.data.id" }
            - call: "POST /compliance/checked-bags"
              payload: { booking_id: "${bk_id}", tag_number: "BAG0000001", fee_cents: 4500, checked_at_utc: "2026-08-10T16:00:00Z", scheduled_delivery_utc: "2026-08-11T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bag_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/checked-bags/${bag_id}/resolve"
              payload: { resolution: "DELIVERED", delivered_at_utc: "2026-08-12T14:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
          assert:
            - "Booking.${bk_id}.itinerary_scope == INTERNATIONAL"
            - "CheckedBag.${bag_id}.delivery_delay_hours == 29.0"
            - "CheckedBag.${bag_id}.status == DELIVERED_ON_TIME"
            - "CheckedBag.${bag_id}.fee_refund_obligated == false"
            - "GET /compliance/refund-obligations with booking_id = ${bk_id} returns total_count == 0"
            - "Booking.${bk_id}.total_refund_obligated_cents == 0 and Booking.${bk_id}.collected_total_cents == 94500"

      - name: bag_delay_just_below_domestic_threshold_stays_on_time
        claim_type: threshold
        grounds: ["calculations.baggage_delivery_delay.precision", "entities.PolicyProfile.bag_delay_threshold_hours_domestic"]
        distinguishing_aspect: "11 h 59 min rounds to 11.98 hours, one hundredth below the 12.00 h domestic threshold, so the `>=` comparison fails and the bag resolves DELIVERED_ON_TIME with no obligation — the adjacent 12.00 h case is the LATE branch."
        test_recipe:
