          - calculations.facility_exposure_ledger
          - calculations.issuance_charges
          - entities.FacilityAllocation.fields.basis
          - entities.CreditFacility.fields.suspended_reason
        distinguishing_aspect: |
          DEPTH 4, triggered by POST /credits/{id}/issue: hop 1 inserts the
          FacilityAllocation row, hop 2 is caused by hop 1 because the ledger sums OPEN
          allocation rows, hop 3 is caused by hop 2 because the recomputed
          allocated_cents 95066500 reaches restrict_threshold_cents 95000000, and hop 4
          is caused by hop 3 because only a facility that has just flipped to SUSPENDED
          holds its APPROVED siblings. Removing any single hop leaves the next one
          unreachable.
