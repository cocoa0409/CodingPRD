            - "Loop 2 created at 11:02:10Z (while the store is still TIER_1, so it pins 235): greet 11:02:30Z, order-complete 11:03:00Z, window-arrive 11:03:20Z."
            - "The trigger departs loop 2 at 11:04:20Z; both departs then sit inside the trailing window (11:04:20Z minus 600 seconds = 10:54:20Z)."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
