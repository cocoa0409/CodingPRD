        grounds: ["errors[ERR_OPERATOR_DELINQUENT]"]
        excluded_because:
          difficulty_instance: deployment_create_referential_delinquency_beats_fiscal_allocation_error
          rationale: "Triggered by the delinquent-operator deployment create in the named §1.8 instance."
      - name: err_fishery_not_active_corner
