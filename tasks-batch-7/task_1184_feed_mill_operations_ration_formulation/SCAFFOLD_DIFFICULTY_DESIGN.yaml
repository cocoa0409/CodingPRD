            - "error_id != ERR_FLUSH_REQUIRED even though line.contamination == MEDICATED and the batch is non-medicated (priority 7 gate never reached)"
            - "Batch.${bats_id}.status == CANCELLED (unchanged)"

      - name: confirm_medicated_without_permit_and_over_credit_safety_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_MEDICATED_PERMIT_REQUIRED]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal: the customer lacks a medicated permit
          (safety, priority 7) AND the 35212-cent quote would exceed the 1000-cent limit (fiscal,
          priority 10). ERR_MEDICATED_PERMIT_REQUIRED must win. Different category pair from the
          state/safety instance.
        test_recipe:
          setup:
            - "F-MED ACTIVE (med70/SBM30, medicated); customer has NO medicated_permit_ref and credit_limit_cents 1000"
            - "Order of 1 ton QUOTED at 35212 cents"
