scaffold_difficulty_design:

  # ================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rental_estimate_vs_actual_proration
        grounds:
          - calculations.recurring_rental_amount
          - state_machines.RecurringRental.PENDING_to_ACTIVE
          - entities.RecurringRental.fields.estimated_amount_cents
          - entities.RecurringRental.fields.actual_amount_cents
        distinguishing_aspect: |
          On the Node/RecurringRental domain the estimate variant prorates from decided_at
          (2026-07-15 -> 12575c) while the actual variant prorates from the activation clock
          (2026-08-20 -> 9912c); the same node yields two different rental amounts.
        test_recipe:
          setup:
            - "Applicant with signed master agreement; one EXISTING_UTILITY structure (max 2) in a non-historic segment."
            - "A single COLLOCATION node, submitted 2026-06-01, granted 2026-07-15, invoice paid, inspection PASS, activated 2026-08-20."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme Wireless", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2, location_desc: "Pole A", in_design_district: "NONE" }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "Main St", corridor_code: "C-1", in_historic_district: false }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: { project_name: "P1" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { node_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/completeness-review"
              payload: { complete: true }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "GET /support-structures/${ss_id}"
              payload: {}
              as: ROWReviewer
              as_user_id: "rowrev-1"
              captures: { ss_ver: $.data.version }
            - call: "POST /nodes/${node_id}/design-review"
              payload: { outcome: "PASS", expected_support_structure_version: "${ss_ver}" }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_id}/decision"
              payload: {}
              as: Approver
              as_user_id: "approver-1"
            - call: "GET /applications/${app_id}/fee-invoice"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { invoice_id: "$.data[0].id", inv_ver: "$.data[0].version" }
            - call: "POST /fee-invoices/${invoice_id}/payments"
              payload: { amount_cents: 51454, expected_fee_invoice_version: "${inv_ver}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /nodes/${node_id}/inspection"
              payload: { outcome: "PASS" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nodes/${node_id}/activate"
              payload: {}
              as: Inspector
              as_user_id: "insp-1"
          assert:
            - "The node's RecurringRental.estimated_amount_cents == 12575"
            - "The node's RecurringRental.actual_amount_cents == 9912"
            - "The node's RecurringRental.status == ACTIVE"

      - name: application_fee_provisional_vs_final
        grounds:
          - calculations.application_fee
          - state_machines.PermitApplication.UNDER_REVIEW_to_PARTIALLY_GRANTED
          - entities.FeeInvoice.fields.assessed_amount_cents
          - entities.FeeInvoice.fields.fee_variant
        distinguishing_aspect: |
          On the FeeInvoice/Application domain the provisional variant counts all 3 filed nodes
          (2 COLLOCATION + 1 NEW_POLE -> 205817c) while the final variant counts only the 2
          PERMITTED nodes after the NEW_POLE node is rejected (-> 102908c).
        test_recipe:
          setup:
            - "3-node batch: 2 COLLOCATION on an EXISTING structure (max 2) and 1 NEW_POLE on a NEW_POLE structure (max 1)."
            - "Submitted 2026-06-01 (provisional fee 205817). Both COLLOCATION nodes design-PASS; the NEW_POLE node design-FAILs -> REJECTED. Partially granted."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Beta Telecom", contact_email: "n@beta.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2, in_design_district: "NONE" }
              as: PlatformAdmin
              captures: { ss_col_id: $.data.id }
            - call: "POST /support-structures"
              payload: { structure_type: "NEW_POLE", max_collocations: 1, in_design_district: "NONE" }
              as: PlatformAdmin
              captures: { ss_np_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "Elm St", corridor_code: "C-2", in_historic_district: false }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: { project_name: "P2" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_col_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { n1: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_col_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { n2: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "NEW_POLE", support_structure_id: "${ss_np_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2029-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { n3: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/completeness-review"
              payload: { complete: true }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "GET /support-structures/${ss_col_id}"
              payload: {}
              as: ROWReviewer
              as_user_id: "rowrev-1"
              captures: { col_ver0: $.data.version }
            - call: "POST /nodes/${n1}/design-review"
              payload: { outcome: "PASS", expected_support_structure_version: "${col_ver0}" }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "GET /support-structures/${ss_col_id}"
              payload: {}
              as: ROWReviewer
              as_user_id: "rowrev-1"
              captures: { col_ver1: $.data.version }
            - call: "POST /nodes/${n2}/design-review"
              payload: { outcome: "PASS", expected_support_structure_version: "${col_ver1}" }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "GET /support-structures/${ss_np_id}"
              payload: {}
              as: ROWReviewer
              as_user_id: "rowrev-1"
              captures: { np_ver0: $.data.version }
            - call: "POST /nodes/${n3}/design-review"
              payload: { outcome: "FAIL", expected_support_structure_version: "${np_ver0}" }
              as: ROWReviewer
              as_user_id: "rowrev-1"
          trigger:
            - call: "POST /applications/${app_id}/decision"
              payload: {}
              as: Approver
              as_user_id: "approver-1"
          assert:
            - "PermitApplication.status == PARTIALLY_GRANTED"
            - "FeeInvoice.fee_variant == FINAL"
            - "FeeInvoice.assessed_amount_cents == 102908"
            - "The provisional assessed_amount_cents observed at submit was 205817 (differs from the final 102908)"

  # ================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: shot_clock_base_days_conditional_max
        grounds:
          - calculations.application_shot_clock_deadline
          - entities.PermitApplication.fields.shot_clock_base_days
          - state_machines.PermitApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a): base_days is a conditional max over child facility_type (90 if ANY node is
          NEW_POLE else 60) combined with submitted_at and toll_days; a 2xCOLLOCATION+1xNEW_POLE
          batch submitted 2026-06-01 yields base 90 and deadline 2026-08-30T00:00:00.000Z.
        test_recipe:
          setup:
            - "3-node batch (2 COLLOCATION + 1 NEW_POLE) submitted at clock 2026-06-01."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Gamma Mobile", contact_email: "g@gamma.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2, in_design_district: "NONE" }
              as: PlatformAdmin
              captures: { ss_col_id: $.data.id }
            - call: "POST /support-structures"
              payload: { structure_type: "NEW_POLE", max_collocations: 1, in_design_district: "NONE" }
              as: PlatformAdmin
              captures: { ss_np_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "Oak Ave", corridor_code: "C-3", in_historic_district: false }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: { project_name: "P3" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_col_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_col_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "NEW_POLE", support_structure_id: "${ss_np_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2029-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          assert:
            - "PermitApplication.shot_clock_base_days == 90"
            - "PermitApplication.shot_clock_deadline == \"2026-08-30T00:00:00.000Z\""

      - name: application_fee_round_per_node_then_sum
        grounds:
          - calculations.application_fee
          - entities.FeeInvoice.fields.assessed_amount_cents
          - state_machines.PermitApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b) nested rounding: 3 COLLOCATION nodes each round 47533*1.0825=51454.4725 -> 51454
          per node then sum to 154362; sum-then-round would give 154363. The scaffold pins per-node
          rounding, so assessed == 154362.
        test_recipe:
          setup:
            - "3 COLLOCATION nodes on one structure (max 3), submitted; provisional fee assessed."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Delta Networks", contact_email: "d@delta.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 3, in_design_district: "NONE" }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "Pine Rd", corridor_code: "C-4", in_historic_district: false }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: { project_name: "P4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          assert:
            - "FeeInvoice.fee_variant == PROVISIONAL"
            - "FeeInvoice.assessed_amount_cents == 154362"

  # ================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_incomplete_cure_cycle
        grounds:
          - state_machines.PermitApplication.SUBMITTED_to_INCOMPLETE
          - state_machines.PermitApplication.INCOMPLETE_to_SUBMITTED
          - entities.PermitApplication.fields.toll_days_accumulated
        distinguishing_aspect: |
          Cyclic revision loop on PermitApplication: SUBMITTED->INCOMPLETE->SUBMITTED. A 10-day toll
          (notice 2026-06-10, cure 2026-06-20) extends the COLLOCATION-only deadline from
          2026-07-31 to 2026-08-10T00:00:00.000Z, and status returns to SUBMITTED.
        test_recipe:
          setup:
            - "1 COLLOCATION node app submitted 2026-06-01 (deadline 2026-07-31). Found incomplete at 2026-06-10."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Epsilon Wireless", contact_email: "e@eps.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2, in_design_district: "NONE" }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "Birch Ln", corridor_code: "C-5", in_historic_district: false }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: { project_name: "P5" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_id}/completeness-review"
              payload: { complete: false, deficiencies: "structural load calc missing" }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /applications/${app_id}/cure"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          assert:
            - "PermitApplication.status == SUBMITTED"
            - "PermitApplication.toll_days_accumulated == 10"
            - "PermitApplication.shot_clock_deadline == \"2026-08-10T00:00:00.000Z\""

      - name: node_parallel_design_aesthetic_join
        grounds:
          - state_machines.Node.IN_REVIEW_to_APPROVED
          - entities.Node.fields.design_review_status
          - entities.Node.fields.aesthetic_review_status
        distinguishing_aspect: |
          Node runs two parallel review dimensions; in a historic segment (aesthetic NOT waived)
          a design PASS alone leaves the node IN_REVIEW, and only when aesthetic PASS also lands
          does the fork-join move it to APPROVED.
        test_recipe:
          setup:
            - "1 COLLOCATION node in a HISTORIC segment; app UNDER_REVIEW; design review already recorded PASS (node still IN_REVIEW, aesthetic PENDING)."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Zeta Comms", contact_email: "z@zeta.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2, in_design_district: "NONE" }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "Old Town", corridor_code: "C-6", in_historic_district: true }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: { project_name: "P6" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { node_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/completeness-review"
              payload: { complete: true }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "GET /support-structures/${ss_id}"
              payload: {}
              as: ROWReviewer
              as_user_id: "rowrev-1"
              captures: { ss_ver: $.data.version }
            - call: "POST /nodes/${node_id}/design-review"
              payload: { outcome: "PASS", expected_support_structure_version: "${ss_ver}" }
              as: ROWReviewer
              as_user_id: "rowrev-1"
          trigger:
            - call: "POST /nodes/${node_id}/aesthetic-review"
              payload: { outcome: "PASS" }
              as: AestheticReviewer
              as_user_id: "aesrev-1"
          assert:
            - "Node.design_review_status == PASS"
            - "Node.aesthetic_review_status == PASS"
            - "Node.status == APPROVED"
            - "Before the aesthetic PASS the node was IN_REVIEW (design PASS alone did not join)"

  # ================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deny_decision_cascades_nodes_invoice_refund
        grounds:
          - state_machines.PermitApplication.UNDER_REVIEW_to_DENIED
          - state_machines.Node.REJECTED_to_DENIED
          - calculations.application_fee
          - entities.Payment.fields.payment_type
        distinguishing_aspect: |
          Depth-3 cascade triggered by the DENY decision: Application UNDER_REVIEW->DENIED (link1)
          => the child Node REJECTED->DENIED (link2) => FeeInvoice recomputes FINAL to 0 and a
          REFUND Payment for the net collected (51454) is created (link3).
        test_recipe:
          setup:
            - "1 COLLOCATION node app, submitted (provisional 51454), fully paid, completeness=true, node design-FAILed -> REJECTED."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Eta Broadband", contact_email: "h@eta.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2, in_design_district: "NONE" }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "Cedar St", corridor_code: "C-7", in_historic_district: false }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: { project_name: "P7" }
              as: Applicant
