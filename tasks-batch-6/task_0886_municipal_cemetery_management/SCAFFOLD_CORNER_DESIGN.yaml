        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /plots after creating two plots returns an array with total_count and has_more in the envelope."
        test_recipe:
          setup: ["Two plots in one cemetery."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/cemeteries", payload: { name: "Oakwood" }, as: CemeteryDirector, captures: { cem_id: "$.data.id" } }
            - { call: "POST /cemetery-mgmt/plots", payload: { cemetery_id: "${cem_id}", section_code: "A", row: "1", plot_number: "1", gis_lat: 1.0, gis_lng: 2.0, plot_type: "GRAVE", interment_capacity: 2 }, as: Registrar }
