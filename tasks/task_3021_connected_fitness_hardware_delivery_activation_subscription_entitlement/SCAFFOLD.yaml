  - method: GET
    path: "/fitness/class-sessions/{sessionId}/class-enrollments"
    description: "List enrollments for one session"
    roles: [MembershipOwner, Instructor, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClassEnrollment[]
    side_effects: []

  - method: GET
    path: "/fitness/devices/{deviceId}/class-enrollments"
