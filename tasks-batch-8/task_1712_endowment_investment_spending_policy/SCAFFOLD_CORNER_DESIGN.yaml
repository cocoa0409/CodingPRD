      - name: exception_on_healthy_fund_and_corpus_redemption_on_true_endowment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "validations[priority=12]", "errors[ERR_FUND_NOT_UNDERWATER]", "errors[ERR_CORPUS_INVIOLABLE]"]
        distinguishing_aspect: "Two compliance guards on healthy funds: exception creation requires is_underwater true (MV == HGV fails it), and corpus redemption on TRUE_ENDOWMENT is inviolable regardless of amount."
        test_recipe:
          setup: ["zero-manager pool; ACTIVE TRUE_ENDOWMENT fund FHF with 5000000 CORPUS unitized at Q1 (MV 5000000 == HGV 5000000, not underwater)"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool HF", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { hf_pool: $.data.id, hf_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${hf_pool}", items: [ { asset_class: CASH, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/funds", payload: { pool_id: "${hf_pool}", fund_code: "FHF", fund_name: "Fund HF", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { hf_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D HF", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { hf_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${hf_fund}", donor_id: "${hf_donor}", external_ref: "HF1", gift_type: CORPUS, amount_cents: 5000000 }, as: DevelopmentOfficer, captures: { hf_g: $.data.id } }
            - { call: "POST /endowment/funds/${hf_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${hf_g}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${hf_pool}", estimated_pool_market_value_cents: 0 }, as: InvestmentOfficer, captures: { hf_v1: $.data.id } }
            - { call: "POST /endowment/valuations/${hf_v1}/finalize", payload: { final_pool_market_value_cents: 0, expected_pool_version: "${hf_pv}" }, as: InvestmentOfficer }
          trigger:
            - { call: "POST /endowment/exceptions", payload: { fund_id: "${hf_fund}", fiscal_year: 2026, requested_amount_cents: 100000, justification: "not needed" }, as: DevelopmentOfficer, captures: { hf_err1: $.data.error_id } }
            - { call: "POST /endowment/funds/${hf_fund}/redeem_corpus", payload: { amount_cents: 1000 }, as: BoardMember, as_user_id: "bm-1", captures: { hf_err2: $.data.error_id } }
