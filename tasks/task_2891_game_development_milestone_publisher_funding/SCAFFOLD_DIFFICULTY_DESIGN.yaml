      - name: termination_cascade_cancels_milestones_withholds_payment_and_voids_contractor_invoice
        grounds:
          - state_machines.DevelopmentAgreement.ACTIVE_to_TERMINATED
          - state_machines.Milestone.IN_DEVELOPMENT_to_CANCELLED
          - state_machines.Milestone.DEFINED_to_CANCELLED
          - state_machines.MilestonePayment.PENDING_AUTHORIZATION_to_WITHHELD
          - state_machines.ContractorEngagement.ACTIVE_to_TERMINATED_EARLY
          - state_machines.ContractorInvoice.SUBMITTED_to_VOIDED
          - calculations.ip_reversion_scope
        distinguishing_aspect: |
          A single POST /development-agreements/{id}/terminate reaches four levels down a different
          spine than the acceptance cascade: agreement TERMINATED -> M2/M3 CANCELLED -> E2
          TERMINATED_EARLY -> its SUBMITTED invoice VOIDED, while the already-accepted M1 keeps its
          state and its unauthorized payment flips to WITHHELD. It also proves the reversion
