      - name: checkin_with_wrong_user_returns_identity_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_CHECKIN_IDENTITY_MISMATCH]"]
        distinguishing_aspect: "Check-in identity is bound to the scheduled inspector: insp-02 cannot check in insp-01's shift."
        test_recipe:
          setup: ["plant; shift for insp-01; clock inside the check-in window"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-30", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
