              captures: { veh_id: $.data.id }
            - call: "POST /leases"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 0, term_months: 36, annual_mileage_allowance: 12000, per_mile_overage_rate_cents: 22.5, disposition_fee_cents: 39500, purchase_option_fee_cents: 30000, gap_insurance: false }
              as: FinanceManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/mature"
              payload: {}
              as: FinanceManager
              captures: { l_v: $.data.version }
            - call: "POST /lease-end-settlements"
              payload: { lease_id: "${lease_id}", election: "RETURN", odometer_miles: 36000, expected_lease_version: "${l_v}", per_year_excess_miles: [0, 0, 0] }
              as: Borrower
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /lease-end-settlements"
              payload: { lease_id: "${lease_id}", election: "PURCHASE", odometer_miles: 36000, expected_lease_version: "${l_v}" }
              as: Borrower
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "http status == 412"

      - name: version_increments_on_payoff_write
        claim_type: optimistic_concurrency
        grounds: [entities.Loan.fields.version, state_machines.Loan.CURRENT_to_PAID_OFF]
        excluded_because:
          difficulty_instance: transitive_cascade / payoff_cascade_balance_vehicle_version
          rationale: "version-bump-on-payoff side effect is part of that §1.8 cascade instance; OCC happy/stale paths covered by occ_payoff_stale_version_conflict above."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: origination_changes_visible_same_request
        claim_type: immediate
        grounds: [entities.Vehicle.fields.status, state_machines.Loan.CURRENT_to_CURRENT]
        distinguishing_aspect: "immediate consistency: after POST /loans the same-request response already shows Loan computed fields, and a subsequent GET /vehicles/{id} shows status FINANCED with no delay."
        test_recipe:
          setup: ["Active RateCard; Customer TIER_1; Vehicle AVAILABLE."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "2026-Q2", tier_1_min_fico: 740, tier_2_min_fico: 680, tier_3_min_fico: 620, tier_1_apr: 0.0399, tier_2_apr: 0.0599, tier_3_apr: 0.0899, tier_4_apr: 0.1499, lease_money_factor: 0.00125, default_rate_apr: 0.2499, lease_tax_rate: 0.0725 }
              as: FinanceManager
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: FinanceManager
            - call: "POST /customers"
              payload: { full_name: "Imm Cons", email: "ic@x.com", fico_score: 760 }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-IC", make_model: "Acme Sedan", msrp_cents: 3200000, sale_price_cents: 3000000, residual_value_cents: 1850000 }
              as: FinanceManager
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", down_payment_cents: 500000, term_months: 60, gap_insurance: false }
              as: FinanceManager
              captures: { mp: $.data.monthly_payment_cents }
            - call: "GET /vehicles/${veh_id}"
              payload: {}
              as: FinanceManager
              captures: { vstat: $.data.status }
          assert:
            - "Loan response monthly_payment_cents == 46030 in the same POST response"
            - "Vehicle.status == FINANCED on the immediate follow-up GET"
