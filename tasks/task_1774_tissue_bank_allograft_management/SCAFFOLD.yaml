# =============================================================================
# SCAFFOLD.yaml — Tissue Bank & Allograft Management (hospital tissue services)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "Tissue Bank & Allograft Management (hospital tissue services): supplier qualification & regulatory documentation, receipt & storage condition monitoring (freezer/temperature), tissue tracking from receipt to implantation, expiration & recall handling, adverse-reaction reporting & investigation, disposition record retention requirement, temperature excursion investigation, inventory par level & cost control"

domain_name: tissue-bank-allograft
api_prefix: /tissue-bank

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Supplier legal name" }
      - { name: license_number, type: string, source: input, description: "Tissue bank license number; unique across suppliers" }
      - { name: status, type: enum, source: system, description: "PENDING_QUALIFICATION | QUALIFIED | SUSPENDED | DISQUALIFIED", default: PENDING_QUALIFICATION }
      - { name: qualification_score_provisional, type: number, source: computed, default: 100, description: "100 - 20*confirmed_findings - 15*active_recalls - 10*open_adverse_reactions - 5*expired_doc_events; floored at 0; drives auto-suspension when < 60" }
      - { name: qualification_score_final, type: number, source: computed, default: 100, description: "100 - 20*confirmed_findings - 5*expired_doc_events; floored at 0; open investigations and active recalls excluded" }
      - { name: suspended_at, type: datetime, source: system, description: "When the supplier last entered SUSPENDED; null while never suspended", default: null }

  - name: SupplierDocument
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; owning supplier" }
      - { name: doc_type, type: enum, source: input, description: "AATB_ACCREDITATION | FDA_REGISTRATION | STATE_LICENSE | ISO_CERTIFICATE" }
      - { name: document_ref, type: string, source: input, description: "External document reference number" }
      - { name: valid_from, type: datetime, source: input, description: "Validity window start (inclusive, closed interval)" }
      - { name: valid_to, type: datetime, source: input, description: "Validity window end (inclusive, closed interval); document EXPIRED when clock > valid_to" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED | EXPIRED", default: SUBMITTED }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the QualityManager who verified; null until verified", default: null }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; shipping supplier" }
      - { name: freezer_id, type: string, source: input, description: "FK -> Freezer.id; receiving storage unit" }
      - { name: items, type: array, source: input, description: "Manifest lines: { tissue_type, lot_number, serial_number, unit_cost_cents, expiration_at, criticality_tier }; >= 1 line; serial_number unique within the shipment" }
      - { name: status, type: enum, source: system, description: "RECEIVED | ACCEPTED | REJECTED", default: RECEIVED }
      - { name: received_at, type: datetime, source: system, description: "Logical clock time at creation" }
      - { name: total_declared_value_cents, type: integer, source: computed, description: "Sum of items[].unit_cost_cents" }
      - { name: unit_count, type: integer, source: computed, description: "len(items); TissueUnits minted at creation" }
      - { name: accepted_at, type: datetime, source: system, description: "Clock time of acceptance; null until ACCEPTED", default: null }
      - { name: rejection_reason, type: string, source: input, description: "Required on reject; null otherwise", default: null }

  - name: TissueUnit
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; originating shipment" }
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; denormalized from shipment for recall scoping" }
      - { name: freezer_id, type: string, source: system, description: "FK -> Freezer.id; storage location" }
      - { name: tissue_type, type: enum, source: input, description: "BONE | SOFT_TISSUE | CARDIOVASCULAR | SKIN | CORNEA" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number; recall scoping key" }
      - { name: serial_number, type: string, source: input, description: "Unit serial within shipment; unique per shipment; list ordering key (ASC)" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Acquisition cost in cents; >= 0" }
      - { name: criticality_tier, type: enum, source: input, description: "STANDARD | SENSITIVE | CRITICAL" }
      - { name: expiration_at, type: datetime, source: input, description: "Usable while clock <= expiration_at; EXPIRED when clock strictly greater" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock time of shipment creation" }
      - { name: status, type: enum, source: system, description: "QUARANTINED | AVAILABLE | RESERVED | ISSUED | IMPLANTED | DISCARDED | RETURNED_TO_SUPPLIER | EXPIRED", default: QUARANTINED }
      - { name: hold_reason, type: enum, source: system, description: "NONE | EXCURSION | RECALL | MANUAL; meaningful only while QUARANTINED", default: NONE }
      - { name: recall_flag, type: boolean, source: system, default: false, description: "Set when an ACTIVE recall matches an ISSUED unit; cleared when the unit leaves ISSUED" }
      - { name: implanted_case_id, type: string, source: system, description: "FK -> ImplantCase.id; set on implantation; null otherwise", default: null }
      - { name: implanted_at, type: datetime, source: system, description: "Clock time of implantation; null otherwise", default: null }

  - name: Freezer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Freezer display name; unique" }
      - { name: min_celsius, type: number, source: input, description: "In-range lower bound (inclusive); must be < max_celsius" }
      - { name: max_celsius, type: number, source: input, description: "In-range upper bound (inclusive); reading > max or < min is out-of-range" }
      - { name: nominal_capacity, type: integer, source: input, description: "Physical slot count; >= 1" }
      - { name: status, type: enum, source: system, description: "OPERATIONAL | EXCURSION_ACTIVE", default: OPERATIONAL }
      - { name: occupied_count, type: integer, source: computed, default: 0, description: "Units stored: status IN {QUARANTINED, AVAILABLE, RESERVED}" }
      - { name: utilization_pct, type: number, source: computed, default: 0, description: "occupied_count / nominal_capacity * 100, computed from CURRENT occupancy before reserve derivation" }
      - { name: quarantine_reserve_slots, type: integer, source: computed, default: 0, description: "2 if utilization_pct >= 80.0 else 0; evaluation order pinned in calculations.storage_capacity_gating" }
      - { name: effective_capacity, type: integer, source: computed, description: "nominal_capacity - quarantine_reserve_slots" }
      - { name: current_excursion_id, type: string, source: system, description: "FK -> TemperatureExcursion.id; the OPEN or UNDER_INVESTIGATION excursion while EXCURSION_ACTIVE; null while OPERATIONAL", default: null }

  - name: TemperatureReading
    parent: null
    common_fields: false
    fields:
      - { name: freezer_id, type: string, source: input, description: "FK -> Freezer.id; observed freezer" }
      - { name: temp_celsius, type: number, source: input, description: "Observed temperature" }
      - { name: in_range, type: boolean, source: computed, description: "min_celsius <= temp_celsius <= max_celsius at record time (bounds snapshot on the reading)" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recorder" }
      - { name: excursion_id, type: string, source: system, description: "FK -> TemperatureExcursion.id; set when this reading opened or extended an excursion; null for in-range readings", default: null }

  - name: TemperatureExcursion
    parent: null
    common_fields: true
    fields:
      - { name: freezer_id, type: string, source: system, description: "FK -> Freezer.id; affected freezer" }
      - { name: origin, type: enum, source: system, description: "AUTO_READING | MANUAL_REPORT" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_INVESTIGATION | RESOLVED_RELEASE | RESOLVED_DESTROY", default: OPEN }
      - { name: opened_at, type: datetime, source: system, description: "Clock time the excursion opened" }
      - { name: last_reading_at, type: datetime, source: system, description: "Clock time of the most recent reading while the excursion is unresolved" }
      - { name: max_deviation_celsius, type: number, source: computed, default: 0, description: "Max over linked readings of max(0, temp - max_celsius, min_celsius - temp); manual excursions start at 0" }
      - { name: affected_unit_count, type: integer, source: computed, default: 0, description: "Units in this freezer with hold_reason == EXCURSION" }
      - { name: severity_score, type: integer, source: computed, default: 0, description: "See calculations.excursion_severity_score; 0..100" }
      - { name: severity_class, type: enum, source: computed, description: "LOW (< 25) | MEDIUM (25..59) | HIGH (>= 60)", default: LOW }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID for MANUAL_REPORT origin; null for AUTO_READING", default: null }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of resolver; null until resolved", default: null }
      - { name: resolution_notes, type: string, source: input, description: "Required on resolve (>= 10 chars); null until resolved", default: null }
      - { name: resolved_at, type: datetime, source: system, description: "Clock time of resolution; null until resolved", default: null }

  - name: ImplantCase
    parent: null
    common_fields: true
    fields:
      - { name: surgeon_id, type: string, source: system, description: "X-User-ID of the creating ImplantingSurgeon (opaque operator id; ownership checks compare against it)" }
      - { name: patient_ref, type: string, source: input, description: "De-identified patient reference" }
      - { name: or_room_id, type: string, source: input, description: "Operating room resource key for overlap checks" }
      - { name: scheduled_start, type: datetime, source: input, description: "Case window start; half-open interval [start, end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Case window end; must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: SCHEDULED }
      - { name: implanted_unit_count, type: integer, source: computed, default: 0, description: "Units IMPLANTED against this case" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: implant_case_id, type: string, source: system, description: "FK -> ImplantCase.id; reserving case" }
      - { name: tissue_unit_id, type: string, source: input, description: "FK -> TissueUnit.id; reserved unit" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED | FULFILLED | EXPIRED", default: ACTIVE }
      - { name: hold_until, type: datetime, source: computed, description: "implant_case.scheduled_end + 2 hours; EXPIRED sweep fires when clock > hold_until" }
      - { name: release_reason, type: enum, source: system, description: "NONE | MANUAL | EXCURSION | RECALL | CASE_CANCELLED | CASE_COMPLETED | CLOCK_EXPIRED", default: NONE }

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; recalled supplier" }
      - { name: lot_numbers, type: array, source: input, description: "Non-empty list of lot numbers in scope" }
      - { name: received_window_start, type: datetime, source: input, description: "Received-window start (inclusive, closed interval)" }
      - { name: received_window_end, type: datetime, source: input, description: "Received-window end (inclusive, closed interval); must be >= start" }
      - { name: reason, type: string, source: input, description: "Recall reason text" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED", default: DRAFT }
      - { name: closure_reason, type: enum, source: system, description: "NONE | NO_MATCH | RESOLVED", default: NONE }
      - { name: affected_unit_count, type: integer, source: computed, default: 0, description: "Units matching scope swept at activation" }
      - { name: activated_at, type: datetime, source: system, description: "Clock time of activation; null until ACTIVE", default: null }

  - name: AdverseReactionCase
    parent: null
    common_fields: true
    fields:
      - { name: implant_case_id, type: string, source: system, description: "FK -> ImplantCase.id; case the reaction belongs to" }
      - { name: tissue_unit_id, type: string, source: input, description: "FK -> TissueUnit.id; unit implicated (must be IMPLANTED on this case)" }
      - { name: reporter_user_id, type: string, source: system, description: "X-User-ID of the reporting ImplantingSurgeon" }
      - { name: reaction_type, type: enum, source: input, description: "INFECTION | REJECTION | OTHER" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text description (>= 10 chars)" }
      - { name: status, type: enum, source: system, description: "REPORTED | UNDER_INVESTIGATION | CLOSED_CONFIRMED | CLOSED_UNCONFIRMED | REOPENED", default: REPORTED }
      - { name: investigator_user_id, type: string, source: system, description: "X-User-ID of the resolving ComplianceOfficer; null until resolved", default: null }
      - { name: reopened_count, type: integer, source: computed, default: 0, description: "Increments on each reopen" }

  - name: ParLevelPolicy
    parent: null
    common_fields: true
    fields:
      - { name: tissue_type, type: enum, source: input, description: "BONE | SOFT_TISSUE | CARDIOVASCULAR | SKIN | CORNEA; at most one ACTIVE policy per tissue_type" }
      - { name: par_quantity, type: integer, source: input, description: "Desired on-hand AVAILABLE count; >= 0" }
      - { name: max_inventory_value_cents, type: integer, source: input, description: "Fiscal cap on WEIGHTED_AVERAGE projected valuation of this tissue_type; >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED", default: ACTIVE }
      - { name: on_hand_available, type: integer, source: computed, default: 0, description: "count(TissueUnit of tissue_type with status == AVAILABLE)" }
      - { name: deficit, type: integer, source: computed, default: 0, description: "max(0, par_quantity - on_hand_available)" }
      - { name: needs_reorder, type: boolean, source: computed, default: false, description: "on_hand_available < par_quantity (strict)" }

  - name: DispositionRecord
    parent: null
    common_fields: true
    fields:
      - { name: tissue_unit_id, type: string, source: system, description: "FK -> TissueUnit.id; unit whose disposition is documented" }
      - { name: disposition_type, type: enum, source: system, description: "IMPLANTED | DESTROYED | RETURNED_TO_SUPPLIER | EXPIRED" }
      - { name: reason, type: string, source: system, description: "Free-text reason captured from the triggering action" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the actor whose action created the record" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED", default: DRAFT }
      - { name: finalized_at, type: datetime, source: system, description: "Clock time of finalization; retention clock starts here; null until FINALIZED", default: null }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the finalizing ComplianceOfficer; null until FINALIZED", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Supplier
    initial_state: PENDING_QUALIFICATION
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PENDING_QUALIFICATION
        to: QUALIFIED
        trigger: "POST /tissue-bank/suppliers/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Supplier status == PENDING_QUALIFICATION or SUSPENDED (ERR_SUPPLIER_INVALID_STATE otherwise)"
          - "At least one VERIFIED SupplierDocument of doc_type AATB_ACCREDITATION with valid_to >= clock (ERR_REQUIRED_DOCUMENTS_NOT_VERIFIED)"
          - "At least one VERIFIED SupplierDocument of doc_type FDA_REGISTRATION with valid_to >= clock (ERR_REQUIRED_DOCUMENTS_NOT_VERIFIED)"
          - "Segregation of duties: approver X-User-ID != verified_by_user_id of the most recently verified required-type document (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Supplier.version += 1; status = QUALIFIED"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /tissue-bank/suppliers/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "Supplier status == QUALIFIED (ERR_SUPPLIER_INVALID_STATE)"
        side_effects:
          - "status = SUSPENDED; suspended_at = clock"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "system (automatic: a required-type SupplierDocument transitions to EXPIRED via clock sweep and no other VERIFIED document of that doc_type has valid_to >= clock)"
        actor: system
        preconditions:
          - "Supplier status == QUALIFIED and required-document coverage lapsed"
        side_effects:
          - "status = SUSPENDED; suspended_at = clock"
          - "Cascade link 1 of document-expiry chain: future POST /shipments and shipment accepts for this supplier begin failing ERR_SUPPLIER_NOT_QUALIFIED"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "system (automatic: qualification_score_provisional recomputes below 60 after any score-mutating event — adverse-reaction resolve/reopen, recall activate/close, or document expiry sweep)"
        actor: system
        preconditions:
          - "Supplier status == QUALIFIED and qualification_score_provisional < 60"
        side_effects:
          - "status = SUSPENDED; suspended_at = clock"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /tissue-bank/suppliers/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "Supplier status == SUSPENDED (ERR_SUPPLIER_INVALID_STATE)"
          - "Same required-document coverage as approve (ERR_REQUIRED_DOCUMENTS_NOT_VERIFIED)"
          - "qualification_score_provisional >= 60 (ERR_SUPPLIER_SCORE_BELOW_THRESHOLD)"
        side_effects:
          - "status = QUALIFIED"
      - from: PENDING_QUALIFICATION
        to: DISQUALIFIED
        trigger: "POST /tissue-bank/suppliers/{id}/disqualify"
        actor: ComplianceOfficer
        preconditions:
          - "Supplier status IN {PENDING_QUALIFICATION, SUSPENDED} (ERR_SUPPLIER_INVALID_STATE)"
        side_effects:
          - "status = DISQUALIFIED"
      - from: SUSPENDED
        to: DISQUALIFIED
        trigger: "POST /tissue-bank/suppliers/{id}/disqualify"
        actor: ComplianceOfficer
        preconditions:
          - "Supplier status IN {PENDING_QUALIFICATION, SUSPENDED} (ERR_SUPPLIER_INVALID_STATE)"
        side_effects:
          - "status = DISQUALIFIED"

  - entity: SupplierDocument
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /tissue-bank/suppliers/{id}/documents/{docId}/verify"
        actor: QualityManager
        preconditions:
          - "Document status == SUBMITTED (ERR_DOCUMENT_INVALID_STATE)"
        side_effects:
          - "status = VERIFIED; verified_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tissue-bank/suppliers/{id}/documents/{docId}/reject"
        actor: QualityManager
        preconditions:
          - "Document status == SUBMITTED (ERR_DOCUMENT_INVALID_STATE)"
        side_effects:
          - "status = REJECTED"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (clock sweep on POST /_clock/set_current_utc: VERIFIED document with clock > valid_to)"
        actor: system
        preconditions:
          - "Document status == VERIFIED and clock strictly greater than valid_to"
        side_effects:
          - "status = EXPIRED"
          - "If doc_type IN {AATB_ACCREDITATION, FDA_REGISTRATION} and no other VERIFIED document of same doc_type on same supplier has valid_to >= clock: parent Supplier QUALIFIED -> SUSPENDED (auto-suspension cascade)"
          - "expired_doc_events feeding calculations.supplier_qualification_score incremented (score fields recomputed)"

  - entity: Shipment
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /tissue-bank/shipments/{id}/accept"
        actor: TissueBankCoordinator
        preconditions:
          - "Shipment status == RECEIVED (ERR_SHIPMENT_NOT_RECEIVED)"
          - "Supplier status == QUALIFIED at accept time (ERR_SUPPLIER_NOT_QUALIFIED)"
          - "Supplier has VERIFIED AATB_ACCREDITATION and FDA_REGISTRATION documents with valid_to >= clock (ERR_REQUIRED_DOCUMENTS_NOT_VERIFIED)"
          - "Fiscal cap: for each tissue_type with an ACTIVE ParLevelPolicy, projected WEIGHTED_AVERAGE valuation including this shipment's accepted units <= policy.max_inventory_value_cents (ERR_INVENTORY_VALUE_CAP_EXCEEDED)"
        side_effects:
          - "status = ACCEPTED; accepted_at = clock"
          - "Minted TissueUnits enter the valuation input population (shipment.status == ACCEPTED)"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /tissue-bank/shipments/{id}/reject"
        actor: TissueBankCoordinator
        preconditions:
          - "Shipment status == RECEIVED (ERR_SHIPMENT_NOT_RECEIVED)"
          - "rejection_reason provided and >= 10 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = REJECTED; rejection_reason stored"
          - "Every minted TissueUnit (status QUARANTINED) -> RETURNED_TO_SUPPLIER; hold_reason = NONE"
          - "One DRAFT DispositionRecord (disposition_type = RETURNED_TO_SUPPLIER) created per unit, recorded_by = X-User-ID"
          - "Freezer.occupied_count decremented per unit (derived recompute)"

  - entity: TissueUnit
    initial_state: QUARANTINED
    terminal_states: [IMPLANTED, DISCARDED, RETURNED_TO_SUPPLIER, EXPIRED]
    transitions:
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /tissue-bank/tissue-units/{id}/release"
        actor: QualityManager
        preconditions:
          - "Unit status == QUARANTINED (ERR_UNIT_NOT_QUARANTINED)"
          - "Shipment status == ACCEPTED (ERR_SHIPMENT_NOT_ACCEPTED)"
          - "Supplier status == QUALIFIED (ERR_SUPPLIER_NOT_QUALIFIED)"
          - "Freezer status == OPERATIONAL (ERR_FREEZER_IN_EXCURSION)"
          - "No ACTIVE Recall matches (unit.supplier_id, unit.lot_number IN recall.lot_numbers, unit.received_at IN [received_window_start, received_window_end]) (ERR_UNIT_UNDER_ACTIVE_RECALL)"
        side_effects:
          - "status = AVAILABLE; hold_reason = NONE"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /tissue-bank/tissue-units/{id}/hold"
        actor: QualityManager
        preconditions:
          - "Unit status == AVAILABLE (ERR_UNIT_NOT_HOLDABLE)"
        side_effects:
          - "status = QUARANTINED; hold_reason = MANUAL"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system (temperature excursion opens on the unit's freezer, or an ACTIVE recall sweep matches the unit)"
        actor: system
        preconditions:
          - "Unit status == AVAILABLE and (freezer excursion opened or recall scope matched)"
        side_effects:
          - "status = QUARANTINED; hold_reason = EXCURSION or RECALL respectively"
      - from: RESERVED
        to: QUARANTINED
        trigger: "system (temperature excursion opens on the unit's freezer, or an ACTIVE recall sweep matches the unit)"
        actor: system
        preconditions:
          - "Unit status == RESERVED and (freezer excursion opened or recall scope matched)"
        side_effects:
          - "status = QUARANTINED; hold_reason = EXCURSION or RECALL respectively"
          - "The ACTIVE Reservation on this unit -> RELEASED with release_reason = EXCURSION or RECALL (cascade link)"
          - "ParLevelPolicy.on_hand_available / deficit / needs_reorder recomputed for the unit's tissue_type (derived recompute)"
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /tissue-bank/implant-cases/{id}/reservations"
        actor: TissueBankCoordinator
        preconditions:
          - "Unit status == AVAILABLE (ERR_UNIT_NOT_RESERVABLE)"
        side_effects:
          - "status = RESERVED; Reservation created (ACTIVE)"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /tissue-bank/reservations/{id}/release (MANUAL) or system (implant case cancel/complete, or clock > hold_until -> reservation EXPIRED)"
        actor: "TissueBankCoordinator | system"
        preconditions:
          - "Unit status == RESERVED and the releasing reservation is the ACTIVE one on this unit"
        side_effects:
          - "status = AVAILABLE"
      - from: AVAILABLE
        to: ISSUED
        trigger: "POST /tissue-bank/tissue-units/{id}/issue (direct issue, no reservation_id)"
        actor: TissueBankCoordinator
        preconditions:
          - "Unit status == AVAILABLE (ERR_UNIT_NOT_ISSUABLE_STATE)"
          - "clock <= expiration_at (ERR_UNIT_EXPIRED)"
          - "Freezer status == OPERATIONAL (ERR_FREEZER_IN_EXCURSION)"
          - "No ACTIVE Recall matches this unit (ERR_UNIT_UNDER_ACTIVE_RECALL)"
          - "Supplier status == QUALIFIED (ERR_SUPPLIER_NOT_QUALIFIED)"
        side_effects:
          - "status = ISSUED; Freezer.occupied_count decremented (derived recompute)"
      - from: RESERVED
        to: ISSUED
        trigger: "POST /tissue-bank/tissue-units/{id}/issue (with reservation_id)"
        actor: TissueBankCoordinator
        preconditions:
          - "Unit status == RESERVED (ERR_UNIT_NOT_ISSUABLE_STATE)"
          - "reservation_id references an ACTIVE Reservation whose tissue_unit_id == this unit (ERR_RESERVATION_NOT_ACTIVE / ERR_RESERVATION_UNIT_MISMATCH)"
          - "clock <= expiration_at (ERR_UNIT_EXPIRED)"
          - "Freezer status == OPERATIONAL (ERR_FREEZER_IN_EXCURSION)"
          - "No ACTIVE Recall matches this unit (ERR_UNIT_UNDER_ACTIVE_RECALL)"
          - "Supplier status == QUALIFIED (ERR_SUPPLIER_NOT_QUALIFIED)"
        side_effects:
          - "status = ISSUED; the Reservation -> FULFILLED"
          - "Freezer.occupied_count decremented (derived recompute)"
      - from: ISSUED
        to: AVAILABLE
        trigger: "POST /tissue-bank/tissue-units/{id}/return-to-stock"
        actor: TissueBankCoordinator
        preconditions:
          - "Unit status == ISSUED (ERR_UNIT_NOT_ISSUED)"
          - "clock <= expiration_at (ERR_UNIT_EXPIRED)"
          - "No ACTIVE Recall matches this unit (ERR_UNIT_UNDER_ACTIVE_RECALL); units with recall_flag == true are thus blocked and must go to return-to-supplier"
          - "Freezer effective_capacity has a free slot: occupied_count + 1 <= effective_capacity (ERR_FREEZER_CAPACITY_EXCEEDED)"
        side_effects:
          - "status = AVAILABLE; recall_flag = false; Freezer.occupied_count incremented"
      - from: ISSUED
        to: IMPLANTED
        trigger: "POST /tissue-bank/implant-cases/{id}/record-implantation"
        actor: ImplantingSurgeon
        preconditions:
          - "ImplantCase.surgeon_id == X-User-ID (ERR_CASE_OWNERSHIP_VIOLATION)"
          - "ImplantCase status == SCHEDULED (ERR_CASE_INVALID_STATE)"
          - "Implant window open: scheduled_start - 1 hour <= clock <= scheduled_end + 24 hours (ERR_IMPLANT_WINDOW_CLOSED)"
          - "Unit status == ISSUED (ERR_UNIT_NOT_ISSUED)"
          - "If the unit was ISSUED via a reservation, that reservation's implant_case_id == this case (ERR_UNIT_ISSUED_TO_ANOTHER_CASE)"
        side_effects:
          - "status = IMPLANTED; implanted_case_id = case id; implanted_at = clock; recall_flag = false"
          - "ImplantCase.implanted_unit_count += 1"
          - "DRAFT DispositionRecord (disposition_type = IMPLANTED) created, recorded_by = X-User-ID"
      - from: QUARANTINED
        to: DISCARDED
        trigger: "POST /tissue-bank/tissue-units/{id}/discard, or system (excursion resolved with disposition DESTROY)"
        actor: "QualityManager | system"
        preconditions:
          - "Unit status IN {QUARANTINED, EXPIRED} for the manual endpoint (ERR_UNIT_NOT_DISCARDABLE)"
        side_effects:
          - "status = DISCARDED; hold_reason = NONE; recall_flag = false"
          - "DRAFT DispositionRecord (disposition_type = DESTROYED) created"
          - "Freezer.occupied_count decremented when unit was stored (derived recompute)"
      - from: EXPIRED
        to: DISCARDED
        trigger: "POST /tissue-bank/tissue-units/{id}/discard"
        actor: QualityManager
        preconditions:
          - "Unit status IN {QUARANTINED, EXPIRED} (ERR_UNIT_NOT_DISCARDABLE)"
        side_effects:
          - "status = DISCARDED; DRAFT DispositionRecord (DESTROYED) created"
      - from: QUARANTINED
        to: RETURNED_TO_SUPPLIER
        trigger: "POST /tissue-bank/tissue-units/{id}/return-to-supplier"
        actor: QualityManager
        preconditions:
          - "Unit status == QUARANTINED (ERR_UNIT_NOT_QUARANTINED)"
        side_effects:
          - "status = RETURNED_TO_SUPPLIER; hold_reason = NONE"
          - "DRAFT DispositionRecord (RETURNED_TO_SUPPLIER) created"
          - "Freezer.occupied_count decremented (derived recompute)"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "system (temperature excursion resolved with disposition RELEASE)"
        actor: system
        preconditions:
          - "Unit status == QUARANTINED and hold_reason == EXCURSION and the freezer's excursion resolved RELEASE"
        side_effects:
          - "status = AVAILABLE; hold_reason = NONE"
      - from: QUARANTINED
        to: DISCARDED
        trigger: "system (temperature excursion resolved with disposition DESTROY)"
        actor: system
        preconditions:
          - "Unit status == QUARANTINED and hold_reason == EXCURSION and the freezer's excursion resolved DESTROY"
        side_effects:
          - "status = DISCARDED; hold_reason = NONE"
          - "DRAFT DispositionRecord (DESTROYED) created per unit"
          - "Freezer.occupied_count decremented per unit (derived recompute)"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system (clock sweep: clock > expiration_at)"
        actor: system
        preconditions:
          - "Unit status IN {QUARANTINED, AVAILABLE, RESERVED} and clock strictly greater than expiration_at"
        side_effects:
          - "status = EXPIRED; hold_reason = NONE"
          - "If status was RESERVED: the ACTIVE Reservation -> EXPIRED with release_reason = CLOCK_EXPIRED (cascade link)"
          - "DRAFT DispositionRecord (EXPIRED) created"
          - "Freezer.occupied_count decremented when unit was stored (derived recompute)"
      - from: QUARANTINED
        to: EXPIRED
        trigger: "system (clock sweep: clock > expiration_at)"
        actor: system
        preconditions:
          - "Unit status IN {QUARANTINED, AVAILABLE, RESERVED} and clock strictly greater than expiration_at"
        side_effects:
          - "status = EXPIRED; hold_reason = NONE; DRAFT DispositionRecord (EXPIRED) created; Freezer.occupied_count decremented"
      - from: RESERVED
        to: EXPIRED
        trigger: "system (clock sweep: clock > expiration_at)"
        actor: system
        preconditions:
          - "Unit status IN {QUARANTINED, AVAILABLE, RESERVED} and clock strictly greater than expiration_at"
        side_effects:
          - "status = EXPIRED; Reservation -> EXPIRED (release_reason = CLOCK_EXPIRED); DRAFT DispositionRecord (EXPIRED) created; Freezer.occupied_count decremented"

  - entity: Freezer
    initial_state: OPERATIONAL
    terminal_states: []
    transitions:
      - from: OPERATIONAL
        to: EXCURSION_ACTIVE
        trigger: "system (POST /freezers/{id}/readings with out-of-range temp_celsius, or POST /freezers/{id}/excursions manual report)"
        actor: system
        preconditions:
          - "Freezer status == OPERATIONAL and (reading out of range or manual excursion reported)"
        side_effects:
          - "status = EXCURSION_ACTIVE; current_excursion_id set to the newly opened TemperatureExcursion"
          - "Cascade: every TissueUnit in this freezer with status AVAILABLE -> QUARANTINED (hold_reason = EXCURSION); every RESERVED unit -> QUARANTINED (hold_reason = EXCURSION) AND its ACTIVE Reservation -> RELEASED (release_reason = EXCURSION); ParLevelPolicy availability recomputed per affected tissue_type"
          - "Units already QUARANTINED keep status; hold_reason EXCURSION is recorded only when previous hold_reason == NONE"
      - from: EXCURSION_ACTIVE
        to: OPERATIONAL
        trigger: "system (POST /excursions/{id}/resolve completes the freezer's current excursion)"
        actor: system
        preconditions:
          - "Freezer status == EXCURSION_ACTIVE and its current excursion transitioned to a RESOLVED_* state"
        side_effects:
          - "status = OPERATIONAL; current_excursion_id = null"
          - "Units held by this excursion handled per resolution disposition (RELEASE -> AVAILABLE; DESTROY -> DISCARDED)"

  - entity: TemperatureExcursion
    initial_state: OPEN
    terminal_states: [RESOLVED_RELEASE, RESOLVED_DESTROY]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /tissue-bank/excursions/{id}/investigate"
        actor: QualityManager
        preconditions:
          - "Excursion status == OPEN (ERR_EXCURSION_INVALID_STATE)"
        side_effects:
          - "status = UNDER_INVESTIGATION"
      - from: UNDER_INVESTIGATION
        to: RESOLVED_RELEASE
        trigger: "POST /tissue-bank/excursions/{id}/resolve with disposition = RELEASE"
        actor: QualityManager
        preconditions:
          - "Excursion status == UNDER_INVESTIGATION (ERR_EXCURSION_INVALID_STATE)"
          - "severity_class != HIGH (ERR_SEVERITY_REQUIRES_DESTROY)"
          - "Segregation of duties: X-User-ID != reported_by_user_id when origin == MANUAL_REPORT (ERR_SEGREGATION_OF_DUTIES)"
          - "resolution_notes >= 10 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = RESOLVED_RELEASE; resolved_by_user_id = X-User-ID; resolved_at = clock"
          - "Cascade: held units (hold_reason == EXCURSION in this freezer) -> AVAILABLE, hold_reason = NONE"
          - "Freezer -> OPERATIONAL; current_excursion_id = null"
      - from: UNDER_INVESTIGATION
        to: RESOLVED_DESTROY
        trigger: "POST /tissue-bank/excursions/{id}/resolve with disposition = DESTROY"
        actor: QualityManager
        preconditions:
          - "Excursion status == UNDER_INVESTIGATION (ERR_EXCURSION_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != reported_by_user_id when origin == MANUAL_REPORT (ERR_SEGREGATION_OF_DUTIES)"
          - "resolution_notes >= 10 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = RESOLVED_DESTROY; resolved_by_user_id = X-User-ID; resolved_at = clock"
          - "Cascade: held units -> DISCARDED; DRAFT DispositionRecord (DESTROYED) per unit"
          - "Freezer -> OPERATIONAL; current_excursion_id = null"
          - "ParLevelPolicy.on_hand_available / deficit recomputed per affected tissue_type"

  - entity: ImplantCase
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /tissue-bank/implant-cases/{id}/complete"
        actor: ImplantingSurgeon
        preconditions:
          - "ImplantCase.surgeon_id == X-User-ID (ERR_CASE_OWNERSHIP_VIOLATION)"
          - "ImplantCase status == SCHEDULED (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "status = COMPLETED"
          - "Cascade: every ACTIVE Reservation on this case -> RELEASED (release_reason = CASE_COMPLETED); its unit RESERVED -> AVAILABLE"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tissue-bank/implant-cases/{id}/cancel"
        actor: ImplantingSurgeon
        preconditions:
          - "ImplantCase.surgeon_id == X-User-ID (ERR_CASE_OWNERSHIP_VIOLATION)"
          - "ImplantCase status == SCHEDULED (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "status = CANCELLED"
          - "Cascade: every ACTIVE Reservation on this case -> RELEASED (release_reason = CASE_CANCELLED); its unit RESERVED -> AVAILABLE"

  - entity: Reservation
    initial_state: ACTIVE
    terminal_states: [RELEASED, FULFILLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /tissue-bank/reservations/{id}/release"
        actor: TissueBankCoordinator
        preconditions:
          - "Reservation status == ACTIVE (ERR_RESERVATION_NOT_ACTIVE)"
        side_effects:
          - "status = RELEASED; release_reason = MANUAL"
          - "Unit RESERVED -> AVAILABLE"
      - from: ACTIVE
        to: RELEASED
        trigger: "system (excursion opens on reserved unit's freezer, recall sweep matches reserved unit, or implant case cancelled/completed)"
        actor: system
        preconditions:
          - "Reservation status == ACTIVE"
        side_effects:
          - "status = RELEASED; release_reason = EXCURSION | RECALL | CASE_CANCELLED | CASE_COMPLETED"
          - "Unit RESERVED -> QUARANTINED (for EXCURSION/RECALL) or -> AVAILABLE (for CASE_*)"
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (unit issued via POST /tissue-units/{id}/issue with this reservation_id)"
        actor: system
        preconditions:
          - "Reservation status == ACTIVE"
        side_effects:
          - "status = FULFILLED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: clock > hold_until, or reserved unit reached EXPIRED)"
        actor: system
        preconditions:
          - "Reservation status == ACTIVE"
        side_effects:
          - "status = EXPIRED; release_reason = CLOCK_EXPIRED"
          - "If unit still RESERVED: unit -> AVAILABLE (hold_until path); if unit itself expired, unit -> EXPIRED (expiration path)"

  - entity: Recall
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tissue-bank/recalls/{id}/activate"
        actor: QualityManager
        preconditions:
          - "Recall status == DRAFT (ERR_RECALL_INVALID_STATE)"
        side_effects:
          - "status = ACTIVE; activated_at = clock"
          - "Sweep (deterministic order: received_at ASC, then created_at ASC): units matching supplier_id AND lot_number IN lot_numbers AND received_at IN [received_window_start, received_window_end]:"
          - "  status AVAILABLE -> QUARANTINED (hold_reason = RECALL)"
          - "  status RESERVED -> QUARANTINED (hold_reason = RECALL) AND ACTIVE Reservation -> RELEASED (release_reason = RECALL)"
          - "  status QUARANTINED with hold_reason NONE -> hold_reason = RECALL"
          - "  status ISSUED -> recall_flag = true"
          - "affected_unit_count = number of units matching scope (any status)"
          - "If zero units matched: recall transitions immediately to CLOSED with closure_reason = NO_MATCH (auto-transition)"
          - "Supplier qualification scores recomputed (active_recalls term)"
          - "If supplier qualification_score_provisional < 60 and supplier QUALIFIED: supplier auto-SUSPENDED"
      - from: DRAFT
        to: CLOSED
        trigger: "system (auto at activation when scope matched zero units)"
        actor: system
        preconditions:
          - "activation sweep found zero matching units"
        side_effects:
          - "status = CLOSED; closure_reason = NO_MATCH"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /tissue-bank/recalls/{id}/close"
        actor: QualityManager
        preconditions:
          - "Recall status == ACTIVE (ERR_RECALL_INVALID_STATE)"
          - "Zero units matching recall scope remain with status == QUARANTINED and hold_reason == RECALL (ERR_RECALL_UNRESOLVED_UNITS)"
        side_effects:
          - "status = CLOSED; closure_reason = RESOLVED"
          - "Supplier qualification scores recomputed (recall leaves the provisional active_recalls term)"

  - entity: AdverseReactionCase
    initial_state: REPORTED
    terminal_states: [CLOSED_CONFIRMED, CLOSED_UNCONFIRMED]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /tissue-bank/adverse-reactions/{id}/investigate"
        actor: ComplianceOfficer
        preconditions:
          - "Case status IN {REPORTED, REOPENED} (ERR_ADVERSE_INVALID_STATE)"
        side_effects:
          - "status = UNDER_INVESTIGATION"
      - from: REOPENED
        to: UNDER_INVESTIGATION
        trigger: "POST /tissue-bank/adverse-reactions/{id}/investigate"
        actor: ComplianceOfficer
        preconditions:
          - "Case status IN {REPORTED, REOPENED} (ERR_ADVERSE_INVALID_STATE)"
        side_effects:
          - "status = UNDER_INVESTIGATION"
      - from: UNDER_INVESTIGATION
        to: CLOSED_CONFIRMED
        trigger: "POST /tissue-bank/adverse-reactions/{id}/resolve with outcome = CONFIRMED"
        actor: ComplianceOfficer
        preconditions:
          - "Case status == UNDER_INVESTIGATION (ERR_ADVERSE_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != reporter_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "outcome_notes >= 10 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = CLOSED_CONFIRMED; investigator_user_id = X-User-ID"
          - "Cascade: supplier of the implicated unit gets confirmed_findings + 1 -> qualification_score_provisional/final recomputed (-20 each)"
          - "If supplier QUALIFIED and qualification_score_provisional < 60: supplier auto-SUSPENDED (cascade link 3)"
      - from: UNDER_INVESTIGATION
        to: CLOSED_UNCONFIRMED
        trigger: "POST /tissue-bank/adverse-reactions/{id}/resolve with outcome = UNCONFIRMED"
        actor: ComplianceOfficer
        preconditions:
          - "Case status == UNDER_INVESTIGATION (ERR_ADVERSE_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != reporter_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "outcome_notes >= 10 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = CLOSED_UNCONFIRMED; investigator_user_id = X-User-ID"
          - "Supplier scores recomputed (case leaves the provisional open_adverse term)"
      - from: CLOSED_CONFIRMED
        to: REOPENED
        trigger: "POST /tissue-bank/adverse-reactions/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "Case status IN {CLOSED_CONFIRMED, CLOSED_UNCONFIRMED} (ERR_ADVERSE_INVALID_STATE)"
          - "reopen_reason >= 10 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = REOPENED; reopened_count += 1"
          - "If prior status was CLOSED_CONFIRMED: supplier confirmed_findings - 1 -> scores recomputed (+20 each)"
      - from: CLOSED_UNCONFIRMED
        to: REOPENED
        trigger: "POST /tissue-bank/adverse-reactions/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "Case status IN {CLOSED_CONFIRMED, CLOSED_UNCONFIRMED} (ERR_ADVERSE_INVALID_STATE)"
          - "reopen_reason >= 10 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = REOPENED; reopened_count += 1"

  - entity: ParLevelPolicy
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (POST /par-level-policies for the same tissue_type succeeds)"
        actor: system
        preconditions:
          - "An existing ACTIVE policy for the same tissue_type and the create carried a matching expected_current_policy_version"
        side_effects:
          - "Prior policy status = SUPERSEDED; new policy ACTIVE"

  - entity: DispositionRecord
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /tissue-bank/disposition-records/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "Record status == DRAFT (ERR_DISPOSITION_INVALID_STATE)"
        side_effects:
          - "status = FINALIZED; finalized_at = clock; finalized_by_user_id = X-User-ID"
          - "Record becomes immutable; DELETE allowed only when clock >= finalized_at + 3650 days"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: freezer-config-stale-version
    parent_entity: Freezer
    write_endpoint: "PUT /tissue-bank/freezers/{id}"
    occ_field: expected_freezer_version
    description: |
      Updating a Freezer's temperature range or capacity with an
      expected_freezer_version that no longer matches Freezer.version is
      rejected. This captures the case where another writer has reconfigured
      the freezer (or a temperature-reading cascade bumped the version) since
      the client last observed it; the client's view of the safe range is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: par-policy-supersede-stale-version
    parent_entity: ParLevelPolicy
    write_endpoint: "POST /tissue-bank/par-level-policies"
    occ_field: expected_current_policy_version
    description: |
      Creating a ParLevelPolicy for a tissue_type that already has an ACTIVE
      policy supersedes that policy; the request is rejected when
      expected_current_policy_version does not match the currently ACTIVE
      policy's version (a missing field is treated as 0 and matches only when
      no ACTIVE policy exists for the tissue_type). This captures the case
      where another writer has just created a policy that legitimately
      supersedes the one the current client observed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: par-policy-update-stale-version
    parent_entity: ParLevelPolicy
    write_endpoint: "PUT /tissue-bank/par-level-policies/{id}"
    occ_field: expected_par_level_policy_version
    description: |
      Updating an ACTIVE ParLevelPolicy's thresholds with an
      expected_par_level_policy_version that no longer matches the policy's
      version is rejected; the client re-reads and retries against the current
      thresholds.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: inventory_valuation
    trigger: "GET /tissue-bank/inventory/valuation (computed on read, never stored)"
    algorithm: aggregation
    formula: |
      population = all TissueUnits with tissue_type == <param> whose
                   shipment.status == ACCEPTED (any unit status, including terminal)
      on_hand    = population subset with status IN {QUARANTINED, AVAILABLE, RESERVED, ISSUED}
      on_hand_count = len(on_hand)

      method = WEIGHTED_AVERAGE:
        avg_unit_cost = sum(unit_cost_cents over population) / len(population)   # exact rational, unrounded
        for each distinct lot_number L among on_hand (grouped, iterated by lot_number ASC):
          line_value(L) = round_half_up(avg_unit_cost * count(on_hand units with lot_number == L), 2 decimals)
        total_value = sum(line_value(L) over all lots)     # PINNED ORDER: round per-lot-line FIRST, then sum
        # The alternate order (round_half_up(avg_unit_cost * on_hand_count)) is FORBIDDEN:
        # e.g. costs 10001/10001/10002, on_hand 2 -> per-lot-line 20002.66 vs sum-then-round 20002.67.

      method = FIFO:
        consumed_count = len(population) - on_hand_count
        order population by received_at ASC, tie-break created_at ASC (never id)
        consumed = first consumed_count units of that order (oldest consumed first)
        total_value = sum(unit_cost_cents over population \\ consumed)           # exact integer cents
    input_set: "TissueUnits of one tissue_type with shipment.status == ACCEPTED; on-hand subset = status IN {QUARANTINED, AVAILABLE, RESERVED, ISSUED}"
    constants:
      ROUNDING: "round_half_up to 2 decimal places, applied per lot line, then summed"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: FIFO
        when: "method == FIFO"
        difference: "Values on-hand inventory at the costs of the most recently received units (oldest consumed first from the accepted population); exact integer-cents sum, no averaging"
      - name: WEIGHTED_AVERAGE
        when: "method == WEIGHTED_AVERAGE"
        difference: "Values every on-hand unit at the mean cost of the accepted population; per-lot-line rounding then sum; diverges from FIFO whenever receipt costs differ"

  - name: supplier_qualification_score
    trigger: "on any of: adverse-reaction resolve/reopen, recall activate/close, document clock-expiry, supplier read (computed on read, stored fields updated on the triggering mutations)"
    algorithm: aggregation
    formula: |
      Let for supplier S:
        confirmed_findings = count(AdverseReactionCase status == CLOSED_CONFIRMED
                                   whose tissue_unit.supplier_id == S.id)
        open_adverse       = count(AdverseReactionCase status IN {REPORTED, UNDER_INVESTIGATION, REOPENED}
                                   whose tissue_unit.supplier_id == S.id)
        active_recalls     = count(Recall supplier_id == S.id AND status == ACTIVE)
        expired_doc_events = count(SupplierDocument supplier_id == S.id AND status == EXPIRED)
      qualification_score_final       = max(0, 100 - 20*confirmed_findings - 5*expired_doc_events)
      qualification_score_provisional = max(0, 100 - 20*confirmed_findings - 15*active_recalls
                                                   - 10*open_adverse - 5*expired_doc_events)
      Auto-suspension gate (evaluated on every score mutation):
        if S.status == QUALIFIED and qualification_score_provisional < 60: S -> SUSPENDED
    input_set: "AdverseReactionCase linked via TissueUnit.supplier_id; Recall by supplier_id; SupplierDocument by supplier_id — status filters as pinned per variant"
    constants:
      CONFIRMED_FINDING_PENALTY: 20
      ACTIVE_RECALL_PENALTY: 15
      OPEN_ADVERSE_PENALTY: 10
      EXPIRED_DOC_PENALTY: 5
      SUSPENSION_THRESHOLD: 60
    precision: "integer points, floor at 0"
    variants:
      - name: provisional
        when: "field qualification_score_provisional"
        difference: "Counts open investigations (REPORTED/UNDER_INVESTIGATION/REOPENED) at -10 and ACTIVE recalls at -15; used for the auto-suspension gate"
      - name: final
        when: "field qualification_score_final"
        difference: "Counts only terminal confirmed findings (-20) and expired-document events (-5); open cases and active recalls contribute nothing"

  - name: excursion_severity_score
    trigger: "computed on read of a TemperatureExcursion and at resolve time (gates the RELEASE disposition)"
    algorithm: weighted_scoring
    formula: |
      Let E = excursion, F = E.freezer:
        deviation_pts = min(40, ceil(E.max_deviation_celsius) * 8)
        duration_minutes = floor((coalesce(E.resolved_at, clock) - E.opened_at) in minutes)
        duration_pts = min(30, (duration_minutes // 60) * 6)          # full hours only
        affected = count(TissueUnit in F with hold_reason == EXCURSION)
        unit_pts = min(20, affected * 2)
        max_tier = highest criticality_tier among affected units (CRITICAL > SENSITIVE > STANDARD);
                   0 units -> STANDARD
        tier_pts = 0 if max_tier == STANDARD; 5 if SENSITIVE; 10 if CRITICAL
      severity_score = deviation_pts + duration_pts + unit_pts + tier_pts      # 0..100
      severity_class = LOW if severity_score < 25
                       MEDIUM if 25 <= severity_score <= 59
                       HIGH if severity_score >= 60
      HIGH excursions reject disposition = RELEASE (ERR_SEVERITY_REQUIRES_DESTROY).
    input_set: "Readings linked to the excursion (excursion_id), units in the freezer with hold_reason == EXCURSION"
    constants:
      DEVIATION_CAP_PTS: 40
      DEVIATION_PTS_PER_DEGREE: 8
      DURATION_CAP_PTS: 30
      DURATION_PTS_PER_HOUR: 6
      UNIT_CAP_PTS: 20
      UNIT_PTS_EACH: 2
      TIER_PTS: { STANDARD: 0, SENSITIVE: 5, CRITICAL: 10 }
      HIGH_THRESHOLD: 60
      MEDIUM_THRESHOLD: 25
    precision: "integer points; duration truncated to whole hours before scoring"

  - name: storage_capacity_gating
    trigger: "shipment creation (storing N units), return-to-stock (storing 1 unit), freezer reconfiguration (PUT)"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (circular-looking dependency made explicit):
        1. occupied_count   = count(units in freezer with status IN {QUARANTINED, AVAILABLE, RESERVED})
        2. utilization_pct  = occupied_count / nominal_capacity * 100
        3. quarantine_reserve_slots = 2 if utilization_pct >= 80.0 else 0
        4. effective_capacity = nominal_capacity - quarantine_reserve_slots
        5. Admission rule: storing N additional units requires occupied_count + N <= effective_capacity
           (equality admitted); otherwise ERR_FREEZER_CAPACITY_EXCEEDED.
      Reconfiguration rule: new nominal_capacity must satisfy occupied_count <=
      nominal_capacity - reserve(new utilization) else ERR_CAPACITY_BELOW_OCCUPIED.
      Note the dependency: utilization (step 2) drives reserve (step 3) which gates
      admissions that themselves change occupied_count (step 1) — evaluate strictly
      in the numbered order; never iterate to a fixed point.
    input_set: "Units in the freezer with status IN {QUARANTINED, AVAILABLE, RESERVED}"
    constants:
      RESERVE_TRIGGER_UTILIZATION_PCT: 80.0
      RESERVED_SLOTS: 2
    precision: "utilization_pct 2 decimal places; counts integer"

  - name: par_level_deficit
    trigger: "computed on read of ParLevelPolicy; recomputed (stored) on any unit status mutation affecting the tissue_type"
    algorithm: threshold
    formula: |
      on_hand_available = count(TissueUnit with tissue_type == policy.tissue_type AND status == AVAILABLE)
      deficit = max(0, par_quantity - on_hand_available)
      needs_reorder = (on_hand_available < par_quantity)        # strict <; equality means NO reorder
    input_set: "Only status == AVAILABLE units count — QUARANTINED, RESERVED, ISSUED and all terminal states are excluded"
    constants:
      REORDER_COMPARATOR: "strictly less than"
    precision: "integer counts"

  - name: expiration_sweep
    trigger: "POST /_clock/set_current_utc (sweep executed synchronously after the clock moves forward)"
    algorithm: chronological
    formula: |
      For every TissueUnit with status IN {QUARANTINED, AVAILABLE, RESERVED}
      and clock > expiration_at (STRICTLY greater; clock == expiration_at remains usable),
      processed in order received_at ASC, tie-break created_at ASC:
        unit -> EXPIRED; hold_reason = NONE
        if unit was RESERVED: its ACTIVE Reservation -> EXPIRED (release_reason = CLOCK_EXPIRED)
        create DRAFT DispositionRecord (EXPIRED)
      ISSUED units are NOT swept (clinical custody overrides expiry; they may still
      be implanted or returned-to-supplier, but return-to-stock re-checks ERR_UNIT_EXPIRED).
    input_set: "TissueUnits status IN {QUARANTINED, AVAILABLE, RESERVED}, clock-ordered"
    precision: "datetime comparison at second precision"

  - name: document_expiry_sweep
    trigger: "POST /_clock/set_current_utc (sweep executed synchronously after the clock moves forward)"
    algorithm: chronological
    formula: |
      For every SupplierDocument with status == VERIFIED and clock > valid_to
      (STRICTLY greater; clock == valid_to remains VERIFIED), ordered by valid_to ASC,
      tie-break created_at ASC:
        document -> EXPIRED
        if doc_type IN {AATB_ACCREDITATION, FDA_REGISTRATION} and the supplier has no other
          VERIFIED document of the same doc_type with valid_to >= clock:
          supplier QUALIFIED -> SUSPENDED (auto-suspension cascade)
      Reservation sweep also runs on the same clock-set: ACTIVE reservations with
      clock > hold_until -> EXPIRED (release_reason = CLOCK_EXPIRED), unit RESERVED -> AVAILABLE.
      Sweep order pinned: documents first, then units, then reservations.
    input_set: "SupplierDocuments status == VERIFIED with clock > valid_to; then units; then reservations"
    precision: "datetime comparison at second precision"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role must be one of the five declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role must be listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path identifiers must resolve, validated left-to-right (parent segment before child segment)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 3.5
    category: state
    check: "OCC: expected_*_version fields, when present or required, must equal the guarded entity's current version (missing expected_current_policy_version is treated as 0); evaluated BEFORE any business rule"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /tissue-bank/freezers/{id}; POST /tissue-bank/par-level-policies; PUT /tissue-bank/par-level-policies/{id}"
  - priority: 4
    category: state
    check: "Target entity must be in a state from which the requested transition exists (per §1.2), e.g. ERR_UNIT_NOT_ISSUABLE_STATE, ERR_SHIPMENT_NOT_RECEIVED, ERR_EXCURSION_INVALID_STATE, ERR_SUPPLIER_INVALID_STATE, ERR_CASE_INVALID_STATE, ERR_RESERVATION_NOT_ACTIVE, ERR_RECALL_INVALID_STATE, ERR_ADVERSE_INVALID_STATE, ERR_DISPOSITION_INVALID_STATE, ERR_DOCUMENT_INVALID_STATE"
    error_id: "ERR_*_STATE / ERR_*_NOT_*"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Compliance gates: supplier QUALIFIED and required documents VERIFIED (ERR_SUPPLIER_NOT_QUALIFIED, ERR_REQUIRED_DOCUMENTS_NOT_VERIFIED); unit not expired (ERR_UNIT_EXPIRED); no ACTIVE recall match (ERR_UNIT_UNDER_ACTIVE_RECALL); freezer not in excursion (ERR_FREEZER_IN_EXCURSION); HIGH-severity excursion must resolve DESTROY (ERR_SEVERITY_REQUIRES_DESTROY)"
    error_id: "ERR_SUPPLIER_NOT_QUALIFIED | ERR_REQUIRED_DOCUMENTS_NOT_VERIFIED | ERR_UNIT_EXPIRED | ERR_UNIT_UNDER_ACTIVE_RECALL | ERR_FREEZER_IN_EXCURSION | ERR_SEVERITY_REQUIRES_DESTROY"
    http_status: 403
    applies_to: "release, issue, return-to-stock, accept, shipment create, approve, reinstate, excursion resolve"
  - priority: 6
    category: business_temporal
    check: "Temporal gates: implant window [scheduled_start - 1h, scheduled_end + 24h] (ERR_IMPLANT_WINDOW_CLOSED); reservation requires unit expiration_at > case scheduled_end (ERR_UNIT_EXPIRES_BEFORE_CASE); disposition DELETE requires clock >= finalized_at + 3650 days (ERR_RETENTION_PERIOD_ACTIVE)"
    error_id: "ERR_IMPLANT_WINDOW_CLOSED | ERR_UNIT_EXPIRES_BEFORE_CASE | ERR_RETENTION_PERIOD_ACTIVE"
    http_status: 409
    applies_to: "record-implantation, reservation create, disposition delete, case create, document create, recall create"
  - priority: 7
    category: business_constraint
    check: "Structural constraints: OR-room half-open overlap (ERR_OR_ROOM_DOUBLE_BOOKED); supplier document closed-interval overlap per supplier+doc_type (ERR_DOC_VALIDITY_OVERLAP); freezer capacity incl. quarantine reserve (ERR_FREEZER_CAPACITY_EXCEEDED, ERR_CAPACITY_BELOW_OCCUPIED); segregation of duties (ERR_SEGREGATION_OF_DUTIES); uniqueness: supplier.license_number, freezer.name, serial_number within shipment (ERR_DUPLICATE_VALUE)"
    error_id: "ERR_OR_ROOM_DOUBLE_BOOKED | ERR_DOC_VALIDITY_OVERLAP | ERR_FREEZER_CAPACITY_EXCEEDED | ERR_CAPACITY_BELOW_OCCUPIED | ERR_SEGREGATION_OF_DUTIES | ERR_DUPLICATE_VALUE"
    http_status: 409
    applies_to: "case create, document create, shipment create, freezer create/update, return-to-stock, supplier approve, excursion resolve, adverse resolve"
  - priority: 8
    category: business_referential
    check: "Cross-entity referential integrity: reservation's unit matches (ERR_RESERVATION_UNIT_MISMATCH); unit issued via reservation on a different case (ERR_UNIT_ISSUED_TO_ANOTHER_CASE); adverse reaction's unit must be IMPLANTED on this case (ERR_UNIT_NOT_IMPLANTED_ON_CASE)"
    error_id: "ERR_RESERVATION_UNIT_MISMATCH | ERR_UNIT_ISSUED_TO_ANOTHER_CASE | ERR_UNIT_NOT_IMPLANTED_ON_CASE"
    http_status: 422
    applies_to: "issue, record-implantation, adverse-reaction create"
  - priority: 9
    category: business_fiscal
    check: "Fiscal caps: shipment accept projects WEIGHTED_AVERAGE valuation per tissue_type (including incoming units) and rejects when it would exceed the ACTIVE policy's max_inventory_value_cents (ERR_INVENTORY_VALUE_CAP_EXCEEDED); tissue_types without an ACTIVE policy are uncapped"
    error_id: ERR_INVENTORY_VALUE_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /tissue-bank/shipments/{id}/accept"
  - priority: 3.4
    category: existence
    check: "Request-shape validation: required fields present, types correct, enum members valid, strings >= min length where specified, arrays non-empty where specified; window/range sanity (scheduled_end > scheduled_start, valid_to >= valid_from, received_window_end >= received_window_start -> ERR_INVALID_WINDOW; min_celsius < max_celsius -> ERR_INVALID_TEMP_RANGE)"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_WINDOW | ERR_INVALID_TEMP_RANGE"
    http_status: 400
    applies_to: "all endpoints with a request body"
    note: "Pinned position: malformed body (ERR_INVALID_REQUEST) is reported only after headers (1,2) and path existence (3) pass, but before OCC (3.5) and state machine preconditions (4). Full order: 1 auth-header, 2 auth-role, 3 existence, 3.4 request-shape, 3.5 OCC, 4 state, 5 safety, 6 temporal, 7 constraint, 8 referential, 9 fiscal."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; declared per §1.5 priority ladder rung 3) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default (before any set) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Synchronously runs, in order: document_expiry_sweep, expiration_sweep (units), reservation expiry sweep."
    roles: [SupplyChainAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, documents_expired: integer, units_expired: integer, reservations_expired: integer, suppliers_auto_suspended: integer }"
    side_effects: ["document_expiry_sweep", "expiration_sweep", "reservation expiry sweep", "cascaded auto-suspensions"]

  # --- Suppliers & documents ---
  - method: POST
    path: "/tissue-bank/suppliers"
    description: "Register a supplier (PENDING_QUALIFICATION)"
    roles: [QualityManager]
    code: 201
    input: [legal_name, license_number]
    output: Supplier
    side_effects: []
  - method: GET
    path: "/tissue-bank/suppliers"
    description: "List suppliers; filters status?; sorted by created_at ASC, tie-break license_number ASC"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: ["status?"]
    output: "Supplier[]"
    side_effects: []
  - method: GET
    path: "/tissue-bank/suppliers/{id}"
    description: "Get supplier incl. computed qualification_score_provisional / qualification_score_final"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - method: POST
    path: "/tissue-bank/suppliers/{id}/approve"
    description: "Qualify a supplier; SoD: approver != verifier of the most recently verified required-type document"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status -> QUALIFIED"]
  - method: POST
    path: "/tissue-bank/suppliers/{id}/suspend"
    description: "Manually suspend a QUALIFIED supplier"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/tissue-bank/suppliers/{id}/reinstate"
    description: "Reinstate a SUSPENDED supplier (documents + score gates)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status -> QUALIFIED"]
  - method: POST
    path: "/tissue-bank/suppliers/{id}/disqualify"
    description: "Permanently disqualify (terminal) from PENDING_QUALIFICATION or SUSPENDED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status -> DISQUALIFIED"]
  - method: GET
    path: "/tissue-bank/suppliers/{id}/documents"
    description: "List a supplier's documents; sorted by created_at ASC, tie-break document_ref ASC; filter doc_type?"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: ["doc_type?"]
    output: "SupplierDocument[]"
    side_effects: []
  - method: POST
    path: "/tissue-bank/suppliers/{id}/documents"
    description: "Submit a regulatory document; closed-interval [valid_from, valid_to] overlap with any SUBMITTED/VERIFIED doc of same supplier+doc_type is rejected (touching endpoints DO conflict)"
    roles: [QualityManager]
    code: 201
    input: [doc_type, document_ref, valid_from, valid_to]
    output: SupplierDocument
    side_effects: []
  - method: POST
    path: "/tissue-bank/suppliers/{id}/documents/{docId}/verify"
    description: "Verify a SUBMITTED document"
    roles: [QualityManager]
    code: 200
    input: []
    output: SupplierDocument
    side_effects: ["status -> VERIFIED; verified_by_user_id = X-User-ID"]
  - method: POST
    path: "/tissue-bank/suppliers/{id}/documents/{docId}/reject"
    description: "Reject a SUBMITTED document"
    roles: [QualityManager]
    code: 200
    input: []
    output: SupplierDocument
    side_effects: ["status -> REJECTED"]
  - method: GET
    path: "/tissue-bank/suppliers/{id}/shipments"
    description: "List shipments from a supplier; sorted by created_at ASC"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: "Shipment[]"
    side_effects: []
  - method: GET
    path: "/tissue-bank/suppliers/{id}/recalls"
    description: "List recalls scoped to a supplier; sorted by created_at ASC"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: "Recall[]"
    side_effects: []

  # --- Shipments & tissue units ---
  - method: POST
    path: "/tissue-bank/shipments"
    description: "Receive a shipment; mints one TissueUnit per manifest line in QUARANTINED; supplier must be QUALIFIED; freezer must admit len(items) under effective_capacity"
    roles: [TissueBankCoordinator]
    code: 201
    input: [supplier_id, freezer_id, items]
    output: Shipment
    side_effects: ["TissueUnit children created (QUARANTINED, hold_reason NONE)", "Freezer.occupied_count recomputed"]
  - method: GET
    path: "/tissue-bank/shipments/{id}"
    description: "Get a shipment"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: "/tissue-bank/shipments/{id}/accept"
    description: "Accept a RECEIVED shipment after inspection (supplier qualification + docs + fiscal cap gates)"
    roles: [TissueBankCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> ACCEPTED", "units enter valuation population"]
  - method: POST
    path: "/tissue-bank/shipments/{id}/reject"
    description: "Reject a RECEIVED shipment; units -> RETURNED_TO_SUPPLIER with DRAFT disposition records"
    roles: [TissueBankCoordinator]
    code: 200
    input: [rejection_reason]
    output: Shipment
    side_effects: ["status -> REJECTED", "units -> RETURNED_TO_SUPPLIER", "DRAFT DispositionRecords created"]
  - method: GET
    path: "/tissue-bank/tissue-units"
    description: "List units; filters supplier_id?, freezer_id?, shipment_id?, status?, tissue_type?, lot_number?, implanted_case_id?; sorted by serial_number ASC"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: ["supplier_id?", "freezer_id?", "shipment_id?", "status?", "tissue_type?", "lot_number?", "implanted_case_id?"]
    output: "TissueUnit[]"
    side_effects: []
  - method: GET
    path: "/tissue-bank/tissue-units/{id}"
    description: "Get a tissue unit"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: TissueUnit
    side_effects: []
  - method: POST
    path: "/tissue-bank/tissue-units/{id}/release"
    description: "QC-release a QUARANTINED unit to AVAILABLE (all compliance gates re-checked)"
    roles: [QualityManager]
    code: 200
    input: []
    output: TissueUnit
    side_effects: ["status QUARANTINED -> AVAILABLE"]
  - method: POST
    path: "/tissue-bank/tissue-units/{id}/hold"
    description: "Manually quarantine an AVAILABLE unit (hold_reason = MANUAL)"
    roles: [QualityManager]
    code: 200
    input: []
    output: TissueUnit
    side_effects: ["status AVAILABLE -> QUARANTINED"]
  - method: POST
    path: "/tissue-bank/tissue-units/{id}/issue"
    description: "Issue a unit to the OR; direct from AVAILABLE, or against an ACTIVE reservation via reservation_id"
    roles: [TissueBankCoordinator]
    code: 200
    input: ["reservation_id?"]
