# =============================================================================
# Task 1666 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over every testable claim in SCAFFOLD.yaml §1.1-§1.7 that §1.8
# does not already cover. excluded_because stubs cite §1.8 instances by name.
# Logical clock default at server start: 2026-08-01T00:00:00Z (Saturday).
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: program_creation_applies_defaults
        claim_type: defaults_applied
        grounds: [entities.Program]
        distinguishing_aspect: "POST /api/programs with only required fields yields the documented defaults and zeroed counters."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: ProgramCoordinator }
          assert:
            - "max_reserve_slots == 5, no_answer_threshold == 3, escalation_retry_hours == 4, contact_phase_hours == 24"
            - "offer_ttl_hours == 72, reapply_cooling_days == 30, survey_valid_days == 30, doc_buffer_minutes == 15"
            - "intake_posture == OPEN, occupied_slots == 0, waiting_count == 0, promotion_epoch == 0, version == 1"

      - name: program_created_at_shows_clock_default
        claim_type: system_fields
        grounds: [entities.Program, endpoints]
        distinguishing_aspect: "Before any set_current_utc call the logical clock is exactly 2026-08-01T00:00:00Z, so the first created entity carries that created_at (ISO8601 UTC, three fractional digits)."
        test_recipe:
          setup: ["Empty database; no clock call made"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator, captures: { ts: $.data.created_at } }
          trigger: []
          assert:
            - "created_at == 2026-08-01T00:00:00.000Z (clock default, not wall clock)"
            - "id matches the prefix-less UUID shape; version == 1"

      - name: participant_creation_initial_state
        claim_type: creation
        grounds: [entities.Participant, state_machines.Participant]
        distinguishing_aspect: "New participant starts APPLICANT with zeroed/cleared computed fields; acuity is null until submit-review."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "Init P", date_of_birth: "1952-03-01", phone: "555-4000", address: "1 Init Rd", referral_source: "FAMILY", age_band: "AGE_75_84", lives_alone: true, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p_id: $.data.id, st: $.data.status } }
          trigger: []
          assert:
            - "st == APPLICANT; consecutive_no_answer_count == 0; coverage_deficient == false"
            - "acuity_score == null, rolling_acuity_score == null, open_escalation_id == null, enrolled_at == null"
            - "primary_language defaulted to 'en'"

      - name: emergency_contact_defaults_and_immutable_rank
        claim_type: defaults_applied
        grounds: [entities.EmergencyContact]
        distinguishing_aspect: "Omitting accepts_24h defaults it to false; status starts ACTIVE."
        test_recipe:
          setup: ["Program; APPLICANT participant"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "EC P", date_of_birth: "1952-03-02", phone: "555-4001", address: "2 Init Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "Kin", phone: "555-4002", relationship: "niece", contact_rank: "SECONDARY" }, as: IntakeWorker, captures: { c24: $.data.accepts_24h, cst: $.data.status } }
          assert:
            - "c24 == false (default applied) and cst == ACTIVE"

      - name: schedule_window_below_minimum_returns_invalid_request
        claim_type: type_constraint
        grounds: [entities.CallSchedule, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A 10-minute schedule window violates the 15..120 minute constraint; window_start >= window_end is equally rejected."
        test_recipe:
          setup: ["Program; ENROLLED participant"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "Sch P", date_of_birth: "1952-03-03", phone: "555-4003", address: "3 Init Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "Kin", phone: "555-4004", relationship: "niece", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/approve", payload: {}, as: IntakeWorker }
          trigger:
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "MON", window_start: "09:00", window_end: "09:10" }, as: ProgramCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "TUE", window_start: "10:00", window_end: "09:00" }, as: ProgramCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (10 minutes < 15-minute minimum)"
            - "err2 == ERR_INVALID_REQUEST (window_start >= window_end)"

      - name: volunteer_max_weekly_minutes_out_of_range_rejected
        claim_type: type_constraint
        grounds: [entities.VolunteerCaller, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "max_weekly_minutes 30 is below the 60..600 range; 600 is accepted at the inclusive upper bound."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /api/volunteers", payload: { full_name: "Vol Min", phone: "555-4005", max_weekly_minutes: 30 }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/volunteers", payload: { full_name: "Vol Max", phone: "555-4006", max_weekly_minutes: 600 }, as: ProgramCoordinator, captures: { v_ok: $.data.id } }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "v_ok created with max_weekly_minutes == 600"

      - name: survey_return_wrong_item_shape_rejected
        claim_type: type_constraint
        grounds: [entities.SatisfactionSurvey, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "items must be exactly 5 integers each in 1..5: a 4-element array and a 0/6 value are both ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Program; ENROLLED participant; ISSUED survey for 2026-08"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "Srv P", date_of_birth: "1952-03-04", phone: "555-4007", address: "4 Init Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "Kin", phone: "555-4008", relationship: "niece", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/satisfaction-surveys", payload: { period_month: "2026-08" }, as: IntakeWorker, captures: { surv: $.data.id } }
          trigger:
            - { call: "POST /api/satisfaction-surveys/${surv}/return", payload: { items: [4, 3, 5, 2] }, as: IntakeWorker, captures: { err1: $.data.error_id } }
            - { call: "POST /api/satisfaction-surveys/${surv}/return", payload: { items: [4, 3, 5, 2, 6] }, as: IntakeWorker, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (exactly 5 items required)"
            - "err2 == ERR_INVALID_REQUEST (item value 6 out of 1..5)"
            - "Survey remains ISSUED after both rejections (no partial mutation)"

      - name: participant_get_unknown_id_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
          trigger:
            - { call: "GET /api/participants/00000000-0000-0000-0000-000000000000", payload: {}, as: IntakeWorker, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND with HTTP 404"

      - name: participants_list_pagination_window
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "limit/offset paging exposes total_count and has_more per the fixed envelope defaults (default limit 10)."
        test_recipe:
          setup: ["Program; three APPLICANT participants"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "Pg1", date_of_birth: "1952-04-01", phone: "555-4101", address: "1 Page Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker }
            - { call: "POST /api/participants", payload: { full_name: "Pg2", date_of_birth: "1952-04-02", phone: "555-4102", address: "2 Page Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker }
            - { call: "POST /api/participants", payload: { full_name: "Pg3", date_of_birth: "1952-04-03", phone: "555-4103", address: "3 Page Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker }
          trigger:
            - { call: "GET /api/participants?limit=2&offset=0", payload: {}, as: IntakeWorker }
            - { call: "GET /api/participants?limit=2&offset=2", payload: {}, as: IntakeWorker }
          assert:
            - "Page 1: response_type == array, 2 data rows, total_count == 3, has_more == true"
            - "Page 2: 1 data row, total_count == 3, has_more == false"

      - name: participant_create_with_computed_extra_field_rejected
        claim_type: computed_fields
        grounds: [entities.Participant, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied computed fields (acuity_score) are unknown input keys and rejected, never silently honored."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /api/participants", payload: { full_name: "Sneak", date_of_birth: "1952-04-04", phone: "555-4104", address: "4 Page Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false, acuity_score: 99 }, as: IntakeWorker, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (unknown/computed field in input)"

      - name: agreement_signing_supersedes_prior_active
        claim_type: creation
        grounds: [entities.ConfidentialityAgreement, state_machines.ConfidentialityAgreement.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Signing a second agreement atomically SUPERSEDES the first — exactly one ACTIVE agreement per volunteer is conserved."
        test_recipe:
          setup: ["Program; volunteer registered"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers", payload: { full_name: "Vol Ag", phone: "555-4200" }, as: ProgramCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/confidentiality-agreements", payload: { policy_version: "v2026.1", valid_until: "2027-01-01T00:00:00Z" }, as: VolunteerCaller, as_user_id: "${v_id}", captures: { ag1: $.data.id } }
          trigger:
            - { call: "POST /api/volunteers/${v_id}/confidentiality-agreements", payload: { policy_version: "v2026.1", valid_until: "2027-06-01T00:00:00Z" }, as: VolunteerCaller, as_user_id: "${v_id}", captures: { ag2: $.data.id } }
            - { call: "GET /api/volunteers/${v_id}/confidentiality-agreements", payload: {}, as: ProgramCoordinator }
          assert:
            - "agreement ${ag1}.status == SUPERSEDED; agreement ${ag2}.status == ACTIVE"
            - "Exactly one ACTIVE agreement exists for volunteer ${v_id}"

      - name: training_record_status_computed_against_clock
        claim_type: computed_fields
        grounds: [entities.TrainingRecord]
        distinguishing_aspect: "status is derived from valid_until vs the logical clock: a record expiring in the past reads EXPIRED at creation time."
        test_recipe:
          setup: ["Program; volunteer; clock at 2026-08-01 (default)"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers", payload: { full_name: "Vol Tr", phone: "555-4201" }, as: ProgramCoordinator, captures: { v_id: $.data.id } }
          trigger:
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "LISTENING_SKILLS", completed_at: "2026-01-01T00:00:00Z", valid_until: "2026-07-01T00:00:00Z" }, as: ProgramCoordinator, captures: { st: $.data.status } }
          assert:
            - "st == EXPIRED (valid_until 2026-07-01 < clock 2026-08-01) — status is computed, never taken from input"

      - name: outcome_report_created_provisional_mid_period
        claim_type: creation
        grounds: [entities.OutcomeReport, state_machines.OutcomeReport]
        distinguishing_aspect: "A report generated while the period is open starts PROVISIONAL with provisional-variant metrics."
        test_recipe:
          setup: ["Program; clock 2026-08-15 mid-period"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /api/programs/${prog_id}/outcome-reports", payload: { period_month: "2026-08" }, as: QualityReviewer, captures: { st: $.data.status, rate: $.data.completion_rate } }
          assert:
            - "st == PROVISIONAL and rate == null (zero denominators: no assignments in period)"
            - "calls_scheduled == 0, escalations_opened == 0, satisfaction_index == null"

      - name: call_log_concern_flag_computed_two_ways
        claim_type: computed_fields
        grounds: [entities.CallLog.fields.concern_flag]
        distinguishing_aspect: "concern_flag is true iff outcome == REACHED_CONCERN OR concern_level != NONE — both paths verified; input cannot set concern_flag directly."
        test_recipe:
          setup: ["Program; ENROLLED participant with MON schedule; certified volunteer; two assignments on 2026-08-03"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 10, current_policy_version: "v2026.1" }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "CF P", date_of_birth: "1952-04-05", phone: "555-4105", address: "5 Page Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "Kin", phone: "555-4106", relationship: "niece", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "MON", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers", payload: { full_name: "Vol CF", phone: "555-4107" }, as: ProgramCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/begin-training", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "SAFETY_PROTOCOL", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "LISTENING_SKILLS", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "MANDATED_REPORTING", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/confidentiality-agreements", payload: { policy_version: "v2026.1", valid_until: "2027-08-01T00:00:00Z" }, as: VolunteerCaller, as_user_id: "${v_id}" }
            - { call: "POST /api/volunteers/${v_id}/certify", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "MON", window_start: "08:00", window_end: "17:00", effective_from: "2026-08-01" }, as: ProgramCoordinator }
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "09:00", window_end: "09:30" }, as: ProgramCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "10:00", window_end: "10:30" }, as: ProgramCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T11:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /api/call-assignments/${a1}/call-logs", payload: { called_at: "2026-08-03T09:05:00Z", duration_seconds: 100, outcome: "REACHED_CONCERN" }, as: VolunteerCaller, as_user_id: "${v_id}", captures: { f1: $.data.concern_flag } }
            - { call: "POST /api/call-assignments/${a2}/call-logs", payload: { called_at: "2026-08-03T10:05:00Z", duration_seconds: 100, outcome: "REACHED_OK", concern_level: "ROUTINE", concern_categories: ["MOOD"] }, as: VolunteerCaller, as_user_id: "${v_id}", captures: { f2: $.data.concern_flag } }
          assert:
            - "f1 == true (outcome REACHED_CONCERN alone suffices, concern_level defaulted NONE)"
            - "f2 == true (concern_level ROUTINE on a REACHED_OK outcome)"

      - name: waitlist_entry_created_with_zeroed_counters
        claim_type: creation
        grounds: [entities.WaitlistEntry]
        distinguishing_aspect: "The capacity-branch waitlist creates a WAITING entry with waitlist_entered_at set and declines_count/expires_count at 0."
        test_recipe:
          setup: ["Program cap 1; filler enrolled; applicant approved into the waitlist"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 1, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "Fill", date_of_birth: "1952-04-06", phone: "555-4108", address: "6 Page Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { pf: $.data.id } }
            - { call: "POST /api/participants/${pf}/emergency-contacts", payload: { full_name: "Kin", phone: "555-4109", relationship: "niece", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${pf}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pf}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants", payload: { full_name: "Wait P", date_of_birth: "1952-04-07", phone: "555-4110", address: "7 Page Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 0, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { pw: $.data.id } }
            - { call: "POST /api/participants/${pw}/emergency-contacts", payload: { full_name: "Kin", phone: "555-4111", relationship: "niece", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${pw}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pw}/approve", payload: {}, as: IntakeWorker }
          trigger:
            - { call: "GET /api/participants/${pw}/waitlist-entries", payload: {}, as: IntakeWorker, captures: { est: "$.data[0].status", edc: "$.data[0].declines_count" } }
          assert:
            - "est == WAITING, declines_count == 0, expires_count == 0, offered_at == null, priority_score_at_offer == null"
            - "waitlist_entered_at == 2026-08-01T00:00:00.000Z (clock at approve time)"

      - name: availability_overlap_checks_effective_range_dimension
        claim_type: type_constraint
        grounds: [entities.AvailabilityWindow, "errors[ERR_AVAILABILITY_OVERLAP]"]
        distinguishing_aspect: "Overlap requires BOTH same weekday AND intersecting effective date ranges: MON 08:00-10:00 effective August vs MON 09:00-11:00 effective from September never collide."
        test_recipe:
          setup: ["Program; volunteer with MON 08:00-10:00 window effective 2026-08-01..2026-08-31"]
          setup_api_calls:
