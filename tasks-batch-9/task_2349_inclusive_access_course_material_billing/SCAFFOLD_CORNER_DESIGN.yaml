          - state_machines.DisclosureReport.CERTIFIED_to_PUBLISHED
        distinguishing_aspect: |
          Settlement is refused with ERR_TERM_NOT_LOCKED while the term is OPEN even though the
          variance is 0 and therefore passes the tolerance gate at 106; after lock-billing the same
