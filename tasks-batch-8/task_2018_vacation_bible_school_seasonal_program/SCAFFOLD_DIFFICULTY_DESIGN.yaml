  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency across DIFFERENT entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_gated_by_accommodation_plan
        grounds:
          - state_machines.AttendanceRecord.NOT_ARRIVED_to_CHECKED_IN
          - state_machines.AccommodationPlan.SUBMITTED_to_APPROVED
          - errors[ERR_ACCOMMODATION_NOT_APPROVED]
        distinguishing_aspect: |
          Pair AttendanceRecord x AccommodationPlan: a special-needs child's
          check-in transition is illegal until a DIFFERENT entity (the child's
          AccommodationPlan) reaches APPROVED. Fails with the plan merely
          SUBMITTED; succeeds immediately after approval — nothing else changed.
        test_recipe:
          setup:
            - "Program Alpha IN_SESSION; Koalas staffed ADEQUATE; day 2026-08-17 OPEN; special-needs child k1 ENROLLED (record NOT_ARRIVED)"
            - "k1's FOOD_ALLERGY plan is SUBMITTED, not yet APPROVED; clock 2026-08-17T08:30:00Z"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
