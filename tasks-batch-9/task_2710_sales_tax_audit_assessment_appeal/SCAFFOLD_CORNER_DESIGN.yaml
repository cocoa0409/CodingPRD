      - name: a_converted_lead_reports_its_own_code_before_the_open_audit_conflict
        claim_type: Error triggerable
        grounds: ["endpoints.POST /audit-leads/{id}/convert", errors.ERR_LEAD_NOT_SELECTED, errors.ERR_TAXPAYER_AUDIT_IN_PROGRESS, validations.priority_7, validations.priority_10, validations.priority_11]
        distinguishing_aspect: |
          Two different conflicts sit on the same endpoint. Re-converting the lead
          that already produced the audit violates BOTH the lead-status rule
          (priority 10) and the one-open-audit rule (priority 11), and §1.4 priority 7
          explicitly defers the lead-status test rather than answering
          ERR_INVALID_STATE, so the answer is ERR_LEAD_NOT_SELECTED. Converting the
          SIBLING lead — still SELECTED, so rule 10 is satisfied — is the only way to
          see ERR_TAXPAYER_AUDIT_IN_PROGRESS, and it must leave that lead SELECTED
          and the audit count at one.
        test_recipe:
          setup:
            - "One taxpayer scored by two projects in the same industry, so it owns two SELECTED leads; the first lead is converted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
