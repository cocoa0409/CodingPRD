            - "setup: ExemptionCertificate.${cert_id} has good_faith_accepted == false, status == ON_FILE, missing_certificate_tax_cents == 0"
            - "trigger call 1: response.status == 422 and ${denied} == ERR_CAPITAL_ASSET_FMV_REQUIRED; UseTaxPurchase.${pur_id} still has asset_class == CONSUMABLE, use_tax_due_cents == 250000 and reclassification_count == 0"
            - "trigger call 2: response.status == 200, taxable_basis_cents == 4500000, gross_use_tax_cents == 281250, credit_applied_cents == 200000, use_tax_due_cents == 81250, reclassification_count == 1"
            - "trigger call 3: status == REJECTED, missing_certificate_tax_cents == 125000, cure_count == 0"
            - "trigger call 4: status == CURED, cure_count == 1, good_faith_accepted == true, form_complete == true, missing_certificate_tax_cents still == 125000"
            - "trigger call 5: Audit.${audit_id}.use_tax_deficiency_cents == 81250, certificate_deficiency_cents == 125000 (the cure did NOT re-run the roll-up), projection_status == STALE"
            - "trigger call 6: status == VALIDATED, missing_certificate_tax_cents == 0 and Audit.${audit_id}.certificate_deficiency_cents == 0"
            - "trigger call 7: total_count == 1, has_more == false, data[0].id == ${cert_id}"

      - name: every_scoped_listing_filters_within_its_own_parent
        claim_type: Standard CRUD
        grounds: ["endpoints.GET /industry-projects", "endpoints.GET /taxpayers/{id}/information-returns", "endpoints.GET /audits/{id}/statute-waivers", "endpoints.GET /assessments/{id}/payment-arrangements", response_envelope.pagination]
        distinguishing_aspect: |
          The four collection reads that hang off a parent, each exercised unfiltered
          and then with its own documented filter, against a fixture that deliberately
          holds two rows per collection with different enum values. Every list must
          return total_count and has_more from the pagination envelope, must scope to
          the parent in the path (the second industry project, on a different NAICS
          code, never appears under a filter that excludes it), and must never leak a
          sibling's rows. in_scoring_window is asserted true because both returns end
          2026-03-31, before the 2026-06-30 clock — a stored-stale flag would fail it.
        test_recipe:
          setup:
            - "Permit P-2710-P9 carried all the way to an ISSUED 4762 notice, with two information returns (one UNDER_REPORTED, one MATCHED), two industry projects on different NAICS codes, two statute waivers (one EXECUTED, one DRAFTED) and two payment arrangements (one INSTALLMENT_PLAN, one OFFER_IN_COMPROMISE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools LLC", permit_number: "P-2710-P9", industry_naics_code: "444140", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 100000000 }
              as: SelectionAnalyst
