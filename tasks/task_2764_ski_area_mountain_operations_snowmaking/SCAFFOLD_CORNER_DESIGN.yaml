              payload: { terrain_area_id: "${area_id}", cat_route_code: "R1", sequence_index: 1, snowcat_unit_code: "CAT-1", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T04:00:00Z", winch_required: true, winch_anchor_code: "ANC-4" }
              as: GroomingLead
              captures: { t1: $.data.id }
            - call: "POST /mountain-ops/grooming-tasks/${t1}/dispatch"
              payload: {  }
              as: GroomingLead
            - call: "POST /mountain-ops/grooming-tasks/${t1}/complete"
              payload: { passes_completed: 14 }
              as: GroomingLead
            - call: "GET /mountain-ops/terrain-areas/${area_id}"
              payload: {  }
              as: GroomingLead
            - call: "POST /mountain-ops/grooming-tasks"
              payload: { terrain_area_id: "${area_id}", cat_route_code: "R1", sequence_index: 2, snowcat_unit_code: "CAT-1", window_start: "2026-08-01T04:00:00Z", window_end: "2026-08-01T08:00:00Z", winch_required: true, winch_anchor_code: "ANC-4" }
