  # ==========================================================================
  # Section: endpoints
  # ==========================================================================
  - section: endpoints
    instances:
      - name: clock_default_is_2026_09_01
        claim_type: computed_read
        grounds: ["endpoints POST /api/_clock/set_current_utc"]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z — a restaurant created first has created_at at that instant."
        test_recipe:
          setup: ["empty DB; clock never set"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/restaurants"
              payload: { name: "R0", city: "SF" }
              as: OpsAdmin
              captures: { created: $.data.created_at }
          assert:
            - "Restaurant.created_at == 2026-09-01T00:00:00.000Z"
      - name: manual_reroute_moves_order_to_target_line_back_of_queue
        claim_type: conditional_action
        grounds: ["endpoints POST /api/orders/{id}/reroute", "calculations.line_selector"]
        distinguishing_aspect: "ShiftManager reroutes a QUEUED order to a named target line; queue_entered_at resets (back of target queue) and estimated_queue_seconds recomputes from the target line's depth and rate."
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED lines LA1 and LA2 (both rate 45, OPEN); hopper on LA1 and LA2 both loaded; order O_X QUEUED on LA1; two earlier orders QUEUED on LA2"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "LA1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { la1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "LA2", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { la2: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${la1}", ingredient_id: "${ing}", capacity_grams: 2000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { ha: $.data.id, ha_v: $.data.version }
            - call: "POST /api/hoppers/${ha}/load"
              payload: { load_grams: 1000, expected_hopper_version: "${ha_v}" }
              as: LineOperator
            - call: "POST /api/hoppers"
              payload: { line_id: "${la2}", ingredient_id: "${ing}", capacity_grams: 2000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { hb: $.data.id, hb_v: $.data.version }
            - call: "POST /api/hoppers/${hb}/load"
              payload: { load_grams: 1000, expected_hopper_version: "${hb_v}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { ox: $.data.id, ox_line: $.data.assigned_line_id }
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
          trigger:
            - call: "POST /api/orders/${ox}/reroute"
              payload: { target_route: "AUTOMATED", target_line_id: "${la2}" }
              as: ShiftManager
              captures: { ox_after_line: $.data.assigned_line_id, ox_est: $.data.estimated_queue_seconds }
          assert:
            - "Order.${ox}.assigned_line_id == ${la2}"
            - "estimated_queue_seconds equals (QUEUED orders on LA2 with earlier queue_entered_at) * 45 — pinned by the selector; the rerouted order joins the back"
      - name: start_refill_on_paused_line_rejected
        claim_type: conditional_action
        grounds: ["endpoints POST /api/refill-tasks/{id}/start", "state_machines.RefillTask"]
        distinguishing_aspect: "Starting a refill while the hopper's line is PAUSED is rejected with ERR_INVALID_STATE even though the task itself is READY."
        test_recipe:
          setup:
            - "Restaurant R1; line L1 PAUSED after hopper H1 driven DEPLETED and auto-task READY (pause allowed: no in-flight orders, no REFILLING hopper)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED" }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 500, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 300, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/prep-batches"
              payload: { restaurant_id: "${r1}", ingredient_id: "${ing}", quantity_grams: 1000 }
              as: PrepCook
              captures: { b1: $.data.id }
            - call: "POST /api/prep-batches/${b1}/mark-ready"
              payload: {}
              as: PrepCook
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 0 }
              as: LineOperator
            - call: "GET /api/hoppers/${h1}/refill-tasks"
              payload: {}
              as: LineOperator
              captures: { t1: $.data.0.id }
            - call: "POST /api/assembly-lines/${l1}/pause"
              payload: {}
              as: ShiftManager
          trigger:
            - call: "POST /api/refill-tasks/${t1}/start"
              payload: {}
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409) — line not ACTIVE"
            - "task remains READY; hopper remains REFILL_SCHEDULED"
      - name: load_exactly_to_capacity_allowed
        claim_type: action_endpoint
        grounds: ["validations[priority=10]", "errors[ERR_HOPPER_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Load bringing current_grams exactly to capacity_grams is accepted (<= boundary); one gram over is rejected with ERR_HOPPER_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["Restaurant R1; line L1; ingredient ING; hopper H1 capacity 500, current 300 after load"]
          setup_api_calls:
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED" }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 500, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 300, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 300 }
              as: LineOperator
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 150 }
              as: LineOperator
            - call: "GET /api/hoppers/${h1}"
              payload: {}
              as: LineOperator
              captures: { h1_v2: $.data.version }
          trigger:
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 350, expected_hopper_version: "${h1_v2}" }
              as: LineOperator
              captures: { h1_full: $.data.current_grams }
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 500 }
              as: LineOperator
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 150 }
              as: LineOperator
            - call: "GET /api/hoppers/${h1}"
              payload: {}
              as: LineOperator
              captures: { h1_v3: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 351, expected_hopper_version: "${h1_v3}" }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "load of 350 onto 150 == capacity 500 accepted; current_grams == 500"
            - "load of 351 rejected with ERR_HOPPER_CAPACITY_EXCEEDED (422)"

