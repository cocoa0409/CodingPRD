        excluded_because:
          difficulty_instance: dual_variant_calc / order_quote_provisional_versus_final_diverges_on_rx_order_money
          rationale: >-
            Divergence is the entire subject of that instance: gross 81126 vs 81977, benefit 41697 vs
            40000 and patient 39429 vs 41977 on one unchanged order.
