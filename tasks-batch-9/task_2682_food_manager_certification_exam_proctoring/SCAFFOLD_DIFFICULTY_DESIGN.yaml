  - rule_id: transitive_cascade
    instances:
      - name: incident_substantiation_depth4_cascade_to_local_registration_withdrawal
        grounds:
          - state_machines.SecurityIncident.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.ExamSession.SUBMITTED_to_INVALIDATED
          - state_machines.ExamSession.CLOSED_to_INVALIDATED
          - state_machines.ScoreReport.FINAL_to_VOIDED
          - state_machines.Certificate.ISSUED_to_REVOKED
          - state_machines.LocalRegistration.VERIFIED_to_WITHDRAWN
          - calculations.provider_ledger_balance
        distinguishing_aspect: |
          Depth 4, and each hop is caused by the PREVIOUS hop, never by the trigger: substantiating the
          incident invalidates the sitting (hop 1); because the sitting became INVALIDATED its score
          report is voided (hop 2); because the report became VOIDED the certificate issued from that
          report is revoked with revocation_reason SCORE_VOIDED and its 1500-cent issuance fee credited
          back (hop 3); because the certificate became REVOKED the health-department registration that
          points at it is withdrawn out of VERIFIED (hop 4). The trigger endpoint touches only the
          incident, so an implementation that fans out from the trigger to each target directly will
          get hop 4 wrong (its precondition is Certificate.status IN {REVOKED, EXPIRED}, not "an
          incident was substantiated"). Trigger transition: SecurityIncident UNDER_REVIEW ->
          SUBSTANTIATED — different from the compliance-run cascade below.
        test_recipe:
          setup:
            - "Baseline jurisdiction TX-TRAVIS (requires_local_registration true, posting_deadline_days 30, recert_cycle_months 60) / provider prepaid 500000 / EN form / 2-seat site / candidate / REGISTERED proctor."
            - "A 1-unit EXAM_ONLY batch (3762 cents), its code assigned, one IN_PERSON sitting submitted with 60 correct at clock 2026-09-10T08:45:00Z and finalized by admin-scoring-1 (final_scaled_score 75, pass_flag true)."
            - "At clock 2026-09-12T00:00:00Z: a certificate issued (issuance_fee_cents 1500, provider balance 494738), a LocalRegistration filed, posting confirmed and VERIFIED by the health officer."
            - "A MAJOR PROHIBITED_MATERIAL incident filed by the sitting proctor at clock 2026-09-12T00:00:00Z (inside the 72-hour filing window that closes 2026-09-13T08:45:00Z) and taken into review by admin-integrity-9."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"], accepts_remote_proctoring: true, requires_local_registration: true, posting_deadline_days: 30, recert_cycle_months: 60, exam_fee_surcharge_pct: 0.045 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
