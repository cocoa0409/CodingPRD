            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr1}", product_id: "${prod}", event_type: "SALE", quantity: 25, scanned_at: "2026-08-01T10:00:00Z", client_event_id: "e1-sale" }, as: RetailerManager, as_user_id: "${store1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /audit-counts", payload: { store_agreement_id: "${agr1}", scope: "FULL" }, as: JobberAdmin, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-counts/${aud}/start", payload: {}, as: FieldAuditor, as_user_id: "aud-1" }
