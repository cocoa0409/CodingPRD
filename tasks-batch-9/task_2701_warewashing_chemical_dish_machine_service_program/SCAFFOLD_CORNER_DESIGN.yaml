      - name: a_cancelled_placement_frees_its_asset_tag_for_reuse
        claim_type: Satisfaction → Pass
        grounds:
          - validations.asset_tag_unique
          - state_machines.MachinePlacement.placement_status.PENDING_INSTALL_to_CANCELLED
          - errors[ERR_ASSET_TAG_TAKEN]
        distinguishing_aspect: |
          Uniqueness excludes CANCELLED rows, so the same asset tag can be re-used once the first
          placement is cancelled - but only once: a third placement carrying the tag collides with the
          live one and gets ERR_ASSET_TAG_TAKEN (409). Cancelling from PENDING_INSTALL also forces the
          health axis straight to OFFLINE without ever passing through RETRIEVAL_SCHEDULED.
