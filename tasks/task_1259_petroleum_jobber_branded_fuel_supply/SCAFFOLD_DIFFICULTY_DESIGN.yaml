              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STATION_NOT_ACTIVE (409) — state (priority 6) beats fiscal (priority 10) even though exposure 1772800 also exceeds the new limit 1000"

      - name: safety_before_temporal_on_drop_create
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SAFE_FILL_EXCEEDED]
          - errors[ERR_TRUCK_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal (different pair
          than state-vs-fiscal): the request violates BOTH safe-fill and the
          truck window conflict; ERR_SAFE_FILL_EXCEEDED (priority 7) must win
          over ERR_TRUCK_WINDOW_CONFLICT (priority 8).
        test_recipe:
          setup:
            - "Full fixture; tank capacity 5000 opening 0 (safe fill 4750); truck TRK-1 already has a PLANNED drop with window 2026-05-02T08:00-12:00Z"
          setup_api_calls:
