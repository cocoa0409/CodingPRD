  - { method: GET, path: "/f2s/program-years", description: "List program years", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["status?", "limit?", "offset?"], output: "ProgramYear[]", side_effects: [] }
  - { method: GET, path: "/f2s/program-years/{id}", description: "Get program year", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: ProgramYear, side_effects: [] }
  - { method: POST, path: "/f2s/program-years/{id}/open", description: "DRAFT -> OPEN", roles: [DistrictProgramAdmin], code: 200, input: [], output: ProgramYear, side_effects: ["status -> OPEN"] }
  - { method: POST, path: "/f2s/program-years/{id}/close", description: "OPEN -> CLOSED", roles: [DistrictProgramAdmin], code: 200, input: [], output: ProgramYear, side_effects: ["status -> CLOSED"] }
  - { method: GET, path: "/f2s/program-years/{id}/report", description: "Computed monthly program report (cash + accrual variants, grant ledger, match)", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [month], output: { month: string, cash_local_spend_cents: integer, accrual_local_spend_cents: integer, cash_total_spend_cents: integer, accrual_total_spend_cents: integer, cash_local_share_pct: number, accrual_local_share_pct: number, meets_target_cash: boolean, meets_target_accrual: boolean, grant_award_cents: integer, grant_drawn_cents: integer, grant_remaining_cents: integer, match_provisional_cents: integer, match_final_cents: integer }, side_effects: [] }

  # --- Farm ---
