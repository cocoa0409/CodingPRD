              as: ProgramAdmin
            - call: "POST /contact-logs/${cl1_id}/void"
              payload: { void_reason: "Session was double-counted with the co-planning log" }
              as: ProgramAdmin
            - call: "GET /novice-teachers/${novice_id}/readiness"
              as: ProgramAdmin
            - call: "GET /mentors/${mentor_id}"
              as: ProgramAdmin
          assert:
            - "call 1 returns HTTP 200 and its own body already reports verification_status == \"VERIFIED\", credited_minutes == 120, rate_tier_at_verification == \"EXACT\", cert_multiplier_at_verification == 1.00 and stipend_cents == 8400 (120/60 * 4200 * 1.00)"
            - "call 2 reports verified_minutes_lifetime == 120 and stipend_accrued_cents == 8400 with no re-read delay"
            - "call 3 reports verified_minutes_total == 120 and accrued_stipend_cents == 8400"
            - "call 4 reports readiness_index_live == 9.00 (100 * 0.45 * 120/600), contact_component == 0.2000, observation_component == 0.0000, seminar_component == 0.0000, seminar_denominator == 1 and meets_readiness_gate == false"
            - "call 5 returns HTTP 200 and its own body already reports verification_status == \"VOIDED\", credited_minutes == 0, stipend_cents == 0 and void_reason == \"Session was double-counted with the co-planning log\""
            - "call 6 reports readiness_index_live == 0.00 and contact_component == 0.0000 — the reversal is visible on the first read after the void"
            - "call 7 reports verified_minutes_lifetime == 0 and stipend_accrued_cents == 0"
            - "GET /novice-teachers/${novice_id} reports verified_contact_minutes == 0 and license_advancement_status == \"NOT_ELIGIBLE\" throughout"
