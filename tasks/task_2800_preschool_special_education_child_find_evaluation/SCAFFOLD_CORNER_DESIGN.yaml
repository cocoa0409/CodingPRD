  - section: state_machines
    instances:

      - name: recording_a_second_outcome_on_a_resolved_slot_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ScreeningSlot
          - errors[ERR_INVALID_SLOT_STATE]
          - validations[priority=11]
        distinguishing_aspect: |
          ATTENDED, NO_SHOW and CANCELLED are all terminal for a ScreeningSlot, so
          replaying the same outcome call - or sending a different one - after the
          slot has resolved is ERR_INVALID_SLOT_STATE, and the event's
          booked_slot_count does not move a second time.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE screening_host_approved site with an OPEN screening event on 2026-08-20T09:00Z-12:00Z."
            - "One 36-month-old child holding a BOOKED slot at 09:00Z."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/community-sites"
              payload: { name: "Sunrise Coop", region_code: "R-1", licensed_capacity: 40, iep_seat_capacity: 2, languages_supported: ["en"], screening_host_approved: true, status: "ACTIVE" }
              as: PlacementAdministrator
              captures: { site1_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Ben", last_name: "Ortiz", date_of_birth: "2023-08-01", guardian_full_name: "Lia Ortiz", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_id: "$.data.id" }
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "August Child Find", window_start_utc: "2026-08-20T09:00:00Z", window_end_utc: "2026-08-20T12:00:00Z", slot_capacity: 4, slot_length_minutes: 30 }
              as: ChildFindCoordinator
              captures: { event_id: "$.data.id" }
            - call: "POST /child-find/screening-events/${event_id}/status"
              payload: { target_status: "OPEN" }
              as: ChildFindCoordinator
              captures: { event_v1: "$.data.version" }
            - call: "POST /child-find/screening-events/${event_id}/slots"
              payload: { child_id: "${child_id}", slot_start_utc: "2026-08-20T09:00:00Z", expected_screening_event_version: "${event_v1}" }
              as: ChildFindCoordinator
              captures: { slot_id: "$.data.id" }
          trigger:
            - call: "POST /child-find/screening-slots/${slot_id}/outcome"
              payload: { attendance: "ATTENDED", screening_result: "REFER" }
              as: ChildFindCoordinator
            - call: "POST /child-find/screening-slots/${slot_id}/outcome"
              payload: { attendance: "ATTENDED", screening_result: "REFER" }
              as: ChildFindCoordinator
            - call: "POST /child-find/screening-slots/${slot_id}/outcome"
              payload: { attendance: "NO_SHOW" }
              as: ChildFindCoordinator
          assert:
            - "first response.status_code == 200"
            - "ScreeningSlot.${slot_id}.status == \"ATTENDED\""
            - "ScreeningSlot.${slot_id}.screening_result == \"REFER\""
            - "second response.status_code == 409"
            - "second response.data.error_id == \"ERR_INVALID_SLOT_STATE\""
            - "third response.status_code == 409"
            - "third response.data.error_id == \"ERR_INVALID_SLOT_STATE\""
            - "ScreeningSlot.${slot_id}.status == \"ATTENDED\""
            - "ScreeningEvent.${event_id}.booked_slot_count == 1"

      - name: a_second_decision_on_a_refused_consent_record_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ConsentRecord
          - errors[ERR_INVALID_CONSENT_STATE]
          - validations[priority=11]
        distinguishing_aspect: |
          REFUSED is terminal for a ConsentRecord: neither a later GRANTED nor a
          REVOKED decision is accepted, the referral's DECLINED intake and REFUSED
          consent dimensions stay put, and no compensating consent record appears.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One child with a referral whose evaluation consent request was REFUSED by the parent."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/children"
              payload: { first_name: "Ben", last_name: "Ortiz", date_of_birth: "2023-08-01", guardian_full_name: "Lia Ortiz", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${child_id}", source: "PEDIATRICIAN", referring_provider_npi: "1234567893" }
              as: ChildFindCoordinator
              captures: { referral_id: "$.data.id" }
            - call: "POST /child-find/referrals/${referral_id}/consent-requests"
              payload: { notice_language_code: "en", notice_delivery_method: "MAIL" }
              as: ChildFindCoordinator
              captures: { consent_id: "$.data.id" }
            - call: "POST /child-find/consent-records/${consent_id}/decision"
              payload: { decision: "REFUSED" }
              as: Parent
              as_user_id: "${child_id}"
          trigger:
            - call: "POST /child-find/consent-records/${consent_id}/decision"
              payload: { decision: "GRANTED" }
              as: Parent
              as_user_id: "${child_id}"
            - call: "POST /child-find/consent-records/${consent_id}/decision"
              payload: { decision: "REVOKED" }
              as: Parent
              as_user_id: "${child_id}"
          assert:
            - "first response.status_code == 409"
            - "first response.data.error_id == \"ERR_INVALID_CONSENT_STATE\""
            - "second response.status_code == 409"
            - "second response.data.error_id == \"ERR_INVALID_CONSENT_STATE\""
            - "ConsentRecord.${consent_id}.decision == \"REFUSED\""
            - "Referral.${referral_id}.intake_status == \"DECLINED\""
            - "Referral.${referral_id}.consent_status == \"REFUSED\""
            - "Referral.${referral_id}.evaluation_due_date == null"
            - "Child.${child_id}.status == \"NO_ACTIVE_REFERRAL\""
            - "GET /child-find/consent-records?referral_id=${referral_id} returns total_count == 1"

      - name: completing_an_already_completed_assessment_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.DomainAssessment
          - errors[ERR_INVALID_ASSESSMENT_STATE]
          - validations[priority=11]
        distinguishing_aspect: |
          COMPLETED accepts only invalidation, so a repeated completion is
          ERR_INVALID_ASSESSMENT_STATE and cannot overwrite the recorded
          age_equivalent_months; after invalidation the same call is still
          rejected, because INVALIDATED accepts nothing at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One consent-granted evaluation case with a single COMPLETED COGNITIVE assessment recorded at age_equivalent_months 23 for a 36-month-old child."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/providers"
              payload: { full_name: "Dana Chair", discipline: "SCHOOL_PSYCHOLOGIST", home_region_code: "R-1" }
              as: DistrictAdmin
              captures: { chair_id: "$.data.id" }
            - call: "POST /child-find/providers"
