              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C", email: "imm2@x.com", home_region_id: "${r_id}" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "Immediate Biz", category: "RETAIL", address_text: "21 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
          trigger:
            - call: "POST /v1/map-edits"
              payload: { listing_id: "${l_id}", contributor_id: "${c_id}", edit_type: "ATTRIBUTE", payload: { attribute: "wifi", value: true, evidence_urls: ["u1", "u2", "u3"] }, expected_listing_version: "${l_v0}" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { e_status: $.data.status }
            - call: "GET /v1/business-listings/${l_id}"
