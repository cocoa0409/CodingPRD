  - rule_id: compensating_invariant
    instances:
      - name: void_disbursed_contribution_restores_fund_conservation_identity
        grounds:
          - state_machines.PacContribution.transitions[DISBURSED->VOIDED]
          - calculations.fund_conservation_identity
          - calculations.contribution_allowance.input_set
          - entities.Candidate.fields.disbursed_support_cents
        distinguishing_aspect: |
          The void must restore every TERM of the identity, not merely the total: available_balance_cents climbs back
          to 300000, disbursed_total_cents returns to 0, all three candidate accumulators return to 0, and the
          per-candidate headroom re-opens so an identical 250000 contribution is accepted again. A partial
          compensation that fixed only the fund total would leave the candidate ledger or the headroom drifted.
        test_recipe:
          setup:
            - "One FEDERAL SegregatedFund with min_reserve_cents 0 and receipts_total_cents 300000 from a member holding a GRANTED PriorApproval."
            - "One FEDERAL INCUMBENT candidate scoring 80.50, so max_allowed_cents is 250000."
            - "One contribution of 250000 proposed by gad-1, board-approved by bt-1 and disbursed by co-1, leaving available 50000, committed 0, disbursed 250000."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25, status: "ACTIVE", advocacy_optout: false, engagement_score: 90 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /advocacy/prior-approvals"
              payload: { member_id: "${m1_id}", calendar_year: 2026, solicitable_class_size: 10, effective_date: "2026-01-01", expires_at_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pa_id: $.data.id }
            - call: "POST /advocacy/prior-approvals/${pa_id}/grant"
              payload: { authorized_by_name: "R. Okafor, Treasurer" }
              as: MemberDelegate
              as_user_id: "${m1_id}"
            - call: "POST /advocacy/segregated-funds"
              payload: { name: "NMA Federal PAC", fund_year: 2026, jurisdiction_code: "FEDERAL", min_reserve_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { fund_id: $.data.id }
            - call: "POST /advocacy/segregated-funds/${fund_id}/receipts"
              payload: { member_id: "${m1_id}", amount_cents: 300000, received_date: "2026-07-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /advocacy/candidates"
              payload: { name: "Rep. Jane Alvarez", office: "US_HOUSE", jurisdiction_code: "FEDERAL", district_code: "CA-12", election_cycle: "2026-GENERAL", incumbency: "INCUMBENT", voting_alignment_pct: 90.00, committee_relevance_score: 80 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { cand_id: $.data.id }
            - call: "POST /advocacy/pac-contributions"
              payload: { fund_id: "${fund_id}", candidate_id: "${cand_id}", amount_cents: 250000, memo: "Primary support" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { contrib_id: $.data.id }
            - call: "POST /advocacy/pac-contributions/${contrib_id}/board-approve"
              payload: {}
              as: BoardTrustee
              as_user_id: "bt-1"
            - call: "POST /advocacy/pac-contributions/${contrib_id}/disburse"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /advocacy/pac-contributions/${contrib_id}/void"
              payload: { void_reason: "Check returned by the campaign committee" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /advocacy/pac-contributions"
              payload: { fund_id: "${fund_id}", candidate_id: "${cand_id}", amount_cents: 250000, memo: "Re-issued after the returned check" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { contrib2_id: $.data.id, contrib2_max: $.data.max_allowed_cents }
          assert:
            - "Before the void: SegregatedFund.${fund_id}.available_balance_cents == 50000, committed_balance_cents == 0, disbursed_total_cents == 250000; Candidate.${cand_id}.disbursed_support_cents == 250000"
            - "After the void: PacContribution.${contrib_id}.status == VOIDED, voided_at == 2026-08-01T00:00:00Z, void_reason recorded"
            - "TERM BY TERM: SegregatedFund.${fund_id}.available_balance_cents == 300000, committed_balance_cents == 0, disbursed_total_cents == 0, filing_fee_accrued_cents == 0, receipts_total_cents == 300000 (identity 300000 == 300000 + 0 + 0 + 0)"
            - "Candidate.${cand_id}.pending_support_cents == 0, committed_support_cents == 0, disbursed_support_cents == 0 - no drift in any of the three"
            - "The re-issued contribution is accepted with PacContribution.${contrib2_id}.max_allowed_cents == 250000, proving the VOIDED row was removed from already_cents and the headroom was fully restored"
            - "SegregatedFund.${fund_id}.posture == OPEN throughout (min_reserve_cents 0), so no suspension cascade contaminated the measurement"
      - name: void_activity_restores_registration_accumulators_and_open_report_totals
        grounds:
          - state_machines.LobbyingActivity.transitions[LOGGED->VOIDED]
          - calculations.registration_reportable_accumulator.formula
          - calculations.reportable_expenditure_total.trigger
          - entities.ExpenditureReport.fields.included_activity_count
        distinguishing_aspect: |
          One compensation has to unwind two different derived surfaces at once - the registration's ytd cent and
          hour accumulators AND the still-OPEN report's dual totals and inclusion count. Because METHOD_B rounds per
          activity, the report must drop exactly 322670 (300000 + 22670) and land on 428331; recomputing from a
          re-summed hour figure would produce 428330.
        test_recipe:
          setup:
            - "One ADOPTED FEDERAL position and one ACTIVE FEDERAL registration covering 2026-01-01..2026-12-31."
            - "Activity A1: 2026-07-05, hours 3.333, expenditure 400000 (staff cost 28331). Activity A2: 2026-07-06, hours 2.667, expenditure 300000 (staff cost 22670). ytd_reportable_cents 700000 stays under the 1400000 FEDERAL threshold."
            - "One OPEN METHOD_B report for 2026Q3 created against the current registration version, with method_a_total 700000, method_b_total 751001 and included_activity_count 2."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25, status: "ACTIVE", advocacy_optout: false, engagement_score: 90 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /advocacy/members"
              payload: { legal_name: "Beta Foundry Co", membership_tier: "FULL", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 15, status: "ACTIVE", advocacy_optout: false, engagement_score: 70 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m2_id: $.data.id }
            - call: "POST /advocacy/members"
              payload: { legal_name: "Gamma Tooling Co", membership_tier: "ASSOCIATE", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 5, status: "ACTIVE", advocacy_optout: false, engagement_score: 50 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m3_id: $.data.id }
            - call: "POST /advocacy/committees"
              payload: { name: "Federal Tax Policy Committee", jurisdiction_scope: "FEDERAL", quorum_threshold_pct: 60.00, consensus_threshold_pct: 66.67 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { comm_id: $.data.id }
            - call: "POST /advocacy/committees/${comm_id}/seats"
              payload: { member_id: "${m1_id}", seat_role: "CHAIR" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/committees/${comm_id}/seats"
              payload: { member_id: "${m2_id}", seat_role: "MEMBER" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/committees/${comm_id}/seats"
              payload: { member_id: "${m3_id}", seat_role: "MEMBER" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/policy-positions"
              payload: { committee_id: "${comm_id}", title: "Support the Manufacturing Credit", jurisdiction_code: "FEDERAL", summary: "The association supports extension of the manufacturing investment credit." }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { pos_id: $.data.id }
            - call: "POST /advocacy/policy-positions/${pos_id}/open-ballot"
              payload: {}
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/policy-positions/${pos_id}/votes"
              payload: { ballot: "SUPPORT" }
              as: MemberDelegate
              as_user_id: "${m1_id}"
            - call: "POST /advocacy/policy-positions/${pos_id}/votes"
              payload: { ballot: "SUPPORT" }
              as: MemberDelegate
              as_user_id: "${m2_id}"
            - call: "POST /advocacy/policy-positions/${pos_id}/votes"
              payload: { ballot: "OPPOSE" }
              as: MemberDelegate
              as_user_id: "${m3_id}"
            - call: "POST /advocacy/policy-positions/${pos_id}/tally"
              payload: {}
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/policy-positions/${pos_id}/adopt"
              payload: {}
              as: BoardTrustee
              as_user_id: "bt-1"
            - call: "POST /advocacy/lobbying-registrations"
              payload: { jurisdiction_code: "FEDERAL", registrant_name: "National Manufacturers Association", coverage_start_date: "2026-01-01", coverage_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { reg_id: $.data.id }
            - call: "POST /advocacy/lobbying-registrations/${reg_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /advocacy/lobbying-activities"
              payload: { registration_id: "${reg_id}", position_id: "${pos_id}", activity_kind: "DIRECT_LOBBYING", activity_date: "2026-07-05", hours: 3.333, expenditure_cents: 400000 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { act1_id: $.data.id }
            - call: "POST /advocacy/lobbying-activities"
              payload: { registration_id: "${reg_id}", position_id: "${pos_id}", activity_kind: "DIRECT_LOBBYING", activity_date: "2026-07-06", hours: 2.667, expenditure_cents: 300000 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
