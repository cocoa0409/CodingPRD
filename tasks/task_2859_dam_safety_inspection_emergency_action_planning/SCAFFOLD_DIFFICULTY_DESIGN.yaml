  - rule_id: priority_pair_validation_conflict
    instances:
      - name: permit_state_conflict_rejected_ahead_of_owner_delinquency
        grounds:
          - validations[priority=14]
          - validations[priority=35]
          - validations[priority=8]
          - errors[ERR_PERMIT_INVALID_STATE]
          - errors[ERR_OWNER_DELINQUENT]
          - calculations.permit_fee_schedule
        distinguishing_aspect: |
          Category pair state (priority 14) versus business_fiscal (priority 35). Posting the permit's
          own review fee is what makes the owner delinquent, so a permit that was never assigned for
          review violates both rules at once. The state error must win with 409
          ERR_PERMIT_INVALID_STATE, not 402 ERR_OWNER_DELINQUENT - and the engineer-assignment check
          at priority 8 must stay silent because review_engineer_id is still null.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "SIGNIFICANT-hazard dam (certified score 6.60), safety_status UNRATED, owner starting CURRENT at a zero balance."
            - "A CONSTRUCTION permit for 40,000,000 cents priced at 430000 total; posting that PERMIT_REVIEW_FEE leaves the owner at 430000 cents, i.e. DELINQUENT."
            - "The permit is still SUBMITTED - assign-review has deliberately not been called, so review_engineer_id is null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 3, habitable_structures: 2, critical_facilities: 0, breach_peak_outflow_cfs: 9000, breach_travel_time_minutes: 200, inundation_area_acres: 50, inundation_map_ref: "IM-2019-A" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /consequence-assessments/${a1_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /permits"
              payload: { dam_id: "${dam_id}", permit_type: "CONSTRUCTION", scope_description: "New outlet works and stilling basin.", estimated_project_cost_cents: 40000000, proposed_start_date: "2026-10-01T00:00:00Z" }
              as: DamOwner
              as_user_id: "${owner_id}"
              captures: { permit_id: "$.data.id" }
          trigger:
            - call: "POST /permits/${permit_id}/decision"
              payload: { decision: "ISSUE", findings: "Design conforms." }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { first_error_id: "$.data.error_id" }
            - call: "POST /permits/${permit_id}/assign-review"
              payload: { review_engineer_id: "${eng_a_id}" }
              as: ProgramAdmin
            - call: "POST /permits/${permit_id}/decision"
              payload: { decision: "ISSUE", findings: "Design conforms." }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { second_error_id: "$.data.error_id" }
          assert:
            - "the first decision call returns HTTP 409 with error_id == ERR_PERMIT_INVALID_STATE"
            - "it does NOT return 402 ERR_OWNER_DELINQUENT even though Owner.fee_balance_cents == 430000 >= 25000"
            - "it does NOT return 403 ERR_NOT_ASSIGNED_ENGINEER: priority 8 is skipped while review_engineer_id is null"
            - "after assign-review the permit is UNDER_ENGINEERING_REVIEW, so the second identical call returns HTTP 402 with error_id == ERR_OWNER_DELINQUENT - proving both violations were live the whole time and only their order decided the response"
            - "Permit.${permit_id}.status is still UNDER_ENGINEERING_REVIEW after the second call (nothing was issued)"
            - "Owner.${owner_id}.delinquency_status == DELINQUENT and fee_balance_cents == 430000"

