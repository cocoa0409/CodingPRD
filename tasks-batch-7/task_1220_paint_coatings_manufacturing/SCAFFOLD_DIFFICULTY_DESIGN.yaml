# =============================================================================
# Task 1220: Paint & Coatings Manufacturing — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 2+ instances per Difficulty Rule (20 instances total).
# All recipes drive empty-DB -> precondition state using only §1.5 endpoints.
# Canonical fixtures used below:
#   TB1: NONFLAT / LATEX_EXTERIOR base, voc 80 g/L, water 40%, density 4.6,
#        cost 1500c/gal, price 3200c/gal, shelf 24m, grind spec 25 um
#   TB2: FLAT / LATEX_INTERIOR base, voc 30, water 50%, density 4.4,
#        cost 1800c/gal, price 4100c/gal, shelf 24m, grind spec 20 um
#   C1: MAG-7 colorant, 5 g voc/shot, 30c/shot, non-hazmat
#   C2: BLK-H colorant, 12 g voc/shot, 45c/shot, HAZMAT
#   F1: CLR-8841 stock formula on TB1, dE 0.8, line C1 x 4 shots/gal
#   F2: CLR-C100 custom formula on TB2, dE 0.5, line C2 x 6 shots/gal
# =============================================================================

scaffold_difficulty_design:
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: batch_cost_provisional_vs_final
        grounds:
          - calculations.batch_cost
          - entities.Batch.fields.theoretical_cost_cents
          - entities.Batch.fields.actual_cost_cents
        distinguishing_aspect: |
          Dual-variant cost accounting on the Batch entity domain: the provisional
          variant (planned gallons, nominal shots) computed at creation yields 4860
          cents while the final variant (actual gallons, dispensed TINT_SHOT
          adjustments, waste recovery, rework fee) computed at complete-filling
          yields 30040 cents for the same batch.
        test_recipe:
          setup:
            - "Clock at 2026-05-01; TB1, C1 exist; F1 ACTIVE on TB1; mill M1 ACTIVE capacity 200"
            - "Batch B1: planned 3 gal on F1/M1, window 2026-06-10T08:00-12:00Z; one failed dispersion check, one TINT_SHOT adjustment of 6 shots, one QC rejection (rework cycle), then approval; 3 GALLON cans at 4600 g; waste 0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
              captures: { m1: $.data.id }
            - call: "POST /coatings/batches"
              payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 3, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z" }
              as: ProductionOperator
              captures: { b1: $.data.id }
            - { call: "POST /coatings/batches/${b1}/start-mill", payload: {}, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/dispersion-check", payload: { grind_reading: 30 }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/dispersion-check", payload: { grind_reading: 18 }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/adjustments", payload: { kind: "TINT_SHOT", quantity: 6, colorant_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/submit-qc", payload: { actual_gallons: 3 }, as: ProductionOperator }
            - call: "POST /coatings/color-matches"
              payload: { batch_id: "${b1}", measured_delta_e: 1.2 }
              as: LabTechnician
              as_user_id: "lab-1"
              captures: { cm1: $.data.id }
            - { call: "POST /coatings/color-matches/${cm1}/reject", payload: {}, as: QCInspector, as_user_id: "qc-1" }
            - { call: "POST /coatings/batches/${b1}/rework", payload: {}, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/dispersion-check", payload: { grind_reading: 18 }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/submit-qc", payload: { actual_gallons: 3 }, as: ProductionOperator }
            - call: "POST /coatings/color-matches"
              payload: { batch_id: "${b1}", measured_delta_e: 0.42 }
              as: LabTechnician
              as_user_id: "lab-1"
              captures: { cm2: $.data.id }
            - { call: "POST /coatings/color-matches/${cm2}/approve", payload: {}, as: QCInspector, as_user_id: "qc-1" }
            - { call: "POST /coatings/batches/${b1}/fills", payload: { size_code: "GALLON", actual_fill_g: 4600 }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/fills", payload: { size_code: "GALLON", actual_fill_g: 4600 }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/fills", payload: { size_code: "GALLON", actual_fill_g: 4600 }, as: ProductionOperator }
          trigger:
            - { call: "POST /coatings/batches/${b1}/complete-filling", payload: { waste_gallons: 0 }, as: ProductionOperator }
          assert:
            - "Batch.${b1}.theoretical_cost_cents == 4860  (3 * (1500 + 4*30), provisional variant at creation)"
            - "Batch.${b1}.actual_cost_cents == 30040  (3*1500 + 12*30 + 6*30 + 0 waste + 1*25000 rework fee, final variant)"
            - "Batch.${b1}.theoretical_cost_cents != Batch.${b1}.actual_cost_cents (variant divergence on the same batch)"
            - "Batch.${b1}.rework_count == 1 and Batch.${b1}.dispersion_cycles == 1"
            - "Batch.${b1}.status == FILLED"

      - name: freeze_credit_provisional_vs_final
        grounds:
          - calculations.freeze_credit_calc
          - entities.CreditClaim.fields.provisional_credit_cents
          - entities.CreditClaim.fields.final_credit_cents
        distinguishing_aspect: |
          Dual-variant credit accounting on the CreditClaim entity domain (distinct
          from the Batch cost domain): identical claim data yields provisional 40000
          cents (penalty free, claimed exposure 1) but final 20000 cents (freeze
          penalty x0.5 once review copies the container's verified exposure count 3).
        test_recipe:
          setup:
            - "Full production chain: F1 ACTIVE; 3-gal batch closed to QC_APPROVED with 3 GALLON cans manufactured 2026-06-10 (expiry 2028-06-10); NONFLAT '*' rule 250 g/L ACTIVE; customer CU1 cap 50000; order O1 to AZ; 3 cans shipped 2026-06-15T09:00Z"
            - "Container K1 has 3 freeze-exposure events recorded"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
              captures: { m1: $.data.id }
            - call: "POST /coatings/voc-rules"
              payload: { category: "NONFLAT", state_code: "*", max_voc_gpl: 250, effective_from: "2026-01-01" }
              as: RegulatoryClerk
              captures: { vr_nat: $.data.id }
            - { call: "POST /coatings/voc-rules/${vr_nat}/activate", payload: {}, as: RegulatoryClerk }
            - call: "POST /coatings/customers"
              payload: { name: "Sunbelt Paints AZ", home_state_code: "AZ", annual_credit_cap_cents: 50000 }
              as: PlantManager
              captures: { cu1: $.data.id }
            - call: "POST /coatings/batches"
              payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 3, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z" }
              as: ProductionOperator
              captures: { b1: $.data.id }
            - { call: "POST /coatings/batches/${b1}/start-mill", payload: {}, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/dispersion-check", payload: { grind_reading: 18 }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/submit-qc", payload: { actual_gallons: 3 }, as: ProductionOperator }
            - call: "POST /coatings/color-matches"
              payload: { batch_id: "${b1}", measured_delta_e: 0.42 }
              as: LabTechnician
              as_user_id: "lab-1"
              captures: { cm1: $.data.id }
            - { call: "POST /coatings/color-matches/${cm1}/approve", payload: {}, as: QCInspector, as_user_id: "qc-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T10:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/batches/${b1}/fills"
              payload: { size_code: "GALLON", actual_fill_g: 4600 }
              as: ProductionOperator
              captures: { k1: $.data.id }
            - { call: "POST /coatings/batches/${b1}/fills", payload: { size_code: "GALLON", actual_fill_g: 4600 }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/fills", payload: { size_code: "GALLON", actual_fill_g: 4600 }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/complete-filling", payload: { waste_gallons: 0 }, as: ProductionOperator }
            - call: "POST /coatings/orders"
              payload: { customer_id: "${cu1}", destination_state_code: "AZ", rush_flag: false, lines: [ { formula_id: "${f1}", gallons: 3, size_code: "GALLON" } ] }
              as: Dealer
              as_user_id: "${cu1}"
              captures: { o1: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T09:00:00Z" }, as: PlantManager }
            - { call: "POST /coatings/containers/${k1}/ship", payload: { order_id: "${o1}" }, as: ProductionOperator }
            - { call: "POST /coatings/containers/${k1}/mark-freeze-exposure", payload: {}, as: ProductionOperator }
            - { call: "POST /coatings/containers/${k1}/mark-freeze-exposure", payload: {}, as: ProductionOperator }
            - { call: "POST /coatings/containers/${k1}/mark-freeze-exposure", payload: {}, as: ProductionOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T08:00:00Z" }, as: PlantManager }
          trigger:
            - call: "POST /coatings/credit-claims"
              payload: { customer_id: "${cu1}", container_id: "${k1}", claim_type: "FREEZE_DAMAGE", invoice_value_cents: 40000, claimed_exposure_count: 1 }
              as: Dealer
              as_user_id: "${cu1}"
              captures: { cl1: $.data.id }
            - { call: "POST /coatings/credit-claims/${cl1}/review", payload: {}, as: RegulatoryClerk, as_user_id: "reg-1" }
            - { call: "POST /coatings/credit-claims/${cl1}/approve", payload: {}, as: PlantManager, as_user_id: "pm-1" }
          assert:
            - "CreditClaim.${cl1}.remaining_days_at_claim == 721 (expiry 2028-06-10 minus 2026-06-20)"
            - "CreditClaim.${cl1}.provisional_credit_cents == 40000 (band 1.00, claimed_exposure_count 1 -> no penalty)"
            - "CreditClaim.${cl1}.verified_exposure_count == 3 (copied from container at review)"
            - "CreditClaim.${cl1}.final_credit_cents == 20000 (band 1.00, verified 3 > 2 -> x0.5 freeze penalty)"
            - "CreditClaim.${cl1}.status == APPROVED"

  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: voc_actual_nonlinear_multi_input
        grounds:
          - calculations.voc_actual_gpl
          - calculations.voc_compliance_resolution
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — VOC mass sums over
          base volume, formula shots, TINT_SHOT and THINNER adjustments; the
          denominator subtracts water and EXEMPT_SOLVENT liters; compliance then
          takes min() over the wildcard and state rules with a container-size
          exemption branch. The same batch (154.57 g/L) fails shipping a GALLON to
          CA (limit 100), passes shipping a QUART to CA (1.0 L exemption removes the
          CA rule, national 250 applies), and passes a GALLON to AZ (250).
        test_recipe:
          setup:
            - "F1 ACTIVE; M1; NONFLAT rules: '*' 250 [2026-01-01,) ACTIVE; CA 100 [2026-01-01,2027-06-01) exempt 1.0 L ACTIVE; CA 50 [2027-06-01,) exempt 1.0 L ACTIVE; customers CU_AZ and CU_CA; orders O_AZ/O_CA (3 GALLON) and O_CA_Q (1 QUART)"
            - "Batch B1 100 gal with THINNER 2000 mL, EXEMPT_SOLVENT 5000 mL, TINT_SHOT 50 shots of C1, actual_gallons 100; QC approved; 2 GALLON cans + 1 QUART can filled 2026-06-10; waste 97.75 gal reconciles mass"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
              captures: { m1: $.data.id }
            - call: "POST /coatings/voc-rules"
              payload: { category: "NONFLAT", state_code: "*", max_voc_gpl: 250, effective_from: "2026-01-01" }
              as: RegulatoryClerk
              captures: { vr_nat: $.data.id }
            - { call: "POST /coatings/voc-rules/${vr_nat}/activate", payload: {}, as: RegulatoryClerk }
            - call: "POST /coatings/voc-rules"
              payload: { category: "NONFLAT", state_code: "CA", max_voc_gpl: 100, effective_from: "2026-01-01", effective_to: "2027-06-01", exempt_container_l: 1.0 }
              as: RegulatoryClerk
              captures: { vr_ca100: $.data.id }
            - { call: "POST /coatings/voc-rules/${vr_ca100}/activate", payload: {}, as: RegulatoryClerk }
            - call: "POST /coatings/voc-rules"
              payload: { category: "NONFLAT", state_code: "CA", max_voc_gpl: 50, effective_from: "2027-06-01", exempt_container_l: 1.0 }
              as: RegulatoryClerk
              captures: { vr_ca50: $.data.id }
            - { call: "POST /coatings/voc-rules/${vr_ca50}/activate", payload: {}, as: RegulatoryClerk }
            - call: "POST /coatings/customers"
              payload: { name: "Sunbelt Paints AZ", home_state_code: "AZ", annual_credit_cap_cents: 50000 }
              as: PlantManager
              captures: { cu_az: $.data.id }
            - call: "POST /coatings/customers"
              payload: { name: "Golden Gate Paint CA", home_state_code: "CA", annual_credit_cap_cents: 50000 }
              as: PlantManager
              captures: { cu_ca: $.data.id }
            - call: "POST /coatings/batches"
              payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 100, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z" }
              as: ProductionOperator
              captures: { b1: $.data.id }
            - { call: "POST /coatings/batches/${b1}/start-mill", payload: {}, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/adjustments", payload: { kind: "THINNER", quantity: 2000 }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/adjustments", payload: { kind: "EXEMPT_SOLVENT", quantity: 5000 }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/dispersion-check", payload: { grind_reading: 18 }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/adjustments", payload: { kind: "TINT_SHOT", quantity: 50, colorant_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/submit-qc", payload: { actual_gallons: 100 }, as: ProductionOperator }
            - call: "POST /coatings/color-matches"
              payload: { batch_id: "${b1}", measured_delta_e: 0.42 }
              as: LabTechnician
              as_user_id: "lab-1"
              captures: { cm1: $.data.id }
            - { call: "POST /coatings/color-matches/${cm1}/approve", payload: {}, as: QCInspector, as_user_id: "qc-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T10:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/batches/${b1}/fills"
              payload: { size_code: "GALLON", actual_fill_g: 4600 }
              as: ProductionOperator
              captures: { k_g1: $.data.id }
            - call: "POST /coatings/batches/${b1}/fills"
              payload: { size_code: "GALLON", actual_fill_g: 4600 }
              as: ProductionOperator
              captures: { k_g2: $.data.id }
            - call: "POST /coatings/batches/${b1}/fills"
              payload: { size_code: "QUART", actual_fill_g: 1150 }
              as: ProductionOperator
              captures: { k_q: $.data.id }
            - { call: "POST /coatings/batches/${b1}/complete-filling", payload: { waste_gallons: 97.75 }, as: ProductionOperator }
            - call: "POST /coatings/orders"
              payload: { customer_id: "${cu_az}", destination_state_code: "AZ", rush_flag: false, lines: [ { formula_id: "${f1}", gallons: 3, size_code: "GALLON" } ] }
              as: Dealer
              as_user_id: "${cu_az}"
              captures: { o_az: $.data.id }
            - call: "POST /coatings/orders"
              payload: { customer_id: "${cu_ca}", destination_state_code: "CA", rush_flag: false, lines: [ { formula_id: "${f1}", gallons: 3, size_code: "GALLON" } ] }
              as: Dealer
              as_user_id: "${cu_ca}"
              captures: { o_ca: $.data.id }
            - call: "POST /coatings/orders"
              payload: { customer_id: "${cu_ca}", destination_state_code: "CA", rush_flag: false, lines: [ { formula_id: "${f1}", gallons: 1, size_code: "QUART" } ] }
              as: Dealer
              as_user_id: "${cu_ca}"
              captures: { o_ca_q: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T09:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /coatings/containers/${k_g1}/ship", payload: { order_id: "${o_ca}" }, as: ProductionOperator, captures: { err_gallon_ca: $.data.error_id } }
            - { call: "POST /coatings/containers/${k_q}/ship", payload: { order_id: "${o_ca_q}" }, as: ProductionOperator }
            - { call: "POST /coatings/containers/${k_g2}/ship", payload: { order_id: "${o_az}" }, as: ProductionOperator }
          assert:
            - "Batch.${b1}.voc_actual_gpl == 154.57 ((80*378.541 + 450*5 + 2000*0.9) / (378.541 - 151.4164 - 5.0), round_half_up 2dp)"
            - "err_gallon_ca == ERR_VOC_LIMIT_EXCEEDED (154.57 > CA limit 100)"
            - "Container.${k_g1}.status == IN_STOCK (failed ship leaves state unchanged)"
            - "Container.${k_q}.status == SHIPPED (0.946 L <= exempt_container_l 1.0 drops the CA rule; national 250 applies)"
            - "Container.${k_g2}.status == SHIPPED (154.57 <= 250 national limit)"

      - name: fill_reconciliation_rounding_order
        grounds:
          - calculations.fill_reconciliation
          - entities.Container.fields.net_weight_kg
          - entities.Batch.fields.filled_net_kg
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-container-then-sum: 3 cans x 4605 g give 4.61 kg each and a
          batch filled_net_kg of 13.83 kg, whereas the forbidden sum-then-round
          order would give round(13.815, 2) = 13.82 kg. Asserting 13.83 falsifies
          the wrong evaluation order.
        test_recipe:
          setup:
            - "F1 ACTIVE; M1; batch B1 planned 3 gal driven to QC_APPROVED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
