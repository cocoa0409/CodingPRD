            - "DisclosureCell.${cell1}.suppression_state == PENDING and released_count is null and version == 1"
            - "DisclosureCell.${cell2}.suppression_state == PENDING and released_count is null and version == 1"
            - "DataRequest.${dr}.cell_count == 2, suppressed_cell_count == 0, released_cell_count == 0, residual_disclosure_risk == false"
