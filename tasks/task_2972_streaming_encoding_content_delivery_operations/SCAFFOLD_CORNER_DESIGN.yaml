      - name: reprocess_job_referential_inflight_and_terminal_codes_are_triggerable
        claim_type: triggerable
        grounds:
          - errors[ERR_REPROCESS_CODEC_UNCHANGED]
          - errors[ERR_REPROCESS_JOB_IN_FLIGHT]
          - errors[ERR_JOB_STATE_INVALID]
          - endpoints.POST_/reprocess-jobs/{id}/abort
        distinguishing_aspect: "Three distinct reprocess rejections stack on one fixture: re-encoding H264 into H264 is ERR_REPROCESS_CODEC_UNCHANGED, a second job while the first is QUEUED is ERR_REPROCESS_JOB_IN_FLIGHT, and aborting an already ABORTED job is ERR_JOB_STATE_INVALID — with each expected_title_version re-read, because only the successful create bumps Title.version."
        test_recipe:
          setup:
            - "One ACTIVE H264 DeviceProfile, one Title with a QC_PASSED asset, and one LOCKED H264 ladder."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 40.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-JOB-CODES", title_name: "Job Codes Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
