          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Facility 'El Paso SPC' in jurisdiction TX-ELP with visit_lead_time_hours 48, max_daily_visit_slots 1, expedited_filing_days 21 and access_credential_required true, so the earliest legal visit start is exactly 2026-08-05T09:00:00.000Z."
            - "Ada Ortiz's facility credential is patched to expire exactly on 2026-08-05; Ben Cole's stays null; Sara Ruiz's is patched to 2026-12-31."
            - "All bookings are made by ProgramDirector with client_conflict_waived true, isolating geometries A and C."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /detention-facilities"
