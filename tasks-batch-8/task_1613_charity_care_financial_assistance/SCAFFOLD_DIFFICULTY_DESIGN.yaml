scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: presumptive_score_full_vs_thin_file_divergence
        grounds:
          - calculations.presumptive_eligibility_score
          - entities.PresumptiveScreening.fields.propensity_score
          - entities.PresumptiveScreening.fields.thin_file
        distinguishing_aspect: |
          Same present factor scores (income_band=95, payment_history=90, public_benefit=95) produce
          propensity_score 76.50 when all five factors are supplied (full_file: 33.25+22.50+4.50+14.25+2.00)
          but 93.33 under thin_file renormalization (70.00/0.75) — two valid scoring approaches on the
          PresumptiveScreening domain yielding different outcomes (ELIGIBLE_PARTIAL vs ELIGIBLE_FULL).
        test_recipe:
          setup:
            - "ACTIVE policy FAP-2026 with presumptive thresholds 70.0 / 90.0"
            - "Patient P with two PRESUMPTIVE applications A_full and A_thin, both UNDER_REVIEW (open-application rule forces two patients OR sequential lifecycle; here two patients are used)"
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /charity-care/policies"
              payload: { policy_code: "FAP-2026", fpl_base_cents: 1500000, fpl_increment_cents: 500000, full_discount_max_fpl_pct: 200, partial_discount_max_fpl_pct: 300, partial_discount_floor_pct: 50.0, asset_limit_cents: 2500000, retroactive_window_days: 240, notification_period_days: 120, eca_notice_days: 30, doc_response_days: 30, presumptive_partial_score_threshold: 70.0, presumptive_full_score_threshold: 90.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { pol_id: $.data.id }
            - call: "POST /charity-care/policies/${pol_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /charity-care/patients"
              payload: { full_name: "Full File", date_of_birth: "1980-01-01", ssn_last4: "1111", mrn: "MRN-FULL-1" }
              as: FinancialCounselor
              captures: { pat_full: $.data.id }
            - call: "POST /charity-care/patients"
              payload: { full_name: "Thin File", date_of_birth: "1980-01-01", ssn_last4: "2222", mrn: "MRN-THIN-1" }
              as: FinancialCounselor
              captures: { pat_thin: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat_full}", screening_source: "PRESUMPTIVE", reported_annual_income_cents: 3000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app_full: $.data.id }
            - call: "POST /charity-care/applications/${app_full}/members"
              payload: { full_name: "Full File", relationship: "SELF", age: 46 }
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app_full}/submit"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app_full}/begin-review"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat_thin}", screening_source: "PRESUMPTIVE", reported_annual_income_cents: 3000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app_thin: $.data.id }
            - call: "POST /charity-care/applications/${app_thin}/members"
              payload: { full_name: "Thin File", relationship: "SELF", age: 46 }
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app_thin}/submit"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app_thin}/begin-review"
              payload: {}
              as: FinancialCounselor
          trigger:
            - call: "POST /charity-care/applications/${app_full}/presumptive-screening"
              payload: { income_band_score: 95, payment_history_score: 90, utilization_score: 30, public_benefit_score: 95, housing_stability_score: 20 }
              as: FinancialCounselor
              captures: { score_full: $.data.propensity_score, outcome_full: $.data.outcome }
            - call: "POST /charity-care/applications/${app_thin}/presumptive-screening"
              payload: { income_band_score: 95, payment_history_score: 90, public_benefit_score: 95 }
              as: FinancialCounselor
              captures: { score_thin: $.data.propensity_score, outcome_thin: $.data.outcome }
          assert:
            - "PresumptiveScreening.${app_full}.propensity_score == 76.50"
            - "PresumptiveScreening.${app_full}.thin_file == false"
            - "PresumptiveScreening.${app_full}.outcome == ELIGIBLE_PARTIAL"
            - "PresumptiveScreening.${app_thin}.propensity_score == 93.33"
            - "PresumptiveScreening.${app_thin}.thin_file == true"
            - "PresumptiveScreening.${app_thin}.outcome == ELIGIBLE_FULL"

      - name: determination_basis_verified_sliding_vs_presumptive_flat
        grounds:
          - calculations.discount_tier_assignment
          - entities.DiscountDetermination.fields.discount_pct
          - entities.DiscountDetermination.fields.basis
        distinguishing_aspect: |
          Same account (patient_responsibility 1000000 cents) decided under basis=VERIFIED_APPLICATION with
          fpl_pct 250.0000 yields discount_pct 75.00 (sliding scale), while basis=PRESUMPTIVE_SCORE with
          outcome ELIGIBLE_PARTIAL yields flat 50.00 — different entity domain (DiscountDetermination/PatientAccount
          ledger vs Rule-1 sibling's PresumptiveScreening) and a divergence observable on DiscountDetermination.discount_pct.
        test_recipe:
          setup:
            - "ACTIVE policy FAP-2026"
            - "Patient A with STANDARD application UNDER_REVIEW, VERIFIED TAX_RETURN 3750000 cents (size 1 => fpl_pct 250.0000) and VERIFIED IDENTITY doc, account ACC-A resp 1000000"
            - "Patient B with PRESUMPTIVE application UNDER_REVIEW, screening outcome ELIGIBLE_PARTIAL (score 76.50), account ACC-B resp 1000000"
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /charity-care/policies"
              payload: { policy_code: "FAP-2026", fpl_base_cents: 1500000, fpl_increment_cents: 500000, full_discount_max_fpl_pct: 200, partial_discount_max_fpl_pct: 300, partial_discount_floor_pct: 50.0, asset_limit_cents: 2500000, retroactive_window_days: 240, notification_period_days: 120, eca_notice_days: 30, doc_response_days: 30, presumptive_partial_score_threshold: 70.0, presumptive_full_score_threshold: 90.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { pol_id: $.data.id }
            - call: "POST /charity-care/policies/${pol_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /charity-care/patients"
              payload: { full_name: "Vera Verified", date_of_birth: "1975-05-05", ssn_last4: "3333", mrn: "MRN-VER-1" }
              as: FinancialCounselor
              captures: { pat_a: $.data.id }
            - call: "POST /charity-care/accounts"
              payload: { patient_id: "${pat_a}", encounter_date: "2026-01-10", total_charges_cents: 1000000, insurance_paid_cents: 0 }
              as: BillingAdministrator
              captures: { acc_a: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat_a}", screening_source: "STANDARD", reported_annual_income_cents: 3750000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app_a: $.data.id }
            - call: "POST /charity-care/applications/${app_a}/members"
              payload: { full_name: "Vera Verified", relationship: "SELF", age: 50 }
              as: FinancialCounselor
              captures: { mem_a: $.data.id }
            - call: "POST /charity-care/applications/${app_a}/submit"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app_a}/begin-review"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app_a}/documents"
              payload: { doc_type: "TAX_RETURN", period_start: "2025-01-01", period_end: "2025-12-31", amount_cents: 3750000, household_member_id: "${mem_a}" }
              as: FinancialCounselor
              captures: { doc_inc: $.data.id }
            - call: "POST /charity-care/documents/${doc_inc}/verify"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app_a}/documents"
              payload: { doc_type: "IDENTITY", period_start: "2026-01-01", period_end: "2026-01-01", amount_cents: 0, household_member_id: "${mem_a}" }
              as: FinancialCounselor
              captures: { doc_idn: $.data.id }
            - call: "POST /charity-care/documents/${doc_idn}/verify"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/patients"
              payload: { full_name: "Paul Presumptive", date_of_birth: "1982-02-02", ssn_last4: "4444", mrn: "MRN-PRE-1" }
              as: FinancialCounselor
              captures: { pat_b: $.data.id }
            - call: "POST /charity-care/accounts"
              payload: { patient_id: "${pat_b}", encounter_date: "2026-01-12", total_charges_cents: 1000000, insurance_paid_cents: 0 }
              as: BillingAdministrator
              captures: { acc_b: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat_b}", screening_source: "PRESUMPTIVE", reported_annual_income_cents: 3750000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app_b: $.data.id }
            - call: "POST /charity-care/applications/${app_b}/members"
              payload: { full_name: "Paul Presumptive", relationship: "SELF", age: 44 }
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app_b}/submit"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app_b}/begin-review"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app_b}/presumptive-screening"
              payload: { income_band_score: 95, payment_history_score: 90, utilization_score: 30, public_benefit_score: 95, housing_stability_score: 20 }
              as: FinancialCounselor
            - call: "GET /charity-care/applications/${app_a}"
              as: FinancialCounselor
              captures: { app_a_v: $.data.version }
            - call: "GET /charity-care/applications/${app_b}"
              as: FinancialCounselor
              captures: { app_b_v: $.data.version }
          trigger:
            - call: "POST /charity-care/determinations"
              payload: { application_id: "${app_a}", basis: "VERIFIED_APPLICATION", covered_account_ids: ["${acc_a}"], expected_application_version: "${app_a_v}" }
              as: AssistanceReviewer
              captures: { det_a: $.data.id, pct_a: $.data.discount_pct }
            - call: "POST /charity-care/determinations"
              payload: { application_id: "${app_b}", basis: "PRESUMPTIVE_SCORE", covered_account_ids: ["${acc_b}"], expected_application_version: "${app_b_v}" }
              as: AssistanceReviewer
              captures: { det_b: $.data.id, pct_b: $.data.discount_pct }
          assert:
            - "DiscountDetermination.${det_a}.tier == TIER_PARTIAL"
            - "DiscountDetermination.${det_a}.discount_pct == 75.00"
            - "DiscountDetermination.${det_a}.fpl_pct_snapshot == 250.0000"
            - "DiscountDetermination.${det_b}.tier == TIER_PARTIAL"
            - "DiscountDetermination.${det_b}.discount_pct == 50.00"
            - "DiscountDetermination.${det_b}.fpl_pct_snapshot == null"
            - "DiscountDetermination.${det_a}.discount_pct != DiscountDetermination.${det_b}.discount_pct"

  # =================================================================
  # Rule 2 — combinatorial_formula (different modes a, b, c)
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tier_assignment_mode_a_multivariable_sliding_scale
        grounds:
          - calculations.discount_tier_assignment
          - calculations.fpl_percentage
        distinguishing_aspect: |
          Mode (a): discount_pct = f(fpl_pct, verified_assets, asset_limit, full/partial band edges, floor) with
          nested conditionals — asset test overrides income; sliding scale interpolates between floor and 100.
          Income 3750000 (250.0000%) with assets 0 => 75.00; identical income with assets 2500001 => INELIGIBLE 0.00.
        test_recipe:
          setup:
            - "ACTIVE policy FAP-2026 (asset_limit 2500000)"
            - "Patient with STANDARD application UNDER_REVIEW; VERIFIED TAX_RETURN 3750000 and VERIFIED IDENTITY; VERIFIED BANK_STATEMENT 2500001 for member covering 2026-01"
            - "Account ACC resp 1000000"
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /charity-care/policies"
              payload: { policy_code: "FAP-2026", fpl_base_cents: 1500000, fpl_increment_cents: 500000, full_discount_max_fpl_pct: 200, partial_discount_max_fpl_pct: 300, partial_discount_floor_pct: 50.0, asset_limit_cents: 2500000, retroactive_window_days: 240, notification_period_days: 120, eca_notice_days: 30, doc_response_days: 30, presumptive_partial_score_threshold: 70.0, presumptive_full_score_threshold: 90.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { pol_id: $.data.id }
            - call: "POST /charity-care/policies/${pol_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /charity-care/patients"
              payload: { full_name: "Asset Heavy", date_of_birth: "1970-03-03", ssn_last4: "5555", mrn: "MRN-ASSET-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
            - call: "POST /charity-care/accounts"
              payload: { patient_id: "${pat}", encounter_date: "2026-01-10", total_charges_cents: 1000000, insurance_paid_cents: 0 }
              as: BillingAdministrator
              captures: { acc: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "STANDARD", reported_annual_income_cents: 3750000, reported_liquid_assets_cents: 2500001 }
              as: FinancialCounselor
              captures: { app: $.data.id }
            - call: "POST /charity-care/applications/${app}/members"
              payload: { full_name: "Asset Heavy", relationship: "SELF", age: 55 }
              as: FinancialCounselor
              captures: { mem: $.data.id }
            - call: "POST /charity-care/applications/${app}/submit"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/begin-review"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/documents"
              payload: { doc_type: "TAX_RETURN", period_start: "2025-01-01", period_end: "2025-12-31", amount_cents: 3750000, household_member_id: "${mem}" }
              as: FinancialCounselor
              captures: { d1: $.data.id }
            - call: "POST /charity-care/documents/${d1}/verify"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/documents"
              payload: { doc_type: "IDENTITY", period_start: "2026-01-01", period_end: "2026-01-01", amount_cents: 0, household_member_id: "${mem}" }
              as: FinancialCounselor
              captures: { d2: $.data.id }
            - call: "POST /charity-care/documents/${d2}/verify"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/documents"
              payload: { doc_type: "BANK_STATEMENT", period_start: "2026-01-01", period_end: "2026-01-31", amount_cents: 2500001, household_member_id: "${mem}" }
              as: FinancialCounselor
              captures: { d3: $.data.id }
            - call: "POST /charity-care/documents/${d3}/verify"
              payload: {}
              as: FinancialCounselor
            - call: "GET /charity-care/applications/${app}"
              as: FinancialCounselor
              captures: { app_v: $.data.version }
          trigger:
            - call: "POST /charity-care/determinations"
              payload: { application_id: "${app}", basis: "VERIFIED_APPLICATION", covered_account_ids: ["${acc}"], expected_application_version: "${app_v}" }
              as: AssistanceReviewer
              captures: { det: $.data.id }
          assert:
            - "DiscountDetermination.${det}.tier == INELIGIBLE"
            - "DiscountDetermination.${det}.discount_pct == 0.00"
            - "DiscountDetermination.${det}.fpl_pct_snapshot == 250.0000 (income alone would have been TIER_PARTIAL 75.00 — asset test override is the only explanation)"

      - name: adjustment_rounding_mode_b_per_account_then_sum
        grounds:
          - calculations.account_adjustment_computation
          - entities.AccountAdjustment.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): rounding order pinned as round-per-account-then-sum. Two accounts with
          patient_responsibility 100001 cents each at discount_pct 50.00 yield 50001 + 50001 = 100002 total;
          the forbidden sum-then-round order yields round(200002*0.50)=100001 — one cent apart.
        test_recipe:
          setup:
            - "ACTIVE policy FAP-2026"
            - "Patient with STANDARD application UNDER_REVIEW; VERIFIED TAX_RETURN 4500000 (exactly 300.0000% => TIER_PARTIAL 50.00) + VERIFIED IDENTITY"
            - "Two accounts ACC1/ACC2 each total_charges 100001, insurance 0 (resp 100001)"
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /charity-care/policies"
              payload: { policy_code: "FAP-2026", fpl_base_cents: 1500000, fpl_increment_cents: 500000, full_discount_max_fpl_pct: 200, partial_discount_max_fpl_pct: 300, partial_discount_floor_pct: 50.0, asset_limit_cents: 2500000, retroactive_window_days: 240, notification_period_days: 120, eca_notice_days: 30, doc_response_days: 30, presumptive_partial_score_threshold: 70.0, presumptive_full_score_threshold: 90.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { pol_id: $.data.id }
            - call: "POST /charity-care/policies/${pol_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /charity-care/patients"
              payload: { full_name: "Round Robin", date_of_birth: "1965-06-06", ssn_last4: "6666", mrn: "MRN-ROUND-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
            - call: "POST /charity-care/accounts"
              payload: { patient_id: "${pat}", encounter_date: "2026-01-10", total_charges_cents: 100001, insurance_paid_cents: 0 }
              as: BillingAdministrator
              captures: { acc1: $.data.id }
            - call: "POST /charity-care/accounts"
              payload: { patient_id: "${pat}", encounter_date: "2026-01-11", total_charges_cents: 100001, insurance_paid_cents: 0 }
              as: BillingAdministrator
              captures: { acc2: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "STANDARD", reported_annual_income_cents: 4500000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app: $.data.id }
            - call: "POST /charity-care/applications/${app}/members"
              payload: { full_name: "Round Robin", relationship: "SELF", age: 60 }
              as: FinancialCounselor
              captures: { mem: $.data.id }
            - call: "POST /charity-care/applications/${app}/submit"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/begin-review"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/documents"
              payload: { doc_type: "TAX_RETURN", period_start: "2025-01-01", period_end: "2025-12-31", amount_cents: 4500000, household_member_id: "${mem}" }
              as: FinancialCounselor
              captures: { d1: $.data.id }
            - call: "POST /charity-care/documents/${d1}/verify"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/documents"
              payload: { doc_type: "IDENTITY", period_start: "2026-01-01", period_end: "2026-01-01", amount_cents: 0, household_member_id: "${mem}" }
              as: FinancialCounselor
              captures: { d2: $.data.id }
            - call: "POST /charity-care/documents/${d2}/verify"
              payload: {}
              as: FinancialCounselor
            - call: "GET /charity-care/applications/${app}"
              as: FinancialCounselor
              captures: { app_v: $.data.version }
            - call: "POST /charity-care/determinations"
              payload: { application_id: "${app}", basis: "VERIFIED_APPLICATION", covered_account_ids: ["${acc1}", "${acc2}"], expected_application_version: "${app_v}" }
              as: AssistanceReviewer
              captures: { det: $.data.id }
            - call: "POST /charity-care/determinations/${det}/finalize"
              payload: {}
              as: AssistanceReviewer
          trigger:
            - call: "GET /charity-care/accounts/${acc1}"
              as: BillingAdministrator
              captures: { acc1_v: $.data.version }
            - call: "POST /charity-care/accounts/${acc1}/adjustments"
              payload: { determination_id: "${det}", expected_account_version: "${acc1_v}" }
              as: BillingAdministrator
              captures: { adj1: $.data.id }
            - call: "GET /charity-care/accounts/${acc2}"
              as: BillingAdministrator
              captures: { acc2_v: $.data.version }
            - call: "POST /charity-care/accounts/${acc2}/adjustments"
              payload: { determination_id: "${det}", expected_account_version: "${acc2_v}" }
              as: BillingAdministrator
              captures: { adj2: $.data.id }
          assert:
            - "AccountAdjustment.${adj1}.amount_cents == 50001"
            - "AccountAdjustment.${adj2}.amount_cents == 50001"
            - "sum of POSTED WRITE_OFF amounts for determination ${det} == 100002 (sum-then-round would give 100001)"
            - "PatientAccount.${acc1}.adjusted_balance_cents == 50000"
            - "PatientAccount.${acc2}.adjusted_balance_cents == 50000"

      - name: refund_due_mode_c_evaluation_order_pinned
        grounds:
          - calculations.refund_due_derivation
          - calculations.retroactive_refund_waterfall
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — refunds mutate effective_payments_cents, which feeds
          overpayment_cents, which feeds refund_due — pinned to the order (1) adjusted_balance, (2)
          effective_payments, (3) overpayment, (4) refund_due; a single pass terminates. Payments
          300000+500000+250000 = 1050000 against a 75% write-off of 1000000 responsibility leave
          adjusted 250000, overpayment 800000, refunded newest-first: 250000, 500000, then 50000 partial.
        test_recipe:
          setup:
            - "ACTIVE policy FAP-2026"
            - "Account ACC resp 1000000, FIRST_STATEMENT at 2026-01-01; payments P1 300000 (2026-02-10), P2 500000 (2026-03-10), P3 250000 (2026-04-10)"
            - "STANDARD application UNDER_REVIEW submitted 2026-05-01 (120 days after statement, within 240-day window); TAX_RETURN 3750000 (75.00%) + IDENTITY verified; determination FINAL covering ACC"
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
