  - method: POST
    path: "/panel-shop/as-built-packages/{id}/return-for-rework"
    description: "QA returns a package (PENDING_REVIEW -> INCOMPLETE)."
    roles: [QAManager]
    code: 200
    input: []
    output: AsBuiltPackage
    side_effects: ["AsBuiltPackage.version incremented by 1"]
  - method: POST
    path: "/panel-shop/as-built-packages/{id}/release"
    description: "PM releases an approved package (APPROVED -> RELEASED); unblocks job shipping gate."
    roles: [ProjectManager]
    code: 200
    input: []
    output: AsBuiltPackage
    side_effects: ["AsBuiltPackage.version incremented by 1", "job_posture_derivation re-evaluated"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted on this endpoint."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed Customer acting on a Job/ChangeOrder/SubstitutionRequest whose owning customer_id != X-User-ID."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated resource id does not exist."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body-referenced FK (customer_id, component_id, panel_id, original_line_id, proposed_component_id) does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in a state from which the requested transition is defined."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version does not match the parent's current version."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Approver/verifier is the same user as the designer/requester, violating UL 508A SoD."
  - id: ERR_SCCR_BELOW_MINIMUM
    http: 422
    condition: "Panel submit-review with sccr_rating_ka < 5."
  - id: ERR_SUBSTITUTION_DOWNRATED
    http: 422
    condition: "Substitution approval would lower the panel SCCR chain or references an inactive proposed component."
  - id: ERR_OUTSIDE_SCHEDULED_WINDOW
    http: 422
    condition: "Startup start attempted before scheduled_start or after scheduled_end."
  - id: ERR_WARRANTY_EXPIRED
    http: 422
    condition: "Claim filed or triaged after Job.warranty_expires_at, or job not yet commissioned (null expiry)."
  - id: ERR_ENGINEER_DOUBLE_BOOKED
    http: 422
    condition: "New startup window overlaps (half-open) an existing SCHEDULED/IN_PROGRESS session for the same engineer_id."
  - id: ERR_PANEL_TURNOVER_VIOLATION
    http: 422
    condition: "New startup session for the same Panel begins less than 24h after another SCHEDULED/IN_PROGRESS session's scheduled_end (turnover buffer)."
  - id: ERR_COMPONENT_INACTIVE
    http: 422
    condition: "Referencing a Component with active == false in a new BOM line or substitution request."
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation: part_number, content_hash per panel, version_tag per panel, panel_tag per job, job_number per customer, or duplicate component on a panel."
  - id: ERR_CREDIT_HOLD
    http: 402
    condition: "Customer.credit_hold == true blocks job creation, advance, substitution approval, or change-order approval."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing/invalid required field, out-of-range value, or enum violation."
  - id: ERR_CLAIM_INADMISSIBLE
    http: 422
    condition: "Warranty claim filed against a job with no COMMISSIONED panel, or negative labor hours."
  - id: ERR_REMOTE_ACCESS_REQUIRED
    http: 422
    condition: "support_mode == REMOTE without remote_access_granted == true."
  - id: ERR_TEST_POINTS_UNDECIDED
    http: 422
    condition: "Completing a session with any UNTESTED point, or recording a result for a non-UNTESTED point / non-OPEN session."
  - id: ERR_PANEL_NOT_READY
    http: 409
    condition: "Panel precondition for the requested gate failed (no BOM lines, no test points, no RELEASED program, open substitution requests)."
  - id: ERR_JOB_GATE_BLOCKED
    http: 409
    condition: "Job-level gate failed: close with open change orders or open warranty claims; ship when not READY_TO_SHIP."
  - id: ERR_BACKUP_REQUIRED
    http: 422
    condition: "Startup completion without a RELEASED ProgramVersion with site_backup_taken == true."
  - id: ERR_INVALID_REQUEST_BODY
    http: 400
    condition: "Malformed JSON body or wrong top-level type."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProjectManager
    description: "Owns jobs, change orders, scheduling, and commercial gates."
    identity: "opaque"
    exclusive_operations:
      - "POST /panel-shop/jobs, /jobs/{id}/advance, /hold, /resume, /close"
      - "POST /panel-shop/customers, PATCH /panel-shop/customers/{id}"
      - "POST /panel-shop/jobs/{id}/change-orders, /change-orders/{id}/repropose, /withdraw, /rescind"
      - "POST /panel-shop/panels/{panel_id}/startup-sessions, /startup-sessions/{id}/cancel"
      - "POST /panel-shop/as-built-packages/{id}/release"
      - "POST /panel-shop/warranty-claims/{id}/settle, /close"
      - "POST /panel-shop/panels/{id}/release-procurement"
    shared_operations:
      - "GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: QAManager
    description: "UL 508A compliance authority: design approval, labeling, substitution approval, warranty triage, as-built approval."
    identity: "opaque"
    exclusive_operations:
