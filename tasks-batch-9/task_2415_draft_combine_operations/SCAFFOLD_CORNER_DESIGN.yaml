      - name: waiver_info_request_cap_is_enforced
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WAIVER_ROUNDS_EXHAUSTED]
          - validations.priority_29
        distinguishing_aspect: "A third REQUEST_INFO after two information requests must be refused."
        excluded_because:
          difficulty_instance: waiver_review_loop_survives_two_info_requests_and_third_is_rejected
          rationale: "The §1.8 cyclic-loop instance walks the review cycle twice and asserts the error on the third request, together with info_request_count staying at 2."
      - name: trade_negotiation_round_cap_is_enforced
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TRADE_ROUNDS_EXHAUSTED]
          - validations.priority_30
        distinguishing_aspect: "A fourth counter after three negotiation rounds must be refused."
        excluded_because:
          difficulty_instance: trade_counter_cycle_consumes_three_rounds_and_fourth_counter_rejected
          rationale: "The §1.8 instance alternates counters until round_index reaches 3 and then asserts the error, which is the only way to reach this code."
      - name: share_without_consent_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONSENT_NOT_GRANTED]
          - validations.priority_11
        distinguishing_aspect: "A share request for a prospect who has not granted consent, or whose scope is narrower, must be refused."
        excluded_because:
          difficulty_instance: full_scope_share_blocked_by_narrower_prospect_consent_scope
          rationale: "The §1.8 instance triggers this code on the scope comparison and the companion priority instance triggers it on the missing-consent branch."
      - name: action_after_the_clock_expires_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CLOCK_ALREADY_EXPIRED]
          - validations.priority_18
        distinguishing_aspect: "A selection or clock action at or after deadline_at must be refused."
        excluded_because:
          difficulty_instance: expired_clock_priority_18_outranks_timeout_exhaustion_priority_38
          rationale: "The §1.8 priority instance crosses deadline_at and asserts this exact code, so a separate breadth trigger would repeat the same call."
      - name: late_declaration_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DECLARATION_DEADLINE_PASSED]
          - validations.priority_16
        distinguishing_aspect: "A declaration after declaration_deadline_at without a granted LATE_DECLARATION waiver must be refused."
        excluded_because:
          difficulty_instance: declaration_deadline_priority_16_outranks_already_declared_priority_28
          rationale: "The §1.8 priority instance moves the clock past the deadline and asserts this code; the waived-path success is asserted in the same recipe."
      - name: operation_in_the_wrong_cycle_phase_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CYCLE_PHASE_INVALID]
          - validations.priority_7
        distinguishing_aspect: "An operation attempted outside the phase that permits it must be refused."
        excluded_because:
          difficulty_instance: selection_blocked_while_parent_cycle_is_suspended
          rationale: "The §1.8 cross-entity instance asserts this code for a selection made while the parent cycle is not accepting selections."
      - name: contract_against_an_unused_pick_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONTRACT_PICK_MISMATCH]
          - validations.priority_24
        distinguishing_aspect: "A DRAFTED contract whose draft_pick_id is not a USED pick for that prospect and club must be refused."
        excluded_because:
          difficulty_instance: rookie_contract_offer_blocked_because_pick_is_not_used_yet
          rationale: "The §1.8 cross-entity instance offers the contract against a still-PENDING pick and asserts this code, then re-offers successfully after the selection."
      - name: station_buffer_conflict_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STATION_SLOT_CONFLICT]
          - validations.priority_32
        distinguishing_aspect: "A booking whose buffer-inflated interval overlaps an active booking on the same station must be refused."
        excluded_because:
          difficulty_instance: station_turnaround_buffer_inflates_the_new_interval_on_both_sides
          rationale: "The §1.8 resource-overlap instance tests the inflated interval on both sides plus the just-clear case, which fully covers this code."
      - name: room_capacity_overflow_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ROOM_CAPACITY_EXCEEDED]
          - validations.priority_33
        distinguishing_aspect: "A third overlapping interview on a capacity-2 room must be refused while adjacency stays legal."
        excluded_because:
          difficulty_instance: interview_room_capacity_counts_overlaps_but_not_adjacency
          rationale: "The §1.8 instance fills the room to capacity, asserts the overflow error and then books the adjacent slot successfully."
      - name: prospect_itinerary_gap_conflict_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROSPECT_ITINERARY_CONFLICT]
          - validations.priority_34
        distinguishing_aspect: "A second booking inside the prospect 10-minute travel gap must be refused even on a different resource."
        excluded_because:
          difficulty_instance: prospect_itinerary_travel_gap_blocks_a_second_resource_booking
          rationale: "The §1.8 instance books across two different resource types to isolate the itinerary rule from the station and room rules."
