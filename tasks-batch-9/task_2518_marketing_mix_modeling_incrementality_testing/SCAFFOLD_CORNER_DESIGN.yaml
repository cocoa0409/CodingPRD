          - "entities.Market.held_out_population - sum over cells whose assignment_state IN {TREATMENT, CONTROL, WASHOUT}"
          - "entities.Market.held_out_population_pct - round(100 * held_out_population / total_population, 2), round_half_up"
          - "state_machines GeoCell UNASSIGNED -> TREATMENT/CONTROL side_effects - Market.held_out_population += population"
        distinguishing_aspect: |
          Two derived sums over the same child rows move on DIFFERENT events: creating a cell moves
          celled_population and leaves held_out_population at 0, while assigning cells moves
          held_out_population and leaves celled_population untouched - and the reporting percentage is
          recomputed from the raw counter each time, giving 2.50 on 250000 of 10000000 rather than a stored
          stale value.
          
