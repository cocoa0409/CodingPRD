          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register one lead-content rule, a non-durable category with sampling_floor_units 1, and an ALWAYS mapping."
            - "Register an INDEPENDENT laboratory with concurrent_slot_capacity 2, a current attestation and a zero-surcharge accreditation for the rule."
            - "Register a product with projected_annual_units 6000 so the INITIAL plan authorizes ceil(6000/2500)=3 plus base 3, i.e. 6 units for one rule; add one painted part, scope onto FULL_PRODUCT_TEST and activate the plan."
