            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_b}", party_size: 1, container_count: 4, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_s2: $.data.id } }
