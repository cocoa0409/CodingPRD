  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_confirm_requires_active_route
        grounds:
          - state_machines.RouteOrder.PLANNED_to_CONFIRMED
          - state_machines.Route.ACTIVE_to_SUSPENDED
          - errors[ERR_ROUTE_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair RouteOrder -> Route: confirm is rejected with
          ERR_ROUTE_NOT_ACTIVE while the parent route is SUSPENDED and succeeds
          after re-activation; companion instance crosses a different pair
          (RouteSaleListing -> RouteOrder).
        test_recipe:
          setup:
            - "Distributor, ACTIVE route R1, store (credit_limit 100000000), driver, product PL 250c; trip T1; order O1 (10 units, window 08:00-08:30) PLANNED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist N", license_number: "LIC-N-1" }
              as: TerritoryManager
              captures: { d1: $.data.id }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-N", name: "Route N", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: $.data.id }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-N", name: "Store N", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: $.data.id }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/products"
              payload: { sku: "BUTTER-7", name: "Butter", units_per_case: 1, shelf_life_days: 60, regulated: false, list_price_cents: 250 }
              as: TerritoryManager
              captures: { pl: $.data.id }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Ned Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: $.data.id }
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 1000, planned_depart_at: "2026-08-10T05:00:00Z", planned_return_at: "2026-08-10T13:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${pl}", quantity_units: 10 }], delivery_window_start: "2026-08-10T08:00:00Z", delivery_window_end: "2026-08-10T08:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
          trigger:
            - { call: "POST /dairy/routes/${r1}/suspend", payload: {}, as: TerritoryManager }
            - { call: "POST /dairy/orders/${o1}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}", captures: { err: "$.data.error_id" } }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - { call: "POST /dairy/orders/${o1}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}", captures: { o1_status: "$.data.fulfillment_status" } }
          assert:
            - "err == ERR_ROUTE_NOT_ACTIVE while route SUSPENDED (cross-entity gate Order -> Route)"
            - "o1_status == CONFIRMED after route re-activated (cycle SUSPENDED -> ACTIVE restores the gate)"

      - name: listing_approve_transfer_blocked_by_open_orders
        grounds:
          - state_machines.RouteSaleListing.UNDER_CONTRACT_to_CLOSED
          - errors[ERR_ROUTE_HAS_OPEN_ORDERS]
          - entities.Route.fields.distributor_id
        distinguishing_aspect: |
          Entity pair RouteSaleListing -> RouteOrder: approve-transfer is
          rejected with ERR_ROUTE_HAS_OPEN_ORDERS while any order on the route
          is PLANNED or CONFIRMED, and succeeds after the order is cancelled —
          transferring route.distributor_id to the buyer. Different pair than
          order_confirm_requires_active_route.
        test_recipe:
          setup:
            - "Distributors D1 (seller) and D2 (buyer); route R1 ACTIVE owned by D1; store S1; product PL 250c; driver DR1"
            - "Trip T1 and order O1 PLANNED on the route (open order)"
            - "Listing L1 published, offer from D2 submitted, accepted -> UNDER_CONTRACT"
          setup_api_calls:
