            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v2", effective_date: "2026-07-15T00:00:00Z", version_note: "tightened moisture band", supersedes_spec_id: "${spec1}", expected_ingredient_version: "${ing_v4}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec2: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec2}/parameters"
              payload: { parameter_name: "moisture", criticality: "MINOR", uom: "percent", target_value: 4, min_value: 0, max_value: 8 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec2}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec2}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
          trigger:
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec2}/make-effective"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "GET /sourcing/ingredients/${ing_id}/approved-sources"
              payload: { status: "SUSPENDED" }
              as: ProcurementManager
              captures: { susp_a: "$.data[0].suspension_reason" }
            - call: "GET /sourcing/ingredients/${ing_id}"
              payload: {}
              as: ProcurementManager
              captures: { breach: $.data.current_dual_source_breach, active_spec: $.data.active_spec_id }
          assert:
            - "Spec v1 status == SUPERSEDED; ingredient.active_spec_id == spec v2 id"
            - "Both sources A and B status == SUSPENDED with suspension_reason == MANUAL (stale-pin sweep)"
            - "ingredient.current_dual_source_breach == true (0 ACTIVE sources on EFFECTIVE spec v2 with requires_dual_source)"

      - name: coa_reject_risk_spike_auto_suspends_supplier_depth2
        grounds:
          - state_machines.CertificateOfAnalysis.UNDER_REVIEW_to_REJECTED
          - state_machines.Supplier.QUALIFIED_to_SUSPENDED
          - calculations.supplier_composite_risk_score
          - state_machines.ApprovedSource.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (CoA close-review REJECT):
          rejection -> supplier composite risk recomputed (reject rate 100 in
          the 365-day window stacks with prior audit and overdue-CAPA
          components to exactly 90.00) -> supplier auto-suspends at >= 70 ->
          the supplier's ACTIVE approved source cascades to SUSPENDED with
          suspension_reason=SUPPLIER_SUSPENDED. Each hop is caused by the
          previous hop, not by the close-review call itself.
        test_recipe:
          setup:
            - "Ingredient VIT-1 with EFFECTIVE spec (param purity CRITICAL 95..100 target 97)"
            - "Supplier SUP-V QUALIFIED with one ACTIVE source + declarations valid 2026-01-01..2027-06-01 and an ACTIVE contract"
            - "Audit A1 on SUP-V: window 2026-08-01..2026-08-05, started, report issued with audit_score 0, no CAPAs, closed (audit_component becomes 100)"
            - "Audit A2 on SUP-V: window 2026-08-06..2026-08-09, started, report issued score 80; one CAPA due 2026-08-08T00:00:00Z left OPEN"
            - "Clock advanced to 2026-08-08T00:00:01Z so the CAPA is overdue (overdue_component 25; sweep recompute leaves composite at 55.00 < 70)"
            - "CoA BAD-1 registered with purity 90.0, reviewed (provisional score 300.00), finding dispositioned REJECT_LOT"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "VIT-1", name: "Vitamin One", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "purity", criticality: "CRITICAL", uom: "percent", target_value: 97, min_value: 95, max_value: 100 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/make-effective"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers"
              payload: { supplier_code: "SUP-V", legal_name: "Vitamin Supplier", risk_tier: "TIER_C", country_of_operation: "IN" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications"
              payload: { questionnaire_score: 72, document_pack_complete: true }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { qual_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications/${qual_id}/evaluate"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications/${qual_id}/decide"
              payload: { decision: "APPROVE", decision_note: "qualification approved" }
              as: QualityManager
              as_user_id: qm-1
            - call: "GET /sourcing/ingredients/${ing_id}"
              payload: {}
              as: ProcurementManager
              captures: { ing_v2: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources"
              payload: { supplier_id: "${sup_id}", pinned_spec_id: "${spec_id}", expected_ingredient_version: "${ing_v2}" }
              as: ProcurementManager
              captures: { src_id: $.data.id, src_v: $.data.version }
            - call: "POST /sourcing/approved-sources/${src_id}/declarations"
              payload: { declaration_type: "ALLERGEN", payload: { allergen_tags: ["NONE"] }, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-06-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /sourcing/approved-sources/${src_id}/declarations"
              payload: { declaration_type: "COUNTRY_OF_ORIGIN", payload: { country_codes: ["IN"], primary_country: "IN" }, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-06-01T00:00:00Z" }
