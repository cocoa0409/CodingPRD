- rule_id: resource_temporal_overlap
  instances:
  - name: policy_window_half_open_overlap_and_adjacency
    grounds:
    - validations[priority=9]
    - errors.ERR_POLICY_WINDOW_OVERLAP
    - entities.EligibilityPolicy.fields.effective_from
    distinguishing_aspect: 'Interval semantics: half-open [effective_from, effective_to) on EligibilityPolicy. A shared boundary (one policy''s
      effective_to == the other''s effective_from) does NOT overlap, while any interior intersection does. Different semantics than the closed-interval
      impact-report instance.'
    test_recipe:
      setup:
      - Logical clock set; policy P1 TX [2026-01-01, 2027-01-01) ACTIVE.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/eligibility-policies
        payload:
          name: TX Standard 400%
          state_code: TX
          fpl_multiplier: 4.0
          insolvency_qualifies: true
          effective_from: '2026-01-01'
          effective_to: '2027-01-01'
        as: EligibilityOfficer
        captures:
          pol_id: $.data.id
      - call: POST /api/eligibility-policies/${pol_id}/activate
        payload: {}
        as: EligibilityOfficer
      trigger:
      - call: POST /api/eligibility-policies
        payload:
          name: Overlap TX
          state_code: TX
          fpl_multiplier: 4.0
          insolvency_qualifies: true
          effective_from: '2026-06-01'
          effective_to: '2027-06-01'
        as: EligibilityOfficer
        captures:
          pol_ovl: $.data.id
      - call: POST /api/eligibility-policies/${pol_ovl}/activate
        payload: {}
        as: EligibilityOfficer
        captures:
          err1: $.data.error_id
      - call: POST /api/eligibility-policies
        payload:
          name: Adjacent TX
          state_code: TX
          fpl_multiplier: 4.0
          insolvency_qualifies: true
          effective_from: '2027-01-01'
          effective_to: '2028-01-01'
        as: EligibilityOfficer
        captures:
          pol_adj: $.data.id
      - call: POST /api/eligibility-policies/${pol_adj}/activate
        payload: {}
        as: EligibilityOfficer
      - call: POST /api/eligibility-policies
        payload:
          name: CA Overlap OK
          state_code: CA
          fpl_multiplier: 4.0
          insolvency_qualifies: true
          effective_from: '2026-06-01'
          effective_to: '2027-06-01'
        as: EligibilityOfficer
        captures:
          pol_ca: $.data.id
      - call: POST /api/eligibility-policies/${pol_ca}/activate
        payload: {}
        as: EligibilityOfficer
      assert:
      - 'Overlapping TX policy activation fails: 409, error_id == ERR_POLICY_WINDOW_OVERLAP; ${pol_ovl} stays DRAFT'
      - Adjacent TX policy [2027-01-01, 2028-01-01) activates successfully (half-open boundary touch is allowed)
      - CA policy with the same dates as the rejected TX one activates successfully (overlap is scoped per state_code)
  - name: report_period_closed_interval_overlap
    grounds:
    - validations[priority=9]
    - errors.ERR_REPORT_PERIOD_OVERLAP
    - entities.ImpactReport.fields.period_end
    distinguishing_aspect: 'Interval semantics: CLOSED [period_start, period_end] on ImpactReport (different entity and different semantics than
      the half-open policy window): two PUBLISHED GLOBAL reports sharing the boundary date 2026-09-30 DO overlap, while [2026-10-01, 2026-10-31]
      does not.'
    test_recipe:
      setup:
      - Logical clock set; empty database except the clock.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/impact-reports
        payload:
          scope: GLOBAL
          period_start: '2026-09-01'
          period_end: '2026-09-30'
          counting_variant: PER_ACCOUNT
        as: PlatformAdmin
        captures:
          r1: $.data.id
      - call: POST /api/impact-reports/${r1}/publish
        payload: {}
        as: PlatformAdmin
      - call: POST /api/impact-reports
        payload:
          scope: GLOBAL
          period_start: '2026-09-30'
          period_end: '2026-10-31'
          counting_variant: PER_ACCOUNT
        as: PlatformAdmin
        captures:
          r2: $.data.id
      - call: POST /api/impact-reports
        payload:
          scope: GLOBAL
          period_start: '2026-10-01'
          period_end: '2026-10-31'
          counting_variant: PER_ACCOUNT
        as: PlatformAdmin
        captures:
          r3: $.data.id
      trigger:
      - call: POST /api/impact-reports/${r2}/publish
        payload: {}
        as: PlatformAdmin
        captures:
          err2: $.data.error_id
      - call: POST /api/impact-reports/${r3}/publish
        payload: {}
        as: PlatformAdmin
      assert:
      - 'R2 publish fails: 409, error_id == ERR_REPORT_PERIOD_OVERLAP (closed interval shares boundary date 2026-09-30); R2 stays DRAFT'
      - R3 publish succeeds (first disjoint day after the boundary) and status == PUBLISHED
      - both DRAFT reports computed households_relieved == 0 and dollars_abolished_cents == 0 (no abolished accounts yet)
- rule_id: compensating_invariant
  instances:
  - name: donation_receive_refund_conserves_raised_cents
    grounds:
    - calculations.donation_netting
    - state_machines.Donation
    - entities.DonorCampaign.fields.raised_cents
    distinguishing_aspect: 'Conserved quantity: campaign funds. Invariant DonorCampaign.raised_cents == sum(net_cents over RECEIVED donations)
      holds after the forward action (receive) and after its compensating action (refund) - no drift.'
    test_recipe:
      setup:
      - Logical clock set; campaign goal 10000000; donations D1 gross 3333 (net 3236), D2 gross 100000 (fee 2900, net 97100) both received.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/donor-campaigns
        payload:
          name: Invariant Fund
          earmark_type: GENERAL
          goal_cents: 10000000
        as: DonorRelationsOfficer
        captures:
          icamp: $.data.id
      - call: POST /api/donor-campaigns/${icamp}/donations
        payload:
          donor_name: Dee Donor
          donor_email: dee@x.com
          gross_cents: 3333
        as: DonorRelationsOfficer
        captures:
          id1: $.data.id
      - call: POST /api/donations/${id1}/receive
        payload: {}
        as: FinanceOfficer
      - call: POST /api/donor-campaigns/${icamp}/donations
        payload:
          donor_name: Dee Donor
          donor_email: dee@x.com
          gross_cents: 100000
        as: DonorRelationsOfficer
        captures:
          id2: $.data.id
      - call: POST /api/donations/${id2}/receive
        payload: {}
        as: FinanceOfficer
      trigger:
      - call: GET /api/donor-campaigns/${icamp}
        payload: {}
        as: FinanceOfficer
      - call: POST /api/donations/${id1}/refund
        payload: {}
        as: FinanceOfficer
      - call: GET /api/donor-campaigns/${icamp}
        payload: {}
        as: FinanceOfficer
      assert:
      - 'After both receives: raised_cents == 100336 == 3236 + 97100 (exactly the RECEIVED nets)'
      - 'After refund of D1: raised_cents == 97100 == D2.net_cents alone'
      - Donation.${id1}.status == REFUNDED and Donation.${id2}.status == RECEIVED
