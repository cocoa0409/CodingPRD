# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Turf Equipment Distributor Programs & Course Fleet Leasing
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: trade_in_book_vs_market_divergence
        grounds:
          - calculations.trade_in_valuation
          - entities.TradeInAppraisal.fields.book_value_cents
          - entities.TradeInAppraisal.fields.market_value_cents
        distinguishing_aspect: |
          Dual-variant logic on the TradeInAppraisal/LeaseUnit domain: identical
          inputs (M1 list 7500000, hours 2200, grade B) yield book 3571429 under the
          84-month schedule but market 2773125 under the hours-decay index; the
          policy field selects which one valued_cents reports.
        test_recipe:
          setup:
            - "Distributor D1 ACTIVE (equipment channel, labor 14000)"
            - "Course C1 (BENTGRASS, CLUB) assigned to D1"
            - "Model M1 TOURNAMENT list 7500000"
            - "Lease L1 in DRAFT for C1 (cycle 36, start 2027-03-01)"
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA", "NV"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tess Torque" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /turf/technicians/${t1}/certify"
              payload: { level: "MASTER", expires_at: "2028-06-01T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/distributors/${d1}/compliance_review"
              as: CorporateAdmin
            - call: "POST /turf/courses"
              payload: { name: "Bent Pine CC", turf_profile: "BENTGRASS", cut_quality_standard: "CLUB", credit_limit_cents: 50000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { c1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "RM-5010H", category: "MOWER", tier: "TOURNAMENT", list_price_cents: 7500000, eligible_turf_types: ["BENTGRASS", "POA_ANNUA", "MIXED"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 9500, parts_support_years: 10 }
              as: CorporateAdmin
              captures: { m1: $.data.id }
            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 36, start_date: "2027-03-01", lines: [{ model_id: "${m1}", qty: 1 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /turf/appraisals"
              payload: { lease_id: "${l1}", model_id: "${m1}", external_serial: "OLD-001", hours: 2200, condition_grade: "B", policy: "BOOK" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { ap_book: $.data.id, ap_book_v: $.data.valued_cents }
            - call: "POST /turf/appraisals"
              payload: { lease_id: "${l1}", model_id: "${m1}", external_serial: "OLD-002", hours: 2200, condition_grade: "B", policy: "MARKET" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { ap_mkt: $.data.id, ap_mkt_v: $.data.valued_cents }
          assert:
            - "TradeInAppraisal.${ap_book}.book_value_cents == 3571429"
            - "TradeInAppraisal.${ap_book}.market_value_cents == 2773125"
            - "TradeInAppraisal.${ap_book}.valued_cents == 3571429 (BOOK policy selects book)"
            - "TradeInAppraisal.${ap_mkt}.valued_cents == 2773125 (MARKET policy selects market)"
            - "book_value_cents != market_value_cents for identical hours/grade/model inputs"
      - name: warranty_claimed_vs_factory_adjudication
        grounds:
          - calculations.warranty_labor_adjudication
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - entities.WarrantyClaim.fields.adjudicated_labor_cents
        distinguishing_aspect: |
          Dual-variant logic on the WarrantyClaim domain (different entity domain
          from trade-in valuation): the distributor-claimed labor (4h x 14000 =
          56000) and the factory allowance (4h x 9500 = 38000) are both computed
          from the same claim, and adjudication pays the min variant, 38000.
        test_recipe:
          setup:
            - "Distributor D1 ACTIVE with labor_rate_cents 14000, claim cap 50000000"
            - "Course C1 CLUB/BENTGRASS; M1 TOURNAMENT (factory cap 9500); unit IN_SERVICE with serial SN-A1"
            - "Lease L1 ACTIVE (start 2026-09-01 = default clock, cycle 36)"
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA", "NV"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tess Torque" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /turf/technicians/${t1}/certify"
              payload: { level: "MASTER", expires_at: "2028-06-01T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/distributors/${d1}/compliance_review"
              as: CorporateAdmin
            - call: "POST /turf/courses"
              payload: { name: "Bent Pine CC", turf_profile: "BENTGRASS", cut_quality_standard: "CLUB", credit_limit_cents: 50000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { c1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "RM-5010H", category: "MOWER", tier: "TOURNAMENT", list_price_cents: 7500000, eligible_turf_types: ["BENTGRASS", "POA_ANNUA", "MIXED"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 9500, parts_support_years: 10 }
              as: CorporateAdmin
              captures: { m1: $.data.id }
            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 36, start_date: "2026-09-01", lines: [{ model_id: "${m1}", qty: 1 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l1: $.data.id, l_v: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "SPEC_REVIEW", expected_lease_version: "${l_v}" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l_v2: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "APPROVED", expected_lease_version: "${l_v2}" }
              as: CorporateAdmin
              captures: { l_v3: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "ACTIVE", expected_lease_version: "${l_v3}" }
              as: DistributorManager
              as_user_id: "${d1}"
            - call: "GET /turf/units"
              payload: { lease_id: "${l1}" }
              as: CorporateAdmin
              captures: { u1: "$.data[0].id" }
            - call: "POST /turf/units/${u1}/transition"
              payload: { to: "DELIVERED", serial_number: "SN-A1" }
              as: DistributorManager
              as_user_id: "${d1}"
            - call: "POST /turf/units/${u1}/transition"
              payload: { to: "IN_SERVICE" }
              as: CourseManager
              as_user_id: "${c1}"
          trigger:
            - call: "POST /turf/warranty-claims"
              payload: { lease_unit_id: "${u1}", technician_id: "${t1}", labor_hours: 4, parts_cost_cents: 22000 }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { cl1: $.data.id, cl_v: $.data.version }
            - call: "POST /turf/warranty-claims/${cl1}/transition"
              payload: { to: "UNDER_REVIEW", expected_claim_version: "${cl_v}" }
              as: CorporateAdmin
              captures: { cl_v2: $.data.version }
            - call: "POST /turf/warranty-claims/${cl1}/transition"
              payload: { to: "APPROVED", expected_claim_version: "${cl_v2}" }
              as: CorporateAdmin
          assert:
            - "WarrantyClaim.${cl1}.claimed_labor_cents == 56000"
            - "WarrantyClaim.${cl1}.factory_allowance_cents == 38000"
            - "WarrantyClaim.${cl1}.adjudicated_labor_cents == 38000 (min variant wins)"
            - "WarrantyClaim.${cl1}.parts_reimbursed_cents == 24200"
            - "WarrantyClaim.${cl1}.payable_total_cents == 62200"
            - "claimed_labor_cents != adjudicated_labor_cents for identical claim inputs"
  - rule_id: combinatorial_formula
    instances:
      - name: lease_rate_tier_seasonal_credit_stack
        grounds:
          - calculations.fleet_lease_rate
          - state_machines.FleetLease.SPEC_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Mode (a) formula with >= 3 non-linear inputs: tier multiplier (CLUB 1.08)
          x seasonal spring factor (March start, 1.06) x trade-in credit subtraction;
          with one accepted BOOK appraisal the pinned rounding yields monthly
          1032874, whereas the zero-credit path would divide 40754880 into 1132080.
        test_recipe:
          setup:
            - "Distributor D1 ACTIVE; course C1 CLUB; M1 (7500000) and M2 (2800000) catalog-active"
            - "Lease L1 lines [M1 x4, M2 x2], cycle 36, start 2027-03-01 (spring peak month)"
            - "One BOOK appraisal (M1, 2200h, grade B) accepted before approval"
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA", "NV"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tess Torque" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /turf/technicians/${t1}/certify"
              payload: { level: "MASTER", expires_at: "2028-06-01T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/distributors/${d1}/compliance_review"
              as: CorporateAdmin
            - call: "POST /turf/courses"
              payload: { name: "Bent Pine CC", turf_profile: "BENTGRASS", cut_quality_standard: "CLUB", credit_limit_cents: 50000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { c1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "RM-5010H", category: "MOWER", tier: "TOURNAMENT", list_price_cents: 7500000, eligible_turf_types: ["BENTGRASS", "POA_ANNUA", "MIXED"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 9500, parts_support_years: 10 }
              as: CorporateAdmin
              captures: { m1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "WK-MDX", category: "UTILITY_VEHICLE", tier: "PRO", list_price_cents: 2800000, eligible_turf_types: ["BENTGRASS", "BERMUDA", "POA_ANNUA", "MIXED"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 8500, parts_support_years: 8 }
              as: CorporateAdmin
              captures: { m2: $.data.id }
            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 36, start_date: "2027-03-01", lines: [{ model_id: "${m1}", qty: 4 }, { model_id: "${m2}", qty: 2 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l1: $.data.id, l_v: $.data.version }
            - call: "POST /turf/appraisals"
              payload: { lease_id: "${l1}", model_id: "${m1}", external_serial: "OLD-001", hours: 2200, condition_grade: "B", policy: "BOOK" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { ap1: $.data.id }
            - call: "POST /turf/appraisals/${ap1}/transition"
              payload: { to: "ACCEPTED" }
              as: CourseManager
              as_user_id: "${c1}"
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "SPEC_REVIEW", expected_lease_version: "${l_v}" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l_v2: $.data.version }
          trigger:
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "APPROVED", expected_lease_version: "${l_v2}" }
              as: CorporateAdmin
          assert:
            - "FleetLease.${l1}.base_value_cents == 35600000"
            - "FleetLease.${l1}.total_contract_value_cents == 40754880 (35600000 x 1.08 x 1.06)"
            - "FleetLease.${l1}.trade_in_credit_cents == 3571429"
            - "FleetLease.${l1}.net_contract_value_cents == 37183451"
            - "FleetLease.${l1}.monthly_rate_cents == 1032874 (zero-credit path would be 1132080)"
            - "TradeInAppraisal.${ap1}.status == CREDITED"
      - name: incentive_discount_per_line_rounding
        grounds:
          - calculations.offseason_incentive_discount
          - state_machines.PartsOrder.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b) nested rounding: two lines of 25005 cents each put the subtotal at
          50010 (tier 7%); pinned per-line rounding gives 1750 + 1750 = 3500, while
          the forbidden sum-then-round order would give round(50010 x 0.07) = 3501.
        test_recipe:
          setup:
            - "Distributor D1 ACTIVE; parts P3 and P4 each unit_cost 25005"
            - "Logical clock at 2027-01-15 (off-season month 1)"
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA", "NV"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tess Torque" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /turf/technicians/${t1}/certify"
              payload: { level: "MASTER", expires_at: "2028-06-01T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/distributors/${d1}/compliance_review"
              as: CorporateAdmin
            - call: "POST /turf/models"
              payload: { model_code: "GM-1200", category: "MOWER", tier: "STANDARD", list_price_cents: 4200000, eligible_turf_types: ["BERMUDA", "MIXED"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 8000, parts_support_years: 8 }
              as: CorporateAdmin
              captures: { m3: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "WK-MDX", category: "UTILITY_VEHICLE", tier: "PRO", list_price_cents: 2800000, eligible_turf_types: ["BENTGRASS", "BERMUDA", "POA_ANNUA", "MIXED"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 8500, parts_support_years: 8 }
              as: CorporateAdmin
              captures: { m2: $.data.id }
            - call: "POST /turf/parts"
              payload: { sku: "P3-BLADE", name: "Rotary blade set", primary_model_id: "${m3}", unit_cost_cents: 25005, min_stock_qty: 2 }
              as: CorporateAdmin
              captures: { p3: $.data.id }
            - call: "POST /turf/parts"
              payload: { sku: "P4-HOSE", name: "Hydraulic hose kit", primary_model_id: "${m2}", unit_cost_cents: 25005, min_stock_qty: 2 }
              as: CorporateAdmin
              captures: { p4: $.data.id }
            - call: "POST /turf/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/parts-orders"
              payload: { order_type: "STOCK", lines: [{ part_id: "${p3}", qty: 1 }, { part_id: "${p4}", qty: 1 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /turf/parts-orders/${o1}/transition"
              payload: { to: "SUBMITTED" }
              as: DistributorManager
              as_user_id: "${d1}"
          assert:
            - "PartsOrder.${o1}.subtotal_cents == 50010"
            - "PartsOrder.${o1}.off_season_applied == true"
            - "PartsOrder.${o1}.discount_tier_pct == 0.07"
            - "PartsOrder.${o1}.discount_cents == 3500 (per-line pinned; NOT 3501)"
            - "PartsOrder.${o1}.total_cents == 46510"
      - name: irrigation_controller_fee_order_of_evaluation
        grounds:
          - calculations.irrigation_design_spec
          - state_machines.IrrigationProject.BRIEF_to_DESIGN_SUBMITTED
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: controllers = ceil(22/8) = 3 feeds the
          fee (250000 + 3 x 45000 + 120 x 12000 = 1825000); reversing the
          controllers/fee dependency is undefined. Water budget uses course turf
          (BENTGRASS 22000 gpd/acre): 120 x 22000 = 2640000.
        test_recipe:
          setup:
            - "Irrigation dealer D9 (channel IRRIGATION); course C1 BENTGRASS; controller model MC1 catalog-active"
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "HydroDesign Co", territory_codes: ["CA"], channel: "IRRIGATION", min_parts_stock_value_cents: 0, labor_rate_cents: 12000, annual_claim_cap_cents: 10000000 }
              as: CorporateAdmin
              captures: { d9: $.data.id }
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA", "NV"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/courses"
              payload: { name: "Bent Pine CC", turf_profile: "BENTGRASS", cut_quality_standard: "CLUB", credit_limit_cents: 50000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { c1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "TMC-424E", category: "IRRIGATION_CONTROLLER", tier: "STANDARD", list_price_cents: 180000, eligible_turf_types: ["BENTGRASS", "BERMUDA", "POA_ANNUA", "MIXED"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 8000, parts_support_years: 12 }
              as: CorporateAdmin
              captures: { mc1: $.data.id }
            - call: "POST /turf/irrigation-projects"
              payload: { course_id: "${c1}", acreage: 120, zone_count: 22 }
              as: IrrigationDealer
              as_user_id: "${d9}"
              captures: { ip1: $.data.id }
          trigger:
            - call: "POST /turf/irrigation-projects/${ip1}/transition"
              payload: { to: "DESIGN_SUBMITTED", controller_model_id: "${mc1}", install_window_start: "2027-04-01", install_window_end: "2027-05-01" }
              as: IrrigationDealer
              as_user_id: "${d9}"
          assert:
            - "IrrigationProject.${ip1}.controllers_required == 3"
            - "IrrigationProject.${ip1}.design_fee_cents == 1825000"
            - "IrrigationProject.${ip1}.water_budget_gpd == 2640000"
            - "IrrigationProject.${ip1}.controller_model_id == ${mc1}"

  - rule_id: non_linear_state_machine
    instances:
      - name: warranty_claim_dispute_reopens_review_cycle
        grounds:
          - state_machines.WarrantyClaim.PARTIAL_APPROVED_to_DISPUTED
          - state_machines.WarrantyClaim.DISPUTED_to_UNDER_REVIEW
          - state_machines.WarrantyClaim.APPROVED_to_PAID
        distinguishing_aspect: |
          Non-linear cycle on WarrantyClaim: UNDER_REVIEW -> PARTIAL_APPROVED ->
          DISPUTED -> UNDER_REVIEW -> APPROVED -> PAID; the re-adjudication after
          the dispute loop recomputes payable on full hours (62200), erasing the
          partial-round value (43200) — a pure linear pipeline could never observe this.
        test_recipe:
          setup:
            - "Full serviceable setup: D1 ACTIVE (labor 14000, cap 50000000), certified tech T1, C1 CLUB, M1, ACTIVE lease, unit IN_SERVICE"
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA", "NV"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tess Torque" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /turf/technicians/${t1}/certify"
              payload: { level: "MASTER", expires_at: "2028-06-01T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/distributors/${d1}/compliance_review"
              as: CorporateAdmin
            - call: "POST /turf/courses"
              payload: { name: "Bent Pine CC", turf_profile: "BENTGRASS", cut_quality_standard: "CLUB", credit_limit_cents: 50000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { c1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "RM-5010H", category: "MOWER", tier: "TOURNAMENT", list_price_cents: 7500000, eligible_turf_types: ["BENTGRASS", "POA_ANNUA", "MIXED"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 9500, parts_support_years: 10 }
              as: CorporateAdmin
              captures: { m1: $.data.id }
            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 36, start_date: "2026-09-01", lines: [{ model_id: "${m1}", qty: 1 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l1: $.data.id, l_v: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "SPEC_REVIEW", expected_lease_version: "${l_v}" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l_v2: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "APPROVED", expected_lease_version: "${l_v2}" }
              as: CorporateAdmin
              captures: { l_v3: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "ACTIVE", expected_lease_version: "${l_v3}" }
              as: DistributorManager
              as_user_id: "${d1}"
            - call: "GET /turf/units"
              payload: { lease_id: "${l1}" }
              as: CorporateAdmin
              captures: { u1: "$.data[0].id" }
            - call: "POST /turf/units/${u1}/transition"
              payload: { to: "DELIVERED", serial_number: "SN-A1" }
              as: DistributorManager
              as_user_id: "${d1}"
            - call: "POST /turf/units/${u1}/transition"
              payload: { to: "IN_SERVICE" }
              as: CourseManager
              as_user_id: "${c1}"
            - call: "POST /turf/warranty-claims"
              payload: { lease_unit_id: "${u1}", technician_id: "${t1}", labor_hours: 4, parts_cost_cents: 22000 }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { cl1: $.data.id, cl_v: $.data.version }
          trigger:
