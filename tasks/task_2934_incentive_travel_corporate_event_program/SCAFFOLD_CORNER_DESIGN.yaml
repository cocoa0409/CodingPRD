    distinguishing_aspect: |
      The second §1.2.1 rule. It differs from the program rule in what the stale read actually costs: the client is acting on a seat count it read from the activity, so an intervening signup or waitlist promotion silently changes whether the next signup lands BOOKED or WAITLISTED. The guard therefore protects a calculation input rather than a policy decision, and the assertions here check the seat counters as well as the error, which the program-level instance has no equivalent of. Both rules are asserted to be independent: a fresh activity version does not excuse a stale program version and vice versa.
