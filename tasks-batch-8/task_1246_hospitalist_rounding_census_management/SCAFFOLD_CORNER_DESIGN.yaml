            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "K012", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients", payload: { mrn: "K013", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:05:00Z" }, as: GroupAdmin, captures: { p2: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p2}" }, as: GroupAdmin, captures: { a2: $.data.id, off2: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a2}/accept", payload: {}, as: Hospitalist, as_user_id: "${off2}" }
            - { call: "POST /patients", payload: { mrn: "K014", acuity: "LOW", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:10:00Z" }, as: GroupAdmin, captures: { p3: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p3}" }, as: GroupAdmin, captures: { a3: $.data.id, off3: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a3}/accept", payload: {}, as: Hospitalist, as_user_id: "${off3}" }
            - { call: "POST /patients/${p1}/consult-requests", payload: { specialty: "NEPHROLOGY", priority: "ROUTINE", reason: "fluid review" }, as: Hospitalist, as_user_id: "${h1}", captures: { c1: $.data.id } }
            - { call: "POST /coverage-windows", payload: { window_date: "2026-05-01", window_type: "NIGHT_CROSS_COVER", start_at: "2026-05-01T19:00:00Z", end_at: "2026-05-02T07:00:00Z", capacity: 3 }, as: GroupAdmin, captures: { w: $.data.id } }
            - { call: "POST /coverage-windows/${w}/enroll", payload: {}, as: Hospitalist, as_user_id: "${h2}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T20:00:00Z" }, as: GroupAdmin }
          trigger:
            - { call: "POST /ops/monitor-run", payload: {}, as: GroupAdmin, captures: { locked: $.data.locked_window_ids } }
            - { call: "GET /coverage-windows/${w}", as: GroupAdmin, captures: { wst: $.data.status, load: $.data.current_load } }
          assert:
            - "CoverageWindow.${w}.status == LOCKED and locked_window_ids contains ${w}"
            - "CoverageWindow.${w}.current_load == 7.0 (3 assignments * 2.0 cross-cover multiplier + 1 OPEN consult * 1 + 0 handoffs * 2, clamp 40 not reached)"

  # ===================================================================
  # Section: validations
  # ===================================================================
  - section: validations
    instances:
      - name: occ_handoff_revise_stale_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[handoff-revise-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential revisions of a DRAFT handoff: the first advances version 1 -> 2; the second replaying the stale version is rejected 412 while status remains DRAFT (state precondition alone would pass)."
        test_recipe:
          setup:
            - "H1 ACTIVE shift S1 holds P1; handoff HF DRAFT version 1; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "INTERNAL_MEDICINE" }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "V001", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /shifts/${s1}/handoffs", payload: { receiving_hospitalist_id: "${h2}", patient_ids: ["${p1}"] }, as: Hospitalist, as_user_id: "${h1}", captures: { hf: $.data.id, hv: $.data.version } }
          trigger:
            - { call: "PUT /handoffs/${hf}", payload: { patient_ids: ["${p1}"], expected_handoff_version: "${hv}" }, as: Hospitalist, as_user_id: "${h1}", captures: { v2: $.data.version } }
            - { call: "PUT /handoffs/${hf}", payload: { patient_ids: ["${p1}"], expected_handoff_version: "${hv}" }, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "first revision succeeds: Handoff.${hf}.version == 2, status still DRAFT"
            - "second revision with the stale captured version -> error_id == ERR_STALE_VERSION, HTTP 412"
            - "Handoff.${hf}.version remains 2 after the rejected write"

      - name: occ_transfer_stale_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[assignment-transfer-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Assignment completes a full transfer/cancel cycle (ACTIVE -> PENDING_TRANSFER -> ACTIVE, version 1 -> 3); a second transfer initiation replaying version 1 is rejected 412 even though the status precondition (ACTIVE) passes."
        test_recipe:
          setup:
            - "H1 ACTIVE shift holds P1 via ASG (version 1); H2 target; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "INTERNAL_MEDICINE" }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "V002", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg: $.data.assignment_id } }
            - { call: "GET /assignments/${asg}", as: GroupAdmin, captures: { av: $.data.version } }
          trigger:
            - { call: "POST /assignments/${asg}/transfer", payload: { target_hospitalist_id: "${h2}", expected_assignment_version: "${av}" }, as: Hospitalist, as_user_id: "${h1}" }
            - { call: "POST /assignments/${asg}/cancel-transfer", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
            - { call: "POST /assignments/${asg}/transfer", payload: { target_hospitalist_id: "${h2}", expected_assignment_version: "${av}" }, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "first transfer succeeds (PENDING_TRANSFER, version 2); cancel restores ACTIVE (version 3)"
            - "replayed transfer with the stale captured version -> error_id == ERR_STALE_VERSION, HTTP 412"
            - "Assignment.${asg} remains ACTIVE with version 3"

      - name: stub_priority_state_over_safety
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=6]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / execute_unordered_with_open_stat_consult"
          rationale: "The dual-failure ordering (state error beats safety error) is asserted by the named difficulty instance."

      - name: stub_priority_temporal_over_fiscal
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=9]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / accept_transfer_no_shift_and_cap_full"
          rationale: "The dual-failure ordering (temporal error beats capacity error) is asserted by the named difficulty instance."

  # ===================================================================
  # Section: endpoints
  # ===================================================================
  - section: endpoints
    instances:
      - name: success_envelope_on_read
        claim_type: response_envelope
        grounds: ["response_envelope.success"]
        distinguishing_aspect: "Object read carries meta.api_request_id, meta.api_request_timestamp, response_type object, and the entity under data."
        test_recipe:
          setup:
            - "H1 exists"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
          trigger:
            - { call: "GET /hospitalists/${h1}", as: GroupAdmin }
          assert:
            - "response has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == object; data.id == ${h1}"

      - name: monitor_run_repeat_is_noop
        claim_type: idempotency
        grounds: ["calculations.observation_status_monitor"]
        distinguishing_aspect: "A second monitor-run at the same logical clock converts nothing: obs_converted_patient_ids is empty and the patient stays OBS_CONVERTED (no double side effects)."
        test_recipe:
          setup:
            - "P1 OBSERVATION admitted 2026-05-01T08:00:00Z; clock 2026-05-03T08:00:00Z; first monitor-run already converted P1"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "E001", acuity: "LOW", admit_source: "ED", stay_type: "OBSERVATION", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T08:00:00Z" }, as: GroupAdmin }
            - { call: "POST /ops/monitor-run", payload: {}, as: GroupAdmin, captures: { conv1: $.data.obs_converted_patient_ids } }
          trigger:
            - { call: "POST /ops/monitor-run", payload: {}, as: GroupAdmin, captures: { conv2: $.data.obs_converted_patient_ids } }
            - { call: "GET /patients/${p1}", as: GroupAdmin, captures: { os: $.data.observation_status } }
          assert:
            - "first run: obs_converted_patient_ids contains ${p1}"
            - "second run at the same clock: obs_converted_patient_ids == [] (no re-fire)"
            - "Patient.${p1}.observation_status == OBS_CONVERTED (unchanged, no double mutation)"

      - name: clock_default_before_any_set
        claim_type: conditional_action
        grounds: ["endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "With no set_current_utc call, the logical clock is exactly 2026-05-01T00:00:00Z — monitor-run reports it as evaluated_at and never falls back to wall-clock."
        test_recipe:
          setup:
            - "empty database; clock never set"
          setup_api_calls: []
          trigger:
            - { call: "POST /ops/monitor-run", payload: {}, as: GroupAdmin, captures: { at: $.data.evaluated_at } }
          assert:
            - "monitor-run evaluated_at == 2026-05-01T00:00:00Z (fixed startup default)"
            - "all monitor-run id lists empty on an empty database"

  # ===================================================================
  # Section: errors
  # ===================================================================
  - section: errors
    instances:
      - name: admission_accept_by_non_offered_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_ADMISSION_NOT_OFFERED_TO_HOSPITALIST]"]
        distinguishing_aspect: "Admission OFFERED to H_A; accept called by H_B (who also has an ACTIVE shift) fails with ERR_ADMISSION_NOT_OFFERED_TO_HOSPITALIST."
        test_recipe:
          setup:
            - "H_A ACTIVE shift 06:00-18:00; H_B ACTIVE shift 07:00-19:00; P1 admission OFFERED to H_A (earlier shift); clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H A", specialty: "ICU" }, as: GroupAdmin, captures: { h_a: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H B", specialty: "INTERNAL_MEDICINE" }, as: GroupAdmin, captures: { h_b: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_a}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s_a: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_b}", shift_type: "DAY", start_at: "2026-05-01T07:00:00Z", end_at: "2026-05-01T19:00:00Z" }, as: GroupAdmin, captures: { s_b: $.data.id } }
            - { call: "POST /shifts/${s_a}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /shifts/${s_b}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "X001", acuity: "LOW", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:30:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off: $.data.offered_to_hospitalist_id } }
          trigger:
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${h_b}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ADMISSION_NOT_OFFERED_TO_HOSPITALIST; admission remains OFFERED to ${h_a}"

      - name: assignment_cancel_transfer_when_active_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_ASSIGNMENT_INVALID_STATE]", "state_machines.Assignment.PENDING_TRANSFER_to_ACTIVE"]
        distinguishing_aspect: "cancel-transfer on an ACTIVE assignment (no transfer initiated) fails with ERR_ASSIGNMENT_INVALID_STATE."
        test_recipe:
          setup:
            - "H1 ACTIVE shift holds P1 via ASG (ACTIVE); clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "X002", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg: $.data.assignment_id } }
          trigger:
            - { call: "POST /assignments/${asg}/cancel-transfer", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ASSIGNMENT_INVALID_STATE; assignment remains ACTIVE"

      - name: accept_transfer_by_non_target_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRANSFER_TARGET_MISMATCH]"]
        distinguishing_aspect: "Transfer targets H_T; accept-transfer called by H_X (who holds an ACTIVE shift, so the temporal check passes) fails with ERR_TRANSFER_TARGET_MISMATCH."
        test_recipe:
          setup:
            - "H_S ACTIVE shift 08:00-20:00 holds P1 (ASG PENDING_TRANSFER -> H_T); H_T and H_X both have ACTIVE shifts; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H S", specialty: "ICU" }, as: GroupAdmin, captures: { h_s: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H T", specialty: "INTERNAL_MEDICINE" }, as: GroupAdmin, captures: { h_t: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H X", specialty: "FAMILY_MEDICINE" }, as: GroupAdmin, captures: { h_x: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_s}", shift_type: "DAY", start_at: "2026-05-01T08:00:00Z", end_at: "2026-05-01T20:00:00Z" }, as: GroupAdmin, captures: { s_s: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_t}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s_t: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_x}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s_x: $.data.id } }
            - { call: "POST /shifts/${s_s}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /shifts/${s_t}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /shifts/${s_x}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "X003", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:30:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg: $.data.assignment_id } }
            - { call: "GET /assignments/${asg}", as: GroupAdmin, captures: { av: $.data.version } }
            - { call: "POST /assignments/${asg}/transfer", payload: { target_hospitalist_id: "${h_t}", expected_assignment_version: "${av}" }, as: Hospitalist, as_user_id: "${h_s}" }
          trigger:
            - { call: "POST /assignments/${asg}/accept-transfer", payload: {}, as: Hospitalist, as_user_id: "${h_x}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSFER_TARGET_MISMATCH; assignment remains PENDING_TRANSFER to ${h_t}"

      - name: handoff_submit_twice_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_HANDOFF_INVALID_STATE]"]
        distinguishing_aspect: "Submit on an already SUBMITTED handoff fails with ERR_HANDOFF_INVALID_STATE."
        test_recipe:
          setup:
            - "H1 ACTIVE shift S1 holds P1; HF submitted; H2 receiver; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "INTERNAL_MEDICINE" }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "X004", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /shifts/${s1}/handoffs", payload: { receiving_hospitalist_id: "${h2}", patient_ids: ["${p1}"] }, as: Hospitalist, as_user_id: "${h1}", captures: { hf: $.data.id } }
            - { call: "POST /handoffs/${hf}/submit", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
          trigger:
            - { call: "POST /handoffs/${hf}/submit", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HANDOFF_INVALID_STATE; handoff remains SUBMITTED"

      - name: handoff_submit_incomplete_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_HANDOFF_INCOMPLETE]", "calculations.handoff_completeness"]
        distinguishing_aspect: "H1 holds P1 and P2; patient_ids covers only P1 -> open_item_count == 1 -> submit rejected ERR_HANDOFF_INCOMPLETE (422)."
        test_recipe:
          setup:
            - "H1 ACTIVE shift S1 holds P1 and P2; HF lists only P1; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "INTERNAL_MEDICINE" }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "X005", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients", payload: { mrn: "X006", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:05:00Z" }, as: GroupAdmin, captures: { p2: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p2}" }, as: GroupAdmin, captures: { a2: $.data.id, off2: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a2}/accept", payload: {}, as: Hospitalist, as_user_id: "${off2}" }
            - { call: "POST /shifts/${s1}/handoffs", payload: { receiving_hospitalist_id: "${h2}", patient_ids: ["${p1}"] }, as: Hospitalist, as_user_id: "${h1}", captures: { hf: $.data.id } }
          trigger:
            - { call: "POST /handoffs/${hf}/submit", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HANDOFF_INCOMPLETE (open_item_count == 1)"
            - "Handoff.${hf} remains DRAFT; required_patient_count == 2, covered_patient_count == 1"

      - name: duplicate_active_assignment_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_ACTIVE_ASSIGNMENT]"]
        distinguishing_aspect: "A second admission for an already-assigned ADMITTED patient may be queued and offered, but its accept fails with ERR_DUPLICATE_ACTIVE_ASSIGNMENT."
        test_recipe:
          setup:
            - "H1 ACTIVE shift holds P1 (A1 accepted); A2 for the same P1 OFFERED to H1; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "X007", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg1: $.data.assignment_id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a2: $.data.id, off2: $.data.offered_to_hospitalist_id } }
          trigger:
            - { call: "POST /admissions/${a2}/accept", payload: {}, as: Hospitalist, as_user_id: "${off2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_ACTIVE_ASSIGNMENT"
            - "P1 still has exactly one ACTIVE assignment (${asg1}); A2 remains OFFERED"

      - name: enroll_twice_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_ALREADY_ENROLLED]"]
        distinguishing_aspect: "Second enrollment by the same hospitalist in the same window fails with ERR_ALREADY_ENROLLED while the window is still OPEN."
        test_recipe:
          setup:
            - "H1; window W NIGHT_PRIMARY 2026-05-01T19:00:00Z..2026-05-02T07:00:00Z capacity 3 OPEN; H1 enrolled once"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /coverage-windows", payload: { window_date: "2026-05-01", window_type: "NIGHT_PRIMARY", start_at: "2026-05-01T19:00:00Z", end_at: "2026-05-02T07:00:00Z", capacity: 3 }, as: GroupAdmin, captures: { w: $.data.id } }
            - { call: "POST /coverage-windows/${w}/enroll", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
          trigger:
            - { call: "POST /coverage-windows/${w}/enroll", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_ENROLLED; enrolled_count stays 1"

      - name: enroll_locked_window_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_COVERAGE_WINDOW_NOT_OPEN]", "state_machines.CoverageWindow.OPEN_to_LOCKED"]
        distinguishing_aspect: "After monitor-run locks the window at start_at, enrollment fails with ERR_COVERAGE_WINDOW_NOT_OPEN (state), distinct from the capacity FULL error."
        test_recipe:
          setup:
            - "H1; window W start 2026-05-01T19:00:00Z end 2026-05-02T07:00:00Z capacity 2; clock 2026-05-01T20:00:00Z and monitor-run has locked W"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /coverage-windows", payload: { window_date: "2026-05-01", window_type: "NIGHT_PRIMARY", start_at: "2026-05-01T19:00:00Z", end_at: "2026-05-02T07:00:00Z", capacity: 2 }, as: GroupAdmin, captures: { w: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T20:00:00Z" }, as: GroupAdmin }
            - { call: "POST /ops/monitor-run", payload: {}, as: GroupAdmin, captures: { locked: $.data.locked_window_ids } }
          trigger:
            - { call: "POST /coverage-windows/${w}/enroll", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "monitor-run locked the window (locked_window_ids contains ${w})"
            - "error_id == ERR_COVERAGE_WINDOW_NOT_OPEN"

      - name: enroll_with_overlapping_shift_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_ENROLL_SHIFT_CONFLICT]"]
        distinguishing_aspect: "Half-open overlap arithmetic on enrollment: H1's NIGHT shift [19:00,07:00+1d) blocks enrollment in window [18:00,06:00+1d) but allows the adjacent window starting exactly at 07:00 the next day."
        test_recipe:
          setup:
            - "H1 owns ACTIVE shift [2026-05-01T19:00:00Z, 2026-05-02T07:00:00Z); windows W1 [18:00,06:00+1d) overlapping and W2 [07:00+1d, 12:00+1d) adjacent; both OPEN; clock 2026-05-01T12:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "NIGHT", start_at: "2026-05-01T19:00:00Z", end_at: "2026-05-02T07:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /coverage-windows", payload: { window_date: "2026-05-01", window_type: "NIGHT_CROSS_COVER", start_at: "2026-05-01T18:00:00Z", end_at: "2026-05-02T06:00:00Z", capacity: 2 }, as: GroupAdmin, captures: { w1: $.data.id } }
            - { call: "POST /coverage-windows", payload: { window_date: "2026-05-02", window_type: "NIGHT_PRIMARY", start_at: "2026-05-02T07:00:00Z", end_at: "2026-05-02T12:00:00Z", capacity: 2 }, as: GroupAdmin, captures: { w2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T12:00:00Z" }, as: GroupAdmin }
          trigger:
            - { call: "POST /coverage-windows/${w1}/enroll", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
            - { call: "POST /coverage-windows/${w2}/enroll", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { n: $.data.enrolled_count } }
          assert:
            - "overlapping window: error_id == ERR_ENROLL_SHIFT_CONFLICT"
            - "adjacent window (start == shift end): enroll succeeds, enrolled_count == 1"

      - name: shift_invalid_window_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHIFT_INVALID_WINDOW]"]
        distinguishing_aspect: "end_at <= start_at fails with ERR_SHIFT_INVALID_WINDOW (422) before overlap is evaluated."
        test_recipe:
          setup:
            - "H1 exists"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
          trigger:
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T19:00:00Z", end_at: "2026-05-01T07:00:00Z" }, as: GroupAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHIFT_INVALID_WINDOW, HTTP 422"

      - name: discharge_blocked_by_open_stat_consult
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_STAT_CONSULT_BLOCKS_DISCHARGE]", "validations[priority=6]"]
        distinguishing_aspect: "An ORDERED discharge with an OPEN STAT consult on the patient fails the safety gate with ERR_OPEN_STAT_CONSULT_BLOCKS_DISCHARGE (single failure; state preconditions all pass)."
        test_recipe:
          setup:
            - "H1 ACTIVE shift holds P1; STAT consult OPEN on P1; discharge order ORDERED; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "X008", acuity: "HIGH", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients/${p1}/consult-requests", payload: { specialty: "CARDIOLOGY", priority: "STAT", reason: "unstable" }, as: Hospitalist, as_user_id: "${h1}", captures: { c1: $.data.id } }
            - { call: "POST /patients/${p1}/discharge-orders", payload: { target_discharge_at: "2026-05-02T15:00:00Z" }, as: Hospitalist, as_user_id: "${h1}", captures: { d1: $.data.id } }
            - { call: "POST /discharge-orders/${d1}/order", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
          trigger:
            - { call: "POST /discharge-orders/${d1}/execute", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OPEN_STAT_CONSULT_BLOCKS_DISCHARGE, HTTP 422"
            - "order remains ORDERED; patient remains ADMITTED"

      - name: accept_transfer_target_on_leave_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOSPITALIST_NOT_ACTIVE]"]
        distinguishing_aspect: "Target holds an ACTIVE shift (temporal check passes) but employment_status == ON_LEAVE -> ERR_HOSPITALIST_NOT_ACTIVE (422) at the constraint priority."
        test_recipe:
          setup:
            - "H_T ON_LEAVE with ACTIVE shift 06:00-18:00; H_S ACTIVE shift 08:00-20:00 holds P1 (ASG PENDING_TRANSFER -> H_T); clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H T", specialty: "ICU", employment_status: "ON_LEAVE" }, as: GroupAdmin, captures: { h_t: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H S", specialty: "INTERNAL_MEDICINE" }, as: GroupAdmin, captures: { h_s: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_t}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s_t: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_s}", shift_type: "DAY", start_at: "2026-05-01T08:00:00Z", end_at: "2026-05-01T20:00:00Z" }, as: GroupAdmin, captures: { s_s: $.data.id } }
            - { call: "POST /shifts/${s_t}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /shifts/${s_s}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "X009", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:30:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            # H_T excluded from the pool (distribution_eligible false while ON_LEAVE) -> offered to H_S
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg: $.data.assignment_id } }
            - { call: "GET /assignments/${asg}", as: GroupAdmin, captures: { av: $.data.version } }
            - { call: "POST /assignments/${asg}/transfer", payload: { target_hospitalist_id: "${h_t}", expected_assignment_version: "${av}" }, as: Hospitalist, as_user_id: "${h_s}" }
          trigger:
            - { call: "POST /assignments/${asg}/accept-transfer", payload: {}, as: Hospitalist, as_user_id: "${h_t}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HOSPITALIST_NOT_ACTIVE"
            - "Assignment.${asg} remains PENDING_TRANSFER; Hospitalist.${h_t}.current_census == 0"

  # ===================================================================
  # Section: rbac
  # ===================================================================
  - section: rbac
    instances:
      - name: hospitalist_create_hospitalist_unauthorized
        claim_type: rbac_deny
        grounds: ["roles[GroupAdmin].exclusive_operations", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Hospitalist role cannot create hospitalists (GroupAdmin exclusive) -> 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hospitalists", payload: { full_name: "Rogue", specialty: "ICU" }, as: Hospitalist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE, HTTP 403"

      - name: specialist_generate_report_unauthorized
        claim_type: rbac_deny
        grounds: ["roles[ConsultingSpecialist].exclusive_operations", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "ConsultingSpecialist may acknowledge/complete consults but cannot generate productivity reports -> 403."
        test_recipe:
          setup:
            - "H1 exists"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
          trigger:
            - { call: "POST /productivity-reports/generate", payload: { hospitalist_id: "${h1}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: ConsultingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE, HTTP 403"

      - name: groupadmin_accept_admission_unauthorized
        claim_type: rbac_deny
        grounds: ["roles[Hospitalist].exclusive_operations", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Admission accept is Hospitalist-exclusive; GroupAdmin (opaque, cannot be the offered hospitalist) is denied at the role check."
        test_recipe:
          setup:
            - "H1 ACTIVE shift; P1 admission OFFERED to H1; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "R001", acuity: "LOW", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:30:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off: $.data.offered_to_hospitalist_id } }
          trigger:
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: GroupAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE, HTTP 403 (role priority 2 fires before offer-ownership)"

      - name: hospitalist_acknowledge_consult_unauthorized
        claim_type: rbac_deny
        grounds: ["roles[ConsultingSpecialist].exclusive_operations", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Acknowledge is ConsultingSpecialist-exclusive; the requesting Hospitalist gets 403 even for their own patient's consult."
        test_recipe:
          setup:
            - "H1 ACTIVE shift holds P1; consult C1 OPEN; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "R002", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients/${p1}/consult-requests", payload: { specialty: "NEUROLOGY", priority: "ROUTINE", reason: "headache" }, as: Hospitalist, as_user_id: "${h1}", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /consult-requests/${c1}/acknowledge", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE, HTTP 403; consult remains OPEN"

      - name: missing_auth_headers_returns_401
        claim_type: rbac_deny
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "No X-User-Role header at all -> 401 ERR_UNAUTHENTICATED before any role or business check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /hospitalists", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, HTTP 401"

  # ===================================================================
  # Section: complexity_layers
  # ===================================================================
  - section: complexity_layers
    instances:
      - name: derived_census_reconciliation_after_cancel_transfer
        claim_type: derived_field_reconciliation
        grounds: ["entities.Hospitalist.fields.current_census", "state_machines.Assignment.PENDING_TRANSFER_to_ACTIVE"]
        distinguishing_aspect: "Denormalized census stays reconciled through a transfer/cancel cycle: unchanged at every hop, transfer_target cleared, only version moves."
        test_recipe:
          setup:
            - "H1 ACTIVE shift holds P1 (census 1); H2 target; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "INTERNAL_MEDICINE" }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "L001", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg: $.data.assignment_id } }
            - { call: "GET /assignments/${asg}", as: GroupAdmin, captures: { av: $.data.version } }
          trigger:
            - { call: "POST /assignments/${asg}/transfer", payload: { target_hospitalist_id: "${h2}", expected_assignment_version: "${av}" }, as: Hospitalist, as_user_id: "${h1}" }
            - { call: "POST /assignments/${asg}/cancel-transfer", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
            - { call: "GET /hospitalists/${h1}", as: GroupAdmin, captures: { c1: $.data.current_census } }
            - { call: "GET /hospitalists/${h2}", as: GroupAdmin, captures: { c2: $.data.current_census } }
          assert:
            - "Hospitalist.${h1}.current_census == 1 and Hospitalist.${h2}.current_census == 0 after the full cycle (no drift)"
            - "Assignment.${asg}.transfer_target_hospitalist_id == null and status == ACTIVE"

      - name: rate_threshold_distribution_eligible_flip
        claim_type: rate_threshold_trigger
        grounds: ["entities.Hospitalist.fields.distribution_eligible", "state_machines.Admission.OFFERED_to_ACCEPTED"]
        distinguishing_aspect: "The exact cap crossing flips the stored flag: accept at cap-1 -> census == cap flips distribution_eligible false (new admissions then queue); discharge back below cap flips it true."
        test_recipe:
          setup:
            - "H1 cap 1 ACTIVE shift; P1 accepted (census 1 == cap); P2 admission queued (pool empty); clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU", max_census_cap: 1 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "L002", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients", payload: { mrn: "L003", acuity: "LOW", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:05:00Z" }, as: GroupAdmin, captures: { p2: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p2}" }, as: GroupAdmin, captures: { a2: $.data.id, st2: $.data.status } }
            - { call: "POST /patients/${p1}/discharge-orders", payload: { target_discharge_at: "2026-05-02T15:00:00Z" }, as: Hospitalist, as_user_id: "${h1}", captures: { d1: $.data.id } }
            - { call: "POST /discharge-orders/${d1}/order", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
          trigger:
            - { call: "GET /hospitalists/${h1}", as: GroupAdmin, captures: { el0: $.data.distribution_eligible } }
            - { call: "POST /discharge-orders/${d1}/execute", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
            - { call: "GET /hospitalists/${h1}", as: GroupAdmin, captures: { el1: $.data.distribution_eligible, cen1: $.data.current_census } }
          assert:
            - "after accept at the cap boundary: distribution_eligible == false"
            - "Admission.${a2} stayed QUEUED (flag excluded H1 from the pool)"
            - "after the discharge: current_census == 0 and distribution_eligible == true (threshold reset)"

  # ===================================================================
  # Section: consistency_model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "The accept response and an immediate re-read agree: ACCEPTED status, assignment_id, and the new ACTIVE assignment are all visible in the same request sequence with no lag."
        test_recipe:
          setup:
            - "H1 ACTIVE shift; P1 admission OFFERED to H1; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU" }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "L004", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
          trigger:
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg: $.data.assignment_id, ast: $.data.status } }
            - { call: "GET /admissions/${a1}", as: GroupAdmin, captures: { gst: $.data.status } }
            - { call: "GET /assignments/${asg}", as: GroupAdmin, captures: { gst2: $.data.status } }
          assert:
            - "accept response: status == ACCEPTED, assignment_id present"
            - "GET /admissions/${a1} immediately: status == ACCEPTED (immediate consistency)"
            - "GET /assignments/${asg} immediately: status == ACTIVE"
