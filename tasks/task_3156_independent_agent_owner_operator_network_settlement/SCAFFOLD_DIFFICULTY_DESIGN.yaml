              as: NetworkAdministrator
              captures: { agent_id: $.data.id }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {}
              as: NetworkAdministrator
            - call: "POST /network/customer-accounts"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-MATAGORDA-72", shipper_name: "Matagorda Bay Seafood", first_booked_at: "2026-09-01T00:00:00Z" }
              as: FreightAgent
              as_user_id: "${agent_id}"
            - call: "POST /network/loads"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-MATAGORDA-72", origin_state: "TX", destination_state: "OK", linehaul_revenue_cents: 180000, fuel_surcharge_cents: 32400, accessorial_revenue_cents: 12000, dispatched_miles: 1240 }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { load_id: $.data.id }
          trigger:
            - call: "GET /network/loads/${load_id}/load-offers"
              payload: {}
              as: FreightAgent
              as_user_id: "${agent_id}"
          assert:
            - "the GET returns an empty array with total_count == 0 and has_more == false"
            - "Load.${load_id}.board_required == true, so the load is board-eligible despite having no offers"
            - "any accept attempt against a non-existent offer id returns 404 ERR_OFFER_NOT_FOUND, and the load remains POSTED with 0 OPEN offers"
            - "POST /network/loads/${load_id}/settlement returns 409 ERR_LOAD_NOT_SETTLEABLE — a load with no trip has no settlement path at all"
            - "the per-load tier for an agent with 0 eligible loads reports tier_load_count == 0 and per_load_fee_cents == 5000 rather than 0"

