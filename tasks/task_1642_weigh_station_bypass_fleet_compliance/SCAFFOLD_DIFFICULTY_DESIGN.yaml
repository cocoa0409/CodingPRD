        grounds:
          - state_machines.Carrier.ACTIVE_to_SUSPENDED
          - state_machines.Carrier.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on Carrier: ACTIVE -> SUSPENDED -> ACTIVE -> SUSPENDED -> ACTIVE completes two full
          officer-driven cycles (no cycle counter limit), and each transition bumps Carrier.version by exactly 1,
          so after create(1) + snapshot(2) + approve(3) + four transitions the version is exactly 7.
        test_recipe:
          setup:
            - "Clock 2026-08-01; carrier created (v1), snapshot iss 30 (v2), approved ENROLLED->ACTIVE (v3)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
