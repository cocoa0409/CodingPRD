        excluded_because:
          difficulty_instance: promotion_create_gated_on_budget_allocation_status
          rationale: |
            ERR_ALLOCATION_NOT_APPROVED is triggered there on a DRAFT parent with a correct
            version, which is precisely the shape this section would otherwise duplicate.

      - name: deduction_settle_gated_on_customer_trading_status_corner_stub_errors
        claim_type: error_triggerable
        grounds:
