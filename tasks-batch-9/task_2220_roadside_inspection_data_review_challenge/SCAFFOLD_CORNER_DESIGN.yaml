            - "trigger[3] -> 200; ${d1_v2} == 2 and Driver.${d1_id}.full_name == Dana Ruiz-Perez"
            - "trigger[4] -> 200; ${vc_v2} == ${vc_v1} + 1 and ${vc_v1} == 1"
            - "trigger[5] -> 201; ${r1_v1} == 1 and InspectionReport.${r1_id}.status == RECEIVED"
            - "trigger[6] -> 201; ${v1_v1} == 1"
            - "trigger[7] -> 200; ${r1_v2} == 2 and status == VALIDATED (a body-less transition still bumps the version)"
            - "trigger[8] -> 200; ${r1_v3} == 3 and status == SCORED"
            - "trigger[9] -> 200; ${r1_v_after_read} == 3 (reads never bump the version)"
            - "after trigger[9]: BasicScore(carrier ${c1_id}, UNSAFE_DRIVING).certified_measure == 0.500 and percentile == 50.0"

      - name: report_filters_and_offset_pages_stay_consistent_under_mutation
        claim_type: pagination_with_filtering
        grounds:
          - endpoints["GET /inspection-reports"]
          - response_envelope.pagination_fields
          - state_machines.InspectionReport.RECEIVED_to_VALIDATED
        distinguishing_aspect: |
          The status filter is re-evaluated against live rows, so validating one report moves it between
          two filtered result sets without disturbing the offset arithmetic: RECEIVED drops from 3 to 2
          (its second page becoming empty with has_more false) while VALIDATED rises from 0 to 1, and
          the unfiltered total stays 3 with no row appearing on two pages.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (MEDIUM); three RECEIVED reports r1, r2, r3 with distinct VINs and non-overlapping inspection windows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
