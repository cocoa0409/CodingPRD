              as: UtilityInspector
              as_user_id: "insp-1"
              captures: { claim_status_approved: $.data.status, variance: $.data.inspector_variance_pct, outcome: $.data.inspector_outcome, spot25: $.data.spot_check_cfm25 }
            - call: "POST /duct-sealing/rebate-claims/${claim_id}/pay"
              payload: { payment_reference: "ACH-2026-0001" }
              as: ProgramAdmin
              captures: { claim_status_paid: $.data.status, pay_ref: $.data.payment_reference, committed_flag: $.data.committed }
            - call: "GET /duct-sealing/utility-programs/${prog_id}"
              as: ProgramAdmin
              captures: { c_after: $.data.committed_rebate_cents, p_after: $.data.paid_rebate_cents, r_after: $.data.remaining_budget_cents }
          assert:
            - "At claim creation payable_cents == 307230 (245.00 CFM * 1200 = 294000, tier bonus 0.10 -> 323400, below cap 500000, minus the 5% admin fee 16170)"
            - "${c_before} == 307230, ${p_before} == 0, ${r_before} == 4692770"
            - "First pay attempt from SUBMITTED: HTTP 409 with ${err_early_pay} == ERR_CLAIM_INVALID_STATE"
            - "Inspector verification: HTTP 200, ${spot25} == 57.00, ${variance} == 3.64 (|57.00 - 55.00| / 55.00 * 100 rounded half-up), ${outcome} == PASS and ${claim_status_approved} == APPROVED"
            - "The inspector user insp-1 differs from the report's issued_by_user_id qa-1, so segregation of duties at priority 30 is satisfied"
            - "Second pay attempt: HTTP 200 with ${claim_status_paid} == PAID, ${pay_ref} == 'ACH-2026-0001' and ${committed_flag} == false"
            - "${c_after} == 0 and ${p_after} == 307230: the commitment became a payment"
            - "${r_after} == 4692770 == ${r_before}: remaining_budget_cents is unchanged by payment because creation already debited it"
            - "PAID is terminal: a second pay call returns 409 ERR_CLAIM_INVALID_STATE"

      - name: seal_job_list_filters_compose_with_offset_pagination
        claim_type: standard_crud
        grounds:
          - endpoints[GET /duct-sealing/seal-jobs]
          - response_envelope.pagination_fields
        distinguishing_aspect: "One technician holds two jobs in different statuses on different duct systems, so every declared filter (duct_system_id, technician_id, status) narrows a different way; limit/offset then walks the unfiltered set and total_count keeps reporting the FULL match count rather than the page size."
