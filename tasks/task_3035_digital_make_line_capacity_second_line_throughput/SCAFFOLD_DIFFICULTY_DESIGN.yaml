# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3035_digital_make_line_capacity_second_line_throughput
#
# Depth probe: 2 instances per Difficulty Rule (§0.5), each grounded in
# SCAFFOLD.yaml §1.1–§1.7 and driven by an executable setup_api_calls chain.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: marketplace_vs_first_party_net_revenue_diverges
        grounds:
          - calculations.marketplace_net_revenue
          - entities.Order.fields.net_revenue_cents
          - entities.Order.fields.commission_cents
        distinguishing_aspect: |
          The SAME three entree lines (2x + 1x of the same 1095-cent bowl) price
          through two variants on the Order domain: MARKETPLACE applies markup
          then per-line commission (net 3024), while FIRST_PARTY_DIGITAL skips
          both (net 3285). Different entity domain from the food-cost instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z."
            - "Store with digital capacity 10, interval 15min, threshold 0.8."
            - "Menu item BOWL at base_price_cents 1095 with chicken+rice recipe; batches cooked so stock is ample."
            - "One OPEN ProductionWindow 10:00-10:15."
            - "MarketplaceChannel DASH with markup 0.18, commission 0.22, active true."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "S1", name: "Store One", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 10, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 60, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "RICE", display_name: "White Rice", unit_cost_cents_per_gram: 0.8, par_level_grams: 5000, hold_time_minutes: 90, batch_size_grams: 4000 }
              as: PlatformAdmin
              captures: { ing_rice: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 10000 }
              as: StoreManager
            - call: "POST /api/v1/ingredients/${ing_rice}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 10000 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Chicken Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_bowl: $.data.id }
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_rice}", standard_grams: 180 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
              captures: { win_id: $.data.id }
            - call: "POST /api/v1/marketplace-channels"
              payload: { channel_code: "DASH", markup_pct: 0.18, commission_pct: 0.22, active: true }
              as: PlatformAdmin
              captures: { chan_dash: $.data.id }
          trigger:
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "MARKETPLACE", marketplace_channel_id: "${chan_dash}", external_order_ref: "DASH-1001", lines: [{ menu_item_id: "${item_bowl}", quantity: 2, customizations: [] }, { menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: MarketplaceChannel
              as_user_id: "${chan_dash}"
              captures: { order_mkt: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "FIRST_PARTY_DIGITAL", lines: [{ menu_item_id: "${item_bowl}", quantity: 2, customizations: [] }, { menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: StoreManager
              captures: { order_fp: $.data.id }
          assert:
            - "Order.${order_mkt}.subtotal_cents == 3876"
            - "Order.${order_mkt}.commission_cents == 852"
            - "Order.${order_mkt}.net_revenue_cents == 3024"
            - "Order.${order_fp}.subtotal_cents == 3285"
            - "Order.${order_fp}.commission_cents == 0"
            - "Order.${order_fp}.net_revenue_cents == 3285"
            - "Order.${order_mkt}.net_revenue_cents != Order.${order_fp}.net_revenue_cents"

      - name: provisional_vs_settled_food_cost_variance
        grounds:
          - calculations.theoretical_vs_actual_food_cost
          - entities.Store.fields.food_cost_variance_bps
          - entities.DayClose.fields.food_cost_variance_bps
        distinguishing_aspect: |
          Food-cost variance on the Store/DayClose domain (not Order pricing):
          the provisional variant reads live counters including unsettled waste,
          while the day_close variant freezes a snapshot — after close, new waste
          posts to the next day and does NOT move the frozen DayClose figure.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z."
            - "Store S2; BOWL (chicken 120g @2.1c, rice 180g @0.8c => theoretical 396c per bowl)."
            - "Ample stock; one window; a PUBLISHED+LOCKED deployment so production can run."
            - "3 IN_STORE orders driven to PICKED_UP (theoretical = 1188)."
            - "Chicken batch with 360g manually wasted; rice batch allowed to expire with 600g remaining."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "S2", name: "Store Two", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 10, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 60, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "RICE", display_name: "White Rice", unit_cost_cents_per_gram: 0.8, par_level_grams: 5000, hold_time_minutes: 90, batch_size_grams: 4000 }
              as: PlatformAdmin
              captures: { ing_rice: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 10000 }
              as: StoreManager
              captures: { batch_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_rice}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 1140 }
              as: StoreManager
              captures: { batch_rice: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Chicken Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_bowl: $.data.id }
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_rice}", standard_grams: 180 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments"
              payload: { shift_date: "2026-09-01", predicted_digital_mix_pct: 0.5, predicted_instore_mix_pct: 0.5, headcount: 4, expected_store_version: "${store_v0}" }
              as: StoreManager
              captures: { deploy_id: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments/${deploy_id}/publish"
              payload: {}
              as: StoreManager
              as_user_id: "sm-pat"
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments/${deploy_id}/lock"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "IN_STORE", lines: [{ menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: LineWorker
              as_user_id: "lw-1"
              captures: { order_a: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/orders/${order_a}/start-production"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_a}/verify-accuracy"
              payload: { line_results: [{ menu_item_id: "${item_bowl}", matched: true }] }
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_a}/mark-ready"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_a}/pickup"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "IN_STORE", lines: [{ menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: LineWorker
              as_user_id: "lw-1"
              captures: { order_b: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/orders/${order_b}/start-production"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_b}/verify-accuracy"
              payload: { line_results: [{ menu_item_id: "${item_bowl}", matched: true }] }
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_b}/mark-ready"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_b}/pickup"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "IN_STORE", lines: [{ menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: LineWorker
              as_user_id: "lw-1"
              captures: { order_c: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/orders/${order_c}/start-production"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_c}/verify-accuracy"
              payload: { line_results: [{ menu_item_id: "${item_bowl}", matched: true }] }
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_c}/mark-ready"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_c}/pickup"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/waste-events"
              payload: { ingredient_batch_id: "${batch_chicken}", grams: 360, reason: "OVERPRODUCTION" }
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:31:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/v1/stores/${store_id}"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
              captures: { store_v_pre_close: $.data.version, variance_live: $.data.food_cost_variance_bps }
            - call: "POST /api/v1/stores/${store_id}/day-close"
              payload: { expected_store_version: "${store_v_pre_close}" }
              as: GeneralManager
              as_user_id: "gm-quinn"
              captures: { close_id: $.data.id }
          assert:
            - "Store live food_cost_variance_bps before close == 10404"
            - "DayClose.${close_id}.food_cost_variance_bps == 10404"
            - "Store.${store_id}.theoretical_food_cost_cents == 1188"
            - "Store.${store_id}.actual_food_cost_cents == 2424"
            - "after close, a further waste-event posts to the next day and does NOT change DayClose.${close_id}.food_cost_variance_bps"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_line_commission_rounding_beats_aggregate
        grounds:
          - calculations.marketplace_net_revenue
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-line round-half-up
          BEFORE summing. On 2x + 1x of a 1292-cent marketplace unit at 0.22
          commission, per-line rounding yields 852 while rounding the aggregate
          would yield 853 — a one-cent divergence the test must detect.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store, BOWL 1095c, ample stock, one window, DASH channel (markup .18, commission .22)."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "S3", name: "Store Three", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 10, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 60, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 10000 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Chicken Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_bowl: $.data.id }
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
            - call: "POST /api/v1/marketplace-channels"
              payload: { channel_code: "DASH", markup_pct: 0.18, commission_pct: 0.22, active: true }
              as: PlatformAdmin
              captures: { chan_dash: $.data.id }
          trigger:
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "MARKETPLACE", marketplace_channel_id: "${chan_dash}", external_order_ref: "DASH-2001", lines: [{ menu_item_id: "${item_bowl}", quantity: 2, customizations: [] }, { menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: MarketplaceChannel
              as_user_id: "${chan_dash}"
              captures: { order_mkt: $.data.id }
          assert:
            - "Order.${order_mkt}.subtotal_cents == 3876"
            - "Order.${order_mkt}.commission_cents == 852"
            - "Order.${order_mkt}.commission_cents != 853 (aggregate-rounding result)"
            - "Order.${order_mkt}.net_revenue_cents == 3024"

      - name: promise_slotting_waterfall_skips_full_window
        grounds:
          - calculations.promise_slotting
          - calculations.throttle_band
        distinguishing_aspect: |
          Mode (a) combinatorial formula with >= 3 inputs and nested branches:
          slotting depends on placed_at, window capacity, window status, and the
          throttle_state (itself a function of load vs ceil(threshold*capacity)).
          With the current window full, the waterfall pushes promised_at to the
          next OPEN window's interval_end — not the current one.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z."
            - "Store with digital capacity 2 per 15-min interval, threshold 1.0 (T == C collapses THROTTLED band)."
            - "Two OPEN windows: W1 10:15-10:30, W2 10:30-10:45."
            - "W1 filled to capacity 2 by an earlier 2-entree digital order."
            - "BOWL with ample stock."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "S4", name: "Store Four", digital_line_capacity_per_interval: 2, instore_line_capacity_per_interval: 10, pacing_interval_minutes: 15, overage_threshold_pct: 1.0, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 60, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 10000 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Chicken Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_bowl: $.data.id }
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
              captures: { win1: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:30:00Z", interval_end: "2026-09-01T10:45:00Z" }
              as: StoreManager
              captures: { win2: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "FIRST_PARTY_DIGITAL", lines: [{ menu_item_id: "${item_bowl}", quantity: 2, customizations: [] }] }
              as: StoreManager
              captures: { order_fill: $.data.id }
          trigger:
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "FIRST_PARTY_DIGITAL", lines: [{ menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: StoreManager
              captures: { order_late: $.data.id }
          assert:
            - "Order.${order_fill}.promised_at == 2026-09-01T10:30:00Z (W1 interval_end)"
            - "Order.${order_late}.promised_at == 2026-09-01T10:45:00Z (W2 interval_end, NOT 10:30)"
            - "Order.${order_late}.production_window_id == ${win2}"
            - "Store.${store_id}.throttle_state == CLOSED after the fill order consumed capacity"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_fulfillment_axes
        grounds:
          - state_machines.Order
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries two INDEPENDENT state axes on one row: fulfillment walks
          PLACED->ACCEPTED->IN_PRODUCTION->READY->PICKED_UP while payment walks
          AUTHORIZED->CAPTURED->REFUNDED. Expiry from READY flips payment to
          REFUNDED without walking fulfillment backwards — parallel, not linear.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store, BOWL, stock, window 10:15-10:30, locked deployment."
            - "One IN_STORE order driven to READY (payment CAPTURED)."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "S5", name: "Store Five", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 10, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 240, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 10000 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Chicken Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_bowl: $.data.id }
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments"
              payload: { shift_date: "2026-09-01", predicted_digital_mix_pct: 0.5, predicted_instore_mix_pct: 0.5, headcount: 4, expected_store_version: "${store_v0}" }
              as: StoreManager
              captures: { deploy_id: $.data.id }
