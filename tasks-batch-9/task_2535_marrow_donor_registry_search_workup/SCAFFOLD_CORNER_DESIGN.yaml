          assert:
            - "the single-day window is created with 201, status \"ACTIVE\", reason \"PERSONAL\" and day_count == 1 (closed inclusive: 2026-09-10..2026-09-10 is one day, not zero)"
            - "the three-day MEDICAL_HOLD window has day_count == 3 and blocked_day_count is 4 after both inserts"
            - "the DELETE returns 204 with no body and drops blocked_day_count to 3 - exactly the released row's day_count"
            - "a PERSONAL row is releasable with no further condition (priority 32 grants it unconditionally); availability_status is still \"AVAILABLE\" because the donor was never deferred"
            - "filtering the window list on status ACTIVE now returns exactly one row, the MEDICAL_HOLD one; the RELEASED row is excluded by the filter but still exists"

      - name: the_deadline_guard_rejects_a_late_response_without_any_sweep
        claim_type: Temporal validation
        grounds:
          - validations[priority=42]
          - validations[priority=14]
          - entities.ConfirmatoryTypingRequest.fields.deadline_at
        distinguishing_aspect: |
          Two requests raised at the same instant share the deadline 2026-08-08T00:00:00Z. A response
          delivered AT that instant is accepted ("not after" is inclusive); the same response one second
          later is rejected with ERR_CT_DEADLINE_PASSED even though no sweep has run, so the row is still
          REQUESTED and passes the priority-14 open-state check first. The lateness rule is enforced at
          response time, independently of the sweep that would have flipped the row to EXPIRED.
        test_recipe:
          setup:
            - "domestic registry (168 h), donors D1 and D5, canonical patient, DOMESTIC_ONLY search - D1 is PRIMARY, D5 is the rank-2 BACKUP"
            - "a typing request is raised on each candidate at the default clock 2026-08-01T00:00:00Z, so both carry deadline_at 2026-08-08T00:00:00Z"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
