            - call: "POST /kidswear/members/${m_b2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${m_b2}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cyc_b2: $.data.id }
            - call: "POST /kidswear/cycles/${cyc_b2}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-22T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kidswear/cycles/${cyc_b2}/close-swap-window"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/cycles/${cyc_b2}/assess-late"
              payload: {}
              as: BillingAgent
              captures: { st_b2_first: $.data.status }
            - call: "POST /kidswear/cycles/${cyc_b2}/assess-late"
              payload: {}
              as: BillingAgent
              captures: { err_b2: $.data.error_id }
          assert:
            - "Cycle.${cyc_b2}.grace_ends_at == 2026-06-05T00:00:00.000Z"
            - "the captured st_b2_first equals RETURN_DUE"
            - "Cycle.${cyc_b2}.late_fee_cents == 0"
            - "the second call returns HTTP 409 and the captured err_b2 equals ERR_GRACE_NOT_EXPIRED"
            - "Cycle.${cyc_b2}.status == RETURN_DUE"

      - name: allocate_by_style_with_empty_candidate_pool_rejects
        grounds:
          - calculations.box_fill_selector
          - validations[priority=54]
          - errors[ERR_NO_ELIGIBLE_STOCK]
        distinguishing_aspect: |
          METRIC = the EMPTY-COLLECTION edge of the selector's candidate pool on
          POST /kidswear/boxes/{id}/allocate — a set-cardinality boundary, not a numeric
          threshold, reached through a third distinct endpoint. Zero IN_STOCK units for the
          requested style yields the declared empty-pool fallback ERR_NO_ELIGIBLE_STOCK.
        test_recipe:
