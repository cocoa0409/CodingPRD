            - "ProgramBlock.${block_id}.status == DRAFT and Title.${t1}.status == IN_PRODUCTION (unchanged; the title entered IN_PRODUCTION when its slot was booked)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: optimistic_concurrency_layer_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[title-approve-stale-season]
          - concurrency_rules[air-slot-create-stale-block]
        distinguishing_aspect: "Layer-level OCC claim is exercised per write-endpoint by the two endpoint corner instances; nothing additional beyond them."
        excluded_because:
          difficulty_instance: endpoints / occ_stale_season_version_on_approve_returns_412 and occ_stale_block_version_on_air_slot_returns_412
          rationale: "Both OCC concurrency_rules entries are directly asserted by the named §1.9 endpoint corners."

      - name: cascading_side_effects_layer_title_cancel_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Title.APPROVED_to_CANCELLED
        distinguishing_aspect: "The 3-hop cancel cascade (quota -> slots -> castings/deals) is asserted end-to-end by the §1.8 transitive cascade instance."
        excluded_because:
          difficulty_instance: transitive_cascade / title_cancel_deep_cascade_to_deal_flip
          rationale: "Asserted as the success path of the named §1.8 instance."

      - name: dual_variant_calculation_layer_both_domains
        claim_type: dual_variant_calculation
        grounds:
          - calculations.sponsorship_projection
          - calculations.royalty_provisional
        distinguishing_aspect: "Both dual-variant calculations are covered by their §1.8 instances."
        excluded_because:
          difficulty_instance: dual_variant_calc / sponsorship_projection_vs_reconciliation_diverge
          rationale: "Variant divergence asserted with pinned literals in the named §1.8 instance (and its royalty sibling)."

      - name: rate_threshold_triggers_layer_quota_and_cap
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.slate_quota_check
          - calculations.encore_cap_check
          - calculations.shoot_day_quota
        distinguishing_aspect: "Cumulative thresholds (slate count, encore cap, shoot-day quota) at exact boundary are covered by §1.8 boundary instances and the §1.9 slate-quota corner."
        excluded_because:
          difficulty_instance: boundary_precision_check / shoot_day_quota_equality_boundary
          rationale: "Threshold boundaries asserted with >= vs > precision in the named §1.8 instance (and its encore-cap sibling)."

