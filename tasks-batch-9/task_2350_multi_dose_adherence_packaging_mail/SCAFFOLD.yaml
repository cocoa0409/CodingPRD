  # -------------------------------- writes -----------------------------------
  - method: POST
    path: /pharmacy/insurance-plans
    roles: [PlatformAdmin]
    description: "Register a payer plan."
    input:
      payer_name: string
      bin_number: string
      generic_copay_cents_per_day: integer
      brand_copay_cents_per_day: integer
      specialty_copay_cents_per_day: integer
      refill_too_soon_threshold_pct?: integer
      max_day_supply_days?: integer
      vacation_overrides_per_year?: integer
      coinsurance_pct?: integer
      allows_payer_vacation_override?: boolean
    output: InsurancePlan
    side_effects:
      - "creates an InsurancePlan with version 1"

  - method: POST
    path: /pharmacy/patients
    roles: [PlatformAdmin, PharmacyOperations]
    description: "Enroll a patient against a payer plan. sync_status starts UNSYNCED so no cycle can be built yet."
    input:
      full_name: string
      date_of_birth: string
      email: string
      state_code: string
      insurance_plan_id: string
    output: Patient
    side_effects:
      - "creates a Patient with sync_status UNSYNCED, autoship_status ACTIVE, adherence_score_pct 100, credit_balance_cents 0, consecutive_missed_pickups 0, vacation_exceptions_used_this_year 0, version 1"

  - method: POST
    path: /pharmacy/prescriptions
    roles: [Prescriber, PharmacyOperations]
    description: "Record a prescription. packable is computed from form and refrigerated and cannot be supplied."
    input:
      patient_id: string
      prescriber_npi: string
      drug_name: string
      ndc: string
      strength: string
      form: string
      copay_tier: string
      dose_times: array
      quantity_per_dose: integer
      days_supply_written: integer
      refills_authorized: integer
      written_date: string
      expiration_date: string
      refrigerated?: boolean
      is_controlled?: boolean
      last_dispensed_date?: string
      last_dispensed_days_supply?: integer
    output: Prescription
    side_effects:
      - "creates a Prescription with status ACTIVE, refills_remaining = refills_authorized, refills_consumed 0, days_dispensed_total 0, version 1"
      - "computes packable = form IN {TABLET, CAPSULE} AND refrigerated == false"

  - method: POST
    path: /pharmacy/patients/{id}/synchronize
    roles: [PharmacyOperations]
    description: "Pin the patient's common fill cycle: anchor day-of-month plus the irreconcilable alignment variant."
    input:
      anchor_fill_day: integer
      sync_mode: string
    output: Patient
    side_effects:
      - "sets anchor_fill_day, sync_mode, sync_status SYNCED and next_cycle_start_date (earliest date >= the clock date whose day-of-month equals anchor_fill_day)"
      - "sweeps every ACTIVE Prescription whose expiration_date is before the clock date to EXPIRED"
      - "writes sync_bridge_days and sync_trim_days on every remaining ACTIVE Prescription per calculations.sync_alignment_days"
      - "increments Patient.version by 1"

  - method: POST
    path: /pharmacy/patients/{id}/autoship
    roles: [PharmacyOperations, Patient]
    description: "Pause, resume or cancel auto-ship. RESUME clears pause_reason and the missed-pickup counter."
    input:
      action: string
    output: Patient
    side_effects:
      - "action PAUSE: autoship_status ACTIVE -> PAUSED_PATIENT with pause_reason PATIENT_REQUEST; every DRAFT FillCycle of the patient becomes CANCELLED"
      - "action RESUME: autoship_status PAUSED_ADHERENCE or PAUSED_PATIENT -> ACTIVE, pause_reason null, consecutive_missed_pickups 0"
      - "action CANCEL: autoship_status -> CANCELLED; every DRAFT FillCycle of the patient becomes CANCELLED; every ISSUED CreditMemo of the patient becomes VOIDED and credit_balance_cents := 0"
      - "increments Patient.version by 1"

  - method: POST
    path: /pharmacy/patients/{id}/dose-events
    roles: [Patient, PharmacyOperations]
    description: "Append an immutable batch of pouch-level adherence events, then re-derive the rolling adherence score and the auto-ship pause gate."
    input:
      cycle_id: string
      events: array
    output: AdherenceEvent[]
    side_effects:
      - "creates one immutable AdherenceEvent per element of events (each element carries event_type POUCH_TAKEN or POUCH_MISSED, occurred_at, dose_slot and pouch_index); source is PATIENT_REPORTED when X-Role == Patient, otherwise SYSTEM_SCAN"
      - "recomputes Patient.adherence_score_pct per calculations.adherence_score_pct variant ROLLING_28_DAY"
      - "when the score falls below ADHERENCE_PAUSE_THRESHOLD_PCT: autoship_status ACTIVE -> PAUSED_ADHERENCE with pause_reason ADHERENCE_GAP; every DRAFT FillCycle of the patient becomes CANCELLED and every CycleLine of those cycles becomes EXCLUDED_HELD"
      - "increments Patient.version by 1"

  - method: POST
    path: /pharmacy/patients/{id}/adherence-review
    roles: [PharmacyOperations]
    description: "Sweep the patient's delivered parcels for expired pickup grace, then re-evaluate the auto-ship gate."
    input: {}
    output: Patient
    side_effects:
      - "every Shipment of the patient with status DELIVERED and clock >= delivered_at + PICKUP_GRACE_DAYS days becomes PICKUP_MISSED and appends an AdherenceEvent (PICKUP_MISSED, source SYSTEM_SCAN)"
      - "Patient.consecutive_missed_pickups rises by the number of parcels swept"
      - "recomputes Patient.adherence_score_pct; when the score gate or the consecutive_missed_pickups >= MISSED_PICKUP_PAUSE_COUNT gate fires, autoship_status ACTIVE -> PAUSED_ADHERENCE (pause_reason ADHERENCE_GAP when the score gate fired, otherwise MISSED_PICKUPS), every DRAFT FillCycle becomes CANCELLED and every CycleLine of those cycles becomes EXCLUDED_HELD"
      - "increments Patient.version by 1"

  - method: POST
    path: /pharmacy/fill-cycles
    roles: [PharmacyOperations]
    description: "Open a fill cycle for a synchronized patient and stage one PLANNED CycleLine per ACTIVE prescription."
    input:
      patient_id: string
      cycle_start_date: string
      day_supply_days?: integer
      sync_mode?: string
    output: FillCycle
    side_effects:
      - "creates a FillCycle with packaging_status DRAFT, insurance_status NOT_ADJUDICATED, cycle_end_date = cycle_start_date + day_supply_days (EXCLUSIVE), sync_mode from the body or Patient.sync_mode, version 1"
      - "creates one CycleLine with line_status PLANNED per Prescription of the patient with status == ACTIVE, in prescription created_at ASC order"

  - method: POST
    path: /pharmacy/fill-cycles/{id}/adjudicate
    roles: [VerifyingPharmacist]
    description: "Run the payer edits over every PLANNED line: refill-too-soon, day supply, refill authorization, packability routing and copay. Re-runnable while the insurance dimension is REJECTED_TOO_SOON."
    input:
      force_pouch_prescription_ids?: array
      vacation_exception_id?: string
    output: FillCycle
    side_effects:
      - "computes days_supply_filled, bridge_days_applied, trim_days_applied, line_start_date, line_end_date, refill_pct_used, allowance_days, packable_route, quantity_dispensed and copay_cents on every PLANNED line"
      - "packable_route := COLD_CHAIN when prescription.refrigerated, POUCH when prescription.packable, otherwise LOOSE_SPLIT"
      - "line_status := HELD_TOO_SOON, HELD_AUTH or ADJUDICATED per §1.2 FillCycle; HELD_AUTH also moves the prescription ACTIVE -> PENDING_AUTHORIZATION"
      - "each ADJUDICATED line stamps the dispense onto its prescription: prior_last_dispensed_date := last_dispensed_date and prior_last_dispensed_days_supply := last_dispensed_days_supply are saved first, then last_dispensed_date := line.line_start_date, last_dispensed_days_supply := line.days_supply_filled, days_dispensed_total += line.days_supply_filled, refills_remaining -= 1, refills_consumed += 1"
      - "packaging_status DRAFT -> LINES_ADJUDICATED; insurance_status -> CLEARED, EDITS_PENDING or REJECTED_TOO_SOON"
      - "stamps total_copay_cents (calculations.cycle_copay_cents variant PINNED_ROUND_THEN_SUM) and consumes outstanding ISSUED CreditMemos into credit_applied_cents"
      - "increments FillCycle.version by 1"

  - method: POST
    path: /pharmacy/fill-cycles/{id}/generate-roll
    roles: [PackagingTechnician]
    description: "Build the dose-time pouch roll for the cycle's pouch-routed lines."
    input: {}
    output: PouchRoll
    side_effects:
      - "creates one PouchRoll (verification_status BUILT, roll_serial stamped, segment_start_date / segment_end_date per calculations.roll_pouch_count) and one Pouch per (dose_date, dose_slot) pair"
      - "packaging_status LINES_ADJUDICATED -> ROLL_GENERATED and FillCycle.roll_pouch_count := PouchRoll.pouch_count"
      - "increments FillCycle.version by 1"

  - method: POST
    path: /pharmacy/pouch-rolls/{id}/pack
    roles: [PackagingTechnician]
    description: "Claim the roll as packed by the calling technician; this pins the identity that may not verify or image it."
    input: {}
    output: PouchRoll
    side_effects:
      - "verification_status BUILT -> PACKED, packed_by_user_id := X-User-ID, packed_at := clock"
      - "cycle.packaging_status ROLL_GENERATED -> PACKED"
      - "increments PouchRoll.version and FillCycle.version by 1"

  - method: POST
    path: /pharmacy/pouches/{id}/verification-image
    roles: [PackagingTechnician, VerifyingPharmacist]
    description: "Record the pack-verification image for one pouch. A low-confidence image is UNREADABLE regardless of the pill count."
    input:
      detected_pill_count: integer
      image_confidence_pct: integer
    output: Pouch
    side_effects:
      - "verification_result := UNREADABLE when image_confidence_pct < IMAGE_MIN_CONFIDENCE_PCT, else MATCH when detected_pill_count == expected_pill_count, else MISMATCH_COUNT"
      - "detected_pill_count, image_confidence_pct, imaged_by_user_id := X-User-ID and imaged_at := clock are stamped"
      - "PouchRoll.mismatch_pouch_count := count of the roll's pouches with verification_result IN {MISMATCH_COUNT, UNREADABLE}"
      - "increments Pouch.version and PouchRoll.version by 1"

  - method: POST
    path: /pharmacy/pouch-rolls/{id}/verification-images
    roles: [PackagingTechnician, VerifyingPharmacist]
    description: "One bench-scanner pass over the whole roll: every still-PENDING pouch is imaged in pouch_index ASC order, with per-pouch overrides for the pouches the scanner read differently."
    input:
      image_confidence_pct: integer
      overrides?: array
    output: PouchRoll
    side_effects:
      - "for every Pouch of the roll with verification_result == PENDING, in pouch_index ASC order: detected_pill_count := expected_pill_count and image_confidence_pct := the body value, UNLESS an element of overrides names that pouch_index, in which case that element's detected_pill_count (and its optional image_confidence_pct) is used instead"
      - "verification_result is then derived exactly as on the single-pouch route: UNREADABLE when the effective image_confidence_pct < IMAGE_MIN_CONFIDENCE_PCT, else MATCH when detected_pill_count == expected_pill_count, else MISMATCH_COUNT"
      - "imaged_by_user_id := X-User-ID and imaged_at := clock on every pouch imaged by this pass; pouches that were already imaged are left untouched"
      - "PouchRoll.mismatch_pouch_count := count of the roll's pouches with verification_result IN {MISMATCH_COUNT, UNREADABLE}"
      - "increments PouchRoll.version by 1 and Pouch.version by 1 for every pouch imaged"

  - method: POST
    path: /pharmacy/pouch-rolls/{id}/verify
    roles: [VerifyingPharmacist]
    description: "Second-person verification of a fully imaged roll. Branches on mismatch_pouch_count."
    input: {}
    output: PouchRoll
    side_effects:
      - "mismatch_pouch_count == 0: verification_status PACKED -> PASSED and cycle.packaging_status PACKED -> VERIFIED"
      - "mismatch_pouch_count >= 1: verification_status PACKED -> FAILED_QUARANTINED, cycle.packaging_status PACKED -> ROLL_GENERATED, and a CreditMemo (reason FAILED_VERIFICATION, amount_cents FAILED_VERIFICATION_GOODWILL_CENTS, status ISSUED) is issued while Patient.credit_balance_cents rises by it"
      - "verified_by_user_id := X-User-ID, verified_at := clock"
      - "increments PouchRoll.version and FillCycle.version by 1"

  - method: POST
    path: /pharmacy/pouch-rolls/{id}/rework
    roles: [VerifyingPharmacist]
    description: "Return a quarantined roll to the bench for repacking, at most MAX_REWORK_COUNT times."
    input: {}
    output: PouchRoll
    side_effects:
      - "verification_status FAILED_QUARANTINED -> BUILT, rework_count += 1, packed_by_user_id / packed_at / verified_by_user_id / verified_at cleared"
      - "every non-VOID Pouch of the roll resets to verification_result PENDING with its image fields cleared; mismatch_pouch_count := 0"
      - "increments PouchRoll.version by 1"

  - method: POST
    path: /pharmacy/fill-cycles/{id}/shipments
    roles: [PharmacyOperations]
    description: "Stage one parcel of the split shipment. A POUCH_ROLL parcel may only be staged once the cycle is VERIFIED; COLD_CHAIN and NON_PACKABLE_LOOSE parcels may be staged from LINES_ADJUDICATED onward because they never touch the pouch bench."
    input:
      shipment_kind: string
      carrier_service: string
      packaging?: string
    output: Shipment
    side_effects:
      - "creates a Shipment with status STAGED, staged_at := clock, covers_line_ids = the cycle's ADJUDICATED or PACKED_OUT lines whose packable_route maps to shipment_kind, and ship_cost_cents per calculations.shipment_cost_cents"
      - "increments FillCycle.version by 1"

  - method: POST
    path: /pharmacy/shipments/{id}/dispatch
    roles: [PharmacyOperations]
    description: "Hand the parcel to the carrier. The dispatch that leaves every required kind in transit closes the cycle's provisional copay into its final copay."
    input: {}
    output: Shipment
    side_effects:
      - "status STAGED -> IN_TRANSIT, tracking_number stamped, dispatched_at := clock"
      - "when every required shipment kind of the cycle is IN_TRANSIT or beyond: cycle.packaging_status VERIFIED -> SHIPPED, final_copay_cents and rounding_delta_cents stamped per calculations.cycle_copay_cents variant FINAL_SUM_THEN_ROUND, every ADJUDICATED line becomes PACKED_OUT, and a ROUNDING_TRUEUP CreditMemo is issued when rounding_delta_cents >= ROUNDING_CREDIT_MIN_CENTS"
      - "increments Shipment.version and FillCycle.version by 1"

  - method: POST
    path: /pharmacy/shipments/{id}/deliver
    roles: [PharmacyOperations]
    description: "Record carrier delivery. A cold-chain parcel whose excursion exceeded the limit is returned and fully reversed instead of delivered."
    input:
      cold_chain_excursion_minutes?: integer
    output: Shipment
    side_effects:
      - "excursion within COLD_CHAIN_EXCURSION_LIMIT_MINUTES (or a non cold-chain parcel): status IN_TRANSIT -> DELIVERED, delivered_at := clock"
      - "cold-chain excursion above the limit: status IN_TRANSIT -> EXCEPTION_RETURNED; every covered CycleLine becomes CREDITED; because those lines were credited each prescription reverses its dispense (refills_remaining += 1, refills_consumed -= 1, days_dispensed_total -= days_supply_filled, last_dispensed_* restored from prior_last_dispensed_*); a CreditMemo (reason COLD_CHAIN_EXCURSION, amount_cents = the credited lines' copay sum) is issued; cycle.total_copay_cents is recomputed; an AdherenceEvent (DELIVERY_EXCEPTION) is appended"
      - "increments Shipment.version by 1"

  - method: POST
    path: /pharmacy/shipments/{id}/confirm-pickup
    roles: [Patient]
    description: "Patient-only confirmation that the parcel was collected; resets the missed-pickup streak and can close the cycle."
    input: {}
    output: Shipment
    side_effects:
      - "status DELIVERED -> PICKED_UP, pickup_confirmed_at := clock, appends an AdherenceEvent (PICKUP_CONFIRMED, source PATIENT_REPORTED)"
      - "Patient.consecutive_missed_pickups := 0"
      - "when every Shipment of the cycle is terminal: cycle.packaging_status SHIPPED -> CLOSED"
      - "increments Shipment.version and FillCycle.version by 1"

  - method: POST
    path: /pharmacy/refill-authorizations
    roles: [PharmacyOperations]
    description: "Open a refill authorization chase against the prescriber."
    input:
      prescription_id: string
      requested_refills: integer
    output: RefillAuthorizationRequest
    side_effects:
      - "creates a RefillAuthorizationRequest with status SENT, chase_round 0, escalation_level 0, first_sent_at := clock, last_sent_at := clock, next_chase_due_at := clock + CHASE_INTERVAL_HOURS, version 1"

  - method: POST
    path: /pharmacy/refill-authorizations/{id}/chase
    roles: [PharmacyOperations]
    description: "One endpoint, two effects: from SENT it records the prescriber's silence, from NO_RESPONSE it re-sends and restarts the 72-hour window."
    input: {}
    output: RefillAuthorizationRequest
    side_effects:
      - "from SENT: status -> NO_RESPONSE, chase_round += 1, no_response_recorded_at := clock"
      - "from NO_RESPONSE: status -> SENT, last_sent_at := clock, next_chase_due_at := clock + CHASE_INTERVAL_HOURS"
      - "increments RefillAuthorizationRequest.version by 1"

  - method: POST
    path: /pharmacy/refill-authorizations/{id}/escalate
    roles: [PharmacyOperations]
    description: "Escalate an exhausted chase; the held line is dropped from the cycle once the cycle's start date has arrived."
    input: {}
    output: RefillAuthorizationRequest
    side_effects:
      - "status NO_RESPONSE -> ESCALATED, escalation_level := 1"
      - "when the clock date has reached the held line's cycle_start_date: that HELD_AUTH CycleLine becomes EXCLUDED_HELD with hold_reason AUTH_ESCALATED, which can move the cycle's insurance dimension EDITS_PENDING -> CLEARED"
      - "increments RefillAuthorizationRequest.version by 1"

  - method: POST
    path: /pharmacy/refill-authorizations/{id}/respond
    roles: [Prescriber]
    description: "Prescriber decision. APPROVE restores refills and revives the held line, which can clear the whole cycle."
    input:
      decision: string
      approved_refills?: integer
      denial_reason?: string
    output: RefillAuthorizationRequest
    side_effects:
      - "APPROVE: status -> APPROVED, approved_refills stored; because the request was approved the prescription moves PENDING_AUTHORIZATION -> ACTIVE with refills_authorized and refills_remaining raised by approved_refills; because refills exist again every HELD_AUTH line of that prescription becomes ADJUDICATED with copay_cents computed and the dispense stamped; because a held line resolved the cycle's total_copay_cents is recomputed and its insurance dimension can move EDITS_PENDING -> CLEARED"
      - "DENY: status -> DENIED, denial_reason stored; the prescription moves PENDING_AUTHORIZATION -> DISCONTINUED and every HELD_AUTH line becomes EXCLUDED_HELD with hold_reason AUTH_DENIED, which can also clear the cycle"
      - "increments RefillAuthorizationRequest.version, Prescription.version and FillCycle.version by 1"

  - method: POST
    path: /pharmacy/vacation-exceptions
    roles: [Patient, PharmacyOperations]
    description: "Request a travel early-supply exception for a future trip."
    input:
      patient_id: string
      travel_start_date: string
      travel_end_date: string
      requested_extra_days: integer
    output: VacationExceptionRequest
    side_effects:
      - "creates a VacationExceptionRequest with status SUBMITTED, approved_extra_days null, waives_refill_too_soon false, version 1"

  - method: POST
    path: /pharmacy/vacation-exceptions/{id}/decide
    roles: [VerifyingPharmacist]
    description: "Decide the travel exception. Only the payer-override branch waives the refill-too-soon edit; neither approval branch is available while a controlled substance is active."
    input:
      decision: string
      approved_extra_days?: integer
      denial_reason?: string
    output: VacationExceptionRequest
    side_effects:
      - "APPROVE_PHARMACIST: status -> PHARMACIST_APPROVED, approved_extra_days stored, waives_refill_too_soon stays false, Patient.vacation_exceptions_used_this_year += 1"
      - "APPROVE_PAYER_OVERRIDE: status -> PAYER_OVERRIDE_APPROVED, approved_extra_days stored, waives_refill_too_soon := true, Patient.vacation_exceptions_used_this_year += 1"
      - "DENY: status -> DENIED, denial_reason stored, the yearly counter is untouched"
      - "decided_by_user_id := X-User-ID, decided_at := clock; increments VacationExceptionRequest.version and Patient.version by 1"

  - method: POST
    path: /pharmacy/prescriptions/{id}/regimen-change
    roles: [Prescriber]
    description: "Mid-cycle regimen change. Supersedes the prescription, mints a successor and unwinds every roll built on the old regimen. The response body is the NEW successor Prescription, not the superseded one."
    input:
      new_drug_name: string
      new_form: string
      new_copay_tier: string
      new_dose_times: array
      new_quantity_per_dose: integer
      expected_prescription_version: integer
      new_ndc?: string
      new_strength?: string
      new_days_supply_written?: integer
      change_reason?: string
    output: Prescription
    side_effects:
      - "the addressed Prescription moves ACTIVE -> SUPERSEDED and a successor Prescription is created (status ACTIVE, supersedes_rx_id = the addressed id, refills_remaining and refills_consumed carried forward, packable recomputed from new_form)"
      - "because the prescription was superseded every CycleLine referencing it on a cycle whose packaging_status IN {DRAFT, LINES_ADJUDICATED, ROLL_GENERATED, PACKED, VERIFIED} becomes SUPERSEDED_PENDING_REISSUE with hold_reason REGIMEN_CHANGE"
      - "because a line was superseded each affected cycle sets reissue_required := true and reverts packaging_status PACKED or VERIFIED -> ROLL_GENERATED"
      - "because the cycle reverted, every Shipment of that cycle with status STAGED and shipment_kind POUCH_ROLL becomes CANCELLED"
      - "increments Prescription.version by 1 (OCC parent), and FillCycle.version by 1 for every affected cycle"

  - method: POST
    path: /pharmacy/fill-cycles/{id}/reissue
    roles: [PharmacyOperations]
    description: "Reissue the untaken tail of a cycle as a new partial cycle and credit the unused portion less the reissue fee. The response body is the NEW partial-reissue FillCycle, not the original."
    input:
      effective_date: string
      replacement_prescription_ids: array
      expected_cycle_version: integer
    output: FillCycle
    side_effects:
      - "computes the credit per calculations.partial_reissue_credit_cents; stamps reissue_fee_cents on the ORIGINAL cycle and issues a CreditMemo (reason PARTIAL_REISSUE, amount_cents = the net credit, cycle_id = the original cycle, status ISSUED) while Patient.credit_balance_cents rises by it"
      - "each reissued CycleLine becomes REISSUED with days_supply_filled := used_days, line_end_date := effective_date and copay_cents reduced by its line credit; the original cycle's total_copay_cents is recomputed over the retained lines"
      - "each reissued line's prescription has last_dispensed_days_supply reset to used_days and days_dispensed_total reduced by the unused days, so the successor cycle adjudicates against what was actually consumed"
      - "creates a new FillCycle with is_partial_reissue true, reissue_of_cycle_id = the original cycle, cycle_start_date = effective_date, day_supply_days = the original cycle_end_date - effective_date, packaging_status DRAFT, insurance_status NOT_ADJUDICATED, and one PLANNED CycleLine per prescription in replacement_prescription_ids"
      - "increments FillCycle.version by 1 (OCC parent)"

  - method: POST
    path: /pharmacy/_clock/set_current_utc
    roles: [PlatformAdmin, PharmacyOperations, VerifyingPharmacist, PackagingTechnician, Prescriber, Patient]
    description: "Test-only logical clock. Every date and timestamp comparison in this domain reads this clock. The default logical clock is 2026-08-01T00:00:00Z until this endpoint is called."
    input:
      current_utc: string
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock; no business entity is mutated"

# =============================================================================
# 1.6 Error Catalog — 56 error ids, every one reachable
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Authentication headers are required."
    raised_by: "any endpoint called without X-User-ID or X-Role"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Role {role} may not perform this operation."
    raised_by: "any endpoint called with a role outside its §1.5 role list"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request body is invalid: {detail}."
    raised_by: "missing required field, wrong type, out-of-range integer, bad enum, bad date, empty dose_times, limit/offset out of range"
  - error_id: ERR_PATIENT_SCOPE_VIOLATION
    http_status: 403
    message: "A patient may only act on their own records."
    raised_by: "X-Role == Patient addressing a resource whose owning patient_id != X-User-ID"
  - error_id: ERR_INSURANCE_PLAN_NOT_FOUND
    http_status: 404
    message: "Insurance plan {id} was not found."
    raised_by: "GET /pharmacy/insurance-plans/{id}; POST /pharmacy/patients with an unknown insurance_plan_id"
  - error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    message: "Patient {id} was not found."
    raised_by: "any /pharmacy/patients/{id} route; unknown patient_id in a body"
  - error_id: ERR_PRESCRIPTION_NOT_FOUND
    http_status: 404
