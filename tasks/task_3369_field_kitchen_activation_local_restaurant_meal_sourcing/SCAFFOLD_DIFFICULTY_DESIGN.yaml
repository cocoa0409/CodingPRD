            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
            - call: "POST /field-ops/partner-kitchens"
              payload: { incident_id: "${inc_id}", business_name: "Casa Rosa", owner_name: "Rosa Delgado", cuisine_tags: ["LOCAL"], daily_capacity_meals: 1200, per_meal_price_cents: 1500, bank_verified: true }
              as: PartnershipLead
              captures: { pk_id: "$.data.id" }
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "VETTING" }
              as: PartnershipLead
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "CONTRACTED", vetting_score: 72 }
              as: PartnershipLead
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "PRODUCTION", to_state: "PRODUCING" }
              as: KitchenOperator
              as_user_id: "${pk_id}"
          trigger:
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "SUSPENDED" }
              as: PartnershipLead
            - call: "GET /field-ops/partner-kitchens/${pk_id}"
              as: ProductionPlanner
              captures: { pk_v1: "$.data.version" }
            - call: "POST /field-ops/meal-orders"
              payload: { incident_id: "${inc_id}", partner_kitchen_id: "${pk_id}", menu_name: "Arroz con Pollo", dietary_tags: ["VEGETARIAN"], ordered_meals: 1000, scheduled_start: "2026-09-01T08:00:00Z", production_hours: 4, expected_partner_kitchen_version: "${pk_v1}" }
              as: ProductionPlanner
              captures: { err_state: "$.data.error_id" }
            - call: "POST /field-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "PRODUCTION", to_state: "IDLE" }
              as: KitchenOperator
              as_user_id: "${pk_id}"
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "CONTRACTED", vetting_score: 72 }
              as: PartnershipLead
            - call: "GET /field-ops/partner-kitchens/${pk_id}"
              as: ProductionPlanner
              captures: { pk_v2: "$.data.version" }
            - call: "POST /field-ops/meal-orders"
              payload: { incident_id: "${inc_id}", partner_kitchen_id: "${pk_id}", menu_name: "Arroz con Pollo", dietary_tags: ["VEGETARIAN"], ordered_meals: 1000, scheduled_start: "2026-09-01T08:00:00Z", production_hours: 4, expected_partner_kitchen_version: "${pk_v2}" }
              as: ProductionPlanner
              captures: { err_fiscal: "$.data.error_id" }
          assert:
            - "${err_state} == \"ERR_PARTNER_KITCHEN_NOT_CONTRACTED\""
            - "${err_fiscal} == \"ERR_FUNDING_CEILING_EXCEEDED\""
            - "Incident.${inc_id}.spent_cents == 0"

      - name: site_access_safety_beats_run_capacity_constraint_on_stop_creation
        grounds:
          - validations[priority=21]
          - validations[priority=26]
          - errors[ERR_SITE_ACCESS_BLOCKED]
          - errors[ERR_RUN_LOAD_EXCEEDS_CAPACITY]
        distinguishing_aspect: |
          Adding a stop that breaks both a business_safety rule (BLOCKED receiving site) and a
          business_constraint rule (pending load above loaded_meals) returns ERR_SITE_ACCESS_BLOCKED,
          while the identical load breach against an OPEN site returns ERR_RUN_LOAD_EXCEEDS_CAPACITY -
          so the winning error is decided by the priority ordering, not by the payload shape.
        test_recipe:
          setup:
            - "Incident ${inc_id} is ACTIVE"
            - "FieldKitchen ${fk_id} is OPERATIONAL"
            - "DistributionRun ${run_id} is LOADING with loaded_meals 10 and one PENDING stop of 10 planned meals"
