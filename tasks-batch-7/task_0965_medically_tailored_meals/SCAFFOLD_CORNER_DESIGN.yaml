            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-l2", route_date: "2026-04-15", start_time: "08:00", end_time: "12:00", capacity_stops: 20 }, as: LogisticsCoordinator, captures: { rt_id: $.data.id } }
            - { call: "POST /mtm/delivery-routes/${rt_id}/dispatch", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-04-15" }, as: LogisticsCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /mtm/deliveries/${d_id}/out-for-delivery", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d_id}/mark-delivered", payload: {}, as: Driver }
            - { call: "GET /mtm/reauthorizations/${a_id}", payload: {}, as: BillingSpecialist, captures: { a_v: $.data.version } }
            - { call: "POST /mtm/claims", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", authorization_id: "${a_id}", expected_reauthorization_version: "${a_v}" }, as: BillingSpecialist, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /mtm/claims", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", authorization_id: "${a_id}", expected_reauthorization_version: "${a_v}" }, as: BillingSpecialist, captures: { err: $.data.error_id } }
            - { call: "GET /mtm/reauthorizations/${a_id}", payload: {}, as: BillingSpecialist, captures: { a_v2: $.data.version } }
            - { call: "POST /mtm/claims", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", authorization_id: "${a_id}", expected_reauthorization_version: "${a_v2}" }, as: BillingSpecialist, captures: { c2: $.data.id } }
          assert:
            - "second create with stale version: HTTP 412 and error_id == ERR_STALE_AUTHORIZATION_VERSION"
            - "retry with fresh version succeeds: Claim.${c2}.id exists and status == DRAFT"
            - "Reauthorization.${a_id}.version advanced by exactly 1 per successful claim creation"

      - name: member_version_increments_on_every_mutation
        claim_type: occ_version_increment
        grounds:
          - "concurrency_rules[prescription-activate-stale-member]"
          - "entities.Member.fields.version"
        distinguishing_aspect: "Member.version is 1 at creation and increments by exactly 1 on each mutation (activate, suspend, reactivate): the observed sequence is 1 -> 2 -> 3 -> 4."
        test_recipe:
          setup: ["member created"]
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "L Three", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-L3", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "SUSPENDED" }, as: CareCoordinator, captures: { v3: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { v4: $.data.version } }
          assert:
            - "version sequence observed: 1 at create, 2 after activate, 3 after suspend, 4 after reactivate"
            - "Member.${m_id}.status == ACTIVE"

