              payload: { expected_run_version: "${run_v_full}" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
          assert:
            - "at ship the row reads status == \"SHIPPED\" AND reserve_status == \"HELD\", returns_rate == 0.0000, effective_reserve_pct == 0.1000, reserve_initial_cents == 90000 == round_half_up(1000 * 900 * 0.1000), reserve_held_cents == 90000, reserve_liquidated_cents == 0 and physical_net_receipts_cents == 600000"
