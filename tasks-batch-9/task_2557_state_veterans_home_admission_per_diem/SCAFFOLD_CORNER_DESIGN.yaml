      - name: sm_clinical_assessment_submit_below_nursing_hours_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ClinicalAssessment.DRAFT_to_SUBMITTED
          - validations[priority=75,ERR_CARE_LEVEL_MISMATCH]
          - calculations.applicant_priority_score
        distinguishing_aspect: |
          The NURSING submit gate is >= 2.00 skilled nursing hours, so 1.50 is refused with 409
          ERR_CARE_LEVEL_MISMATCH and the assessment stays DRAFT at version 1, while an otherwise
          identical assessment at exactly 2.00 submits. Because DRAFT assessments contribute no
          acuity, the applicant's priority_score is still 1270 after the refusal and only becomes
          1390 once a submit succeeds.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome and one CERTIFIED NURSING CareUnit (licensed 2, out_of_service 0)."
            - "One ELIGIBLE CLASS_1 Applicant: service_connected_disability_pct 80, state_residency_years 6, application_received_date 2026-08-01, no assessment yet, so priority_score is 1000 + 240 + 30 = 1270."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Quarry Hill State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
