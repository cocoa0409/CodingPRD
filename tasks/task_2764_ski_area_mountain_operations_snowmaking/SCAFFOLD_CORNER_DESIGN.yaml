              payload: {  }
              as: SnowmakingSupervisor
            - call: "GET /mountain-ops/seasons/${season_id}/snow-accounting"
              payload: {  }
              as: SnowmakingSupervisor
          assert:
            - "Trigger 1: HTTP 422 with data.error_id == 'ERR_PLANT_CAPACITY_EXCEEDED' - on [10:00, 12:00) the plant carries 3500 + 3000 = 6500 > 6000, while PH2 alone carries only 3000 of its 4000."
            - "Trigger 1 did not bump the area version, so trigger 2 reuses the same expected_terrain_area_version successfully."
            - "Trigger 2: HTTP 201 - the window now merely touches S1 at 12:00, so the plant peak is max(3500, 3000) = 3500."
            - "Trigger 3: HTTP 422 with data.error_id == 'ERR_PUMP_CAPACITY_EXCEEDED' - PH1 carries 3500 + 4200 = 7700 > 4000 on [10:00, 12:00) and the plant carries 3000 + 4200 = 7200 > 6000 on [12:00, 14:00); the pump-house rule at priority 42 wins over the plant rule at 43."
            - "Trigger 4: PH1 peak_committed_gpm == 3500 and active_session_count == 0 (both sessions are still SCHEDULED)."
