      - name: err_409_no_op_family_restore_reinstate_and_cancel_are_never_idempotent
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OVEN_STATION_ALREADY_OPERATIONAL
          - errors.ERR_COOLING_BAY_ALREADY_OPERATIONAL
          - errors.ERR_TECHNICIAN_ALREADY_ACTIVE
          - errors.ERR_CUSTOMER_ALREADY_ACTIVE
          - errors.ERR_ORDER_ALREADY_TERMINAL
        distinguishing_aspect: |
          Five separate 409 codes exist purely to refuse a repeat of an
          undo-style action, and this instance shows each of them refusing
          rather than quietly succeeding: restoring a station that was never
          down, restoring a bay that was never down, reinstating an ACTIVE
          technician, reinstating an ACTIVE customer and cancelling an already
          CANCELLED order — and none of the five refusals bumps its row's
          version.
        test_recipe:
          setup:
            - "OvenStation OVN-CD-1 and CoolingBay BAY-CD-1 both OPERATIONAL and never marked down; Technician T-CD-RES-1 ACTIVE; Customer CUS-CD-1 ACTIVE; ProductionOrder PO-CD-1 cancelled once so it sits in the terminal CANCELLED state."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_cust
            - call: "POST /production-orders/${po}/cancel"
              payload: { cancel_reason: "dealer withdrew the order" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_vc: $.data.version }
          trigger:
            - call: "POST /oven-stations/${station}/restore"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /cooling-bays/${bay}/restore"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /technicians/${t_res}/reinstate"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /customers/${cust}/reinstate"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /production-orders/${po}/cancel"
              payload: { cancel_reason: "dealer withdrew the order again" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /oven-stations/${station}/mark-down"
              payload: { down_reason: "thermocouple drift" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /oven-stations/${station}/restore"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /oven-stations/${station}/restore"
              payload: {}
              as: PlantAdmin
