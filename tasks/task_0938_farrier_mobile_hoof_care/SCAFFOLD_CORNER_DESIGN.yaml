      - name: corner_replenishment_flag_flips_exactly_at_the_reorder_point
        claim_type: threshold
        grounds: [calculations.bucket_replenishment_flag, "constants.REORDER_POINT_PAIRS", state_machines.InventoryBucket]
        distinguishing_aspect: "The comparison is <=, so available_pairs 3 leaves replenishment_flag false while available_pairs 2 sets it true; the flag is re-derived on the same request that changes the count."
        test_recipe:
          setup: ["One farrier, one SKU and its VAN bucket."]
          setup_api_calls:
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "JOURNEYMAN", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr1: "$.data.id" }
            - call: "POST /shoe-skus"
              payload: { sku_code: "ST-1", size_code: "1", material: "STEEL", price_cents_per_pair: 5600 }
              as: PlatformAdmin
              captures: { sku1: "$.data.id" }
            - call: "GET /inventory-buckets"
              payload: { farrier_id: "${fr1}", sku_id: "${sku1}", location_kind: "VAN" }
              as: PlatformAdmin
              captures: { van1: "$.data[0].id" }
            - call: "POST /inventory-buckets/${van1}/adjust"
              payload: { delta_pairs: 3 }
              as: PlatformAdmin
          trigger:
            - call: "POST /inventory-buckets/${van1}/adjust"
              payload: { delta_pairs: -1 }
              as: PlatformAdmin
          assert:
            - "immediately before the trigger, InventoryBucket.${van1}.available_pairs == 3 and replenishment_flag == false"
            - "after the trigger, InventoryBucket.${van1}.available_pairs == 2 and on_hand_pairs == 2 and replenishment_flag == true"
            - "after the trigger, InventoryBucket.${van1}.reserved_pairs == 0 (INV_BUCKET_BALANCE holds)"

