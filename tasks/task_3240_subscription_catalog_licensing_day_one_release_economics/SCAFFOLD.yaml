    roles: [CatalogAdmin]
    code: 201
    input: [title_id, region_code, tiers, announced_add_date, removal_date, release_class, popularity_index_cents, "popularity_index_cents_30d_avg?"]
    output: CatalogEntry
    side_effects: ["status initialized to PLANNED", "removal_notice_days recomputed", "deal_id resolved from the title's binding deal"]

  - method: GET
    path: "/catalog/catalog-entries/{entry_id}"
