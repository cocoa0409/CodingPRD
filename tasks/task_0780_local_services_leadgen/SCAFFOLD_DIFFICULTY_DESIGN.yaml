  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pro_credit_cents_conserved_charge_then_refund
        grounds:
          - state_machines.Lead.CHARGED_to_REFUNDED
          - calculations.lead_charge
          - entities.Pro.fields.credit_balance_cents
        distinguishing_aspect: "Conserved quantity = pro.credit_balance_cents + sum(active pay-per-lead charge_cents). Distribute debits 5000 (20000->15000); refund-request credits it back exactly, restoring credit_balance_cents==20000 (no drift)."
        test_recipe:
          setup:
            - "Pro PR2 wallet 20000; one CHARGED pay-per-lead lead (charge 5000) within the refund window."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
