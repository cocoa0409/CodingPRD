    code: 200
    input: []
    output: RoadsideCase
    side_effects:
      - "status=RESPONSE_DISPATCHED; dispatched_at = logical clock; raise_count increments by 1"
      - "the referencing Vehicle moves to ROADSIDE with is_roadside_blocked=true (cascade; updates Vehicle.version)"
  - method: POST
    path: "/fleet/roadside-cases/{caseId}/clear"
    description: "Clear a dispatched case (RESPONSE_DISPATCHED to CLEARED); releases the vehicle"
