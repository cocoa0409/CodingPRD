# =============================================================================
# PRD Benchmark Scaffold — Pre-Employment Assessment & Structured Interview
# =============================================================================

scenario: |
  Pre-Employment Assessment & Structured Interview (talent assessment team): assessment selection & validation evidence, adverse impact analysis by group, interview guide & competency rubric authoring, interviewer training & calibration, scorecard collection & hiring decision documentation, accommodation requests during assessment, assessment score retention & candidate feedback, vendor management & content security

domain_name: pre-employment-assessment
api_prefix: /talent

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency        # OCC on AssessmentCycle PATCH and InterviewGuide supersede
    - cascading_side_effects        # vendor suspension depth-3 cascade; cycle close chain; scorecard void compensation
    - rate_threshold_triggers       # four-fifths rule at exactly 0.8000; calibration thresholds 0.70/0.50; quorum gate
    - version_pinning_on_approval   # cycle pins guide + instrument identities; snapshot pins computed breakdown
  entity_topology: graph            # self-referential guide chain, many-to-many calibration, cross-aggregate FK pins
  state_machine_shape: posture_driven   # AssessmentCycle posture gates all child operations; plus cyclic + parallel machines
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties     # guide author != approver; decision officer != scorecard author; scheduler != accommodation approver
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AssessmentVendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor legal name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Lifecycle: ACTIVE | SUSPENDED | TERMINATED", constraints: "initial ACTIVE; see state_machines.AssessmentVendor" }
      - { name: security_clearance_tier, type: enum, source: input, default: TIER_2, description: "Content-security tier", constraints: "TIER_1 | TIER_2 | TIER_3" }
      - { name: content_copies_outstanding, type: integer, source: computed, default: 0, description: "Ledger: sum(ContentLedgerEvent.copies WHERE direction=DISTRIBUTE) - sum(... WHERE direction=DESTROY) for this vendor; never negative" }
      - { name: terminated_at, type: datetime, source: system, description: "Set when status -> TERMINATED; null otherwise" }

  - name: ContentLedgerEvent
    parent: AssessmentVendor
    common_fields: false
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> AssessmentVendor.id; taken from path" }
      - { name: direction, type: enum, source: input, description: "DISTRIBUTE (copies leave vault to client) | DESTROY (certified secure destruction)", constraints: "DISTRIBUTE | DESTROY" }
      - { name: copies, type: integer, source: input, description: "Number of instrument content copies moved", constraints: "integer >= 1" }
      - { name: note, type: string, source: input, description: "Chain-of-custody note", constraints: "min length 10" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of recorder" }

  - name: AssessmentInstrument
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> AssessmentVendor.id; immutable after create" }
      - { name: code, type: string, source: input, description: "Vendor-scoped instrument code", constraints: "unique per (vendor_id, code) -> ERR_DUPLICATE_INSTRUMENT_CODE" }
      - { name: instrument_type, type: enum, source: input, description: "COGNITIVE_ABILITY | PERSONALITY | SKILLS_SIMULATION | JOB_KNOWLEDGE" }
      - { name: title, type: string, source: input, description: "Display title" }
      - { name: max_score, type: integer, source: input, description: "Maximum raw score", constraints: "integer >= 1" }
      - { name: pass_floor, type: integer, source: input, description: "Raw score below which assessment_component clamps to 0", constraints: "0 <= pass_floor < max_score" }
      - { name: validation_status, type: enum, source: system, default: DRAFT, description: "DRAFT | VALIDATION_REVIEW | VALIDATED | EXPIRED | REVALIDATION | RETIRED", constraints: "see cyclic state machine" }
      - { name: validity_expires_at, type: datetime, source: system, description: "Set at validate = min(effective_until) over current CRITERION+CONTENT evidence; null until first VALIDATED" }
      - { name: vendor_suspended, type: boolean, source: system, default: false, description: "Cascade flag set when parent vendor suspended; cleared on reinstate" }
      - { name: adverse_impact_monitor_enabled, type: boolean, source: input, default: true, description: "When false, a flagged FINAL snapshot does NOT auto-freeze referencing cycles" }

  - name: ValidationEvidence
    parent: AssessmentInstrument
    common_fields: true
    fields:
      - { name: instrument_id, type: string, source: system, description: "FK -> AssessmentInstrument.id; taken from path" }
      - { name: evidence_type, type: enum, source: input, description: "CRITERION | CONTENT | CONSTRUCT" }
      - { name: title, type: string, source: input, description: "Evidence title" }
      - { name: issuer, type: string, source: input, description: "Issuing body" }
      - { name: effective_from, type: datetime, source: input, description: "Start of validity (inclusive)" }
      - { name: effective_until, type: datetime, source: input, description: "End of validity (exclusive at check time: current iff effective_from <= now AND effective_until > now)", constraints: "effective_until > effective_from" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock time of filing" }

  - name: InterviewGuide
    parent: null
    common_fields: true
    fields:
      - { name: supersedes_guide_id, type: string, source: system, description: "FK -> InterviewGuide.id; null for root guides; set from path on the revisions endpoint (OCC-guarded supersede)", constraints: "nullable; target must be APPROVED" }
      - { name: title, type: string, source: input, description: "Guide title" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PILOT | APPROVED | RETIRED", constraints: "see state machine (cyclic supersede)" }
      - { name: rubric_items, type: array, source: input, description: "Array of {competency_code: string, weight: number in (0,1], scale_max: integer 2..10}; >= 2 items; competency_code unique within guide; weights must sum to exactly 1.0000 at 4dp" }
      - { name: scoring_mode, type: enum, source: input, default: RAW, description: "RAW | LENIENCY_ADJUSTED — selects calibration_index variant" }
      - { name: version_label, type: integer, source: system, description: "1 for root guide; supersedes_guide_id.version_label + 1 for revisions" }
      - { name: superseded_by_guide_id, type: string, source: system, description: "Set (and version bumped) when a superseding guide is created; this mutation is what expected_superseded_guide_version guards" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; SoD: approver must differ" }
      - { name: pinned_cycle_count, type: integer, source: computed, default: 0, description: "Count of AssessmentCycles with guide_id == this.id and posture != CLOSED" }

  - name: Requisition
    parent: null
    common_fields: true
    fields:
      - { name: hiring_manager_id, type: string, source: system, description: "Opaque X-User-ID of creating HiringManager; ownership anchor for all child cycles" }
      - { name: title, type: string, source: input, description: "Job title" }
      - { name: department, type: string, source: input, description: "Department" }
      - { name: openings_count, type: integer, source: input, description: "Number of openings", constraints: "integer >= 1" }
      - { name: filled_count, type: integer, source: computed, default: 0, description: "Count of FINALIZED HiringDecisions with decision=ADVANCE across all cycles of this requisition" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FILLED | CLOSED; FILLED auto when filled_count >= openings_count" }
      - { name: retention_days, type: integer, source: input, default: 730, description: "Score retention window in days", constraints: "180..3650" }

  - name: AssessmentCycle
    parent: Requisition
    common_fields: true
    fields:
      - { name: requisition_id, type: string, source: system, description: "FK -> Requisition.id; taken from path" }
      - { name: instrument_id, type: string, source: input, description: "FK -> AssessmentInstrument.id; pinned at create" }
      - { name: guide_id, type: string, source: input, description: "FK -> InterviewGuide.id; pinned at create" }
      - { name: label, type: string, source: input, description: "Cycle label" }
      - { name: posture, type: enum, source: system, default: SETUP, description: "SETUP | ACTIVE | FROZEN | SCORING | DECIDED | CLOSED; posture gates all child operations", constraints: "see state machine" }
      - { name: frozen_from_posture, type: enum, source: system, description: "Posture captured when FROZEN: SETUP | ACTIVE | SCORING; null when not frozen" }
      - { name: frozen_reason, type: enum, source: system, description: "MANUAL | ADVERSE_IMPACT | VENDOR_HOLD; null when not frozen" }
      - { name: administration_window_start, type: datetime, source: input, description: "Administration window start (inclusive)" }
      - { name: administration_window_end, type: datetime, source: input, description: "Administration window end (INCLUSIVE — closed interval; completing at exactly this instant is valid)", constraints: "> administration_window_start" }
      - { name: max_sessions_per_day, type: integer, source: input, default: 8, description: "Aggregate session capacity per UTC day for this cycle", constraints: "1..100" }
      - { name: active_candidate_count, type: integer, source: computed, default: 0, description: "count(CandidateAssessment WHERE cycle_id=this AND admin_status NOT IN {CANCELLED, PURGED})" }
      - { name: decisions_finalized_count, type: integer, source: computed, default: 0, description: "count(HiringDecision WHERE cycle_id=this)" }
      - { name: closed_at, type: datetime, source: system, description: "Set on transition to CLOSED; retention anchor for assessments without FINALIZED decisions; null otherwise" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: external_ref, type: string, source: input, description: "External ATS reference", constraints: "globally unique -> ERR_DUPLICATE_CANDIDATE_REF" }
      - { name: full_name, type: string, source: input, description: "Candidate name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: group_code, type: enum, source: input, description: "Self-identified group for adverse-impact analysis: GROUP_A | GROUP_B | GROUP_C | GROUP_D | UNDISCLOSED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | WITHDRAWN" }

  - name: CandidateAssessment
    parent: AssessmentCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> AssessmentCycle.id; taken from invitation path" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id", constraints: "unique per (cycle_id, candidate_id) -> ERR_DUPLICATE_INVITATION" }
      - { name: admin_status, type: enum, source: system, default: INVITED, description: "Administration dimension: INVITED | SCHEDULED | ACCOMMODATION_HOLD | IN_PROGRESS | COMPLETED | NO_SHOW | CANCELLED | PURGED" }
      - { name: feedback_status, type: enum, source: system, default: NOT_SENT, description: "Parallel feedback dimension: NOT_SENT | SENT | NOT_APPLICABLE; evolves independently of admin_status" }
      - { name: scheduled_for, type: datetime, source: system, description: "Set by schedule/reschedule; null until scheduled" }
      - { name: started_at, type: datetime, source: system, description: "Set on start" }
      - { name: completed_at, type: datetime, source: system, description: "Set on complete; null after purge" }
      - { name: raw_score, type: number, source: input, description: "Raw score supplied at complete; 0..instrument.max_score; nulled by purge" }
      - { name: composite_score, type: number, source: computed, description: "calculations.candidate_composite_score, 4dp; non-null iff admin_status==COMPLETED; nulled by purge" }
      - { name: accommodation_extension_days, type: integer, source: system, default: 0, description: "Sum of approved_extension_days over APPROVED AccommodationRequests" }
      - { name: retention_expires_at, type: datetime, source: computed, description: "anchor + requisition.retention_days; anchor = decision finalized_at if a FINALIZED decision exists else cycle closed_at when CLOSED else null" }
      - { name: purged_at, type: datetime, source: system, description: "Set by retention sweep" }

  - name: AccommodationRequest
    parent: CandidateAssessment
    common_fields: true
    fields:
      - { name: candidate_assessment_id, type: string, source: system, description: "FK -> CandidateAssessment.id; taken from path" }
      - { name: request_type, type: enum, source: input, description: "EXTENDED_TIME | ALTERNATE_FORMAT | SCREEN_READER | OTHER" }
      - { name: justification, type: string, source: input, description: "Request justification", constraints: "min length 20" }
      - { name: requested_extension_days, type: integer, source: input, description: "Requested window extension", constraints: "1..30" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | DENIED | WITHDRAWN" }
      - { name: approved_extension_days, type: integer, source: system, description: "Set at approve; 1..requested_extension_days" }
      - { name: decision_note, type: string, source: system, description: "Note supplied at approve/deny" }
      - { name: decided_by_user_id, type: string, source: system, description: "ComplianceOfficer X-User-ID at decide" }
      - { name: decided_at, type: datetime, source: system, description: "Logical time of decision" }

  - name: Interviewer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Interviewer name" }
      - { name: email, type: string, source: input, description: "Work email" }
      - { name: department, type: string, source: input, description: "Department" }
      - { name: committed_minutes_total, type: integer, source: computed, default: 0, description: "Sum of (scheduled_end - scheduled_start) minutes over InterviewSessions with interviewer_id=this AND status==SCHEDULED" }

  - name: CalibrationRecord
    parent: Interviewer
    common_fields: true
    fields:
      - { name: interviewer_id, type: string, source: system, description: "FK -> Interviewer.id; taken from path" }
      - { name: guide_id, type: string, source: input, description: "FK -> InterviewGuide.id", constraints: "at most one record per (interviewer_id, guide_id) with status IN {TRAINED, CALIBRATED} -> ERR_DUPLICATE_CALIBRATION" }
      - { name: status, type: enum, source: system, default: TRAINED, description: "TRAINED | CALIBRATED | LAPSED" }
      - { name: practice_score, type: number, source: system, description: "Supplied at certify; must be >= 0.7000" }
      - { name: trained_at, type: datetime, source: system, description: "Set at create" }
      - { name: certified_at, type: datetime, source: system, description: "Set at certify; LAPSED when now > certified_at + 365 days (strictly greater; equality stays CALIBRATED)" }
      - { name: calibration_index, type: number, source: computed, description: "calculations.interviewer_calibration_index over this (interviewer, guide); null until the interviewer has >= 1 SUBMITTED scorecard on this guide; 4dp" }

  - name: InterviewSession
    parent: AssessmentCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> AssessmentCycle.id; taken from path" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: interviewer_id, type: string, source: input, description: "FK -> Interviewer.id" }
      - { name: guide_id, type: string, source: input, description: "FK -> InterviewGuide.id; MUST equal cycle.guide_id else ERR_GUIDE_VERSION_MISMATCH" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start [start, end): a following session may start exactly at this session's end" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end (exclusive for overlap, inclusive completion gate: complete requires now >= scheduled_end)", constraints: "scheduled_end > scheduled_start; duration 15..240 minutes" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | SCORED | CANCELLED" }
      - { name: completed_at, type: datetime, source: system, description: "Set at complete" }
      - { name: cancellation_reason, type: enum, source: system, description: "MANUAL | VENDOR_HOLD | CANDIDATE_WITHDRAWN | CYCLE_CLOSED; null unless CANCELLED" }

  - name: Scorecard
    parent: InterviewSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> InterviewSession.id; taken from path" }
      - { name: interviewer_id, type: string, source: system, description: "FK -> Interviewer.id; copied from session.interviewer_id (author = session's interviewer)" }
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; copied from session.candidate_id" }
      - { name: ratings, type: array, source: input, description: "Array of {competency_code, rating}; each code at most once and must exist in pinned guide rubric; rating integer 1..that item's scale_max; >= 1 item; partial coverage allowed (composite renormalizes). Nulled by retention purge.", constraints: "ERR_RATINGS_EMPTY | ERR_RATING_COMPETENCY_MISMATCH | ERR_RATING_OUT_OF_RANGE" }
      - { name: overall_recommendation, type: enum, source: input, description: "STRONG_YES | YES | NO | STRONG_NO" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | VOIDED", constraints: "at most one non-VOIDED scorecard per session -> ERR_DUPLICATE_SCORECARD" }
      - { name: weighted_total, type: number, source: computed, description: "Computed at submit: sum over rated competencies of weight_c * rating_c / scale_max_c, 4dp; nulled by purge" }
      - { name: submitted_at, type: datetime, source: system, description: "Set at submit" }
      - { name: voided_at, type: datetime, source: system, description: "Set at void" }
      - { name: void_reason, type: string, source: system, description: "Supplied at void; min length 20" }
      - { name: redacted, type: boolean, source: system, default: false, description: "Set true by retention purge (ratings + weighted_total nulled)" }

  - name: HiringDecision
    parent: AssessmentCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> AssessmentCycle.id; taken from path" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id", constraints: "one decision per (cycle_id, candidate_id) -> ERR_DECISION_ALREADY_FINALIZED" }
      - { name: decision, type: enum, source: input, description: "ADVANCE | HOLD | REJECT" }
      - { name: rationale, type: string, source: input, description: "Decision documentation", constraints: "min length 50 -> ERR_RATIONALE_TOO_SHORT" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of DecisionOfficer; SoD: must not equal any author interviewer_id of the SUBMITTED scorecards counted toward quorum" }
      - { name: status, type: enum, source: system, default: FINALIZED, description: "Always FINALIZED — decisions are created final after all gates pass; no further transitions" }
      - { name: composite_at_decision, type: number, source: computed, description: "Snapshot of CandidateAssessment.composite_score at decision time (4dp)" }
      - { name: quorum_required_at_decision, type: integer, source: system, description: "max(2, min(3, sessions_evaluated)) captured at decision time" }
      - { name: quorum_submitted_at_decision, type: integer, source: system, description: "count of SUBMITTED non-VOIDED scorecards at decision time" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical time of creation; retention anchor" }

  - name: AdverseImpactSnapshot
    parent: AssessmentCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> AssessmentCycle.id; taken from path" }
      - { name: snapshot_type, type: enum, source: input, description: "PROVISIONAL | FINAL — selects calculation variant" }
      - { name: group_breakdowns, type: array, source: computed, description: "Per group_code: {group_code, applicants, selected, selection_rate (4dp, null if excluded), impact_ratio (4dp, null if excluded), excluded_reason (null | INSUFFICIENT_N | NO_SELECTIONS | UNDISCLOSED)}" }
      - { name: highest_rate_group_code, type: string, source: computed, description: "Group with max selection_rate among included groups; ties broken by larger applicants then group_code ASC; null when max_rate == 0 or no included groups" }
      - { name: flagged, type: boolean, source: computed, description: "true iff any included group has impact_ratio < 0.8000 (strictly less; exactly 0.8000 is NOT flagged)" }
      - { name: computed_at, type: datetime, source: system, description: "Logical time of snapshot" }

  - name: RetentionPurgeEvent
    parent: CandidateAssessment
    common_fields: false
    fields:
      - { name: candidate_assessment_id, type: string, source: system, description: "FK -> CandidateAssessment.id" }
      - { name: event_type, type: enum, source: system, description: "ASSESSMENT_PURGED", constraints: "ASSESSMENT_PURGED only" }
      - { name: executed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who ran the sweep" }
      - { name: retention_expires_at_snapshot, type: datetime, source: system, description: "The assessment's retention_expires_at at purge time (audit copy)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AssessmentVendor
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /talent/vendors/{id}/suspend"
        actor: TalentAssessmentAdmin
        preconditions: ["vendor.status == ACTIVE"]
        side_effects:
          - "LINK 1: every AssessmentInstrument with vendor_id==id AND validation_status != RETIRED -> vendor_suspended=true, version+1"
          - "LINK 2 (caused by link 1): every AssessmentCycle whose instrument_id is in that set AND posture IN {SETUP, ACTIVE, SCORING} -> FROZEN, frozen_from_posture=<prior posture>, frozen_reason=VENDOR_HOLD, version+1"
          - "LINK 3 (caused by link 2): every InterviewSession in those cycles with status==SCHEDULED -> CANCELLED, cancellation_reason=VENDOR_HOLD, version+1; each such cancellation debits Interviewer.committed_minutes_total by (scheduled_end - scheduled_start) minutes"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /talent/vendors/{id}/reinstate"
        actor: TalentAssessmentAdmin
        preconditions: ["vendor.status == SUSPENDED"]
        side_effects:
          - "every AssessmentInstrument with vendor_id==id -> vendor_suspended=false, version+1"
          - "every AssessmentCycle FROZEN with frozen_reason==VENDOR_HOLD referencing those instruments -> frozen_from_posture, frozen_from_posture=null, frozen_reason=null, version+1"
          - "Asymmetric compensation: CANCELLED sessions are NOT restored and committed_minutes_total is NOT re-credited"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /talent/vendors/{id}/terminate"
        actor: TalentAssessmentAdmin
        preconditions: ["vendor.status == ACTIVE", "content_copies_outstanding == 0 else ERR_CONTENT_COPIES_OUTSTANDING"]
        side_effects: ["terminated_at = now", "no instrument/cycle cascade (termination blocked while content outstanding; cycles referencing instruments become un-activatable via ERR_VENDOR_NOT_ACTIVE gates)"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /talent/vendors/{id}/terminate"
        actor: TalentAssessmentAdmin
        preconditions: ["vendor.status == SUSPENDED", "content_copies_outstanding == 0 else ERR_CONTENT_COPIES_OUTSTANDING"]
        side_effects: ["terminated_at = now"]

  - entity: AssessmentInstrument
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: VALIDATION_REVIEW
        trigger: "POST /talent/instruments/{id}/submit-validation-review"
        actor: TalentAssessmentAdmin
        preconditions: ["validation_status == DRAFT", "vendor.status == ACTIVE else ERR_VENDOR_NOT_ACTIVE", "at least 1 ValidationEvidence filed else ERR_EVIDENCE_TYPE_MISSING"]
        side_effects: []
      - from: VALIDATION_REVIEW
        to: VALIDATED
        trigger: "POST /talent/instruments/{id}/validate"
        actor: TalentAssessmentAdmin
        preconditions:
          - "validation_status IN {VALIDATION_REVIEW, REVALIDATION}"
          - "vendor.status == ACTIVE else ERR_VENDOR_NOT_ACTIVE"
          - "at least 1 current CRITERION evidence (effective_from <= now AND effective_until > now) else ERR_EVIDENCE_TYPE_MISSING / ERR_EVIDENCE_EXPIRED"
          - "at least 1 current CONTENT evidence else ERR_EVIDENCE_TYPE_MISSING / ERR_EVIDENCE_EXPIRED"
        side_effects: ["validity_expires_at = min(effective_until) over all CURRENT evidence of types CRITERION and CONTENT"]
      - from: REVALIDATION
        to: VALIDATED
        trigger: "POST /talent/instruments/{id}/validate"
        actor: TalentAssessmentAdmin
        preconditions: ["same as VALIDATION_REVIEW -> VALIDATED"]
        side_effects: ["validity_expires_at recomputed as min(effective_until) over current CRITERION+CONTENT evidence"]
      - from: VALIDATED
        to: EXPIRED
        trigger: "system automatic — materialized by POST /talent/_clock/set_current_utc when now > validity_expires_at (strictly greater; at equality still VALIDATED)"
        actor: system
        preconditions: ["now > validity_expires_at"]
        side_effects: ["no cascade to cycles; gating is enforced at cycle create/activate via ERR_INSTRUMENT_NOT_VALIDATED"]
      - from: EXPIRED
        to: REVALIDATION
        trigger: "POST /talent/instruments/{id}/begin-revalidation"
        actor: TalentAssessmentAdmin
        preconditions: ["validation_status == EXPIRED", "at least 1 CRITERION evidence with filed_at > validity_expires_at else ERR_EVIDENCE_TYPE_MISSING"]
        side_effects: []
      - from: DRAFT
        to: RETIRED
        trigger: "POST /talent/instruments/{id}/retire"
        actor: TalentAssessmentAdmin
        preconditions: ["validation_status IN {DRAFT, VALIDATION_REVIEW, REVALIDATION, EXPIRED}", "no AssessmentCycle references this instrument with posture != CLOSED else ERR_INVALID_STATE"]
        side_effects: []
      - from: VALIDATION_REVIEW
        to: RETIRED
        trigger: "POST /talent/instruments/{id}/retire"
        actor: TalentAssessmentAdmin
        preconditions: ["same as DRAFT -> RETIRED"]
        side_effects: []
      - from: REVALIDATION
        to: RETIRED
        trigger: "POST /talent/instruments/{id}/retire"
        actor: TalentAssessmentAdmin
        preconditions: ["same as DRAFT -> RETIRED"]
        side_effects: []
      - from: EXPIRED
        to: RETIRED
        trigger: "POST /talent/instruments/{id}/retire"
        actor: TalentAssessmentAdmin
        preconditions: ["same as DRAFT -> RETIRED"]
        side_effects: []

  - entity: InterviewGuide
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PILOT
        trigger: "POST /talent/interview-guides/{id}/pilot"
        actor: TalentAssessmentAdmin
        preconditions: ["status == DRAFT", "rubric_items >= 2 else ERR_RUBRIC_TOO_FEW_ITEMS", "sum(rubric_items.weight) == 1.0000 (exact 4dp compare) else ERR_RUBRIC_WEIGHT_SUM"]
        side_effects: []
      - from: PILOT
        to: DRAFT
        trigger: "POST /talent/interview-guides/{id}/retract"
        actor: TalentAssessmentAdmin
        preconditions: ["status == PILOT"]
        side_effects: []
      - from: PILOT
        to: APPROVED
        trigger: "POST /talent/interview-guides/{id}/approve"
        actor: TalentAssessmentAdmin
        preconditions:
          - "status == PILOT"
          - "sum(rubric_items.weight) == 1.0000 else ERR_RUBRIC_WEIGHT_SUM"
          - "SoD: X-User-ID != created_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "if supersedes_guide_id is set AND that guide is currently APPROVED -> superseded guide auto-transitions APPROVED -> RETIRED, version+1"
      - from: APPROVED
        to: RETIRED
        trigger: "system automatic — when a superseding guide (supersedes_guide_id == this.id) transitions PILOT -> APPROVED"
        actor: system
        preconditions: ["a guide with supersedes_guide_id == this.id just became APPROVED"]
        side_effects: []
      - from: APPROVED
        to: RETIRED
        trigger: "POST /talent/interview-guides/{id}/retire"
        actor: TalentAssessmentAdmin
        preconditions: ["status IN {DRAFT, PILOT, APPROVED}", "pinned_cycle_count == 0 else ERR_GUIDE_PINNED"]
        side_effects: []
        note: "direct retire of an APPROVED guide is allowed only while no non-CLOSED cycle pins it; supersede-approval retires regardless"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /talent/interview-guides/{id}/retire"
        actor: TalentAssessmentAdmin
        preconditions: ["status IN {DRAFT, PILOT}", "pinned_cycle_count == 0 else ERR_GUIDE_PINNED"]
        side_effects: []
      - from: PILOT
        to: RETIRED
        trigger: "POST /talent/interview-guides/{id}/retire"
        actor: TalentAssessmentAdmin
        preconditions: ["same as DRAFT -> RETIRED"]
        side_effects: []

  - entity: Requisition
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FILLED
        trigger: "system automatic — when a HiringDecision with decision==ADVANCE is created and filled_count becomes >= openings_count"
        actor: system
        preconditions: ["filled_count >= openings_count after the increment"]
        side_effects: ["bubble-up from HiringDecision creation"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /talent/requisitions/{id}/close"
        actor: HiringManager
        preconditions: ["status IN {OPEN, FILLED}", "ownership: requisition.hiring_manager_id == X-User-ID", "all cycles of this requisition have posture == CLOSED else ERR_CYCLE_NOT_CLOSED"]
        side_effects: []
      - from: FILLED
        to: CLOSED
        trigger: "POST /talent/requisitions/{id}/close"
        actor: HiringManager
        preconditions: ["same as OPEN -> CLOSED"]
        side_effects: []

  - entity: AssessmentCycle
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /talent/cycles/{id}/activate"
        actor: HiringManager
        preconditions:
          - "posture == SETUP"
          - "ownership: cycle.requisition.hiring_manager_id == X-User-ID"
          - "requisition.status == OPEN else ERR_REQUISITION_NOT_OPEN"
          - "instrument.validation_status == VALIDATED else ERR_INSTRUMENT_NOT_VALIDATED"
          - "instrument.vendor_suspended == false AND vendor.status == ACTIVE else ERR_VENDOR_NOT_ACTIVE"
          - "guide.status == APPROVED else ERR_GUIDE_NOT_APPROVED"
          - "administration_window_end >= now else ERR_OUTSIDE_ADMINISTRATION_WINDOW"
        side_effects: []
      - from: SETUP
        to: FROZEN
        trigger: "POST /talent/cycles/{id}/freeze (MANUAL, or ADVERSE_IMPACT manual hold) or vendor-suspension cascade (VENDOR_HOLD)"
        actor: ComplianceOfficer | system
        preconditions: ["posture IN {SETUP, ACTIVE, SCORING}"]
        side_effects: ["frozen_from_posture = SETUP", "frozen_reason = MANUAL | VENDOR_HOLD"]
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /talent/cycles/{id}/freeze (MANUAL) | FINAL flagged snapshot (ADVERSE_IMPACT, only when instrument.adverse_impact_monitor_enabled) | vendor cascade (VENDOR_HOLD)"
        actor: ComplianceOfficer | system
        preconditions: ["posture IN {SETUP, ACTIVE, SCORING}"]
        side_effects: ["frozen_from_posture = ACTIVE", "frozen_reason set per trigger"]
      - from: SCORING
        to: FROZEN
        trigger: "POST /talent/cycles/{id}/freeze (MANUAL) | FINAL flagged snapshot (ADVERSE_IMPACT) | vendor cascade (VENDOR_HOLD)"
        actor: ComplianceOfficer | system
        preconditions: ["posture IN {SETUP, ACTIVE, SCORING}"]
        side_effects: ["frozen_from_posture = SCORING", "frozen_reason set per trigger"]
      - from: FROZEN
        to: SETUP
        trigger: "POST /talent/cycles/{id}/unfreeze when frozen_from_posture == SETUP"
        actor: ComplianceOfficer
        preconditions: ["posture == FROZEN", "resolution_note (min 20 chars) provided else ERR_INVALID_REQUEST", "if frozen_reason == ADVERSE_IMPACT: at least one FINAL AdverseImpactSnapshot exists for this cycle else ERR_ADVERSE_IMPACT_UNRESOLVED", "if frozen_reason == VENDOR_HOLD: instrument.vendor_suspended == false AND vendor.status == ACTIVE else ERR_VENDOR_NOT_ACTIVE"]
        side_effects: ["posture = frozen_from_posture", "frozen_from_posture = null", "frozen_reason = null"]
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /talent/cycles/{id}/unfreeze when frozen_from_posture == ACTIVE"
        actor: ComplianceOfficer
        preconditions: ["same as FROZEN -> SETUP"]
        side_effects: ["same as FROZEN -> SETUP"]
      - from: FROZEN
        to: SCORING
        trigger: "POST /talent/cycles/{id}/unfreeze when frozen_from_posture == SCORING"
        actor: ComplianceOfficer
        preconditions: ["same as FROZEN -> SETUP"]
        side_effects: ["same as FROZEN -> SETUP"]
      - from: ACTIVE
        to: SCORING
        trigger: "POST /talent/cycles/{id}/begin-scoring"
        actor: HiringManager
        preconditions: ["posture == ACTIVE", "ownership", "no InterviewSession in this cycle with status == SCHEDULED else ERR_SESSIONS_STILL_SCHEDULED"]
        side_effects: []
      - from: SCORING
        to: DECIDED
        trigger: "system automatic — on HiringDecision creation, when every CandidateAssessment in this cycle with admin_status == COMPLETED has a FINALIZED HiringDecision"
        actor: system
        preconditions: ["posture == SCORING", "count(HiringDecision) == count(CandidateAssessment WHERE admin_status == COMPLETED)"]
        side_effects: []
      - from: SETUP
        to: CLOSED
        trigger: "POST /talent/cycles/{id}/close"
        actor: HiringManager
        preconditions: ["posture IN {SETUP, ACTIVE, FROZEN, SCORING, DECIDED}", "ownership"]
        side_effects:
          - "LINK 1: every CandidateAssessment with admin_status IN {INVITED, SCHEDULED, ACCOMMODATION_HOLD, IN_PROGRESS} -> CANCELLED, feedback_status NOT_SENT -> NOT_APPLICABLE, version+1"
          - "LINK 2 (caused by link 1): each cancellation decrements active_candidate_count by 1 and cancels that candidate's SCHEDULED InterviewSessions in this cycle (cancellation_reason=CYCLE_CLOSED), each debiting Interviewer.committed_minutes_total"
          - "LINK 3 (caused by links 1-2): retention_expires_at recomputed for every assessment without a FINALIZED decision: closed_at + requisition.retention_days"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /talent/cycles/{id}/close"
        actor: HiringManager
        preconditions: ["same as SETUP -> CLOSED"]
        side_effects: ["same chain as SETUP -> CLOSED"]
      - from: FROZEN
        to: CLOSED
        trigger: "POST /talent/cycles/{id}/close"
        actor: HiringManager
        preconditions: ["same as SETUP -> CLOSED"]
        side_effects: ["same chain as SETUP -> CLOSED"]
      - from: SCORING
        to: CLOSED
        trigger: "POST /talent/cycles/{id}/close"
        actor: HiringManager
        preconditions: ["same as SETUP -> CLOSED"]
        side_effects: ["same chain as SETUP -> CLOSED"]
      - from: DECIDED
        to: CLOSED
        trigger: "POST /talent/cycles/{id}/close"
        actor: HiringManager
        preconditions: ["same as SETUP -> CLOSED"]
        side_effects: ["same chain as SETUP -> CLOSED"]

  - entity: Candidate
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /talent/candidates/{id}/withdraw"
        actor: Candidate | HiringManager
        preconditions: ["candidate.status == ACTIVE", "if actor is Candidate: candidate.id == X-User-ID"]
        side_effects:
          - "every CandidateAssessment with candidate_id==id AND admin_status IN {INVITED, SCHEDULED, ACCOMMODATION_HOLD, IN_PROGRESS} -> CANCELLED, feedback_status NOT_SENT -> NOT_APPLICABLE, active_candidate_count of the parent cycle -1"
          - "every InterviewSession with candidate_id==id AND status==SCHEDULED -> CANCELLED (CANDIDATE_WITHDRAWN), committed_minutes_total debited"
          - "every AccommodationRequest of those assessments with status==PENDING -> WITHDRAWN"

  - entity: CandidateAssessment
    dimension: admin_status
    initial_state: INVITED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED, PURGED]
    transitions:
      - from: INVITED
        to: SCHEDULED
        trigger: "POST /talent/assessments/{id}/schedule"
        actor: HiringManager
        preconditions: ["admin_status == INVITED", "cycle posture == ACTIVE else ERR_CYCLE_NOT_ACTIVE / ERR_CYCLE_FROZEN", "ownership"]
        side_effects: ["scheduled_for = input.scheduled_for"]
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /talent/assessments/{id}/start"
        actor: HiringManager
        preconditions: ["admin_status == SCHEDULED", "cycle posture == ACTIVE", "window_start <= now <= effective_end where effective_end = administration_window_end + accommodation_extension_days days (closed interval) else ERR_OUTSIDE_ADMINISTRATION_WINDOW"]
        side_effects: ["started_at = now"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /talent/assessments/{id}/complete"
        actor: HiringManager
        preconditions: ["admin_status == IN_PROGRESS", "cycle posture == ACTIVE", "0 <= raw_score <= instrument.max_score else ERR_SCORE_OUT_OF_RANGE", "window_start <= now <= effective_end (closed interval — exactly effective_end is valid) else ERR_OUTSIDE_ADMINISTRATION_WINDOW"]
        side_effects: ["completed_at = now", "composite_score computed per calculations.candidate_composite_score"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /talent/assessments/{id}/mark-no-show"
        actor: HiringManager
        preconditions: ["admin_status == SCHEDULED", "now > scheduled_for (strictly)"]
        side_effects: ["feedback_status NOT_SENT -> NOT_APPLICABLE"]
      - from: INVITED
        to: CANCELLED
        trigger: "POST /talent/assessments/{id}/cancel | candidate withdraw | cycle close cascade"
        actor: HiringManager | Candidate | system
        preconditions: ["admin_status IN {INVITED, SCHEDULED, ACCOMMODATION_HOLD, IN_PROGRESS}"]
        side_effects: ["active_candidate_count -1", "feedback_status NOT_SENT -> NOT_APPLICABLE", "candidate's SCHEDULED sessions in this cycle -> CANCELLED (MANUAL | CANDIDATE_WITHDRAWN | CYCLE_CLOSED) with committed-minutes debit", "PENDING AccommodationRequests -> WITHDRAWN"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "same as INVITED -> CANCELLED"
        actor: HiringManager | Candidate | system
        preconditions: ["same"]
        side_effects: ["same"]
      - from: ACCOMMODATION_HOLD
        to: CANCELLED
        trigger: "same as INVITED -> CANCELLED"
        actor: HiringManager | Candidate | system
        preconditions: ["same"]
        side_effects: ["same"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "same as INVITED -> CANCELLED"
        actor: HiringManager | Candidate | system
        preconditions: ["same"]
        side_effects: ["same"]
      - from: SCHEDULED
        to: ACCOMMODATION_HOLD
        trigger: "system automatic — when an AccommodationRequest for this assessment is APPROVED while admin_status == SCHEDULED"
        actor: system
        preconditions: ["accommodation APPROVED", "admin_status == SCHEDULED"]
        side_effects: ["accommodation_extension_days += approved_extension_days"]
      - from: INVITED
        to: INVITED
        trigger: "system no-op note — accommodation APPROVED while INVITED only adds extension days, no status change"
        actor: system
        preconditions: ["accommodation APPROVED", "admin_status == INVITED"]
        side_effects: ["accommodation_extension_days += approved_extension_days"]
      - from: ACCOMMODATION_HOLD
        to: SCHEDULED
        trigger: "POST /talent/assessments/{id}/reschedule"
        actor: HiringManager
        preconditions: ["admin_status == ACCOMMODATION_HOLD", "cycle posture == ACTIVE", "ownership"]
        side_effects: ["scheduled_for = input.scheduled_for"]
      - from: COMPLETED
        to: PURGED
        trigger: "POST /talent/retention-sweeps (system-executed per eligible assessment)"
        actor: system
        preconditions: ["admin_status == COMPLETED", "retention_expires_at != null", "now > retention_expires_at (strictly greater; exactly at expiry is still retained)"]
        side_effects:
          - "raw_score = null, composite_score = null, completed_at = null, purged_at = now"
          - "feedback_status NOT_SENT -> NOT_APPLICABLE (SENT remains SENT — parallel dimension untouched)"
          - "LINK: every Scorecard for this (cycle_id, candidate_id) -> redacted = true, ratings = null, weighted_total = null, version+1"
          - "LINK: RetentionPurgeEvent appended (event_type=ASSESSMENT_PURGED, retention_expires_at_snapshot)"
          - "active_candidate_count -1"

  - entity: CandidateAssessment
    dimension: feedback_status
    initial_state: NOT_SENT
    terminal_states: [SENT, NOT_APPLICABLE]
    transitions:
      - from: NOT_SENT
        to: SENT
        trigger: "POST /talent/assessments/{id}/feedback"
        actor: HiringManager
        preconditions:
          - "feedback_status == NOT_SENT else ERR_FEEDBACK_ALREADY_SENT"
          - "admin_status == COMPLETED else ERR_ASSESSMENT_NOT_COMPLETED"
          - "a FINALIZED HiringDecision exists for (cycle_id, candidate_id) else ERR_DECISION_NOT_FINALIZED"
          - "retention_expires_at == null OR now <= retention_expires_at (inclusive — exactly at expiry still allowed) else ERR_RETENTION_EXPIRED"
          - "feedback_text min length 20 else ERR_FEEDBACK_TEXT_TOO_SHORT"
        side_effects: []
      - from: NOT_SENT
        to: NOT_APPLICABLE
        trigger: "system automatic — on admin_status -> CANCELLED | NO_SHOW | PURGED"
        actor: system
        preconditions: ["admin_status transition into {CANCELLED, NO_SHOW, PURGED}"]
        side_effects: []

  - entity: AccommodationRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /talent/accommodation-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "status == PENDING else ERR_ACCOMMODATION_NOT_PENDING"
          - "1 <= approved_extension_days <= requested_extension_days else ERR_EXTENSION_OUT_OF_RANGE"
          - "assessment.admin_status IN {INVITED, SCHEDULED, ACCOMMODATION_HOLD} else ERR_INVALID_STATE"
          - "cycle posture == ACTIVE else ERR_CYCLE_NOT_ACTIVE / ERR_CYCLE_FROZEN"
        side_effects:
          - "decision_note/decided_by_user_id/decided_at set; approved_extension_days = input"
          - "assessment.accommodation_extension_days += approved_extension_days"
          - "if assessment.admin_status == SCHEDULED -> ACCOMMODATION_HOLD (must be rescheduled)"
      - from: PENDING
        to: DENIED
        trigger: "POST /talent/accommodation-requests/{id}/deny"
        actor: ComplianceOfficer
        preconditions: ["status == PENDING else ERR_ACCOMMODATION_NOT_PENDING", "decision_note min length 10"]
        side_effects: ["decision_note/decided_by_user_id/decided_at set"]
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /talent/accommodation-requests/{id}/withdraw | candidate withdraw cascade"
        actor: Candidate | system
        preconditions: ["status == PENDING else ERR_ACCOMMODATION_NOT_PENDING", "if actor is Candidate: assessment.candidate_id == X-User-ID"]
        side_effects: []

  - entity: CalibrationRecord
    initial_state: TRAINED
    terminal_states: []
    transitions:
      - from: TRAINED
        to: CALIBRATED
        trigger: "POST /talent/calibrations/{id}/certify"
        actor: TalentAssessmentAdmin
        preconditions: ["status == TRAINED", "practice_score >= 0.7000 (exactly 0.7000 passes) else ERR_PRACTICE_SCORE_BELOW_THRESHOLD", "guide.status IN {PILOT, APPROVED} else ERR_GUIDE_NOT_APPROVED"]
        side_effects: ["certified_at = now", "practice_score stored"]
      - from: CALIBRATED
        to: LAPSED
        trigger: "system automatic — materialized by clock-set when now > certified_at + 365 days, OR on calibration_index recompute when index < 0.5000"
        actor: system
        preconditions: ["now > certified_at + 365 days (strict; equality stays CALIBRATED) OR calibration_index < 0.5000"]
        side_effects: []
      - from: LAPSED
        to: TRAINED
        trigger: "POST /talent/interviewers/{id}/calibrations (creates a NEW record for the same guide; the LAPSED record remains as history)"
        actor: TalentAssessmentAdmin
        preconditions: ["no other record for (interviewer_id, guide_id) with status IN {TRAINED, CALIBRATED} else ERR_DUPLICATE_CALIBRATION"]
        side_effects: []
        note: "retraining is modeled as creating a fresh record; the LAPSED record stays queryable"

  - entity: InterviewSession
    initial_state: SCHEDULED
    terminal_states: [SCORED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /talent/sessions/{id}/complete"
        actor: HiringManager
        preconditions: ["status == SCHEDULED", "cycle posture == ACTIVE else ERR_CYCLE_NOT_ACTIVE / ERR_CYCLE_FROZEN", "now >= scheduled_end else ERR_SESSION_NOT_ENDED", "ownership"]
        side_effects: ["completed_at = now"]
      - from: COMPLETED
        to: SCORED
        trigger: "system automatic — when a Scorecard for this session is SUBMITTED"
        actor: system
        preconditions: ["scorecard submitted"]
        side_effects: []
      - from: SCORED
        to: COMPLETED
        trigger: "system automatic — when the session's SUBMITTED scorecard is VOIDED (compensation reverts session)"
        actor: system
        preconditions: ["scorecard voided"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /talent/sessions/{id}/cancel | vendor cascade | candidate withdraw cascade | cycle close cascade | assessment cancel cascade"
        actor: HiringManager | system
        preconditions: ["status == SCHEDULED"]
        side_effects: ["cancellation_reason set (MANUAL | VENDOR_HOLD | CANDIDATE_WITHDRAWN | CYCLE_CLOSED)", "Interviewer.committed_minutes_total -= (scheduled_end - scheduled_start) minutes"]
    note: "SCORED is terminal for scoring purposes but reverts to COMPLETED on void; CANCELLED is fully terminal"

  - entity: Scorecard
    initial_state: DRAFT
    terminal_states: [SUBMITTED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /talent/scorecards/{id}/submit"
        actor: Interviewer
        preconditions:
          - "status == DRAFT else ERR_SCORECARD_NOT_DRAFT"
          - "ownership: scorecard.interviewer_id == X-User-ID"
          - "session.status == COMPLETED else ERR_SESSION_NOT_COMPLETED"
          - "cycle posture IN {ACTIVE, SCORING} (FROZEN -> ERR_CYCLE_FROZEN; others -> ERR_CYCLE_NOT_ACTIVE)"
          - "now <= session.completed_at + 72 hours (inclusive) else ERR_SCORECARD_WINDOW_CLOSED"
        side_effects:
          - "submitted_at = now; weighted_total computed (sum weight_c * rating_c / scale_max_c, 4dp)"
          - "session COMPLETED -> SCORED"
          - "CandidateAssessment.composite_score recomputed"
          - "calibration_index recomputed for the author's CalibrationRecord AND for every other interviewer with a SUBMITTED scorecard on the same (cycle_id, candidate_id) (panel-mean inputs changed); any CALIBRATED record whose index drops < 0.5000 -> LAPSED"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /talent/scorecards/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED else ERR_SCORECARD_NOT_SUBMITTED"
          - "no FINALIZED HiringDecision exists for (cycle_id, candidate_id) else ERR_DECISION_ALREADY_FINALIZED"
          - "void_reason min length 20 else ERR_INVALID_REQUEST"
        side_effects:
          - "voided_at = now; void_reason stored"
          - "session SCORED -> COMPLETED"
          - "CandidateAssessment.composite_score recomputed (becomes null when no SUBMITTED scorecards remain and raw_score absent; otherwise formula over remaining set)"
          - "calibration_index recomputed for affected interviewers"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — state precondition conflicts live in §1.2/§1.4)
# =============================================================================
concurrency_rules:
  - rule_id: cycle-patch-stale-version
    parent_entity: AssessmentCycle
    write_endpoint: "PATCH /talent/cycles/{id}"
    occ_field: expected_cycle_version
    description: |
      Updating a SETUP cycle's window/capacity with an expected_cycle_version
      that no longer matches the cycle's current version is rejected. This
      captures the case where another writer has modified the cycle since the
      client last read it, so the client's view of the configuration is stale.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
  - rule_id: guide-supersede-stale-head
    parent_entity: InterviewGuide
    write_endpoint: "POST /talent/interview-guides/{id}/revisions"
    occ_field: expected_superseded_guide_version
    description: |
      Creating a revision guide with supersedes_guide_id whose version has
      advanced since the client last observed it is rejected. A supersede
      legitimately replaces the current head (setting superseded_by_guide_id
      and bumping the superseded guide's version), so a writer whose observed
      version is stale is authoring against an out-of-date head and must
      re-read before revising.
    error_id: ERR_STALE_GUIDE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: adverse_impact_ratio
    trigger: "POST /talent/cycles/{id}/adverse-impact-snapshots (runs at snapshot creation; result persisted on AdverseImpactSnapshot)"
    algorithm: threshold
    formula: |
      # ROUNDING ORDER IS PINNED: per-group rates are rounded to 4dp FIRST;
      # the impact ratio divides the ROUNDED rates and is rounded again.
      # Dividing unrounded values yields different 4th-decimal results.
      for each group g in {GROUP_A, GROUP_B, GROUP_C, GROUP_D}:
        applicants_g = count(CandidateAssessment in cycle, candidate.group_code == g,
                             admin_status IN variant_applicant_set)
        selected_g   = count over those applicants of variant_selection_predicate
        if applicants_g < MIN_GROUP_N: selection_rate_g = null, impact_ratio_g = null,
                                       excluded_reason_g = INSUFFICIENT_N; continue
        selection_rate_g = round_half_up(selected_g / applicants_g, 4)
      max_rate = max over included selection_rate_g
      highest_rate_group_code: argmax selection_rate_g; tie-break: larger applicants_g;
                               further tie: group_code ASC (lexicographic). Never id-based.
      if max_rate == 0.0000:
        every included group: impact_ratio_g = null, excluded_reason_g = NO_SELECTIONS
        flagged = false; highest_rate_group_code = null
      else:
        impact_ratio_g = round_half_up(selection_rate_g / max_rate, 4)
        flagged = any included group with impact_ratio_g < FOUR_FIFTHS_THRESHOLD
                  (strictly less; impact_ratio == 0.8000 exactly is NOT flagged)
      Candidates with group_code == UNDISCLOSED are excluded from every denominator and
      reported as a separate breakdown entry with excluded_reason = UNDISCLOSED.
    input_set: |
      CandidateAssessments of the cycle joined to Candidate.group_code.
      PROVISIONAL variant: admin_status IN {SCHEDULED, ACCOMMODATION_HOLD, IN_PROGRESS, COMPLETED, NO_SHOW}
      (INVITED/CANCELLED/PURGED excluded — never presented or removed before presentation).
      FINAL variant: admin_status == COMPLETED only.
    constants:
      FOUR_FIFTHS_THRESHOLD: 0.8000
      MIN_GROUP_N: 2
      PROJECTED_SELECTION_COMPOSITE: 0.7000
    precision: "4 decimal places, round_half_up; round per-group rate THEN divide THEN round ratio"
    variants:
      - name: PROVISIONAL
        when: "snapshot_type == PROVISIONAL"
        difference: "applicants = admin_status IN {SCHEDULED, ACCOMMODATION_HOLD, IN_PROGRESS, COMPLETED, NO_SHOW}; selected = FINALIZED decisions with decision==ADVANCE plus COMPLETED assessments with composite_score >= 0.7000 (projected selections, decision not yet made)"
      - name: FINAL
        when: "snapshot_type == FINAL"
        difference: "applicants = admin_status == COMPLETED only; selected = FINALIZED decisions with decision==ADVANCE only; a flagged FINAL snapshot freezes the cycle (unless instrument.adverse_impact_monitor_enabled == false)"

  - name: candidate_composite_score
    trigger: "on CandidateAssessment complete; on any Scorecard submit/void for that (cycle_id, candidate_id)"
    algorithm: weighted_scoring
    formula: |
      # Inputs: pinned guide rubric_items, SUBMITTED non-VOIDED scorecards, raw_score,
      # instrument pass_floor/max_score. Nested min/max (clamp) + conditional
      # renormalization when some competencies are unrated => non-linear.
      scorecards = Scorecards WHERE candidate_id, session.cycle_id == assessment.cycle_id,
                    session.guide_id == cycle.guide_id, status == SUBMITTED
      for each competency c in cycle.guide.rubric_items:
        n_c = count of those scorecards rating c
        if n_c > 0: mean_c = round_half_up(sum(rating_c) / n_c, 4)
      coverage = sum(weight_c over c where n_c >= 1)
      if coverage == 0: guide_component = 0
      else: guide_component = sum(weight_c * mean_c / scale_max_c over rated c) / coverage
      # ^ renormalized over covered weights only (partial coverage allowed)
      assessment_component = min(1, max(0, (raw_score - instrument.pass_floor)
                                        / (instrument.max_score - instrument.pass_floor)))
      composite_score = round_half_up(0.6 * guide_component
                                      + 0.4 * assessment_component, 4)
      composite is non-null iff admin_status == COMPLETED; purge resets it to null.
    input_set: "SUBMITTED (non-VOIDED) Scorecards for the candidate within the same cycle whose session.guide_id equals the cycle's pinned guide_id; DRAFT/VOIDED excluded"
    constants:
      GUIDE_WEIGHT: 0.6
      ASSESSMENT_WEIGHT: 0.4
    precision: "4 decimal places, round_half_up at each pinned step (mean_c, final composite)"

  - name: decision_quorum_gate
    trigger: "POST /talent/cycles/{id}/decisions (evaluated before creation)"
    algorithm: constraint_propagation
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY, EVALUATION ORDER PINNED:
      # (1) sessions_evaluated := InterviewSessions for (cycle_id, candidate_id)
      #     with status IN {COMPLETED, SCORED}   (voided scorecards revert their
      #     session SCORED -> COMPLETED, so the session REMAINS in the set)
      # (2) required := max(MIN_QUORUM, min(MAX_QUORUM, count(sessions_evaluated)))
      # (3) submitted := count(Scorecard WHERE session IN sessions_evaluated
      #     AND status == SUBMITTED)             (VOIDED excluded)
      # (4) quorum_met := submitted >= required
      # Because step (1) runs before step (3), voiding a scorecard shrinks
      # `submitted` but NOT `required` — a decision that was about to pass can
      # become blocked without the session set changing.
    input_set: "InterviewSessions + Scorecards for (cycle_id, candidate_id)"
    constants:
      MIN_QUORUM: 2
      MAX_QUORUM: 3
    precision: "integer counts; comparison is submitted >= required (exactly equal passes)"

  - name: interviewer_calibration_index
    trigger: "recomputed on every Scorecard submit/void touching the same (cycle_id, candidate_id); read on GET /talent/calibrations/{id}"
    algorithm: aggregation
    formula: |
      # Panel-deviation agreement index for (interviewer I, guide G).
      pairs = for each Scorecard s (status == SUBMITTED, s.interviewer_id == I,
              session.guide_id == G): for each rated competency c:
                peer_mean = mean rating of c over SUBMITTED scorecards by OTHER
                            interviewers for the same (session.cycle_id, session.candidate_id)
                if peers exist: deviation = s.rating_c - peer_mean
      if no pairs: calibration_index = null
      mean_abs_dev = mean(|deviation|) over all pairs
      scale = max(scale_max over G.rubric_items) - 1
      RAW:              index = round_half_up(1 - min(mean_abs_dev / scale, 1), 4)
      LENIENCY_ADJUSTED: own_mean = mean of I's ratings in pairs
                        cohort_mean = mean of ALL ratings in pairs (I + peers)
                        leniency = min(|own_mean - cohort_mean| / scale, 1)
                        index = round_half_up((1 - min(mean_abs_dev/scale, 1))
                                              * (1 - 0.5 * leniency), 4)
      Recompute side effect: CALIBRATED record with index < LAPSE_FLOOR -> LAPSED.
    input_set: "SUBMITTED non-VOIDED Scorecards by the interviewer on sessions whose guide_id == record.guide_id, joined with peer scorecards on the same (cycle_id, candidate_id)"
    constants:
      CALIBRATED_THRESHOLD: 0.7000
      LAPSE_FLOOR: 0.5000
      LENIENCY_PENALTY_FACTOR: 0.5
    precision: "4 decimal places, round_half_up"
    variants:
      - name: RAW
        when: "guide.scoring_mode == RAW"
        difference: "pure agreement: 1 - min(mean_abs_dev/scale, 1)"
      - name: LENIENCY_ADJUSTED
        when: "guide.scoring_mode == LENIENCY_ADJUSTED"
        difference: "multiplies the RAW index by (1 - 0.5*leniency) — identical scorecard data yields a strictly lower index whenever the interviewer deviates from the cohort mean"

  - name: retention_expiry
    trigger: "on HiringDecision creation (anchor = finalized_at); on AssessmentCycle close (anchor = closed_at for assessments without decisions); consulted by feedback and retention sweep"
    algorithm: threshold
    formula: |
      retention_expires_at = anchor + requisition.retention_days days
      anchor = decision.finalized_at if a FINALIZED HiringDecision exists
               else cycle.closed_at if cycle.posture == CLOSED
               else null (not yet purgeable; feedback also blocked by ERR_DECISION_NOT_FINALIZED)
      feedback gate: now <= retention_expires_at   (INCLUSIVE: exactly at expiry allowed)
      purge gate:    now >  retention_expires_at   (STRICT: exactly at expiry NOT purged)
    input_set: "CandidateAssessments with admin_status == COMPLETED and retention_expires_at != null"
    constants:
      DEFAULT_RETENTION_DAYS: 730
    precision: "second-precision datetime comparison"

  - name: interviewer_committed_minutes
    trigger: "on InterviewSession create (SCHEDULED) and on any transition SCHEDULED -> CANCELLED"
    algorithm: aggregation
    formula: |
      committed_minutes_total = sum over InterviewSessions
        WHERE interviewer_id == I AND status == SCHEDULED
        of (scheduled_end - scheduled_start) in whole minutes
      create: +duration; cancel (any reason incl. cascades): -duration.
      INVARIANT: book(SCHEDULED) then cancel returns committed_minutes_total to its
      prior value exactly — compensating action leaves the conserved quantity unchanged.
    input_set: "InterviewSessions with status == SCHEDULED for the interviewer"
    constants: {}
    precision: "integer minutes"

  - name: vendor_content_ledger
    trigger: "on POST /talent/vendors/{id}/content-ledger-events"
    algorithm: aggregation
    formula: |
      content_copies_outstanding = sum(copies WHERE direction == DISTRIBUTE)
                                 - sum(copies WHERE direction == DESTROY)
      Constraint at write time: a DESTROY event with copies > current
      content_copies_outstanding is rejected (ERR_CONTENT_LEDGER_NEGATIVE).
      INVARIANT: DISTRIBUTE n followed by DESTROY n leaves
      content_copies_outstanding unchanged. terminate requires outstanding == 0.
    input_set: "ContentLedgerEvents for the vendor (append-only)"
    constants: {}
    precision: "integer copies"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when a
# request violates several rules; this order is normative for dual-failure tests)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role; for entity_backed roles X-User-ID must reference an existing instance of the backing entity", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path-template ids resolve left-to-right (e.g. /requisitions/{rid}/cycles: requisition first); unknown id -> 404", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Body foreign-key references resolve, left-to-right in declared input order (e.g. instrument_id before guide_id)", error_id: ERR_REFERENCED_ENTITY_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "Ownership: HiringManager owns requisition via hiring_manager_id (all child-cycle operations); Interviewer owns session/scorecard via interviewer_id; Candidate owns assessment via candidate_id; VendorRepresentative owns vendor via vendor id", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "all ownership-scoped endpoints" }
  - { priority: 6, category: state, check: "Target resource's own state permits the operation (from-state of the transition; terminal lockdown)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action/transition endpoints" }
  - { priority: 7, category: state, check: "Specific state gates with dedicated codes: cycle posture must admit the operation", error_id: ERR_CYCLE_NOT_ACTIVE, http_status: 409, applies_to: "POST /talent/assessments/{id}/schedule, /start, /complete, /reschedule; POST /talent/cycles/{id}/sessions; POST /talent/sessions/{id}/complete" }
  - { priority: 7, category: state, check: "Cycle is FROZEN (distinct code so callers can distinguish a freeze from a wrong-stage rejection)", error_id: ERR_CYCLE_FROZEN, http_status: 409, applies_to: "all child operations gated by posture when posture == FROZEN" }
  - { priority: 7, category: state, check: "Requisition must be OPEN for cycle create/activate and decision creation", error_id: ERR_REQUISITION_NOT_OPEN, http_status: 409, applies_to: "POST /talent/requisitions/{id}/cycles, POST /talent/cycles/{id}/activate, POST /talent/cycles/{id}/decisions" }
  - { priority: 7, category: state, check: "Candidate status must be ACTIVE for invitation/withdraw", error_id: ERR_CANDIDATE_WITHDRAWN, http_status: 409, applies_to: "POST /talent/cycles/{id}/invitations, POST /talent/candidates/{id}/withdraw" }
  - { priority: 7, category: state, check: "Scorecard source-state checks", error_id: ERR_SCORECARD_NOT_DRAFT, http_status: 409, applies_to: "POST /talent/scorecards/{id}/submit" }
  - { priority: 7, category: state, check: "Scorecard must be SUBMITTED to void", error_id: ERR_SCORECARD_NOT_SUBMITTED, http_status: 409, applies_to: "POST /talent/scorecards/{id}/void" }
  - { priority: 7, category: state, check: "Session must be COMPLETED for scorecard creation", error_id: ERR_SESSION_NOT_COMPLETED, http_status: 409, applies_to: "POST /talent/sessions/{id}/scorecards" }
  - { priority: 7, category: state, check: "Accommodation must be PENDING to decide/withdraw", error_id: ERR_ACCOMMODATION_NOT_PENDING, http_status: 409, applies_to: "POST /talent/accommodation-requests/{id}/approve|deny|withdraw" }
  - { priority: 7, category: state, check: "Assessment must be COMPLETED for feedback and for session scheduling of interviews only where required (sessions additionally require COMPLETED assessment)", error_id: ERR_ASSESSMENT_NOT_COMPLETED, http_status: 409, applies_to: "POST /talent/assessments/{id}/feedback, POST /talent/cycles/{id}/sessions, POST /talent/cycles/{id}/decisions" }
  - { priority: 7, category: state, check: "Terminal-state lockdown on vendors", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "POST /talent/vendors/{id}/suspend|reinstate|terminate, POST /talent/vendors/{id}/content-ledger-events" }
  - { priority: 8, category: state, check: "OCC: expected_cycle_version == AssessmentCycle.version", error_id: ERR_STALE_CYCLE_VERSION, http_status: 412, applies_to: "PATCH /talent/cycles/{id}" }
  - { priority: 8, category: state, check: "OCC: expected_superseded_guide_version == superseded guide's current version", error_id: ERR_STALE_GUIDE_VERSION, http_status: 412, applies_to: "POST /talent/interview-guides/{id}/revisions" }
  - { priority: 9, category: business_safety, check: "SoD: guide approver X-User-ID != guide.created_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /talent/interview-guides/{id}/approve" }
  - { priority: 9, category: business_safety, check: "SoD: decision officer X-User-ID must not equal the interviewer_id of any SUBMITTED scorecard counted toward that candidate's quorum", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /talent/cycles/{id}/decisions" }
  - { priority: 9, category: business_safety, check: "Interviewer holds a CALIBRATED CalibrationRecord for the cycle's pinned guide_id", error_id: ERR_INTERVIEWER_NOT_CALIBRATED, http_status: 422, applies_to: "POST /talent/cycles/{id}/sessions" }
  - { priority: 9, category: business_safety, check: "Vendor status == ACTIVE (and instrument.vendor_suspended == false) for instrument lifecycle progression, cycle create/activate, content DISTRIBUTE", error_id: ERR_VENDOR_NOT_ACTIVE, http_status: 422, applies_to: "POST /talent/instruments (vendor check), /submit-validation-review, /validate, POST /talent/requisitions/{id}/cycles, POST /talent/cycles/{id}/activate, POST /talent/vendors/{id}/content-ledger-events (DISTRIBUTE), POST /talent/cycles/{id}/unfreeze (VENDOR_HOLD)" }
  - { priority: 9, category: business_safety, check: "Instrument must be VALIDATED at cycle create/activate", error_id: ERR_INSTRUMENT_NOT_VALIDATED, http_status: 422, applies_to: "POST /talent/requisitions/{id}/cycles, POST /talent/cycles/{id}/activate" }
  - { priority: 9, category: business_safety, check: "Guide must be APPROVED at cycle create/activate; PILOT or APPROVED for certify", error_id: ERR_GUIDE_NOT_APPROVED, http_status: 422, applies_to: "POST /talent/requisitions/{id}/cycles, POST /talent/cycles/{id}/activate, POST /talent/calibrations/{id}/certify" }
  - { priority: 9, category: business_safety, check: "Supersede target guide must be APPROVED", error_id: ERR_GUIDE_NOT_APPROVED, http_status: 422, applies_to: "POST /talent/interview-guides/{id}/revisions" }
  - { priority: 9, category: business_safety, check: "ADVERSE_IMPACT unfreeze requires an existing FINAL snapshot", error_id: ERR_ADVERSE_IMPACT_UNRESOLVED, http_status: 422, applies_to: "POST /talent/cycles/{id}/unfreeze" }
  - { priority: 10, category: business_constraint, check: "Uniqueness: (vendor_id, instrument code); candidate external_ref; (cycle_id, candidate_id) invitation; one non-VOIDED scorecard per session; one decision per (cycle_id, candidate_id); one open calibration per (interviewer, guide); one PENDING accommodation per assessment", error_id: ERR_DUPLICATE_INSTRUMENT_CODE, http_status: 409, applies_to: "POST /talent/instruments" }
  - { priority: 10, category: business_constraint, check: "Candidate external_ref unique", error_id: ERR_DUPLICATE_CANDIDATE_REF, http_status: 409, applies_to: "POST /talent/candidates" }
  - { priority: 10, category: business_constraint, check: "Duplicate invitation", error_id: ERR_DUPLICATE_INVITATION, http_status: 409, applies_to: "POST /talent/cycles/{id}/invitations" }
  - { priority: 10, category: business_constraint, check: "Second non-VOIDED scorecard on same session", error_id: ERR_DUPLICATE_SCORECARD, http_status: 409, applies_to: "POST /talent/sessions/{id}/scorecards" }
  - { priority: 10, category: business_constraint, check: "Second decision for same (cycle, candidate)", error_id: ERR_DECISION_ALREADY_FINALIZED, http_status: 409, applies_to: "POST /talent/cycles/{id}/decisions, POST /talent/scorecards/{id}/void (blocked-after-decision)" }
  - { priority: 10, category: business_constraint, check: "Open calibration record already exists for (interviewer, guide)", error_id: ERR_DUPLICATE_CALIBRATION, http_status: 409, applies_to: "POST /talent/interviewers/{id}/calibrations" }
  - { priority: 10, category: business_constraint, check: "Second PENDING accommodation on same assessment", error_id: ERR_PENDING_ACCOMMODATION_EXISTS, http_status: 409, applies_to: "POST /talent/assessments/{id}/accommodation-requests" }
  - { priority: 10, category: business_constraint, check: "Rubric structural rules: >= 2 items; codes unique; each weight in (0,1]; sum of weights == 1.0000 (4dp exact)", error_id: ERR_RUBRIC_WEIGHT_SUM, http_status: 400, applies_to: "POST /talent/interview-guides, POST /talent/interview-guides/{id}/pilot, /approve" }
  - { priority: 10, category: business_constraint, check: "Fewer than 2 rubric items", error_id: ERR_RUBRIC_TOO_FEW_ITEMS, http_status: 400, applies_to: "POST /talent/interview-guides, POST /talent/interview-guides/{id}/pilot" }
  - { priority: 10, category: business_constraint, check: "Interviewer double-booking on HALF-OPEN intervals [start, end): conflict iff new.start < existing.end AND new.end > existing.start over sessions with status IN {SCHEDULED, COMPLETED, SCORED}; adjacency (new.start == existing.end) is allowed", error_id: ERR_INTERVIEWER_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /talent/cycles/{id}/sessions" }
  - { priority: 10, category: business_constraint, check: "Cycle daily capacity (AGGREGATE semantics): count of sessions in this cycle on the UTC calendar day of scheduled_start with status IN {SCHEDULED, COMPLETED, SCORED} must be < max_sessions_per_day; the session that would make the count equal max+1 is rejected even with zero pairwise overlap", error_id: ERR_CYCLE_DAILY_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /talent/cycles/{id}/sessions" }
  - { priority: 10, category: business_constraint, check: "Session duration 15..240 minutes inclusive; scheduled_end > scheduled_start", error_id: ERR_SESSION_DURATION_INVALID, http_status: 400, applies_to: "POST /talent/cycles/{id}/sessions" }
  - { priority: 10, category: business_constraint, check: "Administration window field order: window_start < window_end", error_id: ERR_WINDOW_ORDER_INVALID, http_status: 400, applies_to: "POST /talent/requisitions/{id}/cycles, PATCH /talent/cycles/{id}" }
  - { priority: 10, category: business_constraint, check: "Ratings: >= 1 item; competency_code exists in pinned guide rubric and unique within scorecard; rating integer 1..item.scale_max", error_id: ERR_RATINGS_EMPTY, http_status: 400, applies_to: "POST /talent/sessions/{id}/scorecards" }
  - { priority: 10, category: business_constraint, check: "Competency code not in pinned guide rubric (or duplicated)", error_id: ERR_RATING_COMPETENCY_MISMATCH, http_status: 400, applies_to: "POST /talent/sessions/{id}/scorecards" }
  - { priority: 10, category: business_constraint, check: "Rating outside 1..scale_max", error_id: ERR_RATING_OUT_OF_RANGE, http_status: 400, applies_to: "POST /talent/sessions/{id}/scorecards" }
  - { priority: 10, category: business_constraint, check: "Decision quorum: submitted >= required per calculations.decision_quorum_gate", error_id: ERR_QUORUM_NOT_MET, http_status: 422, applies_to: "POST /talent/cycles/{id}/decisions" }
  - { priority: 10, category: business_constraint, check: "Content ledger: DESTROY copies <= content_copies_outstanding", error_id: ERR_CONTENT_LEDGER_NEGATIVE, http_status: 422, applies_to: "POST /talent/vendors/{id}/content-ledger-events" }
  - { priority: 10, category: business_constraint, check: "Vendor terminate requires content_copies_outstanding == 0", error_id: ERR_CONTENT_COPIES_OUTSTANDING, http_status: 422, applies_to: "POST /talent/vendors/{id}/terminate" }
  - { priority: 10, category: business_constraint, check: "begin-scoring requires zero SCHEDULED sessions in cycle", error_id: ERR_SESSIONS_STILL_SCHEDULED, http_status: 409, applies_to: "POST /talent/cycles/{id}/begin-scoring" }
  - { priority: 10, category: business_constraint, check: "Requisition close requires all cycles CLOSED", error_id: ERR_CYCLE_NOT_CLOSED, http_status: 409, applies_to: "POST /talent/requisitions/{id}/close" }
  - { priority: 10, category: business_constraint, check: "Guide retire requires pinned_cycle_count == 0", error_id: ERR_GUIDE_PINNED, http_status: 409, applies_to: "POST /talent/interview-guides/{id}/retire" }
  - { priority: 11, category: business_temporal, check: "Assessment start/complete within CLOSED window [window_start, window_end + accommodation_extension_days]; exactly at effective end is valid", error_id: ERR_OUTSIDE_ADMINISTRATION_WINDOW, http_status: 422, applies_to: "POST /talent/assessments/{id}/start, /complete" }
  - { priority: 11, category: business_temporal, check: "Session must fit inside the cycle administration window (closed): window_start <= scheduled_start AND scheduled_end <= window_end", error_id: ERR_OUTSIDE_ADMINISTRATION_WINDOW, http_status: 422, applies_to: "POST /talent/cycles/{id}/sessions" }
  - { priority: 11, category: business_temporal, check: "Session complete only at/after scheduled_end", error_id: ERR_SESSION_NOT_ENDED, http_status: 422, applies_to: "POST /talent/sessions/{id}/complete" }
  - { priority: 11, category: business_temporal, check: "Scorecard submit within 72h of session.completed_at (inclusive)", error_id: ERR_SCORECARD_WINDOW_CLOSED, http_status: 422, applies_to: "POST /talent/scorecards/{id}/submit" }
  - { priority: 11, category: business_temporal, check: "Feedback only while now <= retention_expires_at", error_id: ERR_RETENTION_EXPIRED, http_status: 422, applies_to: "POST /talent/assessments/{id}/feedback" }
  - { priority: 11, category: business_temporal, check: "Validate requires CURRENT evidence (effective_until > now); expired-only evidence of a required type", error_id: ERR_EVIDENCE_EXPIRED, http_status: 422, applies_to: "POST /talent/instruments/{id}/validate" }
  - { priority: 11, category: business_temporal, check: "Cycle activate requires administration_window_end >= now", error_id: ERR_OUTSIDE_ADMINISTRATION_WINDOW, http_status: 422, applies_to: "POST /talent/cycles/{id}/activate" }
  - { priority: 12, category: business_referential, check: "Session guide_id must equal the cycle's pinned guide_id (version pinning)", error_id: ERR_GUIDE_VERSION_MISMATCH, http_status: 422, applies_to: "POST /talent/cycles/{id}/sessions" }
  - { priority: 13, category: business_safety, check: "Required evidence types present at validate/review progression (missing CRITERION or CONTENT type entirely)", error_id: ERR_EVIDENCE_TYPE_MISSING, http_status: 422, applies_to: "POST /talent/instruments/{id}/submit-validation-review, /validate, /begin-revalidation" }
  - { priority: 14, category: business_constraint, check: "Practice score at certify >= 0.7000 (boundary inclusive)", error_id: ERR_PRACTICE_SCORE_BELOW_THRESHOLD, http_status: 422, applies_to: "POST /talent/calibrations/{id}/certify" }
  - { priority: 15, category: business_constraint, check: "approved_extension_days within 1..requested_extension_days", error_id: ERR_EXTENSION_OUT_OF_RANGE, http_status: 400, applies_to: "POST /talent/accommodation-requests/{id}/approve" }
  - { priority: 16, category: business_constraint, check: "rationale >= 50 chars; feedback_text >= 20; void_reason >= 20; justification >= 20; ledger note >= 10; resolution_note >= 20; missing/invalid scalar fields or enum values", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 16, category: business_constraint, check: "Decision rationale length", error_id: ERR_RATIONALE_TOO_SHORT, http_status: 400, applies_to: "POST /talent/cycles/{id}/decisions" }
  - { priority: 16, category: business_constraint, check: "Feedback text length", error_id: ERR_FEEDBACK_TEXT_TOO_SHORT, http_status: 400, applies_to: "POST /talent/assessments/{id}/feedback" }
  - { priority: 16, category: business_constraint, check: "raw_score within 0..instrument.max_score", error_id: ERR_SCORE_OUT_OF_RANGE, http_status: 400, applies_to: "POST /talent/assessments/{id}/complete" }
  - { priority: 16, category: business_constraint, check: "Second feedback on same assessment", error_id: ERR_FEEDBACK_ALREADY_SENT, http_status: 409, applies_to: "POST /talent/assessments/{id}/feedback" }
  - { priority: 17, category: state, check: "Decision creation requires an existing FINALIZED decision NOT to exist and assessment COMPLETED; feedback requires decision FINALIZED", error_id: ERR_DECISION_NOT_FINALIZED, http_status: 409, applies_to: "POST /talent/assessments/{id}/feedback" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Vendors & content security ----
  - { method: POST, path: "/talent/vendors", description: "Register assessment vendor", roles: [TalentAssessmentAdmin], code: 201, input: [name, "security_clearance_tier?"], output: AssessmentVendor, side_effects: ["status=ACTIVE", "content_copies_outstanding=0"] }
  - { method: GET, path: "/talent/vendors/{id}", description: "Read vendor incl. content_copies_outstanding ledger", roles: [TalentAssessmentAdmin, ComplianceOfficer, VendorRepresentative], code: 200, input: [], output: AssessmentVendor, side_effects: ["VendorRepresentative: id must equal X-User-ID else ERR_OWNERSHIP_MISMATCH"] }
  - { method: GET, path: "/talent/vendors/{id}/instruments", description: "List instruments of a vendor (FK reverse)", roles: [TalentAssessmentAdmin, ComplianceOfficer, VendorRepresentative, HiringManager], code: 200, input: [], output: "AssessmentInstrument[]", side_effects: [] }
  - { method: GET, path: "/talent/vendors/{id}/content-ledger-events", description: "List content ledger events of a vendor (FK reverse)", roles: [TalentAssessmentAdmin, ComplianceOfficer, VendorRepresentative], code: 200, input: [], output: "ContentLedgerEvent[]", side_effects: ["VendorRepresentative: ownership check"] }
  - { method: POST, path: "/talent/vendors/{id}/suspend", description: "Suspend vendor — depth-3 cascade (instruments flagged -> cycles FROZEN -> sessions CANCELLED)", roles: [TalentAssessmentAdmin], code: 200, input: [], output: AssessmentVendor, side_effects: ["see state_machines.AssessmentVendor ACTIVE->SUSPENDED"] }
  - { method: POST, path: "/talent/vendors/{id}/reinstate", description: "Reinstate vendor; cycles with VENDOR_HOLD unfreeze; cancelled sessions NOT restored", roles: [TalentAssessmentAdmin], code: 200, input: [], output: AssessmentVendor, side_effects: ["see state_machines.AssessmentVendor SUSPENDED->ACTIVE"] }
  - { method: POST, path: "/talent/vendors/{id}/terminate", description: "Terminate vendor; requires content_copies_outstanding == 0", roles: [TalentAssessmentAdmin], code: 200, input: [], output: AssessmentVendor, side_effects: ["terminated_at = now"] }
  - { method: POST, path: "/talent/vendors/{id}/content-ledger-events", description: "Append content chain-of-custody event; DISTRIBUTE requires vendor ACTIVE and role TalentAssessmentAdmin; DESTROY allowed for VendorRepresentative of this vendor (or admin) in ACTIVE|SUSPENDED", roles: [TalentAssessmentAdmin, VendorRepresentative], code: 201, input: [direction, copies, note], output: ContentLedgerEvent, side_effects: ["content_copies_outstanding += copies (DISTRIBUTE) | -= copies (DESTROY, rejected if it would go negative)"] }

  # ---- Instruments & validation evidence ----
  - { method: POST, path: "/talent/instruments", description: "Register instrument under a vendor", roles: [TalentAssessmentAdmin], code: 201, input: [vendor_id, code, instrument_type, title, max_score, pass_floor, "adverse_impact_monitor_enabled?"], output: AssessmentInstrument, side_effects: ["validation_status=DRAFT", "vendor must be ACTIVE else ERR_VENDOR_NOT_ACTIVE"] }
  - { method: GET, path: "/talent/instruments", description: "List instruments (filtered list covers vendor_id FK reverse)", roles: [TalentAssessmentAdmin, ComplianceOfficer, VendorRepresentative, HiringManager], code: 200, input: [ "vendor_id?", "validation_status?", "limit?", "offset?"], output: "AssessmentInstrument[]", side_effects: [] }
  - { method: GET, path: "/talent/instruments/{id}", description: "Read instrument", roles: [TalentAssessmentAdmin, ComplianceOfficer, VendorRepresentative, HiringManager], code: 200, input: [], output: AssessmentInstrument, side_effects: [] }
  - { method: POST, path: "/talent/instruments/{id}/submit-validation-review", description: "DRAFT -> VALIDATION_REVIEW", roles: [TalentAssessmentAdmin], code: 200, input: [], output: AssessmentInstrument, side_effects: [] }
  - { method: POST, path: "/talent/instruments/{id}/validate", description: "VALIDATION_REVIEW|REVALIDATION -> VALIDATED; sets validity_expires_at = min(effective_until) over current CRITERION+CONTENT evidence", roles: [TalentAssessmentAdmin], code: 200, input: [], output: AssessmentInstrument, side_effects: ["validity_expires_at computed"] }
  - { method: POST, path: "/talent/instruments/{id}/begin-revalidation", description: "EXPIRED -> REVALIDATION; requires CRITERION evidence filed after validity_expires_at", roles: [TalentAssessmentAdmin], code: 200, input: [], output: AssessmentInstrument, side_effects: [] }
  - { method: POST, path: "/talent/instruments/{id}/retire", description: "-> RETIRED (terminal) from DRAFT|VALIDATION_REVIEW|REVALIDATION|EXPIRED; blocked while non-CLOSED cycles reference it", roles: [TalentAssessmentAdmin], code: 200, input: [], output: AssessmentInstrument, side_effects: [] }
  - { method: POST, path: "/talent/instruments/{id}/evidence", description: "File validation evidence (immutable once filed)", roles: [TalentAssessmentAdmin, VendorRepresentative], code: 201, input: [evidence_type, title, issuer, effective_from, effective_until], output: ValidationEvidence, side_effects: ["VendorRepresentative: instrument.vendor_id must equal X-User-ID", "filed_at = now"] }
  - { method: GET, path: "/talent/instruments/{id}/evidence", description: "List evidence of an instrument (FK reverse)", roles: [TalentAssessmentAdmin, ComplianceOfficer, VendorRepresentative], code: 200, input: [], output: "ValidationEvidence[]", side_effects: ["VendorRepresentative: ownership check"] }

  # ---- Interview guides & rubrics ----
  - { method: POST, path: "/talent/interview-guides", description: "Create root guide (DRAFT). Revisions of an APPROVED guide go through POST /talent/interview-guides/{id}/revisions", roles: [TalentAssessmentAdmin], code: 201, input: [title, rubric_items, "scoring_mode?"], output: InterviewGuide, side_effects: ["created_by_user_id = X-User-ID", "version_label = 1"] }
  - { method: POST, path: "/talent/interview-guides/{id}/revisions", description: "Create a revision guide superseding the APPROVED guide {id} (OCC-guarded); new guide starts DRAFT with version_label = superseded.version_label + 1", roles: [TalentAssessmentAdmin], code: 201, input: [title, rubric_items, expected_superseded_guide_version, "scoring_mode?"], output: InterviewGuide, side_effects: ["created_by_user_id = X-User-ID", "target must be APPROVED else ERR_GUIDE_NOT_APPROVED", "sets target superseded_by_guide_id and increments InterviewGuide.version of the superseded guide by 1"] }
  - { method: GET, path: "/talent/interview-guides", description: "List guides; supersedes_guide_id filter covers self-FK reverse (revision chain)", roles: [TalentAssessmentAdmin, HiringManager, Interviewer, ComplianceOfficer, DecisionOfficer], code: 200, input: [ "supersedes_guide_id?", "status?", "limit?", "offset?"], output: "InterviewGuide[]", side_effects: [] }
  - { method: GET, path: "/talent/interview-guides/{id}", description: "Read guide", roles: [TalentAssessmentAdmin, HiringManager, Interviewer, ComplianceOfficer, DecisionOfficer], code: 200, input: [], output: InterviewGuide, side_effects: [] }
  - { method: POST, path: "/talent/interview-guides/{id}/pilot", description: "DRAFT -> PILOT (rubric checks)", roles: [TalentAssessmentAdmin], code: 200, input: [], output: InterviewGuide, side_effects: [] }
  - { method: POST, path: "/talent/interview-guides/{id}/retract", description: "PILOT -> DRAFT (revision loop)", roles: [TalentAssessmentAdmin], code: 200, input: [], output: InterviewGuide, side_effects: [] }
  - { method: POST, path: "/talent/interview-guides/{id}/approve", description: "PILOT -> APPROVED; SoD approver != creator; auto-retires superseded APPROVED guide", roles: [TalentAssessmentAdmin], code: 200, input: [], output: InterviewGuide, side_effects: ["superseded guide (if any) APPROVED -> RETIRED"] }
  - { method: POST, path: "/talent/interview-guides/{id}/retire", description: "DRAFT|PILOT|APPROVED -> RETIRED; requires pinned_cycle_count == 0 (ERR_GUIDE_PINNED otherwise)", roles: [TalentAssessmentAdmin], code: 200, input: [], output: InterviewGuide, side_effects: [] }

  # ---- Requisitions ----
  - { method: POST, path: "/talent/requisitions", description: "Create requisition; hiring_manager_id = X-User-ID", roles: [HiringManager], code: 201, input: [title, department, openings_count, "retention_days?"], output: Requisition, side_effects: ["status=OPEN", "filled_count=0"] }
  - { method: GET, path: "/talent/requisitions/{id}", description: "Read requisition", roles: [HiringManager, TalentAssessmentAdmin, ComplianceOfficer, DecisionOfficer], code: 200, input: [], output: Requisition, side_effects: ["HiringManager: ownership check"] }
  - { method: POST, path: "/talent/requisitions/{id}/close", description: "OPEN|FILLED -> CLOSED; requires all cycles CLOSED", roles: [HiringManager], code: 200, input: [], output: Requisition, side_effects: [] }
  - { method: POST, path: "/talent/requisitions/{id}/cycles", description: "Create assessment cycle pinning instrument + guide", roles: [HiringManager], code: 201, input: [instrument_id, guide_id, label, administration_window_start, administration_window_end, "max_sessions_per_day?"], output: AssessmentCycle, side_effects: ["posture=SETUP", "guide.pinned_cycle_count += 1", "ownership: requisition.hiring_manager_id == X-User-ID"] }

  # ---- Cycles ----
  - { method: GET, path: "/talent/cycles", description: "List cycles; filters cover FK reverse for requisition_id, instrument_id, guide_id", roles: [HiringManager, TalentAssessmentAdmin, ComplianceOfficer, DecisionOfficer, Interviewer], code: 200, input: [ "requisition_id?", "instrument_id?", "guide_id?", "posture?", "limit?", "offset?"], output: "AssessmentCycle[]", side_effects: [] }
  - { method: GET, path: "/talent/cycles/{id}", description: "Read cycle incl. posture and computed counts", roles: [HiringManager, TalentAssessmentAdmin, ComplianceOfficer, DecisionOfficer, Interviewer], code: 200, input: [], output: AssessmentCycle, side_effects: [] }
  - { method: PATCH, path: "/talent/cycles/{id}", description: "Update window/max_sessions_per_day/instrument_id/guide_id while SETUP; OCC-guarded", roles: [HiringManager], code: 200, input: [expected_cycle_version, "administration_window_start?", "administration_window_end?", "max_sessions_per_day?", "instrument_id?", "guide_id?"], output: AssessmentCycle, side_effects: ["increments AssessmentCycle.version by 1", "only while posture == SETUP else ERR_INVALID_STATE", "re-pin checks: instrument VALIDATED, guide APPROVED"] }
  - { method: POST, path: "/talent/cycles/{id}/activate", description: "SETUP -> ACTIVE (cross-entity gates: requisition OPEN, instrument VALIDATED, vendor ACTIVE, guide APPROVED, window not past)", roles: [HiringManager], code: 200, input: [], output: AssessmentCycle, side_effects: [] }
  - { method: POST, path: "/talent/cycles/{id}/freeze", description: "SETUP|ACTIVE|SCORING -> FROZEN; freeze_reason defaults MANUAL and may be ADVERSE_IMPACT (manual adverse-impact hold before any FINAL snapshot exists — unfreeze then requires a FINAL snapshot)", roles: [ComplianceOfficer], code: 200, input: [ "reason_note?", "freeze_reason?"], output: AssessmentCycle, side_effects: ["frozen_from_posture/frozen_reason set"] }
  - { method: POST, path: "/talent/cycles/{id}/unfreeze", description: "FROZEN -> frozen_from_posture; ADVERSE_IMPACT requires existing FINAL snapshot; VENDOR_HOLD requires vendor ACTIVE", roles: [ComplianceOfficer], code: 200, input: [resolution_note], output: AssessmentCycle, side_effects: ["frozen fields cleared"] }
  - { method: POST, path: "/talent/cycles/{id}/begin-scoring", description: "ACTIVE -> SCORING; requires no SCHEDULED sessions", roles: [HiringManager], code: 200, input: [], output: AssessmentCycle, side_effects: [] }
  - { method: POST, path: "/talent/cycles/{id}/close", description: "-> CLOSED from any non-terminal posture; cascades cancellations + retention anchoring", roles: [HiringManager], code: 200, input: [], output: AssessmentCycle, side_effects: ["see state_machines.AssessmentCycle close chain"] }
  - { method: POST, path: "/talent/cycles/{id}/invitations", description: "Invite candidate into cycle -> creates CandidateAssessment (INVITED)", roles: [HiringManager], code: 201, input: [candidate_id], output: CandidateAssessment, side_effects: ["active_candidate_count += 1", "cycle posture IN {SETUP, ACTIVE} else ERR_CYCLE_NOT_ACTIVE/ERR_CYCLE_FROZEN", "ownership"] }
  - { method: POST, path: "/talent/cycles/{id}/sessions", description: "Schedule structured interview session (overlap + capacity + calibration + pin checks)", roles: [HiringManager], code: 201, input: [candidate_id, interviewer_id, guide_id, scheduled_start, scheduled_end], output: InterviewSession, side_effects: ["Interviewer.committed_minutes_total += duration"] }
  - { method: POST, path: "/talent/cycles/{id}/decisions", description: "Create FINALIZED hiring decision after quorum + SoD + composite gates", roles: [DecisionOfficer], code: 201, input: [candidate_id, decision, rationale], output: HiringDecision, side_effects: ["decisions_finalized_count += 1", "assessment.retention_expires_at = finalized_at + retention_days", "ADVANCE: requisition.filled_count += 1, auto-FILLED at openings_count", "SCORING auto -> DECIDED when all COMPLETED assessments decided"] }
  - { method: POST, path: "/talent/cycles/{id}/adverse-impact-snapshots", description: "Compute + persist adverse-impact snapshot (PROVISIONAL|FINAL); flagged FINAL freezes cycle when monitor enabled", roles: [ComplianceOfficer], code: 201, input: [snapshot_type], output: AdverseImpactSnapshot, side_effects: ["cycle posture IN {ACTIVE, SCORING, DECIDED, FROZEN} else ERR_CYCLE_NOT_ACTIVE", "flagged FINAL + posture IN {ACTIVE, SCORING} + instrument.adverse_impact_monitor_enabled -> cycle FROZEN (ADVERSE_IMPACT)"] }
  - { method: GET, path: "/talent/cycles/{id}/adverse-impact-snapshots", description: "List snapshots of a cycle (FK reverse)", roles: [ComplianceOfficer, TalentAssessmentAdmin, HiringManager], code: 200, input: [], output: "AdverseImpactSnapshot[]", side_effects: [] }

  # ---- Candidates ----
  - { method: POST, path: "/talent/candidates", description: "Register candidate", roles: [HiringManager, TalentAssessmentAdmin], code: 201, input: [external_ref, full_name, email, group_code], output: Candidate, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/talent/candidates/{id}", description: "Read candidate", roles: [HiringManager, TalentAssessmentAdmin, ComplianceOfficer, DecisionOfficer, Candidate], code: 200, input: [], output: Candidate, side_effects: ["Candidate: id must equal X-User-ID else ERR_OWNERSHIP_MISMATCH"] }
  - { method: POST, path: "/talent/candidates/{id}/withdraw", description: "Withdraw candidate; cascades cancel non-terminal assessments/sessions and withdraw pending accommodations", roles: [Candidate, HiringManager], code: 200, input: [], output: Candidate, side_effects: ["see state_machines.Candidate ACTIVE->WITHDRAWN"] }

  # ---- Candidate assessments ----
  - { method: GET, path: "/talent/assessments", description: "List assessments; filters cover FK reverse for cycle_id and candidate_id", roles: [HiringManager, TalentAssessmentAdmin, ComplianceOfficer, DecisionOfficer, Candidate], code: 200, input: [ "cycle_id?", "candidate_id?", "admin_status?", "limit?", "offset?"], output: "CandidateAssessment[]", side_effects: ["Candidate: must pass candidate_id equal to X-User-ID else ERR_OWNERSHIP_MISMATCH"] }
  - { method: GET, path: "/talent/assessments/{id}", description: "Read assessment incl. composite_score and retention_expires_at", roles: [HiringManager, TalentAssessmentAdmin, ComplianceOfficer, DecisionOfficer, Candidate], code: 200, input: [], output: CandidateAssessment, side_effects: ["Candidate: ownership check via candidate_id"] }
  - { method: POST, path: "/talent/assessments/{id}/schedule", description: "INVITED -> SCHEDULED", roles: [HiringManager], code: 200, input: [scheduled_for], output: CandidateAssessment, side_effects: ["scheduled_for set"] }
  - { method: POST, path: "/talent/assessments/{id}/start", description: "SCHEDULED -> IN_PROGRESS; must be inside effective administration window", roles: [HiringManager], code: 200, input: [], output: CandidateAssessment, side_effects: ["started_at = now"] }
  - { method: POST, path: "/talent/assessments/{id}/complete", description: "IN_PROGRESS -> COMPLETED with raw_score; closed-interval window check; computes composite_score", roles: [HiringManager], code: 200, input: [raw_score], output: CandidateAssessment, side_effects: ["completed_at = now", "composite_score computed"] }
  - { method: POST, path: "/talent/assessments/{id}/mark-no-show", description: "SCHEDULED -> NO_SHOW (now > scheduled_for)", roles: [HiringManager], code: 200, input: [], output: CandidateAssessment, side_effects: ["feedback_status -> NOT_APPLICABLE"] }
  - { method: POST, path: "/talent/assessments/{id}/cancel", description: "Non-terminal -> CANCELLED; cascades sessions + accommodations + count", roles: [HiringManager, Candidate], code: 200, input: [], output: CandidateAssessment, side_effects: ["see state_machines.CandidateAssessment cancel"] }
  - { method: POST, path: "/talent/assessments/{id}/reschedule", description: "ACCOMMODATION_HOLD -> SCHEDULED with new scheduled_for", roles: [HiringManager], code: 200, input: [scheduled_for], output: CandidateAssessment, side_effects: ["scheduled_for updated"] }
  - { method: POST, path: "/talent/assessments/{id}/feedback", description: "Send candidate feedback; requires FINALIZED decision and unexpired retention", roles: [HiringManager], code: 200, input: [feedback_text], output: CandidateAssessment, side_effects: ["feedback_status NOT_SENT -> SENT"] }
  - { method: POST, path: "/talent/assessments/{id}/accommodation-requests", description: "Candidate files accommodation request (PENDING)", roles: [Candidate], code: 201, input: [request_type, justification, requested_extension_days], output: AccommodationRequest, side_effects: ["ownership: assessment.candidate_id == X-User-ID", "at most one PENDING per assessment"] }
  - { method: GET, path: "/talent/assessments/{id}/accommodation-requests", description: "List accommodation requests of an assessment (FK reverse)", roles: [Candidate, ComplianceOfficer, HiringManager, TalentAssessmentAdmin], code: 200, input: [], output: "AccommodationRequest[]", side_effects: ["Candidate: ownership check"] }
  - { method: GET, path: "/talent/assessments/{id}/purge-events", description: "List retention purge events of an assessment (FK reverse)", roles: [ComplianceOfficer, TalentAssessmentAdmin], code: 200, input: [], output: "RetentionPurgeEvent[]", side_effects: [] }

  # ---- Accommodation requests ----
  - { method: GET, path: "/talent/accommodation-requests/{id}", description: "Read accommodation request", roles: [ComplianceOfficer, Candidate, HiringManager, TalentAssessmentAdmin], code: 200, input: [], output: AccommodationRequest, side_effects: ["Candidate: ownership via assessment.candidate_id"] }
  - { method: POST, path: "/talent/accommodation-requests/{id}/approve", description: "PENDING -> APPROVED; extends assessment window; SCHEDULED assessment -> ACCOMMODATION_HOLD", roles: [ComplianceOfficer], code: 200, input: [approved_extension_days, decision_note], output: AccommodationRequest, side_effects: ["assessment.accommodation_extension_days += approved_extension_days", "assessment SCHEDULED -> ACCOMMODATION_HOLD when applicable"] }
  - { method: POST, path: "/talent/accommodation-requests/{id}/deny", description: "PENDING -> DENIED", roles: [ComplianceOfficer], code: 200, input: [decision_note], output: AccommodationRequest, side_effects: [] }
  - { method: POST, path: "/talent/accommodation-requests/{id}/withdraw", description: "PENDING -> WITHDRAWN (candidate own)", roles: [Candidate], code: 200, input: [], output: AccommodationRequest, side_effects: ["ownership: assessment.candidate_id == X-User-ID"] }

  # ---- Interviewers & calibration ----
  - { method: POST, path: "/talent/interviewers", description: "Register interviewer", roles: [TalentAssessmentAdmin], code: 201, input: [full_name, email, department], output: Interviewer, side_effects: ["committed_minutes_total = 0"] }
  - { method: GET, path: "/talent/interviewers/{id}", description: "Read interviewer incl. committed_minutes_total", roles: [TalentAssessmentAdmin, Interviewer, HiringManager, ComplianceOfficer], code: 200, input: [], output: Interviewer, side_effects: ["Interviewer: ownership check"] }
  - { method: POST, path: "/talent/interviewers/{id}/calibrations", description: "Create CalibrationRecord (TRAINED) for a guide; one open record per (interviewer, guide)", roles: [TalentAssessmentAdmin], code: 201, input: [guide_id], output: CalibrationRecord, side_effects: ["trained_at = now", "guide must exist; status TRAINED"] }
  - { method: GET, path: "/talent/calibrations", description: "List calibration records; filters cover FK reverse for interviewer_id and guide_id", roles: [TalentAssessmentAdmin, Interviewer, ComplianceOfficer, HiringManager], code: 200, input: [ "interviewer_id?", "guide_id?", "status?", "limit?", "offset?"], output: "CalibrationRecord[]", side_effects: ["Interviewer: interviewer_id filter must equal X-User-ID when provided"] }
  - { method: GET, path: "/talent/calibrations/{id}", description: "Read calibration record incl. computed calibration_index (variant per guide.scoring_mode)", roles: [TalentAssessmentAdmin, Interviewer, ComplianceOfficer, HiringManager], code: 200, input: [], output: CalibrationRecord, side_effects: ["Interviewer: ownership check"] }
  - { method: POST, path: "/talent/calibrations/{id}/certify", description: "TRAINED -> CALIBRATED; practice_score >= 0.7000 boundary-inclusive", roles: [TalentAssessmentAdmin], code: 200, input: [practice_score], output: CalibrationRecord, side_effects: ["certified_at = now"] }

  # ---- Interview sessions ----
  - { method: GET, path: "/talent/sessions", description: "List sessions; filters cover FK reverse for cycle_id, candidate_id, interviewer_id, guide_id", roles: [TalentAssessmentAdmin, HiringManager, Interviewer, ComplianceOfficer, DecisionOfficer, Candidate], code: 200, input: [ "cycle_id?", "candidate_id?", "interviewer_id?", "guide_id?", "status?", "limit?", "offset?"], output: "InterviewSession[]", side_effects: ["Interviewer: interviewer_id filter must equal X-User-ID when provided; Candidate: candidate_id filter must equal X-User-ID when provided"] }
  - { method: GET, path: "/talent/sessions/{id}", description: "Read session", roles: [TalentAssessmentAdmin, HiringManager, Interviewer, ComplianceOfficer, DecisionOfficer, Candidate], code: 200, input: [], output: InterviewSession, side_effects: ["Interviewer/Candidate: ownership checks"] }
  - { method: POST, path: "/talent/sessions/{id}/complete", description: "SCHEDULED -> COMPLETED at/after scheduled_end while cycle ACTIVE", roles: [HiringManager], code: 200, input: [], output: InterviewSession, side_effects: ["completed_at = now"] }
  - { method: POST, path: "/talent/sessions/{id}/cancel", description: "SCHEDULED -> CANCELLED (MANUAL); debits committed minutes", roles: [HiringManager], code: 200, input: [], output: InterviewSession, side_effects: ["Interviewer.committed_minutes_total -= duration"] }
  - { method: POST, path: "/talent/sessions/{id}/scorecards", description: "Create DRAFT scorecard for a COMPLETED session (author = session interviewer)", roles: [Interviewer], code: 201, input: [ratings, overall_recommendation], output: Scorecard, side_effects: ["interviewer_id/candidate_id copied from session", "ownership: session.interviewer_id == X-User-ID", "cycle posture IN {ACTIVE, SCORING}"] }

  # ---- Scorecards ----
  - { method: GET, path: "/talent/scorecards", description: "List scorecards; filters cover FK reverse for session_id, interviewer_id, candidate_id", roles: [TalentAssessmentAdmin, ComplianceOfficer, DecisionOfficer, HiringManager, Interviewer], code: 200, input: [ "session_id?", "interviewer_id?", "candidate_id?", "status?", "limit?", "offset?"], output: "Scorecard[]", side_effects: ["Interviewer: interviewer_id filter must equal X-User-ID when provided"] }
  - { method: GET, path: "/talent/scorecards/{id}", description: "Read scorecard", roles: [TalentAssessmentAdmin, ComplianceOfficer, DecisionOfficer, HiringManager, Interviewer], code: 200, input: [], output: Scorecard, side_effects: ["Interviewer: ownership check"] }
  - { method: POST, path: "/talent/scorecards/{id}/submit", description: "DRAFT -> SUBMITTED (author only); 72h window; triggers composite + calibration recompute and session SCORED", roles: [Interviewer], code: 200, input: [], output: Scorecard, side_effects: ["see state_machines.Scorecard DRAFT->SUBMITTED"] }
  - { method: POST, path: "/talent/scorecards/{id}/void", description: "SUBMITTED -> VOIDED (compensation); blocked once a FINALIZED decision exists", roles: [ComplianceOfficer], code: 200, input: [void_reason], output: Scorecard, side_effects: ["see state_machines.Scorecard SUBMITTED->VOIDED"] }

  # ---- Hiring decisions ----
  - { method: GET, path: "/talent/decisions", description: "List decisions; filters cover FK reverse for cycle_id and candidate_id", roles: [DecisionOfficer, HiringManager, ComplianceOfficer, TalentAssessmentAdmin, Candidate], code: 200, input: [ "cycle_id?", "candidate_id?", "limit?", "offset?"], output: "HiringDecision[]", side_effects: ["Candidate: candidate_id filter must equal X-User-ID when provided"] }
  - { method: GET, path: "/talent/decisions/{id}", description: "Read decision", roles: [DecisionOfficer, HiringManager, ComplianceOfficer, TalentAssessmentAdmin, Candidate], code: 200, input: [], output: HiringDecision, side_effects: ["Candidate: ownership via candidate_id"] }

  # ---- Adverse impact snapshots ----
  - { method: GET, path: "/talent/adverse-impact-snapshots/{id}", description: "Read persisted snapshot (immutable)", roles: [ComplianceOfficer, TalentAssessmentAdmin], code: 200, input: [], output: AdverseImpactSnapshot, side_effects: [] }

  # ---- Retention ----
  - { method: POST, path: "/talent/retention-sweeps", description: "Purge every COMPLETED CandidateAssessment with retention_expires_at != null AND now > retention_expires_at (strict); redacts scorecards, appends RetentionPurgeEvent per assessment", roles: [ComplianceOfficer], code: 200, input: [], output: "{ purged_count: integer, purged_assessment_ids: array }", side_effects: ["see state_machines.CandidateAssessment COMPLETED->PURGED"] }

  # ---- Logical clock (test-driving endpoint) ----
  - { method: POST, path: "/talent/_clock/set_current_utc", description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z (never wall-clock). Materializes due automatic transitions: instrument VALIDATED->EXPIRED when now > validity_expires_at; calibration CALIBRATED->LAPSED when now > certified_at + 365 days", roles: [TalentAssessmentAdmin], code: 200, input: [to_iso8601], output: "{ now: string, instruments_expired: integer, calibrations_lapsed: integer }", side_effects: ["automatic transitions materialized"] }

