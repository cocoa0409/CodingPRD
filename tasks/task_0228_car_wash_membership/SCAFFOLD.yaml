# =============================================================================
# SCAFFOLD — Car Wash Unlimited Membership API (Expert)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "Car Wash Unlimited Membership: plan tiers, license-plate-recognition entry, monthly recurring billing, single-wash vs unlimited, add-on services, multi-location interoperability, fleet account, freeze/cancellation"

domain_name: car-wash-membership
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Account, Plan, Vehicle, Location, AddOn are peers linked by foreign keys.
  # Membership / MembershipAddOn / Invoice / WashEvent / WalletTransaction / Freeze
  # are FK children, not nested under URL paths beyond their owning collection.

  state_machine_shape: cyclic
  # Membership ACTIVE<->FROZEN revisits; Invoice FAILED->RETRYING->PAID loops back;
  # WashEvent and Freeze branch; Account ACTIVE<->SUSPENDED cycles.

  relationship_patterns:
    - one_to_many        # Account -> Vehicle, Account -> Membership, Membership -> WashEvent
    - many_to_many       # Membership <-> AddOn via MembershipAddOn junction
    - cross_aggregate    # WashEvent references Location (a peer aggregate), not an ancestor

  role_model: peer_roles
  # AccountHolder owns its account+vehicles+memberships; LocationOperator owns wash
  # admission at a site; BillingAdmin runs billing cycles; PlatformAdmin configures
  # plans/locations/add-ons and drives the clock.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_type, type: enum, source: input, description: "INDIVIDUAL | FLEET; fixed at creation", constraints: "INDIVIDUAL | FLEET" }
      - { name: company_name, type: string, source: input, description: "Required when account_type=FLEET; null otherwise" }
      - { name: contact_email, type: string, source: input, description: "Billing contact email" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", default: "ACTIVE", constraints: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: wallet_balance_cents, type: integer, source: computed, description: "Sum of all WalletTransaction.amount_cents for this account; never negative", default: 0 }
      - { name: active_vehicle_count, type: integer, source: computed, description: "Count of Vehicle rows with this account_id whose membership has status IN {ACTIVE, FROZEN, PAST_DUE}" }
      - { name: fleet_discount_pct, type: number, source: computed, description: "Tiered discount selected from active_vehicle_count; always 0 when account_type=INDIVIDUAL" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation" }

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: tier_type, type: enum, source: input, description: "UNLIMITED | SINGLE_WASH; fixed at creation", constraints: "UNLIMITED | SINGLE_WASH" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring base fee per cycle; >=0. For SINGLE_WASH this is 0", constraints: ">= 0" }
      - { name: included_credits, type: integer, source: input, description: "For SINGLE_WASH: credits granted per paid cycle. For UNLIMITED must be 0", default: 0, constraints: ">= 0" }
      - { name: per_credit_price_cents, type: integer, source: input, description: "For SINGLE_WASH: price charged per additional credit top-up; ignored for UNLIMITED", default: 0, constraints: ">= 0" }
      - { name: wash_cooldown_hours, type: integer, source: input, description: "For UNLIMITED: minimum hours between admitted washes per vehicle (abuse throttle). For SINGLE_WASH must be 0", default: 0, constraints: ">= 0" }
      - { name: max_addons, type: integer, source: input, description: "Maximum recurring add-ons attachable to a membership on this plan", default: 3, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED; RETIRED plans accept no new memberships", default: "ACTIVE", constraints: "ACTIVE | RETIRED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation" }

  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of the site" }
      - { name: in_network, type: boolean, source: input, description: "True if site honors memberships from any account (multi-location interoperability)", default: true }
      - { name: daily_wash_capacity, type: integer, source: input, description: "Max admitted WashEvents per UTC calendar day at this site", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; CLOSED sites reject admissions", default: "OPEN", constraints: "OPEN | CLOSED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation" }

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Add-on display name (e.g. TIRE_SHINE)" }
      - { name: recurring_fee_cents, type: integer, source: input, description: "Monthly recurring fee added to each invoice while attached", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED; RETIRED add-ons accept no new attachments", default: "ACTIVE", constraints: "ACTIVE | RETIRED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the owning billing account" }
      - { name: license_plate, type: string, source: input, description: "Normalized uppercase alphanumeric plate; globally unique among non-removed vehicles" }
      - { name: state_code, type: string, source: input, description: "Two-letter plate-issuing state code; part of LPR identity" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED; REMOVED frees the plate for re-registration", default: "ACTIVE", constraints: "ACTIVE | REMOVED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the billing owner" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; the enrolled vehicle (one ACTIVE/FROZEN/PAST_DUE membership per vehicle)" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; the subscribed plan" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | PAST_DUE | FROZEN | CANCEL_SCHEDULED | CANCELLED", default: "PENDING", constraints: "PENDING | ACTIVE | PAST_DUE | FROZEN | CANCEL_SCHEDULED | CANCELLED" }
      - { name: cycle_anchor_utc, type: datetime, source: system, description: "UTC timestamp marking the start of the current billing cycle; advances by CYCLE_DAYS each successful billing run" }
      - { name: current_cycle_paid_cents, type: integer, source: system, description: "Cents charged for the current cycle's base+addons (the paid amount used by refund/proration math)", default: 0 }
      - { name: credit_balance, type: integer, source: computed, description: "For SINGLE_WASH plans: remaining single-wash credits = credits_granted - credits_consumed. For UNLIMITED plans always 0", default: 0 }
      - { name: credits_granted, type: integer, source: computed, description: "Cumulative SINGLE_WASH credits granted across paid cycles and top-ups" }
      - { name: credits_consumed, type: integer, source: computed, description: "Cumulative SINGLE_WASH credits consumed by admitted washes" }
      - { name: last_admitted_wash_utc, type: datetime, source: system, description: "UTC of the most recent ADMITTED WashEvent for this membership; null until first admission" }
      - { name: freeze_count, type: integer, source: computed, description: "Number of Freeze rows with status IN {SCHEDULED, ACTIVE, ENDED} for this membership" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation" }

  - name: MembershipAddOn
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the membership this add-on is attached to" }
      - { name: addon_id, type: string, source: input, description: "FK -> AddOn.id; the catalog add-on attached" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | DETACHED; PAUSED while membership FROZEN, DETACHED on removal", default: "ACTIVE", constraints: "ACTIVE | PAUSED | DETACHED" }
      - { name: locked_fee_cents, type: integer, source: system, description: "AddOn.recurring_fee_cents snapshotted at attach time; billing uses this, not the live catalog fee" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the billed account" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the membership being billed this cycle" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | FAILED | RETRYING | WRITTEN_OFF | VOID", default: "DRAFT", constraints: "DRAFT | ISSUED | PAID | FAILED | RETRYING | WRITTEN_OFF | VOID" }
      - { name: kind, type: enum, source: system, description: "CYCLE (recurring) | PRORATION (mid-cycle change) | TOPUP (single-wash credit purchase)", constraints: "CYCLE | PRORATION | TOPUP" }
      - { name: base_fee_cents, type: integer, source: computed, description: "Plan.monthly_fee_cents component of this invoice (0 for TOPUP)" }
      - { name: addon_fee_cents, type: integer, source: computed, description: "Sum of locked_fee_cents over ACTIVE MembershipAddOns (0 for TOPUP)" }
      - { name: discount_cents, type: integer, source: computed, description: "Fleet discount applied = round_half_up(subtotal * Account.fleet_discount_pct); 0 for INDIVIDUAL" }
      - { name: total_cents, type: integer, source: computed, description: "Net amount owed = base_fee_cents + addon_fee_cents - discount_cents (or proration/topup amount)" }
      - { name: attempt_count, type: integer, source: system, description: "Number of charge attempts made; +1 on each issue/retry", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation" }

  - name: WashEvent
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; resolved from the recognized plate at admission time; null if no membership matched" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; resolved by LPR from license_plate+state_code" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; the site that recognized the plate" }
      - { name: license_plate, type: string, source: input, description: "Raw plate read by the camera, normalized server-side" }
      - { name: state_code, type: string, source: input, description: "Plate state as read by the camera" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ADMITTED | REJECTED | COMPLETED", constraints: "REQUESTED | ADMITTED | REJECTED | COMPLETED" }
      - { name: rejection_error_id, type: string, source: system, description: "When REJECTED, the error_id that explains the denial; null otherwise" }
      - { name: consumed_credit, type: boolean, source: system, description: "True if this admission decremented a SINGLE_WASH credit", default: false }
      - { name: admitted_at_utc, type: datetime, source: system, description: "UTC at admission; null unless ADMITTED/COMPLETED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, ms precision" }

  - name: WalletTransaction
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the wallet owner" }
      - { name: amount_cents, type: integer, source: input, description: "Signed delta; positive = credit to wallet (refund), negative = debit (topup/charge against wallet)" }
      - { name: reason, type: enum, source: system, description: "CANCEL_REFUND | FREEZE_REFUND | TOPUP_DEBIT | INVOICE_CHARGE | MANUAL_ADJUSTMENT", constraints: "CANCEL_REFUND | FREEZE_REFUND | TOPUP_DEBIT | INVOICE_CHARGE | MANUAL_ADJUSTMENT" }
      - { name: related_invoice_id, type: string, source: system, description: "Denormalized audit pointer to the Invoice.id this transaction settles when applicable (informational; browsed via the account ledger, not a navigation FK); null otherwise" }
      - { name: balance_after_cents, type: integer, source: computed, description: "Account.wallet_balance_cents immediately after applying this transaction" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, ms precision; chronological ledger order key" }

  - name: Freeze
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the frozen membership" }
      - { name: start_utc, type: datetime, source: input, description: "Inclusive start of the freeze window (UTC)" }
      - { name: end_utc, type: datetime, source: input, description: "Exclusive end of the freeze window (UTC); must be strictly after start_utc" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | ENDED | CANCELLED", default: "SCHEDULED", constraints: "SCHEDULED | ACTIVE | ENDED | CANCELLED" }
      - { name: refund_cents, type: integer, source: system, description: "Pro-rated billing credit returned to wallet when the freeze activates; 0 until activation" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accounts/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["account.status == ACTIVE"]
        side_effects:
          - "for each Membership of this account with status IN {ACTIVE, PAST_DUE}: transition that Membership ACTIVE/PAST_DUE -> FROZEN (cascade hop 1)"
          - "increments Account.version by 1"
        note: "Cascade origin: see Membership FROZEN side-effects for hops 2 and 3."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accounts/{id}/reactivate"
        actor: PlatformAdmin
        preconditions: ["account.status == SUSPENDED"]
        side_effects:
          - "Memberships frozen by the suspension are NOT auto-thawed; the holder must POST /memberships/{id}/unfreeze each"
          - "increments Account.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: PlatformAdmin
        preconditions: ["account.status == ACTIVE", "no Membership of this account has status IN {ACTIVE, PAST_DUE, FROZEN, CANCEL_SCHEDULED}"]
        side_effects: ["increments Account.version by 1"]

  - entity: Membership
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /memberships/{id}/activate (system, on first CYCLE invoice PAID)"
        actor: system
        preconditions: ["membership.status == PENDING", "the membership's first CYCLE Invoice.status == PAID"]
        side_effects:
          - "sets cycle_anchor_utc = current UTC clock"
          - "for SINGLE_WASH plan: credits_granted += Plan.included_credits (entitlement grant)"
          - "increments Membership.version by 1"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /billing/run (system) when the cycle CYCLE invoice charge FAILED"
        actor: system
        preconditions: ["membership.status == ACTIVE", "the new CYCLE Invoice.status == FAILED"]
        side_effects: ["increments Membership.version by 1"]
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /invoices/{id}/retry succeeds (system)"
        actor: system
        preconditions: ["membership.status == PAST_DUE", "the failing CYCLE Invoice transitions RETRYING -> PAID"]
        side_effects:
          - "advances cycle_anchor_utc by CYCLE_DAYS"
          - "for SINGLE_WASH plan: credits_granted += Plan.included_credits"
          - "increments Membership.version by 1"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /memberships/{id}/freeze OR Account suspend cascade OR Freeze activation"
        actor: AccountHolder | system
        preconditions: ["membership.status == ACTIVE", "no other Freeze for this membership overlaps the requested window (half-open [start,end))"]
        side_effects:
          - "creates a Freeze row (when holder-initiated) and computes refund_cents = round_half_up(current_cycle_paid_cents * remaining_days/CYCLE_DAYS); credits refund_cents to wallet via WalletTransaction(reason=FREEZE_REFUND) (cascade hop 2 of Account suspend)"
          - "for each ACTIVE MembershipAddOn: transition ACTIVE -> PAUSED (cascade hop 3 of Account suspend)"
          - "increments Membership.version by 1"
      - from: PAST_DUE
        to: FROZEN
        trigger: "Account suspend cascade"
        actor: system
        preconditions: ["membership.status == PAST_DUE"]
        side_effects:
          - "for each ACTIVE MembershipAddOn: transition ACTIVE -> PAUSED"
          - "increments Membership.version by 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /memberships/{id}/unfreeze"
        actor: AccountHolder
        preconditions: ["membership.status == FROZEN", "owning Account.status == ACTIVE"]
        side_effects:
          - "ends the open Freeze row (status ACTIVE -> ENDED)"
          - "for each PAUSED MembershipAddOn: transition PAUSED -> ACTIVE"
          - "increments Membership.version by 1"
      - from: ACTIVE
        to: CANCEL_SCHEDULED
        trigger: "POST /memberships/{id}/cancel"
        actor: AccountHolder
        preconditions: ["membership.status == ACTIVE"]
        side_effects:
          - "computes cancellation refund per calculation cancellation_refund and credits it to wallet via WalletTransaction(reason=CANCEL_REFUND)"
          - "increments Membership.version by 1"
        note: "Service continues until cycle end; status flips to CANCELLED at the next billing run."
      - from: CANCEL_SCHEDULED
        to: CANCELLED
        trigger: "POST /billing/run (system) at cycle end"
        actor: system
        preconditions: ["membership.status == CANCEL_SCHEDULED", "current UTC >= cycle_anchor_utc + CYCLE_DAYS"]
        side_effects:
          - "for each ACTIVE or PAUSED MembershipAddOn: transition -> DETACHED"
          - "increments Membership.version by 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /billing/run or POST /memberships/{id}/topup (system)"
        actor: system
        preconditions: ["invoice.status == DRAFT"]
        side_effects: ["sets attempt_count = 1", "increments Invoice.version by 1"]
      - from: ISSUED
        to: PAID
        trigger: "charge attempt succeeds (system, via /_payments/simulate outcome=SUCCEEDED)"
        actor: system
        preconditions: ["invoice.status == ISSUED"]
        side_effects:
          - "writes WalletTransaction(reason=INVOICE_CHARGE, amount_cents = -total_cents) only when paid from wallet; gateway-paid invoices write no wallet txn"
          - "for first CYCLE invoice: triggers Membership PENDING -> ACTIVE"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: FAILED
        trigger: "charge attempt fails (system, via /_payments/simulate outcome=DECLINED)"
        actor: system
        preconditions: ["invoice.status == ISSUED"]
        side_effects:
          - "for a CYCLE invoice on an ACTIVE membership: triggers Membership ACTIVE -> PAST_DUE"
          - "increments Invoice.version by 1"
      - from: FAILED
        to: RETRYING
        trigger: "POST /invoices/{id}/retry"
        actor: BillingAdmin
        preconditions: ["invoice.status == FAILED", "invoice.attempt_count < MAX_ATTEMPTS"]
        side_effects: ["attempt_count += 1", "increments Invoice.version by 1"]
      - from: RETRYING
        to: PAID
        trigger: "retry charge succeeds (system)"
        actor: system
        preconditions: ["invoice.status == RETRYING"]
        side_effects:
          - "triggers Membership PAST_DUE -> ACTIVE"
          - "increments Invoice.version by 1"
      - from: RETRYING
        to: FAILED
        trigger: "retry charge fails (system)"
        actor: system
        preconditions: ["invoice.status == RETRYING"]
        side_effects: ["increments Invoice.version by 1"]
      - from: FAILED
        to: WRITTEN_OFF
        trigger: "POST /invoices/{id}/write-off"
        actor: BillingAdmin
        preconditions: ["invoice.status == FAILED", "invoice.attempt_count >= MAX_ATTEMPTS"]
        side_effects: ["increments Invoice.version by 1"]
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingAdmin
        preconditions: ["invoice.status == ISSUED", "invoice.kind == PRORATION"]
        side_effects: ["increments Invoice.version by 1"]

  - entity: WashEvent
    initial_state: REQUESTED
    terminal_states: [REJECTED, COMPLETED]
    transitions:
      - from: REQUESTED
        to: ADMITTED
        trigger: "POST /wash-events (system decision at LPR read)"
        actor: LocationOperator
        preconditions:
          - "Location.status == OPEN"
          - "a Vehicle exists with this license_plate+state_code and status==ACTIVE"
          - "that Vehicle has a Membership with status == ACTIVE (not FROZEN/PAST_DUE/CANCELLED)"
          - "Location.in_network == true OR the membership's home rules permit this site"
          - "today's admitted WashEvent count at this Location < Location.daily_wash_capacity"
          - "for UNLIMITED: hours since Membership.last_admitted_wash_utc >= Plan.wash_cooldown_hours (cooldown elapsed)"
          - "for SINGLE_WASH: Membership.credit_balance >= 1"
        side_effects:
          - "sets admitted_at_utc, status=ADMITTED"
          - "updates Membership.last_admitted_wash_utc = admitted_at_utc"
          - "for SINGLE_WASH: credits_consumed += 1, consumed_credit=true"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /wash-events (system decision at LPR read, any precondition fails)"
        actor: LocationOperator
        preconditions: ["at least one ADMITTED precondition is unmet"]
        side_effects: ["sets rejection_error_id to the highest-priority failing check; no entitlement consumed"]
      - from: ADMITTED
        to: COMPLETED
        trigger: "POST /wash-events/{id}/complete"
        actor: LocationOperator
        preconditions: ["wash_event.status == ADMITTED"]
        side_effects: ["sets status=COMPLETED"]

  - entity: Freeze
    initial_state: SCHEDULED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system at clock advance when current UTC >= start_utc (via /_clock/set_current_utc)"
        actor: system
        preconditions: ["freeze.status == SCHEDULED", "current UTC >= start_utc", "owning Membership.status == ACTIVE"]
        side_effects:
          - "transitions Membership ACTIVE -> FROZEN (which credits FREEZE_REFUND to wallet and pauses add-ons)"
          - "sets refund_cents to the credited amount"
          - "increments Freeze.version by 1"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /memberships/{id}/unfreeze OR system when current UTC >= end_utc"
        actor: AccountHolder | system
        preconditions: ["freeze.status == ACTIVE"]
        side_effects: ["increments Freeze.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /freezes/{id}/cancel"
        actor: AccountHolder
        preconditions: ["freeze.status == SCHEDULED"]
        side_effects: ["increments Freeze.version by 1"]

  - entity: MembershipAddOn
    initial_state: ACTIVE
    terminal_states: [DETACHED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "Membership ACTIVE/PAST_DUE -> FROZEN cascade (system)"
        actor: system
        preconditions: ["membership_addon.status == ACTIVE"]
        side_effects: ["increments MembershipAddOn.version by 1"]
      - from: PAUSED
        to: ACTIVE
        trigger: "Membership FROZEN -> ACTIVE cascade (system, on unfreeze)"
        actor: system
        preconditions: ["membership_addon.status == PAUSED"]
        side_effects: ["increments MembershipAddOn.version by 1"]
      - from: ACTIVE
        to: DETACHED
        trigger: "POST /membership-addons/{id}/detach OR Membership -> CANCELLED cascade"
        actor: AccountHolder | system
        preconditions: ["membership_addon.status IN {ACTIVE, PAUSED}"]
        side_effects: ["increments MembershipAddOn.version by 1"]
      - from: PAUSED
        to: DETACHED
        trigger: "Membership -> CANCELLED cascade (system)"
        actor: system
        preconditions: ["membership_addon.status == PAUSED"]
        side_effects: ["increments MembershipAddOn.version by 1"]

  - entity: Location
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /locations/{id}/close"
        actor: PlatformAdmin
        preconditions: ["location.status == OPEN"]
        side_effects: ["increments Location.version by 1"]
      - from: CLOSED
        to: OPEN
        trigger: "POST /locations/{id}/reopen"
        actor: PlatformAdmin
        preconditions: ["location.status == CLOSED"]
        side_effects: ["increments Location.version by 1"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only; passes the serial-observability filter)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: addon-attach-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /memberships/{id}/addons"
    occ_field: "expected_membership_version"
    description: |
      Attaching an add-on to a Membership whose version has advanced since the
      client last read it is rejected. A prior mutation (e.g. another attach that
      consumed the last max_addons slot, or a freeze that paused add-ons) leaves
      the client's view stale; the attach is rejected on the stale version so the
      max_addons capacity check is never evaluated against an outdated add-on set.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: topup-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /memberships/{id}/topup"
    occ_field: "expected_membership_version"
    description: |
      Purchasing additional SINGLE_WASH credits against a Membership whose version
      has advanced since the client last read it is rejected. An intervening top-up
      already raised credits_granted; the current writer's credit_balance view is
      stale and its top-up is rejected on the stale version rather than stacking on
      an outdated balance.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_cycle_total
    trigger: "Invoice DRAFT -> ISSUED for a CYCLE invoice (POST /billing/run)"
    algorithm: tiered_pricing
    formula: |
      subtotal = base_fee_cents + addon_fee_cents
      base_fee_cents = Plan.monthly_fee_cents
      addon_fee_cents = sum(ma.locked_fee_cents for ma in MembershipAddOns
                            where ma.membership_id == M.id AND ma.status == ACTIVE)
      # fleet_discount_pct selected by tier from Account.active_vehicle_count:
      #   count >= 10 -> 0.15 ; >= 5 -> 0.10 ; >= 2 -> 0.05 ; else 0.00
      #   INDIVIDUAL accounts -> 0.00 regardless of count
      discount_cents = round_half_up(subtotal * Account.fleet_discount_pct)
      total_cents    = subtotal - discount_cents
    input_set: "Plan.monthly_fee_cents for the membership's plan; locked_fee_cents of MembershipAddOns in status ACTIVE only (PAUSED/DETACHED excluded); Account.fleet_discount_pct keyed on active_vehicle_count"
    constants:
      FLEET_TIER_2: 0.05
      FLEET_TIER_5: 0.10
      FLEET_TIER_10: 0.15
    precision: "integer cents, round_half_up applied to discount_cents only"
    variants:
      - name: fleet_discounted
        when: "Account.account_type == FLEET and active_vehicle_count >= 2"
        difference: "non-zero discount_cents selected by the volume tier"
      - name: individual_flat
        when: "Account.account_type == INDIVIDUAL"
        difference: "discount_cents always 0 regardless of vehicle count"

  - name: proration_on_plan_change
    trigger: "POST /memberships/{id}/change-plan mid-cycle (creates a PRORATION invoice)"
    algorithm: tiered_pricing
    formula: |
      remaining_days = CYCLE_DAYS - elapsed_days
      elapsed_days   = floor((current_utc - cycle_anchor_utc) / 1 day)
      # Each changed line item is prorated and rounded INDEPENDENTLY, THEN summed.
      # Pinned order: round_half_up PER LINE ITEM first, then sum the rounded cents.
      plan_delta_line  = round_half_up((new_plan.monthly_fee_cents - old_plan.monthly_fee_cents)
                                       * remaining_days / CYCLE_DAYS)
      addon_added_line = for each newly added add-on:
                           round_half_up(addon.recurring_fee_cents * remaining_days / CYCLE_DAYS)
      total_cents = plan_delta_line + sum(addon_added_line)   # sum of already-rounded lines
    input_set: "old Plan.monthly_fee_cents, new Plan.monthly_fee_cents, recurring_fee_cents of each newly added add-on; remaining_days from the current cycle"
    constants:
      CYCLE_DAYS: 30
    precision: "integer cents; round_half_up PER LINE then sum (sum-then-round is explicitly NOT used)"

  - name: cancellation_refund
    trigger: "POST /memberships/{id}/cancel (Membership ACTIVE -> CANCEL_SCHEDULED)"
    algorithm: forward_looking
    formula: |
      # Two valid product interpretations; the scaffold pins which applies per plan tier.
      # UNLIMITED tier -> UNUSED_VALUE variant (forward-looking remaining days):
      remaining_days = CYCLE_DAYS - elapsed_days
      refund_cents   = round_half_up(current_cycle_paid_cents * remaining_days / CYCLE_DAYS)
      # SINGLE_WASH tier -> CONSUMED_VALUE variant (chronological pay-per-use):
      refund_cents   = current_cycle_paid_cents - (credits_consumed_this_cycle * PER_WASH_VALUE_CENTS)
      # floor at 0
    input_set: "current_cycle_paid_cents; for UNLIMITED remaining_days of the cycle; for SINGLE_WASH the count of credits consumed this cycle"
    constants:
      CYCLE_DAYS: 30
      PER_WASH_VALUE_CENTS: 400
    precision: "integer cents, round_half_up; result floored at 0"
    variants:
      - name: unused_value
        when: "Membership's Plan.tier_type == UNLIMITED"
        difference: "refund is a forward-looking proration of remaining days; ignores how many washes were taken"
      - name: consumed_value
        when: "Membership's Plan.tier_type == SINGLE_WASH"
        difference: "refund is paid minus the chronological per-wash value of credits already consumed; ignores remaining days"

  - name: vehicle_usage_intensity
    trigger: "GET /vehicles/{id}/usage-intensity (and evaluated at each wash admission for abuse gating)"
    algorithm: weighted_scoring
    formula: |
      # Two variants over the SAME washes, different windows, different results.
      lifetime_admitted = count(WashEvent where vehicle_id==V.id AND status IN {ADMITTED, COMPLETED})
      active_months     = max(1, ceil((current_utc - V.created_at) / 30 days))
      chronic_intensity = lifetime_admitted / active_months           # avg washes per month over life
      acute_intensity   = count(WashEvent where vehicle_id==V.id
                                AND status IN {ADMITTED, COMPLETED}
                                AND admitted_at_utc >= current_utc - 7 days)   # rolling 7-day window
      is_abuse = (acute_intensity >= ACUTE_CAP) OR (chronic_intensity >= CHRONIC_CAP)
    input_set: "WashEvent rows for the vehicle in status ADMITTED or COMPLETED; chronic counts whole lifetime, acute counts the rolling 7-day window ending at current_utc (inclusive lower bound)"
    constants:
      ACUTE_CAP: 8
      CHRONIC_CAP: 12.0
    precision: "chronic_intensity to 2 decimal places round_half_up; acute_intensity is an integer count"
    variants:
      - name: chronic
        when: "lifetime usage averaged over active months"
        difference: "denominator is active_months; smooths bursts"
      - name: acute
        when: "rolling 7-day count"
        difference: "no denominator; a single burst week can trip ACUTE_CAP while chronic stays low"

  - name: wallet_balance
    trigger: "any WalletTransaction write; read on GET /accounts/{id}"
    algorithm: aggregation
    formula: |
      wallet_balance_cents = sum(t.amount_cents for t in WalletTransaction
                                 where t.account_id == A.id)         # chronological by created_at ASC
      balance_after_cents  = running total up to and including each transaction
      # invariant: balance_after_cents of the latest txn (created_at ASC, ties broken by created_at) == wallet_balance_cents
    input_set: "all WalletTransaction rows for the account, ordered by created_at ASC"
    constants: {}
    precision: "integer cents; balance never below 0 (a debit that would go negative is rejected before any txn is written)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /accounts and config GETs" }
  - { priority: 2,  category: auth,                check: "Role permitted for this operation per §1.7", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,           check: "Path-referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all id-bearing paths" }
  - { priority: 4,  category: business_referential, check: "Body foreign keys (account_id, plan_id, vehicle_id, addon_id, location_id, membership_id) reference existing rows", error_id: ERR_FK_NOT_FOUND, http_status: 404, applies_to: "creates and links" }
  - { priority: 5,  category: business_constraint, check: "Required body fields present and types/enums valid", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: "all writes" }
  - { priority: 6,  category: business_constraint, check: "account_type=FLEET requires company_name; INDIVIDUAL forbids it", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: "POST /accounts" }
  - { priority: 7,  category: business_constraint, check: "license_plate (normalized) is unique among Vehicles with status==ACTIVE", error_id: ERR_PLATE_TAKEN, http_status: 409, applies_to: "POST /accounts/{id}/vehicles" }
  - { priority: 8,  category: state,               check: "Account.status == ACTIVE for vehicle/membership creation and billing", error_id: ERR_ACCOUNT_NOT_ACTIVE, http_status: 409, applies_to: "POST vehicles, memberships, billing run" }
  - { priority: 9,  category: state,               check: "Target Membership in a legal from-state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "membership lifecycle endpoints" }
  - { priority: 10, category: state,               check: "Target Invoice in a legal from-state (retry needs FAILED, write-off needs FAILED+attempts maxed, void needs ISSUED PRORATION)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "invoice lifecycle endpoints" }
  - { priority: 11, category: business_constraint, check: "Plan.status == ACTIVE and AddOn.status == ACTIVE when newly referenced", error_id: ERR_RESOURCE_RETIRED, http_status: 409, applies_to: "POST memberships, POST addons" }
  - { priority: 12, category: business_constraint, check: "tier_type/plan-shape consistency: SINGLE_WASH plan needs included_credits>0 & monthly_fee_cents==0 & wash_cooldown_hours==0; UNLIMITED needs included_credits==0", error_id: ERR_PLAN_SHAPE_INVALID, http_status: 422, applies_to: "POST /plans" }
  - { priority: 13, category: business_constraint, check: "credit_quantity >= 1 on topup; amount_cents != 0 on adjustment; otherwise generic body invalid", error_id: ERR_VALIDATION, http_status: 422, applies_to: "POST /memberships/{id}/topup, POST /accounts/{id}/adjustments" }
  - { priority: 14, category: business_temporal,   check: "Freeze window valid: end_utc strictly after start_utc", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "POST /memberships/{id}/freeze-scheduled" }
  - { priority: 15, category: business_temporal,   check: "Requested Freeze window does not overlap any non-CANCELLED Freeze of the same membership (half-open [start,end) — touching endpoints do NOT overlap)", error_id: ERR_FREEZE_OVERLAP, http_status: 409, applies_to: "POST /memberships/{id}/freeze-scheduled" }
  # ---- Wash admission cross-entity chain (evaluated in this exact priority order; first failure sets rejection_error_id) ----
  - { priority: 16, category: state,               check: "Wash admission: Location.status == OPEN", error_id: ERR_LOCATION_CLOSED, http_status: 409, applies_to: "POST /wash-events" }
  - { priority: 17, category: business_referential, check: "Wash admission: LPR-recognized plate maps to a Vehicle with status==ACTIVE that has a Membership with status==ACTIVE (Vehicle->Membership cross-entity dependency)", error_id: ERR_NO_MEMBERSHIP, http_status: 409, applies_to: "POST /wash-events" }
  - { priority: 18, category: business_constraint, check: "Wash admission: Location.in_network == true (out-of-network sites do not honor memberships)", error_id: ERR_OUT_OF_NETWORK, http_status: 409, applies_to: "POST /wash-events" }
  - { priority: 19, category: business_safety,     check: "Wash admission (UNLIMITED): cooldown elapsed — hours since Membership.last_admitted_wash_utc >= Plan.wash_cooldown_hours (>= boundary; exactly N hours passes)", error_id: ERR_COOLDOWN_ACTIVE, http_status: 409, applies_to: "POST /wash-events" }
  - { priority: 20, category: business_constraint, check: "Wash admission: admitted WashEvent count at this Location for the current UTC day < Location.daily_wash_capacity (aggregate per-day interval)", error_id: ERR_CAPACITY_FULL, http_status: 409, applies_to: "POST /wash-events" }
  - { priority: 21, category: business_fiscal,     check: "Wash admission (SINGLE_WASH): Membership.credit_balance >= 1", error_id: ERR_NO_CREDITS, http_status: 409, applies_to: "POST /wash-events" }
  # ---- Membership add-on / billing ----
  - { priority: 22, category: business_constraint, check: "max_addons not exceeded: ACTIVE+PAUSED MembershipAddOns < Plan.max_addons before attach", error_id: ERR_ADDON_LIMIT, http_status: 409, applies_to: "POST /memberships/{id}/addons" }
  - { priority: 23, category: business_fiscal,     check: "Wallet debit (topup paid from wallet, manual adjustment) must not drive wallet_balance_cents below 0", error_id: ERR_INSUFFICIENT_WALLET, http_status: 409, applies_to: "POST /memberships/{id}/topup, POST /accounts/{id}/adjustments" }
  - { priority: 24, category: business_constraint, check: "OCC: expected_membership_version matches Membership.version for guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /memberships/{id}/addons, POST /memberships/{id}/topup" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Config / catalog (PlatformAdmin) ----
  - { method: POST, path: "/plans", description: "Create a plan tier", roles: [PlatformAdmin], code: 201, input: [name, tier_type, monthly_fee_cents, "included_credits?", "per_credit_price_cents?", "wash_cooldown_hours?", "max_addons?"], output: Plan, side_effects: ["plan-shape validation per priority 12"] }
  - { method: GET,  path: "/plans", description: "List plans", roles: [PlatformAdmin, AccountHolder, BillingAdmin], code: 200, input: ["tier_type?", "status?", "limit?", "offset?"], output: "Plan[]" }
  - { method: GET,  path: "/plans/{id}", description: "Get a plan", roles: [PlatformAdmin, AccountHolder, BillingAdmin], code: 200, input: [], output: Plan }
  - { method: POST, path: "/plans/{id}/retire", description: "Retire a plan (no new memberships)", roles: [PlatformAdmin], code: 200, input: [], output: Plan, side_effects: ["Plan.status -> RETIRED"] }
  - { method: POST, path: "/locations", description: "Create a wash location", roles: [PlatformAdmin], code: 201, input: [name, state_code, daily_wash_capacity, "in_network?"], output: Location }
  - { method: GET,  path: "/locations", description: "List locations", roles: [PlatformAdmin, LocationOperator], code: 200, input: ["status?", "in_network?", "limit?", "offset?"], output: "Location[]" }
  - { method: GET,  path: "/locations/{id}", description: "Get a location", roles: [PlatformAdmin, LocationOperator], code: 200, input: [], output: Location }
  - { method: POST, path: "/locations/{id}/close", description: "Close a location (rejects further admissions)", roles: [PlatformAdmin], code: 200, input: [], output: Location, side_effects: ["Location.status -> CLOSED"] }
  - { method: POST, path: "/locations/{id}/reopen", description: "Reopen a closed location", roles: [PlatformAdmin], code: 200, input: [], output: Location, side_effects: ["Location.status -> OPEN"] }
  - { method: POST, path: "/addons", description: "Create an add-on service", roles: [PlatformAdmin], code: 201, input: [name, recurring_fee_cents], output: AddOn }
  - { method: GET,  path: "/addons", description: "List add-ons", roles: [PlatformAdmin, AccountHolder], code: 200, input: ["status?", "limit?", "offset?"], output: "AddOn[]" }

  # ---- Accounts & vehicles ----
  - { method: POST, path: "/accounts", description: "Create a billing account (individual or fleet)", roles: [PlatformAdmin, AccountHolder], code: 201, input: [account_type, contact_email, "company_name?"], output: Account }
  - { method: GET,  path: "/accounts/{id}", description: "Get an account incl. wallet_balance_cents and fleet_discount_pct", roles: [PlatformAdmin, AccountHolder, BillingAdmin], code: 200, input: [], output: Account }
  - { method: POST, path: "/accounts/{id}/suspend", description: "Suspend an account (cascades freeze)", roles: [PlatformAdmin], code: 200, input: [], output: Account, side_effects: ["cascade: memberships ACTIVE/PAST_DUE -> FROZEN -> add-ons PAUSED", "increments Account.version by 1"] }
  - { method: POST, path: "/accounts/{id}/reactivate", description: "Reactivate a suspended account", roles: [PlatformAdmin], code: 200, input: [], output: Account, side_effects: ["Account.status -> ACTIVE", "increments Account.version by 1"] }
  - { method: POST, path: "/accounts/{id}/close", description: "Close an account", roles: [PlatformAdmin], code: 200, input: [], output: Account, side_effects: ["Account.status -> CLOSED", "increments Account.version by 1"] }
  - { method: POST, path: "/accounts/{id}/vehicles", description: "Register a vehicle (license plate) under an account", roles: [PlatformAdmin, AccountHolder], code: 201, input: [license_plate, state_code], output: Vehicle, side_effects: ["plate uniqueness per priority 7"] }
  - { method: GET,  path: "/accounts/{id}/vehicles", description: "List vehicles for an account (FK reverse-reachability Vehicle.account_id)", roles: [PlatformAdmin, AccountHolder], code: 200, input: ["status?", "limit?", "offset?"], output: "Vehicle[]" }
  - { method: GET,  path: "/vehicles/{id}", description: "Get a vehicle", roles: [PlatformAdmin, AccountHolder], code: 200, input: [], output: Vehicle }
  - { method: POST, path: "/vehicles/{id}/remove", description: "Remove a vehicle (frees the plate)", roles: [PlatformAdmin, AccountHolder], code: 200, input: [], output: Vehicle, side_effects: ["Vehicle.status -> REMOVED"] }
  - { method: GET,  path: "/vehicles/{id}/usage-intensity", description: "Computed read: chronic & acute usage intensity for a vehicle", roles: [PlatformAdmin, AccountHolder, LocationOperator], code: 200, input: [], output: Vehicle }
  - { method: GET,  path: "/accounts/{id}/wallet-transactions", description: "List wallet ledger for an account (FK reverse-reachability WalletTransaction.account_id)", roles: [PlatformAdmin, AccountHolder, BillingAdmin], code: 200, input: ["reason?", "limit?", "offset?"], output: "WalletTransaction[]" }
  - { method: POST, path: "/accounts/{id}/adjustments", description: "Manual wallet adjustment (signed)", roles: [PlatformAdmin, BillingAdmin], code: 201, input: [amount_cents], output: WalletTransaction, side_effects: ["writes WalletTransaction(reason=MANUAL_ADJUSTMENT)", "recomputes Account.wallet_balance_cents; rejects if it would go below 0"] }

  # ---- Memberships ----
  - { method: POST, path: "/memberships", description: "Enroll a vehicle in a plan (creates PENDING membership + first CYCLE invoice DRAFT->ISSUED)", roles: [PlatformAdmin, AccountHolder], code: 201, input: [account_id, vehicle_id, plan_id], output: Membership, side_effects: ["creates first CYCLE Invoice (DRAFT->ISSUED)", "awaits payment to activate"] }
  - { method: GET,  path: "/memberships/{id}", description: "Get a membership incl. credit_balance, freeze_count", roles: [PlatformAdmin, AccountHolder, BillingAdmin], code: 200, input: [], output: Membership }
  - { method: GET,  path: "/memberships", description: "Filtered list of memberships (FK reverse-reachability for Membership.account_id, Membership.vehicle_id, Membership.plan_id)", roles: [PlatformAdmin, AccountHolder, BillingAdmin], code: 200, input: ["account_id?", "vehicle_id?", "plan_id?", "status?", "limit?", "offset?"], output: "Membership[]" }
  - { method: POST, path: "/memberships/{id}/change-plan", description: "Change plan mid-cycle (creates PRORATION invoice)", roles: [PlatformAdmin, AccountHolder], code: 200, input: [new_plan_id, "add_addon_ids?"], output: Membership, side_effects: ["creates PRORATION Invoice via proration_on_plan_change", "increments Membership.version by 1"] }
  - { method: POST, path: "/memberships/{id}/freeze", description: "Freeze immediately (holder-initiated)", roles: [AccountHolder, PlatformAdmin], code: 200, input: [], output: Membership, side_effects: ["Membership ACTIVE -> FROZEN", "creates ACTIVE Freeze; FREEZE_REFUND to wallet", "add-ons ACTIVE -> PAUSED", "increments Membership.version by 1"] }
  - { method: POST, path: "/memberships/{id}/freeze-scheduled", description: "Schedule a future freeze window", roles: [AccountHolder, PlatformAdmin], code: 201, input: [start_utc, end_utc], output: Freeze, side_effects: ["creates SCHEDULED Freeze after window + overlap validation"] }
  - { method: POST, path: "/memberships/{id}/unfreeze", description: "Thaw a frozen membership", roles: [AccountHolder, PlatformAdmin], code: 200, input: [], output: Membership, side_effects: ["Membership FROZEN -> ACTIVE", "open Freeze -> ENDED", "add-ons PAUSED -> ACTIVE", "increments Membership.version by 1"] }
  - { method: POST, path: "/memberships/{id}/cancel", description: "Schedule cancellation at cycle end (refund now)", roles: [AccountHolder, PlatformAdmin], code: 200, input: [], output: Membership, side_effects: ["Membership ACTIVE -> CANCEL_SCHEDULED", "cancellation_refund to wallet", "increments Membership.version by 1"] }
  - { method: POST, path: "/memberships/{id}/topup", description: "Buy additional SINGLE_WASH credits (paid from wallet, creates TOPUP invoice)", roles: [AccountHolder, PlatformAdmin], code: 201, input: [credit_quantity, expected_membership_version], output: Invoice, side_effects: ["creates TOPUP Invoice", "debits wallet TOPUP_DEBIT", "credits_granted += credit_quantity", "increments Membership.version by 1"] }
  - { method: POST, path: "/memberships/{id}/addons", description: "Attach a recurring add-on (OCC-guarded)", roles: [AccountHolder, PlatformAdmin], code: 201, input: [addon_id, expected_membership_version], output: MembershipAddOn, side_effects: ["creates ACTIVE MembershipAddOn with locked_fee_cents", "increments Membership.version by 1"] }
  - { method: GET,  path: "/membership-addons", description: "Filtered list of membership add-ons (FK reverse-reachability for MembershipAddOn.membership_id, MembershipAddOn.addon_id)", roles: [PlatformAdmin, AccountHolder, BillingAdmin], code: 200, input: ["membership_id?", "addon_id?", "status?", "limit?", "offset?"], output: "MembershipAddOn[]" }
  - { method: GET,  path: "/membership-addons/{id}", description: "Get a membership add-on", roles: [PlatformAdmin, AccountHolder], code: 200, input: [], output: MembershipAddOn }
  - { method: POST, path: "/membership-addons/{id}/detach", description: "Detach a recurring add-on", roles: [AccountHolder, PlatformAdmin], code: 200, input: [], output: MembershipAddOn, side_effects: ["MembershipAddOn -> DETACHED"] }
  - { method: GET,  path: "/memberships/{id}/freezes", description: "List freezes for a membership (FK reverse-reachability Freeze.membership_id)", roles: [PlatformAdmin, AccountHolder], code: 200, input: ["status?", "limit?", "offset?"], output: "Freeze[]" }
  - { method: POST, path: "/freezes/{id}/cancel", description: "Cancel a scheduled freeze", roles: [AccountHolder, PlatformAdmin], code: 200, input: [], output: Freeze, side_effects: ["Freeze SCHEDULED -> CANCELLED"] }

  # ---- Wash events (LPR) ----
  - { method: POST, path: "/wash-events", description: "LPR entry: site recognizes a plate and the system admits or rejects", roles: [LocationOperator, PlatformAdmin], code: 201, input: [location_id, license_plate, state_code], output: WashEvent, side_effects: ["resolves vehicle+membership by plate", "admits or rejects per §1.4 priority chain", "SINGLE_WASH: consumes a credit on admit", "updates last_admitted_wash_utc"] }
  - { method: GET,  path: "/wash-events/{id}", description: "Get a wash event", roles: [LocationOperator, PlatformAdmin, AccountHolder], code: 200, input: [], output: WashEvent }
  - { method: GET,  path: "/wash-events", description: "Filtered list of wash events (FK reverse-reachability for WashEvent.membership_id, WashEvent.vehicle_id, WashEvent.location_id)", roles: [PlatformAdmin, LocationOperator, AccountHolder], code: 200, input: ["membership_id?", "vehicle_id?", "location_id?", "status?", "limit?", "offset?"], output: "WashEvent[]" }
  - { method: POST, path: "/wash-events/{id}/complete", description: "Mark an admitted wash complete", roles: [LocationOperator, PlatformAdmin], code: 200, input: [], output: WashEvent, side_effects: ["WashEvent ADMITTED -> COMPLETED"] }

  # ---- Invoices & billing ----
  - { method: GET,  path: "/invoices/{id}", description: "Get an invoice incl. total_cents breakdown", roles: [PlatformAdmin, AccountHolder, BillingAdmin], code: 200, input: [], output: Invoice }
  - { method: GET,  path: "/invoices", description: "Filtered list of invoices (FK reverse-reachability for Invoice.account_id, Invoice.membership_id)", roles: [PlatformAdmin, AccountHolder, BillingAdmin], code: 200, input: ["account_id?", "membership_id?", "status?", "kind?", "limit?", "offset?"], output: "Invoice[]" }
  - { method: POST, path: "/invoices/{id}/retry", description: "Retry a failed invoice charge", roles: [BillingAdmin, PlatformAdmin], code: 200, input: [], output: Invoice, side_effects: ["Invoice FAILED -> RETRYING", "attempt_count += 1"] }
  - { method: POST, path: "/invoices/{id}/write-off", description: "Write off a failed invoice past max attempts", roles: [BillingAdmin, PlatformAdmin], code: 200, input: [], output: Invoice, side_effects: ["Invoice FAILED -> WRITTEN_OFF"] }
  - { method: POST, path: "/invoices/{id}/void", description: "Void an issued proration invoice", roles: [BillingAdmin, PlatformAdmin], code: 200, input: [], output: Invoice, side_effects: ["Invoice ISSUED -> VOID"] }
  - { method: POST, path: "/billing/run", description: "Run the recurring billing cycle for memberships whose cycle has elapsed (issues CYCLE invoices, flips CANCEL_SCHEDULED->CANCELLED)", roles: [BillingAdmin, PlatformAdmin], code: 200, input: ["membership_id?"], output: "Invoice[]", side_effects: ["per due membership: creates CYCLE Invoice; grants credits/advances anchor on PAID; ACTIVE->PAST_DUE on FAILED; CANCEL_SCHEDULED->CANCELLED at cycle end"] }

  # ---- Test-driving endpoints (/_ namespace) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server clock; activates due SCHEDULED freezes and ends elapsed ACTIVE freezes", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["advances clock; fires Freeze SCHEDULED->ACTIVE and ACTIVE->ENDED transitions"] }
  - { method: POST, path: "/_payments/simulate", description: "Resolve an ISSUED/RETRYING invoice charge deterministically", roles: [PlatformAdmin, BillingAdmin], code: 200, input: [invoice_id, outcome], output: Invoice, side_effects: ["outcome=SUCCEEDED: -> PAID (+ membership activation/reactivation cascades); outcome=DECLINED: -> FAILED (+ ACTIVE->PAST_DUE)"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,    http: 401, condition: "Missing/malformed X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_FORBIDDEN,          http: 403, condition: "Authenticated role not permitted for this operation, or holder acting on an account it does not own" }
  - { id: ERR_NOT_FOUND,          http: 404, condition: "Path-referenced resource id does not exist" }
  - { id: ERR_FK_NOT_FOUND,       http: 404, condition: "Body foreign key references a non-existent row" }
  - { id: ERR_INVALID_REQUEST,    http: 422, condition: "Missing required field, bad type, or invalid enum value" }
  - { id: ERR_PLAN_SHAPE_INVALID, http: 422, condition: "Plan field combination violates tier_type rules (credits/fee/cooldown)" }
  - { id: ERR_INVALID_WINDOW,     http: 422, condition: "Freeze end_utc not strictly after start_utc" }
  - { id: ERR_PLATE_TAKEN,        http: 409, condition: "license_plate already in use by an ACTIVE vehicle" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Operation requires Account.status==ACTIVE but it is SUSPENDED/CLOSED" }
  - { id: ERR_INVALID_STATE,      http: 409, condition: "Target entity not in a legal from-state for the requested transition" }
  - { id: ERR_RESOURCE_RETIRED,   http: 409, condition: "Referenced Plan or AddOn is RETIRED" }
  - { id: ERR_FREEZE_OVERLAP,     http: 409, condition: "Requested freeze window overlaps an existing non-CANCELLED freeze (half-open)" }
  - { id: ERR_COOLDOWN_ACTIVE,    http: 409, condition: "UNLIMITED wash admission within wash_cooldown_hours of the last admitted wash" }
  - { id: ERR_CAPACITY_FULL,      http: 409, condition: "Location daily_wash_capacity reached for the current UTC day" }
  - { id: ERR_ADDON_LIMIT,        http: 409, condition: "Attaching the add-on would exceed Plan.max_addons" }
  - { id: ERR_NO_CREDITS,         http: 409, condition: "SINGLE_WASH wash admission with credit_balance < 1" }
  - { id: ERR_INSUFFICIENT_WALLET,http: 409, condition: "Wallet debit would drive wallet_balance_cents below 0" }
  - { id: ERR_NO_MEMBERSHIP,      http: 409, condition: "LPR-recognized plate has no ACTIVE membership (vehicle unenrolled or membership not ACTIVE)" }
  - { id: ERR_LOCATION_CLOSED,    http: 409, condition: "Wash admission attempted at a CLOSED location" }
  - { id: ERR_OUT_OF_NETWORK,     http: 409, condition: "Wash admission at an out-of-network location that does not honor the membership" }
  - { id: ERR_STALE_VERSION,      http: 412, condition: "expected_membership_version does not match Membership.version (OCC)" }
  - { id: ERR_VALIDATION,         http: 422, condition: "Generic body validation failure not covered by a more specific 422 (e.g. negative amount, credit_quantity<1)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator that configures plans/locations/add-ons, drives the clock and payment simulation, and may perform any account/membership operation"
    identity: "opaque"
    exclusive_operations:
      - "POST /plans, POST /plans/{id}/retire, POST /locations, POST /addons"
      - "POST /accounts/{id}/suspend, /reactivate, /close"
      - "POST /_clock/set_current_utc, POST /_payments/simulate"
    shared_operations:
      - "all account/vehicle/membership/wash/invoice operations (superset)"

  - name: AccountHolder
    description: "End customer that owns one or more accounts; manages its own vehicles, memberships, freezes, add-ons, and top-ups"
    identity: "entity_backed:Account"
    exclusive_operations: []
    shared_operations:
      - "POST /accounts, GET /accounts/{id}"
      - "POST /accounts/{id}/vehicles, GET .../vehicles, POST /vehicles/{id}/remove"
      - "POST /memberships and all /memberships/{id}/* lifecycle (change-plan, freeze, freeze-scheduled, unfreeze, cancel, topup, addons)"
      - "POST /membership-addons/{id}/detach, POST /freezes/{id}/cancel"
      - "GET reads on owned accounts/vehicles/memberships/invoices/wallet/wash-events"
    note: "X-User-ID must equal the Account.id that owns the targeted resource; otherwise ERR_FORBIDDEN."

  - name: LocationOperator
    description: "Site staff/camera identity that submits LPR wash entries and completes washes at locations"
    identity: "opaque"
    exclusive_operations:
      - "POST /wash-events, POST /wash-events/{id}/complete"
    shared_operations:
      - "GET /locations, GET /locations/{id}, GET location/vehicle/membership wash-event lists, GET /vehicles/{id}/usage-intensity"

  - name: BillingAdmin
    description: "Finance operator that runs billing cycles and manages invoice retries/write-offs/voids and wallet adjustments"
    identity: "opaque"
    exclusive_operations:
      - "POST /billing/run, POST /invoices/{id}/retry, /write-off, /void"
    shared_operations:
      - "POST /accounts/{id}/adjustments"
      - "GET reads on accounts/memberships/invoices/wallet-transactions/plans"
