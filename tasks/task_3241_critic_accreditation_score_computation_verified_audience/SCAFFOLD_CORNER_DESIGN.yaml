# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3241_critic_accreditation_score_computation_verified_audience
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Shared setup anchors are defined once below and referenced with YAML aliases.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: title_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Title
          - endpoints.POST_/titles
        distinguishing_aspect: "A title created with only canonical_name and release_year comes back 201 with posture SETUP, version 1, and system-generated id / created_at / updated_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_title
              call: "POST /titles"
              payload: { canonical_name: "Glass Harbor", release_year: 2026 }
              as: PlatformAdmin
              captures: { t1: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Title.${t1}.canonical_name == \"Glass Harbor\" and release_year == 2026"
            - "Title.${t1}.posture == SETUP and version == 1"
            - "the response data carries non-null id, created_at and updated_at"

      - name: critic_create_omitting_is_top_critic_defaults_false
        claim_type: Defaults
        grounds:
          - entities.Critic.fields.is_top_critic
          - endpoints.POST_/critics
        distinguishing_aspect: "is_top_critic is optional with default false; a create omitting it returns is_top_critic == false and accreditation_status == APPLIED."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; publication P1 exists (status PENDING)."
          setup_api_calls:
            - *c_clock
            - &c_pub
              call: "POST /publications"
              payload: { outlet_name: "Metro Film Journal", reach_tier: "NATIONAL" }
              as: PlatformAdmin
              captures: { pub1: $.data.id }
          trigger:
            - &c_ca
              call: "POST /critics"
              payload: { full_name: "Critic A", publication_id: "${pub1}" }
              as: PlatformAdmin
              captures: { ca: $.data.id }
          assert:
            - "Critic.${ca}.is_top_critic == false"
            - "Critic.${ca}.accreditation_status == APPLIED"

      - name: review_create_extra_version_field_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.CriticReview
          - endpoints.POST_/releases/{id}/reviews
        distinguishing_aspect: "Client-supplied system fields (version, published_at) in the create body are ignored; the created review has version 1 and null published_at."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA ACCREDITED; Title OPEN; Release R1 OPEN with embargo lifted."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - &c_rel
              call: "POST /titles/${t1}/releases"
              payload: { cut_label: "THEATRICAL", theatrical_window_start: "2026-09-01T00:00:00Z", theatrical_window_end: "2026-10-01T00:00:00Z", embargo_until: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
          trigger:
            - call: "POST /releases/${r1}/reviews"
              payload: { critic_id: "${ca}", body_text: "Fine film.", self_designation: "FRESH" }
              as: Critic
              as_user_id: "${ca}"
              captures: { rv: $.data.id }
          assert:
            - "CriticReview.${rv}.status == INGESTED and version == 1"
            - "CriticReview.${rv}.published_at is null until publish"

      - name: get_release_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/releases/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but unknown release id returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /releases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 with error_id == ERR_NOT_FOUND and response_type == error"

      - name: disputes_list_paginates_with_limit_offset_total_count_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/disputes
          - response_envelope.pagination_fields
        distinguishing_aspect: "The filtered dispute list honors limit/offset and reports total_count and has_more per the fixed pagination contract."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA and CC ACCREDITED; R1 OPEN with embargo lifted; CA publishes one FRESH review RA; CC files two CLASSIFICATION disputes (RA gets flagged by the first; the second dispute is a SCORE_DISPLAY dispute on R1 by a studio so both coexist)."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - &c_cc
              call: "POST /critics"
              payload: { full_name: "Critic C", publication_id: "${pub1}", is_top_critic: false }
              as: PlatformAdmin
              captures: { cc: $.data.id }
            - call: "POST /critics/${cc}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - &c_ra
              call: "POST /releases/${r1}/reviews"
              payload: { critic_id: "${ca}", body_text: "A triumph.", self_designation: "FRESH" }
              as: Critic
              as_user_id: "${ca}"
              captures: { ra: $.data.id }
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - call: "POST /disputes"
              payload: { dispute_kind: "CLASSIFICATION", subject_review_id: "${ra}", filed_by_critic_id: "${cc}", requested_classification: "ROTTEN" }
              as: Critic
              as_user_id: "${cc}"
            - call: "POST /disputes"
              payload: { dispute_kind: "SCORE_DISPLAY", subject_release_id: "${r1}", filed_by_studio: "Harbor Pictures" }
              as: StudioRep
          trigger:
            - call: "GET /disputes?limit=1&offset=0"
              as: AccreditationBoard
          assert:
            - "the response data is an array of length 1 with total_count == 2 and has_more == true (pagination params travel as query parameters per the fixed envelope)"

      - name: release_create_with_invalid_cut_enum_value_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.CriticReview.fields.self_designation
          - validations[priority=4]
        distinguishing_aspect: "An enum field outside its declared set (self_designation: \"MEH\") is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA ACCREDITED; R1 OPEN with embargo lifted."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
          trigger:
            - call: "POST /releases/${r1}/reviews"
              payload: { critic_id: "${ca}", body_text: "Ambivalent.", self_designation: "MEH" }
              as: Critic
              as_user_id: "${ca}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id == ERR_INVALID_REQUEST"

      - name: accreditation_review_with_both_subjects_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.AccreditationReview
          - validations[priority=4]
        distinguishing_aspect: "Exactly one of subject_critic_id / subject_publication_id must be set; supplying both is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 exists; CA exists under P1."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - *c_ca
          trigger:
            - call: "POST /accreditation-reviews"
              payload: { subject_critic_id: "${ca}", subject_publication_id: "${pub1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: AccreditationBoard
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id == ERR_INVALID_REQUEST"

      - name: audience_member_id_used_as_rating_owner_binding
        claim_type: Parent Relationships
        grounds:
          - entities.AudienceRating.fields.audience_member_id
          - endpoints.POST_/releases/{id}/audience-ratings
        distinguishing_aspect: "A rating whose audience_member_id differs from the caller's X-User-ID is rejected 403 ERR_FORBIDDEN — the body FK must bind to the entity-backed caller."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Title OPEN; R1 OPEN; members M1 and M2 registered."
          setup_api_calls:
            - *c_clock
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - &c_m1
              call: "POST /audience-members"
              payload: { email: "m01@x.com", display_name: "M01" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - &c_m2
              call: "POST /audience-members"
              payload: { email: "m02@x.com", display_name: "M02" }
              as: PlatformAdmin
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /releases/${r1}/audience-ratings"
              payload: { audience_member_id: "${m2}", stars: 4 }
              as: AudienceMember
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 with error_id == ERR_FORBIDDEN"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: release_close_is_terminal_and_reopen_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Release
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED is terminal for Release: a second transition (OPEN) from CLOSED fails 409 ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Title OPEN; R1 OPEN then CLOSED."
          setup_api_calls:
            - *c_clock
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /releases/${r1}/transition"
              payload: { action: "CLOSE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_INVALID_STATE"
            - "Release.${r1}.status remains CLOSED"

      - name: dispute_terminal_rejects_all_further_actions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Dispute
          - errors[ERR_DISPUTE_ALREADY_TERMINAL]
        distinguishing_aspect: "From UPHELD (terminal), every dispute action — including TRIAGE — fails 409 ERR_DISPUTE_ALREADY_TERMINAL."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA, CC ACCREDITED; R1 OPEN, embargo lifted; CA publishes RA; CC files CLASSIFICATION dispute D1; D1 TRIAGED then RULE_UPHOLD."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_cc
            - call: "POST /critics/${cc}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *c_ra
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - &c_d1
              call: "POST /disputes"
              payload: { dispute_kind: "CLASSIFICATION", subject_review_id: "${ra}", filed_by_critic_id: "${cc}", requested_classification: "ROTTEN" }
              as: Critic
              as_user_id: "${cc}"
              captures: { d1: $.data.id }
            - call: "POST /disputes/${d1}/transition"
              payload: { action: "TRIAGE" }
              as: AccreditationBoard
            - call: "GET /disputes/${d1}"
              as: AccreditationBoard
              captures: { d1_v: $.data.version }
            - call: "POST /disputes/${d1}/transition"
              payload: { action: "RULE_UPHOLD", expected_dispute_version: "${d1_v}" }
              as: AccreditationBoard
          trigger:
            - call: "POST /disputes/${d1}/transition"
              payload: { action: "TRIAGE" }
              as: AccreditationBoard
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_DISPUTE_ALREADY_TERMINAL"

      - name: review_publish_sets_published_at_from_logical_clock
        claim_type: side_effect_execution
        grounds:
          - state_machines.CriticReview.INGESTED_to_PUBLISHED
          - entities.CriticReview.fields.published_at
        distinguishing_aspect: "PUBLISH stamps published_at with the current logical clock, not wall-clock: publishing at 2026-09-02T12:00:00Z yields exactly that timestamp."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA ACCREDITED; R1 OPEN with embargo_until 2026-09-01T00:00:00Z; CA ingests RA."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *c_ra
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
          assert:
            - "CriticReview.${ra}.published_at == 2026-09-02T12:00:00Z"

      - name: bombing_confirm_suspends_display_and_resolve_restores
        claim_type: side_effect_execution
        grounds:
          - state_machines.BombingIncident.OPEN_to_CONFIRMED
          - state_machines.BombingIncident.CONFIRMED_to_RESOLVED
          - entities.Release.fields.audience_display_suspended
        distinguishing_aspect: "CONFIRM flips Release.audience_display_suspended false->true; RESOLVE flips it back true->false; DISMISS on an OPEN incident never touches the flag."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Title OPEN; R1 OPEN."
          setup_api_calls:
            - *c_clock
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - &c_bi
              call: "POST /releases/${r1}/bombing-incidents"
              as: PlatformAdmin
              captures: { bi: $.data.id }
          trigger:
            - call: "POST /bombing-incidents/${bi}/transition"
              payload: { action: "CONFIRM" }
              as: PlatformAdmin
            - call: "GET /releases/${r1}"
              as: PlatformAdmin
              captures: { susp: $.data.audience_display_suspended }
            - call: "POST /bombing-incidents/${bi}/transition"
              payload: { action: "RESOLVE" }
              as: PlatformAdmin
            - call: "GET /releases/${r1}"
              as: PlatformAdmin
          assert:
            - "after CONFIRM: Release.${r1}.audience_display_suspended == true"
            - "after RESOLVE: Release.${r1}.audience_display_suspended == false"
            - "BombingIncident.${bi}.status == RESOLVED"

      - name: withdraw_on_ingested_review_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.CriticReview
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "WITHDRAW is only declared from PUBLISHED and FLAGGED; from INGESTED it fails 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA ACCREDITED; R1 OPEN, embargo lifted; CA ingests RA (still INGESTED)."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *c_ra
          trigger:
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "WITHDRAW" }
              as: Critic
              as_user_id: "${ca}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_INVALID_STATE"
            - "CriticReview.${ra}.status remains INGESTED"

      - name: upheld_publication_review_terminal_states_lock
        claim_type: invalid_transition
        grounds:
          - state_machines.AccreditationReview
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "AccreditationReview terminal states {UPHELD, REVOKED, DISMISSED} reject further transitions with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA ACCREDITED; review AR on CA FILED -> IN_REVIEW -> UPHELD."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - &c_ar
              call: "POST /accreditation-reviews"
              payload: { subject_critic_id: "${ca}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: AccreditationBoard
              captures: { ar: $.data.id }
            - call: "POST /accreditation-reviews/${ar}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: AccreditationBoard
            - call: "POST /accreditation-reviews/${ar}/transition"
              payload: { action: "RULE_UPHOLD" }
              as: AccreditationBoard
          trigger:
            - call: "POST /accreditation-reviews/${ar}/transition"
              payload: { action: "DISMISS" }
              as: AccreditationBoard
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_INVALID_STATE"
            - "AccreditationReview.${ar}.status remains UPHELD"

      - name: embargo_and_priority_conflict_instances
        claim_type: invalid_transition
        grounds:
          - validations[priority=7]
        excluded_because:
          difficulty_instance: boundary_precision_check / embargo_publish_allowed_at_exact_lift_instant
          rationale: "Embargo rejection and its exact-boundary acceptance are asserted as the failure/success pair of the named §1.8 instance."

      - name: ticket_window_miss_instance
        claim_type: invalid_transition
        grounds:
          - validations[priority=11]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / ticket_showtime_closed_interval_endpoints_inclusive
          rationale: "ERR_VERIFICATION_WINDOW_MISS is asserted as the failure path of the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: audience_score_verified_only_counts_four_plus_stars
        claim_type: correct_result
        grounds:
          - calculations.audience_score
        distinguishing_aspect: "With one 5-star VERIFIED, one 4-star VERIFIED and one 3-star VERIFIED rating, the verified audience score is round_half_up(100*2/3) == 67; the 3-star rating does not count as positive (POSITIVE_STAR_THRESHOLD == 4)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Title OPEN; R1 OPEN, theatrical window covering 2026-09-02T00:00:00Z."
            - "Members M1, M2, M3 each hold a VERIFIED ticket verification for R1 and a rating of 5, 4 and 3 stars respectively, all VERIFY-transitioned."
          setup_api_calls:
            - *c_clock
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *c_m1
            - *c_m2
            - &c_m3
              call: "POST /audience-members"
              payload: { email: "m03@x.com", display_name: "M03" }
              as: PlatformAdmin
              captures: { m3: $.data.id }
            - &c_tv1
              call: "POST /releases/${r1}/ticket-verifications"
              payload: { audience_member_id: "${m1}", showtime_at: "2026-09-02T00:00:00Z", exhibitor_code: "AMC" }
              as: AudienceMember
              as_user_id: "${m1}"
              captures: { tv1: $.data.id }
            - call: "POST /ticket-verifications/${tv1}/transition"
              payload: { action: "VERIFY" }
              as: PlatformAdmin
