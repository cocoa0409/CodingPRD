  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: flsa_threshold_exactly_204_hours_yields_zero_overtime
        grounds:
          - calculations.flsa_work_period_overtime
          - calculations.work_period_hour_ledger
          - entities.WorkPeriod.fields.projected_flsa_overtime_hours
          - endpoints["POST /fire-ops/work-periods/{work_period_id}/hour-adjustment"]
        distinguishing_aspect: |
          The metric is the FLSA 7(k) 204-hour threshold and the endpoint is the
          hour-adjustment endpoint: landing exactly on 204 must yield 0 overtime
          hours and 0 premium cents, and the very next hour must yield 1 hour
          priced at 2119 cents, proving round_half_up on 2118.5.
        test_recipe:
          setup:
            - "Station 52 with one company ENGINE-52 (minimum_crew_size 1, no required certifications) and a staffing floor of 1."
            - "Member ff52a on platoon C, Kelly 1, hourly rate 4237 cents, with the default work period 2026-08-01 .. 2026-08-27 and flsa_threshold_hours 204."
            - "The member holds one REGULAR 24-hour seat on the published 2026-08-11 shift, so scheduled_hours == 24."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 52", battalion_code: "B8", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 9000000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st52: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st52}", unit_designation: "ENGINE-52", apparatus_type: "ENGINE", minimum_crew_size: 1, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng52: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st52}", full_name: "X Xu", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4237 }
              as: StaffingOfficer
              captures: { ff52a: "$.data.id" }
            - call: "GET /fire-ops/work-periods"
              payload: { firefighter_id: "${ff52a}" }
              as: PayrollAnalyst
              captures: { wp52a: "$.data[0].id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st52}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh52: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh52}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh52_v: "$.data.version" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh52}", firefighter_id: "${ff52a}", apparatus_id: "${eng52}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh52_v}" }
              as: CompanyOfficer
              as_user_id: "${ff52a}"
          trigger:
            - call: "POST /fire-ops/work-periods/${wp52a}/hour-adjustment"
              payload: { adjustment_hours: 180, adjustment_basis: "SCHEDULED", reason: "carry-in hours to land exactly on the 7(k) threshold" }
              as: PayrollAnalyst
            - call: "POST /fire-ops/work-periods/${wp52a}/hour-adjustment"
              payload: { adjustment_hours: 1, adjustment_basis: "SCHEDULED", reason: "one hour past the 7(k) threshold" }
              as: PayrollAnalyst
          assert:
            - "AT the threshold: WorkPeriod.${wp52a}.adjusted_scheduled_hours == 204 and flsa_threshold_hours == 204"
            - "AT the threshold: projected_flsa_overtime_hours == 0 and flsa_premium_cents == 0 — max(0, 204 - 204) is not overtime"
            - "AT threshold+1: adjusted_scheduled_hours == 205 and projected_flsa_overtime_hours == 1"
            - "AT threshold+1: flsa_premium_cents == 2119 — round_half_up(4237 * 0.5 * 1) rounds 2118.5 up, not to 2118"
            - "WorkPeriod.${wp52a}.status == \"OPEN\" and final_flsa_overtime_hours == null throughout"
            - "Both calls return HTTP 200 — the 288-hour cap at priority 16 is untouched at 205 hours"

      - name: forecast_and_academy_signal_on_zero_vacancy_horizon
        grounds:
          - calculations.station_overtime_forecast
          - calculations.academy_hiring_signal
          - endpoints["GET /fire-ops/stations/{station_id}/overtime-forecast"]
          - endpoints["GET /fire-ops/stations/{station_id}/academy-hiring-signal"]
        distinguishing_aspect: |
          A different boundary metric on different endpoints from the 204-hour
          case: the empty-collection / zero-count edge. With no duty shifts at
          all, both analytics reads must return 0 rather than dividing by zero,
          yet shift_base_cents must still be a real 144036 cents derived from the
          single roster member.
        test_recipe:
          setup:
            - "Station 53 with a 9,000,000-cent budget over 2026-08-01 .. 2026-09-30 and a staffing floor of 1."
            - "One company ENGINE-53 with minimum_crew_size 1 and no required certifications."
            - "Exactly one ACTIVE member at 4001 cents/hour, so avg_rate_cents == 4001 and shift_base_cents == 144036."
            - "NO duty shifts exist, so there are zero horizon vacancies, zero injury-leave members and zero realised spend."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 53", battalion_code: "B8", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 9000000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st53: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st53}", unit_designation: "ENGINE-53", apparatus_type: "ENGINE", minimum_crew_size: 1, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng53: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st53}", full_name: "Y Yates", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4001 }
              as: StaffingOfficer
              captures: { ff53a: "$.data.id" }
          trigger:
            - call: "GET /fire-ops/stations/${st53}/overtime-forecast"
              payload: { method: "VACANCY_DRIVEN" }
              as: PayrollAnalyst
            - call: "GET /fire-ops/stations/${st53}/academy-hiring-signal"
              payload: {}
              as: PayrollAnalyst
          assert:
            - "Forecast: HTTP 200, horizon_vacancy_count == 0, vacancy_driver_cents == 0, injury_headcount == 0, injury_driver_cents == 0, forecast_cents == 0"
            - "Forecast: avg_rate_cents == 4001 and shift_base_cents == 144036 — the zero-count guard must not zero out the rate basis"
            - "Forecast: projected_period_total_cents == 0, variance_cents == 9000000, forecast_posture == \"WITHIN\""
            - "Academy signal: open_vacancy_seats == 0, injury_headcount == 0, raw_need == 0, recommended_recruit_count == 0, signal_tier == \"NONE\""
            - "Neither response is a 500 and neither divides by a zero denominator"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: leave_revoke_blocked_by_filled_backfill_vacancy
        grounds:
          - validations[priority=9].rules.ERR_LEAVE_ALREADY_BACKFILLED
          - state_machines.LeaveRequest.APPROVED_to_REVOKED
          - entities.Vacancy.fields.status
          - entities.LeaveRequest.fields.backfill_vacancy_id
          - endpoints["POST /fire-ops/leave-requests/{leave_request_id}/revoke"]
        distinguishing_aspect: |
          The LeaveRequest -> Vacancy pair: revoking approved leave is legal only
          while the vacancy it spawned is still OPEN. Because a replacement was
          already hired, the Vacancy sits in FILLED and the revoke must fail even
          though the LeaveRequest's own state (APPROVED) permits the transition.
        test_recipe:
          setup:
            - "Station 54 with staffing floor 1, a 9,000,000-cent budget, one company ENGINE-54 (minimum_crew_size 2, no required certifications) and a VOLUNTARY_OT roster scoped NONE."
            - "Members ff54a (platoon C, Kelly 1, seniority 1, rate 4000) and ff54b (platoon C, Kelly 2, seniority 2, rate 4000) hold the two REGULAR seats on the published 2026-08-11 shift; ff54c (seniority 9) is the deciding company officer; ff54d (platoon C, Kelly 4, rate 4000) is available for overtime."
            - "ff54a's VACATION leave was adjudicated and APPROVED, relieving the seat and minting a LEAVE-driver vacancy."
            - "ff54d then accepted a 144000-cent VOLUNTARY offer against that vacancy, so it is FILLED and the shift is STAFFED again."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 54", battalion_code: "B9", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 9000000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
