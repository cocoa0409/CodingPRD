  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (3 instances, different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: file_release_requires_originator_active
        grounds:
          - state_machines.AchFile.WAREHOUSED_to_RELEASED
          - state_machines.Originator.ACTIVE_to_WATCH
          - errors[ERR_ORIGINATOR_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair AchFile -> Originator: release is gated on the originator being
          ACTIVE; after the originator moves to WATCH the release of its
          otherwise-valid file is rejected with ERR_ORIGINATOR_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Originator ACTIVE; WAREHOUSED file effective 2026-08-03 with 1 DEBIT entry 100000; originator then moved to WATCH"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Omicron Ltd", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 100000, receiver_account: "o-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/originators/${org_id}/risk-cases"
              payload: {}
              as: OdfiRiskOfficer
              captures: { rc_id: "$.data.id" }
            - call: "POST /ach/risk-cases/${rc_id}/resolve"
              payload: { action: "WATCH" }
              as: OdfiRiskOfficer
          trigger:
            - call: "POST /ach/ach-files/${f_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_ORIGINATOR_NOT_ACTIVE (http 409)"
            - "AchFile.${f_id}.status == WAREHOUSED (unchanged)"

      - name: reversal_requires_entry_settled
        grounds:
          - "endpoints(POST /ach/ach-entries/{id}/reversals)"
          - state_machines.AchEntry
          - errors[ERR_ENTRY_NOT_SETTLED]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair ReversalRequest -> AchEntry: reversal creation requires the
          entry to be SETTLED; a merely TRANSMITTED entry (dispatched, not yet
          settled) rejects with ERR_ENTRY_NOT_SETTLED — different entity pair
          than AchFile -> Originator.
        test_recipe:
          setup:
            - "Originator ACTIVE; file with 1 DEBIT entry 100000 released and dispatched (entry TRANSMITTED, not settled)"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Pi Corp", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 100000, receiver_account: "p-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${f_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b_id: "$.data.settlement_batch_id" }
            - call: "POST /ach/settlement-batches/${b_id}/advance"
              payload: { action: "DISPATCH" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "GET /ach/ach-files/${f_id}/entries"
              payload: {}
              as: OdfiOperations
              captures: { e_id: "$.data[0].id" }
          trigger:
            - call: "POST /ach/ach-entries/${e_id}/reversals"
              payload: { reason: "DUPLICATE_ENTRY" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_ENTRY_NOT_SETTLED (http 409)"
            - "GET /ach/ach-entries/${e_id}/reversal-requests returns empty list"

      - name: risk_resolution_requires_originator_status
        grounds:
          - state_machines.RiskCase.OPEN_to_RESOLVED
          - state_machines.Originator.SUSPENDED_to_WATCH
          - errors[ERR_RESOLUTION_NOT_APPLICABLE]
        distinguishing_aspect: |
          Pair RiskCase -> Originator: the WATCH resolution is only applicable
          when the originator is ACTIVE; against a SUSPENDED originator it
          fails with ERR_RESOLUTION_NOT_APPLICABLE while REINSTATE would
          succeed — the valid resolution set is sibling-state-dependent.
        test_recipe:
          setup:
            - "Originator ACTIVE -> SUSPENDED via first risk case; second OPEN risk case exists"
          setup_api_calls:
            - call: "POST /ach/originators"
              payload: { legal_name: "Rho Inc", sec_codes_allowed: ["PPD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 5000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/originators/${org_id}/risk-cases"
              payload: {}
              as: OdfiRiskOfficer
              captures: { rc1: "$.data.id" }
            - call: "POST /ach/risk-cases/${rc1}/resolve"
              payload: { action: "SUSPEND" }
              as: OdfiRiskOfficer
            - call: "POST /ach/originators/${org_id}/risk-cases"
              payload: {}
              as: OdfiRiskOfficer
              captures: { rc2: "$.data.id" }
          trigger:
            - call: "POST /ach/risk-cases/${rc2}/resolve"
              payload: { action: "WATCH" }
              as: OdfiRiskOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_RESOLUTION_NOT_APPLICABLE (http 409) — WATCH requires ACTIVE, originator is SUSPENDED"
            - "RiskCase.${rc2}.status == OPEN (still resolvable with a valid action)"
            - "Originator.${org_id}.status == SUSPENDED (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: cutoff_window_half_open_adjacency
        grounds:
          - errors[ERR_WINDOW_OVERLAP]
          - validations[priority=10]
          - entities.CutoffWindow.fields.opens_at_utc
          - entities.CutoffWindow.fields.closes_at_utc
        distinguishing_aspect: |
          Interval semantics: half-open [opens, closes) geometric overlap on
          the daily-schedule resource. 11:00-14:00 collides with 09:00-12:00
          and is rejected; 12:00-15:00 merely ADJACENT (touching at 12:00) is
          accepted — gap == 0 is not a collision.
        test_recipe:
          setup:
            - "One CutoffWindow SAME_DAY_1 09:00-12:00 exists"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "SAME_DAY_1", opens_at_utc: "09:00", closes_at_utc: "12:00", per_entry_fee_cents: 150, file_fee_cents: 500, large_entry_surcharge_cents: 400 }
              as: OdfiOperations
          trigger:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "SAME_DAY_2", opens_at_utc: "11:00", closes_at_utc: "14:00", per_entry_fee_cents: 130, file_fee_cents: 450, large_entry_surcharge_cents: 300 }
              as: OdfiOperations
              captures: { err: "$.data.error_id" }
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "SAME_DAY_2", opens_at_utc: "12:00", closes_at_utc: "15:00", per_entry_fee_cents: 130, file_fee_cents: 450, large_entry_surcharge_cents: 300 }
              as: OdfiOperations
              captures: { w2_id: "$.data.id" }
          assert:
            - "err == ERR_WINDOW_OVERLAP (http 409) for 11:00-14:00 against 09:00-12:00"
            - "Adjacent 12:00-15:00 succeeds: CutoffWindow.${w2_id}.window_kind == SAME_DAY_2 (gap == 0 allowed)"

      - name: exposure_aggregate_capacity_equality
        grounds:
          - calculations.outstanding_exposure
          - errors[ERR_EXPOSURE_LIMIT_EXCEEDED]
          - validations[priority=11]
        distinguishing_aspect: |
          Interval semantics: AGGREGATE CAPACITY (not geometric adjacency) on
          the Originator debit-exposure resource — appends accumulate against
          exposure_limit_cents and the append that would push the aggregate
          strictly past the limit is rejected, while the append landing exactly
          AT the limit is admitted. Different resource and different semantics
          than the cutoff-window rule.
        test_recipe:
          setup:
            - "Originator ACTIVE, limit 10000000; file req NEXT_DAY effective 2026-08-03; DEBIT 6000000 already appended"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Sigma SA", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v1: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v1}"
                entries:
                  - { direction: "DEBIT", amount_cents: 6000000, receiver_account: "s-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_v2: "$.data.version" }
          trigger:
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v2}"
                entries:
                  - { direction: "DEBIT", amount_cents: 4000000, receiver_account: "s-2", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_v3: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v3}"
                entries:
                  - { direction: "DEBIT", amount_cents: 1, receiver_account: "s-3", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Append landing exactly at the limit (6000000 + 4000000 == 10000000) is ADMITTED"
            - "err == ERR_EXPOSURE_LIMIT_EXCEEDED (http 422) for the append that crosses to 10000001"
            - "Originator.${org_id}.outstanding_exposure_debit_cents == 10000000"
            - "AchFile.${f_id}.entry_count == 2"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: gl_trial_balance_holds_across_return_and_represent
        grounds:
          - entities.GlPosting.fields.debit_cents
          - entities.GlPosting.fields.credit_cents
          - state_machines.SettlementBatch.DISPATCHED_to_SETTLED
          - calculations.batch_settlement_net
        distinguishing_aspect: |
          Conserved quantity: the double-entry trial balance. After a settle
          that sweeps a return (DR/CR pair 2000000), a re-presentment
          (pair 2000000), a fresh settlement (pair 700000) and a fee
          (pair 260), the batch holds exactly 8 GlPosting rows with
          sum(debit_cents) == sum(credit_cents) == 4700260 — every forward
          action's postings are matched by their compensating legs.
        test_recipe:
          setup:
            - "Originator ACTIVE, limit 100000000, discount 0; NEXT_DAY window (60/200/100)"
            - "B1 settles entry X (DEBIT 2000000); X returned R01 and re-presented BEFORE B2 dispatch (so both sweep items are inside B2's expected_net)"
            - "B2 carries file F2 (entry Y DEBIT 700000, fee 260)"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Tau Ltd", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 100000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f1_id: "$.data.id", f1_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f1_id}/entries"
              payload:
                expected_file_version: "${f1_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 2000000, receiver_account: "t-x", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${f1_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b1_id: "$.data.settlement_batch_id" }
            - call: "POST /ach/settlement-batches/${b1_id}/advance"
              payload: { action: "DISPATCH" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/settlement-batches/${b1_id}/advance"
              payload: { action: "SETTLE" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "GET /ach/ach-files/${f1_id}/entries"
              payload: {}
              as: OdfiOperations
              captures: { x_id: "$.data[0].id" }
            - call: "POST /ach/ach-entries/${x_id}/returns"
              payload: { return_code: "R01" }
              as: OdfiOperations
            - call: "POST /ach/ach-entries/${x_id}/representments"
              payload: {}
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f2_id: "$.data.id", f2_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f2_id}/entries"
              payload:
                expected_file_version: "${f2_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 700000, receiver_account: "t-y", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${f2_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b2_id: "$.data.settlement_batch_id" }
          trigger:
            - call: "POST /ach/settlement-batches/${b2_id}/advance"
              payload: { action: "DISPATCH" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/settlement-batches/${b2_id}/advance"
              payload: { action: "SETTLE" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "GET /ach/settlement-batches/${b2_id}/gl-postings"
              payload: {}
              as: OdfiFinance
          assert:
            - "GlPosting rows of ${b2_id}: exactly 8 rows (Y settlement pair, F2 fee pair, X re-settlement pair, return reversal pair)"
            - "sum(debit_cents) == 4700260 AND sum(credit_cents) == 4700260 (trial balance conserved)"
            - "SettlementBatch.${b2_id}.expected_net_cents == 699740  # 700000 - 260 + (-2000000 + 2000000) sweep snapshot at dispatch"
            - "SettlementBatch.${b2_id}.posted_net_cents == 699740 AND recon_variance_cents == 0"
            - "AchEntry.${x_id}.status == SETTLED (re-presentment swept into B2)"

      - name: file_entry_cardinality_conserved_through_lifecycle
        grounds:
          - entities.AchFile.fields.entry_count
          - entities.AchFile.fields.total_amount_cents
          - state_machines.AchFile.WAREHOUSED_to_CANCELLED
          - state_machines.AchEntry.RETURNED_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity: per-file entry cardinality and principal sum (a
          count/mass invariant, NOT a ledger balance). Cancelling one
          warehoused file and returning+closing an entry of another file never
          creates or destroys entry rows: entry_count and total_amount_cents
          are bit-identical before and after the lifecycle storms.
        test_recipe:
          setup:
            - "Originator ACTIVE, limit 100000000; file A with 2 DEBIT entries (100000 + 200000, still WAREHOUSED); file B with 1 DEBIT entry 400000, settled and then returned R01"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Upsilon Ltd", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 100000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { fa_id: "$.data.id", fa_v: "$.data.version" }
            - call: "POST /ach/ach-files/${fa_id}/entries"
              payload:
                expected_file_version: "${fa_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 100000, receiver_account: "u-1", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 200000, receiver_account: "u-2", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { fb_id: "$.data.id", fb_v: "$.data.version" }
            - call: "POST /ach/ach-files/${fb_id}/entries"
              payload:
                expected_file_version: "${fb_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 400000, receiver_account: "u-3", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${fb_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { bb_id: "$.data.settlement_batch_id" }
            - call: "POST /ach/settlement-batches/${bb_id}/advance"
              payload: { action: "DISPATCH" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/settlement-batches/${bb_id}/advance"
              payload: { action: "SETTLE" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "GET /ach/ach-files/${fb_id}/entries"
              payload: {}
              as: OdfiOperations
              captures: { eb_id: "$.data[0].id" }
          trigger:
            - call: "POST /ach/ach-files/${fa_id}/cancel"
              payload: {}
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-entries/${eb_id}/returns"
              payload: { return_code: "R01" }
              as: OdfiOperations
            - call: "POST /ach/ach-entries/${eb_id}/close"
              payload: {}
              as: OriginatorOps
              as_user_id: "${org_id}"
          assert:
            - "AchFile.${fa_id}: status == CANCELLED AND entry_count == 2 AND total_amount_cents == 300000 (unchanged by the cancel cascade)"
            - "AchFile.${fb_id}: status == SETTLED AND entry_count == 1 AND total_amount_cents == 400000 (unchanged by return + close)"
            - "AchEntry.${eb_id}.status == CLOSED; its OPEN ReturnCase disposition == FINAL"
