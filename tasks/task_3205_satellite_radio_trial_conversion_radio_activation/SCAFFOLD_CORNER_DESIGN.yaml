# =============================================================================
# Task 3205 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 claims not covered by §1.8.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: customer_creation_applies_household_default
        claim_type: defaults
        grounds: [entities.Customer.fields.household_size]
        distinguishing_aspect: "Omitting household_size on POST /api/v1/customers yields default 1; computed/system fields in payload are ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "d1@x.com", full_name: "D One" }
              as: Anonymous
              captures: { d1_id: $.data.id, d1_hh: $.data.household_size }
          trigger: []
          assert:
            - "Customer.${d1_id}.household_size == 1 (default applied)"
            - "Customer.${d1_id}.status == ACTIVE and version == 1"

      - name: duplicate_vin_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Vehicle.fields.vin"
          - "errors[ERR_DUPLICATE]"
        distinguishing_aspect: "Second POST /api/v1/vehicles with the same vin hits the uniqueness constraint with ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["automaker and customer exist; one vehicle with vin V17 created"]
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "dv@x.com", full_name: "D V", household_size: 1 }
              as: Anonymous
              captures: { dv_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMZ", name: "OEM Z", feed_contact_email: "f@z.com" }
              as: PlatformAdmin
              captures: { oemz_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A999999", automaker_id: "${oemz_id}", model_year: 2024, owner_customer_id: "${dv_id}", condition: "NEW" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A999999", automaker_id: "${oemz_id}", model_year: 2024, owner_customer_id: "${dv_id}", condition: "USED" }
              as: PlatformAdmin
              captures: { dup_err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE with http 409"

      - name: invalid_enum_hardware_generation_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Radio.fields.hardware_generation"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "hardware_generation outside {GEN1, GEN2, GEN3} fails with ERR_INVALID_REQUEST (400) before any uniqueness work."
        test_recipe:
          setup: ["automaker, customer, vehicle exist"]
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "de@x.com", full_name: "D E", household_size: 1 }
              as: Anonymous
              captures: { de_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMY", name: "OEM Y", feed_contact_email: "f@y.com" }
              as: PlatformAdmin
              captures: { oemy_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A888888", automaker_id: "${oemy_id}", model_year: 2024, owner_customer_id: "${de_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { vehE_id: $.data.id }
          trigger:
            - call: "POST /api/v1/radios"
              payload: { esn: "ESNE001", vehicle_id: "${vehE_id}", hardware_generation: "GEN9" }
              as: PlatformAdmin
              captures: { enum_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"

      - name: immutable_offer_redemption_has_no_update
        claim_type: immutability
        grounds: [entities.OfferRedemption]
        distinguishing_aspect: "OfferRedemption is common_fields: false: no version/updated_at, and no PUT/PATCH/DELETE endpoint exists in §1.5 for it — GET-only discovery via campaign redemptions list."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/offer-campaigns/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "GET on a non-existent campaign id returns ERR_NOT_FOUND (404), proving path-id existence ordering"
            - "§1.5 declares no mutation endpoint on OfferRedemption (schema-level claim; verified by absence)"

      - name: get_missing_resource_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "GET /api/v1/radios/{uuid} with a well-formed but unknown id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/radios/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { nf2_err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: list_subscriptions_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /api/v1/customers/{id}/api/v1/subscriptions honors limit/offset and returns total_count + has_more per the fixed envelope."
        test_recipe:
          setup: ["customer with two streaming-only subscriptions"]
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "pg@x.com", full_name: "P G", household_size: 1 }
              as: Anonymous
              captures: { pg_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TPG", name: "TierPG", channel_entitlements: ["CH1"], includes_streaming: true, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierPG_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "PPG", name: "PPG", package_tier_id: "${tierPG_id}", service_mode: "STREAMING_ONLY", is_trial: false, term_kind: "MONTHLY", term_length_days: 30, price_cents: 1000, auto_renew_default: false }
              as: PlatformAdmin
              captures: { ppg_id: $.data.id }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${pg_id}", plan_id: "${ppg_id}", auto_renew: false }
              as: Customer
              as_user_id: "${pg_id}"
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${pg_id}", plan_id: "${ppg_id}", auto_renew: false }
              as: Customer
              as_user_id: "${pg_id}"
          trigger:
            - call: "GET /api/v1/customers/${pg_id}/api/v1/subscriptions?limit=1&offset=1"
              as: Customer
              as_user_id: "${pg_id}"
          assert:
            - "response envelope carries limit == 1, offset == 1, total_count == 2, has_more == false"
            - "data array length == 1"

  - section: state_machines
    instances:
      - name: subscription_initial_state_pending_activation
        claim_type: initial_state
        grounds: [state_machines.Subscription]
        distinguishing_aspect: "IN_VEHICLE subscription starts PENDING_ACTIVATION and only reaches ACTIVE via signal ACK, not via create."
        test_recipe:
          setup: ["customer, GEN1 radio, trial plan; trial provisioned"]
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "is@x.com", full_name: "I S", household_size: 1 }
              as: Anonymous
              captures: { is_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TIS", name: "TierIS", channel_entitlements: ["CH1"], includes_streaming: false, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierIS_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "TIS1", name: "TIS1", package_tier_id: "${tierIS_id}", service_mode: "IN_VEHICLE", is_trial: true, term_kind: "TRIAL", term_length_days: 30, price_cents: 0 }
              as: PlatformAdmin
              captures: { tis1_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMN", name: "OEM N", feed_contact_email: "f@n.com" }
              as: PlatformAdmin
              captures: { oemn_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A777777", automaker_id: "${oemn_id}", model_year: 2025, owner_customer_id: "${is_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { vehIS_id: $.data.id }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESNIS01", vehicle_id: "${vehIS_id}", hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { radioIS_id: $.data.id, radioIS_v: $.data.version }
          trigger:
            - call: "POST /api/v1/radios/${radioIS_id}/trials"
              payload: { plan_id: "${tis1_id}", customer_id: "${is_id}", expected_radio_version: "${radioIS_v}" }
              as: Customer
              as_user_id: "${is_id}"
              captures: { subIS_id: $.data.id, subIS_status: $.data.status }
          assert:
            - "Subscription.${subIS_id}.status == PENDING_ACTIVATION immediately after create (before any dispatch)"
            - "Radio.${radioIS_id}.activation_status == UNREGISTERED"

      - name: cancel_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Subscription]
        distinguishing_aspect: "From CANCELLED no transition exists: a second cancel returns ERR_INVALID_STATE and posts no further ledger entries."
        test_recipe:
          setup: ["paid sub S cancelled IMMEDIATE (refund posted); disclosure sent first (auto_renew true)"]
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "tl@x.com", full_name: "T L", household_size: 1 }
              as: Anonymous
              captures: { tl_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TTL", name: "TierTL", channel_entitlements: ["CH1"], includes_streaming: true, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierTL_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "PTL", name: "PTL", package_tier_id: "${tierTL_id}", service_mode: "STREAMING_ONLY", is_trial: false, term_kind: "MONTHLY", term_length_days: 30, price_cents: 3000, auto_renew_default: true }
              as: PlatformAdmin
              captures: { ptl_id: $.data.id }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${tl_id}", plan_id: "${ptl_id}" }
              as: Customer
              as_user_id: "${tl_id}"
              captures: { subTL_id: $.data.id }
            - call: "POST /api/v1/subscriptions/${subTL_id}/disclosures/send"
              payload: { disclosure_type: "RENEWAL_NOTICE", channel: "EMAIL" }
              as: RetentionAgent
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/subscriptions/${subTL_id}/cancel"
              payload: { effective_mode: "IMMEDIATE" }
              as: Customer
              as_user_id: "${tl_id}"
          trigger:
            - call: "POST /api/v1/subscriptions/${subTL_id}/cancel"
              payload: { effective_mode: "IMMEDIATE" }
              as: Customer
              as_user_id: "${tl_id}"
              captures: { tl_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "ledger of ${subTL_id} still has exactly 2 entries (CHARGE + one PRORATION_CREDIT of floor(3000*25/30)=2500 -> -2500)"

      - name: suspend_on_pending_activation_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Subscription"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "SUSPENDED is only reachable from ACTIVE; suspending a PENDING_ACTIVATION sub fails."
        test_recipe:
          setup: ["trial sub created but ACTIVATE signal never dispatched"]
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "sp@x.com", full_name: "S P", household_size: 1 }
              as: Anonymous
              captures: { sp_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TSP", name: "TierSP", channel_entitlements: ["CH1"], includes_streaming: false, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierSP_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "TSP1", name: "TSP1", package_tier_id: "${tierSP_id}", service_mode: "IN_VEHICLE", is_trial: true, term_kind: "TRIAL", term_length_days: 30, price_cents: 0 }
              as: PlatformAdmin
              captures: { tsp1_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMP", name: "OEM P", feed_contact_email: "f@p.com" }
              as: PlatformAdmin
              captures: { oemp_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A666666", automaker_id: "${oemp_id}", model_year: 2025, owner_customer_id: "${sp_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { vehSP_id: $.data.id }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESNSP01", vehicle_id: "${vehSP_id}", hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { radioSP_id: $.data.id, radioSP_v: $.data.version }
            - call: "POST /api/v1/radios/${radioSP_id}/trials"
              payload: { plan_id: "${tsp1_id}", customer_id: "${sp_id}", expected_radio_version: "${radioSP_v}" }
              as: Customer
              as_user_id: "${sp_id}"
              captures: { subSP_id: $.data.id }
          trigger:
            - call: "POST /api/v1/subscriptions/${subSP_id}/suspend"
              payload: {}
              as: Customer
              as_user_id: "${sp_id}"
              captures: { sp_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (PENDING_ACTIVATION has no suspend edge)"
            - "no SUSPEND SignalCommand was enqueued for radio ${radioSP_id} (signal list length still 1)"

      - name: signal_ack_from_queued_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.SignalCommand"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "ACK is only legal from SENT; acking a QUEUED command (never dispatched) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["trial sub created; ACTIVATE signal QUEUED but not dispatched"]
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "sq@x.com", full_name: "S Q", household_size: 1 }
              as: Anonymous
              captures: { sq_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TSQ", name: "TierSQ", channel_entitlements: ["CH1"], includes_streaming: false, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierSQ_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "TSQ1", name: "TSQ1", package_tier_id: "${tierSQ_id}", service_mode: "IN_VEHICLE", is_trial: true, term_kind: "TRIAL", term_length_days: 30, price_cents: 0 }
              as: PlatformAdmin
              captures: { tsq1_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMQ", name: "OEM Q", feed_contact_email: "f@q.com" }
              as: PlatformAdmin
              captures: { oemq_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A555555", automaker_id: "${oemq_id}", model_year: 2025, owner_customer_id: "${sq_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { vehSQ_id: $.data.id }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESNSQ01", vehicle_id: "${vehSQ_id}", hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { radioSQ_id: $.data.id, radioSQ_v: $.data.version }
            - call: "POST /api/v1/radios/${radioSQ_id}/trials"
              payload: { plan_id: "${tsq1_id}", customer_id: "${sq_id}", expected_radio_version: "${radioSQ_v}" }
              as: Customer
              as_user_id: "${sq_id}"
            - call: "GET /api/v1/radios/${radioSQ_id}/api/v1/signal-commands"
              as: SystemOperator
              captures: { sigSQ_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/v1/signal-commands/${sigSQ_id}/ack"
              payload: {}
              as: SystemOperator
              captures: { sq_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (QUEUED -> ACKED is not a declared transition)"
            - "SignalCommand.${sigSQ_id}.status still QUEUED with attempt_count == 0"
  - section: calculations
    instances:
      - name: renewal_disclosure_gate_blocks_charge
        claim_type: correct_result
        grounds:
          - "calculations.renewal_pricing"
          - "errors[ERR_RENEWAL_DISCLOSURE_REQUIRED]"
        distinguishing_aspect: "An auto-renew paid sub past end_at with no timely disclosure is neither renewed nor expired — it lingers ACTIVE with disclosure_state REQUIRED until disclosure, then renews on the next batch."
        test_recipe:
          setup: ["streaming sub 5000/30d auto_renew true created 2026-09-01; NO disclosure sent; clock at 2026-10-02"]
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "rg@x.com", full_name: "R G", household_size: 1 }
              as: Anonymous
              captures: { rg_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TRG", name: "TierRG", channel_entitlements: ["CH1"], includes_streaming: true, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierRG_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "PRG", name: "PRG", package_tier_id: "${tierRG_id}", service_mode: "STREAMING_ONLY", is_trial: false, term_kind: "MONTHLY", term_length_days: 30, price_cents: 5000, auto_renew_default: true }
              as: PlatformAdmin
              captures: { prg_id: $.data.id }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${rg_id}", plan_id: "${prg_id}" }
              as: Customer
              as_user_id: "${rg_id}"
              captures: { subRG_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/_billing/run_renewals"
              payload: {}
              as: SystemOperator
              captures: { rg_blocked: $.data.disclosure_blocked_count, rg_renewed: $.data.renewed_count }
          trigger:
            - call: "POST /api/v1/subscriptions/${subRG_id}/disclosures/send"
              payload: { disclosure_type: "RENEWAL_NOTICE", channel: "EMAIL" }
              as: RetentionAgent
            - call: "POST /api/v1/_billing/run_renewals"
              payload: {}
              as: SystemOperator
              captures: { rg_renewed2: $.data.renewed_count }
          assert:
            - "first batch: renewed_count == 0 and disclosure_blocked_count == 1; sub stays ACTIVE with start_at 2026-09-01T00:00:00Z and NO new CHARGE (regulatory limbo, not expiry)"
            - "after late disclosure, second batch renews: renewed_count == 1, new CHARGE 5000 posted, end_at advances by 30 days"

      - name: signal_retry_backoff_bases_differ_by_path
        claim_type: constants_applied
        grounds: [calculations.signal_path_selection, entities.Radio.fields.hardware_generation]
        distinguishing_aspect: "GEN1 radios take SATELLITE path with 60-minute retry base; GEN2/3 take CELLULAR with 15-minute base; next_retry_at reflects the pinned base."
        test_recipe:
          setup: ["two customers, GEN1 radio RG1 and GEN3 radio RG3, trial plan; both trials provisioned; both signals dispatched and failed once"]
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "g1@x.com", full_name: "G One", household_size: 1 }
              as: Anonymous
              captures: { g1_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TG1", name: "TierG1", channel_entitlements: ["CH1"], includes_streaming: false, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierG1_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "TG1P", name: "TG1P", package_tier_id: "${tierG1_id}", service_mode: "IN_VEHICLE", is_trial: true, term_kind: "TRIAL", term_length_days: 30, price_cents: 0 }
              as: PlatformAdmin
              captures: { tg1p_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMR", name: "OEM R", feed_contact_email: "f@r.com" }
              as: PlatformAdmin
              captures: { oemr_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A444444", automaker_id: "${oemr_id}", model_year: 2020, owner_customer_id: "${g1_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { vehG1_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A333333", automaker_id: "${oemr_id}", model_year: 2026, owner_customer_id: "${g1_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { vehG3_id: $.data.id }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESNG1", vehicle_id: "${vehG1_id}", hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { radioG1_id: $.data.id, radioG1_v: $.data.version }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESNG3", vehicle_id: "${vehG3_id}", hardware_generation: "GEN3" }
              as: PlatformAdmin
              captures: { radioG3_id: $.data.id, radioG3_v: $.data.version }
            - call: "POST /api/v1/radios/${radioG1_id}/trials"
              payload: { plan_id: "${tg1p_id}", customer_id: "${g1_id}", expected_radio_version: "${radioG1_v}" }
              as: Customer
              as_user_id: "${g1_id}"
            - call: "POST /api/v1/radios/${radioG3_id}/trials"
              payload: { plan_id: "${tg1p_id}", customer_id: "${g1_id}", expected_radio_version: "${radioG3_v}" }
              as: Customer
              as_user_id: "${g1_id}"
            - call: "GET /api/v1/radios/${radioG1_id}/api/v1/signal-commands"
              as: SystemOperator
              captures: { sigG1_id: "$.data[0].id", sigG1_path: "$.data[0].path" }
            - call: "GET /api/v1/radios/${radioG3_id}/api/v1/signal-commands"
              as: SystemOperator
              captures: { sigG3_id: "$.data[0].id", sigG3_path: "$.data[0].path" }
            - call: "POST /api/v1/_signals/dispatch"
              payload: {}
              as: SystemOperator
            - call: "POST /api/v1/signal-commands/${sigG1_id}/fail"
              payload: {}
              as: SystemOperator
              captures: { sigG1_retry: $.data.next_retry_at }
            - call: "POST /api/v1/signal-commands/${sigG3_id}/fail"
              payload: {}
              as: SystemOperator
              captures: { sigG3_retry: $.data.next_retry_at }
