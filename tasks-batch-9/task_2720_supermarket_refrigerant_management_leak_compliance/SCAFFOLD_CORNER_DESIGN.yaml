        distinguishing_aspect: "The cylinder holds 40.0 lbs so the insufficient-contents rule at priority 40 is satisfied; only the projected system charge 80.0 + 25.0 = 105.0 breaks the 100.0 nameplate, so the answer must be 422 ERR_CHARGE_EXCEEDS_NAMEPLATE with both ledgers unchanged."
        test_recipe:
          setup:
