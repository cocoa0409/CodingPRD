  - section: calculations
    instances:
      - name: medication_hold_release_takes_the_longest_acting_class_window
        claim_type: correct_result
        grounds:
          - calculations.medication_hold_release
          - endpoints[POST /pft-lab/test-orders/{order_id}/medication-holds]
          - entities.MedicationHold.fields.required_hold_hours
          - entities.TestOrder.fields.hold_release_at
        distinguishing_aspect: |
          Two holds issued at the same instructed_at carry different class windows, and the order's
          hold_release_at is the MAXIMUM of the per-hold release_at values rather than the latest one
          written: issuing the 36-hour LAMA hold first and the 6-hour SABA hold second must still leave
          hold_release_at on the LAMA window, while each hold keeps its own release_at.
        test_recipe:
          setup:
            - "logical clock is 2026-08-01T06:00:00Z"
            - "order ORD-1 declares current_medication_classes [SABA, LAMA], so its submit parks it in SUBMITTED rather than READY"
            - "HOLD_HOURS_BY_CLASS gives SABA 6 hours and LAMA 36 hours"
