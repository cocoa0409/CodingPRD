  # ===========================================================================
  - section: validations
    instances:
      - name: unrecognized_role_header_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "An X-User-Role value naming no declared role is an authentication failure: 401 ERR_UNAUTHENTICATED fires before role authorization, existence, or any business rule."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
