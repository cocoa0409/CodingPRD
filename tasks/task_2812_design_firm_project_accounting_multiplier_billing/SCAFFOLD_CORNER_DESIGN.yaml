          rationale: "Adjacency is asserted legal, overlap rejected, and the boundary work_date is asserted to resolve to the later window."

  - section: validations
    instances:
      - name: expense_exclusion_depends_on_the_client_configuration
        claim_type: conditional_validation
        grounds:
          - validations[priority=52]
          - calculations.expense_allowability_and_markup
          - entities.Client.fields.disallowed_categories
        distinguishing_aspect: |
          The same category is judged three different ways by client configuration: MEALS is
          statutorily unallowable only for a public agency, ENTERTAINMENT is unallowable only
          because this private client listed it, and REPROGRAPHICS is allowable for both. Because
          the missing-receipt clause outranks the exclusions, all three arrive at review, where
          only the allowable one may be allowed.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "one public-agency client (no listed exclusions, markup 0.0500) and one private client excluding ENTERTAINMENT (markup 0.1000); both require receipts above 75.00"
            - "one ACTIVE project per client, each with a single LUMP_SUM phase"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
              payload: { name: "State Transit Authority", is_public_agency: true, retainage_pct: 0.0500, expense_markup_pct: 0.0500, disallowed_categories: [], receipt_required_above: 75.00, review_cycle_days: 45 }
              as: FirmAdmin
              captures: { cl_pub: $.data.id }
            - call: "POST /clients"
              payload: { name: "Northside Development", is_public_agency: false, retainage_pct: 0.0500, expense_markup_pct: 0.1000, disallowed_categories: ["ENTERTAINMENT"], receipt_required_above: 75.00, review_cycle_days: 30 }
              as: FirmAdmin
              captures: { cl_priv: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl_pub}", name: "Transit Center Renovation", contract_type: "TIME_AND_MATERIALS", contract_amount: 900000.00, project_manager_user_id: "pm-001", percent_complete_method: "EFFORT_BASED", target_multiplier: 2.5000 }
