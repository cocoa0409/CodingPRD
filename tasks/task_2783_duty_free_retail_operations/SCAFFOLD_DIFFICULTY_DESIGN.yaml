            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              as_user_id: "user-stock-01"
              captures: { si_whisky: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 100 }
              as: StockController
              as_user_id: "user-stock-01"
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0008", nationality_code: "CN", boarding_pass_barcode: "BP-0008", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-25T10:00:00Z", destination_country: "AU", final_destination_country: "AU", has_connection: false }
              as: SalesAssociate
              captures: { it_8: $.data.id }
            - call: "GET /bonded-stock-items/${si_whisky}"
              as: StockController
              as_user_id: "user-stock-01"
              captures: { si_whisky_v1: $.data.version }
            - call: "POST /pre-orders"
              payload: { itinerary_id: "${it_8}", stock_item_id: "${si_whisky}", qty: 60, program: "PICKUP_ON_DEPARTURE", reservation_window_start: "2026-08-10T00:00:00Z", reservation_window_end: "2026-08-12T00:00:00Z", expected_stock_item_version: "${si_whisky_v1}" }
              as: Passenger
              as_user_id: "${it_8}"
              captures: { po_8: $.data.id }
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_sin}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
