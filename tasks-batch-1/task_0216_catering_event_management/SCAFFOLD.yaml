        type: integer
        source: input
        description: "Base price per guest in integer cents at the smallest tier (before volume tiering)."
        constraints: ">= 0"
      - name: min_headcount
        type: integer
        source: input
        description: "Minimum guests this package may be ordered for."
        constraints: ">= 1"
      - name: lead_time_hours
        type: integer
        source: input
        description: "Minimum hours between order-confirmation time and event_start that this package requires."
        constraints: ">= 0"
      - name: volume_tiers
        type: array
        source: input
        description: "Ordered breakpoints [{min_headcount, per_head_cents}] giving a lower per-head rate above each headcount breakpoint. Evaluated as a step (marginal) schedule; see calc package_headcount_charge."
        constraints: "each entry per_head_cents <= base per_head_cents; min_headcount strictly increasing"
      - name: allergen_flags
        type: array
        source: input
        description: "Allergens present in this package's menu, e.g. ['NUT','DAIRY','GLUTEN']. Used to validate dietary-count requests against capacity."
