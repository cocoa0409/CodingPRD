            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/finding-entries"
              payload: { entry_action: "RAISE", severity: "MINOR" }
              as: MonogramAuditor
              as_user_id: "aud-9"
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/finding-entries"
              payload: { entry_action: "RAISE", severity: "MINOR" }
              as: MonogramAuditor
              as_user_id: "aud-9"
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/finding-entries"
              payload: { entry_action: "RAISE", severity: "MINOR" }
              as: MonogramAuditor
              as_user_id: "aud-9"
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/finding-entries"
