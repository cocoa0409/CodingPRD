        claim_type: violation_to_error
        grounds: ['validations[priority=8]', 'errors[ERR_VENDOR_CREDENTIAL_WINDOW_OVERLAP]']
        distinguishing_aspect: "A vendor holding a live badge (expires_at > now) cannot receive a second one; the prior badge must expire or be returned first."
