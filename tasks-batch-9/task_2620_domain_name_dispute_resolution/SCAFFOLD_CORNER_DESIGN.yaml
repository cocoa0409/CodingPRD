            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:02Z" }
              as: ProviderAdmin
            - call: "POST /udrp/_ops/deadline-sweep"
              payload: {}
              as: ProviderAdmin
            - call: "GET /udrp/cases/${case_id}/registrar-verifications"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { ver_status_4: "$.data[0].status", ver_escalations_4: "$.data[0].escalation_count" }
            - call: "POST /udrp/cases/${case_id}/registrar-verifications/${ver_id}/response"
              payload: { lock_applied: true, verified_registrant_name: "Verif Underlying Holder", verified_registrant_email: "registrant@verif.example" }
              as: RegistrarAgent
              as_user_id: "${reg_id}"
              captures: { ver_status_5: "$.data.status", ver_responded_5: "$.data.responded_at" }
            - call: "GET /udrp/registrars/${reg_id}"
              payload: {}
              as: ProviderAdmin
              captures: { reg_overdue_final: "$.data.overdue_verification_count" }
          assert:
            - "RegistrarVerification.${ver_id}.due_at == 2026-08-03T00:00:00Z, i.e. requested_at 2026-08-01T00:00:00Z plus the registrar's 48 hours"
            - "The sweep at exactly 2026-08-03T00:00:00Z leaves status REQUESTED and escalation_count 0 - the precondition is clock strictly greater than due_at"
            - "The sweep at 2026-08-03T00:00:01Z moves status to OVERDUE with escalation_count 1 and Registrar.${reg_id}.overdue_verification_count 1"
            - "The immediately repeated sweep at the same clock value returns all-zero counts and leaves escalation_count at 1 - the row is no longer REQUESTED"
            - "The re-request returns the SAME verification row moved back to REQUESTED with requested_at 2026-08-03T00:00:01Z and due_at 2026-08-05T00:00:01Z, and Registrar.${reg_id}.overdue_verification_count back to 0"
            - "GET /udrp/cases/${case_id}/registrar-verifications still returns meta.total_count == 1 after the re-request - the cycle reuses one row rather than minting a second"
            - "The sweep at 2026-08-05T00:00:02Z moves it to OVERDUE again with escalation_count 2, proving escalations accumulate across laps"
            - "The registrar's response from OVERDUE succeeds: status RESPONDED, responded_at 2026-08-05T00:00:02Z, Registrar.${reg_id}.overdue_verification_count 0, DomainName.${dom_id}.lock_status LOCKED and Case.${case_id}.status NOTIFICATION_PENDING"

