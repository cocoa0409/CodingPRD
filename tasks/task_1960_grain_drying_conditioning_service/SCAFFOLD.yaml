  - { method: GET, path: "/grain-drying/customers", description: "List customers", roles: [ElevatorManager], code: 200, input: ["account_status?", "limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/grain-drying/customers/{id}", description: "Get one customer", roles: [ElevatorManager, Grower], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: PATCH, path: "/grain-drying/customers/{id}", description: "Update credit limit, suspension, priority class", roles: [ElevatorManager], code: 200, input: ["credit_limit_cents?", "account_status?", "priority_class?"], output: Customer, side_effects: ["version += 1"] }
  - { method: GET, path: "/grain-drying/customers/{id}/statement", description: "Computed receivables position", roles: [ElevatorManager, Grower], code: 200, input: [], output: { customer_id: string, outstanding_due_cents: integer, prepaid_balance_cents: integer, issued_invoice_count: integer }, side_effects: [] }

  # --- Grain lots ---
  - { method: POST, path: "/grain-drying/grain-lots", description: "Receive a lot at the scale", roles: [IntakeTechnician], code: 201, input: [customer_id, commodity, gross_weight_lbs, tare_weight_lbs, target_moisture_pct, "foreign_material_pct?"], output: GrainLot, side_effects: ["wet_net computed", "status=RECEIVED", "ownership=GROWER_HELD", "current_owner_id=customer_id"] }
  - { method: GET, path: "/grain-drying/grain-lots", description: "List lots with filters", roles: [ElevatorManager, Grower, IntakeTechnician, DryerOperator, ClaimsAdjuster], code: 200, input: ["customer_id?", "current_owner_id?", "certified_test_id?", "status?", "commodity?", "limit?", "offset?"], output: "GrainLot[]", side_effects: [] }
  - { method: GET, path: "/grain-drying/grain-lots/{id}", description: "Get one lot", roles: [ElevatorManager, Grower, IntakeTechnician, DryerOperator, ClaimsAdjuster], code: 200, input: [], output: GrainLot, side_effects: [] }
  - { method: POST, path: "/grain-drying/grain-lots/{id}/load-out", description: "Load a DRIED lot out of the elevator", roles: [IntakeTechnician], code: 200, input: [], output: GrainLot, side_effects: ["DRIED -> LOADED_OUT", "version += 1"] }
  - { method: GET, path: "/grain-drying/grain-lots/{id}/charge-preview", description: "Computed drying-charge preview per governing schedule (requires certified test)", roles: [ElevatorManager, Grower, IntakeTechnician], code: 200, input: [], output: { lot_id: string, schedule_id: string, bushels: number, points_removed: number, rate_cents_per_pt_bu: integer, fm_surcharge_applied: boolean, drying_charge_cents: integer }, side_effects: [] }

  # --- Moisture tests ---
  - { method: POST, path: "/grain-drying/moisture-tests", description: "Create a moisture test for a lot (OCC on lot version)", roles: [IntakeTechnician], code: 201, input: [lot_id, sample_moisture_pct, expected_grain_lot_version, "method?", "supersedes_test_id?"], output: MoistureTest, side_effects: ["status=PRELIMINARY", "tested_by_user_id=X-User-ID", "increments GrainLot.version by 1"] }
  - { method: GET, path: "/grain-drying/moisture-tests", description: "List moisture tests", roles: [ElevatorManager, Grower, IntakeTechnician, DryerOperator, ClaimsAdjuster], code: 200, input: ["lot_id?", "supersedes_test_id?", "status?", "limit?", "offset?"], output: "MoistureTest[]", side_effects: [] }
  - { method: GET, path: "/grain-drying/moisture-tests/{id}", description: "Get one moisture test", roles: [ElevatorManager, Grower, IntakeTechnician, DryerOperator, ClaimsAdjuster], code: 200, input: [], output: MoistureTest, side_effects: [] }
  - { method: POST, path: "/grain-drying/moisture-tests/{id}/certify", description: "Certify a PRELIMINARY test; supersedes the lot's prior certified/disputed test and recomputes lot baseline", roles: [IntakeTechnician], code: 200, input: [], output: MoistureTest, side_effects: ["PRELIMINARY -> CERTIFIED", "prior CERTIFIED/DISPUTED test -> SUPERSEDED", "lot intake/current moisture + certified_test_id updated", "provisional_shrink_estimate runs", "increments GrainLot.version by 1"] }
  - { method: POST, path: "/grain-drying/moisture-tests/{id}/dispute", description: "Owning grower disputes a CERTIFIED test", roles: [Grower], code: 200, input: [], output: MoistureTest, side_effects: ["CERTIFIED -> DISPUTED"] }

  # --- Charge schedules ---
  - { method: POST, path: "/grain-drying/charge-schedules", description: "Create a versioned tariff window for one commodity (closed-interval, non-overlapping per commodity)", roles: [ElevatorManager], code: 201, input: [commodity, effective_from, effective_to, t1_max_moisture_pct, t2_max_moisture_pct, rate_t1_cents_per_pt_bu, rate_t2_cents_per_pt_bu, rate_t3_cents_per_pt_bu, fm_threshold_pct, fm_surcharge_pct, min_charge_cents, energy_t1_limit_therms, energy_t1_rate_cents_per_therm, energy_t2_rate_cents_per_therm, est_therms_per_hour, est_point_factor], output: DryingChargeSchedule, side_effects: [] }
  - { method: GET, path: "/grain-drying/charge-schedules", description: "List charge schedules", roles: [ElevatorManager, Grower, IntakeTechnician], code: 200, input: ["commodity?", "limit?", "offset?"], output: "DryingChargeSchedule[]", side_effects: [] }
  - { method: GET, path: "/grain-drying/charge-schedules/{id}", description: "Get one charge schedule", roles: [ElevatorManager, Grower, IntakeTechnician], code: 200, input: [], output: DryingChargeSchedule, side_effects: [] }
  - { method: PATCH, path: "/grain-drying/charge-schedules/{id}", description: "Revise rates (bumps version; breaks invoice-issue pins)", roles: [ElevatorManager], code: 200, input: ["rate_t1_cents_per_pt_bu?", "rate_t2_cents_per_pt_bu?", "rate_t3_cents_per_pt_bu?", "min_charge_cents?", "energy_t1_rate_cents_per_therm?", "energy_t2_rate_cents_per_therm?"], output: DryingChargeSchedule, side_effects: ["version += 1"] }

  # --- Dryer units ---
  - { method: POST, path: "/grain-drying/dryer-units", description: "Register a dryer unit and its capacity policy", roles: [ElevatorManager], code: 201, input: [unit_code, daily_capacity_bushels, standard_class_cap_bushels, throughput_bu_per_hour, cooldown_minutes], output: DryerUnit, side_effects: [] }
  - { method: GET, path: "/grain-drying/dryer-units/{id}", description: "Get one dryer unit", roles: [ElevatorManager, Grower, IntakeTechnician, DryerOperator, ClaimsAdjuster], code: 200, input: [], output: DryerUnit, side_effects: [] }
  - { method: GET, path: "/grain-drying/dryer-units/{id}/capacity-calendar", description: "Computed committed vs capacity for one date", roles: [ElevatorManager, Grower, DryerOperator], code: 200, input: [date], output: { unit_id: string, date: string, daily_capacity_bushels: integer, standard_committed_bushels: integer, total_committed_bushels: integer, standard_remaining_bushels: integer, total_remaining_bushels: integer }, side_effects: [] }

  # --- Queue tickets ---
  - { method: POST, path: "/grain-drying/queue-tickets", description: "Book dryer throughput for a lot on a date", roles: [Grower, ElevatorManager], code: 201, input: [lot_id, unit_id, window_date, requested_bushels], output: QueueTicket, side_effects: ["status=PENDING", "priority_class copied from customer"] }
  - { method: GET, path: "/grain-drying/queue-tickets", description: "List queue tickets", roles: [ElevatorManager, Grower, DryerOperator], code: 200, input: ["lot_id?", "unit_id?", "window_date?", "status?", "limit?", "offset?"], output: "QueueTicket[]", side_effects: [] }
  - { method: GET, path: "/grain-drying/queue-tickets/{id}", description: "Get one queue ticket", roles: [ElevatorManager, Grower, DryerOperator], code: 200, input: [], output: QueueTicket, side_effects: [] }
  - { method: POST, path: "/grain-drying/queue-tickets/{id}/confirm", description: "Confirm a PENDING ticket (capacity + safety + fiscal gates)", roles: [ElevatorManager], code: 200, input: [], output: QueueTicket, side_effects: ["PENDING -> CONFIRMED", "lot TESTED -> QUEUED", "committed capacity += requested_bushels"] }
  - { method: POST, path: "/grain-drying/queue-tickets/{id}/cancel", description: "Cancel a PENDING or CONFIRMED ticket; CONFIRMED cancellation releases capacity and reverts the lot", roles: [Grower, ElevatorManager], code: 200, input: [], output: QueueTicket, side_effects: ["-> CANCELLED", "committed capacity -= requested_bushels if CONFIRMED", "lot QUEUED -> TESTED if CONFIRMED"] }
  - { method: POST, path: "/grain-drying/queue-tickets/{id}/preempt", description: "Harvest-peak preemption of a CONFIRMED STANDARD ticket", roles: [ElevatorManager], code: 200, input: [], output: QueueTicket, side_effects: ["CONFIRMED -> PREEMPTED", "committed capacity -= requested_bushels", "lot QUEUED -> TESTED", "preemption_count += 1"] }
