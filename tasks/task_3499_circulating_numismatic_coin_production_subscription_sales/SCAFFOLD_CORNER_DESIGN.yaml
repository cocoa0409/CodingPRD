  # ------------------------------------------------------------------
  # Section: calculations
  # ------------------------------------------------------------------
  - section: calculations
    instances:
      - name: waitlist_promotion_head_of_line_blocking
        claim_type: correct_result
        grounds: ["calculations.waitlist_promotion"]
        distinguishing_aspect: "Strict head-of-line blocking: after a 3-unit release, the earliest waitlisted order (qty 4) does not fit, so the scan STOPS and a later 1-unit order is NOT promoted despite fitting."
        test_recipe:
          setup: ["product HOL-1 (mintage 5, household limit 9) ON_SALE; a1 (c1) qty 3 ALLOCATED, a2 (c2) qty 2 ALLOCATED (SOLD_OUT); b (c3) qty 4 WAITLISTED; c (c4) qty 1 WAITLISTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "HOL-1", product_family: "HFAM", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 5, household_order_limit: 9, release_datetime: "2026-08-15T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "H1", email: "h1@example.com", household_id: "HH-H1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "H2", email: "h2@example.com", household_id: "HH-H2" }
              as: Anonymous
              captures: { c2: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "H3", email: "h3@example.com", household_id: "HH-H3" }
              as: Anonymous
              captures: { c3: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "H4", email: "h4@example.com", household_id: "HH-H4" }
              as: Anonymous
              captures: { c4: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 3 }
              as: Collector
              as_user_id: "${c1}"
              captures: { a1: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 2 }
              as: Collector
              as_user_id: "${c2}"
              captures: { a2: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 4 }
              as: Collector
              as_user_id: "${c3}"
              captures: { b: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 1 }
              as: Collector
              as_user_id: "${c4}"
              captures: { c: $.data.id }
          trigger:
            - call: "POST /mint/orders/${a1}/cancel"
              as: Collector
              as_user_id: "${c1}"
          assert:
            - "NumismaticOrder.${b}.allocation_status == WAITLISTED (4 > 3 released units: head of line does not fit)"
            - "NumismaticOrder.${c}.allocation_status == WAITLISTED (scan stopped at the blocking head; 1 <= 3 would fit but is never considered)"
            - "NumismaticProduct.${p_id}.allocated_units == 2 and status == ON_SALE"

      - name: shipping_tier_boundary_three_vs_four_units
        claim_type: constants_applied
        grounds: ["calculations.subscription_invoice_amount"]
        distinguishing_aspect: "Shipping tier constants: units_per_cycle 3 lands in tier 1 (+495c) while 4 lands in tier 2 (+895c); with price 9995c the invoices are exactly 27483c and 36879c."
        test_recipe:
          setup: ["subscription product (price 9995) ON_SALE; collector A subscribes units 3; collector B subscribes units 4; both billing cycles run"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "SUB-TIERS", product_family: "SUBFAM", product_type: "SUBSCRIPTION_SERIES", price_cents: 9995, mintage_limit: 10000, household_order_limit: 1000, release_datetime: "2026-08-15T00:00:00Z", subscription_eligible: true }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Three Units", email: "t3@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c3: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "Four Units", email: "t4@example.com", household_id: "HH-2" }
              as: Anonymous
              captures: { c4: $.data.id }
            - call: "POST /mint/subscriptions"
              payload: { product_id: "${p_id}", units_per_cycle: 3, frequency: "MONTHLY" }
              as: Collector
              as_user_id: "${c3}"
              captures: { sub3: $.data.id, sub3_v: $.data.version }
            - call: "POST /mint/subscriptions"
              payload: { product_id: "${p_id}", units_per_cycle: 4, frequency: "MONTHLY" }
              as: Collector
              as_user_id: "${c4}"
              captures: { sub4: $.data.id, sub4_v: $.data.version }
          trigger:
            - call: "POST /mint/subscriptions/${sub3}/billing-cycle"
              payload: { expected_subscription_version: "${sub3_v}" }
              as: PlatformAdmin
              captures: { inv3: $.data.id }
            - call: "POST /mint/subscriptions/${sub4}/billing-cycle"
              payload: { expected_subscription_version: "${sub4_v}" }
              as: PlatformAdmin
              captures: { inv4: $.data.id }
          assert:
            - "SubscriptionInvoice.${inv3}.amount_cents == 27483 (8996 x 3 + 495)"
            - "SubscriptionInvoice.${inv4}.amount_cents == 36879 (8996 x 4 + 895; tier boundary between 3 and 4 units)"

      - name: bullion_bracket_boundary_99_vs_100_oz
        claim_type: constants_applied
        grounds: ["calculations.bullion_settlement_price"]
        distinguishing_aspect: "Quantity-bracket boundary: 99oz carries the +200bps small-lot premium while exactly 100oz drops to +100bps; T1 prices are 25987500c vs 26000000c at spot 250000."
        test_recipe:
          setup: ["GOLD spot 250000; issue pool 200 (window 72h); T1 purchaser; offers of 99 and 100 units"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z", spot_prices: { GOLD: 250000 } }
              as: PlatformAdmin
            - call: "POST /mint/bullion-issues"
              payload: { name: "AGE 2026", metal: "GOLD", unit_weight_oz: 1.0, total_pool_units: 200, offer_window_hours: 72 }
              as: ProgramManager
              captures: { issue_id: $.data.id, issue_v: $.data.version }
            - call: "POST /mint/authorized-purchasers"
              payload: { name: "Dealer", tier: "T1" }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 99, expected_bullion_issue_version: "${issue_v}" }
              as: ProgramManager
              captures: { alloc99: $.data.id }
            - call: "GET /mint/bullion-issues/${issue_id}"
              as: ProgramManager
              captures: { issue_v2: $.data.version }
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 100, expected_bullion_issue_version: "${issue_v2}" }
              as: ProgramManager
              captures: { alloc100: $.data.id }
          trigger:
            - call: "POST /mint/allocations/${alloc99}/confirm"
              as: BullionDealer
              as_user_id: "${ap_id}"
            - call: "POST /mint/allocations/${alloc100}/confirm"
              as: BullionDealer
              as_user_id: "${ap_id}"
          assert:
            - "BullionAllocation.${alloc99}.total_price_cents == 25987500 (99oz x 250000 x 1.05; tier 300bps + bracket 200bps)"
            - "BullionAllocation.${alloc100}.total_price_cents == 26000000 (100oz x 250000 x 1.04; bracket flips to +100bps at exactly 100oz)"

      - name: error_rate_exactly_two_percent_breaches
        claim_type: correct_result
        grounds: ["calculations.error_rate_threshold", "errors[ERR_QUALITY_THRESHOLD_BREACH]"]
        distinguishing_aspect: "Boundary >= : error rate exactly 0.02 (200 error pieces over 10000 struck) breaches the threshold and blocks the next run start for that denomination."
        test_recipe:
          setup: ["QUARTER with delivered blanks; order; run1 of 10000 completed PASS good 9800 (scrapped 200); error case of 200 pieces recorded"]
          setup_api_calls:
