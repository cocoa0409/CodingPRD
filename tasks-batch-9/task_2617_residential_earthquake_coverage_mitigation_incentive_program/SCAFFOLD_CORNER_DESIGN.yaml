            - "${p2_status} == \"QUOTED\" - the refused EXPIRE_QUOTE left the second policy untouched"

      - name: binding_moratorium_blocks_the_event_county_until_the_sixtieth_day
        claim_type: violation_to_error
        grounds:
          - validations.ERR_BINDING_MORATORIUM
          - state_machines.CatastropheEvent.transitions.declare
        distinguishing_aspect: "The moratorium is scoped to the policyholder's county and to the half-open window [occurred_at, occurred_at + 60 days), so a quote in another county binds freely throughout and a quote in the struck county binds only once the clock reaches the sixtieth day exactly."
        test_recipe:
          setup:
            - "A DECLARED event with epicenter_county_code 06037 occurring at 2026-08-01T00:00:00Z; the moratorium therefore runs to 2026-09-30T00:00:00Z exclusive"
            - "Policyholder A lives in 06037 and has two dwellings; policyholder B lives in 06073"
