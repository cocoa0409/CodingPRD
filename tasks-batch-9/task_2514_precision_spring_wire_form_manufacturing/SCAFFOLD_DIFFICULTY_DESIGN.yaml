    instances:

      - name: run_not_complete_state_outranks_commitment_exceeded_fiscal_on_lot_creation
        grounds:
          - validations[priority=22]
          - validations[priority=74]
          - errors.ERR_RUN_NOT_COMPLETE
          - errors.ERR_COMMITMENT_EXCEEDED
          - endpoints["POST /shipment-lots"]
        conflict_pair:
          higher: { priority: 22, category: state, error_id: ERR_RUN_NOT_COMPLETE, http_status: 422 }
          lower: { priority: 74, category: business_fiscal, error_id: ERR_COMMITMENT_EXCEEDED, http_status: 422 }
        distinguishing_aspect: |
          Both rules are violated by the very same request body: the run is still RUNNING (priority 22) and the
          25000-piece draw exceeds the program's 24000 open commitment (priority 74). The state check must win.
          The instance then proves the fiscal rule was genuinely live by completing the run and replaying the
