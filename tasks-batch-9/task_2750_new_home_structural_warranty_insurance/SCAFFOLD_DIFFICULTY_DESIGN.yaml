    instances:
      - name: neutral_session_windows_are_half_open_but_widened_by_a_two_hour_turnaround
        grounds:
          - validations.priority_57_ERR_NEUTRAL_WINDOW_CONFLICT
          - entities.EscalationCase.fields.window_start
          - entities.EscalationCase.fields.window_end
          - entities.Neutral.fields.booked_session_count
          - endpoints.POST_/warranty/claims/{id}/escalations
        distinguishing_aspect: |
          Resource entity Neutral, interval semantics HALF-OPEN [window_start, window_end) widened by
          NEUTRAL_TURNAROUND_MINUTES = 120 on BOTH sides before comparison. Against a booked
          14:00-16:00 session, a request for 16:00-18:00 - which a naive half-open comparison accepts
          as merely touching - is REJECTED because widening makes it 14:00-20:00; a request for
          18:00-20:00 widens to 16:00-22:00 and is ACCEPTED precisely because touching does not
          overlap under half-open semantics. The pair therefore falsifies both a missing buffer and a
          closed-interval reading in one instance, and Neutral.booked_session_count must count only
          the accepted booking.
