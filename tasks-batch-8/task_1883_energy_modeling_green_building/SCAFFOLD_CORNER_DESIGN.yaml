            - { call: "POST /certification-projects", payload: { project_name: "Specialty Tower", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 5000000 }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { p_id: $.data.id } }
