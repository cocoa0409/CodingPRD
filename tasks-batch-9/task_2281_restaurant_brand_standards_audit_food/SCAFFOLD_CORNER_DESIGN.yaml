          payload: {location_id: '${loc_id}', auditor_id: '${aud_id}', rubric_version_id: '${rv_id}', visit_type: SHADOW, shadow_of_visit_id: '${vs_id}', scheduled_start_at: '2026-08-20T09:00:00Z', scheduled_end_at: '2026-08-20T13:00:00Z'}
