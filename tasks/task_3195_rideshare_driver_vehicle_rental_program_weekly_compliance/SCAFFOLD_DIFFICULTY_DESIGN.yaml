              as: FleetOpsAgent
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${v_id}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: true, maintenance_allowance_miles: 200, period_start: "2026-09-07T23:59:59Z", period_end: "2026-09-15T00:00:00Z" }
