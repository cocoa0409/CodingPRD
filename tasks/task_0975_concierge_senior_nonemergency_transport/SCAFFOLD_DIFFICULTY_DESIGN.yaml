            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "INSURANCE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_in: $.data.id } }
            - { call: "POST /compliance-docs/${doc_in}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /drivers/${drv}/status-events", payload: { event_type: "ACTIVATE" }, as: Coordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-01T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride: $.data.id } }
