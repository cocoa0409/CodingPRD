            - call: "GET /resilience/projects/${p1_id}"
              payload: {}
              as: EquityOfficer
              as_user_id: "equity-01"
          assert:
            - "first call: status 200 whose data already reads program_status PROGRAMMED, allocated_cents 51273600, equity_benefit_share_bps 10000 and priority_score 0.6129"
            - "second call: committed_cents 51273600, available_cents 48726400, equity_committed_cents 51273600, equity_achieved_bps 10000 and funding_posture OPEN, with committed + available == authorized"
            - "third call: the same priority_score 0.6129 as the write response returned"
            - "no additional write was needed between the allocation and either read"

      - name: an_endorsement_is_inside_the_tally_on_the_very_next_read
        claim_type: Immediate visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.endorsement_quorum_tally
          - endpoints.get_plan_cycle_endorsement_tally
        distinguishing_aspect: "The computed tally moves from SHORT to ADOPTED between two reads separated only by a single endorsement, so aggregate reads reflect every committed vote with no lag and no recompute call."
        test_recipe:
          setup:
            - "Two ACTIVE Jurisdictions with weights 4 and 3; one PlanCycle with quorum 6600 in ENDORSEMENT_ROUND holding one SCREENED_IN project."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Ridge Town", jurisdiction_code: "TOWN-RIDGE", population: 40000, svi_score: 0.18, endorsement_weight: 3 }
              as: RegionalAdministrator
              captures: { j_ridge_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 0 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Harbor Levee Raise", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /resilience/projects/${p1_id}/screen"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/plan-cycles/${cycle_id}/open-engagement"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/plan-cycles/${cycle_id}/open-endorsement-round"
              payload: {}
              as: RegionalAdministrator
          trigger:
            - call: "GET /resilience/plan-cycles/${cycle_id}/endorsement-tally"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/plan-cycles/${cycle_id}/endorsements"
              payload: { jurisdiction_id: "${j_harbor_id}", decision: "ENDORSED" }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
            - call: "GET /resilience/plan-cycles/${cycle_id}/endorsement-tally"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/plan-cycles/${cycle_id}/endorsements"
              payload: { jurisdiction_id: "${j_ridge_id}", decision: "ENDORSED" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
            - call: "GET /resilience/plan-cycles/${cycle_id}/endorsement-tally"
              payload: {}
              as: RegionalAdministrator
          assert:
            - "first call: total_active_weight 7, supporting_weight 0, achieved_weight_bps 0 and projected_outcome SHORT"
            - "second call: status 201 with data.weight_at_cast == 4"
            - "third call: supporting_weight 4 and achieved_weight_bps floor(10000*4/7) == 5714, still SHORT against the quorum of 6600"
            - "fifth call: supporting_weight 7, achieved_weight_bps 10000 and projected_outcome ADOPTED, while PlanCycle.status is still ENDORSEMENT_ROUND because only close-endorsement-round commits the outcome"
