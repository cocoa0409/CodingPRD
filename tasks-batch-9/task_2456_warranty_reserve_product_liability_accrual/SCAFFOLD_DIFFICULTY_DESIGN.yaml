      - name: warranty_accrual_propose_revise_cycle_reenters_draft_with_revision_index
        grounds:
          - state_machines.WarrantyAccrual.DRAFT_to_PROPOSED
          - state_machines.WarrantyAccrual.PROPOSED_to_DRAFT
          - entities.WarrantyAccrual.fields.revision_index
          - entities.WarrantyAccrual.fields.proposed_by_user_id
        distinguishing_aspect: |
          A different entity from the first instance: WarrantyAccrual's non-linearity is a
          CYCLE rather than parallel dimensions — PROPOSED -> DRAFT re-enters an already
          visited state, clears proposed_by_user_id and increments revision_index, and the
          second DRAFT -> PROPOSED records a DIFFERENT proposer (ua-2) while revision_index
          stays at 1, proving the loop counter counts revisions and not proposals.
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3 exists."
            - "ProductFamily FAM-R is MATURE: one ACTIVE vintage of 5000 units with a single [0,12) observation of 25 claims paid 200000 cents, so observed_history_months == 12 and observed_exposure_units == 5000."
            - "One DRAFT HISTORICAL_RATE accrual exists for that vintage with accrued_amount_cents 1060000, revision_index 0 and proposed_by_user_id null."
