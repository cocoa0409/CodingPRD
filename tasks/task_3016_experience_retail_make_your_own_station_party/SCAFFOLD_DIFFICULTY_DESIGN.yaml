      - name: collection_drop_units_claimed_at_total_units_exhaustion
        grounds:
          - calculations.party_deposit_required
          - state_machines.WorkshopSession.SELECT_to_SELECTED
          - "validations[priority=7]"
        distinguishing_aspect: |
          Metric: licensed drop units_claimed vs total_units (a stock-count
          boundary, distinct from station occupancy). With total_units = 1 and
          one licensed session SELECTED (units_claimed == 1), a second
          customer's SELECT advance on the same drop is rejected at the exact
          boundary units_claimed == total_units; abandoning the first session
          (units_claimed back to 0) makes the identical advance succeed.
        test_recipe:
