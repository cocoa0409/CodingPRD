  - rule_id: transitive_cascade
    instances:

      - name: certification_cascades_parcel_to_area_closure_to_sibling_suspension
        grounds:
          - state_machines.SeveranceApplication.APPROVED_to_CERTIFIED
          - state_machines.SendingArea.ACTIVE_to_CLOSED
          - state_machines.SeveranceApplication.SUBMITTED_to_SUSPENDED
          - entities.SendingParcel.fields.parcel_status
          - entities.SendingArea.fields.severed_units_total
          - calculations.easement_restriction_extent
        distinguishing_aspect: |
          Depth 4, triggered by APPROVED -> CERTIFIED on a severance application. Each link
          is caused by the PREVIOUS link, not by the certify call: the easement recording
          (1) forces the parcel recompute (2), the parcel recompute forces the area's
          severed_units_total recompute (3), and only that recomputed total crossing the
          sending cap closes the area and suspends an unrelated sibling application (4).
          Certifying an application on a parcel in a high-cap area produces links 1-3 and
          stops; the cap here is deliberately set to exactly the certified units.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER party; ACTIVE sending area SA-TIGHT with sending_cap_units 22 (V1_NET_ACRE, base_rate 0.25, UNDERSERVED)"
            - "parcel A: APN-A01 (100.00 / 22.00 / PRIME / 2 dwellings) -> baseline_allocation_units 22"
            - "parcel B: APN-B01 (40.00 / 0.00 / LOCAL / 0 dwellings) -> baseline_allocation_units 10, in the SAME area"
            - "application A for 22 units is APPROVED but not yet certified"
            - "application B for 10 units is left in SUBMITTED and is never touched by the trigger"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
