              captures: { ev_status: $.data.status, due: $.data.report_due_at }
          assert:
            - "the REPORTABLE call with defect_score 4 returns 422 ERR_DETERMINATION_UNSUPPORTED even though risk_score is 9 — under standard_basis DEFECT only defect_score counts"
            - "the NOT_REPORTABLE call with defect_score 7 returns 422 ERR_DETERMINATION_UNSUPPORTED (the mirror requires defect_score strictly below 5)"
