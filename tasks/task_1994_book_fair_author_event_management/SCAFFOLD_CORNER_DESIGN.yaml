      - name: booking_counter_stale_version_rejected
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[booking-counter-stale-version]"
          - "validations[priority=9]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC: the author's first counter succeeds (version 1 -> 2); a second author counter carrying the deliberately stale expression version-1 is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["booking INVITED (version 1); author counters once (offered_by flips to AUTHOR, status NEGOTIATING, version 2); organizer counters back (status INVITED, offered_by ORGANIZER, version 3)"]
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: AUTHOR, name: "Jane Writer", contact_email: "agent@jane.example" }, as: Organizer, captures: { author_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /author-bookings", payload: { fair_id: "${fair_id}", author_party_id: "${author_id}", base_honorarium_cents: 10000, travel_cap_cents: 2000, bonus_threshold_attendees: 3, bonus_base_cents: 1000, bonus_per_attendee_cents: 100, offer_expiry_hours: 72 }, as: Organizer, captures: { booking_id: "$.data.id", bk_v1: "$.data.version" } }
            - { call: "POST /author-bookings/${booking_id}/counter", payload: { base_honorarium_cents: 12000, travel_cap_cents: 2500, bonus_threshold_attendees: 3, bonus_base_cents: 1000, bonus_per_attendee_cents: 100, offer_expiry_hours: 72, expected_booking_version: "${bk_v1}" }, as: AuthorRep, as_user_id: "${author_id}", captures: { bk_v2: "$.data.version" } }
            - { call: "POST /author-bookings/${booking_id}/counter", payload: { base_honorarium_cents: 11000, travel_cap_cents: 2200, bonus_threshold_attendees: 3, bonus_base_cents: 1000, bonus_per_attendee_cents: 100, offer_expiry_hours: 72, expected_booking_version: "${bk_v2}" }, as: Organizer, captures: { bk_v3: "$.data.version" } }
          trigger:
            - { call: "POST /author-bookings/${booking_id}/counter", payload: { base_honorarium_cents: 13000, travel_cap_cents: 2500, bonus_threshold_attendees: 3, bonus_base_cents: 1000, bonus_per_attendee_cents: 100, offer_expiry_hours: 72, expected_booking_version: "${bk_v3} - 1" }, as: AuthorRep, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_STALE_VERSION with http 412 (submitted version ${bk_v3} - 1 == 2 is stale against the current version 3)"
            - "AuthorBooking.${booking_id} terms remain the organizer's round-3 offer (base 11000)"

