      - name: rbac_advertiser_scope_confines_every_role_backed_identity_to_its_own_rows
        claim_type: Per-role permission
        grounds:
          - errors.ERR_ADVERTISER_SCOPE_VIOLATION
          - validations[priority=14].ERR_ADVERTISER_SCOPE_VIOLATION
          - roles.Advertiser.shared_operations
        distinguishing_aspect: |
          Priority 14 sits between the role check and the request-shape check, so a
          cross-tenant read is 403 rather than 404 — an advertiser must not be able to probe
          the existence of a rival's creative. The same rule catches a PolicyReviewer whose
          X-User-ID is not a Reviewer row at all, which is why an unknown reviewer claiming a
          task is 403 and not 404.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (auto 0.90, manual 0.20, default_queue STANDARD); advertiser A verified with one submitted, screened creative and its QUEUED task; advertiser B verified with nothing of its own."
