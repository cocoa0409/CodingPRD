            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/insurance-claims", payload: { planting_plan_id: "${p_id}", price_election_cents_per_lb: 300 }, as: FarmManager, as_user_id: "grower-1" }
          trigger:
            - { call: "POST /api/insurance-claims", payload: { planting_plan_id: "${p_id}", price_election_cents_per_lb: 310 }, as: FarmManager, as_user_id: "grower-1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_DUPLICATE_CLAIM"

      - name: empty_delivery_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EMPTY_DELIVERY]
          - state_machines.Allocation.CONFIRMED_to_DELIVERED
        distinguishing_aspect: "Empty-set boundary: confirm reserved nothing (allocated 0 against zero inventory), so deliver has an empty reserved_lot_ids -> ERR_EMPTY_DELIVERY."
        test_recipe:
          setup: ["ACTIVE contract vol 736; run with zero AVAILABLE inventory -> allocation allocated 0; confirmed (no lots reserved)"]
          setup_api_calls:
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewCo", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 736, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c_id: $.data.id } }
