            - "Flight.${f1}.status == \"PLANNING\""

      - name: grounded_airframe_blocks_flight_creation
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=7]
          - errors[ERR_AIRCRAFT_GROUNDED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / flight_creation_blocked_by_grounded_aircraft
          rationale: "That §1.8 instance grounds the airframe between two otherwise identical creations and asserts that the posture check fires ahead of the performance-band, occupancy and slot checks, leaving the earlier flight and its plan untouched."

      - name: withdrawn_weight_program_outranks_the_slot_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=7]
          - errors[ERR_WEIGHT_PROGRAM_WITHDRAWN]
          - errors[ERR_RUNWAY_SLOT_FULL]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / program_withdrawn_beats_runway_slot_full
          rationale: "That §1.8 instance builds a body that violates both the withdrawn-program posture rule and the slot-capacity rule and asserts ERR_WEIGHT_PROGRAM_WITHDRAWN wins, then repairs the program only to expose ERR_RUNWAY_SLOT_FULL."

      - name: plan_state_ladder_rejects_offload_gate_bags_and_issuance_on_a_draft_plan
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_PLAN_INVALID_STATE]
          - endpoints[POST /load-plans/{id}/apply-offload]
          - endpoints[POST /load-plans/{id}/gate-bags]
          - endpoints[POST /load-sheets]
        distinguishing_aspect: |
          Three different endpoints demand three different plan states, and all
          three are unsatisfied by a DRAFT plan whose flight is still PLANNING
          (so the flight-state rule at priority 8 is satisfied and cannot mask
          the plan rule): apply-offload wants RESTRICTED, gate-bags and
          issuance want COMPUTED. Each is 409 ERR_PLAN_INVALID_STATE, and the
          issuance attempt carries a current version so the OCC rule at
          priority 15 cannot be the reported cause either.
        test_recipe:
          setup:
            - "AC1 with OC and H1; R1 with the [15,30) band; STD-2026; FLT; a plan with the FX-A rows loaded but never computed, so it is DRAFT while the flight is PLANNING."
