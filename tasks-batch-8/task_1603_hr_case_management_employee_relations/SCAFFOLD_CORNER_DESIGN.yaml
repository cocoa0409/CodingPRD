  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: sla_due_date_skips_weekends_and_holidays
        claim_type: correct_result
        grounds:
          - calculations.sla_business_day_due_date
          - entities.Case.fields.sla_due_date
        distinguishing_aspect: "With holidays 2026-08-10 (Mon) and 2026-08-17 (Mon) registered, an intake received Friday 2026-08-07 with a 5-business-day SLA yields sla_due_date == 2026-08-18T17:00:00Z (Aug 8/9 weekend, Aug 10 holiday, Aug 17 holiday all skipped; the intake day itself is day 0 and never counts)."
        test_recipe:
          setup:
            - "Holidays 2026-08-10 and 2026-08-17 registered; channel with sla_business_days == 5 exists; clock set to 2026-07-31T09:00:00Z (a Friday) before intake."
          setup_api_calls:
            - call: "POST /er/holiday-calendar"
              payload: { holiday_date: "2026-08-10T00:00:00Z", label: "Summer Shutdown A" }
              as: ERManager
            - call: "POST /er/holiday-calendar"
              payload: { holiday_date: "2026-08-17T00:00:00Z", label: "Summer Shutdown B" }
              as: ERManager
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HOTLINE", display_name: "Hot SLA", default_category: "HARASSMENT", default_severity: "MEDIUM", sla_business_days: 5 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-9601", full_name: "Sub SLA", email: "s9601@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T09:00:00Z" }
              as: ERManager
          trigger:
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", subject_employee_id: "${sub}", category: "HARASSMENT", severity: "MEDIUM" }
              as: ERManager
              captures: { c1: $.data.id, c1_due: $.data.sla_due_date }
          assert:
            - "Case.${c1}.sla_due_date == 2026-08-18T17:00:00Z"
            - "Case.${c1}.intake_received_at == 2026-07-31T09:00:00Z"

      - name: overdue_business_days_half_open_count
        claim_type: correct_result
        grounds:
          - calculations.overdue_business_days
        distinguishing_aspect: "With sla_due_date 2026-08-18 (Tue) and clock at 2026-08-24 (Mon), overdue_business_days == 4 (Aug 19, 20, 21, 24); at exactly sla_due_date the value is 0 — the due date itself never counts."
        test_recipe:
          setup:
            - "Holidays 2026-08-10 and 2026-08-17 registered; channel sla_business_days == 5; case intaken 2026-07-31T09:00:00Z (due 2026-08-18); clock advanced to 2026-08-24T09:00:00Z for the read."
          setup_api_calls:
            - call: "POST /er/holiday-calendar"
              payload: { holiday_date: "2026-08-10T00:00:00Z", label: "Summer Shutdown A" }
              as: ERManager
            - call: "POST /er/holiday-calendar"
              payload: { holiday_date: "2026-08-17T00:00:00Z", label: "Summer Shutdown B" }
              as: ERManager
            - call: "POST /er/intake-channels"
              payload: { channel_code: "WEB_PORTAL", display_name: "Portal SLA", default_category: "POLICY_VIOLATION", default_severity: "LOW", sla_business_days: 5 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-9602", full_name: "Sub OD", email: "s9602@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T09:00:00Z" }
              as: ERManager
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", subject_employee_id: "${sub}", category: "POLICY_VIOLATION", severity: "LOW" }
              as: ERManager
              captures: { c1: $.data.id }
            - call: "POST /er/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T09:00:00Z" }
              as: ERManager
          trigger:
            - call: "GET /er/cases/${c1}"
              as: ERManager
              captures: { c1_overdue: $.data.overdue_business_days }
          assert:
            - "Case.${c1}.overdue_business_days == 4"

