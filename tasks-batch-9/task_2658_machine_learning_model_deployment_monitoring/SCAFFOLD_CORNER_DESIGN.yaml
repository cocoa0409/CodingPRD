            - "the two checks produce max_skew_ratio 1.6000 and 1.2500, both status 'FAIL_SKEW', raising two PROPOSED triggers, so Model.open_retraining_trigger_count is 2"
            - "the high trigger's frozen snapshot is base_urgency 48.00, total_urgency 60.00 (tier floor 45 -> +25%), priority_band 'HIGH' and retrain_required true"
            - "the low trigger's snapshot is total_urgency 22.00 with retrain_required false"
            - "DISMISS on the high trigger returns HTTP 409 'ERR_RETRAIN_REQUIRED' and leaves it in 'PROPOSED'"
            - "DISMISS on the low trigger succeeds: status 'DISMISSED' with the supplied dismissed_reason stored, and Model.open_retraining_trigger_count falls to 1"
            - "ACKNOWLEDGE on the high trigger succeeds, proving only the dismissal path was blocked"
            - "PRIORITY 15 BEATS 57: retrying DISMISS from ACKNOWLEDGED now returns HTTP 409 'ERR_INVALID_STATE' — DISMISS only leaves PROPOSED, and the state guard outranks the fiscal one"
            - "the counter is unchanged by the two failures: Model.open_retraining_trigger_count is still 1"

