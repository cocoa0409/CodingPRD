              as: Auditor
              as_user_id: "aud-1"
              captures: { err_op: $.data.error_id }
            - call: "GET /aviation/endorsements/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
              captures: { err_end: $.data.error_id }
            - call: "GET /aviation/war-placements/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
              captures: { err_plc: $.data.error_id }
            - call: "GET /aviation/damage-assessments/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
              captures: { err_asm: $.data.error_id }
            - call: "GET /aviation/premium-transactions/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
              captures: { err_txn: $.data.error_id }
            - call: "GET /aviation/fleet-declarations/66666666-6666-4666-8666-666666666666"
