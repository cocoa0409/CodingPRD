              captures: { err_iso: $.data.error_id }
            - call: "POST /transport-runs"
              payload: { reservation_id: "${res_i2}", isolette_asset_id: "${isolette_a}", mode: "GROUND", crew_composition: ["TRANSPORT_RN", "NNP"], depart_at: "2026-08-02T12:45:00Z", planned_return_at: "2026-08-02T16:00:00Z", weather_minimums_met: false }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { run_i2: $.data.id }
          assert:
            - "${err_iso} == ERR_ISOLETTE_UNAVAILABLE with HTTP 409 — 12:30 falls inside the buffer"
            - "TransportRun.${run_i2}.status == ACTIVATED — 12:45 is accepted because the interval is half-open"
            - "TransportRun.${run_i2}.decontamination_minutes == 45"
            - "Exactly two TransportRun rows exist for ${isolette_a}"

      - name: escalation_windows_conflict_when_endpoints_touch
        grounds:
          - validations[priority=13]
          - errors[ERR_ESCALATION_WINDOW_OVERLAP]
          - calculations.surge_escalation_authorization
          - state_machines.SurgeEscalation.ACTIVE_to_STOOD_DOWN
        distinguishing_aspect: |
          Opposite interval semantics on a different resource (a unit's
          escalation calendar): CLOSED-CLOSED, so windows that merely touch at
          2026-08-03T00:00:00Z conflict — the exact configuration the isolette
