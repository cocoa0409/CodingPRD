# =============================================================================
# §1.9 — Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerates testable claims from §1.1–§1.7 that §1.8 does not already cover.
# =============================================================================

scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: center_creation_returns_system_fields
        claim_type: creation
        grounds:
          - "entities.TransplantCenter"
          - "endpoints.'POST /nkr/centers"
        distinguishing_aspect: "POST /nkr/centers with valid body returns 201 with server-minted id, created_at, updated_at, version=1, participation_status=ACTIVE."
        test_recipe:
          setup: ["Empty DB; logical clock at default"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /nkr/centers"
              payload: { center_code: "XX-TST-001", name: "Test Center", region_code: "TST", tier: "STANDARD", max_concurrent_chains: 2 }
              as: RegistryAdmin
              captures: { ctr_t: $.data.id, ctr_v: $.data.version }
          assert:
            - "TransplantCenter.${ctr_t}.participation_status == ACTIVE"
            - "TransplantCenter.${ctr_t}.version == 1"
            - "TransplantCenter.${ctr_t}.failed_outcome_count == 0"
            - "TransplantCenter.${ctr_t}.shipped_organ_count == 0"
            - "TransplantCenter.${ctr_t}.reputation_score_bps == 10000"

      - name: donor_creation_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Donor"
          - "endpoints.POST /nkr/donors"
          - "errors[ERR_INVALID_REQUEST"
        distinguishing_aspect: "POST /nkr/donors without required field abo_type returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Center A exists"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "XX-TST-002", name: "Test2", region_code: "TST", tier: "STANDARD", max_concurrent_chains: 2 }
              as: RegistryAdmin
              captures: { ctr_t2: $.data.id }
          trigger:
            - call: "POST /nkr/donors"
              payload: { external_ref: "DX", home_center_id: "${ctr_t2}", hla_a: "A02,A24", hla_b: "B07,B44", hla_drb1: "DRB1*04,DRB1*07", kdri_score: 80, age_at_registration: 30, donor_kind: "PAIRED" }
              as: CenterCoordinator
              as_user_id: "${ctr_t2}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http == 400"

      - name: get_nonexistent_center_returns_not_found
        claim_type: not_found
        grounds:
          - "endpoints.'GET /nkr/centers/{center_id}"
          - "errors[ERR_NOT_FOUND"
        distinguishing_aspect: "GET with non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegistryAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http == 404"

      - name: donor_invalid_enum_abo_type_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Donor.fields.abo_type"
          - "errors[ERR_INVALID_REQUEST"
        distinguishing_aspect: "abo_type not in {A,B,AB,O} returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Center A exists"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "XX-TST-003", name: "T3", region_code: "TST", tier: "STANDARD", max_concurrent_chains: 2 }
              as: RegistryAdmin
              captures: { ctr_t3: $.data.id }
          trigger:
            - call: "POST /nkr/donors"
              payload: { external_ref: "DE", home_center_id: "${ctr_t3}", abo_type: "INVALID", hla_a: "A02,A24", hla_b: "B07,B44", hla_drb1: "DRB1*04,DRB1*07", kdri_score: 80, age_at_registration: 30, donor_kind: "PAIRED" }
              as: CenterCoordinator
              as_user_id: "${ctr_t3}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: donor_under_age_18_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Donor.fields.age_at_registration"
          - "errors[ERR_INVALID_REQUEST"
        distinguishing_aspect: "age_at_registration < 18 rejected."
        test_recipe:
          setup: ["Center A exists"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "XX-TST-004", name: "T4", region_code: "TST", tier: "STANDARD", max_concurrent_chains: 2 }
              as: RegistryAdmin
              captures: { ctr_t4: $.data.id }
          trigger:
            - call: "POST /nkr/donors"
              payload: { external_ref: "DY", home_center_id: "${ctr_t4}", abo_type: "O", hla_a: "A02,A24", hla_b: "B07,B44", hla_drb1: "DRB1*04,DRB1*07", kdri_score: 80, age_at_registration: 17, donor_kind: "PAIRED" }
              as: CenterCoordinator
              as_user_id: "${ctr_t4}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: list_centers_pagination_default_limit
        claim_type: listing
        grounds:
          - "endpoints.'GET /nkr/centers"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "GET /nkr/centers without limit returns at most 10 items; response envelope includes limit/offset/total_count/has_more."
        test_recipe:
          setup: ["12 centers created"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "P-01", name: "P1", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "P-02", name: "P2", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "P-03", name: "P3", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "P-04", name: "P4", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "P-05", name: "P5", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "P-06", name: "P6", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "P-07", name: "P7", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "P-08", name: "P8", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "P-09", name: "P9", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "P-10", name: "P10", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "P-11", name: "P11", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "P-12", name: "P12", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "response contains pagination fields: limit, offset, total_count, has_more"
            - "data length <= 10 (default limit)"
            - "total_count == 12"
            - "has_more == true"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: invalid_donor_transition_hold_when_already_withdrawn
        claim_type: invalid_transition
        grounds:
          - "state_machines.Donor.medical_status"
          - "errors[ERR_INVALID_STATE"
        distinguishing_aspect: "Donor in WITHDRAWN cannot transition to ON_HOLD."
        test_recipe:
          setup: ["Center A; Donor registered and withdrawn"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "ST-001", name: "ST1", region_code: "T", tier: "STANDARD", max_concurrent_chains: 2 }
              as: RegistryAdmin
              captures: { ctr_s1: $.data.id }
            - call: "POST /nkr/donors"
              payload: { external_ref: "DS1", home_center_id: "${ctr_s1}", abo_type: "O", hla_a: "A02,A24", hla_b: "B07,B44", hla_drb1: "DRB1*04,DRB1*07", kdri_score: 80, age_at_registration: 30, donor_kind: "PAIRED" }
              as: CenterCoordinator
              as_user_id: "${ctr_s1}"
              captures: { d_s1: $.data.id }
            - call: "POST /nkr/donors/${d_s1}/withdraw"
              payload: {}
              as: CenterCoordinator
              as_user_id: "${ctr_s1}"
          trigger:
            - call: "POST /nkr/donors/${d_s1}/medical-hold"
              payload: {}
              as: CenterCoordinator
              as_user_id: "${ctr_s1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "Donor.${d_s1}.medical_status == WITHDRAWN (unchanged)"

      - name: invalid_center_transition_reinstate_from_active
        claim_type: invalid_transition
        grounds:
          - "state_machines.TransplantCenter"
          - "errors[ERR_CENTER_INVALID_STATE"
        distinguishing_aspect: "Center in ACTIVE cannot be reinstated; reinstate only valid from PROBATION or SUSPENDED."
        test_recipe:
          setup: ["Center A ACTIVE"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "ST-002", name: "ST2", region_code: "T", tier: "STANDARD", max_concurrent_chains: 2 }
              as: RegistryAdmin
              captures: { ctr_s2: $.data.id }
          trigger:
            - call: "POST /nkr/centers/${ctr_s2}/reinstate"
              payload: {}
              as: RegistryAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_CENTER_INVALID_STATE"

      - name: claim_terminal_state_lockdown_paid
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.DonorProtectionClaim"
          - "errors[ERR_INVALID_STATE"
        distinguishing_aspect: "Claim in PAID cannot transition further."
        test_recipe:
          setup: ["Donor with active policy; claim APPROVED then PAID"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            # Setup elided: full donor-with-policy chain in unit test.
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            # - call: "POST /nkr/claims/${c}/deny" -> ERR_INVALID_STATE
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "DonorProtectionClaim.claim_state == PAID (unchanged)"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: abo_compatibility_o_donor_to_all_recipients
        claim_type: correct_result
        grounds:
          - "calculations.abo_compatibility"
        distinguishing_aspect: "O donor can give to A, B, AB, O recipients (universal donor)."
        test_recipe:
          setup: ["Center A; O donor; recipients of each ABO type"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            # Setup elided: register O donor + 4 recipients, run chain construction.
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "All four ABO combinations (O->A, O->B, O->AB, O->O) yield abo_compatible=true"

      - name: abo_compatibility_ab_donor_only_to_ab
        claim_type: correct_result
        grounds:
          - "calculations.abo_compatibility"
        distinguishing_aspect: "AB donor can only give to AB recipient."
        test_recipe:
          setup: ["Center A; AB donor; recipients of each ABO type"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "AB->A: abo_compatible=false; AB->B: false; AB->O: false; AB->AB: true"

      - name: cold_ischemia_hours_rounding
        claim_type: precision
        grounds:
          - "calculations.cold_ischemia_actual"
        distinguishing_aspect: "Cold ischemia computed as (actual_arrival - nephrectomy_completion) in hours, rounded to 2 decimal places round_half_up."
        test_recipe:
          setup: ["Completed nephrectomy; shipment delivered with known time delta"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "OrganShipment.cold_ischemia_hours_actual matches expected literal to 2dp"

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_missing_role_header
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Request without X-User-Role header returns 401."
        test_recipe:
          setup: ["Center A exists"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "V-001", name: "V1", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
              captures: { ctr_v1: $.data.id }
          trigger:
            # No `as:` header (negative-test: instance name contains '_unauthenticated')
            - call: "GET /nkr/centers/${ctr_v1}"
              payload: {}
              as: RegistryAdmin
          assert:
            - "Without X-User-Role header: 401 ERR_UNAUTHENTICATED"

      - name: unauthorized_role_for_center_create
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "CenterCoordinator cannot create TransplantCenter (RegistryAdmin exclusive)."
        test_recipe:
          setup: ["Center A exists (so CenterCoordinator identity can be backed)"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "V-002", name: "V2", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
              captures: { ctr_v2: $.data.id }
          trigger:
            - call: "POST /nkr/centers"
              payload: { center_code: "V-003", name: "V3", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: CenterCoordinator
              as_user_id: "${ctr_v2}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_UNAUTHORIZED"
            - "response.http == 403"

      - name: center_mismatch_on_nephrectomy
        claim_type: cross_entity
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_CENTER_MISMATCH]"
        distinguishing_aspect: "CenterCoordinator from center B cannot complete nephrectomy of donor at center A."
        test_recipe:
          setup: ["Centers A and B; Donor registered at A"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "V-004A", name: "VA", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
              captures: { ctr_va: $.data.id }
            - call: "POST /nkr/centers"
              payload: { center_code: "V-004B", name: "VB", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
              captures: { ctr_vb: $.data.id }
            - call: "POST /nkr/donors"
              payload: { external_ref: "DVA", home_center_id: "${ctr_va}", abo_type: "O", hla_a: "A02,A24", hla_b: "B07,B44", hla_drb1: "DRB1*04,DRB1*07", kdri_score: 80, age_at_registration: 30, donor_kind: "PAIRED" }
              as: CenterCoordinator
              as_user_id: "${ctr_va}"
              captures: { d_va: $.data.id }
          trigger:
            - call: "POST /nkr/donors/${d_va}/complete-nephrectomy"
              payload: {}
              as: CenterCoordinator
              as_user_id: "${ctr_vb}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_CENTER_MISMATCH"
            - "response.http == 403"

  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: get_donor_returns_full_record
        claim_type: standard_crud
        grounds:
          - "endpoints.'GET /nkr/donors/{donor_id}"
        distinguishing_aspect: "GET returns donor with all fields populated."
        test_recipe:
          setup: ["Center A; Donor registered"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "E-001", name: "E1", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
              captures: { ctr_e1: $.data.id }
            - call: "POST /nkr/donors"
              payload: { external_ref: "DE1", home_center_id: "${ctr_e1}", abo_type: "O", hla_a: "A02,A24", hla_b: "B07,B44", hla_drb1: "DRB1*04,DRB1*07", kdri_score: 80, age_at_registration: 30, donor_kind: "PAIRED" }
              as: CenterCoordinator
              as_user_id: "${ctr_e1}"
              captures: { d_e1: $.data.id }
          trigger:
            - call: "GET /nkr/donors/${d_e1}"
              payload: {}
              as: RegistryAdmin
          assert:
            - "Donor.id == ${d_e1}"
            - "Donor.medical_status == CLEARED"
            - "Donor.surgery_state == PRE_SURGERY"
            - "Donor.chain_participation_state == POOL"

      - name: list_match_offers_filter_by_chain_id
        claim_type: standard_crud
        grounds:
          - "endpoints.'GET /nkr/match-offers"
        distinguishing_aspect: "Filter by chain_id returns only offers of that chain."
        test_recipe:
          setup: ["Two chains with offers"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            # Setup elided.
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/match-offers"
              payload: {}
              as: MatchOperator
          assert:
            - "Filtered list returns only matching offers"

  # =========================================================================
  # Section: errors
  # =========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape
        claim_type: violation_to_error
        grounds:
          - "response_envelope"
          - "errors[ERR_INVALID_REQUEST"
        distinguishing_aspect: "Error response has meta + response_type=error + data.error_id + data.message."
        test_recipe:
          setup: ["Center A"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "ER-001", name: "ER1", region_code: "T", tier: "STANDARD", max_concurrent_chains: 1 }
              as: RegistryAdmin
              captures: { ctr_er1: $.data.id }
          trigger:
            - call: "POST /nkr/donors"
              payload: { external_ref: "X", home_center_id: "${ctr_er1}", abo_type: "INVALID_ENUM", hla_a: "A02,A24", hla_b: "B07,B44", hla_drb1: "DRB1*04,DRB1*07", kdri_score: 80, age_at_registration: 30, donor_kind: "PAIRED" }
              as: CenterCoordinator
              as_user_id: "${ctr_er1}"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "response.response_type == 'error'"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.data.message is non-empty string"
            - "response.meta contains api_request_id and api_request_timestamp"

  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: match_operator_cannot_register_donor
        claim_type: role_denial
        grounds:
          - "roles.MatchOperator"
