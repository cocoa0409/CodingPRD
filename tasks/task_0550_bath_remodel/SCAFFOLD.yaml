# =============================================================================
# SCAFFOLD — One-Day Bath Remodel (Bath Fitter / Re-Bath style)
# Difficulty band: EXPERT
# =============================================================================

scenario: |
  One-Day Bath Remodel (Bath Fitter/Re-Bath style): in-home design & measure,
  acrylic liner/wall system & color, quote & financing, one-day install
  scheduling & crew, walk-in tub/accessibility add-on, permit if required,
  lifetime warranty & claim, referral

domain_name: bath-remodel

# Flat topology: every resource is a top-level collection (peers linked by
# foreign keys), so there is no single nesting prefix. api_prefix is the empty
# base string; all collection paths sit at the root ("/projects", "/quotes", ...).
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: branching        # + parallel dimensions on Quote
  relationship_patterns:
    - one_to_many                       # Project has many Quotes / Appointments
    - cross_aggregate                   # InstallBooking -> Crew across aggregates
    - self_referential                  # Referral links Customer -> Customer
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Homeowner full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: street_address, type: string, source: input, description: "Service street address" }
      - { name: city, type: string, source: input, description: "Service city" }
      - { name: state_code, type: string, source: input, description: "2-letter US state code", constraints: "^[A-Z]{2}$" }
      - { name: postal_code, type: string, source: input, description: "Service postal code" }
      - { name: referral_code_used, type: string, source: input, default: null, description: "Referral code this customer registered under; links to a Referral.referral_code" }
      - { name: referral_credit_cents, type: integer, source: computed, default: 0, description: "Accumulated referral reward credit; increases when a referral this customer OWNS is REWARDED, decreases when it is VOIDed. Never negative." }

  - name: Designer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Designer full name" }
      - { name: email, type: string, source: input, description: "Designer email" }
      - { name: region_state_code, type: string, source: input, description: "Primary service state", constraints: "^[A-Z]{2}$" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the designer accepts new appointments" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: crew_name, type: string, source: input, description: "Install crew label" }
      - { name: home_state_code, type: string, source: input, description: "Crew home state", constraints: "^[A-Z]{2}$" }
      - { name: max_installs_per_day, type: integer, source: input, description: "Aggregate install capacity per calendar date", constraints: ">= 1" }
      - { name: accessibility_certified, type: boolean, source: input, default: false, description: "Certified to install WALK_IN_TUB / BARRIER_FREE_SHOWER add-ons" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the crew accepts new bookings" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the homeowner" }
      - { name: designer_id, type: string, source: system, default: null, description: "FK -> Designer.id; assigned when the first DesignAppointment is booked; null until then" }
      - { name: state_code, type: string, source: input, description: "Jurisdiction state code", constraints: "^[A-Z]{2}$" }
      - { name: bathroom_type, type: enum, source: input, description: "Scope of remodel", constraints: "FULL_BATH | SHOWER_ONLY | TUB_ONLY" }
      - { name: status, type: enum, source: system, default: "LEAD", description: "Lifecycle state", constraints: "LEAD | DESIGN_SCHEDULED | DESIGN_COMPLETE | QUOTED | SOLD | PERMIT_PENDING | INSTALL_READY | INSTALL_SCHEDULED | INSTALLED | CANCELLED" }
      - { name: measured_wall_area_sqft, type: number, source: system, default: null, description: "Wall area recorded at design-appointment completion; null until DESIGN_COMPLETE" }
      - { name: permit_required, type: boolean, source: computed, default: null, description: "Set at quote acceptance: true when accepted quote.accessibility_addon in {WALK_IN_TUB, BARRIER_FREE_SHOWER}, else false" }
      - { name: requires_accessible_crew, type: boolean, source: computed, default: null, description: "Set at quote acceptance: mirrors permit_required condition; when true only accessibility_certified crews may be booked" }
      - { name: permit_status, type: enum, source: system, default: "NOT_APPLICABLE", description: "Permit lifecycle", constraints: "NOT_APPLICABLE | PENDING | APPROVED | REJECTED" }
      - { name: accepted_quote_total_cents, type: integer, source: computed, default: null, description: "final_total_cents of the accepted quote; null until SOLD" }
      - { name: warranty_status, type: enum, source: system, default: "NONE", description: "Lifetime warranty state", constraints: "NONE | ACTIVE" }
      - { name: warranty_issued_date, type: datetime, source: system, default: null, description: "UTC instant warranty became ACTIVE (install completion)" }
      - { name: cancel_reason, type: string, source: system, default: null, description: "Reason captured at cancellation" }

  - name: DesignAppointment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: designer_id, type: string, source: input, description: "FK -> Designer.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "In-home visit start (UTC, half-open interval start)" }
      - { name: scheduled_end, type: datetime, source: input, description: "In-home visit end (UTC, exclusive)", constraints: "must be strictly after scheduled_start" }
      - { name: measured_wall_area_sqft, type: number, source: input, default: null, description: "Wall area measured at completion; supplied to the complete endpoint", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "Appointment state", constraints: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: wall_system, type: enum, source: input, description: "Acrylic wall system tier", constraints: "SMOOTH_ACRYLIC | TILE_LOOK_ACRYLIC | STONE_LOOK_ACRYLIC" }
      - { name: color, type: enum, source: input, description: "System color", constraints: "WHITE | BONE | GREY | SANDSTONE" }
      - { name: accessibility_addon, type: enum, source: input, default: "NONE", description: "Accessibility add-on", constraints: "NONE | GRAB_BARS | BARRIER_FREE_SHOWER | WALK_IN_TUB" }
      - { name: wall_area_sqft, type: number, source: system, description: "Snapshot of Project.measured_wall_area_sqft taken at quote creation" }
      - { name: promo_code, type: string, source: input, default: null, description: "Optional promo code; only SPRING750 (7.5% per-line discount) is recognized" }
      - { name: system_price_cents, type: integer, source: computed, description: "Tiered acrylic-system price (see quote_system_price_cents)" }
      - { name: addon_price_cents, type: integer, source: computed, description: "Flat add-on price by accessibility_addon" }
      - { name: discount_cents, type: integer, source: computed, description: "Promo discount, rounded PER LINE then summed (see quote_discount_cents)" }
      - { name: net_price_cents, type: integer, source: computed, description: "system_price_cents + addon_price_cents - discount_cents" }
      - { name: permit_surcharge_cents, type: integer, source: computed, default: null, description: "Permit surcharge, computed at acceptance (see quote_final_total_cents)" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "net_price_cents + permit_surcharge_cents; set at ACCEPTED. Null while PRESENTED (estimate == net_price_cents)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Presentation dimension", constraints: "DRAFT | PRESENTED | REVISION_REQUESTED | ACCEPTED | SUPERSEDED" }
      - { name: financing_plan_code, type: string, source: input, default: null, description: "Requested financing plan; one of PLAN_12_0 | PLAN_60_999 | PLAN_120_1299. Null = pay in full" }
      - { name: financing_status, type: enum, source: system, default: "NONE", description: "Financing dimension (independent of status)", constraints: "NONE | REQUESTED | APPROVED | DECLINED" }
      - { name: requested_amount_cents, type: integer, source: input, default: null, description: "Financed amount requested; MUST equal financed_amount_cents (net-based). Required iff financing_plan_code present" }
      - { name: stated_annual_income_cents, type: integer, source: input, default: null, description: "Applicant stated annual income; used for DTI tier. Required iff financing_plan_code present" }
      - { name: deposit_cents, type: integer, source: computed, default: null, description: "Deposit = round_half_up(net_price_cents * 0.10); set when financing REQUESTED" }
      - { name: financed_amount_cents, type: integer, source: computed, default: null, description: "net_price_cents - deposit_cents; set when financing REQUESTED" }
      - { name: approved_apr_bps, type: integer, source: computed, default: null, description: "Approved APR in basis points; set at finance approval (see financing_terms)" }
      - { name: monthly_payment_cents, type: integer, source: computed, default: null, description: "Amortized monthly payment; set at finance approval" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Increments each time the customer requests a revision" }

  - name: InstallBooking
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id" }
      - { name: install_date, type: datetime, source: input, description: "Calendar date of the one-day install (UTC midnight). Date component is the occupancy bucket" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "Booking state", constraints: "BOOKED | COMPLETED | CANCELLED" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "UTC instant install marked COMPLETED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: defect_type, type: enum, source: input, description: "Reported defect", constraints: "CRACK | LEAK | DISCOLORATION | HARDWARE_FAILURE" }
      - { name: description, type: string, source: input, description: "Free-text defect description" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "Claim state", constraints: "SUBMITTED | APPROVED | REJECTED" }
      - { name: resolution, type: enum, source: system, default: null, description: "Resolution decision", constraints: "REPAIR | REPLACE | DENIED" }
      - { name: review_notes, type: string, source: system, default: null, description: "Reviewer notes captured at decision" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: referrer_customer_id, type: string, source: input, description: "FK -> Customer.id; existing customer who refers a friend" }
      - { name: referred_customer_id, type: string, source: system, default: null, description: "FK -> Customer.id; set when a new Customer registers with this referral_code" }
      - { name: referred_project_id, type: string, source: system, default: null, description: "FK -> Project.id; the referred customer's project whose SOLD transition triggers the reward" }
      - { name: referral_code, type: string, source: system, description: "Unique code generated at issue (e.g. REF-XXXX)" }
      - { name: program_tier, type: enum, source: input, default: "STANDARD", description: "Reward variant selector", constraints: "STANDARD | PREMIUM" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "Referral lifecycle", constraints: "ISSUED | REGISTERED | REWARDED | VOID" }
      - { name: reward_cents, type: integer, source: computed, default: 0, description: "Reward credited to the referrer (see referral_reward_cents)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- Project: branching lifecycle (fork at SOLD on permit_required) -----
  - entity: Project
    initial_state: LEAD
    terminal_states: [INSTALLED, CANCELLED]
    transitions:
      - from: LEAD
        to: DESIGN_SCHEDULED
        trigger: "POST /design-appointments"
        actor: Customer | InstallCoordinator
        preconditions:
          - "Project.status == LEAD (ERR_PROJECT_INVALID_STATE)"
          - "Designer.active == true (ERR_DESIGNER_INACTIVE)"
          - "No SCHEDULED DesignAppointment on the designer overlaps [start,end) or sits within BUFFER_MINUTES (=60) of one (ERR_DESIGNER_SLOT_CONFLICT)"
        side_effects:
          - "Project.designer_id set to the booked designer_id"
          - "New DesignAppointment created in SCHEDULED"
      - from: DESIGN_SCHEDULED
        to: DESIGN_COMPLETE
        trigger: "POST /design-appointments/{id}/complete"
        actor: Designer
        preconditions:
          - "Acting Designer == Project.designer_id (ERR_NOT_RESOURCE_OWNER)"
          - "DesignAppointment.status == SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
        side_effects:
          - "DesignAppointment.status -> COMPLETED"
          - "Project.measured_wall_area_sqft set from the appointment's measured_wall_area_sqft"
      - from: DESIGN_COMPLETE
        to: QUOTED
        trigger: "POST /quotes/{id}/present"
        actor: Designer
        preconditions:
          - "Quote.status == DRAFT (ERR_QUOTE_INVALID_STATE)"
        side_effects:
          - "Quote.status -> PRESENTED"
      - from: QUOTED
        to: DESIGN_COMPLETE
        trigger: "POST /quotes/{id}/request-revision"
        actor: Customer
        preconditions:
          - "Quote.status == PRESENTED (ERR_QUOTE_INVALID_STATE)"
        side_effects:
          - "Quote.status -> REVISION_REQUESTED; Quote.revision_round += 1"
        note: "Revision loop: Project drops back to DESIGN_COMPLETE so the designer can create a superseding quote."
      - from: QUOTED
        to: SOLD
        trigger: "POST /quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "Acting Customer == Project.customer_id (ERR_NOT_RESOURCE_OWNER)"
          - "Quote.status == PRESENTED (ERR_QUOTE_INVALID_STATE)"
          - "Quote.financing_status in {NONE, APPROVED} (ERR_FINANCING_NOT_APPROVED)"
        side_effects:
          - "Quote.status -> ACCEPTED; Quote.permit_surcharge_cents + Quote.final_total_cents computed"
          - "Project.permit_required + Project.requires_accessible_crew computed from Quote.accessibility_addon"
          - "Project.accepted_quote_total_cents = Quote.final_total_cents"
          - "All sibling Quotes of this Project in {DRAFT, PRESENTED, REVISION_REQUESTED} -> SUPERSEDED"
          - "CASCADE: Project transitions onward to PERMIT_PENDING or INSTALL_READY (branch below)"
          - "CASCADE: any REGISTERED Referral with referred_project_id == this project (or referred_customer_id == this customer) is REWARDED"
      - from: SOLD
        to: PERMIT_PENDING
        trigger: "system (branch during accept when permit_required == true)"
        actor: system
        preconditions:
          - "Project.permit_required == true"
        side_effects:
          - "Project.permit_status -> PENDING"
      - from: SOLD
        to: INSTALL_READY
        trigger: "system (branch during accept when permit_required == false)"
        actor: system
        preconditions:
          - "Project.permit_required == false"
        side_effects:
          - "Project.permit_status stays NOT_APPLICABLE"
      - from: PERMIT_PENDING
        to: INSTALL_READY
        trigger: "POST /projects/{id}/resolve-permit (outcome=APPROVED)"
        actor: InstallCoordinator
        preconditions:
          - "Project.status == PERMIT_PENDING (ERR_PROJECT_INVALID_STATE)"
        side_effects:
          - "Project.permit_status -> APPROVED"
      - from: PERMIT_PENDING
        to: PERMIT_PENDING
        trigger: "POST /projects/{id}/resolve-permit (outcome=REJECTED)"
        actor: InstallCoordinator
        preconditions:
          - "Project.status == PERMIT_PENDING (ERR_PROJECT_INVALID_STATE)"
        side_effects:
          - "Project.permit_status -> REJECTED (resubmission allowed; stays PERMIT_PENDING)"
      - from: INSTALL_READY
        to: INSTALL_SCHEDULED
        trigger: "POST /install-bookings"
        actor: InstallCoordinator
        preconditions:
          - "Project.status == INSTALL_READY (ERR_PROJECT_NOT_INSTALL_READY)"
          - "Crew.active == true (ERR_CREW_INACTIVE)"
          - "If Project.requires_accessible_crew, Crew.accessibility_certified == true (ERR_CREW_NOT_CERTIFIED)"
          - "install_date >= clock_date + MIN_LEAD_DAYS (=3 days) (ERR_INSTALL_LEAD_TIME)"
          - "count of BOOKED InstallBookings for (crew_id, install_date) < Crew.max_installs_per_day (ERR_CREW_AT_CAPACITY)"
        side_effects:
          - "New InstallBooking created in BOOKED"
      - from: INSTALL_SCHEDULED
        to: INSTALL_READY
        trigger: "POST /install-bookings/{id}/cancel"
        actor: InstallCoordinator | Customer
        preconditions:
          - "InstallBooking.status == BOOKED (ERR_BOOKING_INVALID_STATE)"
        side_effects:
          - "InstallBooking.status -> CANCELLED (crew slot released)"
      - from: INSTALL_SCHEDULED
        to: INSTALLED
        trigger: "POST /install-bookings/{id}/complete"
        actor: InstallCoordinator
        preconditions:
          - "InstallBooking.status == BOOKED (ERR_BOOKING_INVALID_STATE)"
        side_effects:
          - "InstallBooking.status -> COMPLETED; InstallBooking.completed_at stamped"
          - "Project.warranty_status -> ACTIVE; Project.warranty_issued_date stamped"
      - from: [LEAD, DESIGN_SCHEDULED, DESIGN_COMPLETE, QUOTED, SOLD, PERMIT_PENDING, INSTALL_READY, INSTALL_SCHEDULED]
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Customer | InstallCoordinator | PlatformAdmin
        preconditions:
          - "Project.status != INSTALLED and != CANCELLED (ERR_PROJECT_INVALID_STATE)"
        side_effects:
          - "Project.cancel_reason recorded"
          - "CASCADE: any SCHEDULED DesignAppointment -> CANCELLED"
          - "CASCADE: any BOOKED InstallBooking -> CANCELLED (crew slot released)"
          - "CASCADE: any Quote in {DRAFT, PRESENTED, REVISION_REQUESTED} -> SUPERSEDED (which DECLINEs its REQUESTED financing)"
          - "CASCADE: any REWARDED Referral for this project -> VOID (which reverses the referrer's credit)"

  # ----- Quote: PARALLEL dimensions (status axis  x  financing_status axis) -----
  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      # --- status axis ---
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /quotes/{id}/present"
        actor: Designer
        preconditions:
          - "Quote.status == DRAFT (ERR_QUOTE_INVALID_STATE)"
        side_effects: ["Project.status DESIGN_COMPLETE -> QUOTED"]
      - from: PRESENTED
        to: REVISION_REQUESTED
        trigger: "POST /quotes/{id}/request-revision"
        actor: Customer
        preconditions:
          - "Acting Customer == Project.customer_id (ERR_NOT_RESOURCE_OWNER)"
          - "Quote.status == PRESENTED (ERR_QUOTE_INVALID_STATE)"
        side_effects: ["Quote.revision_round += 1", "Project.status QUOTED -> DESIGN_COMPLETE"]
      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "Acting Customer == Project.customer_id (ERR_NOT_RESOURCE_OWNER)"
          - "Quote.status == PRESENTED (ERR_QUOTE_INVALID_STATE)"
          - "Quote.financing_status in {NONE, APPROVED} (ERR_FINANCING_NOT_APPROVED)"
        side_effects:
          - "permit_surcharge_cents + final_total_cents computed (FINAL variant)"
          - "Project QUOTED -> SOLD (drives the Project cascade)"
      - from: [DRAFT, PRESENTED, REVISION_REQUESTED]
        to: SUPERSEDED
        trigger: "system (a newer Quote is created for the same Project, or the Project is cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "If financing_status == REQUESTED -> DECLINED (financing withdrawn)"
      # --- financing_status axis (independent of the status axis above) ---
      - from: NONE
        to: REQUESTED
        trigger: "system (POST /quotes with financing_plan_code present)"
        actor: system
        preconditions:
          - "financing_plan_code is non-null at creation"
        side_effects:
          - "deposit_cents + financed_amount_cents computed"
        note: "financing_status axis. Starts REQUESTED at creation when a plan is chosen, else stays NONE."
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /quotes/{id}/finance-decide (decision=APPROVE)"
        actor: FinanceOfficer
        preconditions:
          - "Quote.financing_status == REQUESTED (ERR_FINANCING_NOT_REQUESTED)"
          - "DTI ratio financed_amount_cents / stated_annual_income_cents <= DTI_MAX_RATIO (ERR_DTI_EXCEEDED)"
        side_effects: ["approved_apr_bps + monthly_payment_cents computed"]
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /quotes/{id}/finance-decide (decision=DECLINE)"
        actor: FinanceOfficer
        preconditions:
          - "Quote.financing_status == REQUESTED (ERR_FINANCING_NOT_REQUESTED)"
        side_effects: []

  # ----- DesignAppointment: branching -----
  - entity: DesignAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /design-appointments/{id}/complete"
        actor: Designer
        preconditions:
          - "Acting Designer == DesignAppointment.designer_id (ERR_NOT_RESOURCE_OWNER)"
          - "DesignAppointment.status == SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
          - "measured_wall_area_sqft > 0 (ERR_VALIDATION)"
        side_effects: ["Project measured_wall_area_sqft set; Project DESIGN_SCHEDULED -> DESIGN_COMPLETE"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /design-appointments/{id}/cancel  OR  system (parent Project cancelled)"
        actor: Customer | InstallCoordinator | system
        preconditions:
          - "DesignAppointment.status == SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
        side_effects: ["Designer time slot released"]

  # ----- InstallBooking: linear with cancel -----
  - entity: InstallBooking
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /install-bookings/{id}/complete"
        actor: InstallCoordinator
        preconditions:
          - "InstallBooking.status == BOOKED (ERR_BOOKING_INVALID_STATE)"
        side_effects:
          - "completed_at stamped"
          - "Project INSTALL_SCHEDULED -> INSTALLED; Project.warranty_status -> ACTIVE"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /install-bookings/{id}/cancel  OR  system (parent Project cancelled)"
        actor: InstallCoordinator | Customer | system
        preconditions:
          - "InstallBooking.status == BOOKED (ERR_BOOKING_INVALID_STATE)"
        side_effects:
          - "Crew slot for (crew_id, install_date) released"
          - "If triggered directly, Project INSTALL_SCHEDULED -> INSTALL_READY"

  # ----- WarrantyClaim: branching (approve/reject) -----
  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/decide (decision=APPROVE)"
        actor: InstallCoordinator
        preconditions:
          - "WarrantyClaim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
          - "resolution in {REPAIR, REPLACE} supplied (ERR_VALIDATION)"
        side_effects: ["resolution + review_notes recorded"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /warranty-claims/{id}/decide (decision=REJECT)"
        actor: InstallCoordinator
        preconditions:
          - "WarrantyClaim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
        side_effects: ["resolution -> DENIED; review_notes recorded"]

  # ----- Referral: linear pipeline with void -----
  - entity: Referral
    initial_state: ISSUED
    terminal_states: [VOID]
    transitions:
      - from: ISSUED
        to: REGISTERED
        trigger: "system (POST /customers with referral_code_used == this Referral.referral_code)"
        actor: system
        preconditions:
          - "Referral.status == ISSUED"
        side_effects: ["referred_customer_id set to the new customer"]
      - from: REGISTERED
        to: REWARDED
        trigger: "system (referred customer's Project reaches SOLD)"
        actor: system
        preconditions:
          - "Referral.status == REGISTERED"
        side_effects:
          - "referred_project_id set; reward_cents computed (variant by program_tier)"
          - "referrer Customer.referral_credit_cents += reward_cents"
      - from: [ISSUED, REGISTERED, REWARDED]
        to: VOID
        trigger: "POST /referrals/{id}/void  OR  system (referred Project cancelled)"
        actor: PlatformAdmin | InstallCoordinator | system
        preconditions:
          - "Referral.status != VOID (ERR_REFERRAL_INVALID_STATE)"
        side_effects:
          - "If status was REWARDED, referrer Customer.referral_credit_cents -= reward_cents (compensation)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /quotes"
    occ_field: "expected_project_version"
    description: |
      Creating a Quote against a Project whose version has advanced since the
      client last observed it is rejected. A new Quote legitimately supersedes
      any prior active Quote on the Project; when another writer has just
      created such a superseding Quote (advancing Project.version), the current
      writer's view of the Project is stale and the create is refused.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- (Rule 2 mode a) tiered marginal-rate acrylic pricing ---
  - name: quote_system_price_cents
    trigger: "POST /quotes (create) and POST /quotes/{id}/present recompute"
    algorithm: tiered_pricing
    formula: |
      rate = BASE_RATE_CENTS[wall_system]            # per sqft
      area = Quote.wall_area_sqft                     # from Project.measured_wall_area_sqft
      t1 = min(area, 40)                              # first 40 sqft at full rate
      t2 = min(max(area - 40, 0), 40)                 # next 40 sqft at 90%
      t3 = max(area - 80, 0)                          # remainder at 80%
      system_price_cents = round_half_up(
          t1*rate + t2*rate*0.90 + t3*rate*0.80 )     # ONE final rounding of the summed tiers
    input_set: "Single Quote; wall_system tier and the area snapshot at creation"
    constants:
      BASE_RATE_CENTS: { SMOOTH_ACRYLIC: 3750, TILE_LOOK_ACRYLIC: 5900, STONE_LOOK_ACRYLIC: 8250 }
      TIER1_SQFT: 40
      TIER2_SQFT: 40
      TIER2_FACTOR: 0.90
      TIER3_FACTOR: 0.80
    precision: "whole cents, round_half_up"
    note: "Marginal tiering: area is split across breakpoints at 40 and 80 sqft; boundary is >80 (area==80 stays in tier2). Non-linear in 3 inputs (rate, area, tier)."

  # --- (Rule 2 mode b) per-line-item promo discount, rounding order pinned ---
  - name: quote_discount_cents
    trigger: "POST /quotes (create) and POST /quotes/{id}/present recompute"
    algorithm: aggregation
    formula: |
      addon_price_cents = ADDON_PRICE_CENTS[accessibility_addon]
      if promo_code == "SPRING750":
        pct = PROMO_PCT["SPRING750"]                  # 0.075
        # PINNED ORDER: round each line item's discount to the cent, THEN sum.
        d_system = round_half_up(system_price_cents * pct)
        d_addon  = round_half_up(addon_price_cents  * pct)
        discount_cents = d_system + d_addon
      else:
        discount_cents = 0
      net_price_cents = system_price_cents + addon_price_cents - discount_cents
    input_set: "Single Quote; the two line items {system_price_cents, addon_price_cents}"
    constants:
      ADDON_PRICE_CENTS: { NONE: 0, GRAB_BARS: 29900, BARRIER_FREE_SHOWER: 249900, WALK_IN_TUB: 449900 }
      PROMO_PCT: { SPRING750: 0.075 }
    precision: "whole cents, round_half_up"
    note: "Rounding order matters: round-per-line-item then sum is PINNED. 'Sum lines then apply pct then round' can differ by 1 cent (e.g. system=217500, addon=449900, pct=0.075 -> per-line 50056 vs total-round 50055)."

  # --- (Rule 1 dual-variant #1  +  Rule 2 mode c) estimate vs final total ---
  - name: quote_final_total_cents
    trigger: "POST /quotes/{id}/accept"
    algorithm: threshold
    formula: |
      # Circular-looking: the permit surcharge is a tier that could seem keyed
      # on the total, but the total also adds the surcharge. Break the cycle by
      # PINNING the surcharge tier to net_price_cents (evaluated first).
      if permit_required(Quote.accessibility_addon):
        if net_price_cents <= SURCHARGE_TIER_THRESHOLD:   # <= 500000
          permit_surcharge_cents = PERMIT_FEE_LOW         # 15000
        else:
          permit_surcharge_cents = PERMIT_FEE_HIGH        # 30000
      else:
        permit_surcharge_cents = 0
      final_total_cents = net_price_cents + permit_surcharge_cents
    input_set: "Single Quote at acceptance"
    constants:
      SURCHARGE_TIER_THRESHOLD: 500000
      PERMIT_FEE_LOW: 15000
      PERMIT_FEE_HIGH: 30000
      ACCESSIBILITY_ADDONS: [WALK_IN_TUB, BARRIER_FREE_SHOWER]
    precision: "whole cents"
    variants:
      - name: ESTIMATE
        when: "Quote is PRESENTED (not yet accepted); observed as net_price_cents"
        difference: "Excludes permit_surcharge_cents entirely (permit not yet determined). final_total_cents is null."
      - name: FINAL
        when: "Quote is ACCEPTED"
        difference: "Adds permit_surcharge_cents (tiered on net_price_cents) to net_price_cents. Differs from ESTIMATE by the surcharge whenever permit_required."

  # --- (Rule 2 mode c support) financing terms: deposit -> financed -> apr -> payment ---
  - name: financing_terms
    trigger: "POST /quotes (create, when financing_plan_code present) and POST /quotes/{id}/finance-decide (APPROVE)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned (each step feeds the next):
      # 1) deposit  = round_half_up(net_price_cents * DEPOSIT_PCT)     [at creation]
      # 2) financed = net_price_cents - deposit                       [at creation]
      #    requested_amount_cents MUST equal financed  (else ERR_FINANCING_AMOUNT_MISMATCH)
      # 3) DTI ratio = financed / stated_annual_income_cents          [at approval]
      #    surcharge_bps by tier: <=0.20 -> 0 ; <=0.35 -> 250 ; <=0.50 -> 600 ; else DECLINE
      #    approved_apr_bps = PLAN[plan_code].apr_bps + surcharge_bps
      # 4) r = approved_apr_bps / 10000 / 12
      #    n = PLAN[plan_code].term_months
      #    monthly_payment_cents = round_half_up( financed * r * (1+r)^n / ((1+r)^n - 1) )
      #    (if r == 0, monthly_payment_cents = round_half_up(financed / n))
    input_set: "Single Quote; net_price_cents, chosen plan, stated income"
    constants:
      DEPOSIT_PCT: 0.10
      DTI_MAX_RATIO: 0.50
      DTI_TIERS: [{ max: 0.20, bps: 0 }, { max: 0.35, bps: 250 }, { max: 0.50, bps: 600 }]
      PLAN:
        PLAN_12_0:    { apr_bps: 0,    term_months: 12,  min_amount_cents: 100000, max_amount_cents: 1500000 }
        PLAN_60_999:  { apr_bps: 999,  term_months: 60,  min_amount_cents: 300000, max_amount_cents: 5000000 }
        PLAN_120_1299: { apr_bps: 1299, term_months: 120, min_amount_cents: 500000, max_amount_cents: 8000000 }
    precision: "whole cents, round_half_up; APR in basis points (integer)"
    note: "DTI tier boundaries inclusive on upper bound (ratio == 0.20 -> tier 0). Amount bounds checked against PLAN[min,max] with <= / >= (see validations)."

  # --- (Rule 1 dual-variant #2) referral reward: flat vs completion-percentage ---
  - name: referral_reward_cents
    trigger: "system, when the referred customer's Project reaches SOLD (Referral REGISTERED -> REWARDED)"
    algorithm: threshold
    formula: |
      if program_tier == "STANDARD":
        reward_cents = REFERRAL_FLAT_CENTS                                   # 50000
      elif program_tier == "PREMIUM":
        reward_cents = round_half_up(referred_project.accepted_quote_total_cents * REFERRAL_PCT)   # 3%
    input_set: "Single Referral + the referred Project's accepted_quote_total_cents"
    constants:
      REFERRAL_FLAT_CENTS: 50000
      REFERRAL_PCT: 0.03
    precision: "whole cents, round_half_up"
    variants:
      - name: STANDARD
        when: "Referral.program_tier == STANDARD"
        difference: "Flat 50000 regardless of project value."
      - name: PREMIUM
        when: "Referral.program_tier == PREMIUM"
        difference: "3% of the referred project's accepted_quote_total_cents; e.g. final_total 647344 -> 19420. Same referred project yields a different reward than STANDARD."

  # --- (Rule 9 invariant #1 support) crew per-date available capacity ---
  - name: crew_available_slots
    trigger: "read-time / evaluated on POST /install-bookings and on cancel"
    algorithm: aggregation
    formula: |
      booked = count(InstallBooking
                     where crew_id == C and install_date == D
                       and status == BOOKED)
      available = Crew.max_installs_per_day - booked
    input_set: "InstallBookings with status == BOOKED for a fixed (crew_id, install_date); COMPLETED and CANCELLED are excluded"
    precision: "integer count"
    note: "Conserved quantity for the book/cancel compensating invariant: available is unchanged after a book followed by a cancel of the same booking."

  # --- (Rule 9 invariant #2 support) total outstanding referral credit ---
  - name: customer_referral_credit_cents
    trigger: "Referral REGISTERED->REWARDED (add) and REWARDED->VOID (reverse)"
    algorithm: aggregation
    formula: |
      Customer.referral_credit_cents =
        sum(reward_cents for Referral
            where referrer_customer_id == this customer and status == REWARDED)
      # Global invariant:
      #   sum over all Customers of referral_credit_cents
      #     == sum over all REWARDED Referrals of reward_cents
    input_set: "Referrals with status == REWARDED (ISSUED/REGISTERED/VOID excluded)"
    precision: "whole cents; floor at 0 (never negative)"
    note: "Conserved quantity for the reward/void compensating invariant."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is authorized for this operation per §1.7 RBAC"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body shape: required fields present, correct types, enum membership, scheduled_end > scheduled_start, measured_wall_area_sqft > 0, positive amounts"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 4
    category: existence
    check: "Every path/body id resolves to a live resource, validated left-to-right"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_DESIGNER_NOT_FOUND | ERR_CREW_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_REFERRAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with ids"

  - priority: 5
    category: auth
    check: "Ownership for entity_backed roles: Customer acting on a Project (or its Quote/Booking/Claim) must equal Project.customer_id; Designer acting on an appointment/quote must equal the assigned designer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "customer/designer-scoped mutations"

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_project_version must equal current Project.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /quotes"

  - priority: 7
    category: state
    check: "Target/parent resource is in a state that permits this transition (see §1.2 preconditions)"
    error_id: "ERR_PROJECT_INVALID_STATE | ERR_PROJECT_NOT_INSTALL_READY | ERR_QUOTE_INVALID_STATE | ERR_APPOINTMENT_INVALID_STATE | ERR_BOOKING_INVALID_STATE | ERR_CLAIM_INVALID_STATE | ERR_REFERRAL_INVALID_STATE | ERR_FINANCING_NOT_REQUESTED"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_referential
    check: "Cross-entity state gates: accept requires Quote.financing_status in {NONE, APPROVED}; install on a requires_accessible_crew project requires Crew.accessibility_certified (permit is already enforced via the INSTALL_READY state gate); warranty-claim requires Project.warranty_status == ACTIVE; resolve-permit requires Project.permit_required == true; design-appointment requires Designer.active; install requires Crew.active"
    error_id: "ERR_FINANCING_NOT_APPROVED | ERR_CREW_NOT_CERTIFIED | ERR_WARRANTY_NOT_ACTIVE | ERR_PERMIT_NOT_REQUIRED | ERR_DESIGNER_INACTIVE | ERR_CREW_INACTIVE"
    http_status: 409
    applies_to: "POST /quotes/{id}/accept, POST /install-bookings, POST /warranty-claims, POST /projects/{id}/resolve-permit, POST /design-appointments"

  - priority: 9
    category: business_temporal
    check: "Temporal-resource conflicts: designer pairwise overlap + BUFFER_MINUTES(=60) buffer; crew per-date aggregate capacity; install minimum lead time MIN_LEAD_DAYS(=3)"
    error_id: "ERR_DESIGNER_SLOT_CONFLICT | ERR_CREW_AT_CAPACITY | ERR_INSTALL_LEAD_TIME"
    http_status: 409
    applies_to: "POST /design-appointments, POST /install-bookings"

  - priority: 10
    category: business_constraint
    check: "Financing amount coherence: requested_amount_cents must equal financed_amount_cents (net_price_cents - deposit_cents)"
    error_id: ERR_FINANCING_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /quotes (when financing_plan_code present)"

  - priority: 11
    category: business_fiscal
    check: "Financing amount bounds: PLAN[min] <= requested_amount_cents <= PLAN[max]; and DTI ratio <= DTI_MAX_RATIO at approval"
    error_id: "ERR_FINANCING_AMOUNT_EXCEEDS_MAX | ERR_FINANCING_AMOUNT_BELOW_MIN | ERR_DTI_EXCEEDED"
    http_status: 422
    applies_to: "POST /quotes (when financing_plan_code present), POST /quotes/{id}/finance-decide"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- Customer ----------------
  - method: POST
    path: "/customers"
    description: "Create a homeowner customer (lead intake). If referral_code_used matches an ISSUED referral, that referral registers."
    roles: [PlatformAdmin, InstallCoordinator]
    code: 201
    input: [full_name, email, phone, street_address, city, state_code, postal_code, "referral_code_used?"]
    output: Customer
    side_effects: ["referral_credit_cents=0", "matching ISSUED Referral -> REGISTERED (referred_customer_id set)"]
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---------------- Designer ----------------
  - method: POST
    path: "/designers"
    description: "Register an in-home designer"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, region_state_code, "active?"]
    output: Designer
    side_effects: []
  - method: GET
    path: "/designers/{id}"
    description: "Fetch a designer"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Designer
    side_effects: []

  # ---------------- Crew ----------------
  - method: POST
    path: "/crews"
    description: "Register an install crew (temporal resource)"
    roles: [PlatformAdmin]
    code: 201
    input: [crew_name, home_state_code, max_installs_per_day, "accessibility_certified?", "active?"]
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "Fetch a crew"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # ---------------- Project ----------------
  - method: POST
    path: "/projects"
    description: "Open a remodel project (lead)"
    roles: [InstallCoordinator, PlatformAdmin, Designer]
    code: 201
    input: [customer_id, state_code, bathroom_type]
    output: Project
    side_effects: ["status=LEAD; warranty_status=NONE; permit_status=NOT_APPLICABLE"]
  - method: GET
    path: "/projects"
    description: "List/filter projects"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: ["customer_id?", "designer_id?", "status?", "limit?", "offset?"]
    output: "Project[]"
    side_effects: []
  - method: GET
    path: "/projects/{id}"
    description: "Fetch a project (source of Project.version for OCC)"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/projects/{id}/resolve-permit"
    description: "Record a permit decision for a permit-required project"
    roles: [InstallCoordinator]
    code: 200
    input: [outcome]
    output: Project
    side_effects: ["outcome=APPROVED: permit_status=APPROVED, status PERMIT_PENDING->INSTALL_READY", "outcome=REJECTED: permit_status=REJECTED (stays PERMIT_PENDING)"]
  - method: POST
    path: "/projects/{id}/cancel"
    description: "Cancel a project (cascades to appointments, bookings, quotes, referrals)"
    roles: [Customer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: ["cancel_reason?"]
    output: Project
    side_effects:
      - "status -> CANCELLED"
      - "SCHEDULED DesignAppointments -> CANCELLED"
      - "BOOKED InstallBookings -> CANCELLED (slots released)"
      - "active Quotes -> SUPERSEDED (REQUESTED financing -> DECLINED)"
      - "REWARDED Referrals -> VOID (referrer credit reversed)"

  # ---------------- DesignAppointment ----------------
  - method: POST
    path: "/design-appointments"
    description: "Book an in-home design & measure visit (assigns the designer)"
    roles: [Customer, InstallCoordinator]
    code: 201
    input: [project_id, designer_id, scheduled_start, scheduled_end]
    output: DesignAppointment
    side_effects: ["status=SCHEDULED", "Project.designer_id set; Project LEAD->DESIGN_SCHEDULED", "designer overlap+buffer check"]
  - method: GET
    path: "/design-appointments"
    description: "List/filter design appointments"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: ["project_id?", "designer_id?", "status?", "limit?", "offset?"]
    output: "DesignAppointment[]"
    side_effects: []
  - method: GET
    path: "/design-appointments/{id}"
    description: "Fetch a design appointment"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: DesignAppointment
    side_effects: []
  - method: POST
    path: "/design-appointments/{id}/complete"
    description: "Complete the visit, record the measured wall area"
    roles: [Designer]
    code: 200
    input: [measured_wall_area_sqft]
    output: DesignAppointment
    side_effects: ["status->COMPLETED", "Project.measured_wall_area_sqft set; Project DESIGN_SCHEDULED->DESIGN_COMPLETE"]
  - method: POST
    path: "/design-appointments/{id}/cancel"
    description: "Cancel a scheduled visit"
    roles: [Customer, InstallCoordinator]
    code: 200
    input: []
    output: DesignAppointment
    side_effects: ["status->CANCELLED (designer slot released)"]

  # ---------------- Quote ----------------
  - method: POST
    path: "/quotes"
    description: "Create a quote draft from a DESIGN_COMPLETE project; optionally request financing. OCC-guarded on Project.version."
    roles: [Designer]
    code: 201
    input: [project_id, wall_system, color, "accessibility_addon?", "promo_code?", "financing_plan_code?", "requested_amount_cents?", "stated_annual_income_cents?", expected_project_version]
    output: Quote
    side_effects:
      - "status=DRAFT; wall_area_sqft snapshot from Project"
      - "system_price_cents, addon_price_cents, discount_cents, net_price_cents computed"
      - "if financing_plan_code: financing_status=REQUESTED; deposit_cents, financed_amount_cents computed"
      - "sibling active Quotes on the Project -> SUPERSEDED"
      - "increments Project.version by 1"
  - method: GET
    path: "/quotes"
    description: "List/filter quotes"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: "Quote[]"
    side_effects: []
  - method: GET
    path: "/quotes/{id}"
    description: "Fetch a quote"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: POST
    path: "/quotes/{id}/present"
    description: "Present the quote to the customer"
    roles: [Designer]
    code: 200
    input: []
    output: Quote
    side_effects: ["status DRAFT->PRESENTED; Project DESIGN_COMPLETE->QUOTED"]
  - method: POST
    path: "/quotes/{id}/request-revision"
    description: "Customer requests changes to a presented quote"
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["status PRESENTED->REVISION_REQUESTED; revision_round += 1; Project QUOTED->DESIGN_COMPLETE"]
  - method: POST
    path: "/quotes/{id}/finance-decide"
    description: "Finance officer approves or declines the requested financing"
    roles: [FinanceOfficer]
    code: 200
    input: [decision]
    output: Quote
    side_effects: ["APPROVE: financing_status->APPROVED; approved_apr_bps + monthly_payment_cents computed (DTI-checked)", "DECLINE: financing_status->DECLINED"]
  - method: POST
    path: "/quotes/{id}/accept"
    description: "Customer accepts the quote (sells the project)"
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects:
      - "status PRESENTED->ACCEPTED; permit_surcharge_cents + final_total_cents computed (FINAL variant)"
      - "Project QUOTED->SOLD; permit_required/requires_accessible_crew/accepted_quote_total_cents set"
      - "branch: Project -> PERMIT_PENDING or INSTALL_READY"
      - "sibling Quotes -> SUPERSEDED"
      - "REGISTERED Referral for this customer/project -> REWARDED (referrer credit += reward_cents)"

  # ---------------- InstallBooking ----------------
  - method: POST
    path: "/install-bookings"
    description: "Schedule the one-day install on a crew for a date"
    roles: [InstallCoordinator]
    code: 201
    input: [project_id, crew_id, install_date]
    output: InstallBooking
    side_effects: ["status=BOOKED; Project INSTALL_READY->INSTALL_SCHEDULED", "capacity + lead-time + cert checks"]
  - method: GET
    path: "/install-bookings"
    description: "List/filter install bookings"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: ["project_id?", "crew_id?", "status?", "limit?", "offset?"]
    output: "InstallBooking[]"
    side_effects: []
  - method: GET
    path: "/install-bookings/{id}"
    description: "Fetch an install booking"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: InstallBooking
    side_effects: []
  - method: POST
    path: "/install-bookings/{id}/complete"
    description: "Mark the install complete; issue the lifetime warranty"
    roles: [InstallCoordinator]
    code: 200
    input: []
    output: InstallBooking
    side_effects: ["status->COMPLETED; completed_at stamped", "Project INSTALL_SCHEDULED->INSTALLED; warranty_status->ACTIVE; warranty_issued_date stamped"]
  - method: POST
    path: "/install-bookings/{id}/cancel"
    description: "Cancel a booking; release the crew slot"
    roles: [InstallCoordinator, Customer]
    code: 200
    input: []
    output: InstallBooking
    side_effects: ["status->CANCELLED (slot released)", "Project INSTALL_SCHEDULED->INSTALL_READY"]

  # ---------------- WarrantyClaim ----------------
  - method: POST
    path: "/warranty-claims"
    description: "File a lifetime-warranty claim against an installed project"
    roles: [Customer]
    code: 201
    input: [project_id, defect_type, description]
    output: WarrantyClaim
    side_effects: ["status=SUBMITTED", "requires Project.warranty_status == ACTIVE"]
  - method: GET
    path: "/warranty-claims"
    description: "List/filter warranty claims"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Fetch a warranty claim"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/decide"
    description: "Approve (REPAIR/REPLACE) or reject (DENIED) a claim"
    roles: [InstallCoordinator]
    code: 200
    input: [decision, "resolution?", "review_notes?"]
    output: WarrantyClaim
    side_effects: ["APPROVE: status->APPROVED, resolution recorded", "REJECT: status->REJECTED, resolution=DENIED"]

  # ---------------- Referral ----------------
  - method: POST
    path: "/referrals"
    description: "Issue a referral code for an existing customer"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [referrer_customer_id, "program_tier?"]
    output: Referral
    side_effects: ["status=ISSUED; referral_code generated; reward_cents=0"]
  - method: GET
    path: "/referrals"
    description: "List/filter referrals"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: ["referrer_customer_id?", "referred_customer_id?", "referred_project_id?", "status?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []
  - method: GET
    path: "/referrals/{id}"
    description: "Fetch a referral"
    roles: [Customer, Designer, FinanceOfficer, InstallCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: POST
    path: "/referrals/{id}/void"
    description: "Void a referral; reverse credit if already REWARDED"
    roles: [PlatformAdmin, InstallCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["status->VOID", "if was REWARDED, referrer Customer.referral_credit_cents -= reward_cents"]

  # ---------------- Test-driving: logical clock ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. Governs install lead-time and any date rule."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / request shape ---
  - { id: ERR_MISSING_USER_CONTEXT,      http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,  http: 403, condition: "Role not authorized for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER,        http: 403, condition: "entity_backed actor is not the owner (Customer!=project.customer_id, or Designer!=assigned designer_id)" }
  - { id: ERR_VALIDATION,                http: 422, condition: "Malformed body: missing required field, bad type/enum, scheduled_end<=start, non-positive amount/area" }
  # --- existence ---
  - { id: ERR_CUSTOMER_NOT_FOUND,        http: 404, condition: "customer_id does not resolve" }
  - { id: ERR_DESIGNER_NOT_FOUND,        http: 404, condition: "designer_id does not resolve" }
  - { id: ERR_CREW_NOT_FOUND,            http: 404, condition: "crew_id does not resolve" }
  - { id: ERR_PROJECT_NOT_FOUND,         http: 404, condition: "project_id does not resolve" }
  - { id: ERR_APPOINTMENT_NOT_FOUND,     http: 404, condition: "design appointment id does not resolve" }
  - { id: ERR_QUOTE_NOT_FOUND,           http: 404, condition: "quote id does not resolve" }
  - { id: ERR_BOOKING_NOT_FOUND,         http: 404, condition: "install booking id does not resolve" }
  - { id: ERR_CLAIM_NOT_FOUND,           http: 404, condition: "warranty claim id does not resolve" }
  - { id: ERR_REFERRAL_NOT_FOUND,        http: 404, condition: "referral id does not resolve" }
  # --- optimistic concurrency ---
  - { id: ERR_STALE_PROJECT_VERSION,     http: 412, condition: "expected_project_version != current Project.version on POST /quotes" }
  # --- state preconditions ---
  - { id: ERR_PROJECT_INVALID_STATE,     http: 409, condition: "Project not in a state that permits the requested transition" }
  - { id: ERR_PROJECT_NOT_INSTALL_READY, http: 409, condition: "POST /install-bookings requires Project.status == INSTALL_READY" }
  - { id: ERR_QUOTE_INVALID_STATE,       http: 409, condition: "Quote status axis wrong for present/revision/accept" }
  - { id: ERR_APPOINTMENT_INVALID_STATE, http: 409, condition: "DesignAppointment not SCHEDULED for complete/cancel" }
  - { id: ERR_BOOKING_INVALID_STATE,     http: 409, condition: "InstallBooking not BOOKED for complete/cancel" }
  - { id: ERR_CLAIM_INVALID_STATE,       http: 409, condition: "WarrantyClaim not SUBMITTED for decide" }
  - { id: ERR_REFERRAL_INVALID_STATE,    http: 409, condition: "Referral already VOID on void" }
  - { id: ERR_FINANCING_NOT_REQUESTED,   http: 409, condition: "finance-decide when Quote.financing_status != REQUESTED" }
  # --- business referential (cross-entity gates) ---
  - { id: ERR_FINANCING_NOT_APPROVED,    http: 409, condition: "accept when financing requested but not APPROVED" }
  - { id: ERR_CREW_NOT_CERTIFIED,        http: 409, condition: "install booking on non-accessibility_certified crew when Project.requires_accessible_crew" }
  - { id: ERR_WARRANTY_NOT_ACTIVE,       http: 409, condition: "warranty claim when Project.warranty_status != ACTIVE" }
  - { id: ERR_PERMIT_NOT_REQUIRED,       http: 409, condition: "resolve-permit when Project.permit_required != true / not PERMIT_PENDING" }
  - { id: ERR_DESIGNER_INACTIVE,         http: 409, condition: "book appointment on inactive designer" }
  - { id: ERR_CREW_INACTIVE,             http: 409, condition: "install booking on inactive crew" }
  # --- business temporal ---
  - { id: ERR_DESIGNER_SLOT_CONFLICT,    http: 409, condition: "appointment overlaps or sits within BUFFER_MINUTES of another SCHEDULED appointment on the designer" }
  - { id: ERR_CREW_AT_CAPACITY,          http: 409, condition: "BOOKED bookings for (crew, install_date) already == max_installs_per_day" }
  - { id: ERR_INSTALL_LEAD_TIME,         http: 409, condition: "install_date < clock_date + MIN_LEAD_DAYS" }
  # --- business constraint / fiscal ---
  - { id: ERR_FINANCING_AMOUNT_MISMATCH,   http: 422, condition: "requested_amount_cents != net_price_cents - deposit_cents" }
  - { id: ERR_FINANCING_AMOUNT_EXCEEDS_MAX, http: 422, condition: "requested_amount_cents > PLAN[max_amount_cents]" }
  - { id: ERR_FINANCING_AMOUNT_BELOW_MIN,  http: 422, condition: "requested_amount_cents < PLAN[min_amount_cents]" }
  - { id: ERR_DTI_EXCEEDED,                http: 422, condition: "financed/income ratio > DTI_MAX_RATIO at finance approval" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Homeowner. Owns their Projects and derived Quotes/Bookings/Claims/Referrals."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /design-appointments (own project)"
      - "POST /design-appointments/{id}/cancel (own)"
      - "POST /quotes/{id}/request-revision (own)"
      - "POST /quotes/{id}/accept (own)"
      - "POST /warranty-claims (own project)"
    shared_operations:
      - "POST /projects/{id}/cancel (with InstallCoordinator, PlatformAdmin)"
      - "POST /install-bookings/{id}/cancel (with InstallCoordinator)"
      - "POST /referrals (with PlatformAdmin)"
      - "GET reads (all roles)"

  - name: Designer
    description: "In-home designer. Runs the measure visit and authors quotes."
    identity: "entity_backed:Designer"
    exclusive_operations:
      - "POST /designers is NOT theirs — created by PlatformAdmin"
      - "POST /design-appointments/{id}/complete (assigned designer)"
      - "POST /quotes"
      - "POST /quotes/{id}/present"
    shared_operations:
      - "POST /projects (with InstallCoordinator, PlatformAdmin)"
      - "GET reads (all roles)"

  - name: FinanceOfficer
    description: "Reviews and decides financing applications embedded on quotes."
    identity: "opaque"
    exclusive_operations:
      - "POST /quotes/{id}/finance-decide"
    shared_operations:
      - "GET reads (all roles)"

  - name: InstallCoordinator
    description: "Operations: crews, install scheduling, permits, warranty claim review, intake."
    identity: "opaque"
    exclusive_operations:
      - "POST /install-bookings"
      - "POST /install-bookings/{id}/complete"
      - "POST /projects/{id}/resolve-permit"
      - "POST /warranty-claims/{id}/decide"
    shared_operations:
      - "POST /customers (with PlatformAdmin)"
      - "POST /projects (with Designer, PlatformAdmin)"
      - "POST /projects/{id}/cancel (with Customer, PlatformAdmin)"
      - "POST /design-appointments (with Customer)"
      - "POST /design-appointments/{id}/cancel (with Customer)"
      - "POST /install-bookings/{id}/cancel (with Customer)"
      - "POST /referrals/{id}/void (with PlatformAdmin)"
      - "GET reads (all roles)"

  - name: PlatformAdmin
    description: "System administrator: catalog (designers, crews), intake, logical clock, referral voids."
    identity: "opaque"
    exclusive_operations:
      - "POST /designers"
      - "POST /crews"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /customers (with InstallCoordinator)"
      - "POST /projects (with Designer, InstallCoordinator)"
      - "POST /projects/{id}/cancel (with Customer, InstallCoordinator)"
      - "POST /referrals (with Customer)"
      - "POST /referrals/{id}/void (with InstallCoordinator)"
      - "GET reads (all roles)"

