        claim_type: violation_to_error
        grounds:
          - validations[priority=58]
          - errors[ERR_NPSH_MARGIN_INSUFFICIENT]
        excluded_because:
          difficulty_instance: boundary_precision_check / npsh_margin_exactly_at_floor_approves_while_one_centimetre_short_is_rejected
          rationale: "The inclusive 0.60 m floor and the rejection one centimetre below it are the named §1.8 instance's subject."
      - name: pattern_pour_window_conflict
        claim_type: temporal_validation
        grounds:
          - validations[priority=67]
          - errors[ERR_PATTERN_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pattern_pour_windows_conflict_on_touching_endpoints_under_closed_interval_semantics
          rationale: "Closed-interval conflict semantics, including touching endpoints, are asserted by the named §1.8 instance."
      - name: foundry_concurrent_pour_capacity
        claim_type: aggregate_validation
        grounds:
          - validations[priority=68]
          - errors[ERR_FOUNDRY_POUR_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / foundry_concurrent_pour_capacity_counts_half_open_overlaps_only
          rationale: "Half-open overlap counting against concurrent_pour_capacity is the named §1.8 instance's subject."
      - name: zero_quantity_kit_allocation
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_ZERO_QUANTITY]
        excluded_because:
          difficulty_instance: boundary_precision_check / kit_allocation_zero_quantity_rejected_while_single_unit_prices_at_lowest_tier
          rationale: "The requested_qty lower bound on both allocation endpoints is asserted by the named §1.8 instance."
      - name: release_a_package_against_an_uncertified_run
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=37]
          - errors[ERR_TEST_RUN_NOT_CERTIFIED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / package_release_requires_the_named_test_run_certified_not_merely_evaluated
          rationale: "The release gate on TestRun.run_state, and the success after certification, are the named §1.8 instance's subject."
      - name: no_interchangeable_kit_for_the_build_order
        claim_type: violation_to_error
        grounds:
          - validations[priority=74]
          - errors[ERR_NO_INTERCHANGEABLE_KIT]
        excluded_because:
          difficulty_instance: boundary_precision_check / auto_allocation_requested_qty_one_above_stock_empties_candidate_pool_then_exact_stock_succeeds
          rationale: "An empty candidate pool on the auto endpoint is asserted by the named §1.8 instance."

