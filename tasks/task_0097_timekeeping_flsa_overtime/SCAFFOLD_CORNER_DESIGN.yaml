      - name: missing_role_header_unauthenticated
        claim_type: authentication_required
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role header is rejected ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["An employer exists."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_each_write
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[timesheet-approve-stale-version]", entities.TimesheetWeek.fields.version]
        distinguishing_aspect: "TimesheetWeek.version increments by 1 on submit (1->2) and again on approve (2->3); a correct expected version succeeds."
        test_recipe:
          setup: ["CA worksite; NON_EXEMPT employee; 8h CLOSED punch; DRAFT week (version 1)."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
