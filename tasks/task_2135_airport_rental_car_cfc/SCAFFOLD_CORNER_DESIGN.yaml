          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "begin-audit is an AuditOfficer exclusive operation under the segregation-of-duties role model, so the reporting operator is denied with HTTP 403 ERR_ROLE_NOT_PERMITTED and the report stays SUBMITTED."
