            - { call: "POST /safety/roadside-inspections/${i_id}/finalize", payload: {}, as: ComplianceAnalyst }
          trigger:
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "396.5", severity_weight: 2, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { err1: $.data.error_id } }
            - { call: "POST /safety/dataqs-challenges", payload: { violation_id: "${v_id}", reason_code: "OTHER", evidence_note: "late evidence" }, as: ComplianceAnalyst, captures: { err2: $.data.error_id } }
