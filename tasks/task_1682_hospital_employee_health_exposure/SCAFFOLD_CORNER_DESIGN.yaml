              as: EmployeeHealthPhysician
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T12:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /employee-health/pep-regimens/${pep_id}/transition"
              payload: { to_state: "COMPLETED" }
