      - name: rbac_self_approval_forbidden
        claim_type: segregation_of_duties
        grounds: ["errors[ERR_SELF_APPROVAL_FORBIDDEN]", state_machines.IncidentReport.SUBMITTED_to_ACCEPTED]
        distinguishing_aspect: "Segregation of duties: an AirportManager whose X-User-ID equals the report author_user_id is rejected with ERR_SELF_APPROVAL_FORBIDDEN even though the role is otherwise permitted."
        test_recipe:
          setup:
            - "Compliant index-C airport; incident controlled; report authored by user-so-1 and SUBMITTED"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/incidents", payload: { alert_level: "ALERT_1", location: "Taxiway A" }, as: ArffChief, captures: { inc1: $.data.id } }
            - { call: "POST /arff/incidents/${inc1}/respond", as: ArffChief }
            - { call: "POST /arff/incidents/${inc1}/control", as: ArffChief }
            - { call: "POST /arff/incidents/${inc1}/reports", payload: { narrative: "Aircraft N12345 experienced a hydraulic systems failure during landing rollout on runway 09L at 10:42Z. ARFF units RED-1 and RED-2 responded within three minutes, applied a foam blanket around the leaking left main gear, and escorted the airframe to the hardstand. No injuries." }, as: SafetyOfficer, as_user_id: "user-so-1", captures: { rep1: $.data.id } }
            - { call: "POST /arff/incident-reports/${rep1}/submit", as: SafetyOfficer, as_user_id: "user-so-1" }
          trigger:
            - { call: "POST /arff/incident-reports/${rep1}/accept", as: AirportManager, as_user_id: "user-so-1", captures: { err: $.data.error_id } }
            - { call: "POST /arff/incident-reports/${rep1}/accept", as: AirportManager, as_user_id: "user-am-9", captures: { ok_status: $.data.status } }
          assert:
            - "${err} == \"ERR_SELF_APPROVAL_FORBIDDEN\"  # same human, different role: still forbidden"
            - "${ok_status} == \"ACCEPTED\"  # a different reviewer succeeds"

      - name: rbac_firefighter_reads_own_record
        claim_type: rbac_shared_allowed
        grounds: ["roles[Firefighter]"]
        distinguishing_aspect: "The entity-backed Firefighter role can perform shared GET operations; X-User-ID equals the Firefighter entity id."
        test_recipe:
          setup: ["Profile exists; firefighter FF-101 created"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
          trigger:
            - { call: "GET /arff/firefighters/${ff1}", as: Firefighter, as_user_id: "${ff1}", captures: { f_name: $.data.full_name } }
          assert:
            - "${f_name} == \"Ann Lee\"  # entity-backed identity read succeeds"

  # ===========================================================================
  # Section: cross_cutting_complexity_layers (claim-extraction-guide §8)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: x_occ_stale_profile_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[index-determination-stale-profile]", "errors[ERR_STALE_PROFILE_VERSION]"]
        distinguishing_aspect: "A determination carrying expected_profile_version observed before another determination succeeded is rejected with 412 ERR_STALE_PROFILE_VERSION; the loser's supersede never happens."
        test_recipe:
          setup:
            - "Profile certificated C; one qualifying band-C aircraft; profile version captured fresh after aircraft creation"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager, captures: { ac1: $.data.id } }
            - { call: "GET /arff/airport-profile", as: AirportManager, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /arff/index-determinations", payload: { largest_aircraft_id: "${ac1}", new_certificated_index: "C", expected_profile_version: "${pv}" }, as: AirportManager, captures: { det1: $.data.id } }
            - { call: "POST /arff/index-determinations", payload: { largest_aircraft_id: "${ac1}", new_certificated_index: "D", expected_profile_version: "${pv}" }, as: AirportManager, captures: { err: $.data.error_id } }
          assert:
            - "IndexDetermination.${det1} created ACTIVE"
            - "${err} == \"ERR_STALE_PROFILE_VERSION\"  # ${pv} went stale when the first determination bumped AirportOpsProfile.version"

      - name: x_occ_fresh_version_success_increments_and_supersedes
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[index-determination-stale-profile]", state_machines.IndexDetermination.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "With a fresh expected_profile_version the determination succeeds, AirportOpsProfile.version increments by exactly 1, and the previously ACTIVE determination flips to SUPERSEDED."
        test_recipe:
          setup:
            - "Profile certificated C; qualifying band-C aircraft; first determination already ACTIVE"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager, captures: { ac1: $.data.id } }
            - { call: "GET /arff/airport-profile", as: AirportManager, captures: { pv0: $.data.version } }
            - { call: "POST /arff/index-determinations", payload: { largest_aircraft_id: "${ac1}", new_certificated_index: "C", expected_profile_version: "${pv0}" }, as: AirportManager, captures: { det1: $.data.id } }
            - { call: "GET /arff/airport-profile", as: AirportManager, captures: { pv1: $.data.version } }
          trigger:
            - { call: "POST /arff/index-determinations", payload: { largest_aircraft_id: "${ac1}", new_certificated_index: "D", expected_profile_version: "${pv1}" }, as: AirportManager, captures: { det2: $.data.id, det2_sup: $.data.supersedes_determination_id } }
            - { call: "GET /arff/airport-profile", as: AirportManager, captures: { pv2: $.data.version, p_cert: $.data.certificated_index } }
            - { call: "GET /arff/aircraft/${ac1}/index-determinations", as: AirportManager }
          assert:
            - "${det2_sup} == ${det1}  # supersede link recorded"
            - "${pv2} == ${pv1} + 1  # exactly one version bump per determination write"
            - "${p_cert} == \"D\"  # re-certificated"
            - "GET /arff/aircraft/${ac1}/index-determinations: exactly one ACTIVE (${det2}) and one SUPERSEDED (${det1})"

      - name: x_derived_field_last_live_fire_max_semantics
        claim_type: derived_field_reconciliation
        grounds: [entities.Firefighter.fields.last_live_fire_completed_on, calculations.training_currency_window]
        distinguishing_aspect: "last_live_fire_completed_on is a max, not a last-write: an older-dated PASS record inserted after a newer one must not move the anchor; a newer-dated one must."
        test_recipe:
          setup: ["Profile exists; clock 2026-05-01; firefighter created"]
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
          trigger:
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-01-10", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "GET /arff/firefighters/${ff1}", as: ArffChief, captures: { l1: $.data.last_live_fire_completed_on } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2025-12-01", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "GET /arff/firefighters/${ff1}", as: ArffChief, captures: { l2: $.data.last_live_fire_completed_on } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-02-01", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "GET /arff/firefighters/${ff1}", as: ArffChief, captures: { l3: $.data.last_live_fire_completed_on } }
          assert:
            - "${l1} == \"2026-01-10\""
            - "${l2} == \"2026-01-10\"  # older record does not regress the anchor"
            - "${l3} == \"2026-02-01\"  # newer record advances it"

      - name: x_rate_threshold_five_departures_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.required_index_by_aircraft, entities.AircraftType.fields.qualifies_for_index]
        distinguishing_aspect: "The qualifying departure threshold is inclusive: 4.99 avg daily departures does not qualify; exactly 5.0 does."
        test_recipe:
          setup: ["Profile exists"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "E" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/aircraft", payload: { model_name: "A380", length_ft: 238.6, avg_daily_departures: 4.99, in_scheduled_service: true }, as: AirportManager, captures: { q_low: $.data.qualifies_for_index } }
            - { call: "POST /arff/aircraft", payload: { model_name: "B747-8", length_ft: 250.2, avg_daily_departures: 5.0, in_scheduled_service: true }, as: AirportManager, captures: { q_eq: $.data.qualifies_for_index } }
            - { call: "GET /arff/airport-profile", as: AirportManager, captures: { p_req: $.data.required_index_by_aircraft } }
          assert:
            - "${q_low} == false and ${q_eq} == true"
            - "${p_req} == \"E\"  # set by the 5.0-departure E-band aircraft only"

      - name: x_cascade_oos_full_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.ArffVehicle.IN_SERVICE_to_OUT_OF_SERVICE]
        excluded_because:
          difficulty_instance: tc_oos_equipment_downgrade_chain
          rationale: "The full OOS -> vehicle -> equipment index -> effective index -> notification chain is asserted link-by-link in the named §1.8 instance."

  # ===========================================================================
  # Section: consistency_model (claim-extraction-guide §9)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: cons_immediate_computed_fields_visible_in_write_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.ArffVehicle, entities.ReadinessCheck]
        distinguishing_aspect: "Immediate consistency: mutation responses already contain computed fields (vehicle status IN_SERVICE and latest_readiness_result NONE at create; readiness-check result computed in the 201 response) — no re-read needed."
        test_recipe:
          setup: ["Profile exists; clock set"]
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { v_status: $.data.status, v_latest: $.data.latest_readiness_result, v_id: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${v_id}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief, captures: { rc_result: $.data.result, rc_checked: $.data.checked_at } }
          assert:
            - "${v_status} == \"IN_SERVICE\" and ${v_latest} == \"NONE\"  # computed at create"
            - "${rc_result} == \"PASS\" and ${rc_checked} == \"2026-05-01T00:00:00Z\"  # computed and stamped in the same response"
