  # ===========================================================================
  # Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml (stubs)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: retract_cascade_stub
        claim_type: Compensation
        grounds: [state_machines.RaceCall.PUBLISHED_to_RETRACTED]
        excluded_because:
          difficulty_instance: recount_overturn_retracts_call_and_stales_deliveries
          rationale: "The depth-3 retraction cascade (call -> contest -> deliveries) is asserted end-to-end in the named difficulty instance."
      - name: contest_call_cycle_stub
        claim_type: Valid Transition
        grounds: [state_machines.Contest.call_status_CALLED_to_UNCALLED]
        excluded_because:
          difficulty_instance: contest_call_dimension_cycles_while_tabulation_dimension_holds
          rationale: "The UNCALLED -> CALLED -> UNCALLED -> CALLED cycle is traversed there."
  - section: calculations
    instances:
      - name: certainty_strict_inequality_stub
        claim_type: Correct Result
        grounds: [calculations.call_certainty_evaluation]
        excluded_because:
          difficulty_instance: certainty_equality_is_not_certainty
          rationale: "The equality boundary of the strict > standard is asserted there."
      - name: invoice_rounding_order_stub
        claim_type: Precision
        grounds: [calculations.media_invoice_total]
        excluded_because:
          difficulty_instance: invoice_per_line_rounding_differs_from_sum_rounding
          rationale: "Per-line vs sum rounding divergence is asserted with literals there."
      - name: outstanding_variant_selection_stub
        claim_type: Variant Divergence
        grounds: [calculations.outstanding_vote_estimate]
        excluded_because:
          difficulty_instance: outstanding_estimate_historical_vs_survey_diverge
          rationale: "Both estimate variants and the max() selection are asserted there."
      - name: reliability_variant_window_stub
        claim_type: Variant Divergence
        grounds: [calculations.stringer_reliability_score]
        excluded_because:
          difficulty_instance: reliability_career_vs_recent_form_diverge
          rationale: "CAREER vs RECENT_FORM windowing is asserted there."
  - section: validations
    instances:
      - name: recount_margin_threshold_stub
        claim_type: Violation to Error
        grounds: ["errors[ERR_RECOUNT_MARGIN_EXCEEDED]"]
        excluded_because:
          difficulty_instance: recount_margin_exactly_at_threshold_fileable
          rationale: "Both sides of the inclusive 0.005 threshold are exercised there."
      - name: overlap_rules_stub
        claim_type: Violation to Error
        grounds: ["errors[ERR_ASSIGNMENT_WINDOW_OVERLAP]", "errors[ERR_COVERAGE_BUDGET_EXCEEDED]"]
        excluded_because:
          difficulty_instance: stringer_windows_half_open_overlap
          rationale: "Half-open overlap and adjacency are asserted there; aggregate closed-interval capacity in coverage_budget_closed_interval_aggregate_capacity."
      - name: void_compensation_stub
        claim_type: Violation to Error
        grounds: [state_machines.VoteReport.ACCEPTED_to_VOIDED]
        excluded_because:
          difficulty_instance: accept_then_void_restores_contest_totals
          rationale: "The accept/void compensating invariant on contest totals is asserted there."
