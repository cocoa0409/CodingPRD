            - call: POST /fetal-monitoring-assessments
              payload: { encounter_id: "${enc_id}", interpreted_by_staff_id: "${staff_rn}", category: "CATEGORY_I", baseline_rate_bpm: 140, variability: "MODERATE" }
              as: BedsideNurse
