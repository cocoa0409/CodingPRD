    roles: [BranchManager, RespiratoryTherapist, DeliveryDriver, BillingSpecialist, ComplianceAuditor]
    code: 200
    input: ["branch_id?", "status?", "service_date?", "limit?", "offset?"]
    output: DeliveryRoute[]
