  # ===========================================================================
  - section: errors
    instances:

      - name: error_decide_stale_version_is_412_not_409
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STALE_VERSION
          - concurrency_rules[decide-application-stale-version]
        distinguishing_aspect: "The OCC failure is a distinct error CLASS: stale expected_application_version returns HTTP 412 ERR_STALE_VERSION, not the 409 ERR_INVALID_STATE used for state-machine rejections — clients can tell 'your view is stale' from 'your transition is illegal'."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1, program P1 (ORTHOPEDIC 0..215), source RS1; application A1 opened with accept quorum; A1's version has advanced past the version the decider captured at creation."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid OCC", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /charity-care/applications/${a1}/open-review"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 2 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 1 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-2"
          trigger:
            - call: "POST /charity-care/applications/${a1}/decide"
              payload: { decision: "ACCEPT", decision_reason: "stale view", expected_application_version: "${a1_v0}" }
              as: ReviewCommitteeMember
              as_user_id: "rcm-3"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 412 and err == ERR_STALE_VERSION   # creation version 1, current is 4"
            - "PatientApplication.${a1}.status == PENDING_REVIEW (decide did not fire)"
            - "SpecialtyHospital.${h1}.admissions_ytd == 0"

      - name: error_commit_allocation_stale_fund_version
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STALE_VERSION
          - concurrency_rules[commit-allocation-stale-fund]
        distinguishing_aspect: "Second commit carrying the pre-first-commit fund version is rejected 412 ERR_STALE_VERSION — two strictly sequential commits, no overlap needed; the first commit's side effect (fund.version += 1) is what the second observes."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1. Fund F1 (100000) OPEN with allocations AL1 (40000) and AL2 (5000) PLEDGED; AL1 committed (fund version advanced)."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/philanthropic-funds"
              payload: { fund_name: "General Fund", fiscal_year: 2026, total_committed_cents: 100000 }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
              captures: { f1: $.data.id, f1_v0: $.data.version }
            - call: "POST /charity-care/philanthropic-funds/${f1}/allocations"
              payload: { hospital_id: "${h1}", amount_cents: 40000 }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
              captures: { al1: $.data.id }
            - call: "POST /charity-care/philanthropic-funds/${f1}/allocations"
              payload: { hospital_id: "${h1}", amount_cents: 5000 }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
              captures: { al2: $.data.id }
            - call: "POST /charity-care/fund-allocations/${al1}/commit"
              payload: { expected_fund_version: "${f1_v0}" }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
          trigger:
            - call: "POST /charity-care/fund-allocations/${al2}/commit"
              payload: { expected_fund_version: "${f1_v0}" }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
              captures: { err: $.data.error_id }
            - call: "POST /charity-care/fund-allocations/${al2}/commit"
              payload: { expected_fund_version: "${f1_v0} + 1" }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
          assert:
            - "first AL2 commit returns 412 and err == ERR_STALE_VERSION"
            - "second AL2 commit (correct version) succeeds: FundAllocation.${al2}.status == COMMITTED"
            - "PhilanthropicFund.${f1}.allocated_cents == 45000 and available_cents == 55000"

      - name: error_envelope_shape_on_every_failure
        claim_type: violation_to_error
        grounds:
          - response_envelope
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "Every error response — here a role denial — uses the fixed envelope: response_type error, data.error_id and data.message both present, and meta carries api_request_id and api_request_timestamp."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Empty database."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: CareCoordinator
              as_user_id: "cc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 and err == ERR_INSUFFICIENT_PERMISSIONS"
            - "response_type == error and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"

