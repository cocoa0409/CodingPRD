                lc_number: "LC-2026-0002"
                issuing_bank_swift: "HVBKKRSE"
                amount_usd: 25000.00
                tolerance_pct: 10.00
                availability: "SIGHT"
                usance_days: 0
                expiry_date: "2026-11-30T00:00:00Z"
                latest_shipment_date: "2026-09-15T00:00:00Z"
                presentation_period_days: 21
                partial_shipment_allowed: false
                transshipment_allowed: false
                required_document_types: ["COMMERCIAL_INVOICE"]
              captures: { lc_2: "$.data.id" }
          assert:
            - "HTTP 201; data.supersedes_lc_id == ${lc_1}; data.status == \"RECEIVED\"; data.amendment_round == 0"
            - "GET /letters-of-credit?supersedes_lc_id=${lc_1} returns total_count == 1 and data[0].id == ${lc_2}"
            - "GET /letters-of-credit/${lc_1} still reports status == \"REJECTED\" — the predecessor is not mutated by the replacement"
            - "reusing lc_number \"LC-2026-0001\" was legal here only because the predecessor's status is REJECTED (priority 26 scopes uniqueness to status NOT IN {REJECTED, EXPIRED})"

      - name: corner_graph_topology_document_revision_chain_via_supersedes_document_id
        claim_type: graph
        grounds:
          - entities.TradeDocument.fields.supersedes_document_id
          - endpoints.POST /trade-documents/{document_id}/regenerate
          - endpoints.GET /trade-documents
        distinguishing_aspect: "Regeneration creates a NEW row (revision 2, DRAFT, supersedes_document_id = predecessor) and flips the predecessor to SUPERSEDED — the revision number is never incremented in place, so both revisions remain independently retrievable."
        test_recipe:
