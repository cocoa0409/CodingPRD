  # ===================================================================
  # Section: errors (cross-check stubs for catalog rows covered elsewhere)
  # ===================================================================
  - section: errors
    instances:
      - name: error_screening_guards_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCREENING_NOT_ELIGIBLE]", "errors[ERR_SCREENING_EXPIRED]"]
        excluded_because:
          difficulty_instance: enrollment_gated_by_screening_outcome_and_expiry
          rationale: "Both screening errors asserted as failure paths of the named §1.8 instance."
      - name: error_overlap_guards_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCHEDULE_CONFLICT]", "errors[ERR_INTERVIEW_SLOT_CONFLICT]"]
        excluded_because:
          difficulty_instance: class_section_room_halfopen_adjacency
          rationale: "ERR_SCHEDULE_CONFLICT asserted in the named instance; ERR_INTERVIEW_SLOT_CONFLICT asserted in mock_interview_volunteer_buffer_gap."
      - name: error_priority_and_threshold_guards_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACCREDITATION_LAPSED]", "errors[ERR_ATTENDANCE_BELOW_THRESHOLD]", "errors[ERR_RFE_OPEN]", "errors[ERR_WORKSHOP_NOT_ATTENDED]"]
        excluded_because:
          difficulty_instance: workshop_complete_lapsed_supervisor_safety_beats_temporal
          rationale: "ERR_ACCREDITATION_LAPSED asserted there; ERR_ATTENDANCE_BELOW_THRESHOLD in attendance_exactly_8000bp_completion_boundary; ERR_RFE_OPEN in case_parallel_stage_and_rfe_dimensions and rfe_deadline_exact_boundary; ERR_WORKSHOP_NOT_ATTENDED in packet_creation_gated_by_workshop_seat_state."

  # ===================================================================
  # Section: rbac
  # ===================================================================
  - section: rbac
    instances:
      - name: applicant_cannot_create_class_section
        claim_type: role_denied
        grounds: ["roles", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Applicant role on a ProgramAdmin-only endpoint -> 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["program; applicant exists"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /naturalization/class-sections"
              payload: { title: "Nope", weekday: "MON", start_minute: 600, end_minute: 660, room_id: "R1", instructor_volunteer_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", capacity: 2, total_sessions: 10 }
              as: Applicant
              as_user_id: "${app_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, http 403 (role check precedes FK existence of the bogus instructor id)"

      - name: volunteer_cannot_decide_fee_waiver
        claim_type: role_denied
        grounds: [roles, state_machines.FeeWaiverRequest]
        distinguishing_aspect: "Decide is ProgramAdmin-exclusive: a Volunteer caller gets 403 even with a well-formed payload."
        test_recipe:
          setup: ["SUBMITTED waiver exists; a volunteer exists"]
          setup_api_calls:
