            - "RenewalCase.${case_id}.rent_track_status == EXECUTED, VoucherSubmission.${voucher_id}.state == REVERSED, SpecialClaim.${claim_id}.state == DENIED"
            - "${ledger_fresh} == 30000000 and HapContract.${contract_id}.hap_ledger_balance_cents == 30000000 after all four refusals"

