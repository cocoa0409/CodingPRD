        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[license-update-stale]", endpoints, entities.License.fields.version]
        distinguishing_aspect: "PATCH /licenses/{id} with the current expected_license_version updates contact_email and increments License.version by exactly 1."
