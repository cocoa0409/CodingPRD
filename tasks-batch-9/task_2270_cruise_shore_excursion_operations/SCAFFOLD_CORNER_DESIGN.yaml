          rationale: "Both variants and their divergence on a single stored row are asserted by the named §1.8 instance."

      - name: the_two_commission_variants_diverge_on_one_line_set
        claim_type: dual_variant_divergence
        grounds:
          - calculations.operator_commission_accrual
