          trigger:
            - call: "POST /procurement/debarment-proceedings"
              payload: { vendor_id: "${c_v63_id}", cause_code: "FRAUD", aggravating_factor_codes: ["FRAUD", "FRAUD"], mitigating_factor_codes: [], interim_suspension: false }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
          assert:
