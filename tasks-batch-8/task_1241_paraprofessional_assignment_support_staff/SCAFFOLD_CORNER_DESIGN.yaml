        claim_type: violation_to_error
        grounds: []
        distinguishing_aspect: "A request without X-User-ID/X-User-Role headers fails priority-1 auth with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "NoAuth", school_year: "2026-27", total_budget_cents: 1000 }
              captures: { e_id: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (HTTP 400)"

      - name: priority_auth_role_beats_state
        claim_type: priority_ordering
        grounds: []
        distinguishing_aspect: "Wrong role AND wrong plan state together: priority-2 role check wins, returning ERR_INSUFFICIENT_PERMISSIONS rather than a state error."
        test_recipe:
          setup: ["plan DRAFT with one building (activate would also fail role-independent checks)"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 1000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
          trigger:
