      - name: pay_cascade_remaining_then_exhausted_then_submit_blocked
        grounds:
          - state_machines.InsuranceClaim.APPROVED_to_PAID
          - calculations.insurance_remaining
          - entities.Subscriber.fields.insurance_remaining_cents
          - entities.Subscriber.fields.insurance_status
