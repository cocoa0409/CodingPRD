          rationale: "Asserted as the failure path of the named §1.8 instance: its POST /api/v1/production-orders/{id}/reserve-components is driven for an order whose requirement is qty_per_car 2 * quantity 5 == 10 while Component.on_hand_qty is 9, and its assertion pins HTTP 409 with data.error_id == \"ERR_COMPONENT_SHORTAGE\" alongside the accepted on_hand_qty 10 control that commits the stock exactly to 0."

      - name: error_lead_time_infeasible_at_reserve_after_bom_row_added
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_LEAD_TIME_INFEASIBLE]
          - calculations.production_feasibility_gate
          - "POST /api/v1/production-orders/{id}/reserve-components"
        distinguishing_aspect: "An order created against a car type with no bill-of-material rows passes the feasibility gate (worst_lead 0 by convention) and is accepted, but the same reserve call is rejected 422 ERR_LEAD_TIME_INFEASIBLE once a WHEELSET row with lead_time_days 60 and qty_per_car 2 is added, making worst_lead ceil(60/2) == 30 against a 10-day horizon — while a second order with a 30-day horizon reserves 200."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type CT-N (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-N) starts with NO bill-of-material rows, so §1.3 production_feasibility_gate yields worst_lead 0 and any horizon is feasible."
            - "Order O-N1 is created with a 10-day horizon (order_date 2026-09-01, required_delivery_date 2026-09-11) and stands DRAFT; WHEELSET WS-N3 (lead_time_days 60, 100 units on hand via a received ComponentReceipt) is then bound to CT-N at qty_per_car 2."
            - "Order O-N2 is created after the row exists with a 30-day horizon (2026-09-01 to 2026-10-01), exactly worst_lead == ceil(60/2) == 30."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
