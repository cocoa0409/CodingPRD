  - section: endpoints
    instances:
      - name: patching_only_the_owner_name_leaves_every_other_vehicle_field_alone
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_vehicles_id
          - entities.Vehicle
        distinguishing_aspect: |
          All four PATCH inputs are optional, so a body carrying owner_name alone must be a true partial
          update: the owner is rewritten, sale_status / region_code / owner_address_valid keep their
          created values, the immutable build fields are untouched, and version moves 1 -> 2.
        test_recipe:
          setup:
            - "The clock reads 2026-08-03T09:00:00Z."
            - "One Vehicle exists with owner_name 'A. Nolan', sale_status SOLD, region_code NE and owner_address_valid true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "SOLD", owner_name: "A. Nolan", owner_address_valid: true }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { veh1_id: $.data.id, veh1_v: $.data.version }
          trigger:
            - call: "PATCH /vehicles/${veh1_id}"
              payload: { owner_name: "B. Okonkwo" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
          assert:
            - "HTTP status is 200"
            - "response.data.owner_name == \"B. Okonkwo\""
            - "response.data.sale_status == \"SOLD\", region_code == \"NE\" and owner_address_valid == true"
            - "response.data.vin == \"1HGCM82633A004352\", plant_code == \"PLT1\", production_date == \"2024-03-15\" and suspect_part_number == 1500"
            - "response.data.version == 2 and updated_at is later than created_at"

      - name: repair_claim_action_endpoint_rejects_a_suspended_dealer
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_repair_claims
          - validations.priority_28
        excluded_because:
          difficulty_instance: repair_claim_blocked_by_suspended_dealer_state
          rationale: |
            The action-endpoint behaviour worth pinning on POST /repair-claims -- that the dealer's own
            lifecycle state gates a claim even when parts and labour are perfectly in order, and that
            the block lifts nowhere else -- is exactly what that difficulty instance drives. A corner
            case here would issue the same call and assert the same ERR_DEALER_SUSPENDED.

      - name: completion_metrics_on_an_empty_population_returns_all_zeroes
        claim_type: computed_read
        grounds:
          - endpoints.GET_recall_campaigns_id_completion_metrics
          - calculations.completion_rate
          - calculations.remedy_effectiveness_score
        distinguishing_aspect: |
          Every bucket is empty, so both completion variants must return the declared 0.00 fallback
          rather than dividing by zero, while the effectiveness score returns its ceiling 100.00 --
          the two guards point in opposite directions on the same read.
        test_recipe:
          setup:
            - "A DRAFT campaign 26V-326 exists with no population rules, no vehicles and no filings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-326", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "GET /recall-campaigns/${camp_id}/completion-metrics"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          assert:
            - "HTTP status is 200"
            - "response.data.affected_vehicle_count == 0, recall_population_count == 0, remedied_count == 0, scheduled_count == 0, unreachable_count == 0, removed_count == 0 and repeat_claim_count == 0"
            - "response.data.regulatory_completion_rate_pct == 0.00 and operational_completion_rate_pct == 0.00"
            - "response.data.remedy_effectiveness_score == 100.00"

      - name: cancelling_a_released_wave_keeps_its_pinned_quota_fields
        claim_type: conditional_action
        grounds:
          - endpoints.POST_notification_waves_id_cancel
          - state_machines.NotificationWave.RELEASE_APPROVED_to_CANCELLED
          - state_machines.NotificationWave.PLANNED_to_CANCELLED
        distinguishing_aspect: |
          Cancel is legal from two source states and behaves differently in each: from RELEASE_APPROVED
          the quota figures pinned at release are retained for audit, while a wave cancelled straight
          out of PLANNED keeps the field defaults. Both cancellations leave the wave out of the mailing
          separation rule and out of open_followup_wave_count.
        test_recipe:
          setup:
            - "BASE-FILED for 26V-327 with one matched NE build record, then an interim advisory (stop_sale false, do_not_drive false) so INTERIM waves may be released."
            - "Wave W1 is INTERIM/NE scheduled 2026-08-20 and RELEASED (an interim wave needs no parts, so eligible == capacity == 1)."
            - "Wave W2 is INTERIM/NE scheduled 2026-09-05 and left in PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-327", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
