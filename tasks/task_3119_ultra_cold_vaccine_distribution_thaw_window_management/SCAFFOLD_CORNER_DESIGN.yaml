            - "the retry succeeds with accepted_b == 3 and AllocationEntitlement.${ent_id}.held_cartons == 5"

      - name: ops_cycle_lapses_the_elapsed_reservation_and_the_window
        claim_type: scheduled_deferred_actions
        grounds:
