      - name: the_pool_walks_open_to_oversubscribed_to_exhausted_at_the_awardable_boundary_and_resets_on_a_return
        claim_type: rate_threshold_trigger
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations[cap_pool_availability]
          - validations[priority=110]
          - errors[ERR_INSUFFICIENT_VOLUME_CAP]
          - state_machines[VolumeCapAllocation].transitions[PENDING->DEFERRED]
          - state_machines[VolumeCapAllocation].transitions[AWARDED->RETURNED]
          - entities.CapPool.fields.pool_status
          - entities.Project.fields.financing_stalled
        distinguishing_aspect: |
          The pool carries two independent thresholds off the same aggregates and they
          fire at different moments: OVERSUBSCRIBED keys on available_cents going
          negative from mere pending requests, while EXHAUSTED keys on
          awardable_cents hitting zero from actual awards - and EXHAUSTED wins the
          derivation when both hold. The walk pins the inclusive boundary of
          priority 110 (an award equal to awardable_cents is admissible and is exactly
          what drives the pool to zero), the automatic deferral cascade that the
          zero-crossing fires on every other pending request, the priority inversion
          that follows (the deferred request is now refused on state, not on cap),
          and the reset: returning the first award reopens the pool and pulls the
          deferred request back to PENDING so it can finally be awarded.
        test_recipe:
          setup:
            - "One sponsor with three projects on a single 2026 pool of 600000000 total cap (500000000 base plus 100000000 carryforward)."
