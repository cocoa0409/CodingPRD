# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Architecture Construction Administration — breadth enumeration across the
# claim-extraction-guide sections. All recipes replay from empty-DB; the
# logical clock starts at the declared default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_project_applies_default_windows
        claim_type: defaults
        grounds: ["entities.CaProject.fields.grace_days", "entities.CaProject.fields.review_window_days_submittal", "entities.CaProject.fields.review_window_days_rfi", "entities.CaProject.fields.field_report_window_days"]
        distinguishing_aspect: "Omitting the four optional project knobs applies the pinned defaults (grace 0, submittal window 10, RFI window 7, field-report window 3) and initializes status SETUP with zeroed computed fields."
        test_recipe:
          setup: ["Empty database; logical clock at the 2026-08-01T00:00:00Z default."]
          setup_api_calls: []
          trigger:
            - call: "POST /ca/projects"
              payload: { name: "Proj Dflt", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
          assert:
            - "CaProject.${p_id}.grace_days == 0"
            - "CaProject.${p_id}.review_window_days_submittal == 10 and review_window_days_rfi == 7 and field_report_window_days == 3"
            - "CaProject.${p_id}.status == SETUP and ca_posture == NORMAL"
            - "CaProject.${p_id}.excusable_delay_days == 0 and certified_to_date_cents == 0 and retainage_held_cents == 0"
            - "CaProject.${p_id}.adjusted_contract_sum_cents == 10000000 and adjusted_substantial_completion_date == 2026-09-30"
            - "CaProject.${p_id}.version == 1"

      - name: create_project_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.CaProject.fields.adjusted_contract_sum_cents", "entities.CaProject.fields.excusable_delay_days", "entities.CaProject.fields.status"]
        distinguishing_aspect: "Client-supplied values for computed/system fields are silently ignored: the server derives adjusted_contract_sum_cents from original_contract_sum_cents, excusable_delay_days to 0, and status to SETUP regardless of input."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /ca/projects"
              payload: { name: "Proj CFI", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", adjusted_contract_sum_cents: 1, excusable_delay_days: 99, status: "CLOSED" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
          assert:
            - "CaProject.${p_id}.adjusted_contract_sum_cents == 10000000 (input 1 ignored)"
            - "CaProject.${p_id}.excusable_delay_days == 0 (input 99 ignored)"
            - "CaProject.${p_id}.status == SETUP (input CLOSED ignored)"

      - name: get_nonexistent_project_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROJECT_NOT_FOUND]", "endpoints"]
        distinguishing_aspect: "GET with a well-formed but unknown project UUID returns the error envelope with ERR_PROJECT_NOT_FOUND and http 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /ca/projects/00000000-0000-0000-0000-000000000000"
              as: FirmAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "http status == 404 and ${err_id} == ERR_PROJECT_NOT_FOUND"

      - name: rfi_create_defaults_cost_impact_flag_false
        claim_type: defaults
        grounds: ["entities.Rfi.fields.cost_impact_flag", "entities.Rfi.fields.status"]
        distinguishing_aspect: "Omitting cost_impact_flag stores false; the RFI starts OPEN with due_at exactly 7 days after the default-clock receipt."
        test_recipe:
          setup: ["ACTIVE project created and activated at the default clock."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj RD", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
          trigger:
            - call: "POST /ca/rfis"
              payload: { project_id: "${p_id}", question: "Confirm anchor bolt embedment" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { rfi_id: $.data.id }
          assert:
            - "Rfi.${rfi_id}.cost_impact_flag == false"
            - "Rfi.${rfi_id}.status == OPEN"
            - "Rfi.${rfi_id}.received_at == 2026-08-01T00:00:00Z and Rfi.${rfi_id}.due_at == 2026-08-08T00:00:00Z"

      - name: punch_item_created_open_with_zero_reopen_count
        claim_type: initial_state
        grounds: ["entities.PunchListItem.fields.status", "entities.PunchListItem.fields.reopen_count"]
        distinguishing_aspect: "A newly raised punch item starts OPEN with reopen_count 0 — the system-maintained counter is not client-settable."
        test_recipe:
          setup: ["ACTIVE project; REPORT_ISSUED PUNCH_INSPECTION visit V1 (2026-08-20)."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj PL0", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-20", purpose: "PUNCH_INSPECTION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v1_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "MINOR_DEVIATIONS", nonconforming_work_flag: false }
              as: ArchitectCA
          trigger:
            - call: "POST /ca/punch-list-items"
              payload: { project_id: "${p_id}", raised_visit_id: "${v1_id}", description: "Door hardware misaligned", location: "Lobby L1" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { item_id: $.data.id }
          assert:
            - "PunchListItem.${item_id}.status == OPEN"
            - "PunchListItem.${item_id}.reopen_count == 0"
            - "PunchListItem.${item_id}.version == 1"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: review_rejected_submittal_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: ["state_machines.Submittal.UNDER_REVIEW_to_REJECTED", "errors[ERR_SUBMITTAL_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal for Submittal: a second review attempt is rejected with ERR_SUBMITTAL_INVALID_STATE and fires no side effects."
        test_recipe:
          setup: ["ACTIVE project; submittal S created at default clock and reviewed REJECTED."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj SM1", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "03 30 00", required_on_site_date: "2026-08-25" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { s_id: $.data.id }
            - call: "POST /ca/submittals/${s_id}/review"
              payload: { outcome: "REJECTED", review_notes: "Not per spec" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          trigger:
            - call: "POST /ca/submittals/${s_id}/review"
              payload: { outcome: "APPROVED" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "http 409 and ${err_id} == ERR_SUBMITTAL_INVALID_STATE"
            - "Submittal.${s_id}.status == REJECTED (unchanged)"
            - "CaProject.${p_id}.excusable_delay_days == 0 (no side effects fired)"

      - name: certify_voided_pay_app_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: ["state_machines.PaymentApplication.CERTIFIED_to_VOIDED", "errors[ERR_PAYMENT_APPLICATION_INVALID_STATE]"]
        distinguishing_aspect: "VOIDED is terminal for PaymentApplication: certification of a voided application is rejected with ERR_PAYMENT_APPLICATION_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE project; verification visit V1 REPORT_ISSUED; application certified then voided."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj SM2", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-20", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v1_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "CONFORMING", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/payment-applications"
              payload: { project_id: "${p_id}", period_ending_date: "2026-08-31", verification_visit_id: "${v1_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 1000000, stored_materials_cents: 0 }] }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { app_id: $.data.id }
            - call: "POST /ca/payment-applications/${app_id}/certify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/payment-applications/${app_id}/void"
              payload: {}
              as: FirmAdmin
          trigger:
            - call: "POST /ca/payment-applications/${app_id}/certify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "http 409 and ${err_id} == ERR_PAYMENT_APPLICATION_INVALID_STATE"
            - "PaymentApplication.${app_id}.status == VOIDED (unchanged)"

      - name: cancel_paid_invoice_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: ["state_machines.AdditionalServiceInvoice.OWNER_APPROVED_to_PAID", "errors[ERR_INVOICE_INVALID_STATE]"]
        distinguishing_aspect: "PAID is terminal for AdditionalServiceInvoice: cancel is rejected with ERR_INVOICE_INVALID_STATE; the invoice keeps its frozen amounts."
        test_recipe:
          setup: ["ACTIVE project past its billing horizon (clock 2026-11-05; horizon_start 2026-10-05); invoice for 2026-10-01..2026-10-31 issued, owner-approved, and recorded PAID (26 billable days, 3120000 cents)."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj SM3", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/additional-service-invoices"
              payload: { project_id: "${p_id}", period_start: "2026-10-01", period_end: "2026-10-31" }
              as: FirmAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /ca/additional-service-invoices/${inv_id}/issue"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/additional-service-invoices/${inv_id}/owner-decision"
              payload: { decision: "APPROVE" }
              as: Owner
              as_user_id: "user-owner-1"
            - call: "POST /ca/additional-service-invoices/${inv_id}/record-payment"
              payload: {}
              as: FirmAdmin
          trigger:
            - call: "POST /ca/additional-service-invoices/${inv_id}/cancel"
              payload: {}
              as: FirmAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "http 409 and ${err_id} == ERR_INVOICE_INVALID_STATE"
            - "AdditionalServiceInvoice.${inv_id}.status == PAID and amount_cents == 3120000 (26 billable days x 120000)"

      - name: withdraw_answered_rfi_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Rfi.OPEN_to_WITHDRAWN", "errors[ERR_RFI_INVALID_STATE]"]
        distinguishing_aspect: "Withdraw is only valid from OPEN: withdrawing an ANSWERED RFI fails with ERR_RFI_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE project; RFI created at default clock and answered (requires_clarification_drawing false)."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj SM4", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/rfis"
              payload: { project_id: "${p_id}", question: "Confirm slab vapor barrier" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { rfi_id: $.data.id }
            - call: "POST /ca/rfis/${rfi_id}/answer"
              payload: { answer_text: "Per spec 07 26 00", requires_clarification_drawing: false }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          trigger:
            - call: "POST /ca/rfis/${rfi_id}/withdraw"
              payload: {}
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "http 409 and ${err_id} == ERR_RFI_INVALID_STATE"
            - "Rfi.${rfi_id}.status == ANSWERED (unchanged)"

      - name: perform_cancelled_visit_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: ["state_machines.SiteVisit.SCHEDULED_to_CANCELLED", "errors[ERR_SITE_VISIT_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal for SiteVisit: perform on a cancelled visit fails with ERR_SITE_VISIT_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE project; visit V1 scheduled for 2026-08-15 then cancelled."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj SM5", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-15", purpose: "PROGRESS_OBSERVATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/cancel"
              payload: {}
              as: ArchitectCA
          trigger:
            - call: "POST /ca/site-visits/${v1_id}/perform"
              payload: {}
              as: ArchitectCA
              captures: { err_id: $.data.error_id }
          assert:
            - "http 409 and ${err_id} == ERR_SITE_VISIT_INVALID_STATE"
            - "SiteVisit.${v1_id}.status == CANCELLED and performed_at == null"

      - name: resubmit_under_review_submittal_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Submittal.REVISE_AND_RESUBMIT_to_UNDER_REVIEW", "errors[ERR_SUBMITTAL_INVALID_STATE]"]
        distinguishing_aspect: "Resubmit requires REVISE_AND_RESUBMIT: calling it while the first revision is still UNDER_REVIEW fails with ERR_SUBMITTAL_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE project; submittal created at default clock (UNDER_REVIEW)."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj SM6", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "03 30 00", required_on_site_date: "2026-08-25" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /ca/submittals/${s_id}/resubmit"
              payload: {}
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "http 409 and ${err_id} == ERR_SUBMITTAL_INVALID_STATE"
            - "Submittal.${s_id}.revision_number == 1 (unchanged)"

      - name: verify_open_punch_item_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.PunchListItem.CLAIMED_COMPLETE_to_VERIFIED", "errors[ERR_PUNCH_ITEM_INVALID_STATE]"]
        distinguishing_aspect: "Verify requires CLAIMED_COMPLETE: verifying an item still OPEN fails with ERR_PUNCH_ITEM_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE project; REPORT_ISSUED PUNCH_INSPECTION visit V1; punch item raised and still OPEN."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj SM7", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-20", purpose: "PUNCH_INSPECTION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v1_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "MINOR_DEVIATIONS", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/punch-list-items"
              payload: { project_id: "${p_id}", raised_visit_id: "${v1_id}", description: "Paint touch-up", location: "Corridor 2" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /ca/punch-list-items/${item_id}/verify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "http 409 and ${err_id} == ERR_PUNCH_ITEM_INVALID_STATE"
            - "PunchListItem.${item_id}.status == OPEN (unchanged)"

      - name: create_submittal_before_activation_returns_not_active
        claim_type: precondition_enforcement
        grounds: ["validations[priority=7]", "errors[ERR_PROJECT_NOT_ACTIVE]"]
        distinguishing_aspect: "Child creation is gated on project lifecycle: a submittal against a SETUP project fails with ERR_PROJECT_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["Project created but not activated (status SETUP)."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj SM8", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "03 30 00", required_on_site_date: "2026-08-25" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "http 409 and ${err_id} == ERR_PROJECT_NOT_ACTIVE"
            - "CaProject.${p_id}.status == SETUP"

      - name: owner_accepts_reject_recommended_change_order
        claim_type: valid_transition
        grounds: ["state_machines.ChangeOrder.RECOMMEND_REJECTION_to_OWNER_ACCEPTED"]
        distinguishing_aspect: "Branching machine: the owner may override a RECOMMEND_REJECTION with decision ACCEPT, landing in OWNER_ACCEPTED — the fork path is valid, not an error."
        test_recipe:
          setup: ["ACTIVE project; change order SUBMITTED and recommended REJECT."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj SM9", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/change-orders"
              payload: { project_id: "${p_id}", title: "Owner-requested upgrade", net_cost_change_cents: 3000000, time_extension_days: 0 }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { co_id: $.data.id }
            - call: "POST /ca/change-orders/${co_id}/recommend"
              payload: { recommendation: "REJECT", review_notes: "Overpriced" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          trigger:
            - call: "POST /ca/change-orders/${co_id}/owner-decision"
              payload: { decision: "ACCEPT" }
              as: Owner
              as_user_id: "user-owner-1"
          assert:
            - "http 200 and ChangeOrder.${co_id}.status == OWNER_ACCEPTED"
            - "ChangeOrder.${co_id}.recommendation == REJECT (recommendation preserved despite override)"
            - "ChangeOrder.${co_id}.markup_cents == 300000 and total_amount_cents == 3300000"

  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: excusable_credit_excludes_rejected_review
        claim_type: input_set_filtering
        grounds: ["calculations.excusable_delay_credit"]
        distinguishing_aspect: "Input-set filtering: a late review landing on REJECTED (contractor-caused) contributes 0 days — only APPROVED / APPROVED_AS_NOTED outcomes enter the excusable-delay sum."
        test_recipe:
          setup: ["ACTIVE project; submittal received at the 2026-08-01 default clock (due 2026-08-11); clock advanced to 2026-08-14."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj CC1", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "03 30 00", required_on_site_date: "2026-08-25" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { s_id: $.data.id }
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /ca/submittals/${s_id}/review"
              payload: { outcome: "REJECTED", review_notes: "Wrong mix design" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          assert:
            - "Submittal.${s_id}.status == REJECTED and credited_delay_days == 0 (3 days late but outcome excluded)"
            - "CaProject.${p_id}.excusable_delay_days == 0"

      - name: default_review_windows_applied_to_due_dates
        claim_type: constants_applied
        grounds: ["calculations.excusable_delay_credit", "entities.Submittal.fields.due_at", "entities.Rfi.fields.due_at"]
        distinguishing_aspect: "Constants: the default 10-day submittal window and 7-day RFI window are applied to due_at exactly (2026-08-01 + 10d = 2026-08-11T00:00:00Z; +7d = 2026-08-08T00:00:00Z)."
        test_recipe:
          setup: ["ACTIVE project with default windows; submittal and RFI both created at the 2026-08-01T00:00:00Z default clock."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj CC2", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
          trigger:
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "03 30 00", required_on_site_date: "2026-08-25" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { s_id: $.data.id }
            - call: "POST /ca/rfis"
              payload: { project_id: "${p_id}", question: "Confirm lintel bearing" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { rfi_id: $.data.id }
          assert:
            - "Submittal.${s_id}.received_at == 2026-08-01T00:00:00Z and due_at == 2026-08-11T00:00:00Z"
            - "Rfi.${rfi_id}.received_at == 2026-08-01T00:00:00Z and due_at == 2026-08-08T00:00:00Z"

      - name: rfi_answer_late_credit
        claim_type: correct_result
        grounds: ["calculations.excusable_delay_credit", "entities.Rfi.fields.credited_delay_days"]
        distinguishing_aspect: "The RFI source of the excusable-delay pool: an answer 2 calendar days after due_at credits exactly 2 days onto the project aggregate."
        test_recipe:
          setup: ["ACTIVE project; RFI created at the default clock (due 2026-08-08); clock advanced to 2026-08-10."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj CC3", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/rfis"
              payload: { project_id: "${p_id}", question: "Confirm parapet coping color" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { rfi_id: $.data.id }
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /ca/rfis/${rfi_id}/answer"
              payload: { answer_text: "Match existing", requires_clarification_drawing: false }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          assert:
            - "Rfi.${rfi_id}.status == ANSWERED and credited_delay_days == 2"
            - "CaProject.${p_id}.excusable_delay_days == 2"

      - name: change_order_markup_tier_boundary_exact_cap
        claim_type: correct_result
        grounds: ["calculations.change_order_pricing"]
        distinguishing_aspect: "Tier boundary at exactly 5000000 cents: the first tier is fully consumed and the second tier contributes exactly 0, so markup is exactly 500000 (the min/max allocation does not bleed one cent into tier 2)."
        test_recipe:
          setup: ["ACTIVE project."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj CC4", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
          trigger:
            - call: "POST /ca/change-orders"
              payload: { project_id: "${p_id}", title: "Exact-cap extra", net_cost_change_cents: 5000000, time_extension_days: 0 }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { co_id: $.data.id }
          assert:
            - "ChangeOrder.${co_id}.markup_cents == 500000"
            - "ChangeOrder.${co_id}.total_amount_cents == 5500000"

      - name: provisional_differs_from_final_after_incorporation
        claim_type: variant_divergence
        grounds: ["calculations.payment_certification", "entities.PaymentApplication.fields.provisional_current_due_cents", "entities.PaymentApplication.fields.certified_current_due_cents"]
        distinguishing_aspect: "Variant selection + reconciliation: the provisional run at creation uses the pre-incorporation threshold 5000000 (retainage 550000, due 5450000); the final run at certification uses the post-incorporation threshold 8285000 (retainage 600000, due 5400000) — both fields coexist on the same application with different values."
        test_recipe:
          setup:
            - "ACTIVE TIERED_MARGINAL project, SOV A=9000000/B=1000000, verification visit V1 REPORT_ISSUED (2026-08-20)."
            - "Application created with line A work 6000000 (provisional computed against contract sum 10000000)."
            - "Change order net +6000000 (total 6570000) incorporated before certification."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj CC5", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 9000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 1000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-20", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v1_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "CONFORMING", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/payment-applications"
              payload: { project_id: "${p_id}", period_ending_date: "2026-08-31", verification_visit_id: "${v1_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 6000000, stored_materials_cents: 0 }] }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { app_id: $.data.id }
            - call: "POST /ca/change-orders"
              payload: { project_id: "${p_id}", title: "Added scope", net_cost_change_cents: 6000000, time_extension_days: 0 }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { co_id: $.data.id }
            - call: "POST /ca/change-orders/${co_id}/recommend"
              payload: { recommendation: "ACCEPT" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/change-orders/${co_id}/owner-decision"
              payload: { decision: "ACCEPT" }
              as: Owner
              as_user_id: "user-owner-1"
            - call: "GET /ca/projects/${p_id}"
              as: FirmAdmin
              captures: { p_v: $.data.version }
            - call: "POST /ca/change-orders/${co_id}/incorporate"
              payload: { expected_project_version: "${p_v}" }
              as: Owner
              as_user_id: "user-owner-1"
          trigger:
            - call: "POST /ca/payment-applications/${app_id}/certify"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          assert:
            - "PaymentApplication.${app_id}.provisional_current_due_cents == 5450000  # computed under threshold 5000000"
            - "PaymentApplication.${app_id}.certified_current_due_cents == 5400000  # recomputed under threshold 8285000"
            - "PaymentApplication.${app_id}.retainage_work_cents == 600000"
            - "CaProject.${p_id}.retainage_held_cents == 600000"

      - name: deduct_change_order_zero_markup
        claim_type: correct_result
        grounds: ["calculations.change_order_pricing"]
        excluded_because:
          difficulty_instance: change_order_tiered_markup_mode_a
          rationale: "The deduct sign branch (net -4000000 -> markup 0, total -4000000) is asserted inside the named §1.8 instance."

      - name: draft_invoice_auto_cancel_on_delay_credit
        claim_type: side_effect_execution
        grounds: ["calculations.additional_service_billing", "state_machines.AdditionalServiceInvoice.DRAFT_to_CANCELLED"]
        excluded_because:
          difficulty_instance: late_review_credit_cascades_to_invoice_cancel
          rationale: "The 0-billable-day auto-cancellation of a DRAFT invoice is asserted as the depth-3 hop of the named §1.8 cascade instance."

      - name: issued_invoice_frozen_on_later_incorporation
        claim_type: derived_field_reconciliation
        grounds: ["calculations.additional_service_billing", "state_machines.AdditionalServiceInvoice.DRAFT_to_ISSUED"]
        distinguishing_aspect: "Frozen-on-issuance rule: an ISSUED invoice keeps billable_days 31 and amount_cents 3720000 even after a 20-day change-order incorporation moves the project horizon — only DRAFT invoices recompute."
        test_recipe:
          setup:
            - "ACTIVE PER_DIEM_PRORATED project (horizon_start 2026-10-05); clock 2026-11-05."
            - "Invoice created for 2026-10-01..2026-11-30 (31 days, 3720000) and ISSUED."
            - "Time-only change order (net 0, 20 days) OWNER_ACCEPTED; project version captured."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj FRZ", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/additional-service-invoices"
              payload: { project_id: "${p_id}", period_start: "2026-10-01", period_end: "2026-11-30" }
              as: FirmAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /ca/additional-service-invoices/${inv_id}/issue"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/change-orders"
              payload: { project_id: "${p_id}", title: "Weather extension", net_cost_change_cents: 0, time_extension_days: 20 }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { co_id: $.data.id }
            - call: "POST /ca/change-orders/${co_id}/recommend"
              payload: { recommendation: "ACCEPT" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/change-orders/${co_id}/owner-decision"
              payload: { decision: "ACCEPT" }
              as: Owner
              as_user_id: "user-owner-1"
            - call: "GET /ca/projects/${p_id}"
              as: FirmAdmin
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /ca/change-orders/${co_id}/incorporate"
              payload: { expected_project_version: "${p_v}" }
              as: Owner
              as_user_id: "user-owner-1"
          assert:
            - "CaProject.${p_id}.adjusted_substantial_completion_date == 2026-10-20 (incorporation landed)"
            - "AdditionalServiceInvoice.${inv_id}.status == ISSUED"
            - "AdditionalServiceInvoice.${inv_id}.billable_days == 31 (unchanged — frozen at issuance)"
            - "AdditionalServiceInvoice.${inv_id}.amount_cents == 3720000 (unchanged)"
            - "AdditionalServiceInvoice.${inv_id}.horizon_start_date == 2026-10-05 (unchanged)"

      - name: draft_invoice_refrozen_on_substantial_completion
        claim_type: side_effect_execution
        grounds: ["calculations.additional_service_billing", "state_machines.CaProject.ACTIVE_to_SUBSTANTIAL_COMPLETION_ACHIEVED"]
        distinguishing_aspect: "DRAFT recompute on substantial completion: achieving SCD at 2026-10-25 re-bases the DRAFT invoice's horizon_end_date from the creation-time clock date (2026-10-20) to the actual completion date, growing billable_days 15 -> 20 and amount 1800000 -> 2400000 while the invoice stays DRAFT."
        test_recipe:
          setup:
            - "ACTIVE PER_DIEM_PRORATED project (horizon_start 2026-10-05, grace 5)."
            - "Clock 2026-10-20: DRAFT invoice for 2026-10-01..2026-10-31 with horizon_end 2026-10-20, billable_days 15, amount 1800000."
            - "PUNCH_INSPECTION visit performed and reported (2026-10-21) so substantial completion can be determined."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj RFZ", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/additional-service-invoices"
              payload: { project_id: "${p_id}", period_start: "2026-10-01", period_end: "2026-10-31" }
              as: FirmAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-21T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-10-21", purpose: "PUNCH_INSPECTION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v1_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "MINOR_DEVIATIONS", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-25T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /ca/projects/${p_id}/achieve-substantial-completion"
              payload: {}
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          assert:
            - "before: AdditionalServiceInvoice.${inv_id}.billable_days == 15 and amount_cents == 1800000"
            - "CaProject.${p_id}.status == SUBSTANTIAL_COMPLETION_ACHIEVED and substantial_completion_actual_date == 2026-10-25"
            - "after: AdditionalServiceInvoice.${inv_id}.horizon_end_date == 2026-10-25"
            - "after: AdditionalServiceInvoice.${inv_id}.billable_days == 20 and amount_cents == 2400000"
            - "AdditionalServiceInvoice.${inv_id}.status == DRAFT"

  # ---------------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: get_project_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Missing X-User-ID / X-User-Role headers fail at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role, existence, or state check runs."
        test_recipe:
          setup: ["One project exists."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj VA1", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /ca/projects/${p_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "http 400 and ${err_id} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

