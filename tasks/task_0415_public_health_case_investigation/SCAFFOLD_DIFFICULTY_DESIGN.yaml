              captures: { j2: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-T", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ct: $.data.id }
            - call: "POST /surveillance/cases/${ct}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ct}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-T", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { kt: $.data.id }
            - call: "POST /surveillance/contacts/${kt}/queue-notification"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${kt}/record-notification"
              payload: { outcome: "SUCCESS" }
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${kt}/monitoring-periods"
              payload: { monitoring_type: "QUARANTINE", start_date: "2026-03-16T00:00:00.000Z", end_date: "2026-03-29T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${kt}/start-monitoring"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "GET /surveillance/cases/${ct}"
              as: EpiAnalyst
              captures: { ct_v: $.data.version }
            - call: "POST /surveillance/jurisdiction-transfers"
              payload: { program_id: "${prog}", case_id: "${ct}", to_jurisdiction_id: "${j2}", expected_case_version: "${ct_v}" }
              as: EpiAnalyst
              captures: { tr: $.data.id }
          trigger:
            - call: "PUT /surveillance/jurisdiction-transfers/${tr}"
              payload: { status: "ACCEPTED" }
              as: EpiAnalyst
          assert:
            - "JurisdictionTransfer.${tr}.status == ACCEPTED"
            - "Case.${ct}.jurisdiction_id == ${j2}"
            - "Case.${ct}.status == UNDER_INVESTIGATION"
            - "Contact.${kt}.monitoring_jurisdiction_id == ${j2}"
            - "Jurisdiction.${j1}.active_monitoring_count == 0"
            - "Jurisdiction.${j2}.active_monitoring_count == 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: referential_404_beats_jurisdiction_scope_403
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: |
          Category pair business_referential (priority 4, ERR_*_NOT_FOUND 404) vs auth
          jurisdiction-scope (priority 5, ERR_JURISDICTION_SCOPE_VIOLATION 403): a contact
          elicitation that BOTH names a non-existent source_case_id AND is issued by a
          CaseInvestigator scoped to the wrong jurisdiction returns the FK 404, not the scope 403.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdictions J1 and J2."
            - "ContactTracer scoped to J2 issues a contact elicitation whose source_case_id is a non-existent UUID and monitoring_jurisdiction_id is J1 (outside J2 scope)."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 2", fips_code: "06002" }
              as: JurisdictionAdmin
              captures: { j2: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
          trigger:
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "00000000-0000-4000-8000-000000000000", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-BAD", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_CASE_NOT_FOUND"

      - name: state_409_beats_lab_condition_mismatch_409_on_link
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        distinguishing_aspect: |
          Category pair state (priority 7, ERR_CASE_NOT_LINKABLE — case CLOSED) vs
          business_constraint (priority 10, ERR_LAB_CONDITION_MISMATCH): linking a
          mismatched-condition lab to a CLOSED case returns the state error
          ERR_CASE_NOT_LINKABLE, not the condition-mismatch error — a different category
          pair than the referential-vs-scope conflict.
        test_recipe:
          setup:
            - "Program P, conditions COVID19 and MEASLES, jurisdiction J1."
            - "Case CL (COVID19) opened+interviewed, classified PROBABLE, closed."
            - "A RECEIVED MEASLES lab LM (different condition) exists, unlinked."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1, requires_lab_confirmation: false }
              as: JurisdictionAdmin
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "MEASLES", display_name: "Measles", presymptomatic_days: 4, infectious_tail_days: 4, quarantine_days: 21, test_based_release_days: 14, isolation_min_days: 4, fever_free_days: 0, requires_lab_confirmation: false }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-L", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cl: $.data.id }
            - call: "POST /surveillance/cases/${cl}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cl}/classify"
              payload: { classification: "PROBABLE" }
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cl}/close"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/lab-results"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "MEASLES", patient_reference: "PT-OTHER", result_value: "POSITIVE", specimen_collection_date: "2026-03-11T00:00:00.000Z" }
              as: IntakeProcessor
              as_user_id: "${j1}"
              captures: { lm: $.data.id }
          trigger:
            - call: "POST /surveillance/cases/${cl}/link-lab-result"
              payload: { lab_result_id: "${lm}" }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CASE_NOT_LINKABLE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cluster_forms_at_third_confirmed_case
        grounds:
          - calculations.outbreak_cluster_membership
          - entities.OutbreakCluster.fields.member_case_count
          - entities.Case.fields.cluster_id
          - entities.ReportableCondition.fields.cluster_min_cases
        distinguishing_aspect: |
          Count-threshold boundary on the classify endpoint: with cluster_min_cases 3, two
          CONFIRMED co-located cases form NO cluster (both cluster_id null) but classifying the
          third within the onset window crosses the >= 3 boundary and creates a cluster with
          member_case_count 3.
        test_recipe:
          setup:
            - "Program P, condition COVID19 (cluster_min_cases 3, cluster_window_days 14, requires_lab_confirmation false), jurisdiction J1."
            - "Cases CA (onset 2026-03-10), CB (onset 2026-03-12), CC (onset 2026-03-14), all exposure_setting_location_id 'VENUE-7', each interviewed."
            - "CA and CB classified CONFIRMED -> no cluster yet."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1, cluster_min_cases: 3, cluster_window_days: 14, requires_lab_confirmation: false }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-A", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true, exposure_setting_location_id: "VENUE-7" }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ca: $.data.id }
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-B", symptom_onset_date: "2026-03-12T00:00:00.000Z", is_symptomatic: true, exposure_setting_location_id: "VENUE-7" }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cb: $.data.id }
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-C", symptom_onset_date: "2026-03-14T00:00:00.000Z", is_symptomatic: true, exposure_setting_location_id: "VENUE-7" }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cc: $.data.id }
            - call: "POST /surveillance/cases/${ca}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cb}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cc}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${ca}/classify"
              payload: { classification: "CONFIRMED" }
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cb}/classify"
              payload: { classification: "CONFIRMED" }
              as: CaseInvestigator
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/cases/${cc}/classify"
              payload: { classification: "CONFIRMED" }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cc_cluster: $.data.cluster_id }
            - call: "GET /surveillance/cases/${cc}/cluster"
              as: EpiAnalyst
          assert:
            - "Case.${cc}.cluster_id is not null"
            - "OutbreakCluster.${cc_cluster}.member_case_count == 3"
            - "OutbreakCluster.${cc_cluster}.status == ACTIVE"

      - name: priority_band_inclusive_at_score_40
        grounds:
          - calculations.contact_priority_score
          - entities.Contact.fields.priority_band
          - entities.Contact.fields.priority_score
        distinguishing_aspect: |
          Inclusive >= boundary on a different metric (priority_score) and a different endpoint
          (POST /contacts): a contact scoring exactly 40 (WORKPLACE 25 + proximity 1.5m 10 +
          duration 10min 5) lands in MEDIUM (>= 40), while a sibling scoring 35 (same but 2min)
          lands in LOW.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1, index case CI interviewed."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-40", exposure_setting: "WORKPLACE", proximity_meters: 1.5, cumulative_exposure_minutes: 10, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { k40: $.data.id }
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-35", exposure_setting: "WORKPLACE", proximity_meters: 1.5, cumulative_exposure_minutes: 2, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { k35: $.data.id }
          assert:
            - "Contact.${k40}.priority_score == 40"
            - "Contact.${k40}.priority_band == MEDIUM"
            - "Contact.${k35}.priority_score == 35"
            - "Contact.${k35}.priority_band == LOW"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_close_blocked_by_active_monitoring_contact
        grounds:
          - state_machines.Case.CLASSIFIED_to_CLOSED
          - validations[priority=14]
          - entities.Contact.fields.status
        distinguishing_aspect: |
          Case-close legality depends on Contact state (entity pair Case<->Contact): a
          CLASSIFIED case with one Contact in MONITORING_ACTIVE cannot close
          (ERR_ACTIVE_MONITORING_EXISTS), but closes once that contact completes monitoring.
        test_recipe:
          setup:
            - "Program P, condition COVID19 (requires_lab_confirmation false), jurisdiction J1; clock at 2026-04-01 (past quarantine end)."
            - "Case CK opened+interviewed+classified PROBABLE; contact KK elicited, notified, monitoring scheduled+started (MONITORING_ACTIVE)."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/programs/${prog}/clock/set"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: JurisdictionAdmin
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
