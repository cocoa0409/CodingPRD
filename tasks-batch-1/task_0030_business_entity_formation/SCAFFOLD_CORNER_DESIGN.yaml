scaffold_corner_design:

  # ============================================================
  # Section: entities
  # ============================================================
  - section: entities
    instances:

      - name: create_business_entity_with_all_required_fields_returns_201
        claim_type: Creation
        grounds:
          - entities.BusinessEntity
          - endpoints[POST /business-entities]
        distinguishing_aspect: "POST /business-entities with all required fields returns 201 and the response body contains every declared field of BusinessEntity including server-stamped formed_at, status=FORMING, compliance_posture=GOOD_STANDING, version=1."
        test_recipe:
          setup:
            - "Clock pinned at 2026-01-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /business-entities"
              payload: { legal_name: "ALPHA LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_status: $.data.status, be_posture: $.data.compliance_posture, be_v: $.data.version, be_formed_at: $.data.formed_at }
          assert:
            - "HTTP status == 201"
            - "BusinessEntity.${be_id}.status == FORMING"
            - "BusinessEntity.${be_id}.compliance_posture == GOOD_STANDING"
            - "BusinessEntity.${be_id}.version == 1"
            - "BusinessEntity.${be_id}.formed_at == 2026-01-01T00:00:00Z"

      - name: get_business_entity_by_id_returns_stored_data
        claim_type: Retrieval
        grounds:
          - endpoints[GET /business-entities/{id}]
        distinguishing_aspect: "GET /business-entities/{id} returns the BusinessEntity row matching the path id with every declared field."
        test_recipe:
          setup: ["A BusinessEntity exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "BRAVO LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id }
          trigger:
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { got_id: $.data.id, got_name: $.data.legal_name }
          assert:
            - "HTTP status == 200"
            - "$.data.id == ${be_id}"
            - "$.data.legal_name == BRAVO LLC"

      - name: list_business_entities_returns_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints[GET /business-entities]
        distinguishing_aspect: "GET /business-entities returns response_type=array with meta and pagination envelope (limit, offset, total_count, has_more)."
        test_recipe:
          setup: ["Two BusinessEntities exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "CHARLIE LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
            - call: "POST /business-entities"
              payload: { legal_name: "DELTA LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
          trigger:
            - call: "GET /business-entities"
              payload: { limit: 10 }
              as: ComplianceOfficer
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "data is a list of length >= 2"

      - name: get_business_entity_unknown_uuid_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "GET /business-entities/{id} with a syntactically valid but unpersisted UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["No BusinessEntity with the requested id exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /business-entities/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "$.data.error_id == ERR_NOT_FOUND"

      - name: create_business_entity_missing_legal_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.BusinessEntity.fields.legal_name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /business-entities missing the required legal_name field returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /business-entities"
              payload: { entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: create_business_entity_default_revenue_band_zero
        claim_type: Defaults
        grounds:
          - entities.BusinessEntity.fields.revenue_band
        distinguishing_aspect: "Omitting revenue_band at creation yields revenue_band=ZERO (the declared default)."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /business-entities"
              payload: { legal_name: "ECHO LLC", entity_type: "LLC", formation_state_code: "DE" }
              as: Anonymous
              captures: { be_id: $.data.id, band: $.data.revenue_band }
          assert:
            - "$.data.revenue_band == ZERO"

      - name: create_business_entity_invalid_state_code_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.BusinessEntity.fields.formation_state_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "formation_state_code outside the supported set {CA, DE, NY, TX, FL, WY} is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /business-entities"
              payload: { legal_name: "FOXTROT LLC", entity_type: "LLC", formation_state_code: "ZZ", revenue_band: "ZERO" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: business_entity_status_computed_input_value_ignored
        claim_type: Computed Fields
        grounds:
          - entities.BusinessEntity.fields.status
        distinguishing_aspect: "BusinessEntity.status has source=computed; client-supplied status in POST body is ignored and the entity starts in FORMING."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /business-entities"
              payload: { legal_name: "GOLF LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_status: $.data.status }
          assert:
            - "BusinessEntity.${be_id}.status == FORMING  # computed, not client-controlled"

      - name: business_entity_id_and_timestamps_server_minted
        claim_type: System Fields
        grounds:
          - entities.BusinessEntity
        distinguishing_aspect: "id, formed_at, created_at, updated_at, version are server-minted; client-supplied values are ignored."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /business-entities"
              payload: { legal_name: "HOTEL LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, formed: $.data.formed_at, created: $.data.created_at, updated: $.data.updated_at, ver: $.data.version }
          assert:
            - "$.data.formed_at == 2026-01-01T00:00:00Z"
            - "$.data.created_at == 2026-01-01T00:00:00Z"
            - "$.data.version == 1"

      - name: compliance_event_is_immutable_log_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.ComplianceEvent
        distinguishing_aspect: "ComplianceEvent has common_fields:false (append-only audit log); §1.5 declares no PUT/PATCH/DELETE on it; the only read endpoint is GET /business-entities/{id}/compliance-events."
        test_recipe:
          setup: ["A BusinessEntity exists with at least one ComplianceEvent."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "INDIA LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
          trigger:
            - call: "GET /business-entities/${be_id}/compliance-events"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "ComplianceEvent rows are returned (no mutation endpoint exists for them)"

      - name: registered_agent_requires_parent_business_entity
        claim_type: Parent Relationships
        grounds:
          - entities.RegisteredAgent.fields.business_entity_id
          - errors[ERR_NOT_FOUND]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ppvc_state_vs_referential_dissolved_with_bad_fk
          rationale: "Parent-not-found at the path id is the existence leg of the §1.8 priority pair (ERR_NOT_FOUND at P=30 beats ERR_ENTITY_DISSOLVED at P=45)."

  # ============================================================
  # Section: state_machines
  # ============================================================
  - section: state_machines
    instances:

      - name: business_entity_initial_state_is_forming
        claim_type: Initial State
        grounds:
          - state_machines.BusinessEntity.initial_state
        distinguishing_aspect: "A newly created BusinessEntity begins life in status=FORMING."
        excluded_because:
          difficulty_instance: dual_variant_calc / dvc_compliance_posture_realtime_vs_snapshot_on_business_entity
          rationale: "Initial FORMING state and the cascade to ACTIVE/DELINQUENT are observed throughout the §1.8 cycle instance."

      - name: business_entity_auto_to_active_on_complete_formation_chain
        claim_type: Valid Transition
        grounds:
          - state_machines.BusinessEntity.FORMING_to_ACTIVE
        distinguishing_aspect: "When the entity has ACTIVE RegisteredAgent, ISSUED EIN, and (for LLC/LP) EXECUTED OperatingAgreement, the entity auto-transitions FORMING -> ACTIVE."
        test_recipe:
          setup: ["BusinessEntity exists with all three prerequisites filed but not yet auto-transitioned (we observe across the chain)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "JULIET LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0200" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
          trigger:
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { status_after: $.data.status }
          assert:
            - "BusinessEntity.${be_id}.status == ACTIVE  # auto-transition from FORMING when all three prerequisites satisfied"

      - name: dissolve_dissolved_entity_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.BusinessEntity.transitions
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "PATCH /business-entities/{id}/dissolve from DISSOLVED is not declared; the transition is rejected as invalid."
        test_recipe:
          setup: ["A DISSOLVED BusinessEntity."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "KILO LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0210" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "PATCH /business-entities/${be_id}/dissolve"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
          trigger:
            - call: "PATCH /business-entities/${be_id}/dissolve"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: dissolved_entity_terminal_lockdown_no_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.BusinessEntity.terminal_states
        distinguishing_aspect: "DISSOLVED is terminal for BusinessEntity; no further state-changing endpoint succeeds against a DISSOLVED entity."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cesd_annual_report_file_requires_non_dissolved_business_entity
          rationale: "The general terminal-lockdown property is asserted by the cross-entity gate ERR_ENTITY_DISSOLVED on a DISSOLVED parent."

      - name: ein_application_idempotent_issue_after_issued_fails
        claim_type: Idempotency
        grounds:
          - state_machines.EINApplication.PENDING_to_ISSUED
        distinguishing_aspect: "POST /ein-applications/{id}/issue on an already-ISSUED application returns ERR_INVALID_STATE (no re-issue)."
        test_recipe:
          setup: ["An EINApplication in ISSUED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "LIMA LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0220" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
          trigger:
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: cascade_dissolve_voids_drafts_and_resigns_agents
        claim_type: Side Effect Execution
        grounds:
          - state_machines.BusinessEntity.ACTIVE_to_DISSOLVED
        distinguishing_aspect: "Dissolving an ACTIVE BusinessEntity cascades: DRAFT/DELINQUENT AnnualReports flip to VOIDED; ACTIVE RegisteredAgents flip to RESIGNED; compliance_posture -> FROZEN; one single PATCH /dissolve call applies all of these."
        test_recipe:
          setup: ["DE LLC entity ACTIVE with: 1 ACTIVE RegisteredAgent, 1 DRAFT AnnualReport for 2024."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "MIKE LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0230" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ar_id: $.data.id }
          trigger:
            - call: "PATCH /business-entities/${be_id}/dissolve"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "GET /business-entities/${be_id}/registered-agents"
              payload: {}
              as: ComplianceOfficer
              captures: { ra_status_after: $.data.0.status }
            - call: "GET /business-entities/${be_id}/annual-reports"
              payload: {}
              as: ComplianceOfficer
              captures: { ar_status_after: $.data.0.status }
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture_after: $.data.compliance_posture }
          assert:
            - "RegisteredAgent.${ra_id}.status == RESIGNED  # cascade"
            - "AnnualReport.${ar_id}.status == VOIDED  # cascade"
            - "BusinessEntity.${be_id}.compliance_posture == FROZEN"

      - name: foreign_qualification_blocks_dissolution
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.BusinessEntity.ACTIVE_to_DISSOLVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "PATCH /business-entities/{id}/dissolve fails when at least one ForeignQualification.status == QUALIFIED — the QUALIFIED FQ must be withdrawn first."
        test_recipe:
          setup: ["DE LLC entity ACTIVE qualified in CA via a CA-state RegisteredAgent and FQ in QUALIFIED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "NOVEMBER LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { be_v1: $.data.version }
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0240" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { be_v2: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "CA Agent", agent_type: "COMMERCIAL", agent_state_code: "CA", expected_business_entity_version: "${be_v2}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ra_ca_id: $.data.id }
            - call: "POST /business-entities/${be_id}/foreign-qualifications"
              payload: { foreign_state_code: "CA", foreign_registered_agent_id: "${ra_ca_id}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { fq_id: $.data.id }
            - call: "POST /foreign-qualifications/${fq_id}/approve"
              payload: {}
              as: StateAdmin
          trigger:
            - call: "PATCH /business-entities/${be_id}/dissolve"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_INVALID_STATE  # precondition: no QUALIFIED FQ"

      - name: reinstate_from_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.BusinessEntity.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "POST /business-entities/{id}/reinstate against a BusinessEntity in ACTIVE (not SUSPENDED) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["DE LLC entity in ACTIVE."]
          setup_api_calls:
