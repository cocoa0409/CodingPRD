              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${case1_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { case_v: $.data.version }
            - call: "POST /sleep-consulting/cases/${case1_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${case_v}" }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/consultants/${cons_id}"
              as: PracticeAdmin
              captures: { cnt: $.data.active_case_count }
          trigger:
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-06-01", delivery_mode: "GROUP_COURSE", guarantee_goal_night_wakings: 1 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First case creation succeeded at active_case_count == 0 (== max - 1 boundary accepts)"
            - "Consultant.${cons_id}.active_case_count == 1 (captured cnt)"
            - "Second creation at count == 1 (== max): error_id == ERR_CONSULTANT_AT_CAPACITY, HTTP 409"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_create_gated_by_case_state
        grounds:
          - state_machines.ClientCase
          - validations[priority=5]
          - errors[ERR_CASE_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair = SleepPlan x ClientCase. Plan creation is rejected while the
          case is INTAKE (ERR_CASE_INVALID_STATE) and accepted for identical payload
          once the case reaches PLANNING — the plan's creatable set depends on the
          parent case's state.
        test_recipe:
          setup:
            - "Case exists in INTAKE (questionnaire not yet submitted)"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-112", max_active_cases: 5 }
              as: PracticeAdmin
