            - call: "POST /sessions"
              payload: { conference_id: "${conf_id}", chair_member_id: "${mb_chair3_id}", theme_code: "oncology", format: "ORAL", room_code: "HALL-A", start_utc: "2026-09-01T10:59:00Z", end_utc: "2026-09-01T11:30:00Z", capacity_slots: 4, cme_designated: false }
