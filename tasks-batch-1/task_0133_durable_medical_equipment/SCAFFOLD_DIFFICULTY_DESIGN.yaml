  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_cmn_required_on_mark_ready
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: |
          Category pair state (priority 4) vs business_referential (priority 5):
          a mark-ready on an already-READY_FOR_DELIVERY order (state violation) that
          ALSO would fail the CMN-required gate must return ERR_INVALID_STATE, not
          ERR_CMN_REQUIRED.
        test_recipe:
          setup:
            - "CMN-required CAPPED_RENTAL order driven to READY_FOR_DELIVERY via an ACTIVE CMN, then the CMN is revoked so the CMN gate would now fail; order is still READY_FOR_DELIVERY."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat H", medicare_id: "MBI-H1", date_of_birth: "1943-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup H", ptan: "PTAN-H1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0008", description: "Wheelchair cmn req", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: true, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-09-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /cmns"
              payload: { order_id: "${order_id}", physician_npi: "NPI-3", length_of_need_months: 12, signed_date: "2026-08-20" }
              as: PhysicianUser
              captures: { cmn_id: $.data.id }
            - call: "POST /cmns/${cmn_id}/activate"
              payload: { expected_order_version: "${order_v}" }
              as: PhysicianUser
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /cmns/${cmn_id}/revoke"
              payload: {}
              as: PhysicianUser
          trigger:
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (state priority 4 beats CMN-required priority 5)"
            - "HTTP status == 409"

      - name: business_temporal_beats_occ_on_cmn_activate
        grounds:
          - validations[priority=13]
          - validations[priority=14]
        distinguishing_aspect: |
          Category pair business_temporal (priority 13, CMN signed after order) vs
          state (priority 14, OCC stale order version): activating CMN#2 whose
          signed_date is after the order's ordered_at date AND carrying the stale
          pre-supersede order version must return ERR_CMN_SIGNED_AFTER_ORDER, not
          ERR_STALE_ORDER_VERSION.
        test_recipe:
          setup:
            - "CMN-required CAPPED_RENTAL order ordered_at 2026-01-01; CMN#1 activated (order version bumped 1->2); CMN#2 is DRAFT with signed_date 2026-02-01 (after the order)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat I", medicare_id: "MBI-I1", date_of_birth: "1942-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
