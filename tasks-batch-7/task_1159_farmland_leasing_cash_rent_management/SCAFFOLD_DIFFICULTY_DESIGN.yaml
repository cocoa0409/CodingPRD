  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: noncompliance_cascade_suspends_tenant_and_withdraws_bids
        grounds:
          - state_machines.ComplianceRecord.PENDING_to_NON_COMPLIANT
          - calculations.compliance_score_update
          - state_machines.Tenant.APPROVED_to_SUSPENDED
          - state_machines.Bid.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: |
          Depth-3 chain from a cure-deadline sweep trigger: 4 records flip
          NON_COMPLIANT (trigger) -> tenant.compliance_score 100 -> 40 (link 1)
          -> score < 50 flips Tenant APPROVED -> SUSPENDED (link 2, caused by
          the score change) -> the suspension itself withdraws the tenant's
          SUBMITTED bid on a SECOND offering and recomputes that offering's
          eligible_bid_count to 0 (link 3, caused by the suspension).
        test_recipe:
          setup:
            - "CASH lease ACTIVE on field A with 4 conservation practices all due 2027-06-01 (cure 2027-07-01)"
            - "Same tenant holds a SUBMITTED bid on a second open offering (field B)"
            - "Clock advanced to 2027-07-02 fires the cure-deadline sweep"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { name: "L Cas", contact_email: "lk@x.com" }
              as: FarmManager
              captures:
                ld: "$.data.id"
