  - rule_id: boundary_precision_check
    instances:
      - name: overtime_second_tier_starts_strictly_after_twelve_hours
        grounds:
          - calculations.shift_labor_cost
          - entities.DailyReport.fields.line_costs_cents
        distinguishing_aspect: |
          Hours-metric threshold boundary via the submit endpoint: at exactly
          12.0 hours ot2 = max(12-12, 0) = 0 so the line costs 119000 cents,
          while 12.5 hours adds 0.5 * 8500 * 2.0 = 8500 -> 127500 cents; the
          tier boundary is exclusive at 12 (>12, not >=12).
        test_recipe:
          setup:
            - "Turnaround in EXECUTION; contractor MOBILIZED with TWO BADGED workers W1 and W2; DAY shifts SD1 (08:00-20:00) and SD2 (08:00-20:30) on 2026-06-15; clock 2026-06-15T21:00:00Z"
            - "DRAFT report date 2026-06-15 with lines: (W1, SD1, 12.0h, no hazard) and (W2, SD2, 12.5h, no hazard)"
          setup_api_calls:
