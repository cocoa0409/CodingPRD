scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: plan_creation_returns_201_with_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.Plan.fields.child_monitoring_included
          - entities.Plan.fields.min_specialist_tier
          - endpoints.POST_/idp/plans
        distinguishing_aspect: "Omitting child_monitoring_included and min_specialist_tier yields false and TIER1 respectively; version starts at 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /idp/plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 999, insurance_limit_cents: 100000, max_family_members: 1, bureau_scope: "SINGLE" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Plan.${plan_id}.child_monitoring_included == false"
            - "Plan.${plan_id}.min_specialist_tier == 'TIER1'"
            - "Plan.${plan_id}.version == 1"
            - "Plan.${plan_id}.id is a bare UUID with no type prefix"

      - name: subscriber_enrollment_starts_pending_verification_with_no_bureau_profiles
        claim_type: Creation
        grounds:
          - entities.Subscriber.fields.enrollment_status
          - entities.Subscriber.fields.monitoring_status
          - entities.Subscriber.fields.verification_token
        distinguishing_aspect: "POST /idp/subscribers returns enrollment_status PENDING_VERIFICATION, monitoring_status NOT_ENROLLED, a non-null verification_token, and provisions ZERO BureauProfiles."
        test_recipe:
          setup: ["One TRI plan exists."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /idp/subscribers"
              payload: { email: "e1@example.com", full_name: "Nora Vela", date_of_birth: "1990-01-01", ssn_last4: "1111", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
          assert:
            - "HTTP 201"
            - "Subscriber.${sub_id}.enrollment_status == 'PENDING_VERIFICATION'"
            - "Subscriber.${sub_id}.monitoring_status == 'NOT_ENROLLED'"
            - "Subscriber.${sub_id}.verification_token is a non-empty string"
            - "Subscriber.${sub_id}.insurance_remaining_cents == 0 (not yet provisioned) and composite_credit_score == null"
            - "GET /idp/subscribers/${sub_id}/bureau-profiles returns 0 elements"

      - name: subscriber_create_missing_required_ssn_last4_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Subscriber.fields.ssn_last4
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting ssn_last4 from POST /idp/subscribers is rejected with ERR_INVALID_REQUEST (400) and creates no row."
        test_recipe:
          setup: ["One TRI plan exists."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /idp/subscribers"
              payload: { email: "e2@example.com", full_name: "Gap Test", date_of_birth: "1990-01-01", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "GET /idp/subscribers filtered by plan_id == ${plan_id} returns 0 elements"

      - name: family_member_invalid_enum_relationship_rejected
        claim_type: Type Constraints
        grounds:
          - entities.FamilyMember.fields.relationship
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "relationship = 'SPOUSE' is not a member of {ADULT, CHILD} and is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Verified subscriber on a plan with max_family_members 4 and child_monitoring_included true."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "e3@example.com", full_name: "Fay Ing", date_of_birth: "1984-03-03", ssn_last4: "2222", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
          trigger:
            - call: "POST /idp/subscribers/${sub_id}/family-members"
              payload: { full_name: "Kid Ing", date_of_birth: "2015-05-05", ssn_last4: "3333", relationship: "SPOUSE" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "GET /idp/subscribers/${sub_id}/family-members returns 0 elements"

      - name: plan_create_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Plan.fields.tier
          - endpoints.POST_/idp/plans
        distinguishing_aspect: "Client-supplied id / created_at / version on POST /idp/plans are ignored; the server mints its own UUID and sets version to 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /idp/plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 999, insurance_limit_cents: 100000, max_family_members: 1, bureau_scope: "SINGLE", id: "00000000-0000-0000-0000-000000000001", version: 99 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "Plan.${plan_id}.id != '00000000-0000-0000-0000-000000000001'"
            - "Plan.${plan_id}.version == 1"

      - name: family_member_child_not_covered_when_plan_excludes_children
        claim_type: Computed Fields
        grounds:
          - entities.FamilyMember.fields.monitoring_status
          - entities.Plan.fields.child_monitoring_included
        distinguishing_aspect: "On a plan with child_monitoring_included = false, an ADULT family member is computed MONITORED while a CHILD family member is created but computed NOT_COVERED — the flag only gates children."
        test_recipe:
          setup: ["Plan with child_monitoring_included = false, max_family_members 4; verified subscriber."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ADVANTAGE", monthly_fee_cents: 1999, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: false, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "e4@example.com", full_name: "Mo Larkin", date_of_birth: "1981-08-08", ssn_last4: "4444", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
          trigger:
            - call: "POST /idp/subscribers/${sub_id}/family-members"
              payload: { full_name: "Adult Larkin", date_of_birth: "1983-09-09", ssn_last4: "5555", relationship: "ADULT" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { fm_adult: $.data.id }
            - call: "POST /idp/subscribers/${sub_id}/family-members"
              payload: { full_name: "Child Larkin", date_of_birth: "2016-06-06", ssn_last4: "6666", relationship: "CHILD" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { fm_child: $.data.id }
          assert:
            - "FamilyMember.${fm_adult}.monitoring_status == 'MONITORED'"
            - "FamilyMember.${fm_child}.monitoring_status == 'NOT_COVERED'  # child_monitoring_included is false on this plan"
            - "GET /idp/subscribers/${sub_id}/family-members returns exactly 2 elements ordered by created_at ASC, ${fm_adult} first"

      - name: subscriber_not_found_returns_404
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_SUBSCRIBER_NOT_FOUND]
        distinguishing_aspect: "GET /idp/subscribers/{unknown-uuid} returns ERR_SUBSCRIBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /idp/subscribers/9d1f7c2a-0000-4000-8000-aaaabbbbcccc"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == 'ERR_SUBSCRIBER_NOT_FOUND'"

      - name: plan_not_found_on_enrollment_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.Subscriber.fields.plan_id
          - errors[ERR_PLAN_NOT_FOUND]
        distinguishing_aspect: "Enrolling with a plan_id that resolves to nothing returns ERR_PLAN_NOT_FOUND (404), not ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /idp/subscribers"
              payload: { email: "e5@example.com", full_name: "Ghost Plan", date_of_birth: "1990-01-01", ssn_last4: "7777", plan_id: "11111111-2222-4333-8444-555555555555" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == 'ERR_PLAN_NOT_FOUND'"

      - name: alerts_list_returns_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/idp/alerts
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /idp/alerts with limit 2 returns response_type 'array', 2 elements, total_count 3 and has_more true."
        test_recipe:
          setup: ["Verified subscriber with three NEW alerts."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "e6@example.com", full_name: "Page Lister", date_of_birth: "1992-12-12", ssn_last4: "8888", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "DARK_WEB", severity: "LOW", source_detail: "one" }
              as: PlatformAdmin
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "DARK_WEB", severity: "LOW", source_detail: "two" }
              as: PlatformAdmin
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "DARK_WEB", severity: "LOW", source_detail: "three" }
              as: PlatformAdmin
          trigger:
            - call: "GET /idp/alerts"
              payload: { subscriber_id: "${sub_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "meta.api_request_id and meta.api_request_timestamp present; response_type == 'array'"
            - "len(data) == 2; total_count == 3; has_more == true; limit == 2; offset == 0"
            - "Elements are ordered by created_at ASC: source_detail 'one' then 'two'"

  # =========================================================================
  - section: state_machines
    instances:
      - name: alert_acknowledge_twice_second_call_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Alert.NEW_to_ACKNOWLEDGED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Acknowledging an already-ACKNOWLEDGED alert returns ERR_INVALID_STATE (409); risk_score does not double-count."
        test_recipe:
          setup: ["Verified subscriber; one DARK_WEB alert already ACKNOWLEDGED (risk_score 25 = 10 base + 15)."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "s1@example.com", full_name: "Ack Twice", date_of_birth: "1985-05-05", ssn_last4: "9999", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "DARK_WEB", severity: "LOW", source_detail: "paste site" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /idp/alerts/${a_id}/acknowledge"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /idp/alerts/${a_id}/acknowledge"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == 'ERR_INVALID_STATE'"
            - "Alert.${a_id}.status == 'ACKNOWLEDGED'"
            - "Subscriber.${sub_id}.risk_score == 25 (10 base + 15 DARK_WEB, counted once)"

      - name: alert_confirm_fraud_from_new_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Alert.ACKNOWLEDGED_to_CONFIRMED_FRAUD
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "confirm-fraud is only declared from ACKNOWLEDGED; calling it on a NEW alert returns ERR_INVALID_STATE (409) and creates no RestorationCase."
        test_recipe:
          setup: ["Verified subscriber with one NEW alert (never acknowledged)."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "s2@example.com", full_name: "Skip Ack", date_of_birth: "1985-05-05", ssn_last4: "1212", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "SSN_TRACE", severity: "HIGH", source_detail: "SSN trace" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /idp/alerts/${a_id}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == 'ERR_INVALID_STATE'"
            - "Alert.${a_id}.status == 'NEW'"
            - "GET /idp/restoration-cases filtered by subscriber_id == ${sub_id} returns 0 elements"

      - name: alert_dismiss_branch_creates_no_case_and_drops_risk_contribution
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Alert.ACKNOWLEDGED_to_DISMISSED
          - entities.Alert.fields.dismissal_reason
          - calculations.identity_risk_score
        distinguishing_aspect: "The DISMISS branch has a disjoint side-effect set from CONFIRM_FRAUD: no RestorationCase is created, dismissal_reason is stored, and the DARK_WEB alert's +15 LIVE contribution disappears (risk_score back to 10)."
        test_recipe:
          setup: ["Verified subscriber with one ACKNOWLEDGED DARK_WEB alert (risk_score 25)."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "s3@example.com", full_name: "Di Smiss", date_of_birth: "1988-08-18", ssn_last4: "1313", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "DARK_WEB", severity: "LOW", source_detail: "old password in dump" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /idp/alerts/${a_id}/acknowledge"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /idp/alerts/${a_id}/dismiss"
              payload: { dismissal_reason: "Password already rotated years ago" }
              as: Subscriber
              as_user_id: "${sub_id}"
          assert:
            - "Alert.${a_id}.status == 'DISMISSED'"
            - "Alert.${a_id}.dismissal_reason == 'Password already rotated years ago'"
            - "GET /idp/restoration-cases filtered by subscriber_id == ${sub_id} returns 0 elements"
            - "Subscriber.${sub_id}.risk_score == 10 AND underwriting_risk_score == 10"

      - name: case_cycles_in_progress_and_pending_subscriber_twice
        claim_type: Valid Transition
        grounds:
          - state_machines.RestorationCase.IN_PROGRESS_to_PENDING_SUBSCRIBER
          - state_machines.RestorationCase.PENDING_SUBSCRIBER_to_IN_PROGRESS
          - entities.RestorationCase.fields.info_request
          - entities.RestorationCase.fields.info_response
        distinguishing_aspect: "The IN_PROGRESS <-> PENDING_SUBSCRIBER loop may run more than once; after two full laps the case is IN_PROGRESS with version 7 and holds the SECOND info_request/info_response pair."
        test_recipe:
          setup: ["Verified subscriber; confirmed-fraud alert -> case (version 1); TIER2 specialist assigned (version 2); one engagement booked -> IN_PROGRESS (version 3)."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "s4@example.com", full_name: "Cy Cle", date_of_birth: "1991-11-11", ssn_last4: "1414", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/specialists"
              payload: { full_name: "Loop Handler", tier: "TIER2", max_caseload: 3, max_concurrent_engagements: 1 }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "SSN_TRACE", severity: "MEDIUM", source_detail: "SSN on new lease" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /idp/alerts/${a_id}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a_id}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "GET /idp/restoration-cases"
              payload: { origin_alert_id: "${a_id}" }
              as: PlatformAdmin
              captures: { case_id: "$.data[0].id" }
            - call: "POST /idp/restoration-cases/${case_id}/assign"
              payload: { specialist_id: "${sp_id}" }
              as: PlatformAdmin
            - call: "GET /idp/specialists/${sp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sp_v: $.data.version }
            - call: "POST /idp/specialist-engagements"
              payload: { specialist_id: "${sp_id}", case_id: "${case_id}", window_start: "2026-05-20T09:00:00Z", window_end: "2026-05-20T11:00:00Z", expected_specialist_version: "${sp_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /idp/restoration-cases/${case_id}/request-info"
              payload: { info_request: "Upload the police report" }
              as: RestorationSpecialist
              as_user_id: "${sp_id}"
            - call: "POST /idp/restoration-cases/${case_id}/provide-info"
              payload: { info_response: "Report #A-1 attached" }
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /idp/restoration-cases/${case_id}/request-info"
              payload: { info_request: "Also upload the FTC affidavit" }
              as: RestorationSpecialist
              as_user_id: "${sp_id}"
            - call: "POST /idp/restoration-cases/${case_id}/provide-info"
              payload: { info_response: "Affidavit #B-2 attached" }
              as: Subscriber
              as_user_id: "${sub_id}"
          assert:
            - "After trigger 1: RestorationCase.${case_id}.status == 'PENDING_SUBSCRIBER'"
            - "After trigger 2: RestorationCase.${case_id}.status == 'IN_PROGRESS'"
            - "After trigger 4: RestorationCase.${case_id}.status == 'IN_PROGRESS' AND version == 7"
            - "After trigger 4: RestorationCase.${case_id}.info_request == 'Also upload the FTC affidavit'"
            - "After trigger 4: RestorationCase.${case_id}.info_response == 'Affidavit #B-2 attached'"

      - name: case_resolve_from_pending_subscriber_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RestorationCase.IN_PROGRESS_to_RESOLVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "resolve is declared only from IN_PROGRESS; calling it while the case waits on the subscriber (PENDING_SUBSCRIBER) returns ERR_INVALID_STATE (409) and leaves the specialist's caseload untouched."
        test_recipe:
          setup: ["Case driven to PENDING_SUBSCRIBER (assigned, engaged, then request-info); specialist active_case_count 1."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "s5@example.com", full_name: "Pend Ing", date_of_birth: "1993-03-13", ssn_last4: "1515", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/specialists"
              payload: { full_name: "Gate Keep", tier: "TIER2", max_caseload: 3, max_concurrent_engagements: 1 }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /idp/alerts"
