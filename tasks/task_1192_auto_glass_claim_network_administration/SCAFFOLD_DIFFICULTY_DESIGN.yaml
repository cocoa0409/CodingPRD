            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "SIDE_GLASS", loss_date: "2026-04-03", description: "w3", requires_adas_calibration: false, estimated_repair_cost_cents: 80000 }
              as: Policyholder
