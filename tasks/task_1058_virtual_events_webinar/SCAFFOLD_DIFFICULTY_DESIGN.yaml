            - "Event 'Summit F' in DRAFT with one track and one DRAFT session 2026-09-15T10:00:00Z–11:00:00Z."
            - "One speaker invited to that session, who accepted and then withdrew, leaving the junction row WITHDRAWN with invite_round 1 and the speaker UNASSIGNED."
