scenario: "2333. Cooperative Purchasing Contract Administration (public procurement cooperative): lead agency solicitation conducted to satisfy other members' procurement rules, supplier award with nationwide pricing, discount structures and permitted add-ons, member agency registration and eligibility verification across government and nonprofit categories, contract usage reporting with administrative fee remittance by suppliers, piggyback authority analysis by state law for participating agencies, contract renewals, price adjustments and product line expansions, supplier performance monitoring and member complaint handling, competitive solicitation documentation package for member audit files"
domain_name: "cooperative-purchasing-contract-administration"
api_prefix: "/coop"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # StateLawRule (natural-key config), Solicitation, Supplier, MemberAgency are peer roots;
  # SolicitationResponse, MasterContract, PiggybackAnalysis, ContractUsage and MemberComplaint are
  # multi-parent junctions that reference two or three roots each, so the reference graph is a DAG
  # with several diamonds (MemberAgency -> PiggybackAnalysis -> ContractUsage <- MasterContract).

  state_machine_shape: parallel
  # Three entities carry two independent state dimensions each:
  #   Solicitation(status x audit_package_status), MasterContract(status x compliance_posture),
  #   UsageReport(status x fee_status).
  # On top of that MemberAgency.registration_status and SolicitationResponse.status are cyclic,
  # and Solicitation.status / MemberComplaint.status are branching fork-join shapes.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  # one_to_many: MasterContract -> ContractLineItem, MasterContract -> UsageReport
  # many_to_many: PiggybackAnalysis is the MemberAgency x MasterContract junction;
  #               ContractUsage is the MemberAgency x ContractLineItem junction
  # cross_aggregate: ContractUsage.total_cents debits MemberAgency.committed_spend_cents and
  #                  feeds Supplier.fee_assessed_cents_total through UsageReport
  # polymorphic: ContractAmendment.amendment_type selects which optional payload block is required
  #              and which target entity (MasterContract term vs ContractLineItem price vs new lines)
  #              the approval mutates

  role_model: segregation_of_duties
  # Peer operator roles (CoopAdministrator, LeadAgencyOfficer) plus two entity-backed party roles
  # (SupplierRepresentative -> Supplier, MemberRepresentative -> MemberAgency) and a read-only
  # MemberAuditor. Two segregation-of-duties gates: the officer who recommends an award may not
  # sign it, and the administrator who opens a complaint investigation may not adjudicate it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: StateLawRule
    parent: null
    common_fields: false
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter uppercase US state code. Natural key of this configuration row; Solicitation.lead_agency_state_code and MemberAgency.state_code resolve to StateLawRule.state_code by exact string match (natural key, NOT a UUID foreign key)."
        constraints: "exactly 2 uppercase letters; unique across StateLawRule"
      - name: piggyback_doctrine
        type: enum
        source: input
        description: "Which authority-scoring variant applies to member agencies of this state."
        constraints: "one of {STATUTORY_STRICT, RECIPROCITY_LIBERAL}"
      - name: min_notice_days
        type: integer
        source: input
        description: "Minimum public-notice days this state requires between solicitation posting and response deadline."
        constraints: ">= 0 and <= 90"
      - name: requires_lead_agency_in_state
        type: boolean
        source: input
        description: "True when this state only recognises solicitations whose lead agency sits in the member's own state."
      - name: allows_nonprofit_participation
        type: boolean
        source: input
        description: "True when member agencies of category NONPROFIT_501C3 in this state may piggyback on cooperative contracts."
      - name: max_contract_term_months
        type: integer
        source: input
        description: "Longest total contract term (base + renewals) this state recognises, in whole months."
        constraints: ">= 12 and <= 120"
      - name: requires_local_solicitation_waiver
        type: boolean
        source: input
        description: "True when a member of this state must record a local governing-body waiver reference before piggybacking."
      - name: reciprocity_state_codes
        type: array
        source: input
        description: "Uppercase state codes whose lead-agency solicitations this state accepts without an out-of-state deduction. Read only when piggyback_doctrine == RECIPROCITY_LIBERAL."
        default: "[]"
        constraints: "array of 2-letter uppercase codes; must not contain this row's own state_code"

  - name: Solicitation
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Public title of the competitive solicitation."
        constraints: "1..200 chars"
      - name: solicitation_number
        type: string
        source: input
        description: "Human-readable identifier printed on the public notice."
        constraints: "unique across Solicitation; 1..40 chars"
      - name: lead_agency_name
        type: string
        source: input
        description: "Name of the lead agency conducting the solicitation on behalf of the cooperative."
      - name: lead_agency_state_code
        type: string
        source: input
        description: "State of the lead agency; resolves to StateLawRule.state_code by exact string match (natural key, not a UUID foreign key). Must already exist as a StateLawRule row."
        constraints: "exactly 2 uppercase letters"
      - name: status
        type: enum
        source: computed
        description: "Competitive-process dimension of the solicitation lifecycle (see state_machines Solicitation.status)."
        default: DRAFT
        constraints: "one of {DRAFT, POSTED, EVALUATION, AWARD_PENDING, AWARDED, FAILED, CANCELLED}"
      - name: audit_package_status
        type: enum
        source: computed
        description: "Independent documentation dimension used by member audit files (see state_machines Solicitation.audit_package_status)."
        default: NOT_ASSEMBLED
        constraints: "one of {NOT_ASSEMBLED, ASSEMBLED, CERTIFIED, STALE}"
      - name: response_due_at
        type: datetime
        source: input
        description: "Public deadline for supplier responses, ISO 8601 UTC."
      - name: posted_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which POST_NOTICE succeeded; null while status == DRAFT."
      - name: notice_days
        type: integer
        source: computed
        description: "floor((response_due_at - posted_at) / 86400 seconds); null while posted_at is null. Frozen at posting."
      - name: technical_weight_pct
        type: number
        source: input
        description: "Weight of the technical score in composite_score, in percent."
        constraints: "0..100 with 2 decimals; technical_weight_pct + price_weight_pct == 100"
      - name: price_weight_pct
        type: number
        source: input
        description: "Weight of the price score in composite_score, in percent."
        constraints: "0..100 with 2 decimals"
      - name: specification_document_ref
        type: string
        source: input
        description: "Reference of the archived specification package; null when the lead agency has not filed it. Supplies audit doc code SPECIFICATION_PACKAGE."
        default: "null"
      - name: method_justification_ref
        type: string
        source: input
        description: "Reference of the archived procurement-method justification memo. Supplies audit doc code PROCUREMENT_METHOD_JUSTIFICATION."
        default: "null"
      - name: amendment_log_document_ref
        type: string
        source: input
        description: "Reference of the archived amendment log; set through the audit-package endpoint. Supplies audit doc code AMENDMENT_LOG, which is only required once an amendment on this solicitation's contract has been approved."
        default: "null"
      - name: addenda_count
        type: integer
        source: computed
        description: "Number of addenda issued while POSTED. Zero is a legitimate value; the ADDENDA_LOG doc code is present whenever posted_at is not null."
        default: 0
      - name: responsive_response_count
        type: integer
        source: computed
        description: "Count of SolicitationResponse rows with solicitation_id == this Solicitation.id and status == RESPONSIVE."
        default: 0
      - name: audit_required_doc_codes
        type: array
        source: computed
        description: "Doc codes the member audit file must contain for this solicitation; recomputed on every audit-package ASSEMBLE."
        default: "[]"
      - name: audit_present_doc_codes
        type: array
        source: computed
        description: "Subset of audit_required_doc_codes whose evidence exists; recomputed on every audit-package ASSEMBLE."
        default: "[]"
      - name: audit_completeness_pct
        type: number
        source: computed
        description: "Output of calculations.audit_package_completeness; null while audit_package_status == NOT_ASSEMBLED."
      - name: recommended_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the LeadAgencyOfficer whose RECOMMEND_AWARD moved this solicitation to AWARD_PENDING."
      - name: awarded_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the LeadAgencyOfficer whose AWARD moved this solicitation to AWARDED. Segregation of duties forbids this equalling recommended_by_user_id."
      - name: certified_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the LeadAgencyOfficer who CERTIFIED the audit package."
      - name: certified_at
        type: datetime
        source: computed
        description: "Logical-clock instant of audit-package CERTIFY."

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the supplier."
        constraints: "unique across Supplier; 1..200 chars"
      - name: home_state_code
        type: string
        source: input
        description: "State of the supplier's principal place of business; resolves to StateLawRule.state_code by exact string match (natural key, not a UUID foreign key)."
        constraints: "exactly 2 uppercase letters"
      - name: qualification_status
        type: enum
        source: computed
        description: "Cooperative-level standing that gates response submission and contract activity."
        default: UNQUALIFIED
        constraints: "one of {UNQUALIFIED, QUALIFIED, SUSPENDED, DEBARRED}"
      - name: performance_score
        type: number
        source: computed
        description: "Output of calculations.supplier_performance_score; 2 decimals, floor 0.00, ceiling 100.00."
        default: 100.00
      - name: deduction_points_total
        type: number
        source: computed
        description: "Sum of every performance point currently charged against this supplier (substantiated complaints + variance flags + delinquent reports). Conserved quantity of the performance-point invariant."
        default: 0.00
      - name: performance_tier
        type: enum
        source: computed
        description: "Banding of performance_score (>= 85.00 PREFERRED, >= 70.00 STANDARD, else PROBATION)."
        default: PREFERRED
        constraints: "one of {PREFERRED, STANDARD, PROBATION}"
      - name: substantiated_complaint_count
        type: integer
        source: computed
        description: "Count of MemberComplaint rows resolving to this supplier's contracts with status == SUBSTANTIATED."
        default: 0
      - name: fee_assessed_cents_total
        type: integer
        source: computed
        description: "Sum of reported_fee_cents over UsageReport rows on this supplier's contracts with status IN {ACCEPTED, RECONCILED}, plus every applied fee_true_up_cents."
        default: 0
      - name: fee_remitted_cents_total
        type: integer
        source: computed
        description: "Sum of remitted_cents over UsageReport rows on this supplier's contracts."
        default: 0
      - name: delinquent_report_count
        type: integer
        source: computed
        description: "Count of UsageReport rows on this supplier's contracts with fee_status == DELINQUENT."
        default: 0

  - name: SolicitationResponse
    parent: Solicitation
    common_fields: true
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id; the solicitation this response answers."
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the responding supplier. Must be QUALIFIED at submission."
      - name: status
        type: enum
        source: computed
        description: "Responsiveness dimension; cycles SUBMITTED -> INFO_REQUESTED -> SUBMITTED up to MAX_INFO_REQUEST_ROUNDS times."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, INFO_REQUESTED, RESPONSIVE, NON_RESPONSIVE, WITHDRAWN}"
      - name: proposed_annual_value_cents
        type: integer
        source: input
        description: "Supplier's proposed nationwide annual contract value in cents; the price_score denominator."
        constraints: ">= 1"
      - name: technical_score
        type: number
        source: computed
        description: "Evaluation panel's technical score, supplied by the LeadAgencyOfficer on MARK_RESPONSIVE; 0.00..100.00, 2 decimals; null until then."
      - name: price_score
        type: number
        source: computed
        description: "Output of calculations.composite_score step 1; null until every RESPONSIVE peer is scored."
      - name: composite_score
        type: number
        source: computed
        description: "Output of calculations.composite_score; 2 decimals, per-component rounding then sum."
      - name: award_rank
        type: integer
        source: computed
        description: "1-based rank among this solicitation's RESPONSIVE responses ordered by composite_score DESC, tie-break created_at ASC. Null for non-RESPONSIVE rows."
      - name: info_request_rounds
        type: integer
        source: computed
        description: "Number of completed REQUEST_INFO -> RESUBMIT cycles; capped at MAX_INFO_REQUEST_ROUNDS."
        default: 0
      - name: responsiveness_note
        type: string
        source: input
        description: "Free-text note recorded by the evaluator on the latest review action."
        default: "null"

  - name: MasterContract
    parent: null
    common_fields: true
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id; the awarded solicitation. Must be AWARDED."
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the awarded supplier. Must own the rank-1 RESPONSIVE response on that solicitation."
      - name: contract_number
        type: string
        source: input
        description: "Cooperative contract number cited by members in their audit files."
        constraints: "unique across MasterContract; 1..40 chars"
      - name: status
        type: enum
        source: computed
        description: "Execution dimension of the contract lifecycle."
        default: PENDING_EXECUTION
        constraints: "one of {PENDING_EXECUTION, ACTIVE, SUSPENDED, EXPIRED, TERMINATED}"
      - name: compliance_posture
        type: enum
        source: computed
        description: "Independent remittance-health dimension derived from this contract's UsageReport fee_status values (calculations.contract_compliance_posture). Gates member usage recording."
        default: COMPLIANT
        constraints: "one of {COMPLIANT, WATCH, DELINQUENT}"
      - name: admin_fee_rate_bps
        type: integer
        source: input
        description: "Administrative fee the supplier remits to the cooperative, in basis points of the chargeable base."
        constraints: "1..1000"
      - name: base_term_start
        type: datetime
        source: input
        description: "Inclusive start of the base term, ISO 8601 UTC."
      - name: base_term_end
        type: datetime
        source: input
        description: "Exclusive end of the base term; the term interval is half-open [base_term_start, base_term_end)."
      - name: current_term_end
        type: datetime
        source: computed
        description: "Exclusive end of the term including every approved RENEWAL; initialised to base_term_end."
      - name: max_renewals
        type: integer
        source: input
        description: "Maximum number of RENEWAL amendments the cooperative may approve on this contract."
        constraints: "0..5"
      - name: renewals_used
        type: integer
        source: computed
        description: "Count of ContractAmendment rows with amendment_type == RENEWAL and status == APPROVED on this contract."
        default: 0
      - name: price_escalation_cap_pct
        type: number
        source: input
        description: "Contractual ceiling on a single PRICE_ADJUSTMENT, as a fraction of the line item's base_unit_price_cents."
        constraints: "0.00..0.25 with 4 decimals"
      - name: discount_tiers
        type: array
        source: input
        description: "Ordered volume-discount ladder: objects { tier_index: integer, min_annual_spend_cents: integer, discount_pct: number }. tier_index ascending from 0, min_annual_spend_cents strictly ascending, entry 0 must have min_annual_spend_cents == 0."
        constraints: "1..5 entries; discount_pct 0.0000..0.2000 with 4 decimals"
      - name: permitted_add_ons
        type: array
        source: input
        description: "Permitted add-on catalogue: objects { code: string, rate_pct: number, cap_cents: integer }. code drawn from {FREIGHT, INSIDE_DELIVERY, TRAINING, INSTALLATION}; codes unique within the array."
        constraints: "0..4 entries; rate_pct 0.0000..0.2000; cap_cents >= 0"
      - name: nationwide_pricing_flag
        type: boolean
        source: input
        description: "True when the awarded price sheet applies to every member state without regional uplift."
        default: "true"
      - name: usage_chargeable_cents_total
        type: integer
        source: computed
        description: "Sum of chargeable_base_cents over ContractUsage rows on this contract with status IN {RECORDED, CONFIRMED}."
        default: 0
      - name: fee_assessed_cents_total
        type: integer
        source: computed
        description: "Sum of reported_fee_cents over this contract's UsageReport rows with status IN {ACCEPTED, RECONCILED}, plus every applied fee_true_up_cents. Left side of the fee-ledger invariant."
        default: 0
      - name: fee_remitted_cents_total
        type: integer
        source: computed
        description: "Sum of remitted_cents over this contract's UsageReport rows."
        default: 0
      - name: fee_outstanding_cents
        type: integer
        source: computed
        description: "fee_assessed_cents_total - fee_remitted_cents_total. Right side of the fee-ledger invariant."
        default: 0
      - name: delinquent_report_count
        type: integer
        source: computed
        description: "Count of this contract's UsageReport rows with fee_status == DELINQUENT; drives compliance_posture."
        default: 0

  - name: ContractLineItem
    parent: MasterContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> MasterContract.id; the contract whose price sheet carries this line."
      - name: sku
        type: string
        source: input
        description: "Catalogue number of the awarded item."
        constraints: "unique per contract_id; 1..40 chars"
      - name: item_description
        type: string
        source: input
        description: "Plain-language description printed on the price sheet."
      - name: unit_of_measure
        type: string
        source: input
        description: "Billing unit, e.g. EACH or CASE."
        constraints: "one of {EACH, CASE, PALLET, HOUR}"
      - name: base_unit_price_cents
        type: integer
        source: input
        description: "Awarded nationwide unit price in cents before member discount; mutated by an approved PRICE_ADJUSTMENT."
        constraints: ">= 1"
      - name: price_floor_cents
        type: integer
        source: input
        description: "Contractual price floor in cents; net_unit_price_cents can never fall below it."
        constraints: ">= 0 and <= base_unit_price_cents"
      - name: origin
        type: enum
        source: computed
        description: "AWARD for lines created on the original price sheet, EXPANSION for lines created by an approved PRODUCT_LINE_EXPANSION amendment."
        default: AWARD
        constraints: "one of {AWARD, EXPANSION}"
      - name: status
        type: enum
        source: computed
        description: "Availability of this line for member usage."
        default: ACTIVE
        constraints: "one of {ACTIVE, WITHDRAWN}"
      - name: price_effective_from
        type: datetime
        source: computed
        description: "Logical-clock instant from which base_unit_price_cents applies; initialised to the contract's base_term_start."
      - name: last_price_change_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent approved PRICE_ADJUSTMENT on this line; null until the first one. Anchor of the PRICE_STABILITY_BUFFER_DAYS window."
      - name: price_change_count
        type: integer
        source: computed
        description: "Number of approved PRICE_ADJUSTMENT amendments applied to this line."
        default: 0

  - name: MemberAgency
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the participating agency."
        constraints: "unique across MemberAgency; 1..200 chars"
      - name: state_code
        type: string
        source: input
        description: "State whose procurement law governs this member; resolves to StateLawRule.state_code by exact string match (natural key, not a UUID foreign key). Must already exist as a StateLawRule row."
        constraints: "exactly 2 uppercase letters"
      - name: member_category
        type: enum
        source: input
        description: "Eligibility category asserted at registration; NONPROFIT_501C3 requires extra evidence and unlocks NONPROFIT_EXTRA_DISCOUNT_PCT."
        constraints: "one of {STATE_AGENCY, CITY, COUNTY, K12_DISTRICT, HIGHER_ED, SPECIAL_DISTRICT, NONPROFIT_501C3}"
      - name: registration_status
        type: enum
        source: computed
        description: "Registration and eligibility dimension; cycles PENDING_VERIFICATION -> DOCS_REQUESTED -> PENDING_VERIFICATION and ACTIVE -> SUSPENDED -> ACTIVE."
        default: PENDING_VERIFICATION
        constraints: "one of {PENDING_VERIFICATION, DOCS_REQUESTED, ACTIVE, SUSPENDED, TERMINATED}"
      - name: governing_body_resolution_number
        type: string
        source: input
        description: "Resolution number by which the member's governing body joined the cooperative; required for every category except NONPROFIT_501C3."
        default: "null"
      - name: irs_determination_letter_number
        type: string
        source: input
        description: "IRS 501(c)(3) determination letter number; required when member_category == NONPROFIT_501C3."
        default: "null"
      - name: annual_spend_ceiling_cents
        type: integer
        source: input
        description: "Board-approved ceiling on this member's cumulative cooperative spend in cents."
        constraints: ">= 1"
      - name: committed_spend_cents
        type: integer
        source: computed
        description: "Sum of total_cents over ContractUsage rows with member_agency_id == this MemberAgency.id and status IN {RECORDED, CONFIRMED}. Conserved quantity of the committed-spend invariant and the discount-tier key."
        default: 0
      - name: docs_request_count
        type: integer
        source: computed
        description: "Number of completed REQUEST_DOCS -> RESUBMIT_DOCS cycles; capped at MAX_DOCS_REQUEST_ROUNDS."
        default: 0
      - name: verified_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the VERIFY that moved registration_status to ACTIVE; null before then."
      - name: verified_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the CoopAdministrator who verified eligibility."

  - name: PiggybackAnalysis
    parent: null
    common_fields: true
    fields:
      - name: member_agency_id
        type: string
        source: input
        description: "FK -> MemberAgency.id; the agency asking whether it may piggyback."
      - name: contract_id
        type: string
        source: input
        description: "FK -> MasterContract.id; the cooperative contract under analysis."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the authority opinion; DETERMINED splits into three determinations, and cross-entity events VOID it."
        default: PENDING
        constraints: "one of {PENDING, DETERMINED, VOIDED}"
      - name: determination
        type: enum
        source: computed
        description: "Banding of authority_score at determination time; null while status == PENDING."
        constraints: "one of {AUTHORIZED, CONDITIONAL, DENIED} or null"
      - name: doctrine_applied
        type: enum
        source: computed
        description: "Value of StateLawRule.piggyback_doctrine for the member's state, frozen at determination; selects the scoring variant."
        constraints: "one of {STATUTORY_STRICT, RECIPROCITY_LIBERAL} or null"
      - name: authority_score
        type: number
        source: computed
        description: "Output of calculations.piggyback_authority; 2 decimals, floor 0.00, ceiling 100.00."
      - name: deduction_detail
        type: array
        source: computed
        description: "Ordered objects { reason_code: string, points: number } explaining authority_score, appended in the fixed evaluation order declared by calculations.piggyback_authority."
        default: "[]"
      - name: local_waiver_required
        type: boolean
        source: computed
        description: "True when the member's StateLawRule.requires_local_solicitation_waiver is true; frozen at determination."
        default: "false"
      - name: waiver_reference
        type: string
        source: input
        description: "Local governing-body waiver reference supplied by the member; must be non-null at determination when local_waiver_required is true."
        default: "null"
      - name: determined_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the DETERMINE action."
      - name: expires_on
        type: datetime
        source: computed
        description: "min(contract.current_term_end, determined_at + AUTHORITY_VALIDITY_DAYS days), frozen at determination; a later approved RENEWAL does NOT extend it."
      - name: voided_reason
        type: enum
        source: computed
        description: "Why the opinion was voided."
        constraints: "one of {MEMBER_SUSPENDED, MEMBER_TERMINATED, CONTRACT_SUSPENDED, CONTRACT_TERMINATED, SUPERSEDED_BY_NEWER_ANALYSIS, ADMIN_VOID} or null"

  - name: ContractUsage
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> MasterContract.id; the contract the member purchased under."
      - name: member_agency_id
        type: string
        source: input
        description: "FK -> MemberAgency.id; the purchasing member."
      - name: line_item_id
        type: string
        source: input
        description: "FK -> ContractLineItem.id; the purchased line. Must belong to contract_id and be ACTIVE."
      - name: piggyback_analysis_id
        type: string
        source: input
        description: "FK -> PiggybackAnalysis.id; the authority opinion relied on. Must be DETERMINED with determination IN {AUTHORIZED, CONDITIONAL} and cover this member/contract pair."
      - name: usage_report_id
        type: string
        source: computed
        description: "FK -> UsageReport.id; set when a supplier report sweeps this usage into its period; null until then and cleared when the usage is retracted."
        default: "null"
      - name: status
        type: enum
        source: computed
        description: "RECORDED on creation, CONFIRMED once the member confirms receipt, RETRACTED by the compensating action."
        default: RECORDED
        constraints: "one of {RECORDED, CONFIRMED, RETRACTED}"
      - name: quantity
        type: integer
        source: input
        description: "Units purchased."
        constraints: ">= 1"
      - name: add_on_codes
        type: array
        source: input
        description: "Add-on codes elected on this order; every code must appear in the contract's permitted_add_ons."
        default: "[]"
      - name: ordered_at
        type: datetime
        source: computed
        description: "Logical-clock instant of creation; the sweep key for report periods."
      - name: discount_tier_index
        type: integer
        source: computed
        description: "tier_index of the discount_tiers entry selected from the member's committed_spend_cents snapshot taken BEFORE this usage is added."
      - name: net_unit_price_cents
        type: integer
        source: computed
        description: "Output of calculations.net_unit_price; frozen at creation."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "net_unit_price_cents * quantity."
      - name: add_on_detail
        type: array
        source: computed
        description: "Ordered objects { code: string, raw_cents: integer, capped_cents: integer } in the order the codes appear in the contract's permitted_add_ons array."
        default: "[]"
      - name: add_on_charges_cents
        type: integer
        source: computed
        description: "Output of calculations.add_on_charges after the aggregate cap."
        default: 0
      - name: chargeable_base_cents
        type: integer
        source: computed
        description: "subtotal_cents + add_on_charges_cents; the administrative-fee base."
      - name: effective_fee_rate_bps
        type: integer
        source: computed
        description: "Tier-rebated administrative fee rate applied to this usage, in basis points."
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "Per-usage administrative fee at effective_fee_rate_bps; the AUDITED variant summand of calculations.admin_fee_assessment."
      - name: total_cents
        type: integer
        source: computed
        description: "chargeable_base_cents + admin_fee_cents; what the member's committed_spend_cents is debited by."
      - name: retracted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of RETRACT; null otherwise."

  - name: UsageReport
    parent: MasterContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> MasterContract.id; the contract this period report covers."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the reporting period, ISO 8601 UTC."
      - name: period_end
        type: datetime
        source: input
        description: "Inclusive end of the reporting period; the period interval is CLOSED [period_start, period_end], so two periods that touch at a single instant overlap."
      - name: status
        type: enum
        source: computed
        description: "Report-acceptance dimension; REJECTED reports cycle back to DRAFT for resubmission."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, RECONCILED, REJECTED}"
      - name: fee_status
        type: enum
        source: computed
        description: "Independent remittance dimension advancing NOT_DUE -> DUE -> PAID, with DUE -> DELINQUENT when the sweep runs past fee_due_at."
        default: NOT_DUE
        constraints: "one of {NOT_DUE, DUE, PAID, DELINQUENT}"
      - name: swept_usage_count
        type: integer
        source: computed
        description: "Count of ContractUsage rows swept into this report at SUBMIT."
        default: 0
      - name: reported_chargeable_cents
        type: integer
        source: computed
        description: "Sum of chargeable_base_cents over the swept usages; the REPORTED-variant fee base."
        default: 0
      - name: reported_usage_cents
        type: integer
        source: computed
        description: "Sum of total_cents over the swept usages; the figure printed on the member usage statement."
        default: 0
      - name: reported_fee_cents
        type: integer
        source: computed
        description: "REPORTED variant of calculations.admin_fee_assessment: contract base rate applied once to reported_chargeable_cents."
        default: 0
      - name: audited_fee_cents
        type: integer
        source: computed
        description: "AUDITED variant of calculations.admin_fee_assessment: sum of the swept usages' admin_fee_cents. Null until RECONCILE."
      - name: fee_true_up_cents
        type: integer
        source: computed
        description: "audited_fee_cents - reported_fee_cents, signed; applied to the contract and supplier fee ledgers at RECONCILE. Null until then."
      - name: variance_pct
        type: number
        source: computed
        description: "round(100 * abs(fee_true_up_cents) / audited_fee_cents, 2); null until RECONCILE, and 0.00 when audited_fee_cents == 0."
      - name: variance_flagged
        type: boolean
        source: computed
        description: "True when variance_pct > MAX_REPORT_VARIANCE_PCT at RECONCILE; charges VARIANCE_DEDUCTION_POINTS against the supplier."
        default: "false"
      - name: accepted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of ACCEPT; the fee_due_at anchor."
      - name: fee_due_at
        type: datetime
        source: computed
        description: "accepted_at + FEE_DUE_DAYS days; null before ACCEPT."
      - name: fee_rebate_cents
        type: integer
        source: computed
        description: "reported_chargeable_cents * base rate minus the tier-rebated per-usage fees, i.e. the cooperative's tier concession; informational, equals -1 * fee_true_up_cents when no rounding divergence exists."
      - name: remitted_cents
        type: integer
        source: computed
        description: "Cash actually remitted against this report."
        default: 0
      - name: rejection_reason
        type: string
        source: input
        description: "Administrator's note recorded on REJECT."
        default: "null"

  - name: ContractAmendment
    parent: MasterContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> MasterContract.id; the contract being amended."
      - name: amendment_type
        type: enum
        source: input
        description: "Selects which optional payload block is required and which target the approval mutates."
        constraints: "one of {RENEWAL, PRICE_ADJUSTMENT, PRODUCT_LINE_EXPANSION}"
      - name: status
        type: enum
        source: computed
        description: "Approval lifecycle of the amendment."
        default: PROPOSED
        constraints: "one of {PROPOSED, APPROVED, REJECTED, WITHDRAWN}"
      - name: target_line_item_id
        type: string
        source: input
        description: "FK -> ContractLineItem.id; the repriced line. Required when amendment_type == PRICE_ADJUSTMENT, must be null otherwise."
        default: "null"
      - name: new_unit_price_cents
        type: integer
        source: input
        description: "Requested unit price in cents. Required when amendment_type == PRICE_ADJUSTMENT, must be null otherwise."
        default: "null"
      - name: price_index
        type: enum
        source: input
        description: "Published index cited to justify the escalation. Required when amendment_type == PRICE_ADJUSTMENT, must be null otherwise."
        default: "null"
        constraints: "one of {CPI_U, PPI_COMMODITY} or null"
      - name: index_change_pct
        type: number
        source: input
        description: "Published change in the cited index as a fraction. Required when amendment_type == PRICE_ADJUSTMENT, must be null otherwise."
        default: "null"
        constraints: "0.0000..1.0000 with 4 decimals"
      - name: requested_term_end
        type: datetime
        source: input
        description: "Requested new exclusive term end. Required when amendment_type == RENEWAL, must be null otherwise."
        default: "null"
      - name: new_line_items
        type: array
        source: input
        description: "Lines to add: objects { sku: string, item_description: string, unit_of_measure: string, base_unit_price_cents: integer, price_floor_cents: integer }. Required and non-empty when amendment_type == PRODUCT_LINE_EXPANSION, must be null otherwise."
        default: "null"
      - name: expansion_scope_overlap_pct
        type: number
        source: input
        description: "Share of the requested lines that fall inside the original solicitation's specification scope, as a fraction. Required when amendment_type == PRODUCT_LINE_EXPANSION, must be null otherwise."
        default: "null"
        constraints: "0.0000..1.0000 with 4 decimals"
      - name: price_ceiling_cents
        type: integer
        source: computed
        description: "Output of calculations.price_adjustment_ceiling; the highest price the escalation caps allow. Null for non-PRICE_ADJUSTMENT rows."
      - name: effective_from
        type: datetime
        source: computed
        description: "Logical-clock instant of APPROVE; the new price_effective_from / renewal anchor."
      - name: proposed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the SupplierRepresentative who proposed the amendment."
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the CoopAdministrator who approved or rejected the amendment."
      - name: decision_note
        type: string
        source: input
        description: "Administrator's note recorded on APPROVE or REJECT."
        default: "null"

  - name: MemberComplaint
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> MasterContract.id; the contract complained about. Its supplier absorbs any performance deduction."
      - name: member_agency_id
        type: string
        source: input
        description: "FK -> MemberAgency.id; the complaining member."
      - name: related_usage_id
        type: string
        source: input
        description: "FK -> ContractUsage.id; the order the complaint concerns. Optional, but when present must belong to the same contract_id and member_agency_id."
        default: "null"
      - name: severity
        type: enum
        source: input
        description: "Severity asserted at intake; selects DEDUCTION_POINTS_BY_SEVERITY."
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: category
        type: enum
        source: input
        description: "Subject area of the complaint."
        constraints: "one of {PRICING, DELIVERY, PRODUCT_QUALITY, BILLING, SERVICE}"
      - name: narrative
        type: string
        source: input
        description: "Member's description of the problem."
        constraints: "1..2000 chars"
      - name: status
        type: enum
        source: computed
        description: "Complaint lifecycle: fork at investigation, then an appeal loop after substantiation."
        default: INTAKE
        constraints: "one of {INTAKE, UNDER_INVESTIGATION, SUBSTANTIATED, DISMISSED, APPEALED, OVERTURNED, CLOSED}"
      - name: deduction_points
        type: number
        source: computed
        description: "Points charged against the supplier when this complaint was SUBSTANTIATED; retained after OVERTURNED for audit but no longer counted in Supplier.deduction_points_total."
      - name: points_reversed
        type: boolean
        source: computed
        description: "True once an OVERTURN has restored deduction_points to the supplier."
        default: "false"
      - name: investigator_user_id
        type: string
        source: computed
        description: "X-User-ID of the CoopAdministrator who opened the investigation."
      - name: adjudicator_user_id
        type: string
        source: computed
        description: "X-User-ID of the CoopAdministrator who substantiated or dismissed the complaint. Segregation of duties forbids this equalling investigator_user_id."
      - name: appeal_filed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of FILE_APPEAL; null otherwise."
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: "Substantiation instant + APPEAL_WINDOW_DAYS days; the last instant at which FILE_APPEAL is accepted."
      - name: substantiated_at
        type: datetime
        source: computed
        description: "Logical-clock instant of SUBSTANTIATE; null otherwise."

state_machines:
  - entity: Solicitation
    state_field: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [AWARDED, FAILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /coop/solicitations/{id}/lifecycle with action=POST_NOTICE"
        actor: LeadAgencyOfficer
        preconditions:
          - "a StateLawRule row exists whose state_code == solicitation.lead_agency_state_code"
          - "response_due_at > logical clock now"
          - "technical_weight_pct + price_weight_pct == 100"
        side_effects:
          - "sets posted_at = logical clock now"
          - "sets notice_days = floor((response_due_at - posted_at) / 86400 seconds), frozen thereafter"
          - "sets addenda_count = 0"
      - from: POSTED
        to: EVALUATION
        trigger: "POST /coop/solicitations/{id}/lifecycle with action=OPEN_EVALUATION"
        actor: LeadAgencyOfficer
        preconditions:
          - "logical clock now >= response_due_at"
        side_effects:
          - "no further SolicitationResponse may be created for this solicitation (enforced by ERR_SOLICITATION_CLOSED_FOR_RESPONSES)"
      - from: EVALUATION
        to: AWARD_PENDING
        trigger: "POST /coop/solicitations/{id}/lifecycle with action=RECOMMEND_AWARD"
        actor: LeadAgencyOfficer
        preconditions:
          - "responsive_response_count >= MIN_RESPONSIVE_RESPONSES"
          - "every SolicitationResponse with status == RESPONSIVE has a non-null technical_score"
        side_effects:
          - "runs calculations.composite_score over every RESPONSIVE response: writes price_score, composite_score and award_rank on each"
          - "sets recommended_by_user_id = X-User-ID"
          - "if audit_package_status IN {ASSEMBLED, CERTIFIED} it becomes STALE"
        note: "First branch of the EVALUATION fork; the side-effect set is disjoint from the FAILED branch."
      - from: EVALUATION
        to: FAILED
        trigger: "POST /coop/solicitations/{id}/lifecycle with action=FAIL"
        actor: LeadAgencyOfficer
        preconditions:
          - "responsive_response_count < MIN_RESPONSIVE_RESPONSES"
        side_effects:
          - "every SolicitationResponse with status IN {SUBMITTED, INFO_REQUESTED} becomes NON_RESPONSIVE"
          - "no composite_score, price_score or award_rank is written on any response"
          - "if audit_package_status IN {ASSEMBLED, CERTIFIED} it becomes STALE"
        note: "Second branch of the EVALUATION fork; both branches rejoin at the audit-package dimension."
      - from: AWARD_PENDING
        to: AWARDED
        trigger: "POST /coop/solicitations/{id}/lifecycle with action=AWARD"
        actor: LeadAgencyOfficer
        preconditions:
          - "X-User-ID != recommended_by_user_id (segregation of duties)"
          - "the rank-1 RESPONSIVE response's supplier has qualification_status == QUALIFIED"
        side_effects:
          - "sets awarded_by_user_id = X-User-ID"
          - "unlocks MasterContract creation for the rank-1 response's supplier_id"
          - "if audit_package_status IN {ASSEMBLED, CERTIFIED} it becomes STALE"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /coop/solicitations/{id}/lifecycle with action=CANCEL"
        actor: LeadAgencyOfficer
        preconditions: ["no MasterContract references this solicitation_id"]
        side_effects: ["no responses exist to cascade to"]
      - from: POSTED
        to: CANCELLED
        trigger: "POST /coop/solicitations/{id}/lifecycle with action=CANCEL"
        actor: LeadAgencyOfficer
        preconditions: ["no MasterContract references this solicitation_id"]
        side_effects: ["every SolicitationResponse with status IN {SUBMITTED, INFO_REQUESTED} becomes WITHDRAWN"]
      - from: EVALUATION
        to: CANCELLED
        trigger: "POST /coop/solicitations/{id}/lifecycle with action=CANCEL"
        actor: LeadAgencyOfficer
        preconditions: ["no MasterContract references this solicitation_id"]
        side_effects:
          - "every SolicitationResponse with status IN {SUBMITTED, INFO_REQUESTED} becomes WITHDRAWN"
          - "responses already RESPONSIVE keep their status and scores for the audit file"

  - entity: Solicitation
    state_field: audit_package_status
    shape: parallel
    initial_state: NOT_ASSEMBLED
    terminal_states: []
    transitions:
      - from: NOT_ASSEMBLED
        to: ASSEMBLED
        trigger: "POST /coop/solicitations/{id}/audit-package with action=ASSEMBLE"
        actor: LeadAgencyOfficer
        preconditions: ["posted_at is not null"]
        side_effects:
          - "runs calculations.audit_package_completeness: writes audit_required_doc_codes, audit_present_doc_codes and audit_completeness_pct"
          - "if amendment_log_document_ref is supplied in the request body it is stored first, before the completeness recompute"
        note: "This dimension advances independently of status; a solicitation may sit in EVALUATION with an ASSEMBLED package."
      - from: ASSEMBLED
        to: ASSEMBLED
        trigger: "POST /coop/solicitations/{id}/audit-package with action=ASSEMBLE"
        actor: LeadAgencyOfficer
        preconditions: ["posted_at is not null"]
        side_effects: ["recomputes calculations.audit_package_completeness against current evidence"]
        note: "Re-assembly is explicitly idempotent in shape but not in value: the recomputed percentage may change."
      - from: STALE
        to: ASSEMBLED
        trigger: "POST /coop/solicitations/{id}/audit-package with action=ASSEMBLE"
        actor: LeadAgencyOfficer
        preconditions: ["posted_at is not null"]
        side_effects: ["recomputes calculations.audit_package_completeness against current evidence"]
      - from: ASSEMBLED
        to: CERTIFIED
        trigger: "POST /coop/solicitations/{id}/audit-package with action=CERTIFY"
        actor: LeadAgencyOfficer
        preconditions:
          - "audit_completeness_pct == 100.00"
          - "solicitation.status IN {AWARDED, FAILED}"
        side_effects:
          - "sets certified_at = logical clock now and certified_by_user_id = X-User-ID"
      - from: ASSEMBLED
        to: STALE
        trigger: "system: a ContractAmendment on this solicitation's MasterContract is APPROVED, or solicitation.status changes"
        actor: system
        preconditions: ["audit_package_status == ASSEMBLED"]
        side_effects: ["clears audit_completeness_pct to null so the stale figure cannot be cited"]
      - from: CERTIFIED
        to: STALE
        trigger: "system: a ContractAmendment on this solicitation's MasterContract is APPROVED, or solicitation.status changes"
        actor: system
        preconditions: ["audit_package_status == CERTIFIED"]
        side_effects:
          - "clears audit_completeness_pct to null"
          - "clears certified_at and certified_by_user_id so certification must be re-performed"

  - entity: SolicitationResponse
    state_field: status
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [NON_RESPONSIVE, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /coop/solicitation-responses/{id}/review with action=REQUEST_INFO"
        actor: LeadAgencyOfficer
        preconditions:
          - "parent solicitation.status == EVALUATION"
          - "info_request_rounds < MAX_INFO_REQUEST_ROUNDS"
        side_effects: ["stores responsiveness_note"]
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /coop/solicitation-responses/{id}/submission with action=RESUBMIT"
        actor: SupplierRepresentative
        preconditions:
          - "parent solicitation.status == EVALUATION"
          - "X-User-ID == response.supplier_id"
        side_effects: ["increments info_request_rounds by 1"]
        note: "Closes the SUBMITTED -> INFO_REQUESTED -> SUBMITTED cycle; the counter bounds it at MAX_INFO_REQUEST_ROUNDS iterations."
      - from: SUBMITTED
        to: RESPONSIVE
        trigger: "POST /coop/solicitation-responses/{id}/review with action=MARK_RESPONSIVE"
        actor: LeadAgencyOfficer
        preconditions:
          - "parent solicitation.status == EVALUATION"
          - "supplier.qualification_status == QUALIFIED"
          - "technical_score supplied in the request body, 0.00..100.00"
        side_effects:
          - "stores technical_score"
          - "increments parent solicitation.responsive_response_count by 1"
      - from: SUBMITTED
        to: NON_RESPONSIVE
        trigger: "POST /coop/solicitation-responses/{id}/review with action=MARK_NON_RESPONSIVE"
        actor: LeadAgencyOfficer
        preconditions: ["parent solicitation.status == EVALUATION"]
        side_effects: ["stores responsiveness_note"]
      - from: INFO_REQUESTED
        to: NON_RESPONSIVE
        trigger: "POST /coop/solicitation-responses/{id}/review with action=MARK_NON_RESPONSIVE"
        actor: LeadAgencyOfficer
        preconditions: ["parent solicitation.status == EVALUATION"]
        side_effects: ["stores responsiveness_note"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /coop/solicitation-responses/{id}/submission with action=WITHDRAW"
        actor: SupplierRepresentative
        preconditions:
          - "X-User-ID == response.supplier_id"
          - "parent solicitation.status IN {POSTED, EVALUATION}"
        side_effects: ["no score is ever written on a WITHDRAWN response"]
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /coop/solicitation-responses/{id}/submission with action=WITHDRAW"
        actor: SupplierRepresentative
        preconditions:
          - "X-User-ID == response.supplier_id"
          - "parent solicitation.status IN {POSTED, EVALUATION}"
        side_effects: ["no score is ever written on a WITHDRAWN response"]
      - from: RESPONSIVE
        to: NON_RESPONSIVE
        trigger: "POST /coop/solicitation-responses/{id}/review with action=MARK_NON_RESPONSIVE"
        actor: LeadAgencyOfficer
        preconditions:
          - "parent solicitation.status == EVALUATION"
        side_effects:
          - "decrements parent solicitation.responsive_response_count by 1"
          - "clears technical_score, price_score, composite_score and award_rank to null"

  - entity: Supplier
    state_field: qualification_status
    shape: branching
    initial_state: UNQUALIFIED
    terminal_states: [DEBARRED]
    transitions:
      - from: UNQUALIFIED
        to: QUALIFIED
        trigger: "POST /coop/suppliers/{id}/qualification with action=QUALIFY"
        actor: CoopAdministrator
        preconditions: ["a StateLawRule row exists whose state_code == supplier.home_state_code"]
        side_effects: ["supplier may now be named on SolicitationResponse rows"]
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /coop/suppliers/{id}/qualification with action=SUSPEND, or system when performance_tier becomes PROBATION"
        actor: CoopAdministrator | system
        preconditions: ["qualification_status == QUALIFIED"]
        side_effects:
          - "hop 1: every MasterContract with supplier_id == this supplier and status == ACTIVE becomes SUSPENDED"
          - "hop 2: each of those contract suspensions in turn sets every PiggybackAnalysis with that contract_id and status == DETERMINED to VOIDED with voided_reason = CONTRACT_SUSPENDED"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /coop/suppliers/{id}/qualification with action=REINSTATE"
        actor: CoopAdministrator
        preconditions: ["performance_tier != PROBATION"]
        side_effects:
          - "contracts remain SUSPENDED: each must be reinstated explicitly through POST /coop/master-contracts/{id}/award-status"
          - "voided PiggybackAnalysis rows are NOT revived; members must request a fresh analysis"
      - from: QUALIFIED
        to: DEBARRED
        trigger: "POST /coop/suppliers/{id}/qualification with action=DEBAR"
        actor: CoopAdministrator
        preconditions: ["qualification_status IN {QUALIFIED, SUSPENDED}"]
        side_effects:
          - "hop 1: every MasterContract with supplier_id == this supplier and status IN {PENDING_EXECUTION, ACTIVE, SUSPENDED} becomes TERMINATED"
          - "hop 2: each termination in turn voids that contract's DETERMINED PiggybackAnalysis rows with voided_reason = CONTRACT_TERMINATED"
      - from: SUSPENDED
        to: DEBARRED
        trigger: "POST /coop/suppliers/{id}/qualification with action=DEBAR"
        actor: CoopAdministrator
        preconditions: ["qualification_status IN {QUALIFIED, SUSPENDED}"]
        side_effects:
          - "hop 1: every MasterContract with supplier_id == this supplier and status IN {PENDING_EXECUTION, ACTIVE, SUSPENDED} becomes TERMINATED"
          - "hop 2: each termination in turn voids that contract's DETERMINED PiggybackAnalysis rows with voided_reason = CONTRACT_TERMINATED"

  - entity: MasterContract
    state_field: status
    shape: branching
    initial_state: PENDING_EXECUTION
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: PENDING_EXECUTION
        to: ACTIVE
        trigger: "POST /coop/master-contracts/{id}/award-status with action=EXECUTE"
        actor: CoopAdministrator
        preconditions:
          - "supplier.qualification_status == QUALIFIED"
          - "solicitation.status == AWARDED"
          - "at least one ContractLineItem with contract_id == this contract and status == ACTIVE exists"
          - "logical clock now < base_term_end"
        side_effects:
          - "sets price_effective_from = base_term_start on every ACTIVE ContractLineItem of this contract"
          - "sets current_term_end = base_term_end if it is still null"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /coop/master-contracts/{id}/award-status with action=SUSPEND, or system from a supplier suspension or from compliance_posture becoming DELINQUENT"
        actor: CoopAdministrator | system
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "every PiggybackAnalysis with this contract_id and status == DETERMINED becomes VOIDED with voided_reason = CONTRACT_SUSPENDED"
          - "no new ContractUsage may be recorded (ERR_CONTRACT_NOT_ACTIVE)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /coop/master-contracts/{id}/award-status with action=REINSTATE"
        actor: CoopAdministrator
        preconditions:
          - "compliance_posture != DELINQUENT"
          - "supplier.qualification_status == QUALIFIED"
          - "logical clock now < current_term_end"
        side_effects: ["voided PiggybackAnalysis rows are not revived"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /coop/master-contracts/{id}/award-status with action=EXPIRE (administrator closes a lapsed contract)"
        actor: CoopAdministrator
        preconditions: ["logical clock now >= current_term_end"]
        side_effects: ["every PiggybackAnalysis with this contract_id and status == DETERMINED becomes VOIDED with voided_reason = CONTRACT_TERMINATED"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /coop/master-contracts/{id}/award-status with action=EXPIRE"
        actor: CoopAdministrator
        preconditions: ["logical clock now >= current_term_end"]
        side_effects: ["no further amendment may be proposed"]
      - from: PENDING_EXECUTION
        to: TERMINATED
        trigger: "POST /coop/master-contracts/{id}/award-status with action=TERMINATE, or system from supplier debarment"
        actor: CoopAdministrator | system
        preconditions: ["status IN {PENDING_EXECUTION, ACTIVE, SUSPENDED}"]
        side_effects: ["every ContractLineItem of this contract becomes WITHDRAWN"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /coop/master-contracts/{id}/award-status with action=TERMINATE, or system from supplier debarment"
        actor: CoopAdministrator | system
        preconditions: ["status IN {PENDING_EXECUTION, ACTIVE, SUSPENDED}"]
        side_effects:
          - "every ContractLineItem of this contract becomes WITHDRAWN"
          - "every PiggybackAnalysis with this contract_id and status == DETERMINED becomes VOIDED with voided_reason = CONTRACT_TERMINATED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /coop/master-contracts/{id}/award-status with action=TERMINATE, or system from supplier debarment"
        actor: CoopAdministrator | system
        preconditions: ["status IN {PENDING_EXECUTION, ACTIVE, SUSPENDED}"]
        side_effects:
          - "every ContractLineItem of this contract becomes WITHDRAWN"
          - "every PiggybackAnalysis with this contract_id and status == DETERMINED becomes VOIDED with voided_reason = CONTRACT_TERMINATED"

  - entity: MasterContract
    state_field: compliance_posture
    shape: compound
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: WATCH
        trigger: "system: calculations.contract_compliance_posture re-runs after any UsageReport.fee_status change on this contract"
        actor: system
        preconditions: ["delinquent_report_count == 1 AND the sum of (reported_fee_cents - remitted_cents) over this contract's DELINQUENT reports < DELINQUENCY_AMOUNT_THRESHOLD_CENTS"]
        side_effects: ["ContractUsage creation is still permitted under WATCH"]
      - from: WATCH
        to: DELINQUENT
        trigger: "system: calculations.contract_compliance_posture re-runs after any UsageReport.fee_status change on this contract"
        actor: system
        preconditions: ["delinquent_report_count >= DELINQUENCY_COUNT_THRESHOLD OR the sum of (reported_fee_cents - remitted_cents) over this contract's DELINQUENT reports >= DELINQUENCY_AMOUNT_THRESHOLD_CENTS"]
        side_effects:
          - "hop (COUNT trigger only, i.e. delinquent_report_count >= DELINQUENCY_COUNT_THRESHOLD): this posture change in turn drives contract.status ACTIVE -> SUSPENDED, whose own side effects void the contract's DETERMINED PiggybackAnalysis rows"
          - "when the posture reached DELINQUENT on the amount test alone with a single delinquent report, the contract stays ACTIVE and only the posture gate blocks new usage"
      - from: COMPLIANT
        to: DELINQUENT
        trigger: "system: calculations.contract_compliance_posture re-runs after any UsageReport.fee_status change on this contract"
        actor: system
        preconditions: ["delinquent_report_count == 1 AND the sum of (reported_fee_cents - remitted_cents) over this contract's DELINQUENT reports >= DELINQUENCY_AMOUNT_THRESHOLD_CENTS"]
        side_effects:
          - "contract.status is NOT changed: an amount-triggered DELINQUENT posture on a single report leaves the contract ACTIVE, and ContractUsage creation is blocked by the posture gate (ERR_CONTRACT_POSTURE_DELINQUENT) rather than by the status gate"
          - "DETERMINED PiggybackAnalysis rows are NOT voided, because no suspension occurs"
        note: "A single large delinquency skips WATCH entirely; the amount test uses >= so exactly DELINQUENCY_AMOUNT_THRESHOLD_CENTS is DELINQUENT. Only the COUNT trigger (>= DELINQUENCY_COUNT_THRESHOLD reports) suspends the contract."
      - from: DELINQUENT
        to: WATCH
        trigger: "system: re-run after a DELINQUENT UsageReport is remitted"
        actor: system
        preconditions: ["delinquent_report_count == 1 AND outstanding delinquent amount < DELINQUENCY_AMOUNT_THRESHOLD_CENTS"]
        side_effects: ["contract.status stays SUSPENDED until an explicit REINSTATE"]
      - from: DELINQUENT
        to: COMPLIANT
        trigger: "system: re-run after a DELINQUENT UsageReport is remitted"
        actor: system
        preconditions: ["delinquent_report_count == 0"]
        side_effects: ["contract.status stays SUSPENDED until an explicit REINSTATE"]
      - from: WATCH
        to: COMPLIANT
        trigger: "system: re-run after a DELINQUENT UsageReport is remitted"
        actor: system
        preconditions: ["delinquent_report_count == 0"]
        side_effects: ["no cascade; the contract was never suspended for WATCH"]

  - entity: MemberAgency
    state_field: registration_status
    shape: cyclic
    initial_state: PENDING_VERIFICATION
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_VERIFICATION
        to: DOCS_REQUESTED
        trigger: "POST /coop/member-agencies/{id}/registration with action=REQUEST_DOCS"
        actor: CoopAdministrator
        preconditions: ["docs_request_count < MAX_DOCS_REQUEST_ROUNDS"]
        side_effects: ["member may not record usage while in DOCS_REQUESTED"]
      - from: DOCS_REQUESTED
        to: PENDING_VERIFICATION
        trigger: "POST /coop/member-agencies/{id}/registration with action=RESUBMIT_DOCS"
        actor: CoopAdministrator
        preconditions: ["registration_status == DOCS_REQUESTED"]
        side_effects:
          - "increments docs_request_count by 1"
          - "stores any supplied governing_body_resolution_number / irs_determination_letter_number"
        note: "Closes the PENDING_VERIFICATION -> DOCS_REQUESTED -> PENDING_VERIFICATION cycle, bounded by MAX_DOCS_REQUEST_ROUNDS."
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /coop/member-agencies/{id}/registration with action=VERIFY"
        actor: CoopAdministrator
        preconditions:
          - "a StateLawRule row exists whose state_code == member.state_code"
          - "if member_category == NONPROFIT_501C3 then irs_determination_letter_number is not null AND that StateLawRule.allows_nonprofit_participation is true"
          - "if member_category != NONPROFIT_501C3 then governing_body_resolution_number is not null"
        side_effects:
          - "sets verified_at = logical clock now and verified_by_user_id = X-User-ID"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /coop/member-agencies/{id}/registration with action=SUSPEND"
        actor: CoopAdministrator
        preconditions: ["registration_status == ACTIVE"]
        side_effects:
          - "every PiggybackAnalysis with this member_agency_id and status == DETERMINED becomes VOIDED with voided_reason = MEMBER_SUSPENDED"
          - "committed_spend_cents is NOT released; existing usages stand"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /coop/member-agencies/{id}/registration with action=REINSTATE"
        actor: CoopAdministrator
        preconditions: ["registration_status == SUSPENDED"]
        side_effects: ["voided PiggybackAnalysis rows are not revived; a fresh analysis is required before new usage"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /coop/member-agencies/{id}/registration with action=TERMINATE"
        actor: CoopAdministrator
        preconditions: ["registration_status IN {PENDING_VERIFICATION, DOCS_REQUESTED, ACTIVE, SUSPENDED}"]
        side_effects: ["every PiggybackAnalysis with this member_agency_id and status IN {PENDING, DETERMINED} becomes VOIDED with voided_reason = MEMBER_TERMINATED"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /coop/member-agencies/{id}/registration with action=TERMINATE"
        actor: CoopAdministrator
        preconditions: ["registration_status IN {PENDING_VERIFICATION, DOCS_REQUESTED, ACTIVE, SUSPENDED}"]
        side_effects: ["every PiggybackAnalysis with this member_agency_id and status IN {PENDING, DETERMINED} becomes VOIDED with voided_reason = MEMBER_TERMINATED"]
      - from: PENDING_VERIFICATION
        to: TERMINATED
        trigger: "POST /coop/member-agencies/{id}/registration with action=TERMINATE"
        actor: CoopAdministrator
        preconditions: ["registration_status IN {PENDING_VERIFICATION, DOCS_REQUESTED, ACTIVE, SUSPENDED}"]
        side_effects: ["every PiggybackAnalysis with this member_agency_id and status IN {PENDING, DETERMINED} becomes VOIDED with voided_reason = MEMBER_TERMINATED"]

  - entity: PiggybackAnalysis
    state_field: status
    shape: branching
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: DETERMINED
        trigger: "POST /coop/piggyback-analyses/{id}/determination with action=DETERMINE"
        actor: CoopAdministrator
        preconditions:
          - "member.registration_status == ACTIVE"
          - "contract.status == ACTIVE"
          - "if the member's StateLawRule.requires_local_solicitation_waiver is true then waiver_reference is not null"
        side_effects:
          - "freezes doctrine_applied = the member's StateLawRule.piggyback_doctrine"
          - "runs calculations.piggyback_authority: writes authority_score, deduction_detail, determination and local_waiver_required"
          - "sets determined_at = logical clock now and expires_on = min(contract.current_term_end, determined_at + AUTHORITY_VALIDITY_DAYS days)"
      - from: PENDING
        to: VOIDED
        trigger: "POST /coop/piggyback-analyses/{id}/determination with action=VOID, or system cascade from member/contract/supplier state changes, or supersession by a newer analysis for the same pair"
        actor: CoopAdministrator | system
        preconditions: ["status IN {PENDING, DETERMINED}"]
        side_effects: ["sets voided_reason"]
      - from: DETERMINED
        to: VOIDED
        trigger: "POST /coop/piggyback-analyses/{id}/determination with action=VOID, or system cascade from member/contract/supplier state changes, or supersession by a newer analysis for the same pair"
        actor: CoopAdministrator | system
        preconditions: ["status IN {PENDING, DETERMINED}"]
        side_effects:
          - "sets voided_reason"
          - "no new ContractUsage may cite this analysis (ERR_PIGGYBACK_NOT_AUTHORIZED)"
          - "ContractUsage rows already recorded under it are unaffected"

  - entity: ContractUsage
    state_field: status
    shape: branching
    initial_state: RECORDED
    terminal_states: [RETRACTED]
    transitions:
      - from: RECORDED
        to: RECORDED
        trigger: "POST /coop/contract-usages (creation)"
        actor: MemberRepresentative
        preconditions:
          - "member.registration_status == ACTIVE"
          - "contract.status == ACTIVE AND contract.compliance_posture IN {COMPLIANT, WATCH}"
          - "line item status == ACTIVE and belongs to contract_id"
          - "analysis status == DETERMINED, determination IN {AUTHORIZED, CONDITIONAL}, expires_on > logical clock now, and its member_agency_id/contract_id match this usage"
          - "member.committed_spend_cents + this usage's total_cents <= member.annual_spend_ceiling_cents"
        side_effects:
          - "runs calculations.net_unit_price, calculations.add_on_charges and calculations.member_usage_total in the pinned order"
          - "adds total_cents to member.committed_spend_cents"
          - "adds chargeable_base_cents to contract.usage_chargeable_cents_total"
        note: "Creation transition; the discount tier is read from the member's committed_spend_cents BEFORE this debit."
      - from: RECORDED
        to: CONFIRMED
        trigger: "POST /coop/contract-usages/{id}/disposition with action=CONFIRM"
        actor: MemberRepresentative
        preconditions:
          - "X-User-ID == usage.member_agency_id"
          - "status == RECORDED"
        side_effects: ["the usage becomes eligible for a supplier report sweep"]
      - from: RECORDED
        to: RETRACTED
        trigger: "POST /coop/contract-usages/{id}/disposition with action=RETRACT"
        actor: MemberRepresentative
        preconditions:
          - "X-User-ID == usage.member_agency_id"
          - "usage_report_id is null OR the referenced UsageReport.status IN {DRAFT, SUBMITTED, REJECTED}"
        side_effects:
          - "hop 1: subtracts total_cents from member.committed_spend_cents and chargeable_base_cents from contract.usage_chargeable_cents_total, and sets retracted_at"
          - "hop 2: that debit reversal in turn re-runs the sweep of the referenced UsageReport when usage_report_id was not null: swept_usage_count, reported_chargeable_cents, reported_usage_cents and reported_fee_cents are recomputed and usage_report_id is cleared"
          - "hop 3: the recomputed report figures in turn re-run calculations.contract_compliance_posture for the contract"
      - from: CONFIRMED
        to: RETRACTED
        trigger: "POST /coop/contract-usages/{id}/disposition with action=RETRACT"
        actor: MemberRepresentative
        preconditions:
          - "X-User-ID == usage.member_agency_id"
          - "usage_report_id is null OR the referenced UsageReport.status IN {DRAFT, SUBMITTED, REJECTED}"
        side_effects:
          - "hop 1: subtracts total_cents from member.committed_spend_cents and chargeable_base_cents from contract.usage_chargeable_cents_total, and sets retracted_at"
          - "hop 2: that debit reversal in turn re-runs the sweep of the referenced UsageReport when usage_report_id was not null"
          - "hop 3: the recomputed report figures in turn re-run calculations.contract_compliance_posture for the contract"
        note: "Compensating action of the creation transition; the committed-spend invariant must hold exactly afterwards."

  - entity: UsageReport
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /coop/usage-reports/{id}/submission with action=SUBMIT"
        actor: SupplierRepresentative
        preconditions:
          - "X-User-ID == contract.supplier_id"
          - "contract.status IN {ACTIVE, SUSPENDED, EXPIRED}"
          - "logical clock now > period_end"
          - "no other UsageReport on this contract with status IN {DRAFT, SUBMITTED, ACCEPTED, RECONCILED} has a closed period intersecting [period_start, period_end]"
        side_effects:
          - "runs calculations.report_period_sweep: sets swept_usage_count, reported_chargeable_cents, reported_usage_cents and stamps usage_report_id on each swept ContractUsage"
          - "runs the REPORTED variant of calculations.admin_fee_assessment: sets reported_fee_cents"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /coop/usage-reports/{id}/submission with action=SUBMIT"
        actor: SupplierRepresentative
        preconditions:
          - "X-User-ID == contract.supplier_id"
          - "logical clock now > period_end"
          - "no OTHER UsageReport on this contract with status IN {DRAFT, SUBMITTED, ACCEPTED, RECONCILED} has a closed period intersecting [period_start, period_end]"
        side_effects:
          - "re-runs calculations.report_period_sweep and the REPORTED fee variant against current usage data"
          - "clears rejection_reason"
        note: "Closes the SUBMITTED -> REJECTED -> SUBMITTED resubmission cycle; the overlap check excludes this report itself."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /coop/usage-reports/{id}/review with action=ACCEPT"
        actor: CoopAdministrator
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "sets accepted_at = logical clock now and fee_due_at = accepted_at + FEE_DUE_DAYS days"
          - "moves fee_status NOT_DUE -> DUE on the parallel dimension"
          - "adds reported_fee_cents to contract.fee_assessed_cents_total and to supplier.fee_assessed_cents_total, then recomputes contract.fee_outstanding_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /coop/usage-reports/{id}/review with action=REJECT"
        actor: CoopAdministrator
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "clears usage_report_id on every usage this report had swept"
          - "zeroes swept_usage_count, reported_chargeable_cents, reported_usage_cents and reported_fee_cents"
          - "stores rejection_reason"
      - from: ACCEPTED
        to: RECONCILED
        trigger: "POST /coop/usage-reports/{id}/review with action=RECONCILE"
        actor: CoopAdministrator
        preconditions:
          - "status == ACCEPTED"
          - "fee_status IN {PAID, DELINQUENT}"
        side_effects:
          - "runs the AUDITED variant of calculations.admin_fee_assessment: sets audited_fee_cents, fee_true_up_cents, fee_rebate_cents and variance_pct"
          - "applies fee_true_up_cents to contract.fee_assessed_cents_total and supplier.fee_assessed_cents_total, then recomputes contract.fee_outstanding_cents"
          - "hop 1: when variance_pct > MAX_REPORT_VARIANCE_PCT, sets variance_flagged = true and adds VARIANCE_DEDUCTION_POINTS to supplier.deduction_points_total"
          - "hop 2: that deduction in turn re-runs calculations.supplier_performance_score, rewriting performance_score and performance_tier"
          - "hop 3: a performance_tier of PROBATION in turn drives supplier.qualification_status QUALIFIED -> SUSPENDED, whose own side effects suspend the supplier's ACTIVE contracts and void their analyses"

  - entity: UsageReport
    state_field: fee_status
    shape: parallel
    initial_state: NOT_DUE
    terminal_states: [PAID]
    transitions:
      - from: NOT_DUE
        to: DUE
        trigger: "system: the report's status dimension reaches ACCEPTED"
        actor: system
        preconditions: ["status == ACCEPTED"]
        side_effects: ["fee_due_at becomes the delinquency deadline observed by the compliance sweep"]
      - from: DUE
        to: PAID
        trigger: "POST /coop/usage-reports/{id}/fee-remittance with action=REMIT"
        actor: SupplierRepresentative
        preconditions:
          - "X-User-ID == contract.supplier_id"
          - "amount_cents == reported_fee_cents - remitted_cents"
        side_effects:
          - "adds amount_cents to remitted_cents, to contract.fee_remitted_cents_total and to supplier.fee_remitted_cents_total"
          - "recomputes contract.fee_outstanding_cents"
      - from: DUE
        to: DELINQUENT
        trigger: "POST /coop/master-contracts/{id}/compliance-sweep (system pass over this contract's DUE reports)"
        actor: CoopAdministrator
        preconditions:
          - "fee_status == DUE"
          - "logical clock now > fee_due_at"
        side_effects:
          - "hop 1: increments contract.delinquent_report_count and supplier.delinquent_report_count by 1"
          - "hop 2: that counter change in turn re-runs calculations.contract_compliance_posture, moving compliance_posture COMPLIANT -> WATCH or -> DELINQUENT"
          - "hop 3: a resulting DELINQUENT posture reached on the COUNT trigger (delinquent_report_count >= DELINQUENCY_COUNT_THRESHOLD) in turn drives contract.status ACTIVE -> SUSPENDED"
          - "hop 4: that suspension in turn voids every DETERMINED PiggybackAnalysis on the contract with voided_reason = CONTRACT_SUSPENDED"
          - "adds DELINQUENCY_DEDUCTION_POINTS to supplier.deduction_points_total, which re-runs calculations.supplier_performance_score and performance_tier"
      - from: DELINQUENT
        to: PAID
        trigger: "POST /coop/usage-reports/{id}/fee-remittance with action=REMIT"
        actor: SupplierRepresentative
        preconditions:
          - "X-User-ID == contract.supplier_id"
          - "amount_cents == reported_fee_cents - remitted_cents"
        side_effects:
          - "adds amount_cents to remitted_cents, contract.fee_remitted_cents_total and supplier.fee_remitted_cents_total"
          - "decrements contract.delinquent_report_count and supplier.delinquent_report_count by 1, then re-runs calculations.contract_compliance_posture"
          - "subtracts DELINQUENCY_DEDUCTION_POINTS from supplier.deduction_points_total and re-runs calculations.supplier_performance_score"
        note: "Compensating action of the delinquency sweep; the performance-point invariant must hold exactly afterwards."

  - entity: ContractAmendment
    state_field: status
    shape: branching
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /coop/contract-amendments/{id}/decision with action=APPROVE"
        actor: CoopAdministrator
        preconditions:
          - "contract.status == ACTIVE"
          - "supplier.qualification_status == QUALIFIED"
          - "type-specific checks in validations priorities 32-46 all pass"
        side_effects:
          - "sets effective_from = logical clock now and decided_by_user_id = X-User-ID"
          - "RENEWAL branch: sets contract.current_term_end = requested_term_end and increments contract.renewals_used by 1"
          - "PRICE_ADJUSTMENT branch: sets the target ContractLineItem.base_unit_price_cents = new_unit_price_cents, price_effective_from = effective_from, last_price_change_at = effective_from, and increments its price_change_count by 1"
          - "PRODUCT_LINE_EXPANSION branch: creates one ContractLineItem per new_line_items entry with origin = EXPANSION and status = ACTIVE"
          - "in every branch: the solicitation's audit_package_status moves ASSEMBLED/CERTIFIED -> STALE and AMENDMENT_LOG joins audit_required_doc_codes on the next assemble"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /coop/contract-amendments/{id}/decision with action=REJECT"
        actor: CoopAdministrator
        preconditions: ["status == PROPOSED"]
        side_effects:
          - "sets decided_by_user_id = X-User-ID and stores decision_note"
          - "no contract or line-item field changes"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /coop/contract-amendments/{id}/withdrawal with action=WITHDRAW, or system supersession when the same supplier proposes a newer amendment of the same amendment_type on the same contract"
        actor: SupplierRepresentative | system
        preconditions: ["status == PROPOSED"]
        side_effects: ["no contract or line-item field changes"]

  - entity: MemberComplaint
    state_field: status
    shape: branching
    initial_state: INTAKE
    terminal_states: [DISMISSED, OVERTURNED, CLOSED]
    transitions:
      - from: INTAKE
        to: UNDER_INVESTIGATION
        trigger: "POST /coop/complaints/{id}/investigation with action=OPEN_INVESTIGATION"
        actor: CoopAdministrator
        preconditions: ["status == INTAKE"]
        side_effects: ["sets investigator_user_id = X-User-ID"]
      - from: UNDER_INVESTIGATION
        to: DISMISSED
        trigger: "POST /coop/complaints/{id}/investigation with action=DISMISS"
        actor: CoopAdministrator
        preconditions:
          - "status == UNDER_INVESTIGATION"
          - "X-User-ID != investigator_user_id (segregation of duties)"
        side_effects:
          - "sets adjudicator_user_id = X-User-ID"
          - "no supplier performance points are charged"
      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /coop/complaints/{id}/decision with action=SUBSTANTIATE"
        actor: CoopAdministrator
        preconditions:
          - "status == UNDER_INVESTIGATION"
          - "X-User-ID != investigator_user_id (segregation of duties)"
          - "the contract's supplier has qualification_status != DEBARRED"
        side_effects:
          - "sets adjudicator_user_id, substantiated_at = logical clock now, appeal_deadline_at = substantiated_at + APPEAL_WINDOW_DAYS days and deduction_points = DEDUCTION_POINTS_BY_SEVERITY[severity]"
          - "hop 1: adds deduction_points to supplier.deduction_points_total and increments supplier.substantiated_complaint_count"
          - "hop 2: that total in turn re-runs calculations.supplier_performance_score, rewriting performance_score and performance_tier"
          - "hop 3: a performance_tier of PROBATION in turn drives supplier.qualification_status QUALIFIED -> SUSPENDED"
          - "hop 4: that suspension in turn sets every ACTIVE MasterContract of the supplier to SUSPENDED"
          - "hop 5: each contract suspension in turn voids that contract's DETERMINED PiggybackAnalysis rows with voided_reason = CONTRACT_SUSPENDED"
      - from: SUBSTANTIATED
        to: APPEALED
        trigger: "POST /coop/complaints/{id}/appeal with action=FILE_APPEAL"
        actor: SupplierRepresentative
        preconditions:
          - "X-User-ID == contract.supplier_id"
          - "logical clock now <= appeal_deadline_at"
        side_effects: ["sets appeal_filed_at = logical clock now; deduction points remain charged during the appeal"]
      - from: APPEALED
        to: OVERTURNED
        trigger: "POST /coop/complaints/{id}/appeal-decision with action=OVERTURN"
        actor: CoopAdministrator
        preconditions:
          - "status == APPEALED"
          - "X-User-ID != adjudicator_user_id (segregation of duties)"
        side_effects:
          - "subtracts deduction_points from supplier.deduction_points_total, sets points_reversed = true and decrements supplier.substantiated_complaint_count"
          - "re-runs calculations.supplier_performance_score, restoring performance_score and performance_tier exactly"
          - "supplier.qualification_status is NOT auto-reinstated; an explicit REINSTATE is required"
        note: "Compensating action of SUBSTANTIATE; the performance-point invariant must hold exactly afterwards."
      - from: APPEALED
        to: CLOSED
        trigger: "POST /coop/complaints/{id}/appeal-decision with action=UPHOLD"
        actor: CoopAdministrator
        preconditions:
          - "status == APPEALED"
          - "X-User-ID != adjudicator_user_id (segregation of duties)"
        side_effects: ["deduction points stay charged; performance_score is unchanged"]
      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /coop/complaints/{id}/decision with action=CLOSE"
        actor: CoopAdministrator
        preconditions:
          - "status == SUBSTANTIATED"
          - "logical clock now > appeal_deadline_at"
        side_effects: ["deduction points stay charged permanently"]

concurrency_rules:
  - rule_id: piggyback-analysis-create-stale-member
    parent_entity: MemberAgency
    write_endpoint: "POST /coop/piggyback-analyses"
    occ_field: "expected_member_agency_version"
    description: |
      Creating a PiggybackAnalysis for a MemberAgency whose version has advanced
      since the client last read it is rejected. A new analysis for the same
      (member_agency_id, contract_id) pair legitimately supersedes the prior one
      by voiding it, so the create is a valid operation whenever the client's view
      of the member is current; the OCC check exists because the eligibility facts
      the analysis freezes (registration_status, member_category, state_code) live
      on the member row and may have been rewritten between the read and this write.
    error_id: ERR_STALE_MEMBER_AGENCY_VERSION
    http_status: 412

  - rule_id: amendment-create-stale-contract
    parent_entity: MasterContract
    write_endpoint: "POST /coop/contract-amendments"
    occ_field: "expected_contract_version"
    description: |
      Proposing a ContractAmendment against a MasterContract whose version has
      advanced since the client last read it is rejected. Proposing an amendment is
      legitimate at any time while the contract is ACTIVE and supersedes the
      supplier's prior PROPOSED amendment of the same amendment_type, so the write
      would otherwise succeed; the OCC check exists because the ceiling arithmetic
      (price_escalation_cap_pct, current_term_end, renewals_used) is read off the
      contract row the client believed it was amending.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

calculations:
  - name: net_unit_price
    trigger: "On ContractUsage creation (POST /coop/contract-usages) and on the read-only quote endpoint GET /coop/master-contracts/{id}/price-quote"
    algorithm: tiered_pricing
    formula: |
      # --- step 1: tier selection (three inputs interacting non-linearly) ---
      # spend_basis is the member's committed_spend_cents SNAPSHOT TAKEN BEFORE this usage is
      # added. On the quote endpoint it is the member's current committed_spend_cents.
      spend_basis_cents = member_agency.committed_spend_cents
      tier = the entry of contract.discount_tiers with the LARGEST min_annual_spend_cents
             such that min_annual_spend_cents <= spend_basis_cents
             # the ladder always contains a tier_index 0 entry with min_annual_spend_cents == 0,
             # so the candidate set is never empty; the comparison is >= on the threshold
             # (spend_basis_cents exactly equal to min_annual_spend_cents SELECTS that tier)
      discount_tier_index = tier.tier_index
      base_discount_pct  = tier.discount_pct

      # --- step 2: category bonus (conditional branch on a different entity's field) ---
      if member_agency.member_category == NONPROFIT_501C3:
          bonus_pct = NONPROFIT_EXTRA_DISCOUNT_PCT
      else:
          bonus_pct = 0.0000

      # --- step 3: nested min/max ---
      total_discount_pct = min(base_discount_pct + bonus_pct, MAX_TOTAL_DISCOUNT_PCT)
      raw_cents = ROUND_HALF_UP(line_item.base_unit_price_cents * (1 - total_discount_pct), 0)
      net_unit_price_cents = max(raw_cents, line_item.price_floor_cents)
    input_set: "Exactly one ContractLineItem (status == ACTIVE) and one MemberAgency (registration_status == ACTIVE) plus the MasterContract's discount_tiers array. No aggregation over other usages: the only cross-entity aggregate consumed is member_agency.committed_spend_cents, itself defined as the sum of total_cents over ContractUsage rows of that member with status IN {RECORDED, CONFIRMED}."
    constants:
      NONPROFIT_EXTRA_DISCOUNT_PCT: 0.0300
      MAX_TOTAL_DISCOUNT_PCT: 0.2000
    precision: "net_unit_price_cents is an integer number of cents; the multiplication is rounded to 0 decimals with ROUND_HALF_UP BEFORE the max() against price_floor_cents is applied, so the stored net price is always a whole cent value and never below the floor. The two nested bounds are independent: MAX_TOTAL_DISCOUNT_PCT caps the discount, price_floor_cents caps the resulting price, and either, both or neither may bind"

  - name: add_on_charges
    trigger: "On ContractUsage creation (POST /coop/contract-usages) and on GET /coop/master-contracts/{id}/price-quote, immediately after net_unit_price and subtotal_cents"
    algorithm: waterfall_allocation
    formula: |
      subtotal_cents = net_unit_price_cents * quantity

      # per-code charges are produced in the order the codes appear in
      # contract.permitted_add_ons (NOT the order the member listed them), so the
      # add_on_detail array and any remainder behaviour are order-deterministic
      add_on_detail = []
      for entry in contract.permitted_add_ons:            # array order = evaluation order
          if entry.code in usage.add_on_codes:
              raw_cents    = ROUND_HALF_UP(subtotal_cents * entry.rate_pct, 0)
              capped_cents = min(raw_cents, entry.cap_cents)      # per-code absolute cap
              add_on_detail.append({ code: entry.code, raw_cents: raw_cents,
                                     capped_cents: capped_cents })

      per_code_sum_cents  = sum(d.capped_cents for d in add_on_detail)
      aggregate_cap_cents = ROUND_HALF_UP(subtotal_cents * ADD_ON_AGGREGATE_CAP_PCT, 0)
      add_on_charges_cents = min(per_code_sum_cents, aggregate_cap_cents)
      # PINNED ROUNDING ORDER: round each per-code charge to whole cents, THEN apply the
      # per-code cap, THEN sum, THEN apply the aggregate cap. Summing un-rounded charges
      # and rounding once at the end is explicitly NOT the rule.
    input_set: "The MasterContract.permitted_add_ons array intersected with ContractUsage.add_on_codes; every elected code must exist in permitted_add_ons or the request is rejected with ERR_ADD_ON_NOT_PERMITTED before this calculation runs."
    constants:
      ADD_ON_AGGREGATE_CAP_PCT: 0.1500
    precision: "all cent amounts are integers; each per-code charge is rounded to 0 decimals with ROUND_HALF_UP before capping and summing"

  - name: member_usage_total
    trigger: "On ContractUsage creation (POST /coop/contract-usages) and on GET /coop/master-contracts/{id}/price-quote"
    algorithm: constraint_propagation
    formula: |
      # This total looks circular: the member's discount tier is keyed on
      # committed_spend_cents, and committed_spend_cents is itself the running sum of
      # total_cents. The evaluation order below is PINNED and makes the value well defined:
      # a usage never influences its own tier, and the debit happens last.
      #
      # STEP 1  tier_snapshot      = member_agency.committed_spend_cents   (BEFORE this usage)
      # STEP 2  net_unit_price_cents  = calculations.net_unit_price using tier_snapshot
      # STEP 3  subtotal_cents        = net_unit_price_cents * quantity
      # STEP 4  add_on_charges_cents  = calculations.add_on_charges
      # STEP 5  chargeable_base_cents = subtotal_cents + add_on_charges_cents
      # STEP 6  effective_fee_rate_bps =
      #             ROUND_HALF_UP(contract.admin_fee_rate_bps
      #                           * (1 - FEE_REBATE_BY_TIER[discount_tier_index]), 0)
      # STEP 7  admin_fee_cents = ROUND_HALF_UP(chargeable_base_cents
      #                                         * effective_fee_rate_bps / 10000, 0)
      # STEP 8  total_cents = chargeable_base_cents + admin_fee_cents
      # STEP 9  member_agency.committed_spend_cents += total_cents      (AFTER step 1's read)
      #         contract.usage_chargeable_cents_total += chargeable_base_cents
      #
      # Consequence to test: two identical orders placed back to back can carry different
      # net_unit_price_cents, because the first order's step 9 moves the second order's
      # step 1 snapshot across a discount tier threshold. Neither order's own total ever
      # feeds its own tier.
    input_set: "One ContractUsage under construction plus its MasterContract, ContractLineItem and MemberAgency. FEE_REBATE_BY_TIER is keyed by the discount_tier_index chosen in step 2; a tier_index absent from the map contributes rebate 0.0000."
    constants:
      FEE_REBATE_BY_TIER: "{ 0: 0.0000, 1: 0.1000, 2: 0.2500 }"
    precision: "integers throughout; effective_fee_rate_bps is rounded to whole basis points with ROUND_HALF_UP before the fee is computed, and the fee is then rounded to whole cents with ROUND_HALF_UP"

  - name: admin_fee_assessment
    trigger: "REPORTED variant on UsageReport DRAFT->SUBMITTED and REJECTED->SUBMITTED; AUDITED variant on UsageReport ACCEPTED->RECONCILED"
    algorithm: aggregation
    formula: |
      swept = calculations.report_period_sweep(report)     # ordered usage list

      # ---- REPORTED variant: one bulk application of the contract's base rate ----
      reported_chargeable_cents = sum(u.chargeable_base_cents for u in swept)
      reported_usage_cents      = sum(u.total_cents for u in swept)
      reported_fee_cents = ROUND_HALF_UP(reported_chargeable_cents
                                        * contract.admin_fee_rate_bps / 10000, 0)

      # ---- AUDITED variant: per-usage fees exactly as frozen on each usage ----
      audited_fee_cents = sum(u.admin_fee_cents for u in swept)

      fee_true_up_cents = audited_fee_cents - reported_fee_cents        # signed
      fee_rebate_cents  = reported_fee_cents - audited_fee_cents        # the cooperative's
                                                                       # tier concession
      if audited_fee_cents == 0:
          variance_pct = 0.00
      else:
          variance_pct = ROUND_HALF_UP(100 * abs(fee_true_up_cents) / audited_fee_cents, 2)
      variance_flagged = (variance_pct > MAX_REPORT_VARIANCE_PCT)
    input_set: "ContractUsage rows with usage_report_id == report.id after the sweep, i.e. status == CONFIRMED at sweep time and ordered_at inside the report's CLOSED period. RECORDED and RETRACTED usages are excluded."
    constants:
      MAX_REPORT_VARIANCE_PCT: 15.00
      VARIANCE_DEDUCTION_POINTS: 5.00
      FEE_DUE_DAYS: 30
    precision: "cent amounts are integers rounded with ROUND_HALF_UP; variance_pct carries 2 decimals with ROUND_HALF_UP"
    variants:
      - name: REPORTED
        when: "Computed at SUBMIT, printed on the supplier's remittance advice and used as the amount actually invoiced and remitted."
        difference: "Applies contract.admin_fee_rate_bps ONCE to the period-aggregate chargeable base, ignoring each usage's tier rebate and performing a single rounding at the end."
      - name: AUDITED
        when: "Computed at RECONCILE by the cooperative's audit desk."
        difference: "Sums the per-usage admin_fee_cents, each of which was frozen at that usage's tier-rebated effective_fee_rate_bps and rounded individually. Diverges from REPORTED for two independent reasons - tier rebates present on some usages, and per-usage rounding - so the same swept set yields two different totals and a signed fee_true_up_cents."

  - name: composite_score
    trigger: "On Solicitation EVALUATION->AWARD_PENDING (action=RECOMMEND_AWARD), over every RESPONSIVE response of that solicitation"
    algorithm: weighted_scoring
    formula: |
      responsive = SolicitationResponse rows with solicitation_id == s.id AND status == RESPONSIVE
      lowest_price_cents = min(r.proposed_annual_value_cents for r in responsive)

      for r in responsive ordered by created_at ASC:                # deterministic order
          r.price_score = ROUND_HALF_UP(100 * lowest_price_cents
                                        / r.proposed_annual_value_cents, 2)
          weighted_technical = ROUND_HALF_UP(r.technical_score
                                            * s.technical_weight_pct / 100, 2)
          weighted_price     = ROUND_HALF_UP(r.price_score
                                            * s.price_weight_pct / 100, 2)
          r.composite_score  = ROUND_HALF_UP(weighted_technical + weighted_price, 2)
          # PINNED ROUNDING ORDER: round EACH weighted component to 2 decimals FIRST,
          # then add the two rounded components. Computing
          # ROUND_HALF_UP(technical_score*tw/100 + price_score*pw/100, 2)
          # (sum-then-round) is explicitly NOT the rule and differs by 0.01 whenever both
          # products carry a fractional third decimal that rounds up together.

      rank the same responsive set by composite_score DESC,
           tie-break created_at ASC (never by id), and write award_rank = 1..N
    input_set: "SolicitationResponse rows with status == RESPONSIVE only. SUBMITTED, INFO_REQUESTED, NON_RESPONSIVE and WITHDRAWN rows are excluded from both the lowest_price_cents minimum and the ranking, and keep price_score / composite_score / award_rank null."
    constants:
      MIN_RESPONSIVE_RESPONSES: 2
      MAX_INFO_REQUEST_ROUNDS: 2
    precision: "price_score, weighted components and composite_score all carry exactly 2 decimals with ROUND_HALF_UP"

  - name: piggyback_authority
    trigger: "On PiggybackAnalysis PENDING->DETERMINED (POST /coop/piggyback-analyses/{id}/determination with action=DETERMINE)"
    algorithm: threshold
    formula: |
      rule = the StateLawRule whose state_code == member_agency.state_code
      s    = the Solicitation referenced by contract.solicitation_id
      total_term_months = (contract.current_term_end.year - contract.base_term_start.year) * 12
                        + (contract.current_term_end.month - contract.base_term_start.month)
                        - (1 if contract.current_term_end.day < contract.base_term_start.day else 0)

      deduction_detail = []                 # appended in exactly this order
      if rule.piggyback_doctrine == STATUTORY_STRICT:
          if rule.requires_lead_agency_in_state
             and s.lead_agency_state_code != member_agency.state_code:
              append(OUT_OF_STATE_LEAD, 30.00)
          if s.notice_days < rule.min_notice_days:
              append(SHORT_NOTICE,
                     min(25.00, STRICT_NOTICE_POINTS_PER_DAY
                                * (rule.min_notice_days - s.notice_days)))
          if total_term_months > rule.max_contract_term_months:
              append(TERM_EXCEEDS_STATE_MAX, 20.00)
          if member_agency.member_category == NONPROFIT_501C3
             and rule.allows_nonprofit_participation == false:
              append(NONPROFIT_NOT_PERMITTED, 40.00)
      else:                                  # RECIPROCITY_LIBERAL
          if s.lead_agency_state_code != member_agency.state_code
             and s.lead_agency_state_code not in rule.reciprocity_state_codes:
              append(OUT_OF_STATE_LEAD, 15.00)
          if s.notice_days < rule.min_notice_days:
              append(SHORT_NOTICE,
                     min(10.00, LIBERAL_NOTICE_POINTS_PER_DAY
                                * (rule.min_notice_days - s.notice_days)))
          if total_term_months > rule.max_contract_term_months:
              append(TERM_EXCEEDS_STATE_MAX, 5.00)
          if member_agency.member_category == NONPROFIT_501C3
             and rule.allows_nonprofit_participation == false:
              append(NONPROFIT_NOT_PERMITTED, 40.00)

      authority_score = max(0.00, 100.00 - sum(d.points for d in deduction_detail))
      local_waiver_required = rule.requires_local_solicitation_waiver

      if authority_score >= AUTHORITY_AUTHORIZED_THRESHOLD:   determination = AUTHORIZED
      elif authority_score >= AUTHORITY_CONDITIONAL_THRESHOLD: determination = CONDITIONAL
      else:                                                    determination = DENIED

      expires_on = min(contract.current_term_end,
                       determined_at + AUTHORITY_VALIDITY_DAYS days)
    input_set: "Exactly one StateLawRule (selected by the member's state_code natural key), one MemberAgency with registration_status == ACTIVE, one MasterContract with status == ACTIVE, and that contract's Solicitation. Nothing is aggregated across other analyses."
    constants:
      AUTHORITY_AUTHORIZED_THRESHOLD: 85.00
      AUTHORITY_CONDITIONAL_THRESHOLD: 60.00
      STRICT_NOTICE_POINTS_PER_DAY: 5.00
      LIBERAL_NOTICE_POINTS_PER_DAY: 2.00
      AUTHORITY_VALIDITY_DAYS: 365
      MAX_DOCS_REQUEST_ROUNDS: 3
    precision: "authority_score carries 2 decimals with ROUND_HALF_UP; both determination thresholds are inclusive (>=), so exactly 85.00 is AUTHORIZED and exactly 60.00 is CONDITIONAL"
    variants:
      - name: STATUTORY_STRICT
        when: "The member's StateLawRule.piggyback_doctrine == STATUTORY_STRICT (states that recognise a cooperative award only when it satisfies their own statute literally)."
        difference: "Charges 30.00 for an out-of-state lead agency whenever requires_lead_agency_in_state is true, 5.00 points per day of notice shortfall capped at 25.00, and 20.00 for a term longer than the state maximum. Reciprocity lists are never consulted."
      - name: RECIPROCITY_LIBERAL
        when: "The member's StateLawRule.piggyback_doctrine == RECIPROCITY_LIBERAL (states that accept listed sister states' solicitations)."
        difference: "Consults reciprocity_state_codes and charges nothing at all for a listed lead state, 15.00 otherwise; charges only 2.00 points per day of notice shortfall capped at 10.00 and 5.00 for an over-long term. Identical member/contract facts therefore land in different determination bands under the two variants."

  - name: supplier_performance_score
    trigger: "On MemberComplaint UNDER_INVESTIGATION->SUBSTANTIATED and APPEALED->OVERTURNED; on UsageReport ACCEPTED->RECONCILED when variance_flagged flips true; on UsageReport fee_status DUE->DELINQUENT and DELINQUENT->PAID"
    algorithm: aggregation
    formula: |
      deduction_points_total =
            sum(DEDUCTION_POINTS_BY_SEVERITY[c.severity]
                for c in MemberComplaint
                where c.contract_id IN (this supplier's contracts)
                  and c.status IN {SUBSTANTIATED, APPEALED, CLOSED}
                  and c.points_reversed == false)
          + VARIANCE_DEDUCTION_POINTS
            * count(UsageReport r on this supplier's contracts where r.variance_flagged)
          + DELINQUENCY_DEDUCTION_POINTS
            * count(UsageReport r on this supplier's contracts
                    where r.fee_status == DELINQUENT)

      performance_score = max(SCORE_FLOOR,
                              min(SCORE_CEILING, 100.00 - deduction_points_total))

      if performance_score >= TIER_PREFERRED_THRESHOLD:  performance_tier = PREFERRED
      elif performance_score >= TIER_STANDARD_THRESHOLD: performance_tier = STANDARD
      else:                                              performance_tier = PROBATION
    input_set: "MemberComplaint rows on the supplier's contracts with status IN {SUBSTANTIATED, APPEALED, CLOSED} and points_reversed == false (DISMISSED, INTAKE, UNDER_INVESTIGATION and OVERTURNED rows contribute nothing), plus UsageReport rows on the supplier's contracts with variance_flagged == true or fee_status == DELINQUENT."
    constants:
      DEDUCTION_POINTS_BY_SEVERITY: "{ MINOR: 2.50, MAJOR: 7.50, CRITICAL: 20.00 }"
      VARIANCE_DEDUCTION_POINTS: 5.00
      DELINQUENCY_DEDUCTION_POINTS: 3.00
      TIER_PREFERRED_THRESHOLD: 85.00
      TIER_STANDARD_THRESHOLD: 70.00
      APPEAL_WINDOW_DAYS: 14
      SCORE_FLOOR: 0.00
      SCORE_CEILING: 100.00
    precision: "2 decimals, ROUND_HALF_UP; both tier thresholds are inclusive (>=), so a score of exactly 70.00 is STANDARD and exactly 85.00 is PREFERRED"

  - name: audit_package_completeness
    trigger: "On Solicitation audit_package_status ASSEMBLE (NOT_ASSEMBLED->ASSEMBLED, ASSEMBLED->ASSEMBLED, STALE->ASSEMBLED)"
    algorithm: projection
    formula: |
      required = list(REQUIRED_DOC_CODES)          # fixed 8-code base, this exact order
      if any ContractAmendment with status == APPROVED exists on a MasterContract
         whose solicitation_id == s.id:
          required.append("AMENDMENT_LOG")         # denominator becomes 9

      present = []
      for code in required:
          if code == "NOTICE_OF_SOLICITATION"            and s.posted_at is not null: present.append(code)
          if code == "SPECIFICATION_PACKAGE"             and s.specification_document_ref is not null: present.append(code)
          if code == "PROCUREMENT_METHOD_JUSTIFICATION"  and s.method_justification_ref is not null: present.append(code)
          if code == "ADDENDA_LOG"                       and s.posted_at is not null: present.append(code)
              # a zero-addendum solicitation still HAS an addenda log; addenda_count == 0
              # is a legitimate value and does NOT make this code absent
          if code == "RESPONSE_TABULATION"               and s.responsive_response_count >= 1: present.append(code)
          if code == "EVALUATION_SCORESHEET"             and s.responsive_response_count >= 1
             and every RESPONSIVE response has technical_score not null: present.append(code)
          if code == "AWARD_RECOMMENDATION"              and s.status IN {AWARD_PENDING, AWARDED}: present.append(code)
          if code == "CONTRACT_EXECUTION"                and a MasterContract with
             solicitation_id == s.id and status IN {ACTIVE, SUSPENDED, EXPIRED, TERMINATED} exists: present.append(code)
          if code == "AMENDMENT_LOG"                     and s.amendment_log_document_ref is not null: present.append(code)

      audit_required_doc_codes = required
      audit_present_doc_codes  = present
      audit_completeness_pct   = ROUND_HALF_UP(100 * len(present) / len(required), 2)
    input_set: "One Solicitation, its SolicitationResponse rows (only status == RESPONSIVE ones matter), any MasterContract with solicitation_id == s.id and status IN {ACTIVE, SUSPENDED, EXPIRED, TERMINATED}, and any ContractAmendment with status == APPROVED on such a contract."
    constants:
      REQUIRED_DOC_CODES: "[NOTICE_OF_SOLICITATION, SPECIFICATION_PACKAGE, PROCUREMENT_METHOD_JUSTIFICATION, ADDENDA_LOG, RESPONSE_TABULATION, EVALUATION_SCORESHEET, AWARD_RECOMMENDATION, CONTRACT_EXECUTION]"
      AUDIT_CERTIFICATION_THRESHOLD_PCT: 100.00
    precision: "2 decimals, ROUND_HALF_UP; a solicitation with zero RESPONSIVE responses loses exactly the four response-dependent codes and lands on 50.00 with an 8-code denominator"

  - name: price_adjustment_ceiling
    trigger: "On ContractAmendment PROPOSED->APPROVED when amendment_type == PRICE_ADJUSTMENT (the ceiling is also recomputed and stored at proposal time)"
    algorithm: threshold
    formula: |
      index_cap_pct     = ESCALATION_CAP_BY_INDEX[amendment.price_index]
      effective_cap_pct = min(contract.price_escalation_cap_pct,
                              index_cap_pct,
                              amendment.index_change_pct)
      price_ceiling_cents = ROUND_HALF_UP(line_item.base_unit_price_cents
                                          * (1 + effective_cap_pct), 0)
      # boundary is inclusive: new_unit_price_cents == price_ceiling_cents is ALLOWED,
      # new_unit_price_cents == price_ceiling_cents + 1 is ERR_PRICE_ESCALATION_EXCEEDS_CAP
      if amendment.new_unit_price_cents > price_ceiling_cents:
          reject ERR_PRICE_ESCALATION_EXCEEDS_CAP
      if amendment.new_unit_price_cents < line_item.price_floor_cents:
          reject ERR_PRICE_BELOW_FLOOR
    input_set: "Exactly one ContractAmendment with amendment_type == PRICE_ADJUSTMENT, its target ContractLineItem with status == ACTIVE, and the parent MasterContract."
    constants:
      ESCALATION_CAP_BY_INDEX: "{ CPI_U: 0.0400, PPI_COMMODITY: 0.0600 }"
      PRICE_STABILITY_BUFFER_DAYS: 90
      EXPANSION_SCOPE_MIN_PCT: 0.8000
    precision: "price_ceiling_cents is an integer number of cents rounded with ROUND_HALF_UP; the three-way min is taken on the 4-decimal fractions BEFORE the multiplication"

  - name: contract_compliance_posture
    trigger: "System, after every UsageReport.fee_status change on the contract (ACCEPT -> DUE, REMIT -> PAID, compliance-sweep -> DELINQUENT) and after a usage retraction re-sweeps a report"
    algorithm: threshold
    formula: |
      delinquent = UsageReport rows with contract_id == c.id AND fee_status == DELINQUENT
      c.delinquent_report_count = count(delinquent)
      outstanding_delinquent_cents = sum(r.reported_fee_cents - r.remitted_cents
                                         for r in delinquent)

      if c.delinquent_report_count >= DELINQUENCY_COUNT_THRESHOLD
         or outstanding_delinquent_cents >= DELINQUENCY_AMOUNT_THRESHOLD_CENTS:
          compliance_posture = DELINQUENT
      elif c.delinquent_report_count == 1:
          compliance_posture = WATCH
      else:
          compliance_posture = COMPLIANT
      # both tests are inclusive (>=): exactly 2 delinquent reports, or exactly
      # DELINQUENCY_AMOUNT_THRESHOLD_CENTS outstanding on a single one, is DELINQUENT
    input_set: "UsageReport rows with contract_id == this contract and fee_status == DELINQUENT only. NOT_DUE, DUE and PAID reports are excluded, as are reports whose status == REJECTED (a REJECTED report can never have left fee_status NOT_DUE)."
    constants:
      DELINQUENCY_COUNT_THRESHOLD: 2
      DELINQUENCY_AMOUNT_THRESHOLD_CENTS: 500000
    precision: "integer counts and cents; no rounding"

  - name: report_period_sweep
    trigger: "On UsageReport DRAFT->SUBMITTED and REJECTED->SUBMITTED; re-run when a swept ContractUsage is retracted"
    algorithm: chronological
    formula: |
      swept = ContractUsage rows where
                  contract_id == report.contract_id
              AND status == CONFIRMED
              AND period_start <= ordered_at <= period_end        # CLOSED interval, both ends inclusive
              AND (usage_report_id is null OR usage_report_id == report.id)
      order swept by ordered_at ASC, then created_at ASC        # never by id

      report.swept_usage_count         = count(swept)
      report.reported_chargeable_cents = sum(u.chargeable_base_cents for u in swept)
      report.reported_usage_cents      = sum(u.total_cents for u in swept)
      for u in swept: u.usage_report_id = report.id

      # Period geometry, CLOSED semantics: a candidate period [a, b] overlaps an existing
      # period [c, d] when a <= d AND c <= b. Two periods that merely TOUCH (a == d)
      # therefore DO overlap and the later one is rejected with ERR_REPORT_PERIOD_OVERLAP.
      # This is deliberately different from the half-open contract-term geometry used by
      # calculations.renewal_term_extension.
    input_set: "ContractUsage rows with status == CONFIRMED whose ordered_at lies inside the closed period and which are not already claimed by a different report. RECORDED usages are never swept (the member has not confirmed receipt) and RETRACTED usages are removed from a sweep by the retraction cascade."
    constants:
      SWEEP_STATUS_FILTER: "CONFIRMED"
    precision: "integer cents; the sum is exact and unrounded - all rounding already happened per usage"

  - name: renewal_term_extension
    trigger: "On ContractAmendment PROPOSED->APPROVED when amendment_type == RENEWAL (validated at proposal time as well)"
    algorithm: interval_merge
    formula: |
      # Contract terms are HALF-OPEN [start, end). A renewal occupies
      # [contract.current_term_end, requested_term_end), so a renewal whose interval starts
      # exactly at the previous interval's exclusive end is ADJACENT, not overlapping, and
      # is ALLOWED. (Contrast calculations.report_period_sweep, whose CLOSED periods reject
      # a touching endpoint.)
      if amendment.requested_term_end <= contract.current_term_end:
          reject ERR_RENEWAL_TERM_NOT_EXTENDING        # zero-length or backwards interval
      extension_months = (requested_term_end.year - current_term_end.year) * 12
                       + (requested_term_end.month - current_term_end.month)
                       - (1 if requested_term_end.day < current_term_end.day else 0)
      if extension_months > MAX_RENEWAL_MONTHS:
          reject ERR_RENEWAL_TERM_TOO_LONG
      total_term_months = (requested_term_end.year - contract.base_term_start.year) * 12
                        + (requested_term_end.month - contract.base_term_start.month)
                        - (1 if requested_term_end.day < contract.base_term_start.day else 0)
      if total_term_months > MAX_TOTAL_TERM_MONTHS:
          reject ERR_TOTAL_TERM_EXCEEDS_MAX
      if contract.renewals_used >= contract.max_renewals:
          reject ERR_RENEWAL_LIMIT_REACHED
      on approve: contract.current_term_end = requested_term_end
                  contract.renewals_used += 1
      # Already-DETERMINED PiggybackAnalysis rows keep their frozen expires_on: the renewal
      # does NOT extend an existing authority opinion.
    input_set: "Exactly one ContractAmendment with amendment_type == RENEWAL and its parent MasterContract with status == ACTIVE."
    constants:
      MAX_RENEWAL_MONTHS: 12
      MAX_TOTAL_TERM_MONTHS: 60
    precision: "whole months by calendar arithmetic; the day-of-month correction makes 2026-09-01 -> 2027-09-01 exactly 12 months"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the declared role list of the called endpoint contains X-User-Role"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body and query string conform to the endpoint's input schema: no unknown fields, no missing required fields, correct scalar types, enum members inside their declared sets (including the endpoint's action set), limit in 1..100, offset >= 0, quantity >= 1, amount_cents >= 0, technical_score in 0.00..100.00, technical_weight_pct + price_weight_pct == 100, base_term_start < base_term_end, period_start <= period_end, discount_tiers/permitted_add_ons well-formed per their field constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "every id in the path exists, validated left to right"
    error_id: "ERR_SOLICITATION_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_RESPONSE_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_LINE_ITEM_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_ANALYSIS_NOT_FOUND | ERR_USAGE_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_AMENDMENT_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_STATE_LAW_RULE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 5
    category: existence
    check: "every foreign key in the request body resolves to an existing row, validated in the order the fields are declared on the entity in section 1.1"
    error_id: "ERR_SOLICITATION_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_LINE_ITEM_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_ANALYSIS_NOT_FOUND | ERR_USAGE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /coop/solicitation-responses, POST /coop/master-contracts, POST /coop/master-contracts/{id}/line-items, POST /coop/piggyback-analyses, POST /coop/contract-usages, POST /coop/usage-reports, POST /coop/contract-amendments, POST /coop/complaints, GET /coop/master-contracts/{id}/price-quote"
    note: "Existence of body FKs is checked BEFORE any cross-reference consistency rule (priorities 32-39), so a usage naming a non-existent line item is 404, not 422."
  - priority: 6
    category: existence
    check: "a StateLawRule row exists whose state_code equals the state_code natural key the operation depends on (solicitation.lead_agency_state_code at POST_NOTICE, supplier.home_state_code at QUALIFY, member.state_code at VERIFY and at piggyback DETERMINE)"
    error_id: ERR_STATE_LAW_RULE_NOT_FOUND
    http_status: 404
    applies_to: "POST /coop/solicitations/{id}/lifecycle, POST /coop/suppliers/{id}/qualification, POST /coop/member-agencies/{id}/registration, POST /coop/piggyback-analyses/{id}/determination"
  - priority: 7
    category: auth
    check: "for entity_backed roles, X-User-ID equals the resource's owning foreign key: SupplierRepresentative must equal response.supplier_id / contract.supplier_id / the amendment's or report's contract.supplier_id / the appealed complaint's contract.supplier_id / the supplier_id in the body, MemberRepresentative must equal usage.member_agency_id / complaint.member_agency_id / the member_agency_id in the body"
    error_id: ERR_ACTOR_SCOPE_MISMATCH
    http_status: 403
    applies_to: "every POST endpoint whose role list contains SupplierRepresentative or MemberRepresentative (POST /coop/solicitation-responses, POST /coop/solicitation-responses/{id}/submission, POST /coop/usage-reports, POST /coop/usage-reports/{id}/submission, POST /coop/usage-reports/{id}/fee-remittance, POST /coop/contract-amendments, POST /coop/contract-amendments/{id}/withdrawal, POST /coop/complaints/{id}/appeal, POST /coop/piggyback-analyses, POST /coop/contract-usages, POST /coop/contract-usages/{id}/disposition, POST /coop/complaints); read endpoints are not scope-checked"
  - priority: 8
    category: auth
    check: "segregation of duties: X-User-ID != solicitation.recommended_by_user_id on action=AWARD; X-User-ID != complaint.investigator_user_id on action IN {SUBSTANTIATE, DISMISS}; X-User-ID != complaint.adjudicator_user_id on action IN {OVERTURN, UPHOLD}"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /coop/solicitations/{id}/lifecycle, POST /coop/complaints/{id}/investigation, POST /coop/complaints/{id}/decision, POST /coop/complaints/{id}/appeal-decision"
  - priority: 9
    category: state
    check: "optimistic concurrency: the supplied expected_<parent>_version equals the parent row's current version"
    error_id: "ERR_STALE_MEMBER_AGENCY_VERSION | ERR_STALE_CONTRACT_VERSION"
    http_status: 412
    applies_to: "POST /coop/piggyback-analyses, POST /coop/contract-amendments"
  - priority: 10
    category: state
    check: "the MasterContract the operation depends on has status == ACTIVE (usage recording, piggyback determination, amendment proposal and approval)"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /coop/contract-usages, POST /coop/piggyback-analyses/{id}/determination, POST /coop/contract-amendments, POST /coop/contract-amendments/{id}/decision"
  - priority: 11
    category: state
    check: "the ContractAmendment has status == PROPOSED for a decision or withdrawal action"
    error_id: ERR_AMENDMENT_NOT_PROPOSED
    http_status: 409
    applies_to: "POST /coop/contract-amendments/{id}/decision, POST /coop/contract-amendments/{id}/withdrawal"
  - priority: 12
    category: state
    check: "the MemberComplaint is in a from-state that permits the requested action per the MemberComplaint state machine"
    error_id: ERR_COMPLAINT_INVALID_STATE
    http_status: 409
    applies_to: "POST /coop/complaints/{id}/investigation, POST /coop/complaints/{id}/decision, POST /coop/complaints/{id}/appeal, POST /coop/complaints/{id}/appeal-decision"
  - priority: 13
    category: state
    check: "the Solicitation is in a from-state that permits the requested lifecycle or audit-package action; responses may only be created while status == POSTED"
    error_id: "ERR_SOLICITATION_INVALID_STATE | ERR_SOLICITATION_CLOSED_FOR_RESPONSES | ERR_AUDIT_PACKAGE_NOT_ASSEMBLED"
    http_status: 409
    applies_to: "POST /coop/solicitations/{id}/lifecycle, POST /coop/solicitations/{id}/audit-package, POST /coop/solicitation-responses"
  - priority: 14
    category: state
    check: "the SolicitationResponse is in a from-state that permits the requested review or submission action"
    error_id: ERR_RESPONSE_INVALID_STATE
    http_status: 409
    applies_to: "POST /coop/solicitation-responses/{id}/review, POST /coop/solicitation-responses/{id}/submission"
  - priority: 15
    category: state
    check: "the UsageReport status dimension permits the requested action (SUBMIT from DRAFT or REJECTED; ACCEPT and REJECT from SUBMITTED; RECONCILE from ACCEPTED)"
    error_id: ERR_REPORT_INVALID_STATE
    http_status: 409
    applies_to: "POST /coop/usage-reports/{id}/submission, POST /coop/usage-reports/{id}/review"
  - priority: 16
    category: state
    check: "the ContractUsage status permits the requested disposition (CONFIRM from RECORDED; RETRACT from RECORDED or CONFIRMED)"
    error_id: ERR_USAGE_INVALID_STATE
    http_status: 409
    applies_to: "POST /coop/contract-usages/{id}/disposition"
  - priority: 17
    category: state
    check: "a usage may not be retracted once the UsageReport that swept it has status IN {ACCEPTED, RECONCILED}"
    error_id: ERR_USAGE_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /coop/contract-usages/{id}/disposition"
  - priority: 18
    category: state
    check: "the MemberAgency has registration_status == ACTIVE (usage recording and piggyback determination) or is in a from-state that permits the requested registration action"
    error_id: "ERR_MEMBER_NOT_ACTIVE | ERR_MEMBER_INVALID_STATE"
    http_status: 409
    applies_to: "POST /coop/contract-usages, POST /coop/piggyback-analyses/{id}/determination, POST /coop/member-agencies/{id}/registration"
  - priority: 19
    category: state
    check: "the PiggybackAnalysis is in a from-state that permits the requested determination action (DETERMINE from PENDING; VOID from PENDING or DETERMINED)"
    error_id: ERR_ANALYSIS_INVALID_STATE
    http_status: 409
    applies_to: "POST /coop/piggyback-analyses/{id}/determination"
  - priority: 20
    category: state
    check: "the ContractLineItem named by a usage or amendment has status == ACTIVE"
    error_id: ERR_LINE_ITEM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /coop/contract-usages, POST /coop/contract-amendments, GET /coop/master-contracts/{id}/price-quote"
  - priority: 21
    category: state
    check: "the UsageReport fee_status dimension permits the requested action: REMIT requires fee_status IN {DUE, DELINQUENT}; RECONCILE requires fee_status IN {PAID, DELINQUENT}"
    error_id: ERR_FEE_STATUS_INVALID
    http_status: 409
    applies_to: "POST /coop/usage-reports/{id}/fee-remittance, POST /coop/usage-reports/{id}/review"
  - priority: 22
    category: state
    check: "the Solicitation named by a new MasterContract has status == AWARDED (the separate rank-1 supplier identity test is owned by priority 40, so a non-rank-1 supplier on an AWARDED solicitation passes this check and fails that one)"
    error_id: ERR_SOLICITATION_NOT_AWARDED
    http_status: 409
    applies_to: "POST /coop/master-contracts"
  - priority: 23
    category: state
    check: "the MasterContract is in a from-state that permits the requested award-status action, and EXECUTE additionally requires logical clock now < base_term_end while EXPIRE requires logical clock now >= current_term_end"
    error_id: ERR_CONTRACT_INVALID_STATE
    http_status: 409
    applies_to: "POST /coop/master-contracts/{id}/award-status"
  - priority: 24
    category: state
    check: "the Supplier is in a from-state that permits the requested qualification action, and REINSTATE additionally requires performance_tier != PROBATION"
    error_id: ERR_SUPPLIER_INVALID_STATE
    http_status: 409
    applies_to: "POST /coop/suppliers/{id}/qualification"
  - priority: 25
    category: business_safety
    check: "the Supplier has qualification_status == QUALIFIED (response marked responsive, contract executed, amendment proposed or approved)"
    error_id: ERR_SUPPLIER_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /coop/solicitation-responses, POST /coop/solicitation-responses/{id}/review, POST /coop/master-contracts/{id}/award-status, POST /coop/contract-amendments, POST /coop/contract-amendments/{id}/decision"
  - priority: 26
    category: business_safety
    check: "the Supplier that would absorb a performance deduction has qualification_status != DEBARRED"
    error_id: ERR_SUPPLIER_DEBARRED
    http_status: 409
    applies_to: "POST /coop/complaints/{id}/decision"
  - priority: 27
    category: business_safety
    check: "member eligibility evidence matches member_category: NONPROFIT_501C3 requires a non-null irs_determination_letter_number, every other category requires a non-null governing_body_resolution_number"
    error_id: "ERR_NONPROFIT_EVIDENCE_MISSING | ERR_GOVERNING_RESOLUTION_MISSING"
    http_status: 422
    applies_to: "POST /coop/member-agencies/{id}/registration"
  - priority: 28
    category: business_safety
    check: "a NONPROFIT_501C3 member may only be verified when its StateLawRule.allows_nonprofit_participation is true"
    error_id: ERR_NONPROFIT_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /coop/member-agencies/{id}/registration"
  - priority: 29
    category: business_safety
    check: "when the member's StateLawRule.requires_local_solicitation_waiver is true, the PiggybackAnalysis carries a non-null waiver_reference at determination"
    error_id: ERR_LOCAL_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /coop/piggyback-analyses/{id}/determination"
  - priority: 30
    category: business_safety
    check: "the PiggybackAnalysis cited by a usage has status == DETERMINED with determination IN {AUTHORIZED, CONDITIONAL}"
    error_id: ERR_PIGGYBACK_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /coop/contract-usages"
  - priority: 31
    category: business_safety
    check: "the PiggybackAnalysis cited by a usage has expires_on > logical clock now"
    error_id: ERR_PIGGYBACK_EXPIRED
    http_status: 409
    applies_to: "POST /coop/contract-usages"
  - priority: 32
    category: business_safety
    check: "the MasterContract has compliance_posture IN {COMPLIANT, WATCH}"
    error_id: ERR_CONTRACT_POSTURE_DELINQUENT
    http_status: 409
    applies_to: "POST /coop/contract-usages"
  - priority: 33
    category: business_safety
    check: "audit-package CERTIFY requires audit_completeness_pct == AUDIT_CERTIFICATION_THRESHOLD_PCT"
    error_id: ERR_AUDIT_PACKAGE_INCOMPLETE
    http_status: 409
    applies_to: "POST /coop/solicitations/{id}/audit-package"
  - priority: 34
    category: business_referential
    check: "the ContractLineItem named by a usage, amendment or quote has contract_id equal to the contract named by the same request"
    error_id: ERR_LINE_ITEM_CONTRACT_MISMATCH
    http_status: 422
    applies_to: "POST /coop/contract-usages, POST /coop/contract-amendments, GET /coop/master-contracts/{id}/price-quote"
  - priority: 35
    category: business_referential
    check: "the PiggybackAnalysis cited by a usage has member_agency_id and contract_id equal to the usage's own member_agency_id and contract_id"
    error_id: ERR_ANALYSIS_PAIR_MISMATCH
    http_status: 422
    applies_to: "POST /coop/contract-usages"
  - priority: 36
    category: business_referential
    check: "when related_usage_id is supplied on a complaint, that ContractUsage has the same contract_id and member_agency_id as the complaint"
    error_id: ERR_USAGE_PAIR_MISMATCH
    http_status: 422
    applies_to: "POST /coop/complaints"
  - priority: 37
    category: business_referential
    check: "the amendment payload block matches amendment_type exactly: PRICE_ADJUSTMENT requires target_line_item_id, new_unit_price_cents, price_index and index_change_pct and forbids requested_term_end / new_line_items / expansion_scope_overlap_pct; RENEWAL requires requested_term_end only; PRODUCT_LINE_EXPANSION requires a non-empty new_line_items and expansion_scope_overlap_pct only"
    error_id: ERR_AMENDMENT_PAYLOAD_MISMATCH
    http_status: 422
    applies_to: "POST /coop/contract-amendments"
  - priority: 38
    category: business_referential
    check: "every code in add_on_codes appears in the contract's permitted_add_ons array"
    error_id: ERR_ADD_ON_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /coop/contract-usages, GET /coop/master-contracts/{id}/price-quote"
  - priority: 39
    category: business_referential
    check: "at most one SolicitationResponse per (solicitation_id, supplier_id) pair with status != WITHDRAWN"
    error_id: ERR_DUPLICATE_RESPONSE
    http_status: 409
    applies_to: "POST /coop/solicitation-responses"
  - priority: 40
    category: business_referential
    check: "the supplier_id of a new MasterContract equals the supplier_id of the solicitation's award_rank == 1 RESPONSIVE response"
    error_id: ERR_AWARD_NOT_HIGHEST_RANKED
    http_status: 422
    applies_to: "POST /coop/master-contracts"
  - priority: 41
    category: business_temporal
    check: "at POST_NOTICE the solicitation's response_due_at is strictly after logical clock now"
    error_id: ERR_RESPONSE_DUE_IN_PAST
    http_status: 422
    applies_to: "POST /coop/solicitations/{id}/lifecycle"
  - priority: 42
    category: business_temporal
    check: "OPEN_EVALUATION requires logical clock now >= response_due_at"
    error_id: ERR_RESPONSE_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /coop/solicitations/{id}/lifecycle"
  - priority: 43
    category: business_temporal
    check: "SUBMIT requires logical clock now > period_end so the reporting period has fully elapsed"
    error_id: ERR_REPORT_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /coop/usage-reports/{id}/submission"
  - priority: 44
    category: business_temporal
    check: "CLOSED-interval overlap: no other UsageReport on the same contract with status IN {DRAFT, SUBMITTED, ACCEPTED, RECONCILED} has a period satisfying new.period_start <= other.period_end AND other.period_start <= new.period_end. Touching endpoints count as an overlap."
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /coop/usage-reports, POST /coop/usage-reports/{id}/submission"
  - priority: 45
    category: business_temporal
    check: "a PRICE_ADJUSTMENT may only be approved when last_price_change_at is null OR logical clock now >= last_price_change_at + PRICE_STABILITY_BUFFER_DAYS days (inclusive: exactly 90 days later is allowed, 89 is not)"
    error_id: ERR_PRICE_WINDOW_TOO_SOON
    http_status: 409
    applies_to: "POST /coop/contract-amendments/{id}/decision"
  - priority: 46
    category: business_temporal
    check: "HALF-OPEN interval arithmetic for renewals: requested_term_end > contract.current_term_end (a renewal beginning exactly at the previous term's exclusive end is adjacent and allowed), extension_months <= MAX_RENEWAL_MONTHS, total_term_months <= MAX_TOTAL_TERM_MONTHS"
    error_id: "ERR_RENEWAL_TERM_NOT_EXTENDING | ERR_RENEWAL_TERM_TOO_LONG | ERR_TOTAL_TERM_EXCEEDS_MAX"
    http_status: 422
    applies_to: "POST /coop/contract-amendments, POST /coop/contract-amendments/{id}/decision"
  - priority: 47
    category: business_temporal
    check: "a usage's ordered_at falls inside the contract's half-open term [base_term_start, current_term_end)"
    error_id: ERR_OUTSIDE_CONTRACT_TERM
    http_status: 409
    applies_to: "POST /coop/contract-usages"
  - priority: 48
    category: business_temporal
    check: "FILE_APPEAL requires logical clock now <= complaint.appeal_deadline_at"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /coop/complaints/{id}/appeal"
  - priority: 49
    category: business_temporal
    check: "action=CLOSE on a SUBSTANTIATED complaint requires logical clock now > appeal_deadline_at"
    error_id: ERR_APPEAL_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /coop/complaints/{id}/decision"
  - priority: 50
    category: business_constraint
    check: "RECOMMEND_AWARD requires responsive_response_count >= MIN_RESPONSIVE_RESPONSES"
    error_id: ERR_INSUFFICIENT_RESPONSIVE_RESPONSES
    http_status: 422
