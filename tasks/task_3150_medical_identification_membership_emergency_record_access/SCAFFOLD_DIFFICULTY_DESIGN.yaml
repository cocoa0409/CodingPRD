  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency: two dependencies across DIFFERENT
  # entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: guardian_write_requires_active_guardianlink_on_member_pair
        grounds:
          - validations.priority_4_state
          - entities.GuardianLink.fields.status
          - errors.ERR_GUARDIANSHIP_REQUIRED
        distinguishing_aspect: |
          Entity pair GuardianLink x Member (dependent): the Guardian role's
          write on the dependent's record-items is gated by the GuardianLink
          being ACTIVE — revoking the link (a state change on a DIFFERENT
          entity) converts the identical guardian request from 201 to 403
          without touching the member or the record item.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Adult guardian G, dependent D, ACTIVE GuardianLink G->D. Guardian has already created one record item for D."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Hal Guard", email: "hal@x.com", membership_tier: "STANDARD", date_of_birth: "1968-06-06" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Dot Dep", email: "dot@x.com", membership_tier: "STANDARD", date_of_birth: "2017-02-14" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /medical-id/members/${d_id}/guardian-links"
              payload: { guardian_member_id: "${g_id}", relation_label: "uncle" }
              as: PlatformAdmin
              captures: { link_id: $.data.id }
            - call: "POST /medical-id/members/${d_id}/record-items"
              payload: { item_kind: "CONDITION", label: "Asthma", detail: "inhaler", severity: "MEDIUM", provider_document_ref: "doc-a" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { ok_item: $.data.id }
          trigger:
            - call: "POST /medical-id/guardian-links/${link_id}/revoke"
              payload: {}
              as: PlatformAdmin
            - call: "POST /medical-id/members/${d_id}/record-items"
              payload: { item_kind: "ALLERGY", label: "Nuts", detail: "severe", severity: "CRITICAL", provider_document_ref: "doc-n" }
              as: Guardian
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the first record-item create (link ACTIVE) returned 201"
            - "the second record-item create (link REVOKED) returns 403 with error_id == ERR_GUARDIANSHIP_REQUIRED"
            - "MedicalRecordItem.${ok_item}.status == PENDING_VERIFICATION (the pre-revoke item is untouched by the revocation)"

      - name: order_confirm_requires_member_active_and_product_exists_pair
        grounds:
          - state_machines.ProductOrder.PENDING_to_CONFIRMED
          - entities.Member.fields.status
          - errors.ERR_MEMBER_NOT_ACTIVE
        distinguishing_aspect: |
          Entity pair ProductOrder x Member (different pair from instance 1):
          the order's PENDING -> CONFIRMED transition is gated by the MEMBER's
          status, not the order's — once the member lapses to SUSPENDED via
          the clock sweep, confirm fails with ERR_MEMBER_NOT_ACTIVE even
          though the order itself is a perfectly valid PENDING order with a
          fresh expected_member_version.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member M (expires 2027-09-01) with one PENDING order. Clock advanced past expiry so the sweep flips M to SUSPENDED."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/products"
              payload: { product_sku: "CH-S", product_name: "Charm", base_price_cents: 2500, max_engrave_chars: 30 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Lena Lapse", email: "lena@x.com", membership_tier: "STANDARD", date_of_birth: "1993-04-04" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /medical-id/members/${m_id}/orders"
              payload: { product_id: "${prod_id}", engraving_text: "Lena charm", engrave_mode: "MANUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2027-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /medical-id/members/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /medical-id/members/${m_id}/orders/${o_id}/confirm"
              payload: { expected_member_version: "${m_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Member.${m_id}.status == SUSPENDED (clock sweep fired at expiry)"
            - "the confirm returns 409 with error_id == ERR_MEMBER_NOT_ACTIVE, NOT ERR_STALE_VERSION (the version was freshly read)"
            - "ProductOrder.${o_id}.status remains PENDING"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: two overlap rules with DIFFERENT
  # interval semantics on DIFFERENT resource entities.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: responder_credential_expiry_date_overlap_with_access_window
        grounds:
          - validations.priority_8_business_safety
          - entities.ResponderCredential.fields.expires_on
          - calculations.access_audit_rate
        distinguishing_aspect: |
          Half-open interval semantics on the ResponderCredential resource:
          the credential occupies [issue, expires_on) — an access on
          expires_on - 1 day succeeds, an access exactly ON expires_on is
          rejected (expiry is exclusive at the boundary), and a revoked
          credential rejects regardless of the date window.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE member M. Responder R1 expires_on 2026-09-02; responder R2 expires_on 2026-09-03 but REVOKED."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Omar Overlap", email: "omar@x.com", membership_tier: "STANDARD", date_of_birth: "1982-10-10" }
              as: PlatformAdmin
              captures: { m_code: $.data.identifier_code, m_id: $.data.id }
            - call: "POST /medical-id/responders"
              payload: { agency_name: "R1 Agency", credential_code: "R1-CODE", access_tier: "BASIC", expires_on: "2026-09-02" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /medical-id/responders"
              payload: { agency_name: "R2 Agency", credential_code: "R2-CODE", access_tier: "BASIC", expires_on: "2026-09-03" }
              as: PlatformAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /medical-id/responders/${r2_id}/revoke"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /medical-id/access-events"
              payload: { credential_code: "R1-CODE", identifier_code: "${m_code}", lookup_method: "IDENTIFIER" }
              as: Responder
              as_user_id: "${r1_id}"
              captures: { ev_ok: $.data.outcome }
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/access-events"
              payload: { credential_code: "R1-CODE", identifier_code: "${m_code}", lookup_method: "IDENTIFIER" }
              as: Responder
              as_user_id: "${r1_id}"
              captures: { err_expired: $.data.error_id }
            - call: "POST /medical-id/access-events"
              payload: { credential_code: "R2-CODE", identifier_code: "${m_code}", lookup_method: "IDENTIFIER" }
              as: Responder
              as_user_id: "${r2_id}"
              captures: { err_revoked: $.data.error_id }
          assert:
            - "the 2026-09-01 access (expires_on - 1 day) is GRANTED"
            - "the 2026-09-02 access (exactly expires_on) is DENIED with reason ERR_RESPONDER_AUTH_FAILED — the expiry date itself is outside the valid interval (exclusive boundary)"
            - "the R2 access is DENIED with ERR_RESPONDER_AUTH_FAILED even though 2026-09-02 < R2.expires_on — REVOKED dominates the temporal window"

      - name: one_open_wandering_case_blocks_second_overlapping_case
        grounds:
          - validations.priority_10_business_safety
          - entities.WanderingCase.fields.status
          - state_machines.WanderingCase.OPEN_to_RESOLVED
        distinguishing_aspect: |
          Aggregate-capacity semantics on the Member resource (different
          entity, different semantics from the credential window): the member
          admits AT MOST ONE OPEN wandering case — a second open attempt
          overlaps the first's open interval [opened_at, resolved_at) and is
          rejected, but once the first resolves (interval closes), a new case
          may open even on the same logical day. Capacity-1 overlap, not a
          date window.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE member M with a VERIFIED COGNITIVE condition (has_cognitive_condition true)."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/members"
              payload: { full_name: "Wanda Wander", email: "wanda@x.com", membership_tier: "STANDARD", date_of_birth: "1950-01-20" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /medical-id/members/${m_id}/record-items"
              payload: { item_kind: "CONDITION", condition_kind: "COGNITIVE", label: "Alzheimers", detail: "wander risk", severity: "CRITICAL", provider_document_ref: "doc-w" }
              as: Member
              as_user_id: "${m_id}"
              captures: { item_id: $.data.id }
            - call: "GET /medical-id/members/${m_id}/record-items/${item_id}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { t1: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${t1}/resolve"
              payload: { decision: "APPROVE", decision_note: "ok" }
              as: RecordVerifier
              as_user_id: "rv-1"
          trigger:
            - call: "POST /medical-id/members/${m_id}/wandering-cases"
              payload: { opened_via: "HOTLINE_ESCALATION" }
              as: HotlineOperator
              as_user_id: "op-1"
              captures: { case1: $.data.id }
            - call: "POST /medical-id/members/${m_id}/wandering-cases"
              payload: { opened_via: "SELF_REPORT" }
              as: HotlineOperator
              as_user_id: "op-1"
              captures: { err_dup: $.data.error_id }
            - call: "POST /medical-id/members/${m_id}/wandering-cases/${case1}/resolve"
              payload: { outcome: "REUNITED" }
              as: HotlineOperator
              as_user_id: "op-1"
            - call: "POST /medical-id/members/${m_id}/wandering-cases"
              payload: { opened_via: "SELF_REPORT" }
              as: HotlineOperator
              as_user_id: "op-1"
              captures: { case2: $.data.id }
          assert:
            - "the second open while case1 is OPEN fails 409 with ERR_WANDERING_NOT_ELIGIBLE (overlapping open interval)"
            - "after case1 RESOLVED, a new case opens successfully on the SAME logical day (interval closed -> capacity freed)"
            - "WanderingCase.${case2}.status == OPEN and WanderingCase.${case1}.status == RESOLVED with resolved_at set"

  # ===========================================================================
  # Rule 9 — compensating_invariant: two invariants over DIFFERENT conserved
  # quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: order_confirm_then_cancel_conserves_member_balance_and_wallet
        grounds:
          - state_machines.ProductOrder.PENDING_to_CONFIRMED
          - state_machines.ProductOrder.CONFIRMED_to_CANCELLED
          - entities.Member.fields.balance_cents
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: |
          Conserved quantity: Member.balance_cents - Member.wallet_credit_cents
          (net member liability). Confirm debits balance by price_cents; the
          compensating cancel credits balance AND refunds wallet by the same
          price_cents — forward + compensation returns BOTH fields exactly to
          their pre-confirm values, zero drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member M (balance 4000 from enrollment fee, wallet 0). Product P at 5000. Order O created and confirmed."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/products"
              payload: { product_sku: "PD-X", product_name: "Pendant X", base_price_cents: 5000, max_engrave_chars: 40 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Ivy Invariant", email: "ivy@x.com", membership_tier: "STANDARD", date_of_birth: "1987-08-08" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /medical-id/members/${m_id}/orders"
              payload: { product_id: "${prod_id}", engraving_text: "Ivy pendant", engrave_mode: "MANUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
            - call: "GET /medical-id/members/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_v: $.data.version }
            - call: "POST /medical-id/members/${m_id}/orders/${o_id}/confirm"
              payload: { expected_member_version: "${m_v}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /medical-id/members/${m_id}/orders/${o_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "immediately after confirm, Member.${m_id}.balance_cents == 4000 + 5000 == 9000 (order debited)"
            - "after the compensating cancel, Member.${m_id}.balance_cents == 4000 (exactly the pre-confirm value — no drift)"
            - "Member.${m_id}.wallet_credit_cents == 5000 (refund landed in wallet)"
            - "invariant: balance_cents - wallet_credit_cents == 4000 both before confirm and after cancel"
            - "ProductOrder.${o_id}.status == CANCELLED"

      - name: record_verify_then_supersede_conserves_verified_item_count_and_revision_parity
        grounds:
          - state_machines.MedicalRecordItem.PENDING_VERIFICATION_to_VERIFIED
          - state_machines.MedicalRecordItem.VERIFIED_to_SUPERSEDED
          - entities.Member.fields.record_revision
          - entities.ProductOrder.fields.synced_revision
        distinguishing_aspect: |
          Conserved quantity of a DIFFERENT type (record integrity, not
          money): the count of VERIFIED record items and the invariant
          synced_revision == record_revision on every PENDING SYNC order.
          Verifying item A then superseding it (compensation via replacement)
          keeps exactly one VERIFIED item at every observation point (the
          superseded A leaves VERIFIED exactly when replacement B enters
          PENDING_VERIFICATION), and the engraving re-sync restores
          synced_revision == record_revision on the pending SYNC order.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. STANDARD member M with item A VERIFIED ('OldLabel') and a PENDING SYNC_WITH_RECORD order O (engraving 'OldLabel', synced_revision == record_revision)."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medical-id/products"
              payload: { product_sku: "BR-Y", product_name: "Band Y", base_price_cents: 4000, max_engrave_chars: 40 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /medical-id/members"
              payload: { full_name: "Rey Record", email: "rey@x.com", membership_tier: "STANDARD", date_of_birth: "1976-12-12" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /medical-id/members/${m_id}/record-items"
              payload: { item_kind: "CONDITION", label: "OldLabel", detail: "original", severity: "HIGH", provider_document_ref: "doc-old" }
              as: Member
              as_user_id: "${m_id}"
              captures: { item_a: $.data.id, item_a_rev: $.data.record_revision }
            - call: "GET /medical-id/members/${m_id}/record-items/${item_a}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { ta: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${ta}/resolve"
              payload: { decision: "APPROVE", decision_note: "ok" }
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "GET /medical-id/members/${m_id}/record-items/${item_a}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { item_a_rev_v: $.data.record_revision }  # revision A was stamped with at creation (pre-verify member revision)
            - call: "POST /medical-id/members/${m_id}/orders"
              payload: { product_id: "${prod_id}", engraving_text: "x", engrave_mode: "SYNC_WITH_RECORD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_synced: $.data.synced_revision }
            - call: "GET /medical-id/members/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_v: $.data.version, m_rev: $.data.record_revision }
          trigger:
            - call: "POST /medical-id/members/${m_id}/record-items/${item_a}/supersede"
              payload: { replacement_label: "NewLabel", replacement_detail: "corrected", provider_document_ref: "doc-new", expected_member_version: "${m_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { item_b: $.data.id }
          assert:
            - "before supersede: exactly 1 VERIFIED item (A) and ProductOrder.${o_id}.engraving_text == \"OldLabel\" with synced_revision == ${m_rev}"
            - "after supersede: MedicalRecordItem.${item_a}.status == SUPERSEDED and exactly 0 VERIFIED items remain (B is PENDING_VERIFICATION) — the VERIFIED count is conserved at 1 -> 0 -> (1 after B verifies) with no instant where both A and B are VERIFIED"
            - "ProductOrder.${o_id}.engraving_text == \"\" (re-synced: no VERIFIED items) and synced_revision == Member.${m_id}.record_revision (parity restored)"
            - "Member.${m_id}.version incremented exactly once by the supersede (OCC discipline)"
