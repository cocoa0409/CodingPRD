# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Precinct Boundary & Redistricting Management — Expert
# 9 rules x >= 2 instances = 18 instances.
# Canonical fixture F1: Jurisdiction(target_district_count=2), blocks A(pop 1049,
# VAP 800, minority 500, reg 700) -> District 1, B(pop 951, VAP 700, minority 200,
# reg 600) -> District 2. total=2000, ideal=1000. District1 +4.90%, District2 -4.90%.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: plan_deviation_range_vs_maxabs
        grounds:
          - calculations.plan_deviation_metrics
          - entities.RedistrictingPlan.fields.max_abs_deviation_pct
          - entities.RedistrictingPlan.fields.overall_deviation_range_pct
        distinguishing_aspect: "For the identical +4.90%/-4.90% district pair, the max-absolute variant yields 4.90 while the overall-range variant yields 9.80 — same inputs, two divergent Plan-level numbers."
        test_recipe:
          setup:
            - "Jurisdiction J1 with target_district_count=2 and two census blocks A(pop 1049) and B(pop 951); ideal_district_population=1000."
            - "Plan P1 with District 1 (block A, +4.90%) and District 2 (block B, -4.90%); full partition."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J1", state_code: "CA", target_district_count: 2, required_majority_minority_districts: 0 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1049, voting_age_population: 800, minority_vap: 500, registered_voters: 700 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "B", population: 951, voting_age_population: 700, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkB: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "P1" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 1 }
              as: Cartographer
              captures: { d1: $.data.id }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 2 }
              as: Cartographer
              captures: { d2: $.data.id }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${blkA}", expected_plan_version: "${pv0}" }
              as: Cartographer
            - call: "GET /plans/${pid}"
              payload: {}
              as: Cartographer
              captures: { pv1: $.data.version }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d2}", census_block_id: "${blkB}", expected_plan_version: "${pv1}" }
              as: Cartographer
          trigger:
            - call: "GET /plans/${pid}"
              payload: {}
              as: Demographer
          assert:
            - "RedistrictingPlan.${pid}.max_abs_deviation_pct == 4.90"
            - "RedistrictingPlan.${pid}.overall_deviation_range_pct == 9.80"

      - name: precinct_voters_provisional_vs_certified
        grounds:
          - calculations.precinct_registered_voters
          - entities.Precinct.fields.voter_count_basis
          - entities.Precinct.fields.registered_voters
        distinguishing_aspect: "The same precinct blocks yield provisional 850 (= round(1000 VAP * 0.85)) while certification yields 812 (= sum of actual registered_voters) — a different Precinct-domain number for identical blocks."
        test_recipe:
          setup:
            - "Jurisdiction J with one census block (VAP 1000, registered_voters 812)."
            - "Precinct PR containing that block; PROVISIONAL basis gives registered_voters=850."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jp", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "G1", population: 1200, voting_age_population: 1000, minority_vap: 300, registered_voters: 812 }
              as: Cartographer
              captures: { blk: $.data.id }
            - call: "POST /jurisdictions/${jid}/precincts"
              payload: { name: "PR", census_block_ids: ["${blk}"] }
              as: ElectionClerk
              captures: { pr: $.data.id, prov_voters: $.data.registered_voters }
          trigger:
            - call: "POST /precincts/${pr}/certify"
              payload: {}
              as: ElectionClerk
              captures: { cert_voters: $.data.registered_voters }
          assert:
            - "Precinct.${pr}.registered_voters was 850 while PROVISIONAL (prov_voters == 850)"
            - "Precinct.${pr}.voter_count_basis == CERTIFIED after certify"
            - "Precinct.${pr}.registered_voters == 812 after certify (cert_voters == 812)"

  - rule_id: combinatorial_formula
    instances:
      - name: plan_compliance_gate_contiguity_flips
        grounds:
          - calculations.plan_compliance_gate
          - entities.District.fields.is_contiguous
          - entities.RedistrictingPlan.fields.is_compliant
        distinguishing_aspect: "Mode (a): with within_deviation=true and vra_floor_met=true, setting District 2's is_contiguous=false alone drives is_compliant=false — a >=3-input conjunction where one boolean overrides two passing conditions."
        test_recipe:
          setup:
            - "F1 partition (+4.90%/-4.90%, VRA floor 0) but District 2 created with is_contiguous=false."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jc", state_code: "CA", target_district_count: 2, required_majority_minority_districts: 0 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1049, voting_age_population: 800, minority_vap: 500, registered_voters: 700 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "B", population: 951, voting_age_population: 700, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkB: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "Pc" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 1, is_contiguous: true }
              as: Cartographer
              captures: { d1: $.data.id }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 2, is_contiguous: false }
              as: Cartographer
              captures: { d2: $.data.id }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${blkA}", expected_plan_version: "${pv0}" }
              as: Cartographer
            - call: "GET /plans/${pid}"
              payload: {}
              as: Cartographer
              captures: { pv1: $.data.version }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d2}", census_block_id: "${blkB}", expected_plan_version: "${pv1}" }
              as: Cartographer
          trigger:
            - call: "GET /plans/${pid}"
              payload: {}
              as: Cartographer
          assert:
            - "RedistrictingPlan.${pid}.max_abs_deviation_pct == 4.90"
            - "RedistrictingPlan.${pid}.is_compliant == false"

      - name: deviation_range_rounding_order
        grounds:
          - calculations.plan_deviation_metrics
          - entities.RedistrictingPlan.fields.overall_deviation_range_pct
        distinguishing_aspect: "Mode (b): with raw deviation_pcts 2.125 and -3.125, round-per-district-then-range gives 5.26 whereas range-raw-then-round gives 5.25; the pinned order yields exactly 5.26."
        test_recipe:
          setup:
            - "Jurisdiction with target_district_count=2 and blocks A2(817), B2(775), C2(8, unassigned); total=1600, ideal=800."
            - "District 1 = block A2 (+2.125% -> 2.13), District 2 = block B2 (-3.125% -> -3.13)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jr", state_code: "CA", target_district_count: 2 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A2", population: 817, voting_age_population: 600, minority_vap: 100, registered_voters: 500 }
              as: Cartographer
              captures: { a2: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "B2", population: 775, voting_age_population: 500, minority_vap: 100, registered_voters: 400 }
              as: Cartographer
              captures: { b2: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "C2", population: 8, voting_age_population: 6, minority_vap: 1, registered_voters: 5 }
              as: Cartographer
              captures: { c2: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "Pr" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 1 }
              as: Cartographer
              captures: { d1: $.data.id }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 2 }
              as: Cartographer
              captures: { d2: $.data.id }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${a2}", expected_plan_version: "${pv0}" }
              as: Cartographer
            - call: "GET /plans/${pid}"
              payload: {}
              as: Cartographer
              captures: { pv1: $.data.version }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d2}", census_block_id: "${b2}", expected_plan_version: "${pv1}" }
              as: Cartographer
          trigger:
            - call: "GET /plans/${pid}"
              payload: {}
              as: Cartographer
          assert:
            - "RedistrictingPlan.${pid}.max_abs_deviation_pct == 3.13"
            - "RedistrictingPlan.${pid}.overall_deviation_range_pct == 5.26"

  - rule_id: non_linear_state_machine
    instances:
      - name: plan_revision_cycle
        grounds:
          - state_machines.RedistrictingPlan.HEARING_SCHEDULED_to_UNDER_REVIEW
          - state_machines.RedistrictingPlan.COMMENT_OPEN_to_HEARING_SCHEDULED
        distinguishing_aspect: "Cyclic loop: a plan at HEARING_SCHEDULED returns to UNDER_REVIEW on request-revision (not a forward-only pipeline), and its SCHEDULED hearing is cancelled."
        test_recipe:
          setup:
            - "F1 plan P1 driven to HEARING_SCHEDULED with one SCHEDULED hearing H1."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jcy", state_code: "CA", target_district_count: 2, required_majority_minority_districts: 0 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1049, voting_age_population: 800, minority_vap: 500, registered_voters: 700 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "B", population: 951, voting_age_population: 700, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkB: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "P1" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 1 }
              as: Cartographer
              captures: { d1: $.data.id }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 2 }
              as: Cartographer
              captures: { d2: $.data.id }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${blkA}", expected_plan_version: "${pv0}" }
              as: Cartographer
            - call: "GET /plans/${pid}"
              payload: {}
              as: Cartographer
              captures: { pv1: $.data.version }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d2}", census_block_id: "${blkB}", expected_plan_version: "${pv1}" }
              as: Cartographer
            - call: "POST /plans/${pid}/submit-review"
              payload: {}
              as: Cartographer
            - call: "POST /plans/${pid}/compliance-checks"
              payload: { check_type: "POPULATION_DEVIATION" }
              as: Demographer
            - call: "POST /plans/${pid}/open-comment"
              payload: {}
              as: CommissionChair
            - call: "POST /jurisdictions/${jid}/venues"
              payload: { name: "City Hall", capacity: 100 }
              as: ElectionClerk
              captures: { vid: $.data.id }
            - call: "POST /plans/${pid}/hearings"
              payload: { venue_id: "${vid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: CommissionChair
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /plans/${pid}/request-revision"
              payload: {}
              as: Demographer
          assert:
            - "RedistrictingPlan.${pid}.status == UNDER_REVIEW"
            - "Hearing.${h1}.status == CANCELLED"

      - name: precinct_split_branch
        grounds:
          - state_machines.Precinct.ACTIVE_to_SPLIT
          - state_machines.Precinct.ACTIVE_to_RETIRED
        distinguishing_aspect: "Branching fork: ACTIVE Precinct forks into two child precincts on split with side effects (block reassignment, voter recompute) disjoint from the RETIRED/MERGED branches; parent ends in SPLIT, not a linear next-state."
        test_recipe:
          setup:
            - "Jurisdiction with precinct PR containing blocks S1(VAP 400) and S2(VAP 600)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jsp", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "S1", population: 500, voting_age_population: 400, minority_vap: 100, registered_voters: 350 }
              as: Cartographer
              captures: { s1: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "S2", population: 700, voting_age_population: 600, minority_vap: 200, registered_voters: 500 }
              as: Cartographer
              captures: { s2: $.data.id }
            - call: "POST /jurisdictions/${jid}/precincts"
              payload: { name: "PR", census_block_ids: ["${s1}", "${s2}"] }
              as: ElectionClerk
              captures: { pr: $.data.id }
          trigger:
            - call: "POST /precincts/${pr}/split"
              payload: { child_a_name: "PR-A", child_a_block_geoids: ["S1"], child_b_name: "PR-B", child_b_block_geoids: ["S2"] }
              as: ElectionClerk
          assert:
            - "Precinct.${pr}.status == SPLIT"
            - "Precinct.${pr}.registered_voters == 0"
            - "exactly two Precincts have parent_precinct_id == ${pr} (GET /precincts?parent_precinct_id=${pr} returns 2)"
            - "the child covering geoid S1 has registered_voters == 340 (round(400*0.85)); the child covering S2 has registered_voters == 510 (round(600*0.85))"

  - rule_id: transitive_cascade
    instances:
      - name: adopt_supersede_dismiss_cascade
        grounds:
          - state_machines.RedistrictingPlan.HEARING_SCHEDULED_to_ADOPTED
          - state_machines.RedistrictingPlan.HEARING_SCHEDULED_to_SUPERSEDED
          - state_machines.PublicComment.PENDING_to_DISMISSED
          - state_machines.Hearing.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Depth-3 chain: adopt(P1) -> sibling P2 -> SUPERSEDED (link1); P2's SUPERSEDED transition -> its PENDING comment -> DISMISSED (link2). Each link is caused by the previous, not directly by adopt."
        test_recipe:
          setup:
            - "F1 plan P1 at HEARING_SCHEDULED with HELD hearing H1 and compliant metrics."
            - "Sibling plan P2 (forked from P1) at HEARING_SCHEDULED with one PENDING comment CM2 and one SCHEDULED hearing H2."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jca", state_code: "CA", target_district_count: 2, required_majority_minority_districts: 0 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1049, voting_age_population: 800, minority_vap: 500, registered_voters: 700 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "B", population: 951, voting_age_population: 700, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkB: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "P1" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { p1: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${p1}/districts"
              payload: { district_number: 1 }
              as: Cartographer
              captures: { d1: $.data.id }
            - call: "POST /plans/${p1}/districts"
              payload: { district_number: 2 }
              as: Cartographer
              captures: { d2: $.data.id }
            - call: "POST /plans/${p1}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${blkA}", expected_plan_version: "${pv0}" }
              as: Cartographer
            - call: "GET /plans/${p1}"
              payload: {}
              as: Cartographer
              captures: { pv1: $.data.version }
            - call: "POST /plans/${p1}/block-assignments"
              payload: { district_id: "${d2}", census_block_id: "${blkB}", expected_plan_version: "${pv1}" }
              as: Cartographer
            - call: "POST /plans/${p1}/submit-review"
              payload: {}
              as: Cartographer
            - call: "POST /plans/${p1}/compliance-checks"
              payload: { check_type: "POPULATION_DEVIATION" }
              as: Demographer
            - call: "POST /plans/${p1}/open-comment"
              payload: {}
              as: CommissionChair
            - call: "POST /jurisdictions/${jid}/venues"
              payload: { name: "City Hall", capacity: 100 }
              as: ElectionClerk
              captures: { vid: $.data.id }
            - call: "POST /plans/${p1}/hearings"
              payload: { venue_id: "${vid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: CommissionChair
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: CommissionChair
            - call: "POST /hearings/${h1}/hold"
              payload: {}
              as: CommissionChair
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "P2", parent_plan_id: "${p1}" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { p2: $.data.id }
            - call: "POST /plans/${p2}/submit-review"
              payload: {}
              as: Cartographer
            - call: "POST /plans/${p2}/compliance-checks"
              payload: { check_type: "POPULATION_DEVIATION" }
              as: Demographer
            - call: "POST /plans/${p2}/open-comment"
              payload: {}
              as: CommissionChair
            - call: "POST /plans/${p2}/comments"
              payload: { commenter_name: "Jane", comment_text: "Please keep our neighborhood whole." }
              as: PublicParticipant
              captures: { cm2: $.data.id }
            - call: "POST /plans/${p2}/hearings"
              payload: { venue_id: "${vid}", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: CommissionChair
              captures: { h2: $.data.id }
          trigger:
            - call: "POST /plans/${p1}/adopt"
              payload: {}
              as: CommissionChair
              as_user_id: "u_chair"
          assert:
            - "RedistrictingPlan.${p1}.status == ADOPTED"
            - "RedistrictingPlan.${p2}.status == SUPERSEDED"
            - "PublicComment.${cm2}.disposition == DISMISSED"
            - "Hearing.${h2}.status == CANCELLED"

      - name: precinct_split_reassign_recompute
        grounds:
          - state_machines.Precinct.ACTIVE_to_SPLIT
          - entities.CensusBlock.fields.precinct_id
          - entities.Precinct.fields.registered_voters
        distinguishing_aspect: "Depth-2 chain from a DIFFERENT trigger (split): split mutates each CensusBlock.precinct_id (link1); that reassignment causes each child precinct's registered_voters to be recomputed (link2) — the recompute is downstream of the block move, not of the split verb."
        test_recipe:
          setup:
            - "Jurisdiction with precinct PR containing blocks S1(VAP 400) and S2(VAP 600)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jsr", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "S1", population: 500, voting_age_population: 400, minority_vap: 100, registered_voters: 350 }
              as: Cartographer
              captures: { s1: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "S2", population: 700, voting_age_population: 600, minority_vap: 200, registered_voters: 500 }
              as: Cartographer
              captures: { s2: $.data.id }
            - call: "POST /jurisdictions/${jid}/precincts"
              payload: { name: "PR", census_block_ids: ["${s1}", "${s2}"] }
              as: ElectionClerk
              captures: { pr: $.data.id }
          trigger:
            - call: "POST /precincts/${pr}/split"
              payload: { child_a_name: "PR-A", child_a_block_geoids: ["S1"], child_b_name: "PR-B", child_b_block_geoids: ["S2"] }
              as: ElectionClerk
          assert:
            - "CensusBlock.${s1}.precinct_id points at the new child precinct covering S1 (no longer ${pr})"
            - "CensusBlock.${s2}.precinct_id points at the new child precinct covering S2 (no longer ${pr})"
            - "the child covering S1 has registered_voters == 340; the child covering S2 has registered_voters == 510"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: adopt_state_beats_compliance
        grounds:
          - validations[priority=5]
          - validations[priority=11]
        distinguishing_aspect: "A single adopt on an UNDER_REVIEW, non-compliant plan violates both state (prio 5) and business_constraint/compliance (prio 11); the state error wins, so ERR_INVALID_STATE is returned, not ERR_PLAN_NOT_COMPLIANT."
        test_recipe:
          setup:
            - "Plan with both blocks assigned to District 1 (District 2 empty) -> +100%/-100% deviation, non-compliant; submitted to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jpc", state_code: "CA", target_district_count: 2 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1049, voting_age_population: 800, minority_vap: 500, registered_voters: 700 }
