          - calculations.engagement_fee_and_refund
        distinguishing_aspect: "The fee map is applied per credit_type exactly: a REVENUE engagement computes fee_cents 5200000 and an ENTERPRISE engagement 5800000 (GO's 4500000 is exercised throughout the other instances)."
        test_recipe:
