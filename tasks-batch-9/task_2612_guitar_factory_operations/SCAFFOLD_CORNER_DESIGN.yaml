            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-002", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot2: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot2}/moisture-readings", payload: { moisture_content_pct: 7.0 }, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot2}/condition", payload: {}, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot2}/release", payload: {}, as: WoodBuyer, captures: { lot2_v1: "$.data.version" } }
            - { call: "POST /billets", payload: { billet_code: "BLT-002", lot_id: "${lot2}", board_feet: 30.00, grade: "AAA", expected_tonewood_lot_version: "${lot2_v1}" }, as: Machinist, captures: { blt2: "$.data.id" } }
