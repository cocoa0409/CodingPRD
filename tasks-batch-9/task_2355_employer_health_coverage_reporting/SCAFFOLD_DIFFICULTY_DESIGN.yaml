            - call: "POST /ale-reporting/transmittals/${t1_id}/agency-response"
              payload: { response_status: "ACCEPTED", receipt_id: "AIR-2026-0006" }
              as: FilingAgent
              as_user_id: "agent-1"
            - call: "POST /ale-reporting/penalty-notices"
              payload: { controlled_group_id: "${group_id}", notice_number: "226J-2026-0013", notice_date: "2027-05-01", response_due_date: "2027-06-30", proposed_amount_cents: 1000000, asserted_a_months: [1, 2], asserted_b_employee_months: [{ employee_id: "${e1_id}", month: 1 }, { employee_id: "${e1_id}", month: 5 }, { employee_id: "${e1_id}", month: 6 }, { employee_id: "${e1_id}", month: 7 }] }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { notice_id: $.data.id }
            - call: "POST /ale-reporting/penalty-notices/${notice_id}/evidence"
              payload: { evidence_type: "MEC_OFFER_PROOF", month: 2, document_ref: "DOC-MEC-M2" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /ale-reporting/penalty-notices/${notice_id}/evidence"
              payload: { evidence_type: "FT_STATUS_DISPUTE", month: 5, document_ref: "DOC-FT-M5", employee_id: "${e1_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /ale-reporting/penalty-notices/${notice_id}/recompute"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /ale-reporting/penalty-notices/${notice_id}/allocation/reset"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "PenaltyNotice.${notice_id}.recalculated_amount_cents == 345700 (unchanged by the reset)"
            - "PenaltyNotice.${notice_id}.allocated_total_cents == 0"
            - "PenaltyNotice.${notice_id}.unallocated_amount_cents == 345700"
            - "GroupMember.${member_a_id}.allocated_penalty_cents == 0 and GroupMember.${member_b_id}.allocated_penalty_cents == 0"
            - "PenaltyNotice.${notice_id}.unallocated_amount_cents + GroupMember.${member_a_id}.allocated_penalty_cents + GroupMember.${member_b_id}.allocated_penalty_cents == 345700"
            - "PenaltyNotice.${notice_id}.status == RECOMPUTED"
            - "GroupMember.${member_a_id}.allocated_exclusion_employees == 22 and GroupMember.${member_b_id}.allocated_exclusion_employees == 8 (the exclusion split is not reset)"
            - "PenaltyNotice.${notice_id}.a_month_penalty_cents == 271700 and b_month_penalty_cents == 74000"
