            - call: "GET /caption-ad/live-assignments?live_event_id=${ev}&assignment_status=OFFERED"
              payload: {}
              as: Scheduler
              captures: { asg_2: "$.data[0].id", asg_2_steno: "$.data[0].stenographer_id", asg_2_origin: "$.data[0].origin" }
            - call: "POST /caption-ad/live-assignments/${asg_2}/decline"
              payload: {}
              as: Stenographer
              as_user_id: "${s_2}"
            - call: "GET /caption-ad/live-assignments?live_event_id=${ev}&assignment_status=OFFERED"
              payload: {}
              as: Scheduler
          assert:
            - "After S1 declines: exactly one new OFFERED assignment to ${s_2} with origin AUTO_OFFER"
            - "After S2 declines: pool is empty (both excluded by decline memory) — zero OFFERED assignments, no error surfaced"
            - "S1 is never re-offered this event (decliner exclusion is permanent for the event)"

      - name: ytd_reconciles_on_deliver
        claim_type: derived_field_reconciliation
        grounds: [entities.Client.fields.ytd_completed_minutes]
        excluded_because:
          difficulty_instance: quote_evaluation_order_pinned
          rationale: "The §1.8 quote instance asserts Client.ytd_completed_minutes == 5000 exactly after delivering a 300000s order — the deliver-side reconciliation is covered there."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_amend
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, endpoints]
        distinguishing_aspect: "Immediate consistency: a successful PATCH amend returns the recomputed quote in its own response, and a subsequent GET reflects the same values with no lag."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z; INTERNAL client; RECEIVED 3600s asset; EXPRESS order QUOTED at 44250"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Acme", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "P", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "EXPRESS", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
              captures: { wo_v: $.data.version, q_0: $.data.quoted_price_cents }
          trigger:
            - call: "PATCH /caption-ad/work-orders/${wo_a}"
              payload: { turnaround_tier: "RUSH", expected_work_order_version: "${wo_v}" }
              as: IntakeCoordinator
              captures: { q_1: $.data.quoted_price_cents, tier_1: $.data.turnaround_tier }
            - call: "GET /caption-ad/work-orders/${wo_a}"
              payload: {}
              as: Scheduler
              captures: { q_2: $.data.quoted_price_cents, tier_2: $.data.turnaround_tier }
          assert:
            - "Initial quote == 44250; PATCH response shows tier RUSH and quote 54000 in the same response"
            - "GET immediately after returns identical tier/quote — no eventual-consistency lag"
