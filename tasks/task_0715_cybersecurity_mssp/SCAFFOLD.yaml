# =============================================================================
# PRD-bench task 0715 — Authorized Cybersecurity Assessment & Managed Defense
# (MSSP/SOC) seed tables. Difficulty band: EXPERT (§0.4).
# =============================================================================

scenario: |
  Authorized Cybersecurity Assessment & Managed Defense (MSSP/SOC style):
  asset/scope & engagement authorization, vulnerability scan & sanctioned
  pen-test, finding severity & remediation tracking, SIEM/EDR monitoring &
  alert triage, incident response & escalation, compliance (SOC 2/HIPAA/PCI)
  audit support, retainer/tier, reporting

domain_name: cybersecurity-mssp
api_prefix: /
# Flat topology: entities are top-level peer collections linked by foreign
# keys (no nesting in URL paths), so the API has no single shared resource
# prefix. Every child is discovered via a filtered-list GET on its own
# collection (e.g., GET /scans?engagement_id=...).

complexity_profile:
  primary_archetype: compliance/audit
  secondary_archetype: quota / allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting in URL paths. Every
  # write carries the FK in the body, every read finds children via a
  # filtered-list GET on the child collection.

  state_machine_shape: cyclic
  # Finding has a revision loop (REMEDIATION_SUBMITTED -> RETEST_FAILED ->
  # REMEDIATION_IN_PROGRESS); Engagement is branching/guarded; Incident is
  # cyclic (CONTAINED -> REOPENED); Alert is branching fork-join. Multiple
  # non-linear machines on different entities.

  relationship_patterns:
    - one_to_many        # Client 1—* Engagement / Asset / Alert / Incident / Report
    - flat_foreign_key   # Scan.engagement_id, Finding.scan_id, Evidence.audit_id
    - cross_aggregate    # Incident.triggering_alert_id, Finding.linked_incident_id

  role_model: segregation_of_duties
  # The analyst who SUBMITS a pen-test finding cannot be the lead who
  # ACCEPTS the client's remediation (separation of duties). PlatformAdmin
  # is opaque; ClientContact / SocAnalyst / EngagementLead / Auditor are
  # the operating roles.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client organization name" }
      - { name: tier, type: enum, source: input, description: "Service tier", constraints: "one of {ESSENTIAL, ADVANCED, ELITE}" }
      - { name: retainer_hours_per_period, type: number, source: input, description: "Hours of managed-defense labor granted per billing period", constraints: ">= 0" }
      - { name: current_period_index, type: integer, source: system, default: 0, description: "Billing-period counter; incremented by POST /clients/{id}/advance-period" }
      - { name: posture, type: enum, source: computed, description: "Derived defense posture gating engagement/scan ops: OPEN | HEIGHTENED | LOCKDOWN. HEIGHTENED when any open Incident severity >= HIGH; LOCKDOWN when any Incident in ESCALATED.", constraints: "one of {OPEN, HEIGHTENED, LOCKDOWN}" }
      - { name: open_critical_findings, type: integer, source: computed, default: 0, description: "Count of Findings with severity CRITICAL and status not in {ACCEPTED, RISK_ACCEPTED, FALSE_POSITIVE}" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | OFFBOARDED" }

  - name: RetainerLedger
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: period_index, type: integer, source: input, description: "Billing period this ledger row covers" }
      - { name: hours_granted, type: number, source: system, description: "Snapshot of Client.retainer_hours_per_period at period open" }
      - { name: hours_reserved, type: number, source: computed, default: 0, description: "Hours reserved by AUTHORIZED engagements/scans not yet completed in this period" }
      - { name: hours_consumed, type: number, source: computed, default: 0, description: "Hours actually consumed by COMPLETED scans + RESOLVED incidents in this period" }
      - { name: hours_available, type: number, source: computed, description: "= hours_granted - hours_reserved - hours_consumed (may be negative only via overage policy)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED (closed by advance-period)" }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: kind, type: enum, source: input, description: "VULN_SCAN | PENTEST", constraints: "one of {VULN_SCAN, PENTEST}" }
      - { name: authorized_window_start, type: datetime, source: input, description: "ISO8601 UTC; sanctioned testing may not start before this" }
      - { name: authorized_window_end, type: datetime, source: input, description: "ISO8601 UTC; sanctioned testing may not run after this" }
      - { name: estimated_hours, type: number, source: input, description: "Labor hours this engagement reserves against the retainer", constraints: "> 0" }
      - { name: scope_asset_ids, type: array, source: input, description: "Asset ids explicitly in scope; pentest may only touch these" }
      - { name: authorization_signed_by, type: string, source: system, description: "ClientContact X-User-ID who signed authorization (null until AUTHORIZED)" }
      - { name: period_index, type: integer, source: system, description: "Client.current_period_index captured at AUTHORIZED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | AUTHORIZED | ACTIVE | COMPLETED | CANCELLED | EXPIRED" }

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: hostname, type: string, source: input, description: "Asset hostname / identifier; unique per client among non-DECOMMISSIONED assets" }
      - { name: ip_address, type: string, source: input, description: "Primary IP" }
      - { name: criticality, type: enum, source: input, description: "Business criticality", constraints: "one of {LOW, MEDIUM, HIGH, CROWN_JEWEL}" }
      - { name: exposure, type: enum, source: input, default: "INTERNAL", description: "INTERNAL | EXTERNAL" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | QUARANTINED | DECOMMISSIONED" }

  - name: Scan
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from engagement" }
      - { name: started_at, type: datetime, source: system, description: "ISO8601 UTC stamped at RUNNING; must fall within engagement authorized window" }
      - { name: completed_at, type: datetime, source: system, description: "ISO8601 UTC stamped at COMPLETED (null otherwise)" }
      - { name: actual_hours, type: number, source: input, description: "Hours the scan actually consumed, supplied at completion", constraints: ">= 0" }
      - { name: raw_finding_count, type: integer, source: input, default: 0, description: "Number of raw findings the scan reported, supplied at completion" }
      - { name: status, type: enum, source: system, default: "QUEUED", description: "QUEUED | RUNNING | COMPLETED | ABORTED" }

  - name: Finding
    parent: null
    common_fields: true
    fields:
      - { name: scan_id, type: string, source: input, description: "FK -> Scan.id" }
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from scan" }
      - { name: title, type: string, source: input, description: "Short finding title" }
      - { name: cvss_base, type: number, source: input, description: "CVSS base score 0.0-10.0", constraints: ">= 0 and <= 10" }
      - { name: severity, type: enum, source: computed, description: "Derived from cvss_base and asset criticality escalation; one of {INFO, LOW, MEDIUM, HIGH, CRITICAL}" }
      - { name: sla_due_at, type: datetime, source: computed, description: "Remediation SLA deadline = finding created_at + tier/severity SLA hours" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "True once clock passes sla_due_at while status not in a closed remediation state" }
      - { name: submitted_by, type: string, source: system, description: "SocAnalyst/EngagementLead X-User-ID who created the finding (segregation-of-duties anchor)" }
      - { name: accepted_by, type: string, source: system, description: "X-User-ID who accepted remediation (must differ from submitted_by)" }
      - { name: linked_incident_id, type: string, source: system, description: "FK -> Incident.id; set when a CRITICAL finding escalates into an incident (null otherwise)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | REMEDIATION_IN_PROGRESS | REMEDIATION_SUBMITTED | RETEST_FAILED | REMEDIATED | RISK_ACCEPTED | FALSE_POSITIVE" }

  - name: Alert
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id (the asset the alert fired on)" }
      - { name: source, type: enum, source: input, description: "SIEM | EDR", constraints: "one of {SIEM, EDR}" }
      - { name: raw_score, type: number, source: input, description: "Detector confidence 0-100", constraints: ">= 0 and <= 100" }
      - { name: triage_priority, type: enum, source: computed, description: "Derived P1..P4 from weighted_scoring of raw_score, asset criticality, exposure" }
      - { name: triaged_by, type: string, source: system, description: "SocAnalyst X-User-ID who triaged" }
      - { name: promoted_incident_id, type: string, source: system, description: "FK -> Incident.id; set when alert is promoted to an incident" }
      - { name: status, type: enum, source: system, default: "NEW", description: "NEW | TRIAGED | DISMISSED | PROMOTED" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: triggering_alert_id, type: string, source: input, description: "FK -> Alert.id (the alert promoted into this incident); null for findings-originated incidents" }
      - { name: severity, type: enum, source: input, description: "Initial severity", constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}" }
      - { name: response_hours, type: number, source: input, default: 0, description: "Labor hours consumed by IR work, supplied at resolution", constraints: ">= 0" }
      - { name: escalation_deadline_at, type: datetime, source: computed, description: "Acknowledged-by deadline = created_at + tier/severity response SLA hours" }
      - { name: escalation_breached, type: boolean, source: computed, default: false, description: "True once clock passes escalation_deadline_at while still in DETECTED" }
      - { name: contained_count, type: integer, source: computed, default: 0, description: "Number of times this incident has entered CONTAINED (increments each containment cycle)" }
      - { name: resolved_period_index, type: integer, source: system, default: null, description: "Client.current_period_index captured when the incident last entered RESOLVED (null until first resolution)" }
      - { name: quarantined_asset_id, type: string, source: system, default: null, description: "FK -> Asset.id; the asset quarantined during containment, cleared on resolve (null when none)" }
      - { name: status, type: enum, source: system, default: "DETECTED", description: "DETECTED | ACKNOWLEDGED | CONTAINED | ESCALATED | RESOLVED | REOPENED" }

  - name: ComplianceAudit
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: framework, type: enum, source: input, description: "Compliance framework", constraints: "one of {SOC2, HIPAA, PCI}" }
      - { name: required_control_count, type: integer, source: input, description: "Number of controls that must each have at least one APPROVED evidence item", constraints: "> 0" }
      - { name: readiness_pct, type: number, source: computed, default: 0, description: "Percent of required controls covered by >=1 APPROVED evidence; 2 decimals" }
      - { name: status, type: enum, source: system, default: "PLANNING", description: "PLANNING | FIELDWORK | READY | ATTESTED | FAILED" }

  - name: AuditEvidence
    parent: null
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: input, description: "FK -> ComplianceAudit.id" }
      - { name: control_ref, type: string, source: input, description: "Control identifier this evidence covers (e.g., CC6.1)" }
      - { name: finding_id, type: string, source: input, default: null, description: "FK -> Finding.id; optional link to a remediated finding used as evidence" }
      - { name: submitted_by, type: string, source: system, description: "Auditor/EngagementLead X-User-ID who submitted" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | APPROVED | REJECTED" }

  - name: Report
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: kind, type: enum, source: input, description: "Report kind", constraints: "one of {ASSESSMENT, INCIDENT, COMPLIANCE, RETAINER}" }
      - { name: subject_id, type: string, source: input, default: null, description: "Optional id of the Engagement/Incident/ComplianceAudit the report summarizes" }
      - { name: snapshot, type: object, source: computed, description: "Frozen denormalized metrics captured at generation (counts, hours, readiness)" }
      - { name: status, type: enum, source: system, default: "GENERATED", description: "GENERATED | PUBLISHED | RETRACTED" }

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role that performed the action" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID that performed the action" }
      - { name: action, type: string, source: system, description: "Action verb (e.g., FINDING_ACCEPTED, INCIDENT_ESCALATED)" }
      - { name: target_entity, type: string, source: system, description: "Entity type the action targeted" }
      - { name: target_id, type: string, source: system, description: "Id of the targeted entity" }
      - { name: prev_hash, type: string, source: system, description: "Hash of the previous AuditLogEntry for this client (tamper-evident chain; empty for first)" }
      - { name: entry_hash, type: string, source: system, description: "Hash over (prev_hash, action, target_id, created_at) — tamper-evident" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Engagement
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: AUTHORIZED
        trigger: "POST /engagements/{id}/authorize"
        actor: ClientContact
        preconditions:
          - "Client.status == ACTIVE"
          - "Client.posture != LOCKDOWN (ERR_POSTURE_LOCKDOWN — no new authorizations while client in LOCKDOWN)"
          - "every id in scope_asset_ids is an Asset with client_id == this.client_id and status == ACTIVE (ERR_SCOPE_ASSET_INVALID)"
          - "if kind == PENTEST: no other Engagement in {AUTHORIZED, ACTIVE} of kind PENTEST shares any asset in scope_asset_ids whose half-open interval [authorized_window_start, authorized_window_end) overlaps this one (ERR_WINDOW_OVERLAP — adjacent windows where one's end == the other's start do NOT conflict)"
          - "RetainerLedger for (client_id, Client.current_period_index) is OPEN and hours_available >= estimated_hours (ERR_RETAINER_EXHAUSTED)"
        side_effects:
          - "set authorization_signed_by = X-User-ID; set period_index = Client.current_period_index"
          - "RetainerLedger.hours_reserved += estimated_hours (reserves retainer hours)"
          - "RetainerLedger.hours_available recomputed"
          - "append AuditLogEntry(action=ENGAGEMENT_AUTHORIZED)"
      - from: AUTHORIZED
        to: ACTIVE
        trigger: "POST /engagements/{id}/start"
        actor: EngagementLead
        preconditions:
          - "clock >= authorized_window_start AND clock <= authorized_window_end (ERR_OUTSIDE_WINDOW)"
          - "Client.posture != LOCKDOWN (ERR_POSTURE_LOCKDOWN)"
        side_effects:
          - "append AuditLogEntry(action=ENGAGEMENT_STARTED)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /engagements/{id}/complete"
        actor: EngagementLead
        preconditions:
          - "no Scan under this engagement is in {QUEUED, RUNNING} (ERR_SCANS_IN_FLIGHT)"
        side_effects:
          - "release any still-reserved hours: RetainerLedger.hours_reserved -= (estimated_hours - sum of COMPLETED scan actual_hours already moved to consumed); floor at 0"
          - "append AuditLogEntry(action=ENGAGEMENT_COMPLETED)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: EngagementLead
        preconditions: []
        side_effects:
          - "append AuditLogEntry(action=ENGAGEMENT_CANCELLED)"
      - from: AUTHORIZED
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: EngagementLead
        preconditions: []
        side_effects:
          - "RetainerLedger.hours_reserved -= estimated_hours (releases the full reservation; compensating action — see invariant retainer_reservation_conserved)"
          - "RetainerLedger.hours_available recomputed"
          - "append AuditLogEntry(action=ENGAGEMENT_CANCELLED)"
      - from: AUTHORIZED
        to: EXPIRED
        trigger: "system, on POST /clients/{id}/advance-period when clock > authorized_window_end and engagement never started"
        actor: system
        preconditions: []
        side_effects:
          - "RetainerLedger.hours_reserved -= estimated_hours (releases reservation on expiry; compensating action)"
          - "append AuditLogEntry(action=ENGAGEMENT_EXPIRED)"

  - entity: Scan
    initial_state: QUEUED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "POST /scans/{id}/start"
        actor: EngagementLead
        preconditions:
          - "parent Engagement.status == ACTIVE (ERR_ENGAGEMENT_NOT_ACTIVE) — cross-entity dependency"
          - "clock within parent Engagement authorized window (ERR_OUTSIDE_WINDOW)"
          - "no other Scan in status RUNNING under the same engagement whose [started_at, started_at + 24 hours (SCAN_COOLDOWN_HOURS)] closed buffered interval contains clock (ERR_SCAN_WINDOW_OVERLAP — closed-interval-with-buffer collision; a new scan may not start within 24 hours (SCAN_COOLDOWN_HOURS) of another running scan on the same engagement)"
        side_effects:
          - "set started_at = clock"
          - "append AuditLogEntry(action=SCAN_STARTED)"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /scans/{id}/complete"
        actor: EngagementLead
        preconditions:
          - "actual_hours supplied and >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "set completed_at = clock; persist actual_hours, raw_finding_count"
          - "RetainerLedger.hours_consumed += actual_hours; RetainerLedger.hours_reserved -= min(actual_hours, remaining reservation of parent engagement); floor reserved at 0 (cascade: scan completion debits the ledger)"
          - "RetainerLedger.hours_available recomputed"
          - "append AuditLogEntry(action=SCAN_COMPLETED)"
      - from: QUEUED
        to: ABORTED
        trigger: "POST /scans/{id}/abort"
        actor: EngagementLead
        preconditions: []
        side_effects:
          - "append AuditLogEntry(action=SCAN_ABORTED)"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /scans/{id}/abort"
        actor: EngagementLead
        preconditions: []
        side_effects:
          - "no ledger consumption (scan never reported actual_hours)"
          - "append AuditLogEntry(action=SCAN_ABORTED)"

  - entity: Finding
    initial_state: OPEN
    terminal_states: [REMEDIATED, RISK_ACCEPTED, FALSE_POSITIVE]
    transitions:
      - from: OPEN
        to: REMEDIATION_IN_PROGRESS
        trigger: "POST /findings/{id}/start-remediation"
        actor: ClientContact
        preconditions:
          - "parent Scan.status == COMPLETED (ERR_SCAN_NOT_COMPLETED)"
        side_effects:
          - "append AuditLogEntry(action=REMEDIATION_STARTED)"
      - from: REMEDIATION_IN_PROGRESS
        to: REMEDIATION_SUBMITTED
        trigger: "POST /findings/{id}/submit-remediation"
        actor: ClientContact
        preconditions: []
        side_effects:
          - "append AuditLogEntry(action=REMEDIATION_SUBMITTED)"
      - from: REMEDIATION_SUBMITTED
        to: RETEST_FAILED
        trigger: "POST /findings/{id}/retest"
        actor: EngagementLead
        preconditions:
          - "request body retest_passed == false"
          - "acting EngagementLead X-User-ID != Finding.submitted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "append AuditLogEntry(action=RETEST_FAILED)"
      - from: RETEST_FAILED
        to: REMEDIATION_IN_PROGRESS
        trigger: "POST /findings/{id}/start-remediation"
        actor: ClientContact
        preconditions: []
        note: "Revision loop (cycle): a failed retest sends the finding back to remediation."
        side_effects:
          - "append AuditLogEntry(action=REMEDIATION_RESTARTED)"
      - from: REMEDIATION_SUBMITTED
        to: REMEDIATED
        trigger: "POST /findings/{id}/retest"
        actor: EngagementLead
        preconditions:
          - "request body retest_passed == true"
          - "acting EngagementLead X-User-ID != Finding.submitted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "set accepted_by = X-User-ID"
          - "recompute Client.open_critical_findings"
          - "if this was the last open CRITICAL finding feeding an incident link, the linked Incident is unaffected (incidents close independently)"
          - "append AuditLogEntry(action=FINDING_REMEDIATED)"
      - from: OPEN
        to: RISK_ACCEPTED
        trigger: "POST /findings/{id}/accept-risk"
        actor: ClientContact
        preconditions:
          - "Finding.severity != CRITICAL (ERR_CANNOT_ACCEPT_CRITICAL — CRITICAL findings may not be risk-accepted)"
        side_effects:
          - "recompute Client.open_critical_findings"
          - "append AuditLogEntry(action=RISK_ACCEPTED)"
      - from: OPEN
        to: FALSE_POSITIVE
        trigger: "POST /findings/{id}/mark-false-positive"
        actor: EngagementLead
        preconditions:
          - "acting EngagementLead X-User-ID != Finding.submitted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "recompute Client.open_critical_findings"
          - "append AuditLogEntry(action=FALSE_POSITIVE)"

  - entity: Alert
    initial_state: NEW
    terminal_states: [DISMISSED, PROMOTED]
    transitions:
      - from: NEW
        to: TRIAGED
        trigger: "POST /alerts/{id}/triage"
        actor: SocAnalyst
        preconditions:
          - "Alert.asset_id resolves to an Asset with status != DECOMMISSIONED (ERR_ASSET_DECOMMISSIONED)"
        side_effects:
          - "set triaged_by = X-User-ID"
          - "append AuditLogEntry(action=ALERT_TRIAGED)"
      - from: TRIAGED
        to: DISMISSED
        trigger: "POST /alerts/{id}/dismiss"
        actor: SocAnalyst
        preconditions:
          - "Alert.triage_priority in {P3, P4} (ERR_CANNOT_DISMISS_HIGH_PRIORITY — P1/P2 alerts must be promoted, not dismissed)"
        side_effects:
          - "append AuditLogEntry(action=ALERT_DISMISSED)"
      - from: TRIAGED
        to: PROMOTED
        trigger: "POST /alerts/{id}/promote"
        actor: SocAnalyst
        preconditions:
          - "Client.status == ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "create Incident{client_id, triggering_alert_id=this.id, severity = map(triage_priority)} in DETECTED (cascade: alert promotion births an incident)"
          - "set promoted_incident_id = new Incident.id"
          - "recompute Client.posture (incident may raise posture to HEIGHTENED/LOCKDOWN)"
          - "append AuditLogEntry(action=ALERT_PROMOTED)"

  - entity: Incident
    initial_state: DETECTED
    terminal_states: [RESOLVED]
    transitions:
      - from: DETECTED
        to: ACKNOWLEDGED
        trigger: "POST /incidents/{id}/acknowledge"
        actor: SocAnalyst
        preconditions: []
        side_effects:
          - "append AuditLogEntry(action=INCIDENT_ACKNOWLEDGED)"
      - from: ACKNOWLEDGED
        to: CONTAINED
        trigger: "POST /incidents/{id}/contain"
        actor: SocAnalyst
        preconditions:
          - "request body quarantine_asset == true requires the Alert/Incident asset to be ACTIVE"
        side_effects:
          - "contained_count += 1"
          - "if quarantine_asset == true: set the triggering Alert's Asset.status = QUARANTINED and set Incident.quarantined_asset_id = that Asset.id (cross-entity cascade)"
          - "append AuditLogEntry(action=INCIDENT_CONTAINED)"
      - from: DETECTED
        to: ESCALATED
        trigger: "POST /incidents/{id}/escalate"
        actor: EngagementLead
        preconditions:
          - "Incident.severity in {HIGH, CRITICAL} (ERR_CANNOT_ESCALATE_LOW)"
        side_effects:
          - "recompute Client.posture -> LOCKDOWN (cascade: escalation drives client into LOCKDOWN, freezing new engagement authorizations and starts)"
          - "append AuditLogEntry(action=INCIDENT_ESCALATED)"
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "POST /incidents/{id}/escalate"
        actor: EngagementLead
        preconditions:
          - "Incident.severity in {HIGH, CRITICAL} (ERR_CANNOT_ESCALATE_LOW)"
        side_effects:
          - "recompute Client.posture -> LOCKDOWN"
          - "append AuditLogEntry(action=INCIDENT_ESCALATED)"
      - from: CONTAINED
        to: RESOLVED
        trigger: "POST /incidents/{id}/resolve"
        actor: EngagementLead
        preconditions:
          - "response_hours supplied and >= 0 (ERR_INVALID_REQUEST)"
          - "RetainerLedger for (client_id, Client.current_period_index) is OPEN (ERR_PERIOD_CLOSED)"
        side_effects:
          - "set resolved_period_index = Client.current_period_index"
          - "RetainerLedger.hours_consumed += response_hours; hours_available recomputed (cascade: IR labor debits retainer)"
          - "recompute Client.posture (resolving may drop posture back to OPEN/HEIGHTENED)"
          - "if quarantined_asset_id is set, set that Asset.status = ACTIVE and clear quarantined_asset_id (compensation: containment quarantine is reversed on resolve — see invariant asset_quarantine_conserved)"
          - "append AuditLogEntry(action=INCIDENT_RESOLVED)"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /incidents/{id}/resolve"
        actor: EngagementLead
        preconditions:
          - "response_hours supplied and >= 0 (ERR_INVALID_REQUEST)"
          - "RetainerLedger for (client_id, Client.current_period_index) is OPEN (ERR_PERIOD_CLOSED)"
        side_effects:
          - "set resolved_period_index = Client.current_period_index"
          - "RetainerLedger.hours_consumed += response_hours; hours_available recomputed"
          - "recompute Client.posture (LOCKDOWN lifts when no remaining ESCALATED incident)"
          - "if quarantined_asset_id is set, set that Asset.status = ACTIVE and clear quarantined_asset_id (compensation)"
          - "append AuditLogEntry(action=INCIDENT_RESOLVED)"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /incidents/{id}/reopen"
        actor: SocAnalyst
        preconditions:
          - "Client.current_period_index == Incident.resolved_period_index (ERR_REOPEN_WINDOW_CLOSED — reopen allowed only in the same period the incident was resolved)"
        note: "Cycle: a resolved incident can be reopened, returning it to active handling."
        side_effects:
          - "recompute Client.posture (reopen may re-raise posture)"
          - "append AuditLogEntry(action=INCIDENT_REOPENED)"
      - from: REOPENED
        to: CONTAINED
        trigger: "POST /incidents/{id}/contain"
        actor: SocAnalyst
        preconditions: []
        side_effects:
          - "contained_count += 1"
          - "append AuditLogEntry(action=INCIDENT_CONTAINED)"

  - entity: ComplianceAudit
    initial_state: PLANNING
    terminal_states: [ATTESTED, FAILED]
    transitions:
      - from: PLANNING
        to: FIELDWORK
        trigger: "POST /audits/{id}/begin-fieldwork"
        actor: Auditor
        preconditions: []
        side_effects:
          - "append AuditLogEntry(action=AUDIT_FIELDWORK)"
      - from: FIELDWORK
        to: READY
        trigger: "POST /audits/{id}/mark-ready"
        actor: Auditor
        preconditions:
          - "readiness_pct == 100.00 (ERR_AUDIT_NOT_READY — all required controls must be covered by APPROVED evidence)"
          - "Client.open_critical_findings == 0 (ERR_OPEN_CRITICAL_FINDINGS — cross-entity dependency: audit cannot be ready while client has open CRITICAL findings)"
        side_effects:
          - "append AuditLogEntry(action=AUDIT_READY)"
      - from: READY
        to: ATTESTED
        trigger: "POST /audits/{id}/attest"
        actor: Auditor
        preconditions:
          - "acting Auditor X-User-ID has not submitted any AuditEvidence for this audit (ERR_SEGREGATION_OF_DUTIES — attester must differ from any evidence submitter)"
        side_effects:
          - "append AuditLogEntry(action=AUDIT_ATTESTED)"
      - from: FIELDWORK
        to: FAILED
        trigger: "POST /audits/{id}/fail"
        actor: Auditor
        preconditions: []
        side_effects:
          - "append AuditLogEntry(action=AUDIT_FAILED)"
      - from: READY
        to: FIELDWORK
        trigger: "POST /audits/{id}/reopen-fieldwork"
        actor: Auditor
        preconditions: []
        note: "Cycle: a READY audit drops back to FIELDWORK when new evidence is required."
        side_effects:
          - "append AuditLogEntry(action=AUDIT_REOPENED)"

  - entity: AuditEvidence
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /evidence/{id}/approve"
        actor: Auditor
        preconditions:
          - "parent ComplianceAudit.status == FIELDWORK (ERR_AUDIT_NOT_IN_FIELDWORK)"
          - "acting Auditor X-User-ID != AuditEvidence.submitted_by (ERR_SEGREGATION_OF_DUTIES — approver must differ from submitter)"
        side_effects:
          - "recompute parent ComplianceAudit.readiness_pct (cascade)"
          - "append AuditLogEntry(action=EVIDENCE_APPROVED)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /evidence/{id}/reject"
        actor: Auditor
        preconditions:
          - "acting Auditor X-User-ID != AuditEvidence.submitted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "recompute parent ComplianceAudit.readiness_pct"
          - "append AuditLogEntry(action=EVIDENCE_REJECTED)"

  - entity: Report
    initial_state: GENERATED
    terminal_states: [RETRACTED]
    transitions:
      - from: GENERATED
        to: PUBLISHED
        trigger: "POST /reports/{id}/publish"
        actor: EngagementLead
        preconditions:
          - "Client.posture != LOCKDOWN (ERR_POSTURE_LOCKDOWN — reports may not be published while client in LOCKDOWN)"
        side_effects:
          - "append AuditLogEntry(action=REPORT_PUBLISHED)"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /reports/{id}/retract"
        actor: EngagementLead
        preconditions: []
        side_effects:
          - "append AuditLogEntry(action=REPORT_RETRACTED)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: scan-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /scans"
    occ_field: "expected_engagement_version"
    description: |
      Creating a Scan against an Engagement whose version has advanced since
      the client last observed it is rejected. An Engagement's version bumps
      when it transitions (e.g., DRAFT->AUTHORIZED reserves retainer hours, or
      a sibling scan creation under the same engagement bumps it); a Scan create
      that still carries the engagement version the client previously read is
      rejected as stale, because the engagement state it was authorized against
      may no longer hold.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: evidence-create-stale-audit
    parent_entity: ComplianceAudit
    write_endpoint: "POST /evidence"
    occ_field: "expected_audit_version"
    description: |
      Submitting AuditEvidence against a ComplianceAudit whose version has
      advanced since the submitter last observed it is rejected. The audit's
      version bumps when it changes phase (PLANNING->FIELDWORK) or when a sibling
      evidence approval recomputes readiness_pct; an evidence submission still
      carrying a stale audit version is rejected so the submitter re-reads the
      audit phase before contributing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: finding_severity
    trigger: "on POST /findings (creation) and on any change to the asset criticality referenced by the finding"
    algorithm: threshold
    formula: |
      # Step 1: base band from CVSS (pin order: band first, then escalate)
      if cvss_base == 0.0:        base = INFO
      elif cvss_base < 4.0:       base = LOW       # 0.1 .. 3.9
      elif cvss_base < 7.0:       base = MEDIUM    # 4.0 .. 6.9
      elif cvss_base < 9.0:       base = HIGH      # 7.0 .. 8.9
      else:                       base = CRITICAL  # 9.0 .. 10.0
      # Step 2: criticality escalation — CROWN_JEWEL bumps severity up exactly one
      # band (capped at CRITICAL); HIGH bumps up one band ONLY if base is MEDIUM
      # or HIGH; LOW/MEDIUM criticality never escalate.
      bands = [INFO, LOW, MEDIUM, HIGH, CRITICAL]
      idx = bands.index(base)
      if asset.criticality == CROWN_JEWEL:
          idx = min(idx + 1, 4)
      elif asset.criticality == HIGH and base in {MEDIUM, HIGH}:
          idx = min(idx + 1, 4)
      severity = bands[idx]
    input_set: "single Finding plus its linked Asset.criticality"
    constants:
      CVSS_LOW_FLOOR: 0.1
      CVSS_MEDIUM_FLOOR: 4.0
      CVSS_HIGH_FLOOR: 7.0
      CVSS_CRITICAL_FLOOR: 9.0
    precision: "severity is enum; cvss_base compared at exactly the floor (>= floor crosses up)"

  - name: remediation_sla_deadline
    trigger: "on POST /findings (creation); pins sla_due_at as a forward-looking projection"
    algorithm: forward_looking
    formula: |
      # Forward-looking: deadline projected at creation from tier + severity.
      # base_hours selected by severity; tier multiplier shrinks the window for
      # higher tiers (ELITE clients get faster SLAs).
      base_hours = { CRITICAL: 24, HIGH: 72, MEDIUM: 168, LOW: 720, INFO: null }[severity]
      tier_mult  = { ESSENTIAL: 1.0, ADVANCED: 0.75, ELITE: 0.5 }[client.tier]
      if base_hours is null:   sla_due_at = null   # INFO findings have no SLA
      else:                    sla_due_at = finding.created_at + (base_hours * tier_mult) hours
      sla_breached = (clock > sla_due_at) AND (status NOT IN {REMEDIATED, RISK_ACCEPTED, FALSE_POSITIVE})
    input_set: "single Finding, its severity (from finding_severity), and parent Client.tier"
    constants:
      SLA_CRITICAL_H: 24
      SLA_HIGH_H: 72
      SLA_MEDIUM_H: 168
      SLA_LOW_H: 720
    precision: "hours arithmetic exact; comparison clock > sla_due_at is strict (>)"
    variants:
      - name: projected_at_creation
        when: "severity computed at finding creation; deadline frozen against created_at"
        difference: "uses created_at as the anchor; does not move if severity later changes"
      - name: live_breach_evaluation
        when: "sla_breached re-evaluated against the logical clock on every read"
        difference: "breach flag is dynamic vs the frozen deadline; flips strictly when clock passes sla_due_at"

  - name: alert_triage_priority
    trigger: "on POST /alerts (creation) and on POST /alerts/{id}/triage"
    algorithm: weighted_scoring
    formula: |
      # Weighted score then banded into P1..P4. Pin rounding: compute the
      # weighted sum to full precision, THEN round HALF_UP to 2 decimals ONCE
      # (sum-then-round, NOT round-each-term).
      crit_weight = { LOW: 0, MEDIUM: 10, HIGH: 20, CROWN_JEWEL: 35 }[asset.criticality]
      exposure_bonus = 15 if asset.exposure == EXTERNAL else 0
      score = round_half_up( raw_score * 0.6 + crit_weight + exposure_bonus, 2 )   # raw_score in 0..100
      if score >= 80:   triage_priority = P1
      elif score >= 55: triage_priority = P2   # 55.00 .. 79.99
      elif score >= 30: triage_priority = P3   # 30.00 .. 54.99
      else:             triage_priority = P4
    input_set: "single Alert plus its linked Asset.criticality and Asset.exposure"
    constants:
      RAW_WEIGHT: 0.6
      EXPOSURE_BONUS: 15
      P1_FLOOR: 80
      P2_FLOOR: 55
      P3_FLOOR: 30
    precision: "round_half_up to 2 decimals, sum-then-round (single rounding at the end); band thresholds are inclusive (>=)"

  - name: retainer_hours_available
    trigger: "recomputed on every Engagement authorize/cancel/expire, Scan complete, Incident resolve"
    algorithm: aggregation
    formula: |
      # Pinned evaluation order: reserved and consumed are independent running
      # accumulators on the OPEN ledger row for (client_id, period_index).
      hours_reserved = sum over Engagements e where e.client_id == client_id
                         and e.period_index == ledger.period_index
                         and e.status == AUTHORIZED of e.estimated_hours
                       MINUS sum over Scans s under those engagements where
                         s.status == COMPLETED of min(s.actual_hours, that engagement's remaining reservation)
                       (floored at 0 per engagement)
      hours_consumed = sum over Scans s where s.client_id == client_id
                         and s.status == COMPLETED and started_at in this period of s.actual_hours
                       PLUS sum over Incidents i where i.client_id == client_id
                         and i.status == RESOLVED and resolved in this period of i.response_hours
      hours_available = hours_granted - hours_reserved - hours_consumed
    input_set: "OPEN RetainerLedger row + its AUTHORIZED engagements, COMPLETED scans, RESOLVED incidents in the same period_index"
    constants: {}
    precision: "hours kept to 2 decimals, round_half_up; reservation floor at 0 applied per engagement before summing"
    variants:
      - name: optimistic_reservation
        when: "at authorize time — full estimated_hours reserved up front (worst-case projection)"
        difference: "reserves the whole estimate immediately; over-counts vs actual until scans complete"
      - name: actual_consumption
        when: "after scans/incidents complete — reservation released and replaced by real actual_hours"
        difference: "uses measured actual_hours; the delta (estimated - actual) is released back to hours_available"

  - name: compliance_readiness_pct
    trigger: "recomputed on every AuditEvidence approve/reject"
    algorithm: aggregation
    formula: |
      covered = count of DISTINCT control_ref among AuditEvidence rows where
                  audit_id == audit.id and status == APPROVED
      # covered is capped at required_control_count (extra controls do not exceed 100)
      covered = min(covered, audit.required_control_count)
      readiness_pct = round_half_up( 100.0 * covered / audit.required_control_count, 2 )
    input_set: "all AuditEvidence rows for the audit with status == APPROVED, de-duplicated by control_ref"
    constants: {}
    precision: "round_half_up to 2 decimals; covered counts DISTINCT control_ref (two APPROVED evidences for the same control count once)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "Role permitted for this operation per §1.7", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,            check: "All path-referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4,  category: existence,            check: "All FK fields in the body reference existing resources owned by the same client", error_id: ERR_FK_NOT_FOUND, http_status: 404, applies_to: "all create endpoints" }
  - { priority: 5,  category: business_constraint,  check: "Request body required fields present and well-typed; enum members valid", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all create/action endpoints" }
  - { priority: 6,  category: state,                check: "OCC: expected_<parent>_version matches current parent version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /scans, POST /evidence" }
  - { priority: 7,  category: state,                check: "Target resource is in a state from which this transition is allowed", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8,  category: business_safety,      check: "Client.posture != LOCKDOWN for authorize/start engagement and report publish", error_id: ERR_POSTURE_LOCKDOWN, http_status: 409, applies_to: "POST /engagements/{id}/authorize, /start; POST /reports/{id}/publish" }
  - { priority: 9,  category: business_safety,      check: "Segregation of duties: actor X-User-ID differs from the entity's submitted_by / evidence submitter", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: "POST /findings/{id}/retest, /mark-false-positive; POST /evidence/{id}/approve, /reject; POST /audits/{id}/attest" }
  - { priority: 10, category: business_safety,      check: "CRITICAL finding cannot be risk-accepted", error_id: ERR_CANNOT_ACCEPT_CRITICAL, http_status: 409, applies_to: "POST /findings/{id}/accept-risk" }
  - { priority: 11, category: business_safety,      check: "P1/P2 alert cannot be dismissed; must be promoted", error_id: ERR_CANNOT_DISMISS_HIGH_PRIORITY, http_status: 409, applies_to: "POST /alerts/{id}/dismiss" }
  - { priority: 12, category: business_safety,      check: "LOW/MEDIUM incident cannot be escalated", error_id: ERR_CANNOT_ESCALATE_LOW, http_status: 409, applies_to: "POST /incidents/{id}/escalate" }
  - { priority: 13, category: business_referential, check: "Scan parent Engagement must be ACTIVE before scan start; Finding parent Scan must be COMPLETED before remediation", error_id: ERR_ENGAGEMENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /scans/{id}/start, POST /findings/{id}/start-remediation" }
  - { priority: 14, category: business_referential, check: "Every scope_asset_id is an ACTIVE Asset owned by the engagement's client", error_id: ERR_SCOPE_ASSET_INVALID, http_status: 409, applies_to: "POST /engagements/{id}/authorize" }
  - { priority: 15, category: business_temporal,    check: "Engagement start and scan start must fall within [authorized_window_start, authorized_window_end]", error_id: ERR_OUTSIDE_WINDOW, http_status: 409, applies_to: "POST /engagements/{id}/start, POST /scans/{id}/start" }
  - { priority: 16, category: business_temporal,    check: "Audit cannot mark-ready until readiness_pct == 100 and no open CRITICAL findings", error_id: ERR_AUDIT_NOT_READY, http_status: 409, applies_to: "POST /audits/{id}/mark-ready" }
  - { priority: 17, category: business_temporal,    check: "Audit mark-ready blocked while Client.open_critical_findings > 0", error_id: ERR_OPEN_CRITICAL_FINDINGS, http_status: 409, applies_to: "POST /audits/{id}/mark-ready" }
  - { priority: 18, category: business_fiscal,      check: "RetainerLedger.hours_available >= estimated_hours at authorize", error_id: ERR_RETAINER_EXHAUSTED, http_status: 409, applies_to: "POST /engagements/{id}/authorize" }
  - { priority: 19, category: business_fiscal,      check: "RetainerLedger for current period must be OPEN", error_id: ERR_PERIOD_CLOSED, http_status: 409, applies_to: "POST /engagements/{id}/authorize, POST /incidents/{id}/resolve" }
  - { priority: 20, category: business_constraint,  check: "Asset hostname unique per client among non-DECOMMISSIONED assets", error_id: ERR_DUPLICATE_HOSTNAME, http_status: 409, applies_to: "POST /assets" }
  - { priority: 21, category: business_constraint,  check: "Reopen incident only within the same period it was resolved", error_id: ERR_REOPEN_WINDOW_CLOSED, http_status: 409, applies_to: "POST /incidents/{id}/reopen" }
  - { priority: 22, category: business_referential, check: "Alert asset must not be DECOMMISSIONED at triage", error_id: ERR_ASSET_DECOMMISSIONED, http_status: 409, applies_to: "POST /alerts/{id}/triage" }
  - { priority: 23, category: business_referential, check: "Scan parent engagement may not have scans in flight at completion", error_id: ERR_SCANS_IN_FLIGHT, http_status: 409, applies_to: "POST /engagements/{id}/complete" }
  - { priority: 24, category: state,                check: "Scan must be COMPLETED before its findings can begin remediation", error_id: ERR_SCAN_NOT_COMPLETED, http_status: 409, applies_to: "POST /findings/{id}/start-remediation" }
  - { priority: 25, category: business_referential, check: "Evidence approve requires parent audit in FIELDWORK", error_id: ERR_AUDIT_NOT_IN_FIELDWORK, http_status: 409, applies_to: "POST /evidence/{id}/approve" }
  - { priority: 26, category: business_referential, check: "Alert promote requires Client.status == ACTIVE", error_id: ERR_CLIENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /alerts/{id}/promote" }
  - { priority: 28, category: business_temporal,    check: "PENTEST authorization window must not overlap another AUTHORIZED/ACTIVE PENTEST sharing a scope asset (half-open [start, end))", error_id: ERR_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /engagements/{id}/authorize" }
  - { priority: 29, category: business_temporal,    check: "Scan start must not fall within 24 hours (SCAN_COOLDOWN_HOURS) of another RUNNING scan on the same engagement (closed buffered interval)", error_id: ERR_SCAN_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /scans/{id}/start" }
  - { priority: 27, category: business_constraint,  check: "Pagination limit within [1,100], offset >= 0", error_id: ERR_INVALID_PAGINATION, http_status: 400, applies_to: "all list endpoints" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clients ----
  - { method: POST,  path: "/clients", description: "Create a client", roles: [PlatformAdmin], code: 201, input: [name, tier, retainer_hours_per_period], output: Client, side_effects: ["create OPEN RetainerLedger for period 0 with hours_granted = retainer_hours_per_period"] }
  - { method: GET,   path: "/clients", description: "List clients (paginated)", roles: [PlatformAdmin, EngagementLead, SocAnalyst, Auditor], code: 200, input: ["limit?", "offset?", "status?"], output: "Client[]", side_effects: [] }
  - { method: GET,   path: "/clients/{id}", description: "Get a client (includes computed posture, open_critical_findings)", roles: [PlatformAdmin, EngagementLead, SocAnalyst, Auditor, ClientContact], code: 200, input: [], output: Client, side_effects: [] }
  - { method: POST,  path: "/clients/{id}/advance-period", description: "Close current RetainerLedger, increment current_period_index, open a new ledger; expires AUTHORIZED engagements past their window", roles: [PlatformAdmin], code: 200, input: [], output: Client, side_effects: ["current_period_index += 1", "current ledger -> CLOSED; new OPEN ledger created", "AUTHORIZED engagements past authorized_window_end -> EXPIRED (releases their reserved hours)"] }
  - { method: POST,  path: "/clients/{id}/suspend", description: "Suspend a client", roles: [PlatformAdmin], code: 200, input: [], output: Client, side_effects: ["status -> SUSPENDED"] }

  # ---- Retainer ledgers ----
  - { method: GET,   path: "/retainer-ledgers", description: "List retainer ledgers; filter by client_id/period_index", roles: [PlatformAdmin, EngagementLead], code: 200, input: ["client_id?", "period_index?", "limit?", "offset?"], output: "RetainerLedger[]", side_effects: [] }
  - { method: GET,   path: "/retainer-ledgers/{id}", description: "Get a retainer ledger (computed hours_reserved/consumed/available)", roles: [PlatformAdmin, EngagementLead], code: 200, input: [], output: RetainerLedger, side_effects: [] }

  # ---- Assets ----
  - { method: POST,  path: "/assets", description: "Register an asset", roles: [PlatformAdmin, EngagementLead], code: 201, input: [client_id, hostname, ip_address, criticality, "exposure?"], output: Asset, side_effects: ["hostname uniqueness checked among non-DECOMMISSIONED"] }
  - { method: GET,   path: "/assets", description: "List assets; filter by client_id/status", roles: [PlatformAdmin, EngagementLead, SocAnalyst, ClientContact], code: 200, input: ["client_id?", "status?", "limit?", "offset?"], output: "Asset[]", side_effects: [] }
  - { method: GET,   path: "/assets/{id}", description: "Get an asset", roles: [PlatformAdmin, EngagementLead, SocAnalyst, ClientContact], code: 200, input: [], output: Asset, side_effects: [] }
  - { method: POST,  path: "/assets/{id}/decommission", description: "Decommission an asset", roles: [PlatformAdmin, EngagementLead], code: 200, input: [], output: Asset, side_effects: ["status -> DECOMMISSIONED"] }

  # ---- Engagements ----
  - { method: POST,  path: "/engagements", description: "Create an engagement in DRAFT", roles: [EngagementLead], code: 201, input: [client_id, kind, authorized_window_start, authorized_window_end, estimated_hours, scope_asset_ids], output: Engagement, side_effects: [] }
  - { method: GET,   path: "/engagements", description: "List engagements; filter by client_id/status", roles: [PlatformAdmin, EngagementLead, ClientContact], code: 200, input: ["client_id?", "status?", "limit?", "offset?"], output: "Engagement[]", side_effects: [] }
  - { method: GET,   path: "/engagements/{id}", description: "Get an engagement", roles: [PlatformAdmin, EngagementLead, ClientContact], code: 200, input: [], output: Engagement, side_effects: [] }
  - { method: POST,  path: "/engagements/{id}/authorize", description: "Client signs authorization; reserves retainer hours", roles: [ClientContact], code: 200, input: [], output: Engagement, side_effects: ["status -> AUTHORIZED", "reserves estimated_hours on the OPEN ledger", "increments Engagement.version by 1"] }
  - { method: POST,  path: "/engagements/{id}/start", description: "Begin sanctioned testing", roles: [EngagementLead], code: 200, input: [], output: Engagement, side_effects: ["status -> ACTIVE", "increments Engagement.version by 1"] }
  - { method: POST,  path: "/engagements/{id}/complete", description: "Complete engagement; release unspent reservation", roles: [EngagementLead], code: 200, input: [], output: Engagement, side_effects: ["status -> COMPLETED", "release unspent reserved hours", "increments Engagement.version by 1"] }
  - { method: POST,  path: "/engagements/{id}/cancel", description: "Cancel a DRAFT or AUTHORIZED engagement; releases reservation", roles: [EngagementLead], code: 200, input: [], output: Engagement, side_effects: ["status -> CANCELLED", "release reserved hours if was AUTHORIZED", "increments Engagement.version by 1"] }

  # ---- Scans ----
  - { method: POST,  path: "/scans", description: "Queue a scan under an engagement (OCC on engagement)", roles: [EngagementLead], code: 201, input: [engagement_id, expected_engagement_version], output: Scan, side_effects: ["status QUEUED", "increments Engagement.version by 1"] }
  - { method: GET,   path: "/scans", description: "List scans; filter by engagement_id/client_id/status", roles: [PlatformAdmin, EngagementLead], code: 200, input: ["engagement_id?", "client_id?", "status?", "limit?", "offset?"], output: "Scan[]", side_effects: [] }
  - { method: GET,   path: "/scans/{id}", description: "Get a scan", roles: [PlatformAdmin, EngagementLead], code: 200, input: [], output: Scan, side_effects: [] }
  - { method: POST,  path: "/scans/{id}/start", description: "Start a queued scan (must be in engagement window)", roles: [EngagementLead], code: 200, input: [], output: Scan, side_effects: ["status -> RUNNING", "stamp started_at"] }
  - { method: POST,  path: "/scans/{id}/complete", description: "Complete scan; debits retainer by actual_hours", roles: [EngagementLead], code: 200, input: [actual_hours, "raw_finding_count?"], output: Scan, side_effects: ["status -> COMPLETED", "debits ledger hours_consumed; releases over-reserved hours"] }
  - { method: POST,  path: "/scans/{id}/abort", description: "Abort a scan", roles: [EngagementLead], code: 200, input: [], output: Scan, side_effects: ["status -> ABORTED"] }

  # ---- Findings ----
  - { method: POST,  path: "/findings", description: "Record a finding for a completed scan; computes severity and SLA", roles: [SocAnalyst, EngagementLead], code: 201, input: [scan_id, asset_id, title, cvss_base], output: Finding, side_effects: ["set submitted_by = X-User-ID", "compute severity, sla_due_at", "recompute Client.open_critical_findings"] }
  - { method: GET,   path: "/findings", description: "List findings; filter by scan_id/client_id/asset_id/severity/status/linked_incident_id", roles: [PlatformAdmin, EngagementLead, SocAnalyst, ClientContact, Auditor], code: 200, input: ["scan_id?", "client_id?", "asset_id?", "severity?", "status?", "linked_incident_id?", "limit?", "offset?"], output: "Finding[]", side_effects: [] }
  - { method: GET,   path: "/findings/{id}", description: "Get a finding (live sla_breached)", roles: [PlatformAdmin, EngagementLead, SocAnalyst, ClientContact, Auditor], code: 200, input: [], output: Finding, side_effects: [] }
  - { method: POST,  path: "/findings/{id}/start-remediation", description: "Client begins remediation (also used to restart after RETEST_FAILED)", roles: [ClientContact], code: 200, input: [], output: Finding, side_effects: ["status -> REMEDIATION_IN_PROGRESS"] }
  - { method: POST,  path: "/findings/{id}/submit-remediation", description: "Client submits remediation for retest", roles: [ClientContact], code: 200, input: [], output: Finding, side_effects: ["status -> REMEDIATION_SUBMITTED"] }
  - { method: POST,  path: "/findings/{id}/retest", description: "Lead retests; pass -> REMEDIATED, fail -> RETEST_FAILED (segregation of duties)", roles: [EngagementLead], code: 200, input: [retest_passed], output: Finding, side_effects: ["status -> REMEDIATED or RETEST_FAILED", "on pass set accepted_by, recompute open_critical_findings"] }
  - { method: POST,  path: "/findings/{id}/accept-risk", description: "Client risk-accepts a non-CRITICAL finding", roles: [ClientContact], code: 200, input: [], output: Finding, side_effects: ["status -> RISK_ACCEPTED", "recompute open_critical_findings"] }
  - { method: POST,  path: "/findings/{id}/mark-false-positive", description: "Lead marks finding false positive (segregation of duties)", roles: [EngagementLead], code: 200, input: [], output: Finding, side_effects: ["status -> FALSE_POSITIVE", "recompute open_critical_findings"] }

  # ---- Alerts ----
  - { method: POST,  path: "/alerts", description: "Ingest a SIEM/EDR alert; computes triage_priority", roles: [SocAnalyst, PlatformAdmin], code: 201, input: [client_id, asset_id, source, raw_score], output: Alert, side_effects: ["compute triage_priority"] }
  - { method: GET,   path: "/alerts", description: "List alerts; filter by client_id/asset_id/status/triage_priority/promoted_incident_id", roles: [PlatformAdmin, EngagementLead, SocAnalyst], code: 200, input: ["client_id?", "asset_id?", "status?", "triage_priority?", "promoted_incident_id?", "limit?", "offset?"], output: "Alert[]", side_effects: [] }
  - { method: GET,   path: "/alerts/{id}", description: "Get an alert", roles: [PlatformAdmin, EngagementLead, SocAnalyst], code: 200, input: [], output: Alert, side_effects: [] }
  - { method: POST,  path: "/alerts/{id}/triage", description: "Triage an alert", roles: [SocAnalyst], code: 200, input: [], output: Alert, side_effects: ["status -> TRIAGED", "set triaged_by"] }
  - { method: POST,  path: "/alerts/{id}/dismiss", description: "Dismiss a low-priority alert", roles: [SocAnalyst], code: 200, input: [], output: Alert, side_effects: ["status -> DISMISSED"] }
  - { method: POST,  path: "/alerts/{id}/promote", description: "Promote alert to incident (cascade: births Incident, recomputes posture)", roles: [SocAnalyst], code: 200, input: [], output: Alert, side_effects: ["status -> PROMOTED", "create Incident", "set promoted_incident_id", "recompute Client.posture"] }

  # ---- Incidents ----
  - { method: GET,   path: "/incidents", description: "List incidents; filter by client_id/status/severity/triggering_alert_id/quarantined_asset_id", roles: [PlatformAdmin, EngagementLead, SocAnalyst], code: 200, input: ["client_id?", "status?", "severity?", "triggering_alert_id?", "quarantined_asset_id?", "limit?", "offset?"], output: "Incident[]", side_effects: [] }
  - { method: GET,   path: "/incidents/{id}", description: "Get an incident", roles: [PlatformAdmin, EngagementLead, SocAnalyst], code: 200, input: [], output: Incident, side_effects: [] }
  - { method: POST,  path: "/incidents/{id}/acknowledge", description: "Acknowledge an incident", roles: [SocAnalyst], code: 200, input: [], output: Incident, side_effects: ["status -> ACKNOWLEDGED"] }
  - { method: POST,  path: "/incidents/{id}/contain", description: "Contain an incident; optionally quarantine the asset", roles: [SocAnalyst], code: 200, input: ["quarantine_asset?"], output: Incident, side_effects: ["status -> CONTAINED", "contained_count += 1", "optionally Asset -> QUARANTINED"] }
  - { method: POST,  path: "/incidents/{id}/escalate", description: "Escalate a HIGH/CRITICAL incident (cascade: client -> LOCKDOWN)", roles: [EngagementLead], code: 200, input: [], output: Incident, side_effects: ["status -> ESCALATED", "recompute Client.posture -> LOCKDOWN"] }
  - { method: POST,  path: "/incidents/{id}/resolve", description: "Resolve an incident; debits retainer, reverses quarantine, recomputes posture", roles: [EngagementLead], code: 200, input: [response_hours], output: Incident, side_effects: ["status -> RESOLVED", "debits retainer hours_consumed", "Asset quarantine reversed", "recompute Client.posture"] }
  - { method: POST,  path: "/incidents/{id}/reopen", description: "Reopen a resolved incident within the same period", roles: [SocAnalyst], code: 200, input: [], output: Incident, side_effects: ["status -> REOPENED", "recompute Client.posture"] }

  # ---- Compliance audits ----
  - { method: POST,  path: "/audits", description: "Create a compliance audit in PLANNING", roles: [Auditor, EngagementLead], code: 201, input: [client_id, framework, required_control_count], output: ComplianceAudit, side_effects: [] }
  - { method: GET,   path: "/audits", description: "List audits; filter by client_id/framework/status", roles: [PlatformAdmin, EngagementLead, Auditor, ClientContact], code: 200, input: ["client_id?", "framework?", "status?", "limit?", "offset?"], output: "ComplianceAudit[]", side_effects: [] }
  - { method: GET,   path: "/audits/{id}", description: "Get an audit (computed readiness_pct)", roles: [PlatformAdmin, EngagementLead, Auditor, ClientContact], code: 200, input: [], output: ComplianceAudit, side_effects: [] }
  - { method: POST,  path: "/audits/{id}/begin-fieldwork", description: "Move audit to FIELDWORK", roles: [Auditor], code: 200, input: [], output: ComplianceAudit, side_effects: ["status -> FIELDWORK", "increments ComplianceAudit.version by 1"] }
  - { method: POST,  path: "/audits/{id}/mark-ready", description: "Mark audit READY (requires 100% readiness and no open CRITICAL findings)", roles: [Auditor], code: 200, input: [], output: ComplianceAudit, side_effects: ["status -> READY"] }
  - { method: POST,  path: "/audits/{id}/attest", description: "Attest the audit (segregation of duties: attester != any evidence submitter)", roles: [Auditor], code: 200, input: [], output: ComplianceAudit, side_effects: ["status -> ATTESTED"] }
  - { method: POST,  path: "/audits/{id}/fail", description: "Fail an audit during fieldwork", roles: [Auditor], code: 200, input: [], output: ComplianceAudit, side_effects: ["status -> FAILED"] }
  - { method: POST,  path: "/audits/{id}/reopen-fieldwork", description: "Return a READY audit to FIELDWORK", roles: [Auditor], code: 200, input: [], output: ComplianceAudit, side_effects: ["status -> FIELDWORK"] }

  # ---- Audit evidence ----
  - { method: POST,  path: "/evidence", description: "Submit audit evidence for a control (OCC on audit)", roles: [Auditor, EngagementLead], code: 201, input: [audit_id, control_ref, "finding_id?", expected_audit_version], output: AuditEvidence, side_effects: ["set submitted_by", "increments ComplianceAudit.version by 1"] }
  - { method: GET,   path: "/evidence", description: "List evidence; filter by audit_id/control_ref/status/finding_id", roles: [PlatformAdmin, EngagementLead, Auditor], code: 200, input: ["audit_id?", "control_ref?", "status?", "finding_id?", "limit?", "offset?"], output: "AuditEvidence[]", side_effects: [] }
  - { method: GET,   path: "/evidence/{id}", description: "Get an evidence item", roles: [PlatformAdmin, EngagementLead, Auditor], code: 200, input: [], output: AuditEvidence, side_effects: [] }
  - { method: POST,  path: "/evidence/{id}/approve", description: "Approve evidence (segregation: approver != submitter); recomputes readiness", roles: [Auditor], code: 200, input: [], output: AuditEvidence, side_effects: ["status -> APPROVED", "recompute audit readiness_pct", "increments ComplianceAudit.version by 1"] }
  - { method: POST,  path: "/evidence/{id}/reject", description: "Reject evidence (segregation: rejecter != submitter)", roles: [Auditor], code: 200, input: [], output: AuditEvidence, side_effects: ["status -> REJECTED", "recompute audit readiness_pct"] }

  # ---- Reports ----
  - { method: POST,  path: "/reports", description: "Generate a report; freezes a denormalized snapshot", roles: [EngagementLead, Auditor], code: 201, input: [client_id, kind, "subject_id?"], output: Report, side_effects: ["compute snapshot of current metrics"] }
  - { method: GET,   path: "/reports", description: "List reports; filter by client_id/kind/status", roles: [PlatformAdmin, EngagementLead, Auditor, ClientContact], code: 200, input: ["client_id?", "kind?", "status?", "limit?", "offset?"], output: "Report[]", side_effects: [] }
  - { method: GET,   path: "/reports/{id}", description: "Get a report", roles: [PlatformAdmin, EngagementLead, Auditor, ClientContact], code: 200, input: [], output: Report, side_effects: [] }
  - { method: POST,  path: "/reports/{id}/publish", description: "Publish a report (blocked in LOCKDOWN)", roles: [EngagementLead], code: 200, input: [], output: Report, side_effects: ["status -> PUBLISHED"] }
  - { method: POST,  path: "/reports/{id}/retract", description: "Retract a published report", roles: [EngagementLead], code: 200, input: [], output: Report, side_effects: ["status -> RETRACTED"] }

  # ---- Audit log (tamper-evident read) ----
  - { method: GET,   path: "/audit-log", description: "List audit-log entries; filter by client_id/action/target_id", roles: [PlatformAdmin, Auditor], code: 200, input: ["client_id?", "action?", "target_id?", "limit?", "offset?"], output: "AuditLogEntry[]", side_effects: [] }
  - { method: GET,   path: "/audit-log/{id}", description: "Get a single audit-log entry (tamper-evident hash chain fields)", roles: [PlatformAdmin, Auditor], code: 200, input: [], output: AuditLogEntry, side_effects: [] }

  # ---- Test-driving clock endpoint ----
  - { method: POST,  path: "/_clock/set_current_utc", description: "Set the server logical clock. Server startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced; re-evaluates sla_breached / escalation_breached on subsequent reads"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,            http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED,               http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND,                  http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND,               http: 404, condition: "Body FK references a non-existent or wrong-client resource" }
  - { id: ERR_INVALID_REQUEST,            http: 400, condition: "Missing/malformed required field, bad type, or invalid enum value" }
  - { id: ERR_INVALID_PAGINATION,         http: 400, condition: "limit outside [1,100] or offset < 0" }
  - { id: ERR_STALE_VERSION,              http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_INVALID_STATE,              http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_POSTURE_LOCKDOWN,           http: 409, condition: "Operation blocked while Client.posture == LOCKDOWN" }
  - { id: ERR_SEGREGATION_OF_DUTIES,      http: 409, condition: "Actor X-User-ID equals the submitter/approver they are not allowed to also be" }
  - { id: ERR_CANNOT_ACCEPT_CRITICAL,     http: 409, condition: "Attempt to risk-accept a CRITICAL finding" }
  - { id: ERR_CANNOT_DISMISS_HIGH_PRIORITY, http: 409, condition: "Attempt to dismiss a P1/P2 alert" }
  - { id: ERR_CANNOT_ESCALATE_LOW,        http: 409, condition: "Attempt to escalate a LOW/MEDIUM incident" }
  - { id: ERR_ENGAGEMENT_NOT_ACTIVE,      http: 409, condition: "Scan start attempted while parent engagement is not ACTIVE" }
  - { id: ERR_SCOPE_ASSET_INVALID,        http: 409, condition: "A scope_asset_id is not an ACTIVE asset of the engagement's client" }
  - { id: ERR_OUTSIDE_WINDOW,             http: 409, condition: "Engagement/scan start outside [authorized_window_start, authorized_window_end]" }
  - { id: ERR_AUDIT_NOT_READY,            http: 409, condition: "mark-ready while readiness_pct < 100" }
  - { id: ERR_OPEN_CRITICAL_FINDINGS,     http: 409, condition: "mark-ready while Client.open_critical_findings > 0" }
  - { id: ERR_RETAINER_EXHAUSTED,         http: 409, condition: "estimated_hours exceeds RetainerLedger.hours_available at authorize" }
  - { id: ERR_PERIOD_CLOSED,              http: 409, condition: "Operation requires the current RetainerLedger to be OPEN" }
  - { id: ERR_DUPLICATE_HOSTNAME,         http: 409, condition: "Asset hostname already used by a non-DECOMMISSIONED asset of the same client" }
  - { id: ERR_REOPEN_WINDOW_CLOSED,       http: 409, condition: "Incident reopen attempted in a later period than its resolution" }
  - { id: ERR_ASSET_DECOMMISSIONED,       http: 409, condition: "Alert triage on a DECOMMISSIONED asset" }
  - { id: ERR_SCANS_IN_FLIGHT,            http: 409, condition: "Engagement complete attempted while QUEUED/RUNNING scans exist" }
  - { id: ERR_SCAN_NOT_COMPLETED,         http: 409, condition: "Finding remediation begun while parent scan not COMPLETED" }
  - { id: ERR_AUDIT_NOT_IN_FIELDWORK,     http: 409, condition: "Evidence approve while parent audit not in FIELDWORK" }
  - { id: ERR_CLIENT_NOT_ACTIVE,          http: 409, condition: "Alert promote while Client.status != ACTIVE" }
  - { id: ERR_WINDOW_OVERLAP,             http: 409, condition: "PENTEST engagement authorization window overlaps another AUTHORIZED/ACTIVE PENTEST sharing a scope asset (half-open intervals)" }
  - { id: ERR_SCAN_WINDOW_OVERLAP,        http: 409, condition: "Scan start within 24 hours (SCAN_COOLDOWN_HOURS) of another RUNNING scan on the same engagement (closed buffered interval)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "MSSP operator; manages clients, retainer/period lifecycle, ingests alerts"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "POST /clients/{id}/advance-period"
      - "POST /clients/{id}/suspend"
    shared_operations:
      - "POST /alerts (with SocAnalyst)"
      - "GET on all collections"

  - name: EngagementLead
    description: "Leads assessments; manages engagements, scans, retests, incidents escalation/resolution, reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /engagements and lifecycle (authorize excepted)"
      - "POST /scans and lifecycle"
      - "POST /findings/{id}/retest"
      - "POST /findings/{id}/mark-false-positive"
      - "POST /incidents/{id}/escalate"
      - "POST /incidents/{id}/resolve"
      - "POST /reports/{id}/publish and /retract"
    shared_operations:
      - "POST /assets (with PlatformAdmin)"
      - "POST /findings (with SocAnalyst)"
      - "POST /audits, POST /evidence (with Auditor)"
      - "POST /reports (with Auditor)"

  - name: SocAnalyst
    description: "SOC analyst; ingests/triages alerts, promotes to incidents, acknowledges/contains/reopens incidents, records findings"
    identity: "opaque"
    exclusive_operations:
      - "POST /alerts/{id}/triage, /dismiss, /promote"
      - "POST /incidents/{id}/acknowledge, /contain, /reopen"
    shared_operations:
      - "POST /alerts (with PlatformAdmin)"
      - "POST /findings (with EngagementLead)"

  - name: Auditor
    description: "Compliance auditor; runs audit lifecycle, approves/rejects evidence, attests"
    identity: "opaque"
    exclusive_operations:
      - "POST /audits/{id}/begin-fieldwork, /mark-ready, /attest, /fail, /reopen-fieldwork"
      - "POST /evidence/{id}/approve, /reject"
    shared_operations:
      - "POST /audits, POST /evidence (with EngagementLead)"
      - "POST /reports (with EngagementLead)"
      - "GET /audit-log (with PlatformAdmin)"

  - name: ClientContact
    description: "Client-side representative; signs engagement authorization, drives finding remediation"
    identity: "opaque"
    exclusive_operations:
      - "POST /engagements/{id}/authorize"
      - "POST /findings/{id}/start-remediation, /submit-remediation, /accept-risk"
    shared_operations:
      - "GET on own client's engagements, assets, findings, audits, reports"
