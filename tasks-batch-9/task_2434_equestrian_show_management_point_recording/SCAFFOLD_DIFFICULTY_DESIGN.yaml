      - name: stall_capacity_accept_boundary
        grounds:
          - validations.priority_60
          - errors.ERR_STALL_CAPACITY_EXCEEDED
          - calculations.show_stall_ledger
          - entities.Show.fields.reserved_stall_count
          - entities.Show.fields.available_stall_count
          - state_machines.Entry.VERIFIED_to_ACCEPTED
        distinguishing_aspect: |
          A different boundary in a different unit and with a different comparison operator:
          priority 60 rejects only when requested_stall_count is STRICTLY greater than
          available_stall_count, so a request for exactly the remaining stalls must succeed
          and a request for zero stalls must succeed even when nothing is available. The
          rejected accept in the middle must also leave reserved_stall_count untouched, which
          an implementation that decrements before validating will fail.
        test_recipe:
          setup:
            - "One APPROVED show with stall_capacity 5 and stall_fee_cents 7500, so reserved_stall_count starts at 0 and available_stall_count at 5."
            - "One JUMPER division and class 101 OPEN (not otherwise used; the stall ledger is independent of class entries)."
            - "Four riders with four horses and four Entry rows requesting 3, 3, 2 and 0 stalls respectively; all four VERIFIED and none accepted yet."
