scenario: "1062. Vehicle-Donation Charity Program: donation intake & vehicle/asset, pickup & tow, title & DMV, auction/salvage & proceeds, tax-receipt (1098-C) & FMV, charity remittance & fee, reporting, follow-up"
domain_name: "vehicle-donation-charity"
api_prefix: "/api"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  GROSS_PROCEEDS_THRESHOLD_CENTS: 50000
  FMV_SAFE_HARBOR_CENTS: 50000
  MIN_FMV_CENTS: 10000
  SALVAGE_FMV_CAP_CENTS: 75000
  PROGRAM_FEE_TIER_1_MAX_CENTS: 100000
  PROGRAM_FEE_TIER_1_RATE: 0.15
  PROGRAM_FEE_TIER_2_MAX_CENTS: 500000
  PROGRAM_FEE_TIER_2_RATE: 0.12
  PROGRAM_FEE_TIER_3_RATE: 0.10
  MIN_PROGRAM_FEE_CENTS: 5000
  TOW_ALLOWANCE_PCT: 0.25
  ADMIN_FLAT_FEE_CENTS: 2500
  PICKUP_BUFFER_MINUTES: 90
  MAX_PICKUP_ATTEMPTS: 3
  VENUE_DAILY_LOT_CAPACITY: 5
  TITLE_RESUBMIT_LIMIT: 2
  STALE_TITLE_DAYS: 45
  RECEIPT_DUE_DAYS: 30
  REMITTANCE_FOLLOWUP_DAYS: 15
  AUTO_BATCH_THRESHOLD_CENTS: 500000
  AUTO_BATCH_PERIOD_DAYS: 30
  ODOMETER_TIER_1_MAX_MILES: 75000
  ODOMETER_TIER_1_MULT: 1.00
  ODOMETER_TIER_2_MAX_MILES: 150000
  ODOMETER_TIER_2_MULT: 0.85
  ODOMETER_TIER_3_MULT: 0.70
  CONDITION_MULT_EXCELLENT: 1.00
  CONDITION_MULT_GOOD: 0.85
  CONDITION_MULT_FAIR: 0.65
  CONDITION_MULT_POOR: 0.40
  CONDITION_MULT_SALVAGE: 0.15
  MAX_REMITTANCE_FEE_PCT: 0.30
  DEFAULT_CLOCK_UTC: "2026-07-01T00:00:00Z"

entities:
  - name: Donor
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: donor contact email
        constraints: "required; unique across Donor"
      - name: full_name
        type: string
        source: input
        description: donor legal name printed on the tax receipt
        constraints: required
      - name: state_code
        type: string
        source: input
        description: two-letter US state code of the donor's residence
        constraints: "required; exactly 2 uppercase letters"
      - name: status
        type: enum
        source: system
        description: donor eligibility flag
        default: ACTIVE
        constraints: "one of {ACTIVE, BLOCKED}"
      - name: donation_count
        type: integer
        source: computed
        description: number of Donation rows referencing this donor whose status is not CANCELLED
        default: 0

  - name: CharityAffiliate
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: affiliate charity legal name
        constraints: required
      - name: ein
        type: string
        source: input
        description: IRS employer identification number of the charity
        constraints: "required; unique across CharityAffiliate"
      - name: state_code
        type: string
        source: input
        description: two-letter US state code where the charity is registered
        constraints: "required; exactly 2 uppercase letters"
      - name: remittance_fee_pct
        type: number
        source: input
        description: fraction of batch gross retained by the program at remittance time
        default: 0.10
        constraints: "0 <= value <= MAX_REMITTANCE_FEE_PCT (0.30)"
      - name: status
        type: enum
        source: system
        description: affiliate participation status
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: pledged_balance_cents
        type: integer
        source: computed
        description: sum of net_to_charity_cents accrued to this charity but not yet paid out
        default: 0
      - name: remitted_balance_cents
        type: integer
        source: computed
        description: cumulative net cents actually paid out to this charity across PAID batches
        default: 0

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the donating party"
        constraints: required
      - name: charity_id
        type: string
        source: input
        description: "FK -> CharityAffiliate.id; beneficiary affiliate"
        constraints: required
      - name: intake_channel
        type: enum
        source: input
        description: how the donation was captured
        constraints: "one of {WEB, PHONE, PARTNER}"
      - name: declared_condition
        type: enum
        source: input
        description: condition the donor self-reported at intake; feeds the BASE_CONDITION FMV variant
        constraints: "one of {EXCELLENT, GOOD, FAIR, POOR, SALVAGE}"
      - name: pickup_required
        type: boolean
        source: input
        description: true when the program must tow the vehicle; false for donor drop-off
        default: true
      - name: status
        type: enum
        source: system
        description: disposition axis of the donation lifecycle
        default: PENDING_REVIEW
        constraints: "one of {PENDING_REVIEW, ACCEPTED, PICKUP_BLOCKED, IN_CUSTODY, SOLD, UNSOLD, CLOSED, DECLINED, CANCELLED}"
      - name: payout_status
        type: enum
        source: system
        description: money axis of the donation lifecycle; evolves independently of status
        default: PENDING
        constraints: "one of {PENDING, ACCRUED, REMITTED, WITHHELD}"
      - name: pickup_attempts
        type: integer
        source: system
        description: count of PickupOrder rows for this donation that reached status FAILED
        default: 0
      - name: exception_type
        type: enum
        source: system
        description: IRS 1098-C exception claimed by the program for this donation
        default: NONE
        constraints: "one of {NONE, MATERIAL_IMPROVEMENT, GIFT_TO_NEEDY, SIGNIFICANT_USE}"
      - name: fmv_estimate_cents
        type: integer
        source: computed
        description: mirror of the latest Vehicle.fmv_estimate_cents for this donation; null while no Vehicle row exists
        default: null
      - name: gross_proceeds_cents
        type: integer
        source: computed
        description: sale_price_cents of the AuctionLot whose status is SOLD for this donation
        default: 0
      - name: program_fee_cents
        type: integer
        source: computed
        description: tiered program fee retained from gross proceeds
        default: 0
      - name: tow_allowance_cents
        type: integer
        source: computed
        description: reimbursable tow cost charged against proceeds after the allowance cap
        default: 0
      - name: net_to_charity_cents
        type: integer
        source: computed
        description: proceeds remaining for the charity after program fee, tow allowance and admin fee
        default: 0
      - name: deduction_amount_cents
        type: integer
        source: computed
        description: dollar amount the donor may claim; copied onto the TaxReceipt at issue time
        default: null

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: donation_id
        type: string
        source: input
        description: "FK -> Donation.id; the donation this asset record describes"
        constraints: "required; at most one Vehicle per Donation"
      - name: vin
        type: string
        source: input
        description: vehicle identification number
        constraints: "required; unique across Vehicle"
      - name: year
        type: integer
        source: input
        description: model year
        constraints: "required; 1900 <= value <= 2100"
      - name: make
        type: string
        source: input
        description: manufacturer
        constraints: required
      - name: model
        type: string
        source: input
        description: model name
        constraints: required
      - name: base_book_value_cents
        type: integer
        source: input
        description: third-party book value before condition and odometer adjustment
        constraints: "required; > 0"
      - name: odometer_miles
        type: integer
        source: input
        description: inspected odometer reading; null until inspection is recorded
        default: null
      - name: condition_grade
        type: enum
        source: input
        description: inspected condition grade; null until inspection is recorded
        default: null
        constraints: "one of {EXCELLENT, GOOD, FAIR, POOR, SALVAGE}"
      - name: salvage_flag
        type: boolean
        source: input
        description: true when the vehicle is titled or graded as salvage
        default: false
      - name: keys_present
        type: boolean
        source: input
        description: whether keys were surrendered with the vehicle
        default: true
      - name: inspected
        type: boolean
        source: system
        description: set true by the first inspection PATCH
        default: false
      - name: fmv_estimate_cents
        type: integer
        source: computed
        description: fair-market-value estimate produced by the vehicle_fmv_estimate calculation
      - name: fmv_variant
        type: enum
        source: computed
        description: which vehicle_fmv_estimate variant produced the current fmv_estimate_cents
        default: BASE_CONDITION
        constraints: "one of {BASE_CONDITION, POST_INSPECTION}"

  - name: TitleRecord
    parent: null
    common_fields: true
    fields:
      - name: donation_id
        type: string
        source: input
        description: "FK -> Donation.id; the donation whose title is being cleared"
        constraints: "required; at most one TitleRecord per Donation"
      - name: title_number
        type: string
        source: input
        description: state-issued title document number
        constraints: required
      - name: owner_name
        type: string
        source: input
        description: name printed on the paper title
        constraints: required
      - name: lien_holder
        type: string
        source: input
        description: lienholder of record; null when the title is free and clear
        default: null
      - name: state
        type: enum
        source: system
        description: DMV clearance state of this title
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, CLEARED, REJECTED, ABANDONED}"
      - name: rejection_count
        type: integer
        source: system
        description: number of times the DMV has rejected this title
        default: 0
      - name: rejection_reason
        type: string
        source: system
        description: reason text from the most recent DMV rejection
        default: null
      - name: dmv_filing_reference
        type: string
        source: system
        description: reference string minted when the title is submitted to the DMV
        default: null
      - name: submitted_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the most recent DMV submission
        default: null

  - name: TowVendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: tow operator name
        constraints: required
      - name: service_state_code
        type: string
        source: input
        description: two-letter US state code the vendor serves
        constraints: "required; exactly 2 uppercase letters"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: billed tow rate per hour
        constraints: "required; > 0"
      - name: daily_capacity_slots
        type: integer
        source: input
        description: maximum SCHEDULED pickup orders the vendor accepts overall
        constraints: "required; > 0"
      - name: status
        type: enum
        source: system
        description: vendor availability
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: booked_slots_count
        type: integer
        source: computed
        description: number of PickupOrder rows for this vendor whose status is SCHEDULED
        default: 0

  - name: PickupOrder
    parent: null
    common_fields: true
    fields:
      - name: donation_id
        type: string
        source: input
        description: "FK -> Donation.id; the donation being towed"
        constraints: required
      - name: tow_vendor_id
        type: string
        source: input
        description: "FK -> TowVendor.id; the assigned tow operator"
        constraints: required
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: inclusive start of the reserved tow window
        constraints: required
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: exclusive end of the reserved tow window
        constraints: "required; strictly after scheduled_start_utc"
      - name: status
        type: enum
        source: system
        description: pickup lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, FAILED, CANCELLED}"
      - name: attempt_number
        type: integer
        source: system
        description: 1 + the donation's pickup_attempts at creation time
        default: 1
      - name: actual_pickup_utc
        type: datetime
        source: system
        description: logical-clock instant the tow completed
        default: null
      - name: actual_tow_cost_cents
        type: integer
        source: system
        description: billed tow cost recorded at completion
        default: 0
      - name: failure_reason
        type: string
        source: system
        description: reason text recorded when the tow fails
        default: null

  - name: SalesVenue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: venue name
        constraints: required
      - name: venue_type
        type: enum
        source: input
        description: disposition channel operated by this venue
        constraints: "one of {AUCTION, SALVAGE, DIRECT_SALE}"
      - name: commission_pct
        type: number
        source: input
        description: venue commission fraction, reported but not deducted by the program fee formula
        default: 0.05
      - name: state_code
        type: string
        source: input
        description: two-letter US state code of the venue
        constraints: "required; exactly 2 uppercase letters"
      - name: status
        type: enum
        source: system
        description: venue availability
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: AuctionLot
    parent: null
    common_fields: true
    fields:
      - name: donation_id
        type: string
        source: input
        description: "FK -> Donation.id; donation offered in this lot"
        constraints: required
      - name: venue_id
        type: string
        source: input
        description: "FK -> SalesVenue.id; venue hosting this lot"
        constraints: required
      - name: lot_number
        type: string
        source: input
        description: venue-assigned lot label
        constraints: required
      - name: reserve_price_cents
        type: integer
        source: input
        description: minimum acceptable hammer price
        constraints: "required; >= 0"
      - name: status
        type: enum
        source: system
        description: lot lifecycle state
        default: LISTED
        constraints: "one of {LISTED, SOLD, NO_SALE, VOIDED, WITHDRAWN}"
      - name: listed_at_utc
        type: datetime
        source: system
        description: logical-clock instant the lot entered LISTED, refreshed on each relist
      - name: sale_price_cents
        type: integer
        source: system
        description: hammer price recorded at sale
        default: null
      - name: sold_at_utc
        type: datetime
        source: system
        description: logical-clock instant the sale was recorded
        default: null
      - name: relist_count
        type: integer
        source: system
        description: number of times this lot has been relisted
        default: 0
      - name: void_reason
        type: string
        source: system
        description: reason text recorded when a sale is voided
        default: null

  - name: ProceedsLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: donation_id
        type: string
        source: system
        description: "FK -> Donation.id; null for batch-level entries such as CHARITY_FEE_DEBIT"
        default: null
      - name: remittance_batch_id
        type: string
        source: system
        description: "FK -> RemittanceBatch.id; null until the entry is bound to a batch"
        default: null
      - name: entry_type
        type: enum
        source: system
        description: ledger line classification
        constraints: "one of {PROCEEDS_CREDIT, PROGRAM_FEE_DEBIT, TOW_COST_DEBIT, ADMIN_FEE_DEBIT, REVERSAL, REMITTANCE_SETTLEMENT, CHARITY_FEE_DEBIT}"
      - name: direction
        type: enum
        source: system
        description: sign of the entry; signed_amount = amount_cents when CREDIT, -amount_cents when DEBIT
        constraints: "one of {CREDIT, DEBIT}"
      - name: amount_cents
        type: integer
        source: system
        description: unsigned magnitude of the entry
        constraints: ">= 0"
      - name: memo
        type: string
        source: system
        description: human-readable provenance of the entry

  - name: TaxReceipt
    parent: null
    common_fields: true
    fields:
      - name: donation_id
        type: string
        source: input
        description: "FK -> Donation.id; the donation this receipt documents"
        constraints: "required; at most one non-VOIDED TaxReceipt per Donation"
      - name: form_type
        type: enum
        source: computed
        description: IRS form variant selected by the tax_receipt_valuation calculation
        constraints: "one of {FORM_1098C_BOX_4A, FORM_1098C_BOX_4B, ACKNOWLEDGMENT_ONLY}"
      - name: valuation_variant
        type: enum
        source: computed
        description: which tax_receipt_valuation variant produced claimed_amount_cents
        constraints: "one of {GROSS_PROCEEDS, FMV_FULL, FMV_SAFE_HARBOR}"
      - name: claimed_amount_cents
        type: integer
        source: computed
        description: deduction amount printed on the receipt
      - name: status
        type: enum
        source: system
        description: receipt lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, VOIDED}"
      - name: control_number
        type: string
        source: system
        description: sequential control number minted at issue time
        default: null
      - name: issued_at_utc
        type: datetime
        source: system
        description: logical-clock instant of issue
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceOfficer who issued the receipt
        default: null
      - name: void_reason
        type: string
        source: system
        description: reason text recorded at void
        default: null
      - name: reissue_count
        type: integer
        source: system
        description: number of times this receipt has been returned from VOIDED to DRAFT
        default: 0

  - name: RemittanceBatch
    parent: null
    common_fields: true
    fields:
      - name: charity_id
        type: string
        source: input
        description: "FK -> CharityAffiliate.id; beneficiary of this batch"
        constraints: required
      - name: period_start_utc
        type: datetime
        source: input
        description: inclusive start of the sale-date window this batch sweeps
        constraints: required
      - name: period_end_utc
        type: datetime
        source: input
        description: exclusive end of the sale-date window this batch sweeps
        constraints: "required; strictly after period_start_utc"
      - name: status
        type: enum
        source: system
        description: batch lifecycle state
        default: OPEN
        constraints: "one of {OPEN, CLOSED, PAID, DISPUTED}"
      - name: donation_count
        type: integer
        source: computed
        description: number of member donations frozen at close
        default: 0
      - name: gross_cents
        type: integer
        source: computed
        description: sum of net_to_charity_cents over member donations, frozen at close
        default: 0
      - name: provisional_fee_cents
        type: integer
        source: computed
        description: BATCH_ROUNDING variant of remittance_fee, refreshed on every read while OPEN
        default: 0
      - name: fee_cents
        type: integer
        source: computed
        description: PER_LINE_ROUNDING variant of remittance_fee, frozen at close
        default: 0
      - name: net_cents
        type: integer
        source: computed
        description: gross_cents - fee_cents, frozen at close
        default: 0
      - name: closed_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceOfficer who closed the batch
        default: null
      - name: paid_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceOfficer who paid the batch
        default: null
      - name: payment_reference
        type: string
        source: system
        description: external payment reference captured at pay time
        default: null
      - name: dispute_reason
        type: string
        source: system
        description: reason text supplied by the charity when disputing a closed batch
        default: null

  - name: FollowUpTask
    parent: null
    common_fields: true
    fields:
      - name: donation_id
        type: string
        source: system
        description: "FK -> Donation.id; the donation this task follows up on"
      - name: task_type
        type: enum
        source: system
        description: reason the task was raised
        constraints: "one of {RECEIPT_DELIVERY, PICKUP_ESCALATION, TITLE_STALE, REMITTANCE_PENDING}"
      - name: status
        type: enum
        source: system
        description: task lifecycle state
        default: OPEN
        constraints: "one of {OPEN, ESCALATED, DONE}"
      - name: due_utc
        type: datetime
        source: system
        description: logical-clock instant after which the ops sweep escalates the task
      - name: assigned_role
        type: string
        source: system
        description: role name expected to resolve the task
      - name: resolution_note
        type: string
        source: system
        description: note captured when the task is completed
        default: null

state_machines:
  - entity: Donation
    axis: status
    initial_state: PENDING_REVIEW
    terminal_states: [CLOSED, DECLINED, CANCELLED]
    note: |
      Donation carries two independent state axes. `status` (this machine) tracks physical
      disposition; `payout_status` (the machine below) tracks money. The two advance on
      different triggers and neither derives from the other.
    transitions:
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: "POST /api/donations/{id}/accept"
        actor: IntakeAgent
        preconditions:
          - "donation.status == PENDING_REVIEW"
          - "Donor.status == ACTIVE for donation.donor_id"
          - "CharityAffiliate.status == ACTIVE for donation.charity_id"
        side_effects:
          - "increments Donation.version by 1"
      - from: PENDING_REVIEW
        to: DECLINED
        trigger: "POST /api/donations/{id}/decline"
        actor: IntakeAgent
        preconditions:
          - "donation.status == PENDING_REVIEW"
        side_effects:
          - "sets Donation.payout_status = WITHHELD"
          - "increments Donation.version by 1"
      - from: PENDING_REVIEW
        to: CANCELLED
        trigger: "POST /api/donations/{id}/cancel"
        actor: Donor
        preconditions:
          - "donation.status IN {PENDING_REVIEW, ACCEPTED}"
          - "X-User-ID equals donation.donor_id"
        side_effects:
          - "decrements Donor.donation_count by 1"
          - "cancels every PickupOrder of this donation whose status is SCHEDULED, which itself decrements TowVendor.booked_slots_count by 1 per cancelled order"
          - "increments Donation.version by 1"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /api/donations/{id}/cancel"
        actor: Donor
        preconditions:
          - "donation.status IN {PENDING_REVIEW, ACCEPTED}"
          - "X-User-ID equals donation.donor_id"
        side_effects:
          - "decrements Donor.donation_count by 1"
          - "cancels every PickupOrder of this donation whose status is SCHEDULED, which itself decrements TowVendor.booked_slots_count by 1 per cancelled order"
          - "increments Donation.version by 1"
      - from: ACCEPTED
        to: IN_CUSTODY
        trigger: "POST /api/pickup-orders/{id}/complete (system, on tow completion)"
        actor: system
        preconditions:
          - "donation.status == ACCEPTED"
          - "pickup_order.status == SCHEDULED"
        side_effects:
          - "sets PickupOrder.actual_tow_cost_cents from the request body"
          - "decrements TowVendor.booked_slots_count by 1"
          - "increments Donation.version by 1"
      - from: ACCEPTED
        to: IN_CUSTODY
        trigger: "POST /api/donations/{id}/receive-dropoff"
        actor: IntakeAgent
        preconditions:
          - "donation.status == ACCEPTED"
          - "donation.pickup_required == false"
        side_effects:
          - "increments Donation.version by 1"
      - from: ACCEPTED
        to: PICKUP_BLOCKED
        trigger: "POST /api/pickup-orders/{id}/fail (system, when the failure makes Donation.pickup_attempts reach MAX_PICKUP_ATTEMPTS)"
        actor: system
        preconditions:
          - "donation.status == ACCEPTED"
          - "donation.pickup_attempts (after increment) >= MAX_PICKUP_ATTEMPTS (3)"
        side_effects:
          - "cascade link 2: entering PICKUP_BLOCKED creates a FollowUpTask with task_type = PICKUP_ESCALATION, status = OPEN, assigned_role = ProgramAdmin, due_utc = clock + REMITTANCE_FOLLOWUP_DAYS (15) days"
          - "increments Donation.version by 1"
      - from: PICKUP_BLOCKED
        to: ACCEPTED
        trigger: "POST /api/donations/{id}/reset-pickup"
        actor: ProgramAdmin
        preconditions:
          - "donation.status == PICKUP_BLOCKED"
        side_effects:
          - "resets Donation.pickup_attempts to 0"
          - "marks every FollowUpTask of this donation with task_type = PICKUP_ESCALATION and status IN {OPEN, ESCALATED} as DONE with resolution_note = 'pickup reset'"
          - "increments Donation.version by 1"
        note: "cycle ACCEPTED -> PICKUP_BLOCKED -> ACCEPTED"
      - from: IN_CUSTODY
        to: SOLD
        trigger: "POST /api/auction-lots/{id}/record-sale"
        actor: AuctionManager
        preconditions:
          - "donation.status == IN_CUSTODY"
          - "auction_lot.status == LISTED"
          - "the TitleRecord whose donation_id == donation.id has state == CLEARED"
        side_effects:
          - "sets Donation.gross_proceeds_cents, program_fee_cents, tow_allowance_cents and net_to_charity_cents per calculations.donation_net_proceeds"
          - "cascade link 1: sets Donation.payout_status = ACCRUED (see the payout_status machine)"
          - "increments Donation.version by 1"
      - from: IN_CUSTODY
        to: UNSOLD
        trigger: "POST /api/auction-lots/{id}/record-no-sale"
        actor: AuctionManager
        preconditions:
          - "donation.status == IN_CUSTODY"
          - "auction_lot.status == LISTED"
        side_effects:
          - "increments AuctionLot.relist_count by 0 (unchanged) and leaves Donation.payout_status at PENDING"
          - "increments Donation.version by 1"
      - from: UNSOLD
        to: IN_CUSTODY
        trigger: "POST /api/auction-lots/{id}/relist"
        actor: AuctionManager
        preconditions:
          - "donation.status == UNSOLD"
          - "auction_lot.status IN {NO_SALE, VOIDED}"
        side_effects:
          - "increments AuctionLot.relist_count by 1"
          - "sets AuctionLot.listed_at_utc to the current logical clock"
          - "increments Donation.version by 1"
        note: "cycle IN_CUSTODY -> UNSOLD -> IN_CUSTODY"
      - from: SOLD
        to: UNSOLD
        trigger: "POST /api/auction-lots/{id}/void-sale"
        actor: AuctionManager
        preconditions:
          - "donation.status == SOLD"
          - "auction_lot.status == SOLD"
          - "donation.payout_status == ACCRUED"
        side_effects:
          - "sets Donation.gross_proceeds_cents, program_fee_cents, tow_allowance_cents, net_to_charity_cents back to 0"
          - "sets Donation.payout_status = PENDING"
          - "appends one ProceedsLedgerEntry with entry_type = REVERSAL, direction = DEBIT, amount_cents = the pre-void Donation.net_to_charity_cents"
          - "decrements CharityAffiliate.pledged_balance_cents by the pre-void Donation.net_to_charity_cents"
          - "increments Donation.version by 1"
      - from: SOLD
        to: CLOSED
        trigger: "POST /api/tax-receipts/{id}/issue"
        actor: FinanceOfficer
        preconditions:
          - "donation.status IN {SOLD, UNSOLD}"
          - "tax_receipt.status == DRAFT"
        side_effects:
          - "copies TaxReceipt.claimed_amount_cents onto Donation.deduction_amount_cents"
          - "marks every FollowUpTask of this donation with task_type = RECEIPT_DELIVERY and status IN {OPEN, ESCALATED} as DONE with resolution_note = 'receipt issued'"
          - "increments Donation.version by 1"
      - from: UNSOLD
        to: CLOSED
        trigger: "POST /api/tax-receipts/{id}/issue"
        actor: FinanceOfficer
        preconditions:
          - "donation.status IN {SOLD, UNSOLD}"
          - "tax_receipt.status == DRAFT"
        side_effects:
          - "copies TaxReceipt.claimed_amount_cents onto Donation.deduction_amount_cents"
          - "marks every FollowUpTask of this donation with task_type = RECEIPT_DELIVERY and status IN {OPEN, ESCALATED} as DONE with resolution_note = 'receipt issued'"
          - "increments Donation.version by 1"
      - from: CLOSED
        to: SOLD
        trigger: "POST /api/tax-receipts/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "donation.status == CLOSED"
          - "tax_receipt.status == ISSUED"
          - "donation.gross_proceeds_cents > 0"
        side_effects:
          - "clears Donation.deduction_amount_cents to null"
          - "increments Donation.version by 1"
        note: "cycle SOLD -> CLOSED -> SOLD via receipt void; a donation whose gross_proceeds_cents == 0 returns to UNSOLD instead"
      - from: CLOSED
        to: UNSOLD
        trigger: "POST /api/tax-receipts/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "donation.status == CLOSED"
          - "tax_receipt.status == ISSUED"
          - "donation.gross_proceeds_cents == 0"
        side_effects:
          - "clears Donation.deduction_amount_cents to null"
          - "increments Donation.version by 1"

  - entity: Donation
    axis: payout_status
    initial_state: PENDING
    terminal_states: [REMITTED, WITHHELD]
    note: "second, independent state axis on the same Donation row"
    transitions:
      - from: PENDING
        to: ACCRUED
        trigger: "POST /api/auction-lots/{id}/record-sale"
        actor: AuctionManager
        preconditions:
          - "donation.payout_status == PENDING"
          - "donation.net_to_charity_cents > 0 after the proceeds calculation"
        side_effects:
          - "cascade link 2 (caused by the ACCRUED transition itself): appends ProceedsLedgerEntry rows PROCEEDS_CREDIT (CREDIT, gross_proceeds_cents), PROGRAM_FEE_DEBIT (DEBIT, program_fee_cents), TOW_COST_DEBIT (DEBIT, tow_allowance_cents, omitted when tow_allowance_cents == 0), ADMIN_FEE_DEBIT (DEBIT, ADMIN_FLAT_FEE_CENTS) and increments CharityAffiliate.pledged_balance_cents by Donation.net_to_charity_cents"
          - "cascade link 3 (caused by the pledged_balance_cents increment): when CharityAffiliate.pledged_balance_cents >= AUTO_BATCH_THRESHOLD_CENTS (500000) and that charity has no RemittanceBatch with status IN {OPEN, CLOSED, DISPUTED}, a RemittanceBatch is created with status = OPEN, period_start_utc = current logical clock, period_end_utc = clock + AUTO_BATCH_PERIOD_DAYS (30) days"
          - "cascade link 4 (caused by the auto-created batch): a FollowUpTask with task_type = REMITTANCE_PENDING, status = OPEN, assigned_role = FinanceOfficer, due_utc = clock + REMITTANCE_FOLLOWUP_DAYS (15) days is created for the donation that triggered the auto-batch"
      - from: ACCRUED
        to: PENDING
        trigger: "POST /api/auction-lots/{id}/void-sale"
        actor: AuctionManager
        preconditions:
          - "donation.payout_status == ACCRUED"
          - "no RemittanceBatch with status IN {CLOSED, PAID} holds a REMITTANCE_SETTLEMENT entry for this donation"
        side_effects:
          - "compensating action for the PENDING -> ACCRUED transition; see the status machine for the ledger and balance reversal"
      - from: ACCRUED
        to: REMITTED
        trigger: "POST /api/remittance-batches/{id}/pay"
        actor: FinanceOfficer
        preconditions:
          - "donation.payout_status == ACCRUED"
          - "the donation is a frozen member of the batch being paid"
        side_effects:
          - "cascade link 2: decrements CharityAffiliate.pledged_balance_cents by Donation.net_to_charity_cents and increments CharityAffiliate.remitted_balance_cents by the donation's share of RemittanceBatch.net_cents (net_to_charity_cents minus the per-line rounded fee for this donation)"
          - "cascade link 3: marks every FollowUpTask of this donation with task_type = REMITTANCE_PENDING and status IN {OPEN, ESCALATED} as DONE with resolution_note = 'batch paid'"
      - from: PENDING
        to: WITHHELD
        trigger: "POST /api/donations/{id}/withhold-payout"
        actor: ProgramAdmin
        preconditions:
          - "donation.payout_status IN {PENDING, ACCRUED}"
        side_effects:
          - "increments Donation.version by 1"
      - from: ACCRUED
        to: WITHHELD
        trigger: "POST /api/donations/{id}/withhold-payout"
        actor: ProgramAdmin
        preconditions:
          - "donation.payout_status IN {PENDING, ACCRUED}"
          - "no RemittanceBatch with status IN {CLOSED, PAID} holds a REMITTANCE_SETTLEMENT entry for this donation"
        side_effects:
          - "decrements CharityAffiliate.pledged_balance_cents by Donation.net_to_charity_cents"
          - "appends one ProceedsLedgerEntry with entry_type = REVERSAL, direction = DEBIT, amount_cents = Donation.net_to_charity_cents"
          - "increments Donation.version by 1"
      - from: PENDING
        to: WITHHELD
        trigger: "POST /api/donations/{id}/decline"
        actor: IntakeAgent
        preconditions:
          - "donation.status == PENDING_REVIEW"
        side_effects:
          - "no ledger movement, because net_to_charity_cents is still 0"

  - entity: TitleRecord
    axis: state
    initial_state: DRAFT
    terminal_states: [CLEARED, ABANDONED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/title-records/{id}/submit-dmv"
        actor: TitleClerk
        preconditions:
          - "title_record.state == DRAFT"
          - "the Donation referenced by donation_id has status IN {ACCEPTED, PICKUP_BLOCKED, IN_CUSTODY, UNSOLD}"
        side_effects:
          - "sets TitleRecord.dmv_filing_reference to a server-minted reference string"
          - "sets TitleRecord.submitted_at_utc to the current logical clock"
          - "increments TitleRecord.version by 1"
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /api/title-records/{id}/dmv-decision with outcome = CLEARED"
        actor: TitleClerk
        preconditions:
          - "title_record.state == SUBMITTED"
        side_effects:
          - "increments TitleRecord.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/title-records/{id}/dmv-decision with outcome = REJECTED"
        actor: TitleClerk
        preconditions:
          - "title_record.state == SUBMITTED"
        side_effects:
          - "increments TitleRecord.rejection_count by 1"
          - "sets TitleRecord.rejection_reason from the request body"
          - "increments TitleRecord.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/title-records/{id}/resubmit"
        actor: TitleClerk
        preconditions:
          - "title_record.state == REJECTED"
          - "title_record.rejection_count <= TITLE_RESUBMIT_LIMIT (2)"
        side_effects:
          - "sets TitleRecord.submitted_at_utc to the current logical clock"
          - "sets TitleRecord.dmv_filing_reference to a new server-minted reference string"
          - "increments TitleRecord.version by 1"
        note: "cycle SUBMITTED -> REJECTED -> SUBMITTED; the third rejection makes rejection_count == 3 > 2 and resubmit is refused with ERR_TITLE_RESUBMIT_LIMIT"
      - from: REJECTED
        to: ABANDONED
        trigger: "POST /api/title-records/{id}/abandon"
        actor: TitleClerk
        preconditions:
          - "title_record.state == REJECTED"
        side_effects:
          - "creates a FollowUpTask with task_type = TITLE_STALE, status = OPEN, assigned_role = TitleClerk, due_utc = clock + REMITTANCE_FOLLOWUP_DAYS (15) days"
          - "increments TitleRecord.version by 1"

  - entity: PickupOrder
    axis: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, FAILED, CANCELLED]
    note: "branching fork: SCHEDULED forks into COMPLETED / FAILED / CANCELLED with three disjoint side-effect sets"
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/pickup-orders/{id}/complete"
        actor: IntakeAgent
        preconditions:
          - "pickup_order.status == SCHEDULED"
          - "the Donation referenced by donation_id has status == ACCEPTED"
          - "the TowVendor referenced by tow_vendor_id has status == ACTIVE"
        side_effects:
          - "sets PickupOrder.actual_pickup_utc to the current logical clock and actual_tow_cost_cents from the request body"
          - "decrements TowVendor.booked_slots_count by 1"
          - "moves the Donation from ACCEPTED to IN_CUSTODY"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /api/pickup-orders/{id}/fail"
        actor: IntakeAgent
        preconditions:
          - "pickup_order.status == SCHEDULED"
          - "the Donation referenced by donation_id has status == ACCEPTED"
        side_effects:
          - "sets PickupOrder.failure_reason from the request body"
          - "decrements TowVendor.booked_slots_count by 1"
          - "cascade link 1: increments Donation.pickup_attempts by 1 and, when the incremented value >= MAX_PICKUP_ATTEMPTS (3), moves the Donation from ACCEPTED to PICKUP_BLOCKED"
          - "cascade link 2 (caused by the Donation entering PICKUP_BLOCKED): creates a FollowUpTask with task_type = PICKUP_ESCALATION"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/pickup-orders/{id}/cancel"
        actor: IntakeAgent
        preconditions:
          - "pickup_order.status == SCHEDULED"
        side_effects:
          - "decrements TowVendor.booked_slots_count by 1"
          - "leaves Donation.pickup_attempts unchanged"

  - entity: AuctionLot
    axis: status
    initial_state: LISTED
    terminal_states: [WITHDRAWN]
    note: "cyclic: LISTED -> NO_SALE -> LISTED, and LISTED -> SOLD -> VOIDED -> LISTED"
    transitions:
      - from: LISTED
        to: SOLD
        trigger: "POST /api/auction-lots/{id}/record-sale"
        actor: AuctionManager
        preconditions:
          - "auction_lot.status == LISTED"
          - "the SalesVenue referenced by venue_id has status == ACTIVE"
          - "the TitleRecord whose donation_id == auction_lot.donation_id exists and has state == CLEARED"
          - "the Donation referenced by donation_id has status == IN_CUSTODY"
          - "request body expected_donation_version equals the Donation's current version"
          - "sale_price_cents >= auction_lot.reserve_price_cents"
        side_effects:
          - "sets AuctionLot.sale_price_cents and sold_at_utc"
          - "runs calculations.donation_net_proceeds and writes the four money fields on the Donation"
          - "moves the Donation status IN_CUSTODY -> SOLD and payout_status PENDING -> ACCRUED, which drives the four-link proceeds cascade"
      - from: LISTED
        to: NO_SALE
        trigger: "POST /api/auction-lots/{id}/record-no-sale"
        actor: AuctionManager
        preconditions:
          - "auction_lot.status == LISTED"
          - "the Donation referenced by donation_id has status == IN_CUSTODY"
        side_effects:
          - "moves the Donation status IN_CUSTODY -> UNSOLD"
      - from: NO_SALE
        to: LISTED
        trigger: "POST /api/auction-lots/{id}/relist"
        actor: AuctionManager
        preconditions:
          - "auction_lot.status IN {NO_SALE, VOIDED}"
          - "the SalesVenue referenced by venue_id has status == ACTIVE"
          - "the venue has fewer than VENUE_DAILY_LOT_CAPACITY (5) lots whose listed_at_utc falls on the same UTC calendar day as the current logical clock and whose status != WITHDRAWN"
        side_effects:
          - "sets AuctionLot.reserve_price_cents from the request body, listed_at_utc to the current clock, and increments relist_count by 1"
          - "moves the Donation status UNSOLD -> IN_CUSTODY"
      - from: SOLD
        to: VOIDED
        trigger: "POST /api/auction-lots/{id}/void-sale"
        actor: AuctionManager
        preconditions:
          - "auction_lot.status == SOLD"
          - "the Donation referenced by donation_id has payout_status == ACCRUED"
          - "no RemittanceBatch with status IN {CLOSED, PAID} holds a REMITTANCE_SETTLEMENT entry for that donation"
        side_effects:
          - "sets AuctionLot.void_reason, clears sale_price_cents and sold_at_utc to null"
          - "reverses the proceeds cascade: appends a REVERSAL ProceedsLedgerEntry, zeroes the Donation money fields, sets payout_status back to PENDING and decrements CharityAffiliate.pledged_balance_cents"
          - "moves the Donation status SOLD -> UNSOLD"
      - from: VOIDED
        to: LISTED
        trigger: "POST /api/auction-lots/{id}/relist"
        actor: AuctionManager
        preconditions:
          - "auction_lot.status IN {NO_SALE, VOIDED}"
          - "the SalesVenue referenced by venue_id has status == ACTIVE"
          - "the venue has fewer than VENUE_DAILY_LOT_CAPACITY (5) lots whose listed_at_utc falls on the same UTC calendar day as the current logical clock and whose status != WITHDRAWN"
        side_effects:
          - "sets AuctionLot.reserve_price_cents from the request body, listed_at_utc to the current clock, and increments relist_count by 1"
          - "moves the Donation status UNSOLD -> IN_CUSTODY"
      - from: NO_SALE
        to: WITHDRAWN
        trigger: "POST /api/auction-lots/{id}/withdraw"
        actor: AuctionManager
        preconditions:
          - "auction_lot.status IN {LISTED, NO_SALE}"
        side_effects:
          - "frees the lot's slot in the venue's daily capacity count for that calendar day"
      - from: LISTED
        to: WITHDRAWN
        trigger: "POST /api/auction-lots/{id}/withdraw"
        actor: AuctionManager
        preconditions:
          - "auction_lot.status IN {LISTED, NO_SALE}"
        side_effects:
          - "frees the lot's slot in the venue's daily capacity count for that calendar day"
          - "moves the Donation status IN_CUSTODY -> UNSOLD"

  - entity: TaxReceipt
    axis: status
    initial_state: DRAFT
    terminal_states: []
    note: |
      cyclic: DRAFT -> ISSUED -> VOIDED -> DRAFT. Entering DRAFT through
      POST /api/tax-receipts also creates the donation's RECEIPT_DELIVERY FollowUpTask
      (due at clock + RECEIPT_DUE_DAYS), which the ISSUED transition marks DONE.
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/tax-receipts/{id}/issue"
        actor: FinanceOfficer
        preconditions:
          - "tax_receipt.status == DRAFT"
          - "the Donation referenced by donation_id has status IN {SOLD, UNSOLD}"
          - "the TitleRecord whose donation_id == tax_receipt.donation_id has state == CLEARED"
        side_effects:
          - "sets control_number, issued_at_utc = current logical clock, issued_by_user_id = X-User-ID"
          - "recomputes claimed_amount_cents, form_type and valuation_variant per calculations.tax_receipt_valuation"
          - "moves the Donation status SOLD or UNSOLD -> CLOSED and copies claimed_amount_cents onto Donation.deduction_amount_cents"
          - "marks the donation's RECEIPT_DELIVERY FollowUpTask rows DONE"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /api/tax-receipts/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "tax_receipt.status == ISSUED"
        side_effects:
          - "sets void_reason, clears control_number to null"
          - "moves the Donation status CLOSED -> SOLD when gross_proceeds_cents > 0, otherwise CLOSED -> UNSOLD, and clears Donation.deduction_amount_cents"
      - from: VOIDED
        to: DRAFT
        trigger: "POST /api/tax-receipts/{id}/reissue"
        actor: FinanceOfficer
        preconditions:
          - "tax_receipt.status == VOIDED"
          - "the Donation referenced by donation_id has status IN {SOLD, UNSOLD}"
        side_effects:
          - "increments reissue_count by 1, clears void_reason to null"
          - "recomputes claimed_amount_cents, form_type and valuation_variant against the donation's current money fields"

  - entity: RemittanceBatch
    axis: status
    initial_state: OPEN
    terminal_states: [PAID]
    note: "cyclic: OPEN -> CLOSED -> DISPUTED -> OPEN"
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/remittance-batches/{id}/close"
        actor: FinanceOfficer
        preconditions:
          - "remittance_batch.status == OPEN"
          - "the CharityAffiliate referenced by charity_id has status == ACTIVE"
          - "the eligible member-donation set is non-empty"
        side_effects:
          - "freezes the member set and writes donation_count, gross_cents, fee_cents (PER_LINE_ROUNDING variant) and net_cents"
          - "appends one REMITTANCE_SETTLEMENT ProceedsLedgerEntry per member donation with remittance_batch_id set to this batch, plus one batch-level CHARITY_FEE_DEBIT entry with donation_id = null and amount_cents = fee_cents"
          - "sets closed_by_user_id = X-User-ID"
          - "increments RemittanceBatch.version by 1"
      - from: CLOSED
        to: PAID
        trigger: "POST /api/remittance-batches/{id}/pay"
        actor: FinanceOfficer
        preconditions:
          - "remittance_batch.status == CLOSED"
          - "X-User-ID != remittance_batch.closed_by_user_id (segregation of duties)"
          - "request body expected_batch_version equals the batch's current version"
        side_effects:
          - "sets paid_by_user_id and payment_reference"
          - "cascade link 1: moves every member Donation payout_status ACCRUED -> REMITTED"
          - "cascade link 2 (caused by each donation becoming REMITTED): decrements CharityAffiliate.pledged_balance_cents by that donation's net_to_charity_cents and increments remitted_balance_cents by that donation's net share"
          - "cascade link 3 (caused by each donation becoming REMITTED): marks that donation's REMITTANCE_PENDING FollowUpTask rows DONE"
          - "increments RemittanceBatch.version by 1"
      - from: CLOSED
        to: DISPUTED
        trigger: "POST /api/remittance-batches/{id}/dispute"
        actor: CharityAdmin
        preconditions:
          - "remittance_batch.status == CLOSED"
          - "X-User-ID equals remittance_batch.charity_id"
        side_effects:
          - "sets dispute_reason"
          - "increments RemittanceBatch.version by 1"
      - from: DISPUTED
        to: OPEN
        trigger: "POST /api/remittance-batches/{id}/reopen"
        actor: FinanceOfficer
        preconditions:
          - "remittance_batch.status == DISPUTED"
        side_effects:
          - "deletes every REMITTANCE_SETTLEMENT and CHARITY_FEE_DEBIT ProceedsLedgerEntry bound to this batch, unfreezing the member set"
          - "resets donation_count, gross_cents, fee_cents, net_cents to 0 and closed_by_user_id to null"
          - "increments RemittanceBatch.version by 1"

  - entity: FollowUpTask
    axis: status
    initial_state: OPEN
    terminal_states: [DONE]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /api/_ops/run-sweep"
        actor: ProgramAdmin
        preconditions:
          - "follow_up_task.status == OPEN"
          - "follow_up_task.due_utc <= current logical clock"
        side_effects:
          - "increments FollowUpTask.version by 1"
      - from: OPEN
        to: DONE
        trigger: "POST /api/follow-up-tasks/{id}/complete"
        actor: ProgramAdmin
        preconditions:
          - "follow_up_task.status IN {OPEN, ESCALATED}"
        side_effects:
          - "sets resolution_note from the request body"
      - from: ESCALATED
        to: DONE
        trigger: "POST /api/follow-up-tasks/{id}/complete"
        actor: ProgramAdmin
        preconditions:
          - "follow_up_task.status IN {OPEN, ESCALATED}"
        side_effects:
          - "sets resolution_note from the request body"
      - from: OPEN
        to: DONE
        trigger: "system, on the transition that resolves the task's reason (receipt issued, batch paid, pickup reset)"
        actor: system
        preconditions:
          - "follow_up_task.status IN {OPEN, ESCALATED}"
        side_effects:
          - "sets resolution_note to the cascade-supplied literal"
      - from: ESCALATED
        to: DONE
        trigger: "system, on the transition that resolves the task's reason (receipt issued, batch paid, pickup reset)"
        actor: system
        preconditions:
          - "follow_up_task.status IN {OPEN, ESCALATED}"
        side_effects:
          - "sets resolution_note to the cascade-supplied literal"

concurrency_rules:
  - rule_id: pickup-order-create-stale-donation
    parent_entity: Donation
    write_endpoint: "POST /api/pickup-orders"
    occ_field: "expected_donation_version"
    description: |
      Creating a PickupOrder against a Donation whose version has advanced since the client
      last observed it is rejected. A new PickupOrder legitimately supersedes a prior FAILED
      one under the retry policy, so a writer whose view of the donation predates that failure
      (or a pickup reset, or a cancellation) would otherwise book a tow window against a stale
      attempt count.
    error_id: ERR_STALE_DONATION_VERSION
    http_status: 412

  - rule_id: record-sale-stale-donation
    parent_entity: Donation
    write_endpoint: "POST /api/auction-lots/{id}/record-sale"
    occ_field: "expected_donation_version"
    description: |
      Recording a sale against a Donation whose version has advanced since the client last read
      it is rejected. A relist legitimately supersedes the prior lot, so a stale donation view
      means the money fields the caller believes it is writing over are no longer current.
    error_id: ERR_STALE_DONATION_VERSION
    http_status: 412

  - rule_id: batch-pay-stale-batch
    parent_entity: RemittanceBatch
    write_endpoint: "POST /api/remittance-batches/{id}/pay"
    occ_field: "expected_batch_version"
    description: |
      Paying a RemittanceBatch whose version has advanced since the client last read it is
      rejected. A dispute-and-reopen legitimately supersedes the frozen member set, so a stale
      batch view means the caller is authorising a payout against figures that no longer hold.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

calculations:
  - name: vehicle_fmv_estimate
    trigger: "POST /api/vehicles (variant BASE_CONDITION) and PATCH /api/vehicles/{id} (variant POST_INSPECTION)"
    algorithm: weighted_scoring
    formula: |
      # condition_mult(g): EXCELLENT -> 1.00, GOOD -> 0.85, FAIR -> 0.65, POOR -> 0.40, SALVAGE -> 0.15
      # odometer_mult(m):
      #   m is null                                 -> ODOMETER_TIER_1_MULT (1.00)
      #   m <= ODOMETER_TIER_1_MAX_MILES (75000)    -> ODOMETER_TIER_1_MULT (1.00)
      #   m <= ODOMETER_TIER_2_MAX_MILES (150000)   -> ODOMETER_TIER_2_MULT (0.85)
      #   otherwise                                 -> ODOMETER_TIER_3_MULT (0.70)
      #
      # Rounding order is pinned: multiply all three factors in full precision,
      # round ONCE half-up to whole cents, then apply the salvage cap, then the floor.
      raw       = vehicle.base_book_value_cents * condition_mult(grade) * odometer_mult(miles)
      rounded   = round_half_up(raw)                       # to whole cents
      capped    = min(rounded, SALVAGE_FMV_CAP_CENTS) if vehicle.salvage_flag else rounded
      fmv       = max(capped, MIN_FMV_CENTS)
    input_set: |
      Exactly one Vehicle row. `grade` and `miles` are chosen by the variant (see `variants`).
      Donation.fmv_estimate_cents is set to the same value on every run (derived-field mirror).
    constants:
      MIN_FMV_CENTS: 10000
      SALVAGE_FMV_CAP_CENTS: 75000
      ODOMETER_TIER_1_MAX_MILES: 75000
      ODOMETER_TIER_1_MULT: 1.00
      ODOMETER_TIER_2_MAX_MILES: 150000
      ODOMETER_TIER_2_MULT: 0.85
      ODOMETER_TIER_3_MULT: 0.70
      CONDITION_MULT_EXCELLENT: 1.00
      CONDITION_MULT_GOOD: 0.85
      CONDITION_MULT_FAIR: 0.65
      CONDITION_MULT_POOR: 0.40
      CONDITION_MULT_SALVAGE: 0.15
    precision: "whole cents, round_half_up, single rounding after the full product"
    variants:
      - name: BASE_CONDITION
        when: "the Vehicle has not been inspected (vehicle.inspected == false); runs on POST /api/vehicles"
        difference: "grade = Donation.declared_condition and miles = null, so odometer_mult is forced to 1.00 regardless of any odometer supplied later"
      - name: POST_INSPECTION
        when: "the Vehicle has been inspected; runs on every PATCH /api/vehicles/{id}"
        difference: "grade = Vehicle.condition_grade and miles = Vehicle.odometer_miles, so the odometer tier can pull the estimate below the BASE_CONDITION figure for the same base_book_value_cents"

  - name: donation_net_proceeds
    trigger: "POST /api/auction-lots/{id}/record-sale (LISTED -> SOLD)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned because the tow allowance cap is expressed as a
      # fraction of a net that itself depends on the program fee. Steps run top to
      # bottom; no step may be re-evaluated after a later step.
      G = auction_lot.sale_price_cents
      rate = PROGRAM_FEE_TIER_1_RATE (0.15) if G <= PROGRAM_FEE_TIER_1_MAX_CENTS (100000)
             else PROGRAM_FEE_TIER_2_RATE (0.12) if G <= PROGRAM_FEE_TIER_2_MAX_CENTS (500000)
             else PROGRAM_FEE_TIER_3_RATE (0.10)
      step_1_program_fee   = min(max(round_half_up(G * rate), MIN_PROGRAM_FEE_CENTS (5000)), G)
      step_2_provisional   = G - step_1_program_fee
      T                    = actual_tow_cost_cents of the PickupOrder for this donation whose
                             status == COMPLETED, or 0 when no such PickupOrder exists
      step_3_tow_allowance = min(T, round_half_up(TOW_ALLOWANCE_PCT (0.25) * step_2_provisional))
      step_4_net           = max(0, step_2_provisional - step_3_tow_allowance - ADMIN_FLAT_FEE_CENTS (2500))
      # writes: Donation.gross_proceeds_cents = G, program_fee_cents = step_1_program_fee,
      #         tow_allowance_cents = step_3_tow_allowance, net_to_charity_cents = step_4_net
    input_set: |
      One AuctionLot transitioning LISTED -> SOLD, plus at most one PickupOrder for the same
      donation_id with status == COMPLETED (there can be at most one, because the donation
      leaves ACCEPTED on the first completion). PickupOrder rows in status SCHEDULED, FAILED
      or CANCELLED contribute nothing.
    constants:
      PROGRAM_FEE_TIER_1_MAX_CENTS: 100000
      PROGRAM_FEE_TIER_1_RATE: 0.15
      PROGRAM_FEE_TIER_2_MAX_CENTS: 500000
      PROGRAM_FEE_TIER_2_RATE: 0.12
      PROGRAM_FEE_TIER_3_RATE: 0.10
      MIN_PROGRAM_FEE_CENTS: 5000
      TOW_ALLOWANCE_PCT: 0.25
      ADMIN_FLAT_FEE_CENTS: 2500
    precision: "whole cents, round_half_up, applied independently at step_1 and step_3"

  - name: tax_receipt_valuation
    trigger: "POST /api/tax-receipts (draft), POST /api/tax-receipts/{id}/issue and POST /api/tax-receipts/{id}/reissue"
    algorithm: threshold
    formula: |
      D = the Donation referenced by tax_receipt.donation_id
      if D.exception_type != NONE:
          variant   = FMV_FULL
          form_type = FORM_1098C_BOX_4B
          claimed   = D.fmv_estimate_cents
      elif D.gross_proceeds_cents > GROSS_PROCEEDS_THRESHOLD_CENTS (50000):
          variant   = GROSS_PROCEEDS
          form_type = FORM_1098C_BOX_4A
          claimed   = D.gross_proceeds_cents
      else:
          variant   = FMV_SAFE_HARBOR
          form_type = ACKNOWLEDGMENT_ONLY
          claimed   = min(D.fmv_estimate_cents, FMV_SAFE_HARBOR_CENTS (50000))
      # The comparison is strictly greater-than: gross_proceeds_cents exactly equal to
      # GROSS_PROCEEDS_THRESHOLD_CENTS takes the FMV_SAFE_HARBOR branch.
    input_set: |
      Exactly one Donation with status IN {SOLD, UNSOLD} and a Vehicle row supplying
      fmv_estimate_cents. Donations with status IN {PENDING_REVIEW, ACCEPTED, PICKUP_BLOCKED,
      IN_CUSTODY, CLOSED, DECLINED, CANCELLED} are not eligible for receipt creation at all.
    constants:
      GROSS_PROCEEDS_THRESHOLD_CENTS: 50000
      FMV_SAFE_HARBOR_CENTS: 50000
    precision: "whole cents; no rounding is performed, both inputs are already integral cents"
    variants:
      - name: GROSS_PROCEEDS
        when: "exception_type == NONE and gross_proceeds_cents > 50000"
        difference: "claims the hammer price; ignores fmv_estimate_cents entirely"
      - name: FMV_FULL
        when: "exception_type != NONE (material improvement, gift to a needy individual, or significant intervening use)"
        difference: "claims the full appraised fmv_estimate_cents and reports Box 4b, producing a different number than GROSS_PROCEEDS for the same sold donation"
      - name: FMV_SAFE_HARBOR
        when: "exception_type == NONE and gross_proceeds_cents <= 50000"
        difference: "claims min(fmv_estimate_cents, 50000) on an acknowledgment-only form"

  - name: remittance_fee
    trigger: "GET /api/remittance-batches/{id} while status == OPEN (provisional) and POST /api/remittance-batches/{id}/close (final)"
    algorithm: aggregation
    formula: |
      members = the eligible member-donation set (see input_set), ordered by Donation.created_at ASC
      gross   = sum over members of d.net_to_charity_cents
      p       = CharityAffiliate.remittance_fee_pct of the batch's charity
      # BATCH_ROUNDING (provisional): one rounding after the sum
      provisional_fee = round_half_up(gross * p)
      # PER_LINE_ROUNDING (final): round each line, then sum
      final_fee       = sum over members of round_half_up(d.net_to_charity_cents * p)
      net             = gross - final_fee
      # RemittanceBatch.provisional_fee_cents = provisional_fee (recomputed on every read while OPEN)
      # RemittanceBatch.fee_cents = final_fee and net_cents = net, both frozen at close
    input_set: |
      Eligibility filter for membership: Donation.charity_id == batch.charity_id
      AND Donation.payout_status == ACCRUED
      AND Donation.net_to_charity_cents > 0
      AND the AuctionLot of that donation whose status == SOLD has sold_at_utc in the
      half-open interval [batch.period_start_utc, batch.period_end_utc)
      AND the donation is not already frozen into another RemittanceBatch with status
      IN {CLOSED, PAID}.
      Order: Donation.created_at ASC; ties (identical created_at) are impossible because the
      logical clock advances only through POST /api/_clock/set_current_utc, and where two
      donations do share a created_at the sum is order-independent by construction.
    constants:
      MAX_REMITTANCE_FEE_PCT: 0.30
    precision: "whole cents, round_half_up"
    variants:
      - name: BATCH_ROUNDING
        when: "batch.status == OPEN; surfaced as provisional_fee_cents on every read"
        difference: "sums the member nets first and rounds once, so a set of lines each ending just below a half-cent can round down by up to (member_count - 1) cents relative to PER_LINE_ROUNDING"
      - name: PER_LINE_ROUNDING
        when: "batch.status IN {CLOSED, PAID}; written into fee_cents at close and never recomputed"
        difference: "rounds each member line before summing, so the frozen fee_cents can exceed provisional_fee_cents for the identical member set"

  - name: charity_balance_projection
    trigger: "GET /api/reports/charity-summary"
    algorithm: projection
    formula: |
      pledged   = CharityAffiliate.pledged_balance_cents
      remitted  = CharityAffiliate.remitted_balance_cents
      accrued_donation_count = count of Donation rows with charity_id == this charity
                               and payout_status == ACCRUED
      unremitted_net_cents   = sum over those same donations of net_to_charity_cents
      ledger_signed_total    = sum over ProceedsLedgerEntry rows whose donation_id belongs to
                               this charity of (amount_cents when direction == CREDIT,
                               -amount_cents when direction == DEBIT)
    input_set: |
      One CharityAffiliate, every Donation with charity_id == that charity regardless of status,
      and every ProceedsLedgerEntry whose donation_id resolves to one of those donations.
      Batch-level entries (donation_id == null) are excluded from ledger_signed_total.
    constants: {}
    precision: "whole cents; no rounding"

  - name: vendor_slot_reconciliation
    trigger: "POST /api/pickup-orders (create), and every PickupOrder transition out of SCHEDULED"
    algorithm: aggregation
    formula: |
      TowVendor.booked_slots_count = count of PickupOrder rows with
        tow_vendor_id == vendor.id AND status == SCHEDULED
      # Maintained incrementally: +1 on create, -1 on complete / fail / cancel.
      # The incremental value MUST equal the full recount at all times.
    input_set: "every PickupOrder row for the vendor; rows in COMPLETED, FAILED or CANCELLED are excluded"
    constants: {}
    precision: "integer count"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in the API endpoint table"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every id in the request path resolves to a stored row, validated left to right"
    error_id: ERR_DONATION_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterised endpoints; the error_id names the entity that failed to resolve (ERR_DONOR_NOT_FOUND, ERR_CHARITY_NOT_FOUND, ERR_DONATION_NOT_FOUND, ERR_VEHICLE_NOT_FOUND, ERR_TITLE_RECORD_NOT_FOUND, ERR_TOW_VENDOR_NOT_FOUND, ERR_PICKUP_ORDER_NOT_FOUND, ERR_VENUE_NOT_FOUND, ERR_AUCTION_LOT_NOT_FOUND, ERR_TAX_RECEIPT_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_TASK_NOT_FOUND)"
  - priority: 4
    category: auth
    check: "for entity_backed roles, X-User-ID equals the resource's owning foreign key (Donor acting on Donation.donor_id, CharityAdmin acting on RemittanceBatch.charity_id or Donation.charity_id)"
    error_id: ERR_FORBIDDEN_OWNER
    http_status: 403
    applies_to: "POST /api/donations/{id}/cancel, GET /api/donations (with donor_id or charity_id filter), POST /api/remittance-batches/{id}/dispute, GET /api/reports/charity-summary"
  - priority: 5
    category: business_constraint
    check: "request body carries every required field with the declared type, enum members are legal, integers that must be positive are positive, and pagination limit is within [1, 100] with offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored row"
    error_id: ERR_DONOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/donations, POST /api/vehicles, POST /api/title-records, POST /api/pickup-orders, POST /api/auction-lots, POST /api/tax-receipts, POST /api/remittance-batches"
  - priority: 7
    category: business_safety
    check: "the FinanceOfficer paying a RemittanceBatch is not the FinanceOfficer whose X-User-ID was recorded in closed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/remittance-batches/{id}/pay"
  - priority: 8
    category: state
    check: "the expected_<parent>_version supplied in the body equals the parent's current version"
    error_id: ERR_STALE_DONATION_VERSION
    http_status: 412
    applies_to: "POST /api/pickup-orders and POST /api/auction-lots/{id}/record-sale use ERR_STALE_DONATION_VERSION; POST /api/remittance-batches/{id}/pay uses ERR_STALE_BATCH_VERSION"
  - priority: 9
    category: state
    check: "the target resource is in a state from which the requested transition is declared in the state machine table"
    error_id: ERR_INVALID_DONATION_STATE
    http_status: 409
    applies_to: "all transition endpoints; the error_id names the entity whose state blocked the call (ERR_INVALID_DONATION_STATE, ERR_INVALID_TITLE_STATE, ERR_INVALID_PICKUP_STATE, ERR_INVALID_LOT_STATE, ERR_INVALID_RECEIPT_STATE, ERR_INVALID_BATCH_STATE, ERR_INVALID_TASK_STATE)"
  - priority: 10
    category: state
    check: "the donation's payout_status permits the requested money movement"
    error_id: ERR_INVALID_PAYOUT_STATE
    http_status: 409
    applies_to: "POST /api/auction-lots/{id}/void-sale, POST /api/donations/{id}/withhold-payout, POST /api/remittance-batches/{id}/pay"
  - priority: 11
    category: business_safety
    check: "the Donor referenced by the donation has status == ACTIVE"
    error_id: ERR_DONOR_BLOCKED
    http_status: 409
    applies_to: "POST /api/donations, POST /api/donations/{id}/accept"
  - priority: 12
    category: business_safety
    check: "the CharityAffiliate referenced by the donation or batch has status == ACTIVE"
    error_id: ERR_CHARITY_SUSPENDED
    http_status: 409
    applies_to: "POST /api/donations, POST /api/donations/{id}/accept, POST /api/remittance-batches, POST /api/remittance-batches/{id}/close"
  - priority: 13
    category: business_safety
    check: "the TowVendor has status == ACTIVE, and the SalesVenue has status == ACTIVE"
    error_id: ERR_VENDOR_SUSPENDED
    http_status: 409
    applies_to: "POST /api/pickup-orders and POST /api/pickup-orders/{id}/complete use ERR_VENDOR_SUSPENDED; POST /api/auction-lots, POST /api/auction-lots/{id}/record-sale and POST /api/auction-lots/{id}/relist use ERR_VENUE_SUSPENDED"
  - priority: 14
    category: business_safety
    check: "a TitleRecord exists for the donation and its state == CLEARED"
    error_id: ERR_TITLE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /api/auction-lots/{id}/record-sale, POST /api/tax-receipts, POST /api/tax-receipts/{id}/issue"
  - priority: 15
    category: business_safety
    check: "the title has been rejected at most TITLE_RESUBMIT_LIMIT (2) times before a resubmission is accepted"
    error_id: ERR_TITLE_RESUBMIT_LIMIT
    http_status: 409
    applies_to: "POST /api/title-records/{id}/resubmit"
  - priority: 16
    category: business_safety
    check: "the donation has no TaxReceipt whose status is DRAFT or ISSUED"
    error_id: ERR_RECEIPT_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /api/tax-receipts"
  - priority: 17
    category: business_referential
    check: "a Vehicle row exists for the donation, because the receipt's fallback valuation reads fmv_estimate_cents"
    error_id: ERR_VEHICLE_RECORD_MISSING
    http_status: 409
    applies_to: "POST /api/tax-receipts"
  - priority: 18
    category: business_referential
    check: "the row being created does not duplicate an existing one-per-parent record (one Vehicle per Donation, one TitleRecord per Donation) and the VIN is not already registered"
    error_id: ERR_DUPLICATE_VEHICLE
    http_status: 409
    applies_to: "POST /api/vehicles uses ERR_DUPLICATE_VEHICLE then ERR_DUPLICATE_VIN; POST /api/title-records uses ERR_DUPLICATE_TITLE_RECORD"
  - priority: 19
    category: business_referential
    check: "the donation is not already frozen into a RemittanceBatch whose status is CLOSED or PAID"
    error_id: ERR_DONATION_SETTLED
    http_status: 409
    applies_to: "POST /api/auction-lots/{id}/void-sale, POST /api/donations/{id}/withhold-payout"
  - priority: 20
    category: business_temporal
    check: "scheduled_end_utc is strictly after scheduled_start_utc; period_end_utc is strictly after period_start_utc"
    error_id: ERR_PICKUP_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /api/pickup-orders uses ERR_PICKUP_WINDOW_INVALID; POST /api/remittance-batches uses ERR_BATCH_PERIOD_INVALID"
  - priority: 21
    category: business_temporal
    check: "scheduled_start_utc is greater than or equal to the current logical clock"
    error_id: ERR_PICKUP_IN_PAST
    http_status: 422
    applies_to: "POST /api/pickup-orders"
  - priority: 22
    category: business_temporal
    check: "the requested window does not collide with any other SCHEDULED PickupOrder on the same tow_vendor_id; a collision exists when new.scheduled_start_utc < existing.scheduled_end_utc + PICKUP_BUFFER_MINUTES (90) AND existing.scheduled_start_utc < new.scheduled_end_utc + PICKUP_BUFFER_MINUTES (90). Windows are half-open [start, end) and a new window starting exactly PICKUP_BUFFER_MINUTES after an existing window's end is accepted."
    error_id: ERR_VENDOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/pickup-orders"
  - priority: 23
    category: business_constraint
    check: "the vendor's SCHEDULED order count after this create would not exceed TowVendor.daily_capacity_slots"
    error_id: ERR_VENDOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /api/pickup-orders"
  - priority: 24
    category: business_constraint
    check: "the donation's pickup_attempts is strictly less than MAX_PICKUP_ATTEMPTS (3)"
    error_id: ERR_PICKUP_ATTEMPTS_EXCEEDED
    http_status: 409
    applies_to: "POST /api/pickup-orders"
  - priority: 25
    category: business_constraint
    check: "the venue hosts fewer than VENUE_DAILY_LOT_CAPACITY (5) lots whose listed_at_utc falls on the same UTC calendar day [00:00:00Z, 24:00:00Z) as the current logical clock and whose status != WITHDRAWN"
    error_id: ERR_VENUE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /api/auction-lots, POST /api/auction-lots/{id}/relist"
  - priority: 26
    category: business_constraint
    check: "unique natural keys are free: Donor.email, CharityAffiliate.ein"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /api/donors uses ERR_DUPLICATE_EMAIL; POST /api/charities uses ERR_DUPLICATE_EIN"
  - priority: 27
    category: business_fiscal
    check: "sale_price_cents >= auction_lot.reserve_price_cents"
    error_id: ERR_RESERVE_NOT_MET
    http_status: 422
    applies_to: "POST /api/auction-lots/{id}/record-sale"
  - priority: 28
    category: business_fiscal
    check: "the batch's eligible member-donation set is non-empty at close time"
    error_id: ERR_BATCH_EMPTY
    http_status: 422
    applies_to: "POST /api/remittance-batches/{id}/close"
  - priority: 29
    category: business_fiscal
    check: "remittance_fee_pct is within [0, MAX_REMITTANCE_FEE_PCT (0.30)]"
    error_id: ERR_FEE_PCT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /api/charities"

endpoints:
  # ---------- configuration & reference data ----------
  - method: POST
    path: "/api/charities"
    description: "register a beneficiary charity affiliate"
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "ein", "state_code", "remittance_fee_pct?"]
    output: CharityAffiliate
    side_effects: ["initialises pledged_balance_cents and remitted_balance_cents to 0"]
  - method: GET
    path: "/api/charities/{id}"
    description: "read one charity affiliate including its live balances"
    roles: [ProgramAdmin, FinanceOfficer, CharityAdmin, IntakeAgent, AuctionManager, TitleClerk]
    code: 200
    input: []
    output: CharityAffiliate
    side_effects: []
  - method: GET
    path: "/api/charities"
    description: "list charity affiliates"
    roles: [ProgramAdmin, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CharityAffiliate[]
    side_effects: []
  - method: POST
    path: "/api/charities/{id}/suspend"
    description: "suspend a charity affiliate so no new donations or batches may be booked to it"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CharityAffiliate
    side_effects: ["sets status = SUSPENDED", "increments CharityAffiliate.version by 1"]
  - method: POST
    path: "/api/donors"
    description: "register a donor"
    roles: [IntakeAgent, ProgramAdmin]
    code: 201
    input: ["email", "full_name", "state_code"]
    output: Donor
    side_effects: ["initialises donation_count to 0"]
  - method: GET
    path: "/api/donors/{id}"
    description: "read one donor"
    roles: [IntakeAgent, ProgramAdmin, FinanceOfficer, Donor]
    code: 200
    input: []
    output: Donor
    side_effects: []
  - method: POST
    path: "/api/donors/{id}/block"
    description: "block a donor from creating further donations"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason"]
    output: Donor
    side_effects: ["sets status = BLOCKED", "increments Donor.version by 1"]
  - method: POST
    path: "/api/tow-vendors"
    description: "register a tow operator"
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "service_state_code", "hourly_rate_cents", "daily_capacity_slots"]
    output: TowVendor
    side_effects: ["initialises booked_slots_count to 0"]
  - method: GET
    path: "/api/tow-vendors/{id}"
    description: "read one tow vendor including booked_slots_count"
    roles: [ProgramAdmin, IntakeAgent, FinanceOfficer]
    code: 200
    input: []
    output: TowVendor
    side_effects: []
  - method: POST
    path: "/api/tow-vendors/{id}/suspend"
    description: "suspend a tow vendor"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: TowVendor
    side_effects: ["sets status = SUSPENDED", "increments TowVendor.version by 1"]
  - method: POST
    path: "/api/venues"
    description: "register an auction or salvage venue"
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "venue_type", "state_code", "commission_pct?"]
    output: SalesVenue
    side_effects: []
  - method: GET
    path: "/api/venues/{id}"
    description: "read one sales venue"
    roles: [ProgramAdmin, AuctionManager, FinanceOfficer]
    code: 200
    input: []
    output: SalesVenue
    side_effects: []
  - method: POST
    path: "/api/venues/{id}/suspend"
    description: "suspend a sales venue"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SalesVenue
    side_effects: ["sets status = SUSPENDED", "increments SalesVenue.version by 1"]
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "test-driving endpoint that moves the server's logical clock. Before any call the logical clock reads exactly 2026-07-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["all subsequent created_at, updated_at, due_utc, listed_at_utc, sold_at_utc and window comparisons use the new instant"]

  # ---------- donation intake ----------
  - method: POST
    path: "/api/donations"
    description: "record a donation offer"
    roles: [IntakeAgent, ProgramAdmin]
    code: 201
    input: ["donor_id", "charity_id", "intake_channel", "declared_condition", "pickup_required?"]
    output: Donation
    side_effects: ["increments Donor.donation_count by 1", "status = PENDING_REVIEW, payout_status = PENDING"]
  - method: GET
    path: "/api/donations/{id}"
    description: "read one donation including both state axes and all money fields"
    roles: [IntakeAgent, TitleClerk, AuctionManager, FinanceOfficer, ProgramAdmin, CharityAdmin, Donor]
    code: 200
    input: []
    output: Donation
    side_effects: []
  - method: GET
    path: "/api/donations"
    description: "list donations, filtered by donor, charity, disposition status or payout status"
    roles: [IntakeAgent, TitleClerk, AuctionManager, FinanceOfficer, ProgramAdmin, CharityAdmin, Donor]
    code: 200
    input: ["donor_id?", "charity_id?", "status?", "payout_status?", "limit?", "offset?"]
    output: Donation[]
    side_effects: []
  - method: POST
    path: "/api/donations/{id}/accept"
    description: "accept a donation offer into the program"
    roles: [IntakeAgent]
    code: 200
    input: []
    output: Donation
    side_effects: ["moves status PENDING_REVIEW -> ACCEPTED", "increments Donation.version by 1"]
  - method: POST
    path: "/api/donations/{id}/decline"
    description: "decline a donation offer"
    roles: [IntakeAgent]
    code: 200
    input: ["reason"]
    output: Donation
    side_effects: ["moves status PENDING_REVIEW -> DECLINED and payout_status PENDING -> WITHHELD", "increments Donation.version by 1"]
  - method: POST
    path: "/api/donations/{id}/cancel"
    description: "donor withdraws a donation before it is taken into custody"
    roles: [Donor, ProgramAdmin]
    code: 200
    input: ["reason"]
    output: Donation
    side_effects: ["moves status to CANCELLED", "decrements Donor.donation_count by 1", "cancels SCHEDULED PickupOrder rows, each decrementing TowVendor.booked_slots_count by 1", "increments Donation.version by 1"]
  - method: POST
    path: "/api/donations/{id}/receive-dropoff"
    description: "record that a donor delivered the vehicle themselves"
    roles: [IntakeAgent]
    code: 200
    input: []
    output: Donation
    side_effects: ["moves status ACCEPTED -> IN_CUSTODY", "increments Donation.version by 1"]
  - method: POST
    path: "/api/donations/{id}/reset-pickup"
    description: "clear a pickup block so tow scheduling can resume"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason"]
    output: Donation
    side_effects: ["moves status PICKUP_BLOCKED -> ACCEPTED", "resets pickup_attempts to 0", "marks PICKUP_ESCALATION FollowUpTask rows DONE", "increments Donation.version by 1"]
  - method: POST
    path: "/api/donations/{id}/withhold-payout"
    description: "withhold the charity payout for a donation"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason"]
    output: Donation
    side_effects: ["moves payout_status to WITHHELD", "when the prior payout_status was ACCRUED, decrements CharityAffiliate.pledged_balance_cents and appends a REVERSAL ProceedsLedgerEntry", "increments Donation.version by 1"]
  - method: POST
    path: "/api/donations/{id}/exception"
    description: "record an IRS 1098-C exception that switches the receipt to the full-FMV valuation"
    roles: [ProgramAdmin]
    code: 200
    input: ["exception_type"]
    output: Donation
    side_effects: ["sets exception_type", "increments Donation.version by 1"]
  - method: GET
    path: "/api/donations/{id}/ledger-entries"
    description: "list the proceeds ledger entries recorded against a donation, oldest first"
    roles: [FinanceOfficer, ProgramAdmin, AuctionManager, CharityAdmin]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: ProceedsLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/api/donations/{id}/follow-up-tasks"
    description: "list the follow-up tasks raised for a donation, oldest first"
    roles: [IntakeAgent, TitleClerk, FinanceOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "task_type?", "limit?", "offset?"]
    output: FollowUpTask[]
    side_effects: []

  # ---------- vehicle / asset ----------
  - method: POST
    path: "/api/vehicles"
    description: "attach the asset record to a donation and compute the BASE_CONDITION FMV estimate"
    roles: [IntakeAgent, AuctionManager]
    code: 201
    input: ["donation_id", "vin", "year", "make", "model", "base_book_value_cents", "salvage_flag?", "keys_present?"]
    output: Vehicle
    side_effects: ["runs calculations.vehicle_fmv_estimate variant BASE_CONDITION", "mirrors fmv_estimate_cents onto Donation.fmv_estimate_cents", "increments Donation.version by 1"]
  - method: GET
    path: "/api/vehicles/{id}"
    description: "read one vehicle record"
    roles: [IntakeAgent, AuctionManager, FinanceOfficer, ProgramAdmin, TitleClerk]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/api/vehicles"
    description: "list vehicle records, optionally filtered by donation"
    roles: [IntakeAgent, AuctionManager, FinanceOfficer, ProgramAdmin, TitleClerk]
    code: 200
    input: ["donation_id?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []
  - method: PATCH
    path: "/api/vehicles/{id}"
    description: "record an inspection and recompute the FMV estimate under the POST_INSPECTION variant"
    roles: [AuctionManager, IntakeAgent]
    code: 200
    input: ["odometer_miles?", "condition_grade?", "salvage_flag?", "keys_present?"]
    output: Vehicle
    side_effects: ["sets inspected = true", "runs calculations.vehicle_fmv_estimate variant POST_INSPECTION", "mirrors fmv_estimate_cents onto Donation.fmv_estimate_cents", "increments Donation.version by 1"]

  # ---------- title & DMV ----------
  - method: POST
    path: "/api/title-records"
    description: "open a title clearance record for a donation"
    roles: [TitleClerk]
    code: 201
    input: ["donation_id", "title_number", "owner_name", "lien_holder?"]
    output: TitleRecord
    side_effects: ["state = DRAFT, rejection_count = 0"]
  - method: GET
    path: "/api/title-records/{id}"
    description: "read one title record"
    roles: [TitleClerk, ProgramAdmin, AuctionManager, FinanceOfficer]
    code: 200
    input: []
    output: TitleRecord
    side_effects: []
  - method: GET
    path: "/api/title-records"
    description: "list title records, optionally filtered by donation"
    roles: [TitleClerk, ProgramAdmin, AuctionManager, FinanceOfficer]
    code: 200
    input: ["donation_id?", "state?", "limit?", "offset?"]
    output: TitleRecord[]
    side_effects: []
  - method: POST
    path: "/api/title-records/{id}/submit-dmv"
    description: "file the title with the DMV"
    roles: [TitleClerk]
    code: 200
    input: []
    output: TitleRecord
    side_effects: ["moves state DRAFT -> SUBMITTED", "mints dmv_filing_reference", "stamps submitted_at_utc", "increments TitleRecord.version by 1"]
  - method: POST
    path: "/api/title-records/{id}/dmv-decision"
    description: "record the DMV's answer on a submitted title"
    roles: [TitleClerk]
    code: 200
    input: ["outcome", "rejection_reason?"]
    output: TitleRecord
    side_effects: ["moves state SUBMITTED -> CLEARED or SUBMITTED -> REJECTED", "on rejection increments rejection_count by 1 and stores rejection_reason", "increments TitleRecord.version by 1"]
  - method: POST
    path: "/api/title-records/{id}/resubmit"
    description: "refile a rejected title with the DMV"
    roles: [TitleClerk]
    code: 200
    input: ["title_number?", "owner_name?"]
    output: TitleRecord
    side_effects: ["moves state REJECTED -> SUBMITTED", "re-mints dmv_filing_reference", "restamps submitted_at_utc", "increments TitleRecord.version by 1"]
  - method: POST
    path: "/api/title-records/{id}/abandon"
    description: "give up on clearing a rejected title"
    roles: [TitleClerk]
    code: 200
    input: ["reason"]
    output: TitleRecord
    side_effects: ["moves state REJECTED -> ABANDONED", "creates a TITLE_STALE FollowUpTask", "increments TitleRecord.version by 1"]

  # ---------- pickup & tow ----------
  - method: POST
    path: "/api/pickup-orders"
    description: "reserve a tow window with a vendor for an accepted donation"
    roles: [IntakeAgent]
    code: 201
    input: ["donation_id", "tow_vendor_id", "scheduled_start_utc", "scheduled_end_utc", "expected_donation_version"]
    output: PickupOrder
    side_effects: ["increments TowVendor.booked_slots_count by 1", "sets attempt_number = Donation.pickup_attempts + 1", "increments Donation.version by 1"]
  - method: GET
    path: "/api/pickup-orders/{id}"
    description: "read one pickup order"
    roles: [IntakeAgent, ProgramAdmin, FinanceOfficer]
    code: 200
    input: []
    output: PickupOrder
    side_effects: []
  - method: GET
    path: "/api/pickup-orders"
    description: "list pickup orders, optionally filtered by donation or vendor"
    roles: [IntakeAgent, ProgramAdmin, FinanceOfficer]
    code: 200
    input: ["donation_id?", "tow_vendor_id?", "status?", "limit?", "offset?"]
    output: PickupOrder[]
    side_effects: []
  - method: POST
    path: "/api/pickup-orders/{id}/complete"
    description: "record a successful tow and its billed cost"
    roles: [IntakeAgent]
    code: 200
    input: ["actual_tow_cost_cents"]
    output: PickupOrder
    side_effects: ["moves status SCHEDULED -> COMPLETED", "decrements TowVendor.booked_slots_count by 1", "moves the Donation ACCEPTED -> IN_CUSTODY", "increments Donation.version by 1"]
  - method: POST
    path: "/api/pickup-orders/{id}/fail"
    description: "record a failed tow attempt"
    roles: [IntakeAgent]
    code: 200
    input: ["failure_reason"]
    output: PickupOrder
    side_effects: ["moves status SCHEDULED -> FAILED", "decrements TowVendor.booked_slots_count by 1", "increments Donation.pickup_attempts by 1 and blocks the donation on the third failure, which itself raises a PICKUP_ESCALATION FollowUpTask", "increments Donation.version by 1"]
  - method: POST
    path: "/api/pickup-orders/{id}/cancel"
    description: "release a reserved tow window"
    roles: [IntakeAgent]
    code: 200
    input: ["reason"]
    output: PickupOrder
    side_effects: ["moves status SCHEDULED -> CANCELLED", "decrements TowVendor.booked_slots_count by 1", "leaves Donation.pickup_attempts unchanged"]

  # ---------- auction / salvage & proceeds ----------
  - method: POST
    path: "/api/auction-lots"
    description: "list a donation in a venue's sale"
    roles: [AuctionManager]
    code: 201
    input: ["donation_id", "venue_id", "lot_number", "reserve_price_cents"]
    output: AuctionLot
    side_effects: ["status = LISTED", "stamps listed_at_utc from the logical clock", "consumes one of the venue's daily lot slots"]
  - method: GET
    path: "/api/auction-lots/{id}"
    description: "read one auction lot"
    roles: [AuctionManager, ProgramAdmin, FinanceOfficer]
    code: 200
    input: []
    output: AuctionLot
    side_effects: []
  - method: GET
    path: "/api/auction-lots"
    description: "list auction lots, optionally filtered by donation or venue"
    roles: [AuctionManager, ProgramAdmin, FinanceOfficer]
    code: 200
    input: ["donation_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: AuctionLot[]
    side_effects: []
  - method: POST
    path: "/api/auction-lots/{id}/record-sale"
    description: "record the hammer price and run the proceeds waterfall"
    roles: [AuctionManager]
    code: 200
    input: ["sale_price_cents", "expected_donation_version"]
    output: AuctionLot
    side_effects: ["moves lot LISTED -> SOLD", "runs calculations.donation_net_proceeds", "moves Donation IN_CUSTODY -> SOLD and payout_status PENDING -> ACCRUED", "appends the PROCEEDS_CREDIT / PROGRAM_FEE_DEBIT / TOW_COST_DEBIT / ADMIN_FEE_DEBIT ledger entries", "increments CharityAffiliate.pledged_balance_cents", "auto-creates a RemittanceBatch and a REMITTANCE_PENDING FollowUpTask once pledged_balance_cents reaches AUTO_BATCH_THRESHOLD_CENTS", "increments Donation.version by 1"]
  - method: POST
    path: "/api/auction-lots/{id}/record-no-sale"
    description: "record that a lot failed to sell"
    roles: [AuctionManager]
    code: 200
    input: ["reason?"]
    output: AuctionLot
    side_effects: ["moves lot LISTED -> NO_SALE", "moves Donation IN_CUSTODY -> UNSOLD", "increments Donation.version by 1"]
  - method: POST
    path: "/api/auction-lots/{id}/relist"
    description: "return an unsold or voided lot to the block"
    roles: [AuctionManager]
    code: 200
    input: ["reserve_price_cents"]
    output: AuctionLot
    side_effects: ["moves lot NO_SALE or VOIDED -> LISTED", "increments relist_count by 1", "restamps listed_at_utc", "moves Donation UNSOLD -> IN_CUSTODY", "increments Donation.version by 1"]
  - method: POST
    path: "/api/auction-lots/{id}/void-sale"
    description: "reverse a recorded sale and unwind the proceeds cascade"
    roles: [AuctionManager]
    code: 200
    input: ["void_reason"]
    output: AuctionLot
    side_effects: ["moves lot SOLD -> VOIDED", "appends a REVERSAL ledger entry equal to the pre-void net_to_charity_cents", "zeroes the Donation money fields", "moves Donation SOLD -> UNSOLD and payout_status ACCRUED -> PENDING", "decrements CharityAffiliate.pledged_balance_cents", "increments Donation.version by 1"]
  - method: POST
    path: "/api/auction-lots/{id}/withdraw"
    description: "pull a lot out of the sale entirely"
    roles: [AuctionManager]
    code: 200
    input: ["reason"]
    output: AuctionLot
    side_effects: ["moves lot LISTED or NO_SALE -> WITHDRAWN", "frees the venue daily-capacity slot", "moves Donation IN_CUSTODY -> UNSOLD when the lot was LISTED"]

  # ---------- tax receipt (1098-C) ----------
  - method: POST
    path: "/api/tax-receipts"
    description: "draft the donor's tax receipt and select its valuation variant"
    roles: [FinanceOfficer]
    code: 201
    input: ["donation_id"]
    output: TaxReceipt
    side_effects: ["runs calculations.tax_receipt_valuation", "status = DRAFT", "creates one FollowUpTask with task_type = RECEIPT_DELIVERY, status = OPEN, assigned_role = FinanceOfficer and due_utc = current logical clock + RECEIPT_DUE_DAYS (30) days"]
  - method: GET
    path: "/api/tax-receipts/{id}"
    description: "read one tax receipt"
    roles: [FinanceOfficer, ProgramAdmin, Donor]
    code: 200
    input: []
    output: TaxReceipt
    side_effects: []
  - method: GET
    path: "/api/tax-receipts"
    description: "list tax receipts, optionally filtered by donation"
    roles: [FinanceOfficer, ProgramAdmin, Donor]
    code: 200
    input: ["donation_id?", "status?", "limit?", "offset?"]
    output: TaxReceipt[]
    side_effects: []
  - method: POST
    path: "/api/tax-receipts/{id}/issue"
    description: "issue the receipt to the donor and close the donation"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: TaxReceipt
    side_effects: ["moves receipt DRAFT -> ISSUED", "mints control_number and stamps issued_at_utc and issued_by_user_id", "recomputes the valuation", "moves the Donation SOLD or UNSOLD -> CLOSED and copies claimed_amount_cents onto deduction_amount_cents", "marks RECEIPT_DELIVERY FollowUpTask rows DONE", "increments Donation.version by 1"]
  - method: POST
    path: "/api/tax-receipts/{id}/void"
    description: "void an issued receipt"
    roles: [ProgramAdmin]
    code: 200
    input: ["void_reason"]
    output: TaxReceipt
    side_effects: ["moves receipt ISSUED -> VOIDED", "clears control_number", "reopens the Donation from CLOSED back to SOLD or UNSOLD and clears deduction_amount_cents", "increments Donation.version by 1"]
  - method: POST
    path: "/api/tax-receipts/{id}/reissue"
    description: "return a voided receipt to draft and revalue it"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: TaxReceipt
    side_effects: ["moves receipt VOIDED -> DRAFT", "increments reissue_count by 1", "recomputes claimed_amount_cents, form_type and valuation_variant against the donation's current fields"]

  # ---------- charity remittance & fee ----------
  - method: POST
    path: "/api/remittance-batches"
    description: "open a remittance batch sweeping a charity's accrued donations over a sale-date window"
    roles: [FinanceOfficer]
    code: 201
    input: ["charity_id", "period_start_utc", "period_end_utc"]
    output: RemittanceBatch
    side_effects: ["status = OPEN", "computes provisional_fee_cents under the BATCH_ROUNDING variant"]
  - method: GET
    path: "/api/remittance-batches/{id}"
    description: "read one remittance batch; while OPEN the provisional_fee_cents is recomputed on every read"
    roles: [FinanceOfficer, ProgramAdmin, CharityAdmin]
    code: 200
    input: []
    output: RemittanceBatch
    side_effects: ["recomputes provisional_fee_cents and gross_cents while status == OPEN"]
  - method: GET
    path: "/api/remittance-batches"
    description: "list remittance batches, optionally filtered by charity"
    roles: [FinanceOfficer, ProgramAdmin, CharityAdmin]
    code: 200
    input: ["charity_id?", "status?", "limit?", "offset?"]
    output: RemittanceBatch[]
    side_effects: []
  - method: GET
    path: "/api/remittance-batches/{id}/ledger-entries"
    description: "list the settlement and fee ledger entries bound to a batch, oldest first"
    roles: [FinanceOfficer, ProgramAdmin, CharityAdmin]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: ProceedsLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/api/remittance-batches/{id}/close"
    description: "freeze the batch member set and compute the final per-line fee"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RemittanceBatch
    side_effects: ["moves status OPEN -> CLOSED", "writes donation_count, gross_cents, fee_cents (PER_LINE_ROUNDING) and net_cents", "appends one REMITTANCE_SETTLEMENT entry per member donation plus one batch-level CHARITY_FEE_DEBIT entry", "records closed_by_user_id", "increments RemittanceBatch.version by 1"]
  - method: POST
    path: "/api/remittance-batches/{id}/pay"
    description: "pay out a closed batch; the officer who closed it may not pay it"
    roles: [FinanceOfficer]
    code: 200
    input: ["payment_reference", "expected_batch_version"]
    output: RemittanceBatch
    side_effects: ["moves status CLOSED -> PAID", "moves every member Donation payout_status ACCRUED -> REMITTED", "moves each member's net from CharityAffiliate.pledged_balance_cents into remitted_balance_cents", "marks REMITTANCE_PENDING FollowUpTask rows DONE", "increments RemittanceBatch.version by 1"]
  - method: POST
    path: "/api/remittance-batches/{id}/dispute"
    description: "charity disputes a closed batch before payment"
    roles: [CharityAdmin]
    code: 200
    input: ["dispute_reason"]
    output: RemittanceBatch
    side_effects: ["moves status CLOSED -> DISPUTED", "increments RemittanceBatch.version by 1"]
  - method: POST
    path: "/api/remittance-batches/{id}/reopen"
    description: "reopen a disputed batch, unfreezing its member set"
    roles: [FinanceOfficer]
    code: 200
    input: ["reason"]
    output: RemittanceBatch
    side_effects: ["moves status DISPUTED -> OPEN", "deletes the batch's REMITTANCE_SETTLEMENT and CHARITY_FEE_DEBIT ledger entries", "resets donation_count, gross_cents, fee_cents, net_cents and closed_by_user_id", "increments RemittanceBatch.version by 1"]

  # ---------- follow-up, reporting & ops ----------
  - method: GET
    path: "/api/follow-up-tasks/{id}"
    description: "read one follow-up task"
    roles: [IntakeAgent, TitleClerk, FinanceOfficer, ProgramAdmin]
    code: 200
    input: []
    output: FollowUpTask
    side_effects: []
  - method: POST
    path: "/api/follow-up-tasks/{id}/complete"
    description: "close a follow-up task by hand"
    roles: [ProgramAdmin]
    code: 200
    input: ["resolution_note"]
    output: FollowUpTask
    side_effects: ["moves status OPEN or ESCALATED -> DONE"]
  - method: POST
    path: "/api/_ops/run-sweep"
    description: "ops-run checkpoint: escalates every OPEN FollowUpTask whose due_utc has passed and raises TITLE_STALE tasks for titles submitted more than STALE_TITLE_DAYS (45) ago"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ escalated_task_count: integer, stale_title_task_count: integer }"
    side_effects: ["moves matching FollowUpTask rows OPEN -> ESCALATED", "creates one TITLE_STALE FollowUpTask per stale SUBMITTED TitleRecord that has no OPEN or ESCALATED TITLE_STALE task"]
  - method: GET
    path: "/api/reports/charity-summary"
    description: "computed read: a charity's pledged and remitted balances plus its unremitted accrual"
    roles: [FinanceOfficer, ProgramAdmin, CharityAdmin]
    code: 200
    input: ["charity_id"]
    output: "{ charity_id: string, pledged_balance_cents: integer, remitted_balance_cents: integer, accrued_donation_count: integer, unremitted_net_cents: integer, ledger_signed_total: integer }"
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed for the endpoint"
  - id: ERR_FORBIDDEN_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource whose owning foreign key is not its X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, wrong type, illegal enum member, non-positive amount, or pagination outside limit in [1,100] / offset >= 0"
  - id: ERR_DONOR_NOT_FOUND
    http: 404
    condition: "donor_id in path or body does not resolve"
  - id: ERR_CHARITY_NOT_FOUND
    http: 404
    condition: "charity_id in path or body does not resolve"
  - id: ERR_DONATION_NOT_FOUND
    http: 404
    condition: "donation_id in path or body does not resolve"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "vehicle id in path does not resolve"
  - id: ERR_TITLE_RECORD_NOT_FOUND
    http: 404
    condition: "title record id in path does not resolve"
  - id: ERR_TOW_VENDOR_NOT_FOUND
    http: 404
    condition: "tow_vendor_id in path or body does not resolve"
  - id: ERR_PICKUP_ORDER_NOT_FOUND
    http: 404
    condition: "pickup order id in path does not resolve"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "venue_id in path or body does not resolve"
  - id: ERR_AUCTION_LOT_NOT_FOUND
    http: 404
    condition: "auction lot id in path does not resolve"
  - id: ERR_TAX_RECEIPT_NOT_FOUND
    http: 404
    condition: "tax receipt id in path does not resolve"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "remittance batch id in path does not resolve"
  - id: ERR_TASK_NOT_FOUND
    http: 404
    condition: "follow-up task id in path does not resolve"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the FinanceOfficer paying a batch is the same X-User-ID recorded in closed_by_user_id"
  - id: ERR_STALE_DONATION_VERSION
    http: 412
    condition: "expected_donation_version does not equal the Donation's current version"
  - id: ERR_STALE_BATCH_VERSION
    http: 412
    condition: "expected_batch_version does not equal the RemittanceBatch's current version"
  - id: ERR_INVALID_DONATION_STATE
    http: 409
    condition: "the donation's status does not permit the requested transition"
  - id: ERR_INVALID_PAYOUT_STATE
    http: 409
    condition: "the donation's payout_status does not permit the requested money movement"
  - id: ERR_INVALID_TITLE_STATE
    http: 409
    condition: "the title record's state does not permit the requested transition"
  - id: ERR_INVALID_PICKUP_STATE
    http: 409
    condition: "the pickup order is not SCHEDULED"
  - id: ERR_INVALID_LOT_STATE
    http: 409
    condition: "the auction lot's status does not permit the requested transition"
  - id: ERR_INVALID_RECEIPT_STATE
    http: 409
    condition: "the tax receipt's status does not permit the requested transition"
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "the remittance batch's status does not permit the requested transition"
  - id: ERR_INVALID_TASK_STATE
    http: 409
    condition: "the follow-up task is already DONE"
  - id: ERR_DONOR_BLOCKED
    http: 409
    condition: "the donor referenced by the donation has status BLOCKED"
  - id: ERR_CHARITY_SUSPENDED
    http: 409
    condition: "the charity affiliate referenced by the donation or batch has status SUSPENDED"
  - id: ERR_VENDOR_SUSPENDED
    http: 409
    condition: "the tow vendor has status SUSPENDED"
  - id: ERR_VENUE_SUSPENDED
    http: 409
    condition: "the sales venue has status SUSPENDED"
  - id: ERR_TITLE_NOT_CLEARED
    http: 409
    condition: "the donation has no TitleRecord, or its state is not CLEARED, at sale or receipt time"
  - id: ERR_TITLE_RESUBMIT_LIMIT
    http: 409
    condition: "a resubmission is attempted when rejection_count already exceeds TITLE_RESUBMIT_LIMIT (2)"
  - id: ERR_RECEIPT_ALREADY_ACTIVE
    http: 409
    condition: "the donation already has a TaxReceipt in DRAFT or ISSUED"
  - id: ERR_VEHICLE_RECORD_MISSING
    http: 409
    condition: "a tax receipt is drafted for a donation that has no Vehicle row"
  - id: ERR_DUPLICATE_VEHICLE
    http: 409
    condition: "a second Vehicle is created for a donation that already has one"
  - id: ERR_DUPLICATE_VIN
    http: 409
    condition: "the VIN is already registered on another Vehicle"
  - id: ERR_DUPLICATE_TITLE_RECORD
    http: 409
    condition: "a second TitleRecord is created for a donation that already has one"
  - id: ERR_DONATION_SETTLED
    http: 409
    condition: "the donation is frozen into a RemittanceBatch whose status is CLOSED or PAID, so its accrual cannot be reversed"
  - id: ERR_PICKUP_WINDOW_INVALID
    http: 422
    condition: "scheduled_end_utc is not strictly after scheduled_start_utc"
  - id: ERR_BATCH_PERIOD_INVALID
    http: 422
    condition: "period_end_utc is not strictly after period_start_utc"
  - id: ERR_PICKUP_IN_PAST
    http: 422
    condition: "scheduled_start_utc is strictly before the current logical clock"
  - id: ERR_VENDOR_WINDOW_CONFLICT
    http: 409
    condition: "the requested tow window collides with another SCHEDULED PickupOrder on the same vendor once each side is expanded by PICKUP_BUFFER_MINUTES (90)"
  - id: ERR_VENDOR_CAPACITY_EXCEEDED
    http: 409
    condition: "the vendor's SCHEDULED order count is already at daily_capacity_slots"
  - id: ERR_PICKUP_ATTEMPTS_EXCEEDED
    http: 409
    condition: "a new pickup order is requested for a donation whose pickup_attempts already reached MAX_PICKUP_ATTEMPTS (3)"
  - id: ERR_VENUE_CAPACITY_EXCEEDED
    http: 409
    condition: "the venue already hosts VENUE_DAILY_LOT_CAPACITY (5) non-WITHDRAWN lots listed on the current UTC calendar day"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "the donor email is already registered"
  - id: ERR_DUPLICATE_EIN
    http: 409
    condition: "the charity EIN is already registered"
  - id: ERR_RESERVE_NOT_MET
    http: 422
    condition: "sale_price_cents is below the lot's reserve_price_cents"
  - id: ERR_BATCH_EMPTY
    http: 422
    condition: "a batch is closed while its eligible member-donation set is empty"
  - id: ERR_FEE_PCT_OUT_OF_RANGE
    http: 422
    condition: "remittance_fee_pct is outside [0, MAX_REMITTANCE_FEE_PCT (0.30)]"

roles:
  - name: Donor
    description: "the donating party; may read and cancel their own donations and read their own receipts"
    identity: "entity_backed:Donor"
    exclusive_operations:
      - "POST /api/donations/{id}/cancel as the donation's own donor"
    shared_operations:
      - "GET /api/donations/{id}"
      - "GET /api/donations"
      - "GET /api/donors/{id}"
      - "GET /api/tax-receipts/{id}"
      - "GET /api/tax-receipts"
  - name: CharityAdmin
    description: "beneficiary charity operator; reads its own donations, batches and summary, and may dispute a closed batch"
    identity: "entity_backed:CharityAffiliate"
    exclusive_operations:
      - "POST /api/remittance-batches/{id}/dispute"
    shared_operations:
      - "GET /api/donations/{id}"
      - "GET /api/donations"
      - "GET /api/donations/{id}/ledger-entries"
      - "GET /api/remittance-batches/{id}"
      - "GET /api/remittance-batches"
      - "GET /api/remittance-batches/{id}/ledger-entries"
      - "GET /api/charities/{id}"
      - "GET /api/reports/charity-summary"
  - name: IntakeAgent
    description: "front-office operator running donation intake, drop-off receipt and tow scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /api/donations/{id}/accept"
      - "POST /api/donations/{id}/decline"
      - "POST /api/donations/{id}/receive-dropoff"
      - "POST /api/pickup-orders"
      - "POST /api/pickup-orders/{id}/complete"
      - "POST /api/pickup-orders/{id}/fail"
      - "POST /api/pickup-orders/{id}/cancel"
    shared_operations:
      - "POST /api/donors"
      - "POST /api/donations"
      - "POST /api/vehicles"
      - "PATCH /api/vehicles/{id}"
      - "GET /api/donations/{id}"
      - "GET /api/pickup-orders"
      - "GET /api/tow-vendors/{id}"
      - "GET /api/follow-up-tasks/{id}"
  - name: TitleClerk
    description: "title and DMV desk; owns the entire TitleRecord lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /api/title-records"
      - "POST /api/title-records/{id}/submit-dmv"
      - "POST /api/title-records/{id}/dmv-decision"
      - "POST /api/title-records/{id}/resubmit"
      - "POST /api/title-records/{id}/abandon"
    shared_operations:
      - "GET /api/title-records/{id}"
      - "GET /api/title-records"
      - "GET /api/donations/{id}"
      - "GET /api/vehicles/{id}"
      - "GET /api/follow-up-tasks/{id}"
  - name: AuctionManager
    description: "sale-floor operator; lists lots, records sales and no-sales, relists, voids and withdraws"
    identity: opaque
    exclusive_operations:
      - "POST /api/auction-lots"
      - "POST /api/auction-lots/{id}/record-sale"
      - "POST /api/auction-lots/{id}/record-no-sale"
      - "POST /api/auction-lots/{id}/relist"
      - "POST /api/auction-lots/{id}/void-sale"
      - "POST /api/auction-lots/{id}/withdraw"
    shared_operations:
      - "POST /api/vehicles"
      - "PATCH /api/vehicles/{id}"
      - "GET /api/auction-lots/{id}"
      - "GET /api/auction-lots"
      - "GET /api/donations/{id}"
      - "GET /api/venues/{id}"
      - "GET /api/donations/{id}/ledger-entries"
  - name: FinanceOfficer
    description: "receipts and remittance desk; drafts and issues receipts, opens, closes and pays batches. Segregation of duties applies: the officer who closed a batch cannot pay it."
    identity: opaque
    exclusive_operations:
      - "POST /api/tax-receipts"
      - "POST /api/tax-receipts/{id}/issue"
      - "POST /api/tax-receipts/{id}/reissue"
      - "POST /api/remittance-batches"
      - "POST /api/remittance-batches/{id}/close"
      - "POST /api/remittance-batches/{id}/pay"
      - "POST /api/remittance-batches/{id}/reopen"
    shared_operations:
      - "GET /api/tax-receipts/{id}"
      - "GET /api/tax-receipts"
      - "GET /api/remittance-batches/{id}"
      - "GET /api/remittance-batches"
      - "GET /api/remittance-batches/{id}/ledger-entries"
      - "GET /api/donations/{id}"
      - "GET /api/donations/{id}/ledger-entries"
      - "GET /api/reports/charity-summary"
  - name: ProgramAdmin
    description: "program operator; owns reference data, donor blocks, payout withholding, IRS exceptions, receipt voids, follow-up completion, the ops sweep and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/charities"
      - "POST /api/charities/{id}/suspend"
      - "POST /api/donors/{id}/block"
      - "POST /api/tow-vendors"
      - "POST /api/tow-vendors/{id}/suspend"
      - "POST /api/venues"
      - "POST /api/venues/{id}/suspend"
      - "POST /api/donations/{id}/reset-pickup"
      - "POST /api/donations/{id}/withhold-payout"
      - "POST /api/donations/{id}/exception"
      - "POST /api/tax-receipts/{id}/void"
      - "POST /api/follow-up-tasks/{id}/complete"
      - "POST /api/_ops/run-sweep"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "POST /api/donors"
      - "POST /api/donations"
      - "POST /api/donations/{id}/cancel"
      - "GET /api/donations/{id}"
      - "GET /api/reports/charity-summary"
