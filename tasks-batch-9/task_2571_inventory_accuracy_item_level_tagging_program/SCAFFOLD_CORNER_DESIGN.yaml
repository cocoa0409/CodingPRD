            - "response status 409 and data.error_id == \"ERR_TAG_BATCH_INVALID_STATE\""
            - "GET /inventory-integrity/tag-batches/${batch1} still reads status \"VERIFIED_PASS\" and rework_round 0"
            - "a scrap attempt on the same batch also returns ERR_TAG_BATCH_INVALID_STATE (409) — no transition leaves a terminal state"

      - name: tag_batch_second_receive_rejected_as_repeat_trigger
        claim_type: idempotency
        grounds:
          - state_machines.TagBatch.ENCODED_to_RECEIVED
