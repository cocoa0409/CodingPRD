            - "data.verification_rounds is 0 and GET /verification-requests with prescription_id=${rx_id} as ComplianceOfficer co-alpha returns total_count 0."
            - "GET /prescriptions/${rx_id}/compliance-events as ComplianceOfficer co-alpha returns exactly 1 event with event_type RX_SUBMITTED and detail \"upload accepted\"."

