# =============================================================================
# Scaffold: Custom Tailor & Bespoke Clothing API (Expert)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "Custom Tailor & Bespoke Clothing: measurement profile & body scan, fabric/option selection & price, fitting milestones (basted/forward/final), alteration ticket, deposit & balance, rush & remake policy, wedding/group order, garment pickup"

domain_name: custom-tailor-bespoke

# Flat top-level resource surface; each entity has its own /<collection> root.
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation        # provisional quote vs locked final invoice
    - cascading_side_effects          # remake reopen, group close cascade, pickup gating
    - optimistic_concurrency          # OCC on GarmentOrder.version for fitting scheduling
    - rate_threshold_triggers         # rush surcharge & group-discount tier breakpoints

  entity_topology: hybrid
  # GarmentOrder is the central aggregate; MeasurementProfile / Fabric / Tailor /
  # FittingRoom / GroupOrder are flat peers referenced by FK; Fitting /
  # GarmentOptionLine / AlterationTicket / Payment / Pickup nest under the order.

  state_machine_shape: cyclic
  # GarmentOrder threads a remake cycle (IN_FITTING -> REMAKE -> IN_FITTING) and a
  # Fitting cycle (FAILED fitting reopens the order for a fresh fitting round).

  relationship_patterns:
    - one_to_many        # GarmentOrder -> Fitting / GarmentOptionLine / Payment
    - cross_aggregate    # GarmentOrder -> MeasurementProfile / Fabric / Tailor / FittingRoom
    - self_referential   # GroupOrder.lead_order_id references a GarmentOrder in the group

  role_model: peer_roles
  # Customer owns own orders/measurements; FittingSpecialist owns fittings/tailoring;
  # SalesAssociate owns quoting/payments/pickup; ShopManager owns lifecycle/overrides.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Global constants referenced across §1.2–§1.4
# =============================================================================
global_constants:
  MAX_REMAKES: 2                 # remake_round may reach at most 2; a FINAL fail at round 2 is rejected
  GROUP_MIN_MEMBERS: 3           # a GroupOrder needs >= 3 non-CANCELLED members to lock
  OVERPAY_TOLERANCE_CENTS: 0     # a BALANCE payment may not exceed balance_due_cents by any amount
  DEPOSIT_RATE: 0.50
  RUSH_RATE: 0.30
  RUSH_DEPOSIT_FLOOR_CENTS: 20000

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across Customers" }
      - { name: store_credit_cents, type: integer, source: computed, default: 0, description: "Non-negative store credit ledger balance in cents; credited by remake compensation and overpaid-balance refunds-to-credit, debited when applied to a balance payment. Never below 0." }
      - { name: remake_count, type: integer, source: computed, default: 0, description: "Lifetime count of REMAKE transitions across this customer's GarmentOrders" }
      - { name: completed_order_count, type: integer, source: computed, default: 0, description: "Lifetime count of this customer's GarmentOrders that reached PICKED_UP" }
      - { name: remake_risk_band, type: enum, source: computed, default: "STANDARD", description: "STANDARD | WATCH | HIGH_RISK; derived from remake_rate, see calculations.customer_remake_risk" }

  - name: MeasurementProfile
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: chest_cm, type: number, source: input, description: "Chest circumference in cm, > 0" }
      - { name: waist_cm, type: number, source: input, description: "Waist circumference in cm, > 0" }
      - { name: hip_cm, type: number, source: input, description: "Hip circumference in cm, > 0" }
      - { name: inseam_cm, type: number, source: input, description: "Inseam length in cm, > 0" }
      - { name: source, type: enum, source: input, default: "MANUAL", description: "MANUAL | BODY_SCAN; how measurements were captured" }
      - { name: body_scan_ref, type: string, source: input, default: null, description: "Opaque scan asset reference; REQUIRED when source=BODY_SCAN, forbidden when source=MANUAL" }
      - { name: status, type: enum, source: system, description: "DRAFT | LOCKED | SUPERSEDED; LOCKED when attached to a confirmed order, SUPERSEDED when replaced" }

  - name: Fabric
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }
      - { name: name, type: string, source: input, description: "Fabric display name" }
      - { name: price_per_meter_cents, type: integer, source: input, description: "Catalog price per meter in cents, > 0" }
      - { name: bolt_meters_remaining, type: number, source: computed, default: 0, description: "Meters left on the bolt; debited on order confirmation reservation, credited back on cancellation/remake-release. Never below 0." }
      - { name: status, type: enum, source: input, default: "AVAILABLE", description: "AVAILABLE | DISCONTINUED; DISCONTINUED fabrics cannot be selected on new option lines" }

  - name: Tailor
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }
      - { name: display_name, type: string, source: input, description: "Tailor name shown on schedule" }
      - { name: skill_tier, type: enum, source: input, default: "JOURNEYMAN", description: "APPRENTICE | JOURNEYMAN | MASTER; FINAL-milestone fittings require MASTER" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "ACTIVE | INACTIVE; INACTIVE tailors cannot be assigned to new fittings" }

  - name: FittingRoom
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }
      - { name: room_name, type: string, source: input, description: "Fitting room label" }
      - { name: cleanup_buffer_minutes, type: integer, source: input, default: 15, description: "Buffer enforced AFTER each booking before the room can be reused; >= 0" }
      - { name: status, type: enum, source: input, default: "OPEN", description: "OPEN | CLOSED; CLOSED rooms cannot host new fittings" }

  - name: GarmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation incl. cascaded side effects" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: measurement_profile_id, type: string, source: input, description: "FK -> MeasurementProfile.id; profile must belong to the same customer" }
      - { name: group_order_id, type: string, source: input, default: null, description: "FK -> GroupOrder.id; null for standalone orders" }
      - { name: garment_type, type: enum, source: input, description: "SUIT | JACKET | TROUSERS | SHIRT | DRESS" }
      - { name: base_labor_cents, type: integer, source: input, description: "Base tailoring labor charge in cents, > 0" }
      - { name: is_rush, type: boolean, source: input, default: false, description: "Whether rush handling was requested at draft time" }
      - { name: promised_date, type: datetime, source: input, description: "ISO 8601 UTC promised completion date" }
      - { name: fabric_meters_required, type: number, source: input, description: "Meters of fabric this garment consumes, > 0; used for bolt reservation and yardage cost" }
      - { name: quoted_total_cents, type: integer, source: computed, default: 0, description: "Provisional total recomputed on every option-line change while DRAFT; see calculations.order_quote_total" }
      - { name: locked_total_cents, type: integer, source: computed, default: 0, description: "Final invoice total frozen at confirmation; see calculations.order_final_invoice" }
      - { name: deposit_due_cents, type: integer, source: computed, default: 0, description: "Deposit required at confirmation = ceil(locked_total_cents * DEPOSIT_RATE); see calculations.deposit_due" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of Payment.amount_cents for this order with status=CAPTURED" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "locked_total_cents - amount_paid_cents - store_credit_applied_cents; see calculations.balance_due" }
      - { name: store_credit_applied_cents, type: integer, source: computed, default: 0, description: "Cumulative customer store credit applied to this order's balance" }
      - { name: remake_round, type: integer, source: computed, default: 0, description: "Number of REMAKE transitions this order has undergone" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | IN_FITTING | REMAKE | READY | PICKED_UP | CANCELLED" }

  - name: GarmentOptionLine
    parent: GarmentOrder
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }
      - { name: order_id, type: string, source: system, description: "FK -> GarmentOrder.id" }
      - { name: fabric_id, type: string, source: input, description: "FK -> Fabric.id; must be AVAILABLE at line creation" }
      - { name: option_code, type: enum, source: input, description: "MONOGRAM | CONTRAST_LINING | WORKING_CUFFS | PICK_STITCH | EXTRA_TROUSER; each upcharge per UPCHARGE_TABLE" }
      - { name: upcharge_cents, type: integer, source: computed, description: "Upcharge for option_code from UPCHARGE_TABLE, frozen at line creation" }
      - { name: fabric_price_per_meter_cents, type: integer, source: computed, description: "Snapshot of Fabric.price_per_meter_cents at line creation; immune to later catalog edits" }

  - name: Fitting
    parent: GarmentOrder
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }
      - { name: order_id, type: string, source: system, description: "FK -> GarmentOrder.id" }
      - { name: tailor_id, type: string, source: input, description: "FK -> Tailor.id; must be ACTIVE; MASTER required when milestone=FINAL" }
      - { name: room_id, type: string, source: input, description: "FK -> FittingRoom.id; must be OPEN" }
      - { name: milestone, type: enum, source: input, description: "BASTED | FORWARD | FINAL; must follow the order's milestone ladder" }
      - { name: start_at, type: datetime, source: input, description: "ISO 8601 UTC fitting start" }
      - { name: end_at, type: datetime, source: input, description: "ISO 8601 UTC fitting end; must be > start_at" }
      - { name: outcome, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | PASSED | FAILED; FAILED at FINAL triggers order REMAKE" }

  - name: AlterationTicket
    parent: GarmentOrder
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }
      - { name: order_id, type: string, source: system, description: "FK -> GarmentOrder.id; order must be READY or PICKED_UP" }
      - { name: description, type: string, source: input, description: "Free-text alteration request" }
      - { name: billable_cents, type: integer, source: input, default: 0, description: "Charge for this alteration in cents, >= 0; 0 means courtesy alteration" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPLETED | VOIDED" }

  - name: Payment
    parent: GarmentOrder
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; chronological ledger order key" }
      - { name: order_id, type: string, source: system, description: "FK -> GarmentOrder.id" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | BALANCE; DEPOSIT only while CONFIRMED, BALANCE only while READY" }
      - { name: amount_cents, type: integer, source: input, description: "Captured amount in cents, > 0" }
      - { name: status, type: enum, source: system, description: "CAPTURED | REFUNDED; append-only, REFUNDED set by cancellation refund" }

  - name: GroupOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation incl. cascaded side effects" }
      - { name: event_name, type: string, source: input, description: "Wedding/event label" }
      - { name: event_date, type: datetime, source: input, description: "ISO 8601 UTC event date" }
      - { name: lead_order_id, type: string, source: input, default: null, description: "FK -> GarmentOrder.id; the designated lead order whose customer is the group organizer; null until first order joins" }
      - { name: member_order_count, type: integer, source: computed, default: 0, description: "Count of GarmentOrders whose group_order_id == this group (non-CANCELLED)" }
      - { name: group_total_cents, type: integer, source: computed, default: 0, description: "Sum of member orders' locked_total_cents for CONFIRMED+ members; see calculations.group_order_total" }
      - { name: status, type: enum, source: system, description: "FORMING | LOCKED | FULFILLED | CANCELLED" }

  - name: Pickup
    parent: GarmentOrder
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }
      - { name: order_id, type: string, source: system, description: "FK -> GarmentOrder.id; order must be READY with balance_due_cents == 0" }
      - { name: released_to_name, type: string, source: input, description: "Name of the person collecting the garment" }
      - { name: picked_up_at, type: datetime, source: system, description: "ISO 8601 UTC stamp set when the pickup is recorded" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GarmentOrder
    field: status
    initial_state: DRAFT
    terminal_states: [PICKED_UP, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        actor: SalesAssociate
        preconditions:
          - "At least one GarmentOptionLine exists on the order (ERR_NO_OPTION_LINES)"
          - "Linked MeasurementProfile.status != SUPERSEDED (ERR_PROFILE_SUPERSEDED)"
          - "Fabric.bolt_meters_remaining >= order.fabric_meters_required for the order's selected fabric (ERR_FABRIC_INSUFFICIENT)"
          - "If order.group_order_id set, that GroupOrder.status == FORMING (ERR_GROUP_NOT_FORMING)"
        side_effects:
          - "locked_total_cents := order_final_invoice(order)  (freezes fabric snapshot prices + rush surcharge)"
          - "deposit_due_cents := deposit_due(order)"
          - "balance_due_cents := order_final_invoice total minus 0 paid (= locked_total_cents)"
          - "Fabric.bolt_meters_remaining -= order.fabric_meters_required (reservation)"
          - "Linked MeasurementProfile.status DRAFT -> LOCKED"
          - "If group_order_id set: GroupOrder.member_order_count recomputed and GroupOrder.group_total_cents recomputed (group_order_total)"

      - from: CONFIRMED
        to: IN_FITTING
        trigger: "POST /orders/{id}/fittings  (first fitting scheduled)"
        actor: FittingSpecialist
        preconditions:
          - "A DEPOSIT Payment with status=CAPTURED exists summing to >= deposit_due_cents (ERR_DEPOSIT_NOT_PAID)"
          - "Fitting milestone == BASTED for the first fitting of round 0 (ERR_MILESTONE_OUT_OF_ORDER)"
        side_effects:
          - "Order enters fitting workflow; subsequent fittings appended"

      - from: IN_FITTING
        to: REMAKE
        trigger: "system (a FINAL-milestone Fitting recorded FAILED via POST /orders/{id}/fittings/{fittingId}/record-outcome)"
        actor: system
        preconditions:
          - "The failing fitting.milestone == FINAL (ERR_REMAKE_REQUIRES_FINAL)"
          - "remake_round < MAX_REMAKES (ERR_REMAKE_LIMIT_REACHED)"
        side_effects:
          - "remake_round += 1"
          - "Customer.remake_count += 1 and Customer.remake_risk_band recomputed (customer_remake_risk)"
          - "Customer.store_credit_cents += remake_compensation(order)  (goodwill credit; conserves: credit added equals compensation owed)"
          - "Fabric.bolt_meters_remaining -= order.fabric_meters_required (fresh cut reserved for the remake)"
          - "All SCHEDULED Fittings on this order -> FAILED (round closed)"

      - from: REMAKE
        to: IN_FITTING
        trigger: "POST /orders/{id}/fittings  (new BASTED fitting scheduled for the new round)"
        actor: FittingSpecialist
        preconditions:
          - "Fitting milestone == BASTED for the first fitting of the new round (ERR_MILESTONE_OUT_OF_ORDER)"
        side_effects:
          - "Order resumes fitting workflow at the new remake_round"

      - from: IN_FITTING
        to: READY
        trigger: "system (a FINAL-milestone Fitting recorded PASSED via POST /orders/{id}/fittings/{fittingId}/record-outcome)"
        actor: system
        preconditions:
          - "The passing fitting.milestone == FINAL (ERR_FINAL_NOT_REACHED)"
        side_effects:
          - "Order ready for balance settlement and pickup"

      - from: [DRAFT, CONFIRMED, IN_FITTING, REMAKE]
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: ShopManager
        preconditions:
          - "Order has no Pickup record (ERR_ALREADY_PICKED_UP)"
        side_effects:
          - "If status was CONFIRMED/IN_FITTING/REMAKE: Fabric.bolt_meters_remaining += order.fabric_meters_required for each active reservation cut (release; conserves bolt meters)"
          - "All SCHEDULED Fittings -> FAILED"
          - "All CAPTURED Payments -> REFUNDED; Customer.store_credit_cents += sum(refunded amount_cents) (refund-to-credit; conserves cash-equivalent)"
          - "Linked MeasurementProfile.status LOCKED -> SUPERSEDED"
          - "If group_order_id set: GroupOrder.member_order_count and group_total_cents recomputed"

      - from: READY
        to: PICKED_UP
        trigger: "POST /orders/{id}/pickup"
        actor: SalesAssociate
        preconditions:
          - "balance_due_cents == 0 (ERR_BALANCE_OUTSTANDING)"
          - "No OPEN AlterationTicket on the order (ERR_OPEN_ALTERATION_BLOCKS_PICKUP)"
        side_effects:
          - "Pickup record created, picked_up_at stamped"
          - "Customer.completed_order_count += 1"
          - "If group_order_id set and all non-CANCELLED member orders are PICKED_UP: GroupOrder.status LOCKED -> FULFILLED"

  - entity: Fitting
    field: outcome
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /orders/{id}/fittings/{fittingId}/record-outcome  {result: PASS}"
        actor: FittingSpecialist
        preconditions:
          - "Parent GarmentOrder.status == IN_FITTING (ERR_ORDER_NOT_IN_FITTING)"
          - "All earlier-milestone fittings of the current remake_round are PASSED (ERR_MILESTONE_OUT_OF_ORDER)"
        side_effects:
          - "If milestone == FINAL: parent order IN_FITTING -> READY (bubble-up)"

      - from: SCHEDULED
        to: FAILED
        trigger: "POST /orders/{id}/fittings/{fittingId}/record-outcome  {result: FAIL}"
        actor: FittingSpecialist
        preconditions:
          - "Parent GarmentOrder.status == IN_FITTING (ERR_ORDER_NOT_IN_FITTING)"
        side_effects:
          - "If milestone == FINAL and order.remake_round < MAX_REMAKES: parent order IN_FITTING -> REMAKE (cascade per GarmentOrder machine)"
          - "If milestone == FINAL and order.remake_round == MAX_REMAKES: reject with ERR_REMAKE_LIMIT_REACHED (no transition)"

      - from: [SCHEDULED]
        to: FAILED
        trigger: "system (parent order CANCELLED or remake-round close)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GroupOrder
    field: status
    initial_state: FORMING
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: FORMING
        to: LOCKED
        trigger: "POST /group-orders/{id}/lock"
        actor: ShopManager
        preconditions:
          - "member_order_count >= GROUP_MIN_MEMBERS (ERR_GROUP_TOO_SMALL)"
          - "Every non-CANCELLED member order is in {CONFIRMED, IN_FITTING, REMAKE, READY, PICKED_UP} (ERR_GROUP_HAS_DRAFT_MEMBERS)"
          - "expected_group_order_version matches current GroupOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "group_total_cents recomputed (group_order_total) with the locked-in member set"
          - "GroupOrder.version += 1"

      - from: LOCKED
        to: FULFILLED
        trigger: "system (last non-CANCELLED member order reaches PICKED_UP)"
        actor: system
        preconditions:
          - "All non-CANCELLED member orders are PICKED_UP (ERR_GROUP_MEMBERS_PENDING)"
        side_effects: []

      - from: [FORMING, LOCKED]
        to: CANCELLED
        trigger: "POST /group-orders/{id}/cancel"
        actor: ShopManager
        preconditions:
          - "expected_group_order_version matches current GroupOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "Each non-terminal member order (DRAFT/CONFIRMED/IN_FITTING/REMAKE/READY) -> CANCELLED via the GarmentOrder cancel cascade"
          - "GroupOrder.version += 1"

  - entity: AlterationTicket
    field: status
    initial_state: OPEN
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /orders/{id}/alterations/{ticketId}/complete"
        actor: FittingSpecialist
        preconditions:
          - "If billable_cents > 0: an associated BALANCE Payment summing to >= billable_cents was captured after the ticket opened (ERR_ALTERATION_UNPAID)"
        side_effects:
          - "Ticket closed; no longer blocks pickup"

      - from: OPEN
        to: VOIDED
        trigger: "POST /orders/{id}/alterations/{ticketId}/void"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "Ticket voided; no longer blocks pickup"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: fitting-schedule-stale-order
    parent_entity: GarmentOrder
    write_endpoint: "POST /orders/{id}/fittings"
    occ_field: "expected_order_version"
    description: |
      Scheduling a Fitting against a GarmentOrder whose version has advanced
      since the client last observed it is rejected. This captures the case
      where the order's fitting workflow already advanced (e.g. a prior fitting
      was scheduled, an outcome cascaded a REMAKE, or the order was cancelled)
      and the current scheduler's view of the order is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: group-lock-stale-group
    parent_entity: GroupOrder
    write_endpoint: "POST /group-orders/{id}/lock"
    occ_field: "expected_group_order_version"
    description: |
      Locking a GroupOrder whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      mutated the group's membership (a member order joined, confirmed, or
      cancelled, each of which recomputes member_order_count and bumps the
      group's version) and the current writer's view of the group is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: option_upcharge
    trigger: "GarmentOptionLine creation (snapshots upcharge_cents from option_code)"
    algorithm: aggregation
    formula: |
      upcharge_cents = UPCHARGE_TABLE[line.option_code]
      # Frozen on the line at creation; later table edits never retro-apply.
    input_set: "The single option_code on the line being created."
    constants:
      UPCHARGE_TABLE: { MONOGRAM: 1500, CONTRAST_LINING: 4000, WORKING_CUFFS: 6000, PICK_STITCH: 3500, EXTRA_TROUSER: 9000 }
    precision: "integer cents; exact table lookup."

  - name: order_quote_total
    trigger: "Recomputed on every GarmentOptionLine create/delete while GarmentOrder.status == DRAFT (provisional quote)"
    algorithm: tiered_pricing
    formula: |
      # PROVISIONAL variant — uses the LIVE Fabric.price_per_meter_cents at quote time.
      yardage_cents_live = yardage_cost(order.fabric_meters_required, fabric.price_per_meter_cents)
      options_cents = sum(line.upcharge_cents for line in order option lines)   # order is irrelevant; sum
      pre_rush_cents = order.base_labor_cents + yardage_cents_live + options_cents
      rush_cents = rush_surcharge(pre_rush_cents, order.is_rush)
      quoted_total_cents = pre_rush_cents + rush_cents
      # where yardage_cost applies tiered marginal rates (see yardage_cost calculation) and
      # rush_surcharge(base, is_rush) = ceil(base * RUSH_RATE) if is_rush else 0
    input_set: "All GarmentOptionLines on the order; live Fabric catalog price (NOT the per-line snapshot)."
    constants:
      RUSH_RATE: 0.30
    precision: "integer cents; ceil for rush surcharge; tier math per yardage_cost"
    variants:
      - name: provisional
        when: "order.status == DRAFT"
        difference: "Uses live Fabric.price_per_meter_cents; recomputed on every option-line edit; written to quoted_total_cents."

  - name: order_final_invoice
    trigger: "GarmentOrder DRAFT -> CONFIRMED (POST /orders/{id}/confirm)"
    algorithm: tiered_pricing
    formula: |
      # FINAL variant — uses the per-line SNAPSHOT GarmentOptionLine.fabric_price_per_meter_cents
      # captured at line creation, NOT the live catalog price. If the catalog price changed
      # between line creation and confirmation, final invoice diverges from the live re-quote.
      # The order's fabric for yardage = the fabric on the FIRST-created option line
      # (created_at ASC, tie-break created_at then ignore id); its snapshot price is used.
      snapshot_price = first_option_line(by created_at ASC).fabric_price_per_meter_cents
      yardage_cents_snapshot = yardage_cost(order.fabric_meters_required, snapshot_price)
      options_cents = sum(line.upcharge_cents for line in order option lines)
      pre_rush_cents = order.base_labor_cents + yardage_cents_snapshot + options_cents
      rush_cents = rush_surcharge(pre_rush_cents, order.is_rush)
      locked_total_cents = pre_rush_cents + rush_cents
    input_set: "All GarmentOptionLines on the order at confirmation; the FIRST line's snapshot fabric price."
    constants:
      RUSH_RATE: 0.30
    precision: "integer cents; ceil for rush surcharge; tier math per yardage_cost"
    variants:
      - name: final
        when: "order.status transitions DRAFT -> CONFIRMED"
        difference: "Uses snapshot fabric price frozen at line creation; written to locked_total_cents and never recomputed afterward."

  - name: yardage_cost
    trigger: "Sub-routine of order_quote_total and order_final_invoice"
    algorithm: tiered_pricing
    formula: |
      # MARGINAL tiered rate on meters required, with EXPLICIT rounding order:
      # round EACH TIER's contribution to whole cents independently, THEN sum.
      # (round-per-tier-then-sum, NOT sum-then-round.)
      # Tier 1: first 0 < m <= 3.0 meters at price_per_meter * TIER1_MULT
      # Tier 2: meters in (3.0, 6.0] at price_per_meter * TIER2_MULT
      # Tier 3: meters above 6.0 at price_per_meter * TIER3_MULT
      m1 = min(meters, 3.0)
      m2 = max(0, min(meters, 6.0) - 3.0)
      m3 = max(0, meters - 6.0)
      c1 = round_half_up(m1 * price_per_meter * TIER1_MULT)   # whole cents
      c2 = round_half_up(m2 * price_per_meter * TIER2_MULT)   # whole cents
      c3 = round_half_up(m3 * price_per_meter * TIER3_MULT)   # whole cents
      yardage_cents = c1 + c2 + c3
    input_set: "meters (= order.fabric_meters_required) and a price_per_meter (live or snapshot)."
    constants:
      TIER1_MULT: 1.00
      TIER2_MULT: 0.90
      TIER3_MULT: 0.80
    precision: "round_half_up to whole cents PER TIER, then sum (order pinned: round-then-sum)."

  - name: deposit_due
    trigger: "GarmentOrder DRAFT -> CONFIRMED"
    algorithm: threshold
    formula: |
      deposit_due_cents = ceil(locked_total_cents * DEPOSIT_RATE)
      # If order.is_rush, deposit floor is raised: deposit_due_cents = max(deposit_due_cents, RUSH_DEPOSIT_FLOOR_CENTS)
      if order.is_rush:
        deposit_due_cents = max(deposit_due_cents, RUSH_DEPOSIT_FLOOR_CENTS)
    input_set: "locked_total_cents (already frozen in the same confirm transition), is_rush flag."
    constants:
      DEPOSIT_RATE: 0.50
      RUSH_DEPOSIT_FLOOR_CENTS: 20000
    precision: "ceil to whole cents."

  - name: balance_due
    trigger: "Recomputed on Payment capture, store-credit application, and order confirmation"
    algorithm: aggregation
    formula: |
      amount_paid_cents = sum(p.amount_cents for p in order Payments where p.status == CAPTURED)
      balance_due_cents = max(0, locked_total_cents - amount_paid_cents - store_credit_applied_cents)
      # store_credit_applied_cents is only nonzero after an explicit apply-credit action.
      # Payments are gated so amount_paid_cents + store_credit_applied_cents can never exceed
      # locked_total_cents: DEPOSIT is bounded by deposit_due gating, and BALANCE may not exceed
      # the current balance_due_cents by more than OVERPAY_TOLERANCE_CENTS (=0). Thus balance
      # never goes negative and no surplus arises.
    input_set: "CAPTURED Payments on the order; store_credit_applied_cents; locked_total_cents."
    precision: "integer cents; floor at 0."

  - name: group_order_total
    trigger: "Recomputed on member-order confirm/cancel and on GroupOrder lock"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial: sum member subtotals, then apply a member-count discount tier
      # to the GROUP aggregate. Evaluation order is pinned: SUM first, then discount the sum.
      members = GarmentOrders where group_order_id == group.id AND status in
                {CONFIRMED, IN_FITTING, REMAKE, READY, PICKED_UP}
      raw_sum_cents = sum(m.locked_total_cents for m in members)
      n = count(members)
      if n >= GROUP_TIER2_MIN:   disc = GROUP_TIER2_DISC
      elif n >= GROUP_TIER1_MIN: disc = GROUP_TIER1_DISC
      else:                      disc = 0.0
      group_total_cents = raw_sum_cents - ceil(raw_sum_cents * disc)
    input_set: "Member GarmentOrders in {CONFIRMED, IN_FITTING, REMAKE, READY, PICKED_UP}; their locked_total_cents."
    constants:
      GROUP_TIER1_MIN: 4
      GROUP_TIER1_DISC: 0.05
      GROUP_TIER2_MIN: 8
      GROUP_TIER2_DISC: 0.10
    precision: "ceil the discount, subtract from raw_sum (sum-then-discount order pinned)."

  - name: remake_compensation
    trigger: "GarmentOrder IN_FITTING -> REMAKE"
    algorithm: threshold
    formula: |
      # Goodwill store credit granted to the customer on each remake, scaled by remake round.
      # Capped so total credit never exceeds the order's locked total.
      raw = REMAKE_BASE_CENTS + (order.remake_round - 1) * REMAKE_STEP_CENTS
      remake_compensation_cents = min(raw, order.locked_total_cents)
      # remake_round has ALREADY been incremented when this runs (round 1 -> raw = base).
    input_set: "order.remake_round (post-increment), order.locked_total_cents."
    constants:
      REMAKE_BASE_CENTS: 5000
      REMAKE_STEP_CENTS: 3000
    precision: "integer cents; min cap at locked_total_cents."

  - name: customer_remake_risk
    trigger: "GarmentOrder IN_FITTING -> REMAKE (Customer.remake_count changed)"
    algorithm: weighted_scoring
    formula: |
      # Risk on the CUSTOMER domain (distinct from order cost). Band on remake RATE.
      denom = max(1, customer.completed_order_count + customer.remake_count)
      remake_rate = customer.remake_count / denom
      if remake_rate >= HIGH_THRESHOLD:   remake_risk_band = HIGH_RISK
      elif remake_rate >= WATCH_THRESHOLD: remake_risk_band = WATCH
      else:                                remake_risk_band = STANDARD
    input_set: "customer.remake_count and customer.completed_order_count across all the customer's orders."
    constants:
      WATCH_THRESHOLD: 0.34
      HIGH_THRESHOLD: 0.50
    precision: "rate compared with >= boundary; band is an enum output."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (orderId, then nested fittingId/ticketId; groupId for group endpoints)"
    error_id: "ERR_ORDER_NOT_FOUND / ERR_FITTING_NOT_FOUND / ERR_ALTERATION_NOT_FOUND / ERR_GROUP_NOT_FOUND"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 4
    category: business_referential
    check: "Body FK references exist (customer_id, measurement_profile_id, fabric_id, tailor_id, room_id, group_order_id)"
    error_id: "ERR_CUSTOMER_NOT_FOUND / ERR_PROFILE_NOT_FOUND / ERR_FABRIC_NOT_FOUND / ERR_TAILOR_NOT_FOUND / ERR_ROOM_NOT_FOUND / ERR_GROUP_NOT_FOUND"
    http_status: 404
    applies_to: "POST /orders, POST /measurement-profiles, POST /orders/{id}/option-lines, POST /orders/{id}/fittings"

  - priority: 5
    category: business_constraint
    check: "MeasurementProfile referenced by an order must belong to the same customer_id"
    error_id: ERR_PROFILE_CUSTOMER_MISMATCH
    http_status: 422
    applies_to: "POST /orders"

  - priority: 6
    category: business_constraint
    check: "When MeasurementProfile.source==BODY_SCAN, body_scan_ref required; when MANUAL, body_scan_ref must be absent"
    error_id: ERR_SCAN_REF_REQUIRED
    http_status: 422
    applies_to: "POST /measurement-profiles"

  - priority: 7
    category: state
    check: "Target resource in a state that permits the requested transition (order/fitting/group/ticket status preconditions)"
    error_id: "ERR_ORDER_INVALID_STATE / ERR_ORDER_NOT_IN_FITTING / ERR_GROUP_NOT_FORMING / ERR_ALTERATION_INVALID_STATE"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_constraint
    check: "Selected Fabric must be AVAILABLE when creating an option line"
    error_id: ERR_FABRIC_DISCONTINUED
    http_status: 422
    applies_to: "POST /orders/{id}/option-lines"

  - priority: 9
    category: business_constraint
    check: "Fitting milestone must follow the ladder BASTED -> FORWARD -> FINAL within the current remake_round; the next milestone is the lowest not-yet-PASSED rung"
    error_id: ERR_MILESTONE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /orders/{id}/fittings, POST /orders/{id}/fittings/{fittingId}/record-outcome"

  - priority: 10
    category: business_constraint
    check: "FINAL-milestone fittings require an assigned Tailor with skill_tier==MASTER, and the tailor must be ACTIVE; rooms must be OPEN"
    error_id: "ERR_MASTER_TAILOR_REQUIRED / ERR_TAILOR_INACTIVE / ERR_ROOM_CLOSED"
    http_status: 422
    applies_to: "POST /orders/{id}/fittings"

  - priority: 11
    category: business_temporal
    check: "Fitting interval [start_at, end_at) plus the room's cleanup_buffer must not overlap any other SCHEDULED fitting in the same FittingRoom (half-open + trailing buffer)"
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /orders/{id}/fittings"

  - priority: 12
    category: business_temporal
    check: "Fitting interval [start_at, end_at) must not overlap any other SCHEDULED fitting for the same Tailor (strict half-open overlap, NO buffer)"
    error_id: ERR_TAILOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /orders/{id}/fittings"

  - priority: 13
    category: business_temporal
    check: "Fitting end_at must be strictly greater than start_at"
    error_id: ERR_INVALID_FITTING_WINDOW
    http_status: 422
    applies_to: "POST /orders/{id}/fittings"

  - priority: 14
    category: business_fiscal
    check: "Payment kind/state gating: DEPOSIT only while order CONFIRMED, BALANCE only while order READY; amount_cents > 0"
    error_id: ERR_PAYMENT_NOT_ALLOWED_NOW
    http_status: 409
    applies_to: "POST /orders/{id}/payments"

  - priority: 15
    category: business_fiscal
    check: "A BALANCE payment may not exceed the current balance_due_cents by more than OVERPAY_TOLERANCE_CENTS (=0); i.e. amount_cents must be <= balance_due_cents"
    error_id: ERR_OVERPAYMENT_REJECTED
    http_status: 422
    applies_to: "POST /orders/{id}/payments"

  - priority: 16
    category: business_fiscal
    check: "Applying store credit to a balance cannot exceed the customer's available store_credit_cents nor the order's outstanding balance_due_cents"
    error_id: ERR_INSUFFICIENT_STORE_CREDIT
    http_status: 422
    applies_to: "POST /orders/{id}/apply-credit"

  - priority: 17
    category: state
    check: "OCC: expected_<parent>_version must match the parent entity's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/fittings, POST /group-orders/{id}/lock, POST /group-orders/{id}/cancel"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Create a customer"
    roles: [ShopManager, SalesAssociate]
    code: 201
    input: [full_name, email]
    output: Customer
    side_effects: ["status fields initialized; store_credit_cents=0, remake_count=0, completed_order_count=0, remake_risk_band=STANDARD"]

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
    description: "List customers"
    roles: [ShopManager, SalesAssociate]
    code: 200
    input: ["email?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  # --- MeasurementProfile ---
  - method: POST
    path: "/measurement-profiles"
    description: "Create a measurement profile (manual or body-scan)"
    roles: [ShopManager, SalesAssociate, Customer]
    code: 201
    input: [customer_id, chest_cm, waist_cm, hip_cm, inseam_cm, "source?", "body_scan_ref?"]
    output: MeasurementProfile
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/measurement-profiles/{id}"
    description: "Get a measurement profile"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: []
    output: MeasurementProfile
    side_effects: []

  - method: GET
    path: "/measurement-profiles"
    description: "List measurement profiles, filterable by customer"
    roles: [ShopManager, SalesAssociate, Customer]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: "MeasurementProfile[]"
    side_effects: []

  # --- Fabric ---
  - method: POST
    path: "/fabrics"
    description: "Create a fabric catalog entry"
    roles: [ShopManager]
    code: 201
    input: [name, price_per_meter_cents, "bolt_meters_initial", "status?"]
    output: Fabric
    side_effects: ["bolt_meters_remaining := bolt_meters_initial"]

  - method: GET
    path: "/fabrics/{id}"
    description: "Get a fabric"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: []
    output: Fabric
    side_effects: []

  - method: GET
    path: "/fabrics"
    description: "List fabrics"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Fabric[]"
    side_effects: []

  - method: PATCH
    path: "/fabrics/{id}"
    description: "Update fabric catalog price or status (does NOT alter existing option-line snapshots)"
    roles: [ShopManager]
    code: 200
    input: ["price_per_meter_cents?", "status?"]
    output: Fabric
    side_effects: ["price/status updated; existing GarmentOptionLine snapshots unaffected"]

  - method: GET
    path: "/fabrics/{id}/option-lines"
    description: "List option lines that selected this fabric (FK reverse-reachability for GarmentOptionLine.fabric_id)"
    roles: [ShopManager, SalesAssociate]
    code: 200
    input: ["limit?", "offset?"]
    output: "GarmentOptionLine[]"
    side_effects: []

  # --- Tailor ---
  - method: POST
    path: "/tailors"
    description: "Create a tailor"
    roles: [ShopManager]
    code: 201
    input: [display_name, "skill_tier?", "status?"]
    output: Tailor
    side_effects: []

  - method: GET
    path: "/tailors/{id}"
    description: "Get a tailor"
    roles: [ShopManager, SalesAssociate, FittingSpecialist]
    code: 200
    input: []
    output: Tailor
    side_effects: []

  - method: GET
    path: "/tailors"
    description: "List tailors"
    roles: [ShopManager, SalesAssociate, FittingSpecialist]
    code: 200
    input: ["status?", "skill_tier?", "limit?", "offset?"]
    output: "Tailor[]"
    side_effects: []

  - method: GET
    path: "/tailors/{id}/fittings"
    description: "List a tailor's fittings (FK reverse-reachability for Fitting.tailor_id)"
    roles: [ShopManager, SalesAssociate, FittingSpecialist]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: "Fitting[]"
    side_effects: []

  # --- FittingRoom ---
  - method: POST
    path: "/fitting-rooms"
    description: "Create a fitting room"
    roles: [ShopManager]
    code: 201
    input: [room_name, "cleanup_buffer_minutes?", "status?"]
    output: FittingRoom
    side_effects: []

  - method: GET
    path: "/fitting-rooms/{id}"
    description: "Get a fitting room"
    roles: [ShopManager, SalesAssociate, FittingSpecialist]
    code: 200
    input: []
    output: FittingRoom
    side_effects: []

  - method: GET
    path: "/fitting-rooms"
    description: "List fitting rooms"
    roles: [ShopManager, SalesAssociate, FittingSpecialist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "FittingRoom[]"
    side_effects: []

  - method: GET
    path: "/fitting-rooms/{id}/fittings"
    description: "List a room's fittings (FK reverse-reachability for Fitting.room_id)"
    roles: [ShopManager, SalesAssociate, FittingSpecialist]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: "Fitting[]"
    side_effects: []

  # --- GroupOrder ---
  - method: POST
    path: "/group-orders"
    description: "Create a wedding/group order container"
    roles: [ShopManager, SalesAssociate]
    code: 201
    input: [event_name, event_date]
    output: GroupOrder
    side_effects: ["status=FORMING, member_order_count=0, group_total_cents=0"]

  - method: GET
    path: "/group-orders/{id}"
    description: "Get a group order"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: []
    output: GroupOrder
    side_effects: []

  - method: GET
    path: "/group-orders"
    description: "List group orders, filterable by lead order"
    roles: [ShopManager, SalesAssociate]
    code: 200
    input: ["status?", "lead_order_id?", "limit?", "offset?"]
    output: "GroupOrder[]"
    side_effects: []

  - method: GET
    path: "/group-orders/{id}/orders"
    description: "List member GarmentOrders of a group (FK reverse-reachability for GarmentOrder.group_order_id)"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "GarmentOrder[]"
    side_effects: []

  - method: POST
    path: "/group-orders/{id}/lock"
    description: "Lock a forming group once minimum members confirmed"
    roles: [ShopManager]
    code: 200
    input: [expected_group_order_version]
    output: GroupOrder
    side_effects: ["status FORMING -> LOCKED", "group_total_cents recomputed", "increments GroupOrder.version by 1"]

  - method: POST
    path: "/group-orders/{id}/cancel"
    description: "Cancel a group and cascade-cancel its non-terminal member orders"
    roles: [ShopManager]
    code: 200
    input: [expected_group_order_version]
    output: GroupOrder
    side_effects: ["status -> CANCELLED", "each non-terminal member order cancelled (cascade)", "increments GroupOrder.version by 1"]

  # --- GarmentOrder ---
  - method: POST
    path: "/orders"
    description: "Create a draft garment order"
    roles: [ShopManager, SalesAssociate, Customer]
    code: 201
    input: [customer_id, measurement_profile_id, garment_type, base_labor_cents, fabric_meters_required, promised_date, "is_rush?", "group_order_id?"]
    output: GarmentOrder
    side_effects: ["status=DRAFT, quoted_total_cents=0", "if group_order_id set and group.lead_order_id is null: lead_order_id := this order; member_order_count recomputed"]

  - method: GET
    path: "/orders/{id}"
    description: "Get a garment order"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: []
    output: GarmentOrder
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List garment orders, filterable by customer, profile, or group"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: ["customer_id?", "measurement_profile_id?", "group_order_id?", "status?", "limit?", "offset?"]
    output: "GarmentOrder[]"
    side_effects: []

  - method: POST
    path: "/orders/{id}/confirm"
    description: "Confirm a draft order: freeze final invoice, reserve fabric, lock profile"
    roles: [SalesAssociate, ShopManager]
    code: 200
    input: []
    output: GarmentOrder
    side_effects: ["status DRAFT -> CONFIRMED", "locked_total_cents/deposit_due_cents/balance_due_cents computed", "Fabric.bolt_meters_remaining debited", "MeasurementProfile -> LOCKED", "group totals recomputed if grouped"]

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order and run release/refund cascade"
    roles: [ShopManager]
    code: 200
    input: []
    output: GarmentOrder
    side_effects: ["status -> CANCELLED", "fabric released", "payments refunded to store credit", "scheduled fittings failed", "profile superseded", "group totals recomputed"]

  - method: POST
    path: "/orders/{id}/pickup"
    description: "Record garment pickup on a fully-settled READY order"
    roles: [SalesAssociate, ShopManager]
    code: 201
    input: [released_to_name]
    output: Pickup
    side_effects: ["order READY -> PICKED_UP", "Customer.completed_order_count += 1", "group FULFILLED if all members picked up"]

  - method: GET
    path: "/orders/{id}/pickup"
    description: "Get the pickup record of an order (FK reverse-reachability for Pickup.order_id; 0-or-1 array)"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Pickup[]"
    side_effects: []

  # --- GarmentOptionLine ---
  - method: POST
    path: "/orders/{id}/option-lines"
    description: "Add an option line (fabric + option) to a draft order; recomputes quote"
    roles: [SalesAssociate, ShopManager, Customer]
    code: 201
    input: [fabric_id, option_code]
    output: GarmentOptionLine
    side_effects: ["upcharge_cents/fabric_price_per_meter_cents snapshotted", "order.quoted_total_cents recomputed (order_quote_total)"]

  - method: GET
    path: "/orders/{id}/option-lines"
    description: "List an order's option lines (FK reverse-reachability for GarmentOptionLine.order_id)"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "GarmentOptionLine[]"
    side_effects: []

  - method: DELETE
    path: "/orders/{id}/option-lines/{lineId}"
    description: "Remove an option line from a draft order; recomputes quote"
    roles: [SalesAssociate, ShopManager, Customer]
    code: 200
    input: []
    output: GarmentOrder
    side_effects: ["line removed", "order.quoted_total_cents recomputed (order_quote_total)"]

  # --- Fitting ---
  - method: POST
    path: "/orders/{id}/fittings"
    description: "Schedule a fitting (milestone) on an order in CONFIRMED/IN_FITTING/REMAKE; OCC-guarded"
    roles: [FittingSpecialist, ShopManager]
    code: 201
    input: [tailor_id, room_id, milestone, start_at, end_at, expected_order_version]
    output: Fitting
    side_effects: ["Fitting status=SCHEDULED", "first fitting moves order CONFIRMED/REMAKE -> IN_FITTING", "increments GarmentOrder.version by 1"]

  - method: GET
    path: "/orders/{id}/fittings"
    description: "List an order's fittings (FK reverse-reachability for Fitting.order_id)"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: ["milestone?", "outcome?", "limit?", "offset?"]
    output: "Fitting[]"
    side_effects: []

  - method: POST
    path: "/orders/{id}/fittings/{fittingId}/record-outcome"
    description: "Record a fitting PASS/FAIL; cascades order READY or REMAKE on FINAL"
    roles: [FittingSpecialist, ShopManager]
    code: 200
    input: [result]
    output: Fitting
    side_effects: ["outcome PASSED/FAILED", "FINAL+PASS -> order READY", "FINAL+FAIL -> order REMAKE cascade (compensation credit, fabric re-reserve, customer risk)"]

  # --- AlterationTicket ---
  - method: POST
    path: "/orders/{id}/alterations"
    description: "Open an alteration ticket on a READY or PICKED_UP order"
    roles: [SalesAssociate, FittingSpecialist, ShopManager, Customer]
    code: 201
    input: [description, "billable_cents?"]
    output: AlterationTicket
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/orders/{id}/alterations"
    description: "List an order's alteration tickets (FK reverse-reachability for AlterationTicket.order_id)"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AlterationTicket[]"
    side_effects: []

  - method: POST
    path: "/orders/{id}/alterations/{ticketId}/complete"
    description: "Complete an alteration ticket (requires payment if billable)"
    roles: [FittingSpecialist, ShopManager]
    code: 200
    input: []
    output: AlterationTicket
    side_effects: ["status OPEN -> COMPLETED"]

  - method: POST
    path: "/orders/{id}/alterations/{ticketId}/void"
    description: "Void an alteration ticket"
    roles: [ShopManager]
    code: 200
    input: []
    output: AlterationTicket
    side_effects: ["status OPEN -> VOIDED"]

  # --- Payment ---
  - method: POST
    path: "/orders/{id}/payments"
    description: "Capture a deposit or balance payment on an order"
    roles: [SalesAssociate, ShopManager, Customer]
    code: 201
    input: [kind, amount_cents]
    output: Payment
    side_effects: ["Payment status=CAPTURED", "order.amount_paid_cents/balance_due_cents recomputed (balance_due)", "advance to IN_FITTING eligibility on deposit"]

  - method: GET
    path: "/orders/{id}/payments"
    description: "List an order's payments (FK reverse-reachability for Payment.order_id)"
    roles: [ShopManager, SalesAssociate, FittingSpecialist, Customer]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  - method: POST
    path: "/orders/{id}/apply-credit"
    description: "Apply available customer store credit against an order's balance"
    roles: [SalesAssociate, ShopManager]
    code: 200
    input: [amount_cents]
    output: GarmentOrder
    side_effects: ["Customer.store_credit_cents debited", "order.store_credit_applied_cents += amount", "balance_due recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid or role unknown" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }

  # --- Request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, type mismatch, or bad enum value" }
  - { id: ERR_INVALID_FITTING_WINDOW, http: 422, condition: "Fitting end_at <= start_at" }
  - { id: ERR_SCAN_REF_REQUIRED, http: 422, condition: "source=BODY_SCAN without body_scan_ref, or source=MANUAL with body_scan_ref present" }

  # --- Not found ---
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer_id does not resolve" }
  - { id: ERR_PROFILE_NOT_FOUND, http: 404, condition: "measurement_profile_id / profileId does not resolve" }
  - { id: ERR_FABRIC_NOT_FOUND, http: 404, condition: "fabric_id / fabricId does not resolve" }
  - { id: ERR_TAILOR_NOT_FOUND, http: 404, condition: "tailor_id / tailorId does not resolve" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "room_id / roomId does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "orderId does not resolve" }
  - { id: ERR_FITTING_NOT_FOUND, http: 404, condition: "fittingId does not resolve under the order" }
  - { id: ERR_ALTERATION_NOT_FOUND, http: 404, condition: "ticketId does not resolve under the order" }
  - { id: ERR_GROUP_NOT_FOUND, http: 404, condition: "group_order_id / groupId does not resolve" }

  # --- Referential / constraint ---
  - { id: ERR_PROFILE_CUSTOMER_MISMATCH, http: 422, condition: "Order's measurement_profile belongs to a different customer than customer_id" }
  - { id: ERR_PROFILE_SUPERSEDED, http: 422, condition: "Order confirm references a SUPERSEDED measurement profile" }
  - { id: ERR_FABRIC_DISCONTINUED, http: 422, condition: "Option line references a DISCONTINUED fabric" }
  - { id: ERR_NO_OPTION_LINES, http: 409, condition: "Confirm attempted with zero option lines" }

  # --- Order state ---
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "Order not in a state that permits the requested operation" }
  - { id: ERR_ORDER_NOT_IN_FITTING, http: 409, condition: "Fitting outcome recorded while order not IN_FITTING" }
  - { id: ERR_ALREADY_PICKED_UP, http: 409, condition: "Operation attempted on an order that already has a Pickup record" }

  # --- Fitting workflow ---
  - { id: ERR_MILESTONE_OUT_OF_ORDER, http: 409, condition: "Fitting milestone does not follow BASTED->FORWARD->FINAL ladder for the current remake_round" }
  - { id: ERR_MASTER_TAILOR_REQUIRED, http: 422, condition: "FINAL fitting assigned a non-MASTER tailor" }
  - { id: ERR_TAILOR_INACTIVE, http: 422, condition: "Assigned tailor is INACTIVE" }
  - { id: ERR_ROOM_CLOSED, http: 422, condition: "Assigned fitting room is CLOSED" }
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "Fitting interval + room cleanup buffer overlaps another scheduled fitting in the same room" }
  - { id: ERR_TAILOR_DOUBLE_BOOKED, http: 409, condition: "Fitting interval overlaps another scheduled fitting for the same tailor" }
  - { id: ERR_FINAL_NOT_REACHED, http: 409, condition: "Order READY transition attempted without a passing FINAL fitting" }
  - { id: ERR_REMAKE_REQUIRES_FINAL, http: 409, condition: "REMAKE cascade triggered by a non-FINAL failing fitting" }
  - { id: ERR_REMAKE_LIMIT_REACHED, http: 409, condition: "FINAL fitting failed but remake_round already at MAX_REMAKES" }

  # --- Fiscal ---
  - { id: ERR_DEPOSIT_NOT_PAID, http: 402, condition: "First fitting scheduled before deposit_due_cents captured" }
  - { id: ERR_PAYMENT_NOT_ALLOWED_NOW, http: 409, condition: "DEPOSIT outside CONFIRMED or BALANCE outside READY, or amount_cents <= 0" }
  - { id: ERR_OVERPAYMENT_REJECTED, http: 422, condition: "BALANCE payment exceeds balance_due by more than OVERPAY_TOLERANCE_CENTS" }
  - { id: ERR_INSUFFICIENT_STORE_CREDIT, http: 422, condition: "apply-credit exceeds available store credit or outstanding balance" }
  - { id: ERR_FABRIC_INSUFFICIENT, http: 409, condition: "Confirm/remake reservation exceeds Fabric.bolt_meters_remaining" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 409, condition: "Pickup attempted while balance_due_cents > 0" }
  - { id: ERR_OPEN_ALTERATION_BLOCKS_PICKUP, http: 409, condition: "Pickup attempted while an OPEN alteration ticket exists" }
  - { id: ERR_ALTERATION_UNPAID, http: 402, condition: "Completing a billable alteration before its charge was paid" }
  - { id: ERR_ALTERATION_INVALID_STATE, http: 409, condition: "Alteration complete/void on a non-OPEN ticket" }

  # --- Group ---
  - { id: ERR_GROUP_NOT_FORMING, http: 409, condition: "Joining/confirming a member into a group that is not FORMING" }
  - { id: ERR_GROUP_TOO_SMALL, http: 409, condition: "Group lock attempted below GROUP_MIN_MEMBERS" }
  - { id: ERR_GROUP_HAS_DRAFT_MEMBERS, http: 409, condition: "Group lock attempted while a member order is still DRAFT" }
  - { id: ERR_GROUP_MEMBERS_PENDING, http: 409, condition: "Group fulfilled-transition attempted while a member order is not PICKED_UP" }

  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version did not match the parent entity's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End customer; manages own measurement profiles, draft orders, option lines, self-pay, and alteration requests for own orders"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /measurement-profiles — create own profile"
      - "POST /orders — create own draft order"
      - "POST /orders/{id}/option-lines — add option lines to own draft order"
      - "DELETE /orders/{id}/option-lines/{lineId} — remove option line from own draft order"
      - "POST /orders/{id}/payments — pay deposit/balance on own order"
      - "POST /orders/{id}/alterations — open alteration on own order"
      - "GET endpoints for own resources"

  - name: SalesAssociate
    description: "Front-of-house; creates customers/orders/quotes, captures payments, confirms orders, records pickups"
    identity: "opaque"
    exclusive_operations:
      - "POST /customers — create customer"
      - "POST /orders/{id}/confirm — confirm order"
      - "POST /orders/{id}/pickup — record pickup"
      - "POST /orders/{id}/apply-credit — apply store credit"
    shared_operations:
      - "POST /orders, /measurement-profiles, /option-lines, /payments, /group-orders (with ShopManager)"

  - name: FittingSpecialist
    description: "Tailoring floor; schedules fittings, records fitting outcomes, completes alterations"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/fittings/{fittingId}/record-outcome — record fitting outcome"
      - "POST /orders/{id}/alterations/{ticketId}/complete — complete alteration"
    shared_operations:
      - "POST /orders/{id}/fittings — schedule fitting (with ShopManager)"

  - name: ShopManager
    description: "Operator/admin; manages catalog (fabrics, tailors, rooms), order/group lifecycle, cancellations, overrides"
    identity: "opaque"
    exclusive_operations:
      - "POST /fabrics, PATCH /fabrics/{id} — fabric catalog"
      - "POST /tailors — tailor roster"
      - "POST /fitting-rooms — room setup"
      - "POST /orders/{id}/cancel — cancel order"
      - "POST /group-orders/{id}/lock — lock group"
      - "POST /group-orders/{id}/cancel — cancel group"
      - "POST /orders/{id}/alterations/{ticketId}/void — void alteration"
    shared_operations:
      - "All SalesAssociate and FittingSpecialist write operations (manager superset on the tailoring/sales surface)"
