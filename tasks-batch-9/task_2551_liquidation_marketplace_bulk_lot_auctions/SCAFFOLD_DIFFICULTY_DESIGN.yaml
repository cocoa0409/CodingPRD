          - errors[ERR_MANIFEST_EMPTY]
          - entities.Lot.fields.manifest_line_count
          - entities.Lot.fields.declared_unit_count
          - endpoints[POST /liquidation/manifest-lines/{id}/voids]
          - endpoints[POST /liquidation/lots/{id}/manifest-submissions]
        distinguishing_aspect: |
          A different metric at a different endpoint: the boundary here is the cardinality of the
          ACTIVE manifest-line set, and it is crossed downwards. A lot that once had a line but whose
          only line is VOIDED must be treated exactly like a never-populated lot - manifest_line_count
          0, declared_unit_count 0, declared_retail_value_cents 0 - so the submission is refused with
          422 ERR_MANIFEST_EMPTY. Implementations that count rows instead of ACTIVE rows, or that
          leave the aggregates at 40 / 800000, admit the submission and move the lot to
          MANIFEST_IN_REVIEW.
        test_recipe:
          setup:
            - "One seller and one warehouse; the clock stays at 2026-08-01T00:00:00Z."
            - "Lot E is created in DRAFT with a single ACTIVE manifest line 40 x 20000, so manifest_line_count is 1, declared_unit_count 40 and declared_retail_value_cents 800000."
            - "That single line is then VOIDED, taking the ACTIVE set to exactly zero members."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Home goods returns E", category_code: "HOME_GOODS", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lote: "$.data.id", lot_status_initial: "$.data.lot_status", lines_initial: "$.data.manifest_line_count" }
            - call: "POST /liquidation/lots/${lote}/manifest-lines"
              payload: { sku: "HG-E1", unit_count: 40, unit_retail_cents: 20000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { mle: "$.data.id" }
            - call: "GET /liquidation/lots/${lote}"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lines_after_add: "$.data.manifest_line_count", units_after_add: "$.data.declared_unit_count", retail_after_add: "$.data.declared_retail_value_cents" }
            - call: "POST /liquidation/manifest-lines/${mle}/voids"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
              captures: { line_status_after_void: "$.data.line_status" }
          trigger:
            - call: "POST /liquidation/lots/${lote}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${lot_status_initial} == DRAFT and ${lines_initial} == 0"
            - "${lines_after_add} == 1, ${units_after_add} == 40, ${retail_after_add} == 800000"
            - "${line_status_after_void} == VOIDED (the row is retained, not deleted)"
            - "${err} == ERR_MANIFEST_EMPTY with HTTP 422 - the ACTIVE set is empty at exactly zero members"
            - "Lot.${lote}.manifest_line_count == 0, declared_unit_count == 0, declared_retail_value_cents == 0"
            - "Lot.${lote}.lot_status == DRAFT - no DRAFT_to_MANIFEST_IN_REVIEW transition fired"
            - "GET /liquidation/lots/${lote}/manifest-lines?line_status=ACTIVE returns total_count 0 while GET /liquidation/lots/${lote}/manifest-lines returns total_count 1"

  # ===========================================================================
  # Rule 7 - cross-entity state dependencies on different entity pairs
  #   instance 1: Listing publication depends on SellerAccount.account_status
  #   instance 2: PickupAppointment depends on SaleOrder.payment_status
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: listing_publication_blocked_by_seller_probation_on_another_lot
        grounds:
          - validations[priority 10 -> ERR_SELLER_NOT_ACTIVE]
          - errors[ERR_SELLER_NOT_ACTIVE]
          - state_machines.Listing.DRAFT_to_OPEN
          - state_machines.SellerAccount.ACTIVE_to_MANIFEST_PROBATION
          - entities.SellerAccount.fields.account_status
          - endpoints[POST /liquidation/listings/{id}/publications]
        distinguishing_aspect: |
          Publishing listing L2 is legal in every respect that belongs to L2 or to its own lot - the
          listing is DRAFT, the lot is MANIFEST_APPROVED, the window is in the future - and it still
          must fail 409 ERR_SELLER_NOT_ACTIVE because a THIRD entity, the SellerAccount, was pushed
          into MANIFEST_PROBATION by a claim on an entirely different lot. The dependency crosses two
          hops (Listing -> Lot -> SellerAccount) and cannot be seen by validating the listing alone.
        test_recipe:
          setup:
            - "Seller, 1-door warehouse, carrier, one QUALIFIED buyer with a 10,000,000-cent limit."
            - "Lot S1 is CUSTOMER_RETURNS with lines 100 x 40000 (line 1) and 300 x 20000: 400 units / 10000000 retail."
            - "Lot S2 is a second CUSTOMER_RETURNS lot with one ACTIVE line 50 x 20000; its manifest is APPROVED and it carries a DRAFT AUCTION listing for the future window [2026-08-25T00:00:00Z, 2026-08-31T00:00:00Z) that has never been published."
            - "S1 sells at auction for 2700000, is paid (2987000) and picked up on 2026-08-18T14:00:00Z with actual freight 17000."
            - "At 2026-08-19T00:00:00Z the buyer files a UNIT_SHORTAGE claim on S1 line 1 for 80 units with two evidence URLs, and MarketplaceOps approves it, so Lot S1 scores 0.830, manifest_accuracy_avg becomes 0.830 and the seller flips to MANIFEST_PROBATION."
