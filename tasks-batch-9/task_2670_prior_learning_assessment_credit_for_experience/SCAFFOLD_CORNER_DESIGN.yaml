  - section: errors
    instances:
      - name: every_by_id_lookup_of_a_missing_row_returns_its_own_not_found_code
        claim_type: triggerable
        grounds:
          - validations[priority 6].entity-specific 404 family
          - response_envelope.error
          - endpoints[GET /programs/{program_id}]
          - endpoints[GET /rubric-scores/{score_id}]
        distinguishing_aspect: |
          The same syntactically valid but absent UUID produces a DIFFERENT error_id
          per resource family — ERR_PROGRAM_NOT_FOUND, ERR_COURSE_NOT_FOUND,
          ERR_OUTCOME_NOT_FOUND, ERR_RECOMMENDATION_NOT_FOUND,
          ERR_ARTICULATION_RULE_NOT_FOUND, ERR_STUDENT_NOT_FOUND,
          ERR_ASSESSOR_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_PORTFOLIO_NOT_FOUND,
          ERR_ARTIFACT_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND,
          ERR_RUBRIC_SCORE_NOT_FOUND, ERR_INVOICE_NOT_FOUND and
          ERR_APPEAL_NOT_FOUND — never a generic 404, and always in the declared
          error envelope with data.error_id and data.message.
        test_recipe:
          setup:
            - "An empty database; only the logical clock has been touched."
            - "The probe id 00000000-0000-4000-8000-000000000000 is a well-formed UUID that matches no row of any entity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlaCoordinator
          trigger:
            - call: "GET /programs/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e1: "$.data.error_id" }
            - call: "GET /courses/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e2: "$.data.error_id" }
            - call: "GET /learning-outcomes/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e3: "$.data.error_id" }
            - call: "GET /credential-recommendations/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e4: "$.data.error_id" }
            - call: "GET /articulation-rules/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e5: "$.data.error_id" }
            - call: "GET /students/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e6: "$.data.error_id" }
            - call: "GET /faculty-assessors/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e7: "$.data.error_id" }
            - call: "GET /pla-claims/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e8: "$.data.error_id" }
            - call: "GET /portfolios/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e9: "$.data.error_id" }
            - call: "GET /artifacts/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e10: "$.data.error_id" }
            - call: "GET /assessor-assignments/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e11: "$.data.error_id" }
            - call: "GET /rubric-scores/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e12: "$.data.error_id" }
            - call: "GET /fee-invoices/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e13: "$.data.error_id" }
            - call: "GET /appeals/00000000-0000-4000-8000-000000000000"
              as: PlaCoordinator
              captures: { e14: "$.data.error_id" }
          assert:
            - "all fourteen calls return HTTP 404"
            - "the ids are, in order: ERR_PROGRAM_NOT_FOUND, ERR_COURSE_NOT_FOUND, ERR_OUTCOME_NOT_FOUND, ERR_RECOMMENDATION_NOT_FOUND, ERR_ARTICULATION_RULE_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_ASSESSOR_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_PORTFOLIO_NOT_FOUND, ERR_ARTIFACT_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_RUBRIC_SCORE_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_APPEAL_NOT_FOUND"
            - "every response body has response_type == error, a non-empty data.message and a meta.api_request_id — the success envelope's top-level data object is replaced, not nested"
            - "body-referenced ids follow the same family rule: POST /pla-claims with a missing student_id returns 404 ERR_STUDENT_NOT_FOUND and with a missing course_id returns 404 ERR_COURSE_NOT_FOUND (priority 7)"
            - "a nested path with a good parent and a bad child also resolves per family: DELETE /portfolios/{real_portfolio_id}/artifacts/00000000-0000-4000-8000-000000000000 returns 404 ERR_ARTIFACT_NOT_FOUND"
            - "list endpoints never 404 on unknown filter values: GET /pla-claims?student_id=00000000-0000-4000-8000-000000000000 returns 200 with an empty data array and meta.total_count == 0"

