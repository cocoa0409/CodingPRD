      - name: cascading_side_effects_layer_is_covered_by_the_sanction_cascade_instance
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.BreakGlassAccess.UNDER_REVIEW_to_UNJUSTIFIED
        excluded_because:
          difficulty_instance: transitive_cascade / unjustified_break_glass_review_cascades_sanction_suspension_feed_and_scorecard
          rationale: |
            That §1.8 transitive_cascade instance already walks the full four-link chain end to end in
            declared order - review outcome UNJUSTIFIED -> sanction points at or above the suspension
            threshold -> Participant SUSPENDED -> every qualifying DataFeed SUSPENDED -> the scorecard
            recomputed over the shrunken sample set - and asserts each intermediate hop plus the final
            derived grade, which is strictly more than a layer-level cascade claim would assert.
      - name: dual_variant_calculation_layer_is_covered_by_the_fee_variant_instance
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.participation_fee.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / participation_fee_provisional_vs_reconciled_diverge_on_same_billing_period
          rationale: |
            That §1.8 dual_variant_calc instance already drives both variants over one participant and one
            billing period, asserts the two divergent totals to the cent (299877 provisional versus 254125
            reconciled) and asserts the delta, covering the layer's "both variants produce expected results
            and the delta on switch is correct" claim without duplication.
  - section: Consistency Model
    instances:
      - name: one_quality_sample_publishes_every_derived_field_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.participant_quality_score
          - state_machines.DataFeed.PROVISIONING_to_MONITORED
          - entities.Participant.fields.quality_score
          - entities.Participant.fields.quality_grade
          - entities.DataFeed.fields.latest_reject_rate
        distinguishing_aspect: |
          consistency_model is immediate, so a single accepted FeedQualitySample must publish every
          dependent value with no second call and no lag: the sample response already carries the computed
          reject_rate 0.0125, the feed has already left PROVISIONING for MONITORED with latest_reject_rate
          set, and the owning Participant's denormalized quality_score 98.78 / quality_grade A are already
          readable. The on-read scorecard recomputation must agree with the stored denormalized pair field
          for field (components 97.50 / 98.75 / 99.375 / 100, base 98.78, penalty 0), which is what rules
          out an implementation that stores one number and computes another.
        test_recipe:
          setup:
            - "One participant is at CONFORMANCE_TESTING with a single PROVISIONING CCDA feed and no samples, so it starts UNGRADED."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Gladewater Regional Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 72000, primary_contact_email: "hie@gladewater.example" }
