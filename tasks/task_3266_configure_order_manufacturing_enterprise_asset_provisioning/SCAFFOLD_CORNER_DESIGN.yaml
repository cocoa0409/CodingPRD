            - "CustomerAccount.${vv1_a}.outstanding_cents == 0"
            - "Order.${vv1_o}.build_status == DRAFT"

      - name: submit_not_found_outranks_state
        claim_type: priority_ordering
        grounds: ['validations[priority=3]', 'validations[priority=4]', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "Submitting a nonexistent order id fails existence (priority 3) with 404 before any state check — existence outranks state."
        test_recipe:
          setup: ["a real configuration exists so the OCC payload field can carry a server-observed version; the order id is the nonexistent one"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "VV2", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { vv2_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "VVL2", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { vv2_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "VVC2", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { vv2_c: $.data.id } }
            - { call: "POST /api/configurations", payload: { account_id: "${vv2_a}", chassis_model_id: "${vv2_l}", component_selections: [{ component_id: "${vv2_c}", qty: 1 }] }, as: CustomerUser, as_user_id: "${vv2_a}", captures: { vv2_cf: $.data.id, vv2_cv: $.data.version } }
          trigger:
            - { call: "POST /api/orders/00000000-0000-0000-0000-000000000000/submit", payload: { expected_configuration_version: "${vv2_cv}" }, as: PlatformAdmin, captures: { vv2_err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: eol_component_rejected_on_validate
        claim_type: conditional_validation
        grounds: ['validations[priority=7]', 'errors[ERR_COMPONENT_EOL]', 'endpoints[POST /api/components/{id}/discontinue]']
        distinguishing_aspect: "Validation is conditional on the component's status: the same selections validate cleanly while the component is ACTIVE but fail with ERR_COMPONENT_EOL once it is discontinued."
        test_recipe:
          setup: ["account; chassis; component ALLOWED; configuration created (DRAFT) selecting the component; component then discontinued"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "VV2B", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { vvb_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "VVL2B", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { vvb_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "VVC2B", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { vvb_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${vvb_l}", component_id: "${vvb_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${vvb_a}"
                chassis_model_id: "${vvb_l}"
                component_selections: [{ component_id: "${vvb_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${vvb_a}"
              captures: { vvb_cf: $.data.id }
            - { call: "POST /api/components/${vvb_c}/discontinue", payload: {}, as: PlatformAdmin }
          trigger:
