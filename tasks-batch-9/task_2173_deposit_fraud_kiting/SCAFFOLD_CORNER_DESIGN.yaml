            - call: "POST /deposit-fraud/check-holds/${hold_sd}/override-reviews"
              payload: { requested_release_cents: 7500, release_effective_at: "2026-08-01T00:00:00Z", release_window_end_at: "2026-08-02T00:00:00Z", justification: "Prepared by the supervisor personally", expected_check_hold_version: "${hold_sd_v}" }
