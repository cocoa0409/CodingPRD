  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: property_custody_reverter_cycle_back_to_listed
        grounds:
          - state_machines.Property.custody_status
          - state_machines.DevelopmentAgreement.status
          - state_machines.Property.title_status
          - endpoints["POST /land-bank/compliance-sweeps"]
        distinguishing_aspect: |
          The Property custody dimension is genuinely cyclic, not linear: the same parcel walks
          PROSPECT -> ACQUIRED -> LISTED -> CONVEYED -> REVERTED -> LISTED, re-entering a state it
          has already left, and the second LISTED entry is only reachable after the parallel title
          dimension has itself cycled CLEAR -> CLOUDED -> QUIET_TITLE_FILED -> CLEAR through a
          second title action whose round_no is 2.
        test_recipe:
          setup:
            - "One ACQUISITION_ONLY funding source, ACTIVE, authorized 500000 cents, expiring 2029-12-31."
            - "One parcel of 8500 sqft, assessed 1000000 cents, grade C, structure present; acquired by donation, quiet-titled CLEAR, LISTED."
            - "One DEVELOPER applicant whose DEVELOPER_RFP application is screened, recommended by a second officer and board-approved at the quoted 900000 cents."
            - "A development agreement is executed with performance_deadline 2026-09-01, milestone_count 2, reverter_clause_active true, and no milestone is ever reported."
            - "The clock is advanced to 2026-09-02 for the first sweep (opens the cure period) and to 2026-12-01 for the second (cure_deadline 2026-11-30 has lapsed, so the reverter fires)."
            - "A second title action is then filed and CLEARED so the parcel is eligible to be re-listed."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Acquisition Revolving Line", source_type: "GENERAL_FUND", authorized_cents: 500000, restriction: "ACQUISITION_ONLY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
