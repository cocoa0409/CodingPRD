scenario: "DJ & Live Entertainment Booking: performer/act roster & genre, event date & set length, package & equipment (sound/lighting), deposit & balance, song request/do-not-play list, travel & overtime, contract & cancellation, backup-performer"
domain_name: "dj-live-entertainment-booking"
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep URL nesting. Performer, Booking,
  # PackageOffering, EquipmentItem, PaymentRecord, SongRequest, ContractDocument,
  # BackupAssignment, TravelZone, BlackoutWindow all reference each other by FK id.

  state_machine_shape: cyclic
  # Booking lifecycle has a revision loop (CONTRACT_SENT -> NEGOTIATING -> CONTRACT_SENT)
  # and PaymentRecord carries parallel-evolving dimensions. ContractDocument has a
  # branching accept/decline fork. BackupAssignment cycles offered -> declined -> offered.

  relationship_patterns:
    - one_to_many        # Booking has many SongRequest, many PaymentRecord, many BackupAssignment
    - many_to_many       # Booking <-> EquipmentItem via PackageOffering line items
    - cross_aggregate    # Booking transitions depend on Performer.availability_status and ContractDocument.status

  role_model: peer_roles
  # BookingAgent (operator) owns booking lifecycle; Performer (entity-backed) owns
  # availability + accepts backup offers; Client (entity-backed) signs contracts,
  # pays, submits song requests; StudioAdmin (opaque) configures packages/zones/clock.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE
# ===========================================================================
entities:
  - name: Performer
    parent: null
    common_fields: true
    fields:
      - name: stage_name
        type: string
        source: input
        description: Public act/stage name
        constraints: required, non-empty
      - name: act_type
        type: enum
        source: input
        description: Kind of act
        constraints: "one of {DJ, BAND, SOLO_MUSICIAN, EMCEE, DUO}"
      - name: genre
        type: enum
        source: input
        description: Primary genre offered
        constraints: "one of {HOUSE, HIP_HOP, TOP_40, JAZZ, ROCK, COUNTRY, LATIN, CLASSICAL, MULTI_GENRE}"
      - name: home_zone_id
        type: string
        source: input
        description: "FK -> TravelZone.id; the zone the performer is based in; travel fees are computed relative to this"
      - name: base_set_rate_cents
        type: integer
        source: input
        description: Quoted rate for the performer's standard set in integer cents
        constraints: ">= 0"
      - name: overtime_rate_cents_per_15min
        type: integer
        source: input
        description: Overtime charge per started 15-minute block beyond contracted set length, in cents
        constraints: ">= 0"
      - name: availability_status
        type: enum
        source: computed
        description: "Roster availability; AVAILABLE unless the performer holds a CONFIRMED or PERFORMING booking, or is manually set INACTIVE"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, ON_HOLD, BOOKED, INACTIVE}"
      - name: reliability_score
        type: integer
        source: computed
        description: "Starts at 100; decremented on performer-caused cancellations and declined backup offers; floored at 0, capped at 100"
        default: 100
      - name: lifetime_completed_sets
        type: integer
        source: computed
        description: Count of bookings this performer drove to PERFORMED
        default: 0

  - name: TravelZone
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: Short zone code (e.g., "Z1")
        constraints: required, unique across TravelZone
      - name: name
        type: string
        source: input
        description: Human-readable zone name
      - name: base_travel_fee_cents
        type: integer
        source: input
        description: Flat travel fee in cents when a performer leaves their home zone for this zone
        constraints: ">= 0"
      - name: per_mile_fee_cents
        type: integer
        source: input
        description: Per-mile surcharge in cents added on top of the base travel fee
        constraints: ">= 0"
      - name: surge_multiplier_bps
        type: integer
        source: input
        description: "Surge multiplier in basis points applied to the travel subtotal (10000 = 1.0x = no surge)"
        default: 10000
        constraints: ">= 10000"

  - name: PackageOffering
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Package name (e.g., "Wedding Deluxe")
        constraints: required, non-empty
      - name: tier
        type: enum
        source: input
        description: Package tier
        constraints: "one of {BASIC, STANDARD, PREMIUM}"
      - name: flat_package_fee_cents
        type: integer
        source: input
        description: Flat fee in cents charged for the package on top of the performer set rate
        constraints: ">= 0"
      - name: included_set_minutes
        type: integer
        source: input
        description: Set length in minutes included by this package before overtime applies
        constraints: ">= 30"
      - name: deposit_pct_bps
        type: integer
        source: input
        description: "Required deposit as a fraction of the grand total, in basis points (e.g., 2500 = 25%)"
        default: 2500
        constraints: ">= 0, <= 10000"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE on creation; RETIRED after retire action; RETIRED packages cannot be attached to new bookings"
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"

  - name: EquipmentItem
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> PackageOffering.id; the package this equipment line belongs to"
      - name: category
        type: enum
        source: input
        description: Equipment category
        constraints: "one of {SOUND, LIGHTING, STAGING, FX}"
      - name: label
        type: string
        source: input
        description: Equipment label (e.g., "Twin QSC K12.2 + sub")
      - name: unit_fee_cents
        type: integer
        source: input
        description: Fee in cents added to the booking when this equipment line is part of the chosen package
        constraints: ">= 0"
      - name: requires_power_circuits
        type: integer
        source: input
        description: Number of dedicated 20A circuits this item draws
        default: 1
        constraints: ">= 0"

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client who owns this booking"
      - name: performer_id
        type: string
        source: input
        description: "FK -> Performer.id; the booked act"
      - name: package_id
        type: string
        source: input
        description: "FK -> PackageOffering.id; the selected package (must be ACTIVE at booking create)"
      - name: event_zone_id
        type: string
        source: input
        description: "FK -> TravelZone.id; the zone the event is held in"
      - name: event_start_utc
        type: datetime
        source: input
        description: Event/set start timestamp (ISO 8601 UTC)
        constraints: must be strictly in the future relative to current clock at create
      - name: contracted_set_minutes
        type: integer
        source: input
        description: Contracted set length in minutes; defaults to the package included_set_minutes if omitted
        constraints: ">= package.included_set_minutes"
      - name: event_miles_from_home
        type: integer
        source: input
        description: Road miles from the performer home zone to the event venue, used for travel fee
        constraints: ">= 0"
      - name: actual_set_minutes
        type: integer
        source: input
        description: Actual minutes performed, supplied when the set is marked PERFORMED; drives overtime
        default: null
        constraints: ">= 0 when present"
      - name: status
        type: enum
        source: computed
        description: "Booking lifecycle state"
        default: INQUIRY
        constraints: "one of {INQUIRY, HOLD, CONTRACT_SENT, NEGOTIATING, CONFIRMED, PERFORMING, PERFORMED, SETTLED, CANCELLED}"
      - name: quote_total_cents
        type: integer
        source: computed
        description: "Provisional grand total computed at HOLD/CONTRACT_SENT from set rate + package + equipment + travel; excludes overtime"
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Final grand total computed at PERFORMED including realized overtime; equals quote_total_cents plus overtime_cents"
        default: 0
      - name: overtime_cents
        type: integer
        source: computed
        description: Overtime charge in cents derived from actual_set_minutes beyond contracted_set_minutes
        default: 0
      - name: deposit_required_cents
        type: integer
        source: computed
        description: Deposit amount in cents = round(quote_total_cents * package.deposit_pct_bps / 10000)
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Sum of CAPTURED PaymentRecord.amount_cents minus sum of REFUNDED amounts for this booking
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "final_total_cents (or quote_total_cents pre-PERFORMED) minus amount_paid_cents"
        default: 0
      - name: cancellation_fee_cents
        type: integer
        source: computed
        description: Fee retained by the studio when a booking is cancelled, per the cancellation tier schedule
        default: 0
      - name: active_performer_id
        type: string
        source: computed
        description: "FK -> Performer.id; the performer currently on the hook; equals performer_id until a backup is promoted, then the backup"
        default: null

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Client full name
        constraints: required, non-empty
      - name: email
        type: string
        source: input
        description: Client contact email
        constraints: required, unique across Client
      - name: phone
        type: string
        source: input
        description: Client contact phone
      - name: store_credit_cents
        type: integer
        source: computed
        description: Refundable studio credit balance in cents accrued from cancellation refunds routed to credit
        default: 0

  - name: PaymentRecord
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this payment applies to"
      - name: kind
        type: enum
        source: input
        description: Payment purpose
        constraints: "one of {DEPOSIT, BALANCE, ADJUSTMENT}"
      - name: amount_cents
        type: integer
        source: input
        description: Amount in cents for this payment
        constraints: "> 0"
      - name: capture_status
        type: enum
        source: computed
        description: "Capture dimension; AUTHORIZED on create, CAPTURED after capture, VOID if voided before capture"
        default: AUTHORIZED
        constraints: "one of {AUTHORIZED, CAPTURED, VOID}"
      - name: settlement_status
        type: enum
        source: computed
        description: "Settlement dimension evolving independently of capture; UNSETTLED until a refund routes it to REFUNDED, or settlement sweep marks it SETTLED"
        default: UNSETTLED
        constraints: "one of {UNSETTLED, SETTLED, REFUNDED}"
      - name: refund_destination
        type: enum
        source: input
        description: "Where a refund of this payment is routed when applicable"
        default: ORIGINAL
        constraints: "one of {ORIGINAL, STORE_CREDIT}"

  - name: SongRequest
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this song entry belongs to"
      - name: title
        type: string
        source: input
        description: Song title
        constraints: required, non-empty
      - name: artist
        type: string
        source: input
        description: Song artist
      - name: list_type
        type: enum
        source: input
        description: "Whether this is a play request or a do-not-play entry"
        constraints: "one of {REQUEST, DO_NOT_PLAY}"
      - name: priority
        type: integer
        source: input
        description: "Client priority within REQUEST list (lower number = play earlier); ignored for DO_NOT_PLAY"
        default: 100
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "ACCEPTED on create; CONFLICTED if a REQUEST collides with an existing DO_NOT_PLAY on the same booking"
        default: ACCEPTED
        constraints: "one of {ACCEPTED, CONFLICTED}"

  - name: ContractDocument
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this contract version covers"
      - name: revision
        type: integer
        source: computed
        description: "1 for the first issued contract on a booking; increments by 1 each time a new contract supersedes a prior one after NEGOTIATING"
        default: 1
      - name: quoted_total_cents
        type: integer
        source: computed
        description: Snapshot of the booking quote_total_cents at the moment this contract was issued
        default: 0
      - name: status
        type: enum
        source: computed
        description: "ISSUED on creation; SIGNED when client signs; DECLINED when client declines; SUPERSEDED when a newer revision is issued"
        default: ISSUED
        constraints: "one of {ISSUED, SIGNED, DECLINED, SUPERSEDED}"

  - name: BackupAssignment
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking that may need a backup performer"
      - name: candidate_performer_id
        type: string
        source: input
        description: "FK -> Performer.id; the performer offered the backup slot"
      - name: rank
        type: integer
        source: input
        description: "Operator-assigned fallback rank; lower number is tried first when promoting a backup"
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "OFFERED on create; ACCEPTED when candidate accepts; DECLINED when candidate declines; PROMOTED when this backup replaces the primary; EXPIRED when superseded"
        default: OFFERED
        constraints: "one of {OFFERED, ACCEPTED, DECLINED, PROMOTED, EXPIRED}"

  - name: BlackoutWindow
    parent: null
    common_fields: false
    fields:
      - name: performer_id
        type: string
        source: input
        description: "FK -> Performer.id; the performer who is unavailable in this window"
      - name: start_utc
        type: datetime
        source: input
        description: Inclusive start of the unavailable window (ISO 8601 UTC)
      - name: end_utc
        type: datetime
        source: input
        description: Exclusive end of the unavailable window (ISO 8601 UTC)
        constraints: end_utc > start_utc
      - name: reason
        type: string
        source: input
        description: Free-text reason (vacation, recording, etc.)

# ===========================================================================
# §1.2 STATE MACHINE TABLE
# ===========================================================================
state_machines:
  - entity: Booking
    initial_state: INQUIRY
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: INQUIRY
        to: HOLD
        trigger: "POST /bookings/{id}/hold"
        actor: BookingAgent
        preconditions:
          - "Booking.status == INQUIRY"
          - "Performer.active_performer (performer_id) availability_status IN {AVAILABLE, ON_HOLD}"
          - "no overlap conflict per resource_temporal_overlap booking-vs-booking rule on performer_id"
          - "event_start_utc does not fall inside any BlackoutWindow of performer_id"
          - "PackageOffering.status == ACTIVE"
        side_effects:
          - "compute quote_total_cents via calculation booking_quote_total"
          - "compute deposit_required_cents = round(quote_total_cents * package.deposit_pct_bps / 10000)"
          - "set balance_due_cents = quote_total_cents - amount_paid_cents"
          - "set active_performer_id = performer_id"
          - "Performer(performer_id).availability_status -> ON_HOLD (cascade to Performer)"
          - "increments Booking.version by 1"
      - from: HOLD
        to: CONTRACT_SENT
        trigger: "POST /bookings/{id}/issue-contract"
        actor: BookingAgent
        preconditions:
          - "Booking.status == HOLD"
          - "deposit not yet captured (no CAPTURED DEPOSIT PaymentRecord)"
        side_effects:
          - "create ContractDocument revision 1 with status ISSUED, quoted_total_cents = quote_total_cents"
          - "increments Booking.version by 1"
      - from: CONTRACT_SENT
        to: NEGOTIATING
        trigger: "POST /bookings/{id}/request-revision"
        actor: Client
        preconditions:
          - "Booking.status == CONTRACT_SENT"
          - "current ContractDocument.status == ISSUED"
        side_effects:
          - "current ContractDocument.status -> DECLINED (cascade to ContractDocument)"
          - "increments Booking.version by 1"
        note: "Revision loop entry; CONTRACT_SENT -> NEGOTIATING -> CONTRACT_SENT forms the cycle."
      - from: NEGOTIATING
        to: CONTRACT_SENT
        trigger: "POST /bookings/{id}/issue-contract"
        actor: BookingAgent
        preconditions:
          - "Booking.status == NEGOTIATING"
        side_effects:
          - "any non-terminal ContractDocument on this booking with status ISSUED -> SUPERSEDED (cascade to ContractDocument)"
          - "create ContractDocument with revision = prior max revision + 1, status ISSUED, quoted_total_cents = quote_total_cents"
          - "increments Booking.version by 1"
        note: "Closes the negotiation cycle back to CONTRACT_SENT."
      - from: CONTRACT_SENT
        to: CONFIRMED
        trigger: "POST /contracts/{id}/sign then deposit capture; system event when deposit captured against a SIGNED contract"
        actor: system
        preconditions:
          - "Booking.status == CONTRACT_SENT"
          - "current ContractDocument.status == SIGNED"
          - "a DEPOSIT PaymentRecord for this booking has been CAPTURED with cumulative CAPTURED deposits >= deposit_required_cents"
        side_effects:
          - "set active_performer_id = performer_id"
          - "Performer(active_performer_id).availability_status -> BOOKED (cascade to Performer)"
          - "expire all OFFERED/ACCEPTED BackupAssignment? no — backups remain standby"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: PERFORMING
        trigger: "POST /bookings/{id}/start-set"
        actor: BookingAgent
        preconditions:
          - "Booking.status == CONFIRMED"
          - "current clock >= event_start_utc"
        side_effects:
          - "Performer(active_performer_id).availability_status -> BOOKED (no change, remains BOOKED)"
          - "increments Booking.version by 1"
      - from: PERFORMING
        to: PERFORMED
        trigger: "POST /bookings/{id}/complete-set"
        actor: BookingAgent
        preconditions:
          - "Booking.status == PERFORMING"
          - "actual_set_minutes present and >= 0"
        side_effects:
          - "compute overtime_cents via calculation overtime_charge"
          - "compute final_total_cents = quote_total_cents + overtime_cents"
          - "recompute balance_due_cents = final_total_cents - amount_paid_cents"
          - "Performer(active_performer_id).availability_status -> AVAILABLE (cascade to Performer)"
          - "Performer(active_performer_id).lifetime_completed_sets += 1 (cascade to Performer)"
          - "increments Booking.version by 1"
      - from: PERFORMED
        to: SETTLED
        trigger: "POST /bookings/{id}/settle"
        actor: BookingAgent
        preconditions:
          - "Booking.status == PERFORMED"
          - "balance_due_cents <= 0 (final balance fully covered by CAPTURED payments)"
        side_effects:
          - "all UNSETTLED CAPTURED PaymentRecord for this booking -> settlement_status SETTLED (cascade to PaymentRecord)"
          - "increments Booking.version by 1"
      - from: HOLD
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: BookingAgent | Client
        preconditions:
          - "Booking.status IN {HOLD, CONTRACT_SENT, NEGOTIATING, CONFIRMED}"
        side_effects:
          - "compute cancellation_fee_cents via calculation cancellation_fee"
          - "for each CAPTURED PaymentRecord: refundable = amount_paid_cents - cancellation_fee_cents; route refund per refund_destination (cascade to PaymentRecord settlement_status -> REFUNDED, and Client.store_credit_cents if STORE_CREDIT)"
          - "any ISSUED/SIGNED ContractDocument -> DECLINED (cascade to ContractDocument)"
          - "any OFFERED/ACCEPTED BackupAssignment -> EXPIRED (cascade to BackupAssignment)"
          - "Performer(active_performer_id).availability_status -> AVAILABLE (cascade to Performer)"
          - "if cancellation was performer-caused via promote path, decrement Performer.reliability_score"
          - "increments Booking.version by 1"
        note: "Same cancel transition is reachable from HOLD, CONTRACT_SENT, NEGOTIATING, CONFIRMED; cancellation_fee tier depends on lead time and status."
      - from: CONTRACT_SENT
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: BookingAgent | Client
        preconditions:
          - "Booking.status == CONTRACT_SENT"
        side_effects:
          - "identical cascade as HOLD->CANCELLED"
          - "increments Booking.version by 1"
      - from: NEGOTIATING
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: BookingAgent | Client
        preconditions:
          - "Booking.status == NEGOTIATING"
        side_effects:
          - "identical cascade as HOLD->CANCELLED"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: BookingAgent | Client
        preconditions:
          - "Booking.status == CONFIRMED"
        side_effects:
          - "identical cascade as HOLD->CANCELLED"
          - "increments Booking.version by 1"

  - note: "ContractDocument has a branching fork (SIGNED vs DECLINED) plus a SUPERSEDED side path."
    entity: ContractDocument
    initial_state: ISSUED
    terminal_states: [SIGNED, DECLINED, SUPERSEDED]
    transitions:
      - from: ISSUED
        to: SIGNED
        trigger: "POST /contracts/{id}/sign"
        actor: Client
        preconditions:
          - "ContractDocument.status == ISSUED"
          - "owning Booking.status == CONTRACT_SENT"
          - "acting Client.id == Booking.client_id"
        side_effects:
          - "increments ContractDocument.version by 1"
        note: "Branch A of the fork."
      - from: ISSUED
        to: DECLINED
        trigger: "POST /contracts/{id}/decline OR cascade from booking request-revision/cancel"
        actor: Client | system
        preconditions:
          - "ContractDocument.status == ISSUED"
        side_effects:
          - "increments ContractDocument.version by 1"
        note: "Branch B of the fork; divergent side-effect set from SIGNED (no deposit path unlocked)."
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system cascade when a newer revision is issued after NEGOTIATING"
        actor: system
        preconditions:
          - "ContractDocument.status == ISSUED"
          - "a newer ContractDocument revision is being created on the same booking"
        side_effects:
          - "increments ContractDocument.version by 1"

  - note: "PaymentRecord carries two parallel state dimensions: capture_status and settlement_status."
    entity: PaymentRecord
    initial_state: AUTHORIZED
    terminal_states: [VOID]
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /payments/{id}/capture"
        actor: BookingAgent | Client
        preconditions:
          - "PaymentRecord.capture_status == AUTHORIZED"
          - "owning Booking.status NOT IN {CANCELLED, SETTLED}"
        side_effects:
          - "recompute Booking.amount_paid_cents and Booking.balance_due_cents (cascade to Booking)"
          - "if booking is CONTRACT_SENT with SIGNED contract and cumulative CAPTURED deposits >= deposit_required_cents, drive Booking CONTRACT_SENT->CONFIRMED (cross-entity cascade)"
          - "increments PaymentRecord.version by 1"
        note: "capture_status dimension."
      - from: AUTHORIZED
        to: VOID
        trigger: "POST /payments/{id}/void"
        actor: BookingAgent
        preconditions:
          - "PaymentRecord.capture_status == AUTHORIZED"
        side_effects:
          - "increments PaymentRecord.version by 1"
        note: "capture_status dimension; cannot void a CAPTURED payment."
      - from: UNSETTLED
        to: REFUNDED
        trigger: "cascade from Booking cancel"
        actor: system
        preconditions:
          - "PaymentRecord.capture_status == CAPTURED"
          - "PaymentRecord.settlement_status == UNSETTLED"
        side_effects:
          - "if refund_destination == STORE_CREDIT, Client.store_credit_cents += refundable portion (cascade to Client)"
          - "increments PaymentRecord.version by 1"
        note: "settlement_status dimension; evolves independently of capture_status (a CAPTURED payment can be UNSETTLED then REFUNDED)."
      - from: UNSETTLED
        to: SETTLED
        trigger: "cascade from Booking settle"
        actor: system
        preconditions:
          - "PaymentRecord.capture_status == CAPTURED"
          - "PaymentRecord.settlement_status == UNSETTLED"
        side_effects:
          - "increments PaymentRecord.version by 1"
        note: "settlement_status dimension."

  - note: "BackupAssignment has a cyclic offer loop and a promote terminal path."
    entity: BackupAssignment
    initial_state: OFFERED
    terminal_states: [DECLINED, PROMOTED, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /backup-assignments/{id}/accept"
        actor: Performer
        preconditions:
          - "BackupAssignment.status == OFFERED"
          - "acting Performer.id == candidate_performer_id"
          - "candidate_performer_id availability_status IN {AVAILABLE, ON_HOLD}"
        side_effects:
          - "increments BackupAssignment.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /backup-assignments/{id}/decline"
        actor: Performer
        preconditions:
          - "BackupAssignment.status == OFFERED"
          - "acting Performer.id == candidate_performer_id"
        side_effects:
          - "Performer(candidate_performer_id).reliability_score -= 5 (floored at 0) (cascade to Performer)"
          - "increments BackupAssignment.version by 1"
        note: "Decline returns the slot to the pool; operator may offer the next-ranked candidate (cycle)."
      - from: ACCEPTED
        to: PROMOTED
        trigger: "POST /bookings/{id}/promote-backup"
        actor: BookingAgent
        preconditions:
          - "BackupAssignment.status == ACCEPTED"
          - "owning Booking.status IN {CONFIRMED, PERFORMING}"
          - "this is the ACCEPTED BackupAssignment with the lowest rank for the booking"
        side_effects:
          - "Booking.active_performer_id -> candidate_performer_id (cascade to Booking)"
          - "former Performer(Booking.performer_id).availability_status -> AVAILABLE; reliability_score -= 10 (floored at 0) (cascade to Performer)"
          - "new Performer(candidate_performer_id).availability_status -> BOOKED (cascade to Performer)"
          - "all other OFFERED/ACCEPTED BackupAssignment on this booking -> EXPIRED (cascade to BackupAssignment)"
          - "increments BackupAssignment.version by 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "cascade from booking cancel or a peer backup being PROMOTED"
        actor: system
        preconditions:
          - "BackupAssignment.status IN {OFFERED, ACCEPTED}"
        side_effects:
          - "increments BackupAssignment.version by 1"

  - note: "SongRequest is a flat accept/conflict machine (no lifecycle revert)."
    entity: SongRequest
    initial_state: ACCEPTED
    terminal_states: [CONFLICTED]
    transitions:
      - from: ACCEPTED
        to: CONFLICTED
        trigger: "system, on create of a REQUEST whose (title, artist) matches an existing DO_NOT_PLAY on the same booking"
        actor: system
        preconditions:
          - "SongRequest.list_type == REQUEST"
          - "an existing DO_NOT_PLAY SongRequest on same booking has matching (lowercased title, lowercased artist)"
        side_effects:
          - "new SongRequest.status set to CONFLICTED at create"
          - "increments SongRequest.version by 1"

# ===========================================================================
# §1.2.1 CONCURRENCY RULES
# ===========================================================================
concurrency_rules:
  - rule_id: backup-promote-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /bookings/{id}/promote-backup"
    occ_field: "expected_booking_version"
    description: |
      Promoting a backup performer against a Booking whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another operator has already promoted a different backup (which legitimately
      reassigns active_performer_id and expires peer backups), leaving the current
      operator's view of the booking stale.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

  - rule_id: issue-contract-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /bookings/{id}/issue-contract"
    occ_field: "expected_booking_version"
    description: |
      Issuing a new contract against a Booking whose version has advanced since
      the client last observed it is rejected. A prior issue-contract on the same
      booking legitimately creates a new ContractDocument revision and supersedes
      the previous one, advancing the booking version; the second issue request
      then carries a stale version and must fail.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

# ===========================================================================
# §1.3 CALCULATION RULES TABLE
# ===========================================================================
calculations:
  - name: travel_fee
    trigger: "during booking_quote_total at HOLD"
    algorithm: threshold
    formula: |
      # event in performer home zone => no travel fee
      if event_zone_id == performer.home_zone_id:
          travel_raw = 0
      else:
          zone = TravelZone(event_zone_id)
          travel_raw = zone.base_travel_fee_cents + zone.per_mile_fee_cents * event_miles_from_home
      # surge applied on the zone travel subtotal, basis points
      travel_fee_cents = round_half_up(travel_raw * zone.surge_multiplier_bps / 10000)
      # if home zone, surge is irrelevant (travel_raw == 0 -> 0)
    input_set: "Single Booking + its event TravelZone + its Performer.home_zone_id"
    constants:
      BPS_DENOM: 10000
    precision: "integer cents, round_half_up on the surge multiplication"
    variants:
      - name: home_zone_waiver
        when: "event_zone_id == performer.home_zone_id"
        difference: "travel_fee_cents is exactly 0 regardless of event_miles_from_home or surge"

  - name: booking_quote_total
    trigger: "Booking INQUIRY->HOLD (POST /bookings/{id}/hold)"
    algorithm: aggregation
    formula: |
      set_rate      = performer.base_set_rate_cents
      package_fee   = package.flat_package_fee_cents
      # sum of unit_fee_cents over EquipmentItem rows whose package_id == booking.package_id
      equipment_fee = sum(e.unit_fee_cents for e in EquipmentItem where e.package_id == package.id)
      travel        = travel_fee(booking)                  # see travel_fee calculation
      quote_total_cents = set_rate + package_fee + equipment_fee + travel
      # overtime is NOT included in the quote; it is realized only at PERFORMED
    input_set: "Performer.base_set_rate_cents + PackageOffering.flat_package_fee_cents + all EquipmentItem for the package + travel_fee output"
    constants: {}
    precision: "integer cents, exact (sum of integer cents); evaluation order pinned: equipment summed first, then travel added"
    variants:
      - name: quote_provisional
        when: "computed at HOLD / re-issued contract; excludes overtime"
        difference: "uses contracted_set_minutes only; overtime_cents = 0 in the quote"

  - name: overtime_charge
    trigger: "Booking PERFORMING->PERFORMED (POST /bookings/{id}/complete-set)"
    algorithm: threshold
    formula: |
      extra_minutes = max(0, actual_set_minutes - contracted_set_minutes)
      # billed per STARTED 15-minute block (ceil); 0 extra minutes => 0 blocks
      blocks = ceil(extra_minutes / 15)
      overtime_cents = blocks * performer.overtime_rate_cents_per_15min
      final_total_cents = quote_total_cents + overtime_cents
    input_set: "Booking.actual_set_minutes, Booking.contracted_set_minutes, Performer.overtime_rate_cents_per_15min, Booking.quote_total_cents"
    constants:
      BLOCK_MINUTES: 15
    precision: "integer cents; blocks via ceil (every started block bills in full); boundary: exactly contracted_set_minutes => 0 blocks; contracted+1 => 1 block"
    variants:
      - name: final_realized
        when: "computed at PERFORMED with realized actual_set_minutes"
        difference: "this is the FINAL variant vs booking_quote_total's PROVISIONAL variant; same booking, but final_total adds overtime the quote omitted"

  - name: cancellation_fee
    trigger: "Booking *->CANCELLED (POST /bookings/{id}/cancel)"
    algorithm: tiered_pricing
    formula: |
      lead_days = floor((event_start_utc - current_clock_utc) / 86400 seconds)
      base = quote_total_cents
      # tier boundaries on lead_days; fee is a fraction of base in basis points
      if lead_days >= 30:        fee_bps = 1000     # 10%
      elif lead_days >= 14:      fee_bps = 2500     # 25%
      elif lead_days >= 7:       fee_bps = 5000     # 50%
      else:                      fee_bps = 10000    # 100% (within 7 days or past)
      # CONFIRMED bookings carry a +1000 bps (10pp) surcharge on the tier
      if booking.status == CONFIRMED:
          fee_bps = min(10000, fee_bps + 1000)
      cancellation_fee_cents = round_half_up(base * fee_bps / 10000)
    input_set: "Booking.quote_total_cents, Booking.event_start_utc, current clock, Booking.status at cancel time"
    constants:
      BPS_DENOM: 10000
      CONFIRMED_SURCHARGE_BPS: 1000
    precision: "integer cents, round_half_up; lead_days via floor of whole UTC days; boundary inclusive at >= (lead_days==30 => 10% tier, ==29 => 25% tier)"
    variants:
      - name: confirmed_surcharge
        when: "booking.status == CONFIRMED at cancel time"
        difference: "adds 1000 bps to the lead-time tier (capped at 10000) vs the same lead time on a HOLD/CONTRACT_SENT booking"

  - name: backup_promotion_selector
    trigger: "POST /bookings/{id}/promote-backup (selecting which ACCEPTED backup is eligible)"
    algorithm: weighted_scoring
    formula: |
      candidates = BackupAssignment where booking_id == booking.id AND status == ACCEPTED
      if candidates is empty:
          reject with ERR_NO_ELIGIBLE_BACKUP
      # eligibility filter then ranking
      # rank ASC is primary sort key (operator fallback order)
      # tie-break: candidate Performer.reliability_score DESC
      # final tie-break: BackupAssignment.created_at ASC (never id)
      chosen = sort(candidates, key=(rank ASC, performer.reliability_score DESC, created_at ASC))[0]
    input_set: "ACCEPTED BackupAssignment rows for the booking + their candidate Performer.reliability_score"
    constants: {}
    precision: "deterministic ordering; created_at ASC final tie-break, never id"
    variants:
      - name: lowest_rank_wins
        when: "multiple ACCEPTED backups exist"
        difference: "the promote endpoint may target a specific assignment id, but only the lowest-rank ACCEPTED one is eligible; targeting a higher-rank one fails ERR_NOT_LOWEST_RANK_BACKUP"

  - name: deposit_required
    trigger: "Booking INQUIRY->HOLD"
    algorithm: threshold
    formula: |
      deposit_required_cents = round_half_up(quote_total_cents * package.deposit_pct_bps / 10000)
    input_set: "Booking.quote_total_cents + PackageOffering.deposit_pct_bps"
    constants:
      BPS_DENOM: 10000
    precision: "integer cents, round_half_up"

# ===========================================================================
# §1.4 VALIDATION RULES TABLE (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity-backed ownership endpoints, X-User-ID matches the owning entity id (Client owns booking; Performer is the candidate; etc.)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints (sign, decline-contract, request-revision, song-request create, backup accept/decline, client-initiated cancel)"

  - priority: 4
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "All body FK references (client_id, performer_id, package_id, event_zone_id, booking_id, candidate_performer_id) resolve to existing rows"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints carrying FK fields"

  - priority: 6
    category: business_constraint
    check: "Required input fields present and well-typed; enum values valid; integers within declared bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 7
    category: business_referential
    check: "Selected PackageOffering.status == ACTIVE at booking create"
    error_id: ERR_PACKAGE_RETIRED
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: state
    check: "OCC: expected_booking_version equals current Booking.version on issue-contract and promote-backup"
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
    applies_to: "POST /bookings/{id}/issue-contract, POST /bookings/{id}/promote-backup"

  - priority: 10
    category: business_temporal
    check: "event_start_utc strictly in the future at booking create"
    error_id: ERR_EVENT_IN_PAST
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 11
    category: business_temporal
    check: "On HOLD, event_start_utc does not fall within any BlackoutWindow [start_utc, end_utc) of the performer"
    error_id: ERR_PERFORMER_BLACKED_OUT
    http_status: 409
    applies_to: "POST /bookings/{id}/hold"

  - priority: 12
    category: business_temporal
    check: "On HOLD, the booking's set window does not overlap another non-terminal booking of the same active performer per the booking-vs-booking overlap rule (closed-buffer semantics)"
    error_id: ERR_PERFORMER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /bookings/{id}/hold"

  - priority: 13
    category: business_temporal
    check: "A new BlackoutWindow must not overlap (half-open [start,end) semantics) an existing BlackoutWindow of the same performer"
    error_id: ERR_BLACKOUT_OVERLAP
    http_status: 409
    applies_to: "POST /performers/{id}/blackouts"

  - priority: 14
    category: business_constraint
    check: "contracted_set_minutes >= package.included_set_minutes"
    error_id: ERR_SET_TOO_SHORT
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 15
    category: business_constraint
    check: "On promote-backup, the targeted assignment is the lowest-rank ACCEPTED backup for the booking"
    error_id: ERR_NOT_LOWEST_RANK_BACKUP
    http_status: 409
    applies_to: "POST /bookings/{id}/promote-backup"

  - priority: 16
    category: business_constraint
    check: "On promote-backup, at least one ACCEPTED BackupAssignment exists for the booking"
    error_id: ERR_NO_ELIGIBLE_BACKUP
    http_status: 409
    applies_to: "POST /bookings/{id}/promote-backup"

  - priority: 17
    category: business_constraint
    check: "A backup candidate cannot be the booking's current active performer"
    error_id: ERR_BACKUP_IS_PRIMARY
    http_status: 409
    applies_to: "POST /bookings/{id}/backup-assignments"

  - priority: 18
    category: business_fiscal
    check: "On capture, the captured amount does not exceed the outstanding balance_due_cents for the booking"
    error_id: ERR_OVERPAYMENT
    http_status: 409
    applies_to: "POST /payments/{id}/capture"

  - priority: 19
    category: business_fiscal
    check: "On settle, balance_due_cents <= 0 (final balance fully covered)"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 409
    applies_to: "POST /bookings/{id}/settle"

  - priority: 20
    category: business_constraint
    check: "Cannot void a PaymentRecord whose capture_status is already CAPTURED or VOID"
    error_id: ERR_PAYMENT_NOT_VOIDABLE
    http_status: 409
    applies_to: "POST /payments/{id}/void"

  - priority: 21
    category: business_constraint
    check: "Pagination limit is within [1,100] and offset >= 0 on list endpoints (this is the only check that fires on list GETs, so no priority conflict with the rules above)"
    error_id: ERR_VALIDATION_LIMIT
    http_status: 422
    applies_to: "all GET list endpoints"

# ===========================================================================
# §1.5 API ENDPOINT TABLE
# ===========================================================================
endpoints:
  # ---- Configuration: TravelZone ----
  - method: POST
    path: "/travel-zones"
    description: "Create a travel zone"
    roles: [StudioAdmin]
    code: 201
    input: [zone_code, name, base_travel_fee_cents, per_mile_fee_cents, "surge_multiplier_bps?"]
    output: TravelZone
    side_effects: []
  - method: GET
    path: "/travel-zones/{id}"
    description: "Read a travel zone"
    roles: [StudioAdmin, BookingAgent, Performer, Client]
    code: 200
    input: []
    output: TravelZone
    side_effects: []

  # ---- Configuration: PackageOffering + EquipmentItem ----
  - method: POST
    path: "/packages"
    description: "Create a package offering"
    roles: [StudioAdmin]
    code: 201
    input: [name, tier, flat_package_fee_cents, included_set_minutes, "deposit_pct_bps?"]
    output: PackageOffering
    side_effects: []
  - method: GET
    path: "/packages/{id}"
    description: "Read a package"
    roles: [StudioAdmin, BookingAgent, Performer, Client]
    code: 200
    input: []
    output: PackageOffering
    side_effects: []
  - method: POST
    path: "/packages/{id}/retire"
    description: "Retire a package so it can no longer back new bookings"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: PackageOffering
    side_effects: ["PackageOffering.status -> RETIRED"]
  - method: POST
    path: "/packages/{id}/equipment"
    description: "Add an equipment line item to a package"
    roles: [StudioAdmin]
    code: 201
    input: [category, label, unit_fee_cents, "requires_power_circuits?"]
    output: EquipmentItem
    side_effects: []
  - method: GET
    path: "/packages/{id}/equipment"
    description: "List equipment items for a package (FK reverse-reachability for EquipmentItem.package_id)"
    roles: [StudioAdmin, BookingAgent, Performer, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: EquipmentItem[]
    side_effects: []

  # ---- Performer ----
  - method: POST
    path: "/performers"
    description: "Create a performer / act"
    roles: [StudioAdmin]
    code: 201
    input: [stage_name, act_type, genre, home_zone_id, base_set_rate_cents, overtime_rate_cents_per_15min]
    output: Performer
    side_effects: []
  - method: GET
    path: "/performers/{id}"
    description: "Read a performer"
    roles: [StudioAdmin, BookingAgent, Performer, Client]
    code: 200
    input: []
    output: Performer
    side_effects: []
  - method: GET
    path: "/performers"
    description: "List performers, filterable by home_zone_id and act_type and availability_status"
    roles: [StudioAdmin, BookingAgent, Performer, Client]
    code: 200
    input: ["home_zone_id?", "act_type?", "availability_status?", "limit?", "offset?"]
    output: Performer[]
    side_effects: []
  - method: POST
    path: "/performers/{id}/deactivate"
    description: "Mark a performer INACTIVE (roster removal)"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: Performer
    side_effects: ["Performer.availability_status -> INACTIVE"]
  - method: POST
    path: "/performers/{id}/blackouts"
    description: "Create an unavailability window for a performer"
    roles: [StudioAdmin, Performer]
    code: 201
    input: [start_utc, end_utc, "reason?"]
    output: BlackoutWindow
    side_effects: []
  - method: GET
    path: "/performers/{id}/blackouts"
    description: "List blackout windows for a performer (FK reverse-reachability for BlackoutWindow.performer_id)"
    roles: [StudioAdmin, BookingAgent, Performer]
    code: 200
    input: ["limit?", "offset?"]
    output: BlackoutWindow[]
    side_effects: []

  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Register a client"
    roles: [StudioAdmin, BookingAgent]
    code: 201
    input: [full_name, email, "phone?"]
    output: Client
    side_effects: []
  - method: GET
    path: "/clients/{id}"
    description: "Read a client"
    roles: [StudioAdmin, BookingAgent, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  # ---- Booking core ----
  - method: POST
    path: "/bookings"
    description: "Create a booking inquiry"
    roles: [BookingAgent]
    code: 201
    input: [client_id, performer_id, package_id, event_zone_id, event_start_utc, event_miles_from_home, "contracted_set_minutes?"]
    output: Booking
    side_effects: ["Booking created in INQUIRY; active_performer_id = null"]
  - method: GET
    path: "/bookings/{id}"
    description: "Read a booking with all computed totals"
    roles: [StudioAdmin, BookingAgent, Performer, Client]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/bookings"
    description: "List bookings, filterable by client_id, performer_id, active_performer_id, package_id, event_zone_id, status"
    roles: [StudioAdmin, BookingAgent, Performer, Client]
    code: 200
    input: ["client_id?", "performer_id?", "active_performer_id?", "package_id?", "event_zone_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: POST
    path: "/bookings/{id}/hold"
    description: "Place a hold; computes quote, deposit, sets active performer, holds the performer"
    roles: [BookingAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["compute quote_total_cents", "compute deposit_required_cents", "Performer -> ON_HOLD", "Booking -> HOLD"]
  - method: POST
    path: "/bookings/{id}/issue-contract"
    description: "Issue (or re-issue) a contract document for the booking"
    roles: [BookingAgent]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects: ["create ContractDocument (ISSUED)", "supersede prior ISSUED contract when re-issuing", "Booking -> CONTRACT_SENT", "increments Booking.version by 1"]
  - method: POST
    path: "/bookings/{id}/request-revision"
    description: "Client requests a contract revision, moving booking to NEGOTIATING"
    roles: [Client]
    code: 200
    input: []
    output: Booking
    side_effects: ["current ContractDocument -> DECLINED", "Booking -> NEGOTIATING"]
  - method: POST
    path: "/bookings/{id}/start-set"
    description: "Mark the set as started"
    roles: [BookingAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["Booking -> PERFORMING"]
  - method: POST
    path: "/bookings/{id}/complete-set"
    description: "Complete the set, supplying actual minutes; computes overtime and final total"
    roles: [BookingAgent]
    code: 200
    input: [actual_set_minutes]
    output: Booking
    side_effects: ["compute overtime_cents", "compute final_total_cents", "Performer -> AVAILABLE", "Performer.lifetime_completed_sets += 1", "Booking -> PERFORMED"]
  - method: POST
    path: "/bookings/{id}/settle"
    description: "Settle a fully-paid performed booking"
    roles: [BookingAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["all UNSETTLED CAPTURED PaymentRecord -> SETTLED", "Booking -> SETTLED"]
  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a booking; computes cancellation fee, refunds the balance, reverts performer + contracts + backups"
    roles: [BookingAgent, Client]
    code: 200
    input: []
    output: Booking
    side_effects: ["compute cancellation_fee_cents", "refund CAPTURED payments (REFUNDED, store credit if routed)", "ContractDocument -> DECLINED", "BackupAssignment -> EXPIRED", "Performer -> AVAILABLE", "Booking -> CANCELLED"]
  - method: POST
    path: "/bookings/{id}/promote-backup"
    description: "Promote the lowest-rank ACCEPTED backup to active performer"
    roles: [BookingAgent]
    code: 200
    input: [backup_assignment_id, expected_booking_version]
    output: Booking
    side_effects: ["BackupAssignment -> PROMOTED", "Booking.active_performer_id -> backup", "former performer -> AVAILABLE, reliability_score -= 10", "new performer -> BOOKED", "peer backups -> EXPIRED", "increments Booking.version by 1"]

  # ---- Contracts ----
  - method: GET
    path: "/contracts/{id}"
    description: "Read a contract document"
    roles: [StudioAdmin, BookingAgent, Client]
    code: 200
    input: []
    output: ContractDocument
    side_effects: []
  - method: GET
    path: "/bookings/{id}/contracts"
    description: "List contract documents for a booking (FK reverse-reachability for ContractDocument.booking_id)"
    roles: [StudioAdmin, BookingAgent, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: ContractDocument[]
    side_effects: []
  - method: POST
    path: "/contracts/{id}/sign"
    description: "Client signs an issued contract"
    roles: [Client]
    code: 200
    input: []
    output: ContractDocument
    side_effects: ["ContractDocument -> SIGNED"]
  - method: POST
    path: "/contracts/{id}/decline"
    description: "Client declines an issued contract"
    roles: [Client]
    code: 200
    input: []
    output: ContractDocument
    side_effects: ["ContractDocument -> DECLINED"]

  # ---- Payments ----
  - method: POST
    path: "/payments"
    description: "Authorize a payment against a booking"
    roles: [BookingAgent, Client]
    code: 201
    input: [booking_id, kind, amount_cents, "refund_destination?"]
    output: PaymentRecord
    side_effects: ["PaymentRecord created AUTHORIZED/UNSETTLED"]
  - method: GET
    path: "/payments/{id}"
    description: "Read a payment record"
    roles: [StudioAdmin, BookingAgent, Client]
    code: 200
    input: []
    output: PaymentRecord
    side_effects: []
  - method: GET
    path: "/bookings/{id}/payments"
    description: "List payment records for a booking (FK reverse-reachability for PaymentRecord.booking_id)"
    roles: [StudioAdmin, BookingAgent, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: PaymentRecord[]
    side_effects: []
  - method: POST
    path: "/payments/{id}/capture"
    description: "Capture an authorized payment; may auto-confirm the booking when deposit threshold is met"
    roles: [BookingAgent, Client]
    code: 200
    input: []
    output: PaymentRecord
    side_effects: ["capture_status -> CAPTURED", "recompute Booking.amount_paid_cents/balance_due_cents", "auto CONTRACT_SENT->CONFIRMED when deposit threshold met"]
  - method: POST
    path: "/payments/{id}/void"
    description: "Void an authorized (not yet captured) payment"
    roles: [BookingAgent]
    code: 200
    input: []
    output: PaymentRecord
    side_effects: ["capture_status -> VOID"]

  # ---- Song requests / do-not-play ----
  - method: POST
    path: "/bookings/{id}/song-requests"
    description: "Add a song request or do-not-play entry; REQUEST colliding with a DO_NOT_PLAY is recorded CONFLICTED"
    roles: [Client, BookingAgent]
    code: 201
    input: [title, "artist?", list_type, "priority?"]
    output: SongRequest
    side_effects: ["SongRequest created ACCEPTED or CONFLICTED"]
  - method: GET
    path: "/bookings/{id}/song-requests"
    description: "List song requests for a booking (FK reverse-reachability for SongRequest.booking_id)"
    roles: [StudioAdmin, BookingAgent, Performer, Client]
    code: 200
    input: ["list_type?", "limit?", "offset?"]
    output: SongRequest[]
    side_effects: []
  - method: GET
    path: "/song-requests/{id}"
    description: "Read a single song request"
    roles: [StudioAdmin, BookingAgent, Performer, Client]
    code: 200
    input: []
    output: SongRequest
    side_effects: []

  # ---- Backup assignments ----
  - method: POST
    path: "/bookings/{id}/backup-assignments"
    description: "Offer a backup slot to a candidate performer"
    roles: [BookingAgent]
    code: 201
    input: [candidate_performer_id, rank]
    output: BackupAssignment
    side_effects: ["BackupAssignment created OFFERED"]
  - method: GET
    path: "/bookings/{id}/backup-assignments"
    description: "List backup assignments for a booking (FK reverse-reachability for BackupAssignment.booking_id)"
    roles: [StudioAdmin, BookingAgent, Performer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BackupAssignment[]
    side_effects: []
  - method: GET
    path: "/backup-assignments/{id}"
    description: "Read a single backup assignment"
    roles: [StudioAdmin, BookingAgent, Performer]
    code: 200
    input: []
    output: BackupAssignment
    side_effects: []
  - method: POST
    path: "/backup-assignments/{id}/accept"
    description: "Candidate performer accepts a backup offer"
    roles: [Performer]
    code: 200
    input: []
    output: BackupAssignment
    side_effects: ["BackupAssignment -> ACCEPTED"]
  - method: POST
    path: "/backup-assignments/{id}/decline"
    description: "Candidate performer declines a backup offer; reliability score drops"
    roles: [Performer]
    code: 200
    input: []
    output: BackupAssignment
    side_effects: ["BackupAssignment -> DECLINED", "Performer.reliability_score -= 5"]

  # ---- backup-assignments filtered list by candidate (FK reverse-reachability for candidate_performer_id) ----
  - method: GET
    path: "/backup-assignments"
    description: "List backup assignments filterable by candidate_performer_id and booking_id (FK reverse-reachability)"
    roles: [StudioAdmin, BookingAgent, Performer]
    code: 200
    input: ["candidate_performer_id?", "booking_id?", "status?", "limit?", "offset?"]
    output: BackupAssignment[]
    side_effects: []

  # ---- Test-driving clock endpoint ----
  - method: POST
    path: "/_clock/set"
    description: "Set the server's current UTC clock (test-driving endpoint for temporal logic)"
    roles: [StudioAdmin]
    code: 200
    input: [now_utc]
    output: null
    side_effects: ["server clock set to now_utc for all future time comparisons"]

# ===========================================================================
# §1.6 ERROR CODE CATALOG
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Entity-backed actor is not the owner of the targeted resource (e.g., Client signing another client's contract)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "A body FK reference does not resolve to an existing row"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad type, invalid enum value, or out-of-range integer"
  - id: ERR_PACKAGE_RETIRED
    http: 409
    condition: "Booking create references a RETIRED package"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state"
  - id: ERR_STALE_BOOKING_VERSION
    http: 412
    condition: "expected_booking_version does not equal the booking's current version (OCC)"
  - id: ERR_EVENT_IN_PAST
    http: 422
    condition: "event_start_utc is not strictly in the future at booking create"
  - id: ERR_PERFORMER_BLACKED_OUT
    http: 409
    condition: "event_start_utc falls inside a performer BlackoutWindow at HOLD"
  - id: ERR_PERFORMER_DOUBLE_BOOKED
    http: 409
    condition: "Set window overlaps another non-terminal booking of the same active performer at HOLD"
  - id: ERR_BLACKOUT_OVERLAP
    http: 409
    condition: "New BlackoutWindow overlaps an existing window of the same performer (half-open semantics)"
  - id: ERR_SET_TOO_SHORT
    http: 422
    condition: "contracted_set_minutes is below the package's included_set_minutes"
  - id: ERR_NOT_LOWEST_RANK_BACKUP
    http: 409
    condition: "promote-backup targets an ACCEPTED backup that is not the lowest-rank eligible one"
  - id: ERR_NO_ELIGIBLE_BACKUP
    http: 409
    condition: "promote-backup attempted with no ACCEPTED BackupAssignment on the booking"
  - id: ERR_BACKUP_IS_PRIMARY
    http: 409
    condition: "A backup candidate equals the booking's current active performer"
  - id: ERR_OVERPAYMENT
    http: 409
    condition: "Captured amount exceeds the outstanding balance_due_cents"
  - id: ERR_BALANCE_OUTSTANDING
    http: 409
    condition: "settle attempted while balance_due_cents > 0"
  - id: ERR_PAYMENT_NOT_VOIDABLE
    http: 409
    condition: "void attempted on a CAPTURED or already-VOID payment"
  - id: ERR_VALIDATION_LIMIT
    http: 422
    condition: "Pagination limit/offset out of the [1,100] / [0,inf) bounds"

# ===========================================================================
# §1.7 RBAC MATRIX
# ===========================================================================
roles:
  - name: StudioAdmin
    description: "Operator who configures packages, equipment, travel zones, performers, the clock, and roster status"
    identity: "opaque"
    exclusive_operations:
      - "POST /travel-zones"
      - "POST /packages"
      - "POST /packages/{id}/retire"
      - "POST /packages/{id}/equipment"
      - "POST /performers"
      - "POST /performers/{id}/deactivate"
      - "POST /_clock/set"
    shared_operations:
      - "POST /clients (with BookingAgent)"
      - "POST /performers/{id}/blackouts (with Performer)"
      - "GET reads across configuration, performers, clients, bookings, contracts, payments, backups"

  - name: BookingAgent
    description: "Studio booking operator who drives the booking lifecycle, payments, and backup orchestration"
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings"
      - "POST /bookings/{id}/hold"
      - "POST /bookings/{id}/issue-contract"
      - "POST /bookings/{id}/start-set"
      - "POST /bookings/{id}/complete-set"
      - "POST /bookings/{id}/settle"
      - "POST /bookings/{id}/promote-backup"
      - "POST /bookings/{id}/backup-assignments"
      - "POST /payments/{id}/void"
    shared_operations:
      - "POST /clients (with StudioAdmin)"
      - "POST /bookings/{id}/cancel (with Client)"
      - "POST /payments (with Client)"
      - "POST /payments/{id}/capture (with Client)"
      - "POST /bookings/{id}/song-requests (with Client)"
      - "GET reads"

  - name: Performer
    description: "Act/DJ acting as the entity behind a Performer row; manages own blackouts and responds to backup offers"
    identity: "entity_backed:Performer"
    exclusive_operations:
      - "POST /backup-assignments/{id}/accept"
      - "POST /backup-assignments/{id}/decline"
    shared_operations:
      - "POST /performers/{id}/blackouts (with StudioAdmin, only own performer_id)"
      - "GET reads on own performer, bookings, backups, song requests"

  - name: Client
    description: "Booking client acting as the entity behind a Client row; signs/declines contracts, pays, requests revisions and songs, may cancel own booking"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /contracts/{id}/sign"
      - "POST /contracts/{id}/decline"
      - "POST /bookings/{id}/request-revision"
    shared_operations:
      - "POST /bookings/{id}/cancel (with BookingAgent, only own booking)"
      - "POST /payments (with BookingAgent, only own booking)"
      - "POST /payments/{id}/capture (with BookingAgent)"
      - "POST /bookings/{id}/song-requests (with BookingAgent, only own booking)"
      - "GET reads on own bookings, contracts, payments, song requests"
