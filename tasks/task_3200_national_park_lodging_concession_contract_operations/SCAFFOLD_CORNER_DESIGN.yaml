  # ===========================================================================
  - section: validations
    instances:
      - name: auth_missing_header_beats_everything
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request without X-User-Role to a path with a nonexistent contract id returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER — auth precedes even existence."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *en_clock
          trigger:
            - call: "GET /contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not 404)"

      - name: role_check_precedes_state_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=6]
        distinguishing_aspect: "A ConcessionerRateManager attempting to activate an already-ACTIVE contract gets 403 ERR_INSUFFICIENT_PERMISSIONS, not the 409 state error — authorization (priority 2) precedes state (priority 6)."
        test_recipe:
          setup:
            - "ACTIVE contract (already activated once by the ops manager)."
          setup_api_calls:
            - *en_clock
            - *df_contract
            - *df_l1
            - *df_l2
            - *df_l3
            - *df_l4
            - *df_season
            - *df_activate
          trigger:
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: ConcessionerRateManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_INSUFFICIENT_PERMISSIONS (state error never evaluated)"

      - name: existence_check_validates_path_left_to_right
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
        distinguishing_aspect: "GET on a bad contract id AND a bad filing id under it reports ERR_CONTRACT_NOT_FOUND — the leftmost path segment fails first."
        test_recipe:
          setup:
            - "One contract exists."
          setup_api_calls:
            - *en_clock
            - *en_contract
          trigger:
            - call: "GET /contracts/00000000-0000-4000-8000-000000000000/rate-filings/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: AgencyRateAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_CONTRACT_NOT_FOUND (not ERR_FILING_NOT_FOUND)"

      - name: duplicate_period_report_rejected_for_same_line
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors.ERR_DUPLICATE_PERIOD_REPORT
        distinguishing_aspect: "After LODGING 2027-07 is ACCEPTED, a second report for the same (service_line_id, period_month) is rejected 409 ERR_DUPLICATE_PERIOD_REPORT even though a FOOD report for 2027-07 is fine."
        test_recipe:
          setup:
            - "ACTIVE contract; LODGING 2027-07 report ACCEPTED."
          setup_api_calls:
            - *en_clock
            - *sp_contract
            - *sp_l1
            - *sp_l2
            - *sp_l3
            - *sp_l4
            - *sp_season
            - *sp_act
            - *sp_getc
            - *sp_rep
            - *sp_sub
            - *sp_acc
          trigger:
            - call: "POST /contracts/${c_id}/receipts-reports"
              payload: { period_month: "2027-07", service_line_id: "${sl_l}", gross_receipts_cents: 21000, expected_contract_version: "${c_v2}" }
              as: ConcessionerAccountant
              captures: { err: $.data.error_id }
            - call: "POST /contracts/${c_id}/receipts-reports"
              payload: { period_month: "2027-07", service_line_id: "${sl_f}", gross_receipts_cents: 9000, expected_contract_version: "${c_v2}" }
              as: ConcessionerAccountant
              captures: { rep_food: $.data.id }
          assert:
            - "the duplicate-line create returns 409 ERR_DUPLICATE_PERIOD_REPORT"
            - "the FOOD line create succeeds (rep_food is non-null) — the uniqueness scope is (line, period), not period alone"

      - name: actual_headcount_mode_requires_beds_occupied
        claim_type: Conditional validation
        grounds:
          - entities.Reservation.fields.beds_occupied
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Conditional required field: occupancy_mode ACTUAL_HEADCOUNT without beds_occupied is 400 ERR_INVALID_REQUEST; the same payload with BANDED mode needs no beds_occupied."
        test_recipe:
          setup:
