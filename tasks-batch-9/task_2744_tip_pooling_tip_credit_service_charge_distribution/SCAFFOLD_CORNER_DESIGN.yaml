              payload: { location_id: "${loc_id}", business_date: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { pool_nofee_id: $.data.id }
            - call: "POST /shift-tip-pools/${pool_nofee_id}/distribute"
              payload: {}
              as: PayrollPreparer
          assert:
            - "the 2026-08-04 pool reports tip_pool_policy_id == ${policy_a_id}, contributing_shift_count == 2, total_contributed_cents == 2100 (1500 from the server's 10000 in tips and 600 from the bartender's 6000), cc_fee_deducted_cents == 365, net_pool_cents == 1735, total_share_weight == 18"
            - "365 == round_half_up(0.03 * 8000) + round_half_up(0.025 * 5000) == 240 + 125, each shift's fee rounded on its own charged tips"
            - "its allocations are 964 to the server (share_weight 10, remainder_cent_awarded true) and 771 to the bartender (share_weight 8, remainder_cent_awarded false), summing to 1735"
            - "GET /tip-pool-policies/${policy_a_id} reports status == SUPERSEDED after the fifth trigger call, and the already-created 2026-08-04 pool still names it"
            - "the 2026-08-05 pool reports tip_pool_policy_id == ${policy_b_id}, total_contributed_cents == 2100, cc_fee_deducted_cents == 0, net_pool_cents == 2100, total_share_weight == 18"
            - "its allocations are 1167 to the server (remainder_cent_awarded true) and 933 to the bartender, summing to 2100"
            - "the day-to-day deltas are 1167 - 964 == 203 and 933 - 771 == 162, and 203 + 162 == 365 == the fee the flag suppressed: no cent is lost to rounding in either direction"
            - "GET /shifts/${srv_d1_id} and GET /shifts/${srv_d2_id} both report pool_contribution_cents == 1500 and retained_tips_cents == 8500: the flag changes what leaves the pool, never what enters it"

      - name: applied_corrections_may_not_exceed_the_lines_wage_obligation
        claim_type: aggregate_validation
        grounds:
          - validations.priority_55
          - validations.priority_37
          - calculations.back_wage_correction_application
          - entities.PayLine.fields.minimum_wage_obligation_cents
        distinguishing_aspect: >-
          Every individual correction here is lawful — 3000, 2900 and 2800 are each far below the
          5800 obligation — but the ceiling is on their APPLIED sum, so the second apply fails at
          5900 while a 2800 replacement lands exactly on 5800. The replacement also has to name the
          superseded PENDING correction, because §1.4 priority 37 makes supersedes_correction_id
          mandatory once a PENDING correction exists on the line, and the VOIDED 2900 drops out of
          the period's total_correction_cents.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit with no ACTIVE policy."
            - "One SERVER employee with a notice acknowledged 2026-07-01 and one CLOSED and DECLARED 480-minute shift on 2026-08-04 declaring 5000 cash tips."
            - "The period was computed by op_prep_1 and approved by op_comp_1, leaving one FINAL PayLine with minimum_wage_obligation_cents 5800 and total_gross_cents 1704."
            - "op_comp_2 issued a 3000-cent POOL_SHARE_SHORTFALL correction and op_prep_9 applied it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_id: $.data.id }
            - call: "POST /shifts/${shift_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_id}/declare-tips"
              payload: { declared_cash_tips_cents: 5000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
            - call: "POST /pay-periods/${period_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
            - call: "GET /pay-lines?pay_period_id=${period_id}&status=FINAL"
              payload: {}
              as: ComplianceOfficer
              captures: { line_id: "$.data[0].id", line_v2: "$.data[0].version" }
            - call: "POST /back-wage-corrections"
              payload: { pay_line_id: "${line_id}", amount_cents: 3000, reason_code: "POOL_SHARE_SHORTFALL", expected_pay_line_version: "${line_v2}" }
              as: ComplianceOfficer
              as_user_id: "op_comp_2"
              captures: { corr1_id: $.data.id }
            - call: "POST /back-wage-corrections/${corr1_id}/apply"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_9"
            - call: "GET /pay-lines/${line_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { line_v4: $.data.version }
          trigger:
            - call: "POST /back-wage-corrections"
              payload: { pay_line_id: "${line_id}", amount_cents: 2900, reason_code: "POOL_SHARE_SHORTFALL", expected_pay_line_version: "${line_v4}" }
              as: ComplianceOfficer
              as_user_id: "op_comp_2"
              captures: { corr2_id: $.data.id }
            - call: "POST /back-wage-corrections/${corr2_id}/apply"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_9"
              captures: { err_id: $.data.error_id }
            - call: "GET /pay-lines/${line_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { line_v5: $.data.version }
            - call: "POST /back-wage-corrections"
              payload: { pay_line_id: "${line_id}", amount_cents: 2800, reason_code: "POOL_SHARE_SHORTFALL", expected_pay_line_version: "${line_v5}", supersedes_correction_id: "${corr2_id}" }
              as: ComplianceOfficer
              as_user_id: "op_comp_2"
              captures: { corr3_id: $.data.id }
            - call: "POST /back-wage-corrections/${corr3_id}/apply"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_9"
          assert:
            - "before the triggers the line reports minimum_wage_obligation_cents == 5800, correction_applied_cents == 3000, total_gross_cents == 4704, version == 4"
            - "the first trigger call returns HTTP 201: 2900 on its own is well under the 5800 obligation, so nothing is rejected at issue time"
            - "the second trigger call returns HTTP 409 with data.error_id == ERR_CORRECTION_EXCEEDS_OBLIGATION, because 3000 already applied plus 2900 is 5900"
            - "after that rejection the line is unchanged at correction_applied_cents == 3000, pending_correction_cents == 2900, total_gross_cents == 4704, version == 5, and GET /back-wage-corrections/${corr2_id} still reports status == PENDING"
            - "the fourth trigger call returns HTTP 201 and GET /back-wage-corrections/${corr2_id} now reports status == VOIDED, superseded by ${corr3_id}"
            - "the fifth trigger call returns HTTP 200 and the line reports correction_applied_cents == 5800, pending_correction_cents == 0, total_gross_cents == 7504, version == 7"
            - "5800 lands exactly on the obligation and is accepted: the ceiling is inclusive"
            - "GET /pay-periods/${period_id} reports total_correction_cents == 5800 == 3000 + 2800, the VOIDED 2900 excluded from the rollup"

      - name: compute_rejects_undeclared_shift_then_unallocatable_charge_then_succeeds
        claim_type: cascading_validation
        grounds:
          - validations.priority_35
          - validations.priority_36
          - calculations.service_charge_wages_allocation
          - calculations.pay_line_wage_computation
        distinguishing_aspect: >-
          Two compute-time preconditions in a forced order: the undeclared-shift check must clear
          before the service-charge allocability check can even be evaluated, since the allocation
          weights are the CLOSED shifts of the charge's business_date. The same compute call
          therefore returns three different outcomes as each blocker is cleared, and the successful
          run shows the $30 test biting on the employee who declared nothing — her whole 480
          minutes reprice at 725 (straight cash 5800) even though her SHIFT still records 480
          tip-credit-eligible minutes.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit with no ACTIVE policy, service charges treated as WAGES."
            - "Ana and Bea are SERVERs with notices acknowledged 2026-07-01."
            - "Ana worked a CLOSED 480-minute shift on 2026-08-04 and declared 5000 cash tips; Bea worked a CLOSED 480-minute shift the same day and has NOT declared."
            - "One RECORDED 6000-cent service charge sits on 2026-08-06, a date inside the period with no shifts at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_a_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Bea Olsen", external_payroll_ref: "E2", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_b_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_a_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_b_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_a_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_a_id: $.data.id }
            - call: "POST /shifts/${shift_a_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_a_id}/declare-tips"
              payload: { declared_cash_tips_cents: 5000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_a_id}"
            - call: "POST /shifts"
              payload: { employee_id: "${emp_b_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_b_id: $.data.id }
            - call: "POST /shifts/${shift_b_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /service-charges"
              payload: { location_id: "${loc_id}", business_date: "2026-08-06T00:00:00Z", amount_cents: 6000, description: "Thursday banquet" }
              as: PayrollPreparer
              captures: { charge_id: $.data.id }
          trigger:
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
              captures: { err_undeclared: $.data.error_id }
            - call: "POST /shifts/${shift_b_id}/declare-tips"
              payload: { declared_cash_tips_cents: 0, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_b_id}"
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
              captures: { err_charge: $.data.error_id }
            - call: "POST /service-charges/${charge_id}/void"
              payload: { reason: "no service occurred that day" }
              as: PayrollPreparer
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
          assert:
            - "the first trigger call returns HTTP 409 with data.error_id == ERR_UNDECLARED_SHIFT_IN_PERIOD and the period stays OPEN with compute_variant null"
            - "the third trigger call returns HTTP 409 with data.error_id == ERR_SERVICE_CHARGE_UNALLOCATABLE: the declaration blocker is gone and the next check in the chain now surfaces"
            - "the third call is NOT ERR_UNDECLARED_SHIFT_IN_PERIOD, proving the charge check is reached only after the declaration check clears"
            - "after each rejection GET /pay-lines?pay_period_id=${period_id} reports total_count == 0: a failed compute writes no lines"
            - "the fifth trigger call returns HTTP 200 with status == COMPUTED and compute_variant == WEEKLY_AGGREGATE"
            - "Ana's PayLine reports tip_credit_eligible_minutes == 480, straight_cash_cents == 1704, service_charge_wages_cents == 0, tipped_employee_qualified == true, tip_credit_cents == 4096, topup_cents == 0, total_gross_cents == 1704"
            - "Bea's PayLine reports tipped_employee_qualified == false (0 declared is below the 3000 monthly threshold), tip_credit_eligible_minutes == 0, non_tip_credit_minutes == 480, straight_cash_cents == 5800, tip_credit_cents == 0, topup_cents == 0, total_gross_cents == 5800"
            - "GET /shifts/${shift_b_id} still reports tip_credit_eligible_minutes == 480: the shift-level classification passed, only the line-level tipped-employee test failed"
            - "GET /pay-periods/${period_id} reports total_credited_minutes == 960, total_tip_credit_cents == 4096, total_topup_cents == 0, reported_tips_cents == 5000, allocation_shortfall_cents == 0"

      - name: higher_priority_state_error_beats_the_amount_error
        claim_type: priority_ordering
        grounds:
          - validations.priority_9
          - validations.priority_50
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / declare_tips_on_voided_shift_with_excess_charged_tips_returns_state_error
          rationale: "That §1.8 instance violates the state guard and the charged-tips ceiling in one call and asserts the lower-numbered state error wins, then clears it and asserts the amount error surfaces."

      - name: referential_error_beats_the_overlap_error
        claim_type: priority_conflict
        grounds:
          - validations.priority_31
          - validations.priority_38
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / create_shift_without_assignment_and_overlapping_interval_returns_referential_error
          rationale: "That §1.8 instance violates priority 31 and priority 38 simultaneously and asserts ERR_NO_ACTIVE_ROLE_ASSIGNMENT, the higher-priority rule, then fixes it to expose ERR_SHIFT_OVERLAP."

      - name: shift_creation_depends_on_the_periods_state
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_12
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / create_shift_into_computed_pay_period_returns_period_not_open
          rationale: "That §1.8 instance tests the same shift payload against an OPEN period (accepted) and a COMPUTED period (ERR_PAY_PERIOD_NOT_OPEN), which is the cross-entity valid/invalid pair."

      - name: pay_period_date_interval_conflicts
        claim_type: temporal_validation
        grounds:
          - validations.priority_39
          - validations.priority_43
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pay_period_inclusive_date_interval_rejects_any_shared_day
          rationale: "That §1.8 instance walks the inclusive interval boundaries, accepting a period that starts the day after another ends and rejecting one that shares a single day."

      - name: adjacent_shifts_are_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_38
        excluded_because:
          difficulty_instance: resource_temporal_overlap / shift_half_open_interval_allows_adjacency_rejects_intersection
          rationale: "That §1.8 instance asserts the satisfied case explicitly: a shift starting exactly when the previous one ends is created with HTTP 201, while a one-minute intersection is rejected."

      - name: compute_blocked_by_a_pending_pool
        claim_type: violation_to_error
        grounds:
          - validations.priority_18
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / compute_pay_period_with_pending_pool_returns_pool_not_distributed
          rationale: "That §1.8 instance triggers ERR_POOL_NOT_DISTRIBUTED from a live PENDING pool and then clears it by distributing, covering both the violation and its remedy."

  - section: endpoints
    instances:
      - name: role_assignment_crud_links_an_employee_to_two_jobs_and_derives_dual_job
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/role-assignments
          - endpoints.GET_/role-assignments/{role_assignment_id}
          - endpoints.GET_/role-assignments
          - entities.EmployeeRoleAssignment.fields.dual_job
          - validations.priority_40
        distinguishing_aspect: >-
          EmployeeRoleAssignment is the scaffold's cross-reference entity — it links an Employee to
          a JobRole — and its create/read/list triad carries the dual-jobs rule the scenario names.
          Two open-ended assignments for the same employee in DIFFERENT roles do NOT collide under
          §1.4 priority 40 (which is scoped to the same employee AND the same role), the derived
          dual_job flag flips on BOTH rows once the second exists, and each assignment
          independently authorises a shift in its own role on the same business date.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit with a SERVER role and a BARTENDER role and one employee, Ana, with no assignments yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "BARTENDER", title: "Bartender", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1000, pool_share_points: 8, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_bar_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
              captures: { asg_srv_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_bar_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: false }
              as: PayrollAdmin
              captures: { asg_bar_id: $.data.id }
            - call: "GET /role-assignments/${asg_srv_id}"
              payload: {}
              as: PayrollPreparer
            - call: "GET /role-assignments?employee_id=${emp_id}"
              payload: {}
              as: PayrollPreparer
            - call: "GET /role-assignments?employee_id=${emp_id}&job_role_id=${role_bar_id}"
              payload: {}
              as: PayrollPreparer
            - call: "GET /role-assignments?employee_id=${emp_id}&limit=1&offset=1"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_bar_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T08:00:00Z", end_at: "2026-08-04T16:00:00Z" }
              as: PayrollPreparer
              captures: { shift_bar_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_srv_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 201 with effective_to == null, is_primary == true, dual_job == false, version == 1, created_at == 2026-08-10T12:00:00.000Z"
            - "the second trigger call returns HTTP 201 and is NOT ERR_ASSIGNMENT_OVERLAP, because priority 40 is scoped to the same (employee_id, job_role_id) pair and this is a different role"
            - "after the second create GET /role-assignments/${asg_srv_id} reports dual_job == true: the derived flag on the FIRST row is re-evaluated when the intersecting second row appears"
            - "GET /role-assignments/${asg_bar_id} reports dual_job == true and is_primary == false"
            - "the third trigger call round-trips every stored field of ${asg_srv_id} unchanged"
            - "the fourth trigger call reports total_count == 2 and has_more == false"
            - "the fifth trigger call reports total_count == 1 with the single BARTENDER assignment"
            - "the sixth trigger call returns exactly one item with total_count == 2 and has_more == false, offset 1 of 2"
            - "both shift creations return HTTP 201: each assignment authorises work in its own role on 2026-08-04, and the two half-open intervals touch at 16:00 without triggering ERR_SHIFT_OVERLAP"
            - "GET /shifts/${shift_bar_id} reports job_role_id == ${role_bar_id} and GET /shifts/${shift_srv_id} reports job_role_id == ${role_server_id}"
            - "§1.5 declares no update and no delete endpoint for role assignments, so an assignment is corrected only by bounding it with effective_to at creation time"

      - name: pool_allocation_ledger_is_append_only_and_nets_to_zero_after_a_reversal
        claim_type: computed_read
        grounds:
          - endpoints.GET_/pool-allocations
          - endpoints.GET_/pool-allocations/{allocation_id}
          - entities.PoolAllocation
          - entities.Employee.fields.trailing_pool_receipts_cents
          - entities.ShiftTipPool.fields.distributed_cents
        distinguishing_aspect: >-
          The allocation ledger is the audit trail, so a reversal must append rather than delete:
          after reversing a distributed pool the ledger holds BOTH a +600 DISTRIBUTION row and a
          -600 REVERSAL row, the entry_type filter separates them, and every derived read — the
          pool's distributed_cents, the employee's trailing_pool_receipts_cents and the location's
          pending_pool_cents — is the net 0 rather than a deletion of history.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit with an ACTIVE TIPPED_ONLY / TIPS_RECEIVED_PCT / POINTS_ONLY policy, cc_fee_pass_through false."
            - "One SERVER employee with a CLOSED and DECLARED 480-minute shift on 2026-08-04 declaring 4000 cash tips."
            - "The 2026-08-04 pool was created (contribution 600) and DISTRIBUTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id, loc_version: $.data.version }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${loc_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "POINTS_ONLY", cc_fee_pass_through: false }
              as: PayrollAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /tip-pool-policies/${policy_id}/activate"
              payload: { expected_location_version: "${loc_version}" }
              as: ComplianceOfficer
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_id: $.data.id }
            - call: "POST /shifts/${shift_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_id}/declare-tips"
              payload: { declared_cash_tips_cents: 4000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /shift-tip-pools"
              payload: { location_id: "${loc_id}", business_date: "2026-08-04T00:00:00Z" }
              as: PayrollPreparer
              captures: { pool_id: $.data.id }
            - call: "POST /shift-tip-pools/${pool_id}/distribute"
              payload: {}
              as: PayrollPreparer
            - call: "GET /pool-allocations?shift_tip_pool_id=${pool_id}&entry_type=DISTRIBUTION"
              payload: {}
              as: PayrollPreparer
              captures: { alloc_id: "$.data[0].id" }
          trigger:
            - call: "POST /shift-tip-pools/${pool_id}/reverse"
              payload: { reason: "policy applied to the wrong trading day" }
              as: ComplianceOfficer
            - call: "GET /pool-allocations?shift_tip_pool_id=${pool_id}"
              payload: {}
              as: PayrollPreparer
            - call: "GET /pool-allocations?shift_tip_pool_id=${pool_id}&entry_type=REVERSAL"
              payload: {}
              as: PayrollPreparer
            - call: "GET /pool-allocations?employee_id=${emp_id}&business_date=2026-08-04T00:00:00Z"
              payload: {}
              as: PayrollPreparer
            - call: "GET /pool-allocations/${alloc_id}"
              payload: {}
              as: PayrollPreparer
          assert:
            - "before the reverse GET /pool-allocations?shift_tip_pool_id=${pool_id} reports total_count == 1 with allocated_cents == 600, entry_type == DISTRIBUTION, share_weight == 10, remainder_cent_awarded == false, shift_id == ${shift_id}, business_date == 2026-08-04T00:00:00.000Z"
            - "the second trigger call reports total_count == 2: the ledger grew rather than shrank"
            - "the third trigger call reports total_count == 1 with entry_type == REVERSAL and allocated_cents == -600, the exact negation"
            - "the fifth trigger call shows the original DISTRIBUTION row still carrying +600, unmutated by the reversal"
            - "the fourth trigger call reports total_count == 2, both rows carrying business_date 2026-08-04T00:00:00.000Z, so the ledger is queryable by employee and trading day"
            - "each row has only id and created_at as common fields: PoolAllocation declares common_fields false, so no version and no updated_at appear, and §1.5 declares no POST, PATCH or DELETE for /pool-allocations"
            - "GET /shift-tip-pools/${pool_id} reports distribution_status == REVERSED, distributed_cents == 0, reversed_at == 2026-08-10T12:00:00.000Z, while total_contributed_cents and net_pool_cents fall to 0 with contribution_status REVERSED"
            - "GET /employees/${emp_id} reports trailing_pool_receipts_cents == 0, the signed sum over both rows"
            - "GET /locations/${loc_id} reports pending_pool_cents == 0 and GET /shifts/${shift_id} reports shift_tip_pool_id == null with retained_tips_cents back to 4000"

      - name: voiding_a_pooled_shift_is_allowed_only_after_the_pool_is_reversed
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/shifts/{shift_id}/void
          - endpoints.POST_/shift-tip-pools/{pool_id}/reverse
          - validations.priority_10
          - state_machines.ShiftTipPool.contribution_status.CONTRIBUTED_to_REVERSED
        distinguishing_aspect: >-
          The void action is conditional on the pool, not on the shift: the identical call is a 409
          while the shift's tips are frozen into a live pool and a 200 the moment the pool is
          reversed. Reversing a pool that never distributed appends NO ledger rows — there is
          nothing to negate — yet still unwinds the contribution side and restores the shift's
          4000 cents of retained tips.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit with an ACTIVE TIPPED_ONLY / TIPS_RECEIVED_PCT / POINTS_ONLY policy, cc_fee_pass_through false."
            - "One SERVER employee with a CLOSED and DECLARED 480-minute shift on 2026-08-04 declaring 4000 cash tips."
            - "The 2026-08-04 pool was created and is CONTRIBUTED with distribution_status PENDING; it has never been distributed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id, loc_version: $.data.version }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${loc_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "POINTS_ONLY", cc_fee_pass_through: false }
              as: PayrollAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /tip-pool-policies/${policy_id}/activate"
              payload: { expected_location_version: "${loc_version}" }
              as: ComplianceOfficer
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_id: $.data.id }
            - call: "POST /shifts/${shift_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_id}/declare-tips"
              payload: { declared_cash_tips_cents: 4000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /shift-tip-pools"
              payload: { location_id: "${loc_id}", business_date: "2026-08-04T00:00:00Z" }
              as: PayrollPreparer
              captures: { pool_id: $.data.id }
          trigger:
            - call: "POST /shifts/${shift_id}/void"
              payload: { reason: "duplicate punch" }
              as: PayrollPreparer
              captures: { err_id: $.data.error_id }
            - call: "POST /shift-tip-pools/${pool_id}/reverse"
              payload: { reason: "unwinding the day to correct a duplicate punch" }
              as: ComplianceOfficer
            - call: "POST /shifts/${shift_id}/void"
              payload: { reason: "duplicate punch" }
              as: PayrollPreparer
          assert:
            - "the first trigger call returns HTTP 409 with data.error_id == ERR_SHIFT_ALREADY_POOLED and the shift stays CLOSED with retained_tips_cents 3400"
            - "the second trigger call returns HTTP 200 with contribution_status == REVERSED, distribution_status still PENDING, total_contributed_cents == 0, contributing_shift_count == 0"
            - "GET /pool-allocations?shift_tip_pool_id=${pool_id} reports total_count == 0 after the reverse: a pool that never distributed has no rows to negate"
            - "after the reverse GET /shifts/${shift_id} reports shift_tip_pool_id == null, pool_contribution_cents == 0, retained_tips_cents == 4000"
            - "the third trigger call returns HTTP 200: the identical payload that failed now succeeds, the pool having released the shift"
            - "after the void GET /shifts/${shift_id} reports time_status == VOIDED with declared_cash_tips_cents 0, retained_tips_cents 0, scheduled_minutes and tip_credit_eligible_minutes zeroed"
            - "GET /pay-periods/${period_id} reports total_credited_minutes == 0 and status == OPEN, and GET /locations/${loc_id} reports pending_pool_cents == 0"

      - name: clock_endpoint_stamps_every_subsequent_system_timestamp
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - entities.TipPoolPolicy.fields.activated_at
        distinguishing_aspect: >-
          Every timestamp in this domain is read from the logical clock rather than from wall time,
          so two rows created without an intervening clock call must carry byte-identical created_at
          values, a later clock move must show up in the next row and in activated_at, and rows
          created earlier must not be retro-stamped. Three fractional digits, always.
        test_recipe:
          setup:
            - "A fresh service whose logical clock has been set to 2026-08-10T12:00:00Z, holding one Texas unit and one SERVER job role created at that instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id, loc_created: $.data.created_at, loc_version: $.data.version }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_created: $.data.created_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T09:30:00Z" }
              as: PayrollAdmin
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${loc_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "POINTS_ONLY", cc_fee_pass_through: false }
              as: PayrollAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /tip-pool-policies/${policy_id}/activate"
              payload: { expected_location_version: "${loc_version}" }
              as: ComplianceOfficer
            - call: "GET /locations/${loc_id}"
              payload: {}
              as: PayrollAdmin
          assert:
            - "the location and the job role both report created_at == 2026-08-10T12:00:00.000Z: no time passes between calls unless the clock is moved"
            - "the first trigger call returns HTTP 200"
            - "the employee and the DRAFT policy both report created_at == 2026-08-11T09:30:00.000Z"
            - "the activate call reports status == ACTIVE with activated_at == 2026-08-11T09:30:00.000Z and updated_at == 2026-08-11T09:30:00.000Z"
            - "the final GET reports the location's created_at still 2026-08-10T12:00:00.000Z and its updated_at 2026-08-11T09:30:00.000Z, the version bump from the activate being stamped at the new instant while the creation instant is never rewritten"
            - "every timestamp is ISO-8601 UTC with exactly three fractional-second digits and a trailing Z"

  - section: errors
    instances:
      - name: unknown_identifiers_return_typed_not_found_errors
        claim_type: triggerable
        grounds:
          - errors[ERR_EMPLOYEE_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_PAY_PERIOD_NOT_FOUND]
          - errors[ERR_POOL_NOT_FOUND]
          - errors[ERR_PAY_LINE_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
          - errors[ERR_CORRECTION_NOT_FOUND]
          - errors[ERR_RECORD_NOT_FOUND]
          - validations.priority_4
        distinguishing_aspect: >-
          Eleven reads against an empty database, one per addressable resource, prove the catalog's
          404 discrimination: seven entities carry their own error_id while JobRole,
          EmployeeRoleAssignment, ServiceChargeEvent and PoolAllocation deliberately share the
          generic ERR_RECORD_NOT_FOUND. Every response is a 404 error envelope, never an empty 200.
        test_recipe:
          setup:
            - "A fresh service whose logical clock has been set to 2026-08-10T12:00:00Z. No business rows exist at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "GET /employees/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PayrollAdmin
              captures: { err_employee: $.data.error_id }
            - call: "GET /tip-pool-policies/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: PayrollAdmin
              captures: { err_policy: $.data.error_id }
            - call: "GET /pay-periods/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: PayrollAdmin
              captures: { err_period: $.data.error_id }
            - call: "GET /shift-tip-pools/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: PayrollAdmin
              captures: { err_pool: $.data.error_id }
            - call: "GET /pay-lines/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: PayrollAdmin
              captures: { err_line: $.data.error_id }
            - call: "GET /disputes/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: PayrollAdmin
              captures: { err_dispute: $.data.error_id }
            - call: "GET /back-wage-corrections/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: PayrollAdmin
              captures: { err_correction: $.data.error_id }
            - call: "GET /job-roles/88888888-8888-4888-8888-888888888888"
              payload: {}
              as: PayrollAdmin
              captures: { err_role: $.data.error_id }
            - call: "GET /role-assignments/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: PayrollAdmin
              captures: { err_assignment: $.data.error_id }
            - call: "GET /service-charges/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
              payload: {}
              as: PayrollAdmin
              captures: { err_charge: $.data.error_id }
            - call: "GET /pool-allocations/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
              payload: {}
              as: PayrollAdmin
              captures: { err_alloc: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 404 with response_type == error and a data.message string"
            - "the first seven return ERR_EMPLOYEE_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_PAY_PERIOD_NOT_FOUND, ERR_POOL_NOT_FOUND, ERR_PAY_LINE_NOT_FOUND, ERR_DISPUTE_NOT_FOUND and ERR_CORRECTION_NOT_FOUND in that order"
            - "the last four all return ERR_RECORD_NOT_FOUND, the shared fallback the catalog declares for JobRole, EmployeeRoleAssignment, ServiceChargeEvent and PoolAllocation"
            - "no trigger call returns 200 with data null, and none returns ERR_INVALID_REQUEST: the ids are well-formed, they simply name nothing"

      - name: location_and_job_role_catalog_configuration_rejected
        claim_type: triggerable
        grounds:
          - errors[ERR_CASH_WAGE_BELOW_FLOOR]
          - errors[ERR_CC_FEE_CAP_REQUIRED]
          - errors[ERR_DUPLICATE_JOB_ROLE_CODE]
          - validations.priority_28
          - validations.priority_29
          - validations.priority_49
        distinguishing_aspect: >-
          Both limbs of each configuration guard, plus the successful configuration that proves the
          guard is not simply refusing everything: 200 is below the 213 federal cash floor and 725
          sits AT the applicable minimum wage (leaving a zero credit), the fee cap is required under
          CAPPED_BPS and forbidden under ACTUAL_ONLY, and a repeated job-role code is a 409 while
          the first use was a 201.
        test_recipe:
          setup:
            - "A fresh service whose logical clock has been set to 2026-08-10T12:00:00Z. No locations and no job roles exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "POST /locations"
              payload: { name: "Below Floor Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 200, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { err_low: $.data.error_id }
            - call: "POST /locations"
              payload: { name: "No Headroom Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 725, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { err_high: $.data.error_id }
            - call: "POST /locations"
              payload: { name: "Uncapped Unit", state_code: "NY", state_min_wage_cents: 1500, cash_wage_cents: 1000, tip_credit_enabled: true, cc_fee_policy: "CAPPED_BPS", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { err_missing_cap: $.data.error_id }
            - call: "POST /locations"
              payload: { name: "Overspecified Unit", state_code: "NY", state_min_wage_cents: 1500, cash_wage_cents: 1000, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", cc_fee_cap_bps: 200, service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { err_extra_cap: $.data.error_id }
            - call: "POST /locations"
              payload: { name: "Albany Unit", state_code: "NY", state_min_wage_cents: 1500, cash_wage_cents: 1000, tip_credit_enabled: true, cc_fee_policy: "CAPPED_BPS", cc_fee_cap_bps: 200, service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_ok_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_ok_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Banquet Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1200, pool_share_points: 9, side_work_eligible: true }
              as: PayrollAdmin
              captures: { err_dup_code: $.data.error_id }
          assert:
            - "the first trigger call returns HTTP 422 with data.error_id == ERR_CASH_WAGE_BELOW_FLOOR because 200 is below the 213 federal cash floor"
            - "the second trigger call returns HTTP 422 with data.error_id == ERR_CASH_WAGE_BELOW_FLOOR because 725 is not strictly below the 725 applicable minimum wage, which would leave no credit to take"
            - "the third trigger call returns HTTP 422 with data.error_id == ERR_CC_FEE_CAP_REQUIRED because cc_fee_cap_bps is absent under CAPPED_BPS"
            - "the fourth trigger call returns HTTP 422 with data.error_id == ERR_CC_FEE_CAP_REQUIRED because cc_fee_cap_bps is present under ACTUAL_ONLY, and NOT ERR_INVALID_REQUEST, cc_fee_cap_bps being a declared optional input rather than an unknown field"
            - "the fifth trigger call returns HTTP 201 with applicable_min_wage_cents == 1500, max_tip_credit_per_hour_cents == 500, cc_fee_cap_bps == 200, version == 1"
            - "GET /locations reports total_count == 1 after all five calls: the four rejections persisted nothing"
            - "the sixth trigger call returns HTTP 201 and the seventh returns HTTP 409 with data.error_id == ERR_DUPLICATE_JOB_ROLE_CODE, uniqueness being global rather than per unit"
            - "GET /job-roles reports total_count == 1"

      - name: policy_activation_state_law_guards_rejected
        claim_type: triggerable
        grounds:
          - errors[ERR_POOL_TYPE_REQUIRES_NO_TIP_CREDIT]
          - errors[ERR_CC_FEE_DEDUCTION_PROHIBITED]
          - validations.priority_26
          - validations.priority_27
          - entities.TipPoolPolicy.fields.pool_type
          - entities.TipPoolPolicy.fields.cc_fee_pass_through
        distinguishing_aspect: >-
          The two statutory activation guards are properties of the LOCATION the policy is activated
          at, not of the policy itself, so the identical policy shape is lawful at one unit and
          unlawful at another. A back-of-house pool is refused at the tip-credit-taking Texas unit
          and accepted at the California unit; fee pass-through is refused at the PROHIBITED
          California unit and accepted at the ACTUAL_ONLY Texas unit. Rejected activations leave the
          policy DRAFT and never bump Location.version.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z."
            - "A Texas unit that claims a tip credit (cash wage 213, ACTUAL_ONLY) and a California unit that does not (cash wage 1650, PROHIBITED)."
            - "Four DRAFT policies: TX/ALL_NON_MANAGEMENT, CA/TIPPED_ONLY with cc_fee_pass_through true, CA/ALL_NON_MANAGEMENT, TX/TIPPED_ONLY with cc_fee_pass_through true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { tx_id: $.data.id, tx_v1: $.data.version }
            - call: "POST /locations"
              payload: { name: "Oakland Unit", state_code: "CA", state_min_wage_cents: 1650, cash_wage_cents: 1650, tip_credit_enabled: false, cc_fee_policy: "PROHIBITED", service_charge_treatment: "TIPS" }
              as: PayrollAdmin
              captures: { ca_id: $.data.id, ca_v1: $.data.version }
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${tx_id}", pool_type: "ALL_NON_MANAGEMENT", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "POINTS_ONLY", cc_fee_pass_through: false }
              as: PayrollAdmin
              captures: { pol_boh_tx_id: $.data.id }
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${ca_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "POINTS_ONLY", cc_fee_pass_through: true }
              as: PayrollAdmin
              captures: { pol_fee_ca_id: $.data.id }
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${ca_id}", pool_type: "ALL_NON_MANAGEMENT", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "POINTS_ONLY", cc_fee_pass_through: false }
              as: PayrollAdmin
              captures: { pol_boh_ca_id: $.data.id }
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${tx_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "HOURS_WEIGHTED_POINTS", cc_fee_pass_through: true }
              as: PayrollAdmin
              captures: { pol_fee_tx_id: $.data.id }
          trigger:
            - call: "POST /tip-pool-policies/${pol_boh_tx_id}/activate"
              payload: { expected_location_version: "${tx_v1}" }
              as: ComplianceOfficer
              captures: { err_boh: $.data.error_id }
            - call: "POST /tip-pool-policies/${pol_fee_ca_id}/activate"
              payload: { expected_location_version: "${ca_v1}" }
              as: ComplianceOfficer
              captures: { err_fee: $.data.error_id }
            - call: "POST /tip-pool-policies/${pol_boh_ca_id}/activate"
              payload: { expected_location_version: "${ca_v1}" }
              as: ComplianceOfficer
            - call: "POST /tip-pool-policies/${pol_fee_tx_id}/activate"
              payload: { expected_location_version: "${tx_v1}" }
              as: ComplianceOfficer
          assert:
            - "the first trigger call returns HTTP 422 with data.error_id == ERR_POOL_TYPE_REQUIRES_NO_TIP_CREDIT: a back-of-house pool cannot coexist with a tip credit"
            - "the second trigger call returns HTTP 422 with data.error_id == ERR_CC_FEE_DEDUCTION_PROHIBITED"
            - "after both rejections GET /tip-pool-policies/${pol_boh_tx_id} and GET /tip-pool-policies/${pol_fee_ca_id} both report status == DRAFT with activated_at == null"
            - "GET /locations/${tx_id} and GET /locations/${ca_id} both still report version == 1: a rejected activation performs no write, so the presented expected_location_version stays valid for the next attempt"
            - "the third trigger call returns HTTP 200 with status == ACTIVE and activated_at == 2026-08-10T12:00:00.000Z — the same ALL_NON_MANAGEMENT shape that failed at the Texas unit"
            - "the fourth trigger call returns HTTP 200 with status == ACTIVE — the same cc_fee_pass_through true that failed at the California unit"
            - "GET /locations/${ca_id} and GET /locations/${tx_id} now both report version == 2, each successful activation bumping only its own unit"

      - name: shift_side_work_date_and_sales_guards_rejected
        claim_type: triggerable
        grounds:
          - errors[ERR_SIDE_WORK_NOT_ELIGIBLE]
          - errors[ERR_SIDE_WORK_EXCEEDS_SHIFT]
          - errors[ERR_SHIFT_FUTURE_DATE]
          - errors[ERR_BUSINESS_DATE_OUT_OF_PERIOD]
          - errors[ERR_CHARGED_SALES_EXCEED_GROSS_SALES]
          - errors[ERR_DECLARED_CHARGED_TIPS_EXCEED_CHARGED_SALES]
          - validations.priority_30
          - validations.priority_41
          - validations.priority_42
          - validations.priority_45
          - validations.priority_50
          - validations.priority_51
        distinguishing_aspect: >-
          Seven rejections at the single busiest write in the system, ending in the shift that
          satisfies all of them, then two declaration attempts. Both limbs of priority 45 are
          exercised (side work longer than the shift, and a continuous block longer than the side
          work), and one probe is deliberately both future-dated AND outside its period to pin the
          41-before-42 ordering. The sales guard runs at shift creation while the tips guard runs at
          declaration, so a shift can be valid and its declaration still refused.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T12:00:00Z."
            - "A Texas unit; a SERVER role with side_work_eligible true and a DISH role with side_work_eligible false; Ana holds an active assignment to both."
            - "Two consecutive pay periods: P1 2026-08-03..2026-08-09 and P2 2026-08-10..2026-08-16."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { server_role_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "DISH", title: "Dishwasher", tip_status: "NON_TIPPED", is_management: false, pool_contribution_pct_bps: 0, pool_share_points: 5, side_work_eligible: false }
              as: PayrollAdmin
              captures: { dish_role_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${server_role_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${dish_role_id}", effective_from: "2026-07-01T00:00:00Z", is_primary: false }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { p1_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-10T00:00:00Z", end_date: "2026-08-16T00:00:00Z" }
              as: PayrollPreparer
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${dish_role_id}", pay_period_id: "${p1_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", side_work_minutes: 60, max_continuous_side_work_minutes: 20 }
              as: ShiftManager
              captures: { err_not_eligible: $.data.error_id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${server_role_id}", pay_period_id: "${p1_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", side_work_minutes: 500, max_continuous_side_work_minutes: 20 }
              as: ShiftManager
              captures: { err_sw_over_shift: $.data.error_id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${server_role_id}", pay_period_id: "${p1_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", side_work_minutes: 60, max_continuous_side_work_minutes: 90 }
              as: ShiftManager
              captures: { err_sw_over_sw: $.data.error_id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${server_role_id}", pay_period_id: "${p2_id}", business_date: "2026-08-12T00:00:00Z", start_at: "2026-08-12T16:00:00Z", end_at: "2026-08-13T00:00:00Z" }
              as: ShiftManager
              captures: { err_future: $.data.error_id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${server_role_id}", pay_period_id: "${p1_id}", business_date: "2026-08-02T00:00:00Z", start_at: "2026-08-02T16:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: ShiftManager
              captures: { err_out_of_period: $.data.error_id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${server_role_id}", pay_period_id: "${p1_id}", business_date: "2026-08-20T00:00:00Z", start_at: "2026-08-20T16:00:00Z", end_at: "2026-08-21T00:00:00Z" }
              as: ShiftManager
              captures: { err_both: $.data.error_id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${server_role_id}", pay_period_id: "${p1_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", gross_sales_cents: 50000, charged_sales_cents: 60000 }
              as: ShiftManager
              captures: { err_sales: $.data.error_id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${server_role_id}", pay_period_id: "${p1_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", side_work_minutes: 96, max_continuous_side_work_minutes: 30, gross_sales_cents: 50000, charged_sales_cents: 40000 }
              as: ShiftManager
              captures: { shift_id: $.data.id }
            - call: "POST /shifts/${shift_id}/close"
              payload: {}
              as: ShiftManager
            - call: "POST /shifts/${shift_id}/declare-tips"
              payload: { declared_cash_tips_cents: 1000, declared_charged_tips_cents: 50000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err_tips: $.data.error_id }
            - call: "POST /shifts/${shift_id}/declare-tips"
              payload: { declared_cash_tips_cents: 4000, declared_charged_tips_cents: 1000 }
              as: Employee
              as_user_id: "${emp_id}"
          assert:
            - "trigger 1 returns HTTP 422 with data.error_id == ERR_SIDE_WORK_NOT_ELIGIBLE: 60 side-work minutes on a role whose side_work_eligible is false, and NOT ERR_SIDE_WORK_EXCEEDS_SHIFT, priority 30 running before priority 45"
            - "trigger 2 returns HTTP 422 with data.error_id == ERR_SIDE_WORK_EXCEEDS_SHIFT: 500 side-work minutes on a 480-minute shift"
            - "trigger 3 returns HTTP 422 with data.error_id == ERR_SIDE_WORK_EXCEEDS_SHIFT: a 90-minute continuous block inside 60 side-work minutes, the second limb of the same rule"
            - "trigger 4 returns HTTP 422 with data.error_id == ERR_SHIFT_FUTURE_DATE even though 2026-08-12 sits correctly inside P2: the logical clock reads 2026-08-10"
            - "trigger 5 returns HTTP 422 with data.error_id == ERR_BUSINESS_DATE_OUT_OF_PERIOD: 2026-08-02 is one day before P1 starts and is not future-dated"
            - "trigger 6 returns HTTP 422 with data.error_id == ERR_SHIFT_FUTURE_DATE, not ERR_BUSINESS_DATE_OUT_OF_PERIOD, although 2026-08-20 violates both rules: priority 41 precedes priority 42"
            - "trigger 7 returns HTTP 422 with data.error_id == ERR_CHARGED_SALES_EXCEED_GROSS_SALES"
            - "trigger 8 returns HTTP 201 with scheduled_minutes == 480, side_work_minutes == 96, max_continuous_side_work_minutes == 30, non_tip_credit_minutes == 0, tip_credit_eligible_minutes == 480, time_status == OPEN, declaration_status == UNDECLARED"
            - "GET /shifts reports total_count == 1 after all eight calls: every rejection persisted nothing"
            - "trigger 10 returns HTTP 422 with data.error_id == ERR_DECLARED_CHARGED_TIPS_EXCEED_CHARGED_SALES because 50000 card tips exceed the shift's 40000 charged_sales_cents, and GET /shifts/${shift_id} still reports declaration_status == UNDECLARED with declaration_count == 0"
            - "trigger 11 returns HTTP 200 with declared_cash_tips_cents == 4000, declared_charged_tips_cents == 1000, declaration_status == DECLARED, declaration_count == 1"

      - name: pay_period_assignment_and_separation_interval_guards_rejected
        claim_type: triggerable
        grounds:
          - errors[ERR_PAY_PERIOD_LENGTH]
          - errors[ERR_ASSIGNMENT_OVERLAP]
          - errors[ERR_EMPLOYEE_SEPARATED]
          - validations.priority_40
          - validations.priority_43
          - validations.priority_44
          - entities.Employee.fields.separation_date
        distinguishing_aspect: >-
          The three interval guards that surround an employee's working life, each shown from both
          sides: a period one day too long and one day too short versus the exact seven-day week;
          an overlapping assignment to the SAME role rejected while the identical interval on a
          DIFFERENT role is accepted, proving the uniqueness key is (employee, job_role); and a
          separated employee who may still receive a pre-separation assignment and be paid for a
          pre-separation shift, but neither for anything dated after the separation date.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T12:00:00Z."
            - "A Texas unit with a SERVER and a BAR job role."
            - "Ana, still employed, already holds an open-ended SERVER assignment from 2026-07-01."
            - "Zed, hired with separation_date 2026-08-05."
