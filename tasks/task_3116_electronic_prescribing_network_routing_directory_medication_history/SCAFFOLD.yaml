    code: 200
    input: []
    output: Prescription[]
    side_effects: []
  - method: GET
    path: "/network/routing-attempts"
    description: "List routing attempts"
    roles: [NetworkOperator, HubOperator, Prescriber, Pharmacy]
    code: 200
    input: ["prescription_id?", "outcome?", "channel?", "target_endpoint_id?", "limit?", "offset?"]

    output: RoutingAttempt[]
    side_effects: []
  - method: POST
    path: "/network/prescriptions/{id}/fallback-attempts"
    description: "Create the fax or print routing attempt an order's fallback needs"
    roles: [Prescriber, HubOperator]
    code: 201
    input: [channel]

    output: RoutingAttempt
    side_effects:
      - "outcome=IN_PROGRESS, target_endpoint_id=null, attempt_no = routing_attempt_count + 1"
      - "prescription.routing_attempt_count += 1"
  - method: POST
    path: "/network/routing-attempts/{id}/report-acknowledged"
    description: "Report that the trading partner acknowledged the transaction"
    roles: [NetworkOperator, HubOperator]
    code: 200
    input: []

    output: RoutingAttempt
    side_effects:
      - "outcome → ACKNOWLEDGED, reported_at stamped"
      - "prescription.clinical_status → DELIVERED, routing_status → ROUTED, active_routing_attempt_id = null"
      - "a TransactionFeeEntry row with status PARTIAL is created for the sending cell with transaction_count = 1, fee_tier = FREE and fee_cents = 0 — the provisional accrual created per report"
      - "when the same cell already held a non-IN_PROGRESS attempt for this prescription, a TransactionFeeEntry row with entry_type = CORRECTION and status PARTIAL is also created carrying previous_count = the cell's chargeable count before this report and new_count = that count + 1, so the gross double-count nets back to one; its id is returned as this attempt's correction_entry_id"
      - "the target endpoint's reported_attempt_count, acknowledged_count, reliability_ratio and reliability_ratio_ewma recomputed"
  - method: POST
    path: "/network/routing-attempts/{id}/report-undeliverable"
    description: "Report that the transaction could not be delivered"
    roles: [NetworkOperator, HubOperator]
    code: 200
    input: [failure_code]

    output: RoutingAttempt
    side_effects:
      - "outcome → UNDELIVERABLE, reported_at stamped"
      - "the target endpoint ACTIVE → DEGRADED subject to the coverage invariant; otherwise the endpoint stays ACTIVE and the warning payload ERR_ENDPOINT_COVERAGE_WARNING is returned"
      - "the target endpoint's report counters and reliability columns recomputed"
      - "participant.directory_listed recomputed"
      - "prescription.routing_status → BACKUP_SELECTION, ROUTE_FAILED or unchanged per the routing_status machine"
  - method: POST
    path: "/network/routing-attempts/{id}/report-rejected"
    description: "Report that the transaction was rejected, including a post-delivery rejection"
    roles: [NetworkOperator, HubOperator]
    code: 200
    input: [failure_code, "error_code_returned?"]

    output: RoutingAttempt
    side_effects:
      - "outcome → REJECTED, reported_at stamped"
      - "prescription.clinical_status → REJECTED"
      - "the target endpoint's report counters and reliability columns recomputed"
      - "a compensating EntryUpdateRequest is created for the sending cell"
  - method: POST
    path: "/network/routing-attempts/{id}/report-fallback"
    description: "Report the outcome of a fax or print attempt"
    roles: [NetworkOperator, HubOperator]
    code: 200
    input: [outcome, "failure_code?"]

    output: RoutingAttempt
    side_effects:
      - "outcome → ACKNOWLEDGED or UNDELIVERABLE, reported_at stamped"
      - "on ACKNOWLEDGED: prescription.routing_status → FALLBACK_SENT and clinical_status → DELIVERED"

