            - "One CapitalProject in APPROVED with funding_hold true, because funded_obligation_count was 0 at approval time."
            - "Two FINAL remittances for 2,000,000 and 4,000,000 cents; the first is already RECONCILED, leaving trust_debt_service_reserve_cents at 2,000,000 and coverage still DEFICIENT."
