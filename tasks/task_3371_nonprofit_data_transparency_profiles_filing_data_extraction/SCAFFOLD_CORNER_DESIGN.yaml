            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
            - *c_extract
            - *c_normalize
            - call: "GET /nonprofits/filings/${f_id}/extracted-fields"
