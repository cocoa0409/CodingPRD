  # ---------------------------------------------------------------------------
  # SECTION: rate_threshold_triggers (complexity layer)
  # Two thresholds of different kinds: the CUMULATIVE budget-utilization ladder that drives
  # Program.posture (tested on the way back DOWN, which is the reset direction §1.8 does not
  # cover) and the INSTANTANEOUS per-analyst open-interview cap (tested at the cap, then
  # released by a completion).
  # ---------------------------------------------------------------------------
  - section: rate_threshold_triggers
    instances:

      - name: cancelling_the_only_interview_resets_the_posture_from_restricted_to_open
        claim_type: threshold_reset
        grounds:
          - calculations.program_incentive_posture.constants.POSTURE_RESTRICTED_AT
          - state_machines.Interview.SCHEDULED_to_CANCELLED
          - endpoints.POST /interviews/{interview_id}/cancel
        distinguishing_aspect: "The ladder must be re-evaluated downward, not latched. A 280.00 budget with one 250.00 commitment sits at utilization 0.8929, above POSTURE_RESTRICTED_AT, so the program is RESTRICTED; releasing that commitment returns utilization to 0.0000 and the posture MUST fall back to OPEN. An implementation that only tightens the posture (a common one-way reading of \"the posture gates every child write\") leaves the program RESTRICTED forever after a single cancelled interview."
