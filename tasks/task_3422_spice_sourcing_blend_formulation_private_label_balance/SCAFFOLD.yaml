# =============================================================================
# PRD Benchmark Scaffold — Spice Sourcing, Blend Formulation & Private Label
# Balance (task_3422). Single source of truth for PRD, tests, implementation.
# =============================================================================

scenario: |
  Spice Sourcing, Blend Formulation & Private Label Balance (McCormick): global
  raw material sourcing with origin-specific quality, food safety testing and
  adulteration screening, crop year variability affecting flavor profiles with
  blending to maintain consistent sensory specifications, proprietary blend
  formulation with recipe protection and limited supplier knowledge of full
  formulas, branded and private label production in the same facilities with
  allergen, changeover and confidentiality controls, retail shelf management for
  a category with hundreds of low-velocity items and long shelf lives,
  foodservice and industrial flavor business with custom development projects
  and confidentiality agreements, seasonal demand spikes around holidays with
  capacity planning, recall readiness given supply chain complexity.

domain_name: spice-sourcing-blend-private-label
api_prefix: /spice

complexity_profile:
  primary_archetype: compliance_audit        # food safety, adulteration screening, recall readiness, segregation of duties
  secondary_archetype: quota_allocation      # per-line per-week capacity pools competed for by runs and seasonal reservations
  complexity_layers:
    - optimistic_concurrency                 # OCC on ProductionLine.version for run scheduling
    - cascading_side_effects                 # adulterant FAIL -> lot quarantine -> batch hold -> auto recall case
    - dual_variant_calculation               # blend lot selection (COST_MIN vs FIFO_AGE); recall scope (PROVISIONAL vs FINAL)
    - derived_field_reconciliation           # lot quantity split, agreement produced_ytd_kg, weekly pool consumption
  entity_topology: hybrid                    # flat peer collections (FK in body) + two owned sub-resources (tests, formula lines)
  state_machine_shape: cyclic                # RawLot quarantine/retest/release cycle; FinishedBatch carries parallel dimensions
  relationship_patterns:
    - one_to_many
    - self_referential                       # BlendFormula.supersedes_formula_id
    - cross_aggregate                        # FinishedBatch.genealogy_lot_ids, RecallCase suspect refs
  role_model: segregation_of_duties          # the user who posted a SafetyTest on a lot may not disposition that lot
  consistency_model: immediate               # all side effects atomic within the triggering request

# =============================================================================
# Constants — every numeric threshold / enum / default used anywhere in this
# scaffold (and in both design files) is pinned here with a concrete value.
# =============================================================================
constants:
  CLOCK_DEFAULT_UTC: "2026-09-01T00:00:00Z"   # logical clock value at server start, before any /_clock/set_current_utc call
  LEAD_LIMIT_PPM: 2.00                        # ADULTERANT_SCREEN action level: FAIL when measured_value >= 2.00
  PESTICIDE_LIMIT_PPM: 0.10                   # PESTICIDE: FAIL when measured_value >= 0.10
  MICRO_LIMIT_CFU_G: 100000                   # MICRO: FAIL when measured_value > 100000 (at-limit PASSES)
  MOISTURE_LIMIT_PCT: 12.0                    # MOISTURE test: FAIL when measured_value > 12.0 (at-limit PASSES)
  REQUIRED_TEST_SUITE: [MICRO, ADULTERANT_SCREEN, MOISTURE]   # each needs >= 1 PASS before ACCEPT disposition
  FLAVOR_TOLERANCE_PCT_DEFAULT: 2.0           # BlendFormula.flavor_tolerance_pct default; WITHIN_SPEC iff |residual_pct| <= tolerance
  MAX_MOISTURE_PCT_DEFAULT: 10.0              # BlendFormula.max_moisture_pct default; blend must be <= this
  PROPORTION_SUM_TARGET: 100.0                # formula activation requires sum of FormulaLine.target_proportion_pct
  PROPORTION_SUM_EPSILON: 0.01                # ...within |sum - 100.0| <= 0.01 (an empty formula fails: sum = 0)
  MAX_SINGLE_LOT_SHARE_PCT: 40.0              # no single RawLot may supply more than 40% of a formula line's required kg
  ALLOCATION_QTY_DECIMALS: 3                  # allocated/needed/cap kg rounded to 3 decimals, ROUND_HALF_UP (cap uses ROUND_FLOOR)
  SHELF_LIFE_DAYS: 540                        # FinishedBatch.best_by_date = produced_at + 540 days
  MIN_SHIP_REMAINING_SHELF_LIFE_PCT: 75.0     # ship gate: (best_by_date - now)/SHELF_LIFE_DAYS >= 0.75 (at-threshold PASSES)
  SHIFTS_PER_WEEK: 5                          # weekly line pool = capacity_kg_per_shift * SHIFTS_PER_WEEK (* surge multiplier)
  SURGE_WEEK_START: 44                        # ISO week number, inclusive
  SURGE_WEEK_END: 52                          # ISO week number, inclusive
  SURGE_CAPACITY_MULTIPLIER: 1.25             # applied to the weekly pool for ISO weeks 44..52
  PRODUCTION_OVERHEAD_PCT: 3.5                # blend cost rollup overhead, round_half_up(subtotal * 0.035)
  CROP_YEAR_MIN: 2000
  CROP_YEAR_MAX: 2100
  SPICE_CODES: [BLACK_PEPPER, PAPRIKA, CUMIN, OREGANO, GARLIC_POWDER, CINNAMON]
  ALLERGEN_PROFILES: [NONE, CELERY, MUSTARD, SESAME, GLUTEN]
  CHANGEOVER_CLASSES: [NONE, DRY_CLEAN, WET_WASH, FULL_SANITATION]   # ascending severity
  MASKED_CODE_PREFIX: "CMP-"                  # FormulaLine.masked_component_code = "CMP-" + letter (A, B, C, ... by creation order)
  DECIMAL_RULE: "all kg arithmetic to 3 decimals and all money (cents) arithmetic use exact decimal math with ROUND_HALF_UP; binary floating point is forbidden"

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Supplier legal name" }
      - { name: origin_country, type: string, source: input, description: "Primary sourcing country (free text, e.g. 'IN', 'VN', 'ES')" }
      - { name: certifications, type: array, source: input, default: [], description: "Subset of [ORGANIC, KOSHER, HALAL, NON_GMO]", constraints: "each member in enum; empty allowed" }
      - { name: knowledge_tier, type: enum, source: input, default: MASKED_ONLY, description: "MASKED_ONLY | FULL — MASKED_ONLY suppliers only ever see masked component codes, never true spice codes or proportions" }

  - name: RawLot
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; sourcing supplier" }
      - { name: spice_code, type: enum, source: input, description: "One of constants.SPICE_CODES" }
      - { name: origin_region, type: string, source: input, description: "Origin region label (e.g. 'Malabar', 'La Vera')" }
      - { name: crop_year, type: integer, source: input, description: "Harvest year", constraints: "CROP_YEAR_MIN <= crop_year <= CROP_YEAR_MAX" }
      - { name: quantity_kg, type: number, source: input, description: "Received gross kg, 3-decimal precision", constraints: "> 0" }
      - { name: quantity_remaining_kg, type: number, source: computed, description: "Unallocated kg; equals quantity_kg at creation" }
      - { name: quantity_consumed_kg, type: number, source: computed, default: 0, description: "Kg committed into COMMITTED BlendRuns" }
      - { name: quantity_wasted_kg, type: number, source: computed, default: 0, description: "Kg written off on REJECT disposition" }
      - { name: flavor_intensity_units, type: number, source: input, description: "Generic sensory units per kg (maps ASTA/piperine/volatile-oil onto one scale)", constraints: "> 0" }
      - { name: moisture_pct, type: number, source: input, description: "Received moisture percent", constraints: "0 <= moisture_pct <= 100" }
      - { name: cost_per_kg_cents, type: integer, source: input, description: "Contract cost per kg in cents", constraints: ">= 0" }
      - { name: allergen_profile, type: enum, source: input, description: "One of constants.ALLERGEN_PROFILES" }
      - { name: organic_certified, type: boolean, source: input, default: false, description: "Lot carries organic certification" }
      - { name: status, type: enum, source: system, description: "RECEIVED | IN_TEST | ACCEPTED | QUARANTINED | REJECTED | DEPLETED" }

  - name: SafetyTest
    parent: RawLot
    common_fields: false   # append-only event: id + created_at only; immutable once posted
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> RawLot.id; taken from the URL path" }
      - { name: test_type, type: enum, source: input, description: "MICRO | ADULTERANT_SCREEN | PESTICIDE | MOISTURE" }
      - { name: measured_value, type: number, source: input, description: "Measured result in the test's fixed unit (PPM for ADULTERANT_SCREEN/PESTICIDE, CFU_G for MICRO, PCT for MOISTURE)", constraints: ">= 0" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL per calculations.lot_test_result; FAIL on ADULTERANT_SCREEN auto-quarantines the lot" }
      - { name: lab_code, type: string, source: input, description: "Laboratory identifier" }
      - { name: analyst_user_id, type: string, source: system, description: "Copied from X-User-ID header of the posting QualityAnalyst; drives segregation-of-duties" }

  - name: BlendFormula
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Finished product code; unique among DRAFT+ACTIVE formulas unless supersedes_formula_id chains a revision" }
      - { name: name, type: string, source: input, description: "Formula display name" }
      - { name: brand_type, type: enum, source: input, description: "BRANDED | PRIVATE_LABEL" }
      - { name: target_flavor_units, type: number, source: input, description: "Target sensory units per kg of blend", constraints: "> 0" }
      - { name: flavor_tolerance_pct, type: number, source: input, default: 2.0, description: "Allowed |residual| percent; WITHIN_SPEC iff |residual_pct| <= flavor_tolerance_pct" }
      - { name: max_moisture_pct, type: number, source: input, default: 10.0, description: "Blend moisture ceiling; blend must be <= max_moisture_pct" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }
      - { name: revision, type: integer, source: system, default: 1, description: "1 for a fresh product_code; prior revision's revision + 1 when supersedes_formula_id is given" }
      - { name: supersedes_formula_id, type: string, source: input, description: "FK -> BlendFormula.id; optional self-reference declaring which formula this revises", constraints: "nullable; when set, must reference an existing formula with the same product_code" }

  - name: FormulaLine
    parent: BlendFormula
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: system, description: "FK -> BlendFormula.id; taken from the URL path" }
      - { name: masked_component_code, type: string, source: system, description: "Pseudonym shown to suppliers: CMP-A, CMP-B, ... by creation order within the formula" }
      - { name: spice_code, type: enum, source: input, description: "True spice identity (constants.SPICE_CODES); NEVER exposed to SupplierRep" }
      - { name: target_proportion_pct, type: number, source: input, description: "Target mass percent of the blend", constraints: "0 < target_proportion_pct <= 100; never exposed to SupplierRep" }
      - { name: allergen_profile, type: enum, source: input, description: "One of constants.ALLERGEN_PROFILES; visible to suppliers (needed for safe handling)" }
      - { name: organic_required, type: boolean, source: input, default: false, description: "Only organic_certified lots qualify" }
      - { name: min_lot_flavor_units, type: number, source: input, description: "Qualifying lots need flavor_intensity_units >= this", constraints: ">= 0" }

  - name: BlendRun
    parent: null
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> BlendFormula.id; must be ACTIVE at create and at commit" }
      - { name: selection_policy, type: enum, source: input, description: "COST_MIN | FIFO_AGE — the dual variant of calculations.blend_lot_selection" }
      - { name: target_batch_kg, type: number, source: input, description: "Blend size in kg", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMMITTED | VOIDED" }
      - { name: selected_allocations, type: array, source: computed, description: "After commit attempt: [{lot_id, spice_code, allocated_kg, line_cost_cents}], in formula-line creation order then policy order" }
      - { name: residual_flavor_pct, type: number, source: computed, description: "(blended_flavor - target)/target * 100 rounded to 3 decimals; null before first commit attempt" }
      - { name: blended_moisture_pct, type: number, source: computed, description: "Weighted moisture of selected allocations; null before first commit attempt" }
      - { name: cost_total_cents, type: integer, source: computed, description: "Per calculations.blend_cost_rollup (per-allocation rounding, then overhead); null before first commit attempt" }
      - { name: spec_status, type: enum, source: computed, description: "WITHIN_SPEC | OUT_OF_SPEC; null before first commit attempt" }

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Line identifier" }
      - { name: capacity_kg_per_shift, type: integer, source: input, description: "Max kg per shift", constraints: "> 0" }
      - { name: supported_changeover_classes, type: array, source: input, description: "Subset of constants.CHANGEOVER_CLASSES; MUST contain NONE", constraints: "non-empty, all members in enum" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id" }
      - { name: formula_id, type: string, source: input, description: "FK -> BlendFormula.id; must be ACTIVE" }
      - { name: blend_run_id, type: string, source: input, description: "FK -> BlendRun.id; must be COMMITTED and belong to formula_id" }
      - { name: private_label_agreement_id, type: string, source: input, description: "FK -> PrivateLabelAgreement.id; required iff formula.brand_type == PRIVATE_LABEL", constraints: "nullable" }
      - { name: quantity_kg, type: number, source: input, description: "Planned output kg; MUST equal the referenced BlendRun.target_batch_kg", constraints: "> 0" }
      - { name: window_start, type: datetime, source: input, description: "Run window start (UTC ISO8601); half-open interval start" }
      - { name: window_end, type: datetime, source: input, description: "Run window end (UTC ISO8601); half-open interval end", constraints: "window_end > window_start" }
      - { name: predecessor_run_id, type: string, source: computed, description: "Derived reference: ProductionRun.id of the changeover predecessor on the same line (non-CANCELLED run with greatest window_end <= this window_start; tie-break earliest created_at; null if none)" }
      - { name: changeover_class_required, type: enum, source: computed, description: "One of constants.CHANGEOVER_CLASSES, from calculations.changeover_class at schedule time" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: FinishedBatch
    parent: null
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: system, description: "FK -> ProductionRun.id; set when the run completes" }
      - { name: product_code, type: string, source: system, description: "Copied from the run's formula" }
      - { name: brand_type, type: enum, source: system, description: "BRANDED | PRIVATE_LABEL, copied from the run's formula" }
      - { name: quantity_kg, type: number, source: system, description: "Copied from ProductionRun.quantity_kg" }
      - { name: produced_at, type: datetime, source: system, description: "Logical clock value at run completion" }
      - { name: shelf_life_days, type: integer, source: system, description: "Always constants.SHELF_LIFE_DAYS (540)" }
      - { name: best_by_date, type: datetime, source: computed, description: "produced_at + SHELF_LIFE_DAYS days" }
      - { name: genealogy_lot_ids, type: array, source: system, description: "Distinct RawLot ids from the blend run's selected_allocations, in allocation order" }
      - { name: unit_cost_cents, type: integer, source: computed, description: "round_half_up(BlendRun.cost_total_cents * quantity allocation share) — equals blend run cost_total_cents because run quantity must equal blend target" }
      - { name: commercial_status, type: enum, source: system, description: "CREATED | SHIPPED (parallel dimension 1)" }
      - { name: quality_status, type: enum, source: system, description: "CLEAR | QUALITY_HOLD | RECALLED | WITHDRAWN (parallel dimension 2)" }
      - { name: quality_hold_cause, type: enum, source: system, default: NONE, description: "NONE | MANUAL | LOT_QUARANTINE — why the batch is on hold" }
      - { name: quality_hold_lot_id, type: string, source: system, description: "RawLot.id whose quarantine caused the hold when quality_hold_cause == LOT_QUARANTINE; null otherwise", constraints: "nullable" }

  - name: RecallCase
    parent: null
    common_fields: true
    fields:
      - { name: trigger_type, type: enum, source: input, description: "LOT_SUSPECT | BATCH_SUSPECT | REGULATORY" }
      - { name: suspect_lot_id, type: string, source: input, description: "FK -> RawLot.id; exactly one of suspect_lot_id / suspect_batch_id required", constraints: "nullable" }
      - { name: suspect_batch_id, type: string, source: input, description: "FK -> FinishedBatch.id; exactly one of suspect_lot_id / suspect_batch_id required", constraints: "nullable" }
      - { name: scope_policy, type: enum, source: input, description: "PROVISIONAL | FINAL — the dual variant of calculations.recall_scope" }
      - { name: source, type: enum, source: system, default: MANUAL, description: "MANUAL | AUTO_QUARANTINE (system-created by the adulterant cascade)" }
      - { name: affected_batch_ids, type: array, source: computed, description: "Scope per calculations.recall_scope at initiate time; [] until initiated" }
      - { name: affected_quantity_kg, type: number, source: computed, description: "Sum of quantity_kg over affected batches; 0 until initiated" }
      - { name: status, type: enum, source: system, description: "DRAFT | INITIATED | CLOSED" }

  - name: PrivateLabelAgreement
    parent: null
    common_fields: true
    fields:
      - { name: retailer_name, type: string, source: input, description: "Retail or foodservice/industrial customer name" }
      - { name: product_codes, type: array, source: input, description: "Product codes this agreement covers (custom development scope under NDA)", constraints: "non-empty array of strings" }
      - { name: confidentiality_level, type: enum, source: input, default: STANDARD, description: "STANDARD | HIGH_SEGREGATION — HIGH_SEGREGATION forces FULL_SANITATION changeovers adjacent to its runs" }
      - { name: annual_commitment_kg, type: number, source: input, description: "Contracted annual volume", constraints: "> 0" }
      - { name: development_nda_signed, type: boolean, source: input, default: false, description: "Custom-development NDA executed (foodservice/industrial flavor projects)" }
      - { name: produced_ytd_kg, type: number, source: computed, default: 0, description: "Sum of quantity_kg of COMPLETED private-label runs referencing this agreement" }
      - { name: commitment_met, type: boolean, source: computed, default: false, description: "true iff produced_ytd_kg >= annual_commitment_kg" }

  - name: CapacityReservation
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id" }
      - { name: agreement_id, type: string, source: input, description: "FK -> PrivateLabelAgreement.id; the private-label customer this capacity is dedicated to (null = branded program reservation)", constraints: "nullable" }
      - { name: window_start, type: datetime, source: input, description: "Reservation window start (UTC ISO8601); half-open" }
      - { name: window_end, type: datetime, source: input, description: "Reservation window end (UTC ISO8601); half-open", constraints: "window_end > window_start" }
      - { name: reserved_kg_per_week, type: integer, source: input, description: "Pool kg reserved for every ISO week the window intersects", constraints: "> 0" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RawLot
    initial_state: RECEIVED
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: RECEIVED
        to: IN_TEST
        trigger: "POST /spice/lots/{id}/tests (first SafetyTest posted on the lot)"
        trigger_name: lot_first_test
        actor: QualityAnalyst
        preconditions: []
        side_effects: ["status -> IN_TEST automatically when the test is recorded"]
      - from: IN_TEST
        to: ACCEPTED
        trigger: "POST /spice/lots/{id}/disposition with action=ACCEPT"
        trigger_name: lot_accept
        actor: QualityManager
        preconditions:
          - "segregation of duties: no SafetyTest on this lot has analyst_user_id == X-User-ID (ERR_DISPOSITION_FORBIDDEN)"
          - "the latest SafetyTest of each test_type (by created_at) on this lot does not have result == FAIL (ERR_LOT_HAS_FAILING_TEST)"
          - "at least one recorded PASS SafetyTest for each type in constants.REQUIRED_TEST_SUITE (ERR_TEST_SUITE_INCOMPLETE)"
        side_effects: []
      - from: QUARANTINED
        to: ACCEPTED
        trigger: "POST /spice/lots/{id}/disposition with action=ACCEPT (release from quarantine)"
        trigger_name: lot_release
        actor: QualityManager
        preconditions:
          - "segregation of duties: no SafetyTest on this lot has analyst_user_id == X-User-ID (ERR_DISPOSITION_FORBIDDEN)"
          - "the latest SafetyTest of each test_type (by created_at) on this lot does not have result == FAIL (ERR_LOT_HAS_FAILING_TEST)"
          - "at least one recorded PASS SafetyTest for each type in constants.REQUIRED_TEST_SUITE (ERR_TEST_SUITE_INCOMPLETE)"
        side_effects:
          - "every FinishedBatch with quality_hold_cause == LOT_QUARANTINE and quality_hold_lot_id == this lot and NOT covered by any INITIATED RecallCase: quality_status QUALITY_HOLD -> CLEAR, quality_hold_cause -> NONE, quality_hold_lot_id -> null"
          - "every RecallCase with source == AUTO_QUARANTINE, status == DRAFT, suspect_lot_id == this lot: status -> CLOSED, affected_batch_ids -> [], affected_quantity_kg -> 0"
      - from: IN_TEST
        to: QUARANTINED
        trigger: "POST /spice/lots/{id}/disposition with action=QUARANTINE"
        trigger_name: lot_quarantine_manual
        actor: QualityManager
        preconditions:
          - "segregation of duties: no SafetyTest on this lot has analyst_user_id == X-User-ID (ERR_DISPOSITION_FORBIDDEN)"
        side_effects: []
      - from: IN_TEST
        to: QUARANTINED
        trigger: "system (a SafetyTest with test_type == ADULTERANT_SCREEN and result == FAIL is recorded)"
        trigger_name: lot_quarantine_auto
        actor: system
        preconditions: []
        side_effects:
          - "adulterant cascade link 1 -> see FinishedBatch holds and RecallCase auto-create in the SafetyTest transition"
      - from: ACCEPTED
        to: QUARANTINED
        trigger: "system (a SafetyTest with test_type == ADULTERANT_SCREEN and result == FAIL is recorded)"
        trigger_name: lot_quarantine_auto_from_accepted
        actor: system
        preconditions: []
        side_effects:
          - "adulterant cascade link 1 -> see FinishedBatch holds and RecallCase auto-create in the SafetyTest transition"
      - from: IN_TEST
        to: REJECTED
        trigger: "POST /spice/lots/{id}/disposition with action=REJECT"
        trigger_name: lot_reject
        actor: QualityManager
        preconditions:
          - "segregation of duties: no SafetyTest on this lot has analyst_user_id == X-User-ID (ERR_DISPOSITION_FORBIDDEN)"
        side_effects:
          - "quantity_wasted_kg += quantity_remaining_kg; quantity_remaining_kg = 0 (mass invariant INV-1 preserved)"
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /spice/lots/{id}/disposition with action=REJECT"
        trigger_name: lot_reject_from_quarantine
        actor: QualityManager
        preconditions:
          - "segregation of duties: no SafetyTest on this lot has analyst_user_id == X-User-ID (ERR_DISPOSITION_FORBIDDEN)"
        side_effects:
          - "quantity_wasted_kg += quantity_remaining_kg; quantity_remaining_kg = 0 (mass invariant INV-1 preserved)"
      - from: QUARANTINED
        to: IN_TEST
        trigger: "POST /spice/lots/{id}/tests (retest: any new SafetyTest posted while QUARANTINED)"
        trigger_name: lot_retest
        actor: QualityAnalyst
        preconditions: []
        side_effects: ["status -> IN_TEST automatically when the retest is recorded"]
      - from: ACCEPTED
        to: DEPLETED
        trigger: "system (quantity_remaining_kg reaches exactly 0 after a BlendRun commit consumption)"
        trigger_name: lot_depleted
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: ACCEPTED
        trigger: "system (a BlendRun void restores quantity_remaining_kg above 0)"
        trigger_name: lot_undepleted
        actor: system
        preconditions: []
        side_effects: []

  - entity: BlendFormula
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /spice/formulas/{id}/activate"
        trigger_name: formula_activate
        actor: FlavorScientist
        preconditions:
          - "|sum(FormulaLine.target_proportion_pct) - PROPORTION_SUM_TARGET| <= PROPORTION_SUM_EPSILON (ERR_PROPORTION_SUM_INVALID; empty formula has sum 0 and fails)"
        side_effects:
          - "every OTHER BlendFormula with the same product_code and status == ACTIVE: status -> RETIRED (supersede cascade)"
      - from: ACTIVE
        to: RETIRED
        trigger: "system (a successor formula with the same product_code is activated)"
        trigger_name: formula_superseded
        actor: system
        preconditions: []
        side_effects: []

  - entity: BlendRun
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST /spice/blend-runs/{id}/commit"
        trigger_name: blend_commit
        actor: FlavorScientist
        preconditions:
          - "formula referenced by formula_id is ACTIVE (ERR_FORMULA_NOT_ACTIVE)"
          - "per line: candidate pool non-empty (ERR_NO_QUALIFYING_LOTS)"
          - "per line: sum of max-allocatable kg >= needed kg (ERR_INSUFFICIENT_LOT_QUANTITY)"
          - "|residual_flavor_pct| <= formula.flavor_tolerance_pct AND blended_moisture_pct <= formula.max_moisture_pct (ERR_BLEND_OUT_OF_SPEC)"
        side_effects:
          - "per selected allocation: lot.quantity_remaining_kg -= allocated_kg; lot.quantity_consumed_kg += allocated_kg"
          - "any lot whose quantity_remaining_kg reaches exactly 0: ACCEPTED -> DEPLETED"
          - "selected_allocations, residual_flavor_pct, blended_moisture_pct, cost_total_cents, spec_status persisted"
        note: "a FAILED commit (ERR_NO_QUALIFYING_LOTS / ERR_INSUFFICIENT_LOT_QUANTITY / ERR_BLEND_OUT_OF_SPEC) still persists the computed fields it reached and leaves status == DRAFT; no lot quantities change"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /spice/blend-runs/{id}/void"
        trigger_name: blend_void_draft
        actor: FlavorScientist
        preconditions: []
        side_effects: ["no lot quantity changes (nothing was consumed)"]
      - from: COMMITTED
        to: VOIDED
        trigger: "POST /spice/blend-runs/{id}/void"
        trigger_name: blend_void_committed
        actor: FlavorScientist
        preconditions:
          - "no ProductionRun with blend_run_id == this run has status == COMPLETED (ERR_INVALID_STATE)"
        side_effects:
          - "per selected allocation: lot.quantity_consumed_kg -= allocated_kg; lot.quantity_remaining_kg += allocated_kg (INV-1 preserved)"
          - "any DEPLETED lot whose quantity_remaining_kg rises above 0: DEPLETED -> ACCEPTED"

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /spice/production-runs/{id}/complete"
        trigger_name: run_complete
        actor: ProductionScheduler
        preconditions: []
        side_effects:
          - "create FinishedBatch: production_run_id, product_code, brand_type, quantity_kg copied; produced_at = logical clock; best_by_date = produced_at + SHELF_LIFE_DAYS; genealogy_lot_ids from blend run allocations; unit_cost_cents = blend run cost_total_cents; commercial_status = CREATED; quality_status = CLEAR"
          - "if private_label_agreement_id set: agreement.produced_ytd_kg += quantity_kg; agreement.commitment_met = (produced_ytd_kg >= annual_commitment_kg)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /spice/production-runs/{id}/cancel"
        trigger_name: run_cancel
        actor: ProductionScheduler
        preconditions: []
        side_effects:
          - "the run's quantity_kg stops consuming the line's ISO-week pool (capacity invariant INV-2 restored)"

  - entity: FinishedBatch
    initial_state: CREATED
    terminal_states: []
    parallel_dimensions: true
    dimensions:
      commercial_status:
        initial: CREATED
        terminal: [SHIPPED]
      quality_status:
        initial: CLEAR
        terminal: [RECALLED, WITHDRAWN]
    transitions:
      - from: "commercial CREATED (any quality)"
        to: "commercial SHIPPED"
        trigger: "POST /spice/batches/{id}/ship"
        trigger_name: batch_ship
        actor: SupplyPlanner
        preconditions:
          - "commercial_status == CREATED (else ERR_INVALID_STATE)"
          - "quality_status == CLEAR (else ERR_BATCH_NOT_SHIPPABLE)"
          - "no RecallCase with status == INITIATED has this batch in affected_batch_ids (else ERR_BATCH_NOT_SHIPPABLE)"
          - "(best_by_date - logical clock) / SHELF_LIFE_DAYS >= MIN_SHIP_REMAINING_SHELF_LIFE_PCT/100, at-threshold passes (else ERR_SHELF_LIFE_INSUFFICIENT)"
        side_effects: ["commercial_status -> SHIPPED"]
      - from: "quality CLEAR"
        to: "quality QUALITY_HOLD"
        trigger: "POST /spice/batches/{id}/hold"
        trigger_name: batch_hold_manual
        actor: QualityManager
        preconditions: []
        side_effects: ["quality_hold_cause = MANUAL; quality_hold_lot_id = null"]
      - from: "quality CLEAR"
        to: "quality QUALITY_HOLD"
        trigger: "system (adulterant cascade: a genealogy lot is auto-quarantined)"
        trigger_name: batch_hold_cascade
        actor: system
        preconditions: []
        side_effects: ["quality_hold_cause = LOT_QUARANTINE; quality_hold_lot_id = quarantined lot id"]
      - from: "quality CLEAR"
        to: "quality QUALITY_HOLD"
        trigger: "system (a RecallCase covering this batch is initiated)"
        trigger_name: batch_hold_recall
        actor: system
        preconditions: []
        side_effects: ["quality_hold_cause and quality_hold_lot_id unchanged if already set; else stay NONE/null"]
      - from: "quality QUALITY_HOLD"
        to: "quality CLEAR"
        trigger: "system (the quarantined cause lot is released via disposition ACCEPT and no INITIATED RecallCase covers the batch)"
        trigger_name: batch_hold_release
        actor: system
        preconditions: ["quality_hold_cause == LOT_QUARANTINE"]
        side_effects: ["quality_hold_cause = NONE; quality_hold_lot_id = null"]
      - from: "quality QUALITY_HOLD"
        to: "quality RECALLED"
        trigger: "system (a covering RecallCase closes; batch brand_type == BRANDED)"
        trigger_name: batch_recalled
        actor: system
        preconditions: []
        side_effects: []
      - from: "quality QUALITY_HOLD"
        to: "quality WITHDRAWN"
        trigger: "system (a covering RecallCase closes; batch brand_type == PRIVATE_LABEL — retailer shelf pull)"
        trigger_name: batch_withdrawn
        actor: system
        preconditions: []
        side_effects: []

  - entity: RecallCase
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: INITIATED
        trigger: "POST /spice/recall-cases/{id}/initiate"
        trigger_name: recall_initiate
        actor: RecallCoordinator
        preconditions: []
        side_effects:
          - "affected_batch_ids and affected_quantity_kg computed per calculations.recall_scope and persisted (empty set allowed: initiates with [])"
          - "every affected FinishedBatch with quality_status == CLEAR: -> QUALITY_HOLD"
      - from: INITIATED
        to: CLOSED
        trigger: "POST /spice/recall-cases/{id}/close"
        trigger_name: recall_close
        actor: RecallCoordinator
        preconditions: []
        side_effects:
          - "every affected batch with quality_status == QUALITY_HOLD: -> RECALLED if brand_type == BRANDED, -> WITHDRAWN if brand_type == PRIVATE_LABEL"
      - from: DRAFT
        to: CLOSED
        trigger: "system (auto-created AUTO_QUARANTINE case whose suspect lot is released before initiation)"
        trigger_name: recall_auto_close
        actor: system
        preconditions: []
        side_effects: ["affected_batch_ids -> []; affected_quantity_kg -> 0"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: production-run-create-stale-line
    parent_entity: ProductionLine
    write_endpoint: "POST /spice/production-runs"
    occ_field: expected_line_version
    description: |
      Scheduling a ProductionRun against a ProductionLine whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just scheduled a run on the same line (which
      legitimately consumed weekly pool capacity and possibly became the
      changeover predecessor) and the current writer's view of the line is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lot_test_result
    trigger: "when a SafetyTest is posted (POST /spice/lots/{id}/tests)"
    algorithm: threshold
    formula: |
      if test_type == ADULTERANT_SCREEN: result = FAIL iff measured_value >= LEAD_LIMIT_PPM (2.00)      # at-limit FAILS
      if test_type == PESTICIDE:         result = FAIL iff measured_value >= PESTICIDE_LIMIT_PPM (0.10) # at-limit FAILS
      if test_type == MICRO:             result = FAIL iff measured_value > MICRO_LIMIT_CFU_G (100000)  # at-limit PASSES
      if test_type == MOISTURE:          result = FAIL iff measured_value > MOISTURE_LIMIT_PCT (12.0)   # at-limit PASSES
      else result = PASS
    input_set: "the posted SafetyTest only"
    constants:
      LEAD_LIMIT_PPM: 2.00
      PESTICIDE_LIMIT_PPM: 0.10
      MICRO_LIMIT_CFU_G: 100000
      MOISTURE_LIMIT_PCT: 12.0
    precision: "measured_value compared exactly as posted (number); thresholds inclusive/exclusive as pinned per test type"
    variants: []

  - name: blend_lot_selection
    trigger: "POST /spice/blend-runs/{id}/commit (selection, residual, and spec check computed atomically inside commit)"
    algorithm: constraint_propagation
    formula: |
      for each FormulaLine i of the formula, in FormulaLine creation order:
        needed_i      = round_half_up(target_batch_kg * target_proportion_pct_i / 100, 3 decimals)
        cap_i         = floor(needed_i * MAX_SINGLE_LOT_SHARE_PCT / 100 * 1000) / 1000      # 3 decimals, ROUND_FLOOR
        candidates_i  = RawLots where status == ACCEPTED
                          AND spice_code == line.spice_code
                          AND flavor_intensity_units >= line.min_lot_flavor_units
                          AND (line.organic_required == false OR lot.organic_certified == true)
                          AND quantity_remaining_kg > 0
        if candidates_i is empty -> abort with ERR_NO_QUALIFYING_LOTS (persist nothing)
        order candidates_i by selection_policy:
          COST_MIN:  cost_per_kg_cents ASC, tie-break created_at ASC
          FIFO_AGE:  crop_year ASC,        tie-break created_at ASC
        remaining_need = needed_i
        for lot in ordered candidates_i:
          alloc = min(remaining_need, lot.quantity_remaining_kg, cap_i)   # all 3-decimal kg
          if alloc > 0: record allocation {lot_id, spice_code, allocated_kg: alloc}; remaining_need -= alloc
          if remaining_need <= 0: break
        if remaining_need > 0 -> abort with ERR_INSUFFICIENT_LOT_QUANTITY (persist nothing)
      blended_flavor  = sum(alloc_kg * lot.flavor_intensity_units) / sum(alloc_kg)   # exact decimal
      blended_moisture= sum(alloc_kg * lot.moisture_pct) / sum(alloc_kg)
      residual_flavor_pct = round_half_up((blended_flavor - target_flavor_units) / target_flavor_units * 100, 3 decimals)
      blended_moisture_pct = round_half_up(blended_moisture, 3 decimals)
      spec_status = WITHIN_SPEC iff |residual_flavor_pct| <= flavor_tolerance_pct AND blended_moisture_pct <= max_moisture_pct
                    else OUT_OF_SPEC -> abort commit with ERR_BLEND_OUT_OF_SPEC (computed fields persist, status stays DRAFT)
    input_set: "RawLots with status == ACCEPTED only (RECEIVED/IN_TEST/QUARANTINED/REJECTED/DEPLETED never selected)"
    constants:
      MAX_SINGLE_LOT_SHARE_PCT: 40.0
      ALLOCATION_QTY_DECIMALS: 3
    precision: "kg to 3 decimals exact decimal; residual to 3 decimals ROUND_HALF_UP; constants.DECIMAL_RULE applies"
    variants:
      - name: COST_MIN
        when: "BlendRun.selection_policy == COST_MIN"
        difference: "candidate order cost_per_kg_cents ASC, created_at ASC — cheapest lots consumed first"
      - name: FIFO_AGE
        when: "BlendRun.selection_policy == FIFO_AGE"
        difference: "candidate order crop_year ASC, created_at ASC — oldest crop consumed first; identical inputs yield different lot sets and different cost_total_cents whenever cost order and age order disagree"

  - name: blend_cost_rollup
    trigger: "inside blend commit, after blend_lot_selection succeeds in allocating all lines"
    algorithm: aggregation
    formula: |
      for each recorded allocation (in recording order):
        line_cost_cents = round_half_up(allocated_kg * lot.cost_per_kg_cents, 0 decimals)   # ROUND PER ALLOCATION FIRST
      subtotal_cents = sum(line_cost_cents)                                                  # THEN SUM
      overhead_cents = round_half_up(subtotal_cents * PRODUCTION_OVERHEAD_PCT / 100, 0 decimals)
      cost_total_cents = subtotal_cents + overhead_cents
      PINNED ORDER: round per allocation, then sum, then overhead. The alternative
      (sum raw per-allocation products, round once) yields different cents and is WRONG.
      All arithmetic exact decimal per constants.DECIMAL_RULE (binary float forbidden:
      1.005 * 100 must equal exactly 100.5 and round to 101).
    input_set: "the BlendRun's selected_allocations"
    constants:
      PRODUCTION_OVERHEAD_PCT: 3.5
    precision: "integer cents, ROUND_HALF_UP exact decimal at each pinned step"
    variants: []

  - name: weekly_line_capacity
    trigger: "evaluated when scheduling a ProductionRun or creating a CapacityReservation"
    algorithm: threshold
    formula: |
      iso_week(dt) = ISO-8601 week number of dt (Monday-start weeks)
      surge_multiplier(W) = SURGE_CAPACITY_MULTIPLIER if SURGE_WEEK_START <= W <= SURGE_WEEK_END else 1.0
      pool_kg(line, W) = floor(capacity_kg_per_shift * SHIFTS_PER_WEEK * surge_multiplier(W))
      scheduled_kg(line, W) = sum(quantity_kg of ProductionRuns on line with status in {SCHEDULED, COMPLETED}
                                  whose iso_week(window_start) == W)
      reserved_kg(line, W)  = sum(reserved_kg_per_week of CapacityReservations on line
                                  whose [window_start, window_end) intersects week W's [monday, next_monday) )
      free_kg(line, W) = pool_kg - scheduled_kg - reserved_kg   # must stay >= 0
      A new ProductionRun consumes pool of the single week iso_week(window_start).
      A new CapacityReservation consumes reserved_kg_per_week from EVERY week its window intersects.
    input_set: "ProductionRuns status in {SCHEDULED, COMPLETED} (CANCELLED excluded); all CapacityReservations on the line"
    constants:
      SHIFTS_PER_WEEK: 5
      SURGE_WEEK_START: 44
      SURGE_WEEK_END: 52
      SURGE_CAPACITY_MULTIPLIER: 1.25
    precision: "pool_kg integer (floor); quantities exact-decimal kg; a request that would drive free_kg negative is rejected"
    variants: []

  - name: changeover_class
    trigger: "when a ProductionRun is scheduled (POST /spice/production-runs), computed against its predecessor"
    algorithm: constraint_propagation
    formula: |
      predecessor P = the ProductionRun on the same line with status != CANCELLED and
                      window_end <= new.window_start, ordered by window_end DESC then created_at ASC, first row;
                      null if none.
      run_allergens(R) = set of FormulaLine.allergen_profile of R's formula, excluding NONE
      run_high_seg(R)  = R.formula.brand_type == PRIVATE_LABEL AND R.agreement.confidentiality_level == HIGH_SEGREGATION
      run_organic(R)   = every FormulaLine of R's formula has organic_required == true (empty formula => false)
      if P is null                                              -> NONE
      elif run_high_seg(P) OR run_high_seg(new)                 -> FULL_SANITATION
      elif run_allergens(P) is not a subset of run_allergens(new) -> WET_WASH     # allergen carryover risk
      elif run_organic(new) AND NOT run_organic(P)              -> WET_WASH       # non-organic -> organic transition
      elif run_allergens(P) == run_allergens(new) AND P.formula.brand_type == new.formula.brand_type
          AND (P.formula.brand_type != PRIVATE_LABEL OR P.private_label_agreement_id == new.private_label_agreement_id)
                                                                -> NONE
      else                                                      -> DRY_CLEAN
      Then: changeover_class_required must be a member of line.supported_changeover_classes,
      else the schedule is rejected with ERR_ALLERGEN_CHANGEOVER_INSUFFICIENT.
    input_set: "same-line ProductionRuns with status != CANCELLED; the new run's formula lines and agreement"
    constants:
      CHANGEOVER_CLASSES: [NONE, DRY_CLEAN, WET_WASH, FULL_SANITATION]
    precision: "exact set comparisons; deterministic predecessor ordering (window_end DESC, created_at ASC)"
    variants: []

  - name: recall_scope
    trigger: "POST /spice/recall-cases/{id}/initiate (and at that moment only — scope is frozen on the case)"
    algorithm: forward_looking
    formula: |
      base_suspect_lots(C):
        if suspect_lot_id set -> { that lot }
        else (suspect_batch_id set) -> the suspect batch's genealogy_lot_ids as a lot set
      FINAL variant:
        affected = FinishedBatches b where genealogy_lot_ids(b) INTERSECT base_suspect_lots(C) is non-empty
      PROVISIONAL variant (forward-looking cohort suspicion):
        cohort_lots = union over each suspect lot s of all RawLots L (any status except REJECTED)
                        with L.supplier_id == s.supplier_id AND L.spice_code == s.spice_code
                        AND L.crop_year == s.crop_year
        affected = FinishedBatches b where genealogy_lot_ids(b) INTERSECT (base_suspect_lots(C) UNION cohort_lots) non-empty
      affected_batch_ids sorted by FinishedBatch.created_at ASC; affected_quantity_kg = sum(quantity_kg) over affected.
      PROVISIONAL is a superset of FINAL; they diverge whenever a cohort lot reached a different batch.
    input_set: "all FinishedBatches regardless of quality_status/commercial_status; RawLots any status except REJECTED for cohort expansion"
    constants: {}
    precision: "set semantics; ordering by created_at ASC; quantity sum exact decimal kg"
    variants:
      - name: PROVISIONAL
        when: "RecallCase.scope_policy == PROVISIONAL"
        difference: "includes the supplier+spice+crop_year cohort — wider, forward-looking; used while investigation is open"
      - name: FINAL
        when: "RecallCase.scope_policy == FINAL"
        difference: "direct genealogy only — the confirmed legal scope; smaller whenever cohort lots exist outside the suspect genealogy"

  - name: shelf_life_remaining
    trigger: "POST /spice/batches/{id}/ship"
    algorithm: threshold
    formula: |
      remaining_days = (best_by_date - current logical clock) in whole days (floor of the exact duration)
      remaining_pct = remaining_days / SHELF_LIFE_DAYS * 100
      shippable iff remaining_pct >= MIN_SHIP_REMAINING_SHELF_LIFE_PCT (75.0)   # at-threshold PASSES
    input_set: "the FinishedBatch being shipped"
    constants:
      SHELF_LIFE_DAYS: 540
      MIN_SHIP_REMAINING_SHELF_LIFE_PCT: 75.0
    precision: "whole-day floor comparison; boundary at exactly 405 days remaining PASSES"
    variants: []

  - name: agreement_volume_rollup
    trigger: "POST /spice/production-runs/{id}/complete on a run with private_label_agreement_id set"
    algorithm: aggregation
    formula: |
      produced_ytd_kg(agreement) = sum(quantity_kg of COMPLETED ProductionRuns with private_label_agreement_id == agreement.id)
      commitment_met = produced_ytd_kg >= annual_commitment_kg     # at-threshold MET
    input_set: "COMPLETED ProductionRuns referencing the agreement (SCHEDULED and CANCELLED excluded)"
    constants: {}
    precision: "exact decimal kg; >= comparison, at-threshold counts as met"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the role is listed in the endpoint's roles; entity_backed ownership: SupplierRep may only read lots whose supplier_id == X-User-ID (reads of other suppliers' lots fail as NOT_FOUND at priority 4 semantics — id is invisible)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "request shape: required fields present, types valid, enum values in declared sets, unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "value-range/cross-field semantics: quantity_kg > 0, measured_value >= 0, CROP_YEAR_MIN <= crop_year <= CROP_YEAR_MAX, 0 < target_proportion_pct <= 100, reserved_kg_per_week > 0, capacity_kg_per_shift > 0, annual_commitment_kg > 0, window_end > window_start, product_codes non-empty"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"
  - priority: 5
    category: existence
    check: "path ids and body FK references resolve to existing entities (supplier_id, formula_id, line_id, blend_run_id, private_label_agreement_id, agreement_id, suspect_lot_id, suspect_batch_id, supersedes_formula_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all parameterized endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_line_version == ProductionLine.version on POST /spice/production-runs (concurrency_rules[production-run-create-stale-line])"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /spice/production-runs"
  - priority: 7
    category: state
    check: "target entity in a legal from-state: lot non-terminal for tests/disposition (REJECTED/DEPLETED -> ERR_LOT_TERMINAL); blend run DRAFT for commit; blend run DRAFT|COMMITTED for void and not referenced by a COMPLETED run; formula DRAFT for line-add/activate; production run SCHEDULED for complete/cancel; batch commercial CREATED for ship; recall DRAFT for initiate, INITIATED for close"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: state
    check: "lot-specific terminal guard: POST tests or disposition on REJECTED or DEPLETED lot"
    error_id: ERR_LOT_TERMINAL
    http_status: 409
    applies_to: "POST /spice/lots/{id}/tests, POST /spice/lots/{id}/disposition"
  - priority: 9
    category: business_safety
    check: "segregation of duties on disposition: no SafetyTest on the lot has analyst_user_id == X-User-ID"
    error_id: ERR_DISPOSITION_FORBIDDEN
    http_status: 403
    applies_to: "POST /spice/lots/{id}/disposition"
  - priority: 10
    category: business_safety
    check: "changeover: computed changeover_class_required must be a member of the line's supported_changeover_classes"
    error_id: ERR_ALLERGEN_CHANGEOVER_INSUFFICIENT
    http_status: 409
    applies_to: "POST /spice/production-runs"
  - priority: 11
    category: business_safety
    check: "ship gates: batch quality_status == CLEAR and no INITIATED RecallCase covers the batch"
    error_id: ERR_BATCH_NOT_SHIPPABLE
    http_status: 409
    applies_to: "POST /spice/batches/{id}/ship"
  - priority: 12
    category: business_safety
    check: "ACCEPT gates: the latest SafetyTest per test_type (by created_at) is not FAIL"
    error_id: ERR_LOT_HAS_FAILING_TEST
    http_status: 409
    applies_to: "POST /spice/lots/{id}/disposition with action=ACCEPT"
  - priority: 13
    category: business_referential
    check: "referenced BlendFormula is ACTIVE (blend-run create, production-run create)"
    error_id: ERR_FORMULA_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /spice/blend-runs, POST /spice/production-runs"
  - priority: 14
    category: business_referential
    check: "referenced BlendRun is COMMITTED (production-run create)"
    error_id: ERR_BLEND_RUN_NOT_COMMITTED
    http_status: 409
    applies_to: "POST /spice/production-runs"
  - priority: 15
    category: business_temporal
    check: "line window overlap: half-open [window_start, window_end) must not intersect any non-CANCELLED run on the same line; adjacency (end == start) is allowed"
    error_id: ERR_LINE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /spice/production-runs"
  - priority: 16
    category: business_temporal
    check: "shelf life: (best_by_date - now)/SHELF_LIFE_DAYS >= 75% at ship time"
    error_id: ERR_SHELF_LIFE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /spice/batches/{id}/ship"
  - priority: 17
    category: business_constraint
    check: "test disposition ACCEPT requires >= 1 PASS per REQUIRED_TEST_SUITE type"
    error_id: ERR_TEST_SUITE_INCOMPLETE
    http_status: 409
    applies_to: "POST /spice/lots/{id}/disposition with action=ACCEPT"
  - priority: 18
    category: business_constraint
    check: "product_code uniqueness among DRAFT+ACTIVE formulas unless supersedes_formula_id chains the same product_code"
    error_id: ERR_DUPLICATE_PRODUCT_CODE
    http_status: 409
    applies_to: "POST /spice/formulas"
  - priority: 19
    category: business_constraint
    check: "formula activation: |sum(target_proportion_pct) - 100.0| <= 0.01"
    error_id: ERR_PROPORTION_SUM_INVALID
    http_status: 422
    applies_to: "POST /spice/formulas/{id}/activate"
  - priority: 20
    category: business_constraint
    check: "PRIVATE_LABEL run requires private_label_agreement_id"
    error_id: ERR_AGREEMENT_REQUIRED
    http_status: 422
    applies_to: "POST /spice/production-runs"
  - priority: 21
    category: business_constraint
    check: "formula.product_code must be a member of the agreement's product_codes"
    error_id: ERR_PRODUCT_NOT_IN_AGREEMENT
    http_status: 422
    applies_to: "POST /spice/production-runs with private_label_agreement_id"
  - priority: 22
    category: business_constraint
    check: "production run quantity_kg must equal the referenced BlendRun.target_batch_kg"
    error_id: ERR_QUANTITY_MISMATCH
    http_status: 422
    applies_to: "POST /spice/production-runs"
  - priority: 23
    category: business_constraint
    check: "production run formula_id must equal the referenced BlendRun.formula_id"
    error_id: ERR_FORMULA_MISMATCH
    http_status: 422
    applies_to: "POST /spice/production-runs"
  - priority: 24
    category: business_constraint
    check: "recall create: exactly one of suspect_lot_id / suspect_batch_id present, for every trigger_type"
    error_id: ERR_RECALL_SCOPE_INVALID
    http_status: 422
    applies_to: "POST /spice/recall-cases"
  - priority: 25
    category: business_constraint
    check: "blend commit: per-line candidate pool non-empty"
    error_id: ERR_NO_QUALIFYING_LOTS
    http_status: 422
    applies_to: "POST /spice/blend-runs/{id}/commit"
  - priority: 26
    category: business_fiscal
    check: "blend commit: per-line sum of max-allocatable kg (min of remaining, cap) >= needed kg"
    error_id: ERR_INSUFFICIENT_LOT_QUANTITY
    http_status: 409
    applies_to: "POST /spice/blend-runs/{id}/commit"
  - priority: 27
    category: business_fiscal
    check: "blend commit: |residual_flavor_pct| <= tolerance AND blended_moisture_pct <= max_moisture_pct"
    error_id: ERR_BLEND_OUT_OF_SPEC
    http_status: 422
    applies_to: "POST /spice/blend-runs/{id}/commit"
  - priority: 28
    category: business_fiscal
    check: "weekly pool: scheduling the run would drive free_kg(line, iso_week(window_start)) negative"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /spice/production-runs"
  - priority: 29
    category: business_fiscal
    check: "weekly pool: creating the reservation would drive free_kg negative for any ISO week its window intersects"
    error_id: ERR_RESERVATION_OVER_COMMIT
    http_status: 409
    applies_to: "POST /spice/reservations"

# =============================================================================
# 1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Before any call, the logical clock reads exactly constants.CLOCK_DEFAULT_UTC = 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all subsequent date arithmetic (shelf life, ISO weeks) uses the new clock value"]

  # --- Supplier ---
  - method: POST
    path: "/spice/suppliers"
    description: "Register a supplier"
    roles: [SupplyPlanner]
    code: 201
    input: [name, origin_country, "certifications?", "knowledge_tier?"]
    output: Supplier
    side_effects: []

  # --- RawLot ---
  - method: POST
    path: "/spice/lots"
    description: "Receive a raw spice lot (status RECEIVED)"
    roles: [SupplyPlanner]
    code: 201
    input: [supplier_id, spice_code, origin_region, crop_year, quantity_kg, flavor_intensity_units, moisture_pct, cost_per_kg_cents, allergen_profile, "organic_certified?"]
    output: RawLot
    side_effects: ["quantity_remaining_kg = quantity_kg; quantity_consumed_kg = 0; quantity_wasted_kg = 0; status = RECEIVED"]

  - method: GET
    path: "/spice/lots/{id}"
    description: "Get a RawLot. SupplierRep sees only lots whose supplier_id == X-User-ID."
    roles: [SupplyPlanner, QualityAnalyst, QualityManager, FlavorScientist, ProductionScheduler, SupplierRep]
    code: 200
    input: []
    output: RawLot
    side_effects: []

  - method: GET
    path: "/spice/lots"
    description: "List RawLots with pagination; SupplierRep results are implicitly restricted to supplier_id == X-User-ID"
    roles: [SupplyPlanner, QualityAnalyst, QualityManager, FlavorScientist, ProductionScheduler, SupplierRep]
    code: 200
    input: ["supplier_id?", "status?", "spice_code?", "crop_year?", "limit?", "offset?"]
    output: RawLot[]
    side_effects: []

  - method: POST
    path: "/spice/lots/{id}/disposition"
    description: "Quality disposition of an IN_TEST or QUARANTINED lot (segregation of duties enforced)"
    roles: [QualityManager]
    code: 200
    input: [action, "reason?"]
    output: RawLot
    side_effects:
      - "action ACCEPT: IN_TEST|QUARANTINED -> ACCEPTED (suite + zero-FAIL + SoD gates); QUARANTINED release also clears cascade batch holds and auto-closes DRAFT AUTO_QUARANTINE recalls for this lot"
      - "action QUARANTINE: IN_TEST -> QUARANTINED"
      - "action REJECT: IN_TEST|QUARANTINED -> REJECTED; quantity_wasted_kg += quantity_remaining_kg; quantity_remaining_kg = 0"

  # --- SafetyTest ---
  - method: POST
    path: "/spice/lots/{id}/tests"
    description: "Record a safety test result on a lot (immutable). Auto-transitions: RECEIVED->IN_TEST on first test; QUARANTINED->IN_TEST on retest; ADULTERANT_SCREEN FAIL auto-quarantines and fires the recall cascade."
    roles: [QualityAnalyst]
    code: 201
    input: [test_type, measured_value, lab_code]
    output: SafetyTest
    side_effects:
      - "result computed per calculations.lot_test_result; analyst_user_id = X-User-ID"
      - "lot RECEIVED -> IN_TEST (first test) or QUARANTINED -> IN_TEST (retest)"
      - "ADULTERANT_SCREEN FAIL: lot IN_TEST|ACCEPTED -> QUARANTINED; every FinishedBatch with that lot in genealogy_lot_ids and quality_status == CLEAR -> QUALITY_HOLD (cause LOT_QUARANTINE); if at least one batch was held and no DRAFT|INITIATED RecallCase with suspect_lot_id == this lot exists, auto-create RecallCase(trigger_type=LOT_SUSPECT, suspect_lot_id=lot, scope_policy=PROVISIONAL, source=AUTO_QUARANTINE, status=DRAFT)"

  - method: GET
    path: "/spice/lots/{id}/tests"
    description: "List SafetyTests recorded on a lot"
    roles: [QualityAnalyst, QualityManager, SupplyPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: SafetyTest[]
    side_effects: []

  # --- BlendFormula ---
  - method: POST
    path: "/spice/formulas"
    description: "Create a proprietary blend formula (status DRAFT)"
    roles: [FlavorScientist]
    code: 201
    input: [product_code, name, brand_type, target_flavor_units, "flavor_tolerance_pct?", "max_moisture_pct?", "supersedes_formula_id?"]
    output: BlendFormula
    side_effects: ["status = DRAFT; revision = 1 or superseded formula's revision + 1"]

  - method: GET
    path: "/spice/formulas/{id}"
    description: "Get a BlendFormula (full view)"
    roles: [FlavorScientist, ProductionScheduler]
    code: 200
    input: []
    output: BlendFormula
    side_effects: []

  - method: GET
    path: "/spice/formulas"
    description: "List BlendFormulas with pagination"
    roles: [FlavorScientist, ProductionScheduler]
    code: 200
    input: ["status?", "brand_type?", "product_code?", "supersedes_formula_id?", "limit?", "offset?"]
    output: BlendFormula[]
    side_effects: []

  - method: POST
    path: "/spice/formulas/{id}/lines"
    description: "Add a component line to a DRAFT formula; system assigns masked_component_code CMP-A, CMP-B, ... by creation order"
    roles: [FlavorScientist]
    code: 201
    input: [spice_code, target_proportion_pct, allergen_profile, "organic_required?", min_lot_flavor_units]
    output: FormulaLine
    side_effects: ["masked_component_code assigned"]

  - method: GET
    path: "/spice/formulas/{id}/lines"
    description: "List formula lines. FlavorScientist sees all fields. SupplierRep receives the masked view: spice_code and target_proportion_pct are replaced by null; masked_component_code, allergen_profile, organic_required, min_lot_flavor_units remain visible."
    roles: [FlavorScientist, SupplierRep]
    code: 200
    input: ["limit?", "offset?"]
    output: FormulaLine[]
    side_effects: []

  - method: POST
    path: "/spice/formulas/{id}/activate"
    description: "Activate a DRAFT formula; supersedes any ACTIVE formula with the same product_code"
    roles: [FlavorScientist]
    code: 200
    input: []
    output: BlendFormula
    side_effects: ["status -> ACTIVE; other ACTIVE same-product_code formulas -> RETIRED"]

  # --- BlendRun ---
  - method: POST
    path: "/spice/blend-runs"
    description: "Create a blend run (status DRAFT) against an ACTIVE formula"
    roles: [FlavorScientist]
    code: 201
    input: [formula_id, selection_policy, target_batch_kg]
    output: BlendRun
    side_effects: ["status = DRAFT; computed fields null"]

  - method: GET
    path: "/spice/blend-runs/{id}"
    description: "Get a BlendRun including persisted computation fields"
    roles: [FlavorScientist, ProductionScheduler]
    code: 200
    input: []
    output: BlendRun
    side_effects: []

  - method: GET
    path: "/spice/blend-runs"
    description: "List BlendRuns with pagination"
    roles: [FlavorScientist, ProductionScheduler]
    code: 200
    input: ["formula_id?", "status?", "limit?", "offset?"]
    output: BlendRun[]
    side_effects: []

  - method: POST
    path: "/spice/blend-runs/{id}/commit"
    description: "Compute selection + cost rollup and, if WITHIN_SPEC, atomically consume lot quantities (DRAFT -> COMMITTED). Failures persist computed fields reached so far and leave status DRAFT."
    roles: [FlavorScientist]
    code: 200
    input: []
    output: BlendRun
    side_effects:
      - "on success: lot.quantity_remaining_kg -= allocated_kg, lot.quantity_consumed_kg += allocated_kg per allocation; lots reaching exactly 0 remaining -> DEPLETED"
      - "selected_allocations, residual_flavor_pct, blended_moisture_pct, cost_total_cents, spec_status persisted"
      - "increments BlendRun.version by 1 on every commit attempt (success or persisted failure)"

  - method: POST
    path: "/spice/blend-runs/{id}/void"
    description: "Void a DRAFT or COMMITTED blend run; COMMITTED void restores lot quantities (compensating action)"
    roles: [FlavorScientist]
    code: 200
    input: []
    output: BlendRun
    side_effects:
      - "COMMITTED: per allocation lot.quantity_consumed_kg -= allocated_kg, lot.quantity_remaining_kg += allocated_kg; DEPLETED lots with remaining > 0 -> ACCEPTED"
      - "status -> VOIDED"

  # --- ProductionLine ---
  - method: POST
    path: "/spice/lines"
    description: "Create a production line"
    roles: [PlatformAdmin]
    code: 201
    input: [name, capacity_kg_per_shift, supported_changeover_classes]
    output: ProductionLine
    side_effects: []

  - method: GET
    path: "/spice/lines/{id}"
    description: "Get a ProductionLine (version field drives run-scheduling OCC)"
    roles: [PlatformAdmin, ProductionScheduler, FlavorScientist]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []

  # --- ProductionRun ---
  - method: POST
    path: "/spice/production-runs"
    description: "Schedule a production run (OCC-guarded on the line's version). Computes predecessor + changeover_class_required; enforces weekly capacity pool."
    roles: [ProductionScheduler]
    code: 201
    input: [line_id, formula_id, blend_run_id, "private_label_agreement_id?", quantity_kg, window_start, window_end, expected_line_version]
    output: ProductionRun
    side_effects:
      - "status = SCHEDULED; predecessor_run_id and changeover_class_required computed per calculations.changeover_class"
      - "quantity_kg consumes pool of ISO week iso_week(window_start) per calculations.weekly_line_capacity"
      - "increments ProductionLine.version by 1"
    concurrency: "concurrency_rules[production-run-create-stale-line]"

  - method: GET
    path: "/spice/production-runs/{id}"
    description: "Get a ProductionRun"
    roles: [ProductionScheduler, QualityManager, RecallCoordinator, SupplyPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: GET
    path: "/spice/production-runs"
    description: "List ProductionRuns with pagination"
    roles: [ProductionScheduler, QualityManager, RecallCoordinator, SupplyPlanner]
    code: 200
    input: ["line_id?", "formula_id?", "blend_run_id?", "private_label_agreement_id?", "status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []

  - method: POST
    path: "/spice/production-runs/{id}/complete"
    description: "Complete a SCHEDULED run; creates the FinishedBatch and rolls agreement volume"
    roles: [ProductionScheduler]
    code: 200
    input: []
    output: ProductionRun
    side_effects:
      - "status -> COMPLETED"
      - "create FinishedBatch (genealogy from blend run; produced_at = logical clock; best_by_date = produced_at + 540 days)"
      - "agreement.produced_ytd_kg += quantity_kg and commitment_met recomputed when private_label_agreement_id set"

  - method: POST
    path: "/spice/production-runs/{id}/cancel"
    description: "Cancel a SCHEDULED run; releases its weekly pool consumption"
    roles: [ProductionScheduler]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status -> CANCELLED; quantity_kg no longer consumes weekly pool"]

  # --- FinishedBatch ---
  - method: GET
    path: "/spice/batches/{id}"
    description: "Get a FinishedBatch"
    roles: [QualityManager, RecallCoordinator, SupplyPlanner, ProductionScheduler]
    code: 200
    input: []
    output: FinishedBatch
    side_effects: []

  - method: GET
    path: "/spice/batches"
    description: "List FinishedBatches with pagination"
    roles: [QualityManager, RecallCoordinator, SupplyPlanner, ProductionScheduler]
    code: 200
    input: ["production_run_id?", "product_code?", "commercial_status?", "quality_status?", "limit?", "offset?"]
    output: FinishedBatch[]
    side_effects: []

  - method: POST
    path: "/spice/batches/{id}/ship"
    description: "Ship a batch to retail/foodservice (commercial CREATED -> SHIPPED); gated on quality CLEAR, no covering INITIATED recall, and >= 75% shelf life remaining"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: FinishedBatch
    side_effects: ["commercial_status -> SHIPPED"]

  - method: POST
    path: "/spice/batches/{id}/hold"
    description: "Manually place a batch on quality hold (CLEAR -> QUALITY_HOLD, cause MANUAL)"
    roles: [QualityManager]
    code: 200
    input: ["note?"]
    output: FinishedBatch
    side_effects: ["quality_status -> QUALITY_HOLD; quality_hold_cause = MANUAL"]

  # --- RecallCase ---
  - method: POST
    path: "/spice/recall-cases"
    description: "Open a recall case (status DRAFT); exactly one suspect reference required"
    roles: [RecallCoordinator]
    code: 201
    input: [trigger_type, "suspect_lot_id?", "suspect_batch_id?", scope_policy]
    output: RecallCase
    side_effects: ["status = DRAFT; source = MANUAL; affected_batch_ids = []; affected_quantity_kg = 0"]

  - method: GET
    path: "/spice/recall-cases/{id}"
    description: "Get a RecallCase"
    roles: [RecallCoordinator, QualityManager, PlatformAdmin]
    code: 200
    input: []
    output: RecallCase
    side_effects: []

  - method: GET
    path: "/spice/recall-cases"
    description: "List RecallCases with pagination"
    roles: [RecallCoordinator, QualityManager, PlatformAdmin]
    code: 200
    input: ["status?", "suspect_lot_id?", "suspect_batch_id?", "limit?", "offset?"]
    output: RecallCase[]
    side_effects: []

  - method: POST
    path: "/spice/recall-cases/{id}/initiate"
    description: "Freeze scope per calculations.recall_scope and hold affected CLEAR batches"
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: RecallCase
    side_effects: ["status -> INITIATED; affected batches CLEAR -> QUALITY_HOLD"]

  - method: POST
    path: "/spice/recall-cases/{id}/close"
    description: "Close an INITIATED case; affected held batches -> RECALLED (BRANDED) or WITHDRAWN (PRIVATE_LABEL)"
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: RecallCase
    side_effects: ["status -> CLOSED; batch quality transitions per FinishedBatch.batch_recalled / batch_withdrawn"]

  # --- PrivateLabelAgreement ---
  - method: POST
    path: "/spice/agreements"
    description: "Create a private-label / foodservice-industrial agreement (NDA-governed custom development scope)"
    roles: [ProductionScheduler]
    code: 201
    input: [retailer_name, product_codes, "confidentiality_level?", annual_commitment_kg, "development_nda_signed?"]
    output: PrivateLabelAgreement
    side_effects: ["produced_ytd_kg = 0; commitment_met = false"]

  - method: GET
    path: "/spice/agreements/{id}"
    description: "Get an agreement (produced_ytd_kg, commitment_met)"
    roles: [ProductionScheduler, SupplyPlanner]
    code: 200
    input: []
    output: PrivateLabelAgreement
    side_effects: []

  # --- CapacityReservation ---
  - method: POST
    path: "/spice/reservations"
    description: "Reserve weekly line capacity over a window (seasonal surge planning); aggregate pool semantics per calculations.weekly_line_capacity"
    roles: [ProductionScheduler]
    code: 201
    input: [line_id, "agreement_id?", window_start, window_end, reserved_kg_per_week]
    output: CapacityReservation
    side_effects: ["reserved_kg_per_week consumes every intersected ISO week's pool"]

  - method: GET
    path: "/spice/reservations/{id}"
    description: "Get a CapacityReservation"
    roles: [ProductionScheduler, SupplyPlanner]
    code: 200
    input: []
    output: CapacityReservation
    side_effects: []

  - method: GET
    path: "/spice/reservations"
    description: "List CapacityReservations with pagination"
    roles: [ProductionScheduler, SupplyPlanner]
    code: 200
    input: ["line_id?", "agreement_id?", "limit?", "offset?"]
    output: CapacityReservation[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or role not in the catalog" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per §1.5 roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unknown field, or enum value outside the declared set" }
  - { id: ERR_VALIDATION, http: 422, condition: "Field range or cross-field semantics violated (non-positive quantity, crop_year out of 2000..2100, window_end <= window_start, empty product_codes, ...)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve (including SupplierRep reading another supplier's lot)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_line_version != ProductionLine.version on POST /spice/production-runs" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity in an illegal from-state for the action (generic state-machine violation)" }
  - { id: ERR_LOT_TERMINAL, http: 409, condition: "Test or disposition attempted on a REJECTED or DEPLETED RawLot" }
  - { id: ERR_DISPOSITION_FORBIDDEN, http: 403, condition: "Segregation of duties: disposition attempted by the same X-User-ID that posted a SafetyTest on the lot" }
  - { id: ERR_LOT_HAS_FAILING_TEST, http: 409, condition: "ACCEPT disposition while any recorded SafetyTest on the lot has result == FAIL" }
  - { id: ERR_TEST_SUITE_INCOMPLETE, http: 409, condition: "ACCEPT disposition without at least one PASS SafetyTest for each of MICRO, ADULTERANT_SCREEN, MOISTURE" }
  - { id: ERR_DUPLICATE_PRODUCT_CODE, http: 409, condition: "product_code already used by a DRAFT or ACTIVE formula and supersedes_formula_id does not chain it" }
  - { id: ERR_PROPORTION_SUM_INVALID, http: 422, condition: "Formula activation with |sum(target_proportion_pct) - 100.0| > 0.01 (including an empty formula)" }
  - { id: ERR_FORMULA_NOT_ACTIVE, http: 409, condition: "Blend-run create/commit or production-run create referencing a DRAFT or RETIRED formula" }
  - { id: ERR_FORMULA_MISMATCH, http: 422, condition: "Production run formula_id != referenced BlendRun.formula_id" }
  - { id: ERR_NO_QUALIFYING_LOTS, http: 422, condition: "Blend commit: a formula line has an empty ACCEPTED candidate pool" }
  - { id: ERR_INSUFFICIENT_LOT_QUANTITY, http: 409, condition: "Blend commit: per-line max-allocatable kg (respecting the 40% single-lot cap) is below the needed kg" }
  - { id: ERR_BLEND_OUT_OF_SPEC, http: 422, condition: "Blend commit: |residual_flavor_pct| > tolerance or blended_moisture_pct > max_moisture_pct" }
  - { id: ERR_BLEND_RUN_NOT_COMMITTED, http: 409, condition: "Production-run create referencing a BlendRun not in COMMITTED" }
  - { id: ERR_QUANTITY_MISMATCH, http: 422, condition: "Production-run quantity_kg != referenced BlendRun.target_batch_kg" }
  - { id: ERR_AGREEMENT_REQUIRED, http: 422, condition: "PRIVATE_LABEL production run without private_label_agreement_id" }
  - { id: ERR_PRODUCT_NOT_IN_AGREEMENT, http: 422, condition: "Formula product_code not listed in the referenced agreement's product_codes" }
  - { id: ERR_ALLERGEN_CHANGEOVER_INSUFFICIENT, http: 409, condition: "Required changeover class not in the line's supported_changeover_classes" }
  - { id: ERR_LINE_WINDOW_CONFLICT, http: 409, condition: "Half-open [window_start, window_end) intersects a non-CANCELLED run on the same line" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Scheduling the run would drive the line's ISO-week pool negative" }
  - { id: ERR_RESERVATION_OVER_COMMIT, http: 409, condition: "Creating the reservation would drive an intersected ISO week's pool negative" }
  - { id: ERR_BATCH_NOT_SHIPPABLE, http: 409, condition: "Ship attempted while quality_status != CLEAR or an INITIATED RecallCase covers the batch" }
  - { id: ERR_SHELF_LIFE_INSUFFICIENT, http: 409, condition: "Ship attempted with less than 75% of shelf life remaining" }
  - { id: ERR_RECALL_SCOPE_INVALID, http: 422, condition: "Recall create without exactly one of suspect_lot_id / suspect_batch_id" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operations administrator; owns the logical clock and production-line master data"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /spice/lines"
    shared_operations:
      - "GET /spice/lines/{id}"
      - "GET /spice/recall-cases, GET /spice/recall-cases/{id}"
  - name: SupplyPlanner
    description: "Global sourcing planner; registers suppliers, receives raw lots, ships finished batches"
    identity: opaque
    exclusive_operations:
      - "POST /spice/suppliers"
      - "POST /spice/lots"
      - "POST /spice/batches/{id}/ship"
    shared_operations:
      - "GET /spice/lots, GET /spice/lots/{id}"
      - "GET /spice/lots/{id}/tests"
      - "GET /spice/batches, GET /spice/batches/{id}"
      - "GET /spice/production-runs, GET /spice/production-runs/{id}"
      - "GET /spice/agreements/{id}"
      - "GET /spice/reservations, GET /spice/reservations/{id}"
  - name: QualityAnalyst
    description: "Food-safety lab analyst; posts safety test results"
    identity: opaque
    exclusive_operations:
      - "POST /spice/lots/{id}/tests"
    shared_operations:
      - "GET /spice/lots, GET /spice/lots/{id}"
      - "GET /spice/lots/{id}/tests"
  - name: QualityManager
    description: "Quality disposition authority; segregated from test posting (same X-User-ID may not disposition a lot it tested)"
    identity: opaque
    exclusive_operations:
      - "POST /spice/lots/{id}/disposition"
      - "POST /spice/batches/{id}/hold"
    shared_operations:
      - "GET /spice/lots, GET /spice/lots/{id}"
      - "GET /spice/lots/{id}/tests"
      - "GET /spice/batches, GET /spice/batches/{id}"
      - "GET /spice/production-runs, GET /spice/production-runs/{id}"
