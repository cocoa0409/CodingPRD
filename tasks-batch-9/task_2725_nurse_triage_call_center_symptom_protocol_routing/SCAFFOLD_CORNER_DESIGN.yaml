  # ==========================================================================
  - section: errors
    instances:

      - name: missing_or_malformed_auth_headers_return_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]         # ERR_UNAUTHENTICATED
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope.error
        distinguishing_aspect: "Authentication is checked before anything else, so a missing X-User-Role, a missing X-User-ID and an unrecognised role string all fail as 401 ERR_UNAUTHENTICATED on both reads and writes — never as 403, never as 404 for an id that does not exist, and never as 400 for the malformed body that accompanies them."
        test_recipe:
          setup:
            - "Clock left at its default; no data is required because authentication precedes every other check."
          setup_api_calls: []
          trigger:
            - call: "GET /triage-calls/00000000-0000-4000-8000-000000000000"
              as: none          # request sent with no X-User-Role and no X-User-ID header
              expect_error: ERR_UNAUTHENTICATED
              expect_status: 401
            - call: "POST /practices"
              payload: { name: "No Auth Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225 }
              as: none          # X-User-Role omitted, X-User-ID present
              expect_error: ERR_UNAUTHENTICATED
              expect_status: 401
            - call: "GET /symptom-protocols"
              as: none          # X-User-Role sent as the unrecognised value NurseManager
              expect_error: ERR_UNAUTHENTICATED
              expect_status: 401
            - call: "POST /nurses"
              payload: { full_name: "", seniority_level: 99 }
              as: none          # both headers omitted and the body is invalid as well
              expect_error: ERR_UNAUTHENTICATED
              expect_status: 401
          assert:
            - "every trigger response carries error_id ERR_UNAUTHENTICATED with HTTP status 401"
            - "each error body has response_type error and data.error_id, with meta.api_request_id and meta.api_request_timestamp present"
            - "the fourth response is 401 rather than 400, proving authentication is evaluated before request-body validation"
            - "no Practice and no Nurse row was created by any of the four attempts"

      - name: error_envelope_is_uniform_when_each_failure_class_is_rejected
        claim_type: Violation → Error
        grounds:
          - response_envelope.error
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_PATIENT_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_CALL_INVALID_STATE]
        distinguishing_aspect: "One test walks four different failure classes — 403, 404, 400 and 409 — and shows they share a single envelope shape: response_type error, a data.error_id from the §1.6 catalogue and no data.id or partial entity payload leaking through. HTTP status and error_id must agree with the catalogue in every case."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:30:00Z; one practice and one fresh INTAKE call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225 }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "chest discomfort" }
              as: IntakeAgent
              captures: { call_id: $.data.id }
          trigger:
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3 }
              as: TriageNurse
              expect_error: ERR_UNAUTHORIZED
              expect_status: 403
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              as: IntakeAgent
              expect_error: ERR_PATIENT_NOT_FOUND
              expect_status: 404
            - call: "POST /triage-calls/${call_id}/match-patient"
              payload: { patient_id: "not-a-uuid", match_method: "FINGERPRINT" }
              as: IntakeAgent
              expect_error: ERR_INVALID_REQUEST
              expect_status: 400
            - call: "POST /triage-calls/${call_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Dana Reyes" }
              as: IntakeAgent
              expect_error: ERR_CALL_INVALID_STATE
              expect_status: 409
          assert:
            - "the four trigger responses return 403 / 404 / 400 / 409 in that order with error_id ERR_UNAUTHORIZED, ERR_PATIENT_NOT_FOUND, ERR_INVALID_REQUEST and ERR_CALL_INVALID_STATE respectively"
            - "every one of the four bodies has response_type error and exposes only meta and data.error_id plus data.message"
            - "no response body contains a data.id, a version or any entity field"
            - "TriageCall.${call_id}.status == INTAKE and TriageCall.${call_id}.version == 1 after all four attempts"

  # ==========================================================================
  - section: rbac
    instances:

      - name: write_endpoints_outside_their_declared_role_set_are_rejected
        claim_type: Role Exclusivity
        grounds:
          - validations[priority=2]         # ERR_UNAUTHORIZED
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Authorization is evaluated before existence, so every one of these attempts is 403 even though the path ids are nil UUIDs that could never be found: a liaison cannot create practices, a charge nurse cannot score protocols or file audit outcomes, an intake agent cannot score a protocol or verify a callback, and a triage nurse cannot perform the two supervisory ChargeNurse operations."
        test_recipe:
          setup:
            - "No data at all — the point of the instance is that the role check fires before any lookup."
          setup_api_calls: []
          trigger:
            - call: "POST /practices"
              payload: { name: "Liaison Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225 }
              as: PracticeLiaison
              expect_error: ERR_UNAUTHORIZED
              expect_status: 403
            - call: "POST /symptom-protocols"
              payload: { code: "CHEST_PAIN", title: "Chest Pain In Adults", base_severity: 62, min_age_years: 0, max_age_years: 120 }
              as: ChargeNurse
              expect_error: ERR_UNAUTHORIZED
              expect_status: 403
            - call: "PATCH /practices/00000000-0000-4000-8000-000000000000/status"
              payload: { status: "SUSPENDED" }
              as: ChargeNurse
              expect_error: ERR_UNAUTHORIZED
              expect_status: 403
            - call: "POST /triage-calls/00000000-0000-4000-8000-000000000000/assessments"
              payload: { protocol_id: "00000000-0000-4000-8000-000000000001", confirmation_mode: "CONFIRMED", red_flag_count: 0 }
              as: IntakeAgent
              expect_error: ERR_UNAUTHORIZED
              expect_status: 403
            - call: "POST /callback-tasks/00000000-0000-4000-8000-000000000000/verify"
              payload: { patient_condition: "IMPROVED", advice_followed: true, verifier_attestation: "An intake agent has no clinical standing to verify a callback outcome at all." }
              as: IntakeAgent
              expect_error: ERR_UNAUTHORIZED
              expect_status: 403
            - call: "POST /dispositions/00000000-0000-4000-8000-000000000000/override"
              payload: { final_level: "URGENT_CARE_24H", override_reason_code: "CLINICIAN_DIRECTED", override_narrative: "A triage nurse may never perform the supervisory override operation." }
              as: TriageNurse
              expect_error: ERR_UNAUTHORIZED
              expect_status: 403
            - call: "POST /triage-calls/00000000-0000-4000-8000-000000000000/reopen"
              payload: { reopen_reason: "A triage nurse may not reopen a closed call either." }
              as: TriageNurse
              expect_error: ERR_UNAUTHORIZED
              expect_status: 403
            - call: "POST /dispositions/00000000-0000-4000-8000-000000000000/audit-records"
              payload: { reported_outcome: "ED_ADMITTED", outcome_source: "EHR_CLAIM", outcome_observed_at: "2026-08-03T20:00:00Z" }
              as: ChargeNurse
              expect_error: ERR_UNAUTHORIZED
              expect_status: 403
          assert:
            - "every trigger response carries error_id ERR_UNAUTHORIZED with HTTP status 403"
            - "no response is 404, proving priority 2 is evaluated before the priority 4-13 existence checks"
            - "no Practice, SymptomProtocol, ProtocolAssessment or ComplianceAuditRecord row exists afterwards"

      - name: practice_liaison_cannot_read_another_practices_compliance_summary
        claim_type: Role Scoping
        grounds:
          - validations[priority=15]        # ERR_PRACTICE_SCOPE_VIOLATION
          - roles.PracticeLiaison
        distinguishing_aspect: "PracticeLiaison is entity-backed on Practice, so scoping is decided by comparing X-User-ID with the {id} in the path rather than by the role name: liaison_1 is refused on all four of practice_2's scoped paths — including the activate write on practice_2's own coverage window — yet the identical requests against practice_1 succeed, and a PlatformAdmin sees both."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:30:00Z; two practices, each with one DRAFT coverage window created by PlatformAdmin. The liaison acts with X-User-ID == practice_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225, audit_period_start_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { practice_1: $.data.id }
            - call: "POST /practices"
              payload: { name: "Lakeside Pediatrics", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 3900, audit_period_start_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { practice_2: $.data.id }
            - call: "POST /coverage-windows"
              payload: { practice_id: "${practice_2}", start_utc: "2026-08-10T02:00:00Z", end_utc: "2026-08-10T13:00:00Z", coverage_kind: "NIGHTS" }
              as: PlatformAdmin
              captures: { window_2: $.data.id }
            - call: "POST /coverage-windows"
              payload: { practice_id: "${practice_1}", start_utc: "2026-08-10T02:00:00Z", end_utc: "2026-08-10T13:00:00Z", coverage_kind: "NIGHTS" }
              as: PlatformAdmin
              captures: { window_1: $.data.id }
          trigger:
            - call: "GET /practices/${practice_2}/compliance-summary"
              as: PracticeLiaison
              as_user_id: "${practice_1}"
              expect_error: ERR_PRACTICE_SCOPE_VIOLATION
              expect_status: 403
            - call: "GET /practices/${practice_2}/after-hours-invoice"
              as: PracticeLiaison
              as_user_id: "${practice_1}"
              expect_error: ERR_PRACTICE_SCOPE_VIOLATION
              expect_status: 403
            - call: "GET /practices/${practice_2}/patients"
              as: PracticeLiaison
              as_user_id: "${practice_1}"
              expect_error: ERR_PRACTICE_SCOPE_VIOLATION
              expect_status: 403
            - call: "POST /coverage-windows/${window_2}/activate"
              payload: {}
              as: PracticeLiaison
              as_user_id: "${practice_1}"
              expect_error: ERR_PRACTICE_SCOPE_VIOLATION
              expect_status: 403
            - call: "GET /practices/${practice_1}/compliance-summary"
              as: PracticeLiaison
              as_user_id: "${practice_1}"
              captures: { own_audited: $.data.audited_count, own_posture: $.data.compliance_posture }
            - call: "POST /coverage-windows/${window_1}/activate"
              payload: {}
              as: PracticeLiaison
              as_user_id: "${practice_1}"
              captures: { own_window_status: $.data.status }
            - call: "GET /practices/${practice_2}/compliance-summary"
              as: PlatformAdmin
              captures: { admin_audited: $.data.audited_count }
          assert:
            - "the first four trigger responses each carry error_id ERR_PRACTICE_SCOPE_VIOLATION with HTTP status 403"
            - "${own_audited} == 0"
            - "${own_posture} == NORMAL"
            - "${own_window_status} == ACTIVE"
            - "${admin_audited} == 0"
            - "CoverageWindow.${window_2}.status == DRAFT"
            - "CoverageWindow.${window_2}.version == 1"
            - "CoverageWindow.${window_1}.status == ACTIVE"

      - name: a_nurse_who_is_not_the_assigned_nurse_cannot_assess_or_complete_the_call
        claim_type: Role Scoping
        grounds:
          - validations[priority=14]        # ERR_NOT_ASSIGNED_NURSE
          - roles.TriageNurse
        distinguishing_aspect: "Holding the TriageNurse role is not enough on any of the four clinical writes: a licensed, on-shift nurse who is simply not this call's assigned_nurse_id is refused the assessment, the disposition, the completion and the callback attempt, while the assigned nurse performs each in turn — so the check compares X-User-ID against the call's own assignment, not against the role or the licence."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:30:00Z; nurse_a is assigned to the call. nurse_c holds an identical ACTIVE CA licence and an identical shift but is not assigned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225 }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3, max_concurrent_calls: 2, high_risk_cap: 2 }
              as: PlatformAdmin
              captures: { nurse_a_id: $.data.id }
            - call: "POST /nurses/${nurse_a_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-11111", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /nurses/${nurse_a_id}/shifts"
              payload: { start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nurses"
              payload: { full_name: "Cira Lund", seniority_level: 2, max_concurrent_calls: 2, high_risk_cap: 2 }
              as: PlatformAdmin
              captures: { nurse_c_id: $.data.id }
            - call: "POST /nurses/${nurse_c_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-33333", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /nurses/${nurse_c_id}/shifts"
              payload: { start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /symptom-protocols"
              payload: { code: "CHEST_PAIN", title: "Chest Pain In Adults", base_severity: 62, min_age_years: 0, max_age_years: 120, pregnancy_sensitive: false, emergency_override: false, min_disposition_level: "HOME_CARE" }
              as: PlatformAdmin
              captures: { protocol_id: $.data.id }
            - call: "POST /practices/${practice_id}/patients"
              payload: { full_name: "Dana Reyes", dob: "1990-03-15", sex: "FEMALE", phone: "+14155550100", mrn: "MRN-0001" }
              as: PlatformAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "chest discomfort" }
              as: IntakeAgent
              captures: { call_id: $.data.id }
            - call: "POST /triage-calls/${call_id}/match-patient"
              payload: { patient_id: "${patient_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Dana Reyes" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/assign-nurse"
              payload: { preferred_nurse_id: "${nurse_a_id}" }
              as: IntakeAgent
              captures: { assignee: $.data.assigned_nurse_id }
          trigger:
            - call: "POST /triage-calls/${call_id}/assessments"
              payload: { protocol_id: "${protocol_id}", confirmation_mode: "CONFIRMED", red_flag_count: 1, confirmed_pregnancy_status: "NOT_PREGNANT" }
              as: TriageNurse
              as_user_id: "${nurse_c_id}"
              expect_error: ERR_NOT_ASSIGNED_NURSE
              expect_status: 403
            - call: "POST /triage-calls/${call_id}/assessments"
              payload: { protocol_id: "${protocol_id}", confirmation_mode: "CONFIRMED", red_flag_count: 1, confirmed_pregnancy_status: "NOT_PREGNANT" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { assessment_id: $.data.id }
            - call: "GET /triage-calls/${call_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { call_version: $.data.version }
            - call: "POST /dispositions"
              payload: { call_id: "${call_id}", assessment_id: "${assessment_id}", final_level: "ED_NOW", expected_call_version: "${call_version}" }
              as: TriageNurse
              as_user_id: "${nurse_c_id}"
              expect_error: ERR_NOT_ASSIGNED_NURSE
              expect_status: 403
            - call: "POST /dispositions"
              payload: { call_id: "${call_id}", assessment_id: "${assessment_id}", final_level: "ED_NOW", expected_call_version: "${call_version}" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { disposition_id: $.data.id }
            - call: "GET /callback-tasks?disposition_id=${disposition_id}"
              as: ChargeNurse
              captures: { callback_id: "$.data[0].id" }
            - call: "POST /callback-tasks/${callback_id}/attempts"
              payload: { outcome: "NO_ANSWER" }
              as: TriageNurse
              as_user_id: "${nurse_c_id}"
              expect_error: ERR_NOT_ASSIGNED_NURSE
              expect_status: 403
            - call: "POST /triage-calls/${call_id}/complete"
              payload: { handle_minutes: 12 }
              as: TriageNurse
              as_user_id: "${nurse_c_id}"
              expect_error: ERR_NOT_ASSIGNED_NURSE
              expect_status: 403
            - call: "POST /triage-calls/${call_id}/complete"
              payload: { handle_minutes: 12 }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { closed_status: $.data.status }
          assert:
            - "${assignee} == ${nurse_a_id}"
            - "the first, fourth, seventh and eighth trigger responses each carry error_id ERR_NOT_ASSIGNED_NURSE with HTTP status 403"
            - "GET /protocol-assessments?call_id=${call_id} returns total_count == 1"
            - "ProtocolAssessment.${assessment_id}.status == ACTIVE"
            - "CallbackTask.${callback_id}.attempt_count == 0"
            - "CallbackTask.${callback_id}.assigned_nurse_id == ${nurse_a_id}"
            - "${closed_status} == CLOSED"
            - "Nurse.${nurse_c_id}.active_call_load == 0"
            - "Nurse.${nurse_a_id}.active_call_load == 0"

      - name: every_role_can_read_the_shared_lookup_endpoints
        claim_type: Shared Operations
        grounds:
          - endpoints[GET /triage-calls/{id}]
          - endpoints[GET /symptom-protocols]
          - roles.PlatformAdmin
        distinguishing_aspect: "The plain entity reads are declared for all six roles, so each of them — including the two opaque non-clinical roles and the entity-backed liaison, whose scoping rule does not cover these paths — receives the identical body for the same call id, with no role-dependent field redaction anywhere."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:30:00Z; one practice, one protocol and one INTAKE call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225 }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
            - call: "POST /symptom-protocols"
              payload: { code: "CHEST_PAIN", title: "Chest Pain In Adults", base_severity: 62, min_age_years: 0, max_age_years: 120, pregnancy_sensitive: false, emergency_override: false, min_disposition_level: "HOME_CARE" }
              as: PlatformAdmin
              captures: { protocol_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "chest discomfort" }
              as: IntakeAgent
              captures: { call_id: $.data.id }
          trigger:
            - call: "GET /triage-calls/${call_id}"
              as: PlatformAdmin
              captures: { admin_id: $.data.id, admin_status: $.data.status }
            - call: "GET /triage-calls/${call_id}"
              as: IntakeAgent
              captures: { intake_id: $.data.id }
            - call: "GET /triage-calls/${call_id}"
              as: TriageNurse
              captures: { nurse_id_seen: $.data.id }
            - call: "GET /triage-calls/${call_id}"
              as: ChargeNurse
              captures: { charge_id: $.data.id }
            - call: "GET /triage-calls/${call_id}"
              as: ComplianceAuditor
              captures: { auditor_id: $.data.id }
            - call: "GET /triage-calls/${call_id}"
              as: PracticeLiaison
              as_user_id: "${practice_id}"
              captures: { liaison_id: $.data.id, liaison_caller: $.data.caller_phone }
            - call: "GET /symptom-protocols?status=ACTIVE"
              as: PracticeLiaison
              as_user_id: "${practice_id}"
              captures: { protocol_total: $.total_count }
