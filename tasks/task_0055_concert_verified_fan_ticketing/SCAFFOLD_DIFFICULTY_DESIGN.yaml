              as: Fan
              as_user_id: "${fv}"
              captures: { qv: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T02:00:00Z" }
