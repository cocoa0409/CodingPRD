              as: StoreClerk
              captures: { sub_id: $.data.id, sub_v: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/run-shipment"
              payload: { expected_subscription_version: "${sub_v}" }
              as: LivestockKeeper
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: missing_user_context_header_returns_401
        claim_type: peer_roles
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request with no/invalid X-User-Role → 401 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, before any role check."
        test_recipe:
