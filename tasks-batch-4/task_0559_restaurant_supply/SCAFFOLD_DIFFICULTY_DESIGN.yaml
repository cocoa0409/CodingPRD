  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: confirm_cancel_conserves_inventory_units
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_CONFIRMED
          - state_machines.PurchaseOrder.CONFIRMED_to_CANCELLED
          - entities.Product.fields.on_hand_qty
          - entities.OrderLine.fields.allocated_qty
        distinguishing_aspect: "Conserved quantity = physical eaches: Product.on_hand_qty + sum(OrderLine.allocated_qty for CONFIRMED lines). Starting on_hand 10, confirm (allocate 4 -> on_hand 6) then cancel (deallocate -> on_hand 10) leaves on_hand_qty back at 10 with allocated_qty 0 — inventory units conserved, distinct from the credit-cents invariant."
        test_recipe:
          setup:
            - "Account with ample credit; STOCK product BOWL on_hand=10; a DRAFT order with one line of qty 4."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Bistro Q", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
