          assert:
            - "First decline succeeds: status == DECLINED"
            - "Accept after DECLINED -> ERR_INVALID_STATE (409) (terminal lockdown)"
            - "Second decline after DECLINED -> ERR_INVALID_STATE (409) (trigger cannot fire twice)"

      - name: plan_close_blocked_while_any_deployment_open
