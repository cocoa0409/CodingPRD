          - state_machines.RiskPool.RESERVED_to_SETTLEMENT_PROPOSED
        distinguishing_aspect: |
          Two participants with identical weights split a 3-cent shared savings
          pool: exact shares are 1.5 and 1.5, floors 1 and 1, and the single
          leftover cent goes to the participant that comes first in
          created_at ASC then npi ASC order. The fixture deliberately gives the
          FIRST-CREATED physician the LARGER npi (4799999999 before 4700000001),
          so an implementation that sorts by npi, by id, or that hands the
          leftover to an arbitrary participant awards the extra cent to the wrong
          physician; an implementation that drops the leftover distributes only
          2 of the 3 cents.
