      - name: clearance_screening_allowance_restored_by_cancel
        grounds:
          - calculations.clearance_screening_allowance
          - state_machines.Showtime[SCHEDULED -> CANCELLED]
          - entities.RightsClearance.screenings_used
          - entities.RightsClearance.screenings_remaining
          - errors[ERR_SCREENING_ALLOWANCE_EXHAUSTED]
        distinguishing_aspect: |
          Conserved quantity: LICENSED SCREENINGS. screenings_used + screenings_remaining ==
          max_screenings holds at every point, and the figures are recomputed by counting Showtime rows in
          {SCHEDULED, COMPLETED} rather than decremented blindly, so a cancellation returns the allowance to
          the pool. This is a different conserved quantity from the seat ledger and from the member credit
          ledger, and its restoration also bumps the clearance's OCC version.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title / CONFIRMED booking / non-encrypted DCP asset."
            - "The CLEARED clearance has max_screenings 6 and a window of 2026-08-10 to 2026-08-20."
