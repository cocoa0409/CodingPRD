            - { call: "POST /acquisitions/${acq}/proration-statements", payload: { statement_type: "FINAL_CLOSING", day_count_method: "ACTUAL_365", expected_acquisition_version: "${acq_v3}" }, as: UnderwritingManager, as_user_id: "um-1", captures: { stmt_f: $.data.id } }
            - { call: "POST /acquisitions/proration-statements/${stmt_f}/submit-review", payload: {}, as: UnderwritingManager, as_user_id: "um-2" }
            - { call: "POST /acquisitions/proration-statements/${stmt_f}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-3" }
          trigger:
            - { call: "POST /acquisitions/${acq}/execute-closing", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { err1: $.data.error_id } }
            - { call: "POST /acquisitions/deposits/${dep}/queue-escrow", payload: {}, as: EscrowOfficer, as_user_id: "eo-1", captures: { dep_st: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /acquisitions/${acq}/execute-closing", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { acq_st: $.data.status } }
          assert:
            - "First execute-closing: error_id == ERR_DEPOSITS_NOT_QUEUED (deposit RECONCILED, not ESCROW_QUEUED/TRANSFERRED)"
            - "After queue-escrow (deposit ESCROW_QUEUED): execute-closing succeeds, acquisition CLOSED"
            - "Deposit is TRANSFERRED by the closing cascade"

      - name: employee_approve_requires_in_diligence
        grounds:
          - state_machines.EmployeeDecision.PROPOSED_to_APPROVED
          - entities.Acquisition.fields.status
        distinguishing_aspect: |
          Pair EmployeeDecision->Acquisition: approve is rejected with
          ERR_ACQUISITION_NOT_IN_DILIGENCE while the acquisition is DRAFT, and
          succeeds after kickoff. Third distinct entity pair.
        test_recipe:
          setup:
            - "Acquisition in DRAFT (never kicked off); one PROPOSED RETAIN decision"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "XDep Three", address: "37 Fir St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/employee-decisions", payload: { acquisition_id: "${acq}", employee_ref: "emp-1", position: "PORTER", hire_date: "2024-06-01T00:00:00Z", annual_salary_cents: 5200000, accrued_pto_hours: 40, decision: "RETAIN", notice_date: "2026-08-10T00:00:00Z", effective_date: "2026-08-25T00:00:00Z" }, as: HRPartner, as_user_id: "hr-1", captures: { dec: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/employee-decisions/${dec}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { err1: $.data.error_id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/employee-decisions/${dec}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { st2: $.data.status, liab: $.data.assumed_pto_liability_cents } }
          assert:
            - "While DRAFT: error_id == ERR_ACQUISITION_NOT_IN_DILIGENCE; decision stays PROPOSED"
            - "After kickoff: approve succeeds (APPROVED); RETAIN assumed_pto_liability_cents == 100000 (round(5200000/2080)=2500 hourly x 40 hours)"

  # ===================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_walk_half_open_overlap
        grounds:
          - validations[priority=10]
          - entities.UnitWalkInspection.fields.walk_start
        distinguishing_aspect: |
          Resource inspector_ref, HALF-OPEN interval semantics [walk_start,
          walk_end): a walk ending 11:00 and another starting 11:00 coexist
          (adjacency allowed), while 10:30-12:00 collides. Interval arithmetic
          differs from the closed-interval concession rule.
        test_recipe:
          setup:
            - "Acquisition IN_DILIGENCE with two units; inspector insp-9 has walk A on unit 1A at 09:00-11:00"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Overlap One", address: "39 Hemlock St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit1: $.data.id } }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "2B", floor_plan: "2BR", sqft: 900, market_rent_cents: 180000 }, as: AcquisitionsAnalyst, captures: { unit2: $.data.id } }
            - { call: "POST /acquisitions/inspections", payload: { unit_id: "${unit1}", inspector_ref: "insp-9", walk_start: "2026-08-10T09:00:00Z", walk_end: "2026-08-10T11:00:00Z" }, as: PropertyOperationsLead, captures: { insp_a: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/inspections", payload: { unit_id: "${unit2}", inspector_ref: "insp-9", walk_start: "2026-08-10T11:00:00Z", walk_end: "2026-08-10T13:00:00Z" }, as: PropertyOperationsLead, captures: { insp_b: $.data.id } }
            - { call: "POST /acquisitions/inspections", payload: { unit_id: "${unit2}", inspector_ref: "insp-9", walk_start: "2026-08-10T10:30:00Z", walk_end: "2026-08-10T12:00:00Z" }, as: PropertyOperationsLead, captures: { err_c: $.data.error_id } }
          assert:
            - "Adjacent walk (11:00-13:00) SUCCEEDS: half-open [09:00,11:00) and [11:00,13:00) do not overlap"
            - "Overlapping walk (10:30-12:00) fails with ERR_INSPECTOR_DOUBLE_BOOKED"
            - "A different inspector_ref for the overlapping window would succeed (resource is the inspector, not the unit)"

      - name: concession_coverage_closed_interval_overlap
        grounds:
          - validations[priority=10]
          - entities.Concession.fields.coverage_end_date
        distinguishing_aspect: |
          Resource lease, CLOSED interval semantics [start, end] inclusive at
          both ends: concession B starting 2026-01-31 collides with concession
          A ending 2026-01-31 because they share one calendar day — while
          2026-02-01 is fine. Different semantics (inclusive vs exclusive
          adjacency) and different resource than the inspector rule.
        test_recipe:
          setup:
            - "Acquisition IN_DILIGENCE; one unit; one lease; concession A covers [2026-01-01, 2026-01-31]"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Overlap Two", address: "41 Juniper St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease: $.data.id } }
            - { call: "POST /acquisitions/concessions", payload: { lease_file_id: "${lease}", concession_type: "RECURRING_MONTHLY", value_cents: 10000, coverage_start_date: "2026-01-01T00:00:00Z", coverage_end_date: "2026-01-31T00:00:00Z" }, as: AcquisitionsAnalyst, captures: { conc_a: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/concessions", payload: { lease_file_id: "${lease}", concession_type: "ONE_TIME_CREDIT", value_cents: 30000, coverage_start_date: "2026-01-31T00:00:00Z", coverage_end_date: "2026-02-28T00:00:00Z" }, as: AcquisitionsAnalyst, captures: { err_b: $.data.error_id } }
            - { call: "POST /acquisitions/concessions", payload: { lease_file_id: "${lease}", concession_type: "ONE_TIME_CREDIT", value_cents: 30000, coverage_start_date: "2026-02-01T00:00:00Z", coverage_end_date: "2026-02-28T00:00:00Z" }, as: AcquisitionsAnalyst, captures: { conc_c: $.data.id } }
          assert:
            - "Concession B [2026-01-31 .. 2026-02-28] is REJECTED with ERR_CONCESSION_OVERLAP — closed intervals share the single day 2026-01-31"
            - "Concession C [2026-02-01 .. 2026-02-28] SUCCEEDS — first day after A's inclusive end"
            - "Under the inspector rule's half-open semantics B would have passed; here it must not"

  # ===================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: statement_manual_line_reversal_conserves_net
        grounds:
          - calculations.statement_netting
          - concurrency_rules[statement-line-add-stale-statement]
        distinguishing_aspect: |
          Conserved quantity: ProrationStatement.net_amount_cents (=
          total_buyer_credits - total_seller_credits). A manual CREDIT_BUYER
          line of 50000 followed by its CREDIT_SELLER mirror of 50000 returns
          net to the exact pre-pair value (-157041); each add bumps the
          statement version by 1 (OCC-observable).
        test_recipe:
          setup:
            - "Acquisition diligence-complete with: VERIFIED unit (rent 150000), ASSUMED service contract (300000/mo prepaid to 2026-12-31), ASSUMED LOW-risk policy (premium 1200000 prepaid to 2027-03-31), APPROVED RETAIN decision (PTO liability 100000), APPROVED tax projection (2000000)"
            - "DRAFT_CLOSING statement generated under ACTUAL_365: lines RENT 93708, TAX 1391781, PREPAID 1084930 + 657600, PAYROLL 100000 (deposit not yet queued, DEPOSIT_TRANSFER omitted)"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Invariant One", address: "43 Sycamore St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease: $.data.id } }
            - { call: "POST /acquisitions/rent-roll-entries", payload: { unit_id: "${unit}", reported_resident_name: "R One", reported_rent_cents: 150000, reported_concession_cents: 0, reported_deposit_cents: 153090, move_in_date: "2025-09-01T00:00:00Z" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/lease-files/${lease}/audit", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/inspections", payload: { unit_id: "${unit}", inspector_ref: "insp-1", walk_start: "2026-08-10T09:00:00Z", walk_end: "2026-08-10T10:00:00Z" }, as: PropertyOperationsLead, captures: { insp: $.data.id } }
            - { call: "POST /acquisitions/inspections/${insp}/complete", payload: { condition_rating: 4, no_findings_declared: true }, as: PropertyOperationsLead, as_user_id: "pol-1" }
            - { call: "POST /acquisitions/inspections/${insp}/qa-accept", payload: {}, as: PropertyOperationsLead, as_user_id: "pol-2" }
            - { call: "POST /acquisitions/deposits", payload: { lease_file_id: "${lease}", seller_stated_amount_cents: 153090, interest_required: true, annual_interest_rate: 0.02 }, as: AcquisitionsAnalyst, captures: { dep: $.data.id } }
            - { call: "POST /acquisitions/deposits/${dep}/reconcile", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/service-contracts", payload: { acquisition_id: "${acq}", vendor_name: "LiftCo", service_type: "ELEVATOR", monthly_cost_cents: 300000, term_end_date: "2026-12-31T00:00:00Z", auto_renew: false, cancellation_notice_days: 60, cancellation_penalty_cents: 0, prepaid_through_date: "2026-12-31T00:00:00Z" }, as: VendorManager, as_user_id: "vm-1", captures: { sc: $.data.id } }
            - { call: "POST /acquisitions/service-contracts/${sc}/begin-review", payload: {}, as: VendorManager, as_user_id: "vm-1" }
            - { call: "POST /acquisitions/service-contracts/${sc}/assume", payload: {}, as: VendorManager, as_user_id: "vm-1" }
            - { call: "POST /acquisitions/insurance-policies", payload: { acquisition_id: "${acq}", policy_type: "PROPERTY", carrier_name: "Acme Mutual", annual_premium_cents: 1200000, expiration_date: "2027-06-30T00:00:00Z", prepaid_through_date: "2027-03-31T00:00:00Z", loss_run_total_cents: 100000, open_claims_count: 0 }, as: AcquisitionsAnalyst, captures: { pol: $.data.id } }
            - { call: "POST /acquisitions/insurance-policies/${pol}/review-loss-runs", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/insurance-policies/${pol}/assume", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/employee-decisions", payload: { acquisition_id: "${acq}", employee_ref: "emp-2", position: "LEASING_MANAGER", hire_date: "2020-01-01T00:00:00Z", annual_salary_cents: 5200000, accrued_pto_hours: 40, decision: "RETAIN", notice_date: "2026-08-10T00:00:00Z", effective_date: "2026-08-25T00:00:00Z" }, as: HRPartner, as_user_id: "hr-1", captures: { dec: $.data.id } }
            - { call: "POST /acquisitions/employee-decisions/${dec}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/${acq}/complete-diligence", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { acq_v1: $.data.version } }
            - { call: "POST /acquisitions/${acq}/tax-projections", payload: { method: "PURCHASE_PRICE_ANCHORED", expected_acquisition_version: "${acq_v1}" }, as: AcquisitionsAnalyst, captures: { proj: $.data.id } }
            - { call: "POST /acquisitions/tax-projections/${proj}/compute", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/tax-projections/${proj}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { acq_v2: $.data.version } }
            - { call: "POST /acquisitions/${acq}/proration-statements", payload: { statement_type: "DRAFT_CLOSING", day_count_method: "ACTUAL_365", expected_acquisition_version: "${acq_v2}" }, as: UnderwritingManager, as_user_id: "um-1", captures: { stmt: $.data.id, sv0: $.data.version, buyer0: $.data.total_buyer_credits_cents, seller0: $.data.total_seller_credits_cents, net0: $.data.net_amount_cents } }
          trigger:
            - { call: "POST /acquisitions/proration-statements/${stmt}/lines", payload: { expected_statement_version: "${sv0}", line_type: "ADJUSTMENT", direction: "CREDIT_BUYER", amount_cents: 50000, memo: "escrow pad" }, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/proration-statements/${stmt}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { sv1: $.data.version, buyer1: $.data.total_buyer_credits_cents, net1: $.data.net_amount_cents } }
            - { call: "POST /acquisitions/proration-statements/${stmt}/lines", payload: { expected_statement_version: "${sv1}", line_type: "ADJUSTMENT", direction: "CREDIT_SELLER", amount_cents: 50000, memo: "pad reversal" }, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/proration-statements/${stmt}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { sv2: $.data.version, buyer2: $.data.total_buyer_credits_cents, seller2: $.data.total_seller_credits_cents, net2: $.data.net_amount_cents } }
          assert:
            - "Baseline: buyer 1585489, seller 1742530, net == -157041"
            - "After CREDIT_BUYER 50000: buyer 1635489, net == -107041, version bumped by exactly 1"
            - "After the CREDIT_SELLER mirror: buyer 1635489, seller 1792530, net == -157041 — exactly the baseline (conserved)"
            - "INVARIANT: net_amount_cents(forward + reversal) == net_amount_cents(baseline); drift would violate it"

      - name: employee_approve_rescind_conserves_payroll_accrual
        grounds:
          - calculations.severance_and_pto
          - state_machines.EmployeeDecision.APPROVED_to_RESCINDED
          - entities.Acquisition.fields.payroll_accrual_cents
        distinguishing_aspect: |
          Conserved quantity: Acquisition.payroll_accrual_cents (sum of
          severance + PTO payout over APPROVED/NOTIFIED TERMINATE/TRANSFER
          decisions). Approving a TERMINATE decision raises it to 400000;
          rescinding the same decision returns it to exactly 0 — a different
          conserved quantity (payroll dollars) than statement credits.
        test_recipe:
          setup:
            - "Acquisition IN_DILIGENCE; TERMINATE decision proposed (hire 2020-01-01, salary 5200000, PTO 40h, notice 2026-08-10, effective 2026-09-01 = 22 days >= 14)"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Invariant Two", address: "45 Chestnut St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/employee-decisions", payload: { acquisition_id: "${acq}", employee_ref: "emp-3", position: "MAINTENANCE_TECH", hire_date: "2020-01-01T00:00:00Z", annual_salary_cents: 5200000, accrued_pto_hours: 40, decision: "TERMINATE", notice_date: "2026-08-10T00:00:00Z", effective_date: "2026-09-01T00:00:00Z", required_notice_days: 14 }, as: HRPartner, as_user_id: "hr-1", captures: { dec: $.data.id } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: HRPartner, as_user_id: "hr-1", captures: { accr0: $.data.payroll_accrual_cents } }
          trigger:
            - { call: "POST /acquisitions/employee-decisions/${dec}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { sev: $.data.severance_cents, pto: $.data.pto_payout_cents } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { accr1: $.data.payroll_accrual_cents } }
            - { call: "POST /acquisitions/employee-decisions/${dec}/rescind", payload: { reason: "seller retains staff" }, as: HRPartner, as_user_id: "hr-1", captures: { st: $.data.status } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: HRPartner, as_user_id: "hr-1", captures: { accr2: $.data.payroll_accrual_cents } }
          assert:
            - "Baseline payroll_accrual_cents == 0"
            - "Approve computes severance_cents == 300000 (tenure 6y => 3 weeks x weekly 100000) and pto_payout_cents == 100000 (40h x 2500)"
            - "After approve: payroll_accrual_cents == 400000"
            - "After rescind: decision RESCINDED and payroll_accrual_cents == 0 — exactly the baseline (compensation leaves no drift)"
