  # --- Test-driving clock endpoint (mandatory for temporal determinism) ---
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-05-01T00:00:00Z; this endpoint MUST be called to advance time. Never falls back to wall-clock."
    roles: [MeetDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["drives system-triggered state transitions whose preconditions reference logical clock"]

