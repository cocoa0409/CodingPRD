          assert:
            - "after the reject: VendorHourSubmission.${batch}.status == REJECTED with the stored rejection_reason"
            - "after the re-submit: VendorHourSubmission.${batch}.status == SUBMITTED and rejection_reason == null"
            - "VendorHourSubmission.${batch}.submitted_at == 2026-08-01T00:00:00Z and accepted_direct_care_hours == 0.00"
            - "no HourEntry was synthesized at any point: GET /hour-entries with vendor_submission_id ${batch} returns total_count == 0"

      - name: period_close_voids_never_accepted_submission
        claim_type: side_effect_execution
        grounds:
          - state_machines.QuarterlySubmission.DRAFT_to_VOID
          - endpoints[POST /reporting-periods/{id}/close]
        distinguishing_aspect: "Closing a period fans out over its submissions: a DRAFT submission is voided rather than finalized, which also removes it from the facility's outstanding-surcharge base."
        test_recipe:
          setup:
            - "An OPEN 2026Q2 period with one DRAFT submission carrying one 8.00-hour RN shift and one census day"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
