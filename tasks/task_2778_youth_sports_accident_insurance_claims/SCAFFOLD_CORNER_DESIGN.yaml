  - section: cross_cutting_complexity_layers
    instances:

      - name: coordination_record_with_a_stale_expected_claim_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.coordination-record-create-stale-claim
          - errors.ERR_STALE_CLAIM_VERSION
          - entities.Claim.fields.version
        distinguishing_aspect: "The claim's version is captured before the bill is repriced, so by the time the coordination record is filed the captured token is two writes behind. Filing with it must return 412 and change nothing; refiling the identical body with the current version succeeds. A server that ignores expected_claim_version, or that compares it against the bill's version, cannot produce both outcomes."
        test_recipe:
          setup:
            - "One league, one BASEBALL_U12 classification and one ACTIVE policy with 404 participants."
            - "One ENROLLED athlete with an ACTIVE FamilyHealthPlan and a VERIFIED MODERATE injury report, so one Claim exists."
            - "The claim's version is captured immediately after it is minted, before any bill is priced."
