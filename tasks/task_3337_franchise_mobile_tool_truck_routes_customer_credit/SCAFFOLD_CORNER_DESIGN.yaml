            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/product-orders", payload: { mix_profile: DIAGNOSTIC_WEIGHTED, investment_ceiling_cents: 60000, requested_lines: [{ product_id: "${p1_id}", requested_qty: 2 }] }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { po_id: "$.data.id", po_ver0: "$.data.version" } }
          trigger:
            - { call: "POST /retail/product-orders/${po_id}/status", payload: { action: SUBMIT }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { po_ver1: "$.data.version" } }
            - { call: "POST /retail/product-orders/${po_id}/status", payload: { action: SHIP }, as: FranchiseManager, captures: { po_ver2: "$.data.version", po_shipped: "$.data.product_order_status" } }
            - { call: "POST /retail/product-orders/${po_id}/status", payload: { action: RECEIVE, expected_product_order_version: "${po_ver1}" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { stale_error: "$.data.error_id" } }
            - { call: "POST /retail/product-orders/${po_id}/status", payload: { action: RECEIVE, expected_product_order_version: "${po_ver2}" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { po_received: "$.data.product_order_status" } }
            - { call: "GET /retail/inventory-positions", payload: { route_id: "${r1_id}", product_id: "${p1_id}" }, as: FranchiseOwner, captures: { pos_on_hand: "$.data[0].on_hand_qty", pos_id: "$.data[0].id" } }
          assert:
            - "ProductOrder.${po_id}.version advanced ${po_ver0} at creation, ${po_ver1} after SUBMIT and ${po_ver2} after SHIP"
            - "the RECEIVE carrying the stale ${po_ver1} captures ${stale_error} == ERR_STALE_VERSION with http 412"
            - "the RECEIVE carrying the fresh ${po_ver2} succeeds with ProductOrder.${po_id}.product_order_status == RECEIVED"
            - "the route's InventoryPosition for ${p1_id} holds on_hand_qty == 2, not 4, so only the fresh receive posted stock"
            - "the refused receive created no second position for ${p1_id}"

  # ===========================================================================
  # section: consistency model
  # ===========================================================================
  - section: consistency model
    instances:

      - name: consistency_account_balance_visible_in_same_response_as_delivery
        claim_type: immediate
        grounds: [state_machines.SalesOrder.CONFIRMED_to_DELIVERED, entities.CreditAccount.fields.principal_balance_cents, entities.Franchisee.fields.outstanding_credit_cents]
        distinguishing_aspect: "Under the immediate model every derived field the delivery touches is already correct in the very next read: the account principal, the technician's revolving usage and the franchisee's outstanding total all reflect the write with no waiting and no re-derivation delay."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; technician T; approved account A1 (limit 50000); product P1; a 3 x P1 order CONFIRMED in the week of 2026-09-07"]
