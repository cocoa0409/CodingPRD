          setup:
            - "State OR is OPEN_TERRITORY with sampling_copies_required 0 and min_verified_coverage_pct 42.86"
            - "The ELA grade-5 framework holds OR.E.5.1 with weight 3 and OR.E.5.2 with weight 4, so the coverage denominator is 7"
