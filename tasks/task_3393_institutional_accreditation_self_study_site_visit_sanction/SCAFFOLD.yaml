# =============================================================================
# SCAFFOLD — Institutional Accreditation Self-Study, Site Visit & Sanction
# Process (Higher Learning Commission style)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Institutional Accreditation Self-Study, Site Visit & Sanction Process (Higher Learning Commission): institutional eligibility and candidacy processes for new members with multi-year pathways, criteria for accreditation covering mission, integrity, teaching and learning, resources and planning with evidence expectations, assurance argument preparation drawing on institutional data, assessment results and financial indicators, peer review team assembly with conflict screening and on-site or virtual visit protocols, action outcomes including reaffirmation, notice, probation and show-cause with public disclosure, substantive change review for new locations, program levels, ownership changes and distance delivery, financial and non-financial indicator monitoring between comprehensive reviews, federal compliance review components tied to student aid eligibility

domain_name: institutional-accreditation
api_prefix: /accreditation

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency      # OCC on Institution.version and ReviewCycle.version
    - cascading_side_effects      # sanction cascade; panel-close cascade
    - dual_variant_calculation    # CFI public/private; readiness self/verified
    - selector_policy             # deterministic peer-review team auto-assembly
  entity_topology: flat           # peer collections joined by FK references; nested creation under parents
  state_machine_shape: cyclic     # revision loops, re-screen loops, deferral loops + parallel dimensions on Institution
  relationship_patterns:
    - one_to_many
    - many_to_many                # ReviewTeam <-> Reviewer via TeamAssignment junction
    - cross_aggregate             # SubstantiveChangeRequest / IndicatorReport guard on Institution dimensions
  role_model: segregation_of_duties  # visit-team reviewer may not sit the decision panel for the same cycle; liaison may not verify evidence
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Institution
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the institution" }
      - { name: legal_status, type: enum, source: input, description: "PUBLIC | PRIVATE_NONPROFIT | PRIVATE_FORPROFIT — selects the CFI variant (composite_financial_index)" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of legal incorporation" }
      - { name: fte_enrollment, type: integer, source: input, description: "Full-time-equivalent enrollment, >= 0; refreshed from latest SUBMITTED IndicatorReport" }
      - { name: degree_levels_offered, type: array, source: input, description: "Non-empty subset of [ASSOCIATE, BACCALAUREATE, MASTERS, DOCTORAL]; drives annual_dues_assessment line items" }
      - { name: distance_delivery_approved, type: boolean, source: system, default: false, description: "Set true only by APPROVED SubstantiveChangeRequest of type DISTANCE_DELIVERY" }
      - { name: locations_count, type: integer, source: system, default: 1, description: "Branch campus count; incremented by APPROVED NEW_LOCATION substantive change" }
      - { name: accreditation_status, type: enum, source: system, default: PROSPECTIVE, description: "Parallel dimension 1: PROSPECTIVE | CANDIDATE | ACCREDITED | DENIED_ENTRY | WITHDRAWN" }
      - { name: sanction_status, type: enum, source: system, default: NONE, description: "Parallel dimension 2: NONE | NOTICE | PROBATION | SHOW_CAUSE | MEMBERSHIP_REMOVED — evolves independently of accreditation_status" }
      - { name: candidacy_pathway, type: enum, source: system, description: "STANDARD (4 years) | ACCELERATED (2 years); copied from the APPROVED EligibilityApplication; null until then", default: null }
      - { name: candidacy_started_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when institution entered CANDIDATE" }
      - { name: candidacy_expires_at, type: datetime, source: system, default: null, description: "= candidacy_started_at + pathway years (STANDARD 4, ACCELERATED 2); GRANT_INITIAL effectuation after this fails ERR_CANDIDACY_EXPIRED" }
      - { name: accredited_since, type: datetime, source: system, default: null, description: "Timestamp of GRANT_INITIAL effectuation" }
      - { name: last_reaffirmed_at, type: datetime, source: system, default: null, description: "Timestamp of latest REAFFIRMATION effectuation" }
      - { name: current_annual_dues_cents, type: integer, source: computed, description: "annual_dues_assessment output; recomputed at creation, on PATCH touching fte_enrollment/degree_levels_offered, on indicator submit, on APPROVED PROGRAM_LEVEL change" }
      - { name: dues_paid_cents, type: integer, source: input, default: 0, description: "Staff-recorded payments via PATCH; at creation system-initialized to current_annual_dues_cents so a new institution starts with zero arrears" }
      - { name: outstanding_dues_cents, type: integer, source: computed, description: "= max(0, current_annual_dues_cents - dues_paid_cents); > 0 blocks substantive-change submit (ERR_DUES_ARREARS)" }
      - { name: latest_cfi_value, type: number, source: computed, default: null, description: "CFI of the most recently evaluated IndicatorReport (2dp, round_half_up)" }
      - { name: latest_cfi_band, type: enum, source: computed, default: null, description: "CLEAR | REVIEW | PANEL — band of latest_cfi_value per composite_financial_index thresholds" }

  - name: EligibilityApplication
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id; taken from the creation path" }
      - { name: pathway, type: enum, source: input, description: "STANDARD | ACCELERATED — requested candidacy pathway length" }
      - { name: statement_of_intent, type: string, source: input, description: "Free-text eligibility statement" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FILED | DEFICIENT | APPROVED | DENIED" }
      - { name: filed_at, type: datetime, source: system, default: null, description: "Last transition into FILED" }
      - { name: adjudicated_at, type: datetime, source: system, default: null, description: "Timestamp of APPROVE / DENY / REQUEST_COMPLETION" }
      - { name: adjudication_notes, type: string, source: system, default: null, description: "Staff note captured at adjudication" }

  - name: ReviewCycle
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id; taken from the creation path" }
      - { name: cycle_type, type: enum, source: input, description: "INITIAL_ACCREDITATION (requires institution CANDIDATE) | REAFFIRMATION (requires ACCREDITED)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | MATERIALS_OPEN | EVALUATION_ACTIVE | VISIT_COMPLETE | PANEL_REVIEW | DECIDED | CLOSED" }
      - { name: federal_compliance_status, type: enum, source: system, default: PENDING, description: "PENDING | COMPLIANT | DEFICIENT — set by record-federal-compliance; DEFICIENT caps action and blocks panel close" }
      - { name: federal_components, type: array, source: system, default: [], description: "Recorded components: [{component_code, result}] with result PASS | FAIL" }
      - { name: cohort_default_rates, type: array, source: system, default: [], description: "Up to 3 most-recent annual cohort default rates (percent), oldest first" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Set when cascade from panel close moves cycle to DECIDED" }

  - name: AssuranceArgument
    parent: ReviewCycle
    common_fields: true
    fields:
      - { name: review_cycle_id, type: string, source: system, description: "FK -> ReviewCycle.id; taken from the creation path" }
      - { name: narrative_text, type: string, source: input, description: "Self-study narrative body" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | REVISION_REQUESTED | REVIEW_LOCKED | ACCEPTED | REJECTED_AS_INSUFFICIENT" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on each request-revision; request-revision with revision_count already at MAX_ARGUMENT_REVISIONS (2) fails and rejects the argument" }
      - { name: readiness_self_reported, type: number, source: computed, default: null, description: "assurance_readiness_score SELF_REPORTED variant, computed at each submit" }
      - { name: readiness_team_verified, type: number, source: computed, default: null, description: "assurance_readiness_score TEAM_VERIFIED variant, recomputed on every evidence verify/unverify" }
      - { name: submitted_at, type: datetime, source: system, default: null }
      - { name: locked_at, type: datetime, source: system, default: null }

  - name: EvidenceItem
    parent: AssuranceArgument
    common_fields: true
    fields:
      - { name: assurance_argument_id, type: string, source: system, description: "FK -> AssuranceArgument.id; taken from the creation path" }
      - { name: criterion_code, type: enum, source: input, description: "CRIT_MISSION | CRIT_INTEGRITY | CRIT_TEACHING_QUALITY | CRIT_TEACHING_EVALUATION | CRIT_RESOURCES_PLANNING" }
      - { name: evidence_type, type: enum, source: input, description: "INSTITUTIONAL_DATA | ASSESSMENT_RESULT | FINANCIAL_INDICATOR | POLICY_DOCUMENT" }
      - { name: title, type: string, source: input }
      - { name: document_uri, type: string, source: input }
      - { name: verified, type: boolean, source: system, default: false, description: "Toggled only by an ACCEPTED team member via evidence verify while the argument is REVIEW_LOCKED" }
      - { name: verified_by_reviewer_id, type: string, source: system, default: null, description: "Reviewer id of the last verifier; null when verified is false" }

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input }
      - { name: affiliation_institution_id, type: string, source: input, default: null, description: "FK -> Institution.id; nullable — the reviewer's home institution; conflict-screened at assembly and panel seating" }
      - { name: specialty_criteria, type: array, source: input, description: "Subset of the five criterion codes; assembly ranks by coverage count" }
      - { name: declared_conflict_institution_ids, type: array, source: input, default: [], description: "Institution ids the reviewer declares conflicts with" }
      - { name: quality_rating, type: number, source: input, description: "0.00–5.00, two decimals" }
      - { name: prior_chair_count, type: integer, source: input, default: 0, description: "Completed prior chair assignments; chair eligibility needs >= CHAIR_MIN_PRIOR_VISITS (2)" }
      - { name: is_active, type: boolean, source: input, default: true }
      - { name: current_assignment_count, type: integer, source: computed, default: 0, description: "= count of TeamAssignments for this reviewer with response in {PENDING, ACCEPTED} and status ACTIVE on a team not DISBANDED; cap MAX_CONCURRENT_ASSIGNMENTS (3)" }

  - name: ReviewTeam
    parent: ReviewCycle
    common_fields: true
    fields:
      - { name: review_cycle_id, type: string, source: system, description: "FK -> ReviewCycle.id; taken from the creation path" }
      - { name: visit_modality, type: enum, source: input, description: "ON_SITE (1-day travel buffer each side) | VIRTUAL (no buffer) — drives reviewer window-conflict arithmetic" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | CONFIRMED | VISIT_SCHEDULED | REPORT_FILED | DISBANDED" }
      - { name: chair_reviewer_id, type: string, source: system, description: "Selector-picked chair (highest-ranked candidate with prior_chair_count >= 2)" }
      - { name: visit_start_at, type: datetime, source: system, default: null }
      - { name: visit_end_at, type: datetime, source: system, default: null }
      - { name: criterion_ratings, type: array, source: system, default: [], description: "Filed at report time: [{criterion_code, rating}] with rating MET | MET_WITH_CONCERNS | NOT_MET — all five criteria required" }
      - { name: report_recommendation, type: enum, source: system, default: null, description: "Team's advisory recommendation: REAFFIRM | GRANT | NOTICE | PROBATION | SHOW_CAUSE | DENY" }
      - { name: report_summary, type: string, source: system, default: null }
      - { name: recommended_action_computed, type: enum, source: computed, default: null, description: "recommended_action_determination output (REAFFIRMATION | GRANT_INITIAL | NOTICE | PROBATION | SHOW_CAUSE | DENIAL), computed at file-report" }
      - { name: report_filed_at, type: datetime, source: system, default: null }

  - name: TeamAssignment
    parent: ReviewTeam
    common_fields: true
    fields:
      - { name: review_team_id, type: string, source: system, description: "FK -> ReviewTeam.id" }
      - { name: reviewer_id, type: string, source: system, description: "FK -> Reviewer.id" }
      - { name: role_on_team, type: enum, source: system, description: "CHAIR | MEMBER" }
      - { name: conflict_status, type: enum, source: system, description: "CLEARED at assembly (conflicted candidates are never assigned); flips to CONFLICTED when a later PATCH /reviewers re-screen finds a newly declared conflict or affiliation against the cycle institution" }
      - { name: response, type: enum, source: system, default: PENDING, description: "PENDING | ACCEPTED | DECLINED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLOSED — CLOSED when the team disbands or the assignment is replaced" }

  - name: DecisionPanel
    parent: ReviewCycle
    common_fields: true
    fields:
      - { name: review_cycle_id, type: string, source: system, description: "FK -> ReviewCycle.id; taken from the creation path" }
      - { name: member_reviewer_ids, type: array, source: input, description: "Exactly PANEL_SIZE (7) reviewer ids; none may hold a TeamAssignment on this cycle (segregation), be affiliated with or conflict-declared against the institution" }
      - { name: status, type: enum, source: system, default: CONVENED, description: "CONVENED | CLOSED" }
      - { name: votes, type: array, source: system, default: [], description: "Append-only [{reviewer_id, choice, cast_at}]; choice REAFFIRM | GRANT | NOTICE | PROBATION | SHOW_CAUSE | DENY | WITHDRAW; one vote per member" }
      - { name: prevailing_action, type: enum, source: system, default: null, description: "Tally outcome at close; ties break toward the more severe action (panel_decision_tally)" }
      - { name: closed_at, type: datetime, source: system, default: null }

  - name: ActionOutcome
    parent: ReviewCycle
    common_fields: true
    fields:
      - { name: review_cycle_id, type: string, source: system, description: "FK -> ReviewCycle.id; null when origin is INDICATOR_MONITOR (institution-linked via indicator_origin_institution_id)" }
      - { name: indicator_origin_institution_id, type: string, source: system, default: null, description: "FK -> Institution.id; set only on outcomes cascade-created by indicator evaluation" }
      - { name: origin, type: enum, source: system, description: "PANEL (panel close) | INDICATOR_MONITOR (panel-band CFI cascade)" }
      - { name: action_type, type: enum, source: system, description: "REAFFIRMATION | GRANT_INITIAL | DENIAL | NOTICE | PROBATION | SHOW_CAUSE | WITHDRAWAL" }
      - { name: status, type: enum, source: system, default: DRAFTED, description: "DRAFTED | DISCLOSED | EFFECTIVE — advance moves one step; public disclosure happens at DRAFTED -> DISCLOSED" }
      - { name: public_disclosure_text, type: string, source: system, description: "Public notice text; stamped at disclosure" }
      - { name: disclosed_at, type: datetime, source: system, default: null }
      - { name: effective_at, type: datetime, source: system, default: null }
      - { name: sanction_level, type: enum, source: system, default: null, description: "NOTICE | PROBATION | SHOW_CAUSE when action_type is a sanction; else null" }
      - { name: cure_status, type: enum, source: system, default: NONE, description: "NONE | UNDER_CURE_REVIEW | CURED — sanction cure sub-lifecycle" }
      - { name: cure_review_opened_at, type: datetime, source: system, default: null }
      - { name: cure_threshold_snapshot, type: integer, source: system, default: null, description: "sanction_cure_determination threshold frozen when cure review opens (level at that instant); later escalation replaces it" }
      - { name: cure_deadline_at, type: datetime, source: system, default: null, description: "= effective_at (or escalation timestamp) + level months: NOTICE 12, PROBATION 24, SHOW_CAUSE 12" }

  - name: SubstantiveChangeRequest
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id; taken from the creation path" }
      - { name: change_type, type: enum, source: input, description: "NEW_LOCATION | PROGRAM_LEVEL | OWNERSHIP_CHANGE | DISTANCE_DELIVERY" }
      - { name: requested_program_level, type: enum, source: input, default: null, description: "ASSOCIATE | BACCALAUREATE | MASTERS | DOCTORAL — required iff change_type == PROGRAM_LEVEL" }
      - { name: new_location_state, type: string, source: input, default: null, description: "Two-letter state — required iff change_type == NEW_LOCATION" }
      - { name: ownership_details, type: string, source: input, default: null, description: "Free-text — required iff change_type == OWNERSHIP_CHANGE" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | DENIED | DEFERRED (DEFERRED may resubmit)" }
      - { name: decision_notes, type: string, source: system, default: null }

  - name: IndicatorReport
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id; taken from the creation path" }
      - { name: period_start, type: string, source: input, description: "Inclusive period start date YYYY-MM-DD; must tile contiguously with prior reports (no overlap, no gap)" }
      - { name: period_end, type: string, source: input, description: "Inclusive period end date YYYY-MM-DD; must be > period_start" }
      - { name: status, type: enum, source: system, default: DUE, description: "DUE | SUBMITTED | CLEARED | FLAGGED_REVIEW | FLAGGED_PANEL" }
      - { name: primary_reserve_ratio, type: number, source: input, default: null, description: "Submitted by liaison at submit time" }
      - { name: viability_ratio, type: number, source: input, default: null }
      - { name: net_operating_ratio, type: number, source: input, default: null }
      - { name: state_appropriation_ratio, type: number, source: input, default: null, description: "Used only by the PUBLIC CFI variant" }
      - { name: enrollment_change_pct, type: number, source: input, default: null, description: "Year-over-year FTE change percent" }
      - { name: completion_rate, type: number, source: input, default: null, description: "Percent 0–100" }
      - { name: retention_rate, type: number, source: input, default: null, description: "Percent 0–100" }
      - { name: fte_enrollment, type: integer, source: input, default: null, description: "Verified FTE for the period; on submit it overwrites Institution.fte_enrollment and forces a dues recompute" }
      - { name: cfi_value, type: number, source: computed, default: null, description: "composite_financial_index output at submit (2dp, round_half_up)" }
      - { name: cfi_variant_used, type: enum, source: system, default: null, description: "PUBLIC | PRIVATE — snapshot of the variant selected from Institution.legal_status at submit" }
      - { name: emi_value, type: number, source: computed, default: null, description: "enrollment_momentum_index output at submit (2dp, round_half_up)" }
      - { name: evaluated_at, type: datetime, source: system, default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Parallel dimension 1 on Institution ---------------------------------
  - entity: Institution
    dimension: accreditation_status
    initial_state: PROSPECTIVE
    terminal_states: [DENIED_ENTRY, WITHDRAWN]
    transitions:
      - from: PROSPECTIVE
        to: CANDIDATE
        trigger: "POST /accreditation/eligibility-applications/{id}/adjudicate with decision=APPROVE"
        actor: CommissionStaff
        preconditions:
          - "EligibilityApplication.status == FILED (ERR_INVALID_STATE otherwise)"
          - "Institution.accreditation_status == PROSPECTIVE (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Institution.candidacy_pathway := application.pathway"
          - "Institution.candidacy_started_at := logical clock now"
          - "Institution.candidacy_expires_at := candidacy_started_at + CANDIDACY_YEARS[pathway] (STANDARD 4, ACCELERATED 2)"
      - from: CANDIDATE
        to: ACCREDITED
        trigger: "POST /accreditation/action-outcomes/{id}/advance into EFFECTIVE with action_type == GRANT_INITIAL"
        actor: CommissionStaff
        preconditions:
          - "logical clock now <= Institution.candidacy_expires_at (ERR_CANDIDACY_EXPIRED)"
        side_effects:
          - "Institution.accredited_since := now"
      - from: CANDIDATE
        to: DENIED_ENTRY
        trigger: "POST /accreditation/action-outcomes/{id}/advance into EFFECTIVE with action_type == DENIAL"
        actor: CommissionStaff
        preconditions: []
        side_effects: []
      - from: ACCREDITED
        to: WITHDRAWN
        trigger: "POST /accreditation/action-outcomes/{id}/advance into EFFECTIVE with action_type == WITHDRAWAL, or ESCALATE at SHOW_CAUSE (sanction ladder)"
        actor: CommissionStaff
        preconditions: []
        side_effects:
          - "sanction_status := MEMBERSHIP_REMOVED"
        note: "REAFFIRMATION effectuation leaves accreditation_status == ACCREDITED and only stamps last_reaffirmed_at"

  # --- Parallel dimension 2 on Institution (independent of dimension 1) -----
  - entity: Institution
    dimension: sanction_status
    initial_state: NONE
    terminal_states: [MEMBERSHIP_REMOVED]
    transitions:
      - from: NONE
        to: NOTICE
        trigger: "ActionOutcome with sanction_level NOTICE becomes EFFECTIVE (panel outcome advance, or indicator panel-band cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Freeze in-flight SubstantiveChangeRequests of this institution: SUBMITTED -> DEFERRED (decision_notes := 'frozen by sanction'); DRAFT requests untouched"
      - from: NOTICE
        to: PROBATION
        trigger: "ActionOutcome with sanction_level PROBATION becomes EFFECTIVE, or sanction-transition ESCALATE on the NOTICE outcome"
        actor: system
        preconditions: []
        side_effects:
          - "Same substantive-change freeze as NONE -> NOTICE"
      - from: NONE
        to: PROBATION
        trigger: "ActionOutcome with sanction_level PROBATION becomes EFFECTIVE while institution is clean (direct imposition allowed for severe findings)"
        actor: system
        preconditions: []
        side_effects:
          - "Same substantive-change freeze as NONE -> NOTICE"
        note: "Direct NONE -> PROBATION is permitted; the escalation ladder is single-step only when driven by sanction-transition ESCALATE"
      - from: PROBATION
        to: SHOW_CAUSE
        trigger: "ActionOutcome with sanction_level SHOW_CAUSE becomes EFFECTIVE, or sanction-transition ESCALATE on the PROBATION outcome"
        actor: system
        preconditions: []
        side_effects:
          - "Same substantive-change freeze as NONE -> NOTICE"
      - from: NOTICE
        to: NONE
        trigger: "sanction-transition action=CURE succeeds on the NOTICE outcome"
        actor: CommissionStaff
        preconditions: []
        side_effects: []
      - from: PROBATION
        to: NONE
        trigger: "sanction-transition action=CURE succeeds on the PROBATION outcome"
        actor: CommissionStaff
        preconditions: []
        side_effects: []
      - from: SHOW_CAUSE
        to: NONE
        trigger: "sanction-transition action=CURE succeeds on the SHOW_CAUSE outcome"
        actor: CommissionStaff
        preconditions: []
        side_effects: []
      - from: SHOW_CAUSE
        to: MEMBERSHIP_REMOVED
        trigger: "sanction-transition action=ESCALATE on the SHOW_CAUSE outcome"
        actor: CommissionStaff
        preconditions: []
        side_effects:
          - "Institution.accreditation_status := WITHDRAWN (terminal)"
          - "Outcome remains EFFECTIVE with sanction_level SHOW_CAUSE"

  - entity: EligibilityApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /accreditation/eligibility-applications/{id}/file"
        actor: InstitutionLiaison
        preconditions:
          - "status == DRAFT or DEFICIENT (ERR_INVALID_STATE)"
        side_effects:
          - "filed_at := now"
      - from: DEFICIENT
        to: FILED
        trigger: "POST /accreditation/eligibility-applications/{id}/file"
        actor: InstitutionLiaison
        preconditions: []
        side_effects:
          - "filed_at := now"
        note: "deficiency resubmission loop (cyclic)"
      - from: FILED
        to: APPROVED
        trigger: "POST /accreditation/eligibility-applications/{id}/adjudicate decision=APPROVE"
        actor: CommissionStaff
        preconditions:
          - "Institution.accreditation_status == PROSPECTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Institution PROSPECTIVE -> CANDIDATE with pathway/candidacy stamps"
      - from: FILED
        to: DENIED
        trigger: "POST /accreditation/eligibility-applications/{id}/adjudicate decision=DENY"
        actor: CommissionStaff
        preconditions: []
        side_effects: []
      - from: FILED
        to: DEFICIENT
        trigger: "POST /accreditation/eligibility-applications/{id}/adjudicate decision=REQUEST_COMPLETION"
        actor: CommissionStaff
        preconditions: []
        side_effects: []

  - entity: ReviewCycle
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: MATERIALS_OPEN
        trigger: "POST /accreditation/review-cycles/{id}/advance"
        actor: CommissionStaff
        preconditions: []
        side_effects: []
      - from: MATERIALS_OPEN
        to: EVALUATION_ACTIVE
        trigger: "POST /accreditation/review-cycles/{id}/advance"
        actor: CommissionStaff
        preconditions:
          - "An AssuranceArgument of this cycle exists with status in {SUBMITTED, REVIEW_LOCKED} (ERR_CYCLE_PREREQUISITE_NOT_MET)"
        side_effects: []
      - from: EVALUATION_ACTIVE
        to: VISIT_COMPLETE
        trigger: "POST /accreditation/review-cycles/{id}/advance"
        actor: CommissionStaff
        preconditions:
          - "A ReviewTeam of this cycle exists with status == REPORT_FILED (ERR_CYCLE_PREREQUISITE_NOT_MET)"
        side_effects: []
      - from: VISIT_COMPLETE
        to: PANEL_REVIEW
        trigger: "POST /accreditation/review-cycles/{id}/advance"
        actor: CommissionStaff
        preconditions:
          - "A DecisionPanel of this cycle exists with status == CONVENED (ERR_CYCLE_PREREQUISITE_NOT_MET)"
        side_effects: []
      - from: PANEL_REVIEW
        to: DECIDED
        trigger: "cascade from POST /accreditation/decision-panels/{id}/close (never via advance)"
        actor: system
        preconditions: []
        side_effects:
          - "decided_at := now"
          - "Cascade link: the ReviewTeam of this cycle in REPORT_FILED -> DISBANDED; each of its TeamAssignments ACTIVE -> CLOSED; each assigned Reviewer.current_assignment_count decremented accordingly"
      - from: DECIDED
        to: CLOSED
        trigger: "POST /accreditation/review-cycles/{id}/advance"
        actor: CommissionStaff
        preconditions:
          - "The ActionOutcome created by the deciding panel has status == EFFECTIVE (ERR_CYCLE_PREREQUISITE_NOT_MET)"
        side_effects: []

  - entity: AssuranceArgument
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED_AS_INSUFFICIENT]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /accreditation/assurance-arguments/{id}/submit"
        actor: InstitutionLiaison
        preconditions:
          - "Parent cycle status == MATERIALS_OPEN (ERR_INVALID_STATE)"
          - "Evidence coverage: every criterion holds >= MIN_EVIDENCE_PER_CRITERION (3) items and total >= ARGUMENT_MIN_TOTAL_EVIDENCE (15) (ERR_INSUFFICIENT_EVIDENCE_COVERAGE)"
        side_effects:
          - "readiness_self_reported := assurance_readiness_score(SELF_REPORTED)"
          - "submitted_at := now"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /accreditation/assurance-arguments/{id}/submit"
        actor: InstitutionLiaison
        preconditions:
          - "Same evidence-coverage rule as DRAFT -> SUBMITTED (ERR_INSUFFICIENT_EVIDENCE_COVERAGE)"
        side_effects:
          - "readiness_self_reported := assurance_readiness_score(SELF_REPORTED)"
          - "submitted_at := now"
        note: "revision loop (cyclic), bounded by MAX_ARGUMENT_REVISIONS"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /accreditation/assurance-arguments/{id}/request-revision"
        actor: CommissionStaff
        preconditions:
          - "revision_count < MAX_ARGUMENT_REVISIONS (2) (ERR_MAX_REVISIONS_EXCEEDED — see rejection transition)"
        side_effects:
          - "revision_count += 1"
      - from: SUBMITTED
        to: REJECTED_AS_INSUFFICIENT
        trigger: "POST /accreditation/assurance-arguments/{id}/request-revision when revision_count == MAX_ARGUMENT_REVISIONS (2)"
        actor: CommissionStaff
        preconditions: []
        side_effects:
          - "Request returns ERR_MAX_REVISIONS_EXCEEDED (409) AND the argument transitions to terminal REJECTED_AS_INSUFFICIENT"
      - from: SUBMITTED
        to: REVIEW_LOCKED
        trigger: "POST /accreditation/assurance-arguments/{id}/lock"
        actor: CommissionStaff
        preconditions:
          - "Parent cycle status == EVALUATION_ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "locked_at := now"
          - "readiness_team_verified := assurance_readiness_score(TEAM_VERIFIED) (starts counting only verified evidence)"
      - from: REVIEW_LOCKED
        to: ACCEPTED
        trigger: "cascade: parent cycle reaches DECIDED with a non-DENIAL prevailing action"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReviewTeam
    initial_state: PROPOSED
    terminal_states: [DISBANDED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /accreditation/review-teams/{id}/confirm"
        actor: CommissionStaff
        preconditions:
          - "All ACTIVE assignments have response == ACCEPTED (ERR_TEAM_INCOMPLETE)"
          - "No ACTIVE assignment has conflict_status == CONFLICTED (ERR_TEAM_INCOMPLETE) — a late-declared conflict must be resolved by decline + replacement first"
        side_effects: []
      - from: CONFIRMED
        to: VISIT_SCHEDULED
        trigger: "POST /accreditation/review-teams/{id}/schedule-visit"
        actor: PeerReviewer
        preconditions:
          - "Acting reviewer id == team.chair_reviewer_id (ERR_REVIEWER_NOT_ASSIGNED)"
          - "Parent cycle status == EVALUATION_ACTIVE (ERR_INVALID_STATE)"
          - "The cycle's AssuranceArgument status == REVIEW_LOCKED (ERR_CYCLE_PREREQUISITE_NOT_MET)"
          - "No accepted team member has an overlapping effective visit window (ERR_REVIEWER_WINDOW_CONFLICT)"
        side_effects:
          - "visit_start_at / visit_end_at set"
      - from: VISIT_SCHEDULED
        to: CONFIRMED
        trigger: "POST /accreditation/review-teams/{id}/cancel-visit"
        actor: CommissionStaff
        preconditions: []
        side_effects:
          - "visit_start_at / visit_end_at := null"
        note: "visit cancellation loop (cyclic)"
      - from: VISIT_SCHEDULED
        to: REPORT_FILED
        trigger: "POST /accreditation/review-teams/{id}/file-report"
        actor: PeerReviewer
        preconditions:
          - "Acting reviewer id == team.chair_reviewer_id (ERR_REVIEWER_NOT_ASSIGNED)"
          - "logical clock now >= visit_end_at (ERR_INVALID_STATE — report before visit end)"
          - "criterion_ratings payload covers all five criteria (ERR_VALIDATION)"
        side_effects:
          - "criterion_ratings / report_recommendation / report_summary stored"
          - "recommended_action_computed := recommended_action_determination(ratings, Institution.sanction_status, cycle.federal_compliance_status, Institution.latest_cfi_band)"
          - "report_filed_at := now"
      - from: REPORT_FILED
        to: DISBANDED
        trigger: "cascade from DecisionPanel close (cycle -> DECIDED)"
        actor: system
        preconditions: []
        side_effects:
          - "TeamAssignments ACTIVE -> CLOSED; Reviewer.current_assignment_count recomputed down"

  - entity: TeamAssignment
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED]
    dimension: response
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /accreditation/team-assignments/{id}/respond response=ACCEPT"
        actor: PeerReviewer
        preconditions:
          - "Acting reviewer id == assignment.reviewer_id (ERR_REVIEWER_NOT_ASSIGNED)"
          - "Reviewer.current_assignment_count <= MAX_CONCURRENT_ASSIGNMENTS (3) after acceptance (ERR_REVIEWER_CAPACITY_EXCEEDED)"
        side_effects: []
      - from: PENDING
        to: DECLINED
        trigger: "POST /accreditation/team-assignments/{id}/respond response=DECLINE"
        actor: PeerReviewer
        preconditions:
          - "Acting reviewer id == assignment.reviewer_id (ERR_REVIEWER_NOT_ASSIGNED)"
        side_effects:
          - "Reviewer.current_assignment_count decremented (compensating invariant reviewer_load_conservation)"
          - "Selector auto-creates a replacement TeamAssignment on the same team for the next-ranked eligible candidate not already assigned (same role_on_team); if none exists, no replacement is created and confirm will fail ERR_TEAM_INCOMPLETE"
          - "This assignment's status := CLOSED"

  - entity: DecisionPanel
    initial_state: CONVENED
    terminal_states: [CLOSED]
    transitions:
      - from: CONVENED
        to: CLOSED
        trigger: "POST /accreditation/decision-panels/{id}/close"
        actor: CommissionStaff
        preconditions:
          - "cycle.federal_compliance_status != DEFICIENT (ERR_FEDERAL_COMPLIANCE_DEFICIENT — checked before quorum)"
          - "len(votes) >= PANEL_QUORUM (5) (ERR_PANEL_QUORUM_NOT_MET)"
          - "Tally's prevailing choice must be type-consistent with cycle_type: GRANT/DENY only for INITIAL_ACCREDITATION, REAFFIRM/WITHDRAW only for REAFFIRMATION, sanctions for either (ERR_ACTION_TYPE_MISMATCH)"
        side_effects:
          - "prevailing_action := panel_decision_tally(votes)"
          - "Cascade link 1: create ActionOutcome(origin=PANEL, action_type mapped from prevailing_action, status=DRAFTED)"
          - "Cascade link 2: ReviewCycle PANEL_REVIEW -> DECIDED (decided_at := now)"
          - "Cascade link 3 (via cycle): cycle's REPORT_FILED ReviewTeam -> DISBANDED; its TeamAssignments -> CLOSED; Reviewer.current_assignment_count decremented"
          - "Cascade link 4 (via cycle): cycle's AssuranceArgument REVIEW_LOCKED -> ACCEPTED when prevailing action is not DENIAL"

  - entity: ActionOutcome
    initial_state: DRAFTED
    terminal_states: [EFFECTIVE]
    transitions:
      - from: DRAFTED
        to: DISCLOSED
        trigger: "POST /accreditation/action-outcomes/{id}/advance"
        actor: CommissionStaff
        preconditions: []
        side_effects:
          - "public_disclosure_text := generated public notice; disclosed_at := now"
        note: "Public disclosure is mandatory for every action, including reaffirmation and denial"
      - from: DISCLOSED
        to: EFFECTIVE
        trigger: "POST /accreditation/action-outcomes/{id}/advance"
        actor: CommissionStaff
        preconditions:
          - "action_type == GRANT_INITIAL requires logical clock now <= Institution.candidacy_expires_at (ERR_CANDIDACY_EXPIRED)"
        side_effects:
          - "effective_at := now"
          - "REAFFIRMATION: Institution.last_reaffirmed_at := now"
          - "GRANT_INITIAL: Institution CANDIDATE -> ACCREDITED, accredited_since := now"
          - "DENIAL: Institution CANDIDATE -> DENIED_ENTRY"
          - "NOTICE/PROBATION/SHOW_CAUSE: sanction_level := action_type; cure_deadline_at := now + SANCTION_CURE_MONTHS[level]; Institution.sanction_status := sanction_level; freeze in-flight SUBMITTED SubstantiveChangeRequests -> DEFERRED"
          - "WITHDRAWAL: Institution ACCREDITED -> WITHDRAWN; sanction_status := MEMBERSHIP_REMOVED"
      - from: EFFECTIVE
        to: EFFECTIVE
        trigger: "POST /accreditation/action-outcomes/{id}/sanction-transition action=OPEN_CURE_REVIEW | CURE | ESCALATE (cure sub-lifecycle; outcome stays EFFECTIVE, its sanction fields mutate)"
        actor: CommissionStaff
        preconditions:
          - "action_type in {NOTICE, PROBATION, SHOW_CAUSE} (ERR_INVALID_STATE)"
          - "OPEN_CURE_REVIEW requires cure_status == NONE (ERR_INVALID_STATE)"
          - "CURE requires cure_status == UNDER_CURE_REVIEW and sanction_cure_determination score >= cure_threshold_snapshot (ERR_CURE_THRESHOLD_NOT_MET)"
          - "ESCALATE requires sanction_level != SHOW_CAUSE (at SHOW_CAUSE it instead removes membership — see side_effects)"
        side_effects:
          - "OPEN_CURE_REVIEW: cure_status := UNDER_CURE_REVIEW; cure_review_opened_at := now; cure_threshold_snapshot := BASE_CURE_SCORE (60) + SANCTION_LEVEL_OFFSET[current sanction_level]"
          - "CURE: cure_status := CURED; Institution.sanction_status := NONE"
          - "ESCALATE at NOTICE/PROBATION: sanction_level := next level; Institution.sanction_status follows; cure_deadline_at := now + SANCTION_CURE_MONTHS[new level]; cure_status := NONE; cure_threshold_snapshot := null"
          - "ESCALATE at SHOW_CAUSE: Institution.sanction_status := MEMBERSHIP_REMOVED and accreditation_status := WITHDRAWN"

  - entity: SubstantiveChangeRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /accreditation/substantive-change-requests/{id}/submit"
        actor: InstitutionLiaison
        preconditions:
          - "status == DRAFT or DEFERRED (ERR_INVALID_STATE)"
          - "Institution.sanction_status in {NONE, NOTICE} (ERR_SANCTION_BLOCKS_CHANGE)"
          - "Institution.outstanding_dues_cents == 0 (ERR_DUES_ARREARS)"
        side_effects: []
      - from: DEFERRED
        to: SUBMITTED
        trigger: "POST /accreditation/substantive-change-requests/{id}/submit"
        actor: InstitutionLiaison
        preconditions:
          - "Same sanctions/dues guards as DRAFT -> SUBMITTED"
        side_effects: []
        note: "deferral resubmission loop (cyclic)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /accreditation/substantive-change-requests/{id}/decide decision=APPROVE"
        actor: CommissionStaff
        preconditions:
          - "Institution.sanction_status in {NONE, NOTICE} (ERR_SANCTION_BLOCKS_CHANGE — re-checked at decision time)"
        side_effects:
          - "NEW_LOCATION: Institution.locations_count += 1"
          - "PROGRAM_LEVEL: requested_program_level appended to Institution.degree_levels_offered; current_annual_dues_cents recomputed"
          - "DISTANCE_DELIVERY: Institution.distance_delivery_approved := true"
          - "OWNERSHIP_CHANGE: no field mutation beyond status (CFI variant follows legal_status, which is staff-maintained via PATCH)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /accreditation/substantive-change-requests/{id}/decide decision=DENY"
        actor: CommissionStaff
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: DEFERRED
        trigger: "POST /accreditation/substantive-change-requests/{id}/decide decision=DEFER, or cascade freeze from sanction imposition"
        actor: CommissionStaff
        preconditions: []
        side_effects: []

  - entity: IndicatorReport
    initial_state: DUE
    terminal_states: [CLEARED, FLAGGED_REVIEW, FLAGGED_PANEL]
    transitions:
      - from: DUE
        to: SUBMITTED
        trigger: "POST /accreditation/indicator-reports/{id}/submit"
        actor: InstitutionLiaison
        preconditions:
          - "status == DUE (ERR_INVALID_STATE)"
        side_effects:
          - "cfi_value := composite_financial_index(financial ratios, Institution.legal_status); cfi_variant_used := PUBLIC | PRIVATE"
          - "emi_value := enrollment_momentum_index(non-financial metrics)"
          - "Institution.fte_enrollment := report.fte_enrollment; Institution.current_annual_dues_cents recomputed (annual_dues_assessment)"
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /accreditation/indicator-reports/{id}/evaluate when CFI > 1.10 and EMI >= -5.00"
        actor: CommissionStaff
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "evaluated_at := now; Institution.latest_cfi_value / latest_cfi_band := value / CLEAR"
      - from: SUBMITTED
        to: FLAGGED_REVIEW
        trigger: "POST /accreditation/indicator-reports/{id}/evaluate when -0.90 < CFI <= 1.10, or EMI < -5.00 with CFI in CLEAR band"
        actor: CommissionStaff
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "evaluated_at := now; Institution.latest_cfi_value / latest_cfi_band updated"
      - from: SUBMITTED
        to: FLAGGED_PANEL
        trigger: "POST /accreditation/indicator-reports/{id}/evaluate when CFI <= -0.90"
        actor: CommissionStaff
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "evaluated_at := now; Institution.latest_cfi_value / latest_cfi_band := value / PANEL"
          - "Cascade link 1: system creates ActionOutcome(origin=INDICATOR_MONITOR, action_type=NOTICE, status=EFFECTIVE, sanction_level=NOTICE, cure_deadline_at := now + 12 months, indicator_origin_institution_id := report.institution_id)"
          - "Cascade link 2 (via outcome effectuation): Institution.sanction_status NONE -> NOTICE (if currently NONE; otherwise unchanged)"
          - "Cascade link 3 (via institution sanction mutation): in-flight SUBMITTED SubstantiveChangeRequests of this institution -> DEFERRED (decision_notes := 'frozen by sanction')"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: occ-institution-profile-update
    parent_entity: Institution
    write_endpoint: "PATCH /accreditation/institutions/{id}"
    occ_field: expected_institution_version
    description: |
      A PATCH against an Institution whose version has advanced past the
      version the client last observed is rejected. Two profile updates
      issued from the same stale view would both be legitimate writes under
      the product semantics, so the loser is detected by version staleness
      rather than by any state field.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: occ-review-team-assembly
    parent_entity: ReviewCycle
    write_endpoint: "POST /accreditation/review-cycles/{id}/review-teams"
    occ_field: expected_review_cycle_version
    description: |
      Assembling a ReviewTeam against a ReviewCycle whose version has
      advanced since the client last read it is rejected. The cycle version
      advances on every mutation (advance steps, argument linkage, earlier
      team assemblies), so a client holding a stale view of the cycle must
      re-read before its assembly is accepted.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: composite_financial_index
    trigger: "IndicatorReport submit (POST /accreditation/indicator-reports/{id}/submit)"
    algorithm: weighted_scoring
    formula: |
      scale(r) = clamp(round_half_up(20 * r, 2dp), -4.00, 10.00)
      PRIVATE variant (legal_status in {PRIVATE_NONPROFIT, PRIVATE_FORPROFIT}):
        CFI = round_half_up(0.40*scale(primary_reserve_ratio)
                          + 0.35*scale(viability_ratio)
                          + 0.25*scale(net_operating_ratio), 2dp)
      PUBLIC variant (legal_status == PUBLIC):
        CFI = round_half_up(0.50*scale(primary_reserve_ratio)
                          + 0.50*scale(viability_ratio)
                          + APPROPRIATION_BONUS, 2dp)
        APPROPRIATION_BONUS = 0.50 if state_appropriation_ratio >= 0.20 else 0.00
      Band mapping of the resulting CFI:
        CFI >  1.10            -> CLEAR
        -0.90 < CFI <= 1.10    -> REVIEW
        CFI <= -0.90           -> PANEL
    input_set: "The IndicatorReport being submitted; variant chosen from Institution.legal_status at submit time and frozen on cfi_variant_used"
    constants:
      CFI_SCALE_MIN: -4.00
      CFI_SCALE_MAX: 10.00
      W_PRR_PRIVATE: 0.40
      W_VIAB_PRIVATE: 0.35
      W_NOR_PRIVATE: 0.25
      W_PRR_PUBLIC: 0.50
      W_VIAB_PUBLIC: 0.50
      APPROPRIATION_BONUS: 0.50
      APPROPRIATION_MIN_RATIO: 0.20
      CFI_CLEAR_ABOVE: 1.10
      CFI_PANEL_AT_OR_BELOW: -0.90
    precision: "2 decimal places, round_half_up; scale() rounded to 2dp before weighting"
    variants:
      - name: PRIVATE
        when: "Institution.legal_status in {PRIVATE_NONPROFIT, PRIVATE_FORPROFIT}"
        difference: "Three weighted components (0.40/0.35/0.25) including net_operating_ratio; no appropriation bonus"
      - name: PUBLIC
        when: "Institution.legal_status == PUBLIC"
        difference: "Two weighted components (0.50/0.50), net_operating_ratio excluded, plus a 0.50 bonus gated on state_appropriation_ratio >= 0.20 — identical ratios yield a different CFI than PRIVATE"

  - name: assurance_readiness_score
    trigger: "AssuranceArgument submit (SELF_REPORTED variant) and every evidence verify/unverify while REVIEW_LOCKED (TEAM_VERIFIED variant)"
    algorithm: weighted_scoring
    formula: |
      For each of the five criteria c in {CRIT_MISSION, CRIT_INTEGRITY,
      CRIT_TEACHING_QUALITY, CRIT_TEACHING_EVALUATION, CRIT_RESOURCES_PLANNING}:
        required_c = MIN_EVIDENCE_PER_CRITERION (3)
        coverage_c = min(count_c / required_c, 1.0)
      readiness = round_half_up(100 * sum(WEIGHT_c * coverage_c), 2dp)
      SELF_REPORTED: count_c = number of EvidenceItems of the argument with
        criterion_code == c (verification ignored).
      TEAM_VERIFIED: count_c = number of EvidenceItems with criterion_code == c
        AND verified == true.
    input_set: "EvidenceItems whose assurance_argument_id == argument.id (no status filter other than the verified flag for TEAM_VERIFIED)"
    constants:
      MIN_EVIDENCE_PER_CRITERION: 3
      ARGUMENT_MIN_TOTAL_EVIDENCE: 15
      W_CRIT_MISSION: 0.15
      W_CRIT_INTEGRITY: 0.25
      W_CRIT_TEACHING_QUALITY: 0.25
      W_CRIT_TEACHING_EVALUATION: 0.15
      W_CRIT_RESOURCES_PLANNING: 0.20
    precision: "2 decimal places, round_half_up"
    variants:
      - name: SELF_REPORTED
        when: "Computed at submit; stored on readiness_self_reported"
        difference: "Counts every attached evidence item regardless of verification"
      - name: TEAM_VERIFIED
        when: "Computed at lock and recomputed on every verify/unverify; stored on readiness_team_verified"
        difference: "Counts only verified == true items — identical evidence set yields a lower score until the team verifies"

  - name: recommended_action_determination
    trigger: "ReviewTeam file-report (POST /accreditation/review-teams/{id}/file-report)"
    algorithm: threshold
    formula: |
      Points per rating: MET = 4, MET_WITH_CONCERNS = 2, NOT_MET = 0.
      S = sum of points across the five criterion_ratings (range 0..20).
      Base severity (severity scale REAFFIRM=1 < NOTICE=2 < PROBATION=3 < SHOW_CAUSE=4):
        S >= 18     -> REAFFIRM (1)
        12 <= S <= 17 -> NOTICE (2)
        8  <= S <= 11 -> PROBATION (3)
        S <= 7      -> SHOW_CAUSE (4)
      Severity floors (nested max, applied in this fixed order):
        1. If Institution.sanction_status in {PROBATION, SHOW_CAUSE}: severity = max(severity, 2)
        2. If cycle.federal_compliance_status == DEFICIENT: severity = max(severity, 2)
           (PENDING or COMPLIANT imposes no floor)
        3. If Institution.latest_cfi_band == PANEL: severity = max(severity, 3)
      Output mapping:
        REAFFIRMATION cycle: severity -> action name directly (REAFFIRMATION/NOTICE/PROBATION/SHOW_CAUSE)
        INITIAL_ACCREDITATION cycle: severity 1 -> GRANT_INITIAL; severity 2 -> NOTICE;
          severity >= 3 -> DENIAL
    input_set: "ReviewTeam.criterion_ratings (all five), Institution.sanction_status, ReviewCycle.federal_compliance_status, Institution.latest_cfi_band at file-report time"
    constants:
      PTS_MET: 4
      PTS_MET_WITH_CONCERNS: 2
      PTS_NOT_MET: 0
      REAFFIRM_MIN_POINTS: 18
      NOTICE_MIN_POINTS: 12
      PROBATION_MIN_POINTS: 8
    precision: "integer points; no rounding"
    note: "Combinatorial mode (a): 4 inputs with non-linear interaction — tiered mapping + nested max() floors + cycle-type-conditional output mapping"

  - name: annual_dues_assessment
    trigger: "Institution creation; PATCH touching fte_enrollment or degree_levels_offered; IndicatorReport submit (fte refresh); APPROVED PROGRAM_LEVEL substantive change"
    algorithm: tiered_pricing
    formula: |
      PINNED ROUNDING ORDER: round each per-level line to whole cents first
      (round_half_up, 0dp), THEN sum the rounded lines, THEN add the base.
        line_cents(level) = round_half_up(fte_enrollment * RATE_CENTS[level] * MULT[level], 0dp)
        current_annual_dues_cents = BASE_DUES_CENTS + sum(line_cents(level) for level in degree_levels_offered)
      (Sum-then-round of the raw line values produces a different total; the
      per-line-then-sum order above is the contract.)
    input_set: "Institution.fte_enrollment and Institution.degree_levels_offered at recompute time"
    constants:
      BASE_DUES_CENTS: 250000
      RATE_CENTS: { ASSOCIATE: 33, BACCALAUREATE: 45, MASTERS: 61, DOCTORAL: 83 }
      MULT: { ASSOCIATE: 1.00, BACCALAUREATE: 1.00, MASTERS: 1.15, DOCTORAL: 1.35 }
    precision: "whole cents per line, round_half_up; integer total"

  - name: sanction_cure_determination
    trigger: "sanction-transition action=CURE on an EFFECTIVE sanction ActionOutcome"
    algorithm: aggregation
    formula: |
      Evaluation order is pinned (circular-looking dependency made explicit):
        1. cure_threshold_snapshot was frozen at OPEN_CURE_REVIEW time as
           BASE_CURE_SCORE + SANCTION_LEVEL_OFFSET[level as of that instant];
           an ESCALATE during the review resets cure_status and the snapshot.
        2. cure_evidence_score = min(100, CLEARED_REPORT_POINTS *
           count(IndicatorReports of the institution with status == CLEARED
           and evaluated_at strictly after cure_review_opened_at)).
        3. CURE succeeds iff cure_evidence_score >= cure_threshold_snapshot.
    input_set: "IndicatorReports of the same institution, filtered by status == CLEARED and evaluated_at > cure_review_opened_at"
    constants:
      BASE_CURE_SCORE: 60
      SANCTION_LEVEL_OFFSET: { NOTICE: 0, PROBATION: 15, SHOW_CAUSE: 30 }
      CLEARED_REPORT_POINTS: 25
      CURE_SCORE_CAP: 100
    precision: "integer score"
    note: "Combinatorial mode (c): the threshold depends on a sanction level that the cure/escalate outcome itself mutates — the level snapshot at review-open is the pinned evaluation order"

  - name: cohort_default_rate_assessment
    trigger: "POST /accreditation/review-cycles/{id}/record-federal-compliance"
    algorithm: chronological
    formula: |
      Input: cohort_default_rates = up to 3 most recent annual rates (percent),
      oldest first; all federal_components must be recorded.
      DEFICIENT iff:
        any single rate >= CDR_SINGLE_YEAR_PCT (40.0), OR
        three rates were provided and ALL three >= CDR_CONSECUTIVE_YEAR_PCT (30.0).
      Otherwise COMPLIANT iff every federal component result == PASS and the
      CDR test above does not fire; any component FAIL also yields DEFICIENT.
      Boundary: 30.0 exactly counts toward the three-year rule (>=);
      40.0 exactly triggers the single-year rule (>=).
    input_set: "The cycle's cohort_default_rates array (max 3, order = chronological oldest first) and federal_components array"
    constants:
      CDR_SINGLE_YEAR_PCT: 40.0
      CDR_CONSECUTIVE_YEAR_PCT: 30.0
    precision: "1 decimal place comparison on stored numbers"

  - name: enrollment_momentum_index
    trigger: "IndicatorReport submit"
    algorithm: weighted_scoring
    formula: |
      EMI = round_half_up(0.50 * enrollment_change_pct
                        + 0.30 * (completion_rate - COMPLETION_NEUTRAL_PCT)
                        + 0.20 * (retention_rate - RETENTION_NEUTRAL_PCT), 2dp)
      FLAG iff EMI < EMI_FLAG_BELOW (-5.00) — strict less-than; exactly -5.00 does not flag.
    input_set: "The submitting IndicatorReport's three non-financial metrics"
    constants:
      COMPLETION_NEUTRAL_PCT: 50.0
      RETENTION_NEUTRAL_PCT: 70.0
      EMI_FLAG_BELOW: -5.00
    precision: "2 decimal places, round_half_up"

  - name: panel_decision_tally
    trigger: "POST /accreditation/decision-panels/{id}/close"
    algorithm: aggregation
    formula: |
      prevailing = choice with the highest vote count among cast votes.
      Tie-break: among tied choices, the more severe wins under severity order
      WITHDRAW(7) > SHOW_CAUSE(6) > PROBATION(5) > NOTICE(4) > DENY(3) > REAFFIRM(2) > GRANT(1).
      Mapping to ActionOutcome.action_type: GRANT -> GRANT_INITIAL, DENY -> DENIAL,
      WITHDRAW -> WITHDRAWAL, REAFFIRM -> REAFFIRMATION, sanctions map to themselves.
    input_set: "DecisionPanel.votes at close (at least PANEL_QUORUM entries)"
    constants:
      PANEL_SIZE: 7
      PANEL_QUORUM: 5
    precision: "integer counts"

  - name: reviewer_selection_ranking
    trigger: "POST /accreditation/review-cycles/{id}/review-teams (assembly) and TeamAssignment DECLINE (replacement)"
    algorithm: weighted_scoring
    formula: |
      Candidate eligibility filter (all must hold):
        is_active == true
        affiliation_institution_id is null or != cycle.institution_id
        cycle.institution_id not in declared_conflict_institution_ids
        current_assignment_count < MAX_CONCURRENT_ASSIGNMENTS (3)
        reviewer holds no ACTIVE TeamAssignment on this cycle's teams
      Chair selection: among candidates with prior_chair_count >= CHAIR_MIN_PRIOR_VISITS (2),
        rank by quality_rating DESC, then prior_chair_count DESC, then created_at ASC;
        top candidate becomes chair. Empty chair pool -> ERR_NO_ELIGIBLE_CHAIR.
      Member selection: remaining candidates ranked by len(specialty_criteria) DESC,
        quality_rating DESC, created_at ASC; top TEAM_MEMBER_MIN (3) become members.
        Fewer than 3 members available -> ERR_INSUFFICIENT_REVIEWER_POOL.
      On DECLINE replacement: same filter and member ranking over candidates not
        already assigned to this team; empty pool leaves the seat open.
    input_set: "All Reviewer entities; exclusion and ranking keys are entity fields only"
    constants:
      TEAM_MEMBER_MIN: 3
      CHAIR_MIN_PRIOR_VISITS: 2
      MAX_CONCURRENT_ASSIGNMENTS: 3
    precision: "quality_rating compared at 2dp"
    note: "Selector policy: eligibility filter + ranking expression + created_at tie-break + empty-pool error fallback; UUIDs never participate in ranking"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles; entity-backed ownership: InstitutionLiaison X-User-ID must equal the target Institution id (directly or via the resource's parent chain); PeerReviewer X-User-ID must equal the target Reviewer id where the endpoint binds one", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path template ids resolve to existing entities, validated left-to-right; the resource-specific code per path root is one of: ERR_INSTITUTION_NOT_FOUND, ERR_ELIGIBILITY_APPLICATION_NOT_FOUND, ERR_REVIEW_CYCLE_NOT_FOUND, ERR_ASSURANCE_ARGUMENT_NOT_FOUND, ERR_EVIDENCE_ITEM_NOT_FOUND, ERR_REVIEWER_NOT_FOUND, ERR_REVIEW_TEAM_NOT_FOUND, ERR_TEAM_ASSIGNMENT_NOT_FOUND, ERR_DECISION_PANEL_NOT_FOUND, ERR_ACTION_OUTCOME_NOT_FOUND, ERR_SUBSTANTIVE_CHANGE_NOT_FOUND, ERR_INDICATOR_REPORT_NOT_FOUND", error_id: ERR_INSTITUTION_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: state, check: "Target resource is in the from-state required by the requested transition (state machine preconditions)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "ReviewCycle creation: no other cycle of the institution with status != CLOSED exists; cycle_type matches institution accreditation_status (INITIAL_ACCREDITATION requires CANDIDATE, REAFFIRMATION requires ACCREDITED)", error_id: ERR_CYCLE_ALREADY_OPEN, http_status: 409, applies_to: "POST /accreditation/institutions/{id}/review-cycles (type mismatch yields ERR_INVALID_STATE)" }
  - { priority: 6, category: state, check: "ReviewCycle advance: the sub-resource precondition of the target step holds (argument submitted / report filed / panel convened / outcome effective)", error_id: ERR_CYCLE_PREREQUISITE_NOT_MET, http_status: 409, applies_to: "POST /accreditation/review-cycles/{id}/advance" }
  - { priority: 7, category: state, check: "SubstantiveChangeRequest creation: institution accreditation_status == ACCREDITED", error_id: ERR_INSTITUTION_NOT_ACCREDITED, http_status: 409, applies_to: "POST /accreditation/institutions/{id}/substantive-change-requests" }
  - { priority: 8, category: business_safety, check: "Panel close: cycle.federal_compliance_status != DEFICIENT (federal compliance protects student-aid eligibility; checked before quorum)", error_id: ERR_FEDERAL_COMPLIANCE_DEFICIENT, http_status: 422, applies_to: "POST /accreditation/decision-panels/{id}/close" }
  - { priority: 9, category: business_safety, check: "Segregation of duties: a panel member may not hold any TeamAssignment on the same cycle, and the evidence verifier must not be the submitting liaison of that institution", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: "POST /accreditation/review-cycles/{id}/decision-panels, POST /accreditation/decision-panels/{id}/cast-vote, POST /accreditation/evidence-items/{id}/verify" }
  - { priority: 10, category: business_safety, check: "Conflict screening: panel member's affiliation_institution_id != cycle institution and institution not in declared_conflict_institution_ids", error_id: ERR_REVIEWER_CONFLICT_OF_INTEREST, http_status: 409, applies_to: "POST /accreditation/review-cycles/{id}/decision-panels, POST /accreditation/decision-panels/{id}/cast-vote" }
  - { priority: 11, category: business_constraint, check: "AssuranceArgument submit: each criterion holds >= MIN_EVIDENCE_PER_CRITERION (3) items and total >= ARGUMENT_MIN_TOTAL_EVIDENCE (15)", error_id: ERR_INSUFFICIENT_EVIDENCE_COVERAGE, http_status: 422, applies_to: "POST /accreditation/assurance-arguments/{id}/submit" }
  - { priority: 12, category: business_constraint, check: "request-revision with revision_count == MAX_ARGUMENT_REVISIONS (2) rejects the argument to REJECTED_AS_INSUFFICIENT and returns an error", error_id: ERR_MAX_REVISIONS_EXCEEDED, http_status: 409, applies_to: "POST /accreditation/assurance-arguments/{id}/request-revision" }
  - { priority: 13, category: business_constraint, check: "Team assembly: eligible reviewer pool yields at least TEAM_MEMBER_MIN (3) members", error_id: ERR_INSUFFICIENT_REVIEWER_POOL, http_status: 422, applies_to: "POST /accreditation/review-cycles/{id}/review-teams" }
  - { priority: 14, category: business_constraint, check: "Team assembly: at least one eligible candidate has prior_chair_count >= CHAIR_MIN_PRIOR_VISITS (2)", error_id: ERR_NO_ELIGIBLE_CHAIR, http_status: 422, applies_to: "POST /accreditation/review-cycles/{id}/review-teams" }
  - { priority: 15, category: business_constraint, check: "Team confirm: every ACTIVE TeamAssignment has response == ACCEPTED and conflict_status == CLEARED", error_id: ERR_TEAM_INCOMPLETE, http_status: 409, applies_to: "POST /accreditation/review-teams/{id}/confirm" }
  - { priority: 16, category: business_constraint, check: "Panel close: len(votes) >= PANEL_QUORUM (5)", error_id: ERR_PANEL_QUORUM_NOT_MET, http_status: 422, applies_to: "POST /accreditation/decision-panels/{id}/close" }
  - { priority: 17, category: business_constraint, check: "Panel close: prevailing choice is type-consistent with cycle_type (GRANT/DENY only on INITIAL_ACCREDITATION; REAFFIRM/WITHDRAW only on REAFFIRMATION)", error_id: ERR_ACTION_TYPE_MISMATCH, http_status: 422, applies_to: "POST /accreditation/decision-panels/{id}/close" }
  - { priority: 18, category: business_constraint, check: "cast-vote: the acting reviewer has not already voted on this panel", error_id: ERR_DUPLICATE_VOTE, http_status: 409, applies_to: "POST /accreditation/decision-panels/{id}/cast-vote" }
  - { priority: 19, category: business_temporal, check: "schedule-visit: no ACCEPTED member holds another effective visit window intersecting [start-buffer, end+buffer) with buffer = ONSITE_BUFFER_DAYS (1) or VIRTUAL_BUFFER_DAYS (0); half-open interval arithmetic", error_id: ERR_REVIEWER_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /accreditation/review-teams/{id}/schedule-visit" }
  - { priority: 20, category: business_temporal, check: "IndicatorReport creation: new [period_start, period_end] (closed interval) must not intersect any existing report period of the institution", error_id: ERR_REPORT_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /accreditation/institutions/{id}/indicator-reports" }
  - { priority: 21, category: business_temporal, check: "IndicatorReport creation: unless it is the institution's first report, period_start must equal the latest existing period_end + 1 day (contiguous tiling, no gap)", error_id: ERR_REPORT_PERIOD_GAP, http_status: 422, applies_to: "POST /accreditation/institutions/{id}/indicator-reports" }
  - { priority: 22, category: business_temporal, check: "ActionOutcome advance to EFFECTIVE with action_type GRANT_INITIAL: logical clock now <= Institution.candidacy_expires_at", error_id: ERR_CANDIDACY_EXPIRED, http_status: 409, applies_to: "POST /accreditation/action-outcomes/{id}/advance" }
  - { priority: 23, category: business_referential, check: "SubstantiveChangeRequest submit and APPROVE: Institution.sanction_status in {NONE, NOTICE}", error_id: ERR_SANCTION_BLOCKS_CHANGE, http_status: 409, applies_to: "POST /accreditation/substantive-change-requests/{id}/submit, POST /accreditation/substantive-change-requests/{id}/decide" }
  - { priority: 24, category: business_referential, check: "Acting PeerReviewer is bound to the target: assignment.respond requires reviewer_id match; schedule-visit / file-report require chair; verify requires ACCEPTED membership on the cycle's team", error_id: ERR_REVIEWER_NOT_ASSIGNED, http_status: 409, applies_to: "POST /accreditation/team-assignments/{id}/respond, POST /accreditation/review-teams/{id}/schedule-visit, POST /accreditation/review-teams/{id}/file-report, POST /accreditation/evidence-items/{id}/verify" }
  - { priority: 25, category: business_fiscal, check: "SubstantiveChangeRequest submit: Institution.outstanding_dues_cents == 0", error_id: ERR_DUES_ARREARS, http_status: 402, applies_to: "POST /accreditation/substantive-change-requests/{id}/submit" }
  - { priority: 26, category: business_fiscal, check: "sanction-transition CURE: cure_evidence_score >= cure_threshold_snapshot", error_id: ERR_CURE_THRESHOLD_NOT_MET, http_status: 422, applies_to: "POST /accreditation/action-outcomes/{id}/sanction-transition" }


# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Institution ----------------------------------------------------------
  - { method: POST, path: "/accreditation/institutions", description: "Onboard an institution (starts PROSPECTIVE / sanction NONE); computes current_annual_dues_cents and initializes dues_paid_cents equal to it so a new institution has zero arrears", roles: [CommissionAdmin], code: 201, input: ["legal_name", "legal_status", "state_code", "fte_enrollment", "degree_levels_offered"], output: Institution, side_effects: ["annual_dues_assessment computed", "dues_paid_cents := current_annual_dues_cents"] }
  - { method: GET, path: "/accreditation/institutions", description: "Paginated institution directory with filters", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?", "accreditation_status?", "sanction_status?", "legal_status?"], output: "Institution[]", side_effects: [] }
  - { method: GET, path: "/accreditation/institutions/{id}", description: "Single institution read", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: [], output: Institution, side_effects: [] }
  - { method: PATCH, path: "/accreditation/institutions/{id}", description: "Profile update with OCC; recompute dues when fte_enrollment or degree_levels_offered change", roles: [CommissionStaff], code: 200, input: ["expected_institution_version", "legal_name?", "legal_status?", "state_code?", "fte_enrollment?", "degree_levels_offered?", "dues_paid_cents?"], output: Institution, side_effects: ["increments Institution.version by 1", "recompute current_annual_dues_cents when fte_enrollment or degree_levels_offered supplied", "legal_status change flips the CFI variant used by future indicator submits"] }

  # --- Eligibility & candidacy ----------------------------------------------
  - { method: POST, path: "/accreditation/institutions/{id}/eligibility-applications", description: "Liaison drafts an eligibility application for the institution (institution must be PROSPECTIVE)", roles: [InstitutionLiaison], code: 201, input: ["pathway", "statement_of_intent"], output: EligibilityApplication, side_effects: [] }
  - { method: GET, path: "/accreditation/institutions/{id}/eligibility-applications", description: "Eligibility applications of an institution", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?"], output: "EligibilityApplication[]", side_effects: [] }
  - { method: POST, path: "/accreditation/eligibility-applications/{id}/file", description: "File (or re-file after DEFICIENT) the application", roles: [InstitutionLiaison], code: 200, input: [], output: EligibilityApplication, side_effects: ["filed_at := now"] }
  - { method: POST, path: "/accreditation/eligibility-applications/{id}/adjudicate", description: "Staff decision: APPROVE (institution -> CANDIDATE with pathway), DENY, or REQUEST_COMPLETION (-> DEFICIENT)", roles: [CommissionStaff], code: 200, input: ["decision", "adjudication_notes?"], output: EligibilityApplication, side_effects: ["APPROVE transitions Institution PROSPECTIVE -> CANDIDATE and stamps candidacy pathway/start/expiry"] }

  # --- Review cycle ----------------------------------------------------------
  - { method: POST, path: "/accreditation/institutions/{id}/review-cycles", description: "Open a comprehensive review cycle; at most one non-CLOSED cycle per institution (ERR_CYCLE_ALREADY_OPEN); INITIAL_ACCREDITATION requires CANDIDATE, REAFFIRMATION requires ACCREDITED (ERR_INVALID_STATE)", roles: [CommissionStaff], code: 201, input: ["cycle_type"], output: ReviewCycle, side_effects: [] }
  - { method: GET, path: "/accreditation/institutions/{id}/review-cycles", description: "Cycles of an institution", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?", "status?"], output: "ReviewCycle[]", side_effects: [] }
  - { method: GET, path: "/accreditation/review-cycles/{id}", description: "Single cycle read (exposes version for OCC)", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: [], output: ReviewCycle, side_effects: [] }
  - { method: POST, path: "/accreditation/review-cycles/{id}/advance", description: "Deterministic one-step forward transition; per-step sub-resource preconditions per §1.2 (ERR_CYCLE_PREREQUISITE_NOT_MET); PANEL_REVIEW -> DECIDED never via this endpoint", roles: [CommissionStaff], code: 200, input: [], output: ReviewCycle, side_effects: ["increments ReviewCycle.version by 1"] }
  - { method: POST, path: "/accreditation/review-cycles/{id}/record-federal-compliance", description: "Record federal compliance components and cohort default rates; computes cohort_default_rate_assessment and sets federal_compliance_status COMPLIANT | DEFICIENT", roles: [CommissionStaff], code: 200, input: ["federal_components", "cohort_default_rates"], output: ReviewCycle, side_effects: ["cohort_default_rate_assessment computed", "increments ReviewCycle.version by 1"] }

  # --- Assurance argument & evidence -----------------------------------------
  - { method: POST, path: "/accreditation/review-cycles/{id}/assurance-arguments", description: "Liaison drafts the assurance argument (cycle must be MATERIALS_OPEN)", roles: [InstitutionLiaison], code: 201, input: ["narrative_text"], output: AssuranceArgument, side_effects: [] }
  - { method: GET, path: "/accreditation/review-cycles/{id}/assurance-arguments", description: "Arguments of a cycle", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?"], output: "AssuranceArgument[]", side_effects: [] }
  - { method: GET, path: "/accreditation/assurance-arguments/{id}", description: "Single argument read (readiness scores live here)", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: [], output: AssuranceArgument, side_effects: [] }
  - { method: POST, path: "/accreditation/assurance-arguments/{id}/submit", description: "Submit from DRAFT or REVISION_REQUESTED; evidence coverage gate (ERR_INSUFFICIENT_EVIDENCE_COVERAGE); recomputes readiness_self_reported", roles: [InstitutionLiaison], code: 200, input: [], output: AssuranceArgument, side_effects: ["assurance_readiness_score(SELF_REPORTED) recomputed"] }
  - { method: POST, path: "/accreditation/assurance-arguments/{id}/request-revision", description: "Staff sends argument back for revision; at revision_count == 2 the argument is instead rejected to REJECTED_AS_INSUFFICIENT and the call fails ERR_MAX_REVISIONS_EXCEEDED", roles: [CommissionStaff], code: 200, input: [], output: AssuranceArgument, side_effects: ["revision_count += 1 on success"] }
  - { method: POST, path: "/accreditation/assurance-arguments/{id}/lock", description: "Lock the submitted argument for the visit (cycle must be EVALUATION_ACTIVE); initializes readiness_team_verified", roles: [CommissionStaff], code: 200, input: [], output: AssuranceArgument, side_effects: ["assurance_readiness_score(TEAM_VERIFIED) initialized"] }
  - { method: POST, path: "/accreditation/assurance-arguments/{id}/evidence-items", description: "Attach evidence (argument must be DRAFT or REVISION_REQUESTED)", roles: [InstitutionLiaison], code: 201, input: ["criterion_code", "evidence_type", "title", "document_uri"], output: EvidenceItem, side_effects: [] }
  - { method: GET, path: "/accreditation/assurance-arguments/{id}/evidence-items", description: "Evidence items of an argument", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?", "criterion_code?"], output: "EvidenceItem[]", side_effects: [] }
  - { method: POST, path: "/accreditation/evidence-items/{id}/verify", description: "Toggle verification during the visit; caller must be an ACCEPTED member of the cycle's team and the argument must be REVIEW_LOCKED; recomputes readiness_team_verified", roles: [PeerReviewer], code: 200, input: ["verified"], output: EvidenceItem, side_effects: ["assurance_readiness_score(TEAM_VERIFIED) recomputed"] }

  # --- Reviewer registry ------------------------------------------------------
  - { method: POST, path: "/accreditation/reviewers", description: "Register a peer reviewer", roles: [CommissionStaff], code: 201, input: ["full_name", "specialty_criteria", "quality_rating", "affiliation_institution_id?", "declared_conflict_institution_ids?", "prior_chair_count?", "is_active?"], output: Reviewer, side_effects: [] }
  - { method: GET, path: "/accreditation/reviewers", description: "Reviewer directory with filters (affiliation_institution_id supports FK reverse-reachability)", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?", "affiliation_institution_id?", "specialty?", "is_active?"], output: "Reviewer[]", side_effects: [] }
  - { method: GET, path: "/accreditation/reviewers/{id}", description: "Single reviewer read", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: [], output: Reviewer, side_effects: [] }
  - { method: PATCH, path: "/accreditation/reviewers/{id}", description: "Update reviewer attributes (conflicts, specialties, rating, availability)", roles: [CommissionStaff], code: 200, input: ["affiliation_institution_id?", "specialty_criteria?", "declared_conflict_institution_ids?", "quality_rating?", "prior_chair_count?", "is_active?"], output: Reviewer, side_effects: ["increments Reviewer.version by 1", "re-screens the reviewer's ACTIVE TeamAssignments: a newly declared conflict or affiliation matching the assignment's cycle institution flips conflict_status to CONFLICTED"] }

  # --- Peer review team, assignments, site visit ------------------------------
  - { method: POST, path: "/accreditation/review-cycles/{id}/review-teams", description: "Auto-assemble a team via reviewer_selection_ranking (1 chair + 3 members, conflict-screened); OCC on the cycle; only one non-DISBANDED team per cycle (ERR_INVALID_STATE)", roles: [CommissionStaff], code: 201, input: ["visit_modality", "expected_review_cycle_version"], output: ReviewTeam, side_effects: ["creates 4 TeamAssignments (1 CHAIR + 3 MEMBER, conflict_status auto-screened, response PENDING)", "increments ReviewCycle.version by 1", "Reviewer.current_assignment_count incremented per created assignment"] }
  - { method: GET, path: "/accreditation/review-cycles/{id}/review-teams", description: "Teams of a cycle", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?"], output: "ReviewTeam[]", side_effects: [] }
  - { method: GET, path: "/accreditation/review-teams/{id}", description: "Single team read (visit window, ratings, computed recommendation)", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: [], output: ReviewTeam, side_effects: [] }
  - { method: GET, path: "/accreditation/review-teams/{id}/assignments", description: "Assignments of a team", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?", "reviewer_id?"], output: "TeamAssignment[]", side_effects: [] }
  - { method: GET, path: "/accreditation/reviewers/{id}/assignments", description: "Assignments of a reviewer", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?"], output: "TeamAssignment[]", side_effects: [] }
  - { method: POST, path: "/accreditation/team-assignments/{id}/respond", description: "Reviewer accepts or declines; DECLINE closes the assignment, decrements load, and auto-creates a replacement via the selector", roles: [PeerReviewer], code: 200, input: ["response"], output: TeamAssignment, side_effects: ["on DECLINE: selector replacement attempt", "reviewer load bookkeeping per reviewer_load_conservation"] }
  - { method: POST, path: "/accreditation/review-teams/{id}/confirm", description: "Confirm a fully accepted team", roles: [CommissionStaff], code: 200, input: [], output: ReviewTeam, side_effects: [] }
  - { method: POST, path: "/accreditation/review-teams/{id}/schedule-visit", description: "Chair schedules the visit window; buffered overlap check across all accepted members (ERR_REVIEWER_WINDOW_CONFLICT); argument must be REVIEW_LOCKED", roles: [PeerReviewer], code: 200, input: ["visit_start_at", "visit_end_at"], output: ReviewTeam, side_effects: ["visit window stored"] }
  - { method: POST, path: "/accreditation/review-teams/{id}/file-report", description: "Chair files the visit report with per-criterion ratings; computes recommended_action_determination; requires clock >= visit_end_at", roles: [PeerReviewer], code: 200, input: ["criterion_ratings", "report_recommendation", "report_summary"], output: ReviewTeam, side_effects: ["recommended_action_computed computed", "report_filed_at := now"] }
  - { method: POST, path: "/accreditation/review-teams/{id}/cancel-visit", description: "Cancel a scheduled visit; team returns to CONFIRMED and the window is released", roles: [CommissionStaff], code: 200, input: [], output: ReviewTeam, side_effects: ["visit window cleared"] }

  # --- Decision panel & action outcome ----------------------------------------
  - { method: POST, path: "/accreditation/review-cycles/{id}/decision-panels", description: "Convene the decision panel (exactly 7 members; segregation + conflict screening)", roles: [CommissionStaff], code: 201, input: ["member_reviewer_ids"], output: DecisionPanel, side_effects: [] }
  - { method: GET, path: "/accreditation/review-cycles/{id}/decision-panels", description: "Panels of a cycle", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?"], output: "DecisionPanel[]", side_effects: [] }
  - { method: POST, path: "/accreditation/decision-panels/{id}/cast-vote", description: "Panel member casts one vote; duplicates rejected ERR_DUPLICATE_VOTE; segregation re-checked", roles: [PeerReviewer], code: 201, input: ["choice"], output: DecisionPanel, side_effects: ["vote appended to panel.votes"] }
  - { method: POST, path: "/accreditation/decision-panels/{id}/close", description: "Close the panel: federal-compliance gate, quorum gate, tally, then the panel-close cascade (outcome drafted, cycle DECIDED, team disbanded)", roles: [CommissionStaff], code: 200, input: [], output: DecisionPanel, side_effects: ["panel_decision_tally", "create ActionOutcome DRAFTED", "ReviewCycle -> DECIDED", "ReviewTeam -> DISBANDED with assignment closure and reviewer load decrement", "AssuranceArgument REVIEW_LOCKED -> ACCEPTED when prevailing action is not DENIAL"] }
  - { method: GET, path: "/accreditation/review-cycles/{id}/action-outcomes", description: "Outcomes of a cycle", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?"], output: "ActionOutcome[]", side_effects: [] }
  - { method: GET, path: "/accreditation/institutions/{id}/action-outcomes", description: "Outcomes targeting an institution (includes INDICATOR_MONITOR cascade outcomes)", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?"], output: "ActionOutcome[]", side_effects: [] }
  - { method: POST, path: "/accreditation/action-outcomes/{id}/advance", description: "DRAFTED -> DISCLOSED (public disclosure stamped) -> EFFECTIVE (institution mutations applied)", roles: [CommissionStaff], code: 200, input: [], output: ActionOutcome, side_effects: ["disclosure stamps at DISCLOSED", "effectuation applies accreditation_status / sanction_status mutations per §1.2"] }
  - { method: POST, path: "/accreditation/action-outcomes/{id}/sanction-transition", description: "Sanction sub-lifecycle on an EFFECTIVE sanction outcome: OPEN_CURE_REVIEW (freezes cure_threshold_snapshot), CURE (threshold-gated), ESCALATE (single-step ladder; at SHOW_CAUSE removes membership)", roles: [CommissionStaff], code: 200, input: ["action"], output: ActionOutcome, side_effects: ["per §1.2 ActionOutcome sanction transitions incl. Institution.sanction_status cascade"] }

  # --- Substantive change ------------------------------------------------------
  - { method: POST, path: "/accreditation/institutions/{id}/substantive-change-requests", description: "Liaison drafts a substantive change (institution must be ACCREDITED); type-specific required detail fields", roles: [InstitutionLiaison], code: 201, input: ["change_type", "requested_program_level?", "new_location_state?", "ownership_details?"], output: SubstantiveChangeRequest, side_effects: [] }
  - { method: GET, path: "/accreditation/institutions/{id}/substantive-change-requests", description: "Change requests of an institution", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?", "status?"], output: "SubstantiveChangeRequest[]", side_effects: [] }
  - { method: POST, path: "/accreditation/substantive-change-requests/{id}/submit", description: "Submit from DRAFT or DEFERRED; sanction gate then dues gate", roles: [InstitutionLiaison], code: 200, input: [], output: SubstantiveChangeRequest, side_effects: [] }
  - { method: POST, path: "/accreditation/substantive-change-requests/{id}/decide", description: "Staff decision APPROVE (applies type-specific institution mutation) | DENY | DEFER", roles: [CommissionStaff], code: 200, input: ["decision", "decision_notes?"], output: SubstantiveChangeRequest, side_effects: ["APPROVE side effects per §1.2 (locations_count / degree_levels + dues recompute / distance_delivery_approved)"] }

  # --- Indicator monitoring ----------------------------------------------------
  - { method: POST, path: "/accreditation/institutions/{id}/indicator-reports", description: "Open a DUE indicator report for a period; contiguous tiling enforced (ERR_REPORT_PERIOD_OVERLAP / ERR_REPORT_PERIOD_GAP)", roles: [CommissionStaff], code: 201, input: ["period_start", "period_end"], output: IndicatorReport, side_effects: [] }
  - { method: GET, path: "/accreditation/institutions/{id}/indicator-reports", description: "Indicator reports of an institution", roles: [CommissionAdmin, CommissionStaff, InstitutionLiaison, PeerReviewer], code: 200, input: ["limit?", "offset?", "status?"], output: "IndicatorReport[]", side_effects: [] }
  - { method: POST, path: "/accreditation/indicator-reports/{id}/submit", description: "Liaison submits financial + non-financial metrics; computes CFI (variant by legal_status) and EMI; refreshes institution FTE and dues", roles: [InstitutionLiaison], code: 200, input: ["primary_reserve_ratio", "viability_ratio", "net_operating_ratio", "enrollment_change_pct", "completion_rate", "retention_rate", "fte_enrollment", "state_appropriation_ratio?"], output: IndicatorReport, side_effects: ["composite_financial_index + enrollment_momentum_index computed", "Institution.fte_enrollment refreshed and annual_dues_assessment recomputed"] }
  - { method: POST, path: "/accreditation/indicator-reports/{id}/evaluate", description: "Staff evaluates: CLEARED / FLAGGED_REVIEW / FLAGGED_PANEL per CFI band + EMI; FLAGGED_PANEL fires the sanction cascade (outcome created EFFECTIVE, institution NOTICE, changes frozen)", roles: [CommissionStaff], code: 200, input: [], output: IndicatorReport, side_effects: ["Institution.latest_cfi_value / latest_cfi_band updated", "FLAGGED_PANEL: sanction cascade per §1.2 IndicatorReport"] }

  # --- Logical clock (test-driving endpoint) ------------------------------------
  - { method: POST, path: "/accreditation/_clock/set_current_utc", description: "Set the logical clock. Startup default before any call is exactly 2026-09-01T00:00:00Z; the server never falls back to wall-clock time", roles: [CommissionAdmin], code: 200, input: ["to_iso8601"], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers, or undeclared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on the endpoint, or entity-backed ownership mismatch (liaison acting on another institution, reviewer acting outside own binding)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed payload: missing required field, wrong type, invalid enum member, or type-specific detail field missing (e.g., requested_program_level for PROGRAM_LEVEL)" }
  - { id: ERR_INSTITUTION_NOT_FOUND, http: 404, condition: "No Institution with the given id" }
  - { id: ERR_ELIGIBILITY_APPLICATION_NOT_FOUND, http: 404, condition: "No EligibilityApplication with the given id" }
  - { id: ERR_REVIEW_CYCLE_NOT_FOUND, http: 404, condition: "No ReviewCycle with the given id" }
  - { id: ERR_ASSURANCE_ARGUMENT_NOT_FOUND, http: 404, condition: "No AssuranceArgument with the given id" }
  - { id: ERR_EVIDENCE_ITEM_NOT_FOUND, http: 404, condition: "No EvidenceItem with the given id" }
  - { id: ERR_REVIEWER_NOT_FOUND, http: 404, condition: "No Reviewer with the given id" }
  - { id: ERR_REVIEW_TEAM_NOT_FOUND, http: 404, condition: "No ReviewTeam with the given id" }
  - { id: ERR_TEAM_ASSIGNMENT_NOT_FOUND, http: 404, condition: "No TeamAssignment with the given id" }
  - { id: ERR_DECISION_PANEL_NOT_FOUND, http: 404, condition: "No DecisionPanel with the given id" }
  - { id: ERR_ACTION_OUTCOME_NOT_FOUND, http: 404, condition: "No ActionOutcome with the given id" }
  - { id: ERR_SUBSTANTIVE_CHANGE_NOT_FOUND, http: 404, condition: "No SubstantiveChangeRequest with the given id" }
  - { id: ERR_INDICATOR_REPORT_NOT_FOUND, http: 404, condition: "No IndicatorReport with the given id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a from-state permitting the requested transition (includes second-open-cycle type mismatch, team already assembled, terminal-state calls)" }
  - { id: ERR_CYCLE_ALREADY_OPEN, http: 409, condition: "ReviewCycle creation while another cycle of the same institution has status != CLOSED" }
  - { id: ERR_CYCLE_PREREQUISITE_NOT_MET, http: 409, condition: "Cycle advance or visit scheduling blocked because a sub-resource precondition fails (argument not submitted, no filed report, no convened panel, outcome not effective, argument not locked)" }
  - { id: ERR_INSTITUTION_NOT_ACCREDITED, http: 409, condition: "SubstantiveChangeRequest creation against an institution whose accreditation_status is not ACCREDITED" }
  - { id: ERR_FEDERAL_COMPLIANCE_DEFICIENT, http: 422, condition: "Panel close while cycle.federal_compliance_status == DEFICIENT (checked before quorum)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Panel member holds a TeamAssignment on the same cycle, or an evidence verifier is not an ACCEPTED team member (liaison may never verify)" }
  - { id: ERR_REVIEWER_CONFLICT_OF_INTEREST, http: 409, condition: "Panel member is affiliated with, or has declared a conflict against, the institution under review" }
  - { id: ERR_INSUFFICIENT_EVIDENCE_COVERAGE, http: 422, condition: "Argument submit with any criterion below MIN_EVIDENCE_PER_CRITERION (3) or total below ARGUMENT_MIN_TOTAL_EVIDENCE (15)" }
  - { id: ERR_MAX_REVISIONS_EXCEEDED, http: 409, condition: "request-revision with revision_count == MAX_ARGUMENT_REVISIONS (2); the argument transitions to REJECTED_AS_INSUFFICIENT within the same rejected request" }
  - { id: ERR_INSUFFICIENT_REVIEWER_POOL, http: 422, condition: "Team assembly cannot fill 3 member seats from the eligible, conflict-screened pool" }
  - { id: ERR_NO_ELIGIBLE_CHAIR, http: 422, condition: "Team assembly finds no eligible candidate with prior_chair_count >= CHAIR_MIN_PRIOR_VISITS (2)" }
  - { id: ERR_TEAM_INCOMPLETE, http: 409, condition: "Team confirm while any ACTIVE assignment is not ACCEPTED" }
  - { id: ERR_PANEL_QUORUM_NOT_MET, http: 422, condition: "Panel close with fewer than PANEL_QUORUM (5) cast votes" }
  - { id: ERR_ACTION_TYPE_MISMATCH, http: 422, condition: "Panel close prevailing choice inconsistent with cycle_type (GRANT/DENY only for INITIAL_ACCREDITATION; REAFFIRM/WITHDRAW only for REAFFIRMATION)" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "cast-vote by a reviewer who already has a vote recorded on this panel" }
  - { id: ERR_REVIEWER_WINDOW_CONFLICT, http: 409, condition: "schedule-visit whose modality-buffered half-open window intersects another ACCEPTED member's existing effective visit window" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "IndicatorReport period (closed interval) intersects an existing report period of the institution" }
  - { id: ERR_REPORT_PERIOD_GAP, http: 422, condition: "IndicatorReport period_start is not exactly the latest existing period_end + 1 day (and it is not the institution's first report)" }
  - { id: ERR_CANDIDACY_EXPIRED, http: 409, condition: "GRANT_INITIAL effectuation when the logical clock is past Institution.candidacy_expires_at" }
  - { id: ERR_SANCTION_BLOCKS_CHANGE, http: 409, condition: "Substantive-change submit or APPROVE while Institution.sanction_status is PROBATION or SHOW_CAUSE" }
  - { id: ERR_REVIEWER_NOT_ASSIGNED, http: 409, condition: "PeerReviewer binding failure: respond on another reviewer's assignment; schedule-visit / file-report by a non-chair; verify by a reviewer without an ACCEPTED assignment on the cycle's team" }
  - { id: ERR_REVIEWER_CAPACITY_EXCEEDED, http: 409, condition: "Accepting an assignment would push the reviewer past MAX_CONCURRENT_ASSIGNMENTS (3)" }
  - { id: ERR_DUES_ARREARS, http: 402, condition: "Substantive-change submit while Institution.outstanding_dues_cents > 0" }
  - { id: ERR_CURE_THRESHOLD_NOT_MET, http: 422, condition: "sanction-transition CURE with cure_evidence_score below cure_threshold_snapshot" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_<parent>_version does not equal the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CommissionAdmin
    description: "Commission platform administrator; onboards institutions and operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /accreditation/institutions"
      - "POST /accreditation/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: CommissionStaff
    description: "Commission program staff; adjudicates eligibility, manages cycles, assembles teams, convenes and closes panels, publishes and effectuates outcomes, runs sanction lifecycle, evaluates indicator reports, decides substantive changes"
    identity: opaque
    exclusive_operations:
      - "PATCH /accreditation/institutions/{id}"
      - "POST /accreditation/eligibility-applications/{id}/adjudicate"
      - "POST /accreditation/institutions/{id}/review-cycles"
      - "POST /accreditation/review-cycles/{id}/advance"
      - "POST /accreditation/review-cycles/{id}/record-federal-compliance"
      - "POST /accreditation/assurance-arguments/{id}/request-revision"
      - "POST /accreditation/assurance-arguments/{id}/lock"
      - "POST /accreditation/reviewers and PATCH /accreditation/reviewers/{id}"
      - "POST /accreditation/review-cycles/{id}/review-teams"
      - "POST /accreditation/review-teams/{id}/confirm and cancel-visit"
      - "POST /accreditation/review-cycles/{id}/decision-panels and POST /accreditation/decision-panels/{id}/close"
      - "POST /accreditation/action-outcomes/{id}/advance and sanction-transition"
      - "POST /accreditation/substantive-change-requests/{id}/decide"
      - "POST /accreditation/institutions/{id}/indicator-reports and POST /accreditation/indicator-reports/{id}/evaluate"
    shared_operations:
      - "All GET endpoints"

  - name: InstitutionLiaison
    description: "Institutional accreditation liaison officer; X-User-ID equals the Institution id the liaison represents; authors eligibility filings, assurance arguments, evidence, substantive-change requests and indicator submissions"
    identity: "entity_backed:Institution"
    exclusive_operations:
      - "POST /accreditation/institutions/{id}/eligibility-applications and /file"
      - "POST /accreditation/review-cycles/{id}/assurance-arguments"
      - "POST /accreditation/assurance-arguments/{id}/submit"
      - "POST /accreditation/assurance-arguments/{id}/evidence-items"
      - "POST /accreditation/institutions/{id}/substantive-change-requests and /submit"
      - "POST /accreditation/indicator-reports/{id}/submit"
    shared_operations:
      - "All GET endpoints"

  - name: PeerReviewer
    description: "Peer reviewer; X-User-ID equals the Reviewer id; responds to assignments, verifies evidence as an ACCEPTED team member (segregated from the liaison), chairs schedule/file the visit report, seated panelists cast votes"
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /accreditation/team-assignments/{id}/respond"
      - "POST /accreditation/evidence-items/{id}/verify"
      - "POST /accreditation/review-teams/{id}/schedule-visit"
      - "POST /accreditation/review-teams/{id}/file-report"
      - "POST /accreditation/decision-panels/{id}/cast-vote"
    shared_operations:
      - "All GET endpoints"
