        claim_type: Correct Result
        grounds: [calculations.channel_sync, entities.ChannelMapping.fields.manual_rate_override, entities.ChannelMapping.fields.parity_status]
        distinguishing_aspect: "OTA_B with manual_rate_override 200 under published_rate 230 (markup 0.15): net 173.91 < direct net 230*0.98=225.4 -> OUT_OF_PARITY (the only path producing this enum)."
        test_recipe:
          setup: ["Property/RoomType; master BAR published_rate 230 (DIRECT markup 0); OTA_B markup 0.15"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
