              captures: { dl_a: $.data.id }
            - call: "POST /repair-orders/${ro_a}/estimate-lines"
              payload: { damage_line_id: "${dl_a}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5, not_included_operation: true }
              as: Estimator
              as_user_id: "est-100"
              captures: { el_a: $.data.id }
            - call: "POST /repair-orders/${ro_a}/blueprint"
