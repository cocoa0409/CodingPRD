# =============================================================================
# PRD Benchmark Scaffold — §1.0–§1.7
# Task: task_2417_warehouse_line_of_credit_for_mortgage_bankers
# Difficulty band: Expert-plus (beyond §0.4 Expert)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2417. Warehouse Line of Credit for Mortgage Bankers (warehouse lending group): facility approval with advance rates by loan product and sublimits for aged or scratch-and-dent loans, wet versus dry funding with document custodian receipt requirements, collateral tracking from funding through investor purchase with dwell-time limits, margin calls when investor commitments or valuations fall, take-out investor approval lists and concentration limits, curtailment on aged loans and repurchase of ineligible collateral, covenant monitoring on net worth, liquidity and profitability, wire fraud controls and bailee letter management

domain_name: warehouse-lending-facility

# Flat topology: every entity owns a top-level collection, so there is no single
# shared resource prefix. `/` is the API root; all paths below are absolute.
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  state_machine_shape: parallel
  # Advance carries two independent state axes (funding_status × custody_status);
  # WarehouseFacility is cyclic (ACTIVE→RESTRICTED→ACTIVE); WireInstruction is
  # branching (PENDING_VERIFICATION→{VERIFIED,BLOCKED}) with divergent cascades.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic   # MarginCall.advance_id is null for facility-level calls

  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: expert_plus
  notes: |
    Density drivers: (1) the advance sizing pipeline is a five-stage waterfall whose
    last stage is a closed-form solve of a circular concentration constraint;
    (2) every money movement is mirrored into an append-only LedgerEntry log that
    two named conserved quantities are audited against; (3) three separate
    segregation-of-duties gates key off X-User-ID; (4) the aging-run epoch endpoint
    fans curtailment, receipt-overdue, bailee-expiry and margin-call-default work
    out of a single call, each of which cascades further.

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: WarehouseFacility
    parent: null
    common_fields: true
    fields:
      - name: borrower_legal_name
        type: string
        source: input
        description: Legal name of the mortgage banker borrowing on the line.
        constraints: non-empty, max 200 chars
      - name: committed_amount_cents
        type: integer
        source: input
        description: Total committed line size in cents.
        constraints: ">= 100000000"
      - name: wet_sublimit_cents
        type: integer
        source: input
        description: Maximum aggregate outstanding attributable to WET-funded advances.
        constraints: ">= 0 and <= committed_amount_cents"
      - name: aged_sublimit_cents
        type: integer
        source: input
        description: Maximum aggregate outstanding attributable to advances whose is_aged is true.
        constraints: ">= 0 and <= committed_amount_cents"
      - name: scratch_and_dent_sublimit_cents
        type: integer
        source: input
        description: Maximum aggregate outstanding attributable to product_code SCRATCH_AND_DENT advances.
        constraints: ">= 0 and <= committed_amount_cents"
      - name: min_tangible_net_worth_cents
        type: integer
        source: input
        description: Net-worth covenant floor tested by every CovenantTest.
        constraints: ">= 0"
      - name: min_liquidity_cents
        type: integer
        source: input
        description: Liquidity covenant floor tested by every CovenantTest.
        constraints: ">= 0"
      - name: min_ttm_net_income_cents
        type: integer
        source: input
        description: Profitability covenant floor compared against CovenantTest.profitability_metric_cents.
        constraints: ">= 0"
      - name: max_investor_concentration_pct
        type: number
        source: input
        description: Facility-wide cap on any single take-out investor's share of outstanding principal.
        constraints: "> 0 and < 1, four decimal places"
      - name: bailee_period_days
        type: integer
        source: input
        default: 30
        description: Number of days a BaileeLetter stays live after issuance.
        constraints: ">= 1 and <= 90"
      - name: unused_line_fee_rate
        type: number
        source: input
        description: Annual non-usage fee rate applied to the undrawn portion of the line.
        constraints: ">= 0 and < 1"
      - name: settlement_account_last4
        type: string
        source: input
        description: Last four digits of the borrower's verified settlement account; every WireInstruction payee account must match this exactly.
        constraints: exactly 4 digits
      - name: status
        type: enum
        source: system
        default: PENDING_APPROVAL
        description: Facility lifecycle and gating posture.
        constraints: "one of {PENDING_APPROVAL, ACTIVE, RESTRICTED, SUSPENDED}"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditOfficer who created the facility; the approver must differ from this value.
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the CreditOfficer who approved the facility; null until approved.
      - name: approved_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of approval; null until approved.
      - name: last_accrual_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent fee accrual; set at approval and refreshed by every aging-run.
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: Principal drawn on the line; equals sum(LedgerEntry.amount_cents where entry_type in PRINCIPAL_TYPES and direction=DEBIT) minus sum(... direction=CREDIT) for this facility.
      - name: availability_cents
        type: integer
        source: computed
        description: committed_amount_cents minus outstanding_principal_cents, floored at 0.
      - name: accrued_fee_balance_cents
        type: integer
        source: computed
        description: sum(LedgerEntry.amount_cents where entry_type=FEE_ACCRUAL) minus sum(... entry_type=FEE_PAYMENT) for this facility.
      - name: wet_outstanding_cents
        type: integer
        source: computed
        description: Sum of Advance.outstanding_balance_cents over advances of this facility with funding_type=WET, custody_status in {PENDING_RECEIPT, RECEIPT_OVERDUE} and funding_status in {FUNDED, SHIPPED}.
      - name: aged_outstanding_cents
        type: integer
        source: computed
        description: Sum of Advance.outstanding_balance_cents over advances of this facility with is_aged=true and funding_status in {FUNDED, SHIPPED}.
      - name: scratch_and_dent_outstanding_cents
        type: integer
        source: computed
        description: Sum of Advance.outstanding_balance_cents over advances of this facility with product_code=SCRATCH_AND_DENT and funding_status in {FUNDED, SHIPPED}.
      - name: open_margin_call_count
        type: integer
        source: computed
        description: Count of MarginCall rows of this facility with status in {ISSUED, PARTIALLY_CURED}.
      - name: consecutive_breach_count
        type: integer
        source: computed
        default: 0
        description: Number of consecutive CovenantTest rows ending at the latest period_end whose status is BREACH; reset to 0 by a PASS test or by waiving the latest BREACH.
      - name: last_covenant_status
        type: enum
        source: computed
        default: NOT_TESTED
        description: Status of the CovenantTest with the greatest period_end (tie-break created_at DESC); NOT_TESTED when none exist.
        constraints: "one of {NOT_TESTED, PASS, BREACH, WAIVED}"
      - name: escalated_demand_count
        type: integer
        source: computed
        description: Count of RepurchaseDemand rows with status=ESCALATED across all advances of this facility.

  - name: ProductAdvanceRate
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> WarehouseFacility.id; the facility this product rate configures.
      - name: product_code
        type: enum
        source: input
        description: Loan product this rate applies to.
        constraints: "one of {CONFORMING, JUMBO, FHA_VA, NON_QM, SCRATCH_AND_DENT}; unique per (facility_id, product_code)"
      - name: advance_rate
        type: number
        source: input
        description: Base advance rate against loan_amount_cents for DRY funding.
        constraints: "> 0 and <= 1, four decimal places"
      - name: wet_funding_allowed
        type: boolean
        source: input
        default: true
        description: Whether WET funding is permitted for this product.
      - name: wet_haircut
        type: number
        source: input
        default: 0.02
        description: Rate reduction applied while a WET advance's custody_status is PENDING_RECEIPT or RECEIPT_OVERDUE.
        constraints: ">= 0 and < advance_rate"
      - name: dwell_limit_days
        type: integer
        source: input
        description: Maximum dwell_days before curtailment begins; curtailment applies only when dwell_days is strictly greater than this value.
        constraints: ">= 1 and <= 365"
      - name: aging_step_days
        type: integer
        source: input
        default: 15
        description: Size in days of each curtailment step beyond dwell_limit_days.
        constraints: ">= 1"
      - name: curtailment_step_rate
        type: number
        source: input
        default: 0.005
        description: Rate reduction applied per completed aging step.
        constraints: ">= 0 and < 1"
      - name: product_sublimit_cents
        type: integer
        source: input
        default: null
        description: Optional per-product outstanding cap; null means no product cap.
        constraints: "null or >= 0"

  - name: DocumentCustodian
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> WarehouseFacility.id; the facility that approved this custodian.
      - name: custodian_name
        type: string
        source: input
        description: Legal name of the document custodian.
        constraints: non-empty, max 200 chars
      - name: wet_receipt_deadline_hours
        type: integer
        source: input
        default: 72
        description: Hours after a WET funding within which this custodian must file a CustodianReceipt.
        constraints: ">= 1 and <= 240"
      - name: status
        type: enum
        source: system
        default: APPROVED
        description: Custodian approval posture.
        constraints: "one of {APPROVED, SUSPENDED}"

  - name: TakeoutInvestor
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> WarehouseFacility.id; the facility whose approved-investor list holds this investor.
      - name: investor_name
        type: string
        source: input
        description: Legal name of the take-out investor.
        constraints: non-empty, max 200 chars
      - name: counterparty_rating
        type: enum
        source: input
        description: Internal counterparty grade.
        constraints: "one of {A, B, C}"
      - name: concentration_limit_pct
        type: number
        source: input
        description: Investor-specific concentration cap; the binding cap is min(this, facility.max_investor_concentration_pct).
        constraints: "> 0 and <= 1, four decimal places"
      - name: status
        type: enum
        source: system
        default: PENDING_APPROVAL
        description: Approval-list posture.
        constraints: "one of {PENDING_APPROVAL, APPROVED, SUSPENDED}"
      - name: approved_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of approval; null until approved.
      - name: exposure_cents
        type: integer
        source: computed
        description: Sum of Advance.outstanding_balance_cents over advances whose investor_commitment_id points to an InvestorCommitment of this investor and whose funding_status is in {FUNDED, SHIPPED}.

  - name: InvestorCommitment
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> WarehouseFacility.id; the facility the commitment supports.
      - name: investor_id
        type: string
        source: input
        description: FK -> TakeoutInvestor.id; the committing take-out investor.
      - name: product_code
        type: enum
        source: input
        description: Loan product covered by the commitment.
        constraints: "one of {CONFORMING, JUMBO, FHA_VA, NON_QM, SCRATCH_AND_DENT}"
      - name: committed_amount_cents
        type: integer
        source: input
        description: Face amount the investor has committed to purchase.
        constraints: "> 0"
      - name: price_pct
        type: number
        source: input
        description: >-
          Recorded take-out purchase price as a fraction of loan_amount_cents. Economic
          documentation only: it enters no §1.3 calculation, because advance sizing,
          settled_amount_cents and the INVESTOR_PROCEEDS ledger entry are all denominated
          in the advance's outstanding principal, never in the investor's purchase price.
        constraints: "> 0.5 and <= 1.2, four decimal places"
      - name: effective_on
        type: string
        source: input
        description: First calendar date (YYYY-MM-DD, UTC) the commitment covers; interval is closed on both ends.
        constraints: ISO calendar date
      - name: expires_on
        type: string
        source: input
        description: Last calendar date (YYYY-MM-DD, UTC) the commitment covers; interval is closed on both ends.
        constraints: "ISO calendar date, >= effective_on"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Commitment posture; OPEN when remaining_amount_cents == committed_amount_cents, PARTIALLY_ALLOCATED when 0 < remaining_amount_cents < committed_amount_cents, FULLY_ALLOCATED when remaining_amount_cents == 0.
        constraints: "one of {OPEN, PARTIALLY_ALLOCATED, FULLY_ALLOCATED, WITHDRAWN, EXPIRED}"
      - name: allocated_amount_cents
        type: integer
        source: computed
        default: 0
        description: Sum of Advance.advance_amount_cents over advances pointing at this commitment with funding_status in {FUNDED, SHIPPED}.
      - name: settled_amount_cents
        type: integer
        source: computed
        default: 0
        description: Sum of Advance.advance_amount_cents over advances pointing at this commitment with funding_status = PURCHASED.
      - name: remaining_amount_cents
        type: integer
        source: computed
        description: committed_amount_cents minus allocated_amount_cents minus settled_amount_cents, floored at 0.

  - name: Advance
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> WarehouseFacility.id; the line this advance draws on.
      - name: custodian_id
        type: string
        source: input
        description: FK -> DocumentCustodian.id; the custodian holding the collateral file.
      - name: investor_commitment_id
        type: string
        source: input
        default: null
        description: FK -> InvestorCommitment.id; nullable take-out allocation. Null or a WITHDRAWN/EXPIRED target makes the advance orphaned and caps effective_advance_rate at ORPHAN_RATE.
      - name: product_code
        type: enum
        source: input
        description: Loan product; must have a ProductAdvanceRate on the facility.
        constraints: "one of {CONFORMING, JUMBO, FHA_VA, NON_QM, SCRATCH_AND_DENT}"
      - name: loan_amount_cents
        type: integer
        source: input
        description: Original note amount of the mortgage loan pledged as collateral.
        constraints: "> 0"
      - name: note_rate
        type: number
        source: input
        description: Coupon on the underlying note; used for interest accrual.
        constraints: "> 0 and < 0.5, four decimal places"
      - name: funding_type
        type: enum
        source: input
        description: WET funds before the collateral file is received; DRY requires a clear receipt first.
        constraints: "one of {WET, DRY}"
      - name: payee_name
        type: string
        source: input
        description: Closing-agent payee name recorded on the funding wire.
        constraints: non-empty, max 200 chars
      - name: payee_account_last4
        type: string
        source: input
        description: Last four digits of the payee settlement account presented for the funding wire.
        constraints: exactly 4 digits
      - name: payee_routing_last4
        type: string
        source: input
        description: Last four digits of the payee routing number presented for the funding wire.
        constraints: exactly 4 digits
      - name: funding_status
        type: enum
        source: system
        default: REQUESTED
        description: Funding axis of the parallel state machine.
        constraints: "one of {REQUESTED, FUNDED, SHIPPED, PURCHASED, REPURCHASED, REJECTED}"
      - name: custody_status
        type: enum
        source: system
        default: PENDING_RECEIPT
        description: Document-custody axis of the parallel state machine; evolves independently of funding_status.
        constraints: "one of {PENDING_RECEIPT, RECEIVED_CLEAR, RECEIVED_EXCEPTION, EXCEPTION_CURED, RECEIPT_OVERDUE, RELEASED_TO_INVESTOR}"
      - name: rejected_reason
        type: enum
        source: system
        default: null
        description: Why a REQUESTED advance was rejected; null unless funding_status = REJECTED.
        constraints: "null or one of {WIRE_BLOCKED, FACILITY_SUSPENDED}"
      - name: market_value_cents
        type: integer
        source: computed
        description: Current collateral valuation; initialised to loan_amount_cents at creation and overwritten by POST /advances/{id}/valuation.
      - name: provisional_advance_amount_cents
        type: integer
        source: computed
        description: Stage-3 sizing result (rate applied to loan_amount_cents, floored to whole cents) before facility/sublimit/commitment/concentration caps.
      - name: advance_amount_cents
        type: integer
        source: computed
        default: 0
        description: Final advance amount after all five sizing stages; 0 until funding_status leaves REQUESTED with a successful fund.
      - name: concentration_capped
        type: boolean
        source: computed
        default: false
        description: True when stage 5 of advance_amount_determination reduced the amount below the stage-4 result.
      - name: effective_advance_rate
        type: number
        source: computed
        description: Haircut-adjusted rate produced by eligible_collateral_valuation; four decimal places.
      - name: eligible_collateral_value_cents
        type: integer
        source: computed
        description: floor(min(loan_amount_cents, market_value_cents) * effective_advance_rate).
      - name: required_paydown_cents
        type: integer
        source: computed
        description: max(0, outstanding_balance_cents - eligible_collateral_value_cents).
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: sum(LedgerEntry.amount_cents for this advance where entry_type in PRINCIPAL_TYPES and direction=DEBIT) minus sum(... direction=CREDIT).
      - name: dwell_days
        type: integer
        source: computed
        default: 0
        description: Whole 24-hour periods elapsed from funded_at to the logical clock, floored; 0 while funded_at is null.
      - name: is_aged
        type: boolean
        source: computed
        default: false
        description: True when dwell_days is strictly greater than the applicable ProductAdvanceRate.dwell_limit_days.
      - name: funded_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of funding; null until funded.
      - name: wet_receipt_deadline_at
        type: datetime
        source: system
        default: null
        description: funded_at plus custodian.wet_receipt_deadline_hours; set only for WET fundings.
      - name: shipped_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent shipment to an investor.
      - name: purchased_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the investor purchase settled.

  - name: WireInstruction
    parent: null
    common_fields: true
    fields:
      - name: advance_id
        type: string
        source: input
        description: FK -> Advance.id; the advance this funding wire pays.
      - name: payee_name
        type: string
        source: system
        description: Copied from Advance.payee_name at creation.
      - name: payee_account_last4
        type: string
        source: system
        description: Copied from Advance.payee_account_last4 at creation; must equal facility.settlement_account_last4 to be verifiable.
      - name: payee_routing_last4
        type: string
        source: system
        description: Copied from Advance.payee_routing_last4 at creation.
      - name: amount_cents
        type: integer
        source: computed
        description: Advance.provisional_advance_amount_cents at wire creation.
      - name: callback_reference
        type: string
        source: system
        default: null
        description: Out-of-band callback confirmation reference captured at verification; null until decided.
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the WireOperator who verified or blocked the wire; the funder must differ from this value.
      - name: status
        type: enum
        source: system
        default: PENDING_VERIFICATION
        description: Branching wire posture.
        constraints: "one of {PENDING_VERIFICATION, VERIFIED, RELEASED, BLOCKED}"
      - name: block_reason
        type: enum
        source: system
        default: null
        description: Why the wire was blocked; null unless status = BLOCKED.
        constraints: "null or one of {OPERATOR_BLOCK, FACILITY_SUSPENDED}"

  - name: CustodianReceipt
    parent: null
    common_fields: true
    fields:
      - name: advance_id
        type: string
        source: input
        description: FK -> Advance.id; the advance whose collateral file was received.
      - name: custodian_id
        type: string
        source: input
        description: FK -> DocumentCustodian.id; the custodian filing the receipt.
      - name: document_types
        type: array
        source: input
        description: Document codes received.
        constraints: "non-empty array of {NOTE, MORTGAGE, ASSIGNMENT, TITLE_POLICY}"
      - name: exception_codes
        type: array
        source: input
        default: []
        description: Document exception codes found on intake; empty means a clear receipt.
        constraints: "array of {MISSING_NOTE, UNSIGNED_ASSIGNMENT, STALE_TITLE, NAME_MISMATCH}"
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant the receipt was filed.
      - name: cured_exception_codes
        type: array
        source: system
        default: []
        description: Exception codes cleared by POST /receipts/{id}/cure.
      - name: status
        type: enum
        source: system
        default: CLEAR
        description: CLEAR when exception_codes is empty at filing, EXCEPTION otherwise, CURED once every exception code is cleared.
        constraints: "one of {CLEAR, EXCEPTION, CURED}"

  - name: BaileeLetter
    parent: null
    common_fields: true
    fields:
      - name: advance_id
        type: string
        source: input
        description: FK -> Advance.id; the shipped advance the letter covers.
      - name: investor_id
        type: string
        source: input
        description: FK -> TakeoutInvestor.id; the investor the collateral was shipped to.
      - name: effective_from
        type: datetime
        source: system
        description: Logical-clock instant of issuance; start of the half-open bailee window.
      - name: expires_at
        type: datetime
        source: system
        description: effective_from plus facility.bailee_period_days; exclusive end of the half-open bailee window.
      - name: bailee_period_days
        type: integer
        source: system
        description: Snapshot of facility.bailee_period_days at issuance.
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: Bailee-letter posture.
        constraints: "one of {ISSUED, HONORED, EXPIRED, REVOKED}"

  - name: MarginCall
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> WarehouseFacility.id; the facility the call is issued against.
      - name: advance_id
        type: string
        source: input
        default: null
        description: FK -> Advance.id; null for facility-level calls (COVENANT_BREACH).
      - name: trigger_reason
        type: enum
        source: input
        description: Why the call was issued.
        constraints: "one of {VALUATION_DECLINE, COMMITMENT_WITHDRAWN, DWELL_EXCEEDED, CUSTODY_EXCEPTION, COVENANT_BREACH}"
      - name: call_amount_cents
        type: integer
        source: computed
        description: Obligation snapshot produced by margin_call_amount at issuance.
      - name: cured_amount_cents
        type: integer
        source: computed
        default: 0
        description: Sum of CurePayment.applied_to_principal_cents over cure payments against this call.
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance.
      - name: cure_deadline_at
        type: datetime
        source: system
        description: issued_at plus cure_days days; an aging-run at or after this instant defaults an uncured call.
      - name: issued_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the CreditOfficer who issued the call manually; null for system-issued calls. The waiving officer must differ from this value.
      - name: waived_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the CreditOfficer who waived the call; null unless status = WAIVED.
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: Margin-call posture.
        constraints: "one of {ISSUED, PARTIALLY_CURED, CURED, WAIVED, DEFAULTED}"

  - name: CurePayment
    parent: null
    common_fields: false
    fields:
      - name: margin_call_id
        type: string
        source: input
        description: FK -> MarginCall.id; the call this payment cures.
      - name: amount_cents
        type: integer
        source: input
        description: Cash applied by the borrower.
        constraints: "> 0"
      - name: applied_to_fees_cents
        type: integer
        source: computed
        description: Bucket 1 of cure_payment_waterfall.
      - name: applied_to_principal_cents
        type: integer
        source: computed
        description: Bucket 2 of cure_payment_waterfall.
      - name: principal_allocation
        type: array
        source: computed
        description: Ordered array of { advance_id, amount_cents } objects recording the per-advance pro-rata split of applied_to_principal_cents, in created_at ASC order of the covered advances.
      - name: applied_at
        type: datetime
        source: system
        description: Logical-clock instant the payment was applied.

  - name: CovenantTest
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> WarehouseFacility.id; the facility certified.
      - name: period_end
        type: string
        source: input
        description: Fiscal period end (YYYY-MM-DD, UTC); must be strictly greater than every existing CovenantTest.period_end on the facility.
        constraints: ISO calendar date
      - name: tangible_net_worth_cents
        type: integer
        source: input
        description: Certified tangible net worth for the period.
      - name: liquidity_cents
        type: integer
        source: input
        description: Certified unrestricted liquidity for the period.
      - name: net_income_cents
        type: integer
        source: input
        description: Certified net income for the period.
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the Borrower who submitted the certificate.
      - name: profitability_variant
        type: enum
        source: computed
        description: Variant of covenant_evaluation selected for this test.
        constraints: "one of {TTM_ROLLING, ANNUALIZED_QUARTER}"
      - name: profitability_metric_cents
        type: integer
        source: computed
        description: Profitability figure produced by the selected variant.
      - name: breach_codes
        type: array
        source: computed
        description: Sorted array of breached covenants.
        constraints: "array of {NET_WORTH, LIQUIDITY, PROFITABILITY}"
      - name: status
        type: enum
        source: computed
        description: PASS when breach_codes is empty, BREACH otherwise, WAIVED once waived.
        constraints: "one of {PASS, BREACH, WAIVED}"
      - name: waived_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the CreditOfficer who waived the breach; null unless status = WAIVED.

  - name: RepurchaseDemand
    parent: null
    common_fields: true
    fields:
      - name: advance_id
        type: string
        source: input
        description: FK -> Advance.id; the advance whose collateral must be repurchased.
      - name: reason
        type: enum
        source: input
        description: Ineligibility ground for the demand.
        constraints: "one of {DWELL_EXCEEDED, CUSTODY_EXCEPTION_UNCURED, BAILEE_EXPIRED, INVESTOR_SUSPENDED, INELIGIBLE_PRODUCT}"
      - name: demand_amount_cents
        type: integer
        source: computed
        description: Advance.outstanding_balance_cents at the instant the demand was raised.
      - name: raised_at
        type: datetime
        source: system
        description: Logical-clock instant the demand was raised.
      - name: deadline_at
        type: datetime
        source: system
        description: raised_at plus cure_days days.
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Demand posture.
        constraints: "one of {OPEN, SATISFIED, ESCALATED}"

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> WarehouseFacility.id; the facility whose balances this entry moves.
      - name: advance_id
        type: string
        source: input
        default: null
        description: FK -> Advance.id; null for facility-level entries (FEE_ACCRUAL, FEE_PAYMENT).
      - name: entry_type
        type: enum
        source: system
        description: PRINCIPAL_TYPES = {ADVANCE_FUNDED, CURE_PRINCIPAL, INVESTOR_PROCEEDS, REPURCHASE}; FEE_ACCRUAL and FEE_PAYMENT move accrued_fee_balance_cents only; MARGIN_CALL_WAIVED is informational and moves neither balance.
        constraints: "one of {ADVANCE_FUNDED, CURE_PRINCIPAL, INVESTOR_PROCEEDS, REPURCHASE, FEE_ACCRUAL, FEE_PAYMENT, MARGIN_CALL_WAIVED}"
      - name: direction
        type: enum
        source: system
        description: DEBIT increases the balance the entry_type governs; CREDIT decreases it.
        constraints: "one of {DEBIT, CREDIT}"
      - name: amount_cents
        type: integer
        source: system
        description: Absolute magnitude of the entry in cents.
        constraints: ">= 0"
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant the entry was posted.
      - name: memo
        type: string
        source: system
        description: Human-readable provenance, e.g. "fund advance", "cure payment principal", "investor proceeds".

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # CYCLIC: ACTIVE -> RESTRICTED -> ACTIVE, plus SUSPENDED with manual reinstate.
  # ---------------------------------------------------------------------------
  - entity: WarehouseFacility
    dimension: status
    initial_state: PENDING_APPROVAL
    terminal_states: []
    transitions:
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /facilities/{id}/approve"
        actor: CreditOfficer
        preconditions:
          - "facility.status == PENDING_APPROVAL"
          - "count(ProductAdvanceRate where facility_id == facility.id) >= 1"
          - "X-User-ID != facility.created_by_user_id (four-eyes approval, §1.4 priority 46 — ranked last, so the cardinality check above short-circuits first)"
        side_effects:
          - "sets approved_by_user_id = X-User-ID and approved_at = logical clock"
          - "sets last_accrual_at = logical clock (baseline for facility_fee_accrual)"
          - "increments WarehouseFacility.version by 1"
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system: any MarginCall reaches status ISSUED, or a CovenantTest is stored with status BREACH, or a RepurchaseDemand reaches status ESCALATED"
        actor: system
        preconditions:
          - "facility.status == ACTIVE"
        side_effects:
          - "POST /advances is rejected with ERR_FACILITY_NOT_ACTIVE while RESTRICTED"
          - "POST /advances/{id}/fund is rejected with ERR_FACILITY_NOT_ACTIVE while RESTRICTED"
          - "increments WarehouseFacility.version by 1"
        note: "Cures, repurchases, receipts, valuations, shipments and purchases remain permitted while RESTRICTED."
      - from: RESTRICTED
        to: ACTIVE
        trigger: "system: re-evaluated after every MarginCall status change, CovenantTest waive, RepurchaseDemand satisfaction and Advance repurchase"
        actor: system
        preconditions:
          - "facility.open_margin_call_count == 0"
          - "facility.last_covenant_status in {NOT_TESTED, PASS, WAIVED}"
          - "facility.escalated_demand_count == 0"
        side_effects:
          - "increments WarehouseFacility.version by 1"
        note: "Closes the ACTIVE -> RESTRICTED -> ACTIVE cycle; the same facility row may traverse it repeatedly."
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system: a CovenantTest is stored with status BREACH bringing consecutive_breach_count to 2, or a MarginCall reaches status DEFAULTED"
        actor: system
        preconditions:
          - "facility.status == RESTRICTED"
          - "facility.consecutive_breach_count >= 2 OR at least one MarginCall of this facility has status DEFAULTED"
        side_effects:
          - "every Advance of the facility with funding_status == REQUESTED transitions to REJECTED with rejected_reason = FACILITY_SUSPENDED"
          - "each such Advance's WireInstruction with status PENDING_VERIFICATION transitions to BLOCKED with block_reason = FACILITY_SUSPENDED"
          - "increments WarehouseFacility.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /facilities/{id}/suspend"
        actor: CreditOfficer
        preconditions:
          - "facility.status in {ACTIVE, RESTRICTED}"
        side_effects:
          - "every Advance of the facility with funding_status == REQUESTED transitions to REJECTED with rejected_reason = FACILITY_SUSPENDED"
          - "each such Advance's WireInstruction with status PENDING_VERIFICATION transitions to BLOCKED with block_reason = FACILITY_SUSPENDED"
          - "increments WarehouseFacility.version by 1"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "POST /facilities/{id}/suspend"
        actor: CreditOfficer
        preconditions:
          - "facility.status in {ACTIVE, RESTRICTED}"
        side_effects:
          - "every Advance of the facility with funding_status == REQUESTED transitions to REJECTED with rejected_reason = FACILITY_SUSPENDED"
          - "each such Advance's WireInstruction with status PENDING_VERIFICATION transitions to BLOCKED with block_reason = FACILITY_SUSPENDED"
          - "increments WarehouseFacility.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /facilities/{id}/reinstate"
        actor: CreditOfficer
        preconditions:
          - "facility.status == SUSPENDED"
          - "facility.open_margin_call_count == 0"
          - "no MarginCall of this facility has status DEFAULTED"
          - "facility.last_covenant_status in {NOT_TESTED, PASS, WAIVED}"
          - "facility.escalated_demand_count == 0"
        side_effects:
          - "increments WarehouseFacility.version by 1"

  # ---------------------------------------------------------------------------
  # PARALLEL AXIS 1 of 2 on Advance: funding_status.
  # ---------------------------------------------------------------------------
  - entity: Advance
    dimension: funding_status
    initial_state: REQUESTED
    terminal_states: [PURCHASED, REPURCHASED, REJECTED]
    transitions:
      - from: REQUESTED
        to: FUNDED
        trigger: "POST /advances/{id}/fund"
        actor: CollateralAnalyst
        preconditions:
          - "advance.funding_status == REQUESTED"
          - "facility.status == ACTIVE"
          - "the advance's WireInstruction.status == VERIFIED"
          - "X-User-ID != WireInstruction.decided_by_user_id (dual control)"
          - "custodian.status == APPROVED"
          - "advance.funding_type == DRY implies advance.custody_status in {RECEIVED_CLEAR, EXCEPTION_CURED}"
          - "advance.custody_status != RECEIVED_EXCEPTION"
          - "investor_commitment_id is null OR the commitment status is in {OPEN, PARTIALLY_ALLOCATED} and product_code matches and the logical clock date is within [effective_on, expires_on]"
          - "advance_amount_determination's stage-4 result (after every hard cap, before the stage-5 concentration solve) is >= MIN_ADVANCE_CENTS — skipped when any stage-4 cap is <= 0, which the specific sublimit rule below reports instead (§1.4 priority 35)"
          - "the stage-5 concentration solve yields advance_amount_cents >= MIN_ADVANCE_CENTS (§1.4 priority 36)"
          - "the availability and sublimit gates in §1.4 priorities 38-43 all pass"
        side_effects:
          - "runs calculations.advance_amount_determination and stores provisional_advance_amount_cents, advance_amount_cents, concentration_capped"
          - "sets funded_at = logical clock; for WET sets wet_receipt_deadline_at = funded_at + custodian.wet_receipt_deadline_hours"
          - "appends LedgerEntry { entry_type: ADVANCE_FUNDED, direction: DEBIT, amount_cents: advance_amount_cents, advance_id: this advance }"
          - "recomputes facility.outstanding_principal_cents, availability_cents, wet_outstanding_cents, aged_outstanding_cents, scratch_and_dent_outstanding_cents"
          - "recomputes InvestorCommitment.allocated_amount_cents / remaining_amount_cents / status and TakeoutInvestor.exposure_cents"
          - "transitions the WireInstruction from VERIFIED to RELEASED"
          - "runs calculations.eligible_collateral_valuation and stores effective_advance_rate, eligible_collateral_value_cents, required_paydown_cents"
          - "increments Advance.version and WarehouseFacility.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "system: the advance's WireInstruction transitions to BLOCKED, or the facility transitions to SUSPENDED"
        actor: system
        preconditions:
          - "advance.funding_status == REQUESTED"
        side_effects:
          - "sets rejected_reason = WIRE_BLOCKED when the wire was blocked, FACILITY_SUSPENDED when the facility was suspended"
          - "no LedgerEntry is written; facility.outstanding_principal_cents is unchanged"
          - "increments Advance.version by 1"
      - from: FUNDED
        to: SHIPPED
        trigger: "POST /advances/{id}/ship"
        actor: CollateralAnalyst
        preconditions:
          - "advance.funding_status == FUNDED"
          - "advance.custody_status in {RECEIVED_CLEAR, EXCEPTION_CURED}"
          - "investor.status == APPROVED"
          - "advance.investor_commitment_id is not null and that commitment's investor_id == the investor_id in the request"
          - "no MarginCall with advance_id == this advance has status in {ISSUED, PARTIALLY_CURED}"
          - "no BaileeLetter for this advance has status ISSUED with effective_from <= clock < expires_at"
        side_effects:
          - "sets shipped_at = logical clock and custody_status = RELEASED_TO_INVESTOR"
          - "creates BaileeLetter { status: ISSUED, effective_from: clock, expires_at: clock + facility.bailee_period_days days, bailee_period_days: snapshot }"
          - "increments Advance.version by 1"
      - from: SHIPPED
        to: SHIPPED
        trigger: "POST /advances/{id}/ship (re-ship after the prior bailee window closed)"
        actor: CollateralAnalyst
        preconditions:
          - "advance.funding_status == SHIPPED"
          - "every BaileeLetter for this advance has status in {EXPIRED, REVOKED}"
          - "investor.status == APPROVED"
          - "no MarginCall with advance_id == this advance has status in {ISSUED, PARTIALLY_CURED}"
        side_effects:
          - "sets shipped_at = logical clock"
          - "creates a new BaileeLetter whose effective_from may equal the prior letter's expires_at exactly (half-open window, zero-gap adjacency permitted)"
          - "increments Advance.version by 1"
        note: "Self-loop: the only cyclic transition on the funding axis."
      - from: SHIPPED
        to: PURCHASED
        trigger: "POST /advances/{id}/purchase"
        actor: Investor
        preconditions:
          - "advance.funding_status == SHIPPED"
          - "a BaileeLetter for this advance has status ISSUED and effective_from <= clock < expires_at, and its investor_id == X-User-ID"
          - "advance.outstanding_balance_cents > 0"
        side_effects:
          - "sets purchased_at = logical clock and transitions that BaileeLetter to HONORED"
          - "appends LedgerEntry { entry_type: INVESTOR_PROCEEDS, direction: CREDIT, amount_cents: advance.outstanding_balance_cents, advance_id: this advance } — the take-out settles at par outstanding, so the advance's outstanding_balance_cents becomes exactly 0"
          - "recomputes facility.outstanding_principal_cents and availability_cents"
          - "recomputes InvestorCommitment.allocated_amount_cents / settled_amount_cents / remaining_amount_cents / status and TakeoutInvestor.exposure_cents"
          - "every MarginCall with advance_id == this advance and status in {ISSUED, PARTIALLY_CURED} transitions to CURED, which re-evaluates the facility RESTRICTED -> ACTIVE transition"
          - "increments Advance.version by 1"
      - from: FUNDED
        to: REPURCHASED
        trigger: "POST /advances/{id}/repurchase"
        actor: Borrower
        preconditions:
          - "advance.funding_status in {FUNDED, SHIPPED}"
          - "payment_amount_cents == advance.outstanding_balance_cents"
        side_effects:
          - "appends LedgerEntry { entry_type: REPURCHASE, direction: CREDIT, amount_cents: payment_amount_cents, advance_id: this advance }"
          - "recomputes facility.outstanding_principal_cents, availability_cents and every sublimit rollup"
          - "recomputes InvestorCommitment allocation fields and TakeoutInvestor.exposure_cents"
          - "every RepurchaseDemand for this advance with status OPEN transitions to SATISFIED"
          - "every MarginCall with advance_id == this advance and status in {ISSUED, PARTIALLY_CURED} transitions to CURED"
          - "that MarginCall closure re-evaluates the facility RESTRICTED -> ACTIVE transition"
          - "increments Advance.version and WarehouseFacility.version by 1"
      - from: SHIPPED
        to: REPURCHASED
        trigger: "POST /advances/{id}/repurchase"
        actor: Borrower
        preconditions:
          - "advance.funding_status in {FUNDED, SHIPPED}"
          - "payment_amount_cents == advance.outstanding_balance_cents"
        side_effects:
          - "every BaileeLetter for this advance with status ISSUED transitions to REVOKED"
          - "appends LedgerEntry { entry_type: REPURCHASE, direction: CREDIT, amount_cents: payment_amount_cents, advance_id: this advance }"
          - "recomputes facility.outstanding_principal_cents, availability_cents and every sublimit rollup"
          - "every RepurchaseDemand for this advance with status OPEN transitions to SATISFIED"
          - "every MarginCall with advance_id == this advance and status in {ISSUED, PARTIALLY_CURED} transitions to CURED, which re-evaluates the facility RESTRICTED -> ACTIVE transition"
          - "increments Advance.version and WarehouseFacility.version by 1"

  # ---------------------------------------------------------------------------
  # PARALLEL AXIS 2 of 2 on Advance: custody_status. Evolves independently of
  # funding_status — a receipt may arrive while funding_status is REQUESTED
  # (dry funding) or FUNDED (wet funding).
  # ---------------------------------------------------------------------------
  - entity: Advance
    dimension: custody_status
    initial_state: PENDING_RECEIPT
    terminal_states: [RELEASED_TO_INVESTOR]
    transitions:
      - from: PENDING_RECEIPT
        to: RECEIVED_CLEAR
        trigger: "POST /advances/{id}/receipts with an empty exception_codes array"
        actor: Custodian
        preconditions:
          - "advance.custody_status in {PENDING_RECEIPT, RECEIPT_OVERDUE}"
          - "advance.funding_status in {REQUESTED, FUNDED}"
          - "custodian.status == APPROVED and X-User-ID == advance.custodian_id"
          - "no CustodianReceipt already exists for this advance with status in {CLEAR, CURED}"
        side_effects:
          - "creates CustodianReceipt with status CLEAR"
          - "recomputes effective_advance_rate (the wet haircut falls away) and eligible_collateral_value_cents, required_paydown_cents"
          - "any MarginCall with advance_id == this advance, trigger_reason == CUSTODY_EXCEPTION and status in {ISSUED, PARTIALLY_CURED} transitions to CURED, which re-evaluates the facility RESTRICTED -> ACTIVE transition"
          - "increments Advance.version by 1"
      - from: PENDING_RECEIPT
        to: RECEIVED_EXCEPTION
        trigger: "POST /advances/{id}/receipts with a non-empty exception_codes array"
        actor: Custodian
        preconditions:
          - "advance.custody_status in {PENDING_RECEIPT, RECEIPT_OVERDUE}"
          - "advance.funding_status in {REQUESTED, FUNDED}"
          - "custodian.status == APPROVED and X-User-ID == advance.custodian_id"
        side_effects:
          - "creates CustodianReceipt with status EXCEPTION"
          - "recomputes effective_advance_rate applying EXCEPTION_HAIRCUT, then eligible_collateral_value_cents and required_paydown_cents"
          - "when advance.funding_status == FUNDED and required_paydown_cents > 0, creates MarginCall { trigger_reason: CUSTODY_EXCEPTION, advance_id: this advance, call_amount_cents: required_paydown_cents }"
          - "that MarginCall creation cascades the facility ACTIVE -> RESTRICTED"
          - "increments Advance.version by 1"
      - from: RECEIPT_OVERDUE
        to: RECEIVED_CLEAR
        trigger: "POST /advances/{id}/receipts with an empty exception_codes array after the wet deadline"
        actor: Custodian
        preconditions:
          - "advance.custody_status == RECEIPT_OVERDUE"
        side_effects:
          - "same side effects as PENDING_RECEIPT -> RECEIVED_CLEAR"
          - "increments Advance.version by 1"
      - from: PENDING_RECEIPT
        to: RECEIPT_OVERDUE
        trigger: "POST /facilities/{id}/aging-run"
        actor: system
        preconditions:
          - "advance.funding_type == WET and advance.funding_status == FUNDED"
          - "advance.custody_status == PENDING_RECEIPT"
          - "logical clock >= advance.wet_receipt_deadline_at"
        side_effects:
          - "creates MarginCall { trigger_reason: CUSTODY_EXCEPTION, advance_id: this advance, call_amount_cents: required_paydown_cents } when required_paydown_cents > 0"
          - "cascades the facility ACTIVE -> RESTRICTED when a call was created"
          - "increments Advance.version by 1"
      - from: RECEIVED_EXCEPTION
        to: EXCEPTION_CURED
        trigger: "POST /receipts/{id}/cure"
        actor: Custodian
        preconditions:
          - "receipt.status == EXCEPTION"
          - "the union of cured_exception_codes and the request's cured_exception_codes covers every code in receipt.exception_codes"
          - "X-User-ID == receipt.custodian_id"
        side_effects:
          - "sets receipt.status = CURED and stores cured_exception_codes"
          - "recomputes effective_advance_rate without EXCEPTION_HAIRCUT, then eligible_collateral_value_cents and required_paydown_cents"
          - "any MarginCall with advance_id == this advance, trigger_reason == CUSTODY_EXCEPTION and status in {ISSUED, PARTIALLY_CURED} transitions to CURED"
          - "that closure re-evaluates the facility RESTRICTED -> ACTIVE transition"
          - "increments Advance.version by 1"
      - from: RECEIVED_CLEAR
        to: RELEASED_TO_INVESTOR
        trigger: "POST /advances/{id}/ship"
        actor: CollateralAnalyst
        preconditions:
          - "advance.custody_status in {RECEIVED_CLEAR, EXCEPTION_CURED}"
        side_effects:
          - "the collateral file is released to the investor under the new BaileeLetter"
          - "increments Advance.version by 1"
      - from: EXCEPTION_CURED
        to: RELEASED_TO_INVESTOR
        trigger: "POST /advances/{id}/ship"
        actor: CollateralAnalyst
        preconditions:
          - "advance.custody_status in {RECEIVED_CLEAR, EXCEPTION_CURED}"
        side_effects:
          - "the collateral file is released to the investor under the new BaileeLetter"
          - "increments Advance.version by 1"

  # ---------------------------------------------------------------------------
  # BRANCHING fork with divergent side-effect sets per branch.
  # ---------------------------------------------------------------------------
  - entity: WireInstruction
    dimension: status
    initial_state: PENDING_VERIFICATION
    terminal_states: [RELEASED, BLOCKED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /wire-instructions/{id}/decision with decision = VERIFY"
        actor: WireOperator
        preconditions:
          - "wire.status == PENDING_VERIFICATION"
          - "callback_reference is present and non-empty"
          - "wire.payee_account_last4 == facility.settlement_account_last4"
        side_effects:
          - "stores callback_reference and decided_by_user_id = X-User-ID"
          - "the advance stays REQUESTED; no LedgerEntry is written"
          - "increments WireInstruction.version by 1"
      - from: PENDING_VERIFICATION
        to: BLOCKED
        trigger: "POST /wire-instructions/{id}/decision with decision = BLOCK"
        actor: WireOperator
        preconditions:
          - "wire.status == PENDING_VERIFICATION"
          - "block_reason == OPERATOR_BLOCK"
        side_effects:
          - "stores block_reason = OPERATOR_BLOCK and decided_by_user_id = X-User-ID"
          - "the advance transitions REQUESTED -> REJECTED with rejected_reason = WIRE_BLOCKED"
          - "increments WireInstruction.version and Advance.version by 1"
        note: "Divergent branch: VERIFY leaves the advance fundable, BLOCK terminates it."
      - from: PENDING_VERIFICATION
        to: BLOCKED
        trigger: "system: the facility transitions to SUSPENDED"
        actor: system
        preconditions:
          - "wire.status == PENDING_VERIFICATION"
        side_effects:
          - "stores block_reason = FACILITY_SUSPENDED; decided_by_user_id stays null"
          - "increments WireInstruction.version by 1"
      - from: VERIFIED
        to: RELEASED
        trigger: "POST /advances/{id}/fund"
        actor: CollateralAnalyst
        preconditions:
          - "wire.status == VERIFIED"
          - "X-User-ID != wire.decided_by_user_id"
        side_effects:
          - "increments WireInstruction.version by 1"

  - entity: TakeoutInvestor
    dimension: status
    initial_state: PENDING_APPROVAL
    terminal_states: []
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /investors/{id}/approve"
        actor: CreditOfficer
        preconditions:
          - "investor.status == PENDING_APPROVAL"
          - "facility.status in {PENDING_APPROVAL, ACTIVE, RESTRICTED}"
        side_effects:
          - "sets approved_at = logical clock"
          - "increments TakeoutInvestor.version by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /investors/{id}/suspend"
        actor: CreditOfficer
        preconditions:
          - "investor.status == APPROVED"
        side_effects:
          - "hop 1: every InvestorCommitment of this investor with status in {OPEN, PARTIALLY_ALLOCATED, FULLY_ALLOCATED} transitions to WITHDRAWN"
          - "hop 2: because those commitments are now WITHDRAWN, every Advance pointing at them with funding_status in {FUNDED, SHIPPED} is re-valued at ORPHAN_RATE, lowering eligible_collateral_value_cents and raising required_paydown_cents"
          - "hop 3: because required_paydown_cents became positive, a MarginCall { trigger_reason: COMMITMENT_WITHDRAWN, advance_id: that advance, call_amount_cents: required_paydown_cents } is created for each such advance"
          - "hop 4: because an open MarginCall now exists, the facility transitions ACTIVE -> RESTRICTED"
          - "increments TakeoutInvestor.version by 1"

  - entity: DocumentCustodian
    dimension: status
    initial_state: APPROVED
    terminal_states: []
    transitions:
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /custodians/{id}/suspend"
        actor: CreditOfficer
        preconditions:
          - "custodian.status == APPROVED"
        side_effects:
          - "POST /advances/{id}/fund for advances naming this custodian is rejected with ERR_CUSTODIAN_NOT_ACTIVE"
          - "POST /advances/{id}/receipts filed by this custodian is rejected with ERR_CUSTODIAN_NOT_ACTIVE"
          - "increments DocumentCustodian.version by 1"

  - entity: InvestorCommitment
    dimension: status
    initial_state: OPEN
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: OPEN
        to: PARTIALLY_ALLOCATED
        trigger: "system: POST /advances/{id}/fund allocates against this commitment"
        actor: system
        preconditions:
          - "0 < remaining_amount_cents < committed_amount_cents after the allocation"
        side_effects:
          - "increments InvestorCommitment.version by 1"
      - from: PARTIALLY_ALLOCATED
        to: FULLY_ALLOCATED
        trigger: "system: POST /advances/{id}/fund exhausts the commitment"
        actor: system
        preconditions:
          - "remaining_amount_cents == 0 after the allocation"
        side_effects:
          - "increments InvestorCommitment.version by 1"
      - from: PARTIALLY_ALLOCATED
        to: PARTIALLY_ALLOCATED
        trigger: "system: POST /advances/{id}/purchase moves an allocation from allocated_amount_cents to settled_amount_cents"
        actor: system
        preconditions:
          - "0 < remaining_amount_cents < committed_amount_cents after the settlement"
        side_effects:
          - "allocated_amount_cents decreases and settled_amount_cents increases by the same amount, leaving remaining_amount_cents unchanged"
          - "increments InvestorCommitment.version by 1"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /commitments/{id}/withdraw, or system on POST /investors/{id}/suspend"
        actor: Investor
        preconditions:
          - "commitment.status in {OPEN, PARTIALLY_ALLOCATED, FULLY_ALLOCATED}"
        side_effects:
          - "every Advance pointing at this commitment with funding_status in {FUNDED, SHIPPED} is re-valued at ORPHAN_RATE"
          - "each such advance with required_paydown_cents > 0 gets a MarginCall { trigger_reason: COMMITMENT_WITHDRAWN }"
          - "the first such MarginCall cascades the facility ACTIVE -> RESTRICTED"
          - "increments InvestorCommitment.version by 1"
      - from: PARTIALLY_ALLOCATED
        to: WITHDRAWN
        trigger: "POST /commitments/{id}/withdraw, or system on POST /investors/{id}/suspend"
        actor: Investor
        preconditions:
          - "commitment.status in {OPEN, PARTIALLY_ALLOCATED, FULLY_ALLOCATED}"
        side_effects:
          - "every Advance pointing at this commitment with funding_status in {FUNDED, SHIPPED} is re-valued at ORPHAN_RATE"
          - "each such advance with required_paydown_cents > 0 gets a MarginCall { trigger_reason: COMMITMENT_WITHDRAWN }"
          - "the first such MarginCall cascades the facility ACTIVE -> RESTRICTED"
          - "increments InvestorCommitment.version by 1"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /facilities/{id}/aging-run"
        actor: system
        preconditions:
          - "commitment.status in {OPEN, PARTIALLY_ALLOCATED}"
          - "the logical clock's UTC calendar date is strictly greater than expires_on"
        side_effects:
          - "advances pointing at this commitment are re-valued at ORPHAN_RATE and receive a MarginCall { trigger_reason: COMMITMENT_WITHDRAWN } when required_paydown_cents > 0"
          - "increments InvestorCommitment.version by 1"

  - entity: CustodianReceipt
    dimension: status
    initial_state: CLEAR
    terminal_states: [CURED]
    transitions:
      - from: EXCEPTION
        to: CURED
        trigger: "POST /receipts/{id}/cure"
        actor: Custodian
        preconditions:
          - "receipt.status == EXCEPTION"
          - "every code in receipt.exception_codes is covered by cured_exception_codes after the request"
        side_effects:
          - "drives Advance custody_status RECEIVED_EXCEPTION -> EXCEPTION_CURED and its cascade"
          - "increments CustodianReceipt.version by 1"
        note: "A receipt filed with a non-empty exception_codes array is created directly in state EXCEPTION rather than CLEAR."

  - entity: BaileeLetter
    dimension: status
    initial_state: ISSUED
    terminal_states: [HONORED, EXPIRED, REVOKED]
    transitions:
      - from: ISSUED
        to: HONORED
        trigger: "POST /advances/{id}/purchase"
        actor: Investor
        preconditions:
          - "letter.status == ISSUED and letter.effective_from <= clock < letter.expires_at"
          - "letter.investor_id == X-User-ID"
        side_effects:
          - "increments BaileeLetter.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /facilities/{id}/aging-run"
        actor: system
        preconditions:
          - "letter.status == ISSUED"
          - "logical clock >= letter.expires_at"
        side_effects:
          - "creates RepurchaseDemand { advance_id: letter.advance_id, reason: BAILEE_EXPIRED, deadline_at: clock + AGING_RUN_DEMAND_DAYS days } when the advance funding_status == SHIPPED"
          - "that demand leaves the facility posture unchanged until it is escalated"
          - "increments BaileeLetter.version by 1"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /advances/{id}/repurchase"
        actor: Borrower
        preconditions:
          - "letter.status == ISSUED"
        side_effects:
          - "increments BaileeLetter.version by 1"

  - entity: MarginCall
    dimension: status
    initial_state: ISSUED
    terminal_states: [CURED, WAIVED, DEFAULTED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_CURED
        trigger: "POST /margin-calls/{id}/cure-payments"
        actor: Borrower
        preconditions:
          - "call.status in {ISSUED, PARTIALLY_CURED}"
          - "expected_margin_call_version matches MarginCall.version"
          - "amount_cents <= facility.accrued_fee_balance_cents + max(0, call_amount_cents - cured_amount_cents)"
        side_effects:
          - "runs calculations.cure_payment_waterfall, creating the CurePayment and its LedgerEntry rows"
          - "cured_amount_cents increases by applied_to_principal_cents; status becomes PARTIALLY_CURED while cured_amount_cents < call_amount_cents"
          - "increments MarginCall.version and WarehouseFacility.version by 1"
      - from: PARTIALLY_CURED
        to: CURED
        trigger: "POST /margin-calls/{id}/cure-payments"
        actor: Borrower
        preconditions:
          - "call.status in {ISSUED, PARTIALLY_CURED}"
          - "cured_amount_cents >= call_amount_cents after this payment"
        side_effects:
          - "re-evaluates the facility RESTRICTED -> ACTIVE transition"
          - "increments MarginCall.version and WarehouseFacility.version by 1"
      - from: ISSUED
        to: CURED
        trigger: "POST /margin-calls/{id}/cure-payments fully covering the obligation, or system on receipt cure / advance repurchase"
        actor: Borrower
        preconditions:
          - "call.status in {ISSUED, PARTIALLY_CURED}"
        side_effects:
          - "re-evaluates the facility RESTRICTED -> ACTIVE transition"
          - "increments MarginCall.version by 1"
      - from: ISSUED
        to: WAIVED
        trigger: "POST /margin-calls/{id}/waive"
        actor: CreditOfficer
        preconditions:
          - "call.status in {ISSUED, PARTIALLY_CURED}"
          - "call.issued_by_user_id is null OR X-User-ID != call.issued_by_user_id"
        side_effects:
          - "sets waived_by_user_id = X-User-ID"
          - "appends LedgerEntry { entry_type: MARGIN_CALL_WAIVED, direction: CREDIT, amount_cents: max(0, call_amount_cents - cured_amount_cents) } which moves neither outstanding_principal_cents nor accrued_fee_balance_cents"
          - "re-evaluates the facility RESTRICTED -> ACTIVE transition"
          - "increments MarginCall.version by 1"
      - from: PARTIALLY_CURED
        to: WAIVED
        trigger: "POST /margin-calls/{id}/waive"
        actor: CreditOfficer
        preconditions:
          - "call.status in {ISSUED, PARTIALLY_CURED}"
          - "call.issued_by_user_id is null OR X-User-ID != call.issued_by_user_id"
        side_effects:
          - "same side effects as ISSUED -> WAIVED"
          - "increments MarginCall.version by 1"
      - from: ISSUED
        to: DEFAULTED
        trigger: "POST /facilities/{id}/aging-run"
        actor: system
        preconditions:
          - "call.status in {ISSUED, PARTIALLY_CURED}"
          - "logical clock >= call.cure_deadline_at"
        side_effects:
          - "the facility transitions RESTRICTED -> SUSPENDED"
          - "that suspension rejects every REQUESTED advance of the facility and blocks their PENDING_VERIFICATION wires"
          - "increments MarginCall.version by 1"
      - from: PARTIALLY_CURED
        to: DEFAULTED
        trigger: "POST /facilities/{id}/aging-run"
        actor: system
        preconditions:
          - "call.status in {ISSUED, PARTIALLY_CURED}"
          - "logical clock >= call.cure_deadline_at"
        side_effects:
          - "the facility transitions RESTRICTED -> SUSPENDED"
          - "increments MarginCall.version by 1"

  - entity: CovenantTest
    dimension: status
    initial_state: PASS
    terminal_states: [WAIVED]
    transitions:
      - from: BREACH
        to: WAIVED
        trigger: "POST /covenant-tests/{id}/waive"
        actor: CreditOfficer
        preconditions:
          - "test.status == BREACH"
          - "test.period_end is the greatest period_end on the facility"
        side_effects:
          - "sets waived_by_user_id = X-User-ID and facility.last_covenant_status = WAIVED"
          - "facility.consecutive_breach_count resets to 0"
          - "every MarginCall of the facility with trigger_reason == COVENANT_BREACH and status in {ISSUED, PARTIALLY_CURED} transitions to WAIVED"
          - "that closure re-evaluates the facility RESTRICTED -> ACTIVE transition"
          - "increments CovenantTest.version and WarehouseFacility.version by 1"
        note: "A CovenantTest is created directly in PASS or BREACH by covenant_evaluation; only BREACH is waivable."

  - entity: RepurchaseDemand
    dimension: status
    initial_state: OPEN
    terminal_states: [SATISFIED]
    transitions:
      - from: OPEN
        to: SATISFIED
        trigger: "system: POST /advances/{id}/repurchase"
        actor: system
        preconditions:
          - "demand.status == OPEN"
        side_effects:
          - "increments RepurchaseDemand.version by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /repurchase-demands/{id}/escalate"
        actor: CreditOfficer
        preconditions:
          - "demand.status == OPEN"
          - "logical clock >= demand.deadline_at"
        side_effects:
          - "facility.escalated_demand_count increases, cascading the facility ACTIVE -> RESTRICTED"
          - "increments RepurchaseDemand.version and WarehouseFacility.version by 1"
      - from: ESCALATED
        to: SATISFIED
        trigger: "system: POST /advances/{id}/repurchase"
        actor: system
        preconditions:
          - "demand.status in {OPEN, ESCALATED}"
        side_effects:
          - "facility.escalated_demand_count decreases, re-evaluating the facility RESTRICTED -> ACTIVE transition"
          - "increments RepurchaseDemand.version and WarehouseFacility.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: advance-create-stale-facility
    parent_entity: WarehouseFacility
    write_endpoint: "POST /advances"
    occ_field: "expected_facility_version"
    description: |
      Creating an Advance against a WarehouseFacility whose version has advanced
      since the client last read it is rejected. A second advance request is
      itself legitimate under the product semantics (the line has room for many
      advances), so the rejection is purely a stale-version check: the client's
      view of availability, sublimit headroom and investor exposure predates the
      first advance's funding cascade.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

  - rule_id: cure-payment-stale-margin-call
    parent_entity: MarginCall
    write_endpoint: "POST /margin-calls/{id}/cure-payments"
    occ_field: "expected_margin_call_version"
    description: |
      Applying a CurePayment to a MarginCall whose version has advanced since
      the client last read it is rejected. Partial cures are legitimately
      repeatable, so a later payment cannot be refused on state grounds; the
      rejection is a stale-version check protecting the client from sizing a
      payment against an obsolete cured_amount_cents.
    error_id: ERR_STALE_MARGIN_CALL_VERSION
    http_status: 412

  - rule_id: valuation-stale-advance
    parent_entity: Advance
    write_endpoint: "POST /advances/{id}/valuation"
    occ_field: "expected_advance_version"
    description: |
      Posting a collateral valuation against an Advance whose version has
      advanced since the client last read it is rejected. Re-valuing an advance
      is legitimately repeatable, so the rejection is a stale-version check
      protecting the client from over-writing a valuation that already drove a
      margin call.
    error_id: ERR_STALE_ADVANCE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: advance_amount_determination
    trigger: "POST /advances/{id}/fund — the FUNDED transition's side_effects store provisional_advance_amount_cents, advance_amount_cents and concentration_capped"
    algorithm: waterfall_allocation
    formula: |
      # ---- Stage 1: base rate selection -------------------------------------
      rate = ProductAdvanceRate(facility_id, advance.product_code).advance_rate
      if advance.funding_type == "WET":
          rate = rate - ProductAdvanceRate.wet_haircut
      # ---- Stage 2: orphan cap ----------------------------------------------
      commitment = InvestorCommitment(advance.investor_commitment_id)  # may be null
      if commitment is null or commitment.status in {"WITHDRAWN", "EXPIRED"}:
          rate = min(rate, ORPHAN_RATE)
      # ---- Stage 3: provisional sizing (floor, never round half up) ---------
      provisional_advance_amount_cents = floor(advance.loan_amount_cents * rate)
      # ---- Stage 4: hard caps, smallest wins --------------------------------
      caps = [ facility.availability_cents ]
      if ProductAdvanceRate.product_sublimit_cents is not null:
          caps.append(ProductAdvanceRate.product_sublimit_cents
                      - product_outstanding_cents(facility, advance.product_code))
      if advance.funding_type == "WET":
          caps.append(facility.wet_sublimit_cents - facility.wet_outstanding_cents)
      if advance.product_code == "SCRATCH_AND_DENT":
          caps.append(facility.scratch_and_dent_sublimit_cents
                      - facility.scratch_and_dent_outstanding_cents)
      if commitment is not null:
          caps.append(commitment.remaining_amount_cents)
      stage4 = min([provisional_advance_amount_cents] + caps)
      # ---- Stage 5: concentration solve (see concentration_constrained_advance)
      final = concentration_constrained_advance(stage4, commitment)
      concentration_capped = (final < stage4)
      advance_amount_cents = final
      # NOTE: a cap that binds at stage 4 is NOT an error — the advance funds at
      # the reduced amount. Only a stage-4 cap that is <= 0 raises the matching
      # sublimit/availability error (§1.4 priorities 38-43); a positive stage4 below
      # MIN_ADVANCE_CENTS raises ERR_ADVANCE_BELOW_MINIMUM (priority 35); and only a
      # stage-5 solve below MIN_ADVANCE_CENTS raises ERR_INVESTOR_CONCENTRATION_EXCEEDED
      # (priority 36). The three codes are disjoint by construction.
    input_set: |
      The single Advance being funded, its ProductAdvanceRate row on the same facility,
      its InvestorCommitment when investor_commitment_id is non-null, and the facility's
      rollups over sibling advances with funding_status in {FUNDED, SHIPPED} only
      (REQUESTED, REJECTED, PURCHASED and REPURCHASED advances are excluded from every
      outstanding rollup). product_outstanding_cents(facility, product_code) sums
      Advance.outstanding_balance_cents over that facility's advances with the same
      product_code and funding_status in {FUNDED, SHIPPED}.
    constants:
      ORPHAN_RATE: 0.85
      MIN_ADVANCE_CENTS: 1000000
    precision: "whole cents; the rate product is floored (truncated toward zero), never rounded half up — the lender never over-advances"
    variants:
      - name: WET_FUNDING
        when: "advance.funding_type == WET and ProductAdvanceRate.wet_funding_allowed is true"
        difference: "Stage 1 subtracts ProductAdvanceRate.wet_haircut from advance_rate and stage 4 adds the facility wet_sublimit headroom cap, so the same loan_amount_cents yields a strictly smaller advance_amount_cents than DRY."
      - name: DRY_FUNDING
        when: "advance.funding_type == DRY"
        difference: "Stage 1 uses the unreduced advance_rate and stage 4 omits the wet_sublimit cap, but the FUNDED transition additionally requires custody_status in {RECEIVED_CLEAR, EXCEPTION_CURED}."

  # ---------------------------------------------------------------------------
  - name: concentration_constrained_advance
    trigger: "stage 5 of advance_amount_determination, during POST /advances/{id}/fund"
    algorithm: constraint_propagation
    formula: |
      # Circular by construction: the concentration ratio is measured on the
      # POST-funding outstanding, which itself contains the amount being solved
      # for. The evaluation order below is PINNED; evaluating the ratio on the
      # pre-funding outstanding instead yields a different, wrong answer.
      #
      # Step 1  P = stage4 result from advance_amount_determination
      # Step 2  O = facility.outstanding_principal_cents      (pre-funding)
      # Step 3  hypothetical_outstanding = O + P
      # Step 4  if commitment is null: return P               (no investor to concentrate)
      #         if hypothetical_outstanding <= CONCENTRATION_FLOOR_CENTS: return P
      #                                        (de-minimis: strictly greater is required)
      # Step 5  E = TakeoutInvestor(commitment.investor_id).exposure_cents   (pre-funding)
      #         L = min(facility.max_investor_concentration_pct,
      #                 TakeoutInvestor.concentration_limit_pct)
      # Step 6  if (E + P) <= L * (O + P):   return P          # exact decimal compare,
      #                                                        # no intermediate rounding
      # Step 7  X_max = floor( (L * O - E) / (1 - L) )         # largest integer cents X
      #                                                        # with (E+X) <= L*(O+X)
      #         if X_max < 0: X_max = 0
      # Step 8  return min(P, X_max)
      #
      # The caller then raises ERR_INVESTOR_CONCENTRATION_EXCEEDED when the
      # returned value is below MIN_ADVANCE_CENTS.
    input_set: |
      Pre-funding facility.outstanding_principal_cents and pre-funding
      TakeoutInvestor.exposure_cents (both rolled up over advances with
      funding_status in {FUNDED, SHIPPED} exclusively), the stage-4 amount, and the two
      configured concentration caps. The advance being funded is NOT yet included in
      either rollup at steps 2 and 5.
    constants:
      CONCENTRATION_FLOOR_CENTS: 5000000000
      MIN_ADVANCE_CENTS: 1000000
    precision: "L is a four-decimal rate; all comparisons use exact decimal arithmetic; X_max is floored to whole cents"

  # ---------------------------------------------------------------------------
  - name: eligible_collateral_valuation
    trigger: "POST /advances/{id}/fund, POST /advances/{id}/receipts, POST /receipts/{id}/cure, POST /advances/{id}/valuation, POST /commitments/{id}/withdraw, POST /investors/{id}/suspend and POST /facilities/{id}/aging-run — each stores effective_advance_rate, eligible_collateral_value_cents and required_paydown_cents"
    algorithm: threshold
    formula: |
      par = ProductAdvanceRate(facility_id, advance.product_code)
      # r0 — base rate, wet haircut still on while the file is not in hand
      r0 = par.advance_rate
      if advance.funding_type == "WET" and advance.custody_status in {"PENDING_RECEIPT", "RECEIPT_OVERDUE"}:
          r0 = r0 - par.wet_haircut
      # r1 — aging curtailment, stepwise, strictly beyond the dwell limit
      if advance.dwell_days > par.dwell_limit_days:
          aging_steps = ceil((advance.dwell_days - par.dwell_limit_days) / par.aging_step_days)
      else:
          aging_steps = 0
      r1 = r0 - aging_steps * par.curtailment_step_rate
      # r2 — open document exception haircut
      if advance.custody_status == "RECEIVED_EXCEPTION":
          r2 = r1 - EXCEPTION_HAIRCUT
      else:
          r2 = r1
      # r3 — orphaned collateral cap
      commitment = InvestorCommitment(advance.investor_commitment_id)
      if commitment is null or commitment.status in {"WITHDRAWN", "EXPIRED"}:
          r3 = min(r2, ORPHAN_RATE)
      else:
          r3 = r2
      effective_advance_rate = round_half_up(max(r3, 0), 4)
      eligible_collateral_value_cents =
          floor(min(advance.loan_amount_cents, advance.market_value_cents)
                * effective_advance_rate)
      required_paydown_cents = max(0, advance.outstanding_balance_cents
                                     - eligible_collateral_value_cents)
    input_set: |
      One Advance with funding_status in {FUNDED, SHIPPED}. Advances in REQUESTED,
      REJECTED, PURCHASED or REPURCHASED are not valued: effective_advance_rate keeps its
      last stored value and required_paydown_cents is forced to 0.
    constants:
      EXCEPTION_HAIRCUT: 0.05
      ORPHAN_RATE: 0.85
    precision: "effective_advance_rate to 4 decimals round_half_up; cent amounts floored"

  # ---------------------------------------------------------------------------
  - name: dwell_and_aging_classification
    trigger: "read of Advance.dwell_days / is_aged, and every POST /facilities/{id}/aging-run"
    algorithm: threshold
    formula: |
      if advance.funded_at is null or advance.funding_status not in {"FUNDED", "SHIPPED"}:
          dwell_days = 0
          is_aged = false
      else:
          dwell_days = floor((logical_clock - advance.funded_at) / 86400 seconds)
          is_aged = (dwell_days > ProductAdvanceRate.dwell_limit_days)   # STRICTLY greater
      # aged_sublimit gate, evaluated on every aging-run:
      #   when facility.aged_outstanding_cents > facility.aged_sublimit_cents the
      #   aging-run raises no error (it is a system job) but every subsequent
      #   POST /advances/{id}/fund fails ERR_AGED_SUBLIMIT_EXCEEDED until the
      #   excess is cured or repurchased.
    input_set: "One Advance and its ProductAdvanceRate row; the logical clock supplies the reference instant."
    constants:
      SECONDS_PER_DAY: 86400
      AGING_RUN_DEMAND_DAYS: 10
    precision: "dwell_days is an integer count of complete 24-hour periods, floored; a dwell of exactly dwell_limit_days is NOT aged"
    note: |
      AGING_RUN_DEMAND_DAYS is the cure window granted by a system-raised
      RepurchaseDemand: the BaileeLetter ISSUED -> EXPIRED transition sets
      deadline_at = logical clock + AGING_RUN_DEMAND_DAYS days, and
      POST /advances/{id}/repurchase-demands uses the same window.

  # ---------------------------------------------------------------------------
  - name: margin_call_amount
    trigger: "creation of any MarginCall — POST /margin-calls, and the system-issued calls listed in the §1.2 side_effects of POST /investors/{id}/suspend, POST /commitments/{id}/withdraw, POST /advances/{id}/receipts, POST /advances/{id}/valuation, POST /advances/{id}/purchase, POST /facilities/{id}/covenant-tests and POST /facilities/{id}/aging-run"
    algorithm: aggregation
    formula: |
      if margin_call.advance_id is not null:
          # advance-level call: snapshot the advance's shortfall
          call_amount_cents = Advance(advance_id).required_paydown_cents
      else:
          # facility-level call (trigger_reason == COVENANT_BREACH)
          call_amount_cents = floor(facility.outstanding_principal_cents
                                    * COVENANT_BREACH_PAYDOWN_PCT)
      cure_deadline_at = issued_at + cure_days days
      # A call whose computed call_amount_cents == 0 is NOT created; the system
      # simply skips it, and POST /margin-calls rejects it with
      # ERR_MARGIN_CALL_AMOUNT_ZERO.
    input_set: |
      For advance-level calls, exactly one Advance with funding_status in {FUNDED,
      SHIPPED}. For facility-level calls, facility.outstanding_principal_cents as rolled
      up over advances with funding_status in {FUNDED, SHIPPED}.
    constants:
      COVENANT_BREACH_PAYDOWN_PCT: 0.10
      DEFAULT_CURE_DAYS: 2
    precision: "whole cents, floored"

  # ---------------------------------------------------------------------------
  - name: cure_payment_waterfall
    trigger: "POST /margin-calls/{id}/cure-payments — stores CurePayment.applied_to_fees_cents, applied_to_principal_cents and principal_allocation"
    algorithm: waterfall_allocation
    formula: |
      remaining = payment.amount_cents
      # ---- Bucket 1: accrued fees ------------------------------------------
      applied_to_fees_cents = min(remaining, facility.accrued_fee_balance_cents)
      remaining = remaining - applied_to_fees_cents
      # ---- Bucket 2: margin-call principal obligation -----------------------
      obligation = max(0, margin_call.call_amount_cents - margin_call.cured_amount_cents)
      applied_to_principal_cents = min(remaining, obligation)
      # ---- Bucket 2 split across covered advances ---------------------------
      # covered_advances = [margin_call.advance_id] when non-null, else every
      # advance of the facility with funding_status in {FUNDED, SHIPPED},
      # ordered by created_at ASC.
      # ROUNDING ORDER IS PINNED: compute each advance's floor share FIRST, then
      # distribute the leftover cents one at a time in created_at ASC order.
      # Computing the shares from a pre-rounded total (sum-then-round) is wrong
      # and produces a different per-advance split.
      T = sum(a.outstanding_balance_cents for a in covered_advances)
      for a in covered_advances:
          share[a] = floor(applied_to_principal_cents * a.outstanding_balance_cents / T)
      leftover = applied_to_principal_cents - sum(share.values())
      for a in covered_advances ordered by a.created_at ASC:
          if leftover == 0: break
          share[a] = share[a] + 1
          leftover = leftover - 1
      principal_allocation = [ { advance_id: a.id, amount_cents: share[a] }
                               for a in covered_advances ordered by created_at ASC ]
      # ---- Postings ---------------------------------------------------------
      if applied_to_fees_cents > 0:
          append LedgerEntry { entry_type: FEE_PAYMENT, direction: CREDIT,
                               amount_cents: applied_to_fees_cents, advance_id: null }
      for each { advance_id, amount_cents } in principal_allocation with amount_cents > 0:
          append LedgerEntry { entry_type: CURE_PRINCIPAL, direction: CREDIT,
                               amount_cents: amount_cents, advance_id: advance_id }
      margin_call.cured_amount_cents += applied_to_principal_cents
      margin_call.status = (cured_amount_cents >= call_amount_cents) ? "CURED" : "PARTIALLY_CURED"
      # amount_cents strictly greater than
      # facility.accrued_fee_balance_cents + obligation is rejected upstream with
      # ERR_CURE_PAYMENT_EXCEEDS_OBLIGATION, so remaining is always 0 here.
    input_set: |
      One CurePayment, its MarginCall, the facility's accrued_fee_balance_cents, and the
      covered_advances set defined above — advances with funding_status in {FUNDED,
      SHIPPED} only; REQUESTED, REJECTED, PURCHASED and REPURCHASED advances never
      receive an allocation. Ordering key: created_at ASC (never id).
    constants: {}
    precision: "whole cents; per-advance floor shares first, then single-cent leftover distribution in created_at ASC order"

  # ---------------------------------------------------------------------------
  - name: facility_fee_accrual
    trigger: "POST /facilities/{id}/aging-run — writes one FEE_ACCRUAL LedgerEntry and refreshes facility.last_accrual_at"
    algorithm: aggregation
    formula: |
      accrual_days = floor((logical_clock - facility.last_accrual_at) / 86400 seconds)
      if accrual_days <= 0:
          fee_accrual_cents = 0     # no entry written
      else:
          # ROUNDING ORDER IS PINNED: round EACH advance's interest to whole cents
          # first, then sum. Summing the unrounded per-advance figures and
          # rounding once at the end yields a different total (off-by-cents) and
          # is wrong.
          per_advance = []
          for a in advances of the facility with funding_status in {FUNDED, SHIPPED}
                   ordered by created_at ASC:
              per_advance.append(
                  round_half_up(a.outstanding_balance_cents
                                * (a.note_rate + FACILITY_SPREAD)
                                / DAY_COUNT_BASIS * accrual_days) )
          interest_cents = sum(per_advance)
          unused_fee_cents = round_half_up(
              max(0, facility.committed_amount_cents - facility.outstanding_principal_cents)
              * facility.unused_line_fee_rate / DAY_COUNT_BASIS * accrual_days )
          fee_accrual_cents = interest_cents + unused_fee_cents
      if fee_accrual_cents > 0:
          append LedgerEntry { entry_type: FEE_ACCRUAL, direction: DEBIT,
                               amount_cents: fee_accrual_cents, advance_id: null }
      facility.last_accrual_at = logical_clock
    input_set: |
      Every Advance of the facility with funding_status in {FUNDED, SHIPPED} at the instant
      of the aging-run, ordered by created_at ASC, plus the facility's committed and
      outstanding balances. Advances that the same aging-run just curtailed are included
      at their outstanding_balance_cents as of the start of the run.
    constants:
      FACILITY_SPREAD: 0.0225
      DAY_COUNT_BASIS: 360
    precision: "round_half_up to whole cents PER ADVANCE, then sum; the unused-line fee is rounded once as its own line"

  # ---------------------------------------------------------------------------
  - name: covenant_evaluation
    trigger: "POST /facilities/{id}/covenant-tests — stores profitability_variant, profitability_metric_cents, breach_codes and status"
    algorithm: forward_looking
    formula: |
      breach_codes = []
      if test.tangible_net_worth_cents < facility.min_tangible_net_worth_cents:
          breach_codes.append("NET_WORTH")
      if test.liquidity_cents < facility.min_liquidity_cents:
          breach_codes.append("LIQUIDITY")
      priors = CovenantTest rows of this facility excluding this one,
               status in {PASS, BREACH, WAIVED},
               ordered by period_end DESC, tie-break created_at DESC
      if len(priors) >= TTM_QUARTERS - 1:
          profitability_variant = "TTM_ROLLING"
          profitability_metric_cents = test.net_income_cents
                                       + sum(p.net_income_cents
                                             for p in priors[0 : TTM_QUARTERS - 1])
      else:
          profitability_variant = "ANNUALIZED_QUARTER"
          profitability_metric_cents = test.net_income_cents * TTM_QUARTERS
      if profitability_metric_cents < facility.min_ttm_net_income_cents:
          breach_codes.append("PROFITABILITY")
      breach_codes = sorted(breach_codes)     # LIQUIDITY < NET_WORTH < PROFITABILITY
      status = "PASS" if breach_codes == [] else "BREACH"
    input_set: |
      The submitted CovenantTest plus the facility's three prior tests with the greatest
      period_end values among rows whose status is in {PASS, BREACH, WAIVED} — a WAIVED
      prior still counts toward both the variant selection and the TTM sum. Tests are
      never deleted, so the prior set is append-only.
    constants:
      TTM_QUARTERS: 4
    precision: "integer cents; no rounding"
    variants:
      - name: TTM_ROLLING
        when: "the facility already has at least 3 stored CovenantTest rows with status in {PASS, BREACH, WAIVED}"
        difference: "Profitability is the trailing-four-quarter SUM of net_income_cents (this test plus the three most recent priors), so weak earlier quarters can breach the covenant even when the current quarter is strong."
      - name: ANNUALIZED_QUARTER
        when: "the facility has fewer than 3 stored CovenantTest rows with status in {PASS, BREACH, WAIVED}"
        difference: "Profitability is this quarter's net_income_cents MULTIPLIED BY 4, so the identical net_income_cents that breaches under TTM_ROLLING can pass here — the same certified numbers yield opposite covenant outcomes."

  # ---------------------------------------------------------------------------
  - name: facility_exposure_rollup
    trigger: "read of any WarehouseFacility computed field, GET /facilities/{id}/exposure-summary, and as a side effect of every transition that writes a LedgerEntry"
    algorithm: projection
    formula: |
      PRINCIPAL_TYPES = {ADVANCE_FUNDED, CURE_PRINCIPAL, INVESTOR_PROCEEDS, REPURCHASE}
      outstanding_principal_cents =
            sum(e.amount_cents for e in LedgerEntry(facility)
                if e.entry_type in PRINCIPAL_TYPES and e.direction == "DEBIT")
          - sum(e.amount_cents for e in LedgerEntry(facility)
                if e.entry_type in PRINCIPAL_TYPES and e.direction == "CREDIT")
      accrued_fee_balance_cents =
            sum(e.amount_cents for e in LedgerEntry(facility) if e.entry_type == "FEE_ACCRUAL")
          - sum(e.amount_cents for e in LedgerEntry(facility) if e.entry_type == "FEE_PAYMENT")
      availability_cents = max(0, committed_amount_cents - outstanding_principal_cents)
      # MARGIN_CALL_WAIVED entries are informational and enter NEITHER sum.
      # Advance.outstanding_balance_cents uses the same PRINCIPAL_TYPES filter
      # restricted to entries whose advance_id equals that advance, so
      #   facility.outstanding_principal_cents
      #     == sum(a.outstanding_balance_cents for a in advances with
      #            funding_status in {FUNDED, SHIPPED})
      # is a standing invariant.
      wet_outstanding_cents / aged_outstanding_cents / scratch_and_dent_outstanding_cents
          are the §1.1 filtered sums over the same advance set.
    input_set: "Every LedgerEntry of the facility, replayed in posted_at ASC order with created_at ASC as the tie-break; the log is append-only so the projection is deterministic."
    constants: {}
    precision: "integer cents; no rounding"

# =============================================================================
# §1.4 Validation Rules Table — evaluated in strict ascending `priority` order.
# The FIRST rule that fails short-circuits the request; no later rule is
# evaluated and no partial write is persisted.
# =============================================================================
validations:

  # ---- Tier A: authentication and authorisation ------------------------------
  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role request headers are present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
    description: |
      Every endpoint except POST /_clock/set_current_utc requires both headers. This is
      checked before the path is even resolved, so a missing header on a request to a
      non-existent id still returns 401, never 404.
  - priority: 2
    category: auth
    check: "X-User-Role is one of the endpoint's declared §1.5 roles."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: |
      Role authorisation precedes existence. A CollateralAnalyst calling
      POST /facilities/{id}/approve receives 403 even when {id} does not exist.
      Entity-backed roles (Borrower, Custodian, Investor) additionally fail this check
      when X-User-ID does not resolve to a row of the backing entity.

  # ---- Tier B: existence and ownership ---------------------------------------
  - priority: 3
    category: existence
    check: "Every path-parameter id resolves to an existing row of the addressed collection."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: |
      The concrete code is determined by the addressed collection segment:
      /facilities -> ERR_FACILITY_NOT_FOUND, /advances -> ERR_ADVANCE_NOT_FOUND,
      /investors -> ERR_INVESTOR_NOT_FOUND, /custodians -> ERR_CUSTODIAN_NOT_FOUND,
      /commitments -> ERR_COMMITMENT_NOT_FOUND, /margin-calls -> ERR_MARGIN_CALL_NOT_FOUND,
      /wire-instructions -> ERR_WIRE_INSTRUCTION_NOT_FOUND,
      /receipts -> ERR_RECEIPT_NOT_FOUND, /covenant-tests -> ERR_COVENANT_TEST_NOT_FOUND,
      /repurchase-demands -> ERR_REPURCHASE_DEMAND_NOT_FOUND.
      Left-to-right: for a nested path the outer id is resolved first.
  - priority: 4
    category: existence
    check: "For entity-backed roles, the addressed row belongs to the caller's own aggregate."
    error_id: ERR_RESOURCE_MISMATCH
    http_status: 404
    applies_to:
      - "GET /facilities/{id}"
      - "GET /facilities/{id}/exposure-summary"
      - "GET /facilities/{id}/ledger-entries"
      - "GET /advances/{id}"
      - "GET /custodians/{id}/receipts"
      - "GET /investors/{id}/commitments"
      - "GET /investors/{id}/bailee-letters"
      - "POST /advances/{id}/receipts"
      - "POST /receipts/{id}/cure"
      - "POST /advances/{id}/purchase"
    description: |
      A Borrower may only read its own facility, a Custodian only advances assigned to
      its own custodian row, an Investor only its own commitments and bailee letters.
      Cross-tenant reads return 404 (not 403) so existence is not leaked.
  - priority: 5
    category: existence
    check: "Every id supplied in the request body resolves, and resolves within the addressed facility."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to:
      - "POST /advances"
      - "POST /facilities/{id}/commitments"
      - "POST /margin-calls"
    description: |
      POST /advances validates facility_id, custodian_id and (when non-null)
      investor_commitment_id. A commitment or custodian that exists but belongs to a
      different facility yields the same NOT_FOUND code as one that does not exist at all.
  - priority: 6
    category: existence
    check: "A ProductAdvanceRate row exists on the facility for the requested product_code."
    error_id: ERR_ADVANCE_RATE_NOT_CONFIGURED
    http_status: 422
    applies_to:
      - "POST /advances"
    description: |
      Advance sizing is impossible without a rate row, so this is resolved as an
      existence check before any schema-independent business rule runs.

  # ---- Tier C: request schema ------------------------------------------------
  - priority: 7
    category: schema
    check: "All required body fields present; types, enum members, string formats and numeric ranges valid; pagination limit in [1,100] and offset >= 0."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
    description: |
      Also rejects: negative or zero *_cents amounts, rates outside [0,1], a
      period_end that is not a date, market_value_cents <= 0, an amount_cents of 0 on a
      cure payment, and any attempt to supply a computed or system field in the body
      (such fields are ignored, not rejected, when they merely echo the stored value).

  # ---- Tier D: optimistic concurrency ---------------------------------------
  - priority: 8
    category: concurrency
    check: "When the endpoint declares an expected_<parent>_version input, it equals the parent row's current version."
    error_id: "ERR_STALE_<PARENT>_VERSION"
    http_status: 412
    applies_to:
      - "POST /advances"
      - "POST /margin-calls/{id}/cure-payments"
      - "POST /advances/{id}/valuation"
    description: |
      Exactly the three §1.2.1 concurrency rules. The version is compared AFTER
      existence and schema but BEFORE any state check, so a stale version against a
      SUSPENDED facility returns 412, not 409.

  # ---- Tier E: own-entity state ---------------------------------------------
  - priority: 9
    category: state
    check: "The addressed WarehouseFacility is in the state the trigger requires (PENDING_APPROVAL for approve; ACTIVE or RESTRICTED for suspend; SUSPENDED for reinstate)."
    error_id: ERR_FACILITY_INVALID_STATE
    http_status: 409
    applies_to:
      - "POST /facilities/{id}/approve"
      - "POST /facilities/{id}/suspend"
      - "POST /facilities/{id}/reinstate"
      - "POST /facilities/{id}/product-advance-rates"
    description: |
      Approving an already-ACTIVE facility, or adding a ProductAdvanceRate to a facility
      that has left PENDING_APPROVAL, fails here. Idempotent re-approval is NOT allowed.
  - priority: 10
    category: state
    check: "The owning WarehouseFacility is ACTIVE (booking new exposure) or in {ACTIVE, RESTRICTED} (servicing existing exposure)."
    error_id: ERR_FACILITY_NOT_ACTIVE
    http_status: 409
    applies_to:
      - "POST /advances"
      - "POST /advances/{id}/fund"
      - "POST /facilities/{id}/commitments"
      - "POST /facilities/{id}/investors"
      - "POST /facilities/{id}/custodians"
    description: |
      ACTIVE-only for the five booking endpoints above. Servicing endpoints (ship,
      purchase, repurchase, receipts, cure, cure-payments, aging-run, covenant-tests)
      remain available while the facility is RESTRICTED and while it is SUSPENDED, so a
      borrower can always de-risk its way back out. This rule sits ABOVE every fiscal
      rule: a SUSPENDED facility whose availability is also exhausted returns
      ERR_FACILITY_NOT_ACTIVE, never ERR_FACILITY_AVAILABILITY_EXCEEDED.
  - priority: 11
    category: state
    check: "Advance.funding_status permits the trigger (REQUESTED for fund; FUNDED or SHIPPED for ship, valuation, repurchase and repurchase-demands; SHIPPED for purchase; REQUESTED, FUNDED or SHIPPED for receipts)."
    error_id: ERR_ADVANCE_INVALID_STATE
    http_status: 409
    applies_to:
      - "POST /advances/{id}/fund"
      - "POST /advances/{id}/ship"
      - "POST /advances/{id}/purchase"
      - "POST /advances/{id}/repurchase"
      - "POST /advances/{id}/valuation"
      - "POST /advances/{id}/repurchase-demands"
      - "POST /advances/{id}/receipts"
    description: |
      PURCHASED, REPURCHASED and REJECTED are terminal on the funding axis: every trigger
      above fails from those three states. Re-shipping an already SHIPPED advance is the
      one permitted self-loop and is governed by priority 24 instead.
  - priority: 12
    category: state
    check: "Advance.custody_status permits the trigger (PENDING_RECEIPT or RECEIPT_OVERDUE for a new receipt; RECEIVED_EXCEPTION for a cure)."
    error_id: ERR_CUSTODY_INVALID_STATE
    http_status: 409
    applies_to:
      - "POST /advances/{id}/receipts"
      - "POST /receipts/{id}/cure"
    description: |
      The custody axis is independent of the funding axis; a second receipt against an
      advance already in RECEIVED_CLEAR fails here even though funding_status is FUNDED.
  - priority: 13
    category: state
    check: "WireInstruction.status == PENDING_VERIFICATION."
    error_id: ERR_WIRE_INSTRUCTION_NOT_PENDING
    http_status: 409
    applies_to:
      - "POST /wire-instructions/{id}/decision"
    description: "A wire may be decided exactly once; VERIFIED and BLOCKED are terminal."
  - priority: 14
    category: state
    check: "MarginCall.status is ISSUED or PARTIALLY_CURED."
    error_id: ERR_MARGIN_CALL_NOT_OPEN
    http_status: 409
    applies_to:
      - "POST /margin-calls/{id}/cure-payments"
      - "POST /margin-calls/{id}/waive"
    description: "CURED, WAIVED and DEFAULTED margin calls accept no further payments and cannot be waived."
  - priority: 15
    category: state
    check: "InvestorCommitment.status is OPEN or PARTIALLY_ALLOCATED."
    error_id: ERR_COMMITMENT_NOT_ACTIVE
    http_status: 409
    applies_to:
      - "POST /commitments/{id}/withdraw"
    description: "WITHDRAWN, EXPIRED and FULLY_ALLOCATED commitments cannot be withdrawn again."
  - priority: 16
    category: state
    check: "CovenantTest.status == BREACH."
    error_id: ERR_COVENANT_TEST_NOT_BREACHED
    http_status: 409
    applies_to:
      - "POST /covenant-tests/{id}/waive"
    description: "A PASS test has nothing to waive; an already WAIVED test cannot be waived twice."
  - priority: 17
    category: state
    check: "RepurchaseDemand.status == OPEN AND the logical clock has reached demand.deadline_at."
    error_id: ERR_REPURCHASE_DEMAND_NOT_OPEN
    http_status: 409
    applies_to:
      - "POST /repurchase-demands/{id}/escalate"
    description: |
      ESCALATED and SATISFIED demands are not escalatable, and an OPEN demand cannot be
      escalated before its own deadline_at — the borrower owns the full
      AGING_RUN_DEMAND_DAYS window. Both halves surface the same error_id.

  # ---- Tier F: cross-entity state gates -------------------------------------
  - priority: 18
    category: business_referential
    check: "The facility has no MarginCall in {ISSUED, PARTIALLY_CURED} and no CovenantTest in BREACH."
    error_id: ERR_OPEN_MARGIN_CALL
    http_status: 409
    applies_to:
      - "POST /facilities/{id}/reinstate"
    description: |
      Reinstatement is gated on a DIFFERENT aggregate's state: the facility itself is a
      perfectly valid SUSPENDED row, yet the call fails because a child MarginCall or a
      breached CovenantTest is still live. Curing or waiving every one of them flips the
      same request to success with no change to the facility row.

  # ---- Tier G: wire-fraud, dual-control and custody safety ------------------
  - priority: 19
    category: business_safety
    check: "The advance's WireInstruction.status == VERIFIED."
    error_id: ERR_WIRE_NOT_VERIFIED
    http_status: 409
    applies_to:
      - "POST /advances/{id}/fund"
    description: "No advance funds on an unverified or BLOCKED wire, whatever the collateral looks like."
  - priority: 20
    category: business_safety
    check: "WireInstruction.payee_account_last4 == owning facility's settlement_account_last4."
    error_id: ERR_PAYEE_ACCOUNT_MISMATCH
    http_status: 422
    applies_to:
      - "POST /wire-instructions/{id}/decision"
      - "POST /advances/{id}/fund"
    description: |
      The core wire-fraud control: funds leave only to the facility's pre-registered
      settlement account. Re-checked at funding time so that a settlement account changed
      after verification cannot be exploited. On the decision endpoint the check applies
      only when decision == VERIFY; a BLOCK decision always succeeds.
  - priority: 21
    category: business_safety
    check: "X-User-ID != WireInstruction.decided_by_user_id."
    error_id: ERR_DUAL_CONTROL_VIOLATION
    http_status: 409
    applies_to:
      - "POST /advances/{id}/fund"
    description: |
      Four-eyes: the operator who verified the wire may not also release it. Both
      CollateralAnalyst and WireOperator are authorised for both endpoints, so this is a
      user-identity rule and not a role rule.
  - priority: 22
    category: business_safety
    check: "For DRY funding, Advance.custody_status is RECEIVED_CLEAR or EXCEPTION_CURED."
    error_id: ERR_CUSTODY_RECEIPT_REQUIRED
    http_status: 409
    applies_to:
      - "POST /advances/{id}/fund"
    description: |
      Dry funding requires the custodian's clear receipt in hand first. Wet funding is
      exempt (that is precisely what the wet haircut and wet sublimit price), so this rule
      is conditional on funding_type.
  - priority: 23
    category: business_safety
    check: "Advance has a BaileeLetter in ISSUED status whose expires_at is strictly after the logical clock."
    error_id: ERR_BAILEE_LETTER_REQUIRED
    http_status: 409
    applies_to:
      - "POST /advances/{id}/purchase"
    description: |
      Collateral may not be released to an investor's purchase without a live, issued
      bailee letter. An EXPIRED or REVOKED letter fails identically to a missing one.
  - priority: 24
    category: business_safety
    check: "No existing BaileeLetter of this advance in ISSUED has a [effective_from, expires_at) window overlapping the new letter's."
    error_id: ERR_BAILEE_WINDOW_OVERLAP
    http_status: 422
    applies_to:
      - "POST /advances/{id}/ship"
    description: |
      Half-open interval semantics: a new letter shipped at exactly the prior letter's
      expires_at instant is allowed (zero gap), one instant earlier is rejected. HONORED,
      EXPIRED and REVOKED letters never conflict.

  # ---- Tier H: referential business rules -----------------------------------
  - priority: 25
    category: business_referential
    check: "The take-out investor's status is APPROVED."
    error_id: ERR_INVESTOR_NOT_APPROVED
    http_status: 422
    applies_to:
      - "POST /advances/{id}/ship"
      - "POST /advances/{id}/purchase"
      - "POST /facilities/{id}/commitments"
    description: |
      Resolution source depends on the endpoint: POST /advances/{id}/ship and
      POST /facilities/{id}/commitments check the investor_id supplied in the request body,
      POST /advances/{id}/purchase resolves through the advance's
      InvestorCommitment.investor_id. A PENDING_APPROVAL or SUSPENDED investor blocks
      shipment and purchase. This rule outranks every business_constraint rule, so a
      suspended investor whose commitment also mismatches returns
      ERR_INVESTOR_NOT_APPROVED, never ERR_COMMITMENT_INVESTOR_MISMATCH.
  - priority: 26
    category: business_referential
    check: "The DocumentCustodian's status is APPROVED."
    error_id: ERR_CUSTODIAN_NOT_ACTIVE
    http_status: 422
    applies_to:
      - "POST /advances"
      - "POST /advances/{id}/receipts"
    description: "A SUSPENDED custodian can neither be assigned new collateral nor issue new receipts."

  # ---- Tier I: constraint business rules ------------------------------------
  - priority: 27
    category: business_constraint
    check: "The shipment's target commitment is the advance's own investor_commitment_id, and the commitment's investor_id equals the request's investor_id."
    error_id: ERR_COMMITMENT_INVESTOR_MISMATCH
    http_status: 422
    applies_to:
      - "POST /advances/{id}/ship"
    description: "Collateral cannot be bailee-shipped to an investor other than the one whose commitment it was allocated against."
  - priority: 28
    category: business_constraint
    check: "ProductAdvanceRate.wet_funding_allowed is true when funding_type == WET."
    error_id: ERR_WET_FUNDING_NOT_ALLOWED
    http_status: 422
    applies_to:
      - "POST /advances"
    description: "Some products (notably SCRATCH_AND_DENT) are dry-only by policy."
  - priority: 29
    category: business_constraint
    check: "No ProductAdvanceRate row already exists on this facility with the same product_code."
    error_id: ERR_DUPLICATE_ADVANCE_RATE
    http_status: 409
    applies_to:
      - "POST /facilities/{id}/product-advance-rates"
    description: "product_code is unique per facility."
  - priority: 30
    category: business_constraint
    check: "No CovenantTest already exists on this facility with the same period_end."
    error_id: ERR_DUPLICATE_COVENANT_PERIOD
    http_status: 409
    applies_to:
      - "POST /facilities/{id}/covenant-tests"
    description: "period_end is unique per facility; restating a quarter is a waiver, not a re-submission."
  - priority: 31
    category: business_constraint
    check: "The facility has at least one ProductAdvanceRate row."
    error_id: ERR_NO_ADVANCE_RATES_CONFIGURED
    http_status: 422
    applies_to:
      - "POST /facilities/{id}/approve"
    description: |
      Empty-set boundary: a facility with zero configured advance rates cannot be
      approved, because every subsequent advance would be unpriceable. Exactly one rate
      row is sufficient.
  - priority: 32
    category: business_constraint
    check: "CurePayment.amount_cents <= facility.accrued_fee_balance_cents + (MarginCall.call_amount_cents - MarginCall.cured_amount_cents)."
    error_id: ERR_CURE_PAYMENT_EXCEEDS_OBLIGATION
    http_status: 422
    applies_to:
      - "POST /margin-calls/{id}/cure-payments"
    description: "The waterfall has exactly two buckets and no overflow destination, so an over-payment is rejected rather than credited."
  - priority: 33
    category: business_constraint
    check: "The computed call_amount_cents is strictly greater than 0."
    error_id: ERR_MARGIN_CALL_AMOUNT_ZERO
    http_status: 422
    applies_to:
      - "POST /margin-calls"
    description: "A manual margin call against a fully-collateralised advance computes to zero and is refused."
  - priority: 34
    category: business_constraint
    check: "payment_amount_cents == Advance.outstanding_balance_cents exactly."
    error_id: ERR_REPURCHASE_AMOUNT_MISMATCH
    http_status: 422
    applies_to:
      - "POST /advances/{id}/repurchase"
    description: |
      A repurchase must extinguish the advance to the cent — partial repurchases are not a
      thing. This is what makes the ledger conservation invariant exactly checkable.
  - priority: 35
    category: business_constraint
    check: |
      The stage-4 result of advance_amount_determination — the provisional amount after
      every hard cap but BEFORE the stage-5 concentration solve — is >= MIN_ADVANCE_CENTS.
      The rule is SKIPPED when any stage-4 cap is <= 0: that case belongs exclusively to
      the fiscal tier at priorities 38-43, which names the offending bucket. A stage-5
      shortfall belongs to priority 36, not here.
    error_id: ERR_ADVANCE_BELOW_MINIMUM
    http_status: 422
    applies_to:
      - "POST /advances/{id}/fund"
    description: |
      A cap chain that grinds the advance down below 1,000,000 cents funds nothing at all.
      The two carve-outs above keep the three overlapping codes disjoint: a bucket with
      zero headroom reports its own sublimit code, a concentration-bound advance reports
      ERR_INVESTOR_CONCENTRATION_EXCEEDED, and only a positive-but-tiny stage-4 result
      reports ERR_ADVANCE_BELOW_MINIMUM.
  - priority: 36
    category: business_constraint
    check: "The concentration solve returned a positive amount, i.e. floor((L*O - E)/(1-L)) >= MIN_ADVANCE_CENTS."
    error_id: ERR_INVESTOR_CONCENTRATION_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /advances/{id}/fund"
    description: |
      Distinct from priority 35: this fires only when the binding cap was the take-out
      investor concentration limit, so the borrower knows which knob to turn. Not
      evaluated at all while hypothetical outstanding is <= CONCENTRATION_FLOOR_CENTS.

  # ---- Tier J: temporal business rules --------------------------------------
  - priority: 37
    category: business_temporal
    check: "The new commitment's closed [effective_on, expires_on] window, widened by COMMITMENT_BUFFER_DAYS on each side, does not intersect the window of any existing OPEN or PARTIALLY_ALLOCATED commitment of the same (facility, investor) pair."
    error_id: ERR_COMMITMENT_WINDOW_CONFLICT
    http_status: 422
    applies_to:
      - "POST /facilities/{id}/commitments"
    description: |
      Closed-interval semantics plus a 2-day operational buffer: a window starting the
      day after a prior window ends still conflicts; the third day is clear. WITHDRAWN,
      EXPIRED and FULLY_ALLOCATED commitments do not reserve their windows.

  # ---- Tier K: fiscal business rules ----------------------------------------
  - priority: 38
    category: business_fiscal
    check: "facility.availability_cents > 0 at the moment of funding."
    error_id: ERR_FACILITY_AVAILABILITY_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /advances/{id}/fund"
    description: |
      Availability that is merely SMALLER than the provisional amount is not an error —
      the advance funds at the reduced amount (stage 4). Only zero headroom is fatal.
  - priority: 39
    category: business_fiscal
    check: "facility.wet_sublimit_cents - facility.wet_outstanding_cents > 0 when funding_type == WET."
    error_id: ERR_WET_SUBLIMIT_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /advances/{id}/fund"
    description: "Same semantics as priority 38, restricted to the wet bucket."
  - priority: 40
    category: business_fiscal
    check: "facility.aged_outstanding_cents <= facility.aged_sublimit_cents."
    error_id: ERR_AGED_SUBLIMIT_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /advances/{id}/fund"
    description: |
      Aggregate rule measured on OTHER advances: no single advance is individually at
      fault, but once the facility's aged bucket is over its sublimit no new advance funds
      until the aged collateral is curtailed or repurchased.
  - priority: 41
    category: business_fiscal
    check: "facility.scratch_and_dent_outstanding_cents < facility.scratch_and_dent_sublimit_cents when product_code == SCRATCH_AND_DENT."
    error_id: ERR_SCRATCH_AND_DENT_SUBLIMIT_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /advances/{id}/fund"
    description: "Scratch-and-dent collateral is capped at its own sublimit."
  - priority: 42
    category: business_fiscal
    check: "ProductAdvanceRate.product_sublimit_cents - product_outstanding_cents > 0 when the rate row declares a sublimit."
    error_id: ERR_PRODUCT_SUBLIMIT_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /advances/{id}/fund"
    description: "Per-product sublimit; a null product_sublimit_cents disables the rule entirely."
  - priority: 43
    category: business_fiscal
    check: "InvestorCommitment.remaining_amount_cents > 0 when the advance names a commitment."
    error_id: ERR_COMMITMENT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /advances/{id}/fund"
    description: |
      A FULLY_ALLOCATED commitment has no headroom left. Lowest priority of the fiscal
      tier, so a facility-level shortfall is always reported in preference to an
      investor-level one.

  # ---- Tier J: endpoint-disjoint counterparty state gates ---------------------
  # Priorities 44 and 45 are state rules that sit at the tail of the ladder purely
  # because they were appended late. Their position is order-irrelevant: their
  # applies_to sets are disjoint from every other rule of priority >= 4, so no
  # request can ever violate one of them together with another business rule.
  - priority: 44
    category: state
    check: "TakeoutInvestor.status permits the trigger (PENDING_APPROVAL for approve; APPROVED for suspend)."
    error_id: ERR_INVESTOR_INVALID_STATE
    http_status: 409
    applies_to:
      - "POST /investors/{id}/approve"
      - "POST /investors/{id}/suspend"
    description: |
      Closes the idempotency hole on the investor lifecycle: approving an already APPROVED
      investor, approving a SUSPENDED one, or suspending a PENDING_APPROVAL one are all
      rejected rather than silently re-applied. SUSPENDED is terminal on this axis.
  - priority: 45
    category: state
    check: "DocumentCustodian.status == APPROVED."
    error_id: ERR_CUSTODIAN_INVALID_STATE
    http_status: 409
    applies_to:
      - "POST /custodians/{id}/suspend"
    description: |
      SUSPENDED is terminal for a DocumentCustodian, so a second suspend is rejected rather
      than re-stamping the row.

  # ---- Tier K: segregation of duties on approval-type actions ----------------
  # Deliberately ranked LAST so that the cheaper cardinality and state checks
  # above short-circuit first: an approve of a rate-less facility by its own
  # creator returns ERR_NO_ADVANCE_RATES_CONFIGURED (priority 31), not this rule.
  - priority: 46
    category: business_safety
    check: |
      The acting X-User-ID differs from the recorded originator of the same workflow step.
      The comparand depends on the endpoint: POST /facilities/{id}/approve compares against
      WarehouseFacility.created_by_user_id, and POST /margin-calls/{id}/waive compares
      against MarginCall.issued_by_user_id. The rule is SKIPPED when the comparand is null,
      which is exactly the case for every system-issued MarginCall.
    error_id: ERR_DUAL_CONTROL_VIOLATION
    http_status: 409
    applies_to:
      - "POST /facilities/{id}/approve"
      - "POST /margin-calls/{id}/waive"
    description: |
      The second and third segregation-of-duties gates (the first is priority 21 on
      POST /advances/{id}/fund). All three are user-identity rules rather than role rules:
      a single CreditOfficer cannot both open a facility and approve it, nor both raise a
      manual margin call and waive it.

# =============================================================================
# §1.5 API Endpoint Table
#
# Flat topology: every collection is addressed absolutely from the root, so
# api_prefix is "/". Paths are written exactly as clients call them.
# =============================================================================
endpoints:

  # ---- Facility lifecycle ----------------------------------------------------
  - method: POST
    path: /facilities
    roles: [CreditOfficer]
    input:
      - borrower_legal_name
      - committed_amount_cents
      - wet_sublimit_cents
      - aged_sublimit_cents
      - scratch_and_dent_sublimit_cents
      - min_tangible_net_worth_cents
      - min_liquidity_cents
      - min_ttm_net_income_cents
      - max_investor_concentration_pct
      - "bailee_period_days?"
      - unused_line_fee_rate
      - settlement_account_last4
    output: WarehouseFacility
    success_code: 201
    description: "Book a new warehouse facility in PENDING_APPROVAL."
    side_effects:
      - "status = PENDING_APPROVAL; created_by_user_id = X-User-ID; last_accrual_at = null"
      - "all six computed rollups initialise to 0; availability_cents = committed_amount_cents"

  - method: GET
    path: /facilities
    roles: [CreditOfficer, CollateralAnalyst]
    input: ["status?", "limit?", "offset?"]
    output: WarehouseFacility[]
    success_code: 200
    description: "Paginated facility list, optionally filtered by status."
    side_effects: []

  - method: GET
    path: /facilities/{id}
    roles: [CreditOfficer, CollateralAnalyst, WireOperator, Borrower]
    input: []
    output: WarehouseFacility
    success_code: 200
    description: "Read one facility including every computed rollup and the current version."
    side_effects: ["facility_exposure_rollup is projected fresh from the ledger on every read"]

  - method: POST
    path: /facilities/{id}/approve
    roles: [CreditOfficer]
    input: []
    output: WarehouseFacility
    success_code: 200
    description: "Approve a PENDING_APPROVAL facility; requires at least one ProductAdvanceRate row."
    side_effects:
      - "status -> ACTIVE; approved_by_user_id = X-User-ID; approved_at = logical clock"
      - "last_accrual_at = logical clock (fee accrual starts here)"
      - "version increments"

  - method: POST
    path: /facilities/{id}/suspend
    roles: [CreditOfficer]
    input: [reason]
    output: WarehouseFacility
    success_code: 200
    description: "Suspend an ACTIVE or RESTRICTED facility; new bookings stop immediately."
    side_effects:
      - "status -> SUSPENDED"
      - "every Advance of the facility in REQUESTED -> REJECTED with rejected_reason = FACILITY_SUSPENDED"
      - "every WireInstruction of those advances in PENDING_VERIFICATION -> BLOCKED with block_reason = FACILITY_SUSPENDED"
      - "version increments"

  - method: POST
    path: /facilities/{id}/reinstate
    roles: [CreditOfficer]
    input: []
    output: WarehouseFacility
    success_code: 200
    description: "Return a SUSPENDED facility to ACTIVE once no margin call is open and no covenant test is in BREACH."
    side_effects:
      - "status -> ACTIVE; consecutive_breach_count resets to 0"
      - "version increments"

  # ---- Product advance rates -------------------------------------------------
  - method: POST
    path: /facilities/{id}/product-advance-rates
    roles: [CreditOfficer]
    input:
      - product_code
      - advance_rate
      - "wet_funding_allowed?"
      - "wet_haircut?"
      - dwell_limit_days
      - "aging_step_days?"
      - "curtailment_step_rate?"
      - "product_sublimit_cents?"
    output: ProductAdvanceRate
    success_code: 201
    description: "Configure the advance rate, wet haircut and aging schedule for one product code. Only while the facility is PENDING_APPROVAL."
    side_effects: ["product_sublimit_cents defaults to null (no per-product cap)"]

  - method: GET
    path: /facilities/{id}/product-advance-rates
    roles: [CreditOfficer, CollateralAnalyst, Borrower]
    input: ["limit?", "offset?"]
    output: ProductAdvanceRate[]
    success_code: 200
    description: "List the facility's configured advance-rate rows."
    side_effects: []

  # ---- Document custodians ---------------------------------------------------
  - method: POST
    path: /facilities/{id}/custodians
    roles: [CreditOfficer]
    input: [custodian_name, "wet_receipt_deadline_hours?"]
    output: DocumentCustodian
    success_code: 201
    description: "Register a document custodian on the facility in APPROVED status."
    side_effects: ["status = APPROVED"]

  - method: GET
    path: /facilities/{id}/custodians
    roles: [CreditOfficer, CollateralAnalyst]
    input: ["status?", "limit?", "offset?"]
    output: DocumentCustodian[]
    success_code: 200
    description: "List the facility's custodians."
    side_effects: []

  - method: GET
    path: /custodians/{id}
    roles: [CreditOfficer, CollateralAnalyst, Custodian]
    input: []
    output: DocumentCustodian
    success_code: 200
    description: "Read one custodian."
    side_effects: []

  - method: POST
    path: /custodians/{id}/suspend
    roles: [CreditOfficer]
    input: [reason]
    output: DocumentCustodian
    success_code: 200
    description: "Suspend a custodian; it can no longer take new collateral or issue receipts."
    side_effects: ["status -> SUSPENDED; version increments"]

  - method: GET
    path: /custodians/{id}/receipts
    roles: [CreditOfficer, CollateralAnalyst, Custodian]
    input: ["status?", "limit?", "offset?"]
    output: CustodianReceipt[]
    success_code: 200
    description: "Every receipt this custodian has issued, across advances."
    side_effects: []

  # ---- Take-out investors ----------------------------------------------------
  - method: POST
    path: /facilities/{id}/investors
    roles: [CreditOfficer]
    input: [investor_name, counterparty_rating, concentration_limit_pct]
    output: TakeoutInvestor
    success_code: 201
    description: "Add a take-out investor to the facility's approved-investor list in PENDING_APPROVAL status."
    side_effects: ["status = PENDING_APPROVAL; exposure_cents = 0"]

  - method: GET
    path: /facilities/{id}/investors
    roles: [CreditOfficer, CollateralAnalyst]
    input: ["status?", "limit?", "offset?"]
    output: TakeoutInvestor[]
    success_code: 200
    description: "List the facility's take-out investors."
    side_effects: []

  - method: GET
    path: /investors/{id}
    roles: [CreditOfficer, CollateralAnalyst, Investor]
    input: []
    output: TakeoutInvestor
    success_code: 200
    description: "Read one investor including live exposure_cents."
    side_effects: []

  - method: POST
    path: /investors/{id}/approve
    roles: [CreditOfficer]
    input: []
    output: TakeoutInvestor
    success_code: 200
    description: "Move a PENDING_APPROVAL investor to APPROVED so collateral may be shipped to it."
    side_effects: ["status -> APPROVED; approved_at = logical clock; version increments"]

  - method: POST
    path: /investors/{id}/suspend
    roles: [CreditOfficer]
    input: [reason]
    output: TakeoutInvestor
    success_code: 200
    description: "Suspend an APPROVED investor. Deepest cascade in the system."
    side_effects:
      - "status -> SUSPENDED"
      - "every OPEN or PARTIALLY_ALLOCATED InvestorCommitment of this investor -> WITHDRAWN"
      - "every Advance allocated to those commitments in {FUNDED, SHIPPED} is re-valued through eligible_collateral_valuation, which now caps effective_advance_rate at ORPHAN_RATE"
      - "each such advance with required_paydown_cents > 0 gets a MarginCall (trigger_reason = COMMITMENT_WITHDRAWN, status ISSUED)"
      - "when at least one MarginCall was issued and facility.status == ACTIVE, facility -> RESTRICTED"
      - "every ISSUED BaileeLetter naming this investor -> REVOKED"

  - method: GET
    path: /investors/{id}/commitments
    roles: [CreditOfficer, CollateralAnalyst, Investor]
    input: ["status?", "limit?", "offset?"]
    output: InvestorCommitment[]
    success_code: 200
    description: "Every commitment this investor has issued on the facility."
    side_effects: []

  - method: GET
    path: /investors/{id}/bailee-letters
    roles: [CreditOfficer, CollateralAnalyst, Investor]
    input: ["status?", "limit?", "offset?"]
    output: BaileeLetter[]
    success_code: 200
    description: "Every bailee letter naming this investor as bailee."
    side_effects: []

  # ---- Investor commitments --------------------------------------------------
  - method: POST
    path: /facilities/{id}/commitments
    roles: [CreditOfficer]
    input: [investor_id, product_code, committed_amount_cents, price_pct, effective_on, expires_on]
    output: InvestorCommitment
    success_code: 201
    description: "Record a take-out commitment (forward purchase window) from an APPROVED investor."
    side_effects:
      - "status = OPEN; allocated_amount_cents = 0; settled_amount_cents = 0"
      - "remaining_amount_cents = committed_amount_cents"

  - method: GET
    path: /facilities/{id}/commitments
    roles: [CreditOfficer, CollateralAnalyst, Borrower]
    input: ["status?", "investor_id?", "limit?", "offset?"]
    output: InvestorCommitment[]
    success_code: 200
    description: "List the facility's commitments."
    side_effects: []

  - method: GET
    path: /commitments/{id}
    roles: [CreditOfficer, CollateralAnalyst, Investor]
    input: []
    output: InvestorCommitment
    success_code: 200
    description: "Read one commitment with its three capacity buckets."
    side_effects: []

  - method: POST
    path: /commitments/{id}/withdraw
    roles: [CreditOfficer, Investor]
    input: [reason]
    output: InvestorCommitment
    success_code: 200
    description: "Withdraw an OPEN or PARTIALLY_ALLOCATED commitment; allocated collateral becomes orphaned."
    side_effects:
      - "status -> WITHDRAWN; remaining_amount_cents -> 0"
      - "every Advance allocated to it in {FUNDED, SHIPPED} is re-valued at ORPHAN_RATE"
      - "each such advance with required_paydown_cents > 0 gets a MarginCall (trigger_reason = COMMITMENT_WITHDRAWN, status ISSUED)"
      - "facility -> RESTRICTED when at least one MarginCall was issued and the facility was ACTIVE"

  # ---- Advances --------------------------------------------------------------
  - method: POST
    path: /advances
    roles: [CollateralAnalyst, Borrower]
    input:
      - facility_id
      - custodian_id
      - product_code
      - loan_amount_cents
      - note_rate
      - funding_type
      - payee_name
      - payee_account_last4
      - payee_routing_last4
      - expected_facility_version
      - "investor_commitment_id?"
    output: Advance
    success_code: 201
    description: "Request an advance against one mortgage loan. Creates the paired wire instruction."
    side_effects:
      - "funding_status = REQUESTED; custody_status = PENDING_RECEIPT"
      - "market_value_cents initialises to loan_amount_cents"
      - "a WireInstruction is created in PENDING_VERIFICATION carrying the three payee_* values and a system callback_reference"
      - "no ledger entry and no exposure change yet — a REQUESTED advance is off-balance-sheet"
      - "WarehouseFacility.version increments — this endpoint is the write_endpoint of the §1.2.1 advance-create-stale-facility rule, so every booking invalidates any concurrently held facility token"

  - method: GET
    path: /advances
    roles: [CreditOfficer, CollateralAnalyst, Borrower]
    input:
      - "facility_id?"
      - "custodian_id?"
      - "investor_commitment_id?"
      - "funding_status?"
      - "custody_status?"
      - "is_aged?"
      - "limit?"
      - "offset?"
    output: Advance[]
    success_code: 200
    description: "Filtered, paginated advance list. Ordered by created_at ASC, id ASC as tie-break."
    side_effects: []

  - method: GET
    path: /advances/{id}
    roles: [CreditOfficer, CollateralAnalyst, WireOperator, Borrower, Custodian]
    input: []
    output: Advance
    success_code: 200
    description: "Read one advance with both state axes, the live valuation and dwell_days."
    side_effects: ["dwell_and_aging_classification and eligible_collateral_valuation are recomputed for the response"]

  - method: GET
    path: /advances/{id}/wire-instructions
    roles: [CreditOfficer, CollateralAnalyst, WireOperator]
    input: ["limit?", "offset?"]
    output: WireInstruction[]
    success_code: 200
    description: "The advance's wire instructions, newest last (created_at ASC)."
    side_effects: []

  - method: POST
    path: /wire-instructions/{id}/decision
    roles: [CollateralAnalyst, WireOperator]
    input: [decision, "callback_reference?", "block_reason?"]
    output: WireInstruction
    success_code: 200
    description: "Callback-verify or block a PENDING_VERIFICATION wire. decision is VERIFY or BLOCK."
    side_effects:
      - "decision == VERIFY: status -> VERIFIED, decided_by_user_id = X-User-ID"
      - "decision == BLOCK: status -> BLOCKED, block_reason = supplied value (default OPERATOR_BLOCK), decided_by_user_id = X-User-ID"
      - "version increments"

  - method: POST
    path: /advances/{id}/fund
    roles: [CollateralAnalyst, WireOperator]
    input: []
    output: Advance
    success_code: 200
    description: "Release the wire and put the advance on the facility. The five-stage sizing waterfall and the concentration solve run here."
    side_effects:
      - "advance_amount_determination and concentration_constrained_advance store provisional_advance_amount_cents, advance_amount_cents and concentration_capped"
      - "funding_status -> FUNDED; funded_at = logical clock"
      - "WET funding also sets wet_receipt_deadline_at = funded_at + custodian.wet_receipt_deadline_hours hours"
      - "a LedgerEntry { entry_type: ADVANCE_FUNDED, direction: DEBIT, amount_cents: advance_amount_cents } is appended"
      - "eligible_collateral_valuation runs; a positive required_paydown_cents at funding is impossible by construction, so no margin call is issued here"
      - "the paired WireInstruction VERIFIED -> RELEASED (terminal)"
      - "the named InvestorCommitment's allocated_amount_cents increases by advance_amount_cents; OPEN -> PARTIALLY_ALLOCATED, and PARTIALLY_ALLOCATED -> FULLY_ALLOCATED when remaining_amount_cents reaches 0"
      - "TakeoutInvestor.exposure_cents and every facility rollup are re-projected"

  # ---- Custody -------------------------------------------------------------
  - method: POST
    path: /advances/{id}/receipts
    roles: [Custodian, CollateralAnalyst]
    input: [custodian_id, document_types, "exception_codes?"]
    output: CustodianReceipt
    success_code: 201
    description: "Custodian acknowledges the collateral file, clear or with exceptions."
    side_effects:
      - "exception_codes empty -> receipt status CLEAR and advance custody_status -> RECEIVED_CLEAR"
      - "exception_codes non-empty -> receipt status EXCEPTION and advance custody_status -> RECEIVED_EXCEPTION"
      - "eligible_collateral_valuation re-runs; for a FUNDED advance the wet haircut lifts on a clear receipt and the EXCEPTION_HAIRCUT applies on an exception receipt"
      - "a resulting required_paydown_cents > 0 issues a MarginCall (trigger_reason = CUSTODY_EXCEPTION, status ISSUED) and moves an ACTIVE facility to RESTRICTED"

  - method: GET
    path: /advances/{id}/receipts
    roles: [CreditOfficer, CollateralAnalyst, Custodian]
    input: ["limit?", "offset?"]
    output: CustodianReceipt[]
    success_code: 200
    description: "The advance's custodian receipts."
    side_effects: []

  - method: POST
    path: /receipts/{id}/cure
    roles: [Custodian, CollateralAnalyst]
    input: [cured_exception_codes]
    output: CustodianReceipt
    success_code: 200
    description: "Clear the outstanding document exceptions on an EXCEPTION receipt."
    side_effects:
      - "cured_exception_codes covering every exception_code -> receipt status CURED and advance custody_status -> EXCEPTION_CURED"
      - "a partial cure leaves both statuses unchanged and only appends to cured_exception_codes"
      - "on a full cure the EXCEPTION_HAIRCUT is removed and eligible_collateral_valuation re-runs"
      - "when the re-run drives required_paydown_cents to 0, every ISSUED or PARTIALLY_CURED MarginCall of this advance with trigger_reason CUSTODY_EXCEPTION -> CURED, and a RESTRICTED facility -> ACTIVE once no other open call and no unwaived BREACH remain"

  - method: POST
    path: /advances/{id}/valuation
    roles: [CollateralAnalyst]
    input: [market_value_cents, expected_advance_version]
    output: Advance
    success_code: 200
    description: "Mark the collateral to market. The single largest driver of margin calls."
    side_effects:
      - "market_value_cents is stored; eligible_collateral_valuation re-runs"
      - "required_paydown_cents > 0 AND the advance has no ISSUED or PARTIALLY_CURED MarginCall issues a MarginCall (trigger_reason = VALUATION_DECLINE, status ISSUED, call_amount_cents snapshot at this instant) and moves an ACTIVE facility to RESTRICTED; when an open call already exists the recomputed required_paydown_cents is stored but the existing call_amount_cents is left at its original snapshot"
      - "version increments"

  # ---- Shipment, purchase, repurchase ---------------------------------------
  - method: POST
    path: /advances/{id}/ship
    roles: [CollateralAnalyst]
    input: [investor_id]
    output: BaileeLetter
    success_code: 201
    description: "Ship the collateral file to the take-out investor under a bailee letter."
    side_effects:
      - "a BaileeLetter is created ISSUED with effective_from = logical clock, bailee_period_days copied from the facility and expires_at = effective_from + bailee_period_days days"
      - "funding_status FUNDED -> SHIPPED; shipped_at = logical clock (a SHIPPED advance may re-ship, which is the one self-loop)"
      - "custody_status RECEIVED_CLEAR or EXCEPTION_CURED -> RELEASED_TO_INVESTOR (terminal on the custody axis); a re-ship leaves it there"
      - "the commitment's allocated_amount_cents is unchanged — shipment moves documents, not money"

  - method: GET
    path: /advances/{id}/bailee-letters
    roles: [CreditOfficer, CollateralAnalyst, Investor]
    input: ["status?", "limit?", "offset?"]
    output: BaileeLetter[]
    success_code: 200
    description: "The advance's bailee letters in created_at ASC order."
    side_effects: []

  - method: POST
    path: /advances/{id}/purchase
    roles: [CollateralAnalyst, Investor]
    input: ["proceeds_reference?"]
    output: Advance
    success_code: 200
    description: "Investor purchases the loan; proceeds pay the advance down to zero."
    side_effects:
      - "a LedgerEntry { entry_type: INVESTOR_PROCEEDS, direction: CREDIT, amount_cents: outstanding_balance_cents } is appended, so the advance's outstanding_balance_cents becomes exactly 0"
      - "funding_status -> PURCHASED (terminal); purchased_at = logical clock"
      - "the advance's ISSUED BaileeLetter -> HONORED"
      - "the commitment moves the amount from allocated_amount_cents to settled_amount_cents; status stays PARTIALLY_ALLOCATED when remaining capacity is still positive"
      - "TakeoutInvestor.exposure_cents drops by the settled advance amount"
      - "any ISSUED or PARTIALLY_CURED MarginCall whose advance_id is this advance -> CURED"

  - method: POST
    path: /advances/{id}/repurchase
    roles: [CollateralAnalyst, Borrower]
    input: [payment_amount_cents]
    output: Advance
    success_code: 200
    description: "Borrower repurchases ineligible collateral off the line at par outstanding."
    side_effects:
      - "a LedgerEntry { entry_type: REPURCHASE, direction: CREDIT, amount_cents: payment_amount_cents } is appended"
      - "funding_status -> REPURCHASED (terminal)"
      - "every ISSUED BaileeLetter of this advance -> REVOKED"
      - "every OPEN or ESCALATED RepurchaseDemand of this advance -> SATISFIED"
      - "any ISSUED or PARTIALLY_CURED MarginCall whose advance_id is this advance -> CURED"
      - "the commitment releases the allocation back to remaining_amount_cents; investor exposure drops"

  - method: POST
    path: /advances/{id}/repurchase-demands
    roles: [CreditOfficer, Investor]
    input: [reason]
    output: RepurchaseDemand
    success_code: 201
    description: "Demand repurchase of ineligible collateral (reason: DWELL_EXCEEDED, CUSTODY_EXCEPTION_UNCURED, BAILEE_EXPIRED, INVESTOR_SUSPENDED, INELIGIBLE_PRODUCT)."
    side_effects:
      - "status = OPEN; demand_amount_cents = advance.outstanding_balance_cents; deadline_at = logical clock + 10 days"

  - method: GET
    path: /advances/{id}/repurchase-demands
    roles: [CreditOfficer, CollateralAnalyst, Investor]
    input: ["status?", "limit?", "offset?"]
    output: RepurchaseDemand[]
    success_code: 200
    description: "The advance's repurchase demands."
    side_effects: []

  - method: POST
    path: /repurchase-demands/{id}/escalate
    roles: [CreditOfficer]
    input: []
    output: RepurchaseDemand
    success_code: 200
    description: "Escalate an unsatisfied OPEN demand."
    side_effects:
      - "status -> ESCALATED; facility.escalated_demand_count increases"
      - "when escalated_demand_count reaches 2 an ACTIVE facility -> RESTRICTED"

  # ---- Margin calls ----------------------------------------------------------
  - method: POST
    path: /margin-calls
    roles: [CreditOfficer]
    input: [facility_id, trigger_reason, "advance_id?", "cure_days?"]
    output: MarginCall
    success_code: 201
    description: "Issue a margin call manually. advance_id null means a facility-level call. cure_days defaults to DEFAULT_CURE_DAYS (2)."
    side_effects:
      - "call_amount_cents from margin_call_amount; cured_amount_cents = 0; status = ISSUED"
      - "issued_at = logical clock; cure_deadline_at = issued_at + cure_days days; issued_by_user_id = X-User-ID"
      - "an ACTIVE facility -> RESTRICTED"

  - method: GET
    path: /facilities/{id}/margin-calls
    roles: [CreditOfficer, CollateralAnalyst, Borrower]
    input: ["status?", "trigger_reason?", "limit?", "offset?"]
    output: MarginCall[]
    success_code: 200
    description: "Every margin call on the facility, created_at ASC."
    side_effects: []

  - method: GET
    path: /advances/{id}/margin-calls
    roles: [CreditOfficer, CollateralAnalyst]
    input: ["status?", "limit?", "offset?"]
    output: MarginCall[]
    success_code: 200
    description: "Margin calls attributable to one advance."
    side_effects: []

  - method: GET
    path: /margin-calls/{id}
    roles: [CreditOfficer, CollateralAnalyst, Borrower]
    input: []
    output: MarginCall
    success_code: 200
    description: "Read one margin call including cured_amount_cents and version."
    side_effects: []

  - method: POST
    path: /margin-calls/{id}/cure-payments
    roles: [Borrower, CollateralAnalyst]
    input: [amount_cents, expected_margin_call_version]
    output: CurePayment
    success_code: 201
    description: "Post a cure payment through the two-bucket waterfall with pro-rata principal allocation."
    side_effects:
      - "cure_payment_waterfall computes applied_to_fees_cents, applied_to_principal_cents and principal_allocation"
      - "one FEE_PAYMENT CREDIT entry when fees were paid, plus one CURE_PRINCIPAL CREDIT entry per allocated advance"
      - "MarginCall.cured_amount_cents increases; status -> PARTIALLY_CURED or CURED; MarginCall.version increments"
      - "when the call reaches CURED and the facility has no other open call and no breached covenant test, a RESTRICTED facility -> ACTIVE"

  - method: GET
    path: /margin-calls/{id}/cure-payments
    roles: [CreditOfficer, CollateralAnalyst, Borrower]
    input: ["limit?", "offset?"]
    output: CurePayment[]
    success_code: 200
    description: "Immutable cure-payment history for one call, created_at ASC."
    side_effects: []

  - method: POST
    path: /margin-calls/{id}/waive
    roles: [CreditOfficer]
    input: [reason]
    output: MarginCall
    success_code: 200
    description: "Waive an ISSUED or PARTIALLY_CURED margin call."
    side_effects:
      - "status -> WAIVED; waived_by_user_id = X-User-ID"
      - "a MARGIN_CALL_WAIVED LedgerEntry (direction CREDIT, amount_cents = the uncured obligation) is appended for audit and is excluded from both ledger sums"
      - "a RESTRICTED facility -> ACTIVE when nothing else is outstanding"

  # ---- Covenants -------------------------------------------------------------
  - method: POST
    path: /facilities/{id}/covenant-tests
    roles: [CreditOfficer, Borrower]
    input: [period_end, tangible_net_worth_cents, liquidity_cents, net_income_cents]
    output: CovenantTest
    success_code: 201
    description: "Certify a quarter's covenant package. The profitability test is dual-variant."
    side_effects:
      - "covenant_evaluation stores profitability_variant, profitability_metric_cents, sorted breach_codes and status"
      - "certified_by_user_id = X-User-ID"
      - "status BREACH: facility.consecutive_breach_count increases; an ACTIVE facility -> RESTRICTED"
      - "status BREACH at consecutive_breach_count >= 2: facility -> SUSPENDED, every REQUESTED advance -> REJECTED with rejected_reason = FACILITY_SUSPENDED, and their PENDING_VERIFICATION wires -> BLOCKED with block_reason = FACILITY_SUSPENDED"
      - "status BREACH also issues a facility-level MarginCall (trigger_reason = COVENANT_BREACH) sized at COVENANT_BREACH_PAYDOWN_PCT of outstanding, when that amount is positive"
      - "status PASS resets consecutive_breach_count to 0"

  - method: GET
    path: /facilities/{id}/covenant-tests
    roles: [CreditOfficer, CollateralAnalyst, Borrower]
    input: ["status?", "limit?", "offset?"]
    output: CovenantTest[]
    success_code: 200
    description: "Covenant test history ordered by period_end ASC."
    side_effects: []

  - method: POST
    path: /covenant-tests/{id}/waive
    roles: [CreditOfficer]
    input: [reason]
    output: CovenantTest
    success_code: 200
    description: "Waive a BREACH test. The waived test still counts as a prior for variant selection and the TTM sum."
    side_effects:
      - "status -> WAIVED; waived_by_user_id = X-User-ID"
      - "facility.last_covenant_status = WAIVED and facility.consecutive_breach_count resets to 0"
      - "every COVENANT_BREACH MarginCall of this facility still ISSUED or PARTIALLY_CURED -> WAIVED"
      - "a RESTRICTED facility -> ACTIVE once no other open margin call and no escalated demand remain"
      - "the waiver does NOT remove the test from covenant_evaluation's prior set"

  # ---- Batch job, ledger, reporting -----------------------------------------
  - method: POST
    path: /facilities/{id}/aging-run
    roles: [CreditOfficer, CollateralAnalyst]
    input: []
    output: "{ facility_id: string, run_at: string, advances_evaluated: integer, curtailed_advance_ids: array, margin_calls_issued: integer, bailee_letters_expired: integer, receipts_overdue: integer, repurchase_demands_raised: integer, fee_accrual_cents: integer, accrual_days: integer }"
    success_code: 200
    description: "The nightly batch. Idempotent within a single logical-clock instant: a second run at the same clock value accrues 0 fees and issues no duplicate margin call."
    side_effects:
      - "dwell_and_aging_classification refreshes dwell_days and is_aged for every FUNDED or SHIPPED advance"
      - "eligible_collateral_valuation re-runs; each advance whose required_paydown_cents > 0 and which has no ISSUED or PARTIALLY_CURED margin call yet receives one (trigger_reason = DWELL_EXCEEDED)"
      - "every ISSUED BaileeLetter whose expires_at <= logical clock -> EXPIRED, and each such advance gets a RepurchaseDemand (reason = BAILEE_EXPIRED)"
      - "every WET advance in PENDING_RECEIPT past wet_receipt_deadline_at -> custody_status RECEIPT_OVERDUE"
      - "every OPEN InvestorCommitment whose expires_on is strictly before the clock date -> EXPIRED"
      - "every ISSUED or PARTIALLY_CURED MarginCall whose cure_deadline_at <= logical clock -> DEFAULTED, and a RESTRICTED facility then -> SUSPENDED"
      - "facility_fee_accrual appends at most one FEE_ACCRUAL DEBIT entry and advances last_accrual_at"
      - "an ACTIVE facility with at least one newly issued margin call -> RESTRICTED"

  - method: GET
    path: /facilities/{id}/ledger-entries
    roles: [CreditOfficer, CollateralAnalyst, Borrower]
    input: ["entry_type?", "direction?", "advance_id?", "limit?", "offset?"]
    output: LedgerEntry[]
    success_code: 200
    description: "Append-only facility ledger in posted_at ASC, created_at ASC order."
    side_effects: []

  - method: GET
    path: /advances/{id}/ledger-entries
    roles: [CreditOfficer, CollateralAnalyst]
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    success_code: 200
    description: "The ledger entries attributed to one advance."
    side_effects: []

  - method: GET
    path: /facilities/{id}/exposure-summary
    roles: [CreditOfficer, CollateralAnalyst, Borrower]
    input: []
    output: "{ facility_id: string, committed_amount_cents: integer, outstanding_principal_cents: integer, availability_cents: integer, accrued_fee_balance_cents: integer, wet_outstanding_cents: integer, aged_outstanding_cents: integer, scratch_and_dent_outstanding_cents: integer, ledger_debit_total_cents: integer, ledger_credit_total_cents: integer, advance_outstanding_sum_cents: integer, investor_exposures: array, open_margin_call_count: integer }"
    success_code: 200
    description: "Reconciliation view: exposes both sides of the two conservation invariants so they can be asserted in one call."
    side_effects: ["facility_exposure_rollup is projected from the full ledger"]

  # ---- Logical clock (test harness) -----------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [CreditOfficer, CollateralAnalyst, WireOperator, Borrower, Custodian, Investor]
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    success_code: 200
    description: |
      Sets the server's logical clock. MANDATORY server default before any call:
      2026-08-01T00:00:00Z. Every datetime the system writes and every dwell, deadline,
      expiry and accrual comparison reads this clock, never the wall clock. Auth headers
      are not required on this endpoint.
    side_effects: ["no business state changes; nothing is recomputed until the next business call"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- 401 / 403 -------------------------------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    when: "X-User-ID or X-User-Role absent or empty on any endpoint other than POST /_clock/set_current_utc."
  - id: ERR_UNAUTHORIZED
    http_status: 403
    when: "X-User-Role is not in the endpoint's §1.5 roles, or an entity-backed role's X-User-ID does not resolve to a row of its backing entity."

  # ---- 404 -------------------------------------------------------------------
  - id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    when: "A /facilities/{id} path id, or a body facility_id, does not resolve."
  - id: ERR_ADVANCE_NOT_FOUND
    http_status: 404
    when: "An /advances/{id} path id, or a body advance_id on POST /margin-calls, does not resolve."
  - id: ERR_INVESTOR_NOT_FOUND
    http_status: 404
    when: "An /investors/{id} path id, or a body investor_id on POST /facilities/{id}/commitments or POST /advances/{id}/ship, does not resolve (or belongs to another facility)."
  - id: ERR_CUSTODIAN_NOT_FOUND
    http_status: 404
    when: "A /custodians/{id} path id, or a body custodian_id, does not resolve or belongs to another facility."
  - id: ERR_COMMITMENT_NOT_FOUND
    http_status: 404
    when: "A /commitments/{id} path id, or a body investor_commitment_id, does not resolve or belongs to another facility."
  - id: ERR_MARGIN_CALL_NOT_FOUND
    http_status: 404
    when: "A /margin-calls/{id} path id does not resolve."
  - id: ERR_WIRE_INSTRUCTION_NOT_FOUND
    http_status: 404
    when: "A /wire-instructions/{id} path id does not resolve."
  - id: ERR_RECEIPT_NOT_FOUND
    http_status: 404
    when: "A /receipts/{id} path id does not resolve."
  - id: ERR_COVENANT_TEST_NOT_FOUND
    http_status: 404
    when: "A /covenant-tests/{id} path id does not resolve."
  - id: ERR_REPURCHASE_DEMAND_NOT_FOUND
    http_status: 404
    when: "A /repurchase-demands/{id} path id does not resolve."
  - id: ERR_RESOURCE_MISMATCH
    http_status: 404
    when: "An entity-backed caller (Borrower, Custodian, Investor) addresses a row outside its own aggregate. Returned as 404 so existence is not disclosed."

  # ---- 422 schema / configuration -------------------------------------------
  - id: ERR_VALIDATION
    http_status: 422
    when: "Missing required body field, wrong type, unknown enum member, non-positive *_cents, rate outside [0,1], malformed date, pagination limit outside [1,100] or negative offset."
  - id: ERR_ADVANCE_RATE_NOT_CONFIGURED
    http_status: 422
    when: "POST /advances names a product_code with no ProductAdvanceRate row on the facility."

  # ---- 412 optimistic concurrency -------------------------------------------
  - id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    when: "POST /advances supplies an expected_facility_version that is not the facility's current version."
  - id: ERR_STALE_MARGIN_CALL_VERSION
    http_status: 412
    when: "POST /margin-calls/{id}/cure-payments supplies an expected_margin_call_version that is not the call's current version."
  - id: ERR_STALE_ADVANCE_VERSION
    http_status: 412
    when: "POST /advances/{id}/valuation supplies an expected_advance_version that is not the advance's current version."

  # ---- 409 own-entity state -------------------------------------------------
  - id: ERR_FACILITY_INVALID_STATE
    http_status: 409
    when: "approve on a non-PENDING_APPROVAL facility, suspend on a SUSPENDED facility, reinstate on a non-SUSPENDED facility, or a product-advance-rate added after approval."
  - id: ERR_FACILITY_NOT_ACTIVE
    http_status: 409
    when: "A booking endpoint (POST /advances, fund, commitments, investors, custodians) is called while the facility is PENDING_APPROVAL, RESTRICTED or SUSPENDED."
  - id: ERR_ADVANCE_INVALID_STATE
    http_status: 409
    when: "The advance's funding_status does not permit the trigger; includes every trigger against a PURCHASED, REPURCHASED or REJECTED advance."
  - id: ERR_CUSTODY_INVALID_STATE
    http_status: 409
    when: "A receipt against an advance not in PENDING_RECEIPT or RECEIPT_OVERDUE, or a cure against a receipt not in EXCEPTION."
  - id: ERR_WIRE_INSTRUCTION_NOT_PENDING
    http_status: 409
    when: "A decision on an already VERIFIED or BLOCKED wire."
  - id: ERR_MARGIN_CALL_NOT_OPEN
    http_status: 409
    when: "A cure payment or waiver against a margin call whose status is CURED, WAIVED or DEFAULTED."
  - id: ERR_COMMITMENT_NOT_ACTIVE
    http_status: 409
    when: "Withdrawing a commitment whose status is WITHDRAWN, EXPIRED or FULLY_ALLOCATED."
  - id: ERR_COVENANT_TEST_NOT_BREACHED
    http_status: 409
    when: "Waiving a covenant test whose status is PASS or already WAIVED."
  - id: ERR_REPURCHASE_DEMAND_NOT_OPEN
    http_status: 409
    when: "Escalating a demand that is ESCALATED or SATISFIED."
  - id: ERR_INVESTOR_INVALID_STATE
    http_status: 409
    when: "Approving a TakeoutInvestor that is not PENDING_APPROVAL, or suspending one that is not APPROVED."
  - id: ERR_CUSTODIAN_INVALID_STATE
    http_status: 409
    when: "Suspending a DocumentCustodian that is already SUSPENDED."
  - id: ERR_OPEN_MARGIN_CALL
    http_status: 409
    when: "Reinstating a facility while any MarginCall is ISSUED or PARTIALLY_CURED, or any CovenantTest is in BREACH."
  - id: ERR_DUPLICATE_ADVANCE_RATE
    http_status: 409
    when: "A second ProductAdvanceRate row with the same product_code on one facility."
  - id: ERR_DUPLICATE_COVENANT_PERIOD
    http_status: 409
    when: "A second CovenantTest with the same period_end on one facility."

  # ---- 409 / 422 wire-fraud, dual control, custody --------------------------
  - id: ERR_WIRE_NOT_VERIFIED
    http_status: 409
    when: "POST /advances/{id}/fund while the paired WireInstruction is PENDING_VERIFICATION or BLOCKED."
  - id: ERR_PAYEE_ACCOUNT_MISMATCH
    http_status: 422
    when: "A VERIFY decision, or a funding attempt, where WireInstruction.payee_account_last4 differs from the facility's settlement_account_last4."
  - id: ERR_DUAL_CONTROL_VIOLATION
    http_status: 409
    when: "POST /advances/{id}/fund by the same X-User-ID that verified the wire."
  - id: ERR_CUSTODY_RECEIPT_REQUIRED
    http_status: 409
    when: "DRY funding attempted while custody_status is PENDING_RECEIPT, RECEIPT_OVERDUE or RECEIVED_EXCEPTION."
  - id: ERR_BAILEE_LETTER_REQUIRED
    http_status: 409
    when: "POST /advances/{id}/purchase with no ISSUED bailee letter whose expires_at is strictly after the clock."
  - id: ERR_BAILEE_WINDOW_OVERLAP
    http_status: 422
    when: "A re-ship whose [effective_from, expires_at) window overlaps an ISSUED letter's; a shipment at exactly the prior expires_at is allowed."

  # ---- 422 referential and constraint --------------------------------------
  - id: ERR_INVESTOR_NOT_APPROVED
    http_status: 422
    when: "Shipping to, purchasing through, or committing from an investor whose status is PENDING_APPROVAL or SUSPENDED."
  - id: ERR_CUSTODIAN_NOT_ACTIVE
    http_status: 422
    when: "Assigning collateral to, or accepting a receipt from, a custodian whose status is SUSPENDED."
  - id: ERR_COMMITMENT_INVESTOR_MISMATCH
    http_status: 422
    when: "POST /advances/{id}/ship names an investor_id other than the advance's own commitment's investor_id."
  - id: ERR_WET_FUNDING_NOT_ALLOWED
    http_status: 422
    when: "funding_type WET on a product whose ProductAdvanceRate has wet_funding_allowed false."
  - id: ERR_NO_ADVANCE_RATES_CONFIGURED
    http_status: 422
    when: "POST /facilities/{id}/approve on a facility with zero ProductAdvanceRate rows."
  - id: ERR_CURE_PAYMENT_EXCEEDS_OBLIGATION
    http_status: 422
    when: "amount_cents exceeds accrued fees plus the call's remaining obligation."
  - id: ERR_MARGIN_CALL_AMOUNT_ZERO
    http_status: 422
    when: "A manual margin call whose computed call_amount_cents is 0."
  - id: ERR_REPURCHASE_AMOUNT_MISMATCH
    http_status: 422
    when: "payment_amount_cents differs from the advance's outstanding_balance_cents by even one cent."
  - id: ERR_ADVANCE_BELOW_MINIMUM
    http_status: 422
    when: "The post-cap advance amount is below MIN_ADVANCE_CENTS for a reason other than the concentration limit."
  - id: ERR_INVESTOR_CONCENTRATION_EXCEEDED
    http_status: 422
    when: "The concentration solve leaves less than MIN_ADVANCE_CENTS of room for the named investor, and hypothetical outstanding exceeds CONCENTRATION_FLOOR_CENTS."
  - id: ERR_COMMITMENT_WINDOW_CONFLICT
    http_status: 422
    when: "A new commitment's window, buffered by COMMITMENT_BUFFER_DAYS on each side, intersects the window of an existing OPEN or PARTIALLY_ALLOCATED commitment for the same investor."

  # ---- 422 fiscal ----------------------------------------------------------
  - id: ERR_FACILITY_AVAILABILITY_EXCEEDED
    http_status: 422
    when: "Funding with facility.availability_cents == 0."
  - id: ERR_WET_SUBLIMIT_EXCEEDED
    http_status: 422
    when: "WET funding with zero wet-bucket headroom."
  - id: ERR_AGED_SUBLIMIT_EXCEEDED
    http_status: 422
    when: "Funding while the facility's aged_outstanding_cents already exceeds aged_sublimit_cents."
  - id: ERR_SCRATCH_AND_DENT_SUBLIMIT_EXCEEDED
    http_status: 422
    when: "SCRATCH_AND_DENT funding with zero scratch-and-dent headroom."
  - id: ERR_PRODUCT_SUBLIMIT_EXCEEDED
    http_status: 422
    when: "Funding with zero headroom under the product's own product_sublimit_cents."
  - id: ERR_COMMITMENT_CAPACITY_EXCEEDED
    http_status: 422
    when: "Funding against a commitment whose remaining_amount_cents is 0."

# =============================================================================
# §1.7 RBAC Permission Matrix
#
# role_model: segregation_of_duties. The three lender-side roles are opaque
# operator identities; the three counterparty roles are entity-backed, so
# X-User-ID must resolve to a row of the backing entity and scopes every read.
# =============================================================================
roles:

  - name: CreditOfficer
    identity: opaque
    description: |
      Warehouse lending group credit authority. Owns facility approval, limit
      configuration, the approved-investor list, margin calls, covenant waivers and
      repurchase escalation. Cannot fund a wire or decide a wire instruction — that is the
      operational side of the wall.
    exclusive_operations:
      - "POST /facilities"
      - "POST /facilities/{id}/approve"
      - "POST /facilities/{id}/suspend"
      - "POST /facilities/{id}/reinstate"
      - "POST /facilities/{id}/product-advance-rates"
      - "POST /facilities/{id}/custodians"
      - "POST /custodians/{id}/suspend"
      - "POST /facilities/{id}/investors"
      - "POST /investors/{id}/approve"
      - "POST /investors/{id}/suspend"
      - "POST /facilities/{id}/commitments"
      - "POST /margin-calls"
      - "POST /margin-calls/{id}/waive"
      - "POST /covenant-tests/{id}/waive"
      - "POST /repurchase-demands/{id}/escalate"
    shared_operations:
      - "GET /facilities, GET /facilities/{id} and every facility sub-resource GET"
      - "POST /commitments/{id}/withdraw (with Investor)"
      - "POST /advances/{id}/repurchase-demands (with Investor)"
      - "POST /facilities/{id}/covenant-tests (with Borrower)"
      - "POST /facilities/{id}/aging-run (with CollateralAnalyst)"
      - "POST /_clock/set_current_utc"

  - name: CollateralAnalyst
    identity: opaque
    description: |
      Middle-office collateral operations. Values collateral, ships files under bailee
      letters, drives purchases and repurchases, and may verify or release wires — but not
      both for the same wire (priority 21). Cannot approve facilities or investors and
      cannot waive anything.
    exclusive_operations:
      - "POST /advances/{id}/valuation"
      - "POST /advances/{id}/ship"
    shared_operations:
      - "POST /advances (with Borrower)"
      - "POST /wire-instructions/{id}/decision (with WireOperator)"
      - "POST /advances/{id}/fund (with WireOperator)"
      - "POST /advances/{id}/receipts and POST /receipts/{id}/cure (with Custodian)"
      - "POST /advances/{id}/purchase (with Investor)"
      - "POST /advances/{id}/repurchase (with Borrower)"
      - "POST /margin-calls/{id}/cure-payments (with Borrower)"
      - "POST /facilities/{id}/aging-run (with CreditOfficer)"
      - "every read endpoint except the entity-backed-only scoping"
      - "POST /_clock/set_current_utc"

  - name: WireOperator
    identity: opaque
    description: |
      Treasury wire desk. Exists to make the four-eyes rule testable: it shares both
      POST /wire-instructions/{id}/decision and POST /advances/{id}/fund with
      CollateralAnalyst, so authorisation alone never guarantees the two steps were done by
      different people. Has no read access beyond the facility, the advance and the wire.
    exclusive_operations: []
    shared_operations:
      - "POST /wire-instructions/{id}/decision (with CollateralAnalyst)"
      - "POST /advances/{id}/fund (with CollateralAnalyst)"
      - "GET /facilities/{id}"
      - "GET /advances/{id}"
      - "GET /advances/{id}/wire-instructions"
      - "POST /_clock/set_current_utc"

  - name: Borrower
    identity: "entity_backed:WarehouseFacility"
    description: |
      The mortgage banker. X-User-ID must equal a WarehouseFacility.id; every read is
      scoped to that facility and a cross-facility read returns ERR_RESOURCE_MISMATCH.
      Requests advances, certifies covenants, cures margin calls and repurchases
      ineligible collateral.
    exclusive_operations: []
    shared_operations:
      - "POST /advances (with CollateralAnalyst)"
      - "POST /advances/{id}/repurchase (with CollateralAnalyst)"
      - "POST /margin-calls/{id}/cure-payments (with CollateralAnalyst)"
      - "POST /facilities/{id}/covenant-tests (with CreditOfficer)"
      - "GET /facilities/{id}, GET /advances, GET /advances/{id}"
      - "GET /facilities/{id}/{product-advance-rates,commitments,margin-calls,covenant-tests,ledger-entries,exposure-summary}"
      - "GET /margin-calls/{id} and GET /margin-calls/{id}/cure-payments"
      - "POST /_clock/set_current_utc"

  - name: Custodian
    identity: "entity_backed:DocumentCustodian"
    description: |
      Document custodian. X-User-ID must equal a DocumentCustodian.id. Issues and cures
      receipts and may read only the advances assigned to its own custodian row.
    exclusive_operations: []
    shared_operations:
      - "POST /advances/{id}/receipts (with CollateralAnalyst)"
      - "POST /receipts/{id}/cure (with CollateralAnalyst)"
      - "GET /custodians/{id}, GET /custodians/{id}/receipts"
      - "GET /advances/{id}, GET /advances/{id}/receipts"
      - "POST /_clock/set_current_utc"

  - name: Investor
    identity: "entity_backed:TakeoutInvestor"
    description: |
      Take-out investor. X-User-ID must equal a TakeoutInvestor.id. Purchases shipped
      loans, withdraws its own commitments, demands repurchase of defective collateral, and
      reads only its own commitments and bailee letters.
    exclusive_operations: []
    shared_operations:
      - "POST /advances/{id}/purchase (with CollateralAnalyst)"
      - "POST /commitments/{id}/withdraw (with CreditOfficer)"
      - "POST /advances/{id}/repurchase-demands (with CreditOfficer)"
      - "GET /investors/{id}, GET /investors/{id}/commitments, GET /investors/{id}/bailee-letters"
      - "GET /commitments/{id}"
      - "GET /advances/{id}/bailee-letters, GET /advances/{id}/repurchase-demands"
      - "POST /_clock/set_current_utc"
