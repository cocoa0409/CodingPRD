              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", vendor_id: "${vend_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev}/certificates"
              payload: { vendor_id: "${vend_id}", certificate_number: "CERT-1", issued_epoch: 5 }
              as: Metrologist
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /certificates/${cert_id}/verify"
              payload: {}
              as: Metrologist
              captures: { err: $.data.error_id }
          assert:
            - "verify response status code == 409"
            - "verify response data.error_id == ERR_EVENT_NOT_FINALIZED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: suspect_window_closed_inclusion
        grounds:
          - calculations.suspect_window
          - calculations.recall_exposure
          - entities.AffectedProduct.fields.in_suspect_window
        distinguishing_aspect: |
          Interval semantics A — CLOSED window [prior_cal_epoch, trigger_epoch] on
          the OutOfToleranceImpact/AffectedProduct resource: a product measured
          exactly at the trigger end-epoch is IN window (boundary inclusive),
          distinct from the half-open semantics used by the measured exposure basis.
        test_recipe:
          setup:
            - "Impact with window [10,30]; one product measured exactly at end-epoch 30."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-TO1", nist_test_number: "NIST-13", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-TO1", description: "TO1 gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "CRITICAL" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 10, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev_good: $.data.id }
            - call: "POST /calibration-events/${ev_good}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
            - call: "POST /calibration-events/${ev_good}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev_good}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { inst_v2: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 30, expected_instrument_version: "${inst_v2}" }
              as: Technician
              captures: { ev_bad: $.data.id }
            - call: "POST /calibration-events/${ev_bad}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.40, as_left_value: 25.40 }
              as: Technician
            - call: "POST /calibration-events/${ev_bad}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev_bad}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}/impacts"
              payload: {}
              as: QualityEngineer
              captures: { impact_id: "$.data[0].id" }
          trigger:
            - call: "POST /impacts/${impact_id}/affected-products"
              payload: { product_serial: "EDGE-30", measured_epoch: 30 }
              as: QualityEngineer
              captures: { inw: $.data.in_suspect_window }
          assert:
            - "AffectedProduct.in_suspect_window == true (measured at closed end-epoch 30)"

      - name: overdue_sweep_strict_less_than_window
        grounds:
          - calculations.next_due_epoch
          - state_machines.Instrument.calibration_status_to_OVERDUE
          - entities.Instrument.fields.next_due_epoch
        distinguishing_aspect: |
          Interval semantics B on a different resource (Instrument due/recall axis):
          OVERDUE fires only when next_due_epoch is STRICTLY LESS THAN the clock
          (next_due_epoch < current_epoch); at clock == next_due_epoch the
          instrument is still IN_TOLERANCE — strict-inequality geometry, distinct
          from the closed suspect window.
        test_recipe:
          setup:
            - "Instrument calibrated at epoch 5 with interval 10 → next_due_epoch 15; clock advanced to exactly 15, then to 16."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-TO2", nist_test_number: "NIST-14", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { by_epochs: 5 }
              as: QualityEngineer
            - call: "POST /instruments"
              payload: { asset_tag: "INST-TO2", description: "TO2 gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 10, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
            - call: "POST /_clock/advance"
              payload: { by_epochs: 10 }
              as: QualityEngineer
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { cs_at_due: $.data.calibration_status, ndue: $.data.next_due_epoch }
          trigger:
            - call: "POST /_clock/advance"
              payload: { by_epochs: 1 }
              as: QualityEngineer
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { cs_after: $.data.calibration_status }
          assert:
            - "Instrument.${inst_id}.next_due_epoch == 15"
            - "Instrument.${inst_id}.calibration_status == IN_TOLERANCE at clock == 15 (not OVERDUE at boundary)"
            - "Instrument.${inst_id}.calibration_status == OVERDUE at clock == 16 (strictly past due)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: open_oot_count_conserved_on_cancel
        grounds:
          - state_machines.OutOfToleranceImpact.OPEN_to_CANCELLED
          - state_machines.CalibrationEvent.IN_PROGRESS_to_FAILED
          - entities.Instrument.fields.open_oot_count
        distinguishing_aspect: |
          Conserved quantity #1 — Instrument.open_oot_count: a FAIL finalize
          (forward: +1) paired with its impact cancel (compensating: -1) MUST
          leave open_oot_count at its pre-failure value 0, pinned as
          open_oot_count == count(impacts WHERE status NOT IN {DISPOSITIONED, CANCELLED}).
        test_recipe:
          setup:
            - "Instrument with one FAILED event (open_oot_count becomes 1) then the impact CANCELLED."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-CI1", nist_test_number: "NIST-15", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-CI1", description: "CI1 gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "CRITICAL" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.40, as_left_value: 25.40 }
              as: Technician
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}/impacts"
              payload: {}
              as: QualityEngineer
              captures: { impact_id: "$.data[0].id" }
          trigger:
            - call: "POST /impacts/${impact_id}/cancel"
              payload: {}
              as: QualityEngineer
              captures: { st: $.data.status }
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { ooc: $.data.open_oot_count }
          assert:
            - "OutOfToleranceImpact.${impact_id}.status == CANCELLED"
            - "Instrument.${inst_id}.open_oot_count == 0 (restored to pre-failure value)"

      - name: affected_product_count_conserved_on_clear_disposition
        grounds:
          - state_machines.OutOfToleranceImpact.INVESTIGATING_to_DISPOSITIONED
          - entities.OutOfToleranceImpact.fields.affected_product_count
          - entities.OutOfToleranceImpact.fields.recalled_product_count
        distinguishing_aspect: |
          Conserved quantity #2 — product accounting on the impact: a USE_AS_IS
          disposition (non-recall) leaves affected_product_count unchanged while
          driving recalled_product_count to 0, pinning the invariant
          affected_product_count == count(CLEARED) + count(RECALLED) + count(FLAGGED)
          with recalled == 0 for non-recall dispositions (a different conserved
          quantity than open_oot_count).
        test_recipe:
          setup:
            - "Impact INVESTIGATING with two in-window affected products; dispositioned USE_AS_IS."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-CI2", nist_test_number: "NIST-16", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-CI2", description: "CI2 gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "CRITICAL" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              as_user_id: "tech-9"
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.40, as_left_value: 25.40 }
              as: Technician
              as_user_id: "tech-9"
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-9"
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
              as_user_id: "tech-9"
            - call: "GET /instruments/${inst_id}/impacts"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { impact_id: "$.data[0].id" }
            - call: "POST /impacts/${impact_id}/affected-products"
              payload: { product_serial: "U-A", measured_epoch: 2 }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /impacts/${impact_id}/affected-products"
              payload: { product_serial: "U-B", measured_epoch: 4 }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /impacts/${impact_id}/investigate"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
          trigger:
            - call: "POST /impacts/${impact_id}/disposition"
              payload: { disposition: "USE_AS_IS" }
              as: QualityEngineer
              as_user_id: "qe-2"
              captures: { apc: $.data.affected_product_count, rc: $.data.recalled_product_count }
          assert:
            - "OutOfToleranceImpact.${impact_id}.affected_product_count == 2 (unchanged)"
            - "OutOfToleranceImpact.${impact_id}.recalled_product_count == 0 (no recall on USE_AS_IS)"
            - "both AffectedProduct rows have status == CLEARED"
