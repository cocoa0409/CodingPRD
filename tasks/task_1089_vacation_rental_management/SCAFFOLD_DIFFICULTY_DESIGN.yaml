        distinguishing_aspect: "A billable-to-owner work order with cost_cents == 50000 has requires_owner_approval false; cost_cents == 50001 has it true — the OWNER_APPROVAL_THRESHOLD_CENTS boundary is strict '>', reached via POST /work-orders (a different metric and endpoint than the refund boundary)."
