  # ---------------------------------------------------------------------------
  # Rule 5 — validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_cancelled_run_complete
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_STOCKPILE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair state(5) vs business_fiscal(11): completing a CANCELLED
          run whose outputs (620 t) would exceed pile capacity (500 t) must
          return ERR_INVALID_STATE, not ERR_STOCKPILE_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Site OPERATING; fired shot -> muckpile; spec; stockpile capacity 500; certified belt scale; run created then CANCELLED from SCHEDULED"
