            - "${st_1} == \"REGISTRATION_CLOSED\" with ${ep_1} == 1"
            - "${st_2} == \"IN_PROGRESS\" with ${ep_2} == 2"
            - "${st_3} == \"COMPLETED\" with ${ep_3} == 3"
            - "${st_4} == \"COMPLETED\" with ${ep_4} == 4: phase 1 always increments the epoch even when phase 5 finds no admissible step"
            - "${v_4} == ${ed_v_open} + 4, one version increment per checkpoint"
