              captures: { e_ct: $.data.error_id }
          assert:
            - "${e_vessel} == ERR_VESSEL_NOT_FOUND, ${e_alloc} == ERR_ALLOCATION_NOT_FOUND, ${e_intake} == ERR_INTAKE_NOT_FOUND"
            - "${e_trial} == ERR_TRIAL_NOT_FOUND, ${e_wo} == ERR_WORK_ORDER_NOT_FOUND, ${e_line} == ERR_LINE_NOT_FOUND"
            - "${e_run} == ERR_RUN_NOT_FOUND, ${e_item} == ERR_DRY_GOODS_ITEM_NOT_FOUND, ${e_ttb} == ERR_TTB_REPORT_NOT_FOUND"
            - "${e_ro} == ERR_RELEASE_ORDER_NOT_FOUND, ${e_ct} == ERR_CONTRACT_NOT_FOUND"
            - "every one of the eleven responses carries HTTP 404"

