            - call: "POST /policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v2}" }
              as: Producer
              as_user_id: "${wp_id}"
              captures: { pol_v3: $.data.version }
            - call: "POST /policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v3}" }
              as: AccountManager
            - call: "POST /commission-statements"
              payload: { producer_id: "${wp_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-02-28T00:00:00Z" }
              as: TrustAccountant
              captures: { stmt_id: $.data.id, stmt_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /commission-statements/${stmt_id}/finalize"
              payload: { expected_commissionstatement_version: "${stmt_v}" }
              as: TrustAccountant
              captures: { stmt_v2: $.data.version, net: $.data.net_payable_cents }
          trigger:
            - call: "POST /commission-statements/${stmt_id}/pay"
              payload: { expected_commissionstatement_version: "${stmt_v2}", trust_account_id: "${trust_id}" }
              as: TrustAccountant
              captures: { err: $.data.error_id }
          assert:
            - "the statement net_payable_cents == 660000 (4000000 * 0.15 = 600000 agency, *1.10 tier = 660000, *1.0 split)"
            - "paying 660000 would drop balance to 340000 < minimum 500000; response error_id == ERR_TRUST_MINIMUM_BREACH"

      - name: license_overlap_violation
        claim_type: Temporal validation
        grounds:
          - "validations[priority=22]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / license_halfopen_interval_overlap_rejected
          rationale: "License interval-overlap rejection is the core assertion of the named §1.8 instance."

  # =================================================================
