# =============================================================================
# §1.9 Scaffold Corner Design — Drywall & Interior-Finish Stocking
# Breadth probe: enumerative coverage of every other testable claim from
# SCAFFOLD.yaml §1.1–§1.7 that §1.8 does not already cover.
# =============================================================================

scaffold_corner_design:
  # ------------------------------------------------------------------
  # Entities — creation, retrieval, defaults, type constraints
  # ------------------------------------------------------------------
  - section: entities
    instances:
      - name: contractor_account_create_returns_201_and_active_status
        claim_type: creation
        grounds: [entities.ContractorAccount, endpoints.POST_/supply/contractor-accounts]
        distinguishing_aspect: "Successful create returns 201 with the persisted record; status defaults to ACTIVE and ar_outstanding_cents to 0."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "New Co", credit_limit_cents: 100000, default_waste_pct_bp: 1500 }
              as: CreditManager
              captures: { acct_id: $.data.id, acct_status: $.data.status, acct_ar: $.data.ar_outstanding_cents }
          assert:
            - "captured acct_status == ACTIVE"
            - "captured acct_ar == 0"

      - name: product_create_rated_requires_positive_lead_time
        claim_type: creation
        grounds: [entities.Product, endpoints.POST_/supply/products]
        distinguishing_aspect: "FIRE_RATED / MOISTURE_RATED products require lead_time_days >= 1; a REGULAR product with lead_time_days=0 is accepted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "FIRE-4x8-5/8", board_kind: "FIRE_RATED", length_ft: 8, width_ft: 4, thickness_in: "5/8", sheets_per_bundle: 16, unit_price_cents_per_sheet: 2400, lead_time_days: 7 }
              as: WarehouseManager
              captures: { fire_id: $.data.id }
          assert:
            - "Product.${prod_id}.active == true"
            - "Product.${fire_id}.lead_time_days == 7"

      - name: project_create_requires_existing_account
        claim_type: parent_relationship
        grounds: [entities.Project, endpoints.POST_/supply/projects]
        distinguishing_aspect: "Project creation with a non-existent account_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /supply/projects"
              payload: { account_id: "00000000-0000-0000-0000-000000000000", jobsite_name: "Orphan", distance_miles: 10, framing_pct_complete: 0 }
              as: EstimatorUser
              captures: { err_id: $.data.error_id }
          assert:
            - "captured err_id == ERR_NOT_FOUND"

      - name: get_nonexistent_account_returns_404
        claim_type: not_found
        grounds: [entities.ContractorAccount, "endpoints.GET_/supply/contractor-accounts/{id}"]
        distinguishing_aspect: "GET on a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /supply/contractor-accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CreditManager
              captures: { err_id: $.data.error_id }
          assert:
            - "captured err_id == ERR_NOT_FOUND"

      - name: takeoff_defaults_base_sheet_count_zero
        claim_type: defaults
        grounds: [entities.Takeoff]
        distinguishing_aspect: "A newly created DRAFT takeoff has base_sheet_count == 0, billable_sheet_count == 0, quoted_subtotal_cents == 0, final_subtotal_cents == 0."
        test_recipe:
          setup:
            - "Account and project exist"
          setup_api_calls:
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Defaults Co", credit_limit_cents: 100000, default_waste_pct_bp: 1000 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_base: $.data.base_sheet_count, tk_billable: $.data.billable_sheet_count, tk_quoted: $.data.quoted_subtotal_cents }
          assert:
            - "captured tk_base == 0"
            - "captured tk_billable == 0"
            - "captured tk_quoted == 0"

      - name: payment_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment has common_fields: false; response exposes id and created_at but no version field and no update endpoint exists."
        test_recipe:
          setup:
            - "Stocked order with an issued draw (see recipe)"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Imm Co", credit_limit_cents: 5000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_v}" }
              as: EstimatorUser
            - call: "POST /supply/projects/${proj_id}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-01", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { truck_id: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord_id: $.data.id }
            - call: "POST /supply/stocking-orders/${ord_id}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 1 }
              as: DispatcherUser
            - call: "POST /supply/stocking-orders/${ord_id}/schedule"
              payload: {}
              as: DispatcherUser
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: CreditManager
            - call: "POST /supply/stocking-orders/${ord_id}/dispatch"
              payload: {}
              as: DispatcherUser
            - call: "POST /supply/stocking-orders/${ord_id}/mark-stocked"
              payload: {}
              as: Foreman
            - call: "GET /supply/draw-requests"
              payload: { project_id: "${proj_id}" }
              as: CreditManager
              captures: { draw_id: "$.data[0].id" }
          trigger:
            - call: "POST /supply/draw-requests/${draw_id}/payments"
              payload: { amount_cents: 5000, method: "ACH", received_at: "2026-08-03T00:00:00Z" }
              as: AccountsReceivableUser
              captures: { payment_id: $.data.id, payment_created: $.data.created_at }
          assert:
            - "Payment.${payment_id}.id is a UUID"
            - "Payment.${payment_id}.created_at is an ISO 8601 timestamp"
            - "Payment.${payment_id} does not expose a version field"

      - name: pagination_default_limit_and_offset
        claim_type: listing
        grounds: [response_envelope, endpoints.GET_/supply/products]
        distinguishing_aspect: "GET list endpoints accept limit/offset and honor defaults (limit=10, offset=0); response contains total_count and has_more."
        test_recipe:
          setup:
            - "Three products registered"
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "P-A", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1000, lead_time_days: 0 }
              as: WarehouseManager
            - call: "POST /supply/products"
              payload: { sku: "P-B", board_kind: "REGULAR", length_ft: 10, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 18, unit_price_cents_per_sheet: 1100, lead_time_days: 0 }
              as: WarehouseManager
            - call: "POST /supply/products"
              payload: { sku: "P-C", board_kind: "REGULAR", length_ft: 12, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 16, unit_price_cents_per_sheet: 1200, lead_time_days: 0 }
              as: WarehouseManager
          trigger:
            - call: "GET /supply/products"
              payload: {}
              as: WarehouseManager
          assert:
            - "response.meta contains api_request_id and api_request_timestamp"
            - "response.data is an array of length 3"

  # ------------------------------------------------------------------
  # State machines — invalid transitions, initial state, terminal lockdown
  # ------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: takeoff_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.Takeoff]
        distinguishing_aspect: "A newly created takeoff starts in DRAFT."
        test_recipe:
          setup:
            - "Account and project exist"
          setup_api_calls:
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Init Co", credit_limit_cents: 100000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_status: $.data.status }
          assert:
            - "captured tk_status == DRAFT"

      - name: terminal_state_lockdown_cancelled_takeoff_cannot_lock
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Takeoff]
        distinguishing_aspect: "A CANCELLED takeoff is terminal; POST /lock on it returns ERR_INVALID_STATE (or ERR_TAKEOFF_NOT_SUBMITTED)."
        test_recipe:
          setup:
            - "Takeoff T1 created, line added, submitted, then cancelled"
          setup_api_calls:
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Term Co", credit_limit_cents: 100000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/cancel"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_v: $.data.version }
          trigger:
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_v}" }
              as: EstimatorUser
              captures: { err_id: $.data.error_id }
          assert:
            - "captured err_id in {ERR_INVALID_STATE, ERR_TAKEOFF_NOT_SUBMITTED}"

      - name: invalid_transition_dispatch_from_draft
        claim_type: invalid_transition
        grounds: [state_machines.StockingOrder.DRAFT_to_DISPATCHED]
        distinguishing_aspect: "StockingOrder cannot jump from DRAFT directly to DISPATCHED; ERR_INVALID_STATE is returned."
        test_recipe:
          setup:
            - "Stocking order created in DRAFT (not yet scheduled)"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "IT Co", credit_limit_cents: 5000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_v}" }
              as: EstimatorUser
            - call: "POST /supply/projects/${proj_id}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-01", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { truck_id: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord_id: $.data.id }
            - call: "POST /supply/stocking-orders/${ord_id}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 1 }
              as: DispatcherUser
          trigger:
            - call: "POST /supply/stocking-orders/${ord_id}/dispatch"
              payload: {}
              as: DispatcherUser
              captures: { err_id: $.data.error_id }
          assert:
            - "captured err_id == ERR_INVALID_STATE"

      - name: precondition_enforcement_overpayment_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.DrawRequest, "errors[ERR_OVERPAYMENT]"]
        distinguishing_aspect: "Payment amount exceeding the draw's remaining balance is rejected with ERR_OVERPAYMENT."
        test_recipe:
          setup:
            - "Stocked order producing a draw of 39500 (= 30000 material + 9500 freight, REGULAR product 20 sheets/bundle @1500c, distance 10)"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "OP Co", credit_limit_cents: 5000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_v}" }
              as: EstimatorUser
            - call: "POST /supply/projects/${proj_id}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-01", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { truck_id: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord_id: $.data.id }
            - call: "POST /supply/stocking-orders/${ord_id}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 1 }
              as: DispatcherUser
            - call: "POST /supply/stocking-orders/${ord_id}/schedule"
              payload: {}
              as: DispatcherUser
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: CreditManager
            - call: "POST /supply/stocking-orders/${ord_id}/dispatch"
              payload: {}
              as: DispatcherUser
            - call: "POST /supply/stocking-orders/${ord_id}/mark-stocked"
              payload: {}
              as: Foreman
            - call: "GET /supply/draw-requests"
              payload: { project_id: "${proj_id}" }
              as: CreditManager
              captures: { draw_id: "$.data[0].id" }
          trigger:
            - call: "POST /supply/draw-requests/${draw_id}/payments"
              payload: { amount_cents: 99999, method: "ACH", received_at: "2026-08-03T00:00:00Z" }
              as: AccountsReceivableUser
              captures: { err_id: $.data.error_id }
          assert:
            - "captured err_id == ERR_OVERPAYMENT"

      - name: cascade_down_suspend_cancels_draft_takeoffs
        claim_type: cascade_down
        grounds: [state_machines.ContractorAccount.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Account suspension cascades: DRAFT takeoffs on the account's projects transition to CANCELLED."
        test_recipe:
          setup:
            - "Account with one DRAFT takeoff on its project"
          setup_api_calls:
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Casc Co", credit_limit_cents: 5000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
          trigger:
            - call: "POST /supply/contractor-accounts/${acct_id}/suspend"
              payload: {}
              as: CreditManager
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_status: $.data.status }
          assert:
            - "captured tk_status == CANCELLED"

      - name: takeoff_cancel_blocked_when_in_use
        claim_type: precondition_enforcement
        grounds: [state_machines.Takeoff.SUBMITTED_to_CANCELLED, "errors[ERR_TAKEOFF_IN_USE]"]
        distinguishing_aspect: "Cancelling a SUBMITTED takeoff that is referenced by a SCHEDULED stocking order is rejected with ERR_TAKEOFF_IN_USE."
        test_recipe:
          setup:
            - "Locked takeoff and a SCHEDULED stocking order referencing it"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "InUse Co", credit_limit_cents: 5000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
