# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# School Health Office & Nurse Records — breadth walk of the claim-extraction
# guide's nine sections against SCAFFOLD.yaml §1.1–§1.7.
# `excluded_because:` stubs cite an instance name in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Logical clock default: 2026-08-01T00:00:00Z (Saturday); 2026-08-03 is a Monday.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: school_creation_seeds_derived_fields_and_default_protocol_flag
        claim_type: creation
        grounds:
          - entities.School.fields.emergency_protocol_enabled
          - entities.School.fields.enrolled_student_count
          - entities.School.fields.occupied_cot_count
          - entities.School.fields.required_stock_units
          - entities.School.fields.coverage_posture
        distinguishing_aspect: "POST /health-office/schools without emergency_protocol_enabled returns 201 with that flag defaulted to true, all counters at 0, stock_protocol_status DEPLETED and coverage_posture UNCOVERED."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { now: $.data.current_utc }
          trigger:
            - call: "POST /health-office/schools"
              payload: { name: "Quincy Elementary", building_code: "QCY20", cot_capacity: 4 }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id, sch_v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "School.${sch_id}.emergency_protocol_enabled == true"
            - "School.${sch_id}.cot_capacity == 4"
            - "School.${sch_id}.enrolled_student_count == 0"
            - "School.${sch_id}.eligible_stock_student_count == 0"
            - "School.${sch_id}.base_required_units == 0"
            - "School.${sch_id}.surge_units == 0"
            - "School.${sch_id}.required_stock_units == 0"
            - "School.${sch_id}.occupied_cot_count == 0"
            - "School.${sch_id}.epinephrine_days_of_supply == 0.0"
            - "School.${sch_id}.albuterol_days_of_supply == 0.0"
            - "School.${sch_id}.stock_protocol_status == DEPLETED"
            - "School.${sch_id}.contracted_students_per_nurse_fte == null"
            - "School.${sch_id}.coverage_posture == UNCOVERED"
            - "School.${sch_id}.version == 1"

      - name: student_list_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Student
          - endpoints[GET /health-office/students]
        distinguishing_aspect: "GET /health-office/students with limit 2 / offset 0 returns exactly 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One School with exactly three ENROLLED students and nothing else."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Rivera Elementary", building_code: "RIV21", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Page One", grade_level: 1, date_of_birth: "2019-01-01T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { s1: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Page Two", grade_level: 2, date_of_birth: "2018-01-01T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { s2: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Page Three", grade_level: 3, date_of_birth: "2017-01-01T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { s3: $.data.id }
          trigger:
            - call: "GET /health-office/students"
              payload: { school_id: "${sch_id}", limit: 2, offset: 0 }
              as: DistrictHealthAdmin
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /health-office/students"
              payload: { school_id: "${sch_id}", limit: 2, offset: 2 }
              as: DistrictHealthAdmin
              captures: { second_page_head: "$.data[0].id" }
          assert:
            - "First page: response_type == array and len(data) == 2"
            - "First page: meta/pagination total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second page: len(data) == 1"
            - "Second page: total_count == 3, offset == 2, has_more == false"

      - name: screening_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Screening
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /health-office/screenings/{id} for a well-formed UUID that names no Screening row returns 404 ERR_RESOURCE_NOT_FOUND, not an empty 200 envelope."
        test_recipe:
          setup:
            - "Empty database; no Screening rows exist at all."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Sutton Elementary", building_code: "SUT22", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
          trigger:
            - call: "GET /health-office/screenings/00000000-0000-4000-8000-000000000123"
              payload: {}
              as: DistrictHealthAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response_type == error"
            - "data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: medication_authorization_missing_required_field_dose_unit_rejected
        claim_type: required_fields
        grounds:
          - entities.MedicationAuthorization.fields.dose_unit
          - validations[priority=5]
          - errors[ERR_MISSING_REQUIRED_FIELD]
        distinguishing_aspect: "POST /health-office/medication-authorizations omitting the non-optional dose_unit field returns 400 ERR_MISSING_REQUIRED_FIELD and persists no row."
        test_recipe:
          setup:
            - "One School, one RN and one ENROLLED student; no MedicationAuthorization rows yet."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Tucker Elementary", building_code: "TUC23", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Tess Marek", grade_level: 4, date_of_birth: "2016-03-03T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /health-office/medication-authorizations"
              payload: { student_id: "${stu_id}", medication_code: "ALBUTEROL", route: "INHALED", dose_amount: 2, schedule_type: "SCHEDULED", max_doses_per_day: 2, valid_from: "2026-07-01T00:00:00Z", valid_until: "2027-06-30T00:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_MISSING_REQUIRED_FIELD"
            - "GET /health-office/medication-authorizations?student_id=${stu_id} returns total_count == 0"

      - name: nurse_creation_defaults_delegation_and_seeds_conservation_counters
        claim_type: defaults
        grounds:
          - entities.Nurse.fields.delegation_authorized
          - entities.Nurse.fields.employment_status
          - entities.Nurse.fields.committed_weekly_minutes
          - entities.Nurse.fields.uncommitted_weekly_minutes
          - entities.Nurse.fields.assigned_school_count
        distinguishing_aspect: "POST /health-office/nurses omitting delegation_authorized stores false, sets employment_status ACTIVE, committed_weekly_minutes 0 and uncommitted_weekly_minutes equal to weekly_contracted_minutes."
        test_recipe:
          setup:
            - "Empty database; no coverage blocks exist for the new nurse."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Upton Elementary", building_code: "UPT24", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /health-office/nurses"
              payload: { full_name: "Uma Blaine", credential: "LPN", weekly_contracted_minutes: 1500 }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id, uncommitted: $.data.uncommitted_weekly_minutes }
          assert:
            - "HTTP status == 201"
            - "Nurse.${rn_id}.delegation_authorized == false"
            - "Nurse.${rn_id}.employment_status == ACTIVE"
            - "Nurse.${rn_id}.weekly_contracted_minutes == 1500"
            - "Nurse.${rn_id}.committed_weekly_minutes == 0"
            - "Nurse.${rn_id}.uncommitted_weekly_minutes == 1500"
            - "Nurse.${rn_id}.assigned_school_count == 0"
            - "Nurse.${rn_id}.version == 1"

      - name: coverage_assignment_duration_and_status_are_computed_from_clock
        claim_type: computed_fields
        grounds:
          - entities.CoverageAssignment.fields.duration_minutes
          - entities.CoverageAssignment.fields.status
          - endpoints[POST /health-office/_clock/set_current_utc]
        distinguishing_aspect: "duration_minutes is always end_minute - start_minute (330), and status is re-derived from the logical clock alone: SCHEDULED before effective_from, ACTIVE once the clock reaches it, ENDED once the clock reaches effective_to."
        test_recipe:
          setup:
            - "One School and one RN; one CoverageAssignment WED [540, 870) with effective_from 2026-09-01 and effective_to 2026-10-01."
            - "Logical clock starts at its 2026-08-01T00:00:00Z default, before effective_from."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Vance Elementary", building_code: "VAN25", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Vic Ramos", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "WED", start_minute: 540, end_minute: 870, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id, dur: $.data.duration_minutes, status_before: $.data.status }
          trigger:
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { t_mid: $.data.current_utc }
            - call: "GET /health-office/coverage-assignments/${cov_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { status_mid: $.data.status }
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { t_end: $.data.current_utc }
            - call: "GET /health-office/coverage-assignments/${cov_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { status_end: $.data.status }
          assert:
            - "CoverageAssignment.${cov_id}.duration_minutes == 330"
            - "At clock 2026-08-01T00:00:00Z: CoverageAssignment.${cov_id}.status == SCHEDULED"
            - "At clock 2026-09-15T00:00:00Z: CoverageAssignment.${cov_id}.status == ACTIVE"
            - "At clock 2026-10-01T00:00:00Z (effective_to is exclusive): CoverageAssignment.${cov_id}.status == ENDED"

      - name: student_alert_flags_computed_and_sorted_ascending_on_creation
        claim_type: computed_fields
        grounds:
          - entities.Student.fields.alert_flags
          - entities.Student.fields.intake_risk_score
          - entities.Student.fields.risk_tier
          - entities.Student.fields.active_action_plan_id
          - entities.Student.fields.self_carry_authorized
        distinguishing_aspect: "A student created with allergy_severity ANAPHYLAXIS and immunization_status NONCOMPLIANT gets alert_flags exactly ['ALLERGY_ANAPHYLAXIS', 'IMMUNIZATION_HOLD', 'NO_ACTIVE_PLAN'] in ascending order, intake_risk_score 60 and risk_tier CRITICAL."
        test_recipe:
          setup:
            - "One School with no nurses and no plans, so every new student starts with NO_ACTIVE_PLAN."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Whitman Elementary", building_code: "WHT26", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Wes Tobin", grade_level: 9, date_of_birth: "2011-05-05T00:00:00Z", allergy_severity: "ANAPHYLAXIS", chronic_condition_codes: [], immunization_status: "NONCOMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id, flags: $.data.alert_flags }
          assert:
            - "HTTP status == 201"
            - "Student.${stu_id}.enrollment_status == ENROLLED"
            - "Student.${stu_id}.intake_risk_score == 60"
            - "Student.${stu_id}.observed_risk_score == 0"
            - "Student.${stu_id}.effective_risk_score == 60"
            - "Student.${stu_id}.risk_tier == CRITICAL"
            - "Student.${stu_id}.alert_flags == ['ALLERGY_ANAPHYLAXIS', 'IMMUNIZATION_HOLD', 'NO_ACTIVE_PLAN']"
            - "Student.${stu_id}.active_action_plan_id == null"
            - "Student.${stu_id}.self_carry_authorized == false"
            - "School.${sch_id}.eligible_stock_student_count == 1 and School.${sch_id}.required_stock_units == 1"

      - name: student_create_invalid_enum_allergy_severity_rejected
        claim_type: type_constraints
        grounds:
          - entities.Student.fields.allergy_severity
          - validations[priority=6]
          - errors[ERR_INVALID_FIELD_VALUE]
        distinguishing_aspect: "POST /health-office/students with allergy_severity 'SEVERE' (outside the declared enum NONE|MILD|MODERATE|ANAPHYLAXIS) returns 422 ERR_INVALID_FIELD_VALUE and creates no Student row."
        test_recipe:
          setup:
            - "One School with zero students."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Yates Elementary", building_code: "YAT27", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Yara Cole", grade_level: 4, date_of_birth: "2016-07-07T00:00:00Z", allergy_severity: "SEVERE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_INVALID_FIELD_VALUE"
            - "School.${sch_id}.enrolled_student_count == 0"

      - name: action_plan_create_with_unknown_student_id_returns_not_found
        claim_type: foreign_key_integrity
        grounds:
          - entities.ActionPlan.fields.student_id
          - validations[priority=4]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "The flat topology's FK is validated before the OCC row at priority 14: POST /health-office/action-plans naming a student_id that no Student row carries returns 404 ERR_RESOURCE_NOT_FOUND even though expected_student_version is a stale value taken from a different student."
        test_recipe:
          setup:
            - "One School, one RN and one real ENROLLED student whose version is captured so the OCC field carries a server-sourced value."
            - "The trigger names a well-formed UUID that no Student row uses."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Zane Elementary", building_code: "ZAN28", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Zoe Hart", grade_level: 5, date_of_birth: "2015-08-08T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id, stu_v: $.data.version }
          trigger:
            - call: "POST /health-office/action-plans"
              payload: { student_id: "00000000-0000-4000-8000-0000000009ab", condition_code: "ASTHMA", severity_score: 2, requires_stock_epinephrine: false, self_carry_requested: false, effective_from: "2026-08-01T00:00:00Z", expected_student_version: "${stu_v}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_RESOURCE_NOT_FOUND"
            - "data.error_id != ERR_STALE_STUDENT_VERSION"
            - "GET /health-office/action-plans?student_id=${stu_id} returns total_count == 0"
            - "Student.${stu_id}.version == ${stu_v} (unchanged)"

      - name: health_visit_retrieval_returns_stored_encounter_fields
        claim_type: retrieval
        grounds:
          - entities.HealthVisit
          - endpoints[GET /health-office/health-visits/{id}]
        distinguishing_aspect: "GET /health-office/health-visits/{id} returns the same row the create returned: arrival_at stamped from the logical clock, status OPEN, disposition null, reopen_count 0, pending_administration_count 0 and minutes_in_office null."
        test_recipe:
          setup:
            - "School AAA29 with an RN on an ACTIVE Monday block, one ENROLLED student and no stock lots (coverage_posture LIMITED)."
            - "Clock at 2026-08-03T09:00:00Z when the encounter opens."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Ashby Elementary", building_code: "AAA29", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Ada Storm", grade_level: 3, date_of_birth: "2017-11-11T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistrictHealthAdmin
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "INJURY", acuity: "ROUTINE" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit_id: $.data.id }
          trigger:
            - call: "GET /health-office/health-visits/${visit_id}"
              payload: {}
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { read_status: $.data.status, read_arrival: $.data.arrival_at }
          assert:
            - "HTTP status == 200 and response_type == object"
            - "HealthVisit.${visit_id}.arrival_at == 2026-08-03T09:00:00.000Z"
            - "HealthVisit.${visit_id}.status == OPEN"
            - "HealthVisit.${visit_id}.disposition == null"
            - "HealthVisit.${visit_id}.closed_at == null"
            - "HealthVisit.${visit_id}.minutes_in_office == null"
            - "HealthVisit.${visit_id}.reopen_count == 0"
            - "HealthVisit.${visit_id}.guardian_notified == false"
            - "HealthVisit.${visit_id}.pending_administration_count == 0"
            - "HealthVisit.${visit_id}.triage_score == 28"

  - section: state_machines
    instances:

      - name: action_plan_initial_state_is_draft_with_zero_revisions
        claim_type: initial_state
        grounds:
          - state_machines.ActionPlan.null_to_DRAFT
          - entities.ActionPlan.fields.status
          - entities.ActionPlan.fields.revision_round
        distinguishing_aspect: "A freshly created ActionPlan lands in DRAFT with revision_round 0, guardian_consent_at null, provider_signed_at null and review_due_at null, and bumps Student.version by 1."
        test_recipe:
          setup: ["One School, one RN and one ENROLLED student with no existing plans."]
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Bexley Elementary", building_code: "BEX30", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Bo Nguyen", grade_level: 4, date_of_birth: "2016-02-14T00:00:00Z", allergy_severity: "MODERATE", chronic_condition_codes: ["SEIZURE"], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id, stu_v: $.data.version }
          trigger:
            - call: "POST /health-office/action-plans"
              payload: { student_id: "${stu_id}", condition_code: "SEIZURE", severity_score: 3, requires_stock_epinephrine: false, self_carry_requested: false, effective_from: "2026-08-01T00:00:00Z", expected_student_version: "${stu_v}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { plan_id: $.data.id, plan_status: $.data.status }
          assert:
            - "HTTP status == 201"
            - "ActionPlan.${plan_id}.status == DRAFT"
            - "ActionPlan.${plan_id}.revision_round == 0"
            - "ActionPlan.${plan_id}.guardian_consent_at == null"
            - "ActionPlan.${plan_id}.provider_signed_at == null"
            - "ActionPlan.${plan_id}.review_due_at == null"
            - "Student.${stu_id}.version == 2"
            - "Student.${stu_id}.active_action_plan_id == null"
            - "NO_ACTIVE_PLAN is a member of Student.${stu_id}.alert_flags"

      - name: screening_record_result_twice_rejected_from_completed
        claim_type: invalid_transition
        grounds:
          - state_machines.Screening.SCHEDULED_to_COMPLETED
          - validations[priority=12]
          - errors[ERR_SCREENING_INVALID_STATE]
