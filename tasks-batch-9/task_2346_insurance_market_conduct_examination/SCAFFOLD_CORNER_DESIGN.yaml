      - name: a_terminal_examination_refuses_every_further_write
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Examination
          - validations[priority 40 ERR_EXAM_ALREADY_TERMINAL]
        distinguishing_aspect: |
          PUBLISHED and ABORTED are absorbing: every write nested under the examination, including a
          second abort, is refused once the examination is terminal.
        excluded_because:
          difficulty_instance: abort_cascades_children_insurer_counters_and_closes_the_cycle
          rationale: "That §1.8 instance re-aborts an already ABORTED examination and asserts 409 ERR_EXAM_ALREADY_TERMINAL plus the unchanged child and counter state."

      - name: executing_a_consent_order_twice_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ConsentOrder
          - validations[priority 40 ERR_ENFORCEMENT_RECORD_STATE_INVALID]
        distinguishing_aspect: |
          EXECUTED is terminal, so a second execution cannot re-credit
          Insurer.lifetime_restitution_ordered_cents.
        excluded_because:
          difficulty_instance: allocation_conserves_every_cent_through_the_remainder_sweep
          rationale: "That §1.8 instance re-executes an EXECUTED ConsentOrder and asserts 409 ERR_ENFORCEMENT_RECORD_STATE_INVALID with lifetime_restitution_ordered_cents credited exactly once."

