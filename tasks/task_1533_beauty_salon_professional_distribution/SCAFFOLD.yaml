    side_effects: ["REDEMPTION ledger entry posted immediately (FIFO consumption of non-expired accruals); credit_applied_cents/net_merch_cents recomputed; increments Order.version"]

  - method: POST
    path: "/api/orders/{id}/redeem-promotion"
    description: "Redeem a promotion code on a DRAFT order (BUNDLE adds free lines; SAMPLE adds sample units)"
    roles: [SalonBuyer]
    code: 200
    input: [code]
    output: Order
    side_effects: ["Promotional item(s) injected at unit_price 0; PromotionRedemption created APPLIED; promotion.remaining_budget_units decremented (may flip promotion to ENDED); promo_applied_code set; increments Order.version"]

  - method: POST
    path: "/api/orders/{id}/submit"
    description: "Submit a DRAFT order"
    roles: [SalonBuyer]
    code: 200
    input: []
    output: Order
    side_effects: ["DRAFT -> SUBMITTED; payment UNPAID -> AUTHORIZED; PROVISIONAL_ACCRUAL posted; increments Order.version"]

  - method: POST
    path: "/api/orders/{id}/cancel"
    description: "Buyer-cancellable while DRAFT or SUBMITTED"
    roles: [SalonBuyer]
    code: 200
    input: []
    output: Order
    side_effects: ["-> CANCELLED; payment AUTHORIZED -> VOIDED when applicable; redemption/provisional reversals; promotion budget restored"]

  - method: POST
    path: "/api/orders/{id}/approve"
    description: "Approve a SUBMITTED order"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["SUBMITTED -> APPROVED; payment AUTHORIZED -> CAPTURED"]

  - method: POST
    path: "/api/orders/{id}/reject"
    description: "Reject a SUBMITTED order"
    roles: [DistributionAdmin]
    code: 200
    input: [reason]
    output: Order
    side_effects: ["SUBMITTED -> REJECTED; payment AUTHORIZED -> VOIDED; redemption/provisional reversals; promotion budget restored"]

  # --- Shipment ---
  - method: POST
    path: "/api/orders/{id}/shipments"
    description: "Create a shipment for an APPROVED or FULFILLING order"
    roles: [WarehouseOperator]
    code: 201
    input: [method, items]
    output: Shipment
    side_effects: ["Hazmat/method and hold checks; charges computed; order shipping_total_cents/grand_total_cents recomputed; order APPROVED -> FULFILLING on first shipment"]

  - method: GET
    path: "/api/orders/{id}/shipments"
    description: "List shipments of an order"
    roles: [DistributionAdmin, ComplianceOfficer, SalesConsultant, SalonBuyer, WarehouseOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/api/shipments/{id}"
    description: "Get one shipment"
    roles: [DistributionAdmin, ComplianceOfficer, SalesConsultant, SalonBuyer, WarehouseOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/api/shipments/{id}/create-label"
    description: "PLANNED -> LABEL_CREATED"
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/api/shipments/{id}/ship"
    description: "LABEL_CREATED -> IN_TRANSIT"
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["May flip order FULFILLING -> SHIPPED"]

  - method: POST
    path: "/api/shipments/{id}/deliver"
    description: "IN_TRANSIT -> DELIVERED"
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["If all shipments delivered -> order DELIVERED; FINAL_ACCRUAL + commission fire; delivered_at set on order"]

  - method: POST
    path: "/api/shipments/{id}/void-label"
    description: "LABEL_CREATED -> PLANNED (label void); shipping charge withdrawn from order totals"
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["Order.shipping_total_cents decremented by this shipment's charge; grand_total_cents recomputed"]

  # --- Promotion / PromotionRedemption ---
  - method: POST
    path: "/api/promotions"
    description: "Create a promotion in DRAFT"
    roles: [DistributionAdmin]
    code: 201
    input: [code, promo_type, eligible_tiers, starts_at, ends_at, budget_units, per_salon_cap, "required_product_id?", "required_qty?", "free_product_id?", "free_qty?", "sample_product_id?", "sample_units_per_redemption?"]
    output: Promotion
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/api/promotions"
    description: "List promotions"
    roles: [DistributionAdmin, ComplianceOfficer, SalesConsultant, SalonBuyer, WarehouseOperator]
    code: 200
    input: ["status?", "promo_type?", "required_product_id?", "free_product_id?", "sample_product_id?", "limit?", "offset?"]
    output: "Promotion[]"
    side_effects: []

  - method: GET
    path: "/api/promotions/{id}"
    description: "Get one promotion"
    roles: [DistributionAdmin, ComplianceOfficer, SalesConsultant, SalonBuyer, WarehouseOperator]
    code: 200
    input: []
    output: Promotion
    side_effects: []

  - method: POST
    path: "/api/promotions/{id}/activate"
    description: "DRAFT -> ACTIVE; initializes remaining_budget_units = budget_units"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: Promotion
    side_effects: ["remaining_budget_units initialized"]

  - method: POST
    path: "/api/promotions/{id}/pause"
    description: "ACTIVE -> PAUSED"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: Promotion
    side_effects: []

  - method: POST
    path: "/api/promotions/{id}/resume"
    description: "PAUSED -> ACTIVE (referenced products must be ACTIVE or LIQUIDATION)"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: Promotion
    side_effects: []

  - method: POST
    path: "/api/promotions/{id}/budget-adjustments"
    description: "Adjust promotion budget by a signed delta (OCC-guarded on Promotion.version)"
    roles: [DistributionAdmin]
    code: 200
    input: [delta_units, expected_promotion_version]
    output: Promotion
    side_effects: ["budget_units += delta_units; remaining_budget_units += delta_units; result must keep remaining_budget_units >= 0 (ERR_INVALID_REQUEST otherwise); increments Promotion.version by 1"]

  - method: GET
    path: "/api/promotion-redemptions"
    description: "List promotion redemptions (filtered)"
    roles: [DistributionAdmin, ComplianceOfficer, SalonBuyer]
    code: 200
    input: ["promotion_id?", "order_id?", "salon_account_id?", "status?", "limit?", "offset?"]
    output: "PromotionRedemption[]"
    side_effects: []

  - method: GET
    path: "/api/promotion-redemptions/{id}"
    description: "Get one redemption"
    roles: [DistributionAdmin, ComplianceOfficer, SalonBuyer]
    code: 200
    input: []
    output: PromotionRedemption
    side_effects: []

  # --- DiversionCase ---
  - method: POST
    path: "/api/diversion-cases"
    description: "File a diversion case against a salon"
    roles: [SalesConsultant, ComplianceOfficer]
    code: 201
    input: [salon_account_id, product_id, severity, evidence_note, "hold_shipments?"]
    output: DiversionCase
    side_effects: ["status = OPEN; filed_by_user_id / filed_by_consultant_id recorded"]

  - method: GET
    path: "/api/diversion-cases"
    description: "List diversion cases (filtered)"
    roles: [DistributionAdmin, ComplianceOfficer]
    code: 200
    input: ["salon_account_id?", "product_id?", "filed_by_consultant_id?", "status?", "limit?", "offset?"]
    output: "DiversionCase[]"
    side_effects: []

  - method: GET
    path: "/api/diversion-cases/{id}"
    description: "Get one diversion case"
    roles: [DistributionAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: DiversionCase
    side_effects: []

  - method: POST
    path: "/api/diversion-cases/{id}/start-review"
    description: "OPEN -> UNDER_REVIEW"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DiversionCase
    side_effects: []

  - method: POST
    path: "/api/diversion-cases/{id}/request-evidence"
    description: "UNDER_REVIEW -> OPEN (evidence cycle)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DiversionCase
    side_effects: []

  - method: POST
    path: "/api/diversion-cases/{id}/substantiate"
    description: "UNDER_REVIEW -> SUBSTANTIATED; awards strike points; may suspend the salon"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DiversionCase
    side_effects: ["Strike points + risk score on salon; at >= 3 strike points the suspension cascade fires"]

  - method: POST
    path: "/api/diversion-cases/{id}/dismiss"
    description: "OPEN|UNDER_REVIEW -> DISMISSED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DiversionCase
    side_effects: ["hold_shipments effect ends"]

  # --- EducationCreditEntry ---
  - method: GET
    path: "/api/salon-accounts/{id}/credit-ledger"
    description: "List the salon's education-credit ledger entries (chronological by earned_at, then created_at)"
    roles: [DistributionAdmin, ComplianceOfficer, SalonBuyer]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: "EducationCreditEntry[]"
    side_effects: []

  - method: GET
    path: "/api/orders/{id}/credit-entries"
    description: "List credit ledger entries tied to an order"
    roles: [DistributionAdmin, ComplianceOfficer, SalonBuyer]
    code: 200
    input: ["limit?", "offset?"]
    output: "EducationCreditEntry[]"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # auth / request
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing, role unknown, or entity_backed id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema violation: missing required field, bad type, enum outside declared set, non-positive quantity/price, or unknown body field" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 400, condition: "Window end is not strictly after start (route stops, exclusives, promotions), or promotion activate/resume attempted after ends_at" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role not in the endpoint's role list" }
  - { id: ERR_FORBIDDEN_RESOURCE, http: 403, condition: "Entity-backed caller touches a resource outside its ownership scope (other salon's data, other consultant's route)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Diversion case adjudicator X-User-ID equals filed_by_user_id" }
  # existence
  - { id: ERR_SALON_ACCOUNT_NOT_FOUND, http: 404, condition: "SalonAccount id does not exist" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "ProfessionalLicense id does not exist" }
  - { id: ERR_BRAND_NOT_FOUND, http: 404, condition: "Brand id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_CONSULTANT_NOT_FOUND, http: 404, condition: "SalesConsultant id does not exist" }
  - { id: ERR_ROUTE_PLAN_NOT_FOUND, http: 404, condition: "RoutePlan id does not exist" }
  - { id: ERR_ROUTE_STOP_NOT_FOUND, http: 404, condition: "RouteStop id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not exist" }
  - { id: ERR_ORDER_ITEM_NOT_FOUND, http: 404, condition: "OrderItem id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id does not exist" }
  - { id: ERR_PROMOTION_NOT_FOUND, http: 404, condition: "Promotion id does not exist (or unknown redemption code)" }
  - { id: ERR_REDEMPTION_NOT_FOUND, http: 404, condition: "PromotionRedemption id does not exist" }
  - { id: ERR_DIVERSION_CASE_NOT_FOUND, http: 404, condition: "DiversionCase id does not exist" }
  # state
  - { id: ERR_INVALID_ACCOUNT_STATE, http: 409, condition: "Salon transition attempted from a non-matching status (e.g. suspend a SUSPENDED salon, reinstate an ACTIVE one)" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Order create/submit/approve requires the salon to be ACTIVE" }
  - { id: ERR_NO_VALID_LICENSE, http: 409, condition: "Reinstate requires a VERIFIED license with valid_until after the logical clock" }
  - { id: ERR_INVALID_LICENSE_STATE, http: 409, condition: "License verify/reject attempted on a non-SUBMITTED license" }
  - { id: ERR_LICENSE_DATE_INVALID, http: 400, condition: "License valid_until is not after the logical clock (at submit or verify)" }
  - { id: ERR_INVALID_PRODUCT_STATE, http: 409, condition: "Product lifecycle forbids the operation (order lines require ACTIVE or LIQUIDATION; lifecycle transition from wrong state; promotion resume with a DISCONTINUED/ARCHIVED referenced product)" }
  - { id: ERR_INVALID_ORDER_STATE, http: 409, condition: "Order transition attempted from a non-matching fulfillment_status (incl. removing promotional lines, buyer-cancelling an APPROVED order)" }
  - { id: ERR_INVALID_SHIPMENT_STATE, http: 409, condition: "Shipment transition attempted from a non-matching status" }
  - { id: ERR_INVALID_PROMOTION_STATE, http: 409, condition: "Promotion transition or redemption attempted from a non-matching status (e.g. redeem while DRAFT/PAUSED/ENDED)" }
  - { id: ERR_INVALID_DIVERSION_CASE_STATE, http: 409, condition: "Diversion transition attempted from a non-matching status (incl. terminal lockdown)" }
  - { id: ERR_INVALID_ROUTE_PLAN_STATE, http: 409, condition: "Route plan transition attempted from a non-matching status, publish without stops, unpublish with completed stops, or stop action while plan is DRAFT" }
  - { id: ERR_INVALID_ROUTE_STOP_STATE, http: 409, condition: "Route stop transition attempted from a non-matching status" }
  - { id: ERR_INVALID_CONSULTANT_STATE, http: 409, condition: "Route publish requires the consultant to be ACTIVE" }
  # business: safety
  - { id: ERR_HAZMAT_AIR_FORBIDDEN, http: 422, condition: "Shipment contains hazmat_class != NONE items but method is AIR" }
  - { id: ERR_SHIPMENT_HELD_DIVERSION, http: 409, condition: "An OPEN or UNDER_REVIEW diversion case with hold_shipments blocks shipment creation for the salon" }
  # business: constraint / referential / temporal
  - { id: ERR_SHIPMENT_QUANTITY_EXCEEDS_ORDER, http: 409, condition: "Shipment item quantities exceed remaining unshipped units, or reference items of another order" }
  - { id: ERR_BRAND_TERRITORY_RESTRICTED, http: 422, condition: "Brand has exclusivity windows and none covers the salon's territory at the logical clock" }
  - { id: ERR_BACKBAR_QUOTA_EXCEEDED, http: 422, condition: "Projected backbar units exceed 2.0x projected retail units in the trailing 90-day window" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "Brand.name, Product.sku, or Promotion.code already in use" }
  - { id: ERR_TERRITORY_WINDOW_OVERLAP, http: 409, condition: "New exclusivity window overlaps an existing window for the same (brand_id, territory_code) under half-open semantics" }
  - { id: ERR_ROUTE_STOP_BUFFER_VIOLATION, http: 409, condition: "Adjacent non-CANCELLED stops on a plan must keep a >= 30 minute gap" }
  - { id: ERR_CONSULTANT_TERRITORY_MISMATCH, http: 422, condition: "Stop salon territory not in the plan consultant's territory_codes" }
  - { id: ERR_PROMOTION_NOT_ACTIVE, http: 409, condition: "Redemption outside the promotion window (starts_at <= now < ends_at fails)" }
  - { id: ERR_PROMOTION_TIER_INELIGIBLE, http: 422, condition: "Salon tier not in promotion.eligible_tiers" }
  - { id: ERR_PROMOTION_ALREADY_APPLIED, http: 409, condition: "Same promotion already has an APPLIED redemption on this order" }
  - { id: ERR_BUNDLE_REQUIREMENT_NOT_MET, http: 422, condition: "BUNDLE redemption without the required non-promotional quantity of required_product_id on the order" }
  # business: fiscal
  - { id: ERR_INSUFFICIENT_CREDIT_BALANCE, http: 422, condition: "Requested redemption points exceed the salon's redeemable (non-expired, unconsumed) points" }
  - { id: ERR_CREDIT_REDEMPTION_EXCEEDS_CAP, http: 422, condition: "Requested redemption cents exceed floor(merchandise_total_cents * 0.5)" }
  - { id: ERR_PROMOTION_BUDGET_EXHAUSTED, http: 422, condition: "remaining_budget_units smaller than the redemption's units (no partial grants)" }
  - { id: ERR_PER_SALON_CAP_EXCEEDED, http: 422, condition: "Redemption would push the salon past promotion.per_salon_cap" }
  # concurrency
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent's current version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistributionAdmin
    description: "Distributor operations administrator: catalog, brands, products, promotions, consultants, order approval, tier management, ops sweep, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/ops/run-daily-sweep"
      - "POST /api/brands, POST /api/brands/{id}/discontinue, POST /api/brands/{id}/territory-exclusives"
      - "POST /api/products, POST /api/products/{id}/lifecycle"
      - "POST /api/sales-consultants, PATCH /api/sales-consultants/{id}"
      - "POST /api/promotions and promotion lifecycle/budget endpoints"
      - "POST /api/orders/{id}/approve, POST /api/orders/{id}/reject"
      - "POST /api/salon-accounts/{id}/tier-override, POST /api/salon-accounts/{id}/evaluate-tier"
    shared_operations:
      - "GET read endpoints across resources"
      - "Route plan/stop management (shared with SalesConsultant)"
  - name: ComplianceOfficer
    description: "Professional-authorization and diversion compliance: license verification, salon suspension/reinstatement/deactivation, diversion adjudication"
    identity: opaque
    exclusive_operations:
      - "POST /api/licenses/{id}/verify, POST /api/licenses/{id}/reject"
      - "POST /api/salon-accounts/{id}/suspend, /reinstate, /deactivate"
      - "POST /api/diversion-cases/{id}/start-review, /request-evidence, /substantiate, /dismiss"
    shared_operations:
      - "POST /api/diversion-cases (shared with SalesConsultant; a filer may not adjudicate their own case)"
      - "GET read endpoints"
  - name: SalesConsultant
    description: "Distributor field sales consultant; opens salon accounts, files licenses and diversion leads, runs route plans"
    identity: "entity_backed:SalesConsultant"
    exclusive_operations:
      - "POST /api/salon-accounts"
    shared_operations:
      - "POST /api/salon-accounts/{id}/licenses (shared with SalonBuyer)"
      - "Route plan/stop management for own routes (shared with DistributionAdmin)"
      - "POST /api/diversion-cases"
      - "GET read endpoints"
  - name: SalonBuyer
    description: "Purchasing user of a salon account; manages and submits the salon's orders"
    identity: "entity_backed:SalonAccount"
    exclusive_operations:
      - "POST /api/orders and order item/redemption/submit/cancel endpoints"
    shared_operations:
      - "POST /api/salon-accounts/{id}/licenses"
      - "GET read endpoints for own salon scope"
  - name: WarehouseOperator
    description: "Warehouse fulfillment operator; builds and advances shipments"
    identity: opaque
    exclusive_operations:
      - "POST /api/orders/{id}/shipments and shipment lifecycle endpoints"
    shared_operations:
      - "GET read endpoints"
