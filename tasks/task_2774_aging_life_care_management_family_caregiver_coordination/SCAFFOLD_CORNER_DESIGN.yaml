              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { t1: $.data.id, t1_date: $.data.service_date }
            - call: "PATCH /care/time-entries/${t1}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/time-entries/${t1}/state"
              payload: { to_state: "APPROVED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-20T10:00:00Z", end_at: "2026-08-20T11:00:00Z", service_location_id: "OFFICE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { t2: $.data.id, t2_date: $.data.service_date }
            - call: "PATCH /care/time-entries/${t2}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/time-entries/${t2}/state"
              payload: { to_state: "APPROVED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "POST /care/invoices"
              payload: { client_id: "${cli}", period_start: "2026-08-01", period_end: "2026-08-15" }
