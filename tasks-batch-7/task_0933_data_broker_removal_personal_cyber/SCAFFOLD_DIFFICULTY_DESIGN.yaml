scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: sla_deadline_base_vs_escalated_resubmission
        grounds:
          - calculations.removal_sla_deadline
          - state_machines.RemovalRequest.DRAFTED_to_SUBMITTED
          - state_machines.RemovalRequest.ESCALATED_to_SUBMITTED
          - entities.RemovalRequest.fields.deadline_variant
          - entities.RemovalRequest.fields.effective_window_days
        distinguishing_aspect: |
          This instance lives in the RemovalRequest scheduling domain: the SAME broker row
          (POSTAL / US_CA / 30-day self-declared window) yields effective_window_days 45 on the
          BASE variant (30 + 7 method buffer, raised to the 45-day US_CA floor) and 15 on the
          ESCALATED_RESUBMISSION variant, which ignores both the buffer and the floor.
        test_recipe:
          setup:
            - "A FAMILY plan, an ACTIVE account, its primary member, an ACTIVE monitored profile with one identifier."
            - "Broker PeopleFinderCo: opt_out_method POSTAL, jurisdiction US_CA, response_window_days 30, requires_identity_verification false."
            - "One ExposureRecord in FOUND discovered by a completed INITIAL scan; logical clock at 2026-05-11T00:00:00Z."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /brokers"
              payload: { name: "PeopleFinderCo", opt_out_method: "POSTAL", jurisdiction: "US_CA", response_window_days: 30, requires_identity_verification: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { broker_a_id: $.data.id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield", rescan_cadence_days: 30, two_factor_attested: false }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, prof_v1: $.data.version }
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "dana@example.com", expected_profile_version: "${prof_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles/${prof_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "INITIAL" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan1_id: $.data.id }
            - call: "POST /scan-runs/${scan1_id}/start"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /scan-runs/${scan1_id}/findings"
              payload: { broker_id: "${broker_a_id}", exposure_kind: "PEOPLE_SEARCH", source_url: "https://peoplefinderco.example/dana" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { exp_a_id: $.data.id }
            - call: "POST /scan-runs/${scan1_id}/complete"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /removal-requests"
              payload: { exposure_id: "${exp_a_id}" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { rr_id: $.data.id }
          trigger:
            - call: "POST /removal-requests/${rr_id}/submit"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { base_deadline: $.data.sla_deadline_at, base_window: $.data.effective_window_days }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /removal-requests/${rr_id}/expire"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /removal-requests/${rr_id}/escalate"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /removal-requests/${rr_id}/submit"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
          assert:
            - "After the first submit: RemovalRequest.${rr_id}.deadline_variant == BASE"
            - "After the first submit: RemovalRequest.${rr_id}.effective_window_days == 45"
            - "After the first submit: RemovalRequest.${rr_id}.sla_deadline_at == 2026-06-25T00:00:00.000Z"
            - "After the second submit: RemovalRequest.${rr_id}.deadline_variant == ESCALATED_RESUBMISSION"
            - "After the second submit: RemovalRequest.${rr_id}.effective_window_days == 15"
            - "After the second submit: RemovalRequest.${rr_id}.sla_deadline_at == 2026-07-10T00:00:00.000Z"
            - "RemovalRequest.${rr_id}.escalation_count == 1"
            - "RemovalRequest.${rr_id}.status == SUBMITTED"

      - name: hygiene_score_two_factor_vs_no_two_factor
        grounds:
          - calculations.hygiene_score
          - entities.MonitoredProfile.fields.two_factor_attested
          - entities.MonitoredProfile.fields.hygiene_band
          - entities.CredentialFinding.fields.finding_type
        distinguishing_aspect: |
          This instance lives in the MonitoredProfile credential-risk domain, a different entity
          domain from the RemovalRequest scheduling instance above: one identical set of four OPEN
          CredentialFinding rows (raw_penalty 62) scores 38.00 / CRITICAL under NO_TWO_FACTOR and
          62.80 / MODERATE under TWO_FACTOR_ATTESTED — two band rungs apart from the same data.
        test_recipe:
          setup:
            - "A FAMILY plan, an ACTIVE account, its primary member, one DRAFT monitored profile with two_factor_attested false."
            - "Four OPEN CredentialFinding rows on that profile: BREACHED_PASSWORD (25), WEAK_PASSWORD (18), REUSED_PASSWORD (12), STALE_PASSWORD (7); raw_penalty 62, below the 70 cap."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield", rescan_cadence_days: 30, two_factor_attested: false }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /credential-findings"
              payload: { profile_id: "${prof_id}", finding_type: "BREACHED_PASSWORD", detail: "corp mail vault" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /credential-findings"
              payload: { profile_id: "${prof_id}", finding_type: "WEAK_PASSWORD", detail: "retail login" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /credential-findings"
              payload: { profile_id: "${prof_id}", finding_type: "REUSED_PASSWORD", detail: "forum login" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /credential-findings"
              payload: { profile_id: "${prof_id}", finding_type: "STALE_PASSWORD", detail: "old router admin" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
          trigger:
            - call: "GET /monitored-profiles/${prof_id}/hygiene-score"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { score_no_2fa: $.data.hygiene_score, band_no_2fa: $.data.hygiene_band }
            - call: "PATCH /monitored-profiles/${prof_id}"
              payload: { two_factor_attested: true }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "GET /monitored-profiles/${prof_id}/hygiene-score"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { score_2fa: $.data.hygiene_score, band_2fa: $.data.hygiene_band }
          assert:
            - "First hygiene-score read: open_finding_count == 4"
            - "First hygiene-score read: raw_penalty == 62"
            - "First hygiene-score read: capped_penalty == 62"
            - "First hygiene-score read: adjusted_penalty == 62.00"
            - "First hygiene-score read: hygiene_score == 38.00 and hygiene_band == CRITICAL and variant == NO_TWO_FACTOR"
            - "Second hygiene-score read: adjusted_penalty == 37.20"
            - "Second hygiene-score read: hygiene_score == 62.80 and hygiene_band == MODERATE and variant == TWO_FACTOR_ATTESTED"
            - "MonitoredProfile.${prof_id}.hygiene_score == 62.80 after the PATCH"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: plan_proration_rounding_order_upgrade_vs_downgrade
        grounds:
          - calculations.plan_proration_amount
          - entities.BillingCycle.fields.proration_charge_cents
          - entities.BillingCycle.fields.proration_credit_cents
          - concurrency_rules[plan-change-stale-account]
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER decides the cents. With an identical
          fee_delta_cents of 1000 and an identical remaining_days of 20, UPGRADE (round the daily
          rate to 33 cents first, then multiply) books 660 while DOWNGRADE (multiply first, round
          the single product last) books 667. The scaffold pins UPGRADE to round-then-multiply.
        test_recipe:
          setup:
            - "Two plans exist: SOLO at 1200 cents/cycle and FAMILY at 2200 cents/cycle."
            - "An ACTIVE account on SOLO opened at the clock default 2026-05-01T00:00:00Z, so its OPEN cycle runs to 2026-05-31T00:00:00Z."
            - "The logical clock is moved to 2026-05-11T00:00:00Z, giving remaining_days 20."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "SOLO", name: "Solo Shield", monthly_fee_cents: 1200, max_members: 1, profile_quota_per_cycle: 1, scan_quota_per_cycle: 4, removal_quota_per_cycle: 20, per_member_removal_subcap: 20 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_solo_id: $.data.id }
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_solo_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id, acct_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /accounts/${acct_id}/plan-changes"
              payload: { new_plan_id: "${plan_family_id}", change_kind: "UPGRADE", expected_account_version: "${acct_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { acct_v2: $.data.version }
            - call: "POST /accounts/${acct_id}/plan-changes"
              payload: { new_plan_id: "${plan_solo_id}", change_kind: "DOWNGRADE", expected_account_version: "${acct_v2}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "GET /accounts/${acct_id}/billing-cycles"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { cycle_id: "$.data[0].id" }
          assert:
            - "BillingCycle.${cycle_id}.proration_charge_cents == 660"
            - "BillingCycle.${cycle_id}.proration_credit_cents == 667"
            - "BillingCycle.${cycle_id}.base_charge_cents == 1200"
            - "The two magnitudes differ by exactly 7 cents even though fee_delta_cents (1000) and remaining_days (20) are identical on both legs"
            - "Account.${acct_id}.plan_id == ${plan_solo_id} after the downgrade"

      - name: cycle_total_discount_tier_pinned_to_pre_discount_total
        grounds:
          - calculations.cycle_total_charge
          - calculations.addon_proration_amount
          - entities.BillingCycle.fields.pre_discount_total_cents
          - entities.BillingCycle.fields.loyalty_discount_cents
          - entities.BillingCycle.fields.total_charged_cents
        distinguishing_aspect: |
          Mode (c) — the circular-looking dependency. The loyalty rate is keyed on a total that the
          discount itself then reduces: pre_discount_total_cents 1520 selects LOYALTY_TIER_1_RATE
          (0.02) and the resulting total_charged_cents 1490 falls BELOW LOYALTY_TIER_1_THRESHOLD_CENTS
          (1500). The scaffold pins the evaluation order so the tier is never re-selected — a
          re-selecting implementation would emit discount 0 and total 1520.
        test_recipe:
          setup:
            - "A SOLO plan at 1200 cents; an ACTIVE account opened at 2026-05-01T00:00:00Z with an OPEN cycle ending 2026-05-31T00:00:00Z."
            - "The clock is moved to 2026-05-11T00:00:00Z (remaining_days 20, remaining_days_inclusive 21)."
            - "A VPN add-on with seats_total 3 and per_seat_fee_cents 152 is bought at that instant."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "SOLO", name: "Solo Shield", monthly_fee_cents: 1200, max_members: 1, profile_quota_per_cycle: 1, scan_quota_per_cycle: 4, removal_quota_per_cycle: 20, per_member_removal_subcap: 20 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_solo_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_solo_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /accounts/${acct_id}/addons"
              payload: { addon_type: "VPN", seats_total: 3, per_seat_fee_cents: 152 }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { addon_id: $.data.id, addon_charge: $.data.prorated_charge_cents }
            - call: "GET /accounts/${acct_id}/billing-cycles"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { cycle_id: "$.data[0].id" }
          assert:
            - "AddOnSubscription.${addon_id}.prorated_charge_cents == 320"
            - "BillingCycle.${cycle_id}.addon_charge_cents == 320"
            - "BillingCycle.${cycle_id}.pre_discount_total_cents == 1520"
            - "BillingCycle.${cycle_id}.loyalty_discount_cents == 30"
            - "BillingCycle.${cycle_id}.total_charged_cents == 1490"
            - "total_charged_cents (1490) is strictly below LOYALTY_TIER_1_THRESHOLD_CENTS (1500), proving the tier was selected from pre_discount_total_cents and not re-selected afterwards"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: exposure_suppress_reappear_resuppress_unbounded_loop
        grounds:
          - state_machines.ExposureRecord.FOUND_to_SUPPRESSED
          - state_machines.ExposureRecord.SUPPRESSED_to_REAPPEARED
          - state_machines.ExposureRecord.REAPPEARED_to_RE_SUPPRESSED
          - state_machines.ExposureRecord.RE_SUPPRESSED_to_REAPPEARED
          - entities.ExposureRecord.fields.suppression_count
          - entities.ExposureRecord.fields.reappearance_count
        distinguishing_aspect: |
          The ExposureRecord axis is a genuine unbounded cycle: the row re-enters REAPPEARED from
          RE_SUPPRESSED with no cap, and each lap increments suppression_count and reappearance_count
          on the SAME row while first_found_at and discovered_by_scan_id stay frozen. It is a
          different entity from the RemovalRequest capped loop in the sibling instance.
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, ACTIVE profile with one identifier, one ACTIVE broker (WEB_FORM / OTHER / 30 days)."
            - "One ExposureRecord in FOUND, created by a completed INITIAL scan at the clock default 2026-05-01T00:00:00Z."
            - "That exposure is driven to SUPPRESSED by a completed removal request, then re-found 44 days later, re-suppressed, and re-found again."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /brokers"
              payload: { name: "QuickLookup", opt_out_method: "WEB_FORM", jurisdiction: "OTHER", response_window_days: 30, requires_identity_verification: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { broker_b_id: $.data.id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield", rescan_cadence_days: 30, two_factor_attested: false }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, prof_v1: $.data.version }
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "dana@example.com", expected_profile_version: "${prof_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles/${prof_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "INITIAL" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan1_id: $.data.id }
            - call: "POST /scan-runs/${scan1_id}/start"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /scan-runs/${scan1_id}/findings"
              payload: { broker_id: "${broker_b_id}", exposure_kind: "PEOPLE_SEARCH", source_url: "https://quicklookup.example/dana" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { exp_id: $.data.id }
            - call: "POST /scan-runs/${scan1_id}/complete"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /removal-requests"
              payload: { exposure_id: "${exp_id}" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { rr1_id: $.data.id }
            - call: "POST /removal-requests/${rr1_id}/submit"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /removal-requests/${rr1_id}/acknowledge"
              payload: { broker_reference: "QL-0001" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /removal-requests/${rr1_id}/complete"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-beta"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "RECURRING" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan2_id: $.data.id }
            - call: "POST /scan-runs/${scan2_id}/start"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /scan-runs/${scan2_id}/findings"
              payload: { broker_id: "${broker_b_id}", exposure_kind: "PEOPLE_SEARCH", source_url: "https://quicklookup.example/dana" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /scan-runs/${scan2_id}/complete"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /removal-requests"
              payload: { exposure_id: "${exp_id}" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { rr2_id: $.data.id }
            - call: "POST /removal-requests/${rr2_id}/submit"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /removal-requests/${rr2_id}/acknowledge"
              payload: { broker_reference: "QL-0002" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /removal-requests/${rr2_id}/complete"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-beta"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "RECURRING" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan3_id: $.data.id }
            - call: "POST /scan-runs/${scan3_id}/start"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
          trigger:
            - call: "POST /scan-runs/${scan3_id}/findings"
              payload: { broker_id: "${broker_b_id}", exposure_kind: "PEOPLE_SEARCH", source_url: "https://quicklookup.example/dana" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { looped_status: $.data.status, looped_reapp: $.data.reappearance_count }
          assert:
            - "ExposureRecord.${exp_id}.status == REAPPEARED (second lap of the loop)"
            - "ExposureRecord.${exp_id}.reappearance_count == 2"
            - "ExposureRecord.${exp_id}.suppression_count == 2"
