          trigger:
            - call: "POST /network/member-stations/11111111-2222-4333-8444-555555555555/submit-eligibility"
              payload: {}
              as: Anonymous
          assert:
            - "The request returns error_id ERR_MISSING_AUTH with http 401"
            - "The unknown path id is never resolved, so the 404 existence check does not run"
            - "Priority 1 authentication outranks priority 3 existence for this request"
      - name: error_ack_language_violation_on_submit
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ACK_LANGUAGE_VIOLATION]
          - validations[priority=24]
        excluded_because:
          difficulty_instance: priority_safety_over_compliance
          rationale: "Already asserted as the failure path of the named §1.8 instance, which pins both the error_id and the earliest VIOLATION_ORDER class."
      - name: error_dues_proposal_rejected_on_tally
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUES_PROPOSAL_REJECTED]
          - state_machines.DuesStructureProposal.transitions.OPEN_to_REJECTED
        excluded_because:
          difficulty_instance: invariant_dues_vote_pair_weight_conservation
          rationale: "The rejected-tally path is exercised by the named §1.8 instance, whose fixture drives yes_votes 0 against no_votes 2 after a supersede."
