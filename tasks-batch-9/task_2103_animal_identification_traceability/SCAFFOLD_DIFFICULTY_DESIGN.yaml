  - rule_id: transitive_cascade
    instances:

      - name: receive_cascade_movement_sighting_animal_premises_producer
        grounds:
          - state_machines.MovementEvent.REPORTED_to_RECEIVED
          - state_machines.Animal.IN_TRANSIT_to_ACTIVE
          - calculations.animal_location_projection
          - entities.Premises.fields.animal_count
          - entities.Producer.fields.incentive_tier
        distinguishing_aspect: |
          Trigger POST /movement-events/{id}/receive drives a five-node chain in which every hop is
          caused by the previous one: the movement flips RECEIVED, which appends the ARRIVAL sighting,
          which re-projects Animal.current_premises_id, which raises destination Premises.animal_count,
          which re-derives Producer.enrolled_head_count and flips incentive_tier TIER_0 -> TIER_1.
