      - name: an_unknown_collar_brand_is_refused_differently_at_fill_and_at_distribution
        claim_type: triggerable
        grounds:
          - errors.ERR_BRAND_OWNER_UNKNOWN
          - validations[priority=27]
          - validations[priority=29]
        distinguishing_aspect: "The same unknown brand code ZZZ produces two different 422s depending on the scan point: at FILL it is ERR_BRAND_MISMATCH (priority 27 compares against the filling brewer and never asks whether the brand exists), at DISTRIBUTION it is ERR_BRAND_OWNER_UNKNOWN (priority 29 needs an owner to attribute the misdelivery to). Collapsing the two into one code fails one half of this instance."
