# =============================================================================
# Scaffold Difficulty Design — script-murder-escape-room
#
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 Difficulty
# Rules. Every grounds[] entry resolves to a declared element in SCAFFOLD.yaml.
# Every numeric assert literal was computed against the formula+constants
# pinned in SCAFFOLD.yaml §1.3.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: cancellation_refund_dual_variants_on_booking_domain
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.PENDING_DEPOSIT_to_CANCELLED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Booking.SETTLED_to_REFUNDED
          - validations[priority=18]
          - entities.Booking.fields.cancellation_initiator
          - entities.Booking.fields.refund_total_cents
        distinguishing_aspect: |
          Operates on the Booking entity domain. Two variants evaluated against the
          identical (paid_amount_cents=10000, deposit_held_cents=2000) booking produce
          different refund totals: pre_live_player_cancel at lead_minutes=180 yields
          7000 cents (50% paid + full deposit), while no_show yields 0 cents (deposit
          forfeited, paid forfeited). Same input record, different cancellation_initiator,
          different refund_total_cents.
        test_recipe:
          setup:
            - "POST /venues with deposit_policy_cents=2000, revenue split bps summing to 10000"
            - "POST /venues/{v}/rooms (capacity_min=2, capacity_max=4, turnover_minutes=30)"
            - "POST /themes with min_players=2, max_players=4, base_price_cents=5000, compatible_room_ids=[r], publish"
            - "POST /venues/{v}/rooms/{r}/session-slots starts_at=T+24h, visibility=PRIVATE_ONLY, required_seats_for_launch=2"
            - "POST /session-slots/{s}/bookings team_player_ids=[p1,p2]  (paid=10000, deposit=2000)"
            - "POST /bookings/{b}/confirm-deposit"
          trigger:
            - "Branch A: POST /_clock/advance to=T+22h45m  (lead=75m? no — keep at T+22h45m → lead_minutes=75 → falls below LATE so use T+22h00m → lead 120m)"
            - "POST /_clock/advance to=T+21h00m  (lead_minutes=180; tier LATE_CANCEL)"
            - "POST /bookings/{b}/cancel  (Player initiator)"
            - "Branch B (separate booking, fresh setup): POST /bookings/{b2}/cancel after Slot.complete fires NO_SHOW cascade"
          assert:
            - "Branch A booking.refund_total_cents == 7000  (50% of 10000 + deposit 2000)"
            - "Branch A booking.cancellation_initiator == 'PLAYER'"
            - "Branch B booking.refund_total_cents == 0"
            - "Branch B booking.cancellation_initiator == 'NO_SHOW'"
            - "Branch B player.no_show_strikes incremented by 1"

      - name: match_quorum_dual_variants_on_session_slot_domain
        grounds:
          - calculations.match_quorum
          - state_machines.SessionSlot.match_status_OPEN_to_MATCHED
          - state_machines.SessionSlot.match_status_OPEN_to_MATCH_FAILED
          - entities.SessionSlot.fields.match_status
          - entities.SessionSlot.fields.match_deadline_at
          - entities.SessionSlot.fields.confirmed_seat_count
          - entities.SessionSlot.fields.required_seats_for_launch
        distinguishing_aspect: |
          Operates on the SessionSlot entity domain (different from Rule-1-instance-1's
          Booking domain). Identical (confirmed_seat_count=1, required_seats_for_launch=2)
          on the same slot produces different match_status outcomes depending on whether
          now() < match_deadline_at (variant A — match_status stays OPEN, awaiting more
          confirmations) or now() >= match_deadline_at (variant B — match_status flips
          to MATCH_FAILED, slot cascades to CANCELLED). Identical state, different
          temporal context, different terminal axis-B value.
        test_recipe:
          setup:
            - "POST /venues, /rooms, /themes (min=2, max=4), publish"
            - "POST /venues/{v}/rooms/{r}/session-slots starts_at=T+90m, visibility=PUBLIC_TEAMUP, required_seats_for_launch=2  (match_deadline_at = T+30m)"
            - "POST /session-slots/{s}/bookings team_player_ids=[p1] (seat_count=1)"
            - "POST /bookings/{b}/confirm-deposit  (confirmed_seat_count=1, < required=2)"
          trigger:
            - "Variant A snapshot: GET /session-slots/{s}  at T+0  (now < match_deadline_at)"
            - "Variant B advance: POST /_clock/advance to=T+31m  (now >= match_deadline_at)"
            - "GET /session-slots/{s} after advance"
          assert:
            - "Variant A slot.match_status == 'OPEN'"
            - "Variant A slot.schedule_status == 'SCHEDULED'"
            - "Variant B slot.match_status == 'MATCH_FAILED'"
            - "Variant B slot.schedule_status == 'CANCELLED'"
            - "Variant B booking.status == 'CANCELLED' AND booking.cancellation_initiator == 'SYSTEM_MATCH_FAIL'"
            - "Variant B booking.refund_total_cents == 12000  (full deposit 2000 + full paid 10000 because system-cancel)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes (a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: settlement_allocation_mode_a_tiered_multiinput
        grounds:
          - calculations.settlement_allocation
          - state_machines.SettlementRun.DRAFT_to_FINALIZED
          - entities.SettlementRun.fields.gross_total_cents
          - entities.SettlementRun.fields.author_payout_cents
          - entities.SettlementRun.fields.host_payout_cents
          - entities.SettlementRun.fields.venue_payout_cents
          - entities.SettlementRun.fields.platform_fee_cents
          - entities.Theme.fields.author_royalty_bps_override
          - entities.StaffMember.fields.commission_bps_override
          - validations[priority=17]
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs (net_revenue, author_bps_resolved,
          host_bps_resolved, venue_bps_residual, platform_bps) interacting non-linearly:
          author_bps_resolved is the conditional max(theme.author_royalty_bps_override,
          venue.author_royalty_bps); host_bps_resolved branches on whether a HOST
          assignment exists; venue_bps_resolved is `max(0, 10000 - others)` and
          short-circuits to ERR_REVENUE_SPLIT_INVALID if the sum would exceed 10000.
          Three nested conditional branches drive a single per-session allocation.
        test_recipe:
          setup:
            - "POST /venues with author_royalty_bps=2000, host_commission_bps=1500, revenue_share_bps=4500, platform_fee_bps=2000  (sum=10000)"
            - "POST /staff-members host with NO commission_bps_override"
            - "POST /themes with author_royalty_bps_override=null, base_price_cents=5000, publish"
            - "POST /session-slots starts_at=T+1h, two PRIVATE_ONLY slots; book 2 seats each at price 5000 (paid=10000 per slot, net=10000 per slot)"
            - "Run full lifecycle: confirm-deposit, start, check-in, complete (both slots → SETTLED, net=10000 each)"
          trigger:
            - "POST /settlement-runs chain_id, period bracketing both slot.ends_at"
            - "POST /settlement-runs/{run}/finalize"
          assert:
            - "run.gross_total_cents == 20000"
            - "run.author_payout_cents == 4000  (2000 per session × 2)"
            - "run.host_payout_cents   == 3000  (1500 per session × 2)"
            - "run.venue_payout_cents  == 9000  (4500 per session × 2)"
            - "run.platform_fee_cents  == 4000  (2000 per session × 2; absorbs zero residue here)"
            - "Sum of payouts == run.gross_total_cents"

      - name: settlement_allocation_mode_b_rounding_order
        grounds:
          - calculations.settlement_allocation
          - state_machines.SettlementRun.DRAFT_to_FINALIZED
          - entities.SettlementRun.fields.platform_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The pinned order is
          per-session floor() then sum. Forbidden alternative (sum then floor) would
          drop a different number of cents. With net1=333, net2=333, author_bps=3333,
          per-session-floor: floor(333*3333/10000)=110 each → sum=220. Sum-then-floor
          would give floor(666*3333/10000)=floor(221.9778)=221 — a 1-cent divergence
          that flows into platform_fee_cents residue. The scaffold pins per-session
          floor; the test asserts the value the pinned order yields.
        test_recipe:
          setup:
            - "POST /venues with author_royalty_bps=3333, host_commission_bps=0, revenue_share_bps=3333, platform_fee_bps=3334  (sum=10000)"
            - "POST /themes base_price_cents=333, publish; no host commission override; no host assigned (host_bps=0 path)"
            - "Two SessionSlots; for each: book 1 seat at price 333 (paid=333, net=333 per slot)"
            - "Run lifecycle to COMPLETED on both slots"
          trigger:
            - "POST /settlement-runs covering both"
            - "POST /settlement-runs/{run}/finalize"
          assert:
            - "run.gross_total_cents == 666"
            - "run.author_payout_cents == 220  (110+110, pinned per-session floor)"
            - "run.venue_payout_cents  == 220  (110+110)"
            - "run.host_payout_cents   == 0    (no HOST assignment)"
            - "run.platform_fee_cents  == 226  (residue per session: 333-110-110-0=113 each, sum=226)"
            - "Sum of payouts == 666 == run.gross_total_cents"

      - name: spam_score_mode_c_pinned_evaluation_order
        grounds:
          - calculations.spam_score
          - state_machines.Review.PENDING_MODERATION_to_REJECTED
          - state_machines.Review.REVISED_to_PENDING_MODERATION
          - entities.Review.fields.spam_signal_count
          - entities.Review.fields.moderation_round
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by explicit evaluation order.
          Step 4 (Tier signal) reads the count of the author's REJECTED reviews — a
          quantity that itself depends on prior spam_score evaluations — but the formula
          pins "snapshot before Step 1" so the final count is well-defined. Without
          this pin, including the in-flight review in Step 4's snapshot would create
          self-reference. With short comment (len<50) + score spread 5-1=4 (>=3) +
          one prior REJECTED review (mod_round>=1) + this is a resubmit (mod_round=1),
          count = 1+1+1+1 = 4 = SPAM_SIGNAL_HARD_BLOCK → auto-REJECT.
        test_recipe:
          setup:
            - "POST /players p1; bring booking b1 to SETTLED status; submit a Review r1 with comment length 200, normal scores; ContentModerator moderates REJECT (so r1 is now in REJECTED with moderation_round=0)"
            - "PATCH /reviews/{r1} → REVISED (moderation_round=1); POST /reviews/{r1}/resubmit → PENDING; ContentModerator REJECTs again (REJECTED with moderation_round=1)"
            - "Bring a second booking b2 by same p1 to SETTLED"
          trigger:
            - "POST /bookings/{b2}/reviews comment='short' (len=5 < 50), theme_score=5, host_score=3, venue_score=1  (spread = 5-1 = 4 >= 3)"
          assert:
            - "review.spam_signal_count == 4  (Step1 short:+1, Step2 repeat=0, Step3 spread:+1, Step4 prior-rejected-with-mod_round>=1:+1, Step5 resubmit=0 since this is creation not resubmit → wait: re-evaluate)"
            - "Note: this test path produces count=3 at submission (Step5 doesn't fire on creation). The auto-block path is exercised on a SUBSEQUENT resubmit. Test asserts count==3 at creation → review.status=='PENDING_MODERATION' (>=SPAM_SIGNAL_SOFT=2 but <HARD_BLOCK=4)."
            - "review.status == 'PENDING_MODERATION'"
            - "review.spam_signal_count == 3"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: session_slot_parallel_dimensions_schedule_x_match
        grounds:
          - state_machines.SessionSlot
          - state_machines.SessionSlot.match_status_OPEN_to_MATCHED
          - state_machines.SessionSlot.match_status_OPEN_to_MATCH_FAILED
          - state_machines.SessionSlot.schedule_status_SCHEDULED_to_LIVE
          - entities.SessionSlot.fields.schedule_status
          - entities.SessionSlot.fields.match_status
        distinguishing_aspect: |
          Parallel state dimensions on a single entity (SessionSlot): schedule_status
          axis (SCHEDULED→LIVE→COMPLETED, or →CANCELLED) and match_status axis
          (OPEN→MATCHED, or →MATCH_FAILED) evolve independently. Cross-axis coupling
          requires match_status==MATCHED before schedule_status can advance to LIVE.
          Demotion path (MATCHED → OPEN) exists pre-deadline only. Match failure
          forces schedule cancellation. This is parallel-dimension non-linearity, NOT
          a linear A→B→C pipeline.
        test_recipe:
          setup:
            - "Create venue+room+theme+slot (PUBLIC_TEAMUP, required_seats_for_launch=2)"
          trigger:
            - "Confirm 2 bookings to push confirmed_seat_count==2 → cascade match_status→MATCHED"
            - "Cancel one booking back to confirmed_seat_count=1 (now < required) → cascade match_status MATCHED→OPEN"
            - "POST /_clock/advance past match_deadline_at while match_status=OPEN"
          assert:
            - "After step 1: slot.match_status == 'MATCHED' AND slot.schedule_status == 'SCHEDULED'"
            - "After step 2: slot.match_status == 'OPEN' AND slot.schedule_status == 'SCHEDULED'  (demotion observed)"
            - "After step 3: slot.match_status == 'MATCH_FAILED' AND slot.schedule_status == 'CANCELLED'  (cross-axis cascade)"

      - name: review_branching_with_revert_revision_loop
        grounds:
          - state_machines.Review
          - state_machines.Review.PENDING_MODERATION_to_REJECTED
          - state_machines.Review.REJECTED_to_REVISED
          - state_machines.Review.REVISED_to_PENDING_MODERATION
          - state_machines.Review.PUBLISHED_to_HIDDEN
          - entities.Review.fields.moderation_round
        distinguishing_aspect: |
          Branching with revert (cycle) on the Review entity — distinct from
          SessionSlot's parallel-dimension non-linearity. PENDING_MODERATION → REJECTED
          → REVISED → PENDING_MODERATION forms a cycle where the same review can
          re-enter PENDING_MODERATION after revision; PUBLISHED → HIDDEN is a
          post-terminal-looking moderator override. moderation_round increments per
          cycle; cycle is bounded by MAX_MODERATION_ROUNDS=3. This is cycle non-linearity,
          not parallel-axis non-linearity.
        test_recipe:
          setup:
            - "Bring a Booking to SETTLED; submit Review r1 (count<2 so PENDING_MODERATION)"
          trigger:
            - "POST /reviews/{r1}/moderate decision=REJECT"
            - "PATCH /reviews/{r1} body={comment: 'updated'}"
            - "POST /reviews/{r1}/resubmit"
            - "POST /reviews/{r1}/moderate decision=APPROVE"
            - "POST /reviews/{r1}/moderate decision=HIDE"
          assert:
            - "After REJECT: r1.status == 'REJECTED', r1.moderation_round == 0"
            - "After PATCH: r1.status == 'REVISED', r1.moderation_round == 1"
            - "After resubmit: r1.status == 'PENDING_MODERATION'"
            - "After APPROVE: r1.status == 'PUBLISHED'"
            - "After HIDE: r1.status == 'HIDDEN' (post-PUBLISHED override exists)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: venue_suspend_cascade_chain_depth_3
        grounds:
          - state_machines.Venue.ACTIVE_to_SUSPENDED
          - state_machines.SessionSlot.schedule_status_SCHEDULED_to_CANCELLED
          - state_machines.Booking.PENDING_DEPOSIT_to_CANCELLED
          - state_machines.WaitlistEntry.QUEUED_to_EXPIRED
          - calculations.cancellation_refund
        distinguishing_aspect: |
          Depth-≥3 transitive chain triggered by Venue.SUSPEND. Hop 1: Venue ACTIVE→SUSPENDED.
          Hop 2: that mutation cascades to SessionSlot SCHEDULED→CANCELLED for every
          SCHEDULED slot under the venue. Hop 3: each Slot CANCELLED itself triggers
          its child Bookings PENDING_DEPOSIT|CONFIRMED→CANCELLED with cancellation_initiator=VENUE
          (refund_total_cents recomputed under Variant B = 100% refund). Hop 4 (further
          link): WaitlistEntry QUEUED→EXPIRED on those slots. Each link is caused
          by the previous link, not by the original SUSPEND action directly.
        test_recipe:
          setup:
            - "Create venue v1, room r1, theme published, slot s1 (SCHEDULED), 1 confirmed booking b1, 1 queued waitlist w1"
          trigger:
            - "POST /venues/{v1}/suspend"
          assert:
            - "Venue.status == 'SUSPENDED'"
            - "Slot s1.schedule_status == 'CANCELLED'  (depth 2)"
            - "Booking b1.status == 'CANCELLED' AND b1.cancellation_initiator == 'VENUE'  (depth 3)"
            - "b1.refund_total_cents == b1.paid_amount_cents + b1.deposit_held_cents  (full refund per Variant B)"
            - "WaitlistEntry w1.status == 'EXPIRED'  (depth 4 — further confirms transitivity)"

      - name: booking_refund_cascade_chain_depth_2
        grounds:
          - state_machines.Booking.SETTLED_to_REFUNDED
          - state_machines.SettlementRun.FINALIZED_to_REVERSED
          - calculations.settlement_allocation
          - calculations.cancellation_refund
          - entities.SessionSlot.fields.net_revenue_cents
        distinguishing_aspect: |
          Depth-≥2 transitive chain originating from a DIFFERENT trigger
          (POST /bookings/{id}/refund) than Rule-4-instance-1's Venue.SUSPEND.
          Hop 1: Booking SETTLED→REFUNDED, refund_total_cents += refund_amount.
          Hop 2: that mutation triggers Slot.net_revenue_cents recompute, which itself
          triggers SettlementRun FINALIZED→REVERSED with payout fields recomputed.
          Each hop is caused by the previous hop, not by the original /refund call.
        test_recipe:
          setup:
            - "Bring Slot s1 to COMPLETED with one SETTLED booking b1 (paid=10000, deposit=2000, net=10000)"
            - "POST /settlement-runs sweeping s1 (run r1, status=DRAFT)"
            - "POST /settlement-runs/{r1}/finalize → status=FINALIZED, payouts pinned"
          trigger:
            - "POST /bookings/{b1}/refund refund_amount_cents=4000"
          assert:
            - "Booking b1.refund_total_cents == 4000  (hop 1)"
            - "Slot s1.net_revenue_cents == 6000  (10000 - 4000; hop 2a)"
            - "SettlementRun r1.status == 'REVERSED'  (hop 2b)"
            - "SettlementRun r1.author_payout_cents, host_payout_cents, venue_payout_cents, platform_fee_cents recomputed against net_revenue_cents=6000 (sum still equals new gross_total_cents=6000)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_constraint_priority
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors.ERR_SESSION_NOT_OPEN_FOR_CONFIRM
          - errors.ERR_SLOT_FULL
          - state_machines.Booking.PENDING_DEPOSIT_to_CONFIRMED
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_constraint (priority 14). When a player
          attempts to confirm-deposit on a slot that is BOTH in schedule_status=CANCELLED
          AND would push confirmed_seat_count over theme.max_players, the priority
          ordering pins ERR_SESSION_NOT_OPEN_FOR_CONFIRM (priority 5) as the winning
          error. Without the pinned order, an implementation could surface either.
        test_recipe:
          setup:
            - "Create slot with theme.max_players=2, fill it (2 CONFIRMED bookings)"
            - "Cancel the slot via POST /session-slots/{s}/cancel"
            - "Create a NEW pending booking on the same slot via POST /session-slots/{s}/bookings  (would not be receiveable; instead create a new booking via direct mock or a fresh request that survives existence check). Use the simpler path: hold a previously-created Booking in PENDING_DEPOSIT before the slot was cancelled — the cascade flips it to CANCELLED. Reset by creating a fresh booking attempt against the cancelled slot."
            - "Adjusted setup: create a player, attempt POST /session-slots/{s}/bookings → existence check passes; state check fires first because Slot.schedule_status != SCHEDULED."
          trigger:
            - "POST /session-slots/{s}/bookings  (state-violation AND would-be capacity-violation if accepted)"
          assert:
            - "Response error_id == 'ERR_SESSION_NOT_OPEN_FOR_CONFIRM' (or its booking-creation analog: spec mandates state-priority error wins). Implementation MUST surface the state error, not ERR_SLOT_FULL."

      - name: business_safety_vs_business_temporal_priority
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_PLAYER_BANNED
          - errors.ERR_MATCH_PREFERENCE_REJECTED
          - errors.ERR_SLOT_OVERLAP_CONFLICT
        distinguishing_aspect: |
          Pair: business_safety (priorities 7–8) vs business_temporal (priorities 9–10).
          When a banned player (no_show_strikes >= NO_SHOW_BAN_THRESHOLD) attempts to
          book a PUBLIC_TEAMUP slot whose preferences ALSO reject the player's
          demographics, ERR_PLAYER_BANNED (priority 7) wins over ERR_MATCH_PREFERENCE_REJECTED
          (priority 8). Different category pair from instance-1 (state vs business_constraint).
        test_recipe:
          setup:
            - "Create player p_banned with simulated no_show_strikes >= NO_SHOW_BAN_THRESHOLD (achieved by completing slots with NO_SHOW cascade)"
            - "Create PUBLIC_TEAMUP slot with match_preferences excluding p_banned's gender"
          trigger:
            - "POST /session-slots/{s}/bookings as p_banned with team=[p_banned]"
          assert:
            - "Response error_id == 'ERR_PLAYER_BANNED'  (priority 7 wins)"
            - "Response http_status == 403"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: free_cancel_lead_minutes_boundary_at_1440
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Numeric threshold boundary on cancellation_refund's lead_minutes:
          lead_minutes >= 1440 (FREE_CANCEL_LEAD_MINUTES) qualifies for full refund;
          lead_minutes == 1439 falls into LATE_CANCEL tier (50% paid). Reachable via
          POST /_clock/advance + POST /bookings/{id}/cancel.
        test_recipe:
          setup:
            - "Slot starts_at=T0+24h00m exactly, paid=10000, deposit=2000"
            - "Confirm booking at T0"
          trigger:
            - "Branch X: POST /_clock/advance to=T0  (lead = 1440m exactly) then POST /bookings/{b}/cancel"
            - "Branch Y: separate fresh setup; POST /_clock/advance to=T0+1m  (lead = 1439m), then cancel"
          assert:
            - "Branch X: booking.refund_total_cents == 12000  (full deposit + full paid)"
            - "Branch Y: booking.refund_total_cents == 7000  (full deposit + 50% paid)"
            - "The single-minute boundary swing produces a 5000-cent delta — confirms >= vs > precision"

      - name: empty_collection_boundary_on_settlement_run_sweep
        grounds:
          - calculations.settlement_allocation
          - entities.SettlementRun.fields.included_session_ids
          - state_machines.SettlementRun.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Empty-set boundary on a DIFFERENT metric (collection size on a DIFFERENT
          endpoint). When POST /settlement-runs is invoked with a period containing
          ZERO completed sessions, included_session_ids must be []; gross_total_cents
          and all payouts must be 0; finalize must STILL succeed (a 0-payout
          finalization is valid). Tests the empty-pool edge.
        test_recipe:
          setup:
            - "Create venue+chain; do NOT complete any sessions in the period"
          trigger:
            - "POST /settlement-runs chain_id=c1, period_starts_at=P0, period_ends_at=P1  (no completed slots inside)"
            - "POST /settlement-runs/{run}/finalize"
          assert:
            - "run.included_session_ids == []"
            - "run.gross_total_cents == 0"
            - "run.author_payout_cents == 0"
            - "run.host_payout_cents == 0"
            - "run.venue_payout_cents == 0"
            - "run.platform_fee_cents == 0"
            - "run.status == 'FINALIZED'  (empty sweep is legal, NOT an error)"

      - name: zero_quantity_boundary_on_refund_cap
        grounds:
          - validations[priority=18]
          - errors.ERR_REFUND_EXCEEDS_PAID
          - state_machines.Booking.SETTLED_to_REFUNDED
        distinguishing_aspect: |
          Boundary on refund_amount_cents <= paid_amount_cents - refund_total_cents on
          the POST /bookings/{id}/refund endpoint (different endpoint than the lead-
          minutes boundary, different metric). With paid=10000 and existing
          refund_total=10000, a request of refund_amount_cents=1 must reject; a request
          of refund_amount_cents=0 (zero-quantity edge) is permitted as a no-op or
          400 ERR_INVALID_REQUEST per scaffold (scaffold: refund_amount must be >0;
          test asserts 400). The exactly-equal case (refund 5000 when remaining=5000)
          must succeed.
        test_recipe:
          setup:
            - "Bring booking to SETTLED status (paid=10000, refund_total=0)"
          trigger:
            - "Branch P: POST /bookings/{b}/refund refund_amount_cents=10000  (==remaining; should succeed)"
            - "Then Branch Q: POST /bookings/{b}/refund refund_amount_cents=1  (now exceeds remaining=0)"
          assert:
            - "Branch P: response 200; b.refund_total_cents == 10000; b.status == 'REFUNDED'"
            - "Branch Q: response 422 with error_id == 'ERR_REFUND_EXCEEDS_PAID'"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: session_slot_start_depends_on_match_status_within_same_entity_AND_venue_status_cross_entity
        grounds:
          - state_machines.SessionSlot.schedule_status_SCHEDULED_to_LIVE
          - state_machines.Venue.ACTIVE_to_SUSPENDED
          - errors.ERR_VENUE_NOT_ACTIVE
          - errors.ERR_SESSION_NOT_MATCHED
        distinguishing_aspect: |
          Cross-entity pair: SessionSlot ↔ Venue. Slot.start (schedule_status SCHEDULED→LIVE)
          requires Venue.status==ACTIVE. Independently of Slot's own match_status,
          if the Venue is SUSPENDED (or CLOSED), Slot.start fails with
          ERR_VENUE_NOT_ACTIVE. This is a pure cross-entity precondition: the slot
          itself is in a perfectly valid SCHEDULED/MATCHED state, but its parent
          venue's state vetoes the transition.
        test_recipe:
          setup:
            - "Create venue v, room r, theme published, slot s with schedule=SCHEDULED, match=MATCHED, all staff SCHEDULED"
            - "POST /venues/{v}/suspend → Venue.status=SUSPENDED (cascade auto-cancels s ... wait — but cascade per scaffold cancels slot. To exercise the precondition without cascade, simulate the race: confirm Venue is SUSPENDED via direct state set, OR re-resume then re-suspend with a fresh slot tightly in time. Simpler: use Venue.CLOSED block path? no, CLOSED requires no open sessions. Cleanest: skip suspend; instead inject venue.status=SUSPENDED via the explicit endpoint just before start using the slot freshly created and never cascaded — verify the cascade fires and start is rejected because the slot itself was cancelled. Both errors are observable; test asserts the error chain."
          trigger:
            - "After SUSPEND: POST /session-slots/{s}/start"
          assert:
            - "Response error_id IN {'ERR_VENUE_NOT_ACTIVE', 'ERR_SLOT_NOT_FOUND' (if cascade-cancel happened first leaving slot CANCELLED), 'ERR_SESSION_NOT_OPEN_FOR_CONFIRM'-equivalent for start}"
            - "More specifically — scaffold pins: Venue.SUSPEND cascades to Slot CANCELLED, so subsequent POST /start returns ERR_SESSION_NOT_OPEN_FOR_CONFIRM-class error (slot.schedule_status != SCHEDULED). The cross-entity dependency manifests via the cascade. Test asserts: slot.schedule_status == 'CANCELLED' before /start; /start returns 409 with state-error referencing Slot's status."

      - name: staff_assignment_depends_on_chain_id_match_with_venue
        grounds:
          - validations[priority=6]
          - errors.ERR_STAFF_CHAIN_MISMATCH
          - entities.StaffMember.fields.chain_id
          - entities.Venue.fields.chain_id
        distinguishing_aspect: |
          Cross-entity pair: StaffMember ↔ Venue (different pair from instance-1's
          SessionSlot↔Venue). A StaffAssignment is valid only when StaffMember.chain_id
          equals slot.venue.chain_id. If a HOST registered to chain "A" is assigned
          to a slot under venue in chain "B", the operation fails with
          ERR_STAFF_CHAIN_MISMATCH regardless of qualifications, weekly-minutes, or
          overlap state.
        test_recipe:
          setup:
            - "Create venue v_A in chain_id='A', and slot s_A under it"
            - "Create staff member m_B with chain_id='B', roles_held=['HOST'], qualifications matching theme"
          trigger:
            - "POST /staff-assignments slot_id=s_A.id, staff_member_id=m_B.id, role_type=HOST"
          assert:
            - "Response error_id == 'ERR_STAFF_CHAIN_MISMATCH'"
            - "Response http_status == 422"
            - "No StaffAssignment row created"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: session_slot_overlap_with_turnover_extended_interval
        grounds:
          - calculations.session_slot_overlap
          - errors.ERR_SLOT_OVERLAP_CONFLICT
          - errors.ERR_MAINTENANCE_OVERLAP_CONFLICT
          - entities.Room.fields.turnover_minutes
        distinguishing_aspect: |
          Interval semantics #1 — closed-open intervals on Room with an asymmetric
          forward-extending guard (turnover_minutes added to slot.ends_at but NOT to
          maintenance.ends_at). Touching back-to-back without turnover gap is
          forbidden between two slots; back-to-back is permitted between a slot and
          a maintenance window starting exactly at slot.ends_at + turnover. Distinct
          interval geometry from staff_overlap.
        test_recipe:
          setup:
            - "Room r with turnover_minutes=30"
            - "Existing slot s1 [T0, T0+90m), so s1.ends_at + turnover = T0+120m"
          trigger:
            - "POST /venues/{v}/rooms/{r}/session-slots starts_at=T0+90m  (overlap with s1's turnover guard)"
            - "POST /venues/{v}/rooms/{r}/session-slots starts_at=T0+120m  (clean, no overlap)"
            - "POST /venues/{v}/rooms/{r}/maintenance-windows starts_at=T0+90m, ends_at=T0+100m  (overlaps with turnover guard since slot side gets +30m)"
          assert:
            - "First call: 409 ERR_SLOT_OVERLAP_CONFLICT  (proposed [T0+90m, ...) intersects [T0, T0+120m) per turnover-extended s1)"
            - "Second call: 201 (no overlap)"
            - "Third call: 409 ERR_MAINTENANCE_OVERLAP_CONFLICT  (turnover applies to slot side only, but here proposed maintenance ∩ s1's extended interval is non-empty)"

      - name: staff_overlap_no_buffer_back_to_back_allowed
        grounds:
          - calculations.staff_overlap
          - errors.ERR_STAFF_OVERLAP_CONFLICT
          - entities.StaffAssignment
        distinguishing_aspect: |
          Interval semantics #2 — closed-open intervals on StaffMember with NO buffer
          between assignments (touching back-to-back is permitted; forbidden is strict
          overlap). Distinct from session_slot_overlap because there is no asymmetric
          turnover guard. Resource entity (StaffMember) and interval geometry both
          differ from instance-1.
        test_recipe:
          setup:
            - "StaffMember m1 (HOST, qualifications match theme)"
            - "Slot s1 [T0, T0+60m) and slot s2 [T0+60m, T0+120m), both staffable"
            - "Assign m1 to s1 → SCHEDULED assignment"
          trigger:
            - "POST /staff-assignments slot_id=s2, staff_member_id=m1, role_type=HOST  (touching, no overlap)"
            - "POST /staff-assignments slot_id=s3 [T0+30m, T0+90m), staff_member_id=m1  (strict overlap)"
          assert:
            - "First call (touching): 201 — back-to-back is allowed; both assignments coexist for m1"
            - "Second call (strict overlap): 409 ERR_STAFF_OVERLAP_CONFLICT"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: deposit_conservation_on_cancel_then_promote
        grounds:
          - state_machines.Booking.PENDING_DEPOSIT_to_CANCELLED
          - state_machines.WaitlistEntry.QUEUED_to_PROMOTED
          - calculations.cancellation_refund
          - calculations.waitlist_promotion
          - entities.Booking.fields.deposit_held_cents
        distinguishing_aspect: |
          Conserved quantity #1 — TOTAL deposit cents held against the slot. Forward
          action (Booking PENDING_DEPOSIT → CANCELLED with deposit refunded) plus
          compensating waitlist promotion (creating a new Booking in PENDING_DEPOSIT
          with equal deposit_held_cents) MUST leave the named invariant unchanged:
          sum(deposit_held_cents) over Bookings in {PENDING_DEPOSIT, CONFIRMED, SETTLED} for
          the slot equals (n_seats_taken_post * venue.deposit_policy_cents). This pins
          deposit conservation as an explicit equality.
        test_recipe:
          setup:
            - "Slot, theme.max_players=4, venue.deposit_policy_cents=2000"
            - "Two confirmed bookings b1 (2 seats), b2 (2 seats); confirmed_seat_count=4 — slot full"
            - "WaitlistEntry w1 requested_seat_count=2, priority=STANDARD"
            - "Pre-condition snapshot: total_deposits_held = (b1.deposit + b2.deposit) = 4*2000 = 8000"
          trigger:
            - "POST /bookings/{b1}/cancel (lead_minutes>=1440, full refund Variant A)"
          assert:
            - "Post-cancel: b1.status=='CANCELLED', deposit_refund_cents=4000 (b1's deposit)"
            - "Waitlist sweep PROMOTEd w1 → new Booking b3 in PENDING_DEPOSIT with deposit_held_cents=4000"
            - "Invariant: sum(deposit_held_cents for Bookings in {PENDING_DEPOSIT, CONFIRMED, SETTLED} on this slot) == 4*2000 == 8000  (unchanged from pre-state)"

      - name: revenue_conservation_on_refund_settlement_reversal
        grounds:
          - state_machines.Booking.SETTLED_to_REFUNDED
          - state_machines.SettlementRun.FINALIZED_to_REVERSED
          - calculations.settlement_allocation
          - entities.SessionSlot.fields.net_revenue_cents
        distinguishing_aspect: |
          Conserved quantity #2 — gross_total_cents == author_payout + host_payout +
          venue_payout + platform_fee on a SettlementRun after the post-refund
          reversal cascade. Different conserved quantity (revenue cents across four
          tiers) than instance-1's deposit-cents quantity. Forward action (refund)
          plus compensating allocation recompute (REVERSED status) must leave the
          run-level sum invariant: payouts always sum to gross_total_cents.
        test_recipe:
          setup:
            - "Single SETTLED booking, paid=10000, no host commission override, venue split: author 2000 / host 1500 / venue 4500 / platform 2000"
            - "POST /settlement-runs covering slot → run.status=DRAFT, payouts pinned (author=2000, host=1500, venue=4500, platform=2000)"
            - "POST /settlement-runs/{run}/finalize → status=FINALIZED"
            - "Pre-refund invariant: 2000+1500+4500+2000 == 10000 == gross_total_cents (HOLDS)"
          trigger:
            - "POST /bookings/{b}/refund refund_amount_cents=4000"
          assert:
            - "Post-refund: Slot.net_revenue_cents == 6000"
            - "SettlementRun.status == 'REVERSED'"
            - "Recomputed: author = floor(6000*2000/10000) = 1200, host = floor(6000*1500/10000) = 900, venue = floor(6000*4500/10000) = 2700, platform = 6000 - 1200 - 900 - 2700 = 1200"
            - "Invariant after compensation: 1200 + 900 + 2700 + 1200 == 6000 == new gross_total_cents (HOLDS)"
            - "Invariant unchanged in form (sum of tiers == gross_total_cents) despite the value change"
