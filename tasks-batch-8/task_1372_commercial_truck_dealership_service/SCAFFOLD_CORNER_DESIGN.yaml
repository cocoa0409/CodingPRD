  # ==================================================================
  # Section: validations
  # ==================================================================
  - section: validations
    instances:
      - name: booking_on_out_of_service_resource_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_RESOURCE_OUT_OF_SERVICE]"]
        distinguishing_aspect: "A bay flipped OUT_OF_SERVICE rejects new bookings with ERR_RESOURCE_OUT_OF_SERVICE even inside operating hours with no overlap; flipping back ACTIVE restores bookability."
        test_recipe:
          setup: ["RETAIL account; RO; bay created ACTIVE then set OUT_OF_SERVICE"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "OosCo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042817", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "D2", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bays/${bay_id}/set-status", payload: { status: "OUT_OF_SERVICE" }, as: ServiceManager }
          trigger:
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z" }, as: ServiceAdvisor, captures: { err: $.data.error_id } }
            - { call: "POST /dealership/service-bays/${bay_id}/set-status", payload: { status: "ACTIVE" }, as: ServiceManager }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z" }, as: ServiceAdvisor, captures: { bk: $.data.id } }
          assert:
            - "OUT_OF_SERVICE: error_id == ERR_RESOURCE_OUT_OF_SERVICE (409)"
            - "after ACTIVE: booking created"
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Missing X-User-Role -> 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /dealership/units/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: "__NO_HEADERS__", captures: { err: $.data.error_id } }
          assert:
            - "http 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (auth beats the 404 the path would otherwise produce)"
      - name: role_denied_on_exclusive_endpoint
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]", roles]
        distinguishing_aspect: "PartsCounterRep cannot create factory orders; ServiceAdvisor cannot adjudicate claims — role check precedes existence."
        test_recipe:
          setup: ["pool exists"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-10", vocation_group: "STANDARD", capacity: 2 }, as: SalesManager, captures: { slot_id: $.data.id } }
          trigger:
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: PartsCounterRep, captures: { err: $.data.error_id } }
          assert:
            - "http 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
      - name: fleet_customer_cannot_act_on_other_accounts_appraisal
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_INSUFFICIENT_PERMISSIONS]", "roles[FleetCustomer]"]
        distinguishing_aspect: "Ownership: FleetCustomer X-User-ID must equal appraisal.customer_account_id; a different customer accepting gets 403."
        test_recipe:
          setup: ["accounts A and B; appraisal for A in OFFERED"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "OwnA", account_type: "FLEET", credit_limit_cents: 50000000 }, as: SalesManager, captures: { acct_a: $.data.id } }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "OwnB", account_type: "FLEET", credit_limit_cents: 50000000 }, as: SalesManager, captures: { acct_b: $.data.id } }
            - { call: "POST /dealership/trade-appraisals", payload: { customer_account_id: "${acct_a}", trade_vin: "3AKJHHDR5LSMW4455", model_year: 2023, mileage: 90000, condition_grade: "A", base_book_value_cents: 7000000 }, as: SalesConsultant, captures: { appr_id: $.data.id } }
            - { call: "POST /dealership/trade-appraisals/${appr_id}/offer", payload: { market_index_bp: 10000, offered_allowance_cents: 4900000 }, as: SalesManager }
          trigger:
            - { call: "POST /dealership/trade-appraisals/${appr_id}/accept", payload: {}, as: FleetCustomer, as_user_id: "${acct_b}", captures: { err: $.data.error_id } }
          assert:
            - "http 403 ERR_INSUFFICIENT_PERMISSIONS; appraisal remains OFFERED"
      - name: segregation_of_duties_on_adjudication
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.WarrantyClaim.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "The user who submitted the claim cannot adjudicate it, even holding the OEMClaimsAdjudicator role: X-User-ID == submitted_by_user_id -> 403 ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["RO INVOICED (RETAIL, one eligible 16500 labor line); claim submitted by wadmin-1"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "SoDCo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042807", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 1.0, warranty_eligible: true, description: "l" }, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/submit-estimate", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/approve-estimate", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}" }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "C5", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z" }, as: ServiceAdvisor, captures: { bk_id: $.data.id } }
            - { call: "POST /dealership/service-bookings/${bk_id}/check-in", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/start-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/complete-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/invoice", payload: {}, as: ServiceManager }
            - { call: "POST /dealership/warranty-claims", payload: { repair_order_id: "${ro_id}", claimed_labor_cents: 16500, claimed_parts_cents: 0 }, as: WarrantyAdministrator, captures: { claim_id: $.data.id } }
            - { call: "POST /dealership/warranty-claims/${claim_id}/submit", payload: {}, as: WarrantyAdministrator, as_user_id: "wadmin-1" }
          trigger:
            - { call: "POST /dealership/warranty-claims/${claim_id}/adjudicate", payload: { outcome: "APPROVE" }, as: OEMClaimsAdjudicator, as_user_id: "wadmin-1", captures: { err: $.data.error_id } }
          assert:
            - "http 403 and error_id == ERR_SEGREGATION_OF_DUTIES (same person submitted and adjudicated)"
            - "claim remains SUBMITTED"
      - name: upfit_compatibility_and_dependency_rules
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_UPFIT_INCOMPATIBLE]", "errors[ERR_UPFIT_DEPENDENCY_MISSING]"]
        distinguishing_aspect: "Safety gate: CRANE_PTO on a STANDARD pool order -> ERR_UPFIT_INCOMPATIBLE; LIFTGATE without VAN_BODY/REEFER_BOX -> ERR_UPFIT_DEPENDENCY_MISSING; adding LIFTGATE after VAN_BODY succeeds."
        test_recipe:
          setup: ["STANDARD pool; order1 on it; SEVERE pool; order2 on it"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-10", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_std: $.data.id } }
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-10", vocation_group: "SEVERE", capacity: 5 }, as: SalesManager, captures: { slot_sev: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_std}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { o_std: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_sev}", chassis_model: "SD_114", engine_option: "DD15", axle_config: "A6X4" }, as: SalesConsultant, captures: { o_sev: $.data.id } }
          trigger:
            - { call: "POST /dealership/factory-orders/${o_std}/upfit-lines", payload: { component_code: "CRANE_PTO", price_cents: 950000 }, as: SalesConsultant, captures: { e1: $.data.error_id } }
            - { call: "POST /dealership/factory-orders/${o_sev}/upfit-lines", payload: { component_code: "LIFTGATE", price_cents: 120000 }, as: SalesConsultant, captures: { e2: $.data.error_id } }
            - { call: "POST /dealership/factory-orders/${o_sev}/upfit-lines", payload: { component_code: "VAN_BODY", price_cents: 900000 }, as: SalesConsultant }
            - { call: "POST /dealership/factory-orders/${o_sev}/upfit-lines", payload: { component_code: "LIFTGATE", price_cents: 120000 }, as: SalesConsultant, captures: { ok: $.data.id } }
          assert:
            - "e1 == ERR_UPFIT_INCOMPATIBLE (CRANE_PTO requires SEVERE)"
            - "e2 == ERR_UPFIT_DEPENDENCY_MISSING (LIFTGATE without VAN_BODY/REEFER_BOX)"
            - "after adding VAN_BODY, LIFTGATE add succeeds and order upfit_lines has 2 entries"
      - name: spec_freeze_blocks_upfit_after_commit
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SPEC_FROZEN]"]
        distinguishing_aspect: "Upfit add is legal in SLOT_HELD but rejected once COMMITTED (spec freeze), even for a compatible component."
        test_recipe:
          setup: ["STANDARD pool; order committed"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-10", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
          trigger:
            - { call: "POST /dealership/factory-orders/${order_id}/upfit-lines", payload: { component_code: "VAN_BODY", price_cents: 900000 }, as: SalesConsultant, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SPEC_FROZEN; order upfit_lines remains empty"
      - name: booking_resource_selection_exactly_one
