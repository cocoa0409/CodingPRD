# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CouncilAdmin
    description: "Council staff administering the cookie program: seasons, products, purchase orders, order confirmation, reconciliation, recalls, lottery draws, forfeitures, refunds"
    identity: opaque
    exclusive_operations:
      - "season lifecycle transitions (open, begin-reconciliation, close-out, cancel)"
      - "product/site/purchase-order/recall creation and activation"
      - "order confirm/reject/fulfill"
      - "transfer complete"
      - "booth slot creation, lottery draw, manual approve"
      - "digital order refund"
      - "agreement forfeit and dispute resolution"
      - "clock set"
    shared_operations:
      - "deposit recording"
      - "transfer creation and ship-sign (cupboard side)"
      - "list/read endpoints"

  - name: TroopLeader
    description: "Leader of a specific troop: places orders, requests transfers and booths, manages digital orders and participant agreements for own troop only"
    identity: "entity_backed:Troop"
    exclusive_operations:
      - "order create/line-add/submit for own troop"
      - "booth request create/cancel for own troop"
      - "transfer ship/receive signing for own troop"
      - "digital order create/record-payment/mark-uncollected/mark-delivered/cancel for own troop"
      - "agreement create/settle/dispute for own troop"
    shared_operations:
      - "deposit recording"
      - "transfer creation"
      - "list/read endpoints"
