            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, as_user_id: "adm-1", captures: { phase: $.data.phase } }
          assert:
            - "tally.quorum_required == 2  (ceil(4 * 50 / 100))"
            - "tally.quorum_met == true with ballots_cast_count == 2 (exact equality passes the >= boundary)"
            - "GivingCycle.${cycle_id}.phase == AWARD"

      - name: session_full_at_capacity_rejects
        grounds:
          - validations[priority=14]
          - errors[ERR_SESSION_FULL]
          - entities.LearningSession.fields.seats_taken
        distinguishing_aspect: |
          Metric: seat count via a different endpoint (RSVP, not cycle advance)
          — the boundary is strict less-than: the RSVP that would make
          seats_taken == capacity (2 == 2) is rejected with ERR_SESSION_FULL.
        test_recipe:
          setup:
            - "Cycle (DRAFT is fine; sessions carry no phase gate) with session capacity 2; three ACTIVE memberships"
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle BP2", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id } }
