scaffold_corner_design:
  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: pad_missing_code_returns_invalid_request
        claim_type: required_field_validation
        grounds: [entities.DeicePad.fields.code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field code on pad creation is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Station exists"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
          trigger:
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", max_size_class: "SMALL", rated_collection_pct: 60 }, as: StationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status 400"

      - name: pad_invalid_enum_returns_invalid_request
        claim_type: enum_constraint
        grounds: [entities.DeicePad.fields.max_size_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "max_size_class 'HUGE' is outside the declared enum {SMALL, MEDIUM, LARGE} and is rejected."
        test_recipe:
          setup: ["Station exists"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
          trigger:
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "HUGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status 400"

      - name: request_defaults_and_computed_estimate_applied
        claim_type: default_applied
        grounds: [entities.DeiceRequest.fields.priority, entities.DeiceRequest.fields.estimated_liters, entities.DeiceRequest.fields.status]
        distinguishing_aspect: "Omitting priority defaults it to SCHEDULED; estimated_liters is computed 500 for MEDIUM and initial status is QUEUED with a successful tank reservation."
        test_recipe:
          setup: ["Station with TYPE_I tank (5000 L) and airline"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin, captures: { tk: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
          trigger:
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { pr: $.data.priority, est: $.data.estimated_liters, stt: $.data.status, frs: $.data.fluid_reservation_status, tid: $.data.assigned_tank_id } }
          assert:
            - "priority == SCHEDULED (default applied)"
            - "estimated_liters == 500 (MEDIUM), computed, any client-supplied value ignored"
            - "status == QUEUED (initial state) and fluid_reservation_status == RESERVED with assigned_tank_id == ${tk}"

      - name: operation_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent operation id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /deice-ops/deice-operations/123e4567-e89b-42d3-a456-426614174000", as: StationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status 404"

      - name: inspection_is_immutable_event
        claim_type: immutability
        grounds: [entities.Inspection]
        distinguishing_aspect: "Inspection has common_fields: false — its create response carries id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Station with ACTIVE permit, tank, LARGE pad, airline; request assigned (op PLANNED)"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq}", as: PadOperator, captures: { op: "$.data[0].id" } }
          trigger:
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1", captures: { iid: $.data.id } }
          assert:
            - "Response data contains id, created_at, operation_id, kind, result, inspector_id"
            - "Response data has NO version and NO updated_at keys (event entity, common_fields: false)"

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: complete_from_planned_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DeiceOperation.PLANNED_to_SPRAYING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete is only declared from SPRAYING; calling it on a PLANNED operation is rejected with ERR_INVALID_STATE and records nothing."
        test_recipe:
          setup: ["Station with ACTIVE permit, tank, LARGE pad, airline; request assigned (op PLANNED)"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin, captures: { tk: $.data.id } }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq}", as: PadOperator, captures: { op: "$.data[0].id" } }
          trigger:
            - { call: "POST /deice-ops/deice-operations/${op}/complete", payload: { actual_liters: 100, collected_liters: 60 }, as: PadOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (HTTP 409)"
            - "FluidTank.${tk}.on_hand_liters remains 5000 (no side effects fired)"

      - name: completed_request_is_terminal_for_abort
        claim_type: terminal_lockdown
        grounds: [state_machines.DeiceRequest]
        distinguishing_aspect: "COMPLETED is terminal: aborting a request whose operation cleared is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Full flow: request COMPLETED via cleared operation"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq}", as: PadOperator, captures: { op: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op}/start", payload: { oat_celsius: 0 }, as: PadOperator }
            - { call: "POST /deice-ops/deice-operations/${op}/complete", payload: { actual_liters: 300, collected_liters: 200 }, as: PadOperator }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "POST_TREATMENT", result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /deice-ops/deice-requests/${rq}/abort", payload: {}, as: PadOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; request remains COMPLETED"

      - name: assign_creates_planned_operation_and_marks_pad
        claim_type: side_effect_execution
        grounds: [state_machines.DeiceRequest.QUEUED_to_ASSIGNED, entities.DeiceOperation]
        distinguishing_aspect: "assign's side effects are observable: exactly one DeiceOperation PLANNED exists for the request, carrying the request's tank, and the request exposes assigned_pad_id."
        test_recipe:
          setup: ["Station with ACTIVE permit, TYPE_I tank, LARGE pad, airline, RESERVED request"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin, captures: { tk: $.data.id } }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
          trigger:
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator, captures: { apd: $.data.assigned_pad_id, stt: $.data.status } }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq}", as: PadOperator, captures: { op_st: "$.data[0].status", op_tk: "$.data[0].tank_id", op_est: "$.data[0].estimated_liters" } }
          assert:
            - "Response: status == ASSIGNED and assigned_pad_id == ${pd}"
            - "Exactly one operation exists for the request: status PLANNED, tank_id == ${tk}, estimated_liters == 500"
            - "Pad remains AVAILABLE until spray start (occupancy begins at start, not assign)"

      - name: out_of_service_pad_rejects_assignment
        claim_type: guarded_transition
        grounds: [state_machines.DeicePad.AVAILABLE_to_OUT_OF_SERVICE, "errors[ERR_PAD_NOT_AVAILABLE]"]
        distinguishing_aspect: "Cross-entity guard (Request assign × Pad state): a pad in OUT_OF_SERVICE is not eligible; assign fails with ERR_PAD_NOT_AVAILABLE even though posture is NORMAL."
        test_recipe:
          setup: ["Station with ACTIVE permit, tank, LARGE pad taken OUT_OF_SERVICE, airline, RESERVED request"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/pads/${pd}/take_out_of_service", payload: {}, as: StationAdmin }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
          trigger:
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PAD_NOT_AVAILABLE; request stays QUEUED"

      - name: queued_request_expires_after_two_ops_epochs
        claim_type: auto_transition
        grounds: [calculations.ops_checkpoint, state_machines.DeiceRequest]
        distinguishing_aspect: "The ops checkpoint is the only path to EXPIRED: after the first checkpoint the request survives (epochs_in_queue 1); the second checkpoint expires it and releases its reservation."
        test_recipe:
          setup: ["Station with ACTIVE permit, TYPE_I tank (5000 L), airline; RESERVED MEDIUM request QUEUED"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin, captures: { tk: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
          trigger:
            - { call: "POST /deice-ops/stations/${st}/run_ops_checkpoint", payload: {}, as: StationAdmin, captures: { ep1: $.data.ops_epoch_index } }
            - { call: "GET /deice-ops/deice-requests/${rq}", as: PadOperator, captures: { s1: $.data.status, eq1: $.data.epochs_in_queue } }
            - { call: "POST /deice-ops/stations/${st}/run_ops_checkpoint", payload: {}, as: StationAdmin, captures: { ep2: $.data.ops_epoch_index } }
            - { call: "GET /deice-ops/deice-requests/${rq}", as: PadOperator, captures: { s2: $.data.status } }
            - { call: "GET /deice-ops/fluid-tanks/${tk}", as: PadOperator, captures: { res: $.data.reserved_liters } }
          assert:
            - "After checkpoint 1: ops_epoch_index == 1, request status QUEUED, epochs_in_queue == 1"
            - "After checkpoint 2: ops_epoch_index == 2, request status EXPIRED"
            - "Reservation released: tank reserved_liters == 0 and available_liters == 5000"

      - name: permit_expires_at_checkpoint_past_effective_to
        claim_type: auto_transition
        grounds: [state_machines.DischargePermit.ACTIVE_to_EXPIRED, calculations.ops_checkpoint]
        distinguishing_aspect: "A permit whose effective_to lies before the logical clock auto-transitions ACTIVE → EXPIRED at the checkpoint, driving station posture to PERMIT_SUSPENDED."
        test_recipe:
          setup: ["Station with ACTIVE permit effective_to 2026-05-02; logical clock advanced to 2026-05-03"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-05-02T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin, captures: { pm: $.data.id } }
            - { call: "POST /deice-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: StationAdmin }
          trigger:
            - { call: "POST /deice-ops/stations/${st}/run_ops_checkpoint", payload: {}, as: StationAdmin, captures: { posture: $.data.posture } }
            - { call: "GET /deice-ops/discharge-permits/${pm}", as: EnvironmentalOfficer, captures: { pst: $.data.status } }
          assert:
            - "DischargePermit.${pm}.status == EXPIRED"
            - "Station posture == PERMIT_SUSPENDED (no ACTIVE permit remains)"

  # =================================================================
  # Section: calculations
  # =================================================================
  - section: calculations
    instances:
      - name: holdover_type_i_snow_light_uses_table_constant
        claim_type: constants_applied
        grounds: [calculations.holdover_time]
        distinguishing_aspect: "An ACTIVE event with precip_rate LIGHT selects the TABLE variant: TYPE_I + SNOW at oat -5 yields exactly the table constant 25 minutes."
        test_recipe:
          setup: ["Station with ACTIVE permit, TYPE_I tank, LARGE pad, airline; ACTIVE SNOW/LIGHT/LEVEL_1 event; request assigned with acceptance PASS"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
