        claim_type: cascading_side_effects
        grounds: ["state_machines.CallbackClaim.APPROVED_WARRANTY_to_RESOLVED_REPAIRED", "state_machines.WarrantyCoverage.ACTIVE_to_SUPERSEDED", "calculations.warranty_credit_cents", "calculations.invoice_total_cents", "entities.WorkOrder.fields.origin_callback_claim_id"]
        distinguishing_aspect: |
          Completing a REMEDY work order fires the branch of CASCADE-C-3 that only runs
          when origin_callback_claim_id is set: the claimed PART coverage moves ACTIVE
          -> SUPERSEDED with superseded_by_id pointing at the freshly minted PART
          coverage, the CallbackClaim moves APPROVED_WARRANTY -> RESOLVED_REPAIRED, the
          ORIGINAL work order's callback_eligibility becomes CONSUMED, and the remedy
          invoice credits BOTH windows because the claim was submitted 30 days after
          completion (30 <= 365 and 30 <= 90). Arithmetic: remedy parts
          round_half_up(5000*1.60) = 8000, remedy labor MASTER STANDARD 13500,
          warranty_credit 21500, pre-discount 8000 + 13500 + 0 + 0 - 21500 = 0,
