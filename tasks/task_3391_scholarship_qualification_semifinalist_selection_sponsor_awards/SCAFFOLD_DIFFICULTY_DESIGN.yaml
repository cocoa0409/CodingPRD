        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_CYCLE_NOT_ACCEPTING_ENTRIES]
          - errors[ERR_DUPLICATE_ENTRY]
        distinguishing_aspect: |
          Error-category pair (state, business_constraint): the same request violates both the
          posture gate (cycle is ENTRY_CLOSED) and the uniqueness rule (student already has an
          entry in this cycle); priority 6 state beats priority 7 constraint, so the response
          is ERR_CYCLE_NOT_ACCEPTING_ENTRIES, never ERR_DUPLICATE_ENTRY.
