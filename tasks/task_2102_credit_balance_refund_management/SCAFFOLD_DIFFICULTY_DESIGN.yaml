          setup:
            - "A MEDICARE payer with take_back_allowed true and one account OF1 charged +10000 on 2026-08-01 and paid -14000 by the PAYER on 2026-08-05, leaving a 4000-cent credit identified 2026-08-15 and attributed PROPORTIONAL to payer_portion_cents 4000."
