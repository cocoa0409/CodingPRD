          - "errors[ERR_SAMPLE_REQUEST_MISMATCH]"
          - "complexity_profile.entity_topology"
        distinguishing_aspect: "In a flat topology both FKs are independently valid, so cross-reference integrity needs its own rule: a sample drawn for request A may not carry a determination filed against request B, even though both ids resolve."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; a DESIGNATED area with an APPROVED SAMPLING_DEVICE and an inspector holding SAMPLING and GRADING."
            - "Two CORN requests, each with its own SEALED sample of 2 portions."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Delta River Elevator", account_code: "DRE-103", contact_email: "ops@delta.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1107", full_name: "G. Grader", endorsements: ["SAMPLING", "GRADING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-XREF", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-XREF-A", declared_quantity_bushels: 4000, requested_services: ["GRADING"] }
              captures: { req_a: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req_a}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-XREF-A", portions_count: 2 }
              captures: { smp_a: "$.data.id" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-XREF-B", declared_quantity_bushels: 4000, requested_services: ["GRADING"] }
              captures: { req_b: "$.data.id" }
            - call: POST /grain-inspection/samples
