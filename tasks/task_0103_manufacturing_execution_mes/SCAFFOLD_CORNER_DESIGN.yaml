  - section: calculations
    instances:
      - name: oee_quality_above_floor_not_flagged
        claim_type: Constants Applied
        grounds: [calculations.machine_quality_flag, entities.Machine.fields.quality_flagged]
        distinguishing_aspect: "good 191 / total 200 -> Q=0.9550 > QUALITY_FLOOR 0.95 -> quality_flagged false (strict above-floor case)."
        test_recipe:
          setup: ["Machine with one log run 10000 total 200 good 191."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { machine_code: "M-QF", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /machines/${m_id}/run-logs"
              payload: { window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-06-01T04:00:00.000Z", run_time_secs: 10000, total_units: 200, good_units: 191 }
              as: MachineOperator
          trigger:
            - call: "POST /machines/${m_id}/recompute-oee"
              payload: {}
              as: QualityInspector
              captures: { q: $.data.oee_quality, flag: $.data.quality_flagged }
          assert:
            - "Machine.${m_id}.oee_quality == 0.9550"
            - "Machine.${m_id}.quality_flagged == false"

