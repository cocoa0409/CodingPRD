  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: hotel_attrition_penalty_below_allowance
        claim_type: threshold_boundary
        grounds: ["calculations.hotel_attrition_penalty"]
        distinguishing_aspect: "Occupancy exactly AT the attrition allowance yields zero penalty; one room below yields penalty equal to rate*nights"
        test_recipe:
          setup:
            - "Block room_count=10, attrition_allowance_pct=20 => allowed_slippage=2"
            - "8 rooms occupied => occupied == room_count - allowed_slippage = 8; penalty == 0"
            - "7 rooms occupied => penalty_rooms = 1; penalty = 1 * 20000 * 2 = 40000"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "POR2", display_name: "Portland 2" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "SEA", game_tipoff_utc: "2027-04-20T00:00:00Z", return_arrival_utc: "2027-04-21T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks"
              payload: { hotel_code: "HSEA", room_count: 10, rate_cents_per_night: 20000, check_in_date: "2027-04-19", night_count: 2, cutoff_date: "2027-04-05", attrition_allowance_pct: 20 }
              as: TravelCoordinator
              captures: { block_id: $.data.id }
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-06T00:00:00Z" }
              as: TravelOpsAdmin
          trigger:
            - call: "GET /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks/${block_id}"
              payload: {}
              as: Any
              captures: { block: $.data }
          assert:
            - "HotelBlock.${block_id}.posture == ATTRITION_EXPOSED (clock crossed cutoff with 0 occupied)"
            - "attrition_penalty = (10 - 0 - 0 - 2) * 20000 * 2 = 320000 cents added to trip.estimated_cost_cents"

      - name: charter_cancellation_penalty_band_selection
        claim_type: constants_applied
        grounds: ["calculations.charter_cancellation_penalty"]
        distinguishing_aspect: "Band selection picks the FIRST band whose days_before <= days-to-game; cancel 20 days out with bands [30d:10%, 7d:50%] picks the 7d band (50%)"
        test_recipe:
          setup:
            - "Contract 8000000 base + 800000 cap = 8800000"
            - "Bands: [{days_before:30, penalty_pct:10},{days_before:7, penalty_pct:50}]"
            - "Clock at game_tipoff_utc - 20 days"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
