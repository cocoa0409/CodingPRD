              payload: { member_id: "${m_odo_id}", pod_id: "${pod_odo_id}", vehicle_id: "${veh_cr1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_cr1_ver}" }
              as: Member
              as_user_id: "${m_odo_id}"
              captures: { res_cr1_id: $.data.id }
            - call: "POST /car-share/access-events"
              payload: { reservation_id: "${res_cr1_id}", member_id: "${m_odo_id}", method: "APP" }
              as: Member
              as_user_id: "${m_odo_id}"
          trigger:
            - call: "POST /car-share/reservations/{id}/return"
