          - entities.ComplianceCycle.fields.earned_ethics_minutes
        distinguishing_aspect: "When a cap truncates a record whose minutes span four categories, the shortfall is removed in the pinned bucket order GENERAL -> BIAS_ELIMINATION -> TECHNOLOGY -> ETHICS, so specialty minutes survive: a self-study record credited 360 (ETHICS 90 / TECH 60 / BIAS 60 / GENERAL 150) that may only count 180 contributes ETHICS 90, TECHNOLOGY 60, BIAS 30 and GENERAL 0. Removing the surplus in the reverse order, or pro rata, yields ETHICS 0 / BIAS 30 / TECH 0 or ETHICS 45 for the same stored data."
