              as_user_id: "${t_op}"
            - call: "POST /molding-cycles/${cyc}/demold"
              payload: { actual_cooling_end_at: "2026-08-01T00:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - *cd2_clk0900
            - *cd2_start
            - call: "POST /molding-cycles/${cyc}/start-oven"
