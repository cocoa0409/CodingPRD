            - "trigger 1 responds HTTP 409 with data.error_id == ERR_SUPERVISION_CAPACITY_EXCEEDED (during 10:00-12:00 two ASSIGNED seats would be live on one line with supervisor_capacity 1)"
            - "trigger 2 responds HTTP 201 with ShiftAssignment.${sa_z_id}.status == ASSIGNED (X ends exactly when Z starts, and half-open intervals that touch never contend)"
            - "WorkShift.${ws_y_id}.assigned_count == 0, WorkShift.${ws_x_id}.assigned_count == 1, WorkShift.${ws_z_id}.assigned_count == 1"
            - "Participant.${p2_id}.scheduled_hours_current_week == 4.000 (only the adjacent shift counts)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_delivered_support_activity_restores_mission_ledger
        grounds:
          - state_machines.SupportActivity.DELIVERED_to_VOIDED
          - calculations.subsidy_cost_allocation
          - entities.CostEntry.fields.status
          - entities.SubsidyPeriod.fields.mission_cost_cents
        distinguishing_aspect: |
          Conserved quantity #1 is MONEY in the subsidy ledger: the invariant
          `SubsidyPeriod.mission_cost_cents + business_operating_cost_cents == sum(CostEntry.amount_cents
          WHERE status == POSTED)` holds before (19800), after delivery (31800) and after the void
          (19800), and mission_cost_cents returns exactly to its pre-delivery 4570 with zero drift.
        test_recipe:
          setup:
            - "Launched line, OPEN period 2026-09-01..2026-09-30 with supervisor_hours 40.0."
            - "Participant p1 (wage 1650) completed a 12.000-hour shift, so the ledger holds exactly one SHARED TRAINEE_WAGES entry of 19800 and mission_share is 0.2308."
            - "One PLANNED JOB_COACHING activity of 90 minutes costing 12000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T20:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws1_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { sa1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T20:00:00Z" }
              as: ProgramDirector
            - call: "POST /shift-assignments/${sa1_id}/complete"
              payload: { actual_hours: 12.000 }
              as: CaseManager
            - call: "POST /support-activities"
              payload: { participant_id: "${p1_id}", category: "JOB_COACHING", duration_minutes: 90, cost_cents: 12000 }
              as: JobCoach
              captures: { act1_id: $.data.id }
          trigger:
            - call: "POST /support-activities/${act1_id}/deliver"
              payload: {}
              as: JobCoach
              as_user_id: "coach-1"
              captures: { act_status: $.data.status }
            - call: "GET /cost-entries"
              payload: { source_activity_id: "${act1_id}" }
              as: ProgramDirector
              captures: { ce_id: "$.data[0].id" }
            - call: "POST /support-activities/${act1_id}/void"
              payload: { voided_reason: "Session logged against the wrong participant" }
              as: ProgramDirector
              captures: { void_status: $.data.status }
          assert:
            - "pre-delivery: SubsidyPeriod.${sp_id}.mission_cost_cents == 4570, business_operating_cost_cents == 15230, total_cost_cents == 19800 (invariant 4570 + 15230 == 19800)"
            - "after trigger 1: SupportActivity.${act1_id}.status == DELIVERED, SubsidyPeriod.${sp_id}.mission_cost_cents == 16570, business_operating_cost_cents == 15230, total_cost_cents == 31800 (invariant 16570 + 15230 == 31800 == 19800 + 12000)"
            - "after trigger 3: SupportActivity.${act1_id}.status == VOIDED and CostEntry.${ce_id}.status == VOIDED with voided_at == 2026-09-07T20:00:00Z"
            - "after trigger 3: SubsidyPeriod.${sp_id}.mission_cost_cents == 4570, business_operating_cost_cents == 15230, total_cost_cents == 19800 - byte-identical to the pre-delivery ledger, zero drift"
            - "CostEntry.${ce_id}.allocated_mission_cents is still 12000 on the row itself (the void excludes it from the aggregates without rewriting its allocation)"
            - "SubsidyPeriod.${sp_id}.mission_share == 0.2308 and true_cost_per_trainee_hour_cents == 1650.00 both before the delivery and after the void"
            - "Participant.${p1_id}.support_activity_minutes == 0 and delivered_coaching_count == 0 after the void"

      - name: release_shift_assignment_restores_seat_and_week_hours
        grounds:
          - state_machines.ShiftAssignment.ASSIGNED_to_RELEASED
          - calculations.participant_progress_metrics
          - entities.WorkShift.fields.assigned_count
          - entities.Participant.fields.scheduled_hours_current_week
        distinguishing_aspect: |
          Conserved quantity #2 is CAPACITY-AND-TIME rather than money: releasing a seat restores both
          `WorkShift.assigned_count` (1 -> 0) and `Participant.scheduled_hours_current_week`
          (12.000 -> 0.000) to their pre-assignment values while the subsidy ledger stays at zero rows,
          proving the compensating action moves no cash at all.
        test_recipe:
          setup:
            - "Launched line with an OPEN period (so a ledger movement WOULD be possible) and participant p1 enrolled at wage 1650."
            - "One 12-hour shift Mon 2026-09-07 08:00..20:00, trainee_capacity 2, no assignments yet."
            - "Clock at 2026-09-07T00:00:00Z, inside the shift's ISO week."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T20:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws1_id: $.data.id }
          trigger:
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { sa1_id: $.data.id }
            - call: "POST /shift-assignments/${sa1_id}/release"
              payload: {}
              as: CaseManager
              captures: { rel_reason: $.data.released_reason }
          assert:
            - "pre-assignment: WorkShift.${ws1_id}.assigned_count == 0 and Participant.${p1_id}.scheduled_hours_current_week == 0.000"
            - "after trigger 1: WorkShift.${ws1_id}.assigned_count == 1 and Participant.${p1_id}.scheduled_hours_current_week == 12.000"
            - "after trigger 2: ShiftAssignment.${sa1_id}.status == RELEASED with released_reason == MANUAL_RELEASE, actual_hours == null and wage_cost_cents == null"
            - "after trigger 2: WorkShift.${ws1_id}.assigned_count == 0 and Participant.${p1_id}.scheduled_hours_current_week == 0.000 - both conserved quantities are back to their pre-assignment values"
            - "GET /cost-entries?subsidy_period_id=${sp_id} returns total_count == 0 and SubsidyPeriod.${sp_id}.total_cost_cents == 0 (no cash moved forward, so none is compensated back)"
            - "WorkShift.${ws1_id}.status is still SCHEDULED (auto-close needs at least one COMPLETED assignment, and there is none)"
            - "Participant.${p1_id}.transitional_hours_worked == 0.000"
