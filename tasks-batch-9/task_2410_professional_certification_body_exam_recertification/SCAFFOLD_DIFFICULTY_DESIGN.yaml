  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: item_revision_loop_bumps_review_round_and_discards_partial_approvals
        grounds:
          - state_machines.Item.IN_REVIEW_to_REVISION_REQUESTED
          - state_machines.Item.REVISION_REQUESTED_to_IN_REVIEW
          - state_machines.Item.IN_REVIEW_to_IN_REVIEW
          - state_machines.Item.IN_REVIEW_to_APPROVED
          - entities.Item.fields.review_round
          - entities.Item.fields.approver_user_ids
          - validations[priority=19]
        distinguishing_aspect: |
          The Item machine is CYCLIC, not forward-only: it re-enters IN_REVIEW from
          REVISION_REQUESTED, and the re-entry is not idempotent — review_round increments by
          exactly 1 relative to the value observed on the first submission and
          approver_user_ids is emptied, so the approval isp-rev-1 already banked in round 1
          does not count in round 2 and the item needs two fresh distinct approvals again.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX (domain_specs [{D1, 100, min_operational_items 1}], form_length 1)."
            - "One Item in status IN_REVIEW authored by isp-author, with exactly one banked approval so approver_user_ids == [\"isp-rev-1\"]; the review_round observed on the first submission is captured as ${rr0}."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "ANALYSIS", "stem": "Revision-loop item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "round one submission"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { rr0: "$.data.review_round" }
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE", "review_note": "round one approval"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
          trigger:
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "REVISE", "review_note": "stem is double-barrelled"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "stem rewritten"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { rr1: "$.data.review_round" }
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE", "review_note": "round two first approval"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE", "review_note": "round two second approval"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
          assert:
            - "after trigger[0] Item.${item_id}.status == REVISION_REQUESTED and Item.${item_id}.approver_user_ids == []"
            - "after trigger[1] Item.${item_id}.status == IN_REVIEW and ${rr1} == ${rr0} + 1"
            - "after trigger[1] Item.${item_id}.approver_user_ids == []"
            - "after trigger[2] Item.${item_id}.status == IN_REVIEW (the first approval of the new round does not promote) and Item.${item_id}.approver_user_ids == [\"isp-rev-1\"]"
            - "after trigger[3] Item.${item_id}.status == APPROVED and Item.${item_id}.approver_user_ids == [\"isp-rev-1\", \"isp-rev-2\"]"
            - "Item.${item_id}.author_user_id == \"isp-author\" throughout and no ERR_SEGREGATION_OF_DUTIES is raised for isp-rev-1 re-approving in round 2"
            - "Item.${item_id}.stat_basis_applied == INSUFFICIENT_DATA and Item.${item_id}.p_value == null (no response data was ingested)"


      - name: registration_score_dimension_holds_and_restores_while_seat_dimension_stays_completed
        grounds:
          - state_machines.ExamRegistration.PENDING_SCORED_to_WITHHELD
          - state_machines.ExamRegistration.WITHHELD_to_SCORED
          - state_machines.ExamRegistration.SCORED_to_REPORTED
          - state_machines.SecurityIncident.OPEN_to_UNSUBSTANTIATED
          - entities.ExamRegistration.fields.score_status_before_hold
          - entities.SecurityIncident.fields.placed_hold
          - validations[priority=21]
          - calculations.session_seat_occupancy
        distinguishing_aspect: |
          ExamRegistration carries two INDEPENDENT state dimensions on one row: a CRITICAL
          SecurityIncident drives score_status SCORED -> WITHHELD -> SCORED -> REPORTED while
          seat_status never leaves COMPLETED and session.seats_reserved never leaves 1, so the
          combined state (seat COMPLETED, score WITHHELD) is reachable only in a parallel
          machine and blocks report-score with ERR_SCORE_UNDER_SECURITY_HOLD until the
          incident is dismissed.
        test_recipe:
