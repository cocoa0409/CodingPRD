      - name: insured_value_dual_variant_divergence_corner
        claim_type: variant_divergence
        grounds:
          - calculations.certificate_insured_value.variants
          - complexity_profile.complexity_layers.dual_variant_calculation
        distinguishing_aspect: |
          The same shipment priced under the two valuation bases yields different
          insured values, and the delta is exactly the freight, duty and markup.
        excluded_because:
          difficulty_instance: dual_variant_calc / certificate_insured_value_cif_markup_vs_declared_value
          rationale: "The CIF_PLUS_MARKUP vs DECLARED_VALUE divergence on identical shipment data, the 105000.00 delta and its propagation into premium and the accumulation ledgers are asserted by the named §1.8 instance."

      - name: claim_adjustment_basis_variant_selection_corner
        claim_type: variant_selection
        grounds:
          - calculations.claim_adjusted_amount.variants
          - entities.ClaimFile.fields.adjustment_basis
        distinguishing_aspect: |
          The adjustment_basis field, not the loss type, selects which variant runs,
          and each variant needs its own mandatory input.
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_adjusted_amount_depreciation_pct_vs_salvage_proceeds
          rationale: "Selection of the DEPRECIATION_PCT vs SALVAGE_SALE_PROCEEDS branch from adjustment_basis, and the 2187.50 divergence caused purely by where the deductible enters, are asserted by the named §1.8 instance."

      - name: premium_component_precision_corner
        claim_type: precision
        grounds:
          - calculations.certificate_premium_components.precision
          - calculations.certificate_premium_components.constants
        distinguishing_aspect: |
          Rounding order matters: the effective rate is rounded before it is applied,
          and each premium component is rounded to 2 dp independently.
        excluded_because:
          difficulty_instance: combinatorial_formula / premium_component_rounding_order_and_rate_prerounding
          rationale: "Rate pre-rounding to 4 dp before multiplication and per-component 2 dp rounding before the sum (6444.91 versus the 6444.90 a sum-then-round model produces) are asserted by the named §1.8 instance."

      - name: general_average_fee_constants_corner
        claim_type: constants_applied
        grounds:
          - calculations.ga_contribution_allocation.constants
          - entities.GeneralAverageEvent.fields.adjuster_fee_amount
        distinguishing_aspect: |
          The adjuster fee is a percentage of a base that itself includes the fee, so
          the constants must be applied in the declared evaluation order.
        excluded_because:
          difficulty_instance: combinatorial_formula / ga_adjuster_fee_self_reference_evaluation_order
          rationale: "Correct application of GA_ADJUSTER_FEE_PCT to the pre-fee allowance only, and of GA_CASH_DEPOSIT_THRESHOLD / GA_CASH_DEPOSIT_PCT to the final contribution, is asserted by the named §1.8 instance."

      - name: storage_window_interval_adjacency_corner
        claim_type: interval_merge
        grounds:
          - calculations.accumulation_exposure_check
          - calculations.transit_termination_instant
          - entities.AccumulationEntry.fields.window_end_at
        distinguishing_aspect: |
          Port exposure windows are HALF-OPEN, so two shipments whose storage
          windows merely touch must not be merged into one accumulation, while a
          one-day overlap must be.
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / discharge_port_half_open_storage_window_adjacency"
          rationale: |
            The §1.8 instance already tests both sides of the adjacency: a
            discharge on 2026-10-05, exactly when the earlier window
            [2026-09-05, 2026-10-05) closes, is issued against a 1155000.00 port
            limit, while moving it to 2026-10-04 makes the exposure 2310000.00
            and is refused with ERR_PORT_ACCUMULATION_EXCEEDED.

  - section: validations
    instances:
      - name: certificate_creation_rejects_reversed_dates_and_missing_valuation_inputs
        claim_type: violation_to_error
        grounds:
          - validations.priority_14
          - validations.priority_17
          - errors.ERR_VOYAGE_DATES_INVALID
          - errors.ERR_VALUATION_INPUT_MISSING
        distinguishing_aspect: |
          Four rejections and one acceptance on the same fixture pin down two
          creation-time rules that a schema validator alone cannot express:
          discharge_date must be STRICTLY after sailing_date (so equal dates are
          rejected, not accepted), and the valuation inputs must match the chosen
          basis (DECLARED_VALUE without declared_value and CIF_PLUS_MARKUP
          without invoice_value are both 422 ERR_VALUATION_INPUT_MISSING even
          though both fields are individually optional in the request schema).
