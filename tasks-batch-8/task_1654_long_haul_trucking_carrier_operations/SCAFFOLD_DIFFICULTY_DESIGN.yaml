  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_trip_create
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_LOAD_NOT_ASSIGNABLE]
          - errors[ERR_DRIVER_SAFETY_BELOW_FLOOR]
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): the load is still TENDERED
          (state violation) AND the driver's safety_score is 40 (safety violation);
          priority 6 state wins -> ERR_LOAD_NOT_ASSIGNABLE, not ERR_DRIVER_SAFETY_BELOW_FLOOR.
        test_recipe:
          setup:
            - "Clock 2026-08-01T06:00:00Z; F1 reference data; driver with one INSPECTION_VIOLATION severity 60 on 2026-07-01 (score 40); load TENDERED (never screened)"
