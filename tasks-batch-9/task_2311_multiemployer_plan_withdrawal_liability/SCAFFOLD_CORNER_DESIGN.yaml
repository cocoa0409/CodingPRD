          Under SELLER_CONTINUING the score weights contingent exposure at
          CONTINGENT_EXPOSURE_WEIGHT_4204 (0.25) because the seller stays primarily liable
          during the bond period, while joint exposure would be weighted in full. With
          30000000 of contingent exposure and no joint exposure the score is 75.0000; a
