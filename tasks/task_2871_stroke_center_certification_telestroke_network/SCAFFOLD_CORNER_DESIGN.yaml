  - name: list_endpoints_reject_out_of_range_pagination_and_admit_the_bounds
    claim_type: violation_to_error
    grounds:
    - validations priority 11 -> ERR_INVALID_PAGINATION (422)
    - response_envelope pagination defaults limit 10, min 1, max 100, offset 0
    distinguishing_aspect: 'The window is CLOSED on both sides, so the interesting values are the ones just outside it: limit 0, limit 101 and offset -1 must all be 422 while limit 1 and limit 100 must both succeed. This proves the bounds are inclusive rather than exclusive.'
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; three StrokeCenters exist so a page can be non-empty.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          pg_a: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          pg_b: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Summit Thrombectomy Center
          facility_type: THROMBECTOMY_CAPABLE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          pg_c: $.data.id
      trigger:
      - call: GET /stroke-network/stroke-centers?limit=0&offset=0
        payload:
          limit: 0
          offset: 0
        as: ProgramCoordinator
        captures:
          pg1_id: $.data.error_id
          pg1_msg: $.data.message
      - call: GET /stroke-network/stroke-centers?limit=101&offset=0
        payload:
          limit: 101
          offset: 0
        as: ProgramCoordinator
        captures:
          pg2_id: $.data.error_id
          pg2_msg: $.data.message
      - call: GET /stroke-network/stroke-centers?limit=10&offset=-1
        payload:
          limit: 10
          offset: -1
        as: ProgramCoordinator
        captures:
          pg3_id: $.data.error_id
          pg3_msg: $.data.message
      - call: GET /stroke-network/stroke-centers?limit=1&offset=0
        payload:
          limit: 1
          offset: 0
        as: ProgramCoordinator
        captures:
          pg_one: $.data[0].id
      - call: GET /stroke-network/stroke-centers?limit=100&offset=0
        payload:
          limit: 100
          offset: 0
        as: ProgramCoordinator
        captures:
          pg_max: $.data[0].id
      assert:
      - ${pg1_id} == ${pg2_id} == ${pg3_id} == ERR_INVALID_PAGINATION, all HTTP 422
      - limit 1 succeeds with exactly 1 element, total_count 3 and has_more true; ${pg_one} == ${pg_a}
      - limit 100 succeeds with 3 elements, total_count 3 and has_more false; ${pg_max} == ${pg_a}
      - so the admissible limit range is exactly [1, 100] and offset must be >= 0
  - name: an_unknown_field_in_the_body_is_rejected_rather_than_ignored
    claim_type: violation_to_error
    grounds:
    - validations priority 10 -> ERR_INVALID_REQUEST (422) 'unknown fields are rejected'
    distinguishing_aspect: The rule says unknown fields are REJECTED, not silently dropped — and the field chosen here is `certification_status`, a real system-sourced column, so an implementation that merges the body into the row would create a pre-certified facility.
