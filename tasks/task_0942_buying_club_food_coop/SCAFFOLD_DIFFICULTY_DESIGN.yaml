    - state_machines.Cycle.OPEN_to_LOCKED
    - state_machines.MemberOrder.SUBMITTED_to_LOCKED
    - state_machines.OrderLine.REQUESTED_to_CONFIRMED
    - calculations.case_aggregation
    - calculations.drop_qualification
    - calculations.route_qualification
    - state_machines.DropRun.QUALIFIED_to_DEFERRED
    - state_machines.MemberOrder.LOCKED_to_CANCELLED
    - state_machines.OrderLine.CONFIRMED_to_CANCELLED
