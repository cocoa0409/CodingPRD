            - "Booking.${bk_t0}.payment_status == REFUNDED_PARTIAL and fulfillment_status == CANCELLED"
            - "DisputeCase.${dsp2}.refund_due_cents == 100000 (not 999999)"
            - "DisputeCase.${dsp2}.mediation_fee_pct == 0.035 and mediation_fee_cents == 6000"
            - "DisputeCase.${dsp2}.settlement_total_cents == 106000"
