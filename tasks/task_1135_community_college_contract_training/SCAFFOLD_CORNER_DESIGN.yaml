          - errors[ERR_INVALID_STATE]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Revising a COMPLETED... rather: revising an agreement in DRAFT (state violation) with a stale expected_agreement_version (OCC violation) returns the state error first per priority 5 < 9."
        test_recipe:
          setup: ["Agreement in DRAFT (never quoted); its version captured at creation"]
          setup_api_calls:
            - call: "POST /ct/employers"
              payload: { legal_name: "PrioCo", industry_code: "111190", contact_email: "hr@prio.example" }
              as: WorkforceCoordinator
