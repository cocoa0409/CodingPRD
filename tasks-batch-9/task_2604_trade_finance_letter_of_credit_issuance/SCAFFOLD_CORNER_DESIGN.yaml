          assert:
            - "trigger call 1 returns HTTP 422 and ${e_empty} == ERR_EMPTY_CHANGE_SET"
            - "GET /credits/${cr_id}/amendments returns total_count 1 after all triggers - the empty change_set created nothing"
            - "trigger call 2 succeeds with Amendment.${amd_id}.status == DRAFT and requires_beneficiary_consent == true and exposure_delta_cents == -1000000"
            - "trigger call 3 returns HTTP 409 and ${e_not_pending} == ERR_AMENDMENT_NOT_PENDING_CONSENT"
            - "trigger call 4 succeeds: Amendment.${amd_id}.status == PENDING_CONSENT, consent_window_start == 2026-08-10, consent_deadline_date == 2026-08-20, window_end_effective == 2026-08-20, issued_by_user_id == tfo_2"
            - "trigger call 5 returns HTTP 409 and ${e_not_draft} == ERR_AMENDMENT_NOT_DRAFT"
