            - { call: "POST /auxiliary/clearances/${c2}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "HEALTH_FLU", document_ref: "fl-1" }, as: Screener, as_user_id: "screener-1", captures: { c3: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c3}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
