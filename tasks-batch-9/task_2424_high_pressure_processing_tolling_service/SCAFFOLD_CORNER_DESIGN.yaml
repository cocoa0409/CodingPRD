            - "data.error_id != ERR_DEVIATION_UNRESOLVED (no Deviation row exists)"
            - "Lot.${lot1_id}.release_state is still NOT_RELEASED and CycleLoad.${load1_id}.allocated_fee_cents == null"

      - name: corner_package_failure_deviation_cannot_be_reprocessed
        claim_type: Triggerable
        grounds:
          - errors[ERR_DEVIATION_DISPOSITION_NOT_PERMITTED]
          - validations.p9[POST /deviations/{id}/adjudicate -> ERR_DEVIATION_DISPOSITION_NOT_PERMITTED]
          - entities.Deviation.fields.cycle_load_id
        distinguishing_aspect: "A PACKAGE_FAILURE_RATE deviation is raised after the fee is already allocated, so its cycle_load_id is set and only ACCEPT remains available; REPROCESS is refused at priority 9 with the chargeback line untouched."
        test_recipe:
          setup:
            - "the standard world; C1 DISPOSITIONED, load L1 inspected at 3000 ppm, which raised an OPEN MAJOR PACKAGE_FAILURE_RATE deviation carrying cycle_load_id"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
