            - "Timetable.${tt_bad}.status == DRAFT (unchanged)"

      - name: capacity_exceeded_at_propose_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=12]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: "With capacity_trains_per_day 1, a 2-train timetable is rejected with ERR_CAPACITY_EXCEEDED even though its 120-minute headway is geometrically non-overlapping — the capacity check is independent of the overlap check."
        test_recipe:
          setup: ["ACTIVE agreement on a one-segment corridor whose segment capacity is 1."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - call: "POST /rail/corridors"
              payload: { host_railroad_id: "${host_id}", code: "GP-CAP", name: "Bottleneck", endpoint_a: "STL", endpoint_b: "MEM", service_type: "LONG_DISTANCE", annual_cost_cents: 8000000 }
              as: SystemAdmin
              captures: { corr_c: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { corridor_id: "${corr_c}", sequence_no: 1, milepost_start: 0.0, milepost_end: 12.0, state_code: "MO", track_class: "SINGLE", capacity_trains_per_day: 1, pure_run_minutes: 30, dwell_after_minutes: 0 }
              as: SystemAdmin
              captures: { seg_c: $.data.id }
            - call: "POST /rail/operating-agreements"
              payload: { host_railroad_id: "${host_id}", corridor_id: "${corr_c}", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", on_time_threshold_minutes: 30, penalty_rate_cents_per_minute: 40, incentive_rate_cents_per_train_mile: 10, otp_target_pct: 0.75, running_time_allowance_pct: 0.20 }
              as: PassengerOperator
              captures: { oa_c: $.data.id }
            - call: "POST /rail/operating-agreements/${oa_c}/activate"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - call: "POST /rail/timetables"
              payload: { corridor_id: "${corr_c}", operating_agreement_id: "${oa_c}", service_date_start: "2026-09-04", service_date_end: "2026-09-04", trains_per_day: 2, departure_time_of_day: "08:00", headway_minutes: 120 }
              as: PassengerOperator
              captures: { tt_c: $.data.id }
          trigger:
            - call: "POST /rail/timetables/${tt_c}/propose"
              payload: {}
              as: PassengerOperator
              captures: { err: $.data.error_id }
          assert:
