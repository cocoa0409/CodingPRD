              captures: { ap_t: $.data.id }
            - call: "POST /api/delivery-appointments/${ap_t}/transition"
              payload: { to_state: CONFIRMED }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /api/licensees/${l1}/transition"
