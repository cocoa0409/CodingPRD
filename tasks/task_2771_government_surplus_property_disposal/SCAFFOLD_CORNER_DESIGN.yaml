            - call: "POST /turn-ins/${ti3}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
          assert:
            - "every clock call returns a 2xx status — the endpoint lists all seven roles, so an AgencyOfficer and a Bidder may both move it"
            - "TurnIn.${ti1}.submitted_at == 2026-08-01T06:00:00.000Z"
            - "TurnIn.${ti2}.submitted_at == 2026-08-02T09:30:00.000Z"
            - "TurnIn.${ti3}.submitted_at == 2026-08-03T11:45:15.000Z — sub-minute precision is preserved"
            - "all three turn-ins report status == SUBMITTED with reviewed_at == null"
            - "the clock action creates no row: GET /turn-ins returns total_count 3"

      - name: ep_vehicle_release_stamps_title_transfer_fields
        claim_type: conditional_action
        grounds:
          - endpoints[POST /assets/{id}/release]
          - validations[priority=64]
          - validations[priority=66]
          - state_machines.SurplusAsset.disposition.AWARDED_TRANSFER_to_RELEASED
        distinguishing_aspect: "Every input of this action is optional in §1.5 yet conditionally mandatory in the state machine, and the two conditions come from different asset attributes: category == VEHICLE forces the odometer and title fields, and a non-null lien_holder_name forces the lien reference. The odometer condition is also a comparison, not a presence check — a disclosed reading below the recorded one is refused — and the successful call fires a two-hop cascade to the TransferOrder and the TurnIn."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "DOT-01 turns in a single VEHICLE (cost 2800000, acquired 2016-04-11, vin 1FTEW1E45JKE12345, odometer_reading 148320, title_number TX-77410992, lien_holder_name First State Bank of Bastrop); assessed C3 / functional, so fair_market_value_cents is 392000 with age_factor floored at 0.20"
            - "TFC-02 (STATE_AGENCY) won the STATE_AGENCY tier and holds an ACKNOWLEDGED TransferOrder for the vehicle"
            - "the asset's clearance_status is NOT_REQUIRED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Texas Facilities Commission", agency_code: "TFC-02", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag2: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Fleet Pool" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "VEHICLE", description: "2016 half-ton pickup", acquisition_cost_cents: 2800000, acquisition_date: "2016-04-11", vin: "1FTEW1E45JKE12345", odometer_reading: 148320, title_number: "TX-77410992", lien_holder_name: "First State Bank of Bastrop" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a1: "$.data.id", a1_v: "$.data.version" }
            - call: "POST /turn-ins/${ti}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C3", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a1_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /turn-ins/${ti}/review"
              payload: { decision: "ACCEPT" }
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles"
              payload: { asset_id: "${a1}", opens_at: "2026-08-01T00:00:00Z", tier_window_days: 5 }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /screening-requests"
              payload: { screening_cycle_id: "${cyc}", requesting_agency_id: "${ag2}", intended_use: "Grounds maintenance crew truck", justification: "The crew truck is beyond economical repair.", needed_by_date: "2026-09-30" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { r1: "$.data.id" }
            - call: "POST /screening-cycles/${cyc}/award"
              payload: { screening_request_id: "${r1}" }
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /transfer-orders"
              payload: { asset_id: "${a1}", recipient_agency_id: "${ag2}", screening_request_id: "${r1}" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { to1: "$.data.id" }
            - call: "POST /transfer-orders/${to1}/acknowledge"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag2}"
          trigger:
            - call: "POST /assets/${a1}/release"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { err_bare: "$.data.error_id" }
            - call: "POST /assets/${a1}/release"
              payload: { odometer_disclosure_reading: 148000, title_recipient_name: "Texas Facilities Commission", lien_release_reference: "LR-2026-33417" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { err_rollback: "$.data.error_id" }
            - call: "POST /assets/${a1}/release"
              payload: { odometer_disclosure_reading: 148500, title_recipient_name: "Texas Facilities Commission" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { err_lien: "$.data.error_id" }
            - call: "POST /assets/${a1}/release"
              payload: { odometer_disclosure_reading: 148500, title_recipient_name: "Texas Facilities Commission", lien_release_reference: "LR-2026-33417" }
              as: DisposalOfficer
              as_user_id: "officer-01"
          assert:
            - "TransferOrder.${to1}.base_transfer_cents == 98000, handling_fee_cents == 5000 and transfer_price_cents == 103000 — fair_market_value_cents 392000 at the STATE_AGENCY discount lands just under the fee tier boundary"
            - "the bare release returns 422 with data.error_id == \"ERR_ODOMETER_DISCLOSURE_REQUIRED\""
            - "the release disclosing 148000 returns 422 with the same code — a reading below the recorded 148320 is a rollback, not a disclosure"
            - "the release disclosing 148500 without a lien reference returns 409 with data.error_id == \"ERR_LIEN_NOT_RELEASED\" — priority 64 is satisfied, so the next gate speaks"
            - "the complete release returns 200: SurplusAsset.${a1}.disposition_status == RELEASED, released_at == 2026-08-01T00:00:00.000Z, odometer_disclosure_reading == 148500, title_recipient_name == \"Texas Facilities Commission\", lien_release_reference == \"LR-2026-33417\""
            - "hop 2: TransferOrder.${to1}.status == COMPLETED with use_period_end_on == null — the asset is not federal_source"
            - "hop 3: TurnIn.${ti}.status == CLOSED — the vehicle was the turn-in's only asset and it is now terminal"
            - "SurplusAsset.${a1}.version == 4 — one bump for the assessment, one for the award, one for the release; the three refused calls bumped nothing"

      - name: ep_transfer_order_filters_expose_all_three_links
