            - call: "POST /movement-events"
              payload: { animal_id: "${an_d}", origin_premises_id: "${d1}", destination_premises_id: "${d2}", departed_at: "2026-08-09T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_d}"
              captures: { mv_d: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "POST /movement-events/${mv_d}/receive"
              payload: { arrived_at: "2026-08-10T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_d}"
            - call: "POST /movement-events/${mv_d}/dispute"
              payload: { reason: "arrival scan not corroborated" }
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mt-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
          trigger:
            - call: "POST /movement-events/${mv_d}/correct"
              payload: { departed_at: "2026-08-11T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_d}"
              captures: { err_res: $.data.error_id }
          assert:
            - "${err_res} == ERR_RESIDENCY_OVERLAP"
            - "HTTP status is 409"
            - "MovementEvent.${mv_d}.status == DISPUTED and .correction_count == 0"
            - "MovementEvent.${mv_d}.departed_at == 2026-08-09T00:00:00.000Z"
            - "Animal.${an_d}.lifecycle_status == IN_TRANSIT"

  - rule_id: compensating_invariant
    instances:

      - name: tag_partition_conserved_when_application_is_voided
        grounds:
          - state_machines.Tag.APPLIED_to_VOIDED
          - entities.TagLot.fields.unapplied_count
          - entities.TagLot.fields.voided_count
          - calculations.animal_location_projection
        distinguishing_aspect: |
          Conserved quantity 1 - DEVICE COUNT. The identity
          quantity == unapplied_count + applied_count + retired_count + replaced_count + voided_count
          holds at 10 both before the application and after the compensating void, and the voided
          serial must NOT flow back into unapplied_count (which stays 9).
        test_recipe:
          setup:
            - "Premises P is ACTIVE and holds a 10-device lot with no applications, so the partition is 10 = 10 + 0 + 0 + 0 + 0."
            - "One device is applied, creating an animal; the partition becomes 10 = 9 + 1 + 0 + 0 + 0."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Coulee Cattle", contact_email: "ops@coulee.example", state_code: "WA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_z: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_z}", pin: "WAZ0001", operation_type: "COW_CALF", state_code: "WA", capacity: 20 }
              as: Producer
              as_user_id: "${prod_z}"
              captures: { pz: $.data.id }
            - call: "POST /premises/${pz}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-wa-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_z: $.data.id }
            - call: "POST /device-suppliers/${sup_z}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_z_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_z}", premises_id: "${pz}", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_z_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_z}"
              captures: { lot_z: $.data.id, qty_z: $.data.quantity }
            - call: "POST /tag-lots/${lot_z}/apply-tag"
              payload: { ain: "840100000000001", species: "BOVINE", birth_date: "2026-03-18", birth_premises_id: "${pz}" }
              as: Producer
              as_user_id: "${prod_z}"
              captures: { an_z: $.data.id }
            - call: "GET /tags"
              payload: { animal_id: "${an_z}" }
              as: Producer
              as_user_id: "${prod_z}"
              captures: { tag_z: "$.data[0].id" }
            - call: "GET /tag-lots/${lot_z}"
              payload: {}
              as: Producer
              as_user_id: "${prod_z}"
              captures: { unapplied_mid: $.data.unapplied_count, applied_mid: $.data.applied_count }
          trigger:
            - call: "POST /tags/${tag_z}/void-application"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
          assert:
            - "${qty_z} == 10"
            - "${unapplied_mid} == 9 and ${applied_mid} == 1"
            - "Tag.${tag_z}.device_status == VOIDED"
            - "TagLot.${lot_z}.applied_count == 0 and .voided_count == 1 and .unapplied_count == 9"
            - "TagLot.${lot_z}.quantity == TagLot.${lot_z}.unapplied_count + applied_count + retired_count + replaced_count + voided_count == 10"
            - "Animal.${an_z}.lifecycle_status == VOIDED and .sighting_count == 0"
            - "Premises.${pz}.animal_count == 0"
            - "GET /sightings?animal_id=${an_z}&include_reversed=true returns 1 row with reversed == true"

      - name: incentive_balance_conserved_when_award_is_clawed_back
        grounds:
          - state_machines.IncentiveAward.ACCRUED_to_PAID
          - state_machines.IncentiveAward.PAID_to_CLAWED_BACK
          - entities.Producer.fields.incentive_balance_cents
          - entities.Producer.fields.lifetime_clawback_cents
          - calculations.incentive_award_amount
        distinguishing_aspect: |
          Conserved quantity 2 - MONEY, a different kind of quantity from the device count:
          Producer.incentive_balance_cents returns to exactly its pre-payment value of 0 after
          pay-then-clawback, while lifetime_clawback_cents ratchets to 343 and never decreases.
        test_recipe:
          setup:
            - "An ENROLLED producer owns one ACTIVE premises with two ACTIVE animals and no movement events, so tier_factor is 1.00 and compliance_multiplier is 1.25."
            - "The single award line is round_half_up(137 * 2 * 1.00 * 1.25) = 343 cents."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Verde Valley Beef", contact_email: "ops@verdevalley.example", state_code: "AZ" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_k: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_k}", pin: "AZK0001", operation_type: "COW_CALF", state_code: "AZ", capacity: 20 }
              as: Producer
              as_user_id: "${prod_k}"
              captures: { pk: $.data.id }
            - call: "POST /premises/${pk}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-az-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "Datamars US", supplier_code: "DMRS" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_k: $.data.id }
            - call: "POST /device-suppliers/${sup_k}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_k_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_k}", premises_id: "${pk}", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_k_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_k}"
              captures: { lot_k: $.data.id }
            - call: "POST /tag-lots/${lot_k}/apply-tag"
              payload: { ain: "840100000000001", species: "BOVINE", birth_date: "2026-03-01", birth_premises_id: "${pk}" }
              as: Producer
              as_user_id: "${prod_k}"
            - call: "POST /tag-lots/${lot_k}/apply-tag"
              payload: { ain: "840100000000002", species: "BOVINE", birth_date: "2026-03-02", birth_premises_id: "${pk}" }
              as: Producer
              as_user_id: "${prod_k}"
            - call: "POST /producers/${prod_k}/enroll"
              payload: {}
              as: Producer
              as_user_id: "${prod_k}"
              captures: { bal_before: $.data.incentive_balance_cents }
            - call: "POST /incentive-awards"
              payload: { producer_id: "${prod_k}", period_start: "2026-07-01", period_end: "2026-09-30" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { award_k: $.data.id, award_amt: $.data.awarded_cents }
            - call: "POST /incentive-awards/${award_k}/pay"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "GET /producers/${prod_k}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { bal_paid: $.data.incentive_balance_cents }
          trigger:
            - call: "POST /incentive-awards/${award_k}/clawback"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-reg"
          assert:
            - "${bal_before} == 0"
            - "${award_amt} == 343"
            - "${bal_paid} == 343"
            - "IncentiveAward.${award_k}.status == CLAWED_BACK and .clawback_cents == 343"
            - "Producer.${prod_k}.incentive_balance_cents == 0 (exactly the pre-payment value)"
            - "Producer.${prod_k}.lifetime_clawback_cents == 343"

      - name: premises_head_count_conserved_when_movement_is_voided
        grounds:
          - state_machines.MovementEvent.DISPUTED_to_VOIDED
          - state_machines.Animal.IN_TRANSIT_to_ACTIVE
          - entities.Premises.fields.animal_count
          - entities.Sighting.fields.reversed
        distinguishing_aspect: |
          Conserved quantity 3 - HEAD COUNT across two premises, neither money nor devices: the sum
          origin.animal_count + destination.animal_count is 1 before the departure, dips to 0 while
          the animal is IN_TRANSIT, and returns to exactly 1 with the head back at the ORIGIN after
          the dispute-then-void compensation.
