# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances. Every chain replays from empty-DB using
# only SCAFFOLD.yaml section 1.5 endpoints. Timestamps use the logical clock
# (startup default 2026-08-01T00:00:00Z).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — two dual-variant calculations on DIFFERENT
  # entity domains (rekey billing on RekeyCampaign vs deposit settlement on
  # Person/Charge).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: rekey_campaign_estimate_vs_final_divergence
        grounds:
          - calculations.rekey_campaign_cost
          - entities.RekeyCampaign.fields.estimated_cost_cents
          - entities.RekeyCampaign.fields.final_cost_cents
          - state_machines.RekeyCampaign.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Entity domain = RekeyCampaign billing. The estimate variant (scope
          snapshot at proposal, contracted per-door rates, never any emergency
          surcharge) yields 40000; the final variant (actual_cost_cents of
          COMPLETED work orders only — the cancelled D-2A order drops out — plus
          actual KEY_REISSUE charges) yields 31400 for the same campaign.
        test_recipe:
          setup:
            - "Building B with base_fee 15000, per_door 7500, per_key 2500, emergency 20 pct, business hours 08:00-18:00 UTC"
            - "Hierarchy GM -> M1 -> {C1, C2}; doors D-1A and D-1B on C1, D-2A on C2"
            - "Staff S1 holds master credential MK-1 (M1); resident R1 holds fob FB-1 (C1)"
            - "MK-1 reported lost: M1 COMPROMISED, all three doors REKEY_REQUIRED, incident opened"
            - "Campaign on M1 created with bill_to PERSON / bill_person_id S1; incident moved to UNDER_REVIEW; campaign approved"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Tower", vendor_badge_pool_max: 2, alert_escalation_minutes: 30, audit_retention_days: 30, default_propped_threshold_seconds: 120, base_fee_cents: 15000, per_door_fee_cents: 7500, per_key_reissue_fee_cents: 2500, emergency_surcharge_pct: 20, business_open_utc: "08:00", business_close_utc: "18:00" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "GRAND_MASTER", label: "GM" }
              as: SecurityAdmin
              captures: { gm: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${gm}", level: "MASTER", label: "M1" }
              as: SecurityAdmin
              captures: { m1: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m1}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m1}", level: "CHANGE", label: "C2" }
              as: SecurityAdmin
              captures: { c2: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1A", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { d1: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1B", key_node_id: "${c1}" }
              as: SecurityAdmin
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-2A", key_node_id: "${c2}" }
              as: SecurityAdmin
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Staff One", kind: "STAFF" }
              as: FrontDesk
              captures: { s1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res One", kind: "RESIDENT", unit_label: "U-1" }
              as: FrontDesk
              captures: { r1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${m1}", serial_no: "MK-1", type: "METAL_KEY" }
              as: FrontDesk
              captures: { mk1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "FB-1", type: "FOB" }
              as: FrontDesk
              captures: { f1: $.data.id }
            - call: "POST /credentials/${mk1}/issue"
              payload: { person_id: "${s1}" }
              as: FrontDesk
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r1}" }
              as: FrontDesk
            - call: "POST /credentials/${mk1}/report-lost"
              as: FrontDesk
            - call: "GET /incidents?credential_id=${mk1}"
              as: SecurityOfficer
              captures: { inc: "$.data[0].id" }
            - call: "POST /rekey-campaigns"
              payload: { building_id: "${b}", key_node_id: "${m1}", incident_id: "${inc}", bill_to: "PERSON", bill_person_id: "${s1}" }
              as: SecurityAdmin
              captures: { camp: $.data.id, est: $.data.estimated_cost_cents }
            - call: "POST /incidents/${inc}/start-review"
              as: SecurityOfficer
            - call: "POST /rekey-campaigns/${camp}/approve"
              as: SecurityAdmin
            - call: "GET /work-orders?campaign_id=${camp}"
              as: SecurityOfficer
              captures: { wo1: "$.data[0].id", wo2: "$.data[1].id", wo3: "$.data[2].id" }
            - call: "POST /work-orders/${wo3}/cancel"
              as: SecurityOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: SecurityAdmin
            - call: "POST /work-orders/${wo1}/start"
              as: SecurityOfficer
          trigger:
            - call: "POST /work-orders/${wo1}/complete"
              payload: { actual_cost_cents: 7000 }
              as: SecurityOfficer
            - call: "POST /work-orders/${wo2}/start"
              as: SecurityOfficer
            - call: "POST /work-orders/${wo2}/complete"
              payload: { actual_cost_cents: 7000 }
              as: SecurityOfficer
            - call: "GET /rekey-campaigns/${camp}"
              as: SecurityAdmin
              captures: { final_cost: $.data.final_cost_cents }
          assert:
            - "est == 40000  (15000 + 7500*3 doors + 2500*1 issued credential FB-1; MK-1 LOST excluded)"
            - "RekeyCampaign.${camp}.status == COMPLETED after wo2 completes (wo3 CANCELLED still allows completion)"
            - "final_cost == 31400  (door portion 15000 + 7000 + 7000 = 29000 in-hours, no surcharge; plus 2500 KEY_REISSUE)"
            - "GET /charges?campaign_id=${camp}&kind=REKEY_CAMPAIGN -> [0].amount_cents == 29000 and person_id == ${s1}"
            - "GET /charges?campaign_id=${camp}&kind=KEY_REISSUE -> [0].amount_cents == 2500 and person_id == ${s1}"
            - "Credential.${f1}.status == DEACTIVATED with deactivated_reason == REKEY"

      - name: moveout_settlement_provisional_vs_final_divergence
        grounds:
          - calculations.move_out_settlement
          - entities.Charge.fields.provisional_refund_cents
          - entities.Charge.fields.final_refund_cents
          - state_machines.Charge.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Entity domain = Person deposit settlement. Provisional (at move-out)
          forfeits only the two ISSUED credentials (refund 12499); the final
          variant at charge issue additionally forfeits the METAL_KEY reported
          LOST 5 days before move-out (inside the inclusive 30-day window),
          yielding refund 10624 — same person, same deposit, different result.
        test_recipe:
          setup:
            - "Building B (default rates); hierarchy M -> C1 (no doors needed)"
            - "Resident R1 with key_deposit_cents 20000"
            - "R1 holds FOB F-1 and CARD C-1; R1's METAL_KEY K-0 was reported lost at T-5 days"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Settlement House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res One", kind: "RESIDENT", unit_label: "U-1", key_deposit_cents: 20000 }
              as: FrontDesk
              captures: { r1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "K-0", type: "METAL_KEY" }
              as: FrontDesk
              captures: { k0: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "F-1", type: "FOB" }
              as: FrontDesk
              captures: { f1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "C-1", type: "CARD" }
              as: FrontDesk
              captures: { cd1: $.data.id }
            - call: "POST /credentials/${k0}/issue"
              payload: { person_id: "${r1}" }
              as: FrontDesk
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r1}" }
              as: FrontDesk
            - call: "POST /credentials/${cd1}/issue"
              payload: { person_id: "${r1}" }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /credentials/${k0}/report-lost"
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /persons/${r1}/move-out"
              as: FrontDesk
            - call: "GET /charges?person_id=${r1}&kind=MOVE_OUT_SETTLEMENT"
              as: FrontDesk
              captures: { ch: "$.data[0].id", prov: "$.data[0].provisional_refund_cents" }
          trigger:
            - call: "POST /charges/${ch}/issue"
              as: FrontDesk
            - call: "GET /charges/${ch}"
              as: FrontDesk
              captures: { final_refund: $.data.final_refund_cents, forfeit: $.data.final_forfeit_total_cents }
          assert:
            - "prov == 12499  (20000 - (5625 FOB line + 1876 CARD line))"
            - "forfeit == 9376  (5625 + 1876 + 1875 trailing-30-day LOST METAL_KEY line)"
            - "final_refund == 10624  (20000 - 9376)"
            - "Charge.${ch}.amount_cents == 0  (max(0, 9376 - 20000))"
            - "Charge.${ch}.line_items has 3 entries with fee_cents [5625, 1876, 1875] (provisional set first, then trailing-loss lines)"
            - "Credential.${k0}.lost_at == 2026-08-06T09:00:00Z, inside [2026-07-11T09:00:00Z, 2026-08-10T09:00:00Z]"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — DIFFERENT modes: (a) multi-input formula
  # with a conditional branch on entity state vs (b) pinned rounding order.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: rekey_final_cost_conditional_emergency_branch
        grounds:
          - calculations.rekey_campaign_cost
          - entities.Building.fields.emergency_surcharge_pct
          - entities.RekeyCampaign.fields.completed_at
        distinguishing_aspect: |
          Mode (a): the final variant combines 4+ inputs (base fee, summed
          actual_cost_cents, emergency flag derived from completed_at vs
          business hours, KEY_REISSUE charges) with a conditional branch —
          completion at 20:30 UTC is outside [08:00, 18:00) so the door portion
          is multiplied by 1.20: round_half_up((15000 + 24000) * 1.20) = 46800.
        test_recipe:
          setup:
            - "Same topology as rekey_campaign_estimate_vs_final_divergence: GM -> M1 -> {C1, C2}, doors D-1A/D-1B on C1, D-2A on C2"
            - "MK-1 (M1) held by staff S1 and reported lost; FB-1 (C1) held by resident R1"
            - "Campaign on M1 approved; all three work orders remain live; clock advanced to 20:30 (outside business hours) before completion"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Tower", vendor_badge_pool_max: 2, alert_escalation_minutes: 30, audit_retention_days: 30, default_propped_threshold_seconds: 120, base_fee_cents: 15000, per_door_fee_cents: 7500, per_key_reissue_fee_cents: 2500, emergency_surcharge_pct: 20, business_open_utc: "08:00", business_close_utc: "18:00" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "GRAND_MASTER", label: "GM" }
              as: SecurityAdmin
              captures: { gm: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${gm}", level: "MASTER", label: "M1" }
              as: SecurityAdmin
              captures: { m1: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m1}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m1}", level: "CHANGE", label: "C2" }
              as: SecurityAdmin
              captures: { c2: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1A", key_node_id: "${c1}" }
              as: SecurityAdmin
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1B", key_node_id: "${c1}" }
              as: SecurityAdmin
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-2A", key_node_id: "${c2}" }
              as: SecurityAdmin
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Staff One", kind: "STAFF" }
              as: FrontDesk
              captures: { s1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res One", kind: "RESIDENT", unit_label: "U-1" }
              as: FrontDesk
              captures: { r1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${m1}", serial_no: "MK-1", type: "METAL_KEY" }
              as: FrontDesk
              captures: { mk1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "FB-1", type: "FOB" }
              as: FrontDesk
              captures: { f1: $.data.id }
            - call: "POST /credentials/${mk1}/issue"
              payload: { person_id: "${s1}" }
              as: FrontDesk
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r1}" }
              as: FrontDesk
            - call: "POST /credentials/${mk1}/report-lost"
              as: FrontDesk
            - call: "GET /incidents?credential_id=${mk1}"
              as: SecurityOfficer
              captures: { inc: "$.data[0].id" }
            - call: "POST /rekey-campaigns"
              payload: { building_id: "${b}", key_node_id: "${m1}", incident_id: "${inc}", bill_to: "PERSON", bill_person_id: "${s1}" }
              as: SecurityAdmin
              captures: { camp: $.data.id }
            - call: "POST /incidents/${inc}/start-review"
              as: SecurityOfficer
            - call: "POST /rekey-campaigns/${camp}/approve"
              as: SecurityAdmin
            - call: "GET /work-orders?campaign_id=${camp}"
              as: SecurityOfficer
              captures: { wo1: "$.data[0].id", wo2: "$.data[1].id", wo3: "$.data[2].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T20:30:00Z" }
              as: SecurityAdmin
            - call: "POST /work-orders/${wo1}/start"
              as: SecurityOfficer
          trigger:
            - call: "POST /work-orders/${wo1}/complete"
              payload: { actual_cost_cents: 8000 }
              as: SecurityOfficer
            - call: "POST /work-orders/${wo2}/start"
              as: SecurityOfficer
            - call: "POST /work-orders/${wo2}/complete"
              payload: { actual_cost_cents: 8000 }
              as: SecurityOfficer
            - call: "POST /work-orders/${wo3}/start"
              as: SecurityOfficer
            - call: "POST /work-orders/${wo3}/complete"
              payload: { actual_cost_cents: 8000 }
              as: SecurityOfficer
            - call: "GET /rekey-campaigns/${camp}"
              as: SecurityAdmin
              captures: { final_cost: $.data.final_cost_cents }
          assert:
            - "final_cost == 49300  (door portion round_half_up((15000 + 8000*3) * 1.20) = 46800, plus 2500 KEY_REISSUE)"
            - "GET /charges?campaign_id=${camp}&kind=REKEY_CAMPAIGN -> [0].amount_cents == 46800"
            - "RekeyCampaign.${camp}.completed_at == 2026-08-01T20:30:00Z which is outside [08:00, 18:00) UTC"
            - "In-hours comparison from rekey_campaign_estimate_vs_final_divergence: identical rates completed at 10:00 produce NO surcharge multiplier"

      - name: settlement_forfeit_per_line_rounding_order
        grounds:
          - calculations.move_out_settlement
          - entities.Charge.fields.line_items
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-line-then-sum. Two CARD credentials: per line
          round_half_up(1501 * 1.25) = 1876, summed to 3752; the alternative
          sum-then-round gives round_half_up(3002 * 1.25) = 3753, one cent more.
        test_recipe:
          setup:
            - "Building B (defaults); hierarchy M -> C1"
            - "Resident R2 with key_deposit_cents 10000 holds two CARD credentials CA and CB"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Rounding Hall" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res Two", kind: "RESIDENT", unit_label: "U-2", key_deposit_cents: 10000 }
              as: FrontDesk
              captures: { r2: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "C-A", type: "CARD" }
              as: FrontDesk
              captures: { ca: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "C-B", type: "CARD" }
              as: FrontDesk
              captures: { cb: $.data.id }
            - call: "POST /credentials/${ca}/issue"
              payload: { person_id: "${r2}" }
              as: FrontDesk
            - call: "POST /credentials/${cb}/issue"
              payload: { person_id: "${r2}" }
              as: FrontDesk
          trigger:
            - call: "POST /persons/${r2}/move-out"
              as: FrontDesk
            - call: "GET /charges?person_id=${r2}&kind=MOVE_OUT_SETTLEMENT"
              as: FrontDesk
              captures: { prov: "$.data[0].provisional_refund_cents" }
          assert:
            - "prov == 6248  (10000 - (1876 + 1876)); a sum-then-round implementation would report 6247"
            - "line_items == [{credential_id: ${ca}, type: CARD, fee_cents: 1876}, {credential_id: ${cb}, type: CARD, fee_cents: 1876}] in (created_at ASC, serial_no ASC) order"

  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — cyclic machines on DIFFERENT entities
  # (Credential reissue loop vs Incident revision loop).
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: credential_issue_return_reissue_cycle
        grounds:
          - state_machines.Credential.IN_STOCK_to_ISSUED
          - state_machines.Credential.ISSUED_to_IN_STOCK
          - calculations.node_credential_counts
        distinguishing_aspect: |
          Entity = Credential. The machine is cyclic (IN_STOCK -> ISSUED ->
          IN_STOCK -> ISSUED to a different holder); node_credential_counts
          reconcile at every hop (2,1,0) -> (3,0,0) -> (2,1,0).
        test_recipe:
          setup:
            - "Building B; hierarchy M -> C1; three FOBs S-1/S-2/S-3 stocked on C1; residents R1 and R2"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Cycle House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res One", kind: "RESIDENT", unit_label: "U-1" }
              as: FrontDesk
              captures: { r1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res Two", kind: "RESIDENT", unit_label: "U-2" }
              as: FrontDesk
              captures: { r2: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "S-1", type: "FOB" }
              as: FrontDesk
              captures: { f1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "S-2", type: "FOB" }
              as: FrontDesk
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "S-3", type: "FOB" }
              as: FrontDesk
          trigger:
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r1}" }
              as: FrontDesk
            - call: "GET /key-nodes/${c1}"
              as: FrontDesk
              captures: { issued_1: $.data.issued_credential_count }
            - call: "POST /credentials/${f1}/return"
              as: FrontDesk
            - call: "GET /key-nodes/${c1}"
              as: FrontDesk
              captures: { stock_2: $.data.stock_credential_count }
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r2}" }
              as: FrontDesk
              captures: { holder_2: $.data.holder_person_id }
          assert:
            - "issued_1 == 1 after first issue (stock 2, issued 1, lost 0)"
            - "stock_2 == 3 after return (cycle back to IN_STOCK; holder/issued_at/expires_at cleared)"
            - "holder_2 == ${r2} after reissue — the same physical credential loops to a new holder"
            - "Credential.${f1}.status sequence: IN_STOCK -> ISSUED -> IN_STOCK -> ISSUED"

      - name: incident_review_resolve_reopen_dismiss_loop
        grounds:
          - state_machines.Incident.OPEN_to_UNDER_REVIEW
          - state_machines.Incident.UNDER_REVIEW_to_RESOLVED
          - state_machines.Incident.RESOLVED_to_UNDER_REVIEW
          - state_machines.Incident.UNDER_REVIEW_to_DISMISSED
        distinguishing_aspect: |
          Entity = Incident. Branching + revision loop: OPEN -> UNDER_REVIEW ->
          RESOLVED -> (reopen) -> UNDER_REVIEW -> DISMISSED; the retained
          resolution_action NONE from the first resolution proves the loop
          re-enters UNDER_REVIEW without wiping audit fields.
        test_recipe:
          setup:
            - "Building B; hierarchy M -> C1; staff S1 holds MK-1 (METAL_KEY on C1); MK-1 reported lost opens incident INC"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Loop House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Staff One", kind: "STAFF" }
              as: FrontDesk
              captures: { s1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "MK-1", type: "METAL_KEY" }
              as: FrontDesk
              captures: { k1: $.data.id }
            - call: "POST /credentials/${k1}/issue"
              payload: { person_id: "${s1}" }
              as: FrontDesk
            - call: "POST /credentials/${k1}/report-lost"
              as: FrontDesk
            - call: "GET /incidents?credential_id=${k1}"
              as: SecurityOfficer
              captures: { inc: "$.data[0].id" }
          trigger:
            - call: "POST /incidents/${inc}/start-review"
              as: SecurityOfficer
            - call: "POST /incidents/${inc}/resolve"
              payload: { resolution_action: "NONE", resolution_note: "Key recovered by staff" }
              as: SecurityOfficer
            - call: "POST /incidents/${inc}/reopen"
              as: SecurityOfficer
              captures: { st_reopen: $.data.status, act_retained: $.data.resolution_action }
            - call: "POST /incidents/${inc}/dismiss"
              as: SecurityOfficer
              captures: { st_final: $.data.status }
          assert:
            - "Incident.${inc}.status after start-review == UNDER_REVIEW"
            - "Incident.${inc}.status after resolve == RESOLVED"
            - "st_reopen == UNDER_REVIEW (revision loop re-entry)"
            - "act_retained == NONE (prior resolution_action retained for audit after reopen)"
            - "st_final == DISMISSED"

  # ---------------------------------------------------------------------------
  # Rule 4: transitive_cascade — depth >= 3 (work-order completion) and
  # depth >= 2 (report-lost), from DIFFERENT triggers.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: rekey_completion_cascade_repin_deactivate_bill
        grounds:
          - state_machines.MaintenanceWorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.Door.core_status_REKEY_REQUIRED_to_ACTIVE
          - state_machines.Credential.ISSUED_to_DEACTIVATED
        distinguishing_aspect: |
          Trigger = POST /work-orders/{id}/complete. Depth 3 chain where each
          hop is caused by the previous: work order completion re-pins Door D1
          (hop 1); the re-pin deactivates every credential on the old node C1
          (hop 2); each ISSUED credential's deactivation mints a KEY_REISSUE
          Charge (hop 3); campaign then completes with final_cost 24500.
        test_recipe:
          setup:
            - "Building B (default rates: base 15000, per-door 7500, per-key 2500, emergency 20)"
            - "Hierarchy M -> C1; door D1 on C1; resident R1 holds FOB FB-1 on C1"
            - "Proactive campaign on C1 approved (no incident); one REKEY work order WO1 targeting successor node C1' (label 'Change-1-R1')"
            - "WO1 started; clock at 10:00 (in business hours)"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Cascade Tower" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "Change-1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { d1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res One", kind: "RESIDENT", unit_label: "U-1" }
              as: FrontDesk
              captures: { r1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "FB-1", type: "FOB" }
              as: FrontDesk
              captures: { f1: $.data.id }
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r1}" }
              as: FrontDesk
            - call: "POST /rekey-campaigns"
              payload: { building_id: "${b}", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { camp: $.data.id }
            - call: "POST /rekey-campaigns/${camp}/approve"
              as: SecurityAdmin
            - call: "GET /work-orders?campaign_id=${camp}"
              as: SecurityOfficer
              captures: { wo1: "$.data[0].id" }
            - call: "POST /work-orders/${wo1}/start"
              as: SecurityOfficer
          trigger:
            - call: "POST /work-orders/${wo1}/complete"
              payload: { actual_cost_cents: 7000 }
              as: SecurityOfficer
            - call: "GET /doors/${d1}"
              as: SecurityOfficer
              captures: { d1_node: $.data.key_node_id, d1_bitting: $.data.bitting_code, d1_core: $.data.core_status }
            - call: "GET /credentials/${f1}"
              as: FrontDesk
              captures: { f1_status: $.data.status, f1_reason: $.data.deactivated_reason }
            - call: "GET /charges?campaign_id=${camp}&kind=KEY_REISSUE"
              as: FrontDesk
              captures: { kr_amount: "$.data[0].amount_cents", kr_person: "$.data[0].person_id" }
            - call: "GET /rekey-campaigns/${camp}"
              as: SecurityAdmin
              captures: { camp_status: $.data.status, camp_final: $.data.final_cost_cents }
            - call: "GET /key-nodes?supersedes_node_id=${c1}"
              as: SecurityAdmin
              captures: { succ: "$.data[0].id" }
            - call: "GET /key-nodes/${c1}"
              as: SecurityAdmin
              captures: { c1_status: $.data.status }
          assert:
            - "d1_core == ACTIVE and d1_bitting == 'Change-1-R1' (hop 1: door re-pinned to successor)"
            - "d1_node == ${succ} and successor KeyNode ${succ}.supersedes_node_id == ${c1}"
            - "f1_status == DEACTIVATED and f1_reason == REKEY (hop 2: credentials on old node deactivated)"
            - "kr_amount == 2500 and kr_person == null (hop 3: KEY_REISSUE charge, bill_to BUILDING default)"
            - "camp_status == COMPLETED and camp_final == 24500 (door portion 15000 + 7000 = 22000 in-hours, plus 2500 key portion)"
            - "c1_status == RETIRED (old scope subtree retired on campaign completion)"

      - name: report_lost_compromise_cascade_flags_subtree
        grounds:
          - state_machines.Credential.ISSUED_to_LOST
          - state_machines.KeyNode.ACTIVE_to_COMPROMISED
          - state_machines.Door.core_status_ACTIVE_to_REKEY_REQUIRED
        distinguishing_aspect: |
          Trigger = POST /credentials/{id}/report-lost. Depth >= 2 chain:
          credential LOST compromises its KeyNode M1 (hop 1); the compromise
          flags every door in subtree(M1) — D-1A, D-1B via C1 — REKEY_REQUIRED
          (hop 2) while sibling master M2's door D-2A stays ACTIVE, and opens a
          LOST_CREDENTIAL incident carrying the holder as responsible person.
        test_recipe:
          setup:
            - "Building B; hierarchy GM -> M1 -> C1 (doors D-1A, D-1B) and GM -> M2 -> C2 (door D-2A)"
            - "Staff S1 holds MK-1 (METAL_KEY on M1)"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Subtree Tower" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "GRAND_MASTER", label: "GM" }
              as: SecurityAdmin
              captures: { gm: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${gm}", level: "MASTER", label: "M1" }
              as: SecurityAdmin
              captures: { m1: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${gm}", level: "MASTER", label: "M2" }
              as: SecurityAdmin
              captures: { m2: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m1}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m2}", level: "CHANGE", label: "C2" }
              as: SecurityAdmin
              captures: { c2: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1A", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { d1: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1B", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { d2: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-2A", key_node_id: "${c2}" }
              as: SecurityAdmin
              captures: { d3: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Staff One", kind: "STAFF" }
              as: FrontDesk
              captures: { s1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${m1}", serial_no: "MK-1", type: "METAL_KEY" }
              as: FrontDesk
              captures: { mk1: $.data.id }
            - call: "POST /credentials/${mk1}/issue"
              payload: { person_id: "${s1}" }
              as: FrontDesk
          trigger:
            - call: "POST /credentials/${mk1}/report-lost"
              as: FrontDesk
              captures: { mk_status: $.data.status }
            - call: "GET /key-nodes/${m1}"
              as: SecurityAdmin
              captures: { m1_status: $.data.status }
            - call: "GET /doors/${d1}"
              as: SecurityAdmin
              captures: { d1_core: $.data.core_status }
            - call: "GET /doors/${d2}"
              as: SecurityAdmin
              captures: { d2_core: $.data.core_status }
            - call: "GET /doors/${d3}"
              as: SecurityAdmin
              captures: { d3_core: $.data.core_status }
            - call: "GET /key-nodes/${m2}"
              as: SecurityAdmin
              captures: { m2_status: $.data.status }
            - call: "GET /incidents?credential_id=${mk1}"
              as: SecurityOfficer
              captures: { inc_type: "$.data[0].type", inc_status: "$.data[0].status", inc_resp: "$.data[0].responsible_person_id" }
          assert:
            - "mk_status == LOST (hop 0)"
            - "m1_status == COMPROMISED (hop 1)"
            - "d1_core == REKEY_REQUIRED and d2_core == REKEY_REQUIRED (hop 2: subtree(M1) doors flagged)"
            - "d3_core == ACTIVE and m2_status == ACTIVE (sibling subtree untouched)"
            - "inc_type == LOST_CREDENTIAL, inc_status == OPEN, inc_resp == ${s1} (incident caused by the compromise)"

  # ---------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — DIFFERENT error-category
  # pairs: (state x business_safety) and (business_constraint x
  # business_temporal).
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: issue_state_error_beats_person_inactive_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_CREDENTIAL_NOT_ISSUABLE]
          - errors[ERR_PERSON_INACTIVE]
        distinguishing_aspect: |
          Category pair state vs business_safety: the credential is DEACTIVATED
          (state violation) AND the target resident is MOVED_OUT (safety
          violation); priority 5 state check wins, so the error is
          ERR_CREDENTIAL_NOT_ISSUABLE, not ERR_PERSON_INACTIVE.
        test_recipe:
          setup:
            - "Building B; hierarchy M -> C1; resident R1 held FOB F-1 and moved out (F-1 auto-DEACTIVATED); resident R2 also moved out"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Priority House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res One", kind: "RESIDENT", unit_label: "U-1" }
              as: FrontDesk
              captures: { r1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res Two", kind: "RESIDENT", unit_label: "U-2" }
              as: FrontDesk
              captures: { r2: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "F-1", type: "FOB" }
              as: FrontDesk
              captures: { f1: $.data.id }
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r1}" }
              as: FrontDesk
            - call: "POST /persons/${r1}/move-out"
              as: FrontDesk
            - call: "POST /persons/${r2}/move-out"
              as: FrontDesk
          trigger:
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r2}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CREDENTIAL_NOT_ISSUABLE (state, priority 5, beats business_safety ERR_PERSON_INACTIVE, priority 6)"
            - "Credential.${f1}.status == DEACTIVATED (unchanged)"
            - "Person.${r2}.status == MOVED_OUT (unchanged)"

      - name: vendor_issue_limit_beats_expiry_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_CREDENTIAL_LIMIT_EXCEEDED]
          - errors[ERR_VALIDITY_WINDOW_INVALID]
        distinguishing_aspect: |
          Category pair business_constraint vs business_temporal: vendor V1
          already holds 5 ISSUED credentials (limit violation) AND the new
          expires_at lies in the past (temporal violation); priority 8
          constraint check wins, so the error is ERR_CREDENTIAL_LIMIT_EXCEEDED,
          not ERR_VALIDITY_WINDOW_INVALID.
        test_recipe:
          setup:
            - "Building B with vendor_badge_pool_max 10; hierarchy M -> C1; vendor V1"
            - "V1 holds 5 FOB badges, each issued with an expires_at that has already passed (unswept: no run-ops has run), so status stays ISSUED but no badge is live"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Constraint House", vendor_badge_pool_max: 10 }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Vendor One", kind: "VENDOR", employer_name: "ACME Elevators" }
              as: FrontDesk
              captures: { v1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "VT-1", type: "FOB" }
              as: FrontDesk
              captures: { vt1: $.data.id }
            - call: "POST /credentials/${vt1}/issue"
              payload: { person_id: "${v1}", expires_at: "2026-08-01T09:00:00Z" }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:30:00Z" }
              as: SecurityAdmin
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "VT-2", type: "FOB" }
              as: FrontDesk
              captures: { vt2: $.data.id }
            - call: "POST /credentials/${vt2}/issue"
              payload: { person_id: "${v1}", expires_at: "2026-08-01T10:30:00Z" }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: SecurityAdmin
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "VT-3", type: "FOB" }
              as: FrontDesk
              captures: { vt3: $.data.id }
            - call: "POST /credentials/${vt3}/issue"
              payload: { person_id: "${v1}", expires_at: "2026-08-01T12:00:00Z" }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:30:00Z" }
              as: SecurityAdmin
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "VT-4", type: "FOB" }
              as: FrontDesk
              captures: { vt4: $.data.id }
            - call: "POST /credentials/${vt4}/issue"
              payload: { person_id: "${v1}", expires_at: "2026-08-01T13:30:00Z" }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T14:00:00Z" }
              as: SecurityAdmin
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "VT-5", type: "FOB" }
              as: FrontDesk
              captures: { vt5: $.data.id }
            - call: "POST /credentials/${vt5}/issue"
              payload: { person_id: "${v1}", expires_at: "2026-08-01T15:00:00Z" }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T15:30:00Z" }
              as: SecurityAdmin
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "VT-6", type: "FOB" }
              as: FrontDesk
              captures: { vt6: $.data.id }
          trigger:
            - call: "POST /credentials/${vt6}/issue"
              payload: { person_id: "${v1}", expires_at: "2026-08-01T15:00:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CREDENTIAL_LIMIT_EXCEEDED (business_constraint, priority 8, beats business_temporal ERR_VALIDITY_WINDOW_INVALID, priority 9)"
            - "The request also violated the temporal rule (expires_at 15:00 <= now 15:30), proving the ordering, not the absence of the second failure"
            - "Credential.${vt6}.status == IN_STOCK (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 6: boundary_precision_check — different metrics (seconds duration vs
  # zero-count scope) on different endpoints (run-ops vs campaign approve).
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: propped_alert_exact_threshold_boundary
        grounds:
          - calculations.propped_duration_check
          - entities.Door.fields.open_since
          - endpoints["POST /buildings/{buildingId}/run-ops"]
        distinguishing_aspect: |
          Metric = open duration in seconds, reached via run-ops. The rule is
          strictly-greater: at exactly 120 s no alert is created
          (propped_alerts_created == 0); one second later (121 s) exactly one
          alert appears with opened_at equal to the original open instant.
        test_recipe:
          setup:
            - "Building B with default_propped_threshold_seconds 120; hierarchy M -> C1; door D1 on C1"
            - "Staff S1 holds FOB K-1 on C1; access group G covers door D1 and S1 all week 00:00-23:59"
            - "At 08:00:00 a RECORDED access check GRANTS and opens D1 (open_since = 08:00:00)"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Boundary House", default_propped_threshold_seconds: 120, alert_escalation_minutes: 30, audit_retention_days: 30 }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { d1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Staff One", kind: "STAFF" }
              as: FrontDesk
              captures: { s1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "K-1", type: "FOB" }
              as: FrontDesk
              captures: { k1: $.data.id }
            - call: "POST /credentials/${k1}/issue"
              payload: { person_id: "${s1}" }
              as: FrontDesk
            - call: "POST /access-groups"
              payload: { building_id: "${b}", name: "AllHours", door_ids: ["${d1}"], person_ids: ["${s1}"], days_of_week: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"], window_start_utc: "00:00", window_end_utc: "23:59" }
              as: SecurityAdmin
            - call: "POST /doors/${d1}/access-checks"
              payload: { credential_id: "${k1}", mode: "RECORDED" }
              as: SecurityOfficer
              captures: { oc: $.data.outcome }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:02:00Z" }
              as: SecurityAdmin
          trigger:
            - call: "POST /buildings/${b}/run-ops"
              as: SecurityOfficer
              captures: { created_120: $.data.propped_alerts_created }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:02:01Z" }
              as: SecurityAdmin
            - call: "POST /buildings/${b}/run-ops"
              as: SecurityOfficer
              captures: { created_121: $.data.propped_alerts_created }
            - call: "GET /propped-alerts?door_id=${d1}"
              as: SecurityOfficer
              captures: { alert_status: "$.data[0].status", alert_opened: "$.data[0].opened_at" }
          assert:
            - "oc == GRANTED (door opened at 08:00:00)"
            - "created_120 == 0 (duration == threshold exactly; strictly-greater rule does not fire)"
            - "created_121 == 1 (duration 121 s > 120 s)"
            - "alert_status == OPEN and alert_opened == 2026-08-01T08:00:00Z"

      - name: rekey_approve_empty_scope_boundary
        grounds:
          - calculations.rekey_campaign_cost
          - errors[ERR_REKEY_SCOPE_EMPTY]
          - state_machines.RekeyCampaign.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          Metric = affected_door_count (zero-count edge), reached via
          POST /rekey-campaigns/{id}/approve. A campaign over a change node with
          zero pinned doors computes affected_door_count == 0 and its approval
          is rejected with ERR_REKEY_SCOPE_EMPTY; the campaign stays PROPOSED.
        test_recipe:
          setup:
            - "Building B; hierarchy M -> C1 with NO doors pinned to C1"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Empty Scope House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /rekey-campaigns"
              payload: { building_id: "${b}", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { camp: $.data.id, doors: $.data.affected_door_count }
          trigger:
            - call: "POST /rekey-campaigns/${camp}/approve"
              as: SecurityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "doors == 0"
            - "err == ERR_REKEY_SCOPE_EMPTY"
            - "RekeyCampaign.${camp}.status == PROPOSED (unchanged; no work orders minted)"
            - "GET /work-orders?campaign_id=${camp} -> empty list"

  # ---------------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — DIFFERENT entity pairs
  # (Credential<-Person and RekeyCampaign<-Incident).
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: issue_requires_active_person
        grounds:
          - state_machines.Credential.IN_STOCK_to_ISSUED
          - state_machines.Person.ACTIVE_to_MOVED_OUT
          - errors[ERR_PERSON_INACTIVE]
        distinguishing_aspect: |
          Entity pair Credential <- Person: the ISSUED transition's legality
          depends on the Person aggregate's status; a MOVED_OUT resident cannot
          receive credentials, so the issue is rejected and the credential
          stays IN_STOCK.
        test_recipe:
          setup:
            - "Building B; hierarchy M -> C1; resident R1 already MOVED_OUT; FOB F-1 IN_STOCK on C1"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "CrossDep House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res One", kind: "RESIDENT", unit_label: "U-1" }
              as: FrontDesk
              captures: { r1: $.data.id }
            - call: "POST /persons/${r1}/move-out"
              as: FrontDesk
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "F-1", type: "FOB" }
              as: FrontDesk
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r1}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERSON_INACTIVE"
            - "Credential.${f1}.status == IN_STOCK and holder_person_id == null (no partial mutation)"

      - name: campaign_approve_requires_reviewed_incident
        grounds:
          - state_machines.RekeyCampaign.PROPOSED_to_APPROVED
          - state_machines.Incident.OPEN_to_UNDER_REVIEW
          - errors[ERR_INCIDENT_NOT_REVIEWED]
        distinguishing_aspect: |
          Entity pair RekeyCampaign <- Incident: approval of a loss-originated
          campaign is gated on the linked incident having left OPEN; approving
          while the incident is still OPEN fails with ERR_INCIDENT_NOT_REVIEWED
          and the campaign stays PROPOSED.
        test_recipe:
          setup:
            - "Building B; hierarchy M -> C1; door D1 on C1; staff S1 holds F-1 (FOB on C1)"
            - "F-1 reported lost -> incident INC created OPEN; campaign created with incident_id = INC (no start-review performed)"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Gate House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { d1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Staff One", kind: "STAFF" }
              as: FrontDesk
              captures: { s1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "F-1", type: "FOB" }
              as: FrontDesk
              captures: { f1: $.data.id }
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${s1}" }
              as: FrontDesk
            - call: "POST /credentials/${f1}/report-lost"
              as: FrontDesk
            - call: "GET /incidents?credential_id=${f1}"
              as: SecurityOfficer
              captures: { inc: "$.data[0].id" }
            - call: "POST /rekey-campaigns"
              payload: { building_id: "${b}", key_node_id: "${c1}", incident_id: "${inc}" }
              as: SecurityAdmin
              captures: { camp: $.data.id }
          trigger:
            - call: "POST /rekey-campaigns/${camp}/approve"
              as: SecurityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INCIDENT_NOT_REVIEWED (incident still OPEN)"
            - "RekeyCampaign.${camp}.status == PROPOSED (unchanged)"
            - "GET /key-nodes?supersedes_node_id=${c1} -> empty list (no successor subtree minted)"

  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — DIFFERENT interval semantics on
  # different resources: half-open interval intersection on Door vs
  # instantaneous aggregate capacity on Building.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: work_order_half_open_overlap_vs_adjacency
        grounds:
          - errors[ERR_WORK_ORDER_OVERLAP]
          - validations[priority=8]
          - entities.MaintenanceWorkOrder.fields.scheduled_start
        distinguishing_aspect: |
          Resource = Door, semantics = half-open [scheduled_start,
          scheduled_end) intersection: touching endpoints (12:00 == 12:00) do
          NOT conflict, while a true intersection (11:00-12:00 vs 10:00-12:00
          shares the instant 11:30) is rejected with ERR_WORK_ORDER_OVERLAP.
        test_recipe:
          setup:
            - "Building B; hierarchy M -> C1; door D1 on C1; clock at 08:00"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Schedule House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b}", door_code: "D-1", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { d1: $.data.id }
            - call: "POST /work-orders"
              payload: { building_id: "${b}", door_id: "${d1}", type: "HARDWARE_REPAIR", scheduled_start: "2026-08-01T10:00:00Z", scheduled_end: "2026-08-01T12:00:00Z" }
              as: SecurityOfficer
              captures: { wo_a: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { building_id: "${b}", door_id: "${d1}", type: "INSPECTION", scheduled_start: "2026-08-01T12:00:00Z", scheduled_end: "2026-08-01T14:00:00Z" }
              as: SecurityOfficer
              captures: { wo_b: $.data.id }
            - call: "POST /work-orders"
              payload: { building_id: "${b}", door_id: "${d1}", type: "BATTERY_REPLACE", scheduled_start: "2026-08-01T11:00:00Z", scheduled_end: "2026-08-01T12:00:00Z" }
              as: SecurityOfficer
              captures: { err: $.data.error_id }
            - call: "POST /work-orders"
              payload: { building_id: "${b}", door_id: "${d1}", type: "BATTERY_REPLACE", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }
              as: SecurityOfficer
              captures: { wo_d: $.data.id }
          assert:
            - "wo_b created (adjacent at 12:00 allowed under half-open semantics)"
            - "err == ERR_WORK_ORDER_OVERLAP (11:00-12:00 strictly inside A's 10:00-12:00)"
            - "wo_d created (adjacent at 10:00 on the other side)"
            - "GET /work-orders?door_id=${d1} -> 3 rows, all OPEN"

      - name: vendor_badge_pool_capacity_at_instant
        grounds:
          - errors[ERR_VENDOR_BADGE_POOL_EXHAUSTED]
          - calculations.vendor_expiry_sweep
          - entities.Building.fields.vendor_badge_pool_max
        distinguishing_aspect: |
          Resource = Building vendor badge pool, semantics = instantaneous
          aggregate capacity (no interval intersection arithmetic): at the
          issue instant the count of live badges equals vendor_badge_pool_max
          (2), so the third issue fails; after the clock passes the expiry and
          run-ops sweeps both badges, the same issue succeeds.
        test_recipe:
          setup:
            - "Building B with vendor_badge_pool_max 2; hierarchy M -> C1; vendors V1, V2, V3"
            - "At 09:00, V1 and V2 each hold a live badge expiring 12:00"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Pool House", vendor_badge_pool_max: 2 }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Vendor One", kind: "VENDOR", employer_name: "ACME" }
              as: FrontDesk
              captures: { v1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Vendor Two", kind: "VENDOR", employer_name: "ACME" }
              as: FrontDesk
              captures: { v2: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Vendor Three", kind: "VENDOR", employer_name: "ACME" }
              as: FrontDesk
              captures: { v3: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "VB-1", type: "FOB" }
              as: FrontDesk
              captures: { vb1: $.data.id }
            - call: "POST /credentials/${vb1}/issue"
              payload: { person_id: "${v1}", expires_at: "2026-08-01T12:00:00Z" }
              as: FrontDesk
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "VB-2", type: "FOB" }
              as: FrontDesk
              captures: { vb2: $.data.id }
            - call: "POST /credentials/${vb2}/issue"
              payload: { person_id: "${v2}", expires_at: "2026-08-01T12:00:00Z" }
              as: FrontDesk
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "VB-3", type: "FOB" }
              as: FrontDesk
              captures: { vb3: $.data.id }
          trigger:
            - call: "POST /credentials/${vb3}/issue"
              payload: { person_id: "${v3}", expires_at: "2026-08-01T12:00:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:30:00Z" }
              as: SecurityAdmin
            - call: "POST /buildings/${b}/run-ops"
              as: SecurityOfficer
              captures: { swept: $.data.vendor_credentials_expired }
            - call: "POST /credentials/${vb3}/issue"
              payload: { person_id: "${v3}", expires_at: "2026-08-01T15:00:00Z" }
              as: FrontDesk
              captures: { vb3_status: $.data.status }
          assert:
            - "err == ERR_VENDOR_BADGE_POOL_EXHAUSTED (count == max at the issue instant; the boundary is inclusive of max)"
            - "swept == 2 (VB-1 and VB-2 expired at 12:00 <= 12:30)"
            - "Credential.${vb1}.status == DEACTIVATED with deactivated_reason == EXPIRED"
            - "vb3_status == ISSUED (pool freed after the sweep)"

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant — DIFFERENT conserved quantities (physical
  # credential counts vs deposit money).
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: credential_pool_conservation_across_issue_return
        grounds:
          - calculations.node_credential_counts
          - state_machines.Credential.IN_STOCK_to_ISSUED
          - state_machines.Credential.ISSUED_to_IN_STOCK
        distinguishing_aspect: |
          Conserved quantity = physical credential pool per node:
          stock_credential_count + issued_credential_count +
          lost_credential_count == 3 at every step; the forward action (issue)
          paired with its compensating action (return) restores the exact
          pre-action counts (3, 0, 0).
        test_recipe:
          setup:
            - "Building B; hierarchy M -> C1; three FOBs S-1/S-2/S-3 stocked on C1; resident R1"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Ledger House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res One", kind: "RESIDENT", unit_label: "U-1" }
              as: FrontDesk
              captures: { r1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "S-1", type: "FOB" }
              as: FrontDesk
              captures: { f1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "S-2", type: "FOB" }
              as: FrontDesk
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "S-3", type: "FOB" }
              as: FrontDesk
            - call: "GET /key-nodes/${c1}"
              as: FrontDesk
              captures: { stock_0: $.data.stock_credential_count, issued_0: $.data.issued_credential_count, lost_0: $.data.lost_credential_count }
          trigger:
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r1}" }
              as: FrontDesk
            - call: "GET /key-nodes/${c1}"
              as: FrontDesk
              captures: { stock_1: $.data.stock_credential_count, issued_1: $.data.issued_credential_count, lost_1: $.data.lost_credential_count }
            - call: "POST /credentials/${f1}/return"
              as: FrontDesk
            - call: "GET /key-nodes/${c1}"
              as: FrontDesk
              captures: { stock_2: $.data.stock_credential_count, issued_2: $.data.issued_credential_count, lost_2: $.data.lost_credential_count }
          assert:
            - "stock_0 == 3 and issued_0 == 0 and lost_0 == 0"
            - "stock_1 == 2 and issued_1 == 1 and lost_1 == 0 (forward action)"
            - "stock_2 == 3 and issued_2 == 0 and lost_2 == 0 (compensating action restores baseline exactly)"
            - "stock_i + issued_i + lost_i == 3 at every observation"

      - name: settlement_deposit_split_conservation_across_void
        grounds:
          - calculations.move_out_settlement
          - state_machines.Charge.DRAFT_to_ISSUED
          - state_machines.Charge.ISSUED_to_VOID
        distinguishing_aspect: |
          Conserved quantity = deposit money: at ISSUE the identity
          final_forfeit_total_cents + final_refund_cents == deposit_cents
          (5625 + 4375 == 10000) holds exactly; the forward action (issue)
          paired with its compensating action (void) leaves the person's total
          PAID amount at 0, identical to before the settlement existed.
        test_recipe:
          setup:
            - "Building B; hierarchy M -> C1; resident R1 with key_deposit_cents 10000 holds FOB F-1 (fee line 5625)"
            - "R1 moved out; settlement charge created DRAFT"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Money House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Res One", kind: "RESIDENT", unit_label: "U-1", key_deposit_cents: 10000 }
              as: FrontDesk
              captures: { r1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "F-1", type: "FOB" }
              as: FrontDesk
              captures: { f1: $.data.id }
            - call: "POST /credentials/${f1}/issue"
              payload: { person_id: "${r1}" }
              as: FrontDesk
            - call: "POST /persons/${r1}/move-out"
              as: FrontDesk
            - call: "GET /charges?person_id=${r1}&kind=MOVE_OUT_SETTLEMENT"
              as: FrontDesk
              captures: { ch: "$.data[0].id" }
          trigger:
            - call: "POST /charges/${ch}/issue"
              as: FrontDesk
            - call: "GET /charges/${ch}"
              as: FrontDesk
              captures: { forfeit: $.data.final_forfeit_total_cents, refund: $.data.final_refund_cents, amt: $.data.amount_cents }
            - call: "POST /charges/${ch}/void"
              as: SecurityAdmin
            - call: "GET /charges?person_id=${r1}&status=PAID"
              as: FrontDesk
              captures: { paid_count: $.data }
          assert:
            - "forfeit == 5625 and refund == 4375 and forfeit + refund == 10000 == deposit_cents (deposit fully allocated)"
            - "amt == 0 (max(0, 5625 - 10000))"
            - "Charge.${ch}.status == VOID after the compensating void"
            - "paid_count is an empty array (person's paid total returns to the pre-settlement baseline of 0)"
