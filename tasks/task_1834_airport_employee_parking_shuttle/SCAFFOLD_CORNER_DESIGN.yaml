          trigger:
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e1}", captures: { err1: $.data.error_id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: CANCEL }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P003" }, as: Employee, as_user_id: "${e1}", captures: { p2: $.data } }
          assert:
