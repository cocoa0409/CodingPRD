  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: program_pull_quarantines_lots_cancels_shipments_restores_units
        grounds:
          - state_machines.SeasonalProgram.ON_SHELF_to_DISPOSITION
          - state_machines.Shipment.PLANNED_to_CANCELLED
          - state_machines.InventoryLot.AVAILABLE_to_QUARANTINED
        distinguishing_aspect: "Depth-3 cascade off the advance trigger: pull quarantines program lots (1); quarantine cancels the still-PLANNED shipment (2); the cancellation restores its 30 units onto the source lot (3) — lot ends at 100, not 70."
        test_recipe:
          setup:
            - "Program ON_SHELF; GOLD commitment 60 ALLOCATED; one lot of 100 units at W1 drawn down to 70 by a 30-unit PLANNED shipment (never delivered); clock reaches pull_on 2027-11-15."
          setup_api_calls:
            - *k_clock_0105
            - *k_prog
            - *k_prog_open
            - *k_retailer_gold
