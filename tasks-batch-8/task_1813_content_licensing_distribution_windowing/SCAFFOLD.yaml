# =============================================================================
# Task 1813 — Content Licensing & Distribution Windowing (studio distribution)
# Scaffold seed tables (§1.0–§1.7). Difficulty/Corner designs live in sibling
# files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "1813. Content Licensing & Distribution Windowing (studio distribution division): title rights inventory by territory/language/window, avail generation & platform offer packaging, exclusivity & holdback enforcement across windows, license fee structure (flat/revenue share/minimum guarantee) & recoupment, delivery of assets & metadata to platform specs, expiration & takedown scheduling, rights conflict detection, royalty reporting to rights holders"

domain_name: content-licensing-windowing
api_prefix: /licensing

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # overlapping/adjacent license windows, holdbacks, half-open vs buffered-closed interval semantics
  secondary_archetype: ledger_reconciliation   # MG recoupment waterfall vs statement attribution — two algorithms over the same revenue events
  complexity_layers:
    - optimistic_concurrency                   # OCC on LicenseAgreement.version for report submission & extension
    - cascading_side_effects                   # withdraw → block → auto-expire → NOT_SELECTED; terminate → free slot → unblock lines
    - scheduled_actions                        # takedown notices scheduled at license_end, executed by clock sweep, cancelled on extend
    - derived_field_reconciliation             # recouped_cents / royalty_payable_cents / outstanding_recoupment_cents recomputed on report reversal
  entity_topology: flat                        # peer entities joined by FK references; no nested URL ownership
  state_machine_shape: cyclic                  # RightsSlot AVAILABLE↔ENCUMBERED; DeliveryBatch QUEUED→REJECTED→QUEUED
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties            # statement finalizer cannot be statement payer
  consistency_model: immediate                 # all mutations + cascades visible in the same request's response / immediate re-read

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all common_fields: true)
# =============================================================================
entities:
  - name: Title
    parent: null
    common_fields: true
    fields:
      - { name: title_code, type: string, source: input, description: "Unique business code for the title", constraints: "unique across all titles" }
      - { name: name, type: string, source: input, description: "Display name of the film/series" }
      - { name: content_type, type: enum, source: input, description: "FILM | SERIES" }
      - { name: original_language, type: string, source: input, description: "ISO-639 language code of the original audio" }
      - { name: production_year, type: integer, source: input, description: "Year of first release" }
      - { name: embargoed_territories, type: array, source: input, description: "Array of ISO-3166 alpha-2 territory codes where this title may never be licensed (compliance embargo)", default: "[]" }

  - name: RightsHolder
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the rights holder (royalty payee)" }
      - { name: payee_reference, type: string, source: input, description: "Accounts payable reference" }
      - { name: royalty_share_pct, type: number, source: input, description: "Percentage (0,100] of studio net royalty payable to this holder on royalty statements" }

  - name: Platform
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Platform display name" }
      - { name: platform_type, type: enum, source: input, description: "SVOD | AVOD | TVOD | EST" }
      - { name: metadata_spec_version, type: string, source: input, description: "Metadata spec the platform ingests (e.g. MEC-2.3); deliveries must match it" }
      - { name: required_asset_profiles, type: array, source: input, description: "Asset profile tags every delivery batch must include (e.g. [4K_HDR, CC_EN])", constraints: "at least 1 profile" }

  - name: RightsSlot
    parent: null
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the title this inventory row belongs to" }
      - { name: rights_holder_id, type: string, source: input, description: "FK -> RightsHolder.id; holder who receives royalties for licenses of this slot" }
      - { name: territory_code, type: string, source: input, description: "ISO-3166 alpha-2 territory" }
      - { name: language_code, type: string, source: input, description: "ISO-639 language of exploitation rights" }
      - { name: window_type, type: enum, source: input, description: "THEATRICAL | EST | TVOD | SVOD | AVOD | FREE_TV" }
      - { name: sellable_from, type: datetime, source: input, description: "Start of the rights period the studio owns (inclusive)" }
      - { name: sellable_to, type: datetime, source: input, description: "End of the rights period (exclusive); slot EXPIRED when logical clock >= sellable_to", constraints: "strictly after sellable_from" }
      - { name: slot_status, type: enum, source: system, description: "AVAILABLE | ENCUMBERED | WITHDRAWN | EXPIRED", default: "AVAILABLE", constraints: "tuple (title_id, territory_code, language_code, window_type) unique among slots with slot_status IN {AVAILABLE, ENCUMBERED}" }

  - name: AvailPackage
    parent: null
    common_fields: true
    fields:
      - { name: platform_id, type: string, source: input, description: "FK -> Platform.id; the buyer this offer is addressed to" }
      - { name: name, type: string, source: input, description: "Offer name" }
      - { name: offer_expires_at, type: datetime, source: input, description: "Offer expiry instant; package EXPIRED when logical clock >= offer_expires_at" }
      - { name: package_status, type: enum, source: system, description: "DRAFT | OFFERED | ACCEPTED | PARTIALLY_ACCEPTED | DECLINED | WITHDRAWN | EXPIRED", default: "DRAFT" }
      - { name: lines, type: array, source: input, description: "Offered terms per slot. Each element carries input sub-fields {slot_id, license_start, license_end, exclusive, fee_model, flat_fee_cents?, revenue_share_pct?, minimum_guarantee_cents?, proration_mode?} and computed sub-fields line_status (PENDING | OFFERED | BLOCKED | LICENSED | NOT_SELECTED; initial PENDING) and created_license_id (null until accept). slot_id values reference RightsSlot rows; slot_ids must be distinct within one package. Lines are embedded in the package document, not a standalone resource.", constraints: "at least 1 line" }
      - { name: guaranteed_total_cents, type: integer, source: computed, description: "Sum over ALL lines of guaranteed value: FLAT_FEE contributes flat_fee_cents, MINIMUM_GUARANTEE contributes minimum_guarantee_cents, REVENUE_SHARE contributes 0. Computed at creation, immutable thereafter." }
      - { name: discount_pct, type: number, source: computed, description: "Volume discount tier applied at accept; null until accept" }
      - { name: discount_cents, type: integer, source: computed, description: "Total discount applied at accept; null until accept" }
      - { name: net_total_cents, type: integer, source: computed, description: "guaranteed total over accepted lines minus discount_cents; null until accept" }
      - { name: offered_at, type: datetime, source: system, description: "Logical-clock timestamp when the package entered OFFERED; null until offer" }

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: package_id, type: string, source: system, description: "FK -> AvailPackage.id; originating package, null for direct deals" }
      - { name: platform_id, type: string, source: input, description: "FK -> Platform.id; licensee platform (copied from package on accept, input on direct create)" }
      - { name: slot_id, type: string, source: input, description: "FK -> RightsSlot.id; licensed inventory slot (copied from line on accept, input on direct create)" }
      - { name: territory_code, type: string, source: system, description: "Denormalized from slot at creation for conflict queries" }
      - { name: language_code, type: string, source: system, description: "Denormalized from slot at creation" }
      - { name: window_type, type: enum, source: system, description: "Denormalized from slot at creation" }
      - { name: license_start, type: datetime, source: input, description: "Licensed window start (inclusive); must be >= slot.sellable_from" }
      - { name: license_end, type: datetime, source: input, description: "Licensed window end (exclusive); must be <= slot.sellable_to and > license_start" }
      - { name: exclusive, type: boolean, source: input, description: "Exclusive licenses encumber the slot and impose holdbacks on blocked windows" }
      - { name: fee_model, type: enum, source: input, description: "FLAT_FEE | REVENUE_SHARE | MINIMUM_GUARANTEE" }
      - { name: flat_fee_cents, type: integer, source: input, description: "Required (>0) iff fee_model == FLAT_FEE; otherwise 0", default: 0 }
      - { name: revenue_share_pct, type: number, source: input, description: "Required ((0,100]) iff fee_model IN {REVENUE_SHARE, MINIMUM_GUARANTEE}; otherwise 0", default: 0 }
      - { name: minimum_guarantee_cents, type: integer, source: input, description: "Required (>0) iff fee_model == MINIMUM_GUARANTEE; otherwise 0", default: 0 }
      - { name: proration_mode, type: enum, source: input, description: "DAILY_PRORATION | MONTHLY_PRORATION — termination credit algorithm selector", default: "DAILY_PRORATION" }
      - { name: allocated_fee_cents, type: integer, source: computed, description: "Guaranteed fee after package volume-discount allocation; equals flat_fee_cents or minimum_guarantee_cents for direct deals, 0 for REVENUE_SHARE" }
      - { name: recouped_cents, type: integer, source: computed, description: "Cumulative recoupment applied against the minimum guarantee from SUBMITTED revenue reports", default: 0 }
      - { name: royalty_payable_cents, type: integer, source: computed, description: "Cumulative payable portion (accrued minus recouped) over SUBMITTED revenue reports", default: 0 }
      - { name: outstanding_recoupment_cents, type: integer, source: computed, description: "max(0, minimum_guarantee_cents - recouped_cents) for MG licenses; 0 otherwise" }
      - { name: termination_credit_cents, type: integer, source: computed, description: "Prorated credit computed at terminate per proration_mode; null until TERMINATED; computed with terminated_at = logical clock" }
      - { name: holdback_until, type: datetime, source: computed, description: "For exclusive licenses on windows with a non-empty HOLDBACK_MATRIX row: license_end + buffer days; null otherwise" }
      - { name: license_status, type: enum, source: system, description: "EXECUTED | ACTIVE | EXPIRED | TERMINATED", default: "EXECUTED" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of activation; null until ACTIVE" }

  - name: DeliveryBatch
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> LicenseAgreement.id; the license these assets fulfill" }
      - { name: asset_manifest, type: array, source: input, description: "Asset profile tags included in this delivery attempt", constraints: "at least 1 profile" }
      - { name: metadata_spec_version, type: string, source: input, description: "Metadata spec used for this delivery; must equal the licensee platform's metadata_spec_version" }
      - { name: delivery_status, type: enum, source: system, description: "QUEUED | DELIVERED | REJECTED", default: "QUEUED" }
      - { name: missing_profiles, type: array, source: computed, description: "required_asset_profiles of the platform not present in asset_manifest; empty when the spec check passed" }
      - { name: attempt_count, type: integer, source: system, description: "Number of submit attempts; increments on every submit", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of last submit; null until first submit" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of successful delivery; null until DELIVERED" }

  - name: TakedownNotice
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> LicenseAgreement.id; auto-created (SCHEDULED at license_end) when a license is created; recreated on extend" }
      - { name: scheduled_for, type: datetime, source: system, description: "Takedown instant; equals the license's current license_end" }
      - { name: notice_status, type: enum, source: system, description: "SCHEDULED | EXECUTED | CANCELLED", default: "SCHEDULED" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp of execution; null until EXECUTED" }

  - name: RevenueReport
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> LicenseAgreement.id; taken from the path of POST /licensing/license-agreements/{id}/revenue-reports" }
      - { name: period_start, type: datetime, source: input, description: "Usage period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Usage period end (inclusive for attribution overlap); must be > period_start and <= logical clock at submission" }
      - { name: gross_revenue_cents, type: integer, source: input, description: "Platform-reported gross revenue for the period; must be > 0" }
      - { name: royalty_accrued_cents, type: integer, source: computed, description: "round_half_up(gross_revenue_cents * revenue_share_pct / 100) computed at submission" }
      - { name: recoupment_applied_cents, type: integer, source: computed, description: "Portion of royalty_accrued_cents withheld against outstanding MG at submission (0 for REVENUE_SHARE)" }
      - { name: payable_cents, type: integer, source: computed, description: "royalty_accrued_cents - recoupment_applied_cents" }
      - { name: report_status, type: enum, source: system, description: "SUBMITTED | REVERSED", default: "SUBMITTED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission; used by BY_REPORT_DATE statement attribution" }

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - { name: rights_holder_id, type: string, source: input, description: "FK -> RightsHolder.id; payee of this statement" }
      - { name: period_start, type: datetime, source: input, description: "Statement period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Statement period end (inclusive); must be > period_start", constraints: "period must not overlap (closed-interval) any other DRAFT or FINALIZED statement of the same holder" }
      - { name: attribution_mode, type: enum, source: input, description: "BY_REPORT_DATE | BY_USAGE_PERIOD — which revenue reports fall into this statement period" }
      - { name: included_report_ids, type: array, source: computed, description: "Ids of RevenueReports in scope (see calculations.statement_attribution)" }
      - { name: gross_revenue_cents, type: integer, source: computed, description: "Sum of gross_revenue_cents over included reports" }
      - { name: studio_net_royalty_cents, type: integer, source: computed, description: "Sum of payable_cents over included reports (per-report rounded values are summed; never recomputed from gross)" }
      - { name: holder_royalty_due_cents, type: integer, source: computed, description: "round_half_up(studio_net_royalty_cents * rights_holder.royalty_share_pct / 100); rounded exactly once at the end" }
      - { name: statement_status, type: enum, source: system, description: "DRAFT | FINALIZED | PAID", default: "DRAFT" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceAnalyst who finalized; null until FINALIZED" }
      - { name: paid_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceController who marked paid; null until PAID; must differ from finalized_by_user_id" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RightsSlot
    initial_state: AVAILABLE
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: AVAILABLE
        to: ENCUMBERED
        trigger: "side effect of POST /licensing/license-agreements or POST /licensing/avail-packages/{id}/accept creating an exclusive license on this slot"
        actor: system
        preconditions: ["created license has exclusive == true", "slot previously AVAILABLE or already ENCUMBERED by another exclusive license (idempotent when already ENCUMBERED)"]
        side_effects:
          - "(hop 1) every lines[] element referencing this slot inside packages with package_status == OFFERED -> line_status BLOCKED (lines on the package being accepted are excluded — they transition to LICENSED instead)"
          - "(hop 2) an OFFERED package whose every line is BLOCKED -> package_status EXPIRED (nothing sellable remains)"
          - "(hop 3) when a package transitions to EXPIRED, all its non-LICENSED lines -> NOT_SELECTED"
      - from: ENCUMBERED
        to: AVAILABLE
        trigger: "side effect of an exclusive license on this slot becoming EXPIRED or TERMINATED"
        actor: system
        preconditions: ["no remaining EXECUTED or ACTIVE exclusive license references this slot", "slot not already EXPIRED or WITHDRAWN (slot expiry dominates)"]
        side_effects:
          - "(hop 1) lines[] elements referencing this slot with line_status == BLOCKED inside packages with package_status == OFFERED -> OFFERED"
      - from: AVAILABLE
        to: WITHDRAWN
        trigger: "POST /licensing/rights-slots/{id}/withdraw"
        actor: RightsManager
        preconditions: ["slot_status == AVAILABLE"]
        side_effects:
          - "(hop 1) every lines[] element referencing this slot inside OFFERED packages -> BLOCKED"
          - "(hop 2) an OFFERED package whose every line is BLOCKED -> EXPIRED"
          - "(hop 3) package EXPIRED -> its non-LICENSED lines -> NOT_SELECTED"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "expiration sweep (POST /licensing/_clock/set_current_utc) when logical clock >= sellable_to"
        actor: system
        preconditions: ["logical clock >= sellable_to"]
        side_effects:
          - "OFFERED-package lines on this slot -> BLOCKED, then all-blocked package rule (hop 2/hop 3 above)"
      - from: ENCUMBERED
        to: EXPIRED
        trigger: "expiration sweep when logical clock >= sellable_to"
        actor: system
        preconditions: ["logical clock >= sellable_to"]
        side_effects:
          - "(hop 1) every EXECUTED or ACTIVE license on this slot -> TERMINATED (rights lapse; termination_credit_cents computed normally per proration_mode with terminated_at = sweep time)"
          - "(hop 2) each such license's SCHEDULED TakedownNotice -> EXECUTED with executed_at = sweep time"
          - "OFFERED-package lines on this slot -> BLOCKED, then all-blocked package rule"

  - entity: AvailPackage
    initial_state: DRAFT
    terminal_states: [ACCEPTED, PARTIALLY_ACCEPTED, DECLINED, WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /licensing/avail-packages/{id}/offer"
        actor: RightsManager
        preconditions:
          - "package_status == DRAFT"
          - "every line's slot exists and has slot_status == AVAILABLE (else ERR_SLOT_NOT_AVAILABLE)"
          - "every line window ⊆ its slot's [sellable_from, sellable_to) (else ERR_WINDOW_OUTSIDE_RIGHTS)"
          - "no exclusivity or holdback conflict for any line against EXECUTED/ACTIVE licenses or between lines of this package (else ERR_EXCLUSIVITY_CONFLICT / ERR_HOLDBACK_CONFLICT)"
          - "offer_expires_at > logical clock (else ERR_OFFER_WINDOW_PAST)"
        side_effects:
          - "every line PENDING -> OFFERED"
          - "offered_at = logical clock"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /licensing/avail-packages/{id}/accept with accepted_slot_ids covering every line"
        actor: PlatformBuyer
        preconditions:
          - "package_status == OFFERED (else ERR_PACKAGE_NOT_OFFERED)"
          - "acting PlatformBuyer's X-User-ID == package.platform_id (else ERR_FORBIDDEN)"
          - "accepted_slot_ids non-empty (else ERR_EMPTY_ACCEPTANCE) and every element is a slot referenced by some line of this package (else ERR_LINE_NOT_IN_PACKAGE)"
          - "every accepted line has line_status == OFFERED (else ERR_LINE_BLOCKED)"
          - "re-validated for accepted lines: window ⊆ slot rights, exclusivity + holdback conflicts against EXECUTED/ACTIVE licenses and pairwise within the accepted set"
        side_effects:
          - "run calculations.package_volume_discount over the ACCEPTED lines; store discount_pct / discount_cents / net_total_cents on the package"
          - "create one LicenseAgreement per accepted line (status EXECUTED, terms copied from the line, allocated_fee_cents = line guaranteed value minus allocated discount share, package_id set)"
          - "accepted lines -> LICENSED with created_license_id set; non-accepted lines -> NOT_SELECTED"
          - "auto-create one TakedownNotice per created license, SCHEDULED at that license's license_end"
          - "for each accepted line with exclusive == true: slot -> ENCUMBERED (cascade hop 1..3 of RightsSlot AVAILABLE->ENCUMBERED)"
      - from: OFFERED
        to: PARTIALLY_ACCEPTED
        trigger: "POST /licensing/avail-packages/{id}/accept with accepted_slot_ids a strict subset of the package's lines"
        actor: PlatformBuyer
        preconditions: ["same as OFFERED -> ACCEPTED"]
        side_effects: ["same as OFFERED -> ACCEPTED"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /licensing/avail-packages/{id}/decline"
        actor: PlatformBuyer
        preconditions: ["package_status == OFFERED", "acting buyer owns the package"]
        side_effects: ["non-LICENSED lines -> NOT_SELECTED"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /licensing/avail-packages/{id}/withdraw"
        actor: RightsManager
        preconditions: ["package_status == DRAFT"]
        side_effects: ["lines -> NOT_SELECTED"]
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /licensing/avail-packages/{id}/withdraw"
        actor: RightsManager
        preconditions: ["package_status == OFFERED"]
        side_effects: ["non-LICENSED lines -> NOT_SELECTED"]
      - from: OFFERED
        to: EXPIRED
        trigger: "expiration sweep when logical clock >= offer_expires_at, OR all-blocked cascade (every line BLOCKED)"
        actor: system
        preconditions: ["logical clock >= offer_expires_at, or every line has line_status == BLOCKED"]
        side_effects: ["non-LICENSED lines -> NOT_SELECTED"]

  - entity: LicenseAgreement
    initial_state: EXECUTED
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: EXECUTED
        to: ACTIVE
        trigger: "POST /licensing/license-agreements/{id}/activate"
        actor: RightsManager
        preconditions:
          - "license_status == EXECUTED (else ERR_LICENSE_NOT_EXECUTABLE)"
          - "logical clock >= license_start (else ERR_LICENSE_NOT_STARTED)"
          - "exists a DeliveryBatch with license_id == this license and delivery_status == DELIVERED (else ERR_DELIVERY_INCOMPLETE)"
        side_effects: ["activated_at = logical clock"]
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /licensing/license-agreements/{id}/terminate, or rights-lapse cascade when the slot expires"
        actor: RightsManager
        preconditions: ["license_status IN {EXECUTED, ACTIVE} for the endpoint (else ERR_LICENSE_ALREADY_TERMINAL)"]
        side_effects:
          - "(hop 1) termination_credit_cents computed per calculations.termination_credit with terminated_at = logical clock"
          - "(hop 1) this license's SCHEDULED TakedownNotice -> EXECUTED with executed_at = logical clock (immediate takedown on early termination)"
          - "(hop 2) if exclusive and no other EXECUTED/ACTIVE exclusive license references the slot: slot ENCUMBERED -> AVAILABLE"
          - "(hop 3) slot becoming AVAILABLE -> BLOCKED lines on OFFERED packages -> OFFERED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /licensing/license-agreements/{id}/terminate, or rights-lapse cascade"
        actor: RightsManager
        preconditions: ["license_status IN {EXECUTED, ACTIVE} for the endpoint"]
        side_effects: ["same as EXECUTED -> TERMINATED"]
      - from: EXECUTED
        to: EXPIRED
        trigger: "expiration sweep when logical clock >= license_end"
        actor: system
        preconditions: ["logical clock >= license_end"]
        side_effects:
          - "this license's SCHEDULED TakedownNotice -> EXECUTED with executed_at = logical clock"
          - "if exclusive: slot encumbrance re-evaluation (RightsSlot ENCUMBERED -> AVAILABLE when no other EXECUTED/ACTIVE exclusive license), then line-unblock cascade"
      - from: ACTIVE
        to: EXPIRED
        trigger: "expiration sweep when logical clock >= license_end"
        actor: system
        preconditions: ["logical clock >= license_end"]
        side_effects: ["same as EXECUTED -> EXPIRED"]

  - entity: DeliveryBatch
    initial_state: QUEUED
    terminal_states: [DELIVERED]
    transitions:
      - from: QUEUED
        to: DELIVERED
        trigger: "POST /licensing/delivery-batches/{id}/submit with a spec-complete manifest"
        actor: RightsManager
        preconditions: ["delivery_status == QUEUED", "set(asset_manifest) ⊇ set(platform.required_asset_profiles of the license's platform)", "metadata_spec_version == platform.metadata_spec_version"]
        side_effects: ["missing_profiles = []", "attempt_count += 1", "submitted_at = logical clock", "delivered_at = logical clock"]
      - from: QUEUED
        to: REJECTED
        trigger: "POST /licensing/delivery-batches/{id}/submit with a spec-incomplete manifest"
        actor: RightsManager
        preconditions: ["delivery_status == QUEUED", "manifest missing >= 1 required profile OR metadata_spec_version mismatch"]
        side_effects: ["missing_profiles = required profiles absent from manifest", "attempt_count += 1", "submitted_at = logical clock"]
      - from: REJECTED
        to: QUEUED
        trigger: "POST /licensing/delivery-batches/{id}/resubmit with a corrected asset_manifest"
        actor: RightsManager
        preconditions: ["delivery_status == REJECTED (DELIVERED is terminal: ERR_BATCH_INVALID_STATE)"]
        side_effects: ["asset_manifest and metadata_spec_version replaced by the request values", "missing_profiles = []"]
        note: "The cycle is QUEUED -> REJECTED -> QUEUED -> (submit) -> DELIVERED; there is deliberately no REJECTED -> DELIVERED shortcut."

  - entity: TakedownNotice
    initial_state: SCHEDULED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EXECUTED
        trigger: "expiration sweep when the license reaches EXPIRED, or immediately when the license is TERMINATED"
        actor: system
        preconditions: ["license became EXPIRED or TERMINATED"]
        side_effects: ["executed_at = logical clock"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "side effect of POST /licensing/license-agreements/{id}/extend"
        actor: system
        preconditions: ["license extended to a new license_end"]
        side_effects: ["a replacement TakedownNotice is created SCHEDULED at the new license_end"]

  - entity: RevenueReport
    initial_state: SUBMITTED
    terminal_states: [REVERSED]
    transitions:
      - from: SUBMITTED
        to: REVERSED
        trigger: "POST /licensing/revenue-reports/{id}/reverse"
        actor: FinanceAnalyst
        preconditions: ["report_status == SUBMITTED (a REVERSED report cannot be reversed again — terminal)"]
        side_effects:
          - "recompute license.recouped_cents / royalty_payable_cents / outstanding_recoupment_cents by replaying calculations.recoupment_split over the license's remaining SUBMITTED reports in chronological order (submitted_at ASC, tie-break created_at ASC)"
          - "license.version += 1 and license.updated_at refreshed"

  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /licensing/royalty-statements/{id}/finalize"
        actor: FinanceAnalyst
        preconditions: ["statement_status == DRAFT (else ERR_STATEMENT_NOT_DRAFT)"]
        side_effects:
          - "totals recomputed at finalize time (fresh snapshot); statement becomes immutable — later reports do not change a FINALIZED/PAID statement"
          - "finalized_by_user_id = X-User-ID of the caller"
      - from: FINALIZED
        to: PAID
        trigger: "POST /licensing/royalty-statements/{id}/mark-paid"
        actor: FinanceController
        preconditions:
          - "statement_status == FINALIZED (else ERR_STATEMENT_NOT_FINALIZED)"
          - "X-User-ID != finalized_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["paid_by_user_id = X-User-ID of the caller"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: revenue-report-stale-license-version
    parent_entity: LicenseAgreement
    write_endpoint: "POST /licensing/license-agreements/{id}/revenue-reports"
    occ_field: expected_license_version
    description: |
      Submitting a revenue report carrying an expected_license_version that no
      longer equals the license's current version is rejected. Booking a report
      legitimately succeeds any number of times for a reportable license, but
      each booking mutates recouped_cents / outstanding_recoupment_cents and
      advances license.version; a client whose view of the license predates
      the last booked report would compute recoupment from stale state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: license-extend-stale-version
    parent_entity: LicenseAgreement
    write_endpoint: "POST /licensing/license-agreements/{id}/extend"
    occ_field: expected_license_version
    description: |
      Extending a license carrying an expected_license_version that no longer
      equals the license's current version is rejected. Repeated extensions of
      a non-terminal license are each legitimate, but each extension moves
      license_end (and re-schedules the takedown notice); a client extending
      from a stale read would silently build on a superseded window.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: recoupment_split
    trigger: "RevenueReport creation on a license with fee_model IN {REVENUE_SHARE, MINIMUM_GUARANTEE}; also replayed wholesale on report reversal"
    algorithm: waterfall_allocation
    formula: |
      accrued = round_half_up(gross_revenue_cents * revenue_share_pct / 100)   # integer cents
      if fee_model == MINIMUM_GUARANTEE:
          applied = min(accrued, outstanding_recoupment_cents_before)
      else:
          applied = 0
      payable = accrued - applied
      # ledger update (same request):
      recouped_cents         += applied
      royalty_payable_cents  += payable
      outstanding_recoupment_cents = max(0, minimum_guarantee_cents - recouped_cents)
      # reversal: reset recouped/payable to 0, replay all remaining SUBMITTED
      # reports in order (submitted_at ASC, tie-break created_at ASC).
    input_set: "The single incoming report, plus the license's current recouped_cents. On reversal: all reports of the license with report_status == SUBMITTED (REVERSED excluded), replayed chronologically."
    constants:
      ROUNDING: round_half_up to integer cents
    precision: "integer cents, round_half_up"
    variants: []   # single algorithm; dual-variant coverage lives in termination_credit and statement_attribution

  - name: package_volume_discount
    trigger: "POST /licensing/avail-packages/{id}/accept"
    algorithm: tiered_pricing
    formula: |
      # Pinned evaluation order (breaks the circular-looking dependency between
      # the tier and the net total; the tier is keyed on the GROSS guaranteed
      # total of accepted lines, never on the net):
      # (1) gross = Σ guaranteed_value(line) over ACCEPTED lines
      #     (FLAT_FEE -> flat_fee_cents, MINIMUM_GUARANTEE -> minimum_guarantee_cents,
      #      REVENUE_SHARE -> 0)
      # (2) discount_pct = tier(gross): gross >= 5_000_000 -> 15
      #                                 gross >= 2_000_000 -> 10
      #                                 gross >=   500_000 ->  5
      #                                 else                ->  0   (>= boundary inclusive)
      # (3) discount_cents = round_half_up(gross * discount_pct / 100)
      # (4) per accepted line i: line_discount_i = round_half_up(discount_cents * guaranteed_value_i / gross)
      #     (lines with guaranteed_value 0 receive discount 0)
      # (5) remainder = discount_cents - Σ line_discount_i is added to the
      #     accepted line with the lowest array index among lines with
      #     guaranteed_value > 0 (deterministic; never random)
      # (6) line allocated_fee_cents = guaranteed_value_i - line_discount_i (- remainder for the chosen line)
      # (7) net_total_cents = gross - discount_cents
    input_set: "The accepted lines of the package (line_status transitions to LICENSED). Non-accepted lines contribute nothing."
    constants:
      TIER_1_THRESHOLD_CENTS: 5000000
      TIER_1_PCT: 15
      TIER_2_THRESHOLD_CENTS: 2000000
      TIER_2_PCT: 10
      TIER_3_THRESHOLD_CENTS: 500000
      TIER_3_PCT: 5
    precision: "integer cents, round_half_up; allocation rounded per line then remainder to lowest-index accepted line with guaranteed_value > 0"
    variants: []

  - name: statement_attribution
    trigger: "POST /licensing/royalty-statements (create, DRAFT snapshot) and POST /licensing/royalty-statements/{id}/finalize (fresh recompute)"
    algorithm: aggregation
    formula: |
      candidate_reports = RevenueReport r where r.report_status == SUBMITTED
        and license(r.license_id).slot's rights_holder_id == statement.rights_holder_id
        # FK path: RevenueReport.license_id -> LicenseAgreement.slot_id -> RightsSlot.rights_holder_id
      included = candidate_reports matching attribution_mode (see variants)
      gross_revenue_cents       = Σ r.gross_revenue_cents over included
      studio_net_royalty_cents  = Σ r.payable_cents over included
        # per-report values were already rounded to integer cents at submission;
        # the statement sums those integers and NEVER recomputes from Σ gross.
      holder_royalty_due_cents  = round_half_up(studio_net_royalty_cents * rights_holder.royalty_share_pct / 100)
        # holder-level rounding applied exactly once, at the end.
    input_set: "SUBMITTED RevenueReports whose license's slot belongs to the statement's rights holder; period membership per attribution_mode."
    constants:
      ROUNDING: round_half_up to integer cents
    precision: "integer cents; per-report rounding at submission, sum integers, round holder due once"
    variants:
      - name: BY_REPORT_DATE
        when: "statement.attribution_mode == BY_REPORT_DATE"
        difference: "include reports whose submitted_at falls inside the CLOSED interval [period_start, period_end] (both ends inclusive)"
      - name: BY_USAGE_PERIOD
        when: "statement.attribution_mode == BY_USAGE_PERIOD"
        difference: "include reports whose usage period INTERSECTS the statement period: r.period_start <= period_end AND r.period_end >= period_start"

  - name: termination_credit
    trigger: "LicenseAgreement transition EXECUTED|ACTIVE -> TERMINATED (endpoint terminate or rights-lapse cascade)"
    algorithm: proration
    formula: |
      terminated_at = logical clock at termination
      remaining_seconds = max(0, license_end - terminated_at)
      total_seconds     = max(1, license_end - license_start)
      credit_basis = allocated_fee_cents   # post-discount fee; 0 for REVENUE_SHARE
    input_set: "The single terminating license."
    constants:
      DAYS_PER_MONTH_BLOCK: 30
    precision: "integer cents, round_half_up; day counts use whole days (floor(seconds/86400))"
    variants:
      - name: DAILY_PRORATION
        when: "license.proration_mode == DAILY_PRORATION"
        difference: "termination_credit_cents = round_half_up(credit_basis * remaining_seconds / total_seconds)"
      - name: MONTHLY_PRORATION
        when: "license.proration_mode == MONTHLY_PRORATION"
        difference: "termination_credit_cents = round_half_up(credit_basis * floor(remaining_days/30) / ceil(total_days/30)); 0 when floor(remaining_days/30) == 0"

  - name: holdback_derivation
    trigger: "LicenseAgreement creation with exclusive == true"
    algorithm: threshold
    formula: |
      row = HOLDBACK_MATRIX[license.window_type]
      if row is empty: holdback_until = null (license blocks nothing cross-window)
      else: holdback_until = license_end + row.buffer_days
      Cross-window block rule (CLOSED interval at both ends — differs from the
      half-open same-window overlap rule): a candidate license on the same
      (title, territory, language) with window_type W_c is rejected with
      ERR_HOLDBACK_CONFLICT iff W_c ∈ row.blocked_windows and
      candidate.license_start <= holdback_until AND candidate.license_end >= license.license_start.
      Applies regardless of the candidate's own exclusivity.
    input_set: "The new exclusive license; all other EXECUTED/ACTIVE exclusive licenses on the same title+territory+language for the conflict check."
    constants:
      HOLDBACK_MATRIX: "THEATRICAL -> {EST:90, TVOD:90, SVOD:90, AVOD:90, FREE_TV:90}; EST -> {SVOD:60, AVOD:60, FREE_TV:60}; TVOD -> {SVOD:30, AVOD:30, FREE_TV:30}; SVOD -> {AVOD:30, FREE_TV:30}; AVOD -> {}; FREE_TV -> {}"
    precision: "day-granularity buffer added to license_end (datetime arithmetic)"
    variants: []

  - name: slot_conflict_check
    trigger: "LicenseAgreement creation (direct or via package offer/accept re-validation)"
    algorithm: interval_merge
    formula: |
      # Same-cell exclusivity overlap — HALF-OPEN interval semantics [start, end):
      # conflict iff existing.license_start < candidate.license_end
      #              AND candidate.license_start < existing.license_end
      #              AND (existing.exclusive OR candidate.exclusive)
      # Adjacent windows (candidate.start == existing.end) do NOT conflict.
      # Applies to licenses sharing (title via slot, territory_code, language_code, window_type).
      # Cross-window holdback uses calculations.holdback_derivation (closed, buffered).
    input_set: "All LicenseAgreements in EXECUTED or ACTIVE whose slot shares title_id, territory_code, language_code, window_type with the candidate's slot (EXPIRED/TERMINATED licenses ignored)."
    constants: {}
    precision: "datetime comparison, half-open"
    variants: []

  - name: expiration_sweep
    trigger: "POST /licensing/_clock/set_current_utc (runs synchronously after the clock advances)"
    algorithm: chronological
    formula: |
      Process in this pinned order; within each step, entities in created_at ASC
      (never id). Expiry rule: a resource expires when logical clock >= its end
      instant (half-open intervals [start, end); at exactly end it is expired).
      (1) RightsSlots AVAILABLE|ENCUMBERED with sellable_to <= now -> EXPIRED.
          ENCUMBERED slots cascade: their EXECUTED|ACTIVE licenses -> TERMINATED
          (rights lapse; termination_credit computed), and each terminated
          license's SCHEDULED notice -> EXECUTED (executed_at = now).
          Blocked-line propagation + all-blocked package expiry then run.
      (2) Licenses EXECUTED|ACTIVE with license_end <= now -> EXPIRED; their
          SCHEDULED notices -> EXECUTED; exclusive licenses trigger slot
          encumbrance re-evaluation (ENCUMBERED -> AVAILABLE when no other
          EXECUTED|ACTIVE exclusive license remains and slot not EXPIRED/
          WITHDRAWN), then BLOCKED -> OFFERED line restoration on OFFERED packages.
      (3) AvailPackages OFFERED with offer_expires_at <= now -> EXPIRED;
          their non-LICENSED lines -> NOT_SELECTED.
    input_set: "All non-terminal RightsSlots, LicenseAgreements, AvailPackages, and SCHEDULED TakedownNotices."
    constants: {}
    precision: "datetime comparison against the logical clock; deterministic order created_at ASC"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 2, category: auth, check: "PlatformBuyer ownership: X-User-ID equals the platform_id of the addressed package / license (and of any platform_id filter supplied on list endpoints)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "POST /licensing/avail-packages/{id}/accept, POST /licensing/avail-packages/{id}/decline, POST /licensing/license-agreements/{id}/revenue-reports, buyer-visible GET endpoints" }
  - { priority: 3, category: existence, check: "Request body schema: required fields present, types correct, enum values known (including window end strictly after start and statement/report period_end > period_start)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 3, category: existence, check: "Referenced resources exist, validated left-to-right (path ids first, then body ids in declaration order)", error_id: ERR_TITLE_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a Title" }
  - { priority: 3, category: existence, check: "RightsHolder exists", error_id: ERR_HOLDER_NOT_FOUND, http_status: 404, applies_to: "POST /licensing/rights-slots, POST /licensing/royalty-statements, GET /licensing/rights-holders/{id}" }
  - { priority: 3, category: existence, check: "Platform exists", error_id: ERR_PLATFORM_NOT_FOUND, http_status: 404, applies_to: "POST /licensing/avail-packages, POST /licensing/license-agreements, GET /licensing/platforms/{id}" }
  - { priority: 3, category: existence, check: "RightsSlot exists (including every line's slot_id at package creation)", error_id: ERR_SLOT_NOT_FOUND, http_status: 404, applies_to: "POST /licensing/license-agreements, POST /licensing/avail-packages, GET /licensing/rights-slots/{id}" }
  - { priority: 3, category: existence, check: "AvailPackage exists", error_id: ERR_PACKAGE_NOT_FOUND, http_status: 404, applies_to: "all /licensing/avail-packages/{id}/* endpoints" }
  - { priority: 3, category: existence, check: "LicenseAgreement exists", error_id: ERR_LICENSE_NOT_FOUND, http_status: 404, applies_to: "all /licensing/license-agreements/{id}/* endpoints" }
  - { priority: 3, category: existence, check: "DeliveryBatch exists", error_id: ERR_BATCH_NOT_FOUND, http_status: 404, applies_to: "all /licensing/delivery-batches/{id}/* endpoints" }
  - { priority: 3, category: existence, check: "TakedownNotice exists", error_id: ERR_NOTICE_NOT_FOUND, http_status: 404, applies_to: "GET /licensing/takedown-notices/{id}" }
  - { priority: 3, category: existence, check: "RevenueReport exists", error_id: ERR_REPORT_NOT_FOUND, http_status: 404, applies_to: "GET /licensing/revenue-reports/{id}, POST /licensing/revenue-reports/{id}/reverse" }
  - { priority: 3, category: existence, check: "RoyaltyStatement exists", error_id: ERR_STATEMENT_NOT_FOUND, http_status: 404, applies_to: "all /licensing/royalty-statements/{id}/* endpoints" }
  - { priority: 4, category: state, check: "Slot must be AVAILABLE to withdraw", error_id: ERR_SLOT_NOT_WITHDRAWABLE, http_status: 409, applies_to: "POST /licensing/rights-slots/{id}/withdraw" }
  - { priority: 4, category: state, check: "Slot must be AVAILABLE at package offer time (per line); slot must not be WITHDRAWN or EXPIRED for direct license creation (ENCUMBERED allowed — conflict rules decide)", error_id: ERR_SLOT_NOT_AVAILABLE, http_status: 409, applies_to: "POST /licensing/avail-packages/{id}/offer, POST /licensing/license-agreements" }
  - { priority: 4, category: state, check: "Package must be DRAFT to offer", error_id: ERR_PACKAGE_NOT_DRAFT, http_status: 409, applies_to: "POST /licensing/avail-packages/{id}/offer" }
  - { priority: 4, category: state, check: "Package must be OFFERED to accept or decline (EXPIRED/WITHDRAWN/terminal packages rejected here)", error_id: ERR_PACKAGE_NOT_OFFERED, http_status: 409, applies_to: "POST /licensing/avail-packages/{id}/accept, POST /licensing/avail-packages/{id}/decline" }
  - { priority: 4, category: state, check: "Package must be DRAFT or OFFERED to withdraw", error_id: ERR_PACKAGE_NOT_WITHDRAWABLE, http_status: 409, applies_to: "POST /licensing/avail-packages/{id}/withdraw" }
  - { priority: 4, category: state, check: "License must be EXECUTED to activate", error_id: ERR_LICENSE_NOT_EXECUTABLE, http_status: 409, applies_to: "POST /licensing/license-agreements/{id}/activate" }
  - { priority: 4, category: state, check: "License must be EXECUTED or ACTIVE to extend", error_id: ERR_LICENSE_NOT_EXTENDABLE, http_status: 409, applies_to: "POST /licensing/license-agreements/{id}/extend" }
  - { priority: 4, category: state, check: "License must be EXECUTED or ACTIVE to terminate", error_id: ERR_LICENSE_ALREADY_TERMINAL, http_status: 409, applies_to: "POST /licensing/license-agreements/{id}/terminate" }
  - { priority: 4, category: state, check: "License must be EXECUTED or ACTIVE and fee_model != FLAT_FEE to receive a revenue report", error_id: ERR_LICENSE_NOT_REPORTABLE, http_status: 409, applies_to: "POST /licensing/license-agreements/{id}/revenue-reports" }
  - { priority: 4, category: state, check: "OCC: expected_license_version must equal the license's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /licensing/license-agreements/{id}/revenue-reports, POST /licensing/license-agreements/{id}/extend" }
  - { priority: 4, category: state, check: "Batch must be QUEUED to submit, REJECTED to resubmit (DELIVERED is terminal)", error_id: ERR_BATCH_INVALID_STATE, http_status: 409, applies_to: "POST /licensing/delivery-batches/{id}/submit, POST /licensing/delivery-batches/{id}/resubmit" }
  - { priority: 4, category: state, check: "Statement must be DRAFT to finalize", error_id: ERR_STATEMENT_NOT_DRAFT, http_status: 409, applies_to: "POST /licensing/royalty-statements/{id}/finalize" }
  - { priority: 4, category: state, check: "Statement must be FINALIZED to mark paid", error_id: ERR_STATEMENT_NOT_FINALIZED, http_status: 409, applies_to: "POST /licensing/royalty-statements/{id}/mark-paid" }
  - { priority: 5, category: business_safety, check: "Slot territory must not be in its title's embargoed_territories (compliance embargo)", error_id: ERR_TERRITORY_EMBARGOED, http_status: 422, applies_to: "POST /licensing/rights-slots" }
  - { priority: 5, category: business_safety, check: "Segregation of duties: X-User-ID marking a statement PAID must differ from finalized_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /licensing/royalty-statements/{id}/mark-paid" }
  - { priority: 6, category: business_referential, check: "Every element of accepted_slot_ids must be the slot_id of some line of the addressed package", error_id: ERR_LINE_NOT_IN_PACKAGE, http_status: 422, applies_to: "POST /licensing/avail-packages/{id}/accept" }
  - { priority: 6, category: business_referential, check: "Package lines must reference distinct slots (no slot_id twice in one package)", error_id: ERR_DUPLICATE_LINE_SLOT, http_status: 422, applies_to: "POST /licensing/avail-packages" }
  - { priority: 7, category: business_temporal, check: "offer_expires_at must be strictly after the logical clock at offer time", error_id: ERR_OFFER_WINDOW_PAST, http_status: 422, applies_to: "POST /licensing/avail-packages/{id}/offer" }
  - { priority: 7, category: business_temporal, check: "License window must satisfy slot.sellable_from <= license_start AND license_end <= slot.sellable_to (checked at direct create, package offer, package accept, and extend)", error_id: ERR_WINDOW_OUTSIDE_RIGHTS, http_status: 422, applies_to: "POST /licensing/license-agreements, POST /licensing/avail-packages/{id}/offer, POST /licensing/avail-packages/{id}/accept, POST /licensing/license-agreements/{id}/extend" }
  - { priority: 7, category: business_temporal, check: "Activation requires logical clock >= license_start", error_id: ERR_LICENSE_NOT_STARTED, http_status: 422, applies_to: "POST /licensing/license-agreements/{id}/activate" }
  - { priority: 7, category: business_temporal, check: "Revenue report period_end must be <= logical clock (no future-dated revenue)", error_id: ERR_REPORT_PERIOD_FUTURE, http_status: 422, applies_to: "POST /licensing/license-agreements/{id}/revenue-reports" }
  - { priority: 7, category: business_temporal, check: "Logical clock is monotonic: to_iso8601 must be >= current logical clock", error_id: ERR_CLOCK_REGRESSION, http_status: 422, applies_to: "POST /licensing/_clock/set_current_utc" }
  - { priority: 8, category: business_constraint, check: "Slot tuple (title_id, territory_code, language_code, window_type) unique among slots with slot_status IN {AVAILABLE, ENCUMBERED}", error_id: ERR_DUPLICATE_SLOT, http_status: 409, applies_to: "POST /licensing/rights-slots" }
  - { priority: 8, category: business_constraint, check: "Same-cell half-open overlap with exclusivity on either side (calculations.slot_conflict_check)", error_id: ERR_EXCLUSIVITY_CONFLICT, http_status: 409, applies_to: "POST /licensing/license-agreements, POST /licensing/avail-packages/{id}/offer, POST /licensing/avail-packages/{id}/accept, POST /licensing/license-agreements/{id}/extend" }
  - { priority: 8, category: business_constraint, check: "Cross-window holdback block, closed buffered interval (calculations.holdback_derivation)", error_id: ERR_HOLDBACK_CONFLICT, http_status: 409, applies_to: "POST /licensing/license-agreements, POST /licensing/avail-packages/{id}/offer, POST /licensing/avail-packages/{id}/accept, POST /licensing/license-agreements/{id}/extend" }
  - { priority: 8, category: business_constraint, check: "Accepted lines must all have line_status == OFFERED (BLOCKED lines cannot be accepted)", error_id: ERR_LINE_BLOCKED, http_status: 409, applies_to: "POST /licensing/avail-packages/{id}/accept" }
  - { priority: 8, category: business_constraint, check: "accepted_slot_ids must be non-empty", error_id: ERR_EMPTY_ACCEPTANCE, http_status: 422, applies_to: "POST /licensing/avail-packages/{id}/accept" }
  - { priority: 8, category: business_constraint, check: "Statement period (closed interval) must not overlap another DRAFT or FINALIZED statement of the same holder (PAID statements do not block)", error_id: ERR_STATEMENT_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /licensing/royalty-statements" }
  - { priority: 8, category: business_constraint, check: "Activation requires an existing DELIVERED DeliveryBatch for the license", error_id: ERR_DELIVERY_INCOMPLETE, http_status: 422, applies_to: "POST /licensing/license-agreements/{id}/activate" }
  - { priority: 9, category: business_fiscal, check: "gross_revenue_cents must be > 0", error_id: ERR_NONPOSITIVE_REVENUE, http_status: 422, applies_to: "POST /licensing/license-agreements/{id}/revenue-reports" }
  - { priority: 9, category: business_fiscal, check: "Fee structure must match fee_model: FLAT_FEE requires flat_fee_cents > 0 and forbids revenue_share_pct / minimum_guarantee_cents > 0; REVENUE_SHARE requires revenue_share_pct in (0,100]; MINIMUM_GUARANTEE requires minimum_guarantee_cents > 0 and revenue_share_pct in (0,100]; royalty_share_pct of a holder must be in (0,100]", error_id: ERR_FEE_STRUCTURE_INVALID, http_status: 422, applies_to: "POST /licensing/license-agreements, POST /licensing/avail-packages, POST /licensing/rights-holders" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/licensing/_clock/set_current_utc"
    description: "Advance the logical clock and run calculations.expiration_sweep synchronously. Server startup default (before any set): exactly 2026-08-01T00:00:00Z — the logical clock NEVER falls back to wall-clock time. Monotonic: to_iso8601 must be >= current value."
    roles: [RightsManager, FinanceAnalyst, FinanceController]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, slots_expired: integer, licenses_expired: integer, licenses_terminated: integer, packages_expired: integer, notices_executed: integer }
    side_effects: ["runs expiration_sweep (slots -> EXPIRED with rights-lapse license termination + notice execution; licenses -> EXPIRED with notice execution + slot re-evaluation; packages -> EXPIRED with line NOT_SELECTED)"]

  # --- catalog: titles / holders / platforms ---
  - { method: POST, path: "/licensing/titles", description: "Register a title", roles: [RightsManager], code: 201, input: [title_code, name, content_type, original_language, production_year, "embargoed_territories?"], output: Title, side_effects: [] }
  - { method: GET, path: "/licensing/titles", description: "List titles", roles: [RightsManager, FinanceAnalyst, FinanceController], code: 200, input: ["content_type?", "limit?", "offset?"], output: "Title[]", side_effects: [] }
  - { method: GET, path: "/licensing/titles/{id}", description: "Get one title", roles: [RightsManager, FinanceAnalyst, FinanceController], code: 200, input: [], output: Title, side_effects: [] }
  - { method: POST, path: "/licensing/rights-holders", description: "Register a rights holder", roles: [RightsManager], code: 201, input: [name, payee_reference, royalty_share_pct], output: RightsHolder, side_effects: [] }
  - { method: GET, path: "/licensing/rights-holders", description: "List rights holders", roles: [RightsManager, FinanceAnalyst, FinanceController], code: 200, input: ["limit?", "offset?"], output: "RightsHolder[]", side_effects: [] }
  - { method: GET, path: "/licensing/rights-holders/{id}", description: "Get one rights holder", roles: [RightsManager, FinanceAnalyst, FinanceController], code: 200, input: [], output: RightsHolder, side_effects: [] }
  - { method: POST, path: "/licensing/platforms", description: "Register a buyer platform with its delivery spec", roles: [RightsManager], code: 201, input: [name, platform_type, metadata_spec_version, required_asset_profiles], output: Platform, side_effects: [] }
  - { method: GET, path: "/licensing/platforms", description: "List platforms", roles: [RightsManager, FinanceAnalyst, FinanceController, PlatformBuyer], code: 200, input: ["platform_type?", "limit?", "offset?"], output: "Platform[]", side_effects: [] }
  - { method: GET, path: "/licensing/platforms/{id}", description: "Get one platform", roles: [RightsManager, FinanceAnalyst, FinanceController, PlatformBuyer], code: 200, input: [], output: Platform, side_effects: [] }

  # --- rights inventory ---
  - { method: POST, path: "/licensing/rights-slots", description: "Create a rights inventory slot (title x territory x language x window)", roles: [RightsManager], code: 201, input: [title_id, rights_holder_id, territory_code, language_code, window_type, sellable_from, sellable_to], output: RightsSlot, side_effects: ["embargo + duplicate-tuple + window-order validation"] }
  - { method: GET, path: "/licensing/rights-slots", description: "List rights slots (avail search)", roles: [RightsManager, FinanceAnalyst, FinanceController], code: 200, input: ["title_id?", "rights_holder_id?", "slot_status?", "territory_code?", "window_type?", "limit?", "offset?"], output: "RightsSlot[]", side_effects: [] }
  - { method: GET, path: "/licensing/rights-slots/{id}", description: "Get one rights slot", roles: [RightsManager, FinanceAnalyst, FinanceController], code: 200, input: [], output: RightsSlot, side_effects: [] }
  - { method: POST, path: "/licensing/rights-slots/{id}/withdraw", description: "Withdraw an AVAILABLE slot (rights pull); blocks offered lines and can auto-expire all-blocked packages", roles: [RightsManager], code: 200, input: [], output: RightsSlot, side_effects: ["OFFERED-package lines on this slot -> BLOCKED; all-blocked OFFERED packages -> EXPIRED; their non-LICENSED lines -> NOT_SELECTED; increments version"] }

  # --- avail packages / offers ---
  - { method: POST, path: "/licensing/avail-packages", description: "Assemble an avail package (offer) addressed to a platform; lines carry full proposed license terms", roles: [RightsManager], code: 201, input: [platform_id, name, offer_expires_at, lines], output: AvailPackage, side_effects: ["guaranteed_total_cents computed; lines initialized PENDING"] }
  - { method: GET, path: "/licensing/avail-packages", description: "List avail packages (PlatformBuyer sees only own: platform_id filter must equal own id or be omitted, which defaults to own)", roles: [RightsManager, PlatformBuyer], code: 200, input: ["platform_id?", "package_status?", "limit?", "offset?"], output: "AvailPackage[]", side_effects: [] }
  - { method: GET, path: "/licensing/avail-packages/{id}", description: "Get one avail package", roles: [RightsManager, PlatformBuyer], code: 200, input: [], output: AvailPackage, side_effects: [] }
  - { method: POST, path: "/licensing/avail-packages/{id}/offer", description: "Send a DRAFT package to the platform (validates slots, windows, conflicts, expiry)", roles: [RightsManager], code: 200, input: [], output: AvailPackage, side_effects: ["lines PENDING -> OFFERED; offered_at set; increments version"] }
  - { method: POST, path: "/licensing/avail-packages/{id}/accept", description: "Platform accepts all or a subset of offered slots; creates one license per accepted line with volume-discount allocation", roles: [PlatformBuyer], code: 200, input: [accepted_slot_ids], output: AvailPackage, side_effects: ["package_volume_discount over accepted lines; LicenseAgreement created per accepted line (EXECUTED); TakedownNotice created per license (SCHEDULED at license_end); accepted lines -> LICENSED, others -> NOT_SELECTED; exclusive accepted lines encumber their slots (cross-package BLOCKED cascade); increments version"] }
  - { method: POST, path: "/licensing/avail-packages/{id}/decline", description: "Platform declines the offer", roles: [PlatformBuyer], code: 200, input: [], output: AvailPackage, side_effects: ["lines -> NOT_SELECTED; increments version"] }
  - { method: POST, path: "/licensing/avail-packages/{id}/withdraw", description: "Studio pulls a DRAFT/OFFERED package", roles: [RightsManager], code: 200, input: [], output: AvailPackage, side_effects: ["non-LICENSED lines -> NOT_SELECTED; increments version"] }

  # --- licenses ---
  - { method: POST, path: "/licensing/license-agreements", description: "Direct deal: create a license against a slot without a package (package_id null; allocated_fee_cents equals the input guaranteed fee)", roles: [RightsManager], code: 201, input: [slot_id, platform_id, license_start, license_end, exclusive, fee_model, "flat_fee_cents?", "revenue_share_pct?", "minimum_guarantee_cents?", "proration_mode?"], output: LicenseAgreement, side_effects: ["conflict + window validation; exclusive -> slot ENCUMBERED with cross-package BLOCKED cascade; holdback_until derived; TakedownNotice created SCHEDULED at license_end"] }
  - { method: GET, path: "/licensing/license-agreements", description: "List licenses (PlatformBuyer restricted to own platform_id)", roles: [RightsManager, PlatformBuyer, FinanceAnalyst, FinanceController], code: 200, input: ["platform_id?", "slot_id?", "package_id?", "license_status?", "limit?", "offset?"], output: "LicenseAgreement[]", side_effects: [] }
  - { method: GET, path: "/licensing/license-agreements/{id}", description: "Get one license", roles: [RightsManager, PlatformBuyer, FinanceAnalyst, FinanceController], code: 200, input: [], output: LicenseAgreement, side_effects: [] }
  - { method: POST, path: "/licensing/license-agreements/{id}/activate", description: "Activate an EXECUTED license once its window has started and a spec-complete delivery exists", roles: [RightsManager], code: 200, input: [], output: LicenseAgreement, side_effects: ["activated_at set; increments version"] }
  - { method: POST, path: "/licensing/license-agreements/{id}/extend", description: "Extend license_end (OCC-guarded); revalidates window/containment/conflicts", roles: [RightsManager], code: 200, input: [new_license_end, expected_license_version], output: LicenseAgreement, side_effects: ["license_end replaced (must be > current license_end and <= slot.sellable_to); holdback_until recomputed; SCHEDULED notice -> CANCELLED and a replacement notice created SCHEDULED at the new end; increments LicenseAgreement.version by 1"] }
  - { method: POST, path: "/licensing/license-agreements/{id}/terminate", description: "Early termination (breach); computes prorated credit and fires takedown immediately", roles: [RightsManager], code: 200, input: [], output: LicenseAgreement, side_effects: ["termination_credit_cents per proration_mode; SCHEDULED notice -> EXECUTED now; exclusive -> slot re-evaluation then line-unblock cascade; increments version"] }
  - { method: POST, path: "/licensing/license-agreements/{id}/revenue-reports", description: "Platform submits usage revenue for a period (OCC-guarded); runs recoupment_split", roles: [PlatformBuyer], code: 201, input: [period_start, period_end, gross_revenue_cents, expected_license_version], output: RevenueReport, side_effects: ["recoupment_split; license.recouped_cents / royalty_payable_cents / outstanding_recoupment_cents updated; increments LicenseAgreement.version by 1"] }

  # --- revenue reports ---
  - { method: GET, path: "/licensing/revenue-reports", description: "List revenue reports", roles: [RightsManager, PlatformBuyer, FinanceAnalyst, FinanceController], code: 200, input: ["license_id?", "report_status?", "limit?", "offset?"], output: "RevenueReport[]", side_effects: [] }
  - { method: GET, path: "/licensing/revenue-reports/{id}", description: "Get one revenue report", roles: [RightsManager, PlatformBuyer, FinanceAnalyst, FinanceController], code: 200, input: [], output: RevenueReport, side_effects: [] }
  - { method: POST, path: "/licensing/revenue-reports/{id}/reverse", description: "Reverse a submitted report; license recoupment fields recomputed by chronological replay of remaining SUBMITTED reports", roles: [FinanceAnalyst], code: 200, input: [], output: RevenueReport, side_effects: ["recoupment replay; increments LicenseAgreement.version by 1"] }

  # --- deliveries ---
  - { method: POST, path: "/licensing/delivery-batches", description: "Queue an asset+metadata delivery batch for a license", roles: [RightsManager], code: 201, input: [license_id, asset_manifest, metadata_spec_version], output: DeliveryBatch, side_effects: [] }
  - { method: GET, path: "/licensing/delivery-batches", description: "List delivery batches", roles: [RightsManager, PlatformBuyer], code: 200, input: ["license_id?", "delivery_status?", "limit?", "offset?"], output: "DeliveryBatch[]", side_effects: [] }
  - { method: GET, path: "/licensing/delivery-batches/{id}", description: "Get one delivery batch", roles: [RightsManager, PlatformBuyer], code: 200, input: [], output: DeliveryBatch, side_effects: [] }
  - { method: POST, path: "/licensing/delivery-batches/{id}/submit", description: "Run the platform spec check synchronously: pass -> DELIVERED, fail -> REJECTED with missing_profiles", roles: [RightsManager], code: 200, input: [], output: DeliveryBatch, side_effects: ["spec check vs platform.required_asset_profiles + metadata_spec_version; attempt_count += 1; increments version"] }
  - { method: POST, path: "/licensing/delivery-batches/{id}/resubmit", description: "Replace the manifest of a REJECTED batch and return it to QUEUED", roles: [RightsManager], code: 200, input: [asset_manifest, metadata_spec_version], output: DeliveryBatch, side_effects: ["manifest replaced; missing_profiles reset; increments version"] }

  # --- takedown notices (read-only surface; created/executed/cancelled by system) ---
  - { method: GET, path: "/licensing/takedown-notices", description: "List takedown notices", roles: [RightsManager, PlatformBuyer], code: 200, input: ["license_id?", "notice_status?", "limit?", "offset?"], output: "TakedownNotice[]", side_effects: [] }
  - { method: GET, path: "/licensing/takedown-notices/{id}", description: "Get one takedown notice", roles: [RightsManager, PlatformBuyer], code: 200, input: [], output: TakedownNotice, side_effects: [] }

  # --- royalty statements ---
  - { method: POST, path: "/licensing/royalty-statements", description: "Create a DRAFT royalty statement for a holder and period; totals computed immediately per attribution_mode", roles: [FinanceAnalyst], code: 201, input: [rights_holder_id, period_start, period_end, attribution_mode], output: RoyaltyStatement, side_effects: ["statement_attribution computed"] }
  - { method: GET, path: "/licensing/royalty-statements", description: "List royalty statements", roles: [FinanceAnalyst, FinanceController], code: 200, input: ["rights_holder_id?", "statement_status?", "limit?", "offset?"], output: "RoyaltyStatement[]", side_effects: [] }
  - { method: GET, path: "/licensing/royalty-statements/{id}", description: "Get one royalty statement", roles: [FinanceAnalyst, FinanceController], code: 200, input: [], output: RoyaltyStatement, side_effects: [] }
  - { method: POST, path: "/licensing/royalty-statements/{id}/finalize", description: "Finalize a DRAFT statement; recomputes totals and records the finalizer", roles: [FinanceAnalyst], code: 200, input: [], output: RoyaltyStatement, side_effects: ["totals recomputed; finalized_by_user_id set; increments version"] }
  - { method: POST, path: "/licensing/royalty-statements/{id}/mark-paid", description: "Mark a FINALIZED statement paid; payer must differ from finalizer (segregation of duties)", roles: [FinanceController], code: 200, input: [], output: RoyaltyStatement, side_effects: ["paid_by_user_id set; increments version"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on the endpoint, or PlatformBuyer acting on another platform's package/license" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unknown enum value, or end <= start on any window/period" }
  - { id: ERR_TITLE_NOT_FOUND, http: 404, condition: "Referenced title does not exist" }
  - { id: ERR_HOLDER_NOT_FOUND, http: 404, condition: "Referenced rights holder does not exist" }
  - { id: ERR_PLATFORM_NOT_FOUND, http: 404, condition: "Referenced platform does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "Referenced rights slot (path or line slot_id) does not exist" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "Referenced avail package does not exist" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "Referenced license does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "Referenced delivery batch does not exist" }
  - { id: ERR_NOTICE_NOT_FOUND, http: 404, condition: "Referenced takedown notice does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "Referenced revenue report does not exist" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "Referenced royalty statement does not exist" }
  - { id: ERR_TERRITORY_EMBARGOED, http: 422, condition: "Slot territory is in the title's embargoed_territories" }
  - { id: ERR_DUPLICATE_SLOT, http: 409, condition: "Another AVAILABLE/ENCUMBERED slot already exists for (title, territory, language, window_type)" }
  - { id: ERR_SLOT_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw attempted on a slot not in AVAILABLE" }
  - { id: ERR_SLOT_NOT_AVAILABLE, http: 409, condition: "Package offer references a non-AVAILABLE slot, or direct license create targets a WITHDRAWN/EXPIRED slot" }
  - { id: ERR_PACKAGE_NOT_DRAFT, http: 409, condition: "Offer attempted on a package not in DRAFT" }
  - { id: ERR_PACKAGE_NOT_OFFERED, http: 409, condition: "Accept/decline attempted on a package not in OFFERED" }
  - { id: ERR_PACKAGE_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw attempted on a terminal package" }
  - { id: ERR_LINE_NOT_IN_PACKAGE, http: 422, condition: "accepted_slot_ids contains a slot not referenced by any line of the package" }
  - { id: ERR_DUPLICATE_LINE_SLOT, http: 422, condition: "Two lines of one package reference the same slot" }
  - { id: ERR_EMPTY_ACCEPTANCE, http: 422, condition: "accepted_slot_ids is empty" }
  - { id: ERR_LINE_BLOCKED, http: 409, condition: "Accept includes a line whose line_status is BLOCKED" }
  - { id: ERR_WINDOW_OUTSIDE_RIGHTS, http: 422, condition: "License window not contained in the slot's [sellable_from, sellable_to)" }
  - { id: ERR_EXCLUSIVITY_CONFLICT, http: 409, condition: "Half-open same-cell overlap where existing or candidate license is exclusive" }
  - { id: ERR_HOLDBACK_CONFLICT, http: 409, condition: "Candidate window intersects an exclusive license's buffered closed holdback interval" }
  - { id: ERR_LICENSE_NOT_EXECUTABLE, http: 409, condition: "Activate attempted on a license not in EXECUTED" }
  - { id: ERR_LICENSE_NOT_STARTED, http: 422, condition: "Activate attempted before license_start" }
  - { id: ERR_LICENSE_NOT_EXTENDABLE, http: 409, condition: "Extend attempted on a terminal license" }
  - { id: ERR_LICENSE_ALREADY_TERMINAL, http: 409, condition: "Terminate attempted on an EXPIRED or TERMINATED license" }
  - { id: ERR_LICENSE_NOT_REPORTABLE, http: 409, condition: "Revenue report attempted on a terminal or FLAT_FEE license" }
  - { id: ERR_DELIVERY_INCOMPLETE, http: 422, condition: "Activate attempted without any DELIVERED delivery batch for the license" }
  - { id: ERR_NONPOSITIVE_REVENUE, http: 422, condition: "gross_revenue_cents <= 0" }
  - { id: ERR_REPORT_PERIOD_FUTURE, http: 422, condition: "Revenue report period_end is after the logical clock" }
  - { id: ERR_FEE_STRUCTURE_INVALID, http: 422, condition: "Fee fields inconsistent with fee_model, or percentage outside (0,100]" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_license_version does not equal the license's current version (OCC)" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "Submit attempted on a non-QUEUED batch, or resubmit attempted on a non-REJECTED batch (DELIVERED is terminal)" }
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 409, condition: "Statement period overlaps another DRAFT/FINALIZED statement of the same holder" }
  - { id: ERR_STATEMENT_NOT_DRAFT, http: 409, condition: "Finalize attempted on a statement not in DRAFT" }
  - { id: ERR_STATEMENT_NOT_FINALIZED, http: 409, condition: "Mark-paid attempted on a statement not in FINALIZED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Statement payer X-User-ID equals finalized_by_user_id" }
  - { id: ERR_OFFER_WINDOW_PAST, http: 422, condition: "offer_expires_at is not strictly after the logical clock at offer time" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "Clock set to an instant before the current logical clock" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RightsManager
    description: "Studio distribution executive: owns the catalog, rights inventory, avail packaging, license lifecycle, and asset delivery"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/titles, /licensing/rights-holders, /licensing/platforms, /licensing/rights-slots"
      - "POST /licensing/rights-slots/{id}/withdraw"
      - "POST /licensing/avail-packages (+ offer, withdraw)"
      - "POST /licensing/license-agreements (+ activate, extend, terminate)"
      - "POST /licensing/delivery-batches (+ submit, resubmit)"
    shared_operations:
      - "GET reads across catalog, slots, packages, licenses, reports, batches, notices"
      - "POST /licensing/_clock/set_current_utc"
  - name: PlatformBuyer
    description: "Acquisitions user of a buyer platform; acts only on packages/licenses addressed to own platform"
    identity: "entity_backed:Platform"
    exclusive_operations:
      - "POST /licensing/avail-packages/{id}/accept and /decline"
      - "POST /licensing/license-agreements/{id}/revenue-reports"
    shared_operations:
      - "GET /licensing/platforms(+/{id}), /licensing/avail-packages(+/{id}), /licensing/license-agreements(+/{id}), /licensing/revenue-reports(+/{id}), /licensing/delivery-batches(+/{id}), /licensing/takedown-notices(+/{id}) — restricted to own platform_id"
  - name: FinanceAnalyst
    description: "Studio royalty/finance analyst: builds and finalizes statements, reverses erroneous revenue reports"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/royalty-statements (+ finalize)"
      - "POST /licensing/revenue-reports/{id}/reverse"
    shared_operations:
      - "GET reads across catalog, slots, licenses, reports, statements"
      - "POST /licensing/_clock/set_current_utc"
  - name: FinanceController
    description: "Studio finance controller: the only role that may mark statements PAID; must not be the same person as the finalizer"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/royalty-statements/{id}/mark-paid"
    shared_operations:
      - "GET reads across catalog, slots, licenses, reports, statements"
      - "POST /licensing/_clock/set_current_utc"
