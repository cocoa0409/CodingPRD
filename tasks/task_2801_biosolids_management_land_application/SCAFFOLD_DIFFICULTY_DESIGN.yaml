        conflict: state (priority 21, ERR_EVENT_NOT_IN_PROGRESS) vs business_safety (priority 32, ERR_SITE_RESTRICTED)
        grounds:
          - validations.priority_21_ERR_EVENT_NOT_IN_PROGRESS
          - validations.priority_32_ERR_SITE_RESTRICTED
          - state_machines.ApplicationEvent.SCHEDULED_to_DEFERRED
          - errors.ERR_EVENT_NOT_IN_PROGRESS
          - errors.ERR_SITE_RESTRICTED
        distinguishing_aspect: |
          The close-out target is DEFERRED on a site that is simultaneously RESTRICTED, so both
          the state rule at priority 21 and the safety rule at priority 32 are armed on the same
