              as: ArtisticDirector
            - call: "GET /ensembles/${ens_id}"
              as: ArtisticDirector
              captures: { ens_v1: "$.data.version" }
            - call: "POST /placements"
              payload: { audition_id: "${a1_id}", ensemble_id: "${ens_id}", offer_kind: "OFFER", expected_ensemble_version: "${ens_v1}", offer_expires_at: "2026-08-25T00:00:00Z" }
              as: ArtisticDirector
              captures: { pl1_id: "$.data.id" }
            - call: "POST /placements/${pl1_id}/accept"
              payload: { instrument_loan_requested: false }
              as: Guardian
              as_user_id: "${m1_id}"
            - call: "GET /tuition-accounts?member_id=${m1_id}"
              as: FinanceOfficer
              captures: { acct1_id: "$.data[0].id" }
            - call: "POST /tuition-accounts/${acct1_id}/payments"
