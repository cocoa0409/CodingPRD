scenario: "2243. Point-of-Care Testing & CLIA-Waived Site Oversight (health system point-of-care testing program): test site inventory with certificate coverage and director assignment, operator competency assessment, training and access lock-out on lapse, quality control schedule with lot verification and out-of-range lockout, device connectivity and result posting to the medical record with manual entry controls, proficiency testing enrollment and failure investigation, reagent lot expiration and storage temperature monitoring, waived versus moderate complexity scope creep detection, inspection readiness and deficiency correction"
domain_name: point-of-care-testing-oversight
api_prefix: "/poct"

complexity_profile:
  difficulty_level: beyond_expert   # exceeds the §0.4 Expert band on entity/endpoint/error density AND on cross-table coupling
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # flat: 15 peer entities linked by explicit FK fields carried in request bodies.
  # URL paths are single-collection (`/poct/qc-runs`, `/poct/deficiencies`), never
  # deep-nested ownership chains; the only `{id}/segment` paths are action
  # endpoints and reverse-reachability sub-resource reads.

  state_machine_shape: parallel
  # Operator carries two INDEPENDENT dimensions (competency_status x access_status).
  # DeficiencyFinding, TestResult, ReagentLot and StorageUnit are cyclic.
  # ProficiencyEvent is a three-way branch with divergent side-effect sets.
  # Inspection is compound (CLOSED derived from its findings).
  # TestSite is posture_driven (oversight_posture gates child operations).

  relationship_patterns:
    - one_to_many          # TestSite -> Operator / Device / StorageUnit / ReagentLot / Inspection / ProficiencyEnrollment
    - many_to_many         # CertificateCoverage junctions TestSite <-> CliaCertificate over date windows
    - self_referential     # DeficiencyFinding.parent_finding_id -> DeficiencyFinding.id (repeat-finding chain)
    - cross_aggregate      # QcRun / TestResult reference Device + ReagentLot + Operator across aggregates
    - polymorphic: false

  role_model: segregation_of_duties
  # The competency assessor may not be its approver; the surveyor who issued a
  # finding may not accept its correction; the operator who manually entered a
  # result may not be the user who posts it to the medical record.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: CliaCertificate
    parent: null
    common_fields: true
    fields:
      - name: certificate_number
        type: string
        source: input
        description: "CMS CLIA certificate number"
        constraints: "unique across CliaCertificate; 10 characters"
      - name: certificate_type
        type: enum
        source: input
        description: "CLIA certificate class"
        constraints: "one of CERTIFICATE_OF_WAIVER, CERTIFICATE_OF_COMPLIANCE, CERTIFICATE_OF_ACCREDITATION"
      - name: permitted_complexity
        type: enum
        source: input
        description: "highest test complexity this certificate authorises"
        constraints: "one of WAIVED, MODERATE; MUST be WAIVED when certificate_type == CERTIFICATE_OF_WAIVER"
      - name: effective_date
        type: string
        source: input
        description: "first date (YYYY-MM-DD, UTC) the certificate is in force"
      - name: expiration_date
        type: string
        source: input
        description: "last date (YYYY-MM-DD, UTC) the certificate is in force; inclusive"
        constraints: "MUST be strictly after effective_date and strictly after the logical clock date at creation"
      - name: status
        type: enum
        source: computed
        description: "lifecycle state, see state_machines.CliaCertificate"
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, EXPIRED"
      - name: suspension_reason
        type: string
        source: system
        description: "reason recorded by POST /poct/certificates/{id}/suspend; null while status == ACTIVE"
        default: null
      - name: covered_site_count
        type: integer
        source: computed
        description: "COUNT(CertificateCoverage WHERE certificate_id == this.id)"
        default: 0

  - name: TestSite
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "clinic / department name of the point-of-care testing site"
      - name: department_code
        type: string
        source: input
        description: "health-system department code"
        constraints: "unique across TestSite"
      - name: complexity_scope
        type: enum
        source: input
        description: "the complexity of testing the site intends to perform"
        constraints: "one of WAIVED, MODERATE"
      - name: lab_director_operator_id
        type: string
        source: input
        description: "FK -> Operator.id; the CLIA laboratory director of record; null until PATCH /poct/sites/{id}/director"
        default: null
      - name: oversight_posture
        type: enum
        source: computed
        description: "derived gate over all child operations, see calculations.site_oversight_posture"
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, SUSPENDED"
      - name: manual_entry_blocked
        type: boolean
        source: computed
        description: "true exactly when oversight_posture != OPEN"
        default: false
      - name: open_deficiency_weight
        type: number
        source: computed
        description: "SUM(DeficiencyFinding.weight WHERE site_id == this.id AND status IN {OPEN, CORRECTION_SUBMITTED, CORRECTION_REJECTED}); 2 decimals"
        default: 0
      - name: held_result_count
        type: integer
        source: computed
        description: "COUNT(TestResult WHERE device_id IN (Device WHERE site_id == this.id) AND posting_status == HELD)"
        default: 0
      - name: total_operator_count
        type: integer
        source: computed
        description: "COUNT(Operator WHERE site_id == this.id AND access_status != DEACTIVATED)"
        default: 0
      - name: locked_out_operator_count
        type: integer
        source: computed
        description: "COUNT(Operator WHERE site_id == this.id AND access_status == LOCKED_OUT)"
        default: 0
      - name: lapsed_or_locked_operator_count
        type: integer
        source: computed
        description: "COUNT(Operator WHERE site_id == this.id AND (competency_status == LAPSED OR access_status == LOCKED_OUT))"
        default: 0
      - name: pt_unsuccessful_count
        type: integer
        source: computed
        description: "COUNT(ProficiencyEvent e WHERE e.enrollment_id IN (ProficiencyEnrollment WHERE site_id == this.id) AND e.outcome == FAIL AND e.status != INVESTIGATION_ACCEPTED)"
        default: 0
      - name: site_qc_compliance_index
        type: number
        source: computed
        description: "see calculations.site_qc_compliance_index; 2 decimals; 100.00 when the site has no non-RETIRED Device"
        default: 100
      - name: inspection_readiness_score
        type: number
        source: computed
        description: "see calculations.site_inspection_readiness_score, AS_OF_ACTUAL variant; 2 decimals"
        default: 100
      - name: scope_creep_flag
        type: boolean
        source: computed
        description: "true when some Device at this site has complexity_class == MODERATE while the site's covering certificate permitted_complexity == WAIVED"
        default: false
      - name: last_oversight_run_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent POST /poct/oversight-runs that evaluated this site; null before the first run"
        default: null

  - name: CertificateCoverage
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> TestSite.id; the site whose certificate coverage window this row occupies"
      - name: certificate_id
        type: string
        source: input
        description: "FK -> CliaCertificate.id; the certificate supplying the coverage"
      - name: coverage_start
        type: string
        source: input
        description: "first covered date (YYYY-MM-DD, UTC), inclusive"
      - name: coverage_end
        type: string
        source: input
        description: "last covered date (YYYY-MM-DD, UTC), inclusive"
        constraints: "MUST be >= coverage_start; window MUST sit inside [certificate.effective_date, certificate.expiration_date]"
      - name: permitted_complexity_snapshot
        type: enum
        source: computed
        description: "copy of certificate.permitted_complexity pinned at coverage creation"
        constraints: "one of WAIVED, MODERATE"

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> TestSite.id; the site this operator tests at"
      - name: full_name
        type: string
        source: input
        description: "operator display name"
      - name: role_title
        type: enum
        source: input
        description: "personnel class; drives director eligibility and base lock-out grace"
        constraints: "one of PHYSICIAN, DOCTORAL_SCIENTIST, MIDLEVEL_PRACTITIONER, MEDICAL_TECHNOLOGIST, MEDICAL_ASSISTANT, NURSE"
      - name: hire_date
        type: string
        source: input
        description: "YYYY-MM-DD (UTC) date of hire"
      - name: training_completed_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent POST /poct/operators/{id}/training; null until trained"
        default: null
      - name: training_module_code
        type: string
        source: system
        description: "code of the last completed training module; null until trained"
        default: null
      - name: competency_status
        type: enum
        source: computed
        description: "competency dimension of state_machines.Operator; evolves independently of access_status"
        default: PENDING
        constraints: "one of PENDING, PROVISIONAL, COMPETENT, LAPSED, REVOKED"
      - name: access_status
        type: enum
        source: computed
        description: "access dimension of state_machines.Operator; evolves independently of competency_status"
        default: LOCKED_OUT
        constraints: "one of ACTIVE, LOCKED_OUT, DEACTIVATED"
      - name: lockout_reason
        type: enum
        source: system
        description: "why access_status == LOCKED_OUT; null while access_status == ACTIVE"
        default: NEVER_TRAINED
        constraints: "one of NEVER_TRAINED, COMPETENCY_LAPSED, SITE_SUSPENDED, COMPETENCY_REVOKED, null"
      - name: competency_expires_at
        type: string
        source: computed
        description: "MAX(CompetencyAssessment.expires_at) over assessments WHERE operator_id == this.id AND status == APPROVED; null when none"
        default: null
      - name: current_grace_days
        type: integer
        source: computed
        description: "grace window applied by the most recent oversight run, see calculations.operator_access_grace_and_lockout phase 1"
        default: 0
      - name: lapse_deadline
        type: string
        source: computed
        description: "competency_expires_at + current_grace_days as a YYYY-MM-DD date; null when competency_expires_at is null"
        default: null
      - name: consecutive_rejection_count
        type: integer
        source: computed
        description: "number of consecutive REJECTED CompetencyAssessment decisions for this operator since its last APPROVED decision"
        default: 0

  - name: CompetencyAssessment
    parent: null
    common_fields: true
    fields:
      - name: operator_id
        type: string
        source: input
        description: "FK -> Operator.id; the operator being assessed"
      - name: assessor_operator_id
        type: string
        source: input
        description: "FK -> Operator.id; the operator who performed the assessment; MUST differ from operator_id"
      - name: device_model
        type: string
        source: input
        description: "device model string the competency covers; matched against Device.device_model by exact string equality"
      - name: assessment_type
        type: enum
        source: input
        description: "CLIA competency cadence slot"
        constraints: "one of INITIAL, SEMIANNUAL_1, SEMIANNUAL_2, ANNUAL"
      - name: methods_demonstrated
        type: integer
        source: input
        description: "count of the six CLIA competency elements demonstrated"
        constraints: "integer 0..6; >= 6 required for acceptance"
      - name: effective_date
        type: string
        source: input
        description: "first date (YYYY-MM-DD, UTC) the competency is valid, inclusive"
      - name: expires_at
        type: string
        source: input
        description: "exclusive upper bound date (YYYY-MM-DD, UTC) of the competency window"
        constraints: "MUST be strictly after effective_date"
      - name: status
        type: enum
        source: computed
        description: "see state_machines.CompetencyAssessment"
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, REJECTED, VOIDED"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the approver/rejecter; null while status == SUBMITTED"
        default: null
      - name: decision_note
        type: string
        source: system
        description: "free-text note supplied with the decision"
        default: null

  - name: Device
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> TestSite.id; the site the instrument lives at"
      - name: device_model
        type: string
        source: input
        description: "instrument model string; matched to ReagentLot.device_model and CompetencyAssessment.device_model by exact equality"
      - name: serial_number
        type: string
        source: input
        description: "instrument serial number"
        constraints: "unique across Device"
      - name: analyte
        type: string
        source: input
        description: "analyte the instrument reports (e.g. GLUCOSE, HBA1C)"
      - name: complexity_class
        type: enum
        source: input
        description: "test complexity of the instrument"
        constraints: "one of WAIVED, MODERATE"
      - name: connectivity_mode
        type: enum
        source: input
        description: "how results reach the medical record"
        constraints: "one of INTERFACED, MANUAL_ENTRY, OFFLINE"
      - name: qc_frequency_days
        type: integer
        source: input
        description: "maximum whole days between passing two-level QC before the instrument is QC-overdue"
        constraints: "integer >= 1"
      - name: status
        type: enum
        source: computed
        description: "see state_machines.Device"
        default: ACTIVE
        constraints: "one of ACTIVE, QC_LOCKED, RETIRED"
      - name: qc_lock_reason
        type: enum
        source: system
        description: "why status == QC_LOCKED; null while status != QC_LOCKED"
        default: null
        constraints: "one of QC_FAILURE, QC_OVERDUE, LOT_QUARANTINE, PT_UNSUCCESSFUL, CERTIFICATE_SCOPE, null"
      - name: manual_entry_suspended
        type: boolean
        source: computed
        description: "set true by the site-posture cascade when site.oversight_posture != OPEN and connectivity_mode == MANUAL_ENTRY"
        default: false
      - name: last_two_level_qc_pass_on
        type: string
        source: computed
        description: "latest YYYY-MM-DD (UTC) date on which this device recorded a PASS QcRun for BOTH LEVEL_1 and LEVEL_2; null when none"
        default: null
      - name: qc_next_due_at
        type: string
        source: computed
        description: "last_two_level_qc_pass_on + qc_frequency_days as YYYY-MM-DD; when last_two_level_qc_pass_on is null this equals the device's created_at date"
        default: null
      - name: use_day_count
        type: integer
        source: computed
        description: "COUNT(DISTINCT date(TestResult.created_at)) over TestResult WHERE device_id == this.id, restricted to the compliance window of calculations.device_qc_compliance_rate"
        default: 0
      - name: qc_compliance_rate_calendar
        type: number
        source: computed
        description: "calculations.device_qc_compliance_rate, CALENDAR_DAY_BASIS variant; 2 decimals"
        default: 100
      - name: qc_compliance_rate_day_of_use
        type: number
        source: computed
        description: "calculations.device_qc_compliance_rate, DAY_OF_USE_BASIS variant; 2 decimals"
        default: 100
      - name: retirement_reason
        type: string
        source: system
        description: "reason recorded by POST /poct/devices/{id}/retire; null while status != RETIRED"
        default: null

  - name: StorageUnit
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> TestSite.id; the site the refrigerator / cabinet is installed at"
      - name: name
        type: string
        source: input
        description: "storage unit label"
      - name: min_temp_c
        type: number
        source: input
        description: "inclusive lower bound of the acceptable storage temperature in Celsius"
      - name: max_temp_c
        type: number
        source: input
        description: "inclusive upper bound of the acceptable storage temperature in Celsius"
        constraints: "MUST be strictly greater than min_temp_c"
      - name: excursion_state
        type: enum
        source: computed
        description: "see state_machines.StorageUnit"
        default: IN_RANGE
        constraints: "one of IN_RANGE, EXCURSION_OPEN"
      - name: excursion_opened_at
        type: datetime
        source: system
        description: "logical-clock instant the current excursion opened; null while excursion_state == IN_RANGE"
        default: null
      - name: last_reading_c
        type: number
        source: computed
        description: "reading_c of the TemperatureReading with the greatest recorded_at (tie-break: created_at ASC, last row wins); null when none"
        default: null
      - name: quarantined_lot_count
        type: integer
        source: computed
        description: "COUNT(ReagentLot WHERE storage_unit_id == this.id AND verification_status == QUARANTINED)"
        default: 0

  - name: TemperatureReading
    parent: null
    common_fields: false
    fields:
      - name: storage_unit_id
        type: string
        source: input
        description: "FK -> StorageUnit.id; the unit the probe reading belongs to"
      - name: reading_c
        type: number
        source: input
        description: "probe temperature in Celsius"
      - name: recorded_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the probe was read"
      - name: recorded_by_user_id
        type: string
        source: input
        description: "opaque X-User-ID of the person or gateway that recorded the reading; NOT a foreign key"
      - name: disposition
        type: enum
        source: computed
        description: "see calculations.temperature_disposition"
        constraints: "one of IN_RANGE, OUT_OF_RANGE"
      - name: triggered_excursion
        type: boolean
        source: computed
        description: "true when this reading moved the StorageUnit from IN_RANGE to EXCURSION_OPEN"
        default: false

  - name: ReagentLot
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> TestSite.id; the site holding the lot"
      - name: storage_unit_id
        type: string
        source: input
        description: "FK -> StorageUnit.id; where the lot is stored"
      - name: device_model
        type: string
        source: input
        description: "device model the lot is licensed for; matched to Device.device_model by exact string equality"
      - name: lot_number
        type: string
        source: input
        description: "manufacturer lot number"
        constraints: "unique per (site_id, device_model, lot_number)"
      - name: expiration_date
        type: string
        source: input
        description: "last usable date (YYYY-MM-DD, UTC), inclusive"
      - name: received_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the lot was received into the storage unit"
      - name: control_min_level_1
        type: number
        source: input
        description: "inclusive lower acceptance bound for the LEVEL_1 control"
      - name: control_max_level_1
        type: number
        source: input
        description: "inclusive upper acceptance bound for the LEVEL_1 control"
        constraints: "MUST be strictly greater than control_min_level_1"
      - name: control_min_level_2
        type: number
        source: input
        description: "inclusive lower acceptance bound for the LEVEL_2 control"
      - name: control_max_level_2
        type: number
        source: input
        description: "inclusive upper acceptance bound for the LEVEL_2 control"
        constraints: "MUST be strictly greater than control_min_level_2"
      - name: verification_status
        type: enum
        source: computed
        description: "see state_machines.ReagentLot"
        default: UNVERIFIED
        constraints: "one of UNVERIFIED, VERIFIED, REJECTED, QUARANTINED, DISCARDED, EXPIRED"
      - name: verified_at
        type: datetime
        source: system
        description: "logical-clock instant of the accepted POST /poct/reagent-lots/{id}/verify; null until verified"
        default: null
      - name: quarantine_reason
        type: enum
        source: system
        description: "why verification_status == QUARANTINED; null otherwise"
        default: null
        constraints: "one of TEMPERATURE_EXCURSION, null"

  - name: QcRun
    parent: null
    common_fields: false
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; instrument the control was run on"
      - name: reagent_lot_id
        type: string
        source: input
        description: "FK -> ReagentLot.id; lot the control was run with"
      - name: operator_id
        type: string
        source: input
        description: "FK -> Operator.id; operator who ran the control"
      - name: control_level
        type: enum
        source: input
        description: "which control material level was run"
        constraints: "one of LEVEL_1, LEVEL_2"
      - name: measured_value
        type: number
        source: input
        description: "measured control value"
      - name: performed_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the control was run; defaults to the logical clock when omitted"
        default: null
      - name: expected_min
        type: number
        source: computed
        description: "snapshot of the lot's control_min_level_{1,2} matching control_level"
      - name: expected_max
        type: number
        source: computed
        description: "snapshot of the lot's control_max_level_{1,2} matching control_level"
      - name: result
        type: enum
        source: computed
        description: "see calculations.qc_run_result"
        constraints: "one of PASS, FAIL"
      - name: locked_device
        type: boolean
        source: computed
        description: "true when this run moved the Device from ACTIVE to QC_LOCKED"
        default: false

  - name: TestResult
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; instrument that produced the result"
      - name: operator_id
        type: string
        source: input
        description: "FK -> Operator.id; operator who produced or keyed the result"
      - name: reagent_lot_id
        type: string
        source: input
        description: "FK -> ReagentLot.id; lot used for the patient test"
      - name: patient_mrn
        type: string
        source: input
        description: "patient medical record number the result posts against"
      - name: analyte
        type: string
        source: input
        description: "analyte reported; MUST equal the device's analyte"
      - name: measured_value
        type: number
        source: input
        description: "patient result value as first captured"
      - name: entry_mode
        type: enum
        source: input
        description: "how the value reached the system"
        constraints: "one of INTERFACED, MANUAL"
      - name: manual_entry_reason
        type: string
        source: input
        description: "why the value was keyed by hand; required when entry_mode == MANUAL"
        default: null
      - name: posted_value
        type: number
        source: computed
        description: "value written to the medical record; null until posting_status first reaches POSTED, then equals the most recent posted value"
        default: null
      - name: posting_status
        type: enum
        source: computed
        description: "see state_machines.TestResult"
        default: PENDING_REVIEW
        constraints: "one of PENDING_REVIEW, POSTED, HELD, CORRECTION_PENDING, REJECTED"
      - name: posted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the user who last posted the result to the medical record; null until posted"
        default: null
      - name: posted_at
        type: datetime
        source: system
        description: "logical-clock instant of the last successful post; null until posted"
        default: null
      - name: held_by_device_lock_at
        type: datetime
        source: system
        description: "logical-clock instant the device-lock cascade held this result; null when not held by a device lock"
        default: null
      - name: correction_count
        type: integer
        source: computed
        description: "number of accepted POST /poct/test-results/{id}/correct calls on this row"
        default: 0
      - name: correction_reason
        type: string
        source: system
        description: "reason of the most recent correction; null when correction_count == 0"
        default: null

  - name: ProficiencyEnrollment
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> TestSite.id; the enrolled site"
      - name: analyte
        type: string
        source: input
        description: "analyte the enrollment covers"
      - name: program_year
        type: integer
        source: input
        description: "calendar year of the proficiency-testing program"
        constraints: "unique per (site_id, analyte, program_year)"
      - name: program_provider
        type: string
        source: input
        description: "PT program provider name"
      - name: status
        type: enum
        source: computed
        description: "see state_machines.ProficiencyEnrollment"
        default: ENROLLED
        constraints: "one of ENROLLED, UNSUCCESSFUL_PARTICIPATION"
      - name: graded_event_count
        type: integer
        source: computed
        description: "COUNT(ProficiencyEvent WHERE enrollment_id == this.id AND outcome IS NOT null)"
        default: 0
      - name: fail_count_last_three
        type: integer
        source: computed
        description: "see calculations.pt_event_outcome; number of FAIL outcomes among the three most recently graded events of this enrollment"
        default: 0

  - name: ProficiencyEvent
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> ProficiencyEnrollment.id; the enrollment this shipment belongs to"
      - name: shipment_number
        type: integer
        source: input
        description: "PT shipment ordinal within the program year"
        constraints: "integer 1..3; unique per (enrollment_id, shipment_number)"
      - name: due_date
        type: string
        source: input
        description: "YYYY-MM-DD (UTC) date results are due to the PT provider"
      - name: score_pct
        type: number
        source: system
        description: "graded score percentage supplied by POST /poct/pt-events/{id}/score; null until graded"
        default: null
      - name: graded_on
        type: string
        source: system
        description: "YYYY-MM-DD (UTC) grading date supplied at scoring; null until graded"
        default: null
      - name: outcome
        type: enum
        source: computed
        description: "see calculations.pt_event_outcome; null until graded"
        default: null
        constraints: "one of PASS, FAIL, null"
      - name: status
        type: enum
        source: computed
        description: "see state_machines.ProficiencyEvent"
        default: PENDING
        constraints: "one of PENDING, PASSED, INVESTIGATION_OPEN, INVESTIGATION_SUBMITTED, INVESTIGATION_ACCEPTED, UNSUCCESSFUL_LOCKED"
      - name: root_cause
        type: string
        source: system
        description: "investigation root cause narrative; null until an investigation is submitted"
        default: null
      - name: corrective_action
        type: string
        source: system
        description: "investigation corrective action narrative; null until an investigation is submitted"
        default: null
      - name: investigation_round
        type: integer
        source: computed
        description: "number of times an investigation has been submitted for this event"
        default: 0

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> TestSite.id; the site being surveyed"
      - name: inspection_type
        type: enum
        source: input
        description: "survey class"
        constraints: "one of BIENNIAL_SURVEY, COMPLAINT_SURVEY, INTERNAL_READINESS"
      - name: scheduled_date
        type: string
        source: input
        description: "YYYY-MM-DD (UTC) survey date"
      - name: status
        type: enum
        source: computed
        description: "see state_machines.Inspection"
        default: IN_PROGRESS
        constraints: "one of IN_PROGRESS, DEFICIENCIES_ISSUED, CLOSED, RESCINDED"
      - name: issued_on
        type: string
        source: system
        description: "YYYY-MM-DD (UTC) date the deficiency statement was issued; null before issuance"
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the surveyor who issued the deficiency statement; null before issuance"
        default: null
      - name: issued_weight_total
        type: number
        source: computed
        description: "SUM(DeficiencyFinding.weight) over findings of this inspection at the instant of issuance; 2 decimals"
        default: 0
      - name: readiness_score_at_issue
        type: number
        source: computed
        description: "TestSite.inspection_readiness_score snapshot taken immediately after issuance; null before issuance"
        default: null
      - name: rescind_reason
        type: string
        source: system
        description: "reason recorded by POST /poct/inspections/{id}/rescind; null unless status == RESCINDED"
        default: null

  - name: DeficiencyFinding
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: computed
        description: "FK -> TestSite.id; copied from the inspection's site_id at creation"
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the survey that raised the finding"
      - name: parent_finding_id
        type: string
        source: input
        description: "FK -> DeficiencyFinding.id; the earlier finding this one repeats; null when this is a first occurrence"
        default: null
      - name: category
        type: enum
        source: input
        description: "CLIA deficiency category"
        constraints: "one of PERSONNEL_COMPETENCY, QUALITY_CONTROL, PROFICIENCY_TESTING, REAGENT_STORAGE, RESULT_REPORTING, CERTIFICATE_SCOPE"
      - name: severity
        type: enum
        source: input
        description: "deficiency severity driving the base weight"
        constraints: "one of CONDITION_LEVEL, STANDARD_LEVEL, ADVISORY"
      - name: description
        type: string
        source: input
        description: "surveyor narrative"
      - name: correction_due_date
        type: string
        source: input
        description: "YYYY-MM-DD (UTC) date the plan of correction is due, inclusive"
      - name: weight
        type: number
        source: computed
        description: "see calculations.deficiency_weight; 0 while status == DRAFT, pinned at issuance; 2 decimals"
        default: 0
      - name: repeat_multiplier
        type: number
        source: computed
        description: "1.0 or 2.0 per calculations.deficiency_weight; pinned at issuance"
        default: 1
      - name: status
        type: enum
        source: computed
        description: "see state_machines.DeficiencyFinding"
        default: DRAFT
        constraints: "one of DRAFT, OPEN, CORRECTION_SUBMITTED, CORRECTION_REJECTED, CLOSED, VOIDED"
      - name: issued_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the surveyor who issued the finding; null while status == DRAFT"
        default: null
      - name: correction_narrative
        type: string
        source: system
        description: "most recent plan-of-correction narrative; null until first submitted"
        default: null
      - name: evidence_ref
        type: string
        source: system
        description: "most recent evidence reference supplied with the correction"
        default: null
      - name: correction_round
        type: integer
        source: computed
        description: "number of times a correction has been submitted for this finding"
        default: 0
      - name: closed_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the surveyor who accepted the correction; null unless status == CLOSED"
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: CliaCertificate
    initial_state: ACTIVE
    terminal_states: [SUSPENDED, EXPIRED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /poct/certificates"
        actor: ProgramAdmin
        preconditions:
          - "certificate_number is unique across CliaCertificate"
          - "expiration_date > effective_date"
          - "expiration_date > date(logical clock now)"
          - "permitted_complexity == WAIVED when certificate_type == CERTIFICATE_OF_WAIVER"
        side_effects:
          - "covered_site_count initialised to 0"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /poct/certificates/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "suspension_reason set from request; version += 1"
          - "CASCADE-B link 1: for every TestSite S referenced by a CertificateCoverage C of this certificate where C.coverage_start <= date(now) <= C.coverage_end, S loses its only in-window ACTIVE coverage, so calculations.site_oversight_posture re-derives S.oversight_posture = SUSPENDED and S.manual_entry_blocked = true"
          - "CASCADE-B link 2 (caused by link 1): for every Operator O with O.site_id == S.id and O.access_status == ACTIVE, set O.access_status = LOCKED_OUT and O.lockout_reason = SITE_SUSPENDED (O.competency_status is NOT touched); processed created_at ASC then full_name ASC"
          - "CASCADE-B link 3 (caused by link 2): for every CompetencyAssessment A with A.status == SUBMITTED and A.operator_id in the operators locked out by link 2, set A.status = VOIDED"
          - "CASCADE-B link 4 (caused by link 1): for every Device D with D.site_id == S.id and D.status == ACTIVE, set D.status = QC_LOCKED and D.qc_lock_reason = CERTIFICATE_SCOPE; D.manual_entry_suspended = true when D.connectivity_mode == MANUAL_ENTRY"
          - "S.inspection_readiness_score and S.site_qc_compliance_index recomputed"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /poct/oversight-runs (system, when date(now) > expiration_date)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "date(logical clock now) > expiration_date"
        side_effects:
          - "same cascade links 1-4 as ACTIVE -> SUSPENDED, with lockout_reason = SITE_SUSPENDED"
          - "coverages of this certificate stop counting toward calculations.certificate_coverage_overlap candidate sets"

  - entity: TestSite
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /poct/sites"
        actor: ProgramAdmin
        preconditions:
          - "department_code is unique across TestSite"
        side_effects:
          - "all computed counters initialised to 0; oversight_posture = OPEN; site_qc_compliance_index = 100.00; inspection_readiness_score = 100.00"
        note: "A brand-new site has no certificate coverage. oversight_posture is only re-derived by the triggers listed below, so it stays OPEN until the first coverage-, finding-, hold- or lockout-affecting transition or oversight run."
      - from: OPEN
        to: RESTRICTED
        trigger: "system re-derivation of calculations.site_oversight_posture after any of: POST /poct/inspections/{id}/issue, POST /poct/deficiencies/{id}/correction-decision, POST /poct/inspections/{id}/rescind, POST /poct/qc-runs, POST /poct/devices/{id}/qc-unlock, POST /poct/test-results, POST /poct/test-results/{id}/post, POST /poct/certificate-coverages, POST /poct/certificates/{id}/suspend, POST /poct/pt-events/{id}/score, POST /poct/pt-events/{id}/investigation-decision, POST /poct/oversight-runs"
        actor: system
        preconditions:
          - "the site has at least one CertificateCoverage C with C.coverage_start <= date(now) <= C.coverage_end and C.certificate.status == ACTIVE"
          - "open_deficiency_weight < 16.0"
          - "open_deficiency_weight >= 6.0 OR held_result_count >= 3 OR (locked_out_operator_count * 2) > total_operator_count"
        side_effects:
          - "manual_entry_blocked = true"
          - "every Device D with D.site_id == this.id and D.connectivity_mode == MANUAL_ENTRY gets D.manual_entry_suspended = true"
          - "inspection_readiness_score recomputed (AS_OF_ACTUAL variant)"
      - from: RESTRICTED
        to: OPEN
        trigger: "system re-derivation of calculations.site_oversight_posture (same trigger list as OPEN -> RESTRICTED)"
        actor: system
        preconditions:
          - "the site has at least one CertificateCoverage C with C.coverage_start <= date(now) <= C.coverage_end and C.certificate.status == ACTIVE"
          - "open_deficiency_weight < 6.0 AND held_result_count < 3 AND (locked_out_operator_count * 2) <= total_operator_count"
        side_effects:
          - "manual_entry_blocked = false"
          - "every Device D with D.site_id == this.id and D.connectivity_mode == MANUAL_ENTRY gets D.manual_entry_suspended = false"
          - "inspection_readiness_score recomputed (AS_OF_ACTUAL variant)"
      - from: OPEN
        to: SUSPENDED
        trigger: "system re-derivation of calculations.site_oversight_posture (same trigger list as OPEN -> RESTRICTED)"
        actor: system
        preconditions:
          - "no CertificateCoverage C exists with C.coverage_start <= date(now) <= C.coverage_end and C.certificate.status == ACTIVE, OR open_deficiency_weight >= 16.0"
        side_effects:
          - "manual_entry_blocked = true; MANUAL_ENTRY devices get manual_entry_suspended = true"
          - "inspection_readiness_score recomputed"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system re-derivation of calculations.site_oversight_posture (same trigger list as OPEN -> RESTRICTED)"
        actor: system
        preconditions:
          - "no CertificateCoverage C exists with C.coverage_start <= date(now) <= C.coverage_end and C.certificate.status == ACTIVE, OR open_deficiency_weight >= 16.0"
        side_effects:
          - "manual_entry_blocked = true; MANUAL_ENTRY devices get manual_entry_suspended = true"
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system re-derivation of calculations.site_oversight_posture (same trigger list as OPEN -> RESTRICTED)"
        actor: system
        preconditions:
          - "an in-window ACTIVE CertificateCoverage exists AND open_deficiency_weight < 16.0"
          - "open_deficiency_weight >= 6.0 OR held_result_count >= 3 OR (locked_out_operator_count * 2) > total_operator_count"
        side_effects:
          - "manual_entry_blocked stays true"
      - from: SUSPENDED
        to: OPEN
        trigger: "system re-derivation of calculations.site_oversight_posture (same trigger list as OPEN -> RESTRICTED)"
        actor: system
        preconditions:
          - "an in-window ACTIVE CertificateCoverage exists"
          - "open_deficiency_weight < 6.0 AND held_result_count < 3 AND (locked_out_operator_count * 2) <= total_operator_count"
        side_effects:
          - "manual_entry_blocked = false; MANUAL_ENTRY devices get manual_entry_suspended = false"

  - entity: Operator
    initial_state: "PENDING x LOCKED_OUT"
    terminal_states: ["REVOKED x DEACTIVATED"]
    note: |
      PARALLEL state dimensions on one row: `competency_status` (PENDING ->
      PROVISIONAL -> COMPETENT -> LAPSED -> COMPETENT ... -> REVOKED) and
      `access_status` (LOCKED_OUT <-> ACTIVE -> DEACTIVATED) advance on
      DIFFERENT triggers and are observable independently. Regaining competency
      does NOT restore access; losing access does NOT lapse competency.
    transitions:
      - from: "competency=null, access=null"
        to: "competency=PENDING, access=LOCKED_OUT"
        trigger: "POST /poct/operators"
        actor: ProgramAdmin
        preconditions:
          - "site_id resolves to a TestSite"
        side_effects:
          - "lockout_reason = NEVER_TRAINED"
          - "site.total_operator_count += 1; site.locked_out_operator_count += 1; site.lapsed_or_locked_operator_count += 1"
          - "site.inspection_readiness_score recomputed"
      - from: "competency=PENDING"
        to: "competency=PROVISIONAL, access=ACTIVE"
        trigger: "POST /poct/operators/{id}/training"
        actor: ProgramAdmin | QualityCoordinator
        preconditions:
          - "competency_status == PENDING"
          - "access_status == LOCKED_OUT AND lockout_reason == NEVER_TRAINED"
        side_effects:
          - "training_completed_at = now; training_module_code set; lockout_reason = null"
          - "site.locked_out_operator_count -= 1; site.lapsed_or_locked_operator_count recomputed; site posture re-derived"
      - from: "competency IN {PROVISIONAL, LAPSED}"
        to: "competency=COMPETENT"
        trigger: "POST /poct/competency-assessments/{id}/decision (decision == APPROVE)"
        actor: LabDirector | ProgramAdmin
        preconditions:
          - "the assessment's status == SUBMITTED and its operator_id == this.id"
          - "assessment.effective_date <= date(now) < assessment.expires_at"
        side_effects:
          - "competency_expires_at recomputed as MAX(expires_at) over APPROVED assessments"
          - "consecutive_rejection_count = 0"
          - "access_status is NOT changed by this transition (parallel dimension): an operator whose access_status == LOCKED_OUT stays LOCKED_OUT and keeps lockout_reason"
          - "site.lapsed_or_locked_operator_count and site.inspection_readiness_score recomputed"
      - from: "competency=COMPETENT"
        to: "competency=LAPSED, access=LOCKED_OUT"
        trigger: "POST /poct/oversight-runs (phase 2 of calculations.operator_access_grace_and_lockout)"
        actor: system
        preconditions:
          - "competency_status == COMPETENT"
          - "competency_expires_at is not null"
          - "date(now) > lapse_deadline computed in phase 1 from the phase-0 posture snapshot"
        side_effects:
          - "lockout_reason = COMPETENCY_LAPSED"
          - "site.locked_out_operator_count += 1; site.lapsed_or_locked_operator_count += 1"
          - "site posture re-derived in phase 3 (may cross the strict-majority lock-out threshold)"
      - from: "competency IN {PROVISIONAL, COMPETENT, LAPSED}"
        to: "competency=REVOKED, access=DEACTIVATED"
        trigger: "POST /poct/competency-assessments/{id}/decision (decision == REJECT and consecutive_rejection_count would reach 2)"
        actor: LabDirector | ProgramAdmin
        preconditions:
          - "consecutive_rejection_count == 1 before this decision"
        side_effects:
          - "consecutive_rejection_count = 2; lockout_reason = COMPETENCY_REVOKED"
          - "site.total_operator_count -= 1 (DEACTIVATED operators leave the denominator); counters and posture re-derived"
      - from: "access=LOCKED_OUT"
        to: "access=ACTIVE"
        trigger: "POST /poct/operators/{id}/access-reinstatement"
        actor: LabDirector | ProgramAdmin
        preconditions:
          - "access_status == LOCKED_OUT"
          - "competency_status IN {PROVISIONAL, COMPETENT}"
          - "CROSS-ENTITY: site.oversight_posture != SUSPENDED"
        side_effects:
          - "lockout_reason = null"
          - "site.locked_out_operator_count -= 1; site.lapsed_or_locked_operator_count recomputed; site posture re-derived"

  - entity: CompetencyAssessment
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, VOIDED]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /poct/competency-assessments"
        actor: QualityCoordinator | LabDirector
        preconditions:
          - "expected_operator_version equals the operator's current version (concurrency_rules.assessment-create-stale-operator)"
          - "assessor_operator_id != operator_id"
          - "assessor operator has site_id == subject operator's site_id and competency_status IN {PROVISIONAL, COMPETENT}"
          - "methods_demonstrated >= 6"
          - "expires_at > effective_date"
          - "no APPROVED CompetencyAssessment for the same (operator_id, device_model) whose half-open window [effective_date, expires_at) intersects the requested window"
        side_effects:
          - "operator.version += 1 (the new submission supersedes any earlier SUBMITTED row for the same operator and device_model, which is set to VOIDED)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /poct/competency-assessments/{id}/decision (decision == APPROVE)"
        actor: LabDirector | ProgramAdmin
        preconditions:
          - "status == SUBMITTED"
          - "SEGREGATION: when X-User-Role == LabDirector, X-User-ID != assessor_operator_id AND X-User-ID != operator_id AND X-User-ID == site.lab_director_operator_id"
        side_effects:
          - "decided_by_user_id, decision_note recorded"
          - "operator.competency_status -> COMPETENT (see state_machines.Operator); operator.competency_expires_at recomputed"
          - "site.lapsed_or_locked_operator_count and site.inspection_readiness_score recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /poct/competency-assessments/{id}/decision (decision == REJECT)"
        actor: LabDirector | ProgramAdmin
        preconditions:
          - "status == SUBMITTED"
          - "SEGREGATION: same rule as APPROVE"
        side_effects:
          - "operator.consecutive_rejection_count += 1"
          - "when the incremented count reaches 2: operator.competency_status = REVOKED and operator.access_status = DEACTIVATED"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /poct/certificates/{id}/suspend or POST /poct/oversight-runs (CASCADE-B link 3), or supersede by a newer submission for the same (operator_id, device_model)"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "decided_by_user_id stays null; decision_note = 'voided by site suspension' or 'superseded'"

  - entity: Device
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /poct/devices"
        actor: ProgramAdmin
        preconditions:
          - "serial_number unique across Device"
          - "the site has a CertificateCoverage C with C.coverage_start <= date(now) <= C.coverage_end and C.certificate.status == ACTIVE and date(now) <= C.certificate.expiration_date"
          - "complexity_class == WAIVED, OR the in-window coverage's permitted_complexity_snapshot == MODERATE"
          - "qc_frequency_days >= 1"
        side_effects:
          - "qc_next_due_at = date(created_at); qc_compliance_rate_* initialised to 100.00"
          - "site.site_qc_compliance_index and site.inspection_readiness_score recomputed"
      - from: ACTIVE
        to: QC_LOCKED
        trigger: "POST /poct/qc-runs (result == FAIL)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "calculations.qc_run_result returned FAIL for the submitted run"
        side_effects:
          - "qc_lock_reason = QC_FAILURE; QcRun.locked_device = true"
          - "CASCADE-A link 2 (caused by the device lock): every TestResult R with R.device_id == this.id and R.posting_status == PENDING_REVIEW moves to HELD and R.held_by_device_lock_at = now, processed created_at ASC then patient_mrn ASC; site.held_result_count += the number moved"
          - "CASCADE-A link 3 (caused by the held-count change): calculations.site_oversight_posture re-derives site.oversight_posture; it becomes RESTRICTED once site.held_result_count >= 3"
          - "CASCADE-A link 4 (caused by the posture change): site.manual_entry_blocked = true and every Device at the site with connectivity_mode == MANUAL_ENTRY gets manual_entry_suspended = true"
      - from: ACTIVE
        to: QC_LOCKED
        trigger: "POST /poct/oversight-runs (date(now) > qc_next_due_at)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "date(logical clock now) > qc_next_due_at"
        side_effects:
          - "qc_lock_reason = QC_OVERDUE"
          - "PENDING_REVIEW results on the device are NOT held (divergent from the QC_FAILURE branch); only site.site_qc_compliance_index and site.inspection_readiness_score are recomputed"
      - from: ACTIVE
        to: QC_LOCKED
        trigger: "POST /poct/storage-units/{id}/temperature-readings (CASCADE-C link 3)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "some ReagentLot L with L.site_id == this.site_id and L.device_model == this.device_model moved to QUARANTINED in link 2 of the same request"
        side_effects:
          - "qc_lock_reason = LOT_QUARANTINE"
          - "CASCADE-C link 4 (caused by this device lock): PENDING_REVIEW TestResults whose reagent_lot_id is one of the quarantined lots move to REJECTED (not HELD - the lot itself is unusable)"
      - from: ACTIVE
        to: QC_LOCKED
        trigger: "POST /poct/pt-events/{id}/score (branch to UNSUCCESSFUL_LOCKED)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "this.analyte == the enrollment's analyte and this.site_id == the enrollment's site_id"
        side_effects:
          - "qc_lock_reason = PT_UNSUCCESSFUL"
      - from: ACTIVE
        to: QC_LOCKED
        trigger: "POST /poct/oversight-runs (scope-creep detection)"
        actor: system
        preconditions:
          - "status == ACTIVE AND complexity_class == MODERATE"
          - "the site's in-window ACTIVE coverage has permitted_complexity_snapshot == WAIVED"
        side_effects:
          - "qc_lock_reason = CERTIFICATE_SCOPE; site.scope_creep_flag = true"
      - from: QC_LOCKED
        to: ACTIVE
        trigger: "POST /poct/devices/{id}/qc-unlock"
        actor: QualityCoordinator | LabDirector
        preconditions:
          - "status == QC_LOCKED"
          - "confirming_qc_run_id resolves to a QcRun with device_id == this.id"
          - "that QcRun has result == PASS"
          - "that QcRun's reagent_lot_id references a ReagentLot with verification_status == VERIFIED"
          - "qc_lock_reason != CERTIFICATE_SCOPE (a scope violation is not clearable by QC)"
        side_effects:
          - "qc_lock_reason = null; last_two_level_qc_pass_on and qc_next_due_at recomputed"
          - "COMPENSATION: every TestResult R with R.device_id == this.id, R.posting_status == HELD and R.held_by_device_lock_at IS NOT NULL returns to PENDING_REVIEW and R.held_by_device_lock_at = null, processed created_at ASC then patient_mrn ASC; site.held_result_count decremented by exactly that count"
          - "site.oversight_posture re-derived; when the held count drops below 3 and no other RESTRICTED trigger holds, the posture returns to its pre-lock value and manual_entry_suspended flags are cleared"
      - from: "ACTIVE | QC_LOCKED"
        to: RETIRED
        trigger: "POST /poct/devices/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "status IN {ACTIVE, QC_LOCKED}"
          - "no TestResult with device_id == this.id has posting_status IN {PENDING_REVIEW, HELD, CORRECTION_PENDING}"
        side_effects:
          - "retirement_reason recorded; qc_lock_reason = null"
          - "site.site_qc_compliance_index recomputed EXCLUDING this device; site.inspection_readiness_score recomputed"

  - entity: StorageUnit
    initial_state: IN_RANGE
    terminal_states: []
    transitions:
      - from: null
        to: IN_RANGE
        trigger: "POST /poct/storage-units"
        actor: ProgramAdmin
        preconditions:
          - "max_temp_c > min_temp_c"
        side_effects: ["quarantined_lot_count = 0"]
      - from: IN_RANGE
        to: EXCURSION_OPEN
        trigger: "POST /poct/storage-units/{id}/temperature-readings (disposition == OUT_OF_RANGE)"
        actor: Operator | QualityCoordinator | ProgramAdmin
        preconditions:
          - "excursion_state == IN_RANGE"
          - "calculations.temperature_disposition returned OUT_OF_RANGE"
        side_effects:
          - "excursion_opened_at = now; TemperatureReading.triggered_excursion = true"
          - "CASCADE-C link 2 (caused by the excursion opening): every ReagentLot L with L.storage_unit_id == this.id and L.verification_status IN {UNVERIFIED, VERIFIED} moves to QUARANTINED with quarantine_reason = TEMPERATURE_EXCURSION; quarantined_lot_count updated"
          - "CASCADE-C link 3 (caused by link 2): every ACTIVE Device sharing site_id and device_model with a lot quarantined in link 2 moves to QC_LOCKED with qc_lock_reason = LOT_QUARANTINE"
          - "CASCADE-C link 4 (caused by link 3): PENDING_REVIEW TestResults on those devices whose reagent_lot_id is one of the quarantined lots move to REJECTED"
          - "site.oversight_posture and site.inspection_readiness_score re-derived"
      - from: EXCURSION_OPEN
        to: IN_RANGE
        trigger: "POST /poct/storage-units/{id}/excursion-resolution"
        actor: QualityCoordinator | LabDirector
        preconditions:
          - "excursion_state == EXCURSION_OPEN"
        side_effects:
          - "excursion_opened_at = null"
          - "lot_disposition == RELEASE: every QUARANTINED lot in this unit returns to VERIFIED with quarantine_reason = null"
          - "lot_disposition == DISCARD: every QUARANTINED lot in this unit moves to DISCARDED (terminal)"
          - "quarantined_lot_count = 0; devices locked with qc_lock_reason == LOT_QUARANTINE stay QC_LOCKED and require POST /poct/devices/{id}/qc-unlock"

  - entity: ReagentLot
    initial_state: UNVERIFIED
    terminal_states: [REJECTED, DISCARDED, EXPIRED]
    transitions:
      - from: null
        to: UNVERIFIED
        trigger: "POST /poct/reagent-lots"
        actor: ProgramAdmin | QualityCoordinator
        preconditions:
          - "storage unit's site_id == site_id"
          - "storage unit's excursion_state == IN_RANGE"
          - "date(now) <= expiration_date"
          - "control_max_level_1 > control_min_level_1 AND control_max_level_2 > control_min_level_2"
        side_effects: ["verification_status = UNVERIFIED"]
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /poct/reagent-lots/{id}/verify"
        actor: QualityCoordinator | LabDirector
        preconditions:
          - "verification_status == UNVERIFIED"
          - "level_1_qc_run_id and level_2_qc_run_id both resolve to QcRuns with reagent_lot_id == this.id"
          - "the two runs have control_level LEVEL_1 and LEVEL_2 respectively and identical device_id"
          - "both runs have result == PASS"
        side_effects:
          - "verified_at = now; version += 1"
      - from: UNVERIFIED
        to: REJECTED
        trigger: "POST /poct/reagent-lots/{id}/verify (at least one referenced run has result == FAIL)"
        actor: QualityCoordinator | LabDirector
        preconditions:
          - "verification_status == UNVERIFIED"
          - "both referenced runs belong to this lot and cover LEVEL_1 and LEVEL_2"
          - "at least one referenced run has result == FAIL"
        side_effects:
          - "verification_status = REJECTED (terminal); verified_at stays null"
      - from: "UNVERIFIED | VERIFIED"
        to: QUARANTINED
        trigger: "POST /poct/storage-units/{id}/temperature-readings (CASCADE-C link 2)"
        actor: system
        preconditions:
          - "verification_status IN {UNVERIFIED, VERIFIED}"
          - "the lot's storage unit moved IN_RANGE -> EXCURSION_OPEN in this request"
        side_effects:
          - "quarantine_reason = TEMPERATURE_EXCURSION"
      - from: QUARANTINED
        to: VERIFIED
        trigger: "POST /poct/storage-units/{id}/excursion-resolution (lot_disposition == RELEASE)"
        actor: QualityCoordinator | LabDirector
        preconditions:
          - "verification_status == QUARANTINED"
          - "verified_at IS NOT NULL (the lot had passed two-level verification before the excursion)"
        side_effects:
          - "quarantine_reason = null"
      - from: QUARANTINED
        to: DISCARDED
        trigger: "POST /poct/storage-units/{id}/excursion-resolution (lot_disposition == DISCARD)"
        actor: QualityCoordinator | LabDirector
        preconditions:
          - "verification_status == QUARANTINED"
        side_effects:
          - "quarantine_reason kept for audit; lot becomes unusable (terminal)"
      - from: "UNVERIFIED | VERIFIED"
        to: EXPIRED
        trigger: "POST /poct/oversight-runs (date(now) > expiration_date)"
        actor: system
        preconditions:
          - "verification_status IN {UNVERIFIED, VERIFIED}"
          - "date(logical clock now) > expiration_date"
        side_effects:
          - "every TestResult R with R.reagent_lot_id == this.id and R.posting_status == PENDING_REVIEW moves to REJECTED"

  - entity: QcRun
    initial_state: RECORDED
    terminal_states: [RECORDED]
    transitions:
      - from: null
        to: RECORDED
        trigger: "POST /poct/qc-runs"
        actor: Operator | QualityCoordinator
        preconditions:
          - "device.status IN {ACTIVE, QC_LOCKED} (a locked device may still run confirming QC)"
          - "reagent lot verification_status IN {UNVERIFIED, VERIFIED}"
          - "date(now) <= lot.expiration_date"
          - "lot.device_model == device.device_model"
          - "operator.site_id == device.site_id AND lot.site_id == device.site_id"
          - "operator.access_status == ACTIVE AND operator.competency_status IN {PROVISIONAL, COMPETENT}"
        side_effects:
          - "expected_min / expected_max snapshotted from the lot's bounds for control_level"
          - "result computed by calculations.qc_run_result"
          - "on result == PASS: device.last_two_level_qc_pass_on and device.qc_next_due_at recomputed; device.qc_compliance_rate_calendar and device.qc_compliance_rate_day_of_use recomputed; site.site_qc_compliance_index and site.inspection_readiness_score recomputed"
          - "on result == FAIL and device.status == ACTIVE: run CASCADE-A links 2-4 (see state_machines.Device ACTIVE -> QC_LOCKED on QC failure)"
        note: "QcRun rows are append-only (common_fields: false); an incorrect run is superseded by a new run, never edited."

  - entity: TestResult
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED]
    note: |
      CYCLIC on two loops: PENDING_REVIEW -> HELD -> PENDING_REVIEW (device QC
      lock / unlock) and POSTED -> CORRECTION_PENDING -> POSTED (result
      correction re-posted to the medical record).
    transitions:
      - from: null
        to: PENDING_REVIEW
        trigger: "POST /poct/test-results"
        actor: Operator
        preconditions:
          - "device.status == ACTIVE"
          - "date(now) <= qc_next_due_at of the device"
          - "reagent lot verification_status == VERIFIED"
          - "date(now) <= lot.expiration_date"
          - "operator.access_status == ACTIVE AND operator.competency_status IN {PROVISIONAL, COMPETENT}"
          - "analyte == device.analyte"
          - "entry_mode == MANUAL requires manual_entry_reason to be a non-empty string"
          - "entry_mode == MANUAL requires site.manual_entry_blocked == false AND device.manual_entry_suspended == false"
        side_effects:
          - "posting_status = PENDING_REVIEW; posted_value stays null"
          - "device.use_day_count, device.qc_compliance_rate_day_of_use, site.site_qc_compliance_index and site.inspection_readiness_score recomputed"
      - from: "PENDING_REVIEW | CORRECTION_PENDING"
        to: POSTED
        trigger: "POST /poct/test-results/{id}/post"
        actor: Operator | LabDirector
        preconditions:
          - "posting_status IN {PENDING_REVIEW, CORRECTION_PENDING}"
          - "CROSS-ENTITY: device.status == ACTIVE"
          - "the acting operator (X-User-ID) has access_status == ACTIVE and competency_status IN {PROVISIONAL, COMPETENT} and site_id == device.site_id"
          - "SEGREGATION: when entry_mode == MANUAL, X-User-ID != this.operator_id"
        side_effects:
          - "posted_value = measured_value on the first post, or the latest corrected_value when arriving from CORRECTION_PENDING"
          - "posted_by_user_id, posted_at recorded; version += 1"
          - "site.held_result_count unchanged; site.oversight_posture re-derived"
      - from: PENDING_REVIEW
        to: HELD
        trigger: "POST /poct/qc-runs (CASCADE-A link 2)"
        actor: system
        preconditions:
          - "posting_status == PENDING_REVIEW"
          - "the device moved ACTIVE -> QC_LOCKED with qc_lock_reason == QC_FAILURE in this request"
        side_effects:
          - "held_by_device_lock_at = now; site.held_result_count += 1"
      - from: HELD
        to: PENDING_REVIEW
        trigger: "POST /poct/devices/{id}/qc-unlock (compensation)"
        actor: system
        preconditions:
          - "posting_status == HELD AND held_by_device_lock_at IS NOT NULL"
        side_effects:
          - "held_by_device_lock_at = null; site.held_result_count -= 1"
      - from: POSTED
        to: CORRECTION_PENDING
        trigger: "POST /poct/test-results/{id}/correct"
        actor: Operator | LabDirector
        preconditions:
          - "posting_status == POSTED"
          - "expected_test_result_version equals this row's current version (concurrency_rules.result-correct-stale-result)"
          - "device.status == ACTIVE"
        side_effects:
          - "correction_count += 1; correction_reason recorded; version += 1"
          - "posted_value keeps the previously posted number until the correction is re-posted"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /poct/storage-units/{id}/temperature-readings (CASCADE-C link 4) or POST /poct/oversight-runs (lot expiry)"
        actor: system
        preconditions:
          - "posting_status == PENDING_REVIEW"
          - "the referenced reagent lot moved to QUARANTINED or EXPIRED in this request"
        side_effects:
          - "posted_value stays null (terminal); site.inspection_readiness_score recomputed"

  - entity: ProficiencyEnrollment
    initial_state: ENROLLED
    terminal_states: [UNSUCCESSFUL_PARTICIPATION]
    transitions:
      - from: null
        to: ENROLLED
        trigger: "POST /poct/pt-enrollments"
        actor: ProgramAdmin | QualityCoordinator
        preconditions:
          - "no other ProficiencyEnrollment exists with the same (site_id, analyte, program_year)"
        side_effects: ["graded_event_count = 0; fail_count_last_three = 0"]
      - from: ENROLLED
        to: UNSUCCESSFUL_PARTICIPATION
        trigger: "POST /poct/pt-events/{id}/score (event branches to UNSUCCESSFUL_LOCKED)"
        actor: system
        preconditions:
          - "status == ENROLLED"
          - "calculations.pt_event_outcome returned FAIL and fail_count_last_three >= 2 including the event just graded"
        side_effects:
          - "site.pt_unsuccessful_count recomputed; site.inspection_readiness_score recomputed"

  - entity: ProficiencyEvent
    initial_state: PENDING
    terminal_states: [PASSED, INVESTIGATION_ACCEPTED]
    note: |
      THREE-WAY BRANCH on scoring with divergent side-effect sets, then a
      revision CYCLE: INVESTIGATION_SUBMITTED -> INVESTIGATION_OPEN ->
      INVESTIGATION_SUBMITTED ... until accepted.
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /poct/pt-events"
        actor: ProgramAdmin | QualityCoordinator
        preconditions:
          - "enrollment.status == ENROLLED"
          - "shipment_number is 1..3 and unique per enrollment"
        side_effects: ["outcome = null; investigation_round = 0"]
      - from: PENDING
        to: PASSED
        trigger: "POST /poct/pt-events/{id}/score (score_pct >= 80.00)"
        actor: QualityCoordinator | ProgramAdmin
        preconditions:
          - "status == PENDING"
          - "score_pct between 0.00 and 100.00 inclusive"
        side_effects:
          - "outcome = PASS; graded_on recorded"
          - "enrollment.graded_event_count += 1; enrollment.fail_count_last_three recomputed"
          - "site.pt_unsuccessful_count and site.inspection_readiness_score recomputed"
          - "NO device is locked on this branch"
      - from: PENDING
        to: INVESTIGATION_OPEN
        trigger: "POST /poct/pt-events/{id}/score (score_pct < 80.00 and fail_count_last_three < 2)"
        actor: QualityCoordinator | ProgramAdmin
        preconditions:
          - "status == PENDING"
        side_effects:
          - "outcome = FAIL; graded_on recorded"
          - "enrollment.graded_event_count += 1; enrollment.fail_count_last_three recomputed"
          - "site.pt_unsuccessful_count += 1; site.inspection_readiness_score recomputed"
          - "NO device is locked and the enrollment stays ENROLLED (divergent from the UNSUCCESSFUL_LOCKED branch)"
      - from: PENDING
        to: UNSUCCESSFUL_LOCKED
        trigger: "POST /poct/pt-events/{id}/score (score_pct < 80.00 and fail_count_last_three >= 2)"
        actor: QualityCoordinator | ProgramAdmin
        preconditions:
          - "status == PENDING"
        side_effects:
          - "outcome = FAIL; graded_on recorded"
          - "enrollment.status = UNSUCCESSFUL_PARTICIPATION"
          - "every ACTIVE Device D with D.site_id == enrollment.site_id and D.analyte == enrollment.analyte moves to QC_LOCKED with qc_lock_reason = PT_UNSUCCESSFUL, processed created_at ASC then serial_number ASC"
          - "site.pt_unsuccessful_count += 1; site.oversight_posture and site.inspection_readiness_score re-derived"
      - from: "INVESTIGATION_OPEN | UNSUCCESSFUL_LOCKED"
        to: INVESTIGATION_SUBMITTED
        trigger: "POST /poct/pt-events/{id}/investigation"
        actor: QualityCoordinator | LabDirector
        preconditions:
          - "status IN {INVESTIGATION_OPEN, UNSUCCESSFUL_LOCKED}"
        side_effects:
          - "root_cause, corrective_action recorded; investigation_round += 1"
      - from: INVESTIGATION_SUBMITTED
        to: INVESTIGATION_ACCEPTED
        trigger: "POST /poct/pt-events/{id}/investigation-decision (decision == ACCEPT)"
        actor: LabDirector
        preconditions:
          - "status == INVESTIGATION_SUBMITTED"
        side_effects:
          - "site.pt_unsuccessful_count -= 1; site.inspection_readiness_score recomputed"
          - "devices locked with qc_lock_reason == PT_UNSUCCESSFUL for this analyte stay QC_LOCKED and require POST /poct/devices/{id}/qc-unlock"
      - from: INVESTIGATION_SUBMITTED
        to: INVESTIGATION_OPEN
        trigger: "POST /poct/pt-events/{id}/investigation-decision (decision == REJECT)"
        actor: LabDirector
        preconditions:
          - "status == INVESTIGATION_SUBMITTED"
        side_effects:
          - "root_cause and corrective_action retained for audit; the event re-enters the investigation loop"

  - entity: Inspection
    initial_state: IN_PROGRESS
    terminal_states: [CLOSED, RESCINDED]
    transitions:
      - from: null
        to: IN_PROGRESS
        trigger: "POST /poct/inspections"
        actor: Surveyor
        preconditions:
          - "site_id resolves to a TestSite"
        side_effects: ["issued_weight_total = 0"]
      - from: IN_PROGRESS
        to: DEFICIENCIES_ISSUED
        trigger: "POST /poct/inspections/{id}/issue"
        actor: Surveyor
        preconditions:
          - "status == IN_PROGRESS"
          - "at least one DeficiencyFinding with inspection_id == this.id has status == DRAFT"
        side_effects:
          - "issued_on, issued_by_user_id recorded"
          - "every DRAFT finding of this inspection moves to OPEN in created_at ASC then category ASC order; each finding's weight and repeat_multiplier are pinned by calculations.deficiency_weight"
          - "issued_weight_total = SUM of the pinned weights; site.open_deficiency_weight += issued_weight_total"
          - "site.oversight_posture re-derived (>= 6.0 -> RESTRICTED, >= 16.0 -> SUSPENDED); site.inspection_readiness_score recomputed; readiness_score_at_issue snapshotted"
      - from: DEFICIENCIES_ISSUED
        to: CLOSED
        trigger: "POST /poct/deficiencies/{id}/correction-decision (compound bubble-up when the last non-terminal finding closes)"
        actor: system
        preconditions:
          - "status == DEFICIENCIES_ISSUED"
          - "every DeficiencyFinding with inspection_id == this.id has status IN {CLOSED, VOIDED}"
        side_effects:
          - "site.open_deficiency_weight reaches its pre-issue value for this inspection's contribution; site.oversight_posture re-derived"
      - from: "IN_PROGRESS | DEFICIENCIES_ISSUED"
        to: RESCINDED
        trigger: "POST /poct/inspections/{id}/rescind"
        actor: Surveyor | ProgramAdmin
        preconditions:
          - "status IN {IN_PROGRESS, DEFICIENCIES_ISSUED}"
        side_effects:
          - "rescind_reason recorded"
          - "COMPENSATION: every DeficiencyFinding of this inspection with status IN {DRAFT, OPEN, CORRECTION_SUBMITTED, CORRECTION_REJECTED} moves to VOIDED; site.open_deficiency_weight decremented by the sum of those findings' weight (DRAFT findings contribute 0)"
          - "site.oversight_posture re-derived; site.inspection_readiness_score recomputed"

  - entity: DeficiencyFinding
    initial_state: DRAFT
    terminal_states: [CLOSED, VOIDED]
    note: "CYCLIC: OPEN -> CORRECTION_SUBMITTED -> CORRECTION_REJECTED -> CORRECTION_SUBMITTED -> ... -> CLOSED."
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /poct/deficiencies"
        actor: Surveyor
        preconditions:
          - "inspection.status == IN_PROGRESS"
          - "parent_finding_id, when supplied, resolves to a DeficiencyFinding with the same site_id and status == CLOSED"
        side_effects:
          - "site_id copied from inspection.site_id; weight = 0; repeat_multiplier = 1.0"
      - from: DRAFT
        to: OPEN
        trigger: "POST /poct/inspections/{id}/issue"
        actor: Surveyor
        preconditions:
          - "status == DRAFT AND inspection.status == IN_PROGRESS"
        side_effects:
          - "issued_by_user_id recorded; weight and repeat_multiplier pinned per calculations.deficiency_weight"
          - "site.open_deficiency_weight += weight"
      - from: "OPEN | CORRECTION_REJECTED"
        to: CORRECTION_SUBMITTED
        trigger: "POST /poct/deficiencies/{id}/correction"
        actor: QualityCoordinator | LabDirector
        preconditions:
          - "status IN {OPEN, CORRECTION_REJECTED}"
          - "CROSS-ENTITY: inspection.status == DEFICIENCIES_ISSUED"
        side_effects:
          - "correction_narrative, evidence_ref recorded; correction_round += 1"
          - "site.open_deficiency_weight is UNCHANGED (CORRECTION_SUBMITTED still counts as open under the AS_OF_ACTUAL variant)"
      - from: CORRECTION_SUBMITTED
        to: CLOSED
        trigger: "POST /poct/deficiencies/{id}/correction-decision (decision == ACCEPT)"
        actor: Surveyor
        preconditions:
          - "status == CORRECTION_SUBMITTED"
          - "SEGREGATION: X-User-ID != issued_by_user_id"
        side_effects:
          - "closed_by_user_id recorded; site.open_deficiency_weight -= weight"
          - "site.oversight_posture re-derived; site.inspection_readiness_score recomputed"
          - "BUBBLE-UP: when every finding of the inspection is now CLOSED or VOIDED, inspection.status -> CLOSED"
      - from: CORRECTION_SUBMITTED
        to: CORRECTION_REJECTED
        trigger: "POST /poct/deficiencies/{id}/correction-decision (decision == REJECT)"
        actor: Surveyor
        preconditions:
          - "status == CORRECTION_SUBMITTED"
          - "SEGREGATION: X-User-ID != issued_by_user_id"
        side_effects:
          - "site.open_deficiency_weight is UNCHANGED; the finding re-enters the correction loop"
      - from: "DRAFT | OPEN | CORRECTION_SUBMITTED | CORRECTION_REJECTED"
        to: VOIDED
        trigger: "POST /poct/inspections/{id}/rescind"
        actor: system
        preconditions:
          - "status IN {DRAFT, OPEN, CORRECTION_SUBMITTED, CORRECTION_REJECTED}"
        side_effects:
          - "site.open_deficiency_weight -= weight (0 for DRAFT findings)"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: assessment-create-stale-operator
    parent_entity: Operator
    write_endpoint: "POST /poct/competency-assessments"
    occ_field: "expected_operator_version"
    description: |
      Submitting a CompetencyAssessment against an Operator whose version has
      advanced since the client last read it is rejected. A new submission for
      the same (operator_id, device_model) legitimately supersedes an earlier
      SUBMITTED row (voiding it), so a second submission carrying the earlier
      observed version is not covered by any state precondition - the operator
      is still a perfectly valid assessment subject. The stale version is the
      only signal that the submitter's view of the operator's competency
      history is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: result-correct-stale-result
    parent_entity: TestResult
    write_endpoint: "POST /poct/test-results/{id}/correct"
    occ_field: "expected_test_result_version"
    description: |
      Correcting a TestResult whose version has advanced since the client last
      read it is rejected. A POSTED result may legitimately be corrected any
      number of times (each correction supersedes the previous posted value),
      so a second correction is not blocked by any state precondition; only the
      stale version reveals that the corrector is amending a value that has
      already been superseded.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: site_inspection_readiness_score
    trigger: "recomputed on POST /poct/inspections/{id}/issue, POST /poct/inspections/{id}/rescind, POST /poct/deficiencies/{id}/correction-decision, POST /poct/qc-runs, POST /poct/test-results, POST /poct/devices, POST /poct/devices/{id}/retire, POST /poct/operators, POST /poct/operators/{id}/training, POST /poct/operators/{id}/access-reinstatement, POST /poct/competency-assessments/{id}/decision, POST /poct/pt-events/{id}/score, POST /poct/pt-events/{id}/investigation-decision, POST /poct/certificates/{id}/suspend, POST /poct/oversight-runs; and re-evaluated on read of GET /poct/sites/{id} and GET /poct/sites/{id}/readiness against the current logical clock"
    algorithm: weighted_scoring
    formula: |
      # MODE (a) combinatorial: four inputs, nested min(), and a branch on
      # TestSite.complexity_scope. Evaluated top to bottom; no re-entry.
      deficiency_penalty  = min(50.0, round(W * 2.5, 2))
      competency_gap_pct  = 100.0 * lapsed_or_locked_operator_count / max(1, total_operator_count)
      competency_penalty  = min(25.0, round(competency_gap_pct * 0.25, 2))
      qc_penalty          = min(20.0, round((100.0 - site_qc_compliance_index) * 0.40, 2))
      pt_unit             = 6 if TestSite.complexity_scope == "MODERATE" else 3
      pt_penalty          = min(18.0, P * pt_unit)
      raw                 = 100.0 - deficiency_penalty - competency_penalty - qc_penalty - pt_penalty
      score               = max(0.0, round(raw, 2))
      # W and P are variant-dependent (see `variants` below).
    input_set: |
      lapsed_or_locked_operator_count = COUNT(Operator WHERE site_id == site.id
        AND (competency_status == 'LAPSED' OR access_status == 'LOCKED_OUT'));
      total_operator_count = COUNT(Operator WHERE site_id == site.id
        AND access_status != 'DEACTIVATED');
      site_qc_compliance_index from calculations.site_qc_compliance_index.
      Order-insensitive: every term is a sum or count, so no tie-break is
      required. When total_operator_count == 0 the max(1, ...) guard yields
      competency_penalty 0.00; when the site has no non-RETIRED Device the
      index is 100.00 and qc_penalty is 0.00.
    constants:
      DEFICIENCY_WEIGHT_MULTIPLIER: 2.5
      DEFICIENCY_PENALTY_CAP: 50.0
      COMPETENCY_GAP_MULTIPLIER: 0.25
      COMPETENCY_PENALTY_CAP: 25.0
      QC_GAP_MULTIPLIER: 0.40
      QC_PENALTY_CAP: 20.0
      PT_UNIT_WAIVED: 3
      PT_UNIT_MODERATE: 6
      PT_PENALTY_CAP: 18.0
    precision: "2 decimal places, round_half_up; penalties rounded before the caps are applied"
    variants:
      - name: AS_OF_ACTUAL
        when: "default; used for the persisted TestSite.inspection_readiness_score and when GET /poct/sites/{id}/readiness omits `basis` or passes basis=AS_OF_ACTUAL"
        difference: |
          W = SUM(DeficiencyFinding.weight WHERE site_id == site.id AND status IN
              {OPEN, CORRECTION_SUBMITTED, CORRECTION_REJECTED});
          P = COUNT(ProficiencyEvent e WHERE e.enrollment_id in the site's
              enrollments AND e.outcome == 'FAIL' AND e.status != 'INVESTIGATION_ACCEPTED').
      - name: PRE_SURVEY_PROJECTED
        when: "GET /poct/sites/{id}/readiness?basis=PRE_SURVEY_PROJECTED"
        difference: |
          Forward-looking: credit is given for remediation already in flight.
          W excludes every finding whose status == 'CORRECTION_SUBMITTED' AND
          whose correction_due_date >= date(logical clock now) (assumed to be
          accepted on time); all other statuses count exactly as in AS_OF_ACTUAL.
          P additionally excludes events whose status == 'INVESTIGATION_SUBMITTED'.
          Identical stored data therefore yields a strictly higher score whenever
          any such finding or event exists.

  - name: device_qc_compliance_rate
    trigger: "recomputed on POST /poct/qc-runs, POST /poct/test-results, POST /poct/devices/{id}/qc-unlock, POST /poct/oversight-runs; and re-evaluated on read of GET /poct/devices/{id} and GET /poct/devices against the current logical clock"
    algorithm: aggregation
    formula: |
      window_start = max(date(device.created_at), date(now) - 30 days)
      window_end   = date(now)                      # both endpoints INCLUSIVE
      covered_days = { d in [window_start, window_end] :
                       EXISTS QcRun q1 with q1.device_id == device.id
                            and date(q1.performed_at) == d
                            and q1.control_level == 'LEVEL_1' and q1.result == 'PASS'
                       AND EXISTS QcRun q2 with q2.device_id == device.id
                            and date(q2.performed_at) == d
                            and q2.control_level == 'LEVEL_2' and q2.result == 'PASS' }
      numerator    = |covered_days|
      rate         = 100.00 if denominator == 0 else round(100.0 * numerator / denominator, 2)
    input_set: |
      QcRun rows are never deleted, so the candidate set is every QcRun of the
      device with date(performed_at) inside the inclusive window. TestResult
      rows in ANY posting_status (including HELD and REJECTED) count as usage.
      The denominator is variant-dependent (see `variants`).
    constants:
      WINDOW_DAYS: 30
    precision: "2 decimal places, round_half_up"
    variants:
      - name: CALENDAR_DAY_BASIS
        when: "persisted to Device.qc_compliance_rate_calendar; the regulator-facing figure"
        difference: "denominator = count of calendar days in [window_start, window_end] inclusive of both endpoints, whether or not the device was used."
      - name: DAY_OF_USE_BASIS
        when: "persisted to Device.qc_compliance_rate_day_of_use; the figure fed into calculations.site_qc_compliance_index"
        difference: |
          denominator = |{ d in [window_start, window_end] : EXISTS TestResult r
          with r.device_id == device.id and date(r.created_at) == d }|
          (distinct days of use). Identical QcRun/TestResult data yields a
          different rate from CALENDAR_DAY_BASIS whenever the device was idle
          on at least one calendar day of the window.

  - name: site_qc_compliance_index
    trigger: "recomputed wherever calculations.device_qc_compliance_rate is recomputed, plus POST /poct/devices/{id}/retire; re-evaluated on read of GET /poct/sites/{id} and GET /poct/sites/{id}/readiness"
    algorithm: aggregation
    formula: |
      # MODE (b) nested rounding: the ORDER of the two rounding steps changes
      # the cents. The pinned order is step 1 then step 2 - never the reverse.
      eligible = [ d for d in Device
                   where d.site_id == site.id and d.status != 'RETIRED' ]
      if len(eligible) == 0: index = 100.00
      else:
        # STEP 1 - round EACH device's 2-decimal day-of-use rate to a WHOLE percent
        r = [ round_half_up(d.qc_compliance_rate_day_of_use, 0) for d in eligible ]
        # STEP 2 - average the whole-percent values, then round to 2 decimals
        index = round_half_up(sum(r) / len(eligible), 2)
      # FORBIDDEN alternative order (averaging the unrounded 2-decimal rates and
      # rounding once at the end) is explicitly NOT the contract:
      #   index_wrong = round_half_up(sum(d.qc_compliance_rate_day_of_use) / n, 2)
      # Worked divergence: rates [33.33, 50.00] -> pinned 41.50, forbidden 41.67.
    input_set: |
      Devices with status IN {ACTIVE, QC_LOCKED}; status == RETIRED excluded.
      Enumerated created_at ASC then serial_number ASC; the sum is
      order-independent so the enumeration order cannot change `index`.
    constants:
      DEVICE_ROUND_DECIMALS: 0
      INDEX_ROUND_DECIMALS: 2
    precision: "step 1: 0 decimals round_half_up; step 2: 2 decimals round_half_up"

  - name: operator_access_grace_and_lockout
    trigger: "POST /poct/oversight-runs"
    algorithm: constraint_propagation
    formula: |
      # MODE (c) circular-looking dependency, resolved by a pinned phase order.
      # grace depends on site posture; site posture depends on how many
      # operators are locked out; lock-out depends on grace. The run pins the
      # posture SNAPSHOT taken BEFORE any lock-out is applied, evaluates every
      # operator against that frozen snapshot, and only then re-derives posture.
      # There is exactly one pass; no fixed-point iteration.
      #
      # PHASE 0 - SNAPSHOT
      for each TestSite s:  P0[s] = s.oversight_posture  as persisted at the
                                    start of this oversight run
      # PHASE 1 - GRACE (uses P0 only; NEVER a posture recomputed in this run)
      for each Operator o (enumerated created_at ASC, then hire_date ASC, then
                           full_name ASC - order does not affect any result):
        base_grace_days      = 30 if o.role_title == 'PHYSICIAN' else 14
        posture_penalty_days = 0  if P0[o.site_id] == 'OPEN'
                               else 7  if P0[o.site_id] == 'RESTRICTED'
                               else 14           # P0 == 'SUSPENDED'
        o.current_grace_days = max(0, base_grace_days - posture_penalty_days)
        o.lapse_deadline     = o.competency_expires_at + o.current_grace_days days
                               (null when o.competency_expires_at is null)
      # PHASE 2 - APPLY
      for each Operator o with o.competency_status == 'COMPETENT'
                           and o.lapse_deadline is not null
                           and date(now) > o.lapse_deadline:
        o.competency_status = 'LAPSED'; o.access_status = 'LOCKED_OUT'
        o.lockout_reason    = 'COMPETENCY_LAPSED'
      # PHASE 3 - RECOMPUTE (post-phase-2 state)
      for each TestSite s: recompute locked_out_operator_count,
        lapsed_or_locked_operator_count, oversight_posture,
        site_qc_compliance_index, inspection_readiness_score
    input_set: |
      Operators with access_status != 'DEACTIVATED' and competency_status ==
      'COMPETENT' are candidates for phase 2. Operators whose
      competency_expires_at is null are skipped. Phase 1 assigns
      current_grace_days and lapse_deadline to EVERY non-DEACTIVATED operator,
      including those phase 2 does not lock out, so the frozen values are
      observable on GET /poct/operators/{id}.
    constants:
      BASE_GRACE_DAYS_PHYSICIAN: 30
      BASE_GRACE_DAYS_OTHER: 14
      POSTURE_PENALTY_OPEN: 0
      POSTURE_PENALTY_RESTRICTED: 7
      POSTURE_PENALTY_SUSPENDED: 14
    precision: "whole days; dates compared as YYYY-MM-DD in UTC"

  - name: deficiency_weight
    trigger: "POST /poct/inspections/{id}/issue (weight and repeat_multiplier are pinned once, at issuance, and never recomputed afterwards)"
    algorithm: chronological
    formula: |
      SEVERITY_BASE = { 'CONDITION_LEVEL': 8.0, 'STANDARD_LEVEL': 3.0, 'ADVISORY': 1.0 }
      # Findings of the issuing inspection are processed created_at ASC, then
      # category ASC (category is unique-per-finding-per-inspection by
      # construction in every scaffold recipe), so the multiplier is stable.
      repeat_multiplier =
        2.0 if EXISTS DeficiencyFinding f2 with
                 f2.site_id == f.site_id
             AND f2.category == f.category
             AND f2.created_at < f.created_at        # STRICTLY earlier
             AND f2.status == 'CLOSED'
        else 1.0
      weight = round_half_up(SEVERITY_BASE[f.severity] * repeat_multiplier, 2)
    input_set: |
      Candidate set for the repeat lookup: DeficiencyFinding rows at the SAME
      site with the SAME category, created_at STRICTLY before the finding being
      weighted, and status == 'CLOSED' at the instant of issuance. VOIDED,
      OPEN, CORRECTION_SUBMITTED, CORRECTION_REJECTED and DRAFT prior findings
      do NOT trigger the repeat multiplier.
    constants:
      SEVERITY_BASE_CONDITION_LEVEL: 8.0
      SEVERITY_BASE_STANDARD_LEVEL: 3.0
      SEVERITY_BASE_ADVISORY: 1.0
      REPEAT_MULTIPLIER: 2.0
    precision: "2 decimal places, round_half_up"

  - name: site_oversight_posture
    trigger: "re-derived by every transition listed in state_machines.TestSite; re-evaluated on read of GET /poct/sites/{id} and GET /poct/sites/{id}/readiness"
    algorithm: threshold
    formula: |
      has_active_coverage = EXISTS CertificateCoverage c with
          c.site_id == site.id
          AND c.coverage_start <= date(now) <= c.coverage_end     # both inclusive
          AND c.certificate.status == 'ACTIVE'
      if (not has_active_coverage) or site.open_deficiency_weight >= 16.0:
          posture = 'SUSPENDED'
      elif site.open_deficiency_weight >= 6.0
           or site.held_result_count >= 3
           or (site.locked_out_operator_count * 2) > site.total_operator_count:
          posture = 'RESTRICTED'
      else:
          posture = 'OPEN'
      site.manual_entry_blocked = (posture != 'OPEN')
    input_set: "open_deficiency_weight, held_result_count, locked_out_operator_count and total_operator_count as defined on TestSite in 1.1; all thresholds are inclusive `>=` except the strict-majority test which is a strict `>`"
    constants:
      SUSPEND_WEIGHT_THRESHOLD: 16.0
      RESTRICT_WEIGHT_THRESHOLD: 6.0
      RESTRICT_HELD_RESULT_THRESHOLD: 3
    precision: "weights compared at 2 decimals; counts are integers"

  - name: qc_run_result
    trigger: "POST /poct/qc-runs"
    algorithm: threshold
    formula: |
      expected_min = lot.control_min_level_1 if control_level == 'LEVEL_1' else lot.control_min_level_2
      expected_max = lot.control_max_level_1 if control_level == 'LEVEL_1' else lot.control_max_level_2
      # BOTH bounds are INCLUSIVE: a value exactly equal to either bound PASSES.
      result = 'PASS' if (expected_min <= measured_value <= expected_max) else 'FAIL'
    input_set: "the single submitted run; bounds snapshotted from the referenced ReagentLot at submission time"
    constants: {}
    precision: "values compared as supplied, to 2 decimals"

  - name: temperature_disposition
    trigger: "POST /poct/storage-units/{id}/temperature-readings"
    algorithm: threshold
    formula: |
      # BOTH bounds are INCLUSIVE: reading_c exactly at min_temp_c or
      # max_temp_c is IN_RANGE.
      disposition = 'IN_RANGE' if (unit.min_temp_c <= reading_c <= unit.max_temp_c) else 'OUT_OF_RANGE'
    input_set: "the single submitted reading against the unit's persisted bounds"
    constants: {}
    precision: "1 decimal place Celsius, compared exactly"

  - name: pt_event_outcome
    trigger: "POST /poct/pt-events/{id}/score"
    algorithm: chronological
    formula: |
      outcome = 'PASS' if score_pct >= 80.00 else 'FAIL'
      # Chronological window: the three most recently graded events of this
      # enrollment INCLUDING the one just graded, ordered
      #   graded_on ASC, then created_at ASC, then shipment_number ASC
      # and taking the LAST three of that ordering.
      last_three = last 3 of sorted([e for e in ProficiencyEvent
                                     if e.enrollment_id == this.enrollment_id
                                     and e.outcome is not null],
                                    key=(graded_on, created_at, shipment_number))
      enrollment.fail_count_last_three = COUNT(e in last_three where e.outcome == 'FAIL')
      if outcome == 'PASS':                      status = 'PASSED'
      elif enrollment.fail_count_last_three >= 2: status = 'UNSUCCESSFUL_LOCKED'
      else:                                       status = 'INVESTIGATION_OPEN'
    input_set: |
      Only ProficiencyEvent rows of the SAME enrollment with outcome IS NOT
      NULL enter the window; PENDING events are excluded. The event being
      graded is inserted into the ordering before the window is taken, so a
      second FAIL among the last three (i.e. two-of-three) trips the
      UNSUCCESSFUL_LOCKED branch.
    constants:
      PT_PASS_THRESHOLD_PCT: 80.00
      UNSUCCESSFUL_FAIL_COUNT: 2
      WINDOW_EVENTS: 3
    precision: "score_pct at 2 decimals; the threshold is INCLUSIVE (80.00 PASSES)"

  - name: certificate_coverage_overlap
    trigger: "POST /poct/certificate-coverages"
    algorithm: interval_merge
    formula: |
      # CLOSED-CLOSED date interval geometry on the TestSite resource.
      # Touching endpoints COLLIDE: an existing window ending 2027-12-31 and a
      # new window starting 2027-12-31 overlap on that single day.
      collides = EXISTS CertificateCoverage c with
          c.site_id == new.site_id
          AND c.certificate.status IN {'ACTIVE', 'SUSPENDED'}   # EXPIRED ignored
          AND new.coverage_start <= c.coverage_end
          AND c.coverage_start   <= new.coverage_end
      -> ERR_COVERAGE_WINDOW_OVERLAP (409) when collides
    input_set: "existing CertificateCoverage rows for the same site whose certificate.status IN {ACTIVE, SUSPENDED}; rows whose certificate has status == EXPIRED are excluded from the candidate set so a lapsed certificate never blocks a replacement window"
    constants:
      BUFFER_DAYS: 0
      MAX_CONCURRENT_COVERAGES_PER_SITE: 1
    precision: "dates compared as YYYY-MM-DD in UTC"

  - name: competency_window_overlap
    trigger: "POST /poct/competency-assessments"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN [effective_date, expires_at) geometry on the Operator
      # resource - deliberately DIFFERENT arithmetic from
      # calculations.certificate_coverage_overlap. Touching endpoints do NOT
      # collide: an existing window expiring 2027-03-14 and a new window
      # effective 2027-03-14 are adjacent and BOTH allowed.
      collides = EXISTS CompetencyAssessment a with
          a.operator_id == new.operator_id
          AND a.device_model == new.device_model
          AND a.status == 'APPROVED'                 # SUBMITTED rows never block
          AND new.effective_date < a.expires_at
          AND a.effective_date   < new.expires_at
      -> ERR_ASSESSMENT_WINDOW_OVERLAP (409) when collides
    input_set: "existing CompetencyAssessment rows for the same (operator_id, device_model) whose status == 'APPROVED'; rows with status IN {SUBMITTED, REJECTED, VOIDED} are excluded, so a pending submission never blocks another"
    constants:
      BUFFER_DAYS: 0
      MAX_CONCURRENT_APPROVED_PER_OPERATOR_MODEL: 1
    precision: "dates compared as YYYY-MM-DD in UTC"

  - name: held_result_conservation
    trigger: "asserted after POST /poct/qc-runs (device lock) and its compensating POST /poct/devices/{id}/qc-unlock"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 1 - held patient results.
      TestSite.held_result_count
        == COUNT(TestResult r WHERE r.device_id IN
                 (SELECT id FROM Device WHERE site_id == site.id)
                 AND r.posting_status == 'HELD')
      # Invariant across the forward/compensating pair:
      #   held_result_count(after qc-unlock) == held_result_count(before the
      #                                          failing qc-run)
      #   AND oversight_posture(after qc-unlock)
      #       == oversight_posture(before the failing qc-run)
      #   whenever no other transition ran in between. Zero drift is required:
      #   every result held by held_by_device_lock_at IS NOT NULL is released,
      #   and no result held for any other reason is released.
    input_set: "TestResult rows of every Device at the site, filtered to posting_status == 'HELD'; results moved to REJECTED by a lot cascade are NOT released by qc-unlock and keep the identity honest"
    constants: {}
    precision: "integer count; exact equality required"

  - name: deficiency_weight_conservation
    trigger: "asserted after POST /poct/inspections/{id}/issue and its compensating POST /poct/inspections/{id}/rescind"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 2 - open deficiency weight ledger (a real number,
      # not a count).
      TestSite.open_deficiency_weight
        == SUM(DeficiencyFinding.weight WHERE site_id == site.id
               AND status IN {'OPEN', 'CORRECTION_SUBMITTED', 'CORRECTION_REJECTED'})
      # Invariant across the forward/compensating pair:
      #   open_deficiency_weight(after rescind)
      #     == open_deficiency_weight(before issue)
      #   AND Inspection.issued_weight_total is unchanged by the rescind
      #       (it is the audit record of what was issued)
      #   AND oversight_posture(after rescind) == oversight_posture(before issue).
    input_set: "DeficiencyFinding rows of the site filtered to the three open statuses; CLOSED and VOIDED findings contribute 0.00, and DRAFT findings carry weight 0.00 by construction"
    constants: {}
    precision: "2 decimal places; exact equality required"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in 1.5; for entity_backed roles the X-User-ID resolves to an Operator row"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 10
    category: existence
    check: "site_id in path or body resolves to a TestSite"
    error_id: ERR_SITE_NOT_FOUND
    http_status: 404
    applies_to: "GET /poct/sites/{id}, GET /poct/sites/{id}/readiness, PATCH /poct/sites/{id}/director, POST /poct/certificate-coverages, POST /poct/operators, POST /poct/devices, POST /poct/storage-units, POST /poct/reagent-lots, POST /poct/pt-enrollments, POST /poct/inspections, and the sub-resource GETs under /poct/sites/{id}"

  - priority: 11
    category: existence
    check: "operator_id / assessor_operator_id / lab_director_operator_id resolves to an Operator"
    error_id: ERR_OPERATOR_NOT_FOUND
    http_status: 404
    applies_to: "GET /poct/operators/{id}, PATCH /poct/sites/{id}/director, POST /poct/operators/{id}/training, POST /poct/operators/{id}/access-reinstatement, POST /poct/competency-assessments, POST /poct/qc-runs, POST /poct/test-results"

  - priority: 12
    category: existence
    check: "device_id resolves to a Device"
    error_id: ERR_DEVICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /poct/devices/{id}, POST /poct/devices/{id}/qc-unlock, POST /poct/devices/{id}/retire, POST /poct/qc-runs, POST /poct/test-results"

  - priority: 13
    category: existence
    check: "reagent_lot_id resolves to a ReagentLot"
    error_id: ERR_REAGENT_LOT_NOT_FOUND
    http_status: 404
    applies_to: "GET /poct/reagent-lots/{id}, POST /poct/reagent-lots/{id}/verify, POST /poct/qc-runs, POST /poct/test-results"

  - priority: 14
    category: existence
    check: "every other referenced resource (CliaCertificate, CertificateCoverage, CompetencyAssessment, StorageUnit, QcRun, TestResult, ProficiencyEnrollment, ProficiencyEvent, Inspection, DeficiencyFinding) resolves, validated left-to-right in the path then body order"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 20
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: required fields present, enums in range, integers within declared bounds, dates well-formed YYYY-MM-DD, and every uniqueness constraint in 1.1 respected (certificate_number, department_code, serial_number, (site_id, device_model, lot_number), (enrollment_id, shipment_number))"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 21
    category: business_constraint
    check: "entry_mode == MANUAL requires a non-empty manual_entry_reason"
    error_id: ERR_MANUAL_ENTRY_REASON_REQUIRED
    http_status: 400
    applies_to: "POST /poct/test-results"

  - priority: 30
    category: state
    check: "expected_operator_version / expected_test_result_version equals the parent's current version (see concurrency_rules)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /poct/competency-assessments, POST /poct/test-results/{id}/correct"

  - priority: 40
    category: state
    check: "the referenced CliaCertificate has status == ACTIVE"
    error_id: ERR_CERTIFICATE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /poct/certificates/{id}/suspend, POST /poct/certificate-coverages"

  - priority: 41
    category: state
    check: "the Device has status == ACTIVE"
    error_id: ERR_DEVICE_QC_LOCKED
    http_status: 409
    applies_to: "POST /poct/test-results, POST /poct/test-results/{id}/post, POST /poct/test-results/{id}/correct"

  - priority: 42
    category: state
    check: "the TestSite has oversight_posture != SUSPENDED"
    error_id: ERR_SITE_OVERSIGHT_SUSPENDED
    http_status: 409
    applies_to: "POST /poct/operators/{id}/access-reinstatement, POST /poct/reagent-lots/{id}/verify"

  - priority: 43
    category: state
    check: "the referenced ReagentLot has verification_status not in {QUARANTINED, DISCARDED, REJECTED}"
    error_id: ERR_LOT_QUARANTINED
    http_status: 409
    applies_to: "POST /poct/qc-runs, POST /poct/test-results, POST /poct/reagent-lots/{id}/verify"

  - priority: 44
    category: state
    check: "the referenced ReagentLot has verification_status == VERIFIED (for qc-unlock: the lot referenced by the confirming QcRun)"
    error_id: ERR_LOT_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /poct/test-results, POST /poct/devices/{id}/qc-unlock"

  - priority: 45
    category: state
    check: "the ProficiencyEvent has status == PENDING (outcome still null)"
    error_id: ERR_PT_EVENT_ALREADY_GRADED
    http_status: 409
    applies_to: "POST /poct/pt-events/{id}/score"

  - priority: 46
    category: state
    check: "the ProficiencyEnrollment has status == ENROLLED"
    error_id: ERR_PT_ENROLLMENT_STATUS_INVALID
    http_status: 409
    applies_to: "POST /poct/pt-events"

  - priority: 47
    category: state
    check: "the DeficiencyFinding has status IN {OPEN, CORRECTION_REJECTED} for a correction submission, or status == CORRECTION_SUBMITTED for a correction decision"
    error_id: ERR_DEFICIENCY_NOT_CORRECTABLE
    http_status: 409
    applies_to: "POST /poct/deficiencies/{id}/correction, POST /poct/deficiencies/{id}/correction-decision"

  - priority: 48
    category: state
    check: "the Inspection has status == IN_PROGRESS when adding or issuing findings, or status == DEFICIENCIES_ISSUED when a correction is submitted against one of its findings"
    error_id: ERR_INSPECTION_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /poct/deficiencies, POST /poct/inspections/{id}/issue, POST /poct/inspections/{id}/rescind, POST /poct/deficiencies/{id}/correction"

  - priority: 49
    category: state
    check: "the CompetencyAssessment has status == SUBMITTED"
    error_id: ERR_ASSESSMENT_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /poct/competency-assessments/{id}/decision"

  - priority: 50
    category: state
    check: "every other state precondition declared in 1.2 for the triggered transition holds (StorageUnit excursion_state, Device RETIRED lockdown and qc_lock_reason == CERTIFICATE_SCOPE on qc-unlock, TestResult posting_status, ReagentLot verification_status, CliaCertificate/Inspection/DeficiencyFinding/ProficiencyEvent statuses not already carved out above). Operator access_status and competency_status are NOT checked here - priorities 52 and 53 own those two dimensions."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all

  - priority: 52
    category: business_safety
    check: "the referenced Operator (and, for posting, the acting operator) has access_status == ACTIVE"
    error_id: ERR_OPERATOR_ACCESS_LOCKED
    http_status: 422
    applies_to: "POST /poct/qc-runs, POST /poct/test-results, POST /poct/test-results/{id}/post, POST /poct/test-results/{id}/correct"

  - priority: 53
    category: business_safety
    check: "the referenced Operator has competency_status IN {PROVISIONAL, COMPETENT}; on POST /poct/competency-assessments the referenced Operator is the ASSESSOR (assessor_operator_id), whose competency must be current for the attestation to count - priority 52 deliberately does NOT cover that endpoint, so a LAPSED assessor surfaces here rather than as an access error"
    error_id: ERR_OPERATOR_COMPETENCY_LAPSED
    http_status: 422
    applies_to: "POST /poct/qc-runs, POST /poct/test-results, POST /poct/test-results/{id}/post, POST /poct/test-results/{id}/correct, POST /poct/competency-assessments (assessor_operator_id only)"

  - priority: 54
    category: business_safety
    check: "date(logical clock now) <= reagent lot expiration_date"
    error_id: ERR_REAGENT_LOT_EXPIRED
    http_status: 422
    applies_to: "POST /poct/reagent-lots, POST /poct/qc-runs, POST /poct/test-results, POST /poct/reagent-lots/{id}/verify"

  - priority: 55
    category: business_safety
    check: "date(logical clock now) <= device.qc_next_due_at"
    error_id: ERR_QC_OVERDUE
    http_status: 422
    applies_to: "POST /poct/test-results"

  - priority: 56
    category: business_safety
    check: "the target StorageUnit has excursion_state == IN_RANGE"
    error_id: ERR_TEMP_EXCURSION_ACTIVE
    http_status: 422
    applies_to: "POST /poct/reagent-lots"

  - priority: 57
    category: business_temporal
    check: "the site has a CertificateCoverage in window for date(now) whose certificate.status == ACTIVE and whose certificate.expiration_date >= date(now)"
    error_id: ERR_CERTIFICATE_EXPIRED
    http_status: 422
    applies_to: "POST /poct/devices"

  - priority: 58
    category: business_temporal
    check: "[coverage_start, coverage_end] sits entirely inside [certificate.effective_date, certificate.expiration_date]"
    error_id: ERR_COVERAGE_OUTSIDE_CERTIFICATE_WINDOW
    http_status: 422
    applies_to: "POST /poct/certificate-coverages"

  - priority: 59
    category: business_referential
    check: "reagent lot device_model equals the device's device_model (exact string equality)"
    error_id: ERR_LOT_DEVICE_MODEL_MISMATCH
    http_status: 422
    applies_to: "POST /poct/qc-runs, POST /poct/test-results"

  - priority: 60
    category: business_referential
    check: "all cross-referenced rows belong to the same TestSite: operator.site_id == device.site_id, lot.site_id == device.site_id, storage_unit.site_id == lot.site_id, assessor.site_id == subject.site_id, parent_finding.site_id == inspection.site_id"
    error_id: ERR_CROSS_SITE_REFERENCE
    http_status: 422
    applies_to: "POST /poct/qc-runs, POST /poct/test-results, POST /poct/reagent-lots, POST /poct/competency-assessments, POST /poct/deficiencies, PATCH /poct/sites/{id}/director"

  - priority: 61
    category: business_referential
    check: "referenced QcRun rows belong to the target device (qc-unlock) or the target lot with matching LEVEL_1/LEVEL_2 control levels on one device (verify)"
    error_id: ERR_QC_RUN_DEVICE_MISMATCH
    http_status: 422
    applies_to: "POST /poct/devices/{id}/qc-unlock, POST /poct/reagent-lots/{id}/verify"

  - priority: 62
    category: business_constraint
    check: "a Device with complexity_class == MODERATE requires the site's in-window coverage to have permitted_complexity_snapshot == MODERATE"
    error_id: ERR_COMPLEXITY_SCOPE_EXCEEDED
    http_status: 422
    applies_to: "POST /poct/devices"

  - priority: 63
    category: business_constraint
    check: "methods_demonstrated >= 6"
    error_id: ERR_INSUFFICIENT_COMPETENCY_METHODS
    http_status: 422
    applies_to: "POST /poct/competency-assessments"

  - priority: 64
    category: business_constraint
    check: "the nominated director has role_title IN {PHYSICIAN, DOCTORAL_SCIENTIST, MIDLEVEL_PRACTITIONER} and competency_status IN {PROVISIONAL, COMPETENT}"
    error_id: ERR_DIRECTOR_NOT_QUALIFIED
    http_status: 422
    applies_to: "PATCH /poct/sites/{id}/director"

  - priority: 65
    category: business_constraint
    check: "segregation of duties: (a) competency decision by X-User-Role == LabDirector requires X-User-ID == site.lab_director_operator_id AND X-User-ID != assessor_operator_id AND X-User-ID != operator_id; (b) assessor_operator_id != operator_id on submission; (c) correction-decision requires X-User-ID != finding.issued_by_user_id; (d) posting a TestResult with entry_mode == MANUAL requires X-User-ID != result.operator_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /poct/competency-assessments, POST /poct/competency-assessments/{id}/decision, POST /poct/deficiencies/{id}/correction-decision, POST /poct/test-results/{id}/post"

  - priority: 66
    category: business_constraint
    check: "entry_mode == MANUAL requires site.manual_entry_blocked == false AND device.manual_entry_suspended == false"
    error_id: ERR_MANUAL_ENTRY_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /poct/test-results"

  - priority: 67
    category: business_constraint
    check: "calculations.certificate_coverage_overlap reports no collision (closed-closed dates; touching endpoints collide)"
    error_id: ERR_COVERAGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /poct/certificate-coverages"

  - priority: 68
    category: business_constraint
    check: "calculations.competency_window_overlap reports no collision (half-open [effective_date, expires_at); touching endpoints allowed)"
    error_id: ERR_ASSESSMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /poct/competency-assessments"

  - priority: 69
    category: business_constraint
    check: "no other ProficiencyEnrollment exists with the same (site_id, analyte, program_year)"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /poct/pt-enrollments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # LIST-ORDERING CONTRACT: no GET collection endpoint declares a sort order;
  # `limit`/`offset` slice a stable-but-unspecified order. Tests therefore assert
  # `meta.total_count`, `meta.has_more`, the size of `data` and set membership
  # across pages - never the position of a particular row inside `data`.

  # ---- certificates -------------------------------------------------------
  - method: POST
    path: "/poct/certificates"
    description: "Register a CLIA certificate held by the health system."
    roles: [ProgramAdmin]
    code: 201
    input: [certificate_number, certificate_type, permitted_complexity, effective_date, expiration_date]
    output: CliaCertificate
    side_effects: ["status = ACTIVE; covered_site_count = 0"]

  - method: GET
    path: "/poct/certificates/{id}"
    description: "Read one CLIA certificate."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: []
    output: CliaCertificate
    side_effects: []

  - method: POST
    path: "/poct/certificates/{id}/suspend"
    description: "Suspend a certificate; drives CASCADE-B across sites, operators, submitted assessments and devices."
    roles: [ProgramAdmin]
    code: 200
    input: [reason]
    output: CliaCertificate
    side_effects:
      - "status -> SUSPENDED; increments CliaCertificate.version by 1"
      - "CASCADE-B links 1-4 per state_machines.CliaCertificate"

  # ---- sites --------------------------------------------------------------
  - method: POST
    path: "/poct/sites"
    description: "Create a point-of-care testing site."
    roles: [ProgramAdmin]
    code: 201
    input: [name, department_code, complexity_scope]
    output: TestSite
    side_effects: ["oversight_posture = OPEN; all counters 0; site_qc_compliance_index = 100.00; inspection_readiness_score = 100.00"]

  - method: GET
    path: "/poct/sites/{id}"
    description: "Read one site with all derived counters, posture and scores re-evaluated against the current logical clock."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: []
    output: TestSite
    side_effects: ["re-evaluates calculations.site_oversight_posture, calculations.site_qc_compliance_index and calculations.site_inspection_readiness_score (AS_OF_ACTUAL)"]

  - method: GET
    path: "/poct/sites"
    description: "List sites; filterable by director and posture."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: ["lab_director_operator_id?", "oversight_posture?", "limit?", "offset?"]
    output: TestSite[]
    side_effects: []

  - method: PATCH
    path: "/poct/sites/{id}/director"
    description: "Assign or replace the site's CLIA laboratory director of record."
    roles: [ProgramAdmin]
    code: 200
    input: [lab_director_operator_id]
    output: TestSite
    side_effects: ["lab_director_operator_id set; increments TestSite.version by 1"]

  - method: GET
    path: "/poct/sites/{id}/readiness"
    description: "Computed inspection-readiness breakdown for a site under the requested variant of calculations.site_inspection_readiness_score. `basis` defaults to AS_OF_ACTUAL."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: ["basis?"]
    output: "{ basis: string, score: number, deficiency_penalty: number, competency_penalty: number, qc_penalty: number, pt_penalty: number, open_deficiency_weight: number, pt_unsuccessful_count: integer, site_qc_compliance_index: number, computed_at: string }"
    side_effects: ["persists the AS_OF_ACTUAL score to TestSite.inspection_readiness_score regardless of the requested basis"]

  - method: GET
    path: "/poct/sites/{id}/operators"
    description: "Operators assigned to a site (FK reverse-reachability for Operator.site_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: ["limit?", "offset?"]
    output: Operator[]
    side_effects: []

  - method: GET
    path: "/poct/sites/{id}/devices"
    description: "Devices installed at a site (FK reverse-reachability for Device.site_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: ["limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: GET
    path: "/poct/sites/{id}/storage-units"
    description: "Storage units at a site (FK reverse-reachability for StorageUnit.site_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: ["limit?", "offset?"]
    output: StorageUnit[]
    side_effects: []

  - method: GET
    path: "/poct/sites/{id}/inspections"
    description: "Inspections of a site (FK reverse-reachability for Inspection.site_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: GET
    path: "/poct/sites/{id}/pt-enrollments"
    description: "Proficiency-testing enrollments of a site (FK reverse-reachability for ProficiencyEnrollment.site_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: ["limit?", "offset?"]
    output: ProficiencyEnrollment[]
    side_effects: []

  # ---- certificate coverage ----------------------------------------------
  - method: POST
    path: "/poct/certificate-coverages"
    description: "Attach a certificate to a site for a closed date window. Touching windows collide (calculations.certificate_coverage_overlap)."
    roles: [ProgramAdmin]
    code: 201
    input: [site_id, certificate_id, coverage_start, coverage_end]
    output: CertificateCoverage
    side_effects:
      - "permitted_complexity_snapshot copied from the certificate"
      - "certificate.covered_site_count += 1"
      - "site.oversight_posture re-derived; site.scope_creep_flag re-evaluated"

  - method: GET
    path: "/poct/certificate-coverages/{id}"
    description: "Read one certificate coverage row."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: []
    output: CertificateCoverage
    side_effects: []

  - method: GET
    path: "/poct/certificate-coverages"
    description: "List certificate coverage rows (FK reverse-reachability for site_id and certificate_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: ["site_id?", "certificate_id?", "limit?", "offset?"]
    output: CertificateCoverage[]
    side_effects: []

  # ---- operators ----------------------------------------------------------
  - method: POST
    path: "/poct/operators"
    description: "Add a testing operator to a site. Starts PENDING x LOCKED_OUT (lockout_reason NEVER_TRAINED)."
    roles: [ProgramAdmin]
    code: 201
    input: [site_id, full_name, role_title, hire_date]
    output: Operator
    side_effects: ["site.total_operator_count, locked_out_operator_count, lapsed_or_locked_operator_count and inspection_readiness_score recomputed"]

  - method: GET
    path: "/poct/operators/{id}"
    description: "Read one operator, including both parallel status dimensions and the frozen grace values from the last oversight run."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: []
    output: Operator
    side_effects: []

  - method: GET
    path: "/poct/operators"
    description: "List operators (FK reverse-reachability for Operator.site_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: ["site_id?", "competency_status?", "access_status?", "limit?", "offset?"]
    output: Operator[]
    side_effects: []

  - method: POST
    path: "/poct/operators/{id}/training"
    description: "Record completion of the site's point-of-care training module; moves competency PENDING -> PROVISIONAL and access LOCKED_OUT -> ACTIVE."
    roles: [ProgramAdmin, QualityCoordinator]
    code: 200
    input: [training_module_code, completed_on]
    output: Operator
    side_effects: ["training_completed_at = now; lockout_reason = null; increments Operator.version by 1; site counters and posture re-derived"]

  - method: POST
    path: "/poct/operators/{id}/access-reinstatement"
    description: "Restore instrument access to a locked-out operator. Gated on the site's oversight_posture."
    roles: [LabDirector, ProgramAdmin]
    code: 200
    input: [justification]
    output: Operator
    side_effects: ["access_status -> ACTIVE; lockout_reason = null; increments Operator.version by 1; site counters and posture re-derived"]

  # ---- competency ---------------------------------------------------------
  - method: POST
    path: "/poct/competency-assessments"
    description: "Submit a competency assessment for an operator on a device model. OCC-guarded on the operator's version; window overlap is half-open."
    roles: [QualityCoordinator, LabDirector]
    code: 201
    input: [operator_id, assessor_operator_id, device_model, assessment_type, methods_demonstrated, effective_date, expires_at, expected_operator_version]
    output: CompetencyAssessment
    side_effects:
      - "status = SUBMITTED"
      - "increments Operator.version by 1"
      - "any earlier SUBMITTED assessment for the same (operator_id, device_model) is set to VOIDED"

  - method: GET
    path: "/poct/competency-assessments/{id}"
    description: "Read one competency assessment."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: []
    output: CompetencyAssessment
    side_effects: []

  - method: GET
    path: "/poct/competency-assessments"
    description: "List competency assessments (FK reverse-reachability for operator_id and assessor_operator_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: ["operator_id?", "assessor_operator_id?", "status?", "limit?", "offset?"]
    output: CompetencyAssessment[]
    side_effects: []

  - method: POST
    path: "/poct/competency-assessments/{id}/decision"
    description: "Approve or reject a submitted competency assessment. A LabDirector actor must be the site's director and may be neither the assessor nor the subject."
    roles: [LabDirector, ProgramAdmin]
    code: 200
    input: ["decision", "note?"]
    output: CompetencyAssessment
    side_effects:
      - "APPROVE: operator.competency_status -> COMPETENT; operator.competency_expires_at recomputed; operator.consecutive_rejection_count = 0"
      - "REJECT: operator.consecutive_rejection_count += 1; on reaching 2 the operator becomes REVOKED x DEACTIVATED"
      - "site.lapsed_or_locked_operator_count, oversight_posture and inspection_readiness_score recomputed"

  # ---- devices ------------------------------------------------------------
  - method: POST
    path: "/poct/devices"
    description: "Install an instrument at a site. Rejects a MODERATE instrument under a WAIVED-only coverage."
    roles: [ProgramAdmin]
    code: 201
    input: [site_id, device_model, serial_number, analyte, complexity_class, connectivity_mode, qc_frequency_days]
    output: Device
    side_effects: ["status = ACTIVE; qc_next_due_at = date(created_at); site.site_qc_compliance_index and inspection_readiness_score recomputed"]

  - method: GET
    path: "/poct/devices/{id}"
    description: "Read one device with both QC compliance-rate variants re-evaluated against the current logical clock."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: []
    output: Device
    side_effects: ["re-evaluates calculations.device_qc_compliance_rate for both variants"]

  - method: GET
    path: "/poct/devices"
    description: "List devices."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: POST
    path: "/poct/devices/{id}/qc-unlock"
    description: "Clear a QC lock with a passing confirming control run and release every result held by that lock (compensating action for held_result_conservation)."
    roles: [QualityCoordinator, LabDirector]
    code: 200
    input: ["confirming_qc_run_id", "note?"]
    output: Device
    side_effects:
      - "status -> ACTIVE; qc_lock_reason = null; qc_next_due_at recomputed"
      - "every HELD TestResult with held_by_device_lock_at IS NOT NULL returns to PENDING_REVIEW; site.held_result_count decremented by that count"
      - "site.oversight_posture re-derived; MANUAL_ENTRY devices' manual_entry_suspended cleared when the posture returns to OPEN"

  - method: POST
    path: "/poct/devices/{id}/retire"
    description: "Retire an instrument; it leaves the site QC compliance index denominator."
    roles: [ProgramAdmin]
    code: 200
    input: [reason]
    output: Device
    side_effects: ["status -> RETIRED; site.site_qc_compliance_index and inspection_readiness_score recomputed excluding this device"]

  # ---- storage & temperature ---------------------------------------------
  - method: POST
    path: "/poct/storage-units"
    description: "Register a reagent storage unit with its acceptable temperature band."
    roles: [ProgramAdmin]
    code: 201
    input: [site_id, name, min_temp_c, max_temp_c]
    output: StorageUnit
    side_effects: ["excursion_state = IN_RANGE"]

  - method: GET
    path: "/poct/storage-units/{id}"
    description: "Read one storage unit."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: []
    output: StorageUnit
    side_effects: []

  - method: GET
    path: "/poct/storage-units"
    description: "List storage units."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: StorageUnit[]
    side_effects: []

  - method: POST
    path: "/poct/storage-units/{id}/temperature-readings"
    description: "Record a probe reading. An out-of-range reading opens an excursion and drives CASCADE-C (lots quarantined -> devices locked -> pending results rejected). Bounds are inclusive."
    roles: [Operator, QualityCoordinator, ProgramAdmin]
    code: 201
    input: [reading_c, recorded_at, recorded_by_user_id]
    output: TemperatureReading
    side_effects:
      - "disposition computed by calculations.temperature_disposition"
      - "on OUT_OF_RANGE from IN_RANGE: excursion_state -> EXCURSION_OPEN and CASCADE-C links 2-4 run"

  - method: GET
    path: "/poct/storage-units/{id}/temperature-readings"
    description: "Probe readings of a storage unit (FK reverse-reachability for TemperatureReading.storage_unit_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: ["limit?", "offset?"]
    output: TemperatureReading[]
    side_effects: []

  - method: POST
    path: "/poct/storage-units/{id}/excursion-resolution"
    description: "Close an open excursion and dispose of the quarantined lots (RELEASE back to VERIFIED, or DISCARD)."
    roles: [QualityCoordinator, LabDirector]
    code: 200
    input: [assessment_note, lot_disposition]
    output: StorageUnit
    side_effects:
      - "excursion_state -> IN_RANGE; excursion_opened_at = null; quarantined_lot_count = 0"
      - "each QUARANTINED lot -> VERIFIED (RELEASE, requires verified_at IS NOT NULL) or DISCARDED (DISCARD)"
      - "devices locked with qc_lock_reason == LOT_QUARANTINE remain QC_LOCKED"

  # ---- reagent lots -------------------------------------------------------
  - method: POST
    path: "/poct/reagent-lots"
    description: "Receive a reagent lot into a storage unit with its two control acceptance bands."
    roles: [ProgramAdmin, QualityCoordinator]
    code: 201
    input: [site_id, storage_unit_id, device_model, lot_number, expiration_date, received_at, control_min_level_1, control_max_level_1, control_min_level_2, control_max_level_2]
    output: ReagentLot
    side_effects: ["verification_status = UNVERIFIED"]

  - method: GET
    path: "/poct/reagent-lots/{id}"
    description: "Read one reagent lot."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: []
    output: ReagentLot
    side_effects: []

  - method: GET
    path: "/poct/reagent-lots"
    description: "List reagent lots (FK reverse-reachability for site_id and storage_unit_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: ["site_id?", "storage_unit_id?", "verification_status?", "limit?", "offset?"]
    output: ReagentLot[]
    side_effects: []

  - method: POST
    path: "/poct/reagent-lots/{id}/verify"
    description: "Verify a new lot against two passing control levels run on one device; a failing referenced run rejects the lot."
    roles: [QualityCoordinator, LabDirector]
    code: 200
    input: [level_1_qc_run_id, level_2_qc_run_id]
    output: ReagentLot
    side_effects: ["verification_status -> VERIFIED (both PASS) or REJECTED (any FAIL); verified_at set on VERIFIED; increments ReagentLot.version by 1"]

  # ---- quality control ----------------------------------------------------
  - method: POST
    path: "/poct/qc-runs"
    description: "Record a control run. An out-of-range value locks the instrument and drives CASCADE-A (results held -> posture RESTRICTED -> manual entry suspended). Acceptance bounds are inclusive."
    roles: [Operator, QualityCoordinator]
    code: 201
    input: ["device_id", "reagent_lot_id", "operator_id", "control_level", "measured_value", "performed_at?"]
    output: QcRun
    side_effects:
      - "expected_min/expected_max snapshotted; result computed by calculations.qc_run_result"
      - "PASS: device.last_two_level_qc_pass_on, qc_next_due_at and both compliance-rate variants recomputed; site index and readiness recomputed"
      - "FAIL on an ACTIVE device: CASCADE-A links 2-4"

  - method: GET
    path: "/poct/qc-runs/{id}"
    description: "Read one control run."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: []
    output: QcRun
    side_effects: []

  - method: GET
    path: "/poct/qc-runs"
    description: "List control runs (FK reverse-reachability for device_id, reagent_lot_id and operator_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: ["device_id?", "reagent_lot_id?", "operator_id?", "result?", "limit?", "offset?"]
    output: QcRun[]
    side_effects: []

  # ---- patient results ----------------------------------------------------
  - method: POST
    path: "/poct/test-results"
    description: "Capture a patient result from an instrument. Manual entry requires a reason and an unblocked site/device."
    roles: [Operator]
    code: 201
    input: ["device_id", "operator_id", "reagent_lot_id", "patient_mrn", "analyte", "measured_value", "entry_mode", "manual_entry_reason?"]
    output: TestResult
    side_effects: ["posting_status = PENDING_REVIEW; device.use_day_count and day-of-use rate recomputed; site index and readiness recomputed"]

  - method: GET
    path: "/poct/test-results/{id}"
    description: "Read one patient result."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: []
    output: TestResult
    side_effects: []

  - method: GET
    path: "/poct/test-results"
    description: "List patient results (FK reverse-reachability for device_id, operator_id and reagent_lot_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator]
    code: 200
    input: ["device_id?", "operator_id?", "reagent_lot_id?", "posting_status?", "limit?", "offset?"]
    output: TestResult[]
    side_effects: []

  - method: POST
    path: "/poct/test-results/{id}/post"
    description: "Post the result to the medical record. A manually entered result must be posted by a different user than the one who keyed it."
    roles: [Operator, LabDirector]
    code: 200
    input: [attestation]
    output: TestResult
    side_effects: ["posting_status -> POSTED; posted_value, posted_by_user_id, posted_at set; increments TestResult.version by 1"]

  - method: POST
    path: "/poct/test-results/{id}/correct"
    description: "Amend a posted result. OCC-guarded on the result's version; the amended value must be re-posted."
    roles: [Operator, LabDirector]
    code: 200
    input: [corrected_value, correction_reason, expected_test_result_version]
    output: TestResult
    side_effects: ["posting_status -> CORRECTION_PENDING; correction_count += 1; increments TestResult.version by 1"]

  # ---- proficiency testing ------------------------------------------------
  - method: POST
    path: "/poct/pt-enrollments"
    description: "Enroll a site in a proficiency-testing program for one analyte and program year."
    roles: [ProgramAdmin, QualityCoordinator]
    code: 201
    input: [site_id, analyte, program_year, program_provider]
    output: ProficiencyEnrollment
    side_effects: ["status = ENROLLED"]

  - method: GET
    path: "/poct/pt-enrollments/{id}"
    description: "Read one proficiency-testing enrollment."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: []
    output: ProficiencyEnrollment
    side_effects: []

  - method: GET
    path: "/poct/pt-enrollments"
    description: "List proficiency-testing enrollments."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: ProficiencyEnrollment[]
    side_effects: []

  - method: POST
    path: "/poct/pt-events"
    description: "Register a proficiency-testing shipment under an enrollment."
    roles: [ProgramAdmin, QualityCoordinator]
    code: 201
    input: [enrollment_id, shipment_number, due_date]
    output: ProficiencyEvent
    side_effects: ["status = PENDING; outcome = null"]

  - method: GET
    path: "/poct/pt-events/{id}"
    description: "Read one proficiency-testing event."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: []
    output: ProficiencyEvent
    side_effects: []

  - method: GET
    path: "/poct/pt-events"
    description: "List proficiency-testing events (FK reverse-reachability for enrollment_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: ["enrollment_id?", "outcome?", "limit?", "offset?"]
    output: ProficiencyEvent[]
    side_effects: []

  - method: POST
    path: "/poct/pt-events/{id}/score"
    description: "Record the graded score. Three-way branch: PASSED, INVESTIGATION_OPEN, or UNSUCCESSFUL_LOCKED (two failures among the last three graded shipments)."
    roles: [QualityCoordinator, ProgramAdmin]
    code: 200
    input: [score_pct, graded_on]
    output: ProficiencyEvent
    side_effects:
      - "outcome and status set by calculations.pt_event_outcome; enrollment.graded_event_count and fail_count_last_three recomputed"
      - "UNSUCCESSFUL_LOCKED branch only: enrollment.status -> UNSUCCESSFUL_PARTICIPATION and every ACTIVE Device at the site for that analyte -> QC_LOCKED (PT_UNSUCCESSFUL)"
      - "site.pt_unsuccessful_count, oversight_posture and inspection_readiness_score recomputed"

  - method: POST
    path: "/poct/pt-events/{id}/investigation"
    description: "Submit the root-cause and corrective-action investigation for a failed shipment."
    roles: [QualityCoordinator, LabDirector]
    code: 200
    input: [root_cause, corrective_action]
    output: ProficiencyEvent
    side_effects: ["status -> INVESTIGATION_SUBMITTED; investigation_round += 1"]

  - method: POST
    path: "/poct/pt-events/{id}/investigation-decision"
    description: "Accept the investigation (terminal) or reject it back into the investigation loop."
    roles: [LabDirector]
    code: 200
    input: ["decision", "note?"]
    output: ProficiencyEvent
    side_effects:
      - "ACCEPT: status -> INVESTIGATION_ACCEPTED; site.pt_unsuccessful_count -= 1; readiness recomputed"
      - "REJECT: status -> INVESTIGATION_OPEN (cycle)"

  # ---- inspections & deficiencies -----------------------------------------
  - method: POST
    path: "/poct/inspections"
    description: "Open a survey against a site. Created directly IN_PROGRESS."
    roles: [Surveyor]
    code: 201
    input: [site_id, inspection_type, scheduled_date]
    output: Inspection
    side_effects: ["status = IN_PROGRESS; issued_weight_total = 0"]

  - method: GET
    path: "/poct/inspections/{id}"
    description: "Read one inspection."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/poct/inspections"
    description: "List inspections."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/poct/inspections/{id}/issue"
    description: "Issue the deficiency statement: every DRAFT finding becomes OPEN, weights are pinned, and the site's weight ledger and posture move."
    roles: [Surveyor]
    code: 200
    input: [issued_on]
    output: Inspection
    side_effects:
      - "each DRAFT finding -> OPEN with weight and repeat_multiplier pinned by calculations.deficiency_weight"
      - "issued_weight_total set; site.open_deficiency_weight += issued_weight_total"
      - "site.oversight_posture re-derived; readiness_score_at_issue snapshotted"

  - method: POST
    path: "/poct/inspections/{id}/rescind"
    description: "Rescind a survey: all non-terminal findings are voided and the site's weight ledger returns to its pre-issue value (compensating action for deficiency_weight_conservation)."
    roles: [Surveyor, ProgramAdmin]
    code: 200
    input: [reason]
    output: Inspection
    side_effects:
      - "status -> RESCINDED; every DRAFT/OPEN/CORRECTION_SUBMITTED/CORRECTION_REJECTED finding -> VOIDED"
      - "site.open_deficiency_weight decremented by the sum of the voided findings' weight; oversight_posture re-derived; readiness recomputed"

  - method: POST
    path: "/poct/deficiencies"
    description: "Add a DRAFT finding to an in-progress survey, optionally linked to the earlier closed finding it repeats."
    roles: [Surveyor]
    code: 201
    input: ["inspection_id", "category", "severity", "description", "correction_due_date", "parent_finding_id?"]
    output: DeficiencyFinding
    side_effects: ["status = DRAFT; site_id copied from the inspection; weight = 0"]

  - method: GET
    path: "/poct/deficiencies/{id}"
    description: "Read one deficiency finding."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: []
    output: DeficiencyFinding
    side_effects: []

  - method: GET
    path: "/poct/deficiencies"
    description: "List deficiency findings (FK reverse-reachability for site_id, inspection_id and the self-referential parent_finding_id)."
    roles: [ProgramAdmin, LabDirector, QualityCoordinator, Surveyor]
    code: 200
    input: ["site_id?", "inspection_id?", "parent_finding_id?", "status?", "limit?", "offset?"]
    output: DeficiencyFinding[]
    side_effects: []

  - method: POST
    path: "/poct/deficiencies/{id}/correction"
    description: "Submit or resubmit a plan of correction for an open or rejected finding."
    roles: [QualityCoordinator, LabDirector]
    code: 200
    input: [correction_narrative, evidence_ref]
    output: DeficiencyFinding
    side_effects: ["status -> CORRECTION_SUBMITTED; correction_round += 1; site.open_deficiency_weight unchanged"]

  - method: POST
    path: "/poct/deficiencies/{id}/correction-decision"
    description: "Accept (closes the finding, may bubble the inspection to CLOSED) or reject (returns it to the correction loop). The accepting surveyor must differ from the issuing surveyor."
    roles: [Surveyor]
    code: 200
    input: ["decision", "note?"]
    output: DeficiencyFinding
    side_effects:
      - "ACCEPT: status -> CLOSED; site.open_deficiency_weight -= weight; posture and readiness re-derived; inspection bubbles to CLOSED when all findings are terminal"
      - "REJECT: status -> CORRECTION_REJECTED; weight ledger unchanged"

  # ---- program operations -------------------------------------------------
  - method: POST
    path: "/poct/oversight-runs"
    description: "Advance the oversight epoch: expire certificates and reagent lots, apply the three-phase competency grace/lock-out pass, flag QC-overdue instruments, detect waived-vs-moderate scope creep, and re-derive every site's posture and scores."
    roles: [ProgramAdmin]
    code: 200
    input: ["note?"]
    output: "{ evaluated_at: string, certificates_expired: integer, lots_expired: integer, competencies_lapsed: integer, operators_locked_out: integer, devices_qc_locked: integer, scope_creep_sites: integer, sites_posture_changed: integer }"
    side_effects:
      - "CliaCertificate ACTIVE -> EXPIRED past expiration_date, with CASCADE-B links 1-4"
      - "ReagentLot UNVERIFIED/VERIFIED -> EXPIRED past expiration_date; their PENDING_REVIEW results -> REJECTED"
      - "calculations.operator_access_grace_and_lockout phases 0-3"
      - "Device ACTIVE -> QC_LOCKED (QC_OVERDUE) and ACTIVE -> QC_LOCKED (CERTIFICATE_SCOPE) with site.scope_creep_flag"
      - "every site's counters, oversight_posture, site_qc_compliance_index and inspection_readiness_score recomputed; last_oversight_run_at = now"

  - method: POST
    path: "/poct/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["all subsequent date comparisons, created_at/updated_at stamps and window computations use the new logical clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role / X-User-ID headers missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles, or an entity_backed role's X-User-ID does not resolve to an Operator"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "a referenced site_id does not resolve to a TestSite"
  - id: ERR_OPERATOR_NOT_FOUND
    http: 404
    condition: "a referenced operator_id / assessor_operator_id / lab_director_operator_id does not resolve to an Operator"
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "a referenced device_id does not resolve to a Device"
  - id: ERR_REAGENT_LOT_NOT_FOUND
    http: 404
    condition: "a referenced reagent_lot_id does not resolve to a ReagentLot"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "any other referenced resource id (certificate, coverage, assessment, storage unit, QC run, test result, enrollment, PT event, inspection, deficiency) does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, enum out of range, integer out of bounds, malformed date, inverted interval, or a violated uniqueness constraint"
  - id: ERR_MANUAL_ENTRY_REASON_REQUIRED
    http: 400
    condition: "POST /poct/test-results with entry_mode == MANUAL and no non-empty manual_entry_reason"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_operator_version or expected_test_result_version does not equal the parent's current version"
  - id: ERR_CERTIFICATE_NOT_ACTIVE
    http: 409
    condition: "the referenced CliaCertificate has status != ACTIVE when a suspension or a new coverage is attempted"
  - id: ERR_DEVICE_QC_LOCKED
    http: 409
    condition: "the Device has status == QC_LOCKED (or RETIRED) when a result is captured, posted or corrected"
  - id: ERR_SITE_OVERSIGHT_SUSPENDED
    http: 409
    condition: "the TestSite has oversight_posture == SUSPENDED when access reinstatement or lot verification is attempted"
  - id: ERR_LOT_QUARANTINED
    http: 409
    condition: "the referenced ReagentLot has verification_status IN {QUARANTINED, DISCARDED, REJECTED}"
  - id: ERR_LOT_NOT_VERIFIED
    http: 409
    condition: "a patient result is captured against a ReagentLot whose verification_status != VERIFIED, or a QC lock is cleared with a confirming QcRun whose ReagentLot has verification_status != VERIFIED"
  - id: ERR_PT_EVENT_ALREADY_GRADED
    http: 409
    condition: "POST /poct/pt-events/{id}/score against an event whose status != PENDING"
  - id: ERR_PT_ENROLLMENT_STATUS_INVALID
    http: 409
    condition: "a PT shipment is registered under an enrollment whose status != ENROLLED"
  - id: ERR_DEFICIENCY_NOT_CORRECTABLE
    http: 409
    condition: "a correction is submitted for a finding whose status is not IN {OPEN, CORRECTION_REJECTED}, or a correction decision targets a finding whose status != CORRECTION_SUBMITTED"
  - id: ERR_INSPECTION_NOT_IN_PROGRESS
    http: 409
    condition: "findings are added to or issued from an inspection whose status != IN_PROGRESS, a rescind targets an inspection already CLOSED or RESCINDED, or a correction is submitted while the inspection's status != DEFICIENCIES_ISSUED"
  - id: ERR_ASSESSMENT_NOT_SUBMITTED
    http: 409
    condition: "a decision targets a CompetencyAssessment whose status != SUBMITTED"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "any other transition attempted from a state where 1.2 declares no edge (e.g. resolving an excursion on an IN_RANGE unit, unlocking an ACTIVE device, unlocking a CERTIFICATE_SCOPE lock, retiring a device with non-terminal results, reinstating access for a REVOKED operator). NOTE: re-suspending a SUSPENDED certificate is NOT this error - validation priority 40 runs first and returns ERR_CERTIFICATE_NOT_ACTIVE"
  - id: ERR_OPERATOR_ACCESS_LOCKED
    http: 422
    condition: "the referenced or acting Operator has access_status IN {LOCKED_OUT, DEACTIVATED}"
  - id: ERR_OPERATOR_COMPETENCY_LAPSED
    http: 422
    condition: "the referenced or acting Operator has competency_status IN {PENDING, LAPSED, REVOKED}"
  - id: ERR_REAGENT_LOT_EXPIRED
    http: 422
    condition: "date(logical clock now) is after the reagent lot's expiration_date"
  - id: ERR_QC_OVERDUE
    http: 422
    condition: "a patient result is captured on a device whose qc_next_due_at is before date(logical clock now)"
  - id: ERR_TEMP_EXCURSION_ACTIVE
    http: 422
    condition: "a reagent lot is received into a storage unit whose excursion_state == EXCURSION_OPEN"
  - id: ERR_CERTIFICATE_EXPIRED
    http: 422
    condition: "a device is installed at a site with no in-window CertificateCoverage whose certificate.status == ACTIVE and expiration_date >= date(now)"
  - id: ERR_COVERAGE_OUTSIDE_CERTIFICATE_WINDOW
    http: 422
    condition: "the requested coverage window is not entirely inside the certificate's [effective_date, expiration_date]"
  - id: ERR_LOT_DEVICE_MODEL_MISMATCH
    http: 422
    condition: "the reagent lot's device_model differs from the device's device_model"
  - id: ERR_CROSS_SITE_REFERENCE
    http: 422
    condition: "cross-referenced rows belong to different TestSites (operator vs device, lot vs device, storage unit vs lot, assessor vs subject, parent finding vs inspection, director vs site)"
  - id: ERR_QC_RUN_DEVICE_MISMATCH
    http: 422
    condition: "a referenced QcRun does not belong to the target device, or the two runs supplied to lot verification do not cover LEVEL_1 and LEVEL_2 of that lot on a single device"
  - id: ERR_COMPLEXITY_SCOPE_EXCEEDED
    http: 422
    condition: "a Device with complexity_class == MODERATE is installed while the site's in-window coverage has permitted_complexity_snapshot == WAIVED"
  - id: ERR_INSUFFICIENT_COMPETENCY_METHODS
    http: 422
    condition: "a competency assessment is submitted with methods_demonstrated < 6"
  - id: ERR_DIRECTOR_NOT_QUALIFIED
    http: 422
    condition: "the nominated director's role_title is not IN {PHYSICIAN, DOCTORAL_SCIENTIST, MIDLEVEL_PRACTITIONER} or competency_status is not IN {PROVISIONAL, COMPETENT}"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "an actor would perform two duties CLIA requires to be separated: assessor == subject, LabDirector deciding on an assessment they assessed or are the subject of, a surveyor accepting a correction for a finding they issued, or the manual-entry operator posting their own result"
  - id: ERR_MANUAL_ENTRY_NOT_PERMITTED
    http: 422
    condition: "a MANUAL entry_mode result is captured while site.manual_entry_blocked == true or device.manual_entry_suspended == true"
  - id: ERR_COVERAGE_WINDOW_OVERLAP
    http: 409
    condition: "the requested certificate coverage window collides (closed-closed, touching endpoints collide) with an existing coverage of the same site whose certificate.status IN {ACTIVE, SUSPENDED}"
  - id: ERR_ASSESSMENT_WINDOW_OVERLAP
    http: 409
    condition: "the requested competency window collides (half-open, touching endpoints allowed) with an existing APPROVED assessment for the same (operator_id, device_model)"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "a ProficiencyEnrollment already exists for the same (site_id, analyte, program_year)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Health-system point-of-care program office. Owns the certificate, site, operator roster, device and storage inventory, plus the oversight epoch and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /poct/certificates"
      - "POST /poct/certificates/{id}/suspend"
      - "POST /poct/sites"
      - "PATCH /poct/sites/{id}/director"
      - "POST /poct/certificate-coverages"
      - "POST /poct/operators"
      - "POST /poct/devices"
      - "POST /poct/devices/{id}/retire"
      - "POST /poct/storage-units"
      - "POST /poct/oversight-runs"
      - "POST /poct/_clock/set_current_utc"
    shared_operations:
      - "POST /poct/operators/{id}/training (with QualityCoordinator)"
      - "POST /poct/operators/{id}/access-reinstatement (with LabDirector)"
      - "POST /poct/competency-assessments/{id}/decision (with LabDirector; ProgramAdmin satisfies segregation by construction, being outside the Operator roster)"
      - "POST /poct/reagent-lots (with QualityCoordinator)"
      - "POST /poct/storage-units/{id}/temperature-readings (with Operator, QualityCoordinator)"
      - "POST /poct/pt-enrollments, POST /poct/pt-events, POST /poct/pt-events/{id}/score (with QualityCoordinator)"
      - "POST /poct/inspections/{id}/rescind (with Surveyor)"
      - "all GET endpoints except GET /poct/sites/{id}/readiness is also shared with Surveyor"

  - name: LabDirector
    description: "The CLIA laboratory director of record for a site. Approves competencies, reinstates access, accepts proficiency-testing investigations and may post or correct results."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /poct/pt-events/{id}/investigation-decision"
    shared_operations:
      - "POST /poct/competency-assessments and POST /poct/competency-assessments/{id}/decision (with QualityCoordinator / ProgramAdmin)"
      - "POST /poct/operators/{id}/access-reinstatement (with ProgramAdmin)"
      - "POST /poct/devices/{id}/qc-unlock, POST /poct/reagent-lots/{id}/verify, POST /poct/storage-units/{id}/excursion-resolution (with QualityCoordinator)"
      - "POST /poct/test-results/{id}/post, POST /poct/test-results/{id}/correct (with Operator)"
      - "POST /poct/pt-events/{id}/investigation, POST /poct/deficiencies/{id}/correction (with QualityCoordinator)"
      - "all GET endpoints"

  - name: QualityCoordinator
    description: "Point-of-care quality coordinator. Runs lot verification, clears QC locks, files plans of correction and proficiency-testing investigations."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /poct/operators/{id}/training (with ProgramAdmin)"
      - "POST /poct/competency-assessments (with LabDirector)"
      - "POST /poct/devices/{id}/qc-unlock, POST /poct/reagent-lots/{id}/verify, POST /poct/storage-units/{id}/excursion-resolution (with LabDirector)"
      - "POST /poct/reagent-lots (with ProgramAdmin)"
      - "POST /poct/qc-runs (with Operator)"
      - "POST /poct/storage-units/{id}/temperature-readings (with Operator, ProgramAdmin)"
      - "POST /poct/pt-enrollments, POST /poct/pt-events, POST /poct/pt-events/{id}/score (with ProgramAdmin)"
      - "POST /poct/pt-events/{id}/investigation, POST /poct/deficiencies/{id}/correction (with LabDirector)"
      - "all GET endpoints"

  - name: Operator
    description: "Front-line testing personnel. Runs controls, captures patient results, posts them to the medical record and records probe temperatures."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /poct/test-results"
    shared_operations:
      - "POST /poct/qc-runs (with QualityCoordinator)"
      - "POST /poct/storage-units/{id}/temperature-readings (with QualityCoordinator, ProgramAdmin)"
      - "POST /poct/test-results/{id}/post, POST /poct/test-results/{id}/correct (with LabDirector)"
      - "GET endpoints for sites, certificates, operators, devices, storage units, reagent lots, QC runs and test results"

  - name: Surveyor
    description: "Accreditation / state surveyor. Opens surveys, raises and issues findings, and decides plans of correction - never the same user for issuing and closing one finding."
    identity: opaque
    exclusive_operations:
      - "POST /poct/inspections"
      - "POST /poct/deficiencies"
      - "POST /poct/inspections/{id}/issue"
      - "POST /poct/deficiencies/{id}/correction-decision"
    shared_operations:
      - "POST /poct/inspections/{id}/rescind (with ProgramAdmin)"
      - "read-only GETs across sites, operators, devices, storage units, reagent lots, QC runs, test results, competency assessments, PT enrollments/events, inspections, deficiencies and GET /poct/sites/{id}/readiness"
