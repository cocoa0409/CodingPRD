              as: ChildFindCoordinator
              captures: { referralA_id: "$.data.id" }
            - call: "POST /child-find/referrals/${referralA_id}/consent-requests"
              payload: { notice_language_code: "en", notice_delivery_method: "MAIL" }
              as: ChildFindCoordinator
              captures: { consentA_id: "$.data.id" }
            - call: "POST /child-find/children"
