              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${pro_tier_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv0: "$.data[0].id" }
            - call: "POST /publications/${pub_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == ERR_PUBLICATION_SUSPENDED"
            - "Subscription.${sub_id}.status == TRIALING"

