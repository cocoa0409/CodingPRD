            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CI1", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
