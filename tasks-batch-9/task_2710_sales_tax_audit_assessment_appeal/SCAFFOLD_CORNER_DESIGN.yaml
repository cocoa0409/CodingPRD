      - name: one_pending_waiver_at_a_time_and_it_must_actually_extend
        claim_type: Error triggerable
        grounds: [endpoints.POST /statute-waivers, "endpoints.POST /statute-waivers/{id}/execute", errors.ERR_WAIVER_ALREADY_PENDING, errors.ERR_WAIVER_NOT_EXTENDING, calculations.statute_expiry]
        distinguishing_aspect: |
          The two waiver guards fire at different moments. ERR_WAIVER_ALREADY_PENDING
          is a drafting guard: while one DRAFTED waiver sits unsigned, a second draft
          is refused (409) even though its date would extend further.
          ERR_WAIVER_NOT_EXTENDING is an execution guard measured against the running
          expiry AT EXECUTION: extended_to_date 2029-06-29 exactly equals the base
          expiry (2026-06-30 + 1095 days), so it adds nothing and is refused (422) —
          the boundary is "on or before", not "before". Voiding the stuck draft frees
          the pending slot, and the replacement to 2031-01-01 then adds
          days_between(2029-06-29, 2031-01-01) = 551 days.
        test_recipe:
          setup:
            - "MINI carried to SCOPED (permit P-2710-R4) with the clock on 2026-06-30, so base_statute_expiry_date is 2029-06-29 and statute_status is PROTECTED."
