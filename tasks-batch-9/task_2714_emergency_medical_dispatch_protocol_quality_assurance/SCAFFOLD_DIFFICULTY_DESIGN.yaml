  - rule_id: boundary_precision_check
    instances:
      - name: posture_boundary_at_exactly_the_target_versus_one_tenth_below
        grounds:
          - calculations.dispatcher_compliance_rollup
          - calculations.review_composite_score.accreditation_weighted_composite
          - calculations.auto_coaching_plan_upsert
        distinguishing_aspect: |
          The GOOD/WATCH boundary is inclusive at target_compliance_pct, and it is decided at the
          first decimal of a weighted sum whose fourth term (93.33 * 0.15 = 13.9995) is itself a
          rounding hazard. Dispatcher A lands on exactly 90.0 and gets no coaching plan at all;
          dispatcher B lands on 89.9 — one tenth away — and gets an ADVISORY plan focused on the
          weakest section. A single-step (unrounded-sections) implementation moves B off 89.9.
        test_recipe:
          setup:
            - "Program with target_compliance_pct 90.0 and watch_floor_pct 80.0."
            - "Dispatcher A: sheet 18/20, 27/30, 9/10, 9/10 with an ACCURATE code — all four section percentages are exactly 90.00."
            - "Dispatcher B: sheet 18/20, 27/30, 22/25, 28/30 with an ACCURATE code — sections 90.00 / 90.00 / 88.00 / 93.33."
            - "Both reviews are finalized by the supervisor."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Pinecrest EMD QA", accreditation_body: "IAED", target_compliance_pct: 90.0, watch_floor_pct: 80.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
