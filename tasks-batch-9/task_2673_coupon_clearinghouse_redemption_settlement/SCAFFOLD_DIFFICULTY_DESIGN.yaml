              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-F1", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
