  - method: GET
    path: "/acquisitions/lease-files/{id}"
    description: "Read one lease file"
    roles: *all_roles
    code: 200
    input: []
    output: LeaseFile
    side_effects: []
  - method: GET
    path: "/acquisitions/lease-files"
    description: "List lease files; filterable by unit or by supersedes_lease_id (finds leases superseded by a given lease)"
    roles: *all_roles
    code: 200
