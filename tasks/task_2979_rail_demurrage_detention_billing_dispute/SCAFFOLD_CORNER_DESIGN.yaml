              captures: { reset_gross: "$.data[0].gross_amount_cents", reset_count: "$.data[0].billable_days" }
          assert:
            - "cycle 1 released at the gate hour on 2026-08-09 has billable_days 2 and gross_amount_cents 25100 = 2 x 12550: both days on tier 1"
            - "the same cycle released one day later would be 3 days and 47550 = 2 x 12550 + 1 x 22450, so the third day is the first tier-2 day"
            - "cycle 2 free time expires 2026-08-09T23:59:59.999Z and its release at 2026-08-10T16:00Z gives billable_days 1 and gross_amount_cents 12550"
            - "the ladder therefore reset: cycle 2's single day priced at 12550, not at the 22450 the customer's running total had already reached"

      - name: provisional_and_final_charge_variants_on_one_timeline
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / chargeable_days_provisional_vs_final_on_industry_track_charge"
          rationale: |
            That §1.8 instance already drives both variants of C2 over a single
            recorded timeline — the PROVISIONAL line computed with released_at
            still null against the same cycle's FINAL line after release — and
            asserts the divergent day counts and gross amounts from one shared
            setup. The storage CALENDAR-vs-HOURLY pair and the bunching
            ORDERED_VS_CAPACITY-vs-ROLLING_AVERAGE pair are covered by the two
            sibling instances of the same rule. A corner instance here would
            replay the same three variant selectors with different literals.

      - name: cascading_side_effects_reach_the_customer_balance
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / decide_cascades_charge_to_invoice_to_customer_four_hops"
          rationale: |
            The four-hop cascade from a single decide call — dispute credit to
            charge credit_applied_cents, to invoice total_credit_cents and
            total_net_cents, to invoice status ADJUSTED, to
            Customer.credit_balance_cents — is asserted hop by hop in that §1.8
            instance, and its sibling covers the release cascade into the
            average agreement's day ledger. Both directions of the layer are
            therefore already exercised from one API call each; a corner
            instance would only re-walk the same chain.

  # ==========================================================================
  # §1.2 consistency_model: immediate
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: the_decide_response_itself_already_carries_the_whole_cascade
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/demurrage/disputes/{id}/decide
        distinguishing_aspect: |
          There is no settlement job and no eventual convergence: the response
          body of the single decide call already shows the credit, and reads of
          the charge, the invoice and the customer issued immediately afterwards
          agree with it without any intervening write, poll or delay.
        test_recipe:
          setup:
            - "a dispute UNDER_REVIEW on an issued invoice whose single charge is 47550"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9M1-CUST", name: "Immediate Idocrase", serving_station_code: "STN74", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9M1-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9M1-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9M1-IDX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9M1-A", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-05T10:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/release"
              payload: { released_at: "2026-08-10T16:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/invoices"
              payload: { customer_id: "${cust_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-08-31" }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /demurrage/invoices/${inv_id}/issue"
              payload: {}
              as: BillingAdmin
              captures: { inv_v: $.data.version }
            - call: "POST /demurrage/disputes"
              payload: { invoice_id: "${inv_id}", scope: "WHOLE_INVOICE", grounds: "RAILROAD_CAUSED_DELAY", narrative: "Crew failed to pull the car.", claimed_credit_cents: 47550, expected_invoice_version: "${inv_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /demurrage/disputes/${dsp_id}/evidence"
              payload: { evidence_type: "SWITCH_LIST", observed_at: "2026-08-08T00:00:00Z", description: "Switch list showing no pull." }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/disputes/${dsp_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/disputes/${dsp_id}/begin-review"
              payload: {}
              as: DemurrageAdjudicator
              as_user_id: "adj-c9m1-a"
          trigger:
            - call: "POST /demurrage/disputes/${dsp_id}/decide"
              payload: { decision: "ALLOWED", allowance_pct: 1, decision_rationale: "Railroad fault admitted." }
              as: DemurrageAdjudicator
              as_user_id: "adj-c9m1-a"
              captures: { decided_status: $.data.status, allowed_credit_cents: $.data.allowed_credit_cents }
            - call: "GET /demurrage/charges?placement_cycle_id=${cyc_id}&limit=10&offset=0"
              payload: {}
              as: BillingAdmin
              captures: { charge_credit: "$.data[0].credit_applied_cents", charge_net: "$.data[0].net_amount_cents", charge_status: "$.data[0].status" }
            - call: "GET /demurrage/invoices/${inv_id}"
              payload: {}
              as: BillingAdmin
              captures: { inv_credit: $.data.total_credit_cents, inv_net: $.data.total_net_cents, inv_status: $.data.status }
            - call: "GET /demurrage/customers/${cust_id}"
              payload: {}
              as: BillingAdmin
              captures: { cust_balance: $.data.credit_balance_cents }
          assert:
            - "the decide response body itself already reports status DECIDED and allowed_credit_cents 47550"
            - "the immediately following charge read shows credit_applied_cents 47550, net_amount_cents 0 and status DISPUTE_CREDITED"
            - "the invoice read shows total_credit_cents 47550, total_net_cents 0 and status ADJUSTED"
            - "the customer read shows credit_balance_cents 47550"
            - "no extra write, retry or wait was needed between the decide and any of the three reads"

      - name: the_invoice_create_response_already_holds_its_own_rollup
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/demurrage/invoices
        distinguishing_aspect: |
          Attachment is not a later batch: the 201 body of the invoice create
          already carries attached_charge_count and the summed totals, and the
          charges themselves already report the new invoice_id on a read taken
          in the very next call.
        test_recipe:
          setup:
            - "two released cycles for one customer inside the billing period (47550 and 12550)"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9M2-CUST", name: "Rollup Rhodochrosite", serving_station_code: "STN75", notification_method: "EDI" }
              as: BillingAdmin
