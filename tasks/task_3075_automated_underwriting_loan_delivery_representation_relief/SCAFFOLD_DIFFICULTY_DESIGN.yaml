scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: llpa_provisional_revalues_pipeline_final_pins_loan_price
    grounds:
    - calculations.loan_price
    - calculations.pipeline_revaluation
    - entities.Loan.fields.applied_llpa_bps
    - entities.Pipeline.fields.projected_value_cents
    distinguishing_aspect: 'Same loan priced two ways on the Pipeline domain: the provisional

      variant reprices the DRAFT loan when the grid swaps (100 bps -> 50

      bps, projected value rises by 40,000,000 cents) while the delivered

      loan''s final variant keeps the pinned 100 bps price forever.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Seller S approved; Servicer V approved; MasterAgreement A ACTIVE (2026-01-01 to 2028-01-01).
      - LlpaMatrix M1 ACTIVE with a single PRIMARY_RESIDENCE/FIXED_30 row at llpa_bps 100.
      - 'Loan L1: UPB 400,000,000 cents, appraisal 500,000,000, score 740, PRIMARY_RESIDENCE, FIXED_30 (ltv_bp 8000).'
      - Pipeline P for seller S.
      setup_api_calls:
      - &id001
        call: POST /gse/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: GseAdmin
      - &id002
        call: POST /gse/sellers
        payload:
          legal_name: Meridian Lending
          seller_number: S-1001
          net_worth_cents: 500000000
          qc_defect_rate_bps: 100
        as: GseAdmin
        captures:
          s1: $.data.id
      - &id003
        call: POST /gse/servicers
        payload:
          legal_name: Atlas Servicing
          servicer_number: V-2001
          net_worth_cents: 300000000
          qc_rating: SATISFACTORY
        as: GseAdmin
        captures:
          v1: $.data.id
      - call: POST /gse/sellers/${s1}/approve
        payload: {}
        as: GseAdmin
      - call: POST /gse/servicers/${v1}/approve
        payload: {}
        as: GseAdmin
      - &id004
        call: POST /gse/master-agreements
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          effective_date: '2026-01-01T00:00:00Z'
          expiration_date: '2028-01-01T00:00:00Z'
        as: GseAdmin
        captures:
          a1: $.data.id
      - call: POST /gse/master-agreements/${a1}/activate
        payload: {}
        as: GseAdmin
      - &id005
        call: POST /gse/llpa-matrices
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          effective_until: '2027-01-01T00:00:00Z'
          rows:
          - occupancy: PRIMARY_RESIDENCE
            product_type: FIXED_30
            llpa_bps: 100
            ltv_min_bp: 0
            ltv_max_bp: 9500
            credit_min: 620
            credit_max: 850
        as: GseAdmin
        captures:
          m1: $.data.id
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-1
          borrower_name: Alex Chen
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          l1: $.data.id
      - call: POST /gse/pipelines
        payload:
          seller_id: ${s1}
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          p1: $.data.id
      trigger:
      - call: POST /gse/llpa-matrices
        payload:
          effective_from: '2026-09-01T00:00:00Z'
          effective_until: '2027-09-01T00:00:00Z'
          rows:
          - occupancy: PRIMARY_RESIDENCE
            product_type: FIXED_30
            llpa_bps: 50
            ltv_min_bp: 0
            ltv_max_bp: 9500
            credit_min: 620
            credit_max: 850
        as: GseAdmin
        captures:
          m2: $.data.id
      - call: GET /gse/pipelines/${p1}
        payload: {}
        as: GseAdmin
      - call: GET /gse/llpa-update-events
        payload:
          pipeline_id: ${p1}
        as: GseAdmin
      assert:
      - under M1 the provisional price of loan ${l1} was 396,000,000 cents (400,000,000 - 4,000,000 LLPA at 100 bps)
      - 'after the grid swap to M2, Pipeline.${p1}.projected_value_cents == 398000000 (recomputed at 50 bps: 400,000,000 - 2,000,000)'
      - LlpaMatrix.${m1}.status == SUPERSEDED and LlpaMatrix.${m2}.status == ACTIVE
      - the LlpaUpdateEvent for pipeline ${p1} has projected_value_before_cents == 396000000, projected_value_after_cents == 398000000, delta_cents == 2000000, impacted_loan_count == 1
  - name: relief_payment_history_path_vs_independent_validation_path
    grounds:
    - calculations.relief_tier_evaluation
    - entities.Loan.fields.relief_tier
    - entities.Loan.fields.consecutive_on_time_payments
    distinguishing_aspect: 'Two paths to relief on the Loan domain: the payment-history variant

      needs exactly 36 consecutive ON_TIME payments (35 still NONE), while

      the independent-validation variant jumps straight to

      INDEPENDENT_VALIDATION on case finalization with zero payments.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Seller S approved; Servicer V approved; agreement A ACTIVE; grid M ACTIVE (100 bps row).
      - Loan LA driven to PURCHASED via case (approve-eligible inputs), delivery into pool, lock, issue.
      - Loan LB DRAFT with a fully VALIDATED case, never finalized yet, zero payments.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - call: POST /gse/sellers/${s1}/approve
        payload: {}
        as: GseAdmin
      - call: POST /gse/servicers/${v1}/approve
        payload: {}
        as: GseAdmin
      - *id004
      - call: POST /gse/master-agreements/${a1}/activate
        payload: {}
        as: GseAdmin
      - *id005
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-A
          borrower_name: Pat A
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          la: $.data.id
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-B
          borrower_name: Pat B
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          lb: $.data.id
      - call: POST /gse/pools
        payload:
          seller_id: ${s1}
          agreement_id: ${a1}
          pool_number: PL-1
          issue_date: '2026-10-01T00:00:00Z'
          target_balance_cents: 1000000000
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          pl1: $.data.id
      - call: POST /gse/underwriting-cases
        payload:
          loan_id: ${la}
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          ca: $.data.id
      - call: POST /gse/underwriting-cases/${ca}/reports
        payload:
          service_type: INCOME
          provider_reference: PR-I1
        as: Underwriter
        captures:
          rai: $.data.id
      - call: POST /gse/validation-reports/${rai}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${ca}/reports
        payload:
          service_type: ASSET
          provider_reference: PR-A1
        as: Underwriter
        captures:
          raa: $.data.id
      - call: POST /gse/validation-reports/${raa}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${ca}/reports
        payload:
          service_type: EMPLOYMENT
          provider_reference: PR-E1
        as: Underwriter
        captures:
          rae: $.data.id
      - call: POST /gse/validation-reports/${rae}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: GET /gse/underwriting-cases/${ca}
        payload: {}
        as: GseAdmin
        captures:
          ca_v: $.data.version
      - call: POST /gse/underwriting-cases/${ca}/finalize
        payload:
          expected_case_version: ${ca_v}
        as: GseUnderwritingEngine
      - call: POST /gse/loans/${la}/deliver
        payload:
          pool_id: ${pl1}
        as: SellerOfficer
        as_user_id: ${s1}
      - call: POST /gse/pools/${pl1}/lock
        payload: {}
        as: SellerOfficer
        as_user_id: ${s1}
      - call: GET /gse/pools/${pl1}
        payload: {}
        as: GseAdmin
        captures:
          pl1_v: $.data.version
      - call: POST /gse/pools/${pl1}/issue
        payload:
          expected_pool_version: ${pl1_v}
        as: SellerOfficer
        as_user_id: ${s1}
      - call: POST /gse/underwriting-cases
        payload:
          loan_id: ${lb}
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          cb: $.data.id
      - call: POST /gse/underwriting-cases/${cb}/reports
        payload:
          service_type: INCOME
          provider_reference: PR-I2
        as: Underwriter
        captures:
          rbi: $.data.id
      - call: POST /gse/validation-reports/${rbi}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${cb}/reports
        payload:
          service_type: ASSET
          provider_reference: PR-A2
        as: Underwriter
        captures:
          rba: $.data.id
      - call: POST /gse/validation-reports/${rba}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${cb}/reports
        payload:
          service_type: EMPLOYMENT
          provider_reference: PR-E2
        as: Underwriter
        captures:
          rbe: $.data.id
      - call: POST /gse/validation-reports/${rbe}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: GET /gse/underwriting-cases/${cb}
        payload: {}
        as: GseAdmin
        captures:
          cb_v: $.data.version
      - call: POST /gse/underwriting-cases/${cb}/finalize
        payload:
          expected_case_version: ${cb_v}
        as: GseUnderwritingEngine
      trigger:
      - call: POST /gse/payment-events
        payload:
          loan_id: ${la}
          due_date: '2026-10-01T00:00:00Z'
          paid_on_time: true
          amount_cents: 200000
        as: ServicerOfficer
        as_user_id: ${v1}
      assert:
      - Loan.${la}.relief_tier == NONE after exactly 1 ON_TIME payment (payment-history path needs 36)
      - Loan.${la}.consecutive_on_time_payments == 1
      - Loan.${lb}.relief_tier == INDEPENDENT_VALIDATION with consecutive_on_time_payments == 0 (independent-validation path ignores payment count)
      - Loan.${lb}.independent_validation_complete == true
- rule_id: combinatorial_formula
  instances:
  - name: llpa_row_selection_nonlinear_multi_input
    grounds:
    - calculations.loan_price
    - calculations.eligibility_check
    - entities.LlpaMatrix.fields.rows
    distinguishing_aspect: 'Mode (a): the LLPA row selection is a 4-input predicate

      (occupancy x product_type x ltv band x credit band) with

      half-open LTV bounds and closed credit bounds; with 6 rows in the

      grid, changing only credit_score from 739 to 740 flips the loan

      from the 150-bps band to the 50-bps band and moves

      delivery_price_cents by exactly 4,000,000 cents.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Seller S approved; Servicer V approved; agreement A ACTIVE.
      - 'Grid M with 6 rows: PRIMARY_RESIDENCE x FIXED_30 at credit [620,739] llpa 150, credit [740,850] llpa 50; INVESTMENT x FIXED_30 at credit [620,739] llpa 300, credit [740,850] llpa 200; SECOND_HOME
        x ARM_5_1 llpa 175; INVESTMENT x ARM_5_1 llpa 325.'
      - Pool PL OPEN with capacity 2,000,000,000.
      - 'Two loans delivered: L_LOW credit 739 and L_HIGH credit 740, otherwise identical (UPB 400,000,000, appraisal 500,000,000, PRIMARY_RESIDENCE, FIXED_30).'
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - call: POST /gse/sellers/${s1}/approve
        payload: {}
        as: GseAdmin
      - call: POST /gse/servicers/${v1}/approve
        payload: {}
        as: GseAdmin
      - *id004
      - call: POST /gse/master-agreements/${a1}/activate
        payload: {}
        as: GseAdmin
      - call: POST /gse/llpa-matrices
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          effective_until: '2027-01-01T00:00:00Z'
          rows:
          - occupancy: PRIMARY_RESIDENCE
            product_type: FIXED_30
            llpa_bps: 150
            ltv_min_bp: 0
            ltv_max_bp: 9500
            credit_min: 620
            credit_max: 739
          - occupancy: PRIMARY_RESIDENCE
            product_type: FIXED_30
            llpa_bps: 50
            ltv_min_bp: 0
            ltv_max_bp: 9500
            credit_min: 740
            credit_max: 850
          - occupancy: INVESTMENT
            product_type: FIXED_30
            llpa_bps: 300
            ltv_min_bp: 0
            ltv_max_bp: 9500
            credit_min: 620
            credit_max: 739
          - occupancy: INVESTMENT
            product_type: FIXED_30
            llpa_bps: 200
            ltv_min_bp: 0
            ltv_max_bp: 9500
            credit_min: 740
            credit_max: 850
          - occupancy: SECOND_HOME
            product_type: ARM_5_1
            llpa_bps: 175
            ltv_min_bp: 0
            ltv_max_bp: 9500
            credit_min: 620
            credit_max: 850
          - occupancy: INVESTMENT
            product_type: ARM_5_1
            llpa_bps: 325
            ltv_min_bp: 0
            ltv_max_bp: 9500
            credit_min: 620
            credit_max: 850
        as: GseAdmin
      - call: POST /gse/pools
        payload:
          seller_id: ${s1}
          agreement_id: ${a1}
          pool_number: PL-2
          issue_date: '2026-10-01T00:00:00Z'
          target_balance_cents: 2000000000
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          pl2: $.data.id
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-LOW
          borrower_name: Low Score
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 739
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          llow: $.data.id
      - call: POST /gse/loans
        payload:
          seller_id: ${s1}
          servicer_id: ${v1}
          agreement_id: ${a1}
          loan_number: LN-HIGH
          borrower_name: High Score
          unpaid_principal_balance_cents: 400000000
          appraised_value_cents: 500000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          lhigh: $.data.id
      - call: POST /gse/underwriting-cases
        payload:
          loan_id: ${llow}
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          clow: $.data.id
      - call: POST /gse/underwriting-cases/${clow}/reports
        payload:
          service_type: INCOME
          provider_reference: PR-1
        as: Underwriter
        captures:
          rl1: $.data.id
      - call: POST /gse/validation-reports/${rl1}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${clow}/reports
        payload:
          service_type: ASSET
          provider_reference: PR-2
        as: Underwriter
        captures:
          rl2: $.data.id
      - call: POST /gse/validation-reports/${rl2}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${clow}/reports
        payload:
          service_type: EMPLOYMENT
          provider_reference: PR-3
        as: Underwriter
        captures:
          rl3: $.data.id
      - call: POST /gse/validation-reports/${rl3}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: GET /gse/underwriting-cases/${clow}
        payload: {}
        as: GseAdmin
        captures:
          clow_v: $.data.version
      - call: POST /gse/underwriting-cases/${clow}/finalize
        payload:
          expected_case_version: ${clow_v}
        as: GseUnderwritingEngine
      - call: POST /gse/underwriting-cases
        payload:
          loan_id: ${lhigh}
        as: SellerOfficer
        as_user_id: ${s1}
        captures:
          chigh: $.data.id
      - call: POST /gse/underwriting-cases/${chigh}/reports
        payload:
          service_type: INCOME
          provider_reference: PR-4
        as: Underwriter
        captures:
          rh1: $.data.id
      - call: POST /gse/validation-reports/${rh1}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${chigh}/reports
        payload:
          service_type: ASSET
          provider_reference: PR-5
        as: Underwriter
        captures:
          rh2: $.data.id
      - call: POST /gse/validation-reports/${rh2}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: POST /gse/underwriting-cases/${chigh}/reports
        payload:
          service_type: EMPLOYMENT
          provider_reference: PR-6
        as: Underwriter
        captures:
          rh3: $.data.id
      - call: POST /gse/validation-reports/${rh3}/complete
        payload:
          result: VALIDATED
        as: Underwriter
      - call: GET /gse/underwriting-cases/${chigh}
        payload: {}
        as: GseAdmin
        captures:
          chigh_v: $.data.version
      - call: POST /gse/underwriting-cases/${chigh}/finalize
        payload:
          expected_case_version: ${chigh_v}
        as: GseUnderwritingEngine
      trigger:
      - call: POST /gse/loans/${llow}/deliver
        payload:
          pool_id: ${pl2}
        as: SellerOfficer
        as_user_id: ${s1}
      - call: POST /gse/loans/${lhigh}/deliver
        payload:
          pool_id: ${pl2}
        as: SellerOfficer
        as_user_id: ${s1}
      - call: GET /gse/loans/${llow}
        payload: {}
        as: GseAdmin
      - call: GET /gse/loans/${lhigh}
        payload: {}
        as: GseAdmin
      assert:
      - Loan.${llow}.applied_llpa_bps == 150 (credit 739 lands in the [620,739] band)
      - Loan.${llow}.delivery_price_cents == 394000000 (400,000,000 - 6,000,000)
      - Loan.${lhigh}.applied_llpa_bps == 50 (credit 740 lands in the [740,850] band — closed lower bound)
      - Loan.${lhigh}.delivery_price_cents == 398000000 (400,000,000 - 2,000,000)
      - the one-point credit difference moves the delivery price by exactly 4,000,000 cents
  - name: oversight_score_threshold_ordering
    grounds:
    - calculations.servicer_oversight_score
    - entities.Servicer.fields.oversight_score
    distinguishing_aspect: 'Mode (c): the transfer-approval gate depends on oversight_score,

      which is itself computed from pending repurchase demands; the

      evaluation order (demand issuance -> score recompute -> approval

      gate) is pinned so that with exactly 8 pending demands the score is

      exactly 60 and approval succeeds, while the 9th demand drops the

      score to 55 and the identical approval fails with

      ERR_SUBSERVICER_OVERSIGHT_DEFICIENT.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Seller S approved (net worth 900,000,000); Servicers V1 and V2 approved; agreement A ACTIVE; grid M (100 bps row).
      - 9 PURCHASED loans L1..L9 of seller S (each UPB 40,000,000 / appraisal 50,000,000 / score 740), all serviced by V2, via one pool of capacity 400,000,000.
      - QcAudit AU for seller S with 9 findings (one per loan, defect_category COLLATERAL), findings issued, 9 demands ISSUED.
      - A 10th PURCHASED loan L10 of seller S serviced by V1 with a ServicingTransfer T requesting V1 -> V2.
      setup_api_calls:
      - *id001
      - call: POST /gse/sellers
        payload:
          legal_name: Big Seller
          seller_number: S-9
          net_worth_cents: 900000000
          qc_defect_rate_bps: 100
        as: GseAdmin
        captures:
          s9: $.data.id
      - call: POST /gse/servicers
        payload:
          legal_name: Servicer One
          servicer_number: V-1
          net_worth_cents: 300000000
          qc_rating: SATISFACTORY
        as: GseAdmin
        captures:
          vv1: $.data.id
      - call: POST /gse/servicers
        payload:
          legal_name: Servicer Two
          servicer_number: V-2
          net_worth_cents: 300000000
          qc_rating: SATISFACTORY
        as: GseAdmin
        captures:
          vv2: $.data.id
      - call: POST /gse/sellers/${s9}/approve
        payload: {}
        as: GseAdmin
      - call: POST /gse/servicers/${vv1}/approve
        payload: {}
        as: GseAdmin
      - call: POST /gse/servicers/${vv2}/approve
        payload: {}
        as: GseAdmin
      - call: POST /gse/master-agreements
        payload:
          seller_id: ${s9}
          servicer_id: ${vv1}
          effective_date: '2026-01-01T00:00:00Z'
          expiration_date: '2028-01-01T00:00:00Z'
        as: GseAdmin
        captures:
          a9: $.data.id
      - call: POST /gse/master-agreements/${a9}/activate
        payload: {}
        as: GseAdmin
      - call: POST /gse/llpa-matrices
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          effective_until: '2027-01-01T00:00:00Z'
          rows:
          - occupancy: PRIMARY_RESIDENCE
            product_type: FIXED_30
            llpa_bps: 100
            ltv_min_bp: 0
            ltv_max_bp: 9500
            credit_min: 620
            credit_max: 850
        as: GseAdmin
      - call: POST /gse/pools
        payload:
          seller_id: ${s9}
          agreement_id: ${a9}
          pool_number: PL-9
          issue_date: '2026-10-01T00:00:00Z'
          target_balance_cents: 400000000
        as: SellerOfficer
        as_user_id: ${s9}
        captures:
          pl9: $.data.id
      - call: POST /gse/loans
        payload:
          seller_id: ${s9}
          servicer_id: ${vv2}
          agreement_id: ${a9}
          loan_number: B1
          borrower_name: B One
          unpaid_principal_balance_cents: 40000000
          appraised_value_cents: 50000000
          credit_score: 740
          occupancy: PRIMARY_RESIDENCE
          product_type: FIXED_30
        as: SellerOfficer
