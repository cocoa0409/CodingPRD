  - section: endpoints
    instances:
      - name: patching_an_unverified_applicant_updates_inputs_and_defers_recertification
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH_/rehab/applicants/{applicant_id}
          - endpoints.GET_/rehab/applicants/{applicant_id}
          - calculations.applicant_annual_income_and_category
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "PATCH is a partial update on an APPLIED applicant: the two supplied fields move, the untouched ones hold, version increments, and the certified figures stay null until verify-income runs — after which the same PATCH is refused with 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "one ProgramYear 2026 (ami 9,000,000) and one Applicant in APPLIED with wage 4,500,000, household_size 4, no assets, 0 dependents"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Odell Marsh", email: "odell@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 4500000 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "PATCH /rehab/applicants/${hh_id}"
              payload: { wage_income_cents: 7000000, household_assets_cents: 5000000, dependents_count: 2 }
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "GET /rehab/applicants/${hh_id}"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/applicants/${hh_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
          assert:
            - "the PATCH returns 200 with wage_income_cents 7000000, household_assets_cents 5000000, dependents_count 2"
            - "the PATCH leaves household_size 4, income_calc_method PART_5_ANNUAL, full_name Odell Marsh untouched and bumps version from 1 to 2"
            - "immediately after the PATCH the GET still shows eligibility_status APPLIED with annual_income_cents null"
            - "verify-income then returns annual_income_cents 7020000, ami_percent 78.0, income_category LOW, eligibility_status INCOME_VERIFIED"
            - "a second PATCH after certification returns HTTP 409 ERR_INVALID_STATE and changes nothing"

      - name: contractor_status_endpoint_is_the_only_road_back_to_the_approved_list
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/rehab/contractors/{contractor_id}/status
          - state_machines.Contractor
          - calculations.contractor_performance_score
        distinguishing_aspect: "The status action drives every manual leg of the contractor machine, including the promotions the system never performs on its own (PROBATION -> APPROVED and SUSPENDED -> APPROVED); reinstatement restores approved_list_status without resetting performance_score or the complaint and sanction counters."
        test_recipe:
          setup:
            - "one Contractor c2 in APPROVED with performance_score 100"
          setup_api_calls:
            - call: "POST /rehab/contractors"
              payload: { legal_name: "Borough Builders Inc", license_number: "LIC-1002", insurance_expires_on: "2029-06-30" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /rehab/contractors/${c2_id}/status"
              payload: { approved_list_status: "PROBATION", reason: "Late close-out paperwork" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /rehab/contractors/${c2_id}/status"
              payload: { approved_list_status: "APPROVED", reason: "Paperwork cured" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /rehab/contractors/${c2_id}/status"
              payload: { approved_list_status: "SUSPENDED", reason: "Insurance lapse" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /rehab/contractors/${c2_id}/status"
              payload: { approved_list_status: "REMOVED", reason: "Debarment" }
              as: ProgramManager
              as_user_id: "pm-1"
          assert:
            - "each of the four calls returns 200 and Contractor.${c2_id}.approved_list_status ends the sequence at REMOVED"
            - "the PROBATION -> APPROVED and SUSPENDED -> APPROVED legs both succeed and leave performance_score at 100 with sanction_count 0"
            - "version increments once per successful call (1 -> 5)"
            - "a fifth call setting approved_list_status APPROVED from the terminal REMOVED returns HTTP 409 ERR_INVALID_STATE"
            - "a call with approved_list_status DEBARRED (not an enum member) returns HTTP 400 ERR_INVALID_REQUEST"

      - name: an_adverse_shpo_outcome_blocks_the_application_conditionally
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/rehab/applications/{application_id}/historic-clearance
          - state_machines.RehabApplication.compliance_posture
          - entities.RehabApplication.fields.historic_review_required
        distinguishing_aspect: "historic-clearance behaves three different ways off the same endpoint depending on the outcome it is handed: NO_EFFECT clears a HISTORIC_HOLD to CLEAR, CONDITIONS moves it to CLEARED_WITH_PROTOCOL, and ADVERSE_EFFECT parks it in the terminal ADVERSE_EFFECT_BLOCKED — the last one is not merely a different field value, it is a dead end for lien recording."
        test_recipe:
          setup:
            - "one ProgramYear 2026, one income-verified Applicant"
            - "one RehabApplication for a 1995 dwelling inside a historic district — historic_review_required true, lead_review_required false, so compliance_posture is HISTORIC_HOLD"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Odell Marsh", email: "odell@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000, household_assets_cents: 5000000, dependents_count: 2 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { hh_id: $.data.id }
            - call: "POST /rehab/applicants/${hh_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/applications"
              payload: { applicant_id: "${hh_id}", address_line1: "7 Chapel Green", city: "Fairview", state_code: "OH", year_built: 1995, assessed_value_cents: 16000000, senior_lien_balance_cents: 10000000, historic_district: true, occupancy_type: "OWNER_OCCUPIED_SINGLE", ownership_doc_type: "WARRANTY_DEED" }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /rehab/applications/${app_id}/historic-clearance"
              payload: { shpo_review_outcome: "ADVERSE_EFFECT" }
              as: ProgramManager
              as_user_id: "pm-1"
          assert:
            - "before the trigger: RehabApplication.${app_id}.compliance_posture == HISTORIC_HOLD and historic_review_required == true"
            - "the trigger returns HTTP 200 with compliance_posture == ADVERSE_EFFECT_BLOCKED"
            - "a second historic-clearance call with shpo_review_outcome NO_EFFECT returns HTTP 409 ERR_INVALID_STATE (ADVERSE_EFFECT_BLOCKED is terminal)"
            - "re-running the chain with shpo_review_outcome NO_EFFECT yields compliance_posture CLEAR, and with CONDITIONS yields CLEARED_WITH_PROTOCOL"

      - name: write_up_totals_read_back_identically_from_the_single_get_and_the_filtered_list
        claim_type: Computed read
        grounds:
          - endpoints.GET_/rehab/write-ups/{write_up_id}
          - endpoints.GET_/rehab/write-ups
          - calculations.work_write_up_estimate
          - consistency_model
        distinguishing_aspect: "The derived estimate is stored on the write-up rather than recomputed per reader: after two line items the single GET and the application-filtered list report the same base 2,500,000 / contingency 250,000 / total 2,750,000 / priority subtotal 2,000,000, and the numbers are already correct in the POST response that created the second line."
        test_recipe:
          setup:
            - "one INSPECTED RehabApplication (year_built 1995) with a DRAFT WorkWriteUp holding a 2,000,000 HEALTH_SAFETY line and a 500,000 GENERAL_PROPERTY_IMPROVEMENT line"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
