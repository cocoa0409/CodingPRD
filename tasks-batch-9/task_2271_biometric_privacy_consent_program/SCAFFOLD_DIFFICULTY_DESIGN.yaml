              payload: { data_subject_id: "${s1_id}", asset_id: "${asset_id}", locale: "en", written_release_acknowledged: true, signature_ref: "sig-emp1-r1" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { c1_id: $.data.id }
            - call: "POST /consent-records/${c1_id}/transitions"
              payload: { to_status: "GRANTED" }
              as: HRAdministrator
              as_user_id: "hr-1"
            - call: "POST /consent-records/${c1_id}/transitions"
              payload: { to_status: "REVOKED", revocation_reason: "employee withdrew consent" }
              as: HRAdministrator
              as_user_id: "hr-1"
