            - "AlignmentAssessment.${scr1}.combined_monthly_expense_cents == 16666668"
            - "AlignmentAssessment.${scr1}.reserve_months == 5.99"
            - "AlignmentAssessment.${scr2}.sequence_no == 2"
            - "AlignmentAssessment.${scr2}.combined_monthly_expense_cents == 58333334"
            - "AlignmentAssessment.${scr2}.reserve_months == 0.86"
            - "AlignmentAssessment.${scr2}.sustainability_points == 0.00"
            - "the AlignmentAssessment response body carries no version field"
            - "the AlignmentAssessment response body carries no updated_at field"
            - "Organization.${org_a}.monthly_expense_cents == 50000000"

      - name: restricted_fund_create_with_unknown_org_id_returns_organization_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_4_ERR_ORGANIZATION_NOT_FOUND
          - entities.RestrictedFund.fields.org_id
        distinguishing_aspect: "org_id is a body foreign key rather than a path segment, so an unknown value must still resolve to ERR_ORGANIZATION_NOT_FOUND at 404 - not a 422 referential error and not an orphan fund row."
