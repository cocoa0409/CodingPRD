              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "first", estimated_cost_cents: 5000 }
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "PAINT", description: "second", estimated_cost_cents: 8000 }
              as: TurnCoordinator
              captures: { ip: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "PaintPros", trade: "PAINT" }
              as: PropertyManager
              captures: { v: $.data.id }
          trigger:
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${ip}", vendor_id: "${v}", start_date: "2026-08-05", end_date: "2026-08-07" }
              as: TurnCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEQUENCE_VIOLATION (http 422); ScopeItem.${ip}.status remains PLANNED"

  # ------------------------------------------------------------------- rbac
  - section: rbac
    instances:
      - name: vendor_cannot_create_scope_items
        claim_type: rbac_denial
        grounds: [roles, endpoints]
        distinguishing_aspect: "Vendor role is not in POST /scope-items roles → 403 ERR_UNAUTHORIZED even with a well-formed payload referencing a real turn."
        test_recipe:
