scenario: "276. Recording / Rehearsal Studio Booking: room/equipment inventory, hourly/block booking, engineer assignment, deposit & overtime, gear-rental add-on, lockout/recurring, cancellation, file/session delivery"
domain_name: recording-rehearsal-studio-booking
api_prefix: "/studio"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities (Room, Engineer, GearItem, Client) joined to Booking by FK
  # references in the request body; Booking children (GearRental,
  # EngineerAssignment, OvertimeRecord, Payment, SessionDelivery) hang off
  # Booking by FK. No deep nesting in URL paths beyond one level of sub-resource.

  state_machine_shape: parallel
  # Booking carries two INDEPENDENT state dimensions that evolve separately:
  # schedule_status (the calendar lifecycle: HELD → CONFIRMED → IN_SESSION →
  # COMPLETED, with CANCELLED branch) and settlement_status (the money
  # lifecycle: AWAITING_DEPOSIT → DEPOSIT_PAID → BALANCE_DUE → SETTLED, with
  # REFUNDING/REFUNDED branch). SessionDelivery adds a cyclic revision loop.

  relationship_patterns:
    - one_to_many        # Studio→Room/Engineer/GearItem; Booking→children
    - cross_aggregate    # Booking references Room, Engineer, GearItem, Client
    - self_referential   # Booking.parent_series_id → Booking.id (recurring occurrences)

  role_model: peer_roles
  # StudioManager owns inventory + confirms/cancels; Engineer acts on own
  # assignments + uploads deliverables; Client owns own bookings + pays.
  # StudioManager is the operational superset for inventory but engineers and
  # clients own disjoint resource types — peer ownership, not a strict hierarchy.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Studio
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: studio display name
      - name: timezone
        type: string
        source: input
        description: IANA tz used to interpret booking local times
        default: "UTC"
      - name: deposit_pct
        type: number
        source: input
        description: fraction of base_charge required as deposit at confirmation
        default: 0.30
        constraints: "0 < deposit_pct <= 1"
      - name: overtime_multiplier
        type: number
        source: input
        description: surcharge multiplier applied to the room hourly rate for overtime minutes
        default: 1.5
        constraints: ">= 1"
      - name: overtime_grace_minutes
        type: integer
        source: input
        description: minutes past scheduled end before overtime billing begins
        default: 10
        constraints: ">= 0"
      - name: cancellation_tier_hours
        type: integer
        source: input
        description: hours-before-start cutoff separating the full-refund tier from the partial-refund tier
        default: 48
        constraints: ">= 0"
      - name: late_cancel_fee_pct
        type: number
        source: input
        description: fraction of base_charge retained as a fee when cancelling inside the partial tier
        default: 0.50
        constraints: "0 <= late_cancel_fee_pct <= 1"

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: input
        description: "FK -> Studio.id"
      - name: name
        type: string
        source: input
        description: room display name
      - name: hourly_rate_cents
        type: integer
        source: input
        description: per-hour rate in cents for hourly bookings
        constraints: ">= 0"
      - name: block_rate_cents
        type: integer
        source: input
        description: flat rate in cents for a full block booking (covers block_hours hours)
        constraints: ">= 0"
      - name: block_hours
        type: integer
        source: input
        description: number of contiguous hours a single block covers
        default: 8
        constraints: ">= 1"
      - name: turnaround_minutes
        type: integer
        source: input
        description: mandatory buffer enforced after a booking's end before the room may be occupied again
        default: 30
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "OPEN when bookable, LOCKED when a lockout contract holds the room"
        default: "OPEN"
        constraints: "one of {OPEN, LOCKED}"

  - name: Engineer
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: input
        description: "FK -> Studio.id"
      - name: full_name
        type: string
        source: input
        description: engineer name
      - name: tier
        type: enum
        source: input
        description: skill tier driving the assignment fee
        constraints: "one of {ASSISTANT, STAFF, SENIOR}"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: per-hour engineering labor rate in cents
        constraints: ">= 0"
      - name: active
        type: boolean
        source: input
        description: whether this engineer may be assigned to new bookings
        default: true

  - name: GearItem
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: input
        description: "FK -> Studio.id"
      - name: name
        type: string
        source: input
        description: gear display name
      - name: total_units
        type: integer
        source: input
        description: total physical units of this gear the studio owns
        constraints: ">= 1"
      - name: daily_rate_cents
        type: integer
        source: input
        description: rental rate in cents per unit per rental-day (any started 24h window)
        constraints: ">= 0"
      - name: requires_engineer
        type: boolean
        source: input
        description: when true, a GearRental of this item requires the booking to carry at least one EngineerAssignment
        default: false

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: input
        description: "FK -> Studio.id"
      - name: display_name
        type: string
        source: input
        description: client/band name
      - name: email
        type: string
        source: input
        description: contact email; unique per studio
        constraints: "unique within studio_id"
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: refund credit balance held for this client, increased by WALLET refunds and consumed on later payments
        default: 0

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: input
        description: "FK -> Studio.id"
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id"
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: parent_series_id
        type: string
        source: input
        description: "FK -> Booking.id; null for standalone bookings, set on each occurrence generated from a recurring/lockout anchor booking"
        default: null
      - name: booking_kind
        type: enum
        source: input
        description: pricing/occupancy mode
        constraints: "one of {HOURLY, BLOCK, LOCKOUT}"
      - name: is_series_anchor
        type: boolean
        source: computed
        description: true when this Booking is the anchor of a recurring/lockout series (occurrences point back to it via parent_series_id)
        default: false
      - name: start_at
        type: datetime
        source: input
        description: scheduled session start (ISO 8601 UTC)
      - name: end_at
        type: datetime
        source: input
        description: scheduled session end (ISO 8601 UTC); must be after start_at
      - name: actual_end_at
        type: datetime
        source: input
        description: real end timestamp recorded at checkout; drives overtime
        default: null
      - name: schedule_status
        type: enum
        source: computed
        description: calendar lifecycle dimension
        default: "HELD"
        constraints: "one of {HELD, CONFIRMED, IN_SESSION, COMPLETED, CANCELLED}"
      - name: settlement_status
        type: enum
        source: computed
        description: money lifecycle dimension, evolves independently of schedule_status
        default: "AWAITING_DEPOSIT"
        constraints: "one of {AWAITING_DEPOSIT, DEPOSIT_PAID, BALANCE_DUE, SETTLED, REFUNDING, REFUNDED}"
      - name: base_charge_cents
        type: integer
        source: computed
        description: room time charge before gear, engineering, overtime; HOURLY = ceil(hours)*hourly_rate, BLOCK/LOCKOUT = block multiples
        default: 0
      - name: deposit_due_cents
        type: integer
        source: computed
        description: deposit amount required at confirmation = round_half_up(base_charge_cents * Studio.deposit_pct)
        default: 0
      - name: overtime_cents
        type: integer
        source: computed
        description: overtime surcharge accrued at checkout
        default: 0
      - name: total_charge_cents
        type: integer
        source: computed
        description: final grand total reconciled at checkout = base + gear + engineering + overtime
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: sum of non-reversed inbound Payment.amount_cents (DEPOSIT, BALANCE) for this booking
        default: 0
      - name: hold_expires_at
        type: datetime
        source: computed
        description: timestamp after which an unconfirmed HELD booking is auto-released by the sweep
        default: null

  - name: GearRental
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id"
      - name: gear_item_id
        type: string
        source: input
        description: "FK -> GearItem.id"
      - name: units
        type: integer
        source: input
        description: number of units rented for this booking
        constraints: ">= 1"
      - name: rental_days
        type: integer
        source: computed
        description: ceil(booking scheduled duration / 24h), minimum 1
        default: 1
      - name: charge_cents
        type: integer
        source: computed
        description: units * rental_days * GearItem.daily_rate_cents
        default: 0
      - name: status
        type: enum
        source: computed
        description: rental line lifecycle
        default: "RESERVED"
        constraints: "one of {RESERVED, RELEASED}"

  - name: EngineerAssignment
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id"
      - name: engineer_id
        type: string
        source: input
        description: "FK -> Engineer.id"
      - name: scheduled_hours
        type: number
        source: computed
        description: ceil-to-quarter-hour of the booking scheduled duration in hours, used for the engineering estimate
        default: 0
      - name: billed_hours
        type: number
        source: computed
        description: actual engineering hours billed at checkout (scheduled + overtime portion)
        default: 0
      - name: charge_cents
        type: integer
        source: computed
        description: billed_hours * Engineer.hourly_rate_cents (estimate uses scheduled_hours)
        default: 0
      - name: status
        type: enum
        source: computed
        description: assignment lifecycle
        default: "ASSIGNED"
        constraints: "one of {ASSIGNED, RELEASED}"

  - name: OvertimeRecord
    parent: Booking
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id"
      - name: overage_minutes
        type: integer
        source: computed
        description: billable overtime minutes = max(0, (actual_end_at - end_at) in minutes - Studio.overtime_grace_minutes)
        default: 0
      - name: room_surcharge_cents
        type: integer
        source: computed
        description: room overtime charge = round_half_up(overage_minutes/60 * Room.hourly_rate_cents * Studio.overtime_multiplier)
        default: 0
      - name: engineer_surcharge_cents
        type: integer
        source: computed
        description: engineering overtime charge summed across assignments = round_half_up(overage_minutes/60 * Engineer.hourly_rate_cents) per assignment
        default: 0

  - name: Payment
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id"
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: kind
        type: enum
        source: input
        description: payment direction/purpose
        constraints: "one of {DEPOSIT, BALANCE, REFUND}"
      - name: amount_cents
        type: integer
        source: input
        description: signed magnitude; DEPOSIT/BALANCE inbound positive, REFUND outbound positive (sign handled by kind)
        constraints: ">= 1"
      - name: refund_destination
        type: enum
        source: input
        description: where a REFUND lands; ignored for DEPOSIT/BALANCE
        default: "ORIGINAL"
        constraints: "one of {ORIGINAL, WALLET}"
      - name: reversed
        type: boolean
        source: computed
        description: true when this payment was reversed by a later compensating refund
        default: false

  - name: LockoutContract
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: input
        description: "FK -> Studio.id"
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id"
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: weekday_mask
        type: array
        source: input
        description: list of ISO weekday integers (1=Mon..7=Sun) the lockout reserves
        constraints: "non-empty; each in 1..7"
      - name: daily_start_local
        type: string
        source: input
        description: "local HH:MM start applied on each masked weekday"
      - name: daily_end_local
        type: string
        source: input
        description: "local HH:MM end applied on each masked weekday; after daily_start_local"
      - name: window_start_date
        type: datetime
        source: input
        description: first calendar date (UTC midnight) the lockout is active
      - name: window_end_date
        type: datetime
        source: input
        description: last calendar date (UTC midnight, inclusive) the lockout is active
      - name: status
        type: enum
        source: computed
        description: contract lifecycle
        default: "DRAFT"
        constraints: "one of {DRAFT, ACTIVE, TERMINATED}"
      - name: occurrences_generated
        type: integer
        source: computed
        description: count of Booking occurrences materialized from this contract on activation
        default: 0

  - name: SessionDelivery
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id"
      - name: file_manifest
        type: array
        source: input
        description: list of delivered file descriptors (name + size)
      - name: revision_round
        type: integer
        source: computed
        description: increments by 1 each time the client requests a revision and the engineer re-uploads
        default: 0
      - name: status
        type: enum
        source: computed
        description: delivery lifecycle with a client-driven revision loop
        default: "DRAFT"
        constraints: "one of {DRAFT, DELIVERED, REVISION_REQUESTED, ACCEPTED}"

  - name: Clock
    parent: null
    common_fields: false
    fields:
      - name: current_utc
        type: datetime
        source: system
        description: server-controlled wall clock; all time-relative computations (hold expiry, cancellation tiers, sweep) read this

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Booking
    initial_state: HELD
    terminal_states: [COMPLETED, CANCELLED]
    note: |
      Booking carries TWO independent dimensions. schedule_status (below) is the
      calendar lifecycle. settlement_status is a parallel money dimension defined
      in the second Booking machine block. A single Booking row advances on each
      axis independently; e.g. a CONFIRMED booking can be DEPOSIT_PAID or
      BALANCE_DUE depending only on payment events, and an IN_SESSION booking is
      still DEPOSIT_PAID until checkout reconciles the balance.
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /studio/bookings/{id}/confirm"
        actor: StudioManager
        preconditions:
          - "schedule_status == HELD"
          - "settlement_status == DEPOSIT_PAID (the deposit Payment has cleared)"
          - "Room.status == OPEN OR this booking is an occurrence of the LockoutContract that LOCKED the room"
          - "no other Booking with schedule_status IN {CONFIRMED, IN_SESSION} overlaps [start_at, end_at + Room.turnaround_minutes) on the same room"
        side_effects:
          - "clear hold_expires_at (set null)"
          - "increments Booking.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /studio/bookings/{id}/cancel"
        actor: StudioManager | Client
        preconditions:
          - "schedule_status IN {HELD, CONFIRMED}"
        side_effects:
          - "compute refund per cancellation_refund calc; create REFUND Payment with refund_destination=WALLET if amount_paid_cents > 0 (studio policy: cancellation refunds are issued as wallet credit)"
          - "set settlement_status -> REFUNDING then REFUNDED (see settlement machine)"
          - "release every GearRental (status RESERVED -> RELEASED) of this booking"
          - "release every EngineerAssignment (status ASSIGNED -> RELEASED) of this booking"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /studio/bookings/{id}/cancel"
        actor: StudioManager | Client
        preconditions:
          - "schedule_status == CONFIRMED"
          - "Clock.current_utc < start_at (cannot cancel after the session has started)"
        side_effects:
          - "compute refund per cancellation_refund calc (tiered on hours-before-start)"
          - "create REFUND Payment for the refundable amount with refund_destination=WALLET; retained fee stays with studio"
          - "settlement_status -> REFUNDING -> REFUNDED"
          - "release all GearRental and EngineerAssignment children"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: IN_SESSION
        trigger: "POST /studio/bookings/{id}/check-in"
        actor: StudioManager
        preconditions:
          - "schedule_status == CONFIRMED"
          - "Clock.current_utc >= start_at"
          - "every GearRental whose GearItem.requires_engineer == true has at least one EngineerAssignment on this booking"
        side_effects:
          - "increments Booking.version by 1"
      - from: IN_SESSION
        to: COMPLETED
        trigger: "POST /studio/bookings/{id}/check-out"
        actor: StudioManager
        preconditions:
          - "schedule_status == IN_SESSION"
          - "actual_end_at provided and >= start_at"
        side_effects:
          - "create OvertimeRecord; compute overtime_cents (room + engineer surcharges)"
          - "recompute total_charge_cents = base_charge_cents + sum(GearRental.charge_cents) + sum(EngineerAssignment.charge_cents at billed_hours) + overtime_cents"
          - "set EngineerAssignment.billed_hours and charge_cents using overtime hours"
          - "settlement_status DEPOSIT_PAID -> BALANCE_DUE (balance now owed)"
          - "increments Booking.version by 1"

  - entity: Booking
    initial_state: AWAITING_DEPOSIT
    terminal_states: [SETTLED, REFUNDED]
    note: |
      settlement_status — the parallel money dimension on the SAME Booking row.
      Advances on Payment events and on check-out, independently of schedule_status.
    transitions:
      - from: AWAITING_DEPOSIT
        to: DEPOSIT_PAID
        trigger: "POST /studio/bookings/{id}/payments (kind=DEPOSIT)"
        actor: Client
        preconditions:
          - "settlement_status == AWAITING_DEPOSIT"
          - "amount_cents == Booking.deposit_due_cents (exact deposit, no partials)"
        side_effects:
          - "recompute amount_paid_cents"
          - "increments Booking.version by 1"
      - from: BALANCE_DUE
        to: SETTLED
        trigger: "POST /studio/bookings/{id}/payments (kind=BALANCE)"
        actor: Client
        preconditions:
          - "settlement_status == BALANCE_DUE"
          - "amount_cents == total_charge_cents - amount_paid_cents (exact remaining balance)"
        side_effects:
          - "recompute amount_paid_cents"
          - "consume Client.wallet_credit_cents first if present, then external amount (see balance calc variant)"
          - "increments Booking.version by 1"
      - from: DEPOSIT_PAID
        to: REFUNDING
        trigger: "system: cancellation side-effect"
        actor: system
        preconditions:
          - "Booking schedule_status transitioning to CANCELLED"
        side_effects:
          - "mark prior inbound Payments reversed where refunded"
      - from: BALANCE_DUE
        to: REFUNDING
        trigger: "system: cancellation side-effect"
        actor: system
        preconditions:
          - "Booking schedule_status transitioning to CANCELLED"
        side_effects: []
      - from: REFUNDING
        to: REFUNDED
        trigger: "system: refund Payment created"
        actor: system
        preconditions:
          - "REFUND Payment created with the computed refundable amount"
        side_effects:
          - "if refund_destination == WALLET, increment Client.wallet_credit_cents by refund amount"
          - "increments Booking.version by 1"

  - entity: LockoutContract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /studio/lockout-contracts/{id}/activate"
        actor: StudioManager
        preconditions:
          - "status == DRAFT"
          - "Room.status == OPEN"
          - "no CONFIRMED/IN_SESSION Booking on the room overlaps any generated occurrence window (per lockout interval semantics)"
        side_effects:
          - "set Room.status -> LOCKED"
          - "materialize one anchor Booking (is_series_anchor=true, booking_kind=LOCKOUT) plus one occurrence Booking per masked weekday in window; each occurrence parent_series_id = anchor.id, schedule_status=CONFIRMED, settlement_status=DEPOSIT_PAID"
          - "set occurrences_generated to the count of materialized occurrences"
          - "increments LockoutContract.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /studio/lockout-contracts/{id}/terminate"
        actor: StudioManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "set Room.status -> OPEN"
          - "cancel every future occurrence Booking (schedule_status CONFIRMED -> CANCELLED) whose start_at > Clock.current_utc"
          - "each cancelled occurrence releases its GearRental/EngineerAssignment children (transitive)"
          - "increments LockoutContract.version by 1"

  - entity: SessionDelivery
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    note: "Cyclic revision loop: DELIVERED -> REVISION_REQUESTED -> DELIVERED, bounded by client acceptance."
    transitions:
      - from: DRAFT
        to: DELIVERED
        trigger: "POST /studio/bookings/{id}/delivery/deliver"
        actor: Engineer
        preconditions:
          - "Booking.schedule_status == COMPLETED"
          - "Booking.settlement_status == SETTLED"
          - "file_manifest non-empty"
        side_effects:
          - "increments SessionDelivery.version by 1"
      - from: DELIVERED
        to: REVISION_REQUESTED
        trigger: "POST /studio/bookings/{id}/delivery/request-revision"
        actor: Client
        preconditions:
          - "status == DELIVERED"
        side_effects:
          - "increments SessionDelivery.version by 1"
      - from: REVISION_REQUESTED
        to: DELIVERED
        trigger: "POST /studio/bookings/{id}/delivery/deliver"
        actor: Engineer
        preconditions:
          - "status == REVISION_REQUESTED"
          - "file_manifest non-empty"
        side_effects:
          - "increment revision_round by 1"
          - "increments SessionDelivery.version by 1"
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /studio/bookings/{id}/delivery/accept"
        actor: Client
        preconditions:
          - "status == DELIVERED"
        side_effects:
          - "increments SessionDelivery.version by 1"

  - entity: GearRental
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: RELEASED
        trigger: "DELETE /studio/bookings/{id}/gear-rentals/{rentalId} OR cascade from booking cancel"
        actor: StudioManager | system
        preconditions:
          - "parent Booking.schedule_status != COMPLETED"
        side_effects:
          - "frees the reserved units of GearItem for the booking window"
          - "increments GearRental.version by 1"

  - entity: EngineerAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "DELETE /studio/bookings/{id}/engineer-assignments/{assignId} OR cascade from booking cancel"
        actor: StudioManager | system
        preconditions:
          - "parent Booking.schedule_status NOT IN {IN_SESSION, COMPLETED}"
        side_effects:
          - "increments EngineerAssignment.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: gear-rental-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /studio/bookings/{id}/gear-rentals"
    occ_field: "expected_booking_version"
    description: |
      Adding a GearRental to a Booking whose version has advanced since the
      client last observed it is rejected with a stale-version error. This
      captures the case where another writer has already added a gear line
      (or another mutation has cascaded onto the booking, recomputing its
      derived totals) so the current writer's view of the booking — and of
      the gear units still available for its window — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: lockout-activate-stale-room
    parent_entity: Room
    write_endpoint: "POST /studio/lockout-contracts/{id}/activate"
    occ_field: "expected_room_version"
    description: |
      Activating a LockoutContract against a Room whose version has advanced
      since the client last read it is rejected. Another writer may have just
      LOCKED the room via a different contract (bumping Room.version), so the
      current activation's view of the room as OPEN is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: base_charge
    trigger: "on POST /studio/bookings (create) and recomputed on check-out"
    algorithm: tiered_pricing
    formula: |
      duration_hours = (end_at - start_at) / 3600 seconds
      if booking_kind == HOURLY:
          billable_hours = ceil(duration_hours)           # any partial hour rounds UP to a full hour
          base = billable_hours * Room.hourly_rate_cents
      elif booking_kind in {BLOCK, LOCKOUT}:
          blocks = ceil(duration_hours / Room.block_hours) # straddling a block boundary buys another whole block
          base = blocks * Room.block_rate_cents
    input_set: "the single Booking being priced; uses its own room_id, start_at, end_at, booking_kind"
    constants: {}
    precision: "integer cents; ceil applies to hours/blocks BEFORE multiplying by the rate"
    variants:
      - name: hourly_ceiling
        when: "booking_kind == HOURLY"
        difference: "rounds partial hours UP to whole hours, then multiplies by hourly_rate_cents"
      - name: block_ceiling
        when: "booking_kind in {BLOCK, LOCKOUT}"
        difference: "rounds partial blocks UP to whole blocks, then multiplies by block_rate_cents; a 9h block-8h booking costs 2 blocks"

  - name: gear_rental_charge
    trigger: "on POST /studio/bookings/{id}/gear-rentals (create)"
    algorithm: aggregation
    formula: |
      booking_duration_hours = (Booking.end_at - Booking.start_at) / 3600
      rental_days = max(1, ceil(booking_duration_hours / 24))   # each started 24h window is one rental-day
      charge_cents = units * rental_days * GearItem.daily_rate_cents
    input_set: "single GearRental line; reads its booking's scheduled window and the GearItem daily rate"
    constants: { HOURS_PER_RENTAL_DAY: 24 }
    precision: "integer cents; ceil applies to rental_days before multiplying"

  - name: engineering_charge
    trigger: "estimate on POST /studio/bookings/{id}/engineer-assignments; finalized on check-out"
    algorithm: tiered_pricing
    formula: |
      duration_hours = (Booking.end_at - Booking.start_at) / 3600
      scheduled_hours = ceil(duration_hours * 4) / 4          # round UP to next quarter hour
      estimate_charge_cents = round_half_up(scheduled_hours * Engineer.hourly_rate_cents)
      # at check-out, billed_hours adds the overtime portion:
      overtime_hours = OvertimeRecord.overage_minutes / 60
      billed_hours = scheduled_hours + (ceil(overtime_hours * 4) / 4)
      final_charge_cents = round_half_up(billed_hours * Engineer.hourly_rate_cents)
    input_set: "single EngineerAssignment; reads its booking window, the engineer's rate, and (at checkout) the OvertimeRecord"
    constants: { QUARTER_HOUR: 0.25 }
    precision: "round_half_up to integer cents; quarter-hour rounding happens on HOURS first, THEN multiply by rate, THEN round cents"
    variants:
      - name: assignment_estimate
        when: "at POST /engineer-assignments time"
        difference: "uses scheduled_hours only (no overtime); this is the FORWARD-LOOKING estimate"
      - name: assignment_final
        when: "at check-out"
        difference: "uses billed_hours = scheduled_hours + rounded overtime hours; this is the CHRONOLOGICAL/actual figure and can exceed the estimate"

  - name: overtime_surcharge
    trigger: "on POST /studio/bookings/{id}/check-out"
    algorithm: threshold
    formula: |
      raw_over_minutes = max(0, (actual_end_at - end_at) in whole minutes)
      overage_minutes = max(0, raw_over_minutes - Studio.overtime_grace_minutes)   # grace subtracted AFTER computing raw overage
      room_surcharge_cents = round_half_up((overage_minutes / 60) * Room.hourly_rate_cents * Studio.overtime_multiplier)
      engineer_surcharge_cents = sum over ASSIGNED EngineerAssignment of
          round_half_up((ceil((overage_minutes/60) * 4)/4) * Engineer.hourly_rate_cents)
      overtime_cents = room_surcharge_cents + engineer_surcharge_cents
    input_set: "the booking, its Room, Studio constants, and all non-RELEASED EngineerAssignment children"
    constants: { MINUTES_PER_HOUR: 60 }
    precision: "round_half_up to integer cents; grace is subtracted from raw minutes BEFORE the /60 conversion; boundary: overage_minutes>0 (strictly greater than grace) triggers billing"

  - name: cancellation_refund
    trigger: "on POST /studio/bookings/{id}/cancel"
    algorithm: threshold
    formula: |
      hours_before_start = (start_at - Clock.current_utc) / 3600
      if schedule_status == HELD:
          # never confirmed, only a deposit may exist -> full refund of whatever was paid
          refund_cents = amount_paid_cents
      elif hours_before_start >= Studio.cancellation_tier_hours:
          refund_cents = amount_paid_cents                       # full refund tier (early cancel)
      else:
          fee_cents = round_half_up(base_charge_cents * Studio.late_cancel_fee_pct)
          refund_cents = max(0, amount_paid_cents - fee_cents)   # partial tier; studio retains the fee
    input_set: "the booking, its amount_paid_cents, base_charge_cents, the studio cancellation constants, and Clock.current_utc"
    constants: {}
    precision: "integer cents, round_half_up; boundary: hours_before_start EXACTLY == cancellation_tier_hours is the FULL-refund tier (>= is inclusive)"
    variants:
      - name: held_full_refund
        when: "schedule_status == HELD at cancel time"
        difference: "always refunds amount_paid_cents in full regardless of timing"
      - name: confirmed_tiered
        when: "schedule_status == CONFIRMED at cancel time"
        difference: "full refund only if >= cancellation_tier_hours before start; else retains late_cancel_fee_pct of base_charge"

  - name: balance_settlement
    trigger: "on POST /studio/bookings/{id}/payments (kind=BALANCE)"
    algorithm: waterfall_allocation
    formula: |
      remaining_balance = total_charge_cents - amount_paid_cents
      # waterfall: client wallet credit is consumed FIRST, then the external payment covers the rest
      wallet_applied = min(Client.wallet_credit_cents, remaining_balance)
      external_required = remaining_balance - wallet_applied
      # the submitted Payment.amount_cents MUST equal external_required (exact)
    input_set: "the booking total/paid, plus the paying Client's wallet_credit_cents"
    constants: {}
    precision: "integer cents; wallet bucket drained before external bucket; if wallet fully covers balance, external_required == 0 and a BALANCE Payment with amount_cents>0 is rejected"
    variants:
      - name: no_wallet
        when: "Client.wallet_credit_cents == 0"
        difference: "external_required == remaining_balance; full balance paid externally"
      - name: wallet_offset
        when: "Client.wallet_credit_cents > 0"
        difference: "wallet drained first; external_required = remaining_balance - min(wallet, remaining_balance); wallet decremented by wallet_applied"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /studio/clients/register and POST /studio (bootstrap)"
  - priority: 2
    category: auth
    check: "the role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path/body referenced resource exists, validated left-to-right in the path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: business_referential
    check: "ownership: a Client may only act on Bookings whose client_id == X-User-ID; an Engineer may only act on deliveries of Bookings carrying their own EngineerAssignment"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "Client/Engineer-scoped booking & delivery endpoints"
  - priority: 5
    category: state
    check: "target resource is in a state from which this transition is defined (§1.2 from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the live parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /studio/bookings/{id}/gear-rentals, POST /studio/lockout-contracts/{id}/activate"
  - priority: 7
    category: business_temporal
    check: "end_at strictly after start_at on booking create; daily_end_local after daily_start_local on lockout"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /studio/bookings, POST /studio/lockout-contracts"
  - priority: 8
    category: business_safety
    check: "requires_engineer gear: at check-in, any RESERVED GearRental whose GearItem.requires_engineer is true must have >=1 ASSIGNED EngineerAssignment on the booking"
    error_id: ERR_ENGINEER_REQUIRED
    http_status: 422
    applies_to: "POST /studio/bookings/{id}/check-in"
  - priority: 9
    category: business_constraint
    check: "room temporal overlap: the requested [start_at, end_at + Room.turnaround_minutes) must not collide with any CONFIRMED/IN_SESSION booking on the same room (turnaround buffer included)"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /studio/bookings/{id}/confirm"
  - priority: 10
    category: business_constraint
    check: "lockout overlap: every materialized occurrence window must not collide with any CONFIRMED/IN_SESSION booking on the room; lockout windows use closed-interval day boundaries (no turnaround buffer between same-contract occurrences)"
    error_id: ERR_LOCKOUT_CONFLICT
    http_status: 409
    applies_to: "POST /studio/lockout-contracts/{id}/activate"
  - priority: 11
    category: business_constraint
    check: "gear capacity: sum of units across all RESERVED GearRentals of the same GearItem whose booking windows overlap the new booking's window must not exceed GearItem.total_units"
    error_id: ERR_GEAR_UNAVAILABLE
    http_status: 409
    applies_to: "POST /studio/bookings/{id}/gear-rentals"
  - priority: 12
    category: business_constraint
    check: "engineer double-booking: an Engineer cannot hold ASSIGNED EngineerAssignments on two bookings whose windows overlap"
    error_id: ERR_ENGINEER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /studio/bookings/{id}/engineer-assignments"
  - priority: 13
    category: business_fiscal
    check: "deposit exactness: DEPOSIT payment amount_cents must equal Booking.deposit_due_cents"
    error_id: ERR_DEPOSIT_MISMATCH
    http_status: 422
    applies_to: "POST /studio/bookings/{id}/payments (kind=DEPOSIT)"
  - priority: 14
    category: business_fiscal
    check: "balance exactness: BALANCE payment amount_cents must equal (total_charge_cents - amount_paid_cents - wallet_applied) per the waterfall; if external_required==0 a positive BALANCE payment is rejected"
    error_id: ERR_BALANCE_MISMATCH
    http_status: 422
    applies_to: "POST /studio/bookings/{id}/payments (kind=BALANCE)"
  - priority: 15
    category: business_constraint
    check: "email uniqueness within studio on client register"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /studio/clients/register"

