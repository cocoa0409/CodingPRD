          Two submit-time gates in their declared order. A partial attempt (1 recorded point out of 3)
          fails 422 ERR_INCOMPLETE_CHECKLIST at priority 19 even though a reconditioning row is also
          outstanding; only once the attempt is complete does the still-REQUIRED repair row surface as
