# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2724 Travel Rewards Portal & Transfer Partner Administration
#
# Companion to SCAFFOLD.yaml (§1.0–§1.7) and SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8).
# Every instance grounds in elements already declared in SCAFFOLD.yaml; this file adds no
# behaviour. Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Corners already asserted by a §1.8 instance appear as
# excluded_because stubs that name that instance.
#
# Logical clock: the server starts at 2026-08-01T00:00:00Z and every recipe below either relies
# on that default or moves it with POST /rewards/_clock/set_current_utc. No recipe waits on
# wall-clock time.

scaffold_corner_design:
  - section: entities
    instances:
      - name: account_creation_returns_envelope_with_system_and_default_fields
        claim_type: creation
        grounds:
          - entities.Account
          - entities.Account.fields.status
          - entities.Account.fields.fraud_posture
          - response_envelope.success
        distinguishing_aspect: "POST /rewards/accounts with the four required inputs returns 201, response_type object, a server-minted id, version 1, and the declared defaults status ACTIVE / fraud_posture CLEAR / points_balance 0."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /rewards/_clock"
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Hana Vidal", email: "hana@example.com", card_product_code: "PREMIER", enrolled_at: "2025-01-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "Account.${a_id}.cardholder_name == Hana Vidal"
            - "Account.${a_id}.card_product_code == PREMIER"
            - "Account.${a_id}.status == ACTIVE"
            - "Account.${a_id}.fraud_posture == CLEAR"
            - "Account.${a_id}.points_balance == 0"
            - "Account.${a_id}.points_pending_redemption == 0"
            - "Account.${a_id}.transfer_hold_count == 0"
            - "Account.${a_id}.terms_notice_id == null"
            - "Account.${a_id}.closed_at == null"
            - "Account.${a_id}.version == 1"

      - name: agency_partner_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.TravelAgencyPartner
          - entities.TravelAgencyPartner.fields.payable_cents
        distinguishing_aspect: "GET /rewards/agency-partners/{id} echoes exactly the row that POST created, including the computed payable_cents default of 0 and status ACTIVE."
        test_recipe:
          setup:
            - "One agency created with markup 2500 bps and tolerance 500 bps."
          setup_api_calls:
            - call: "POST /rewards/agency-partners"
              payload: { name: "Cobalt Concierge", contracted_markup_bps: 2500, parity_tolerance_bps: 500, invoice_terms_days: 45 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag_id: $.data.id }
          trigger:
            - call: "GET /rewards/agency-partners/${ag_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the response status is 200"
            - "TravelAgencyPartner.${ag_id}.name == Cobalt Concierge"
            - "TravelAgencyPartner.${ag_id}.contracted_markup_bps == 2500"
            - "TravelAgencyPartner.${ag_id}.parity_tolerance_bps == 500"
            - "TravelAgencyPartner.${ag_id}.invoice_terms_days == 45"
            - "TravelAgencyPartner.${ag_id}.status == ACTIVE"
            - "TravelAgencyPartner.${ag_id}.payable_cents == 0"

      - name: accounts_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Account
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /rewards/accounts with limit 2 and offset 0 over three accounts returns response_type array with exactly 2 rows, total_count 3 and has_more true; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Three accounts exist: two PREMIER and one CORE."
          setup_api_calls:
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Alpha One", email: "alpha@example.com", card_product_code: "PREMIER", enrolled_at: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Beta Two", email: "beta@example.com", card_product_code: "PREMIER", enrolled_at: "2025-02-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Gamma Three", email: "gamma@example.com", card_product_code: "CORE", enrolled_at: "2025-03-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /rewards/accounts"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /rewards/accounts"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /rewards/accounts"
              payload: { card_product_code: "CORE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the first page returns response_type array with exactly 2 data rows, total_count 3 and has_more true"
            - "the second page returns exactly 1 data row, total_count 3 and has_more false"
            - "the card_product_code CORE filter returns exactly 1 row whose cardholder_name is Gamma Three and total_count 1"

      - name: account_get_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=30]
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "GET /rewards/accounts/{id} with a well-formed UUID that was never minted returns 404 ERR_RESOURCE_NOT_FOUND rather than 200 with an empty body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /rewards/_clock"
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /rewards/accounts/00000000-0000-0000-0000-0000000f0f0f"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the response status is 404"
            - "the response error_id is ERR_RESOURCE_NOT_FOUND"
            - "the response_type is error and data.message names the Account resource"

      - name: account_create_without_email_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=31]
          - errors.ERR_INVALID_REQUEST
          - entities.Account.fields.email
        distinguishing_aspect: "Omitting the required input field email from POST /rewards/accounts returns 400 ERR_INVALID_REQUEST and creates no row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /rewards/_clock"
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "No Email", card_product_code: "CORE", enrolled_at: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the response status is 400"
            - "the response error_id is ERR_INVALID_REQUEST"
            - "GET /rewards/accounts returns total_count 0"

      - name: merchant_category_is_fallback_defaults_to_false
        claim_type: defaults
        grounds:
          - entities.MerchantCategory.fields.is_fallback
          - entities.BenefitEntitlement.fields.requires_portal_booking
        distinguishing_aspect: "Omitting the optional is_fallback input yields false, and omitting requires_portal_booking on a benefit entitlement likewise yields false, so neither optional flag defaults to true."
        test_recipe:
          setup:
            - "One account, so the entitlement has an owner."
          setup_api_calls:
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Dara Kilic", email: "dara@example.com", card_product_code: "CORE", enrolled_at: "2025-04-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5541", display_name: "Service Stations", base_category: "GAS", base_multiplier: 1.5 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { mc_id: $.data.id }
            - call: "POST /rewards/benefit-entitlements"
              payload: { account_id: "${a_id}", benefit_type: "BAGGAGE_FEE_CREDIT", annual_allowance: 2, expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { be_id: $.data.id }
          assert:
            - "MerchantCategory.${mc_id}.is_fallback == false"
            - "BenefitEntitlement.${be_id}.requires_portal_booking == false"
            - "BenefitEntitlement.${be_id}.status == ACTIVE"
            - "BenefitEntitlement.${be_id}.used_count == 0"
            - "BenefitEntitlement.${be_id}.remaining_allowance == 2"

      - name: offer_portal_price_recomputed_and_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.PortalInventoryOffer.fields.portal_price_cents
          - entities.PortalInventoryOffer.fields.cash_copay_cents
          - entities.PortalInventoryOffer.fields.parity_status
          - calculations.redemption_points_price_and_parity
        distinguishing_aspect: "portal_price_cents, cash_copay_cents, parity_status and seats_committed are source computed: a creation payload that also smuggles portal_price_cents 1 and seats_committed 99 must have those values ignored, with portal_price_cents recomputed to 48000 from net 40000 at 2000 bps."
        test_recipe:
          setup:
            - "One ACTIVE agency with contracted_markup_bps 2000 and parity_tolerance_bps 1000."
          setup_api_calls:
            - call: "POST /rewards/agency-partners"
              payload: { name: "Northwind Travel", contracted_markup_bps: 2000, parity_tolerance_bps: 1000, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}", itinerary_code: "IAD-CPH-01", depart_at: "2026-10-01T12:00:00Z", return_at: "2026-10-10T12:00:00Z", net_rate_cents: 40000, agency_public_price_cents: 50000, agency_public_seats: 3, portal_seats: 2, tax_cents: 4000, portal_price_cents: 1, seats_committed: 99 }
              as: AgencySupplier
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id }
          assert:
            - "PortalInventoryOffer.${o_id}.portal_price_cents == 48000"
            - "PortalInventoryOffer.${o_id}.cash_copay_cents == 4000"
            - "PortalInventoryOffer.${o_id}.parity_status == IN_PARITY"
            - "PortalInventoryOffer.${o_id}.seats_committed == 0"
            - "PortalInventoryOffer.${o_id}.status == OPEN"
            - "PortalInventoryOffer.${o_id}.version == 1"

      - name: change_notice_drafted_by_user_id_is_system_captured
        claim_type: system_fields
        grounds:
          - entities.ProgramChangeNotice.fields.drafted_by_user_id
          - entities.ProgramChangeNotice.fields.status
          - entities.ProgramChangeNotice.fields.announced_at
        distinguishing_aspect: "drafted_by_user_id is stamped from the creating X-User-ID rather than accepted from the body, and status / announced_at / approved_by_user_id start at DRAFT / null / null."
        test_recipe:
          setup:
            - "Empty database; the notice does not target an agreement, so change_type is BENEFIT_REMOVAL."
          setup_api_calls:
            - call: "GET /rewards/_clock"
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /rewards/change-notices"
              payload: { notice_code: "NB-2026-01", change_type: "BENEFIT_REMOVAL", effective_at: "2026-12-01T00:00:00Z", grandfather_window_days: 30, cohort_enrolled_before: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-7"
              captures: { pn_id: $.data.id }
          assert:
            - "ProgramChangeNotice.${pn_id}.drafted_by_user_id == admin-7"
            - "ProgramChangeNotice.${pn_id}.status == DRAFT"
            - "ProgramChangeNotice.${pn_id}.announced_at == null"
            - "ProgramChangeNotice.${pn_id}.approved_by_user_id == null"
            - "ProgramChangeNotice.${pn_id}.target_agreement_id == null"
            - "ProgramChangeNotice.${pn_id}.version == 1"

      - name: account_card_product_code_unknown_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Account.fields.card_product_code
          - validations[priority=31]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "card_product_code is constrained to {PREMIER, CORE, LEGACY_GOLD}; a fourth value is refused with 400 ERR_INVALID_REQUEST instead of being stored and silently multiplying earnings by 1.0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /rewards/_clock"
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Ghost Tier", email: "ghost@example.com", card_product_code: "PLATINUM_INFINITE", enrolled_at: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Real Tier", email: "real@example.com", card_product_code: "LEGACY_GOLD", enrolled_at: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_ok_id: $.data.id }
          assert:
            - "the first call returns 400 with error_id ERR_INVALID_REQUEST"
            - "the second call returns 201"
            - "Account.${a_ok_id}.card_product_code == LEGACY_GOLD"
            - "GET /rewards/accounts returns total_count 1"

      - name: ledger_entry_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.PointsLedgerEntry
          - entities.LiabilitySnapshot
          - entities.PointsLedgerEntry.fields.balance_after
        distinguishing_aspect: "PointsLedgerEntry and LiabilitySnapshot are declared common_fields false, so each row exposes id and created_at but no version and no updated_at, and §1.5 declares no update or delete endpoint for either collection — the audit trail is append-only."
        test_recipe:
          setup:
            - "One CORE account with a single 1000000-cent GROCERY transaction, which appends exactly one EARN_BASE ledger entry of 10000 points."
          setup_api_calls:
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Ivo Sund", email: "ivo@example.com", card_product_code: "CORE", enrolled_at: "2025-05-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 1000000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /rewards/points-ledger-entries"
              payload: { account_id: "${a_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "exactly 1 PointsLedgerEntry row is returned for account_id ${a_id}"
            - "that row has entry_type EARN_BASE, points_delta 10000, balance_after 10000, source_entity_type TRANSACTION and source_entity_id ${t_id}"
            - "that row exposes id and created_at but no version field and no updated_at field"
            - "that row's occurred_at == 2026-08-01T00:00:00Z"
            - "no PUT, PATCH or DELETE endpoint exists for /rewards/points-ledger-entries or /rewards/liability-snapshots"

      - name: transaction_unmapped_mcc_falls_back_to_fallback_category
        claim_type: computed_fields
        grounds:
          - calculations.transaction_points_award
          - entities.Transaction.fields.classification_source
          - entities.MerchantCategory.fields.is_fallback
        distinguishing_aspect: "A transaction whose mcc_code matches no MerchantCategory is classified onto the single is_fallback row: classification_source is FALLBACK, merchant_category_id points at the fallback row, and the fallback's base_multiplier 1.0 (not the mapped row's 3.0) drives base_points 500 on 50000 cents for a CORE account."
        test_recipe:
          setup:
            - "Two categories: mcc 5812 DINING at base_multiplier 3.0 (is_fallback false) and mcc 0000 OTHER at base_multiplier 1.0 with is_fallback true."
            - "One CORE account."
          setup_api_calls:
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5812", display_name: "Restaurants", base_category: "DINING", base_multiplier: 3.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "0000", display_name: "Unclassified", base_category: "OTHER", base_multiplier: 1.0, is_fallback: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { mc_fb_id: $.data.id }
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Zola Ferreira", email: "zola@example.com", card_product_code: "CORE", enrolled_at: "2025-06-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "9999", amount_cents: 50000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
          assert:
            - "Transaction.${t_id}.classification_source == FALLBACK"
            - "Transaction.${t_id}.merchant_category_id == ${mc_fb_id}"
            - "Transaction.${t_id}.base_points == 500"
            - "Transaction.${t_id}.bonus_points == 0"
            - "Transaction.${t_id}.total_points_earned == 500"
            - "Transaction.${t_id}.rotation_id == null"
            - "Account.${a_id}.points_balance == 500"

      - name: transaction_for_unknown_account_id_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=30]
          - entities.Transaction.fields.account_id
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "The body FK account_id is resolved before any points arithmetic runs, so a transaction naming a non-existent account returns 404 ERR_RESOURCE_NOT_FOUND and writes no PointsLedgerEntry."
        test_recipe:
          setup:
            - "One MAPPED GROCERY category and no accounts."
          setup_api_calls:
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /rewards/transactions"
              payload: { account_id: "00000000-0000-0000-0000-0000000abcde", mcc_code: "5411", amount_cents: 100000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the response status is 404"
            - "the response error_id is ERR_RESOURCE_NOT_FOUND"
            - "GET /rewards/transactions returns total_count 0"
            - "GET /rewards/points-ledger-entries returns total_count 0"

      - name: flat_topology_children_are_discoverable_by_fk_filters
        claim_type: parent_relationships
        grounds:
          - entities.TransferRequest.fields.account_id
          - entities.PortalInventoryOffer.fields.agency_partner_id
          - entities.RedemptionOrder.fields.inventory_offer_id
        distinguishing_aspect: "entity_topology is flat, so cascade-created and offer-created children are reachable only through the filtered list endpoints: GET /rewards/redemption-orders?inventory_offer_id= finds the order that POST /rewards/inventory-offers/{id}/book minted, and GET /rewards/inventory-offers?agency_partner_id= finds the offer from its agency."
        test_recipe:
          setup:
            - "One CORE account holding 40000 points, one ACTIVE agency with markup 0 and tolerance 0, one OPEN offer at net 10000 with portal_seats 2 and tax 0, and one QUOTED order booked against it."
          setup_api_calls:
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Rune Halle", email: "rune@example.com", card_product_code: "CORE", enrolled_at: "2025-07-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 4000000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/agency-partners"
              payload: { name: "Bare Fare Consolidators", contracted_markup_bps: 0, parity_tolerance_bps: 0, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag_id: $.data.id }
            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}", itinerary_code: "MSP-KEF-06", depart_at: "2026-09-05T20:00:00Z", return_at: "2026-09-12T06:00:00Z", net_rate_cents: 10000, agency_public_price_cents: 10000, agency_public_seats: 2, portal_seats: 2, tax_cents: 0 }
              as: AgencySupplier
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /rewards/inventory-offers/${o_id}/book"
              payload: { account_id: "${a_id}", traveler_name: "Rune Halle", expected_offer_version: "${o_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { ro_id: $.data.id }
          trigger:
            - call: "GET /rewards/redemption-orders"
              payload: { inventory_offer_id: "${o_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /rewards/points-ledger-entries"
              payload: { account_id: "${a_id}", entry_type: "EARN_BASE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the redemption-orders filter returns exactly 1 row whose id is ${ro_id} and whose account_id is ${a_id}"
            - "the inventory-offers filter returns exactly 1 row whose id is ${o_id}"
            - "the points-ledger-entries filter returns exactly 1 EARN_BASE row with points_delta 40000"
            - "RedemptionOrder.${ro_id}.points_debited == 10000"

  - section: state_machines
    instances:
      - name: rotation_publishes_then_ops_run_activates_and_expires_it
        claim_type: valid_transition
        grounds:
          - state_machines.EarningCategoryRotation.DRAFT_to_SCHEDULED
          - state_machines.EarningCategoryRotation.SCHEDULED_to_ACTIVE
          - state_machines.EarningCategoryRotation.ACTIVE_to_EXPIRED
        distinguishing_aspect: "The rotation walks DRAFT -> SCHEDULED on publish, SCHEDULED -> ACTIVE on the first ops-run at or after window_start, and ACTIVE -> EXPIRED on the ops-run at or after window_end, with published_at / activated_at / expired_at stamped from the logical clock at each step."
        test_recipe:
          setup:
            - "One MAPPED GROCERY category and one DRAFT rotation with window [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z), while the clock sits at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { mc_id: $.data.id }
            - call: "POST /rewards/rotations"
              payload: { merchant_category_id: "${mc_id}", rotation_code: "AUTUMN-GROCERY", bonus_multiplier: 2.0, capped_spend_cents: 100000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rot_id: $.data.id }
          trigger:
            - call: "POST /rewards/rotations/${rot_id}/publish"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/ops-runs"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/ops-runs"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "after publish EarningCategoryRotation.${rot_id}.status == SCHEDULED and published_at == 2026-08-01T00:00:00Z"
            - "the first ops-run response has rotations_activated 1, rotations_expired 0 and clock_utc 2026-09-01T00:00:00Z"
            - "after the first ops-run EarningCategoryRotation.${rot_id}.status == ACTIVE and activated_at == 2026-09-01T00:00:00Z"
            - "the second ops-run response has rotations_activated 0 and rotations_expired 1"
            - "after the second ops-run EarningCategoryRotation.${rot_id}.status == EXPIRED and expired_at == 2026-10-01T00:00:00Z"

