        as: SalonManager
        captures:
          chair_id: $.data.id
      - call: POST /salon-svc/technicians
        payload:
          salon_id: ${salon_id}
          display_name: Tara
          sanitation_cert_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          tech_id: $.data.id
      - call: POST /salon-svc/service-menu-items
        payload:
          salon_id: ${salon_id}
          code: BROW_THREAD
          name: Eyebrow Threading
          base_price_cents: 2000
          est_minutes: 15
        as: SalonManager
        captures:
          svc_id: $.data.id
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: Dot
          phone: 555-0021
        as: FrontDeskAgent
        captures:
          member_id: $.data.id
      - call: POST /salon-svc/queue-tickets
        payload:
          salon_id: ${salon_id}
          member_id: ${member_id}
          service_menu_item_id: ${svc_id}
        as: FrontDeskAgent
        captures:
          ticket_id: $.data.id
      - call: POST /salon-svc/queue-tickets/${ticket_id}/call
        payload: {}
        as: FrontDeskAgent
      - call: POST /salon-svc/service-visits
        payload:
          salon_id: ${salon_id}
          queue_ticket_id: ${ticket_id}
          chair_id: ${chair_id}
          technician_id: ${tech_id}
          expected_salon_version: ${sv1}
        as: FrontDeskAgent
        captures:
          visit_id: $.data.id
      - call: POST /salon-svc/service-visits/${visit_id}/complete
        payload: {}
        as: Technician
        as_user_id: ${tech_id}
      - call: POST /salon-svc/service-visits/${visit_id}/settle
        payload: {}
        as: FrontDeskAgent
      trigger:
      - call: POST /salon-svc/service-visits/${visit_id}/void
        payload: {}
        as: SalonManager
      assert:
      - Member.${member_id}.loyalty_balance == 0
      - ServiceVisit.${visit_id}.payment_status == REFUNDED
