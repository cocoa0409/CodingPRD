  - rule_id: resource_temporal_overlap
    instances:

      - name: serial_ranges_abut_ok_but_intersect_rejected
        grounds:
          - validations[priority=15]
          - errors[ERR_SERIAL_RANGE_OVERLAP]
          - entities.TagLot.fields.serial_start
          - entities.TagLot.fields.serial_end
        distinguishing_aspect: |
          Interval semantics A - CLOSED inclusive integer intervals on the DeviceSupplier serial
          space with ZERO buffer: [1..4000] and [4001..6000] abut and are both accepted, while
          [4000..4500] shares exactly one endpoint value with lot 1 and is rejected.
        test_recipe:
          setup:
            - "Supplier AFNA is APPROVED (score 100.00, issuance_cap 10000) and premises P is ACTIVE."
            - "Lot 1 covers 100000000001-100000004000."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Llano Cattle", contact_email: "ops@llano.example", state_code: "TX" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_o: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_o}", pin: "TXO0001", operation_type: "FEEDLOT", state_code: "TX", capacity: 900 }
              as: Producer
              as_user_id: "${prod_o}"
              captures: { po: $.data.id }
            - call: "POST /premises/${po}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-tx-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_o: $.data.id }
            - call: "POST /device-suppliers/${sup_o}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_o_v1: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_o}", premises_id: "${po}", serial_start: 100000000001, serial_end: 100000004000, expected_supplier_version: "${sup_o_v1}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_o}"
              captures: { lot_o1: $.data.id }
            - call: "GET /device-suppliers/${sup_o}"
              payload: {}
              as: DeviceSupplierRep
              as_user_id: "${sup_o}"
              captures: { sup_o_v2: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_o}", premises_id: "${po}", serial_start: 100000004001, serial_end: 100000006000, expected_supplier_version: "${sup_o_v2}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_o}"
              captures: { lot_o2: $.data.id }
            - call: "GET /device-suppliers/${sup_o}"
              payload: {}
              as: DeviceSupplierRep
              as_user_id: "${sup_o}"
              captures: { sup_o_v3: $.data.version }
          trigger:
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_o}", premises_id: "${po}", serial_start: 100000004000, serial_end: 100000004500, expected_supplier_version: "${sup_o_v3}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_o}"
              captures: { err_range: $.data.error_id }
          assert:
            - "TagLot.${lot_o2}.quantity == 2000 (the abutting range was accepted)"
            - "${err_range} == ERR_SERIAL_RANGE_OVERLAP"
            - "HTTP status is 409"
            - "DeviceSupplier.${sup_o}.issued_tag_count == 6000"

      - name: hold_windows_touch_ok_but_intersect_rejected
        grounds:
          - validations[priority=12]
          - errors[ERR_HOLD_WINDOW_OVERLAP]
          - entities.HoldOrder.fields.effective_from
          - entities.HoldOrder.fields.effective_until
          - entities.Premises.fields.pending_hold_count
        distinguishing_aspect: |
          Interval semantics B on a different resource entity - HALF-OPEN [from, until) datetime
          windows on a Premises, with the 72-hour release buffer inactive: a window starting exactly
          where the previous one ends is accepted, while a window strictly inside the first is
          rejected. Unlike the serial rule, the comparison is over instants and the endpoint is
          exclusive.
        test_recipe:
          setup:
            - "Premises P is ACTIVE with no released holds, so last_hold_released_at is null and no cooldown applies."
            - "Hold 1 covers [2026-08-01T00:00:00Z, 2026-08-02T00:00:00Z) and stays PROPOSED; hold 2 covers [2026-08-02T00:00:00Z, 2026-08-03T00:00:00Z) and is accepted because the windows only touch."
