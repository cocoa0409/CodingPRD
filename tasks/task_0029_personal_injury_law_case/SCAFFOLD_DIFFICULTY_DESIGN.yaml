              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            # Advance clock past SOL (2026-01-15) AFTER activating.
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_7"
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_STATUTE_EXPIRED'"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  #
  # Instance 1: SOL closed-boundary at exact instant (datetime threshold) on
  #             POST /settlement-offers/{id}/accept.
  # Instance 2: empty INCLUDED damages set produces demand_amount_cents = 0
  #             (empty-collection edge) on POST /demand-letters.
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: sol_exact_instant_is_expired_on_accept
        grounds:
          - calculations.statute_of_limitations_check
          - validations[priority=7]
          - errors[ERR_STATUTE_EXPIRED]
          - endpoints[POST /settlement-offers/{id}/accept]
        distinguishing_aspect: |
          The SOL boundary is closed on the EXPIRED side: at the exact instant
          SystemClock.current_utc equals effective_sol_date the statute has run,
          and ERR_STATUTE_EXPIRED fires. With accident_date=2024-01-15 and CA
          jurisdiction (2y, no tolling), effective_sol_date=2026-01-15T00:00:00Z;
          a SettlementOffer accept at clock=2026-01-15T00:00:00Z (the exact
          microsecond, not one second earlier) MUST be rejected. The next earlier
          tick (2026-01-14T23:59:59Z) would succeed — the boundary is at the
          datetime-threshold metric, on the accept endpoint.
        test_recipe:
          setup:
            - "Active CA Case at clock 2025-12-01; one REVIEWED MedicalRecordsRequest; one INCLUDED MEDICAL_BILLS damage; DemandLetter SENT; one CARRIER PENDING offer at 1_000_000 cents."
          setup_api_calls:
