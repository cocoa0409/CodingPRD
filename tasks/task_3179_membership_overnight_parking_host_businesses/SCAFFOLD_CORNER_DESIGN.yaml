            - call: "POST /api/members/${m_jn}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m_jn}/vehicles"
              payload: { vehicle_class: "CLASS_C", length_feet: 30, self_contained: true, inspection_state_code: "TX" }
              as: Member
              as_user_id: "${m_jn}"
              captures: { v_jn: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_jn}", member_id: "${m_jn}", vehicle_id: "${v_jn}", arrival_date: "2026-06-20", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m_jn}"
              captures: { r_jn: $.data.id, r_jn_host: $.data.host_id, r_jn_member: $.data.member_id, r_jn_vehicle: $.data.vehicle_id }
            - call: "GET /api/hosts/${h_jn}"
              payload: {}
              as: HostOperator
              captures: { h_jn_v2: $.data.version }
            - call: "POST /api/stay-requests/${r_jn}/decisions"
              payload: { decision: "CONFIRM", site_id: "J1", expected_host_version: "${h_jn_v2}" }
              as: HostOperator
              as_user_id: "${h_jn}"
              captures: { r_jn_site: $.data.confirmed_site_id }
            - call: "GET /api/stay-requests/${r_jn}"
              payload: {}
              as: HostOperator
              captures: { r_jn_v: $.data.version }
          trigger:
            - call: "POST /api/patronization-records"
              payload: { host_id: "${h_jn}", member_id: "${m_jn}", stay_request_id: "${r_jn}", receipt_cents: 3000, purchase_kind: "TASTING", expected_request_version: "${r_jn_v}" }
              as: Member
              as_user_id: "${m_jn}"
              captures: { p_jn: $.data.id, p_jn_stay: $.data.stay_request_id }
            - call: "GET /api/patronization-records"
              payload: { stay_request_id: "${r_jn}", limit: 10, offset: 0 }
              as: HostOperator
              as_user_id: "${h_jn}"
              captures: { p_jn_first: "$.data[0].id" }
          assert:
            - "StayRequest.${r_jn} carries host_id ${h_jn}, member_id ${m_jn}, vehicle_id ${v_jn} alongside confirmed_site_id ${site_j1} on one row"
            - "HostPatronizationRecord.${p_jn}.stay_request_id == ${r_jn}, so a fifth child hangs off the same junction row"
            - "GET /api/patronization-records?stay_request_id=${r_jn} carries total_count 1 and its entry is HostPatronizationRecord.${p_jn}"
            - "all four peer references plus the child resolve from the single stay row, so the graph is traversable in both directions"

  - section: consistency_model
    instances:
      - name: derived_counters_reconcile_immediately_after_each_mutation
        claim_type: consistent_read
        grounds:
          - consistency_model
          - entities.HostBusiness.fields.committed_sites
          - entities.Member.fields.total_stays_completed
          - state_machines.StayRequest.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: "The immediate model means no read lags a write: the member's completed-stay counter and the host's occupancy both reflect a checkout on the next read, and a no-show moves both back."
        test_recipe:
          setup: ["Logical clock advanced to 2026-06-05T00:00:00Z; a TX/FARM host with one site and one confirmed stay already checked in"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/hosts"
              payload: { legal_name: "Reconcile Farm", category: "FARM", address_line1: "58 Sync Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_rc: $.data.id }
            - call: "POST /api/hosts/${h_rc}/parking-sites"
              payload: { site_label: "R1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "GET /api/hosts/${h_rc}"
              payload: {}
              as: HostOperator
              captures: { h_rc_v1: $.data.version }
            - call: "POST /api/hosts/${h_rc}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_rc_v1}" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "rec@x.com", full_name: "Rec Member", plan_tier: "PLUS", home_state_code: "TX" }
              as: Anonymous
              captures: { m_rc: $.data.id }
            - call: "POST /api/members/${m_rc}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m_rc}/vehicles"
              payload: { vehicle_class: "CLASS_C", length_feet: 30, self_contained: true, inspection_state_code: "TX" }
              as: Member
              as_user_id: "${m_rc}"
              captures: { v_rc: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_rc}", member_id: "${m_rc}", vehicle_id: "${v_rc}", arrival_date: "2026-06-05", nights: 1, party_size: 2, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m_rc}"
              captures: { r_rc: $.data.id }
            - call: "GET /api/hosts/${h_rc}"
              payload: {}
              as: HostOperator
              captures: { h_rc_v2: $.data.version }
            - call: "POST /api/stay-requests/${r_rc}/decisions"
              payload: { decision: "CONFIRM", site_id: "R1", expected_host_version: "${h_rc_v2}" }
              as: HostOperator
              as_user_id: "${h_rc}"
            - call: "POST /api/stay-requests/${r_rc}/check_ins"
              payload: {}
              as: HostOperator
              as_user_id: "${h_rc}"
            - call: "GET /api/stay-requests"
              payload: { host_id: "${h_rc}", request_status: "CHECKED_IN", limit: 10, offset: 0 }
              as: HostOperator
              as_user_id: "${h_rc}"
              captures: { in_progress: "$.data[0].id", in_progress_count: "$.data[1].id" }
          trigger:
            - call: "POST /api/stay-requests/${r_rc}/check_outs"
              payload: {}
              as: HostOperator
              as_user_id: "${h_rc}"
              captures: { rc_out: $.data.request_status, rc_out_at: $.data.checked_out_at }
            - call: "GET /api/members/${m_rc}"
              payload: {}
              as: PlatformAdmin
              captures: { rc_done: $.data.total_stays_completed, rc_passes: $.data.guest_passes_remaining }
            - call: "GET /api/stay-requests"
              payload: { host_id: "${h_rc}", request_status: "CHECKED_OUT", limit: 10, offset: 0 }
              as: HostOperator
              as_user_id: "${h_rc}"
              captures: { after_first: "$.data[0].id" }
          assert:
            - "the checkout returns request_status \"CHECKED_OUT\" with checked_out_at set on the response itself"
            - "Member.${m_rc}.total_stays_completed == 1 on the very next read, with no intervening refresh call"
            - "Member.${m_rc}.guest_passes_remaining == 2, recomputed from the PLUS allotment because the member now has no in-flight stay"
            - "the CHECKED_IN filter read before the checkout carried total_count 1 and its entry was StayRequest.${in_progress}, so the intermediate state was observable too"
            - "the CHECKED_OUT filter for host ${h_rc} carries total_count 1 and its entry is StayRequest.${r_rc}, so the list view reconciles with the mutation in the same read"
