              payload: {}
              as: IntakeClerk
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. G Ivanova", provider_type: "PHYSICIAN", provider_license_number: "MD-90019" }
              as: IntakeClerk
              captures: { ver_id: $.data.id }
            - call: "POST /applications/${appn_id}/verifications/${ver_id}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["rheumatoid arthritis"], attests_permanent: true }
              as: IntakeClerk
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 2, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applications/${appn_id}/assessments"
              payload: { slot_id: "${slot_id}", requires_wheelchair_position: false }
              as: IntakeClerk
              captures: { asmt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:30:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /assessments/${asmt_id}/attendance"
              payload: { attendance_status: "ATTENDED" }
              as: Evaluator
              as_user_id: "eval-1"
            - call: "POST /assessments/${asmt_id}/scores"
              payload: { board_alight_score: 2, wayfinding_score: 3, distance_meters_walked: 350, heat_sensitivity_flag: true }
              as: Evaluator
              as_user_id: "eval-1"
              captures: { scoring: $.data.scoring_status }
            - call: "GET /applications/${appn_id}"
              payload: {}
              as: IntakeClerk
              captures: { appn_v: $.data.version }
          trigger:
            - call: "POST /applications/${appn_id}/determinations"
              payload: { expected_application_version: "${appn_v}", category: "CONDITIONAL", effective_date: "2026-08-06", rationale: "heat sensitive" }
              as: EligibilitySpecialist
              as_user_id: "spec-1"
              captures: { not_signed_err: $.data.error_id }
            - call: "POST /assessments/${asmt_id}/sign-off"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: "spec-1"
              captures: { signed: $.data.scoring_status }
            - call: "GET /applications/${appn_id}"
              payload: {}
              as: IntakeClerk
              captures: { appn_v2: $.data.version }
            - call: "POST /applications/${appn_id}/determinations"
              payload: { expected_application_version: "${appn_v2}", category: "CONDITIONAL", effective_date: "2026-08-06", rationale: "heat sensitive" }
              as: EligibilitySpecialist
              as_user_id: "spec-1"
              captures: { needs_cond_err: $.data.error_id }
            - call: "POST /applications/${appn_id}/determinations"
              payload: { expected_application_version: "${appn_v2}", category: "UNCONDITIONAL", effective_date: "2026-08-06", rationale: "full eligibility", trip_conditions: [{ condition_type: "PRECIPITATION", comparator: "EQ", threshold_value: 1, unit: "FLAG", note: "rain only" }] }
              as: EligibilitySpecialist
              as_user_id: "spec-1"
              captures: { forbids_err: $.data.error_id }
          assert:
            - "${scoring} == \"SCORED\" before sign-off and the first draft attempt returns HTTP 422 with data.error_id == \"ERR_ASSESSMENT_NOT_SIGNED_OFF\" (50 pre-empts 51)"
            - "the sign-off returns HTTP 200 with ${signed} == \"SIGNED_OFF\" and Application.${appn_id}.status == \"ASSESSMENT_COMPLETE\""
            - "the identical CONDITIONAL payload now returns HTTP 422 with data.error_id == \"ERR_CONDITIONAL_REQUIRES_CONDITIONS\""
            - "the UNCONDITIONAL-with-conditions payload returns HTTP 422 with data.error_id == \"ERR_UNCONDITIONAL_FORBIDS_CONDITIONS\""
            - "no Determination row exists: GET /determinations?application_id=${appn_id} returns total_count == 0, and Application.${appn_id}.status is still \"ASSESSMENT_COMPLETE\""

      - name: appeal_reviewer_independence_hearing_flag_and_outcome_pairing_guards
        claim_type: priority_ordering
        grounds:
