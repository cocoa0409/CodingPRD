              as: Registrar
              captures: { dp_tpl: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${dp_stu}", term_id: "${dp_term}", plan_template_id: "${dp_tpl}" }
              as: Registrar
              captures: { dp_enr: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${dp_enr}", kind: "TUITION", amount_cents: 500000 }
              as: Registrar
            - call: "POST /institutions/aids"
              payload: { enrollment_id: "${dp_enr}", source: "GRANT", amount_cents: 100000 }
