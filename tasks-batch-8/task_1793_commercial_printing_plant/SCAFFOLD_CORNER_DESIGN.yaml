  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1 beats everything: a request with no X-User-Role/X-User-ID to a nonexistent job id returns 401 ERR_UNAUTHENTICATED, not 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /jobs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (http 401)"

      - name: existence_before_ownership_on_missing_job
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A Customer reading a NONEXISTENT job gets 404 ERR_NOT_FOUND (existence, priority 4... resolved after ownership scope only when the resource exists) — never ERR_NOT_OWN_RESOURCE for a resource that does not exist."
        test_recipe:
          setup: ["Customer exists"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "O Cust", credit_limit_cents: 1000 }, as: PlantManager, captures: { cust: $.data.id } }
          trigger:
            - { call: "GET /jobs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: wrong_customer_ownership_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_OWN_RESOURCE]"]
        distinguishing_aspect: "Customer B reading Customer A's existing job gets 403 ERR_NOT_OWN_RESOURCE; Customer A reading the same job succeeds."
        test_recipe:
          setup: ["Customers A and B; a job owned by A (accepted estimate)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { ca: $.data.id } }
            - { call: "POST /customers", payload: { name: "B", credit_limit_cents: 100000000 }, as: PlantManager, captures: { cb: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /estimates", payload: { customer_id: "${ca}", job_name: "AJ", quantity_ordered: 100, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 1000, rate_per_thousand_cents: 1000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${ca}", captures: { job: $.data.id } }
          trigger:
            - { call: "GET /jobs/${job}", payload: {}, as: Customer, as_user_id: "${cb}", captures: { err: $.data.error_id } }
            - { call: "GET /jobs/${job}", payload: {}, as: Customer, as_user_id: "${ca}", captures: { ok: $.data.id } }
          assert:
            - "Customer B: error_id == ERR_NOT_OWN_RESOURCE (http 403)"
            - "Customer A: 200 with id == ${job}"

      - name: role_check_before_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]"]
        distinguishing_aspect: "Priority 2 beats priority 4: MailSpecialist (not in roles) calling POST /jobs/{nonexistent}/record-delivery gets 403 ERR_FORBIDDEN_ROLE, not 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /jobs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/record-delivery", payload: { delivered_quantity: 5 }, as: MailSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (http 403)"

  - section: endpoints
    instances:
      - name: error_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Error responses carry response_type == error and data.{error_id, message}; success responses carry meta.api_request_id, meta.api_request_timestamp, response_type, data."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /jobs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "error body: response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty"
            - "meta.api_request_id present in error responses too"

      - name: jobs_list_filter_by_customer_and_status
        claim_type: filtering
        grounds: [endpoints]
        distinguishing_aspect: "GET /jobs?customer_id=X&production_status=PREPRESS returns only rows matching BOTH filters; a second customer's jobs never leak into the result."
        test_recipe:
          setup: ["Customers A (2 accepted jobs) and B (1 accepted job)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "FA", credit_limit_cents: 100000000 }, as: PlantManager, captures: { ca: $.data.id } }
            - { call: "POST /customers", payload: { name: "FB", credit_limit_cents: 100000000 }, as: PlantManager, captures: { cb: $.data.id } }
