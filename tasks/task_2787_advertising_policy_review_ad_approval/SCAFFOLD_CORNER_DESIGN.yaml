            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "A. Reviewer", queue_specialties: ["REGULATED_CERT"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev_a: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "B. Reviewer", queue_specialties: ["STANDARD"], country_authorizations: ["CA", "US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev_b: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "C. Reviewer", queue_specialties: ["REGULATED_CERT"], country_authorizations: ["CA", "US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev_c: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Cross border cask", body_text: "One spirit campaign aimed at both Canada and the United States.", declared_category_codes: ["ALC_SPIRITS"], target_country_codes: ["CA", "US"], landing_page_url: "https://www.northline.example/cask", display_url: "https://www.northline.example/cask" }
