            - { call: "POST /inbox/time-entries", payload: { message_id: "${ma}", entry_kind: "CLINICAL_REVIEW", minutes: 4 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${ma}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { ma_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${ma}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${ma_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${ma}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent_a: "$.data[0].id" } }
            - { call: "POST /inbox/consent-records/${consent_a}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat_l}" }
            - { call: "POST /inbox/portal-messages/${ma}/complete", payload: { resolution_summary: "done A" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "MB", body: "eleven minutes" }, as: Patient, as_user_id: "${pat_m}", captures: { mb: "$.data.id", mb_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${mb}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${mb_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${mb}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${mb}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${mb}", entry_kind: "CLINICAL_REVIEW", minutes: 6 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${mb}", entry_kind: "CLINICAL_REVIEW", minutes: 5 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${mb}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { mb_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${mb}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${mb_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${mb}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent_b: "$.data[0].id" } }
            - { call: "POST /inbox/consent-records/${consent_b}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat_m}" }
            - { call: "POST /inbox/portal-messages/${mb}/complete", payload: { resolution_summary: "done B" }, as: Provider, as_user_id: "${prov_id}" }
          trigger:
