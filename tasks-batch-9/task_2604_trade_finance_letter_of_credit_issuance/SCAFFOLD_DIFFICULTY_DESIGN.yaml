  - rule_id: compensating_invariant
    instances:
      - name: facility_allocated_cents_conserved_across_issue_then_cancel
        grounds:
          - calculations.facility_exposure_ledger
          - calculations.credit_allocation_exposure
          - calculations.issuance_charges
          - entities.CreditFacility.fields.allocated_cents
          - entities.CreditFacility.fields.available_cents
          - entities.FacilityAllocation.fields.released_cents
          - state_machines.FacilityAllocation.OPEN_to_RELEASED
          - state_machines.DocumentaryCredit.ISSUED_to_CANCELLED
          - state_machines.CreditFacility.SUSPENDED_to_ACTIVE
          - state_machines.DocumentaryCredit.ON_HOLD_to_APPROVED
        distinguishing_aspect: |
          The conserved quantity is CreditFacility.allocated_cents (a FACILITY-level
          exposure ledger). Cancelling the credit must reverse EVERY side effect of
          issuance - the 95066500 allocation, the RESTRICTED posture, the SUSPENDED status,
          the suspended_reason and the two sibling credits parked at ON_HOLD - returning
          allocated_cents to exactly its pre-issuance value of 0 with no drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with a USD facility of limit_cents 100000000, collateral_required_pct 0, so restrict_threshold_cents is 95000000 and allocated_cents starts at 0."
