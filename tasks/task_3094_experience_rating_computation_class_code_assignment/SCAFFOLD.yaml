# =============================================================================
# SCAFFOLD — task_3094_experience_rating_computation_class_code_assignment
# Sections 1.0–1.7 only. Difficulty design (1.8) and corner design (1.9)
# live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Experience Rating Computation & Class Code Assignment (NCCI): unit
  statistical data collection from carriers with payroll and loss detail by
  policy, experience modification computation using expected losses, primary
  and excess loss split and credibility weighting, class code assignment
  through inspections and governing classification rules with employer
  disputes, rating value promulgation by state and effective date with
  mid-term revisions, modification revision when claim values change after
  issuance with retroactive premium adjustment, contested modification
  appeals through a review process, ownership change and combinability
  determination for related entities, assigned risk pool administration and
  take-out credits

domain_name: experience-rating
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: Bureau
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique bureau code (e.g., NCCI)" }
      - { name: name, type: string, source: input, description: "Bureau display name" }
      - { name: eligibility_threshold_cents, type: integer, source: input, description: "Statewide experience-rating eligibility threshold in cents (500000 = $5,000)" }
      - { name: split_point_cents, type: integer, source: input, description: "Primary/excess per-claim split point in cents (1000000 = $10,000)" }
      - { name: credibility_ballast_bp, type: integer, source: input, description: "Credibility weighting ballast K in basis points (4000). Ballast B = K/10000 * expected_losses" }
      - { name: credibility_excess_divisor_bp, type: integer, source: input, description: "Excess divisor J in basis points (6000). Weight W = E/(E + J/10000 * 100,000,000)" }
      - { name: underwriting_threshold_cents, type: integer, source: input, description: "Premium at or above which an underwriter review is inserted (2500000 = $25,000)" }

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: naic_number, type: string, source: input, description: "Unique NAIC number" }
      - { name: legal_name, type: string, source: input, description: "Carrier legal name" }
      - { name: assigned_risk_quota_cents, type: integer, source: input, description: "Assigned-risk pool participation quota in cents" }
      - { name: assigned_risk_current_load_cents, type: integer, source: system, default: 0, description: "Sum of estimated annual premium of ACTIVE assigned-risk enrollments on this carrier" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: fein, type: string, source: input, description: "Federal Employer Identification Number; unique" }
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: state_code, type: string, source: input, description: "Home state code (e.g., TX)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | UNDER_REVIEW | INACTIVE" }

  - name: ClassCode
    parent: null
    common_fields: false
    fields:
      - { name: code, type: string, source: input, description: "NCCI class code, e.g., 3632" }
      - { name: description, type: string, source: input, description: "Governing classification description" }
      - { name: state_code, type: string, source: input, description: "State this class code applies to" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: RatingTable
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "State code this rating table applies to" }
      - { name: effective_date, type: string, source: input, description: "Effective date ISO8601 (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROMULGATED | SUPERSEDED" }
      - { name: values, type: array, source: input, description: "Array of { class_code, rate_per_100_payroll_cents, elr_per_100_payroll_cents, d_ratio_bp }" }
      - { name: superseded_at, type: string, source: system, description: "ISO8601 when superseded; null until then" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id" }
      - { name: policy_number, type: string, source: input, description: "Unique per carrier" }
      - { name: effective_date, type: string, source: input, description: "ISO8601 (YYYY-MM-DD)" }
      - { name: expiration_date, type: string, source: input, description: "ISO8601 (YYYY-MM-DD)" }
      - { name: manual_premium_cents, type: integer, source: computed, description: "Sum over lines of round_half_up(payroll_dollars * rate_per_100 / 100) at the promulgated rating table in force at policy effective date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED | EXPIRED" }
      - { name: class_codes, type: array, source: input, description: "Array of { class_code, payroll_dollars } for the policy term" }
      - { name: unit_stat_report_id, type: string, source: system, description: "FK -> UnitStatReport.id; set when first unit stat report is created for this policy; null until then" }

  - name: UnitStatReport
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: payroll_lines, type: array, source: input, description: "Array of { class_code, payroll_dollars }" }
      - { name: claim_lines, type: array, source: input, description: "Array of { claim_number, claim_type (INDEMNITY|MEDICAL), incurred_cents, paid_cents, claim_status (OPEN|CLOSED), state_code }" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VALIDATED | LOCKED | CORRECTED" }
      - { name: submission_number, type: integer, source: system, default: 1, description: "Ordinal for this policy's reports; 1 = first submission" }
      - { name: correction_of_report_id, type: string, source: input, description: "FK -> UnitStatReport.id of the report being corrected; null for first submission" }

  - name: ClassAssignment
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: class_code_id, type: string, source: input, description: "FK -> ClassCode.id" }
      - { name: effective_date, type: string, source: input, description: "ISO8601 (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "PENDING_INSPECTION | ASSIGNED | DISPUTED | CONFIRMED | REASSIGNED | WITHDRAWN" }
      - { name: inspection_id, type: string, source: system, description: "FK -> Inspection.id; set when an inspection is ordered" }
      - { name: dispute_id, type: string, source: system, description: "FK -> ClassAssignmentDispute.id; set when a dispute is filed" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: class_assignment_id, type: string, source: input, description: "FK -> ClassAssignment.id" }
      - { name: inspector_id, type: string, source: input, description: "Inspector user id" }
      - { name: scheduled_date, type: string, source: input, description: "ISO8601 (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | WAIVED" }
      - { name: findings, type: string, source: input, description: "Narrative findings" }

  - name: ClassAssignmentDispute
    parent: null
    common_fields: true
    fields:
      - { name: class_assignment_id, type: string, source: input, description: "FK -> ClassAssignment.id" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id (derived from ClassAssignment)" }
      - { name: reason, type: string, source: input, description: "Reason code (WRONG_CLASS | PAYROLL_MISMATCH | OTHER)" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REVIEW | RESOLVED | WITHDRAWN" }
      - { name: resolution, type: string, source: system, description: "CONFIRMED | REASSIGNED | null" }
      - { name: resolved_at, type: string, source: system, description: "ISO8601 when resolved" }

  - name: ExperienceModSheet
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: rating_effective_date, type: string, source: input, description: "ISO8601 (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROMULGATED | REVISED | CONTESTED | FINAL" }
      - { name: mod_factor, type: string, source: computed, description: "Decimal mod factor, 2 decimal places, round_half_up (e.g., 1.44)" }
      - { name: expected_losses_cents, type: integer, source: computed, description: "Sum over payroll lines of round_half_up(payroll * ELR / 100) using promulgated rating table at rating_effective_date" }
      - { name: actual_primary_cents, type: integer, source: computed, description: "Sum over claims of min(incurred_cents, bureau.split_point_cents)" }
      - { name: actual_excess_cents, type: integer, source: computed, description: "Sum over claims of incurred_cents - min(incurred_cents, bureau.split_point_cents)" }
      - { name: ballast_cents, type: integer, source: computed, description: "round_half_up(K/10000 * expected_losses_cents)" }
      - { name: weight_w, type: string, source: computed, description: "round_half_up(E / (E + J/10000 * 100,000,000), 4 decimal places)" }
      - { name: expected_primary_cents, type: integer, source: computed, description: "round_half_up(expected_losses_cents * d_ratio_bp / 10000) using the d_ratio of the rating table" }
      - { name: expected_excess_cents, type: integer, source: computed, description: "expected_losses_cents - expected_primary_cents" }
      - { name: provisional_mod_factor, type: string, source: computed, description: "Mod factor computed using SUBMITTED (unvalidated) unit stat reports in addition to VALIDATED/LOCKED" }
      - { name: retroactive_premium_adjustment_cents, type: integer, source: computed, description: "Premium delta when a REVISED mod supersedes a prior promulgated mod; negative = credit to insured" }
      - { name: revision_of_sheet_id, type: string, source: system, description: "FK -> ExperienceModSheet.id of the sheet being revised; null for original" }
      - { name: revision_reason, type: string, source: system, description: "CLAIM_VALUE_CHANGE | CLASS_CODE_CHANGE | RATE_REVISION | null" }

  - name: ModAppeal
    parent: null
    common_fields: true
    fields:
      - { name: mod_sheet_id, type: string, source: input, description: "FK -> ExperienceModSheet.id" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id (derived from sheet)" }
      - { name: reason, type: string, source: input, description: "Free-text reason" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | UPHELD | REVERSED | WITHDRAWN" }
      - { name: filed_at, type: string, source: system, description: "ISO8601 when filed" }
      - { name: decided_at, type: string, source: system, description: "ISO8601 when decided; null until then" }
      - { name: decision, type: string, source: system, description: "UPHELD | REVERSED | null" }
      - { name: decision_reason, type: string, source: system, description: "Free-text decision rationale; null until decided" }

  - name: OwnershipChange
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id of the employer whose ownership changed" }
      - { name: change_type, type: enum, source: input, description: "SALE | MERGER | FORMATION_OF_NEW_ENTITY | OTHER" }
      - { name: effective_date, type: string, source: input, description: "ISO8601 (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "PENDING | COMBINED | NOT_COMBINED | REVERSED" }
      - { name: combinability_group_id, type: string, source: system, description: "FK -> CombinabilityGroup.id; set when combined" }

  - name: CombinabilityGroup
    parent: null
    common_fields: true
    fields:
      - { name: member_employer_ids, type: array, source: input, description: "Array of FK -> Employer.id" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISSOLVED" }
      - { name: created_from_change_id, type: string, source: system, description: "FK -> OwnershipChange.id that created this group" }
      - { name: combined_mod_sheet_id, type: string, source: system, description: "FK -> ExperienceModSheet.id of the combined experience mod for the group" }

  - name: AssignedRiskEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: state_code, type: string, source: input, description: "State of assignment" }
      - { name: effective_date, type: string, source: input, description: "ISO8601 (YYYY-MM-DD)" }
      - { name: expiration_date, type: string, source: input, description: "ISO8601 (YYYY-MM-DD)" }
      - { name: estimated_annual_premium_cents, type: integer, source: input, description: "Estimated annual premium for the assigned-risk term" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | EXITED | CANCELLED" }
      - { name: assigned_carrier_id, type: string, source: system, description: "FK -> Carrier.id of the carrier assigned by the pool administrator" }
      - { name: take_out_credit_cents, type: integer, source: computed, description: "Credit granted when the employer exits the pool to a voluntary carrier before expiration" }
      - { name: exit_date, type: string, source: system, description: "ISO8601 when exited; null until then" }
      - { name: exit_reason, type: string, source: system, description: "TAKE_OUT | CANCELLED | EXPIRED | null" }

  - name: AssignedRiskTakeOut
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> AssignedRiskEnrollment.id" }
      - { name: voluntary_carrier_id, type: string, source: input, description: "FK -> Carrier.id of the voluntary carrier taking the risk out" }
      - { name: exit_date, type: string, source: input, description: "ISO8601 (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: credit_cents, type: integer, source: computed, description: "Take-out credit computed per formula; 0 until APPROVED" }
      - { name: approved_at, type: string, source: system, description: "ISO8601 when approved" }

  - name: UnderwritingReview
    parent: null
    common_fields: true
    fields:
      - { name: subject_type, type: enum, source: input, description: "MOD_SHEET | CLASS_ASSIGNMENT | TAKE_OUT" }
      - { name: subject_id, type: string, source: input, description: "FK -> id of the subject entity" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: reviewer_id, type: string, source: system, description: "Underwriter user id who decided" }
      - { name: decided_at, type: string, source: system, description: "ISO8601 when decided" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: UnitStatReport
    initial_state: SUBMITTED
    terminal_states: [LOCKED, CORRECTED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /unit-stat-reports/{id}/validate"
        actor: BureauAnalyst
        preconditions:
          - "Policy must be ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "At least one payroll line and at least one claim line (ERR_INVALID_REQUEST)"
          - "All claim state_codes must match policy state (ERR_STATE_MISMATCH)"
          - "Payroll lines must reference ACTIVE ClassCodes (ERR_CLASS_CODE_INACTIVE)"
        side_effects:
          - "Policy.unit_stat_report_id = this report"
          - "If this is a correction (correction_of_report_id set), the referenced report transitions VALIDATED -> CORRECTED or LOCKED -> CORRECTED"

      - from: VALIDATED
        to: LOCKED
        trigger: "system (automatic when the policy's experience mod sheet is PROMULGATED or when the policy is CANCELLED/EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "Report becomes immutable"

      - from: VALIDATED
        to: CORRECTED
        trigger: "POST /unit-stat-reports (with correction_of_report_id pointing to this report)"
        actor: CarrierDataReporter
        preconditions:
          - "Referenced report must be VALIDATED or LOCKED (ERR_INVALID_STATE)"
        side_effects:
          - "New report created in SUBMITTED"
          - "If referenced report was LOCKED, the experience mod sheet that consumed it must be revised (ERR_MOD_REVISION_REQUIRED is raised on subsequent promulgation attempts until revision)"

      - from: LOCKED
        to: CORRECTED
        trigger: "POST /unit-stat-reports (with correction_of_report_id pointing to this report)"
        actor: CarrierDataReporter
        preconditions:
          - "Referenced report must be VALIDATED or LOCKED (ERR_INVALID_STATE)"
        side_effects:
          - "New report created in SUBMITTED"
          - "The experience mod sheet that consumed this report is flagged for revision; any attempt to promulgate a new sheet for the same employer/rating_effective_date without a revision_reason of CLAIM_VALUE_CHANGE returns ERR_MOD_REVISION_REQUIRED"

  - entity: ClassAssignment
    initial_state: PENDING_INSPECTION
    terminal_states: [CONFIRMED, REASSIGNED, WITHDRAWN]
    transitions:
      - from: PENDING_INSPECTION
        to: ASSIGNED
        trigger: "POST /class-assignments/{id}/assign"
        actor: BureauAnalyst
        preconditions:
          - "Employer must be ACTIVE (ERR_EMPLOYER_INACTIVE)"
          - "ClassCode must be ACTIVE (ERR_CLASS_CODE_INACTIVE)"
          - "No other ASSIGNED/CONFIRMED ClassAssignment for the same employer with an overlapping effective_date (ERR_CLASS_ASSIGNMENT_OVERLAP)"
        side_effects:
          - "If an Inspection is required (employer has no prior inspection in the past 3 years), create Inspection in SCHEDULED"

      - from: PENDING_INSPECTION
        to: WITHDRAWN
        trigger: "POST /class-assignments/{id}/withdraw"
        actor: EmployerRepresentative
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /class-assignments/{id}/confirm"
        actor: BureauAnalyst
        preconditions:
          - "Any Inspection for this assignment must be COMPLETED or WAIVED (ERR_INSPECTION_REQUIRED)"
        side_effects: []

      - from: ASSIGNED
        to: DISPUTED
        trigger: "POST /class-assignment-disputes"
        actor: EmployerRepresentative
        preconditions:
          - "Assignment must be ASSIGNED or CONFIRMED (ERR_INVALID_STATE)"
        side_effects:
          - "ClassAssignmentDispute created in OPEN"
          - "ClassAssignment.dispute_id = new dispute id"

      - from: CONFIRMED
        to: DISPUTED
        trigger: "POST /class-assignment-disputes"
        actor: EmployerRepresentative
        preconditions: []
        side_effects:
          - "ClassAssignmentDispute created in OPEN"
          - "ClassAssignment.dispute_id = new dispute id"

      - from: DISPUTED
        to: REASSIGNED
        trigger: "POST /class-assignment-disputes/{id}/resolve (with resolution = REASSIGNED and new_class_code_id)"
        actor: BureauAnalyst
        preconditions:
          - "Dispute must be IN_REVIEW (ERR_INVALID_STATE)"
          - "New ClassCode must be ACTIVE (ERR_CLASS_CODE_INACTIVE)"
        side_effects:
          - "New ClassAssignment created in ASSIGNED with the new class_code_id"
          - "Original ClassAssignment status -> REASSIGNED"
          - "ClassAssignmentDispute status -> RESOLVED, resolution = REASSIGNED"

      - from: DISPUTED
        to: CONFIRMED
        trigger: "POST /class-assignment-disputes/{id}/resolve (with resolution = CONFIRMED)"
        actor: BureauAnalyst
        preconditions:
          - "Dispute must be IN_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "ClassAssignmentDispute status -> RESOLVED, resolution = CONFIRMED"
          - "ClassAssignment status -> CONFIRMED"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /inspections/{id}/complete"
        actor: Inspector
        preconditions: []
        side_effects:
          - "If all Inspections for the ClassAssignment are COMPLETED/WAIVED, the assignment remains ASSIGNED and may be confirmed"

      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /inspections/{id}/waive"
        actor: BureauAnalyst
        preconditions:
          - "Employer must have a prior COMPLETED Inspection within the past 3 years (ERR_INSPECTION_WAIVE_NOT_ALLOWED)"
        side_effects: []

  - entity: ClassAssignmentDispute
    initial_state: OPEN
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /class-assignment-disputes/{id}/review"
        actor: BureauAnalyst
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: RESOLVED
        trigger: "POST /class-assignment-disputes/{id}/resolve"
        actor: BureauAnalyst
        preconditions:
          - "resolution must be CONFIRMED or REASSIGNED"
        side_effects:
          - "ClassAssignment transitions per its own machine"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /class-assignment-disputes/{id}/withdraw"
        actor: EmployerRepresentative
        preconditions: []
        side_effects:
          - "ClassAssignment remains in its prior status (ASSIGNED or CONFIRMED)"

  - entity: ExperienceModSheet
    initial_state: DRAFT
    terminal_states: [FINAL]
    transitions:
      - from: DRAFT
        to: PROMULGATED
        trigger: "POST /experience-mod-sheets/{id}/promulgate"
        actor: BureauAnalyst
        preconditions:
          - "Employer must be ACTIVE (ERR_EMPLOYER_INACTIVE)"
          - "All UnitStatReports included in expected_losses_cents must be VALIDATED or LOCKED (ERR_UNVALIDATED_REPORTS)"
          - "If the employer's total expected losses >= bureau.eligibility_threshold_cents, mod_factor must be computed; otherwise mod_factor = 1.00 (ERR_NOT_ELIGIBLE_FOR_EXPERIENCE_RATING if attempting to promulgate a non-unity mod for an ineligible employer)"
          - "If a prior PROMULGATED sheet exists for the same employer and rating_effective_date, it must be SUPERSEDED or this sheet must have revision_reason set (ERR_MOD_REVISION_REQUIRED)"
        side_effects:
          - "If revision_of_sheet_id is set, the referenced sheet transitions PROMULGATED -> REVISED"
          - "All UnitStatReports consumed by this sheet transition VALIDATED -> LOCKED"
          - "If expected_losses_cents >= bureau.underwriting_threshold_cents, create UnderwritingReview in PENDING with subject_type MOD_SHEET"

      - from: PROMULGATED
        to: REVISED
        trigger: "system (automatic when a correction UnitStatReport is validated, or when a class code reassignment is confirmed, or when a rating table revision is promulgated)"
        actor: system
        preconditions: []
        side_effects:
          - "A new ExperienceModSheet is created in DRAFT with revision_of_sheet_id = this sheet and revision_reason set appropriately"
          - "The new sheet's retroactive_premium_adjustment_cents is computed per calculation retroactive_premium_adjustment"

      - from: PROMULGATED
        to: CONTESTED
        trigger: "POST /mod-appeals"
        actor: EmployerRepresentative
        preconditions:
          - "Sheet must be PROMULGATED (ERR_INVALID_STATE)"
          - "No other active ModAppeal for this sheet (ERR_APPEAL_ALREADY_ACTIVE)"
        side_effects:
          - "ModAppeal created in FILED"

      - from: CONTESTED
        to: FINAL
        trigger: "POST /mod-appeals/{id}/decide (with decision = UPHELD)"
        actor: BureauAnalyst
        preconditions:
          - "ModAppeal must be UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "ModAppeal status -> UPHELD"
          - "Sheet status -> FINAL"

      - from: CONTESTED
        to: REVISED
        trigger: "POST /mod-appeals/{id}/decide (with decision = REVERSED)"
        actor: BureauAnalyst
        preconditions:
          - "ModAppeal must be UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "ModAppeal status -> REVERSED"
          - "Sheet status -> REVISED"
          - "A new ExperienceModSheet is created in DRAFT with revision_of_sheet_id = this sheet and revision_reason = CLASS_CODE_CHANGE or CLAIM_VALUE_CHANGE as determined by the appeal"

      - from: REVISED
        to: FINAL
        trigger: "POST /experience-mod-sheets/{id}/finalize"
        actor: BureauAnalyst
        preconditions:
          - "No active ModAppeal for this sheet (ERR_APPEAL_ALREADY_ACTIVE)"
        side_effects: []

      - from: DRAFT
        to: FINAL
        trigger: "POST /experience-mod-sheets/{id}/finalize"
        actor: BureauAnalyst
        preconditions:
          - "No active ModAppeal for this sheet"
        side_effects: []

  - entity: ModAppeal
    initial_state: FILED
    terminal_states: [UPHELD, REVERSED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /mod-appeals/{id}/review"
        actor: BureauAnalyst
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /mod-appeals/{id}/decide (decision = UPHELD)"
        actor: BureauAnalyst
        preconditions: []
        side_effects:
          - "Sheet transitions CONTESTED -> FINAL"

      - from: UNDER_REVIEW
        to: REVERSED
        trigger: "POST /mod-appeals/{id}/decide (decision = REVERSED)"
        actor: BureauAnalyst
        preconditions: []
        side_effects:
          - "Sheet transitions CONTESTED -> REVISED and a new DRAFT sheet is spawned"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /mod-appeals/{id}/withdraw"
        actor: EmployerRepresentative
        preconditions: []
        side_effects:
          - "Sheet transitions CONTESTED -> PROMULGATED"

  - entity: OwnershipChange
    initial_state: PENDING
    terminal_states: [COMBINED, NOT_COMBINED, REVERSED]
    transitions:
      - from: PENDING
        to: COMBINED
        trigger: "POST /ownership-changes/{id}/combine"
        actor: BureauAnalyst
        preconditions:
          - "All employers in the combinability group must be ACTIVE (ERR_EMPLOYER_INACTIVE)"
          - "No employer in the group may already be in another ACTIVE CombinabilityGroup (ERR_ALREADY_COMBINED)"
        side_effects:
          - "CombinabilityGroup created in ACTIVE"
          - "member_employer_ids = [ownership_change.employer_id, ...related employers]"
          - "A combined ExperienceModSheet is created in DRAFT for the group"

      - from: PENDING
        to: NOT_COMBINED
        trigger: "POST /ownership-changes/{id}/not_combined"
        actor: BureauAnalyst
        preconditions: []
        side_effects: []

      - from: COMBINED
        to: REVERSED
        trigger: "POST /ownership-changes/{id}/reverse"
        actor: BureauAnalyst
        preconditions:
          - "The CombinabilityGroup must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "CombinabilityGroup status -> DISSOLVED"
          - "The combined ExperienceModSheet is voided (status -> REVISED with revision_reason = CLASS_CODE_CHANGE)"
          - "Individual employers revert to their prior experience rating basis"

  - entity: CombinabilityGroup
    initial_state: ACTIVE
    terminal_states: [DISSOLVED]
    transitions:
      - from: ACTIVE
        to: DISSOLVED
        trigger: "system (automatic when the last OwnershipChange is reversed)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AssignedRiskEnrollment
    initial_state: PENDING
    terminal_states: [EXITED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /assigned-risk-enrollments/{id}/assign"
        actor: PoolAdministrator
        preconditions:
          - "Employer must be ACTIVE (ERR_EMPLOYER_INACTIVE)"
          - "The selected carrier must have assigned_risk_current_load_cents + estimated_annual_premium_cents <= assigned_risk_quota_cents (ERR_ASSIGNED_RISK_QUOTA_EXCEEDED)"
        side_effects:
          - "Carrier.assigned_risk_current_load_cents += estimated_annual_premium_cents"

      - from: ACTIVE
        to: EXITED
        trigger: "POST /assigned-risk-take-outs (with enrollment_id pointing to this enrollment)"
        actor: VoluntaryCarrierRepresentative
        preconditions:
          - "Enrollment must be ACTIVE (ERR_INVALID_STATE)"
          - "Voluntary carrier must be ACTIVE (ERR_CARRIER_NOT_ACTIVE)"
        side_effects:
          - "AssignedRiskTakeOut created in PENDING"
          - "Carrier.assigned_risk_current_load_cents -= estimated_annual_premium_cents (hold until take-out approved)"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /assigned-risk-enrollments/{id}/cancel"
        actor: PoolAdministrator
        preconditions: []
        side_effects:
          - "Carrier.assigned_risk_current_load_cents -= estimated_annual_premium_cents"

  - entity: AssignedRiskTakeOut
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /assigned-risk-take-outs/{id}/approve"
        actor: PoolAdministrator
        preconditions:
          - "Enrollment must be ACTIVE (ERR_INVALID_STATE)"
          - "If credit_cents >= bureau.underwriting_threshold_cents, an UnderwritingReview must be APPROVED (ERR_UNDERWRITING_REVIEW_REQUIRED)"
        side_effects:
          - "Enrollment status -> EXITED, exit_reason = TAKE_OUT"
          - "credit_cents computed per calculation take_out_credit"
          - "Carrier.assigned_risk_current_load_cents hold released"

      - from: PENDING
        to: REJECTED
        trigger: "POST /assigned-risk-take-outs/{id}/reject"
        actor: PoolAdministrator
        preconditions: []
        side_effects:
          - "Enrollment remains ACTIVE"
          - "Carrier.assigned_risk_current_load_cents hold released"

  - entity: UnderwritingReview
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /underwriting-reviews/{id}/approve"
        actor: Underwriter
        preconditions:
          - "Reviewer must not be the same user who created the subject (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: PENDING
        to: REJECTED
        trigger: "POST /underwriting-reviews/{id}/reject"
        actor: Underwriter
        preconditions:
          - "Reviewer must not be the same user who created the subject (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "If subject_type = TAKE_OUT, the take-out transitions PENDING -> REJECTED"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: mod-sheet-create-stale-employer
    parent_entity: Employer
    write_endpoint: "POST /experience-mod-sheets"
    occ_field: "expected_employer_version"
    description: |
      Creating an ExperienceModSheet against an Employer whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created a sheet (which legitimately
      supersedes the prior under the rating rules) and the current writer's
      view of the employer is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: take-out-create-stale-enrollment
    parent_entity: AssignedRiskEnrollment
    write_endpoint: "POST /assigned-risk-take-outs"
    occ_field: "expected_enrollment_version"
    description: |
      Creating an AssignedRiskTakeOut against an AssignedRiskEnrollment whose
      version has advanced since the client last observed it is rejected. This
      captures the case where another writer has just filed a take-out (which
      legitimately supersedes the prior under pool rules) and the current
      writer's view of the enrollment is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: expected_losses
    trigger: "experience mod sheet computation"
    algorithm: aggregation
    formula: |
      expected_losses_cents = sum over payroll_lines of
        round_half_up(payroll_dollars * elr_per_100_payroll_cents / 100)
      where elr_per_100_payroll_cents is looked up from the RatingTable
      in force at rating_effective_date for the policy's state and class_code.
      If a class_code is missing from the rating table, the payroll line is
      excluded and the sheet computation fails with ERR_CLASS_CODE_NOT_RATED.
    constants:
      ELR_LOOK_UP: "RatingTable.values[].elr_per_100_payroll_cents"
    precision: "integer cents, round_half_up per line then sum"

  - name: primary_excess_split
    trigger: "experience mod sheet computation"
    algorithm: threshold
    formula: |
      For each claim_line:
        primary_cents = min(incurred_cents, bureau.split_point_cents)
        excess_cents = incurred_cents - primary_cents
      actual_primary_cents = sum(primary_cents)
      actual_excess_cents = sum(excess_cents)
    constants:
      SPLIT_POINT: "bureau.split_point_cents"
    precision: "integer cents"

  - name: credibility_weighting
    trigger: "experience mod sheet computation"
    algorithm: weighted_scoring
    formula: |
      E = expected_losses_cents
      B = round_half_up(bureau.credibility_ballast_bp / 10000 * E)
      W = round_half_up(E / (E + bureau.credibility_excess_divisor_bp / 10000 * 100000000), 4)
      expected_primary_cents = round_half_up(E * d_ratio_bp / 10000)
      expected_excess_cents = E - expected_primary_cents
      term_Ae = round_half_up(W * actual_excess_cents)
      term_Ee = round_half_up((1 - W) * expected_excess_cents)
      numerator = actual_primary_cents + term_Ae + term_Ee + B
      denominator = E + B
      mod_factor = round_half_up(numerator / denominator, 2)
    constants:
      BALLAST_K: "bureau.credibility_ballast_bp"
      EXCESS_DIVISOR_J: "bureau.credibility_excess_divisor_bp"
      D_RATIO: "RatingTable.values[].d_ratio_bp"
    precision: "W to 4 decimal places, mod_factor to 2 decimal places, round_half_up at each step"

  - name: experience_mod_provisional
    trigger: "experience mod sheet computation (provisional variant)"
    algorithm: weighted_scoring
    formula: |
      Same as credibility_weighting, but the input set includes
      UnitStatReports with status = SUBMITTED in addition to VALIDATED/LOCKED.
      provisional_mod_factor is computed with the broader input set and stored
      alongside mod_factor. When the last SUBMITTED report is validated,
      provisional_mod_factor is recomputed to match mod_factor exactly.
    variants:
      - name: final
        when: "all consumed reports are VALIDATED or LOCKED"
        difference: "input set excludes SUBMITTED reports; mod_factor == provisional_mod_factor"
      - name: provisional
        when: "at least one consumed report is SUBMITTED"
        difference: "input set includes SUBMITTED reports; provisional_mod_factor may differ from mod_factor"

  - name: retroactive_premium_adjustment
    trigger: "experience mod sheet revision (PROMULGATED -> REVISED)"
    algorithm: chronological
    formula: |
      manual_premium_cents = sum over policy.class_codes of
        round_half_up(payroll_dollars * rate_per_100_payroll_cents / 100)
      billed_old_cents = round_half_up(manual_premium_cents * prior_sheet.mod_factor)
      billed_new_cents = round_half_up(manual_premium_cents * new_sheet.mod_factor)
      retroactive_premium_adjustment_cents = billed_new_cents - billed_old_cents
      Negative values represent a credit due to the insured.
      The adjustment is applied in full for the portion of the policy term
      already elapsed; no pro-ration is performed because the mod applies
      retroactively to the entire policy period.
    precision: "integer cents, round_half_up"

  - name: manual_premium
    trigger: "policy creation"
    algorithm: aggregation
    formula: |
      manual_premium_cents = sum over class_codes of
        round_half_up(payroll_dollars * rate_per_100_payroll_cents / 100)
      where rate_per_100_payroll_cents is looked up from the RatingTable
      in force at policy.effective_date for the policy's state and class_code.
      Rounding is per line, then summed. (Sum-then-round is forbidden.)
    constants:
      RATE_LOOK_UP: "RatingTable.values[].rate_per_100_payroll_cents"
    precision: "integer cents, round_half_up per line then sum"

  - name: take_out_credit
    trigger: "assigned risk take-out approval"
    algorithm: projection
    formula: |
      total_days = (expiration_date - effective_date).days + 1
      earned_days = (exit_date - effective_date).days
      remaining_days = total_days - earned_days
      pro_rata_credit_cents = round_half_up(
        estimated_annual_premium_cents * remaining_days / total_days * 0.5
      )
      short_rate_factor = round_half_up(0.9 * remaining_days / total_days, 4)
      short_rate_credit_cents = round_half_up(
        estimated_annual_premium_cents * short_rate_factor * 0.5
      )
      credit_cents = if exit_reason == TAKE_OUT then short_rate_credit_cents
                     else pro_rata_credit_cents
    constants:
      SHORT_RATE_FACTOR: 0.9
      POOL_SHARE: 0.5
    precision: "short_rate_factor to 4 decimal places, credit to integer cents, round_half_up"

  - name: assigned_risk_quota_utilization
    trigger: "assigned risk enrollment assignment"
    algorithm: threshold
    formula: |
      utilization_bp = round_half_up(
        carrier.assigned_risk_current_load_cents * 10000 / carrier.assigned_risk_quota_cents
      )
      If utilization_bp >= 8000, the pool administrator is warned.
      If current_load + estimated_annual_premium > quota, assignment is rejected
      with ERR_ASSIGNED_RISK_QUOTA_EXCEEDED.
    constants:
      WARN_THRESHOLD_BP: 8000
    precision: "integer basis points"

  - name: eligibility_determination
    trigger: "experience mod sheet promulgation"
    algorithm: threshold
    formula: |
      If expected_losses_cents >= bureau.eligibility_threshold_cents,
      the employer is eligible for experience rating and mod_factor is computed
      per credibility_weighting.
      Otherwise mod_factor is fixed at 1.00 (unity) and the sheet is still
      promulgated with that value.
    constants:
      THRESHOLD: "bureau.eligibility_threshold_cents"
    precision: "integer cents comparison, >= is inclusive"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority) (§1.4)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must have permission for this endpoint"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Resource IDs must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Resource must be in correct state for operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 5
    category: business_temporal
    check: "Date ranges must be valid (effective_date < expiration_date; no overlapping effective dates for same employer on ClassAssignment)"
    error_id: ERR_TEMPORAL_CONFLICT
    http_status: 409
    applies_to: "ClassAssignment create, Policy create, RatingTable create, AssignedRiskEnrollment create"

  - priority: 6
    category: business_referential
    check: "Referenced entities must exist and be in correct state (ClassCode ACTIVE, Carrier ACTIVE, Employer ACTIVE)"
    error_id: "ERR_CLASS_CODE_INACTIVE | ERR_CARRIER_NOT_ACTIVE | ERR_EMPLOYER_INACTIVE | ERR_CLASS_CODE_NOT_RATED"
    http_status: 409
    applies_to: "Policy create, ClassAssignment create, UnitStatReport create, ExperienceModSheet promulgate, AssignedRiskEnrollment assign"

  - priority: 7
    category: business_constraint
    check: "Aggregate and structural constraints (quota, eligibility, revision required, segregation of duties)"
    error_id: "ERR_ASSIGNED_RISK_QUOTA_EXCEEDED | ERR_NOT_ELIGIBLE_FOR_EXPERIENCE_RATING | ERR_MOD_REVISION_REQUIRED | ERR_SEGREGATION_OF_DUTIES | ERR_UNDERWRITING_REVIEW_REQUIRED | ERR_INSPECTION_REQUIRED | ERR_INSPECTION_WAIVE_NOT_ALLOWED | ERR_ALREADY_COMBINED | ERR_APPEAL_ALREADY_ACTIVE | ERR_UNVALIDATED_REPORTS"
    http_status: 409
    applies_to: "various"

  - priority: 8
    category: business_fiscal
    check: "Fiscal sanity (amounts non-negative, premium calculations consistent)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 9
    category: business_safety
    check: "OCC stale version check"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /experience-mod-sheets, POST /assigned-risk-take-outs"

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- Bureau ---
  - method: POST
    path: "/bureaus"
    description: "Create a Bureau"
    roles: [BureauAdmin]
    code: 201
    input: [code, name, eligibility_threshold_cents, split_point_cents, credibility_ballast_bp, credibility_excess_divisor_bp, underwriting_threshold_cents]
    output: Bureau
    side_effects: []

  - method: GET
    path: "/bureaus/{bureauId}"
    description: "Get a Bureau"
    roles: [Any]
    code: 200
    input: []
    output: Bureau
    side_effects: []

  # --- Carrier ---
  - method: POST
    path: "/carriers"
    description: "Create a Carrier"
    roles: [BureauAdmin]
    code: 201
    input: [naic_number, legal_name, assigned_risk_quota_cents]
    output: Carrier
    side_effects: ["assigned_risk_current_load_cents = 0, status = ACTIVE"]

  - method: GET
    path: "/carriers/{carrierId}"
    description: "Get a Carrier"
    roles: [Any]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  # --- Employer ---
  - method: POST
    path: "/employers"
    description: "Create an Employer"
    roles: [BureauAdmin]
    code: 201
    input: [fein, legal_name, state_code]
    output: Employer
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/employers/{employerId}"
    description: "Get an Employer"
    roles: [Any]
    code: 200
    input: []
    output: Employer
    side_effects: []

  # --- ClassCode ---
  - method: POST
    path: "/class-codes"
    description: "Create a ClassCode"
    roles: [BureauAdmin]
    code: 201
    input: [code, description, state_code]
    output: ClassCode
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/class-codes/{classCodeId}"
    description: "Get a ClassCode"
    roles: [Any]
    code: 200
    input: []
    output: ClassCode
    side_effects: []

  # --- RatingTable ---
  - method: POST
    path: "/rating-tables"
    description: "Create a RatingTable"
    roles: [BureauAdmin]
    code: 201
    input: [state_code, effective_date, values]
    output: RatingTable
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/rating-tables/{ratingTableId}"
    description: "Get a RatingTable"
    roles: [Any]
    code: 200
    input: []
    output: RatingTable
    side_effects: []

  - method: POST
    path: "/rating-tables/{ratingTableId}/promulgate"
    description: "Promulgate a RatingTable"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: RatingTable
    side_effects: ["status -> PROMULGATED; any prior PROMULGATED table for same state_code -> SUPERSEDED"]

  # --- Policy ---
  - method: POST
    path: "/policies"
    description: "Create a Policy"
    roles: [CarrierDataReporter]
    code: 201
    input: [employer_id, carrier_id, policy_number, effective_date, expiration_date, class_codes]
    output: Policy
    side_effects: ["status = ACTIVE, manual_premium_cents computed per manual_premium"]

  - method: GET
    path: "/policies/{policyId}"
    description: "Get a Policy"
    roles: [Any]
    code: 200
    input: []
    output: Policy
    side_effects: []

  # --- UnitStatReport ---
  - method: POST
    path: "/unit-stat-reports"
    description: "Create a UnitStatReport"
    roles: [CarrierDataReporter]
    code: 201
    input: [policy_id, payroll_lines, claim_lines, "correction_of_report_id?"]
    output: UnitStatReport
    side_effects: ["status = SUBMITTED; if correction_of_report_id set, referenced report -> CORRECTED"]

  - method: GET
    path: "/unit-stat-reports/{unitStatReportId}"
    description: "Get a UnitStatReport"
    roles: [Any]
    code: 200
    input: []
    output: UnitStatReport
    side_effects: []

  - method: POST
    path: "/unit-stat-reports/{unitStatReportId}/validate"
    description: "Validate a UnitStatReport"
    roles: [BureauAnalyst]
    code: 200
    input: []
    output: UnitStatReport
    side_effects: ["status -> VALIDATED; Policy.unit_stat_report_id = this report"]

  # --- ClassAssignment ---
  - method: POST
    path: "/class-assignments"
    description: "Create a ClassAssignment"
    roles: [BureauAnalyst]
    code: 201
    input: [employer_id, class_code_id, effective_date]
    output: ClassAssignment
    side_effects: ["status = PENDING_INSPECTION"]

  - method: GET
    path: "/class-assignments/{classAssignmentId}"
    description: "Get a ClassAssignment"
    roles: [Any]
    code: 200
    input: []
    output: ClassAssignment
    side_effects: []

  - method: POST
    path: "/class-assignments/{classAssignmentId}/assign"
    description: "Assign a ClassAssignment (after inspection)"
    roles: [BureauAnalyst]
    code: 200
    input: []
    output: ClassAssignment
    side_effects: ["status -> ASSIGNED; Inspection created if required"]

  - method: POST
    path: "/class-assignments/{classAssignmentId}/confirm"
    description: "Confirm a ClassAssignment"
    roles: [BureauAnalyst]
    code: 200
    input: []
    output: ClassAssignment
    side_effects: ["status -> CONFIRMED"]

  - method: POST
    path: "/class-assignments/{classAssignmentId}/withdraw"
    description: "Withdraw a ClassAssignment"
    roles: [EmployerRepresentative]
    code: 200
    input: []
    output: ClassAssignment
    side_effects: ["status -> WITHDRAWN"]

  # --- Inspection ---
  - method: GET
    path: "/inspections/{inspectionId}"
    description: "Get an Inspection"
    roles: [Any]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: POST
    path: "/inspections/{inspectionId}/complete"
    description: "Complete an Inspection"
    roles: [Inspector]
    code: 200
    input: [findings]
    output: Inspection
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/inspections/{inspectionId}/waive"
    description: "Waive an Inspection"
    roles: [BureauAnalyst]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status -> WAIVED"]

  # --- ClassAssignmentDispute ---
  - method: POST
    path: "/class-assignment-disputes"
    description: "File a ClassAssignmentDispute"
    roles: [EmployerRepresentative]
    code: 201
    input: [class_assignment_id, reason]
    output: ClassAssignmentDispute
    side_effects: ["status = OPEN; ClassAssignment -> DISPUTED"]

  - method: GET
    path: "/class-assignment-disputes/{disputeId}"
    description: "Get a ClassAssignmentDispute"
    roles: [Any]
    code: 200
    input: []
    output: ClassAssignmentDispute
    side_effects: []

  - method: POST
    path: "/class-assignment-disputes/{disputeId}/review"
    description: "Move dispute to IN_REVIEW"
    roles: [BureauAnalyst]
    code: 200
    input: []
    output: ClassAssignmentDispute
    side_effects: ["status -> IN_REVIEW"]

  - method: POST
    path: "/class-assignment-disputes/{disputeId}/resolve"
    description: "Resolve a ClassAssignmentDispute"
    roles: [BureauAnalyst]
    code: 200
    input: [resolution, "new_class_code_id?"]
    output: ClassAssignmentDispute
    side_effects: ["status -> RESOLVED; ClassAssignment transitions per its machine"]

  - method: POST
    path: "/class-assignment-disputes/{disputeId}/withdraw"
    description: "Withdraw a ClassAssignmentDispute"
    roles: [EmployerRepresentative]
    code: 200
    input: []
    output: ClassAssignmentDispute
    side_effects: ["status -> WITHDRAWN; ClassAssignment reverts to prior status"]

  # --- ExperienceModSheet ---
  - method: POST
    path: "/experience-mod-sheets"
    description: "Create an ExperienceModSheet"
    roles: [BureauAnalyst]
    code: 201
    input: [employer_id, rating_effective_date, expected_employer_version]
    output: ExperienceModSheet
    side_effects: ["status = DRAFT; expected_losses_cents, actual_primary_cents, actual_excess_cents, ballast_cents, weight_w, mod_factor, provisional_mod_factor computed"]

  - method: GET
    path: "/experience-mod-sheets/{modSheetId}"
    description: "Get an ExperienceModSheet"
    roles: [Any]
    code: 200
    input: []
    output: ExperienceModSheet
    side_effects: []

  - method: POST
    path: "/experience-mod-sheets/{modSheetId}/promulgate"
    description: "Promulgate an ExperienceModSheet"
    roles: [BureauAnalyst]
    code: 200
    input: []
    output: ExperienceModSheet
    side_effects: ["status -> PROMULGATED; prior sheet -> REVISED; consumed reports -> LOCKED; UnderwritingReview created if threshold met"]

  - method: POST
    path: "/experience-mod-sheets/{modSheetId}/finalize"
    description: "Finalize an ExperienceModSheet"
    roles: [BureauAnalyst]
    code: 200
    input: []
    output: ExperienceModSheet
    side_effects: ["status -> FINAL"]

  # --- ModAppeal ---
  - method: POST
    path: "/mod-appeals"
    description: "File a ModAppeal"
    roles: [EmployerRepresentative]
    code: 201
    input: [mod_sheet_id, reason]
    output: ModAppeal
    side_effects: ["status = FILED; sheet -> CONTESTED"]

  - method: GET
    path: "/mod-appeals/{appealId}"
    description: "Get a ModAppeal"
    roles: [Any]
    code: 200
    input: []
    output: ModAppeal
    side_effects: []

  - method: POST
    path: "/mod-appeals/{appealId}/review"
    description: "Move ModAppeal to UNDER_REVIEW"
    roles: [BureauAnalyst]
    code: 200
    input: []
    output: ModAppeal
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/mod-appeals/{appealId}/decide"
    description: "Decide a ModAppeal"
    roles: [BureauAnalyst]
    code: 200
    input: [decision, decision_reason]
    output: ModAppeal
    side_effects: ["status -> UPHELD or REVERSED; sheet transitions per its machine"]

  - method: POST
    path: "/mod-appeals/{appealId}/withdraw"
    description: "Withdraw a ModAppeal"
    roles: [EmployerRepresentative]
    code: 200
    input: []
    output: ModAppeal
    side_effects: ["status -> WITHDRAWN; sheet -> PROMULGATED"]

  # --- OwnershipChange ---
  - method: POST
    path: "/ownership-changes"
    description: "Report an OwnershipChange"
    roles: [BureauAnalyst]
    code: 201
    input: [employer_id, change_type, effective_date]
    output: OwnershipChange
    side_effects: ["status = PENDING"]

  - method: GET
    path: "/ownership-changes/{changeId}"
    description: "Get an OwnershipChange"
    roles: [Any]
    code: 200
    input: []
    output: OwnershipChange
    side_effects: []

  - method: POST
    path: "/ownership-changes/{changeId}/combine"
    description: "Combine employers into a CombinabilityGroup"
    roles: [BureauAnalyst]
    code: 200
    input: [member_employer_ids]
    output: OwnershipChange
    side_effects: ["status -> COMBINED; CombinabilityGroup created; combined ExperienceModSheet created in DRAFT"]

  - method: POST
    path: "/ownership-changes/{changeId}/not_combined"
    description: "Mark employers as not combinable"
    roles: [BureauAnalyst]
    code: 200
    input: []
    output: OwnershipChange
    side_effects: ["status -> NOT_COMBINED"]

  - method: POST
    path: "/ownership-changes/{changeId}/reverse"
    description: "Reverse a combinability determination"
    roles: [BureauAnalyst]
    code: 200
    input: []
    output: OwnershipChange
    side_effects: ["status -> REVERSED; CombinabilityGroup -> DISSOLVED; combined sheet voided"]

  # --- CombinabilityGroup ---
  - method: GET
    path: "/combinability-groups/{groupId}"
    description: "Get a CombinabilityGroup"
    roles: [Any]
    code: 200
    input: []
    output: CombinabilityGroup
    side_effects: []

  # --- AssignedRiskEnrollment ---
  - method: POST
    path: "/assigned-risk-enrollments"
    description: "Create an AssignedRiskEnrollment"
    roles: [PoolAdministrator]
    code: 201
    input: [employer_id, state_code, effective_date, expiration_date, estimated_annual_premium_cents]
    output: AssignedRiskEnrollment
    side_effects: ["status = PENDING"]

  - method: GET
    path: "/assigned-risk-enrollments/{enrollmentId}"
    description: "Get an AssignedRiskEnrollment"
    roles: [Any]
    code: 200
    input: []
    output: AssignedRiskEnrollment
    side_effects: []

  - method: POST
    path: "/assigned-risk-enrollments/{enrollmentId}/assign"
    description: "Assign a carrier to an AssignedRiskEnrollment"
    roles: [PoolAdministrator]
    code: 200
    input: [carrier_id]
    output: AssignedRiskEnrollment
    side_effects: ["status -> ACTIVE; Carrier.assigned_risk_current_load_cents += estimated_annual_premium_cents"]

  - method: POST
    path: "/assigned-risk-enrollments/{enrollmentId}/cancel"
    description: "Cancel an AssignedRiskEnrollment"
    roles: [PoolAdministrator]
    code: 200
    input: []
    output: AssignedRiskEnrollment
    side_effects: ["status -> CANCELLED; Carrier.assigned_risk_current_load_cents -= estimated_annual_premium_cents"]

  # --- AssignedRiskTakeOut ---
  - method: POST
    path: "/assigned-risk-take-outs"
    description: "File a take-out request"
    roles: [VoluntaryCarrierRepresentative]
    code: 201
    input: [enrollment_id, voluntary_carrier_id, exit_date, expected_enrollment_version]
    output: AssignedRiskTakeOut
    side_effects: ["status = PENDING; Enrollment -> EXITED (hold on carrier load)"]

  - method: GET
    path: "/assigned-risk-take-outs/{takeOutId}"
    description: "Get an AssignedRiskTakeOut"
    roles: [Any]
    code: 200
    input: []
    output: AssignedRiskTakeOut
    side_effects: []

  - method: POST
    path: "/assigned-risk-take-outs/{takeOutId}/approve"
    description: "Approve a take-out"
    roles: [PoolAdministrator]
    code: 200
    input: []
    output: AssignedRiskTakeOut
    side_effects: ["status -> APPROVED; credit_cents computed; Enrollment -> EXITED, exit_reason = TAKE_OUT; carrier load hold released"]

  - method: POST
    path: "/assigned-risk-take-outs/{takeOutId}/reject"
    description: "Reject a take-out"
    roles: [PoolAdministrator]
    code: 200
    input: []
    output: AssignedRiskTakeOut
    side_effects: ["status -> REJECTED; Enrollment remains ACTIVE; carrier load hold released"]

  # --- UnderwritingReview ---
  - method: GET
    path: "/underwriting-reviews/{reviewId}"
    description: "Get an UnderwritingReview"
    roles: [Any]
    code: 200
    input: []
    output: UnderwritingReview
    side_effects: []

  - method: POST
    path: "/underwriting-reviews/{reviewId}/approve"
    description: "Approve an UnderwritingReview"
    roles: [Underwriter]
    code: 200
    input: []
    output: UnderwritingReview
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/underwriting-reviews/{reviewId}/reject"
    description: "Reject an UnderwritingReview"
    roles: [Underwriter]
    code: 200
    input: []
    output: UnderwritingReview
    side_effects: ["status -> REJECTED"]

  # --- Reverse-reachability GETs (FK traversal) ---
  - method: GET
    path: "/employers/{employerId}/policies"
    description: "List policies for an employer"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Policy[]"
    side_effects: []

  - method: GET
    path: "/policies/{policyId}/unit-stat-reports"
    description: "List unit stat reports for a policy"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "UnitStatReport[]"
    side_effects: []

  - method: GET
    path: "/employers/{employerId}/class-assignments"
    description: "List class assignments for an employer"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ClassAssignment[]"
    side_effects: []

  - method: GET
    path: "/class-assignments/{classAssignmentId}/inspections"
    description: "List inspections for a class assignment"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []

  - method: GET
    path: "/class-assignments/{classAssignmentId}/disputes"
    description: "List disputes for a class assignment"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ClassAssignmentDispute[]"
    side_effects: []

  - method: GET
    path: "/employers/{employerId}/experience-mod-sheets"
    description: "List experience mod sheets for an employer"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
