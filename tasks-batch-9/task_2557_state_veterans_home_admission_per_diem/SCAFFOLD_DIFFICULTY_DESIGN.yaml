            - call: "POST /svh/income-records/${ir_mil_id}/verify"
              payload: { decision: "VERIFIED" }
              as: BusinessOfficeManager
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/residents/${res_id}/hospitalization"
              payload: { hospitalization_start_date: "2026-08-20" }
              as: AdmissionsCoordinator
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/residents/${res_id}/readmission"
              payload: { readmission_date: "2026-08-24" }
              as: AdmissionsCoordinator
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/_ops/census-run"
              payload: { through_date: "2026-08-31", veterans_home_id: "${home_id}" }
              as: StateProgramAdmin
            - call: "GET /svh/residents/${res_id}"
              payload: {}
              as: BusinessOfficeManager
              captures: { rv1: "$.data.version" }
          trigger:
            - call: "POST /svh/residents/${res_id}/cost-share-determinations"
              payload: { variant: "PROVISIONAL", effective_month: "2026-08", expected_resident_version: "${rv1}" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { prov_id: "$.data.id" }
            - call: "GET /svh/residents/${res_id}"
              payload: {}
              as: BusinessOfficeManager
              captures: { rv2: "$.data.version" }
            - call: "POST /svh/residents/${res_id}/cost-share-determinations"
              payload: { variant: "FINAL", effective_month: "2026-08", expected_resident_version: "${rv2}", declared_medical_expense_cents: 20000 }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { final_id: "$.data.id" }
          assert:
            - "CostShareDetermination.${prov_id}.gross_countable_income_cents == 316000"
            - "CostShareDetermination.${prov_id}.pna_deduction_cents == 9000"
            - "CostShareDetermination.${prov_id}.income_tier == TIER_3"
            - "CostShareDetermination.${prov_id}.allowed_medical_deduction_cents == 0"
            - "CostShareDetermination.${prov_id}.tiered_share_cents == 162400"
            - "CostShareDetermination.${prov_id}.resident_day_count == 27"
            - "CostShareDetermination.${prov_id}.federal_per_diem_offset_cents == 0"
            - "CostShareDetermination.${prov_id}.monthly_cost_share_cents == 141445"
            - "CostShareDetermination.${prov_id}.delta_from_prior_cents == 0"
            - "CostShareDetermination.${final_id}.gross_countable_income_cents == 220000"
            - "CostShareDetermination.${final_id}.income_tier == TIER_2"
            - "CostShareDetermination.${final_id}.allowed_medical_deduction_cents == 15000"
            - "CostShareDetermination.${final_id}.tiered_share_cents == 92800"
            - "CostShareDetermination.${final_id}.resident_day_count == 23"
            - "CostShareDetermination.${final_id}.federal_per_diem_offset_cents == 13636"
            - "CostShareDetermination.${final_id}.monthly_cost_share_cents == 79164"
            - "CostShareDetermination.${final_id}.delta_from_prior_cents == -62281"
            - "Resident.${res_id}.monthly_cost_share_cents == 79164"
            - "Resident.${res_id}.billing_status == FINAL_COST_SHARE"
            - "Resident.${res_id}.occupancy_status == ADMITTED"

