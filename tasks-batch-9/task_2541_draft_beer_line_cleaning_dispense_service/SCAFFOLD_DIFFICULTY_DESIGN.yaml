            - "BeerLine.${line1}.status == IN_SERVICE"

  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # One numeric band edge (weighted_scoring, 2dp) and the two OPPOSING interval
  # conventions that share the booking endpoint: closed-interval venue
  # exclusivity (touching = conflict) vs half-open buffered technician routing
  # (a gap of exactly the buffer = accepted).
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: glycol_health_score_of_exactly_seventy_five_is_normal_and_seventy_four_seventy_five_is_watch
        grounds:
          - calculations.glycol_health_score
          - entities.GlycolLoop.fields.health_score
          - entities.GlycolLoop.fields.status
          - entities.GlycolLoop.fields.window_avg_cooler_temp_f
          - endpoints.POST_glycol_loops_maintenance
          - endpoints.POST_cooler_readings
        distinguishing_aspect: |
          WATCH_THRESHOLD is inclusive on its lower edge. glycol_pct 20.0 gives
          glycol_penalty exactly (30.0 - 20.0) * 2.5 == 25.00 and three 38.0
          readings give temp_penalty 0.00, so health_score lands on 75.00 and
          the loop must read NORMAL. Dropping glycol_pct by one tenth to 19.9
          makes the penalty 25.25 - a value only reachable because each penalty
          is rounded to 2dp INDEPENDENTLY - and health_score 74.75 flips the
          loop to WATCH. The loop is never created by a POST: it is a cascade
          child of the account and must be discovered through the list filter.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z then 2026-08-05T09:00:00Z."
            - "ServiceAccount 'Glacier Hall' created with glycol_system_present true, which cascade-creates one GlycolLoop (glycol_pct 35.0, pump_psi 12.0, health_score 100.0, NORMAL) that is NOT in the create response."
            - "ACTIVE contract; one Technician; a GLYCOL_MAINTENANCE visit on 2026-08-05 540-660, started."
            - "Maintenance recorded with glycol_pct 20.0, pump_psi 12.0, bath_temp_f 28.0 (so last_serviced_at is now and service_penalty is 0.00, pump_penalty 0.00)."
            - "Two CoolerReading rows at cooler_temp_f 38.0 already posted."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Glacier Hall", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: true }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "GET /draft-service/glycol-loops"
              payload: { account_id: "${acct}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { loop: "$.data[0].id", loop_score0: "$.data[0].health_score" }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "GLYCOL_MAINTENANCE", scheduled_date: "2026-08-05", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { visit: $.data.id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/service-visits/${visit}/start"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
            - call: "POST /draft-service/glycol-loops/${loop}/maintenance"
              payload: { visit_id: "${visit}", glycol_pct: 20.0, pump_psi: 12.0, bath_temp_f: 28.0 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { score_no_readings: $.data.health_score }
            - call: "POST /draft-service/cooler-readings"
              payload: { glycol_loop_id: "${loop}", cooler_temp_f: 38.0, glycol_supply_temp_f: 26.0 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { r1: $.data.id }
            - call: "POST /draft-service/cooler-readings"
              payload: { glycol_loop_id: "${loop}", cooler_temp_f: 38.0, glycol_supply_temp_f: 26.0 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /draft-service/cooler-readings"
              payload: { glycol_loop_id: "${loop}", cooler_temp_f: 38.0, glycol_supply_temp_f: 26.0 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { r3: $.data.id }
            - call: "GET /draft-service/glycol-loops/${loop}"
              payload: {}
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { score_edge: $.data.health_score, state_edge: $.data.status }
            - call: "POST /draft-service/glycol-loops/${loop}/maintenance"
              payload: { visit_id: "${visit}", glycol_pct: 19.9, pump_psi: 12.0, bath_temp_f: 28.0 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { score_below: $.data.health_score, state_below: $.data.status }
          assert:
            - "${loop_score0} == 100.0"
            - "${score_no_readings} == 75.0"
            - "${score_edge} == 75.0"
            - "${state_edge} == NORMAL"
            - "GlycolLoop.${loop}.window_avg_cooler_temp_f == 38.0 at the edge read"
            - "${score_below} == 74.75"
            - "${state_below} == WATCH"
            - "GlycolLoop.${loop}.glycol_pct == 19.9"
            - "CoolerReading.${r3}.source == TECH_MANUAL"
            - "CoolerReading.${r1}.cooler_temp_f == 38.0"

      - name: technician_route_gap_of_exactly_thirty_minutes_is_accepted_and_twenty_nine_is_rejected
        grounds:
          - validations.priority_34_ERR_TECHNICIAN_ROUTE_CONFLICT
          - validations.priority_33_ERR_VENUE_SLOT_CONFLICT
          - endpoints.POST_service_visits
          - complexity_profile.constants.TRAVEL_BUFFER_MINUTES
        distinguishing_aspect: |
          The technician rule is HALF-OPEN and buffered by exactly 30 minutes,
          so the accept/reject edge sits one minute apart on the same crew and
          the same day: 690 against a job ending at 660 is accepted because
          690 < 660 + 30 is false, while 809 against a job ending at 780 is
          rejected because 809 < 780 + 30 is true. 810 is then accepted. Every
          slot in this instance is chosen so the higher-priority venue rule
          (P33) never fires, which is what makes the reported error attributable
          to the route buffer alone.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "ServiceAccount 'Ridgeline Growler' access window 480-1080, ACTIVE contract."
            - "One Technician 'Dana Ruiz' ACTIVE."
            - "One SCHEDULED visit on 2026-08-05 540-660 with that technician."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Ridgeline Growler", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 690, scheduled_end_minute: 780 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { v2: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 809, scheduled_end_minute: 900 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err_route: $.data.error_id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 810, scheduled_end_minute: 900 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { v3: $.data.id }
          assert:
            - "first trigger POST /draft-service/service-visits returns HTTP 201 (gap 690 - 660 == 30, exactly the buffer)"
            - "ServiceVisit.${v2}.scheduled_start_minute == 690"
            - "ServiceVisit.${v2}.work_status == SCHEDULED"
            - "second trigger POST /draft-service/service-visits returns HTTP 409 with error_id ERR_TECHNICIAN_ROUTE_CONFLICT (gap 809 - 780 == 29)"
            - "${err_route} == ERR_TECHNICIAN_ROUTE_CONFLICT"
            - "third trigger POST /draft-service/service-visits returns HTTP 201 (gap 810 - 780 == 30)"
            - "ServiceVisit.${v3}.scheduled_start_minute == 810"
            - "ServiceVisit.${v1}.work_status == SCHEDULED"

      - name: venue_slots_that_merely_touch_at_the_minute_boundary_conflict
        grounds:
          - validations.priority_33_ERR_VENUE_SLOT_CONFLICT
          - validations.priority_34_ERR_TECHNICIAN_ROUTE_CONFLICT
          - endpoints.POST_service_visits
        distinguishing_aspect: |
          The mirror image of the route-buffer edge, on the same endpoint and
          the same account: the venue rule is CLOSED on both ends and carries
          no buffer, so a second crew arriving at minute 660 - the exact minute
          the first crew leaves - is rejected, and starting one minute later at
