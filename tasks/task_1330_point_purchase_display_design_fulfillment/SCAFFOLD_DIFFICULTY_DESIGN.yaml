            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 40, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
              captures: { design_id: $.data.id }
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /pop/designs/${design_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/approve"
              payload: { expected_design_version: "${design_v}" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/authorize-production"
              payload: {}
              as: ProgramManager
              captures: { program_v2: $.data.version }
            - call: "POST /pop/production-runs"
              payload: { program_id: "${program_id}", design_id: "${design_id}", overage_pct: 8, expected_program_version: "${program_v2}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /pop/production-runs/${run_id}/authorize"
              payload: {}
              as: ProductionPlanner
          assert:
            - "ProductionRun.${run_id}.production_quantity == 216"
      - name: kit_component_rounding_per_line_then_sum
        grounds:
          - calculations.kit_component_rounding
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — 3 components at 7.335
          each produce 22.02 when rounded per-line then summed, versus 22.01 when
          summed then rounded; the scaffold pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "A kit exists with 3 components priced at 7.335 each"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Summer", store_count: 200, program_revenue_cents: 12000000 }
              as: ProgramManager
              captures: { program_id: $.data.id, program_v: $.data.version }
            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 40, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
              captures: { design_id: $.data.id }
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /pop/designs/${design_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/approve"
              payload: { expected_design_version: "${design_v}" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/authorize-production"
              payload: {}
              as: ProgramManager
              captures: { program_v2: $.data.version }
            - call: "POST /pop/production-runs"
              payload: { program_id: "${program_id}", design_id: "${design_id}", overage_pct: 8, expected_program_version: "${program_v2}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /pop/production-runs/${run_id}/authorize"
              payload: {}
              as: ProductionPlanner
            - call: "POST /pop/production-runs/${run_id}/mark-produced"
              payload: {}
              as: ProductionPlanner
            - call: "GET /pop/production-runs/${run_id}/kits"
              payload: {}
              as: WarehouseOperator
              captures: { kit_id: "$.data[0].id" }
          trigger:
            - call: "GET /pop/kits/${kit_id}"
              payload: {}
              as: WarehouseOperator
          assert:
            - "kit rollup uses round-per-line-then-sum: 3 * round_half_up(7.335,2) = 3 * 7.34 = 22.02"
            - "kit rollup != 22.01 (sum-then-round alternative)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: design_revision_loop_cycle
        grounds:
          - state_machines.DisplayDesign.REJECTED_to_DRAFT
        distinguishing_aspect: |
          DisplayDesign exhibits a cyclic shape: REJECTED -> DRAFT via /revise,
          incrementing revision_number, so the same entity can loop through the
          approval pipeline multiple times.
        test_recipe:
          setup:
            - "Program in DESIGN; design has been REJECTED once"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Summer", store_count: 200, program_revenue_cents: 12000000 }
              as: ProgramManager
              captures: { program_id: $.data.id }
            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 40, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
              captures: { design_id: $.data.id }
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /pop/designs/${design_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/reject"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /pop/designs/${design_id}/revise"
              payload: {}
              as: Designer
          assert:
            - "DisplayDesign.${design_id}.status == DRAFT"
            - "DisplayDesign.${design_id}.revision_number == 2"
      - name: shipment_branching_deliver_or_fail
        grounds:
          - state_machines.Shipment.SHIPPED_to_DELIVERED
          - state_machines.Shipment.SHIPPED_to_FAILED
        distinguishing_aspect: |
          Shipment exhibits a branching fork from SHIPPED to either DELIVERED
          (success path with delivered_at and kit cascade) or FAILED (terminal
          failure), with divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Shipment in SHIPPED status for a KITTED kit; current time within window"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Summer", store_count: 200, program_revenue_cents: 12000000 }
              as: ProgramManager
              captures: { program_id: $.data.id, program_v: $.data.version }
            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 40, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
              captures: { design_id: $.data.id }
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /pop/designs/${design_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/approve"
              payload: { expected_design_version: "${design_v}" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/authorize-production"
              payload: {}
              as: ProgramManager
              captures: { program_v2: $.data.version }
            - call: "POST /pop/production-runs"
              payload: { program_id: "${program_id}", design_id: "${design_id}", overage_pct: 8, expected_program_version: "${program_v2}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /pop/production-runs/${run_id}/authorize"
              payload: {}
              as: ProductionPlanner
            - call: "POST /pop/production-runs/${run_id}/mark-produced"
              payload: {}
              as: ProductionPlanner
            - call: "GET /pop/production-runs/${run_id}/kits"
              payload: {}
              as: WarehouseOperator
              captures: { kit_id: "$.data[0].id" }
            - call: "POST /pop/kits/${kit_id}/mark-kitted"
              payload: {}
              as: WarehouseOperator
            - call: "POST /pop/shipments"
              payload: { kit_id: "${kit_id}", ship_window_start: "2026-08-10T00:00:00Z", ship_window_end: "2026-08-20T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { shipment_id: $.data.id }
            - call: "POST /pop/shipments/${shipment_id}/set-appointment"
              payload: { appointment_at: "2026-08-15T10:00:00Z" }
              as: LogisticsCoordinator
            - call: "POST /pop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pop/shipments/${shipment_id}/ship"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /pop/shipments/${shipment_id}/fail"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "Shipment.${shipment_id}.status == FAILED"
            - "Shipment.${shipment_id}.delivered_at is null"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: mark_produced_creates_kits_then_kit_count
        grounds:
          - state_machines.ProductionRun.AUTHORIZED_to_PRODUCED
          - state_machines.ProductionRun.PLANNED_to_AUTHORIZED
        distinguishing_aspect: |
          Cascade depth 3: authorize (run -> computed fields) then mark-produced
          (run -> N kits created) then start-fulfillment gating on PRODUCED run —
          a chain where each link is caused by the previous link's mutation.
        test_recipe:
          setup:
            - "Program in PRODUCTION with 3 stores; design APPROVED; run AUTHORIZED"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Summer", store_count: 3, program_revenue_cents: 1000000 }
              as: ProgramManager
              captures: { program_id: $.data.id, program_v: $.data.version }
            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 40, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
              captures: { design_id: $.data.id }
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /pop/designs/${design_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/approve"
              payload: { expected_design_version: "${design_v}" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/authorize-production"
              payload: {}
              as: ProgramManager
              captures: { program_v2: $.data.version }
            - call: "POST /pop/stores"
              payload: { program_id: "${program_id}", store_number: "S1", address: "1 Main St" }
              as: ProgramManager
            - call: "POST /pop/stores"
              payload: { program_id: "${program_id}", store_number: "S2", address: "2 Main St" }
              as: ProgramManager
            - call: "POST /pop/stores"
              payload: { program_id: "${program_id}", store_number: "S3", address: "3 Main St" }
              as: ProgramManager
            - call: "POST /pop/production-runs"
              payload: { program_id: "${program_id}", design_id: "${design_id}", overage_pct: 0, expected_program_version: "${program_v2}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /pop/production-runs/${run_id}/authorize"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /pop/production-runs/${run_id}/mark-produced"
              payload: {}
              as: ProductionPlanner
          assert:
            - "GET /pop/production-runs/${run_id}/kits returns 3 kits"
            - "every returned kit.status == PENDING"
      - name: ship_cascades_kit_then_kit_gates_close
        grounds:
          - state_machines.Shipment.APPOINTMENT_SET_to_SHIPPED
          - state_machines.Kit.KITTED_to_SHIPPED
        distinguishing_aspect: |
          Cascade depth 2 from a different trigger: POST /shipments/{id}/ship
          mutates Shipment then cascades to Kit.status=SHIPPED; the kit's new
          state then gates downstream transitions (e.g. deliver, damage approve).
        test_recipe:
          setup:
            - "Shipment APPOINTMENT_SET for a KITTED kit; clock inside window"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
