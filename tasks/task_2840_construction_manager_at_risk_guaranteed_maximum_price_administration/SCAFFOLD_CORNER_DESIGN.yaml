              as: ConstructionManager
              captures: { e4: $.data.error_id }
          assert:
            - "trigger call 1 returns 409 with data.error_id == ERR_BOND_CLAIM_STATE_INVALID and Subcontract.${subA}.bond_claim_status is still NOT_APPLICABLE with version == ${subAv}"
            - "trigger call 2 returns 409 with data.error_id == ERR_BOND_CLAIM_STATE_INVALID: SETTLE is reachable only from ACKNOWLEDGED, and Subcontract.${subB}.bond_claim_status is still NONE"
            - "trigger call 3 returns 200 with bond_claim_status == FILED and bond_claim_amount == 100000.00"
            - "trigger call 4 returns 409 with data.error_id == ERR_BOND_CLAIM_STATE_INVALID and bond_claim_amount is still 100000.00: a refiling does not overwrite the claim amount"
            - "Subcontract.${subB}.contract_status is still ACTIVE throughout: the bond-claim endpoint never touches the performance axis"
            - "CmarProject.${proj}.construction_contingency_remaining is still 40000.00 and contingency_drawn_to_cost_total is still 0.00"

