            - "Creating the order for 1500 units was itself ACCEPTED - the ceiling binds at issue time, not at request time"
            - "The TG3 issue returns 200: 1000 <= 1000 is inclusive, TagOrder.${tg3_id}.status == ISSUED with serial_prefix \"OK-2026S1-0002\""
            - "ProductionQuota.${q_id}.tags_committed_units == 5000 and units_available == 0 afterwards"

  # =====================================================================
  - section: errors
    instances:
      - name: request_without_a_role_header_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "The priority-1 authentication check runs before everything else, so a request with no X-User-Role / X-User-ID headers returns 401 ERR_UNAUTHENTICATED even when its body is also invalid - the schema error at priority 3 never surfaces."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /varieties"
              payload: { denomination: "Pinnacle Bramble" }
              as: "(no X-User-Role header supplied)"
          assert:
            - "HTTP status is 401 and data.error_id == ERR_UNAUTHENTICATED"
            - "Not ERR_INVALID_REQUEST, even though the body is missing four required fields"
            - "GET /varieties with no role header also returns ERR_UNAUTHENTICATED - reads are authenticated too"
            - "An unrecognised role value returns ERR_UNAUTHENTICATED as well; only the five declared roles authenticate"

      - name: breeder_only_endpoint_called_by_a_propagator_returns_forbidden_role
        claim_type: error_triggerable
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_ROLE
          - roles
        distinguishing_aspect: "The priority-2 role check precedes existence, so calling a BreederAdmin-exclusive endpoint as Propagator returns 403 ERR_FORBIDDEN_ROLE even when the path id does not exist - ERR_VARIETY_NOT_FOUND at priority 4 never surfaces."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /varieties/00000000-0000-4000-8000-000000000000/release"
              payload: {}
              as: Propagator
              as_user_id: "00000000-0000-4000-8000-000000000001"
          assert:
            - "HTTP status is 403 and data.error_id == ERR_FORBIDDEN_ROLE"
            - "Not ERR_VARIETY_NOT_FOUND, and not ERR_PROPAGATOR_NOT_FOUND for the unknown acting id"
            - "The same path called as BreederAdmin returns ERR_VARIETY_NOT_FOUND, proving the role gate was what fired"

      - name: propagator_cannot_submit_a_report_belonging_to_another_propagator
        claim_type: error_triggerable
        grounds:
          - validations[priority=6]
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.Propagator
        distinguishing_aspect: "The Propagator role is entity_backed, so ownership is checked against the resource's agreement chain: P2 submitting P1's report returns 403 ERR_NOT_RESOURCE_OWNER - deliberately NOT a 404, because another propagator's report is forbidden rather than invisible (P2 can still read it through the shared GET)."
        test_recipe:
          setup:
            - "One Variety, two Propagators P1 and P2 each with an ACTIVE agreement, one ACTIVE quota under A1, and one DRAFT report R1 under A1 carrying a line of 100 units."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Quillon Bramble", species: "Rubus idaeus", breeder_code: "QN", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Quillon One", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p1_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Quillon Two", home_territory_code: "US-OR" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p2_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p1_id}", quality_tier: "TIER_B", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a1_id: $.data.id }
            - call: "POST /propagator-agreements/${a1_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a1_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 5000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q_id: $.data.id }
            - call: "POST /royalty-reports"
              payload: { agreement_id: "${a1_id}", period_code: "2026Q3", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_at: "2026-11-15T00:00:00Z" }
              as: Propagator
              as_user_id: "${p1_id}"
              captures: { r1_id: $.data.id, r1_ver: $.data.version }
            - call: "POST /royalty-reports/${r1_id}/line-items"
              payload: { quota_id: "${q_id}", reported_units: 100, expected_report_version: "${r1_ver}" }
              as: Propagator
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /royalty-reports/${r1_id}/submit"
              payload: {}
              as: Propagator
              as_user_id: "${p2_id}"
          assert:
            - "HTTP status is 403 and data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "RoyaltyReport.${r1_id}.review_status is still DRAFT and provisional_total_cents == 0"
            - "GET /royalty-reports/${r1_id} as Propagator ${p2_id} still returns 200 - the read is a shared operation"
            - "The same submit as Propagator ${p1_id} returns 200 with review_status SUBMITTED"

      - name: unknown_path_ids_return_each_entity_specific_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors
        distinguishing_aspect: "Every entity carries its own 404 code and templated segments resolve strictly left to right, so a call with TWO unknown ids reports the leftmost one - which is what makes the fourteen distinct codes individually observable."
        test_recipe:
          setup:
            - "Empty database. The literal 00000000-0000-4000-8000-000000000000 is used as the known-absent id everywhere."
          setup_api_calls: []
          trigger:
            - call: "GET /propagators/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP status is 404 and data.error_id == ERR_PROPAGATOR_NOT_FOUND"
            - "GET /propagator-agreements/{absent} returns ERR_AGREEMENT_NOT_FOUND"
            - "GET /production-quotas/{absent} returns ERR_QUOTA_NOT_FOUND"
            - "GET /tag-orders/{absent} returns ERR_TAG_ORDER_NOT_FOUND"
            - "GET /royalty-reports/{absent} returns ERR_ROYALTY_REPORT_NOT_FOUND"
            - "GET /royalty-line-items/{absent} returns ERR_LINE_ITEM_NOT_FOUND"
            - "GET /sublicense-grants/{absent} returns ERR_SUBLICENSE_GRANT_NOT_FOUND"
            - "GET /surveillance-cases/{absent} returns ERR_SURVEILLANCE_CASE_NOT_FOUND"
            - "GET /audit-engagements/{absent} returns ERR_AUDIT_ENGAGEMENT_NOT_FOUND"
            - "GET /varieties/{absent} returns ERR_VARIETY_NOT_FOUND and GET /trial-sites/{absent} returns ERR_TRIAL_SITE_NOT_FOUND"
            - "POST /surveillance-cases/{absent}/genetic-tests with a well-formed body returns ERR_SURVEILLANCE_CASE_NOT_FOUND (the path segment, priority 4) rather than any body-level code"

      - name: report_accepted_by_the_countersigning_officer_returns_403
        claim_type: error_triggerable
        grounds:
          - validations[priority=12]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
        distinguishing_aspect: "Segregation of duties is enforced on X-User-ID, not on role: officer-1 holds the LicensingOfficer role and would otherwise be authorized, but because officer-1 is the agreement's countersigned_by_user_id the accept returns 403 ERR_SEGREGATION_OF_DUTIES. The mirror rule blocks the acceptor from settling."
        test_recipe:
