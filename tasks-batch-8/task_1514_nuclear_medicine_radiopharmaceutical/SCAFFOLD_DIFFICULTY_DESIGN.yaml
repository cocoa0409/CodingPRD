# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1514 nuclear medicine
# 9 rules x 2 instances = 18 instances. Every chain replays against SCAFFOLD.yaml.
# Shared base fixture (repeated per instance for self-containment):
#   clock 08:00 -> F-18 isotope (HL 110) -> license L-100 (cond 50000/BOTH) ->
#   AU Dr. A (BOTH) -> patient -> delivery 5000@08:00 received -> room(15) ->
#   clock 08:30 -> order(prescribed 100, admin 10:20) -> vial -> calibrate 220.000
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: vial_assay_exact_vs_tabular_diverge
        grounds:
          - calculations.decay_corrected_activity
          - entities.DoseAdministration.fields.assayed_activity_exact_mbq
          - entities.DoseAdministration.fields.assayed_activity_tabular_mbq
        distinguishing_aspect: |
          Same vial, same instants, same isotope: the exact_exponential variant
          (single final rounding) yields 110.000 MBq while the tabular_minute_step
          variant (per-minute rounding at df=0.993718) yields 109.993 MBq. Entity
          domain: DoseVial/DoseAdministration assay — distinct from the
          PatientReleaseInstruction domain of the sibling instance.
        test_recipe:
          setup:
            - "Base F-18 fixture; vial calibrated 220.000 MBq at 2026-08-01T08:30:00Z; appointment 10:00-10:30; clock advanced to 10:20 (exactly one half-life, 110 min, after calibration)"
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. A", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist }
            - { call: "POST /nuclear-medicine/imaging-rooms", payload: { name: "Room-1", cleanup_buffer_minutes: 15 }, as: DepartmentAdmin, captures: { room: $.data.id } }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ord}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { vial: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/calibrate", payload: { measured_activity_mbq: 220 }, as: Radiopharmacist, as_user_id: "rp-1" }
            - { call: "POST /nuclear-medicine/procedure-appointments", payload: { order_id: "${ord}", room_id: "${room}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T10:30:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1", captures: { appt: $.data.id } }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:20:00Z" }, as: DepartmentAdmin }
          trigger:
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/administer", payload: {}, as: NuclearMedicineTechnologist, as_user_id: "tech-2", captures: { adm: $.data.id, exact: $.data.assayed_activity_exact_mbq, tabular: $.data.assayed_activity_tabular_mbq } }
          assert:
            - "DoseAdministration.${adm}.assayed_activity_exact_mbq == 110.000"
            - "DoseAdministration.${adm}.assayed_activity_tabular_mbq == 109.993"
            - "assayed_activity_exact_mbq != assayed_activity_tabular_mbq for identical inputs"
            - "DoseAdministration.${adm}.within_admin_window == true"

      - name: release_activity_variant_vs_measured_rate_variant
        grounds:
          - calculations.release_eligibility
          - entities.PatientReleaseInstruction.fields.evaluation_variant
          - errors[ERR_RELEASE_CRITERIA_NOT_MET]
        distinguishing_aspect: |
          Same administration (assayed 1098.024 MBq of I-131): the ACTIVITY_BASED
          variant (<= 1221 MBq tabulated limit) releases the patient while the
          MEASURED_RATE_BASED variant (80.0 uSv/h > 70 uSv/h) rejects with
          ERR_RELEASE_CRITERIA_NOT_MET. Entity domain: PatientReleaseInstruction —
          distinct from the DoseVial assay domain of the sibling instance.
        test_recipe:
          setup:
            - "I-131 fixture: two orders, two vials calibrated 1100.000 at 08:30, both administered at 09:00 (assayed exact 1098.024 MBq); no release instructions yet"
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "I-131", half_life_minutes: 11568, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 1 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-200", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. B", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P Two", weight_kg: 80 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "THERAPEUTIC", prescribed_activity_mbq: 1000, administration_scheduled_at: "2026-08-01T09:00:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ordA: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "THERAPEUTIC", prescribed_activity_mbq: 1000, administration_scheduled_at: "2026-08-01T09:00:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ordB: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ordA}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { vialA: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ordB}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { vialB: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${vialA}/calibrate", payload: { measured_activity_mbq: 1100 }, as: Radiopharmacist, as_user_id: "rp-1" }
            - { call: "POST /nuclear-medicine/dose-vials/${vialB}/calibrate", payload: { measured_activity_mbq: 1100 }, as: Radiopharmacist, as_user_id: "rp-1" }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-vials/${vialA}/administer", payload: {}, as: NuclearMedicineTechnologist, as_user_id: "tech-1", captures: { admA: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${vialB}/administer", payload: {}, as: NuclearMedicineTechnologist, as_user_id: "tech-1", captures: { admB: $.data.id } }
          trigger:
            - { call: "POST /nuclear-medicine/patient-release-instructions", payload: { administration_id: "${admA}", evaluation_variant: "ACTIVITY_BASED" }, as: AuthorizedUser, as_user_id: "${au}", captures: { rel: $.data.id, releasable: $.data.releasable } }
            - { call: "POST /nuclear-medicine/patient-release-instructions", payload: { administration_id: "${admB}", evaluation_variant: "MEASURED_RATE_BASED", measured_dose_rate_at_1m_usv_h: 80 }, as: AuthorizedUser, as_user_id: "${au}", captures: { err: $.data.error_id } }
          assert:
            - "PatientReleaseInstruction.${rel}.releasable == true and status == ISSUED (1098.024 <= 1221 under ACTIVITY_BASED)"
            - "Second trigger is rejected with error_id == ERR_RELEASE_CRITERIA_NOT_MET (80.0 > 70 under MEASURED_RATE_BASED) and no row persisted for ${admB}"

  - rule_id: combinatorial_formula
    instances:
      - name: required_activity_branching_formula
        grounds:
          - calculations.required_activity_at_preparation
          - entities.DoseVial.fields.required_activity_mbq
        distinguishing_aspect: |
          Mode (a) combinatorial: 3+ inputs (prescribed_activity_mbq, dt to
          scheduled administration, half-life-tiered overage branch) with
          non-linear interaction (2 ** (dt/HL) times a tier-selected overage).
          F-18 (HL 110 < 120 => overage 1.10), prescribed 100, dt = 110 min =>
          100 * 2^1 * 1.10 = 220.000. Differs in mode from the sibling instance's
          nested-rounding (mode b).
        test_recipe:
          setup:
            - "Base F-18 fixture through delivery receipt; clock 08:30; order prescribed 100 MBq scheduled 10:20 (dt = 110 min)"
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. A", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ord}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { vial: $.data.id, req: $.data.required_activity_mbq } }
          assert:
            - "DoseVial.${vial}.required_activity_mbq == 220.000"
            - "DoseOrder.${ord}.status == DOSE_PREPARED after vial creation"

      - name: possession_per_component_rounding_order
        grounds:
          - calculations.current_possession_mbq
          - entities.RadiopharmacyLicense.fields.current_possession_mbq
        distinguishing_aspect: |
          Mode (b) nested rounding: two CALIBRATED vials each decay to raw
          0.993718... MBq one minute after calibration. The PINNED order (round
          each component to 3 decimals, then sum) yields 0.994 + 0.994 = 1.988;
          the non-conformant sum-then-round order yields 1.987. Differs in mode
          from the sibling instance's branching formula (mode a).
        test_recipe:
          setup:
            - "Trace-isotope fixture (min_usable 0.5): one order, two vials each calibrated 1.000 MBq at 08:30; clock advanced to 08:31 (exactly 1 minute of decay)"
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 trace", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 0.5 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-300", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. C", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P Three", weight_kg: 60 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 1, administration_scheduled_at: "2026-08-01T12:00:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ord}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { v1: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${v1}/calibrate", payload: { measured_activity_mbq: 1 }, as: Radiopharmacist, as_user_id: "rp-1" }
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ord}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { v2: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${v2}/calibrate", payload: { measured_activity_mbq: 1 }, as: Radiopharmacist, as_user_id: "rp-1" }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:31:00Z" }, as: DepartmentAdmin }
          trigger:
            - { call: "GET /nuclear-medicine/licenses/${lic}", as: DepartmentAdmin, captures: { poss: $.data.current_possession_mbq } }
          assert:
            - "RadiopharmacyLicense.${lic}.current_possession_mbq == 1.988 (0.994 + 0.994; sum-then-round would give 1.987)"

  - rule_id: non_linear_state_machine
    instances:
      - name: dose_order_hold_restore_cycle
        grounds:
          - state_machines.DoseOrder.DOSE_PREPARED_to_ON_HOLD
          - state_machines.DoseOrder.ON_HOLD_to_DOSE_PREPARED
          - entities.DoseOrder.fields.hold_previous_status
        distinguishing_aspect: |
          Cycle on DoseOrder: DOSE_PREPARED -> ON_HOLD -> DOSE_PREPARED via the
          spill cascade and its compensation; the restore leg must recover the
          exact hold_previous_status (DOSE_PREPARED), not the initial ORDERED.
          Different entity from the sibling instance (SpillIncident).
        test_recipe:
          setup:
            - "Base F-18 fixture with vial CALIBRATED and appointment 10:00-10:30; clock 08:45; spill reported in the room at 08:45 then worked to CLEARED"
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. A", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist }
            - { call: "POST /nuclear-medicine/imaging-rooms", payload: { name: "Room-1", cleanup_buffer_minutes: 15 }, as: DepartmentAdmin, captures: { room: $.data.id } }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ord}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { vial: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/calibrate", payload: { measured_activity_mbq: 220 }, as: Radiopharmacist, as_user_id: "rp-1" }
            - { call: "POST /nuclear-medicine/procedure-appointments", payload: { order_id: "${ord}", room_id: "${room}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T10:30:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1" }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:45:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/spill-incidents", payload: { room_id: "${room}", isotope_product_id: "${iso}", estimated_activity_mbq: 10, occurred_at: "2026-08-01T08:45:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1", captures: { spill: $.data.id } }
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "CONTAINED" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "DECONTAMINATED" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
            - { call: "POST /nuclear-medicine/radiation-surveys", payload: { room_id: "${room}", ambient_dose_rate_usv_h: 0.5, result: "PASS" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
          trigger:
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "CLEARED" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
            - { call: "GET /nuclear-medicine/dose-orders/${ord}", as: DepartmentAdmin, captures: { st: $.data.status, hr: $.data.hold_reason } }
          assert:
            - "Before clearance the order was ON_HOLD with hold_previous_status == DOSE_PREPARED (cycle leg 1 observed via cascade)"
            - "DoseOrder.${ord}.status == DOSE_PREPARED after clearance (restore leg recovers hold_previous_status, not ORDERED)"
            - "DoseOrder.${ord}.hold_reason == null after clearance"

      - name: spill_recontamination_loop
        grounds:
          - state_machines.SpillIncident.DECONTAMINATED_to_CONTAINED
          - state_machines.SpillIncident.DECONTAMINATED_to_CLEARED
          - state_machines.ImagingRoom.CONTAMINATED_to_OPERATIONAL
        distinguishing_aspect: |
          Cycle on SpillIncident: DECONTAMINATED -> CONTAINED -> DECONTAMINATED
          -> CLEARED (recontamination loop gated by a FAIL survey). Different
          entity from the sibling instance (DoseOrder).
        test_recipe:
          setup:
            - "Isotope + room only; MINOR spill (10 < 37) reported at 08:00; advanced REPORTED->CONTAINED->DECONTAMINATED; FAIL survey recorded"
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/imaging-rooms", payload: { name: "Room-9", cleanup_buffer_minutes: 15 }, as: DepartmentAdmin, captures: { room: $.data.id } }
            - { call: "POST /nuclear-medicine/spill-incidents", payload: { room_id: "${room}", isotope_product_id: "${iso}", estimated_activity_mbq: 10, occurred_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, as_user_id: "rp-9", captures: { spill: $.data.id } }
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "CONTAINED" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "DECONTAMINATED" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
            - { call: "POST /nuclear-medicine/radiation-surveys", payload: { room_id: "${room}", ambient_dose_rate_usv_h: 5.0, result: "FAIL" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
          trigger:
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "CONTAINED" }, as: RadiationSafetyOfficer, as_user_id: "rso-1", captures: { st1: $.data.status } }
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "DECONTAMINATED" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
            - { call: "POST /nuclear-medicine/radiation-surveys", payload: { room_id: "${room}", ambient_dose_rate_usv_h: 0.4, result: "PASS" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "CLEARED" }, as: RadiationSafetyOfficer, as_user_id: "rso-1", captures: { st2: $.data.status } }
            - { call: "GET /nuclear-medicine/imaging-rooms/${room}", as: DepartmentAdmin, captures: { roomst: $.data.status } }
          assert:
            - "First trigger succeeds: SpillIncident.${spill}.status == CONTAINED after the DECONTAMINATED->CONTAINED loop leg (FAIL survey present)"
            - "Final status == CLEARED and ImagingRoom.${room}.status == OPERATIONAL (posture restored only at clearance)"

  - rule_id: transitive_cascade
    instances:
      - name: spill_report_cascade_depth3
        grounds:
          - state_machines.SpillIncident.REPORTED_to_CONTAINED
          - state_machines.ProcedureAppointment.BOOKED_to_AUTO_VOIDED
          - state_machines.DoseOrder.DOSE_PREPARED_to_ON_HOLD
          - state_machines.DoseVial.CALIBRATED_to_QUARANTINED
        distinguishing_aspect: |
          Depth-3 chain from POST /spill-incidents: spill creation mutates
          ImagingRoom (-> CONTAMINATED); the room mutation itself voids BOOKED
          appointments (end_at > occurred_at); each voided appointment then holds
          its DoseOrder and quarantines the order's vials. Each hop is caused by
          the previous hop, not by the report directly. Different trigger from the
          sibling instance (license suspension).
        test_recipe:
          setup:
            - "Base F-18 fixture with vial CALIBRATED and appointment 10:00-10:30 BOOKED; clock 08:45"
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. A", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist }
            - { call: "POST /nuclear-medicine/imaging-rooms", payload: { name: "Room-1", cleanup_buffer_minutes: 15 }, as: DepartmentAdmin, captures: { room: $.data.id } }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ord}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { vial: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/calibrate", payload: { measured_activity_mbq: 220 }, as: Radiopharmacist, as_user_id: "rp-1" }
            - { call: "POST /nuclear-medicine/procedure-appointments", payload: { order_id: "${ord}", room_id: "${room}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T10:30:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1", captures: { appt: $.data.id } }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:45:00Z" }, as: DepartmentAdmin }
          trigger:
            - { call: "POST /nuclear-medicine/spill-incidents", payload: { room_id: "${room}", isotope_product_id: "${iso}", estimated_activity_mbq: 10, occurred_at: "2026-08-01T08:45:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1", captures: { spill: $.data.id } }
            - { call: "GET /nuclear-medicine/imaging-rooms/${room}", as: DepartmentAdmin, captures: { roomst: $.data.status } }
            - { call: "GET /nuclear-medicine/procedure-appointments/${appt}", as: DepartmentAdmin, captures: { apptst: $.data.status, voidr: $.data.void_reason } }
            - { call: "GET /nuclear-medicine/dose-orders/${ord}", as: DepartmentAdmin, captures: { ordst: $.data.status, hr: $.data.hold_reason, hps: $.data.hold_previous_status } }
            - { call: "GET /nuclear-medicine/dose-vials/${vial}", as: DepartmentAdmin, captures: { vialst: $.data.status } }
          assert:
            - "ImagingRoom.${room}.status == CONTAMINATED (hop 1)"
            - "ProcedureAppointment.${appt}.status == AUTO_VOIDED and void_reason == ${spill} (hop 2, caused by hop 1)"
            - "DoseOrder.${ord}.status == ON_HOLD, hold_reason == SPILL_CONTAMINATION, hold_previous_status == DOSE_PREPARED (hop 3, caused by hop 2)"
            - "DoseVial.${vial}.status == QUARANTINED (hop 4, caused by hop 3)"

      - name: license_suspend_cascade_depth2
        grounds:
          - state_machines.RadiopharmacyLicense.ACTIVE_to_SUSPENDED
          - state_machines.RadiopharmacyLicense.SUSPENDED_to_ACTIVE
          - entities.AuthorizedUser.fields.status
        distinguishing_aspect: |
          Depth-2 chain from POST /licenses/{id}/suspend: the license mutation
          suspends its AuthorizedUsers (hop 1); each user suspension then places
          that user's open DoseOrders ON_HOLD with hold_reason=LICENSE_SUSPENDED
          (hop 2). Trigger (license suspend) differs from the sibling instance's
          trigger (spill report); reinstate replays the chain in reverse.
        test_recipe:
          setup:
            - "Base F-18 fixture with vial CALIBRATED (order DOSE_PREPARED); clock 08:30"
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. A", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ord}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { vial: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/calibrate", payload: { measured_activity_mbq: 220 }, as: Radiopharmacist, as_user_id: "rp-1" }
          trigger:
            - { call: "POST /nuclear-medicine/licenses/${lic}/suspend", payload: {}, as: DepartmentAdmin }
            - { call: "GET /nuclear-medicine/authorized-users/${au}", as: DepartmentAdmin, captures: { aust: $.data.status } }
            - { call: "GET /nuclear-medicine/dose-orders/${ord}", as: DepartmentAdmin, captures: { ordst: $.data.status, hr: $.data.hold_reason } }
            - { call: "POST /nuclear-medicine/licenses/${lic}/reinstate", payload: {}, as: DepartmentAdmin }
            - { call: "GET /nuclear-medicine/dose-orders/${ord}", as: DepartmentAdmin, captures: { ordst2: $.data.status } }
          assert:
            - "After suspend: AuthorizedUser.${au}.status == SUSPENDED (hop 1)"
            - "After suspend: DoseOrder.${ord}.status == ON_HOLD with hold_reason == LICENSE_SUSPENDED (hop 2, caused by hop 1)"
            - "DoseVial.${vial} remains CALIBRATED (license cascade never quarantines — contrast with spill cascade)"
            - "After reinstate: DoseOrder.${ord}.status == DOSE_PREPARED (compensating restore)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_license_safety_on_administer
