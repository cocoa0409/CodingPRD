            - "after the advance: InventoryLot.${lot_id}.status == QUARANTINED and units_on_hand == 100 (LINK 1 quarantine, LINK 2 shipment cancel, LINK 3 restore of 30)"
            - "Shipment.${sh_id}.status == CANCELLED"
            - "SeasonalProgram.${prog_id}.status == DISPOSITION and shipped_units_total == 0 (CANCELLED shipments leave the shipped set)"
            - "Warehouse.${wh_id}.in_use_units == 100 and quarantined_units == 100"
            - "the restore is per-source-lot: units return to the lot they were FEFO-drawn from, not a program-level pool"

      - name: run_complete_creates_lot_recomputes_warehouse_load_flips_posture
        grounds:
          - state_machines.ProductionRun.IN_PROGRESS_to_COMPLETE
          - calculations.warehouse_load_and_posture
          - entities.Warehouse.fields.posture
        distinguishing_aspect: "Depth-3 cascade off the complete trigger (different trigger than the pull cascade): complete creates the lot (1), the lot's units enter Warehouse.in_use_units (2), the recompute crosses the 0.85 threshold and flips posture OPEN -> CONGESTED (3)."
        test_recipe:
          setup:
            - "Program LOCKED; W1 capacity 1000 empty (posture OPEN); one IN_PROGRESS run planning 850 units of the seasonal product."
          setup_api_calls:
            - *k_clock_0105
            - *k_prog
