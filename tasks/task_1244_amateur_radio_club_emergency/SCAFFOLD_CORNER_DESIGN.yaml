              captures: { m: $.data.id }
            - call: "POST /members/${m}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
          trigger:
            - call: "PATCH /members/${m}"
              payload: { full_name: "Operator Renamed" }
              as: ClubAdmin
          assert:
            - "Member.${m}.version == 3"
            - "Member.${m}.full_name == Operator Renamed"

