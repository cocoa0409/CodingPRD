# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"
  - id: ERR_EMPLOYEE_SCOPE_VIOLATION
    http: 403
    condition: "Role Employee acts on an election, account, media order, card transaction or claim whose owning employee_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals the recorded actor of the conflicting prior step: order_batches/{id}/release by the same user that sealed the batch, or card-transactions/{id}/reopen by the same user that approved the substantiation"

  # --- path / body existence ---
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "employer_id in the path or body matches no Employer"
  - id: ERR_BENEFIT_CATEGORY_NOT_FOUND
    http: 404
    condition: "benefit_category_id in the path or body matches no BenefitCategory"
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "employee_id in the path or body matches no Employee"
  - id: ERR_ELECTION_WINDOW_NOT_FOUND
    http: 404
    condition: "election_window_id in the path or body matches no ElectionWindow"
  - id: ERR_BENEFIT_ACCOUNT_NOT_FOUND
    http: 404
    condition: "account_id in the path matches no BenefitAccount"
  - id: ERR_ELECTION_NOT_FOUND
    http: 404
    condition: "election_id in the path or body matches no Election"
  - id: ERR_TRANSIT_MEDIA_NOT_FOUND
    http: 404
    condition: "transit_media_id in the path or body matches no TransitMedia"
  - id: ERR_ORDER_BATCH_NOT_FOUND
    http: 404
    condition: "batch_id in the path or order_batch_id in the body matches no OrderBatch"
  - id: ERR_MEDIA_ORDER_NOT_FOUND
    http: 404
    condition: "order_id in the path matches no MediaOrder"
  - id: ERR_CARD_TRANSACTION_NOT_FOUND
    http: 404
    condition: "transaction_id in the path or card_transaction_id in the body matches no CardTransaction"
  - id: ERR_SUBSTANTIATION_CLAIM_NOT_FOUND
    http: 404
    condition: "claim_id in the path matches no SubstantiationClaim"
  - id: ERR_PAYROLL_FILE_NOT_FOUND
    http: 404
    condition: "file_id in the path matches no PayrollFile"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "A required input field is absent, of the wrong JSON type, a negative money or quantity amount, a malformed ISO-8601 instant, a percentage outside 0..100, or an interval whose end is not strictly after its start"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "A string field constrained to an enum carries a value outside that enum (allocation_type, region_code, limit_group, media_kind, undelivered_reason, doc_type, outcome, entry_type, period_month format)"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit is below 1 or above 100, or offset is negative"

  # --- state / lifecycle ---
  - id: ERR_EMPLOYER_PROGRAM_NOT_ACTIVE
    http: 409
    condition: "A write that requires the owning Employer in ACTIVE is attempted while the Employer is DRAFT or SUSPENDED"
  - id: ERR_ELECTION_WINDOW_NOT_OPEN
    http: 409
    condition: "An election is created against an ElectionWindow whose status is not OPEN, or amended against one whose status is neither OPEN nor LOCKED"
  - id: ERR_ORDER_BATCH_NOT_OPEN
    http: 409
    condition: "A media line is added to an OrderBatch whose status is not OPEN"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested transition is not declared from the entity's current non-terminal state"
  - id: ERR_ELECTION_ALREADY_FUNDED
    http: 409
    condition: "An election whose funding_status is REVERSED, SETTLED or CANCELLED is amended through the holder amendment path instead of being re-elected"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Any transition is requested on an entity already in one of its declared terminal states"
  - id: ERR_ELECTION_WINDOW_OVERLAP
    http: 409
    condition: "A new or opened ElectionWindow's half-open [opens_at, cutoff_at) interval intersects another non-CLOSED window of the same employer; adjacency where one interval's cutoff_at equals the other's opens_at is legal"
  - id: ERR_MEDIA_COVERAGE_OVERLAP
    http: 409
    condition: "A new MediaOrder's closed [coverage_start_at, coverage_end_at] interval intersects a live order for the same (employee, transit_media) pair; adjacency where one interval's end equals the other's start conflicts"
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version on POST /benefits/elections does not equal the current BenefitAccount.version"
  - id: ERR_STALE_ELECTION_VERSION
    http: 412
    condition: "expected_election_version on POST /benefits/media-orders does not equal the current Election.version"

  # --- business rules ---
  - id: ERR_ORDINANCE_MANDATE_UNMET
    http: 422
    condition: "A new election or an election amendment is attempted while employer.ordinance_mandate_status is MANDATED_NONCOMPLIANT, i.e. a compliance assessment found the employer deficient under its local commuter benefit ordinance (no qualifying transit offering, or transit_group_limit_cents below ORDINANCE_MINIMUM_TRANSIT_LIMIT_CENTS) at or above ORDINANCE_EMPLOYEE_THRESHOLD covered employees in a COVERED_REGION_CODES region"
  - id: ERR_SUBSTANTIATION_HOLD_ACTIVE
    http: 422
    condition: "A new election or amendment is attempted for an Employee whose substantiation_hold is true"
  - id: ERR_BENEFIT_CATEGORY_RETIRED
    http: 422
    condition: "An election or account references a BenefitCategory whose status is RETIRED"
  - id: ERR_MEDIA_REGION_INELIGIBLE
    http: 422
    condition: "The referenced TransitMedia's region_code differs from the employee's region_code or from the order batch's region_code"
  - id: ERR_TRANSIT_MEDIA_DISCONTINUED
    http: 422
    condition: "The referenced TransitMedia's status is DISCONTINUED"
  - id: ERR_ACCOUNT_MISMATCH
    http: 422
    condition: "The resolved BenefitAccount's employee_id or benefit_category_id does not match the election's, or a card transaction's account differs from its election's account"
  - id: ERR_ALLOCATION_TYPE_NOT_ALLOWED
    http: 422
    condition: "A post-tax amount is supplied for a BenefitCategory whose allowed_allocation is PRETAX_ONLY, or a pre-tax amount for POSTTAX_ONLY"
  - id: ERR_ORDER_CUTOFF_PASSED
    http: 422
    condition: "A media line is added or a batch is sealed at or after the ElectionWindow's cutoff_at as read from the logical clock"
  - id: ERR_MID_MONTH_CHANGE_NOT_ALLOWED
    http: 422
    condition: "An election is amended against a LOCKED ElectionWindow whose mid_month_change_allowed flag is false"
  - id: ERR_CHANGE_LIMIT_EXCEEDED
    http: 422
    condition: "An election in a LOCKED, mid-month-change-enabled window is amended when its change_count already equals MID_MONTH_CHANGE_LIMIT"
  - id: ERR_EMPTY_ORDER_BATCH
    http: 422
    condition: "An OrderBatch with zero PENDING media lines is sealed"
  - id: ERR_REISSUE_LIMIT_EXCEEDED
    http: 422
    condition: "A MediaOrder is reissued when its replacement_count already equals MEDIA_REISSUE_LIMIT"
  - id: ERR_REPLACEMENT_FEE_NOT_WAIVABLE
    http: 422
    condition: "waive_replacement_fee is true while the order's undelivered_reason is not in WAIVABLE_UNDELIVERED_REASONS"
  - id: ERR_REOPEN_LIMIT_EXCEEDED
    http: 422
    condition: "A CardTransaction is reopened when its reopen_count already equals MAX_SUBSTANTIATION_REOPENS"
  - id: ERR_EXCLUSION_LIMIT_EXCEEDED
    http: 422
    condition: "A pre-tax election amount would push the employee's monthly excluded total for the category's limit_group above the employer's group limit while the category forbids post-tax spill"
  - id: ERR_INSUFFICIENT_BENEFIT_BALANCE
    http: 402
    condition: "A card transaction or replacement fee would drive the BenefitAccount's available_cents below zero"
  - id: ERR_CLAIM_AMOUNT_MISMATCH
    http: 422
    condition: "A SubstantiationClaim's claimed_amount_cents differs from the referenced CardTransaction's amount_cents"

# =============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Commuter benefit administrator operating the employer program: employer setup, category catalogue, employee roster, election windows, benefit accounts, month close, card transaction ingestion and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /benefits/employers"
      - "PATCH /benefits/employers/{employer_id}"
      - "POST /benefits/employers/{employer_id}/activate"
      - "POST /benefits/employers/{employer_id}/month-close"
      - "POST /benefits/benefit-categories"
      - "POST /benefits/benefit-categories/{category_id}/retire"
      - "POST /benefits/employees"
      - "POST /benefits/employees/{employee_id}/terminate"
      - "POST /benefits/election-windows"
      - "POST /benefits/election-windows/{window_id}/open"
      - "POST /benefits/election-windows/{window_id}/lock"
      - "POST /benefits/benefit-accounts"
      - "POST /benefits/elections/{election_id}/reverse-funding"
      - "POST /benefits/card-transactions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /benefits/employers/{employer_id}/compliance-assessments"
      - "POST /benefits/elections"
      - "PATCH /benefits/elections/{election_id}"
      - "POST /benefits/elections/{election_id}/cancel"
      - "POST /benefits/substantiation-claims"
      - "POST /benefits/payroll-files"
      - "POST /benefits/payroll-files/{file_id}/generate"
      - "all GET reads"

  - name: Employee
    description: "Enrolled commuter electing pre-tax and post-tax benefits, confirming or disputing media delivery and submitting expense substantiation. Scoped to its own records."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "POST /benefits/elections"
      - "PATCH /benefits/elections/{election_id}"
      - "POST /benefits/elections/{election_id}/cancel"
      - "POST /benefits/media-orders/{order_id}/confirm-delivery"
      - "POST /benefits/media-orders/{order_id}/report-undelivered"
      - "POST /benefits/substantiation-claims"
      - "GET reads scoped to its own employee_id"

  - name: OrderDesk
    description: "Transit media procurement operator: catalogue of media products, batch assembly against the cutoff calendar, sealing, release, shipment tracking and reissue of lost or undelivered media."
    identity: "opaque"
    exclusive_operations:
      - "POST /benefits/transit-media"
      - "POST /benefits/transit-media/{media_id}/discontinue"
      - "POST /benefits/order-batches"
      - "POST /benefits/order-batches/{batch_id}/seal"
      - "POST /benefits/order-batches/{batch_id}/release"
      - "POST /benefits/media-orders"
      - "POST /benefits/media-orders/{order_id}/ship"
      - "POST /benefits/media-orders/{order_id}/reissue"
    shared_operations:
      - "POST /benefits/media-orders/{order_id}/confirm-delivery"
      - "POST /benefits/media-orders/{order_id}/report-undelivered"
      - "GET reads of elections, media, batches and orders"

  - name: ComplianceReviewer
    description: "Reviewer of substantiation evidence and local ordinance posture. Approves or rejects claims, denies unsupported swipes and reopens settled postures for audit. Cannot be the same user for approve and reopen."
    identity: "opaque"
    exclusive_operations:
      - "POST /benefits/card-transactions/{transaction_id}/deny-substantiation"
      - "POST /benefits/card-transactions/{transaction_id}/reopen"
      - "POST /benefits/substantiation-claims/{claim_id}/approve"
      - "POST /benefits/substantiation-claims/{claim_id}/reject"
    shared_operations:
      - "POST /benefits/employers/{employer_id}/compliance-assessments"
      - "GET reads of elections, accounts, ledger entries, compliance assessments, card transactions and claims"

  - name: PayrollProcessor
    description: "Payroll integration operator that generates, transmits and acknowledges the employer deduction file."
    identity: "opaque"
    exclusive_operations:
      - "POST /benefits/payroll-files/{file_id}/transmit"
      - "POST /benefits/payroll-files/{file_id}/acknowledge"
    shared_operations:
      - "POST /benefits/payroll-files"
      - "POST /benefits/payroll-files/{file_id}/generate"
      - "GET reads of elections and payroll files"
