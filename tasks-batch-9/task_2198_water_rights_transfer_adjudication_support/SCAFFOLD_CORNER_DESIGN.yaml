            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v2: "$.data.version"}}
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_v2}"}, as: WaterRightsAnalyst}
          trigger:
            - {call: "POST /transfer-applications/${app}/publish", as: WaterRightsAnalyst, captures: {err: "$.data.error_id"}}
            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00}, as: WaterRightsAnalyst, captures: {ia: "$.data.id"}}
            - {call: "POST /transfer-applications/${app}/publish", as: WaterRightsAnalyst}
          assert:
            - "Publish with no analysis: HTTP 422 with error_id ERR_INJURY_ANALYSIS_MISSING; status stays SUBMITTED, protest_deadline stays null and the application's version does not move."
            - "The escrow taken at submit is untouched by the rejection: escrowed_af 100.00, WaterRight.transferable_af 95.00 / encumbered_af 100.00, status ENCUMBERED."
