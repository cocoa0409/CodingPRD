          setup:
            - "ServiceAccount 'Anchor Alehouse' ACTIVE with an ACTIVE contract; BeerLine #1 32ft/4ft/0.375in ALE."
            - "Technician 'Dana Ruiz' MASTER caustic_certified; CAUSTIC lot C-2001 45.0 pct, 20.0 L."
            - "One POSTED PASS cycle on an IN_PROGRESS visit at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Anchor Alehouse", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
