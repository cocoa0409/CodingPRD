            - "the RE-ISSUED third store now returns HTTP 200 with FinishedUnit.${fu3}.stored_footprint_cube_m3 == 1.0000 and logistics_status == STORED"
            - "${posture_final} == FROZEN and ${po_status_final} == BLOCKED_WAREHOUSE   (the gate closes again, proving the dependency is re-evaluated on every store rather than latched)"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # Three resource entities with DELIBERATELY DIVERGENT interval semantics, so
  # the same relative timing is legal under one rule and illegal under another:
  #   OvenStation arm  — EXCLUSIVE, HALF-OPEN, SYMMETRIC changeover buffer
  #   CoolingBay       — AGGREGATE slot capacity, CLOSED interval, NO buffer
  #   Mold             — EXCLUSIVE, HALF-OPEN, NO buffer, oven+cooling span
  # No instance starts an oven, so every mould stays AVAILABLE and the failure
  # modes are purely geometric.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: oven_arm_half_open_span_with_symmetric_changeover_buffer
        grounds:
          - calculations.oven_arm_window_check
          - calculations.cycle_window_projection
          - validations[priority=62]
          - errors.ERR_OVEN_WINDOW_CONFLICT
          - entities.OvenStation.fields.changeover_buffer_min
          - entities.OvenStation.fields.arm_count
        distinguishing_aspect: |
          The oven arm is an EXCLUSIVE resource whose stored window is inflated SYMMETRICALLY by
          changeover_buffer_min and then compared HALF-OPEN, so a cycle starting at exactly
          existing.oven_end_at + 15 min (10:15:00) is accepted while one starting one second
          earlier is refused 409 ERR_OVEN_WINDOW_CONFLICT — and because the arm rather than the
          station is the exclusive unit, a fourth cycle on arm 2 with a window IDENTICAL to arm 1's
          is accepted outright.
        test_recipe:
          setup:
            - "ProductModel PM-X8A-KM: KAYAK/MID, nominal_charge_kg 24.000, charge_tolerance_pct 5.00, min_cooling_minutes 30."
            - "THREE single-cavity Molds for that model, all with nominal_charge_kg 24.000, service_interval_cycles 10 and cycles_since_service 0: MLD-X8A-A, MLD-X8A-B, MLD-X8A-C — so calculations.mold_selection ranks them by mold_code ASC and never runs out."
            - "OvenStation OV-X8A: arm_count 2, changeover_buffer_min 15, max_size_class OVERSIZE, status OPERATIONAL."
            - "CoolingBay CB-X8A: concurrent_slot_capacity 4 and airflow_mode AMBIENT — capacity is deliberately generous so the cooling-bay rule NEVER binds here and every refusal is attributable to the arm."
            - "One ACTIVE MOLDING_OPERATOR T-X8A-OPR; Warehouse WH-X8A 20.0000 in one zone (posture NORMAL); qualified ResinLot LOT-X8A received_kg 500.000 expires_on 2027-12-31, so qualified_resin_lot_count is 1 and the order releases to READY_TO_SCHEDULE."
            - "ProductionOrder PO-X8A: ordered_qty 3, no demand_bucket_id — exactly floor(3 * 1.20) == 3 single-cavity cycles are admissible, which is precisely the number this recipe intends to accept (§1.4 priority 79)."
            - "No ResinCharge is created and no oven is ever started, so every mould stays AVAILABLE, every cycle stays SCHEDULED, and both members of the oven_arm_window_check conflicting-status set {SCHEDULED, OVEN_RUNNING} are live candidates."
            - "The logical clock is left at its 2026-08-01T00:00:00Z default so every oven_start_at below is in the future (§1.4 priority 63)."
          setup_api_calls:
            - call: "POST /product-models"
              payload: { model_code: "PM-X8A-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 24.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-X8A-A", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold_a: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-X8A-B", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold_b: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-X8A-C", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold_c: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OV-X8A", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
              payload: { bay_code: "CB-X8A", concurrent_slot_capacity: 4, airflow_mode: "AMBIENT" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-X8A-OPR", full_name: "Oona Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-X8A", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 20.0000 }] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-X8A", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 500.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-X8A", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 3 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v1: $.data.version }
          trigger:
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "AMBIENT", expected_production_order_version: "${po_v1}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc1: $.data.id, cyc1_oven_end: $.data.oven_end_at, cyc1_mold: $.data.mold_id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v2: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T10:14:59Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "AMBIENT", expected_production_order_version: "${po_v2}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { err_arm: $.data.error_id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v3: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T10:15:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "AMBIENT", expected_production_order_version: "${po_v3}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc3: $.data.id, cyc3_mold: $.data.mold_id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v4: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "AMBIENT", expected_production_order_version: "${po_v4}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc4: $.data.id, cyc4_mold: $.data.mold_id }
          assert:
            - "MoldingCycle.${cyc1}.oven_end_at == 2026-08-01T10:00:00Z, cooling_window_start_at == 2026-08-01T10:00:00Z and cooling_window_end_at == 2026-08-01T10:30:00Z"
            - "MoldingCycle.${cyc1}.status == SCHEDULED and ${cyc1_mold} == ${mold_a}   (mold_code ASC among three tied moulds)"
            - "the 10:14:59 attempt on arm 1 returns HTTP 409 with error_id ERR_OVEN_WINDOW_CONFLICT: the STORED cycle is inflated to [08:45:00, 10:15:00) and the new half-open oven window [10:14:59, 11:14:59) overlaps it by one second"
            - "${po_v3} == ${po_v2}   (the refused cycle incremented nothing, so the order's OCC token is unchanged)"
            - "the 10:15:00 attempt on the SAME arm returns HTTP 201: 10:15:00 == cyc1.oven_end_at 10:00:00 plus changeover_buffer_min 15, and the buffered comparison is half-open at the upper end, so touching is not overlapping"
            - "${cyc3_mold} == ${mold_b}, NOT ${mold_a} — the divergence made visible: at 10:15:00 the ARM is already free because its buffered span ended, yet MLD-X8A-A is still occupied because the MOULD span runs [09:00:00, 10:30:00) with no buffer at all"
            - "the arm-2 cycle at 09:00:00 returns HTTP 201 even though its oven window is byte-identical to cyc1's: the conflicting set is keyed on (oven_station_id, arm_index), so a station with arm_count 2 holds two fully coincident windows"
            - "${cyc4_mold} == ${mold_c}   (A and B are both occupied across 09:00-10:30, so the third mould is taken)"
            - "MoldingCycle.${cyc4}.arm_index == 2 and MoldingCycle.${cyc4}.oven_start_at == MoldingCycle.${cyc1}.oven_start_at"
            - "exactly three cycles exist for PO-X8A and ProductionOrder.${po}.status == IN_PRODUCTION"

      - name: cooling_bay_closed_interval_aggregate_slot_capacity
        grounds:
          - calculations.cooling_bay_slot_check
          - calculations.cycle_window_projection
          - validations[priority=71]
          - errors.ERR_COOLING_BAY_CAPACITY_EXCEEDED
          - entities.CoolingBay.fields.concurrent_slot_capacity
        distinguishing_aspect: |
          The cooling bay is an AGGREGATE counted resource compared over a CLOSED interval with NO
          buffer, the exact opposite geometry to oven_arm_half_open_span_with_symmetric_changeover_buffer:
          a window whose cooling_window_start_at equals an existing window's cooling_window_end_at to
          the second DOES intersect and therefore consumes a slot, so with concurrent_slot_capacity 2
          the third such cycle is refused 409 ERR_COOLING_BAY_CAPACITY_EXCEEDED while shifting it one
          second later drops the intersecting count back to 1 and it is accepted.
        test_recipe:
