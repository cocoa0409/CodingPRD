      - name: adverse_wait_exact_boundary_business_day
        grounds:
          - calculations.adverse_wait_requirement
          - calculations.business_day_add
          - "errors[ERR_ADVERSE_WAIT_NOT_ELAPSED]"
        distinguishing_aspect: |
          Metric = business days; endpoint = POST /adverse-action-cases/{id}/send-final-notice.
          2026-08-11T23:59:59Z is one second before the 5th-business-day boundary
          (earliest 2026-08-12T00:00:00Z) and is rejected; exactly the boundary
          instant succeeds. Different metric and endpoint from the SLA instance.
        test_recipe:
          setup:
            - "Chain through PRE_ADVERSE_PENDING; case created 2026-08-05T10:00:00Z by 'adj-bp2'; wait 5 business days -> earliest 2026-08-12T00:00:00Z"
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-BP2", base_tat_business_hours: 40, max_concurrent_orders: 5, surcharge_cents: 0 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /screening-packages", payload: { name: "P-BP2", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 10000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /adjudication-matrices", payload: { risk_tier: TIER_1_STANDARD, rules: [ { offense_category: VIOLENT_FELONY, min_severity: HIGH, max_recency_years: 10, action: ADVERSE_ELIGIBLE } ] }, as: ComplianceOfficer, captures: { m_id: $.data.id } }
            - { call: "POST /adjudication-matrices/${m_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "Analyst", department: "Ops", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Bp Two", email: "bp2@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
            - { call: "POST /screening-orders/${o_id}/consents", payload: { disclosure_form_id: "DISC-1", contains_extraneous_terms: false, authorization_signed_at: "2026-08-03T09:00:00Z" }, as: Candidate, as_user_id: "${c_id}" }
            - { call: "POST /screening-orders/${o_id}/dispatch", payload: { vendor_id: "${v_id}" }, as: HiringManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-reports", payload: { order_id: "${o_id}", findings: [ { check_type: CRIMINAL_COUNTY, offense_category: VIOLENT_FELONY, severity: HIGH, offense_date: "2024-06-01T00:00:00Z", disposition: CONVICTION } ] }, as: VendorAgent, as_user_id: "${v_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-orders/${o_id}/adjudication-decision", payload: { decision: INITIATE_ADVERSE }, as: Adjudicator, as_user_id: "adj-bp2" }
            - { call: "GET /adverse-action-cases", payload: { order_id: "${o_id}" }, as: ComplianceOfficer, captures: { case_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T23:59:59Z" }, as: HRAdmin }
          trigger:
            - { call: "POST /adverse-action-cases/${case_id}/send-final-notice", payload: {}, as: ComplianceOfficer, as_user_id: "co-bp2", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /adverse-action-cases/${case_id}/send-final-notice", payload: {}, as: ComplianceOfficer, as_user_id: "co-bp2" }
          assert:
            - "first attempt: error_id == ERR_ADVERSE_WAIT_NOT_ELAPSED (one second before the boundary)"
            - "second attempt at exactly 2026-08-12T00:00:00Z succeeds: case.status == FINAL_NOTICE_SENT, final_notice_issuer_user_id == 'co-bp2'"
            - "GET /screening-orders/${o_id}: adjudication_status == FINAL_ADVERSE AND fulfillment_status == CLOSED"

      - name: audit_fail_threshold_exact_200bps
        grounds:
          - calculations.audit_fail_evaluation
          - entities.VendorAccuracyAudit.fields.mismatch_rate_bps
        distinguishing_aspect: |
          Metric = basis points; endpoint = POST /vendor-accuracy-audits/{id}/finalize.
          Exactly 200 bps (1/50) passes (strict >), 300 bps (3/100) fails and flips
          the vendor to PROBATION. Third distinct metric/endpoint pair.
        test_recipe:
          setup:
            - "Vendor V ACTIVE; two audits with adjacent (non-overlapping) periods"
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-BP3", base_tat_business_hours: 40, max_concurrent_orders: 5, surcharge_cents: 0 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-accuracy-audits", payload: { vendor_id: "${v_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", sample_size: 50, mismatches_found: 1 }, as: Auditor, captures: { a1_id: $.data.id } }
            - { call: "POST /vendor-accuracy-audits", payload: { vendor_id: "${v_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z", sample_size: 100, mismatches_found: 3 }, as: Auditor, captures: { a2_id: $.data.id } }
          trigger:
            - { call: "POST /vendor-accuracy-audits/${a1_id}/finalize", payload: {}, as: Auditor }
            - { call: "POST /vendor-accuracy-audits/${a2_id}/finalize", payload: {}, as: Auditor }
          assert:
            - "audit ${a1_id}.mismatch_rate_bps == 200 and finalizing it leaves vendor.status == ACTIVE (200 is NOT > 200) with rescreen_order_ids == []"
            - "audit ${a2_id}.mismatch_rate_bps == 300 and finalizing it moves vendor.status to PROBATION"
            - "GET /vendors/${v_id}.accuracy_bps_finalized == round_half_up(10000*(1-4/150)) == 9733"

