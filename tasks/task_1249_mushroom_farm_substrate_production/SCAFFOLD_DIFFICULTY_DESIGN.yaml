            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
          trigger:
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 40.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc_id: $.data.id } }
            - { call: "GET /api/substrate-batches/${b_id}", payload: {}, as: Any }
          assert:
            - "POST /api/room-cycles returned 201 (allocated_tonnage == remaining_tonnage is allowed: boundary is <=)"
            - "SubstrateBatch.${b_id}.remaining_tonnage == 0.0 exactly"
            - "SubstrateBatch.${b_id}.status == EXHAUSTED (auto-transition at exact zero)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: room_cycle_requires_spawned_batch
        grounds:
          - state_machines.RoomCycle
          - entities.RoomCycle.fields.batch_id
          - errors[ERR_BATCH_NOT_SPAWNED]
        distinguishing_aspect: |
          Entity pair RoomCycle -> SubstrateBatch: cycle creation is gated on the batch's
          machine state (must be SPAWNED); a merely CONDITIONED batch rejects with
          ERR_BATCH_NOT_SPAWNED even though room, window, capacity, and OCC all pass.
        test_recipe:
          setup:
            - "Batch b1 (40.0 t) pasteurized to CONDITIONED but never spawned; room r1 fresh (version 1)"
          setup_api_calls:
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
          trigger:
            - call: "POST /api/room-cycles"
              payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 10.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BATCH_NOT_SPAWNED (HTTP 409)"
            - "No RoomCycle was created (GET /api/room-cycles?batch_id=${b_id} returns empty array)"
            - "GrowingRoom.${r_id}.version unchanged (failed request has no side effects)"

