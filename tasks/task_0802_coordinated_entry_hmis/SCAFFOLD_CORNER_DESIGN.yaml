  - section: rbac
    instances:
      - name: rbac_shelter_manager_cannot_create_assessment
        claim_type: Cannot perform other role's exclusive op
        grounds: [roles.ShelterManager, roles.IntakeSpecialist, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A ShelterManager calling POST /assessments (an IntakeSpecialist-exclusive op) gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["One client."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Rbac Client", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { client_id: "${cli}", self_report_points: 5 }
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
