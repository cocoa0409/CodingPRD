            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CREDIT_LIMIT_EXCEEDED"

      - name: drop_ship_unconfirmed_blocks_fulfillment
        claim_type: violation_to_error
        grounds: ["errors[ERR_DROP_SHIP_UNCONFIRMED]", state_machines.SalesOrder]
        distinguishing_aspect: "mark-fulfilled on an order whose drop-ship quantity is not yet vendor-confirmed fails with ERR_DROP_SHIP_UNCONFIRMED; after vendor-confirm it succeeds."
        test_recipe:
          setup: ["Customer; drop-ship-eligible item list 1,000 with no stock anywhere; STANDARD order qty 1 CONFIRMED (qty_drop_ship 1) and marked SHIPPED"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "DU-1", display_name: "DropUnconf Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "DU-1", description: "Vendor kit", item_class: "STOCKED", list_price_cents: 1000, drop_ship_eligible: true, vendor_cost_estimate_cents: 500, vendor_freight_estimate_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-DU", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "STANDARD", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
            - call: "POST /mro/orders/${ord_id}/mark-ready"
              as: BranchManager
              captures: { fst: $.data.fulfillment_status }
            - call: "GET /mro/orders/${ord_id}/lines"
              as: DistributionAdmin
              captures: { ln: "$.data[0].id" }
          trigger:
            - call: "POST /mro/orders/${ord_id}/mark-fulfilled"
              as: BranchManager
              captures: { err: $.data.error_id }
            - call: "POST /mro/orders/${ord_id}/vendor-confirm"
              payload: { actual_costs: [{ order_line_id: "${ln}", vendor_cost_actual_cents: 500, freight_actual_cents: 100 }] }
              as: VendorRep
            - call: "POST /mro/orders/${ord_id}/mark-fulfilled"
              as: BranchManager
              captures: { fst2: $.data.fulfillment_status }
          assert:
            - "fst == SHIPPED"
            - "err == ERR_DROP_SHIP_UNCONFIRMED (1 drop-ship unit not yet vendor-confirmed)"
            - "fst2 == FULFILLED (after vendor-confirm the same call succeeds)"

      - name: vendor_lines_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_VENDOR_LINES_MISMATCH]"]
        distinguishing_aspect: "vendor-confirm with an actual_costs array that does not cover exactly the order's unconfirmed drop-ship lines (here: empty array against one open drop-ship line) fails with ERR_VENDOR_LINES_MISMATCH."
        test_recipe:
          setup: ["Customer; drop-ship-eligible item; STANDARD order qty 1 CONFIRMED with qty_drop_ship 1"]
          setup_api_calls:
            - call: "POST /mro/customers"
