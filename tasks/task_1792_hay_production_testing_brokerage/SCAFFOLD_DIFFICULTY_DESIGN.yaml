  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: cutting_weather_window_cyclic_slip
        grounds:
          - state_machines.Cutting.SCHEDULED_to_WINDOW_OPEN
          - state_machines.Cutting.WINDOW_OPEN_to_SCHEDULED
          - calculations.weather_window_evaluation
        distinguishing_aspect: |
          Cyclic machine on Cutting: three dry reports open the window, one wet report slips it back to
          SCHEDULED, and three more dry reports re-open it — the A->B->A loop is driven purely by weather
          postings and each hop bumps Cutting.version.
        test_recipe:
          setup:
            - "Grower/Field (OR-WILLAMETTE); Cutting window 2026-06-10..2026-06-20, initially SCHEDULED"
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower Four", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g4_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g4_id}", name: "Hill 2", acres: 60.0, forage_type: "GRASS" }, as: Grower, as_user_id: "${g4_id}", captures: { f4_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f4_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-06-10", planned_window_end: "2026-06-20" }, as: Grower, as_user_id: "${g4_id}", captures: { c4_id: "$.data.id", c4_v0: "$.data.version" } }
          trigger:
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-10", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-11", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-12", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "GET /api/cuttings/${c4_id}", payload: {}, as: Grower, as_user_id: "${g4_id}", captures: { st_open: "$.data.status" } }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-13", precipitation_mm: 5.5, drying_index: 40 }, as: PlatformAdmin }
            - { call: "GET /api/cuttings/${c4_id}", payload: {}, as: Grower, as_user_id: "${g4_id}", captures: { st_slip: "$.data.status" } }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-14", precipitation_mm: 0.0, drying_index: 66 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-15", precipitation_mm: 0.0, drying_index: 66 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-16", precipitation_mm: 0.0, drying_index: 66 }, as: PlatformAdmin }
            - { call: "GET /api/cuttings/${c4_id}", payload: {}, as: Grower, as_user_id: "${g4_id}", captures: { st_reopen: "$.data.status" } }
          assert:
            - "Cutting status after three dry reports == WINDOW_OPEN"
            - "Cutting status after the wet report (5.5mm) == SCHEDULED"
            - "Cutting status after three further dry reports == WINDOW_OPEN"
      - name: forage_test_retest_cycle
        grounds:
          - state_machines.ForageTest.RESULTED_to_SUBMITTED
          - state_machines.ForageTest.SUBMITTED_to_RESULTED
          - state_machines.ForageTest.RESULTED_to_CERTIFIED
        distinguishing_aspect: |
          Cyclic machine on ForageTest (different entity than Cutting): a RESULTED test can be resubmitted
          (RESULTED->SUBMITTED), which clears the prior rfv/protein/moisture, then re-resulted and finally
          CERTIFIED — the lot takes the tier of the second result, not the first.
        test_recipe:
          setup:
            - "Grower/Field/Cutting CUT 2026-07-31; site; lot 10.0t harvested 2026-08-01; test COLLECTED"
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower Five", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g5_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g5_id}", name: "Meadow 1", acres: 45.0, forage_type: "ALFALFA" }, as: Grower, as_user_id: "${g5_id}", captures: { f5_id: "$.data.id" } }
