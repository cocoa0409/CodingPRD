              as: SalesEngineer
              captures: { con_id: $.data.id, con_v1: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v2: $.data.version }
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v1}" }
              as: SalesEngineer
              captures: { err: $.data.error_id }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v2}" }
              as: SalesEngineer
              captures: { line_id: $.data.id }
          assert:
            - "stale line-add (version 1 vs current 2): error_id == ERR_STALE_VERSION, http 412; unit stays AVAILABLE"
            - "fresh line-add (version 2): 201; unit becomes RESERVED"

      - name: rate_snapshot_pinned_at_line_add
        claim_type: derived_field_reconciliation
        grounds: [entities.RentalLine.fields.day_rate_cents]
        distinguishing_aspect: "Each line pins its unit's rates at add time: two units with different rates (12000 vs 8000 day) yield lines whose snapshot day_rate_cents differ accordingly and never drift."
        test_recipe:
          setup: ["U1 day 12000 and U2 day 8000; contract K1 DRAFT with lines on both units"]
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { u1: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 100, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 2.5, day_rate_cents: 8000, week_rate_cents: 40000, month_rate_cents: 130000, demob_fee_cents: 20000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { u2: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${u1}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
              captures: { l1: $.data.id, l1_day: $.data.day_rate_cents, l1_demob: $.data.demob_fee_cents }
            - call: "GET /power-rental/rental-contracts/${con_id}"
              payload: {}
              as: SalesEngineer
              captures: { con_v3: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${u2}", expected_rental_contract_version: "${con_v3}" }
              as: SalesEngineer
              captures: { l2: $.data.id, l2_day: $.data.day_rate_cents, l2_demob: $.data.demob_fee_cents }
          trigger: []
          assert:
            - "line L1 snapshot: day_rate_cents == 12000, demob_fee_cents == 35000"
            - "line L2 snapshot: day_rate_cents == 8000, demob_fee_cents == 20000"
            - "both lines status PENDING; both units RESERVED"

      - name: quote_expiry_compensating_release
        claim_type: cascading_side_effects
        grounds: [state_machines.RentalContract.QUOTED_to_EXPIRED]
        excluded_because:
          difficulty_instance: reserve_then_cancel_restores_available_pool
          rationale: "Reserve/release compensation asserted for cancel by the named §1.8 instance; the expiry sweep path is separately covered by corner quote_expiry_sweep_releases_unit."

  # ===========================================================================
  # Consistency model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "A GET issued immediately after size-load returns the new sized_kw, sizing_method, incremented version, and refreshed updated_at in the same logical instant — no eventual lag."
        test_recipe:
          setup: ["Customer C1, Site S1, Contract K1 DRAFT (version 1)"]
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
            - call: "GET /power-rental/rental-contracts/${con_id}"
              payload: {}
              as: SalesEngineer
              captures: { sized: $.data.sized_kw, ver: $.data.version }
          assert:
            - "GET immediately after size-load: sized_kw == 200, sizing_method == NAMEPLATE_SUM, version == 2"
