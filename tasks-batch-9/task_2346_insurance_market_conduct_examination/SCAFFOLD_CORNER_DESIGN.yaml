      - name: corrective_action_plan_creation_defaults_its_revision_round
        claim_type: defaults
        grounds:
          - entities.CorrectiveActionPlan.fields.status
          - entities.CorrectiveActionPlan.fields.revision_round
          - concurrency_rules.cap-create-stale-exam
        distinguishing_aspect: |
          The first plan on an examination comes back status PROPOSED with revision_round exactly 1
          and reviewed_by_user_id null - the round counter is seeded by the server, and the OCC input
          expected_examination_version is consumed without being echoed as a stored field.
        excluded_because:
          difficulty_instance: consent_order_gate_reads_plan_state_not_plan_existence
          rationale: "That §1.8 instance asserts CorrectiveActionPlan P1 at revision_round 1 / status PROPOSED and P2 at revision_round 2 in the same recipe, covering both the default and its increment."

      - name: consent_order_freezes_restitution_and_stamps_its_drafter
        claim_type: computed_fields
        grounds:
          - entities.ConsentOrder.fields.restitution_cents
          - entities.ConsentOrder.fields.drafted_by_user_id
          - calculations.penalty_determination
        distinguishing_aspect: |
          restitution_cents is frozen from Examination.aggregate_restitution_cents at drafting and the
          four penalty fields are derived from the elected variant, while drafted_by_user_id records
          the X-User-ID that will later be barred from publishing the report.
        excluded_because:
          difficulty_instance: consent_order_credit_tier_is_keyed_on_subtotal_not_restitution
          rationale: "That §1.8 instance asserts restitution_cents 24000000, all four penalty fields and drafted_by_user_id on the drafted order."

      - name: multistate_collaboration_creation_computes_lead_and_participant_count
