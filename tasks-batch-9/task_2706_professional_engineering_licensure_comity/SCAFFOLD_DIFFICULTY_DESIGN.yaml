        grounds:
          - validations[priority=10]
          - errors.ERR_FIRM_STATE_INVALID
          - state_machines.FirmRegistration.ACTIVE_to_LAPSED_NO_RESPONSIBLE_CHARGE
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.PlanSubmission.DRAFT_to_SEALED
          - calculations.firm_responsible_charge_posture
        distinguishing_aspect: |
          The seal request names only a plan submission and a sealing licence; the blocking state lives two
          hops away on the FirmRegistration, which in turn lapsed because of a THIRD entity (the responsible
          charge licence suspended by a consent order). A positive control makes the dependency unambiguous:
          a byte-identical shape of request against a firm that is still ACTIVE succeeds, so the 409 cannot
          be attributed to the plan or the licence in isolation.
