            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane_w_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-EAST", region: "EAST", service_class: "GROUND", forecast_hourly_volume: 2000 }
              as: FacilityAdmin
              captures: { lane_e_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane_w_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${c1_v1}" }
              as: SortSupervisor
            - call: "GET /sortation/sort-chutes/${chute1_id}"
              payload: {}
              as: SortSupervisor
              captures: { c1_v2: $.data.version }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane_e_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${c1_v2}" }
              as: SortSupervisor
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute2_id}", destination_lane_id: "${lane_e_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${c2_v1}" }
              as: SortSupervisor
