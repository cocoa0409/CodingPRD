  # =========================================================================
  # 2. State machines (§1.2)
  # =========================================================================
  - section: state_machines
    instances:
      - name: financial_statement_accept_records_reviewer_and_leaves_the_seller_untouched
        claim_type: valid_transition
        grounds:
          - state_machines.FinancialStatement.SUBMITTED -> ACCEPTED
          - endpoints.POST /correspondent/financial-statements/{id}/review
        distinguishing_aspect: |
          The accept hop writes reviewed_by_user_id from the caller's X-User-ID
          and bumps FinancialStatement.version to 2, but it is NOT a seller
          transition: the Seller stays in APPLIED / NOT_ELIGIBLE with
          approved_tangible_net_worth_cents still 0 — only the approval
          decision may promote the seller.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Seller ${s1} in APPLIED with one SUBMITTED statement ${fs1}"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/financial-statements"
              payload: { fiscal_year_end: "2025-12-31", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
              as: SellerUser
              as_user_id: "${s1}"
              captures: { fs1: $.data.id }
          trigger:
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "ACCEPT", review_note: "audited, tie-out complete" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-2"
          assert:
            - "HTTP status == 200"
            - "FinancialStatement.${fs1}.status == ACCEPTED"
            - "FinancialStatement.${fs1}.reviewed_by_user_id == u-ca-2"
            - "FinancialStatement.${fs1}.review_note == audited, tie-out complete"
            - "FinancialStatement.${fs1}.version == 2"
            - "Seller.${s1}.approval_status == APPLIED and Seller.${s1}.delivery_standing == NOT_ELIGIBLE"
            - "Seller.${s1}.approved_tangible_net_worth_cents == 0 and Seller.${s1}.approval_tier == null"

      - name: approval_requires_an_accepted_statement_then_a_completed_qc_review_in_that_order
        claim_type: precondition_enforcement
        grounds:
          - validations[priority 20]
          - validations[priority 35]
          - validations[priority 39]
          - state_machines.Seller.approval_status.UNDER_REVIEW -> APPROVED
        distinguishing_aspect: |
          The three approval preconditions announce themselves one at a time in
          priority order on the SAME seller: with no QC review at all the
          decision is refused as ERR_INVALID_SELLER_STATE (still APPLIED);
          after the QC review opens the seller it is ERR_NO_ACCEPTED_STATEMENT;
          with the statement accepted but the review still OPEN it is
          ERR_QC_REVIEW_NOT_COMPLETED; only the fourth attempt succeeds.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Seller ${s1} in APPLIED with one SUBMITTED statement ${fs1} and no QC review"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/financial-statements"
              payload: { fiscal_year_end: "2025-12-31", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { fs1: $.data.id }
          trigger:
            - call: "POST /correspondent/sellers/${s1}/approval-decision"
              payload: { decision: "APPROVE" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { e_applied: $.data.error_id }
            - call: "POST /correspondent/sellers/${s1}/qc-reviews"
              payload: { review_type: "PRE_APPROVAL" }
              as: QCReviewer
              as_user_id: "u-qc-1"
              captures: { q1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/approval-decision"
              payload: { decision: "APPROVE" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { e_no_statement: $.data.error_id }
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "ACCEPT" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s1}/approval-decision"
              payload: { decision: "APPROVE" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { e_qc_open: $.data.error_id }
            - call: "POST /correspondent/qc-reviews/${q1}/complete"
              payload: { findings_count: 2, critical_findings_count: 0 }
              as: QCReviewer
              as_user_id: "u-qc-1"
            - call: "POST /correspondent/sellers/${s1}/approval-decision"
              payload: { decision: "APPROVE" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
          assert:
            - "${e_applied} == ERR_INVALID_SELLER_STATE with HTTP 409 (approval-decision requires UNDER_REVIEW)"
            - "${e_no_statement} == ERR_NO_ACCEPTED_STATEMENT with HTTP 409 — priority 35 speaks before priority 39 even though the review is also still OPEN"
            - "${e_qc_open} == ERR_QC_REVIEW_NOT_COMPLETED with HTTP 409"
            - "the fourth decision returns HTTP 200 with Seller.${s1}.approval_status == APPROVED"
            - "Seller.${s1}.delivery_standing == GOOD_STANDING and Seller.${s1}.approval_tier == STANDARD"
            - "Seller.${s1}.mandatory_exposure_limit_cents == 3000000000"

      - name: approval_blocked_by_stale_statement_thin_liquidity_or_failed_qc_outcome
        claim_type: precondition_enforcement
        grounds:
          - validations[priority 36]
          - validations[priority 38]
          - validations[priority 40]
          - calculations.qc_review_outcome
        distinguishing_aspect: |
          Three separately-underwritten sellers, each failing exactly one
          quantitative gate at the clock 2026-08-01T00:00:00Z: fiscal_year_end
          2025-01-01 is 455 days stale on 2026-04-01 and refused as
          ERR_FINANCIAL_STATEMENT_STALE; liquid_assets_cents 49999999 is one
          cent under MIN_LIQUIDITY_CENTS and refused as
          ERR_LIQUIDITY_BELOW_MINIMUM; critical_findings_count 1 forces QC
          outcome FAIL and is refused as ERR_QC_REVIEW_FAILED. All three
          sellers stay in UNDER_REVIEW with zeroed roll-ups.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Seller ${s_stale} with an ACCEPTED audited statement fiscal_year_end 2025-01-01 (stale from 2026-04-01) and a COMPLETED PASS review"
            - "Seller ${s_liq} with an ACCEPTED statement liquid_assets_cents 49999999 and a COMPLETED PASS review"
            - "Seller ${s_fail} with a fresh ACCEPTED statement and a COMPLETED review whose critical_findings_count is 1 -> outcome FAIL"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
