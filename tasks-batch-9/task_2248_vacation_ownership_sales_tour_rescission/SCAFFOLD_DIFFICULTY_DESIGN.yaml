            - "RefundDisbursement.${rd_fl}.doc_fee_retained_cents == 0"
            - "RefundDisbursement.${rd_fl}.disbursed_amount_cents == 320000"
            - "PurchaseAgreement.${a_fl}.retained_cents == 0"
            - "RefundDisbursement.${rd_tx}.refund_policy_applied == CONTRACTUAL_NET_OF_GIFT"
            - "RefundDisbursement.${rd_tx}.base_refund_cents == 320000"
            - "RefundDisbursement.${rd_tx}.gift_recapture_cents == 12500"
