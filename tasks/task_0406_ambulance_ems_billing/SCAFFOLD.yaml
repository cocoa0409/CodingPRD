# =============================================================================
# task_0406_ambulance_ems_billing — SCAFFOLD (§1.0–§1.7)
# Ambulance & EMS Billing (NEMSIS ePCR)
# Difficulty tier: Expert
# =============================================================================

scenario: |
  Ambulance & EMS Billing (NEMSIS ePCR): dispatch/run record import, level of
  service (BLS/ALS1/ALS2/SCT), loaded-mileage calculation, medical-necessity &
  PCS signature, payer (Medicare/Medicaid/auto/commercial) sequencing, mileage &
  origin/destination modifiers, balance-billing protection (No Surprises),
  write-off/charity

domain_name: ambulance-ems-billing
api_prefix: /

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - Dual-variant calculation        # estimated allowed vs adjudicated allowed; coding base vs adjudicated base-rate
    - Cascading side effects          # adjudication posts to claim -> claim updates transport balance -> payer sequence advances
    - Optimistic concurrency          # CREATE-with-supersede on Claim against a stale Transport version
    - Derived field reconciliation    # transport.patient_responsibility_cents, balance_cents recomputed from claims/payments
    - Rate / threshold triggers       # No Surprises QPA cap; charity FPL bands; mileage rural >17-mile rule

  entity_topology: flat
  # Peer entities linked by FK references (Transport, Claim, RemittanceLine,
  # Payment, etc.). No deep URL nesting — flat collections with fk filtering.

  state_machine_shape: parallel
  # Transport carries two independent dimensions: documentation_status
  # (ePCR/medical-necessity/PCS lifecycle) x billing_status (claim/payer
  # sequencing lifecycle). Claim adds a cyclic dimension (denial -> appeal -> resubmit).

  relationship_patterns:
    - one_to_many        # Transport has many Claims (one per payer in sequence); many Charges
    - cross_aggregate    # RemittanceLine references Claim across the billing aggregate
    - self_referential   # Claim.prior_claim_id chains payer-sequence claims (primary -> secondary -> tertiary)

  role_model: peer_roles
  # Dispatcher imports runs; Coder assigns LOS + computes charges; Biller submits
  # claims + posts remits; ComplianceOfficer signs PCS / applies No-Surprises &
  # charity; BillingAdmin operational overrides. Identities are entity-backed where
  # the actor is a persisted Agency staff member; admin is opaque.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "EMS agency / ambulance provider name" }
      - { name: npi, type: string, source: input, description: "10-digit National Provider Identifier" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state the agency operates in (e.g., CA, TX)" }
      - { name: base_state_is_no_surprises, type: boolean, source: input, default: false, description: "True if the agency's state has ground-ambulance balance-billing protection that extends the federal No Surprises Act to ground transports" }
      - { name: charity_fpl_threshold_pct, type: integer, source: input, default: 200, description: "Household-income ceiling, as a percent of Federal Poverty Level, at or below which a patient qualifies for 100% charity write-off" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED agencies cannot import new runs", constraints: "enum: ACTIVE, SUSPENDED" }

  - name: AgencyStaff
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; the agency this staff member belongs to" }
      - { name: full_name, type: string, source: input, description: "Staff member name" }
      - { name: role, type: enum, source: input, description: "Functional role used for X-User-Role binding", constraints: "enum: Dispatcher, Coder, Biller, ComplianceOfficer" }
      - { name: pcs_signature_authority, type: boolean, source: input, default: false, description: "True if this staff member may attest a Physician Certification Statement signature on behalf of compliance" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DEACTIVATED", constraints: "enum: ACTIVE, DEACTIVATED" }

  - name: PayerPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Payer plan display name (e.g., 'Medicare Part B', 'BlueCross PPO')" }
      - { name: payer_type, type: enum, source: input, description: "Drives fee schedule, sequencing rank, and balance-billing rules", constraints: "enum: MEDICARE, MEDICAID, AUTO, COMMERCIAL, SELF_PAY" }
      - { name: qpa_multiplier, type: number, source: input, default: 1.0, description: "Qualifying Payment Amount multiplier applied to the Medicare allowed amount to derive this COMMERCIAL/AUTO plan's allowed cap; ignored for MEDICARE/MEDICAID/SELF_PAY" }
      - { name: allows_balance_billing, type: boolean, source: input, default: true, description: "Whether this plan permits the agency to bill the patient the gap between billed charge and plan allowed amount" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE — INACTIVE plans cannot be named on new claims", constraints: "enum: ACTIVE, INACTIVE" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: household_size, type: integer, source: input, default: 1, description: "Number of people in the patient's household, used for FPL charity test" }
      - { name: annual_household_income_cents, type: integer, source: input, default: null, description: "Self-reported annual household income in cents; null = not provided" }
      - { name: coverages, type: array, source: input, description: "Ordered list of { payer_plan_id, policy_rank } the patient holds; policy_rank is the patient-asserted ordering (1=primary). FK references each resolve to PayerPlan.id" }

  - name: Vehicle
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; the agency operating this ambulance" }
      - { name: unit_call_sign, type: string, source: input, description: "Radio call sign, unique per agency (e.g., 'Medic-7')" }
      - { name: turnaround_minutes, type: integer, source: input, default: 30, description: "Minimum decontamination/restock buffer required between back-to-back vehicle assignments; the buffer is part of the occupied interval for overlap detection" }
      - { name: status, type: enum, source: system, default: "IN_SERVICE", description: "IN_SERVICE | OUT_OF_SERVICE — OUT_OF_SERVICE vehicles cannot be assigned", constraints: "enum: IN_SERVICE, OUT_OF_SERVICE" }

  - name: CrewMember
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; the agency this crew member works for" }
      - { name: full_name, type: string, source: input, description: "Crew member name" }
      - { name: certification, type: enum, source: input, description: "Highest scope of practice: EMT (BLS), AEMT (ALS1), PARAMEDIC (ALS2/SCT)", constraints: "enum: EMT, AEMT, PARAMEDIC" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE", constraints: "enum: ACTIVE, INACTIVE" }

  - name: UnitAssignment
    parent: Transport
    common_fields: true
    fields:
      - { name: transport_id, type: string, source: input, description: "FK -> Transport.id; the transport this unit run serves" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; the assigned ambulance" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id; the assigned lead crew member" }
      - { name: window_start_iso, type: datetime, source: input, description: "ISO 8601 UTC start of the dispatch-to-clear window the unit is occupied" }
      - { name: window_end_iso, type: datetime, source: input, description: "ISO 8601 UTC end of the dispatch-to-clear window (must be strictly after window_start_iso)" }

  - name: Transport
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; the agency that performed the transport" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the transported patient" }
      - { name: run_number, type: string, source: input, description: "Agency-assigned dispatch/run number, unique per agency across non-VOID transports" }
      - { name: dispatch_iso, type: datetime, source: input, description: "ISO 8601 UTC dispatch timestamp from the imported NEMSIS run record" }
      - { name: origin_modifier, type: enum, source: input, description: "Single-letter HCPCS origin code: S=scene, H=hospital, N=skilled nursing, R=residence, E=ER, P=physician office, I=intermediate stop", constraints: "enum: S, H, N, R, E, P, I" }
      - { name: destination_modifier, type: enum, source: input, description: "Single-letter HCPCS destination code: H=hospital, N=skilled nursing, R=residence, E=ER, P=physician office, I=intermediate stop, X=freestanding ED", constraints: "enum: H, N, R, E, P, I, X" }
      - { name: loaded_miles, type: number, source: input, description: "Odometer loaded-mileage (patient onboard) from the ePCR, to one decimal place; must be > 0" }
      - { name: is_rural_pickup, type: boolean, source: input, default: false, description: "True if the pickup ZIP is designated rural for the mileage rural-bonus rule" }
      - { name: level_of_service, type: enum, source: computed, default: null, description: "Assigned LOS code, null until coding: BLS, ALS1, ALS2, SCT", constraints: "enum: BLS, ALS1, ALS2, SCT" }
      - { name: emergency_indicator, type: boolean, source: input, default: false, description: "True if the dispatch was an emergency response (drives the -E vs -N HCPCS suffix and ALS1-emergency base)" }
      - { name: medical_necessity_met, type: boolean, source: computed, default: false, description: "True once a Coder has attested the patient's condition required ambulance transport" }
      - { name: pcs_signed, type: boolean, source: computed, default: false, description: "True once a Physician Certification Statement signature is recorded (required for non-emergency runs from N/R origins)" }
      - { name: documentation_status, type: enum, source: system, default: "IMPORTED", description: "ePCR/compliance lifecycle dimension", constraints: "enum: IMPORTED, CODED, NECESSITY_REVIEW, DOCUMENTATION_COMPLETE, RETURNED" }
      - { name: billing_status, type: enum, source: system, default: "UNBILLED", description: "Claim/payer-sequence lifecycle dimension (independent of documentation_status)", constraints: "enum: UNBILLED, BILLING_IN_PROGRESS, BILLED, PATIENT_BALANCE, CLOSED, VOID" }
      - { name: total_billed_cents, type: integer, source: computed, default: 0, description: "Sum of Charge.billed_amount_cents for this transport's charges; 0 until coded" }
      - { name: total_allowed_cents, type: integer, source: computed, default: 0, description: "Sum of adjudicated allowed amounts across all posted RemittanceLines for this transport" }
      - { name: total_paid_cents, type: integer, source: computed, default: 0, description: "Sum of payer + patient payments posted to this transport" }
      - { name: total_writeoff_cents, type: integer, source: computed, default: 0, description: "Sum of contractual adjustments + charity/uncollectible write-offs" }
      - { name: patient_responsibility_cents, type: integer, source: computed, default: 0, description: "Amount currently owed by the patient after all payer adjudication, balance-billing caps, and write-offs" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "total_billed_cents - total_allowed_writeoff_applied; outstanding receivable across payers + patient" }

  - name: Charge
    parent: Transport
    common_fields: true
    fields:
      - { name: transport_id, type: string, source: system, description: "FK -> Transport.id; the transport this charge belongs to" }
      - { name: charge_type, type: enum, source: system, description: "BASE_RATE = the LOS base HCPCS line; MILEAGE = the per-loaded-mile line", constraints: "enum: BASE_RATE, MILEAGE" }
      - { name: hcpcs_code, type: string, source: system, description: "Resolved HCPCS code (e.g., A0429 BLS-emergency, A0427 ALS1-emergency, A0425 ground mileage)" }
      - { name: units, type: number, source: system, description: "1 for BASE_RATE; loaded_miles for MILEAGE" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Gross billed amount for this charge line before any payer adjudication" }

  - name: Claim
    parent: Transport
    common_fields: true
    fields:
      - { name: transport_id, type: string, source: system, description: "FK -> Transport.id; the transport being claimed" }
      - { name: payer_plan_id, type: string, source: input, description: "FK -> PayerPlan.id; the payer this claim is submitted to" }
      - { name: prior_claim_id, type: string, source: input, default: null, description: "FK -> Claim.id; the immediately preceding claim in the payer sequence (null for the primary claim)" }
      - { name: sequence_rank, type: integer, source: system, description: "1=primary, 2=secondary, 3=tertiary; derived from prior_claim_id chain depth" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Billed total submitted on this claim (= transport.total_billed_cents at submission)" }
      - { name: prior_paid_cents, type: integer, source: computed, default: 0, description: "Sum already paid by upstream payers in the sequence, carried onto this claim as coordination-of-benefits context" }
      - { name: allowed_amount_cents, type: integer, source: computed, default: 0, description: "Adjudicated allowed amount once a remittance is posted; 0 while SUBMITTED" }
      - { name: paid_amount_cents, type: integer, source: computed, default: 0, description: "Amount this payer paid once a remittance is posted" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Claim lifecycle (cyclic via denial -> appeal -> resubmit)", constraints: "enum: DRAFT, SUBMITTED, PAID, DENIED, APPEALED, CLOSED" }

  - name: RemittanceLine
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim being adjudicated" }
      - { name: outcome, type: enum, source: input, description: "Adjudication outcome reported on the 835 remittance", constraints: "enum: PAID, PARTIAL, DENIED" }
      - { name: reported_allowed_cents, type: integer, source: input, default: null, description: "Allowed amount the payer reports; null lets the system derive it from the fee schedule" }
      - { name: paid_cents, type: integer, source: input, description: "Amount the payer remitted on this line" }
      - { name: denial_reason, type: enum, source: input, default: null, description: "Required when outcome=DENIED", constraints: "enum: NOT_MEDICALLY_NECESSARY, MISSING_PCS, NON_COVERED_DESTINATION, COB_PRIMARY_NOT_BILLED, DUPLICATE" }
      - { name: contractual_adjustment_cents, type: integer, source: computed, description: "billed - allowed write-off recorded against the transport when this line posts" }

  - name: Payment
    parent: Transport
    common_fields: true
    fields:
      - { name: transport_id, type: string, source: input, description: "FK -> Transport.id; the transport receiving the payment" }
      - { name: claim_id, type: string, source: input, default: null, description: "FK -> Claim.id; the claim a payer payment is attributed to (null for direct patient payments)" }
      - { name: source, type: enum, source: input, description: "Who paid", constraints: "enum: PAYER, PATIENT" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; must be > 0" }
      - { name: posted_iso, type: datetime, source: system, description: "ISO 8601 UTC timestamp the payment was posted" }

  - name: Adjustment
    parent: Transport
    common_fields: true
    fields:
      - { name: transport_id, type: string, source: input, description: "FK -> Transport.id; the transport being adjusted" }
      - { name: adjustment_type, type: enum, source: input, description: "CHARITY=100% income-qualified write-off; UNCOLLECTIBLE=bad-debt; BALANCE_BILLING_CAP=No-Surprises gap write-off; GOODWILL=discretionary", constraints: "enum: CHARITY, UNCOLLECTIBLE, BALANCE_BILLING_CAP, GOODWILL" }
      - { name: amount_cents, type: integer, source: computed, description: "Write-off amount applied; for CHARITY/CAP the server computes it, for UNCOLLECTIBLE/GOODWILL the request supplies requested_amount_cents" }
      - { name: requested_amount_cents, type: integer, source: input, default: null, description: "Requested write-off for UNCOLLECTIBLE/GOODWILL; ignored for CHARITY (full patient balance) and BALANCE_BILLING_CAP (computed gap)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Transport: documentation dimension (parallel with billing dimension) ----
  - entity: Transport
    dimension: documentation_status
    initial_state: IMPORTED
    terminal_states: []
    transitions:
      - from: IMPORTED
        to: CODED
        trigger: "POST /transports/{id}/code"
        actor: Coder
        preconditions:
          - "transport.billing_status == UNBILLED (cannot recode once billing has started — ERR_INVALID_DOCUMENTATION_STATE)"
          - "request.level_of_service IN {BLS, ALS1, ALS2, SCT}"
        side_effects:
          - "set Transport.level_of_service = request.level_of_service"
          - "run calc resolve_hcpcs_lines then synthesize two Charge rows (BASE_RATE, MILEAGE) via calc compute_charge_billed_amount"
          - "recompute Transport.total_billed_cents = sum(Charge.billed_amount_cents) [calc reconcile_transport_ledger]"
          - "recompute Transport.balance_cents [calc reconcile_transport_ledger]"
      - from: CODED
        to: NECESSITY_REVIEW
        trigger: "POST /transports/{id}/attest-necessity"
        actor: Coder
        preconditions:
          - "transport.documentation_status == CODED"
        side_effects:
          - "set Transport.medical_necessity_met = true"
      - from: NECESSITY_REVIEW
        to: DOCUMENTATION_COMPLETE
        trigger: "POST /transports/{id}/sign-pcs"
        actor: ComplianceOfficer
        preconditions:
          - "transport.documentation_status == NECESSITY_REVIEW"
          - "acting AgencyStaff.pcs_signature_authority == true (ERR_PCS_AUTHORITY_REQUIRED)"
          - "If transport requires PCS (calc pcs_requirement == REQUIRED) the signature is recorded; if NOT_REQUIRED the step still completes and marks pcs_signed=false"
        side_effects:
          - "if calc pcs_requirement == REQUIRED: set Transport.pcs_signed = true"
          - "set Transport.documentation_status = DOCUMENTATION_COMPLETE"
        note: "DOCUMENTATION_COMPLETE is the gate for the billing dimension's UNBILLED -> BILLING_IN_PROGRESS transition (cross-dimension guard)."
      - from: NECESSITY_REVIEW
        to: RETURNED
        trigger: "POST /transports/{id}/return-documentation"
        actor: ComplianceOfficer
        preconditions:
          - "transport.documentation_status == NECESSITY_REVIEW"
        side_effects:
          - "set Transport.medical_necessity_met = false"
        note: "Revision loop — RETURNED is non-terminal; the Coder re-attests to move RETURNED -> NECESSITY_REVIEW."
      - from: RETURNED
        to: NECESSITY_REVIEW
        trigger: "POST /transports/{id}/attest-necessity"
        actor: Coder
        preconditions:
          - "transport.documentation_status == RETURNED"
        side_effects:
          - "set Transport.medical_necessity_met = true"
        note: "Cyclic: NECESSITY_REVIEW <-> RETURNED revision loop."

  # ---- Transport: billing dimension (parallel; guarded by documentation dim) ----
  - entity: Transport
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: UNBILLED
        to: BILLING_IN_PROGRESS
        trigger: "POST /transports/{id}/claims  (creating the FIRST primary claim)"
        actor: Biller
        preconditions:
          - "transport.documentation_status == DOCUMENTATION_COMPLETE (cross-dimension guard — ERR_DOCUMENTATION_INCOMPLETE)"
          - "transport.medical_necessity_met == true (ERR_MEDICAL_NECESSITY_NOT_MET)"
          - "prior_claim_id omitted/null for the primary claim"
          - "expected_transport_version == transport.version (ERR_STALE_TRANSPORT_VERSION)"
        side_effects:
          - "create Claim with sequence_rank=1, status=SUBMITTED [Claim.DRAFT_to_SUBMITTED bundled into create]"
          - "set Transport.billing_status = BILLING_IN_PROGRESS"
          - "increments Transport.version by 1"
      - from: BILLING_IN_PROGRESS
        to: BILLING_IN_PROGRESS
        trigger: "POST /transports/{id}/claims  (rebill: a NEW primary claim that legitimately supersedes the prior primary)"
        actor: Biller
        preconditions:
          - "prior_claim_id omitted/null (this is a primary rebill)"
          - "the existing sequence_rank==1 Claim is in {SUBMITTED, DENIED} (a non-PAID primary may be rebilled); if it is PAID -> ERR_INVALID_CLAIM_STATE"
          - "no sequence_rank>1 claim exists yet (cannot rebill the primary once a secondary has been opened — ERR_INVALID_CLAIM_STATE)"
          - "expected_transport_version == transport.version (ERR_STALE_TRANSPORT_VERSION)"
        side_effects:
          - "supersede: set the prior sequence_rank==1 Claim.status = CLOSED"
          - "create a new Claim sequence_rank=1, status=SUBMITTED [supersede semantics]"
          - "increments Transport.version by 1"
        note: "True CREATE-with-supersede: a sequentially-later rebill carrying a fresh version legitimately succeeds (replaces the prior primary); one carrying a stale version is rejected by OCC — see §1.2.1."
      - from: BILLING_IN_PROGRESS
        to: BILLED
        trigger: "system (automatic when the active primary/secondary/tertiary claim sequence is exhausted: latest claim PAID or DENIED with no further payer in the patient's coverage list)"
        actor: system
        preconditions:
          - "no Claim for this transport in {DRAFT, SUBMITTED, APPEALED}"
        side_effects:
          - "recompute Transport.patient_responsibility_cents [calc patient_responsibility]"
          - "recompute Transport.balance_cents, total_allowed_cents, total_paid_cents, total_writeoff_cents [calc reconcile_transport_ledger]"
      - from: BILLED
        to: PATIENT_BALANCE
        trigger: "system (automatic when patient_responsibility_cents > 0 after the final payer adjudicates)"
        actor: system
        preconditions:
          - "transport.patient_responsibility_cents > 0"
        side_effects: []
        note: "If patient_responsibility_cents == 0 the transport skips PATIENT_BALANCE and auto-advances BILLED -> CLOSED."
      - from: BILLED
        to: CLOSED
        trigger: "system (automatic when patient_responsibility_cents == 0)"
        actor: system
        preconditions:
          - "transport.patient_responsibility_cents == 0"
        side_effects: []
      - from: PATIENT_BALANCE
        to: CLOSED
        trigger: "system (automatic when remaining patient balance reaches 0 via patient payment, charity, balance-billing cap, or uncollectible write-off)"
        actor: system
        preconditions:
          - "transport.patient_responsibility_cents == 0"
        side_effects:
          - "recompute Transport.balance_cents [calc reconcile_transport_ledger]"
      - from: UNBILLED
        to: VOID
        trigger: "POST /transports/{id}/void"
        actor: Biller
        preconditions:
          - "transport.billing_status == UNBILLED (cannot void once any claim exists — ERR_TRANSPORT_NOT_VOIDABLE)"
        side_effects:
          - "delete synthesized Charge rows; total_billed_cents -> 0"
          - "frees run_number for reuse (uniqueness only spans non-VOID transports)"

  # ---- Claim: cyclic (denial -> appeal -> resubmit) ----
  - entity: Claim
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "bundled into POST /transports/{id}/claims"
        actor: Biller
        preconditions:
          - "named PayerPlan.status == ACTIVE (ERR_PAYER_PLAN_INACTIVE)"
          - "if sequence_rank > 1: prior_claim_id resolves to a Claim in status PAID or DENIED (ERR_PRIOR_CLAIM_NOT_ADJUDICATED)"
          - "if sequence_rank > 1: named payer matches the patient's coverage entry at policy_rank == sequence_rank (ERR_PAYER_SEQUENCE_MISMATCH)"
        side_effects:
          - "set Claim.billed_amount_cents = Transport.total_billed_cents"
          - "set Claim.prior_paid_cents = sum(paid_amount_cents of all prior claims in the chain) [calc cob_prior_paid]"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /claims/{id}/remittances  (outcome PAID or PARTIAL)"
        actor: Biller
        preconditions:
          - "claim.status == SUBMITTED"
          - "remittance.outcome IN {PAID, PARTIAL}"
        side_effects:
          - "compute Claim.allowed_amount_cents [calc adjudicated_allowed]"
          - "set Claim.paid_amount_cents = remittance.paid_cents"
          - "create Payment(source=PAYER, claim_id=this) for paid_cents"
          - "record RemittanceLine.contractual_adjustment_cents = Claim.billed_amount_cents - Claim.allowed_amount_cents [calc contractual_adjustment]"
          - "recompute Transport ledger; advance billing dimension if sequence exhausted [cascade]"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /claims/{id}/remittances  (outcome DENIED)"
        actor: Biller
        preconditions:
          - "claim.status == SUBMITTED"
          - "remittance.outcome == DENIED AND remittance.denial_reason present"
        side_effects:
          - "set Claim.allowed_amount_cents = 0, paid_amount_cents = 0"
          - "recompute Transport ledger; advance billing dimension if sequence exhausted [cascade]"
      - from: DENIED
        to: APPEALED
        trigger: "POST /claims/{id}/appeal"
        actor: Biller
        preconditions:
          - "claim.status == DENIED"
          - "claim.denial_reason resolvable (the latest DENIED RemittanceLine exists)"
        side_effects:
          - "set Claim.status = APPEALED"
        note: "Cyclic: APPEALED -> SUBMITTED on resubmit reopens adjudication."
      - from: APPEALED
        to: SUBMITTED
        trigger: "POST /claims/{id}/resubmit"
        actor: Biller
        preconditions:
          - "claim.status == APPEALED"
        side_effects:
          - "reset Claim.allowed_amount_cents = 0, paid_amount_cents = 0"
        note: "Cyclic loop DENIED -> APPEALED -> SUBMITTED -> {PAID, DENIED} (negotiation rounds)."
      - from: PAID
        to: CLOSED
        trigger: "system (automatic once the payer sequence is exhausted and Transport leaves BILLING_IN_PROGRESS)"
        actor: system
        preconditions:
          - "Transport.billing_status IN {BILLED, PATIENT_BALANCE, CLOSED}"
        side_effects: []
      - from: DENIED
        to: CLOSED
        trigger: "system (automatic once the payer sequence is exhausted with no appeal pending)"
        actor: system
        preconditions:
          - "Transport.billing_status IN {BILLED, PATIENT_BALANCE, CLOSED}"
          - "no further coverage entry at policy_rank == sequence_rank + 1"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: claim-create-stale-transport
    parent_entity: Transport
    write_endpoint: "POST /transports/{id}/claims"
    occ_field: "expected_transport_version"
    description: |
      Submitting a primary claim (no prior_claim_id) against a Transport whose
      version has advanced since the client last observed it is rejected with a
      stale-version error. This is a genuine CREATE-with-supersede race: a primary
      rebill legitimately supersedes the prior primary claim (the prior rank-1
      Claim is CLOSED and a fresh rank-1 Claim is created), so a request that
      carries the CURRENT version would succeed. A request that still carries an
      older version is therefore working from a superseded view of the transport
      and is rejected. Because the rebill is itself a legitimate operation under
      identical fresh state, this passes the §1.2.1 serial-observability filter:
      the rejection is keyed purely on the stale version integer, not on any
      observable billing_status field.
    error_id: ERR_STALE_TRANSPORT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: resolve_hcpcs_lines
    trigger: "Transport IMPORTED -> CODED (POST /transports/{id}/code)"
    algorithm: constraint_propagation
    formula: |
      # Determine the BASE_RATE HCPCS from level_of_service + emergency_indicator,
      # and the MILEAGE HCPCS from payer-agnostic ground code.
      base_emergency = transport.emergency_indicator
      base_code =
        if level_of_service == BLS:  ("A0429" if base_emergency else "A0428")
        if level_of_service == ALS1: ("A0427" if base_emergency else "A0426")
        if level_of_service == ALS2: "A0433"   # ALS2 is always treated as emergency-grade
        if level_of_service == SCT:  "A0434"
      mileage_code = "A0425"   # ground mileage, always per-loaded-mile
      base_units = 1
      mileage_units = transport.loaded_miles
    input_set: "the transport being coded; level_of_service and emergency_indicator are the only inputs"
    constants:
      A0428_DESC: "BLS non-emergency"
      A0429_DESC: "BLS emergency"
      A0426_DESC: "ALS1 non-emergency"
      A0427_DESC: "ALS1 emergency"
      A0433_DESC: "ALS2"
      A0434_DESC: "SCT"
      A0425_DESC: "Ground mileage"
    precision: "n/a (code resolution, no rounding)"

  - name: compute_charge_billed_amount
    trigger: "Transport IMPORTED -> CODED (after resolve_hcpcs_lines)"
    algorithm: tiered_pricing
    formula: |
      # MODE (b): nested rounding where order is pinned. The mileage line applies
      # a rural bonus to the FIRST 17 loaded miles only, then a flat rate beyond.
      # Pinned order: compute per-tier cents FIRST, round EACH tier half-up to the
      # cent, THEN sum (round-per-tier-then-sum, NOT sum-then-round).
      BASE_RATE charge:
        billed = round_half_up( BASE_RATE_CENTS[base_code] )   # already integer cents
      MILEAGE charge:
        miles = transport.loaded_miles
        if transport.is_rural_pickup:
          rural_miles  = min(miles, 17.0)
          normal_miles = max(miles - 17.0, 0.0)
          tier1 = round_half_up( rural_miles  * MILEAGE_CENTS_PER_MILE * RURAL_BONUS_FACTOR )
          tier2 = round_half_up( normal_miles * MILEAGE_CENTS_PER_MILE )
          billed = tier1 + tier2
        else:
          billed = round_half_up( miles * MILEAGE_CENTS_PER_MILE )
    input_set: "the two synthesized Charge rows for the transport"
    constants:
      BASE_RATE_CENTS: { A0428: 45000, A0429: 60000, A0426: 65000, A0427: 80000, A0433: 110000, A0434: 130000 }
      MILEAGE_CENTS_PER_MILE: 1750
      RURAL_BONUS_FACTOR: 1.5
      RURAL_BONUS_MILE_CAP: 17
    precision: "integer cents, round_half_up applied per tier BEFORE summing"

  - name: adjudicated_allowed
    trigger: "Claim SUBMITTED -> PAID/DENIED (POST /claims/{id}/remittances)"
    algorithm: forward_looking
    formula: |
      # DUAL-VARIANT calc #1 (domain: Claim adjudication). Two valid bases for the
      # allowed amount; the scaffold pins which applies per payer_type.
      if remittance.reported_allowed_cents is not null:
        allowed = remittance.reported_allowed_cents          # variant: payer-reported
      else:
        base = MEDICARE_ALLOWED for this transport's charges  # fee-schedule baseline
        if payer_type == MEDICARE:    allowed = base
        if payer_type == MEDICAID:    allowed = round_half_up(base * MEDICAID_FACTOR)
        if payer_type IN {COMMERCIAL, AUTO}:
          allowed = round_half_up(base * payer_plan.qpa_multiplier)   # QPA-derived
        if payer_type == SELF_PAY:    allowed = transport.total_billed_cents
      # COB cap: a secondary/tertiary payer never allows more than the remaining
      # gap after prior payers: allowed = min(allowed, billed - claim.prior_paid_cents)
      allowed = min(allowed, claim.billed_amount_cents - claim.prior_paid_cents)
    input_set: "the claim being adjudicated, its payer plan, and prior_paid_cents from the COB chain"
    constants:
      MEDICAID_FACTOR: 0.80
      MEDICARE_ALLOWED_BASE: { A0428: 23000, A0429: 31000, A0426: 33000, A0427: 41000, A0433: 56000, A0434: 66000 }
      MEDICARE_ALLOWED_MILEAGE_CENTS_PER_MILE: 800
      MEDICARE_RURAL_BONUS_FACTOR: 1.5
    precision: "integer cents, round_half_up"
    variants:
      - name: payer_reported_allowed
        when: "remittance.reported_allowed_cents is provided"
        difference: "uses the payer's reported figure verbatim, skipping the fee-schedule derivation"
      - name: fee_schedule_derived_allowed
        when: "remittance.reported_allowed_cents is null"
        difference: "derives allowed from the Medicare baseline scaled by payer_type factor / QPA multiplier"

  - name: cob_prior_paid
    trigger: "Claim DRAFT -> SUBMITTED (claim creation)"
    algorithm: aggregation
    formula: |
      # Sum of paid_amount_cents over every claim already in this transport's
      # payer chain whose status == PAID, ordered by sequence_rank ASC; ties
      # impossible (sequence_rank is unique per chain). Excludes DENIED/SUBMITTED.
      prior_paid = sum( c.paid_amount_cents
                        for c in claims where c.transport_id == this.transport_id
                        and c.status == PAID
                        and c.sequence_rank < this.sequence_rank )
    input_set: "PAID claims with sequence_rank strictly less than the new claim's rank"
    constants: {}
    precision: "integer cents"

  - name: contractual_adjustment
    trigger: "Claim SUBMITTED -> PAID (remittance post)"
    algorithm: aggregation
    formula: |
      # The contractual write-off recorded when a payer adjudicates a PAID/PARTIAL
      # remittance. Pinned per payer_type + sequence_rank:
      #   PRIMARY (sequence_rank == 1):
      #     payer_type IN {MEDICARE, MEDICAID} -> auto-write-off the full gap:
      #         contractual = max(claim.billed_amount_cents - claim.allowed_amount_cents, 0)
      #     payer_type IN {COMMERCIAL, AUTO, SELF_PAY} -> contractual = 0 at remit
      #         time. The billed-minus-allowed gap is NOT auto-written-off; it
      #         remains on the patient balance. If the patient is balance-billing
      #         PROTECTED, a ComplianceOfficer later files an explicit
      #         BALANCE_BILLING_CAP Adjustment to write the gap down to cost-share
      #         (calc balance_billing_cap_writeoff). If NOT protected, the agency
      #         legitimately balance-bills the full gap.
      #   SECONDARY/TERTIARY (sequence_rank > 1): each downstream payer writes off
      #     only the residual gap it was billed:
      #         contractual = max((claim.billed_amount_cents - claim.prior_paid_cents)
      #                           - claim.allowed_amount_cents, 0)
    input_set: "the claim posting a PAID/PARTIAL remittance, its payer plan, sequence_rank, and prior_paid_cents"
    constants: {}
    precision: "integer cents; floors at 0"

  - name: patient_responsibility
    trigger: "Transport BILLING_IN_PROGRESS -> BILLED (payer sequence exhausted) AND on any Payment or Adjustment post"
    algorithm: waterfall_allocation
    formula: |
      # DUAL-VARIANT calc #2 (domain: Transport patient liability). Residual after
      # all payers and all write-offs. A single residual expression; the VARIANT is
      # produced by how much was written off upstream (contractual + cap), which in
      # turn depends on the balance-billing protection test:
      #   protected = (primary_plan.payer_type IN {MEDICARE, MEDICAID})
      #            OR (primary_plan.payer_type IN {COMMERCIAL, AUTO}
      #                AND (primary_plan.allows_balance_billing == false
      #                     OR transport.agency.base_state_is_no_surprises == true))
      payer_paid    = sum(Payment.amount_cents where source==PAYER)
      patient_paid  = sum(Payment.amount_cents where source==PATIENT)
      writeoffs     = sum(Adjustment.amount_cents) + sum(RemittanceLine.contractual_adjustment_cents)
      patient_responsibility = max(transport.total_billed_cents - payer_paid - patient_paid - writeoffs, 0)
      # Trajectory:
      #   MEDICARE/MEDICAID primary -> contractual auto-recorded -> patient owes the
      #     cost-share (allowed - payer_paid) immediately after adjudication.
      #   COMMERCIAL/AUTO NOT protected -> contractual=0 and no cap allowed -> patient
      #     owes the full gap (billed - payer_paid): the standard balance-bill variant.
      #   COMMERCIAL/AUTO protected -> contractual=0 at adjudication so patient_resp
      #     first shows the full gap; the ComplianceOfficer's BALANCE_BILLING_CAP
      #     Adjustment then writes the gap down to cost-share: the No-Surprises variant.
    input_set: "all PAYER + PATIENT payments, all contractual + discretionary write-offs"
    constants: {}
    precision: "integer cents; floors at 0"
    variants:
      - name: standard_balance_bill
        when: "primary payer is COMMERCIAL/AUTO, allows_balance_billing == true, AND agency state has no ground No-Surprises protection"
        difference: "no contractual write-off and no cap permitted, so the patient owes the full gap = billed - payer_paid"
      - name: no_surprises_protected
        when: "primary payer is COMMERCIAL/AUTO with balance billing barred (plan flag false OR agency No-Surprises state); a BALANCE_BILLING_CAP Adjustment is filed"
        difference: "the billed-minus-cost-share gap is written off via the cap Adjustment, so the patient owes only the cost-share = allowed - payer_paid"

  - name: pcs_requirement
    trigger: "evaluated at NECESSITY_REVIEW -> DOCUMENTATION_COMPLETE and at claim creation"
    algorithm: threshold
    formula: |
      # MODE (a): >=3 inputs with conditional branches. A Physician Certification
      # Statement is REQUIRED for non-emergency transports originating from a
      # skilled-nursing facility (N) or residence (R) to a covered destination.
      if transport.emergency_indicator == true:
        result = NOT_REQUIRED
      elif transport.origin_modifier IN {N, R}:
        result = REQUIRED
      else:
        result = NOT_REQUIRED
    input_set: "the transport's emergency_indicator and origin_modifier"
    constants:
      PCS_REQUIRED_ORIGINS: [N, R]
    precision: "n/a (enum result REQUIRED | NOT_REQUIRED)"

  - name: charity_writeoff
    trigger: "POST /transports/{id}/adjustments with adjustment_type == CHARITY"
    algorithm: threshold
    formula: |
      # MODE (a): tiered FPL test with >=3 inputs (income, household_size,
      # agency threshold). Patient qualifies for a 100% charity write-off of the
      # current patient_responsibility_cents when household income as a percent of
      # the Federal Poverty Level is <= the agency's charity_fpl_threshold_pct.
      fpl_base = FPL_FIRST_PERSON_CENTS + (patient.household_size - 1) * FPL_PER_ADDL_CENTS
      income   = patient.annual_household_income_cents
      if income is null:  reject ERR_CHARITY_INCOME_REQUIRED
      income_pct_of_fpl = round_half_up( income * 100 / fpl_base )   # integer percent
      if income_pct_of_fpl <= agency.charity_fpl_threshold_pct:
        writeoff = transport.patient_responsibility_cents   # full balance
      else:
        reject ERR_CHARITY_NOT_QUALIFIED
    input_set: "patient income + household_size, agency FPL threshold, current patient_responsibility_cents"
    constants:
      FPL_FIRST_PERSON_CENTS: 1508000     # $15,080
      FPL_PER_ADDL_CENTS: 532000          # $5,320 per additional household member
    precision: "integer cents; income_pct_of_fpl rounded half-up to whole percent BEFORE the <= comparison"

  - name: balance_billing_cap_writeoff
    trigger: "POST /transports/{id}/adjustments with adjustment_type == BALANCE_BILLING_CAP"
    algorithm: threshold
    formula: |
      # No Surprises gap write-off. Valid only when the patient is protected from
      # balance billing (primary payer COMMERCIAL/AUTO and either the plan bars
      # balance billing or the agency state has ground No-Surprises protection).
      # Writes off the portion of the patient's current responsibility that
      # exceeds the in-network cost-share (allowed - payer_paid). When the primary
      # remittance already recorded a contractual write-off (the protected path),
      # this gap is already 0 and the adjustment posts amount 0; when the agency
      # voluntarily caps a standard balance-bill, it writes off the excess.
      primary_claim = the sequence_rank==1 Claim
      cost_share    = max(primary_claim.allowed_amount_cents - payer_paid_for_primary, 0)
      writeoff      = max(transport.patient_responsibility_cents - cost_share, 0)
    input_set: "the primary claim's allowed amount and payer payment, current patient_responsibility_cents"
    constants: {}
    precision: "integer cents; floors at 0"

  - name: reconcile_transport_ledger
    trigger: "any Charge synthesis, Payment post, RemittanceLine post, or Adjustment post"
    algorithm: aggregation
    formula: |
      # CIRCULAR-LOOKING dependency pinned (mode (c)): balance_cents depends on
      # total_writeoff_cents and total_paid_cents, which depend on posted remits and
      # payments. Evaluation order is pinned: (1) total_billed; (2) total_allowed;
      # (3) total_paid; (4) total_writeoff; (5) patient_responsibility (calc above);
      # (6) balance = billed - paid - writeoff.
      total_billed_cents   = sum(Charge.billed_amount_cents)
      total_allowed_cents  = sum(RemittanceLine.reported_or_derived_allowed for posted lines)
      total_paid_cents     = sum(Payment.amount_cents)            # PAYER + PATIENT
      total_writeoff_cents = sum(Adjustment.amount_cents) + sum(RemittanceLine.contractual_adjustment_cents)
      patient_responsibility_cents = calc patient_responsibility
      balance_cents        = max(total_billed_cents - total_paid_cents - total_writeoff_cents, 0)
    input_set: "all Charges, Payments, RemittanceLines, Adjustments for the transport"
    constants: {}
    precision: "integer cents; floors at 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /agencies, POST /payer-plans, POST /patients (bootstrap-open)"
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all role-gated endpoints"
  - priority: 3
    category: existence
    check: "path-referenced resource exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all /{id} endpoints"
  - priority: 4
    category: existence
    check: "FK targets in the request body exist (payer_plan_id, patient_id, prior_claim_id, agency_id, transport_id, claim_id)"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /transports, POST /transports/{id}/claims, POST /claims/{id}/remittances, POST /transports/{id}/payments"
  - priority: 5
    category: business_constraint
    check: "required body fields present and well-typed (e.g., loaded_miles, dispatch_iso, origin_modifier, run_number, level_of_service on code)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT"
  - priority: 6
    category: business_constraint
    check: "enum members valid (origin_modifier, destination_modifier, level_of_service, payer_type, outcome, adjustment_type)"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all POST with enum fields"
  - priority: 7
    category: business_constraint
    check: "loaded_miles > 0 (zero or negative loaded mileage rejected — boundary metric)"
    error_id: ERR_INVALID_LOADED_MILES
    http_status: 422
    applies_to: "POST /transports"
  - priority: 8
    category: business_constraint
    check: "run_number unique per agency across non-VOID transports"
    error_id: ERR_DUPLICATE_RUN_NUMBER
    http_status: 409
    applies_to: "POST /transports"
  - priority: 9
    category: state
    check: "target Transport documentation_status admits the requested documentation transition"
    error_id: ERR_INVALID_DOCUMENTATION_STATE
    http_status: 409
    applies_to: "POST /transports/{id}/code, /attest-necessity, /sign-pcs, /return-documentation"
  - priority: 10
    category: state
    check: "target Transport billing_status admits the requested billing transition"
    error_id: ERR_INVALID_BILLING_STATE
    http_status: 409
    applies_to: "POST /transports/{id}/claims, /void"
  - priority: 11
    category: state
    check: "target Claim status admits the requested claim transition; on a primary rebill the existing rank-1 Claim must be in {SUBMITTED, DENIED} and no rank>1 Claim may exist"
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /claims/{id}/remittances, /appeal, /resubmit, AND POST /transports/{id}/claims (primary rebill)"
  - priority: 12
    category: business_safety
    check: "PCS signature authority: sign-pcs requires acting AgencyStaff.pcs_signature_authority == true"
    error_id: ERR_PCS_AUTHORITY_REQUIRED
    http_status: 403
    applies_to: "POST /transports/{id}/sign-pcs"
  - priority: 13
    category: business_safety
    check: "claim creation requires transport.documentation_status == DOCUMENTATION_COMPLETE (cross-dimension guard)"
    error_id: ERR_DOCUMENTATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /transports/{id}/claims"
  - priority: 14
    category: business_safety
    check: "claim creation requires transport.medical_necessity_met == true"
    error_id: ERR_MEDICAL_NECESSITY_NOT_MET
    http_status: 409
    applies_to: "POST /transports/{id}/claims"
  - priority: 15
    category: business_safety
    check: "claim creation requires pcs_signed == true when calc pcs_requirement == REQUIRED"
    error_id: ERR_PCS_MISSING
    http_status: 409
    applies_to: "POST /transports/{id}/claims"
  - priority: 16
    category: business_referential
    check: "named PayerPlan is ACTIVE"
    error_id: ERR_PAYER_PLAN_INACTIVE
    http_status: 409
    applies_to: "POST /transports/{id}/claims"
  - priority: 17
    category: business_referential
    check: "secondary/tertiary claim's prior_claim_id resolves to a PAID or DENIED claim of the same transport"
    error_id: ERR_PRIOR_CLAIM_NOT_ADJUDICATED
    http_status: 409
    applies_to: "POST /transports/{id}/claims"
  - priority: 18
    category: business_referential
    check: "named payer for a secondary/tertiary claim matches the patient coverage entry at policy_rank == sequence_rank"
    error_id: ERR_PAYER_SEQUENCE_MISMATCH
    http_status: 409
    applies_to: "POST /transports/{id}/claims"
  - priority: 19
    category: business_constraint
    check: "DENIED remittance carries a denial_reason; PAID/PARTIAL remittance omits it"
    error_id: ERR_DENIAL_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /claims/{id}/remittances"
  - priority: 20
    category: business_fiscal
    check: "remittance paid_cents <= claim.allowed_amount_cents derived/reported (a payer cannot pay more than it allows)"
    error_id: ERR_PAID_EXCEEDS_ALLOWED
    http_status: 422
    applies_to: "POST /claims/{id}/remittances"
  - priority: 21
    category: business_fiscal
    check: "patient payment amount_cents <= current patient_responsibility_cents (no overpayment of patient balance)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /transports/{id}/payments  (source == PATIENT)"
  - priority: 22
    category: business_fiscal
    check: "CHARITY adjustment requires patient income provided and income% of FPL <= agency threshold"
    error_id: ERR_CHARITY_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /transports/{id}/adjustments  (adjustment_type == CHARITY)"
  - priority: 23
    category: business_fiscal
    check: "BALANCE_BILLING_CAP adjustment only valid when the primary payer is COMMERCIAL/AUTO and balance billing is barred (plan flag false OR agency No-Surprises state)"
    error_id: ERR_BALANCE_BILLING_NOT_PROTECTED
    http_status: 409
    applies_to: "POST /transports/{id}/adjustments  (adjustment_type == BALANCE_BILLING_CAP)"
  - priority: 24
    category: business_fiscal
    check: "discretionary write-off (UNCOLLECTIBLE/GOODWILL) requested_amount_cents <= current patient_responsibility_cents"
    error_id: ERR_WRITEOFF_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /transports/{id}/adjustments  (adjustment_type IN {UNCOLLECTIBLE, GOODWILL})"
  - priority: 25
    category: business_constraint
    check: "OCC: expected_transport_version matches Transport.version on claim creation"
    error_id: ERR_STALE_TRANSPORT_VERSION
    http_status: 412
    applies_to: "POST /transports/{id}/claims"
  - priority: 26
    category: state
    check: "transport import requires the agency.status == ACTIVE"
    error_id: ERR_AGENCY_SUSPENDED
    http_status: 409
    applies_to: "POST /transports"
  - priority: 27
    category: business_constraint
    check: "UnitAssignment window_end_iso strictly after window_start_iso"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /unit-assignments"
  - priority: 28
    category: state
    check: "assigned Vehicle.status == IN_SERVICE and CrewMember.status == ACTIVE"
    error_id: ERR_RESOURCE_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /unit-assignments"
  - priority: 29
    category: business_constraint
    check: "crew certification covers the transport's level_of_service (EMT->BLS; AEMT->BLS,ALS1; PARAMEDIC->any) when the transport is already CODED"
    error_id: ERR_CREW_CERT_INSUFFICIENT
    http_status: 409
    applies_to: "POST /unit-assignments"
  - priority: 30
    category: business_temporal
    check: "Vehicle overlap (CLOSED interval + turnaround buffer): reject if [window_start, window_end + turnaround_minutes] intersects any existing assignment's buffered interval for the same vehicle — boundary-touching at the buffer edge counts as a conflict"
    error_id: ERR_VEHICLE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /unit-assignments"
  - priority: 31
    category: business_temporal
    check: "Crew overlap (HALF-OPEN interval [start, end), no buffer): reject if [window_start, window_end) intersects any existing assignment's [start,end) for the same crew member — back-to-back (end == next start) is allowed"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /unit-assignments"
  - priority: 32
    category: business_constraint
    check: "pagination limit in [1,100] and offset >= 0 on list endpoints"
    error_id: ERR_VALIDATION_PAGINATION
    http_status: 422
    applies_to: "all GET list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Agency ----
  - method: POST
    path: "/agencies"
    description: "Create an EMS agency (bootstrap-open)"
    roles: [BillingAdmin, Anonymous]
    code: 201
    input: [name, npi, state_code, "base_state_is_no_surprises?", "charity_fpl_threshold_pct?"]
    output: Agency
    side_effects: ["Agency created with status=ACTIVE"]
  - method: GET
    path: "/agencies/{id}"
    description: "Fetch an agency"
    roles: [BillingAdmin, Dispatcher, Coder, Biller, ComplianceOfficer]
    code: 200
    input: []
    output: Agency
    side_effects: []
  - method: GET
    path: "/agencies/{id}/staff"
    description: "List staff for an agency (FK reverse-reachability: AgencyStaff.agency_id)"
    roles: [BillingAdmin, ComplianceOfficer, Biller]
    code: 200
    input: ["limit?", "offset?"]
    output: AgencyStaff[]
    side_effects: []

  # ---- AgencyStaff ----
  - method: POST
    path: "/staff"
    description: "Register an agency staff member"
    roles: [BillingAdmin]
    code: 201
    input: [agency_id, full_name, role, "pcs_signature_authority?"]
    output: AgencyStaff
    side_effects: ["AgencyStaff created with status=ACTIVE"]
  - method: GET
    path: "/staff/{id}"
    description: "Fetch a staff member"
    roles: [BillingAdmin, ComplianceOfficer, Biller]
    code: 200
    input: []
    output: AgencyStaff
    side_effects: []

  # ---- PayerPlan ----
  - method: POST
    path: "/payer-plans"
    description: "Create a payer plan (bootstrap-open)"
    roles: [BillingAdmin, Anonymous]
    code: 201
    input: [name, payer_type, "qpa_multiplier?", "allows_balance_billing?"]
    output: PayerPlan
    side_effects: ["PayerPlan created with status=ACTIVE"]
  - method: GET
    path: "/payer-plans/{id}"
    description: "Fetch a payer plan"
    roles: [BillingAdmin, Biller, ComplianceOfficer]
    code: 200
    input: []
    output: PayerPlan
    side_effects: []
  - method: POST
    path: "/payer-plans/{id}/deactivate"
    description: "Deactivate a payer plan (INACTIVE plans cannot be named on new claims)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: PayerPlan
    side_effects: ["PayerPlan.status -> INACTIVE"]

  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "Create a patient with coverage list (bootstrap-open)"
    roles: [BillingAdmin, Dispatcher, Anonymous]
    code: 201
    input: [full_name, date_of_birth, "household_size?", "annual_household_income_cents?", "coverages?"]
    output: Patient
    side_effects: ["Patient created"]
  - method: GET
    path: "/patients/{id}"
    description: "Fetch a patient"
    roles: [BillingAdmin, Dispatcher, Coder, Biller, ComplianceOfficer]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- Vehicle ----
  - method: POST
    path: "/vehicles"
    description: "Register an ambulance unit"
    roles: [BillingAdmin]
    code: 201
    input: [agency_id, unit_call_sign, "turnaround_minutes?"]
    output: Vehicle
    side_effects: ["Vehicle created status=IN_SERVICE"]
  - method: GET
    path: "/vehicles/{id}"
    description: "Fetch a vehicle"
    roles: [BillingAdmin, Dispatcher]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: POST
    path: "/vehicles/{id}/out-of-service"
    description: "Take a vehicle out of service"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["Vehicle.status -> OUT_OF_SERVICE"]
  - method: GET
    path: "/agencies/{id}/vehicles"
    description: "List an agency's vehicles (FK reverse-reachability: Vehicle.agency_id)"
    roles: [BillingAdmin, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # ---- CrewMember ----
  - method: POST
    path: "/crew-members"
    description: "Register a crew member"
    roles: [BillingAdmin]
    code: 201
    input: [agency_id, full_name, certification]
    output: CrewMember
    side_effects: ["CrewMember created status=ACTIVE"]
  - method: GET
    path: "/crew-members/{id}"
    description: "Fetch a crew member"
    roles: [BillingAdmin, Dispatcher]
    code: 200
    input: []
    output: CrewMember
    side_effects: []
  - method: GET
    path: "/agencies/{id}/crew-members"
    description: "List an agency's crew members (FK reverse-reachability: CrewMember.agency_id)"
    roles: [BillingAdmin, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: CrewMember[]
    side_effects: []

  # ---- UnitAssignment (resource scheduling; temporal overlap) ----
  - method: POST
    path: "/unit-assignments"
    description: "Assign a vehicle + crew member to a transport over a time window (overlap-checked)"
    roles: [Dispatcher]
    code: 201
    input: [transport_id, vehicle_id, crew_member_id, window_start_iso, window_end_iso]
    output: UnitAssignment
    side_effects: ["UnitAssignment created after vehicle CLOSED+buffer and crew HALF-OPEN overlap checks"]
  - method: GET
    path: "/unit-assignments/{id}"
    description: "Fetch a unit assignment"
    roles: [BillingAdmin, Dispatcher]
    code: 200
    input: []
    output: UnitAssignment
    side_effects: []
  - method: GET
    path: "/transports/{id}/unit-assignments"
    description: "List a transport's unit assignments (FK reverse-reachability: UnitAssignment.transport_id)"
    roles: [BillingAdmin, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: UnitAssignment[]
    side_effects: []
  - method: GET
    path: "/unit-assignments"
    description: "List unit assignments filterable by vehicle_id or crew_member_id (FK reverse-reachability: UnitAssignment.vehicle_id, UnitAssignment.crew_member_id)"
    roles: [BillingAdmin, Dispatcher]
    code: 200
    input: ["vehicle_id?", "crew_member_id?", "limit?", "offset?"]
    output: UnitAssignment[]
    side_effects: []

  # ---- Transport (dispatch/run import + lifecycle) ----
  - method: POST
    path: "/transports"
    description: "Import a NEMSIS dispatch/run record as a Transport"
    roles: [Dispatcher]
    code: 201
    input: [agency_id, patient_id, run_number, dispatch_iso, origin_modifier, destination_modifier, loaded_miles, "is_rural_pickup?", "emergency_indicator?"]
    output: Transport
    side_effects: ["Transport created documentation_status=IMPORTED, billing_status=UNBILLED"]
  - method: GET
    path: "/transports/{id}"
    description: "Fetch a transport with computed ledger fields"
    roles: [BillingAdmin, Dispatcher, Coder, Biller, ComplianceOfficer]
    code: 200
    input: []
    output: Transport
    side_effects: []
  - method: GET
    path: "/transports"
    description: "List transports, filterable by agency_id or patient_id (FK reverse-reachability for Transport.agency_id and Transport.patient_id)"
    roles: [BillingAdmin, Dispatcher, Coder, Biller, ComplianceOfficer]
    code: 200
    input: ["agency_id?", "patient_id?", "limit?", "offset?"]
    output: Transport[]
    side_effects: []
  - method: POST
    path: "/transports/{id}/code"
    description: "Assign level of service; synthesizes BASE_RATE + MILEAGE charges"
    roles: [Coder]
    code: 200
    input: [level_of_service]
    output: Transport
    side_effects: ["set level_of_service", "resolve_hcpcs_lines", "compute_charge_billed_amount", "create 2 Charges", "reconcile_transport_ledger", "documentation_status IMPORTED->CODED"]
  - method: POST
    path: "/transports/{id}/attest-necessity"
    description: "Coder attests medical necessity (CODED/RETURNED -> NECESSITY_REVIEW)"
    roles: [Coder]
    code: 200
    input: []
    output: Transport
    side_effects: ["set medical_necessity_met=true", "documentation_status -> NECESSITY_REVIEW"]
  - method: POST
    path: "/transports/{id}/sign-pcs"
    description: "Compliance records PCS signature and completes documentation (NECESSITY_REVIEW -> DOCUMENTATION_COMPLETE)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Transport
    side_effects: ["evaluate pcs_requirement", "if REQUIRED set pcs_signed=true", "documentation_status -> DOCUMENTATION_COMPLETE"]
  - method: POST
    path: "/transports/{id}/return-documentation"
    description: "Compliance returns documentation for revision (NECESSITY_REVIEW -> RETURNED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Transport
    side_effects: ["set medical_necessity_met=false", "documentation_status -> RETURNED"]
  - method: POST
    path: "/transports/{id}/void"
    description: "Void an unbilled transport (frees run_number)"
    roles: [Biller]
    code: 200
    input: []
    output: Transport
    side_effects: ["delete Charges", "billing_status -> VOID", "total_billed_cents -> 0"]

  # ---- Charge (read-only; synthesized by coding) ----
  - method: GET
    path: "/transports/{id}/charges"
    description: "List a transport's charges (FK reverse-reachability: Charge.transport_id)"
    roles: [BillingAdmin, Coder, Biller, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Charge[]
    side_effects: []

  # ---- Claim ----
  - method: POST
    path: "/transports/{id}/claims"
    description: "Submit a claim to the next payer in sequence (primary moves billing_status to BILLING_IN_PROGRESS)"
    roles: [Biller]
    code: 201
    input: [payer_plan_id, "prior_claim_id?", expected_transport_version]
    output: Claim
    side_effects: ["create Claim status=SUBMITTED", "set billed_amount_cents", "cob_prior_paid -> prior_paid_cents", "set sequence_rank", "billing_status UNBILLED->BILLING_IN_PROGRESS on primary", "increments Transport.version by 1"]
  - method: GET
    path: "/claims/{id}"
    description: "Fetch a claim"
    roles: [BillingAdmin, Biller, ComplianceOfficer]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/transports/{id}/claims"
    description: "List a transport's claims in sequence (FK reverse-reachability: Claim.transport_id)"
    roles: [BillingAdmin, Biller, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/claims"
    description: "List claims filterable by prior_claim_id (FK reverse-reachability: Claim.prior_claim_id self-reference)"
    roles: [BillingAdmin, Biller, ComplianceOfficer]
    code: 200
    input: ["prior_claim_id?", "payer_plan_id?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/appeal"
    description: "Appeal a denied claim (DENIED -> APPEALED)"
    roles: [Biller]
    code: 200
    input: []
    output: Claim
    side_effects: ["status DENIED->APPEALED"]
  - method: POST
    path: "/claims/{id}/resubmit"
    description: "Resubmit an appealed claim (APPEALED -> SUBMITTED)"
    roles: [Biller]
    code: 200
    input: []
    output: Claim
    side_effects: ["reset allowed/paid", "status APPEALED->SUBMITTED"]

  # ---- RemittanceLine (adjudication) ----
  - method: POST
    path: "/claims/{id}/remittances"
    description: "Post an 835 remittance line adjudicating a submitted claim"
    roles: [Biller]
    code: 201
    input: [outcome, paid_cents, "reported_allowed_cents?", "denial_reason?"]
    output: RemittanceLine
    side_effects: ["adjudicated_allowed", "set claim allowed/paid", "create PAYER Payment on PAID/PARTIAL", "contractual_adjustment", "claim SUBMITTED->PAID/DENIED", "cascade: reconcile_transport_ledger + advance billing dimension"]
  - method: GET
    path: "/claims/{id}/remittances"
    description: "List remittance lines for a claim (FK reverse-reachability: RemittanceLine.claim_id)"
    roles: [BillingAdmin, Biller, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: RemittanceLine[]
    side_effects: []

  # ---- Payment ----
  - method: POST
    path: "/transports/{id}/payments"
    description: "Post a payment (PAYER attributed to a claim, or direct PATIENT payment)"
    roles: [Biller]
    code: 201
    input: [source, amount_cents, "claim_id?"]
    output: Payment
    side_effects: ["create Payment", "reconcile_transport_ledger", "patient_responsibility recompute", "advance billing dimension to CLOSED if balance reaches 0"]
  - method: GET
    path: "/transports/{id}/payments"
    description: "List a transport's payments (FK reverse-reachability: Payment.transport_id)"
    roles: [BillingAdmin, Biller, ComplianceOfficer]
    code: 200
    input: ["claim_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/payments/{id}"
    description: "Fetch a payment"
    roles: [BillingAdmin, Biller, ComplianceOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/payments"
    description: "List payments filterable by claim_id (FK reverse-reachability: Payment.claim_id) or transport_id"
    roles: [BillingAdmin, Biller, ComplianceOfficer]
    code: 200
    input: ["claim_id?", "transport_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- Adjustment (write-off / charity) ----
  - method: POST
    path: "/transports/{id}/adjustments"
    description: "Apply a write-off: CHARITY / UNCOLLECTIBLE / BALANCE_BILLING_CAP / GOODWILL"
    roles: [ComplianceOfficer, BillingAdmin]
    code: 201
    input: [adjustment_type, "requested_amount_cents?"]
    output: Adjustment
    side_effects: ["compute amount_cents per type (charity_writeoff / cap / requested)", "reconcile_transport_ledger", "patient_responsibility recompute", "advance billing dimension to CLOSED if balance reaches 0"]
  - method: GET
    path: "/transports/{id}/adjustments"
    description: "List a transport's adjustments (FK reverse-reachability: Adjustment.transport_id)"
    roles: [BillingAdmin, ComplianceOfficer, Biller]
    code: 200
    input: ["limit?", "offset?"]
    output: Adjustment[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http: 404, condition: "Body FK target (payer_plan_id, patient_id, prior_claim_id, agency_id, claim_id) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Required field missing or wrong type" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries a value outside its allowed set" }
  - { id: ERR_INVALID_LOADED_MILES, http: 422, condition: "loaded_miles <= 0 on transport import (boundary: 0 rejected, smallest positive accepted)" }
  - { id: ERR_DUPLICATE_RUN_NUMBER, http: 409, condition: "run_number already used by a non-VOID transport of the same agency" }
  - { id: ERR_INVALID_DOCUMENTATION_STATE, http: 409, condition: "Transport documentation_status does not admit the requested documentation transition (includes recode after billing started)" }
  - { id: ERR_INVALID_BILLING_STATE, http: 409, condition: "Transport billing_status does not admit the requested billing transition" }
  - { id: ERR_INVALID_CLAIM_STATE, http: 409, condition: "Claim status does not admit the requested claim transition" }
  - { id: ERR_PCS_AUTHORITY_REQUIRED, http: 403, condition: "sign-pcs attempted by staff without pcs_signature_authority" }
  - { id: ERR_DOCUMENTATION_INCOMPLETE, http: 409, condition: "Claim creation attempted before documentation_status == DOCUMENTATION_COMPLETE" }
  - { id: ERR_MEDICAL_NECESSITY_NOT_MET, http: 409, condition: "Claim creation attempted with medical_necessity_met == false" }
  - { id: ERR_PCS_MISSING, http: 409, condition: "Claim creation attempted with pcs_requirement REQUIRED but pcs_signed == false" }
  - { id: ERR_PAYER_PLAN_INACTIVE, http: 409, condition: "Named payer plan is INACTIVE" }
  - { id: ERR_PRIOR_CLAIM_NOT_ADJUDICATED, http: 409, condition: "Secondary/tertiary claim prior_claim_id is not a PAID/DENIED claim of the same transport" }
  - { id: ERR_PAYER_SEQUENCE_MISMATCH, http: 409, condition: "Named payer does not match patient coverage entry at the expected policy_rank" }
  - { id: ERR_DENIAL_REASON_REQUIRED, http: 422, condition: "DENIED remittance missing denial_reason, or PAID/PARTIAL remittance carries one" }
  - { id: ERR_PAID_EXCEEDS_ALLOWED, http: 422, condition: "Remittance paid_cents exceeds the claim's allowed amount" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Patient payment exceeds current patient_responsibility_cents" }
  - { id: ERR_CHARITY_INCOME_REQUIRED, http: 422, condition: "CHARITY adjustment requested but patient annual_household_income_cents is null" }
  - { id: ERR_CHARITY_NOT_QUALIFIED, http: 409, condition: "Patient income% of FPL exceeds agency charity_fpl_threshold_pct" }
  - { id: ERR_BALANCE_BILLING_NOT_PROTECTED, http: 409, condition: "BALANCE_BILLING_CAP adjustment requested when No-Surprises protection does not apply" }
  - { id: ERR_WRITEOFF_EXCEEDS_BALANCE, http: 422, condition: "UNCOLLECTIBLE/GOODWILL requested_amount_cents exceeds current patient_responsibility_cents" }
  - { id: ERR_STALE_TRANSPORT_VERSION, http: 412, condition: "expected_transport_version on claim creation does not match the current Transport.version" }
  - { id: ERR_AGENCY_SUSPENDED, http: 409, condition: "Transport import attempted under a SUSPENDED agency" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "UnitAssignment window_end_iso not strictly after window_start_iso" }
  - { id: ERR_RESOURCE_OUT_OF_SERVICE, http: 409, condition: "Assigned Vehicle is OUT_OF_SERVICE or CrewMember is INACTIVE" }
  - { id: ERR_CREW_CERT_INSUFFICIENT, http: 409, condition: "Crew certification does not cover the transport's coded level_of_service" }
  - { id: ERR_VEHICLE_DOUBLE_BOOKED, http: 409, condition: "Vehicle assignment window (closed interval + turnaround buffer) intersects an existing assignment for the same vehicle" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Crew assignment window (half-open interval) intersects an existing assignment for the same crew member" }
  - { id: ERR_VALIDATION_PAGINATION, http: 422, condition: "limit/offset outside [1,100]/[0,inf) bounds" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BillingAdmin
    description: "Operational superuser: bootstraps agencies/plans/patients/staff, applies discretionary write-offs, reads everything"
    identity: "opaque"
    exclusive_operations:
      - "POST /staff"
      - "POST /payer-plans/{id}/deactivate"
      - "POST /vehicles"
      - "POST /vehicles/{id}/out-of-service"
      - "POST /crew-members"
    shared_operations:
      - "POST /agencies"
      - "POST /payer-plans"
      - "POST /patients"
      - "POST /transports/{id}/adjustments"
      - "GET (all read endpoints)"
  - name: Dispatcher
    description: "Imports NEMSIS dispatch/run records as Transports; schedules vehicle + crew unit assignments"
    identity: "entity_backed:AgencyStaff"
    exclusive_operations:
      - "POST /transports"
      - "POST /unit-assignments"
    shared_operations:
      - "POST /patients"
      - "GET /transports, GET /transports/{id}, GET /patients/{id}, GET /agencies/{id}, GET /vehicles/{id}, GET /crew-members/{id}, GET /agencies/{id}/vehicles, GET /agencies/{id}/crew-members, GET /unit-assignments, GET /unit-assignments/{id}, GET /transports/{id}/unit-assignments"
  - name: Coder
    description: "Assigns level of service, synthesizes charges, attests medical necessity"
    identity: "entity_backed:AgencyStaff"
    exclusive_operations:
      - "POST /transports/{id}/code"
      - "POST /transports/{id}/attest-necessity"
    shared_operations:
      - "GET /transports/{id}, GET /transports/{id}/charges, GET /patients/{id}"
  - name: Biller
    description: "Submits claims, posts remittances/payments, manages appeals and voids"
    identity: "entity_backed:AgencyStaff"
    exclusive_operations:
      - "POST /transports/{id}/claims"
      - "POST /transports/{id}/void"
      - "POST /claims/{id}/remittances"
      - "POST /claims/{id}/appeal"
      - "POST /claims/{id}/resubmit"
      - "POST /transports/{id}/payments"
    shared_operations:
      - "GET /claims, GET /claims/{id}, GET /transports/{id}/claims, GET /claims/{id}/remittances, GET /transports/{id}/payments"
  - name: ComplianceOfficer
    description: "Signs PCS, returns documentation, applies charity/cap/uncollectible write-offs"
    identity: "entity_backed:AgencyStaff"
    exclusive_operations:
      - "POST /transports/{id}/sign-pcs"
      - "POST /transports/{id}/return-documentation"
    shared_operations:
      - "POST /transports/{id}/adjustments"
      - "GET /transports/{id}, GET /transports/{id}/charges, GET /transports/{id}/adjustments"
