          trigger:
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${n1}", "${n2}", "${n3}", "${n4}", "${n5}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_id: $.data.id, hours: $.data.required_station_hours }
          assert:
            - "hours == 47.47 exactly (41.10 * 1.05 * 1.10 = 47.4705)"
            - "hours != 47.48, which is what per-factor rounding (43.155 -> 43.16, then * 1.10 = 47.476) would produce"
            - "UnitOrder.${ord_id}.config_weight_lbs == 6000 and total_amp_draw == 0, so no surcharge distorts the comparison"
            - "UnitOrder.${ord_id}.option_price_total_cents == 500000"

