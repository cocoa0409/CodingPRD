          assert:
            - "second reschedule on b1 with the originally observed version: HTTP 412, error_id == ERR_STALE_VERSION (not ERR_INVALID_STATE although b1 is RESCHEDULED)"
            - "successor b2 remains CONFIRMED; slot s4 remains OPEN"

      - name: run_ops_auto_no_show_boundary
        claim_type: ops_run_checkpoint
        grounds: ["endpoints[POST /conf/windows/{id}/run-ops]", "calculations.no_show_strike_restriction"]
