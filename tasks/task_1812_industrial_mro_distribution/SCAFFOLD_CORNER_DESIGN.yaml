              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "VM-1", description: "Vendor part", item_class: "STOCKED", list_price_cents: 1000, drop_ship_eligible: true, vendor_cost_estimate_cents: 500, vendor_freight_estimate_cents: 100 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-VM", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "STANDARD", lines: [{ item_id: "${it_id}", qty: 1 }] }
              as: DistributionAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /mro/orders/${ord_id}/confirm"
              as: DistributionAdmin
          trigger:
            - call: "POST /mro/orders/${ord_id}/vendor-confirm"
              payload: { actual_costs: [] }
              as: VendorRep
              captures: { err: $.data.error_id }
