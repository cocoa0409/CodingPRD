              as_user_id: "${m_id}"
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", location_id: "${loc_id}", room_id: "${room_id}", starts_at: "2026-06-15T10:00:00Z", expected_room_version: "${room_v0}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /rooms/${room_id}"
              payload: {}
              as: LocationManager
              captures: { room_v1: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", location_id: "${loc_id}", room_id: "${room_id}", starts_at: "2026-06-15T10:39:00Z", expected_room_version: "${room_v1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROOM_UNAVAILABLE (10:39 lies inside the [10:00,10:40) buffered interval)"

      - name: technician_shift_overlap_zero_buffer
        grounds:
          - validations[priority=16]
          - entities.TechnicianShift.fields.starts_at
          - errors[ERR_SHIFT_OVERLAP]
          - endpoints["POST /technicians/{technician_id}/shifts"]
        distinguishing_aspect: |
          Shift interval semantics use ZERO buffer half-open [starts_at,ends_at):
          a new shift [12:00,16:00) overlaps an existing [09:00,13:00) shift of
          the SAME technician (a DIFFERENT resource entity than Room) and is
          rejected ERR_SHIFT_OVERLAP, while an exactly-adjacent [13:00,...) shift
          would be accepted.
        test_recipe:
          setup:
            - "Technician with one SCHEDULED shift [2026-06-15T09:00,13:00)."
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "Austin", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/technicians"
              payload: { full_name: "Tech Z" }
              as: LocationManager
              captures: { tech_id: $.data.id }
            - call: "POST /technicians/${tech_id}/shifts"
              payload: { location_id: "${loc_id}", starts_at: "2026-06-15T09:00:00Z", ends_at: "2026-06-15T13:00:00Z" }
              as: LocationManager
          trigger:
            - call: "POST /technicians/${tech_id}/shifts"
              payload: { location_id: "${loc_id}", starts_at: "2026-06-15T12:00:00Z", ends_at: "2026-06-15T16:00:00Z" }
              as: LocationManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SHIFT_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: book_then_free_cancel_conserves_member_credits
        grounds:
          - state_machines.Booking.transitions.BOOKED_to_CANCELLED
          - calculations.booking_credit_debit
          - calculations.member_credit_balance
          - entities.Member.fields.credit_balance
          - endpoints["POST /bookings/{booking_id}/cancel"]
        distinguishing_aspect: |
          Conserved quantity #1 = Member.credit_balance. Forward action POST
          /bookings debits 1 credit (balance 4->3); the compensating free cancel
          (notice >= 240) refunds it (balance 3->4), leaving credit_balance == 4
          exactly, with fee_charged_cents == 0.
        test_recipe:
          setup:
            - "BASE sub grant 4; member waiver; COMPRESSION room; covering shift; clock 2026-06-15T00:00:00Z; booking at 2026-06-16T10:00:00Z (notice 34h >= 240 min)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASE", monthly_fee_cents: 9900, monthly_credit_grant: 4, rollover_cap: 0 }
              as: PlatformAdmin
              captures: { base_plan_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "COMPRESSION", name: "Compression", duration_minutes: 30, buffer_minutes: 0, credit_cost: 1, requires_medical_clearance: false }
              as: PlatformAdmin
              captures: { svc_comp_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Austin", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/rooms"
              payload: { service_type_id: "${svc_comp_id}", name: "Compression 1" }
              as: LocationManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /locations/${loc_id}/technicians"
              payload: { full_name: "Tech I" }
              as: LocationManager
              captures: { tech_id: $.data.id }
            - call: "POST /technicians/${tech_id}/shifts"
              payload: { location_id: "${loc_id}", starts_at: "2026-06-16T08:00:00Z", ends_at: "2026-06-16T18:00:00Z" }
              as: LocationManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "cons@x.com", full_name: "Cons Member", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/waivers"
              payload: { screening_answers: { heart: false }, has_contraindication: false }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /members/${m_id}/subscription"
              payload: { plan_id: "${base_plan_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", location_id: "${loc_id}", room_id: "${room_id}", starts_at: "2026-06-16T10:00:00Z", expected_room_version: "${room_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { booking_id: $.data.id, charged: $.data.credits_charged }
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { fee: $.data.fee_charged_cents, st: $.data.status }
          assert:
            - "Booking.${booking_id}.fee_charged_cents == 0 (notice >= 240 min)"
            - "Member.${m_id}.credit_balance == 4 (debit of 1 fully compensated by refund)"

      - name: book_then_cancel_conserves_open_booking_count
        grounds:
          - state_machines.Booking.transitions.BOOKED_to_CANCELLED
          - entities.Location.fields.open_booking_count
          - endpoints["POST /bookings"]
          - endpoints["POST /bookings/{booking_id}/cancel"]
        distinguishing_aspect: |
          Conserved quantity #2 (DIFFERENT type) = Location.open_booking_count.
          Forward action POST /bookings increments it (0->1); the compensating
          cancel decrements it (1->0), leaving open_booking_count == 0 exactly.
        test_recipe:
          setup:
