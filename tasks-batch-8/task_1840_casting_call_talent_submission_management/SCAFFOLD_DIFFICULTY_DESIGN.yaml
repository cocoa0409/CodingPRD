# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rule_ids x 2 instances = 18 non-stub instances.
scaffold_difficulty_design:

  # ==========================================================================
  # Rule 1 — dual_variant_calc (two different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: proration_calendar_vs_workday_span
        grounds:
          - calculations.engagement_fee_proration
          - entities.DealMemo.fields.computed_fee_cents
        distinguishing_aspect: |
          Same engagement span (Fri 2026-08-07 .. Tue 2026-08-11) and same
          weekly rate produce two different frozen fees on the DealMemo entity
          domain depending solely on proration_mode: CALENDAR_SPAN counts the
          weekend (5 paid days), WORKDAY_SPAN excludes it (3 paid days).
        test_recipe:
          setup:
            - "Production P (union_signatory=true) in CASTING"
            - "Role R (is_minor_role=false, is_union_covered=true, span inside production)"
            - "Breakdown B released OPEN, deadline 2026-09-01"
            - "Talent T (adult, UNION_MEMBER) submitted and advanced to CALLBACK_COMPLETED"
            - "Two offers O1 and O2 on TWO separate submissions of T (different breakdowns) each weekly_rate_cents=1000000, guarantee_cents=800000"
            - "clock pinned at 2026-08-03T00:00:00Z for setup"
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "P", production_type: "FILM", union_signatory: true, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { prod_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/roles"
              payload: { character_name: "R", is_minor_role: false, is_union_covered: true, engagement_start: "2026-08-07T00:00:00Z", engagement_end: "2026-08-11T00:00:00Z" }
              as: CastingDirector
              captures: { role_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/breakdowns"
              payload: { role_id: "${role_id}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { br_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
              captures: { br_v: $.data.version }
            - call: "POST /casting/talents"
              payload: { full_name: "T", date_of_birth: "1990-01-01T00:00:00Z", union_status: "UNION_MEMBER" }
              as: CastingDirector
              captures: { tal_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${tal_id}", expected_breakdown_version: "${br_v}" }
              as: CastingAssociate
              captures: { sub_id: $.data.id }
            # Advance submission to CALLBACK_COMPLETED via a session+appointment
            - call: "POST /casting/submissions/${sub_id}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/shortlist"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/breakdowns/${br_id}/sessions"
              payload: { session_start: "2026-08-04T09:00:00Z", session_end: "2026-08-04T12:00:00Z", capacity: 4, location: "Studio 1" }
              as: CastingAssociate
              captures: { sess_id: $.data.id }
            - call: "POST /casting/sessions/${sess_id}/appointments"
              payload: { submission_id: "${sub_id}", slot_start: "2026-08-04T09:00:00Z", slot_end: "2026-08-04T09:30:00Z" }
              as: CastingAssociate
              captures: { appt_id: $.data.id }
            - call: "POST /casting/appointments/${appt_id}/confirm"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T13:00:00Z" }
              as: CastingDirector
            - call: "POST /casting/appointments/${appt_id}/complete"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/offers"
              payload: { weekly_rate_cents: 1000000, guarantee_cents: 800000, expires_at: "2026-08-10T00:00:00Z" }
              as: CastingDirector
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /casting/offers/${offer_id}/accept"
              payload: { engagement_start: "2026-08-07T00:00:00Z", engagement_end: "2026-08-11T00:00:00Z", proration_mode: "CALENDAR_SPAN" }
              as: CastingDirector
              captures: { memo_id: $.data.id, fee_calendar: $.data.computed_fee_cents }
          assert:
            - "DealMemo.${memo_id}.computed_fee_cents == 1000000 (5 calendar days * 200000 daily rate)"
            - "DealMemo.${memo_id}.status == EXECUTED"

      - name: proration_workday_span_smaller_fee
        grounds:
          - calculations.engagement_fee_proration
          - entities.DealMemo.fields.computed_fee_cents
        distinguishing_aspect: |
          Identical span and rate to proration_calendar_vs_workday_span but
          proration_mode=WORKDAY_SPAN yields a strictly smaller frozen fee
          (3 weekdays * 200000 = 600000 vs 1000000), proving the two variants
          diverge on the DealMemo domain.
        test_recipe:
          setup:
            - "Identical reachable state as the CALENDAR_SPAN instance but the accept call uses WORKDAY_SPAN"
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "P2", production_type: "TV_SERIES", union_signatory: true, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { prod_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/roles"
              payload: { character_name: "R2", is_minor_role: false, is_union_covered: true, engagement_start: "2026-08-07T00:00:00Z", engagement_end: "2026-08-11T00:00:00Z" }
              as: CastingDirector
              captures: { role_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/breakdowns"
              payload: { role_id: "${role_id}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { br_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
              captures: { br_v: $.data.version }
            - call: "POST /casting/talents"
              payload: { full_name: "T2", date_of_birth: "1990-01-01T00:00:00Z", union_status: "UNION_MEMBER" }
              as: CastingDirector
              captures: { tal_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${tal_id}", expected_breakdown_version: "${br_v}" }
              as: CastingAssociate
              captures: { sub_id: $.data.id }
            - call: "POST /casting/submissions/${sub_id}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/shortlist"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/breakdowns/${br_id}/sessions"
              payload: { session_start: "2026-08-04T09:00:00Z", session_end: "2026-08-04T12:00:00Z", capacity: 4, location: "Studio 1" }
              as: CastingAssociate
              captures: { sess_id: $.data.id }
            - call: "POST /casting/sessions/${sess_id}/appointments"
              payload: { submission_id: "${sub_id}", slot_start: "2026-08-04T09:00:00Z", slot_end: "2026-08-04T09:30:00Z" }
              as: CastingAssociate
              captures: { appt_id: $.data.id }
            - call: "POST /casting/appointments/${appt_id}/confirm"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T13:00:00Z" }
              as: CastingDirector
            - call: "POST /casting/appointments/${appt_id}/complete"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/offers"
              payload: { weekly_rate_cents: 1000000, guarantee_cents: 800000, expires_at: "2026-08-10T00:00:00Z" }
              as: CastingDirector
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /casting/offers/${offer_id}/accept"
              payload: { engagement_start: "2026-08-07T00:00:00Z", engagement_end: "2026-08-11T00:00:00Z", proration_mode: "WORKDAY_SPAN" }
              as: CastingDirector
              captures: { memo_id: $.data.id, fee_workday: $.data.computed_fee_cents }
          assert:
            - "DealMemo.${memo_id}.computed_fee_cents == 600000 (3 weekdays * 200000)"
            - "600000 < 1000000 (WORKDAY_SPAN strictly smaller than CALENDAR_SPAN for the same span)"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (two DIFFERENT modes: (a) and (b))
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cancellation_penalty_tiered_threshold_mode_a
        grounds:
          - calculations.cancellation_penalty_tier
          - entities.DealMemo.fields.cancellation_penalty_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear tier selection. days_out is computed
          from clock vs engagement_start, then a 4-branch tier pick (0/25/50/100%),
          then multiplied by guarantee. Boundary at days_out==7 (inclusive -> 25%)
          vs days_out==6 (-> 50%) is exercised.
        test_recipe:
          setup:
            - "Production, union-covered role, adult union talent, CALLBACK_COMPLETED submission"
            - "Offer weekly 1000000, guarantee 800000, ACCEPTED with CALENDAR_SPAN memo, engagement_start=2026-08-20"
            - "Booking created and CONFIRMED on 2026-08-03"
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "CP", production_type: "FILM", union_signatory: true, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { prod_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/roles"
              payload: { character_name: "CR", is_minor_role: false, is_union_covered: true, engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z" }
              as: CastingDirector
              captures: { role_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/breakdowns"
              payload: { role_id: "${role_id}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { br_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
              captures: { br_v: $.data.version }
            - call: "POST /casting/talents"
              payload: { full_name: "CT", date_of_birth: "1990-01-01T00:00:00Z", union_status: "UNION_MEMBER" }
              as: CastingDirector
              captures: { tal_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${tal_id}", expected_breakdown_version: "${br_v}" }
              as: CastingAssociate
              captures: { sub_id: $.data.id }
            - call: "POST /casting/submissions/${sub_id}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/shortlist"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/breakdowns/${br_id}/sessions"
              payload: { session_start: "2026-08-04T09:00:00Z", session_end: "2026-08-04T12:00:00Z", capacity: 4, location: "Studio 1" }
              as: CastingAssociate
              captures: { sess_id: $.data.id }
            - call: "POST /casting/sessions/${sess_id}/appointments"
              payload: { submission_id: "${sub_id}", slot_start: "2026-08-04T09:00:00Z", slot_end: "2026-08-04T09:30:00Z" }
              as: CastingAssociate
              captures: { appt_id: $.data.id }
            - call: "POST /casting/appointments/${appt_id}/confirm"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T13:00:00Z" }
              as: CastingDirector
            - call: "POST /casting/appointments/${appt_id}/complete"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/offers"
              payload: { weekly_rate_cents: 1000000, guarantee_cents: 800000, expires_at: "2026-08-10T00:00:00Z" }
              as: CastingDirector
              captures: { offer_id: $.data.id }
            - call: "POST /casting/offers/${offer_id}/accept"
              payload: { engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z", proration_mode: "CALENDAR_SPAN" }
              as: CastingDirector
              captures: { memo_id: $.data.id }
            - call: "POST /casting/bookings"
              payload: { submission_id: "${sub_id}", deal_memo_id: "${memo_id}" }
              as: ProductionCoordinator
              captures: { booking_id: $.data.id }
            - call: "POST /casting/bookings/${booking_id}/confirm"
              payload: {}
              as: ProductionCoordinator
            # Move clock to 2026-08-13 => days_out = 7 => 25% tier
            - call: "POST /casting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: CastingDirector
          trigger:
            - call: "POST /casting/bookings/${booking_id}/cancel"
              payload: { cancellation_reason: "PRODUCTION_CANCELLED" }
              as: ProductionCoordinator
          assert:
            - "DealMemo.${memo_id}.cancellation_penalty_cents == 200000 (days_out == 7 falls INCLUSIVE into the 25% tier, not the 0% tier)"
            - "Booking.${booking_id}.status == CANCELLED"

      - name: cancellation_penalty_late_100pct_mode_b_rounding
        grounds:
          - calculations.cancellation_penalty_tier
          - calculations.engagement_fee_proration
        distinguishing_aspect: |
          Mode (b): evaluation/rounding order pinned — guarantee resolved FIRST
          from the Offer behind the DealMemo, tier picked SECOND, integer
          multiply/divide LAST. At days_out==1 the 100% tier returns the full
          800000 guarantee with zero rounding remainder, proving order pins the
          exact cent value rather than an approximate.
        test_recipe:
          setup:
            - "Same reachable state as cancellation_penalty_tiered_threshold_mode_a but clock advanced to 2026-08-19 (days_out == 1)"
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "CP2", production_type: "FILM", union_signatory: true, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { prod_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/roles"
              payload: { character_name: "CR2", is_minor_role: false, is_union_covered: true, engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z" }
              as: CastingDirector
              captures: { role_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/breakdowns"
              payload: { role_id: "${role_id}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { br_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
              captures: { br_v: $.data.version }
            - call: "POST /casting/talents"
              payload: { full_name: "CT2", date_of_birth: "1990-01-01T00:00:00Z", union_status: "UNION_MEMBER" }
              as: CastingDirector
              captures: { tal_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${tal_id}", expected_breakdown_version: "${br_v}" }
              as: CastingAssociate
              captures: { sub_id: $.data.id }
            - call: "POST /casting/submissions/${sub_id}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/shortlist"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/breakdowns/${br_id}/sessions"
              payload: { session_start: "2026-08-04T09:00:00Z", session_end: "2026-08-04T12:00:00Z", capacity: 4, location: "Studio 1" }
              as: CastingAssociate
              captures: { sess_id: $.data.id }
            - call: "POST /casting/sessions/${sess_id}/appointments"
              payload: { submission_id: "${sub_id}", slot_start: "2026-08-04T09:00:00Z", slot_end: "2026-08-04T09:30:00Z" }
              as: CastingAssociate
              captures: { appt_id: $.data.id }
            - call: "POST /casting/appointments/${appt_id}/confirm"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T13:00:00Z" }
              as: CastingDirector
            - call: "POST /casting/appointments/${appt_id}/complete"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/offers"
              payload: { weekly_rate_cents: 1000000, guarantee_cents: 800000, expires_at: "2026-08-10T00:00:00Z" }
              as: CastingDirector
              captures: { offer_id: $.data.id }
            - call: "POST /casting/offers/${offer_id}/accept"
              payload: { engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z", proration_mode: "CALENDAR_SPAN" }
              as: CastingDirector
              captures: { memo_id: $.data.id }
            - call: "POST /casting/bookings"
              payload: { submission_id: "${sub_id}", deal_memo_id: "${memo_id}" }
              as: ProductionCoordinator
              captures: { booking_id: $.data.id }
            - call: "POST /casting/bookings/${booking_id}/confirm"
              payload: {}
              as: ProductionCoordinator
            - call: "POST /casting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-19T00:00:00Z" }
              as: CastingDirector
          trigger:
            - call: "POST /casting/bookings/${booking_id}/cancel"
              payload: { cancellation_reason: "TALENT_CANCELLED" }
              as: ProductionCoordinator
          assert:
            - "DealMemo.${memo_id}.cancellation_penalty_cents == 800000 (days_out == 1 -> 100% tier, exact integer result with no rounding remainder)"
            - "Booking.${booking_id}.cancellation_reason == TALENT_CANCELLED"

  # ==========================================================================
  # Rule 3 — non_linear_state_machine (two DIFFERENT entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_cyclic_negotiation_rounds
        grounds:
          - state_machines.Offer.EXTENDED_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_COUNTERED
        distinguishing_aspect: |
          Offer is a cyclic machine: the office/agent counter loop creates a new
          EXTENDED round each cycle and can iterate EXTENDED->COUNTERED->(new
          EXTENDED)->COUNTERED repeatedly until accept/decline/expiry, on the
          Offer entity.
        test_recipe:
          setup:
            - "Submission at OFFER_PENDING with round-1 offer EXTENDED (weekly 1000000)"
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "NP", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { prod_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/roles"
              payload: { character_name: "NR", is_minor_role: false, is_union_covered: false, engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z" }
              as: CastingDirector
              captures: { role_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/breakdowns"
              payload: { role_id: "${role_id}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { br_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
              captures: { br_v: $.data.version }
            - call: "POST /casting/agents"
              payload: { agency_name: "Agency A", contact_email: "a@x.com", franchise_status: "FRANCHISED", active: true }
              as: CastingDirector
              captures: { agent_id: $.data.id }
            - call: "POST /casting/talents"
              payload: { full_name: "NT", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION", agent_id: "${agent_id}" }
              as: CastingDirector
              captures: { tal_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${tal_id}", agent_id: "${agent_id}", expected_breakdown_version: "${br_v}" }
              as: Agent
              as_user_id: "${agent_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /casting/submissions/${sub_id}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/shortlist"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/breakdowns/${br_id}/sessions"
              payload: { session_start: "2026-08-04T09:00:00Z", session_end: "2026-08-04T12:00:00Z", capacity: 4, location: "Studio 1" }
              as: CastingAssociate
              captures: { sess_id: $.data.id }
            - call: "POST /casting/sessions/${sess_id}/appointments"
              payload: { submission_id: "${sub_id}", slot_start: "2026-08-04T09:00:00Z", slot_end: "2026-08-04T09:30:00Z" }
              as: CastingAssociate
              captures: { appt_id: $.data.id }
            - call: "POST /casting/appointments/${appt_id}/confirm"
              payload: {}
              as: Agent
              as_user_id: "${agent_id}"
            - call: "POST /casting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T13:00:00Z" }
              as: CastingDirector
            - call: "POST /casting/appointments/${appt_id}/complete"
              payload: {}
              as: CastingAssociate
