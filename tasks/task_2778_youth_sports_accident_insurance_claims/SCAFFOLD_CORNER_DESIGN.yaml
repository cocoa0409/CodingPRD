            - "trigger 10 returns HTTP 409 with data.error_id == ERR_INVALID_PAYMENT_STATE and void_reason is still the trigger-9 reason, not the trigger-10 one"
            - "LeaguePolicy paid_loss_cents returns to 0 after trigger 9 while reserve_cents is 250000 again, so incurred_loss_cents is 250000"

      - name: duplicate_and_stale_enrollment_or_family_plan_actions_are_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_ENROLLMENT
          - errors.ERR_OPEN_CLAIMS_ON_ENROLLMENT
          - errors.ERR_INVALID_ENROLLMENT_STATE
          - errors.ERR_INVALID_FAMILY_PLAN_STATE
        distinguishing_aspect: "Two enrollments on one policy separate the three enrollment refusals that are easy to conflate: the athlete who is still enrolled cannot be enrolled twice (ERR_DUPLICATE_ENROLLMENT), the athlete with an open claim cannot be withdrawn at all (ERR_OPEN_CLAIMS_ON_ENROLLMENT), and the athlete already withdrawn refuses both a second withdrawal and any new injury report with ERR_INVALID_ENROLLMENT_STATE. The family plan adds the fourth code: its verification decision is terminal on first use."
        test_recipe:
          setup:
            - "One league, one BASEBALL_U12 classification and one ACTIVE policy for 404 participants (annual premium 822840)."
            - "Athletes A and B are both ENROLLED; athlete A also has one UNVERIFIED FamilyHealthPlan."
            - "One SANCTIONED game covers both athletes; athlete A has a VERIFIED MODERATE report, so exactly one Claim is open in PENDING_COORDINATION with reserve 250000 (incurred ratio 3038 bps, posture OPEN)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
