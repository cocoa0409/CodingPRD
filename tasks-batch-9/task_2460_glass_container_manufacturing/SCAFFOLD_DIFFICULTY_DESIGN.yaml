        distinguishing_aspect: |
          Pairs a state rule (priority 9, ERR_CAMPAIGN_NOT_ACTIVE) against a business_fiscal rule
          (priority 47, ERR_PULL_CAPACITY_EXCEEDED). One create violates both: the campaign is still
          PLANNED and the requested 330.00 reserved tons exceed the 300.00 pull pool. The response
          must be ERR_CAMPAIGN_NOT_ACTIVE (409); the control call proves the capacity rule really was
          violated by returning ERR_PULL_CAPACITY_EXCEEDED once the campaign is activated.
