# =============================================================================
# Task 1222 — Duty Drawback & Tariff Classification Service
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  generate task hard than expert level! 1222. Duty Drawback & Tariff Classification Service (customs consulting firm): HTS classification & binding-ruling request, import/export data matching for drawback eligibility, substitution vs direct-identification drawback calculation, claim filing & recordkeeping retention, contingency-fee billing on recovered duty, tariff-exclusion & trade-remedy monitoring, first-sale valuation analysis, audit defense support

domain_name: duty-drawback-tariff-classification
api_prefix: /customs

# Logical clock: the server keeps a logical current-UTC clock used for every
# system-stamped datetime (filed_at, paid_at, sweep comparisons, due-date
# checks). Before any POST /customs/_clock/set_current_utc call, the clock
# reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock.

complexity_profile:
  primary_archetype: compliance_audit        # statutory deadlines, recordkeeping retention, segregation of duties, audit defense
  secondary_archetype: ledger_reconciliation # duty-paid pools vs recovered drawback, direct vs substitution variants
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat                      # peer entities linked by FK references, flat URL collections
  state_machine_shape: cyclic                # claim deficiency loop; classification rework loop; audit follow-up loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential                       # HTSClassification.supersedes_id
  role_model: segregation_of_duties          # preparer != filer; submitter != certifier
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# Money is integer cents; rates are integer basis points (bps). All roundings
# are round_half_up to integer cents unless a calculation pins otherwise.
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Importer/exporter legal name" }
      - { name: importer_of_record_number, type: string, source: input, description: "IRS/CBP importer number; unique across all clients", constraints: "globally unique" }
      - { name: contingency_fee_bps, type: integer, source: input, description: "Contingency fee on recovered duty, basis points (e.g. 2500 = 25.00%)", constraints: "0 < fee <= 10000" }
      - { name: engagement_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | TERMINATED", constraints: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: lifetime_recovered_cents, type: integer, source: computed, default: 0, description: "Sum of paid_duty_cents over this client's claims in status PAID" }
      - { name: projected_fee_accrual_cents, type: integer, source: computed, default: 0, description: "Accrual-variant fee: sum over this client's claims in status APPROVED of tiered_fee(round_half_up(approved_duty_cents * 8000/10000))" }
      - { name: open_audit_count, type: integer, source: computed, default: 0, description: "Count of AuditCase for this client with status in {OPENED, EVIDENCE_GATHERING, RESPONSE_FILED}" }

  - name: HTSClassification
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning importer" }
      - { name: product_sku, type: string, source: input, description: "Client product identifier" }
      - { name: hts_code, type: string, source: input, description: "Harmonized Tariff Schedule code, e.g. 6203.42.4011" }
      - { name: country_of_origin, type: string, source: input, description: "ISO country code of origin" }
      - { name: duty_rate_bps, type: integer, source: input, description: "General duty rate in basis points; overwritten by an ISSUED binding ruling" }
      - { name: declared_unit_value_cents, type: integer, source: input, description: "Transaction (last-sale) unit value" }
      - { name: first_sale_price_cents, type: integer, source: input, description: "First-sale (factory) unit price; optional", default: null }
      - { name: bona_fide_sale, type: boolean, source: input, default: false, description: "First-sale condition: bona fide sale between factory and middleman" }
      - { name: arms_length, type: boolean, source: input, default: false, description: "First-sale condition: arm's-length transaction" }
      - { name: clearly_destined_us, type: boolean, source: input, default: false, description: "First-sale condition: goods clearly destined for the US at first sale" }
      - { name: first_sale_eligible, type: boolean, source: computed, description: "true iff bona_fide_sale AND arms_length AND clearly_destined_us AND first_sale_price_cents != null AND first_sale_price_cents < declared_unit_value_cents" }
      - { name: appraised_unit_value_cents, type: integer, source: computed, description: "= first_sale_price_cents when first_sale_eligible else declared_unit_value_cents" }
      - { name: supersedes_id, type: string, source: system, description: "FK -> HTSClassification.id; set on the successor created by the supersede endpoint; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | CERTIFIED | SUPERSEDED", constraints: "DRAFT | IN_REVIEW | CERTIFIED | SUPERSEDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted for review" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID that certified (must differ from submitted_by_user_id)" }

  - name: BindingRuling
    parent: null
    common_fields: true
    fields:
      - { name: classification_id, type: string, source: input, description: "FK -> HTSClassification.id; classification the ruling covers" }
      - { name: requested_hts_code, type: string, source: input, description: "HTS code requested in the ruling" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ISSUED | DENIED | WITHDRAWN", constraints: "SUBMITTED | ISSUED | DENIED | WITHDRAWN" }
      - { name: issued_hts_code, type: string, source: input, description: "HTS code CBP ruled (required when outcome=ISSUED)", default: null }
      - { name: issued_duty_rate_bps, type: integer, source: input, description: "Rate CBP ruled in bps (required when outcome=ISSUED)", default: null }

  - name: ImportEntry
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: classification_id, type: string, source: input, description: "FK -> HTSClassification.id; must reference a CERTIFIED classification of the same client" }
      - { name: entry_number, type: string, source: input, description: "CBP entry summary number; unique per client", constraints: "unique within client_id" }
      - { name: entry_date, type: datetime, source: input, description: "Date of import (drives 5-year statutory filing deadline)" }
      - { name: port_code, type: string, source: input, description: "Port of entry code" }
      - { name: line_quantity, type: integer, source: input, description: "Units on this entry line", constraints: "> 0" }
      - { name: entered_value_cents, type: integer, source: input, description: "Entered customs value" }
      - { name: duty_paid_cents, type: integer, source: input, description: "Total duty actually paid on this line, including any trade-remedy surcharges" }
      - { name: non_drawbackable_cents, type: integer, source: computed, description: "Portion of duty_paid attributable to ACTIVE SECTION_301/AD_CVD/SAFEGUARD measures matching (hts prefix, entry_date); SECTION_301 excluded when an ACTIVE EXCLUSION also matches. Per-measure round_half_up, then summed." }
      - { name: drawback_eligible_duty_cents, type: integer, source: computed, description: "= max(0, duty_paid_cents - non_drawbackable_cents); recomputed on measure create/revoke and on entry correction" }
      - { name: matched_quantity, type: integer, source: computed, default: 0, description: "Units consumed by ACTIVE claim lines" }
      - { name: unclaimed_duty_cents, type: integer, source: computed, description: "= drawback_eligible_duty_cents - sum(drawback_amount_cents over ACTIVE claim lines referencing this entry)" }
      - { name: status, type: enum, source: computed, description: "UNMATCHED (matched_quantity=0) | PARTIALLY_MATCHED (0<matched<line_quantity) | MATCHED (matched=line_quantity)", constraints: "UNMATCHED | PARTIALLY_MATCHED | MATCHED" }

  - name: ExportShipment
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: export_date, type: datetime, source: input, description: "Date of export" }
      - { name: hts_code, type: string, source: input, description: "HTS code of the exported article" }
      - { name: quantity, type: integer, source: input, description: "Units exported", constraints: "> 0" }
      - { name: fob_value_cents, type: integer, source: input, description: "FOB value of the shipment; caps total drawback recoverable against it" }
      - { name: dest_country, type: string, source: input, description: "Destination country" }
      - { name: substituted_duty_rate_bps, type: integer, source: input, description: "Duty rate in bps that would have applied to the exported article had it been imported (lesser-of rule input for SUBSTITUTION)" }
      - { name: matched_quantity, type: integer, source: computed, default: 0, description: "Units consumed by ACTIVE claim lines" }
      - { name: value_pool_remaining_cents, type: integer, source: computed, description: "= fob_value_cents - sum(drawback_amount_cents over ACTIVE claim lines referencing this shipment)" }
      - { name: status, type: enum, source: computed, description: "UNMATCHED | PARTIALLY_MATCHED | MATCHED by the same matched_quantity bands as ImportEntry", constraints: "UNMATCHED | PARTIALLY_MATCHED | MATCHED" }

  - name: DrawbackClaim
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client must be engagement_status ACTIVE" }
      - { name: claim_type, type: enum, source: input, description: "DIRECT_IDENTIFICATION | SUBSTITUTION", constraints: "DIRECT_IDENTIFICATION | SUBSTITUTION" }
      - { name: period_start, type: datetime, source: input, description: "Coverage period start (date), CLOSED interval lower bound" }
      - { name: period_end, type: datetime, source: input, description: "Coverage period end (date), CLOSED interval upper bound; must be >= period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | DEFICIENCY_ISSUED | APPROVED | PAID | DENIED | CANCELLED", constraints: "DRAFT | FILED | DEFICIENCY_ISSUED | APPROVED | PAID | DENIED | CANCELLED" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the claim creator" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID that filed (must differ from prepared_by_user_id)" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp of filing", default: null }
      - { name: deficiency_count, type: integer, source: system, default: 0, description: "Number of CBP deficiency cycles used; DEFICIENCY outcome requires deficiency_count < 2" }
      - { name: estimate_cents, type: integer, source: computed, default: 0, description: "PROVISIONAL variant: live recomputation of the per-line refund formula against CURRENT entry eligible-duty fields for all ACTIVE lines" }
      - { name: claimed_duty_cents, type: integer, source: computed, description: "FINAL variant: frozen at filing = sum over ACTIVE lines of round_half_up(line refund) — per-line rounding then sum (pinned order)", default: null }
      - { name: approved_duty_cents, type: integer, source: input, description: "Amount CBP approved; set on review outcome=APPROVED; must be <= claimed_duty_cents", default: null }
      - { name: paid_duty_cents, type: integer, source: input, description: "Amount actually recovered; set on record-payment; must equal approved_duty_cents", default: null }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of payment", default: null }
      - { name: filing_deadline, type: datetime, source: computed, description: "= min(entry_date over ACTIVE lines' import entries) + 5 years; filing requires clock <= filing_deadline (inclusive)", default: null }

  - name: ClaimLine
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> DrawbackClaim.id; from path" }
      - { name: import_entry_id, type: string, source: input, description: "FK -> ImportEntry.id" }
      - { name: export_shipment_id, type: string, source: input, description: "FK -> ExportShipment.id" }
      - { name: matched_quantity, type: integer, source: input, description: "Units matched on this line", constraints: "> 0; <= min(entry remaining qty, export remaining qty)" }
      - { name: match_method, type: enum, source: system, description: "Copied from claim.claim_type at creation: DIRECT | SUBSTITUTION", constraints: "DIRECT | SUBSTITUTION" }
      - { name: drawback_amount_cents, type: integer, source: computed, description: "Per-line refund per calculation line_refund_direct or line_refund_substitution (round_half_up); no pool cap (pool is mathematically unreachable for entry side; FOB cap is a validation, not a cap)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOID", constraints: "ACTIVE | VOID" }

  - name: TariffMeasure
    parent: null
    common_fields: true
    fields:
      - { name: hts_code_prefix, type: string, source: input, description: "HTS prefix matched with startsWith against entry/classification hts_code" }
      - { name: measure_type, type: enum, source: input, description: "EXCLUSION | SECTION_301 | AD_CVD | SAFEGUARD", constraints: "EXCLUSION | SECTION_301 | AD_CVD | SAFEGUARD" }
      - { name: surcharge_bps, type: integer, source: input, description: "Surcharge rate in bps applied to entered_value_cents (ignored for EXCLUSION)" }
      - { name: effective_from, type: datetime, source: input, description: "Window start; HALF-OPEN interval lower bound (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end; HALF-OPEN upper bound (exclusive); null = open-ended", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED", constraints: "ACTIVE | EXPIRED | REVOKED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> DrawbackClaim.id; 1:1, created when the claim transitions to PAID" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from claim" }
      - { name: recovered_duty_cents, type: integer, source: system, description: "Snapshot of claim.paid_duty_cents at creation" }
      - { name: fee_bps_snapshot, type: integer, source: system, description: "Client.contingency_fee_bps captured at creation" }
      - { name: fee_cents, type: integer, source: computed, description: "SETTLED tiered fee per calculation invoice_fee_tiered (per-tier round_half_up then sum)" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Accumulated client payments" }
      - { name: balance_cents, type: integer, source: computed, description: "= fee_cents - amount_paid_cents" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_PAID | PAID | VOID", constraints: "ISSUED | PARTIALLY_PAID | PAID | VOID" }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: claim_id, type: string, source: input, description: "FK -> DrawbackClaim.id; optional scope restriction", default: null }
      - { name: opened_reason, type: enum, source: input, description: "CF28 | FOCUSED_ASSESSMENT | POST_PAYMENT_AUDIT", constraints: "CF28 | FOCUSED_ASSESSMENT | POST_PAYMENT_AUDIT" }
      - { name: due_date, type: datetime, source: input, description: "Response deadline; FILE_RESPONSE requires clock <= due_date (inclusive)" }
      - { name: status, type: enum, source: system, description: "OPENED | EVIDENCE_GATHERING | RESPONSE_FILED | CLOSED_REFUTED | CLOSED_SUSTAINED", constraints: "OPENED | EVIDENCE_GATHERING | RESPONSE_FILED | CLOSED_REFUTED | CLOSED_SUSTAINED" }
      - { name: culpability_level, type: enum, source: input, description: "NONE | NEGLIGENCE | GROSS_NEGLIGENCE | FRAUD; required on CLOSE_SUSTAINED", default: null, constraints: "NONE | NEGLIGENCE | GROSS_NEGLIGENCE | FRAUD" }
      - { name: penalty_exposure_cents, type: integer, source: computed, default: 0, description: "On CLOSE_SUSTAINED: round_half_up(scope_paid_total * rate_bps/10000); rates NONE 0, NEGLIGENCE 500, GROSS_NEGLIGENCE 2000, FRAUD 10000; scope = linked claim's paid_duty_cents if claim_id set and claim PAID, else sum of paid_duty_cents over client's PAID claims" }

  - name: ComplianceRecord
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> DrawbackClaim.id; three records (ENTRY_DOCS, EXPORT_PROOF, MATCHING_WORKSHEET) auto-created when the claim is FILED" }
      - { name: doc_type, type: enum, source: system, description: "ENTRY_DOCS | EXPORT_PROOF | MATCHING_WORKSHEET", constraints: "ENTRY_DOCS | EXPORT_PROOF | MATCHING_WORKSHEET" }
      - { name: retention_until, type: datetime, source: computed, default: null, description: "= claim.paid_at + 3 years; null while the claim is not PAID (retained indefinitely)" }
      - { name: status, type: enum, source: system, description: "RETAINED | ELIGIBLE_FOR_DESTRUCTION | DESTROYED", constraints: "RETAINED | ELIGIBLE_FOR_DESTRUCTION | DESTROYED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /customs/clients/{id} with engagement_status=SUSPENDED"
        actor: FirmAdmin
        preconditions: []
        side_effects: ["Client.version += 1", "New DrawbackClaim creation and claim filing for this client now fail with ERR_CLIENT_NOT_ACTIVE"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /customs/clients/{id} with engagement_status=ACTIVE"
        actor: FirmAdmin
        preconditions: []
        side_effects: ["Client.version += 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "PATCH /customs/clients/{id} with engagement_status=TERMINATED"
        actor: FirmAdmin
        preconditions: []
        side_effects: ["Client.version += 1", "Claim creation/filing blocked with ERR_CLIENT_NOT_ACTIVE"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "PATCH /customs/clients/{id} with engagement_status=TERMINATED"
        actor: FirmAdmin
        preconditions: []
        side_effects: ["Client.version += 1", "Claim creation/filing blocked with ERR_CLIENT_NOT_ACTIVE"]

  - entity: HTSClassification
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /customs/classifications/{id}/submit"
        actor: Analyst
        preconditions: []
        side_effects: ["submitted_by_user_id := X-User-ID", "HTSClassification.version += 1"]
      - from: IN_REVIEW
        to: CERTIFIED
        trigger: "POST /customs/classifications/{id}/review-decision with decision=CERTIFY"
        actor: LicensedBroker
        preconditions: ["X-User-ID != submitted_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["certified_by_user_id := X-User-ID", "HTSClassification.version += 1"]
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /customs/classifications/{id}/review-decision with decision=REWORK"
        actor: LicensedBroker
        preconditions: []
        side_effects: ["HTSClassification.version += 1"]
        note: "Rework cycle: DRAFT -> IN_REVIEW -> DRAFT is allowed repeatedly"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "POST /customs/classifications/{id}/supersede (creates the successor)"
        actor: Analyst
        preconditions: ["expected_classification_version matches current version (OCC, ERR_STALE_VERSION)"]
        side_effects:
          - "This classification -> SUPERSEDED, version += 1"
          - "New HTSClassification created in DRAFT with supersedes_id = this id and the payload's classification fields"

  - entity: BindingRuling
    initial_state: SUBMITTED
    terminal_states: [ISSUED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /customs/binding-rulings/{id}/outcome with outcome=ISSUED"
        actor: LicensedBroker
        preconditions: ["issued_hts_code and issued_duty_rate_bps present (ERR_INVALID_REQUEST otherwise)"]
        side_effects:
          - "Linked HTSClassification.hts_code := issued_hts_code, duty_rate_bps := issued_duty_rate_bps, version += 1 (re-rate)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /customs/binding-rulings/{id}/outcome with outcome=DENIED"
        actor: LicensedBroker
        preconditions: []
        side_effects: ["BindingRuling.version += 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /customs/binding-rulings/{id}/outcome with outcome=WITHDRAWN"
        actor: LicensedBroker
        preconditions: []
        side_effects: ["BindingRuling.version += 1"]

  - entity: ImportEntry
    initial_state: UNMATCHED
    terminal_states: []
    transitions:
      - from: UNMATCHED
        to: PARTIALLY_MATCHED
        trigger: "system (a claim line referencing this entry becomes ACTIVE with matched_quantity < line_quantity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNMATCHED
        to: MATCHED
        trigger: "system (matched_quantity reaches line_quantity in one line)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_MATCHED
        to: MATCHED
        trigger: "system (matched_quantity reaches line_quantity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_MATCHED
        to: UNMATCHED
        trigger: "system (all referencing lines voided; matched_quantity back to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MATCHED
        to: PARTIALLY_MATCHED
        trigger: "system (a referencing line is voided)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ExportShipment
    initial_state: UNMATCHED
    terminal_states: []
    transitions:
      - from: UNMATCHED
        to: PARTIALLY_MATCHED
        trigger: "system (a claim line referencing this shipment becomes ACTIVE with matched_quantity < quantity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNMATCHED
        to: MATCHED
        trigger: "system (matched_quantity reaches quantity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_MATCHED
        to: MATCHED
        trigger: "system (matched_quantity reaches quantity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_MATCHED
        to: UNMATCHED
        trigger: "system (all referencing lines voided)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MATCHED
        to: PARTIALLY_MATCHED
        trigger: "system (a referencing line is voided)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DrawbackClaim
    initial_state: DRAFT
    terminal_states: [PAID, DENIED, CANCELLED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /customs/claims/{id}/file"
        actor: LicensedBroker
        preconditions:
          - "client.engagement_status == ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
          - "at least one ACTIVE claim line (ERR_INVALID_REQUEST)"
          - "X-User-ID != prepared_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
          - "logical clock <= filing_deadline, inclusive (ERR_FILING_DEADLINE_PASSED)"
        side_effects:
          - "filed_at := logical clock; filed_by_user_id := X-User-ID"
          - "claimed_duty_cents := sum over ACTIVE lines of drawback_amount_cents (per-line round_half_up then sum — pinned order); estimate_cents no longer recomputed for this claim"
          - "Three ComplianceRecords auto-created (ENTRY_DOCS, EXPORT_PROOF, MATCHING_WORKSHEET), status RETAINED, retention_until null"
          - "DrawbackClaim.version += 1"
      - from: FILED
        to: APPROVED
        trigger: "POST /customs/claims/{id}/review with outcome=APPROVED"
        actor: LicensedBroker
        preconditions: ["approved_duty_cents present and <= claimed_duty_cents (ERR_APPROVED_EXCEEDS_CLAIMED)"]
        side_effects:
          - "approved_duty_cents recorded"
          - "Client.projected_fee_accrual_cents recomputed (claim enters the APPROVED accrual set)"
          - "DrawbackClaim.version += 1"
      - from: FILED
        to: DENIED
        trigger: "POST /customs/claims/{id}/review with outcome=DENIED"
        actor: LicensedBroker
        preconditions: []
        side_effects:
          - "All ACTIVE claim lines -> VOID; each void restores ImportEntry.unclaimed_duty_cents and matched_quantity, ExportShipment.matched_quantity and value_pool_remaining_cents (compensation cascade)"
          - "DrawbackClaim.version += 1"
      - from: FILED
        to: DEFICIENCY_ISSUED
        trigger: "POST /customs/claims/{id}/review with outcome=DEFICIENCY"
        actor: LicensedBroker
        preconditions: ["deficiency_count < 2 (ERR_DEFICIENCY_LIMIT_REACHED)"]
        side_effects: ["deficiency_count += 1", "DrawbackClaim.version += 1"]
      - from: DEFICIENCY_ISSUED
        to: FILED
        trigger: "POST /customs/claims/{id}/deficiency-response"
        actor: "Analyst | LicensedBroker | ClientContact"
        preconditions: []
        side_effects: ["DrawbackClaim.version += 1"]
        note: "Deficiency cycle FILED -> DEFICIENCY_ISSUED -> FILED, at most 2 rounds"
      - from: APPROVED
        to: PAID
        trigger: "POST /customs/claims/{id}/record-payment"
        actor: FirmAdmin
        preconditions: ["paid_duty_cents == approved_duty_cents (ERR_PAID_AMOUNT_MISMATCH)"]
        side_effects:
          - "paid_at := logical clock"
          - "Invoice auto-created (link 1 of paid cascade): status ISSUED, recovered_duty_cents := paid_duty_cents, fee_bps_snapshot := client.contingency_fee_bps, fee_cents per invoice_fee_tiered (SETTLED variant)"
          - "Client.lifetime_recovered_cents += paid_duty_cents; Client.projected_fee_accrual_cents recomputed (claim leaves the APPROVED accrual set); Client.version += 1 (link 2 of paid cascade)"
          - "The claim's three ComplianceRecords get retention_until := paid_at + 3 years (link 3 of paid cascade); each record version += 1"
          - "DrawbackClaim.version += 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /customs/claims/{id}/cancel"
        actor: Analyst
        preconditions: []
        side_effects:
          - "All ACTIVE claim lines -> VOID with the same pool/quantity restoration as DENIED (compensation cascade)"
          - "DrawbackClaim.version += 1"

  - entity: ClaimLine
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: VOID
        trigger: "DELETE /customs/claims/{id}/lines/{lineId}"
        actor: Analyst
        preconditions: ["Parent claim status == DRAFT (ERR_INVALID_STATE)"]
        side_effects:
          - "ImportEntry.unclaimed_duty_cents += drawback_amount_cents; matched_quantity -= matched_quantity; entry version += 1"
          - "ExportShipment.matched_quantity -= matched_quantity; value_pool_remaining_cents += drawback_amount_cents; export version += 1"
          - "Claim.estimate_cents recomputed; claim version += 1"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /customs/invoices/{id}/payments with amount_cents < balance_cents"
        actor: FirmAdmin
        preconditions: ["amount_cents > 0", "amount_cents <= balance_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"]
        side_effects: ["amount_paid_cents += amount_cents", "Invoice.version += 1"]
      - from: ISSUED
        to: PAID
        trigger: "POST /customs/invoices/{id}/payments with amount_cents == balance_cents (exact-equality boundary)"
        actor: FirmAdmin
        preconditions: ["amount_cents > 0", "amount_cents <= balance_cents"]
        side_effects: ["amount_paid_cents += amount_cents", "Invoice.version += 1"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /customs/invoices/{id}/payments with amount_cents == balance_cents"
        actor: FirmAdmin
        preconditions: ["amount_cents > 0", "amount_cents <= balance_cents"]
        side_effects: ["amount_paid_cents += amount_cents", "Invoice.version += 1"]
      - from: ISSUED
        to: VOID
        trigger: "POST /customs/invoices/{id}/void"
        actor: ComplianceManager
        preconditions: ["amount_paid_cents == 0 (ERR_INVOICE_HAS_PAYMENTS)"]
        side_effects: ["Invoice.version += 1"]

  - entity: AuditCase
    initial_state: OPENED
    terminal_states: [CLOSED_REFUTED, CLOSED_SUSTAINED]
    transitions:
      - from: OPENED
        to: EVIDENCE_GATHERING
        trigger: "POST /customs/audit-cases/{id}/advance with action=START_EVIDENCE"
        actor: ComplianceManager
        preconditions: []
        side_effects: ["Client.open_audit_count recomputed", "AuditCase.version += 1"]
      - from: EVIDENCE_GATHERING
        to: RESPONSE_FILED
        trigger: "POST /customs/audit-cases/{id}/advance with action=FILE_RESPONSE"
        actor: ComplianceManager
        preconditions: ["logical clock <= due_date, inclusive (ERR_RESPONSE_PAST_DUE)"]
        side_effects: ["AuditCase.version += 1"]
      - from: RESPONSE_FILED
        to: EVIDENCE_GATHERING
        trigger: "POST /customs/audit-cases/{id}/advance with action=REQUEST_MORE"
        actor: ComplianceManager
        preconditions: []
        side_effects: ["AuditCase.version += 1"]
        note: "Auditor follow-up cycle: RESPONSE_FILED -> EVIDENCE_GATHERING allowed repeatedly"
      - from: RESPONSE_FILED
        to: CLOSED_REFUTED
        trigger: "POST /customs/audit-cases/{id}/advance with action=CLOSE_REFUTED"
        actor: ComplianceManager
        preconditions: []
        side_effects: ["Client.open_audit_count recomputed", "AuditCase.version += 1"]
      - from: RESPONSE_FILED
        to: CLOSED_SUSTAINED
        trigger: "POST /customs/audit-cases/{id}/advance with action=CLOSE_SUSTAINED"
        actor: ComplianceManager
        preconditions: ["culpability_level present (ERR_INVALID_REQUEST)"]
        side_effects:
          - "penalty_exposure_cents computed per audit_penalty_exposure"
          - "Client.open_audit_count recomputed"
          - "AuditCase.version += 1"

  - entity: ComplianceRecord
    initial_state: RETAINED
    terminal_states: [DESTROYED]
    transitions:
      - from: RETAINED
        to: ELIGIBLE_FOR_DESTRUCTION
        trigger: "system (POST /customs/ops/run_sweep when retention_until != null and logical clock >= retention_until, inclusive)"
        actor: system
        preconditions: []
        side_effects: ["ComplianceRecord.version += 1"]
      - from: ELIGIBLE_FOR_DESTRUCTION
        to: DESTROYED
        trigger: "POST /customs/records/{id}/destroy"
        actor: ComplianceManager
        preconditions: ["status == ELIGIBLE_FOR_DESTRUCTION (ERR_RECORD_NOT_ELIGIBLE)"]
        side_effects: ["ComplianceRecord.version += 1"]

  - entity: TariffMeasure
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /customs/ops/run_sweep when effective_to != null and logical clock >= effective_to, inclusive)"
        actor: system
        preconditions: []
        side_effects: ["TariffMeasure.version += 1", "Matching entries' non_drawbackable/eligible/unclaimed recomputed"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /customs/tariff-measures/{id}/revoke"
        actor: FirmAdmin
        preconditions: []
        side_effects:
          - "TariffMeasure.version += 1"
          - "Matching ImportEntries' non_drawbackable_cents/drawback_eligible_duty_cents/unclaimed_duty_cents recomputed (revoke only ever removes surcharges, so eligible duty never shrinks; entry version += 1 for each touched entry)"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: claim-update-stale-version
    parent_entity: DrawbackClaim
    write_endpoint: "PUT /customs/claims/{id}"
    occ_field: expected_claim_version
    description: |
      Updating a DRAFT claim (period or claim_type) with an
      expected_claim_version that no longer matches the claim's current
      version is rejected. A second sequential update carrying the same
      version the client observed before its first update sees identical
      state (still DRAFT) and would otherwise legitimately succeed, so the
      stale-version check is the arbiter.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: entry-correction-stale-version
    parent_entity: ImportEntry
    write_endpoint: "POST /customs/import-entries/{id}/correct"
    occ_field: expected_import_entry_version
    description: |
      Posting a correction to an ImportEntry with an
      expected_import_entry_version that no longer matches the entry's
      current version is rejected. Corrections are legitimate from any
      non-locked entry state, so two sequential corrections carrying the
      same observed version cannot be arbitrated by state preconditions;
      the version check arbitrates.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# Constants: REFUND_RATE_BPS=9900 (drawback refunds 99% of eligible duty),
# FOB pool = ExportShipment.fob_value_cents, TIER1_CAP_CENTS=1000000,
# TIER2_DISCOUNT_BPS=2000, REALIZATION_BPS=8000, FILING_WINDOW_YEARS=5,
# RETENTION_YEARS=3.
# =============================================================================
calculations:
  - name: line_refund_direct
    trigger: "POST /customs/claims/{id}/lines when parent claim.claim_type == DIRECT_IDENTIFICATION; also re-evaluated for ACTIVE lines of DRAFT claims when the referenced entry is corrected"
    algorithm: threshold
    formula: |
      unit_eligible = entry.drawback_eligible_duty_cents / entry.line_quantity   (exact rational)
      raw = REFUND_RATE_BPS/10000 * unit_eligible * matched_quantity
      drawback_amount_cents = round_half_up(raw)
    input_set: "The referenced ImportEntry (current drawback_eligible_duty_cents, line_quantity) and the line's matched_quantity"
    constants:
      REFUND_RATE_BPS: 9900
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_estimate
        when: "DrawbackClaim.estimate_cents while claim is DRAFT"
        difference: "Claim-level estimate recomputes every line LIVE from current entry fields on each line add/void/entry correction; it is not the frozen filed figure"
      - name: final_frozen
        when: "DrawbackClaim.claimed_duty_cents at file time"
        difference: "Frozen once at filing as the sum of the then-current per-line amounts; later entry corrections never change a filed claim's lines (corrections on entries referenced by non-DRAFT claims are rejected with ERR_ENTRY_LOCKED_BY_FILED_CLAIM)"

  - name: line_refund_substitution
    trigger: "POST /customs/claims/{id}/lines when parent claim.claim_type == SUBSTITUTION; also re-evaluated for ACTIVE lines of DRAFT claims when the referenced entry is corrected"
    algorithm: tiered_pricing
    formula: |
      import_unit_duty = entry.drawback_eligible_duty_cents / entry.line_quantity            (exact rational)
      substitute_unit_duty = export.substituted_duty_rate_bps * export.fob_value_cents
                             / (10000 * export.quantity)                                       (exact rational)
      lesser_unit = min(import_unit_duty, substitute_unit_duty)                                (lesser-of rule, 19 USC 1313(l))
      raw = REFUND_RATE_BPS/10000 * lesser_unit * matched_quantity
      drawback_amount_cents = round_half_up(raw)
      -- then FOB pool validation: if raw > export.value_pool_remaining_cents -> reject ERR_EXPORT_VALUE_POOL_EXCEEDED
    input_set: "Referenced ImportEntry (eligible duty, quantity), referenced ExportShipment (substituted rate, fob value, quantity), line matched_quantity, parent claim type"
    constants:
      REFUND_RATE_BPS: 9900
    precision: "integer cents, round_half_up"

  - name: claim_total
    trigger: "DrawbackClaim filing (FINAL) and estimate recompute on line add/void/entry correction (PROVISIONAL)"
    algorithm: aggregation
    formula: |
      claimed_duty_cents = SUM over ACTIVE lines of round_half_up(per-line raw refund)
      PINNED ORDER: round each line to integer cents first, then sum the integers.
      (Sum-then-round of raw values is FORBIDDEN: e.g. two lines with raw 40837.5 each
       must total 81676, not 81675.)
    input_set: "All ClaimLine with status ACTIVE belonging to the claim"
    precision: "integer cents, round_half_up per line then integer sum"
    variants:
      - name: provisional
        when: "claim DRAFT: estimate_cents, recomputed live on every line or entry-field change"
        difference: "Reflects CURRENT entry eligible duty; can diverge from the eventual frozen figure"
      - name: final
        when: "claim FILED onward: claimed_duty_cents, frozen"
        difference: "Computed once from line amounts at filing; never recomputed"

  - name: invoice_fee_tiered
    trigger: "Invoice auto-creation on claim PAID (SETTLED); Client.projected_fee_accrual_cents recompute on claim APPROVED/PAID/DENIED/CANCELLED (ACCRUED)"
    algorithm: tiered_pricing
    formula: |
      tier1_base = min(recovered_cents, TIER1_CAP_CENTS)
      tier2_base = max(0, recovered_cents - TIER1_CAP_CENTS)
      fee_cents = round_half_up(tier1_base * fee_bps / 10000)
                + round_half_up(tier2_base * fee_bps * (10000 - TIER2_DISCOUNT_BPS) / 100000000)
      PINNED ORDER: round each tier to integer cents independently, then sum.
    input_set: "SETTLED: claim.paid_duty_cents and fee_bps_snapshot. ACCRUED: per APPROVED claim, round_half_up(approved_duty_cents * REALIZATION_BPS / 10000) as recovered_cents and current client contingency_fee_bps"
    constants:
      TIER1_CAP_CENTS: 1000000
      TIER2_DISCOUNT_BPS: 2000
      REALIZATION_BPS: 8000
    precision: "integer cents, round_half_up per tier then integer sum"
    variants:
      - name: accrued_projection
        when: "Client.projected_fee_accrual_cents (claims in APPROVED)"
        difference: "Applies an 80% realization haircut to approved_duty_cents before tiering; identical approved/paid amounts yield a LOWER accrual than the settled fee"
      - name: settled
        when: "Invoice.fee_cents at creation"
        difference: "Tiers applied to the full paid amount, no haircut"

  - name: entry_eligible_duty
    trigger: "ImportEntry creation, entry correction, TariffMeasure creation, TariffMeasure revoke, ops sweep measure expiry"
    algorithm: aggregation
    formula: |
      matching = ACTIVE TariffMeasures where entry.hts_code startsWith measure.hts_code_prefix
                 AND measure.effective_from <= entry.entry_date
                 AND (measure.effective_to IS NULL OR entry.entry_date < measure.effective_to)
                 -- HALF-OPEN window [from, to)
      exclusion_present = any matching measure with measure_type == EXCLUSION
      non_drawbackable_cents = SUM over matching measures m:
          if m.measure_type == EXCLUSION: contribute 0
          if m.measure_type == SECTION_301 AND exclusion_present: contribute 0
          else: round_half_up(entry.entered_value_cents * m.surcharge_bps / 10000)
      PINNED ORDER: per-measure round_half_up, then integer sum.
      drawback_eligible_duty_cents = max(0, duty_paid_cents - non_drawbackable_cents)
      unclaimed_duty_cents = drawback_eligible_duty_cents - SUM(ACTIVE claim lines' drawback_amount_cents on this entry)
    input_set: "The entry; all ACTIVE TariffMeasures whose prefix and half-open window cover the entry's hts_code and entry_date; all ACTIVE claim lines referencing the entry"
    precision: "integer cents, per-measure round_half_up then sum"

  - name: pool_allocation_order
    trigger: "Any claim-line creation or void"
    algorithm: chronological
    formula: |
      Pool decrements are applied in ClaimLine.created_at ASC order (tie-break: parent
      claim created_at ASC, then line created_at ASC). A later line observes
      entry.unclaimed_duty_cents and export.value_pool_remaining_cents net of every
      earlier ACTIVE line. Evaluation order is pinned so the mutual dependency
      (line amount reads pool; pool is reduced by lines) is well-defined.
      Random id ordering is FORBIDDEN as a tie-break.
    input_set: "All ClaimLine referencing a given ImportEntry or ExportShipment"
    precision: "n/a (ordering rule)"

  - name: statutory_filing_deadline
    trigger: "POST /customs/claims/{id}/file"
    algorithm: threshold
    formula: |
      filing_deadline = min(entry.entry_date over entries referenced by ACTIVE lines) + FILING_WINDOW_YEARS years
      filing is allowed iff logical_clock <= filing_deadline   (INCLUSIVE at the exact second)
    input_set: "ACTIVE claim lines' import entries"
    constants:
      FILING_WINDOW_YEARS: 5
    precision: "second precision on the logical clock"

  - name: retention_eligibility
    trigger: "Claim record-payment (sets retention_until) and POST /customs/ops/run_sweep (flips status)"
    algorithm: threshold
    formula: |
      retention_until = claim.paid_at + RETENTION_YEARS years
      record becomes ELIGIBLE_FOR_DESTRUCTION during a sweep iff
        retention_until IS NOT NULL AND logical_clock >= retention_until   (INCLUSIVE)
    input_set: "ComplianceRecords with status RETAINED"
    constants:
      RETENTION_YEARS: 3
    precision: "second precision on the logical clock"

  - name: audit_penalty_exposure
    trigger: "AuditCase advance with action=CLOSE_SUSTAINED"
    algorithm: tiered_pricing
    formula: |
      rate_bps = { NONE: 0, NEGLIGENCE: 500, GROSS_NEGLIGENCE: 2000, FRAUD: 10000 }[culpability_level]
      scope_paid_total = linked claim.paid_duty_cents if audit.claim_id set and that claim is PAID,
                         else SUM(paid_duty_cents) over the client's claims in status PAID
      penalty_exposure_cents = round_half_up(scope_paid_total * rate_bps / 10000)
    input_set: "AuditCase.culpability_level; linked claim or the client's PAID claims"
    precision: "integer cents, round_half_up"

  - name: client_summary_aggregates
    trigger: "Any claim transition to/from APPROVED or PAID; any audit advance; read of GET /customs/clients/{id}"
    algorithm: aggregation
    formula: |
      lifetime_recovered_cents = SUM(paid_duty_cents) over client's claims with status == PAID
      open_audit_count = COUNT of client's AuditCases with status in {OPENED, EVIDENCE_GATHERING, RESPONSE_FILED}
      projected_fee_accrual_cents = SUM over client's claims with status == APPROVED of
        invoice_fee_tiered(round_half_up(approved_duty_cents * REALIZATION_BPS / 10000), client.contingency_fee_bps)
    input_set: "Client's DrawbackClaims filtered by explicit status sets; client's AuditCases filtered by explicit status set"
    constants:
      REALIZATION_BPS: 8000
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles; ClientContact may only access resources of the client whose id == X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template ids exist, validated left-to-right (claim before line, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: business_constraint
    check: "Request body required fields present, enums valid, integers positive, expected_*_version present where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: business_constraint
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /customs/claims/{id}; POST /customs/import-entries/{id}/correct; POST /customs/classifications/{id}/supersede"
  - priority: 6
    category: state
    check: "Target resource in a valid from-state for the requested transition; terminal states reject all further transitions"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: claim filer != claim preparer; classification certifier != classification submitter"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /customs/claims/{id}/file; POST /customs/classifications/{id}/review-decision"
  - priority: 8
    category: business_referential
    check: "Cross-entity references valid: entry's classification CERTIFIED and same client (ERR_CLASSIFICATION_NOT_CERTIFIED / ERR_CROSS_CLIENT_REFERENCE); claim's client ACTIVE (ERR_CLIENT_NOT_ACTIVE); line's entry/export same client as claim (ERR_CROSS_CLIENT_REFERENCE); ruling's classification CERTIFIED (ERR_CLASSIFICATION_NOT_CERTIFIED)"
    error_id: "ERR_CLASSIFICATION_NOT_CERTIFIED | ERR_CLIENT_NOT_ACTIVE | ERR_CROSS_CLIENT_REFERENCE"
    http_status: 409
    applies_to: "POST /customs/import-entries; POST /customs/claims; POST /customs/claims/{id}/file; POST /customs/claims/{id}/lines; POST /customs/binding-rulings"
  - priority: 9
    category: business_temporal
    check: "Temporal rules: claim period_start <= period_end and measure effective_to > effective_from (ERR_INVALID_WINDOW); filing deadline inclusive (ERR_FILING_DEADLINE_PASSED); audit response by due_date inclusive (ERR_RESPONSE_PAST_DUE)"
    error_id: "ERR_INVALID_WINDOW | ERR_FILING_DEADLINE_PASSED | ERR_RESPONSE_PAST_DUE"
    http_status: 422
    applies_to: "POST /customs/claims; PUT /customs/claims/{id}; POST /customs/tariff-measures; POST /customs/claims/{id}/file; POST /customs/audit-cases/{id}/advance"
  - priority: 10
    category: business_constraint
    check: "Uniqueness and overlap: entry_number unique per client (ERR_DUPLICATE_ENTRY_NUMBER); measure half-open windows on same (measure_type, hts_code_prefix) must not overlap, adjacency allowed (ERR_MEASURE_WINDOW_OVERLAP); claim CLOSED periods per (client, claim_type) among non-terminal claims must not overlap, sharing a single date IS an overlap, back-to-back periods allowed (ERR_CLAIM_PERIOD_OVERLAP); DEFICIENCY outcome requires deficiency_count < 2 (ERR_DEFICIENCY_LIMIT_REACHED)"
    error_id: "ERR_DUPLICATE_ENTRY_NUMBER | ERR_MEASURE_WINDOW_OVERLAP | ERR_CLAIM_PERIOD_OVERLAP | ERR_DEFICIENCY_LIMIT_REACHED"
    http_status: 409
    applies_to: "POST /customs/import-entries; POST /customs/tariff-measures; POST /customs/claims; PUT /customs/claims/{id}; POST /customs/claims/{id}/review"
  - priority: 11
    category: business_constraint
    check: "Match compatibility and quantity bounds: DIRECT claims require export.hts_code == entry.hts_code (ERR_MATCH_INCOMPATIBLE); matched_quantity <= min(entry remaining qty, export remaining qty) (ERR_MATCH_QUANTITY_EXCEEDED); entry correction line_quantity >= current matched_quantity (ERR_MATCH_QUANTITY_EXCEEDED)"
    error_id: "ERR_MATCH_INCOMPATIBLE | ERR_MATCH_QUANTITY_EXCEEDED"
    http_status: 422
    applies_to: "POST /customs/claims/{id}/lines; POST /customs/import-entries/{id}/correct"
  - priority: 12
    category: business_safety
    check: "Frozen-ledger protection: entry correction rejected when any ACTIVE line on the entry belongs to a claim not in DRAFT (ERR_ENTRY_LOCKED_BY_FILED_CLAIM); measure creation rejected when its window would reduce eligible duty of an entry having ACTIVE claim lines (ERR_MEASURE_BLOCKED_BY_CLAIM_LINES)"
    error_id: "ERR_ENTRY_LOCKED_BY_FILED_CLAIM | ERR_MEASURE_BLOCKED_BY_CLAIM_LINES"
    http_status: 409
    applies_to: "POST /customs/import-entries/{id}/correct; POST /customs/tariff-measures"
  - priority: 13
    category: business_fiscal
    check: "Fiscal caps: substitution line raw refund must be <= export.value_pool_remaining_cents (ERR_EXPORT_VALUE_POOL_EXCEEDED); review approved_duty_cents <= claimed_duty_cents (ERR_APPROVED_EXCEEDS_CLAIMED); record-payment paid_duty_cents == approved_duty_cents (ERR_PAID_AMOUNT_MISMATCH); invoice payment amount_cents <= balance_cents (ERR_PAYMENT_EXCEEDS_BALANCE); invoice void requires amount_paid_cents == 0 (ERR_INVOICE_HAS_PAYMENTS); record destroy requires ELIGIBLE status (ERR_RECORD_NOT_ELIGIBLE)"
    error_id: "ERR_EXPORT_VALUE_POOL_EXCEEDED | ERR_APPROVED_EXCEEDS_CLAIMED | ERR_PAID_AMOUNT_MISMATCH | ERR_PAYMENT_EXCEEDS_BALANCE | ERR_INVOICE_HAS_PAYMENTS | ERR_RECORD_NOT_ELIGIBLE"
    http_status: 422
    applies_to: "POST /customs/claims/{id}/lines; POST /customs/claims/{id}/review; POST /customs/claims/{id}/record-payment; POST /customs/invoices/{id}/payments; POST /customs/invoices/{id}/void; POST /customs/records/{id}/destroy"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Client ---
  - { method: POST, path: "/customs/clients", description: "Onboard a client", roles: [FirmAdmin], code: 201, input: [name, importer_of_record_number, contingency_fee_bps], output: Client, side_effects: ["engagement_status=ACTIVE, aggregates zeroed, version=1"] }
  - { method: GET, path: "/customs/clients/{id}", description: "Get client incl. computed aggregates", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: [], output: Client, side_effects: [] }
  - { method: GET, path: "/customs/clients", description: "List clients", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager], code: 200, input: ["engagement_status?", "limit?", "offset?"], output: "Client[]", side_effects: [] }
  - { method: PATCH, path: "/customs/clients/{id}", description: "Change engagement status", roles: [FirmAdmin], code: 200, input: [engagement_status], output: Client, side_effects: ["Client.version += 1"] }

  # --- HTSClassification ---
  - { method: POST, path: "/customs/classifications", description: "Create a classification (DRAFT); computes first_sale_eligible and appraised_unit_value_cents", roles: [Analyst], code: 201, input: [client_id, product_sku, hts_code, country_of_origin, duty_rate_bps, declared_unit_value_cents, "first_sale_price_cents?", "bona_fide_sale?", "arms_length?", "clearly_destined_us?"], output: HTSClassification, side_effects: ["status=DRAFT, version=1"] }
  - { method: GET, path: "/customs/classifications/{id}", description: "Get classification", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: [], output: HTSClassification, side_effects: [] }
  - { method: GET, path: "/customs/classifications", description: "List classifications with filters", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: ["client_id?", "supersedes_id?", "status?", "limit?", "offset?"], output: "HTSClassification[]", side_effects: [] }
  - { method: POST, path: "/customs/classifications/{id}/submit", description: "Submit for review (DRAFT -> IN_REVIEW)", roles: [Analyst], code: 200, input: [], output: HTSClassification, side_effects: ["submitted_by_user_id := X-User-ID, version += 1"] }
  - { method: POST, path: "/customs/classifications/{id}/review-decision", description: "Certify or send back for rework", roles: [LicensedBroker], code: 200, input: [decision], output: HTSClassification, side_effects: ["CERTIFY: status=CERTIFIED, certified_by_user_id := X-User-ID; REWORK: status=DRAFT; version += 1"] }
  - { method: POST, path: "/customs/classifications/{id}/supersede", description: "Create successor classification; this one becomes SUPERSEDED. OCC via expected_classification_version.", roles: [Analyst], code: 201, input: [product_sku, hts_code, country_of_origin, duty_rate_bps, declared_unit_value_cents, "first_sale_price_cents?", "bona_fide_sale?", "arms_length?", "clearly_destined_us?", expected_classification_version], output: HTSClassification, side_effects: ["Old classification -> SUPERSEDED (version += 1); new classification DRAFT with supersedes_id, version=1"] }

  # --- BindingRuling ---
  - { method: POST, path: "/customs/binding-rulings", description: "File a binding-ruling request (created directly in SUBMITTED)", roles: [LicensedBroker], code: 201, input: [classification_id, requested_hts_code], output: BindingRuling, side_effects: ["status=SUBMITTED, version=1"] }
  - { method: GET, path: "/customs/binding-rulings/{id}", description: "Get ruling", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: [], output: BindingRuling, side_effects: [] }
  - { method: GET, path: "/customs/binding-rulings", description: "List rulings", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: ["classification_id?", "status?", "limit?", "offset?"], output: "BindingRuling[]", side_effects: [] }
  - { method: POST, path: "/customs/binding-rulings/{id}/outcome", description: "Record CBP outcome; ISSUED re-rates the linked classification", roles: [LicensedBroker], code: 200, input: [outcome, "issued_hts_code?", "issued_duty_rate_bps?"], output: BindingRuling, side_effects: ["ISSUED: classification.hts_code/duty_rate_bps updated, classification.version += 1; ruling.version += 1"] }

  # --- ImportEntry ---
  - { method: POST, path: "/customs/import-entries", description: "Register an import entry; computes non_drawbackable/eligible/unclaimed from ACTIVE measures", roles: [Analyst], code: 201, input: [client_id, classification_id, entry_number, entry_date, port_code, line_quantity, entered_value_cents, duty_paid_cents], output: ImportEntry, side_effects: ["status=UNMATCHED, matched_quantity=0, version=1"] }
  - { method: GET, path: "/customs/import-entries/{id}", description: "Get entry", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: [], output: ImportEntry, side_effects: [] }
  - { method: GET, path: "/customs/import-entries", description: "List entries", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: ["client_id?", "classification_id?", "status?", "limit?", "offset?"], output: "ImportEntry[]", side_effects: [] }
  - { method: POST, path: "/customs/import-entries/{id}/correct", description: "Correct entry figures (OCC). Blocked when ACTIVE lines sit on non-DRAFT claims. Recomputes eligible duty, ACTIVE lines of DRAFT claims, and those claims' estimates.", roles: [Analyst], code: 200, input: ["duty_paid_cents?", "entered_value_cents?", "line_quantity?", expected_import_entry_version], output: ImportEntry, side_effects: ["entry fields updated + recompute (link 1); ACTIVE ClaimLines on DRAFT claims recalculated (link 2); affected DRAFT claims' estimate_cents recomputed (link 3); version += 1 on every touched entity"] }

  # --- ExportShipment ---
  - { method: POST, path: "/customs/export-shipments", description: "Register an export shipment", roles: [Analyst], code: 201, input: [client_id, export_date, hts_code, quantity, fob_value_cents, dest_country, substituted_duty_rate_bps], output: ExportShipment, side_effects: ["status=UNMATCHED, matched_quantity=0, value_pool_remaining_cents=fob_value_cents, version=1"] }
  - { method: GET, path: "/customs/export-shipments/{id}", description: "Get shipment", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: [], output: ExportShipment, side_effects: [] }
  - { method: GET, path: "/customs/export-shipments", description: "List shipments", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: ["client_id?", "status?", "limit?", "offset?"], output: "ExportShipment[]", side_effects: [] }

  # --- DrawbackClaim ---
  - { method: POST, path: "/customs/claims", description: "Create a drawback claim (DRAFT). Client must be ACTIVE; CLOSED period must not overlap same-type non-terminal claims of the client.", roles: [Analyst], code: 201, input: [client_id, claim_type, period_start, period_end], output: DrawbackClaim, side_effects: ["status=DRAFT, prepared_by_user_id := X-User-ID, deficiency_count=0, estimate_cents=0, version=1"] }
  - { method: GET, path: "/customs/claims/{id}", description: "Get claim", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: [], output: DrawbackClaim, side_effects: [] }
  - { method: GET, path: "/customs/claims", description: "List claims", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: ["client_id?", "claim_type?", "status?", "limit?", "offset?"], output: "DrawbackClaim[]", side_effects: [] }
  - { method: PUT, path: "/customs/claims/{id}", description: "Update a DRAFT claim's period or type (OCC via expected_claim_version)", roles: [Analyst], code: 200, input: ["period_start?", "period_end?", "claim_type?", expected_claim_version], output: DrawbackClaim, side_effects: ["version += 1; period overlap re-validated"] }
  - { method: POST, path: "/customs/claims/{id}/lines", description: "Add a matched line to a DRAFT claim; computes drawback_amount_cents per claim type", roles: [Analyst], code: 201, input: [import_entry_id, export_shipment_id, matched_quantity], output: ClaimLine, side_effects: ["entry matched_quantity/unclaimed updated (version += 1); export matched_quantity/value_pool updated (version += 1); claim estimate recomputed (version += 1); entry/export auto-status transitions"] }
  - { method: DELETE, path: "/customs/claims/{id}/lines/{lineId}", description: "Void an ACTIVE line on a DRAFT claim (compensating action)", roles: [Analyst], code: 200, input: [], output: ClaimLine, side_effects: ["line -> VOID; pools and quantities restored; claim estimate recomputed; versions += 1"] }
  - { method: GET, path: "/customs/claim-lines/{id}", description: "Get claim line", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: [], output: ClaimLine, side_effects: [] }
  - { method: GET, path: "/customs/claim-lines", description: "List claim lines", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: ["claim_id?", "import_entry_id?", "export_shipment_id?", "status?", "limit?", "offset?"], output: "ClaimLine[]", side_effects: [] }
  - { method: POST, path: "/customs/claims/{id}/file", description: "File the claim (DRAFT -> FILED); freezes claimed_duty_cents; creates 3 ComplianceRecords", roles: [LicensedBroker], code: 200, input: [], output: DrawbackClaim, side_effects: ["filed_at/filed_by set; claimed frozen; records created; version += 1"] }
  - { method: POST, path: "/customs/claims/{id}/review", description: "Record CBP review outcome", roles: [LicensedBroker], code: 200, input: [outcome, "approved_duty_cents?"], output: DrawbackClaim, side_effects: ["APPROVED: sets approved, accrual recompute; DENIED: voids all lines with pool restoration; DEFICIENCY: deficiency_count += 1; version += 1"] }
  - { method: POST, path: "/customs/claims/{id}/deficiency-response", description: "Respond to a deficiency notice (DEFICIENCY_ISSUED -> FILED)", roles: [Analyst, LicensedBroker, ClientContact], code: 200, input: [], output: DrawbackClaim, side_effects: ["version += 1"] }
  - { method: POST, path: "/customs/claims/{id}/record-payment", description: "Record recovered duty (APPROVED -> PAID); auto-creates Invoice; sets records' retention_until; updates client aggregates", roles: [FirmAdmin], code: 200, input: [paid_duty_cents], output: DrawbackClaim, side_effects: ["paid_at set; Invoice ISSUED created; client lifetime_recovered/accrual recomputed; 3 records retention_until := paid_at + 3y; versions += 1"] }
  - { method: POST, path: "/customs/claims/{id}/cancel", description: "Cancel a DRAFT claim; voids all lines", roles: [Analyst], code: 200, input: [], output: DrawbackClaim, side_effects: ["status=CANCELLED; all ACTIVE lines VOID with pool restoration; version += 1"] }

  # --- TariffMeasure ---
  - { method: POST, path: "/customs/tariff-measures", description: "Publish a tariff measure (exclusion or trade remedy). Half-open window; overlap with same (type,prefix) ACTIVE measure rejected; blocked if it would shrink eligible duty of entries with ACTIVE claim lines.", roles: [FirmAdmin], code: 201, input: [hts_code_prefix, measure_type, surcharge_bps, effective_from, "effective_to?"], output: TariffMeasure, side_effects: ["status=ACTIVE; matching entries' non_drawbackable/eligible/unclaimed recomputed; entry versions += 1"] }
  - { method: GET, path: "/customs/tariff-measures/{id}", description: "Get measure", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: [], output: TariffMeasure, side_effects: [] }
  - { method: GET, path: "/customs/tariff-measures", description: "List measures", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: ["hts_code_prefix?", "measure_type?", "status?", "limit?", "offset?"], output: "TariffMeasure[]", side_effects: [] }
  - { method: POST, path: "/customs/tariff-measures/{id}/revoke", description: "Revoke an ACTIVE measure; recomputes matching entries", roles: [FirmAdmin], code: 200, input: [], output: TariffMeasure, side_effects: ["status=REVOKED; entries recomputed; versions += 1"] }

  # --- Invoice ---
  - { method: GET, path: "/customs/invoices/{id}", description: "Get invoice", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/customs/invoices", description: "List invoices", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: ["client_id?", "claim_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: POST, path: "/customs/invoices/{id}/payments", description: "Record a client payment against an invoice", roles: [FirmAdmin], code: 200, input: [amount_cents], output: Invoice, side_effects: ["amount_paid_cents += amount_cents; status -> PARTIALLY_PAID or PAID at exact balance; version += 1"] }
  - { method: POST, path: "/customs/invoices/{id}/void", description: "Void an unpaid invoice", roles: [ComplianceManager], code: 200, input: [], output: Invoice, side_effects: ["status=VOID; version += 1"] }

  # --- AuditCase ---
  - { method: POST, path: "/customs/audit-cases", description: "Open an audit case (CF-28 / focused assessment / post-payment audit)", roles: [FirmAdmin], code: 201, input: [client_id, "claim_id?", opened_reason, due_date], output: AuditCase, side_effects: ["status=OPENED; client.open_audit_count recomputed; version=1"] }
  - { method: GET, path: "/customs/audit-cases/{id}", description: "Get audit case", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: [], output: AuditCase, side_effects: [] }
  - { method: GET, path: "/customs/audit-cases", description: "List audit cases", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: ["client_id?", "claim_id?", "status?", "limit?", "offset?"], output: "AuditCase[]", side_effects: [] }
  - { method: POST, path: "/customs/audit-cases/{id}/advance", description: "Advance the audit workflow", roles: [ComplianceManager], code: 200, input: [action, "culpability_level?"], output: AuditCase, side_effects: ["state per action; CLOSE_SUSTAINED computes penalty_exposure_cents; open_audit_count recomputed; version += 1"] }

  # --- ComplianceRecord ---
  - { method: GET, path: "/customs/records/{id}", description: "Get record", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: [], output: ComplianceRecord, side_effects: [] }
  - { method: GET, path: "/customs/records", description: "List records", roles: [FirmAdmin, Analyst, LicensedBroker, ComplianceManager, ClientContact], code: 200, input: ["claim_id?", "doc_type?", "status?", "limit?", "offset?"], output: "ComplianceRecord[]", side_effects: [] }
  - { method: POST, path: "/customs/records/{id}/destroy", description: "Certify destruction of an ELIGIBLE record", roles: [ComplianceManager], code: 200, input: [], output: ComplianceRecord, side_effects: ["status=DESTROYED; version += 1"] }

  # --- Ops & clock ---
  - { method: POST, path: "/customs/ops/run_sweep", description: "Ops checkpoint: expire ACTIVE measures whose effective_to <= logical clock; flip RETAINED records with retention_until <= logical clock to ELIGIBLE_FOR_DESTRUCTION", roles: [FirmAdmin], code: 200, input: [], output: "{ expired_measure_ids: string[], eligible_record_ids: string[] }", side_effects: ["measure/record transitions per sweep rules; entry recompute for expired measures"] }
  - { method: POST, path: "/customs/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Server default before any call is exactly 2026-05-01T00:00:00Z; never falls back to wall-clock.", roles: [FirmAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock := to_iso8601"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or ClientContact accessing another client's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, non-positive integer, or missing OCC field" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempted both sides of a segregated step (prepare/file or submit/certify)" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Client engagement_status is SUSPENDED or TERMINATED; claim creation/filing blocked" }
  - { id: ERR_CLASSIFICATION_NOT_CERTIFIED, http: 409, condition: "Referenced classification is not CERTIFIED (entry registration, ruling request)" }
  - { id: ERR_CROSS_CLIENT_REFERENCE, http: 422, condition: "Referenced entity belongs to a different client than the aggregate being written" }
  - { id: ERR_DUPLICATE_ENTRY_NUMBER, http: 409, condition: "entry_number already exists for this client" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "period_end < period_start, or effective_to <= effective_from" }
  - { id: ERR_MEASURE_WINDOW_OVERLAP, http: 409, condition: "Half-open window overlaps another ACTIVE measure with same (measure_type, hts_code_prefix); adjacency (to == from) allowed" }
  - { id: ERR_MEASURE_BLOCKED_BY_CLAIM_LINES, http: 409, condition: "New measure would reduce eligible duty of an entry referenced by ACTIVE claim lines" }
  - { id: ERR_CLAIM_PERIOD_OVERLAP, http: 409, condition: "CLOSED period overlaps another same-type, non-terminal claim of the client; sharing one date counts as overlap" }
  - { id: ERR_FILING_DEADLINE_PASSED, http: 422, condition: "Logical clock is past filing_deadline (earliest line entry_date + 5 years); exact deadline second still allowed" }
  - { id: ERR_DEFICIENCY_LIMIT_REACHED, http: 409, condition: "DEFICIENCY outcome attempted with deficiency_count already == 2" }
  - { id: ERR_MATCH_QUANTITY_EXCEEDED, http: 422, condition: "matched_quantity exceeds remaining units on entry or export; or correction shrinks line_quantity below matched_quantity" }
  - { id: ERR_MATCH_INCOMPATIBLE, http: 422, condition: "DIRECT_IDENTIFICATION line whose export.hts_code != entry.hts_code" }
  - { id: ERR_EXPORT_VALUE_POOL_EXCEEDED, http: 422, condition: "Substitution line raw refund exceeds the export's value_pool_remaining_cents (FOB cap)" }
  - { id: ERR_APPROVED_EXCEEDS_CLAIMED, http: 422, condition: "Review APPROVED with approved_duty_cents > claimed_duty_cents" }
  - { id: ERR_PAID_AMOUNT_MISMATCH, http: 422, condition: "record-payment paid_duty_cents != approved_duty_cents" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Invoice payment amount_cents > balance_cents (exact balance allowed and yields PAID)" }
  - { id: ERR_INVOICE_HAS_PAYMENTS, http: 409, condition: "Void attempted on an invoice with amount_paid_cents > 0" }
  - { id: ERR_RECORD_NOT_ELIGIBLE, http: 409, condition: "Destroy attempted on a record not in ELIGIBLE_FOR_DESTRUCTION" }
  - { id: ERR_RESPONSE_PAST_DUE, http: 422, condition: "Audit FILE_RESPONSE attempted after due_date (exact due_date second still allowed)" }
  - { id: ERR_ENTRY_LOCKED_BY_FILED_CLAIM, http: 409, condition: "Correction attempted on an entry referenced by ACTIVE lines of a non-DRAFT claim" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FirmAdmin
    description: "Consulting-firm administrator: client onboarding, engagement status, measures, payments, ops sweep, clock"
    identity: opaque
    exclusive_operations:
      - "POST /customs/clients"
      - "PATCH /customs/clients/{id}"
      - "POST /customs/tariff-measures"
      - "POST /customs/tariff-measures/{id}/revoke"
      - "POST /customs/invoices/{id}/payments"
      - "POST /customs/claims/{id}/record-payment"
      - "POST /customs/audit-cases"
      - "POST /customs/ops/run_sweep"
      - "POST /customs/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: Analyst
    description: "Trade analyst: classifications (create/submit/supersede), entry and export registration/correction, claim preparation (create/update/lines/cancel), deficiency responses"
    identity: opaque
    exclusive_operations:
      - "POST /customs/classifications"
      - "POST /customs/classifications/{id}/submit"
      - "POST /customs/classifications/{id}/supersede"
      - "POST /customs/import-entries"
      - "POST /customs/import-entries/{id}/correct"
      - "POST /customs/export-shipments"
      - "POST /customs/claims"
      - "PUT /customs/claims/{id}"
      - "POST /customs/claims/{id}/lines"
      - "DELETE /customs/claims/{id}/lines/{lineId}"
      - "POST /customs/claims/{id}/cancel"
    shared_operations:
      - "All GET endpoints"
      - "POST /customs/claims/{id}/deficiency-response"
  - name: LicensedBroker
    description: "Licensed customs broker: certifies classifications, files claims, records rulings and CBP review outcomes. Segregated from preparation steps by X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /customs/classifications/{id}/review-decision"
      - "POST /customs/binding-rulings"
      - "POST /customs/binding-rulings/{id}/outcome"
      - "POST /customs/claims/{id}/file"
      - "POST /customs/claims/{id}/review"
    shared_operations:
      - "All GET endpoints"
      - "POST /customs/claims/{id}/deficiency-response"
  - name: ComplianceManager
    description: "Compliance officer: audit-case advancement, record destruction, invoice voiding"
    identity: opaque
    exclusive_operations:
      - "POST /customs/audit-cases/{id}/advance"
      - "POST /customs/records/{id}/destroy"
      - "POST /customs/invoices/{id}/void"
    shared_operations:
      - "All GET endpoints"
  - name: ClientContact
    description: "Client-side contact; X-User-ID equals the Client.id they belong to. Read-only over own client's data plus deficiency responses."
    identity: entity_backed:Client
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints, restricted to resources whose client_id == X-User-ID (ERR_FORBIDDEN otherwise)"
      - "POST /customs/claims/{id}/deficiency-response (own client's claims only)"
