      - name: parts_billed_round_per_line_then_sum
        grounds:
          - calculations.parts_billed_total
          - entities.Part.fields.line_billed_cents
          - calculations.work_order_final_price
        distinguishing_aspect: "Mode (b) nested rounding: three identical parts (251 x1 @4000bps) round to 351 each per-line -> 1053; sum-then-round of the raw 351.4 products would give 1054, so the pinned per-line-then-sum order is decisive."
        test_recipe:
          setup:
            - "Approved TV_MOUNT pro; base 10000; std-hours 09:00-10:00Z; no add-ons; 3 parts each unit_cost 251 qty 1 markup 4000bps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /retailers"
