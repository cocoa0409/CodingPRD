          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Setting the clock to 2026-04-30 after it already reads 2026-05-06 is refused with ERR_VALIDATION and the clock stays at 2026-05-06."
        test_recipe:
          setup: ["Clock advanced to 2026-05-06."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
