      - name: membership_activate_requires_member_active
        grounds:
          - state_machines.Membership.ENROLLED_to_ACTIVE
          - state_machines.Member.PROSPECT_to_ACTIVE
          - entities.Member.fields.status
        distinguishing_aspect: |
          Entity pair Membership->Member: a Membership ENROLLED->ACTIVE is rejected
          with ERR_INVALID_STATE while its Member is still PROSPECT (not ACTIVE); the
          membership transition's validity depends on the member's state.
