        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_NO_SHARES_OUTSTANDING]"]
        distinguishing_aspect: "A class with shares_outstanding == 0 cannot produce a per-share NAV; the fiscal check fires after the price-availability constraint passes."
        test_recipe:
          setup: ["Fund, class with NO subscription (0 shares), position qty 1000, SUBMITTED price on 2026-08-04"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant }
          trigger:
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_NO_SHARES_OUTSTANDING (http 422)"

      - name: manual_admin_fee_accrual_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CATEGORY_SYSTEM_MANAGED]"]
        distinguishing_aspect: "ADMIN_FEE accruals are generated only by NavRecord creation; manual creation is refused even when an ESTIMATED record exists."
        test_recipe:
