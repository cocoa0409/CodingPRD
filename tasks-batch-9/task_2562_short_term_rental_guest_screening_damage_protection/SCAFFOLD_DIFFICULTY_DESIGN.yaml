          DEPTH-4 chain triggered by a document review (a different trigger from the claim
          decision instance below), each link caused strictly by the previous one:
          review ACCEPT -> accepted_doc_count 1 -> 2 -> verification_state UNVERIFIED ->
          VERIFIED (only once MIN_ACCEPTED_DOCS 2 is met) -> risk_score 35 -> 20 ->
          risk_tier ELEVATED -> LOW.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One guest with an ACCEPTED GOVERNMENT_ID (accepted_doc_count 1, accepted_gov_id_count 1) — still UNVERIFIED because MIN_ACCEPTED_DOCS is 2."
            - "A second document (SELFIE) uploaded and sitting PENDING, so verification_state reads PENDING_REVIEW and risk_score is BASE_RISK 35 in tier ELEVATED."
          setup_api_calls:
