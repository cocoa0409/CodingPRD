  - rule_id: compensating_invariant
    instances:

      - name: party_scoped_ledger_conserves_to_zero_while_the_write_off_survives
        grounds:
          - calculations.case_ledger_reconciliation
          - calculations.withdrawal_refund
          - state_machines.Case.DEFICIENT_to_ADMIN_CLOSED
          - entities.FeeTransaction.fields.amount_cents
          - entities.Case.fields.paid_cents
          - entities.Case.fields.complainant_paid_cents
        distinguishing_aspect: |
          The invariant is sum(FeeTransaction.amount_cents WHERE payer != PROVIDER) == 0 after any
          full-refund close, and it must hold WITHOUT dragging paid_cents to zero: the PROVIDER-
          attributed WRITE_OFF line is deliberately outside the refundable set, so the party subtotals
          conserve to 0 while paid_cents stays at 5000. An implementation that reverses the ledger by
          negating every row, or that decrements the derived fields in place instead of recomputing
          them from the four surviving rows, fails on exactly one of those two numbers.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, then 2026-08-06T00:00:01Z for the sweep."
            - "Registrar IANA-2727 ACTIVE; domain conserve.example under it."
            - "Complainant Conserve NV (country_code FR) files a single-member case on conserve.example with three grounds."
            - "Three ledger rows are recorded before the close: FILING_FEE 150000 COMPLAINANT, a second FILING_FEE 25000 COMPLAINANT top-up, and a WRITE_OFF 5000 attributed to PROVIDER."
            - "A deficiency notice with the default five-day correction period is issued on 2026-08-01 and never cured, so the case sits in DEFICIENT with correction_deadline_at 2026-08-06T00:00:00Z."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Regis Twentyseven", iana_id: "IANA-2727", contact_email: "abuse@registwentyseven.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "conserve.example", registrar_id: "${reg_id}", registrant_name_public: "Conserve Holder", registrant_email_public: "conserve@proxy.example", registration_date: "2019-04-04T00:00:00Z", expiry_date: "2027-04-04T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Conserve NV", country_code: "FR", email: "ip@conserve.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "CONSERVE is a registered Benelux mark.", evidence_count: 1, similarity_claim: "IDENTICAL" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "NO_LEGITIMATE_INTEREST", assertion_text: "No licence exists.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "The name resolves to a competitor.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 150000, reference: "WIRE-2727-A" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { tx_a_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 25000, reference: "WIRE-2727-B" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { tx_b_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "WRITE_OFF", payer: "PROVIDER", amount_cents: 5000, reference: "GOODWILL-2727" }
              as: ProviderAdmin
              captures: { tx_c_id: "$.data.id" }
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { paid_before: "$.data.paid_cents", cpl_paid_before: "$.data.complainant_paid_cents" }
            - call: "POST /udrp/cases/${case_id}/deficiency-notices"
              payload: { deficiency_codes: ["MUTUAL_JURISDICTION_ABSENT"] }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { notice_id: "$.data.id", notice_deadline: "$.data.correction_deadline_at" }
          trigger:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:01Z" }
              as: ProviderAdmin
            - call: "POST /udrp/_ops/deadline-sweep"
              payload: {}
              as: ProviderAdmin
              captures: { expired: "$.data.expired_notice_count", closed: "$.data.closed_case_count" }
            - call: "GET /udrp/cases/${case_id}/fee-transactions"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { row_count: "$.meta.total_count", refund_amount: "$.data[3].amount_cents", refund_payer: "$.data[3].payer" }
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { paid_after: "$.data.paid_cents", cpl_paid_after: "$.data.complainant_paid_cents", resp_paid_after: "$.data.respondent_paid_cents" }
          assert:
            - "Before the sweep: Case.${case_id}.complainant_paid_cents == 175000, respondent_paid_cents == 0, paid_cents == 180000 - the write-off counts in the total but in no party subtotal"
            - "DeficiencyNotice.${notice_id}.correction_deadline_at == 2026-08-06T00:00:00Z and status == OPEN before the sweep"
            - "The sweep returns expired_notice_count == 1 and closed_case_count == 1"
            - "DeficiencyNotice.${notice_id}.status == EXPIRED and Case.${case_id}.status == ADMIN_CLOSED with closed_at == 2026-08-06T00:00:01Z"
            - "Exactly ONE refund row is minted: the ledger holds 4 rows, and the fourth is kind REFUND, payer COMPLAINANT, amount_cents -175000, reference AUTO-CLOSE-REFUND"
            - "No REFUND row is minted for RESPONDENT, whose paid sum was 0, and none for PROVIDER, whose write-off is outside the refundable set"
