            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0654", requested_date_from: "2026-07-08T00:00:00Z", requested_date_to: "2026-07-09T00:00:00Z", scope_narrative: "One hour of BWC video" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "The single one-hour recording", requested_date_from: "2026-07-08T00:00:00Z", requested_date_to: "2026-07-08T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/responsive-records/${rec_id}/redaction-tasks", payload: { target_type: "FACE", clip_start_ms: 0, clip_end_ms: 1200000, assigned_technician_id: "${tech_id}" }, as: RedactionTechnician, as_user_id: "${tech_id}", captures: { task_face_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/redaction-tasks", payload: { target_type: "LICENSE_PLATE", clip_start_ms: 0, clip_end_ms: 1200000, assigned_technician_id: "${tech_id}" }, as: RedactionTechnician, as_user_id: "${tech_id}", captures: { task_plate_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/redaction-tasks", payload: { target_type: "AUDIO_IDENTIFIER", clip_start_ms: 0, clip_end_ms: 1200000, assigned_technician_id: "${tech_id}" }, as: RedactionTechnician, as_user_id: "${tech_id}", captures: { task_audio_id: $.data.id } }
            - { call: "POST /records/redaction-tasks/${task_face_id}/submit-qa", payload: { logged_labor_minutes: 12, qa_reviewer_id: "${reviewer_id}", qa_window_start_at: "2026-08-02T09:00:00Z", qa_window_end_at: "2026-08-02T09:30:00Z" }, as: RedactionTechnician, as_user_id: "${tech_id}" }
