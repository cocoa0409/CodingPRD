          - errors[ERR_ORDER_NOT_SERVED]
          - errors[ERR_REINSPECTION_TOO_EARLY]
          - endpoints[POST /vector-control/inspections]
        distinguishing_aspect: |
          Error-category pair state (priority 8, cross-entity status) versus business_temporal
          (priority 12, window arithmetic): a re-inspection request against an ESCALATED order
          scheduled before its compliance_deadline violates both, and the response must be
          ERR_ORDER_NOT_SERVED, never ERR_REINSPECTION_TOO_EARLY.
