  # ============================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: revolvement_cycle_no_overlap_on_equity_class
        grounds:
          - state_machines.RevolvementCycle.PLANNED_to_OPEN
          - errors[ERR_CYCLE_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [window_start, window_end) on the
          RevolvementCycle resource. Two cycles for the SAME equity_class overlap
          iff windows intersect. Adjacent windows (end == start) do NOT conflict.
          Reachable via POST /coop/revolvement_cycles/{id}/open.
        test_recipe:
          setup:
            - "Cycle CYC-A: QUALIFIED, window [2030-01-01, 2030-06-01), status OPEN"
            - "Cycle CYC-B: QUALIFIED, window [2030-03-01, 2030-09-01), status PLANNED (overlaps CYC-A)"
            - "Cycle CYC-C: QUALIFIED, window [2030-06-01, 2030-12-01), status PLANNED (adjacent to CYC-A, no conflict)"
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2030-01-01T00:00:00Z" }
              as: CoopAdmin
