# §1.9 Scaffold Corner Design — breadth index
# Task 2918 — Reverse Logistics & Returns Processing Center
#
# Section names and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; no new categories are invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs citing the covering §1.8 instance by name.
#
# Shared fixture conventions (identical to §1.8):
#   * The logical clock starts at 2026-08-01T00:00:00Z; instances that need
#     another instant set it explicitly through POST /_clock/set_current_utc.
#   * RMAs use order_placed_at 2026-07-25T00:00:00Z and expires_at
#     2026-09-01T00:00:00Z unless the corner is about expiry, so every
#     ReturnLine gets days_since_order == 7 and late fee band 0.00.
#   * Receipt gross_weight_grams == 200 tare + 1200 per authorized unit unless
#     the corner probes the empty-box threshold.
#   * Pinned opaque X-User-IDs: u_admin, u_clerk, u_grader, u_grader2, u_tech,
#     u_tech2, u_qa, u_super, u_super2, u_analyst. ClientRep's X-User-ID is the
#     Client id itself (identity: entity_backed:Client).
#   * Every intentionally failing call captures $.data.error_id so the expected
#     error is asserted from the response envelope, not inferred.

scaffold_corner_design:

  # =================================================================== #
  # SECTION 1 — entities                                                #
  # =================================================================== #
  - section: entities
    instances:
      - name: corner_client_create_returns_declared_fields_and_zeroed_aggregates
        claim_type: Creation
        grounds:
          - entities.Client
          - endpoints[POST /clients]
          - response_envelope.success
        distinguishing_aspect: "POST /clients with every declared input returns 201 and a body in which status is ACTIVE, all eight unit and money aggregates are 0, and id, created_at, updated_at and version are server-generated."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /clients"
              payload: { name: "Corner Retail", client_code: "CRN1", service_level: "SL_PRIORITY", inventory_ownership: "CENTER_OWNED", restock_grade_floor: "C", refund_hold_hours: 24, liquidation_floor_pct: 0.25, fraud_tolerance_cents: 4000, donation_allowed: true, destroy_requires_dual_signoff: true, max_refund_exposure_cents: 250000 }
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "HTTP 201 with response_type object and data carrying every input echoed unchanged: client_code CRN1, service_level SL_PRIORITY, inventory_ownership CENTER_OWNED, restock_grade_floor C, refund_hold_hours 24, liquidation_floor_pct 0.25, fraud_tolerance_cents 4000, donation_allowed true, destroy_requires_dual_signoff true, max_refund_exposure_cents 250000"
            - "status == ACTIVE and version == 1"
            - "units_received == 0, units_in_process == 0, units_reserved_for_disposition == 0, units_dispositioned == 0, open_rma_count == 0, shrink_ledger_cents == 0, settlement_balance_cents == 0, projected_settlement_balance_cents == 0"
            - "id, created_at and updated_at are present and created_at == 2026-08-01T00:00:00Z (the logical clock, not wall time)"

      - name: corner_client_get_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.Client
          - endpoints[GET /clients/{client_id}]
        distinguishing_aspect: "GET /clients/{client_id} returns exactly the entity POST /clients persisted, with the same id and unchanged version 1."
        test_recipe:
          setup:
            - "One Client created with client_code CRN2."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Read Back Retail", client_code: "CRN2", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 5000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 500000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /clients/${c_id}"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "HTTP 200 with data.id == ${c_id}, client_code CRN2, status ACTIVE, version == 1"
            - "settlement_balance_cents == 0 and projected_settlement_balance_cents == 0 — a read never mutates the entity"

      - name: corner_clients_list_pagination_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /clients]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three Clients stored, GET /clients?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "Exactly three Clients: CRN3A, CRN3B, CRN3C."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Page A", client_code: "CRN3A", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 5000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 500000 }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /clients"
              payload: { name: "Page B", client_code: "CRN3B", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 5000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 500000 }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /clients"
              payload: { name: "Page C", client_code: "CRN3C", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 5000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 500000 }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "GET /clients"
              payload: { limit: 2, offset: 0 }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "GET /clients"
              payload: { limit: 2, offset: 2 }
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "First page: 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second page: 1 row, total_count == 3, offset == 2, has_more == false"
            - "The two pages together contain CRN3A, CRN3B and CRN3C exactly once each"

      - name: corner_client_defaults_applied_when_optional_rules_omitted
        claim_type: Defaults
        grounds:
          - entities.Client.fields.restock_grade_floor
          - entities.Client.fields.max_refund_exposure_cents
          - endpoints[POST /clients]
        distinguishing_aspect: "Omitting all seven optional client rules applies exactly the §1.1 defaults: restock_grade_floor B, refund_hold_hours 48, liquidation_floor_pct 0.30, fraud_tolerance_cents 5000, donation_allowed false, destroy_requires_dual_signoff false, max_refund_exposure_cents 500000."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /clients"
              payload: { name: "Bare Minimum Retail", client_code: "CRN4", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "restock_grade_floor == B"
            - "refund_hold_hours == 48"
            - "liquidation_floor_pct == 0.30"
            - "fraud_tolerance_cents == 5000"
            - "donation_allowed == false"
            - "destroy_requires_dual_signoff == false"
            - "max_refund_exposure_cents == 500000"

      - name: corner_catalog_item_defaults_hazard_none_regulated_false_recall_none
        claim_type: Defaults
        grounds:
          - entities.CatalogItem.fields.hazard_class
          - entities.CatalogItem.fields.regulated_flag
          - entities.CatalogItem.fields.recall_status
          - endpoints[POST /catalog-items]
        distinguishing_aspect: "Omitting hazard_class and regulated_flag yields NONE and false, and recall_status is system-initialised to NONE even though it is not an input at all."
        test_recipe:
          setup:
            - "One Client CRN5."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Catalog Defaults Retail", client_code: "CRN5", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "PLAIN-1", description: "Ordinary SKU", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "HTTP 201 with hazard_class == NONE, regulated_flag == false, recall_status == NONE"
            - "declared_value_cents == 20000 and unit_weight_grams == 1200 echoed unchanged"

      - name: corner_client_create_missing_required_service_level_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /clients]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /clients without service_level — a field with source input and no default — returns 422 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /clients"
              payload: { name: "No Service Level", client_code: "CRN6", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /clients returns total_count == 0 — the rejected request created nothing"

      - name: corner_client_create_undeclared_enum_member_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Client.fields.service_level
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "service_level SL_GOLD is outside the declared enum {SL_STANDARD, SL_PRIORITY, SL_WHITE_GLOVE} and returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /clients"
              payload: { name: "Bad Enum Retail", client_code: "CRN7", service_level: "SL_GOLD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /clients returns total_count == 0"

      - name: corner_processing_bay_buffer_minutes_above_ceiling_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ProcessingBay.fields.buffer_minutes
          - endpoints[POST /processing-bays]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "buffer_minutes 241 breaks the declared `>= 0 and <= 240` range and returns 422 ERR_INVALID_REQUEST, while 240 is accepted."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /processing-bays"
              payload: { bay_code: "GB240", bay_type: "GENERAL", buffer_minutes: 240 }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /processing-bays"
              payload: { bay_code: "GB241", bay_type: "GENERAL", buffer_minutes: 241 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "The 240-minute bay was created with HTTP 201 and buffer_minutes == 240 — the ceiling is inclusive"
            - "The 241-minute request returns HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /processing-bays returns total_count == 1"

      - name: corner_processing_bay_buffer_minutes_default_zero
        claim_type: Defaults
        grounds:
          - entities.ProcessingBay.fields.buffer_minutes
          - endpoints[POST /processing-bays]
        distinguishing_aspect: "Omitting buffer_minutes applies the declared default 0, and status is system-initialised to ACTIVE."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /processing-bays"
              payload: { bay_code: "GB0", bay_type: "GENERAL" }
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "HTTP 201 with buffer_minutes == 0 and status == ACTIVE"
            - "bay_type == GENERAL and version == 1"

      - name: corner_return_line_days_since_order_computed_from_logical_clock
        claim_type: Computed Fields
        grounds:
          - entities.ReturnLine.fields.days_since_order
          - endpoints[POST /receipts/{receipt_id}/lines]
        distinguishing_aspect: "days_since_order is computed by the server from ReturnAuthorization.order_placed_at and the logical clock — 2026-07-25T00:00:00Z against 2026-08-01T00:00:00Z gives exactly 7 — and is not an input field on any endpoint."
        test_recipe:
          setup:
            - "Client CRN8, CatalogItem WIDGET-1 (declared_value_cents 20000, unit_weight_grams 1200), one issued RMA with a single authorized unit, one 1400-gram receipt."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Elapsed Days Retail", client_code: "CRN8", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-2001", customer_reference: "CUST-2001", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_line_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-2001", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
          trigger:
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rma_line_id}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
          assert:
            - "HTTP 201 with days_since_order == 7"
            - "disposition_state == RECEIVED_UNGRADED, financial_state == HOLD_PENDING_DISPOSITION, condition_grade == UNGRADED"
            - "recovery_value_cents == 0 and disposition == PENDING before grading"
            - "fraud_score_receipt == 0 — the EMPTY_BOX check passed at 1400 of 1400 grams and SERIAL_MISMATCH passed because the SKU is not serialized"

      - name: corner_receipt_system_fields_generated_by_server
        claim_type: System Fields
        grounds:
          - entities.Receipt.fields.received_at
          - entities.Receipt.fields.scanned_by_user_id
          - endpoints[POST /receipts]
        distinguishing_aspect: "received_at is stamped from the logical clock (2026-08-01T00:00:00Z) and scanned_by_user_id from X-User-ID (u_clerk); neither is an input field on POST /receipts."
        test_recipe:
          setup:
            - "Client CRN9 with one issued single-unit RMA of a 1200-gram SKU."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "System Fields Retail", client_code: "CRN9", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-2002", customer_reference: "CUST-2002", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-2002", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
          assert:
            - "HTTP 201 with received_at == 2026-08-01T00:00:00Z and scanned_by_user_id == u_clerk"
            - "expected_weight_grams == 1400 and empty_box_suspected == false"
            - "id, created_at, updated_at and version are present with version == 1"

      - name: corner_shrink_ledger_entry_is_immutable_and_has_no_version
        claim_type: Immutability
        grounds:
          - entities.ShrinkLedgerEntry
          - endpoints[POST /return-authorizations/{rma_id}/void]
          - endpoints[GET /shrink-ledger-entries]
          - calculations.shrink_ledger_entry_amount
        distinguishing_aspect: "ShrinkLedgerEntry is declared common_fields false, so the row returned by GET /shrink-ledger-entries/{id} carries no version field and §1.5 exposes no PATCH, PUT or DELETE for it — the only way to reverse a row is to append another."
        test_recipe:
          setup:
            - "Client CRN10 with an ISSUED RMA authorizing 1 unit of a 20000-cent SKU and nothing received, then voided — which appends exactly one RECEIPT_VARIANCE row of -20000."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Immutable Ledger Retail", client_code: "CRN10", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-2003", customer_reference: "CUST-2003", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /return-authorizations/${rma_id}/void"
              payload: { void_reason: "Customer never shipped" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "GET /shrink-ledger-entries"
              payload: { client_id: "${c_id}" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { entry_id: "$.data[0].id" }
            - call: "GET /shrink-ledger-entries/${entry_id}"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "The list returns total_count == 1 with entry_type == RECEIPT_VARIANCE, amount_cents == -20000 (-(1 - 0) * 20000) and sequence_no == 1"
            - "The single-resource read returns the same row with id == ${entry_id} and NO version field, because ShrinkLedgerEntry is declared common_fields false"
            - "§1.5 declares no PATCH, PUT or DELETE on /shrink-ledger-entries — the ledger is append-only"
            - "Client.shrink_ledger_cents == -20000 and settlement_balance_cents == -20000, and status is still ACTIVE because -20000 is above the negated default cap -500000"
            - "ReturnAuthorization.${rma_id}.status == VOID"

      - name: corner_catalog_item_requires_existing_client_parent
        claim_type: Parent Relationships
        grounds:
          - entities.CatalogItem.fields.client_id
          - endpoints[POST /catalog-items]
          - errors.ERR_CLIENT_NOT_FOUND
        distinguishing_aspect: "POST /catalog-items whose client_id names no Client returns 404 ERR_CLIENT_NOT_FOUND rather than creating an orphan SKU."
        test_recipe:
          setup:
            - "One real Client exists (CRN11) so the collection is non-empty; the request deliberately points at an all-zero UUID instead."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Real Parent Retail", client_code: "CRN11", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /catalog-items"
              payload: { client_id: "00000000-0000-0000-0000-000000000000", sku: "ORPHAN-1", description: "Orphan SKU", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_CLIENT_NOT_FOUND"
            - "GET /catalog-items returns total_count == 0"

      - name: corner_receipt_line_rejects_rma_line_belonging_to_another_rma
        claim_type: Parent Relationships
        grounds:
          - validations[priority 18 ERR_LINE_RMA_MISMATCH]
          - endpoints[POST /receipts/{receipt_id}/lines]
          - errors.ERR_LINE_RMA_MISMATCH
        distinguishing_aspect: "Scanning a receipt line whose rma_line_id belongs to a different ReturnAuthorization returns ERR_LINE_RMA_MISMATCH — the flat topology validates the cross-reference instead of trusting the URL."
        test_recipe:
          setup:
            - "Client CRN12 with two separate issued RMAs, each authorizing one unit of the same SKU, and one receipt scanned against the FIRST RMA."
          setup_api_calls:
