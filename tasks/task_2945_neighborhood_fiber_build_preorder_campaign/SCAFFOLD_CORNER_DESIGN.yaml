        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
        distinguishing_aspect: "There is no lag anywhere in the write path: the 201 body of POST /preorders already carries deposit_status HELD, and the very next reads -- with no clock movement and no second write -- show the zone's recomputed prereg_rate_pct, the account's recomputed deposit_held_cents and the appended ledger row."
        test_recipe:
          setup:
            - "One campaign with deposit_amount_cents 1000, one zone with household_count 10, one SERVICEABLE address and one RESIDENT account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "1 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 100 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "SERVICEABLE" }
              as: ProgramManager
            - call: "POST /accounts"
              payload: { full_name: "Ann Reyes", email: "ann@example.com", phone: "+13035550101", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { zv1: $.data.version, rate_before: $.data.prereg_rate_pct }
          trigger:
            - call: "POST /preorders"
              payload: { build_zone_id: "${z1}", service_address_id: "${a1}", account_id: "${acct1}", plan_tier: "GIGABIT_1000", tendered_deposit_cents: 1000, expected_build_zone_version: "${zv1}" }
              as: Subscriber
              as_user_id: "${acct1}"
              captures: { p1: $.data.id, deposit_in_create_body: $.data.deposit_status }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { rate_after: $.data.prereg_rate_pct, count_after: $.data.provisional_qualifying_count, version_after: $.data.version }
            - call: "GET /accounts/${acct1}"
              payload: {}
              as: ProgramManager
              captures: { held_after: $.data.deposit_held_cents }
            - call: "GET /ledger-entries"
              payload: { preorder_id: "${p1}" }
              as: ProgramManager
              captures: { entry_type: "$.data[0].entry_type", entry_amount: "$.data[0].amount_cents" }
          assert:
            - "${rate_before} == 0.00 and ${deposit_in_create_body} == HELD, already correct inside the creating response"
            - "${rate_after} == 10.00 with ${count_after} == 1 and ${version_after} == ${zv1} + 1"
            - "${held_after} == 1000"
            - "${entry_type} == DEPOSIT_HELD with ${entry_amount} == 1000 and total_count 1"
            - "no clock movement and no second write happened between the create and these reads"
