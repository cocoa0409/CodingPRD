      - name: sla_breach_sweep_marks_the_dispatch_and_bumps_only_the_breach_counter
        claim_type: cross_entity
        grounds:
          - state_machines.Dispatch.transitions.ASSIGNED_to_SLA_BREACHED
          - endpoints.POST /operations/nightly-run
          - calculations.dispatch_response_sla
        distinguishing_aspect: "One breach on a threshold of 2: the dispatch must move to SLA_BREACHED (not CANCELLED) with cancellation_reason null, the contractor's counter must reach 1 while its status stays ACTIVE, and because SLA_BREACHED leaves the {ASSIGNED, ACCEPTED, ON_SITE} set the capacity and the 228000 reservation must both release."
        test_recipe:
          setup:
            - "An EMERGENCY claim reported at 2026-09-10T08:00:00.000Z is dispatched manually to Alder Plumbing (hourly_rate_cents 18000), so sla_deadline_at is 08:00 + 4h = 2026-09-10T12:00:00.000Z and estimated_benefit_cents is 6 * 18000 + 120000 = 228000."
            - "The clock is then moved to exactly the deadline and the nightly batch is run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
