  - method: GET
    path: "/packaging-distribution/restock-notifications"
    description: "Filtered list of subscriptions."
    roles: [PlatformAdmin, CustomerService, Buyer]
    code: 200
    input: ["account_id?", "product_id?", "status?", "limit?", "offset?"]
    output: RestockNotification[]
    side_effects: []
  - method: GET
    path: "/packaging-distribution/restock-notifications/{id}"
    description: "Fetch one subscription."
    roles: [PlatformAdmin, CustomerService, Buyer]
    code: 200
    input: []
    output: RestockNotification
    side_effects: []
  - method: POST
    path: "/packaging-distribution/restock-notifications/{id}/cancel"
    description: "Cancel an ACTIVE subscription."
    roles: [Buyer]
    code: 200
    input: []
    output: RestockNotification
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted on this endpoint, or Buyer acting on another account's resource."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed payload: missing required field, bad type, enum violation, numeric range violation (incl. density_pcf < 1, qty < 1, tolerance_pct outside 0..20)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the resource's current state (incl. terminal-state lockdown)."
  - id: ERR_ACCOUNT_SUSPENDED
    http: 409
    condition: "Submit or PO approve attempted on an order whose Account.status == SUSPENDED."
  - id: ERR_ORDER_EMPTY
    http: 422
    condition: "Submit attempted on an order with zero OPEN lines."
  - id: ERR_PO_REQUIRED
    http: 422
    condition: "CORPORATE account with po_required == true submitted an order without po_number."
  - id: ERR_DUPLICATE_PO
    http: 409
    condition: "po_number already used by another order of the same account."
  - id: ERR_CASE_QTY_MISMATCH
    http: 422
    condition: "Line qty not a multiple of Product.case_qty for uom == CASE."
  - id: ERR_ARTWORK_REQUIRED
    http: 422
    condition: "Custom-print line missing print_artwork_ref, or over_under_tolerance_pct outside 0..20."
  - id: ERR_DUPLICATE_SUBSCRIPTION
    http: 409
    condition: "An ACTIVE RestockNotification already exists for (account_id, product_id)."
  - id: ERR_NO_WAREHOUSE_CAPABLE
    http: 422
    condition: "Sourcing selector candidate set empty (requested warehouse inactive/oversize-incapable, or no warehouse stocks the product)."
  - id: ERR_BACKORDER_NOT_ALLOWED
    http: 422
    condition: "Allocation pass cannot cover a line and its Inventory.backorderable == false."
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "PO approve would push open_receivable + grand_total above credit_limit (strictly greater fails; equality passes)."
  - id: ERR_RETURN_WINDOW_EXPIRED
    http: 422
    condition: "Return approve attempted more than 30 calendar days after requested_at."
  - id: ERR_RETURN_LINE_MISMATCH
    http: 422
    condition: "A return line references an OrderLine that does not belong to the return's order_id."
  - id: ERR_CUSTOM_NOT_RETURNABLE
    http: 422
    condition: "STOCK return contains a custom-print line, or CUSTOM return contains a stock line."
  - id: ERR_CUSTOM_PRODUCTION_STARTED
    http: 409
    condition: "Cancel attempted on an order with a custom line whose job has left QUEUED."
  - id: ERR_RETURN_QTY_EXCEEDED
    http: 422
    condition: "Return line qty exceeds shipped_qty minus quantities already on non-REJECTED returns."
  - id: ERR_OVERLAPPING_PRICE_WINDOW
    http: 422
    condition: "A QuantityBreak's [effective_from, effective_to) window overlaps an existing break for the same product with the same min_qty (adjacency is allowed)."
  - id: ERR_PRESS_OCCUPIED
    http: 409
    condition: "Starting the job would exceed Warehouse.press_count overlapping press occupancies at the job's warehouse."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller stand-in used by negative auth tests; admitted by no endpoint (every endpoint requires one of the authenticated roles below)."
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []
  - name: PlatformAdmin
    description: "Platform operator; manages accounts, warehouses, the logical clock, and has broad read access."
    identity: "opaque"
    exclusive_operations:
      - "create/suspend/reactivate/patch accounts"
      - "create/activate/deactivate warehouses"
      - "set logical clock"
    shared_operations:
      - "read accounts, products, warehouses, inventory, orders, returns, notifications"
      - "create inventory rows"
      - "pay invoices"
  - name: CatalogManager
    description: "Owns the catalog: products, quantity breaks, discontinuation."
    identity: "opaque"
    exclusive_operations:
      - "create/update/discontinue products"
      - "manage quantity breaks"
    shared_operations:
      - "read products, warehouses"
  - name: Buyer
    description: "Purchasing user of a corporate/retail account; acts only on own account's orders, returns, subscriptions."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "create orders and order lines"
      - "submit and cancel own orders"
      - "create restock subscriptions"
    shared_operations:
      - "read own account, products, warehouses, own orders/returns/notifications"
      - "request returns"
  - name: AccountApprover
    description: "Approver within a corporate account; approves/rejects PO_REVIEW orders. Segregated: the approver must not be the submitting Buyer."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "approve/reject PO_REVIEW orders"
      - "pay invoices"
    shared_operations:
      - "read own account, products, own orders"
  - name: WarehouseOps
    description: "Distribution-center operator; manages inventory and executes ship/receive/restock steps."
    identity: "opaque"
    exclusive_operations:
      - "receive/adjust inventory"
      - "ship orders"
      - "advance/receive custom print jobs"
      - "receive/restock returns"
    shared_operations:
      - "read products, warehouses, inventory, orders, returns"
      - "create inventory rows"
  - name: CustomerService
    description: "Support agent; approves/rejects returns and reads broadly."
    identity: "opaque"
    exclusive_operations:
      - "approve/reject returns"
    shared_operations:
      - "read accounts, products, warehouses, inventory, orders, returns, notifications"
      - "request returns on behalf of an account"
