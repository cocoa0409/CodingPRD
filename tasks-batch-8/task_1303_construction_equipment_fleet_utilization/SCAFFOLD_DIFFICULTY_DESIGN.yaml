              as: FleetAdmin
              captures: { e6_id: $.data.id, e6_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e6_id}", project_id: "${p6_id}", start_date: "2026-08-03", end_date: "2026-08-07", expected_equipment_version: "${e6_v}" }
              as: FleetAdmin
              captures: { a6_id: $.data.id }
            - call: "POST /fleet/assignments/${a6_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e6_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 8000, fuel_used_milliliters: 4000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e6_id}/readings"
              payload: { recorded_date: "2026-08-04", engine_hours_delta_milli: 8000, fuel_used_milliliters: 4000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e6_id}/readings"
              payload: { recorded_date: "2026-08-05", engine_hours_delta_milli: 0, fuel_used_milliliters: 0 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e6_id}/readings"
              payload: { recorded_date: "2026-08-06", engine_hours_delta_milli: 4000, fuel_used_milliliters: 2000 }
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T09:00:00Z" }
