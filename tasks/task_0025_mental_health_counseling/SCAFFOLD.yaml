scenario: |
  Online mental health counseling platform: counselor qualification certification with professional credential
  verification, supervision-hour records, specialty-field tagging, periodic re-certification, and
  disqualification handling; client appointment with counselor browsing and matching, appointment slot
  booking, appointment confirmation, cancellation and rescheduling rules, and first-visit assessment;
  scheduling and time-slot management with counselor availability configuration, working-hour limits, rest
  interval rules, multi-channel session support (text/audio/video), and time-zone handling; counseling
  records (encrypted) with session note entry, end-to-end encrypted storage, access control by role,
  retention period rules, and authorized export; crisis intervention escalation with risk-keyword detection,
  counselor-triggered escalation, crisis-response team handover, emergency contact notification, and
  follow-up tracking; fee settlement with session-based billing, package deduction, refund rules, counselor
  revenue sharing, tax handling, and periodic payout; supervision evaluation with supervisor assignment,
  case discussion records, supervision-hour accumulation, evaluation reports, and continuing-education
  tracking; event-driven synchronization with payment, IM, and emergency-contact notification systems;
  audit logging for record access and crisis events.

domain_name: mental-health-counseling
api_prefix: /counseling

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: branching_with_parallel_dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Counselor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Counselor display name.
      - name: email
        type: string
        source: input
        description: Login + payout email; unique among counselors.
        constraints: "unique; lowercase"
      - name: license_number
        type: string
        source: input
        description: Government-issued license number.
        constraints: "unique among ACTIVE/SUSPENDED counselors"
      - name: license_expires_at
        type: datetime
        source: input
        description: License expiry; gating field for CertificationCycle approval.
      - name: specialty_tags
        type: array
        source: input
        description: Subset of platform-defined specialty enum values.
        constraints: "non-empty; values IN {ANXIETY, DEPRESSION, TRAUMA, FAMILY, ADDICTION, ADOLESCENT, EATING_DISORDER, GRIEF}"
      - name: supported_channels
        type: array
        source: input
        description: Subset of {TEXT, AUDIO, VIDEO}; clients may only book a channel listed here.
        constraints: "non-empty"
      - name: timezone
        type: string
        source: input
        description: IANA timezone identifier (e.g., America/Los_Angeles); availability slots authored in this zone.
      - name: status
        type: enum
        source: computed
        description: Lifecycle status driven by CertificationCycle outcomes and admin disqualification.
        default: PENDING_CERT
        constraints: "values IN {PENDING_CERT, ACTIVE, SUSPENDED, DISQUALIFIED}"
      - name: revenue_share_bps
        type: integer
        source: input
        description: Counselor share of net session revenue in basis points (e.g., 7000 = 70%).
        default: 7000
        constraints: "0..10000"
      - name: total_supervision_hours
        type: number
        source: computed
        description: Sum of approved SupervisionSession.duration_hours; recomputed on supervision approval.
        default: 0
      - name: total_ce_hours
        type: number
        source: computed
        description: Sum of approved ContinuingEducationRecord.hours_credited; recomputed on CE approval.
        default: 0

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Client display name.
      - name: email
        type: string
        source: input
        description: Unique client email.
        constraints: "unique; lowercase"
      - name: timezone
        type: string
        source: input
        description: IANA timezone for slot rendering.
      - name: emergency_contact_name
        type: string
        source: input
        description: Required for crisis escalation.
      - name: emergency_contact_phone
        type: string
        source: input
        description: E.164 format.
        constraints: "matches /^\\+[1-9][0-9]{6,14}$/"
      - name: assessment_status
        type: enum
        source: computed
        description: First-visit assessment lifecycle; PENDING blocks non-INTAKE bookings.
        default: PENDING
        constraints: "values IN {PENDING, IN_PROGRESS, COMPLETED}"
      - name: package_balance_sessions
        type: integer
        source: computed
        description: Remaining prepaid sessions; debited on Appointment confirmation, credited on refund.
        default: 0
      - name: risk_flag
        type: enum
        source: computed
        description: Aggregated client risk based on most recent CrisisIncident outcomes.
        default: NONE
        constraints: "values IN {NONE, ELEVATED, ACUTE}"

  - name: CertificationCycle
    parent: null
    common_fields: true
    fields:
      - name: counselor_id
        type: string
        source: input
        description: FK -> Counselor.id.
      - name: cycle_index
        type: integer
        source: system
        description: Monotone counter per counselor starting at 1.
      - name: required_supervision_hours
        type: number
        source: system
        description: Hours required to approve this cycle.
        default: 40
        constraints: "frozen at cycle creation; for cycle 1 = 40, for cycles >=2 = 20"
      - name: required_ce_hours
        type: number
        source: system
        description: Continuing-education hours required.
        default: 12
      - name: window_start_at
        type: datetime
        source: system
        description: Counts approved supervision/CE records dated within [window_start_at, window_end_at].
      - name: window_end_at
        type: datetime
        source: system
        description: Cycle deadline; cycle 1 = counselor.created_at + 365d, subsequent cycles = previous_window_end_at + 730d.
      - name: status
        type: enum
        source: computed
        description: Cycle lifecycle.
        default: OPEN
        constraints: "values IN {OPEN, UNDER_REVIEW, APPROVED, EXPIRED, REJECTED}"
      - name: decided_at
        type: datetime
        source: computed
        description: Set when admin approves/rejects or sweep marks EXPIRED.
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: PlatformAdmin opaque id; null for sweep-driven EXPIRED.
        default: null

  - name: AvailabilitySlot
    parent: null
    common_fields: true
    fields:
      - name: counselor_id
        type: string
        source: input
        description: FK -> Counselor.id.
      - name: start_at
        type: datetime
        source: input
        description: Slot start (UTC); duration is fixed at 60 min.
      - name: end_at
        type: datetime
        source: input
        description: Slot end (UTC); MUST equal start_at + 60 min.
      - name: channel
        type: enum
        source: input
        description: Session channel.
        constraints: "values IN {TEXT, AUDIO, VIDEO}; MUST be in counselor.supported_channels"
      - name: status
        type: enum
        source: computed
        description: Slot lifecycle.
        default: OPEN
        constraints: "values IN {OPEN, HELD, BOOKED, BLOCKED, RELEASED}"
      - name: held_until
        type: datetime
        source: computed
        description: Hold expiry timestamp (start_at + held = +15 min after hold creation); auto-released on sweep.
        default: null
      - name: held_appointment_id
        type: string
        source: computed
        description: FK -> Appointment.id during HELD/BOOKED states.
        default: null

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: counselor_id
        type: string
        source: input
        description: FK -> Counselor.id.
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id.
      - name: slot_id
        type: string
        source: computed
        description: FK -> AvailabilitySlot.id (current slot; updated on reschedule).
      - name: appointment_type
        type: enum
        source: input
        description: First-visit INTAKE before any other type is allowed.
        constraints: "values IN {INTAKE, STANDARD, FOLLOW_UP}"
      - name: channel
        type: enum
        source: computed
        description: Mirrors current slot.channel.
        constraints: "values IN {TEXT, AUDIO, VIDEO}"
      - name: status
        type: enum
        source: computed
        description: Appointment lifecycle.
        default: HOLD
        constraints: "values IN {HOLD, CONFIRMED, IN_SESSION, COMPLETED, CANCELLED, NO_SHOW, RESCHEDULED}"
      - name: payment_mode
        type: enum
        source: input
        description: How the session is paid.
        constraints: "values IN {PAY_PER_SESSION, PACKAGE}"
      - name: list_price_cents
        type: integer
        source: system
        description: Frozen platform list price at confirmation; default 12000 (USD cents).
        default: 12000
      - name: refund_state
        type: enum
        source: computed
        description: Refund eligibility tracking.
        default: NONE
        constraints: "values IN {NONE, FULL_REFUNDED, PARTIAL_REFUNDED, NON_REFUNDABLE}"
      - name: cancellation_reason
        type: enum
        source: computed
        description: Recorded on transition to CANCELLED/NO_SHOW.
        default: null
        constraints: "values IN {CLIENT_CANCEL, COUNSELOR_CANCEL, CRISIS_HANDOVER, NO_SHOW_AUTO}"
      - name: confirmed_at
        type: datetime
        source: computed
        default: null
      - name: started_at
        type: datetime
        source: computed
        default: null
      - name: ended_at
        type: datetime
        source: computed
        default: null

  - name: CounselingRecord
    parent: null
    common_fields: false
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; unique (one record per appointment).
        constraints: "unique"
      - name: counselor_id
        type: string
        source: system
        description: Mirrored from Appointment.counselor_id at creation; immutable.
      - name: client_id
        type: string
        source: system
        description: Mirrored from Appointment.client_id at creation; immutable.
      - name: encrypted_note_blob
        type: string
        source: input
        description: Server stores ciphertext only; encrypted with per-record content key.
        constraints: "non-empty; ciphertext base64; decryption never returned in list responses"
      - name: content_key_wrapped
        type: string
        source: system
        description: Per-record content key wrapped by platform KMS; never returned to client.
      - name: redaction_status
        type: enum
        source: computed
        description: PURGED when retention expires (encrypted_note_blob set to null).
        default: ACTIVE
        constraints: "values IN {ACTIVE, PURGED}"
      - name: retention_expires_at
        type: datetime
        source: system
        description: created_at + 7 years (default); used by retention sweep.
      - name: last_accessed_at
        type: datetime
        source: computed
        description: Updated on every authorized read; null until first read.
        default: null

  - name: CrisisIncident
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; the session during which the incident was detected.
      - name: client_id
        type: string
        source: system
        description: Mirrored from appointment at creation.
      - name: detection_source
        type: enum
        source: input
        description: How the incident was raised.
        constraints: "values IN {KEYWORD_DETECTOR, COUNSELOR_TRIGGERED}"
      - name: trigger_keyword
        type: string
        source: input
        description: Required when detection_source = KEYWORD_DETECTOR; the matched phrase.
        default: null
      - name: severity
        type: enum
        source: computed
        description: Severity assigned at handover.
        default: MEDIUM
        constraints: "values IN {LOW, MEDIUM, HIGH}"
      - name: status
        type: enum
        source: computed
        description: Incident lifecycle.
        default: DETECTED
        constraints: "values IN {DETECTED, HANDED_OVER, EMERGENCY_NOTIFIED, FOLLOW_UP_SCHEDULED, RESOLVED}"
      - name: assigned_responder_id
        type: string
        source: computed
        description: CrisisResponder opaque id; set on HANDED_OVER.
        default: null
      - name: handover_at
        type: datetime
        source: computed
        default: null
      - name: emergency_notified_at
        type: datetime
        source: computed
        description: Set when emergency-contact notification dispatched.
        default: null
      - name: follow_up_due_at
        type: datetime
        source: computed
        description: Required follow-up by handover_at + 72 hours.
        default: null
      - name: follow_up_completed_at
        type: datetime
        source: computed
        default: null

  - name: SettlementLedger
    parent: null
    common_fields: false
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; unique per appointment per direction.
      - name: direction
        type: enum
        source: input
        description: CHARGE on confirmation; REFUND on refund-yielding cancellation.
        constraints: "values IN {CHARGE, REFUND}; (appointment_id, direction) unique"
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Pre-tax amount; positive for CHARGE, negative for REFUND.
      - name: tax_cents
        type: integer
        source: computed
        description: Tax computed at TAX_BPS; positive for CHARGE, negative for REFUND.
      - name: counselor_share_cents
        type: integer
        source: computed
        description: Counselor portion of gross_amount_cents using counselor.revenue_share_bps; mirrored sign.
      - name: platform_share_cents
        type: integer
        source: computed
        description: Platform portion = gross_amount_cents - counselor_share_cents; mirrored sign.
      - name: payout_id
        type: string
        source: computed
        description: FK -> Payout.id; null until rolled up.
        default: null

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: counselor_id
        type: string
        source: input
        description: FK -> Counselor.id.
      - name: period_start_at
        type: datetime
        source: input
        description: Inclusive lower bound; rolls up SettlementLedger entries with appointments.ended_at in window.
      - name: period_end_at
        type: datetime
        source: input
        description: Exclusive upper bound.
      - name: total_counselor_share_cents
        type: integer
        source: computed
        description: Sum of counselor_share_cents on linked ledger rows.
      - name: total_tax_cents
        type: integer
        source: computed
        description: Sum of tax_cents.
      - name: status
        type: enum
        source: computed
        description: Payout lifecycle.
        default: PENDING
        constraints: "values IN {PENDING, PAID, REVERSED}"
      - name: paid_at
        type: datetime
        source: computed
        default: null

  - name: SupervisionSession
    parent: null
    common_fields: true
    fields:
      - name: counselor_id
        type: string
        source: input
        description: FK -> Counselor.id; the counselor being supervised.
      - name: supervisor_id
        type: string
        source: input
        description: FK -> Counselor.id; MUST satisfy supervisor.specialty_tags overlap counselor.specialty_tags AND supervisor.id != counselor.id.
      - name: case_appointment_id
        type: string
        source: input
        description: FK -> Appointment.id (must be COMPLETED and counselor's own).
      - name: scheduled_at
        type: datetime
        source: input
        description: Supervision discussion timestamp.
      - name: duration_hours
        type: number
        source: input
        description: Reported duration; counted toward CertificationCycle.required_supervision_hours when APPROVED.
        constraints: ">= 0.5 and <= 4.0"
      - name: discussion_notes
        type: string
        source: input
        description: Plaintext supervision notes (no PHI per policy).
      - name: evaluation_score
        type: integer
        source: input
        description: Supervisor's rating 1..5; required at APPROVED transition.
        default: null
        constraints: "1..5 when status=APPROVED"
      - name: status
        type: enum
        source: computed
        description: Supervision review lifecycle.
        default: PENDING_REVIEW
        constraints: "values IN {PENDING_REVIEW, APPROVED, REJECTED}"

  - name: ContinuingEducationRecord
    parent: null
    common_fields: true
    fields:
      - name: counselor_id
        type: string
        source: input
        description: FK -> Counselor.id.
      - name: course_title
        type: string
        source: input
        description: Course identifier.
      - name: completed_at
        type: datetime
        source: input
        description: Course completion date.
      - name: hours_claimed
        type: number
        source: input
        description: Hours the counselor claims for the course.
        constraints: "0 < hours_claimed <= 40"
      - name: hours_credited
        type: number
        source: computed
        description: Hours actually credited after admin approval; equals hours_claimed when APPROVED, 0 otherwise.
        default: 0
      - name: status
        type: enum
        source: computed
        description: CE review lifecycle.
        default: PENDING_REVIEW
        constraints: "values IN {PENDING_REVIEW, APPROVED, REJECTED}"

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: enum
        source: system
        description: Role of the requester.
        constraints: "values IN {Client, Counselor, Supervisor, CrisisResponder, PlatformAdmin}"
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID at time of action.
      - name: action
        type: enum
        source: system
        description: Auditable action category.
        constraints: "values IN {RECORD_READ, RECORD_EXPORT, RECORD_PURGE, CRISIS_DETECTED, CRISIS_HANDOVER, CRISIS_NOTIFY, COUNSELOR_DISQUALIFIED, RECERT_DECISION}"
      - name: target_entity
        type: string
        source: system
        description: e.g., "CounselingRecord", "CrisisIncident".
      - name: target_id
        type: string
        source: system
        description: FK string; polymorphic across entities.
      - name: payload_summary
        type: object
        source: system
        description: Small JSON object with action-specific keys (no PHI; ciphertext refs only).

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Counselor
    initial_state: PENDING_CERT
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PENDING_CERT
        to: ACTIVE
        trigger: "CertificationCycle.cycle_index=1 transitions OPEN->APPROVED (POST /certification-cycles/{id}/approve)"
        actor: PlatformAdmin
        preconditions:
          - "Counselor.license_expires_at > now()"
          - "CertificationCycle.cycle_index = 1 belongs to this counselor and reaches APPROVED"
        side_effects:
          - "Counselor.status := ACTIVE"
          - "Counselor.updated_at refreshed"
          - "AuditLogEntry(action=RECERT_DECISION) appended"
        note: "Cycle-1 approval gates first ACTIVE."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "Retention/cycle sweep marks active CertificationCycle EXPIRED (POST /_sweep/recert)"
        actor: system
        preconditions:
          - "Counselor.status = ACTIVE"
          - "CertificationCycle.status transitions to EXPIRED for this counselor"
        side_effects:
          - "Counselor.status := SUSPENDED"
          - "All AvailabilitySlot rows of this counselor with status=OPEN auto-transition to BLOCKED"
          - "Pending Appointments in HOLD by this counselor auto-CANCELLED with cancellation_reason=COUNSELOR_CANCEL (cascade depth 2)"
          - "CONFIRMED appointments in the future remain (admin must manually cancel)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "Subsequent CertificationCycle reaches APPROVED (POST /certification-cycles/{id}/approve)"
        actor: PlatformAdmin
        preconditions:
          - "Counselor has CertificationCycle in APPROVED with cycle_index = (max prior cycle_index + 1)"
          - "Counselor.license_expires_at > now()"
        side_effects:
          - "Counselor.status := ACTIVE"
          - "BLOCKED slots are NOT auto-restored (counselor must re-create)"
      - from: ACTIVE
        to: DISQUALIFIED
        trigger: "POST /counselors/{id}/disqualify"
        actor: PlatformAdmin
        preconditions:
          - "Counselor.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "Counselor.status := DISQUALIFIED"
          - "All counselor-owned AvailabilitySlot rows (status IN {OPEN, HELD}) -> RELEASED"
          - "All counselor-owned Appointments in HOLD -> CANCELLED (cancellation_reason=COUNSELOR_CANCEL); CONFIRMED future Appointments -> CANCELLED with refund_state=FULL_REFUNDED and SettlementLedger REFUND row created (cascade depth 3: Counselor->Appointment->SettlementLedger)"
          - "AuditLogEntry(action=COUNSELOR_DISQUALIFIED) appended"
      - from: SUSPENDED
        to: DISQUALIFIED
        trigger: "POST /counselors/{id}/disqualify"
        actor: PlatformAdmin
        preconditions: ["Counselor.status = SUSPENDED"]
        side_effects:
          - "Same cascade as ACTIVE -> DISQUALIFIED"

  - entity: CertificationCycle
    initial_state: OPEN
    terminal_states: [APPROVED, EXPIRED, REJECTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /certification-cycles/{id}/submit"
        actor: Counselor
        preconditions:
          - "now() < window_end_at"
          - "Counselor.total_supervision_hours within [window_start_at, window_end_at] >= required_supervision_hours"
          - "Counselor.total_ce_hours within window >= required_ce_hours"
          - "Counselor.license_expires_at > now()"
        side_effects: ["status := UNDER_REVIEW"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /certification-cycles/{id}/approve"
        actor: PlatformAdmin
        preconditions: ["status = UNDER_REVIEW"]
        side_effects:
          - "decided_at := now(); decided_by_user_id := X-User-ID"
          - "Counselor.status transitions per Counselor state machine (PENDING_CERT->ACTIVE or SUSPENDED->ACTIVE)"
          - "Next CertificationCycle auto-created in OPEN with cycle_index += 1, window_start_at = this.window_end_at, window_end_at = this.window_end_at + 730d, required_supervision_hours = 20, required_ce_hours = 12 (cascade depth 3)"
          - "AuditLogEntry(action=RECERT_DECISION, decision=APPROVED)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /certification-cycles/{id}/reject"
        actor: PlatformAdmin
        preconditions: ["status = UNDER_REVIEW"]
        side_effects:
          - "decided_at, decided_by_user_id set"
          - "Counselor remains in current status (no auto-suspension on REJECTED unless EXPIRED)"
          - "No new cycle auto-created; counselor must POST /counselors/{id}/certification-cycles to start a new one"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /_sweep/recert (system sweep when now() >= window_end_at AND status=OPEN)"
        actor: system
        preconditions: ["now() >= window_end_at", "status = OPEN"]
        side_effects:
          - "decided_at := now(); decided_by_user_id := null"
          - "If counselor.status=ACTIVE -> ACTIVE->SUSPENDED transition fires (cross-entity cascade)"
          - "AuditLogEntry(action=RECERT_DECISION, decision=EXPIRED)"
      - from: UNDER_REVIEW
        to: EXPIRED
        trigger: "POST /_sweep/recert"
        actor: system
        preconditions: ["now() >= window_end_at + 14d", "status = UNDER_REVIEW (admin failed to act)"]
        side_effects: ["Same as OPEN->EXPIRED"]

  - entity: AvailabilitySlot
    initial_state: OPEN
    terminal_states: [BOOKED, RELEASED, BLOCKED]
    transitions:
      - from: OPEN
        to: HELD
        trigger: "POST /appointments (creates Appointment in HOLD)"
        actor: Client
        preconditions:
          - "Counselor.status = ACTIVE"
          - "now() < start_at - 1 hour"
          - "client.assessment_status = COMPLETED OR appointment_type = INTAKE"
          - "channel IN counselor.supported_channels"
          - "No working-hour or rest-interval violation (see Validation V-201/V-202)"
        side_effects:
          - "status := HELD"
          - "held_until := now() + 15m"
          - "held_appointment_id := new Appointment.id"
      - from: HELD
        to: BOOKED
        trigger: "POST /appointments/{id}/confirm"
        actor: Client
        preconditions:
          - "now() < held_until"
          - "Linked Appointment.status = HOLD"
          - "Payment authorization succeeded (PAY_PER_SESSION) OR client.package_balance_sessions >= 1 (PACKAGE)"
        side_effects:
          - "status := BOOKED"
          - "Linked Appointment.status := CONFIRMED, confirmed_at := now()"
          - "If PACKAGE: client.package_balance_sessions -= 1"
          - "SettlementLedger CHARGE row inserted (cascade depth 2: Slot->Appointment->Ledger)"
      - from: HELD
        to: OPEN
        trigger: "POST /_sweep/holds (now() >= held_until) OR POST /appointments/{id}/cancel while in HOLD"
        actor: system
        preconditions: ["status = HELD"]
        side_effects:
          - "Linked Appointment.status := CANCELLED, cancellation_reason := CLIENT_CANCEL or NO_SHOW_AUTO"
          - "held_until := null; held_appointment_id := null"
      - from: BOOKED
        to: RELEASED
        trigger: "POST /appointments/{id}/cancel (CONFIRMED->CANCELLED) OR POST /appointments/{id}/reschedule"
        actor: Client | Counselor | PlatformAdmin
        preconditions: ["Linked Appointment transitions out of CONFIRMED"]
        side_effects:
          - "status := RELEASED (cannot be re-OPENED; counselor must create a new slot)"
      - from: OPEN
        to: BLOCKED
        trigger: "Counselor SUSPENDED/DISQUALIFIED cascade"
        actor: system
        preconditions: ["Counselor.status changes to SUSPENDED or DISQUALIFIED"]
        side_effects: ["status := BLOCKED"]
      - from: HELD
        to: RELEASED
        trigger: "Counselor DISQUALIFIED cascade"
        actor: system
        preconditions: ["Counselor.status -> DISQUALIFIED"]
        side_effects:
          - "Linked Appointment.status := CANCELLED with cancellation_reason = COUNSELOR_CANCEL"

  - entity: Appointment
    initial_state: HOLD
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: HOLD
        to: CONFIRMED
        trigger: "POST /appointments/{id}/confirm"
        actor: Client
        preconditions:
          - "Slot.status = HELD AND now() < slot.held_until"
          - "Counselor.status = ACTIVE"
          - "Payment authorized OR package balance >= 1"
        side_effects:
          - "confirmed_at := now()"
          - "Slot.status := BOOKED"
          - "SettlementLedger CHARGE row created"
          - "If client.assessment_status = PENDING and appointment_type = INTAKE: client.assessment_status := IN_PROGRESS"
      - from: HOLD
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel OR POST /_sweep/holds expiry"
        actor: Client | system
        preconditions: ["status = HOLD"]
        side_effects:
          - "cancellation_reason := CLIENT_CANCEL or NO_SHOW_AUTO"
          - "Slot.status := OPEN (sweep) or RELEASED (manual)"
          - "No SettlementLedger entry"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Client | Counselor | PlatformAdmin
        preconditions: ["status = CONFIRMED"]
        side_effects:
          - "cancellation_reason set"
          - "Slot.status := RELEASED"
          - "Refund evaluated per calculation rule appointment_refund (refund_state set)"
          - "If refund_state IN {FULL_REFUNDED, PARTIAL_REFUNDED}: SettlementLedger REFUND row inserted; if PACKAGE: client.package_balance_sessions += 1 (cascade depth 3: Appointment->Ledger->Client.balance)"
      - from: CONFIRMED
        to: RESCHEDULED
        trigger: "POST /appointments/{id}/reschedule"
        actor: Client | Counselor
        preconditions:
          - "now() < confirmed.start_at - 24h"
          - "New slot exists and passes the same booking validations"
        side_effects:
          - "Old slot RELEASED; new Slot HELD->BOOKED in single operation"
          - "appointment.status returns to CONFIRMED with slot_id replaced (transient RESCHEDULED state visible during operation)"
          - "No refund; no new charge if list price unchanged. If list price changed, ERR_PRICE_DRIFT (must cancel + rebook)"
        note: "RESCHEDULED is a transient bookkeeping state; the operation completes by returning to CONFIRMED on the new slot."
      - from: CONFIRMED
        to: IN_SESSION
        trigger: "POST /appointments/{id}/start"
        actor: Counselor
        preconditions:
          - "now() >= start_at - 5m AND now() < start_at + 15m"
          - "Counselor.status = ACTIVE"
        side_effects: ["started_at := now()"]
      - from: IN_SESSION
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Counselor
        preconditions:
          - "CounselingRecord exists for this appointment_id"
        side_effects:
          - "ended_at := now()"
          - "If client.assessment_status = IN_PROGRESS AND appointment_type = INTAKE: client.assessment_status := COMPLETED"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /_sweep/no-show (now() >= start_at + 30m AND status = CONFIRMED)"
        actor: system
        preconditions: ["status = CONFIRMED", "now() >= start_at + 30m"]
        side_effects:
          - "cancellation_reason := NO_SHOW_AUTO"
          - "refund_state := NON_REFUNDABLE"
          - "Slot.status := RELEASED"
      - from: IN_SESSION
        to: CANCELLED
        trigger: "POST /crisis-incidents (CrisisIncident raised mid-session escalates to handover)"
        actor: Counselor | system
        preconditions: ["CrisisIncident transitions to HANDED_OVER for this appointment"]
        side_effects:
          - "cancellation_reason := CRISIS_HANDOVER"
          - "refund_state := FULL_REFUNDED; SettlementLedger REFUND created"
          - "If PACKAGE: client.package_balance_sessions += 1"

  - entity: CrisisIncident
    initial_state: DETECTED
    terminal_states: [RESOLVED]
    transitions:
      - from: DETECTED
        to: HANDED_OVER
        trigger: "POST /crisis-incidents/{id}/handover"
        actor: CrisisResponder
        preconditions:
          - "status = DETECTED"
          - "X-User-Role = CrisisResponder"
        side_effects:
          - "assigned_responder_id := X-User-ID; handover_at := now()"
          - "follow_up_due_at := now() + 72h"
          - "Linked Appointment IN_SESSION -> CANCELLED (cancellation_reason=CRISIS_HANDOVER) - cross-entity cascade"
          - "AuditLogEntry(action=CRISIS_HANDOVER) appended"
      - from: HANDED_OVER
        to: EMERGENCY_NOTIFIED
        trigger: "POST /crisis-incidents/{id}/notify-emergency"
        actor: CrisisResponder
        preconditions:
          - "status = HANDED_OVER"
          - "Severity IN {MEDIUM, HIGH}"
          - "Client.emergency_contact_phone present"
        side_effects:
          - "emergency_notified_at := now()"
          - "AuditLogEntry(action=CRISIS_NOTIFY) appended"
          - "Event-bus emits emergency_contact_notify event (logged in audit; external sync)"
      - from: EMERGENCY_NOTIFIED
        to: FOLLOW_UP_SCHEDULED
        trigger: "POST /crisis-incidents/{id}/schedule-follow-up"
        actor: CrisisResponder
        preconditions: ["status = EMERGENCY_NOTIFIED"]
        side_effects:
          - "follow_up_due_at refreshed if explicit due date supplied"
      - from: HANDED_OVER
        to: FOLLOW_UP_SCHEDULED
        trigger: "POST /crisis-incidents/{id}/schedule-follow-up (when severity=LOW, emergency notify skipped)"
        actor: CrisisResponder
        preconditions: ["status = HANDED_OVER", "severity = LOW"]
        side_effects: ["follow_up_due_at recorded"]
      - from: FOLLOW_UP_SCHEDULED
        to: RESOLVED
        trigger: "POST /crisis-incidents/{id}/resolve"
        actor: CrisisResponder
        preconditions:
          - "status = FOLLOW_UP_SCHEDULED"
          - "follow_up_completed_at supplied (must be <= now())"
        side_effects:
          - "follow_up_completed_at := provided value"
          - "Update Client.risk_flag per calculation client_risk_flag_recompute"

  - entity: SupervisionSession
    initial_state: PENDING_REVIEW
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /supervision-sessions/{id}/approve"
        actor: Supervisor
        preconditions:
          - "X-User-ID = SupervisionSession.supervisor_id"
          - "evaluation_score IN 1..5"
        side_effects:
          - "Counselor.total_supervision_hours += duration_hours (only counts within current CertificationCycle window) - cascade depth 2: SupervisionSession -> Counselor.total_supervision_hours"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /supervision-sessions/{id}/reject"
        actor: Supervisor
        preconditions:
          - "X-User-ID = SupervisionSession.supervisor_id"
        side_effects: ["status := REJECTED; no hour accumulation"]

  - entity: ContinuingEducationRecord
    initial_state: PENDING_REVIEW
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /ce-records/{id}/approve"
        actor: PlatformAdmin
        preconditions: ["status = PENDING_REVIEW"]
        side_effects:
          - "hours_credited := hours_claimed"
          - "Counselor.total_ce_hours += hours_claimed (only within current CertificationCycle window)"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /ce-records/{id}/reject"
        actor: PlatformAdmin
        preconditions: ["status = PENDING_REVIEW"]
        side_effects: ["hours_credited := 0"]

  - entity: Payout
    initial_state: PENDING
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /payouts/{id}/mark-paid"
        actor: PlatformAdmin
        preconditions:
          - "All linked SettlementLedger rows exist (no orphan refunds in window)"
          - "Counselor.status != DISQUALIFIED"
        side_effects:
          - "paid_at := now()"
          - "Linked SettlementLedger.payout_id remain; ledger rows immutable"
      - from: PAID
        to: REVERSED
        trigger: "POST /payouts/{id}/reverse"
        actor: PlatformAdmin
        preconditions: ["status = PAID", "now() < paid_at + 7d"]
        side_effects:
          - "Linked SettlementLedger rows are NOT deleted; a new Payout in PENDING is auto-created with the same window once issues resolved (admin must POST /payouts again)"

  - entity: CounselingRecord
    initial_state: ACTIVE
    terminal_states: [PURGED]
    transitions:
      - from: ACTIVE
        to: PURGED
        trigger: "POST /_sweep/retention (when retention_expires_at <= now())"
        actor: system
        preconditions: ["now() >= retention_expires_at", "redaction_status = ACTIVE"]
        side_effects:
          - "encrypted_note_blob := null; content_key_wrapped := null; redaction_status := PURGED"
          - "AuditLogEntry(action=RECORD_PURGE) appended"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two clients race to HOLD the same AvailabilitySlot"
    guarantee: "At most one client transitions Slot OPEN->HELD; loser is rejected"
    error_id: ERR_SLOT_TAKEN
    http_status: 409
    serialization: "First-writer-wins on AvailabilitySlot.status"

  - scenario: "Confirm and cancel race on the same Appointment in HOLD"
    guarantee: "Exactly one of (confirm, cancel) succeeds; loser sees the new state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Appointment.status; OCC version increments"

  - scenario: "Two SupervisionSession approvals race for the same session"
    guarantee: "At most one APPROVED per SupervisionSession.id; loser rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on SupervisionSession.status"

  - scenario: "Concurrent disqualification of a counselor while a confirm is in flight"
    guarantee: "If disqualify wins, the in-flight confirm fails because counselor is no longer ACTIVE"
    error_id: ERR_COUNSELOR_NOT_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on Counselor.status"

  - scenario: "Two POST /counseling-records create attempts for the same appointment"
    guarantee: "At most one CounselingRecord per appointment_id"
    error_id: ERR_RECORD_ALREADY_EXISTS
    http_status: 409
    serialization: "Unique constraint on CounselingRecord.appointment_id"

  - scenario: "CrisisIncident handover race — two CrisisResponders both POST /handover"
    guarantee: "Only one responder is recorded; loser rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on CrisisIncident.status"

  - scenario: "Reschedule race against the appointment start window crossing T-24h"
    guarantee: "If now() crosses confirmed.start_at - 24h before reschedule lands, reschedule rejected"
    error_id: ERR_RESCHEDULE_WINDOW_CLOSED
    http_status: 409
    serialization: "Reschedule rechecks now() < start_at - 24h after acquiring lock"

  - scenario: "Two payout creations for the same counselor and overlapping windows"
    guarantee: "At most one PENDING Payout per (counselor_id, period)"
    error_id: ERR_PAYOUT_WINDOW_OVERLAP
    http_status: 409
    serialization: "Range check on (counselor_id, period_start_at, period_end_at) before insert"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: appointment_refund
    trigger: "Appointment CONFIRMED -> CANCELLED (POST /appointments/{id}/cancel)"
    algorithm: threshold
    formula: |
      hours_to_start = (start_at - now()) / 1 hour
      if cancellation_reason == COUNSELOR_CANCEL or cancellation_reason == CRISIS_HANDOVER:
          refund_state := FULL_REFUNDED
          refund_gross := list_price_cents
      elif cancellation_reason == CLIENT_CANCEL:
          if hours_to_start >= 24:
              refund_state := FULL_REFUNDED
              refund_gross := list_price_cents
          elif hours_to_start >= 2:
              refund_state := PARTIAL_REFUNDED
              refund_gross := round_half_up(list_price_cents * 0.50)   # exact-half = 0.50
          else:
              refund_state := NON_REFUNDABLE
              refund_gross := 0
      tax_refund_cents := round_half_up(refund_gross * TAX_BPS / 10000)
      counselor_share_refund := round_half_up(refund_gross * counselor.revenue_share_bps / 10000)
      platform_share_refund := refund_gross - counselor_share_refund
    input_set: "Single Appointment row at the moment of cancellation."
    constants:
      TAX_BPS: 875                # 8.75%
      ROUNDING: round_half_up
    precision: "cents (integer); halves rounded up; per-component rounding (rounding-order matters)"
    variants:
      - name: forward_refund_estimate
        when: "GET /appointments/{id}/refund-estimate (read-only forecast)"
        difference: |
          forward_refund_estimate computes refund based on (CLIENT_CANCEL hypothesis) using NOW = request time;
          appointment_refund (final) uses NOW = transition time. Boundary case: at hours_to_start exactly 24
          the forward estimate may say FULL while the final transition lands at PARTIAL because clock advanced.
          Spec: forward estimate uses STRICT > (hours_to_start > 24 -> FULL; hours_to_start > 2 -> PARTIAL),
          while final transition uses >= (hours_to_start >= 24 -> FULL; hours_to_start >= 2 -> PARTIAL).
          Therefore at hours_to_start == 24.0 the estimate says PARTIAL but the final says FULL.

  - name: payout_aggregation
    trigger: "POST /payouts (admin or sweep-driven; counselor-scoped period rollup)"
    algorithm: aggregation
    formula: |
      eligible_ledger = SettlementLedger rows where:
          appointment.counselor_id = target_counselor_id
          AND appointment.ended_at IN [period_start_at, period_end_at)        # half-open
          AND payout_id IS NULL
          AND linked Appointment.status IN {COMPLETED, NO_SHOW, CANCELLED}    # NO_SHOW -> NON_REFUNDABLE charge counts
      total_counselor_share_cents = sum(ledger.counselor_share_cents)         # CHARGE positive, REFUND negative
      total_tax_cents = sum(ledger.tax_cents)
      Each row's payout_id := new Payout.id  (atomic with creation)
    input_set: "Half-open window [period_start_at, period_end_at). Excludes ledger rows with payout_id NOT NULL."
    constants: {}
    precision: "integer cents; no further rounding (ledger rows already integer)"
    variants:
      - name: exclude_disqualified
        when: "Counselor.status = DISQUALIFIED at payout creation time"
        difference: |
          If counselor.status = DISQUALIFIED, payout creation rejected with ERR_COUNSELOR_DISQUALIFIED;
          ledger rows remain unrolled (admin must REVERSE disqualification first or accept platform-only retention).

  - name: client_risk_flag_recompute
    trigger: "CrisisIncident transitions (any) and POST /_sweep/risk"
    algorithm: weighted_scoring
    formula: |
      lookback = now() - 90d
      relevant = CrisisIncident rows where client_id = target AND created_at >= lookback AND status != RESOLVED OR (status = RESOLVED AND follow_up_completed_at >= lookback)
      score = 0
      for inc in relevant (oldest first; tie-break by id ASC):
          if inc.severity = HIGH: score += 5
          elif inc.severity = MEDIUM: score += 3
          else: score += 1
          if inc.detection_source = COUNSELOR_TRIGGERED: score += 1
      if score >= 8: risk_flag := ACUTE
      elif score >= 4: risk_flag := ELEVATED
      else: risk_flag := NONE
    input_set: "Last 90 days of CrisisIncident rows for the client; ordered by created_at ASC then id ASC."
    constants:
      ACUTE_THRESHOLD: 8
      ELEVATED_THRESHOLD: 4
      WINDOW_DAYS: 90
    precision: "integer score; thresholds use >= (>= 8 ACUTE, >= 4 ELEVATED)"
    variants:
      - name: counselor_view_score
        when: "GET /clients/{id}/risk-summary requested by counselor"
        difference: |
          Counselor view shows the composed score to within +/- 1 to obscure exact incidents (rounded to nearest
          even integer, ties to even). Internal recompute uses raw score. The two outputs can disagree at
          score = 7.5 (n/a since integer) but at the 8 boundary the rounding does not change result.

  - name: certification_cycle_eligibility
    trigger: "POST /certification-cycles/{id}/submit (validates submission)"
    algorithm: aggregation
    formula: |
      window = [cycle.window_start_at, cycle.window_end_at]
      sup_hours_in_window = sum(SupervisionSession.duration_hours
          for s in approved supervisions where s.counselor_id = target
          AND APPROVED transition.created_at IN window)
      ce_hours_in_window  = sum(ContinuingEducationRecord.hours_credited
          for r in APPROVED CE records where r.counselor_id = target
          AND APPROVED transition timestamp IN window)
      eligible := (sup_hours_in_window >= cycle.required_supervision_hours
                   AND ce_hours_in_window >= cycle.required_ce_hours
                   AND counselor.license_expires_at > now())
    input_set: "All APPROVED SupervisionSession + ContinuingEducationRecord rows whose APPROVED-time falls within cycle window."
    constants: {}
    precision: "hours: 0.5 step; comparisons strict >= "
    variants: []

  - name: counselor_session_scheduling_invariants
    trigger: "POST /availability-slots (validate) and POST /appointments (validate)"
    algorithm: interval_merge
    formula: |
      for the counselor:
        proposed = [start_at, end_at)        # half-open
        overlaps_existing := EXISTS slot in {OPEN, HELD, BOOKED} where (slot.start, slot.end) ∩ proposed != ∅
                                                                                # treat adjacency at boundary as NON-overlap (ok)
        rest_violation := EXISTS slot in {OPEN, HELD, BOOKED} where 0 < gap_minutes(slot, proposed) < 15
                                                                                # adjacent (gap=0) ok; <15m AND >0 violates
        daily_minutes := sum(duration of OPEN+HELD+BOOKED slots overlapping the same calendar day in counselor.timezone)
        weekly_minutes := same over the same ISO week
        daily_violation := daily_minutes + 60 > 480           # 8h cap
        weekly_violation := weekly_minutes + 60 > 1800        # 30h cap
    input_set: "All counselor's slots in non-terminal states; computed at create-slot AND at slot-hold time."
    constants:
      REST_INTERVAL_MINUTES: 15
      DAILY_CAP_MINUTES: 480
      WEEKLY_CAP_MINUTES: 1800
      SLOT_DURATION_MINUTES: 60
    precision: "integer minutes; daily/weekly use strict > over cap (480 ok, 481 not ok)"
    variants:
      - name: timezone_local_day_boundary
        when: "Counselor authors slots near local-midnight; daily cap measured in counselor.timezone calendar day"
        difference: |
          Daily cap evaluated in counselor.timezone, NOT UTC. A slot 23:30-00:30 local crosses two local days;
          the slot's minutes are split (30 to day N, 30 to day N+1). UTC-based partitioning would mis-classify;
          spec pins counselor.timezone evaluation.

  - name: supervision_overlap_check
    trigger: "POST /supervision-sessions"
    algorithm: interval_merge
    formula: |
      proposed_window = [scheduled_at - 30m, scheduled_at + 30m)   # buffered 30-min window AROUND scheduled supervision
      conflict := EXISTS another supervision (any status != REJECTED) for SAME supervisor_id whose
                  [scheduled_at - 30m, scheduled_at + 30m) overlaps proposed_window
                  # symmetric 30-min buffer (interval semantics differs from slot scheduling: PRE+POST buffer here vs PRE-only rest interval there)
    input_set: "All non-REJECTED SupervisionSession rows for the supervisor."
    constants: {SUPERVISION_BUFFER_MINUTES: 30}
    precision: "integer minutes; overlap uses half-open intersection"
    variants: []

  - name: settlement_charge_breakdown
    trigger: "Appointment HOLD -> CONFIRMED (creates SettlementLedger CHARGE)"
    algorithm: tiered_pricing
    formula: |
      base_cents := list_price_cents              # PAY_PER_SESSION
      if appointment.payment_mode = PACKAGE:
          base_cents := 0                         # already paid for via package; ledger CHARGE row records 0 gross
                                                  # but counselor still earns share against SHADOW_PACKAGE_RATE
          shadow_revenue := SHADOW_PACKAGE_RATE   # imputed per-session value
          counselor_share_cents := round_half_up(shadow_revenue * counselor.revenue_share_bps / 10000)
          tax_cents := 0
          gross_amount_cents := 0
          platform_share_cents := -counselor_share_cents   # NEGATIVE: platform absorbs counselor share from prior package revenue
      else: # PAY_PER_SESSION
          gross_amount_cents := base_cents
          tax_cents := round_half_up(base_cents * TAX_BPS / 10000)
          counselor_share_cents := round_half_up(base_cents * counselor.revenue_share_bps / 10000)
          platform_share_cents := base_cents - counselor_share_cents
    input_set: "Single Appointment at confirmation time."
    constants:
      TAX_BPS: 875
      SHADOW_PACKAGE_RATE: 9000   # 90 USD imputed per session for revenue-share when package consumed
      ROUNDING: round_half_up
    precision: "cents integer; rounding evaluated per-component then summed (NOT sum-then-round)"
    variants:
      - name: package_vs_per_session
        when: "Same gross consumer price could arise from PACKAGE consumption or PAY_PER_SESSION"
        difference: |
          For PAY_PER_SESSION at $120 list, counselor_share = round_half_up(12000*7000/10000) = 8400 cents,
          platform_share = 12000 - 8400 = 3600, tax = round_half_up(12000 * 875/10000) = 1050.
          For PACKAGE same session: gross=0, tax=0, counselor_share = round_half_up(9000*7000/10000) = 6300,
          platform_share = -6300. Two valid revenue-share interpretations on identical session data.
      - name: rounding_order_pin
        when: "Computing platform_share from base"
        difference: |
          Platform share is computed as base - counselor_share AFTER counselor_share is rounded; the alternative
          "round(base * (10000 - share_bps) / 10000)" can differ by 1 cent for share_bps producing fractional cents.
          Pin order: counselor_share first, platform_share = base - counselor_share. (e.g., share_bps=6667, base=10000:
          counselor_share = round_half_up(6667) = 6667 (already integer); platform_share = 10000 - 6667 = 3333. The
          alternative round(10000 * 3333/10000) also yields 3333 here, but with base=12345 and share_bps=6667 the
          difference becomes 1 cent: A: counselor=round(12345*6667/10000)=round(8230.31)=8230, platform=12345-8230=4115;
          B: round(12345*3333/10000)=round(4114.69)=4115. Spec pins method A.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all except GET /counselors (public browse)"

  - priority: 2
    category: auth
    check: "Role permitted to invoke endpoint (RBAC table §1.7)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameter resources exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all with path parameters"

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys resolve to live entities"
    error_id: ERR_REF_NOT_FOUND
    http_status: 422
    applies_to: "POST/PATCH endpoints"

  - priority: 5
    category: state
    check: "Target entity in valid source state for requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "Counselor.status = ACTIVE for slot creation, booking, session start"
    error_id: ERR_COUNSELOR_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /availability-slots, POST /appointments, POST /appointments/{id}/start"

  - priority: 7
    category: business_safety
    check: "Risk-keyword scan: POST /counseling-records with note containing any RISK_KEYWORD set ('suicide', 'self-harm', 'kill myself', 'end it') auto-creates a CrisisIncident DETECTED before the record write commits; the record write proceeds, but the response also includes the new incident id"
    error_id: ERR_CRISIS_AUTO_RAISED
    http_status: 422
    applies_to: "POST /counseling-records"
    note: "When this fires the WRITE itself returns 422 with the auto-incident id surfaced; counselor must POST again with crisis_acknowledged=true to commit the note."

  - priority: 8
    category: business_safety
    check: "Crisis intervention notification requires emergency_contact_phone present"
    error_id: ERR_NO_EMERGENCY_CONTACT
    http_status: 422
    applies_to: "POST /crisis-incidents/{id}/notify-emergency"

  - priority: 9
    category: business_referential
    check: "First-visit assessment gate: client.assessment_status = PENDING AND appointment_type != INTAKE -> reject"
    error_id: ERR_INTAKE_REQUIRED
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 10
    category: business_referential
    check: "Client.assessment_status = IN_PROGRESS AND appointment_type = INTAKE -> reject (only one INTAKE allowed)"
    error_id: ERR_INTAKE_ALREADY_IN_PROGRESS
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 11
    category: business_constraint
    check: "Channel chosen IN counselor.supported_channels"
    error_id: ERR_CHANNEL_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /availability-slots, POST /appointments"

  - priority: 12
    category: business_temporal
    check: "Slot duration EXACTLY 60 minutes; end_at = start_at + 60 min"
    error_id: ERR_INVALID_SLOT_DURATION
    http_status: 422
    applies_to: "POST /availability-slots"

  - priority: 13
    category: business_temporal
    check: "Slot-vs-slot overlap on same counselor uses half-open intervals; adjacent OK, overlap rejected"
    error_id: ERR_SLOT_OVERLAP
    http_status: 422
    applies_to: "POST /availability-slots"

  - priority: 14
    category: business_temporal
    check: "Rest interval: gap to nearest other slot must be 0 (adjacent) or >= 15 minutes; (0, 15) violates"
    error_id: ERR_REST_INTERVAL
    http_status: 422
    applies_to: "POST /availability-slots"

  - priority: 15
    category: business_temporal
    check: "Daily cap: counselor.timezone calendar-day total minutes + 60 must be <= 480"
    error_id: ERR_DAILY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /availability-slots"

  - priority: 16
    category: business_temporal
    check: "Weekly cap: counselor ISO-week total minutes + 60 must be <= 1800"
    error_id: ERR_WEEKLY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /availability-slots"

  - priority: 17
    category: business_temporal
    check: "Booking window: now() < slot.start_at - 1 hour"
    error_id: ERR_BOOKING_TOO_LATE
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 18
    category: business_temporal
    check: "Reschedule window: now() < confirmed.start_at - 24 hours"
    error_id: ERR_RESCHEDULE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /appointments/{id}/reschedule"

  - priority: 19
    category: business_constraint
    check: "Hold expiry: confirm only when now() < slot.held_until"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST /appointments/{id}/confirm"

  - priority: 20
    category: business_fiscal
    check: "PACKAGE payment_mode: client.package_balance_sessions >= 1 at confirm time"
    error_id: ERR_INSUFFICIENT_PACKAGE_BALANCE
    http_status: 422
    applies_to: "POST /appointments/{id}/confirm"

  - priority: 21
    category: business_fiscal
    check: "Reschedule reject if list_price_cents differs from confirmed list_price_cents"
    error_id: ERR_PRICE_DRIFT
    http_status: 422
    applies_to: "POST /appointments/{id}/reschedule"

  - priority: 22
    category: business_referential
    check: "Supervisor.id != counselor.id AND supervisor.specialty_tags overlap counselor.specialty_tags"
    error_id: ERR_SUPERVISOR_INELIGIBLE
    http_status: 422
    applies_to: "POST /supervision-sessions"

  - priority: 23
    category: business_referential
    check: "Supervisor cannot supervise their own SupervisionSession (segregation of duties: cannot create AND approve same row; the approver MUST equal supervisor_id; the rule pairs with priority 24)"
    error_id: ERR_SUPERVISION_SOD
    http_status: 422
    applies_to: "POST /supervision-sessions"

  - priority: 24
    category: business_referential
    check: "case_appointment_id must be COMPLETED and counselor's own"
    error_id: ERR_INVALID_CASE
    http_status: 422
    applies_to: "POST /supervision-sessions"

  - priority: 25
    category: business_referential
    check: "PlatformAdmin who decides a CertificationCycle MUST NOT have created any of its required SupervisionSession rows (segregation of duties)"
    error_id: ERR_RECERT_SOD
    http_status: 403
    applies_to: "POST /certification-cycles/{id}/approve, /reject"

  - priority: 26
    category: business_constraint
    check: "Risk-keyword detection requires trigger_keyword field present when detection_source=KEYWORD_DETECTOR"
    error_id: ERR_TRIGGER_KEYWORD_MISSING
    http_status: 422
    applies_to: "POST /crisis-incidents"

  - priority: 27
    category: business_constraint
    check: "Crisis emergency-notify requires severity IN {MEDIUM, HIGH}"
    error_id: ERR_NOTIFY_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /crisis-incidents/{id}/notify-emergency"

  - priority: 28
    category: business_constraint
    check: "Counseling-record export requires explicit acknowledgement field export_consent=true"
    error_id: ERR_EXPORT_CONSENT_MISSING
    http_status: 422
    applies_to: "POST /counseling-records/{id}/export"

  - priority: 29
    category: business_temporal
    check: "Retention enforcement: GET /counseling-records/{id} where redaction_status=PURGED returns 410"
    error_id: ERR_RECORD_PURGED
    http_status: 410
    applies_to: "GET /counseling-records/{id}, POST /counseling-records/{id}/export"

  - priority: 30
    category: business_constraint
    check: "Payout creation requires period_end_at > period_start_at AND no overlap with existing PENDING/PAID payouts for same counselor"
    error_id: ERR_PAYOUT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /payouts"

  - priority: 31
    category: business_constraint
    check: "Payout cannot be created for DISQUALIFIED counselor"
    error_id: ERR_COUNSELOR_DISQUALIFIED
    http_status: 409
    applies_to: "POST /payouts"

  - priority: 32
    category: business_fiscal
    check: "Pagination params within bounds (1 <= limit <= 100, offset >= 0)"
    error_id: ERR_PAGINATION_INVALID
    http_status: 422
    applies_to: "all GET list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Counselors ----
  - method: POST
    path: "/counseling/counselors"
    description: "Register counselor (status starts PENDING_CERT; auto-creates CertificationCycle cycle_index=1)."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, license_number, license_expires_at, specialty_tags, supported_channels, timezone, "revenue_share_bps?"]
    output: Counselor
    side_effects: ["CertificationCycle{cycle_index=1, required_supervision_hours=40, required_ce_hours=12, window_start_at=now, window_end_at=now+365d} created in OPEN"]

  - method: GET
    path: "/counseling/counselors"
    description: "Public browse + match: list ACTIVE counselors with filters specialty_tag, channel, timezone."
    roles: [Public, Client, Counselor, Supervisor, PlatformAdmin]
    code: 200
    input: ["specialty_tag?", "channel?", "timezone?", "limit?", "offset?"]
    output: "Counselor[]"
    side_effects: []

  - method: GET
    path: "/counseling/counselors/{id}"
    description: "Counselor detail."
    roles: [Public, Client, Counselor, Supervisor, PlatformAdmin]
    code: 200
    input: []
    output: Counselor
    side_effects: []

  - method: PATCH
    path: "/counseling/counselors/{id}"
    description: "Update counselor profile (specialties, channels, timezone, license_expires_at)."
    roles: [Counselor, PlatformAdmin]
    code: 200
    input: ["specialty_tags?", "supported_channels?", "timezone?", "license_expires_at?", version]
    output: Counselor
    side_effects: ["If supported_channels shrunk, future slots already created remain; bookings on dropped channels still legal until cancelled."]

  - method: POST
    path: "/counseling/counselors/{id}/disqualify"
    description: "Disqualify a counselor."
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Counselor
    side_effects: ["Cascade to AvailabilitySlot, Appointment, SettlementLedger (refunds), Client.package_balance_sessions, AuditLogEntry"]

  # ---- Clients ----
  - method: POST
    path: "/counseling/clients"
    description: "Register client (assessment_status starts PENDING)."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, timezone, emergency_contact_name, emergency_contact_phone]
    output: Client
    side_effects: []

  - method: GET
    path: "/counseling/clients/{id}"
    description: "Client detail."
    roles: [Client, Counselor, CrisisResponder, PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: PATCH
    path: "/counseling/clients/{id}"
    description: "Update client profile."
    roles: [Client, PlatformAdmin]
    code: 200
    input: ["emergency_contact_name?", "emergency_contact_phone?", "timezone?", version]
    output: Client
    side_effects: []

  - method: POST
    path: "/counseling/clients/{id}/credit-package"
    description: "Credit prepaid package sessions (e.g., from external payment confirmation)."
    roles: [PlatformAdmin]
    code: 200
    input: [sessions, version]
    output: Client
    side_effects: ["Client.package_balance_sessions += sessions"]

  - method: GET
    path: "/counseling/clients/{id}/risk-summary"
    description: "Computed risk summary; counselor sees rounded view."
    roles: [Client, Counselor, CrisisResponder, PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects: []

  # ---- Certification cycles ----
  - method: POST
    path: "/counseling/counselors/{id}/certification-cycles"
    description: "Create new OPEN cycle (when previous EXPIRED or REJECTED)."
    roles: [PlatformAdmin]
    code: 201
    input: []
    output: CertificationCycle
    side_effects: []

  - method: POST
    path: "/counseling/certification-cycles/{id}/submit"
    description: "Counselor submits cycle for review (validates eligibility per calculation certification_cycle_eligibility)."
    roles: [Counselor]
    code: 200
    input: []
    output: CertificationCycle
    side_effects: []

  - method: POST
    path: "/counseling/certification-cycles/{id}/approve"
    description: "Admin approves cycle."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CertificationCycle
    side_effects: ["Counselor status transitions; next CertificationCycle auto-created"]

  - method: POST
    path: "/counseling/certification-cycles/{id}/reject"
    description: "Admin rejects cycle."
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: CertificationCycle
    side_effects: []

  - method: GET
    path: "/counseling/certification-cycles"
    description: "List cycles with filters."
    roles: [Counselor, PlatformAdmin]
    code: 200
    input: ["counselor_id?", "status?", "limit?", "offset?"]
    output: "CertificationCycle[]"
    side_effects: []

  # ---- Availability ----
  - method: POST
    path: "/counseling/availability-slots"
    description: "Counselor creates an availability slot."
    roles: [Counselor]
    code: 201
    input: [counselor_id, start_at, end_at, channel]
    output: AvailabilitySlot
    side_effects: []

  - method: GET
    path: "/counseling/availability-slots"
    description: "List slots; filters counselor_id, status, channel, from, to."
    roles: [Public, Client, Counselor, PlatformAdmin]
    code: 200
    input: ["counselor_id?", "status?", "channel?", "from?", "to?", "limit?", "offset?"]
    output: "AvailabilitySlot[]"
    side_effects: []

  - method: DELETE
    path: "/counseling/availability-slots/{id}"
    description: "Counselor releases an OPEN slot."
    roles: [Counselor]
    code: 204
    input: []
    output: null
    side_effects: ["Slot.status := RELEASED if currently OPEN; reject if HELD/BOOKED"]

  # ---- Appointments ----
  - method: POST
    path: "/counseling/appointments"
    description: "Create appointment in HOLD; locks slot via OPEN->HELD."
    roles: [Client]
    code: 201
    input: [counselor_id, client_id, slot_id, appointment_type, payment_mode]
    output: Appointment
    side_effects: ["AvailabilitySlot OPEN->HELD; Appointment.status=HOLD"]

  - method: POST
    path: "/counseling/appointments/{id}/confirm"
    description: "Client confirms within hold window."
    roles: [Client]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Slot HELD->BOOKED; SettlementLedger CHARGE; package balance debit (PACKAGE)"]

  - method: GET
    path: "/counseling/appointments/{id}/refund-estimate"
    description: "Forward-looking refund estimate (variant uses strict >)."
    roles: [Client, Counselor, PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: POST
    path: "/counseling/appointments/{id}/cancel"
    description: "Cancel appointment (HOLD or CONFIRMED)."
    roles: [Client, Counselor, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Appointment
    side_effects: ["Slot transitions; refund evaluated; package balance credited if applicable; ledger REFUND row"]

  - method: POST
    path: "/counseling/appointments/{id}/reschedule"
    description: "Reschedule CONFIRMED appointment to a new slot."
    roles: [Client, Counselor]
    code: 200
    input: [new_slot_id]
    output: Appointment
    side_effects: ["Old slot RELEASED; new slot HELD->BOOKED atomically"]

  - method: POST
    path: "/counseling/appointments/{id}/start"
    description: "Counselor starts session (CONFIRMED->IN_SESSION)."
    roles: [Counselor]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/counseling/appointments/{id}/complete"
    description: "Counselor completes session (IN_SESSION->COMPLETED)."
    roles: [Counselor]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Client.assessment_status may flip to COMPLETED"]

  - method: GET
    path: "/counseling/appointments"
    description: "List appointments."
    roles: [Client, Counselor, PlatformAdmin]
    code: 200
    input: ["counselor_id?", "client_id?", "status?", "from?", "to?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/counseling/appointments/{id}"
    description: "Get appointment detail."
    roles: [Client, Counselor, PlatformAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  # ---- Counseling records (encrypted) ----
  - method: POST
    path: "/counseling/counseling-records"
    description: "Create encrypted record after session COMPLETED. Risk-keyword scan may auto-raise CrisisIncident (returns 422)."
    roles: [Counselor]
    code: 201
    input: [appointment_id, encrypted_note_blob, "crisis_acknowledged?"]
    output: CounselingRecord
    side_effects: ["AuditLogEntry; possible auto CrisisIncident on keyword detection"]

  - method: GET
    path: "/counseling/counseling-records/{id}"
    description: "Read record (returns encrypted blob ref + last_accessed_at)."
    roles: [Counselor, Supervisor, PlatformAdmin]
    code: 200
    input: []
    output: CounselingRecord
    side_effects: ["AuditLogEntry(action=RECORD_READ); last_accessed_at refreshed"]

  - method: POST
    path: "/counseling/counseling-records/{id}/export"
    description: "Authorized export with consent token."
    roles: [Counselor, PlatformAdmin]
    code: 200
    input: [export_consent]
    output: object
    side_effects: ["AuditLogEntry(action=RECORD_EXPORT)"]

  - method: GET
    path: "/counseling/counseling-records"
    description: "List records (metadata only, never blob)."
    roles: [Counselor, Supervisor, PlatformAdmin]
    code: 200
    input: ["counselor_id?", "client_id?", "redaction_status?", "limit?", "offset?"]
    output: "CounselingRecord[]"
    side_effects: []

  # ---- Crisis ----
  - method: POST
    path: "/counseling/crisis-incidents"
    description: "Counselor-triggered escalation (status=DETECTED)."
    roles: [Counselor]
    code: 201
    input: [appointment_id, detection_source, "trigger_keyword?", "severity?"]
    output: CrisisIncident
    side_effects: ["AuditLogEntry(action=CRISIS_DETECTED)"]

  - method: POST
    path: "/counseling/crisis-incidents/{id}/handover"
    description: "Crisis-response team takes ownership."
    roles: [CrisisResponder]
    code: 200
    input: [severity]
    output: CrisisIncident
    side_effects: ["Linked Appointment IN_SESSION->CANCELLED with reason CRISIS_HANDOVER; refund issued"]

  - method: POST
    path: "/counseling/crisis-incidents/{id}/notify-emergency"
    description: "Dispatch emergency-contact notification."
    roles: [CrisisResponder]
    code: 200
    input: []
    output: CrisisIncident
    side_effects: ["AuditLogEntry(action=CRISIS_NOTIFY); emits external notify event"]

  - method: POST
    path: "/counseling/crisis-incidents/{id}/schedule-follow-up"
    description: "Set follow-up due date."
    roles: [CrisisResponder]
    code: 200
    input: ["follow_up_due_at?"]
    output: CrisisIncident
    side_effects: []

  - method: POST
    path: "/counseling/crisis-incidents/{id}/resolve"
    description: "Mark incident resolved with completion timestamp."
    roles: [CrisisResponder]
    code: 200
    input: [follow_up_completed_at]
    output: CrisisIncident
    side_effects: ["Client.risk_flag recomputed"]

  - method: GET
    path: "/counseling/crisis-incidents"
    description: "List incidents."
    roles: [Counselor, CrisisResponder, PlatformAdmin]
    code: 200
    input: ["client_id?", "status?", "severity?", "limit?", "offset?"]
    output: "CrisisIncident[]"
    side_effects: []

  # ---- Supervision & CE ----
  - method: POST
    path: "/counseling/supervision-sessions"
    description: "Counselor logs a supervision session for review."
    roles: [Counselor]
    code: 201
    input: [counselor_id, supervisor_id, case_appointment_id, scheduled_at, duration_hours, discussion_notes]
    output: SupervisionSession
    side_effects: []

  - method: POST
    path: "/counseling/supervision-sessions/{id}/approve"
    description: "Supervisor approves session."
    roles: [Supervisor]
    code: 200
    input: [evaluation_score]
    output: SupervisionSession
    side_effects: ["Counselor.total_supervision_hours += duration_hours"]

  - method: POST
    path: "/counseling/supervision-sessions/{id}/reject"
    description: "Supervisor rejects session."
    roles: [Supervisor]
    code: 200
    input: ["reason?"]
    output: SupervisionSession
    side_effects: []

  - method: GET
    path: "/counseling/supervision-sessions"
    description: "List supervision sessions."
    roles: [Counselor, Supervisor, PlatformAdmin]
    code: 200
    input: ["counselor_id?", "supervisor_id?", "status?", "limit?", "offset?"]
    output: "SupervisionSession[]"
    side_effects: []

  - method: POST
    path: "/counseling/ce-records"
    description: "Counselor logs continuing-education record."
    roles: [Counselor]
    code: 201
    input: [counselor_id, course_title, completed_at, hours_claimed]
    output: ContinuingEducationRecord
    side_effects: []

  - method: POST
    path: "/counseling/ce-records/{id}/approve"
    description: "Admin approves CE record."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ContinuingEducationRecord
    side_effects: ["Counselor.total_ce_hours += hours_claimed"]

  - method: POST
    path: "/counseling/ce-records/{id}/reject"
    description: "Admin rejects CE record."
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: ContinuingEducationRecord
    side_effects: []

  # ---- Settlement & payouts ----
  - method: GET
    path: "/counseling/settlement-ledger"
    description: "List ledger entries (admin only by default; counselor sees own counselor_share)."
    roles: [Counselor, PlatformAdmin]
    code: 200
    input: ["counselor_id?", "appointment_id?", "direction?", "limit?", "offset?"]
    output: "SettlementLedger[]"
    side_effects: []

  - method: POST
    path: "/counseling/payouts"
    description: "Roll up unrolled ledger rows for counselor in window."
    roles: [PlatformAdmin]
    code: 201
    input: [counselor_id, period_start_at, period_end_at]
    output: Payout
    side_effects: ["payout_aggregation calc"]

  - method: POST
    path: "/counseling/payouts/{id}/mark-paid"
    description: "Mark payout PAID."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: POST
    path: "/counseling/payouts/{id}/reverse"
    description: "Reverse a paid payout within 7 days."
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: Payout
    side_effects: []

  - method: GET
    path: "/counseling/payouts"
    description: "List payouts."
    roles: [Counselor, PlatformAdmin]
    code: 200
    input: ["counselor_id?", "status?", "limit?", "offset?"]
    output: "Payout[]"
    side_effects: []

  # ---- Audit log ----
  - method: GET
    path: "/counseling/audit-log"
    description: "List audit log entries."
    roles: [PlatformAdmin]
    code: 200
    input: ["action?", "target_entity?", "actor_role?", "from?", "to?", "limit?", "offset?"]
    output: "AuditLogEntry[]"
    side_effects: []

  # ---- Test-driving control endpoints (per §1.5 testability principle) ----
  - method: POST
    path: "/counseling/_clock/advance"
    description: "Advance the simulated clock to a target ISO timestamp; required to exercise time-gated transitions."
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: object
    side_effects: ["Internal NOW := to (must be > current NOW)"]

  - method: POST
    path: "/counseling/_sweep/holds"
    description: "Run hold-expiry sweep; processes Slot HELD->OPEN and Appointment HOLD->CANCELLED for expired holds."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: POST
    path: "/counseling/_sweep/no-show"
    description: "Run no-show sweep; CONFIRMED appointments past start_at + 30m -> NO_SHOW."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: POST
    path: "/counseling/_sweep/recert"
    description: "Run re-certification sweep; OPEN/UNDER_REVIEW cycles past deadline -> EXPIRED; counselor SUSPENDED cascade."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: POST
    path: "/counseling/_sweep/retention"
    description: "Run retention sweep; CounselingRecord with retention_expires_at <= now() -> PURGED (encrypted_note_blob nulled)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: POST
    path: "/counseling/_sweep/risk"
    description: "Recompute Client.risk_flag for all clients with non-RESOLVED incidents in lookback."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: POST
    path: "/counseling/_events/emit"
    description: "Synthetic external event for IM/payment/emergency-contact sync acknowledgement."
    roles: [PlatformAdmin]
    code: 200
    input: [event_type, payload]
    output: object
    side_effects: ["AuditLogEntry appended for external_sync events"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for endpoint per RBAC."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter resource does not exist."
  - id: ERR_REF_NOT_FOUND
    http: 422
    condition: "Body-referenced foreign key resolves to nothing."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in source state for the requested transition."
  - id: ERR_COUNSELOR_NOT_ACTIVE
    http: 409
    condition: "Counselor.status != ACTIVE for slot/booking/start operation."
  - id: ERR_COUNSELOR_DISQUALIFIED
    http: 409
    condition: "Operation rejected because counselor is DISQUALIFIED (e.g., payout creation)."
  - id: ERR_CRISIS_AUTO_RAISED
    http: 422
    condition: "Risk-keyword detected in counseling-record note; CrisisIncident auto-created; counselor must POST again with crisis_acknowledged=true."
  - id: ERR_NO_EMERGENCY_CONTACT
    http: 422
    condition: "Emergency-notify attempted with no client.emergency_contact_phone."
  - id: ERR_INTAKE_REQUIRED
    http: 422
    condition: "Non-INTAKE booking attempted while client.assessment_status=PENDING."
  - id: ERR_INTAKE_ALREADY_IN_PROGRESS
    http: 422
    condition: "INTAKE booking attempted while client.assessment_status=IN_PROGRESS."
  - id: ERR_CHANNEL_NOT_SUPPORTED
    http: 422
    condition: "Channel chosen not in counselor.supported_channels."
  - id: ERR_INVALID_SLOT_DURATION
    http: 422
    condition: "Slot duration not exactly 60 minutes."
  - id: ERR_SLOT_OVERLAP
    http: 422
    condition: "Proposed slot overlaps another non-terminal slot of the same counselor."
  - id: ERR_REST_INTERVAL
    http: 422
    condition: "Rest interval violation: gap to nearest slot in (0, 15) minutes."
  - id: ERR_DAILY_CAP_EXCEEDED
    http: 422
    condition: "Daily cap (480 min in counselor.timezone) would be exceeded."
  - id: ERR_WEEKLY_CAP_EXCEEDED
    http: 422
    condition: "Weekly cap (1800 min ISO week) would be exceeded."
  - id: ERR_BOOKING_TOO_LATE
    http: 422
    condition: "Booking attempted with now() >= start_at - 1 hour."
  - id: ERR_RESCHEDULE_WINDOW_CLOSED
    http: 409
    condition: "Reschedule attempted with now() >= start_at - 24 hours."
  - id: ERR_HOLD_EXPIRED
    http: 409
    condition: "Confirm attempted after slot.held_until."
  - id: ERR_INSUFFICIENT_PACKAGE_BALANCE
    http: 422
    condition: "PACKAGE confirm with client.package_balance_sessions < 1."
  - id: ERR_PRICE_DRIFT
    http: 422
    condition: "Reschedule rejected because list_price_cents differs."
  - id: ERR_SUPERVISOR_INELIGIBLE
    http: 422
    condition: "Supervisor self-supervises or specialty mismatch."
  - id: ERR_SUPERVISION_SOD
    http: 422
    condition: "Supervisor SoD violation (creator/approver mismatch)."
  - id: ERR_INVALID_CASE
    http: 422
    condition: "case_appointment_id is not COMPLETED or not counselor's own."
  - id: ERR_RECERT_SOD
    http: 403
    condition: "Admin acting on cycle has supervised cycle's required sessions."
  - id: ERR_TRIGGER_KEYWORD_MISSING
    http: 422
    condition: "KEYWORD_DETECTOR detection_source missing trigger_keyword."
  - id: ERR_NOTIFY_NOT_REQUIRED
    http: 422
    condition: "notify-emergency on severity=LOW."
  - id: ERR_EXPORT_CONSENT_MISSING
    http: 422
    condition: "Export attempted without export_consent=true."
  - id: ERR_RECORD_PURGED
    http: 410
    condition: "Read/export attempted on PURGED CounselingRecord."
  - id: ERR_PAYOUT_WINDOW_OVERLAP
    http: 409
    condition: "New payout window overlaps an existing PENDING/PAID payout for the same counselor."
  - id: ERR_PAGINATION_INVALID
    http: 422
    condition: "limit out of [1,100] or offset < 0."
  - id: ERR_RECORD_ALREADY_EXISTS
    http: 409
    condition: "CounselingRecord already exists for appointment_id (unique constraint)."
  - id: ERR_SLOT_TAKEN
    http: 409
    condition: "Concurrent slot hold lost the race; slot already HELD/BOOKED."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency: version mismatch on PATCH."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic field-level validation (type, format, missing required field)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Public
    description: "Unauthenticated browser using public counselor catalog."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /counseling/counselors"
      - "GET /counseling/counselors/{id}"
      - "GET /counseling/availability-slots"

  - name: Client
    description: "End user receiving counseling."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /counseling/appointments"
      - "POST /counseling/appointments/{id}/confirm"
    shared_operations:
      - "GET /counseling/clients/{id} (only own)"
      - "PATCH /counseling/clients/{id} (only own)"
      - "POST /counseling/appointments/{id}/cancel"
      - "POST /counseling/appointments/{id}/reschedule"
      - "GET /counseling/appointments (only own as client_id)"
      - "GET /counseling/appointments/{id} (only own)"
      - "GET /counseling/appointments/{id}/refund-estimate (only own)"
      - "GET /counseling/clients/{id}/risk-summary (only own; full score)"

  - name: Counselor
    description: "Licensed mental-health counselor."
    identity: "entity_backed:Counselor"
    exclusive_operations:
      - "POST /counseling/availability-slots"
      - "DELETE /counseling/availability-slots/{id}"
      - "POST /counseling/appointments/{id}/start"
      - "POST /counseling/appointments/{id}/complete"
      - "POST /counseling/counseling-records"
      - "POST /counseling/crisis-incidents"
      - "POST /counseling/supervision-sessions"
      - "POST /counseling/ce-records"
      - "POST /counseling/certification-cycles/{id}/submit"
    shared_operations:
      - "PATCH /counseling/counselors/{id} (only own)"
      - "GET /counseling/counseling-records/{id} (only own counselor_id)"
      - "GET /counseling/counseling-records (only own)"
      - "POST /counseling/counseling-records/{id}/export (only own)"
      - "POST /counseling/appointments/{id}/cancel (only own)"
      - "POST /counseling/appointments/{id}/reschedule (only own)"
      - "GET /counseling/clients/{id}/risk-summary (rounded view)"
      - "GET /counseling/appointments/{id}/refund-estimate (only own)"

  - name: Supervisor
    description: "Senior counselor evaluating supervisees; identified by supervisor_id on SupervisionSession."
    identity: "entity_backed:Counselor"
    exclusive_operations:
      - "POST /counseling/supervision-sessions/{id}/approve"
      - "POST /counseling/supervision-sessions/{id}/reject"
    shared_operations:
      - "GET /counseling/counseling-records/{id} (records of own supervisees only)"
      - "GET /counseling/counseling-records (own supervisees)"
      - "GET /counseling/supervision-sessions (own supervisor_id)"
    note: "Supervisor's X-User-ID is a Counselor.id; the role is asserted via X-User-Role=Supervisor when acting in this capacity."

  - name: CrisisResponder
    description: "Crisis-response team operator; opaque (not tied to Counselor entity)."
    identity: "opaque"
    exclusive_operations:
      - "POST /counseling/crisis-incidents/{id}/handover"
      - "POST /counseling/crisis-incidents/{id}/notify-emergency"
      - "POST /counseling/crisis-incidents/{id}/schedule-follow-up"
      - "POST /counseling/crisis-incidents/{id}/resolve"
    shared_operations:
      - "GET /counseling/crisis-incidents"
      - "GET /counseling/clients/{id} (any client with active incident)"
      - "GET /counseling/clients/{id}/risk-summary (full score)"

  - name: PlatformAdmin
    description: "Platform operator (opaque)."
    identity: "opaque"
    exclusive_operations:
      - "POST /counseling/counselors"
      - "POST /counseling/counselors/{id}/disqualify"
      - "POST /counseling/clients"
      - "POST /counseling/clients/{id}/credit-package"
      - "POST /counseling/counselors/{id}/certification-cycles"
      - "POST /counseling/certification-cycles/{id}/approve"
      - "POST /counseling/certification-cycles/{id}/reject"
      - "POST /counseling/ce-records/{id}/approve"
      - "POST /counseling/ce-records/{id}/reject"
      - "POST /counseling/payouts"
      - "POST /counseling/payouts/{id}/mark-paid"
      - "POST /counseling/payouts/{id}/reverse"
      - "GET /counseling/audit-log"
      - "POST /counseling/_clock/advance"
      - "POST /counseling/_sweep/holds"
      - "POST /counseling/_sweep/no-show"
      - "POST /counseling/_sweep/recert"
      - "POST /counseling/_sweep/retention"
      - "POST /counseling/_sweep/risk"
      - "POST /counseling/_events/emit"
    shared_operations:
      - "All GET endpoints (full visibility)"
      - "PATCH /counseling/counselors/{id}"
      - "PATCH /counseling/clients/{id}"
      - "POST /counseling/appointments/{id}/cancel"
      - "POST /counseling/counseling-records/{id}/export"
