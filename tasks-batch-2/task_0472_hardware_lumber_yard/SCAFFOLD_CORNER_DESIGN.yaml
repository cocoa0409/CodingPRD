        claim_type: Action endpoint
        grounds: ["endpoints", "state_machines.SalesOrder.fulfillment_status=PLACED_to_fulfillment_status=CANCELLED", "entities.OrderLine.fields.status"]
        distinguishing_aspect: "Cancelling a PLACED (never-fulfilled) order moves lines to RESTOCKED and leaves Product.on_hand unchanged (PLACED never debited)."
        test_recipe:
