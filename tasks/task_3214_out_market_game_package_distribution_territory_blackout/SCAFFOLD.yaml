      - { name: email, type: string, source: input, description: "Login email; unique across all accounts (case-insensitive)" }
      - { name: full_name, type: string, source: input, description: "Account holder name" }
      - { name: account_kind, type: enum, source: input, description: "constraints: RESIDENTIAL | COMMERCIAL", constraints: "enum: RESIDENTIAL | COMMERCIAL" }
      - { name: billing_zip, type: string, source: input, description: "5-digit US ZIP used for territory determination" }
      - { name: billing_market_code, type: string, source: computed, description: "Market.code resolved from billing_zip's 3-digit prefix at registration and on ZIP change; null if unmapped" }
      - { name: status, type: enum, source: system, description: "constraints: ACTIVE | SUSPENDED | CLOSED", constraints: "enum: ACTIVE | SUSPENDED | CLOSED" }
      - { name: commercial_flag_reason, type: string, source: system, description: "Why a RESIDENTIAL account was flagged; null unless SUSPENDED for commercial misuse" }

  - name: StudentVerification
    parent: Account
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; verified student account" }
      - { name: institution_name, type: string, source: input, description: "Enrolled institution" }
      - { name: verification_method, type: enum, source: input, description: "constraints: SHEERID | DOCUMENT_REVIEW", constraints: "enum: SHEERID | DOCUMENT_REVIEW" }
      - { name: valid_through, type: datetime, source: input, description: "Eligibility horizon; must be strictly after the verification timestamp" }
      - { name: status, type: enum, source: system, description: "constraints: VERIFIED | EXPIRED | REVOKED", constraints: "enum: VERIFIED | EXPIRED | REVOKED" }

  - name: VenueLicense
    parent: Account
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; COMMERCIAL account holding the license" }
      - { name: venue_name, type: string, source: input, description: "Establishment name" }
      - { name: venue_zip, type: string, source: input, description: "5-digit ZIP of the venue" }
      - { name: fire_code_occupancy, type: integer, source: input, description: "Certified maximum occupancy; > 0 and <= parent grant's max_commercial_occupancy_cap" }
      - { name: occupancy_tier, type: enum, source: computed, description: "Derived from fire_code_occupancy; constraints: T1 | T2 | T3", constraints: "enum: T1 | T2 | T3" }
      - { name: annual_fee_cents, type: integer, source: computed, description: "Tiered commercial fee computed by venue_fee; recomputed on certify/recertify" }
      - { name: status, type: enum, source: system, description: "constraints: PENDING | CERTIFIED | SUSPENDED | REVOKED", constraints: "enum: PENDING | CERTIFIED | SUSPENDED | REVOKED" }

  - name: Subscription
    parent: Account
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; subscribing account" }
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id; offer purchased" }
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; season covered (denormalized from offer)" }
      - { name: plan_tier, type: enum, source: system, description: "Snapshot of offer.plan_tier at purchase; constraints: BASE | PREMIUM | STUDENT", constraints: "enum: BASE | PREMIUM | STUDENT" }
      - { name: purchase_week_index, type: integer, source: computed, description: "Season week containing purchase timestamp; drives proration" }
      - { name: price_charged_cents, type: integer, source: computed, description: "Final charged price via charged_price; snapshot at purchase" }
      - { name: paid_amount_cents, type: integer, source: computed, description: "Cumulative net payments captured (refunds reduce this)" }
      - { name: status, type: enum, source: system, description: "Lifecycle dimension; constraints: PENDING_PAYMENT | ACTIVE | CANCELLED | EXPIRED", constraints: "enum: PENDING_PAYMENT | ACTIVE | CANCELLED | EXPIRED" }
      - { name: entitlement_state, type: enum, source: system, description: "Parallel access dimension; constraints: ENABLED | SUSPENDED | REVOKED", constraints: "enum: ENABLED | SUSPENDED | REVOKED" }
      - { name: cancelled_at, type: datetime, source: system, description: "Cancellation instant; null unless CANCELLED" }

  - name: Payment
    parent: Subscription
    common_fields: false
    fields:
