    - calculations.transient_fee_calculation
    - entities.RateSchedule.fields.grace_minutes
    distinguishing_aspect: 'Metric minutes on the quote endpoint: elapsed == grace_minutes (15) bills 0

      (the <= boundary stays free); elapsed 16 bills from minute 0 -> 500. Exact

      boundary precision, not approximation.

      '
    test_recipe:
      setup:
