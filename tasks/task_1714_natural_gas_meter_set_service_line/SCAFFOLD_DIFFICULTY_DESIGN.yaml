  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_windows_half_open_adjacency
        grounds:
          - state_machines.Inspection
          - errors[ERR_INSPECTOR_WINDOW_CONFLICT]
          - entities.Inspection.fields.start_minute
        distinguishing_aspect: |
          Interval semantics #1 — HALF-OPEN [start, end) on the Inspector resource: an inspection
          starting exactly when another ends (660 == 660) is legal back-to-back scheduling, while
          650 < 660 collides. No buffer exists in this semantics.
        test_recipe:
          setup:
            - "clock 2026-08-01; DRAFT application; inspector with PRESSURE_TEST cert; inspection A 2026-08-12 [540, 660) SCHEDULED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "9 Oak Ave", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Insp Ray", certifications: [PRESSURE_TEST] }
              as: SystemAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /inspections"
              payload: { service_application_id: "${app_id}", inspector_id: "${insp_id}", inspection_type: PRESSURE_TEST, inspection_date: "2026-08-12", start_minute: 540, end_minute: 660 }
              as: PermitCoordinator
              as_user_id: "perm-1"
              captures: { insp_a: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { service_application_id: "${app_id}", inspector_id: "${insp_id}", inspection_type: PRESSURE_TEST, inspection_date: "2026-08-12", start_minute: 660, end_minute: 720 }
              as: PermitCoordinator
              as_user_id: "perm-1"
              captures: { insp_b: $.data.id }
            - call: "POST /inspections"
              payload: { service_application_id: "${app_id}", inspector_id: "${insp_id}", inspection_type: PRESSURE_TEST, inspection_date: "2026-08-12", start_minute: 650, end_minute: 700 }
              as: PermitCoordinator
              as_user_id: "perm-1"
              captures: { err: $.data.error_id }
          assert:
            - "inspection B [660,720) SUCCEEDS — start == A.end is legal under half-open semantics (adjacency allowed)"
            - "inspection C [650,700) fails HTTP 409 ERR_INSPECTOR_WINDOW_CONFLICT (650 < 660 AND 700 > 540)"
            - "Inspection.${insp_a}.status == SCHEDULED and Inspection.${insp_b}.status == SCHEDULED"

      - name: crew_windows_buffered_thirty_minutes
        grounds:
          - state_machines.CrewBooking.REQUESTED_to_CONFIRMED
          - errors[ERR_CREW_WINDOW_CONFLICT]
          - entities.FieldCrew.fields.daily_capacity_minutes
        distinguishing_aspect: |
          Interval semantics #2 — BUFFERED CLOSED intervals on the FieldCrew resource (different
          entity, different geometry): a booking starting at the moment another ends (660 == 660)
          is a CONFLICT because a 30-minute turnaround buffer is mandatory; only start >= end+30
          (690) is legal. The exact-equality adjacency that passed for inspectors fails for crews.
        test_recipe:
          setup:
            - "clock 2026-08-01; DRAFT application; crew capacity 480; booking A 2026-08-10 540–660 CONFIRMED; bookings B (660–780) and C (690–780) REQUESTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "9 Oak Ave", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /field-crews"
              payload: { crew_name: "Crew A", specialty: GENERAL, daily_capacity_minutes: 480 }
              as: SystemAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 540, end_minute: 660, scope: MAIN_CONSTRUCTION }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_a: $.data.id }
            - { call: "POST /crew-bookings/${bk_a}/confirm", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 660, end_minute: 780, scope: SERVICE_INSTALL }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_b: $.data.id }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 690, end_minute: 780, scope: RESTORATION }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_c: $.data.id }
          trigger:
            - call: "POST /crew-bookings/${bk_b}/confirm"
              payload: {}
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { err: $.data.error_id }
            - { call: "POST /crew-bookings/${bk_c}/confirm", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
          assert:
            - "booking B confirm fails HTTP 409 ERR_CREW_WINDOW_CONFLICT: 660 < 660 + 30 violates the mandatory buffer (adjacency is NOT allowed for crews)"
            - "booking C confirm SUCCEEDS: 690 >= 660 + 30 exactly satisfies the buffer (boundary equality allowed)"
            - "CrewBooking.${bk_b}.status == REQUESTED; CrewBooking.${bk_c}.status == CONFIRMED"
            - "capacity check passes for both attempts (120+120=240 and 120+90=210 <= 480), isolating the buffer rule"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ciac_pay_finalize_refund_conserves_net_cash
        grounds:
          - state_machines.CIACInvoice.REFUND_PENDING_to_REFUNDED
          - calculations.ciac_final_true_up
          - entities.CIACInvoice.fields.payments_applied_cents
          - entities.CIACInvoice.fields.refunds_issued_cents
        distinguishing_aspect: |
          Conserved quantity: NET CASH COLLECTED on the invoice. Forward action payment 322785¢
          plus compensating refund 303798¢ after a downward true-up leaves
          payments_applied − refunds_issued == amount_due == final_total_due (18987¢) — no drift.
        test_recipe:
          setup:
            - "application SERVICE_INSTALLED; extension CONSTRUCTED; invoice PAID 322785¢ (2 loads, 200 ft design, 2 crossings); as-built is SMALLER: 150 ft @ 4500¢, 1 crossing, no rock → final_total 18987¢"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: WATER_HEATER, quantity: 1, btuh_input_rating: 40000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/submit", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/confirm-load", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "POST /main-extensions"
              payload: { service_application_id: "${app_id}", design_footage_ft: 200, crossings: [{ surface_type: ASPHALT, length_ft: 12.0, width_ft: 3.0 }, { surface_type: ASPHALT, length_ft: 8.0, width_ft: 3.0 }], rock_excavation_expected: false }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { me_id: $.data.id }
            - { call: "POST /main-extensions/${me_id}/submit-design", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
            - { call: "POST /main-extensions/${me_id}/approve-design", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "GET /ciac-invoices?main_extension_id=${me_id}"
