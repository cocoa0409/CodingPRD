          intersects zero ACTIVE member service_polygons yields ERR_NO_MEMBERS_IN_AREA (count of
          routed members == 0), a collection-emptiness edge distinct from the numeric SLA-instant
          boundary and reached through POST /locate-tickets/{id}/submit.
