          A different entity pair from the instance above: INCIDENT -> INSURANCE_POLICY. The
          Incident is fully valid on its own terms (REPORTED, incident_type
          NATURAL_DISASTER, severity 3, on a real leg of an APPROVED trip) and an eligible
          MEDICAL_EVAC vendor exists in the destination country, so priority 40 is cleared
          and the request reaches priority 43. The MEDEVAC branch is then refused purely
          because the policy hanging off the trip is a KIDNAP_RANSOM policy rather than a
          MEDICAL_EVAC one — even though that same policy was VERIFIED and had enough
          coverage to pass priorities 43 and 48 at submit-for-approval, because at submit
          only the VERIFIED status is demanded. The SHELTER_IN_PLACE branch of the very same
          incident then succeeds, because that edge declares no insurance precondition at
          all: the dependency is branch-specific, not incident-wide.
