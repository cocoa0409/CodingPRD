  - { method: POST, path: "/irops/vouchers/{id}/redeem", description: "Redeem at actual amount; posts SETTLEMENT CostEntry", roles: [FinanceProcessor], code: 200, input: [actual_amount_cents], output: Voucher, side_effects: ["SETTLEMENT CostEntry posted", "event settled_total_cents recomputed"] }
  - { method: POST, path: "/irops/vouchers/{id}/void", description: "Void an issued voucher; posts compensating REVERSAL CostEntry", roles: [FinanceProcessor], code: 200, input: [], output: Voucher, side_effects: ["REVERSAL CostEntry posted (-face_value_cents)", "event accrual_total_cents recomputed"] }

  - { method: POST, path: "/irops/flights/{id}/crew-assignments", description: "Assign crew to a flight with a duty window; enforces half-open overlap and duty-window validity; recomputes flight crew coverage (bumps Flight.version)", roles: [CrewScheduler], code: 201, input: [crew_member_ref, crew_role, duty_start_utc, duty_end_utc], output: CrewAssignment, side_effects: ["Flight.crew_coverage_status recomputed", "increments Flight.version by 1"] }
  - { method: GET, path: "/irops/crew-assignments/{id}", description: "Read one crew assignment", roles: [CrewScheduler, OpsController, DutyManager], code: 200, input: [], output: CrewAssignment, side_effects: [] }
  - { method: GET, path: "/irops/crew-assignments", description: "List crew assignments", roles: [CrewScheduler, OpsController, DutyManager], code: 200, input: ["flight_id?", "crew_member_ref?", "legality_status?", "limit?", "offset?"], output: "CrewAssignment[]", side_effects: [] }
  - { method: POST, path: "/irops/crew-assignments/{id}/release", description: "Release an assignment", roles: [CrewScheduler], code: 200, input: [], output: CrewAssignment, side_effects: ["Flight.crew_coverage_status recomputed"] }

  - { method: POST, path: "/irops/bookings/{id}/refund-elections", description: "Passenger elects REFUND (ticket money back) or CREDIT (with 10% bonus); requires ELIGIBLE_PENDING within the election window", roles: [ReaccommodationAgent, Passenger], code: 201, input: [election], output: RefundElection, side_effects: ["compensation_status -> ELECTED_REFUND | ELECTED_CREDIT", "amount snapshots computed per election_amounts"] }
  - { method: GET, path: "/irops/refund-elections/{id}", description: "Read one election", roles: [ReaccommodationAgent, FinanceProcessor, DutyManager, Passenger], code: 200, input: [], output: RefundElection, side_effects: [] }
  - { method: GET, path: "/irops/refund-elections", description: "List elections", roles: [ReaccommodationAgent, FinanceProcessor, DutyManager, Passenger], code: 200, input: ["booking_id?", "election_status?", "limit?", "offset?"], output: "RefundElection[]", side_effects: [] }
  - { method: POST, path: "/irops/refund-elections/{id}/process", description: "Finance processes a PENDING election; posts cost entries; booking SETTLED", roles: [FinanceProcessor], code: 200, input: [], output: RefundElection, side_effects: ["REFUND/CREDIT + COMPENSATION CostEntries posted", "booking compensation_status -> SETTLED"] }

  - { method: GET, path: "/irops/communication-logs/{id}", description: "Read one communication log row", roles: [OpsAdmin, ReaccommodationAgent, DutyManager], code: 200, input: [], output: CommunicationLog, side_effects: [] }
  - { method: GET, path: "/irops/communication-logs", description: "List communication log rows", roles: [OpsAdmin, ReaccommodationAgent, DutyManager], code: 200, input: ["booking_id?", "disruption_event_id?", "log_status?", "limit?", "offset?"], output: "CommunicationLog[]", side_effects: [] }
  - { method: POST, path: "/irops/communications/process-due", description: "Ops-run batch per comms_cadence_batch: expire options/vouchers, default overdue elections, send due notifications, emit cadence reminders", roles: [OpsAdmin], code: 200, input: [], output: { expired_options: integer, expired_vouchers: integer, defaulted_elections: integer, sent_count: integer, reminders_sent: integer }, side_effects: ["executes comms_cadence_batch steps 1-5 in pinned order"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Passenger role acting on a resource whose booking chain belongs to a different passenger" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unordered time pair, party_size < 1" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum input value outside the declared domain" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (path ids validated left-to-right, then body ids)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version" }
  - { id: ERR_FLIGHT_NOT_DELAYABLE, http: 409, condition: "Delay/depart/record-actuals attempted from a flight state the machine forbids" }
  - { id: ERR_FLIGHT_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted on IN_FLIGHT, ARRIVED, or already CANCELLED flight" }
  - { id: ERR_EVENT_INVALID_STATE, http: 409, condition: "Event lifecycle action or event-gated operation attempted from the wrong event_status" }
  - { id: ERR_EVENT_CLOSE_BLOCKED, http: 409, condition: "Close attempted with open cases, ISSUED vouchers, ELIGIBLE_PENDING bookings, or PENDING elections" }
  - { id: ERR_BOOKING_NOT_DISRUPTED, http: 409, condition: "Voucher or election attempted on a booking not in DISRUPTED/REBOOKED" }
  - { id: ERR_INVALID_BOOKING_STATE, http: 409, condition: "Cancel attempted on CANCELLED or COMPLETED booking" }
  - { id: ERR_CASE_NOT_COMMITTABLE, http: 409, condition: "Case action attempted from a case_status the transition forbids" }
  - { id: ERR_OPTION_NOT_PROPOSED, http: 409, condition: "Commit names an option not in PROPOSED (rejected, expired, or whose leg flights left {SCHEDULED, DELAYED})" }
  - { id: ERR_VOUCHER_NOT_OPEN, http: 409, condition: "Redeem/void attempted on a non-ISSUED voucher" }
  - { id: ERR_ELECTION_NOT_PENDING, http: 409, condition: "Process attempted on a non-PENDING election" }
  - { id: ERR_INVALID_CREW_STATE, http: 409, condition: "Release attempted on a RELEASED assignment" }
  - { id: ERR_CREW_DUTY_OVERLAP, http: 422, condition: "New duty window overlaps an existing ASSIGNED duty for the same crew member (half-open intervals)" }
  - { id: ERR_COMPENSATION_NOT_ELIGIBLE, http: 422, condition: "Election attempted while compensation_status != ELIGIBLE_PENDING" }
  - { id: ERR_SEATS_INSUFFICIENT, http: 422, condition: "seats_available < party_size on a required cabin, or interline quota exhausted" }
  - { id: ERR_NO_REACCOM_OPTIONS, http: 422, condition: "Selector candidate set is empty; case remains QUEUED/ESCALATED" }
  - { id: ERR_INTERLINE_AGREEMENT_INACTIVE, http: 422, condition: "Interline commit while the agreement is SUSPENDED" }
  - { id: ERR_HOTEL_NIGHT_OVERLAP, http: 422, condition: "Passenger already holds an ISSUED/REDEEMED HOTEL voucher covering an intersecting night set" }
  - { id: ERR_CONNECTION_WINDOW_VIOLATION, http: 422, condition: "Itinerary connection shorter than MIN_CONNECT_MINUTES at booking creation" }
  - { id: ERR_ELECTION_WINDOW_CLOSED, http: 422, condition: "Election attempted after election_deadline" }
  - { id: ERR_VOUCHER_RULE_NOT_MET, http: 422, condition: "HOTEL window < 8h or MEAL meals_count = 0" }
  - { id: ERR_VOUCHER_CAP_EXCEEDED, http: 422, condition: "Per-booking voucher face total would exceed BOOKING_VOUCHER_CAP_CENTS" }
  - { id: ERR_EVENT_COST_CAP_EXCEEDED, http: 422, condition: "Event accrual_total_cents + new face would exceed cost_cap_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsController
    description: "Operations control center controller; owns flight schedule integrity"
    identity: opaque
    exclusive_operations: ["POST /irops/flights", "POST /irops/flights/{id}/delay", "POST /irops/flights/{id}/cancel", "POST /irops/flights/{id}/depart", "POST /irops/flights/{id}/record-actuals"]
    shared_operations: ["flight/booking/case/segment reads", "POST /irops/passengers"]
  - name: DutyManager
    description: "Event-level decision maker; owns disruption event lifecycle and closure"
    identity: opaque
    exclusive_operations: ["POST /irops/disruption-events", "POST /irops/disruption-events/{id}/assess", "POST /irops/disruption-events/{id}/declare-recovery", "POST /irops/disruption-events/{id}/reopen", "POST /irops/disruption-events/{id}/close"]
    shared_operations: ["event/flight/booking/case reads", "cost-summary and cost-entries reads"]
  - name: ReaccommodationAgent
    description: "Passenger recovery agent; books, rebooks, issues vouchers, records elections on behalf of passengers"
    identity: opaque
    exclusive_operations: ["POST /irops/bookings/{id}/vouchers", "POST /irops/reaccommodation-cases/{id}/escalate"]
    shared_operations: ["POST /irops/passengers", "POST /irops/bookings", "POST /irops/bookings/{id}/cancel", "generate-options", "commit", "POST /irops/bookings/{id}/refund-elections", "read surface"]
  - name: CrewScheduler
    description: "Crew rostering operator; owns crew assignments and release"
    identity: opaque
    exclusive_operations: ["POST /irops/flights/{id}/crew-assignments", "POST /irops/crew-assignments/{id}/release"]
    shared_operations: ["flight reads", "crew-assignment reads"]
  - name: FinanceProcessor
    description: "Finance operator; settles vouchers and elections, reads cost ledger"
    identity: opaque
    exclusive_operations: ["POST /irops/vouchers/{id}/redeem", "POST /irops/vouchers/{id}/void", "POST /irops/refund-elections/{id}/process"]
    shared_operations: ["voucher/election/event cost reads", "booking reads"]
  - name: OpsAdmin
    description: "Platform operator; owns logical clock, interline agreements, and the communications batch"
    identity: opaque
    exclusive_operations: ["POST /irops/_clock/set_current_utc", "POST /irops/interline-agreements", "POST /irops/interline-agreements/{id}/suspend", "POST /irops/communications/process-due"]
    shared_operations: ["communication-log reads", "agreement reads", "flight/event reads"]
  - name: Passenger
    description: "Self-service traveler; X-User-ID equals Passenger.id; may act only on own bookings"
    identity: "entity_backed:Passenger"
    exclusive_operations: []
    shared_operations: ["GET own passenger record", "GET /irops/bookings (passenger_id = self)", "GET own booking/segments/vouchers/elections", "POST /irops/bookings (passenger_id = self)", "POST /irops/bookings/{id}/cancel (own)", "generate-options (own case)", "commit (own case)", "POST /irops/bookings/{id}/refund-elections (own)"]

