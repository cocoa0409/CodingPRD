scaffold_corner_design:
  - section: state_machines
    instances:
      - name: course_audit_invalid_transition_submitted_to_approved
        claim_type: invalid_transition
        grounds:
          - state_machines.CourseAudit.transitions
          - state_machines.CourseAudit.initial_state
          - validations[priority=7]
        distinguishing_aspect: "A fresh CourseAudit sits in SUBMITTED; SUBMITTED -> APPROVED is not an edge of that machine (APPROVED is reachable only from IN_REVIEW), so the request dies at priority 7 before any review_round / decision_notes reasoning, and the audit keeps status SUBMITTED with version unchanged."
        test_recipe:
          setup:
            - "School created and one CourseAudit submitted against it, still SUBMITTED with review_round 0"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Corner One High", school_code: "CN0001", country_code: "US", center_code: "7001", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Biology", syllabus_hash: "h-cn-1", submitted_by_user_id: "u-cn-1" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_v1: "$.data.version" }
          trigger:
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v1}", decision_notes: "looks fine" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-1"
          assert:
            - "HTTP 409 and data.error_id == \"ERR_INVALID_STATE\""
            - "GET /course-audits?school_id=${school_id} still reports status SUBMITTED and version ${audit_v1} for ${audit_id}"
            - "school.program_label_authorized stays false (no cascade fired)"
      - name: exam_registration_terminal_cancelled_rejects_confirmed
        claim_type: terminal_state_rejection
        grounds:
          - state_machines.ExamRegistration.terminal_states
          - state_machines.ExamRegistration.transitions
          - validations[priority=7]
        distinguishing_aspect: "CANCELLED is a terminal state of ExamRegistration and no edge leaves it toward CONFIRMED, so a re-confirm is refused with ERR_INVALID_STATE at priority 7; priority 8 (ERR_ALREADY_TERMINAL) is unreachable for this shape because the from-state check fires first."
        test_recipe:
          setup:
            - "Approved school with an OPEN order holding one REGISTERED registration, which is then cancelled"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Corner Two High", school_code: "CN0002", country_code: "US", center_code: "7002", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Chemistry", syllabus_hash: "h-cn-2", submitted_by_user_id: "u-cn-2" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_v1}" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-2"
              captures: { audit_v2: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v2}", decision_notes: "syllabus meets the curricular requirements" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-2"
            - call: "POST /ap-program/students"
              payload: { full_name: "Cora Nunez", school_id: "${school_id}", student_code: "S0001", grade_level: 12 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { student_id: "$.data.id" }
            - call: "POST /ap-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ap-program/exam-orders"
              payload: { school_id: "${school_id}", course_audit_id: "${audit_id}", administration_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_id: "$.data.id", order_v1: "$.data.version" }
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "OPEN", expected_exam_order_version: "${order_v1}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
            - call: "POST /ap-program/exam-registrations"
              payload: { exam_order_id: "${order_id}", student_id: "${student_id}", exam_subject: "AP-CHEM", registration_tier: "REGULAR" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { reg_id: "$.data.id" }
            - call: "POST /ap-program/exam-registrations/${reg_id}/status-transitions"
              payload: { to_status: "CANCELLED" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          trigger:
            - call: "POST /ap-program/exam-registrations/${reg_id}/status-transitions"
              payload: { to_status: "CONFIRMED" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          assert:
            - "HTTP 409 and data.error_id == \"ERR_INVALID_STATE\""
            - "GET /exam-registrations/${reg_id} still reports status CANCELLED"
            - "ExamRegistration.refundable_cents stays 18000 from the cancel (no re-credit fired)"
      - name: reader_terminal_inactive_rejects_calibrating
        claim_type: terminal_state_rejection
        grounds:
          - state_machines.Reader.terminal_states
          - state_machines.Reader.transitions
          - validations[priority=7]
        distinguishing_aspect: "INACTIVE is the single terminal state of Reader; once a calibrated reader with assigned_score_count 0 is deactivated, the CALIBRATING edge that exists from RECRUITED/DEMOTED is not available, so the retry returns ERR_INVALID_STATE rather than resurrecting the reader."
        test_recipe:
          setup:
            - "A reader recruited, calibrated with 20 samples at 0.9000 agreement, then deactivated by PlatformAdmin"
          setup_api_calls:
            - call: "POST /ap-program/readers"
              payload: { full_name: "Dana Ito", subject_expertise: "AP-STAT" }
              as: ScoringSpecialist
              as_user_id: "spec-cn-3"
              captures: { reader_id: "$.data.id" }
            - call: "POST /ap-program/readers/${reader_id}/status-transitions"
              payload: { to_status: "CALIBRATING" }
              as: ScoringSpecialist
              as_user_id: "spec-cn-3"
            - call: "POST /ap-program/readers/${reader_id}/status-transitions"
              payload: { to_status: "CALIBRATED", calibration_sample_count: 20, calibration_agreement_rate: 0.9000 }
              as: ScoringSpecialist
              as_user_id: "spec-cn-3"
            - call: "POST /ap-program/readers/${reader_id}/status-transitions"
              payload: { to_status: "INACTIVE" }
              as: PlatformAdmin
              as_user_id: "admin-cn-3"
          trigger:
            - call: "POST /ap-program/readers/${reader_id}/status-transitions"
              payload: { to_status: "CALIBRATING" }
              as: ScoringSpecialist
              as_user_id: "spec-cn-3"
          assert:
            - "HTTP 409 and data.error_id == \"ERR_INVALID_STATE\""
            - "GET /readers/${reader_id} still reports calibration_status INACTIVE and load_status INACTIVE"
      - name: exam_order_terminal_voided_rejects_open
        claim_type: terminal_state_rejection
        grounds:
          - state_machines.ExamOrder.terminal_states
          - state_machines.ExamOrder.transitions
          - validations[priority=7]
        distinguishing_aspect: "A DRAFT order voided before any registration is in a terminal state; because priority 7 outranks priority 8, asking it to OPEN again returns ERR_INVALID_STATE (not ERR_ALREADY_TERMINAL), and the school's designation authority is not re-spent."
        test_recipe:
          setup:
            - "Approved school with a DRAFT order that is then voided by its SchoolCoordinator"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Corner Four High", school_code: "CN0004", country_code: "US", center_code: "7004", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Physics 1", syllabus_hash: "h-cn-4", submitted_by_user_id: "u-cn-4" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_v1}" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-4"
              captures: { audit_v2: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v2}", decision_notes: "syllabus meets the curricular requirements" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-4"
            - call: "POST /ap-program/exam-orders"
              payload: { school_id: "${school_id}", course_audit_id: "${audit_id}", administration_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_id: "$.data.id", order_v1: "$.data.version" }
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "VOIDED", expected_exam_order_version: "${order_v1}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_v2: "$.data.version" }
          trigger:
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "OPEN", expected_exam_order_version: "${order_v2}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          assert:
            - "HTTP 409 and data.error_id == \"ERR_INVALID_STATE\""
            - "GET /exam-orders/${order_id} still reports status VOIDED"
            - "school.program_label_authorized stays true (the void does not revoke the approval)"
  - section: validations
    instances:
      - name: registration_refused_outside_ordering_window
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - calculations.ordering_window_classification
          - errors[ERR_ORDER_WINDOW_CLOSED]
        distinguishing_aspect: "The default logical clock 2026-09-01T00:00:00Z classifies as NOT_OPEN, so a registration attempt against an otherwise perfectly OPEN order is refused with ERR_ORDER_WINDOW_CLOSED (422) — a temporal refusal, not a state one."
        test_recipe:
          setup:
            - "Approved school, clock left at its startup default 2026-09-01T00:00:00Z, one DRAFT order opened to OPEN"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Corner Five High", school_code: "CN0005", country_code: "US", center_code: "7005", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP US History", syllabus_hash: "h-cn-5", submitted_by_user_id: "u-cn-5" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_v1}" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-5"
              captures: { audit_v2: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v2}", decision_notes: "syllabus meets the curricular requirements" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-5"
            - call: "POST /ap-program/students"
              payload: { full_name: "Elsa Ng", school_id: "${school_id}", student_code: "S0001", grade_level: 11 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { student_id: "$.data.id" }
            - call: "POST /ap-program/exam-orders"
              payload: { school_id: "${school_id}", course_audit_id: "${audit_id}", administration_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_id: "$.data.id", order_v1: "$.data.version" }
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "OPEN", expected_exam_order_version: "${order_v1}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          trigger:
            - call: "POST /ap-program/exam-registrations"
              payload: { exam_order_id: "${order_id}", student_id: "${student_id}", exam_subject: "AP-US-HIST", registration_tier: "REGULAR" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          assert:
            - "HTTP 422 and data.error_id == \"ERR_ORDER_WINDOW_CLOSED\""
            - "GET /exam-orders/${order_id}/registrations reports total_count 0"
      - name: order_submit_below_min_size_returns_min_size_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - constants.MIN_ORDER_SIZE
          - errors[ERR_ORDER_MIN_SIZE]
        distinguishing_aspect: "With the clock inside the REGULAR window the temporal gate is satisfied, so an OPEN order holding zero registrations reaches the aggregate-size rule and fails with ERR_ORDER_MIN_SIZE (422) instead of the window error."
        test_recipe:
          setup:
            - "Approved school, clock at 2026-12-01T00:00:00Z (REGULAR), one order opened to OPEN with no registrations at all"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Corner Six High", school_code: "CN0006", country_code: "US", center_code: "7006", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Microeconomics", syllabus_hash: "h-cn-6", submitted_by_user_id: "u-cn-6" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_v1}" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-6"
              captures: { audit_v2: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v2}", decision_notes: "syllabus meets the curricular requirements" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-6"
            - call: "POST /ap-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ap-program/exam-orders"
              payload: { school_id: "${school_id}", course_audit_id: "${audit_id}", administration_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_id: "$.data.id", order_v1: "$.data.version" }
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "OPEN", expected_exam_order_version: "${order_v1}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_v2: "$.data.version" }
          trigger:
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "SUBMITTED", expected_exam_order_version: "${order_v2}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          assert:
            - "HTTP 422 and data.error_id == \"ERR_ORDER_MIN_SIZE\""
            - "GET /exam-orders/${order_id} still reports status OPEN and registration_count 0"
            - "order_fee_cents stays 0 (the provisional variant is never charged on a refused submit)"
      - name: confirm_with_unpaid_late_fee_returns_payment_required
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - calculations.late_order_fee.variants.per_registration
          - errors[ERR_LATE_FEE_UNPAID]
        distinguishing_aspect: "A LATE-tier registration assessed inside the LATE window carries late_fee_cents 4000, and the FEE_PENDING -> CONFIRMED edge is a legal edge of the machine, so the refusal is fiscal (402 ERR_LATE_FEE_UNPAID) rather than a state error."
        test_recipe:
          setup:
            - "Clock at 2027-02-15T00:00:00Z (LATE window), approved school with an OPEN order, one LATE-tier registration moved into FEE_PENDING so its late fee is assessed"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Corner Seven High", school_code: "CN0007", country_code: "US", center_code: "7007", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Statistics", syllabus_hash: "h-cn-7", submitted_by_user_id: "u-cn-7" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_v1}" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-7"
              captures: { audit_v2: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v2}", decision_notes: "syllabus meets the curricular requirements" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-7"
            - call: "POST /ap-program/students"
              payload: { full_name: "Femi Ojo", school_id: "${school_id}", student_code: "S0001", grade_level: 12 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { student_id: "$.data.id" }
            - call: "POST /ap-program/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ap-program/exam-orders"
              payload: { school_id: "${school_id}", course_audit_id: "${audit_id}", administration_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_id: "$.data.id", order_v1: "$.data.version" }
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "OPEN", expected_exam_order_version: "${order_v1}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
            - call: "POST /ap-program/exam-registrations"
              payload: { exam_order_id: "${order_id}", student_id: "${student_id}", exam_subject: "AP-STAT", registration_tier: "LATE" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { reg_id: "$.data.id" }
            - call: "POST /ap-program/exam-registrations/${reg_id}/status-transitions"
              payload: { to_status: "FEE_PENDING" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          trigger:
            - call: "POST /ap-program/exam-registrations/${reg_id}/status-transitions"
              payload: { to_status: "CONFIRMED" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          assert:
            - "the FEE_PENDING setup response carried late_fee_cents == 4000"
            - "HTTP 402 and data.error_id == \"ERR_LATE_FEE_UNPAID\""
            - "GET /exam-registrations/${reg_id} still reports status FEE_PENDING and fees_paid_cents 0"
      - name: audit_approval_without_decision_notes_returns_audit_not_reviewed
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - state_machines.CourseAudit.IN_REVIEW_to_APPROVED.preconditions
          - errors[ERR_AUDIT_NOT_REVIEWED]
        distinguishing_aspect: "The audit is already in IN_REVIEW so the from-state is legal and the reviewer differs from the submitter, but APPROVED arrives with no decision_notes; the refusal is the review-completeness rule ERR_AUDIT_NOT_REVIEWED (409), which no other endpoint of this surface can raise."
        test_recipe:
          setup:
            - "School with one CourseAudit moved SUBMITTED -> IN_REVIEW, so review_round is 1 and the audit sits in IN_REVIEW"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Corner Eight High", school_code: "CN0008", country_code: "US", center_code: "7008", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Human Geography", syllabus_hash: "h-cn-8", submitted_by_user_id: "u-cn-8" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_v1}" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-8"
              captures: { audit_v2: "$.data.version" }
          trigger:
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v2}" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-8"
          assert:
            - "HTTP 409 and data.error_id == \"ERR_AUDIT_NOT_REVIEWED\""
            - "GET /course-audits?school_id=${school_id} still reports status IN_REVIEW and review_round 1"
            - "school.program_label_authorized stays false and no DRAFT order is opened"
      - name: accommodation_approval_with_two_docs_returns_documents_incomplete
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - constants.DOC_COMPLETENESS_THRESHOLD
          - errors[ERR_DOCUMENTS_INCOMPLETE]
        distinguishing_aspect: "documentation_completeness 2 is enough to enter UNDER_DOC_REVIEW (>= 1) but below the approval threshold 3, so APPROVED is refused with ERR_DOCUMENTS_INCOMPLETE (422) and the student's accommodation_eligible stays false."
        test_recipe:
          setup:
            - "School and student exist; an EXTENDED_TIME accommodation request filed with documentation_completeness 2 and moved into UNDER_DOC_REVIEW by a different reviewer"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Corner Nine High", school_code: "CN0009", country_code: "US", center_code: "7009", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/students"
              payload: { full_name: "Gita Rao", school_id: "${school_id}", student_code: "S0001", grade_level: 11 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { student_id: "$.data.id" }
            - call: "POST /ap-program/accommodation-requests"
              payload: { student_id: "${student_id}", exam_subject: "AP-BIO", accommodation_type: "EXTENDED_TIME", documentation_completeness: 2, submitted_by_user_id: "u-cn-9" }
