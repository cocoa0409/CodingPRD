# =============================================================================
# Task 1872 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine Difficulty Rules x >=2 instances; every chain replayable from empty-DB
# using only SCAFFOLD.yaml §1.5 endpoints.
# Fixture constants used throughout (RegistrarStaff creates them per instance):
#   Rate IN_STATE/UNDERGRAD: per_credit 35000, threshold 12, flat 420000,
#     max_flat 18, overload 35000, window [2026-08-01 .. 2026-12-31] CLOSED
#   Term dates: start 2026-08-24, end 2026-12-11, census 2026-09-07,
#     full_refund_end 2026-09-07, mid_refund_end 2026-10-05, withdrawal_deadline 2026-11-13
#   Term policy: flat_fee 15000, hold_threshold 20000, plan_setup_fee 2500,
#     late_fee_pct 0.05, grace_days 10
#   Clock default: 2026-08-01T00:00:00Z
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: refund_tiered_vs_pro_rata
        grounds:
          - calculations.refund_calculation
          - entities.Term.fields.refund_policy
          - entities.Refund.fields.pct_applied
        distinguishing_aspect: |
          Same enrollment size (12 credits -> 435000 assessed) and same withdrawal
          date (2026-09-21) produce refund 217500 under SCHEDULE_TIERED (50% tier)
          but 323249 under PRO_RATA (pct 0.7431) — the divergence lives in the
          Refund/Enrollment entity domain, driven by Term.refund_policy.
        test_recipe:
          setup:
            - "Two terms T_SCHED (refund_policy=SCHEDULE_TIERED) and T_PRO (refund_policy=PRO_RATA), identical dates; both OPEN with an identical IN_STATE/UNDERGRADUATE rate card"
            - "Student A enrolled 12cr in T_SCHED (assessed 435000); Student B enrolled 12cr in T_PRO (assessed 435000)"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-T", name: "Fall T", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t_tier: $.data.id } }
            - { call: "POST /bursar/terms/${t_tier}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t_tier}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/terms", payload: { code: "FALL-P", name: "Fall P", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "PRO_RATA", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t_pro: $.data.id } }
            - { call: "POST /bursar/terms/${t_pro}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t_pro}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "A Tier", external_ref: "S-A", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_a: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_a}", term_id: "${t_tier}", credit_hours: 12, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { enr_a: $.data.id } }
            - { call: "POST /bursar/students", payload: { full_name: "B Pro", external_ref: "S-B", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_b: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_b}", term_id: "${t_pro}", credit_hours: 12, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { enr_b: $.data.id } }
          trigger:
            - { call: "POST /bursar/enrollments/${enr_a}/withdraw", payload: { effective_date: "2026-09-21" }, as: RegistrarStaff }
            - { call: "POST /bursar/enrollments/${enr_b}/withdraw", payload: { effective_date: "2026-09-21" }, as: RegistrarStaff }
            - { call: "GET /bursar/refunds?enrollment_id=${enr_a}", as: BursarStaff, captures: { r_a_amt: "$.data[0].amount_cents", r_a_pct: "$.data[0].pct_applied" } }
            - { call: "GET /bursar/refunds?enrollment_id=${enr_b}", as: BursarStaff, captures: { r_b_amt: "$.data[0].amount_cents", r_b_pct: "$.data[0].pct_applied" } }
          assert:
            - "Refund[${enr_a}].policy_variant == SCHEDULE_TIERED and pct_applied == 0.5 and amount_cents == 217500"
            - "Refund[${enr_b}].policy_variant == PRO_RATA and pct_applied == 0.7431 and amount_cents == 323249"
            - "${r_a_amt} == 217500 and ${r_b_amt} == 323249 (identical data, variants diverge by exactly 105749 cents)"

      - name: sponsor_invoice_net_vs_gross
        grounds:
          - calculations.sponsor_invoice_amount
          - entities.SponsorAgreement.fields.billing_basis
          - calculations.agreement_utilization
        distinguishing_aspect: |
          Identical charges (TUITION 420000 + FEE 15000) and an identical 100000-cent
          posted scholarship produce invoice total 335000 under NET_OF_WAIVER but
          435000 under GROSS — the divergence lives in the SponsorInvoice entity
          domain, driven by SponsorAgreement.billing_basis.
        test_recipe:
          setup:
            - "Term OPEN with IN_STATE/UNDERGRADUATE rate card; students S1 and S2 each enrolled 12cr (TUITION 420000 + FEE 15000 = 435000)"
            - "Each account has a 100000-cent SCHOLARSHIP waiver POSTED (allocated to the TUITION entry)"
            - "Agreement A_NET for S1 (billing_basis=NET_OF_WAIVER), agreement A_GROSS for S2 (billing_basis=GROSS); both cap 1000000, cover tuition+fees, window [2026-08-01, 2026-12-31)"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Net Kid", external_ref: "S-NET", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_net: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_net}", term_id: "${t1}", credit_hours: 12, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc_net: $.data.account_id } }
            - { call: "POST /bursar/students", payload: { full_name: "Gross Kid", external_ref: "S-GRS", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_grs: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_grs}", term_id: "${t1}", credit_hours: 12, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc_grs: $.data.account_id } }
            - { call: "POST /bursar/waivers", payload: { account_id: "${acc_net}", kind: "SCHOLARSHIP", awarded_cents: 100000 }, as: BursarStaff, captures: { w_net: $.data.id } }
            - { call: "GET /bursar/accounts/${acc_net}", as: BursarStaff, captures: { acc_net_v: $.data.version } }
            - { call: "POST /bursar/waivers/${w_net}/post", payload: { expected_account_version: "${acc_net_v}" }, as: BursarStaff }
            - { call: "POST /bursar/waivers", payload: { account_id: "${acc_grs}", kind: "SCHOLARSHIP", awarded_cents: 100000 }, as: BursarStaff, captures: { w_grs: $.data.id } }
            - { call: "GET /bursar/accounts/${acc_grs}", as: BursarStaff, captures: { acc_grs_v: $.data.version } }
            - { call: "POST /bursar/waivers/${w_grs}/post", payload: { expected_account_version: "${acc_grs_v}" }, as: BursarStaff }
            - { call: "POST /bursar/sponsor-agreements", payload: { sponsor_name: "NetCorp", student_id: "${s_net}", term_id: "${t1}", cap_cents: 1000000, covers_tuition: true, covers_fees: true, billing_basis: "NET_OF_WAIVER", start_date: "2026-08-01", end_date: "2026-12-31" }, as: BursarStaff, captures: { ag_net: $.data.id } }
            - { call: "POST /bursar/sponsor-agreements", payload: { sponsor_name: "GrossCorp", student_id: "${s_grs}", term_id: "${t1}", cap_cents: 1000000, covers_tuition: true, covers_fees: true, billing_basis: "GROSS", start_date: "2026-08-01", end_date: "2026-12-31" }, as: BursarStaff, captures: { ag_grs: $.data.id } }
          trigger:
            - { call: "POST /bursar/sponsor-invoices", payload: { agreement_id: "${ag_net}" }, as: BursarStaff, captures: { inv_net_total: $.data.total_cents } }
            - { call: "POST /bursar/sponsor-invoices", payload: { agreement_id: "${ag_grs}" }, as: BursarStaff, captures: { inv_grs_total: $.data.total_cents } }
          assert:
            - "SponsorInvoice(A_NET).total_cents == 335000 (TUITION line 320000 = 420000 - 100000 waiver, FEE line 15000)"
            - "SponsorInvoice(A_GROSS).total_cents == 435000 (full charge amounts despite the waiver)"
            - "${inv_net_total} == 335000 and ${inv_grs_total} == 435000; both invoices DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tuition_flat_threshold_overload
        grounds:
          - calculations.tuition_assessment
          - entities.TuitionRate.fields.full_time_threshold_credits
          - entities.TuitionRate.fields.max_flat_credits
        distinguishing_aspect: |
          Mode (a): >=3 inputs (credit_hours, per_credit/flat/overload rate card,
          residency+level selection) with non-linear branch interaction — 11cr costs
          400000 (per-credit branch), 12cr costs 435000 (flat branch engages at >= 12),
          20cr costs 505000 (flat + 2 overload credits at 35000).
        test_recipe:
          setup:
            - "Term OPEN with IN_STATE/UNDERGRADUATE rate card (threshold 12, flat 420000, max_flat 18, overload 35000, per_credit 35000)"
            - "Three IN_STATE UNDERGRADUATE students"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Eleven", external_ref: "S-11", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_11: $.data.id } }
            - { call: "POST /bursar/students", payload: { full_name: "Twelve", external_ref: "S-12", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_12: $.data.id } }
            - { call: "POST /bursar/students", payload: { full_name: "Twenty", external_ref: "S-20", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_20: $.data.id } }
          trigger:
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_11}", term_id: "${t1}", credit_hours: 11, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { enr_11: $.data.id, tot_11: $.data.assessed_total_cents } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_12}", term_id: "${t1}", credit_hours: 12, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { enr_12: $.data.id, tot_12: $.data.assessed_total_cents } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_20}", term_id: "${t1}", credit_hours: 20, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { enr_20: $.data.id, tot_20: $.data.assessed_total_cents } }
          assert:
            - "Enrollment[${enr_11}].assessed_total_cents == 400000 (11 x 35000 + 15000 fee; per-credit branch)"
            - "Enrollment[${enr_12}].assessed_total_cents == 435000 (flat 420000 + 15000 fee; >= threshold engages flat)"
            - "Enrollment[${enr_20}].assessed_total_cents == 505000 (flat 420000 + 2 overload x 35000 + 15000 fee)"

      - name: installment_rounding_remainder_and_late_fee_order
        grounds:
          - calculations.installment_split
          - calculations.late_fee_assessment
          - entities.Installment.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — total 100001 over 3 installments rounds
          each share first (33334) and sweeps the remainder into the LAST installment
          (33333); late fees are rounded per installment (1667 + 1667 = 3334), one cent
          more than sum-then-round (3333).
        test_recipe:
          setup:
            - "Term OPEN; student enrolled 3cr (TUITION 105000 + FEE 15000 = 120000); payment of 22499 brings balance to 97501"
            - "Plan with installment_count=3, first_due_date=2026-09-01 -> total 100001 (97501 + 2500 fee)"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Rounder", external_ref: "S-RND", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s1}", term_id: "${t1}", credit_hours: 3, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc1: $.data.account_id } }
            - { call: "POST /bursar/payments", payload: { account_id: "${acc1}", amount_cents: 22499, method: "CARD" }, as: BursarStaff }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { acc1_v: $.data.version } }
            - { call: "POST /bursar/payment-plans", payload: { account_id: "${acc1}", installment_count: 3, first_due_date: "2026-09-01", expected_account_version: "${acc1_v}" }, as: BursarStaff, captures: { plan1: $.data.id } }
            - { call: "GET /bursar/payment-plans/${plan1}/installments", as: BursarStaff, captures: { i1: "$.data[0].id", i2: "$.data[1].id" } }
          trigger:
            - { call: "POST /bursar/_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: BursarStaff }
            - { call: "POST /bursar/terms/${t1}/run-billing-cycle", payload: {}, as: BursarStaff, captures: { fees_posted: $.data.late_fees_posted } }
            - { call: "GET /bursar/accounts/${acc1}/ledger", as: BursarStaff }
          assert:
            - "Installments of ${plan1}: amounts [33334, 33334, 33333]; sum == 100001 (round-per-installment, remainder to LAST)"
            - "Installment due_dates == [2026-09-01, 2026-10-01, 2026-10-31]"
            - "${fees_posted} == 2 (installments 1 and 2 past grace at clock 2026-10-15; installment 3 due 2026-10-31 untouched)"
            - "Ledger holds exactly two LATE_FEE entries of 1667 cents each (per-installment round_half_up(33334*0.05)=1667; sum 3334, NOT sum-then-round 3333)"

      - name: refund_payout_evaluation_order
        grounds:
          - calculations.account_ledger_recompute
          - state_machines.Refund.CALCULATED_to_POSTED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — approving
          a 50000-cent refund on a zero-balance account posts CHARGE_REVERSAL first
          (balance -50000), then REFUND_PAYOUT is fixed from that pre-payout balance
          (+50000), ending exactly at 0; the payout must not feed back into its own base.
        test_recipe:
          setup:
            - "Term OPEN; student enrolled 1cr (TUITION 35000 + FEE 15000 = 50000); 50000-cent payment posted -> balance 0"
            - "Withdrawal effective 2026-09-05 (100% tier) -> Refund CALCULATED amount 50000"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Payout", external_ref: "S-PAY", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s1}", term_id: "${t1}", credit_hours: 1, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc1: $.data.account_id, enr1: $.data.id } }
            - { call: "POST /bursar/payments", payload: { account_id: "${acc1}", amount_cents: 50000, method: "ACH" }, as: BursarStaff }
            - { call: "POST /bursar/enrollments/${enr1}/withdraw", payload: { effective_date: "2026-09-05" }, as: RegistrarStaff }
            - { call: "GET /bursar/refunds?enrollment_id=${enr1}", as: BursarStaff, captures: { ref1: "$.data[0].id" } }
          trigger:
            - { call: "POST /bursar/refunds/${ref1}/transition", payload: { action: "APPROVE" }, as: BursarManager }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { bal_after: $.data.balance_cents } }
          assert:
            - "Refund.${ref1}.amount_cents == 50000 and status == POSTED"
            - "Ledger contains CHARGE_REVERSAL 50000 (charge_kind=TUITION) followed by REFUND_PAYOUT 50000"
            - "${bal_after} == 0 (payout sized from the pre-payout balance of -50000; no circular feedback)"
            - "Account payments_total_cents == 50000, charges_total_cents == 0 after reversal"
          # note: charges_total = 35000 + 15000 - 50000 = 0

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: payment_plan_default_cure_cycle
        grounds:
          - state_machines.PaymentPlan.ACTIVE_to_DEFAULTED
          - state_machines.PaymentPlan.DEFAULTED_to_ACTIVE
          - entities.PaymentPlan.fields.defaulted_count
        distinguishing_aspect: |
          PaymentPlan runs a CYCLE (ACTIVE -> DEFAULTED -> ACTIVE): a billing cycle
          defaults the plan when installments pass grace, and paying off all past-due
          installments cures it back to ACTIVE with defaulted_count == 1 — not a
          one-way pipeline.
        test_recipe:
          setup:
            - "Term OPEN; student enrolled 9cr (balance 330000); plan created at clock default 2026-08-01 with 4 installments of 83125 (total 332500), first_due 2026-09-01"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Cycler", external_ref: "S-CYC", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s1}", term_id: "${t1}", credit_hours: 9, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc1: $.data.account_id } }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { acc1_v: $.data.version } }
            - { call: "POST /bursar/payment-plans", payload: { account_id: "${acc1}", installment_count: 4, first_due_date: "2026-09-01", expected_account_version: "${acc1_v}" }, as: BursarStaff, captures: { plan1: $.data.id } }
            - { call: "GET /bursar/payment-plans/${plan1}/installments", as: BursarStaff, captures: { i1: "$.data[0].id", i2: "$.data[1].id" } }
            - { call: "POST /bursar/_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: BursarStaff }
            - { call: "POST /bursar/terms/${t1}/run-billing-cycle", payload: {}, as: BursarStaff }
          trigger:
            - { call: "GET /bursar/payment-plans/${plan1}", as: BursarStaff, captures: { st_mid: $.data.status, dc_mid: $.data.defaulted_count } }
            - { call: "POST /bursar/installments/${i1}/pay", payload: { amount_cents: 83125 }, as: BursarStaff }
            - { call: "POST /bursar/installments/${i2}/pay", payload: { amount_cents: 83125 }, as: BursarStaff }
            - { call: "GET /bursar/payment-plans/${plan1}", as: BursarStaff, captures: { st_end: $.data.status, dc_end: $.data.defaulted_count } }
          assert:
            - "${st_mid} == DEFAULTED and ${dc_mid} == 1 (cycle flipped installments 1-2 past grace)"
            - "${st_end} == ACTIVE after paying installments 1 and 2 (cure loop closes; not terminal)"
            - "${dc_end} == 1 (default count accumulates, never resets)"
            - "Installments 3 and 4 remain SCHEDULED; installments 1-2 PAID"

      - name: sponsor_invoice_dispute_reinstate_cycle
        grounds:
          - state_machines.SponsorInvoice.ISSUED_to_DISPUTED
          - state_machines.SponsorInvoice.DISPUTED_to_ISSUED
        distinguishing_aspect: |
          SponsorInvoice runs a CYCLE distinct from PaymentPlan's: ISSUED ->
          PARTIALLY_PAID -> DISPUTED -> back to PARTIALLY_PAID on REINSTATE (because
          paid_cents > 0), with the 200000-cent remittance preserved across the loop.
        test_recipe:
          setup:
            - "Term OPEN; student enrolled 12cr (435000); GROSS agreement cap 1000000 covering tuition+fees; invoice generated (435000) and ISSUED; remittance of 200000 recorded"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Sponsored", external_ref: "S-SPN", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s1}", term_id: "${t1}", credit_hours: 12, effective_date: "2026-08-25" }, as: RegistrarStaff }
            - { call: "POST /bursar/sponsor-agreements", payload: { sponsor_name: "CycleCorp", student_id: "${s1}", term_id: "${t1}", cap_cents: 1000000, covers_tuition: true, covers_fees: true, billing_basis: "GROSS", start_date: "2026-08-01", end_date: "2026-12-31" }, as: BursarStaff, captures: { ag1: $.data.id } }
            - { call: "POST /bursar/sponsor-invoices", payload: { agreement_id: "${ag1}" }, as: BursarStaff, captures: { inv1: $.data.id } }
            - { call: "POST /bursar/sponsor-invoices/${inv1}/transition", payload: { action: "ISSUE" }, as: BursarStaff }
            - { call: "POST /bursar/sponsor-invoices/${inv1}/payments", payload: { amount_cents: 200000 }, as: BursarStaff, captures: { st_paid: $.data.status } }
            - { call: "POST /bursar/sponsor-invoices/${inv1}/transition", payload: { action: "DISPUTE", dispute_reason: "Sponsor queries fee line" }, as: BursarStaff, captures: { st_disp: $.data.status } }
          trigger:
            - { call: "POST /bursar/sponsor-invoices/${inv1}/transition", payload: { action: "REINSTATE" }, as: BursarStaff, captures: { st_back: $.data.status, paid_back: $.data.paid_cents, reason_back: $.data.dispute_reason } }
          assert:
            - "${st_paid} == PARTIALLY_PAID (200000 of 435000)"
            - "${st_disp} == DISPUTED with dispute_reason recorded"
            - "${st_back} == PARTIALLY_PAID (NOT ISSUED — paid_cents 200000 survived the loop) and ${paid_back} == 200000"
            - "${reason_back} is null (dispute cleared on reinstate)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: billing_cycle_default_hold_cascade
        grounds:
          - state_machines.Installment.SCHEDULED_to_PAST_DUE
          - state_machines.PaymentPlan.ACTIVE_to_DEFAULTED
          - state_machines.StudentAccount.OPEN_to_PAST_DUE
          - calculations.hold_evaluation
          - calculations.late_fee_assessment
        distinguishing_aspect: |
          Depth-4 chain from ONE trigger (run-billing-cycle): installment flips
          PAST_DUE -> that flip defaults the plan -> the default accelerates the
          account's full open balance into past_due -> the threshold breach creates
          two AUTO FinancialHolds; each hop is caused by the previous hop, not by
          the cycle directly.
        test_recipe:
          setup:
            - "Term OPEN; student enrolled 9cr (330000); 4-installment plan (83125 each, first_due 2026-09-01) created at clock 2026-08-01 — account OPEN, zero holds, zero past_due"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Cascade", external_ref: "S-CAS", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s1}", term_id: "${t1}", credit_hours: 9, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc1: $.data.account_id } }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { acc1_v: $.data.version } }
            - { call: "POST /bursar/payment-plans", payload: { account_id: "${acc1}", installment_count: 4, first_due_date: "2026-09-01", expected_account_version: "${acc1_v}" }, as: BursarStaff, captures: { plan1: $.data.id } }
            - { call: "POST /bursar/_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: BursarStaff }
          trigger:
            - { call: "POST /bursar/terms/${t1}/run-billing-cycle", payload: {}, as: BursarStaff, captures: { n_pd: $.data.installments_marked_past_due, n_def: $.data.plans_defaulted, n_fees: $.data.late_fees_posted, n_holds: $.data.holds_placed } }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { a_status: $.data.status, a_pd: $.data.past_due_cents, a_bal: $.data.balance_cents } }
            - { call: "GET /bursar/accounts/${acc1}/holds?status=ACTIVE", as: BursarStaff }
          assert:
            - "${n_pd} == 2 and ${n_def} == 1 and ${n_fees} == 2 and ${n_holds} == 2"
            - "PaymentPlan.${plan1}.status == DEFAULTED (caused BY the installment flips, not by the cycle directly)"
            - "${a_status} == PAST_DUE and ${a_pd} == 340812 (accelerated FULL open balance: 330000 + 2500 plan fee + 2 x 4156 late fees)"
            - "${a_bal} == 340812"
            - "Two ACTIVE holds exist: hold_type REGISTRATION and TRANSCRIPT, both origin == AUTO, reason == PAST_DUE_BALANCE"

      - name: payment_reversal_reaging_cascade
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - calculations.past_due_evaluation
          - calculations.hold_evaluation
          - calculations.account_ledger_recompute
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (payment reversal): reversal posts
          PAYMENT_REVERSAL -> the unwind restores open amounts on the original
          charge entries -> past_due re-ages to 50000 and crosses the 20000
          threshold -> AUTO holds appear; no billing cycle is involved.
        test_recipe:
          setup:
            - "Term OPEN; student enrolled 1cr (50000, due 2026-09-07); full 50000 payment posted at clock 2026-08-05 -> balance 0, no past due, no holds"
            - "Clock advanced to 2026-10-01 (charges now past their due date, but no evaluation has run since)"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Reversal", external_ref: "S-REV", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s1}", term_id: "${t1}", credit_hours: 1, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc1: $.data.account_id } }
            - { call: "POST /bursar/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: BursarStaff }
            - { call: "POST /bursar/payments", payload: { account_id: "${acc1}", amount_cents: 50000, method: "CHECK" }, as: BursarStaff, captures: { pay1: $.data.id } }
            - { call: "POST /bursar/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: BursarStaff }
          trigger:
            - { call: "POST /bursar/payments/${pay1}/reverse", payload: { reason: "NSF" }, as: BursarStaff, captures: { p_status: $.data.status } }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { a_status: $.data.status, a_pd: $.data.past_due_cents, a_bal: $.data.balance_cents, a_pay: $.data.payments_total_cents } }
            - { call: "GET /bursar/accounts/${acc1}/holds?status=ACTIVE", as: BursarStaff }
          assert:
            - "${p_status} == REVERSED and Payment.${pay1}.reversed_reason == NSF"
            - "${a_bal} == 50000 and ${a_pay} == 0 (PAYMENT_REVERSAL restored the debt)"
            - "${a_pd} == 50000 and ${a_status} == PAST_DUE (open charges due 2026-09-07 re-aged against clock 2026-10-01)"
            - "Exactly two ACTIVE AUTO holds appeared (REGISTRATION, TRANSCRIPT) as a downstream effect of the reversal"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: installment_pay_state_beats_amount
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_INSTALLMENT_STATE_INVALID]
          - errors[ERR_INSTALLMENT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Category pair state-vs-business_fiscal: paying an already-PAID installment
          with a wrong amount violates BOTH the p4 state precondition and the p8
          exact-amount rule; the p4 ERR_INSTALLMENT_STATE_INVALID (409) must win.
        test_recipe:
          setup:
            - "Term OPEN; student enrolled 2cr (85000: TUITION 70000 + FEE 15000); plan of 2 installments, total 87500 -> installments 43750 each; installment 1 fully PAID"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Prio One", external_ref: "S-PR1", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s1}", term_id: "${t1}", credit_hours: 2, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc1: $.data.account_id } }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { acc1_v: $.data.version } }
            - { call: "POST /bursar/payment-plans", payload: { account_id: "${acc1}", installment_count: 2, first_due_date: "2026-09-01", expected_account_version: "${acc1_v}" }, as: BursarStaff, captures: { plan1: $.data.id } }
            - { call: "GET /bursar/payment-plans/${plan1}/installments", as: BursarStaff, captures: { i1: "$.data[0].id" } }
            - { call: "POST /bursar/installments/${i1}/pay", payload: { amount_cents: 43750 }, as: BursarStaff }
          trigger:
            - { call: "POST /bursar/installments/${i1}/pay", payload: { amount_cents: 1 }, as: BursarStaff, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INSTALLMENT_STATE_INVALID (installment already PAID; state priority 4 beats fiscal priority 8 — NOT ERR_INSTALLMENT_AMOUNT_MISMATCH)"
            - "HTTP status 409 (not 422)"

      - name: sponsor_invoice_referential_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_NO_ACCOUNT_FOR_AGREEMENT]
          - errors[ERR_BILLING_WINDOW_CLOSED]
        distinguishing_aspect: |
          Category pair business_referential-vs-business_temporal: invoicing an
          agreement whose student never enrolled in the term (no account exists)
          while ALSO past the billing cutoff violates p5 and p6; p5's
          ERR_NO_ACCOUNT_FOR_AGREEMENT must win.
        test_recipe:
          setup:
            - "Term FALL-26 (end 2026-12-11) OPEN; student S enrolled in NOTHING (no account exists for S in this term)"
            - "Agreement for S in FALL-26 (creation needs only student+term to exist)"
            - "Clock at 2027-01-15, past the billing cutoff (end_date + 30 days = 2027-01-10)"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "NoAcct", external_ref: "S-NOA", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/sponsor-agreements", payload: { sponsor_name: "GhostCorp", student_id: "${s1}", term_id: "${t1}", cap_cents: 500000, covers_tuition: true, covers_fees: true, billing_basis: "GROSS", start_date: "2026-08-01", end_date: "2026-12-31" }, as: BursarStaff, captures: { ag1: $.data.id } }
            - { call: "POST /bursar/_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: BursarStaff }
          trigger:
            - { call: "POST /bursar/sponsor-invoices", payload: { agreement_id: "${ag1}" }, as: BursarStaff, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NO_ACCOUNT_FOR_AGREEMENT (referential priority 5 beats temporal priority 6 — NOT ERR_BILLING_WINDOW_CLOSED)"
            - "HTTP status 422"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: refund_tier_date_boundary
        grounds:
          - calculations.refund_calculation
          - entities.Term.fields.full_refund_end_date
        distinguishing_aspect: |
          Metric: refund percentage by date. Inclusive boundary: effective exactly ON
          full_refund_end_date (2026-09-07) earns 100% (435000); one day later
          (2026-09-08) drops to 50% (217500) — reached via POST /bursar/enrollments/{id}/withdraw.
        test_recipe:
          setup:
            - "Term OPEN (SCHEDULE_TIERED); students A and B each enrolled 12cr (assessed 435000 each)"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "OnCensus", external_ref: "S-OC", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_a: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_a}", term_id: "${t1}", credit_hours: 12, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { enr_a: $.data.id } }
            - { call: "POST /bursar/students", payload: { full_name: "DayAfter", external_ref: "S-DA", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_b: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_b}", term_id: "${t1}", credit_hours: 12, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { enr_b: $.data.id } }
          trigger:
            - { call: "POST /bursar/enrollments/${enr_a}/withdraw", payload: { effective_date: "2026-09-07" }, as: RegistrarStaff }
            - { call: "POST /bursar/enrollments/${enr_b}/withdraw", payload: { effective_date: "2026-09-08" }, as: RegistrarStaff }
            - { call: "GET /bursar/refunds?enrollment_id=${enr_a}", as: BursarStaff, captures: { amt_a: "$.data[0].amount_cents", pct_a: "$.data[0].pct_applied" } }
            - { call: "GET /bursar/refunds?enrollment_id=${enr_b}", as: BursarStaff, captures: { amt_b: "$.data[0].amount_cents", pct_b: "$.data[0].pct_applied" } }
          assert:
            - "${pct_a} == 1.0 and ${amt_a} == 435000 (boundary date itself is INCLUSIVE 100%)"
            - "${pct_b} == 0.5 and ${amt_b} == 217500 (one day later halves the refund)"

      - name: hold_threshold_equality
        grounds:
          - calculations.hold_evaluation
          - entities.Term.fields.hold_threshold_cents
        distinguishing_aspect: |
          Metric: past-due cents against a 20000 threshold. past_due EXACTLY 20000
          places AUTO holds (>= comparison); 19999 places none — reached via
          POST /bursar/terms/{id}/run-billing-cycle, a different endpoint than the
          refund boundary.
        test_recipe:
          setup:
            - "Term OPEN (hold_threshold 20000); student A enrolled 1cr (50000) paid 30000 -> open 20000; student B enrolled 1cr paid 30001 -> open 19999"
            - "Clock at 2026-10-01 (charges due 2026-09-07 are past due)"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "At Thresh", external_ref: "S-AT", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_a: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_a}", term_id: "${t1}", credit_hours: 1, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc_a: $.data.account_id } }
            - { call: "POST /bursar/payments", payload: { account_id: "${acc_a}", amount_cents: 30000, method: "CARD" }, as: BursarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Below Thresh", external_ref: "S-BT", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_b: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_b}", term_id: "${t1}", credit_hours: 1, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc_b: $.data.account_id } }
            - { call: "POST /bursar/payments", payload: { account_id: "${acc_b}", amount_cents: 30001, method: "CARD" }, as: BursarStaff }
            - { call: "POST /bursar/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: BursarStaff }
          trigger:
            - { call: "POST /bursar/terms/${t1}/run-billing-cycle", payload: {}, as: BursarStaff, captures: { n_holds: $.data.holds_placed } }
            - { call: "GET /bursar/accounts/${acc_a}", as: BursarStaff, captures: { pd_a: $.data.past_due_cents, st_a: $.data.status } }
            - { call: "GET /bursar/accounts/${acc_b}", as: BursarStaff, captures: { pd_b: $.data.past_due_cents, st_b: $.data.status } }
            - { call: "GET /bursar/accounts/${acc_a}/holds?status=ACTIVE", as: BursarStaff }
            - { call: "GET /bursar/accounts/${acc_b}/holds?status=ACTIVE", as: BursarStaff }
          assert:
            - "${pd_a} == 20000 and ${st_a} == PAST_DUE; account A has exactly 2 ACTIVE AUTO holds (>= threshold triggers)"
            - "${pd_b} == 19999 and ${st_b} == PAST_DUE; account B has 0 holds (one cent below)"
            - "${n_holds} == 2 (only A's REGISTRATION + TRANSCRIPT)"

      - name: full_time_credit_threshold
        grounds:
          - calculations.tuition_assessment
          - entities.TuitionRate.fields.full_time_threshold_credits
        distinguishing_aspect: |
          Metric: credit hours against threshold 12 via POST /bursar/enrollments.
          11 credits prices per-credit (400000); exactly 12 engages the flat rate
          (435000) — the >= comparison engages AT the threshold, not above it.
        test_recipe:
          setup:
            - "Term OPEN with rate card (threshold 12); two IN_STATE UNDERGRADUATE students"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Half", external_ref: "S-H1", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_11: $.data.id } }
            - { call: "POST /bursar/students", payload: { full_name: "Full", external_ref: "S-F1", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s_12: $.data.id } }
          trigger:
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_11}", term_id: "${t1}", credit_hours: 11, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { tot_11: $.data.assessed_total_cents } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s_12}", term_id: "${t1}", credit_hours: 12, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { tot_12: $.data.assessed_total_cents } }
          assert:
            - "${tot_11} == 400000 (11 < 12: per-credit branch, 385000 + 15000)"
            - "${tot_12} == 435000 (12 >= 12: flat branch engages AT the threshold, 420000 + 15000)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_blocked_by_registration_hold
        grounds:
          - validations[priority=5]
          - state_machines.FinancialHold
          - errors[ERR_REGISTRATION_HOLD_ACTIVE]
        distinguishing_aspect: |
          Entity pair Enrollment x FinancialHold: creating an Enrollment (even in a
          DIFFERENT, healthy term) is rejected while any account of the student
          carries an ACTIVE REGISTRATION hold — the hold's state gates a different
          aggregate's creation.
        test_recipe:
          setup:
            - "Term FALL-26 OPEN; student enrolled 1cr (50000), never paid; clock 2026-10-01; billing cycle ran -> ACTIVE REGISTRATION+TRANSCRIPT holds on the fall account"
            - "Second term SPR-27 exists, OPEN, with its own rate card"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Holden", external_ref: "S-HLD", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s1}", term_id: "${t1}", credit_hours: 1, effective_date: "2026-08-25" }, as: RegistrarStaff }
            - { call: "POST /bursar/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: BursarStaff }
            - { call: "POST /bursar/terms/${t1}/run-billing-cycle", payload: {}, as: BursarStaff }
            - { call: "POST /bursar/terms", payload: { code: "SPR-27", name: "Spring 2027", start_date: "2027-01-11", end_date: "2027-05-07", census_date: "2027-02-01", full_refund_end_date: "2027-02-01", mid_refund_end_date: "2027-03-01", withdrawal_deadline: "2027-04-02", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t2: $.data.id } }
            - { call: "POST /bursar/terms/${t2}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t2}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-12-01", effective_to: "2027-05-31" }, as: RegistrarStaff }
          trigger:
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s1}", term_id: "${t2}", credit_hours: 3, effective_date: "2027-01-11" }, as: RegistrarStaff, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_REGISTRATION_HOLD_ACTIVE (ACTIVE REGISTRATION hold on the FALL account blocks SPRING registration)"
            - "HTTP status 422; no Enrollment row created"

      - name: plan_blocked_by_collections_account
        grounds:
          - state_machines.StudentAccount
          - errors[ERR_ACCOUNT_STATE_INVALID]
          - endpoints: "POST /bursar/payment-plans"
        distinguishing_aspect: |
          Entity pair PaymentPlan x StudentAccount (different from Enrollment x
          FinancialHold): plan creation is legal only while the account is OPEN or
          PAST_DUE; once the account sits in COLLECTIONS, the same request is
          rejected with ERR_ACCOUNT_STATE_INVALID.
        test_recipe:
          setup:
            - "Term OPEN; student enrolled 9cr (330000); clock 2026-10-15; cycle ran -> account PAST_DUE 330000; send-to-collections -> COLLECTIONS with 16500 collections fee (balance 346500)"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Collected", external_ref: "S-COL", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s1}", term_id: "${t1}", credit_hours: 9, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc1: $.data.account_id } }
            - { call: "POST /bursar/_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: BursarStaff }
            - { call: "POST /bursar/terms/${t1}/run-billing-cycle", payload: {}, as: BursarStaff }
            - { call: "POST /bursar/accounts/${acc1}/send-to-collections", payload: {}, as: BursarStaff, captures: { st_col: $.data.status } }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { acc1_v: $.data.version } }
          trigger:
            - { call: "POST /bursar/payment-plans", payload: { account_id: "${acc1}", installment_count: 3, first_due_date: "2026-11-01", expected_account_version: "${acc1_v}" }, as: BursarStaff, captures: { err: $.data.error_id } }
          assert:
            - "${st_col} == COLLECTIONS with balance 346500 (330000 + 16500 fee)"
            - "${err} == ERR_ACCOUNT_STATE_INVALID (plan creation gated on account state; 409)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: sponsor_agreement_half_open_adjacency
        grounds:
          - validations[priority=7]
          - entities.SponsorAgreement.fields.start_date
          - entities.SponsorAgreement.fields.end_date
          - errors[ERR_SPONSOR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          HALF-OPEN interval semantics on SponsorAgreement (resource = student
          coverage): [2026-08-01, 2026-12-31) then [2026-12-31, 2027-05-31) touch
          but do NOT conflict (adjacency allowed); [2026-10-01, 2027-02-01) with an
          intersecting covered kind DOES conflict.
        test_recipe:
          setup:
            - "Term and student exist; agreement A1 [2026-08-01, 2026-12-31) covering tuition only"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/students", payload: { full_name: "Sponsor Hub", external_ref: "S-SPH", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/sponsor-agreements", payload: { sponsor_name: "Alpha", student_id: "${s1}", term_id: "${t1}", cap_cents: 300000, covers_tuition: true, covers_fees: false, billing_basis: "GROSS", start_date: "2026-08-01", end_date: "2026-12-31" }, as: BursarStaff, captures: { ag1: $.data.id } }
          trigger:
            - { call: "POST /bursar/sponsor-agreements", payload: { sponsor_name: "Beta", student_id: "${s1}", term_id: "${t1}", cap_cents: 200000, covers_tuition: true, covers_fees: false, billing_basis: "GROSS", start_date: "2026-12-31", end_date: "2027-05-31" }, as: BursarStaff, captures: { ag2: $.data.id } }
            - { call: "POST /bursar/sponsor-agreements", payload: { sponsor_name: "Gamma", student_id: "${s1}", term_id: "${t1}", cap_cents: 100000, covers_tuition: true, covers_fees: false, billing_basis: "GROSS", start_date: "2026-10-01", end_date: "2027-02-01" }, as: BursarStaff, captures: { err: $.data.error_id } }
          assert:
            - "A2 created (adjacent at 2026-12-31 is NOT overlap under half-open semantics): SponsorAgreement.${ag2} exists, status ACTIVE"
            - "${err} == ERR_SPONSOR_WINDOW_OVERLAP (2026-10-01..2027-02-01 intersects A1's window AND covered kind TUITION intersects; 409)"

      - name: tuition_rate_closed_interval_touch
        grounds:
          - validations[priority=7]
          - entities.TuitionRate.fields.effective_from
          - entities.TuitionRate.fields.effective_to
          - errors[ERR_RATE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          CLOSED interval semantics on TuitionRate (different resource, different
          geometry than sponsor agreements): a new rate whose effective_from equals
          the existing rate's effective_to (2026-12-31) OVERLAPS — touching
          endpoints conflict under closed intervals, unlike half-open adjacency.
        test_recipe:
          setup:
            - "Term exists; rate R1 for (term, IN_STATE, UNDERGRADUATE) effective [2026-08-01, 2026-12-31]"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 36000, full_time_threshold_credits: 12, flat_rate_cents: 432000, max_flat_credits: 18, overload_rate_cents: 36000, effective_from: "2026-12-31", effective_to: "2027-05-31" }, as: RegistrarStaff, captures: { err: $.data.error_id } }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 36000, full_time_threshold_credits: 12, flat_rate_cents: 432000, max_flat_credits: 18, overload_rate_cents: 36000, effective_from: "2027-01-01", effective_to: "2027-05-31" }, as: RegistrarStaff, captures: { r2: $.data.id } }
          assert:
            - "${err} == ERR_RATE_WINDOW_OVERLAP (effective_from 2026-12-31 touches R1's effective_to — CLOSED intervals share that date; 409)"
            - "Second create starting 2027-01-01 succeeds: TuitionRate.${r2} created (gap of one day is required under closed semantics)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_post_reverse_ledger_conservation
        grounds:
          - calculations.account_ledger_recompute
          - calculations.payment_waterfall
          - state_machines.Payment.POSTED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: the account's cash ledger position. Posting a payment
          and then reversing it MUST restore balance_cents and payments_total_cents
          to their pre-payment values exactly (330000 / 0) — reversal is additive,
          never destructive.
        test_recipe:
          setup:
            - "Term OPEN; student enrolled 9cr -> balance 330000, payments_total 0"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Conserve", external_ref: "S-CON", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s1}", term_id: "${t1}", credit_hours: 9, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc1: $.data.account_id } }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { bal0: $.data.balance_cents, pay0: $.data.payments_total_cents } }
          trigger:
            - { call: "POST /bursar/payments", payload: { account_id: "${acc1}", amount_cents: 100000, method: "CARD" }, as: BursarStaff, captures: { pay1: $.data.id } }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { bal_mid: $.data.balance_cents, pay_mid: $.data.payments_total_cents } }
            - { call: "POST /bursar/payments/${pay1}/reverse", payload: { reason: "NSF" }, as: BursarStaff }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { bal_end: $.data.balance_cents, pay_end: $.data.payments_total_cents } }
          assert:
            - "${bal0} == 330000 and ${pay0} == 0"
            - "${bal_mid} == 230000 and ${pay_mid} == 100000 (payment applied)"
            - "${bal_end} == 330000 and ${pay_end} == 0 (post+reverse pair conserves the ledger exactly; drift forbidden)"
            - "Ledger now holds PAYMENT 100000 and PAYMENT_REVERSAL 100000 entries (both retained; net zero)"

      - name: invoice_issue_void_cap_conservation
        grounds:
          - calculations.agreement_utilization
          - state_machines.SponsorInvoice.ISSUED_to_VOID
          - calculations.account_ledger_recompute
        distinguishing_aspect: |
          Conserved quantity: sponsor cap utilization (a DIFFERENT conserved
          quantity than the cash ledger). Issuing then voiding a 435000-cent invoice
          MUST return agreement.billed_cents and account.sponsor_total_cents to 0 —
          utilization never leaks across the compensate pair.
        test_recipe:
          setup:
            - "Term OPEN; student enrolled 12cr (435000); GROSS agreement cap 1000000 covering both kinds; DRAFT invoice of 435000 generated"
          setup_api_calls:
            - { call: "POST /bursar/terms", payload: { code: "FALL-26", name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", census_date: "2026-09-07", full_refund_end_date: "2026-09-07", mid_refund_end_date: "2026-10-05", withdrawal_deadline: "2026-11-13", refund_policy: "SCHEDULE_TIERED", flat_fee_cents: 15000, hold_threshold_cents: 20000, plan_setup_fee_cents: 2500, late_fee_pct: 0.05, grace_days: 10 }, as: RegistrarStaff, captures: { t1: $.data.id } }
            - { call: "POST /bursar/terms/${t1}/transition", payload: { action: "OPEN" }, as: RegistrarStaff }
            - { call: "POST /bursar/tuition-rates", payload: { term_id: "${t1}", residency: "IN_STATE", level: "UNDERGRADUATE", per_credit_rate_cents: 35000, full_time_threshold_credits: 12, flat_rate_cents: 420000, max_flat_credits: 18, overload_rate_cents: 35000, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: RegistrarStaff }
            - { call: "POST /bursar/students", payload: { full_name: "Cap Conserve", external_ref: "S-CAP", residency_status: "IN_STATE", level: "UNDERGRADUATE" }, as: RegistrarStaff, captures: { s1: $.data.id } }
            - { call: "POST /bursar/enrollments", payload: { student_id: "${s1}", term_id: "${t1}", credit_hours: 12, effective_date: "2026-08-25" }, as: RegistrarStaff, captures: { acc1: $.data.account_id } }
            - { call: "POST /bursar/sponsor-agreements", payload: { sponsor_name: "CapCorp", student_id: "${s1}", term_id: "${t1}", cap_cents: 1000000, covers_tuition: true, covers_fees: true, billing_basis: "GROSS", start_date: "2026-08-01", end_date: "2026-12-31" }, as: BursarStaff, captures: { ag1: $.data.id } }
            - { call: "POST /bursar/sponsor-invoices", payload: { agreement_id: "${ag1}" }, as: BursarStaff, captures: { inv1: $.data.id } }
          trigger:
            - { call: "POST /bursar/sponsor-invoices/${inv1}/transition", payload: { action: "ISSUE" }, as: BursarStaff }
            - { call: "GET /bursar/sponsor-agreements/${ag1}", as: BursarStaff, captures: { billed_mid: $.data.billed_cents } }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { sp_mid: $.data.sponsor_total_cents, bal_mid: $.data.balance_cents } }
            - { call: "POST /bursar/sponsor-invoices/${inv1}/transition", payload: { action: "VOID" }, as: BursarStaff }
            - { call: "GET /bursar/sponsor-agreements/${ag1}", as: BursarStaff, captures: { billed_end: $.data.billed_cents, ag_status: $.data.status } }
            - { call: "GET /bursar/accounts/${acc1}", as: BursarStaff, captures: { sp_end: $.data.sponsor_total_cents, bal_end: $.data.balance_cents } }
          assert:
            - "${billed_mid} == 435000 and ${sp_mid} == 435000 and ${bal_mid} == 0 (issuance moved the debt to the sponsor)"
            - "${billed_end} == 0 and ${sp_end} == 0 and ${bal_end} == 435000 (issue+void conserves cap utilization and the student ledger)"
            - "${ag_status} == ACTIVE (void did not terminate the agreement; cap fully available again)"
            - "Ledger holds SPONSOR_CHARGE 435000 and SPONSOR_REVERSAL 435000"
