scenario: "Fantasy Football League: draft (Snake/Auction), roster (Starter/Bench/IR), Waiver (FAAB bidding), trades (Veto voting), playoff bracket, Dynasty Keeper, injury replacement."
domain_name: fantasy-football-league
api_prefix: /leagues

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - ops_run_checkpoint
    - scheduled_deferred_actions
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: League
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the league."
        constraints: "1..80 chars"
      - name: season_year
        type: integer
        source: input
        description: "NFL season the league is playing (e.g., 2026)."
        constraints: ">= 2020"
      - name: draft_mode
        type: enum
        source: input
        description: "Snake-order draft or English-auction draft."
        constraints: "one of {SNAKE, AUCTION}"
      - name: scoring_mode
        type: enum
        source: input
        description: "Per-point conversion ruleset."
        constraints: "one of {STANDARD, HALF_PPR, PPR}"
      - name: team_count
        type: integer
        source: input
        description: "Number of franchises in the league (fixed at create)."
        constraints: "even number in [4,16]"
      - name: roster_size
        type: integer
        source: input
        description: "Total roster spots per team (starters + bench + IR)."
        constraints: "in [12,20]"
      - name: starter_count
        type: integer
        source: input
        description: "Number of starter slots per team."
        constraints: "in [7,11]"
      - name: ir_slots
        type: integer
        source: input
        description: "Number of injured-reserve slots per team."
        constraints: "in [0,4]"
      - name: faab_budget_dollars
        type: integer
        source: input
        description: "Per-team FAAB budget allocated once at league activation; never auto-refilled."
        constraints: ">=0; <=1000"
      - name: auction_budget_dollars
        type: integer
        source: input
        description: "Per-team auction budget when draft_mode=AUCTION; ignored for SNAKE."
        default: 200
        constraints: ">=0; <=500"
      - name: keeper_mode
        type: enum
        source: input
        description: "Dynasty keeper carry-over policy."
        constraints: "one of {NONE, REDRAFT, DYNASTY}"
      - name: keeper_cap
        type: integer
        source: input
        description: "Max keepers per team when keeper_mode!=NONE."
        default: 0
        constraints: "in [0, roster_size-1]"
      - name: veto_quorum_pct
        type: integer
        source: input
        description: "Percent of non-trade-party teams required to veto a trade (>= triggers veto)."
        default: 50
        constraints: "in [25,100]"
      - name: trade_review_hours
        type: integer
        source: input
        description: "Hours a trade stays in voting before auto-finalizing."
        default: 48
        constraints: "in [0,168]"
      - name: waiver_period_hours
        type: integer
        source: input
        description: "Hours a dropped/injured player sits in waivers before becoming free-agent."
        default: 48
        constraints: "in [0,168]"
      - name: playoff_team_count
        type: integer
        source: input
        description: "Number of teams that make playoffs (must be a power of two)."
        constraints: "in {2,4,8}"
      - name: regular_season_weeks
        type: integer
        source: input
        description: "Number of regular-season weeks before playoff bracket."
        constraints: "in [10,14]"
      - name: status
        type: enum
        source: computed
        description: "League lifecycle state."
        constraints: "one of {DRAFT_PENDING, DRAFTING, REGULAR_SEASON, PLAYOFFS, COMPLETED, ARCHIVED}"
      - name: current_week
        type: integer
        source: computed
        description: "Current scoring week (1-indexed); 0 while DRAFT_PENDING/DRAFTING."
        default: 0
      - name: now_ts
        type: datetime
        source: system
        description: "League-scoped logical clock advanced only by POST /leagues/{id}/_clock/advance."

  - name: Team
    parent: League
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "Owning league."
      - name: name
        type: string
        source: input
        description: "Team name."
        constraints: "1..60 chars, unique within league"
      - name: manager_user_id
        type: string
        source: input
        description: "User identity of the franchise manager (entity-backed)."
      - name: draft_position
        type: integer
        source: system
        description: "1..team_count seed; assigned when league transitions DRAFT_PENDING→DRAFTING."
      - name: faab_balance_dollars
        type: integer
        source: computed
        description: "Remaining FAAB; initialized to League.faab_budget_dollars; decremented on awarded claims only."
        constraints: ">=0"
      - name: auction_balance_dollars
        type: integer
        source: computed
        description: "Remaining auction budget during DRAFTING; resets to League.auction_budget_dollars at DRAFTING entry."
        constraints: ">=0"
      - name: wins
        type: integer
        source: computed
        description: "Regular-season wins."
        default: 0
      - name: losses
        type: integer
        source: computed
        description: "Regular-season losses."
        default: 0
      - name: points_for
        type: number
        source: computed
        description: "Cumulative points scored in completed regular-season matchups."
        default: 0
      - name: standing_seed
        type: integer
        source: computed
        description: "Final seed (1=best) after regular_season_weeks; null until REGULAR_SEASON completes."

  - name: Player
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Player legal name."
      - name: nfl_team
        type: string
        source: input
        description: "NFL franchise abbreviation (e.g., KC)."
      - name: position
        type: enum
        source: input
        description: "Eligible roster position."
        constraints: "one of {QB,RB,WR,TE,K,DST,FLEX_RWT}"
      - name: status_tag
        type: enum
        source: computed
        description: "Health tag; flipped by POST /players/{id}/status."
        constraints: "one of {ACTIVE, QUESTIONABLE, OUT, IR_ELIGIBLE}"
        default: ACTIVE
      - name: weekly_proj_points
        type: number
        source: input
        description: "Projected score for current week, used by waiver tiebreak and replacement scoring."
        default: 0

  - name: DraftPick
    parent: League
    common_fields: false
    fields:
      - name: league_id
        type: string
        source: input
        description: "Owning league."
      - name: team_id
        type: string
        source: input
        description: "Acquiring team."
      - name: player_id
        type: string
        source: input
        description: "Drafted player."
      - name: round_number
        type: integer
        source: system
        description: "Snake-mode round; 0 for AUCTION (rounds not meaningful)."
        default: 0
      - name: overall_pick_index
        type: integer
        source: system
        description: "Sequential pick number 1..(team_count*roster_size_drafted) for SNAKE; matches creation order for AUCTION."
      - name: price_dollars
        type: integer
        source: input
        description: "Winning auction bid; 0 for SNAKE."
        default: 0
      - name: is_keeper
        type: boolean
        source: input
        description: "True when pick was pre-assigned via Keeper carry-over."
        default: false

  - name: RosterSlot
    parent: Team
    common_fields: true
    fields:
      - name: team_id
        type: string
        source: input
        description: "Owning team."
      - name: player_id
        type: string
        source: input
        description: "Player occupying the slot."
      - name: slot_type
        type: enum
        source: input
        description: "Lineup placement."
        constraints: "one of {STARTER, BENCH, IR}"
      - name: position_label
        type: string
        source: input
        description: "Specific starter lineup label (e.g., QB1, RB2, FLEX); null for BENCH/IR."
      - name: locked_until_ts
        type: datetime
        source: computed
        description: "Lineup-lock deadline (League.now_ts >= this → mutations rejected)."

  - name: WaiverClaim
    parent: Team
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "League context."
      - name: team_id
        type: string
        source: input
        description: "Bidding team."
      - name: add_player_id
        type: string
        source: input
        description: "Player to add."
      - name: drop_player_id
        type: string
        source: input
        description: "Player to drop in the same move; null if no drop required."
        default: null
      - name: bid_dollars
        type: integer
        source: input
        description: "FAAB bid; 0 is allowed (lowest priority by tiebreak)."
        constraints: ">=0; <=Team.faab_balance_dollars at submit time"
      - name: priority_seed
        type: integer
        source: system
        description: "Tiebreak number captured at claim creation (lower = wins ties); seeded from inverse-standings (Team with worst record gets 1)."
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle."
        constraints: "one of {PENDING, AWARDED, LOST, CANCELED}"
      - name: settle_ts
        type: datetime
        source: system
        description: "Earliest League.now_ts at which a /_waivers/process call may consider this claim."

  - name: TradeProposal
    parent: League
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "League context."
      - name: proposing_team_id
        type: string
        source: input
        description: "Team initiating the trade."
      - name: counterparty_team_id
        type: string
        source: input
        description: "Team receiving the offer."
      - name: send_player_ids
        type: array
        source: input
        description: "Player IDs the proposer sends (must be on proposer's roster, all slot_types eligible)."
        constraints: "non-empty; each owned by proposing_team_id"
      - name: receive_player_ids
        type: array
        source: input
        description: "Player IDs requested from counterparty."
        constraints: "non-empty; each owned by counterparty_team_id"
      - name: send_faab_dollars
        type: integer
        source: input
        description: "FAAB transfer from proposer to counterparty (one-direction only; receive side is 0)."
        default: 0
        constraints: ">=0"
      - name: receive_faab_dollars
        type: integer
        source: input
        description: "FAAB transfer from counterparty to proposer."
        default: 0
        constraints: ">=0; send_faab_dollars==0 OR receive_faab_dollars==0 (no two-way money)"
      - name: status
        type: enum
        source: computed
        description: "Trade lifecycle state."
        constraints: "one of {OFFERED, ACCEPTED_PENDING_REVIEW, VETOED, EXECUTED, REJECTED, EXPIRED, CANCELED}"
      - name: review_deadline_ts
        type: datetime
        source: computed
        description: "League.now_ts at which the review window closes (set when entering ACCEPTED_PENDING_REVIEW)."
      - name: veto_count
        type: integer
        source: computed
        description: "Running count of TradeVote rows with vote=VETO. Recomputed on every vote."
        default: 0

  - name: TradeVote
    parent: TradeProposal
    common_fields: false
    fields:
      - name: trade_proposal_id
        type: string
        source: input
        description: "Vote belongs to this proposal."
      - name: voting_team_id
        type: string
        source: input
        description: "Team casting the vote (must not be proposer or counterparty)."
      - name: vote
        type: enum
        source: input
        description: "Vote direction."
        constraints: "one of {VETO, APPROVE}"
      - name: cast_at_ts
        type: datetime
        source: system
        description: "League.now_ts when the vote was recorded."

  - name: MatchupWeek
    parent: League
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "League context."
      - name: week_number
        type: integer
        source: input
        description: "1..regular_season_weeks for regular; regular_season_weeks+1..regular_season_weeks+log2(playoff_team_count) for playoff."
      - name: home_team_id
        type: string
        source: input
        description: "Home team."
      - name: away_team_id
        type: string
        source: input
        description: "Away team."
      - name: home_points
        type: number
        source: computed
        description: "Sum of starter actual_points contributions on home roster at lock time (with injury replacements applied)."
        default: 0
      - name: away_points
        type: number
        source: computed
        description: "Mirror of home_points for away team."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Matchup lifecycle."
        constraints: "one of {SCHEDULED, LOCKED, SCORED}"
      - name: is_playoff
        type: boolean
        source: input
        description: "True for bracket weeks; false for regular season."
        default: false
      - name: bracket_round
        type: integer
        source: input
        description: "1=first playoff round, 2=semifinal, etc.; null when is_playoff=false."

  - name: KeeperDesignation
    parent: Team
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "League context."
      - name: team_id
        type: string
        source: input
        description: "Team keeping the player."
      - name: player_id
        type: string
        source: input
        description: "Kept player."
      - name: season_year
        type: integer
        source: input
        description: "Season the keeper applies to (must equal League.season_year while DRAFT_PENDING)."
      - name: assigned_round
        type: integer
        source: computed
        description: "Pre-allocated SNAKE round (cost to team); null when League.draft_mode=AUCTION."
      - name: assigned_price_dollars
        type: integer
        source: computed
        description: "Pre-allocated AUCTION price (debited at DRAFTING entry); null when draft_mode=SNAKE."
      - name: status
        type: enum
        source: computed
        description: "Designation lifecycle."
        constraints: "one of {DECLARED, LOCKED, CONVERTED, REVOKED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: League
    initial_state: DRAFT_PENDING
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT_PENDING
        to: DRAFTING
        trigger: "POST /leagues/{id}/start-draft"
        actor: Commissioner
        preconditions:
          - "Team rows count == team_count"
          - "Every KeeperDesignation.status in {DECLARED} count(team)<=keeper_cap"
          - "Every Team has draft_position assigned (server assigns at this transition)"
        side_effects:
          - "For each team: auction_balance_dollars := League.auction_budget_dollars (if AUCTION) else 0"
          - "For each KeeperDesignation in DECLARED: status=LOCKED; if AUCTION, debit assigned_price_dollars from owning team's auction_balance_dollars; if SNAKE, write a DraftPick row with overall_pick_index allocated to assigned_round position"
      - from: DRAFTING
        to: REGULAR_SEASON
        trigger: "POST /leagues/{id}/finish-draft"
        actor: Commissioner
        preconditions:
          - "DraftPick count == team_count * (roster_size - ir_slots)"
          - "Every DraftPick.player_id is unique across the league"
        side_effects:
          - "current_week := 1"
          - "For each (DraftPick.team_id, DraftPick.player_id) write a RosterSlot row with slot_type=BENCH"
          - "For each KeeperDesignation in LOCKED: status=CONVERTED"
          - "Auto-generate MatchupWeek rows for weeks 1..regular_season_weeks via round-robin"
      - from: REGULAR_SEASON
        to: PLAYOFFS
        trigger: "POST /leagues/{id}/_clock/advance with target_week > regular_season_weeks"
        actor: system
        preconditions:
          - "Every MatchupWeek with week_number<=regular_season_weeks is SCORED"
          - "current_week == regular_season_weeks"
        side_effects:
          - "For each Team: compute standing_seed by (wins desc, points_for desc, team.created_at asc)"
          - "Generate single-elimination MatchupWeek rows for log2(playoff_team_count) rounds, top playoff_team_count seeds; is_playoff=true; standard 1-vs-8 / 2-vs-7 bracket seeding"
      - from: PLAYOFFS
        to: COMPLETED
        trigger: "POST /leagues/{id}/_clock/advance crossing the final bracket week"
        actor: system
        preconditions:
          - "Final-round MatchupWeek status=SCORED"
        side_effects:
          - "current_week := regular_season_weeks + log2(playoff_team_count) + 1 (sentinel)"
      - from: COMPLETED
        to: ARCHIVED
        trigger: "POST /leagues/{id}/archive"
        actor: Commissioner
        preconditions: []
        side_effects:
          - "All PENDING WaiverClaim rows → CANCELED"
          - "All OFFERED/ACCEPTED_PENDING_REVIEW TradeProposal rows → REJECTED"

  - entity: TradeProposal
    initial_state: OFFERED
    terminal_states: [VETOED, EXECUTED, REJECTED, EXPIRED, CANCELED]
    transitions:
      - from: OFFERED
        to: ACCEPTED_PENDING_REVIEW
        trigger: "POST /trades/{id}/accept"
        actor: Manager
        preconditions:
          - "Acting Manager.team_id == counterparty_team_id"
          - "All send_player_ids still on proposing_team_id's roster"
          - "All receive_player_ids still on counterparty_team_id's roster"
          - "proposing_team's faab_balance_dollars >= send_faab_dollars; counterparty's >= receive_faab_dollars"
        side_effects:
          - "review_deadline_ts := League.now_ts + League.trade_review_hours hours"
          - "veto_count := 0"
      - from: OFFERED
        to: REJECTED
        trigger: "POST /trades/{id}/reject"
        actor: Manager
        preconditions:
          - "Acting Manager.team_id == counterparty_team_id"
        side_effects: []
      - from: OFFERED
        to: CANCELED
        trigger: "POST /trades/{id}/cancel"
        actor: Manager
        preconditions:
          - "Acting Manager.team_id == proposing_team_id"
        side_effects: []
      - from: ACCEPTED_PENDING_REVIEW
        to: VETOED
        trigger: "POST /trades/{id}/votes (vote=VETO) when threshold first crossed"
        actor: Manager
        preconditions:
          - "veto_count after this insert / (team_count - 2) * 100 >= League.veto_quorum_pct"
          - "League.now_ts < review_deadline_ts"
        side_effects:
          - "No player or FAAB movement"
      - from: ACCEPTED_PENDING_REVIEW
        to: EXECUTED
        trigger: "POST /leagues/{id}/_clock/advance crossing review_deadline_ts"
        actor: system
        preconditions:
          - "League.now_ts >= review_deadline_ts"
          - "veto_count / (team_count - 2) * 100 < League.veto_quorum_pct"
        side_effects:
          - "For each p in send_player_ids: RosterSlot.team_id := counterparty_team_id; slot_type := BENCH; position_label := null"
          - "For each p in receive_player_ids: RosterSlot.team_id := proposing_team_id; slot_type := BENCH; position_label := null"
          - "If send_faab_dollars>0: proposing_team.faab_balance_dollars -= send_faab_dollars; counterparty.faab_balance_dollars += send_faab_dollars"
          - "If receive_faab_dollars>0: mirror in the other direction"
          - "Recompute every still-PENDING WaiverClaim that names any traded player as add_player_id with status=CANCELED, error_id=ERR_PLAYER_NO_LONGER_ELIGIBLE (cascade depth-2)"
      - from: ACCEPTED_PENDING_REVIEW
        to: EXPIRED
        trigger: "POST /leagues/{id}/_clock/advance well past review_deadline_ts with proposer or counterparty rosters no longer satisfying preconditions"
        actor: system
        preconditions:
          - "League.now_ts >= review_deadline_ts"
          - "A precondition (player still on roster, FAAB sufficient) is now false"
        side_effects:
          - "No movement"

  - entity: WaiverClaim
    initial_state: PENDING
    terminal_states: [AWARDED, LOST, CANCELED]
    transitions:
      - from: PENDING
        to: AWARDED
        trigger: "POST /leagues/{id}/_waivers/process"
        actor: system
        preconditions:
          - "League.now_ts >= settle_ts"
          - "Among all PENDING claims for the same add_player_id eligible at this sweep, this claim wins by (bid_dollars desc, priority_seed asc) — see calc faab_waiver_resolution"
          - "Team.faab_balance_dollars >= bid_dollars"
          - "Team.roster_size < League.roster_size OR drop_player_id is non-null"
        side_effects:
          - "Team.faab_balance_dollars -= bid_dollars"
          - "If drop_player_id non-null: delete RosterSlot row (drop_player to free agency)"
          - "Insert RosterSlot row (add_player_id, BENCH)"
          - "Recompute Team.standing_seed: NO-OP (waivers don't change record); BUT every other PENDING WaiverClaim with same add_player_id → status=LOST (cascade depth-2: subsequent /_waivers/process sweeps still consider remaining claims)"
      - from: PENDING
        to: LOST
        trigger: "Set during /_waivers/process when a competitor's claim is AWARDED for the same add_player_id"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: CANCELED
        trigger: "POST /waivers/{id}/cancel OR triggered by trade execution removing target player from free agent pool"
        actor: Manager | system
        preconditions:
          - "Manager case: acting Manager.team_id == WaiverClaim.team_id AND League.now_ts < settle_ts"
        side_effects: []

  - entity: MatchupWeek
    initial_state: SCHEDULED
    terminal_states: [SCORED]
    transitions:
      - from: SCHEDULED
        to: LOCKED
        trigger: "POST /leagues/{id}/_clock/advance reaching the configured weekly lock time of MatchupWeek.week_number"
        actor: system
        preconditions:
          - "League.status in {REGULAR_SEASON, PLAYOFFS}"
          - "MatchupWeek.week_number == League.current_week"
        side_effects:
          - "Snapshot every starter RosterSlot for both teams; set RosterSlot.locked_until_ts := end of week"
          - "For every starter whose Player.status_tag in {OUT}: trigger injury_replacement calculation; if a replacement BENCH player exists, swap (RosterSlot.slot_type from STARTER↔BENCH); if none, the starter scores 0 contribution"
      - from: LOCKED
        to: SCORED
        trigger: "POST /leagues/{id}/matchups/{week}/score (Commissioner inputs per-starter actual_points)"
        actor: Commissioner
        preconditions:
          - "All MatchupWeek rows in week_number are LOCKED"
        side_effects:
          - "Compute home_points and away_points via matchup_scoring calc"
          - "Increment winner.wins, loser.losses, both team.points_for"
          - "If is_playoff and not final round: generate next-round MatchupWeek rows pairing winners by seed"
          - "current_week += 1 once every MatchupWeek of week_number is SCORED"

  - entity: KeeperDesignation
    initial_state: DECLARED
    terminal_states: [CONVERTED, REVOKED]
    transitions:
      - from: DECLARED
        to: LOCKED
        trigger: "League transition DRAFT_PENDING→DRAFTING"
        actor: system
        preconditions: []
        side_effects:
          - "If draft_mode=AUCTION: assigned_price_dollars := keeper_auction_price(player, prior_season); Team.auction_balance_dollars -= assigned_price_dollars (depth-2 cascade originating from start-draft)"
          - "If draft_mode=SNAKE: assigned_round := keeper_snake_round(player, prior_season); insert DraftPick row with round_number=assigned_round, is_keeper=true"
      - from: DECLARED
        to: REVOKED
        trigger: "POST /teams/{id}/keepers/{kid}/revoke"
        actor: Manager
        preconditions:
          - "League.status == DRAFT_PENDING"
          - "Acting Manager.team_id == KeeperDesignation.team_id"
        side_effects: []
      - from: LOCKED
        to: CONVERTED
        trigger: "League transition DRAFTING→REGULAR_SEASON"
        actor: system
        preconditions: []
        side_effects:
          - "Player is recorded as RosterSlot for the keeping team during finish-draft fanout"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two managers race to draft the same player during DRAFTING (snake or auction)"
    guarantee: "At most one DraftPick row may reference any given player within a league; second writer fails"
    error_id: ERR_PLAYER_ALREADY_DRAFTED
    http_status: 409
    serialization: "First-writer-wins on (league_id, player_id) unique constraint"

  - scenario: "Two waiver claims for the same add_player_id submitted simultaneously"
    guarantee: "Both rows persist as PENDING; resolution is deferred to /_waivers/process which applies (bid desc, priority_seed asc); no race exists at submit time"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "No serialization at submit; deterministic tiebreak at sweep"

  - scenario: "Trade execution and a concurrent /_waivers/process both touch the same player"
    guarantee: "First-writer-wins on the RosterSlot row; loser observes that the add_player_id is no longer a free agent and that claim ends in LOST"
    error_id: ERR_PLAYER_NO_LONGER_ELIGIBLE
    http_status: 409
    serialization: "Trade execution and waiver sweep are serialized per (league_id) at the application boundary"

  - scenario: "Manager attempts to set lineup after the weekly lock has fired"
    guarantee: "Once MatchupWeek.status=LOCKED, RosterSlot mutations that change slot_type or position_label are rejected"
    error_id: ERR_LINEUP_LOCKED
    http_status: 409
    serialization: "First-writer-wins; the clock-advance side-effect runs in the same logical request that triggered it"

  - scenario: "Two TradeVotes for the same trade pushing veto_count from below quorum to at-or-above quorum"
    guarantee: "Whichever vote is processed first crosses the threshold and transitions trade to VETOED; the second vote sees state already VETOED and is rejected"
    error_id: ERR_TRADE_NOT_OPEN_FOR_VOTING
    http_status: 409
    serialization: "First-writer-wins on TradeProposal.status update"

  - scenario: "Two clock-advance calls cross the same MatchupWeek lock boundary"
    guarantee: "Lock side-effects run exactly once per (league_id, week_number)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on MatchupWeek.status transition from SCHEDULED to LOCKED"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: faab_waiver_resolution
    trigger: "POST /leagues/{league_id}/_waivers/process"
    algorithm: tiered_pricing
    formula: |
      eligible = [c for c in WaiverClaim
                  if c.league_id == league_id
                  and c.status == 'PENDING'
                  and c.settle_ts <= League.now_ts]
      groups = group_by(eligible, c.add_player_id)
      for player_id, claims in groups.items():
          # Sort: highest bid first; ties broken by lowest priority_seed (worst-record team wins)
          # Final tie-break: oldest WaiverClaim.created_at first
          claims_sorted = sorted(claims, key=lambda c: (-c.bid_dollars, c.priority_seed, c.created_at))
          winner = None
          for c in claims_sorted:
              team = Team[c.team_id]
              if team.faab_balance_dollars < c.bid_dollars: continue   # skip insufficient FAAB
              roster_count = count(RosterSlot[team.id])
              if roster_count >= League.roster_size and c.drop_player_id is None: continue
              winner = c; break
          if winner is None: continue
          # award winner; mark every other PENDING claim for this player LOST
          winner.status = AWARDED
          for other in claims_sorted:
              if other.id != winner.id and other.status == 'PENDING':
                  other.status = LOST
    input_set: "Only WaiverClaim.status=='PENDING' AND settle_ts<=now_ts. PENDING claims with settle_ts in future remain untouched."
    constants: {}
    precision: "FAAB is integer dollars; no rounding."
    variants:
      - name: free_agent_open_bid
        when: "League.waiver_period_hours == 0 (i.e., no waiver wire — players become free agents immediately)"
        difference: "Skip sweep entirely; PENDING claims auto-LOST and free-agent add executed inline at submit time without bid consumption."
      - name: standard_blind_bid
        when: "League.waiver_period_hours > 0"
        difference: "Apply formula above; bids are blind to other bidders until sweep."

  - name: matchup_scoring
    trigger: "POST /leagues/{id}/matchups/{week}/score"
    algorithm: aggregation
    formula: |
      home_points = 0; away_points = 0
      for rs in RosterSlot where team_id == home_team_id and slot_type == STARTER:
          contrib = scored_input[rs.player_id]   # client-provided per-starter
          home_points += apply_scoring_mode(contrib, League.scoring_mode)
      # mirror for away_team_id
      # apply_scoring_mode pseudocode (variant):
      #   STANDARD: contrib (no adjustment)
      #   HALF_PPR: contrib + 0.5 * receptions_credited
      #   PPR:      contrib + 1.0 * receptions_credited
      home_points = round(home_points, 2)   # round at the very end (single rounding pass)
      away_points = round(away_points, 2)
      if home_points > away_points: winner = home_team_id
      elif away_points > home_points: winner = away_team_id
      else: winner = tiebreak_lower_team_id   # see tiebreak rule
    input_set: "RosterSlot rows snapshotted at MatchupWeek.status=LOCKED transition; injury replacement already applied during lock."
    constants:
      RECEPTION_HALF_PPR: 0.5
      RECEPTION_PPR: 1.0
    precision: "Two decimal places, ROUND_HALF_UP; single rounding at the end of summation per team (sum-then-round, NOT round-then-sum). Implementations that round per-starter first are wrong."
    variants:
      - name: standard
        when: "League.scoring_mode == STANDARD"
        difference: "No reception credit added."
      - name: half_ppr
        when: "League.scoring_mode == HALF_PPR"
        difference: "Add 0.5 per reception."
      - name: ppr
        when: "League.scoring_mode == PPR"
        difference: "Add 1.0 per reception."

  - name: standings_ranking
    trigger: "League transition REGULAR_SEASON → PLAYOFFS"
    algorithm: weighted_scoring
    formula: |
      teams_sorted = sorted(Team[league_id],
                            key=lambda t: (-t.wins, -t.points_for, t.created_at))
      for i, t in enumerate(teams_sorted):
          t.standing_seed = i + 1
    input_set: "All Team rows in league. Only MatchupWeek with is_playoff=false and status=SCORED contribute to wins/points_for."
    constants: {}
    precision: "wins is integer; points_for sum already rounded per matchup."
    variants:
      - name: regular_season_only
        when: "always (only one variant)"
        difference: "n/a"

  - name: injury_replacement
    trigger: "MatchupWeek SCHEDULED → LOCKED side-effect"
    algorithm: constraint_propagation
    formula: |
      for rs in RosterSlot where team_id in (home_team_id, away_team_id) and slot_type == STARTER:
          if Player[rs.player_id].status_tag == 'OUT':
              # Find BENCH replacement: same position OR FLEX_RWT compatibility for position_label==FLEX
              candidates = [b for b in RosterSlot
                            where b.team_id == rs.team_id
                            and b.slot_type == 'BENCH'
                            and player_position_compatible(Player[b.player_id], rs.position_label)
                            and Player[b.player_id].status_tag != 'OUT'
                            and Player[b.player_id].status_tag != 'IR_ELIGIBLE']
              if candidates:
                  candidates.sort(key=lambda b: (-Player[b.player_id].weekly_proj_points,
                                                 Player[b.player_id].id))
                  best = candidates[0]
                  swap(rs.slot_type, best.slot_type)  # STARTER ↔ BENCH
                  swap(rs.position_label, best.position_label)
              # if no candidate, rs remains STARTER and contributes 0 to scoring
    input_set: "Starter RosterSlot rows for both teams in the matchup with Player.status_tag==OUT at lock time."
    constants: {}
    precision: "n/a"
    variants:
      - name: same_position_strict
        when: "rs.position_label in {QB1, RB1, RB2, WR1, WR2, WR3, TE1, K1, DST1}"
        difference: "Replacement candidate Player.position must equal rs.position_label root (e.g., RB for RB1/RB2)."
      - name: flex_relaxed
        when: "rs.position_label == FLEX"
        difference: "Replacement candidate Player.position ∈ {RB, WR, TE} regardless of original starter's position."

  - name: keeper_snake_round
    trigger: "Read for KeeperDesignation pre-allocation during DRAFT_PENDING→DRAFTING and at GET on the designation"
    algorithm: tiered_pricing
    formula: |
      # Prior-season DraftPick.round_number for (team_id, player_id), 0 if not drafted last season (free agent keeper)
      prior_round = lookup_prior_season(team_id, player_id) or (League.regular_season_weeks + 5)
      # Keepers cost one round earlier than prior (min round 1)
      assigned_round = max(1, prior_round - 1)
    input_set: "League.season_year - 1 DraftPick records, if any."
    constants: {}
    precision: "Integer rounds."
    variants:
      - name: drafted_last_year
        when: "Prior-season DraftPick exists for (team_id, player_id)"
        difference: "Compute as prior_round - 1."
      - name: undrafted_free_agent
        when: "No prior-season DraftPick"
        difference: "Charge a constant LATE round equal to regular_season_weeks+5 (effectively last round)."

  - name: keeper_auction_price
    trigger: "Read for KeeperDesignation pre-allocation during DRAFT_PENDING→DRAFTING (AUCTION mode)"
    algorithm: tiered_pricing
    formula: |
      prior_price = lookup_prior_auction_price(team_id, player_id) or 1
      assigned_price_dollars = max(1, ceil(prior_price * 1.10))   # 10% inflation, ceiling rounding, integer dollars
    input_set: "Prior-season DraftPick.price_dollars for (team_id, player_id)."
    constants:
      INFLATION_RATE: 1.10
    precision: "Integer dollars via ceiling. Apply ceiling to the multiplied product (multiply-then-ceiling, NOT ceiling-then-multiply)."
    variants:
      - name: drafted_last_year_auction
        when: "Prior-season DraftPick exists with price_dollars>0"
        difference: "Compute via inflation formula."
      - name: undrafted_or_zero_price
        when: "No prior price OR prior price == 0"
        difference: "Floor of 1 dollar."

  - name: trade_veto_threshold
    trigger: "Insert into TradeVote OR clock-advance scanning ACCEPTED_PENDING_REVIEW trades"
    algorithm: threshold
    formula: |
      eligible_voters = League.team_count - 2   # exclude proposer and counterparty
      veto_count = count(TradeVote where trade_proposal_id == tp.id and vote == 'VETO')
      veto_pct = (veto_count * 100) // eligible_voters    # integer division; rounding-toward-zero
      veto_crossed = veto_pct >= League.veto_quorum_pct
    input_set: "TradeVote rows for this trade_proposal_id."
    constants: {}
    precision: "Integer percent via floor division (truncation). Boundary: equal to quorum threshold counts as VETOED; strictly less does not."
    variants:
      - name: standard_threshold
        when: "always"
        difference: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Commissioner, Manager}"
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "X-User-Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path-referenced League/Team/Player/Trade/Waiver/Matchup/Keeper exists (validated left-to-right in URL)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Body-referenced foreign keys (e.g., add_player_id, send_player_ids, voting_team_id) refer to existing rows"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST/PUT/PATCH all"

  - priority: 6
    category: state
    check: "Acting Manager owns the team referenced in the URL/body (Manager.team_id == referenced team_id) for ownership-gated actions"
    error_id: ERR_NOT_TEAM_OWNER
    http_status: 403
    applies_to: "POST /teams/{id}/*, POST /waivers, POST /trades, POST /trades/{id}/accept|reject|cancel"

  - priority: 7
    category: state
    check: "Target League/Trade/Waiver/Matchup is in a state that permits this transition (state-machine precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "Lineup mutations rejected once the MatchupWeek for the current week is LOCKED"
    error_id: ERR_LINEUP_LOCKED
    http_status: 409
    applies_to: "PATCH /teams/{id}/roster-slots/{rid}"

  - priority: 9
    category: business_safety
    check: "Player is not already on another team in the same league (RosterSlot uniqueness on (league_id, player_id))"
    error_id: ERR_PLAYER_ALREADY_ROSTERED
    http_status: 409
    applies_to: "POST /leagues/{id}/draft-picks, POST /waivers, trade execution"

  - priority: 10
    category: business_safety
    check: "IR slot can only hold a Player.status_tag in {OUT, IR_ELIGIBLE}; healthy players cannot be placed on IR"
    error_id: ERR_IR_INELIGIBLE
    http_status: 422
    applies_to: "PATCH /teams/{id}/roster-slots/{rid} when target slot_type=IR"

  - priority: 11
    category: business_safety
    check: "Trade votes may only be cast by teams in the league other than proposing_team_id and counterparty_team_id; one vote per voting_team_id per trade"
    error_id: ERR_NOT_ELIGIBLE_VOTER
    http_status: 403
    applies_to: "POST /trades/{id}/votes"

  - priority: 12
    category: business_referential
    check: "send_player_ids all currently rostered to proposing_team_id; receive_player_ids all currently rostered to counterparty_team_id"
    error_id: ERR_PLAYER_NOT_ON_ROSTER
    http_status: 422
    applies_to: "POST /trades, POST /trades/{id}/accept (re-check at accept time)"

  - priority: 13
    category: business_constraint
    check: "TradeProposal allows at most one direction of FAAB transfer (send_faab_dollars==0 OR receive_faab_dollars==0)"
    error_id: ERR_TWO_WAY_FAAB_FORBIDDEN
    http_status: 422
    applies_to: "POST /trades"

  - priority: 14
    category: business_constraint
    check: "Starter slot count per team must equal League.starter_count after any roster mutation; bench overflow allowed up to (roster_size - starter_count - ir_slots)"
    error_id: ERR_ROSTER_SHAPE_INVALID
    http_status: 422
    applies_to: "PATCH /teams/{id}/roster-slots/{rid}"

  - priority: 15
    category: business_constraint
    check: "Roster size constraint: count of RosterSlot for team_id ≤ League.roster_size; IR-slotted rows count toward the cap"
    error_id: ERR_ROSTER_FULL
    http_status: 422
    applies_to: "POST /waivers (when no drop), trade execution"

  - priority: 16
    category: business_constraint
    check: "Per-position starter limits (e.g., exactly one QB, two RB, three WR, one TE, one FLEX, one K, one DST in default 10-starter setup; FLEX accepts RB/WR/TE)"
    error_id: ERR_POSITION_CONSTRAINT
    http_status: 422
    applies_to: "PATCH /teams/{id}/roster-slots/{rid}"

  - priority: 17
    category: business_temporal
    check: "WaiverClaim.settle_ts >= League.now_ts at submission (cannot back-date)"
    error_id: ERR_WAIVER_SETTLE_IN_PAST
    http_status: 422
    applies_to: "POST /leagues/{id}/waivers"

  - priority: 18
    category: business_temporal
    check: "Player added in claim is currently in 'waivers period' (status_tag==OUT OR was dropped within last waiver_period_hours) — cannot bid on a fully-free-agent player; use free-agent add endpoint instead"
    error_id: ERR_PLAYER_NOT_IN_WAIVERS
    http_status: 422
    applies_to: "POST /leagues/{id}/waivers (when League.waiver_period_hours > 0)"

  - priority: 19
    category: business_fiscal
    check: "WaiverClaim.bid_dollars <= Team.faab_balance_dollars at submission"
    error_id: ERR_FAAB_INSUFFICIENT
    http_status: 422
    applies_to: "POST /leagues/{id}/waivers"

  - priority: 20
    category: business_fiscal
    check: "Auction DraftPick.price_dollars <= Team.auction_balance_dollars - (remaining_required_picks - 1) * 1 (must always leave $1 per remaining slot)"
    error_id: ERR_AUCTION_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /leagues/{id}/draft-picks (AUCTION mode)"

  - priority: 21
    category: business_constraint
    check: "KeeperDesignation count per team_id ≤ League.keeper_cap"
    error_id: ERR_KEEPER_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /teams/{id}/keepers"

  - priority: 22
    category: business_constraint
    check: "Snake draft pick order is enforced: only the team whose draft turn it is may create a DraftPick; AUCTION mode skips this check"
    error_id: ERR_NOT_YOUR_TURN
    http_status: 409
    applies_to: "POST /leagues/{id}/draft-picks (SNAKE mode)"

  - priority: 23
    category: business_constraint
    check: "Player position eligibility: DraftPick/roster placement must match Player.position (FLEX_RWT covers RB/WR/TE)"
    error_id: ERR_POSITION_INELIGIBLE
    http_status: 422
    applies_to: "POST /leagues/{id}/draft-picks, PATCH /teams/{id}/roster-slots/{rid}"

  - priority: 24
    category: business_constraint
    check: "Field type and range validation per entity field constraints"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

  - priority: 25
    category: business_constraint
    check: "Pagination params within bounds; version on mutation matches current"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH/PUT all (version mismatch); 400 ERR_VALIDATION otherwise"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- League ----------
  - method: POST
    path: "/leagues"
    description: "Create a new league in DRAFT_PENDING."
    roles: [Commissioner]
    code: 201
    input: [name, season_year, draft_mode, scoring_mode, team_count, roster_size, starter_count, ir_slots, faab_budget_dollars, "auction_budget_dollars?", keeper_mode, "keeper_cap?", "veto_quorum_pct?", "trade_review_hours?", "waiver_period_hours?", playoff_team_count, regular_season_weeks]
    output: League
    side_effects: [creates League row with status=DRAFT_PENDING, current_week=0, now_ts=created_at]

  - method: GET
    path: "/leagues/{league_id}"
    description: "Fetch a league."
    roles: [Commissioner, Manager]
    code: 200
    input: []
    output: League
    side_effects: []

  - method: POST
    path: "/leagues/{league_id}/start-draft"
    description: "Transition DRAFT_PENDING → DRAFTING."
    roles: [Commissioner]
    code: 200
    input: []
    output: League
    side_effects: [state machine League.start-draft]

  - method: POST
    path: "/leagues/{league_id}/finish-draft"
    description: "Transition DRAFTING → REGULAR_SEASON."
    roles: [Commissioner]
    code: 200
    input: []
    output: League
    side_effects: [state machine League.finish-draft]

  - method: POST
    path: "/leagues/{league_id}/archive"
    description: "Transition COMPLETED → ARCHIVED."
    roles: [Commissioner]
    code: 200
    input: []
    output: League
    side_effects: [state machine League.archive]

  - method: POST
    path: "/leagues/{league_id}/_clock/advance"
    description: "Advance League.now_ts to the given ISO8601 timestamp. Test-driving endpoint. Runs all eligible time-gated transitions in order: weekly lock, waiver sweep, trade expiry/execution."
    roles: [Commissioner]
    code: 200
    input: [target_ts]
    output: League
    side_effects: [MatchupWeek lock cascades, Trade EXECUTED/EXPIRED cascades, WaiverClaim sweep enqueued]

  - method: POST
    path: "/leagues/{league_id}/_waivers/process"
    description: "Run waiver settlement now (test-driving endpoint; also auto-runs on clock advance crossing any settle_ts)."
    roles: [Commissioner]
    code: 200
    input: []
    output: WaiverClaim[]
    side_effects: [Apply faab_waiver_resolution; AWARDED/LOST writes; RosterSlot inserts/deletes]

  # ---------- Team ----------
  - method: POST
    path: "/leagues/{league_id}/teams"
    description: "Create a team in DRAFT_PENDING."
    roles: [Commissioner]
    code: 201
    input: [name, manager_user_id]
    output: Team
    side_effects: [Team.faab_balance_dollars := League.faab_budget_dollars]

  - method: GET
    path: "/leagues/{league_id}/teams"
    description: "List teams in league."
    roles: [Commissioner, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: Team[]
    side_effects: []

  - method: GET
    path: "/leagues/{league_id}/teams/{team_id}"
    description: "Fetch a team."
    roles: [Commissioner, Manager]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: PATCH
    path: "/teams/{team_id}/roster-slots/{slot_id}"
    description: "Move a Player between STARTER/BENCH/IR or change position_label."
    roles: [Manager]
    code: 200
    input: ["slot_type?", "position_label?", version]
    output: RosterSlot
    side_effects: [validations 8/10/14/16]

  # ---------- Player ----------
  - method: POST
    path: "/players"
    description: "Register a player in the catalog (Commissioner seeds the player pool)."
    roles: [Commissioner]
    code: 201
    input: [full_name, nfl_team, position, "weekly_proj_points?"]
    output: Player
    side_effects: []

  - method: GET
    path: "/players"
    description: "List players with optional position/status filter."
    roles: [Commissioner, Manager]
    code: 200
    input: ["position?", "status_tag?", "limit?", "offset?"]
    output: Player[]
    side_effects: []

  - method: POST
    path: "/players/{player_id}/status"
    description: "Update Player.status_tag (test-driving for injury_replacement)."
    roles: [Commissioner]
    code: 200
    input: [status_tag, "weekly_proj_points?"]
    output: Player
    side_effects: [No immediate roster effects; lock-time injury_replacement reads this]

  # ---------- Draft ----------
  - method: POST
    path: "/leagues/{league_id}/draft-picks"
    description: "Record a draft pick (SNAKE: next-up team only; AUCTION: any team within budget)."
    roles: [Manager]
    code: 201
    input: [team_id, player_id, "price_dollars?"]
    output: DraftPick
    side_effects: [Decrement auction_balance_dollars (AUCTION); enforce unique (league_id, player_id)]

  - method: GET
    path: "/leagues/{league_id}/draft-picks"
    description: "List picks in order."
    roles: [Commissioner, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: DraftPick[]
    side_effects: []

  # ---------- Keepers ----------
  - method: POST
    path: "/teams/{team_id}/keepers"
    description: "Declare a keeper while League.status=DRAFT_PENDING."
    roles: [Manager]
    code: 201
    input: [player_id, season_year]
    output: KeeperDesignation
    side_effects: [Computes assigned_round / assigned_price_dollars eagerly via keeper_snake_round / keeper_auction_price]

  - method: GET
    path: "/teams/{team_id}/keepers"
    description: "List a team's declared/locked keepers."
    roles: [Commissioner, Manager]
    code: 200
    input: []
    output: KeeperDesignation[]
    side_effects: []

  - method: POST
    path: "/teams/{team_id}/keepers/{keeper_id}/revoke"
    description: "Revoke a DECLARED keeper before draft starts."
    roles: [Manager]
    code: 200
    input: []
    output: KeeperDesignation
    side_effects: [state machine KeeperDesignation.revoke]

  # ---------- Waivers ----------
  - method: POST
    path: "/leagues/{league_id}/waivers"
    description: "Submit a FAAB waiver claim."
    roles: [Manager]
    code: 201
    input: [team_id, add_player_id, "drop_player_id?", bid_dollars, settle_ts]
    output: WaiverClaim
    side_effects: [priority_seed snapshot from inverse-standings; no balance debit until award]

  - method: GET
    path: "/leagues/{league_id}/waivers"
    description: "List claims with filters."
    roles: [Commissioner, Manager]
    code: 200
    input: ["team_id?", "status?", "limit?", "offset?"]
    output: WaiverClaim[]
    side_effects: []

  - method: POST
    path: "/waivers/{waiver_id}/cancel"
    description: "Manager cancels their own PENDING claim before settle_ts."
    roles: [Manager]
    code: 200
    input: []
    output: WaiverClaim
    side_effects: [state machine WaiverClaim.cancel]

  # ---------- Trades ----------
  - method: POST
    path: "/leagues/{league_id}/trades"
    description: "Propose a trade."
    roles: [Manager]
    code: 201
    input: [proposing_team_id, counterparty_team_id, send_player_ids, receive_player_ids, "send_faab_dollars?", "receive_faab_dollars?"]
    output: TradeProposal
    side_effects: [status=OFFERED]

  - method: GET
    path: "/leagues/{league_id}/trades"
    description: "List trades with filter."
    roles: [Commissioner, Manager]
    code: 200
    input: ["status?", "team_id?", "limit?", "offset?"]
    output: TradeProposal[]
    side_effects: []

  - method: POST
    path: "/trades/{trade_id}/accept"
    description: "Counterparty accepts → ACCEPTED_PENDING_REVIEW."
    roles: [Manager]
    code: 200
    input: []
    output: TradeProposal
    side_effects: [review_deadline_ts := now_ts + trade_review_hours]

  - method: POST
    path: "/trades/{trade_id}/reject"
    description: "Counterparty rejects → REJECTED."
    roles: [Manager]
    code: 200
    input: []
    output: TradeProposal
    side_effects: []

  - method: POST
    path: "/trades/{trade_id}/cancel"
    description: "Proposer cancels their own OFFERED trade."
    roles: [Manager]
    code: 200
    input: []
    output: TradeProposal
    side_effects: []

  - method: POST
    path: "/trades/{trade_id}/votes"
    description: "Cast a veto or approve vote during the review window."
    roles: [Manager]
    code: 201
    input: [voting_team_id, vote]
    output: TradeVote
    side_effects: [Recompute trade_veto_threshold; if crossed transition trade → VETOED]

  # ---------- Matchups & Playoffs ----------
  - method: GET
    path: "/leagues/{league_id}/matchups"
    description: "List matchups (regular + playoff)."
    roles: [Commissioner, Manager]
    code: 200
    input: ["week_number?", "is_playoff?", "limit?", "offset?"]
    output: MatchupWeek[]
    side_effects: []

  - method: POST
    path: "/leagues/{league_id}/matchups/{week_number}/score"
    description: "Commissioner submits per-starter actual_points to settle a LOCKED week."
    roles: [Commissioner]
    code: 200
    input: [scores]   # scores: [{player_id, actual_points, receptions_credited?}, ...]
    output: MatchupWeek[]
    side_effects: [matchup_scoring; team wins/losses/points_for update; next-round bracket generation if playoff]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing"
  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not Commissioner or Manager"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint"
  - id: ERR_NOT_TEAM_OWNER
    http: 403
    condition: "Acting Manager is not the manager_user_id of the referenced team"
  - id: ERR_NOT_ELIGIBLE_VOTER
    http: 403
    condition: "Voter is proposer/counterparty or has already voted on this trade"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "Body-referenced foreign key does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "State precondition violated"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency version mismatch on mutation"
  - id: ERR_PLAYER_ALREADY_DRAFTED
    http: 409
    condition: "DraftPick already exists for (league_id, player_id)"
  - id: ERR_PLAYER_ALREADY_ROSTERED
    http: 409
    condition: "Player already on a RosterSlot in this league"
  - id: ERR_PLAYER_NOT_ON_ROSTER
    http: 422
    condition: "Trade sends a player not currently on the proposer's roster (or counterparty's for receive side)"
  - id: ERR_PLAYER_NO_LONGER_ELIGIBLE
    http: 409
    condition: "Pending waiver claim's add_player_id has been transferred (trade execution) before settle"
  - id: ERR_PLAYER_NOT_IN_WAIVERS
    http: 422
    condition: "Add-player target is not currently in waivers period"
  - id: ERR_LINEUP_LOCKED
    http: 409
    condition: "Lineup mutation attempted after MatchupWeek locked"
  - id: ERR_IR_INELIGIBLE
    http: 422
    condition: "IR slot assigned to a Player whose status_tag is ACTIVE or QUESTIONABLE"
  - id: ERR_ROSTER_SHAPE_INVALID
    http: 422
    condition: "Starter count mismatch or bench overflow after lineup mutation"
  - id: ERR_ROSTER_FULL
    http: 422
    condition: "Roster size cap would be exceeded"
  - id: ERR_POSITION_CONSTRAINT
    http: 422
    condition: "Starter slot count per position violated"
  - id: ERR_POSITION_INELIGIBLE
    http: 422
    condition: "Player.position incompatible with slot position_label"
  - id: ERR_FAAB_INSUFFICIENT
    http: 422
    condition: "WaiverClaim.bid_dollars > Team.faab_balance_dollars at submit"
  - id: ERR_AUCTION_BUDGET_EXCEEDED
    http: 422
    condition: "AUCTION pick would leave fewer dollars than required remaining $1-per-slot floor"
  - id: ERR_WAIVER_SETTLE_IN_PAST
    http: 422
    condition: "settle_ts <= League.now_ts at submission"
  - id: ERR_KEEPER_CAP_EXCEEDED
    http: 422
    condition: "Team's KeeperDesignation count would exceed League.keeper_cap"
  - id: ERR_NOT_YOUR_TURN
    http: 409
    condition: "SNAKE draft: not the next-up team's pick"
  - id: ERR_TWO_WAY_FAAB_FORBIDDEN
    http: 422
    condition: "Trade specifies both send_faab_dollars and receive_faab_dollars as non-zero"
  - id: ERR_TRADE_NOT_OPEN_FOR_VOTING
    http: 409
    condition: "Vote cast on trade not in ACCEPTED_PENDING_REVIEW (or already VETOED, EXECUTED, etc.)"
  - id: ERR_VALIDATION
    http: 422
    condition: "Field type, range, or format invalid"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Commissioner
    description: "League operator with privileged actions: league CRUD, clock advance, manual waiver sweep, scoring submission, player catalog admin."
    identity: "opaque"
    exclusive_operations:
      - "POST /leagues"
      - "POST /leagues/{id}/start-draft"
      - "POST /leagues/{id}/finish-draft"
      - "POST /leagues/{id}/archive"
      - "POST /leagues/{id}/_clock/advance"
      - "POST /leagues/{id}/_waivers/process"
      - "POST /leagues/{id}/teams"
      - "POST /players"
      - "POST /players/{id}/status"
      - "POST /leagues/{id}/matchups/{week_number}/score"
    shared_operations:
      - "GET /leagues/{id}"
      - "GET /leagues/{id}/teams"
      - "GET /leagues/{id}/teams/{id}"
      - "GET /players"
      - "GET /leagues/{id}/matchups"
      - "GET /leagues/{id}/draft-picks"
      - "GET /leagues/{id}/waivers"
      - "GET /leagues/{id}/trades"

  - name: Manager
    description: "Per-team franchise manager; can act only on resources tied to their team_id."
    identity: "entity_backed:Team"
    exclusive_operations:
      - "POST /leagues/{id}/draft-picks"
      - "POST /leagues/{id}/waivers"
      - "POST /waivers/{id}/cancel"
      - "POST /leagues/{id}/trades"
      - "POST /trades/{id}/accept"
      - "POST /trades/{id}/reject"
      - "POST /trades/{id}/cancel"
      - "POST /trades/{id}/votes"
      - "POST /teams/{id}/keepers"
      - "POST /teams/{id}/keepers/{kid}/revoke"
      - "PATCH /teams/{team_id}/roster-slots/{slot_id}"
    shared_operations:
      - "GET /leagues/{id}"
      - "GET /leagues/{id}/teams"
      - "GET /leagues/{id}/teams/{id}"
      - "GET /players"
      - "GET /leagues/{id}/matchups"
      - "GET /leagues/{id}/draft-picks"
      - "GET /leagues/{id}/waivers"
      - "GET /leagues/{id}/trades"
      - "GET /teams/{id}/keepers"
