              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
              payload: { location_id: "${loc_id}", scheduled_at: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
              captures: { delv_id: "$.data.id" }
            - call: "POST /deliveries/${delv_id}/dispatch"
              payload: {}
              as: PlatformAdmin
              captures: { prov: "$.data.provisional_cents" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_status_paused: "$.data.status" }
            - call: "GET /clients/${client_id}"
              payload: {}
              as: PlatformAdmin
              captures: { credit_after: "$.data.credit_balance_cents" }
            - call: "GET /deliveries/${delv_id}"
              payload: {}
              as: PlatformAdmin
              captures: { delv_status_after: "$.data.status", delv_credit: "$.data.dispute_credit_cents" }
            - call: "GET /rotation-cycles/${rc0_id}"
              payload: {}
              as: PlatformAdmin
              captures: { rc_status_after: "$.data.status" }
          assert:
            - "sub_status_paused == 'PAUSED'"
            - "rc_status_after == 'INVALIDATED'"
            - "delv_status_after == 'CANCELLED'"
            # Delivery.provisional_cents = 10*100=1000, fee=0(PANTRY), disc=0(10<100).
            - "delv_credit == 1000"
            - "credit_after == 1000"

      - name: delivery_resolve_dispute_depth2_credit
        grounds:
          - state_machines.Delivery.DISPUTED_to_FINALIZED
