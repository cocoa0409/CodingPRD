      - name: occ_stale_package_version_conflict
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[package-create-stale-project]"
          - "validations[priority=4]"
          - "errors[ERR_STALE_PACKAGE_VERSION]"
        distinguishing_aspect: "Creating package A succeeds against observed version 1 (project advances to 2); a second create still carrying expected_project_version 1 is rejected 412 ERR_STALE_PACKAGE_VERSION — two strictly sequential requests, deterministic."
        test_recipe:
          setup: ["project BUYOUT_OPEN; version observed at open == 2; package A created (version -> 3)"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-V4", project_number: "V4", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
