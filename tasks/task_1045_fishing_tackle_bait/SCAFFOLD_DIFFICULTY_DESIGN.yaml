  # =================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: charter_seats_request_equals_remaining_ok_over_by_one_fails
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_INSUFFICIENT_SEATS]"
          - "entities.Charter.fields.booked_seats"
        distinguishing_aspect: "Numeric seat boundary via POST /api/charter-bookings: seats == remaining (3 == 3) is accepted and fills the charter to FULL; the very next single seat (1 > 0 remaining) is rejected ERR_INSUFFICIENT_SEATS."
        test_recipe:
          setup:
            - "Clock 2026-07-15. Charter C capacity 3 start 2026-08-15. Customers A and B both hold ACTIVE licenses."
