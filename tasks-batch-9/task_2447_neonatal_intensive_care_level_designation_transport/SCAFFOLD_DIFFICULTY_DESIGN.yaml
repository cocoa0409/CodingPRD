            - "FollowUpEnrollment.${enr_q1}.status == ENROLLED with eligibility_basis == BW_UNDER_1500"
            - "The identical payload failed and then succeeded with no change other than the admission's care_status"

      - name: milk_administration_depends_on_infection_dimension
        grounds:
