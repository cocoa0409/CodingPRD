    path: "/shipments"
    description: "Open a shipment in DRAFT for an account"
    roles: [SalesRep, PlatformAdmin]
    code: 201
    input: [account_id]
    output: Shipment
    side_effects: ["status = DRAFT; created_by_user_id = acting X-User-ID"]

  - method: POST
    path: "/shipments/{id}/lines"
    description: "Add a line and reserve the units on the lot; OCC-guarded on the lot"
    roles: [SalesRep, PlatformAdmin]
    code: 201
    input: [finished_lot_id, units, unit_price, expected_finished_lot_version]
    output: ShipmentLine
    side_effects:
      - "line_status = ACTIVE; extended_price and line_liters computed by calculations.shipment_line_totals"
      - "lot.reserved_units increased by units"
      - "increments FinishedLot.version by 1 and Shipment.version by 1"

  - method: POST
    path: "/shipments/{id}/confirm"
    description: "Confirm a DRAFT shipment against the compliance, ceiling and credit gates"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status = CONFIRMED; confirmed_at set; subtotal, total_units and total_liters recomputed", "increments Shipment.version by 1"]

  - method: POST
    path: "/shipments/{id}/deliver"
    description: "Record delivery; reservations become shipped units and the invoice clock starts"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "status = DELIVERED; delivered_on_date and due_date set"
      - "for each ACTIVE line, lot.reserved_units and lot.on_hand_units decreased and lot.shipped_units increased by units"
      - "account.outstanding_balance increased by subtotal; ytd_self_dist_liters updated for a SELF_DISTRIBUTION account"
