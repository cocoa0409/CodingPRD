            - "the DESSERT row and the CELEBRATION row carry independent statuses — DESSERT FINISHED does not imply CELEBRATION FINISHED"
            - "Reservation.${res_d}.status is still SEATED: a parallel dimension reaching a terminal phase does not close the booking on its own"

      - name: sushi_prep_phase_cyclic_restart_from_plated
        grounds:
