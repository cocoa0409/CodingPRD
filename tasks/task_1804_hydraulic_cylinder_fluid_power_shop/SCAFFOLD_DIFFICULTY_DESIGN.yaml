          - state_machines.FieldServiceJob.REQUESTED_to_SCHEDULED
        distinguishing_aspect: |
          Technician interval semantics are half-open with NO buffer: a job
          starting exactly at the previous job's end (12:00 after [10:00,12:00])
          is accepted, while one minute of true overlap is rejected — the opposite
          adjacency rule from the test bay, on a different resource.
        test_recipe:
