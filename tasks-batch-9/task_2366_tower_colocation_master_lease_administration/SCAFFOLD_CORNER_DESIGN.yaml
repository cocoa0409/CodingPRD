      - name: renewal_outside_365_day_window_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_24
          - calculations.ground_lease_current_rent.constants.RENEWAL_WINDOW_DAYS
          - errors.ERR_RENEWAL_WINDOW_CLOSED
        distinguishing_aspect: |
          The renewal window opens exactly RENEWAL_WINDOW_DAYS (365) before term_end_date: at the
          2026-08-01 clock, open-renewal on a lease ending 2031-05-31 returns 422, and it succeeds
          the moment the clock reaches 2030-05-31 — the window boundary day itself is inside.
        test_recipe:
          setup:
            - "Tower RWN has an ACTIVE ground lease ending 2031-05-31 with 1 renewal option of 5 years; the clock starts at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Renewal Window Notch", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { rw_t_id: $.data.id }
            - call: "POST /tower-colo/landlords"
              payload: { legal_name: "Renewal Notch Land", remit_contact_email: "ap@renewalnotch.example", w9_on_file: true }
              as: PortfolioAdmin
              captures: { rw_ll_id: $.data.id }
            - call: "POST /tower-colo/ground-leases"
              payload: { tower_id: "${rw_t_id}", landlord_id: "${rw_ll_id}", base_monthly_rent_cents: 300000, escalator_pct: 2.0, commencement_date: "2020-06-01", term_end_date: "2031-05-31", renewal_option_count: 1, renewal_term_years: 5, buyout_price_cents: 9000000 }
              as: PortfolioAdmin
              captures: { rw_gl_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/ground-leases/${rw_gl_id}/open-renewal"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/_clock/set_current_utc"
              payload: { to_iso8601: "2030-05-31T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /tower-colo/ground-leases/${rw_gl_id}/open-renewal"
              payload: {}
              as: PortfolioAdmin
          assert:
            - "trigger call 1 returns 422 with error_id == ERR_RENEWAL_WINDOW_CLOSED"
            - "trigger call 2 returns 200 with expired_ground_lease_count == 0"
            - "trigger call 3 returns 200 with status == RENEWAL_NEGOTIATION"
            - "GroundLease.${rw_gl_id}.renewals_exercised == 0"
            - "GroundLease.${rw_gl_id}.term_end_date == 2031-05-31"

      - name: renewal_without_remaining_options_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_25
          - errors.ERR_NO_RENEWAL_OPTIONS_REMAINING
        distinguishing_aspect: |
          After the single option is exercised (term_end_date 2031-05-31 becomes 2036-05-31 and
          renewals_exercised becomes 1) a second open-renewal made inside the new window
          (clock 2035-06-01) returns 422 ERR_NO_RENEWAL_OPTIONS_REMAINING — the count, not the
          window, is now the binding constraint.
        test_recipe:
          setup:
            - "Tower RXH has an ACTIVE ground lease ending 2031-05-31 with renewal_option_count 1 and renewal_term_years 5."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Renewal Exhausted Hill", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { rx_t_id: $.data.id }
            - call: "POST /tower-colo/landlords"
              payload: { legal_name: "Exhausted Hill Land", remit_contact_email: "ap@exhaustedhill.example", w9_on_file: true }
              as: PortfolioAdmin
              captures: { rx_ll_id: $.data.id }
            - call: "POST /tower-colo/ground-leases"
              payload: { tower_id: "${rx_t_id}", landlord_id: "${rx_ll_id}", base_monthly_rent_cents: 300000, escalator_pct: 2.0, commencement_date: "2020-06-01", term_end_date: "2031-05-31", renewal_option_count: 1, renewal_term_years: 5, buyout_price_cents: 9000000 }
              as: PortfolioAdmin
              captures: { rx_gl_id: $.data.id }
            - call: "POST /tower-colo/_clock/set_current_utc"
              payload: { to_iso8601: "2030-06-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /tower-colo/ground-leases/${rx_gl_id}/open-renewal"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/ground-leases/${rx_gl_id}/renew"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/_clock/set_current_utc"
              payload: { to_iso8601: "2035-06-01T00:00:00Z" }
              as: PortfolioAdmin
          trigger:
            - call: "POST /tower-colo/ground-leases/${rx_gl_id}/open-renewal"
              payload: {}
              as: PortfolioAdmin
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_NO_RENEWAL_OPTIONS_REMAINING"
            - "GroundLease.${rx_gl_id}.status == ACTIVE"
            - "GroundLease.${rx_gl_id}.renewals_exercised == 1"
            - "GroundLease.${rx_gl_id}.term_end_date == 2036-05-31"

      - name: audit_dated_after_the_clock_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_29
          - errors.ERR_AUDIT_DATE_IN_FUTURE
        distinguishing_aspect: |
          An audit may be dated today but not tomorrow: audit_date 2026-08-02 against the
          2026-08-01 clock returns 422, while audit_date exactly 2026-08-01 is accepted and lands in
          SCHEDULED — the comparison is inclusive on the clock instant's date.
        test_recipe:
          setup:
            - "Tower AUD exists; the logical clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Audit Date Draw", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { ad_t_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/equipment-audits"
              payload: { tower_id: "${ad_t_id}", audit_date: "2026-08-02", basis: "INSTALL_DATE_BASIS" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "POST /tower-colo/equipment-audits"
              payload: { tower_id: "${ad_t_id}", audit_date: "2026-08-01", basis: "INSTALL_DATE_BASIS" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
          assert:
            - "trigger call 1 returns 422 with error_id == ERR_AUDIT_DATE_IN_FUTURE"
            - "trigger call 2 returns 201 with status == SCHEDULED and audit_date == 2026-08-01"
            - "GET /tower-colo/towers/${ad_t_id}/equipment-audits as ComplianceAuditor returns total_count == 1"

      - name: finding_installed_after_audit_date_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_30
          - errors.ERR_FINDING_DATE_AFTER_AUDIT
        distinguishing_aspect: |
          A finding cannot predate its own discovery in reverse: installed_on_date 2026-07-02 on an
