# ===========================================================================
# §1.9 Scaffold Corner Design — Breadth Coverage Index
# Task 2981 — Building Trades Hiring Hall Dispatch
#
# One walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7 surface. `section:` values are the guide's nine sections and
# `claim_type:` values are its per-section table rows — nothing invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs naming the covering §1.8 instance.
#
# Every setup chain below is reachable from an empty database using only
# endpoints declared in §1.5, and every asserted number is a literal computed
# from §1.3's formulas and constants.
# ===========================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: local_creation_echoes_inputs_and_adds_common_fields
        claim_type: creation
        grounds:
          - entities.Local
          - endpoints["POST /hiring-hall/locals"]
          - response_envelope.success
        distinguishing_aspect: "A Local created with every declared input returns 201 with all four business fields echoed verbatim plus the four common fields (id, created_at, updated_at, version) that §1.1's common_fields: true adds; version starts at 1."
        test_recipe:
          setup:
            - "Empty database; logical clock parked at the mandated default 2026-08-01T00:00:00.000Z is first moved to 2026-09-01T00:00:00.000Z so created_at is a known literal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
          trigger:
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 46, name: "Local 46 (sister)", kind: "SISTER", reciprocity_factor_bp: 5000 }
              as: HallAdmin
              captures: { local_id: $.data.id, num: $.data.local_number, nm: $.data.name, kind: $.data.kind, bp: $.data.reciprocity_factor_bp, created: $.data.created_at, updated: $.data.updated_at, ver: $.data.version }
          assert:
            - "HTTP 201 and the body is the §1.0 success envelope with response_type == object"
            - "${num} == 46, ${nm} == Local 46 (sister), ${kind} == SISTER, ${bp} == 5000 — every input echoed"
            - "${local_id} is a non-empty string, ${created} == ${updated} == 2026-09-01T00:00:00.000Z and ${ver} == 1"
      - name: member_retrieval_returns_stored_and_computed_fields
        claim_type: retrieval
        grounds:
          - entities.Member
          - endpoints["GET /hiring-hall/members/{id}"]
        distinguishing_aspect: "GET /members/{id} returns the stored inputs unchanged AND the four computed fields (is_traveler false for a HOME local, re_registration_eligible_at null, refusal_strike_count 0, dispatch_eligible true) on a member who has never been dispatched."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; one HOME local; one journeyworker with 6200 local hours and no registration, referral or dispatch history."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Nia Okoye", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 6200 }
              as: HallAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /hiring-hall/members/${m_id}"
              payload: {}
              as: HallAdmin
              captures: { nm: $.data.full_name, home: $.data.home_local_id, cls: $.data.classification, ap: $.data.apprentice_period, hrs: $.data.local_hours_in_trade, standing: $.data.standing, trav: $.data.is_traveler, cool: $.data.re_registration_eligible_at, strikes: $.data.refusal_strike_count, elig: $.data.dispatch_eligible }
          assert:
            - "${nm} == Nia Okoye, ${home} == ${home_local_id}, ${cls} == JOURNEYWORKER, ${hrs} == 6200"
            - "${ap} == null and ${standing} == GOOD_STANDING — the omitted optional input took its declared default"
            - "${trav} == false because the home Local.kind == HOME, ${cool} == null, ${strikes} == 0 and ${elig} == true"
      - name: out_of_work_list_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /hiring-hall/out-of-work-lists"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three lists on file, limit 2 / offset 0 returns exactly 2 rows with total_count 3 and has_more true, and limit 2 / offset 2 returns 1 row with has_more false — the pagination fields are computed over the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; exactly three out-of-work lists: GROUP_1, GROUP_2 and GROUP_4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_1", priority_rank: 1, ordering_policy: "SENIORITY", requires_local_hours: 4000, accepts_travelers: false }
              as: HallAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_2", priority_rank: 2, ordering_policy: "SENIORITY", requires_local_hours: 2000, accepts_travelers: false }
              as: HallAdmin
              captures: { g2_id: $.data.id }
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_4", priority_rank: 4, ordering_policy: "SENIORITY", requires_local_hours: 0, accepts_travelers: true }
              as: HallAdmin
              captures: { g4_id: $.data.id }
          trigger:
            - call: "GET /hiring-hall/out-of-work-lists"
              payload: { limit: 2, offset: 0 }
              as: Dispatcher
              captures: { first_group: "$.data[0].group_code", page1_total: $.meta.total_count, page1_more: $.meta.has_more }
            - call: "GET /hiring-hall/out-of-work-lists"
              payload: { limit: 2, offset: 2 }
              as: Dispatcher
              captures: { page2_first: "$.data[0].group_code", page2_total: $.meta.total_count, page2_more: $.meta.has_more }
            - call: "GET /hiring-hall/out-of-work-lists"
              payload: { accepts_travelers: true }
              as: Dispatcher
              captures: { filtered_group: "$.data[0].group_code", filtered_total: $.meta.total_count }
          assert:
            - "First page: response_type == array with exactly 2 rows, ${page1_total} == 3 and ${page1_more} == true"
            - "Second page: exactly 1 row, ${page2_total} == 3 and ${page2_more} == false"
            - "Filtering by accepts_travelers true yields ${filtered_total} == 1 with ${filtered_group} == GROUP_4 — total_count follows the filter, not the table"
      - name: member_not_found_returns_member_not_found_404
        claim_type: not_found
        grounds:
          - errors.ERR_MEMBER_NOT_FOUND
          - validations[priority=4]
          - endpoints["GET /hiring-hall/members/{id}"]
        distinguishing_aspect: "A syntactically valid but unknown member id on a path parameter returns 404 ERR_MEMBER_NOT_FOUND from the priority-4 existence row, not a 200 with an empty body."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; no members exist at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
          trigger:
            - call: "GET /hiring-hall/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HallAdmin
              captures: { err: $.data.error_id, msg: $.data.message }
            - call: "GET /hiring-hall/registrations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err2: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error and ${err} == ERR_MEMBER_NOT_FOUND"
            - "${msg} is a non-empty string"
            - "${err2} == ERR_REGISTRATION_NOT_FOUND — the existence row picks the error by the entity named in the path, not a single generic code"
      - name: job_request_missing_required_report_at_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - endpoints["POST /hiring-hall/job-requests"]
        distinguishing_aspect: "report_at has source: input with no default, so omitting it returns 422 ERR_INVALID_REQUEST from the priority-3 shape row — before any existence or business check touches contractor_id."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; one signatory contractor so the omission is the only defect in the request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/contractors"
              payload: { name: "Aldridge Mechanical", agreement_expires_at: "2027-06-30T00:00:00.000Z", signatory_status: "SIGNATORY" }
              as: HallAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${c_id}", job_site: "No Report Time", journeyworkers_requested: 2, apprentices_requested: 0, expected_duration_days: 20, hourly_rate_cents: 5000 }
              as: ContractorRep
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${c_id}", job_site: "Zero Headcount", journeyworkers_requested: 0, apprentices_requested: 0, expected_duration_days: 20, report_at: "2026-09-25T07:00:00.000Z", hourly_rate_cents: 5000 }
              as: ContractorRep
              as_user_id: "${c_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "HTTP 422 and ${err} == ERR_INVALID_REQUEST for the missing report_at"
            - "${err2} == ERR_INVALID_REQUEST — the same row also enforces journeyworkers_requested + apprentices_requested >= 1"
            - "No JobRequest is persisted by either call: GET /hiring-hall/job-requests filtered by contractor_id returns total_count 0"
      - name: registration_and_contractor_optional_inputs_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Registration.fields.reciprocity_credits
          - entities.Registration.fields.claim_position_preservation
          - entities.Contractor.fields.signatory_status
          - entities.Local.fields.reciprocity_factor_bp
        distinguishing_aspect: "Omitting reciprocity_credits, predecessor_registration_id and claim_position_preservation yields [], null and false; omitting Contractor.signatory_status yields SIGNATORY; omitting Local.reciprocity_factor_bp yields 0 — each is the value declared in §1.1's default:, not an implementation guess."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; a HOME local created WITHOUT reciprocity_factor_bp; GROUP_1; one journeyworker with 9000 hours."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME" }
              as: HallAdmin
              captures: { home_local_id: $.data.id, bp_default: $.data.reciprocity_factor_bp }
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_1", priority_rank: 1, ordering_policy: "SENIORITY", requires_local_hours: 4000, accepts_travelers: false }
              as: HallAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Otto Vance", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_id}", list_id: "${g1_id}" }
              as: Dispatcher
              captures: { reg_id: $.data.id, credits: $.data.reciprocity_credits, pred: $.data.predecessor_registration_id, claim: $.data.claim_position_preservation, dem: $.data.demotion_count, flag: $.data.priority_flag, status: $.data.status, removal: $.data.removal_reason }
            - call: "POST /hiring-hall/contractors"
              payload: { name: "Default Signatory Co", agreement_expires_at: "2027-06-30T00:00:00.000Z" }
              as: HallAdmin
              captures: { c_status: $.data.signatory_status }
          assert:
            - "${bp_default} == 0 and ${c_status} == SIGNATORY"
            - "${credits} == [] (empty array, not null), ${pred} == null and ${claim} == false"
            - "${dem} == 0, ${flag} == false, ${status} == REGISTERED and ${removal} == null — the computed fields also start at their declared defaults"
      - name: traveler_flag_and_credited_hours_are_computed_not_accepted_as_input
        claim_type: computed_fields
        grounds:
          - entities.Member.fields.is_traveler
          - entities.Registration.fields.credited_seniority_hours
          - calculations.traveler_credited_seniority_hours
        distinguishing_aspect: "is_traveler is derived from the home Local.kind (SISTER -> true) and credited_seniority_hours from local hours plus rounded reciprocity credits; neither appears in the endpoint's input list, so a client cannot set them."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; HOME Local 512 (bp 0) and SISTER Local 46 (bp 5000); GROUP_4 (priority_rank 4, SENIORITY, requires_local_hours 0, accepts_travelers true)."
            - "Pia Solis holds her book in Local 46 with 200 local hours here and claims one reciprocity credit of 1000 raw hours."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 46, name: "Local 46 (sister)", kind: "SISTER", reciprocity_factor_bp: 5000 }
              as: HallAdmin
              captures: { sister_id: $.data.id }
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_4", priority_rank: 4, ordering_policy: "SENIORITY", requires_local_hours: 0, accepts_travelers: true }
              as: HallAdmin
              captures: { g4_id: $.data.id }
          trigger:
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Pia Solis", home_local_id: "${sister_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 200 }
              as: HallAdmin
              captures: { m_pia_id: $.data.id, pia_trav: $.data.is_traveler }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Local Larry", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 200 }
              as: HallAdmin
              captures: { m_larry_id: $.data.id, larry_trav: $.data.is_traveler }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_pia_id}", list_id: "${g4_id}", reciprocity_credits: [{ sister_local_id: "${sister_id}", raw_hours: 1000 }] }
              as: Member
              as_user_id: "${m_pia_id}"
              captures: { reg_id: $.data.id, credited: $.data.credited_seniority_hours, reg_at: $.data.registered_at, due: $.data.renewal_due_at }
          assert:
            - "${pia_trav} == true and ${larry_trav} == false — the same 200 local hours, opposite flags, because only home Local.kind decides"
            - "${credited} == 700 — local_hours_in_trade 200 plus round_half_up(1000 * 5000 / 10000) == 500"
            - "${reg_at} == 2026-09-01T00:00:00.000Z and ${due} == 2026-10-01T00:00:00.000Z — both computed from the clock, neither accepted from the body"
      - name: referral_records_issuing_user_and_issue_instant_as_system_fields
        claim_type: system_fields
        grounds:
          - entities.Referral.fields.issued_by_user_id
          - entities.Referral.fields.issued_at
          - entities.Referral.fields.member_id
        distinguishing_aspect: "issued_by_user_id is taken from the X-User-ID header (source: system) and issued_at from the logical clock, while id / created_at / version are generated — none of the four is in the endpoint's declared input."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; GROUP_1; one registered journeyworker; one signatory contractor with a LONG_CALL request for one journeyworker."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_1", priority_rank: 1, ordering_policy: "SENIORITY", requires_local_hours: 4000, accepts_travelers: false }
              as: HallAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hiring-hall/ratio-policies"
              payload: { policy_code: "STD-2026", first_apprentice_at_jw_count: 1, then_every_n_jw: 4, effective_from: "2026-01-01T00:00:00.000Z" }
              as: HallAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Quill Adeyemi", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { m_id: $.data.id }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_id}", list_id: "${g1_id}" }
              as: Dispatcher
              captures: { reg_id: $.data.id }
            - call: "POST /hiring-hall/contractors"
              payload: { name: "Kestrel Piping", agreement_expires_at: "2027-06-30T00:00:00.000Z", signatory_status: "SIGNATORY" }
              as: HallAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${c_id}", job_site: "Pump House", journeyworkers_requested: 1, apprentices_requested: 0, expected_duration_days: 20, report_at: "2026-09-25T07:00:00.000Z", hourly_rate_cents: 5000 }
              as: ContractorRep
              as_user_id: "${c_id}"
              captures: { jr_id: $.data.id, jr_v: $.data.version }
          trigger:
            - call: "POST /hiring-hall/job-requests/${jr_id}/referrals"
              payload: { slot_kind: "JOURNEYWORKER", referral_kind: "LIST_ORDER", expected_job_request_version: "${jr_v}" }
              as: Dispatcher
              as_user_id: "disp-07"
              captures: { ref_id: $.data.id, by: $.data.issued_by_user_id, at: $.data.issued_at, deadline: $.data.acceptance_deadline, mem: $.data.member_id, reg: $.data.registration_id, ver: $.data.version, created: $.data.created_at }
          assert:
            - "${by} == disp-07 — copied from X-User-ID, which is not a body field"
            - "${at} == 2026-09-01T00:00:00.000Z, ${deadline} == 2026-09-02T00:00:00.000Z and ${created} == 2026-09-01T00:00:00.000Z"
            - "${mem} == ${m_id} and ${reg} == ${reg_id} — both computed from the selected registration, neither supplied"
            - "${ver} == 1"
      - name: member_apprentice_period_outside_declared_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.Member.fields.apprentice_period
          - entities.Member.fields.classification
          - validations[priority=3]
        distinguishing_aspect: "apprentice_period is constrained to null or 1..4 and is required exactly when classification == APPRENTICE, so 5 is rejected, a journeyworker carrying a period is rejected, and an apprentice without one is rejected — all as ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; one HOME local."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
          trigger:
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Period Five", home_local_id: "${home_local_id}", classification: "APPRENTICE", local_hours_in_trade: 100, apprentice_period: 5 }
              as: HallAdmin
              captures: { err_range: $.data.error_id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Journeyworker With Period", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000, apprentice_period: 2 }
              as: HallAdmin
              captures: { err_iff: $.data.error_id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Apprentice No Period", home_local_id: "${home_local_id}", classification: "APPRENTICE", local_hours_in_trade: 100 }
              as: HallAdmin
              captures: { err_missing: $.data.error_id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Valid Apprentice", home_local_id: "${home_local_id}", classification: "APPRENTICE", local_hours_in_trade: 100, apprentice_period: 4 }
              as: HallAdmin
              captures: { ok_period: $.data.apprentice_period, ok_cls: $.data.classification }
          assert:
            - "${err_range} == ERR_INVALID_REQUEST with HTTP 422 — 5 is outside 1..4"
            - "${err_iff} == ERR_INVALID_REQUEST — a JOURNEYWORKER MUST carry null"
            - "${err_missing} == ERR_INVALID_REQUEST — an APPRENTICE MUST carry a period"
            - "The fourth call returns 201 with ${ok_period} == 4 and ${ok_cls} == APPRENTICE — the upper bound itself is valid"
      - name: skill_endorsement_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.SkillEndorsement
          - endpoints["POST /hiring-hall/members/{id}/skill-endorsements"]
          - endpoints["GET /hiring-hall/skill-endorsements/{id}"]
        distinguishing_aspect: "SkillEndorsement declares common_fields: false, so §1.5 exposes create, read-by-id and list-under-member only — no PATCH, no DELETE — and the returned body carries no version field to bump."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; one HOME local; one journeyworker; one verified WELDING_6G endorsement certified to 2027-01-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Rue Halvorsen", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /hiring-hall/members/${m_id}/skill-endorsements"
              payload: { skill_code: "WELDING_6G", certified_until: "2027-01-01T00:00:00.000Z", verified: true }
              as: HallAdmin
              captures: { se_id: $.data.id, se_member: $.data.member_id, se_code: $.data.skill_code, se_until: $.data.certified_until, se_verified: $.data.verified }
