      - name: assessor_daily_aggregate_capacity
        resource_entity: Assessor
        interval_semantics: "aggregate count inside one closed UTC calendar day of assessed_at — a bucket-cardinality constraint, not pairwise interval overlap"
        grounds:
          - validations.priority_24
          - errors.ERR_ASSESSOR_DAY_CAPACITY_EXCEEDED
          - entities.Season.fields.assessor_daily_assessment_capacity
          - entities.Assessment.fields.assessed_at
        distinguishing_aspect: |
          A different contended resource (Assessor, not Wrestler) under genuinely different temporal
          semantics: no two assessments ever overlap as intervals — they are instants — and the limit
          is the COUNT inside a UTC calendar-day bucket, aggregated across every wrestler and every
          team. The boundary is the day edge rather than an interval endpoint: the fourth assessment
          is refused at 2026-11-01T23:59:30Z and accepted, byte-identical otherwise, at
          2026-11-02T00:00:00Z — thirty seconds later.
