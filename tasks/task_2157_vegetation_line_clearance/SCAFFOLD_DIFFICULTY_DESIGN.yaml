        distinguishing_aspect: |
          Boundary on the units-per-mile NUMERIC THRESHOLD, reached through the billing-lines
          endpoint: 100 units over 2.5 miles is exactly 40.0 and takes the 1.00 tier
          (>= 40, not > 40) for gross 480000, while 99 units is 39.6 and takes the 1.15 sparse tier
          for gross 546480 - fewer units billing more money.
