      - name: blackout_window_refusal_at_priority_seventeen
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: blackout_temporal_error_beats_channel_saturation_constraint
          rationale: "ERR_BLACKOUT_WINDOW and its precedence over the channel-saturation constraint at priority 19 are the whole point of the second priority_pair_validation_conflict instance, which builds the saturating pair and the recess window in one chain."

      - name: channel_window_saturation_refusal_at_priority_nineteen
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: channel_closed_window_saturation_at_cap_two_then_gap_reopens
          rationale: "ERR_CHANNEL_WINDOW_SATURATED at CHANNEL_CONCURRENCY_CAP 2, including the touching-bound collision and the reopening gap, is the resource_temporal_overlap instance for activations."

      - name: meeting_window_conflict_refusal_at_priority_eighteen
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: meeting_half_open_interval_plus_thirty_minute_travel_buffer
          rationale: "ERR_MEETING_WINDOW_CONFLICT with the half-open interval and the 30-minute travel buffer (15:29 refused, 15:30 accepted) is the resource_temporal_overlap instance for district meetings."

      - name: activation_requires_a_locked_variant_at_priority_twentytwo
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: activation_create_blocked_until_message_variant_reaches_locked
          rationale: "ERR_VARIANT_NOT_LOCKED is the refusal half of the first cross_entity_state_dependency instance, which also asserts the 201 once the variant reaches LOCKED."

      - name: meeting_requires_a_certified_spokesperson_at_priority_twentytwo
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: district_meeting_request_blocked_until_spokesperson_reaches_certified
          rationale: "ERR_SPOKESPERSON_NOT_CERTIFIED is the refusal half of the second cross_entity_state_dependency instance, which also asserts the REQUESTED meeting once the profile reaches CERTIFIED."

      - name: revision_limit_refusal_at_priority_twentyone
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: message_variant_revision_cycle_terminates_at_third_round
          rationale: "ERR_REVISION_LIMIT_REACHED is the termination condition of the non_linear_state_machine instance, which walks the DRAFT -> IN_REVIEW -> CHANGES_REQUESTED cycle up to revision_round 3."

      - name: frozen_campaign_refusal_at_priority_nine
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: frozen_posture_state_error_beats_fiscal_reach_floor
          rationale: "ERR_CAMPAIGN_FROZEN and its precedence over the priority 24 reach floor are the first priority_pair_validation_conflict instance, which arranges a frozen posture and an under-minimum reach in the same request."

