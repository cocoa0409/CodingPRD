            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "RATING_SCALE", percentile: 88, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "SCORING" }, as: GiftedCoordinator }
          trigger:
            - { call: "POST /gifted/cases/${case_id}/finalize-scoring", payload: {}, as: GiftedCoordinator, captures: { comp: $.data.composite_score, st: $.data.status, sv: $.data.scored_variant } }
          assert:
            - "comp == 94 and st == AWAITING_COMMITTEE and sv == STANDARD, all read from the finalize response itself"
