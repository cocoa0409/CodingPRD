scenario: |
  2753. Investor Relations Inquiry & Shareholder Services (public company investor relations):
  shareholder and analyst inquiry intake with routing, response approval and disclosure boundary
  controls, targeting of institutional investors with ownership analysis and outreach planning,
  conference and non-deal roadshow scheduling with meeting request prioritization, consensus
  estimate collection, model distribution and guidance framework maintenance, transfer agent
  coordination on record dates, dividend payments and shareholder record inquiries, retail
  shareholder communications, annual meeting logistics and proxy solicitation coordination,
  activist investor monitoring with response preparedness, disclosure of material information
  and selective disclosure prevention

domain_name: investor-relations-shareholder-services
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by foreign keys; the only nested URL paths are two
  # reverse-reachability reads (GET /companies/{id}/consensus is a computed read,
  # GET /contacts/{id}/estimates is the EstimateSubmission discovery channel).
  # No entity is addressed through a parent-scoped write path.

  state_machine_shape: cyclic
  # ResponseDraft cycles DRAFT -> IN_REVIEW -> CHANGES_REQUESTED -> DRAFT and
  # BLOCKED -> DRAFT; MeetingRequest forks REQUESTED -> {ALLOCATED, WAITLISTED}
  # with divergent side-effect sets and re-joins via promotion; Disclosure and
  # TransferAgentInstruction each branch on a decision field.

  relationship_patterns:
    - one_to_many          # Company -> Contact / Disclosure / InquiryTicket / RoadshowEvent / TransferAgentInstruction
    - self_referential     # InquiryTicket.linked_prior_inquiry_id -> InquiryTicket.id
    - cross_aggregate      # ResponseDraft.cited_disclosure_id crosses the inquiry aggregate into the disclosure aggregate
    - polymorphic_actor    # Contact carries holder and sell-side-analyst behaviour on one row, discriminated by contact_type

  role_model: segregation_of_duties
  # Two independent SoD walls: (1) the DisclosureOfficer who reviews a ResponseDraft
  # must not be the X-User-ID that authored it; (2) the TransferAgentLiaison who
  # executes a dividend instruction must not be the X-User-ID that submitted it.

  consistency_model: immediate
  # Every cascade completes inside the triggering request. Derived aggregates
  # (Company.disclosure_posture, Company.open_inquiry_count, RoadshowEvent counters)
  # are STORED fields refreshed only by the explicitly enumerated triggers in §1.3;
  # gates read the stored value, so a stale posture is observable and testable.

  difficulty_level: expert_plus
  # 9 entities / 45 endpoints / 53 error codes / 14 calculations (3 dual-variant)
  # / 7 state machines (1 cyclic, 1 parallel-dimension, 3 branching) / 3 OCC parents
  # / 54 ordered validation rules across 17 priority levels.

entities:
  - name: Company
    parent: null
    common_fields: true
    fields:
      - name: ticker
        type: string
        source: input
        description: exchange ticker symbol identifying the issuer
        constraints: 1-8 uppercase characters; unique across all Company rows (ERR_DUPLICATE_TICKER)
      - name: legal_name
        type: string
        source: input
        description: registrant legal name used on shareholder communications
        constraints: non-empty, max 200 chars
      - name: shares_outstanding
        type: integer
        source: input
        description: total common shares outstanding, denominator of every ownership_pct
        constraints: "> 0"
      - name: blackout_window_start
        type: datetime
        source: input
        description: inclusive start of the earnings blackout window; null means no scheduled blackout
        default: null
      - name: blackout_window_end
        type: datetime
        source: input
        description: exclusive end of the earnings blackout window; null means no scheduled blackout
        default: null
      - name: dividend_reserve_cents
        type: integer
        source: input
        description: cash in whole cents still available to fund dividend instruction execution
        default: 0
        constraints: ">= 0; debited by TransferAgentInstruction execute, credited back by reverse"
      - name: dividend_paid_cents
        type: integer
        source: computed
        description: cumulative whole cents paid out by EXECUTED dividend instructions
        default: 0
        constraints: "dividend_reserve_cents + dividend_paid_cents is invariant across execute/reverse (§1.3 dividend_cash_conservation)"
      - name: disclosure_posture
        type: enum
        source: computed
        description: stored disclosure gate derived by §1.3 company_disclosure_posture; gates review, send, model access, allocation and estimate intake
        default: OPEN
        constraints: "OPEN | RESTRICTED | BLACKOUT"
      - name: open_inquiry_count
        type: integer
        source: computed
        description: count of this company's InquiryTicket rows whose status is in {NEW, ROUTED, DRAFTING, AWAITING_APPROVAL, ESCALATED}
        default: 0
      - name: posture_recomputed_at
        type: datetime
        source: computed
        description: logical-clock instant at which disclosure_posture was last re-derived
        default: null

  - name: Contact
    parent: null
    common_fields: true
    fields:
      - name: company_id
        type: string
        source: input
        description: FK -> Company.id; issuer whose shareholder register / coverage list this contact sits on
      - name: contact_type
        type: enum
        source: input
        description: discriminator selecting holder versus sell-side behaviour
        constraints: "INSTITUTIONAL_HOLDER | RETAIL_HOLDER | SELL_SIDE_ANALYST"
      - name: display_name
        type: string
        source: input
        description: institution or analyst name shown on outreach lists
        constraints: non-empty, max 160 chars
      - name: email
        type: string
        source: input
        description: contact email used for retail shareholder communications
        constraints: must contain '@'
      - name: shares_held
        type: integer
        source: input
        description: shares of record currently held by this contact
        default: 0
        constraints: ">= 0; sum over the company's INSTITUTIONAL_HOLDER + RETAIL_HOLDER contacts must not exceed Company.shares_outstanding (ERR_SHARES_EXCEED_OUTSTANDING)"
      - name: ownership_pct
        type: number
        source: computed
        description: shares_held / Company.shares_outstanding * 100, round_half_up to 4 decimals (§1.3 ownership_pct_and_target_tier)
        default: 0.0
      - name: target_tier
        type: enum
        source: computed
        description: outreach targeting tier derived from ownership_pct thresholds (§1.3 ownership_pct_and_target_tier)
        default: UNTIERED
        constraints: "TIER_1 | TIER_2 | TIER_3 | UNTIERED"
      - name: nda_on_file
        type: boolean
        source: input
        description: whether a signed NDA is on file, required before model access can be granted
        default: false
      - name: model_access_status
        type: enum
        source: computed
        description: financial-model distribution state, moved only by POST /contacts/{id}/servicing
        default: NONE
        constraints: "NONE | GRANTED | REVOKED"
      - name: coverage_status
        type: enum
        source: input
        description: sell-side coverage state; only INITIATED analysts may submit consensus estimates
        default: NOT_COVERING
        constraints: "NOT_COVERING | INITIATED | SUSPENDED"
      - name: activist_flag
        type: boolean
        source: input
        description: whether this holder is tracked by the activist-monitoring programme
        default: false
      - name: threat_level
        type: enum
        source: input
        description: activist threat assessment; feeds Company.disclosure_posture when activist_flag is true
        default: NONE
        constraints: "NONE | WATCH | ELEVATED | CRITICAL"
      - name: dividend_received_cents
        type: integer
        source: computed
        description: cumulative whole cents credited to this holder by EXECUTED dividend instructions, decremented on reversal
        default: 0

  - name: Disclosure
    parent: null
    common_fields: true
    fields:
      - name: company_id
        type: string
        source: input
        description: FK -> Company.id; issuer this disclosure belongs to
      - name: disclosure_type
        type: enum
        source: input
        description: form of the public disclosure; GUIDANCE_UPDATE rows carry the guidance framework values
        constraints: "EARNINGS_RELEASE | GUIDANCE_UPDATE | PRESS_RELEASE | FORM_8K"
      - name: fact_key
        type: string
        source: input
        description: stable key naming the disclosed fact, cited by response drafts
        constraints: "non-empty, max 80 chars; unique per company among rows whose status is in {DRAFT, PUBLISHED} (ERR_DUPLICATE_FACT_KEY)"
      - name: metric
        type: enum
        source: input
        description: guidance metric this disclosure sets; NONE for non-guidance disclosures
        default: NONE
        constraints: "REVENUE | EPS | FCF_MARGIN | NONE"
      - name: period_label
        type: string
        source: input
        description: guidance period label such as FY2026; null for non-guidance disclosures
        default: null
      - name: guidance_low
        type: number
        source: input
        description: low end of the guidance range for metric/period_label
        default: null
        constraints: "required when disclosure_type = GUIDANCE_UPDATE; must be <= guidance_high"
      - name: guidance_high
        type: number
        source: input
        description: high end of the guidance range for metric/period_label
        default: null
        constraints: "required when disclosure_type = GUIDANCE_UPDATE"
      - name: status
        type: enum
        source: computed
        description: disclosure lifecycle state (§1.2 Disclosure)
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | SUPERSEDED | WITHDRAWN"
      - name: published_at
        type: datetime
        source: computed
        description: logical-clock instant at which the disclosure entered PUBLISHED; null while DRAFT
        default: null
      - name: is_guidance
        type: boolean
        source: computed
        description: "true when disclosure_type = GUIDANCE_UPDATE and metric != NONE; selects this row into the consensus guidance band"
        default: false
      - name: withdrawal_reason
        type: string
        source: input
        description: operator reason recorded when the disclosure is withdrawn
        default: null

  - name: InquiryTicket
    parent: null
    common_fields: true
    fields:
      - name: company_id
        type: string
        source: input
        description: FK -> Company.id; issuer the inquiry is addressed to
      - name: contact_id
        type: string
        source: input
        description: FK -> Contact.id; shareholder or analyst who submitted the inquiry
      - name: linked_prior_inquiry_id
        type: string
        source: input
        description: FK -> InquiryTicket.id; earlier inquiry this one follows up on (self-referential), null when standalone
        default: null
      - name: topic_category
        type: enum
        source: input
        description: intake taxonomy driving base sensitivity and queue routing
        constraints: "DIVIDEND | RECORD_DATE | PROXY | GUIDANCE | MODEL_REQUEST | OTHER"
      - name: subject
        type: string
        source: input
        description: one-line inquiry subject captured at intake
        constraints: non-empty, max 200 chars
      - name: requests_nonpublic_detail
        type: boolean
        source: input
        description: intake flag set when the inquiry explicitly asks for detail beyond published disclosures
        default: false
      - name: sensitivity_score
        type: integer
        source: computed
        description: 0-100 disclosure-risk score frozen at intake by §1.3 inquiry_sensitivity_score
        default: 0
      - name: routing_queue
        type: enum
        source: computed
        description: queue selected by §1.3 inquiry_routing_queue at intake, replaceable by a DisclosureOfficer override on route
        constraints: "SHAREHOLDER_SERVICES | IR_DESK | DISCLOSURE_COMMITTEE | TRANSFER_AGENT_DESK"
      - name: sla_due_at
        type: datetime
        source: computed
        description: response deadline derived from the logical clock and the queue SLA hours (§1.3 inquiry_sla_due_at)
      - name: status
        type: enum
        source: computed
        description: inquiry lifecycle state (§1.2 InquiryTicket)
        default: NEW
        constraints: "NEW | ROUTED | DRAFTING | AWAITING_APPROVAL | ANSWERED | ESCALATED"
      - name: answered_at
        type: datetime
        source: computed
        description: logical-clock instant at which an approved response draft was sent
        default: null

  - name: ResponseDraft
    parent: null
    common_fields: true
    fields:
      - name: inquiry_id
        type: string
        source: input
        description: FK -> InquiryTicket.id; inquiry this draft answers
      - name: cited_disclosure_id
        type: string
        source: input
        description: FK -> Disclosure.id; published disclosure the draft repeats, null when the draft cites nothing
        default: null
      - name: author_user_id
        type: string
        source: system
        description: X-User-ID of the IRAnalyst that created the draft; one half of the review segregation-of-duties wall
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the DisclosureOfficer that decided the review; null until reviewed
        default: null
      - name: body_text
        type: string
        source: input
        description: draft response text sent to the contact
        constraints: non-empty, max 4000 chars
      - name: disclosure_class
        type: enum
        source: input
        description: disclosure-boundary classification of the draft content
        constraints: "PUBLIC_DOMAIN | GUIDANCE_REPEAT | MATERIAL_NONPUBLIC"
      - name: status
        type: enum
        source: computed
        description: draft lifecycle state (§1.2 ResponseDraft)
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | CHANGES_REQUESTED | APPROVED | BLOCKED | SENT"
      - name: revision_round
        type: integer
        source: computed
        description: number of authoring rounds; starts at 1 and increments on every revise
        default: 1
        constraints: "revise is rejected once revision_round = MAX_REVISION_ROUNDS (ERR_REVISION_LIMIT_REACHED)"
      - name: reviewer_note
        type: string
        source: input
        description: reviewer feedback recorded when the review decision is REQUEST_CHANGES
        default: null
      - name: pinned_disclosure_version
        type: integer
        source: computed
        description: cited Disclosure.version captured at approval; send is rejected when it no longer matches
        default: null
      - name: blocked_reason
        type: enum
        source: computed
        description: why the draft was force-blocked by a cascade
        default: null
        constraints: "CITED_DISCLOSURE_WITHDRAWN | POSTURE_BLACKOUT"

  - name: EstimateSubmission
    parent: null
    common_fields: true
    fields:
      - name: contact_id
        type: string
        source: input
        description: FK -> Contact.id; sell-side analyst submitting the estimate
      - name: metric
        type: enum
        source: input
        description: estimated metric
        constraints: "REVENUE | EPS | FCF_MARGIN"
      - name: period_label
        type: string
        source: input
        description: estimate period label such as FY2026
        constraints: non-empty, max 20 chars
      - name: value
        type: number
        source: input
        description: submitted point estimate for metric/period_label
        constraints: "> 0"
      - name: submitted_at
        type: datetime
        source: computed
        description: logical-clock instant of submission; drives the 90-day consensus eligibility window
      - name: status
        type: enum
        source: computed
        description: ACCEPTED until a later submission by the same analyst for the same metric+period supersedes it
        default: ACCEPTED
        constraints: "ACCEPTED | SUPERSEDED"

  - name: RoadshowEvent
    parent: null
    common_fields: true
    fields:
      - name: company_id
        type: string
        source: input
        description: FK -> Company.id; issuer hosting the conference or non-deal roadshow
      - name: event_type
        type: enum
        source: input
        description: CONFERENCE for sponsored investor conferences, NDR for non-deal roadshows
        constraints: "CONFERENCE | NDR"
      - name: venue_city
        type: string
        source: input
        description: city hosting the event, printed on the outreach plan
        constraints: non-empty, max 80 chars
      - name: window_start
        type: datetime
        source: input
        description: inclusive earliest instant a meeting slot may start
      - name: window_end
        type: datetime
        source: input
        description: inclusive latest instant a meeting slot may end
        constraints: "must be > window_start"
      - name: slot_minutes
        type: integer
        source: input
        description: exact duration in minutes every meeting slot must have
        constraints: "in {20, 30, 45, 60}"
      - name: capacity_slots
        type: integer
        source: input
        description: number of meeting slots the management team can host at this event
        constraints: ">= 1"
      - name: allocated_count
        type: integer
        source: computed
        description: number of this event's MeetingRequest rows currently in status ALLOCATED
        default: 0
      - name: waitlisted_count
        type: integer
        source: computed
        description: number of this event's MeetingRequest rows currently in status WAITLISTED
        default: 0
      - name: released_count
        type: integer
        source: computed
        description: number of this event's MeetingRequest rows currently in status RELEASED
        default: 0
      - name: declined_count
        type: integer
        source: computed
        description: number of this event's MeetingRequest rows currently in status DECLINED
        default: 0
      - name: request_ledger_total
        type: integer
        source: computed
        description: total MeetingRequest rows created against this event; conserved quantity of §1.3 event_request_ledger
        default: 0
      - name: status
        type: enum
        source: computed
        description: event lifecycle state (§1.2 RoadshowEvent)
        default: PLANNING
        constraints: "PLANNING | OPEN_FOR_REQUESTS | LOCKED | COMPLETED"

  - name: MeetingRequest
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: FK -> RoadshowEvent.id; event the meeting is requested at
      - name: contact_id
        type: string
        source: input
        description: FK -> Contact.id; investor or analyst requesting management time
      - name: requested_slot_start
        type: datetime
        source: input
        description: inclusive start of the requested slot; must sit inside the event window
      - name: requested_slot_end
        type: datetime
        source: input
        description: exclusive end of the requested slot; requested_slot_end - requested_slot_start must equal RoadshowEvent.slot_minutes
      - name: provisional_priority_score
        type: number
        source: computed
        description: priority computed at intake from the contact snapshot at that moment (§1.3 meeting_priority_score variant provisional)
      - name: final_priority_score
        type: number
        source: computed
        description: priority recomputed during the allocation run including the lead-time bonus (§1.3 meeting_priority_score variant final); null until allocation
        default: null
      - name: status
        type: enum
        source: computed
        description: meeting request lifecycle state (§1.2 MeetingRequest)
        default: REQUESTED
        constraints: "REQUESTED | ALLOCATED | WAITLISTED | RELEASED | DECLINED"
      - name: allocated_at
        type: datetime
        source: computed
        description: logical-clock instant at which the request entered ALLOCATED (allocation run or waitlist promotion)
        default: null
      - name: release_reason
        type: string
        source: input
        description: operator reason recorded when an allocated slot is released
        default: null
      - name: promoted_from_waitlist
        type: boolean
        source: computed
        description: true when this request reached ALLOCATED through waitlist promotion rather than the allocation run
        default: false

  - name: TransferAgentInstruction
    parent: null
    common_fields: true
    fields:
      - name: company_id
        type: string
        source: input
        description: FK -> Company.id; issuer whose transfer agent receives the instruction
      - name: instruction_type
        type: enum
        source: input
        description: kind of transfer-agent coordination request
        constraints: "RECORD_DATE_SET | DIVIDEND_PAYMENT | RECORD_INQUIRY"
      - name: record_date
        type: datetime
        source: input
        description: record date on which the holder snapshot is taken; compared at UTC calendar-date granularity
        default: null
        constraints: "required for RECORD_DATE_SET and DIVIDEND_PAYMENT; must not precede the logical clock date"
      - name: payable_date
        type: datetime
        source: input
        description: date the dividend becomes payable; compared at UTC calendar-date granularity
        default: null
        constraints: "required for DIVIDEND_PAYMENT; payable_date date - record_date date must be >= MIN_RECORD_TO_PAYABLE_DAYS"
      - name: declared_rate_cents_per_share
        type: number
        source: input
        description: declared dividend rate in cents per share, up to 4 decimals
        default: null
        constraints: "required for DIVIDEND_PAYMENT; > 0"
      - name: funding_mode
        type: enum
        source: input
        description: selects which §1.3 dividend_payout_ledger variant computes the payout
        default: DECLARED_RATE
        constraints: "DECLARED_RATE | RESERVE_CAPPED"
      - name: notes
        type: string
        source: input
        description: free-text note forwarded to the transfer agent, used for shareholder record inquiries
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the IRAdmin that submitted the instruction; one half of the dividend segregation-of-duties wall
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: X-User-ID of the TransferAgentLiaison that acknowledged or rejected the instruction
        default: null
      - name: executed_by_user_id
        type: string
        source: system
        description: X-User-ID of the TransferAgentLiaison that executed the instruction
        default: null
      - name: snapshot_holder_count
        type: integer
        source: computed
        description: number of holders captured by the record-date snapshot taken at acknowledgement
        default: null
      - name: snapshot_shares_total
        type: integer
        source: computed
        description: sum of shares_held captured by the record-date snapshot; denominator of the RESERVE_CAPPED effective rate
        default: null
      - name: payout_ledger
        type: array
        source: computed
        description: "per-holder payout rows [{contact_id, shares_held, amount_cents}] written at execution and replayed in reverse on reversal"
        default: null
      - name: total_payout_cents
        type: integer
        source: computed
        description: sum of payout_ledger[].amount_cents; whole cents debited from Company.dividend_reserve_cents
        default: null
      - name: executed_at
        type: datetime
        source: computed
        description: logical-clock instant of execution; start of the REVERSAL_WINDOW_HOURS reversal window
        default: null
      - name: status
        type: enum
        source: computed
        description: instruction lifecycle state (§1.2 TransferAgentInstruction)
        default: SUBMITTED
        constraints: "SUBMITTED | ACKNOWLEDGED | REJECTED | EXECUTED | REVERSED"
      - name: decision_reason
        type: string
        source: input
        description: reason text recorded on rejection or reversal
        default: null

state_machines:
  - entity: Disclosure
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /disclosures/{id}/publish"
        actor: DisclosureOfficer
        preconditions:
          - "status == DRAFT (else ERR_DISCLOSURE_INVALID_STATE)"
          - "when disclosure_type == GUIDANCE_UPDATE: metric != NONE, period_label != null, guidance_low != null, guidance_high != null, guidance_low <= guidance_high (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = PUBLISHED; published_at = logical clock now; version += 1"
          - "supersede cascade (link 1): every OTHER Disclosure of this company with status == PUBLISHED, is_guidance == true and the same (metric, period_label) transitions PUBLISHED -> SUPERSEDED, its version += 1"
          - "no ResponseDraft is blocked by supersession: drafts keep their APPROVED status and their now-stale pinned_disclosure_version, which POST /response-drafts/{id}/send rejects with ERR_PINNED_DISCLOSURE_STALE"
        note: "Publishing is the only producer of PUBLISHED; supersession is the only producer of SUPERSEDED."
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /disclosures/{id}/withdraw"
        actor: DisclosureOfficer
        preconditions:
          - "status == PUBLISHED (else ERR_DISCLOSURE_INVALID_STATE)"
          - "reason is a non-empty string (else ERR_INVALID_REQUEST)"
        side_effects:
          - "link 1: status = WITHDRAWN; withdrawal_reason = reason; version += 1"
          - "link 2 (caused by link 1): every ResponseDraft with cited_disclosure_id == this.id and status IN {IN_REVIEW, APPROVED} transitions to BLOCKED with blocked_reason = CITED_DISCLOSURE_WITHDRAWN, pinned_disclosure_version left untouched, version += 1"
          - "link 3 (caused by link 2): for each draft blocked in link 2 whose InquiryTicket.status == AWAITING_APPROVAL, that inquiry transitions AWAITING_APPROVAL -> DRAFTING, sla_due_at = logical clock now + SLA_HOURS[inquiry.routing_queue], version += 1"
          - "link 4 (caused by link 3): the company of each inquiry touched in link 3 recomputes open_inquiry_count and disclosure_posture, sets posture_recomputed_at = logical clock now, version += 1"
        note: "Depth-4 transitive cascade: disclosure -> draft -> inquiry -> company. Each link is caused by the previous link, not by the withdraw call."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /disclosures/{id}/withdraw"
        actor: DisclosureOfficer
        preconditions:
          - "status == DRAFT"
          - "reason is a non-empty string (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = WITHDRAWN; withdrawal_reason = reason; version += 1"
          - "NO draft/inquiry/company cascade fires: an unpublished disclosure cannot have been cited by an APPROVED draft, so the divergent branch stops at the disclosure row"
        note: "Branch of the same trigger with a deliberately different side-effect set from PUBLISHED -> WITHDRAWN."
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: another GUIDANCE_UPDATE disclosure for the same (company, metric, period_label) is published"
        actor: system
        preconditions:
          - "is_guidance == true and the newly published disclosure has the same company_id, metric and period_label"
        side_effects:
          - "status = SUPERSEDED; version += 1"
          - "APPROVED drafts citing this row are NOT blocked; their pinned_disclosure_version becomes stale, which send rejects"

  - entity: InquiryTicket
    initial_state: NEW
    terminal_states: [ANSWERED]
    transitions:
      - from: NEW
        to: ROUTED
        trigger: "POST /inquiries/{id}/route"
        actor: IRAnalyst | DisclosureOfficer
        preconditions:
          - "status == NEW (else ERR_INQUIRY_INVALID_STATE)"
          - "sensitivity_score < ESCALATION_THRESHOLD (80)"
          - "target_queue may only be supplied by DisclosureOfficer (else ERR_QUEUE_OVERRIDE_FORBIDDEN)"
        side_effects:
          - "status = ROUTED; when target_queue was supplied, routing_queue = target_queue and sla_due_at = logical clock now + SLA_HOURS[target_queue]; version += 1"
      - from: NEW
        to: ESCALATED
        trigger: "POST /inquiries/{id}/route (automatic branch)"
        actor: IRAnalyst | DisclosureOfficer
        preconditions:
          - "status == NEW"
          - "sensitivity_score >= ESCALATION_THRESHOLD (80)"
        side_effects:
          - "status = ESCALATED; routing_queue = DISCLOSURE_COMMITTEE; sla_due_at = logical clock now + SLA_HOURS[DISCLOSURE_COMMITTEE]; version += 1"
          - "open_inquiry_count on the company is unchanged (both NEW and ESCALATED are open statuses)"
        note: "Automatic fork on the same trigger: the score decides ROUTED vs ESCALATED, with divergent queue and SLA side effects."
      - from: ESCALATED
        to: ROUTED
        trigger: "POST /inquiries/{id}/route with target_queue"
        actor: DisclosureOfficer
        preconditions:
          - "status == ESCALATED"
          - "target_queue is supplied and the caller role is DisclosureOfficer (else ERR_QUEUE_OVERRIDE_FORBIDDEN)"
        side_effects:
          - "status = ROUTED; routing_queue = target_queue; sla_due_at = logical clock now + SLA_HOURS[target_queue]; version += 1"
      - from: ROUTED
        to: DRAFTING
        trigger: "POST /response-drafts (draft created against this inquiry)"
        actor: IRAnalyst
        preconditions:
          - "status IN {ROUTED, DRAFTING} (else ERR_INQUIRY_INVALID_STATE) — DRAFTING is admitted so that a fresh draft may be authored after the previous one was force-BLOCKED by a cascade (BLOCKED is not an active status)"
          - "no ResponseDraft for this inquiry has status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED} (else ERR_ACTIVE_DRAFT_EXISTS)"
        side_effects:
          - "status = DRAFTING; version += 1"
          - "when the inquiry was already DRAFTING the status is unchanged and version += 1 (the write is the new draft row)"
      - from: DRAFTING
        to: AWAITING_APPROVAL
        trigger: "POST /response-drafts/{id}/submit-review"
        actor: IRAnalyst
        preconditions:
          - "the submitted draft belongs to this inquiry and is in status DRAFT"
        side_effects:
          - "status = AWAITING_APPROVAL; version += 1"
      - from: AWAITING_APPROVAL
        to: DRAFTING
        trigger: "POST /response-drafts/{id}/review with decision = REQUEST_CHANGES, or the link-3 cascade of disclosure withdrawal / posture blackout"
        actor: DisclosureOfficer | system
        preconditions:
          - "status == AWAITING_APPROVAL"
        side_effects:
          - "status = DRAFTING; sla_due_at = logical clock now + SLA_HOURS[routing_queue]; version += 1"
      - from: AWAITING_APPROVAL
        to: ANSWERED
        trigger: "POST /response-drafts/{id}/send"
        actor: IRAnalyst
        preconditions:
          - "status == AWAITING_APPROVAL"
          - "the sent draft belongs to this inquiry and is in status APPROVED"
        side_effects:
          - "status = ANSWERED; answered_at = logical clock now; version += 1"
          - "the company recomputes open_inquiry_count (ANSWERED leaves the open set) and version += 1"

  - entity: ResponseDraft
    initial_state: DRAFT
    terminal_states: [SENT]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /response-drafts/{id}/submit-review"
        actor: IRAnalyst
        preconditions:
          - "status == DRAFT (else ERR_DRAFT_INVALID_STATE)"
          - "X-User-ID == author_user_id (else ERR_DRAFT_AUTHOR_MISMATCH)"
          - "when disclosure_class == GUIDANCE_REPEAT: cited_disclosure_id != null and that Disclosure.status == PUBLISHED (else ERR_CITATION_REQUIRED)"
        side_effects:
          - "status = IN_REVIEW; version += 1"
          - "the parent InquiryTicket transitions DRAFTING -> AWAITING_APPROVAL and its version += 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /response-drafts/{id}/review with decision = APPROVE"
        actor: DisclosureOfficer
        preconditions:
          - "status == IN_REVIEW (else ERR_DRAFT_INVALID_STATE)"
          - "expected_inquiry_version == InquiryTicket.version (else ERR_STALE_INQUIRY_VERSION)"
          - "X-User-ID != author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Company.disclosure_posture != BLACKOUT (else ERR_DISCLOSURE_BLACKOUT)"
          - "disclosure_class != MATERIAL_NONPUBLIC (else ERR_SELECTIVE_DISCLOSURE_BLOCKED)"
          - "when cited_disclosure_id != null: that Disclosure.status == PUBLISHED (else ERR_CITATION_REQUIRED)"
        side_effects:
          - "status = APPROVED; reviewer_user_id = X-User-ID; version += 1"
          - "pinned_disclosure_version = cited Disclosure.version when cited_disclosure_id != null, else stays null"
          - "the parent InquiryTicket stays AWAITING_APPROVAL and its version += 1 (OCC advance)"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /response-drafts/{id}/review with decision = REQUEST_CHANGES"
        actor: DisclosureOfficer
        preconditions:
          - "status == IN_REVIEW"
          - "expected_inquiry_version == InquiryTicket.version (else ERR_STALE_INQUIRY_VERSION)"
          - "X-User-ID != author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "reviewer_note is a non-empty string (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = CHANGES_REQUESTED; reviewer_user_id = X-User-ID; reviewer_note = supplied note; version += 1"
          - "the parent InquiryTicket transitions AWAITING_APPROVAL -> DRAFTING, sla_due_at recomputed, version += 1"
        note: "Divergent branch of the same trigger: APPROVE pins the disclosure version and leaves the inquiry awaiting; REQUEST_CHANGES rewinds the inquiry to DRAFTING."
      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "POST /response-drafts/{id}/revise"
        actor: IRAnalyst
        preconditions:
          - "status IN {CHANGES_REQUESTED, BLOCKED} (else ERR_DRAFT_INVALID_STATE)"
          - "X-User-ID == author_user_id (else ERR_DRAFT_AUTHOR_MISMATCH)"
          - "revision_round < MAX_REVISION_ROUNDS (3) (else ERR_REVISION_LIMIT_REACHED)"
        side_effects:
          - "status = DRAFT; revision_round += 1; blocked_reason = null; reviewer_note = null; body_text / disclosure_class / cited_disclosure_id replaced when supplied; version += 1"
          - "the parent InquiryTicket remains DRAFTING"
        note: "Closes the DRAFT -> IN_REVIEW -> CHANGES_REQUESTED -> DRAFT revision cycle."
      - from: BLOCKED
        to: DRAFT
        trigger: "POST /response-drafts/{id}/revise"
        actor: IRAnalyst
        preconditions:
          - "status == BLOCKED"
          - "X-User-ID == author_user_id"
          - "revision_round < MAX_REVISION_ROUNDS (3)"
        side_effects:
          - "status = DRAFT; revision_round += 1; blocked_reason = null; pinned_disclosure_version = null; version += 1"
      - from: IN_REVIEW
        to: BLOCKED
        trigger: "system: cited disclosure withdrawn, or Company.disclosure_posture recomputed to BLACKOUT while disclosure_class == MATERIAL_NONPUBLIC"
        actor: system
        preconditions:
          - "status == IN_REVIEW"
          - "either cited_disclosure_id points at a disclosure entering WITHDRAWN, or the posture recompute lands on BLACKOUT and disclosure_class == MATERIAL_NONPUBLIC"
        side_effects:
          - "status = BLOCKED; blocked_reason = CITED_DISCLOSURE_WITHDRAWN or POSTURE_BLACKOUT; version += 1"
          - "the parent InquiryTicket transitions AWAITING_APPROVAL -> DRAFTING with sla_due_at recomputed and version += 1"
      - from: APPROVED
        to: BLOCKED
        trigger: "system: cited disclosure withdrawn"
        actor: system
        preconditions:
          - "status == APPROVED and cited_disclosure_id points at a disclosure entering WITHDRAWN"
        side_effects:
          - "status = BLOCKED; blocked_reason = CITED_DISCLOSURE_WITHDRAWN; version += 1"
          - "the parent InquiryTicket transitions AWAITING_APPROVAL -> DRAFTING with sla_due_at recomputed and version += 1"
      - from: APPROVED
        to: SENT
        trigger: "POST /response-drafts/{id}/send"
        actor: IRAnalyst
        preconditions:
          - "status == APPROVED (else ERR_DRAFT_INVALID_STATE)"
          - "X-User-ID == author_user_id (else ERR_DRAFT_AUTHOR_MISMATCH)"
          - "Company.disclosure_posture != BLACKOUT (else ERR_DISCLOSURE_BLACKOUT)"
          - "when cited_disclosure_id != null: that Disclosure.status == PUBLISHED and Disclosure.version == pinned_disclosure_version (else ERR_PINNED_DISCLOSURE_STALE)"
        side_effects:
          - "status = SENT; version += 1"
          - "the parent InquiryTicket transitions AWAITING_APPROVAL -> ANSWERED, answered_at set, version += 1"
          - "the company recomputes open_inquiry_count and version += 1"

  - entity: Contact
    initial_state: NONE
    terminal_states: []
    note: |
      Contact carries TWO independent state dimensions on the same row, both moved only by
      POST /contacts/{id}/servicing: dimension A = model_access_status (NONE | GRANTED | REVOKED),
      dimension B = threat_level (NONE | WATCH | ELEVATED | CRITICAL). The dimensions never gate
      each other: a REVOKED analyst can still be escalated to CRITICAL, and a CRITICAL activist can
      still be granted model access. initial_state / terminal_states above describe dimension A.
    transitions:
      - from: "A:NONE"
        to: "A:GRANTED"
        trigger: "POST /contacts/{id}/servicing with action = GRANT_MODEL_ACCESS"
        actor: IRAdmin | DisclosureOfficer
        preconditions:
          - "contact_type == SELL_SIDE_ANALYST (else ERR_MODEL_ACCESS_NOT_ELIGIBLE)"
          - "nda_on_file == true (else ERR_NDA_REQUIRED)"
          - "Company.disclosure_posture != BLACKOUT (else ERR_DISCLOSURE_BLACKOUT)"
        side_effects:
          - "model_access_status = GRANTED; version += 1"
      - from: "A:GRANTED"
        to: "A:REVOKED"
        trigger: "POST /contacts/{id}/servicing with action = REVOKE_MODEL_ACCESS"
        actor: IRAdmin | DisclosureOfficer
        preconditions:
          - "model_access_status == GRANTED (else ERR_MODEL_ACCESS_NOT_ELIGIBLE)"
        side_effects:
          - "model_access_status = REVOKED; version += 1"
          - "already-ACCEPTED EstimateSubmission rows are left untouched but drop out of the consensus eligible set while model_access_status == REVOKED"
      - from: "A:REVOKED"
        to: "A:GRANTED"
        trigger: "POST /contacts/{id}/servicing with action = GRANT_MODEL_ACCESS"
        actor: IRAdmin | DisclosureOfficer
        preconditions:
          - "contact_type == SELL_SIDE_ANALYST"
          - "nda_on_file == true"
          - "Company.disclosure_posture != BLACKOUT"
        side_effects:
          - "model_access_status = GRANTED; version += 1"
        note: "Re-grant closes the GRANTED -> REVOKED -> GRANTED cycle on dimension A."
      - from: "B:any"
        to: "B:<threat_level>"
        trigger: "POST /contacts/{id}/servicing with action = SET_THREAT_LEVEL"
        actor: IRAdmin | DisclosureOfficer
        preconditions:
          - "threat_level is supplied and is one of {NONE, WATCH, ELEVATED, CRITICAL} (else ERR_INVALID_REQUEST)"
        side_effects:
          - "threat_level = supplied value; version += 1"
          - "link 2: the Company recomputes disclosure_posture per §1.3 company_disclosure_posture, sets posture_recomputed_at, version += 1"
          - "link 3 (only when the recompute lands on BLACKOUT): every ResponseDraft of that company in status IN_REVIEW with disclosure_class == MATERIAL_NONPUBLIC transitions to BLOCKED with blocked_reason = POSTURE_BLACKOUT, and each such draft's InquiryTicket transitions AWAITING_APPROVAL -> DRAFTING with sla_due_at recomputed"

  - entity: RoadshowEvent
    initial_state: PLANNING
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNING
        to: OPEN_FOR_REQUESTS
        trigger: "POST /roadshow-events/{id}/open-requests"
        actor: IRAdmin
        preconditions:
          - "status == PLANNING (else ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "status = OPEN_FOR_REQUESTS; version += 1"
      - from: OPEN_FOR_REQUESTS
        to: LOCKED
        trigger: "POST /roadshow-events/{id}/allocate"
        actor: IRAdmin
        preconditions:
          - "status == OPEN_FOR_REQUESTS (else ERR_EVENT_INVALID_STATE)"
          - "Company.disclosure_posture != BLACKOUT (else ERR_DISCLOSURE_BLACKOUT)"
          - "at least one MeetingRequest of this event is in status REQUESTED (else ERR_NO_PENDING_REQUESTS)"
        side_effects:
          - "every REQUESTED request is scored by §1.3 meeting_priority_score variant final and moved to ALLOCATED or WAITLISTED per §1.3 roadshow_allocation_run"
          - "allocated_count / waitlisted_count recomputed; status = LOCKED; version += 1"
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /roadshow-events/{id}/complete"
        actor: IRAdmin
        preconditions:
          - "status == LOCKED (else ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "link 1: status = COMPLETED; version += 1"
          - "link 2 (caused by link 1): every MeetingRequest of this event in status WAITLISTED transitions WAITLISTED -> DECLINED, version += 1 each"
          - "link 3 (caused by link 2): waitlisted_count = 0 and declined_count += the number of requests declined in link 2; request_ledger_total is unchanged (§1.3 event_request_ledger invariant holds)"

  - entity: MeetingRequest
    initial_state: REQUESTED
    terminal_states: [RELEASED, DECLINED]
    transitions:
      - from: REQUESTED
        to: ALLOCATED
        trigger: "POST /roadshow-events/{id}/allocate (winning branch)"
        actor: IRAdmin
        preconditions:
          - "final_priority_score >= MIN_ALLOCATION_SCORE (25)"
          - "the request's rank in the §1.3 roadshow_allocation_run ordering is <= remaining capacity_slots"
        side_effects:
          - "status = ALLOCATED; final_priority_score stored; allocated_at = logical clock now; promoted_from_waitlist = false; version += 1"
          - "RoadshowEvent.allocated_count += 1"
        note: "Fork branch A of the allocation run; the divergent branch B (WAITLISTED) stamps no allocated_at."
      - from: REQUESTED
        to: WAITLISTED
        trigger: "POST /roadshow-events/{id}/allocate (deferred branch)"
        actor: IRAdmin
        preconditions:
          - "final_priority_score < MIN_ALLOCATION_SCORE (25), OR the request's rank exceeds remaining capacity_slots"
        side_effects:
          - "status = WAITLISTED; final_priority_score stored; allocated_at stays null; version += 1"
          - "RoadshowEvent.waitlisted_count += 1"
        note: "Fork branch B; both branches re-join at RELEASED / DECLINED, and WAITLISTED can be promoted back into ALLOCATED."
      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /meeting-requests/{id}/release"
        actor: IRAdmin
        preconditions:
          - "status == ALLOCATED (else ERR_MEETING_REQUEST_NOT_ALLOCATED)"
          - "the parent RoadshowEvent.status == LOCKED (else ERR_EVENT_INVALID_STATE)"
          - "reason is a non-empty string (else ERR_INVALID_REQUEST)"
        side_effects:
          - "link 1: status = RELEASED; release_reason = reason; version += 1"
          - "link 2 (caused by link 1): RoadshowEvent.allocated_count -= 1, released_count += 1, version += 1 — one slot is now free"
          - "link 3 (caused by link 2, only while a free slot exists): the promotion selector of §1.3 roadshow_allocation_run picks the highest-ranked WAITLISTED request of the same event with final_priority_score >= MIN_ALLOCATION_SCORE and transitions it WAITLISTED -> ALLOCATED (promoted_from_waitlist = true, allocated_at = now), then RoadshowEvent.allocated_count += 1 and waitlisted_count -= 1"
        note: "Depth-3 transitive cascade from a different trigger than the disclosure-withdrawal chain."
      - from: WAITLISTED
        to: ALLOCATED
        trigger: "system: waitlist promotion during POST /meeting-requests/{id}/release"
        actor: system
        preconditions:
          - "status == WAITLISTED and final_priority_score >= MIN_ALLOCATION_SCORE (25)"
          - "the event has a free slot after the release (allocated_count < capacity_slots)"
          - "the request is the promotion selector's winner (§1.3 roadshow_allocation_run)"
        side_effects:
          - "status = ALLOCATED; promoted_from_waitlist = true; allocated_at = logical clock now; version += 1"
          - "RoadshowEvent.allocated_count += 1; waitlisted_count -= 1"
      - from: WAITLISTED
        to: DECLINED
        trigger: "system: POST /roadshow-events/{id}/complete"
        actor: system
        preconditions:
          - "status == WAITLISTED and the parent event is transitioning LOCKED -> COMPLETED"
        side_effects:
          - "status = DECLINED; version += 1"
          - "RoadshowEvent.waitlisted_count -= 1; declined_count += 1"

  - entity: TransferAgentInstruction
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /transfer-agent-instructions/{id}/acknowledge with decision = ACKNOWLEDGE"
        actor: TransferAgentLiaison
        preconditions:
          - "status == SUBMITTED (else ERR_INSTRUCTION_ALREADY_DECIDED)"
        side_effects:
          - "status = ACKNOWLEDGED; acknowledged_by_user_id = X-User-ID; version += 1"
          - "record-date snapshot taken: snapshot_holder_count = count of the company's Contact rows with contact_type IN {INSTITUTIONAL_HOLDER, RETAIL_HOLDER} and shares_held > 0; snapshot_shares_total = sum of those rows' shares_held"
        note: "Branch A of the acknowledge trigger; the snapshot is the record-date position used by the RESERVE_CAPPED variant."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /transfer-agent-instructions/{id}/acknowledge with decision = REJECT"
        actor: TransferAgentLiaison
        preconditions:
          - "status == SUBMITTED (else ERR_INSTRUCTION_ALREADY_DECIDED)"
          - "rejection_reason is a non-empty string (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = REJECTED; acknowledged_by_user_id = X-User-ID; decision_reason = rejection_reason; version += 1"
          - "NO snapshot is taken: snapshot_holder_count and snapshot_shares_total stay null (divergent branch)"
      - from: ACKNOWLEDGED
        to: EXECUTED
        trigger: "POST /transfer-agent-instructions/{id}/execute"
        actor: TransferAgentLiaison
        preconditions:
          - "status == ACKNOWLEDGED (else ERR_INSTRUCTION_NOT_ACKNOWLEDGED)"
          - "instruction_type == DIVIDEND_PAYMENT (else ERR_INSTRUCTION_TYPE_NOT_PAYABLE)"
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "logical clock now >= payable_date (else ERR_PAYABLE_DATE_NOT_REACHED)"
          - "total_payout_cents computed by §1.3 dividend_payout_ledger <= Company.dividend_reserve_cents (else ERR_DIVIDEND_RESERVE_INSUFFICIENT)"
        side_effects:
          - "payout_ledger and total_payout_cents written per §1.3 dividend_payout_ledger for the funding_mode variant; status = EXECUTED; executed_by_user_id = X-User-ID; executed_at = logical clock now; version += 1"
          - "Company.dividend_reserve_cents -= total_payout_cents; Company.dividend_paid_cents += total_payout_cents; Company.version += 1"
          - "each payout_ledger row credits Contact.dividend_received_cents += amount_cents on that holder and bumps that Contact.version += 1"
      - from: EXECUTED
        to: REVERSED
        trigger: "POST /transfer-agent-instructions/{id}/reverse"
        actor: TransferAgentLiaison
        preconditions:
          - "status == EXECUTED (else ERR_INSTRUCTION_NOT_EXECUTED)"
          - "logical clock now < executed_at + REVERSAL_WINDOW_HOURS (72) (else ERR_REVERSAL_WINDOW_EXPIRED)"
          - "reason is a non-empty string (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = REVERSED; decision_reason = reason; version += 1"
          - "compensation replays payout_ledger in reverse: Company.dividend_reserve_cents += total_payout_cents, Company.dividend_paid_cents -= total_payout_cents, Company.version += 1"
          - "each payout_ledger row debits Contact.dividend_received_cents -= amount_cents and bumps that Contact.version += 1; payout_ledger and total_payout_cents are retained for audit"
          - "invariant: dividend_reserve_cents + dividend_paid_cents and sum(Contact.dividend_received_cents) - Company.dividend_paid_cents both return to their pre-execution values (§1.3 dividend_cash_conservation)"

concurrency_rules:
  - rule_id: estimate-create-stale-contact
    parent_entity: Contact
    write_endpoint: "POST /estimates"
    occ_field: "expected_contact_version"
    description: |
      Submitting a consensus estimate against a Contact whose version has advanced since
      the client last observed it is rejected. A new submission for the same
      (contact, metric, period_label) legitimately supersedes the analyst's previous
      ACCEPTED row, so the write is refused only because the submitter's view of the
      analyst record is stale.
    error_id: ERR_STALE_CONTACT_VERSION
    http_status: 412
  - rule_id: position-update-stale-company
    parent_entity: Company
    write_endpoint: "PATCH /contacts/{id}/position"
    occ_field: "expected_company_version"
    description: |
      Recording a new share position supersedes the holder's prior position snapshot, and
      the resulting ownership_pct is only meaningful against the share count the client
      last read. A position write whose expected_company_version no longer matches the
      issuer row is refused as stale.
    error_id: ERR_STALE_COMPANY_VERSION
    http_status: 412
  - rule_id: draft-review-stale-inquiry
    parent_entity: InquiryTicket
    write_endpoint: "POST /response-drafts/{id}/review"
    occ_field: "expected_inquiry_version"
    description: |
      An inquiry may carry several successive drafts, and a review decision supersedes the
      inquiry's prior approval state. A review whose expected_inquiry_version no longer
      matches the inquiry row is refused because the reviewer's view of the inquiry has
      been overtaken by an earlier decision or cascade.
    error_id: ERR_STALE_INQUIRY_VERSION
    http_status: 412

calculations:
  - name: ownership_pct_and_target_tier
    trigger: "POST /contacts (creation), PATCH /contacts/{id}/position, and the record-date snapshot read path"
    algorithm: threshold
    formula: |
      ownership_pct = round_half_up(shares_held / Company.shares_outstanding * 100, 4)
      target_tier =
        TIER_1   if ownership_pct >= TIER_1_MIN_PCT   (5.0)
        TIER_2   if ownership_pct >= TIER_2_MIN_PCT   (1.0)
        TIER_3   if ownership_pct >  0
        UNTIERED if ownership_pct == 0
      # Boundaries are inclusive on the LOW side (>=): ownership_pct exactly 1.0 is TIER_2,
      # exactly 5.0 is TIER_1. 0.0 is UNTIERED, never TIER_3.
    input_set: "the single Contact row being written, against its Company.shares_outstanding as stored at write time"
    constants:
      TIER_1_MIN_PCT: 5.0
      TIER_2_MIN_PCT: 1.0
      OWNERSHIP_PCT_DECIMALS: 4
    precision: "ownership_pct: 4 decimal places, round_half_up; tier comparison uses the ROUNDED ownership_pct, not the raw quotient"
    variants: []

  - name: inquiry_sensitivity_score
    trigger: "POST /inquiries (frozen at intake; never recomputed afterwards)"
    algorithm: weighted_scoring
    formula: |
      base = { GUIDANCE: 40, MODEL_REQUEST: 30, PROXY: 20, DIVIDEND: 15, RECORD_DATE: 15, OTHER: 10 }[topic_category]
      nonpublic_term      = 25 if requests_nonpublic_detail else 0
      analyst_term        = 15 if Contact.contact_type == SELL_SIDE_ANALYST else 0
      activist_term       = 10 if Contact.activist_flag == true else 0
      followup_term       = 10 if linked_prior_inquiry_id != null AND that inquiry.status == ESCALATED else 0
      posture_term        = 20 if Company.disclosure_posture == BLACKOUT
                            else 10 if Company.disclosure_posture == RESTRICTED
                            else 0
      sensitivity_score = min(100, base + nonpublic_term + analyst_term + activist_term + followup_term + posture_term)
    input_set: "the submitting Contact row, the linked prior InquiryTicket (when supplied), and the Company.disclosure_posture value STORED at intake time"
    constants:
      SENSITIVITY_CAP: 100
      NONPUBLIC_TERM: 25
      ANALYST_TERM: 15
      ACTIVIST_TERM: 10
      ESCALATED_FOLLOWUP_TERM: 10
      POSTURE_BLACKOUT_TERM: 20
      POSTURE_RESTRICTED_TERM: 10
    precision: "integer arithmetic only; no rounding"
    variants: []

  - name: inquiry_routing_queue
    trigger: "POST /inquiries (initial selection) and POST /inquiries/{id}/route when a DisclosureOfficer supplies target_queue"
    algorithm: threshold
    formula: |
      # Evaluated top to bottom; the first matching clause wins.
      if topic_category IN {DIVIDEND, RECORD_DATE} AND sensitivity_score < TA_DESK_MAX_SENSITIVITY (50):
          routing_queue = TRANSFER_AGENT_DESK
      elif sensitivity_score >= DISCLOSURE_COMMITTEE_MIN_SENSITIVITY (60):
          routing_queue = DISCLOSURE_COMMITTEE
      elif Contact.contact_type == RETAIL_HOLDER:
          routing_queue = SHAREHOLDER_SERVICES
      else:
          routing_queue = IR_DESK
      # Override: on POST /inquiries/{id}/route a DisclosureOfficer may replace the selected
      # queue with any member of the enum; an IRAnalyst supplying target_queue is rejected
      # with ERR_QUEUE_OVERRIDE_FORBIDDEN. The automatic ESCALATED branch always sets
      # routing_queue = DISCLOSURE_COMMITTEE regardless of the clauses above.
    input_set: "the InquiryTicket's own topic_category and frozen sensitivity_score plus the submitting Contact.contact_type"
    constants:
      TA_DESK_MAX_SENSITIVITY: 50
      DISCLOSURE_COMMITTEE_MIN_SENSITIVITY: 60
      ESCALATION_THRESHOLD: 80
    precision: "integer comparisons; the 50 boundary is exclusive (< 50), the 60 and 80 boundaries are inclusive (>=)"
    variants: []

  - name: inquiry_sla_due_at
    trigger: "POST /inquiries, POST /inquiries/{id}/route, and every cascade that returns an inquiry to DRAFTING"
    algorithm: threshold
    formula: |
      SLA_HOURS = { DISCLOSURE_COMMITTEE: 48, IR_DESK: 72, TRANSFER_AGENT_DESK: 96, SHAREHOLDER_SERVICES: 120 }
      sla_due_at = logical_clock_now + SLA_HOURS[routing_queue] hours
    input_set: "the routing_queue in force AFTER the current write, and the logical clock at the moment of the write"
    constants:
      SLA_HOURS_DISCLOSURE_COMMITTEE: 48
      SLA_HOURS_IR_DESK: 72
      SLA_HOURS_TRANSFER_AGENT_DESK: 96
      SLA_HOURS_SHAREHOLDER_SERVICES: 120
    precision: "ISO 8601 UTC with exactly three fractional-second digits"
    variants: []

  - name: company_disclosure_posture
    trigger: "POST /companies/{id}/recompute-posture, POST /contacts/{id}/servicing with action = SET_THREAT_LEVEL, PATCH /contacts/{id}/position when it auto-escalates threat_level, and link 4 of the disclosure-withdrawal cascade"
    algorithm: constraint_propagation
    formula: |
      in_blackout_window = blackout_window_start != null
                           AND blackout_window_start <= logical_clock_now
                           AND logical_clock_now <  blackout_window_end        # half-open [start, end)
      activist_levels = { c.threat_level for Contact c where c.company_id == this.id AND c.activist_flag == true }
      disclosure_posture =
        BLACKOUT   if in_blackout_window OR CRITICAL IN activist_levels
        RESTRICTED elif ELEVATED IN activist_levels
        OPEN       otherwise
      posture_recomputed_at = logical_clock_now
    input_set: "the company's own blackout window versus the logical clock, plus every Contact of this company with activist_flag == true (threat_level of non-activist contacts is ignored entirely)"
    constants:
      POSTURE_VALUES: "OPEN | RESTRICTED | BLACKOUT"
    precision: "exact enum comparison; the window is half-open, so now == blackout_window_start is BLACKOUT and now == blackout_window_end is not"
    variants: []
    note: |
      disclosure_posture is a STORED field. Moving the logical clock does NOT refresh it; only the
      four triggers above do. Every gate (review, send, model access grant, allocation run, estimate
      intake) reads the stored value, so a clock move into the blackout window leaves the system
      OPEN until a recompute trigger fires.

  - name: company_open_inquiry_count
    trigger: "POST /inquiries, POST /response-drafts/{id}/send, and every cascade link that changes an InquiryTicket.status"
    algorithm: aggregation
    formula: |
      open_inquiry_count = count of InquiryTicket rows where
          company_id == this.id
          AND status IN {NEW, ROUTED, DRAFTING, AWAITING_APPROVAL, ESCALATED}
      # ANSWERED is the only status outside the open set. The count is a full recompute over
      # the company's inquiries on every trigger, never an incremental +/- delta.
    input_set: "all InquiryTicket rows of this company with no time window; ordering is irrelevant because the result is a count"
    constants:
      OPEN_STATUSES: "NEW | ROUTED | DRAFTING | AWAITING_APPROVAL | ESCALATED"
    precision: "integer count"
    variants: []

  - name: meeting_priority_score
    trigger: "POST /meeting-requests writes provisional_priority_score; POST /roadshow-events/{id}/allocate writes final_priority_score"
    algorithm: weighted_scoring
    formula: |
      tier_points   = { TIER_1: 50, TIER_2: 35, TIER_3: 20, UNTIERED: 5 }[Contact.target_tier]
      nda_bonus     = 8 if Contact.nda_on_file else 0
      engagement    = min(20, round_half_up(Contact.ownership_pct * 4, 2))
      activist_pen  = 15 if (Contact.activist_flag == true AND Contact.threat_level IN {ELEVATED, CRITICAL}) else 0
      type_mult     = { INSTITUTIONAL_HOLDER: 1.20, SELL_SIDE_ANALYST: 1.00, RETAIL_HOLDER: 0.60 }[Contact.contact_type]
      lead_bonus    = 0                                            # provisional variant
      score = round_half_up(max(0, (tier_points + nda_bonus + engagement + lead_bonus - activist_pen) * type_mult), 2)
      # Evaluation order is pinned: the additive terms (including lead_bonus) are summed FIRST,
      # the floor at 0 is applied to the product, and the single round_half_up(.,2) happens LAST.
      # engagement is rounded to 2 decimals BEFORE being summed.
    input_set: "the requesting Contact row as stored at the moment the variant runs, plus (final variant only) the requested slot start versus the logical clock"
    constants:
      TIER_POINTS_TIER_1: 50
      TIER_POINTS_TIER_2: 35
      TIER_POINTS_TIER_3: 20
      TIER_POINTS_UNTIERED: 5
      NDA_BONUS: 8
      ENGAGEMENT_CAP: 20
      ENGAGEMENT_MULTIPLIER: 4
      ACTIVIST_PENALTY: 15
      TYPE_MULT_INSTITUTIONAL_HOLDER: 1.20
      TYPE_MULT_SELL_SIDE_ANALYST: 1.00
      TYPE_MULT_RETAIL_HOLDER: 0.60
      LEAD_BONUS_LONG_DAYS: 14
      LEAD_BONUS_LONG: 5
      LEAD_BONUS_SHORT_DAYS: 7
      LEAD_BONUS_SHORT: 2
    precision: "2 decimal places, round_half_up, applied once to the final product"
    variants:
      - name: provisional
        when: "POST /meeting-requests — written to provisional_priority_score at intake"
        difference: "lead_bonus is always 0 and the Contact snapshot is the one in force at intake"
      - name: final
        when: "POST /roadshow-events/{id}/allocate — written to final_priority_score during the allocation run"
        difference: |
          lead_bonus = 5 if lead_time_days >= 14 else (2 if lead_time_days >= 7 else 0), where
          lead_time_days = floor((requested_slot_start - logical_clock_now) / 86400 seconds);
          the Contact snapshot is the one in force at allocation time, so a PATCH position or a
          SET_THREAT_LEVEL between intake and allocation makes final diverge from provisional
          for reasons other than the lead bonus.

  - name: roadshow_allocation_run
    trigger: "POST /roadshow-events/{id}/allocate (full run) and the promotion step of POST /meeting-requests/{id}/release (single winner)"
    algorithm: waterfall_allocation
    formula: |
      # ---- allocation run ----
      candidates = MeetingRequest rows where event_id == event.id AND status == REQUESTED
      for each candidate: final_priority_score = meeting_priority_score(variant=final)
      eligible   = [c for c in candidates if c.final_priority_score >= MIN_ALLOCATION_SCORE (25)]
      deferred   = [c for c in candidates if c.final_priority_score <  MIN_ALLOCATION_SCORE]     # threshold-deferred
      order eligible by:  final_priority_score DESC,
                          then Contact.shares_held DESC,
                          then MeetingRequest.created_at ASC          # never id
      remaining = event.capacity_slots - event.allocated_count
      first `remaining` rows of the ordered eligible list -> ALLOCATED
      every other eligible row and every deferred row     -> WAITLISTED
      # ---- promotion selector (release path) ----
      pool  = MeetingRequest rows where event_id == event.id
                                   AND status == WAITLISTED
                                   AND final_priority_score >= MIN_ALLOCATION_SCORE (25)
      rank  = final_priority_score DESC, then Contact.shares_held DESC, then created_at ASC
      winner = first row of rank when event.allocated_count < event.capacity_slots
      empty pool (or no free slot) -> no promotion happens, the release simply leaves the slot free
      # A threshold-deferred request (score < 25) is NEVER promoted, even when slots are free.
    input_set: "MeetingRequest rows of one event filtered to status == REQUESTED (run) or status == WAITLISTED (promotion); no time window applies"
    constants:
      MIN_ALLOCATION_SCORE: 25
    precision: "score comparisons use the stored 2-decimal final_priority_score; created_at compares at millisecond precision"
    variants: []

  - name: event_request_ledger
    trigger: "POST /meeting-requests, POST /roadshow-events/{id}/allocate, POST /meeting-requests/{id}/release, POST /roadshow-events/{id}/complete"
    algorithm: aggregation
    formula: |
      request_ledger_total = count of MeetingRequest rows where event_id == event.id      # monotonic, never decreases
      allocated_count      = count of those rows with status == ALLOCATED
      waitlisted_count     = count of those rows with status == WAITLISTED
      released_count       = count of those rows with status == RELEASED
      declined_count       = count of those rows with status == DECLINED
      # Conserved quantity (checked after every one of the four triggers):
      #   request_ledger_total
      #     == allocated_count + waitlisted_count + released_count + declined_count
      #        + count(status == REQUESTED)
      # and allocated_count <= capacity_slots at all times.
    input_set: "all MeetingRequest rows of the event, partitioned by status with no time window"
    constants: {}
    precision: "integer counts"
    variants: []

  - name: record_date_snapshot
    trigger: "POST /transfer-agent-instructions/{id}/acknowledge with decision = ACKNOWLEDGE"
    algorithm: aggregation
    formula: |
      snapshot_rows        = Contact rows where company_id == instruction.company_id
                                            AND contact_type IN {INSTITUTIONAL_HOLDER, RETAIL_HOLDER}
                                            AND shares_held > 0
      snapshot_holder_count = count(snapshot_rows)
      snapshot_shares_total = sum(snapshot_rows.shares_held)
      # SELL_SIDE_ANALYST rows are excluded even when shares_held > 0, and holders with
      # shares_held == 0 are excluded (the > 0 boundary is strict).
    input_set: "the company's Contact rows as stored at acknowledgement time; the snapshot is frozen and is NOT refreshed by later position changes"
    constants: {}
    precision: "integer counts and sums"
    variants: []

  - name: dividend_payout_ledger
    trigger: "POST /transfer-agent-instructions/{id}/execute"
    algorithm: tiered_pricing
    formula: |
      payees = Contact rows where company_id == instruction.company_id
                              AND contact_type IN {INSTITUTIONAL_HOLDER, RETAIL_HOLDER}
                              AND shares_held > 0                      # positions as of EXECUTION time
      order payees by created_at ASC                                   # ledger row order, never id
      effective_rate = declared_rate_cents_per_share                   # DECLARED_RATE variant
      for each payee:
          amount_cents = round_half_up(payee.shares_held * effective_rate, 0)    # PER-HOLDER round FIRST
          payout_ledger += { contact_id: payee.id, shares_held: payee.shares_held, amount_cents: amount_cents }
      total_payout_cents = sum(payout_ledger[].amount_cents)            # THEN sum
      # The rounding ORDER is pinned: round every holder's amount to whole cents and then add the
      # rounded amounts. Summing shares first and rounding once
      # (round_half_up(sum(shares) * effective_rate, 0)) is explicitly NOT the rule and yields a
      # different total (e.g. 333/667/1000 shares at 0.4567 c/share: 152+305+457 = 914 per-holder,
      # versus 913 if summed first).
    input_set: "Contact rows of the company with shares_held > 0 at execution time (NOT the acknowledgement snapshot), ordered by created_at ASC"
    constants:
      PAYOUT_DECIMALS: 0
      RATE_DECIMALS: 4
    precision: "amount_cents: whole cents, round_half_up per holder; effective_rate carries 4 decimals"
    variants:
      - name: declared_rate
        when: "funding_mode == DECLARED_RATE"
        difference: "effective_rate = declared_rate_cents_per_share exactly; if the resulting total_payout_cents exceeds Company.dividend_reserve_cents the execute is rejected with ERR_DIVIDEND_RESERVE_INSUFFICIENT and nothing is written"
      - name: reserve_capped
        when: "funding_mode == RESERVE_CAPPED"
        difference: |
          effective_rate = floor(Company.dividend_reserve_cents / instruction.snapshot_shares_total * 10000) / 10000
          (4-decimal FLOOR, using the acknowledgement snapshot's share total as denominator while the
          per-holder amounts use execution-time positions). declared_rate_cents_per_share is ignored.
          The reserve sufficiency check still runs on the resulting total, so a position increase
          between acknowledgement and execution can still trip ERR_DIVIDEND_RESERVE_INSUFFICIENT.

  - name: dividend_cash_conservation
    trigger: "asserted after POST /transfer-agent-instructions/{id}/execute and after POST /transfer-agent-instructions/{id}/reverse"
    algorithm: aggregation
    formula: |
      # Named conserved quantity: total issuer dividend cash.
      total_dividend_cash = Company.dividend_reserve_cents + Company.dividend_paid_cents
      # invariant 1: total_dividend_cash is identical before execute, after execute and after reverse
      # invariant 2: sum over the company's Contact rows of dividend_received_cents == Company.dividend_paid_cents
      # execute:  reserve -= T, paid += T, each ledger row's holder += amount_cents   (sum of amounts == T)
      # reverse:  reserve += T, paid -= T, each ledger row's holder -= amount_cents   (same T, same rows)
      # Because reverse replays the STORED payout_ledger rather than recomputing amounts from
      # current positions, no rounding drift can appear even if shares_held changed after execution.
    input_set: "the Company row plus every Contact row named in the instruction's payout_ledger"
    constants: {}
    precision: "whole cents, exact integer arithmetic"
    variants: []

  - name: consensus_estimate
    trigger: "GET /companies/{id}/consensus"
    algorithm: aggregation
    formula: |
      # ---- step 1: eligible set (order of filters is irrelevant, the predicate is a conjunction) ----
      eligible = EstimateSubmission rows e where
          e.status == ACCEPTED
          AND Contact(e.contact_id).company_id == company.id
          AND Contact(e.contact_id).contact_type == SELL_SIDE_ANALYST
          AND Contact(e.contact_id).coverage_status == INITIATED
          AND Contact(e.contact_id).model_access_status != REVOKED
          AND e.metric == requested metric
          AND e.period_label == requested period_label
          AND e.submitted_at >= logical_clock_now - ESTIMATE_STALENESS_DAYS (90) days   # inclusive lower bound
      if eligible is empty -> ERR_NO_ELIGIBLE_ESTIMATES (409); no partial payload is returned
      # ---- step 2: simple mean ----
      simple_mean = round_half_up(sum(eligible.value) / count(eligible), 4)
      # ---- step 3: band anchor (evaluation order is pinned; there is NO iteration) ----
      guidance = the Disclosure row with company_id == company.id, status == PUBLISHED,
                 is_guidance == true, metric == requested metric, period_label == requested period_label
                 (at most one such row can exist because publishing supersedes the previous one)
      if guidance exists:
          band_low  = round_half_up(guidance.guidance_low  * (1 - OUTLIER_BAND_PCT), 4)
          band_high = round_half_up(guidance.guidance_high * (1 + OUTLIER_BAND_PCT), 4)
      else:
          band_low  = round_half_up(simple_mean * (1 - OUTLIER_BAND_PCT), 4)
          band_high = round_half_up(simple_mean * (1 + OUTLIER_BAND_PCT), 4)
      # The band is computed ONCE from the values above. Removing outliers changes the mean, but the
      # band is NEVER recomputed from the trimmed mean — the dependency looks circular and is broken
      # by this pinned order.
      # ---- step 4: trim ----
      kept    = [e for e in eligible if band_low <= e.value <= band_high]     # both bounds inclusive
      outlier_excluded_count = count(eligible) - count(kept)
      if kept is empty:
          anchored_mean = simple_mean ; trimmed_applied = false
      else:
          anchored_mean = round_half_up(sum(kept.value) / count(kept), 4) ; trimmed_applied = true
      # ---- step 5: reported values ----
      consensus_mean = simple_mean if requested variant == SIMPLE else anchored_mean
      dispersion_pct = null if (kept is empty OR consensus_mean == 0)
                       else round_half_up((max(kept.value) - min(kept.value)) / consensus_mean * 100, 2)
    input_set: "EstimateSubmission rows joined to their Contact, filtered to status == ACCEPTED, analyst eligibility, matching metric+period_label and the 90-day submission window; SUPERSEDED rows and rows from REVOKED / non-INITIATED analysts are excluded"
    constants:
      ESTIMATE_STALENESS_DAYS: 90
      OUTLIER_BAND_PCT: 0.15
      MEAN_DECIMALS: 4
      DISPERSION_DECIMALS: 2
    precision: "means: 4 decimals round_half_up; dispersion_pct: 2 decimals round_half_up"
    variants:
      - name: simple_mean
        when: "query parameter variant = SIMPLE"
        difference: "consensus_mean is the untrimmed mean over the whole eligible set; outliers are still counted and reported but do not move the number"
      - name: guidance_anchored_trimmed_mean
        when: "query parameter variant omitted or = ANCHORED (default)"
        difference: "consensus_mean is the mean over `kept` after removing values outside the guidance-anchored (or, absent guidance, simple-mean-anchored) +/-15% band; for identical inputs this diverges from simple_mean whenever outlier_excluded_count > 0"

  - name: activist_stake_escalation
    trigger: "PATCH /contacts/{id}/position"
    algorithm: threshold
    formula: |
      after ownership_pct_and_target_tier has run on the patched Contact:
      if Contact.activist_flag == true
         AND Contact.ownership_pct >= ACTIVIST_STAKE_THRESHOLD_PCT (5.0)
         AND Contact.threat_level IN {NONE, WATCH}:
            Contact.threat_level = ELEVATED
            -> then Company.disclosure_posture is recomputed (§1.3 company_disclosure_posture)
      # No automatic de-escalation: a position sold back below 5.0% leaves threat_level where it is;
      # only POST /contacts/{id}/servicing with action = SET_THREAT_LEVEL can lower it.
    input_set: "the single patched Contact row after its ownership_pct has been recomputed"
    constants:
      ACTIVIST_STAKE_THRESHOLD_PCT: 5.0
    precision: "comparison uses the 4-decimal rounded ownership_pct; the 5.0 boundary is inclusive"
    variants: []

# Priority numbers are strictly ordered: when one request violates several rules, the rule with
# the LOWEST priority number decides the response. Several rules may share a priority number only
# when they are mutually exclusive by construction (e.g. two different NOT_FOUND entities, or two
# state checks on different entity types), so the shared number never creates ambiguity.
validations:
  # ---- 1-3: envelope-level checks -------------------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the role in X-User-Role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body / query parameters parse, all required fields are present and non-null, enum values are members of the declared enum, numeric fields are non-negative, shares_held and capacity_slots are integers, window_start < window_end, guidance_low <= guidance_high, string reasons are non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  # ---- 4-5: existence, path resources left-to-right then body foreign keys ---------------------
  - priority: 4
    category: existence
    check: "the Company named by a path segment exists"
    error_id: ERR_COMPANY_NOT_FOUND
    http_status: 404
    applies_to: "GET /companies/{id}, POST /companies/{id}/recompute-posture, GET /companies/{id}/consensus"
  - priority: 4
    category: existence
    check: "the Contact named by a path segment exists"
    error_id: ERR_CONTACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /contacts/{id}, PATCH /contacts/{id}/position, POST /contacts/{id}/servicing, GET /contacts/{id}/estimates"
  - priority: 4
    category: existence
    check: "the Disclosure named by a path segment exists"
    error_id: ERR_DISCLOSURE_NOT_FOUND
    http_status: 404
    applies_to: "GET /disclosures/{id}, POST /disclosures/{id}/publish, POST /disclosures/{id}/withdraw"
  - priority: 4
    category: existence
    check: "the InquiryTicket named by a path segment exists"
    error_id: ERR_INQUIRY_NOT_FOUND
    http_status: 404
    applies_to: "GET /inquiries/{id}, POST /inquiries/{id}/route"
  - priority: 4
    category: existence
    check: "the ResponseDraft named by a path segment exists"
    error_id: ERR_RESPONSE_DRAFT_NOT_FOUND
    http_status: 404
    applies_to: "GET /response-drafts/{id}, POST /response-drafts/{id}/submit-review, POST /response-drafts/{id}/review, POST /response-drafts/{id}/revise, POST /response-drafts/{id}/send"
  - priority: 4
    category: existence
    check: "the RoadshowEvent named by a path segment exists"
    error_id: ERR_ROADSHOW_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /roadshow-events/{id}, POST /roadshow-events/{id}/open-requests, POST /roadshow-events/{id}/allocate, POST /roadshow-events/{id}/complete"
  - priority: 4
    category: existence
    check: "the MeetingRequest named by a path segment exists"
    error_id: ERR_MEETING_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /meeting-requests/{id}, POST /meeting-requests/{id}/release"
  - priority: 4
    category: existence
    check: "the TransferAgentInstruction named by a path segment exists"
    error_id: ERR_INSTRUCTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /transfer-agent-instructions/{id}, POST /transfer-agent-instructions/{id}/acknowledge, POST /transfer-agent-instructions/{id}/execute, POST /transfer-agent-instructions/{id}/reverse"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, checked in body-field declaration order (company_id, then contact_id, then event_id, then inquiry_id, then cited_disclosure_id, then linked_prior_inquiry_id)"
    error_id: ERR_CONTACT_NOT_FOUND
    http_status: 404
    applies_to: "POST /contacts, POST /disclosures, POST /inquiries, POST /response-drafts, POST /estimates, POST /roadshow-events, POST /meeting-requests, POST /transfer-agent-instructions — the returned error_id is the NOT_FOUND code of whichever referenced entity is missing (ERR_COMPANY_NOT_FOUND, ERR_CONTACT_NOT_FOUND, ERR_DISCLOSURE_NOT_FOUND, ERR_INQUIRY_NOT_FOUND, ERR_ROADSHOW_EVENT_NOT_FOUND)"

  # ---- 6: acting-identity ownership for the entity-backed Investor role -----------------------
  - priority: 6
    category: auth
    check: "when X-User-Role == Investor, X-User-ID must equal the contact_id carried in the request body (POST /estimates, POST /meeting-requests) or the Contact that owns the addressed resource (GET /contacts/{id}, GET /contacts/{id}/estimates); acting on another Contact's behalf is refused"
    error_id: ERR_CONTACT_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /estimates, POST /meeting-requests, GET /contacts/{id}, GET /contacts/{id}/estimates"

  # ---- 7: optimistic concurrency (§1.2.1) -----------------------------------------------------
  - priority: 7
    category: state
    check: "expected_contact_version equals the current Contact.version"
    error_id: ERR_STALE_CONTACT_VERSION
    http_status: 412
    applies_to: "POST /estimates"
  - priority: 7
    category: state
    check: "expected_company_version equals the current Company.version"
    error_id: ERR_STALE_COMPANY_VERSION
    http_status: 412
    applies_to: "PATCH /contacts/{id}/position"
  - priority: 7
    category: state
    check: "expected_inquiry_version equals the current InquiryTicket.version of the draft's parent inquiry"
    error_id: ERR_STALE_INQUIRY_VERSION
    http_status: 412
    applies_to: "POST /response-drafts/{id}/review"

  # ---- 8: own-state preconditions of the addressed resource -----------------------------------
  - priority: 8
    category: state
    check: "the Disclosure is in the state the transition requires (DRAFT for publish; DRAFT or PUBLISHED for withdraw)"
    error_id: ERR_DISCLOSURE_INVALID_STATE
    http_status: 409
    applies_to: "POST /disclosures/{id}/publish, POST /disclosures/{id}/withdraw"
  - priority: 8
    category: state
    check: "the InquiryTicket is in NEW or ESCALATED when routed, and in ROUTED or DRAFTING when a ResponseDraft is created against it (a DRAFTING inquiry whose only draft is BLOCKED may receive a fresh draft; the active-draft rule at priority 12 catches the case where a live draft still exists)"
    error_id: ERR_INQUIRY_INVALID_STATE
    http_status: 409
    applies_to: "POST /inquiries/{id}/route, POST /response-drafts"
  - priority: 8
    category: state
    check: "the ResponseDraft is in the state the transition requires (DRAFT for submit-review; IN_REVIEW for review; CHANGES_REQUESTED or BLOCKED for revise; APPROVED for send)"
    error_id: ERR_DRAFT_INVALID_STATE
    http_status: 409
    applies_to: "POST /response-drafts/{id}/submit-review, POST /response-drafts/{id}/review, POST /response-drafts/{id}/revise, POST /response-drafts/{id}/send"
  - priority: 8
    category: state
    check: "the RoadshowEvent is in the state the transition requires (PLANNING for open-requests; OPEN_FOR_REQUESTS for allocate; LOCKED for complete and for release of one of its requests)"
    error_id: ERR_EVENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /roadshow-events/{id}/open-requests, POST /roadshow-events/{id}/allocate, POST /roadshow-events/{id}/complete, POST /meeting-requests/{id}/release"
  - priority: 8
    category: state
    check: "the MeetingRequest is ALLOCATED when released"
    error_id: ERR_MEETING_REQUEST_NOT_ALLOCATED
    http_status: 409
    applies_to: "POST /meeting-requests/{id}/release"
  - priority: 8
    category: state
    check: "the TransferAgentInstruction is still SUBMITTED when acknowledged or rejected"
    error_id: ERR_INSTRUCTION_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /transfer-agent-instructions/{id}/acknowledge"
  - priority: 8
    category: state
    check: "the TransferAgentInstruction is ACKNOWLEDGED when executed"
    error_id: ERR_INSTRUCTION_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /transfer-agent-instructions/{id}/execute"
  - priority: 8
    category: state
    check: "the TransferAgentInstruction is EXECUTED when reversed"
    error_id: ERR_INSTRUCTION_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /transfer-agent-instructions/{id}/reverse"

  # ---- 9: cross-entity referential state ------------------------------------------------------
  - priority: 9
    category: business_referential
    check: "the referenced Contact belongs to the same Company as the referenced RoadshowEvent / InquiryTicket / Disclosure"
    error_id: ERR_CONTACT_COMPANY_MISMATCH
    http_status: 422
    applies_to: "POST /inquiries, POST /meeting-requests, POST /estimates"
  - priority: 9
    category: business_referential
    check: "the parent RoadshowEvent is OPEN_FOR_REQUESTS when a MeetingRequest is created against it"
    error_id: ERR_EVENT_NOT_OPEN_FOR_REQUESTS
    http_status: 409
    applies_to: "POST /meeting-requests"
  - priority: 9
    category: business_referential
    check: "a cited Disclosure must be in status PUBLISHED at submit-review and at review time; a draft whose disclosure_class == GUIDANCE_REPEAT must carry a cited_disclosure_id"
    error_id: ERR_CITATION_REQUIRED
    http_status: 422
    applies_to: "POST /response-drafts/{id}/submit-review, POST /response-drafts/{id}/review"
  - priority: 9
    category: business_referential
    check: "at send time the cited Disclosure is still PUBLISHED and its version still equals the draft's pinned_disclosure_version captured at approval"
    error_id: ERR_PINNED_DISCLOSURE_STALE
    http_status: 409
    applies_to: "POST /response-drafts/{id}/send"

  # ---- 10: segregation of duties and authorship (business_safety) -----------------------------
  - priority: 10
    category: business_safety
    check: "the reviewing user differs from the draft's author_user_id; the executing user differs from the instruction's submitted_by_user_id; the acknowledging user differs from the instruction's submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /response-drafts/{id}/review, POST /transfer-agent-instructions/{id}/acknowledge, POST /transfer-agent-instructions/{id}/execute"
  - priority: 10
    category: business_safety
    check: "only the draft's author_user_id may submit it for review, revise it or send it"
    error_id: ERR_DRAFT_AUTHOR_MISMATCH
    http_status: 403
    applies_to: "POST /response-drafts/{id}/submit-review, POST /response-drafts/{id}/revise, POST /response-drafts/{id}/send"
  - priority: 10
    category: business_safety
    check: "target_queue may only be supplied by a DisclosureOfficer; an IRAnalyst supplying target_queue is refused even though the endpoint itself is open to IRAnalyst"
    error_id: ERR_QUEUE_OVERRIDE_FORBIDDEN
    http_status: 403
    applies_to: "POST /inquiries/{id}/route"

  # ---- 11: disclosure-boundary and access gates (business_safety) -----------------------------
  - priority: 11
    category: business_safety
    check: "Company.disclosure_posture must not be BLACKOUT for draft approval, draft send, roadshow allocation or a model-access grant"
    error_id: ERR_DISCLOSURE_BLACKOUT
    http_status: 409
    applies_to: "POST /response-drafts/{id}/review, POST /response-drafts/{id}/send, POST /roadshow-events/{id}/allocate, POST /contacts/{id}/servicing"
  - priority: 11
    category: business_safety
    check: "a ResponseDraft classified MATERIAL_NONPUBLIC can never be approved; the disclosure boundary refuses selective disclosure regardless of posture"
    error_id: ERR_SELECTIVE_DISCLOSURE_BLOCKED
    http_status: 422
    applies_to: "POST /response-drafts/{id}/review"
  - priority: 11
    category: business_safety
    check: "GRANT_MODEL_ACCESS requires nda_on_file == true on the target Contact"
    error_id: ERR_NDA_REQUIRED
    http_status: 422
    applies_to: "POST /contacts/{id}/servicing"
  - priority: 11
    category: business_safety
    check: "GRANT_MODEL_ACCESS requires contact_type == SELL_SIDE_ANALYST; REVOKE_MODEL_ACCESS requires model_access_status == GRANTED"
    error_id: ERR_MODEL_ACCESS_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /contacts/{id}/servicing"
  - priority: 11
    category: business_safety
    check: "the submitting Contact's model_access_status is GRANTED when an estimate is submitted"
    error_id: ERR_MODEL_ACCESS_REQUIRED
    http_status: 403
    applies_to: "POST /estimates"
  - priority: 11
    category: business_safety
    check: "the submitting Contact is a SELL_SIDE_ANALYST whose coverage_status == INITIATED when an estimate is submitted"
    error_id: ERR_COVERAGE_NOT_INITIATED
    http_status: 422
    applies_to: "POST /estimates"

  # ---- 12: uniqueness -------------------------------------------------------------------------
  - priority: 12
    category: business_constraint
    check: "Company.ticker is unique across all companies"
    error_id: ERR_DUPLICATE_TICKER
    http_status: 409
    applies_to: "POST /companies"
  - priority: 12
    category: business_constraint
    check: "Disclosure.fact_key is unique per company among rows with status IN {DRAFT, PUBLISHED}; a SUPERSEDED or WITHDRAWN row releases its fact_key"
    error_id: ERR_DUPLICATE_FACT_KEY
    http_status: 409
    applies_to: "POST /disclosures"
  - priority: 12
    category: business_constraint
    check: "an InquiryTicket may have at most one ResponseDraft in status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED}"
    error_id: ERR_ACTIVE_DRAFT_EXISTS
    http_status: 409
    applies_to: "POST /response-drafts"

  # ---- 13: temporal validity ------------------------------------------------------------------
  - priority: 13
    category: business_temporal
    check: "requested_slot_start >= event.window_start AND requested_slot_end <= event.window_end (half-open slot [start, end) fully inside the closed event window)"
    error_id: ERR_SLOT_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /meeting-requests"
  - priority: 13
    category: business_temporal
    check: "(requested_slot_end - requested_slot_start) in minutes equals the event's slot_minutes exactly"
    error_id: ERR_SLOT_DURATION_INVALID
    http_status: 422
    applies_to: "POST /meeting-requests"
  - priority: 13
    category: business_temporal
    check: "record_date >= the logical clock's current date for a RECORD_DATE_SET or DIVIDEND_PAYMENT instruction"
    error_id: ERR_RECORD_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /transfer-agent-instructions"
  - priority: 13
    category: business_temporal
    check: "payable_date >= record_date + MIN_PAYABLE_LAG_DAYS (10) for a DIVIDEND_PAYMENT instruction"
    error_id: ERR_PAYABLE_DATE_TOO_EARLY
    http_status: 422
    applies_to: "POST /transfer-agent-instructions"
  - priority: 13
    category: business_temporal
    check: "the logical clock has reached payable_date (inclusive, comparing dates) before a dividend instruction is executed"
    error_id: ERR_PAYABLE_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /transfer-agent-instructions/{id}/execute"
  - priority: 13
    category: business_temporal
    check: "the logical clock is strictly before executed_at + REVERSAL_WINDOW_HOURS (72) when an executed instruction is reversed"
    error_id: ERR_REVERSAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /transfer-agent-instructions/{id}/reverse"

  # ---- 14: resource / interval overlap --------------------------------------------------------
  - priority: 14
    category: business_constraint
    check: |
      the requesting Contact has no other MeetingRequest in status IN {REQUESTED, ALLOCATED, WAITLISTED}
      whose buffered interval overlaps the new one. Both intervals are half-open and the stored
      interval is padded by CONTACT_BUFFER_MINUTES (30) on each side:
      overlap when new_start < stored_end + 30min AND stored_start - 30min < new_end.
      A gap of exactly 30 minutes therefore does NOT overlap; 29 minutes does.
    error_id: ERR_CONTACT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /meeting-requests"
  - priority: 14
    category: business_constraint
    check: |
      the Company has no other TransferAgentInstruction with instruction_type == DIVIDEND_PAYMENT and
      status IN {SUBMITTED, ACKNOWLEDGED, EXECUTED} whose dividend cycle overlaps the new one. Cycles
      are CLOSED date intervals [record_date, payable_date] and overlap is date-inclusive:
      new_record_date <= stored_payable_date AND stored_record_date <= new_payable_date.
      A new record_date exactly equal to a stored payable_date therefore DOES collide — the opposite
      semantics from the half-open meeting-slot rule.
    error_id: ERR_DIVIDEND_CYCLE_OVERLAP
    http_status: 409
    applies_to: "POST /transfer-agent-instructions"

  # ---- 15: revision limit ---------------------------------------------------------------------
  - priority: 15
    category: business_constraint
    check: "revision_round < MAX_REVISION_ROUNDS (3) when a CHANGES_REQUESTED or BLOCKED draft is revised"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /response-drafts/{id}/revise"

  # ---- 16: aggregate / collective checks ------------------------------------------------------
  - priority: 16
    category: business_constraint
    check: "after the patch, the sum of shares_held over the company's Contact rows with contact_type IN {INSTITUTIONAL_HOLDER, RETAIL_HOLDER} must not exceed Company.shares_outstanding — each individual position may be legal while the collective total is not"
    error_id: ERR_SHARES_EXCEED_OUTSTANDING
    http_status: 422
    applies_to: "PATCH /contacts/{id}/position"
  - priority: 16
    category: business_constraint
    check: "the event has at least one MeetingRequest in status REQUESTED when an allocation run is triggered"
    error_id: ERR_NO_PENDING_REQUESTS
    http_status: 409
    applies_to: "POST /roadshow-events/{id}/allocate"
  - priority: 16
    category: business_constraint
    check: "at least one EstimateSubmission survives the §1.3 consensus_estimate eligible-set filter for the requested metric and period_label"
    error_id: ERR_NO_ELIGIBLE_ESTIMATES
    http_status: 409
    applies_to: "GET /companies/{id}/consensus"

  # ---- 17: fiscal checks, last -----------------------------------------------------------------
  - priority: 17
    category: business_fiscal
    check: "instruction_type == DIVIDEND_PAYMENT when an instruction is executed; RECORD_DATE_SET and RECORD_INQUIRY instructions are complete at ACKNOWLEDGED and have no payout step"
    error_id: ERR_INSTRUCTION_TYPE_NOT_PAYABLE
    http_status: 422
    applies_to: "POST /transfer-agent-instructions/{id}/execute"
  - priority: 17
    category: business_fiscal
    check: "the total_payout_cents computed for the instruction's funding_mode variant is <= Company.dividend_reserve_cents; nothing is written when the reserve is short"
    error_id: ERR_DIVIDEND_RESERVE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /transfer-agent-instructions/{id}/execute"

endpoints:
  # ---- logical clock (test-driving endpoint, /_ namespace) --------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every deadline, window, staleness and overlap rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [IRAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["sets the logical clock; no entity is mutated and no recomputation is triggered"]

  # ---- Company ---------------------------------------------------------------------------------
  - method: POST
    path: "/companies"
    description: "Registers an issuer with its share count, dividend reserve and optional quiet-period (blackout) window."
    roles: [IRAdmin]
    code: 201
    input: ["ticker", "legal_name", "shares_outstanding", "dividend_reserve_cents?", "blackout_window_start?", "blackout_window_end?"]
    output: Company
    side_effects:
      - "computes disclosure_posture per §1.3 company_disclosure_posture and stamps posture_recomputed_at"
      - "open_inquiry_count = 0; dividend_paid_cents = 0; version = 1"
  - method: GET
    path: "/companies/{id}"
    description: "Reads one issuer including its stored disclosure_posture, open_inquiry_count and dividend ledger fields."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer, TransferAgentLiaison, Investor]
    code: 200
    input: []
    output: Company
    side_effects: []
  - method: GET
    path: "/companies"
    description: "Lists issuers with optional filters and offset pagination."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer, TransferAgentLiaison]
    code: 200
    input: ["ticker?", "disclosure_posture?", "limit?", "offset?"]
    output: Company[]
    side_effects: []
  - method: POST
    path: "/companies/{id}/recompute-posture"
    description: "Operator-triggered refresh of the stored disclosure_posture and open_inquiry_count — the only way to make a blackout window that the logical clock has since entered or left take effect without another business write."
    roles: [IRAdmin, DisclosureOfficer]
    code: 200
    input: []
    output: Company
    side_effects:
      - "recomputes disclosure_posture per §1.3 company_disclosure_posture and open_inquiry_count per §1.3 company_open_inquiry_count"
      - "sets posture_recomputed_at = logical clock now; increments Company.version by 1"
      - "when the recompute lands on BLACKOUT: every ResponseDraft of this company in status IN_REVIEW with disclosure_class == MATERIAL_NONPUBLIC transitions to BLOCKED (blocked_reason = POSTURE_BLACKOUT) and each such draft's InquiryTicket transitions AWAITING_APPROVAL -> DRAFTING with sla_due_at recomputed"
  - method: GET
    path: "/companies/{id}/consensus"
    description: "Computed read: the sell-side consensus for one metric and period, in either the SIMPLE or the guidance-anchored trimmed variant (§1.3 consensus_estimate)."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer]
    code: 200
    input: ["metric", "period_label", "variant?"]
    output: { company_id: string, metric: string, period_label: string, variant: string, eligible_count: integer, outlier_excluded_count: integer, guidance_anchored: boolean, band_low: number, band_high: number, simple_mean: number, consensus_mean: number, trimmed_applied: boolean, dispersion_pct: number }
    side_effects: ["none — read-only; no version is incremented"]

  # ---- Contact ---------------------------------------------------------------------------------
  - method: POST
    path: "/contacts"
    description: "Adds a shareholder, retail holder or sell-side analyst to an issuer's register / coverage list."
    roles: [IRAdmin]
    code: 201
    input: ["company_id", "contact_type", "display_name", "email", "shares_held?", "nda_on_file?", "coverage_status?", "activist_flag?"]
    output: Contact
    side_effects:
      - "computes ownership_pct and target_tier per §1.3 ownership_pct_and_target_tier"
      - "model_access_status = NONE; threat_level = NONE; dividend_received_cents = 0; version = 1"
  - method: GET
    path: "/contacts/{id}"
    description: "Reads one contact including ownership_pct, target_tier, model_access_status and threat_level."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer, TransferAgentLiaison, Investor]
    code: 200
    input: []
    output: Contact
    side_effects: []
  - method: GET
    path: "/contacts"
    description: "Lists contacts, filtered by issuer, type, target tier, coverage or activist flag — the targeting / ownership-analysis surface."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer, TransferAgentLiaison]
    code: 200
    input: ["company_id?", "contact_type?", "target_tier?", "coverage_status?", "activist_flag?", "limit?", "offset?"]
    output: Contact[]
    side_effects: []
  - method: PATCH
    path: "/contacts/{id}/position"
    description: "Records a new share position for a holder, re-deriving ownership tiering and the issuer's disclosure posture. Guarded by OCC on the issuer (§1.2.1 position-update-stale-company)."
    roles: [IRAdmin]
    code: 200
    input: ["shares_held", "expected_company_version"]
    output: Contact
    side_effects:
      - "shares_held replaced; ownership_pct and target_tier recomputed per §1.3 ownership_pct_and_target_tier"
      - "§1.3 activist_stake_escalation may raise threat_level to ELEVATED"
      - "recomputes Company.disclosure_posture and stamps posture_recomputed_at; increments Company.version by 1"
      - "increments Contact.version by 1"
  - method: POST
    path: "/contacts/{id}/servicing"
    description: "Shareholder-services action on one contact: GRANT_MODEL_ACCESS, REVOKE_MODEL_ACCESS or SET_THREAT_LEVEL. The two access actions move state dimension A, SET_THREAT_LEVEL moves dimension B."
    roles: [IRAdmin, DisclosureOfficer]
    code: 200
    input: ["action", "threat_level?"]
    output: Contact
    side_effects:
      - "GRANT_MODEL_ACCESS / REVOKE_MODEL_ACCESS: model_access_status updated; increments Contact.version by 1"
      - "SET_THREAT_LEVEL: threat_level updated; increments Contact.version by 1; recomputes Company.disclosure_posture (increments Company.version by 1) and, when the recompute lands on BLACKOUT, blocks MATERIAL_NONPUBLIC drafts in IN_REVIEW and rewinds their inquiries to DRAFTING"
  - method: GET
    path: "/contacts/{id}/estimates"
    description: "Sub-resource listing of every estimate an analyst has submitted, including SUPERSEDED rows."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer, Investor]
    code: 200
    input: ["metric?", "period_label?", "status?", "limit?", "offset?"]
    output: EstimateSubmission[]
    side_effects: []
  - method: POST
    path: "/estimates"
    description: "An analyst files a consensus estimate for one metric and period; the filing supersedes that analyst's previous accepted estimate for the same metric and period. Guarded by OCC on the analyst contact (§1.2.1 estimate-create-stale-contact)."
    roles: [Investor]
    code: 201
    input: ["contact_id", "metric", "period_label", "value", "expected_contact_version"]
    output: EstimateSubmission
    side_effects:
      - "status = ACCEPTED; submitted_at = logical clock now"
      - "any prior EstimateSubmission of the same contact with the same metric and period_label and status == ACCEPTED transitions to SUPERSEDED"
      - "increments Contact.version by 1"

  # ---- Disclosure ------------------------------------------------------------------------------
  - method: POST
    path: "/disclosures"
    description: "Drafts an earnings release, guidance update, press release or 8-K item for an issuer."
    roles: [DisclosureOfficer]
    code: 201
    input: ["company_id", "disclosure_type", "fact_key", "metric?", "period_label?", "guidance_low?", "guidance_high?", "is_guidance?"]
    output: Disclosure
    side_effects: ["status = DRAFT; published_at = null; version = 1"]
  - method: GET
    path: "/disclosures/{id}"
    description: "Reads one disclosure with its status, guidance band and version (the value drafts pin at approval)."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer, Investor]
    code: 200
    input: []
    output: Disclosure
    side_effects: []
  - method: GET
    path: "/disclosures"
    description: "Lists disclosures for an issuer, filtered by status, metric, period or guidance flag — the public-domain lookup a draft author cites from."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer]
    code: 200
    input: ["company_id?", "status?", "disclosure_type?", "metric?", "period_label?", "is_guidance?", "limit?", "offset?"]
    output: Disclosure[]
    side_effects: []
  - method: POST
    path: "/disclosures/{id}/publish"
    description: "Publishes a drafted disclosure, superseding the previous published guidance for the same metric and period."
    roles: [DisclosureOfficer]
    code: 200
    input: []
    output: Disclosure
    side_effects:
      - "status = PUBLISHED; published_at = logical clock now; increments Disclosure.version by 1"
      - "supersede cascade: prior PUBLISHED guidance rows for the same (company, metric, period_label) transition to SUPERSEDED and their versions increment by 1"
      - "APPROVED drafts citing a superseded row keep their status; their pinned_disclosure_version goes stale"
  - method: POST
    path: "/disclosures/{id}/withdraw"
    description: "Withdraws a disclosure. From PUBLISHED this fires the depth-4 cascade disclosure -> draft -> inquiry -> company; from DRAFT nothing downstream can exist and the cascade does not fire."
    roles: [DisclosureOfficer]
    code: 200
    input: ["reason"]
    output: Disclosure
    side_effects:
      - "status = WITHDRAWN; withdrawal_reason stored; increments Disclosure.version by 1"
      - "from PUBLISHED: citing drafts in IN_REVIEW or APPROVED become BLOCKED with blocked_reason = CITED_DISCLOSURE_WITHDRAWN; their inquiries rewind AWAITING_APPROVAL -> DRAFTING with sla_due_at recomputed; those inquiries' companies recompute open_inquiry_count and disclosure_posture"
      - "from DRAFT: no downstream link fires"

  # ---- InquiryTicket ---------------------------------------------------------------------------
  - method: POST
    path: "/inquiries"
    description: "Intakes a shareholder or analyst inquiry, scoring its sensitivity and pre-assigning a routing queue and SLA deadline."
    roles: [IRAdmin, IRAnalyst]
    code: 201
    input: ["company_id", "contact_id", "topic_category", "subject", "requests_nonpublic_detail?", "linked_prior_inquiry_id?"]
    output: InquiryTicket
    side_effects:
      - "computes sensitivity_score (§1.3 inquiry_sensitivity_score), routing_queue (§1.3 inquiry_routing_queue) and sla_due_at (§1.3 inquiry_sla_due_at)"
      - "status = NEW; increments Company.open_inquiry_count and Company.version by 1"
  - method: GET
    path: "/inquiries/{id}"
    description: "Reads one inquiry with its sensitivity score, queue, SLA deadline and version (the value draft review pins via OCC)."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer, TransferAgentLiaison]
    code: 200
    input: []
    output: InquiryTicket
    side_effects: []
  - method: GET
    path: "/inquiries"
    description: "Lists inquiries filtered by issuer, submitting contact, follow-up parent, status, queue or topic."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer, TransferAgentLiaison]
    code: 200
    input: ["company_id?", "contact_id?", "linked_prior_inquiry_id?", "status?", "routing_queue?", "topic_category?", "limit?", "offset?"]
    output: InquiryTicket[]
    side_effects: []
  - method: POST
    path: "/inquiries/{id}/route"
    description: "Routes a new inquiry. The stored sensitivity_score decides whether the ticket lands in ROUTED or forks to ESCALATED; only a DisclosureOfficer may override the computed queue via target_queue."
    roles: [IRAnalyst, DisclosureOfficer]
    code: 200
    input: ["target_queue?"]
    output: InquiryTicket
    side_effects:
      - "status = ROUTED or ESCALATED per §1.2; routing_queue and sla_due_at updated when overridden or escalated"
      - "increments InquiryTicket.version by 1"

  # ---- ResponseDraft ---------------------------------------------------------------------------
  - method: POST
    path: "/response-drafts"
    description: "Drafts the answer to a routed inquiry, declaring its disclosure class and optionally citing a published disclosure. The acting user becomes author_user_id."
    roles: [IRAnalyst]
    code: 201
    input: ["inquiry_id", "body_text", "disclosure_class", "cited_disclosure_id?"]
    output: ResponseDraft
    side_effects:
      - "status = DRAFT; revision_round = 0; author_user_id = X-User-ID; pinned_disclosure_version = null; version = 1"
      - "the parent InquiryTicket transitions ROUTED -> DRAFTING and its version increments by 1"
  - method: GET
    path: "/response-drafts/{id}"
    description: "Reads one draft including disclosure_class, revision_round, pinned_disclosure_version and blocked_reason."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer]
    code: 200
    input: []
    output: ResponseDraft
    side_effects: []
  - method: GET
    path: "/response-drafts"
    description: "Lists drafts filtered by inquiry, cited disclosure, author or status — the only discovery channel for drafts that a cascade has moved to BLOCKED."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer]
    code: 200
    input: ["inquiry_id?", "cited_disclosure_id?", "author_user_id?", "status?", "disclosure_class?", "limit?", "offset?"]
    output: ResponseDraft[]
    side_effects: []
  - method: POST
    path: "/response-drafts/{id}/submit-review"
    description: "The author submits the draft for disclosure review."
    roles: [IRAnalyst]
    code: 200
    input: []
    output: ResponseDraft
    side_effects:
      - "status = DRAFT -> IN_REVIEW; increments ResponseDraft.version by 1"
      - "the parent InquiryTicket transitions DRAFTING -> AWAITING_APPROVAL and its version increments by 1"
  - method: POST
    path: "/response-drafts/{id}/review"
    description: "A DisclosureOfficer approves the draft or requests changes. APPROVE pins the cited disclosure's version; REQUEST_CHANGES rewinds the inquiry to DRAFTING. Guarded by OCC on the parent inquiry (§1.2.1 draft-review-stale-inquiry) and by segregation of duties against the author."
    roles: [DisclosureOfficer]
    code: 200
    input: ["decision", "expected_inquiry_version", "reviewer_note?"]
    output: ResponseDraft
    side_effects:
      - "decision = APPROVE: status = APPROVED, reviewer_user_id = X-User-ID, pinned_disclosure_version = cited Disclosure.version; increments ResponseDraft.version by 1 and increments InquiryTicket.version by 1"
      - "decision = REQUEST_CHANGES: status = CHANGES_REQUESTED, reviewer_note stored; the parent InquiryTicket transitions AWAITING_APPROVAL -> DRAFTING with sla_due_at recomputed; increments ResponseDraft.version by 1 and increments InquiryTicket.version by 1"
  - method: POST
    path: "/response-drafts/{id}/revise"
    description: "The author reworks a draft that came back with changes requested or was blocked by a cascade, consuming one revision round."
    roles: [IRAnalyst]
    code: 200
    input: ["body_text?", "disclosure_class?", "cited_disclosure_id?"]
    output: ResponseDraft
    side_effects:
      - "status = DRAFT; revision_round += 1; blocked_reason = null; reviewer_note = null; pinned_disclosure_version = null; supplied fields replaced"
      - "increments ResponseDraft.version by 1"
  - method: POST
    path: "/response-drafts/{id}/send"
    description: "The author sends the approved answer to the inquirer, answering the inquiry. Rejected when the pinned disclosure version no longer matches the cited disclosure."
    roles: [IRAnalyst]
    code: 200
    input: []
    output: ResponseDraft
    side_effects:
      - "status = APPROVED -> SENT; increments ResponseDraft.version by 1"
      - "the parent InquiryTicket transitions AWAITING_APPROVAL -> ANSWERED with answered_at stamped and its version incremented by 1"
      - "the issuer recomputes open_inquiry_count and its version increments by 1"

  # ---- RoadshowEvent ---------------------------------------------------------------------------
  - method: POST
    path: "/roadshow-events"
    description: "Schedules a conference or non-deal roadshow with a meeting window, fixed slot length and slot capacity."
    roles: [IRAdmin]
    code: 201
    input: ["company_id", "event_type", "venue_city", "window_start", "window_end", "slot_minutes", "capacity_slots"]
    output: RoadshowEvent
    side_effects: ["status = PLANNING; allocated_count / waitlisted_count / released_count / declined_count / request_ledger_total = 0; version = 1"]
  - method: GET
    path: "/roadshow-events/{id}"
    description: "Reads one event with its capacity and the four ledger counters plus request_ledger_total."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer, Investor]
    code: 200
    input: []
    output: RoadshowEvent
    side_effects: []
  - method: GET
    path: "/roadshow-events"
    description: "Lists events for an issuer filtered by type and status."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer, Investor]
    code: 200
    input: ["company_id?", "event_type?", "status?", "limit?", "offset?"]
    output: RoadshowEvent[]
    side_effects: []
  - method: POST
    path: "/roadshow-events/{id}/open-requests"
    description: "Opens the event for meeting requests."
    roles: [IRAdmin]
    code: 200
    input: []
    output: RoadshowEvent
    side_effects: ["status = PLANNING -> OPEN_FOR_REQUESTS; increments RoadshowEvent.version by 1"]
  - method: POST
    path: "/roadshow-events/{id}/allocate"
    description: "Runs the allocation waterfall over every pending request: scores each with the final variant of §1.3 meeting_priority_score, allocates in rank order up to remaining capacity, waitlists the rest, and locks the event."
    roles: [IRAdmin]
    code: 200
    input: []
    output: { event_id: string, event_status: string, evaluated_count: integer, allocated_count: integer, waitlisted_count: integer, threshold_deferred_count: integer }
    side_effects:
      - "every REQUESTED request gets final_priority_score and moves to ALLOCATED or WAITLISTED per §1.3 roadshow_allocation_run; each moved request's version increments by 1"
      - "allocated_count / waitlisted_count updated; status = OPEN_FOR_REQUESTS -> LOCKED; increments RoadshowEvent.version by 1"
      - "threshold_deferred_count counts requests waitlisted because their score is below MIN_ALLOCATION_SCORE rather than because capacity ran out"
  - method: POST
    path: "/roadshow-events/{id}/complete"
    description: "Closes a locked event; every still-waitlisted request is declined."
    roles: [IRAdmin]
    code: 200
    input: []
    output: RoadshowEvent
    side_effects:
      - "status = LOCKED -> COMPLETED; increments RoadshowEvent.version by 1"
      - "every WAITLISTED request of the event transitions to DECLINED and its version increments by 1"
      - "waitlisted_count = 0 and declined_count increases by the number declined; request_ledger_total is unchanged (§1.3 event_request_ledger)"

  # ---- MeetingRequest --------------------------------------------------------------------------
  - method: POST
    path: "/meeting-requests"
    description: "An investor or analyst requests management time in a specific slot of an open event; the provisional priority score is stamped at intake."
    roles: [Investor, IRAdmin]
    code: 201
    input: ["event_id", "contact_id", "requested_slot_start", "requested_slot_end"]
    output: MeetingRequest
    side_effects:
      - "status = REQUESTED; provisional_priority_score computed per §1.3 meeting_priority_score variant provisional; final_priority_score = null; version = 1"
      - "RoadshowEvent.request_ledger_total += 1 and its version increments by 1"
  - method: GET
    path: "/meeting-requests/{id}"
    description: "Reads one request with both scores, its allocation stamp and promoted_from_waitlist."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer, Investor]
    code: 200
    input: []
    output: MeetingRequest
    side_effects: []
  - method: GET
    path: "/meeting-requests"
    description: "Lists meeting requests filtered by event, requesting contact or status — the discovery channel for requests a cascade has promoted, released or declined."
    roles: [IRAdmin, IRAnalyst, DisclosureOfficer, Investor]
    code: 200
    input: ["event_id?", "contact_id?", "status?", "limit?", "offset?"]
    output: MeetingRequest[]
    side_effects: []
  - method: POST
    path: "/meeting-requests/{id}/release"
    description: "Releases an allocated slot; the freed slot is immediately offered to the highest-ranked eligible waitlisted request of the same event."
    roles: [IRAdmin]
    code: 200
    input: ["reason"]
    output: MeetingRequest
    side_effects:
      - "status = ALLOCATED -> RELEASED with release_reason stored; increments MeetingRequest.version by 1"
      - "RoadshowEvent.allocated_count -= 1, released_count += 1; its version increments by 1"
      - "promotion: the §1.3 roadshow_allocation_run selector's winner transitions WAITLISTED -> ALLOCATED with promoted_from_waitlist = true; RoadshowEvent.allocated_count += 1, waitlisted_count -= 1"

  # ---- TransferAgentInstruction ----------------------------------------------------------------
  - method: POST
    path: "/transfer-agent-instructions"
    description: "Sends the transfer agent a record-date, dividend-payment or shareholder-record instruction. The acting user becomes submitted_by_user_id."
    roles: [IRAdmin, TransferAgentLiaison]
    code: 201
    input: ["company_id", "instruction_type", "record_date?", "payable_date?", "declared_rate_cents_per_share?", "funding_mode?", "notes?"]
    output: TransferAgentInstruction
    side_effects:
      - "status = SUBMITTED; submitted_by_user_id = X-User-ID; snapshot fields, payout_ledger and total_payout_cents stay null; version = 1"
      - "funding_mode defaults to DECLARED_RATE for a DIVIDEND_PAYMENT instruction"
  - method: GET
    path: "/transfer-agent-instructions/{id}"
    description: "Reads one instruction with its record-date snapshot, payout ledger and total."
    roles: [IRAdmin, DisclosureOfficer, TransferAgentLiaison]
    code: 200
    input: []
    output: TransferAgentInstruction
    side_effects: []
  - method: GET
    path: "/transfer-agent-instructions"
    description: "Lists an issuer's transfer-agent instructions filtered by type and status."
    roles: [IRAdmin, DisclosureOfficer, TransferAgentLiaison]
    code: 200
    input: ["company_id?", "instruction_type?", "status?", "limit?", "offset?"]
    output: TransferAgentInstruction[]
    side_effects: []
  - method: POST
    path: "/transfer-agent-instructions/{id}/acknowledge"
    description: "The transfer agent acknowledges the instruction (freezing the record-date holder snapshot) or rejects it with a reason."
    roles: [TransferAgentLiaison]
    code: 200
    input: ["decision", "rejection_reason?"]
    output: TransferAgentInstruction
    side_effects:
      - "decision = ACKNOWLEDGE: status = ACKNOWLEDGED; snapshot_holder_count and snapshot_shares_total written per §1.3 record_date_snapshot; increments version by 1"
      - "decision = REJECT: status = REJECTED; decision_reason stored; no snapshot is written; increments version by 1"
      - "acknowledged_by_user_id = X-User-ID in both branches"
  - method: POST
    path: "/transfer-agent-instructions/{id}/execute"
    description: "Pays the acknowledged dividend: builds the per-holder payout ledger for the instruction's funding_mode and moves cash from the issuer's reserve to the holders."
    roles: [TransferAgentLiaison]
    code: 200
    input: []
    output: TransferAgentInstruction
    side_effects:
      - "payout_ledger and total_payout_cents written per §1.3 dividend_payout_ledger; status = EXECUTED; executed_by_user_id = X-User-ID; executed_at stamped; increments version by 1"
      - "Company.dividend_reserve_cents -= total_payout_cents, dividend_paid_cents += total_payout_cents; increments Company.version by 1"
      - "each ledger row credits Contact.dividend_received_cents and increments that Contact.version by 1"
  - method: POST
    path: "/transfer-agent-instructions/{id}/reverse"
    description: "Reverses an executed dividend inside the 72-hour reversal window by replaying the stored payout ledger backwards; the conserved total of reserve + paid is restored exactly."
    roles: [TransferAgentLiaison]
    code: 200
    input: ["reason"]
    output: TransferAgentInstruction
    side_effects:
      - "status = REVERSED; decision_reason stored; payout_ledger and total_payout_cents retained for audit; increments version by 1"
      - "Company.dividend_reserve_cents += total_payout_cents, dividend_paid_cents -= total_payout_cents; increments Company.version by 1"
      - "each ledger row debits Contact.dividend_received_cents and increments that Contact.version by 1"

errors:
  # ---- authentication / authorization ----------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, unknown enum value, negative amount, inverted window, guidance_low > guidance_high, or empty reason string"
  # ---- existence -------------------------------------------------------------------------------
  - id: ERR_COMPANY_NOT_FOUND
    http: 404
    condition: "no Company matches the id in the path or the company_id in the body"
  - id: ERR_CONTACT_NOT_FOUND
    http: 404
    condition: "no Contact matches the id in the path or the contact_id in the body"
  - id: ERR_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "no Disclosure matches the id in the path or the cited_disclosure_id in the body"
  - id: ERR_INQUIRY_NOT_FOUND
    http: 404
    condition: "no InquiryTicket matches the id in the path, the inquiry_id in the body, or the linked_prior_inquiry_id in the body"
  - id: ERR_RESPONSE_DRAFT_NOT_FOUND
    http: 404
    condition: "no ResponseDraft matches the id in the path"
  - id: ERR_ROADSHOW_EVENT_NOT_FOUND
    http: 404
    condition: "no RoadshowEvent matches the id in the path or the event_id in the body"
  - id: ERR_MEETING_REQUEST_NOT_FOUND
    http: 404
    condition: "no MeetingRequest matches the id in the path"
  - id: ERR_INSTRUCTION_NOT_FOUND
    http: 404
    condition: "no TransferAgentInstruction matches the id in the path"
  - id: ERR_CONTACT_OWNERSHIP_MISMATCH
    http: 403
    condition: "an Investor acts on a Contact other than the one its X-User-ID identifies"
  # ---- optimistic concurrency ------------------------------------------------------------------
  - id: ERR_STALE_CONTACT_VERSION
    http: 412
    condition: "expected_contact_version does not equal the analyst Contact's current version at estimate submission"
  - id: ERR_STALE_COMPANY_VERSION
    http: 412
    condition: "expected_company_version does not equal the issuer's current version at position update"
  - id: ERR_STALE_INQUIRY_VERSION
    http: 412
    condition: "expected_inquiry_version does not equal the parent InquiryTicket's current version at draft review"
  # ---- own-state preconditions -----------------------------------------------------------------
  - id: ERR_DISCLOSURE_INVALID_STATE
    http: 409
    condition: "publish on a non-DRAFT disclosure, or withdraw on a SUPERSEDED or already WITHDRAWN disclosure"
  - id: ERR_INQUIRY_INVALID_STATE
    http: 409
    condition: "route on an inquiry that is not NEW or ESCALATED, or draft creation against an inquiry that is not ROUTED"
  - id: ERR_DRAFT_INVALID_STATE
    http: 409
    condition: "submit-review on a non-DRAFT draft, review on a non-IN_REVIEW draft, revise on a draft that is neither CHANGES_REQUESTED nor BLOCKED, or send on a non-APPROVED draft"
  - id: ERR_EVENT_INVALID_STATE
    http: 409
    condition: "open-requests on a non-PLANNING event, allocate on a non-OPEN_FOR_REQUESTS event, complete on a non-LOCKED event, or release of a request whose event is not LOCKED"
  - id: ERR_MEETING_REQUEST_NOT_ALLOCATED
    http: 409
    condition: "release on a meeting request that is not in status ALLOCATED"
  - id: ERR_INSTRUCTION_ALREADY_DECIDED
    http: 409
    condition: "acknowledge or reject on an instruction that has left SUBMITTED"
  - id: ERR_INSTRUCTION_NOT_ACKNOWLEDGED
    http: 409
    condition: "execute on an instruction that is not in status ACKNOWLEDGED"
  - id: ERR_INSTRUCTION_NOT_EXECUTED
    http: 409
    condition: "reverse on an instruction that is not in status EXECUTED"
  # ---- cross-entity referential ----------------------------------------------------------------
  - id: ERR_CONTACT_COMPANY_MISMATCH
    http: 422
    condition: "the referenced Contact belongs to a different issuer than the referenced Company, RoadshowEvent or InquiryTicket"
  - id: ERR_EVENT_NOT_OPEN_FOR_REQUESTS
    http: 409
    condition: "a meeting request is created against an event that is not in status OPEN_FOR_REQUESTS"
  - id: ERR_CITATION_REQUIRED
    http: 422
    condition: "a GUIDANCE_REPEAT draft carries no cited_disclosure_id, or the cited disclosure is not in status PUBLISHED at submit-review or review time"
  - id: ERR_PINNED_DISCLOSURE_STALE
    http: 409
    condition: "at send time the cited disclosure's version no longer equals the pinned_disclosure_version captured at approval (it was superseded or otherwise revised)"
  # ---- segregation of duties / authorship ------------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user would perform two duties that must be separated: reviewing a draft they authored, or acknowledging / executing an instruction they submitted"
  - id: ERR_DRAFT_AUTHOR_MISMATCH
    http: 403
    condition: "a user other than the draft's author_user_id submits, revises or sends it"
  - id: ERR_QUEUE_OVERRIDE_FORBIDDEN
    http: 403
    condition: "target_queue is supplied by an IRAnalyst, or an ESCALATED inquiry is re-routed without a DisclosureOfficer supplying target_queue"
  # ---- disclosure boundary / access gates ------------------------------------------------------
  - id: ERR_DISCLOSURE_BLACKOUT
    http: 409
    condition: "the issuer's disclosure_posture is BLACKOUT and the operation would approve a draft, send an answer, allocate roadshow meetings or grant model access"
  - id: ERR_SELECTIVE_DISCLOSURE_BLOCKED
    http: 422
    condition: "approval was requested for a draft whose disclosure_class is MATERIAL_NONPUBLIC"
  - id: ERR_NDA_REQUIRED
    http: 422
    condition: "GRANT_MODEL_ACCESS on a contact whose nda_on_file is false"
  - id: ERR_MODEL_ACCESS_NOT_ELIGIBLE
    http: 422
    condition: "GRANT_MODEL_ACCESS on a contact that is not a SELL_SIDE_ANALYST, or REVOKE_MODEL_ACCESS on a contact whose model_access_status is not GRANTED"
  - id: ERR_MODEL_ACCESS_REQUIRED
    http: 403
    condition: "an estimate is submitted by a contact whose model_access_status is not GRANTED"
  - id: ERR_COVERAGE_NOT_INITIATED
    http: 422
    condition: "an estimate is submitted by a contact that is not a SELL_SIDE_ANALYST or whose coverage_status is not INITIATED"
  # ---- uniqueness ------------------------------------------------------------------------------
  - id: ERR_DUPLICATE_TICKER
    http: 409
    condition: "the ticker is already registered to another Company"
  - id: ERR_DUPLICATE_FACT_KEY
    http: 409
    condition: "the issuer already has a DRAFT or PUBLISHED disclosure with the same fact_key"
  - id: ERR_ACTIVE_DRAFT_EXISTS
    http: 409
    condition: "the inquiry already has a draft in DRAFT, IN_REVIEW, CHANGES_REQUESTED or APPROVED"
  # ---- temporal validity -----------------------------------------------------------------------
  - id: ERR_SLOT_OUT_OF_WINDOW
    http: 422
    condition: "the requested slot is not fully inside the event's meeting window"
  - id: ERR_SLOT_DURATION_INVALID
    http: 422
    condition: "the requested slot's length in minutes differs from the event's slot_minutes"
  - id: ERR_RECORD_DATE_IN_PAST
    http: 422
    condition: "the instruction's record_date is earlier than the logical clock's current date"
  - id: ERR_PAYABLE_DATE_TOO_EARLY
    http: 422
    condition: "a dividend instruction's payable_date is fewer than MIN_PAYABLE_LAG_DAYS (10) days after its record_date"
  - id: ERR_PAYABLE_DATE_NOT_REACHED
    http: 409
    condition: "execute is attempted before the logical clock reaches the instruction's payable_date"
  - id: ERR_REVERSAL_WINDOW_EXPIRED
    http: 409
    condition: "reverse is attempted at or after executed_at + REVERSAL_WINDOW_HOURS (72)"
  # ---- overlap ---------------------------------------------------------------------------------
  - id: ERR_CONTACT_DOUBLE_BOOKED
    http: 409
    condition: "the contact already holds an open meeting request whose 30-minute-buffered interval overlaps the requested slot"
  - id: ERR_DIVIDEND_CYCLE_OVERLAP
    http: 409
    condition: "the issuer already has an open dividend instruction whose closed [record_date, payable_date] interval overlaps the new one"
  # ---- limits, aggregates, fiscal --------------------------------------------------------------
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "revise is attempted on a draft that has already consumed MAX_REVISION_ROUNDS (3) revision rounds"
  - id: ERR_SHARES_EXCEED_OUTSTANDING
    http: 422
    condition: "the patched position would push the issuer's summed holder positions above shares_outstanding"
  - id: ERR_NO_PENDING_REQUESTS
    http: 409
    condition: "an allocation run is triggered on an event with no MeetingRequest in status REQUESTED"
  - id: ERR_NO_ELIGIBLE_ESTIMATES
    http: 409
    condition: "no EstimateSubmission survives the consensus eligible-set filter for the requested metric and period_label"
  - id: ERR_INSTRUCTION_TYPE_NOT_PAYABLE
    http: 422
    condition: "execute is attempted on an instruction whose instruction_type is not DIVIDEND_PAYMENT"
  - id: ERR_DIVIDEND_RESERVE_INSUFFICIENT
    http: 422
    condition: "the computed total_payout_cents exceeds the issuer's dividend_reserve_cents"

roles:
  - name: IRAdmin
    description: "Investor-relations operations lead: registers issuers and contacts, maintains the share register, runs shareholder-servicing actions, schedules roadshows and events, runs allocation, and submits transfer-agent instructions. Also the only role that may move the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /companies"
      - "POST /contacts"
      - "PATCH /contacts/{id}/position"
      - "POST /roadshow-events"
      - "POST /roadshow-events/{id}/open-requests"
      - "POST /roadshow-events/{id}/allocate"
      - "POST /roadshow-events/{id}/complete"
      - "POST /meeting-requests/{id}/release"
    shared_operations:
      - "POST /companies/{id}/recompute-posture (with DisclosureOfficer)"
      - "POST /contacts/{id}/servicing (with DisclosureOfficer)"
      - "POST /inquiries (with IRAnalyst)"
      - "POST /meeting-requests (with Investor)"
      - "POST /transfer-agent-instructions (with TransferAgentLiaison)"
      - "all GET reads except the response-draft reads it shares with IRAnalyst and DisclosureOfficer"
  - name: IRAnalyst
    description: "IR desk analyst: routes inquiries, authors response drafts, revises them after review and sends approved answers. Cannot approve its own work and cannot override a computed routing queue."
    identity: "opaque"
    exclusive_operations:
      - "POST /response-drafts"
      - "POST /response-drafts/{id}/submit-review"
      - "POST /response-drafts/{id}/revise"
      - "POST /response-drafts/{id}/send"
    shared_operations:
      - "POST /inquiries (with IRAdmin)"
      - "POST /inquiries/{id}/route without target_queue (with DisclosureOfficer)"
      - "GET /companies/{id}/consensus, GET /disclosures, GET /inquiries, GET /response-drafts, GET /contacts, GET /roadshow-events, GET /meeting-requests"
  - name: DisclosureOfficer
    description: "Disclosure-committee member: owns the disclosure record (draft, publish, withdraw), approves or rejects response drafts, may override a routing queue, and services model access. Cannot author or send a draft."
    identity: "opaque"
    exclusive_operations:
      - "POST /disclosures"
      - "POST /disclosures/{id}/publish"
      - "POST /disclosures/{id}/withdraw"
      - "POST /response-drafts/{id}/review"
      - "POST /inquiries/{id}/route with target_queue"
    shared_operations:
      - "POST /companies/{id}/recompute-posture (with IRAdmin)"
      - "POST /contacts/{id}/servicing (with IRAdmin)"
      - "POST /inquiries/{id}/route without target_queue (with IRAnalyst)"
      - "GET /companies/{id}/consensus, GET /disclosures, GET /inquiries, GET /response-drafts, GET /contacts, GET /transfer-agent-instructions"
  - name: TransferAgentLiaison
    description: "Transfer-agent counterpart: acknowledges or rejects instructions, freezes the record-date holder snapshot, executes dividend payments and reverses them inside the reversal window. May also submit instructions, in which case segregation of duties bars it from acknowledging or executing that same instruction."
    identity: "opaque"
    exclusive_operations:
      - "POST /transfer-agent-instructions/{id}/acknowledge"
      - "POST /transfer-agent-instructions/{id}/execute"
      - "POST /transfer-agent-instructions/{id}/reverse"
    shared_operations:
      - "POST /transfer-agent-instructions (with IRAdmin)"
      - "GET /companies, GET /companies/{id}, GET /contacts, GET /contacts/{id}, GET /inquiries, GET /transfer-agent-instructions"
  - name: Investor
    description: "External shareholder or sell-side analyst acting as themselves: submits consensus estimates and requests management meetings, and reads its own contact record, estimates and requests. X-User-ID is the id of the acting Contact."
    identity: "entity_backed:Contact"
    exclusive_operations:
      - "POST /estimates"
    shared_operations:
      - "POST /meeting-requests (with IRAdmin)"
      - "GET /companies/{id}, GET /contacts/{id}, GET /contacts/{id}/estimates, GET /disclosures/{id}, GET /roadshow-events, GET /roadshow-events/{id}, GET /meeting-requests, GET /meeting-requests/{id}"
