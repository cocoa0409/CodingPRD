              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, forecast_wind_gust_mph: 0, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/shipments"
              payload: { project_id: "${proj}", carrier_code: "NWHEAVY", route_state_codes: ["WA"], planned_departure_at: "2026-09-08T13:00:00Z", planned_arrival_at: "2026-09-08T21:00:00Z" }
              as: TransportCoordinator
              captures: { ship: "$.data.id", shipv: "$.data.version" }
          trigger:
            - call: "POST /modular/shipments/${ship}/dispatch"
              as: TransportCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_SHIPMENT_NOT_PERMITTED' with HTTP 409"
            - "GET /modular/shipments/${ship} still reports status == 'DRAFT' and dispatched_at == null"

      - name: close_connections_on_an_at_factory_module_is_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines[ModuleUnit.site_status]
          - validations[priority=48]
          - endpoints[POST /modular/modules/{moduleId}/close-connections]
        distinguishing_aspect: |
          close-connections is only defined from SET. Fired against a module still AT_FACTORY it must
          fail with the state error even though the payload is complete — the transition simply does
          not exist from that state, and no timestamps may be written.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; module M-01 AT_FACTORY"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
