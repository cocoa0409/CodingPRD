            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - *votes_aab
            - *vote_a2
            - *vote_bbb3
            - *close_std
            - *get_rating
            - *c_publish
            - *publish_std
            - *get_obls
          trigger:
            - call: "POST /_clock/set_current_utc"
