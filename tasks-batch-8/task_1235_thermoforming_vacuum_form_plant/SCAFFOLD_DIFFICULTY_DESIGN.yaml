            - { call: "POST /tools", payload: { tool_code: "TV", part_number: "P-V", tool_type: TRIM_FIXTURE, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1500.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 8000.00, rated_lifetime_shots: 80000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-V", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "OV", part_number: "P-V", resin_type: PP, ordered_qty: 100, required_gauge_mm: 2.000, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.500, spec_min_wall_mm: 1.400, nominal_part_weight_kg: 0.050, std_cycle_time_s: 32, std_machine_rate_per_hour: 50.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: false }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler, captures: { alloc_id: $.data.id } }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler }
          trigger:
            - { call: "POST /tools/${tool_id}/revise", as: ToolingEngineer, captures: { tool_st: $.data.status, tool_rev: $.data.drawing_revision } }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { ord_st: $.data.schedule_status } }
            - { call: "GET /material-allocations/${alloc_id}", as: Any, captures: { alloc_st: $.data.status } }
          assert:
            - "Tool.${tool_id}.status == UNDER_REVISION and drawing_revision == 2 (captured ${tool_st} / ${tool_rev})"
            - "hop1: ProductionOrder.${order_id}.schedule_status == ON_HOLD (captured ${ord_st})"
            - "hop2: MaterialAllocation.${alloc_id}.status == REVIEW (captured ${alloc_st})"
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: allocation_state_beats_fiscal_priority
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_ORDER_NOT_ALLOCATABLE]
          - errors[ERR_INSUFFICIENT_MATERIAL]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the target order is CANCELLED
          AND the requested 5.000kg exceeds the lot's 2.000kg available. The
          state error ERR_ORDER_NOT_ALLOCATABLE (priority 6) must win over the
          fiscal error ERR_INSUFFICIENT_MATERIAL (priority 10).
        test_recipe:
          setup:
            - "CERTIFIED lot with only 2.000kg available; order O-X created then CANCELLED from QUEUED"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "LX", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 2.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
