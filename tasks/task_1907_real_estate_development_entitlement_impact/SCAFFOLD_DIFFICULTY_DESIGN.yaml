            - "After full payment then DENY: ImpactFeeAssessment.${assessment_id}.status == REFUNDED"
            - "Applicant net outlay returns to 0 (116000.00 payment reversed); no drift in conserved dollar quantity"

      - name: opposition_score_add_remove_event_conservation
        grounds:
          - calculations.opposition_score_and_posture
          - entities.OutreachEvent.fields.weight
          - entities.EntitlementApplication.fields.opposition_score
        distinguishing_aspect: |
          Different conserved quantity (dimensionless score, not dollars):
          recording an OPPOSE event (+5) and then an equal-magnitude SUPPORT
          event (-2) does NOT cancel; the invariant pinned is that
          opposition_score always equals the exact arithmetic sum of event
          weights with no clamping — adding weights w1..wn and then reading the
          score returns exactly sum(wi), so a compensating sequence of events
          whose weights sum to zero leaves opposition_score unchanged.
        test_recipe:
          setup:
            - "Application SUBMITTED; baseline score 0"
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "OppCo", contact_email: "o@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "Opp", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 5, affordable_units: 0, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "REZONE", submittal_package: ["SITE_PLAN"], expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /entitlement/staff-reviewers"
              payload: { full_name: "Rev", disciplines: ["PLANNING"] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /entitlement/applications/${app_id}/outreach-events"
              payload: { event_date: "2026-08-03T00:00:00Z", disposition: "OPPOSE", attendee_count: 10 }
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/outreach-events"
              payload: { event_date: "2026-08-04T00:00:00Z", disposition: "OPPOSE", attendee_count: 10 }
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/outreach-events"
              payload: { event_date: "2026-08-05T00:00:00Z", disposition: "SUPPORT", attendee_count: 10 }
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/outreach-events"
              payload: { event_date: "2026-08-06T00:00:00Z", disposition: "SUPPORT", attendee_count: 10 }
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/outreach-events"
              payload: { event_date: "2026-08-07T00:00:00Z", disposition: "SUPPORT", attendee_count: 10 }
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/outreach-events"
              payload: { event_date: "2026-08-08T00:00:00Z", disposition: "SUPPORT", attendee_count: 10 }
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/outreach-events"
              payload: { event_date: "2026-08-09T00:00:00Z", disposition: "SUPPORT", attendee_count: 10 }
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "GET /entitlement/applications/${app_id}"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { score: $.data.opposition_score }
          assert:
            - "opposition_score == 0 (2 OPPOSE = +10, 5 SUPPORT = -10; sum is exactly 0 — the compensating events restore the conserved score)"
            - "No clamping at 0 applied: score is the raw arithmetic sum (would be -10 if the 5 SUPPORT preceded the 2 OPPOSE — order-independent sum)"
