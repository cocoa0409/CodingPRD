scenario: |
  Court Reporting & Deposition Scheduling: job/notice & assignment,
  reporter/videographer/interpreter resource, transcript order &
  turnaround/expedite, exhibit & rough-draft, page-rate & appearance-fee
  billing, real-time stream, repository & e-delivery, read-and-sign/errata.

domain_name: court-reporting-deposition
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on Job.version for assignment-create race
    - cascading_side_effects        # job cancel -> assignments release -> resource frees; certify -> invoice lines
    - dual_variant_calculation      # transcript estimate vs final page count; appearance fee estimate vs actual
    - rate_threshold_triggers       # expedite turnaround tiers; volume page-rate breakpoints
    - derived_field_reconciliation  # Invoice.total_cents reconciled from lines; Job aggregate posture

  entity_topology: graph
  # Jobs reference Cases; Assignments join Jobs<->Resources (many-to-many over time);
  # RealtimeStreams reference a Job and the driving reporter Assignment;
  # TranscriptOrders reference Jobs; Exhibits/Errata reference TranscriptOrders;
  # Invoices aggregate across Job + TranscriptOrder. 10 peer entities with FK links.

  state_machine_shape: cyclic
  # TranscriptOrder read-and-sign loop (CERTIFIED -> READ_SIGN_OPEN -> ERRATA_FILED ->
  # READ_SIGN_OPEN ... -> SIGNED) is cyclic. Job has branching/parallel posture.
  # Assignment + Invoice add linear-with-revert dimensions.

  relationship_patterns:
    - one_to_many        # Case -> Jobs; Job -> Assignments; TranscriptOrder -> Exhibits, Errata
    - many_to_many       # Job <-> Resource via Assignment (a resource serves many jobs over time)
    - cross_aggregate    # Invoice lines reference both Job and TranscriptOrder

  role_model: peer_roles
  # ScheduleCoordinator owns jobs/assignments; Reporter/Videographer/Interpreter are
  # resource-backed actors; Attorney (noticing party) orders transcripts and files errata;
  # BillingClerk owns invoices; PlatformAdmin operational superset of seeding/clock.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: caption
        type: string
        source: input
        description: "Full case caption, e.g. 'Doe v. Acme Corp'."
        constraints: "non-empty"
      - name: docket_number
        type: string
        source: input
        description: "Court docket / case number."
        constraints: "non-empty, unique across all Cases"
      - name: jurisdiction
        type: enum
        source: input
        description: "Governing jurisdiction; drives certification ruleset."
        constraints: "one of {FEDERAL, STATE_CA, STATE_NY, STATE_TX}"
      - name: noticing_attorney_id
        type: string
        source: input
        description: "FK -> Attorney.id; the attorney party that owns this case file."

  - name: Attorney
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Attorney full name."
        constraints: "non-empty"
      - name: firm_name
        type: string
        source: input
        description: "Law firm name."
        constraints: "non-empty"
      - name: bar_state
        type: enum
        source: input
        description: "State bar admission; must cover the case jurisdiction for noticing."
        constraints: "one of {CA, NY, TX, FED}"
      - name: email
        type: string
        source: input
        description: "Attorney contact + e-delivery address."
        constraints: "non-empty, unique across Attorneys"

  - name: Resource
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Resource (person) full name."
        constraints: "non-empty"
      - name: kind
        type: enum
        source: input
        description: "Resource type; gates which assignment role it can fill."
        constraints: "one of {REPORTER, VIDEOGRAPHER, INTERPRETER}"
      - name: certifications
        type: array
        source: input
        description: "Held certification codes (e.g. CSR_CA, RPR, RMR for reporters; language codes for interpreters)."
        default: "[]"
      - name: realtime_capable
        type: boolean
        source: input
        description: "Whether this REPORTER can drive a real-time stream; ignored for non-reporters."
        default: false
      - name: hourly_appearance_cents
        type: integer
        source: input
        description: "Per-hour appearance fee rate in cents for this resource."
        constraints: ">= 0"
      - name: active
        type: boolean
        source: system
        description: "Soft-availability flag; INACTIVE resources cannot be newly assigned but keep existing assignments."
        default: true

  - name: Job
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this deposition job belongs to."
      - name: deponent_name
        type: string
        source: input
        description: "Name of the witness being deposed."
        constraints: "non-empty"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Deposition start (ISO 8601 UTC, inclusive)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Deposition end (ISO 8601 UTC, exclusive). Must be after scheduled_start."
      - name: requires_videographer
        type: boolean
        source: input
        description: "Whether a VIDEOGRAPHER assignment is required before the job can be CONFIRMED."
        default: false
      - name: requires_interpreter
        type: boolean
        source: input
        description: "Whether an INTERPRETER assignment is required before the job can be CONFIRMED."
        default: false
      - name: interpreter_language
        type: string
        source: input
        description: "Required language code when requires_interpreter is true; matched against interpreter certifications."
        default: null
      - name: requires_realtime
        type: boolean
        source: input
        description: "Whether a real-time stream is requested; forces the REPORTER assignment to be realtime_capable."
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        default: "NOTICED"
        constraints: "one of {NOTICED, CONFIRMED, IN_SESSION, ADJOURNED, CANCELLED}"
      - name: staffing_posture
        type: enum
        source: computed
        description: "Derived from current ACTIVE assignments vs job requirements (see calc compute_staffing_posture)."
        default: "UNSTAFFED"
        constraints: "one of {UNSTAFFED, PARTIAL, READY}"
      - name: actual_start
        type: datetime
        source: system
        description: "Set when the job transitions to IN_SESSION."
        default: null
      - name: actual_end
        type: datetime
        source: system
        description: "Set when the job transitions to ADJOURNED; drives appearance-fee hours."
        default: null

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job this resource is assigned to."
      - name: resource_id
        type: string
        source: input
        description: "FK -> Resource.id; the assigned resource."
      - name: role
        type: enum
        source: input
        description: "Assignment role; must equal the resource's kind."
        constraints: "one of {REPORTER, VIDEOGRAPHER, INTERPRETER}"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, RELEASED, COMPLETED}"
      - name: appearance_fee_cents
        type: integer
        source: computed
        description: "Final appearance fee for this resource on this job (see calc compute_appearance_fee); 0 until job ADJOURNED."
        default: 0

  - name: RealtimeStream
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the realtime job this stream serves (job must be IN_SESSION and requires_realtime)."
      - name: reporter_assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the ACTIVE REPORTER assignment whose realtime_capable resource drives the feed."
      - name: access_token
        type: string
        source: system
        description: "Server-minted opaque feed token issued on stream start; rotated only on a fresh start."
      - name: status
        type: enum
        source: system
        description: "Stream lifecycle."
        default: "STARTING"
        constraints: "one of {STARTING, LIVE, STOPPED}"
      - name: started_at
        type: datetime
        source: system
        description: "Set when the stream goes LIVE (logical clock)."
        default: null
      - name: stopped_at
        type: datetime
        source: system
        description: "Set when the stream STOPS (job adjourn cascade or explicit stop)."
        default: null

  - name: TranscriptOrder
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the deposition this transcript transcribes (job must be ADJOURNED)."
      - name: ordering_attorney_id
        type: string
        source: input
        description: "FK -> Attorney.id; party that ordered the transcript and pays page-rate."
      - name: turnaround_tier
        type: enum
        source: input
        description: "Requested delivery tier; drives the expedite multiplier on page rate."
        constraints: "one of {STANDARD, EXPEDITE_14, EXPEDITE_7, EXPEDITE_3, DAILY}"
      - name: certified_copy
        type: boolean
        source: input
        description: "Whether a certified (vs draft-only) transcript is ordered; certification adds a flat fee and enables read-and-sign."
        default: true
      - name: estimated_pages
        type: integer
        source: input
        description: "Reporter's pre-production page estimate; drives the provisional cost quote."
        constraints: ">= 0"
      - name: final_pages
        type: integer
        source: system
        description: "Actual certified page count; set on CERTIFY transition. Drives final page-rate billing."
        default: null
      - name: status
        type: enum
        source: system
        description: "Transcript production + read-and-sign lifecycle."
        default: "ORDERED"
        constraints: "one of {ORDERED, ROUGH_DELIVERED, CERTIFIED, READ_SIGN_OPEN, ERRATA_FILED, SIGNED, DELIVERED, CANCELLED}"
      - name: read_sign_deadline
        type: datetime
        source: system
        description: "Set when CERTIFIED; deponent has until this instant to sign or file errata (30 days)."
        default: null
      - name: errata_round
        type: integer
        source: system
        description: "Count of completed errata cycles; increments each time errata is filed."
        default: 0

  - name: Exhibit
    parent: null
    common_fields: true
    fields:
      - name: transcript_order_id
        type: string
        source: input
        description: "FK -> TranscriptOrder.id; the transcript this exhibit attaches to."
      - name: marked_label
        type: string
        source: input
        description: "Exhibit marking, e.g. 'Exhibit 1' or 'Plaintiff-A'."
        constraints: "non-empty, unique per transcript_order_id"
      - name: page_count
        type: integer
        source: input
        description: "Number of pages in the exhibit; billed at the exhibit per-page rate."
        constraints: ">= 1"
      - name: confidential
        type: boolean
        source: input
        description: "If true, exhibit is sealed and excluded from default e-delivery bundles."
        default: false

  - name: Errata
    parent: null
    common_fields: true
    fields:
      - name: transcript_order_id
        type: string
        source: input
        description: "FK -> TranscriptOrder.id; the certified transcript being corrected."
      - name: round
        type: integer
        source: system
        description: "The errata_round this sheet belongs to (snapshot of TranscriptOrder.errata_round+1 at filing)."
      - name: corrections
        type: array
        source: input
        description: "List of {page, line, from_text, to_text} correction objects."
        constraints: "non-empty"
      - name: reason
        type: string
        source: input
        description: "Stated reason for the corrections (required by most jurisdictions)."
        constraints: "non-empty"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job whose appearance fees this invoice settles."
      - name: transcript_order_id
        type: string
        source: input
        description: "FK -> TranscriptOrder.id; the transcript order whose page/exhibit charges this invoice settles."
      - name: bill_to_attorney_id
        type: string
        source: input
        description: "FK -> Attorney.id; the party billed (defaults to the transcript's ordering attorney)."
      - name: appearance_subtotal_cents
        type: integer
        source: computed
        description: "Sum of appearance_fee_cents over the job's COMPLETED assignments."
        default: 0
      - name: page_subtotal_cents
        type: integer
        source: computed
        description: "Page-rate charge from the transcript (see calc compute_page_charge)."
        default: 0
      - name: exhibit_subtotal_cents
        type: integer
        source: computed
        description: "Exhibit-page charge across the transcript's exhibits."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "Reconciled grand total = appearance_subtotal + page_subtotal + exhibit_subtotal (see calc compute_invoice_total)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Billing lifecycle."
        default: "DRAFT"
        constraints: "one of {DRAFT, ISSUED, PAID, VOID}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Job
    initial_state: NOTICED
    terminal_states: [ADJOURNED, CANCELLED]
    transitions:
      - from: NOTICED
        to: CONFIRMED
        trigger: "POST /jobs/{id}/confirm"
        actor: ScheduleCoordinator
        preconditions:
          - "Job.staffing_posture == READY (all required roles have an ACTIVE assignment; see calc compute_staffing_posture)"
          - "Job.scheduled_start is in the future relative to the logical clock"
        side_effects:
          - "Job.status -> CONFIRMED"
          - "recompute Job.staffing_posture"
          - "increments Job.version by 1"
      - from: NOTICED
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: ScheduleCoordinator
        preconditions:
          - "Job.status in {NOTICED, CONFIRMED}"
        side_effects:
          - "Job.status -> CANCELLED"
          - "cascade: every ACTIVE Assignment on this job -> RELEASED (frees the resource's time window)"
          - "recompute Job.staffing_posture -> UNSTAFFED"
          - "increments Job.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: ScheduleCoordinator
        preconditions:
          - "Job.status in {NOTICED, CONFIRMED}"
        side_effects:
          - "Job.status -> CANCELLED"
          - "cascade: every ACTIVE Assignment on this job -> RELEASED"
          - "recompute Job.staffing_posture -> UNSTAFFED"
          - "increments Job.version by 1"
      - from: CONFIRMED
        to: IN_SESSION
        trigger: "POST /jobs/{id}/start"
        actor: ScheduleCoordinator
        preconditions:
          - "Job.status == CONFIRMED"
          - "logical clock >= Job.scheduled_start"
        side_effects:
          - "Job.status -> IN_SESSION"
          - "Job.actual_start = logical clock"
          - "increments Job.version by 1"
      - from: IN_SESSION
        to: ADJOURNED
        trigger: "POST /jobs/{id}/adjourn"
        actor: ScheduleCoordinator
        preconditions:
          - "Job.status == IN_SESSION"
        side_effects:
          - "Job.status -> ADJOURNED"
          - "Job.actual_end = logical clock"
          - "cascade hop 1: every ACTIVE Assignment on this job -> COMPLETED"
          - "cascade hop 2: each COMPLETED Assignment's appearance_fee_cents computed via compute_appearance_fee from Job.actual_start/actual_end"
          - "cascade: any LIVE or STARTING RealtimeStream on this job -> STOPPED with stopped_at = logical clock"
          - "increments Job.version by 1"

  - entity: Assignment
    initial_state: ACTIVE
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /assignments/{id}/release  (or cascade from Job cancel)"
        actor: ScheduleCoordinator
        preconditions:
          - "Assignment.status == ACTIVE"
          - "parent Job.status in {NOTICED, CONFIRMED} (cannot release once IN_SESSION/ADJOURNED)"
        side_effects:
          - "Assignment.status -> RELEASED"
          - "frees the resource's [Job.scheduled_start, Job.scheduled_end) window for new overlap checks"
          - "cascade: recompute parent Job.staffing_posture (may drop READY -> PARTIAL)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: Job adjourn cascade"
        actor: system
        preconditions:
          - "parent Job transitioning to ADJOURNED"
        side_effects:
          - "Assignment.status -> COMPLETED"
          - "Assignment.appearance_fee_cents computed via compute_appearance_fee"

  - entity: RealtimeStream
    initial_state: STARTING
    terminal_states: [STOPPED]
    transitions:
      - from: STARTING
        to: LIVE
        trigger: "POST /realtime-streams/{id}/go-live"
        actor: Reporter
        preconditions:
          - "RealtimeStream.status == STARTING"
          - "parent Job.status == IN_SESSION"
          - "the referenced reporter_assignment_id is ACTIVE, role==REPORTER, and its Resource.realtime_capable == true"
        side_effects:
          - "RealtimeStream.status -> LIVE"
          - "RealtimeStream.started_at = logical clock"
      - from: LIVE
        to: STOPPED
        trigger: "POST /realtime-streams/{id}/stop  (or cascade from Job adjourn)"
        actor: Reporter
        preconditions:
          - "RealtimeStream.status in {STARTING, LIVE}"
        side_effects:
          - "RealtimeStream.status -> STOPPED"
          - "RealtimeStream.stopped_at = logical clock"
      - from: STARTING
        to: STOPPED
        trigger: "system: Job adjourn cascade (stream never went live)"
        actor: system
        preconditions:
          - "parent Job transitioning to ADJOURNED"
        side_effects:
          - "RealtimeStream.status -> STOPPED"
          - "RealtimeStream.stopped_at = logical clock"

  - entity: TranscriptOrder
    initial_state: ORDERED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: ORDERED
        to: ROUGH_DELIVERED
        trigger: "POST /transcript-orders/{id}/deliver-rough"
        actor: Reporter
        preconditions:
          - "TranscriptOrder.status == ORDERED"
          - "acting Reporter has a COMPLETED REPORTER Assignment on the order's job"
        side_effects:
          - "TranscriptOrder.status -> ROUGH_DELIVERED"
      - from: ROUGH_DELIVERED
        to: CERTIFIED
        trigger: "POST /transcript-orders/{id}/certify"
        actor: Reporter
        preconditions:
          - "TranscriptOrder.status == ROUGH_DELIVERED"
          - "TranscriptOrder.certified_copy == true"
          - "final_pages provided and >= 1"
        side_effects:
          - "TranscriptOrder.status -> CERTIFIED"
          - "TranscriptOrder.final_pages = provided value"
          - "TranscriptOrder.read_sign_deadline = logical clock + 30 days"
      - from: CERTIFIED
        to: READ_SIGN_OPEN
        trigger: "POST /transcript-orders/{id}/open-read-sign"
        actor: ScheduleCoordinator
        preconditions:
          - "TranscriptOrder.status == CERTIFIED"
        side_effects:
          - "TranscriptOrder.status -> READ_SIGN_OPEN"
      - from: READ_SIGN_OPEN
        to: ERRATA_FILED
        trigger: "POST /transcript-orders/{id}/errata"
        actor: Attorney
        preconditions:
          - "TranscriptOrder.status == READ_SIGN_OPEN"
          - "logical clock < TranscriptOrder.read_sign_deadline"
          - "acting Attorney == ordering_attorney_id OR == job's case noticing_attorney_id"
        side_effects:
          - "creates an Errata with round = errata_round + 1"
          - "TranscriptOrder.errata_round increments by 1"
          - "TranscriptOrder.status -> ERRATA_FILED"
        note: "Cyclic: ERRATA_FILED routes back to READ_SIGN_OPEN on re-open, enabling multiple errata rounds."
      - from: ERRATA_FILED
        to: READ_SIGN_OPEN
        trigger: "POST /transcript-orders/{id}/open-read-sign"
        actor: ScheduleCoordinator
        preconditions:
          - "TranscriptOrder.status == ERRATA_FILED"
        side_effects:
          - "TranscriptOrder.status -> READ_SIGN_OPEN (loop back; deadline unchanged)"
        note: "Closes the read-and-sign cycle; bounded by read_sign_deadline, not by round count."
      - from: READ_SIGN_OPEN
        to: SIGNED
        trigger: "POST /transcript-orders/{id}/sign"
        actor: Attorney
        preconditions:
          - "TranscriptOrder.status == READ_SIGN_OPEN"
          - "acting Attorney == ordering_attorney_id OR == job's case noticing_attorney_id"
        side_effects:
          - "TranscriptOrder.status -> SIGNED"
      - from: CERTIFIED
        to: SIGNED
        trigger: "system: read-sign deadline lapse via POST /_clock/set_current_utc advancing past read_sign_deadline, then POST /transcript-orders/{id}/finalize-deadline"
        actor: system
        preconditions:
          - "TranscriptOrder.status in {CERTIFIED, READ_SIGN_OPEN, ERRATA_FILED}"
          - "logical clock >= TranscriptOrder.read_sign_deadline"
        side_effects:
          - "TranscriptOrder.status -> SIGNED (auto-waived: deponent signature deemed waived after deadline)"
      - from: SIGNED
        to: DELIVERED
        trigger: "POST /transcript-orders/{id}/deliver"
        actor: ScheduleCoordinator
        preconditions:
          - "TranscriptOrder.status == SIGNED"
        side_effects:
          - "TranscriptOrder.status -> DELIVERED (e-delivery bundle made available to ordering_attorney)"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /transcript-orders/{id}/cancel"
        actor: Attorney
        preconditions:
          - "TranscriptOrder.status in {ORDERED, ROUGH_DELIVERED}"
        side_effects:
          - "TranscriptOrder.status -> CANCELLED"
      - from: ROUGH_DELIVERED
        to: CANCELLED
        trigger: "POST /transcript-orders/{id}/cancel"
        actor: Attorney
        preconditions:
          - "TranscriptOrder.status in {ORDERED, ROUGH_DELIVERED}"
        side_effects:
          - "TranscriptOrder.status -> CANCELLED"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == DRAFT"
          - "linked TranscriptOrder.status == DELIVERED"
          - "Invoice.total_cents > 0"
        side_effects:
          - "Invoice.status -> ISSUED"
          - "recompute and freeze all subtotals + total_cents from current job/transcript/exhibit state"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == ISSUED"
        side_effects:
          - "Invoice.status -> PAID"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Invoice.status in {DRAFT, ISSUED}"
        side_effects:
          - "Invoice.status -> VOID"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Invoice.status in {DRAFT, ISSUED}"
        side_effects:
          - "Invoice.status -> VOID"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-job
    parent_entity: Job
    write_endpoint: "POST /jobs/{id}/assignments"
    occ_field: "expected_job_version"
    description: |
      Creating an Assignment against a Job whose version has advanced since the
      client last observed it is rejected on a stale version. This captures the
      case where another writer already added or released an assignment on the
      same job (which legitimately changes the staffing posture and the set of
      already-occupied roles), so the current writer's view of the job — and of
      which roles remain open — is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compute_staffing_posture
    trigger: "on Assignment create, Assignment release, Job cancel; reads current ACTIVE assignments"
    algorithm: aggregation
    formula: |
      required_roles = {REPORTER}
      if Job.requires_videographer: required_roles add VIDEOGRAPHER
      if Job.requires_interpreter:  required_roles add INTERPRETER
      active = { a.role for a in Assignments where a.job_id == Job.id and a.status == ACTIVE }
      # realtime gate: if Job.requires_realtime, the REPORTER assignment's resource
      # must be realtime_capable for REPORTER to count toward 'covered'.
      covered = roles in active that satisfy their per-role eligibility (see validations)
      if required_roles is subset of covered: posture = READY
      elif covered is empty:                  posture = UNSTAFFED
      else:                                    posture = PARTIAL
    input_set: "Assignments with status == ACTIVE on this job_id only; RELEASED/COMPLETED excluded."
    constants: {}
    precision: "integer role-set comparison; no rounding"

  - name: compute_appearance_fee
    trigger: "Job adjourn cascade hop 2; computed per COMPLETED Assignment"
    algorithm: tiered_pricing
    formula: |
      # Billable hours are derived from ACTUAL session duration, not scheduled.
      raw_minutes = (Job.actual_end - Job.actual_start) in whole minutes
      # Half-day / full-day minimum: appearance billed in whole hours, MINIMUM 2 hours,
      # rounded UP to the next whole hour for any partial hour.
      billable_hours = max(2, ceil(raw_minutes / 60))
      base = billable_hours * Resource.hourly_appearance_cents
      # Real-time surcharge: a REPORTER assignment on a requires_realtime job adds 20%.
      if Assignment.role == REPORTER and Job.requires_realtime:
        fee = round_half_up(base * 1.20)
      else:
        fee = base
      appearance_fee_cents = fee
    input_set: "One COMPLETED Assignment + its parent Job actual_start/actual_end + the Resource rate."
    constants:
      MIN_BILLABLE_HOURS: 2
      REALTIME_SURCHARGE_PCT: 0.20
    precision: "cents are integers; the 1.20 multiply uses round_half_up to nearest cent"
    variants:
      - name: estimate
        when: "displayed before the job adjourns (provisional, for quotes)"
        difference: "uses (scheduled_end - scheduled_start) instead of actual times; same min/surcharge rules"
      - name: actual
        when: "frozen at ADJOURNED onto Assignment.appearance_fee_cents"
        difference: "uses actual_start/actual_end; the authoritative billed value"

  - name: compute_page_charge
    trigger: "Invoice issue; reads the linked TranscriptOrder"
    algorithm: tiered_pricing
    formula: |
      pages = TranscriptOrder.final_pages   # at issue time the transcript is DELIVERED so final_pages is set
      # Base per-page rate by jurisdiction (via job.case.jurisdiction).
      base_rate = JURISDICTION_PAGE_RATE_CENTS[jurisdiction]
      # Volume tier: marginal rates on a per-page tier ladder (NOT average).
      #   pages 1..50      -> base_rate
      #   pages 51..150    -> base_rate * 0.90  (10% off the marginal pages)
      #   pages 151+       -> base_rate * 0.80
      tier1 = min(pages, 50)
      tier2 = max(0, min(pages, 150) - 50)
      tier3 = max(0, pages - 150)
      page_base = tier1*base_rate + tier2*round_half_up(base_rate*0.90) + tier3*round_half_up(base_rate*0.80)
      # Expedite multiplier applied AFTER the tier sum (evaluation order pinned).
      multiplier = TURNAROUND_MULTIPLIER[TranscriptOrder.turnaround_tier]
      page_charge = round_half_up(page_base * multiplier)
      # Certified flat fee added AFTER multiplier (not multiplied).
      if TranscriptOrder.certified_copy: page_charge += CERTIFICATION_FLAT_CENTS
      page_subtotal_cents = page_charge
    input_set: "Single TranscriptOrder.final_pages, its turnaround_tier, certified_copy, and the case jurisdiction."
    constants:
      JURISDICTION_PAGE_RATE_CENTS: { FEDERAL: 380, STATE_CA: 325, STATE_NY: 400, STATE_TX: 300 }
      TURNAROUND_MULTIPLIER: { STANDARD: 1.00, EXPEDITE_14: 1.25, EXPEDITE_7: 1.50, EXPEDITE_3: 2.00, DAILY: 3.00 }
      CERTIFICATION_FLAT_CENTS: 2500
      TIER2_MARGINAL_PCT: 0.90
      TIER3_MARGINAL_PCT: 0.80
      TIER1_MAX_PAGE: 50
      TIER2_MAX_PAGE: 150
    precision: "round_half_up to whole cents; per-tier marginal rate rounded BEFORE multiplying by tier page count, then tier products summed, then expedite multiplier, then flat fee"
    variants:
      - name: provisional_quote
        when: "shown at order time before production"
        difference: "uses TranscriptOrder.estimated_pages instead of final_pages; same tier+multiplier+flat logic"
      - name: final_billed
        when: "frozen at Invoice issue"
        difference: "uses final_pages (set at CERTIFY); the authoritative billed value"

  - name: compute_exhibit_charge
    trigger: "Invoice issue; reads the transcript's exhibits"
    algorithm: aggregation
    formula: |
      # Sum exhibit pages across ALL exhibits on the transcript (confidential included in billing,
      # only excluded from e-delivery bundles). Round once at the end (sum-then-rate), NOT per exhibit.
      total_exhibit_pages = sum(e.page_count for e in Exhibits where e.transcript_order_id == TranscriptOrder.id)
      exhibit_subtotal_cents = total_exhibit_pages * EXHIBIT_PAGE_RATE_CENTS
    input_set: "All Exhibits on the transcript_order_id (no status filter; exhibits have no lifecycle)."
    constants:
      EXHIBIT_PAGE_RATE_CENTS: 75
    precision: "integer cents; single multiply, no intermediate rounding"

  - name: compute_invoice_total
    trigger: "Invoice issue; reconciles the three subtotals"
    algorithm: aggregation
    formula: |
      appearance_subtotal_cents = sum(a.appearance_fee_cents
                                      for a in Assignments
                                      where a.job_id == Invoice.job_id and a.status == COMPLETED)
      page_subtotal_cents    = compute_page_charge(TranscriptOrder)
      exhibit_subtotal_cents = compute_exhibit_charge(TranscriptOrder)
      total_cents = appearance_subtotal_cents + page_subtotal_cents + exhibit_subtotal_cents
    input_set: "COMPLETED assignments on the job + the single linked transcript order + its exhibits."
    constants: {}
    precision: "integer cents; pure addition of already-rounded subtotals"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right in path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: auth
    check: "For Attorney-acting transitions (errata, sign, cancel transcript), acting X-User-ID == ordering_attorney_id OR == the job's case noticing_attorney_id"
    error_id: ERR_NOT_CASE_PARTY
    http_status: 403
    applies_to: "POST /transcript-orders/{id}/errata, /sign, /cancel"

  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Assignment.role must equal the referenced Resource.kind"
    error_id: ERR_ROLE_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /jobs/{id}/assignments"

  - priority: 7
    category: business_constraint
    check: "Cannot assign an INACTIVE resource (Resource.active == false) to a new Assignment"
    error_id: ERR_RESOURCE_INACTIVE
    http_status: 422
    applies_to: "POST /jobs/{id}/assignments"

  - priority: 8
    category: business_constraint
    check: "At most one ACTIVE Assignment per role per job (no duplicate REPORTER/VIDEOGRAPHER/INTERPRETER)"
    error_id: ERR_ROLE_ALREADY_FILLED
    http_status: 422
    applies_to: "POST /jobs/{id}/assignments"

  - priority: 9
    category: business_constraint
    check: "If role==INTERPRETER, the Resource.certifications must contain the Job.interpreter_language"
    error_id: ERR_INTERPRETER_LANGUAGE_MISMATCH
    http_status: 422
    applies_to: "POST /jobs/{id}/assignments"

  - priority: 10
    category: business_constraint
    check: "If role==REPORTER and Job.requires_realtime, the Resource.realtime_capable must be true"
    error_id: ERR_REALTIME_NOT_CAPABLE
    http_status: 422
    applies_to: "POST /jobs/{id}/assignments"

  - priority: 11
    category: business_temporal
    check: "Resource has no other ACTIVE assignment whose parent job's [scheduled_start, scheduled_end) half-open interval overlaps this job's window (touching endpoints do NOT overlap)"
    error_id: ERR_RESOURCE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /jobs/{id}/assignments"

  - priority: 12
    category: business_temporal
    check: "REPORTER assignments additionally require a 30-minute travel buffer between adjacent job windows on the same resource (gap < 30 min between one job's end and the next job's start is a conflict, even though the raw intervals do not overlap)"
    error_id: ERR_REPORTER_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /jobs/{id}/assignments"

  - priority: 13
    category: business_temporal
    check: "Job.scheduled_end must be strictly after Job.scheduled_start"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /jobs"

  - priority: 14
    category: business_constraint
    check: "TranscriptOrder may only be created when its job_id Job.status == ADJOURNED"
    error_id: ERR_JOB_NOT_ADJOURNED
    http_status: 422
    applies_to: "POST /transcript-orders"

  - priority: 15
    category: business_constraint
    check: "Certify requires final_pages >= 1; errata corrections array non-empty; estimated_pages >= 0"
    error_id: ERR_INVALID_PAGE_COUNT
    http_status: 422
    applies_to: "POST /transcript-orders/{id}/certify, POST /transcript-orders/{id}/errata"

  - priority: 16
    category: business_temporal
    check: "Errata may only be filed while logical clock < TranscriptOrder.read_sign_deadline"
    error_id: ERR_READ_SIGN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /transcript-orders/{id}/errata"

  - priority: 17
    category: business_referential
    check: "Exhibit.marked_label must be unique within its transcript_order_id"
    error_id: ERR_DUPLICATE_EXHIBIT_LABEL
    http_status: 409
    applies_to: "POST /transcript-orders/{id}/exhibits"

  - priority: 18
    category: business_fiscal
    check: "Invoice issue requires total_cents > 0 and linked TranscriptOrder.status == DELIVERED"
    error_id: ERR_INVOICE_NOT_READY
    http_status: 409
    applies_to: "POST /invoices/{id}/issue"

  - priority: 19
    category: business_constraint
    check: "OCC: expected_job_version must equal current Job.version on assignment create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /jobs/{id}/assignments"

  - priority: 20
    category: business_constraint
    check: "Required body fields present and well-typed; enum values in declared sets; docket_number/email/attorney uniqueness"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT endpoints"

  - priority: 21
    category: business_referential
    check: "docket_number unique across Cases; Attorney.email unique across Attorneys"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /cases, POST /attorneys"

  - priority: 22
    category: business_constraint
    check: "Realtime stream provisioning requires the job to be IN_SESSION with requires_realtime==true, and the referenced reporter_assignment_id to be an ACTIVE REPORTER assignment whose Resource.realtime_capable==true"
    error_id: ERR_REALTIME_NOT_PROVISIONABLE
    http_status: 422
    applies_to: "POST /jobs/{id}/realtime-streams"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Cases ----
  - method: POST
    path: "/cases"
    description: "Create a case file."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 201
    input: [caption, docket_number, jurisdiction, noticing_attorney_id]
    output: Case
    side_effects: ["validates docket_number uniqueness; verifies noticing_attorney_id exists"]
  - method: GET
    path: "/cases/{id}"
    description: "Fetch a case."
    roles: [ScheduleCoordinator, BillingClerk, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/cases"
    description: "List cases; filter by noticing_attorney_id."
    roles: [ScheduleCoordinator, BillingClerk, Attorney, PlatformAdmin]
    code: 200
    input: ["noticing_attorney_id?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: GET
    path: "/cases/{id}/jobs"
    description: "List jobs under a case (FK reverse-reachability for Job.case_id)."
    roles: [ScheduleCoordinator, BillingClerk, Attorney, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Job[]
    side_effects: []

  # ---- Attorneys ----
  - method: POST
    path: "/attorneys"
    description: "Register an attorney party."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 201
    input: [full_name, firm_name, bar_state, email]
    output: Attorney
    side_effects: ["validates email uniqueness"]
  - method: GET
    path: "/attorneys/{id}"
    description: "Fetch an attorney."
    roles: [ScheduleCoordinator, BillingClerk, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: Attorney
    side_effects: []
  - method: GET
    path: "/attorneys"
    description: "List attorneys; filter by email."
    roles: [ScheduleCoordinator, BillingClerk, PlatformAdmin]
    code: 200
    input: ["email?", "limit?", "offset?"]
    output: Attorney[]
    side_effects: []

  # ---- Resources ----
  - method: POST
    path: "/resources"
    description: "Register a reporter / videographer / interpreter."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 201
    input: ["full_name", "kind", "certifications?", "realtime_capable?", "hourly_appearance_cents"]
    output: Resource
    side_effects: ["active defaults to true"]
  - method: GET
    path: "/resources/{id}"
    description: "Fetch a resource."
    roles: [ScheduleCoordinator, BillingClerk, PlatformAdmin]
    code: 200
    input: []
    output: Resource
    side_effects: []
  - method: GET
    path: "/resources"
    description: "List resources; filter by kind."
    roles: [ScheduleCoordinator, BillingClerk, PlatformAdmin]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: Resource[]
    side_effects: []
  - method: POST
    path: "/resources/{id}/deactivate"
    description: "Mark a resource INACTIVE (active=false); keeps existing assignments."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Resource
    side_effects: ["Resource.active = false; increments Resource.version"]
  - method: GET
    path: "/resources/{id}/assignments"
    description: "List assignments for a resource (FK reverse-reachability for Assignment.resource_id)."
    roles: [ScheduleCoordinator, BillingClerk, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  # ---- Jobs ----
  - method: POST
    path: "/jobs"
    description: "Create (notice) a deposition job."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 201
    input: ["case_id", "deponent_name", "scheduled_start", "scheduled_end", "requires_videographer?", "requires_interpreter?", "interpreter_language?", "requires_realtime?"]
    output: Job
    side_effects: ["status=NOTICED; staffing_posture=UNSTAFFED; validates time window"]
  - method: GET
    path: "/jobs/{id}"
    description: "Fetch a job with derived staffing_posture."
    roles: [ScheduleCoordinator, BillingClerk, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: Job
    side_effects: []
  - method: GET
    path: "/jobs"
    description: "List jobs; filter by case_id and status."
    roles: [ScheduleCoordinator, BillingClerk, Attorney, PlatformAdmin]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: Job[]
    side_effects: []
  - method: POST
    path: "/jobs/{id}/assignments"
    description: "Assign a resource to a job (OCC-guarded on Job.version)."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 201
    input: [resource_id, role, expected_job_version]
    output: Assignment
    side_effects: ["creates ACTIVE Assignment; recompute Job.staffing_posture; increments Job.version by 1"]
  - method: GET
    path: "/jobs/{id}/assignments"
    description: "List assignments on a job (FK reverse-reachability for Assignment.job_id)."
    roles: [ScheduleCoordinator, BillingClerk, Attorney, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: POST
    path: "/jobs/{id}/confirm"
    description: "Confirm a fully-staffed job."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 200
    input: [expected_job_version]
    output: Job
    side_effects: ["status NOTICED->CONFIRMED; increments Job.version by 1"]
  - method: POST
    path: "/jobs/{id}/start"
    description: "Open the deposition session."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 200
    input: [expected_job_version]
    output: Job
    side_effects: ["status CONFIRMED->IN_SESSION; sets actual_start=clock; increments Job.version by 1"]
  - method: POST
    path: "/jobs/{id}/adjourn"
    description: "Close the session; completes assignments and computes appearance fees."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 200
    input: [expected_job_version]
    output: Job
    side_effects: ["status IN_SESSION->ADJOURNED; sets actual_end; cascade assignments ACTIVE->COMPLETED; compute_appearance_fee per assignment; cascade any STARTING/LIVE RealtimeStream->STOPPED; increments Job.version by 1"]
  - method: POST
    path: "/jobs/{id}/cancel"
    description: "Cancel a job; releases all active assignments."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 200
    input: [expected_job_version]
    output: Job
    side_effects: ["status->CANCELLED; cascade ACTIVE assignments->RELEASED; staffing_posture->UNSTAFFED; increments Job.version by 1"]
  - method: GET
    path: "/jobs/{id}/appearance-estimate"
    description: "Computed read: provisional appearance fees using scheduled (not actual) times."
    roles: [ScheduleCoordinator, BillingClerk, PlatformAdmin]
    code: 200
    input: []
    output: "{ estimated_total_cents: integer, lines: object }"
    side_effects: []

  # ---- Assignments (peer) ----
  - method: GET
    path: "/assignments/{id}"
    description: "Fetch an assignment."
    roles: [ScheduleCoordinator, BillingClerk, PlatformAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: POST
    path: "/assignments/{id}/release"
    description: "Release an active assignment (frees the resource window)."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status ACTIVE->RELEASED; recompute parent Job.staffing_posture; increments Job.version by 1"]

  # ---- Realtime Streams ----
  - method: POST
    path: "/jobs/{id}/realtime-streams"
    description: "Provision a realtime stream for an in-session realtime job, bound to its active realtime-capable reporter assignment."
    roles: [ScheduleCoordinator, Reporter, PlatformAdmin]
    code: 201
    input: [reporter_assignment_id]
    output: RealtimeStream
    side_effects: ["creates RealtimeStream status=STARTING; validates job IN_SESSION + requires_realtime + assignment realtime-capable"]
  - method: GET
    path: "/jobs/{id}/realtime-streams"
    description: "List realtime streams on a job (FK reverse-reachability for RealtimeStream.job_id)."
    roles: [ScheduleCoordinator, Reporter, BillingClerk, Attorney, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RealtimeStream[]
    side_effects: []
  - method: GET
    path: "/realtime-streams/{id}"
    description: "Fetch a realtime stream."
    roles: [ScheduleCoordinator, Reporter, BillingClerk, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: RealtimeStream
    side_effects: []
  - method: GET
    path: "/realtime-streams"
    description: "List realtime streams; filter by job_id and reporter_assignment_id (FK reverse-reachability for RealtimeStream.reporter_assignment_id)."
    roles: [ScheduleCoordinator, Reporter, BillingClerk, PlatformAdmin]
    code: 200
    input: ["job_id?", "reporter_assignment_id?", "status?", "limit?", "offset?"]
    output: RealtimeStream[]
    side_effects: []
  - method: POST
    path: "/realtime-streams/{id}/go-live"
    description: "Take a provisioned stream LIVE; mints the access_token and sets started_at."
    roles: [Reporter, PlatformAdmin]
    code: 200
    input: []
    output: RealtimeStream
    side_effects: ["status STARTING->LIVE; sets started_at=clock; mints access_token"]
  - method: POST
    path: "/realtime-streams/{id}/stop"
    description: "Stop a live stream."
    roles: [Reporter, ScheduleCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: RealtimeStream
    side_effects: ["status {STARTING,LIVE}->STOPPED; sets stopped_at=clock"]

  # ---- Transcript Orders ----
  - method: POST
    path: "/transcript-orders"
    description: "Order a transcript for an adjourned job."
    roles: [Attorney, ScheduleCoordinator, PlatformAdmin]
    code: 201
    input: ["job_id", "ordering_attorney_id", "turnaround_tier", "certified_copy?", "estimated_pages"]
    output: TranscriptOrder
    side_effects: ["status=ORDERED; validates job ADJOURNED"]
  - method: GET
    path: "/transcript-orders/{id}"
    description: "Fetch a transcript order."
    roles: [Attorney, ScheduleCoordinator, BillingClerk, Reporter, PlatformAdmin]
    code: 200
    input: []
    output: TranscriptOrder
    side_effects: []
  - method: GET
    path: "/transcript-orders"
    description: "List transcript orders; filter by job_id and ordering_attorney_id."
    roles: [Attorney, ScheduleCoordinator, BillingClerk, PlatformAdmin]
    code: 200
    input: ["job_id?", "ordering_attorney_id?", "status?", "limit?", "offset?"]
    output: TranscriptOrder[]
    side_effects: []
  - method: GET
    path: "/transcript-orders/{id}/quote"
    description: "Computed read: provisional page-charge quote using estimated_pages."
    roles: [Attorney, ScheduleCoordinator, BillingClerk, PlatformAdmin]
    code: 200
    input: []
    output: "{ provisional_page_cents: integer, exhibit_cents: integer }"
    side_effects: []
  - method: POST
    path: "/transcript-orders/{id}/deliver-rough"
    description: "Reporter delivers the rough draft."
    roles: [Reporter, PlatformAdmin]
    code: 200
    input: []
    output: TranscriptOrder
    side_effects: ["status ORDERED->ROUGH_DELIVERED"]
  - method: POST
    path: "/transcript-orders/{id}/certify"
    description: "Reporter certifies; sets final_pages and 30-day read-sign deadline."
    roles: [Reporter, PlatformAdmin]
    code: 200
    input: [final_pages]
    output: TranscriptOrder
    side_effects: ["status ROUGH_DELIVERED->CERTIFIED; final_pages set; read_sign_deadline=clock+30d"]
  - method: POST
    path: "/transcript-orders/{id}/open-read-sign"
    description: "Open (or re-open) the read-and-sign window."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: TranscriptOrder
    side_effects: ["status {CERTIFIED,ERRATA_FILED}->READ_SIGN_OPEN"]
  - method: POST
    path: "/transcript-orders/{id}/errata"
    description: "Deponent's party files an errata sheet (cyclic)."
    roles: [Attorney, PlatformAdmin]
    code: 201
    input: [corrections, reason]
    output: Errata
    side_effects: ["creates Errata round=errata_round+1; increments errata_round; status READ_SIGN_OPEN->ERRATA_FILED"]
  - method: POST
    path: "/transcript-orders/{id}/sign"
    description: "Deponent's party signs the transcript."
    roles: [Attorney, PlatformAdmin]
    code: 200
    input: []
    output: TranscriptOrder
    side_effects: ["status READ_SIGN_OPEN->SIGNED"]
  - method: POST
    path: "/transcript-orders/{id}/finalize-deadline"
    description: "After clock passes read_sign_deadline, auto-waive signature and mark SIGNED."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: TranscriptOrder
    side_effects: ["status {CERTIFIED,READ_SIGN_OPEN,ERRATA_FILED}->SIGNED when clock>=read_sign_deadline"]
  - method: POST
    path: "/transcript-orders/{id}/deliver"
    description: "E-deliver the signed transcript bundle to the ordering attorney."
    roles: [ScheduleCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: TranscriptOrder
    side_effects: ["status SIGNED->DELIVERED"]
  - method: POST
    path: "/transcript-orders/{id}/cancel"
    description: "Cancel an un-certified transcript order."
    roles: [Attorney, PlatformAdmin]
    code: 200
    input: []
    output: TranscriptOrder
    side_effects: ["status {ORDERED,ROUGH_DELIVERED}->CANCELLED"]

  # ---- Exhibits ----
  - method: POST
    path: "/transcript-orders/{id}/exhibits"
    description: "Attach an exhibit to a transcript."
    roles: [Attorney, ScheduleCoordinator, Reporter, PlatformAdmin]
    code: 201
    input: ["marked_label", "page_count", "confidential?"]
    output: Exhibit
    side_effects: ["validates marked_label uniqueness within transcript"]
  - method: GET
    path: "/transcript-orders/{id}/exhibits"
    description: "List exhibits on a transcript (FK reverse-reachability for Exhibit.transcript_order_id)."
    roles: [Attorney, ScheduleCoordinator, BillingClerk, Reporter, PlatformAdmin]
    code: 200
    input: ["confidential?", "limit?", "offset?"]
    output: Exhibit[]
    side_effects: []
  - method: GET
    path: "/exhibits/{id}"
    description: "Fetch an exhibit."
    roles: [Attorney, ScheduleCoordinator, BillingClerk, Reporter, PlatformAdmin]
    code: 200
    input: []
    output: Exhibit
    side_effects: []

  # ---- Errata ----
  - method: GET
    path: "/transcript-orders/{id}/errata"
    description: "List errata sheets on a transcript (FK reverse-reachability for Errata.transcript_order_id)."
    roles: [Attorney, ScheduleCoordinator, BillingClerk, Reporter, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Errata[]
    side_effects: []
  - method: GET
    path: "/errata/{id}"
    description: "Fetch an errata sheet."
    roles: [Attorney, ScheduleCoordinator, BillingClerk, PlatformAdmin]
    code: 200
    input: []
    output: Errata
    side_effects: []

  # ---- Invoices ----
  - method: POST
    path: "/invoices"
    description: "Create a draft invoice linking a job and its delivered transcript."
    roles: [BillingClerk, PlatformAdmin]
    code: 201
    input: ["job_id", "transcript_order_id", "bill_to_attorney_id?"]
    output: Invoice
    side_effects: ["status=DRAFT; subtotals computed as preview from current state"]
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an invoice."
    roles: [BillingClerk, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices; filter by job_id, transcript_order_id, bill_to_attorney_id."
    roles: [BillingClerk, Attorney, PlatformAdmin]
    code: 200
    input: ["job_id?", "transcript_order_id?", "bill_to_attorney_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Freeze and issue the invoice; recomputes all subtotals + total."
    roles: [BillingClerk, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status DRAFT->ISSUED; freeze appearance/page/exhibit subtotals + total_cents"]
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Mark an issued invoice paid."
    roles: [BillingClerk, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status ISSUED->PAID"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void a draft or issued invoice."
    roles: [BillingClerk, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status {DRAFT,ISSUED}->VOID"]

  # ---- Test-driving (clock) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute ISO8601 UTC instant. Startup default is 2026-01-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock set to to_iso8601 for all deadline/window evaluations"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role not permitted for this operation per RBAC."
  - id: ERR_NOT_CASE_PARTY
    http: 403
    condition: "Attorney acting on errata/sign/cancel is neither the ordering attorney nor the case noticing attorney."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path id or FK body field) does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, malformed type, or enum value outside declared set."
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "docket_number already used by another Case, or email by another Attorney."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the resource's current state."
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "Job.scheduled_end is not strictly after scheduled_start."
  - id: ERR_ROLE_KIND_MISMATCH
    http: 422
    condition: "Assignment.role does not equal the referenced Resource.kind."
  - id: ERR_RESOURCE_INACTIVE
    http: 422
    condition: "Attempt to newly assign a resource whose active==false."
  - id: ERR_ROLE_ALREADY_FILLED
    http: 422
    condition: "An ACTIVE assignment of the same role already exists on the job."
  - id: ERR_INTERPRETER_LANGUAGE_MISMATCH
    http: 422
    condition: "Interpreter resource certifications do not include the job's interpreter_language."
  - id: ERR_REALTIME_NOT_CAPABLE
    http: 422
    condition: "Reporter assigned to a requires_realtime job is not realtime_capable."
  - id: ERR_RESOURCE_DOUBLE_BOOKED
    http: 409
    condition: "Resource already has an ACTIVE assignment whose job window overlaps this job's half-open window."
  - id: ERR_REPORTER_BUFFER_CONFLICT
    http: 409
    condition: "Reporter assignment violates the 30-minute travel buffer between adjacent (non-overlapping) job windows."
  - id: ERR_JOB_NOT_ADJOURNED
    http: 422
    condition: "Transcript ordered against a job whose status is not ADJOURNED."
  - id: ERR_INVALID_PAGE_COUNT
    http: 422
    condition: "final_pages < 1 on certify, empty corrections on errata, or estimated_pages < 0."
  - id: ERR_READ_SIGN_WINDOW_CLOSED
    http: 409
    condition: "Errata filed at/after the read_sign_deadline."
  - id: ERR_DUPLICATE_EXHIBIT_LABEL
    http: 409
    condition: "Exhibit marked_label already used within the same transcript order."
  - id: ERR_INVOICE_NOT_READY
    http: 409
    condition: "Invoice issue attempted with total_cents == 0 or linked transcript not DELIVERED."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_job_version does not match the current Job.version on an OCC-guarded write."
  - id: ERR_REALTIME_NOT_PROVISIONABLE
    http: 422
    condition: "Realtime stream provisioning attempted on a job not IN_SESSION/not requires_realtime, or without an ACTIVE realtime-capable REPORTER assignment."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic business-rule violation not covered by a more specific 422 error."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ScheduleCoordinator
    description: "Owns scheduling: cases, jobs, assignments, job lifecycle, read-sign window control, transcript delivery."
    identity: "opaque"
    exclusive_operations:
      - "POST /jobs (notice)"
      - "POST /jobs/{id}/assignments"
      - "POST /assignments/{id}/release"
      - "POST /jobs/{id}/confirm"
      - "POST /jobs/{id}/start"
      - "POST /jobs/{id}/adjourn"
      - "POST /jobs/{id}/cancel"
      - "POST /transcript-orders/{id}/open-read-sign"
      - "POST /transcript-orders/{id}/finalize-deadline"
      - "POST /transcript-orders/{id}/deliver"
    shared_operations:
      - "POST /cases, POST /attorneys, POST /resources"
      - "POST /transcript-orders (on behalf of attorney)"
      - "POST /transcript-orders/{id}/exhibits"
      - "POST /jobs/{id}/realtime-streams, POST /realtime-streams/{id}/stop"
      - "GET reads across cases/jobs/resources/assignments/transcripts/exhibits/errata/realtime-streams"

  - name: Reporter
    description: "Court reporter resource actor: delivers rough draft and certifies transcripts for jobs they covered; drives the realtime feed."
    identity: "entity_backed:Resource"
    exclusive_operations:
      - "POST /transcript-orders/{id}/deliver-rough"
      - "POST /transcript-orders/{id}/certify"
      - "POST /realtime-streams/{id}/go-live"
    shared_operations:
      - "POST /transcript-orders/{id}/exhibits"
      - "POST /jobs/{id}/realtime-streams, POST /realtime-streams/{id}/stop"
      - "GET /transcript-orders/{id}, /exhibits, /errata, /realtime-streams"

  - name: Attorney
    description: "Noticing/ordering party: orders transcripts, files errata, signs, cancels un-certified orders."
    identity: "entity_backed:Attorney"
    exclusive_operations:
      - "POST /transcript-orders/{id}/errata"
      - "POST /transcript-orders/{id}/sign"
      - "POST /transcript-orders/{id}/cancel"
    shared_operations:
      - "POST /transcript-orders (order own case's transcript)"
      - "POST /transcript-orders/{id}/exhibits"
      - "GET reads on own cases/jobs/transcripts/invoices"

  - name: BillingClerk
    description: "Owns invoicing: create, issue, pay, void invoices."
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices"
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/pay"
      - "POST /invoices/{id}/void"
    shared_operations:
      - "GET reads across jobs/assignments/transcripts/exhibits/invoices"

  - name: PlatformAdmin
    description: "Operational superset: seeding, resource deactivation, logical clock, and any role's operations."
    identity: "opaque"
    exclusive_operations:
      - "POST /resources/{id}/deactivate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "ALL business operations of every other role (operational override)"
