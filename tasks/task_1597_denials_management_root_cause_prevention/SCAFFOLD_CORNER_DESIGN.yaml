              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2204", patient_account_number: "PA-2204", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 120000, denied_amount_cents: 100000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "CLINICAL_NOTES", file_reference: "doc-2204-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/submit"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/record-outcome"
              payload: { outcome: "OVERTURNED", recovered_amount_cents: 100000 }
              as: DenialsSpecialist
          trigger:
            - call: "GET /rcm/denial-cases/${d1}"
              payload: {}
              as: DenialsSpecialist
              captures: { score: $.data.priority_score, bucket: $.data.queue_bucket }
            - call: "GET /rcm/work-queue"
              payload: {}
              as: DenialsSpecialist
              captures: { queue_rows: $.data }
          assert:
            - "priority_score == 0.00 and queue_bucket == LOW for the RESOLVED_PAID denial"
            - "GET /rcm/work-queue returns an empty data array (terminal denial excluded)"

      - name: recovery_projection_after_level_one
        claim_type: variant_divergence
        grounds: [calculations.expected_recovery_value]
        distinguishing_aspect: "With a level-1 appeal open (current_appeal_level 1), remaining_levels == 2: gross 100000 vs net 90000 (100000 - 5000*2); omitting variant defaults to gross."
        test_recipe:
          setup: ["payer A with level-1 policy; code CO-16; denial CLM-2205 (denied 200000) QUEUED with a level-1 appeal created (DRAFT); fresh payer -> rate 0.50"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2205", patient_account_number: "PA-2205", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 220000, denied_amount_cents: 200000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
          trigger:
            - call: "GET /rcm/denial-cases/${d1}/recovery-projection"
