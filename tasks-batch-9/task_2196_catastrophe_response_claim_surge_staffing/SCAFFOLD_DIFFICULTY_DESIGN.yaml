  - rule_id: boundary_precision_check
    instances:
      - name: advance_headroom_exact_zero_cents_rejected_one_cent_accepted
        grounds:
          - validations[priority=39]
          - calculations.advance_payment_amount
          - errors[ERR_ADVANCE_CAP_EXCEEDED]
          - endpoints[POST /advance-payments]
        distinguishing_aspect: |
          Metric: money headroom in cents, probed at POST /advance-payments. The rule is
          round(advance_cap - advance_paid_total, 2) > 0.00 — STRICT. The probe walks the last cent:
          headroom 0.01 is accepted (and the waterfall clamps a 500.00 request down to 0.01), headroom
          exactly 0.00 is rejected. Distinct from the other two boundary instances in both metric (2dp
          currency) and endpoint.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One CatastropheEvent 'CAT-2026-601' in DECLARED: EARTHQUAKE, CA, expected_severity_index 0.0500."
            - "One Claim TRIAGED at CAT_SEVERE: reported_loss_amount 25000, one DWELLING line limit 25000 / deductible 5000 / estimated_damage 25000."
            - "Severity: exposure_ratio 25000/25000 = 1.0 -> base 100.00; raw = 100.00*1.30 + 0.0 + 0.0 + 20.0*0.0500 = 131.00 -> clamped to 100.00 -> CAT_SEVERE."
            - "advance_cap: line_eligible = min(25000,25000)-5000 = 20000.00; line_advance = round(20000.00*0.30,2) = 6000.00; tiered = round(6000.00*1.00,2) = 6000.00; no mandate bulletin, so mandate_floor 0.00 and advance_cap == 6000.00."
            - "initial_case_reserve: eligible_damage 20000.00, basis = max(25000, 20000) = 25000 -> round(25000*0.85,2) = 21250.00."
            - "Probe 1 (headroom 6000.00, well inside): request 5999.99 -> amount 5999.99, advance_paid_total 5999.99."
            - "Probe 2 (headroom exactly 0.01, the last accepting value): request 500.00 -> amount = min(500.00, 0.01) = 0.01, advance_paid_total 6000.00."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-601", peril_type: "EARTHQUAKE", jurisdiction_state: "CA", event_start_utc: "2026-07-29T00:00:00.000Z", exposure_count: 300, avg_insured_value: 500000, expected_severity_index: 0.0500 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-6101", loss_state: "CA", loss_date_utc: "2026-07-29T00:00:00.000Z", reported_loss_amount: 25000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 25000, deductible_amount: 5000, estimated_damage_amount: 25000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "POST /advance-payments"
              payload: { claim_id: "${cl}", requested_amount: 5999.99, basis: "STRUCTURE_PARTIAL" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { adv1: $.data.id, adv1_amount: $.data.amount }
            - call: "POST /advance-payments"
              payload: { claim_id: "${cl}", requested_amount: 500.00, basis: "STRUCTURE_PARTIAL" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { adv2: $.data.id, adv2_amount: $.data.amount }
          trigger:
            - call: "POST /advance-payments"
              payload: { claim_id: "${cl}", requested_amount: 0.01, basis: "STRUCTURE_PARTIAL" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "AdvancePayment.${adv1}.amount == 5999.99"
            - "AdvancePayment.${adv2}.amount == 0.01   # request was 500.00; the waterfall min() clamped to the last cent of headroom"
            - "Claim.${cl}.advance_cap == 6000.00"
            - "Claim.${cl}.advance_paid_total == 6000.00"
            - "response.data.error_id == ERR_ADVANCE_CAP_EXCEEDED"
            - "response HTTP status == 422"
            - "Claim.${cl}.advance_paid_total == 6000.00 after the rejected call (no partial write)"
            - "Claim.${cl}.paid_amount == 6000.00"
            - "Claim.${cl}.case_reserve == 15250.00   # 21250.00 - 5999.99 - 0.01"
            - "CatastropheEvent.${ev}.incurred_total == 21250.00"
            - "GET /advance-payments?claim_id=${cl} returns exactly 2 rows"

      - name: housing_block_rooms_total_zero_cannot_open_one_can
        grounds:
          - validations[priority=36]
          - errors[ERR_HOUSING_BLOCK_EMPTY]
          - entities.HousingBlock.rooms_total
          - endpoints[POST /housing-blocks/{housingBlockId}/open]
        distinguishing_aspect: |
          Metric: integer room count, probed at POST /housing-blocks/{housingBlockId}/open. rooms_total
          is legal at 0 on creation (declared range 0..400), so the boundary lives entirely on the open
          transition: rooms_total >= 1 opens, rooms_total == 0 is permanently unopenable. Different metric
