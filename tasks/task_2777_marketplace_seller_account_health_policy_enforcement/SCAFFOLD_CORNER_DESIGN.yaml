      - name: validation_override_must_be_strictly_more_severe_than_the_rung
        claim_type: violation_to_error
        grounds:
          - "validations.priority_100 (ERR_OVERRIDE_NOT_MORE_SEVERE)"
          - "calculations.enforcement_ladder_rung.formula (override rules)"
          - "entities.EnforcementAction.fields.override_applied"
        distinguishing_aspect: |
          Three overrides against the same computed rung LISTING_REMOVAL: the milder WARNING is
          refused, the EQUAL LISTING_REMOVAL is also refused (the comparison is strict, not >=), and
          only the strictly more severe ACCOUNT_SUSPENSION is accepted — at which point
          override_applied becomes true and action_type diverges from ladder_rung_computed. The two
          refusals leave the violation SUBSTANTIATED and issuable, so the third attempt is not
          blocked by ERR_ACTION_ALREADY_EXISTS.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule SP-OVR-1 (SHIPPING_PERFORMANCE, base 8.00, ACCOUNT, requires_poa false)."
            - "One violation carried to SUBSTANTIATED; prior_balance 0.00, severity 8.00, post_balance 8.00 -> ladder_rung_computed LISTING_REMOVAL (4.00 <= 8.00 < 12.00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "SP-OVR-1", category: "SHIPPING_PERFORMANCE", base_severity_weight: 8.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_sp: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_sp}", reporter_type: "PLATFORM_AUTOMATION", evidence_reference: "EV-OVR-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
          trigger:
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}", action_type_override: "WARNING" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { err_milder: $.data.error_id }
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}", action_type_override: "LISTING_REMOVAL" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { err_equal: $.data.error_id }
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}", action_type_override: "ACCOUNT_SUSPENSION" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id, a1_type: $.data.action_type, a1_rung: $.data.ladder_rung_computed, a1_override: $.data.override_applied }
          assert:
            - "first call: HTTP 422 and ${err_milder} == ERR_OVERRIDE_NOT_MORE_SEVERE"
            - "second call: HTTP 422 and ${err_equal} == ERR_OVERRIDE_NOT_MORE_SEVERE   # equal is not more severe"
            - "third call: HTTP 201"
            - "${a1_rung} == LISTING_REMOVAL and ${a1_type} == ACCOUNT_SUSPENSION and ${a1_override} == true"
            - "EnforcementAction.${a1}.severity_points_applied == 8.00 and prior_balance == 0.00 and post_balance == 8.00"
            - "Seller.${s_id}.severity_points_balance == 8.00"
            - "Seller.${s_id}.enforcement_state == SUSPENDED   # from the ACCOUNT_SUSPENSION action, not from the 8.00 balance"
            - "Seller.${s_id}.disbursement_state == FULL_HOLD"
            - "exactly one EnforcementAction exists for ${v1}"

      - name: validation_repeat_offender_cannot_be_reinstated
        claim_type: violation_to_error
        grounds:
          - "validations.priority_100 (ERR_REPEAT_OFFENSE_DENIAL)"
          - "calculations.repeat_offense_count.formula"
