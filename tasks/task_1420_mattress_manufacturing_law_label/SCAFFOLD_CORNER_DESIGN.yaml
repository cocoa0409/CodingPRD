        distinguishing_aspect: ""
        excluded_because:
          difficulty_instance: foam_mass_conservation
          rationale: "The compensating release of reserved foam on cancel is asserted there (${av2} == 100 and ${rs2} == 0 after cancel)."

      - name: revoke_depth3_cascade_full_chain
        claim_type: cross_entity
        grounds: ["state_machines.ComplianceCertificate.APPROVED_to_REVOKED"]
        distinguishing_aspect: ""
        excluded_because:
          difficulty_instance: certificate_revoke_depth3_cascade
          rationale: "Hop-by-hop cascade (model → labels → orders) is asserted there."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: cure_memory_class_cool_tier_constants
        claim_type: constants_applied
        grounds: ["calculations.cure_eligibility_time"]
        distinguishing_aspect: "MEMORY base 72h plus COOL-tier (+12h for ambient 10C) yields cure_eligible_at exactly 84h after start (2026-08-04T12:00:00Z) — verifying both constants tables engage."
        test_recipe:
          setup: ["MEMORY batch poured at default clock 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "MEMORY", poured_mass_kg: 100, chamber_id: "CH-M" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 10 }, as: LineSupervisor, as_user_id: ls-1, captures: { elig: $.data.cure_eligible_at } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T12:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1, captures: { st: $.data.status } }
          assert:
            - "${elig} == 2026-08-04T12:00:00Z"
            - "${st} == CURED"

      - name: chamber_capacity_ignores_quarantined_batches
        claim_type: input_set_filtering
        grounds: ["calculations.chamber_capacity_check"]
        distinguishing_aspect: "The chamber occupant set counts only CURING batches: with 3 CURING and the 4th rejected, quarantining one occupant frees a slot and the previously-rejected 4th batch then starts successfully."
        test_recipe:
          setup: ["b1,b2,b3 CURING in CH-F; b4 POURED in CH-F (rejected once already)"]
          setup_api_calls:
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 100, chamber_id: "CH-F" }, as: LineSupervisor, as_user_id: ls-1, captures: { b1: $.data.id } }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 100, chamber_id: "CH-F" }, as: LineSupervisor, as_user_id: ls-1, captures: { b2: $.data.id } }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 100, chamber_id: "CH-F" }, as: LineSupervisor, as_user_id: ls-1, captures: { b3: $.data.id } }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 100, chamber_id: "CH-F" }, as: LineSupervisor, as_user_id: ls-1, captures: { b4: $.data.id } }
            - { call: "POST /plant/foam-batches/${b1}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/foam-batches/${b2}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/foam-batches/${b3}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/foam-batches/${b4}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1, captures: { err_first: $.data.error_id } }
          trigger:
            - { call: "POST /plant/foam-batches/${b3}/quarantine", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "POST /plant/foam-batches/${b4}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1, captures: { st4: $.data.status } }
          assert:
            - "${err_first} == ERR_CHAMBER_CAPACITY_EXCEEDED"
            - "${st4} == CURING"

      - name: fulfillment_recompute_boundaries
        claim_type: correct_result
        grounds: ["calculations.fulfillment_recompute"]
        distinguishing_aspect: ""
        excluded_because:
          difficulty_instance: production_order_parallel_fulfillment_dimension
          rationale: "UNFULFILLED → PARTIALLY_SHIPPED → FULLY_SHIPPED → DELIVERED recompute is asserted stepwise there."

      - name: bom_rounding_order_correct_result
        claim_type: precision
        grounds: ["calculations.bom_material_cost"]
        distinguishing_aspect: ""
        excluded_because:
          difficulty_instance: bom_per_line_rounding_then_sum
          rationale: "Per-line-then-sum rounding pinned and asserted with literal values there."

      - name: fee_tier_boundary_correct_result
        claim_type: correct_result
        grounds: ["calculations.order_compliance_fee"]
        distinguishing_aspect: ""
        excluded_because:
          difficulty_instance: order_fee_tier_keyed_on_subtotal_not_total
          rationale: "Subtotal-keyed tiering and the inclusive 100000 boundary are asserted there."

      - name: recycling_variant_divergence_correct_result
        claim_type: correct_result
        grounds: ["calculations.recycling_credit"]
        distinguishing_aspect: ""
        excluded_because:
          difficulty_instance: recycling_provisional_vs_final_divergence
          rationale: "Provisional vs final amounts and the delta adjustment are asserted there."

      - name: warranty_variant_selection_correct_result
        claim_type: correct_result
        grounds: ["calculations.warranty_credit_amount"]
        distinguishing_aspect: ""
        excluded_because:
          difficulty_instance: warranty_full_replacement_vs_prorated_divergence
          rationale: "Variant selection at the 12-month boundary and both credit values are asserted there; the floor-binding case is in warranty_prorated_nested_floor_binding."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role fails at priority 1 with HTTP 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, before any role/existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plant/models", payload: {}, as: AnonymousNoHeader, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: forbidden_role_on_foam_pour
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", "roles.Retailer"]
        distinguishing_aspect: "A Retailer (entity-backed id) calling POST /plant/foam-batches is rejected with HTTP 403 ERR_FORBIDDEN_ROLE — Retailer is not in the endpoint's roles list."
        test_recipe:
          setup: ["retailer exists"]
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 100, chamber_id: "CH-1" }, as: Retailer, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"

      - name: path_existence_checked_left_to_right
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_MODEL_NOT_FOUND]"]
        distinguishing_aspect: "With both modelId and child scope invalid, the model lookup fails first: GET bom-lines under a non-existent model returns ERR_MODEL_NOT_FOUND, not a child-scope error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plant/models/00000000-0000-0000-0000-000000000000/bom-lines", payload: {}, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_MODEL_NOT_FOUND"

