  - section: calculations
    instances:
      - name: estimate_same_period_falls_back_to_trailing_without_year_prior_reads
        claim_type: variant_selection
        grounds: [calculations.estimate_read_value]
        distinguishing_aspect: "SAME_PERIOD_LAST_YEAR with fewer than 2 year-prior same-month reads silently falls back to TRAILING_AVERAGE and RECORDS the fallback on the read (estimation_method == TRAILING_AVERAGE, value 10270)."
        test_recipe:
          setup:
            - "AMI account with estimation_method SAME_PERIOD_LAST_YEAR but only 2026 reads (9700@2026-06-01, 10000@2026-07-01); meter DEGRADED; period window [2026-07-22..2026-07-28] WINDOW_OPEN; stop NO_READ_PENDING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "Fallback Tech" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "C-0050", service_address: "50 Fallback Ave", billing_cycle_code: "C50", estimation_method: "SAME_PERIOD_LAST_YEAR" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
