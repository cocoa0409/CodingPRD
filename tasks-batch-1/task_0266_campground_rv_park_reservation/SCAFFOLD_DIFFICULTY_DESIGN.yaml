              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30, turnover_buffer_days: 0 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-05", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { r1_id: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Operator
              captures: { site_v1: $.data.version }
          trigger:
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-04", check_out_date: "2026-08-09", expected_site_version: "${site_v1}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_DATE_OVERLAP"
            - "A back-to-back window 2026-08-05..2026-08-09 would instead succeed (half-open adjacency allowed)."

      - name: maintenance_hold_buffered_window_blocks_adjacent_reservation
        grounds:
          - validations[priority=10]
          - errors[ERR_MAINTENANCE_CONFLICT]
          - entities.MaintenanceHold.fields.start_date
          - entities.Site.fields.turnover_buffer_days
        distinguishing_aspect: |
          Resource = Site but DIFFERENT interval semantics than reservation overlap:
          a MaintenanceHold blocks a buffered closed window [start - buffer, end +
          buffer] (turnover_buffer_days=1), so a reservation merely ADJACENT to the
          raw hold dates still collides. Hold 08-10..08-12 with buffer 1 blocks
          08-09..08-13; a reservation 08-08..08-10 (ending on the buffered edge) is
          rejected ERR_MAINTENANCE_CONFLICT.
        test_recipe:
          setup:
            - "RV Site S turnover_buffer_days=1 with an ACTIVE MaintenanceHold 2026-08-10..2026-08-12."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
