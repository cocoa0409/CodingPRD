              as: ScopingSpecialist
              as_user_id: "ss-1"
              captures: { scope_b: $.data.id }
            - call: "POST /scope-definitions/${scope_b}/deliverables"
              payload: { title: "Lease pack B", sequence_no: 1, weight_pct: 100.00, hours_estimate: 40.00, acceptance_criteria: "Redlines delivered" }
              as: ScopingSpecialist
              as_user_id: "ss-1"
            - call: "POST /scope-definitions/${scope_b}/approve"
              payload: {}
              as: PartnerContact
              as_user_id: "${org}"
            - call: "POST /project-requests/${req_b}/match"
              payload: {}
              as: ScopingSpecialist
              as_user_id: "ss-1"
              captures: { offer_b: $.data.id }
            - call: "POST /match-offers/${offer_b}/accept"
              payload: {}
              as: Volunteer
              as_user_id: "${vol}"
              captures: { eng_b: $.data.id, eng_b_v0: $.data.version }
            - call: "POST /engagements/${eng_a}/agreements"
              payload: { expected_engagement_version: "${eng_a_v0}", ip_disposition: "ASSIGN_TO_PARTNER", confidentiality_tier: "STANDARD", indemnity_cap_usd: 10000.00 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { agr_a: $.data.id }
            - call: "POST /agreements/${agr_a}/send"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /agreements/${agr_a}/void"
              payload: { void_reason: "TERMS_REJECTED" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-12T00:00:00Z" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /engagements/${eng_b}/terminate"
              payload: { termination_reason: "ADMIN" }
              as: ProgramManager
              as_user_id: "pm-1"
          assert:
            - "Engagement.${eng_a}.work_status == TERMINATED and Engagement.${eng_a}.termination_reason == AGREEMENT_VOIDED"
            - "Engagement.${eng_b}.work_status == TERMINATED and Engagement.${eng_b}.termination_reason == ADMIN"
            - "Volunteer.${vol}.terminal_engagement_count == 2"
            - "Volunteer.${vol}.reliability_score == 0.4108"
            - "Volunteer.${vol}.reliability_score_lifetime == 0.4250"
            - "Volunteer.${vol}.reliability_score != Volunteer.${vol}.reliability_score_lifetime"
            - "Volunteer.${vol}.status == ACTIVE and Volunteer.${vol}.pause_reason IS NULL"
            - "Volunteer.${vol}.open_engagement_count == 0"
  - rule_id: combinatorial_formula
    instances:
      - name: match_score_mode_a_nonlinear_selector_ranking
        grounds:
          - calculations.match_score
          - entities.MatchOffer.fields.match_score
          - entities.SkillProfile.fields.verified
          - entities.AvailabilityWindow.fields.hours_remaining
          - state_machines.ProjectRequest.SCOPED_to_MATCHING
        distinguishing_aspect: |
          Mode (a): five inputs interact non-linearly - SKILL_TIER_WEIGHT lookup plus a boolean
          VERIFIED_SKILL_BONUS clamped by min(1.00, .), an availability ratio clamped by min(1.00, .),
          a shortfall penalty clamped by min(0.30, .), URGENCY_AVAILABILITY_WEIGHT switching on
          ProjectRequest.urgency, and a SENIORITY_MULTIPLIER applied after the penalty. The two
          candidates are pinned to the identical raw score 0.847500, so the winner is decided purely by
          the post-raw penalty/multiplier interaction: 0.7412 (ASSOCIATE, 6.00h short) versus 0.8475
          (SENIOR, no shortfall) - a linear or pre-multiplier implementation picks the wrong volunteer.
        test_recipe:
          setup:
            - "Cycle 2026-Q1 [2026-01-01, 2026-04-01) with 10 slots; LARGE partner; clock 2026-01-10T00:00:00Z."
            - "Volunteer A: ASSOCIATE, LEGAL_CONTRACTS proficiency 5, vetted WITH verification (verified true), one HARD window [2026-01-05, 2026-03-01) offering exactly 24.00 hours."
            - "Volunteer B: SENIOR, LEGAL_CONTRACTS proficiency 3, vetted WITHOUT verification (verified false), one HARD window [2026-01-05, 2026-03-01) offering 45.00 hours."
            - "Both volunteers carry the default reliability_score 0.7500 (no terminal engagements)."
            - "ProjectRequest urgency CRITICAL (URGENCY_AVAILABILITY_WEIGHT 0.45), scope estimated_hours 25.00 x complexity_factor 1.20 so required_hours = reserved_hours = 30.00."
