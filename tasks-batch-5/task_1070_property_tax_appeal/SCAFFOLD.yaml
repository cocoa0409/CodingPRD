scenario: "Property-Tax Appeal Firm (contingency): parcel & assessment analysis, comparable/evidence & valuation, appeal filing & hearing representation, contingency-fee (% of savings) & billing, deadline/jurisdiction tracking, exemption capture, client portal, multi-year"
domain_name: "property-tax-appeal"
api_prefix: "/api"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (Client, Analyst, Jurisdiction, FeeAgreement,
  # Parcel, Assessment, ExemptionClaim, Appeal, Evidence, Hearing, SettlementOffer,
  # Invoice, Payment). URLs are flat collections with FK fields in the body, plus a
  # few action/sub-resource paths; no deep nesting chain.

  state_machine_shape: branching
  # Appeal is a branching fork/join (FILED -> {INFORMAL_REVIEW, HEARING_SCHEDULED} ->
  # {DECIDED, SETTLED, WITHDRAWN}) with divergent side-effect sets per terminal branch;
  # SettlementOffer is cyclic (PROPOSED <-> COUNTERED negotiation rounds).

  relationship_patterns:
    - one_to_many        # Client->Parcel, Parcel->Assessment, Appeal->Evidence, Invoice->Payment
    - cross_aggregate    # Appeal transitions gate on Assessment/Hearing/FeeAgreement state

  role_model: segregation_of_duties
  # Analyst files/works appeals and creates settlement offers; a DIFFERENT Analyst must
  # accept a settlement offer (four-eyes); Billing (distinct from Analyst) issues invoices;
  # FirmAdmin configures jurisdictions/fee-agreements and voids invoices; Client is portal-only.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Analyst
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: analyst display name
      - name: email
        type: string
        source: input
        description: analyst login/contact email; unique
      - name: license_number
        type: string
        source: input
        description: state agent license number authorizing hearing representation
      - name: active
        type: boolean
        source: input
        description: whether the analyst may be assigned to appeals/hearings
        default: true

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: taxpayer / property-owner name
      - name: email
        type: string
        source: input
        description: portal login email; unique
      - name: entity_type
        type: enum
        source: input
        description: taxpayer kind
        constraints: "one of {INDIVIDUAL, BUSINESS}"
      - name: portal_enabled
        type: boolean
        source: input
        description: whether the client may authenticate to the portal
        default: true
      - name: lifetime_fees_billed_cents
        type: integer
        source: computed
        description: running sum of fee_amount_cents across this client's ISSUED (non-VOID) invoices; conserved-quantity ledger for compensating_invariant
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: sum of fee_amount_cents over ISSUED invoices minus sum of Payment.amount_cents applied; decremented on void and on payment
        default: 0

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: taxing/assessment jurisdiction name
      - name: state_code
        type: string
        source: input
        description: two-letter US state code
      - name: filing_window_days
        type: integer
        source: input
        description: number of days after an assessment notice_date within which an appeal may be filed (inclusive of the last day)
        constraints: ">= 1"
      - name: equalization_ratio
        type: number
        source: input
        description: legal assessment-to-market ratio used by the ASSESSMENT_EQUITY valuation variant; e.g., 0.90
        constraints: "0 < equalization_ratio <= 1"
      - name: informal_review_available
        type: boolean
        source: input
        description: whether this jurisdiction offers an informal-review step before a formal hearing
        default: true
      - name: hearing_room_capacity
        type: integer
        source: input
        description: max number of concurrently-overlapping SCHEDULED hearings permitted in one docket_room of this jurisdiction (aggregate-capacity overlap semantics)
        default: 3
      - name: rep_travel_buffer_minutes
        type: integer
        source: input
        description: minimum gap (minutes) required between two SCHEDULED hearings for the same representative in this jurisdiction (pairwise-buffer overlap semantics); exactly-buffer-apart is allowed
        default: 60

  - name: FeeAgreement
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the taxpayer bound by this contingency agreement"
      - name: contingency_tier1_pct
        type: number
        source: input
        description: marginal contingency rate applied to the first tier1_ceiling_cents of annual tax savings
        default: 0.40
      - name: contingency_tier2_pct
        type: number
        source: input
        description: marginal contingency rate applied to savings between tier1_ceiling_cents and tier2_ceiling_cents
        default: 0.33
      - name: contingency_tier3_pct
        type: number
        source: input
        description: marginal contingency rate applied to savings above tier2_ceiling_cents
        default: 0.25
      - name: tier1_ceiling_cents
        type: integer
        source: input
        description: upper bound (in annual tax-savings cents) of the tier1 marginal band
        default: 50000
      - name: tier2_ceiling_cents
        type: integer
        source: input
        description: upper bound (in annual tax-savings cents) of the tier2 marginal band
        default: 150000
      - name: minimum_fee_cents
        type: integer
        source: input
        description: floor applied to the computed contingency fee whenever savings > 0
        default: 15000
      - name: status
        type: enum
        source: system
        description: agreement lifecycle
        default: PENDING
        constraints: "one of {PENDING, ACTIVE}"
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock timestamp when the Client accepted the agreement (null until ACTIVE)

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; owning taxpayer"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; taxing jurisdiction the parcel sits in"
      - name: apn
        type: string
        source: input
        description: assessor parcel number; unique within a jurisdiction
      - name: address
        type: string
        source: input
        description: street address of the parcel
      - name: property_class
        type: enum
        source: input
        description: use classification
        constraints: "one of {RESIDENTIAL, COMMERCIAL, INDUSTRIAL, LAND}"
      - name: building_area_sqft
        type: integer
        source: input
        description: gross building area in square feet
        default: 0

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel this annual assessment values"
      - name: tax_year
        type: integer
        source: input
        description: assessment tax year (supports multi-year; unique per parcel)
      - name: original_assessed_value_cents
        type: integer
        source: input
        description: assessor's noticed total assessed value (immutable baseline for savings)
        constraints: ">= 0"
      - name: land_value_cents
        type: integer
        source: input
        description: land component of the assessed value
        default: 0
      - name: improvement_value_cents
        type: integer
        source: input
        description: improvement component of the assessed value
        default: 0
      - name: millage_rate
        type: number
        source: input
        description: tax rate in mills (tax = value_cents * millage_rate / 1000)
        constraints: "> 0"
      - name: notice_date
        type: datetime
        source: input
        description: date the assessment notice was issued; filing deadline = notice_date + jurisdiction.filing_window_days
      - name: assessed_value_cents
        type: integer
        source: computed
        description: current effective assessed value; equals original_assessed_value_cents until an appeal is DECIDED/SETTLED, then set to the decision/settlement value on FINALIZED
      - name: total_approved_exemption_cents
        type: integer
        source: computed
        description: sum of exemption_value_cents over this assessment's parcel+tax_year ExemptionClaims in status APPROVED
        default: 0
      - name: projected_annual_tax_cents
        type: integer
        source: computed
        description: round_half_up((assessed_value_cents - total_approved_exemption_cents) * millage_rate / 1000); recomputed on exemption approve/deny and on FINALIZED
      - name: status
        type: enum
        source: system
        description: assessment lifecycle
        default: NOTICED
        constraints: "one of {NOTICED, UNDER_APPEAL, FINALIZED}"

  - name: ExemptionClaim
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; parcel the exemption applies to"
      - name: tax_year
        type: integer
        source: input
        description: tax year the exemption applies to (matched against the parcel's Assessment of the same year)
      - name: exemption_type
        type: enum
        source: input
        description: category of exemption
        constraints: "one of {HOMESTEAD, SENIOR, VETERAN, AGRICULTURAL, DISABLED}"
      - name: exemption_value_cents
        type: integer
        source: input
        description: assessed-value reduction the exemption confers
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: exemption lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, DENIED}"

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the assessment being appealed (one active appeal per assessment)"
      - name: analyst_id
        type: string
        source: input
        description: "FK -> Analyst.id; owning analyst responsible for the appeal"
      - name: fee_agreement_id
        type: string
        source: input
        description: "FK -> FeeAgreement.id; contingency agreement that will bill this appeal's savings"
      - name: valuation_method
        type: enum
        source: input
        description: which opinion-of-value variant computes requested_value_cents at file time
        constraints: "one of {SALES_COMPARISON, ASSESSMENT_EQUITY}"
      - name: requested_value_cents
        type: integer
        source: computed
        description: opinion of value produced by the opinion_of_value calculation at file time (see §1.3)
      - name: filed_date
        type: datetime
        source: system
        description: logical-clock timestamp when the appeal moved DRAFT->FILED
      - name: decision_value_cents
        type: integer
        source: input
        description: final assessed value set at record-decision (HEARING_SCHEDULED->DECIDED)
      - name: settlement_value_cents
        type: integer
        source: system
        description: agreed assessed value copied from the accepted SettlementOffer.offer_value_cents on SETTLED
      - name: projected_savings_cents
        type: integer
        source: computed
        description: PROVISIONAL tax_savings variant computed at file from requested_value_cents (see §1.3 contingency inputs); estimate only
      - name: projected_fee_cents
        type: integer
        source: computed
        description: PROVISIONAL contingency_fee variant computed at file over projected_savings_cents (0 when projected_savings_cents <= 0); estimate shown in portal, never billed
      - name: projected_client_tax_bill_cents
        type: integer
        source: computed
        description: round_half_up((requested_value_cents - assessment.total_approved_exemption_cents) * assessment.millage_rate / 1000); recomputed when a linked exemption is approved/denied
      - name: realized_savings_cents
        type: integer
        source: computed
        description: FINAL tax_savings variant computed on DECIDED/SETTLED from the outcome value; drives billing
      - name: outcome_source
        type: enum
        source: system
        description: how the appeal terminated
        constraints: "one of {HEARING_DECISION, SETTLEMENT}"
      - name: status
        type: enum
        source: system
        description: appeal lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, FILED, INFORMAL_REVIEW, HEARING_SCHEDULED, DECIDED, SETTLED, WITHDRAWN}"

  - name: Evidence
    parent: null
    common_fields: true
    fields:
      - name: appeal_id
        type: string
        source: input
        description: "FK -> Appeal.id; the appeal this comparable supports"
      - name: comp_address
        type: string
        source: input
        description: comparable property address
      - name: sale_price_cents
        type: integer
        source: input
        description: comparable's sale price
        constraints: ">= 0"
      - name: sale_date
        type: datetime
        source: input
        description: comparable's sale date
      - name: comp_assessed_value_cents
        type: integer
        source: input
        description: comparable's own assessed value (used by ASSESSMENT_EQUITY variant)
        constraints: ">= 0"
      - name: adjustment_pct
        type: number
        source: input
        description: net condition/quality adjustment applied to sale price for the SALES_COMPARISON variant (e.g., -0.05 = 5% downward)
        default: 0.0
      - name: adjusted_sale_value_cents
        type: integer
        source: computed
        description: round_half_up(sale_price_cents * (1 + adjustment_pct)); per-comp rounding pinned BEFORE aggregation (see §1.3)
      - name: included
        type: boolean
        source: input
        description: whether this comparable is part of the valuation set
        default: true

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - name: appeal_id
        type: string
        source: input
        description: "FK -> Appeal.id; the appeal being heard"
      - name: representative_id
        type: string
        source: input
        description: "FK -> Analyst.id; licensed analyst appearing at the hearing"
      - name: docket_room
        type: string
        source: input
        description: room identifier within the appeal's jurisdiction docket (capacity governed by jurisdiction.hearing_room_capacity)
      - name: scheduled_start
        type: datetime
        source: input
        description: hearing start (interval treated as half-open [scheduled_start, scheduled_end))
      - name: scheduled_end
        type: datetime
        source: input
        description: hearing end; must be strictly after scheduled_start
      - name: status
        type: enum
        source: system
        description: hearing lifecycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, HELD, CANCELLED}"
      - name: outcome_note
        type: string
        source: input
        description: free-text note recorded when the hearing is HELD

  - name: SettlementOffer
    parent: null
    common_fields: true
    fields:
      - name: appeal_id
        type: string
        source: input
        description: "FK -> Appeal.id; the appeal under negotiation"
      - name: proposed_by
        type: enum
        source: input
        description: party that authored the current offer value
        constraints: "one of {FIRM, JURISDICTION}"
      - name: offer_value_cents
        type: integer
        source: input
        description: assessed value proposed in the current round
        constraints: ">= 0"
      - name: round_number
        type: integer
        source: computed
        description: negotiation round; starts at 1, incremented on each COUNTERED->PROPOSED re-propose
        default: 1
      - name: created_by_analyst_id
        type: string
        source: system
        description: X-User-ID of the Analyst who created this offer; audit + segregation-of-duties source (acceptor must differ)
      - name: accepted_by_analyst_id
        type: string
        source: system
        description: X-User-ID of the Analyst who accepted this offer (null until ACCEPTED)
      - name: expires_at
        type: datetime
        source: input
        description: logical-clock instant after which the offer may no longer be accepted
      - name: status
        type: enum
        source: system
        description: offer lifecycle
        default: PROPOSED
        constraints: "one of {PROPOSED, COUNTERED, ACCEPTED, REJECTED}"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: appeal_id
        type: string
        source: input
        description: "FK -> Appeal.id; the terminated appeal being billed"
      - name: gross_savings_cents
        type: integer
        source: computed
        description: copied from Appeal.realized_savings_cents at cascade-creation time
      - name: fee_amount_cents
        type: integer
        source: computed
        description: FINAL contingency_fee over gross_savings_cents using the appeal's fee agreement tiers (see §1.3)
      - name: amount_paid_cents
        type: integer
        source: computed
        description: running sum of applied Payment.amount_cents
        default: 0
      - name: issued_date
        type: datetime
        source: system
        description: logical-clock timestamp set on DRAFT->ISSUED
      - name: paid_date
        type: datetime
        source: system
        description: logical-clock timestamp set when amount_paid_cents first reaches fee_amount_cents
      - name: status
        type: enum
        source: system
        description: invoice lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, PAID, VOID}"

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the invoice this payment is applied to"
      - name: amount_cents
        type: integer
        source: input
        description: payment amount applied to the invoice
        constraints: "> 0"
      - name: method
        type: enum
        source: input
        description: payment instrument
        constraints: "one of {CHECK, CARD, ACH}"
      - name: received_date
        type: datetime
        source: system
        description: logical-clock timestamp when the payment was recorded

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: FeeAgreement
    initial_state: PENDING
    terminal_states: [ACTIVE]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /api/fee-agreements/{id}/accept"
        actor: Client
        preconditions:
          - "fee_agreement.status == PENDING"
          - "acting Client (X-User-ID) == fee_agreement.client_id"
        side_effects:
          - "set accepted_at = current logical clock"
        note: "Client accepts the contingency terms via portal; agreement becomes billable."

  - entity: ExemptionClaim
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/exemption-claims/{id}/submit"
        actor: Analyst | Client
        preconditions:
          - "exemption_claim.status == DRAFT"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/exemption-claims/{id}/decide (decision=APPROVE)"
        actor: FirmAdmin
        preconditions:
          - "exemption_claim.status == SUBMITTED"
          - "an Assessment exists for (parcel_id, tax_year)"
        side_effects:
          - "CASCADE link1: Assessment(parcel_id,tax_year).total_approved_exemption_cents += exemption_value_cents; Assessment.projected_annual_tax_cents recomputed; Assessment.version += 1"
          - "CASCADE link2: for any non-terminal Appeal on that Assessment, recompute Appeal.projected_client_tax_bill_cents; Appeal.version += 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/exemption-claims/{id}/decide (decision=DENY)"
        actor: FirmAdmin
        preconditions:
          - "exemption_claim.status == SUBMITTED"
        side_effects: []

  - entity: Assessment
    initial_state: NOTICED
    terminal_states: [FINALIZED]
    transitions:
      - from: NOTICED
        to: UNDER_APPEAL
        trigger: "system: Appeal DRAFT->FILED"
        actor: system
        preconditions:
          - "assessment.status == NOTICED"
        side_effects:
          - "assessment.version += 1"
      - from: UNDER_APPEAL
        to: NOTICED
        trigger: "system: Appeal *->WITHDRAWN (compensation)"
        actor: system
        preconditions:
          - "assessment.status == UNDER_APPEAL"
        side_effects:
          - "assessed_value_cents unchanged (still == original_assessed_value_cents)"
          - "assessment.version += 1"
        note: "Compensating reversal — file+withdraw must leave assessed base unchanged (compensating_invariant)."
      - from: UNDER_APPEAL
        to: FINALIZED
        trigger: "system: Appeal ->DECIDED or ->SETTLED"
        actor: system
        preconditions:
          - "assessment.status == UNDER_APPEAL"
        side_effects:
          - "assessed_value_cents = appeal outcome value (decision_value_cents or settlement_value_cents)"
          - "projected_annual_tax_cents recomputed on new assessed_value_cents"
          - "assessment.version += 1"

  - entity: Appeal
    initial_state: DRAFT
    terminal_states: [DECIDED, SETTLED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /api/appeals/{id}/file"
        actor: Analyst
        preconditions:
          - "appeal.status == DRAFT"
          - "parent Assessment.status == NOTICED (cross-entity: Appeal->Assessment)"
          - "current logical clock date <= Assessment.notice_date + Jurisdiction.filing_window_days (inclusive boundary)"
          - "count(Evidence where appeal_id==this AND included==true) >= 1"
        side_effects:
          - "requested_value_cents = opinion_of_value(valuation_method) over included Evidence"
          - "projected_savings_cents = tax_savings PROVISIONAL over requested_value_cents"
          - "projected_fee_cents = contingency_fee PROVISIONAL over projected_savings_cents (0 if savings<=0)"
          - "projected_client_tax_bill_cents recomputed"
          - "filed_date = current logical clock"
          - "CASCADE: parent Assessment NOTICED->UNDER_APPEAL"
      - from: FILED
        to: INFORMAL_REVIEW
        trigger: "POST /api/appeals/{id}/request-informal-review"
        actor: Analyst
        preconditions:
          - "appeal.status == FILED"
          - "Jurisdiction.informal_review_available == true"
        side_effects: []
      - from: FILED
        to: HEARING_SCHEDULED
        trigger: "system: POST /api/appeals/{id}/hearings schedules a Hearing"
        actor: Analyst
        preconditions:
          - "appeal.status == FILED"
        side_effects:
          - "a Hearing(status=SCHEDULED) is created for this appeal"
      - from: INFORMAL_REVIEW
        to: HEARING_SCHEDULED
        trigger: "system: POST /api/appeals/{id}/hearings schedules a Hearing"
        actor: Analyst
        preconditions:
          - "appeal.status == INFORMAL_REVIEW"
        side_effects:
          - "a Hearing(status=SCHEDULED) is created for this appeal"
      - from: HEARING_SCHEDULED
        to: DECIDED
        trigger: "POST /api/appeals/{id}/record-decision"
        actor: Analyst
        preconditions:
          - "appeal.status == HEARING_SCHEDULED"
          - "at least one Hearing on this appeal has status == HELD (cross-entity: Appeal->Hearing)"
          - "0 <= decision_value_cents <= Assessment.original_assessed_value_cents"
        side_effects:
          - "decision_value_cents stored; decision (outcome_source=HEARING_DECISION); decision_date set"
          - "realized_savings_cents = tax_savings FINAL over decision_value_cents"
          - "CASCADE link1: parent Assessment UNDER_APPEAL->FINALIZED, assessed_value_cents := decision_value_cents (Assessment.version += 1)"
          - "CASCADE link2: create Invoice(status=DRAFT, gross_savings_cents=realized_savings_cents, fee_amount_cents=FINAL contingency_fee over realized_savings_cents; fee is 0 when savings<=0). Invoice always created so the zero-savings boundary is testable at issue."
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /api/appeals/{id}/withdraw"
        actor: Analyst
        preconditions:
          - "appeal.status IN {FILED, INFORMAL_REVIEW, HEARING_SCHEDULED}"
        side_effects:
          - "COMPENSATION: parent Assessment UNDER_APPEAL->NOTICED (assessed_value_cents unchanged)"
          - "any DRAFT Invoice for this appeal -> VOID"
      - from: INFORMAL_REVIEW
        to: WITHDRAWN
        trigger: "POST /api/appeals/{id}/withdraw"
        actor: Analyst
        preconditions:
          - "appeal.status IN {FILED, INFORMAL_REVIEW, HEARING_SCHEDULED}"
        side_effects:
          - "COMPENSATION: parent Assessment UNDER_APPEAL->NOTICED (assessed_value_cents unchanged)"
      - from: HEARING_SCHEDULED
        to: WITHDRAWN
        trigger: "POST /api/appeals/{id}/withdraw"
        actor: Analyst
        preconditions:
          - "appeal.status IN {FILED, INFORMAL_REVIEW, HEARING_SCHEDULED}"
        side_effects:
          - "COMPENSATION: parent Assessment UNDER_APPEAL->NOTICED (assessed_value_cents unchanged)"
      - from: HEARING_SCHEDULED
        to: SETTLED
        trigger: "system: POST /api/settlement-offers/{id}/accept"
        actor: Analyst
        preconditions:
          - "appeal.status IN {FILED, INFORMAL_REVIEW, HEARING_SCHEDULED}"
          - "the accepted SettlementOffer.status == PROPOSED and not past expires_at"
          - "accepting Analyst (X-User-ID) != SettlementOffer.created_by_analyst_id (segregation of duties)"
        side_effects:
          - "settlement_value_cents := offer_value_cents; outcome_source=SETTLEMENT"
          - "realized_savings_cents = tax_savings FINAL over settlement_value_cents"
          - "CASCADE link1: SettlementOffer PROPOSED->ACCEPTED"
          - "CASCADE link2: parent Assessment UNDER_APPEAL->FINALIZED, assessed_value_cents := settlement_value_cents (Assessment.version += 1)"
          - "CASCADE link3: IF realized_savings_cents > 0 THEN create Invoice(status=DRAFT, gross_savings_cents, fee_amount_cents=FINAL contingency_fee)"
      - from: FILED
        to: SETTLED
        trigger: "system: POST /api/settlement-offers/{id}/accept"
        actor: Analyst
        preconditions:
          - "appeal.status IN {FILED, INFORMAL_REVIEW, HEARING_SCHEDULED}"
          - "the accepted SettlementOffer.status == PROPOSED and not past expires_at"
          - "accepting Analyst (X-User-ID) != SettlementOffer.created_by_analyst_id (segregation of duties)"
        side_effects:
          - "settlement_value_cents := offer_value_cents; outcome_source=SETTLEMENT"
          - "realized_savings_cents = tax_savings FINAL over settlement_value_cents"
          - "CASCADE link1: SettlementOffer PROPOSED->ACCEPTED"
          - "CASCADE link2: parent Assessment UNDER_APPEAL->FINALIZED, assessed_value_cents := settlement_value_cents"
          - "CASCADE link3: create Invoice(status=DRAFT, gross_savings_cents=realized_savings_cents, fee_amount_cents=FINAL contingency_fee over realized_savings_cents)"
      - from: INFORMAL_REVIEW
        to: SETTLED
        trigger: "system: POST /api/settlement-offers/{id}/accept"
        actor: Analyst
        preconditions:
          - "appeal.status IN {FILED, INFORMAL_REVIEW, HEARING_SCHEDULED}"
          - "the accepted SettlementOffer.status == PROPOSED and not past expires_at"
          - "accepting Analyst (X-User-ID) != SettlementOffer.created_by_analyst_id (segregation of duties)"
        side_effects:
          - "settlement_value_cents := offer_value_cents; outcome_source=SETTLEMENT"
          - "realized_savings_cents = tax_savings FINAL over settlement_value_cents"
          - "CASCADE link1: SettlementOffer PROPOSED->ACCEPTED"
          - "CASCADE link2: parent Assessment UNDER_APPEAL->FINALIZED, assessed_value_cents := settlement_value_cents"
          - "CASCADE link3: create Invoice(status=DRAFT, gross_savings_cents=realized_savings_cents, fee_amount_cents=FINAL contingency_fee over realized_savings_cents)"

  - entity: SettlementOffer
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /api/settlement-offers/{id}/counter"
        actor: Analyst | Client
        preconditions:
          - "offer.status == PROPOSED"
          - "parent Appeal.status IN {FILED, INFORMAL_REVIEW, HEARING_SCHEDULED}"
        side_effects:
          - "record counter_value into offer_value_cents; flip proposed_by (FIRM<->JURISDICTION)"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /api/settlement-offers/{id}/counter (re-propose next round)"
        actor: Analyst | Client
        preconditions:
          - "offer.status == COUNTERED"
        side_effects:
          - "round_number += 1"
        note: "Cyclic negotiation: PROPOSED<->COUNTERED loops until ACCEPTED/REJECTED."
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /api/settlement-offers/{id}/accept"
        actor: Analyst
        preconditions:
          - "offer.status == PROPOSED"
          - "current logical clock <= expires_at"
          - "accepting Analyst (X-User-ID) != created_by_analyst_id (segregation of duties)"
          - "parent Appeal.status IN {FILED, INFORMAL_REVIEW, HEARING_SCHEDULED}"
        side_effects:
          - "accepted_by_analyst_id = X-User-ID"
          - "drives parent Appeal ->SETTLED cascade (see Appeal transition)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/settlement-offers/{id}/reject"
        actor: Analyst | Client
        preconditions:
          - "offer.status == PROPOSED"
        side_effects: []
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /api/settlement-offers/{id}/reject"
        actor: Analyst | Client
        preconditions:
          - "offer.status == COUNTERED"
        side_effects: []

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /api/hearings/{id}/hold"
        actor: Analyst
        preconditions:
          - "hearing.status == SCHEDULED"
        side_effects:
          - "record outcome_note"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/hearings/{id}/cancel"
        actor: Analyst
        preconditions:
          - "hearing.status == SCHEDULED"
        side_effects:
          - "frees the representative and docket-room slot for overlap checks"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/invoices/{id}/issue"
        actor: Billing
        preconditions:
          - "invoice.status == DRAFT"
          - "appeal.fee_agreement.status == ACTIVE (cross-entity: Invoice->FeeAgreement)"
          - "gross_savings_cents > 0"
        side_effects:
          - "issued_date set"
          - "Client.lifetime_fees_billed_cents += fee_amount_cents"
          - "Client.outstanding_balance_cents += fee_amount_cents"
      - from: ISSUED
        to: PAID
        trigger: "system: POST /api/invoices/{id}/payments makes amount_paid_cents >= fee_amount_cents"
        actor: system
        preconditions:
          - "invoice.status == ISSUED"
          - "amount_paid_cents >= fee_amount_cents after applying the payment"
        side_effects:
          - "paid_date set"
      - from: ISSUED
        to: VOID
        trigger: "POST /api/invoices/{id}/void"
        actor: FirmAdmin
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "COMPENSATION: Client.lifetime_fees_billed_cents -= fee_amount_cents"
          - "COMPENSATION: Client.outstanding_balance_cents -= (fee_amount_cents - amount_paid_cents)"
        note: "Issue+void must leave Client.lifetime_fees_billed_cents unchanged (compensating_invariant)."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: offer-create-stale-appeal
    parent_entity: Appeal
    write_endpoint: "POST /api/appeals/{id}/settlement-offers"
    occ_field: "expected_appeal_version"
    description: |
      Creating a SettlementOffer against an Appeal whose version has advanced since
      the client last observed it is rejected. A newly created offer legitimately
      supersedes the negotiation position of the prior round, so a second create
      carrying a stale expected_appeal_version is rejected as a stale-version write.
    error_id: ERR_STALE_APPEAL_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: comp_adjusted_sale_value
    trigger: "on POST /api/appeals/{id}/evidence (Evidence create) and whenever adjustment_pct/sale_price changes"
    algorithm: weighted_scoring
    formula: |
      adjusted_sale_value_cents = round_half_up( sale_price_cents * (1 + adjustment_pct) )
    input_set: "single Evidence row"
    constants: {}
    precision: "whole cents, round_half_up; rounding applied PER COMP before any aggregation"

  - name: opinion_of_value
    trigger: "on POST /api/appeals/{id}/file — sets Appeal.requested_value_cents"
    algorithm: aggregation
    formula: |
      S = [ e for e in Evidence(appeal_id) if e.included == true ]   # order by created_at ASC
      REJECT with ERR_NO_EVIDENCE if len(S) == 0
      # median(list): sort ASC; odd -> middle element; even -> round_half_up(mean(two middle))
      if valuation_method == SALES_COMPARISON:
          requested_value_cents = median([ e.adjusted_sale_value_cents for e in S ])
      elif valuation_method == ASSESSMENT_EQUITY:
          # per-comp equity-implied market value, rounded per comp BEFORE median
          eq = [ round_half_up( e.comp_assessed_value_cents / Jurisdiction.equalization_ratio ) for e in S ]
          requested_value_cents = median(eq)
    input_set: "included Evidence for the appeal; SALES_COMPARISON uses adjusted_sale_value_cents, ASSESSMENT_EQUITY uses comp_assessed_value_cents / equalization_ratio"
    constants: {}
    precision: "whole cents, round_half_up; per-comp rounding before median (nested rounding order pinned)"
    variants:
      - name: SALES_COMPARISON
        when: "Appeal.valuation_method == SALES_COMPARISON"
        difference: "median of comps' adjusted SALE values"
      - name: ASSESSMENT_EQUITY
        when: "Appeal.valuation_method == ASSESSMENT_EQUITY"
        difference: "median of comps' ASSESSED value / equalization_ratio — same comp set, different metric, generally different result"

  - name: tax_savings
    trigger: "PROVISIONAL on file (over requested_value_cents); FINAL on DECIDED/SETTLED (over outcome value)"
    algorithm: threshold
    formula: |
      def tax_savings(base_cents, result_cents, millage_rate):
          return round_half_up( (base_cents - result_cents) * millage_rate / 1000 )
      # base_cents = Assessment.original_assessed_value_cents
      # PROVISIONAL: result_cents = Appeal.requested_value_cents  -> Appeal.projected_savings_cents
      # FINAL:       result_cents = decision_value_cents or settlement_value_cents -> Appeal.realized_savings_cents
    input_set: "one Assessment + one Appeal"
    constants: {}
    precision: "whole cents, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "computed at file for the estimate"
        difference: "uses requested_value_cents (an opinion), stored in projected_savings_cents"
      - name: FINAL
        when: "computed at DECIDED/SETTLED for billing"
        difference: "uses the realized outcome value (decision_value_cents or settlement_value_cents), stored in realized_savings_cents"

  - name: contingency_fee
    trigger: "PROVISIONAL at file (over projected_savings_cents); FINAL at Invoice cascade-creation (over realized_savings_cents)"
    algorithm: tiered_pricing
    formula: |
      def contingency_fee(S_cents, fa):   # fa = FeeAgreement; marginal tiered
          t1 = min(S_cents, fa.tier1_ceiling_cents) * fa.contingency_tier1_pct
          t2 = clamp(S_cents - fa.tier1_ceiling_cents, 0, fa.tier2_ceiling_cents - fa.tier1_ceiling_cents) * fa.contingency_tier2_pct
          t3 = max(S_cents - fa.tier2_ceiling_cents, 0) * fa.contingency_tier3_pct
          raw = t1 + t2 + t3                       # exact real arithmetic
          fee = round_half_up(raw)                 # round ONCE after summing tiers
          return max(fa.minimum_fee_cents, fee)    # floor applies only when S_cents > 0
      # clamp(x, lo, hi) = max(lo, min(x, hi))
    input_set: "one Appeal + its FeeAgreement; S_cents is the relevant tax_savings variant"
    constants:
      NOTE: "tier rates/ceilings/minimum come from the FeeAgreement row (defaults 0.40/0.33/0.25, 50000/150000, min 15000)"
    precision: "whole cents; round_half_up once after summing all three marginal tiers (sum-then-round order pinned)"
    variants:
      - name: PROVISIONAL
        when: "at file, over Appeal.projected_savings_cents"
        difference: "an estimate stored in Appeal.projected_fee_cents; not billed"
      - name: FINAL
        when: "at Invoice creation, over Appeal.realized_savings_cents"
        difference: "the billed Invoice.fee_amount_cents"

  - name: assessment_projected_annual_tax
    trigger: "on ExemptionClaim APPROVED/DENIED and on Assessment FINALIZED (derived_field_reconciliation)"
    algorithm: aggregation
    formula: |
      total_approved_exemption_cents = sum( ec.exemption_value_cents
          for ec in ExemptionClaim(parcel_id == assessment.parcel_id AND tax_year == assessment.tax_year)
          if ec.status == APPROVED )
      projected_annual_tax_cents = round_half_up(
          (assessment.assessed_value_cents - total_approved_exemption_cents) * assessment.millage_rate / 1000 )
    input_set: "APPROVED ExemptionClaims for (parcel_id, tax_year); floor at 0 if exemptions exceed assessed_value_cents"
    constants: {}
    precision: "whole cents, round_half_up; taxable base floored at 0"

  - name: invoice_amount_paid
    trigger: "on POST /api/invoices/{id}/payments"
    algorithm: aggregation
    formula: |
      amount_paid_cents = sum( p.amount_cents for p in Payment(invoice_id) )
      if amount_paid_cents >= invoice.fee_amount_cents: invoice.status = PAID; set paid_date
      Client.outstanding_balance_cents -= applied_payment.amount_cents
    input_set: "all Payment rows for the invoice"
    constants: {}
    precision: "whole cents"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "role is permitted for the endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for entity_backed roles acting on their own resource (Client portal / Analyst ownership), X-User-ID matches the resource's owner FK"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "Client/Analyst ownership-scoped endpoints"
  - priority: 4
    category: existence
    check: "all path/body referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: existence
    check: "request body includes all required input fields with valid types/enums"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH"
  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "filing an appeal: the parent Assessment must be NOTICED (not already UNDER_APPEAL/FINALIZED) — Appeal->Assessment cross-entity"
    error_id: ERR_ASSESSMENT_NOT_APPEALABLE
    http_status: 409
    applies_to: "POST /api/appeals/{id}/file"
  - priority: 8
    category: state
    check: "recording a decision: at least one Hearing on the appeal is HELD — Appeal->Hearing cross-entity"
    error_id: ERR_NO_HELD_HEARING
    http_status: 409
    applies_to: "POST /api/appeals/{id}/record-decision"
  - priority: 9
    category: business_safety
    check: "accepting a settlement offer: acting Analyst (X-User-ID) must differ from SettlementOffer.created_by_analyst_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/settlement-offers/{id}/accept"
  - priority: 10
    category: business_referential
    check: "issuing an invoice: the appeal's FeeAgreement must be ACTIVE — Invoice->FeeAgreement cross-entity"
    error_id: ERR_FEE_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/invoices/{id}/issue"
  - priority: 11
    category: business_temporal
    check: "filing an appeal after the jurisdiction filing window: current clock date > notice_date + filing_window_days"
    error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /api/appeals/{id}/file"
  - priority: 12
    category: business_temporal
    check: "accepting a settlement offer after expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /api/settlement-offers/{id}/accept"
  - priority: 13
    category: business_constraint
    check: "filing an appeal with zero included Evidence rows (empty valuation set)"
    error_id: ERR_NO_EVIDENCE
    http_status: 422
    applies_to: "POST /api/appeals/{id}/file"
  - priority: 14
    category: business_constraint
    check: "scheduling a hearing whose [scheduled_start,scheduled_end) gap to another SCHEDULED hearing of the same representative (same jurisdiction) is < rep_travel_buffer_minutes"
    error_id: ERR_REPRESENTATIVE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /api/appeals/{id}/hearings"
  - priority: 15
    category: business_constraint
    check: "scheduling a hearing when the count of overlapping SCHEDULED hearings in the same (jurisdiction, docket_room) is already >= hearing_room_capacity"
    error_id: ERR_DOCKET_ROOM_FULL
    http_status: 409
    applies_to: "POST /api/appeals/{id}/hearings"
  - priority: 16
    category: business_constraint
    check: "scheduled_end must be strictly after scheduled_start; decision_value_cents within [0, original_assessed_value_cents]; offer_value_cents/amount within declared bounds"
    error_id: ERR_INVALID_VALUE
    http_status: 422
    applies_to: "hearing/decision/offer/payment endpoints"
  - priority: 17
    category: business_fiscal
    check: "issuing an invoice whose gross_savings_cents <= 0 (no positive savings to bill)"
    error_id: ERR_NO_BILLABLE_SAVINGS
    http_status: 409
    applies_to: "POST /api/invoices/{id}/issue"
  - priority: 18
    category: business_referential
    check: "OCC: expected_appeal_version must equal the current Appeal.version on settlement-offer create"
    error_id: ERR_STALE_APPEAL_VERSION
    http_status: 412
    applies_to: "POST /api/appeals/{id}/settlement-offers"
  - priority: 19
    category: business_constraint
    check: "uniqueness: Assessment unique per (parcel_id, tax_year); Parcel.apn unique per jurisdiction; only one non-terminal Appeal per Assessment"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /api/assessments, POST /api/parcels, POST /api/appeals"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- logical clock (test-driving; default 2026-07-01T00:00:00Z) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [FirmAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced; all deadline/expiry/window checks read this clock"]

  # ---- Analyst ----
  - method: POST
    path: "/api/analysts"
    description: "Create an analyst (firm staff / licensed representative)."
    roles: [FirmAdmin]
    code: 201
    input: [full_name, email, license_number, "active?"]
    output: Analyst
    side_effects: []
  - method: GET
    path: "/api/analysts/{id}"
    description: "Fetch an analyst."
    roles: [FirmAdmin, Analyst, Billing]
    code: 200
    input: []
    output: Analyst

  # ---- Client ----
  - method: POST
    path: "/api/clients"
    description: "Create a client (taxpayer)."
    roles: [FirmAdmin]
    code: 201
    input: [full_name, email, entity_type, "portal_enabled?"]
    output: Client
    side_effects: []
  - method: GET
    path: "/api/clients/{id}"
    description: "Fetch a client; Client may fetch only itself."
    roles: [FirmAdmin, Billing, Client]
    code: 200
    input: []
    output: Client

  # ---- Jurisdiction ----
  - method: POST
    path: "/api/jurisdictions"
    description: "Create a taxing jurisdiction with deadline/room/buffer config."
    roles: [FirmAdmin]
    code: 201
    input: [name, state_code, filing_window_days, equalization_ratio, "informal_review_available?", "hearing_room_capacity?", "rep_travel_buffer_minutes?"]
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/api/jurisdictions/{id}"
    description: "Fetch a jurisdiction."
    roles: [FirmAdmin, Analyst]
    code: 200
    input: []
    output: Jurisdiction

  # ---- FeeAgreement ----
  - method: POST
    path: "/api/fee-agreements"
    description: "Create a contingency fee agreement (PENDING) for a client."
    roles: [FirmAdmin]
    code: 201
    input: [client_id, "contingency_tier1_pct?", "contingency_tier2_pct?", "contingency_tier3_pct?", "tier1_ceiling_cents?", "tier2_ceiling_cents?", "minimum_fee_cents?"]
    output: FeeAgreement
    side_effects: []
  - method: GET
    path: "/api/fee-agreements/{id}"
    description: "Fetch a fee agreement."
    roles: [FirmAdmin, Billing, Client]
    code: 200
    input: []
    output: FeeAgreement
  - method: GET
    path: "/api/fee-agreements"
    description: "List fee agreements; filter by client_id (reverse-reachability for FeeAgreement.client_id)."
    roles: [FirmAdmin, Billing, Client]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: FeeAgreement[]
  - method: POST
    path: "/api/fee-agreements/{id}/accept"
    description: "Client accepts the agreement (PENDING->ACTIVE)."
    roles: [Client]
    code: 200
    input: []
    output: FeeAgreement
    side_effects: ["status->ACTIVE", "accepted_at set"]

  # ---- Parcel ----
  - method: POST
    path: "/api/parcels"
    description: "Register a parcel for a client in a jurisdiction."
    roles: [Analyst]
    code: 201
    input: [client_id, jurisdiction_id, apn, address, property_class, "building_area_sqft?"]
    output: Parcel
    side_effects: []
  - method: GET
    path: "/api/parcels/{id}"
    description: "Fetch a parcel."
    roles: [FirmAdmin, Analyst, Client]
    code: 200
    input: []
    output: Parcel
  - method: GET
    path: "/api/parcels"
    description: "List parcels; filter by client_id and/or jurisdiction_id (reverse-reachability for both Parcel FKs)."
    roles: [FirmAdmin, Analyst, Client]
    code: 200
    input: ["client_id?", "jurisdiction_id?", "limit?", "offset?"]
    output: Parcel[]

  # ---- Assessment ----
  - method: POST
    path: "/api/assessments"
    description: "Create an annual assessment (NOTICED) for a parcel; unique per (parcel_id, tax_year)."
    roles: [Analyst]
    code: 201
    input: [parcel_id, tax_year, original_assessed_value_cents, millage_rate, notice_date, "land_value_cents?", "improvement_value_cents?"]
    output: Assessment
    side_effects: ["assessed_value_cents := original_assessed_value_cents", "projected_annual_tax_cents computed"]
  - method: GET
    path: "/api/assessments/{id}"
    description: "Fetch an assessment."
    roles: [FirmAdmin, Analyst, Client]
    code: 200
    input: []
    output: Assessment
  - method: GET
    path: "/api/assessments"
    description: "List assessments; filter by parcel_id (reverse-reachability for Assessment.parcel_id)."
    roles: [FirmAdmin, Analyst, Client]
    code: 200
    input: ["parcel_id?", "limit?", "offset?"]
    output: Assessment[]

  # ---- ExemptionClaim ----
  - method: POST
    path: "/api/exemption-claims"
    description: "Create an exemption claim (DRAFT) for a parcel+tax_year."
    roles: [Analyst, Client]
    code: 201
    input: [parcel_id, tax_year, exemption_type, exemption_value_cents]
    output: ExemptionClaim
    side_effects: []
  - method: GET
    path: "/api/exemption-claims/{id}"
    description: "Fetch an exemption claim."
    roles: [FirmAdmin, Analyst, Client]
    code: 200
    input: []
    output: ExemptionClaim
  - method: GET
    path: "/api/exemption-claims"
    description: "List exemption claims; filter by parcel_id (reverse-reachability for ExemptionClaim.parcel_id)."
    roles: [FirmAdmin, Analyst, Client]
    code: 200
    input: ["parcel_id?", "limit?", "offset?"]
    output: ExemptionClaim[]
  - method: POST
    path: "/api/exemption-claims/{id}/submit"
    description: "Submit a draft exemption claim (DRAFT->SUBMITTED)."
    roles: [Analyst, Client]
    code: 200
    input: []
    output: ExemptionClaim
    side_effects: ["status->SUBMITTED"]
  - method: POST
    path: "/api/exemption-claims/{id}/decide"
    description: "Approve or deny a submitted exemption (SUBMITTED->APPROVED/DENIED)."
    roles: [FirmAdmin]
    code: 200
    input: [decision]
    output: ExemptionClaim
    side_effects: ["APPROVE cascades: Assessment.total_approved_exemption_cents/projected_annual_tax_cents recompute (link1); non-terminal Appeal.projected_client_tax_bill_cents recompute (link2)"]

  # ---- Appeal ----
  - method: POST
    path: "/api/appeals"
    description: "Create an appeal (DRAFT) for an assessment; only one non-terminal appeal per assessment."
    roles: [Analyst]
    code: 201
    input: [assessment_id, analyst_id, fee_agreement_id, valuation_method]
    output: Appeal
    side_effects: []
  - method: GET
    path: "/api/appeals/{id}"
    description: "Fetch an appeal."
    roles: [FirmAdmin, Analyst, Billing, Client]
    code: 200
    input: []
    output: Appeal
  - method: GET
    path: "/api/appeals"
    description: "List appeals; filter by assessment_id / analyst_id / fee_agreement_id (reverse-reachability for all three Appeal FKs)."
    roles: [FirmAdmin, Analyst, Client]
    code: 200
    input: ["assessment_id?", "analyst_id?", "fee_agreement_id?", "limit?", "offset?"]
    output: Appeal[]
  - method: POST
    path: "/api/appeals/{id}/evidence"
    description: "Attach a comparable-property evidence row; computes adjusted_sale_value_cents."
    roles: [Analyst]
    code: 201
    input: [comp_address, sale_price_cents, sale_date, comp_assessed_value_cents, "adjustment_pct?", "included?"]
    output: Evidence
    side_effects: ["adjusted_sale_value_cents computed (per-comp rounding)"]
  - method: GET
    path: "/api/appeals/{id}/evidence"
    description: "List evidence for an appeal (reverse-reachability for Evidence.appeal_id, sub-resource form)."
    roles: [FirmAdmin, Analyst]
    code: 200
    input: ["limit?", "offset?"]
    output: Evidence[]
  - method: POST
    path: "/api/appeals/{id}/file"
    description: "File the appeal (DRAFT->FILED); computes requested_value_cents + projected savings; cascades Assessment NOTICED->UNDER_APPEAL."
    roles: [Analyst]
    code: 200
    input: []
    output: Appeal
    side_effects: ["opinion_of_value, tax_savings PROVISIONAL, projected_client_tax_bill_cents", "Assessment NOTICED->UNDER_APPEAL"]
  - method: POST
    path: "/api/appeals/{id}/request-informal-review"
    description: "Escalate a filed appeal to informal review (FILED->INFORMAL_REVIEW)."
    roles: [Analyst]
    code: 200
    input: []
    output: Appeal
    side_effects: ["status->INFORMAL_REVIEW"]
  - method: POST
    path: "/api/appeals/{id}/hearings"
    description: "Schedule a hearing for the appeal; moves appeal FILED/INFORMAL_REVIEW->HEARING_SCHEDULED. Enforces representative-buffer and docket-room-capacity overlap rules."
    roles: [Analyst]
    code: 201
    input: [representative_id, docket_room, scheduled_start, scheduled_end]
    output: Hearing
    side_effects: ["Hearing SCHEDULED created", "Appeal ->HEARING_SCHEDULED"]
  - method: POST
    path: "/api/appeals/{id}/record-decision"
    description: "Record the hearing decision (HEARING_SCHEDULED->DECIDED); cascades Assessment FINALIZE + Invoice creation when savings > 0."
    roles: [Analyst]
    code: 200
    input: [decision_value_cents]
    output: Appeal
    side_effects: ["realized_savings_cents (FINAL)", "Assessment ->FINALIZED", "Invoice DRAFT always created (fee 0 when savings<=0)"]
  - method: POST
    path: "/api/appeals/{id}/withdraw"
    description: "Withdraw an appeal (->WITHDRAWN); compensating reversal of Assessment to NOTICED, voids any DRAFT invoice."
    roles: [Analyst]
    code: 200
    input: []
    output: Appeal
    side_effects: ["Assessment UNDER_APPEAL->NOTICED (assessed_value unchanged)", "DRAFT Invoice->VOID"]

  # ---- SettlementOffer ----
  - method: POST
    path: "/api/appeals/{id}/settlement-offers"
    description: "Create a settlement offer (PROPOSED) on an appeal. OCC-guarded on the parent Appeal.version; bumps Appeal.version."
    roles: [Analyst]
    code: 201
    input: [proposed_by, offer_value_cents, expires_at, expected_appeal_version]
    output: SettlementOffer
    side_effects: ["created_by_analyst_id = X-User-ID", "increments Appeal.version by 1"]
  - method: GET
    path: "/api/appeals/{id}/settlement-offers"
    description: "List settlement offers for an appeal (reverse-reachability for SettlementOffer.appeal_id, sub-resource form)."
    roles: [FirmAdmin, Analyst, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: SettlementOffer[]
  - method: GET
    path: "/api/settlement-offers/{id}"
    description: "Fetch a settlement offer."
    roles: [FirmAdmin, Analyst, Client]
    code: 200
    input: []
    output: SettlementOffer
  - method: POST
    path: "/api/settlement-offers/{id}/counter"
    description: "Counter/re-propose the offer (PROPOSED->COUNTERED or COUNTERED->PROPOSED, incrementing round_number)."
    roles: [Analyst, Client]
    code: 200
    input: [offer_value_cents]
    output: SettlementOffer
    side_effects: ["cyclic negotiation round update"]
  - method: POST
    path: "/api/settlement-offers/{id}/accept"
    description: "Accept the offer (PROPOSED->ACCEPTED); SoD: acceptor Analyst must differ from creator. Drives Appeal ->SETTLED cascade."
    roles: [Analyst]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: ["accepted_by_analyst_id set", "Appeal ->SETTLED cascade (Assessment FINALIZE, Invoice create if savings>0)"]
  - method: POST
    path: "/api/settlement-offers/{id}/reject"
    description: "Reject the offer (PROPOSED/COUNTERED->REJECTED)."
    roles: [Analyst, Client]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: ["status->REJECTED"]

  # ---- Hearing ----
  - method: GET
    path: "/api/hearings/{id}"
    description: "Fetch a hearing."
    roles: [FirmAdmin, Analyst]
    code: 200
    input: []
    output: Hearing
  - method: GET
    path: "/api/hearings"
    description: "List hearings; filter by appeal_id and/or representative_id (reverse-reachability for Hearing.representative_id)."
    roles: [FirmAdmin, Analyst]
    code: 200
    input: ["appeal_id?", "representative_id?", "limit?", "offset?"]
    output: Hearing[]
  - method: POST
    path: "/api/hearings/{id}/hold"
    description: "Mark the hearing HELD (SCHEDULED->HELD)."
    roles: [Analyst]
    code: 200
    input: ["outcome_note?"]
    output: Hearing
    side_effects: ["status->HELD"]
  - method: POST
    path: "/api/hearings/{id}/cancel"
    description: "Cancel the hearing (SCHEDULED->CANCELLED), freeing its representative/room slot."
    roles: [Analyst]
    code: 200
    input: []
    output: Hearing
    side_effects: ["status->CANCELLED"]

  # ---- Invoice / Payment ----
  - method: GET
    path: "/api/invoices/{id}"
    description: "Fetch an invoice."
    roles: [FirmAdmin, Billing, Client]
    code: 200
    input: []
    output: Invoice
  - method: GET
    path: "/api/invoices"
    description: "List invoices; filter by appeal_id (reverse-reachability for Invoice.appeal_id)."
    roles: [FirmAdmin, Billing, Client]
    code: 200
    input: ["appeal_id?", "limit?", "offset?"]
    output: Invoice[]
  - method: POST
    path: "/api/invoices/{id}/issue"
    description: "Issue a DRAFT invoice (DRAFT->ISSUED); requires ACTIVE fee agreement and positive savings; debits client balances."
    roles: [Billing]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Client.lifetime_fees_billed_cents += fee", "Client.outstanding_balance_cents += fee", "issued_date set"]
  - method: POST
    path: "/api/invoices/{id}/void"
    description: "Void an issued invoice (ISSUED->VOID); compensating reversal of client ledgers."
    roles: [FirmAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Client.lifetime_fees_billed_cents -= fee", "Client.outstanding_balance_cents -= (fee - amount_paid)"]
  - method: POST
    path: "/api/invoices/{id}/payments"
    description: "Record a payment against an issued invoice; auto-transitions to PAID when covered."
    roles: [Billing, Client]
    code: 201
    input: [amount_cents, method]
    output: Payment
    side_effects: ["amount_paid_cents recomputed", "Client.outstanding_balance_cents -= amount_cents", "Invoice ISSUED->PAID when covered"]
  - method: GET
    path: "/api/invoices/{id}/payments"
    description: "List payments for an invoice (reverse-reachability for Payment.invoice_id, sub-resource form)."
    roles: [FirmAdmin, Billing, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid auth headers or unknown role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_FORBIDDEN_NOT_OWNER
    http: 403
    condition: "entity_backed role acting on a resource it does not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, bad type, or invalid enum value"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_ASSESSMENT_NOT_APPEALABLE
    http: 409
    condition: "filing an appeal on an Assessment not in NOTICED"
  - id: ERR_NO_HELD_HEARING
    http: 409
    condition: "recording a decision with no HELD hearing on the appeal"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "settlement acceptor Analyst equals the offer creator"
  - id: ERR_FEE_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "issuing an invoice whose appeal's fee agreement is not ACTIVE"
  - id: ERR_FILING_DEADLINE_PASSED
    http: 409
    condition: "filing after notice_date + filing_window_days"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "accepting a settlement offer after expires_at"
  - id: ERR_NO_EVIDENCE
    http: 422
    condition: "filing an appeal with zero included Evidence"
  - id: ERR_REPRESENTATIVE_UNAVAILABLE
    http: 409
    condition: "hearing gap to same representative's SCHEDULED hearing < rep_travel_buffer_minutes"
  - id: ERR_DOCKET_ROOM_FULL
    http: 409
    condition: "overlapping SCHEDULED hearings in the (jurisdiction, docket_room) already at hearing_room_capacity"
  - id: ERR_INVALID_VALUE
    http: 422
    condition: "scheduled_end<=scheduled_start, decision/offer/payment value out of allowed bounds"
  - id: ERR_NO_BILLABLE_SAVINGS
    http: 409
    condition: "issuing an invoice with gross_savings_cents <= 0"
  - id: ERR_STALE_APPEAL_VERSION
    http: 412
    condition: "expected_appeal_version != current Appeal.version on settlement-offer create"
  - id: ERR_DUPLICATE
    http: 409
    condition: "duplicate Assessment(parcel,tax_year) / Parcel.apn / second non-terminal Appeal per Assessment"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: FirmAdmin
    description: "Firm operator: configures jurisdictions, fee agreements, staff and clients; decides exemptions; voids invoices; drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/jurisdictions"
      - "POST /api/fee-agreements"
      - "POST /api/analysts"
      - "POST /api/clients"
      - "POST /api/exemption-claims/{id}/decide"
      - "POST /api/invoices/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across jurisdictions, fee-agreements, parcels, assessments, exemptions, appeals, invoices"
  - name: Analyst
    description: "Case analyst and licensed representative: parcel/assessment analysis, evidence, valuation, appeal filing, hearing scheduling/holding, settlement offers, decisions, withdrawals."
    identity: "entity_backed:Analyst"
    exclusive_operations:
      - "POST /api/parcels"
      - "POST /api/assessments"
      - "POST /api/appeals"
      - "POST /api/appeals/{id}/evidence"
      - "POST /api/appeals/{id}/file"
      - "POST /api/appeals/{id}/request-informal-review"
      - "POST /api/appeals/{id}/hearings"
      - "POST /api/appeals/{id}/record-decision"
      - "POST /api/appeals/{id}/withdraw"
      - "POST /api/appeals/{id}/settlement-offers"
      - "POST /api/settlement-offers/{id}/accept"
      - "POST /api/hearings/{id}/hold"
      - "POST /api/hearings/{id}/cancel"
    shared_operations:
      - "POST /api/exemption-claims (with Client)"
      - "POST /api/exemption-claims/{id}/submit (with Client)"
      - "POST /api/settlement-offers/{id}/counter (with Client)"
      - "POST /api/settlement-offers/{id}/reject (with Client)"
      - "GET reads across parcels/assessments/appeals/evidence/hearings/offers"
  - name: Billing
    description: "Billing operator (segregated from Analyst): issues invoices and records payments; cannot work appeals."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/invoices/{id}/issue"
    shared_operations:
      - "POST /api/invoices/{id}/payments (with Client)"
      - "GET reads across invoices/payments/clients/analysts"
  - name: Client
    description: "Portal user (taxpayer): reads own parcels/assessments/appeals/offers/invoices, accepts fee agreements, submits exemptions, counters/rejects offers, pays invoices."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /api/fee-agreements/{id}/accept"
    shared_operations:
      - "POST /api/exemption-claims (with Analyst)"
      - "POST /api/exemption-claims/{id}/submit (with Analyst)"
      - "POST /api/settlement-offers/{id}/counter (with Analyst)"
      - "POST /api/settlement-offers/{id}/reject (with Analyst)"
      - "POST /api/invoices/{id}/payments (with Billing)"
      - "GET reads scoped to own resources"
