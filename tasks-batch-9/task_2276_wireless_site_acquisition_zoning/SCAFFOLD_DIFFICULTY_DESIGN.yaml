  - rule_id: boundary_precision_check
    instances:
      - name: rf_score_exactly_at_qualify_minimum_versus_one_step_below
        grounds:
          - calculations.rf_qualification_score
          - state_machines.Candidate.UNSCREENED_to_RF_QUALIFIED
          - state_machines.Candidate.UNSCREENED_to_DISQUALIFIED
        distinguishing_aspect: |
          Numeric-threshold boundary on the rf_qualification_score metric at POST
          /candidates/{id}/rf-qualify: an offered capacity of 2.5 Gbps scores exactly 55.00 ==
          RF_QUALIFY_MIN_SCORE and qualifies, while 2.4 Gbps scores 54.80 and disqualifies. The
          comparison is >=, so equality must qualify.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an OPEN ring with target_rsrp_dbm -95, radius_m 800, required_agl_m 45, target_capacity_gbps 10"
            - "two RAW_LAND candidates at distance 400 m, agl 45 m, rsrp -95 dBm, 6 months to availability; capacities 2.5 and 2.4 Gbps"
