            - call: "POST /agreements"
              payload: { insured_id: "${insured_1}", producer_agent_id: "${agent_1}", state_rule_id: "${rule_tx}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ok_id: "$.data.id", ok_status: "$.data.status" }
          assert:
            - "precondition: ${lic_1_status} == 'SUSPENDED' and ${lic_1_effective} == false, so no License for the TX rule has is_effective == true at clock 2026-08-15"
            - "BOTH violated (unlicensed state AND first_installment_due_date 2026-08-10 < clock 2026-08-15): ${both_error} == 'ERR_STATE_NOT_LICENSED' with HTTP 422 — priority 22 wins over priority 33"
