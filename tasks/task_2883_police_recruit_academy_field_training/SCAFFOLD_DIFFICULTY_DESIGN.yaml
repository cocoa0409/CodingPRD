              payload: { decision: "PASS", justification: "early closure requested" }
              as: AcademyDirector
              as_user_id: "dir-1"
          assert:
            - "${score_pre_cascade} == 6.00"
            - "${ext_pre_cascade} == 0"
            - "${end_pre_cascade} == 2028-03-31"
            - "${ext_post_cascade} == 60"
            - "${end_post_cascade} == 2028-05-30"
            - "FieldTrainingRotation.${rot2_id}.status == ABORTED"
            - "FieldTrainingRotation.${rot2_id}.abort_reason == assigned FTO reassigned to patrol; phase restarts later"
            - "FieldTrainingRotation.${rot2_id}.dor_count == 0"
            - "FieldTrainingRotation.${rot2_id}.competency_score == null"
            - "FieldTrainingRotation.${rot2_id}.rolling_mean_score == null"
            - "ObservationReport.${dor2_id}.voided == true"
            - "ObservationReport.${dor2_id}.dor_mean == 3.00  # the row keeps its own mean; it is only excluded from the rotation scores"
            - "Instructor.${ftoB}.active_trainee_count == 0  # restored to the pre-activation value"
            - "Instructor.${ftoA}.active_trainee_count == 0"
            - "Recruit.${rec_id}.probation_status == ACTIVE  # no REMEDIAL rotation remains"
            - "Recruit.${rec_id}.probation_milestone_score == 6.00  # the ABORTED rotation left the STEP 2 eligible set"
            - "Recruit.${rec_id}.probation_extension_days == 0  # exactly the pre-cascade value"
            - "Recruit.${rec_id}.probation_scheduled_end == 2028-03-31  # exactly the pre-cascade value"
            - "Recruit.${rec_id}.probation_milestone_due_date == 2027-09-30  # never moved in either direction"
            - "FieldTrainingRotation.${rot1_id}.status == COMPLETED"
            - "POST /recruits/${rec_id}/probation-decisions { decision: 'PASS' } -> 409 ERR_MILESTONE_NOT_REACHED (clock date 2027-04-20 < 2027-09-30)"
            - "Recruit.${rec_id}.probation_status == ACTIVE  # the rejected decision changed nothing"
