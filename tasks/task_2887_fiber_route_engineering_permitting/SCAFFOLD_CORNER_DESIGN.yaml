  # ===========================================================================
  # 4 — validations
  # ===========================================================================
  - section: validations
    instances:
      - name: lock_scope_with_an_unwalked_segment_returns_walkout_not_accepted
        claim_type: Violation → Error
        grounds:
          - validations[priority=20]
          - state_machines.Route.transitions.PLANNING_to_SCOPE_LOCKED
        distinguishing_aspect: "One walked segment is not enough: lock-scope sweeps every segment on the route, so a second segment still in DRAFT produces ERR_WALKOUT_NOT_ACCEPTED (422) and the route stays in PLANNING."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' in PLANNING with two RouteSegments: sequence_index 1 (400 feet, URBAN_PAVED) and sequence_index 2 (300 feet, RURAL_SHOULDER)"
            - "only segment 1 has an ACCEPTED walkout; segment 2 has no walkout at all and is still DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg1_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 2, street_name: "Orchard Road", municipality_code: "MUN-014", length_feet: 300, terrain_class: "RURAL_SHOULDER", planned_work_start_on: "2026-09-21", planned_work_end_on: "2026-09-25" }
              as: RouteEngineer
              captures: { seg2_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg1_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false }
              as: FieldSurveyor
              captures: { wo1_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo1_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "B", available_vertical_clearance_in: 45, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo1_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo1_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
          trigger:
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_WALKOUT_NOT_ACCEPTED with HTTP 422"
            - "Route.${route_id}.status == PLANNING and scope_locked_at == null"
            - "Route.${route_id}.planned_complexity_index == null, because the lock-scope side effects never ran"
            - "RouteSegment.${seg1_id}.engineering_status == WALKED and RouteSegment.${seg2_id}.engineering_status == DRAFT"

      - name: overlapping_moratorium_window_on_the_same_street_returns_overlap
        claim_type: Violation → Error
        grounds:
          - validations[priority=16]
          - entities.MoratoriumWindow
        distinguishing_aspect: "The overlap check is scoped to (municipality_code, street_name) and uses closed intervals, so a window starting on the incumbent's ends_on collides while the very next day, and the same dates on a different street, are both accepted."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one MoratoriumWindow on MUN-014 / 'Slate Road' with starts_on 2026-09-01 and ends_on 2026-10-31, moratorium_class FULL_RESTORATION"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /moratorium-windows"
              payload: { municipality_code: "MUN-014", street_name: "Slate Road", resurfaced_on: "2026-08-30", starts_on: "2026-09-01", ends_on: "2026-10-31", moratorium_class: "FULL_RESTORATION", ordinance_reference: "ORD-2026-311" }
              as: NetworkRecordsAdmin
              captures: { mw1_id: $.data.id }
          trigger:
            - call: "POST /moratorium-windows"
              payload: { municipality_code: "MUN-014", street_name: "Slate Road", resurfaced_on: "2026-10-29", starts_on: "2026-10-31", ends_on: "2026-11-15", moratorium_class: "NO_OPEN_CUT", ordinance_reference: "ORD-2026-402" }
              as: NetworkRecordsAdmin
              captures: { err: $.data.error_id }
            - call: "POST /moratorium-windows"
              payload: { municipality_code: "MUN-014", street_name: "Slate Road", resurfaced_on: "2026-10-29", starts_on: "2026-11-01", ends_on: "2026-11-15", moratorium_class: "NO_OPEN_CUT", ordinance_reference: "ORD-2026-403" }
              as: NetworkRecordsAdmin
              captures: { mw3_id: $.data.id }
            - call: "POST /moratorium-windows"
              payload: { municipality_code: "MUN-014", street_name: "Chalk Lane", resurfaced_on: "2026-08-30", starts_on: "2026-09-01", ends_on: "2026-10-31", moratorium_class: "FULL_RESTORATION", ordinance_reference: "ORD-2026-404" }
              as: NetworkRecordsAdmin
              captures: { mw4_id: $.data.id }
