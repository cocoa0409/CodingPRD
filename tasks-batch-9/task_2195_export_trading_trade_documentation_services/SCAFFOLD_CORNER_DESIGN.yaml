# =============================================================================
# §1.9 Scaffold Corner Design — Task 2195 Export Trading & Trade-Documentation
#
# Breadth probe over §1.1–§1.7 of SCAFFOLD.yaml. Taxonomy sections and
# claim_type values are taken from references/claim-extraction-guide.md.
#
# Shared literals used across recipes (all values are LITERALS, never derived
# at test time):
#   logical clock at t0                    2026-08-01T00:00:00Z
#   canonical buyer                        legal_name "Hanwha Trading Co", KR, BBB
#   canonical order                        FOB / FOB Busan / US -> KR / ZONE_2 / USD 1.0
#                                          ship_by_date 2026-10-01T00:00:00Z
#   canonical line                         line_no 1, qty 100.000 EA @ 250.0000,
#                                          net 1000.000 kg, gross 1200.000 kg, 20 pkgs
#                                          => line_extended_usd 25000.00,
#                                             ordered_goods_value_usd 25000.00
#   canonical credit                       amount 25000.00, tolerance 10.00, SIGHT,
#                                          expiry 2026-11-30T00:00:00Z,
#                                          latest_shipment 2026-09-15T00:00:00Z
#                                          => max_drawable 27500.00, min_drawable 22500.00
#   canonical sailing                      HLCU / V2609E / ZONE_2, cutoff 2026-09-01,
#                                          etd 2026-09-03, eta 2026-09-20,
#                                          capacity 20000.000 kg, tariff 300.00
#   canonical FOB cost allocation          seller 584.00 (B1 84.00 + B2 180.00 + B3 320.00)
#                                          buyer 2816.25 (B4 690.00 + B5 96.25 +
#                                          B6 295.00 + B7 110.00 + B8 1625.00)
#   non-existent uuid                      00000000-0000-0000-0000-000000000000
#   users                                  u_ops_alice / u_ops_dana (ExportOpsCoordinator)
#                                          u_comp_carl (TradeComplianceOfficer)
#                                          u_rev_bob / u_rev_erin (DocumentaryCreditReviewer)
#                                          u_fin_frank (FinanceCollectionsOfficer)
#                                          u_admin_zoe (PlatformAdmin)
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # §1.1 Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: corner_export_order_created_in_draft_unsecured_with_system_fields
        claim_type: creation
        grounds:
          - entities.ExportOrder
          - endpoints.POST /export-orders
          - entities.ExportOrder.fields.fulfillment_status
          - entities.ExportOrder.fields.settlement_status
        distinguishing_aspect: "POST /export-orders returns 201 with both parallel state dimensions at their declared initial values (fulfillment_status DRAFT, settlement_status UNSECURED) and every computed money field at 0, and the buyer's open_order_count is bumped to 1 by the same request."
        test_recipe:
          setup:
            - "One ForeignBuyer with restricted_party_flag false and sanctions_tier NONE exists; no orders exist for it."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
          trigger:
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                invoice_currency: "USD"
                fx_rate_usd_to_invoice: 1.0
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
          assert:
            - "HTTP 201; response_type is \"object\"; data.fulfillment_status == \"DRAFT\"; data.settlement_status == \"UNSECURED\""
            - "data.ordered_goods_value_usd == 0, data.shipped_goods_value_usd == 0, data.provisional_seller_cost_usd == 0, data.final_seller_cost_usd == 0, data.cost_allocation_variance_usd == 0"
            - "data.outstanding_receivable_usd == 0, data.licensed_value_allocated_usd == 0, data.insured_exposure_usd == 0, data.short_shipped_value_usd == 0"
            - "GET /foreign-buyers/${buyer_id} as TradeComplianceOfficer returns data.open_order_count == 1 and data.aggregate_exposure_usd == 0"

      - name: corner_letter_of_credit_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.LetterOfCredit.fields.tolerance_pct
          - entities.LetterOfCredit.fields.usance_days
          - entities.LetterOfCredit.fields.presentation_period_days
          - entities.LetterOfCredit.fields.partial_shipment_allowed
          - endpoints.POST /letters-of-credit
        distinguishing_aspect: "Omitting tolerance_pct, usance_days, presentation_period_days, partial_shipment_allowed and transshipment_allowed yields 0, 0, 21, false and false — and because tolerance_pct defaults to 0 both drawing bounds collapse onto amount_usd (27500.00/22500.00 would only appear with the explicit 10.00 tolerance)."
        test_recipe:
          setup:
            - "A DRAFT order with one shipment line exists; the incoming credit body carries only the required fields."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /letters-of-credit"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                export_order_id: "${order_id}"
                lc_number: "LC-2026-0001"
                issuing_bank_swift: "HVBKKRSE"
                amount_usd: 25000.00
                availability: "SIGHT"
                expiry_date: "2026-11-30T00:00:00Z"
                latest_shipment_date: "2026-09-15T00:00:00Z"
                required_document_types: ["COMMERCIAL_INVOICE"]
              captures: { lc_id: "$.data.id" }
          assert:
            - "HTTP 201; data.tolerance_pct == 0; data.usance_days == 0; data.presentation_period_days == 21"
            - "data.partial_shipment_allowed == false; data.transshipment_allowed == false"
            - "data.max_drawable_usd == 25000.00 and data.min_drawable_usd == 25000.00 (tolerance 0 collapses both bounds onto amount_usd)"
            - "data.status == \"RECEIVED\"; data.amendment_round == 0; data.drawn_amount_usd == 0"

      - name: corner_foreign_buyer_sanctions_defaults_none_and_flag_false
        claim_type: defaults
        grounds:
          - entities.ForeignBuyer.fields.sanctions_tier
          - entities.ForeignBuyer.fields.restricted_party_flag
          - endpoints.POST /foreign-buyers
        distinguishing_aspect: "A buyer onboarded without sanctions_tier or restricted_party_flag lands on NONE/false — not WATCHLIST and not null — and restricted_party_reason stays null so the priority-14 gate never fires for it."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /foreign-buyers"
              as: PlatformAdmin
              as_user_id: "u_admin_zoe"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
          assert:
            - "HTTP 201; data.sanctions_tier == \"NONE\"; data.restricted_party_flag == false; data.restricted_party_reason is null"
            - "data.aggregate_exposure_usd == 0 and data.open_order_count == 0"

      - name: corner_get_export_order_returns_every_stored_and_computed_field
        claim_type: retrieval
        grounds:
          - endpoints.GET /export-orders/{export_order_id}
          - entities.ExportOrder
        distinguishing_aspect: "GET by id echoes the stored incoterm profile verbatim and exposes version — the value later required by expected_export_order_version — rather than a trimmed summary."
        test_recipe:
          setup:
            - "One DRAFT order with a single line worth 25000.00 USD exists."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                line_no: 1
                goods_description: "Industrial valve assembly"
                hs_code: "848180"
                quantity: 100.000
                uom: "EA"
                unit_price_usd: 250.0000
                net_weight_kg: 1000.000
                gross_weight_kg: 1200.000
                package_count: 20
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "GET /export-orders/${order_id}"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: {}
              captures: { order_v: "$.data.version" }
          assert:
            - "HTTP 200; data.id == ${order_id}; data.incoterm == \"FOB\"; data.incoterm_named_place == \"FOB Busan\"; data.destination_zone == \"ZONE_2\""
            - "data.ordered_goods_value_usd == 25000.00 (one line: round(100.000 * 250.0000, 2))"
            - "data.version is an integer >= 1 and is the value expected_export_order_version must carry on POST /document-presentations"

      - name: corner_list_export_orders_pagination_and_status_filter
        claim_type: listing
        grounds:
          - endpoints.GET /export-orders
          - response_envelope.pagination_fields
        distinguishing_aspect: "Two orders for the same buyer, limit 1 offset 0: exactly one element comes back with total_count 2 and has_more true, and a fulfillment_status=DRAFT filter still counts only matching rows rather than the whole table."
        test_recipe:
          setup:
            - "Two DRAFT orders exist for one buyer."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_a: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "CIF"
                incoterm_named_place: "CIF Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_b: "$.data.id" }
          trigger:
            - call: "GET /export-orders"
              as: PlatformAdmin
              as_user_id: "u_admin_zoe"
              payload: { buyer_id: "${buyer_id}", fulfillment_status: "DRAFT", limit: 1, offset: 0 }
              captures: { first_id: "$.data[0].id" }
          assert:
            - "HTTP 200; response_type is \"array\"; exactly 1 element in data"
            - "pagination reports limit == 1, offset == 0, total_count == 2, has_more == true"
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"

      - name: corner_get_unknown_export_order_id_not_found
        claim_type: not_found
        grounds:
          - validations.priority_5
          - errors[ERR_ORDER_NOT_FOUND]
          - endpoints.GET /export-orders/{export_order_id}
        distinguishing_aspect: "A syntactically valid but unpersisted uuid resolves to the priority-5 existence error ERR_ORDER_NOT_FOUND (404), not to an empty 200 body."
        test_recipe:
          setup: ["Empty database — no ExportOrder rows at all."]
          setup_api_calls: []
          trigger:
            - call: "GET /export-orders/00000000-0000-0000-0000-000000000000"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404; response_type is \"error\"; data.error_id == \"ERR_ORDER_NOT_FOUND\""

      - name: corner_shipment_line_missing_required_quantity_rejected
        claim_type: required_fields
        grounds:
          - entities.ShipmentLine.fields.quantity
          - endpoints.POST /export-orders/{export_order_id}/shipment-lines
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "quantity has source input, required true and no default, so omitting it is a priority-8 body violation (ERR_VALIDATION, 422) — it must not be silently treated as 0, which would otherwise pass the DRAFT->COMPLIANCE_PENDING precondition on quantity > 0."
        test_recipe:
          setup: ["A DRAFT order with no lines exists."]
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                line_no: 1
                goods_description: "Industrial valve assembly"
                hs_code: "848180"
                uom: "EA"
                unit_price_usd: 250.0000
                net_weight_kg: 1000.000
                gross_weight_kg: 1200.000
                package_count: 20
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422; data.error_id == \"ERR_VALIDATION\""
            - "GET /export-orders/${order_id}/shipment-lines returns total_count == 0 — no partial row was written"
            - "GET /export-orders/${order_id} still reports ordered_goods_value_usd == 0"

      - name: corner_ordered_goods_value_recomputed_per_line_rounding_first
        claim_type: computed_fields
        grounds:
          - entities.ExportOrder.fields.ordered_goods_value_usd
          - entities.ShipmentLine.fields.line_extended_usd
          - entities.ShipmentLine.fields.line_net_usd
          - calculations.commercial_invoice_totalling
        distinguishing_aspect: "Two lines with 3-decimal quantities and 4-decimal prices: each line is rounded to 2dp FIRST (12.345 * 10.1111 -> 124.82; 7.777 * 3.3333 -> 25.93) and the order total is the exact sum 150.75 — round(sum of raw products, 2) would give 150.76."
        test_recipe:
          setup:
            - "A DRAFT order with two lines whose raw products both round up at the third decimal."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                line_no: 1
                goods_description: "Valve seat ring"
                hs_code: "848180"
                quantity: 12.345
                uom: "KG"
                unit_price_usd: 10.1111
                net_weight_kg: 12.000
                gross_weight_kg: 13.000
                package_count: 1
              captures: { line_1: "$.data.id" }
          trigger:
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                line_no: 2
                goods_description: "Gasket set"
                hs_code: "848490"
                quantity: 7.777
                uom: "SET"
                unit_price_usd: 3.3333
                net_weight_kg: 4.000
                gross_weight_kg: 5.000
                package_count: 1
              captures: { line_2: "$.data.id" }
          assert:
            - "HTTP 201; data.line_extended_usd == 25.93 (round(7.777 * 3.3333, 2) = round(25.9311..., 2))"
            - "data.line_net_usd == 25.93 (line_discount_pct defaulted to 0)"
            - "GET /shipment-lines/${line_1} reports line_extended_usd == 124.82 (round(124.8210..., 2))"
            - "GET /export-orders/${order_id} reports ordered_goods_value_usd == 150.75 — the exact sum of the two already-rounded lines, not 150.76"

      - name: corner_system_fields_owned_by_server_on_order_and_document_create
        claim_type: system_fields
        grounds:
          - entities.ExportOrder.fields.prepared_by_user_id
          - entities.TradeDocument.fields.generated_by_user_id
          - entities.TradeDocument.fields.revision
          - entities.TradeDocument.fields.pinned_order_version
        distinguishing_aspect: "prepared_by_user_id and generated_by_user_id are stamped from the X-User-ID header (not from the body), revision starts at 1 and pinned_order_version is stamped from the order's version at generation — all four are source system and unsettable by the caller."
        test_recipe:
          setup:
            - "A DRAFT order with one 25000.00 USD line, created by u_ops_alice, exists."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                line_no: 1
                goods_description: "Industrial valve assembly"
                hs_code: "848180"
                quantity: 100.000
                uom: "EA"
                unit_price_usd: 250.0000
                net_weight_kg: 1000.000
                gross_weight_kg: 1200.000
                package_count: 20
              captures: { line_id: "$.data.id" }
            - call: "GET /export-orders/${order_id}"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: {}
              captures: { order_v: "$.data.version" }
          trigger:
            - call: "POST /trade-documents"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_dana"
              payload: { export_order_id: "${order_id}", doc_type: "COMMERCIAL_INVOICE" }
              captures: { invoice_id: "$.data.id" }
          assert:
            - "HTTP 201; data.generated_by_user_id == \"u_ops_dana\" (the X-User-ID of this call, not of the order's creator)"
            - "data.revision == 1; data.status == \"DRAFT\"; data.pinned_order_version == ${order_v}"
            - "data.origin_country_code == \"US\" — copied from the order at generation time"
            - "GET /export-orders/${order_id} still reports prepared_by_user_id == \"u_ops_alice\""

      - name: corner_invalid_incoterm_enum_value_rejected_with_validation
        claim_type: type_constraints
        grounds:
          - entities.ExportOrder.fields.incoterm
          - validations.priority_8
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "\"FOBX\" is outside the seven-member Incoterms 2020 enum, so priority 8 rejects with ERR_VALIDATION (422) before any FK existence check on buyer_id would matter."
        test_recipe:
          setup: ["One ForeignBuyer exists."]
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
          trigger:
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOBX"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422; data.error_id == \"ERR_VALIDATION\""
            - "GET /export-orders as PlatformAdmin with buyer_id=${buyer_id} returns total_count == 0"
            - "GET /foreign-buyers/${buyer_id} still reports open_order_count == 0 — the rejected create fired no side effect"

      - name: corner_presentation_document_link_is_immutable_read_only_junction
        claim_type: immutability
        grounds:
          - entities.PresentationDocumentLink
          - endpoints.GET /presentation-document-links/{link_id}
          - endpoints.GET /presentation-document-links
        distinguishing_aspect: "PresentationDocumentLink declares common_fields false: §1.5 exposes only the two GET reads for it, so a tender can never be edited in place — a superseding tender is expressed by a new link plus link_status REPLACED on the old one."
        test_recipe:
          setup:
            - "One presentation with a single ACTIVE link to the ISSUED commercial invoice exists (see corner_document_presentation_pins_document_revision_at_link_time for the identical chain)."
          setup_api_calls:
            - call: "GET /presentation-document-links"
              as: PlatformAdmin
              as_user_id: "u_admin_zoe"
              payload: { link_status: "ACTIVE", limit: 10, offset: 0 }
              captures: { link_id: "$.data[0].id" }
          trigger:
            - call: "GET /presentation-document-links/${link_id}"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: {}
              captures: { pinned_rev: "$.data.pinned_document_revision" }
          assert:
            - "HTTP 200; data.link_status == \"ACTIVE\"; data.pinned_document_revision == 1; data.linked_in_round == 1"
            - "the §1.5 endpoint table declares no POST, PATCH, PUT or DELETE on /presentation-document-links or /presentation-document-links/{link_id}"
            - "data carries no version field of its own — the junction is created and retired by cascade only"

      - name: corner_shipment_line_requires_existing_parent_order
        claim_type: parent_relationships
        grounds:
          - entities.ShipmentLine.parent
          - validations.priority_5
          - errors[ERR_ORDER_NOT_FOUND]
        distinguishing_aspect: "ShipmentLine's parent is ExportOrder and the parent id travels in the path, so an unresolvable export_order_id is a priority-5 path-parameter failure (ERR_ORDER_NOT_FOUND) evaluated before the priority-8 body checks — even though the body itself is well formed."
        test_recipe:
          setup: ["No ExportOrder rows exist."]
          setup_api_calls: []
          trigger:
            - call: "POST /export-orders/00000000-0000-0000-0000-000000000000/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                line_no: 1
                goods_description: "Industrial valve assembly"
                hs_code: "848180"
                quantity: 100.000
                uom: "EA"
                unit_price_usd: 250.0000
                net_weight_kg: 1000.000
                gross_weight_kg: 1200.000
                package_count: 20
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404; data.error_id == \"ERR_ORDER_NOT_FOUND\""

      - name: corner_buyer_body_fk_unresolvable_returns_buyer_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ExportOrder.fields.buyer_id
          - validations.priority_6
          - errors[ERR_BUYER_NOT_FOUND]
        distinguishing_aspect: "buyer_id arrives in the BODY, so the failure is priority 6 (body foreign keys, left-to-right in the endpoint's input order) rather than priority 5, and the returned code is ERR_BUYER_NOT_FOUND rather than ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["No ForeignBuyer rows exist."]
