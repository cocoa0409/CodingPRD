            - "Three error corrections are filed against item A while its prior case price is still 120000: 114000 (variance 0.05), 115000 (variance 0.0416...) and 116000 (variance 0.0333...); all three are admitted as SUBMITTED."
            - "The first two are approved, so the schedule's correction_count is 2 — exactly max_corrections_per_schedule — the item's live price is 115000 and the repeat-correction penalty of 100000 has accrued."
