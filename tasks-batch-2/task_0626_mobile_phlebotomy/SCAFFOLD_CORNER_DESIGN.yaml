  - section: consistency_model
    instances:
      - name: immediate_visibility_of_specimens_required_count_on_create
        claim_type: immediate
        grounds: [entities.LabOrder.fields.specimens_required_count]
        distinguishing_aspect: "All computed fields (specimens_required_count, total_due_cents, status) are present in the same POST /lab-orders response — immediate consistency."
        test_recipe:
          setup: ["Panel CMP14 (3 tubes, base 4000), partner Quest"]
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
          trigger:
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY" }
              as: OrderingProvider
              captures: { o_id: $.data.id, src: $.data.specimens_required_count, tdc: $.data.total_due_cents }
          assert:
            - "LabOrder.${o_id}.specimens_required_count == 3"
            - "LabOrder.${o_id}.total_due_cents == 8500"
