scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: cargo billing vs laytime)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cargo_invoice_provisional_vs_final_index
        grounds:
          - calculations.cargo_invoice_amount
          - entities.CargoSlot.fields.provisional_invoice_usd
          - entities.CargoSlot.fields.final_invoice_usd
        distinguishing_aspect: |
          Same cargo (3,600,000 mmbtu, fee 3.50, multiplier 1.15) invoiced twice:
          provisional at estimated index 2.85 gives 24,399,000.00; final at actual
          index 3.10 gives 25,434,000.00 — a 1,035,000.00 delta on identical quantity.
          Entity domain: cargo billing.
        test_recipe:
          setup:
            - "Customer, SPA (ACQ 36,000,000; fee 3.50; mult 1.15; est index 2.85), one commercial train, ADP confirmed+locked with one slot 3,600,000 mmbtu window 2027-01-10..2027-01-17"
            - "Vessel nominated (demurrage 85000/day), berth B1 (320m/120000t), call accepted window 2027-01-12..2027-01-14, NOR 06:00, berthed 14:00, departed 2027-01-13T22:24:00Z"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Acme LNG Buyer", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 2 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/record-commissioning-cargo", payload: { proceeds_usd: 1000000 }, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/record-commissioning-cargo", payload: { proceeds_usd: 1100000 }, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_v2: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v2}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-17T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot: $.data.id, slot_v: $.data.version } }
            - { call: "POST /api/adps/${adp}/propose", payload: {}, as: CommercialManager }
            - { call: "POST /api/adps/${adp}/confirm", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/adps/${adp}/lock", payload: {}, as: CommercialManager }
            - { call: "POST /api/cargo-slots/${slot}/vessel-nominations", payload: { vessel_name: "LNG Voyager", imo_number: "9876543", vessel_loa_m: 295, vessel_dwt_t: 97000, demurrage_rate_usd_per_day: 85000, expected_cargo_slot_version: "${slot_v}" }, as: CustomerRep, as_user_id: "${cust}", captures: { vc: $.data.id } }
            - { call: "POST /api/berths", payload: { name: "Berth 1", max_loa_m: 320, max_dwt_t: 120000 }, as: TerminalOperator, captures: { berth: $.data.id } }
            - { call: "POST /api/vessel-calls/${vc}/accept", payload: { berth_id: "${berth}", window_start: "2027-01-12T00:00:00Z", window_end: "2027-01-14T00:00:00Z" }, as: MarineScheduler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-12T06:00:00Z" }, as: TerminalOperator }
            - { call: "POST /api/vessel-calls/${vc}/tender-nor", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-12T14:00:00Z" }, as: TerminalOperator }
            - { call: "POST /api/vessel-calls/${vc}/berth", payload: {}, as: MarineScheduler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-13T22:24:00Z" }, as: TerminalOperator }
            - { call: "POST /api/vessel-calls/${vc}/depart", payload: {}, as: MarineScheduler }
          trigger:
            - { call: "POST /api/cargo-slots/${slot}/issue-final-invoice", payload: { actual_index_price_usd_per_mmbtu: 3.10 }, as: CommercialManager, captures: { final_inv: $.data.final_invoice_usd } }
          assert:
            - "CargoSlot.${slot}.provisional_invoice_usd == 24399000.00"
            - "CargoSlot.${slot}.final_invoice_usd == 25434000.00"
            - "CargoSlot.${slot}.billing_status == FINAL_INVOICED"
            - "CargoSlot.${slot}.lift_status == LOADED"

      - name: laytime_sof_vs_pumplog_basis
        grounds:
          - calculations.laytime_demurrage
          - entities.LaytimeStatement.fields.demurrage_amount_sof_usd
          - entities.LaytimeStatement.fields.demurrage_amount_pumplog_usd
        distinguishing_aspect: |
          Identical call: SOF basis counts elapsed minus a 4h exclusion (used 30.40h,
          demurrage 40,375.00); pump-log basis counts 26.5 pump hours plus 2h allowance
          (used 28.50h, demurrage 33,645.83). Entity domain: marine laytime — different
          from cargo billing.
        test_recipe:
          setup:
            - "Same full marine chain as cargo_invoice_provisional_vs_final_index: slot 3,600,000 mmbtu (allowed laytime = ceil(3600000/240000)+4 = 19h), NOR 2027-01-12T06:00Z, berthed 14:00Z (laytime start = min(12:00,14:00) = 12:00Z), departed 2027-01-13T22:24:00Z (elapsed 34.40h)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Beta Gas Holdings", credit_rating: "AA" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_v2: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v2}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-17T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot: $.data.id, slot_v: $.data.version } }
            - { call: "POST /api/adps/${adp}/propose", payload: {}, as: CommercialManager }
            - { call: "POST /api/adps/${adp}/confirm", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/adps/${adp}/lock", payload: {}, as: CommercialManager }
            - { call: "POST /api/cargo-slots/${slot}/vessel-nominations", payload: { vessel_name: "Gas Athena", imo_number: "9123456", vessel_loa_m: 295, vessel_dwt_t: 97000, demurrage_rate_usd_per_day: 85000, expected_cargo_slot_version: "${slot_v}" }, as: CustomerRep, as_user_id: "${cust}", captures: { vc: $.data.id } }
            - { call: "POST /api/berths", payload: { name: "Berth 1", max_loa_m: 320, max_dwt_t: 120000 }, as: TerminalOperator, captures: { berth: $.data.id } }
            - { call: "POST /api/vessel-calls/${vc}/accept", payload: { berth_id: "${berth}", window_start: "2027-01-12T00:00:00Z", window_end: "2027-01-14T00:00:00Z" }, as: MarineScheduler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-12T06:00:00Z" }, as: TerminalOperator }
            - { call: "POST /api/vessel-calls/${vc}/tender-nor", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-12T14:00:00Z" }, as: TerminalOperator }
            - { call: "POST /api/vessel-calls/${vc}/berth", payload: {}, as: MarineScheduler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-13T22:24:00Z" }, as: TerminalOperator }
            - { call: "POST /api/vessel-calls/${vc}/depart", payload: {}, as: MarineScheduler }
          trigger:
            - call: "POST /api/vessel-calls/${vc}/laytime-statements"
              payload:
                billing_basis: "SOF_BASIS"
                excluded_periods: [ { start: "2027-01-13T02:00:00Z", end: "2027-01-13T06:00:00Z", reason: "TERMINAL_SHORE_DELAY" } ]
                pump_hours: 26.5
              as: MarineScheduler
              captures: { ls: $.data.id }
          assert:
            - "LaytimeStatement.${ls}.allowed_laytime_hours == 19"
            - "LaytimeStatement.${ls}.laytime_start_at == 2027-01-12T12:00:00Z"
            - "LaytimeStatement.${ls}.used_laytime_hours_sof == 30.40"
            - "LaytimeStatement.${ls}.used_laytime_hours_pumplog == 28.50"
            - "LaytimeStatement.${ls}.demurrage_amount_sof_usd == 40375.00"
            - "LaytimeStatement.${ls}.demurrage_amount_pumplog_usd == 33645.83"
            - "LaytimeStatement.${ls}.billed_demurrage_usd == 40375.00"

  # =========================================================================
  # Rule 2 — combinatorial_formula (mode (a) nested min/max; mode (b) rounding order)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: proration_floor_and_largest_remainder
        grounds:
          - calculations.prorata_nomination_scaling
        distinguishing_aspect: |
          Mode (a): nested min/max with floor(nominated*factor), a 5,000 mmbtu floor,
          and a largest-remainder redistribution tie-broken by created_at ASC.
          Capacity 100,000 vs nominated 60,000/50,000/20,000 yields exactly
          46,154 / 38,461 / 15,385 — neither a naive proportional round nor a
          first-come allocation produces this vector.
        test_recipe:
          setup:
            - "SPA confirmed ADP (any quantities); pipeline PL-1 daily capacity 500,000; OPEN day schedule 2027-06-03 capacity 100,000; three slots (qty 5,000,000 each so feed-gas cap is not binding) with nominations 60,000 (first), 50,000 (second), 20,000 (third)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Gamma Energy Trading", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_v2: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v2}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-06-01T00:00:00Z", window_end: "2027-06-08T00:00:00Z", quantity_mmbtu: 5000000 }, as: CommercialManager, captures: { slotA: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-06-01T00:00:00Z", window_end: "2027-06-08T00:00:00Z", quantity_mmbtu: 5000000 }, as: CommercialManager, captures: { slotB: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-06-01T00:00:00Z", window_end: "2027-06-08T00:00:00Z", quantity_mmbtu: 5000000 }, as: CommercialManager, captures: { slotC: $.data.id } }
            - { call: "POST /api/pipelines", payload: { name: "PL-1", daily_capacity_mmbtu: 500000 }, as: TerminalOperator, captures: { pipe: $.data.id } }
            - { call: "POST /api/pipelines/${pipe}/day-schedules", payload: { gas_day: "2027-06-03", capacity_mmbtu: 100000 }, as: GasScheduler, captures: { sched: $.data.id } }
            - { call: "POST /api/pipeline-day-schedules/${sched}/nominations", payload: { cargo_slot_id: "${slotA}", nominated_mmbtu: 60000 }, as: GasScheduler, captures: { nomA: $.data.id } }
            - { call: "POST /api/pipeline-day-schedules/${sched}/nominations", payload: { cargo_slot_id: "${slotB}", nominated_mmbtu: 50000 }, as: GasScheduler, captures: { nomB: $.data.id } }
            - { call: "POST /api/pipeline-day-schedules/${sched}/nominations", payload: { cargo_slot_id: "${slotC}", nominated_mmbtu: 20000 }, as: GasScheduler, captures: { nomC: $.data.id } }
          trigger:
            - { call: "POST /api/pipeline-day-schedules/${sched}/close", payload: {}, as: GasScheduler }
          assert:
            - "FeedGasNomination.${nomA}.confirmed_mmbtu == 46154"
            - "FeedGasNomination.${nomA}.cut_mmbtu == 13846"
            - "FeedGasNomination.${nomA}.status == CONFIRMED"
            - "FeedGasNomination.${nomB}.confirmed_mmbtu == 38461"
            - "FeedGasNomination.${nomB}.cut_mmbtu == 11539"
            - "FeedGasNomination.${nomC}.confirmed_mmbtu == 15385"
            - "FeedGasNomination.${nomC}.cut_mmbtu == 4615"
            - "PipelineDaySchedule.${sched}.total_confirmed_mmbtu == 100000"

      - name: demurrage_segment_rounding_order
        grounds:
          - calculations.laytime_demurrage
        distinguishing_aspect: |
          Mode (b): pinned rounding order — each excluded period is rounded to whole
          minutes BEFORE summing (30m30s -> 31m; 60m30s -> 61m; sum 92m = 1.53h), so
          used = 21.50 - 1.53 = 19.97h and demurrage = 3,435.42. Summing raw seconds
          first (91m = 1.52h) would give 19.98h and 3,470.83 — the order matters.
        test_recipe:
          setup:
            - "Full marine chain; slot 3,600,000 mmbtu (allowed 19h); NOR 2027-01-12T00:00Z; berthed 2027-01-12T05:00Z so laytime starts min(06:00, 05:00) = 05:00Z; departed 2027-01-13T02:30:00Z (elapsed exactly 21.50h)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Delta Maritime Fuels", credit_rating: "BBB" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_v2: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v2}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-17T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot: $.data.id, slot_v: $.data.version } }
            - { call: "POST /api/adps/${adp}/propose", payload: {}, as: CommercialManager }
            - { call: "POST /api/adps/${adp}/confirm", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/adps/${adp}/lock", payload: {}, as: CommercialManager }
            - { call: "POST /api/cargo-slots/${slot}/vessel-nominations", payload: { vessel_name: "LNG Meridian", imo_number: "9550011", vessel_loa_m: 290, vessel_dwt_t: 95000, demurrage_rate_usd_per_day: 85000, expected_cargo_slot_version: "${slot_v}" }, as: CustomerRep, as_user_id: "${cust}", captures: { vc: $.data.id } }
            - { call: "POST /api/berths", payload: { name: "Berth 1", max_loa_m: 320, max_dwt_t: 120000 }, as: TerminalOperator, captures: { berth: $.data.id } }
            - { call: "POST /api/vessel-calls/${vc}/accept", payload: { berth_id: "${berth}", window_start: "2027-01-12T00:00:00Z", window_end: "2027-01-14T00:00:00Z" }, as: MarineScheduler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-12T00:00:00Z" }, as: TerminalOperator }
            - { call: "POST /api/vessel-calls/${vc}/tender-nor", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-12T05:00:00Z" }, as: TerminalOperator }
            - { call: "POST /api/vessel-calls/${vc}/berth", payload: {}, as: MarineScheduler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-13T02:30:00Z" }, as: TerminalOperator }
            - { call: "POST /api/vessel-calls/${vc}/depart", payload: {}, as: MarineScheduler }
          trigger:
            - call: "POST /api/vessel-calls/${vc}/laytime-statements"
              payload:
                billing_basis: "SOF_BASIS"
                excluded_periods:
                  - { start: "2027-01-12T10:00:00Z", end: "2027-01-12T10:30:30Z", reason: "WEATHER" }
                  - { start: "2027-01-12T15:00:00Z", end: "2027-01-12T16:00:30Z", reason: "TERMINAL_SHORE_DELAY" }
              as: MarineScheduler
              captures: { ls: $.data.id }
          assert:
            - "LaytimeStatement.${ls}.used_laytime_hours_sof == 19.97"
            - "LaytimeStatement.${ls}.billed_demurrage_usd == 3435.42"
            - "LaytimeStatement.${ls}.billed_demurrage_usd != 3470.83"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (cyclic Train; parallel-dimension CargoSlot)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: train_commercial_turnaround_cycle
        grounds:
          - state_machines.LiquefactionTrain.COMMERCIAL_OPERATION_to_TURNAROUND
          - state_machines.LiquefactionTrain.TURNAROUND_to_COMMERCIAL_OPERATION
        distinguishing_aspect: |
          Cyclic machine on LiquefactionTrain: COMMERCIAL_OPERATION -> TURNAROUND ->
          COMMERCIAL_OPERATION, with berth/pipeline contagion on both arcs.
        test_recipe:
          setup:
            - "Train commercial (COD declared); one APPROVED turnaround 2027-03-01..2027-03-05 proposed by op-1 approved by op-2; clock advanced to 2027-03-01; one berth and one pipeline registered"
          setup_api_calls:
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator, captures: { tr_v: $.data.version } }
            - { call: "POST /api/berths", payload: { name: "Berth 1", max_loa_m: 320, max_dwt_t: 120000 }, as: TerminalOperator, captures: { berth: $.data.id } }
            - { call: "POST /api/pipelines", payload: { name: "PL-1", daily_capacity_mmbtu: 500000 }, as: TerminalOperator, captures: { pipe: $.data.id } }
            - { call: "POST /api/trains/${tr}/turnarounds", payload: { planned_start_date: "2027-03-01", planned_end_date: "2027-03-05" }, as: TerminalOperator, as_user_id: "op-1", captures: { ta: $.data.id } }
            - { call: "POST /api/turnarounds/${ta}/approve", payload: {}, as: TerminalOperator, as_user_id: "op-2" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: TerminalOperator }
          trigger:
            - { call: "POST /api/turnarounds/${ta}/begin", payload: {}, as: TerminalOperator, as_user_id: "op-3" }
            - { call: "POST /api/turnarounds/${ta}/complete", payload: {}, as: TerminalOperator, as_user_id: "op-3" }
          assert:
            - "after begin: LiquefactionTrain.${tr}.status == TURNAROUND"
            - "after begin: Berth.${berth}.status == OUT_OF_SERVICE"
            - "after begin: Pipeline.${pipe}.status == OUTAGE"
            - "after complete: LiquefactionTrain.${tr}.status == COMMERCIAL_OPERATION (cycle closed)"
            - "after complete: Berth.${berth}.status == IN_SERVICE and Pipeline.${pipe}.status == IN_SERVICE"
            - "MaintenanceTurnaround.${ta}.lost_production_mmbtu == 3500000"

