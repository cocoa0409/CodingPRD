              as: Physician
              as_user_id: "${doc_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "FormRequest.${fr_id}.status == BLOCKED and blocked_reason == WELL_VISIT_STALE at creation, with HTTP 201"
            - "the issue response error_id == ERR_FORM_GATE_NOT_MET"
            - "the issue response HTTP status == 409"
            - "FormRequest.${fr_id}.status == BLOCKED, issued_at == null and sla_met == null"

