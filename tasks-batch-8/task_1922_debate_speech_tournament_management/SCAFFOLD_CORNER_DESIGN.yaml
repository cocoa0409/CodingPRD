            - { call: "POST /ballots", payload: { pairing_id: "${v1}", winner_entry_id: "${v1w}", speaker_points: { "${v1w}": 28, "${v1l}": 26 } }, as: Judge, as_user_id: "${j_b}", captures: { bv1: $.data.id } }
            - { call: "POST /ballots/${bv1}/submit", as: Judge, as_user_id: "${j_b}" }
            - { call: "POST /ballots/${bv1}/verify", as: TabStaff }
            - { call: "POST /rounds/${r3}/tabulate", as: TabStaff }
            - { call: "POST /tournaments/${t}/complete", as: TournamentDirector }
            - { call: "POST /logistics-orders", payload: { tournament_id: "${t}", kind: "AWARDS" }, as: TournamentDirector, captures: { o_aw: $.data.id } }
            - { call: "POST /logistics-orders/${o_aw}/submit", as: TournamentDirector }
          trigger:
            - { call: "POST /tournaments/${t}/publish-results", as: TournamentDirector }
            - { call: "GET /entries/${e_a1}", as: TournamentDirector }
            - { call: "GET /entries/${e_a2}", as: TournamentDirector }
            - { call: "GET /entries/${e_b2}", as: TournamentDirector }
            - { call: "GET /entries/${e_w}", as: TournamentDirector }
            - { call: "POST /tournaments/${t}/certify-qualifications", as: TournamentDirector, captures: { err: $.data.error_id } }
            - { call: "POST /hired-judge-contracts/${c_a}/pay", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /tournaments/${t}/certify-qualifications", as: TournamentDirector }
            - { call: "GET /tournaments/${t}", as: TournamentDirector }
            - { call: "GET /logistics-orders/${o_aw}", as: TournamentDirector }
          assert:
            - "Entry.${e_a1}: status == FINISHED, final_placement == CHAMPION, qualification_points == 10"
            - "Entry.${e_a2}: status == ELIMINATED, final_placement == RUNNER_UP (lost the field-2 elim), qualification_points == 8"
            - "Entry.${e_b2}: final_placement == NON_BREAKING, qualification_points == 1"
            - "Entry.${e_w}: status == WITHDRAWN, qualification_points == 0"
            - "first certify rejected with ERR_UNPAID_CONTRACTS_REMAIN (contract CONFIRMED, not PAID)"
            - "after pay: School.${s_a}.invoice_balance_cents == 5000 (entry fees 5000 + final fee 5000 - payment 5000)"
            - "second certify succeeds: Tournament.${t}.results_visibility == CERTIFIED while status == COMPLETED"
            - "LogisticsOrder.${o_aw}: awards_count == 2 and frozen_awards_count == 2 (bracket_size 2), status == SUBMITTED"

      - name: opponent_strength_computation
        claim_type: correct_result
        grounds: ["calculations.opponent_strength"]
        excluded_because:
          difficulty_instance: break_win_threshold_boundary
          rationale: "Asserted in the named difficulty instance: A1.opponent_strength == 1 (B1's 0 wins + B2's 1 win) after two tabulated rounds."

      - name: standings_tiebreak_chain
        claim_type: correct_result
        grounds: ["calculations.prelim_standings_ranking"]
        excluded_because:
          difficulty_instance: break_win_threshold_boundary
          rationale: "Asserted in the named difficulty instance: B2 vs C1 tie on wins (1) and adjusted points (50) is broken by opponent_strength 3 > 2 (ranks 3 and 4)."

      - name: bye_assignment_lowest_ordered
        claim_type: correct_result
        grounds: ["calculations.pairing_generation"]
        excluded_because:
          difficulty_instance: speaker_points_high_low_adjusted_divergence
          rationale: "Asserted in the named difficulty instance: the round-1 bye pairing's sole member is E1, the lowest-ordered entry in created_at order without a prior bye."
  # ------------------------------------------------------------ validations ---
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role, existence, or state check."
        test_recipe:
          setup: ["one tournament exists; the trigger request is sent with no X-User-* headers"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "AH", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
          trigger:
            - { call: "GET /tournaments/${t}", as: TournamentDirector, captures: { err: $.data.error_id } }
          assert: ["with auth headers omitted: error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400"]

      - name: tabstaff_action_as_coach_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "SchoolCoach is not in POST /rounds' role list (TabStaff exclusive): the call fails priority 2 with ERR_FORBIDDEN (403) before the division existence check."
        test_recipe:
          setup: ["tournament with one division"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "FB", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
          trigger:
            - { call: "POST /rounds", payload: { division_id: "${d}", round_number: 1, kind: "PRELIM", starts_at: "2026-08-12T14:00:00Z", ends_at: "2026-08-12T15:30:00Z" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN (403)"]

      - name: cross_school_entry_confirm_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_RESOURCE_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "Ownership (priority 3): coach of school Alpha confirming an entry owned by school Beta fails with ERR_RESOURCE_OWNERSHIP_MISMATCH (403) before any state check."
        test_recipe:
          setup: ["tournament open; schools Alpha and Beta; one REGISTERED entry owned by Beta"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "OW", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Beta" }, as: TournamentDirector, captures: { s_b: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_b}", division_id: "${d}", competitor_name: "B-One" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { e_b1: $.data.id } }
          trigger:
            - { call: "POST /entries/${e_b1}/confirm", as: SchoolCoach, as_user_id: "${s_a}", captures: { err: $.data.error_id } }
            - { call: "GET /entries/${e_b1}", as: TournamentDirector }
          assert:
            - "error_id == ERR_RESOURCE_OWNERSHIP_MISMATCH (403)"
            - "Entry.${e_b1}.status == REGISTERED (unchanged)"

      - name: contract_overpurchase_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_HIRED_ROUNDS_EXCEED_SHORTFALL]"]
        distinguishing_aspect: "rounds_requested (5) greater than the school's current shortfall (4) fails with ERR_HIRED_ROUNDS_EXCEED_SHORTFALL (422); the OCC version was correct, proving the sizing check itself fired."
        test_recipe:
          setup: ["tournament open (prelim_round_count 4); school Alpha with 2 confirmed entries (obligation 4, shortfall 4)"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "OP", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 4 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-Two" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e2: $.data.id } }
            - { call: "POST /entries/${e1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e2}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}", captures: { s_a_v: $.data.version } }
          trigger:
            - { call: "POST /hired-judge-contracts", payload: { school_id: "${s_a}", rounds_requested: 5, expected_school_version: "${s_a_v}" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_HIRED_ROUNDS_EXCEED_SHORTFALL (422)", "GET /hired-judge-contracts?school_id=${s_a} returns total_count == 0"]

      - name: credit_limit_boundary_exact_allowed_then_exceeded
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Credit boundary is inclusive (projected <= limit passes): a 2500 limit admits the first 2500 confirm exactly, and the second confirm (projection 5000) fails with ERR_CREDIT_LIMIT_EXCEEDED (402)."
        test_recipe:
          setup: ["tournament open (fee 2500); school Alpha with credit_limit_cents 2500 and two REGISTERED entries"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "CL", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", entry_fee_cents: 2500 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha", credit_limit_cents: 2500 }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-Two" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e2: $.data.id } }
          trigger:
            - { call: "POST /entries/${e1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e2}/confirm", as: SchoolCoach, as_user_id: "${s_a}", captures: { err: $.data.error_id } }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}" }
          assert:
            - "first confirm succeeds: projected invoice 2500 <= credit_limit 2500 (boundary allowed)"
            - "second confirm rejected: error_id == ERR_CREDIT_LIMIT_EXCEEDED (402)"
            - "School.${s_a}.invoice_balance_cents == 2500 and confirmed_entry_count == 1"

      - name: cross_tournament_entry_reference_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_CROSS_TOURNAMENT_REFERENCE]"]
        distinguishing_aspect: "An entry whose school belongs to tournament 1 and whose division belongs to tournament 2 fails referential integrity with ERR_CROSS_TOURNAMENT_REFERENCE (409)."
        test_recipe:
          setup: ["two tournaments T1 and T2, both with registration open; school Alpha in T1; division CX in T2"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "T1", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t1: $.data.id } }
            - { call: "POST /tournaments", payload: { name: "T2", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t2: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t2}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d2: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t1}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t1}/open-registration", as: TournamentDirector }
            - { call: "POST /tournaments/${t2}/open-registration", as: TournamentDirector }
          trigger:
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d2}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CROSS_TOURNAMENT_REFERENCE (409)"]

      - name: event_code_type_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_EVENT_CODE_TYPE_MISMATCH]"]
        distinguishing_aspect: "event_code OO (a speech code) with event_type DEBATE fails with ERR_EVENT_CODE_TYPE_MISMATCH (422)."
        test_recipe:
          setup: ["one tournament"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "EC", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
          trigger:
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "OO", division: "VARSITY" }, as: TournamentDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_EVENT_CODE_TYPE_MISMATCH (422)"]

      - name: duplicate_round_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_ROUND_NUMBER_EXISTS]", entities.Round.fields.round_number]
        distinguishing_aspect: "round_number is unique within a division: a second PRELIM round with round_number 1 fails with ERR_ROUND_NUMBER_EXISTS (409)."
        test_recipe:
          setup: ["tournament with division; round 1 already created"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "RN", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /rounds", payload: { division_id: "${d}", round_number: 1, kind: "PRELIM", starts_at: "2026-08-12T14:00:00Z", ends_at: "2026-08-12T15:30:00Z" }, as: TabStaff }
          trigger:
            - { call: "POST /rounds", payload: { division_id: "${d}", round_number: 1, kind: "PRELIM", starts_at: "2026-08-12T16:00:00Z", ends_at: "2026-08-12T17:30:00Z" }, as: TabStaff, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ROUND_NUMBER_EXISTS (409)"]

      - name: registration_window_not_open_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_REGISTRATION_WINDOW_NOT_OPEN]"]
        distinguishing_aspect: "With the logical clock at its startup default 2026-08-01T00:00:00Z and registration_opens_at 2026-08-02, open-registration fails with ERR_REGISTRATION_WINDOW_NOT_OPEN (the >= boundary at exactly opens_at would pass)."
        test_recipe:
          setup: ["tournament whose registration_opens_at is after the default logical clock"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "WN", registration_opens_at: "2026-08-02T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
          trigger:
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_REGISTRATION_WINDOW_NOT_OPEN (409)", "Tournament.${t}.status == DRAFT"]

      - name: lock_before_locks_at_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_REGISTRATION_WINDOW_CLOSED]"]
        distinguishing_aspect: "Locking with the logical clock at 2026-08-05 while registration_locks_at is 2026-08-10 fails with ERR_REGISTRATION_WINDOW_CLOSED; the OCC version was correct and the school gate vacuous, isolating the window check."
        test_recipe:
          setup: ["empty tournament, registration open, clock set to 2026-08-05 (before locks_at)"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "LW", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: TournamentDirector }
            - { call: "GET /tournaments/${t}", as: TournamentDirector, captures: { t_v: $.data.version } }
          trigger:
            - { call: "POST /tournaments/${t}/lock-registration", payload: { expected_tournament_version: "${t_v}" }, as: TournamentDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_REGISTRATION_WINDOW_CLOSED (409)", "Tournament.${t}.status == REGISTRATION_OPEN"]

      - name: division_global_cap_reached_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DIVISION_GLOBAL_CAP_REACHED]", entities.EventDivision.fields.global_entry_cap]
        distinguishing_aspect: "With global_entry_cap 2, the third entry into the division — from a school well under its own cap — fails with ERR_DIVISION_GLOBAL_CAP_REACHED (409)."
        test_recipe:
          setup: ["tournament open; division with global_entry_cap 2; schools Alpha, Beta (1 entry each already) and Gamma (none)"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "GC", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY", global_entry_cap: 2 }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Beta" }, as: TournamentDirector, captures: { s_b: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Gamma" }, as: TournamentDirector, captures: { s_c: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries", payload: { school_id: "${s_b}", division_id: "${d}", competitor_name: "B-One" }, as: SchoolCoach, as_user_id: "${s_b}" }
          trigger:
            - { call: "POST /entries", payload: { school_id: "${s_c}", division_id: "${d}", competitor_name: "C-One" }, as: SchoolCoach, as_user_id: "${s_c}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_DIVISION_GLOBAL_CAP_REACHED (409)", "GET /entries?division_id=${d} returns total_count == 2"]
      - name: ballot_window_closed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_BALLOT_WINDOW_CLOSED]"]
        distinguishing_aspect: "Ballot submit after round.ends_at + 60 minutes (round ends 15:30, clock advanced to 16:31) fails with ERR_BALLOT_WINDOW_CLOSED; the ballot stays DRAFT."
        test_recipe:
          setup:
            - "2-school debate fixture (Alpha, Beta; 1 confirmed entry each) with school Epsilon judge; locked; round 1 (2026-08-12 14:00-15:30) paired, staffed, ballots open; a DRAFT ballot exists; logical clock then advanced to 2026-08-12T16:31:00Z (one minute past the 16:30 deadline)."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "BW", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 2 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Beta" }, as: TournamentDirector, captures: { s_b: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Epsilon" }, as: TournamentDirector, captures: { s_e: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e_a1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_b}", division_id: "${d}", competitor_name: "B-One" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { e_b1: $.data.id } }
            - { call: "POST /entries/${e_a1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e_b1}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_a}", name: "J-Alpha" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { j_a: $.data.id } }
            - { call: "POST /judges/${j_a}/commit", payload: { commitment_rounds: 2 }, as: SchoolCoach, as_user_id: "${s_a}" }
