scenario: |
  Generate task harder than expert level!

  2457. Nonprofit Social Enterprise & Transitional Employment (nonprofit social enterprise): business line
  selection with market viability, training relevance and mission alignment, participant recruitment through
  referral partners with eligibility criteria and barriers assessment, transitional employment structure with
  wage, duration limits and graduation criteria to outside employment, job coaching, case management and
  support services layered onto the work experience, business operations with quality, cost and customer
  service standards despite a training workforce, subsidy accounting separating mission cost from business
  operating cost with true cost analysis, employer partnerships for placement with retention follow-up at
  defined intervals, outcome measurement on placement, wage progression and retention for funder reporting

domain_name: nonprofit-social-enterprise-transitional-employment
api_prefix: ""   # flat topology: every collection is a top-level path (e.g. /business-lines, /participants)

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - ops_run_checkpoint

  entity_topology: flat
  # Twelve peer entities linked by declared foreign keys; no nesting in URL paths except the
  # RetentionCheckpoint sub-resource read. Chosen deliberately over `hybrid` for diversity.

  state_machine_shape: cyclic
  # Participant is cyclic (TRANSITIONAL_EMPLOYED -> GRADUATED -> PLACED -> RE_ENTRY_ELIGIBLE ->
  # TRANSITIONAL_EMPLOYED, bounded by RE_ENTRY_LIMIT); Placement carries two parallel state dimensions
  # (employment_status x wage_verification_status); BusinessLine branches DRAFT -> {APPROVED, REJECTED};
  # WorkShift auto-closes from its children (compound).

  relationship_patterns:
    - one_to_many        # BusinessLine -> Participant/WorkShift/SubsidyPeriod; Placement -> RetentionCheckpoint
    - cross_aggregate    # ShiftAssignment couples WorkShift (business ops) to Participant (program side)
    - many_to_many       # Participant x WorkShift resolved through ShiftAssignment

  role_model: segregation_of_duties
  # The CaseManager who graduates a Participant MUST NOT be the same X-User-ID that certified the
  # participant's graduation readiness. Two entity_backed roles (ReferralPartner, EmployerPartner) add
  # ownership scoping on top.

  consistency_model: immediate

difficulty_level: expert_plus
# 12 entities / 49 endpoints / 51 error codes / 14 calculations (2 dual-variant) / 39 validations / 10 state machines.
# Density, not volume, is the goal: the subsidy ledger, the shift calendar and the retention clock all
# read each other's derived fields, so a single close() call moves five entities.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================

entities:
  - name: BusinessLine
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Trading name of the social-enterprise business line (e.g. "Cafe & Catering").
        constraints: 1..120 chars, required
      - name: market_viability_score
        type: integer
        source: input
        description: Market viability rating from the feasibility study.
        constraints: 0..100
      - name: training_relevance_score
        type: integer
        source: input
        description: How transferable the work skills are to outside employment.
        constraints: 0..100
      - name: mission_alignment_score
        type: integer
        source: input
        description: Fit with the nonprofit's mission and target population.
        constraints: 0..100
      - name: composite_viability_score
        type: number
        source: computed
        description: Output of calculations.composite_viability_score; 2 decimals.
      - name: status
        type: enum
        source: computed
        description: Lifecycle state driven by state_machines.BusinessLine.
        default: DRAFT
        constraints: "status IN {DRAFT, APPROVED, REJECTED, LAUNCHED, SUSPENDED}"
      - name: intake_posture
        type: enum
        source: computed
        description: Derived gate on new enrollment; output of calculations.intake_posture_recompute.
        default: CLOSED
        constraints: "intake_posture IN {OPEN, CLOSED}"
      - name: training_slots_total
        type: integer
        source: input
        description: Funded transitional-employment slots on this line.
        constraints: ">= 1"
      - name: training_slots_filled
        type: integer
        source: computed
        description: Count of Participant rows on this line with status IN {TRANSITIONAL_EMPLOYED, READY_FOR_GRADUATION}.
        default: 0
      - name: supervisor_capacity
        type: integer
        source: input
        description: Maximum trainees a supervisor can cover at any single instant across all shifts of this line.
        constraints: ">= 1"
      - name: target_gross_margin_pct
        type: number
        source: input
        description: Board-approved gross margin target for the trading operation, 4 decimals.
        constraints: 0.0000..0.9000
      - name: subsidy_cap_cents
        type: integer
        source: input
        description: Lifetime mission-subsidy ceiling for this line; breach suspends the line.
        constraints: ">= 0"
      - name: cumulative_subsidy_cents
        type: integer
        source: computed
        description: Running sum of subsidy_draw_cents over CLOSED SubsidyPeriod rows of this line.
        default: 0
      - name: quality_incident_count
        type: integer
        source: computed
        description: Running sum of quality_defect_count + customer_complaint_count over COMPLETED ShiftAssignment rows of this line.
        default: 0
      - name: rejection_reason
        type: string
        source: input
        description: Reason recorded when a review decision is REJECTED; null otherwise.
        default: null
      - name: launched_at
        type: datetime
        source: system
        description: Logical-clock instant the line moved to LAUNCHED; null before launch.
        default: null

  - name: ReferralPartner
    parent: null
    common_fields: true
    fields:
      - name: organization_name
        type: string
        source: input
        description: Referring community organization.
        constraints: 1..120 chars, required
      - name: mou_tier
        type: enum
        source: input
        description: MOU tier; feeds the partner multiplier of calculations.referral_eligibility_score.
        constraints: "mou_tier IN {TIER_1, TIER_2, TIER_3}"
      - name: mou_status
        type: enum
        source: input
        description: Whether the memorandum of understanding is in force.
        default: ACTIVE
        constraints: "mou_status IN {ACTIVE, LAPSED}"
      - name: referral_quota_per_period
        type: integer
        source: input
        description: Maximum referrals this partner may submit in the trailing 30 logical-clock days.
        constraints: ">= 1"
      - name: referrals_submitted_count
        type: integer
        source: computed
        description: Count of all Referral rows whose referral_partner_id is this partner.
        default: 0
      - name: enrolled_referral_count
        type: integer
        source: computed
        description: Count of Referral rows of this partner with status == ENROLLED.
        default: 0
      - name: conversion_rate
        type: number
        source: computed
        description: Output of calculations.partner_conversion_rate; null when referrals_submitted_count == 0.
        default: null

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: referral_partner_id
        type: string
        source: input
        description: FK -> ReferralPartner.id; the submitting partner.
      - name: candidate_reference
        type: string
        source: input
        description: Partner's own candidate handle; unique per (referral_partner_id, candidate_reference).
        constraints: 1..64 chars, required
      - name: status
        type: enum
        source: computed
        description: Lifecycle state driven by state_machines.Referral.
        default: SUBMITTED
        constraints: "status IN {SUBMITTED, WAITLISTED, ELIGIBLE, INELIGIBLE, ENROLLED}"
      - name: declared_barrier_codes
        type: array
        source: input
        description: Barriers self-declared at submission; each item IN {JUSTICE_INVOLVED, HOUSING_INSTABILITY, LONG_TERM_UNEMPLOYED, DISABILITY, LIMITED_ENGLISH, SUBSTANCE_RECOVERY, YOUTH_AGING_OUT}.
        constraints: 0..7 distinct codes
      - name: verified_barrier_codes
        type: array
        source: system
        description: Barriers confirmed during screening; subset of the declared enum set, written by the screen transition.
        default: []
      - name: household_income_cents
        type: integer
        source: input
        description: Gross monthly household income in cents.
        constraints: ">= 0"
      - name: household_size
        type: integer
        source: input
        description: Number of people in the household; indexes FPL_ANNUAL_BASE_CENTS_BY_SIZE.
        constraints: ">= 1"
      - name: hours_available_per_week
        type: integer
        source: input
        description: Hours the candidate can work each week.
        constraints: 0..40
      - name: fpl_ratio
        type: number
        source: computed
        description: Output of calculations.referral_eligibility_score step 2; 4 decimals; null before screening.
        default: null
      - name: eligibility_score
        type: number
        source: computed
        description: Output of calculations.referral_eligibility_score; 2 decimals; null before screening.
        default: null
      - name: priority_band
        type: enum
        source: computed
        description: Band derived from eligibility_score; null before screening.
        default: null
        constraints: "priority_band IN {BAND_A, BAND_B, BAND_C, null}"
      - name: screened_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent screen decision; null before screening.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the IntakeSpecialist who recorded the most recent screen decision (opaque operator id, not a FK).
        default: null

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: FK -> Referral.id; at most one Participant per Referral.
      - name: business_line_id
        type: string
        source: input
        description: FK -> BusinessLine.id; the line the participant is enrolled on.
      - name: status
        type: enum
        source: computed
        description: Lifecycle state driven by state_machines.Participant (cyclic).
        default: TRANSITIONAL_EMPLOYED
        constraints: "status IN {TRANSITIONAL_EMPLOYED, READY_FOR_GRADUATION, GRADUATED, PLACED, RE_ENTRY_ELIGIBLE, ALUMNI_RETAINED, EXITED_UNSUCCESSFUL}"
      - name: wage_cents_per_hour
        type: integer
        source: input
        description: Transitional-employment wage paid by the business line.
        constraints: PROGRAM_MIN_TRAINEE_WAGE_CENTS..PROGRAM_MAX_TRAINEE_WAGE_CENTS
      - name: max_transitional_weeks
        type: integer
        source: input
        description: Duration limit on transitional employment for this participant.
        default: 26
        constraints: 8..52
      - name: enrolled_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent enrollment or re-entry.
      - name: transitional_hours_worked
        type: number
        source: computed
        description: Sum of ShiftAssignment.actual_hours for this participant with status == COMPLETED; 3 decimals.
        default: 0
      - name: scheduled_hours_current_week
        type: number
        source: computed
        description: Sum of shift durations for this participant's ShiftAssignment rows with status == ASSIGNED whose WorkShift.starts_at falls in the ISO week (Mon 00:00Z .. Sun 24:00Z) containing the logical clock now; 3 decimals.
        default: 0
      - name: support_activity_minutes
        type: integer
        source: computed
        description: Sum of SupportActivity.duration_minutes for this participant with status == DELIVERED.
        default: 0
      - name: delivered_coaching_count
        type: integer
        source: computed
        description: Count of this participant's SupportActivity rows with status == DELIVERED and category == JOB_COACHING.
        default: 0
      - name: readiness_certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the JobCoach who certified graduation readiness (opaque operator id, not a FK); cleared to null on re-entry.
        default: null
      - name: readiness_certified_at
        type: datetime
        source: system
        description: Logical-clock instant readiness was certified; cleared to null on re-entry.
        default: null
      - name: graduated_at
        type: datetime
        source: system
        description: Logical-clock instant of graduation; null until GRADUATED.
        default: null
      - name: graduation_wage_cents_per_hour
        type: integer
        source: system
        description: Copy of wage_cents_per_hour frozen at graduation; baseline for wage-progression checks.
        default: null
      - name: re_entry_count
        type: integer
        source: computed
        description: Number of completed RE_ENTRY_ELIGIBLE -> TRANSITIONAL_EMPLOYED transitions.
        default: 0
      - name: eligible_re_entry_at
        type: datetime
        source: system
        description: Logical-clock instant the participant became RE_ENTRY_ELIGIBLE; null otherwise.
        default: null

  - name: WorkShift
    parent: null
    common_fields: true
    fields:
      - name: business_line_id
        type: string
        source: input
        description: FK -> BusinessLine.id; the trading operation the shift belongs to.
      - name: starts_at
        type: datetime
        source: input
        description: Shift start; intervals are half-open [starts_at, ends_at).
      - name: ends_at
        type: datetime
        source: input
        description: Shift end; must be strictly after starts_at and at most 12h later.
      - name: trainee_capacity
        type: integer
        source: input
        description: Seats on this single shift.
        constraints: ">= 1"
      - name: supervisor_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the supervising staffer on this shift (not a FK).
      - name: customer_service_standard
        type: enum
        source: input
        description: Service level the trading operation promises customers on this shift.
        default: STANDARD
        constraints: "customer_service_standard IN {STANDARD, PREMIUM}"
      - name: status
        type: enum
        source: computed
        description: Lifecycle state driven by state_machines.WorkShift (compound - auto-closes from children).
        default: SCHEDULED
        constraints: "status IN {SCHEDULED, CLOSED, CANCELLED}"
      - name: assigned_count
        type: integer
        source: computed
        description: Count of ShiftAssignment rows on this shift with status == ASSIGNED.
        default: 0
      - name: duration_hours
        type: number
        source: computed
        description: (ends_at - starts_at) in hours, 3 decimals.
      - name: billable_labor_cost_cents
        type: integer
        source: computed
        description: Output of calculations.shift_labor_cost; null until the shift is CLOSED.
        default: null
      - name: quality_defect_count
        type: integer
        source: computed
        description: Sum of quality_defect_count over this shift's COMPLETED ShiftAssignment rows.
        default: 0
      - name: customer_complaint_count
        type: integer
        source: computed
        description: Sum of customer_complaint_count over this shift's COMPLETED ShiftAssignment rows.
        default: 0

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - name: work_shift_id
        type: string
        source: input
        description: FK -> WorkShift.id; the shift being staffed.
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id; the trainee occupying the seat.
      - name: status
        type: enum
        source: computed
        description: Lifecycle state driven by state_machines.ShiftAssignment.
        default: ASSIGNED
        constraints: "status IN {ASSIGNED, COMPLETED, RELEASED}"
      - name: actual_hours
        type: number
        source: input
        description: Hours actually worked, supplied at completion; null while ASSIGNED or RELEASED.
        default: null
        constraints: "0 < actual_hours <= WorkShift.duration_hours + 0.5, 3 decimals"
      - name: quality_defect_count
        type: integer
        source: input
        description: Defects attributed to this trainee's output on the shift, supplied at completion.
        default: 0
        constraints: ">= 0"
      - name: customer_complaint_count
        type: integer
        source: input
        description: Customer complaints attributed to this trainee on the shift, supplied at completion.
        default: 0
        constraints: ">= 0"
      - name: wage_cost_cents
        type: integer
        source: computed
        description: Output of calculations.shift_labor_cost step 1 (per-assignment rounding); null until COMPLETED.
        default: null
      - name: released_reason
        type: enum
        source: system
        description: Why the seat was given up; null unless RELEASED.
        default: null
        constraints: "released_reason IN {MANUAL_RELEASE, SHIFT_CANCELLED, PARTICIPANT_EXITED, null}"

  - name: SupportActivity
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id; the person receiving the service.
      - name: category
        type: enum
        source: input
        description: Service layered onto the work experience.
        constraints: "category IN {JOB_COACHING, CASE_MANAGEMENT, TRANSPORT_VOUCHER, CHILDCARE_VOUCHER}"
      - name: status
        type: enum
        source: computed
        description: Lifecycle state driven by state_machines.SupportActivity.
        default: PLANNED
        constraints: "status IN {PLANNED, DELIVERED, VOIDED}"
      - name: duration_minutes
        type: integer
        source: input
        description: Contact minutes; required > 0 for JOB_COACHING and CASE_MANAGEMENT, must be 0 for voucher categories.
        constraints: 0..480
      - name: cost_cents
        type: integer
        source: input
        description: Mission cost of delivering this service.
        constraints: "> 0"
      - name: delivered_by_user_id
        type: string
        source: system
        description: X-User-ID of the JobCoach who marked the activity DELIVERED (opaque operator id, not a FK).
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: Logical-clock instant of delivery; null unless DELIVERED.
        default: null
      - name: voided_reason
        type: string
        source: input
        description: Reason captured when the activity is voided; null otherwise.
        default: null

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: organization_name
        type: string
        source: input
        description: Outside employer partnering for placements.
        constraints: 1..120 chars, required
      - name: industry_code
        type: string
        source: input
        description: Free-form industry label used in funder reporting.
        constraints: 1..32 chars
      - name: partnership_status
        type: enum
        source: computed
        description: Partnership standing driven by state_machines.Employer.
        default: ACTIVE
        constraints: "partnership_status IN {ACTIVE, PROBATION, TERMINATED}"
      - name: min_starting_wage_cents_per_hour
        type: integer
        source: input
        description: Wage floor the employer commits to for program placements.
        constraints: ">= 1500"
      - name: failed_retention_count
        type: integer
        source: computed
        description: Count of this employer's Placement rows with retention_outcome IN {FAILED_EARLY, FAILED_LATE}.
        default: 0
      - name: confirmed_retention_count
        type: integer
        source: computed
        description: Count of this employer's Placement rows with retention_outcome == RETAINED_180.
        default: 0
      - name: placement_count
        type: integer
        source: computed
        description: Count of all Placement rows whose employer_id is this employer.
        default: 0
      - name: retention_reliability_pct
        type: number
        source: computed
        description: Output of calculations.employer_retention_reliability; null when confirmed_retention_count + failed_retention_count == 0.
        default: null

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id; the graduate being placed.
      - name: employer_id
        type: string
        source: input
        description: FK -> Employer.id; the outside employer.
      - name: hire_date
        type: datetime
        source: input
        description: First day of outside employment, at 00:00:00Z; anchors the retention schedule.
      - name: starting_wage_cents_per_hour
        type: integer
        source: input
        description: Wage at hire; gated by the employer floor and the wage-progression floor.
        constraints: ">= 1500"
      - name: weekly_hours
        type: integer
        source: input
        description: Contracted weekly hours at the outside employer.
        constraints: 1..60
      - name: employment_status
        type: enum
        source: computed
        description: State dimension 1 (employment), driven by state_machines.Placement.
        default: ACTIVE
        constraints: "employment_status IN {ACTIVE, SEPARATED_VOLUNTARY, SEPARATED_INVOLUNTARY}"
      - name: wage_verification_status
        type: enum
        source: computed
        description: State dimension 2 (wage evidence), driven by state_machines.Placement and independent of employment_status.
        default: UNVERIFIED
        constraints: "wage_verification_status IN {UNVERIFIED, VERIFIED, DISPUTED}"
      - name: verified_wage_cents_per_hour
        type: integer
        source: system
        description: Wage evidenced by the employer or by a confirmed RetentionCheckpoint; null while UNVERIFIED.
        default: null
      - name: retention_outcome
        type: enum
        source: computed
        description: Funder-reportable retention result.
        default: PENDING
        constraints: "retention_outcome IN {PENDING, RETAINED_180, FAILED_EARLY, FAILED_LATE}"
      - name: separation_date
        type: datetime
        source: input
        description: Date employment ended, supplied on separation; null while ACTIVE.
        default: null
      - name: separation_days_after_hire
        type: integer
        source: computed
        description: Whole days between hire_date and separation_date; null while ACTIVE.
        default: null
      - name: wage_progression_pct
        type: number
        source: computed
        description: Output of calculations.wage_progression_pct; 4 decimals; null while wage_verification_status != VERIFIED.
        default: null
      - name: at_risk_flag
        type: boolean
        source: computed
        description: Set true by a MISSED retention checkpoint or by the employer entering PROBATION.
        default: false

  - name: RetentionCheckpoint
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement being followed up.
      - name: interval_days
        type: integer
        source: system
        description: Follow-up interval; one row per member of RETENTION_INTERVAL_DAYS.
        constraints: "interval_days IN {30, 90, 180, 365}"
      - name: due_date
        type: datetime
        source: computed
        description: Output of calculations.retention_checkpoint_schedule; hire_date + interval_days at 00:00:00Z.
      - name: status
        type: enum
        source: computed
        description: Lifecycle state driven by state_machines.RetentionCheckpoint.
        default: SCHEDULED
        constraints: "status IN {SCHEDULED, CONFIRMED, MISSED, VOIDED}"
      - name: still_employed
        type: boolean
        source: input
        description: Employer's answer at confirmation; null while SCHEDULED.
        default: null
      - name: verified_wage_cents_per_hour
        type: integer
        source: input
        description: Wage evidenced at this checkpoint; null while SCHEDULED.
        default: null
      - name: confirmed_at
        type: datetime
        source: system
        description: Logical-clock instant of confirmation; null unless CONFIRMED.
        default: null

  - name: SubsidyPeriod
    parent: null
    common_fields: true
    fields:
      - name: business_line_id
        type: string
        source: input
        description: FK -> BusinessLine.id; periods never overlap within one line.
      - name: period_start
        type: datetime
        source: input
        description: First instant of the accounting period, 00:00:00Z; intervals are closed [period_start, period_end].
      - name: period_end
        type: datetime
        source: input
        description: Last instant of the accounting period, 00:00:00Z of the final day; must be after period_start.
      - name: status
        type: enum
        source: computed
        description: Lifecycle state driven by state_machines.SubsidyPeriod.
        default: OPEN
        constraints: "status IN {OPEN, CLOSED}"
      - name: supervisor_hours
        type: number
        source: input
        description: Budgeted non-trainee supervision hours for the period; denominator partner of trainee_hours in the HOURS allocation basis.
        constraints: ">= 0, 3 decimals"
      - name: allocation_basis
        type: enum
        source: computed
        description: Basis actually applied; HOURS while OPEN, frozen to the basis chosen at close.
        default: HOURS
        constraints: "allocation_basis IN {HOURS, REVENUE}"
      - name: revenue_cents
        type: integer
        source: input
        description: Trading revenue for the period, supplied at close; null while OPEN.
        default: null
      - name: trainee_hours
        type: number
        source: computed
        description: Sum of ShiftAssignment.actual_hours for COMPLETED assignments whose WorkShift.business_line_id == this line and WorkShift.starts_at IN [period_start, period_end]; 3 decimals.
        default: 0
      - name: mission_cost_cents
        type: integer
        source: computed
        description: Sum of CostEntry.allocated_mission_cents over this period's CostEntry rows with status == POSTED.
        default: 0
      - name: business_operating_cost_cents
        type: integer
        source: computed
        description: Sum of CostEntry.allocated_business_cents over this period's CostEntry rows with status == POSTED.
        default: 0
      - name: total_cost_cents
        type: integer
        source: computed
        description: mission_cost_cents + business_operating_cost_cents.
        default: 0
      - name: mission_share
        type: number
        source: computed
        description: Share of each SHARED CostEntry charged to mission; output of calculations.subsidy_cost_allocation; 4 decimals.
        default: 0
      - name: true_cost_per_trainee_hour_cents
        type: number
        source: computed
        description: Output of calculations.true_cost_analysis; null when trainee_hours == 0.
        default: null
      - name: subsidy_per_trainee_hour_cents
        type: number
        source: computed
        description: Output of calculations.true_cost_analysis; null when trainee_hours == 0.
        default: null
      - name: margin_pct
        type: number
        source: computed
        description: Pre-subsidy trading margin, output of calculations.subsidy_draw step 2; null while OPEN.
        default: null
      - name: subsidy_rate
        type: number
        source: computed
        description: Tier selected from margin_pct by calculations.subsidy_draw; null while OPEN.
        default: null
      - name: subsidy_draw_cents
        type: integer
        source: computed
        description: Mission subsidy drawn for the period; output of calculations.subsidy_draw; null while OPEN.
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant of close; null while OPEN.
        default: null

  - name: CostEntry
    parent: null
    common_fields: true
    fields:
      - name: subsidy_period_id
        type: string
        source: input
        description: FK -> SubsidyPeriod.id; the period the cost lands in.
      - name: source_activity_id
        type: string
        source: input
        description: FK -> SupportActivity.id; set only on entries auto-posted by a SupportActivity delivery, null otherwise.
        default: null
      - name: category
        type: enum
        source: input
        description: Cost category; TRAINEE_WAGES, COACHING and SUPPORT_SERVICE are system-posted only.
        constraints: "category IN {TRAINEE_WAGES, SUPERVISION, MATERIALS, COACHING, SUPPORT_SERVICE, OVERHEAD}"
      - name: classification
        type: enum
        source: input
        description: Mission/business split treatment; SHARED entries are apportioned by SubsidyPeriod.mission_share.
        constraints: "classification IN {MISSION, BUSINESS, SHARED}"
      - name: amount_cents
        type: integer
        source: input
        description: Gross cost in cents.
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: POSTED entries count toward the ledger; VOIDED entries are excluded from every aggregate.
        default: POSTED
        constraints: "status IN {POSTED, VOIDED}"
      - name: allocated_mission_cents
        type: integer
        source: computed
        description: Mission portion of amount_cents; output of calculations.subsidy_cost_allocation.
        default: 0
      - name: allocated_business_cents
        type: integer
        source: computed
        description: amount_cents - allocated_mission_cents (exact complement, so the two sides always reconcile).
        default: 0
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant the entry was voided; null while POSTED.
        default: null

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================

state_machines:
  - entity: BusinessLine
    initial_state: DRAFT
    terminal_states: [REJECTED, SUSPENDED]
    shape: branching
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /business-lines/{businessLineId}/review with decision == APPROVED"
        actor: ProgramDirector
        preconditions:
          - "business_line.status == DRAFT"
          - "composite_viability_score >= VIABILITY_COMPOSITE_FLOOR (70.00)"
          - "min(market_viability_score, training_relevance_score, mission_alignment_score) >= VIABILITY_DIMENSION_FLOOR (50)"
        side_effects:
          - "status = APPROVED"
          - "recompute intake_posture via calculations.intake_posture_recompute (stays CLOSED because status != LAUNCHED)"
          - "increments BusinessLine.version by 1"
        note: "Divergent branch A of the fork: no rejection_reason is written."
      - from: DRAFT
        to: REJECTED
        trigger: "POST /business-lines/{businessLineId}/review with decision == REJECTED"
        actor: ProgramDirector
        preconditions:
          - "business_line.status == DRAFT"
          - "rejection_reason is present and non-empty"
        side_effects:
          - "status = REJECTED"
          - "rejection_reason = request rejection_reason"
          - "intake_posture stays CLOSED"
          - "increments BusinessLine.version by 1"
        note: "Divergent branch B of the fork: viability gate is NOT evaluated, rejection_reason is mandatory."
      - from: APPROVED
        to: LAUNCHED
        trigger: "POST /business-lines/{businessLineId}/launch"
        actor: ProgramDirector
        preconditions:
          - "business_line.status == APPROVED"
          - "training_slots_total >= 1 AND supervisor_capacity >= 1"
        side_effects:
          - "status = LAUNCHED"
          - "launched_at = logical clock now"
          - "recompute intake_posture via calculations.intake_posture_recompute (becomes OPEN when training_slots_filled < training_slots_total AND quality_incident_count < QUALITY_INCIDENT_LIMIT)"
          - "increments BusinessLine.version by 1"
      - from: LAUNCHED
        to: SUSPENDED
        trigger: "system: cascade hop 3 of the SubsidyPeriod close chain, when cumulative_subsidy_cents > subsidy_cap_cents"
        actor: system
        preconditions:
          - "business_line.status == LAUNCHED"
          - "cumulative_subsidy_cents > subsidy_cap_cents after the closing period's subsidy_draw_cents was added"
        side_effects:
          - "status = SUSPENDED"
          - "recompute intake_posture via calculations.intake_posture_recompute -> CLOSED (status != LAUNCHED)"
          - "cascade hop 4: every WorkShift with business_line_id == this line, status == SCHEDULED and starts_at > logical clock now moves SCHEDULED -> CANCELLED (processing order starts_at ASC, then created_at ASC)"
          - "cascade hop 5: for each shift cancelled in hop 4, every ShiftAssignment on it with status == ASSIGNED moves ASSIGNED -> RELEASED with released_reason = SHIFT_CANCELLED, and each affected Participant.scheduled_hours_current_week is recomputed"
          - "increments BusinessLine.version by 1"

  - entity: Referral
    initial_state: SUBMITTED
    terminal_states: [INELIGIBLE, ENROLLED]
    shape: branching_with_revisit
    transitions:
      - from: SUBMITTED
        to: ELIGIBLE
        trigger: "POST /referrals/{referralId}/screen with decision == ELIGIBLE"
        actor: IntakeSpecialist
        preconditions:
          - "referral.status IN {SUBMITTED, WAITLISTED}"
          - "referral_partner.mou_status == ACTIVE"
          - "count(verified_barrier_codes) >= 1"
          - "hours_available_per_week >= MIN_WEEKLY_AVAILABILITY_HOURS (20)"
          - "eligibility_score >= ELIGIBILITY_SCORE_FLOOR (50.00) after calculations.referral_eligibility_score runs on the verified inputs"
        side_effects:
          - "verified_barrier_codes = request verified_barrier_codes"
          - "household_income_cents / household_size / hours_available_per_week overwritten with the verified values from the request"
          - "recompute fpl_ratio, eligibility_score and priority_band via calculations.referral_eligibility_score"
          - "screened_at = logical clock now; decided_by_user_id = X-User-ID"
          - "status = ELIGIBLE"
      - from: SUBMITTED
        to: WAITLISTED
        trigger: "POST /referrals/{referralId}/screen with decision == WAITLISTED"
        actor: IntakeSpecialist
        preconditions:
          - "referral.status IN {SUBMITTED, WAITLISTED}"
          - "referral_partner.mou_status == ACTIVE"
        side_effects:
          - "verified_barrier_codes = request verified_barrier_codes"
          - "recompute fpl_ratio, eligibility_score and priority_band via calculations.referral_eligibility_score"
          - "screened_at = logical clock now; decided_by_user_id = X-User-ID"
          - "status = WAITLISTED"
        note: "Divergent branch: the score floor is NOT enforced, so a below-floor candidate can be parked and re-screened later."
      - from: WAITLISTED
        to: ELIGIBLE
        trigger: "POST /referrals/{referralId}/screen with decision == ELIGIBLE (re-screen after new evidence)"
        actor: IntakeSpecialist
        preconditions:
          - "referral.status == WAITLISTED"
          - "referral_partner.mou_status == ACTIVE"
          - "count(verified_barrier_codes) >= 1"
          - "hours_available_per_week >= MIN_WEEKLY_AVAILABILITY_HOURS (20)"
          - "eligibility_score >= ELIGIBILITY_SCORE_FLOOR (50.00) on the re-verified inputs"
        side_effects:
          - "same side effects as SUBMITTED -> ELIGIBLE; screened_at and decided_by_user_id are overwritten"
      - from: SUBMITTED
        to: INELIGIBLE
        trigger: "POST /referrals/{referralId}/screen with decision == INELIGIBLE"
        actor: IntakeSpecialist
        preconditions:
          - "referral.status IN {SUBMITTED, WAITLISTED}"
        side_effects:
          - "verified_barrier_codes = request verified_barrier_codes"
          - "recompute fpl_ratio, eligibility_score and priority_band via calculations.referral_eligibility_score"
          - "screened_at = logical clock now; decided_by_user_id = X-User-ID"
          - "status = INELIGIBLE (terminal)"
      - from: WAITLISTED
        to: INELIGIBLE
        trigger: "POST /referrals/{referralId}/screen with decision == INELIGIBLE"
        actor: IntakeSpecialist
        preconditions:
          - "referral.status == WAITLISTED"
        side_effects:
          - "same side effects as SUBMITTED -> INELIGIBLE"
      - from: ELIGIBLE
        to: ENROLLED
        trigger: "POST /participants (enrollment consumes the referral)"
        actor: IntakeSpecialist
        preconditions:
          - "referral.status == ELIGIBLE"
          - "no Participant row already references this referral_id"
        side_effects:
          - "status = ENROLLED (terminal)"
          - "recompute ReferralPartner.enrolled_referral_count and ReferralPartner.conversion_rate via calculations.partner_conversion_rate"

  - entity: Participant
    initial_state: TRANSITIONAL_EMPLOYED
    terminal_states: [ALUMNI_RETAINED, EXITED_UNSUCCESSFUL]
    shape: cyclic
    transitions:
      - from: TRANSITIONAL_EMPLOYED
        to: READY_FOR_GRADUATION
        trigger: "POST /participants/{participantId}/certify-readiness"
        actor: JobCoach
        preconditions:
          - "participant.status == TRANSITIONAL_EMPLOYED"
          - "transitional_hours_worked >= MIN_TRANSITIONAL_HOURS (24.000)"
          - "support_activity_minutes >= MIN_SUPPORT_MINUTES (180)"
          - "delivered_coaching_count >= MIN_COACHING_SESSIONS (2)"
        side_effects:
          - "status = READY_FOR_GRADUATION"
          - "readiness_certified_by_user_id = X-User-ID; readiness_certified_at = logical clock now"
          - "BusinessLine.training_slots_filled unchanged (READY_FOR_GRADUATION still occupies a slot); intake_posture recomputed"
      - from: READY_FOR_GRADUATION
        to: GRADUATED
        trigger: "POST /participants/{participantId}/graduate"
        actor: CaseManager
        preconditions:
          - "participant.status == READY_FOR_GRADUATION"
          - "X-User-ID != participant.readiness_certified_by_user_id (segregation of duties)"
          - "participant has no ShiftAssignment with status == ASSIGNED"
        side_effects:
          - "status = GRADUATED"
          - "graduated_at = logical clock now; graduation_wage_cents_per_hour = wage_cents_per_hour"
          - "BusinessLine.training_slots_filled recomputed (slot released) and intake_posture recomputed via calculations.intake_posture_recompute"
          - "increments BusinessLine.version by 1"
      - from: GRADUATED
        to: PLACED
        trigger: "POST /placements (placement creation consumes the graduate)"
        actor: CaseManager
        preconditions:
          - "participant.status == GRADUATED"
          - "employer.partnership_status == ACTIVE"
        side_effects:
          - "status = PLACED"
          - "four RetentionCheckpoint rows created per calculations.retention_checkpoint_schedule"
      - from: PLACED
        to: RE_ENTRY_ELIGIBLE
        trigger: "system: cascade of POST /placements/{placementId}/separate when the resulting retention_outcome == FAILED_EARLY"
        actor: system
        preconditions:
          - "participant.status == PLACED"
          - "placement.retention_outcome == FAILED_EARLY (separation_days_after_hire < EARLY_SEPARATION_DAYS = 90)"
        side_effects:
          - "status = RE_ENTRY_ELIGIBLE"
          - "eligible_re_entry_at = logical clock now"
        # NOTE: this cascade is unconditional on re_entry_count. The RE_ENTRY_LIMIT is enforced at the
        # re-entry endpoint (validations priority 25, ERR_RE_ENTRY_LIMIT_REACHED), not here; a participant
        # who has already re-entered twice therefore parks in RE_ENTRY_ELIGIBLE and is swept to
        # EXITED_UNSUCCESSFUL by POST /retention-sweeps once RE_ENTRY_WINDOW_DAYS (60) elapses. Exiting the
        # participant inside the separation cascade instead would make ERR_RE_ENTRY_LIMIT_REACHED
        # unreachable (priority 6 ERR_INVALID_STATE_TRANSITION would always fire first).
      - from: RE_ENTRY_ELIGIBLE
        to: TRANSITIONAL_EMPLOYED
        trigger: "POST /participants/{participantId}/re-enter"
        actor: IntakeSpecialist
        preconditions:
          - "participant.status == RE_ENTRY_ELIGIBLE"
          - "participant.re_entry_count < RE_ENTRY_LIMIT (2)"
          - "business_line.status == LAUNCHED AND business_line.intake_posture == OPEN"
        side_effects:
          - "status = TRANSITIONAL_EMPLOYED (closes the cycle)"
          - "re_entry_count incremented by 1; enrolled_at = logical clock now"
          - "readiness_certified_by_user_id = null; readiness_certified_at = null; graduated_at = null; graduation_wage_cents_per_hour = null; eligible_re_entry_at = null"
          - "wage_cents_per_hour overwritten with the request wage_cents_per_hour"
          - "BusinessLine.training_slots_filled and intake_posture recomputed; increments BusinessLine.version by 1"
      - from: RE_ENTRY_ELIGIBLE
        to: EXITED_UNSUCCESSFUL
        trigger: "POST /retention-sweeps (ops run), when logical clock now > eligible_re_entry_at + RE_ENTRY_WINDOW_DAYS (60)"
        actor: system
        preconditions:
          - "participant.status == RE_ENTRY_ELIGIBLE"
          - "logical clock now > eligible_re_entry_at + 60 days"
        side_effects:
          - "status = EXITED_UNSUCCESSFUL (terminal)"
      - from: TRANSITIONAL_EMPLOYED
        to: EXITED_UNSUCCESSFUL
        trigger: "POST /retention-sweeps (ops run), when logical clock now > enrolled_at + max_transitional_weeks * 7 days"
        actor: system
        preconditions:
          - "participant.status == TRANSITIONAL_EMPLOYED"
          - "logical clock now > enrolled_at + max_transitional_weeks * 7 days (duration limit)"
        side_effects:
          - "status = EXITED_UNSUCCESSFUL (terminal)"
          - "every ShiftAssignment of this participant with status == ASSIGNED moves ASSIGNED -> RELEASED with released_reason = PARTICIPANT_EXITED (processing order WorkShift.starts_at ASC, then ShiftAssignment.created_at ASC)"
          - "BusinessLine.training_slots_filled and intake_posture recomputed"
      - from: READY_FOR_GRADUATION
        to: EXITED_UNSUCCESSFUL
        trigger: "POST /retention-sweeps (ops run), when logical clock now > enrolled_at + max_transitional_weeks * 7 days"
        actor: system
        preconditions:
          - "participant.status == READY_FOR_GRADUATION"
          - "logical clock now > enrolled_at + max_transitional_weeks * 7 days"
        side_effects:
          - "same side effects as TRANSITIONAL_EMPLOYED -> EXITED_UNSUCCESSFUL"
      - from: PLACED
        to: ALUMNI_RETAINED
        trigger: "system: cascade hop 3 of POST /retention-checkpoints/{retentionCheckpointId}/confirm when interval_days == 180"
        actor: system
        preconditions:
          - "participant.status == PLACED"
          - "placement.retention_outcome == RETAINED_180 (written by hop 2)"
        side_effects:
          - "status = ALUMNI_RETAINED (terminal)"

  - entity: WorkShift
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    shape: compound
    transitions:
      - from: SCHEDULED
        to: CLOSED
        trigger: "system: auto-transition evaluated after every POST /shift-assignments/{shiftAssignmentId}/complete and /release"
        actor: system
        preconditions:
          - "work_shift.status == SCHEDULED"
          - "the shift has >= 1 ShiftAssignment row"
          - "every ShiftAssignment on the shift has status IN {COMPLETED, RELEASED}"
          - "at least one ShiftAssignment on the shift has status == COMPLETED"
        side_effects:
          - "status = CLOSED"
          - "billable_labor_cost_cents computed via calculations.shift_labor_cost (per-assignment rounding, then sum)"
          - "quality_defect_count and customer_complaint_count aggregated from COMPLETED assignments"
        note: "Compound/bubble-up: the parent's state is a function of its children's states."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade hop 4 of the BusinessLine LAUNCHED -> SUSPENDED transition"
        actor: system
        preconditions:
          - "work_shift.status == SCHEDULED"
          - "work_shift.starts_at > logical clock now"
        side_effects:
          - "status = CANCELLED"
          - "cascade hop 5: each ASSIGNED ShiftAssignment on this shift moves to RELEASED with released_reason = SHIFT_CANCELLED"

  - entity: ShiftAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, RELEASED]
    shape: branching
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /shift-assignments/{shiftAssignmentId}/complete"
        actor: CaseManager
        preconditions:
          - "shift_assignment.status == ASSIGNED"
          - "work_shift.status == SCHEDULED"
          - "logical clock now >= work_shift.starts_at"
          - "0 < actual_hours <= work_shift.duration_hours + ACTUAL_HOURS_GRACE (0.5)"
          - "a SubsidyPeriod exists for work_shift.business_line_id with status == OPEN covering work_shift.starts_at (selector pinned in calculations.open_period_selector)"
        side_effects:
          - "status = COMPLETED; actual_hours, quality_defect_count and customer_complaint_count stored"
          - "wage_cost_cents = round_half_up(actual_hours * participant.wage_cents_per_hour) per calculations.shift_labor_cost step 1"
          - "one CostEntry auto-posted into the selected SubsidyPeriod with category = TRAINEE_WAGES, classification = SHARED, amount_cents = wage_cost_cents, source_activity_id = null, status = POSTED; increments SubsidyPeriod.version by 1"
          - "cascade hop 2: the new CostEntry makes SubsidyPeriod recompute trainee_hours, mission_share, per-entry allocations, mission_cost_cents, business_operating_cost_cents, total_cost_cents and the two true-cost ratios via calculations.subsidy_cost_allocation + calculations.true_cost_analysis"
          - "Participant.transitional_hours_worked and Participant.scheduled_hours_current_week recomputed"
          - "cascade hop 2': WorkShift.quality_defect_count / customer_complaint_count recomputed; hop 3: BusinessLine.quality_incident_count recomputed; hop 4: BusinessLine.intake_posture recomputed -> CLOSED once quality_incident_count >= QUALITY_INCIDENT_LIMIT (10)"
          - "WorkShift auto-close evaluated (see WorkShift SCHEDULED -> CLOSED)"
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /shift-assignments/{shiftAssignmentId}/release"
        actor: CaseManager
        preconditions:
          - "shift_assignment.status == ASSIGNED"
          - "work_shift.status == SCHEDULED"
        side_effects:
          - "status = RELEASED; released_reason = MANUAL_RELEASE"
          - "WorkShift.assigned_count recomputed (seat returned)"
          - "Participant.scheduled_hours_current_week recomputed (hours returned)"
          - "no CostEntry is created and none is voided - the compensating action leaves the ledger untouched"
          - "WorkShift auto-close evaluated"

  - entity: SupportActivity
    initial_state: PLANNED
    terminal_states: [VOIDED]
    shape: branching
    transitions:
      - from: PLANNED
        to: DELIVERED
        trigger: "POST /support-activities/{supportActivityId}/deliver"
        actor: JobCoach
        preconditions:
          - "support_activity.status == PLANNED"
          - "participant.status IN {TRANSITIONAL_EMPLOYED, READY_FOR_GRADUATION, PLACED}"
          - "a SubsidyPeriod exists for participant.business_line_id with status == OPEN covering the logical clock now (calculations.open_period_selector)"
        side_effects:
          - "status = DELIVERED; delivered_at = logical clock now; delivered_by_user_id = X-User-ID"
          - "one CostEntry auto-posted into the selected SubsidyPeriod with classification = MISSION, category = COACHING when SupportActivity.category IN {JOB_COACHING, CASE_MANAGEMENT} else SUPPORT_SERVICE, amount_cents = cost_cents, source_activity_id = this activity, status = POSTED; increments SubsidyPeriod.version by 1"
          - "cascade: SubsidyPeriod.mission_cost_cents, business_operating_cost_cents, total_cost_cents and the true-cost ratios recomputed via calculations.subsidy_cost_allocation + calculations.true_cost_analysis"
          - "Participant.support_activity_minutes and Participant.delivered_coaching_count recomputed"
      - from: DELIVERED
        to: VOIDED
        trigger: "POST /support-activities/{supportActivityId}/void"
        actor: ProgramDirector
        preconditions:
          - "support_activity.status == DELIVERED"
          - "the CostEntry with source_activity_id == this activity belongs to a SubsidyPeriod with status == OPEN"
        side_effects:
          - "status = VOIDED; voided_reason stored"
          - "compensation: the CostEntry with source_activity_id == this activity moves POSTED -> VOIDED, voided_at = logical clock now, and drops out of every SubsidyPeriod aggregate"
          - "SubsidyPeriod.mission_cost_cents, business_operating_cost_cents, total_cost_cents and the true-cost ratios recomputed; increments SubsidyPeriod.version by 1"
          - "Participant.support_activity_minutes and Participant.delivered_coaching_count recomputed"
      - from: PLANNED
        to: VOIDED
        trigger: "POST /support-activities/{supportActivityId}/void"
        actor: ProgramDirector
        preconditions:
          - "support_activity.status == PLANNED"
        side_effects:
          - "status = VOIDED; voided_reason stored"
          - "no CostEntry exists, so no ledger movement occurs"

  - entity: Employer
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    shape: linear_with_thresholds
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system: cascade hop 3 of POST /placements/{placementId}/separate, when failed_retention_count reaches EMPLOYER_PROBATION_THRESHOLD (3)"
        actor: system
        preconditions:
          - "employer.partnership_status == ACTIVE"
          - "failed_retention_count >= 3 AND failed_retention_count < 5 after hop 2 recomputed it"
        side_effects:
          - "partnership_status = PROBATION"
          - "cascade hop 4: every Placement of this employer with employment_status == ACTIVE gets at_risk_flag = true (processing order hire_date ASC, then created_at ASC)"
      - from: PROBATION
        to: TERMINATED
        trigger: "system: cascade hop 3 of POST /placements/{placementId}/separate, when failed_retention_count reaches EMPLOYER_TERMINATION_THRESHOLD (5)"
        actor: system
        preconditions:
          - "employer.partnership_status == PROBATION"
          - "failed_retention_count >= 5 after hop 2 recomputed it"
        side_effects:
          - "partnership_status = TERMINATED (terminal); no new Placement may reference this employer"
          - "cascade hop 4: every Placement of this employer with employment_status == ACTIVE gets at_risk_flag = true"

  - entity: Placement
    initial_state: "ACTIVE x UNVERIFIED"
    terminal_states: ["SEPARATED_VOLUNTARY x *", "SEPARATED_INVOLUNTARY x *"]
    shape: parallel
    note: |
      Two independent state dimensions on the same row. employment_status tracks the job;
      wage_verification_status tracks the wage evidence. A placement may be SEPARATED_INVOLUNTARY x VERIFIED
      or ACTIVE x DISPUTED - neither dimension gates the other.
    transitions:
      - from: "employment_status = ACTIVE"
        to: "employment_status = SEPARATED_INVOLUNTARY"
        trigger: "POST /placements/{placementId}/separate with separation_type == INVOLUNTARY"
        actor: EmployerPartner
        preconditions:
          - "placement.employment_status == ACTIVE"
          - "X-User-ID == placement.employer_id (ownership)"
          - "separation_date >= placement.hire_date AND separation_date <= logical clock now"
        side_effects:
          - "cascade hop 1: employment_status = SEPARATED_INVOLUNTARY; separation_date stored; separation_days_after_hire = whole days between hire_date and separation_date; retention_outcome = FAILED_EARLY when separation_days_after_hire < 90, FAILED_LATE when 90 <= separation_days_after_hire < 180, RETAINED_180 when >= 180"
          - "every RetentionCheckpoint of this placement with status == SCHEDULED and due_date > separation_date moves SCHEDULED -> VOIDED (processing order interval_days ASC)"
          - "cascade hop 2: because retention_outcome moved to FAILED_EARLY or FAILED_LATE, Employer.failed_retention_count is recomputed and Employer.retention_reliability_pct is recomputed via calculations.employer_retention_reliability"
          - "cascade hop 3: because failed_retention_count crossed a threshold, Employer.partnership_status moves ACTIVE -> PROBATION (>=3) or PROBATION -> TERMINATED (>=5)"
          - "cascade hop 4: because the employer entered PROBATION/TERMINATED, all of that employer's other Placement rows with employment_status == ACTIVE get at_risk_flag = true"
          - "when retention_outcome == FAILED_EARLY the participant moves PLACED -> RE_ENTRY_ELIGIBLE (unconditional on re_entry_count; the RE_ENTRY_LIMIT is enforced later by validations priority 25)"
      - from: "employment_status = ACTIVE"
        to: "employment_status = SEPARATED_VOLUNTARY"
        trigger: "POST /placements/{placementId}/separate with separation_type == VOLUNTARY"
        actor: EmployerPartner
        preconditions:
          - "placement.employment_status == ACTIVE"
          - "X-User-ID == placement.employer_id (ownership)"
          - "separation_date >= placement.hire_date AND separation_date <= logical clock now"
        side_effects:
          - "identical cascade to the INVOLUNTARY branch; the only difference is the employment_status value written in hop 1"
      - from: "wage_verification_status = UNVERIFIED"
        to: "wage_verification_status = VERIFIED"
        trigger: "POST /placements/{placementId}/wage-verification with action == VERIFY"
        actor: EmployerPartner
        preconditions:
          - "placement.wage_verification_status IN {UNVERIFIED, DISPUTED}"
          - "X-User-ID == placement.employer_id (ownership)"
          - "verified_wage_cents_per_hour is present and >= 1500"
        side_effects:
          - "wage_verification_status = VERIFIED; verified_wage_cents_per_hour stored"
          - "wage_progression_pct recomputed via calculations.wage_progression_pct"
          - "employment_status is NOT touched"
      - from: "wage_verification_status = UNVERIFIED"
        to: "wage_verification_status = DISPUTED"
        trigger: "POST /placements/{placementId}/wage-verification with action == DISPUTE"
        actor: CaseManager
        preconditions:
          - "placement.wage_verification_status IN {UNVERIFIED, VERIFIED}"
        side_effects:
          - "wage_verification_status = DISPUTED; verified_wage_cents_per_hour = null; wage_progression_pct = null"
          - "employment_status is NOT touched"
      - from: "wage_verification_status = UNVERIFIED"
        to: "wage_verification_status = VERIFIED"
        trigger: "system: cascade hop 2' of POST /retention-checkpoints/{retentionCheckpointId}/confirm"
        actor: system
        preconditions:
          - "checkpoint.status moved SCHEDULED -> CONFIRMED with still_employed == true"
          - "placement.wage_verification_status != DISPUTED"
        side_effects:
          - "wage_verification_status = VERIFIED; verified_wage_cents_per_hour = checkpoint.verified_wage_cents_per_hour"
          - "wage_progression_pct recomputed via calculations.wage_progression_pct"

  - entity: RetentionCheckpoint
    initial_state: SCHEDULED
    terminal_states: [CONFIRMED, MISSED, VOIDED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /retention-checkpoints/{retentionCheckpointId}/confirm"
        actor: EmployerPartner
        preconditions:
          - "checkpoint.status == SCHEDULED"
          - "X-User-ID == placement.employer_id (ownership)"
          - "placement.employment_status == ACTIVE"
          - "logical clock now >= checkpoint.due_date"
          - "every RetentionCheckpoint of the same placement with a smaller interval_days has status IN {CONFIRMED, VOIDED}"
        side_effects:
          - "cascade hop 1: status = CONFIRMED; confirmed_at = logical clock now; still_employed and verified_wage_cents_per_hour stored"
          - "cascade hop 2': Placement.wage_verification_status moves UNVERIFIED -> VERIFIED (unless DISPUTED) and wage_progression_pct is recomputed"
          - "cascade hop 2: when interval_days == 180, Placement.retention_outcome = RETAINED_180 and Employer.confirmed_retention_count + retention_reliability_pct are recomputed"
          - "cascade hop 3: because Placement.retention_outcome became RETAINED_180, the Participant moves PLACED -> ALUMNI_RETAINED"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /retention-sweeps (ops run), when logical clock now > due_date + CHECKPOINT_GRACE_DAYS (14)"
        actor: system
        preconditions:
          - "checkpoint.status == SCHEDULED"
          - "logical clock now > due_date + 14 days"
        side_effects:
          - "status = MISSED"
          - "Placement.at_risk_flag = true"
      - from: SCHEDULED
        to: VOIDED
        trigger: "system: cascade of POST /placements/{placementId}/separate"
        actor: system
        preconditions:
          - "checkpoint.status == SCHEDULED"
          - "checkpoint.due_date > placement.separation_date"
        side_effects:
          - "status = VOIDED"

  - entity: SubsidyPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /subsidy-periods/{subsidyPeriodId}/close"
        actor: ProgramDirector
        preconditions:
          - "subsidy_period.status == OPEN"
          - "logical clock now > period_end"
          - "revenue_cents is present and >= 0"
          - "no ShiftAssignment with status == ASSIGNED exists on a WorkShift of this business line whose starts_at is IN [period_start, period_end]"
        side_effects:
          - "cascade hop 1: status = CLOSED; closed_at = logical clock now; revenue_cents stored; allocation_basis = request allocation_basis; mission_share and every CostEntry.allocated_mission_cents / allocated_business_cents recomputed under the FINAL variant of calculations.subsidy_cost_allocation; mission_cost_cents, business_operating_cost_cents, total_cost_cents and the two true-cost ratios recomputed; margin_pct, subsidy_rate and subsidy_draw_cents computed via calculations.subsidy_draw"
          - "cascade hop 2: because subsidy_draw_cents became non-null, BusinessLine.cumulative_subsidy_cents is recomputed as the sum of subsidy_draw_cents over CLOSED periods of the line"
          - "cascade hop 3: because cumulative_subsidy_cents now exceeds subsidy_cap_cents, BusinessLine moves LAUNCHED -> SUSPENDED and intake_posture is recomputed to CLOSED"
          - "cascade hop 4: because the line is SUSPENDED, every future SCHEDULED WorkShift of the line moves to CANCELLED"
          - "cascade hop 5: because those shifts were CANCELLED, their ASSIGNED ShiftAssignment rows move to RELEASED with released_reason = SHIFT_CANCELLED and each affected Participant.scheduled_hours_current_week is recomputed"
          - "increments SubsidyPeriod.version by 1"

# =============================================================================
# Table 2.1: Concurrency Rules (§1.2.1)
# =============================================================================

concurrency_rules:
  - rule_id: enroll-stale-business-line
    parent_entity: BusinessLine
    write_endpoint: "POST /participants"
    occ_field: "expected_business_line_version"
    description: |
      Enrolling a Participant against a BusinessLine whose version has advanced since the client last
      observed it is rejected. Intake against a line with free slots legitimately succeeds for any number
      of distinct referrals, so the losing writer's request is not covered by any state precondition - it
      is stale only in the sense that the line's slot ledger moved after the client read it.
    error_id: ERR_STALE_BUSINESS_LINE_VERSION
    http_status: 412

  - rule_id: cost-entry-stale-subsidy-period
    parent_entity: SubsidyPeriod
    write_endpoint: "POST /cost-entries"
    occ_field: "expected_subsidy_period_version"
    description: |
      Posting a CostEntry against a SubsidyPeriod whose version has advanced since the client last
      observed it is rejected. A period accepts unlimited POSTED entries while OPEN, so the losing
      request would otherwise succeed; the OCC check exists because every accepted entry re-derives
      mission_share and therefore silently re-allocates every other SHARED entry the client had read.
    error_id: ERR_STALE_SUBSIDY_PERIOD_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================

calculations:
  - name: composite_viability_score
    trigger: "on POST /business-lines (create) and re-evaluated as the gate of the DRAFT -> APPROVED transition"
    algorithm: weighted_scoring
    formula: |
      composite_viability_score = round_half_up(
          0.40 * market_viability_score
        + 0.35 * training_relevance_score
        + 0.25 * mission_alignment_score, 2)

      approval gate (DRAFT -> APPROVED only):
        composite_viability_score >= VIABILITY_COMPOSITE_FLOOR
        AND min(market_viability_score, training_relevance_score, mission_alignment_score) >= VIABILITY_DIMENSION_FLOOR
      A line may therefore clear the composite floor and still be rejected on a single weak dimension.
    input_set: "the three integer scores stored on the BusinessLine row; no other entity participates"
    constants:
      MARKET_WEIGHT: 0.40
      TRAINING_WEIGHT: 0.35
      MISSION_WEIGHT: 0.25
      VIABILITY_COMPOSITE_FLOOR: 70.00
      VIABILITY_DIMENSION_FLOOR: 50
    precision: "2 decimal places, round_half_up"

  - name: intake_posture_recompute
    trigger: "after every mutation of BusinessLine.status, BusinessLine.training_slots_filled or BusinessLine.quality_incident_count (launch, review, suspend, participant enroll/graduate/re-enter/exit, shift-assignment complete)"
    algorithm: constraint_propagation
    formula: |
      training_slots_filled = count(Participant
                                    WHERE business_line_id == line.id
                                      AND status IN {TRANSITIONAL_EMPLOYED, READY_FOR_GRADUATION})
      quality_incident_count = sum(ShiftAssignment.quality_defect_count + ShiftAssignment.customer_complaint_count
                                   WHERE status == COMPLETED
                                     AND WorkShift.business_line_id == line.id)
      intake_posture = OPEN when (status == LAUNCHED
                                  AND training_slots_filled < training_slots_total
                                  AND quality_incident_count < QUALITY_INCIDENT_LIMIT)
                       else CLOSED
    input_set: "Participant rows in the two occupying statuses only; COMPLETED ShiftAssignment rows only (ASSIGNED and RELEASED rows contribute nothing)"
    constants:
      QUALITY_INCIDENT_LIMIT: 10
    precision: "integer counts; boundary is strict `<` on both comparisons, so filled == total closes intake and 10 incidents close intake"

  - name: referral_eligibility_score
    trigger: "on POST /referrals/{referralId}/screen, before the decision branch is applied"
    algorithm: weighted_scoring
    formula: |
      step 1 - barrier points:
        barrier_points = min(BARRIER_CAP, count(distinct verified_barrier_codes)) * BARRIER_POINTS_EACH
      step 2 - fpl_ratio (4 decimals, round_half_up):
        fpl_base = FPL_ANNUAL_BASE_CENTS_BY_SIZE[household_size] when household_size <= 4
                   else 3111000 + (household_size - 4) * FPL_ADDITIONAL_PERSON_CENTS
        fpl_ratio = round_half_up(household_income_cents * 12 / fpl_base, 4)
      step 3 - income points (evaluated top to bottom, first match wins):
        fpl_ratio <= 1.0000            -> 35
        1.0000 < fpl_ratio <= 1.5000   -> 25
        1.5000 < fpl_ratio <= 2.0000   -> 15
        fpl_ratio > 2.0000             -> 0
      step 4 - availability points:
        availability_points = min(AVAILABILITY_CAP, floor(hours_available_per_week / 2))
      step 5 - partner multiplier from the referring partner's mou_tier:
        TIER_1 -> 1.10, TIER_2 -> 1.00, TIER_3 -> 0.90
      step 6 - score and band (single rounding, applied only at the end):
        eligibility_score = round_half_up((barrier_points + income_points + availability_points) * partner_multiplier, 2)
        priority_band = BAND_A when eligibility_score >= 70.00
                        BAND_B when 50.00 <= eligibility_score < 70.00
                        BAND_C otherwise
      The ELIGIBLE branch additionally requires eligibility_score >= ELIGIBILITY_SCORE_FLOOR, compared
      against the ROUNDED score, so 49.995 -> 50.00 passes and 49.994 -> 49.99 fails.
    input_set: "the verified values supplied in the screen request (they overwrite the submitted values first), plus the referring ReferralPartner.mou_tier; declared_barrier_codes never enter the score"
    constants:
      BARRIER_CAP: 3
      BARRIER_POINTS_EACH: 12
      AVAILABILITY_CAP: 20
      ELIGIBILITY_SCORE_FLOOR: 50.00
      MIN_WEEKLY_AVAILABILITY_HOURS: 20
      FPL_ANNUAL_BASE_CENTS_BY_SIZE: { 1: 1509000, 2: 2043000, 3: 2577000, 4: 3111000 }
      FPL_ADDITIONAL_PERSON_CENTS: 534000
      BAND_A_FLOOR: 70.00
      BAND_B_FLOOR: 50.00
    precision: "fpl_ratio 4 decimals round_half_up; eligibility_score 2 decimals round_half_up; the multiplier is applied to the integer point sum, never to each component"

  - name: partner_conversion_rate
    trigger: "after every Referral create and after the ELIGIBLE -> ENROLLED transition"
    algorithm: aggregation
    formula: |
      referrals_submitted_count = count(Referral WHERE referral_partner_id == partner.id)   # every status counts
      enrolled_referral_count   = count(Referral WHERE referral_partner_id == partner.id AND status == ENROLLED)
      conversion_rate = null when referrals_submitted_count == 0
                        else round_half_up(enrolled_referral_count / referrals_submitted_count, 4)
    input_set: "all Referral rows of the partner regardless of status for the denominator; status == ENROLLED only for the numerator"
    constants: {}
    precision: "4 decimals, round_half_up; empty denominator yields null, never 0"

  - name: shift_labor_cost
    trigger: "step 1 on POST /shift-assignments/{shiftAssignmentId}/complete; step 2 on the WorkShift SCHEDULED -> CLOSED auto-transition"
    algorithm: aggregation
    formula: |
      step 1 (per assignment, at completion):
        ShiftAssignment.wage_cost_cents = round_half_up(actual_hours * Participant.wage_cents_per_hour)
      step 2 (per shift, at close) - ROUNDING ORDER IS PINNED:
        WorkShift.billable_labor_cost_cents = sum(ShiftAssignment.wage_cost_cents
                                                  WHERE work_shift_id == shift.id AND status == COMPLETED)
      i.e. round per assignment to whole cents FIRST, then sum. Summing the raw products and rounding once
      at the end is WRONG and produces a different number (e.g. 3.335h @ 1650 and 2.125h @ 1725 give
      5503 + 3666 = 9169 under the pinned order, versus 9168 under sum-then-round).
      RELEASED assignments contribute nothing; their wage_cost_cents stays null.
    input_set: "COMPLETED ShiftAssignment rows of the shift only; each uses the participant's wage_cents_per_hour as of completion time"
    constants:
      ACTUAL_HOURS_GRACE: 0.5
    precision: "per-assignment round_half_up to whole cents, then integer summation"

  - name: participant_progress_metrics
    trigger: "after every ShiftAssignment create/complete/release and every SupportActivity deliver/void"
    algorithm: aggregation
    formula: |
      transitional_hours_worked = round_half_up(sum(ShiftAssignment.actual_hours
                                    WHERE participant_id == p.id AND status == COMPLETED), 3)
      scheduled_hours_current_week = round_half_up(sum(WorkShift.duration_hours
                                    WHERE a ShiftAssignment with status == ASSIGNED links p.id to that shift
                                      AND WorkShift.starts_at IN [iso_week_start, iso_week_start + 7 days)), 3)
        where iso_week_start = Monday 00:00:00Z of the ISO week containing the logical clock now
      support_activity_minutes = sum(SupportActivity.duration_minutes
                                    WHERE participant_id == p.id AND status == DELIVERED)
      delivered_coaching_count = count(SupportActivity
                                    WHERE participant_id == p.id AND status == DELIVERED AND category == JOB_COACHING)
    input_set: "status filters are exclusive: COMPLETED for hours worked, ASSIGNED for scheduled hours, DELIVERED for support metrics; VOIDED and RELEASED rows never contribute"
    constants:
      MIN_TRANSITIONAL_HOURS: 24.000
      MIN_SUPPORT_MINUTES: 180
      MIN_COACHING_SESSIONS: 2
      WEEKLY_HOURS_CAP: 28
      REST_BUFFER_MINUTES: 60
      # The graduation thresholds are deliberately scaled to two full 12-hour shifts and two
      # 90-minute coaching sessions so that every readiness precondition is reachable by a
      # finite endpoint chain (§1.5 testability-completeness) without breaching WEEKLY_HOURS_CAP.
    precision: "hours 3 decimals round_half_up; minutes and counts integer"

  - name: open_period_selector
    trigger: "whenever a cost must be auto-posted (ShiftAssignment completion, SupportActivity delivery)"
    algorithm: threshold
    formula: |
      candidate_set = SubsidyPeriod rows WHERE business_line_id == <the line of the shift or of the
                      participant> AND status == OPEN AND period_start <= anchor_instant <= period_end
        anchor_instant = WorkShift.starts_at for a shift completion; the logical clock now for a delivery
      ranking       = period_start DESC
      tie_break     = created_at ASC
      selection     = first row after ranking and tie-break
      empty_fallback = reject the whole request with ERR_NO_OPEN_SUBSIDY_PERIOD (409); no partial state is written
    input_set: "SubsidyPeriod rows of exactly one BusinessLine with status == OPEN; CLOSED periods are never selected even when their interval covers the anchor"
    constants: {}
    precision: "interval comparison is closed on both ends"

  - name: subsidy_cost_allocation
    trigger: "on every CostEntry post (manual or auto), on every CostEntry void, and on the SubsidyPeriod OPEN -> CLOSED transition"
    algorithm: waterfall_allocation
    formula: |
      posted = CostEntry rows of the period WHERE status == POSTED
      trainee_hours = round_half_up(sum(ShiftAssignment.actual_hours WHERE status == COMPLETED
                        AND WorkShift.business_line_id == period.business_line_id
                        AND WorkShift.starts_at IN [period_start, period_end]), 3)
      gross_cost_cents = sum(amount_cents over posted)

      mission_share depends on the variant (see variants below):
        HOURS   : mission_share = round_half_up(trainee_hours / (trainee_hours + supervisor_hours), 4)
                  when trainee_hours + supervisor_hours == 0 -> mission_share = 0.0000
        REVENUE : mission_share = round_half_up(max(0, 1 - revenue_cents / gross_cost_cents), 4)
                  when gross_cost_cents == 0 -> mission_share = 0.0000

      per entry in posted (rounding is per entry, then summed - never the other way round):
        classification == MISSION -> allocated_mission_cents = amount_cents
                                     allocated_business_cents = 0
        classification == BUSINESS -> allocated_mission_cents = 0
                                      allocated_business_cents = amount_cents
        classification == SHARED  -> allocated_mission_cents = round_half_up(amount_cents * mission_share)
                                     allocated_business_cents = amount_cents - allocated_mission_cents

      mission_cost_cents = sum(allocated_mission_cents over posted)
      business_operating_cost_cents = sum(allocated_business_cents over posted)
      total_cost_cents = mission_cost_cents + business_operating_cost_cents   # always == gross_cost_cents
      VOIDED entries keep their last allocated_* values on the row but are excluded from all three sums.
    input_set: "only status == POSTED CostEntry rows of this period; trainee_hours only counts COMPLETED assignments whose shift STARTS inside the closed period interval"
    constants: {}
    precision: "mission_share 4 decimals round_half_up; per-entry cents round_half_up; the business side is the exact complement so the two sides reconcile to the cent"
    variants:
      - name: PROVISIONAL_HOURS
        when: "period.status == OPEN (recomputed after every post/void) and on GET /subsidy-periods/{id}/true-cost-analysis?allocation_basis=HOURS"
        difference: "mission_share comes from the trainee-hour share of total labour hours, so it ignores revenue entirely and is stable against trading performance."
      - name: FINAL_REVENUE
        when: "the OPEN -> CLOSED transition when allocation_basis == REVENUE, and on GET /subsidy-periods/{id}/true-cost-analysis?allocation_basis=REVENUE for a CLOSED period"
        difference: "mission_share becomes the unfunded fraction of gross cost (1 - revenue/gross_cost), so identical cost rows split differently: with trainee_hours 12.000, supervisor_hours 40.0, revenue 250000 and a ledger of one SHARED trainee-wage entry 19800, one SHARED supervision entry 300000, one BUSINESS materials entry 40000 and one MISSION coaching entry 12000 (gross_cost 371800), the same ledger yields mission_share 0.2308 / mission_cost_cents 85810 under PROVISIONAL_HOURS and mission_share 0.3276 / mission_cost_cents 116766 under FINAL_REVENUE."

  - name: true_cost_analysis
    trigger: "after subsidy_cost_allocation runs, and on GET /subsidy-periods/{subsidyPeriodId}/true-cost-analysis"
    algorithm: aggregation
    formula: |
      true_cost_per_trainee_hour_cents = null when trainee_hours == 0
                                         else round_half_up(total_cost_cents / trainee_hours, 2)
      subsidy_per_trainee_hour_cents   = null when trainee_hours == 0
                                         else round_half_up(mission_cost_cents / trainee_hours, 2)
    input_set: "the period aggregates produced by subsidy_cost_allocation under the active variant"
    constants: {}
    precision: "2 decimals round_half_up; a period with zero COMPLETED trainee hours reports null for both ratios (never 0, never an error)"

  - name: subsidy_draw
    trigger: "on the SubsidyPeriod OPEN -> CLOSED transition, immediately after the FINAL allocation is written"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER IS PINNED - the tier is chosen from the PRE-SUBSIDY margin, and the drawn subsidy
      never feeds back into the margin, even though the subsidy is what makes the line viable:
        1. run subsidy_cost_allocation with the requested allocation_basis -> business_operating_cost_cents, mission_cost_cents
        2. margin_pct = -1.0000 when revenue_cents == 0
                        else round_half_up((revenue_cents - business_operating_cost_cents) / revenue_cents, 4)
        3. subsidy_rate = 0.50 when margin_pct >= 0.2000
                          0.70 when 0.0500 <= margin_pct < 0.2000
                          0.90 when margin_pct < 0.0500
           (the comparison uses the ROUNDED margin_pct, so a raw 0.19999958 rounds to 0.2000 and buys the 0.50 tier)
        4. subsidy_draw_cents = round_half_up(mission_cost_cents * subsidy_rate)
        5. BusinessLine.cumulative_subsidy_cents = sum(subsidy_draw_cents over CLOSED periods of the line)
      A reader who instead computed margin from (revenue - business_cost + subsidy_draw) would select a
      different tier; that ordering is explicitly forbidden.
    input_set: "the closing period only; business_operating_cost_cents is the post-allocation business side, NOT the raw sum of BUSINESS-classified entries"
    constants:
      SUBSIDY_TIER_HIGH_MARGIN: 0.2000
      SUBSIDY_TIER_LOW_MARGIN: 0.0500
      SUBSIDY_RATE_HIGH_MARGIN: 0.50
      SUBSIDY_RATE_MID_MARGIN: 0.70
      SUBSIDY_RATE_LOW_MARGIN: 0.90
    precision: "margin_pct 4 decimals round_half_up; subsidy_draw_cents whole cents round_half_up"

  - name: retention_checkpoint_schedule
    trigger: "on POST /placements (creation), as a side effect of the GRADUATED -> PLACED transition"
    algorithm: interval_merge
    formula: |
      for each interval in RETENTION_INTERVAL_DAYS (ascending):
        create RetentionCheckpoint { placement_id, interval_days = interval, status = SCHEDULED,
                                     due_date = placement.hire_date + interval days at 00:00:00Z }
      creation order is interval_days ASC, so created_at ordering matches interval ordering.
      Confirmation is allowed from due_date onward (logical clock now >= due_date, inclusive) and the
      checkpoint is swept to MISSED only once now > due_date + CHECKPOINT_GRACE_DAYS.
    input_set: "exactly four rows per placement; no checkpoint is ever created outside this side effect"
    constants:
      RETENTION_INTERVAL_DAYS: [30, 90, 180, 365]
      CHECKPOINT_GRACE_DAYS: 14
    precision: "whole days on a 00:00:00Z grid"

  - name: wage_progression_pct
    trigger: "on the Placement wage_verification_status -> VERIFIED transition (employer action or checkpoint cascade)"
    algorithm: aggregation
    formula: |
      base = Participant.graduation_wage_cents_per_hour
      wage_progression_pct = null when base is null or wage_verification_status != VERIFIED
                             else round_half_up((verified_wage_cents_per_hour - base) / base, 4)
      A DISPUTE resets the field to null; a later VERIFY recomputes it from the new verified wage.
    input_set: "the frozen graduation wage of the placed participant, never the participant's current wage_cents_per_hour"
    constants:
      WAGE_PROGRESSION_FLOOR: 1.10
    precision: "4 decimals round_half_up; the value may be negative if a verified wage falls below the graduation wage"

  - name: employer_retention_reliability
    trigger: "after every Placement retention_outcome change (separation cascade hop 2, 180-day confirmation)"
    algorithm: aggregation
    formula: |
      failed_retention_count    = count(Placement WHERE employer_id == e.id AND retention_outcome IN {FAILED_EARLY, FAILED_LATE})
      confirmed_retention_count = count(Placement WHERE employer_id == e.id AND retention_outcome == RETAINED_180)
      denominator = failed_retention_count + confirmed_retention_count
      retention_reliability_pct = null when denominator == 0
                                  else round_half_up(confirmed_retention_count / denominator, 4)
      placement_count = count(Placement WHERE employer_id == e.id)   # every outcome, including PENDING
    input_set: "PENDING placements are excluded from the reliability denominator but counted in placement_count"
    constants:
      EMPLOYER_PROBATION_THRESHOLD: 3
      EMPLOYER_TERMINATION_THRESHOLD: 5
    precision: "4 decimals round_half_up; null on an empty denominator"

  - name: outcome_measurement
    trigger: "on GET /business-lines/{businessLineId}/outcome-summary"
    algorithm: forward_looking
    formula: |
      window = [period_start, period_end] (both 00:00:00Z, closed interval; defaults to
               [business_line.launched_at, logical clock now] when omitted)
      enrolled = Participant rows WHERE business_line_id == line.id AND enrolled_at IN window
      enrolled_count = count(enrolled)
      placed_count   = count(enrolled WHERE status IN {PLACED, ALUMNI_RETAINED})
      placement_rate = null when enrolled_count == 0 else round_half_up(placed_count / enrolled_count, 4)

      window_placements = Placement rows WHERE participant_id IN enrolled AND hire_date IN window

      retention_denominator / retention_numerator depend on the variant (see below)
      retention_rate = null when retention_denominator == 0
                       else round_half_up(retention_numerator / retention_denominator, 4)

      verified = window_placements WHERE wage_verification_status == VERIFIED
      verified_placement_count = count(verified)
      average_wage_progression_pct = null when verified_placement_count == 0
                                     else round_half_up(sum(wage_progression_pct over verified) / verified_placement_count, 4)
    input_set: "participants are selected by enrolled_at (so a re-entered participant is selected by the most recent enrollment); placements are selected by hire_date; separated placements stay in window_placements"
    constants: {}
    precision: "4 decimals round_half_up on all three rates; every rate is null (not 0) on an empty denominator"
    variants:
      - name: COHORT_BASED
        when: "retention_measure == COHORT_BASED (the default)"
        difference: "denominator = window_placements whose hire_date + 180 days <= period_end (only placements that had a full 180-day chance inside the window); numerator = those with retention_outcome == RETAINED_180. A placement still ACTIVE but never confirmed at 180 days scores 0."
      - name: POINT_IN_TIME
        when: "retention_measure == POINT_IN_TIME"
        difference: "denominator = all window_placements regardless of elapsed time; numerator = those with employment_status == ACTIVE as of the logical clock now. The same single ACTIVE-but-unconfirmed placement scores retention_rate 0.0000 under COHORT_BASED and 1.0000 under POINT_IN_TIME."

# =============================================================================
# Table 4: Validation Rules Table (§1.4) - evaluated strictly in priority order.
# The first failing rule decides the response; no later rule is evaluated.
# =============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id referenced by the request exists - path ids left-to-right first, then body foreign keys in the order they are declared in the endpoint's input list"
    error_id: "ERR_BUSINESS_LINE_NOT_FOUND | ERR_REFERRAL_PARTNER_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_WORK_SHIFT_NOT_FOUND | ERR_SHIFT_ASSIGNMENT_NOT_FOUND | ERR_SUPPORT_ACTIVITY_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND | ERR_RETENTION_CHECKPOINT_NOT_FOUND | ERR_SUBSIDY_PERIOD_NOT_FOUND | ERR_COST_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id or a foreign key in the body"

  - priority: 4
    category: auth
    check: "for entity_backed roles, X-User-ID equals the owning entity id of the target resource: ReferralPartner acting on a Referral must equal Referral.referral_partner_id; EmployerPartner acting on a Placement or RetentionCheckpoint must equal the placement's employer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /referrals, GET /referrals/{referralId}, POST /placements/{placementId}/separate, POST /placements/{placementId}/wage-verification, POST /retention-checkpoints/{retentionCheckpointId}/confirm"

  - priority: 5
    category: business_constraint
    check: "request body conforms to the endpoint input schema: required fields present, enum members valid, integers within declared ranges, datetimes ISO 8601 UTC, ends_at > starts_at, period_end > period_start, duration_minutes == 0 for voucher categories and > 0 for coaching categories, actual_hours > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint (review, launch, screen, certify-readiness, graduate, re-enter, deliver, void, wage-verification, separate, confirm, close)"

  - priority: 7
    category: state
    check: "the WorkShift referenced by a shift-assignment create/complete/release has status == SCHEDULED"
    error_id: ERR_SHIFT_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /shift-assignments, POST /shift-assignments/{shiftAssignmentId}/complete, POST /shift-assignments/{shiftAssignmentId}/release"

  - priority: 8
    category: state
    check: "the SubsidyPeriod that a cost movement would touch has status == OPEN (direct post, auto-post from completion/delivery, or the compensating void)"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /cost-entries, POST /support-activities/{supportActivityId}/void"

  - priority: 9
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version (§1.2.1)"
    error_id: "ERR_STALE_BUSINESS_LINE_VERSION | ERR_STALE_SUBSIDY_PERIOD_VERSION"
    http_status: 412
    applies_to: "POST /participants, POST /cost-entries"

  - priority: 10
    category: business_safety
    check: "the CaseManager graduating a participant is not the user who certified readiness (X-User-ID != Participant.readiness_certified_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /participants/{participantId}/graduate"

  - priority: 11
    category: business_safety
    check: "graduation-readiness criteria are all met: transitional_hours_worked >= 24.000, support_activity_minutes >= 180, delivered_coaching_count >= 2"
    error_id: ERR_GRADUATION_CRITERIA_NOT_MET
    http_status: 422
    applies_to: "POST /participants/{participantId}/certify-readiness"

  - priority: 12
    category: business_safety
    check: "an APPROVED decision requires composite_viability_score >= 70.00 AND min of the three dimension scores >= 50"
    error_id: ERR_VIABILITY_GATE_NOT_MET
    http_status: 422
    applies_to: "POST /business-lines/{businessLineId}/review"

  - priority: 13
    category: business_safety
    check: "an ELIGIBLE screen decision requires >= 1 verified barrier, hours_available_per_week >= 20 and eligibility_score >= 50.00"
    error_id: ERR_ELIGIBILITY_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /referrals/{referralId}/screen"

  - priority: 14
    category: business_temporal
    check: "logical clock now >= checkpoint.due_date"
    error_id: ERR_CHECKPOINT_NOT_DUE
    http_status: 409
    applies_to: "POST /retention-checkpoints/{retentionCheckpointId}/confirm"

  - priority: 15
    category: business_temporal
    check: "logical clock now > subsidy_period.period_end"
    error_id: ERR_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST /subsidy-periods/{subsidyPeriodId}/close"

  - priority: 16
    category: business_temporal
    check: "hire_date >= participant.graduated_at (a placement may not predate graduation)"
    error_id: ERR_HIRE_DATE_BEFORE_GRADUATION
    http_status: 422
    applies_to: "POST /placements"

  - priority: 17
    category: business_temporal
    check: "logical clock now >= work_shift.starts_at when completing an assignment"
    error_id: ERR_SHIFT_NOT_STARTED
    http_status: 409
    applies_to: "POST /shift-assignments/{shiftAssignmentId}/complete"

  - priority: 18
    category: business_referential
    check: "the referring ReferralPartner.mou_status == ACTIVE"
    error_id: ERR_PARTNER_MOU_LAPSED
    http_status: 409
    applies_to: "POST /referrals, POST /referrals/{referralId}/screen"

  - priority: 19
    category: business_referential
    check: "business_line.status == LAUNCHED AND business_line.intake_posture == OPEN"
    error_id: ERR_INTAKE_CLOSED
    http_status: 409
    applies_to: "POST /participants, POST /participants/{participantId}/re-enter"

  - priority: 20
    category: business_referential
    check: "employer.partnership_status == ACTIVE"
    error_id: ERR_EMPLOYER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /placements"

  - priority: 21
    category: business_referential
    check: "calculations.open_period_selector returns a period for the anchor instant"
    error_id: ERR_NO_OPEN_SUBSIDY_PERIOD
    http_status: 409
    applies_to: "POST /shift-assignments/{shiftAssignmentId}/complete, POST /support-activities/{supportActivityId}/deliver"

  - priority: 22
    category: business_referential
    check: "allocation_basis == REVENUE is only answerable when the period has revenue_cents (CLOSED periods, or an OPEN period is rejected)"
    error_id: ERR_REVENUE_NOT_AVAILABLE
    http_status: 409
    applies_to: "GET /subsidy-periods/{subsidyPeriodId}/true-cost-analysis"

  - priority: 23
    category: business_constraint
    check: "(referral_partner_id, candidate_reference) is unique across Referral rows"
    error_id: ERR_DUPLICATE_CANDIDATE_REFERENCE
    http_status: 409
    applies_to: "POST /referrals"

  - priority: 24
    category: business_constraint
    check: "no Participant row already references the referral_id"
    error_id: ERR_REFERRAL_ALREADY_ENROLLED
    http_status: 409
    applies_to: "POST /participants"

  - priority: 25
    category: business_constraint
    check: "participant.re_entry_count < RE_ENTRY_LIMIT (2)"
    error_id: ERR_RE_ENTRY_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /participants/{participantId}/re-enter"

  - priority: 26
    category: business_constraint
    check: "no ShiftAssignment with status IN {ASSIGNED, COMPLETED} already links this participant to this work shift"
    error_id: ERR_DUPLICATE_SHIFT_ASSIGNMENT
    http_status: 409
    applies_to: "POST /shift-assignments"

  - priority: 27
    category: business_constraint
    check: "PARTICIPANT interval semantics - buffered pairwise exclusion. Reject when the participant holds another ShiftAssignment with status IN {ASSIGNED, COMPLETED} whose shift interval, inflated by REST_BUFFER_MINUTES (60) on BOTH sides, intersects the new half-open interval: reject iff new.starts_at < other.ends_at + 60min AND other.starts_at < new.ends_at + 60min. A gap of exactly 60 minutes is accepted (>=), a gap of 59 minutes is rejected, and back-to-back shifts (gap 0) are rejected."
    error_id: ERR_PARTICIPANT_REST_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /shift-assignments"

  - priority: 28
    category: business_constraint
    check: "BUSINESS LINE interval semantics - aggregate concurrent capacity, no buffer, adjacency allowed. For every instant t in the new shift's half-open interval, the number of ASSIGNED seats across ALL SCHEDULED shifts of the same business line whose half-open intervals contain t must stay <= business_line.supervisor_capacity. Two shifts that merely touch (a.ends_at == b.starts_at) do NOT overlap and never contend."
    error_id: ERR_SUPERVISION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /shift-assignments"

  - priority: 29
    category: business_constraint
    check: "work_shift.assigned_count < work_shift.trainee_capacity"
    error_id: ERR_SHIFT_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /shift-assignments"

  - priority: 30
    category: business_constraint
    check: "every checkpoint of the same placement with a smaller interval_days has status IN {CONFIRMED, VOIDED}"
    error_id: ERR_CHECKPOINT_OUT_OF_SEQUENCE
    http_status: 409
    applies_to: "POST /retention-checkpoints/{retentionCheckpointId}/confirm"

  - priority: 31
    category: business_constraint
    check: "SUBSIDY PERIOD interval semantics - closed-interval non-overlap per business line: reject when new.period_start <= existing.period_end AND existing.period_start <= new.period_end for any period of the same line (any status). Abutting periods must therefore start at least one day after the previous period_end."
    error_id: ERR_SUBSIDY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /subsidy-periods"

  - priority: 32
    category: business_constraint
    check: "no ShiftAssignment with status == ASSIGNED remains on a WorkShift of this line whose starts_at is inside the period interval"
    error_id: ERR_OPEN_ASSIGNMENTS_BLOCK_CLOSE
    http_status: 409
    applies_to: "POST /subsidy-periods/{subsidyPeriodId}/close"

  - priority: 33
    category: business_constraint
    check: "manually posted categories are limited to {SUPERVISION, MATERIALS, OVERHEAD}; TRAINEE_WAGES, COACHING and SUPPORT_SERVICE are system-posted only"
    error_id: ERR_CATEGORY_NOT_MANUALLY_POSTABLE
    http_status: 422
    applies_to: "POST /cost-entries"

  - priority: 34
    category: business_constraint
    check: "actual_hours <= work_shift.duration_hours + 0.5"
    error_id: ERR_ACTUAL_HOURS_EXCEED_SHIFT
    http_status: 422
    applies_to: "POST /shift-assignments/{shiftAssignmentId}/complete"

  - priority: 35
    category: business_fiscal
    check: "1500 <= wage_cents_per_hour <= 2200 (PROGRAM_MIN/MAX_TRAINEE_WAGE_CENTS)"
    error_id: ERR_TRAINEE_WAGE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /participants, POST /participants/{participantId}/re-enter"

  - priority: 36
    category: business_fiscal
    check: "starting_wage_cents_per_hour >= employer.min_starting_wage_cents_per_hour"
    error_id: ERR_WAGE_BELOW_EMPLOYER_FLOOR
    http_status: 422
    applies_to: "POST /placements"

  - priority: 37
    category: business_fiscal
    check: "starting_wage_cents_per_hour >= round_half_up(participant.graduation_wage_cents_per_hour * 1.10) - the wage-progression floor"
    error_id: ERR_WAGE_PROGRESSION_FLOOR_NOT_MET
    http_status: 422
    applies_to: "POST /placements"

  - priority: 38
    category: business_fiscal
    check: "the participant's already-committed hours in the ISO week of the new shift, plus this shift's duration_hours, must be <= WEEKLY_HOURS_CAP (28). Committed hours = sum of WorkShift.duration_hours over the participant's ShiftAssignment rows with status IN {ASSIGNED, COMPLETED} whose shift starts_at falls in the same ISO week. Exactly 28.000 is accepted."
    error_id: ERR_WEEKLY_HOURS_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /shift-assignments"

  - priority: 39
    category: business_fiscal
    check: "count(Referral WHERE referral_partner_id == partner.id AND created_at > logical clock now - 30 days) < partner.referral_quota_per_period"
    error_id: ERR_PARTNER_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /referrals"

# =============================================================================
# Table 5: API Endpoint Table (§1.5) - flat top-level collections (api_prefix "")
# =============================================================================

endpoints:
  # --- BusinessLine ---------------------------------------------------------
  - method: POST
    path: "/business-lines"
    description: "Create a candidate business line with its viability, training-relevance and mission-alignment scores."
    roles: [ProgramDirector]
    code: 201
    input: [name, market_viability_score, training_relevance_score, mission_alignment_score, training_slots_total, supervisor_capacity, target_gross_margin_pct, subsidy_cap_cents]
    output: BusinessLine
    side_effects: ["status = DRAFT", "intake_posture = CLOSED", "composite_viability_score computed via calculations.composite_viability_score"]

  - method: GET
    path: "/business-lines/{businessLineId}"
    description: "Read one business line including its derived slot, posture, quality and subsidy fields."
    roles: [ProgramDirector, IntakeSpecialist, JobCoach, CaseManager, FunderAnalyst]
    code: 200
    input: []
    output: BusinessLine
    side_effects: []

  - method: POST
    path: "/business-lines/{businessLineId}/review"
    description: "Record the selection decision on a DRAFT line: APPROVED (viability gate enforced) or REJECTED (rejection_reason required)."
    roles: [ProgramDirector]
    code: 200
    input: [decision, "rejection_reason?"]
    output: BusinessLine
    side_effects: ["DRAFT -> APPROVED or DRAFT -> REJECTED per §1.2", "increments BusinessLine.version by 1"]

  - method: POST
    path: "/business-lines/{businessLineId}/launch"
    description: "Open an APPROVED line for trading and intake."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: BusinessLine
    side_effects: ["APPROVED -> LAUNCHED", "launched_at set from the logical clock", "intake_posture recomputed via calculations.intake_posture_recompute", "increments BusinessLine.version by 1"]

  - method: GET
    path: "/business-lines/{businessLineId}/outcome-summary"
    description: "Funder-facing outcome measurement over a window: placement rate, retention rate under the requested measure, and average wage progression. Defaults: retention_measure COHORT_BASED, window [launched_at, logical clock now]."
    roles: [ProgramDirector, CaseManager, FunderAnalyst]
    code: 200
    input: ["retention_measure?", "period_start?", "period_end?"]
    output: "{ business_line_id: string, period_start: string, period_end: string, retention_measure: string, enrolled_count: integer, placed_count: integer, placement_rate: number, retention_denominator: integer, retention_numerator: integer, retention_rate: number, verified_placement_count: integer, average_wage_progression_pct: number }"
    side_effects: ["none - pure read of calculations.outcome_measurement"]

  # --- ReferralPartner ------------------------------------------------------
  - method: POST
    path: "/referral-partners"
    description: "Register a referral partner with its MOU tier, MOU status and 30-day referral quota."
    roles: [ProgramDirector]
    code: 201
    input: [organization_name, mou_tier, referral_quota_per_period, "mou_status?"]
    output: ReferralPartner
    side_effects: ["conversion_rate initialised to null (no referrals yet)"]

  - method: GET
    path: "/referral-partners/{referralPartnerId}"
    description: "Read one referral partner including submitted/enrolled counts and conversion_rate."
    roles: [ProgramDirector, IntakeSpecialist, CaseManager, FunderAnalyst, ReferralPartner]
    code: 200
    input: []
    output: ReferralPartner
    side_effects: []

  # --- Referral -------------------------------------------------------------
  - method: POST
    path: "/referrals"
    description: "Submit a candidate referral. The acting ReferralPartner's X-User-ID must equal referral_partner_id."
    roles: [ReferralPartner]
    code: 201
    input: [referral_partner_id, candidate_reference, declared_barrier_codes, household_income_cents, household_size, hours_available_per_week]
    output: Referral
    side_effects: ["status = SUBMITTED", "ReferralPartner.referrals_submitted_count and conversion_rate recomputed via calculations.partner_conversion_rate"]

  - method: GET
    path: "/referrals/{referralId}"
    description: "Read one referral with its screening outputs (fpl_ratio, eligibility_score, priority_band)."
    roles: [ProgramDirector, IntakeSpecialist, CaseManager, FunderAnalyst, ReferralPartner]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/referrals"
    description: "List referrals, optionally filtered by submitting partner and status; paginated."
    roles: [ProgramDirector, IntakeSpecialist, CaseManager, FunderAnalyst]
    code: 200
    input: ["referral_partner_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/referrals/{referralId}/screen"
    description: "Record a screening decision (ELIGIBLE | WAITLISTED | INELIGIBLE) against verified barriers, income, household size and availability. Re-screening a WAITLISTED referral is allowed."
    roles: [IntakeSpecialist]
    code: 200
    input: [decision, verified_barrier_codes, verified_household_income_cents, verified_household_size, verified_hours_available_per_week]
    output: Referral
    side_effects: ["verified fields overwrite the submitted values", "fpl_ratio, eligibility_score and priority_band recomputed via calculations.referral_eligibility_score", "status moves per §1.2 state_machines.Referral", "screened_at and decided_by_user_id stamped"]

  # --- Participant ----------------------------------------------------------
  - method: POST
    path: "/participants"
    description: "Enroll an ELIGIBLE referral into transitional employment on a launched business line. expected_business_line_version is the OCC guard from §1.2.1."
    roles: [IntakeSpecialist]
    code: 201
    input: [referral_id, business_line_id, wage_cents_per_hour, expected_business_line_version, "max_transitional_weeks?"]
    output: Participant
    side_effects: ["status = TRANSITIONAL_EMPLOYED; enrolled_at from the logical clock", "Referral ELIGIBLE -> ENROLLED", "BusinessLine.training_slots_filled and intake_posture recomputed", "increments BusinessLine.version by 1", "ReferralPartner.enrolled_referral_count and conversion_rate recomputed"]

  - method: GET
    path: "/participants/{participantId}"
    description: "Read one participant with derived progress metrics (hours worked, weekly scheduled hours, support minutes, coaching count)."
    roles: [ProgramDirector, IntakeSpecialist, JobCoach, CaseManager, FunderAnalyst]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/participants"
    description: "List participants, optionally filtered by business line, source referral and status; paginated."
    roles: [ProgramDirector, IntakeSpecialist, JobCoach, CaseManager, FunderAnalyst]
    code: 200
    input: ["business_line_id?", "referral_id?", "status?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: POST
    path: "/participants/{participantId}/certify-readiness"
    description: "Job coach certifies that graduation criteria (hours, support minutes, coaching sessions) are met."
    roles: [JobCoach]
    code: 200
    input: []
    output: Participant
    side_effects: ["TRANSITIONAL_EMPLOYED -> READY_FOR_GRADUATION", "readiness_certified_by_user_id = X-User-ID; readiness_certified_at stamped"]

  - method: POST
    path: "/participants/{participantId}/graduate"
    description: "Case manager graduates a certified participant. Segregation of duties: the acting X-User-ID may not be the certifier."
    roles: [CaseManager]
    code: 200
    input: []
    output: Participant
    side_effects: ["READY_FOR_GRADUATION -> GRADUATED", "graduation_wage_cents_per_hour frozen from wage_cents_per_hour", "BusinessLine.training_slots_filled and intake_posture recomputed", "increments BusinessLine.version by 1"]

  - method: POST
    path: "/participants/{participantId}/re-enter"
    description: "Return a RE_ENTRY_ELIGIBLE participant to transitional employment (bounded by RE_ENTRY_LIMIT), closing the program cycle."
    roles: [IntakeSpecialist]
    code: 200
    input: [wage_cents_per_hour]
    output: Participant
    side_effects: ["RE_ENTRY_ELIGIBLE -> TRANSITIONAL_EMPLOYED", "re_entry_count += 1; enrolled_at restamped; readiness/graduation fields cleared", "BusinessLine.training_slots_filled and intake_posture recomputed", "increments BusinessLine.version by 1"]

  # --- WorkShift ------------------------------------------------------------
  - method: POST
    path: "/work-shifts"
    description: "Schedule a trading shift on a business line with its own seat capacity and customer-service standard."
    roles: [ProgramDirector]
    code: 201
    input: [business_line_id, starts_at, ends_at, trainee_capacity, supervisor_user_id, "customer_service_standard?"]
    output: WorkShift
    side_effects: ["status = SCHEDULED", "duration_hours computed from the half-open interval"]

  - method: GET
    path: "/work-shifts/{workShiftId}"
    description: "Read one work shift with assigned_count, quality counters and billable_labor_cost_cents."
    roles: [ProgramDirector, CaseManager, JobCoach, FunderAnalyst]
    code: 200
    input: []
    output: WorkShift
    side_effects: []

  - method: GET
    path: "/work-shifts"
    description: "List work shifts, optionally filtered by business line and status; paginated."
    roles: [ProgramDirector, CaseManager, JobCoach, FunderAnalyst]
    code: 200
    input: ["business_line_id?", "status?", "limit?", "offset?"]
    output: WorkShift[]
    side_effects: []

  # --- ShiftAssignment ------------------------------------------------------
  - method: POST
    path: "/shift-assignments"
    description: "Seat a participant on a scheduled shift. Enforces the participant rest-buffer rule, the line-wide supervision capacity rule, per-shift seats and the weekly hours cap."
    roles: [CaseManager]
    code: 201
    input: [work_shift_id, participant_id]
    output: ShiftAssignment
    side_effects: ["status = ASSIGNED", "WorkShift.assigned_count recomputed", "Participant.scheduled_hours_current_week recomputed"]

  - method: GET
    path: "/shift-assignments/{shiftAssignmentId}"
    description: "Read one shift assignment including wage_cost_cents and released_reason."
    roles: [ProgramDirector, CaseManager, JobCoach, FunderAnalyst]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: []

  - method: GET
    path: "/shift-assignments"
    description: "List shift assignments, optionally filtered by participant, shift and status; paginated."
    roles: [ProgramDirector, CaseManager, JobCoach, FunderAnalyst]
    code: 200
    input: ["participant_id?", "work_shift_id?", "status?", "limit?", "offset?"]
    output: ShiftAssignment[]
    side_effects: []

  - method: POST
    path: "/shift-assignments/{shiftAssignmentId}/complete"
    description: "Record worked hours plus quality and customer-service outcomes for a seated trainee; auto-posts the trainee wage cost into the open subsidy period."
    roles: [CaseManager]
    code: 200
    input: [actual_hours, "quality_defect_count?", "customer_complaint_count?"]
    output: ShiftAssignment
    side_effects: ["ASSIGNED -> COMPLETED", "wage_cost_cents computed via calculations.shift_labor_cost step 1", "CostEntry (TRAINEE_WAGES / SHARED) auto-posted into the selected SubsidyPeriod; increments SubsidyPeriod.version by 1", "SubsidyPeriod allocation and true-cost ratios recomputed", "Participant progress metrics recomputed", "WorkShift quality counters, BusinessLine.quality_incident_count and intake_posture recomputed", "WorkShift auto-close evaluated (billable_labor_cost_cents computed on close)"]

  - method: POST
    path: "/shift-assignments/{shiftAssignmentId}/release"
    description: "Give up a seat before completion - the compensating action for an assignment."
    roles: [CaseManager]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["ASSIGNED -> RELEASED with released_reason = MANUAL_RELEASE", "WorkShift.assigned_count recomputed", "Participant.scheduled_hours_current_week recomputed", "no ledger movement", "WorkShift auto-close evaluated"]

  # --- SupportActivity ------------------------------------------------------
  - method: POST
    path: "/support-activities"
    description: "Plan a job-coaching, case-management, transport-voucher or childcare-voucher service for a participant."
    roles: [JobCoach, CaseManager]
    code: 201
    input: [participant_id, category, duration_minutes, cost_cents]
    output: SupportActivity
    side_effects: ["status = PLANNED", "no ledger movement until delivery"]

  - method: GET
    path: "/support-activities/{supportActivityId}"
    description: "Read one support activity."
    roles: [ProgramDirector, JobCoach, CaseManager, FunderAnalyst]
    code: 200
    input: []
    output: SupportActivity
    side_effects: []

  - method: GET
    path: "/support-activities"
    description: "List support activities, optionally filtered by participant, status and category; paginated."
    roles: [ProgramDirector, JobCoach, CaseManager, FunderAnalyst]
    code: 200
    input: ["participant_id?", "status?", "category?", "limit?", "offset?"]
    output: SupportActivity[]
    side_effects: []

  - method: POST
    path: "/support-activities/{supportActivityId}/deliver"
    description: "Mark a planned service delivered; posts its full cost to the open subsidy period as a MISSION cost entry."
    roles: [JobCoach]
    code: 200
    input: []
    output: SupportActivity
    side_effects: ["PLANNED -> DELIVERED", "CostEntry (COACHING or SUPPORT_SERVICE / MISSION) auto-posted with source_activity_id set; increments SubsidyPeriod.version by 1", "SubsidyPeriod allocation and true-cost ratios recomputed", "Participant.support_activity_minutes and delivered_coaching_count recomputed"]

  - method: POST
    path: "/support-activities/{supportActivityId}/void"
    description: "Void a planned or delivered service; a delivered one also voids its cost entry, which is the compensating action for the mission ledger."
    roles: [ProgramDirector]
    code: 200
    input: [voided_reason]
    output: SupportActivity
    side_effects: ["PLANNED -> VOIDED or DELIVERED -> VOIDED", "the linked CostEntry moves POSTED -> VOIDED and leaves every SubsidyPeriod aggregate", "SubsidyPeriod allocation and true-cost ratios recomputed; increments SubsidyPeriod.version by 1", "Participant support metrics recomputed"]

  # --- Employer -------------------------------------------------------------
  - method: POST
    path: "/employers"
    description: "Register a placement employer with its wage floor."
    roles: [ProgramDirector]
    code: 201
    input: [organization_name, industry_code, min_starting_wage_cents_per_hour]
    output: Employer
    side_effects: ["partnership_status = ACTIVE", "retention_reliability_pct = null"]

  - method: GET
    path: "/employers/{employerId}"
    description: "Read one employer with retention counters and reliability."
    roles: [ProgramDirector, CaseManager, FunderAnalyst, EmployerPartner]
    code: 200
    input: []
    output: Employer
    side_effects: []

  # --- Placement ------------------------------------------------------------
  - method: POST
    path: "/placements"
    description: "Place a graduate with an outside employer; creates the 30/90/180/365-day retention follow-up schedule."
    roles: [CaseManager]
    code: 201
    input: [participant_id, employer_id, hire_date, starting_wage_cents_per_hour, weekly_hours]
    output: Placement
    side_effects: ["employment_status = ACTIVE, wage_verification_status = UNVERIFIED, retention_outcome = PENDING", "Participant GRADUATED -> PLACED", "four RetentionCheckpoint rows created via calculations.retention_checkpoint_schedule", "Employer.placement_count recomputed"]

  - method: GET
    path: "/placements/{placementId}"
    description: "Read one placement with both state dimensions, retention_outcome and wage_progression_pct."
    roles: [ProgramDirector, CaseManager, FunderAnalyst, EmployerPartner]
    code: 200
    input: []
    output: Placement
    side_effects: []

  - method: GET
    path: "/placements"
    description: "List placements, optionally filtered by participant, employer and employment status; paginated."
    roles: [ProgramDirector, CaseManager, FunderAnalyst]
    code: 200
    input: ["participant_id?", "employer_id?", "employment_status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []

  - method: GET
    path: "/placements/{id}/retention-checkpoints"
    description: "List the placement's retention checkpoints ordered by interval_days ASC (index 0 = 30-day, 1 = 90-day, 2 = 180-day, 3 = 365-day)."
    roles: [ProgramDirector, CaseManager, FunderAnalyst, EmployerPartner]
    code: 200
    input: ["status?"]
    output: RetentionCheckpoint[]
    side_effects: []

  - method: POST
    path: "/placements/{placementId}/wage-verification"
    description: "Record wage evidence on the verification dimension. action == VERIFY is an EmployerPartner attestation (verified_wage_cents_per_hour required); action == DISPUTE is a CaseManager flag."
    roles: [EmployerPartner, CaseManager]
    code: 200
    input: [action, "verified_wage_cents_per_hour?"]
    output: Placement
    side_effects: ["wage_verification_status moves independently of employment_status", "wage_progression_pct recomputed or cleared via calculations.wage_progression_pct"]

  - method: POST
    path: "/placements/{placementId}/separate"
    description: "Employer reports the end of employment; drives the retention-outcome, employer-standing and participant re-entry cascade."
    roles: [EmployerPartner]
    code: 200
    input: [separation_type, separation_date]
    output: Placement
    side_effects: ["employment_status -> SEPARATED_VOLUNTARY | SEPARATED_INVOLUNTARY; retention_outcome derived from separation_days_after_hire", "future SCHEDULED checkpoints -> VOIDED", "Employer.failed_retention_count / retention_reliability_pct recomputed", "Employer ACTIVE -> PROBATION (>=3) or PROBATION -> TERMINATED (>=5)", "sibling ACTIVE placements of the employer get at_risk_flag = true", "Participant PLACED -> RE_ENTRY_ELIGIBLE on FAILED_EARLY"]

  # --- RetentionCheckpoint --------------------------------------------------
  - method: POST
    path: "/retention-checkpoints/{retentionCheckpointId}/confirm"
    description: "Employer confirms retention at a due checkpoint, in interval order, supplying the current wage."
    roles: [EmployerPartner]
    code: 200
    input: [still_employed, "verified_wage_cents_per_hour?"]
    output: RetentionCheckpoint
    side_effects: ["SCHEDULED -> CONFIRMED", "Placement wage_verification_status -> VERIFIED and wage_progression_pct recomputed", "at interval_days == 180: Placement.retention_outcome = RETAINED_180, Employer.confirmed_retention_count / retention_reliability_pct recomputed, Participant PLACED -> ALUMNI_RETAINED"]

  - method: POST
    path: "/retention-sweeps"
    description: "Ops-run checkpoint: advances the program epoch against the logical clock - overdue checkpoints to MISSED (due_date ASC, then created_at ASC), then duration-limit exits, then stale re-entry exits. Optionally scoped to one business line."
    roles: [ProgramDirector]
    code: 200
    input: ["business_line_id?"]
    output: "{ missed_checkpoint_count: integer, exited_participant_count: integer, released_assignment_count: integer, swept_at: string }"
    side_effects: ["RetentionCheckpoint SCHEDULED -> MISSED with Placement.at_risk_flag = true", "Participant TRANSITIONAL_EMPLOYED / READY_FOR_GRADUATION -> EXITED_UNSUCCESSFUL past the duration limit, releasing their ASSIGNED assignments", "Participant RE_ENTRY_ELIGIBLE -> EXITED_UNSUCCESSFUL past the 60-day re-entry window", "BusinessLine.training_slots_filled and intake_posture recomputed"]

  # --- SubsidyPeriod / CostEntry -------------------------------------------
  - method: POST
    path: "/subsidy-periods"
    description: "Open a non-overlapping accounting period for a business line with its budgeted supervision hours."
    roles: [ProgramDirector]
    code: 201
    input: [business_line_id, period_start, period_end, supervisor_hours]
    output: SubsidyPeriod
    side_effects: ["status = OPEN, allocation_basis = HOURS, revenue_cents = null", "all ledger aggregates initialised to 0 and both true-cost ratios to null"]

  - method: GET
    path: "/subsidy-periods/{subsidyPeriodId}"
    description: "Read one subsidy period with the mission/business split, true-cost ratios and (once closed) margin, rate and drawn subsidy."
    roles: [ProgramDirector, CaseManager, FunderAnalyst]
    code: 200
    input: []
    output: SubsidyPeriod
    side_effects: []

  - method: GET
    path: "/subsidy-periods"
    description: "List subsidy periods, optionally filtered by business line and status; paginated."
    roles: [ProgramDirector, CaseManager, FunderAnalyst]
    code: 200
    input: ["business_line_id?", "status?", "limit?", "offset?"]
    output: SubsidyPeriod[]
    side_effects: []

  - method: GET
    path: "/subsidy-periods/{subsidyPeriodId}/true-cost-analysis"
    description: "True-cost analysis of the period under a chosen allocation basis (default: the period's own allocation_basis). REVENUE on a period without revenue_cents is rejected."
    roles: [ProgramDirector, FunderAnalyst]
    code: 200
    input: ["allocation_basis?"]
    output: "{ subsidy_period_id: string, allocation_basis: string, mission_share: number, mission_cost_cents: integer, business_operating_cost_cents: integer, total_cost_cents: integer, trainee_hours: number, true_cost_per_trainee_hour_cents: number, subsidy_per_trainee_hour_cents: number }"
    side_effects: ["none - pure read; a what-if basis never persists"]

  - method: POST
    path: "/subsidy-periods/{subsidyPeriodId}/close"
    description: "Close the period with final revenue and the chosen allocation basis; computes the final split and the subsidy draw, then propagates the subsidy cap cascade."
    roles: [ProgramDirector]
    code: 200
    input: [allocation_basis, revenue_cents]
    output: SubsidyPeriod
    side_effects: ["OPEN -> CLOSED with the FINAL allocation variant applied to every POSTED entry", "margin_pct, subsidy_rate and subsidy_draw_cents computed via calculations.subsidy_draw", "BusinessLine.cumulative_subsidy_cents recomputed; LAUNCHED -> SUSPENDED past subsidy_cap_cents", "future SCHEDULED shifts of the line -> CANCELLED, their ASSIGNED assignments -> RELEASED", "increments SubsidyPeriod.version by 1"]

  - method: POST
    path: "/cost-entries"
    description: "Post a manual cost (SUPERVISION | MATERIALS | OVERHEAD) into an open period. expected_subsidy_period_version is the OCC guard from §1.2.1."
    roles: [ProgramDirector]
    code: 201
    input: [subsidy_period_id, category, classification, amount_cents, expected_subsidy_period_version]
    output: CostEntry
    side_effects: ["status = POSTED", "SubsidyPeriod mission_share, per-entry allocations, mission/business/total costs and true-cost ratios recomputed via calculations.subsidy_cost_allocation", "increments SubsidyPeriod.version by 1"]

  - method: GET
    path: "/cost-entries/{costEntryId}"
    description: "Read one cost entry with its mission/business allocation."
    roles: [ProgramDirector, FunderAnalyst]
    code: 200
    input: []
    output: CostEntry
    side_effects: []

  - method: GET
    path: "/cost-entries"
    description: "List cost entries, optionally filtered by period, source support activity and classification; paginated."
    roles: [ProgramDirector, FunderAnalyst]
    code: 200
    input: ["subsidy_period_id?", "source_activity_id?", "classification?", "status?", "limit?", "offset?"]
    output: CostEntry[]
    side_effects: []

  # --- Test-driving endpoint (§1.5 priority ladder rung 3) ------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, week window, period interval and retention due date is evaluated against. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ProgramDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; no sweep is triggered (use POST /retention-sweeps)"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6) - 51 codes, every one triggerable
# =============================================================================

errors:
  # --- auth / authorization -------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the called endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource it does not own: X-User-ID != Referral.referral_partner_id for ReferralPartner, or != Placement.employer_id for EmployerPartner."

  # --- existence ------------------------------------------------------------
  - id: ERR_BUSINESS_LINE_NOT_FOUND
    http: 404
    condition: "businessLineId path id or business_line_id body FK matches no BusinessLine."
  - id: ERR_REFERRAL_PARTNER_NOT_FOUND
    http: 404
    condition: "referralPartnerId path id or referral_partner_id body FK matches no ReferralPartner."
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "referralId path id or referral_id body FK matches no Referral."
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "participantId path id or participant_id body FK matches no Participant."
  - id: ERR_WORK_SHIFT_NOT_FOUND
    http: 404
    condition: "workShiftId path id or work_shift_id body FK matches no WorkShift."
  - id: ERR_SHIFT_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "shiftAssignmentId path id matches no ShiftAssignment."
  - id: ERR_SUPPORT_ACTIVITY_NOT_FOUND
    http: 404
    condition: "supportActivityId path id or source_activity_id filter value matches no SupportActivity."
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "employerId path id or employer_id body FK matches no Employer."
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "placementId path id matches no Placement."
  - id: ERR_RETENTION_CHECKPOINT_NOT_FOUND
    http: 404
    condition: "retentionCheckpointId path id matches no RetentionCheckpoint."
  - id: ERR_SUBSIDY_PERIOD_NOT_FOUND
    http: 404
    condition: "subsidyPeriodId path id or subsidy_period_id body FK matches no SubsidyPeriod."
  - id: ERR_COST_ENTRY_NOT_FOUND
    http: 404
    condition: "costEntryId path id matches no CostEntry."

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Body violates the endpoint input schema: missing required field, unknown enum member, out-of-range integer, malformed ISO 8601 datetime, ends_at <= starts_at, period_end <= period_start, duration_minutes != 0 on a voucher category or == 0 on a coaching category, actual_hours <= 0, REJECTED review without rejection_reason, VERIFY wage-verification without verified_wage_cents_per_hour."

  # --- state preconditions --------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The target entity's current state has no declared transition for the requested trigger (e.g. reviewing an already APPROVED line, graduating a TRANSITIONAL_EMPLOYED participant, confirming a VOIDED checkpoint, closing a CLOSED period)."
  - id: ERR_SHIFT_NOT_SCHEDULED
    http: 409
    condition: "The WorkShift behind a shift-assignment create/complete/release is CLOSED or CANCELLED."
  - id: ERR_PERIOD_CLOSED
    http: 409
    condition: "A cost movement targets a SubsidyPeriod with status == CLOSED (manual post, or the compensating void of a delivered support activity)."

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_BUSINESS_LINE_VERSION
    http: 412
    condition: "expected_business_line_version != BusinessLine.version on POST /participants (§1.2.1 enroll-stale-business-line)."
  - id: ERR_STALE_SUBSIDY_PERIOD_VERSION
    http: 412
    condition: "expected_subsidy_period_version != SubsidyPeriod.version on POST /cost-entries (§1.2.1 cost-entry-stale-subsidy-period)."

  # --- safety / compliance --------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The graduating CaseManager's X-User-ID equals Participant.readiness_certified_by_user_id."
  - id: ERR_GRADUATION_CRITERIA_NOT_MET
    http: 422
    condition: "certify-readiness with transitional_hours_worked < 24.000, support_activity_minutes < 180 or delivered_coaching_count < 2."
  - id: ERR_VIABILITY_GATE_NOT_MET
    http: 422
    condition: "An APPROVED review decision on a line with composite_viability_score < 70.00 or min dimension score < 50."
  - id: ERR_ELIGIBILITY_SCORE_BELOW_FLOOR
    http: 422
    condition: "An ELIGIBLE screen decision with zero verified barriers, hours_available_per_week < 20, or eligibility_score < 50.00."

  # --- temporal -------------------------------------------------------------
  - id: ERR_CHECKPOINT_NOT_DUE
    http: 409
    condition: "Confirming a RetentionCheckpoint while the logical clock is strictly before its due_date."
  - id: ERR_PERIOD_NOT_ENDED
    http: 409
    condition: "Closing a SubsidyPeriod while the logical clock is at or before period_end."
  - id: ERR_HIRE_DATE_BEFORE_GRADUATION
    http: 422
    condition: "Placement hire_date is earlier than Participant.graduated_at."
  - id: ERR_SHIFT_NOT_STARTED
    http: 409
    condition: "Completing an assignment while the logical clock is strictly before WorkShift.starts_at."

  # --- cross-entity referential --------------------------------------------
  - id: ERR_PARTNER_MOU_LAPSED
    http: 409
    condition: "The referring ReferralPartner has mou_status == LAPSED on referral submission or screening."
  - id: ERR_INTAKE_CLOSED
    http: 409
    condition: "Enrolling or re-entering on a BusinessLine whose status != LAUNCHED or whose intake_posture == CLOSED (slots full or quality_incident_count >= 10)."
  - id: ERR_EMPLOYER_NOT_ACTIVE
    http: 409
    condition: "Creating a Placement against an Employer with partnership_status IN {PROBATION, TERMINATED}."
  - id: ERR_NO_OPEN_SUBSIDY_PERIOD
    http: 409
    condition: "calculations.open_period_selector finds no OPEN SubsidyPeriod of the line covering the anchor instant when a cost must be auto-posted."
  - id: ERR_REVENUE_NOT_AVAILABLE
    http: 409
    condition: "true-cost-analysis requested with allocation_basis == REVENUE on a period whose revenue_cents is null."

  # --- uniqueness / cardinality / sequencing -------------------------------
  - id: ERR_DUPLICATE_CANDIDATE_REFERENCE
    http: 409
    condition: "(referral_partner_id, candidate_reference) already exists on another Referral."
  - id: ERR_REFERRAL_ALREADY_ENROLLED
    http: 409
    condition: "A Participant row already references the supplied referral_id."
  - id: ERR_RE_ENTRY_LIMIT_REACHED
    http: 409
    condition: "Re-entry attempted with re_entry_count == RE_ENTRY_LIMIT (2)."
  - id: ERR_DUPLICATE_SHIFT_ASSIGNMENT
    http: 409
    condition: "The participant already holds an ASSIGNED or COMPLETED assignment on this exact WorkShift."
  - id: ERR_CHECKPOINT_OUT_OF_SEQUENCE
    http: 409
    condition: "A checkpoint with a smaller interval_days on the same placement is still SCHEDULED or MISSED."
  - id: ERR_SUBSIDY_PERIOD_OVERLAP
    http: 409
    condition: "A new period's closed interval intersects an existing period (any status) of the same business line."
  - id: ERR_OPEN_ASSIGNMENTS_BLOCK_CLOSE
    http: 409
    condition: "An ASSIGNED ShiftAssignment still exists on a WorkShift of the line whose starts_at falls inside the period being closed."
  - id: ERR_CATEGORY_NOT_MANUALLY_POSTABLE
    http: 422
    condition: "A manual cost entry uses category IN {TRAINEE_WAGES, COACHING, SUPPORT_SERVICE}, all of which are system-posted only."

  # --- interval / capacity --------------------------------------------------
  - id: ERR_PARTICIPANT_REST_BUFFER_CONFLICT
    http: 409
    condition: "The new shift's interval, inflated by REST_BUFFER_MINUTES (60) on both sides, intersects another ASSIGNED/COMPLETED assignment of the same participant; a gap of exactly 60 minutes is accepted."
  - id: ERR_SUPERVISION_CAPACITY_EXCEEDED
    http: 409
    condition: "At some instant inside the new shift's half-open interval, the count of ASSIGNED seats across all SCHEDULED shifts of the same business line would exceed supervisor_capacity; merely touching shifts never contend."
  - id: ERR_SHIFT_CAPACITY_FULL
    http: 409
    condition: "work_shift.assigned_count == work_shift.trainee_capacity."

  # --- fiscal ---------------------------------------------------------------
  - id: ERR_ACTUAL_HOURS_EXCEED_SHIFT
    http: 422
    condition: "actual_hours > WorkShift.duration_hours + ACTUAL_HOURS_GRACE (0.5)."
  - id: ERR_TRAINEE_WAGE_OUT_OF_RANGE
    http: 422
    condition: "wage_cents_per_hour outside 1500..2200 on enrollment or re-entry."
  - id: ERR_WAGE_BELOW_EMPLOYER_FLOOR
    http: 422
    condition: "Placement starting_wage_cents_per_hour < Employer.min_starting_wage_cents_per_hour."
  - id: ERR_WAGE_PROGRESSION_FLOOR_NOT_MET
    http: 422
    condition: "Placement starting_wage_cents_per_hour < round_half_up(graduation_wage_cents_per_hour * WAGE_PROGRESSION_FLOOR 1.10)."
  - id: ERR_WEEKLY_HOURS_CAP_EXCEEDED
    http: 409
    condition: "Committed ISO-week hours plus the new shift's duration_hours would exceed WEEKLY_HOURS_CAP (28.000); exactly 28.000 is accepted."
  - id: ERR_PARTNER_QUOTA_EXCEEDED
    http: 409
    condition: "The partner already submitted referral_quota_per_period referrals within the trailing 30 logical-clock days."

