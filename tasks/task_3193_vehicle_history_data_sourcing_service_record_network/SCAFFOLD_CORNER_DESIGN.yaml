              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "INSPECTION", event_date: "2026-09-01", odometer_reading: 100, payload_ref: "i1", idempotency_key: "k-i1" }
