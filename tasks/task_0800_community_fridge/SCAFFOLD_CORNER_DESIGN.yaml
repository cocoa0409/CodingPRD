# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-Difficulty testable claims)
# Sections/claim_types drawn from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: fridge_creation_sets_computed_ledgers_and_posture
        claim_type: Creation
        grounds:
          - endpoints["POST /fridges"]
          - entities.Fridge.fields.safety_posture
          - entities.Fridge.fields.free_slots
        distinguishing_aspect: "POST /fridges with all required fields returns 201 with safety_posture=OPERATIONAL, free_slots==capacity_slots, budgets and stock_slots_used at 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fridges"
              payload: { name: "New Fridge", location_label: "Main St", capacity_slots: 8 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, post: $.data.safety_posture, free: $.data.free_slots }
          assert:
            - "response.status == 201"
            - "Fridge.${f_id}.safety_posture == OPERATIONAL"
            - "Fridge.${f_id}.free_slots == 8"
            - "Fridge.${f_id}.stock_slots_used == 0"
            - "Fridge.${f_id}.budget_available_cents == 0"
            - "Fridge.${f_id}.version == 1"

      - name: get_fridge_nonexistent_returns_not_found
        claim_type: "Not Found"
        grounds:
          - endpoints["GET /fridges/{fridgeId}"]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /fridges/{id} with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "GET /fridges/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: intake_missing_required_steward_id_returns_validation
        claim_type: "Required Fields"
        grounds:
          - endpoints["POST /fridges/{fridgeId}/donation-batches"]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Intake omitting the required steward_id field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A fridge exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv: $.data.version }
          trigger:
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 3.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv}" }
              as: Steward
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.status == 400"

      - name: intake_default_allergens_empty_for_produce
        claim_type: Defaults
        grounds:
          - entities.DonationBatch.fields.allergens
          - endpoints["POST /fridges/{fridgeId}/donation-batches"]
        distinguishing_aspect: "Omitting allergens on a PRODUCE intake applies the default empty array []."
        test_recipe:
          setup: ["A fridge exists; steward exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv: $.data.version }
            - call: "POST /stewards"
              payload: { name: "S", email: "s@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 3.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b_id: $.data.id, alg: $.data.allergens }
          assert:
            - "DonationBatch.${b_id}.allergens == []"
            - "response.status == 201"

  - section: state_machines
    instances:
      - name: discard_already_discarded_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.DonationBatch.STOCKED_to_DISCARDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Discarding an already-DISCARDED batch fails with ERR_INVALID_STATE; no slot change."
        test_recipe:
          setup: ["A batch STOCKED then DISCARDED once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv: $.data.version }
            - call: "POST /stewards"
              payload: { name: "S", email: "s@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 3.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b_id: $.data.id }
            - call: "POST /donation-batches/${b_id}/discard"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
          trigger:
            - call: "POST /donation-batches/${b_id}/discard"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: accept_offer_already_accepted_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.SurplusOffer.OFFERED_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Accepting an offer already in ACCEPTED status fails with ERR_INVALID_STATE (accept only valid from OFFERED)."
        test_recipe:
          setup: ["A donor, fridge OPERATIONAL, an OFFERED offer accepted once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id }
            - call: "POST /donors"
              payload: { name: "Bistro", donor_type: "RESTAURANT", contact: "b@x.org" }
              as: NetworkAdmin
              captures: { d_id: $.data.id }
            - call: "POST /stewards"
              payload: { name: "S", email: "s@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /donors/${d_id}/offers"
              payload: { fridge_id: "${f_id}", description: "bread", estimated_quantity_kg: 3.0, pickup_by: "2026-03-05T00:00:00Z" }
              as: DonorAgent
              as_user_id: "${d_id}"
              captures: { o_id: $.data.id }
            - call: "POST /offers/${o_id}/accept"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
          trigger:
            - call: "POST /offers/${o_id}/accept"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: accept_offer_past_pickup_by_returns_offer_expired
        claim_type: violation_to_error
        grounds:
          - state_machines.SurplusOffer.OFFERED_to_ACCEPTED
          - errors[ERR_OFFER_EXPIRED]
          - validations[priority=5]
        distinguishing_aspect: "Accepting an OFFERED offer after the clock passes pickup_by returns ERR_OFFER_EXPIRED (409)."
        test_recipe:
          setup: ["An OFFERED offer with pickup_by 2026-03-05; clock advanced to 2026-03-06."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id }
            - call: "POST /donors"
              payload: { name: "Bistro", donor_type: "RESTAURANT", contact: "b@x.org" }
              as: NetworkAdmin
              captures: { d_id: $.data.id }
            - call: "POST /stewards"
              payload: { name: "S", email: "s@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /donors/${d_id}/offers"
              payload: { fridge_id: "${f_id}", description: "bread", estimated_quantity_kg: 3.0, pickup_by: "2026-03-05T00:00:00Z" }
              as: DonorAgent
              as_user_id: "${d_id}"
              captures: { o_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /offers/${o_id}/accept"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_OFFER_EXPIRED"
            - "response.status == 409"

      - name: fail_inspection_on_coverage_shift_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.StewardShift.COMPLETED_to_SCHEDULED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "fail-inspection on a COMPLETED COVERAGE shift (kind != CLEANING) fails ERR_INVALID_STATE; only CLEANING shifts are inspectable."
        test_recipe:
          setup: ["A COVERAGE shift COMPLETED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id }
            - call: "POST /stewards"
              payload: { name: "S", email: "s@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/shifts"
              payload: { steward_id: "${sid}", kind: "COVERAGE", start_at: "2026-03-01T09:00:00Z", end_at: "2026-03-01T10:00:00Z" }
              as: NetworkAdmin
              captures: { sh_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:30:00Z" }
              as: NetworkAdmin
            - call: "POST /shifts/${sh_id}/complete"
              payload: { miles_traveled: 0, handled_cold_chain: false }
              as: Steward
              as_user_id: "${sid}"
          trigger:
            - call: "POST /shifts/${sh_id}/fail-inspection"
              payload: {}
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

  - section: calculations
    instances:
      - name: available_quantity_decrements_on_claim
        claim_type: Correct Result
        grounds:
          - calculations.batch_meal_impact
          - entities.DonationBatch.fields.available_quantity_kg
        distinguishing_aspect: "After a 2.0 kg claim against a 5.0 kg batch, available_quantity_kg == 3.0 and the batch stays STOCKED."
        test_recipe:
          setup: ["A STOCKED batch declared 5.0 kg."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv: $.data.version }
            - call: "POST /stewards"
              payload: { name: "S", email: "s@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 5.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /donation-batches/${b_id}/claims"
              payload: { quantity_kg: 2.0, recipient_label: "x" }
              as: Member
            - call: "GET /donation-batches/${b_id}"
              payload: {}
              as: NetworkAdmin
              captures: { avail: $.data.available_quantity_kg, st: $.data.status }
          assert:
            - "DonationBatch.${b_id}.available_quantity_kg == 3.0"
            - "DonationBatch.${b_id}.status == STOCKED"

      - name: full_claim_autocloses_batch_and_frees_slots
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DonationBatch.STOCKED_to_CLAIMED_OUT
          - calculations.fridge_slot_ledger
        distinguishing_aspect: "Claiming the entire 5.0 kg drives available to 0, auto-transitions the batch to CLAIMED_OUT, and frees its slots (free_slots back to capacity)."
        test_recipe:
          setup: ["A STOCKED batch declared 5.0 kg, footprint 2, in a capacity-6 fridge."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 6 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv: $.data.version }
            - call: "POST /stewards"
              payload: { name: "S", email: "s@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 5.0, slot_footprint: 2, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /donation-batches/${b_id}/claims"
              payload: { quantity_kg: 5.0, recipient_label: "x" }
              as: Member
            - call: "GET /fridges/${f_id}"
              payload: {}
              as: NetworkAdmin
              captures: { free: $.data.free_slots }
          assert:
            - "DonationBatch.${b_id}.status == CLAIMED_OUT"
            - "Fridge.${f_id}.free_slots == 6"

  - section: validations
    instances:
      - name: bakery_intake_without_allergens_returns_label_required
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=8]
          - errors[ERR_ALLERGEN_LABEL_REQUIRED]
        distinguishing_aspect: "A BAKERY intake with an empty/absent allergens list returns ERR_ALLERGEN_LABEL_REQUIRED (422)."
        test_recipe:
          setup: ["Fridge OPERATIONAL; steward exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv: $.data.version }
            - call: "POST /stewards"
              payload: { name: "S", email: "s@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "BAKERY", storage_type: "AMBIENT", declared_quantity_kg: 2.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ALLERGEN_LABEL_REQUIRED"
            - "response.status == 422"

      - name: overclaim_beyond_available_returns_no_portions
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=15]
          - errors[ERR_NO_PORTIONS]
        distinguishing_aspect: "A claim for 4.0 kg against a batch with only 3.0 kg available returns ERR_NO_PORTIONS (409)."
        test_recipe:
          setup: ["A STOCKED batch declared 3.0 kg."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv: $.data.version }
            - call: "POST /stewards"
              payload: { name: "S", email: "s@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 3.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /donation-batches/${b_id}/claims"
              payload: { quantity_kg: 4.0, recipient_label: "x" }
              as: Member
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_PORTIONS"
            - "response.status == 409"

      - name: intake_footprint_exceeds_free_slots_returns_capacity_exceeded
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=14]
          - errors[ERR_CAPACITY_EXCEEDED]
          - entities.Fridge.fields.free_slots
        distinguishing_aspect: "On an OPERATIONAL capacity-2 fridge already full (free_slots 0), a further intake with slot_footprint 1 returns ERR_CAPACITY_EXCEEDED (409) — the capacity error in isolation (fridge OPERATIONAL, so it is not shadowed by the safety check)."
        test_recipe:
          setup: ["A capacity-2 fridge fully occupied by a footprint-2 batch, still OPERATIONAL."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 2 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv0: $.data.version }
            - call: "POST /stewards"
              payload: { name: "S", email: "s@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 4.0, slot_footprint: 2, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv0}" }
              as: Steward
              as_user_id: "${sid}"
            - call: "GET /fridges/${f_id}"
              payload: {}
              as: NetworkAdmin
              captures: { fv1: $.data.version }
          trigger:
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 1.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv1}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CAPACITY_EXCEEDED"
            - "response.status == 409"

      - name: shift_start_after_end_returns_pickup_window_invalid
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=11]
          - errors[ERR_PICKUP_WINDOW_INVALID]
        distinguishing_aspect: "Scheduling a shift with start_at >= end_at returns ERR_PICKUP_WINDOW_INVALID (422)."
        test_recipe:
          setup: ["Fridge and steward exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id }
            - call: "POST /stewards"
              payload: { name: "S", email: "s@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /fridges/${f_id}/shifts"
              payload: { steward_id: "${sid}", kind: "COVERAGE", start_at: "2026-03-01T10:00:00Z", end_at: "2026-03-01T09:00:00Z" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PICKUP_WINDOW_INVALID"
            - "response.status == 422"

      - name: claim_past_use_by_on_stocked_returns_use_by_passed
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=9]
          - errors[ERR_USE_BY_PASSED]
        distinguishing_aspect: "A claim on a still-STOCKED batch whose use_by has passed (no run-ops sweep yet) returns ERR_USE_BY_PASSED (422) — the safety error in isolation, without the state conflict of the §1.8 pairing."
        test_recipe:
          setup: ["A STOCKED batch use_by 2026-03-05; clock advanced to 2026-03-06 with no run-ops."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "F", location_label: "L", capacity_slots: 5 }
