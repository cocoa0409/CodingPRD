      - name: preorder_not_found_on_get
        claim_type: Not Found
        grounds: ["errors[ERR_PREORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /pre-orders/{unknown} -> 404 ERR_PREORDER_NOT_FOUND."
