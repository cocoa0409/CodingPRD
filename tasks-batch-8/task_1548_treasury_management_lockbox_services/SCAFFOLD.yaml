  # --- Test-driving endpoints (logical clock) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary UTC ISO8601 timestamp. Default at server startup is 2026-08-01T00:00:00Z; the clock does NOT fall back to wall-clock. Used by tests to drive cutoff, retention, and SLA window checks deterministically."
    roles: [BankOperationsAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock updated; no entity mutation"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Role is not permitted for this endpoint (per §1.7)"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id does not resolve to an entity within the bank scope"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, bad enum, or out-of-range numeric"

  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Target resource is not in a state from which the requested transition is defined"

  - id: ERR_BANK_NOT_OPERATING
    http: 409
    condition: "Bank.posture is SUSPENDED or LIQUIDATING and the endpoint requires OPERATING"

  - id: ERR_CUSTOMER_NOT_ACTIVE
    http: 409
    condition: "Customer.status is not in {ACTIVE, ONBOARDING} for a value-extending op"

  - id: ERR_CUSTOMER_NOT_SETTLED
    http: 409
    condition: "Customer has non-SETTLED AnalysisCycles blocking termination"

  - id: ERR_SITE_NOT_LIVE
    http: 409
    condition: "LockboxSite.status != LIVE for batch create or capture operations"

  - id: ERR_SITE_HAS_OPEN_BATCHES
    http: 409
    condition: "Site has RemittanceBatches in non-terminal capture_status, blocking decommission"

  - id: ERR_SITE_LACKS_AVAILABILITY_SCHEDULE
    http: 409
    condition: "go_live requires at least one ACTIVE AvailabilitySchedule on the site"

  - id: ERR_SITE_LACKS_TRANSMISSION_FORMAT
    http: 409
    condition: "go_live requires at least one ACTIVE TransmissionFormat on the parent agreement"

  - id: ERR_BATCH_OUT_OF_BALANCE
    http: 409
    condition: "captured_item_count != declared_item_count OR captured_total_cents != declared_total_cents on balance"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Same X-User-ID attempted two steps that must be performed by different individuals (implement/activate, capture/close, raise/decide, settle/approve)"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent's current version (OCC)"

  - id: ERR_TRANSMISSION_FORMAT_INACTIVE
    http: 409
    condition: "No ACTIVE TransmissionFormat exists for the agreement when batch transmit is attempted"

  - id: ERR_EXCEPTION_ALREADY_DECIDED
    http: 409
    condition: "ExceptionItem.status != PENDING|ESCALATED when decide is attempted, or auto_decision_at has passed"

  - id: ERR_IMAGE_RETENTION_EXPIRED
    http: 409
    condition: "ImageRetrievalRequest attempted after item.retention_expires_at"

  - id: ERR_INVALID_REFERENCE
    http: 409
    condition: "Referenced FK (item_id, cycle_id, batch_id, request_id, format supersedes target) does not resolve or belongs to a different bank/customer"

  - id: ERR_DUPLICATE_UNIQUE_FIELD
    http: 409
    condition: "Uniqueness violation: routing_number, tax_id, agreement_number, site_code, or (site, business_date, batch_reference)"

  - id: ERR_CYCLE_NOT_FINALIZED
    http: 409
    condition: "Settle attempted on an AnalysisCycle not in FINALIZED or DISPUTED status"

  - id: ERR_CYCLE_HAS_OPEN_DISPUTES
    http: 409
    condition: "Settle attempted while SUBMITTED ErrorCreditRequests still exist against the cycle"

  - id: ERR_CREDIT_EXCEEDS_REQUESTED
    http: 409
    condition: "approve_partial with approved_credit_cents >= requested_credit_cents"

  - id: ERR_SLA_INCIDENT_ALREADY_REVIEWED
    http: 409
    condition: "Confirm or reject attempted on an SLAIncident not in REPORTED status"

  - id: ERR_AUTO_DECISION_IMMUTABLE
    http: 409
    condition: "Decide attempted after auto_decision_at has passed (system has already or is about to auto-decide)"

  - id: ERR_ITEM_NOT_IN_CAPTURED_STATE
    http: 409
    condition: "accept/return/raise_exception attempted on a RemittanceItem not in CAPTURED status"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BankOperationsAdmin
    description: "Bank-level operator; owns bank lifecycle, business-day rollover, and logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /banks — create bank"
      - "POST /banks/{id}/suspend — bank-level posture"
      - "POST /banks/{id}/resume"
      - "POST /banks/{id}/liquidate"
      - "POST /banks/{id}/close_business_day"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: TreasuryImplementer
    description: "Bank-side implementation specialist; onboards customers, drafts agreements, builds sites, drafts transmission formats, creates availability schedules"
    identity: opaque
    exclusive_operations:
      - "POST /banks/{id}/customers — create customer"
      - "POST .../customers/{id}/begin_onboarding"
      - "POST .../agreements — create agreement"
      - "POST .../agreements/{id}/implement"
      - "POST .../sites — create site"
      - "POST .../availability_schedules — create schedule"
      - "POST .../availability_schedules/{id}/retire"
      - "POST .../transmission_formats — create format"
    shared_operations:
      - "All GET endpoints"

  - name: TreasuryActivator
    description: "Bank-side activator; activates agreements, formats, and sites. MUST be distinct from the implementer (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST .../agreements/{id}/activate"
      - "POST .../agreements/{id}/suspend"
      - "POST .../agreements/{id}/resume"
      - "POST .../agreements/{id}/terminate"
      - "POST .../customers/{id}/suspend"
      - "POST .../customers/{id}/resume"
      - "POST .../customers/{id}/terminate"
      - "POST .../sites/{id}/go_live"
      - "POST .../sites/{id}/suspend"
      - "POST .../sites/{id}/decommission"
      - "POST .../transmission_formats/{id}/activate"
      - "POST .../transmission_formats/{id}/retire"
    shared_operations:
      - "All GET endpoints"

  - name: LockboxOperator
    description: "Bank-side site operator; runs daily capture, balancing, transmission, and image fulfillment"
    identity: opaque
    exclusive_operations:
      - "POST .../batches — create batch"
      - "POST .../batches/{id}/begin_capture"
      - "POST .../batches/{id}/balance"
      - "POST .../batches/{id}/force_out_of_balance"
      - "POST .../batches/{id}/resume_capture"
      - "POST .../batches/{id}/close (subject to closer != capturer)"
      - "POST .../batches/{id}/transmit"
      - "POST .../batches/{id}/mark_transmission_failed"
      - "POST .../items — capture item"
      - "POST .../items/{id}/accept"
      - "POST .../items/{id}/return"
      - "POST .../items/{id}/raise_exception"
      - "POST .../image_requests/{id}/fulfill"
      - "POST .../image_requests/{id}/deny"
    shared_operations:
      - "All GET endpoints"

  - name: CustomerOperator
    description: "Customer-side operator; acknowledges transmissions, decides exceptions, requests images, submits error credit requests, manually reports SLA incidents"
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST .../batches/{id}/acknowledge_transmission"
      - "POST .../exception_items/{id}/decide"
      - "POST .../exception_items/{id}/escalate"
      - "POST .../image_requests — create"
      - "POST .../error_credit_requests — create"
    shared_operations:
      - "All GET endpoints scoped to own customer"
      - "POST .../sla_incidents — create (shared with BillingSpecialist)"

  - name: BillingSpecialist
    description: "Bank-side billing runner; closes analysis cycles, settles statements, triages SLA incidents"
    identity: opaque
    exclusive_operations:
      - "POST /banks/{id}/close_analysis_cycle"
      - "POST .../analysis_cycles/{id}/settle"
      - "POST .../sla_incidents/{id}/confirm"
      - "POST .../sla_incidents/{id}/reject"
    shared_operations:
      - "All GET endpoints"
      - "POST .../sla_incidents — create (shared with CustomerOperator)"

  - name: BillingApprover
    description: "Bank-side billing approver; reviews error credit requests. MUST differ from the BillingSpecialist who settled the cycle."
    identity: opaque
    exclusive_operations:
      - "POST .../error_credit_requests/{id}/approve"
      - "POST .../error_credit_requests/{id}/approve_partial"
      - "POST .../error_credit_requests/{id}/deny"
    shared_operations:
      - "All GET endpoints"

  - name: Auditor
    description: "Read-only oversight role"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
