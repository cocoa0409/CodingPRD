# =============================================================================
# PRD Benchmark Seed Tables — task_3023
# Convenience Store Franchise Gross Profit Split & Store Draw (7-Eleven)
# =============================================================================

scenario: |
  Convenience Store Franchise Gross Profit Split & Store Draw (7-Eleven): franchise agreement
  built on a gross-profit split rather than a royalty on sales, franchisee draw and settlement
  accounting with weekly reconciliation of merchandise, fuel and services, mandatory
  recommended-vendor purchasing with rebate flow-through, store lease and equipment ownership
  resting with the franchisor and affecting exit rights, inventory shrink responsibility and
  audit cadence with book-to-physical adjustments, minimum net worth and store transfer
  approval, fresh food ordering with commissary delivery windows and waste sharing, franchisee
  performance review and renewal criteria

domain_name: convenience-franchise-gp-split
api_prefix: /franchise

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: saga

# =============================================================================
# §1.1 Entity-Relationship Table — 10 entities
# =============================================================================
entities:
  - name: Franchisee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the franchise operator" }
      - { name: owner_name, type: string, source: input, description: "Principal owner of record" }
      - { name: entity_type, type: enum, source: input, description: "INDIVIDUAL | LLC | CORPORATION", default: "LLC", constraints: "enum {INDIVIDUAL, LLC, CORPORATION}; default LLC" }
      - { name: stated_net_worth_cents, type: integer, source: input, description: "Net worth as certified by the franchisee at onboarding, in cents" }
      - { name: draw_outstanding_cents, type: integer, source: computed, description: "Sum of unrecovered DrawAdvance.amount_cents minus recovered_cents for draw status IN {ISSUED, PARTIALLY_RECOVERED}" }
      - { name: open_shrink_charge_cents, type: integer, source: computed, description: "Sum of ShrinkAudit.shrink_charge_cents for audits in status FINALIZED whose charge has not yet been recovered in a FINALIZED Settlement" }
      - { name: audit_adjusted_net_worth_cents, type: integer, source: computed, description: "stated_net_worth_cents - draw_outstanding_cents - open_shrink_charge_cents" }
      - { name: risk_band, type: enum, source: computed, description: "A | B | C — derived by franchisee_net_worth; A when audit_adjusted_net_worth_cents >= 15000000, B when >= 5000000, else C", constraints: "enum {A, B, C}" }
      - { name: status, type: enum, source: system, description: "ACTIVE → SUSPENDED → ACTIVE, ACTIVE/SUSPENDED → TERMINATED", constraints: "enum {ACTIVE, SUSPENDED, TERMINATED}" }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id; the franchisee currently operating this store" }
      - { name: store_number, type: string, source: input, description: "Franchisor-assigned store number, unique across the system" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of the store location" }
      - { name: format, type: enum, source: input, description: "URBAN | SUBURBAN | RURAL", constraints: "enum {URBAN, SUBURBAN, RURAL}" }
      - { name: opened_on, type: datetime, source: input, description: "Date the store opened for business" }
      - { name: lease_owner, type: enum, source: system, description: "Always FRANCHISOR — the store lease rests with the franchisor", constraints: "enum {FRANCHISOR}" }
      - { name: equipment_owner, type: enum, source: system, description: "Always FRANCHISOR — store equipment rests with the franchisor and reverts on exit", constraints: "enum {FRANCHISOR}" }
      - { name: monthly_rent_cents, type: integer, source: computed, description: "Franchisor lease charge recognised against the store; computed from format band" }
      - { name: cold_chain_certified, type: boolean, source: system, description: "Whether the store currently holds a valid cold-chain handling certificate" }
      - { name: status, type: enum, source: system, description: "ACTIVE → TERMINATED", constraints: "enum {ACTIVE, TERMINATED}" }
      - { name: transfer_status, type: enum, source: system, description: "NONE → PENDING → APPROVED / DENIED — independent transfer dimension on the same store row", constraints: "enum {NONE, PENDING, APPROVED, DENIED}" }
      - { name: transfer_target_franchisee_id, type: string, source: input, description: "Identifier of the proposed transferee franchisee for the pending transfer; compared against Franchisee.id" }
      - { name: transfer_price_cents, type: integer, source: input, description: "Proposed transfer price for the store interest" }

  - name: FranchiseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id; the franchisee party to this agreement" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store covered by this agreement" }
      - { name: split_pct, type: number, source: input, description: "Base franchisee share of store gross profit (gross-profit split, not a royalty on sales)" }
      - { name: royalty_pct, type: number, source: system, description: "Always 0.0000 — this agreement is a gross-profit split with no royalty on sales" }
      - { name: waste_share_pct, type: number, source: input, description: "Fraction of fresh-food waste cost charged to the franchisee" }
      - { name: shrink_responsibility_pct, type: number, source: input, description: "Fraction of book-to-physical shrink charged to the franchisee" }
      - { name: rebate_pass_pct, type: number, source: input, description: "Fraction of a recommended-vendor rebate passed through to the franchisee" }
      - { name: minimum_net_worth_cents, type: integer, source: input, description: "Minimum audit-adjusted net worth the franchisee must hold for transfers and renewals" }
      - { name: term_start, type: datetime, source: input, description: "Start of the agreement term" }
      - { name: term_end, type: datetime, source: input, description: "End of the agreement term" }
      - { name: renewal_window_days, type: integer, source: input, description: "Days before term_end during which a renewal may be opened" }
      - { name: performance_tier, type: enum, source: computed, description: "STANDARD | PREFERRED | PREMIER — derived from the covering settlement's gross profit: PREFERRED at >= 10000000 cents, PREMIER at >= 20000000 cents, otherwise STANDARD", constraints: "enum {STANDARD, PREFERRED, PREMIER}" }
      - { name: renewal_eligibility_score, type: integer, source: computed, description: "0-100 score from renewal_eligibility; drives the required renewal net worth band" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → RENEWAL_PENDING → RENEWED / EXPIRED, ACTIVE/RENEWAL_PENDING → TERMINATED", constraints: "enum {DRAFT, ACTIVE, RENEWAL_PENDING, RENEWED, EXPIRED, TERMINATED}" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store whose week is being settled" }
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id; the franchisee receiving the settlement" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the weekly settlement period" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the weekly settlement period" }
      - { name: trailing_avg_gross_profit_cents, type: integer, source: input, description: "Trailing four-week average gross profit for the store, used by the provisional variant" }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Sum of RevenueLine.gross_sales_cents across all lines" }
      - { name: cost_of_goods_cents, type: integer, source: computed, description: "Sum of RevenueLine.cost_of_goods_cents across all lines" }
      - { name: rebate_credit_cents, type: integer, source: computed, description: "Sum of VendorRebate.flowthrough_cents for APPLIED rebates of this store and period" }
      - { name: gross_profit_cents, type: integer, source: computed, description: "(gross_sales_cents - cost_of_goods_cents) + rebate_credit_cents — the split base" }
      - { name: provisional_gross_profit_cents, type: integer, source: computed, description: "trailing_avg_gross_profit_cents + rebate_credit_cents — the provisional variant's split base" }
      - { name: eligible_split_pct, type: number, source: computed, description: "min(0.75, split_pct + tier_bonus) where tier_bonus is 0.02 / 0.01 / 0.00 by gross-profit band" }
      - { name: provisional_split_cents, type: integer, source: computed, description: "round(provisional_gross_profit_cents * split_pct, 2) — provisional variant payout" }
      - { name: franchisee_split_cents, type: integer, source: computed, description: "round(gross_profit_cents * eligible_split_pct, 2) — final-variant franchisee payout" }
      - { name: franchisor_share_cents, type: integer, source: computed, description: "gross_profit_cents - franchisee_split_cents" }
      - { name: shrink_charge_cents, type: integer, source: computed, description: "Sum of finalized ShrinkAudit charges for this store and period" }
      - { name: waste_charge_cents, type: integer, source: computed, description: "waste_share_allocation result over reconciled FreshOrders for this store and period" }
      - { name: draw_recovery_cents, type: integer, source: computed, description: "Draw advance recovered from this settlement, applied before the net payout" }
      - { name: net_settlement_cents, type: integer, source: computed, description: "franchisee_split_cents - shrink_charge_cents - waste_charge_cents - draw_recovery_cents" }
      - { name: provisional, type: boolean, source: computed, description: "True while the settlement still reports the provisional variant" }
      - { name: status, type: enum, source: system, description: "OPEN → DRAW_PAID → RECONCILED → FINALIZED, with a DISPUTED loop back to RECONCILED", constraints: "enum {OPEN, DRAW_PAID, RECONCILED, DISPUTED, FINALIZED}" }
      - { name: dispute_reason, type: string, source: input, description: "Reason recorded when the franchisee disputes a reconciled settlement" }

  - name: RevenueLine
    parent: null
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: input, description: "FK -> Settlement.id; the weekly settlement this revenue line belongs to" }
      - { name: category, type: enum, source: input, description: "MERCHANDISE | FUEL | SERVICES", constraints: "enum {MERCHANDISE, FUEL, SERVICES}" }
      - { name: gross_sales_cents, type: integer, source: input, description: "Gross sales for this category in the period" }
      - { name: cost_of_goods_cents, type: integer, source: input, description: "Cost of goods sold for this category in the period" }
      - { name: line_gross_profit_cents, type: integer, source: computed, description: "gross_sales_cents - cost_of_goods_cents for this line" }

  - name: DrawAdvance
    parent: null
    common_fields: true
    fields:
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id; the franchisee drawing against future settlements" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store the draw is advanced against" }
      - { name: amount_cents, type: integer, source: input, description: "Gross draw amount advanced" }
      - { name: drawn_on, type: datetime, source: input, description: "Date the draw was advanced" }
      - { name: recovered_cents, type: integer, source: computed, description: "Amount recovered against this draw from settlements so far" }
      - { name: status, type: enum, source: system, description: "ISSUED → PARTIALLY_RECOVERED → RECOVERED, ISSUED/PARTIALLY_RECOVERED → REVERSED", constraints: "enum {ISSUED, PARTIALLY_RECOVERED, RECOVERED, REVERSED}" }

  - name: VendorRebate
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store whose recommended-vendor purchases generated the rebate" }
      - { name: vendor_name, type: string, source: input, description: "Name of the vendor issuing the rebate" }
      - { name: vendor_code, type: string, source: input, description: "Franchisor vendor code, unique per vendor within a period" }
      - { name: recommended_vendor, type: boolean, source: input, description: "Whether the vendor sits on the franchisor recommended-vendor list; only true vendors may flow through" }
      - { name: rebate_cents, type: integer, source: input, description: "Gross rebate amount posted by the vendor" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the rebate period" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the rebate period" }
      - { name: flowthrough_cents, type: integer, source: computed, description: "round(rebate_cents * rebate_pass_pct, 2) for the covering agreement; 0 when not applied" }
      - { name: status, type: enum, source: system, description: "POSTED → APPLIED → RETRACTED, POSTED → RETRACTED", constraints: "enum {POSTED, APPLIED, RETRACTED}" }

  - name: ShrinkAudit
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store being counted" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the audited inventory period" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the audited inventory period" }
      - { name: book_inventory_cents, type: integer, source: input, description: "Book inventory value on the last day of the audited period" }
      - { name: physical_inventory_cents, type: integer, source: input, description: "Physical count value recorded at finalize" }
      - { name: shrink_cents, type: integer, source: computed, description: "book_inventory_cents - physical_inventory_cents; negative means an overage" }
      - { name: shrink_charge_cents, type: integer, source: computed, description: "0 when shrink_cents <= 0, otherwise round(shrink_cents * shrink_responsibility_pct, 2)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → COUNTED → FINALIZED, with COUNTED → SCHEDULED for a recount", constraints: "enum {SCHEDULED, COUNTED, FINALIZED}" }

  - name: DeliveryWindow
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store receiving the commissary delivery" }
      - { name: commissary_code, type: string, source: input, description: "Code of the commissary making the delivery" }
      - { name: day_of_week, type: enum, source: input, description: "MON | TUE | WED | THU | FRI | SAT | SUN", constraints: "enum {MON, TUE, WED, THU, FRI, SAT, SUN}" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the delivery window" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the delivery window" }
      - { name: capacity_units, type: integer, source: input, description: "Total fresh units the window can carry" }
      - { name: reserved_units, type: integer, source: computed, description: "Sum of FreshOrder.ordered_units for orders on this window with status in {PLACED, CONFIRMED, DELIVERED, RECONCILED}" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → LOCKED → CANCELLED", constraints: "enum {SCHEDULED, LOCKED, CANCELLED}" }

  - name: FreshOrder
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the ordering store" }
      - { name: delivery_window_id, type: string, source: input, description: "FK -> DeliveryWindow.id; the commissary window the order is booked into" }
      - { name: sku_code, type: string, source: input, description: "Fresh-food SKU ordered" }
      - { name: ordered_units, type: integer, source: input, description: "Units ordered by the store" }
      - { name: delivered_units, type: integer, source: input, description: "Units actually delivered by the commissary" }
      - { name: waste_units, type: integer, source: input, description: "Units discarded before sale at reconciliation" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Commissary unit cost" }
      - { name: line_waste_cents, type: integer, source: computed, description: "round(round(unit_cost_cents * waste_units, 2) * waste_share_pct, 2) for the covering agreement" }
      - { name: waste_share_cents, type: integer, source: computed, description: "Store-level share of waste charged to the franchisee for this order, set at reconciliation" }
      - { name: status, type: enum, source: system, description: "PLACED → CONFIRMED → DELIVERED → RECONCILED, PLACED/CONFIRMED → CANCELLED", constraints: "enum {PLACED, CONFIRMED, DELIVERED, RECONCILED, CANCELLED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Franchisee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /franchisees/{id}/suspend"
        actor: FranchisorAdmin
        preconditions:
          - "Franchisee.status == ACTIVE"
          - "Franchisee.draw_outstanding_cents <= 5000000 (ERR_DRAW_EXCEEDS_LIMIT)"
        side_effects:
          - "Franchisee.status → SUSPENDED"
          - "Cascade hop 1: every Store with Store.franchisee_id == this Franchisee.id and Store.status == ACTIVE transitions to TERMINATED (see the Store ACTIVE→TERMINATED transition, which continues the chain)"
          - "Franchisee.audit_adjusted_net_worth_cents recomputed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /franchisees/{id}/reinstate"
        actor: FranchisorAdmin
        preconditions:
          - "Franchisee.status == SUSPENDED"
          - "Franchisee.open_shrink_charge_cents == 0 (ERR_SHRINK_OVERAGE_NOT_CHARGEABLE)"
          - "Franchisee.audit_adjusted_net_worth_cents >= 5000000 (ERR_MIN_NET_WORTH_NOT_MET)"
        side_effects:
          - "Franchisee.status → ACTIVE"
          - "Franchisee.risk_band re-derived from audit_adjusted_net_worth_cents"
          - "Cascade hop 1: every ShrinkAudit with ShrinkAudit.store_id in the stores of this franchisee and status == COUNTED transitions to FINALIZED (see the ShrinkAudit COUNTED→FINALIZED transition, which continues the chain into Franchisee.open_shrink_charge_cents)"
          - "Cascade hop 2: as each audit finalizes, Franchisee.open_shrink_charge_cents is recomputed from the finalized charges, then Franchisee.audit_adjusted_net_worth_cents, then Franchisee.risk_band (in that order)"
          - "Cascade hop 3: every Store with Store.franchisee_id == this Franchisee.id and Store.status == TERMINATED transitions back to ACTIVE (see the Store TERMINATED→ACTIVE transition, which is caused by hop 2 having restored the franchisee to a compliant standing)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /franchisees/{id}/terminate"
        actor: FranchisorAdmin
        preconditions:
          - "Franchisee.status == ACTIVE"
          - "Franchisee.draw_outstanding_cents == 0 (ERR_DRAW_EXCEEDS_LIMIT)"
        side_effects:
          - "Franchisee.status → TERMINATED"
          - "Cascade hop 1: every Store with Store.franchisee_id == this Franchisee.id and Store.status == ACTIVE transitions to TERMINATED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /franchisees/{id}/terminate"
        actor: FranchisorAdmin
        preconditions:
          - "Franchisee.status == SUSPENDED"
        side_effects:
          - "Franchisee.status → TERMINATED"

  - entity: Store
    initial_state: ACTIVE
    terminal_states: []
    note: "Two independent state dimensions ride on one Store row. `status` is cyclic (ACTIVE ⇄ TERMINATED, because the franchisee-reinstate cascade restores stores) so it has no terminal state; `transfer_status` runs NONE → PENDING → APPROVED/DENIED with DENIED → PENDING. Neither dimension gates the other's transitions except where a precondition names it."
    transitions:
      - from: TERMINATED
        to: ACTIVE
        trigger: "system event: cascade hop 3 from Franchisee SUSPENDED→ACTIVE reinstate, once the reinstated franchisee's standing is compliant"
        actor: system
        preconditions:
          - "Store.status == TERMINATED"
          - "Store.franchisee_id is the franchisee that was just reinstated to ACTIVE"
        side_effects:
          - "Store.status → ACTIVE"
          - "Store.transfer_status → NONE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system event: cascade from Franchisee ACTIVE→SUSPENDED or Franchisee ACTIVE→TERMINATED (hop 1)"
        actor: system
        preconditions:
          - "Store.status == ACTIVE"
          - "Store.franchisee_id is the franchisee whose status just left ACTIVE"
        side_effects:
          - "Store.status → TERMINATED"
          - "Store.transfer_status → NONE when it was PENDING or APPROVED"
          - "Cascade hop 2: every FreshOrder with FreshOrder.store_id == this Store.id and FreshOrder.status IN {PLACED, CONFIRMED, DELIVERED} transitions to CANCELLED (see the FreshOrder → CANCELLED transitions, which continue the chain)"
          - "Every DeliveryWindow with DeliveryWindow.store_id == this Store.id and DeliveryWindow.status IN {SCHEDULED, LOCKED} transitions to CANCELLED"
      - from: NONE
        to: PENDING
        trigger: "POST /stores/{id}/transfer-requests"
        actor: FranchisorAdmin
        preconditions:
          - "Store.status == ACTIVE"
          - "Store.transfer_status == NONE"
          - "target franchisee exists and Franchisee.status == ACTIVE (ERR_TRANSFEREE_NOT_ELIGIBLE)"
          - "Store.transfer_target_franchisee_id != Store.franchisee_id (ERR_TRANSFER_CONFLICT)"
        side_effects:
          - "Store.transfer_status → PENDING"
          - "Store.transfer_target_franchisee_id and Store.transfer_price_cents stored"
      - from: PENDING
        to: APPROVED
        trigger: "POST /stores/{id}/transfer-decision (decision=APPROVE)"
        actor: FranchisorAdmin
        preconditions:
          - "Store.transfer_status == PENDING"
          - "Transferee Franchisee.audit_adjusted_net_worth_cents >= the covering FranchiseAgreement.minimum_net_worth_cents (ERR_TRANSFER_NET_WORTH_INSUFFICIENT)"
          - "No FranchiseAgreement with franchisee_id == transferee and store_id == this Store and status IN {ACTIVE, RENEWAL_PENDING, TERMINATED} (ERR_TRANSFER_CONFLICT)"
        side_effects:
          - "Store.transfer_status → APPROVED"
          - "Store.franchisee_id → Store.transfer_target_franchisee_id"
          - "Every FranchiseAgreement for this Store with status IN {ACTIVE, RENEWAL_PENDING} → TERMINATED"
          - "Transferee Franchisee.audit_adjusted_net_worth_cents recomputed; risk_band re-derived"
      - from: PENDING
        to: DENIED
        trigger: "POST /stores/{id}/transfer-decision (decision=DENY)"
        actor: FranchisorAdmin
        preconditions:
          - "Store.transfer_status == PENDING"
        side_effects:
          - "Store.transfer_status → DENIED"
          - "Store.franchisee_id unchanged"
      - from: DENIED
        to: PENDING
        trigger: "POST /stores/{id}/transfer-requests"
        actor: FranchisorAdmin
        preconditions:
          - "Store.status == ACTIVE"
          - "Store.transfer_status == DENIED"
          - "Store.transfer_target_franchisee_id != Store.franchisee_id (ERR_TRANSFER_CONFLICT)"
        side_effects:
          - "Store.transfer_status → PENDING (a fresh request re-opens the transfer)"

  - entity: FranchiseAgreement
    initial_state: DRAFT
    terminal_states: [RENEWED, EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /agreements/{id}/activate"
        actor: FranchisorAdmin
        preconditions:
          - "FranchiseAgreement.status == DRAFT"
          - "Covering Store.status == ACTIVE (ERR_STORE_NOT_ACTIVE)"
          - "Franchisee.stated_net_worth_cents >= FranchiseAgreement.minimum_net_worth_cents (ERR_MIN_NET_WORTH_NOT_MET)"
        side_effects:
          - "FranchiseAgreement.status → ACTIVE"
          - "FranchiseAgreement.performance_tier → STANDARD"
          - "Franchisee.audit_adjusted_net_worth_cents recomputed"
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /agreements/{id}/open-renewal"
        actor: FranchisorAdmin
        preconditions:
          - "FranchiseAgreement.status == ACTIVE"
          - "logical clock >= FranchiseAgreement.term_end - renewal_window_days (ERR_RENEWAL_WINDOW_NOT_OPEN)"
          - "FranchiseAgreement.renewal_eligibility_score >= 60 (ERR_RENEWAL_ELIGIBILITY_FAILED)"
        side_effects:
          - "FranchiseAgreement.status → RENEWAL_PENDING"
          - "FranchiseAgreement.renewal_eligibility_score computed by renewal_eligibility"
      - from: RENEWAL_PENDING
        to: RENEWED
        trigger: "POST /agreements/{id}/renew"
        actor: FranchisorAdmin
        preconditions:
          - "FranchiseAgreement.status == RENEWAL_PENDING"
          - "Franchisee.audit_adjusted_net_worth_cents >= max(minimum_net_worth_cents, required_net_worth_band[renewal_eligibility_score]) (ERR_RENEWAL_NET_WORTH_INSUFFICIENT)"
          - "no Settlement with Settlement.store_id == this agreement's store and Settlement.status == DISPUTED (ERR_OPEN_DISPUTE_BLOCKS_RENEWAL)"
        side_effects:
          - "FranchiseAgreement.status → RENEWED"
          - "FranchiseAgreement.term_start → new_term_end - 365 days; term_end → new_term_end"
          - "A successor FranchiseAgreement is created in DRAFT for the renewal term, carrying split_pct, waste_share_pct, shrink_responsibility_pct, rebate_pass_pct"
      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "system event: logical clock reaches term_end with no renewal decision"
        actor: system
        preconditions:
          - "FranchiseAgreement.status == RENEWAL_PENDING"
          - "logical clock >= FranchiseAgreement.term_end"
        side_effects:
          - "FranchiseAgreement.status → EXPIRED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: logical clock reaches term_end with no renewal opened"
        actor: system
        preconditions:
          - "FranchiseAgreement.status == ACTIVE"
          - "logical clock >= FranchiseAgreement.term_end"
        side_effects:
          - "FranchiseAgreement.status → EXPIRED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system event: cascade from Franchisee leaving ACTIVE"
        actor: system
        preconditions:
          - "FranchiseAgreement.status == ACTIVE"
          - "Franchisee.status IN {SUSPENDED, TERMINATED}"
        side_effects:
          - "FranchiseAgreement.status → TERMINATED"
          - "royalty_pct remains 0.0000 — no royalty accrues on termination because this agreement splits gross profit, not sales"

  - entity: Settlement
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: DRAW_PAID
        trigger: "POST /settlements/{id}/reconcile"
        actor: FranchisorAdmin
        preconditions:
          - "Settlement.status == OPEN"
          - "at least one RevenueLine with RevenueLine.settlement_id == this Settlement.id exists (ERR_NO_REVENUE_LINES)"
        side_effects:
          - "Settlement.status → DRAW_PAID"
          - "Cascade hop 1: every VendorRebate with VendorRebate.store_id == this Settlement.store_id, status == POSTED, recommended_vendor == true, and period_start < Settlement.period_end and period_end > Settlement.period_start transitions to APPLIED"
          - "Cascade hop 2: as each rebate lands, Settlement.rebate_credit_cents is recomputed as the sum of that rebate's flowthrough_cents, then Settlement.gross_profit_cents = (gross_sales_cents - cost_of_goods_cents) + rebate_credit_cents, then Settlement.eligible_split_pct = min(0.75, split_pct + tier_bonus), then Settlement.franchisee_split_cents and Settlement.franchisor_share_cents are recomputed in that order"
          - "Cascade hop 3: the covering FranchiseAgreement.performance_tier is re-derived from the recomputed Settlement.gross_profit_cents — PREMIER when it is >= 20000000, PREFERRED when it is >= 10000000, otherwise STANDARD"
          - "Settlement.draw_recovery_cents = draw_recovery_allocation(...); net_settlement_cents recomputed; Franchisee.draw_outstanding_cents recomputed"
          - "Settlement.provisional remains true"
      - from: DRAW_PAID
        to: RECONCILED
        trigger: "POST /settlements/{id}/reconcile"
        actor: FranchisorAdmin
        preconditions:
          - "Settlement.status == DRAW_PAID"
          - "every ShrinkAudit with ShrinkAudit.store_id == this Settlement.store_id and a period overlapping [period_start, period_end) has status == FINALIZED (ERR_UNFINALIZED_SHRINK_AUDIT)"
          - "every FreshOrder with FreshOrder.store_id == this Settlement.store_id and a delivery window overlapping [period_start, period_end) has status IN {RECONCILED, CANCELLED} (ERR_UNRECONCILED_FRESH_ORDER)"
        side_effects:
          - "Settlement.status → RECONCILED"
          - "Settlement.shrink_charge_cents = sum of finalized ShrinkAudit.shrink_charge_cents for the store and period"
          - "Settlement.waste_charge_cents = waste_share_allocation(...)"
          - "Settlement.net_settlement_cents recomputed and frozen; Settlement.provisional → false"
          - "Franchisee.open_shrink_charge_cents recomputed; audit_adjusted_net_worth_cents recomputed; risk_band re-derived"
      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /settlements/{id}/disputes"
        actor: Franchisee
        preconditions:
          - "Settlement.status == RECONCILED"
          - "the acting Franchisee.id == Settlement.franchisee_id (ERR_FORBIDDEN)"
          - "logical clock <= Settlement.period_end + 14 days (ERR_SETTLEMENT_COOLOFF_NOT_ELAPSED)"
        side_effects:
          - "Settlement.status → DISPUTED"
          - "Settlement.dispute_reason recorded"
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /settlements/{id}/resolve-dispute"
        actor: FranchisorAdmin
        preconditions:
          - "Settlement.status == DISPUTED"
        side_effects:
          - "Settlement.status → RECONCILED"
          - "Settlement.waste_charge_cents recomputed with the resolved waste_share_pct"
          - "Settlement.net_settlement_cents recomputed; franchisee_split_cents + franchisor_share_cents == gross_profit_cents is preserved exactly (the resolution moves money between charge buckets, never the split base)"
      - from: RECONCILED
        to: FINALIZED
        trigger: "POST /settlements/{id}/finalize"
        actor: FranchisorAdmin
        preconditions:
          - "Settlement.status == RECONCILED"
          - "logical clock >= Settlement.period_end + 7 days (ERR_SETTLEMENT_COOLOFF_NOT_ELAPSED)"
        side_effects:
          - "Settlement.status → FINALIZED"
          - "Every DrawAdvance with DrawAdvance.franchisee_id == Settlement.franchisee_id and status IN {ISSUED, PARTIALLY_RECOVERED} recovers min(amount_cents - recovered_cents, remaining_available) in drawn_on ASC, created_at ASC order until remaining_available == 0; each fully recovered draw → RECOVERED, each partially recovered draw → PARTIALLY_RECOVERED"
          - "Franchisee.draw_outstanding_cents recomputed"
      - from: OPEN
        to: FINALIZED
        trigger: "system event: cascade from FreshOrder → CANCELLED, which was itself caused by Store ACTIVE→TERMINATED (hops 2→3)"
        actor: system
        preconditions:
          - "Settlement.status == OPEN"
        side_effects:
          - "Settlement.status → FINALIZED"
          - "Every DrawAdvance for this franchisee with status IN {ISSUED, PARTIALLY_RECOVERED} recovers against net_settlement_cents in drawn_on ASC, created_at ASC order"
      - from: DRAW_PAID
        to: FINALIZED
        trigger: "system event: cascade from FreshOrder → CANCELLED (hops 2→3)"
        actor: system
        preconditions:
          - "Settlement.status == DRAW_PAID"
        side_effects:
          - "Settlement.status → FINALIZED"

  - entity: DrawAdvance
    initial_state: ISSUED
    terminal_states: [RECOVERED, REVERSED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_RECOVERED
        trigger: "system event: settlement finalize recovers part of the outstanding draw"
        actor: system
        preconditions:
          - "DrawAdvance.status == ISSUED"
          - "recovery amount from draw_recovery_allocation is < amount_cents - recovered_cents"
        side_effects:
          - "DrawAdvance.status → PARTIALLY_RECOVERED"
          - "DrawAdvance.recovered_cents increases by the allocated amount"
          - "Franchisee.draw_outstanding_cents recomputed"
      - from: ISSUED
        to: RECOVERED
        trigger: "system event: settlement finalize recovers the whole draw"
        actor: system
        preconditions:
          - "DrawAdvance.status == ISSUED"
          - "recovery amount >= amount_cents - recovered_cents"
        side_effects:
          - "DrawAdvance.status → RECOVERED"
          - "DrawAdvance.recovered_cents == DrawAdvance.amount_cents"
      - from: PARTIALLY_RECOVERED
        to: RECOVERED
        trigger: "system event: settlement finalize clears the remaining balance"
        actor: system
        preconditions:
          - "DrawAdvance.status == PARTIALLY_RECOVERED"
          - "recovery amount >= amount_cents - recovered_cents"
        side_effects:
          - "DrawAdvance.status → RECOVERED"
          - "DrawAdvance.recovered_cents == DrawAdvance.amount_cents"
      - from: ISSUED
        to: REVERSED
        trigger: "POST /draws/{id}/reverse"
        actor: FranchisorAdmin
        preconditions:
          - "DrawAdvance.status IN {ISSUED, PARTIALLY_RECOVERED}"
          - "DrawAdvance.recovered_cents == 0 (ERR_DRAW_PARTIALLY_RECOVERED)"
        side_effects:
          - "DrawAdvance.status → REVERSED"
          - "Franchisee.draw_outstanding_cents recomputed"
      - from: PARTIALLY_RECOVERED
        to: REVERSED
        trigger: "POST /draws/{id}/reverse"
        actor: FranchisorAdmin
        preconditions:
          - "DrawAdvance.status == PARTIALLY_RECOVERED"
          - "DrawAdvance.recovered_cents == 0 (ERR_DRAW_PARTIALLY_RECOVERED)"
        side_effects:
          - "DrawAdvance.status → REVERSED"

  - entity: VendorRebate
    initial_state: POSTED
    terminal_states: [RETRACTED]
    transitions:
      - from: POSTED
        to: APPLIED
        trigger: "system event: cascade hop 1 from Settlement OPEN→DRAW_PAID reconciliation"
        actor: system
        preconditions:
          - "VendorRebate.status == POSTED"
          - "VendorRebate.recommended_vendor == true (ERR_VENDOR_NOT_RECOMMENDED)"
          - "the covering FranchiseAgreement status IN {ACTIVE, RENEWAL_PENDING} (ERR_NO_OPEN_AGREEMENT)"
        side_effects:
          - "VendorRebate.status → APPLIED"
          - "VendorRebate.flowthrough_cents = rebate_flowthrough(...) using the pass_through_after_retention variant"
      - from: POSTED
        to: RETRACTED
        trigger: "POST /rebates/{id}/retract"
        actor: FranchisorAdmin
        preconditions:
          - "VendorRebate.status == POSTED"
          - "logical clock >= VendorRebate.period_end (ERR_REBATE_RETRACTION_WINDOW_CLOSED)"
        side_effects:
          - "VendorRebate.status → RETRACTED"
          - "VendorRebate.flowthrough_cents → 0"
      - from: APPLIED
        to: RETRACTED
        trigger: "POST /rebates/{id}/retract"
        actor: FranchisorAdmin
        preconditions:
          - "VendorRebate.status == APPLIED"
          - "the covering Settlement.status IN {OPEN, DRAW_PAID, RECONCILED, DISPUTED} (ERR_SETTLEMENT_ALREADY_FINALIZED)"
        side_effects:
          - "VendorRebate.status → RETRACTED"
          - "VendorRebate.flowthrough_cents → 0"
          - "the covering Settlement.rebate_credit_cents is recomputed downward, then Settlement.gross_profit_cents, then eligible_split_pct, then franchisee_split_cents and franchisor_share_cents (in that pinned order)"

  - entity: ShrinkAudit
    initial_state: SCHEDULED
    terminal_states: [FINALIZED]
    transitions:
      - from: SCHEDULED
        to: COUNTED
        trigger: "POST /shrink-audits/{id}/count"
        actor: FranchisorAdmin
        preconditions:
          - "ShrinkAudit.status == SCHEDULED"
          - "ShrinkAudit.physical_inventory_cents >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "ShrinkAudit.status → COUNTED"
          - "ShrinkAudit.shrink_cents = book_inventory_cents - physical_inventory_cents"
          - "ShrinkAudit.shrink_charge_cents = the provisional variant of shrink_charge_book_to_physical"
      - from: COUNTED
        to: SCHEDULED
        trigger: "POST /shrink-audits/{id}/recount"
        actor: FranchisorAdmin
        preconditions:
          - "ShrinkAudit.status == COUNTED"
        side_effects:
          - "ShrinkAudit.status → SCHEDULED"
          - "ShrinkAudit.physical_inventory_cents reset to null; shrink_cents and shrink_charge_cents cleared"
      - from: COUNTED
        to: FINALIZED
        trigger: "POST /shrink-audits/{id}/finalize"
        actor: FranchisorAdmin
        preconditions:
          - "ShrinkAudit.status == COUNTED"
          - "logical clock >= ShrinkAudit.period_end (ERR_AUDIT_PERIOD_NOT_CLOSED)"
          - "ShrinkAudit.period_start is not more than 31 days after the store's previous FINALIZED ShrinkAudit.period_end, or the store has none (ERR_AUDIT_CADENCE_REQUIRED)"
        side_effects:
          - "ShrinkAudit.status → FINALIZED"
          - "ShrinkAudit.shrink_charge_cents = 0 when shrink_cents <= 0, else the final variant of shrink_charge_book_to_physical"
          - "Franchisee.open_shrink_charge_cents recomputed; audit_adjusted_net_worth_cents recomputed; risk_band re-derived"

  - entity: DeliveryWindow
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LOCKED
        trigger: "POST /delivery-windows/{id}/lock"
        actor: FranchisorAdmin
        preconditions:
          - "DeliveryWindow.status == SCHEDULED"
          - "logical clock < DeliveryWindow.window_start - 24 hours (ERR_WINDOW_LOCK_TOO_LATE)"
          - "DeliveryWindow.reserved_units <= DeliveryWindow.capacity_units (ERR_WINDOW_CAPACITY_EXCEEDED)"
        side_effects:
          - "DeliveryWindow.status → LOCKED"
          - "no further FreshOrder may be created against this window (ERR_WINDOW_LOCKED)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: cascade from Store ACTIVE→TERMINATED"
        actor: system
        preconditions:
          - "DeliveryWindow.status == SCHEDULED"
        side_effects:
          - "DeliveryWindow.status → CANCELLED"
      - from: LOCKED
        to: CANCELLED
        trigger: "system event: cascade from Store ACTIVE→TERMINATED"
        actor: system
        preconditions:
          - "DeliveryWindow.status == LOCKED"
        side_effects:
          - "DeliveryWindow.status → CANCELLED"

  - entity: FreshOrder
    initial_state: PLACED
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: PLACED
        to: CONFIRMED
        trigger: "POST /fresh-orders/{id}/confirm"
        actor: FranchisorAdmin
        preconditions:
          - "FreshOrder.status == PLACED"
          - "the bound DeliveryWindow.status == SCHEDULED (ERR_WINDOW_LOCKED)"
        side_effects:
          - "FreshOrder.status → CONFIRMED"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /fresh-orders/{id}/cancel"
        actor: Franchisee
        preconditions:
          - "FreshOrder.status == PLACED"
          - "logical clock < the bound DeliveryWindow.window_start - 24 hours (ERR_ORDER_CANCEL_WINDOW_CLOSED)"
          - "the acting Franchisee.id owns the bound Store (ERR_FORBIDDEN)"
        side_effects:
          - "FreshOrder.status → CANCELLED"
          - "the bound DeliveryWindow.reserved_units decreases by FreshOrder.ordered_units (this is the compensating half of the reserved_units invariant)"
          - "Cascade hop 3: every Settlement with Settlement.store_id == this FreshOrder.store_id and status IN {OPEN, DRAW_PAID} transitions to FINALIZED (see the Settlement OPEN→FINALIZED and DRAW_PAID→FINALIZED transitions, which continue the chain into DrawAdvance recovery)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /fresh-orders/{id}/cancel"
        actor: Franchisee
        preconditions:
          - "FreshOrder.status == CONFIRMED"
          - "logical clock < the bound DeliveryWindow.window_start (ERR_ORDER_CANCEL_WINDOW_CLOSED)"
          - "the acting Franchisee.id owns the bound Store (ERR_FORBIDDEN)"
        side_effects:
          - "FreshOrder.status → CANCELLED"
          - "the bound DeliveryWindow.reserved_units decreases by FreshOrder.ordered_units"
          - "Cascade hop 3: every Settlement with Settlement.store_id == this FreshOrder.store_id and status IN {OPEN, DRAW_PAID} transitions to FINALIZED"
      - from: PLACED
        to: CANCELLED
        trigger: "system event: cascade from Store ACTIVE→TERMINATED (hop 2)"
        actor: system
        preconditions:
          - "FreshOrder.status == PLACED"
          - "the bound Store.status == TERMINATED"
        side_effects:
          - "FreshOrder.status → CANCELLED"
          - "the bound DeliveryWindow.reserved_units decreases by FreshOrder.ordered_units"
          - "Cascade hop 3: every Settlement with Settlement.store_id == this FreshOrder.store_id and status IN {OPEN, DRAW_PAID} transitions to FINALIZED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system event: cascade from Store ACTIVE→TERMINATED (hop 2)"
        actor: system
        preconditions:
          - "FreshOrder.status == CONFIRMED"
          - "the bound Store.status == TERMINATED"
        side_effects:
          - "FreshOrder.status → CANCELLED"
          - "the bound DeliveryWindow.reserved_units decreases by FreshOrder.ordered_units"
          - "Cascade hop 3: every Settlement with Settlement.store_id == this FreshOrder.store_id and status IN {OPEN, DRAW_PAID} transitions to FINALIZED"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /fresh-orders/{id}/deliver"
        actor: FranchisorAdmin
        preconditions:
          - "FreshOrder.status == CONFIRMED"
          - "the bound DeliveryWindow.status == LOCKED (ERR_WINDOW_NOT_LOCKED)"
          - "logical clock >= the bound DeliveryWindow.window_start and < DeliveryWindow.window_end (ERR_DELIVERY_OUTSIDE_WINDOW)"
        side_effects:
          - "FreshOrder.status → DELIVERED"
          - "FreshOrder.delivered_units recorded"
      - from: DELIVERED
        to: RECONCILED
        trigger: "POST /fresh-orders/{id}/reconcile"
        actor: FranchisorAdmin
        preconditions:
          - "FreshOrder.status == DELIVERED"
          - "FreshOrder.waste_units <= FreshOrder.delivered_units (ERR_INVALID_REQUEST)"
        side_effects:
          - "FreshOrder.status → RECONCILED"
          - "FreshOrder.line_waste_cents = round(round(unit_cost_cents * waste_units, 2) * waste_share_pct, 2), then FreshOrder.waste_share_cents = line_waste_cents"
          - "the bound DeliveryWindow.reserved_units decreases by FreshOrder.ordered_units"
          - "when the covering Settlement.status IN {DRAW_PAID, RECONCILED}, Settlement.waste_charge_cents is recomputed by waste_share_allocation and net_settlement_cents recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: settlement-create-stale-store
    parent_entity: Store
    write_endpoint: "POST /franchise/settlements"
    occ_field: "expected_store_version"
    description: |
      Creating a Settlement for a Store whose version has advanced since the
      client last observed it is rejected, because the store-side franchise
      configuration a settlement snapshots may already have changed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: revenue-line-stale-settlement
    parent_entity: Settlement
    write_endpoint: "POST /franchise/settlements/{id}/revenue-lines"
    occ_field: "expected_settlement_version"
    description: |
      Appending a RevenueLine to a Settlement whose version has advanced since
      the client last observed it is rejected, because the settlement's
      accumulated totals already reflect another writer's line.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-decision-stale-store
    parent_entity: Store
    write_endpoint: "POST /franchise/stores/{id}/transfer-decision"
    occ_field: "expected_store_version"
    description: |
      Deciding a pending store transfer against a Store whose version has
      advanced since the client last observed it is rejected, because the
      transfer terms the client is approving are no longer the current ones.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: gross_profit_split
    trigger: "POST /settlements/{id}/reconcile (OPEN→DRAW_PAID and DRAW_PAID→RECONCILED)"
    algorithm: dual_variant
    input_set: "All RevenueLine rows whose settlement_id == this Settlement.id, regardless of category. APPLIED VendorRebate rows whose store_id == this Settlement.store_id and whose [period_start, period_end) overlaps this Settlement's [period_start, period_end). FINALIZED ShrinkAudit rows for the same store and period."
    formula: |
      // Pinned evaluation order — every step consumes the previous step's output.
      1. gross_sales_cents      = sum(RevenueLine.gross_sales_cents)
      2. cost_of_goods_cents    = sum(RevenueLine.cost_of_goods_cents)
      3. rebate_credit_cents    = sum(VendorRebate.flowthrough_cents over APPLIED rebates in scope)
      4. gross_profit_cents     = (gross_sales_cents - cost_of_goods_cents) + rebate_credit_cents
      5. provisional_gross_profit_cents = trailing_avg_gross_profit_cents + rebate_credit_cents
      6. eligible_split_pct     = min(0.75, split_pct + tier_bonus(gross_profit_cents))
           tier_bonus(x) = 0.02 when x >= 20000000
                           0.01 when x >= 10000000
                           0.00 otherwise
      7. franchisee_split_cents = round(gross_profit_cents * eligible_split_pct, 2)
      8. franchisor_share_cents = gross_profit_cents - franchisee_split_cents   // last, so the two always sum to the base
      // The provisional variant reports round(provisional_gross_profit_cents * split_pct, 2)
      // with no tier bonus and is what net_settlement_cents uses while provisional == true.
    constants:
      TIER_BONUS_HIGH: 0.02
      TIER_BONUS_MID: 0.01
      TIER_BONUS_LOW: 0.00
      TIER_BONUS_HIGH_THRESHOLD_CENTS: 20000000
      TIER_BONUS_MID_THRESHOLD_CENTS: 10000000
      SPLIT_PCT_CAP: 0.75
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Settlement.status IN {OPEN, DRAW_PAID}; Settlement.provisional == true"
        difference: "Splits trailing_avg_gross_profit_cents + rebate_credit_cents at the bare split_pct with no tier bonus, so a store whose actual week diverged from its four-week trailing average sees a different franchisee payout than the final variant."
      - name: final
        when: "Settlement.status IN {RECONCILED, DISPUTED, FINALIZED}; Settlement.provisional == false"
        difference: "Splits the actual gross_profit_cents at min(0.75, split_pct + tier_bonus), so the tier bonus exists only in this variant and a store sitting exactly on a tier threshold takes the higher bonus."

  - name: shrink_charge_book_to_physical
    trigger: "POST /shrink-audits/{id}/count (SCHEDULED→COUNTED) and POST /shrink-audits/{id}/finalize (COUNTED→FINALIZED)"
    algorithm: dual_variant
    input_set: "One ShrinkAudit row; physical_inventory_cents is set at count time and may be re-counted before finalize."
    formula: |
      shrink_cents = book_inventory_cents - physical_inventory_cents
      shrink_charge_cents = 0                                        when shrink_cents <= 0
                          = round(shrink_cents * shrink_responsibility_pct, 2)  otherwise
      // The provisional variant uses the shrink_responsibility_pct the agreement carried at count time.
      // The final variant uses the shrink_responsibility_pct the agreement carries at finalize, so a
      // mid-audit agreement amendment moves the charge without touching book_inventory_cents.
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "ShrinkAudit.status == COUNTED"
        difference: "Charge computed from the agreement's shrink_responsibility_pct at count time; an overage (shrink_cents < 0) records charge 0 rather than a credit."
      - name: final
        when: "ShrinkAudit.status == FINALIZED"
        difference: "Charge recomputed from the agreement's shrink_responsibility_pct at finalize, so the same book and physical counts yield a different charge for identical inputs."

  - name: draw_recovery_allocation
    trigger: "POST /settlements/{id}/finalize and the system Settlement → FINALIZED transitions"
    algorithm: waterfall_allocation
    input_set: "Every DrawAdvance with franchisee_id == the settlement's franchisee and status IN {ISSUED, PARTIALLY_RECOVERED}. Nothing is recovered when the settlement's available cash is <= 0."
    formula: |
      remaining_available = max(0, net_settlement_cents)
      For each draw in order (drawn_on ASC, then created_at ASC, never id):
        outstanding = DrawAdvance.amount_cents - DrawAdvance.recovered_cents
        take        = min(outstanding, remaining_available)
        DrawAdvance.recovered_cents += take
        remaining_available -= take
        if remaining_available == 0: stop
      draw_recovery_cents = sum of all `take`
      // Order is pinned to drawn_on then created_at; a tie on both resolves by row insertion order, never by id.
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: rebate_flowthrough
    trigger: "VendorRebate POSTED→APPLIED and VendorRebate APPLIED→RETRACTED"
    algorithm: nested_rounding
    input_set: "One VendorRebate row, its covering FranchiseAgreement, and the RevenueLine rows of the Settlement the rebate lands in (used only to weight the attribution)."
    formula: |
      // Pinned rounding order — the two valid orders in this scaffold differ by a cent and
      // the scaffold pins the per-category order:
      1. weight_cat      = RevenueLine.gross_sales_cents / sum(all RevenueLine.gross_sales_cents) for the settlement
      2. raw_attr_cat    = rebate_cents * weight_cat
      3. attr_cat        = round(raw_attr_cat, 2) for every category, with the last category
                           (SERVICES, then FUEL, then MERCHANDISE in that fixed tie order) absorbing
                           rebate_cents - sum(earlier rounded attributions) so the attributions sum exactly
      4. flow_cat        = round(attr_cat * rebate_pass_pct, 2)          // rounded PER CATEGORY
      5. flowthrough_cents = sum(flow_cat)                                // then summed
      // The forbidden alternative is round(rebate_cents * rebate_pass_pct, 2) applied to the whole
      // rebate at once — for rebate_cents 1234567 across gross-sales weights 8/6/2 million at
      // rebate_pass_pct 0.55 the pinned order yields 679011.86 while the single-round alternative yields 679011.85.
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: per_category_attribution
        when: "the settlement has two or more RevenueLine rows and rebate_pass_pct < 1.0"
        difference: "Attributions are rounded per category and then passed through per category, yielding a cent more or less than a single rounding of the whole rebate."
      - name: single_line
        when: "the settlement has exactly one RevenueLine row, or rebate_pass_pct == 1.0"
        difference: "flowthrough_cents == round(rebate_cents * rebate_pass_pct, 2) exactly, because there is only one attribution to round."

  - name: waste_share_allocation
    trigger: "FreshOrder DELIVERED→RECONCILED and POST /settlements/{id}/reconcile"
    algorithm: circular_ordered
    input_set: "Every FreshOrder with store_id == the settlement's store, status == RECONCILED, and a bound DeliveryWindow whose [window_start, window_end) overlaps the settlement's [period_start, period_end)."
    formula: |
      // Circular-looking dependency with an explicitly pinned evaluation order:
      // the whole-period waste cost is needed to key the tier, and the tier keys the per-line share.
      1. period_waste_cost_cents = sum over in-scope orders of round(FreshOrder.unit_cost_cents * FreshOrder.waste_units, 2)
      2. waste_tier              = keyed on period_waste_cost_cents produced by step 1:
                                     HIGH   when period_waste_cost_cents >= 500000
                                     MEDIUM when period_waste_cost_cents >= 100000
                                     LOW    otherwise
      3. effective_share_pct     = min(0.60, waste_share_pct + tier_adder(waste_tier))
                                     tier_adder(HIGH)=0.05, tier_adder(MEDIUM)=0.02, tier_adder(LOW)=0.00
      4. per order: FreshOrder.line_waste_cents = round(round(unit_cost_cents * waste_units, 2) * effective_share_pct, 2)
      5. Settlement.waste_charge_cents = sum of step 4 across the in-scope orders
      // Step 2 MUST be evaluated from step 1's whole-period total, never from a running per-order figure.
    constants:
      WASTE_TIER_HIGH_THRESHOLD_CENTS: 500000
      WASTE_TIER_MEDIUM_THRESHOLD_CENTS: 100000
      WASTE_TIER_HIGH_ADDER: 0.05
      WASTE_TIER_MEDIUM_ADDER: 0.02
      WASTE_TIER_LOW_ADDER: 0.00
      WASTE_SHARE_PCT_CAP: 0.60
    precision: "2 decimal places, round_half_up"

  - name: franchisee_net_worth
    trigger: "Franchisee creation, draw issuance/recovery, ShrinkAudit finalize, store transfer approval, agreement activate/renew"
    algorithm: aggregation
    input_set: "One Franchisee row plus its DrawAdvance rows in status IN {ISSUED, PARTIALLY_RECOVERED} and its ShrinkAudit rows in status FINALIZED whose charge has not yet been recovered in a FINALIZED Settlement."
    formula: |
      draw_outstanding_cents   = sum(DrawAdvance.amount_cents - DrawAdvance.recovered_cents) for draws in status IN {ISSUED, PARTIALLY_RECOVERED}
      open_shrink_charge_cents = sum(ShrinkAudit.shrink_charge_cents) for FINALIZED audits not yet recovered
      audit_adjusted_net_worth_cents = stated_net_worth_cents - draw_outstanding_cents - open_shrink_charge_cents
      risk_band = A when audit_adjusted_net_worth_cents >= 15000000
                  B when audit_adjusted_net_worth_cents >= 5000000
                  C otherwise
      // Thresholds are inclusive: exactly 15000000 is band A, exactly 5000000 is band B.
    constants:
      RISK_BAND_A_MIN_CENTS: 15000000
      RISK_BAND_B_MIN_CENTS: 5000000
    precision: "integer cents, exact"

  - name: renewal_eligibility
    trigger: "POST /agreements/{id}/open-renewal and POST /agreements/{id}/renew"
    algorithm: weighted_scoring
    input_set: "The FranchiseAgreement being renewed; finalized Settlements for its store whose period falls inside the term; Settlements for its store in status DISPUTED; finalized ShrinkAudits for its store inside the term; the franchisee's audit_adjusted_net_worth_cents."
    formula: |
      // Pinned evaluation order — the provisional score is computed FIRST, the net-worth band is
      // keyed off that provisional score, and only then does net_worth_score consume the band.
      // Evaluating the band off the final score would be circular and is forbidden.
      1. sales_activity_score = 40 when the store has >= 3 finalized Settlements in the term
                                25 when the store has 1 or 2 finalized Settlements in the term
                                10 otherwise
      2. settlement_score     = max(0, 30 - 5 * (count of Settlements for the store in status DISPUTED during the term))
      3. audit_score          = 20 when no finalized ShrinkAudit for the store in the term has shrink_cents > 0
                                10 when at least one does
      4. provisional_score    = sales_activity_score + settlement_score + audit_score   // in [10, 90]
      5. required_net_worth_band = 15000000 when provisional_score >= 75
                                   10000000 when provisional_score >= 55
                                    7500000 otherwise
      6. net_worth_score      = 10 when audit_adjusted_net_worth_cents >= required_net_worth_band
                                 5 when audit_adjusted_net_worth_cents >= minimum_net_worth_cents
                                 0 otherwise
      7. renewal_eligibility_score = clamp(provisional_score + net_worth_score, 0, 100)
      // max = 40 + 30 + 20 + 10 = 100; min = 10 + 0 + 10 + 0 = 20
    constants:
      ELIGIBILITY_OPEN_MIN: 60
      PROVISIONAL_HIGH: 75
      PROVISIONAL_MID: 55
      RENEWAL_NET_WORTH_HIGH_CENTS: 15000000
      RENEWAL_NET_WORTH_MID_CENTS: 10000000
      RENEWAL_NET_WORTH_BASE_CENTS: 7500000
    precision: "integer score 0-100; net worth thresholds exact in cents"
    variants:
      - name: at_open
        when: "POST /agreements/{id}/open-renewal"
        difference: "The final score gates whether RENEWAL_PENDING may be entered at all (>= 60), and required_net_worth_band is derived from the provisional component only."
      - name: at_renew
        when: "POST /agreements/{id}/renew"
        difference: "The same pinned order is re-executed against the then-current settlements and audits, so a dispute filed between open and renew lowers settlement_score and can push the franchisee below the band it previously cleared."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header must be present and name a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: business_referential
    check: "OCC guard — for a write endpoint carrying expected_<parent>_version, the supplied version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /settlements, POST /settlements/{id}/revenue-lines, POST /stores/{id}/transfer-decision"
  - priority: 3
    category: existence
    check: "franchisee_id in the body must reference an existing Franchisee"
    error_id: ERR_FRANCHISEE_NOT_FOUND
    http_status: 404
    applies_to: "POST /settlements, POST /draws, POST /agreements"
  - priority: 4
    category: existence
    check: "store_id in the body must reference an existing Store"
    error_id: ERR_STORE_NOT_FOUND
    http_status: 404
    applies_to: "POST /settlements, POST /agreements, POST /rebates, POST /shrink-audits, POST /delivery-windows, POST /fresh-orders"
  - priority: 5
    category: existence
    check: "every id appearing as a path segment must resolve to an existing resource of the expected type"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path-id endpoints"
  - priority: 6
    category: state
    check: "the target resource must be in the `from:` state named by the transition this endpoint drives"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"
  - priority: 7
    category: business_fiscal
    check: "a forward draw must not push Franchisee.draw_outstanding_cents above 5000000; suspend requires <= 5000000 and terminate requires == 0"
    error_id: ERR_DRAW_EXCEEDS_LIMIT
    http_status: 409
    applies_to: "POST /draws, POST /franchisees/{id}/suspend, POST /franchisees/{id}/terminate"
  - priority: 8
    category: business_safety
    check: "the ordering Store must hold cold_chain_certified == true before any fresh-food order is accepted"
    error_id: ERR_COLD_CHAIN_BROKEN
    http_status: 409
    applies_to: "POST /fresh-orders"
  - priority: 9
    category: business_referential
    check: "the bound DeliveryWindow must be SCHEDULED to accept a new FreshOrder or a confirmation; a delivery requires it to be LOCKED"
    error_id: ERR_WINDOW_LOCKED
    http_status: 409
    applies_to: "POST /franchise/fresh-orders, POST /franchise/fresh-orders/{id}/confirm"
  - priority: 9b
    category: business_referential
    check: "the bound DeliveryWindow must be in status LOCKED before a FreshOrder delivery is accepted"
    error_id: ERR_WINDOW_NOT_LOCKED
    http_status: 409
    applies_to: "POST /franchise/fresh-orders/{id}/deliver"
  - priority: 10
    category: business_temporal
    check: "DeliveryWindow.reserved_units + FreshOrder.ordered_units must be <= DeliveryWindow.capacity_units, inclusive of the exact boundary"
    error_id: ERR_WINDOW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /fresh-orders"
  - priority: 11
    category: business_referential
    check: "every VendorRebate overlapping the settlement period with recommended_vendor == false must be retracted before the settlement reconciles; only recommended-vendor rebates flow through"
    error_id: ERR_VENDOR_NOT_RECOMMENDED
    http_status: 409
    applies_to: "POST /franchise/settlements/{id}/reconcile"
  - priority: 12
    category: business_temporal
    check: "a ShrinkAudit may only finalize once the logical clock has reached its period_end"
    error_id: ERR_AUDIT_PERIOD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /shrink-audits/{id}/finalize"
  - priority: 13
    category: business_referential
    check: "every ShrinkAudit for the store overlapping the settlement period must be FINALIZED before the settlement reconciles"
    error_id: ERR_UNFINALIZED_SHRINK_AUDIT
    http_status: 409
    applies_to: "POST /settlements/{id}/reconcile"
  - priority: 14
    category: business_referential
    check: "every FreshOrder for the store whose delivery window overlaps the settlement period must be RECONCILED or CANCELLED before the settlement reconciles"
    error_id: ERR_UNRECONCILED_FRESH_ORDER
    http_status: 409
    applies_to: "POST /settlements/{id}/reconcile"
  - priority: 15
    category: business_constraint
    check: "a store may not be transferred to a franchisee that already holds an agreement on it, nor to its current operator"
    error_id: ERR_TRANSFER_CONFLICT
    http_status: 409
    applies_to: "POST /stores/{id}/transfer-requests, POST /stores/{id}/transfer-decision"
  - priority: 16
    category: business_fiscal
    check: "the transferee's audit_adjusted_net_worth_cents must be >= the covering agreement's minimum_net_worth_cents"
    error_id: ERR_TRANSFER_NET_WORTH_INSUFFICIENT
    http_status: 409
    applies_to: "POST /stores/{id}/transfer-decision"
  - priority: 17
    category: business_constraint
    check: "the proposed transferee must exist and be in Franchisee.status == ACTIVE"
    error_id: ERR_TRANSFEREE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /stores/{id}/transfer-requests"
  - priority: 18
    category: business_fiscal
    check: "Franchisee.stated_net_worth_cents must be >= FranchiseAgreement.minimum_net_worth_cents to activate; audit_adjusted_net_worth_cents >= 5000000 to reinstate"
    error_id: ERR_MIN_NET_WORTH_NOT_MET
    http_status: 409
    applies_to: "POST /agreements/{id}/activate, POST /franchisees/{id}/reinstate"
  - priority: 19
    category: business_fiscal
    check: "Franchisee.audit_adjusted_net_worth_cents must be >= max(minimum_net_worth_cents, required_net_worth_band[renewal_eligibility_score]) to renew"
    error_id: ERR_RENEWAL_NET_WORTH_INSUFFICIENT
    http_status: 409
    applies_to: "POST /agreements/{id}/renew"
  - priority: 20
    category: business_temporal
    check: "a renewal may only open inside the agreement's renewal window (clock >= term_end - renewal_window_days)"
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /agreements/{id}/open-renewal"
  - priority: 21
    category: business_referential
    check: "renewal_eligibility_score must be >= 60 to open a renewal"
    error_id: ERR_RENEWAL_ELIGIBILITY_FAILED
    http_status: 409
    applies_to: "POST /agreements/{id}/open-renewal"
  - priority: 22
    category: business_referential
    check: "no Settlement for the same store may be in status DISPUTED while a renewal is decided"
    error_id: ERR_OPEN_DISPUTE_BLOCKS_RENEWAL
    http_status: 409
    applies_to: "POST /agreements/{id}/renew"
  - priority: 23
    category: business_constraint
    check: "the settlement's store must have a covering FranchiseAgreement in status IN {ACTIVE, RENEWAL_PENDING}"
    error_id: ERR_NO_OPEN_AGREEMENT
    http_status: 409
    applies_to: "POST /settlements, VendorRebate POSTED→APPLIED, POST /settlements/{id}/finalize"
  - priority: 24
    category: business_constraint
    check: "a draw that already has recovered_cents > 0 may not be reversed"
    error_id: ERR_DRAW_PARTIALLY_RECOVERED
    http_status: 409
    applies_to: "POST /draws/{id}/reverse"
  - priority: 25
    category: business_referential
    check: "an APPLIED rebate may not be retracted once its covering Settlement is FINALIZED"
    error_id: ERR_SETTLEMENT_ALREADY_FINALIZED
    http_status: 409
    applies_to: "POST /rebates/{id}/retract"
  - priority: 26
    category: business_temporal
    check: "a rebate may only be retracted once the logical clock has reached its period_end"
    error_id: ERR_REBATE_RETRACTION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /rebates/{id}/retract"
  - priority: 27
    category: business_temporal
    check: "finalize requires clock >= period_end + 7 days; a franchisee dispute requires clock <= period_end + 14 days"
    error_id: ERR_SETTLEMENT_COOLOFF_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /settlements/{id}/finalize, POST /settlements/{id}/disputes"
  - priority: 28
    category: business_temporal
    check: "a delivery may only be recorded inside the bound window's [window_start, window_end)"
    error_id: ERR_DELIVERY_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "POST /fresh-orders/{id}/deliver"
  - priority: 29
    category: business_temporal
    check: "a delivery window may only lock while clock < window_start - 24 hours"
    error_id: ERR_WINDOW_LOCK_TOO_LATE
    http_status: 409
    applies_to: "POST /delivery-windows/{id}/lock"
  - priority: 30
    category: business_temporal
    check: "a fresh order may only cancel before its window's applicable cut-off (24 hours ahead while PLACED; window_start while CONFIRMED)"
    error_id: ERR_ORDER_CANCEL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /fresh-orders/{id}/cancel"
  - priority: 31
    category: business_referential
    check: "audits must run at least every 31 days — the finalizing audit's period_start must be within 31 days of the store's previous FINALIZED audit period_end"
    error_id: ERR_AUDIT_CADENCE_REQUIRED
    http_status: 409
    applies_to: "POST /shrink-audits/{id}/finalize"
  - priority: 32
    category: business_referential
    check: "an agreement may only advance while its covering store is in status ACTIVE"
    error_id: ERR_STORE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /agreements/{id}/activate, POST /settlements/{id}/reconcile"
  - priority: 33
    category: state
    check: "a settlement may not reconcile without at least one RevenueLine covering the period"
    error_id: ERR_NO_REVENUE_LINES
    http_status: 409
    applies_to: "POST /settlements/{id}/reconcile"
  - priority: 34
    category: auth
    check: "the acting role must be permitted for the endpoint"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 35
    category: auth
    check: "franchisee-scoped endpoints require X-User-ID to equal the owning Franchisee.id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /settlements/{id}/disputes, POST /fresh-orders/{id}/cancel, GET /settlements"
  - priority: 36
    category: business_constraint
    check: "required fields present, enum members valid, numeric ranges sane, no unknown fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH endpoints"
  - priority: 37
    category: business_referential
    check: "at most one VendorRebate per (store_id, vendor_code, period_start) tuple"
    error_id: ERR_VENDOR_REBATE_DUPLICATE
    http_status: 409
    applies_to: "POST /rebates"
  - priority: 38
    category: business_temporal
    check: "a new ShrinkAudit period [period_start, period_end) for the store must not overlap an existing non-cancelled audit; adjacent periods sharing an endpoint are allowed"
    error_id: ERR_AUDIT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /shrink-audits"
  - priority: 39
    category: business_temporal
    check: "a new DeliveryWindow for the same store and commissary must not start inside the 30 minutes following another non-cancelled window's end (handling buffer; abutting windows are rejected)"
    error_id: ERR_WINDOW_HANDLING_OVERLAP
    http_status: 409
    applies_to: "POST /franchise/delivery-windows"
  - priority: 40
    category: business_constraint
    check: "store_number must be unique across all stores"
    error_id: ERR_STORE_NUMBER_DUPLICATE
    http_status: 409
    applies_to: "POST /franchise/stores"

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Franchisee ---
  - method: POST
    path: "/franchise/franchisees"
    description: "Register a franchisee operator with its stated net worth"
    roles: [FranchisorAdmin]
    code: 201
    input: [legal_name, owner_name, "entity_type?", stated_net_worth_cents]
    output: Franchisee
    side_effects:
      - "status → ACTIVE"
      - "draw_outstanding_cents → 0, open_shrink_charge_cents → 0"
      - "audit_adjusted_net_worth_cents = stated_net_worth_cents; risk_band derived"

  - method: GET
    path: "/franchise/franchisees"
    description: "List franchisees with optional status and entity_type filters"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: ["status?", "entity_type?", "limit?", "offset?"]
    output: Franchisee[]
    side_effects: []

  - method: GET
    path: "/franchise/franchisees/{id}"
    description: "Read one franchisee including its derived net-worth fields"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: []
    output: Franchisee
    side_effects: []

  - method: POST
    path: "/franchise/franchisees/{id}/suspend"
    description: "Suspend a franchisee in ACTIVE; cascades every ACTIVE store to TERMINATED"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Franchisee
    side_effects:
      - "status → SUSPENDED"
      - "Cascade: each ACTIVE Store for this franchisee → TERMINATED (hop 1)"
      - "audit_adjusted_net_worth_cents recomputed; increments Franchisee.version by 1"

  - method: POST
    path: "/franchise/franchisees/{id}/reinstate"
    description: "Return a SUSPENDED franchisee to ACTIVE when it holds no open shrink charge and meets the net-worth floor"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Franchisee
    side_effects:
      - "status → ACTIVE"
      - "risk_band re-derived; increments Franchisee.version by 1"

  - method: POST
    path: "/franchise/franchisees/{id}/terminate"
    description: "Terminate a franchisee once it carries no outstanding draw"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Franchisee
    side_effects:
      - "status → TERMINATED"
      - "Cascade: each ACTIVE Store for this franchisee → TERMINATED"
      - "increments Franchisee.version by 1"

  # --- Store ---
  - method: POST
    path: "/franchise/stores"
    description: "Open a store under a franchisee; lease and equipment always rest with the franchisor"
    roles: [FranchisorAdmin]
    code: 201
    input: [franchisee_id, store_number, state_code, format, opened_on, cold_chain_certified]
    output: Store
    side_effects:
      - "status → ACTIVE, transfer_status → NONE"
      - "lease_owner → FRANCHISOR, equipment_owner → FRANCHISOR"
      - "monthly_rent_cents derived from format band"

  - method: GET
    path: "/franchise/stores"
    description: "List stores with franchisee, status and transfer filters"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: ["franchisee_id?", "status?", "transfer_status?", "state_code?", "limit?", "offset?"]
    output: Store[]
    side_effects: []

  - method: GET
    path: "/franchise/stores/{id}"
    description: "Read one store including lease/equipment ownership and transfer state"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: POST
    path: "/franchise/stores/{id}/transfer-requests"
    description: "Open a transfer request naming the proposed transferee and price"
    roles: [FranchisorAdmin]
    code: 200
    input: [transfer_target_franchisee_id, transfer_price_cents]
    output: Store
    side_effects:
      - "transfer_status → PENDING"
      - "increments Store.version by 1"

  - method: POST
    path: "/franchise/stores/{id}/transfer-decision"
    description: "Approve or deny the pending transfer; approval moves the store to the transferee and terminates the incumbent agreement"
    roles: [FranchisorAdmin]
    code: 200
    input: [decision, expected_store_version]
    output: Store
    side_effects:
      - "transfer_status → APPROVED or DENIED"
      - "On APPROVE: franchisee_id → transfer_target_franchisee_id; incumbent FranchiseAgreement rows → TERMINATED"
      - "increments Store.version by 1"

  # --- FranchiseAgreement ---
  - method: POST
    path: "/franchise/agreements"
    description: "Draft a gross-profit-split franchise agreement for a store; royalty_pct is fixed at 0"
    roles: [FranchisorAdmin]
    code: 201
    input: [franchisee_id, store_id, split_pct, waste_share_pct, shrink_responsibility_pct, rebate_pass_pct, minimum_net_worth_cents, term_start, term_end, renewal_window_days]
    output: FranchiseAgreement
    side_effects:
      - "status → DRAFT, royalty_pct → 0.0000, performance_tier → STANDARD"

  - method: GET
    path: "/franchise/agreements"
    description: "List agreements with franchisee and store filters"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: ["franchisee_id?", "store_id?", "status?", "limit?", "offset?"]
    output: FranchiseAgreement[]
    side_effects: []

  - method: GET
    path: "/franchise/agreements/{id}"
    description: "Read one agreement including terms and derived tier"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: []

  - method: POST
    path: "/franchise/agreements/{id}/activate"
    description: "Activate a draft agreement once the store is ACTIVE and the stated net worth clears the floor"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects:
      - "status → ACTIVE"
      - "performance_tier → STANDARD; increments FranchiseAgreement.version by 1"

  - method: POST
    path: "/franchise/agreements/{id}/open-renewal"
    description: "Open the renewal window and compute the renewal eligibility score"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects:
      - "status → RENEWAL_PENDING"
      - "renewal_eligibility_score computed; increments FranchiseAgreement.version by 1"

  - method: POST
    path: "/franchise/agreements/{id}/renew"
    description: "Renew a RENEWAL_PENDING agreement and spawn its DRAFT successor for the new term"
    roles: [FranchisorAdmin]
    code: 200
    input: [new_term_end]
    output: FranchiseAgreement
    side_effects:
      - "status → RENEWED; term_start/term_end advanced"
      - "A successor FranchiseAgreement is created in DRAFT carrying the same split, waste, shrink and rebate percentages"
      - "increments FranchiseAgreement.version by 1"

  - method: POST
    path: "/franchise/agreements/{id}/amend"
    description: "Amend the split, waste, shrink and rebate percentages on a DRAFT or ACTIVE agreement; ACTIVE amendments take effect on the next computation that reads the percentages"
    roles: [FranchisorAdmin]
    code: 200
    input: ["split_pct?", "waste_share_pct?", "shrink_responsibility_pct?", "rebate_pass_pct?", "minimum_net_worth_cents?"]
    output: FranchiseAgreement
    side_effects:
      - "Only the supplied percentage fields change; unspecified fields keep their current values"
      - "increments FranchiseAgreement.version by 1"

  # --- Settlement ---
  - method: POST
    path: "/franchise/settlements"
    description: "Open a weekly settlement period for a store under an ACTIVE agreement"
    roles: [FranchisorAdmin]
    code: 201
    input: [store_id, franchisee_id, period_start, period_end, trailing_avg_gross_profit_cents, expected_store_version]
    output: Settlement
    side_effects:
      - "status → OPEN, provisional → true"
      - "increments Store.version by 1"

  - method: GET
    path: "/franchise/settlements"
    description: "List settlements with store, franchisee and status filters"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: ["store_id?", "franchisee_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: GET
    path: "/franchise/settlements/{id}"
    description: "Read one settlement including every derived split, shrink, waste and draw field"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/franchise/settlements/{id}/revenue-lines"
    description: "Append a merchandise, fuel or services revenue line to a settlement period"
    roles: [FranchisorAdmin]
    code: 201
    input: [category, gross_sales_cents, cost_of_goods_cents, expected_settlement_version]
    output: RevenueLine
    side_effects:
      - "line_gross_profit_cents = gross_sales_cents - cost_of_goods_cents"
      - "increments Settlement.version by 1"

  - method: POST
    path: "/franchise/settlements/{id}/reconcile"
    description: "Advance the settlement one reconciliation step: OPEN → DRAW_PAID applies in-scope rebates; DRAW_PAID → RECONCILED folds in shrink and waste and freezes the split"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "status → DRAW_PAID then RECONCILED"
      - "OPEN→DRAW_PAID cascade hop 1: overlapping POSTED recommended-vendor rebates → APPLIED"
      - "OPEN→DRAW_PAID cascade hop 2: rebate_credit_cents, gross_profit_cents, eligible_split_pct, franchisee_split_cents, franchisor_share_cents recomputed in that order"
      - "OPEN→DRAW_PAID cascade hop 3: covering FranchiseAgreement.performance_tier re-derived — PREMIER at gross_profit_cents >= 20000000, PREFERRED at >= 10000000, else STANDARD"
      - "DRAW_PAID→RECONCILED: shrink_charge_cents and waste_charge_cents folded in; net_settlement_cents frozen; provisional → false"
      - "increments Settlement.version by 1"

  - method: POST
    path: "/franchise/settlements/{id}/finalize"
    description: "Finalize a RECONCILED settlement after the cooling-off period and recover outstanding draws"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "status → FINALIZED"
      - "Draw advances recovered in drawn_on ASC, created_at ASC order; draw statuses updated"
      - "Franchisee.draw_outstanding_cents recomputed; increments Settlement.version by 1"

  - method: POST
    path: "/franchise/settlements/{id}/disputes"
    description: "Franchisee disputes its own reconciled settlement inside the dispute window"
    roles: [Franchisee]
    code: 201
    input: [dispute_reason]
    output: Settlement
    side_effects:
      - "status → DISPUTED; dispute_reason recorded; increments Settlement.version by 1"

  - method: POST
    path: "/franchise/settlements/{id}/resolve-dispute"
    description: "Clear a dispute and recompute the waste and net settlement under the resolved percentages"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "status → RECONCILED"
      - "waste_charge_cents and net_settlement_cents recomputed; increments Settlement.version by 1"

  # --- RevenueLine ---
  - method: GET
    path: "/franchise/revenue-lines"
    description: "List revenue lines, optionally filtered to one settlement"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: ["settlement_id?", "category?", "limit?", "offset?"]
    output: RevenueLine[]
    side_effects: []

  - method: GET
    path: "/franchise/revenue-lines/{id}"
    description: "Read one revenue line"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: []
    output: RevenueLine
    side_effects: []

  # --- DrawAdvance ---
  - method: POST
    path: "/franchise/draws"
    description: "Advance a draw against a franchisee's future settlements"
    roles: [FranchisorAdmin]
    code: 201
    input: [franchisee_id, store_id, amount_cents, drawn_on]
    output: DrawAdvance
    side_effects:
      - "status → ISSUED, recovered_cents → 0"
      - "Franchisee.draw_outstanding_cents recomputed"

  - method: GET
    path: "/franchise/draws"
    description: "List draw advances with franchisee, store and status filters"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: ["franchisee_id?", "store_id?", "status?", "limit?", "offset?"]
    output: DrawAdvance[]
    side_effects: []

  - method: GET
    path: "/franchise/draws/{id}"
    description: "Read one draw advance"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: []
    output: DrawAdvance
    side_effects: []

  - method: POST
    path: "/franchise/draws/{id}/reverse"
    description: "Reverse an unrecovered draw advance"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: DrawAdvance
    side_effects:
      - "status → REVERSED"
      - "Franchisee.draw_outstanding_cents recomputed; increments DrawAdvance.version by 1"

  # --- VendorRebate ---
  - method: POST
    path: "/franchise/rebates"
    description: "Post a vendor rebate for a store and period, flagging whether the vendor is a recommended vendor"
    roles: [FranchisorAdmin]
    code: 201
    input: [store_id, vendor_name, vendor_code, recommended_vendor, rebate_cents, period_start, period_end]
    output: VendorRebate
    side_effects:
      - "status → POSTED, flowthrough_cents → 0"

  - method: GET
    path: "/franchise/rebates"
    description: "List rebates with store, status and recommended-vendor filters"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: ["store_id?", "status?", "recommended_vendor?", "limit?", "offset?"]
    output: VendorRebate[]
    side_effects: []

  - method: GET
    path: "/franchise/rebates/{id}"
    description: "Read one rebate including its flow-through amount"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: []
    output: VendorRebate
    side_effects: []

  - method: POST
    path: "/franchise/rebates/{id}/retract"
    description: "Retract a posted or applied rebate before its settlement finalizes"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: VendorRebate
    side_effects:
      - "status → RETRACTED, flowthrough_cents → 0"
      - "On retracting an APPLIED rebate: covering Settlement.rebate_credit_cents, gross_profit_cents, eligible_split_pct, franchisee_split_cents, franchisor_share_cents recomputed in that order"
      - "increments VendorRebate.version by 1"

  # --- ShrinkAudit ---
  - method: POST
    path: "/franchise/shrink-audits"
    description: "Schedule a book-to-physical shrink audit for a store period"
    roles: [FranchisorAdmin]
    code: 201
    input: [store_id, period_start, period_end, book_inventory_cents]
    output: ShrinkAudit
    side_effects:
      - "status → SCHEDULED"

  - method: GET
    path: "/franchise/shrink-audits"
    description: "List shrink audits with store and status filters"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: ShrinkAudit[]
    side_effects: []

  - method: GET
    path: "/franchise/shrink-audits/{id}"
    description: "Read one shrink audit including shrink and charge amounts"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: []
    output: ShrinkAudit
    side_effects: []

  - method: POST
    path: "/franchise/shrink-audits/{id}/count"
    description: "Record a physical count (SCHEDULED → COUNTED) or re-count an already counted audit (COUNTED → SCHEDULED)"
    roles: [FieldAuditor]
    code: 200
    input: [physical_inventory_cents, recount]
    output: ShrinkAudit
    side_effects:
      - "SCHEDULED→COUNTED: status → COUNTED; shrink_cents and provisional shrink_charge_cents set"
      - "COUNTED→SCHEDULED: status → SCHEDULED; physical_inventory_cents, shrink_cents and shrink_charge_cents cleared"
      - "increments ShrinkAudit.version by 1"

  - method: POST
    path: "/franchise/shrink-audits/{id}/finalize"
    description: "Finalize a counted audit after its period closes and the cadence rule holds"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: ShrinkAudit
    side_effects:
      - "status → FINALIZED; final shrink_charge_cents computed"
      - "Franchisee.open_shrink_charge_cents, audit_adjusted_net_worth_cents recomputed; risk_band re-derived"
      - "increments ShrinkAudit.version by 1"

  # --- DeliveryWindow ---
  - method: POST
    path: "/franchise/delivery-windows"
    description: "Publish a commissary delivery window with finite capacity for a store"
    roles: [FranchisorAdmin]
    code: 201
    input: [store_id, commissary_code, day_of_week, window_start, window_end, capacity_units]
    output: DeliveryWindow
    side_effects:
      - "status → SCHEDULED, reserved_units → 0"

  - method: GET
    path: "/franchise/delivery-windows"
    description: "List delivery windows with store, status and weekday filters"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: ["store_id?", "status?", "day_of_week?", "limit?", "offset?"]
    output: DeliveryWindow[]
    side_effects: []

  - method: GET
    path: "/franchise/delivery-windows/{id}"
    description: "Read one delivery window including reserved capacity"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: []
    output: DeliveryWindow
    side_effects: []

  - method: POST
    path: "/franchise/delivery-windows/{id}/lock"
    description: "Lock a window 24 hours ahead of its start so no further orders may be booked"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: DeliveryWindow
    side_effects:
      - "status → LOCKED; increments DeliveryWindow.version by 1"

  # --- FreshOrder ---
  - method: POST
    path: "/franchise/fresh-orders"
    description: "Book fresh-food units into a scheduled delivery window; requires a cold-chain-certified store and capacity"
    roles: [Franchisee]
    code: 201
    input: [store_id, delivery_window_id, sku_code, ordered_units, unit_cost_cents]
    output: FreshOrder
    side_effects:
      - "status → PLACED"
      - "bound DeliveryWindow.reserved_units increases by ordered_units"
      - "increments DeliveryWindow.version by 1"

  - method: GET
    path: "/franchise/fresh-orders"
    description: "List fresh orders with store, delivery-window and status filters"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: ["store_id?", "delivery_window_id?", "status?", "limit?", "offset?"]
    output: FreshOrder[]
    side_effects: []

  - method: GET
    path: "/franchise/fresh-orders/{id}"
    description: "Read one fresh order including its waste share"
    roles: [FranchisorAdmin, Franchisee]
    code: 200
    input: []
    output: FreshOrder
    side_effects: []

  - method: POST
    path: "/franchise/fresh-orders/{id}/confirm"
    description: "Commissary confirms a placed order"
    roles: [Commissary]
    code: 200
    input: []
    output: FreshOrder
    side_effects:
      - "status → CONFIRMED; increments FreshOrder.version by 1"

  - method: POST
    path: "/franchise/fresh-orders/{id}/deliver"
    description: "Record delivery inside the locked window"
    roles: [Commissary]
    code: 200
    input: [delivered_units]
    output: FreshOrder
    side_effects:
      - "status → DELIVERED; increments FreshOrder.version by 1"

  - method: POST
    path: "/franchise/fresh-orders/{id}/reconcile"
    description: "Reconcile delivered units against waste and release the window capacity"
    roles: [FranchisorAdmin]
    code: 200
    input: [waste_units]
    output: FreshOrder
    side_effects:
      - "status → RECONCILED"
      - "line_waste_cents and waste_share_cents computed under waste_share_allocation"
      - "bound DeliveryWindow.reserved_units decreases by ordered_units"
      - "covering Settlement.waste_charge_cents and net_settlement_cents recomputed when the settlement is DRAW_PAID or RECONCILED"
      - "increments FreshOrder.version by 1"

  - method: POST
    path: "/franchise/fresh-orders/{id}/cancel"
    description: "Store cancels its own fresh order before the cut-off, releasing capacity"
    roles: [Franchisee]
    code: 200
    input: []
    output: FreshOrder
    side_effects:
      - "status → CANCELLED"
      - "bound DeliveryWindow.reserved_units decreases by ordered_units"
      - "Cascade: every Settlement for the store in {OPEN, DRAW_PAID} → FINALIZED, which recovers draws"
      - "increments FreshOrder.version by 1"

  # --- Test-driving ---
  - method: POST
    path: "/franchise/_clock/set_current_utc"
    description: "Set the logical clock used by every window, cadence and cooling-off rule. Before the first call the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [FranchisorAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "Server logical clock is set to current_utc"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header is missing or does not name a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "The acting role is not permitted for this endpoint, or the count/finalize split is violated" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "A franchisee-scoped call carries an X-User-ID that is not the owning Franchisee.id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, unknown field supplied, enum member invalid, or numeric range violated" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_FRANCHISEE_NOT_FOUND, http: 404, condition: "franchisee_id references no Franchisee" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "store_id references no Store" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A path-segment id resolves to no resource of the expected type" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in the `from:` state of the transition the endpoint drives" }
  - { id: ERR_DRAW_EXCEEDS_LIMIT, http: 409, condition: "The draw would push draw_outstanding_cents above 5000000, or suspend/terminate is attempted with an outstanding draw" }
  - { id: ERR_WINDOW_CAPACITY_EXCEEDED, http: 409, condition: "reserved_units + ordered_units exceeds the delivery window's capacity_units" }
  - { id: ERR_WINDOW_LOCKED, http: 409, condition: "The bound delivery window is LOCKED for a new order, or not SCHEDULED for a confirmation" }
  - { id: ERR_WINDOW_NOT_LOCKED, http: 409, condition: "A delivery is recorded against a delivery window that is not LOCKED" }
  - { id: ERR_COLD_CHAIN_BROKEN, http: 409, condition: "The ordering store has cold_chain_certified == false" }
  - { id: ERR_VENDOR_NOT_RECOMMENDED, http: 409, condition: "A rebate from a non-recommended vendor was presented for application to a settlement" }
  - { id: ERR_AUDIT_PERIOD_NOT_CLOSED, http: 409, condition: "A shrink audit is finalized before the logical clock reaches its period_end" }
  - { id: ERR_AUDIT_CADENCE_REQUIRED, http: 409, condition: "The audit's period_start is more than 31 days after the store's previous FINALIZED audit period_end" }
  - { id: ERR_AUDIT_PERIOD_OVERLAP, http: 409, condition: "The new audit period overlaps an existing non-cancelled audit for the same store" }
  - { id: ERR_UNFINALIZED_SHRINK_AUDIT, http: 409, condition: "A settlement is reconciled while an overlapping shrink audit is not FINALIZED" }
  - { id: ERR_UNRECONCILED_FRESH_ORDER, http: 409, condition: "A settlement is reconciled while an overlapping fresh order is neither RECONCILED nor CANCELLED" }
  - { id: ERR_TRANSFER_CONFLICT, http: 409, condition: "The transferee already holds an agreement on the store, or is the store's current operator" }
  - { id: ERR_TRANSFER_NET_WORTH_INSUFFICIENT, http: 409, condition: "The transferee's audit_adjusted_net_worth_cents is below the covering agreement's minimum_net_worth_cents" }
  - { id: ERR_TRANSFEREE_NOT_ELIGIBLE, http: 409, condition: "The proposed transferee does not exist or is not in Franchisee.status == ACTIVE" }
  - { id: ERR_MIN_NET_WORTH_NOT_MET, http: 409, condition: "stated_net_worth_cents is below minimum_net_worth_cents at activation, or audit_adjusted_net_worth_cents is below 5000000 at reinstatement" }
  - { id: ERR_RENEWAL_NET_WORTH_INSUFFICIENT, http: 409, condition: "audit_adjusted_net_worth_cents is below the required renewal net-worth band for the computed eligibility score" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 409, condition: "A renewal is opened before term_end - renewal_window_days" }
  - { id: ERR_RENEWAL_ELIGIBILITY_FAILED, http: 409, condition: "renewal_eligibility_score is below 60" }
  - { id: ERR_OPEN_DISPUTE_BLOCKS_RENEWAL, http: 409, condition: "A settlement for the same store is in status DISPUTED at renewal" }
  - { id: ERR_NO_OPEN_AGREEMENT, http: 409, condition: "The store has no FranchiseAgreement in status IN {ACTIVE, RENEWAL_PENDING}" }
  - { id: ERR_DRAW_PARTIALLY_RECOVERED, http: 409, condition: "A draw with recovered_cents > 0 is presented for reversal" }
  - { id: ERR_SETTLEMENT_ALREADY_FINALIZED, http: 409, condition: "An applied rebate is retracted after its covering settlement reached FINALIZED" }
  - { id: ERR_REBATE_RETRACTION_WINDOW_CLOSED, http: 409, condition: "A rebate is retracted before the logical clock reaches its period_end" }
  - { id: ERR_SETTLEMENT_COOLOFF_NOT_ELAPSED, http: 409, condition: "Finalize attempted before period_end + 7 days, or a dispute filed after period_end + 14 days" }
  - { id: ERR_DELIVERY_OUTSIDE_WINDOW, http: 409, condition: "A delivery is recorded outside the bound window's [window_start, window_end)" }
  - { id: ERR_WINDOW_LOCK_TOO_LATE, http: 409, condition: "A window is locked inside the 24 hours before its start" }
  - { id: ERR_ORDER_CANCEL_WINDOW_CLOSED, http: 409, condition: "A fresh order is cancelled after its applicable cut-off" }
  - { id: ERR_STORE_NOT_ACTIVE, http: 409, condition: "An agreement or settlement advances while its store is not ACTIVE" }
  - { id: ERR_NO_REVENUE_LINES, http: 409, condition: "A settlement reconciles with no revenue line covering its period" }
  - { id: ERR_VENDOR_REBATE_DUPLICATE, http: 409, condition: "A second rebate is posted for the same store, vendor code and period start" }
  - { id: ERR_STORE_NUMBER_DUPLICATE, http: 409, condition: "store_number is already used by another store" }
  - { id: ERR_WINDOW_HANDLING_OVERLAP, http: 409, condition: "A new delivery window for the same store and commissary starts inside the 30-minute handling buffer after another non-cancelled window" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FranchisorAdmin
    description: "Franchisor back-office operator: onboards franchisees and stores, drafts and renews agreements, runs settlements, audits, rebates and transfers"
    identity: opaque
    exclusive_operations:
      - "POST /franchisees, POST /franchisees/{id}/suspend, POST /franchisees/{id}/reinstate, POST /franchisees/{id}/terminate"
      - "POST /stores, POST /stores/{id}/transfer-requests, POST /stores/{id}/transfer-decision"
      - "POST /agreements, POST /agreements/{id}/activate, POST /agreements/{id}/open-renewal, POST /agreements/{id}/renew"
      - "POST /settlements, POST /settlements/{id}/revenue-lines, POST /settlements/{id}/reconcile, POST /settlements/{id}/finalize, POST /settlements/{id}/resolve-dispute"
      - "POST /draws, POST /draws/{id}/reverse, POST /rebates, POST /rebates/{id}/retract"
      - "POST /shrink-audits, POST /shrink-audits/{id}/finalize, POST /delivery-windows, POST /delivery-windows/{id}/lock"
      - "POST /fresh-orders/{id}/reconcile, POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints except none — reads are shared with Franchisee and Commissary where declared"

  - name: Franchisee
    description: "Store operator: books and cancels fresh orders, disputes its own settlements, reads its own franchise data"
    identity: entity_backed:Franchisee
    exclusive_operations:
      - "POST /settlements/{id}/disputes"
      - "POST /fresh-orders"
      - "POST /fresh-orders/{id}/cancel"
    shared_operations:
      - "GET /franchisees, GET /franchisees/{id}, GET /stores, GET /stores/{id}"
      - "GET /agreements, GET /agreements/{id}, GET /settlements, GET /settlements/{id}"
      - "GET /revenue-lines, GET /revenue-lines/{id}, GET /draws, GET /draws/{id}"
      - "GET /rebates, GET /rebates/{id}, GET /shrink-audits, GET /shrink-audits/{id}"
      - "GET /delivery-windows, GET /delivery-windows/{id}, GET /fresh-orders, GET /fresh-orders/{id}"

  - name: FieldAuditor
    description: "Independent field auditor who records physical counts; deliberately cannot finalize the audit it counted"
    identity: opaque
    exclusive_operations:
      - "POST /shrink-audits/{id}/count"
    shared_operations:
      - "GET /shrink-audits, GET /shrink-audits/{id}, GET /stores/{id}"

  - name: Commissary
    description: "Commissary dispatch desk: confirms and delivers fresh-food orders against locked windows"
    identity: opaque
    exclusive_operations:
      - "POST /fresh-orders/{id}/confirm"
      - "POST /fresh-orders/{id}/deliver"
    shared_operations:
      - "GET /fresh-orders, GET /fresh-orders/{id}, GET /delivery-windows, GET /delivery-windows/{id}"