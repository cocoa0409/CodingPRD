# =============================================================================
# PRD Benchmark Scaffold — task_1396_real_estate_brokerage_commission_agent
# Real Estate Brokerage Commission & Agent Split Accounting (KW-style)
# =============================================================================

scenario: |
  Real Estate Brokerage Commission & Agent Split Accounting (Keller Williams
  style brokerage): commission plan tiers & annual cap/anniversary reset,
  transaction fee, franchise fee & E&O deduction sequence, co-broke split &
  referral fee payout, team lead override & mentor splits, escrow disbursement
  authorization & trust accounting, 1099 reporting for independent contractors,
  agent debit balance & recovery, plan change effective dating

domain_name: real-estate-brokerage-commission
api_prefix: /brokerage

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - rate_threshold_triggers        # tier thresholds, company-dollar cap, royalty cap, 1099 $600 threshold
    - cascading_side_effects         # settle -> legs/ledger/accumulators -> later-deal recovery
    - dual_variant_calculation       # provisional payout estimate vs posted settlement; cash vs accrual 1099
    - optimistic_concurrency         # OCC on Agent.version (enrollment supersede, agent patch) and Plan.version
  entity_topology: flat              # peer entities joined by FK references; no nested ownership tree
  state_machine_shape: cyclic        # Deal DRAFT<->PENDING_CLOSING and CLOSED<->SETTLED loops; Agent ACTIVE<->SUSPENDED
  relationship_patterns:
    - one_to_many                    # Agent -> Deal/Enrollment/LedgerEntry/TaxForm1099; Settlement -> DisbursementLeg
    - self_referential               # Agent.mentor_agent_id, Agent.team_lead_agent_id
    - cross_aggregate                # Settlement pins PlanEnrollment + anniversary window; Legs pay other Agents
  role_model: segregation_of_duties  # settlement poster cannot authorize; authorizer cannot release
  consistency_model: immediate       # all cascades atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
# Date fields ("date") are ISO YYYY-MM-DD calendar dates. The logical clock
# (POST /brokerage/_clock/set_current_utc) is an ISO-8601 UTC datetime; its
# "clock date" is the UTC calendar date of the current clock instant.
entities:
  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Agent legal full name" }
      - { name: email, type: string, source: input, description: "Agent contact email" }
      - { name: license_number, type: string, source: input, description: "State license number; unique across all agents" }
      - { name: joined_at, type: string, source: input, description: "Date agent joined (YYYY-MM-DD); immutable after creation; anchors anniversary windows" }
      - { name: mentor_agent_id, type: string, source: input, default: null, description: "FK -> Agent.id; mentor who receives mentor splits on this agent's early deals; null = no mentor" }
      - { name: team_lead_agent_id, type: string, source: input, default: null, description: "FK -> Agent.id; team lead who receives team overrides on this agent's deals; null = not on a team" }
      - { name: team_override_pct, type: number, source: input, default: 0, description: "Fraction of agent_gross_cents paid to team lead per settled deal (e.g. 0.10); ignored when team_lead_agent_id is null" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: debit_balance_cents, type: integer, source: computed, default: 0, description: "Amount agent owes the brokerage; equals sum of all LedgerEntry.amount_cents for this agent; floor 0" }
      - { name: settled_deal_count, type: integer, source: system, default: 0, description: "Count of settlements currently POSTED for this agent (incremented at settle, decremented at unsettle); drives mentor eligibility" }

  - name: CommissionPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan display name" }
      - { name: royalty_pct, type: number, source: input, description: "Franchise royalty fraction of adjusted commission (e.g. 0.06)" }
      - { name: royalty_cap_cents, type: integer, source: input, description: "Maximum royalty an agent pays per anniversary window under this plan" }
      - { name: eo_fee_cents, type: integer, source: input, description: "Flat errors-and-omissions insurance fee deducted per settled deal" }
      - { name: transaction_fee_cents, type: integer, source: input, description: "Flat transaction/desk fee deducted per settled deal" }
      - { name: mentor_split_pct, type: number, source: input, default: 0, description: "Fraction of agent_gross_cents paid to the mentor while the agent is within their first mentor_deal_count settled deals" }
      - { name: mentor_deal_count, type: integer, source: input, default: 0, description: "Number of an agent's settled deals (by settled_deal_count at settle time) to which the mentor split applies; 0 disables mentor split" }
      - { name: tiers, type: array, source: input, description: "Ordered tier list; each element {threshold_company_dollar_cents: integer, broker_split_pct: number}; strictly ascending thresholds; the final element MUST have broker_split_pct 0 (the capped tier); a tier's threshold is the cumulative company-dollar accrued at which that tier ends (exclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }

  - name: PlanEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; enrolled agent" }
      - { name: plan_id, type: string, source: input, description: "FK -> CommissionPlan.id; plan being enrolled into" }
      - { name: plan_version, type: integer, source: system, description: "CommissionPlan.version pinned at enrollment creation; the plan definition as-of enrollment" }
      - { name: effective_from, type: string, source: input, description: "Date (YYYY-MM-DD) this enrollment begins covering deals; must be strictly after the agent's current enrollment's effective_from" }
      - { name: effective_to, type: string, source: system, default: null, description: "Date coverage ends (exclusive); null = open-ended; set when superseded or ended" }
      - { name: status, type: enum, source: system, description: "SCHEDULED (effective_from in the future) | ACTIVE | SUPERSEDED | ENDED | CANCELLED" }

  - name: AnniversaryPeriod
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; owning agent" }
      - { name: window_index, type: integer, source: system, description: "0-based index of the anniversary window (0 = [joined_at, joined_at+1yr))" }
      - { name: window_start, type: string, source: system, description: "Window start date (inclusive): joined_at advanced by window_index years (Feb-29 joins start Mar-01 in non-leap years)" }
      - { name: window_end, type: string, source: system, description: "Window end date (exclusive): window_start of the next window" }
      - { name: company_dollar_accrued_cents, type: integer, source: computed, default: 0, description: "Company dollar accrued to this window from POSTED settlements (settlement-time accumulation)" }
      - { name: royalty_accrued_cents, type: integer, source: computed, default: 0, description: "Royalty accrued to this window from POSTED settlements" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; CLOSED when the clock date reaches window_end (books closed for that anniversary year)" }

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; primary (credited) agent on the deal" }
      - { name: address, type: string, source: input, description: "Property address" }
      - { name: gross_commission_cents, type: integer, source: input, description: "Total commission payable to the brokerage for this deal (> 0)" }
      - { name: closing_date, type: string, source: input, description: "Actual or expected closing date (YYYY-MM-DD); determines the anniversary window and the effective enrollment" }
      - { name: cobroke_payout_cents, type: integer, source: input, default: 0, description: "Amount owed to an outside co-broke brokerage, paid off the top; must be < gross_commission_cents" }
      - { name: cobroke_payee_name, type: string, source: input, default: null, description: "Outside brokerage payee name; required when cobroke_payout_cents > 0" }
      - { name: referral_pct, type: number, source: input, default: 0, description: "Fraction of the post-cobroke net paid as a referral fee (0..1); required > 0 when referral_agent_id is set" }
      - { name: referral_agent_id, type: string, source: input, default: null, description: "FK -> Agent.id; in-house agent who referred the deal; must differ from agent_id; null = no referral" }
      - { name: trust_received_cents, type: integer, source: system, default: 0, description: "Commission funds received into the trust account at closing; equals gross_commission_cents once CLOSED" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_CLOSING | CLOSED | SETTLED | DISBURSED | FELL_THROUGH | VOIDED" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; settled deal; at most one non-REVERSED settlement per deal" }
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; deal's primary agent (denormalized)" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> PlanEnrollment.id; enrollment whose [effective_from, effective_to) window contains closing_date" }
      - { name: plan_version_used, type: integer, source: system, description: "Plan version whose terms were applied (from enrollment.plan_version)" }
      - { name: window_start, type: string, source: system, description: "Anniversary window start (informational) the settlement posted to" }
      - { name: gross_commission_cents, type: integer, source: computed, description: "Gross commission the schedule was computed from" }
      - { name: cobroke_payout_cents, type: integer, source: computed, description: "Step 1: co-broke payout off the top" }
      - { name: net_office_commission_cents, type: integer, source: computed, description: "gross - cobroke" }
      - { name: referral_fee_cents, type: integer, source: computed, description: "Step 2: round_half_up(referral_pct * net_office_commission_cents)" }
      - { name: adjusted_commission_cents, type: integer, source: computed, description: "net_office_commission_cents - referral_fee_cents" }
      - { name: royalty_cents, type: integer, source: computed, description: "Step 3: min(round_half_up(royalty_pct * adjusted), royalty cap room in window)" }
      - { name: royalty_capped, type: boolean, source: computed, description: "True when the royalty cap clipped step 3" }
      - { name: after_royalty_cents, type: integer, source: computed, description: "adjusted_commission_cents - royalty_cents" }
      - { name: tier_index_applied, type: integer, source: computed, description: "Index into plan tiers used for the split (first tier with threshold > accrued company dollar)" }
      - { name: company_dollar_cents, type: integer, source: computed, description: "Step 4: min(round_half_up(after_royalty * broker_split_pct), tier cap room)" }
      - { name: cap_clipped, type: boolean, source: computed, description: "True when the tier cap clipped step 4 (the capping transaction)" }
      - { name: agent_gross_cents, type: integer, source: computed, description: "after_royalty_cents - company_dollar_cents" }
      - { name: mentor_split_cents, type: integer, source: computed, description: "Step 5: round_half_up(mentor_split_pct * agent_gross) when mentor eligible, else 0" }
      - { name: mentor_applied, type: boolean, source: computed, description: "True when the mentor split applied to this settlement" }
      - { name: mentor_agent_id, type: string, source: system, description: "Mentor snapshot at settle time (informational); null when no mentor applied" }
      - { name: team_override_cents, type: integer, source: computed, description: "Step 6: round_half_up(team_override_pct * agent_gross) when on a team, else 0" }
      - { name: team_lead_agent_id, type: string, source: system, description: "Team lead snapshot at settle time (informational); null when no override applied" }
      - { name: eo_fee_cents, type: integer, source: computed, description: "Step 7: E&O actually deducted (clipped by remaining agent share)" }
      - { name: transaction_fee_cents, type: integer, source: computed, description: "Step 8: transaction fee actually deducted (clipped by remaining agent share)" }
      - { name: fee_shortfall_cents, type: integer, source: computed, description: "Undeducted E&O + transaction fee shortfall; accrued to the agent's debit balance" }
      - { name: debit_recovery_cents, type: integer, source: computed, description: "Step 9: min(remaining agent share after fees, agent debit balance) swept to the company" }
      - { name: agent_net_cents, type: integer, source: computed, description: "Cash payable to the agent: agent_gross - mentor - team_override - eo - txn_fee - debit_recovery" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED" }
      - { name: posted_by_user_id, type: string, source: system, description: "X-User-ID that posted the settlement; segregation-of-duties anchor" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock timestamp when posted" }
      - { name: reversed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when reversed; null while POSTED" }

  - name: DisbursementLeg
    parent: null
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id; settlement this leg pays out from" }
      - { name: payee_type, type: enum, source: system, description: "AGENT | MENTOR | TEAM_LEAD | REFERRAL | CO_BROKE | ROYALTY | COMPANY" }
      - { name: payee_agent_id, type: string, source: system, default: null, description: "FK -> Agent.id; payee for AGENT/MENTOR/TEAM_LEAD/REFERRAL legs; null for CO_BROKE/ROYALTY/COMPANY" }
      - { name: payee_name, type: string, source: system, default: null, description: "Free-text payee for CO_BROKE legs (cobroke_payee_name), 'FRANCHISE' for ROYALTY, 'COMPANY' for COMPANY" }
      - { name: amount_cents, type: integer, source: computed, description: "Leg amount (> 0; zero-amount legs are never created)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | AUTHORIZED | RELEASED | VOIDED" }
      - { name: authorized_by_user_id, type: string, source: system, default: null, description: "X-User-ID that authorized the leg; release must be performed by a different user" }
      - { name: authorized_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of authorization" }
      - { name: released_by_user_id, type: string, source: system, default: null, description: "X-User-ID that released the leg" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of release; the cash-basis tax timestamp for 1099" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; agent whose debit balance this entry moves" }
      - { name: deal_id, type: string, source: system, default: null, description: "FK -> Deal.id; originating deal for settlement-driven entries; null for manual adjustments" }
      - { name: settlement_id, type: string, source: system, default: null, description: "Originating settlement id (informational join field); null for manual adjustments" }
      - { name: entry_type, type: enum, source: system, description: "FEE_SHORTFALL_ACCRUAL | FEE_SHORTFALL_REVERSAL | DEBIT_RECOVERY | DEBIT_RECOVERY_REVERSAL | MANUAL_DEBIT | DEBIT_WRITE_OFF" }
      - { name: amount_cents, type: integer, source: system, description: "Signed movement: positive increases the agent's debit balance, negative decreases it" }
      - { name: resulting_balance_cents, type: integer, source: system, description: "Agent debit_balance_cents immediately after this entry (running balance)" }
      - { name: reason, type: string, source: system, default: null, description: "Human reason for MANUAL_DEBIT / DEBIT_WRITE_OFF entries" }

  - name: TaxForm1099
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; recipient independent contractor" }
      - { name: tax_year, type: integer, source: input, description: "Calendar year being reported" }
      - { name: gross_paid_cents, type: integer, source: computed, description: "Cash basis: sum of RELEASED leg amounts payable to this agent with released_at inside [tax_year-01-01, tax_year+1-01-01)" }
      - { name: accrual_gross_cents, type: integer, source: computed, description: "Accrual basis (informational): agent_gross_cents of own settlements posted in the year + amounts of MENTOR/TEAM_LEAD/REFERRAL legs payable to this agent created in the year" }
      - { name: filing_required, type: boolean, source: computed, description: "gross_paid_cents >= 60000 (the $600 reporting threshold, inclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | VOIDED" }

  - name: TrustTransaction
    parent: null
    common_fields: false
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; deal whose trust funds move" }
      - { name: kind, type: enum, source: system, description: "RECEIPT (at closing) | RECEIPT_REVERSAL (at void) | RELEASE (at leg release)" }
      - { name: amount_cents, type: integer, source: system, description: "Signed: +gross on RECEIPT, -gross on RECEIPT_REVERSAL, -leg.amount on RELEASE" }
      - { name: disbursement_leg_id, type: string, source: system, default: null, description: "Related disbursement leg id for RELEASE entries (informational join field); null otherwise" }
      - { name: trust_balance_after_cents, type: integer, source: system, description: "Global trust balance immediately after this transaction (sum of all amounts to date)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Agent
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /brokerage/agents/{agentId}/activate"
        actor: BrokerAdmin
        preconditions: ["agent.status == ONBOARDING"]
        side_effects: ["Agent.version increments by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /brokerage/agents/{agentId}/suspend"
        actor: BrokerAdmin
        preconditions: ["agent.status == ACTIVE"]
        side_effects: ["Agent.version increments by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /brokerage/agents/{agentId}/reinstate"
        actor: BrokerAdmin
        preconditions: ["agent.status == SUSPENDED"]
        side_effects: ["Agent.version increments by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /brokerage/agents/{agentId}/terminate"
        actor: BrokerAdmin
        preconditions:
          - "agent.status == ACTIVE"
          - "no Deal of this agent in {DRAFT, PENDING_CLOSING} (else ERR_AGENT_HAS_OPEN_DEALS)"
        side_effects:
          - "Agent.version increments by 1"
          - "this agent's ACTIVE PlanEnrollment -> ENDED with effective_to = termination date (clock date)"
          - "this agent's SCHEDULED PlanEnrollment (if any) -> CANCELLED with effective_to = its effective_from (zero-length)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /brokerage/agents/{agentId}/terminate"
        actor: BrokerAdmin
        preconditions:
          - "agent.status == SUSPENDED"
          - "no Deal of this agent in {DRAFT, PENDING_CLOSING} (else ERR_AGENT_HAS_OPEN_DEALS)"
        side_effects:
          - "Agent.version increments by 1"
          - "this agent's ACTIVE PlanEnrollment -> ENDED with effective_to = termination date (clock date)"
          - "this agent's SCHEDULED PlanEnrollment (if any) -> CANCELLED with effective_to = its effective_from (zero-length)"
      - from: ONBOARDING
        to: TERMINATED
        trigger: "POST /brokerage/agents/{agentId}/terminate"
        actor: BrokerAdmin
        preconditions:
          - "agent.status == ONBOARDING"
          - "no Deal of this agent in {DRAFT, PENDING_CLOSING} (always true: non-ACTIVE agents cannot create deals)"
        side_effects: ["Agent.version increments by 1"]

  - entity: CommissionPlan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /brokerage/plans/{planId}/activate"
        actor: BrokerAdmin
        preconditions: ["plan.status == DRAFT"]
        side_effects: ["CommissionPlan.version increments by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /brokerage/plans/{planId}/retire"
        actor: BrokerAdmin
        preconditions:
          - "plan.status == ACTIVE"
          - "no PlanEnrollment references this plan with status in {ACTIVE, SCHEDULED} (else ERR_PLAN_IN_USE)"
        side_effects: ["CommissionPlan.version increments by 1"]
      - from: DRAFT
        to: RETIRED
        trigger: "POST /brokerage/plans/{planId}/retire"
        actor: BrokerAdmin
        preconditions: ["plan.status == DRAFT"]
        side_effects: ["CommissionPlan.version increments by 1"]

  - entity: PlanEnrollment
    initial_state: SCHEDULED
    terminal_states: [SUPERSEDED, ENDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system clock sweep (POST /brokerage/_clock/set_current_utc crossing effective_from) or inline at creation when effective_from <= clock date"
        actor: system
        preconditions: ["enrollment.status == SCHEDULED", "clock date >= enrollment.effective_from"]
        side_effects:
          - "the agent's previously ACTIVE enrollment (if any) -> SUPERSEDED with effective_to = this enrollment's effective_from"
          - "PlanEnrollment.version increments by 1 on both this enrollment and the superseded one"
          - "Agent.version increments by 1 on the sweep path (on the inline-activation-at-creation path the create endpoint's single Agent.version bump covers it: exactly +1 per enrollment-create request)"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (when a later enrollment activates) "
        actor: system
        preconditions: ["another enrollment of the same agent is activating with a strictly later effective_from"]
        side_effects: ["effective_to := activating enrollment's effective_from", "PlanEnrollment.version increments by 1"]
      - from: ACTIVE
        to: ENDED
        trigger: "POST /brokerage/agents/{agentId}/terminate (cascade)"
        actor: system
        preconditions: ["owning agent is being terminated"]
        side_effects: ["effective_to := termination date (clock date)", "PlanEnrollment.version increments by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /brokerage/agents/{agentId}/terminate (cascade)"
        actor: system
        preconditions: ["owning agent is being terminated"]
        side_effects: ["effective_to := effective_from (zero-length coverage)", "PlanEnrollment.version increments by 1"]

  - entity: AnniversaryPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system clock sweep (POST /brokerage/_clock/set_current_utc): every OPEN window with window_end <= clock date closes"
        actor: system
        preconditions: ["period.status == OPEN", "window_end <= clock date"]
        side_effects: ["AnniversaryPeriod.version increments by 1"]
        note: "Rows are materialized lazily: the first settlement posting into a window creates the row (status derived from the clock at creation), and the clock sweep materializes every window from each non-ONBOARDING agent's join date through the window containing the clock date. Settlement into a CLOSED window is rejected (ERR_WINDOW_CLOSED)."

  - entity: Deal
    initial_state: DRAFT
    terminal_states: [DISBURSED, FELL_THROUGH, VOIDED]
    transitions:
      - from: DRAFT
        to: PENDING_CLOSING
        trigger: "POST /brokerage/deals/{dealId}/submit"
        actor: [Agent, TransactionCoordinator]
        preconditions:
          - "deal.status == DRAFT"
          - "Agent role callers: deal.agent_id == X-User-ID (else ERR_FORBIDDEN_RESOURCE)"
        side_effects: ["Deal.version increments by 1"]
      - from: PENDING_CLOSING
        to: DRAFT
        trigger: "POST /brokerage/deals/{dealId}/withdraw"
        actor: [Agent, TransactionCoordinator]
        preconditions:
          - "deal.status == PENDING_CLOSING"
          - "Agent role callers: deal.agent_id == X-User-ID"
        side_effects: ["Deal.version increments by 1"]
      - from: PENDING_CLOSING
        to: FELL_THROUGH
        trigger: "POST /brokerage/deals/{dealId}/fall-through"
        actor: TransactionCoordinator
        preconditions: ["deal.status == PENDING_CLOSING"]
        side_effects: ["Deal.version increments by 1"]
      - from: PENDING_CLOSING
        to: CLOSED
        trigger: "POST /brokerage/deals/{dealId}/close"
        actor: TransactionCoordinator
        preconditions:
          - "deal.status == PENDING_CLOSING"
          - "effective gross (actual_gross_commission_cents override or deal.gross_commission_cents) > 0"
          - "effective closing date (actual_closing_date override or deal.closing_date) >= agent.joined_at (ERR_DEAL_BEFORE_JOIN)"
          - "effective closing date <= clock date (ERR_FUTURE_CLOSING)"
        side_effects:
          - "if actual_gross_commission_cents provided: deal.gross_commission_cents := actual_gross_commission_cents"
          - "if actual_closing_date provided: deal.closing_date := actual_closing_date"
          - "deal.trust_received_cents := deal.gross_commission_cents"
          - "TrustTransaction RECEIPT +gross_commission_cents created for this deal"
          - "Deal.version increments by 1"
      - from: CLOSED
        to: VOIDED
        trigger: "POST /brokerage/deals/{dealId}/void"
        actor: TransactionCoordinator
        preconditions: ["deal.status == CLOSED (a SETTLED deal must be unsettled first)"]
        side_effects:
          - "TrustTransaction RECEIPT_REVERSAL -trust_received_cents created"
          - "deal.trust_received_cents := 0"
          - "Deal.version increments by 1"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /brokerage/deals/{dealId}/settle"
        actor: TransactionCoordinator
        preconditions:
          - "deal.status == CLOSED (else ERR_DEAL_INVALID_STATE)"
          - "the anniversary window containing closing_date is not CLOSED (ERR_WINDOW_CLOSED)"
          - "a PlanEnrollment of deal.agent_id covers closing_date: effective_from <= closing_date < effective_to-or-null (else ERR_NO_PLAN_ENROLLMENT)"
          - "no non-REVERSED Settlement exists for this deal (else ERR_DEAL_HAS_SETTLEMENT)"
        side_effects:
          - "run calculation payout_waterfall with the enrollment's pinned plan terms and the agent's current window accumulators"
          - "create Settlement (status POSTED) with the full computed breakdown, posted_by_user_id, posted_at"
          - "AnniversaryPeriod (window of closing_date): company_dollar_accrued_cents += company_dollar_cents; royalty_accrued_cents += royalty_cents; its version increments"
          - "create DisbursementLeg rows per calculation payout_leg_composition (zero-amount legs suppressed)"
          - "Agent.settled_deal_count += 1; Agent.version increments"
          - "if fee_shortfall_cents > 0: LedgerEntry FEE_SHORTFALL_ACCRUAL +fee_shortfall_cents; Agent.debit_balance_cents += fee_shortfall_cents"
          - "if debit_recovery_cents > 0: LedgerEntry DEBIT_RECOVERY -debit_recovery_cents; Agent.debit_balance_cents -= debit_recovery_cents"
          - "Deal.version increments by 1"
      - from: SETTLED
        to: CLOSED
        trigger: "POST /brokerage/deals/{dealId}/unsettle"
        actor: TransactionCoordinator
        preconditions:
          - "deal.status == SETTLED (else ERR_DEAL_INVALID_STATE)"
          - "every DisbursementLeg of the deal's settlement is in {SCHEDULED, VOIDED} (else ERR_LEGS_OUTSTANDING)"
        side_effects:
          - "Settlement POSTED -> REVERSED (reversed_at set)"
          - "every leg of that settlement in SCHEDULED -> VOIDED (system cascade)"
          - "AnniversaryPeriod of the settlement: company_dollar_accrued_cents -= settlement.company_dollar_cents; royalty_accrued_cents -= settlement.royalty_cents (exact restoration, cap room returns)"
          - "if settlement.debit_recovery_cents > 0: LedgerEntry DEBIT_RECOVERY_REVERSAL +debit_recovery_cents; Agent.debit_balance_cents += debit_recovery_cents"
          - "if settlement.fee_shortfall_cents > 0: LedgerEntry FEE_SHORTFALL_REVERSAL -fee_shortfall_cents; Agent.debit_balance_cents -= fee_shortfall_cents"
          - "Agent.settled_deal_count -= 1; Agent.version increments"
          - "Deal.version increments by 1"
      - from: SETTLED
        to: DISBURSED
        trigger: "system (bubble-up): fires within the release request that leaves every leg of the settlement RELEASED"
        actor: system
        preconditions:
          - "deal.status == SETTLED"
          - "every DisbursementLeg of the settlement has status RELEASED (none SCHEDULED, AUTHORIZED, or VOIDED)"
        side_effects: ["Deal.version increments by 1"]
        note: "If any leg was VOIDED the deal can never reach DISBURSED; correction path is unsettle -> fix -> settle again."

  - entity: Settlement
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /brokerage/deals/{dealId}/unsettle (cascade from Deal SETTLED -> CLOSED)"
        actor: system
        preconditions: ["all legs in {SCHEDULED, VOIDED}"]
        side_effects: ["reversed_at := clock timestamp", "Settlement.version increments by 1", "accumulator/ledger/debit compensations listed on the Deal unsettle transition"]

  - entity: DisbursementLeg
    initial_state: SCHEDULED
    terminal_states: [RELEASED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: AUTHORIZED
        trigger: "POST /brokerage/disbursement-legs/{legId}/authorize"
        actor: [OfficeManager, BrokerAdmin]
        preconditions:
          - "leg.status == SCHEDULED (else ERR_LEG_INVALID_STATE)"
          - "X-User-ID != leg.settlement.posted_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
          - "the leg's settlement is POSTED and its deal is SETTLED (else ERR_DEAL_INVALID_STATE)"
        side_effects:
          - "authorized_by_user_id := X-User-ID; authorized_at := clock timestamp"
          - "DisbursementLeg.version increments by 1"
      - from: AUTHORIZED
        to: RELEASED
        trigger: "POST /brokerage/disbursement-legs/{legId}/release"
        actor: [OfficeManager, BrokerAdmin]
        preconditions:
          - "leg.status == AUTHORIZED (else ERR_LEG_INVALID_STATE)"
          - "X-User-ID != leg.authorized_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
          - "the leg's settlement is POSTED and its deal is SETTLED (else ERR_DEAL_INVALID_STATE)"
        side_effects:
          - "released_by_user_id := X-User-ID; released_at := clock timestamp (cash-basis 1099 event)"
          - "TrustTransaction RELEASE -amount_cents created for the leg's deal"
          - "bubble-up: if every leg of the settlement is now RELEASED, the deal transitions SETTLED -> DISBURSED"
          - "DisbursementLeg.version increments by 1"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /brokerage/disbursement-legs/{legId}/void (manual) or system cascade from Deal unsettle"
        actor: [OfficeManager, BrokerAdmin, system]
        preconditions: ["leg.status == SCHEDULED (else ERR_LEG_INVALID_STATE)"]
        side_effects: ["DisbursementLeg.version increments by 1"]
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /brokerage/disbursement-legs/{legId}/void (manual)"
        actor: [OfficeManager, BrokerAdmin]
        preconditions: ["leg.status == AUTHORIZED (else ERR_LEG_INVALID_STATE)"]
        side_effects: ["DisbursementLeg.version increments by 1"]
        note: "RELEASED is terminal: released money is gone; corrections post manual debit adjustments."

  - entity: TaxForm1099
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /brokerage/tax-forms/{taxFormId}/finalize"
        actor: BrokerAdmin
        preconditions: ["form.status == DRAFT (else ERR_TAX_FORM_INVALID_STATE)"]
        side_effects: ["TaxForm1099.version increments by 1"]
      - from: DRAFT
        to: VOIDED
        trigger: "POST /brokerage/tax-forms/{taxFormId}/void, or system supersede when a new form is generated for the same (agent, tax_year) while a DRAFT exists"
        actor: [BrokerAdmin, system]
        preconditions: ["form.status == DRAFT"]
        side_effects: ["TaxForm1099.version increments by 1"]
      - from: FINALIZED
        to: VOIDED
        trigger: "POST /brokerage/tax-forms/{taxFormId}/void (correction path; a replacement DRAFT may then be generated)"
        actor: BrokerAdmin
        preconditions: ["form.status == FINALIZED (else ERR_TAX_FORM_INVALID_STATE)"]
        side_effects: ["TaxForm1099.version increments by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-create-stale-agent
    parent_entity: Agent
    write_endpoint: "POST /brokerage/agents/{agentId}/enrollments"
    occ_field: expected_agent_version
    description: |
      Creating a PlanEnrollment supersedes the agent's current enrollment and
      bumps Agent.version. A creation request carrying an expected_agent_version
      that no longer matches Agent.version is rejected: another write has
      advanced the agent since the caller last observed it, so the caller's
      view of which enrollment is current (and of the effective-date chain)
      is stale.
    error_id: ERR_STALE_AGENT_VERSION
    http_status: 412
  - rule_id: agent-patch-stale-version
    parent_entity: Agent
    write_endpoint: "PATCH /brokerage/agents/{agentId}"
    occ_field: expected_agent_version
    description: |
      Updating an Agent's mentor/team fields with an expected_agent_version
      that no longer matches Agent.version is rejected; the caller's snapshot
      of the agent predates an intervening write (e.g., a suspend or an
      enrollment supersede) that may have changed the fields being edited.
    error_id: ERR_STALE_AGENT_VERSION
    http_status: 412
  - rule_id: plan-update-stale-version
    parent_entity: CommissionPlan
    write_endpoint: "PUT /brokerage/plans/{planId}"
    occ_field: expected_plan_version
    description: |
      Editing a DRAFT CommissionPlan with an expected_plan_version that no
      longer matches CommissionPlan.version is rejected; an intervening edit
      has already advanced the plan, so applying the caller's diff would
      silently discard it.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: anniversary_window_assignment
    trigger: "deal settle (to select the posting window); clock sweep (materialization); GET anniversary-periods"
    algorithm: chronological
    formula: |
      window_index N of a date D for an agent = number of whole years between
      agent.joined_at and D: the greatest N with add_years(joined_at, N) <= D.
      window_start = add_years(joined_at, N); window_end = add_years(joined_at, N+1).
      add_years handles Feb-29 joins by rolling to Mar-01 in non-leap years.
      Half-open semantics: D belongs to the window with window_start <= D < window_end.
      A closing_date exactly equal to window_end belongs to the NEXT window.
      AnniversaryPeriod rows tile exactly: no gaps, no overlaps, by construction.
    input_set: "agent.joined_at; deal.closing_date"
    constants:
      FEB29_ROLL: "Mar-01 in non-leap years"
    precision: "whole calendar days"
    variants: []

  - name: referral_fee
    trigger: "payout_waterfall step 2"
    algorithm: tiered_pricing
    formula: |
      referral_fee_cents = round_half_up(referral_pct * net_office_commission_cents)
      net_office_commission_cents = gross_commission_cents - cobroke_payout_cents
      Rounding to whole cents happens HERE, before any later step consumes the value.
    input_set: "deal gross_commission_cents, cobroke_payout_cents, referral_pct"
    precision: "2 decimal places (whole cents), round_half_up"
    variants: []

  - name: royalty_with_cap
    trigger: "payout_waterfall step 3"
    algorithm: threshold
    formula: |
      tentative = round_half_up(royalty_pct * adjusted_commission_cents)
      royalty_cap_room = max(0, plan.royalty_cap_cents - window.royalty_accrued_cents)
      royalty_cents = min(tentative, royalty_cap_room)
      royalty_capped = (royalty_cents < tentative)
      accrued is read BEFORE this deal posts; this deal then adds royalty_cents.
    input_set: "adjusted_commission_cents; plan royalty_pct/royalty_cap_cents; window royalty_accrued_cents"
    precision: "whole cents, round_half_up at the tentative step"
    variants: []

  - name: tier_split_with_cap_clip
    trigger: "payout_waterfall step 4"
    algorithm: waterfall_allocation
    formula: |
      applicable tier = the first tier (ascending threshold) with
        threshold_company_dollar_cents > window.company_dollar_accrued_cents
      (accrued read BEFORE this deal posts; when accrued equals a threshold
      exactly, that tier is exhausted and the next tier applies).
      tentative_company = round_half_up(after_royalty_cents * tier.broker_split_pct)
      cap_room = max(0, tier.threshold_company_dollar_cents - window.company_dollar_accrued_cents)
      company_dollar_cents = min(tentative_company, cap_room)
      cap_clipped = (company_dollar_cents < tentative_company)
      agent_gross_cents = after_royalty_cents - company_dollar_cents
      (On the capping deal the agent keeps the surplus above the clipped company
      dollar: the agent is NOT re-split at the next tier within the same deal.)
    input_set: "after_royalty_cents; plan tiers; window company_dollar_accrued_cents"
    precision: "whole cents, round_half_up at the tentative step"
    variants: []

  - name: mentor_and_team_overrides
    trigger: "payout_waterfall steps 5-6"
    algorithm: threshold
    formula: |
      mentor applies iff agent.mentor_agent_id is not null AND
        agent.settled_deal_count < plan.mentor_deal_count (count read BEFORE this deal posts)
      mentor_split_cents = round_half_up(plan.mentor_split_pct * agent_gross_cents) when applied, else 0
      team override applies iff agent.team_lead_agent_id is not null AND agent.team_override_pct > 0
      team_override_cents = round_half_up(agent.team_override_pct * agent_gross_cents) when applied, else 0
      Both are computed on the SAME base (agent_gross_cents), mentor first; neither
      reduces the base of the other.
    input_set: "agent_gross_cents; agent mentor/team fields; plan mentor terms; agent.settled_deal_count"
    precision: "whole cents, round_half_up per component"
    variants: []

  - name: fee_shortfall_and_recovery
    trigger: "payout_waterfall steps 7-9"
    algorithm: waterfall_allocation
    formula: |
      remaining = agent_gross_cents - mentor_split_cents - team_override_cents
      eo_fee_cents        = min(plan.eo_fee_cents, remaining);              remaining -= eo_fee_cents
      transaction_fee_cents = min(plan.transaction_fee_cents, remaining);   remaining -= transaction_fee_cents
      fee_shortfall_cents = (plan.eo_fee_cents - eo_fee_cents) + (plan.transaction_fee_cents - transaction_fee_cents)
      debit_recovery_cents = min(remaining, agent.debit_balance_cents)      # balance read BEFORE this deal posts
      agent_net_cents = remaining - debit_recovery_cents
      Posting order within a settle: FEE_SHORTFALL_ACCRUAL (+shortfall) posts FIRST,
      then DEBIT_RECOVERY (-recovery) — recovery sweeps only the PRE-EXISTING
      balance, never this deal's own fresh shortfall.
    input_set: "agent_gross/mentor/team; plan fees; agent.debit_balance_cents"
    precision: "whole cents (all components already rounded upstream)"
    variants: []

  - name: payout_leg_composition
    trigger: "payout_waterfall final step (settle); also drives the conservation invariant"
    algorithm: waterfall_allocation
    formula: |
      Legs (in fixed creation order), each created only when its amount > 0:
        1. CO_BROKE   = cobroke_payout_cents                 (payee_name = deal.cobroke_payee_name)
        2. REFERRAL   = referral_fee_cents                   (payee_agent_id = deal.referral_agent_id)
        3. ROYALTY    = royalty_cents                        (payee_name = 'FRANCHISE')
        4. COMPANY    = company_dollar_cents + eo_fee_cents + transaction_fee_cents + debit_recovery_cents
        5. MENTOR     = mentor_split_cents                   (payee_agent_id = settlement.mentor_agent_id)
        6. TEAM_LEAD  = team_override_cents                  (payee_agent_id = settlement.team_lead_agent_id)
        7. AGENT      = agent_net_cents                      (payee_agent_id = deal.agent_id)
      CONSERVATION: sum of created legs == gross_commission_cents, ALWAYS.
      ROUNDING ORDER (pinned): every component is rounded to whole cents at its
      own waterfall step (round_half_up) BEFORE composition; implementations
      MUST NOT carry fractional cents through the waterfall and round once at
      the end — per-step rounding then sum is the pinned order and produces the
      authoritative leg amounts.
    input_set: "all payout_waterfall components of the settlement"
    precision: "whole cents; per-step round_half_up, then exact integer composition"
    variants: []

  - name: payout_waterfall
    trigger: "POST /deals/{id}/settle (final variant, mutating) and GET /deals/{id}/payout-estimate (provisional variant, read-only)"
    algorithm: waterfall_allocation
    formula: |
      EVALUATION ORDER (pinned; this is the circular-looking dependency made explicit):
        (a) window  := anniversary_window_assignment(agent.joined_at, deal.closing_date)
        (b) enrollment := the agent's PlanEnrollment with effective_from <= closing_date
                          and (effective_to is null or closing_date < effective_to)
        (c) plan    := enrollment's pinned plan terms (plan_version)
        (d) accrued := window accumulators BEFORE this deal (any previously POSTED,
                       non-REVERSED settlement contributes, regardless of its own
                       closing_date; settlement-time order governs cap allocation —
                       whichever deal settles first consumes cap room first)
        (e) gross -> cobroke -> net_office -> referral -> adjusted -> royalty ->
            after_royalty -> tier split -> agent_gross -> mentor -> team ->
            E&O -> transaction fee -> shortfall -> debit recovery -> agent_net
        (f) only then: accumulators += this deal's company_dollar / royalty
    input_set: "deal + agent + covering enrollment + window accumulators"
    precision: "whole cents, round_half_up at each marked step"
    variants:
      - name: provisional_estimate
        when: "GET /deals/{id}/payout-estimate (deal in DRAFT, PENDING_CLOSING, CLOSED, or SETTLED)"
        difference: "same formula against CURRENT accumulator/debit state, but with NO side effects: no settlement, no ledger entries, no accumulator mutation; output carries variant='PROVISIONAL'. Because intervening settlements move accumulators and debit balance, the provisional estimate and the later final settlement legitimately differ for identical deal data."
      - name: final_posted
        when: "POST /deals/{id}/settle"
        difference: "same formula, then mutates: settlement POSTED, legs created, accumulators and debit balance updated; output is the Settlement (variant='FINAL')."

  - name: tax_1099_totals
    trigger: "POST /agents/{agentId}/tax-forms (generation snapshot)"
    algorithm: aggregation
    formula: |
      Cash basis (filing basis):
        gross_paid_cents = sum of DisbursementLeg.amount_cents over legs where
          payee_agent_id == agent.id AND status == RELEASED AND
          released_at within [tax_year-01-01, (tax_year+1)-01-01)   -- both bounds on released_at
        Includes AGENT, MENTOR, TEAM_LEAD and REFERRAL legs (all contractor compensation).
      Accrual basis (informational):
        accrual_gross_cents = sum of agent_gross_cents over the agent's own settlements
          with posted_at inside the calendar year AND status == POSTED
        + sum of amount_cents of MENTOR/TEAM_LEAD/REFERRAL legs payable to the agent
          created inside the calendar year (any non-VOIDED status).
      filing_required = (gross_paid_cents >= 60000)   -- $600 threshold, INCLUSIVE
    input_set: "legs payable to the agent; the agent's own settlements; calendar-year windows"
    constants:
      FILING_THRESHOLD_CENTS: 60000
    precision: "whole cents"
    variants:
      - name: cash_basis
        when: "always; this is the filed figure (gross_paid_cents, filing_required)"
        difference: "keys on released_at; a December settlement whose legs release in January counts in the LATER year."
      - name: accrual_basis
        when: "informational comparison (accrual_gross_cents)"
        difference: "keys on posted_at / leg creation; the same money lands in the EARLIER year, so the two totals diverge across year boundaries."

  - name: debit_balance_reconciliation
    trigger: "on read of Agent.debit_balance_cents (invariant audit)"
    algorithm: aggregation
    formula: |
      Agent.debit_balance_cents == sum of amount_cents over ALL LedgerEntry rows of
      the agent, with floor 0 enforced only at write time (write-off may not exceed
      the balance). Each entry's resulting_balance_cents equals the running sum
      including itself; entries are ordered by created_at ASC (tie-break: none —
      entries are created one per mutation within a single request).
    input_set: "all LedgerEntry rows of the agent"
    precision: "whole cents"
    variants: []

  - name: trust_conservation
    trigger: "on leg release / deal void / trust-ledger read (invariant audit)"
    algorithm: aggregation
    formula: |
      Global: trust_balance = sum of amount_cents over all TrustTransaction rows >= 0 always.
      Per deal: trust_received_cents == sum of amount_cents of the deal's RECEIPT
      ( + any RECEIPT_REVERSAL ) transactions; for a SETTLED deal,
      sum of its settlement's non-VOIDED leg amounts == trust_received_cents == gross.
      After the deal reaches DISBURSED: sum of RELEASE trust transactions == gross
      and the deal's net trust position is 0.
    input_set: "TrustTransaction rows (global or per deal); DisbursementLeg rows of the settlement"
    precision: "whole cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and non-empty"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "When X-User-Role == Agent, X-User-ID must be the id of an existing Agent"
    error_id: ERR_UNKNOWN_USER_IDENTITY
    http_status: 403
    applies_to: "all endpoints"
  - priority: 4
    category: auth
    check: "Agent-role callers may only touch resources they own: deals (agent_id == X-User-ID), own enrollments/anniversary-periods/ledger-entries/tax-forms/disbursement-legs (as payee or deal agent), own agent record"
    error_id: ERR_FORBIDDEN_RESOURCE
    http_status: 403
    applies_to: "all GET/list endpoints and deal create/submit/withdraw/update when called as Agent"
  - priority: 5
    category: existence
    check: "Request body schema: every required input field of the endpoint must be present and parse to its declared type; query filters must parse to declared types (invalid enum filter value -> ERR_INVALID_REQUEST)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 6
    category: existence
    check: "Path resources must exist, validated left-to-right (agentId, then planId/dealId/settlementId/legId/taxFormId/enrollmentId)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 7
    category: state
    check: "OCC: expected_agent_version / expected_plan_version must equal the parent's current version"
    error_id: "ERR_STALE_AGENT_VERSION | ERR_STALE_PLAN_VERSION"
    http_status: 412
    applies_to: "POST /brokerage/agents/{agentId}/enrollments; PATCH /brokerage/agents/{agentId}; PUT /brokerage/plans/{planId}"
  - priority: 8
    category: state
    check: "Target resource must be in a valid state for the operation (per-entity transition tables; includes: deal create requires the deal's agent to be ACTIVE — ERR_AGENT_INVALID_STATE; plan must be ACTIVE to enroll into — ERR_PLAN_NOT_ACTIVE; plan DRAFT-only edit; deal transitions (settle on a SETTLED deal -> ERR_DEAL_HAS_SETTLEMENT, on any other non-CLOSED state -> ERR_DEAL_INVALID_STATE); leg transitions; tax-form transitions; window not CLOSED — ERR_WINDOW_CLOSED)"
    error_id: "ERR_AGENT_INVALID_STATE | ERR_PLAN_INVALID_STATE | ERR_PLAN_NOT_ACTIVE | ERR_DEAL_INVALID_STATE | ERR_DEAL_HAS_SETTLEMENT | ERR_LEG_INVALID_STATE | ERR_TAX_FORM_INVALID_STATE | ERR_WINDOW_CLOSED"
    http_status: 409
    applies_to: "all action endpoints, PUT endpoints, POST /brokerage/deals, POST /brokerage/agents/{agentId}/enrollments, POST /brokerage/deals/{dealId}/settle"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: leg authorize requires X-User-ID != settlement.posted_by_user_id; leg release requires X-User-ID != leg.authorized_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /brokerage/disbursement-legs/{legId}/authorize, POST /brokerage/disbursement-legs/{legId}/release"
  - priority: 10
    category: business_temporal
    check: "Deal closing_date must not precede agent.joined_at (checked at create, update, and close with effective values)"
    error_id: ERR_DEAL_BEFORE_JOIN
    http_status: 422
    applies_to: "POST /brokerage/deals, PUT /brokerage/deals/{dealId}, POST /brokerage/deals/{dealId}/close"
  - priority: 11
    category: business_temporal
    check: "Actual closing date at close must be <= clock date (no future closings); clock moves forward only (to_iso8601 strictly greater than current clock)"
    error_id: "ERR_FUTURE_CLOSING | ERR_CLOCK_REGRESSION"
    http_status: 422
    applies_to: "POST /brokerage/deals/{dealId}/close; POST /brokerage/_clock/set_current_utc"
  - priority: 12
    category: business_temporal
    check: "New enrollment effective_from must be strictly after the effective_from of the agent's current ACTIVE/SCHEDULED enrollment (no overlap, no back-dating over the current plan); a second SCHEDULED enrollment is rejected"
    error_id: "ERR_EFFECTIVE_DATE_REGRESSION | ERR_ENROLLMENT_ALREADY_SCHEDULED"
    http_status: 422
    applies_to: "POST /brokerage/agents/{agentId}/enrollments"
  - priority: 13
    category: business_temporal
    check: "tax_year must be >= year(agent.joined_at) and <= year of the clock date"
    error_id: ERR_TAX_YEAR_INVALID
    http_status: 422
    applies_to: "POST /brokerage/agents/{agentId}/tax-forms"
  - priority: 14
    category: business_referential
    check: "referral_agent_id must reference an existing Agent and differ from deal.agent_id; referral_pct > 0 iff referral_agent_id set; cobroke_payout_cents > 0 requires cobroke_payee_name; mentor_agent_id/team_lead_agent_id must reference existing Agents and differ from the agent"
    error_id: "ERR_NOT_FOUND | ERR_SELF_REFERENCE | ERR_REFERRAL_INCOMPLETE | ERR_COBROKE_PAYEE_MISSING"
    http_status: "404 | 422"
    applies_to: "POST /brokerage/deals, PUT /brokerage/deals/{dealId}, POST /brokerage/agents, PATCH /brokerage/agents/{agentId}"
  - priority: 15
    category: business_referential
    check: "settle requires a PlanEnrollment covering closing_date; retire requires no ACTIVE/SCHEDULED enrollments; terminate requires no DRAFT/PENDING_CLOSING deals; unsettle requires all legs in {SCHEDULED, VOIDED}"
    error_id: "ERR_NO_PLAN_ENROLLMENT | ERR_PLAN_IN_USE | ERR_AGENT_HAS_OPEN_DEALS | ERR_LEGS_OUTSTANDING"
    http_status: 409
    applies_to: "settle, unsettle, plan retire, agent terminate"
  - priority: 16
    category: business_constraint
    check: "Uniqueness: agent license_number unique; a FINALIZED (non-VOIDED) tax form for the same (agent, tax_year) blocks regeneration (an existing DRAFT is superseded instead)"
    error_id: "ERR_LICENSE_NUMBER_TAKEN | ERR_TAX_FORM_FINALIZED_EXISTS"
    http_status: 409
    applies_to: "POST /brokerage/agents; POST /brokerage/agents/{agentId}/tax-forms"
  - priority: 17
    category: business_fiscal
    check: "gross_commission_cents > 0; 0 <= cobroke_payout_cents < gross; 0 <= referral_pct <= 1; team_override_pct in [0,1]; plan tiers strictly ascending with final broker_split_pct == 0; plan fees >= 0; plan pcts in [0,1]; debit adjustment amount_cents != 0; write-off (negative amount) may not exceed current debit balance"
    error_id: "ERR_NONPOSITIVE_GROSS | ERR_COBROKE_EXCEEDS_GROSS | ERR_PCT_OUT_OF_RANGE | ERR_PLAN_TIERS_INVALID | ERR_DEBIT_ADJUSTMENT_INVALID | ERR_WRITE_OFF_EXCEEDS_DEBIT"
    http_status: 422
    applies_to: "deal create/update/close; agent create/patch; plan create/update; POST /brokerage/agents/{agentId}/debit-adjustments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/brokerage/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Forward-only (else ERR_CLOCK_REGRESSION). Side effects run the system sweep: SCHEDULED enrollments with effective_from <= new clock date activate (superseding the agent's currently ACTIVE enrollment); all AnniversaryPeriod windows from each non-ONBOARDING agent's join date through the window containing the new clock date are materialized if missing; every OPEN window with window_end <= new clock date closes."
    roles: [BrokerAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, activated_enrollment_ids: string[], closed_window_ids: string[] }"
    side_effects: ["enrollment activation sweep", "anniversary window close sweep", "window materialization"]

  # --- Agents ---
  - method: POST
    path: "/brokerage/agents"
    description: "Create an agent (status ONBOARDING). joined_at is immutable and anchors anniversary windows."
    roles: [BrokerAdmin]
    code: 201
    input: [full_name, email, license_number, joined_at, "mentor_agent_id?", "team_lead_agent_id?", "team_override_pct?"]
    output: Agent
    side_effects: ["status=ONBOARDING", "debit_balance_cents=0", "settled_deal_count=0"]
  - method: GET
    path: "/brokerage/agents/{agentId}"
    description: "Get one agent (includes debit_balance_cents, settled_deal_count, status, version)."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: []
    output: Agent
    side_effects: []
  - method: GET
    path: "/brokerage/agents"
    description: "List agents with filters; Agent-role callers see only themselves. Standard envelope pagination."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: ["status?", "mentor_agent_id?", "team_lead_agent_id?", "limit?", "offset?"]
    output: Agent[]
    side_effects: []
  - method: PATCH
    path: "/brokerage/agents/{agentId}"
    description: "Update mutable agent fields (OCC on Agent.version). joined_at and license_number are immutable."
    roles: [BrokerAdmin]
    code: 200
    input: [expected_agent_version, "full_name?", "email?", "mentor_agent_id?", "team_lead_agent_id?", "team_override_pct?"]
    output: Agent
    side_effects: ["increments Agent.version by 1"]
  - method: POST
    path: "/brokerage/agents/{agentId}/activate"
    description: "ONBOARDING -> ACTIVE."
    roles: [BrokerAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: ["increments Agent.version by 1"]
  - method: POST
    path: "/brokerage/agents/{agentId}/suspend"
    description: "ACTIVE -> SUSPENDED. Suspended agents keep existing pipeline but cannot create deals."
    roles: [BrokerAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: ["increments Agent.version by 1"]
  - method: POST
    path: "/brokerage/agents/{agentId}/reinstate"
    description: "SUSPENDED -> ACTIVE."
    roles: [BrokerAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: ["increments Agent.version by 1"]
  - method: POST
    path: "/brokerage/agents/{agentId}/terminate"
    description: "ACTIVE/SUSPENDED/ONBOARDING -> TERMINATED; cascades to enrollments (ACTIVE->ENDED, SCHEDULED->CANCELLED)."
    roles: [BrokerAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: ["enrollment cascade (ENDED/CANCELLED)", "increments Agent.version by 1"]

  # --- Plans ---
  - method: POST
    path: "/brokerage/plans"
    description: "Create a commission plan (status DRAFT; editable while DRAFT)."
    roles: [BrokerAdmin]
    code: 201
    input: [name, royalty_pct, royalty_cap_cents, eo_fee_cents, transaction_fee_cents, "mentor_split_pct?", "mentor_deal_count?", tiers]
    output: CommissionPlan
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/brokerage/plans/{planId}"
    description: "Get one plan."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: []
    output: CommissionPlan
    side_effects: []
  - method: GET
    path: "/brokerage/plans"
    description: "List plans."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CommissionPlan[]
    side_effects: []
  - method: PUT
    path: "/brokerage/plans/{planId}"
    description: "Edit a DRAFT plan (OCC on CommissionPlan.version). Full replace of the editable terms."
    roles: [BrokerAdmin]
    code: 200
    input: [expected_plan_version, name, royalty_pct, royalty_cap_cents, eo_fee_cents, transaction_fee_cents, "mentor_split_pct?", "mentor_deal_count?", tiers]
    output: CommissionPlan
    side_effects: ["increments CommissionPlan.version by 1"]
  - method: POST
    path: "/brokerage/plans/{planId}/activate"
    description: "DRAFT -> ACTIVE. Only ACTIVE plans accept enrollments."
    roles: [BrokerAdmin]
    code: 200
    input: []
    output: CommissionPlan
    side_effects: ["increments CommissionPlan.version by 1"]
  - method: POST
    path: "/brokerage/plans/{planId}/retire"
    description: "DRAFT/ACTIVE -> RETIRED; blocked while any enrollment is ACTIVE or SCHEDULED (ERR_PLAN_IN_USE)."
    roles: [BrokerAdmin]
    code: 200
    input: []
    output: CommissionPlan
    side_effects: ["increments CommissionPlan.version by 1"]

  # --- Enrollments ---
  - method: POST
    path: "/brokerage/agents/{agentId}/enrollments"
    description: "Enroll an ACTIVE agent into an ACTIVE plan with effective dating (OCC on Agent.version). effective_from <= clock date activates immediately and supersedes the current ACTIVE enrollment; a future effective_from creates SCHEDULED (max one SCHEDULED per agent). The new effective_from must be strictly after the current enrollment's."
    roles: [BrokerAdmin]
    code: 201
    input: [plan_id, effective_from, expected_agent_version]
    output: PlanEnrollment
    side_effects: ["pins plan_version", "supersedes current ACTIVE enrollment when activating", "increments Agent.version by 1"]
  - method: GET
    path: "/brokerage/enrollments/{enrollmentId}"
    description: "Get one enrollment."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: []
    output: PlanEnrollment
    side_effects: []
  - method: GET
    path: "/brokerage/enrollments"
    description: "List enrollments filtered by agent and/or plan; Agent-role callers see only their own."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: ["agent_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: PlanEnrollment[]
    side_effects: []

  # --- Anniversary periods ---
  - method: GET
    path: "/brokerage/anniversary-periods/{periodId}"
    description: "Get one anniversary period (window bounds, accumulators, status)."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: []
    output: AnniversaryPeriod
    side_effects: []
  - method: GET
    path: "/brokerage/anniversary-periods"
    description: "List anniversary windows with accumulators, filterable by agent; ordered by window_index ASC. Agent-role callers: own agent only."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: ["agent_id?", "status?", "limit?", "offset?"]
    output: AnniversaryPeriod[]
    side_effects: []

  # --- Deals ---
  - method: POST
    path: "/brokerage/deals"
    description: "Create a deal in DRAFT. Agent-role callers must create for themselves (agent_id == X-User-ID)."
    roles: [Agent, TransactionCoordinator]
    code: 201
    input: [agent_id, address, gross_commission_cents, closing_date, "cobroke_payout_cents?", "cobroke_payee_name?", "referral_pct?", "referral_agent_id?"]
    output: Deal
    side_effects: ["status=DRAFT", "trust_received_cents=0"]
  - method: GET
    path: "/brokerage/deals/{dealId}"
    description: "Get one deal."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: []
    output: Deal
    side_effects: []
  - method: GET
    path: "/brokerage/deals"
    description: "List deals; Agent-role callers see only their own."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: ["agent_id?", "referral_agent_id?", "status?", "limit?", "offset?"]
    output: Deal[]
    side_effects: []
  - method: PUT
    path: "/brokerage/deals/{dealId}"
    description: "Edit a DRAFT deal (full replace of editable terms; same validations as create)."
    roles: [Agent, TransactionCoordinator]
    code: 200
    input: [address, gross_commission_cents, closing_date, "cobroke_payout_cents?", "cobroke_payee_name?", "referral_pct?", "referral_agent_id?"]
    output: Deal
    side_effects: ["increments Deal.version by 1"]
  - method: POST
    path: "/brokerage/deals/{dealId}/submit"
    description: "DRAFT -> PENDING_CLOSING."
    roles: [Agent, TransactionCoordinator]
    code: 200
    input: []
    output: Deal
    side_effects: ["increments Deal.version by 1"]
  - method: POST
    path: "/brokerage/deals/{dealId}/withdraw"
    description: "PENDING_CLOSING -> DRAFT (cycle back to editing)."
    roles: [Agent, TransactionCoordinator]
    code: 200
    input: []
    output: Deal
    side_effects: ["increments Deal.version by 1"]
  - method: POST
    path: "/brokerage/deals/{dealId}/fall-through"
    description: "PENDING_CLOSING -> FELL_THROUGH (deal died before closing; no money moves)."
    roles: [TransactionCoordinator]
    code: 200
    input: []
    output: Deal
    side_effects: ["increments Deal.version by 1"]
  - method: POST
    path: "/brokerage/deals/{dealId}/close"
    description: "PENDING_CLOSING -> CLOSED: records actual figures and the trust receipt."
    roles: [TransactionCoordinator]
    code: 200
    input: ["actual_gross_commission_cents?", "actual_closing_date?"]
    output: Deal
    side_effects: ["applies actuals over draft values", "trust_received_cents := gross", "TrustTransaction RECEIPT", "increments Deal.version by 1"]
  - method: POST
    path: "/brokerage/deals/{dealId}/void"
    description: "CLOSED -> VOIDED: reverses the trust receipt (only before settlement)."
    roles: [TransactionCoordinator]
    code: 200
    input: []
    output: Deal
    side_effects: ["TrustTransaction RECEIPT_REVERSAL", "trust_received_cents := 0", "increments Deal.version by 1"]
  - method: GET
    path: "/brokerage/deals/{dealId}/payout-estimate"
    description: "Provisional payout schedule (calculation payout_waterfall, variant provisional_estimate): same formula as settle, current accumulator state, NO side effects. Available unless the deal is FELL_THROUGH or VOIDED."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: []
    output: "{ variant: string, gross_commission_cents: integer, cobroke_payout_cents: integer, net_office_commission_cents: integer, referral_fee_cents: integer, adjusted_commission_cents: integer, royalty_cents: integer, royalty_capped: boolean, after_royalty_cents: integer, tier_index_applied: integer, company_dollar_cents: integer, cap_clipped: boolean, agent_gross_cents: integer, mentor_split_cents: integer, mentor_applied: boolean, team_override_cents: integer, eo_fee_cents: integer, transaction_fee_cents: integer, fee_shortfall_cents: integer, debit_recovery_cents: integer, agent_net_cents: integer }"
    side_effects: []
  - method: POST
    path: "/brokerage/deals/{dealId}/settle"
    description: "CLOSED -> SETTLED: posts the final settlement (calculation payout_waterfall, variant final_posted), creates disbursement legs, ledger entries, and accumulator updates atomically."
    roles: [TransactionCoordinator]
    code: 201
    input: []
    output: Settlement
    side_effects: ["Settlement POSTED created", "DisbursementLeg rows created (zero-amount suppressed)", "AnniversaryPeriod accumulators += company_dollar/royalty", "Agent.settled_deal_count += 1", "LedgerEntry rows for shortfall/recovery", "increments Deal.version by 1"]
  - method: POST
    path: "/brokerage/deals/{dealId}/unsettle"
    description: "SETTLED -> CLOSED: full reversal cascade (settlement REVERSED, SCHEDULED legs VOIDED, accumulators and debit balance restored exactly)."
    roles: [TransactionCoordinator]
    code: 200
    input: []
    output: Deal
    side_effects: ["Settlement -> REVERSED", "SCHEDULED legs -> VOIDED", "accumulator decrement", "LedgerEntry reversal rows", "Agent.settled_deal_count -= 1", "increments Deal.version by 1"]

  # --- Settlements ---
  - method: GET
    path: "/brokerage/settlements/{settlementId}"
    description: "Get one settlement (full waterfall breakdown)."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/brokerage/settlements"
    description: "List settlements; Agent-role callers see only their own."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: ["deal_id?", "agent_id?", "enrollment_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  # --- Disbursement legs ---
  - method: GET
    path: "/brokerage/disbursement-legs/{legId}"
    description: "Get one disbursement leg."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: []
    output: DisbursementLeg
    side_effects: []
  - method: GET
    path: "/brokerage/disbursement-legs"
    description: "List disbursement legs filtered by settlement and/or payee; Agent-role callers see only legs payable to themselves."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: ["settlement_id?", "payee_agent_id?", "payee_type?", "status?", "limit?", "offset?"]
    output: DisbursementLeg[]
    side_effects: []
  - method: POST
    path: "/brokerage/disbursement-legs/{legId}/authorize"
    description: "SCHEDULED -> AUTHORIZED. Authorizer must differ from the settlement poster (segregation of duties)."
    roles: [OfficeManager, BrokerAdmin]
    code: 200
    input: []
    output: DisbursementLeg
    side_effects: ["authorized_by_user_id/authorized_at set", "increments DisbursementLeg.version by 1"]
  - method: POST
    path: "/brokerage/disbursement-legs/{legId}/release"
    description: "AUTHORIZED -> RELEASED. Releaser must differ from the authorizer (segregation of duties). Creates the trust RELEASE transaction and may bubble the deal to DISBURSED."
    roles: [OfficeManager, BrokerAdmin]
    code: 200
    input: []
    output: DisbursementLeg
    side_effects: ["released_by_user_id/released_at set", "TrustTransaction RELEASE", "bubble-up deal SETTLED -> DISBURSED when all legs released", "increments DisbursementLeg.version by 1"]
  - method: POST
    path: "/brokerage/disbursement-legs/{legId}/void"
    description: "SCHEDULED or AUTHORIZED -> VOIDED (correction path before release; the deal can then only be fixed via unsettle)."
    roles: [OfficeManager, BrokerAdmin]
    code: 200
    input: []
    output: DisbursementLeg
    side_effects: ["increments DisbursementLeg.version by 1"]

  # --- Agent debit ledger ---
  - method: GET
    path: "/brokerage/ledger-entries/{entryId}"
    description: "Get one ledger entry."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []
  - method: GET
    path: "/brokerage/ledger-entries"
    description: "List debit-ledger entries in chronological order (created_at ASC), filterable by agent, originating deal, or type. Agent-role callers: own agent only."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: ["agent_id?", "deal_id?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: POST
    path: "/brokerage/agents/{agentId}/debit-adjustments"
    description: "Manual debit movement: amount_cents > 0 adds a MANUAL_DEBIT (e.g., brokerage advances a cost); amount_cents < 0 writes off debit (may not exceed the balance). Creates the LedgerEntry and updates Agent.debit_balance_cents."
    roles: [BrokerAdmin]
    code: 201
    input: [amount_cents, reason]
    output: LedgerEntry
    side_effects: ["Agent.debit_balance_cents += amount_cents", "LedgerEntry created with resulting_balance_cents", "increments Agent.version by 1"]

  # --- 1099 tax forms ---
  - method: POST
    path: "/brokerage/agents/{agentId}/tax-forms"
    description: "Generate a DRAFT 1099 snapshot for a tax year (calculation tax_1099_totals). If a DRAFT exists for the same year it is superseded (VOIDED) and replaced; if a FINALIZED one exists, ERR_TAX_FORM_FINALIZED_EXISTS."
    roles: [BrokerAdmin]
    code: 201
    input: [tax_year]
    output: TaxForm1099
    side_effects: ["existing same-year DRAFT -> VOIDED", "gross_paid_cents / accrual_gross_cents / filing_required computed at generation"]
  - method: GET
    path: "/brokerage/tax-forms/{taxFormId}"
    description: "Get one tax form."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: []
    output: TaxForm1099
    side_effects: []
  - method: GET
    path: "/brokerage/tax-forms"
    description: "List tax forms; Agent-role callers see only their own."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: ["agent_id?", "tax_year?", "status?", "limit?", "offset?"]
    output: TaxForm1099[]
    side_effects: []
  - method: POST
    path: "/brokerage/tax-forms/{taxFormId}/finalize"
    description: "DRAFT -> FINALIZED (locks the snapshot for filing)."
    roles: [BrokerAdmin]
    code: 200
    input: []
    output: TaxForm1099
    side_effects: ["increments TaxForm1099.version by 1"]
  - method: POST
    path: "/brokerage/tax-forms/{taxFormId}/void"
    description: "DRAFT or FINALIZED -> VOIDED (correction path)."
    roles: [BrokerAdmin]
    code: 200
    input: []
    output: TaxForm1099
    side_effects: ["increments TaxForm1099.version by 1"]

  # --- Trust accounting ---
  - method: GET
    path: "/brokerage/trust-transactions/{transactionId}"
    description: "Get one trust transaction."
    roles: [BrokerAdmin, OfficeManager, Auditor]
    code: 200
    input: []
    output: TrustTransaction
    side_effects: []
  - method: GET
    path: "/brokerage/trust-ledger"
    description: "Global trust account position (calculation trust_conservation): received, released, and held balances summed over all TrustTransaction rows."
    roles: [BrokerAdmin, OfficeManager, Auditor]
    code: 200
    input: []
    output: "{ received_cents: integer, released_cents: integer, held_cents: integer, transaction_count: integer }"
    side_effects: []
  - method: GET
    path: "/brokerage/trust-transactions"
    description: "List trust transactions in chronological order (created_at ASC), filterable by deal or kind."
    roles: [BrokerAdmin, OfficeManager, TransactionCoordinator, Auditor, Agent]
    code: 200
    input: ["deal_id?", "kind?", "limit?", "offset?"]
    output: TrustTransaction[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "required request field missing or value fails type parsing" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "caller role not in the endpoint's roles list" }
  - { id: ERR_UNKNOWN_USER_IDENTITY, http: 403, condition: "X-User-Role=Agent but X-User-ID is not an existing Agent" }
  - { id: ERR_FORBIDDEN_RESOURCE, http: 403, condition: "Agent-role caller touches a resource they do not own (deal/enrollment/ledger/tax-form/leg/agent record of another agent)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id does not identify an existing resource" }
  - { id: ERR_STALE_AGENT_VERSION, http: 412, condition: "expected_agent_version != Agent.version (enrollment create, agent patch)" }
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_plan_version != CommissionPlan.version (plan update)" }
  - { id: ERR_AGENT_INVALID_STATE, http: 409, condition: "agent status does not allow the transition (e.g., suspend a SUSPENDED agent, activate an ACTIVE agent) or deal creation by/for a non-ACTIVE agent" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "plan status does not allow the transition (edit/activate a non-DRAFT plan, retire a RETIRED plan)" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "enrollment targets a plan that is not ACTIVE" }
  - { id: ERR_PLAN_IN_USE, http: 409, condition: "retire blocked: an ACTIVE or SCHEDULED enrollment references the plan" }
  - { id: ERR_ENROLLMENT_ALREADY_SCHEDULED, http: 422, condition: "agent already has a SCHEDULED enrollment; only one pending plan change may exist" }
  - { id: ERR_EFFECTIVE_DATE_REGRESSION, http: 422, condition: "new enrollment effective_from is not strictly after the current enrollment's effective_from (overlap / back-dating)" }
  - { id: ERR_NO_PLAN_ENROLLMENT, http: 409, condition: "settle: no enrollment covers the deal's closing_date" }
  - { id: ERR_WINDOW_CLOSED, http: 409, condition: "settle: the anniversary window containing closing_date is CLOSED (books closed for that anniversary year)" }
  - { id: ERR_DEAL_INVALID_STATE, http: 409, condition: "deal status does not allow the operation (submit/withdraw/fall-through/close/void/settle/unsettle/payout-estimate from a forbidden state; leg actions when the deal is no longer SETTLED)" }
  - { id: ERR_DEAL_HAS_SETTLEMENT, http: 409, condition: "settle: a non-REVERSED settlement already exists for the deal" }
  - { id: ERR_DEAL_BEFORE_JOIN, http: 422, condition: "closing_date (or actual_closing_date) precedes agent.joined_at" }
  - { id: ERR_FUTURE_CLOSING, http: 422, condition: "actual closing date at close is after the clock date" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "clock set to a timestamp not strictly after the current logical clock" }
  - { id: ERR_AGENT_HAS_OPEN_DEALS, http: 409, condition: "terminate blocked: agent has deals in DRAFT or PENDING_CLOSING" }
  - { id: ERR_LEG_INVALID_STATE, http: 409, condition: "leg status does not allow the transition (authorize a non-SCHEDULED leg, release a non-AUTHORIZED leg, void a RELEASED/VOIDED leg)" }
  - { id: ERR_LEGS_OUTSTANDING, http: 409, condition: "unsettle blocked: a leg is AUTHORIZED or RELEASED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "authorize attempted by the settlement poster, or release attempted by the authorizer" }
  - { id: ERR_NONPOSITIVE_GROSS, http: 422, condition: "gross_commission_cents (or actual override) <= 0" }
  - { id: ERR_COBROKE_EXCEEDS_GROSS, http: 422, condition: "cobroke_payout_cents < 0 or >= gross_commission_cents" }
  - { id: ERR_PCT_OUT_OF_RANGE, http: 422, condition: "referral_pct or team_override_pct outside [0,1], or plan pcts outside [0,1]" }
  - { id: ERR_PLAN_TIERS_INVALID, http: 422, condition: "tiers not strictly ascending by threshold, empty, or final tier broker_split_pct != 0" }
  - { id: ERR_REFERRAL_INCOMPLETE, http: 422, condition: "referral_agent_id set with referral_pct == 0/missing, or referral_pct > 0 without referral_agent_id" }
  - { id: ERR_COBROKE_PAYEE_MISSING, http: 422, condition: "cobroke_payout_cents > 0 without cobroke_payee_name" }
  - { id: ERR_SELF_REFERENCE, http: 422, condition: "mentor_agent_id/team_lead_agent_id equals the agent's own id, or referral_agent_id equals deal.agent_id" }
  - { id: ERR_LICENSE_NUMBER_TAKEN, http: 409, condition: "license_number already used by another agent" }
  - { id: ERR_TAX_YEAR_INVALID, http: 422, condition: "tax_year before the agent's join year or after the clock year" }
  - { id: ERR_TAX_FORM_FINALIZED_EXISTS, http: 409, condition: "generation blocked: a FINALIZED (non-VOIDED) form exists for the same (agent, tax_year)" }
  - { id: ERR_TAX_FORM_INVALID_STATE, http: 409, condition: "finalize/void from a status that does not allow it" }
  - { id: ERR_DEBIT_ADJUSTMENT_INVALID, http: 422, condition: "debit adjustment amount_cents == 0 or reason missing" }
  - { id: ERR_WRITE_OFF_EXCEEDS_DEBIT, http: 422, condition: "write-off magnitude exceeds the agent's current debit balance" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BrokerAdmin
    description: "Broker of record / market-center operator: plans, enrollments, agent lifecycle, debit adjustments, tax forms, clock; can also authorize/release/void legs (subject to segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /brokerage/_clock/set_current_utc"
      - "POST /brokerage/agents + PATCH + activate/suspend/reinstate/terminate"
      - "POST/PUT /brokerage/plans + activate/retire"
      - "POST /brokerage/agents/{agentId}/enrollments"
      - "POST /brokerage/agents/{agentId}/debit-adjustments"
      - "POST /brokerage/agents/{agentId}/tax-forms; POST /brokerage/tax-forms/{id}/finalize|void"
    shared_operations:
      - "leg authorize/release/void (shared with OfficeManager, subject to SoD)"
      - "all GET endpoints"
  - name: OfficeManager
    description: "Disbursement officer: authorizes, releases, and voids disbursement legs; cannot post settlements or manage plans/agents"
    identity: opaque
    exclusive_operations:
      - "POST /brokerage/disbursement-legs/{legId}/authorize|release|void (shared with BrokerAdmin but exclusive vs TransactionCoordinator/Agent)"
    shared_operations:
      - "all GET endpoints; GET /brokerage/trust-ledger"
  - name: TransactionCoordinator
    description: "Deal desk: creates/edits deals for any agent, drives the deal pipeline, records closings, posts and reverses settlements. Is the settlement poster for segregation-of-duties purposes and therefore can never authorize that settlement's legs."
    identity: opaque
    exclusive_operations:
      - "POST /brokerage/deals/{dealId}/fall-through|close|void|settle|unsettle"
    shared_operations:
      - "POST /brokerage/deals; PUT /brokerage/deals/{dealId}; submit/withdraw (shared with owning Agent)"
      - "all GET endpoints"
  - name: Agent
    description: "Independent-contractor agent: manages own deal drafts and pipeline submissions; read-only on own financial records (deals, settlements, legs payable to self, ledger entries, anniversary periods, tax forms, enrollments)"
    identity: "entity_backed:Agent"
    exclusive_operations: []
    shared_operations:
      - "POST /brokerage/deals (only with agent_id == X-User-ID)"
      - "PUT/submit/withdraw on own DRAFT/PENDING_CLOSING deals"
      - "GET endpoints scoped to own resources (ERR_FORBIDDEN_RESOURCE otherwise)"
  - name: Auditor
    description: "Read-only compliance auditor: all GET endpoints including the trust ledger; no writes"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "all GET endpoints; GET /brokerage/trust-ledger"
