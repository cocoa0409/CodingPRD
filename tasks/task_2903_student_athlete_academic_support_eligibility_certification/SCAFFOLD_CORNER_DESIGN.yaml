            - "Tutor.${t39_id}.assigned_weekly_hours == 2.00, not 4.00"
            - "StudentAthlete.${s39_id}.required_study_hall_hours == 0.0 because TIER_1's base is 0.0 hours"

      - name: enrollment_drop_cascades_assignment_termination
        claim_type: cascade_down
        grounds:
          - state_machines.Enrollment.transitions.ENROLLED_to_DROPPED
          - state_machines.TutorAssignment.transitions.ACTIVE_to_TERMINATED
          - entities.TutorAssignment.fields.terminated_reason
        distinguishing_aspect: "Dropping the enrollment terminates only its non-terminal assignments with terminated_reason ENROLLMENT_DROPPED and releases their hours from the tutor - the cascade travels parent-to-child in created_at ASC order and touches no other tutor row."
        test_recipe:
          setup:
            - "Term 2026FA is OPEN; student S40 (TIER_1) is ENROLLED in SOCI-150 and Tutor T40 is TRAINED with subject_codes [\"SOCI\"]."
            - "Assignment A40 (weekly_hours 2.00) is ACTIVE, so Tutor.assigned_weekly_hours == 2.00 before the drop."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LearningSpecialist
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1" }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Forty", sport_code: "SOC", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s40_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s40_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e40_id: $.data.id }
            - call: "POST /athletics/tutors"
              payload: { full_name: "Tomas Cascade", subject_codes: ["SOCI"] }
              as: LearningSpecialist
              captures: { t40_id: $.data.id }
            - call: "POST /athletics/tutors/${t40_id}/status"
              payload: { action: "COMPLETE_TRAINING", term_id: "${term1_id}" }
              as: LearningSpecialist
            - call: "POST /athletics/tutor-assignments"
              payload: { tutor_id: "${t40_id}", enrollment_id: "${e40_id}", weekly_hours: 2.00 }
              as: LearningSpecialist
              captures: { a40_id: $.data.id }
            - call: "POST /athletics/tutor-assignments/${a40_id}/status"
              payload: { action: "ACTIVATE" }
              as: LearningSpecialist
          trigger:
            - call: "POST /athletics/enrollments/${e40_id}/outcome"
              payload: { action: "DROP" }
              as: Registrar
          assert:
