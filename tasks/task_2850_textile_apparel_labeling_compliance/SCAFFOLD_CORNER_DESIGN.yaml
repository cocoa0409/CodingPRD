            - "${sh1_deadline} == ${sh2_deadline} == \"2026-08-31T00:00:00Z\" - review_decided_at plus 30 days"
            - "First correction at the deadline instant: HTTP 200 with ${sh2_state} == \"MARKING_CORRECTED\" and ${sh2_units} == 1000 - the comparison is at-or-before, so the deadline itself is still inside the window"
