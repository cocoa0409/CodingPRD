        grounds:
          - state_machines.MarketReport.AGG_PENDING_to_AGG_COMPUTED
          - state_machines.MarketReport.DISC_UNREVIEWED_to_DISC_CLEARED
          - state_machines.MarketReport.PUB_UNPUBLISHED_to_PUB_PUBLISHED
          - entities.MarketReport.fields.aggregation_state
          - entities.MarketReport.fields.disclosure_state
          - entities.MarketReport.fields.publication_state
