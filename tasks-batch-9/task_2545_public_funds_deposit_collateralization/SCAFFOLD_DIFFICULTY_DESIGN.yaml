# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2545_public_funds_deposit_collateralization
# Nine §0.5 rule_ids, 20 instances. Every literal in `assert:` was computed by
# executing the §1.3 formula with its declared constants.
# Logical clock starts at DEFAULT_CLOCK_UTC 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: insured_amount_aggregated_vs_per_account_basis
        grounds:
          - calculations.insured_amount_determination
          - entities.Depository.fields.insurance_determination_basis
          - entities.DepositAccount.fields.group_sequence
          - entities.DepositAccount.fields.uninsured_amount_cents
        distinguishing_aspect: |
          The same two balances (20,000,000 and 30,000,000 cents) in one insurance group produce
          uninsured_amount_cents 25,000,000 on the second account under AGGREGATED_BY_UNIT (one shared
          25,000,000-cent bucket consumed in group_sequence ASC order) but only 5,000,000 under
          PER_ACCOUNT (a private bucket per account) — a 20,000,000-cent divergence that flows straight
          into required_collateral_cents (26,250,000 vs 5,250,000).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One public unit (Ridge County, DEDICATED preference, statutory_max_deposit_cents 100,000,000,000)."
            - "Two APPROVED well-capitalized depositories: DEP-AGG with insurance_determination_basis AGGREGATED_BY_UNIT, DEP-PER with PER_ACCOUNT."
            - "At each depository the unit holds two DEMAND accounts funded with 20,000,000 and 30,000,000 cents, created in that order so group_sequence is 1 then 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /public-units"
              payload: { name: "Ridge County", unit_type: "COUNTY", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000000, collateral_program_preference: "DEDICATED", reporting_frequency: "MONTHLY" }
              as: StateRegulator
              captures: { unit_id: $.data.id }
            - call: "POST /depositories"
              payload: { name: "Aggregate National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200, insurance_determination_basis: "AGGREGATED_BY_UNIT" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_agg_id: $.data.id }
            - call: "POST /depositories/${dep_agg_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_agg_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_agg_id}/attest"
              payload: { attestation_note: "Capital and liquidity package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_agg_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_agg_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Eligible depository" }
              as: StateRegulator
            - call: "POST /depositories"
              payload: { name: "Per Account National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200, insurance_determination_basis: "PER_ACCOUNT" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_per_id: $.data.id }
            - call: "POST /depositories/${dep_per_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_per_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_per_id}/attest"
              payload: { attestation_note: "Capital and liquidity package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_per_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_per_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Eligible depository" }
              as: StateRegulator
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_agg_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { agg_a1_id: $.data.id }
            - call: "POST /deposit-accounts/${agg_a1_id}/deposits"
              payload: { amount_cents: 20000000 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_agg_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { agg_a2_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_per_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { per_a1_id: $.data.id }
            - call: "POST /deposit-accounts/${per_a1_id}/deposits"
              payload: { amount_cents: 20000000 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_per_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { per_a2_id: $.data.id }
          trigger:
            - call: "POST /deposit-accounts/${agg_a2_id}/deposits"
              payload: { amount_cents: 30000000 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "POST /deposit-accounts/${per_a2_id}/deposits"
              payload: { amount_cents: 30000000 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
          assert:
            - "DepositAccount.${agg_a2_id}.group_sequence == 2 and DepositAccount.${per_a2_id}.group_sequence == 2"
            - "DepositAccount.${agg_a1_id}.insured_amount_cents == 20000000 and DepositAccount.${agg_a1_id}.uninsured_amount_cents == 0"
            - "DepositAccount.${agg_a2_id}.insured_amount_cents == 5000000 and DepositAccount.${agg_a2_id}.uninsured_amount_cents == 25000000"
            - "DepositAccount.${agg_a2_id}.required_collateral_pct_bps == 10500 and DepositAccount.${agg_a2_id}.required_collateral_cents == 26250000"
            - "DepositAccount.${per_a2_id}.insured_amount_cents == 25000000 and DepositAccount.${per_a2_id}.uninsured_amount_cents == 5000000"
            - "DepositAccount.${per_a2_id}.required_collateral_pct_bps == 10500 and DepositAccount.${per_a2_id}.required_collateral_cents == 5250000"
            - "Variant delta on the second account: 26250000 - 5250000 == 21000000 cents of extra collateral demanded by AGGREGATED_BY_UNIT"
            - "In both variants insured_amount_cents + uninsured_amount_cents == ledger_balance_cents on every account"

      - name: runoff_projection_peak_window_vs_period_end
        grounds:
          - calculations.runoff_collateral_projection
          - entities.RunoffForecast.fields.basis
          - entities.RunoffForecast.fields.projected_required_collateral_cents
          - entities.RunoffForecast.fields.pledge_capacity_gap_cents
          - concurrency_rules[runoff-forecast-supersede-stale-account]
        distinguishing_aspect: |
          Over the identical three-window tax cycle (120,000,000 / 200,000,000 / 60,000,000 cents) the
          PEAK_WINDOW basis projects projected_required_collateral_cents 183,750,000 and
          pledge_capacity_gap_cents 85,750,000, while PERIOD_END projects 36,750,000 and gap 0 — the
          mid-horizon collection spike is invisible to PERIOD_END.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "APPROVED well-capitalized depository (capital_ratio_bps 1200) holding one FUNDED DEDICATED DEMAND account with ledger_balance_cents 100,000,000 (required_collateral_pct_bps 10500)."
            - "One ELIGIBLE unpledged US_TREASURY asset, par 100,000,000 cents priced at 10000 bps (collateral value 98,000,000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /custodians"
              payload: { name: "First Custody Bank", custodian_type: "TRUST_BANK", tri_party_capable: true, concentration_limit_bps: 10000 }
              as: StateRegulator
              captures: { cust_id: $.data.id }
            - call: "POST /custodians/${cust_id}/approve"
              payload: {}
              as: StateRegulator
            - call: "POST /public-units"
              payload: { name: "Ridge County", unit_type: "COUNTY", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000000, collateral_program_preference: "DEDICATED", reporting_frequency: "MONTHLY" }
              as: StateRegulator
              captures: { unit_id: $.data.id }
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200, insurance_determination_basis: "AGGREGATED_BY_UNIT" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
            - call: "POST /depositories/${dep_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_id: $.data.id }
            - call: "POST /deposit-accounts/${acct_id}/deposits"
              payload: { amount_cents: 100000000 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "POST /collateral-assets"
              payload: { depository_id: "${dep_id}", custodian_id: "${cust_id}", cusip: "912828AA1", asset_type: "US_TREASURY", par_value_cents: 100000000, market_price_bps: 10000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { asset_id: $.data.id }
            - call: "GET /deposit-accounts/${acct_id}"
              payload: {}
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_v1: $.data.version }
          trigger:
            - call: "POST /runoff-forecasts"
              payload: { deposit_account_id: "${acct_id}", cycle_label: "TAX_COLLECTION", basis: "PEAK_WINDOW", horizon_start: "2026-08-01T00:00:00Z", horizon_end: "2026-08-31T00:00:00Z", projected_windows: [ { window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-11T00:00:00Z", projected_balance_cents: 120000000 }, { window_start: "2026-08-11T00:00:00Z", window_end: "2026-08-21T00:00:00Z", projected_balance_cents: 200000000 }, { window_start: "2026-08-21T00:00:00Z", window_end: "2026-08-31T00:00:00Z", projected_balance_cents: 60000000 } ], expected_deposit_account_version: "${acct_v1}" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { fc_peak_id: $.data.id }
            - call: "GET /deposit-accounts/${acct_id}"
              payload: {}
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_v2: $.data.version }
            - call: "POST /runoff-forecasts"
              payload: { deposit_account_id: "${acct_id}", cycle_label: "DISBURSEMENT", basis: "PERIOD_END", horizon_start: "2026-08-01T00:00:00Z", horizon_end: "2026-08-31T00:00:00Z", projected_windows: [ { window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-11T00:00:00Z", projected_balance_cents: 120000000 }, { window_start: "2026-08-11T00:00:00Z", window_end: "2026-08-21T00:00:00Z", projected_balance_cents: 200000000 }, { window_start: "2026-08-21T00:00:00Z", window_end: "2026-08-31T00:00:00Z", projected_balance_cents: 60000000 } ], expected_deposit_account_version: "${acct_v2}" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { fc_end_id: $.data.id }
          assert:
            - "RunoffForecast.${fc_peak_id}.projected_peak_balance_cents == 200000000"
            - "RunoffForecast.${fc_peak_id}.projected_required_collateral_cents == 183750000"
            - "RunoffForecast.${fc_peak_id}.unpledged_capacity_cents == 98000000"
            - "RunoffForecast.${fc_peak_id}.pledge_capacity_gap_cents == 85750000"
            - "RunoffForecast.${fc_end_id}.projected_peak_balance_cents == 200000000"
            - "RunoffForecast.${fc_end_id}.projected_required_collateral_cents == 36750000"
            - "RunoffForecast.${fc_end_id}.unpledged_capacity_cents == 98000000"
            - "RunoffForecast.${fc_end_id}.pledge_capacity_gap_cents == 0"
            - "Both forecasts stay status OPEN (different cycle_label values, so neither supersedes the other)"

      - name: risk_grade_supervisory_single_run_vs_internal_trailing_average
        grounds:
          - calculations.depository_risk_grade
          - calculations.mtm_run_evaluation
          - entities.MarkToMarketRun.fields.basis
          - entities.MarkToMarketRun.fields.risk_score_bps
          - concurrency_rules[mtm-run-create-stale-depository]
        distinguishing_aspect: |
          Runs 2 (SUPERVISORY) and 3 (INTERNAL) see identical current-run components
          (coverage 10000, volatility 10000, documentation 10000), yet SUPERVISORY scores
          risk_score_bps 10000 / grade A while INTERNAL averages each component over the trailing
          three runs (6667 / 9167 / 6667) and scores 7417 / grade B.
        test_recipe:
          setup:
            - "Clock held at 2026-08-01T00:00:00Z for all three runs, so every run's as_of is 2026-08-01T00:00:00Z."
            - "APPROVED well-capitalized depository, one FUNDED DEDICATED DEMAND account with balance 100,000,000 (required_collateral_cents 78,750,000)."
            - "Run 1 (SUPERVISORY) executes with zero pledged collateral and no executed agreement, so all three components are at their floor."
            - "An EXECUTED dedicated pledge agreement then pledges par 96,428,571 of a US_TREASURY asset priced at 10000 bps (collateral value 94,500,000 == 12000 bps of the requirement)."
            - "Runs 2 (SUPERVISORY) and 3 (INTERNAL) then execute over later, non-overlapping closed windows separated by more than MTM_MIN_GAP_HOURS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /custodians"
              payload: { name: "First Custody Bank", custodian_type: "TRUST_BANK", tri_party_capable: true, concentration_limit_bps: 10000 }
              as: StateRegulator
              captures: { cust_id: $.data.id }
            - call: "POST /custodians/${cust_id}/approve"
              payload: {}
              as: StateRegulator
            - call: "POST /public-units"
              payload: { name: "Ridge County", unit_type: "COUNTY", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000000, collateral_program_preference: "DEDICATED", reporting_frequency: "MONTHLY" }
              as: StateRegulator
              captures: { unit_id: $.data.id }
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200, insurance_determination_basis: "AGGREGATED_BY_UNIT" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
            - call: "POST /depositories/${dep_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_id: $.data.id }
            - call: "POST /deposit-accounts/${acct_id}/deposits"
              payload: { amount_cents: 100000000 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "GET /depositories/${dep_id}"
              payload: {}
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_v1: $.data.version }
            - call: "POST /depositories/${dep_id}/mtm-runs"
              payload: { window_start: "2026-07-30T00:00:00Z", window_end: "2026-07-30T06:00:00Z", basis: "SUPERVISORY", expected_depository_version: "${dep_v1}" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { run1_id: $.data.id }
            - call: "POST /pledge-agreements"
              payload: { depository_id: "${dep_id}", custodian_id: "${cust_id}", beneficiary_type: "DEPOSIT_ACCOUNT", deposit_account_id: "${acct_id}", agreement_number: "AG-0001", governing_law_state: "OH" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { ag_id: $.data.id }
            - call: "POST /pledge-agreements/${ag_id}/circulate"
              payload: {}
              as: BankCollateralOfficer
              as_user_id: "officer-1"
            - call: "POST /pledge-agreements/${ag_id}/signatures"
              payload: { party: "DEPOSITORY" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /pledge-agreements/${ag_id}/signatures"
              payload: { party: "PUBLIC_UNIT" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "POST /pledge-agreements/${ag_id}/signatures"
              payload: { party: "CUSTODIAN" }
              as: Custodian
              as_user_id: "${cust_id}"
              captures: { ag_v: $.data.version }
            - call: "POST /collateral-assets"
              payload: { depository_id: "${dep_id}", custodian_id: "${cust_id}", cusip: "912828AA1", asset_type: "US_TREASURY", par_value_cents: 96428571, market_price_bps: 10000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { asset_id: $.data.id }
            - call: "POST /pledge-allocations"
              payload: { pledge_agreement_id: "${ag_id}", collateral_asset_id: "${asset_id}", allocated_par_cents: 96428571, effective_from: "2026-08-01T00:00:00Z", expected_pledge_agreement_version: "${ag_v}" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "GET /depositories/${dep_id}"
              payload: {}
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_v2: $.data.version }
            - call: "POST /depositories/${dep_id}/mtm-runs"
              payload: { window_start: "2026-07-30T12:00:00Z", window_end: "2026-07-30T18:00:00Z", basis: "SUPERVISORY", expected_depository_version: "${dep_v2}" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { run2_id: $.data.id }
            - call: "GET /depositories/${dep_id}"
              payload: {}
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_v3: $.data.version }
            - call: "POST /depositories/${dep_id}/mtm-runs"
              payload: { window_start: "2026-07-31T00:00:00Z", window_end: "2026-07-31T06:00:00Z", basis: "INTERNAL", expected_depository_version: "${dep_v3}" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { run3_id: $.data.id }
          assert:
            - "MarkToMarketRun.${run1_id}.coverage_component_bps == 0 and volatility_component_bps == 7500 and documentation_component_bps == 0"
            - "MarkToMarketRun.${run1_id}.risk_score_bps == 2250 and risk_grade_assigned == D"
            - "PledgeAllocation.${alloc_id}.allocated_collateral_value_cents == 94500000"
            - "MarkToMarketRun.${run2_id}.total_required_collateral_cents == 78750000 and total_collateral_value_cents == 94500000 and outcome == SUFFICIENT"
            - "MarkToMarketRun.${run2_id}.coverage_component_bps == 10000 and volatility_component_bps == 10000 and documentation_component_bps == 10000"
            - "MarkToMarketRun.${run2_id}.risk_score_bps == 10000 and risk_grade_assigned == A"
            - "MarkToMarketRun.${run3_id}.coverage_component_bps == 10000 and volatility_component_bps == 10000 and documentation_component_bps == 10000"
            - "MarkToMarketRun.${run3_id}.risk_score_bps == 7417 and risk_grade_assigned == B"
            - "Depository.${dep_id}.risk_score_bps == 7417 and Depository.${dep_id}.risk_grade == B after run 3"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: required_pct_tier_and_pledging_mode_surcharge_composition
        grounds:
          - calculations.required_collateral_percentage
          - entities.Depository.fields.capital_tier
          - entities.DepositAccount.fields.pledging_mode
          - validations[priority=63]
        distinguishing_aspect: |
          Mode (a) different constant sets: the same uninsured 75,000,000 cents at one
          UNDERCAPITALIZED depository yields required_collateral_pct_bps 12500 / 93,750,000 cents for a
          DEDICATED account but 13000 / 97,500,000 cents for a POOLED account, because
          TIER_REQUIRED_PCT_BPS[UNDERCAPITALIZED] and PLEDGING_MODE_SURCHARGE_BPS[POOLED] compose
          additively before the MAX_REQUIRED_PCT_BPS cap.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Pooled collateral program (minimum_pool_pct_bps 10000)."
            - "APPROVED depository with capital_ratio_bps 700 (UNDERCAPITALIZED) that is a member of that program."
            - "Two public units at that depository: Ridge County (DEDICATED preference) and Ridge Schools (POOLED preference), each with one DEMAND account funded with 100,000,000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /pooled-programs"
              payload: { name: "Ohio Public Deposit Pool", administrator_state: "OH", minimum_pool_pct_bps: 10000 }
              as: StateRegulator
              captures: { pool_id: $.data.id }
            - call: "POST /public-units"
