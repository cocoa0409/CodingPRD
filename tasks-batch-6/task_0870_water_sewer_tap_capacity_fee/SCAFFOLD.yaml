    roles: [FieldInspector]
    code: 200
    input: ["scheduled_start?", "scheduled_end?"]
    output: Inspection
    side_effects: ["status -> SCHEDULED", "book inspector window"]
  - method: POST
    path: "/inspections/{id}/start"
    description: Start a scheduled inspection.
    roles: [FieldInspector]
    code: 200
    input: []
    output: Inspection
