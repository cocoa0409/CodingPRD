            - "${chargeable} == 15.68 and ${load} == 12.75"
            - "${nameplate} == 200.00, ${airflow} == 119.08, ${capacity} == 119.08 and ${margin} == 106.33"
            - "${posture} == NOMINAL, ${release} == OPEN, ${leak} == 5.00"
            - "${total} == 1, ${ops} == 1, ${fitout} == 0, ${at_risk} == 0 and ${open_mops} == 0"
            - "every one of those values equals the same-named field on GET /halls/${hall_id}"

      - name: security_device_and_rack_listings_filter_and_paginate
        claim_type: standard_crud
        grounds:
          - endpoints[GET /racks]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /racks combines a filter with paging in one request: with three racks in hall CX65 and one in CX66, page_size 2 on hall CX65 returns 2 rows with total_count 3 and has_more true, and page 2 returns the remaining row with has_more false."
        test_recipe:
          setup:
            - "Hall CX65 owns containment zone CA-1 and racks at (1,1), (1,2) and (1,3); hall CX66 owns zone CA-2 and one rack at (1,1)."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 65", code: "CX65", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_a_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_a_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone_a_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_a_id}", containment_zone_id: "${zone_a_id}", grid_row: "1", grid_col: 1, design_kw: 10.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
            - call: "POST /racks"
              payload: { hall_id: "${hall_a_id}", containment_zone_id: "${zone_a_id}", grid_row: "1", grid_col: 2, design_kw: 10.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
            - call: "POST /racks"
              payload: { hall_id: "${hall_a_id}", containment_zone_id: "${zone_a_id}", grid_row: "1", grid_col: 3, design_kw: 10.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
            - call: "POST /halls"
              payload: { name: "Corner Hall 66", code: "CX66", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_b_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_b_id}", label: "CA-2", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone_b_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_b_id}", containment_zone_id: "${zone_b_id}", grid_row: "1", grid_col: 1, design_kw: 10.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
          trigger:
            - call: "GET /racks?hall_id=${hall_a_id}&page=1&page_size=2"
              payload: {}
              as: FacilityPlanner
            - call: "GET /racks?hall_id=${hall_a_id}&page=2&page_size=2"
              payload: {}
              as: FacilityPlanner
          assert:
            - "page 1 returns 200 with exactly 2 rows, total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "page 2 returns 200 with exactly 1 row, total_count == 3, limit == 2, offset == 2 and has_more == false"
            - "no row from hall ${hall_b_id} appears in either page"
            - "the union of both pages is exactly the three racks of hall ${hall_a_id} with no duplicates"

      - name: mop_execute_action_endpoint_side_effects
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mops/{mop_id}/execute]
        excluded_because:
          difficulty_instance: transitive_cascade / mop_execute_busway_isolation_cascade_depth_four
          rationale: "That §1.8 instance exercises every declared side effect of the execute endpoint — pre_execution_target_state capture, executed_at stamping, the busway isolation cascade and the hall posture flip — in one call."

      - name: rack_feed_delete_endpoint_side_effects
        claim_type: standard_crud
        grounds:
          - endpoints[DELETE /rack-feeds/{feed_id}]
        excluded_because:
          difficulty_instance: compensating_invariant / feed_reserve_then_delete_conserves_hall_power_ledger
          rationale: "That §1.8 instance covers the delete's full contract: status RELEASED, released_at stamped, busway and hall ledger fields rolled back to their pre-reservation values."

  # =========================================================================
  # SECTION: errors  (§1.6 — every error code must be triggerable)
  # =========================================================================
  - section: errors
    instances:
      - name: auth_ladder_missing_role_wrong_role_and_missing_user_id
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_UNAUTHENTICATED] (401, X-User-Role header missing or not a role declared in §1.7)"
          - "errors[ERR_UNAUTHORIZED] (403, the acting role is not listed for the endpoint in §1.5)"
          - "errors[ERR_MISSING_USER_ID] (401, X-User-ID missing on an endpoint that records or compares an acting identity)"
          - "endpoints[POST /halls].roles = [FacilityPlanner]"
          - "endpoints[POST /mops].roles = [ElectricalContractor, MechanicalContractor] and records author_user_id from X-User-ID"
        distinguishing_aspect: "Separates the three authentication/authorization failures that all look like 'you may not do that': an absent or unknown role header is 401 ERR_UNAUTHENTICATED, a known-but-wrong role is 403 ERR_UNAUTHORIZED, and a correct role with no X-User-ID on an identity-recording endpoint is 401 ERR_MISSING_USER_ID. An implementation that collapses these into a single 403, or that lets an identity-recording endpoint mint a MOP with a null author_user_id, fails."
        test_recipe:
          setup: "One hall CX67 in PLANNING with one commissioned-path PDU and one busway so that POST /mops has a resolvable target."
          setup_api_calls:
            - name: create_hall
              call: "POST /halls"
              as: FacilityPlanner
              payload: { name: "Auth Ladder Hall", code: "CX67", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              captures: { hall_id: "$.data.id" }
            - name: create_pdu_a
              call: "POST /pdus"
              as: ElectricalContractor
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              captures: { pdu_a: "$.data.id" }
            - name: create_busway_a
              call: "POST /busways"
              as: ElectricalContractor
              payload: { pdu_id: "${pdu_a}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              captures: { bw_a: "$.data.id" }
          trigger:
            - name: create_hall_without_role_header_is_unauthenticated
              call: "POST /halls"
              as: "__NO_ROLE_HEADER__"
              payload: { name: "No Role", code: "CX67X", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 100.00, gross_area_sqm: 200.0, cooling_redundancy: "N", planned_rack_count: 2 }
              captures: { err_noauth: "$.data.error_id" }
            - name: create_hall_with_unknown_role_header_is_unauthenticated
              call: "POST /halls"
              as: "DataCenterJanitor"
              payload: { name: "Unknown Role", code: "CX67Y", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 100.00, gross_area_sqm: 200.0, cooling_redundancy: "N", planned_rack_count: 2 }
              captures: { err_unknown: "$.data.error_id" }
            - name: create_hall_as_electrical_contractor_is_unauthorized
              call: "POST /halls"
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              payload: { name: "Wrong Role", code: "CX67Z", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 100.00, gross_area_sqm: 200.0, cooling_redundancy: "N", planned_rack_count: 2 }
              captures: { err_forbidden: "$.data.error_id" }
            - name: create_mop_without_user_id_header_is_rejected
              call: "POST /mops"
              as: ElectricalContractor
              as_user_id: "__NO_USER_ID_HEADER__"
              payload: { hall_id: "${hall_id}", target_resource_type: "BUSWAY", target_resource_id: "${bw_a}", title: "Anonymous MOP", risk_class: "LOW", backout_plan: "de-energize", window_start: "2026-08-10T02:00:00Z", window_end: "2026-08-10T06:00:00Z" }
              captures: { err_nouser: "$.data.error_id" }
          assert:
            - "create_hall_without_role_header_is_unauthenticated -> 401, error_id == ERR_UNAUTHENTICATED"
            - "create_hall_with_unknown_role_header_is_unauthenticated -> 401, error_id == ERR_UNAUTHENTICATED (an out-of-catalogue role string is treated as unauthenticated, not as 403)"
            - "create_hall_as_electrical_contractor_is_unauthorized -> 403, error_id == ERR_UNAUTHORIZED"
            - "create_mop_without_user_id_header_is_rejected -> 401, error_id == ERR_MISSING_USER_ID"
            - "GET /halls?code=CX67X as FacilityPlanner -> 200, data == [] (no hall was created by any of the four rejected calls)"
            - "GET /mops?hall_id=${hall_id} as FacilityPlanner -> 200, total_count == 0"

      - name: every_path_identifier_has_its_own_not_found_code
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_HALL_NOT_FOUND], errors[ERR_TENANT_NOT_FOUND], errors[ERR_PDU_NOT_FOUND], errors[ERR_BUSWAY_NOT_FOUND], errors[ERR_RACK_NOT_FOUND], errors[ERR_RACK_FEED_NOT_FOUND], errors[ERR_COOLING_UNIT_NOT_FOUND], errors[ERR_CONTAINMENT_ZONE_NOT_FOUND], errors[ERR_CAGE_NOT_FOUND], errors[ERR_SECURITY_DEVICE_NOT_FOUND], errors[ERR_PACKAGE_NOT_FOUND], errors[ERR_LOAD_BANK_TEST_NOT_FOUND], errors[ERR_MOP_NOT_FOUND], errors[ERR_RELEASE_PACKET_NOT_FOUND] — all 404"
          - "§1.5 declares a GET /{id} read for all fourteen entity families"
        distinguishing_aspect: "Every one of the fourteen entity families returns its OWN 404 code rather than a generic ERR_NOT_FOUND, and the codes are not cross-wired (a bogus rack id must never answer ERR_HALL_NOT_FOUND). One hall exists in the database, so a wrong id cannot be confused with an empty store."
        test_recipe:
          setup: "A single hall CX68 exists so that the fourteen probes address a populated database with wrong identifiers rather than an empty one."
          setup_api_calls:
            - name: create_hall
              call: "POST /halls"
              as: FacilityPlanner
