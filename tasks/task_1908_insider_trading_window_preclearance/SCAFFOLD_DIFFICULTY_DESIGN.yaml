  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: quarterly_window_half_open_adjacency
        grounds:
          - validations[priority=14]
          - calculations.blackout_interval_merge
        distinguishing_aspect: |
          Resource BlackoutWindow (QUARTERLY kind) with half-open [start_at, end_at)
          semantics: a window starting exactly at another's end_at (2026-09-30T00:00:00Z) is
          adjacent, not overlapping, and is accepted; a window overlapping by one day is
          rejected with ERR_DUPLICATE_QUARTER_WINDOW. Different interval semantics than the
          closed-containment approval lane in approval_lane_closed_interval_containment.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; QUARTERLY Q3 window [2026-07-01, 2026-09-30) exists SCHEDULED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer Fourteen", email: "officer14@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /blackout-windows"
              payload: { kind: "QUARTERLY", fiscal_year: 2026, fiscal_quarter: "Q3", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /blackout-windows"
              payload: { kind: "QUARTERLY", fiscal_year: 2026, fiscal_quarter: "Q4", start_at: "2026-09-30T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { w2_id: $.data.id, w2_status: $.data.status }
            - call: "POST /blackout-windows"
              payload: { kind: "QUARTERLY", fiscal_year: 2026, fiscal_quarter: "Q4", start_at: "2026-09-29T00:00:00Z", end_at: "2026-12-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "w2_status == SCHEDULED (adjacent half-open intervals: end_at == start_at is allowed)"
            - "err == ERR_DUPLICATE_QUARTER_WINDOW (one-day overlap with [2026-07-01, 2026-09-30) rejected)"

