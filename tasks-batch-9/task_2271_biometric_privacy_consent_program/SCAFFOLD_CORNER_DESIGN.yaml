      - name: contract_score_rounds_each_clause_then_sums_gating_execution_at_the_floor
        claim_type: weighted_scoring
        grounds:
          - calculations.vendor_contract_compliance_score
          - state_machines.VendorContract.APPROVED_to_EXECUTED
          - errors[ERR_CONTRACT_SCORE_BELOW_FLOOR]
        distinguishing_aspect: "The four weights are re-scored twice as the attestation advances, and the per-clause rounding is visible in the cents: at factor 0.715 the clauses round to 25.03 + 17.88 + 21.45 + 0.00 = 64.36, where summing the raw products first would have produced 64.35. Execution is refused at 64.36 and 76.96 and only succeeds at 90.00."
        test_recipe:
          setup:
            - "One ComplianceProgram and one Vendor (sells_biometric_data false, subprocessor_count 0, deletion_sla_days 15, disclosure complete) left at attestation_status NOT_REQUESTED."
            - "One VendorContract with all three clauses present but deletion_deadline_days 45, i.e. beyond DELETION_DEADLINE_TARGET_DAYS, so the fourth clause scores zero throughout."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /vendors"
              payload: { program_id: "${prog_id}", name: "ClockPoint Systems", sells_biometric_data: false, subprocessor_count: 0, deletion_sla_days: 15, subprocessor_disclosure_complete: true }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_id: "${v1_id}", prohibits_sale: true, restricts_disclosure: true, requires_deletion_on_termination: true, deletion_deadline_days: 45, indemnity_cap_cents: 5000000, effective_from: "2026-08-01T00:00:00Z" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { k1_id: $.data.id }
            - call: "POST /vendor-contracts/${k1_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { score_not_requested: $.data.compliance_score }
          trigger:
            - call: "POST /vendor-contracts/${k1_id}/transitions"
              payload: { to_status: "EXECUTED" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { err: $.data.error_id }
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "REQUESTED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "GET /vendor-contracts/${k1_id}"
              as: VendorManager
              as_user_id: "vm-1"
              captures: { score_requested: $.data.compliance_score }
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "RECEIVED" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /vendor-contracts/${k1_id}/transitions"
              payload: { to_status: "EXECUTED" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { final_status: $.data.status, score_received: $.data.compliance_score }
          assert:
            - "${score_not_requested} == 64.36 exactly (25.03 + 17.88 + 21.45 + 0.00), NOT 64.35 from rounding a single summed product"
            - "First trigger: HTTP 422 with data.error_id == ERR_CONTRACT_SCORE_BELOW_FLOOR and the contract stays APPROVED"
            - "${score_requested} == 76.96 (29.93 + 21.38 + 25.65 + 0.00) after the attestation endpoint re-scored the non-terminal contract"
            - "${score_received} == 90.00 (35.00 + 25.00 + 30.00 + 0.00) and ${final_status} == EXECUTED"
            - "Vendor risk_score falls 40 -> 30 -> 20 across the two attestation calls"

      - name: overdue_deletion_obligation_propagates_a_freeze_across_the_program
        claim_type: constraint_propagation
        grounds:
          - calculations.program_posture
