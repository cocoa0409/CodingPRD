            - "The second trigger call returns 409 with error_id ERR_INVALID_STATE"
            - "Grievance.${grv_b}.status == WITHDRAWN"
            - "Grievance.${grv_b}.outcome == WITHDRAWN"

      - name: mortality_review_close_requires_corrective_action
        claim_type: Precondition Enforcement
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_MORTALITY_REVIEW_INCOMPLETE]"
          - calculations.mortality_review_due_at
          - entities.MortalityReview.fields.closed_late
        distinguishing_aspect: "Closing an OPEN review with zero corrective actions returns 422 ERR_MORTALITY_REVIEW_INCOMPLETE; after one action is attached the close succeeds and closed_late is true because 2026-06-01T00:00:00Z is strictly after the 2026-05-31T00:00:00Z statutory deadline."
        test_recipe:
          setup:
            - "One inmate whose death was recorded at 2026-05-01T00:00:00Z, producing an OPEN MortalityReview due 2026-05-31T00:00:00Z."
            - "Clock advanced to 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2190", full_name: "Kit Mbeki", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /inmates/${inm}/death-event"
              payload: { death_at: "2026-05-01T00:00:00Z", manner: "NATURAL" }
              as: HealthServicesAdmin
              captures: { mr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /mortality-reviews/${mr}/close"
              payload: {}
              as: HealthServicesAdmin
            - call: "POST /mortality-reviews/${mr}/corrective-actions"
              payload: { action_text: "retrain night shift on hourly checks" }
              as: HealthServicesAdmin
            - call: "POST /mortality-reviews/${mr}/close"
              payload: {}
              as: HealthServicesAdmin
          assert:
            - "The first trigger call returns 422 with error_id ERR_MORTALITY_REVIEW_INCOMPLETE"
            - "MortalityReview.${mr}.due_at == 2026-05-31T00:00:00.000Z"
            - "MortalityReview.${mr}.corrective_action_count == 1"
            - "MortalityReview.${mr}.status == CLOSED"
            - "MortalityReview.${mr}.closed_at == 2026-06-01T00:00:00.000Z"
            - "MortalityReview.${mr}.closed_late == true"

      - name: death_event_cannot_be_recorded_twice
        claim_type: Idempotency
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A second death-event for the same inmate returns 409 ERR_INVALID_STATE and creates no second MortalityReview."
        test_recipe:
