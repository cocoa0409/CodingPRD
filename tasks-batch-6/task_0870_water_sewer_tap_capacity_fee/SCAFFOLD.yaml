scenario: |
  Water/Sewer Tap & Capacity Fee: connection application & meter-size, tap/impact (capacity) fee
  calculation, availability & main-extension, inspection & meter-set, developer agreement & escrow,
  backflow requirement, activation & account, latecomer/reimbursement

domain_name: water-sewer-tap-capacity-fee
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities (application, agreement, project, inspection, meter-set, account) linked
  # by explicit foreign keys in bodies; no deep URL nesting except escrow-transaction event log.

  state_machine_shape: cyclic
  # ConnectionApplication has a UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED revision loop and
  # Inspection has a FAILED -> SCHEDULED reinspection loop; other machines branch/converge.

  relationship_patterns:
    - one_to_many          # Application 1..* Inspection; DeveloperAgreement 1..* EscrowTransaction
    - cross_aggregate      # LatecomerReimbursement references both MainExtensionProject and a benefiting Application
    - flat_with_references # FK links, not nested ownership trees

  role_model: segregation_of_duties
  # The reviewer who records the availability determination cannot be the reviewer who approves the
  # same application (four-eyes). Field work is entity-backed to an Inspector.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MeterSizeSchedule
    parent: null
    common_fields: true
    description: Configuration row mapping a nominal meter size to its capacity (ERU) factor and tap install fee.
    fields:
      - name: meter_size
        type: enum
        source: input
        description: Nominal meter size key; unique across schedule rows.
        constraints: "one of {FIVE_EIGHTH, THREE_QUARTER, ONE, ONE_AND_HALF, TWO}; unique"
      - name: eru_factor
        type: number
        source: input
        description: AWWA hydraulic-capacity ratio expressed in Equivalent Residential Units for this meter size.
        constraints: "> 0"
      - name: tap_install_fee_cents
        type: integer
        source: input
        description: Flat tap/meter-installation labor+materials fee for this meter size, in cents.
        constraints: ">= 0"

  - name: FeeSchedule
    parent: null
    common_fields: true
    description: Singleton-style rate card for capacity fees, admin fee, and volume discount. The most recently created row with is_active true governs assessments.
    fields:
      - name: is_active
        type: boolean
        source: input
        default: true
        description: Whether this rate card is the governing card; assessment uses the latest is_active=true row by created_at.
      - name: water_capacity_fee_per_eru_cents
        type: integer
        source: input
        description: Water capacity (impact) fee per ERU, in cents.
        constraints: ">= 0"
      - name: sewer_capacity_fee_per_eru_cents
        type: integer
        source: input
        description: Sewer capacity (impact) fee per ERU, in cents.
        constraints: ">= 0"
      - name: use_multipliers
        type: object
        source: input
        description: "Capacity-fee multiplier by use_type, e.g. {RESIDENTIAL:1.00, COMMERCIAL:1.15, IRRIGATION:1.30}."
      - name: admin_fee_pct
        type: number
        source: input
        description: Administrative fee as a fraction of (capacity_fee + tap_fee) subtotal.
        constraints: ">= 0"
      - name: admin_fee_cap_cents
        type: integer
        source: input
        description: Upper cap on the computed administrative fee, in cents.
        constraints: ">= 0"
      - name: volume_discount_threshold_cents
        type: integer
        source: input
        description: Gross-amount threshold at or above which the volume discount applies.
        constraints: ">= 0"
      - name: volume_discount_pct
        type: number
        source: input
        description: Fractional discount applied to gross when gross >= volume_discount_threshold_cents.
        constraints: ">= 0"
      - name: pavement_cut_surcharge_cents
        type: integer
        source: input
        description: Surcharge added to the tap fee when the connection requires a pavement cut, in cents.
        constraints: ">= 0"

  - name: Inspector
    parent: null
    common_fields: true
    description: Field inspector resource; inspections book time windows against an inspector.
    fields:
      - name: name
        type: string
        source: input
        description: Inspector display name.
      - name: active
        type: boolean
        source: input
        default: true
        description: Whether the inspector may be assigned new inspections.

  - name: MeterCrew
    parent: null
    common_fields: true
    description: Field meter-set crew resource; meter-set appointments book windows against a crew.
    fields:
      - name: name
        type: string
        source: input
        description: Crew display name.
      - name: active
        type: boolean
        source: input
        default: true
        description: Whether the crew may be assigned new appointments.

  - name: ConnectionApplication
    parent: null
    common_fields: true
    description: Core resource. A parcel owner's/developer's request to connect to the public water and/or sewer system.
    fields:
      - name: applicant_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the Applicant who owns this application.
      - name: parcel_id
        type: string
        source: input
        description: Assessor parcel number for the connecting property.
      - name: service_type
        type: enum
        source: input
        description: Which utilities are being connected.
        constraints: "one of {WATER, SEWER, BOTH}"
      - name: meter_size
        type: enum
        source: input
        description: Requested meter size; must match a MeterSizeSchedule.meter_size.
        constraints: "one of {FIVE_EIGHTH, THREE_QUARTER, ONE, ONE_AND_HALF, TWO}"
      - name: use_type
        type: enum
        source: input
        description: Use classification driving the capacity-fee multiplier.
        constraints: "one of {RESIDENTIAL, COMMERCIAL, IRRIGATION}"
      - name: requires_pavement_cut
        type: boolean
        source: input
        default: false
        description: Whether tap installation requires cutting pavement (adds surcharge to tap fee).
      - name: prior_credit_eru
        type: number
        source: input
        default: 0
        description: ERU credit for a prior/abandoned connection on the parcel; drives the REDEVELOPMENT capacity-fee variant.
        constraints: ">= 0"
      - name: assessment_basis
        type: enum
        source: input
        default: NEW
        description: Selects the capacity-fee variant. NEW uses full ERU; REDEVELOPMENT nets out prior_credit_eru.
        constraints: "one of {NEW, REDEVELOPMENT}"
      - name: availability_reviewer_id
        type: string
        source: system
        description: Opaque X-User-ID of the UtilityReviewer who recorded the availability determination; SoD compares this against the approver.
      - name: backflow_required
        type: boolean
        source: computed
        description: True when use_type in {COMMERCIAL, IRRIGATION}; computed at approval; drives BackflowAssembly creation.
      - name: capacity_fee_cents
        type: integer
        source: computed
        description: Result of the capacity_fee calculation; set at approval.
      - name: tap_fee_cents
        type: integer
        source: computed
        description: Result of the tap_installation_fee calculation; set at approval.
      - name: total_fees_due_cents
        type: integer
        source: computed
        description: Result of the total_fees_due calculation; set at approval.
      - name: fees_paid_cents
        type: integer
        source: system
        default: 0
        description: Cumulative amount paid toward total_fees_due_cents via the pay-fees endpoint.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Lifecycle state.
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, DENIED, READY_FOR_ACTIVATION, ACTIVATED, WITHDRAWN}"

  - name: AvailabilityDetermination
    parent: null
    common_fields: true
    description: A reviewer's finding of whether public mains front the parcel and how far the nearest main is.
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> ConnectionApplication.id"
      - name: distance_to_main_ft
        type: number
        source: input
        description: Distance in feet from the parcel connection point to the nearest usable public main.
        constraints: ">= 0"
      - name: water_main_available
        type: boolean
        source: computed
        description: True when service needs water and distance_to_main_ft <= MAX_CONNECTION_DISTANCE_FT; may be flipped true later when a main extension is accepted.
      - name: sewer_main_available
        type: boolean
        source: computed
        description: True when service needs sewer and distance_to_main_ft <= MAX_CONNECTION_DISTANCE_FT.
      - name: extension_required
        type: boolean
        source: computed
        description: True when any requested service's main is not available at this distance.

  - name: MainExtensionProject
    parent: null
    common_fields: true
    description: A developer-built extension of the public main when service is not available at the parcel. Also the reimbursement pool for latecomers.
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> ConnectionApplication.id"
      - name: developer_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the Developer who owns this project and its agreement.
      - name: length_ft
        type: number
        source: input
        description: Length of main to be built, in feet.
        constraints: "> 0"
      - name: estimated_cost_cents
        type: integer
        source: input
        description: Engineer's estimate of construction cost, in cents; drives required escrow.
        constraints: ">= 0"
      - name: total_assessable_front_ft
        type: number
        source: input
        description: Total benefiting frontage served by the extension; denominator for the FRONT_FOOTAGE latecomer method.
        constraints: "> 0"
      - name: total_assessable_area_sqft
        type: number
        source: input
        description: Total benefiting area served by the extension; denominator for the AREA latecomer method.
        constraints: "> 0"
      - name: actual_construction_cost_cents
        type: integer
        source: system
        description: Actual cost recorded at acceptance; set on transition to ACCEPTED.
      - name: reimbursable_principal_cents
        type: integer
        source: computed
        description: Recoverable principal set at acceptance = min(actual_construction_cost_cents, reimbursement_cap_cents).
      - name: reimbursed_collected_cents
        type: integer
        source: computed
        description: Sum of amount_cents over COLLECTED LatecomerReimbursements for this project.
      - name: outstanding_recoverable_cents
        type: integer
        source: computed
        description: reimbursable_principal_cents - reimbursed_collected_cents; conserved with reimbursed_collected_cents.
      - name: reimbursement_cap_cents
        type: integer
        source: input
        description: Contractual ceiling on recoverable principal, in cents.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: Lifecycle state.
        constraints: "one of {PROPOSED, APPROVED_TO_CONSTRUCT, UNDER_CONSTRUCTION, INSPECTED, ACCEPTED, CANCELLED}"

  - name: DeveloperAgreement
    parent: null
    common_fields: true
    description: The agreement + escrow account guaranteeing a MainExtensionProject. OCC parent for escrow drawdowns.
    fields:
      - name: main_extension_project_id
        type: string
        source: input
        description: "FK -> MainExtensionProject.id"
      - name: developer_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the Developer signing the agreement.
      - name: required_escrow_cents
        type: integer
        source: system
        description: Escrow the developer must deposit before execution; set at offer = project.estimated_cost_cents.
      - name: escrow_deposited_cents
        type: integer
        source: computed
        description: Sum of amount_cents over DEPOSIT EscrowTransactions.
      - name: escrow_drawn_cents
        type: integer
        source: computed
        description: Sum of amount_cents over DRAWDOWN EscrowTransactions.
      - name: escrow_refunded_cents
        type: integer
        source: computed
        description: Sum of amount_cents over REFUND EscrowTransactions.
      - name: escrow_held_cents
        type: integer
        source: computed
        description: escrow_deposited_cents - escrow_drawn_cents - escrow_refunded_cents; conserved (deposited == held + drawn + refunded).
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Lifecycle state.
        constraints: "one of {DRAFT, PENDING_ESCROW, EXECUTED, COMPLETION_PENDING, CLOSED, TERMINATED}"

  - name: EscrowTransaction
    parent: null
    common_fields: false
    description: Append-only ledger entry against a DeveloperAgreement's escrow. Immutable once written.
    fields:
      - name: developer_agreement_id
        type: string
        source: input
        description: "FK -> DeveloperAgreement.id"
      - name: txn_type
        type: enum
        source: input
        description: Ledger entry type.
        constraints: "one of {DEPOSIT, DRAWDOWN, REFUND}"
      - name: amount_cents
        type: integer
        source: input
        description: Positive magnitude of the entry, in cents.
        constraints: "> 0"
      - name: memo
        type: string
        source: input
        default: ""
        description: Free-text note.

  - name: Inspection
    parent: null
    common_fields: true
    description: A scheduled field inspection booked against an Inspector time window. Cyclic reinspection on failure.
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> ConnectionApplication.id"
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id"
      - name: inspection_type
        type: enum
        source: input
        description: Kind of inspection.
        constraints: "one of {TAP, METER_SET, BACKFLOW}"
      - name: scheduled_start
        type: datetime
        source: input
        description: Window start (ISO 8601 UTC); booked against the inspector using half-open [start, end) semantics.
      - name: scheduled_end
        type: datetime
        source: input
        description: Window end (ISO 8601 UTC); must be strictly after scheduled_start.
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: Lifecycle state.
        constraints: "one of {REQUESTED, SCHEDULED, IN_PROGRESS, PASSED, FAILED, CANCELLED}"

  - name: BackflowAssembly
    parent: null
    common_fields: true
    description: Backflow-prevention assembly required for COMMERCIAL/IRRIGATION connections; must be certified before activation.
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> ConnectionApplication.id"
      - name: serial_number
        type: string
        source: input
        default: ""
        description: Assembly serial number, recorded at install.
      - name: status
        type: enum
        source: system
        default: REQUIRED
        description: Lifecycle state.
        constraints: "one of {REQUIRED, INSTALLED, CERTIFIED, FAILED}"

  - name: MeterSet
    parent: null
    common_fields: true
    description: The physical meter installation; booked against a MeterCrew appointment window. Installed only after the tap inspection passes.
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> ConnectionApplication.id"
      - name: crew_id
        type: string
        source: input
        description: "FK -> MeterCrew.id"
      - name: appointment_start
        type: datetime
        source: input
        description: Appointment window start (ISO 8601 UTC); booked against the crew using closed interval + APPOINTMENT_BUFFER_MINUTES gap semantics.
      - name: appointment_end
        type: datetime
        source: input
        description: Appointment window end (ISO 8601 UTC); must be strictly after appointment_start.
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Lifecycle state.
        constraints: "one of {PENDING, SCHEDULED, SET, INSTALLED, REMOVED}"

  - name: ServiceAccount
    parent: null
    common_fields: true
    description: The activated utility billing account, created when an application is activated.
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> ConnectionApplication.id"
      - name: account_number
        type: string
        source: system
        description: System-generated account number.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Lifecycle state.
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}"

  - name: LatecomerReimbursement
    parent: null
    common_fields: true
    description: A latecomer fee assessed on a benefiting new connection, recovered and disbursed to the original developer. OCC child of MainExtensionProject.
    fields:
      - name: main_extension_project_id
        type: string
        source: input
        description: "FK -> MainExtensionProject.id"
      - name: benefiting_application_id
        type: string
        source: input
        description: "FK -> ConnectionApplication.id"
      - name: method
        type: enum
        source: input
        description: Cost-allocation method selecting the dual-variant share formula.
        constraints: "one of {FRONT_FOOTAGE, AREA}"
      - name: parcel_front_ft
        type: number
        source: input
        description: Benefiting parcel's frontage; numerator for FRONT_FOOTAGE method.
        constraints: ">= 0"
      - name: parcel_area_sqft
        type: number
        source: input
        description: Benefiting parcel's area; numerator for AREA method.
        constraints: ">= 0"
      - name: amount_cents
        type: integer
        source: computed
        description: Assessed reimbursement share, computed at creation via the selected method.
      - name: status
        type: enum
        source: system
        default: ASSESSED
        description: Lifecycle state.
        constraints: "one of {ASSESSED, COLLECTED, WAIVED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ConnectionApplication
    initial_state: DRAFT
    terminal_states: [DENIED, ACTIVATED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /connection-applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "parcel_id, service_type, meter_size, use_type all present"
          - "meter_size matches a MeterSizeSchedule row"
        side_effects: ["updated_at refreshed; version += 1"]
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /connection-applications/{id}/submit"
        actor: Applicant
        preconditions: ["application currently REVISION_REQUESTED"]
        side_effects: ["updated_at refreshed; version += 1"]
        note: Revision loop (cyclic).
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /connection-applications/{id}/start-review"
        actor: UtilityReviewer
        preconditions: ["application SUBMITTED"]
        side_effects: ["version += 1"]
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /connection-applications/{id}/request-revision"
        actor: UtilityReviewer
        preconditions: ["application UNDER_REVIEW"]
        side_effects: ["version += 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /connection-applications/{id}/approve"
        actor: UtilityReviewer
        preconditions:
          - "application UNDER_REVIEW"
          - "an AvailabilityDetermination exists for this application"
          - "for every requested service the corresponding *_main_available is true, OR a DeveloperAgreement in EXECUTED/COMPLETION_PENDING/CLOSED exists for a MainExtensionProject whose application_id is this application"
          - "acting reviewer X-User-ID != availability_reviewer_id (segregation of duties)"
        side_effects:
          - "run capacity_fee -> set capacity_fee_cents"
          - "run tap_installation_fee -> set tap_fee_cents"
          - "run total_fees_due -> set total_fees_due_cents"
          - "compute backflow_required = (use_type in {COMMERCIAL, IRRIGATION})"
          - "if backflow_required, create BackflowAssembly(status=REQUIRED) for this application"
          - "version += 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /connection-applications/{id}/deny"
        actor: UtilityReviewer
        preconditions: ["application UNDER_REVIEW"]
        side_effects: ["version += 1"]
      - from: APPROVED
        to: READY_FOR_ACTIVATION
        trigger: "system: cascade from METER_SET Inspection PASSED"
        actor: system
        preconditions:
          - "the application's MeterSet is transitioning to INSTALLED"
        side_effects: ["version += 1"]
        note: "Bubble-up; second hop of the meter-set cascade (see Inspection PASSED). Backflow certification is NOT checked here; it is enforced at activate."
      - from: READY_FOR_ACTIVATION
        to: ACTIVATED
        trigger: "POST /connection-applications/{id}/activate"
        actor: Applicant
        preconditions:
          - "application READY_FOR_ACTIVATION"
          - "fees_paid_cents >= total_fees_due_cents"
        side_effects:
          - "create ServiceAccount(status=ACTIVE, account_number generated) for this application"
          - "version += 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /connection-applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["application in {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED}"]
        side_effects: ["version += 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /connection-applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["application in {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED}"]
        side_effects: ["version += 1"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /connection-applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["application in {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED}"]
        side_effects: ["version += 1"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /connection-applications/{id}/withdraw"
        actor: Applicant
        preconditions: ["application in {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED}"]
        side_effects: ["version += 1"]

  - entity: MainExtensionProject
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED_TO_CONSTRUCT
        trigger: "system: cascade from DeveloperAgreement EXECUTED"
        actor: system
        preconditions: ["a DeveloperAgreement for this project reached EXECUTED"]
        side_effects: ["version += 1"]
      - from: APPROVED_TO_CONSTRUCT
        to: UNDER_CONSTRUCTION
        trigger: "POST /main-extension-projects/{id}/start-construction"
        actor: Developer
        preconditions: ["project APPROVED_TO_CONSTRUCT", "acting Developer owns the project"]
        side_effects: ["version += 1"]
      - from: UNDER_CONSTRUCTION
        to: INSPECTED
        trigger: "POST /main-extension-projects/{id}/record-inspection"
        actor: FieldInspector
        preconditions: ["project UNDER_CONSTRUCTION"]
        side_effects: ["version += 1"]
      - from: INSPECTED
        to: ACCEPTED
        trigger: "POST /main-extension-projects/{id}/accept"
        actor: UtilityReviewer
        preconditions: ["project INSPECTED", "actual_construction_cost_cents supplied"]
        side_effects:
          - "set actual_construction_cost_cents from body"
          - "run reimbursement_pool: reimbursable_principal_cents = min(actual_construction_cost_cents, reimbursement_cap_cents); outstanding_recoverable_cents = reimbursable_principal_cents; reimbursed_collected_cents = 0"
          - "CASCADE hop 2: the project's DeveloperAgreement (EXECUTED) auto-transitions to COMPLETION_PENDING"
          - "version += 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /main-extension-projects/{id}/cancel"
        actor: UtilityReviewer
        preconditions: ["project in {PROPOSED, APPROVED_TO_CONSTRUCT}"]
        side_effects: ["version += 1"]
      - from: APPROVED_TO_CONSTRUCT
        to: CANCELLED
        trigger: "POST /main-extension-projects/{id}/cancel"
        actor: UtilityReviewer
        preconditions: ["project in {PROPOSED, APPROVED_TO_CONSTRUCT}"]
        side_effects: ["version += 1"]

  - entity: DeveloperAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_ESCROW
        trigger: "POST /developer-agreements/{id}/offer"
        actor: UtilityAdmin
        preconditions: ["agreement DRAFT", "referenced MainExtensionProject is PROPOSED"]
        side_effects: ["set required_escrow_cents = project.estimated_cost_cents", "version += 1"]
      - from: PENDING_ESCROW
        to: EXECUTED
        trigger: "POST /developer-agreements/{id}/execute"
        actor: Developer
        preconditions:
          - "agreement PENDING_ESCROW"
          - "escrow_held_cents >= required_escrow_cents"
          - "acting Developer owns the agreement"
        side_effects:
          - "CASCADE hop 1: referenced MainExtensionProject auto-transitions PROPOSED -> APPROVED_TO_CONSTRUCT"
          - "version += 1"
      - from: EXECUTED
        to: COMPLETION_PENDING
        trigger: "system: cascade from MainExtensionProject ACCEPTED"
        actor: system
        preconditions: ["the agreement's project reached ACCEPTED"]
        side_effects:
          - "CASCADE hop 3: flip the project application's AvailabilityDetermination water_main_available and sewer_main_available to true and extension_required to false"
          - "version += 1"
      - from: COMPLETION_PENDING
        to: CLOSED
        trigger: "POST /developer-agreements/{id}/close"
        actor: UtilityAdmin
        preconditions: ["agreement COMPLETION_PENDING"]
        side_effects:
          - "append EscrowTransaction(txn_type=REFUND, amount_cents=escrow_held_cents) so escrow_held_cents becomes 0 (compensating action; escrow conservation preserved)"
          - "version += 1"
      - from: PENDING_ESCROW
        to: TERMINATED
        trigger: "POST /developer-agreements/{id}/terminate"
        actor: UtilityAdmin
        preconditions: ["agreement in {DRAFT, PENDING_ESCROW}"]
        side_effects:
          - "if escrow_held_cents > 0, append EscrowTransaction(txn_type=REFUND, amount_cents=escrow_held_cents)"
          - "version += 1"

  - entity: EscrowTransaction
    initial_state: POSTED
    terminal_states: [POSTED]
    transitions:
      - from: none
        to: POSTED
        trigger: "POST /developer-agreements/{id}/escrow-transactions"
        actor: Developer
        preconditions:
          - "agreement in {PENDING_ESCROW, EXECUTED} for DEPOSIT/DRAWDOWN"
          - "for DRAWDOWN: amount_cents <= escrow_held_cents"
          - "expected_developer_agreement_version matches agreement.version (OCC)"
        side_effects:
          - "recompute agreement escrow_deposited/drawn/refunded/held"
          - "increment DeveloperAgreement.version by 1"
        note: Append-only; entity is immutable after POSTED.

  - entity: Inspection
    initial_state: REQUESTED
    terminal_states: [PASSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /inspections/{id}/schedule"
        actor: FieldInspector
        preconditions:
          - "inspection REQUESTED"
          - "scheduled_end > scheduled_start"
          - "no SCHEDULED/IN_PROGRESS inspection on the same inspector_id overlaps [scheduled_start, scheduled_end) (half-open)"
        side_effects: ["version += 1"]
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /inspections/{id}/schedule"
        actor: FieldInspector
        preconditions:
          - "inspection FAILED"
          - "scheduled_end > scheduled_start"
          - "no SCHEDULED/IN_PROGRESS inspection on the same inspector_id overlaps [scheduled_start, scheduled_end)"
        side_effects: ["version += 1"]
        note: Reinspection loop (cyclic).
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /inspections/{id}/start"
        actor: FieldInspector
        preconditions: ["inspection SCHEDULED", "acting FieldInspector is the assigned inspector_id"]
        side_effects: ["version += 1"]
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /inspections/{id}/pass"
        actor: FieldInspector
        preconditions: ["inspection IN_PROGRESS"]
        side_effects:
          - "if inspection_type == METER_SET: CASCADE hop 1 -> the application's MeterSet (SET) transitions to INSTALLED; CASCADE hop 2 -> that application transitions APPROVED -> READY_FOR_ACTIVATION"
          - "if inspection_type == BACKFLOW: the application's BackflowAssembly (INSTALLED) transitions to CERTIFIED"
          - "version += 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /inspections/{id}/fail"
        actor: FieldInspector
        preconditions: ["inspection IN_PROGRESS"]
        side_effects:
          - "if inspection_type == BACKFLOW and BackflowAssembly is INSTALLED: BackflowAssembly -> FAILED"
          - "version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspections/{id}/cancel"
        actor: FieldInspector
        preconditions: ["inspection in {REQUESTED, SCHEDULED}"]
        side_effects: ["release inspector window", "version += 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /inspections/{id}/cancel"
        actor: FieldInspector
        preconditions: ["inspection in {REQUESTED, SCHEDULED}"]
        side_effects: ["version += 1"]

  - entity: BackflowAssembly
    initial_state: REQUIRED
    terminal_states: [CERTIFIED]
    transitions:
      - from: REQUIRED
        to: INSTALLED
        trigger: "POST /backflow-assemblies/{id}/install"
        actor: Applicant
        preconditions: ["assembly REQUIRED", "serial_number supplied"]
        side_effects: ["set serial_number", "version += 1"]
      - from: INSTALLED
        to: CERTIFIED
        trigger: "system: cascade from BACKFLOW Inspection PASSED"
        actor: system
        preconditions: ["assembly INSTALLED", "a BACKFLOW Inspection for the same application reached PASSED"]
        side_effects: ["version += 1"]
      - from: INSTALLED
        to: FAILED
        trigger: "system: cascade from BACKFLOW Inspection FAILED"
        actor: system
        preconditions: ["assembly INSTALLED"]
        side_effects: ["version += 1"]
      - from: FAILED
        to: INSTALLED
        trigger: "POST /backflow-assemblies/{id}/install"
        actor: Applicant
        preconditions: ["assembly FAILED"]
        side_effects: ["version += 1"]
        note: Repair-and-reinstall loop.

  - entity: MeterSet
    initial_state: PENDING
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /meter-sets/{id}/schedule"
        actor: FieldInspector
        preconditions:
          - "meter-set PENDING"
          - "appointment_end > appointment_start"
          - "no SCHEDULED/SET meter-set on the same crew_id violates the APPOINTMENT_BUFFER_MINUTES gap around [appointment_start, appointment_end] (closed interval + buffer)"
        side_effects: ["version += 1"]
      - from: SCHEDULED
        to: SET
        trigger: "POST /meter-sets/{id}/complete-install"
        actor: FieldInspector
        preconditions:
          - "meter-set SCHEDULED"
          - "the application's TAP Inspection is PASSED"
          - "the application's BackflowAssembly, if backflow_required, is not FAILED"
        side_effects: ["version += 1"]
      - from: SET
        to: INSTALLED
        trigger: "system: cascade from METER_SET Inspection PASSED"
        actor: system
        preconditions: ["meter-set SET"]
        side_effects: ["version += 1"]
      - from: INSTALLED
        to: REMOVED
        trigger: "POST /meter-sets/{id}/remove"
        actor: UtilityAdmin
        preconditions: ["meter-set INSTALLED"]
        side_effects: ["version += 1"]

  - entity: ServiceAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /service-accounts/{id}/suspend"
        actor: UtilityAdmin
        preconditions: ["account ACTIVE"]
        side_effects: ["version += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /service-accounts/{id}/reinstate"
        actor: UtilityAdmin
        preconditions: ["account SUSPENDED"]
        side_effects: ["version += 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /service-accounts/{id}/close"
        actor: UtilityAdmin
        preconditions: ["account in {ACTIVE, SUSPENDED}"]
        side_effects: ["version += 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /service-accounts/{id}/close"
        actor: UtilityAdmin
        preconditions: ["account in {ACTIVE, SUSPENDED}"]
        side_effects: ["version += 1"]

  - entity: LatecomerReimbursement
    initial_state: ASSESSED
    terminal_states: [COLLECTED, WAIVED]
    transitions:
      - from: ASSESSED
        to: COLLECTED
        trigger: "POST /latecomer-reimbursements/{id}/collect"
        actor: UtilityAdmin
        preconditions: ["reimbursement ASSESSED"]
        side_effects:
          - "MainExtensionProject.reimbursed_collected_cents += amount_cents; outstanding_recoverable_cents -= amount_cents (reimbursement-pool conservation preserved)"
          - "version += 1"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /latecomer-reimbursements/{id}/waive"
        actor: UtilityAdmin
        preconditions: ["reimbursement ASSESSED"]
        side_effects: ["version += 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: escrow-drawdown-stale-agreement
    parent_entity: DeveloperAgreement
    write_endpoint: "POST /developer-agreements/{id}/escrow-transactions"
    occ_field: "expected_developer_agreement_version"
    description: |
      Posting a DRAWDOWN against a DeveloperAgreement whose version has advanced since the client
      last observed it is rejected. A prior DEPOSIT or DRAWDOWN that legitimately changed the held
      balance advances the agreement version, so the current writer's view of escrow_held_cents is
      stale and the drawdown must re-read before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: latecomer-assess-stale-project
    parent_entity: MainExtensionProject
    write_endpoint: "POST /latecomer-reimbursements"
    occ_field: "expected_main_extension_project_version"
    description: |
      Creating a LatecomerReimbursement against a MainExtensionProject whose version has advanced
      since the client last observed it is rejected. A prior assessment that legitimately drew from
      outstanding_recoverable_cents advances the project version, so a new assessment computed
      against a stale outstanding balance must re-read before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: capacity_fee
    trigger: "on ConnectionApplication approve (UNDER_REVIEW -> APPROVED)"
    algorithm: tiered_pricing
    formula: |
      base_eru      = MeterSizeSchedule[application.meter_size].eru_factor
      net_eru       = base_eru                              # assessment_basis == NEW
      net_eru       = max(base_eru - prior_credit_eru, 0)   # assessment_basis == REDEVELOPMENT
      water_comp    = fee.water_capacity_fee_per_eru_cents * net_eru  if service_type in {WATER, BOTH} else 0
      sewer_comp    = fee.sewer_capacity_fee_per_eru_cents * net_eru  if service_type in {SEWER, BOTH} else 0
      use_mult      = fee.use_multipliers[application.use_type]
      capacity_fee_cents = round_half_up((water_comp + sewer_comp) * use_mult)
    input_set: "the governing FeeSchedule (latest is_active=true by created_at) and the MeterSizeSchedule row for the application's meter_size"
    constants:
      # governing FeeSchedule values used by canonical fixtures
      WATER_CAPACITY_FEE_PER_ERU_CENTS: 400000
      SEWER_CAPACITY_FEE_PER_ERU_CENTS: 500000
      USE_MULT_RESIDENTIAL: 1.00
      USE_MULT_COMMERCIAL: 1.15
      USE_MULT_IRRIGATION: 1.30
    precision: "integer cents, round_half_up at the single final step"
    variants:
      - name: NEW
        when: "assessment_basis == NEW"
        difference: "net_eru = base_eru (full meter capacity charged)"
      - name: REDEVELOPMENT
        when: "assessment_basis == REDEVELOPMENT"
        difference: "net_eru = max(base_eru - prior_credit_eru, 0); prior connection capacity is credited, floored at 0"

  - name: tap_installation_fee
    trigger: "on ConnectionApplication approve (UNDER_REVIEW -> APPROVED)"
    algorithm: aggregation
    formula: |
      tap_fee_cents = MeterSizeSchedule[application.meter_size].tap_install_fee_cents
                    + (fee.pavement_cut_surcharge_cents if application.requires_pavement_cut else 0)
    input_set: "the MeterSizeSchedule row for the meter_size and the governing FeeSchedule"
    constants:
      PAVEMENT_CUT_SURCHARGE_CENTS: 80000
    precision: "integer cents"

  - name: total_fees_due
    trigger: "on ConnectionApplication approve (UNDER_REVIEW -> APPROVED), after capacity_fee and tap_installation_fee"
    algorithm: threshold
    formula: |
      # Evaluation order is fixed; the discount is keyed on gross which itself depends on admin_fee.
      subtotal    = capacity_fee_cents + tap_fee_cents
      admin_fee   = min(round_half_up(subtotal * fee.admin_fee_pct), fee.admin_fee_cap_cents)
      gross       = subtotal + admin_fee
      discount_pct = fee.volume_discount_pct if gross >= fee.volume_discount_threshold_cents else 0
      discount    = round_half_up(gross * discount_pct)
      total_fees_due_cents = gross - discount
    input_set: "the application's own capacity_fee_cents and tap_fee_cents plus governing FeeSchedule"
    constants:
      ADMIN_FEE_PCT: 0.03
      ADMIN_FEE_CAP_CENTS: 50000
      VOLUME_DISCOUNT_THRESHOLD_CENTS: 2000000
      VOLUME_DISCOUNT_PCT: 0.05
    precision: "integer cents, round_half_up per step (admin, then discount)"

  - name: latecomer_reimbursement_assessment
    trigger: "on LatecomerReimbursement create (POST /latecomer-reimbursements)"
    algorithm: weighted_scoring
    formula: |
      principal = project.reimbursable_principal_cents
      if method == FRONT_FOOTAGE:
        share = round_half_up(principal * parcel_front_ft / project.total_assessable_front_ft)
      elif method == AREA:
        share = round_half_up(principal * parcel_area_sqft / project.total_assessable_area_sqft)
      amount_cents = share    # rejected if share > project.outstanding_recoverable_cents
    input_set: "the referenced MainExtensionProject (must be ACCEPTED with reimbursable_principal_cents set)"
    constants: {}
    precision: "integer cents, round_half_up at the single final step"
    variants:
      - name: FRONT_FOOTAGE
        when: "method == FRONT_FOOTAGE"
        difference: "prorate by parcel_front_ft / total_assessable_front_ft"
      - name: AREA
        when: "method == AREA"
        difference: "prorate by parcel_area_sqft / total_assessable_area_sqft (different denominator/numerator => different result for same principal)"

  - name: escrow_balance
    trigger: "on any EscrowTransaction append, and on agreement close/terminate refund"
    algorithm: aggregation
    formula: |
      escrow_deposited_cents = sum(t.amount_cents for t in EscrowTransaction where developer_agreement_id == agreement.id and txn_type == DEPOSIT)
      escrow_drawn_cents     = sum(t.amount_cents for t in EscrowTransaction where developer_agreement_id == agreement.id and txn_type == DRAWDOWN)
      escrow_refunded_cents  = sum(t.amount_cents for t in EscrowTransaction where developer_agreement_id == agreement.id and txn_type == REFUND)
      escrow_held_cents      = escrow_deposited_cents - escrow_drawn_cents - escrow_refunded_cents
      # Conservation invariant (always): escrow_deposited_cents == escrow_held_cents + escrow_drawn_cents + escrow_refunded_cents
    input_set: "all EscrowTransaction rows for the agreement"
    constants: {}
    precision: "integer cents (exact)"

  - name: reimbursement_pool
    trigger: "on MainExtensionProject accept, and on each LatecomerReimbursement collect"
    algorithm: aggregation
    formula: |
      reimbursable_principal_cents  = min(actual_construction_cost_cents, reimbursement_cap_cents)   # at accept
      reimbursed_collected_cents    = sum(r.amount_cents for r in LatecomerReimbursement where main_extension_project_id == project.id and status == COLLECTED)
      outstanding_recoverable_cents = reimbursable_principal_cents - reimbursed_collected_cents
      # Conservation invariant (always): reimbursable_principal_cents == reimbursed_collected_cents + outstanding_recoverable_cents
    input_set: "the project's accepted principal and its COLLECTED LatecomerReimbursements"
    constants: {}
    precision: "integer cents (exact)"

  - name: availability_determination
    trigger: "on POST /availability-determinations"
    algorithm: threshold
    formula: |
      needs_water = service_type in {WATER, BOTH}
      needs_sewer = service_type in {SEWER, BOTH}
      water_main_available = needs_water and (distance_to_main_ft <= MAX_CONNECTION_DISTANCE_FT)
      sewer_main_available = needs_sewer and (distance_to_main_ft <= MAX_CONNECTION_DISTANCE_FT)
      extension_required   = (needs_water and not water_main_available) or (needs_sewer and not sewer_main_available)
      # Boundary: distance exactly MAX_CONNECTION_DISTANCE_FT is AVAILABLE (<=, not <).
    input_set: "the determination's own distance_to_main_ft and the application's service_type"
    constants:
      MAX_CONNECTION_DISTANCE_FT: 200
    precision: "boolean"

  - name: inspector_window_overlap
    trigger: "on POST /inspections/{id}/schedule (overlap guard)"
    algorithm: interval_merge
    formula: |
      # Half-open [start, end) semantics: adjacency (new.start == existing.end) does NOT conflict.
      conflict = exists existing in Inspection
                 where existing.inspector_id == candidate.inspector_id
                   and existing.status in {SCHEDULED, IN_PROGRESS}
                   and existing.id != candidate.id
                   and new.scheduled_start < existing.scheduled_end
                   and new.scheduled_end   > existing.scheduled_start
    input_set: "SCHEDULED/IN_PROGRESS inspections on the same inspector"
    constants: {}
    precision: "boolean"

  - name: crew_appointment_overlap
    trigger: "on POST /meter-sets/{id}/schedule (overlap guard)"
    algorithm: interval_merge
    formula: |
      # Closed interval + buffer: appointments on one crew must be separated by >= APPOINTMENT_BUFFER_MINUTES.
      buffer = APPOINTMENT_BUFFER_MINUTES minutes
      conflict = exists existing in MeterSet
                 where existing.crew_id == candidate.crew_id
                   and existing.status in {SCHEDULED, SET}
                   and existing.id != candidate.id
                   and new.appointment_start <  (existing.appointment_end   + buffer)
                   and (new.appointment_end + buffer) >  existing.appointment_start
    input_set: "SCHEDULED/SET meter-sets on the same crew"
    constants:
      APPOINTMENT_BUFFER_MINUTES: 60
    precision: "boolean"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is authorized for this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-referenced resource exists (validated left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "body foreign-key references resolve to existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "create/link endpoints with FK bodies"
  - priority: 5
    category: existence
    check: "application.meter_size matches an existing MeterSizeSchedule row"
    error_id: ERR_METER_SIZE_UNKNOWN
    http_status: 422
    applies_to: "POST /connection-applications/{id}/submit, POST /connection-applications/{id}/approve"
  - priority: 6
    category: state
    check: "target resource is in a state from which this transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "on approve, segregation of duties: acting reviewer X-User-ID != availability_reviewer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /connection-applications/{id}/approve"
  - priority: 8
    category: business_referential
    check: "on approve, an AvailabilityDetermination exists for the application"
    error_id: ERR_DETERMINATION_MISSING
    http_status: 422
    applies_to: "POST /connection-applications/{id}/approve"
  - priority: 9
    category: business_safety
    check: "service is available for all requested utilities, or an EXECUTED/COMPLETION_PENDING/CLOSED DeveloperAgreement covers a MainExtensionProject for this application"
    error_id: ERR_SERVICE_UNAVAILABLE
    http_status: 422
    applies_to: "POST /connection-applications/{id}/approve"
  - priority: 10
    category: business_safety
    check: "meter-set complete-install requires the application's TAP Inspection to be PASSED"
    error_id: ERR_INSPECTION_NOT_PASSED
    http_status: 422
    applies_to: "POST /meter-sets/{id}/complete-install"
  - priority: 11
    category: business_safety
    check: "activation requires backflow CERTIFIED when backflow_required is true"
    error_id: ERR_BACKFLOW_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /connection-applications/{id}/activate"
  - priority: 12
    category: business_temporal
    check: "scheduled/appointment window end is strictly after start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /inspections/{id}/schedule, POST /meter-sets/{id}/schedule"
  - priority: 13
    category: business_constraint
    check: "inspection window does not overlap another SCHEDULED/IN_PROGRESS inspection on the same inspector (half-open [start,end))"
    error_id: ERR_INSPECTOR_UNAVAILABLE
    http_status: 409
    applies_to: "POST /inspections/{id}/schedule"
  - priority: 14
    category: business_constraint
    check: "meter-set appointment respects APPOINTMENT_BUFFER_MINUTES gap from another SCHEDULED/SET appointment on the same crew (closed interval + buffer)"
    error_id: ERR_CREW_UNAVAILABLE
    http_status: 409
    applies_to: "POST /meter-sets/{id}/schedule"
  - priority: 15
    category: business_fiscal
    check: "DRAWDOWN amount_cents <= escrow_held_cents"
    error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 422
    applies_to: "POST /developer-agreements/{id}/escrow-transactions"
  - priority: 16
    category: business_fiscal
    check: "execute requires escrow_held_cents >= required_escrow_cents"
    error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 422
    applies_to: "POST /developer-agreements/{id}/execute"
  - priority: 17
    category: business_fiscal
    check: "activation requires fees_paid_cents >= total_fees_due_cents"
    error_id: ERR_FEES_UNPAID
    http_status: 402
    applies_to: "POST /connection-applications/{id}/activate"
  - priority: 18
    category: business_constraint
    check: "latecomer assessed share <= project.outstanding_recoverable_cents"
    error_id: ERR_REIMBURSEMENT_EXCEEDED
    http_status: 422
    applies_to: "POST /latecomer-reimbursements"
  - priority: 19
    category: business_constraint
    check: "latecomer project is ACCEPTED with reimbursable_principal_cents set"
    error_id: ERR_PROJECT_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /latecomer-reimbursements"
  - priority: 20
    category: state
    check: "OCC expected_<parent>_version matches parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /developer-agreements/{id}/escrow-transactions, POST /latecomer-reimbursements"
  - priority: 21
    category: business_constraint
    check: "required body fields present and enum/number values valid"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Configuration & resources ----
  - method: POST
    path: "/meter-size-schedules"
    description: Create a meter-size -> ERU factor + tap fee schedule row.
    roles: [UtilityAdmin]
    code: 201
    input: [meter_size, eru_factor, tap_install_fee_cents]
    output: MeterSizeSchedule
    side_effects: []
  - method: GET
    path: "/meter-size-schedules"
    description: List meter-size schedule rows.
    roles: [UtilityAdmin, UtilityReviewer, Applicant, Developer, FieldInspector]
    code: 200
    input: ["meter_size?", "limit?", "offset?"]
    output: MeterSizeSchedule[]
    side_effects: []
  - method: POST
    path: "/fee-schedules"
    description: Create a rate card; latest is_active=true governs assessments.
    roles: [UtilityAdmin]
    code: 201
    input: ["is_active?", water_capacity_fee_per_eru_cents, sewer_capacity_fee_per_eru_cents, use_multipliers, admin_fee_pct, admin_fee_cap_cents, volume_discount_threshold_cents, volume_discount_pct, pavement_cut_surcharge_cents]
    output: FeeSchedule
    side_effects: []
  - method: GET
    path: "/fee-schedules"
    description: List rate cards.
    roles: [UtilityAdmin, UtilityReviewer]
    code: 200
    input: ["is_active?", "limit?", "offset?"]
    output: FeeSchedule[]
    side_effects: []
  - method: POST
    path: "/inspectors"
    description: Create a field inspector resource.
    roles: [UtilityAdmin]
    code: 201
    input: [name, "active?"]
    output: Inspector
    side_effects: []
  - method: GET
    path: "/inspectors"
    description: List inspectors.
    roles: [UtilityAdmin, FieldInspector, UtilityReviewer]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: Inspector[]
    side_effects: []
  - method: POST
    path: "/meter-crews"
    description: Create a meter-set crew resource.
    roles: [UtilityAdmin]
    code: 201
    input: [name, "active?"]
    output: MeterCrew
    side_effects: []
  - method: GET
    path: "/meter-crews"
    description: List meter crews.
    roles: [UtilityAdmin, FieldInspector]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: MeterCrew[]
    side_effects: []

  # ---- Connection application lifecycle ----
