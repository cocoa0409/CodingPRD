            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Late Cert", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4411", boat_name: "Boundary Cert", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_b: $.data.id, b_b_v: $.data.version } }
