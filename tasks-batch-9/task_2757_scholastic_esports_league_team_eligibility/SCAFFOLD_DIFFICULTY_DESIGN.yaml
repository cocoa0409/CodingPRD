            - "Team.${tm_a_id}.match_points == 3 with forfeit_wins == 1, Team.${tm_b_id}.match_points == 0 with forfeits_charged == 1"
            - "Season.${se_id}.match_point_pool == 3"
            - "Match.${m_id}.dispute_filed_by_team_id == ${tm_a_id} and dispute_deadline_at == 2026-08-03T00:00:00.000Z (48 default district window hours after the forfeit)"

