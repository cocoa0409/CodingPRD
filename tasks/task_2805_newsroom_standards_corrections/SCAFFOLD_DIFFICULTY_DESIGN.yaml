              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { sed: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/reviewers"
              payload: { newsroom_id: "${nr}", full_name: "Lee Park", discipline: "LEGAL", weekly_capacity_minutes: 600 }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rev: $.data.id, rev_v1: $.data.version }
            - call: "POST /standards-desk/outside-activity-requests"
              payload: { journalist_id: "${rep}", activity_type: "SPEAKING", compensated: true, starts_on: "2026-09-01T00:00:00Z", ends_on: "2026-09-05T00:00:00Z", related_beat: "courts", host_organization: "State Bar Association" }
