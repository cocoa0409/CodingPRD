              payload: { dealer_id: "${d1}", participation_method: "RATE_PARTICIPATION", max_participation_bps: 200, chargeback_window_days: 360, effective_from: "2026-02-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", expected_dealer_version: "${d1_v0}" }
              as: PortfolioAdmin
              captures: { ag1: $.data.id }
            - call: "POST /lending/dealer-agreements/${ag1}/countersign"
              payload: { signer_name: "R. Ridge" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /lending/rate-sheets"
              payload: { program_code: "PS-STANDARD", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PortfolioAdmin
              captures: { rs1: $.data.id }
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T1", min_credit_score: 720, max_credit_score: 900, max_ltv_pct: 120, max_term_months: 72, buy_rate_apr_bps: 549, advance_rate_pct: 120, acquisition_fee_cents: 15000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T2", min_credit_score: 660, max_credit_score: 719, max_ltv_pct: 115, max_term_months: 72, buy_rate_apr_bps: 749, advance_rate_pct: 115, acquisition_fee_cents: 20000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T3", min_credit_score: 600, max_credit_score: 659, max_ltv_pct: 110, max_term_months: 60, buy_rate_apr_bps: 1099, advance_rate_pct: 110, acquisition_fee_cents: 30000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/publish"
              payload: {}
              as: PortfolioAdmin
          trigger:
            - call: "GET /lending/dealers/${d1}"
              payload: {}
              as: PortfolioAdmin
              captures: { d1_v1: $.data.version }
            - call: "POST /lending/dealer-agreements"
              payload: { dealer_id: "${d1}", participation_method: "RATE_PARTICIPATION", max_participation_bps: 150, chargeback_window_days: 360, effective_from: "2027-02-01T00:00:00Z", effective_to: "2028-02-01T00:00:00Z", expected_dealer_version: "${d1_v1}" }
              as: PortfolioAdmin
              captures: { adj_err: $.data.error_id }
            - call: "GET /lending/dealers/${d1}"
              payload: {}
              as: PortfolioAdmin
              captures: { d1_v2: $.data.version }
            - call: "POST /lending/dealer-agreements"
              payload: { dealer_id: "${d1}", participation_method: "RATE_PARTICIPATION", max_participation_bps: 150, chargeback_window_days: 360, effective_from: "2027-03-05T00:00:00Z", effective_to: "2028-03-05T00:00:00Z", expected_dealer_version: "${d1_v2}" }
              as: PortfolioAdmin
              captures: { ag2: $.data.id, ag2_status: $.data.status }
          assert:
            - "The 2027-02-01 agreement returns HTTP 409 with error_id == 'ERR_AGREEMENT_WINDOW_CONFLICT' - touching the incumbent's effective_to is not enough"
            - "Dealer.${d1}.version is unchanged by the rejected create, so ${d1_v2} == ${d1_v1}"
            - "The 2027-03-05 agreement (>= 2027-02-01 plus the 30-day buffer) is created with HTTP 201 and DealerAgreement.${ag2}.status == 'PENDING_COUNTERSIGN'"
