  - rule_id: boundary_precision_check
    instances:
      - name: training_certify_at_exactly_52_weeks
        grounds:
          - calculations.training_weeks_accrued
          - errors.ERR_TRAINING_TENURE_INSUFFICIENT
        distinguishing_aspect: |
          Numeric threshold metric (training_weeks_accrued) with inclusive >=:
          at exactly 52 full weeks certify SUCCEEDS; at 52 weeks minus 1 day
          (floor = 51) it fails ERR_TRAINING_TENURE_INSUFFICIENT. Reached via
          POST /api/partners/{id}/certify.
        test_recipe:
          setup:
            - "Partner PT1: training started at 2026-09-01T00:00:00Z (logical clock)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
