  - rule_id: transitive_cascade
    instances:

      - name: order_cancel_cascades_to_workorder_stator_and_oven_ledger
        grounds:
          - state_machines.CustomerOrder.IN_PRODUCTION_to_CANCELLED
          - state_machines.WorkOrder.build_status_RELEASED_to_build_status_CANCELLED
          - calculations.oven_booked_minutes_ledger
          - calculations.distributor_allowance_ledger
          - entities.CuringOven.fields.booked_minutes
          - entities.Distributor.fields.units_outstanding
        distinguishing_aspect: |
          One cancel call propagates FOUR levels deep along the production spine —
          CustomerOrder -> WorkOrder -> StatorBuild -> CuringOven — and the fourth level is a
          numeric ledger, not a status: the scrapped stator's 240 booked minutes are released so
          CuringOven.booked_minutes returns from 240 to 0, while the same call credits the
          distributor's allowance back from 488 to 500.
        test_recipe:
          setup:
            - "Design D1 RELEASED; MADE_TO_ORDER order for 12 units CONFIRMED then moved to IN_PRODUCTION by opening work order WO1."
            - "WO1 has one IMPREGNATED StatorBuild booked on OVEN-A for 2026-08-03T08:00Z-12:00Z (240 minutes) and one MACHINED RotorBuild."
            - "Before the trigger: CuringOven.booked_minutes == 240, Distributor.units_outstanding == 12, Distributor.stock_allowance_remaining_units == 488."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Nordwind Antriebe", tier: "GOLD", jurisdiction: "EU", stocking_program_enrolled: true, committed_annual_units: 500, stock_buffer_units: 10 }
              as: PlantAdmin
              captures: { dist_id: $.data.id }
