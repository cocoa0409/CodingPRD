            - "trigger call 3 returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_ACTIVE_REQUEST\""
            - "trigger call 4 returns HTTP 201 (a different requesting district for the same student is allowed)"
            - "trigger call 5 returns HTTP 200 with RecordsRequest.${req_one}.status == \"DENIED\" and denial_reason == \"DUPLICATE_REQUEST\""
            - "trigger call 6 returns HTTP 201 with a new id different from ${req_one} and ${req_two}"
            - "GET /records-office/records-requests?student_id=${student_id} returns exactly 3 rows"
            - "District.${send_district_id}.open_request_count == 2 (the DENIED request drops out of the open set)"

  - section: errors
    instances:
      - name: every_unknown_path_id_returns_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations.priority_10_path_entities_exist
          - errors.ERR_WITHDRAWAL_NOT_FOUND
          - errors.ERR_DISCIPLINE_INCIDENT_NOT_FOUND
          - errors.ERR_RECORDS_REQUEST_NOT_FOUND
