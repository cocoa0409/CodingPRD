      - name: program_piece_counters_conserved_across_allocate_ship_quarantine_release_return
        conserved_quantity: "CustomerProgram.committed_pieces == open_commitment_pieces + allocated_pieces + shipped_pieces, in integer pieces, after every lot transition"
        grounds:
          - state_machines.ShipmentLot.ALLOCATED_to_QUARANTINED
          - state_machines.ShipmentLot.QUARANTINED_to_ALLOCATED
          - state_machines.ShipmentLot.SHIPPED_to_RETURNED
          - entities.CustomerProgram.fields.open_commitment_pieces
          - entities.CustomerProgram.fields.allocated_pieces
          - entities.CustomerProgram.fields.shipped_pieces
          - entities.CustomerProgram.fields.quarantined_lot_count
