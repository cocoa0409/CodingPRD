              as: ClubAdmin
              captures: { p_contract: $.data.id }
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:01:00Z" }
              as: ClubAdmin
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club1}", name: "Club Fleet", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
              captures: { p_owned: $.data.id }
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 5 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
          trigger:
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1_provider: $.data.provider_id }
          assert:
            - "Dispatch provider == ${p_owned} (OWNED outranks CONTRACTED even though the CONTRACTED provider was created earlier)"
      - name: dispatch_selector_capability_filter
        claim_type: selector_policy
        grounds:
          - "calculations.dispatch_provider_selection"
        distinguishing_aspect: "A TOW call is never assigned to a LOCKOUT-only provider even when it is the only one: empty pool after filtering yields NO_PROVIDER auto-cancel."
        test_recipe:
          setup: ["Only provider in the territory has capabilities [LOCKOUT]; a TOW call is created and dispatch attempted"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
