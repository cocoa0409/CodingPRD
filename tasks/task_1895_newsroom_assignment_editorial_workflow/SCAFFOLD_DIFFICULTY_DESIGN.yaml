            - { call: "POST /newsroom/pitches/${pc_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { sc_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${sa_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T12:00:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a1_id: "$.data.id" } }
          trigger:
            - { call: "POST /newsroom/assignments", payload: { story_id: "${sb_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T12:00:00Z", end_at: "2026-08-01T14:00:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a2_id: "$.data.id", a2_status: "$.data.status" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${sc_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T13:00:00Z", end_at: "2026-08-01T15:00:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "a2_status == PROPOSED (adjacent half-open windows [10:00,12:00) and [12:00,14:00) are both allowed)"
            - "err == ERR_STAFF_TIME_CONFLICT ([13:00,15:00) intersects [12:00,14:00): 13:00 < 14:00 and 15:00 > 12:00)"

      - name: slot_window_buffer_gap
        grounds:
          - validations[priority=13]
          - errors[ERR_SLOT_WINDOW_CONFLICT]
          - entities.PublicationSlot.fields.channel
        distinguishing_aspect: |
          Closed-window-with-buffer semantics on the PublicationSlot channel
          resource (different resource and different interval semantics from
          staff_assignment_half_open_adjacency): two ACTIVE same-channel slots
          must keep a 30-minute gap and a gap of exactly 30 minutes conflicts
          (inclusive boundary), while 31 minutes passes and a different channel
          is isolated.
        test_recipe:
          setup:
            - "One ACTIVE PRINT slot with window [2026-08-05T18:00, 2026-08-05T19:00)"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Sixteen", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/slots", payload: { channel: PRINT, window_start: "2026-08-05T18:00:00Z", window_end: "2026-08-05T19:00:00Z", capacity: 2 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { s1_id: "$.data.id" } }
          trigger:
            - { call: "POST /newsroom/slots", payload: { channel: PRINT, window_start: "2026-08-05T19:30:00Z", window_end: "2026-08-05T20:00:00Z", capacity: 1 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /newsroom/slots", payload: { channel: PRINT, window_start: "2026-08-05T19:31:00Z", window_end: "2026-08-05T20:00:00Z", capacity: 1 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { s3_id: "$.data.id" } }
            - { call: "POST /newsroom/slots", payload: { channel: BROADCAST, window_start: "2026-08-05T19:00:00Z", window_end: "2026-08-05T20:00:00Z", capacity: 1 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { s4_id: "$.data.id" } }
          assert:
            - "err == ERR_SLOT_WINDOW_CONFLICT (gap exactly 30 minutes conflicts; boundary is inclusive)"
            - "s3_id is a created slot (gap 31 minutes passes)"
            - "s4_id is a created slot (BROADCAST channel isolated from the PRINT window)"

  - rule_id: compensating_invariant
    instances:
      - name: slot_reservation_round_trip
        grounds:
          - calculations.slot_reserved_count
          - state_machines.Story.CLEARED_to_SCHEDULED
          - state_machines.Story.SCHEDULED_to_CLEARED
          - state_machines.Story.SCHEDULED_to_KILLED
        distinguishing_aspect: |
          Conserved quantity: PublicationSlot.reserved_count. The schedule /
          unschedule / schedule / kill sequence returns the counter to its exact
          baseline after every compensating pair (1, 0, 1, 0); the second
          invariant conserves a different quantity (staff workload count).
        test_recipe:
          setup:
            - "A CLEARED story (version v6) and an empty PRINT slot with capacity 2"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Seventeen", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Seventeen", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Copy Seventeen", role_capability: COPY_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { copy_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Fact Seventeen", role_capability: FACT_CHECKER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { fact_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Legal Seventeen", role_capability: LEGAL_REVIEWER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { legal_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "ME Seventeen", role_capability: MANAGING_EDITOR, home_desk: METRO, hourly_rate_cents: 8000 }, as: NewsDirector, captures: { me_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Opera review", summary: "Season opener", desk: FEATURES, deadline_at: "2026-08-07T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:00:00Z", planned_effort_minutes: 45 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { asg_id: "$.data.id" } }
            - { call: "POST /newsroom/assignments/${asg_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "PATCH /newsroom/stories/${story_id}", payload: { word_count: 600 }, as: Reporter, as_user_id: "${rep_id}", captures: { v2: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/submit-edit", payload: {}, as: Reporter, as_user_id: "${rep_id}", captures: { v3: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/complete-edit", payload: {}, as: CopyEditor, as_user_id: "${copy_id}", captures: { v4: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/reviews", payload: { review_type: FACT_CHECK, verdict: PASS, expected_story_version: "${v4}" }, as: FactChecker, as_user_id: "${fact_id}" }
            - { call: "GET /newsroom/stories/${story_id}", payload: {}, as: NewsDirector, captures: { v5: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/reviews", payload: { review_type: LEGAL, verdict: PASS, expected_story_version: "${v5}" }, as: LegalReviewer, as_user_id: "${legal_id}" }
            - { call: "GET /newsroom/stories/${story_id}", payload: {}, as: NewsDirector, captures: { v6: "$.data.version" } }
            - { call: "POST /newsroom/slots", payload: { channel: PRINT, window_start: "2026-08-06T18:00:00Z", window_end: "2026-08-06T19:00:00Z", capacity: 2 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { slot_id: "$.data.id" } }
          trigger:
            - { call: "POST /newsroom/stories/${story_id}/schedule", payload: { slot_id: "${slot_id}", expected_story_version: "${v6}" }, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "GET /newsroom/slots/${slot_id}", payload: {}, as: NewsDirector, captures: { rc1: "$.data.reserved_count" } }
            - { call: "POST /newsroom/stories/${story_id}/unschedule", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "GET /newsroom/slots/${slot_id}", payload: {}, as: NewsDirector, captures: { rc2: "$.data.reserved_count" } }
            - { call: "GET /newsroom/stories/${story_id}", payload: {}, as: NewsDirector, captures: { v8: "$.data.version" } }
            - { call: "POST /newsroom/stories/${story_id}/schedule", payload: { slot_id: "${slot_id}", expected_story_version: "${v8}" }, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "GET /newsroom/slots/${slot_id}", payload: {}, as: NewsDirector, captures: { rc3: "$.data.reserved_count" } }
            - { call: "POST /newsroom/stories/${story_id}/kill", payload: {}, as: ManagingEditor, as_user_id: "${me_id}" }
            - { call: "GET /newsroom/slots/${slot_id}", payload: {}, as: NewsDirector, captures: { rc4: "$.data.reserved_count" } }
          assert:
            - "rc1 == 1 and rc2 == 0 (schedule/unschedule compensate exactly)"
            - "rc3 == 1 (re-schedule re-acquires)"
            - "rc4 == 0 (kill of a SCHEDULED story releases the reservation)"
            - "invariant at every step: reserved_count == count(Story with slot_id = slot AND status = SCHEDULED)"

      - name: staff_active_count_round_trip
        grounds:
          - calculations.active_assignment_count
          - state_machines.Assignment
        distinguishing_aspect: |
          Conserved quantity: StaffMember.active_assignment_count (a different
          quantity from slot reservations). Propose/cancel and
          propose/accept/complete sequences return the counter to baseline
          (1, 0, 1, 1, 0) — notably the PROPOSED -> ACCEPTED hop changes nothing
          because both states count.
        test_recipe:
          setup:
            - "Reporter with zero assignments; two DRAFT stories A and B"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Eighteen", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Eighteen", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Story A", summary: "a", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { pa_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${pa_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${pa_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { sa_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Story B", summary: "b", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { pb_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${pb_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${pb_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { sb_id: "$.data.greenlit_story_id" } }
          trigger:
            - { call: "POST /newsroom/assignments", payload: { story_id: "${sa_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:00:00Z", planned_effort_minutes: 30 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a1_id: "$.data.id" } }
            - { call: "GET /newsroom/staff/${rep_id}", payload: {}, as: NewsDirector, captures: { ac1: "$.data.active_assignment_count" } }
            - { call: "POST /newsroom/assignments/${a1_id}/cancel", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "GET /newsroom/staff/${rep_id}", payload: {}, as: NewsDirector, captures: { ac2: "$.data.active_assignment_count" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${sb_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z", planned_effort_minutes: 30 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { a2_id: "$.data.id" } }
            - { call: "GET /newsroom/staff/${rep_id}", payload: {}, as: NewsDirector, captures: { ac3: "$.data.active_assignment_count" } }
            - { call: "POST /newsroom/assignments/${a2_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "GET /newsroom/staff/${rep_id}", payload: {}, as: NewsDirector, captures: { ac4: "$.data.active_assignment_count" } }
            - { call: "POST /newsroom/assignments/${a2_id}/complete", payload: { actual_effort_minutes: 30 }, as: Reporter, as_user_id: "${rep_id}" }
            - { call: "GET /newsroom/staff/${rep_id}", payload: {}, as: NewsDirector, captures: { ac5: "$.data.active_assignment_count" } }
          assert:
            - "ac1 == 1 and ac2 == 0 (propose/cancel compensate exactly)"
            - "ac3 == 1 and ac4 == 1 (PROPOSED -> ACCEPTED leaves the counted set unchanged)"
            - "ac5 == 0 (completion releases the count)"
            - "invariant at every step: active_assignment_count == count(Assignment with staff_id = rep AND status IN {PROPOSED, ACCEPTED})"
