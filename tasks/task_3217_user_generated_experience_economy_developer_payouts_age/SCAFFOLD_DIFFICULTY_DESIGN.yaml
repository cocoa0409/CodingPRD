            - *clock
            - call: "POST /ugc/users"
              payload: { username: "par_g", email: "par_g@x.com", date_of_birth: "1985-01-01" }
              as: Anonymous
              captures: { par_g_id: $.data.id, par_g_v: $.data.version }
