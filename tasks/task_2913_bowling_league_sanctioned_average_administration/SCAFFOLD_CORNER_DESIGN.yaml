  # ==========================================================================
  # SECTION 6 - errors  (claim-extraction-guide Table 6)
  #   "Verify every error code is triggerable" - the coverage cross-check for
  #   §1.6 lives across every section of this file; the instances below own the
  #   envelope itself and the authentication / existence preamble that no other
  #   section reaches (ERR_UNAUTHENTICATED, ERR_UNKNOWN_ACTOR).
