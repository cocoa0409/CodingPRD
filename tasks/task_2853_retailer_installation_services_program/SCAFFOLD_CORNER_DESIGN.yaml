              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, pv: $.data.version, ful0: $.data.fulfillment_status }
          trigger:
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "CUSTOMER_REQUEST", lines: [], expected_project_version: "${pv}" }
              as: ProjectCoordinator
              captures: { e_empty: $.data.error_id }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "CUSTOMER_REQUEST", lines: [{ unit_kind: "TRIM_UNITS", units_delta: 1.00 }, { unit_kind: "TRIM_UNITS", units_delta: 1.00 }, { unit_kind: "TRIM_UNITS", units_delta: 1.00 }, { unit_kind: "TRIM_UNITS", units_delta: 1.00 }, { unit_kind: "TRIM_UNITS", units_delta: 1.00 }, { unit_kind: "TRIM_UNITS", units_delta: 1.00 }, { unit_kind: "TRIM_UNITS", units_delta: 1.00 }, { unit_kind: "TRIM_UNITS", units_delta: 1.00 }, { unit_kind: "TRIM_UNITS", units_delta: 1.00 }, { unit_kind: "TRIM_UNITS", units_delta: 1.00 }, { unit_kind: "TRIM_UNITS", units_delta: 1.00 }], expected_project_version: "${pv}" }
              as: ProjectCoordinator
              captures: { e_eleven: $.data.error_id }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "MEASUREMENT_VARIANCE", lines: [], expected_project_version: "${pv}" }
              as: ProjectCoordinator
              captures: { e_origin: $.data.error_id }
          assert:
            - "${ful0} == 'MEASURED'"
            - "${e_empty} == 'ERR_CHANGE_ORDER_SHAPE' with HTTP 422 — a priced origin needs 1..10 lines"
            - "${e_eleven} == 'ERR_CHANGE_ORDER_SHAPE' with HTTP 422 — eleven lines exceed the cap of 10"
            - "${e_origin} == 'ERR_CHANGE_ORDER_SHAPE' with HTTP 422, NOT ERR_INVALID_FIELD_TYPE — MEASUREMENT_VARIANCE is a valid enum value that only the server may mint"
