scenario: "572. Ice Rink & Learn-to-Skate (public skate/hockey): ice-slot scheduling & resurfacing buffer, public-skate admission & skate rental, learn-to-skate level & class, hockey/figure league & locker, rink rental & broomball, skate sharpening, party package, recurring tuition"
domain_name: "ice-rink-learn-to-skate"
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: hybrid
  # Rink is a resource parent of IceSlot / LockerAssignment; peer entities
  # (Skater, League, SharpeningOrder) link by FK; LearnToSkateClass is
  # self-referential via prerequisite_class_id (graph edge).

  state_machine_shape: cyclic
  # IceSlot cycles DRAFT<->SCHEDULED; TuitionSubscription cycles ACTIVE<->PAST_DUE.
  # LearnToSkateClass is compound (FULL derived from enrolled_count).

  relationship_patterns:
    - one_to_many          # Rink -> IceSlot, IceSlot -> PublicSkateAdmission, Class -> Enrollment
    - self_referential     # LearnToSkateClass.prerequisite_class_id -> LearnToSkateClass
    - cross_aggregate      # LockerAssignment.league_registration_id -> LeagueRegistration

  role_model: hierarchical_override
  # RinkManager is an operational superset; FrontDesk handles desk operations;
  # Skater (entity_backed) acts only on its own resources.

  consistency_model: immediate

# =====================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =====================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# 1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Rink
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the ice rink"
      - name: resurface_buffer_minutes
        type: integer
        source: input
        description: "Minutes of resurfacing (Zamboni) buffer that must separate two ice slots on this rink"
        constraints: ">= 0"
      - name: open_hour_utc
        type: integer
        source: input
        description: "Hour-of-day (0-23, UTC) the rink opens; ice slots must start at or after this hour"
        default: 6
      - name: close_hour_utc
        type: integer
        source: input
        description: "Hour-of-day (0-23, UTC) the rink closes; ice slots must end at or before this hour"
        default: 23
      - name: peak_start_hour_utc
        type: integer
        source: input
        description: "Hour-of-day (UTC) at/after which rental pricing is PEAK; before it is OFF_PEAK"
        default: 16
      - name: public_skate_capacity
        type: integer
        source: input
        description: "Maximum simultaneously-ADMITTED skaters for any PUBLIC_SKATE ice slot on this rink"
        constraints: ">= 1"
      - name: public_skate_fee_cents
        type: integer
        source: input
        description: "Per-admission fee (in cents) charged to the skater's wallet on admission"
        constraints: ">= 0"
      - name: rental_skate_count
        type: integer
        source: input
        description: "Total pairs of rental skates owned by this rink"
        constraints: ">= 0"
      - name: locker_count
        type: integer
        source: input
        description: "Total lockers at this rink; locker_number ranges 1..locker_count"
        constraints: ">= 0"
      - name: locker_fee_cents
        type: integer
        source: input
        description: "Fee (in cents) charged to the skater's wallet when a locker is assigned"
        constraints: ">= 0"
      - name: available_rental_skates
        type: integer
        source: computed
        description: "rental_skate_count minus count of PublicSkateAdmission with rental_skate=true and status=ADMITTED on this rink's slots (see calc rink_available_rental_skates)"
      - name: available_lockers
        type: integer
        source: computed
        description: "locker_count minus count of DISTINCT locker_number among ACTIVE LockerAssignments on this rink (see calc rink_available_lockers)"

  - name: Skater
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Skater full name"
      - name: email
        type: string
        source: input
        description: "Skater email (unique)"
        constraints: "unique across Skater"
      - name: membership
        type: enum
        source: input
        description: "Membership status affecting rental discount"
        default: NON_MEMBER
        constraints: "one of {MEMBER, NON_MEMBER}"
      - name: wallet_credit_cents
        type: integer
        source: system
        description: "Prepaid wallet balance in cents; charges deduct, refunds credit"
        default: 0

  - name: IceSlot
    parent: Rink
    common_fields: true
    fields:
      - name: rink_id
        type: string
        source: input
        description: "FK -> Rink.id"
      - name: purpose
        type: enum
        source: input
        description: "Intended use of this ice slot"
        constraints: "one of {PUBLIC_SKATE, LEARN_TO_SKATE, LEAGUE, RENTAL, BROOMBALL, PARTY}"
      - name: start_utc
        type: datetime
        source: input
        description: "Slot start (ISO 8601 UTC), inclusive"
      - name: end_utc
        type: datetime
        source: input
        description: "Slot end (ISO 8601 UTC), exclusive; must be after start_utc"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, SCHEDULED, COMPLETED, CANCELLED}"
      - name: admitted_count
        type: integer
        source: computed
        description: "Count of PublicSkateAdmission with status=ADMITTED for this slot (see calc public_skate_available_capacity)"
      - name: available_capacity
        type: integer
        source: computed
        description: "rink.public_skate_capacity minus admitted_count for this slot (see calc public_skate_available_capacity)"

  - name: PublicSkateAdmission
    parent: IceSlot
    common_fields: true
    fields:
      - name: ice_slot_id
        type: string
        source: input
        description: "FK -> IceSlot.id; must be a PUBLIC_SKATE slot in status SCHEDULED"
      - name: skater_id
        type: string
        source: input
        description: "FK -> Skater.id; the admitted skater whose wallet is charged"
      - name: rental_skate
        type: boolean
        source: input
        description: "Whether a pair of rental skates is issued with this admission"
        default: false
      - name: captured_cents
        type: integer
        source: computed
        description: "Fee captured from the skater wallet at admission = rink.public_skate_fee_cents while ADMITTED; 0 after EXITED or REFUNDED"
      - name: refunded_cents
        type: integer
        source: system
        description: "Amount credited back to the skater wallet on REFUND"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: ADMITTED
        constraints: "one of {ADMITTED, EXITED, REFUNDED}"

  - name: LearnToSkateClass
    parent: null
    common_fields: true
    fields:
      - name: ice_slot_id
        type: string
        source: input
        description: "FK -> IceSlot.id; must be a LEARN_TO_SKATE slot"
      - name: prerequisite_class_id
        type: string
        source: input
        description: "FK -> LearnToSkateClass.id; the class a skater must have COMPLETED before enrolling here (null for entry level)"
      - name: level_name
        type: string
        source: input
        description: "Learn-to-skate level label, e.g. SNOWPLOW, BASIC_1"
      - name: capacity
        type: integer
        source: input
        description: "Maximum ENROLLED skaters"
        constraints: ">= 1"
      - name: enrolled_count
        type: integer
        source: computed
        description: "Count of Enrollment with status=ENROLLED for this class"
      - name: status
        type: enum
        source: system
        description: "OPEN accepts enrollments; FULL when enrolled_count==capacity; auto-reverts to OPEN on withdraw"
        default: OPEN
        constraints: "one of {OPEN, FULL, CANCELLED, COMPLETED}"

  - name: Enrollment
    parent: LearnToSkateClass
    common_fields: true
    fields:
      - name: class_id
        type: string
        source: input
        description: "FK -> LearnToSkateClass.id"
      - name: skater_id
        type: string
        source: input
        description: "FK -> Skater.id"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: ENROLLED
        constraints: "one of {ENROLLED, COMPLETED, WITHDRAWN}"

  - name: TuitionSubscription
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this recurring tuition funds"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Recurring monthly tuition charge in cents"
        constraints: ">= 0"
      - name: proration_mode
        type: enum
        source: input
        description: "Refund proration algorithm applied on cancel"
        default: CALENDAR
        constraints: "one of {CALENDAR, SESSIONS}"
      - name: billing_cycle_start
        type: string
        source: input
        description: "Current cycle start date (YYYY-MM-DD), inclusive"
      - name: billing_cycle_end
        type: string
        source: input
        description: "Current cycle end date (YYYY-MM-DD), exclusive"
      - name: total_sessions_in_cycle
        type: integer
        source: input
        description: "Number of class sessions in the current cycle (used by SESSIONS proration)"
        constraints: ">= 1"
      - name: sessions_attended
        type: integer
        source: input
        description: "Sessions already attended this cycle (used by SESSIONS proration)"
        default: 0
      - name: captured_cents
        type: integer
        source: system
        description: "Amount charged to the skater wallet when the subscription was created (= monthly_fee_cents)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: ACTIVE
        constraints: "one of {ACTIVE, PAST_DUE, CANCELLED}"

  - name: League
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "League name"
      - name: sport
        type: enum
        source: input
        description: "Sport type"
        constraints: "one of {HOCKEY, FIGURE}"
      - name: season_start
        type: string
        source: input
        description: "Season start date (YYYY-MM-DD)"
      - name: season_end
        type: string
        source: input
        description: "Season end date (YYYY-MM-DD)"
      - name: roster_capacity
        type: integer
        source: input
        description: "Maximum ACTIVE registrations"
        constraints: ">= 1"
      - name: roster_count
        type: integer
        source: computed
        description: "Count of LeagueRegistration with status=ACTIVE for this league"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: REGISTRATION_OPEN
        constraints: "one of {REGISTRATION_OPEN, IN_SEASON, CANCELLED}"

  - name: LeagueRegistration
    parent: League
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; must be in status REGISTRATION_OPEN to register"
      - name: skater_id
        type: string
        source: input
        description: "FK -> Skater.id"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: ACTIVE
        constraints: "one of {ACTIVE, CANCELLED}"

  - name: LockerAssignment
    parent: Rink
    common_fields: true
    fields:
      - name: rink_id
        type: string
        source: input
        description: "FK -> Rink.id"
      - name: skater_id
        type: string
        source: input
        description: "FK -> Skater.id; the renter whose wallet is charged the locker fee"
      - name: league_registration_id
        type: string
        source: input
        description: "FK -> LeagueRegistration.id; set when the locker was created as a side effect of a league registration (null otherwise)"
      - name: locker_number
        type: integer
        source: input
        description: "Client-chosen locker index 1..rink.locker_count"
        constraints: "1 <= locker_number <= rink.locker_count"
      - name: season_start_date
        type: string
        source: input
        description: "Assignment start date (YYYY-MM-DD), inclusive"
      - name: season_end_date
        type: string
        source: input
        description: "Assignment end date (YYYY-MM-DD), exclusive"
      - name: size
        type: enum
        source: input
        description: "Locker size"
        default: STANDARD
        constraints: "one of {STANDARD, TALL}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: ACTIVE
        constraints: "one of {ACTIVE, RELEASED}"

  - name: SlotBooking
    parent: IceSlot
    common_fields: true
    fields:
      - name: ice_slot_id
        type: string
        source: input
        description: "FK -> IceSlot.id; slot purpose must match booking_type (RENTAL->PRIVATE_RENTAL, BROOMBALL->BROOMBALL, PARTY->PARTY)"
      - name: skater_id
        type: string
        source: input
        description: "FK -> Skater.id; the host/renter"
      - name: booking_type
        type: enum
        source: input
        description: "Kind of private booking"
        constraints: "one of {PRIVATE_RENTAL, BROOMBALL, PARTY}"
      - name: includes_resurface
        type: boolean
        source: input
        description: "RENTAL/BROOMBALL only: add resurfacing surcharge to the quote"
        default: false
      - name: base_fee_cents
        type: integer
        source: input
        description: "PARTY only: flat base fee in cents"
        default: 0
      - name: per_guest_cents
        type: integer
        source: input
        description: "PARTY only: pre-tax per-guest charge in cents"
        default: 0
      - name: guest_count_booked
        type: integer
        source: input
        description: "PARTY only: guests declared at booking (drives provisional charge)"
        default: 0
      - name: guest_count_final
        type: integer
        source: input
        description: "PARTY only: actual guests recorded at completion (drives final charge)"
        default: 0
      - name: tax_rate
        type: number
        source: input
        description: "PARTY only: tax rate applied per guest line, e.g. 0.05"
        default: 0
      - name: quoted_cents
        type: integer
        source: computed
        description: "Provisional charge computed at booking (see calc slot_booking_rental_quote / slot_booking_party_charge)"
      - name: final_cents
        type: integer
        source: computed
        description: "Final charge computed at completion (PARTY: recomputed on guest_count_final); 0 until COMPLETED"
      - name: captured_cents
        type: integer
        source: system
        description: "Amount charged to the skater wallet; quoted_cents at booking, adjusted to final_cents at completion"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: BOOKED
        constraints: "one of {BOOKED, COMPLETED, CANCELLED}"

  - name: SharpeningOrder
    parent: Skater
    common_fields: true
    fields:
      - name: skater_id
        type: string
        source: input
        description: "FK -> Skater.id"
      - name: skate_type
        type: enum
        source: input
        description: "Kind of blade to sharpen"
        constraints: "one of {HOCKEY, FIGURE, GOALIE}"
      - name: price_cents
        type: integer
        source: input
        description: "Flat sharpening price in cents"
        constraints: ">= 0"
      - name: queue_position
        type: integer
        source: computed
        description: "1-based position among orders in status RECEIVED or IN_PROGRESS, ordered by created_at ASC (see calc sharpening_queue_position)"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: RECEIVED
        constraints: "one of {RECEIVED, IN_PROGRESS, READY, PICKED_UP}"

# =====================================================================
# 1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: IceSlot
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /ice-slots/{id}/publish"
        actor: RinkManager
        preconditions:
          - "rink open/close hours: start_utc hour >= rink.open_hour_utc AND end_utc hour <= rink.close_hour_utc"
          - "no resurface-buffer overlap: for every non-terminal IceSlot S on the same rink, the buffered window [S.start_utc - buffer, S.end_utc + buffer] does NOT overlap [this.start_utc, this.end_utc] (buffer = rink.resurface_buffer_minutes); adjacency where the gap equals buffer exactly is allowed"
        side_effects: ["sets status=SCHEDULED"]
      - from: SCHEDULED
        to: DRAFT
        trigger: "POST /ice-slots/{id}/unpublish"
        actor: RinkManager
        preconditions:
          - "no child bookings: zero PublicSkateAdmission(ADMITTED), zero LearnToSkateClass(non-terminal), zero SlotBooking(BOOKED) reference this slot"
        side_effects: ["sets status=DRAFT"]
        note: "Cyclic edge DRAFT<->SCHEDULED (Rule 3 non-linear on IceSlot)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ice-slots/{id}/cancel"
        actor: RinkManager
        preconditions: []
        side_effects:
          - "conditional cascade by purpose"
          - "PUBLIC_SKATE: every PublicSkateAdmission(ADMITTED) -> REFUNDED (credits wallet, restores rental skate)"
          - "LEARN_TO_SKATE: every LearnToSkateClass(non-terminal) on this slot -> CANCELLED, which cascades to Enrollment -> WITHDRAWN, which cascades to TuitionSubscription -> CANCELLED with proration refund (Rule 4 cascade A)"
          - "RENTAL/BROOMBALL/PARTY: every SlotBooking(BOOKED) -> CANCELLED (refunds captured_cents to wallet)"
          - "increments version"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /ice-slots/{id}/cancel"
        actor: RinkManager
        preconditions: []
        side_effects: ["sets status=CANCELLED (no children exist on a DRAFT slot)"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /ice-slots/{id}/complete"
        actor: RinkManager
        preconditions:
          - "clock now >= end_utc"
        side_effects:
          - "PUBLIC_SKATE: every PublicSkateAdmission(ADMITTED) -> EXITED (restores rental skate; captured_cents recognized as revenue, wallet NOT credited)"

  - entity: LearnToSkateClass
    initial_state: OPEN
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system, on Enrollment create when enrolled_count reaches capacity"
        actor: system
        preconditions: ["enrolled_count == capacity after the new enrollment"]
        side_effects: ["sets status=FULL"]
        note: "Compound/bubble-up from Enrollment count"
      - from: FULL
        to: OPEN
        trigger: "system, on Enrollment withdraw when enrolled_count drops below capacity"
        actor: system
        preconditions: ["enrolled_count < capacity after withdraw"]
        side_effects: ["sets status=OPEN"]
      - from: OPEN
        to: CANCELLED
        trigger: "system, on parent IceSlot cancel"
        actor: system
        preconditions: []
        side_effects: ["every Enrollment(ENROLLED) -> WITHDRAWN (cascade A hop 2)"]
      - from: FULL
        to: CANCELLED
        trigger: "system, on parent IceSlot cancel"
        actor: system
        preconditions: []
        side_effects: ["every Enrollment(ENROLLED) -> WITHDRAWN (cascade A hop 2)"]
      - from: OPEN
        to: COMPLETED
        trigger: "system, on parent IceSlot complete"
        actor: system
        preconditions: []
        side_effects: ["every Enrollment(ENROLLED) -> COMPLETED"]

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw (or system, on class cancel)"
        actor: Skater
        preconditions: []
        side_effects:
          - "class.enrolled_count decremented; class FULL -> OPEN if now below capacity"
          - "every TuitionSubscription(ACTIVE or PAST_DUE) for this enrollment -> CANCELLED with proration refund (cascade A hop 3)"
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /enrollments/{id}/complete (or system, on class complete)"
        actor: RinkManager
        preconditions: []
        side_effects: ["skater now satisfies this class as a prerequisite for downstream classes"]
        note: "Branching: ENROLLED -> {WITHDRAWN, COMPLETED}"

  - entity: TuitionSubscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /tuition-subscriptions/{id}/advance-cycle"
        actor: RinkManager
        preconditions: ["clock now >= billing_cycle_end"]
        side_effects: ["rolls billing_cycle_start/end forward by one month; sets status=PAST_DUE; increments version"]
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /tuition-subscriptions/{id}/pay"
        actor: Skater
        preconditions: ["skater.wallet_credit_cents >= monthly_fee_cents"]
        side_effects: ["wallet -= monthly_fee_cents; captured_cents += monthly_fee_cents; sets status=ACTIVE; increments version"]
        note: "Cyclic edge ACTIVE<->PAST_DUE (Rule 3 non-linear on TuitionSubscription)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /tuition-subscriptions/{id}/cancel (or system, on enrollment withdraw)"
        actor: Skater
        preconditions: []
        side_effects: ["computes proration refund via calc tuition_proration_refund; wallet += refund; sets status=CANCELLED; increments enrollment.version"]
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /tuition-subscriptions/{id}/cancel (or system, on enrollment withdraw)"
        actor: Skater
        preconditions: []
        side_effects: ["no refund (cycle already lapsed unpaid); sets status=CANCELLED"]

  - entity: League
    initial_state: REGISTRATION_OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: REGISTRATION_OPEN
        to: IN_SEASON
        trigger: "POST /leagues/{id}/start"
        actor: RinkManager
        preconditions: []
        side_effects: ["sets status=IN_SEASON; registrations no longer accepted"]
      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "POST /leagues/{id}/cancel"
        actor: RinkManager
        preconditions: []
        side_effects:
          - "every LeagueRegistration(ACTIVE) -> CANCELLED (cascade B hop 1)"
      - from: IN_SEASON
        to: CANCELLED
        trigger: "POST /leagues/{id}/cancel"
        actor: RinkManager
        preconditions: []
        side_effects:
          - "every LeagueRegistration(ACTIVE) -> CANCELLED (cascade B hop 1)"

  - entity: LeagueRegistration
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "system, on parent League cancel"
        actor: system
        preconditions: []
        side_effects:
          - "if a LockerAssignment(ACTIVE) has league_registration_id == this registration, it -> RELEASED, restoring rink.available_lockers (cascade B hop 2-3)"

  - entity: LockerAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /locker-assignments/{id}/release (or system, on league registration cancel)"
        actor: Skater
        preconditions: []
        side_effects: ["sets status=RELEASED; rink.available_lockers recomputed (+1 for this locker_number)"]

  - entity: SlotBooking
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /slot-bookings/{id}/complete"
        actor: RinkManager
        preconditions: ["clock now >= ice_slot.end_utc"]
        side_effects:
          - "PARTY: recompute final_cents via calc slot_booking_party_charge on guest_count_final; wallet adjusted by (final_cents - captured_cents); captured_cents = final_cents"
          - "RENTAL/BROOMBALL: final_cents = quoted_cents (no headcount change)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /slot-bookings/{id}/cancel"
        actor: Skater
        preconditions: []
        side_effects: ["wallet += captured_cents; captured_cents = 0; sets status=CANCELLED"]

  - entity: SharpeningOrder
    initial_state: RECEIVED
    terminal_states: [PICKED_UP]
    transitions:
      - from: RECEIVED
        to: IN_PROGRESS
        trigger: "POST /sharpening-orders/{id}/advance"
        actor: FrontDesk
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: READY
        trigger: "POST /sharpening-orders/{id}/advance"
        actor: FrontDesk
        preconditions: []
        side_effects: ["order leaves the queue; queue_position of later RECEIVED/IN_PROGRESS orders recomputed"]
      - from: READY
        to: PICKED_UP
        trigger: "POST /sharpening-orders/{id}/advance"
        actor: FrontDesk
        preconditions: []
        side_effects: []

# =====================================================================
# 1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: tuition-subscription-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /enrollments/{id}/tuition-subscriptions"
    occ_field: "expected_enrollment_version"
    description: |
      Creating a new TuitionSubscription against an Enrollment whose version has
      advanced since the client last observed it is rejected. A new ACTIVE
      subscription legitimately supersedes any prior ACTIVE subscription on the
      same enrollment (the prior one is cancelled), so a writer holding a stale
      view of the enrollment must be rejected rather than silently creating a
      second superseding subscription.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# 1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: tuition_proration_refund
    trigger: "TuitionSubscription ACTIVE -> CANCELLED (POST /tuition-subscriptions/{id}/cancel, or enrollment withdraw cascade)"
    algorithm: dual_variant
    formula: |
      cancel_date = clock_now.date()   # date part of logical clock
      if proration_mode == CALENDAR:
          total_days     = (billing_cycle_end - billing_cycle_start).days
          days_remaining = max(0, (billing_cycle_end - cancel_date).days)
          refund = round_half_up(monthly_fee_cents * days_remaining / total_days)
      elif proration_mode == SESSIONS:
          remaining = max(0, total_sessions_in_cycle - sessions_attended)
          refund = round_half_up(monthly_fee_cents * remaining / total_sessions_in_cycle)
      wallet_credit_cents += refund
    input_set: "The single subscription being cancelled; only applies from status ACTIVE (PAST_DUE cancel refunds 0)"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: calendar
        when: "proration_mode == CALENDAR"
        difference: "prorates by calendar days remaining in the cycle"
      - name: sessions
        when: "proration_mode == SESSIONS"
        difference: "prorates by unused class sessions; same fee+cycle yields a different refund than calendar"

  - name: slot_booking_party_charge
    trigger: "SlotBooking(PARTY) create (provisional -> quoted_cents) and BOOKED -> COMPLETED (final -> final_cents)"
    algorithm: aggregation
    formula: |
      # per-guest line, tax rounded PER GUEST then summed (pinned order)
      guest_line   = per_guest_cents + (rental_per_guest add-on omitted; parties do not add rental here)
      tax_per_guest = round_half_up(per_guest_cents * tax_rate)
      guest_total   = per_guest_cents + tax_per_guest
      def charge(n): return base_fee_cents + n * guest_total
      quoted_cents = charge(guest_count_booked)     # provisional variant, at booking
      final_cents  = charge(guest_count_final)      # final variant, at completion
    input_set: "The single PARTY SlotBooking; provisional uses guest_count_booked, final uses guest_count_final"
    constants: {}
    precision: "integer cents; tax rounded round_half_up PER GUEST LINE, then summed (NOT sum-then-tax)"
    variants:
      - name: provisional
        when: "at booking (status BOOKED)"
        difference: "uses guest_count_booked"
      - name: final
        when: "at completion (BOOKED -> COMPLETED)"
        difference: "uses guest_count_final; differs from provisional whenever headcount changed"

  - name: slot_booking_rental_quote
    trigger: "SlotBooking(PRIVATE_RENTAL or BROOMBALL) create -> quoted_cents"
    algorithm: tiered_pricing
    formula: |
      hours = (ice_slot.end_utc - ice_slot.start_utc).total_seconds() / 3600
      rate  = PEAK_RATE_CENTS_PER_HOUR if ice_slot.start_utc.hour >= rink.peak_start_hour_utc else OFF_PEAK_RATE_CENTS_PER_HOUR
      base  = round_half_up(rate * hours)
      discount = round_half_up(base * MEMBER_DISCOUNT_PCT) if skater.membership == MEMBER else 0
      broomball_fee = BROOMBALL_EQUIPMENT_CENTS if booking_type == BROOMBALL else 0
      resurface_fee = RESURFACE_SURCHARGE_CENTS if includes_resurface else 0
      quoted_cents = base - discount + broomball_fee + resurface_fee   # evaluation order pinned
    input_set: "The single RENTAL/BROOMBALL SlotBooking; peak tier from slot start hour, discount from skater membership"
    constants:
      PEAK_RATE_CENTS_PER_HOUR: 20000
      OFF_PEAK_RATE_CENTS_PER_HOUR: 12000
      MEMBER_DISCOUNT_PCT: 0.10
      BROOMBALL_EQUIPMENT_CENTS: 5000
      RESURFACE_SURCHARGE_CENTS: 4000
    precision: "integer cents, round_half_up; base and discount each rounded before summing"

  - name: public_skate_available_capacity
    trigger: "read of IceSlot.admitted_count / available_capacity; evaluated on POST /ice-slots/{id}/admissions"
    algorithm: aggregation
    formula: |
      admitted_count = count(PublicSkateAdmission where ice_slot_id == slot.id and status == ADMITTED)
      available_capacity = rink.public_skate_capacity - admitted_count
      # admission allowed iff admitted_count < rink.public_skate_capacity (strict; == capacity rejects)
    input_set: "PublicSkateAdmission rows in status ADMITTED for the target slot only"
    constants: {}
    precision: "integer count"

  - name: rink_available_rental_skates
    trigger: "read of Rink.available_rental_skates; evaluated on admission with rental_skate=true"
    algorithm: aggregation
    formula: |
      in_use = count(PublicSkateAdmission where status == ADMITTED and rental_skate == true
                     and ice_slot.rink_id == rink.id)
      available_rental_skates = rink.rental_skate_count - in_use
      # rental admission allowed iff available_rental_skates >= 1
    input_set: "ADMITTED admissions with rental_skate=true across all slots of the rink"
    constants: {}
    precision: "integer count"

  - name: rink_available_lockers
    trigger: "read of Rink.available_lockers; evaluated on POST /rinks/{id}/locker-assignments and release"
    algorithm: aggregation
    formula: |
      occupied = count(DISTINCT locker_number among LockerAssignment
                       where rink_id == rink.id and status == ACTIVE)
      available_lockers = rink.locker_count - occupied
    input_set: "ACTIVE LockerAssignment rows for the rink"
    constants: {}
    precision: "integer count"

  - name: sharpening_queue_position
    trigger: "read of SharpeningOrder.queue_position"
    algorithm: chronological
    formula: |
      # order by created_at ASC (never by id); position is 1-based among live orders
      live = [o for o in SharpeningOrder if o.status in (RECEIVED, IN_PROGRESS)]
      live_sorted = sort(live, key = created_at ASC)
      queue_position = index_of(this order in live_sorted) + 1
      # PICKED_UP / READY / CANCELLED orders are excluded and do not occupy a position
    input_set: "SharpeningOrder rows in status RECEIVED or IN_PROGRESS"
    constants: {}
    precision: "integer; tie-break by created_at only (ids never decide order)"

# =====================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /skaters and POST /rinks (bootstrap) — those still require a valid operator role"
  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per RBAC matrix; for entity_backed Skater acting on its own resource, X-User-ID equals the resource's skater_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (rink, ice slot, skater, class, enrollment, subscription, league, registration, locker assignment, slot booking, sharpening order), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested transition (e.g. admission only on a SCHEDULED PUBLIC_SKATE slot; publish only from DRAFT; enroll only on an OPEN class; register only on a REGISTRATION_OPEN league; advance-cycle only when clock >= billing_cycle_end)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_referential
    check: "Enrollment prerequisite: if class.prerequisite_class_id is set, the skater must have an Enrollment with status COMPLETED in that prerequisite class"
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /learn-to-skate-classes/{id}/enrollments"
  - priority: 6
    category: business_temporal
    check: "Ice-slot resurface-buffer overlap on the same rink (buffered-window collision) OR locker season-range overlap on the same rink+locker_number (half-open [start,end) collision among ACTIVE assignments)"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /ice-slots/{id}/publish (slot overlap); locker overlap uses ERR_LOCKER_OCCUPIED"
  - priority: 6
    category: business_temporal
    check: "Locker season-range overlap: requested [season_start_date, season_end_date) collides with an existing ACTIVE LockerAssignment on the same rink and locker_number; adjacency where existing.end == requested.start is allowed (half-open)"
    error_id: ERR_LOCKER_OCCUPIED
    http_status: 409
    applies_to: "POST /rinks/{id}/locker-assignments"
  - priority: 7
    category: business_constraint
    check: "Capacity / roster / inventory: public-skate slot admitted_count < capacity; class enrolled_count < capacity; league roster_count < roster_capacity; locker_number within 1..locker_count"
    error_id: ERR_CAPACITY_FULL
    http_status: 409
    applies_to: "POST admissions / enrollments / league registrations / locker-assignments"
  - priority: 7
    category: business_constraint
    check: "Rental skate inventory: admission with rental_skate=true requires rink.available_rental_skates >= 1"
    error_id: ERR_NO_RENTAL_SKATES
    http_status: 409
    applies_to: "POST /ice-slots/{id}/admissions"
  - priority: 8
    category: business_fiscal
    check: "Skater wallet has sufficient credit for the charge (admission fee, locker fee, tuition monthly fee, slot-booking quote)"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST admissions / locker-assignments / tuition-subscriptions / slot-bookings / tuition pay"
  - priority: 9
    category: state
    check: "OCC: expected_enrollment_version matches Enrollment.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enrollments/{id}/tuition-subscriptions"
  - priority: 10
    category: business_constraint
    check: "Field-level validity: required fields present, enums valid, end after start, non-negative amounts, pagination limit within 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =====================================================================
# 1.5 API Endpoint Table
# =====================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [RinkManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advances/rewinds logical clock used by all time-gated rules"]

  - method: POST
    path: "/rinks"
    description: "Create a rink"
    roles: [RinkManager]
    code: 201
    input: [name, resurface_buffer_minutes, public_skate_capacity, public_skate_fee_cents, rental_skate_count, locker_count, locker_fee_cents, "open_hour_utc?", "close_hour_utc?", "peak_start_hour_utc?"]
    output: Rink
    side_effects: []
  - method: GET
    path: "/rinks/{id}"
    description: "Fetch a rink (includes computed available_rental_skates, available_lockers)"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: []
    output: Rink

  - method: POST
    path: "/skaters"
    description: "Register a skater"
    roles: [RinkManager, FrontDesk]
    code: 201
    input: [full_name, email, "membership?"]
    output: Skater
    side_effects: []
  - method: GET
    path: "/skaters/{id}"
    description: "Fetch a skater (includes wallet_credit_cents)"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: []
    output: Skater
  - method: POST
    path: "/skaters/{id}/wallet/adjustments"
    description: "Admin wallet credit/debit (comps, top-ups). amount_cents may be negative to debit."
    roles: [RinkManager]
    code: 200
    input: [amount_cents, "reason?"]
    output: Skater
    side_effects: ["wallet_credit_cents += amount_cents; increments version"]

  - method: POST
    path: "/ice-slots"
    description: "Create an ice slot in DRAFT on a rink"
    roles: [RinkManager]
    code: 201
    input: [rink_id, purpose, start_utc, end_utc]
    output: IceSlot
    side_effects: []
  - method: GET
    path: "/ice-slots/{id}"
    description: "Fetch an ice slot (includes admitted_count, available_capacity)"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: []
    output: IceSlot
  - method: GET
    path: "/ice-slots"
    description: "List ice slots, filterable"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: ["rink_id?", "purpose?", "status?", "limit?", "offset?"]
    output: IceSlot[]
  - method: POST
    path: "/ice-slots/{id}/publish"
    description: "Publish DRAFT -> SCHEDULED; enforces hours and resurface-buffer overlap"
    roles: [RinkManager]
    code: 200
    input: []
    output: IceSlot
    side_effects: ["sets status=SCHEDULED; increments version"]
  - method: POST
    path: "/ice-slots/{id}/unpublish"
    description: "Revert SCHEDULED -> DRAFT (only when no child bookings)"
    roles: [RinkManager]
    code: 200
    input: []
    output: IceSlot
    side_effects: ["sets status=DRAFT; increments version"]
  - method: POST
    path: "/ice-slots/{id}/cancel"
    description: "Cancel a slot; cascades to children by purpose"
    roles: [RinkManager]
    code: 200
    input: []
    output: IceSlot
    side_effects: ["cascade cancel/refund per purpose (Rule 4 cascade A for LEARN_TO_SKATE); increments version"]
  - method: POST
    path: "/ice-slots/{id}/complete"
    description: "Complete a slot after its end time; exits admissions, completes classes"
    roles: [RinkManager]
    code: 200
    input: []
    output: IceSlot
    side_effects: ["admissions ADMITTED -> EXITED (restore skate); classes -> COMPLETED; increments version"]

  - method: POST
    path: "/ice-slots/{id}/admissions"
    description: "Admit a skater to a PUBLIC_SKATE slot; charges wallet, optional rental skate"
    roles: [FrontDesk, Skater]
    code: 201
    input: [skater_id, "rental_skate?"]
    output: PublicSkateAdmission
    side_effects: ["wallet -= rink.public_skate_fee_cents; captured_cents set; admitted_count++; if rental_skate: available_rental_skates--"]
  - method: GET
    path: "/admissions/{id}"
    description: "Fetch an admission"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: []
    output: PublicSkateAdmission
  - method: GET
    path: "/admissions"
    description: "List admissions, filterable (reverse-reachability for ice_slot_id, skater_id)"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: ["ice_slot_id?", "skater_id?", "status?", "limit?", "offset?"]
    output: PublicSkateAdmission[]
  - method: POST
    path: "/admissions/{id}/refund"
    description: "Refund an ADMITTED admission; compensating action"
    roles: [RinkManager, FrontDesk]
    code: 200
    input: []
    output: PublicSkateAdmission
    side_effects: ["wallet += captured_cents; refunded_cents = captured_cents; captured_cents = 0; admitted_count--; restore rental skate; status=REFUNDED"]

  - method: POST
    path: "/learn-to-skate-classes"
    description: "Create a learn-to-skate class on a LEARN_TO_SKATE slot"
    roles: [RinkManager]
    code: 201
    input: [ice_slot_id, level_name, capacity, "prerequisite_class_id?"]
    output: LearnToSkateClass
    side_effects: []
  - method: GET
    path: "/learn-to-skate-classes/{id}"
    description: "Fetch a class (includes enrolled_count)"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: []
    output: LearnToSkateClass
  - method: GET
    path: "/learn-to-skate-classes"
    description: "List classes, filterable (reverse-reachability for ice_slot_id, prerequisite_class_id)"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: ["ice_slot_id?", "prerequisite_class_id?", "limit?", "offset?"]
    output: LearnToSkateClass[]
  - method: POST
    path: "/learn-to-skate-classes/{id}/enrollments"
    description: "Enroll a skater; enforces class state, prerequisite, capacity"
    roles: [Skater, RinkManager]
    code: 201
    input: [skater_id]
    output: Enrollment
    side_effects: ["enrolled_count++; class OPEN -> FULL if now at capacity"]
  - method: GET
    path: "/enrollments/{id}"
    description: "Fetch an enrollment"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: []
    output: Enrollment
  - method: GET
    path: "/enrollments"
    description: "List enrollments, filterable (reverse-reachability for class_id, skater_id)"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: ["class_id?", "skater_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "Withdraw an enrollment; cascades to tuition cancel + refund"
    roles: [Skater, RinkManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["enrolled_count--; class FULL -> OPEN if below capacity; TuitionSubscription -> CANCELLED with proration refund; increments version"]
  - method: POST
    path: "/enrollments/{id}/complete"
    description: "Mark an enrollment COMPLETED (satisfies prerequisite for downstream classes)"
    roles: [RinkManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status=COMPLETED; increments version"]

  - method: POST
    path: "/enrollments/{id}/tuition-subscriptions"
    description: "Create a recurring tuition subscription; OCC on Enrollment.version; a new ACTIVE subscription supersedes any prior ACTIVE one"
    roles: [Skater, RinkManager]
    code: 201
    input: [expected_enrollment_version, monthly_fee_cents, billing_cycle_start, billing_cycle_end, total_sessions_in_cycle, "proration_mode?", "sessions_attended?"]
    output: TuitionSubscription
    side_effects: ["wallet -= monthly_fee_cents; captured_cents = monthly_fee_cents; any prior ACTIVE subscription -> CANCELLED; increments Enrollment.version by 1"]
  - method: GET
    path: "/tuition-subscriptions/{id}"
    description: "Fetch a subscription"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: []
    output: TuitionSubscription
  - method: GET
    path: "/tuition-subscriptions"
    description: "List subscriptions, filterable (reverse-reachability for enrollment_id)"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: TuitionSubscription[]
  - method: POST
    path: "/tuition-subscriptions/{id}/advance-cycle"
    description: "Roll the billing cycle forward; ACTIVE -> PAST_DUE when clock has passed billing_cycle_end"
    roles: [RinkManager]
    code: 200
    input: []
    output: TuitionSubscription
    side_effects: ["rolls cycle dates forward one month; status=PAST_DUE; increments version"]
  - method: POST
    path: "/tuition-subscriptions/{id}/pay"
    description: "Pay a past-due subscription; PAST_DUE -> ACTIVE"
    roles: [Skater, RinkManager]
    code: 200
    input: []
    output: TuitionSubscription
    side_effects: ["wallet -= monthly_fee_cents; captured_cents += monthly_fee_cents; status=ACTIVE; increments version"]
  - method: POST
    path: "/tuition-subscriptions/{id}/cancel"
    description: "Cancel a subscription; proration refund on ACTIVE"
    roles: [Skater, RinkManager]
    code: 200
    input: []
    output: TuitionSubscription
    side_effects: ["proration refund via calc tuition_proration_refund credited to wallet (ACTIVE only); status=CANCELLED; increments version"]

  - method: POST
    path: "/leagues"
