  # ================================================================ calculations
  - section: calculations
    instances:
      - name: gap_threshold_boundary_48h
        claim_type: boundary
        grounds: [calculations.transmission_gap_detection]
        distinguishing_aspect: "Gap of exactly 48h (>= threshold) fires a TRANSMISSION_GAP event; 47h does not."
        test_recipe:
          setup: ["EVENT episode MONITORING from 2026-05-01T00:00:00Z, no transmissions"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Gap Bound", date_of_birth: "1978-01-01", mrn: "MRN-2020", phone: "555-1021", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
