# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task 1659 Welding Gas & Supply Branch Ops
# §1.9 Coverage Index: every testable claim §1.1–§1.7 declares that §1.8 does
# not already cover. Sections follow references/claim-extraction-guide.md.
# Logical clock default 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /customers with only required fields yields terms=CASH, credit_limit_cents=0, status=ACTIVE, all computed balances 0, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { account_no: "ACC-EN1", name: "Defaults Co" }
              as: CounterRep
              captures: { cid: $.data.id, terms: $.data.terms, limit: $.data.credit_limit_cents, status: $.data.status, posted: $.data.posted_exposure_cents, credit: $.data.credit_balance_cents, ver: $.data.version }
          assert:
            - "terms == CASH and limit == 0 and status == ACTIVE"
            - "posted == 0 and credit == 0 and ver == 1"

      - name: customer_get_roundtrip_and_not_found
        claim_type: retrieval
        grounds: [entities.Customer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET returns the stored entity; a random UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["one customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-EN2", name: "Roundtrip Co" }
              as: CounterRep
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /customers/${cid}"
              as: CounterRep
              captures: { got_name: $.data.name, got_account: $.data.account_no }
            - call: "GET /customers/00000000-0000-0000-0000-000000000000"
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "got_name == 'Roundtrip Co' and got_account == 'ACC-EN2'"
            - "err == ERR_NOT_FOUND (HTTP 404)"

      - name: duplicate_account_no_rejected
        claim_type: type_constraints
        grounds: [entities.Customer.fields.account_no, "errors[ERR_DUPLICATE_ACCOUNT]"]
        distinguishing_aspect: "Second POST with an existing account_no fails ERR_DUPLICATE_ACCOUNT 409."
        test_recipe:
          setup: ["one customer with account_no ACC-EN3"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-EN3", name: "First" }
              as: CounterRep
          trigger:
            - call: "POST /customers"
              payload: { account_no: "ACC-EN3", name: "Second" }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_ACCOUNT"

      - name: duplicate_product_sku_rejected
        claim_type: type_constraints
        grounds: [entities.Product.fields.sku, "errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "Second product with the same sku fails ERR_DUPLICATE_SKU."
        test_recipe:
          setup: ["one product with sku HG-DUP"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "HG-DUP", name: "One", category: "HARDGOOD", retail_price_cents: 100 }
              as: BranchManager
          trigger:
            - call: "POST /products"
              payload: { sku: "HG-DUP", name: "Two", category: "HARDGOOD", retail_price_cents: 200 }
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_SKU"

      - name: duplicate_cylinder_serial_rejected
        claim_type: type_constraints
        grounds: [entities.CylinderAsset.fields.serial_no, "errors[ERR_DUPLICATE_SERIAL]"]
        distinguishing_aspect: "Second cylinder with the same serial_no fails ERR_DUPLICATE_SERIAL."
        test_recipe:
          setup: ["one cylinder with serial CYL-DUP"]
          setup_api_calls:
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-DUP", gas_grade: "ARGON", size: "SMALL" }
              as: BranchManager
          trigger:
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-DUP", gas_grade: "OXYGEN", size: "LARGE" }
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_SERIAL"

      - name: order_draft_computed_fields_zero
        claim_type: computed_fields
        grounds: [entities.Order.fields.subtotal_cents, entities.Order.fields.available_date]
        distinguishing_aspect: "A DRAFT order reports subtotal/delivery/hazmat/total == 0, units summed from lines, available_date null without specialty lines; pricing snapshots exist only after confirm."
        test_recipe:
          setup: ["CASH customer; HARDGOOD product 10000 stock 5"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-EN4", name: "Draft Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-EN4", name: "Soapstone", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 5 }
              as: BranchManager
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${pid}", qty: 2 }] }
              as: CounterRep
              captures: { sub: $.data.subtotal_cents, fee: $.data.delivery_fee_cents, haz: $.data.hazmat_fee_cents, tot: $.data.total_cents, units: $.data.units, avail: $.data.available_date, inv: $.data.invoice_id }
          assert:
            - "sub == 0 and fee == 0 and haz == 0 and tot == 0  (pricing happens at confirm, not create)"
            - "units == 2 and avail == null and inv == null"

      - name: product_needs_reorder_threshold
        claim_type: computed_fields
        grounds: [entities.Product.fields.needs_reorder]
        distinguishing_aspect: "needs_reorder uses <= : stock == reorder_point is true; stock == reorder_point+1 is false."
        test_recipe:
          setup: ["product with reorder_point 5"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "HG-EN5", name: "Lens", category: "HARDGOOD", retail_price_cents: 500, reorder_point: 5 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 5 }
              as: BranchManager
              captures: { flag_at_5: $.data.needs_reorder }
          trigger:
            - call: "POST /products/${pid}/receive"
              payload: { qty: 1 }
              as: BranchManager
              captures: { flag_at_6: $.data.needs_reorder, stock: $.data.stock_on_hand }
          assert:
            - "flag_at_5 == true  (5 <= 5)"
            - "flag_at_6 == false and stock == 6"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_initial_state_is_draft_unpaid
        claim_type: initial_state
        grounds: [state_machines.Order]
        distinguishing_aspect: "New orders start fulfillment_status=DRAFT and payment_status=UNPAID."
        test_recipe:
          setup: ["CASH customer; product stock 1"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-SM1", name: "Init Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-SM1", name: "Chipping Hammer", category: "HARDGOOD", retail_price_cents: 2500 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 1 }
              as: BranchManager
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${pid}", qty: 1 }] }
              as: CounterRep
              captures: { fs: $.data.fulfillment_status, ps: $.data.payment_status }
          assert:
            - "fs == DRAFT and ps == UNPAID"

      - name: order_stage_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Order, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DRAFT -> STAGED is not a declared transition; ERR_INVALID_STATE."
        test_recipe:
          setup: ["CASH customer; product stock 1; DRAFT order"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-SM2", name: "Skip Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-SM2", name: "Pliers", category: "HARDGOOD", retail_price_cents: 1500 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 1 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${pid}", qty: 1 }] }
              as: CounterRep
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/stage"
              payload: {}
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: order_cancel_after_fulfill_rejected_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Order, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "FULFILLED is terminal: cancel afterward fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["CASH order confirmed, paid, staged, fulfilled"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-SM3", name: "Lock Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-SM3", name: "Goggles", category: "HARDGOOD", retail_price_cents: 3000 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 1 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${pid}", qty: 1 }] }
              as: CounterRep
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oid}/pay"
              payload: { amount_cents: 3000 }
              as: CounterRep
            - call: "POST /orders/${oid}/stage"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: CounterRep
          trigger:
            - call: "POST /orders/${oid}/cancel"
              payload: {}
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE  (FULFILLED is terminal)"

      - name: order_cancel_restores_stock_and_route_units
        claim_type: side_effect_execution
        grounds: [state_machines.Order.CONFIRMED_to_CANCELLED, calculations.route_load]
        distinguishing_aspect: "Cancelling a CONFIRMED ROUTE order returns its 2 units to stock (5->3->5) and releases route reserved_units (2->0)."
        test_recipe:
          setup: ["CASH customer; product stock 5; route cap 5; ROUTE order qty 2 CONFIRMED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-SM4", name: "Undo Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-SM4", name: "Apron", category: "HARDGOOD", retail_price_cents: 4000 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 5 }
              as: BranchManager
            - call: "POST /delivery-routes"
              payload: { route_date: "2026-08-03", truck_capacity_units: 5 }
              as: CounterRep
              captures: { rid: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "ROUTE", route_id: "${rid}", lines: [{ product_id: "${pid}", qty: 2 }] }
              as: CounterRep
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/confirm"
              payload: {}
              as: CounterRep
            - call: "GET /delivery-routes/${rid}"
              as: CounterRep
              captures: { reserved_mid: $.data.reserved_units }
          trigger:
            - call: "POST /orders/${oid}/cancel"
              payload: {}
              as: CounterRep
            - call: "GET /delivery-routes/${rid}"
              as: CounterRep
              captures: { reserved_end: $.data.reserved_units }
            - call: "GET /products/${pid}"
              as: CounterRep
              captures: { stock_end: $.data.stock_on_hand }
          assert:
            - "reserved_mid == 2  (confirm reserved the units)"
            - "reserved_end == 0 and stock_end == 5  (cancel compensated both reservations)"

      - name: invoice_void_after_partial_payment_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Invoice.OPEN_to_VOID, "errors[ERR_INVOICE_NOT_VOIDABLE]"]
        distinguishing_aspect: "paid_cents > 0 makes the invoice un-voidable (fiscal guard) even though it is still OPEN."
        test_recipe:
          setup: ["NET30 customer (limit 1000000) with a fulfilled order -> OPEN invoice 10000; 4000 applied by payment"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-SM5", name: "Void Co", terms: "NET30", credit_limit_cents: 1000000 }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-SM5", name: "Rod Oven", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 1 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${pid}", qty: 1 }] }
              as: CounterRep
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oid}/stage"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: CounterRep
              captures: { inv: $.data.invoice_id }
            - call: "GET /customers/${cid}"
              as: CounterRep
              captures: { cv: $.data.version }
            - call: "POST /customers/${cid}/payments"
              payload: { amount_cents: 4000, expected_customer_version: "${cv}" }
              as: CounterRep
          trigger:
            - call: "POST /invoices/${inv}/void"
              payload: {}
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVOICE_NOT_VOIDABLE  (paid_cents 4000 > 0)"

      - name: rental_suspend_skips_billing_resume_recovers
        claim_type: side_effect_execution
        grounds: [state_machines.RentalAgreement.ACTIVE_to_SUSPENDED, calculations.rental_accrual]
        distinguishing_aspect: "Billing run skips SUSPENDED agreements (0 invoices); after resume the same clock position bills floor(40/30)=1 period = 1200."
        test_recipe:
          setup: ["CASH customer; cylinder; DEMURRAGE rental start 2026-08-01 grace 5; clock 2026-09-15 (40 chargeable days)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /customers"
              payload: { account_no: "ACC-SM6", name: "Suspend Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /cylinder-assets"
              payload: { serial_no: "CYL-SM6", gas_grade: "NITROGEN", size: "LARGE" }
              as: BranchManager
              captures: { aid: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cid}", item_type: "CYLINDER", cylinder_asset_id: "${aid}", rate_plan: "DEMURRAGE", start_date: "2026-08-01", grace_days: 5 }
              as: CounterRep
              captures: { ra: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: BranchManager
            - call: "POST /rental-agreements/${ra}/suspend"
              payload: {}
              as: CounterRep
          trigger:
            - call: "POST /billing/run-rental-cycle"
              payload: {}
              as: BranchManager
              captures: { run_susp: $.data.invoices_created }
            - call: "POST /rental-agreements/${ra}/resume"
              payload: {}
              as: CounterRep
            - call: "POST /billing/run-rental-cycle"
              payload: {}
              as: BranchManager
              captures: { run_resumed: $.data.invoices_created, total: $.data.total_billed_cents }
          assert:
            - "run_susp == 0  (SUSPENDED agreements are skipped)"
            - "run_resumed == 1 and total == 1200  (floor(40/30) x 1200)"

      - name: enrollment_cancel_frees_seat
        claim_type: side_effect_execution
        grounds: [state_machines.TrainingEnrollment.ENROLLED_to_CANCELLED, entities.TrainingClass.fields.seats_booked]
        distinguishing_aspect: "Cancelling the only enrollment in a cap-1 class drops seats_booked 1->0 so a new enrollment succeeds."
        test_recipe:
          setup: ["class cap 1; customer; e1 ENROLLED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-SM7", name: "Seat Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /training-classes"
              payload: { title: "CGA Fittings", room: "ROOM_A", start_at: "2026-09-10T09:00:00Z", end_at: "2026-09-10T10:00:00Z", capacity: 1, price_cents: 5000 }
              as: Trainer
              captures: { cl: $.data.id }
            - call: "POST /enrollments"
              payload: { class_id: "${cl}", customer_id: "${cid}", attendee_name: "Sam" }
              as: Trainer
              captures: { e1: $.data.id }
            - call: "POST /enrollments/${e1}/advance"
              payload: { to: "CANCELLED" }
              as: CounterRep
          trigger:
            - call: "POST /enrollments"
              payload: { class_id: "${cl}", customer_id: "${cid}", attendee_name: "Sam" }
              as: Trainer
              captures: { e2: $.data.id }
            - call: "GET /training-classes/${cl}"
              as: Trainer
              captures: { seats: $.data.seats_booked }
          assert:
            - "e2 created (HTTP 201) — the cancelled seat was freed"
            - "seats == 1  (only the live enrollment counts)"

      - name: class_cancel_cascades_enrolled_enrollments
        claim_type: side_effect_execution
        grounds: [state_machines.TrainingClass.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a class cascades ENROLLED enrollments to CANCELLED (both of them) and seats_booked drops to 0."
        test_recipe:
          setup: ["class cap 3 with two ENROLLED enrollments"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-SM8", name: "Class Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /training-classes"
              payload: { title: "Torch Safety", room: "ROOM_B", start_at: "2026-09-12T09:00:00Z", end_at: "2026-09-12T11:00:00Z", capacity: 3, price_cents: 7000 }
              as: Trainer
              captures: { cl: $.data.id }
            - call: "POST /enrollments"
              payload: { class_id: "${cl}", customer_id: "${cid}", attendee_name: "P One" }
              as: Trainer
              captures: { e1: $.data.id }
            - call: "POST /enrollments"
              payload: { class_id: "${cl}", customer_id: "${cid}", attendee_name: "P Two" }
              as: Trainer
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /training-classes/${cl}/advance"
              payload: { to: "CANCELLED" }
              as: Trainer
            - call: "GET /enrollments/${e1}"
              as: Trainer
              captures: { e1_status: $.data.status }
            - call: "GET /enrollments/${e2}"
              as: Trainer
              captures: { e2_status: $.data.status }
            - call: "GET /training-classes/${cl}"
              as: Trainer
              captures: { seats: $.data.seats_booked, cls: $.data.status }
          assert:
            - "cls == CANCELLED and e1_status == CANCELLED and e2_status == CANCELLED  (cascade down)"
            - "seats == 0"

      - name: repair_ticket_terminal_lockdown_and_zero_charge_on_reject_close
        claim_type: terminal_lockdown
        grounds: [state_machines.RepairTicket, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal (further advance -> ERR_INVALID_STATE) and a REJECTED->CLOSED path charges 0."
        test_recipe:
          setup: ["customer; ticket driven INTAKE->DIAGNOSING->QUOTED(8000)->REJECTED->CLOSED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-SM9", name: "Fix Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cid}", machine_desc: "Lincoln 210", issue_desc: "No arc" }
              as: ServiceTech
              captures: { tid: $.data.id }
            - call: "POST /repair-tickets/${tid}/advance"
              payload: { to: "DIAGNOSING" }
              as: ServiceTech
            - call: "POST /repair-tickets/${tid}/advance"
              payload: { to: "QUOTED", quote_cents: 8000 }
              as: ServiceTech
            - call: "POST /repair-tickets/${tid}/advance"
              payload: { to: "REJECTED" }
              as: BranchManager
            - call: "POST /repair-tickets/${tid}/advance"
              payload: { to: "CLOSED" }
              as: ServiceTech
              captures: { charged: $.data.charged_cents, st: $.data.status }
          trigger:
            - call: "POST /repair-tickets/${tid}/advance"
              payload: { to: "DIAGNOSING" }
              as: ServiceTech
              captures: { err: $.data.error_id }
          assert:
            - "st == CLOSED and charged == 0  (rejected work bills nothing)"
            - "err == ERR_INVALID_STATE  (CLOSED is terminal)"

      - name: route_close_blocked_with_open_orders
        claim_type: precondition_enforcement
        grounds: [state_machines.DeliveryRoute.DISPATCHED_to_CLOSED, "errors[ERR_ROUTE_HAS_OPEN_ORDERS]"]
        distinguishing_aspect: "Close rejects while a bound order is still STAGED (not FULFILLED/CANCELLED)."
        test_recipe:
          setup: ["CASH customer; product stock 1; route cap 3; ROUTE order confirmed+paid+staged; route dispatched"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_no: "ACC-SM10", name: "Open Co", terms: "CASH" }
              as: CounterRep
              captures: { cid: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-SM10", name: "Wire 10lb", category: "HARDGOOD", retail_price_cents: 6000 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 1 }
              as: BranchManager
            - call: "POST /delivery-routes"
              payload: { route_date: "2026-08-04", truck_capacity_units: 3 }
              as: CounterRep
              captures: { rid: $.data.id }
            - call: "POST /orders"
