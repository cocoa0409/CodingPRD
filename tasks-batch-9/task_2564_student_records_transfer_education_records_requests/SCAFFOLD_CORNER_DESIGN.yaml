  - section: cross_cutting_layers
    instances:
      - name: stale_cumulative_file_version_rejects_mark_ready_with_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.cumulative_file_mark_ready
          - validations.priority_40_cumulative_file_version_current
          - endpoints.POST_records_requests_mark_ready
          - errors.ERR_STALE_CUMULATIVE_FILE_VERSION
        distinguishing_aspect: "A token captured before a component write is stale after it: mark-ready with the pre-write version returns ERR_STALE_CUMULATIVE_FILE_VERSION / 412 and leaves packet_status NONE, while the same call re-read against the current version succeeds — and because the successful mark-ready itself bumps the file version, replaying the very token that just worked returns 412 as well."
        test_recipe:
          setup:
            - "CA rule and TX rule; SEND01 (CA) responds, RECV01 (TX) requests; one has_iep false student with guardian-fritz."
            - "ACADEMIC 10 / HEALTH 20 / DISCIPLINE 30 are collected and certified so the file is COMPLETE; the request is validated and therefore already ASSEMBLING."
            - "The stale token is captured BEFORE an extra optional-component write (SPECIAL_EDUCATION collected at 15 pages) bumps the file version."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
