              as: FacilityOperator
              captures: { outlet_compost: $.data.id }
            - call: "POST /alternative-outlets"
              payload: { name: "County Landfill Cell 4", outlet_type: "LANDFILL", gate_fee_per_wet_ton: 20.00, haul_rate_per_mile_per_wet_ton: 0.3000, min_load_wet_tons: 25.00, max_annual_wet_tons: 8000, min_percent_solids: 15.0 }
              as: FacilityOperator
              captures: { outlet_landfill: $.data.id }
            - call: "POST /alternative-outlets"
              payload: { name: "Regional Thermal Dryer", outlet_type: "THERMAL", gate_fee_per_wet_ton: 45.00, haul_rate_per_mile_per_wet_ton: 0.3000, min_load_wet_tons: 25.00, max_annual_wet_tons: 3000, min_percent_solids: 18.0 }
