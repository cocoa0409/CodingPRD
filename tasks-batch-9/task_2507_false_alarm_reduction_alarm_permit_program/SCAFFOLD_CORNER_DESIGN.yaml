              payload: { decision: "FLAG_VARIANCE", variance_notes: "Two dispatches reported for a month with none on record." }
              as: FalseAlarmReviewOfficer
              as_user_id: "faro-11"
              captures: { repA_v4: $.data.version }
            - &k_repA_corr2
              call: "POST /false-alarm-program/compliance-reports/${repA_id}/correct"
              payload: { reported_dispatch_count: 1, reported_cancellation_count: 0, ecv_attempt_count: 2 }
              as: AlarmCompanyOperator
              as_user_id: "${company_id}"
              captures: { repA_v5: $.data.version, repA_corr2: $.data.correction_count }
            - &k_repA_flag3
              call: "POST /false-alarm-program/compliance-reports/${repA_id}/review"
              payload: { decision: "FLAG_VARIANCE", variance_notes: "One dispatch reported for a month with none on record." }
              as: FalseAlarmReviewOfficer
              as_user_id: "faro-11"
              captures: { repA_v6: $.data.version }
          trigger:
            - call: "POST /false-alarm-program/compliance-reports/${repA_id}/correct"
              payload: { reported_dispatch_count: 4, reported_cancellation_count: 1, ecv_attempt_count: 4 }
              as: AlarmCompanyOperator
              as_user_id: "${company_id}"
              captures: { err_corr_limit: $.data.error_id }
          assert:
            - "the first two corrections returned 200 with correction_count 1 then 2, each cycling VARIANCE_FLAGGED -> CORRECTED -> SUBMITTED before the re-flag"
            - "the trigger returns 409 with error_id == ERR_CORRECTION_LIMIT_REACHED"
            - "ComplianceReport.${repA_id}.correction_count is still 2 and its stored counts are still 1 / 0 / 2 — the refused correction overwrote nothing"
            - "the counts in the trigger differ from the stored ones, so priority 47 was satisfied and only the limit row rejected the call"

      - name: collections_referral_of_an_appealed_incident_invoice_is_rejected
        claim_type: Priority Ordering
        grounds:
