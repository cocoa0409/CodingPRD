            - call: "GET /petitions/${pet_r6}"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_r6}"
              captures: { r6_total_before: $.data.qualified_signature_assessed_value_cents }
            - call: "POST /parcel-owner-consents/${cons_r6a}/withdraw"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_r6}"
              captures: { r6_withdrawn_status: $.data.consent_status }
            - call: "GET /petitions/${pet_r6}"
              payload: {}
              as: CityClerk
