            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-30T23:59:59Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Last Second" }, as: Nominator, as_user_id: "${np}", captures: { n1: $.data.id } }
