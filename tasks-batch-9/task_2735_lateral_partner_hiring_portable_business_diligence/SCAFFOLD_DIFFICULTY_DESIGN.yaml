  - rule_id: compensating_invariant
    instances:

      - name: declination_rescission_restores_book_identity
        grounds:
          - calculations.portable_book_valuation
          - calculations.declination_revenue_split
          - state_machines.ClientBookEntry.DECLINED_to_VALIDATED
          - state_machines.MatterDeclination.ACTIVE_to_RESCINDED
          - state_machines.Candidate.BLOCKED_to_CLEARED
          - entities.ClientBookEntry.fields.baseline_portable_amount_usd
        distinguishing_aspect: |
          Conserved quantity = the BOOK IDENTITY validated_portable_total_usd +
          declined_portable_total_usd == gross_baseline_total_usd, which must hold at every
          one of the four observation points: before the refusal (1601112.15 + 0.00), after
          it (1269000.00 + 332112.15), after the FIRST of the two declinations is rescinded
          (unchanged, because the entry is still DECLINED while any declination is ACTIVE)
          and after the second (1601112.15 + 0.00 again). The compensating action restores
          validated_portable_amount_usd from the untouched baseline rather than by
          re-deriving it, so the split remainder cent that made 166056.08 / 166056.07 can
          never leak into the total; the offer, however, stays REPRICE_REQUIRED — the
          invariant is restored but the negotiation is not.
        test_recipe:
          setup:
            - "The AB BOOK: entry A 'Northwind Holdings' (baseline 1269000.00) and entry B 'Calder Manufacturing' (baseline 332112.15), both VALIDATED under a CURRENT VALIDATED PortabilityAssessment whose gross_baseline_total_usd is 1601112.15 and adjusted_portable_total_usd is 1360945.33."
            - "One CompensationOffer (guaranteed 850000.00) in COMMITTEE_REVIEW with two ACTIVE APPROVE votes."
