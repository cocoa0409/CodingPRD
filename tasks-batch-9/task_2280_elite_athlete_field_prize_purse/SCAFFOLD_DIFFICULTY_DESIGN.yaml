  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency (3 instances, different entity pairs)
  # ===========================================================================

  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_offer_blocked_until_performance_record_verified
        grounds:
          - state_machines.PerformanceRecord.SUBMITTED_to_VERIFIED
          - calculations.qualifying_eligibility
          - errors.ERR_QUALIFYING_STANDARD_NOT_MET
          - validations[priority=15]
        distinguishing_aspect: >-
          Entity pair Invitation x PerformanceRecord: sending an offer depends on the state of a
          DIFFERENT entity — the qualifying record must already be VERIFIED, because eligibility is
          computed from verified_seconds, which is null while the record is merely SUBMITTED. Falsifiable
          in one sentence: an implementation that compares the self-reported performance_seconds lets
          the offer through while the record is still SUBMITTED, and one that only checks existence lets
          a REJECTED record through too.
        test_recipe:
          setup: >-
            Edition FIELD_OPEN with an ELITE MALE standard of 8100. Two athletes each hold one SUBMITTED
            performance record of 7900 (fast enough on paper), and invitations exist for both. Nothing is
            verified yet.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
