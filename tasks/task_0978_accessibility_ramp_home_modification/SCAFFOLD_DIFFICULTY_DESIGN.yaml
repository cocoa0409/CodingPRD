              as: ProjectManager
              captures: { quote_id: $.data.id }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "EQUIPMENT_RENTAL", description: "Ramp rental month", quantity: 1, unit: "day", unit_price_cents: 5000, tax_rate_pct: 0.0, sort_order: 1 }
              as: ProjectManager
