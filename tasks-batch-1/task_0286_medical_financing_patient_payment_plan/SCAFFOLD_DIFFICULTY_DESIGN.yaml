  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: refund_depth3_purchase_settlement_provider_account_delinquency
        grounds:
          - state_machines.FinancedPurchase.settlement_status_SETTLED_to_REFUNDED
          - state_machines.Settlement.PAID_to_CLAWED_BACK
          - state_machines.PatientAccount.DELINQUENT_to_ACTIVE
          - entities.Provider.fields.settled_net_cents
        distinguishing_aspect: |
          A REFUND on a SETTLED purchase cascades depth-3+: Refund→purchase REFUNDED →its PAID
          Settlement CLAWED_BACK (provider.settled_net_cents drops by net) →account current_balance
          drops and available_credit restored →the open DELINQUENT statement now satisfied →account
          cured DELINQUENT→ACTIVE. Each hop is caused by the prior hop, originating at the refund trigger.
        test_recipe:
          setup:
            - "Account DELINQUENT (1 strike) with a SETTLED+PAID purchase principal 200,000 fully unpaid; provider settled_net_cents == net of that settlement."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Casc Clinic", specialty: "GENERAL", tax_id: "TX-G-7", base_merchant_discount_rate: 0.10 }
              as: PlatformAdmin
              captures: { provx_id: $.data.id }
