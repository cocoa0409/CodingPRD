            - call: "POST /motor-club/dispatches/${d1}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/arrive"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T15:59:00Z" }
              as: ClubAdmin
            - call: "POST /motor-club/dispatches/${d1}/complete"
              payload: { actual_tow_miles: 5 }
              as: ProviderOps
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: ClubAdmin
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 5 }
              as: Dispatcher
