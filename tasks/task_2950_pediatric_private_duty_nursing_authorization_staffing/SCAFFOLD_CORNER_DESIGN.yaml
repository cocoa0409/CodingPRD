          - entities.Case.next_supervisory_visit_due_at
          - entities.Case.supervisory_status
          - entities.SupervisoryVisit.cadence_days_applied
        distinguishing_aspect: >-
          The vent constant is 14 days, a DEFICIENT visit applies ceil(14 / 2) = 7 days from that
