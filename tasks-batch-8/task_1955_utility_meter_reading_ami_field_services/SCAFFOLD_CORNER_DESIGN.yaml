            - "Route.${route_id}.route_status == ASSIGNED"

  - section: complexity_layers
    instances:
      - name: occ_route_reassign_stale_version
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[route-reassign-stale-version]']
        distinguishing_aspect: "Route OCC: reassign with the just-observed version succeeds (version bumps 2 -> 3); replaying the same expected version then fails deterministically with 412 ERR_STALE_VERSION — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["technicians A and B; route ASSIGNED to A (version 2 after assign)"]
          setup_api_calls:
            - { call: "POST /field-technicians", payload: { display_name: "OCC A" }, as: MeterOpsAdmin, captures: { tech_a: $.data.id } }
            - { call: "POST /field-technicians", payload: { display_name: "OCC B" }, as: MeterOpsAdmin, captures: { tech_b: $.data.id } }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "CE1", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-03", read_window_close_date: "2026-08-07", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-03", route_shift: "AM" }, as: Dispatcher, captures: { route_id: $.data.id } }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_a}" }, as: Dispatcher }
            - { call: "GET /routes/${route_id}", payload: {}, as: Dispatcher, captures: { rv: $.data.version } }
          trigger:
            - { call: "POST /routes/${route_id}/reassign", payload: { technician_id: "${tech_b}", expected_route_version: "${rv}" }, as: Dispatcher, captures: { rv_after: $.data.version } }
            - { call: "POST /routes/${route_id}/reassign", payload: { technician_id: "${tech_a}", expected_route_version: "${rv}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "fresh version: success, Route.${route_id}.technician_id == ${tech_b}, version advanced (${rv_after} == ${rv} + 1)"
            - "stale replay of ${rv}: error_id == ERR_STALE_VERSION (412); technician_id stays ${tech_b}"

      - name: occ_stop_read_capture_stale_version
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[stop-read-supersede-stale-version]']
        distinguishing_aspect: "RouteStop OCC: a first capture bumps the stop version; a second capture replaying the pre-capture version is rejected with 412 even though re-capture from READ_CAPTURED is a legitimate supersede — the version, not the state, is the guard."
        test_recipe:
          setup: ["route IN_PROGRESS; stop PENDING at version 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "OCC Stop Tech" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "C-0130", service_address: "130 Occ Rd", billing_cycle_code: "CE2" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-OS-1", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { m1: $.data.id } }
            - { call: "POST /meters/${m1}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "CE2", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-03", read_window_close_date: "2026-08-07", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods/${period_id}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-03", route_shift: "AM" }, as: Dispatcher, captures: { route_id: $.data.id } }
            - { call: "GET /routes/${route_id}/stops", payload: {}, as: Dispatcher, captures: { stop_id: "$.data[0].id", sv: "$.data[0].version" } }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_id}/start", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /route-stops/${stop_id}/reads", payload: { meter_id: "${m1}", read_value: 100, read_at: "2026-08-03T09:00:00Z", expected_route_stop_version: "${sv}" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { r1: $.data.id } }
            - { call: "POST /route-stops/${stop_id}/reads", payload: { meter_id: "${m1}", read_value: 150, read_at: "2026-08-03T09:05:00Z", expected_route_stop_version: "${sv}" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { err: $.data.error_id } }
            - { call: "GET /route-stops/${stop_id}", payload: {}, as: Dispatcher, captures: { sv2: $.data.version } }
            - { call: "POST /route-stops/${stop_id}/reads", payload: { meter_id: "${m1}", read_value: 150, read_at: "2026-08-03T09:05:00Z", expected_route_stop_version: "${sv2}" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { r2: $.data.id } }
          assert:
            - "first capture ok: MeterRead.${r1} PROVISIONAL"
            - "stale replay of ${sv}: error_id == ERR_STALE_VERSION (412)"
            - "fresh ${sv2} re-capture: MeterRead.${r2} PROVISIONAL and supersedes_read_id == ${r1}; MeterRead.${r1}.read_status == SUPERSEDED"

      - name: occ_work_order_reschedule_stale_version
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[work-order-reschedule-stale-version]']
        distinguishing_aspect: "WorkOrder OCC on a self-loop: reschedule succeeds without changing work_order_status and bumps version; a replay with the old version fails 412."
        test_recipe:
          setup: ["EXCHANGE order OPEN at version 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /service-accounts", payload: { account_number: "C-0131", service_address: "131 Occ Rd", billing_cycle_code: "CE3" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-OW-1", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { m1: $.data.id } }
            - { call: "POST /meters/${m1}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
            - { call: "POST /work-orders", payload: { work_order_type: "EXCHANGE", service_account_id: "${acct_id}", meter_id: "${m1}", scheduled_date: "2026-08-10", work_shift: "AM" }, as: Dispatcher, captures: { wo_id: $.data.id, wv: $.data.version } }
          trigger:
            - { call: "POST /work-orders/${wo_id}/reschedule", payload: { scheduled_date: "2026-08-12", work_shift: "PM", expected_work_order_version: "${wv}" }, as: Dispatcher, captures: { wv2: $.data.version } }
            - { call: "POST /work-orders/${wo_id}/reschedule", payload: { scheduled_date: "2026-08-13", work_shift: "AM", expected_work_order_version: "${wv}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "first reschedule: scheduled_date == 2026-08-12, work_shift == PM, status stays OPEN, version ${wv2} == ${wv} + 1"
            - "stale replay: error_id == ERR_STALE_VERSION (412); scheduled_date stays 2026-08-12"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.ServiceAccount, complexity_profile]
        distinguishing_aspect: "common_fields contract: each mutation increments version by exactly 1 — account create v1, suspend v2, reactivate v3; updated_at refreshes each time."
        test_recipe:
          setup: ["one account"]
          setup_api_calls:
            - { call: "POST /service-accounts", payload: { account_number: "C-0132", service_address: "132 Ver Rd", billing_cycle_code: "CE4" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /service-accounts/${acct_id}/suspend", payload: {}, as: MeterOpsAdmin, captures: { v2: $.data.version } }
            - { call: "POST /service-accounts/${acct_id}/reactivate", payload: {}, as: MeterOpsAdmin, captures: { v3: $.data.version } }
          assert:
            - "version sequence: ${v1} == 1, ${v2} == 2, ${v3} == 3"

      - name: ops_sweep_order_hazard_expiry_before_escalation
        claim_type: ops_run_checkpoint
        grounds: [calculations.no_read_escalation_score, calculations.hazard_ttl_expiry, 'endpoints["POST /ops-snapshots"]']
        distinguishing_aspect: "Pinned sweep order is observable: a hazard expiring strictly before the snapshot is expired at step 1, so the step-3 escalation score (35 without the bonus) stays below 40 and NO re-read order is created; running escalation first would wrongly add the +15 bonus (50) and create one."
        test_recipe:
          setup: ["handheld account; hazard reported 2026-07-01T09:00 (expires 2026-07-31T09:00); period window [2026-08-01..2026-08-04]; stop NO_READ_PENDING; snapshot at 2026-08-02 (2 days before close)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T09:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "Sweep Tech" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "C-0133", service_address: "133 Sweep Rd", billing_cycle_code: "CE5" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-SW-3", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { m1: $.data.id } }
            - { call: "POST /meters/${m1}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
            - { call: "POST /hazard-flags", payload: { service_account_id: "${acct_id}", hazard_type: "DOG", severity: "HIGH" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { flag_id: $.data.id } }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "CE5", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-01", read_window_close_date: "2026-08-04", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods/${period_id}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-01", route_shift: "AM", two_person_crew: true }, as: Dispatcher, captures: { route_id: $.data.id } }
            - { call: "GET /routes/${route_id}/stops", payload: {}, as: Dispatcher, captures: { stop_id: "$.data[0].id" } }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_id}/start", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /route-stops/${stop_id}/mark-no-read", payload: { no_read_reason: "NO_ACCESS" }, as: FieldTechnician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-08-02T00:00:00Z" }, as: MeterOpsAdmin, captures: { snap_id: $.data.id } }
            - { call: "GET /work-orders", payload: { route_stop_id: "${stop_id}" }, as: Dispatcher, captures: { } }
          assert:
            - "HazardFlag.${flag_id}.flag_status == EXPIRED (step 1 ran: 2026-07-31T09:00 < 2026-08-02T00:00)"
            - "no RE_READ order created (GET /work-orders?route_stop_id -> total_count == 0): score 10 + 0 + 5*(7-2) == 35 < 40 because the +15 hazard bonus did not apply"
            - "OpsSnapshot.${snap_id}.backlog_count == 1"

      - name: cascade_chain_exchange_full_depth
        claim_type: cascading_side_effects
        grounds: [state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED]
        excluded_because:
          difficulty_instance: exchange_completion_cascades_through_enrollment_to_campaign_completion
          rationale: "The 3-level exchange -> enrollment -> campaign chain is asserted link-by-link there."

  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: the capture response's read id is visible in the very next GET of the stop (current_read_id) with no delay or reconciliation endpoint."
