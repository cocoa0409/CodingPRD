  - name: time_entry_costing_uses_two_different_rates_on_one_line
    claim_type: correct_result
    grounds:
    - calculations.time_entry_costing
    - entities.TimeEntry.fields.cost_cents
    - entities.TimeEntry.fields.billed_value_cents
    distinguishing_aspect: 'One timesheet line is priced twice from two different rate sources: cost_cents uses the Consultant row cost_rate_cents_per_hour (62000) while billed_value_cents uses the GRADE table for PARTNER (92500) discounted by the Engagement pinned_scope_discount_pct (0.05), so 60.00 hours yields 3720000 and 5272500 on the same row.'
