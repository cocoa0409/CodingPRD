# =============================================================================
# PRD Benchmark Seed Tables — Farmworker Housing & Compliance Management
# =============================================================================

scenario: |
  Farmworker Housing & Compliance Management (migrant farmworker housing operator): housing unit inventory & occupancy limits, pre-occupancy inspection & certification, maintenance/work-order & habitability standard, resident intake & family eligibility, utility & rent deduction rules, seasonal open/close & pest treatment, complaint & regulatory inspection response, migrant education/health referral linkage

domain_name: farmworker-housing-compliance
api_prefix: "/"   # flat topology: all collections are top-level paths

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # inspections, habitability enforcement, deduction caps, segregation of duties, audit trail
  secondary_archetype: quota_allocation      # finite bed capacity per unit reserved/committed/released by tenancies
  complexity_layers:
    - optimistic_concurrency                 # OCC on HousingSite.version and Household.version for create-with-supersede writes
    - cascading_side_effects                 # inspection findings -> unit condemnation -> forced tenancy notice -> household rehousing flag
    - dual_variant_calculation               # proration variants (calendar_day vs weekly_slot); habitability scoring variants (cumulative vs worst_case)
    - rate_threshold_triggers                # occupancy caps, habitability hold threshold, posture breakpoints, SLA breach, subsidy tiers
  entity_topology: flat                      # peer entities with foreign keys in bodies; filtered lists for reverse reachability
  state_machine_shape: branching             # dominant shape; cyclic (site seasons, cert retry, work-order reopen, inspection re-inspect), parallel dims (site status x compliance_posture), and posture_driven gating all present
  relationship_patterns:
    - one_to_many
    - self_referential                       # DeductionAuthorization.superseded_by_id
    - cross_aggregate                        # WorkOrder.complaint_id, ChargeLedgerEntry.source_work_order_id, Tenancy spans Household x HousingUnit
  role_model: segregation_of_duties          # findings issuer cannot certify cure; work-order completer cannot verify
  consistency_model: immediate               # all mutations + cascades atomic in the request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: HousingSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code", constraints: "uppercase [A-Z]{2}" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Season lifecycle", constraints: "DRAFT | OPENING | OPEN | CLOSING | CLOSED" }
      - { name: compliance_posture, type: enum, source: computed, default: NORMAL, description: "Derived aggregate posture gating child operations; recomputed per site_compliance_posture calculation", constraints: "NORMAL | WATCH | RESTRICTED" }

  - name: SeasonWindow
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HousingSite.id; owning site" }
      - { name: label, type: string, source: input, description: "Season label, e.g. '2026 Harvest'" }
      - { name: planned_open_date, type: string, source: input, description: "Planned season opening", constraints: "ISO 8601 date YYYY-MM-DD" }
      - { name: planned_close_date, type: string, source: input, description: "Planned season close (closed interval end)", constraints: "ISO 8601 date YYYY-MM-DD, >= planned_open_date" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "Window lifecycle", constraints: "PLANNED | ACTIVE | COMPLETED | SUPERSEDED | CANCELLED" }

  - name: Building
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HousingSite.id; owning site" }
      - { name: name, type: string, source: input, description: "Building name/code" }

  - name: HousingUnit
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id; containing building" }
      - { name: site_id, type: string, source: input, description: "FK -> HousingSite.id; denormalized owning site (must equal building.site_id)" }
      - { name: unit_code, type: string, source: input, description: "Operator unit code" }
      - { name: unit_type, type: enum, source: input, description: "Selects proration variant and allowance profile", constraints: "FAMILY_UNIT | SEASONAL_DORM" }
      - { name: max_occupancy, type: integer, source: input, description: "Maximum permitted residents (bed capacity)", constraints: ">= 1" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Full-calendar-month rent in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "Unit lifecycle", constraints: "REGISTERED | CERTIFIED | OCCUPIED | HABITABILITY_HOLD | CONDEMNED | DECOMMISSIONED" }
      - { name: current_occupancy, type: integer, source: computed, default: 0, description: "Sum of member_count over ACTIVE/NOTICE tenancies on this unit" }
      - { name: habitability_score_cumulative, type: number, source: computed, default: 0, description: "Enforcement score: sum of severity weights over non-terminal work orders (see habitability_risk_score)" }
      - { name: habitability_score_worst_case, type: number, source: computed, default: 0, description: "Preview score: max weight + 0.25 * sum of remaining weights" }
      - { name: under_pest_exclusion, type: boolean, source: computed, default: false, description: "True while an APPLIED pest treatment's closed exclusion window covers the current clock date" }
      - { name: pest_exclusion_end_date, type: string, source: computed, description: "ISO date of the latest exclusion end across APPLIED treatments; null when none", default: null }

  - name: UnitCertification
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> HousingUnit.id; certified unit" }
      - { name: inspector_id, type: string, source: system, description: "X-User-ID of the creating ComplianceInspector" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Certification lifecycle with FAILED->IN_PROGRESS re-inspection loop", constraints: "SCHEDULED | IN_PROGRESS | PASSED | FAILED | VOIDED | EXPIRED" }
      - { name: deficiency_count, type: integer, source: input, default: 0, description: "Deficiencies recorded at result time", constraints: ">= 0; supplied on PASSED/FAILED" }
      - { name: notes, type: string, source: input, description: "Free-text notes", default: null }
      - { name: inspection_date, type: string, source: system, description: "ISO date result was recorded (from logical clock); null until PASSED/FAILED", default: null }
      - { name: expiry_date, type: string, source: system, description: "inspection_date + CERT_VALID_DAYS (180), set only on PASSED; null otherwise", default: null }

  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: head_of_household_name, type: string, source: input, description: "Head of household full name" }
      - { name: annual_family_income_cents, type: integer, source: input, description: "Total annual family income in cents", constraints: ">= 0" }
      - { name: ag_work_verified, type: boolean, source: input, default: false, description: "Agricultural employment verification received" }
      - { name: eligibility_status, type: enum, source: system, default: PENDING_ELIGIBILITY, description: "Intake eligibility lifecycle", constraints: "PENDING_ELIGIBILITY | ELIGIBLE | INELIGIBLE" }
      - { name: eligibility_notes, type: string, source: input, description: "Verifier notes", default: null }
      - { name: member_count, type: integer, source: computed, default: 0, description: "Count of HouseholdMember rows for this household" }
      - { name: minor_count, type: integer, source: computed, default: 0, description: "Count of members with is_minor = true" }
      - { name: rehousing_priority, type: boolean, source: computed, default: false, description: "Set when a condemnation cascade force-notices this household's tenancy" }

  - name: HouseholdMember
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; owning household" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: date_of_birth, type: string, source: input, description: "Birth date", constraints: "ISO 8601 date YYYY-MM-DD" }
      - { name: relationship, type: enum, source: input, description: "Relationship to head", constraints: "HEAD | SPOUSE | CHILD | OTHER" }
      - { name: is_minor, type: boolean, source: computed, description: "True when age at current logical clock date is < 18 years" }

  - name: Tenancy
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; resident household" }
      - { name: unit_id, type: string, source: input, description: "FK -> HousingUnit.id; assigned unit" }
      - { name: move_in_date, type: string, source: input, description: "Planned/actual move-in", constraints: "ISO 8601 date YYYY-MM-DD" }
      - { name: move_out_date, type: string, source: system, description: "Set at termination", default: null }
      - { name: status, type: enum, source: system, default: PENDING_MOVE_IN, description: "Tenancy lifecycle", constraints: "PENDING_MOVE_IN | ACTIVE | NOTICE | TERMINATED | CANCELLED" }
      - { name: notice_reason, type: enum, source: system, description: "Why notice was given", constraints: "RESIDENT | OPERATOR | CONDEMNATION", default: null }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Sum of POSTED debits minus POSTED credits across all buckets (see ledger_bucket_allocation)" }
      - { name: rent_bucket_balance_cents, type: integer, source: computed, default: 0, description: "RENT debits minus RENT-purpose payments and SUBSIDY_CREDITs" }
      - { name: utility_bucket_balance_cents, type: integer, source: computed, default: 0, description: "UTILITY_OVERAGE debits minus utility overflow of RENT_AND_UTILITIES payments" }
      - { name: damage_bucket_balance_cents, type: integer, source: computed, default: 0, description: "DAMAGE debits (never payroll-deductible)" }
      - { name: is_delinquent, type: boolean, source: computed, default: false, description: "balance_cents > 0 and oldest unpaid debit older than GRACE_DAYS (10); see delinquency_chronological_walk" }
      - { name: oldest_unpaid_charge_date, type: string, source: computed, description: "ISO date of oldest debit with residual > 0; null when balance is 0", default: null }
      - { name: subsidy_tier_percent, type: number, source: computed, default: 0, description: "0, 0.15, or 0.30 per subsidy_credit_tier; locked at activation" }

  - name: ChargeLedgerEntry
    parent: null
    common_fields: true
    fields:
      - { name: tenancy_id, type: string, source: input, description: "FK -> Tenancy.id; owning tenancy" }
      - { name: entry_type, type: enum, source: input, description: "Ledger bucket selector", constraints: "RENT | UTILITY_OVERAGE | DAMAGE | SUBSIDY_CREDIT | PAYMENT" }
      - { name: amount_cents, type: integer, source: input, description: "Always positive; sign derived from entry_type (RENT/UTILITY_OVERAGE/DAMAGE debit, SUBSIDY_CREDIT/PAYMENT credit). FORBIDDEN when entry_type = UTILITY_OVERAGE (server-computed); REQUIRED otherwise", constraints: "> 0" }
      - { name: usage_lines, type: array, source: input, description: "REQUIRED when entry_type = UTILITY_OVERAGE, forbidden otherwise: [{utility_type: ELECTRIC|GAS|WATER, usage_units: integer >= 0}]", default: null }
      - { name: source_work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; REQUIRED when entry_type = DAMAGE (work order must be VERIFIED or CLOSED), forbidden otherwise", default: null }
      - { name: description, type: string, source: input, description: "Free-text memo", default: null }
      - { name: charge_date, type: string, source: system, description: "ISO date from logical clock at posting" }
      - { name: status, type: enum, source: system, default: POSTED, description: "Ledger entry lifecycle", constraints: "POSTED | VOIDED" }
      - { name: void_reason, type: string, source: system, description: "Recorded at void", default: null }

  - name: DeductionAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; authorizing household" }
      - { name: cap_percent, type: number, source: input, description: "Household-authorized maximum fraction of gross wages", constraints: "0 < cap_percent <= 1" }
      - { name: purpose, type: enum, source: input, description: "Which buckets this authorization covers", constraints: "RENT | RENT_AND_UTILITIES" }
      - { name: effective_date, type: string, source: input, description: "First date the authorization applies", constraints: "ISO 8601 date YYYY-MM-DD" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Authorization lifecycle", constraints: "ACTIVE | SUPERSEDED | REVOKED" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> DeductionAuthorization.id; the authorization that superseded this one (self-referential), null unless SUPERSEDED", default: null }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the creating IntakeCoordinator" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> HousingUnit.id; affected unit" }
      - { name: complaint_id, type: string, source: input, description: "FK -> Complaint.id; originating complaint, nullable", default: null }
      - { name: category, type: enum, source: input, description: "Maintenance category", constraints: "PLUMBING | ELECTRICAL | STRUCTURAL | PEST | APPLIANCE | OTHER" }
      - { name: severity, type: enum, source: input, description: "Severity driving habitability score weights", constraints: "CRITICAL | MAJOR | MINOR" }
      - { name: description, type: string, source: input, description: "Problem description" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "Work order lifecycle with VERIFIED->REOPENED->ASSIGNED loop", constraints: "REPORTED | TRIAGED | ASSIGNED | IN_PROGRESS | COMPLETED | VERIFIED | REOPENED | CLOSED | CANCELLED" }
      - { name: assignee_name, type: string, source: input, description: "Assigned technician (required on ASSIGNED)", default: null }
      - { name: completed_by, type: string, source: system, description: "X-User-ID recorded at COMPLETED", default: null }
      - { name: verified_by, type: string, source: system, description: "X-User-ID recorded at VERIFIED; must differ from completed_by", default: null }

  - name: PestTreatment
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> HousingUnit.id; treated unit" }
      - { name: treatment_type, type: enum, source: input, description: "Treatment class", constraints: "ROUTINE | TARGETED | FUMIGATION" }
      - { name: scheduled_date, type: string, source: input, description: "Planned treatment date", constraints: "ISO 8601 date YYYY-MM-DD" }
      - { name: reentry_buffer_days, type: integer, source: input, description: "Closed-interval re-entry buffer", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Treatment lifecycle", constraints: "SCHEDULED | APPLIED | CLEARED | CANCELLED" }
      - { name: applied_date, type: string, source: system, description: "ISO date from logical clock at APPLIED; null until applied", default: null }
      - { name: exclusion_end_date, type: string, source: system, description: "applied_date + reentry_buffer_days (closed interval end); null until applied", default: null }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: tenancy_id, type: string, source: input, description: "FK -> Tenancy.id; complaining tenancy" }
      - { name: category, type: enum, source: input, description: "Complaint category", constraints: "HABITABILITY | RENT | UTILITY | HARASSMENT | OTHER" }
      - { name: description, type: string, source: input, description: "Complaint narrative" }
      - { name: status, type: enum, source: system, default: FILED, description: "Complaint lifecycle with ESCALATED_TO_AGENCY->INVESTIGATING return branch", constraints: "FILED | ACKNOWLEDGED | INVESTIGATING | RESOLVED | ESCALATED_TO_AGENCY | CLOSED" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock timestamp at creation" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Logical clock timestamp at ACKNOWLEDGED; null until then", default: null }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "True when acknowledged_at > filed_at + 72h (strictly greater; exactly 72h is compliant)" }
      - { name: resolution_note, type: string, source: input, description: "Required on RESOLVED", default: null }

  - name: RegulatoryInspection
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HousingSite.id; inspected site" }
      - { name: agency, type: enum, source: input, description: "Inspecting agency", constraints: "STATE_HOUSING | USDA_RD | HUD | COUNTY_HEALTH" }
      - { name: scheduled_date, type: string, source: input, description: "Planned inspection date", constraints: "ISO 8601 date YYYY-MM-DD" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Inspection lifecycle with FINDINGS_ISSUED->CONDUCTED re-inspection loop", constraints: "SCHEDULED | CONDUCTED | FINDINGS_ISSUED | CURE_CERTIFIED | CLOSED | CANCELLED" }
      - { name: findings, type: array, source: input, description: "Required on FINDINGS_ISSUED: [{unit_id, severity: CRITICAL|MAJOR|MINOR, code: string}]", default: null }
      - { name: open_critical_count, type: integer, source: computed, default: 0, description: "CRITICAL findings whose cited unit lacks a PASSED certification with inspection_date later than the findings' issued date" }
      - { name: issued_by, type: string, source: system, description: "X-User-ID recorded at FINDINGS_ISSUED", default: null }
      - { name: cure_certified_by, type: string, source: system, description: "X-User-ID recorded at CURE_CERTIFIED; must differ from issued_by", default: null }

  - name: ServiceReferral
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; referred household" }
      - { name: referral_type, type: enum, source: input, description: "Migrant service channel", constraints: "EDUCATION | HEALTH" }
      - { name: agency_name, type: string, source: input, description: "Receiving agency" }
      - { name: notes, type: string, source: input, description: "Free-text notes", default: null }
      - { name: status, type: enum, source: system, default: INITIATED, description: "Referral lifecycle", constraints: "INITIATED | ACCEPTED_BY_AGENCY | COMPLETED | DECLINED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: HousingSite
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: OPENING
        trigger: "PUT /housing-sites/{id} (status=OPENING)"
        actor: OperatorAdmin
        preconditions:
          - "Exists SeasonWindow W with W.site_id = site.id, W.status = PLANNED, and W.planned_open_date <= clock_date <= W.planned_close_date (ERR_NO_COVERING_SEASON_WINDOW)"
        side_effects: []

      - from: OPENING
        to: DRAFT
        trigger: "PUT /housing-sites/{id} (status=DRAFT)"
        actor: OperatorAdmin
        preconditions: []
        side_effects: []
        note: "Revert branch: season opening aborted"

      - from: OPENING
        to: OPEN
        trigger: "PUT /housing-sites/{id} (status=OPEN)"
        actor: OperatorAdmin
        preconditions:
          - "At least one HousingUnit with site_id = site.id has status CERTIFIED (ERR_NO_CERTIFIED_UNIT)"
        side_effects:
          - "The covering SeasonWindow (PLANNED, covering clock_date) -> ACTIVE"
          - "site.version increments by 1"

      - from: OPEN
        to: CLOSING
        trigger: "PUT /housing-sites/{id} (status=CLOSING)"
        actor: OperatorAdmin
        preconditions: []
        side_effects:
          - "Tenancy activations are rejected while site is CLOSING (gate via ERR_SITE_NOT_OPEN)"

      - from: CLOSING
        to: CLOSED
        trigger: "PUT /housing-sites/{id} (status=CLOSED)"
        actor: OperatorAdmin
        preconditions:
          - "Zero tenancies with status ACTIVE or NOTICE on units of this site (ERR_ACTIVE_TENANCIES_REMAIN)"
          - "Zero work orders in {REPORTED, TRIAGED, ASSIGNED, IN_PROGRESS, COMPLETED, REOPENED} on units of this site (ERR_OPEN_WORK_ORDERS_REMAIN)"
          - "Every unit of this site with status in {CERTIFIED, OCCUPIED, HABITABILITY_HOLD} has at least one PestTreatment with status in {APPLIED, CLEARED} and applied_date within the ACTIVE window's [planned_open_date, planned_close_date] (ERR_SEASON_PEST_TREATMENT_MISSING)"
        side_effects:
          - "SeasonWindow ACTIVE -> COMPLETED"
          - "Certification expiry sweep: every UnitCertification in PASSED with expiry_date < clock_date -> EXPIRED; each affected unit in CERTIFIED with no other valid PASSED cert -> REGISTERED"
          - "site.version increments by 1"

      - from: CLOSED
        to: OPENING
        trigger: "PUT /housing-sites/{id} (status=OPENING)"
        actor: OperatorAdmin
        preconditions:
          - "Exists SeasonWindow W with W.site_id = site.id, W.status = PLANNED, and W.planned_open_date <= clock_date <= W.planned_close_date (ERR_NO_COVERING_SEASON_WINDOW)"
        side_effects: []
        note: "Cyclic seasonal reopen"

  - entity: SeasonWindow
    initial_state: PLANNED
    terminal_states: [COMPLETED, SUPERSEDED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "system (when the owning HousingSite transitions OPENING -> OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (when the owning HousingSite transitions CLOSING -> CLOSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: SUPERSEDED
        trigger: "system (when POST /season-windows creates a replacement PLANNED window for the same site)"
        actor: system
        preconditions: []
        side_effects:
          - "The superseding window's id is not stored on the window; supersession is observable via status"
      - from: PLANNED
        to: CANCELLED
        trigger: "DELETE /season-windows/{id}"
        actor: OperatorAdmin
        preconditions: []
        side_effects: []

  - entity: HousingUnit
    initial_state: REGISTERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: REGISTERED
        to: CERTIFIED
        trigger: "system (when a UnitCertification for this unit records PASSED)"
        actor: system
        preconditions: []
        side_effects:
          - "site.compliance_posture recompute (site_compliance_posture)"

      - from: CERTIFIED
        to: OCCUPIED
        trigger: "system (when the first tenancy on this unit becomes ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OCCUPIED
        to: CERTIFIED
        trigger: "system (when the last ACTIVE/NOTICE tenancy on this unit terminates)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CERTIFIED
        to: HABITABILITY_HOLD
        trigger: "system (habitability_risk_score cumulative variant >= HOLD_THRESHOLD (40), or a CRITICAL work order is created against this unit)"
        actor: system
        preconditions: []
        side_effects:
          - "site.compliance_posture recompute"

      - from: OCCUPIED
        to: HABITABILITY_HOLD
        trigger: "system (habitability_risk_score cumulative variant >= HOLD_THRESHOLD (40), or a CRITICAL work order is created against this unit)"
        actor: system
        preconditions: []
        side_effects:
          - "site.compliance_posture recompute"

      - from: REGISTERED
        to: HABITABILITY_HOLD
        trigger: "system (habitability_risk_score cumulative variant >= HOLD_THRESHOLD (40), or a CRITICAL work order is created against this unit)"
        actor: system
        preconditions: []
        side_effects:
          - "site.compliance_posture recompute"

      - from: HABITABILITY_HOLD
        to: REGISTERED
        trigger: "system (on work order VERIFIED/CLOSED/CANCELLED recompute: cumulative score < 40 and zero non-terminal CRITICAL work orders)"
        actor: system
        preconditions:
          - "Unit holds NO valid PASSED certification (when one exists, the unit -> CERTIFIED/OCCUPIED transition fires instead)"
        side_effects:
          - "site.compliance_posture recompute"

      - from: HABITABILITY_HOLD
        to: CERTIFIED
        trigger: "system (on work order VERIFIED/CLOSED/CANCELLED recompute: cumulative score < 40 and zero non-terminal CRITICAL work orders)"
        actor: system
        preconditions:
          - "Unit holds a valid PASSED certification (expiry_date >= clock_date); if not, unit -> REGISTERED instead"
        side_effects:
          - "Return target is OCCUPIED instead when current_occupancy > 0"
          - "site.compliance_posture recompute"

      - from: CERTIFIED
        to: CONDEMNED
        trigger: "system (a RegulatoryInspection issues findings containing a CRITICAL finding citing this unit)"
        actor: system
        preconditions: []
        side_effects:
          - "Every tenancy on this unit with status ACTIVE or NOTICE -> NOTICE with notice_reason = CONDEMNATION (forced notice)"
          - "Each such tenancy's household gets rehousing_priority = true"
          - "site.compliance_posture recompute"

      - from: OCCUPIED
        to: CONDEMNED
        trigger: "system (a RegulatoryInspection issues findings containing a CRITICAL finding citing this unit)"
        actor: system
        preconditions: []
        side_effects:
          - "Every tenancy on this unit with status ACTIVE or NOTICE -> NOTICE with notice_reason = CONDEMNATION (forced notice)"
          - "Each such tenancy's household gets rehousing_priority = true"
          - "site.compliance_posture recompute"

      - from: HABITABILITY_HOLD
        to: CONDEMNED
        trigger: "system (a RegulatoryInspection issues findings containing a CRITICAL finding citing this unit)"
        actor: system
        preconditions: []
        side_effects:
          - "Every tenancy on this unit with status ACTIVE or NOTICE -> NOTICE with notice_reason = CONDEMNATION (forced notice)"
          - "Each such tenancy's household gets rehousing_priority = true"
          - "site.compliance_posture recompute"

      - from: CONDEMNED
        to: REGISTERED
        trigger: "system (when the citing RegulatoryInspection reaches CURE_CERTIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Unit must pass a fresh UnitCertification to return to CERTIFIED (cyclic re-certification)"
          - "site.compliance_posture recompute"

      - from: CERTIFIED
        to: REGISTERED
        trigger: "system (its last valid PASSED certification is VOIDED or EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "site.compliance_posture recompute"

      - from: OCCUPIED
        to: HABITABILITY_HOLD
        trigger: "system (its last valid PASSED certification is VOIDED while occupied)"
        actor: system
        preconditions: []
        side_effects:
          - "Existing tenancies continue; new activations rejected"
          - "site.compliance_posture recompute"

      - from: REGISTERED
        to: DECOMMISSIONED
        trigger: "PUT /housing-units/{id} (status=DECOMMISSIONED)"
        actor: OperatorAdmin
        preconditions:
          - "No tenancies with status in {PENDING_MOVE_IN, ACTIVE, NOTICE} reference this unit (ERR_ACTIVE_TENANCIES_REMAIN)"
        side_effects:
          - "site.compliance_posture recompute"

      - from: CERTIFIED
        to: DECOMMISSIONED
        trigger: "PUT /housing-units/{id} (status=DECOMMISSIONED)"
        actor: OperatorAdmin
        preconditions:
          - "No tenancies with status in {PENDING_MOVE_IN, ACTIVE, NOTICE} reference this unit (ERR_ACTIVE_TENANCIES_REMAIN)"
        side_effects:
          - "site.compliance_posture recompute"

      - from: HABITABILITY_HOLD
        to: DECOMMISSIONED
        trigger: "PUT /housing-units/{id} (status=DECOMMISSIONED)"
        actor: OperatorAdmin
        preconditions:
          - "No tenancies with status in {PENDING_MOVE_IN, ACTIVE, NOTICE} reference this unit (ERR_ACTIVE_TENANCIES_REMAIN)"
        side_effects:
          - "site.compliance_posture recompute"

  - entity: UnitCertification
    initial_state: SCHEDULED
    terminal_states: [VOIDED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "PUT /unit-certifications/{id} (status=IN_PROGRESS)"
        actor: ComplianceInspector
        preconditions:
          - "Unit status != DECOMMISSIONED (ERR_INVALID_STATE)"
        side_effects: []

      - from: IN_PROGRESS
        to: PASSED
        trigger: "PUT /unit-certifications/{id} (status=PASSED, deficiency_count)"
        actor: ComplianceInspector
        preconditions: []
        side_effects:
          - "inspection_date = clock_date; expiry_date = clock_date + 180 days"
          - "Unit REGISTERED -> CERTIFIED (when unit currently REGISTERED)"
          - "site.compliance_posture recompute"

      - from: IN_PROGRESS
        to: FAILED
        trigger: "PUT /unit-certifications/{id} (status=FAILED, deficiency_count)"
        actor: ComplianceInspector
        preconditions: []
        side_effects:
          - "inspection_date = clock_date; expiry_date = null"
          - "site.compliance_posture recompute"

      - from: FAILED
        to: IN_PROGRESS
        trigger: "PUT /unit-certifications/{id} (status=IN_PROGRESS)"
        actor: ComplianceInspector
        preconditions:
          - "Zero non-terminal CRITICAL work orders on the unit (ERR_OPEN_WORK_ORDERS_REMAIN)"
        side_effects: []
        note: "Cyclic re-inspection after remediation"

      - from: PASSED
        to: VOIDED
        trigger: "PUT /unit-certifications/{id} (status=VOIDED, notes)"
        actor: ComplianceInspector
        preconditions: []
        side_effects:
          - "If no other PASSED cert with expiry_date >= clock_date exists for the unit: unit CERTIFIED -> REGISTERED; unit OCCUPIED -> HABITABILITY_HOLD"
          - "site.compliance_posture recompute"

      - from: PASSED
        to: EXPIRED
        trigger: "system (evaluated lazily when the certification is consulted by a write: tenancy activation, site status change, or certification PUT — a PASSED cert whose expiry_date < clock_date flips to EXPIRED)"
        actor: system
        preconditions:
          - "expiry_date < clock_date"
        side_effects:
          - "If no other PASSED valid cert exists for the unit: unit CERTIFIED -> REGISTERED; unit OCCUPIED -> HABITABILITY_HOLD"
          - "site.compliance_posture recompute"

  - entity: Household
    initial_state: PENDING_ELIGIBILITY
    terminal_states: []
    transitions:
      - from: PENDING_ELIGIBILITY
        to: ELIGIBLE
        trigger: "PUT /households/{id} (eligibility_status=ELIGIBLE)"
        actor: IntakeCoordinator
        preconditions:
          - "ag_work_verified = true (ERR_AG_WORK_NOT_VERIFIED)"
        side_effects: []

      - from: PENDING_ELIGIBILITY
        to: INELIGIBLE
        trigger: "PUT /households/{id} (eligibility_status=INELIGIBLE)"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

      - from: INELIGIBLE
        to: PENDING_ELIGIBILITY
        trigger: "PUT /households/{id} (eligibility_status=PENDING_ELIGIBILITY)"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []
        note: "Cyclic re-application with new documentation"

      - from: ELIGIBLE
        to: INELIGIBLE
        trigger: "PUT /households/{id} (eligibility_status=INELIGIBLE)"
        actor: IntakeCoordinator
        preconditions: []
        side_effects:
          - "Blocks new tenancy creation/activation for this household (existing tenancies unaffected)"

  - entity: Tenancy
    initial_state: PENDING_MOVE_IN
    terminal_states: [TERMINATED, CANCELLED]
    transitions:
      - from: PENDING_MOVE_IN
        to: ACTIVE
        trigger: "PUT /tenancies/{id} (status=ACTIVE)"
        actor: IntakeCoordinator
        preconditions:
          - "Site status = OPEN (ERR_SITE_NOT_OPEN)"
          - "Site compliance_posture != RESTRICTED (ERR_SITE_RESTRICTED)"
          - "Unit status in {CERTIFIED, OCCUPIED} (ERR_INVALID_STATE; ERR_UNIT_CONDEMNED when CONDEMNED)"
          - "Unit under_pest_exclusion = false for move_in_date (ERR_UNIT_UNDER_PEST_EXCLUSION)"
          - "Unit holds a PASSED certification with expiry_date >= clock_date (ERR_NO_VALID_CERTIFICATION; a PASSED cert with expiry_date < clock_date flips to EXPIRED as a side effect of this check)"
          - "Household eligibility_status = ELIGIBLE (ERR_HOUSEHOLD_NOT_ELIGIBLE)"
          - "No member of the household belongs to another tenancy in ACTIVE or NOTICE (ERR_MEMBER_ALREADY_HOUSED)"
          - "unit.current_occupancy + household.member_count <= unit.max_occupancy (ERR_OCCUPANCY_LIMIT_EXCEEDED)"
        side_effects:
          - "unit.current_occupancy += household.member_count"
          - "unit CERTIFIED -> OCCUPIED when this is the first ACTIVE tenancy"
          - "Post RENT ChargeLedgerEntry = prorated_rent_charge for the move-in month"
          - "Post SUBSIDY_CREDIT ChargeLedgerEntry = subsidy_tier_percent * prorated rent when subsidy_credit_tier > 0; lock tenancy.subsidy_tier_percent"
          - "balance/bucket/delinquency recompute (ledger_bucket_allocation, delinquency_chronological_walk)"

      - from: ACTIVE
        to: NOTICE
        trigger: "PUT /tenancies/{id} (status=NOTICE)"
        actor: IntakeCoordinator | Resident
        preconditions:
          - "Resident actor: tenancy.household_id = X-User-ID (ERR_INSUFFICIENT_PERMISSIONS); notice_reason = RESIDENT"
          - "IntakeCoordinator actor: notice_reason = OPERATOR"
        side_effects: []

      - from: NOTICE
        to: ACTIVE
        trigger: "PUT /tenancies/{id} (status=ACTIVE) — rescind notice"
        actor: IntakeCoordinator
        preconditions:
          - "Site status = OPEN (ERR_SITE_NOT_OPEN)"
          - "Site compliance_posture != RESTRICTED (ERR_SITE_RESTRICTED)"
          - "Unit status in {CERTIFIED, OCCUPIED} (ERR_INVALID_STATE)"
          - "notice_reason != CONDEMNATION (ERR_UNIT_CONDEMNED — condemnation notice cannot be rescinded)"
        side_effects:
          - "notice_reason = null"
        note: "Cyclic revert branch"

      - from: ACTIVE
        to: TERMINATED
        trigger: "PUT /tenancies/{id} (status=TERMINATED, move_out_date)"
        actor: IntakeCoordinator
        preconditions:
          - "move_out_date >= move_in_date (ERR_INVALID_REQUEST)"
        side_effects:
          - "move_out_date recorded"
          - "unit.current_occupancy -= household.member_count"
          - "unit OCCUPIED -> CERTIFIED when current_occupancy reaches 0"
          - "site.compliance_posture recompute"

      - from: NOTICE
        to: TERMINATED
        trigger: "PUT /tenancies/{id} (status=TERMINATED, move_out_date)"
        actor: IntakeCoordinator
        preconditions:
          - "move_out_date >= move_in_date (ERR_INVALID_REQUEST)"
        side_effects:
          - "move_out_date recorded"
          - "unit.current_occupancy -= household.member_count"
          - "unit OCCUPIED -> CERTIFIED when current_occupancy reaches 0"
          - "site.compliance_posture recompute"

      - from: PENDING_MOVE_IN
        to: CANCELLED
        trigger: "PUT /tenancies/{id} (status=CANCELLED)"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: NOTICE
        trigger: "system (condemnation cascade from HousingUnit CONDEMNED transition)"
        actor: system
        preconditions: []
        side_effects:
          - "notice_reason = CONDEMNATION"
          - "household.rehousing_priority = true"
        note: "Forced notice; distinct trigger from the resident/operator NOTICE transition"

      - from: NOTICE
        to: NOTICE
        trigger: "system (condemnation cascade on a tenancy already in NOTICE)"
        actor: system
        preconditions: []
        side_effects:
          - "notice_reason = CONDEMNATION (overrides RESIDENT/OPERATOR)"
          - "household.rehousing_priority = true"

  - entity: ChargeLedgerEntry
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /charge-ledger-entries/{id}/void (void_reason)"
        actor: OperatorAdmin
        preconditions:
          - "Entry status = POSTED (ERR_ENTRY_ALREADY_VOIDED)"
        side_effects:
          - "void_reason recorded"
          - "tenancy balance/bucket/delinquency recompute (entry excluded from all sums)"
          - "tenancy.version increments by 1"

  - entity: DeductionAuthorization
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (when POST /deduction-authorizations creates a replacement for the same household)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_id = id of the newly created authorization"
      - from: ACTIVE
        to: REVOKED
        trigger: "PUT /deduction-authorizations/{id} (status=REVOKED)"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

  - entity: WorkOrder
    initial_state: REPORTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "PUT /work-orders/{id} (status=TRIAGED)"
        actor: MaintenanceLead
        preconditions: []
        side_effects: []

      - from: TRIAGED
        to: ASSIGNED
        trigger: "PUT /work-orders/{id} (status=ASSIGNED, assignee_name)"
        actor: MaintenanceLead
        preconditions:
          - "assignee_name present (ERR_INVALID_REQUEST)"
        side_effects: []

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "PUT /work-orders/{id} (status=IN_PROGRESS)"
        actor: MaintenanceLead
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "PUT /work-orders/{id} (status=COMPLETED)"
        actor: MaintenanceLead
        preconditions: []
        side_effects:
          - "completed_by = X-User-ID"

      - from: COMPLETED
        to: VERIFIED
        trigger: "PUT /work-orders/{id} (status=VERIFIED)"
        actor: SiteManager
        preconditions:
          - "X-User-ID != completed_by (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "verified_by = X-User-ID"
          - "habitability_risk_score recompute for the unit; if unit HABITABILITY_HOLD and cumulative score < 40 and zero non-terminal CRITICAL work orders: unit -> CERTIFIED (or OCCUPIED when current_occupancy > 0)"
          - "site.compliance_posture recompute"

      - from: COMPLETED
        to: REOPENED
        trigger: "PUT /work-orders/{id} (status=REOPENED)"
        actor: SiteManager
        preconditions: []
        side_effects:
          - "habitability_risk_score recompute (work order counts as open again)"
          - "site.compliance_posture recompute"
        note: "Cyclic rework branch"

      - from: REOPENED
        to: ASSIGNED
        trigger: "PUT /work-orders/{id} (status=ASSIGNED, assignee_name)"
        actor: MaintenanceLead
        preconditions:
          - "assignee_name present (ERR_INVALID_REQUEST)"
        side_effects: []

      - from: VERIFIED
        to: CLOSED
        trigger: "PUT /work-orders/{id} (status=CLOSED)"
        actor: SiteManager
        preconditions: []
        side_effects:
          - "site.compliance_posture recompute"

      - from: REPORTED
        to: CANCELLED
        trigger: "PUT /work-orders/{id} (status=CANCELLED)"
        actor: SiteManager | MaintenanceLead
        preconditions: []
        side_effects:
          - "habitability_risk_score recompute; possible hold clear"
          - "site.compliance_posture recompute"

      - from: TRIAGED
        to: CANCELLED
        trigger: "PUT /work-orders/{id} (status=CANCELLED)"
        actor: SiteManager | MaintenanceLead
        preconditions: []
        side_effects:
          - "habitability_risk_score recompute; possible hold clear"
          - "site.compliance_posture recompute"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "PUT /work-orders/{id} (status=CANCELLED)"
        actor: SiteManager | MaintenanceLead
        preconditions: []
        side_effects:
          - "habitability_risk_score recompute; possible hold clear"
          - "site.compliance_posture recompute"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "PUT /work-orders/{id} (status=CANCELLED)"
        actor: SiteManager | MaintenanceLead
        preconditions: []
        side_effects:
          - "habitability_risk_score recompute; possible hold clear"
          - "site.compliance_posture recompute"

      - from: REOPENED
        to: CANCELLED
        trigger: "PUT /work-orders/{id} (status=CANCELLED)"
        actor: SiteManager | MaintenanceLead
        preconditions: []
        side_effects:
          - "habitability_risk_score recompute; possible hold clear"
          - "site.compliance_posture recompute"

  - entity: PestTreatment
    initial_state: SCHEDULED
    terminal_states: [CLEARED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: APPLIED
        trigger: "PUT /pest-treatments/{id} (status=APPLIED)"
        actor: SiteManager
        preconditions:
          - "Unit status != DECOMMISSIONED (ERR_INVALID_STATE)"
        side_effects:
          - "applied_date = clock_date"
          - "exclusion_end_date = applied_date + reentry_buffer_days (closed interval)"
          - "unit.under_pest_exclusion = true while clock_date <= exclusion_end_date; unit.pest_exclusion_end_date = max over APPLIED treatments' exclusion_end_date"

      - from: APPLIED
        to: CLEARED
        trigger: "PUT /pest-treatments/{id} (status=CLEARED)"
        actor: SiteManager
        preconditions:
          - "clock_date > exclusion_end_date (ERR_REENTRY_BUFFER_ACTIVE)"
        side_effects:
          - "unit.under_pest_exclusion recomputed across remaining APPLIED treatments"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "PUT /pest-treatments/{id} (status=CANCELLED)"
        actor: SiteManager
        preconditions: []
        side_effects: []

  - entity: Complaint
    initial_state: FILED
    terminal_states: [CLOSED]
    transitions:
      - from: FILED
        to: ACKNOWLEDGED
        trigger: "PUT /complaints/{id} (status=ACKNOWLEDGED)"
        actor: SiteManager
        preconditions: []
        side_effects:
          - "acknowledged_at = clock timestamp"
          - "sla_breached = (acknowledged_at > filed_at + 72 hours); exactly 72h00m00s is compliant"
          - "site.compliance_posture recompute"

      - from: ACKNOWLEDGED
        to: INVESTIGATING
        trigger: "PUT /complaints/{id} (status=INVESTIGATING)"
        actor: SiteManager
        preconditions: []
        side_effects: []

      - from: INVESTIGATING
        to: RESOLVED
        trigger: "PUT /complaints/{id} (status=RESOLVED, resolution_note)"
        actor: SiteManager
        preconditions:
          - "resolution_note present (ERR_INVALID_REQUEST)"
          - "Every WorkOrder with complaint_id = complaint.id has status in {VERIFIED, CLOSED, CANCELLED} (ERR_LINKED_WORK_ORDERS_OPEN)"
        side_effects:
          - "site.compliance_posture recompute"

      - from: INVESTIGATING
        to: ESCALATED_TO_AGENCY
        trigger: "PUT /complaints/{id} (status=ESCALATED_TO_AGENCY)"
        actor: SiteManager
        preconditions: []
        side_effects: []

      - from: ESCALATED_TO_AGENCY
        to: INVESTIGATING
        trigger: "PUT /complaints/{id} (status=INVESTIGATING)"
        actor: SiteManager
        preconditions: []
        side_effects: []
        note: "Branching return: agency refers the complaint back to the operator"

      - from: RESOLVED
        to: CLOSED
        trigger: "PUT /complaints/{id} (status=CLOSED)"
        actor: SiteManager
        preconditions: []
        side_effects:
          - "site.compliance_posture recompute"

  - entity: RegulatoryInspection
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "PUT /regulatory-inspections/{id} (status=CONDUCTED)"
        actor: ComplianceInspector
        preconditions:
          - "Site status = OPEN (ERR_SITE_NOT_OPEN)"
        side_effects: []

      - from: CONDUCTED
        to: FINDINGS_ISSUED
        trigger: "PUT /regulatory-inspections/{id} (status=FINDINGS_ISSUED, findings)"
        actor: ComplianceInspector
        preconditions:
          - "findings present (may be an empty array) (ERR_INVALID_REQUEST when absent)"
        side_effects:
          - "issued_by = X-User-ID"
          - "open_critical_count = number of CRITICAL findings"
          - "For each CRITICAL finding: cited unit -> CONDEMNED; that transition force-notices the unit's ACTIVE/NOTICE tenancies (notice_reason = CONDEMNATION); each affected household gets rehousing_priority = true"
          - "site.compliance_posture recompute"

      - from: FINDINGS_ISSUED
        to: CONDUCTED
        trigger: "PUT /regulatory-inspections/{id} (status=CONDUCTED)"
        actor: ComplianceInspector
        preconditions: []
        side_effects: []
        note: "Cyclic re-inspection loop; findings and issued_by persist"

      - from: FINDINGS_ISSUED
        to: CURE_CERTIFIED
        trigger: "PUT /regulatory-inspections/{id} (status=CURE_CERTIFIED)"
        actor: ComplianceInspector
        preconditions:
          - "X-User-ID != issued_by (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "open_critical_count = 0: every CRITICAL finding's cited unit holds a PASSED UnitCertification with inspection_date later than the findings' issued date (ERR_UNRESOLVED_CRITICAL_FINDINGS)"
        side_effects:
          - "cure_certified_by = X-User-ID"
          - "Every CONDEMNED unit cited by this inspection -> REGISTERED"
          - "site.compliance_posture recompute"

      - from: CURE_CERTIFIED
        to: CLOSED
        trigger: "PUT /regulatory-inspections/{id} (status=CLOSED)"
        actor: ComplianceInspector
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "PUT /regulatory-inspections/{id} (status=CANCELLED)"
        actor: ComplianceInspector
        preconditions: []
        side_effects: []

  - entity: ServiceReferral
    initial_state: INITIATED
    terminal_states: [COMPLETED, DECLINED]
    transitions:
      - from: INITIATED
        to: ACCEPTED_BY_AGENCY
        trigger: "PUT /service-referrals/{id} (status=ACCEPTED_BY_AGENCY)"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []
      - from: ACCEPTED_BY_AGENCY
        to: COMPLETED
        trigger: "PUT /service-referrals/{id} (status=COMPLETED)"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []
      - from: INITIATED
        to: DECLINED
        trigger: "PUT /service-referrals/{id} (status=DECLINED)"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: season-window-create-stale-site
    parent_entity: HousingSite
    write_endpoint: "POST /season-windows"
    occ_field: expected_site_version
    description: |
      Creating a SeasonWindow against a HousingSite whose version has advanced
      since the client last observed it is rejected. The create legitimately
      supersedes any existing PLANNED window for the site, so a writer holding
      a stale site version would otherwise silently overwrite the effects of
      the write that advanced the version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: authorization-create-stale-household
    parent_entity: Household
    write_endpoint: "POST /deduction-authorizations"
    occ_field: expected_household_version
    description: |
      Creating a DeductionAuthorization against a Household whose version has
      advanced since the client last observed it is rejected. The create
      legitimately supersedes the household's existing ACTIVE authorization,
      so a writer holding a stale household version would otherwise silently
      supersede an authorization it never observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: tenancy-create-stale-unit
    parent_entity: HousingUnit
    write_endpoint: "POST /tenancies"
    occ_field: expected_unit_version
    description: |
      Creating a Tenancy against a HousingUnit whose version has advanced
      since the client last observed it is rejected. Pre-leasing a unit whose
      current tenancy is in NOTICE is legitimate, so a writer holding a stale
      unit version would otherwise succeed against occupancy/hold state it
      never observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: occupancy_headcount_check
    trigger: "tenancy activation (PUT /tenancies/{id} status=ACTIVE from PENDING_MOVE_IN); household member creation (POST /household-members when the household holds an ACTIVE or NOTICE tenancy)"
    algorithm: threshold
    formula: |
      projected = unit.current_occupancy + household.member_count
      Allowed when projected <= unit.max_occupancy (boundary: equality is allowed).
      unit.current_occupancy = sum of household.member_count over the unit's tenancies
      with status in {ACTIVE, NOTICE}.
    input_set: "Tenancies of the unit with status in {ACTIVE, NOTICE}; household members of the incoming household (all members, regardless of is_minor)"
    constants:
      BOUNDARY: "inclusive: projected == max_occupancy is allowed; projected == max_occupancy + 1 is rejected"
    precision: "integer persons; no rounding"

  - name: prorated_rent_charge
    trigger: "tenancy activation (PENDING_MOVE_IN -> ACTIVE)"
    algorithm: tiered_pricing
    formula: |
      Base variant selection by unit.unit_type.
      days_remaining = (last day of move_in month) - move_in_date + 1   (inclusive of move_in_date)
      days_in_month = number of days in the move-in calendar month
    input_set: "The activating tenancy, its unit, and the logical clock date"
    constants:
      WEEKS_PER_YEAR_DIVISOR: 52
      MONTHS_PER_YEAR: 12
    precision: "2 decimal places internally; all posted amounts are integer cents, round_half_up"
    variants:
      - name: calendar_day
        when: "unit.unit_type = FAMILY_UNIT"
        difference: "charge_cents = round_half_up(monthly_rent_cents * days_remaining / days_in_month)"
      - name: weekly_slot
        when: "unit.unit_type = SEASONAL_DORM"
        difference: "weekly_rate_cents = round_half_up(monthly_rent_cents * 12 / 52); charge_cents = ceil(days_remaining / 7) * weekly_rate_cents — a partially used week bills the whole weekly slot"

  - name: subsidy_credit_tier
    trigger: "tenancy activation, AFTER prorated_rent_charge"
    algorithm: threshold
    formula: |
      Evaluation order is pinned to break the apparent circle (credit lowers net rent,
      but the tier is keyed on GROSS rent):
        1. gross_monthly = unit.monthly_rent_cents
        2. monthly_income = round_half_up(household.annual_family_income_cents / 12)
        3. If monthly_income == 0: tier = 0.30 (maximum relief)
           Else rent_burden_ratio = gross_monthly / monthly_income
        4. tier: ratio >= 0.50 -> 0.30; ratio >= 0.30 -> 0.15; else 0   (boundaries inclusive)
        5. credit_cents = round_half_up(tier * prorated_rent_charge_cents)
        6. Post RENT entry first, then SUBSIDY_CREDIT entry of credit_cents (skipped when tier = 0)
      tenancy.subsidy_tier_percent locks to the computed tier at activation.
    input_set: "The activating tenancy's unit rent and household income"
    constants:
      TIER_HIGH_THRESHOLD: 0.50
      TIER_HIGH_CREDIT: 0.30
      TIER_LOW_THRESHOLD: 0.30
      TIER_LOW_CREDIT: 0.15
    precision: "integer cents, round_half_up"

  - name: payroll_deduction_cap
    trigger: "POST /tenancies/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      Requires the household's ACTIVE DeductionAuthorization (ERR_NO_ACTIVE_DEDUCTION_AUTHORIZATION).
      Let gross = gross_wages_cents, auth = authorization, bal = covered bucket balance.
      covered_balance = rent_bucket_balance_cents
                        + (utility_bucket_balance_cents when auth.purpose = RENT_AND_UTILITIES else 0)
      allowed_cents = min(
          round_half_up(auth.cap_percent * gross),
          round_half_up(FEDERAL_MAX_PCT * gross),
          gross - MIN_NET_WAGE_FLOOR_CENTS,
          covered_balance)
      Each min-argument is rounded to integer cents (round_half_up) BEFORE comparison.
      If allowed_cents <= 0: reject ERR_NOTHING_TO_COLLECT.
      Payment entry amount = allowed_cents. Waterfall application of the credit:
        1. rent bucket first (down to zero)
        2. overflow into utility bucket ONLY when auth.purpose = RENT_AND_UTILITIES
        3. DAMAGE bucket is never touched by payroll payments
    input_set: "The tenancy's POSTED ledger entries, the household's ACTIVE authorization, request gross_wages_cents"
    constants:
      FEDERAL_MAX_PCT: 0.30
      MIN_NET_WAGE_FLOOR_CENTS: 40000
    precision: "integer cents, round_half_up per min-argument"

  - name: utility_overage_charge
    trigger: "POST /charge-ledger-entries with entry_type = UTILITY_OVERAGE"
    algorithm: tiered_pricing
    formula: |
      For EACH usage_line (rounding order pinned: round per line, THEN sum):
        overage_units = max(0, usage_units - ALLOWANCE[utility_type])
        tier1_units = min(overage_units, TIER1_SPAN)
        tier2_units = overage_units - tier1_units
        line_cents_raw = tier1_units * TIER1_RATE_TENTH_CENTS / 10 + tier2_units * TIER2_RATE_TENTH_CENTS / 10
        line_cents = round_half_up(line_cents_raw)        # per-line rounding
      entry.amount_cents = sum(line_cents over all lines)  # sum of already-rounded lines
      (Sum-then-round is explicitly NOT used: 5+5 overage units across two lines bills 126 cents, not 125.)
    input_set: "usage_lines from the request; allowances and rates are constants"
    constants:
      ALLOWANCE: { ELECTRIC: 200, GAS: 100, WATER: 150 }
      TIER1_SPAN: 100
      TIER1_RATE_TENTH_CENTS: 125    # 12.5 cents per unit
      TIER2_RATE_TENTH_CENTS: 187.5  # 18.75 cents per unit
    precision: "integer cents, round_half_up per line, then integer sum"

  - name: habitability_risk_score
    trigger: "work order create, VERIFIED, REOPENED, CLOSED, CANCELLED (any transition changing the non-terminal set)"
    algorithm: weighted_scoring
    formula: |
      weights = { CRITICAL: 25, MAJOR: 10, MINOR: 3 }
      open_set = work orders on the unit with status in {REPORTED, TRIAGED, ASSIGNED, IN_PROGRESS, COMPLETED, REOPENED}
      cumulative: habitability_score_cumulative = sum(weights[wo.severity] for wo in open_set)
      worst_case: habitability_score_worst_case = (max weight in open_set) + 0.25 * (sum of remaining weights); 0 when open_set empty
      Enforcement uses the CUMULATIVE variant: unit enters HABITABILITY_HOLD when cumulative >= HOLD_THRESHOLD
      or any CRITICAL exists in open_set; clears when cumulative < HOLD_THRESHOLD and no CRITICAL open.
      worst_case is a triage preview surfaced on reads only.
    input_set: "Work orders of the unit with status in {REPORTED, TRIAGED, ASSIGNED, IN_PROGRESS, COMPLETED, REOPENED}"
    constants:
      WEIGHT_CRITICAL: 25
      WEIGHT_MAJOR: 10
      WEIGHT_MINOR: 3
      HOLD_THRESHOLD: 40
    precision: "cumulative is integer; worst_case keeps 2 decimal places"
    variants:
      - name: cumulative
        when: "enforcement: HABITABILITY_HOLD transitions and site posture"
        difference: "plain weighted sum over the open set"
      - name: worst_case
        when: "triage preview on availability/compliance reads"
        difference: "max weight + 0.25 * remaining weights — heavily discounts long tails of MINOR items"

  - name: site_compliance_posture
    trigger: "any unit status change, work order create/verify/reopen/close/cancel, inspection issue-findings/cure-certify, complaint acknowledge/resolve/close"
    algorithm: threshold
    formula: |
      RESTRICTED when any of:
        - any unit of the site has status CONDEMNED
        - >= 2 units of the site have status HABITABILITY_HOLD
        - any RegulatoryInspection of the site has status FINDINGS_ISSUED with open_critical_count > 0
      else WATCH when any of:
        - exactly 1 unit has status HABITABILITY_HOLD
        - any non-terminal work order with severity CRITICAL exists on the site
        - any complaint with sla_breached = true and status in {FILED, ACKNOWLEDGED, INVESTIGATING, ESCALATED_TO_AGENCY} exists on the site
      else NORMAL
      RESTRICTED gates tenancy activation and notice rescission (ERR_SITE_RESTRICTED).
    input_set: "All units, work orders, inspections, complaints reachable from the site"
    constants:
      RESTRICTED_HOLD_COUNT: 2
    precision: "enum; deterministic"

  - name: pest_exclusion_window
    trigger: "PestTreatment -> APPLIED; tenancy activation check; PUT /pest-treatments/{id} status=CLEARED"
    algorithm: interval_merge
    formula: |
      On APPLIED: exclusion = closed interval [applied_date, applied_date + reentry_buffer_days].
      Move-in conflict: activation with move_in_date <= exclusion_end_date of ANY APPLIED treatment
      on the unit is rejected (ERR_UNIT_UNDER_PEST_EXCLUSION); move_in_date > exclusion_end_date is allowed.
      Multiple APPLIED treatments merge: unit.pest_exclusion_end_date = max(exclusion_end_date).
      CLEARED requires clock_date > exclusion_end_date (ERR_REENTRY_BUFFER_ACTIVE) — the buffer end
      date itself is still excluded.
    input_set: "PestTreatments of the unit with status APPLIED"
    constants:
      INTERVAL_SEMANTICS: "closed interval with buffer; adjacency does NOT permit occupancy"
    precision: "whole days"

  - name: complaint_sla
    trigger: "Complaint FILED -> ACKNOWLEDGED"
    algorithm: threshold
    formula: |
      deadline = filed_at + 72 hours
      sla_breached = (acknowledged_at > deadline)   # strictly greater; acknowledgement exactly at the deadline is compliant
    input_set: "The complaint's filed_at and acknowledged_at (logical clock)"
    constants:
      SLA_HOURS: 72
      BOUNDARY: "exclusive: breach only when acknowledged_at is strictly after filed_at + 72h"
    precision: "minute precision on timestamps"

  - name: delinquency_chronological_walk
    trigger: "any ledger entry POST or VOID on the tenancy; any payment"
    algorithm: chronological
    formula: |
      Buckets: RENT (debits RENT; credits SUBSIDY_CREDIT and RENT-purpose PAYMENT portions),
      UTILITY (debits UTILITY_OVERAGE; credits overflow portions of RENT_AND_UTILITIES PAYMENTs),
      DAMAGE (debits DAMAGE; no payroll credits).
      Processing order for allocation: created_at ASC, tie-break entry_type ASC (never id).
      Within each bucket, credits consume the oldest debit residuals first.
      balance_cents = rent_bucket_balance_cents + utility_bucket_balance_cents + damage_bucket_balance_cents
      oldest_unpaid_charge_date = earliest charge_date among debits with residual > 0 (across all buckets);
                                  null when balance_cents = 0
      is_delinquent = balance_cents > 0 AND (clock_date - oldest_unpaid_charge_date).days > GRACE_DAYS
      VOIDED entries are excluded from every sum.
    input_set: "ChargeLedgerEntries of the tenancy with status POSTED"
    constants:
      GRACE_DAYS: 10
      BOUNDARY: "exclusive: exactly GRACE_DAYS old is not yet delinquent"
    precision: "integer cents; whole days"

  - name: season_window_gap_check
    trigger: "POST /season-windows"
    algorithm: interval_merge
    formula: |
      Existing windows considered: those with status in {ACTIVE, COMPLETED} plus PLANNED windows NOT being superseded.
      Overlap check FIRST (ERR_SEASON_WINDOW_OVERLAP): closed-interval intersection —
      new.planned_open_date <= existing.planned_close_date AND new.planned_close_date >= existing.planned_open_date.
      Gap check SECOND (ERR_SEASON_GAP_TOO_SHORT): for every non-overlapping existing window,
      the free gap between the intervals must be > MAINTENANCE_GAP_DAYS on BOTH sides where defined:
        0 < (new.planned_open_date - existing.planned_close_date).days <= MAINTENANCE_GAP_DAYS -> reject
        0 < (existing.planned_open_date - new.planned_close_date).days <= MAINTENANCE_GAP_DAYS -> reject
      Adjacency (gap of 0 or 1 day) is an overlap rejection by the closed-interval rule above;
      a gap of exactly MAINTENANCE_GAP_DAYS + 1 days is the smallest legal separation.
    input_set: "SeasonWindows of the site with status in {PLANNED (non-superseded), ACTIVE, COMPLETED}"
    constants:
      MAINTENANCE_GAP_DAYS: 14
      INTERVAL_SEMANTICS: "closed intervals with a mandatory inter-season maintenance gap"
    precision: "whole days"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint and this transition; Resident ownership: X-User-ID must equal the tenancy's household_id on POST /complaints and on PUT /tenancies/{id} status=NOTICE"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Request body shape: required fields present, types match, enum values in declared sets, conditional field rules (UTILITY_OVERAGE requires usage_lines and forbids amount_cents; DAMAGE requires source_work_order_id; PASSED/FAILED carry deficiency_count; ASSIGNED carries assignee_name; RESOLVED carries resolution_note; FINDINGS_ISSUED carries findings)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 4
    category: existence
    check: "Path ids exist, then body FK ids exist, validated left-to-right"
    error_id: "ERR_SITE_NOT_FOUND / ERR_UNIT_NOT_FOUND / ERR_HOUSEHOLD_NOT_FOUND / ERR_TENANCY_NOT_FOUND / ERR_WORK_ORDER_NOT_FOUND / ERR_INSPECTION_NOT_FOUND / ERR_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_site_version / expected_household_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /season-windows, POST /deduction-authorizations"
    note: "Evaluated before all business logic, after existence"

  - priority: 6
    category: auth
    check: "Segregation of duties: PUT /work-orders/{id} status=VERIFIED requires X-User-ID != completed_by; PUT /regulatory-inspections/{id} status=CURE_CERTIFIED requires X-User-ID != issued_by"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "PUT /work-orders/{id}, PUT /regulatory-inspections/{id}"

  - priority: 7
    category: state
    check: "State machine from-state validity: the requested target status must be a declared transition from the entity's current status; child creation against a DECOMMISSIONED unit is likewise rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all PUT status endpoints, POST /work-orders, POST /pest-treatments, DELETE /season-windows/{id}, POST /charge-ledger-entries/{id}/void (covered by ERR_ENTRY_ALREADY_VOIDED)"

  - priority: 7.5
    category: state
    check: "POST /tenancies/{id}/payments requires tenancy status in {ACTIVE, NOTICE}; POST /charge-ledger-entries requires tenancy status in {ACTIVE, NOTICE}; POST /complaints requires tenancy status in {ACTIVE, NOTICE}"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /tenancies/{id}/payments, POST /charge-ledger-entries, POST /complaints"

  - priority: 8
    category: state
    check: "Site lifecycle gates: tenancy activation and notice rescission require site OPEN; inspection conduct requires site OPEN"
    error_id: ERR_SITE_NOT_OPEN
    http_status: 409
    applies_to: "PUT /tenancies/{id}, PUT /regulatory-inspections/{id}"

  - priority: 9
    category: state
    check: "Unit status gate: activation requires unit in {CERTIFIED, OCCUPIED}; CONDEMNED yields the domain-specific error"
    error_id: "ERR_INVALID_STATE / ERR_UNIT_CONDEMNED"
    http_status: 409
    applies_to: "PUT /tenancies/{id}"

  - priority: 10
    category: state
    check: "Site posture gate: tenancy activation and notice rescission rejected while compliance_posture = RESTRICTED"
    error_id: ERR_SITE_RESTRICTED
    http_status: 409
    applies_to: "PUT /tenancies/{id}"

  - priority: 11
    category: business_safety
    check: "Pest exclusion: move_in_date <= exclusion_end_date of any APPLIED treatment on the unit is rejected; CLEARED before buffer elapses is rejected"
    error_id: "ERR_UNIT_UNDER_PEST_EXCLUSION / ERR_REENTRY_BUFFER_ACTIVE"
    http_status: 409
    applies_to: "PUT /tenancies/{id}, PUT /pest-treatments/{id}"

  - priority: 12
    category: business_safety
    check: "Certification validity at activation: unit must hold a PASSED cert with expiry_date >= clock_date (expired PASSED certs flip to EXPIRED as a side effect)"
    error_id: ERR_NO_VALID_CERTIFICATION
    http_status: 409
    applies_to: "PUT /tenancies/{id}"

  - priority: 13
    category: business_safety
    check: "Occupancy: unit.current_occupancy + household.member_count <= unit.max_occupancy at activation; member add rejected when the household's ACTIVE/NOTICE tenancy would exceed the unit cap"
    error_id: ERR_OCCUPANCY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "PUT /tenancies/{id}, POST /household-members"

  - priority: 14
    category: business_constraint
    check: "Season window overlap (checked FIRST), then maintenance gap (checked SECOND)"
    error_id: "ERR_SEASON_WINDOW_OVERLAP / ERR_SEASON_GAP_TOO_SHORT"
    http_status: 409
    applies_to: "POST /season-windows"

  - priority: 15
    category: business_temporal
    check: "Season closure pest recency: every unit in {CERTIFIED, OCCUPIED, HABITABILITY_HOLD} has an APPLIED/CLEARED treatment within the ACTIVE window dates"
    error_id: ERR_SEASON_PEST_TREATMENT_MISSING
    http_status: 409
    applies_to: "PUT /housing-sites/{id} (status=CLOSED)"

  - priority: 16
    category: business_referential
    check: "Referential gates: household must be ELIGIBLE for tenancy create/activate and referral create; no household member in another ACTIVE/NOTICE tenancy; EDUCATION referral requires minor_count >= 1; ELIGIBLE verification requires ag_work_verified; DAMAGE charge's work order must be VERIFIED or CLOSED; complaint resolution requires linked work orders terminal; cure certification requires zero open critical findings; unit decommission and season closure require no live tenancies; season closure requires no open work orders"
    error_id: "ERR_HOUSEHOLD_NOT_ELIGIBLE / ERR_MEMBER_ALREADY_HOUSED / ERR_EDUCATION_REFERRAL_REQUIRES_MINOR / ERR_AG_WORK_NOT_VERIFIED / ERR_WORK_ORDER_NOT_VERIFIED / ERR_LINKED_WORK_ORDERS_OPEN / ERR_UNRESOLVED_CRITICAL_FINDINGS / ERR_ACTIVE_TENANCIES_REMAIN / ERR_OPEN_WORK_ORDERS_REMAIN"
    http_status: 409
    applies_to: "various (per check)"
    note: "ERR_EDUCATION_REFERRAL_REQUIRES_MINOR and ERR_AG_WORK_NOT_VERIFIED return 422"

  - priority: 17
    category: business_fiscal
    check: "Payment gates: household has an ACTIVE deduction authorization; covered bucket balance > 0"
    error_id: "ERR_NO_ACTIVE_DEDUCTION_AUTHORIZATION / ERR_NOTHING_TO_COLLECT"
    http_status: 409
    applies_to: "POST /tenancies/{id}/payments"
    note: "ERR_NOTHING_TO_COLLECT returns 422"

  - priority: 18
    category: business_fiscal
    check: "Ledger void gate: entry currently POSTED"
    error_id: ERR_ENTRY_ALREADY_VOIDED
    http_status: 409
    applies_to: "POST /charge-ledger-entries/{id}/void"

# =============================================================================
# Section 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call to this endpoint the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [OperatorAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Housing sites ---
  - method: POST
    path: "/housing-sites"
    description: "Create a housing site (status DRAFT, posture NORMAL)"
    roles: [OperatorAdmin]
    code: 201
    input: [name, state_code]
    output: HousingSite
    side_effects: []

  - method: GET
    path: "/housing-sites"
    description: "List housing sites with pagination"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["status?", "compliance_posture?", "limit?", "offset?"]
    output: "HousingSite[]"
    side_effects: []

  - method: GET
    path: "/housing-sites/{id}"
    description: "Get a housing site"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: HousingSite
    side_effects: []

  - method: PUT
    path: "/housing-sites/{id}"
    description: "Drive the site season lifecycle (status in OPENING | DRAFT | OPEN | CLOSING | CLOSED)"
    roles: [OperatorAdmin]
    code: 200
    input: [status]
    output: HousingSite
    side_effects: ["season window ACTIVE/COMPLETED transitions", "certification expiry sweep on CLOSED", "increments HousingSite.version by 1"]

  - method: GET
    path: "/housing-sites/{id}/compliance-summary"
    description: "Computed compliance posture read for the site"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: { compliance_posture: string, units_on_hold_count: integer, condemned_units_count: integer, open_critical_work_orders: integer, breached_open_complaints: integer, units_missing_season_pest_treatment: integer }
    side_effects: []

  # --- Season windows ---
  - method: POST
    path: "/season-windows"
    description: "Create a season window (supersedes an existing PLANNED window for the site; OCC on site version)"
    roles: [OperatorAdmin]
    code: 201
    input: [site_id, label, planned_open_date, planned_close_date, expected_site_version]
    output: SeasonWindow
    side_effects: ["existing PLANNED window for the site -> SUPERSEDED", "increments HousingSite.version by 1"]

  - method: GET
    path: "/season-windows"
    description: "List season windows"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: "SeasonWindow[]"
    side_effects: []

  - method: GET
    path: "/season-windows/{id}"
    description: "Get a season window"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: SeasonWindow
    side_effects: []

  - method: DELETE
    path: "/season-windows/{id}"
    description: "Cancel a PLANNED season window"
    roles: [OperatorAdmin]
    code: 204
    input: []
    output: null
    side_effects: ["window PLANNED -> CANCELLED"]

  # --- Buildings ---
  - method: POST
    path: "/buildings"
    description: "Create a building"
    roles: [OperatorAdmin]
    code: 201
    input: [site_id, name]
    output: Building
    side_effects: []

  - method: GET
    path: "/buildings"
    description: "List buildings"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: "Building[]"
    side_effects: []

  - method: GET
    path: "/buildings/{id}"
    description: "Get a building"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: Building
    side_effects: []

  # --- Housing units ---
  - method: POST
    path: "/housing-units"
    description: "Create a housing unit (status REGISTERED)"
    roles: [OperatorAdmin]
    code: 201
    input: [building_id, site_id, unit_code, unit_type, max_occupancy, monthly_rent_cents]
    output: HousingUnit
    side_effects: ["site_id must equal the building's site_id (ERR_INVALID_REQUEST)"]

  - method: GET
    path: "/housing-units"
    description: "List housing units"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["building_id?", "site_id?", "status?", "limit?", "offset?"]
    output: "HousingUnit[]"
    side_effects: []

  - method: GET
    path: "/housing-units/{id}"
    description: "Get a housing unit"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: HousingUnit
    side_effects: []

  - method: PUT
    path: "/housing-units/{id}"
    description: "Decommission a unit (status=DECOMMISSIONED)"
    roles: [OperatorAdmin]
    code: 200
    input: [status]
    output: HousingUnit
    side_effects: ["unit -> DECOMMISSIONED", "site.compliance_posture recompute", "increments HousingUnit.version by 1"]

  - method: GET
    path: "/housing-units/{id}/availability"
    description: "Computed occupancy/exclusion/certification read for the unit"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: { unit_status: string, current_occupancy: integer, available_beds: integer, under_pest_exclusion: boolean, pest_exclusion_end_date: string, has_valid_certification: boolean, habitability_score_cumulative: number, habitability_score_worst_case: number }
    side_effects: []

  # --- Unit certifications ---
  - method: POST
    path: "/unit-certifications"
    description: "Schedule a pre-occupancy certification inspection (status SCHEDULED)"
    roles: [ComplianceInspector]
    code: 201
    input: [unit_id, "notes?"]
    output: UnitCertification
    side_effects: ["inspector_id = X-User-ID"]

  - method: GET
    path: "/unit-certifications"
    description: "List unit certifications"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: "UnitCertification[]"
    side_effects: []

  - method: GET
    path: "/unit-certifications/{id}"
    description: "Get a unit certification"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: UnitCertification
    side_effects: []

  - method: PUT
    path: "/unit-certifications/{id}"
    description: "Drive certification lifecycle (status in IN_PROGRESS | PASSED | FAILED | VOIDED)"
    roles: [ComplianceInspector]
    code: 200
    input: [status, "deficiency_count?", "notes?"]
    output: UnitCertification
    side_effects: ["unit status transitions on PASSED/VOIDED", "inspection_date/expiry_date set on PASSED", "site.compliance_posture recompute"]

  # --- Households ---
  - method: POST
    path: "/households"
    description: "Create a household (PENDING_ELIGIBILITY)"
    roles: [IntakeCoordinator]
    code: 201
    input: [head_of_household_name, annual_family_income_cents, "ag_work_verified?"]
    output: Household
    side_effects: []

  - method: GET
    path: "/households"
    description: "List households"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["eligibility_status?", "limit?", "offset?"]
    output: "Household[]"
    side_effects: []

  - method: GET
    path: "/households/{id}"
    description: "Get a household"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: PUT
    path: "/households/{id}"
    description: "Set eligibility (eligibility_status in ELIGIBLE | INELIGIBLE | PENDING_ELIGIBILITY)"
    roles: [IntakeCoordinator]
    code: 200
    input: [eligibility_status, "eligibility_notes?"]
    output: Household
    side_effects: ["increments Household.version by 1"]

  # --- Household members ---
  - method: POST
    path: "/household-members"
    description: "Add a household member (occupancy re-check when the household is housed)"
    roles: [IntakeCoordinator]
    code: 201
    input: [household_id, full_name, date_of_birth, relationship]
    output: HouseholdMember
    side_effects: ["household.member_count/minor_count recompute", "increments Household.version by 1"]

  - method: GET
    path: "/household-members"
    description: "List household members"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["household_id?", "limit?", "offset?"]
    output: "HouseholdMember[]"
    side_effects: []

  - method: GET
    path: "/household-members/{id}"
    description: "Get a household member"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: HouseholdMember
    side_effects: []

  # --- Deduction authorizations ---
  - method: POST
    path: "/deduction-authorizations"
    description: "Create a wage deduction authorization (supersedes the household's ACTIVE authorization; OCC on household version)"
    roles: [IntakeCoordinator]
    code: 201
    input: [household_id, cap_percent, purpose, effective_date, expected_household_version]
    output: DeductionAuthorization
    side_effects: ["prior ACTIVE authorization -> SUPERSEDED with superseded_by_id set", "increments Household.version by 1"]

  - method: GET
    path: "/deduction-authorizations"
    description: "List deduction authorizations"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["household_id?", "status?", "superseded_by_id?", "limit?", "offset?"]
    output: "DeductionAuthorization[]"
    side_effects: []

  - method: GET
    path: "/deduction-authorizations/{id}"
    description: "Get a deduction authorization"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: DeductionAuthorization
    side_effects: []

  - method: PUT
    path: "/deduction-authorizations/{id}"
    description: "Revoke an authorization (status=REVOKED)"
    roles: [IntakeCoordinator]
    code: 200
    input: [status]
    output: DeductionAuthorization
    side_effects: []

  # --- Tenancies ---
  - method: POST
    path: "/tenancies"
    description: "Create a tenancy (PENDING_MOVE_IN). Pre-leasing a unit that has a NOTICE tenancy is legitimate."
    roles: [IntakeCoordinator]
    code: 201
    input: [household_id, unit_id, move_in_date, expected_unit_version]
    output: Tenancy
    side_effects: ["increments HousingUnit.version by 1"]

  - method: GET
    path: "/tenancies"
    description: "List tenancies"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["household_id?", "unit_id?", "status?", "limit?", "offset?"]
    output: "Tenancy[]"
    side_effects: []

  - method: GET
    path: "/tenancies/{id}"
    description: "Get a tenancy"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: Tenancy
    side_effects: []

  - method: PUT
    path: "/tenancies/{id}"
    description: "Drive tenancy lifecycle (status in ACTIVE | NOTICE | TERMINATED | CANCELLED; ACTIVE from NOTICE rescinds)"
    roles: [IntakeCoordinator, Resident]
    code: 200
    input: [status, "move_out_date?"]
    output: Tenancy
    side_effects: ["on activation: prorated RENT + SUBSIDY_CREDIT entries, unit occupancy bump, unit CERTIFIED->OCCUPIED", "on termination: occupancy release, unit -> CERTIFIED when empty", "certification expiry evaluation on activation"]

  - method: POST
    path: "/tenancies/{id}/payments"
    description: "Record a payroll-deduction payment capped per payroll_deduction_cap"
    roles: [IntakeCoordinator]
    code: 201
    input: [gross_wages_cents, pay_period_start, pay_period_end]
    output: ChargeLedgerEntry
    side_effects: ["creates POSTED PAYMENT entry at the capped amount", "bucket waterfall application", "delinquency recompute", "increments Tenancy.version by 1"]

  - method: GET
    path: "/tenancies/{id}/statement"
    description: "Computed ledger statement for the tenancy"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: { balance_cents: integer, rent_bucket_balance_cents: integer, utility_bucket_balance_cents: integer, damage_bucket_balance_cents: integer, is_delinquent: boolean, oldest_unpaid_charge_date: string, subsidy_tier_percent: number }
    side_effects: []

  # --- Charge ledger ---
  - method: POST
    path: "/charge-ledger-entries"
    description: "Post a ledger charge/credit (RENT | UTILITY_OVERAGE | DAMAGE | SUBSIDY_CREDIT)"
    roles: [OperatorAdmin]
    code: 201
    input: [tenancy_id, entry_type, "amount_cents?", "usage_lines?", "source_work_order_id?", "description?"]
    output: ChargeLedgerEntry
    side_effects: ["utility_overage_charge computation when entry_type=UTILITY_OVERAGE", "balance/bucket/delinquency recompute", "increments Tenancy.version by 1"]

  - method: GET
    path: "/charge-ledger-entries"
    description: "List ledger entries"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["tenancy_id?", "entry_type?", "status?", "source_work_order_id?", "limit?", "offset?"]
    output: "ChargeLedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/charge-ledger-entries/{id}"
    description: "Get a ledger entry"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: ChargeLedgerEntry
    side_effects: []

  - method: POST
    path: "/charge-ledger-entries/{id}/void"
    description: "Void a POSTED ledger entry (compensating action)"
    roles: [OperatorAdmin]
    code: 200
    input: [void_reason]
    output: ChargeLedgerEntry
    side_effects: ["entry POSTED -> VOIDED", "balance/bucket/delinquency recompute", "increments Tenancy.version by 1"]

  # --- Work orders ---
  - method: POST
    path: "/work-orders"
    description: "Report a work order (status REPORTED); CRITICAL severity immediately puts the unit on HABITABILITY_HOLD"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead]
    code: 201
    input: [unit_id, "complaint_id?", category, severity, description]
    output: WorkOrder
    side_effects: ["CRITICAL severity: unit -> HABITABILITY_HOLD (unless CONDEMNED/DECOMMISSIONED)", "habitability_risk_score recompute", "site.compliance_posture recompute"]

  - method: GET
    path: "/work-orders"
    description: "List work orders"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["unit_id?", "complaint_id?", "status?", "severity?", "limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []

  - method: GET
    path: "/work-orders/{id}"
    description: "Get a work order"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: PUT
    path: "/work-orders/{id}"
    description: "Drive work order lifecycle (status in TRIAGED | ASSIGNED | IN_PROGRESS | COMPLETED | VERIFIED | REOPENED | CLOSED | CANCELLED)"
    roles: [MaintenanceLead, SiteManager]
    code: 200
    input: [status, "assignee_name?"]
    output: WorkOrder
    side_effects: ["completed_by/verified_by recorded", "habitability_risk_score recompute", "unit hold set/clear", "site.compliance_posture recompute"]

  # --- Pest treatments ---
  - method: POST
    path: "/pest-treatments"
    description: "Schedule a pest treatment (status SCHEDULED)"
    roles: [SiteManager]
    code: 201
    input: [unit_id, treatment_type, scheduled_date, reentry_buffer_days]
    output: PestTreatment
    side_effects: []

  - method: GET
    path: "/pest-treatments"
    description: "List pest treatments"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: "PestTreatment[]"
    side_effects: []

  - method: GET
    path: "/pest-treatments/{id}"
    description: "Get a pest treatment"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: PestTreatment
    side_effects: []

  - method: PUT
    path: "/pest-treatments/{id}"
    description: "Drive treatment lifecycle (status in APPLIED | CLEARED | CANCELLED)"
    roles: [SiteManager]
    code: 200
    input: [status]
    output: PestTreatment
    side_effects: ["APPLIED sets applied_date + exclusion_end_date and unit exclusion flags", "CLEARED recomputes unit exclusion"]

  # --- Complaints ---
  - method: POST
    path: "/complaints"
    description: "File a complaint (Resident may file only for own household's tenancy)"
    roles: [Resident, IntakeCoordinator]
    code: 201
    input: [tenancy_id, category, description]
    output: Complaint
    side_effects: ["filed_at = logical clock"]

  - method: GET
    path: "/complaints"
    description: "List complaints"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["tenancy_id?", "status?", "limit?", "offset?"]
    output: "Complaint[]"
    side_effects: []

  - method: GET
    path: "/complaints/{id}"
    description: "Get a complaint"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: PUT
    path: "/complaints/{id}"
    description: "Drive complaint lifecycle (status in ACKNOWLEDGED | INVESTIGATING | RESOLVED | ESCALATED_TO_AGENCY | CLOSED)"
    roles: [SiteManager]
    code: 200
    input: [status, "resolution_note?"]
    output: Complaint
    side_effects: ["acknowledged_at + sla_breached on ACKNOWLEDGED", "site.compliance_posture recompute"]

  # --- Regulatory inspections ---
  - method: POST
    path: "/regulatory-inspections"
    description: "Schedule a regulatory inspection (status SCHEDULED)"
    roles: [ComplianceInspector]
    code: 201
    input: [site_id, agency, scheduled_date]
    output: RegulatoryInspection
    side_effects: []

  - method: GET
    path: "/regulatory-inspections"
    description: "List regulatory inspections"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: "RegulatoryInspection[]"
    side_effects: []

  - method: GET
    path: "/regulatory-inspections/{id}"
    description: "Get a regulatory inspection"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: RegulatoryInspection
    side_effects: []

  - method: PUT
    path: "/regulatory-inspections/{id}"
    description: "Drive inspection lifecycle (status in CONDUCTED | FINDINGS_ISSUED | CURE_CERTIFIED | CLOSED | CANCELLED)"
    roles: [ComplianceInspector]
    code: 200
    input: [status, "findings?"]
    output: RegulatoryInspection
    side_effects: ["FINDINGS_ISSUED: CRITICAL findings condemn cited units -> forced tenancy NOTICE -> household rehousing_priority", "CURE_CERTIFIED: CONDEMNED units -> REGISTERED", "site.compliance_posture recompute"]

  # --- Service referrals ---
  - method: POST
    path: "/service-referrals"
    description: "Create a migrant education/health referral (household must be ELIGIBLE; EDUCATION requires a minor)"
    roles: [IntakeCoordinator]
    code: 201
    input: [household_id, referral_type, agency_name, "notes?"]
    output: ServiceReferral
    side_effects: []

  - method: GET
    path: "/service-referrals"
    description: "List service referrals"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: ["household_id?", "referral_type?", "status?", "limit?", "offset?"]
    output: "ServiceReferral[]"
    side_effects: []

  - method: GET
    path: "/service-referrals/{id}"
    description: "Get a service referral"
    roles: [OperatorAdmin, SiteManager, MaintenanceLead, ComplianceInspector, IntakeCoordinator, Resident]
    code: 200
    input: []
    output: ServiceReferral
    side_effects: []

  - method: PUT
    path: "/service-referrals/{id}"
    description: "Drive referral lifecycle (status in ACCEPTED_BY_AGENCY | COMPLETED | DECLINED)"
    roles: [IntakeCoordinator]
    code: 200
    input: [status]
    output: ServiceReferral
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint/transition, or Resident acting on another household's tenancy" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum value, or violated conditional field rule" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist (generic; specific codes below take precedence for their types)" }
  - { id: ERR_SITE_NOT_FOUND, http: 404, condition: "HousingSite id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "HousingUnit id does not exist" }
  - { id: ERR_HOUSEHOLD_NOT_FOUND, http: 404, condition: "Household id does not exist" }
  - { id: ERR_TENANCY_NOT_FOUND, http: 404, condition: "Tenancy id does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "WorkOrder id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "RegulatoryInspection id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_site_version / expected_household_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested status is not a declared transition from the entity's current status, or a state precondition fails without a more specific code" }
  - { id: ERR_NO_COVERING_SEASON_WINDOW, http: 409, condition: "No PLANNED season window covers the current clock date for a site opening" }
  - { id: ERR_NO_CERTIFIED_UNIT, http: 409, condition: "Site cannot open operations without at least one CERTIFIED unit" }
  - { id: ERR_SITE_NOT_OPEN, http: 409, condition: "Operation requires the site status to be OPEN" }
  - { id: ERR_SITE_RESTRICTED, http: 409, condition: "Site compliance_posture is RESTRICTED; activations and notice rescissions blocked" }
  - { id: ERR_UNIT_CONDEMNED, http: 409, condition: "Unit is CONDEMNED (or notice_reason is CONDEMNATION); activation/rescission forbidden" }
  - { id: ERR_UNIT_UNDER_PEST_EXCLUSION, http: 409, condition: "move_in_date falls inside an APPLIED treatment's closed exclusion window" }
  - { id: ERR_REENTRY_BUFFER_ACTIVE, http: 409, condition: "Pest treatment cannot be CLEARED before clock_date > exclusion_end_date" }
  - { id: ERR_NO_VALID_CERTIFICATION, http: 409, condition: "Unit holds no PASSED certification with expiry_date >= clock_date" }
  - { id: ERR_OCCUPANCY_LIMIT_EXCEEDED, http: 422, condition: "Projected occupancy would exceed unit.max_occupancy" }
  - { id: ERR_SEASON_WINDOW_OVERLAP, http: 409, condition: "New window's closed interval intersects an existing window; checked before the gap rule" }
  - { id: ERR_SEASON_GAP_TOO_SHORT, http: 409, condition: "Gap between non-overlapping windows is <= MAINTENANCE_GAP_DAYS (14)" }
  - { id: ERR_SEASON_PEST_TREATMENT_MISSING, http: 409, condition: "Season closure blocked: a live unit lacks an APPLIED/CLEARED treatment within the ACTIVE window dates" }
  - { id: ERR_HOUSEHOLD_NOT_ELIGIBLE, http: 409, condition: "Household eligibility_status is not ELIGIBLE" }
  - { id: ERR_MEMBER_ALREADY_HOUSED, http: 409, condition: "A household member belongs to another tenancy in ACTIVE or NOTICE" }
  - { id: ERR_EDUCATION_REFERRAL_REQUIRES_MINOR, http: 422, condition: "EDUCATION referral requires household minor_count >= 1" }
  - { id: ERR_AG_WORK_NOT_VERIFIED, http: 422, condition: "ELIGIBLE verification requires ag_work_verified = true" }
  - { id: ERR_WORK_ORDER_NOT_VERIFIED, http: 409, condition: "DAMAGE charge requires the source work order in VERIFIED or CLOSED" }
  - { id: ERR_LINKED_WORK_ORDERS_OPEN, http: 409, condition: "Complaint resolution blocked by non-terminal linked work orders" }
  - { id: ERR_UNRESOLVED_CRITICAL_FINDINGS, http: 409, condition: "Cure certification blocked: open_critical_count > 0" }
  - { id: ERR_ACTIVE_TENANCIES_REMAIN, http: 409, condition: "Closure/decommission blocked by tenancies in PENDING_MOVE_IN, ACTIVE, or NOTICE" }
  - { id: ERR_OPEN_WORK_ORDERS_REMAIN, http: 409, condition: "Closure/re-inspection blocked by non-terminal work orders" }
  - { id: ERR_NO_ACTIVE_DEDUCTION_AUTHORIZATION, http: 409, condition: "Payment requires an ACTIVE DeductionAuthorization on the household" }
  - { id: ERR_NOTHING_TO_COLLECT, http: 422, condition: "Capped deduction computes to <= 0 cents (covered balance zero or wage floor consumes gross)" }
  - { id: ERR_ENTRY_ALREADY_VOIDED, http: 409, condition: "Void target is not POSTED" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Verifier/certifier X-User-ID equals the completer/issuer X-User-ID" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: OperatorAdmin
    description: "Housing operator administrator: sites, buildings, units, season windows, ledger posting/voids, clock"
    identity: opaque
    exclusive_operations:
      - "POST /housing-sites, PUT /housing-sites/{id}, POST /season-windows, DELETE /season-windows/{id}"
      - "POST /buildings, POST /housing-units, PUT /housing-units/{id}"
      - "POST /charge-ledger-entries, POST /charge-ledger-entries/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /work-orders (with SiteManager, MaintenanceLead)"
      - "all GET endpoints"

  - name: SiteManager
    description: "On-site manager: pest treatments, complaint handling, work order verification/closure"
    identity: opaque
    exclusive_operations:
      - "POST /pest-treatments, PUT /pest-treatments/{id}"
      - "PUT /complaints/{id}"
      - "PUT /work-orders/{id} for VERIFIED | REOPENED | CLOSED (and CANCELLED shared with MaintenanceLead)"
    shared_operations:
      - "POST /work-orders (with OperatorAdmin, MaintenanceLead)"
      - "all GET endpoints"

  - name: MaintenanceLead
    description: "Maintenance supervisor: work order triage, assignment, execution, completion"
    identity: opaque
    exclusive_operations:
      - "PUT /work-orders/{id} for TRIAGED | ASSIGNED | IN_PROGRESS | COMPLETED (and CANCELLED shared with SiteManager)"
    shared_operations:
      - "POST /work-orders (with OperatorAdmin, SiteManager)"
      - "all GET endpoints"

  - name: ComplianceInspector
    description: "Compliance inspector: pre-occupancy certifications and regulatory inspections; segregation of duties enforced on cure certification"
    identity: opaque
    exclusive_operations:
      - "POST /unit-certifications, PUT /unit-certifications/{id}"
      - "POST /regulatory-inspections, PUT /regulatory-inspections/{id}"
    shared_operations:
      - "all GET endpoints"

  - name: IntakeCoordinator
    description: "Resident intake coordinator: households, members, eligibility, tenancies, authorizations, payments, referrals"
    identity: opaque
    exclusive_operations:
      - "POST /households, PUT /households/{id}, POST /household-members"
      - "POST /deduction-authorizations, PUT /deduction-authorizations/{id}"
      - "POST /tenancies, POST /tenancies/{id}/payments"
      - "POST /service-referrals, PUT /service-referrals/{id}"
      - "PUT /tenancies/{id} for ACTIVE | TERMINATED | CANCELLED"
    shared_operations:
      - "PUT /tenancies/{id} status=NOTICE (with Resident)"
      - "POST /complaints (with Resident)"
      - "all GET endpoints"

  - name: Resident
    description: "Head of household acting for their own household; X-User-ID equals the Household.id"
    identity: "entity_backed:Household"
    exclusive_operations: []
    shared_operations:
      - "POST /complaints for own tenancy only (with IntakeCoordinator)"
      - "PUT /tenancies/{id} status=NOTICE for own tenancy only (with IntakeCoordinator)"
      - "all GET endpoints"
