          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Policy P1 of Vantiq Bio Inc, period 2026-09-01 to 2027-09-01, bound then cancelled effective 2026-08-15 with return_premium_usd 236,468.57."
            - "Policy P2 of the same insured on a second submission, identical period, left in INCEPTED with no ops run, so its coverage_status is still an accepted one for claim notices."
            - "The logical clock is then moved to 2027-09-01T00:00:00Z, which is exactly period_end for both policies and therefore outside the half-open notice window."
