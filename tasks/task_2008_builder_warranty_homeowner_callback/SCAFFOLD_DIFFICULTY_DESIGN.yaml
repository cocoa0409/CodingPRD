              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Running toilet" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 100000, defect_responsibility: "SUBCONTRACTOR" }
              as: WarrantyRep
              captures: { wo_id: $.data.id }
            - call: "POST /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: WarrantyRep
              captures: { cb_id: $.data.id, cb_prov: $.data.provisional_amount_cents }
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_cost_cents: 25000 }
              as: TradePartner
              as_user_id: "${tp_id}"
            - call: "GET /chargebacks/${cb_id}"
              as: WarrantyRep
              captures: { cb_status: $.data.status, cb_final: $.data.final_amount_cents, cb_outstanding: $.data.outstanding_cents }
          assert:
            - "cb_prov == 82500 (provisional from the 100000 estimate)"
            - "cb_final == 0 (max(0, 25000 - 25000) + fee on 0) — cost AT the deductible produces exactly zero"
            - "cb_status == VOID and cb_outstanding == 0 (auto-void on zero final)"
            - "a subsequent POST /chargebacks/${cb_id}/payments of any amount is rejected ERR_ALREADY_TERMINAL"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_requires_approved_request
        grounds:
          - state_machines.ServiceRequest.RECEIVED_to_APPROVED
          - state_machines.ServiceRequest.APPROVED_to_IN_SERVICE
          - validations[priority=13]
        distinguishing_aspect: |
          Entity pair WorkOrder -> ServiceRequest: POST /work-orders is only valid while the
