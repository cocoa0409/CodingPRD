    roles: [AssociationStaff, Member, GrievanceMember, HearingPanelist]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/mls/associations/{id}/offices/{officeId}"
    description: "Get office"
    roles: [AssociationStaff, Member]
    code: 200
    input: []
    output: Office
    side_effects: []
  - method: GET
    path: "/mls/associations/{id}/offices/{officeId}/listings/{listingId}"
    description: "Get listing"
    roles: [AssociationStaff, Member, HearingPanelist]
    code: 200
    input: []
    output: Listing
    side_effects: []
  - method: GET
    path: "/mls/associations/{id}/offices/{officeId}/listings/{listingId}/status-changes"
    description: "List status changes of a listing (audit trail)"
    roles: [AssociationStaff, Member, HearingPanelist]
    code: 200
    input: []
    output: StatusChange[]
    side_effects: []
  - method: GET
    path: "/mls/associations/{id}/citations/{citationId}"
    description: "Get citation"
    roles: [AssociationStaff, Member]
    code: 200
    input: []
    output: Citation
    side_effects: []
  - method: GET
    path: "/mls/associations/{id}/dues-periods/{periodId}"
    description: "Get dues period"
    roles: [AssociationStaff, Member]
    code: 200
    input: []
    output: DuesPeriod
    side_effects: []
  - method: GET
    path: "/mls/associations/{id}/dues-invoices/{invoiceId}"
    description: "Get dues invoice"
    roles: [AssociationStaff, Member]
    code: 200
    input: []
    output: DuesInvoice
    side_effects: []
  - method: GET
    path: "/mls/associations/{id}/ethics-cases/{caseId}"
    description: "Get ethics case"
    roles: [AssociationStaff, GrievanceMember, HearingPanelist, Member]
    code: 200
    input: []
    output: EthicsCase
    side_effects: []
  - method: GET
    path: "/mls/associations/{id}/arbitration-cases/{caseId}"
    description: "Get arbitration case"
    roles: [AssociationStaff, Member, HearingPanelist]
    code: 200
    input: []
    output: ArbitrationCase
    side_effects: []
  - method: GET
    path: "/mls/associations/{id}/hearing-panels/{panelId}"
    description: "Get hearing panel"
    roles: [AssociationStaff, HearingPanelist, GrievanceMember]
    code: 200
    input: []
    output: HearingPanel
    side_effects: []
  - method: GET
    path: "/mls/associations/{id}/data-licenses/{licenseId}"
    description: "Get data license"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: DataLicense
    side_effects: []

  # --- Members / Offices ---
  - method: POST
    path: "/mls/associations/{id}/members"
    description: "Register member (starts ACTIVE with mls_access ENABLED)"
    roles: [AssociationStaff]
    code: 201
    input: [member_nr, full_name]
    output: Member
    side_effects: ["membership_state=ACTIVE, mls_access_state=ENABLED, sanction_credit_balance_cents=0, strikes_12m=0"]
  - method: POST
    path: "/mls/associations/{id}/members/{memberId}/terminate"
    description: "Terminate a member suspended >= 90 days"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: Member
    side_effects: ["membership_state=TERMINATED", "ACTIVE listings of member -> WITHDRAWN (cascade)"]
  - method: POST
    path: "/mls/associations/{id}/offices"
    description: "Create office"
    roles: [AssociationStaff]
    code: 201
    input: [office_code, broker_member_id]
    output: Office
    side_effects: ["status=ACTIVE"]
  - method: POST
    path: "/mls/associations/{id}/offices/{officeId}/close"
    description: "Close office (no open listings)"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: Office
    side_effects: ["status=CLOSED"]

  # --- Dues ---
  - method: POST
    path: "/mls/associations/{id}/dues-periods"
    description: "Create dues period"
    roles: [AssociationStaff]
    code: 201
    input: [year, period_start_date, due_date, grace_end_date, amount_cents]
    output: DuesPeriod
    side_effects: ["status=OPEN"]
  - method: POST
    path: "/mls/associations/{id}/dues-periods/{periodId}/bill"
    description: "Bill all ACTIVE members (OCC-guarded on period version)"
    roles: [AssociationStaff]
    code: 200
    input: [expected_dues_period_version]
    output: DuesPeriod
    side_effects: ["creates DuesInvoice per ACTIVE member per calculations.dues_invoice_amounts", "debits sanction credits", "status=BILLED", "increments DuesPeriod.version by 1"]
  - method: POST
    path: "/mls/associations/{id}/dues-periods/{periodId}/reconcile"
    description: "Reconcile period: suspend members with PENDING invoices (requires now > grace_end_date)"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: DuesPeriod
    side_effects: ["delinquent members -> SUSPENDED with cascade", "status=RECONCILED", "increments DuesPeriod.version by 1"]
  - method: POST
    path: "/mls/associations/{id}/dues-invoices/{invoiceId}/pay"
    description: "Pay own invoice; tender_cents must equal amount_due_cents"
    roles: [Member]
    code: 200
    input: [tender_cents]
    output: DuesInvoice
    side_effects: ["status=PAID, paid_at set", "last-invoice reinstatement chain", "increments DuesInvoice.version by 1"]
  - method: POST
    path: "/mls/associations/{id}/dues-invoices/{invoiceId}/waive"
    description: "Waive an invoice (no credit refund)"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: DuesInvoice
    side_effects: ["status=WAIVED", "reinstatement chain if zero PENDING remain", "increments DuesInvoice.version by 1"]

  # --- Listings ---
  - method: POST
    path: "/mls/associations/{id}/offices/{officeId}/listings"
    description: "Create listing in DRAFT"
    roles: [Member]
    code: 201
    input: [listing_member_id, mls_number, property_address, list_price_cents, "public_marketing_at?", "offer_comp_cents?"]
    output: Listing
    side_effects: ["status=DRAFT, accuracy_flag=CLEAN"]
  - method: POST
    path: "/mls/associations/{id}/offices/{officeId}/listings/{listingId}/activate"
    description: "Activate listing (DRAFT or WITHDRAWN -> ACTIVE); runs policy-revision selector and clear-coop audit"
    roles: [Member]
    code: 200
    input: []
    output: Listing
    side_effects: ["status=ACTIVE, activated_at set, policy_revision_id selected", "clear-coop auto-citation when late", "StatusChange recorded", "increments Listing.version by 1"]
  - method: POST
    path: "/mls/associations/{id}/offices/{officeId}/listings/{listingId}/status"
    description: "Change listing status (to_status in {PENDING, SOLD, WITHDRAWN, CANCELLED} per state machine); business_effective_at drives lateness audit"
    roles: [Member]
    code: 200
    input: [to_status, business_effective_at]
    output: Listing
    side_effects: ["StatusChange recorded with late_by_hours", "LATE_STATUS auto-citation + FLAGGED when late", "increments Listing.version by 1"]

  # --- Citations / fines ---
  - method: POST
    path: "/mls/associations/{id}/citations"
    description: "Issue citation (staff)"
    roles: [AssociationStaff]
    code: 201
    input: [member_id, rule_code, "listing_id?"]
    output: Citation
    side_effects: ["fine_amount_cents looked up via calculations.citation_fine_lookup", "status=OPEN, assessed_at set"]
  - method: POST
    path: "/mls/associations/{id}/citations/{citationId}/pay"
    description: "Pay citation fine (credits auto-apply; tender covers remainder)"
    roles: [Member]
    code: 200
    input: [tender_cents]
    output: Citation
    side_effects: ["status=PAID", "credit accrual with cap check", "strikes_12m recompute", "listing unflag chain", "increments Citation.version by 1"]
  - method: POST
    path: "/mls/associations/{id}/citations/{citationId}/request-hearing"
    description: "Request hearing within 20 days of assessed_at"
    roles: [Member]
    code: 200
    input: []
    output: Citation
    side_effects: ["status=HEARING_PENDING, hearing_requested=true", "increments Citation.version by 1"]
  - method: POST
    path: "/mls/associations/{id}/citations/{citationId}/donate-credit"
    description: "Top up own sanction credit balance by amount_cents; rejected with ERR_CREDIT_CAP_EXCEEDED if the result would exceed the association cap (landing exactly at the cap is allowed)"
    roles: [Member]
    code: 200
    input: [amount_cents]
    output: Citation
    side_effects: ["member.sanction_credit_balance_cents += amount_cents", "increments Member.version by 1"]
  - method: POST
    path: "/mls/associations/{id}/fine-schedules"
    description: "Create fine schedule row (half-open non-overlap enforced)"
    roles: [AssociationStaff]
    code: 201
    input: [rule_code, fine_amount_cents, effective_from, "effective_to?"]
    output: FineSchedule
    side_effects: ["status=ACTIVE"]
  - method: POST
    path: "/mls/associations/{id}/fine-schedules/{scheduleId}/retire"
    description: "Retire a schedule row (last-row retirement forbidden)"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: FineSchedule
    side_effects: ["status=RETIRED", "increments FineSchedule.version by 1"]

  # --- Ethics ---
  - method: POST
    path: "/mls/associations/{id}/ethics-cases"
    description: "File ethics complaint (auto-enters GRIEVANCE_SCREENING)"
    roles: [Member]
    code: 201
    input: [respondent_member_id, article_code]
    output: EthicsCase
    side_effects: ["status=GRIEVANCE_SCREENING, grievance_review_due_at = filed_at + 45d"]
  - method: POST
    path: "/mls/associations/{id}/ethics-cases/{caseId}/screen"
    description: "Grievance screening (outcome DISMISSED | FORWARDED); screener must not be a party"
    roles: [GrievanceMember]
    code: 200
    input: [outcome]
    output: EthicsCase
    side_effects: ["status -> DISMISSED | HEARING_SCHEDULED", "increments EthicsCase.version by 1"]
  - method: POST
    path: "/mls/associations/{id}/ethics-cases/{caseId}/appeal"
    description: "Respondent appeals within 20 days of ruling"
    roles: [Member]
    code: 200
    input: []
    output: EthicsCase
    side_effects: ["status=APPEALED", "increments EthicsCase.version by 1"]
  - method: POST
    path: "/mls/associations/{id}/ethics-cases/{caseId}/appeal-ruling"
    description: "Appeal ruling (ruling member must not be party nor original panelist)"
    roles: [GrievanceMember]
    code: 200
    input: []
    output: EthicsCase
    side_effects: ["status=FINAL", "increments EthicsCase.version by 1"]

  # --- Arbitration ---
  - method: POST
    path: "/mls/associations/{id}/arbitration-cases"
    description: "File commission dispute (listing must be SOLD; filing window = closing + 180d)"
    roles: [Member]
    code: 201
    input: [respondent_member_id, listing_id, claim_amount_cents]
    output: ArbitrationCase
    side_effects: ["status=MEDIATION_OFFERED"]
  - method: POST
    path: "/mls/associations/{id}/arbitration-cases/{caseId}/mediation-outcome"
    description: "Record mediation outcome (SETTLED -> MEDIATED terminal | DECLINED -> ARBITRATION_SCHEDULED)"
    roles: [AssociationStaff]
    code: 200
    input: [outcome]
    output: ArbitrationCase
    side_effects: ["status transition per outcome", "increments ArbitrationCase.version by 1"]

  # --- Hearing panels ---
  - method: POST
    path: "/mls/associations/{id}/hearing-panels"
    description: "Convene panel for a CITATION (HEARING_PENDING) | ETHICS (HEARING_SCHEDULED) | ARBITRATION (ARBITRATION_SCHEDULED) case; runs panel selector"
    roles: [AssociationStaff]
    code: 201
    input: [case_type, case_id]
    output: HearingPanel
    side_effects: ["selected_member_ids per calculations.hearing_panel_selection", "status=CONVENED, convene_at set"]
  - method: POST
    path: "/mls/associations/{id}/hearing-panels/{panelId}/hold-hearing"
    description: "Hold hearing (panelist only); arbitration requires factor_scores"
    roles: [HearingPanelist]
    code: 200
    input: ["factor_scores?"]
    output: HearingPanel
    side_effects: ["status=HEARING_HELD", "linked case -> HEARD (ethics/arbitration)", "factor scores stored on arbitration case", "increments HearingPanel.version by 1"]
  - method: POST
    path: "/mls/associations/{id}/hearing-panels/{panelId}/rule"
    description: "Rule on the case (different panelist than hold-hearing); decision UPHOLD | OVERTURN"
    roles: [HearingPanelist]
    code: 200
    input: [decision]
    output: HearingPanel
    side_effects: ["status=DECIDED", "citation PAID|ESCALATED|WAIVED branch + credit/strikes/unflag chains", "ethics sanction chain", "arbitration award chain", "increments HearingPanel.version by 1"]

  # --- Data licensing ---
  - method: POST
    path: "/mls/associations/{id}/data-licenses"
    description: "Create data license (PENDING)"
    roles: [AssociationStaff]
    code: 201
    input: [licensee_name, scope, display_ruleset_version, listing_field_allowlist]
    output: DataLicense
    side_effects: ["status=PENDING, feed_sync_state=STALE"]
  - method: POST
    path: "/mls/associations/{id}/data-licenses/{licenseId}/activate"
    description: "Activate license (ruleset must match)"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: DataLicense
    side_effects: ["status=ACTIVE, feed_sync_state=STALE", "increments DataLicense.version by 1"]
  - method: POST
    path: "/mls/associations/{id}/data-licenses/{licenseId}/sync-feed"
    description: "Sync feed; returns projected listing payload per scope variant"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: { projected_listing_count: integer, comp_fields_stripped: boolean, feed_sync_state: string }
    side_effects: ["feed_sync_state=CURRENT on success"]
  - method: POST
    path: "/mls/associations/{id}/data-licenses/{licenseId}/audit-feed"
    description: "Feed compliance audit; on violation suspends license and auto-cites the deterministic broker"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: { violation_found: boolean, auto_citation_id: string }
    side_effects: ["on violation: status=SUSPENDED, last_audit_at set, FEED_ABUSE citation created"]
  - method: POST
    path: "/mls/associations/{id}/data-licenses/{licenseId}/cure"
    description: "Cure a suspended license within 30 days of audit"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: DataLicense
    side_effects: ["status=ACTIVE, feed_sync_state=STALE"]
  - method: POST
    path: "/mls/associations/{id}/data-licenses/{licenseId}/terminate"
    description: "Terminate license"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: DataLicense
    side_effects: ["status=TERMINATED"]

  # --- Policy revisions ---
  - method: POST
    path: "/mls/associations/{id}/policy-revisions"
    description: "Schedule policy revision (OCC-guarded on association version)"
    roles: [AssociationStaff]
    code: 201
    input: [revision_code, effective_at, comp_display_mode, expected_association_version]
    output: PolicyRevision
    side_effects: ["status=SCHEDULED", "increments Association.version by 1"]
  - method: GET
    path: "/mls/associations/{id}/policy-revisions/{revisionId}"
    description: "Get policy revision"
    roles: [AssociationStaff, Member]
    code: 200
    input: []
    output: PolicyRevision
    side_effects: []

  # --- Consolidation ---
  - method: POST
    path: "/mls/associations/{id}/consolidations"
    description: "Schedule consolidation (path association = survivor)"
    roles: [AssociationStaff]
    code: 201
    input: [absorbed_association_id, effective_at]
    output: ConsolidationEvent
    side_effects: ["status=SCHEDULED", "absorbed association consolidation_state=MERGING"]
  - method: POST
    path: "/mls/associations/{id}/consolidations/{eventId}/execute"
    description: "Execute consolidation at/after effective_at"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: ConsolidationEvent
    side_effects: ["status=EXECUTED", "absorbed association MERGED", "members re-pointed", "absorbed ACTIVE licenses TERMINATED"]
  - method: POST
    path: "/mls/associations/{id}/consolidations/{eventId}/cancel"
    description: "Cancel scheduled consolidation before effective_at"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: ConsolidationEvent
    side_effects: ["status=CANCELLED", "absorbed association consolidation_state=ACTIVE"]

  # --- Compliance checkpoint ---
  - method: POST
    path: "/mls/associations/{id}/run-compliance-checkpoint"
    description: "Ops-run checkpoint: expires listings ACTIVE > 365 days; re-derives license compliance posture"
    roles: [AssociationStaff]
    code: 200
    input: []
    output: { expired_listing_count: integer }
    side_effects: ["stale ACTIVE listings -> EXPIRED with StatusChange records"]
  - method: POST
    path: "/mls/associations/{id}/members/{memberId}/credit-adjustments"
    description: "Initial credit seeding adjustment (e.g. goodwill settlement credits); requires a reason note; capped by the association sanction_credit_cap_cents"
    roles: [AssociationStaff]
    code: 201
    input: [amount_cents, note]
    output: Member
    side_effects: ["member.sanction_credit_balance_cents += amount_cents (ERR_CREDIT_CAP_EXCEEDED above cap)", "increments Member.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_MEMBER_MISMATCH, http: 403, condition: "Entity-backed role acting on a resource owned by a different member id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource missing or nested under wrong parent scope" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a legal source state for the requested transition" }
  - { id: ERR_ASSOCIATION_MERGED, http: 409, condition: "Mutation attempted under a MERGED association (or new consolidation under MERGING)" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Listing member SUSPENDED or mls_access DISABLED on activation/status-change" }
  - { id: ERR_SCREENING_CONFLICT, http: 409, condition: "Grievance screener is complainant or respondent" }
  - { id: ERR_APPEAL_CONFLICT, http: 409, condition: "Appeal ruling member is a party or original panelist" }
  - { id: ERR_PANEL_SOLE_ACTOR, http: 409, condition: "Same panelist triggers both hold-hearing and rule" }
  - { id: ERR_COMP_DISPLAY_PROHIBITED, http: 409, condition: "offer_comp_cents > 0 while governing revision comp_display_mode == COMP_DISPLAY_OFF" }
  - { id: ERR_RULESET_MISMATCH, http: 409, condition: "License display_ruleset_version != association ruleset_version at activation" }
  - { id: ERR_LISTING_FLAGGED, http: 409, condition: "WITHDRAWN/CANCELLED attempted on accuracy_flag == FLAGGED listing" }
  - { id: ERR_HEARING_WINDOW_CLOSED, http: 409, condition: "Hearing requested after assessed_at + 20 days" }
  - { id: ERR_SCREENING_OVERDUE, http: 409, condition: "Screening attempted after grievance_review_due_at" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "Appeal filed after ruling + 20 days" }
  - { id: ERR_CURE_WINDOW_CLOSED, http: 409, condition: "License cure attempted after audit + 30 days" }
  - { id: ERR_ARBITRATION_WINDOW_CLOSED, http: 409, condition: "Arbitration filed after listing closing + 180 days" }
  - { id: ERR_CONSOLIDATION_NOT_DUE, http: 409, condition: "Execute before effective_at" }
  - { id: ERR_CREDIT_CAP_EXCEEDED, http: 409, condition: "Credit accrual would push sanction_credit_balance_cents above association cap" }
  - { id: ERR_TENDER_MISMATCH, http: 409, condition: "tender_cents != computed amount due after auto-applied credits" }
  - { id: ERR_CROSS_ASSOCIATION_REFERENCE, http: 422, condition: "FK payload references an entity of a different association (member/office/listing/panel mismatch)" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "member_nr / mls_number / licensee_name / office_code / revision_code uniqueness violation" }
  - { id: ERR_SCHEDULE_OVERLAP, http: 409, condition: "FineSchedule row overlaps an existing ACTIVE row for same (association, rule_code) under half-open semantics" }
  - { id: ERR_LAST_FINE_SCHEDULE, http: 409, condition: "Retiring the last ACTIVE FineSchedule row for (association, rule_code)" }
  - { id: ERR_PANEL_POOL_EXHAUSTED, http: 409, condition: "Fewer than 3 eligible panelists after exclusions" }
  - { id: ERR_FACTOR_SCORE_INVALID, http: 409, condition: "Arbitration hold-hearing missing a required factor key or value outside 0..10" }
  - { id: ERR_NO_FINE_SCHEDULE, http: 409, condition: "No ACTIVE FineSchedule row covers the citation's assessed_at for its rule_code" }
  - { id: ERR_POLICY_REVISION_MISSING, http: 409, condition: "Listing activation with no ACTIVE PolicyRevision effective_at <= activated_at" }
  - { id: ERR_OFFICE_HAS_OPEN_LISTINGS, http: 409, condition: "Office close with listings in DRAFT/ACTIVE/PENDING" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload, missing required field, invalid enum, out-of-range value" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AssociationStaff
    description: "Association staff operator; administers dues, fines, schedules, licenses, consolidations, panels"
    identity: "opaque"
    exclusive_operations:
      - "POST /mls/associations"
      - "POST /mls/_clock/set_current_utc, /mls/_clock/advance_day"
      - "members/offices/dues-periods/fine-schedules/policy-revisions/data-licenses/consolidations create+action endpoints"
      - "citations create; invoices waive; mediation-outcome; terminate member; close office; audit/cure/terminate license; run-compliance-checkpoint"
    shared_operations:
      - "GET endpoints (all association-scoped reads)"
  - name: Member
    description: "REALTOR member; owns listings, pays own invoices/citations, files ethics/arbitration cases"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "listings create/activate/status (as listing_member_id)"
      - "dues-invoices pay (own), citations pay + request-hearing (own)"
      - "ethics-cases create + appeal (as party), arbitration-cases create (as complainant)"
    shared_operations:
      - "GET endpoints (association reads)"
  - name: GrievanceMember
    description: "Member serving on grievance committee; screens ethics complaints and rules on appeals; must not be a party"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "ethics-cases screen"
      - "ethics-cases appeal-ruling"
    shared_operations:
      - "GET endpoints (association reads)"
  - name: HearingPanelist
    description: "Member seated on a hearing panel; hold-hearing and rule are segregated between distinct panelists"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "hearing-panels hold-hearing"
      - "hearing-panels rule"
    shared_operations:
      - "GET endpoints (association reads)"
