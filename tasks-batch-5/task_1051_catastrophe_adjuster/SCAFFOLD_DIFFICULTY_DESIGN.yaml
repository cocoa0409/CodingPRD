  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: qa_revision_cascade_depth3
        grounds:
          - state_machines.Report.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.Inspection.COMPLETED_to_REOPENED
          - state_machines.Assignment.WORK_COMPLETE_to_FIELDWORK
          - state_machines.Claim.UNDER_REVIEW_to_IN_PROGRESS
        distinguishing_aspect: |
          Depth-3 chain from a QA revision: Report REVISION_REQUESTED -> (causes) Inspection
          REOPENED -> (causes) Assignment FIELDWORK -> (causes) Claim IN_PROGRESS; each hop is
          caused by the prior mutation, not by the original action.
        test_recipe:
          setup:
            - "Field adjuster A, QA reviewer B; report SUBMITTED (Inspection COMPLETED, Assignment WORK_COMPLETE, Claim UNDER_REVIEW)"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A7", email: "a7@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /adjusters", payload: { full_name: "B7", email: "b7@x.com", adjuster_type: "STAFF", home_state: "FL" }, as: LicensingAdmin, captures: { qa_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-7", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
