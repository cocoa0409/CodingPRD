scaffold_corner_design:
  - section: entities
    instances:
      - name: create_driver_requires_all_declared_fields
        claim_type: required_fields
        grounds:
          - entities.Driver.fields.platform_driver_id
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=4]
        distinguishing_aspect: |
          Omitting platform_driver_id from POST /program/drivers is refused with
          ERR_INVALID_REQUEST and status 400 rather than creating a driver with a blank
          platform identity.
        test_recipe:
          setup: ["empty database; logical clock at its default 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_INVALID_REQUEST with status 400"
            - "GET /program/drivers returns total_count 0"

      - name: create_driver_ignores_system_fields
        claim_type: system_fields
        grounds:
          - entities.Driver.fields.eligibility_status
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          eligibility_status is a computed field with default PENDING, so sending it in
          the create payload is refused as an undeclared input rather than silently applied.
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1", eligibility_status: "ELIGIBLE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_INVALID_REQUEST with status 400"
            - "a subsequent create without the computed field yields Driver.eligibility_status == PENDING"

      - name: create_agreement_requires_existing_foreign_keys
        claim_type: parent_relationships
        grounds:
          - entities.RentalAgreement.fields.enrollment_id
          - entities.RentalAgreement.fields.vehicle_id
          - errors[ERR_REFERENCED_ENTITY_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: |
          A body carrying an enrollment id that resolves but a vehicle id that does not
          is refused with ERR_REFERENCED_ENTITY_NOT_FOUND at status 404, and the existence
          check runs before the availability check so no ERR_VEHICLE_NOT_AVAILABLE is raised.
        test_recipe:
          setup: ["one driver and one verified enrollment exist; no vehicles exist"]
          setup_api_calls:
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "3f7a1c2e-9b4d-4e8a-8c1f-2d5e6a7b8c9d", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: true, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_REFERENCED_ENTITY_NOT_FOUND with status 404, not ERR_VEHICLE_NOT_AVAILABLE"
            - "GET /program/agreements returns total_count 0"

      - name: get_vehicle_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: |
          A path id that names no ProgramVehicle is refused with ERR_NOT_FOUND at status
          404, and the envelope carries response_type error.
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /program/vehicles/3f7a1c2e-9b4d-4e8a-8c1f-2d5e6a7b8c9d"
              payload: {}
              as: FleetOpsAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_NOT_FOUND with status 404"
            - "the response body has response_type error"

      - name: list_vehicles_paginates_with_total_count
        claim_type: listing
        grounds:
          - entities.ProgramVehicle.fields.region_code
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /program/vehicles with limit 2 over three seeded vehicles returns two rows,
          total_count 3 and has_more true, so the pagination envelope is exercised on a
          real collection rather than an empty one.
        test_recipe:
          setup: ["three program vehicles admitted in region CA"]
          setup_api_calls:
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004352", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 40000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v1: $.data.id }
            - call: "POST /program/vehicles"
              payload: { vin: "2HGES16575H606231", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 61000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v2: $.data.id }
            - call: "POST /program/vehicles"
              payload: { vin: "5TFAX5GN2GX123456", model_name: "Pilot", model_year: 2023, vehicle_class: "XL", odometer_miles: 22000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v3: $.data.id }
          trigger:
            - call: "GET /program/vehicles"
              payload: { region_code: "CA", limit: 2, offset: 0 }
              as: FleetOpsAgent
              captures: { page_first_id: "$.data[0].id" }
          assert:
            - "the page returns 2 rows and total_count 3"
            - "has_more is true on the first page and false on offset 2"
            - "every returned row has region_code CA"

  - section: state_machines
    instances:
      - name: activate_agreement_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.RentalAgreement.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
          - validations[priority=7]
        distinguishing_aspect: |
          POST /program/agreements/{id}/activate has no declared from ACTIVE edge, so a
          second activate on an already-active agreement is refused with ERR_INVALID_STATE
          and the vehicle is not double-assigned.
        test_recipe:
          setup: ["one ACTIVE agreement on an assigned vehicle"]
          setup_api_calls:
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004352", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 40000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v_id: $.data.id }
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${v_id}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: true, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { a_id: $.data.id }
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: FleetOpsAgent
          trigger:
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: FleetOpsAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_INVALID_STATE with status 409"
            - "RentalAgreement.${a_id}.agreement_status is still ACTIVE"
            - "ProgramVehicle.${v_id}.assigned_driver_id is still ${d_id}"

      - name: complete_terminal_agreement_is_refused
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RentalAgreement.terminal_states
          - errors[ERR_INVALID_STATE]
          - state_machines.RentalAgreement.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          COMPLETED is a terminal agreement state, so neither POST
          /program/agreements/{id}/complete nor POST /program/agreements/{id}/activate is
          available from it and the refusal names ERR_INVALID_STATE.
        test_recipe:
          setup: ["one COMPLETED agreement whose vehicle returned to the available pool"]
          setup_api_calls:
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004352", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 40000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v_id: $.data.id }
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${v_id}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: true, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { a_id: $.data.id }
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: FleetOpsAgent
            - call: "POST /program/agreements/${a_id}/complete"
              payload: {}
              as: FleetOpsAgent
          trigger:
            - call: "POST /program/agreements/${a_id}/complete"
              payload: {}
              as: FleetOpsAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_INVALID_STATE with status 409"
            - "RentalAgreement.${a_id}.agreement_status is still COMPLETED"
            - "ProgramVehicle.${v_id}.vehicle_status is still AVAILABLE"

      - name: issue_loaner_before_start_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.MaintenanceEvent.IN_PROGRESS_to_LOANER_ISSUED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A maintenance event still in REPORTED has no declared edge to LOANER_ISSUED, so
          issuing a loaner before the work starts is refused with ERR_INVALID_STATE rather
          than assigning a vehicle.
        test_recipe:
          setup: ["one ACTIVE agreement whose unit is under a REPORTED 30-hour repair"]
          setup_api_calls:
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004352", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 40000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v_id: $.data.id }
            - call: "POST /program/vehicles"
              payload: { vin: "2HGES16575H606231", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 61000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { loaner_id: $.data.id }
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${v_id}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: true, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { a_id: $.data.id }
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: FleetOpsAgent
            - call: "GET /program/vehicles/${v_id}"
              payload: {}
              as: FleetOpsAgent
              captures: { v_v: $.data.version }
            - call: "POST /program/maintenance-events"
              payload: { agreement_id: "${a_id}", vehicle_id: "${v_id}", event_type: "UNSCHEDULED_REPAIR", odometer_at_service: 41200, downtime_hours: 30, damage_liability_cents: 0, expected_vehicle_version: "${v_v}" }
              as: FleetOpsAgent
              captures: { me_id: $.data.id }
          trigger:
            - call: "POST /program/maintenance-events/${me_id}/issue-loaner"
              payload: {}
              as: FleetOpsAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_INVALID_STATE with status 409"
            - "MaintenanceEvent.${me_id}.event_status is still REPORTED and loaner_vehicle_id is null"
            - "ProgramVehicle.${loaner_id}.vehicle_status is still AVAILABLE"

      - name: verify_unverified_enrollment_twice_is_idempotent_refused
        claim_type: idempotency
        grounds:
          - state_machines.DriverEnrollment.PENDING_VERIFICATION_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Verification is a one-shot PENDING_VERIFICATION to ACTIVE edge, so replaying the
          same verify call on an ACTIVE enrollment is refused with ERR_INVALID_STATE instead
          of restamping verified_at.
        test_recipe:
          setup: ["one eligible driver with an ACTIVE enrollment already verified"]
          setup_api_calls:
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_INVALID_STATE with status 409"
            - "DriverEnrollment.${e_id}.enrollment_status is still ACTIVE"

  - section: validations
    instances:
      - name: plain_driver_cannot_activate_agreement
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - roles[ComplianceOfficer].identity
          - roles[FleetOpsAgent].identity
        distinguishing_aspect: |
          POST /program/agreements/{id}/activate is not in the Driver role's operation set,
          so a request bearing a well-formed Driver role header is refused with
          ERR_UNAUTHORIZED at status 403 even though the driver owns the agreement.
        test_recipe:
          setup: ["one DRAFT agreement belonging to an eligible driver"]
          setup_api_calls:
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004352", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 40000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v_id: $.data.id }
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${v_id}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: true, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_UNAUTHORIZED with status 403"
            - "RentalAgreement.${a_id}.agreement_status is still DRAFT"

      - name: fleet_ops_cannot_decide_enrollment
        claim_type: violation_to_error
        grounds:
          - roles[FleetOpsAgent].exclusive_operations
          - roles[ComplianceOfficer].exclusive_operations
          - validations[priority=1]
        distinguishing_aspect: |
          Deciding an enrollment outcome belongs to ComplianceOfficer alone, so the same
          request bearing a FleetOpsAgent role is refused with ERR_UNAUTHORIZED at status
          403 while the identical request under ComplianceOfficer returns 200.
        test_recipe:
          setup: ["one driver and one PENDING_VERIFICATION enrollment with decision APPROVED"]
          setup_api_calls:
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: FleetOpsAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_UNAUTHORIZED with status 403"
            - "DriverEnrollment.${e_id}.enrollment_status is still PENDING_VERIFICATION"
            - "the identical request sent as ComplianceOfficer returns 200 and enrollment_status ACTIVE"

      - name: driver_cannot_submit_platform_check
        claim_type: violation_to_error
        grounds:
          - roles[ComplianceOfficer].exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=1]
        distinguishing_aspect: |
          Submitting a unit to the rideshare platform is a ComplianceOfficer operation, so
          a Driver-role request is refused with ERR_UNAUTHORIZED at status 403 even when
          the driver owns the agreement and the unit.
        test_recipe:
          setup: ["one ACTIVE agreement on an assigned STANDARD unit"]
          setup_api_calls:
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004352", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 40000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { v_id: $.data.id }
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${v_id}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: true, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { a_id: $.data.id }
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: FleetOpsAgent
          trigger:
            - call: "POST /program/platform-checks"
              payload: { agreement_id: "${a_id}", vehicle_id: "${v_id}" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_UNAUTHORIZED with status 403"
            - "GET /program/platform-checks returns total_count 0"

      - name: unknown_role_header_is_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: |
          A role that is not declared in the RBAC matrix is refused at the authentication
          layer with ERR_UNAUTHENTICATED at status 401 before any authorization rule runs.
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /program/vehicles"
              payload: {}
              as: "Auditor"
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_UNAUTHENTICATED with status 401, not ERR_UNAUTHORIZED"

      - name: maintainer_normal_update_refused_while_frozen
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_AGREEMENT_FROZEN]
          - state_machines.RentalAgreementPosture.RESTRICTED_to_FROZEN
        distinguishing_aspect: |
          Reporting a maintenance event on a frozen agreement violates both the posture
          rule and the maintenance-window rule, and the posture rule at priority 8 is the
          one that must be reported.
        test_recipe:
          setup: ["one agreement frozen after two lapsed weeks, whose unit is in RECOVERY past the 24-hour cooldown"]
          setup_api_calls:
            - call: "POST /program/drivers"
