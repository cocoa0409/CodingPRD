      - name: theft_chargeback_rounds_up_to_whole_containers_at_list_price
        claim_type: Precision
        grounds:
          - calculations.theft_chargeback
          - calculations.usage_variance_classification
          - endpoints[POST /warewashing/investigation-cases/{case_id}/review]
        distinguishing_aspect: |
          The excess is 40001 ml against a 20000 ml container, so the chargeback must be 3 containers -
          rounding UP on a single millilitre of overrun - and it is priced at the 9600-cent LIST price,
          never at the discounted delivery price the customer actually paid. The figures also come from
          the frozen review, so the delivery's own volume discount is irrelevant to the adjudication.
        test_recipe:
          setup:
            - "One INSTALLED DT-88 placement with a DET-100 dispenser at the 8.00 spec dose; one DEVICE reading gives 100 racks, so expected_consumption_ml is 800."
            - "One 1-unit DET-100 delivery (20000 ml) sits inside the window; opening inventory 30000 ml and ending inventory 9199 ml make actual consumption 40801 ml."
            - "auditor-1 creates, publishes and opens; auditor-2 adjudicates, as segregation of duties requires."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "DT-88", machine_class: "DOOR_TYPE", racks_per_hour: 60, rated_water_l_per_rack: 0.74, rated_kwh_per_rack: 0.41, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 480000, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id, sv1: $.data.version }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-C01", expected_agreement_version: "${agr_v}", initial_cycle_count: 0 }
              as: AccountManager
              captures: { pl_id: $.data.id }
            - call: "POST /warewashing/technicians"
              payload: { name: "Rico Vance", region_code: "NW", certification_level: "L2" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /warewashing/machine-placements/${pl_id}/install"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/dispensers"
              payload: { placement_id: "${pl_id}", product_id: "${det_id}", calibrated_dose_ml_per_rack: 8.00 }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /warewashing/machine-placements/${pl_id}/telemetry-readings"
              payload: { reading_at: "2026-08-01T00:00:00Z", cycle_count_total: 100, wash_temp_f: 160, final_rinse_temp_f: 185, rinse_pressure_psi: 20, source: "DEVICE" }
              as: PlatformAdmin
            - call: "POST /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}", product_id: "${det_id}", delivered_at: "2026-08-01T00:00:00Z", unit_count: 1, expected_site_version: "${sv1}" }
              as: AccountManager
              captures: { del_id: $.data.id, del_qty: $.data.quantity_ml, del_amt: $.data.amount_cents }
          trigger:
            - call: "POST /warewashing/usage-variance-reviews"
              payload: { site_id: "${site_id}", product_id: "${det_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-02T00:00:00Z", basis: "NAMEPLATE", opening_inventory_ml: 30000, ending_inventory_ml: 9199 }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { rev_id: $.data.id, racks: $.data.rack_count_in_period, exp: $.data.expected_consumption_ml, act: $.data.actual_consumption_ml, vpct: $.data.variance_pct, cls: $.data.classification, rstat: $.data.status }
            - call: "POST /warewashing/usage-variance-reviews/${rev_id}/publish"
              payload: {}
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { rstat_2: $.data.status, pub_by: $.data.published_by_user_id }
            - call: "POST /warewashing/investigation-cases"
              payload: { variance_review_id: "${rev_id}", opened_reason: "SUSPECTED_THEFT" }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { case_id: $.data.id, cstat: $.data.case_status, evc: $.data.evidence_item_count, cb_0: $.data.chargeback_cents }
            - call: "POST /warewashing/investigation-cases/${case_id}/submit-for-review"
              payload: { evidence_types: ["DELIVERY_LOG", "INVENTORY_COUNT"] }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { cstat_2: $.data.case_status, evc_2: $.data.evidence_item_count }
            - call: "POST /warewashing/investigation-cases/${case_id}/review"
              payload: { decision: "SUBSTANTIATE", remediation: "CHARGEBACK", finding_note: "Three containers charged back at list price" }
              as: QualityAuditor
              as_user_id: "auditor-2"
              captures: { cstat_3: $.data.case_status, rem: $.data.remediation, cb: $.data.chargeback_cents, rev_by: $.data.reviewed_by_user_id }
            - call: "GET /warewashing/usage-variance-reviews/${rev_id}"
              payload: {}
              as: QualityAuditor
              as_user_id: "auditor-2"
              captures: { rstat_3: $.data.status, exp_after: $.data.expected_consumption_ml }
            - call: "GET /warewashing/dispensers/${disp_id}"
              payload: {}
              as: QualityAuditor
              as_user_id: "auditor-2"
              captures: { dstat: $.data.dispenser_status, dreason: $.data.lockout_reason }
          assert:
            - "${del_qty} == 20000 and ${del_amt} == 9600 - one unit earns no discount"
            - "${racks} == 100, ${exp} == 800 (100 x 8.00), ${act} == 40801 (30000 + 20000 - 9199), ${vpct} == 5000.13 and ${cls} == THEFT_SUSPECT"
            - "${rstat} == DRAFT then ${rstat_2} == PUBLISHED with ${pub_by} == auditor-1"
            - "${cstat} == EVIDENCE_GATHERING with ${evc} == 0 and ${cb_0} == 0; the review is now ESCALATED"
            - "${cstat_2} == PENDING_REVIEW with ${evc_2} == 2"
            - "${cstat_3} == SUBSTANTIATED, ${rem} == CHARGEBACK, ${rev_by} == auditor-2 and ${cb} == 28800 - ceil(40001 / 20000) == 3 containers at the 9600-cent LIST price, not 2 containers and not the discounted price"
            - "${rstat_3} == CLOSED and ${exp_after} == 800 - CASCADE gamma closed the review and never recomputed its frozen figures"
            - "${dstat} == ACTIVE with ${dreason} == null - only remediation DISPENSER_REPLACEMENT locks dispensers out"

      - name: expected_consumption_diverges_between_nameplate_and_as_calibrated
        claim_type: Variant Divergence
        grounds:
          - calculations.expected_chemical_consumption.variants
          - entities.UsageVarianceReview.fields.basis
        excluded_because:
          difficulty_instance: variance_basis_nameplate_vs_as_calibrated_diverges
          rationale: |
            The §1.8 instance runs both bases over one identical dataset, computes the two
            expected_consumption_ml values, shows the delta and shows the classification flipping with
            it - the Variant Divergence claim in full, including the mid-period applied calibration that
            makes the AS_CALIBRATED segments differ.

      - name: sustainability_savings_diverge_between_rated_and_telemetry_measured
        claim_type: Variant Divergence
        grounds:
          - calculations.sustainability_savings.variants
          - endpoints[GET /warewashing/sites/{site_id}/sustainability-report]
        excluded_because:
          difficulty_instance: sustainability_basis_rated_vs_telemetry_measured_diverges
          rationale: |
            Both report bases are requested over identical racks and tariffs in the §1.8 instance, which
            pins the pressure_factor to 4 decimals and shows the smaller water saving, the smaller
            credit and the larger net program cost that follow.

      - name: variant_selection_is_taken_from_the_request_not_from_stored_state
        claim_type: Variant Selection
        grounds:
          - calculations.expected_chemical_consumption.variants
          - calculations.sustainability_savings.variants
        excluded_because:
          difficulty_instance: sustainability_basis_rated_vs_telemetry_measured_diverges
          rationale: |
            Variant selection is inseparable from divergence here - both variants are selected purely by
            the request's basis parameter, and the §1.8 instance issues the same URL twice with only
            that parameter changed, which is exactly the selection claim.

      - name: termination_fee_rounds_each_placement_before_summing
        claim_type: Precision
        grounds:
          - calculations.early_termination_fee
        excluded_because:
          difficulty_instance: termination_fee_per_placement_rounding_precedes_summation
          rationale: |
            The rounding order and the max-of-two-variants shape are the whole content of the §1.8
            instance, which uses fixtures whose per-placement remainders make the two orders differ by a
            cent.

      - name: service_fee_tier_is_chosen_before_the_credit_is_applied
        claim_type: tiered_pricing
        grounds:
          - calculations.sustainability_savings
        excluded_because:
          difficulty_instance: sustainability_fee_tier_read_from_pre_credit_program_cost
          rationale: |
            The §1.8 instance sits the program cost just above a tier boundary by an amount smaller than
            the credit, so an implementation that lets the credit feed back into the tier choice picks
            the wrong rate - a sharper probe than any additional boundary case.

      - name: drift_verdict_boundaries_pass_on_the_inclusive_side
        claim_type: threshold
        grounds:
          - calculations.concentration_drift_verdict
        excluded_because:
          difficulty_instance: drift_pct_tolerance_and_hard_fail_boundaries_are_inclusive_on_the_passing_side
          rationale: |
            Every boundary of the verdict ladder - abs(drift) at the tolerance, one hundredth beyond it,
            at HARD_FAIL_DRIFT_PCT and beyond it - is enumerated in the §1.8 instance with the exact ppm
            fixtures that produce each rounded drift_pct.

      - name: dispatch_pool_empties_at_the_workload_cap
        claim_type: Input Set Filtering
        grounds:
          - calculations.dispatch_technician_selection
        excluded_because:
          difficulty_instance: technician_workload_cap_boundary_empties_the_dispatch_pool
          rationale: |
            The cap boundary (2 open tickets still eligible, 3 not) and the zero-mutation
            ERR_NO_ELIGIBLE_TECHNICIAN outcome are both asserted in the §1.8 instance, which also holds
            the ticket at QUEUED with a null assignment afterwards.

  - section: validations
    instances:
      - name: a_second_dispenser_for_the_same_product_is_rejected_while_another_product_is_accepted
        claim_type: Violation → Error
        grounds:
          - validations.dispenser_product_unique_per_placement
          - errors[ERR_DUPLICATE_DISPENSER_PRODUCT]
        distinguishing_aspect: |
          Uniqueness is scoped to the (placement_id, product_id) pair, not to the placement: the second
          DET-100 dispenser on the machine is rejected with ERR_DUPLICATE_DISPENSER_PRODUCT (409) while a
          SAN-200 dispenser on the very same machine is created successfully in the next call, and the
          rejected attempt leaves the dispenser count at 1 for that product.
        test_recipe:
          setup:
            - "One INSTALLED DT-88 placement under an agreement covering both DET-100 and SAN-200."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "SAN-200", product_type: "SANITIZER", concentration_target_ppm: 200, spec_dose_ml_per_rack: 2.00, unit_size_ml: 10000, unit_price_cents: 4200, sanitizer_min_ppm: 150, sanitizer_max_ppm: 250, min_contact_seconds: 7 }
              as: PlatformAdmin
              captures: { san_id: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "DT-88", machine_class: "DOOR_TYPE", racks_per_hour: 60, rated_water_l_per_rack: 0.74, rated_kwh_per_rack: 0.41, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 480000, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}", "${san_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-C01", expected_agreement_version: "${agr_v}" }
              as: AccountManager
              captures: { pl_id: $.data.id }
            - call: "POST /warewashing/technicians"
              payload: { name: "Rico Vance", region_code: "NW", certification_level: "L2" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /warewashing/machine-placements/${pl_id}/install"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /warewashing/dispensers"
              payload: { placement_id: "${pl_id}", product_id: "${det_id}", calibrated_dose_ml_per_rack: 8.00 }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { d1: $.data.id, d1_status: $.data.dispenser_status }
            - call: "POST /warewashing/dispensers"
              payload: { placement_id: "${pl_id}", product_id: "${det_id}", calibrated_dose_ml_per_rack: 7.00 }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
            - call: "POST /warewashing/dispensers"
              payload: { placement_id: "${pl_id}", product_id: "${san_id}", calibrated_dose_ml_per_rack: 2.00 }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { d2: $.data.id, d2_status: $.data.dispenser_status }
            - call: "GET /warewashing/dispensers"
              payload: { placement_id: "${pl_id}", product_id: "${det_id}" }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { det_total: $.total_count }
          assert:
            - "${d1_status} == ACTIVE and ${err} == ERR_DUPLICATE_DISPENSER_PRODUCT with HTTP 409"
            - "${d2_status} == ACTIVE - a different product on the same placement is unaffected by the constraint"
            - "${det_total} == 1 - the rejected create persisted nothing"

      - name: the_same_symptom_cannot_be_reported_twice_while_a_different_symptom_is_accepted
        claim_type: Satisfaction → Pass
        grounds:
          - validations.one_open_ticket_per_symptom
