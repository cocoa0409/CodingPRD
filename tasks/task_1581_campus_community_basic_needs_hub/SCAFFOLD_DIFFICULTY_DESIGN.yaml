  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: depth-4 cascade from the grant-expiry sweep
  # vs depth-2 cascade from the referral-expiry sweep (different triggering
  # transitions: EmergencyGrantApplication APPROVED->EXPIRED vs Referral
  # SENT->EXPIRED).
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: grant_expiry_reopens_fund_and_promotes_queued_application
        grounds:
          - state_machines.EmergencyGrantApplication.APPROVED_to_EXPIRED
          - state_machines.GrantFund.EXHAUSTED_to_OPEN
          - state_machines.EmergencyGrantApplication.QUEUED_to_SUBMITTED
          - calculations.fund_remaining
        distinguishing_aspect: |
          Depth-4 chain where each link is caused by the previous one: the sweep flips two
          APPROVED applications to EXPIRED (hop 1); each expiry releases its committed_cents
          on the fund (hop 2); remaining_committed_basis becoming > 0 flips the fund
          EXHAUSTED -> OPEN (hop 3); the reopen itself promotes the earliest-created QUEUED
          application to SUBMITTED (hop 4). Originates from APPROVED->EXPIRED, unlike the
          referral instance's SENT->EXPIRED.
        test_recipe:
          setup:
            - "Two ACTIVE clients with VERIFIED assessments; GrantReviewer exists"
            - "GrantFund allocated_cents=300000"
            - "appA and appB each APPROVED for 150000 at clock 2026-08-01T00:00:00Z -> fund EXHAUSTED (committed 300000, remaining 0)"
            - "appC submitted while fund EXHAUSTED -> QUEUED"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "R Re", email: "rev@hub.test", staff_role: "GRANT_REVIEWER" }
              as: HubAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "c-a", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { ca_id: $.data.id, ca_v: $.data.version }
            - call: "POST /clients/${ca_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 80000, housing_status: "COST_BURDENED", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 2, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { aa_id: $.data.id }
            - call: "POST /clients/${ca_id}/assessments/${aa_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${ca_id}/assessments/${aa_id}/verify"
              payload: { expected_client_version: "${ca_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients"
              payload: { alias_name: "c-b", contact_channel: "SMS", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { cb_id: $.data.id, cb_v: $.data.version }
            - call: "POST /clients/${cb_id}/assessments"
              payload: { household_size: 2, monthly_income_cents: 100000, housing_status: "STABLE", dependents_under_18: 1, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 3, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { ab_id: $.data.id }
            - call: "POST /clients/${cb_id}/assessments/${ab_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${cb_id}/assessments/${ab_id}/verify"
