            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 300, parallel_set_size: 1, expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
          trigger:
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 400, parallel_set_size: 1, expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /quotes/${q_id}"
              as: SalesRep
              as_user_id: "rep-1"
              captures: { q_v_now: "$.data.version" }
            - call: "POST /quotes/${q_id}/lines"
