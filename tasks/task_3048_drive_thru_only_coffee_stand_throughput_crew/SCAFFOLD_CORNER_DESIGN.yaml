        distinguishing_aspect: "POST /shifts/{id}/publish is StandOperator-exclusive: a CrewMember caller gets 403 ERR_UNAUTHORIZED_ROLE before any state check."
        test_recipe:
          setup: ["Stand booted; DRAFT shift exists."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
