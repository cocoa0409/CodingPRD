  - rule_id: transitive_cascade
    instances:

      - name: permit_denial_cascade_depth_four
        grounds:
          - state_machines.Permit.SUBMITTED_to_DENIED
          - state_machines.ProgramElement.PLANNED_to_PERMIT_BLOCKED
          - state_machines.StaffAssignment.CONFIRMED_to_RELEASED
          - entities.StaffMember.fields.confirmed_minutes_total
          - entities.Program.fields.staffing_gap_count
          - entities.Program.fields.open_element_count
        distinguishing_aspect: |
          One permit decision propagates four links deep — Permit DENIED -> ProgramElement PERMIT_BLOCKED
          -> StaffAssignment RELEASED -> StaffMember.confirmed_minutes_total 360 -> 0 AND
          Program.staffing_gap_count 0 -> 1 — and the trigger is a regulatory decision on a Permit, not a
          transport cancellation as in segment_cancellation_cascade_depth_three.
