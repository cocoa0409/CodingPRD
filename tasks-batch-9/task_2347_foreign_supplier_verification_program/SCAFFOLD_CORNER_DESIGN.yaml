          difficulty_instance: activity_revision_cycle_counts_only_closed_review_loops
          rationale: "The §1.8 combinatorial instance already walks the CHANGES_REQUESTED → PROPOSED loop three times and asserts that only closed review loops increment revision_count (a bare PATCH on an already-PROPOSED row does not). A §1.9 breadth probe of the same cycle would be a strict subset of that chain."

