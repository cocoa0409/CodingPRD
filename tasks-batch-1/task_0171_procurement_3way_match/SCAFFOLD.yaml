# =============================================================================
# Procurement & 3-Way Match benchmark seed tables (task_0171)
# =============================================================================

scenario: "Procurement & 3-Way Match: requisition approval matrix, RFQ to vendors, PO issuance, goods receipt, invoice 3-way match tolerance, blanket/release PO, vendor scorecard, maverick spend flag"

domain_name: procurement-3way-match
api_prefix: /procurement

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting in URL paths. Every
  # resource lives directly under /procurement/<collection>/{id}.

  state_machine_shape: branching
  # Requisition is a cyclic revise loop (branching-with-revert); Invoice carries
  # two independent dimensions (match_status × payment_status); PurchaseOrder is
  # a diamond fork over STANDARD vs BLANKET issuance.

  relationship_patterns:
    - one_to_many        # Requisition→ApprovalStep, RFQ→Quote, PurchaseOrder→GoodsReceipt
    - self_referential   # ReleaseOrder.blanket_po_id -> PurchaseOrder.id (PO references PO)
    - cross_aggregate    # Invoice references PurchaseOrder + GoodsReceipt + Vendor

  role_model: segregation_of_duties
  # The buyer who raises a Requisition cannot approve it; the approver cannot
  # also post the goods receipt that closes the 3-way match. Enforced via
  # X-User-ID identity checks against entity-backed roles.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: SpendCategory
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Category display name" }
      - { name: code, type: string, source: input, description: "Unique category code (uppercase), unique across non-archived categories" }
      - { name: approval_threshold_cents, type: integer, source: input, description: "Requisition committed amount strictly above which a second-level (DIRECTOR) approval is required; at-or-below needs only MANAGER", constraints: ">= 0" }
      - { name: director_threshold_cents, type: integer, source: input, description: "Requisition committed amount strictly above which a third-level (CFO) approval is required", constraints: ">= approval_threshold_cents" }
      - { name: preferred_vendor_id, type: string, source: input, description: "FK -> Vendor.id; the contracted vendor for this category. A PurchaseOrder whose vendor differs from this is flagged maverick spend.", default: null }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED", constraints: "ACTIVE, ARCHIVED" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal vendor name" }
      - { name: tax_id, type: string, source: input, description: "Unique tax id across non-terminal vendors" }
      - { name: grace_days, type: integer, source: input, default: 0, description: "Delivery grace window (days) used by the GRACE on-time variant", constraints: ">= 0" }
      - { name: exception_count, type: integer, source: computed, default: 0, description: "Count of open MatchException rows attributed to this vendor; drives PROBATION" }
      - { name: status, type: enum, source: system, default: "APPROVED", description: "APPROVED | PROBATION | BLOCKED. PROBATION reached automatically when exception_count crosses threshold; BLOCKED set manually.", constraints: "APPROVED, PROBATION, BLOCKED" }

  - name: Requisition
    parent: null
    common_fields: true
    fields:
      - { name: requester_id, type: string, source: system, description: "X-User-ID of the Buyer who created it; used for segregation-of-duties checks" }
      - { name: spend_category_id, type: string, source: input, description: "FK -> SpendCategory.id" }
      - { name: title, type: string, source: input, description: "Short description of the need" }
      - { name: lines, type: array, source: input, description: "Requisition lines: [{ sku, description, quantity, estimated_unit_price_cents }]; quantity > 0, estimated_unit_price_cents > 0" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Provisional total from requisition line estimates (estimated_total variant)" }
      - { name: committed_total_cents, type: integer, source: computed, default: null, description: "Final committed total from the winning quote at PO issuance (committed_total variant); null until a PO is issued" }
      - { name: required_levels, type: integer, source: computed, description: "Number of approval levels required, derived from committed (or estimated) total vs SpendCategory thresholds at submission" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of times the requisition returned to DRAFT from PENDING_APPROVAL" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PENDING_APPROVAL | APPROVED | REJECTED | CANCELLED", constraints: "DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, CANCELLED" }

  - name: ApprovalStep
    parent: Requisition
    common_fields: true
    fields:
      - { name: requisition_id, type: string, source: system, description: "FK -> Requisition.id" }
      - { name: level, type: integer, source: system, description: "1=MANAGER, 2=DIRECTOR, 3=CFO; ascending order in which steps must be decided" }
      - { name: required_role, type: enum, source: system, description: "MANAGER | DIRECTOR | CFO", constraints: "MANAGER, DIRECTOR, CFO" }
      - { name: decided_by_id, type: string, source: system, default: null, description: "X-User-ID of the approver who decided this step" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "ISO 8601 UTC timestamp the step was decided" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | REJECTED | SKIPPED", constraints: "PENDING, APPROVED, REJECTED, SKIPPED" }

  - name: RFQ
    parent: null
    common_fields: true
    fields:
      - { name: requisition_id, type: string, source: input, description: "FK -> Requisition.id" }
      - { name: round_index, type: integer, source: system, description: "0-based negotiation round; increments per RFQ opened for the same requisition" }
      - { name: open_at, type: datetime, source: input, description: "Inclusive start of the quote-collection window (ISO 8601 UTC)" }
      - { name: close_at, type: datetime, source: input, description: "Exclusive end of the quote-collection window; close_at > open_at" }
      - { name: awarded_quote_id, type: string, source: system, default: null, description: "FK -> Quote.id; the winning quote once awarded" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | AWARDED | CANCELLED | CLOSED_NO_AWARD", constraints: "OPEN, AWARDED, CANCELLED, CLOSED_NO_AWARD" }

  - name: Quote
    parent: RFQ
    common_fields: true
    fields:
      - { name: rfq_id, type: string, source: system, description: "FK -> RFQ.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: submitted_at, type: datetime, source: input, description: "When the vendor submitted; must satisfy open_at <= submitted_at < close_at" }
      - { name: unit_prices, type: array, source: input, description: "Per requisition-line pricing: [{ sku, unit_price_cents, promised_lead_days }]; unit_price_cents > 0" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Sum over lines of unit_price_cents * requisition line quantity" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | AWARDED | VOIDED", constraints: "SUBMITTED, AWARDED, VOIDED" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: spend_category_id, type: string, source: input, description: "FK -> SpendCategory.id" }
      - { name: requisition_id, type: string, source: input, default: null, description: "FK -> Requisition.id; set for STANDARD POs issued from a requisition, null for BLANKET" }
      - { name: source_quote_id, type: string, source: input, default: null, description: "FK -> Quote.id; the awarded quote a STANDARD PO is priced from" }
      - { name: po_type, type: enum, source: input, description: "STANDARD | BLANKET", constraints: "STANDARD, BLANKET" }
      - { name: lines, type: array, source: computed, default: null, description: "For STANDARD: [{ sku, quantity, unit_price_cents, received_total }] copied from the awarded quote + requisition quantities; received_total starts 0" }
      - { name: total_amount_cents, type: integer, source: computed, description: "STANDARD: sum of lines quantity*unit_price_cents. BLANKET: equals ceiling_amount_cents." }
      - { name: ceiling_amount_cents, type: integer, source: input, default: null, description: "BLANKET only: maximum cumulative release value; required when po_type=BLANKET", constraints: "> 0 when BLANKET" }
      - { name: remaining_amount_cents, type: integer, source: computed, default: null, description: "BLANKET only: ceiling_amount_cents minus sum of non-cancelled ReleaseOrder.amount_cents" }
      - { name: valid_from, type: datetime, source: input, default: null, description: "BLANKET only: inclusive start of the blanket validity interval" }
      - { name: valid_to, type: datetime, source: input, default: null, description: "BLANKET only: inclusive end of the blanket validity interval; valid_to > valid_from" }
      - { name: is_maverick, type: boolean, source: computed, default: false, description: "True when vendor_id != SpendCategory.preferred_vendor_id at issuance" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | CLOSED | CANCELLED", constraints: "ISSUED, CLOSED, CANCELLED" }

  - name: ReleaseOrder
    parent: PurchaseOrder
    common_fields: true
    fields:
      - { name: blanket_po_id, type: string, source: input, description: "FK -> PurchaseOrder.id; MUST reference a PurchaseOrder whose po_type=BLANKET" }
      - { name: amount_cents, type: integer, source: input, description: "Release value drawn from the blanket ceiling; > 0", constraints: "> 0" }
      - { name: lines, type: array, source: input, description: "[{ sku, quantity, unit_price_cents }]; quantity > 0; sum of quantity*unit_price_cents must equal amount_cents" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | RECEIVED | CANCELLED", constraints: "OPEN, RECEIVED, CANCELLED" }

  - name: GoodsReceipt
    parent: null
    common_fields: true
    fields:
      - { name: purchase_order_id, type: string, source: input, description: "FK -> PurchaseOrder.id" }
      - { name: release_order_id, type: string, source: input, default: null, description: "FK -> ReleaseOrder.id; required when the PO is BLANKET" }
      - { name: received_lines, type: array, source: input, description: "[{ sku, received_qty }]; received_qty > 0" }
      - { name: received_at, type: datetime, source: input, description: "ISO 8601 UTC actual receipt timestamp; compared to quote promised lead for on-time scoring" }
      - { name: posted_by_id, type: string, source: system, description: "X-User-ID of the Receiver who posted; segregation-of-duties anchor" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED | REVERSED", constraints: "POSTED, REVERSED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: purchase_order_id, type: string, source: input, description: "FK -> PurchaseOrder.id" }
      - { name: goods_receipt_id, type: string, source: input, description: "FK -> GoodsReceipt.id; the receipt the invoice is matched against" }
      - { name: invoice_number, type: string, source: input, description: "Unique per vendor across non-VOID invoices" }
      - { name: lines, type: array, source: input, description: "[{ sku, billed_qty, billed_unit_price_cents }]; billed_qty > 0; billed_unit_price_cents > 0" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Sum over lines of billed_qty*billed_unit_price_cents (round per-line then sum)" }
      - { name: match_status, type: enum, source: computed, default: "UNMATCHED", description: "UNMATCHED | MATCHED | EXCEPTION (match dimension)", constraints: "UNMATCHED, MATCHED, EXCEPTION" }
      - { name: payment_status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED_FOR_PAY | PAID | REJECTED (payment dimension, independent of match_status)", constraints: "PENDING, APPROVED_FOR_PAY, PAID, REJECTED" }

  - name: MatchException
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; denormalized from the invoice for scorecard attribution" }
      - { name: reason, type: enum, source: system, description: "PRICE_OVER_TOLERANCE | QTY_OVER_TOLERANCE | AMOUNT_OVER_TOLERANCE | NO_RECEIPT", constraints: "PRICE_OVER_TOLERANCE, QTY_OVER_TOLERANCE, AMOUNT_OVER_TOLERANCE, NO_RECEIPT" }
      - { name: detail, type: string, source: system, description: "Human-readable mismatch detail (offending sku, computed delta)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | RESOLVED | WAIVED", constraints: "OPEN, RESOLVED, WAIVED" }

  - name: VendorScorecard
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the scoring period (ISO 8601 UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the scoring period; period_end > period_start. Periods for one vendor must tile without overlap." }
      - { name: on_time_variant, type: enum, source: input, default: "STRICT", description: "STRICT | GRACE; selects the on-time delivery algorithm variant", constraints: "STRICT, GRACE" }
      - { name: on_time_rate_pct, type: integer, source: computed, description: "On-time delivery percentage (0-100) over receipts in the period, per on_time_variant" }
      - { name: price_compliance_pct, type: integer, source: computed, description: "Percentage of matched invoice lines within price tolerance over the period (0-100)" }
      - { name: exception_pct, type: integer, source: computed, description: "Percentage of receipts in the period that produced a MatchException (0-100)" }
      - { name: composite_score, type: integer, source: computed, description: "Weighted composite (0-100); round each weighted component to integer first, then sum" }
      - { name: status, type: enum, source: system, default: "FINAL", description: "FINAL (scorecards are immutable snapshots once created)", constraints: "FINAL" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Requisition
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /procurement/requisitions/{id}/submit"
        actor: Buyer
        preconditions:
          - "Acting Buyer X-User-ID == requisition.requester_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
          - "lines non-empty (ERR_INVALID_REQUEST)"
          - "SpendCategory.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Compute estimated_total_cents via estimated_total calculation"
          - "Compute required_levels via approval_matrix calculation using estimated_total_cents"
          - "Create required_levels ApprovalStep rows (level 1..required_levels, status=PENDING), one per required tier"

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /procurement/requisitions/{id}/approve (final pending step approved)"
        actor: Approver
        preconditions:
          - "All ApprovalStep rows for this requisition are APPROVED after this decision (ERR_APPROVAL_INCOMPLETE if a lower-level step is still PENDING)"
        side_effects:
          - "requisition.status = APPROVED"

      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /procurement/requisitions/{id}/approve with decision=REJECT, OR POST .../reject"
        actor: Approver
        preconditions:
          - "Acting approver X-User-ID != requisition.requester_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "The decided ApprovalStep.status = REJECTED; remaining PENDING steps set to SKIPPED"
          - "requisition.status = REJECTED"
          - "Cascade: any OPEN RFQ for this requisition -> CANCELLED (which voids its SUBMITTED quotes)"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /procurement/requisitions/{id}/revise"
        actor: Buyer
        preconditions:
          - "Acting Buyer X-User-ID == requisition.requester_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "revision_count += 1"
          - "Delete/clear prior ApprovalStep rows so a fresh approval cycle can begin on next submit"
        note: "Cyclic revise loop: REJECTED -> DRAFT -> PENDING_APPROVAL again."

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /procurement/requisitions/{id}/cancel"
        actor: Buyer
        preconditions:
          - "Acting Buyer X-User-ID == requisition.requester_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Cascade: any OPEN RFQ for this requisition -> CANCELLED -> each SUBMITTED Quote on that RFQ -> VOIDED"

      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /procurement/requisitions/{id}/cancel"
        actor: Buyer
        preconditions:
          - "Acting Buyer X-User-ID == requisition.requester_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Remaining PENDING ApprovalStep rows set to SKIPPED"
          - "Cascade: any OPEN RFQ for this requisition -> CANCELLED -> each SUBMITTED Quote -> VOIDED"

  - entity: RFQ
    initial_state: OPEN
    terminal_states: [AWARDED, CANCELLED, CLOSED_NO_AWARD]
    transitions:
      - from: OPEN
        to: AWARDED
        trigger: "POST /procurement/rfqs/{id}/award"
        actor: Buyer
        preconditions:
          - "Requisition.status == APPROVED (ERR_REQUISITION_NOT_APPROVED)"
          - "Awarded quote belongs to this RFQ and is SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "rfq.awarded_quote_id = quote.id; rfq.status = AWARDED"
          - "Awarded Quote.status = AWARDED; all other SUBMITTED quotes on this RFQ -> VOIDED"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /procurement/rfqs/{id}/cancel OR cascade from Requisition reject/cancel"
        actor: Buyer | system
        preconditions: []
        side_effects:
          - "Cascade: every SUBMITTED Quote on this RFQ -> VOIDED"

      - from: OPEN
        to: CLOSED_NO_AWARD
        trigger: "POST /procurement/rfqs/{id}/close_no_award"
        actor: Buyer
        preconditions:
          - "No awarded_quote_id set"
        side_effects:
          - "Every SUBMITTED Quote on this RFQ -> VOIDED"

  - entity: PurchaseOrder
    initial_state: ISSUED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: ISSUED
        to: ISSUED
        trigger: "POST /procurement/purchase-orders (BLANKET) then POST /procurement/release-orders"
        actor: Buyer
        preconditions:
          - "po_type == BLANKET (ERR_NOT_BLANKET_PO)"
          - "release amount_cents <= remaining_amount_cents (ERR_RELEASE_EXCEEDS_CEILING)"
          - "expected_purchase_order_version matches (ERR_STALE_VERSION otherwise)"
        side_effects:
          - "Create ReleaseOrder(status=OPEN); remaining_amount_cents -= amount_cents"
          - "increments PurchaseOrder.version by 1"
        note: "Self-transition: a release draws from the blanket without changing PO status."

      - from: ISSUED
        to: CLOSED
        trigger: "POST /procurement/purchase-orders/{id}/close"
        actor: Buyer
        preconditions:
          - "STANDARD: every PO line received_total >= ordered quantity OR force flag (ERR_PO_NOT_FULLY_RECEIVED without force)"
          - "BLANKET: no OPEN ReleaseOrder remains (ERR_BLANKET_HAS_OPEN_RELEASES)"
        side_effects: []

      - from: ISSUED
        to: CANCELLED
        trigger: "POST /procurement/purchase-orders/{id}/cancel"
        actor: Buyer
        preconditions:
          - "No POSTED GoodsReceipt references this PO (ERR_PO_HAS_RECEIPTS)"
        side_effects:
          - "BLANKET: cascade every OPEN ReleaseOrder -> CANCELLED, each restoring remaining_amount_cents += amount_cents"

  - entity: ReleaseOrder
    initial_state: OPEN
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: OPEN
        to: RECEIVED
        trigger: "system: a POSTED GoodsReceipt covers the release lines"
        actor: system
        preconditions:
          - "GoodsReceipt.release_order_id == this release (ERR_INVALID_REQUEST)"
        side_effects: []

      - from: OPEN
        to: CANCELLED
        trigger: "POST /procurement/release-orders/{id}/cancel OR cascade from blanket PO cancel"
        actor: Buyer | system
        preconditions:
          - "No POSTED GoodsReceipt references this release (ERR_RELEASE_HAS_RECEIPTS)"
        side_effects:
          - "blanket PurchaseOrder.remaining_amount_cents += amount_cents (compensating restore)"
          - "increments PurchaseOrder.version by 1"

  - entity: GoodsReceipt
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: POSTED
        trigger: "POST /procurement/goods-receipts"
        actor: Receiver
        preconditions:
          - "PurchaseOrder.status == ISSUED (ERR_INVALID_STATE)"
          - "Acting Receiver X-User-ID != Requisition.requester_id of the linked PO (ERR_SEGREGATION_OF_DUTIES)"
          - "BLANKET PO requires release_order_id (ERR_INVALID_REQUEST)"
          - "Cumulative received_qty per sku does not exceed ordered quantity beyond receipt tolerance (ERR_RECEIPT_OVER_TOLERANCE)"
        side_effects:
          - "Increment PO line received_total by received_qty per sku (conserved received-quantity ledger)"
          - "If the receipt fully covers a linked ReleaseOrder, that ReleaseOrder -> RECEIVED"
        note: "Creation transition; the receipt is born POSTED."

      - from: POSTED
        to: REVERSED
        trigger: "POST /procurement/goods-receipts/{id}/reverse"
        actor: Receiver
        preconditions:
          - "No MATCHED or EXCEPTION Invoice references this receipt (ERR_RECEIPT_HAS_INVOICE)"
        side_effects:
          - "Decrement PO line received_total by the receipt's received_qty per sku (compensating restore of the received-quantity ledger)"
          - "If a linked ReleaseOrder was RECEIVED solely by this receipt, revert it to OPEN"

  - entity: Invoice
    initial_state: UNMATCHED
    terminal_states: []
    note: "Two independent dimensions on one row: match_status (UNMATCHED->MATCHED|EXCEPTION) and payment_status (PENDING->APPROVED_FOR_PAY|REJECTED->PAID). They evolve independently."
    transitions:
      # --- match dimension ---
      - from: UNMATCHED
        to: MATCHED
        trigger: "POST /procurement/invoices/{id}/match (3-way match passes tolerance)"
        actor: Matcher
        preconditions:
          - "A POSTED GoodsReceipt referenced by goods_receipt_id exists (ERR_NO_RECEIPT)"
          - "three_way_match calculation yields PASS"
        side_effects:
          - "match_status = MATCHED"

      - from: UNMATCHED
        to: EXCEPTION
        trigger: "POST /procurement/invoices/{id}/match (3-way match fails tolerance)"
        actor: Matcher
        preconditions:
          - "three_way_match calculation yields FAIL"
        side_effects:
          - "match_status = EXCEPTION"
          - "Cascade: create MatchException(status=OPEN) -> recompute Vendor.exception_count -> if exception_count > VENDOR_PROBATION_THRESHOLD, Vendor.status APPROVED->PROBATION"

      - from: EXCEPTION
        to: MATCHED
        trigger: "system: resolving every OPEN MatchException for the invoice via POST /procurement/match-exceptions/{id}/resolve"
        actor: Matcher
        preconditions:
          - "All MatchException rows for the invoice are RESOLVED or WAIVED"
        side_effects:
          - "match_status = MATCHED"

      # --- payment dimension (independent of match dimension) ---
      - from: PENDING
        to: APPROVED_FOR_PAY
        trigger: "POST /procurement/invoices/{id}/approve-payment"
        actor: PayablesClerk
        preconditions:
          - "match_status == MATCHED (ERR_INVOICE_NOT_MATCHED)"
        side_effects:
          - "payment_status = APPROVED_FOR_PAY"

      - from: PENDING
        to: REJECTED
        trigger: "POST /procurement/invoices/{id}/reject-payment"
        actor: PayablesClerk
        preconditions: []
        side_effects:
          - "payment_status = REJECTED"

      - from: APPROVED_FOR_PAY
        to: PAID
        trigger: "POST /procurement/invoices/{id}/pay"
        actor: PayablesClerk
        preconditions:
          - "payment_status == APPROVED_FOR_PAY (ERR_INVALID_STATE)"
        side_effects:
          - "payment_status = PAID"

  - entity: MatchException
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /procurement/match-exceptions/{id}/resolve"
        actor: Matcher
        preconditions: []
        side_effects:
          - "Recompute Vendor.exception_count; if it falls to/below VENDOR_PROBATION_THRESHOLD and status==PROBATION, Vendor.status PROBATION->APPROVED"
          - "If no OPEN MatchException remains for the invoice, Invoice.match_status EXCEPTION->MATCHED"

      - from: OPEN
        to: WAIVED
        trigger: "POST /procurement/match-exceptions/{id}/waive"
        actor: Matcher
        preconditions:
          - "Acting Matcher X-User-ID != GoodsReceipt.posted_by_id of the matched receipt (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Recompute Vendor.exception_count; possible PROBATION->APPROVED"
          - "If no OPEN MatchException remains for the invoice, Invoice.match_status EXCEPTION->MATCHED"

  - entity: Vendor
    initial_state: APPROVED
    terminal_states: [BLOCKED]
    transitions:
      - from: APPROVED
        to: PROBATION
        trigger: "system: exception_count crosses VENDOR_PROBATION_THRESHOLD after a MatchException is opened"
        actor: system
        preconditions:
          - "exception_count > VENDOR_PROBATION_THRESHOLD"
        side_effects: []

      - from: PROBATION
        to: APPROVED
        trigger: "system: exception_count falls to/below VENDOR_PROBATION_THRESHOLD after resolve/waive"
        actor: system
        preconditions:
          - "exception_count <= VENDOR_PROBATION_THRESHOLD"
        side_effects: []

      - from: APPROVED
        to: BLOCKED
        trigger: "POST /procurement/vendors/{id}/block"
        actor: ProcurementAdmin
        preconditions: []
        side_effects: []

      - from: PROBATION
        to: BLOCKED
        trigger: "POST /procurement/vendors/{id}/block"
        actor: ProcurementAdmin
        preconditions: []
        side_effects: []

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: release-create-stale-blanket
    parent_entity: PurchaseOrder
    write_endpoint: "POST /procurement/release-orders"
    occ_field: "expected_purchase_order_version"
    description: |
      Creating a ReleaseOrder against a BLANKET PurchaseOrder whose version has
      advanced since the client last observed it is rejected. A prior release
      legitimately drew down remaining_amount_cents (and bumped the blanket's
      version); the current writer's view of the remaining ceiling is therefore
      stale, so its draw cannot be admitted without re-reading.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_total
    trigger: "Requisition submit (DRAFT->PENDING_APPROVAL)"
    algorithm: aggregation
    formula: |
      estimated_total_cents = sum over requisition.lines of
        (line.quantity * line.estimated_unit_price_cents)
    input_set: "All lines on the requisition; integer cents, no rounding needed (whole-cent inputs)."
    precision: "integer cents, exact"
    variants:
      - name: estimated
        when: "At submission, before any quote is awarded"
        difference: "Uses requisition line estimated_unit_price_cents (the buyer's guess)"

  - name: committed_total
    trigger: "STANDARD PurchaseOrder issuance from an awarded quote"
    algorithm: aggregation
    formula: |
      committed_total_cents = sum over awarded_quote.unit_prices of
        (requisition_line.quantity_for_sku * quote_line.unit_price_cents)
      Then write committed_total_cents onto the source Requisition.
    input_set: "Awarded Quote lines joined to requisition quantities by sku."
    precision: "integer cents, exact"
    variants:
      - name: committed
        when: "At PO issuance, using the winning vendor's actual prices"
        difference: |
          Same requisition, different number than estimated_total: estimated uses the
          buyer's estimated_unit_price_cents; committed uses the awarded quote's
          unit_price_cents. The two diverge whenever the quote price != estimate.

  - name: approval_matrix
    trigger: "Requisition submit; recomputed on revise+resubmit"
    algorithm: threshold
    formula: |
      base = estimated_total_cents   # committed_total_cents is null at submit time
      required_levels = 1                                  # MANAGER always required
      if base > SpendCategory.approval_threshold_cents:
          required_levels = 2                              # add DIRECTOR
      if base > SpendCategory.director_threshold_cents:
          required_levels = 3                              # add CFO
      # Create one ApprovalStep per level 1..required_levels with required_role
      # MANAGER(1), DIRECTOR(2), CFO(3).
    input_set: "Requisition.estimated_total_cents vs the requisition's SpendCategory thresholds."
    constants: {}
    precision: "integer count of levels"
    variants:
      - name: at_threshold_boundary
        when: "base exactly equals a threshold"
        difference: "Strict > : base == approval_threshold_cents needs only MANAGER (level stays 1); base == approval_threshold_cents + 1 needs DIRECTOR."

  - name: three_way_match
    trigger: "POST /procurement/invoices/{id}/match"
    algorithm: threshold
    formula: |
      Let PO line price = ordered unit_price_cents for the sku (from PO.lines).
      Let received_qty = the matched GoodsReceipt received_qty for the sku.
      For each invoice line (joined to PO line + receipt by sku):
        price_ok = billed_unit_price_cents <= floor(po_unit_price_cents * (1 + PRICE_TOLERANCE_PCT/100))
        qty_ok   = billed_qty <= received_qty                       # cannot bill more than received
        # amount tolerance is a SECONDARY aggregate gate over the whole invoice:
      line_amount_ok = price_ok AND qty_ok
      amount_ok = invoice_total_cents <= floor(po_matched_amount_cents * (1 + AMOUNT_TOLERANCE_PCT/100))
        where po_matched_amount_cents = sum over matched skus of (received_qty * po_unit_price_cents)
      PASS iff every line_amount_ok is true AND amount_ok is true AND a POSTED receipt exists.
      First failing gate, evaluated in this order, sets the MatchException.reason:
        NO_RECEIPT > PRICE_OVER_TOLERANCE (first offending line by sku asc)
                   > QTY_OVER_TOLERANCE (first offending line by sku asc)
                   > AMOUNT_OVER_TOLERANCE
    input_set: "Invoice lines joined to PO.lines (ordered prices) and the matched GoodsReceipt received_qty, by sku ascending."
    constants:
      PRICE_TOLERANCE_PCT: 5     # 5% over PO unit price allowed
      QTY_TOLERANCE_PCT: 0       # billed may not exceed received
      AMOUNT_TOLERANCE_PCT: 2    # 2% over matched PO amount allowed
    precision: "integer cents; floor() applied to each tolerance ceiling before comparison"
    variants:
      - name: price_boundary
        when: "billed_unit_price_cents exactly at floor(po_unit_price * 1.05)"
        difference: "<= passes; one cent above fails with PRICE_OVER_TOLERANCE."

  - name: on_time_delivery_rate
    trigger: "VendorScorecard creation"
    algorithm: aggregation
    formula: |
      Consider GoodsReceipts with status=POSTED whose received_at in
      [period_start, period_end) for this vendor's POs.
      For each receipt, find the promised_lead_days from the awarded quote line
      and the PO issuance date; promised_date = po.created_at + promised_lead_days.
      STRICT:  on_time iff received_at <= promised_date
      GRACE:   on_time iff received_at <= promised_date + vendor.grace_days
      on_time_rate_pct = round_half_up( 100 * on_time_count / total_count )
      If total_count == 0, on_time_rate_pct = 100.
    input_set: "POSTED receipts in the half-open period window for this vendor."
    constants: {}
    precision: "integer percent, round_half_up; empty set yields 100"
    variants:
      - name: strict
        when: "on_time_variant == STRICT"
        difference: "received_at compared to promised_date with no grace."
      - name: grace
        when: "on_time_variant == GRACE"
        difference: "promised_date extended by vendor.grace_days; same data yields a >= STRICT rate."

  - name: composite_score
    trigger: "VendorScorecard creation"
    algorithm: weighted_scoring
    formula: |
      components (each already a 0-100 integer percent):
        on_time_rate_pct, price_compliance_pct, (100 - exception_pct)
      weighted contributions:
        c1 = round_half_up(on_time_rate_pct        * W_ON_TIME)
        c2 = round_half_up(price_compliance_pct    * W_PRICE)
        c3 = round_half_up((100 - exception_pct)   * W_RELIABILITY)
      composite_score = c1 + c2 + c3        # ROUND-EACH-THEN-SUM (pinned order)
      # NOT round(on_time*W1 + price*W2 + reliability*W3) — the per-component
      # rounding order is mandatory and can differ by 1 point from sum-then-round.
    input_set: "The three period percentages computed for this scorecard."
    constants:
      W_ON_TIME: 0.5
      W_PRICE: 0.3
      W_RELIABILITY: 0.2
    precision: "integer; round_half_up each component BEFORE summing"
    variants:
      - name: round_then_sum
        when: "always"
        difference: "Per-component round-half-up then sum; pinned to avoid sum-then-round drift."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body resource id resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body is well-formed: required fields present, quantities/prices > 0, enum members valid, BLANKET POs carry ceiling_amount_cents + valid_from/valid_to, release line sum equals amount_cents"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: auth
    check: "Segregation of duties: requester cannot approve own requisition; approver/buyer cannot post its goods receipt; exception waiver cannot be the receipt poster"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "requisition approve/reject, goods-receipts create, match-exceptions waive"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: business_referential
    check: "ReleaseOrder.blanket_po_id must reference a PurchaseOrder whose po_type==BLANKET"
    error_id: ERR_NOT_BLANKET_PO
    http_status: 409
    applies_to: "POST /procurement/release-orders"

  - priority: 8
    category: business_referential
    check: "RFQ award requires Requisition.status==APPROVED (cross-entity state dependency)"
    error_id: ERR_REQUISITION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /procurement/rfqs/{id}/award"

  - priority: 9
    category: business_temporal
    check: "Quote.submitted_at must satisfy RFQ.open_at <= submitted_at < RFQ.close_at (half-open window)"
    error_id: ERR_QUOTE_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "POST /procurement/quotes"

  - priority: 10
    category: business_temporal
    check: "A new BLANKET PO for the same (vendor, spend_category) must not have a [valid_from, valid_to] closed interval overlapping an existing ISSUED blanket (adjacency counts as overlap)"
    error_id: ERR_BLANKET_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /procurement/purchase-orders"

  - priority: 11
    category: business_temporal
    check: "A new VendorScorecard period [period_start, period_end) must not overlap an existing scorecard period for the same vendor (half-open, adjacency allowed)"
    error_id: ERR_SCORECARD_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /procurement/vendor-scorecards"

  - priority: 12
    category: business_safety
    check: "Approval matrix completeness: a requisition cannot reach APPROVED while any required ApprovalStep is still PENDING"
    error_id: ERR_APPROVAL_INCOMPLETE
    http_status: 409
    applies_to: "POST /procurement/requisitions/{id}/approve"

  - priority: 13
    category: business_constraint
    check: "Goods receipt cumulative received_qty per sku must not exceed ordered quantity beyond receipt tolerance"
    error_id: ERR_RECEIPT_OVER_TOLERANCE
    http_status: 409
    applies_to: "POST /procurement/goods-receipts"

  - priority: 14
    category: business_fiscal
    check: "ReleaseOrder.amount_cents must not exceed blanket remaining_amount_cents"
    error_id: ERR_RELEASE_EXCEEDS_CEILING
    http_status: 409
    applies_to: "POST /procurement/release-orders"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_purchase_order_version must equal the blanket PO's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /procurement/release-orders"

  - priority: 16
    category: business_referential
    check: "Invoice match requires a POSTED GoodsReceipt referenced by goods_receipt_id"
    error_id: ERR_NO_RECEIPT
    http_status: 409
    applies_to: "POST /procurement/invoices/{id}/match"

  - priority: 17
    category: business_constraint
    check: "Invoice payment approval requires match_status==MATCHED"
    error_id: ERR_INVOICE_NOT_MATCHED
    http_status: 409
    applies_to: "POST /procurement/invoices/{id}/approve-payment"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- SpendCategory ---
  - method: POST
    path: "/procurement/spend-categories"
    description: "Create a spend category with approval thresholds"
    roles: [ProcurementAdmin]
    code: 201
    input: [name, code, approval_threshold_cents, director_threshold_cents, preferred_vendor_id?]
    output: SpendCategory
    side_effects: ["status=ACTIVE; ERR_INVALID_REQUEST if director_threshold_cents < approval_threshold_cents or code already in use"]

  - method: GET
    path: "/procurement/spend-categories/{id}"
    description: "Get a spend category"
    roles: [ProcurementAdmin, Buyer, Approver, Receiver, Matcher, PayablesClerk]
    code: 200
    input: []
    output: SpendCategory
    side_effects: []

  - method: GET
    path: "/procurement/spend-categories"
    description: "List spend categories"
    roles: [ProcurementAdmin, Buyer, Approver, Receiver, Matcher, PayablesClerk]
    code: 200
    input: ["status?", "preferred_vendor_id?", "limit?", "offset?"]
    output: "SpendCategory[]"
    side_effects: []

  - method: POST
    path: "/procurement/spend-categories/{id}/archive"
    description: "Archive a spend category"
    roles: [ProcurementAdmin]
    code: 200
    input: []
    output: SpendCategory
    side_effects: ["status -> ARCHIVED"]

  # --- Vendor ---
  - method: POST
    path: "/procurement/vendors"
    description: "Register a vendor"
    roles: [ProcurementAdmin]
    code: 201
    input: [name, tax_id, grace_days?]
    output: Vendor
    side_effects: ["status=APPROVED, exception_count=0; ERR_INVALID_REQUEST if tax_id already in use"]

  - method: GET
    path: "/procurement/vendors/{id}"
    description: "Get a vendor"
    roles: [ProcurementAdmin, Buyer, Approver, Receiver, Matcher, PayablesClerk]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/procurement/vendors"
    description: "List vendors"
    roles: [ProcurementAdmin, Buyer, Approver, Receiver, Matcher, PayablesClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Vendor[]"
    side_effects: []

  - method: POST
    path: "/procurement/vendors/{id}/block"
    description: "Block a vendor"
    roles: [ProcurementAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status -> BLOCKED"]

  # --- Requisition ---
  - method: POST
    path: "/procurement/requisitions"
    description: "Create a draft requisition (requester_id = X-User-ID)"
    roles: [Buyer]
    code: 201
    input: [spend_category_id, title, lines]
    output: Requisition
    side_effects: ["status=DRAFT, requester_id=X-User-ID, revision_count=0"]

  - method: GET
    path: "/procurement/requisitions/{id}"
    description: "Get a requisition"
    roles: [ProcurementAdmin, Buyer, Approver, Receiver, Matcher, PayablesClerk]
    code: 200
    input: []
    output: Requisition
    side_effects: []

  - method: GET
    path: "/procurement/requisitions"
    description: "List requisitions"
    roles: [ProcurementAdmin, Buyer, Approver, Receiver, Matcher, PayablesClerk]
    code: 200
    input: ["spend_category_id?", "status?", "requester_id?", "limit?", "offset?"]
    output: "Requisition[]"
    side_effects: []

  - method: POST
    path: "/procurement/requisitions/{id}/submit"
    description: "Submit requisition for approval"
    roles: [Buyer]
    code: 200
    input: []
    output: Requisition
    side_effects: ["DRAFT->PENDING_APPROVAL; compute estimated_total_cents, required_levels; create ApprovalStep rows"]

  - method: POST
    path: "/procurement/requisitions/{id}/approve"
    description: "Approve the current pending approval step (decision APPROVE or REJECT)"
    roles: [Approver]
    code: 200
    input: ["decision?"]
    output: Requisition
    side_effects: ["Mark current ApprovalStep APPROVED; when all APPROVED -> requisition APPROVED; decision=REJECT routes to reject path"]

  - method: POST
    path: "/procurement/requisitions/{id}/reject"
    description: "Reject the requisition at the current step"
    roles: [Approver]
    code: 200
    input: []
    output: Requisition
    side_effects: ["current ApprovalStep REJECTED, remaining SKIPPED; status REJECTED; cascade-cancel OPEN RFQs"]

  - method: POST
    path: "/procurement/requisitions/{id}/revise"
    description: "Return a rejected requisition to DRAFT"
    roles: [Buyer]
    code: 200
    input: []
    output: Requisition
    side_effects: ["REJECTED->DRAFT; revision_count+=1; clear ApprovalStep rows"]

  - method: POST
    path: "/procurement/requisitions/{id}/cancel"
    description: "Cancel a requisition"
    roles: [Buyer]
    code: 200
    input: []
    output: Requisition
    side_effects: ["-> CANCELLED; remaining PENDING steps SKIPPED; cascade-cancel OPEN RFQs -> void quotes"]

  # --- ApprovalStep (reverse-reachability for Requisition FK) ---
  - method: GET
    path: "/procurement/approval-steps/{id}"
    description: "Get an approval step"
    roles: [ProcurementAdmin, Buyer, Approver]
    code: 200
    input: []
    output: ApprovalStep
    side_effects: []

  - method: GET
    path: "/procurement/approval-steps"
    description: "List approval steps, filterable by requisition"
    roles: [ProcurementAdmin, Buyer, Approver]
    code: 200
    input: ["requisition_id?", "status?", "limit?", "offset?"]
    output: "ApprovalStep[]"
    side_effects: []

  # --- RFQ ---
  - method: POST
    path: "/procurement/rfqs"
    description: "Open an RFQ round against a requisition"
    roles: [Buyer]
    code: 201
    input: [requisition_id, open_at, close_at]
    output: RFQ
    side_effects: ["status=OPEN; round_index = count of prior RFQs for the requisition; ERR_INVALID_REQUEST if close_at<=open_at"]

  - method: GET
    path: "/procurement/rfqs/{id}"
    description: "Get an RFQ"
    roles: [ProcurementAdmin, Buyer, Approver]
    code: 200
    input: []
    output: RFQ
    side_effects: []

  - method: GET
    path: "/procurement/rfqs"
    description: "List RFQs, filterable by requisition or awarded quote"
    roles: [ProcurementAdmin, Buyer, Approver]
    code: 200
    input: ["requisition_id?", "awarded_quote_id?", "status?", "limit?", "offset?"]
    output: "RFQ[]"
    side_effects: []

  - method: POST
    path: "/procurement/rfqs/{id}/award"
    description: "Award an RFQ to a quote"
    roles: [Buyer]
    code: 200
    input: [awarded_quote_id]
    output: RFQ
    side_effects: ["requires Requisition APPROVED; status->AWARDED; awarded Quote->AWARDED; others->VOIDED"]

  - method: POST
    path: "/procurement/rfqs/{id}/cancel"
    description: "Cancel an RFQ"
    roles: [Buyer]
    code: 200
    input: []
    output: RFQ
    side_effects: ["status->CANCELLED; SUBMITTED quotes->VOIDED"]

  - method: POST
    path: "/procurement/rfqs/{id}/close_no_award"
    description: "Close an RFQ with no award"
    roles: [Buyer]
    code: 200
    input: []
    output: RFQ
    side_effects: ["status->CLOSED_NO_AWARD; SUBMITTED quotes->VOIDED"]

  # --- Quote ---
  - method: POST
    path: "/procurement/quotes"
    description: "Submit a vendor quote against an RFQ"
    roles: [Buyer]
    code: 201
    input: [rfq_id, vendor_id, submitted_at, unit_prices]
    output: Quote
    side_effects: ["status=SUBMITTED; compute quoted_total_cents; ERR_QUOTE_OUTSIDE_WINDOW if submitted_at outside [open_at,close_at)"]

  - method: GET
    path: "/procurement/quotes/{id}"
    description: "Get a quote"
    roles: [ProcurementAdmin, Buyer, Approver]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: GET
    path: "/procurement/quotes"
    description: "List quotes, filterable by rfq or vendor"
    roles: [ProcurementAdmin, Buyer, Approver]
    code: 200
    input: ["rfq_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: "Quote[]"
    side_effects: []

  # --- PurchaseOrder ---
  - method: POST
    path: "/procurement/purchase-orders"
    description: "Issue a STANDARD or BLANKET purchase order"
    roles: [Buyer]
    code: 201
    input: [vendor_id, spend_category_id, po_type, requisition_id?, source_quote_id?, ceiling_amount_cents?, valid_from?, valid_to?]
    output: PurchaseOrder
    side_effects: ["STANDARD: requires Requisition APPROVED + awarded source_quote_id; copy lines; compute total_amount_cents, committed_total on requisition; set is_maverick; BLANKET: set remaining_amount_cents=ceiling, enforce ERR_BLANKET_PERIOD_OVERLAP; status=ISSUED"]

  - method: GET
    path: "/procurement/purchase-orders/{id}"
    description: "Get a purchase order"
    roles: [ProcurementAdmin, Buyer, Approver, Receiver, Matcher, PayablesClerk]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: GET
    path: "/procurement/purchase-orders"
    description: "List purchase orders, filterable by vendor / category / requisition / source quote"
    roles: [ProcurementAdmin, Buyer, Approver, Receiver, Matcher, PayablesClerk]
    code: 200
    input: ["vendor_id?", "spend_category_id?", "requisition_id?", "source_quote_id?", "po_type?", "status?", "is_maverick?", "limit?", "offset?"]
    output: "PurchaseOrder[]"
    side_effects: []

  - method: POST
    path: "/procurement/purchase-orders/{id}/close"
    description: "Close a purchase order"
    roles: [Buyer]
    code: 200
    input: ["force?"]
    output: PurchaseOrder
    side_effects: ["STANDARD: requires fully received unless force; BLANKET: requires no OPEN releases; status->CLOSED"]

  - method: POST
    path: "/procurement/purchase-orders/{id}/cancel"
    description: "Cancel a purchase order"
    roles: [Buyer]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["requires no POSTED receipts; BLANKET cascade-cancels OPEN releases restoring remaining_amount_cents; status->CANCELLED"]

  # --- ReleaseOrder ---
  - method: POST
    path: "/procurement/release-orders"
    description: "Create a release against a blanket PO (OCC on the blanket version)"
    roles: [Buyer]
    code: 201
    input: [blanket_po_id, amount_cents, lines, expected_purchase_order_version]
    output: ReleaseOrder
    side_effects: ["status=OPEN; blanket remaining_amount_cents-=amount_cents; increments PurchaseOrder.version by 1; ERR_STALE_VERSION/ERR_RELEASE_EXCEEDS_CEILING/ERR_NOT_BLANKET_PO enforced"]

  - method: GET
    path: "/procurement/release-orders/{id}"
    description: "Get a release order"
    roles: [ProcurementAdmin, Buyer, Receiver, Matcher]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects: []

  - method: GET
    path: "/procurement/release-orders"
    description: "List release orders, filterable by blanket PO"
    roles: [ProcurementAdmin, Buyer, Receiver, Matcher]
    code: 200
    input: ["blanket_po_id?", "status?", "limit?", "offset?"]
    output: "ReleaseOrder[]"
    side_effects: []

  - method: POST
    path: "/procurement/release-orders/{id}/cancel"
    description: "Cancel a release order"
    roles: [Buyer]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects: ["requires no POSTED receipts; blanket remaining_amount_cents+=amount_cents; increments PurchaseOrder.version by 1; status->CANCELLED"]

  # --- GoodsReceipt ---
  - method: POST
    path: "/procurement/goods-receipts"
    description: "Post a goods receipt against a PO (and release if blanket)"
    roles: [Receiver]
    code: 201
    input: [purchase_order_id, release_order_id?, received_lines, received_at]
    output: GoodsReceipt
    side_effects: ["status=POSTED, posted_by_id=X-User-ID; increment PO line received_total; may flip ReleaseOrder->RECEIVED; ERR_RECEIPT_OVER_TOLERANCE / ERR_SEGREGATION_OF_DUTIES enforced"]

  - method: GET
    path: "/procurement/goods-receipts/{id}"
    description: "Get a goods receipt"
    roles: [ProcurementAdmin, Buyer, Receiver, Matcher, PayablesClerk]
    code: 200
    input: []
    output: GoodsReceipt
    side_effects: []

  - method: GET
    path: "/procurement/goods-receipts"
    description: "List goods receipts, filterable by PO or release"
    roles: [ProcurementAdmin, Buyer, Receiver, Matcher, PayablesClerk]
    code: 200
    input: ["purchase_order_id?", "release_order_id?", "status?", "limit?", "offset?"]
    output: "GoodsReceipt[]"
    side_effects: []

  - method: POST
    path: "/procurement/goods-receipts/{id}/reverse"
    description: "Reverse a goods receipt"
    roles: [Receiver]
    code: 200
    input: []
    output: GoodsReceipt
    side_effects: ["requires no MATCHED/EXCEPTION invoice; decrement PO line received_total; may revert ReleaseOrder->OPEN; status->REVERSED"]

  # --- Invoice ---
  - method: POST
    path: "/procurement/invoices"
    description: "Record a vendor invoice (UNMATCHED, payment PENDING)"
    roles: [PayablesClerk]
    code: 201
    input: [vendor_id, purchase_order_id, goods_receipt_id, invoice_number, lines]
    output: Invoice
    side_effects: ["match_status=UNMATCHED, payment_status=PENDING; compute invoice_total_cents; ERR_INVALID_REQUEST if invoice_number duplicate for vendor"]

  - method: GET
    path: "/procurement/invoices/{id}"
    description: "Get an invoice"
    roles: [ProcurementAdmin, Buyer, Matcher, PayablesClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/procurement/invoices"
    description: "List invoices, filterable by vendor / PO / receipt"
    roles: [ProcurementAdmin, Buyer, Matcher, PayablesClerk]
    code: 200
    input: ["vendor_id?", "purchase_order_id?", "goods_receipt_id?", "match_status?", "payment_status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/procurement/invoices/{id}/match"
    description: "Run the 3-way match"
    roles: [Matcher]
    code: 200
    input: []
    output: Invoice
    side_effects: ["PASS: match_status=MATCHED; FAIL: match_status=EXCEPTION, cascade create MatchException -> bump Vendor.exception_count -> maybe PROBATION"]

  - method: POST
    path: "/procurement/invoices/{id}/approve-payment"
    description: "Approve a matched invoice for payment"
    roles: [PayablesClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["requires match_status==MATCHED; payment_status=APPROVED_FOR_PAY"]

  - method: POST
    path: "/procurement/invoices/{id}/reject-payment"
    description: "Reject an invoice for payment"
    roles: [PayablesClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["payment_status=REJECTED"]

  - method: POST
    path: "/procurement/invoices/{id}/pay"
    description: "Mark an approved invoice paid"
    roles: [PayablesClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["requires payment_status==APPROVED_FOR_PAY; payment_status=PAID"]

  # --- MatchException (reverse-reachability for Invoice FK) ---
  - method: GET
    path: "/procurement/match-exceptions/{id}"
    description: "Get a match exception"
    roles: [ProcurementAdmin, Buyer, Matcher, PayablesClerk]
    code: 200
    input: []
    output: MatchException
    side_effects: []

  - method: GET
    path: "/procurement/match-exceptions"
    description: "List match exceptions, filterable by invoice or vendor"
    roles: [ProcurementAdmin, Buyer, Matcher, PayablesClerk]
    code: 200
    input: ["invoice_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: "MatchException[]"
    side_effects: []

  - method: POST
    path: "/procurement/match-exceptions/{id}/resolve"
    description: "Resolve a match exception"
    roles: [Matcher]
    code: 200
    input: []
    output: MatchException
    side_effects: ["status->RESOLVED; recompute Vendor.exception_count -> maybe PROBATION->APPROVED; if no OPEN exceptions remain, Invoice match_status EXCEPTION->MATCHED"]

  - method: POST
    path: "/procurement/match-exceptions/{id}/waive"
    description: "Waive a match exception"
    roles: [Matcher]
    code: 200
    input: []
    output: MatchException
    side_effects: ["requires waiver != receipt poster; status->WAIVED; recompute Vendor.exception_count; maybe Invoice EXCEPTION->MATCHED"]

  # --- VendorScorecard (reverse-reachability for Vendor FK) ---
  - method: POST
    path: "/procurement/vendor-scorecards"
    description: "Create an immutable vendor scorecard snapshot for a period"
    roles: [ProcurementAdmin]
    code: 201
    input: [vendor_id, period_start, period_end, on_time_variant?]
    output: VendorScorecard
    side_effects: ["compute on_time_rate_pct, price_compliance_pct, exception_pct, composite_score; status=FINAL; ERR_SCORECARD_PERIOD_OVERLAP enforced"]

  - method: GET
    path: "/procurement/vendor-scorecards/{id}"
    description: "Get a vendor scorecard"
    roles: [ProcurementAdmin, Buyer, Approver]
    code: 200
    input: []
    output: VendorScorecard
    side_effects: []

  - method: GET
    path: "/procurement/vendor-scorecards"
    description: "List vendor scorecards, filterable by vendor"
    roles: [ProcurementAdmin, Buyer, Approver]
    code: 200
    input: ["vendor_id?", "limit?", "offset?"]
    output: "VendorScorecard[]"
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/procurement/_clock/set_current_utc"
    description: "Set the server clock for deterministic time-based tests"
    roles: [ProcurementAdmin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["server now() returns to_iso8601 for subsequent created_at stamping"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is valid but not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, non-positive quantity/price, invalid enum, missing required field, blanket missing ceiling/validity, release line sum != amount_cents, duplicate code/tax_id/invoice_number, director<approval threshold" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same actor performs two duties that must be separated (requester approves own req; buyer posts own receipt; receipt poster waives the exception)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the transition is allowed" }
  - { id: ERR_NOT_BLANKET_PO, http: 409, condition: "ReleaseOrder.blanket_po_id references a non-BLANKET purchase order" }
  - { id: ERR_REQUISITION_NOT_APPROVED, http: 409, condition: "RFQ award attempted while the requisition is not APPROVED" }
  - { id: ERR_QUOTE_OUTSIDE_WINDOW, http: 409, condition: "Quote.submitted_at falls outside the RFQ half-open [open_at, close_at) window" }
  - { id: ERR_BLANKET_PERIOD_OVERLAP, http: 409, condition: "New blanket PO validity interval overlaps an existing ISSUED blanket for the same vendor+category (closed interval, adjacency counts)" }
  - { id: ERR_SCORECARD_PERIOD_OVERLAP, http: 409, condition: "New scorecard period overlaps an existing scorecard period for the same vendor (half-open, adjacency allowed)" }
  - { id: ERR_APPROVAL_INCOMPLETE, http: 409, condition: "Requisition cannot be APPROVED while a required ApprovalStep is still PENDING" }
  - { id: ERR_RECEIPT_OVER_TOLERANCE, http: 409, condition: "Cumulative received_qty per sku exceeds ordered quantity beyond receipt tolerance" }
  - { id: ERR_RELEASE_EXCEEDS_CEILING, http: 409, condition: "Release amount_cents exceeds blanket remaining_amount_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_purchase_order_version does not equal the blanket PO's current version" }
  - { id: ERR_NO_RECEIPT, http: 409, condition: "Invoice match attempted without a POSTED GoodsReceipt referenced by goods_receipt_id" }
  - { id: ERR_INVOICE_NOT_MATCHED, http: 409, condition: "Payment approval attempted on an invoice whose match_status is not MATCHED" }
  - { id: ERR_PO_NOT_FULLY_RECEIVED, http: 409, condition: "STANDARD PO close attempted before full receipt and without force" }
  - { id: ERR_BLANKET_HAS_OPEN_RELEASES, http: 409, condition: "BLANKET PO close attempted while OPEN releases remain" }
  - { id: ERR_PO_HAS_RECEIPTS, http: 409, condition: "PO cancel attempted while POSTED receipts reference it" }
  - { id: ERR_RELEASE_HAS_RECEIPTS, http: 409, condition: "Release cancel attempted while POSTED receipts reference it" }
  - { id: ERR_RECEIPT_HAS_INVOICE, http: 409, condition: "Receipt reverse attempted while a MATCHED/EXCEPTION invoice references it" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ProcurementAdmin
    description: "Master-data and vendor governance: spend categories, vendor registration/block, scorecards, clock"
    identity: opaque
    exclusive_operations:
      - "POST /procurement/spend-categories — Create category"
      - "POST /procurement/spend-categories/{id}/archive — Archive category"
      - "POST /procurement/vendors — Register vendor"
      - "POST /procurement/vendors/{id}/block — Block vendor"
      - "POST /procurement/vendor-scorecards — Create scorecard"
      - "POST /procurement/_clock/set_current_utc — Set clock"
    shared_operations:
      - "GET reads across resources"

  - name: Buyer
    description: "Raises requisitions, runs RFQ/quotes, issues POs and releases. Cannot approve own requisition or post receipts against it."
    identity: opaque
    exclusive_operations:
      - "POST /procurement/requisitions — Create requisition"
      - "POST /procurement/requisitions/{id}/submit — Submit"
      - "POST /procurement/requisitions/{id}/revise — Revise"
      - "POST /procurement/requisitions/{id}/cancel — Cancel"
      - "POST /procurement/rfqs — Open RFQ"
      - "POST /procurement/quotes — Submit quote"
      - "POST /procurement/rfqs/{id}/award — Award RFQ"
      - "POST /procurement/rfqs/{id}/cancel — Cancel RFQ"
      - "POST /procurement/rfqs/{id}/close_no_award — Close RFQ no award"
      - "POST /procurement/purchase-orders — Issue PO"
      - "POST /procurement/purchase-orders/{id}/close — Close PO"
      - "POST /procurement/purchase-orders/{id}/cancel — Cancel PO"
      - "POST /procurement/release-orders — Create release"
      - "POST /procurement/release-orders/{id}/cancel — Cancel release"
    shared_operations:
      - "GET reads across resources"

  - name: Approver
    description: "Approves or rejects requisition approval steps per the matrix. Cannot approve a requisition they raised (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /procurement/requisitions/{id}/approve — Decide approval step"
      - "POST /procurement/requisitions/{id}/reject — Reject requisition"
    shared_operations:
      - "GET reads across resources"

  - name: Receiver
    description: "Posts and reverses goods receipts. Cannot be the requisition requester of the PO being received (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /procurement/goods-receipts — Post receipt"
      - "POST /procurement/goods-receipts/{id}/reverse — Reverse receipt"
    shared_operations:
      - "GET reads across resources"

  - name: Matcher
    description: "Runs 3-way match and resolves/waives exceptions. Cannot waive an exception on a receipt they posted (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /procurement/invoices/{id}/match — Run 3-way match"
      - "POST /procurement/match-exceptions/{id}/resolve — Resolve exception"
      - "POST /procurement/match-exceptions/{id}/waive — Waive exception"
    shared_operations:
      - "GET reads across resources"

  - name: PayablesClerk
    description: "Records invoices and drives the payment dimension (approve/reject/pay)."
    identity: opaque
    exclusive_operations:
      - "POST /procurement/invoices — Record invoice"
      - "POST /procurement/invoices/{id}/approve-payment — Approve for pay"
      - "POST /procurement/invoices/{id}/reject-payment — Reject for pay"
      - "POST /procurement/invoices/{id}/pay — Pay"
    shared_operations:
      - "GET reads across resources"
