            - { call: "POST /api/applications/${app}/consent", payload: {}, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /api/applications/${app}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${app}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/applications/${app}/record-searches", payload: { credit_score: 700, records: [] }, as: Screener }
          trigger:
            - call: "POST /api/applications/${app}/score"
              payload: {}
              as: Applicant
              as_user_id: "${ap}"
              captures: { err: "$.data.error_id" }
          assert:
            - "captured ${err} == ERR_UNAUTHORIZED_ROLE (http 403)"
            - "ScreeningApplication.${app}.status remains SCREENING and recommendation remains null"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: publish_increments_landlord_version_and_visible_immediately
        claim_type: version_increment_on_write
        grounds:
          - concurrency_rules[criteria-publish-stale-landlord]
          - entities.Landlord.fields.fee_balance_cents
        distinguishing_aspect: "OCC happy path: publish with the current expected_landlord_version (1) succeeds, the response immediately shows status PUBLISHED (immediate consistency), and a follow-up GET shows landlord.version advanced by exactly 1 (1 -> 2) — the increment that makes the next stale publish fail."
        test_recipe:
          setup: ["Landlord created (version captured as ll_v == 1); one DRAFT criteria"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Occ2", contact_email: "locc2@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", ll_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR1", disclosure_summary: "Standard criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { cr: "$.data.id" }
          trigger:
            - call: "POST /api/criteria/${cr}/publish"
              payload: { expected_landlord_version: "${ll_v}" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { st: "$.data.status", pub: "$.data.published_at" }
            - call: "GET /api/landlords/${ll}"
              payload: {}
              as: ComplianceAdmin
              captures: { v_after: "$.data.version" }
          assert:
            - "captured ${st} == PUBLISHED (visible in the same response, no re-read) and ${pub} == 2026-08-01T00:00:00Z"
            - "captured ${v_after} == 2 (exactly one increment: 1 -> 2)"

      - name: cascade_chains_covered_by_difficulty
        claim_type: cascade_chain
        grounds:
          - state_machines.Dispute.UNDER_REINVESTIGATION_to_RESOLVED_CORRECTED
          - state_machines.ScreeningApplication.status.SCREENING_to_CANCELLED
        excluded_because:
          difficulty_instance: dispute_correction_cascade_reopens_decision
          rationale: "The cascading_side_effects layer is exercised end-to-end by §1.8 instances dispute_correction_cascade_reopens_decision (record -> report -> application -> reconsideration flag) and landlord_suspension_cascade_refunds_undelivered (landlord -> application -> report -> fee refund)."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant
        grounds:
          - calculations.rent_to_income_ratio
          - calculations.guarantor_qualification
        excluded_because:
          difficulty_instance: soi_adjusted_ratio_vs_standard_ratio
          rationale: "The dual_variant_calculation layer is covered by §1.8 instances soi_adjusted_ratio_vs_standard_ratio (jurisdiction-selected ratio variant) and guarantor_policy_combined_vs_independent (criteria-selected guarantor variant), including the selection context for each variant."

      - name: threshold_boundaries_covered_by_difficulty
        claim_type: threshold_boundary
        grounds:
          - calculations.rent_to_income_ratio
          - calculations.record_suppression_sweep
        excluded_because:
          difficulty_instance: income_ratio_exact_threshold_passes
          rationale: "The rate_threshold_triggers layer's inclusive/exclusive boundaries are covered by §1.8 instances income_ratio_exact_threshold_passes (>= 600000 passes, 599999 fails) and record_exactly_at_lookback_cutoff_included (strictly-older suppression); the identity evidence boundary is additionally covered by corner instance identity_evidence_threshold_boundary."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: state_change_visible_in_same_response
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ScreeningApplication.status.DRAFT_to_WITHDRAWN
        distinguishing_aspect: "Immediate consistency: the withdraw response itself carries status == WITHDRAWN (no re-read needed), a follow-up GET returns the same state, and updated_at is refreshed by the mutation."
        test_recipe:
          setup: ["Landlord + applicant + one DRAFT application"]
          setup_api_calls:
            - call: "POST /api/landlords"
              payload: { name: "L Imm", contact_email: "limm@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann Imm", dob: "1990-01-01T00:00:00Z", email: "aimm@x.com", ssn_last4: "1111", residence_state: "TX" }
              as: Screener
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { app: "$.data.id" }
          trigger:
            - call: "POST /api/applications/${app}/withdraw"
              payload: {}
              as: Landlord
              as_user_id: "${ll}"
              captures: { st_resp: "$.data.status", ver_resp: "$.data.version" }
            - call: "GET /api/applications/${app}"
              payload: {}
              as: ComplianceAdmin
              captures: { st_get: "$.data.status" }
          assert:
            - "captured ${st_resp} == WITHDRAWN (mutation visible in the same response)"
            - "captured ${st_get} == WITHDRAWN (subsequent read agrees)"
            - "captured ${ver_resp} == 2 (created at 1, withdraw incremented it exactly once)"
