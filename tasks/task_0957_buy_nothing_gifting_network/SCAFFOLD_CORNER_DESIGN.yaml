  # ===========================================================================
  - section: calculations
    instances:
      - name: reputation_variant_divergence
        claim_type: variant_divergence
        grounds: ["calculations.calc_reputation_score"]
        excluded_because:
          difficulty_instance: reputation_pending_vs_settled
          rationale: "Variant divergence (official vs provisional) asserted directly by the named §1.8 instance."

      - name: claim_queue_rank_variant_divergence
        claim_type: variant_divergence
        grounds: ["calculations.calc_claim_queue_rank"]
        excluded_because:
          difficulty_instance: claim_queue_fifo_vs_fairness_promotion
          rationale: "FIFO vs FAIRNESS_DRAW divergence on identical queue contents asserted by the named §1.8 instance."

      - name: fairness_score_value_progression
        claim_type: correct_result
        grounds: ["calculations.calc_fairness_score"]
        excluded_because:
          difficulty_instance: fairness_score_piecewise_inputs
          rationale: "Correct-result values (50 -> 40 -> 30) pinned by the named §1.8 instance."

      - name: reputation_rounding_order_value
        claim_type: precision
        grounds: ["calculations.calc_reputation_score"]
        excluded_because:
          difficulty_instance: reputation_per_event_rounding_order
          rationale: "Per-event-then-sum rounding pinned to 8.4 by the named §1.8 instance."

      - name: sla_due_at_yellow_tier_default
        claim_type: constants_applied
        grounds: ["calculations.calc_group_health", "entities.Report.fields.sla_due_at"]
        distinguishing_aspect: "A fresh group has health_score 0 -> YELLOW tier, so a report created then gets sla_due_at = created_at + 72h; the tier in effect at creation is pinned even if health changes later."
