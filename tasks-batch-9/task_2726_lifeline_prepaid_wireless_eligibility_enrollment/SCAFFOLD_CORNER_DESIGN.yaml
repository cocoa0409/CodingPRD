              payload: { sample_size: 3 }
              as: ComplianceAuditor
              as_user_id: "AUD-1"
              captures: { sb1_id: "$.data[0].id", sb1_line: "$.data[0].claimed_line_cents", sb2_id: "$.data[1].id", sb3_id: "$.data[2].id", sb3_line: "$.data[2].claimed_line_cents" }
          trigger:
            - call: "POST /lifeline/audit-samples/${sa1_id}/adjudicate"
              payload: { finding: "COMPLIANT", finding_note: "documentation complete" }
              as: ComplianceAuditor
              as_user_id: "AUD-2"
            - call: "POST /lifeline/audit-samples/${sa2_id}/adjudicate"
              payload: { finding: "NON_USAGE_UNCURED", finding_note: "no usage in the service month" }
              as: ComplianceAuditor
              as_user_id: "AUD-2"
              captures: { sa2_disallowed: $.data.disallowed_support_cents }
            - call: "GET /lifeline/reimbursement-claims/${ca_id}"
              payload: {}
              as: ComplianceAuditor
              captures: { ca_status: $.data.status, ca_penalty: $.data.penalty_cents, ca_recoup: $.data.recoupment_amount_cents, ca_net: $.data.net_payable_cents, ca_failed: $.data.failed_sample_count }
            - call: "POST /lifeline/audit-samples/${sb3_id}/adjudicate"
              payload: { finding: "COMPLIANT", finding_note: "documentation complete" }
              as: ComplianceAuditor
              as_user_id: "AUD-2"
            - call: "POST /lifeline/audit-samples/${sb1_id}/adjudicate"
              payload: { finding: "NON_USAGE_UNCURED", finding_note: "no usage in the service month" }
              as: ComplianceAuditor
              as_user_id: "AUD-2"
            - call: "GET /lifeline/reimbursement-claims/${cb_id}"
              payload: {}
              as: ComplianceAuditor
              captures: { cb_mid_penalty: $.data.penalty_cents, cb_mid_recoup: $.data.recoupment_amount_cents, cb_mid_net: $.data.net_payable_cents }
            - call: "POST /lifeline/audit-samples/${sb2_id}/adjudicate"
              payload: { finding: "NON_USAGE_UNCURED", finding_note: "no usage in the service month" }
              as: ComplianceAuditor
              as_user_id: "AUD-2"
            - call: "GET /lifeline/reimbursement-claims/${cb_id}"
              payload: {}
              as: ComplianceAuditor
              captures: { cb_status: $.data.status, cb_penalty: $.data.penalty_cents, cb_recoup: $.data.recoupment_amount_cents, cb_net: $.data.net_payable_cents, cb_failed: $.data.failed_sample_count }
          assert:
            - "${ca_prov} == 1000 and ${ca_final} == 1000 with ${ca_var} == 0 and ${ca_covered} == 2 (600 for 15 days + 400 for 10 days, each line rounded before the sum)"
            - "${cb_final} == 2250 and ${cb_covered} == 3 (925 + 925 + 400)"
            - "${sa1_line} == 600 and ${sa2_line} == 400 - EA1 outranks EA2 on benefit_start_date ASC"
            - "${sb1_line} == 925 and ${sb3_line} == 400"
            - "${sa2_disallowed} == 400 - the disallowed line is the sampled line, not the extrapolation"
            - "${ca_status} == AUDIT_FAILED with ${ca_failed} == 1 of 2 samples"
            - "carrier A extrapolates round_half_up(1000 * 1/2) == 500, which is exactly PENALTY_TIER_1_CENTS, so PENALTY_RATE_MID 0.10 applies: ${ca_penalty} == 50, ${ca_recoup} == 550 and ${ca_net} == 450"
            - "after carrier B's first failure the rate is 1/3: extrapolated 750, ${cb_mid_penalty} == 75, ${cb_mid_recoup} == 825 and ${cb_mid_net} == 1425 - still the MID tier"
            - "${cb_status} == AUDIT_FAILED with ${cb_failed} == 2 of 3 samples"
            - "carrier B extrapolates round_half_up(2250 * 2/3) == 1500, which is exactly PENALTY_TIER_2_CENTS, so PENALTY_RATE_HIGH 0.20 applies: ${cb_penalty} == 300, ${cb_recoup} == 1800 and ${cb_net} == 450"
            - "Provider.${pa_id}.claim_gross_cents == 1000, recouped_cents == 550, net_reimbursed_cents == 450 and audit_hold_flag == true"
            - "Provider.${pb_id}.claim_gross_cents == 2250, recouped_cents == 1800, net_reimbursed_cents == 450 and audit_hold_flag == true"
            - "Enrollment.${ea2_id}.benefit_status == ACTIVE and Enrollment.${eb1_id}.benefit_status == ACTIVE - NON_USAGE_UNCURED is a claim finding and de-enrolls nobody"

      - name: multi_level_cascade_chain_covered_by_difficulty_rule_4
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / audit_fail_cascades_claim_then_provider_ledger_then_other_filed_claim_to_held
          rationale: "The named §1.8 instance walks the deepest declared chain (sample -> claim -> provider ledger -> a second FILED claim moving to HELD) end to end with ordering-sensitive asserts at every level, which is exactly this layer's claim set."

      - name: dual_variant_delta_on_switch_covered_by_difficulty_rule_1
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_provisional_vs_final_support_diverges_on_reimbursement_claim
          rationale: "Both variants and the variance delta written at the provisional -> final switch are asserted as literals by the named §1.8 instance; the second dual-variant calculation (recertification income) is covered by its sibling instance in the same rule."

  # =========================================================================
  # SECTION 9 - consistency_model
  # (claim-extraction-guide "From Consistency Model"; §1.7 declares
  #  consistency_model: immediate, so only the immediate row applies)
  # =========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_current_in_the_writes_own_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /lifeline/enrollments/{id}/device-issuance]
          - endpoints[POST /lifeline/reimbursement-claims/{id}/file]
          - calculations.provider_ledger_reconciliation
          - calculations.enrollment_audit_risk_score
        distinguishing_aspect: |
          Nothing in this program is allowed to settle lazily. A write's own response already
          carries the values recomputed by that write (the filing response states
          final_amount_cents and variance_cents without a re-read), the counters it touched on
          OTHER rows are current on the very next read with no sweep, clock move or second
          request in between, and reading twice changes nothing - the repeat read returns the
          same version and the same derived numbers, which rules out a recompute-on-read
          implementation that would drift the version.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-02T00:00:00Z; one ACTIVE carrier licensed in TX with cap 50."
            - "One VOICE enrollment with an explicit benefit_start_date of 2026-06-01 (30 support days in the closed month 2026-06), device_status AWAITING_DEVICE."
            - "One IN_STOCK handset in the carrier's inventory."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143186", study_area_code: "489186", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr_id: $.data.id, addr_status: $.data.status }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-U8" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { chk_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub_id}", provider_id: "${prov_id}", eligibility_check_id: "${chk_id}", certified_address_id: "${addr_id}", service_type: "VOICE", one_per_household_attested: true, benefit_start_date: "2026-06-01T00:00:00Z" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { enr_id: $.data.id, risk_0: $.data.audit_risk_score }
            - call: "POST /lifeline/providers/${prov_id}/devices"
              payload: { imei: "350000000000122", model_tier: "BASIC", unit_cost_cents: 2100 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { dev_id: $.data.id, dev_status_0: $.data.status }
          trigger:
            - call: "POST /lifeline/enrollments/${enr_id}/device-issuance"
              payload: { device_id: "${dev_id}" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { dev_status_1: $.data.status, dev_enr: $.data.issued_enrollment_id, dev_issued_at: $.data.issued_at }
            - call: "GET /lifeline/enrollments/${enr_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { enr_devstat: $.data.device_status, enr_issued_at: $.data.last_device_issued_at, enr_count: $.data.device_issuance_count, risk_1: $.data.audit_risk_score, enr_ver_a: $.data.version }
            - call: "GET /lifeline/enrollments/${enr_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { risk_2: $.data.audit_risk_score, enr_ver_b: $.data.version }
            - call: "GET /lifeline/providers/${prov_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { stock_1: $.data.devices_in_stock_count, issued_1: $.data.devices_issued_count, total_1: $.data.devices_total_count, prov_ver: $.data.version, gross_0: $.data.claim_gross_cents }
            - call: "POST /lifeline/reimbursement-claims"
              payload: { provider_id: "${prov_id}", service_month: "2026-06", expected_provider_version: "${prov_ver}" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { claim_id: $.data.id, prov_amt: $.data.provisional_amount_cents, final_0: $.data.final_amount_cents, var_0: $.data.variance_cents }
            - call: "POST /lifeline/reimbursement-claims/${claim_id}/file"
              payload: { certifying_officer_ref: "OFFICER-27" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { claim_status: $.data.status, final_1: $.data.final_amount_cents, var_1: $.data.variance_cents, filed_at: $.data.filed_at }
            - call: "GET /lifeline/providers/${prov_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { gross_1: $.data.claim_gross_cents, recouped_1: $.data.recouped_cents, net_1: $.data.net_reimbursed_cents, open_1: $.data.open_claim_count, hold_1: $.data.audit_hold_flag }
            - call: "GET /lifeline/reimbursement-claims/${claim_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { final_2: $.data.final_amount_cents, var_2: $.data.variance_cents, status_2: $.data.status }
          assert:
            - "${addr_status} == UNVERIFIED and ${risk_0} == 0 and ${dev_status_0} == IN_STOCK"
            - "the issuance response itself already reads ${dev_status_1} == ISSUED, ${dev_enr} == ${enr_id} and ${dev_issued_at} == 2026-07-02T00:00:00.000Z"
            - "the immediately following read shows ${enr_devstat} == DEVICE_ISSUED, ${enr_count} == 1, ${enr_issued_at} == 2026-07-02T00:00:00.000Z and ${risk_1} == 10 - the cross-entity effect needed no second write"
            - "${risk_2} == ${risk_1} and ${enr_ver_b} == ${enr_ver_a} - repeating a read neither recomputes nor bumps anything"
            - "${stock_1} == 0, ${issued_1} == 1 and ${total_1} == 1 - the carrier counters were current on the first read after the issuance"
            - "${gross_0} == 0 while the claim is still a DRAFT"
            - "${prov_amt} == 925 with ${final_0} == 0 and ${var_0} == null at draft time"
            - "the filing response itself carries ${claim_status} == FILED, ${final_1} == 925, ${var_1} == 0 and ${filed_at} == 2026-07-02T00:00:00.000Z, so no re-read is needed to learn the settled amount"
            - "${gross_1} == 925, ${recouped_1} == 0, ${net_1} == 925, ${open_1} == 1 and ${hold_1} == false on the first read after the filing"
            - "${final_2} == ${final_1}, ${var_2} == ${var_1} and ${status_2} == FILED - the persisted row equals what the write returned"
