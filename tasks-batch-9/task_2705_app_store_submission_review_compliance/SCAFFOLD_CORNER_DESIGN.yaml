              payload: { outcome: "METADATA_REJECT", rejection_reasons: [{ guideline_rule_id: "${rule_id}", reason_code: "SCREENSHOT_TEXT_MISLEADING", severity: "MINOR", detail: "The first screenshot advertises a feature that is not in this build." }] }
