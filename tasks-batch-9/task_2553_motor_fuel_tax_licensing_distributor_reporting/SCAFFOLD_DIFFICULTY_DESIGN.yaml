# SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Task 2553 - Motor Fuel Tax Licensing & Distributor Reporting
# Test-targeting index for SCAFFOLD.yaml (SKILL.md 1.8). Nine 0.5 rule_ids, >= 2 instances each.
# Every grounds ref resolves into SCAFFOLD.yaml 1.1-1.7; every recipe drives empty-DB -> assert
# using only endpoints declared in 1.5. Logical clock default is 2026-08-01T00:00:00Z.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: rack_basis_net_vs_gross_diverges_on_deferred_tax
        grounds:
          - calculations.rack_removal_tax_imposition
          - entities.Licensee.fields.gross_net_election
          - entities.RackRemoval.fields.basis_used
          - entities.RackRemoval.fields.taxable_gallons
          - entities.RackRemoval.fields.deferred_tax_cents
        distinguishing_aspect: |
          Variant domain is the terminal-rack removal of physical product: the switch is the POSITION
          HOLDER's irrevocable gross_net_election, so two removals of the identical 8000.00 gross /
          7960.00 net load of UNDYED_DIESEL to the identical purchaser produce deferred_tax_cents
          245964 (NET) versus 247200 (GROSS), a 1236-cent delta, with basis_used recording which
          variant ran.
        test_recipe:
          setup:
            - "Two ACTIVE SUPPLIER position holders at the same terminal, one electing NET and one electing GROSS."
            - "One ACTIVE DISTRIBUTOR purchaser, fully bonded (posted 1500000 == required 1500000, deficiency 0), so the in-state deferral branch 2e is reachable."
            - "Logical clock left at its 2026-08-01T00:00:00Z default; both removals dated 2026-07-15."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Northline Fuel Supply LLC", fein: "41-1000001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_net_id: $.data.id, sup_net_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_net_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_net_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_net_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Bluestem Terminal Partners LP", fein: "41-1000003", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "GROSS" }
              as: LicensingOfficer
              captures: { sup_gross_id: $.data.id, sup_gross_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_gross_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_gross_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_gross_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Ridgeway Fuel Distribution Inc", fein: "41-1000002", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T41-MN-2553", name: "Saint Paul Park Rack", state_code: "MN" }
              as: LicensingOfficer
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /mft/rack-removals"
              payload: { terminal_id: "${term_id}", position_holder_licensee_id: "${sup_net_id}", purchaser_licensee_id: "${dist_id}", product_code: "UNDYED_DIESEL", gross_gallons: 8000.00, net_gallons: 7960.00, removal_date: "2026-07-15", destination_state: "MN", bill_of_lading_number: "BOL-NET-0001" }
              as: ReturnsExaminer
              captures: { rr_net_id: $.data.id }
            - call: "POST /mft/rack-removals"
              payload: { terminal_id: "${term_id}", position_holder_licensee_id: "${sup_gross_id}", purchaser_licensee_id: "${dist_id}", product_code: "UNDYED_DIESEL", gross_gallons: 8000.00, net_gallons: 7960.00, removal_date: "2026-07-15", destination_state: "MN", bill_of_lading_number: "BOL-GROSS-0001" }
              as: ReturnsExaminer
              captures: { rr_gross_id: $.data.id }
          assert:
            - "RackRemoval.${rr_net_id}.basis_used == NET"
            - "RackRemoval.${rr_net_id}.taxable_gallons == 7960.00"
            - "RackRemoval.${rr_net_id}.deferred_tax_cents == 245964"
            - "RackRemoval.${rr_gross_id}.basis_used == GROSS"
            - "RackRemoval.${rr_gross_id}.taxable_gallons == 8000.00"
            - "RackRemoval.${rr_gross_id}.deferred_tax_cents == 247200"
            - "RackRemoval.${rr_gross_id}.deferred_tax_cents - RackRemoval.${rr_net_id}.deferred_tax_cents == 1236"
            - "both rows carry imposition_point == DEFERRED_TO_PURCHASER, tax_imposed == false and tax_amount_cents == 0"
            - "Licensee.${dist_id}.balance_cents == 0 (a deferred removal posts no LedgerEntry)"

      - name: risk_score_variance_vs_frequency_weighted_flips_audit_selectability
        grounds:
          - calculations.licensee_risk_score
          - entities.AuditCase.fields.risk_score_variant
          - entities.AuditCase.fields.selection_score
          - validations[priority=408]
          - errors[ERR_RISK_SCORE_BELOW_THRESHOLD]
        distinguishing_aspect: |
          Variant domain is compliance scoring of a licensee's cross-match history (not a physical
          transaction): the same three OPEN 9999.00-gallon discrepancies score 60 under
          VARIANCE_WEIGHTED (29997.00 / 500 capped at 60) and 18 under FREQUENCY_WEIGHTED (3 * 6),
          so the identical licensee is audit-selectable under one variant and refused with
          ERR_RISK_SCORE_BELOW_THRESHOLD under the other.
        test_recipe:
          setup:
            - "One ACTIVE SUPPLIER and one ACTIVE DISTRIBUTOR, both fully bonded."
            - "Both file period 2026-08 returns; the supplier reports three SCH_5 product cells of 9999.00 gallons sold to the distributor, the distributor reports only 100.00 gallons of an unrelated product."
            - "A cross-match run for 2026-08 executed at clock 2026-09-05 creates three OPEN discrepancies of 9999.00 gallons each (each below the 10000.00 auto-escalation threshold), leaving open_discrepancy_count 3 and unreported_gallons_total 29997.00."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Northline Fuel Supply LLC", fein: "41-1000001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Ridgeway Fuel Distribution Inc", fein: "41-1000002", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${sup_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { s_ret_id: $.data.id }
            - call: "POST /mft/returns/${s_ret_id}/schedules"
              payload: { schedule_code: "SCH_5_DELIVERED_TAX_COLLECTED", product_code: "GASOLINE", total_gallons: 9999.00 }
              as: ReturnsExaminer
              captures: { s_sch_gas: $.data.id }
            - call: "POST /mft/schedules/${s_sch_gas}/lines"
              payload: { counterparty_licensee_id: "${dist_id}", transaction_type: "SALE", gallons: 9999.00, document_date: "2026-08-10", bill_of_lading_number: "BOL-S5-GAS-001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${s_ret_id}/schedules"
              payload: { schedule_code: "SCH_5_DELIVERED_TAX_COLLECTED", product_code: "UNDYED_DIESEL", total_gallons: 9999.00 }
              as: ReturnsExaminer
              captures: { s_sch_und: $.data.id }
            - call: "POST /mft/schedules/${s_sch_und}/lines"
              payload: { counterparty_licensee_id: "${dist_id}", transaction_type: "SALE", gallons: 9999.00, document_date: "2026-08-11", bill_of_lading_number: "BOL-S5-UND-001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${s_ret_id}/schedules"
              payload: { schedule_code: "SCH_5_DELIVERED_TAX_COLLECTED", product_code: "JET_FUEL", total_gallons: 9999.00 }
              as: ReturnsExaminer
              captures: { s_sch_jet: $.data.id }
            - call: "POST /mft/schedules/${s_sch_jet}/lines"
              payload: { counterparty_licensee_id: "${dist_id}", transaction_type: "SALE", gallons: 9999.00, document_date: "2026-08-12", bill_of_lading_number: "BOL-S5-JET-001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${s_ret_id}/file"
              payload: { attest_name: "S. Northline" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { d_ret_id: $.data.id }
            - call: "POST /mft/returns/${d_ret_id}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "BIODIESEL_B100", total_gallons: 100.00 }
              as: ReturnsExaminer
              captures: { d_sch_bio: $.data.id }
            - call: "POST /mft/schedules/${d_sch_bio}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100.00, document_date: "2026-08-13", bill_of_lading_number: "BOL-D1-BIO-001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${d_ret_id}/file"
              payload: { attest_name: "D. Ridgeway" }
              as: ReturnsExaminer
            - call: "POST /mft/cross-match-runs"
              payload: { period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { run_id: $.data.id }
          trigger:
            - call: "GET /mft/licensees/${dist_id}/risk-profile"
              payload: {}
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "RISK_SCORE", risk_score_variant: "FREQUENCY_WEIGHTED", period_start_month: "2026-08", period_end_month: "2026-08" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "RISK_SCORE", risk_score_variant: "VARIANCE_WEIGHTED", period_start_month: "2026-08", period_end_month: "2026-08" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_id: $.data.id }
          assert:
            - "CrossMatchRun.${run_id}.matched_cells_count == 3 and discrepancy_count == 3 and escalated_count == 0"
            - "CrossMatchRun.${run_id}.gross_unreported_gallons_total == 29997.00"
            - "Licensee.${dist_id}.open_discrepancy_count == 3 and unreported_gallons_total == 29997.00"
            - "GET /mft/licensees/${dist_id}/risk-profile returns risk_score_variance_weighted == 60"
            - "GET /mft/licensees/${dist_id}/risk-profile returns risk_score_frequency_weighted == 18 and audit_selection_threshold == 60"
            - "the FREQUENCY_WEIGHTED POST /mft/audit-cases returns 422 with error_id == ERR_RISK_SCORE_BELOW_THRESHOLD"
            - "the VARIANCE_WEIGHTED POST /mft/audit-cases returns 201 and AuditCase.${case_id}.selection_score == 60"
            - "AuditCase.${case_id}.case_status == OPEN and assessment_status == NONE"

  - rule_id: combinatorial_formula
    instances:
      - name: rack_imposition_branch_precedence_ladder
        grounds:
          - calculations.rack_removal_tax_imposition
          - entities.RackRemoval.fields.imposition_point
          - entities.ExemptionCertificate.fields.exemption_type
          - validations[priority=104]
        distinguishing_aspect: |
          Mode (a) - branch precedence: four removals that differ only in product, destination and
          certificate prove the STEP 2 ladder is evaluated strictly 2a > 2c > 2d > 2e/2f. A dyed
          out-of-state load lands NONE_EXEMPT (2a beats 2c), an undyed out-of-state load without an
          EXPORT certificate lands TERMINAL_RACK (2c beats 2e), an in-state load with a GOVERNMENT
          certificate lands NONE_EXEMPT (2d beats 2f), and an in-state load to an ACTIVE distributor
          lands DEFERRED_TO_PURCHASER.
        test_recipe:
          setup:
            - "One ACTIVE NET-electing SUPPLIER position holder and one terminal."
            - "One ACTIVE, fully bonded DISTRIBUTOR purchaser and one ACTIVE RETAILER government fleet purchaser (required bond 400000, posted 400000)."
            - "The government fleet holds an ACTIVE GOVERNMENT certificate valid 2026-01-01..2026-12-31, whose product set covers UNDYED_DIESEL."
            - "Logical clock left at its 2026-08-01T00:00:00Z default; every removal dated 2026-07-15."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Northline Fuel Supply LLC", fein: "41-1000001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Ridgeway Fuel Distribution Inc", fein: "41-1000002", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Dakota County Fleet Services", fein: "41-2000001", license_type: "RETAILER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { gov_id: $.data.id, gov_v0: $.data.version }
            - call: "POST /mft/licensees/${gov_id}/bonds"
              payload: { amount_cents: 400000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${gov_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${gov_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${gov_id}", exemption_type: "GOVERNMENT", document_number: "GOV-CERT-2553-A", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: LicensingOfficer
              captures: { gov_cert_id: $.data.id }
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T41-MN-2553", name: "Saint Paul Park Rack", state_code: "MN" }
              as: LicensingOfficer
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /mft/rack-removals"
              payload: { terminal_id: "${term_id}", position_holder_licensee_id: "${sup_id}", purchaser_licensee_id: "${dist_id}", product_code: "DYED_DIESEL", gross_gallons: 8000.00, net_gallons: 7960.00, removal_date: "2026-07-15", destination_state: "IA", bill_of_lading_number: "BOL-ORD-0001" }
              as: ReturnsExaminer
              captures: { rr_dyed_id: $.data.id }
            - call: "POST /mft/rack-removals"
              payload: { terminal_id: "${term_id}", position_holder_licensee_id: "${sup_id}", purchaser_licensee_id: "${dist_id}", product_code: "UNDYED_DIESEL", gross_gallons: 8000.00, net_gallons: 7960.00, removal_date: "2026-07-15", destination_state: "IA", bill_of_lading_number: "BOL-ORD-0002" }
              as: ReturnsExaminer
              captures: { rr_export_id: $.data.id }
            - call: "POST /mft/rack-removals"
              payload: { terminal_id: "${term_id}", position_holder_licensee_id: "${sup_id}", purchaser_licensee_id: "${gov_id}", exemption_certificate_id: "${gov_cert_id}", product_code: "UNDYED_DIESEL", gross_gallons: 8000.00, net_gallons: 7960.00, removal_date: "2026-07-15", destination_state: "MN", bill_of_lading_number: "BOL-ORD-0003" }
              as: ReturnsExaminer
              captures: { rr_gov_id: $.data.id }
            - call: "POST /mft/rack-removals"
              payload: { terminal_id: "${term_id}", position_holder_licensee_id: "${sup_id}", purchaser_licensee_id: "${dist_id}", product_code: "UNDYED_DIESEL", gross_gallons: 8000.00, net_gallons: 7960.00, removal_date: "2026-07-15", destination_state: "MN", bill_of_lading_number: "BOL-ORD-0004" }
              as: ReturnsExaminer
              captures: { rr_defer_id: $.data.id }
          assert:
            - "RackRemoval.${rr_dyed_id}.imposition_point == NONE_EXEMPT (branch 2a wins over the out-of-state branch 2c)"
            - "RackRemoval.${rr_dyed_id}.taxable_gallons == 0.00 and tax_amount_cents == 0 and deferred_tax_cents == 0 and tax_imposed == false"
            - "RackRemoval.${rr_export_id}.imposition_point == TERMINAL_RACK (branch 2c wins over the deferral branch 2e)"
            - "RackRemoval.${rr_export_id}.taxable_gallons == 7960.00 and tax_imposed == true and tax_amount_cents == 245964 and deferred_tax_cents == 0"
            - "RackRemoval.${rr_gov_id}.imposition_point == NONE_EXEMPT (branch 2d wins over the RETAILER fallback 2f)"
            - "RackRemoval.${rr_gov_id}.taxable_gallons == 0.00 and tax_amount_cents == 0"
            - "RackRemoval.${rr_defer_id}.imposition_point == DEFERRED_TO_PURCHASER with tax_imposed == false and deferred_tax_cents == 245964"
            - "all four rows carry basis_used == NET, taken from the position holder's election and never from the purchaser's"
            - "Licensee.${sup_id}.balance_cents == 0 and Licensee.${dist_id}.balance_cents == 0 (rack removals post no LedgerEntry)"

      - name: return_tax_due_single_rounding_per_product
        grounds:
          - calculations.monthly_return_tax_due
          - entities.MonthlyReturn.fields.tax_due_cents
          - entities.MonthlyReturn.fields.taxable_gallons_total
          - entities.ReturnSchedule.fields.total_gallons
        distinguishing_aspect: |
          Mode (b) - rounding/precision order: two SCH_2 UNDYED_DIESEL lines of 100.01 gallons must be
          summed to 200.02 gallons and multiplied by the 30.9 cent rate ONCE, giving tax_due_cents
          6181; the per-line rounding interpretation (3090 + 3090) would give 6180, exactly one cent
          short, so the assertion falsifies the wrong evaluation order.
        test_recipe:
          setup:
            - "One ACTIVE SUPPLIER counterparty and one ACTIVE DISTRIBUTOR filer, both fully bonded."
            - "Logical clock at 2026-09-05T00:00:00Z so the 2026-08 return (due 2026-09-20T23:59:59Z) is timely and interest/penalty stay 0."
            - "The distributor's 2026-08 return carries one SCH_2_RECEIVED_TAX_UNPAID UNDYED_DIESEL schedule with declared total 200.02 and two lines of 100.01 gallons."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Northline Fuel Supply LLC", fein: "41-1000001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Ridgeway Fuel Distribution Inc", fein: "41-1000002", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { d_ret_id: $.data.id }
            - call: "POST /mft/returns/${d_ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "UNDYED_DIESEL", total_gallons: 200.02 }
              as: ReturnsExaminer
              captures: { d_sch_und: $.data.id }
            - call: "POST /mft/schedules/${d_sch_und}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100.01, document_date: "2026-08-07", bill_of_lading_number: "BOL-D2-UND-001" }
              as: ReturnsExaminer
            - call: "POST /mft/schedules/${d_sch_und}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100.01, document_date: "2026-08-08", bill_of_lading_number: "BOL-D2-UND-002" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/returns/${d_ret_id}/file"
              payload: { attest_name: "D. Ridgeway" }
              as: ReturnsExaminer
          assert:
            - "MonthlyReturn.${d_ret_id}.filing_status == FILED and days_late == 0"
            - "MonthlyReturn.${d_ret_id}.taxable_gallons_total == 200.02"
