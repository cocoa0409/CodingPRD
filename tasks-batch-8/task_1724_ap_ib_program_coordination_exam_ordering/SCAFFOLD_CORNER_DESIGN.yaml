            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_DUPLICATE_AUTHORIZATION"

      - name: duplicate_application_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_APPLICATION]", entities.FeeReductionApplication]
        distinguishing_aspect: "At most one application per (student, cycle) ever — even a DENIED one blocks a fresh create (resubmit is the only re-open path)."
        test_recipe:
          setup: ["Cycle OPEN; student with a DENIED application"]
