  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: machine_slot_half_open_overlap_vs_adjacent_ok
        grounds:
          - validations[priority=9]
          - state_machines.MachineSlot
          - entities.MachineSlot.fields.start_min
          - entities.MachineSlot.fields.end_min
          - errors[ERR_SLOT_CONFLICT]
        distinguishing_aspect: |
          Half-open [start,end) semantics on MachineSlot: an existing BOOKED slot
          [0,160) on machine_code 'VF2-X'. A new [160,200) is ADJACENT and
          accepted (no overlap at the shared endpoint); a new [150,180) overlaps
          and is rejected ERR_SLOT_CONFLICT. Plain interval arithmetic, no buffer.
        test_recipe:
          setup:
            - "Two RELEASED WOs each with one MILL_3AX op; an existing BOOKED slot [0,160) on machine_code 'VF2-X'."
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "SlotA", customer_id: "CUST-15", requested_due_date: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-SA", drawing_rev: "A", material_spec: "AL_6061", quantity: 2, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 1000, scrap_allowance_pct: 0 }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "MILL_3AX", estimated_cycle_min: 5.0, setup_fee_cents: 2000 }
              as: Estimator
              captures: { op_a: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 2, machine_class: "MILL_3AX", estimated_cycle_min: 5.0, setup_fee_cents: 2000 }
              as: Estimator
              captures: { op_b: $.data.id }
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
              captures: { q_v: $.data.version }
            - call: "POST /quotes/${q_id}/approve"
              payload: { expected_quote_version: "${q_v}" }
              as: Estimator
            - call: "POST /material-lots"
              payload: { material_spec: "AL_6061", heat_number: "H-SA", qty_received: 2, unit_cost_cents: 1000, received_at: "2026-06-01T00:00:00Z" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /work-orders"
              payload: { quote_id: "${q_id}", part_line_id: "${pl_id}", qty_ordered: 2, qty_started: 2 }
              as: ShopAdmin
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/allocate-material"
              payload: {}
              as: MaterialController
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ShopAdmin
            - call: "POST /machine-slots"
              payload: { machine_class: "MILL_3AX", machine_code: "VF2-X", routing_op_id: "${op_a}", start_min: 0, end_min: 160 }
              as: Scheduler
          trigger:
            - call: "POST /machine-slots"
              payload: { machine_class: "MILL_3AX", machine_code: "VF2-X", routing_op_id: "${op_b}", start_min: 150, end_min: 180 }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_SLOT_CONFLICT"

      - name: inspection_station_buffered_closed_overlap
        grounds:
          - validations[priority=10]
          - entities.Inspection.fields.window_start_min
          - entities.Inspection.fields.window_end_min
          - entities.InspectionStation.fields.buffer_min
          - errors[ERR_STATION_CONFLICT]
        distinguishing_aspect: |
          Different interval semantics on a different resource (InspectionStation):
          CLOSED windows expanded by buffer_min=15 on both sides. Existing window
          [100,160] occupies [85,175]; a new [170,190] collides (170 <= 175) and
          is rejected ERR_STATION_CONFLICT — buffered closed-interval arithmetic,
          unlike the unbuffered half-open MachineSlot rule.
        test_recipe:
          setup:
            - "Two IN_PROCESS WOs; a station 'CMM-B' buffer 15; one OPEN inspection window [100,160] on it."
          setup_api_calls:
