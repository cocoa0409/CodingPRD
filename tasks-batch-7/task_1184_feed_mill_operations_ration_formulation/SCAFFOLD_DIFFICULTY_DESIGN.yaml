            - { call: "POST /api/formulas", payload: { code: "F-MED", min_protein_pct: 20.0, max_fiber_pct: 5.0, min_energy_kcal_kg: 2500 }, as: Nutritionist, captures: { fm_id: $.data.id, fm_v: $.data.version } }
            - { call: "POST /api/formulas/${fm_id}/optimize", payload: { expected_formula_version: "${fm_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${fm_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "No Permit Pete", credit_limit_cents: 1000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${fm_id}", tons: 1, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MEDICATED_PERMIT_REQUIRED with http 422 (priority 7 safety gate)"
            - "error_id != ERR_CREDIT_LIMIT_EXCEEDED even though 0 + 35212 > 1000 (priority 10 fiscal gate never reached)"
            - "CustomerOrder.${ord_id}.status == QUOTED and credit_used_cents == 0"

  - rule_id: boundary_precision_check
    instances:
      - name: weighment_deviation_exactly_two_pct_passes
        grounds:
          - calculations.batch_line_deviation
          - errors[ERR_WEIGHMENT_OUT_OF_TOLERANCE]
        distinguishing_aspect: |
          Metric: per-line deviation percent on POST /api/batches/{id}/mix. The comparison is strictly
          greater-than against 2.00: deviation exactly 2.00 (7.140 vs target 7.000) MIXES, while
          2.01 (7.141) is rejected. Distinct metric and endpoint from the nutrient-floor instance.
        test_recipe:
          setup:
            - "Catalog + F-GROW ACTIVE; order 10t CONFIRMED; two batches of 10t on L1 in disjoint windows"
            - "Batch A weighed corn 7.140 (deviation 2.00) + SBM 3.000; Batch B weighed corn 7.141 (deviation 2.01) + SBM 3.000"
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/employees", payload: { full_name: "Olly Operator", capability: "OPERATOR" }, as: MillManager, captures: { op_id: $.data.id } }
            - { call: "POST /api/lines", payload: { code: "L1" }, as: MillManager, captures: { line_id: $.data.id } }
            - { call: "POST /api/bins", payload: { code: "BIN-C", capacity_tons: 50 }, as: MillManager, captures: { binc_id: $.data.id } }
            - { call: "POST /api/bins/${binc_id}/assign", payload: { ingredient_id: "${corn_id}" }, as: MillManager }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 30 }, as: MillManager }
            - { call: "POST /api/bins", payload: { code: "BIN-S", capacity_tons: 50 }, as: MillManager, captures: { bins_id: $.data.id } }
            - { call: "POST /api/bins/${bins_id}/assign", payload: { ingredient_id: "${sbm_id}" }, as: MillManager }
            - { call: "POST /api/bins/${bins_id}/replenish", payload: { tons: 30 }, as: MillManager }
            - { call: "POST /api/batches", payload: { order_id: "${ord_id}", line_id: "${line_id}", target_tons: 10, planned_start_at: "2026-05-02T10:00:00Z", planned_end_at: "2026-05-02T11:00:00Z" }, as: MillManager, captures: { batA: $.data.id } }
            - { call: "POST /api/batches", payload: { order_id: "${ord_id}", line_id: "${line_id}", target_tons: 10, planned_start_at: "2026-05-02T12:00:00Z", planned_end_at: "2026-05-02T13:00:00Z" }, as: MillManager, captures: { batB: $.data.id } }
            - { call: "POST /api/batches/${batA}/start", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${batA}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${binc_id}", actual_tons: 7.140 }, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${batA}/weighments", payload: { ingredient_id: "${sbm_id}", bin_id: "${bins_id}", actual_tons: 3.000 }, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${batB}/start", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${batB}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${binc_id}", actual_tons: 7.141 }, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${batB}/weighments", payload: { ingredient_id: "${sbm_id}", bin_id: "${bins_id}", actual_tons: 3.000 }, as: Operator, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /api/batches/${batA}/mix", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${batB}/mix", payload: {}, as: Operator, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
          assert:
            - "Batch.${batA}.status == MIXED (corn deviation round_half_up(|7.140-7.000|/7.000*100,2) == 2.00 passes: rule is >)"
            - "Batch.${batB} mix rejected: error_id == ERR_WEIGHMENT_OUT_OF_TOLERANCE (deviation 2.01 > 2.00)"
            - "Batch.${batB}.status == BATCHING (unchanged)"

      - name: nutrient_protein_exactly_at_min_meets
        grounds:
          - calculations.least_cost_ration_solve
          - entities.Formula.fields.meets_constraints
          - errors[ERR_NUTRIENT_CONSTRAINT_VIOLATION]
        distinguishing_aspect: |
          Metric: total_protein_pct against min_protein_pct on POST /api/formulas/{id}/optimize and
          /activate. The floor comparison is >=: protein exactly 19.50 with min 19.5 meets constraints
          and activates; min 19.51 does not. Distinct metric (nutrient pct) and endpoint from the
          weighment-deviation instance.
        test_recipe:
          setup:
            - "Catalog: corn 30000 (protein 9.0) + SBM 52000 (protein 44.0); optimizer yields corn70/SBM30 = protein exactly 19.50"
            - "Formula F-EXACT with min_protein_pct 19.5; Formula F-STRICT with min_protein_pct 19.51"
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-EXACT", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { fa_id: $.data.id, fa_v: $.data.version } }
            - { call: "POST /api/formulas", payload: { code: "F-STRICT", min_protein_pct: 19.51, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { fb_id: $.data.id, fb_v: $.data.version } }
          trigger:
            - { call: "POST /api/formulas/${fa_id}/optimize", payload: { expected_formula_version: "${fa_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${fa_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/formulas/${fb_id}/optimize", payload: { expected_formula_version: "${fb_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${fb_id}/activate", payload: {}, as: Nutritionist, captures: { err: $.data.error_id } }
          assert:
            - "Formula.${fa_id}.total_protein_pct == 19.5 and meets_constraints == true (boundary: >= is inclusive)"
            - "Formula.${fa_id}.status == ACTIVE"
            - "Formula.${fb_id}.total_protein_pct == 19.5 and meets_constraints == false (19.50 < 19.51)"
            - "activate of ${fb_id} rejected: error_id == ERR_NUTRIENT_CONSTRAINT_VIOLATION, http 422"
            - "Formula.${fb_id}.status == DRAFT (unchanged)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: batch_start_gated_by_line_flush_verification
        grounds:
          - state_machines.Batch.PLANNED_to_BATCHING
          - state_machines.FlushRecord.RECORDED_to_VERIFIED
          - calculations.line_contamination
          - errors[ERR_FLUSH_REQUIRED]
        distinguishing_aspect: |
          Entity pair Batch -> FlushRecord/ProductionLine: a non-medicated batch may start only when
          the line's derived contamination is NONE, which depends on the STATE of a FlushRecord
          (VERIFIED with verified_at after the last medicated mix). Before verification the start is
          rejected ERR_FLUSH_REQUIRED; after, it succeeds. Different entity pair from the trip->order
          instance.
