            - "RateComplaint.${t2}.track == SIMPLIFIED_SAC (one cent over)"
            - "RateComplaint.${t3}.track == SIMPLIFIED_SAC (exactly at the 400000000 cap)"
            - "RateComplaint.${t4}.track == FULL_SAC (one cent over)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: decide_blocked_without_contested_year_finding
        grounds:
          - validations[priority=7]
          - calculations.prescribed_rate_and_relief
          - entities.Carrier.fields.revenue_adequacy_status
        distinguishing_aspect: "RateComplaint -> RevenueAdequacyFinding pair: decide UPHELD is blocked (ERR_REVENUE_ADEQUACY_FINDING_REQUIRED) until a finding for (carrier, contested_fiscal_year) exists, and once the INADEQUATE finding is filed the prescription floor switches to 1.1000x cost (prescribed 11550, not 11200)."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Carrier OKTX exists with NO findings. Complaint (challenged 19500, alleged 10000, tons 1000, FULL_SAC, contested year 2025) is in EVIDENTIARY_PHASE with VERIFIED evidence (reference 11200, verified cost 10500 -> adjudicated 1.8571)."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c_oktx: $.data.id }
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "GRAIN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev1: $.data.id }
            - call: "POST /stb/evidence-submissions/${ev1}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/decide"
              payload: { outcome: "UPHELD", shipments: [{ shipment_ref: "S-1", tons: 10.000 }] }
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2025, operating_revenue_cents: 1000000000, operating_expense_cents: 800000000, net_investment_cents: 2000000000 }
