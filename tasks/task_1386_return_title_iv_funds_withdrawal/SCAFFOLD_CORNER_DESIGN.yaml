              as_user_id: "officer-2"
              captures: { cta_v2: $.data.version }
          assert:
            - "Stale call: error_id == ERR_STALE_VERSION (http 412)"
            - "Current-version call: 200 and WithdrawalCase.${cta}.version == ${cv} + 1"

      - name: version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds:
          - "entities.Enrollment"
        distinguishing_aspect: "common_fields versioning: enrollment create returns version 1 and the withdraw mutation bumps it to 2 (every mutation increments by exactly one)."
