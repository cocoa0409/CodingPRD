  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: match314a_confirm_depth4_cascade
        grounds:
          - state_machines.Match314A.PENDING_REVIEW_to_CONFIRMED
          - state_machines.BrokerageAccount.OPEN_to_RESTRICTED
          - state_machines.SecurityTransaction.POSTED_to_FLAGGED
          - calculations.account_risk_score
        distinguishing_aspect: |
          Trigger = Match314A confirm (distinct from the cert-decision trigger of the
          other cascade). Depth 4 chain: match CONFIRMED -> (1) account RESTRICTED +
          posture SEVERE -> (2) POSTED transactions FLAGGED -> (3) FINCEN_314A_MATCH
          alerts created -> (4) ONGOING risk recalc reads the new alert set
          (65 -> 70, tier crosses MEDIUM -> HIGH). Each hop is CAUSED by the previous.
        test_recipe:
          setup:
            - "Clock 2026-05-01. Customer tax_id TIN-CASC1, HIGH country + PEP, products [LOW_PRICED_SECURITIES, MARGIN] -> score 65 MEDIUM; approved."
            - "One POSTED wire of 1000.00 (velocity 1000.00, band 0)."
            - "314(a) request with subject tax_id TIN-CASC1; scan -> one PENDING_REVIEW match (TAX_ID_EXACT)."
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep I", crd_number: "CRD-TC1" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "I Risky", tax_id: "TIN-CASC1", country_risk_tier: "HIGH", is_pep: true }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-TC1", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["LOW_PRICED_SECURITIES", "MARGIN"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id", s0: "$.data.risk_score" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 1000.00 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { txn_id: "$.data.id" } }
            - { call: "POST /aml/fincen-314a-requests", payload: { request_reference: "FIN-2026-TC1", subjects: [{ name: "I Risky", tax_id: "TIN-CASC1", subject_type: "INDIVIDUAL" }] }, as: ComplianceOfficer, captures: { req_id: "$.data.id" } }
            - { call: "POST /aml/fincen-314a-requests/${req_id}/scan", payload: {}, as: ComplianceOfficer, captures: { mcount: "$.data.match_count" } }
            - { call: "GET /aml/fincen-314a-matches", payload: { request_id: "${req_id}" }, as: ComplianceOfficer, captures: { match_id: "$.data[0].id", basis: "$.data[0].match_basis" } }
          trigger:
            - { call: "POST /aml/fincen-314a-matches/${match_id}/confirm", payload: {}, as: ComplianceOfficer, captures: { mstatus: "$.data.status" } }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: ComplianceOfficer, captures: { lc: "$.data.lifecycle_status", posture: "$.data.aml_posture", s1: "$.data.risk_score", t1: "$.data.risk_tier" } }
            - { call: "GET /aml/transactions/${txn_id}", payload: {}, as: ComplianceOfficer, captures: { txn_st: "$.data.status" } }
            - { call: "GET /aml/alerts", payload: { account_id: "${acct_id}" }, as: ComplianceOfficer, captures: { alert_rule: "$.data[0].rule_code", alert_st: "$.data[0].status" } }
          assert:
            - "captured mcount == 1 and basis == TAX_ID_EXACT"
            - "captured mstatus == CONFIRMED"
            - "captured lc == RESTRICTED and posture == SEVERE (hop 1)"
            - "captured txn_st == FLAGGED (hop 2)"
            - "captured alert_rule == FINCEN_314A_MATCH and alert_st == NEW (hop 3)"
            - "captured s0 == 65 and s1 == 70 and t1 == HIGH (hop 4: ONGOING recalc +5 from the cascade-created alert)"

      - name: suspicious_cert_reject_depth3_cascade
        grounds:
          - state_machines.PhysicalCertificateDeposit.READY_TO_ACCEPT_to_REJECTED_SUSPICIOUS
          - state_machines.SecurityTransaction.FLAGGED_to_REVERSED
          - entities.BrokerageAccount.fields.has_suspicion_flag
        distinguishing_aspect: |
          Trigger = certificate decision REJECT_SUSPICIOUS (distinct from the 314(a)
          confirm trigger). Depth 3 chain: decision -> (1) linked DEPOSIT_CERT
          transaction REVERSED (exposure drops by the deposit amount) -> (2)
          has_suspicion_flag set, posture recomputed STANDARD -> ELEVATED -> (3)
          CERT_SUSPICION alert created NEW. Each hop is caused by the previous.
        test_recipe:
          setup:
            - "Clock 2026-05-01. OPEN LOW account with no other activity. Deposit 100 @ 40.00 = 4000.00 (exposure 4000.00); advanced to CLEARANCE_HOLD at 2026-05-01 (hold_release 2026-05-06); clock + sweep -> READY_TO_ACCEPT."
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep J", crd_number: "CRD-TC2" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "J Low", tax_id: "TIN-CASC2", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-TC2", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/accounts/${acct_id}/certificate-deposits", payload: { certificate_number: "CN-TC2", cusip: "CUSIPTC2", security_name: "TC2 Corp", quantity: 100, unit_price: 40.00 }, as: OperationsAnalyst, captures: { dep_id: "$.data.id", dep_txn: "$.data.transaction_id" } }
            - { call: "POST /aml/certificate-deposits/${dep_id}/advance", payload: {}, as: OperationsAnalyst }
            - { call: "POST /aml/certificate-deposits/${dep_id}/advance", payload: {}, as: OperationsAnalyst }
            - { call: "POST /aml/certificate-deposits/${dep_id}/advance", payload: {}, as: OperationsAnalyst }
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/maintenance/run-daily-sweep", payload: {}, as: SystemAdmin }
            - { call: "GET /aml/certificate-deposits/${dep_id}", payload: {}, as: OperationsAnalyst, captures: { dep_v: "$.data.version", dep_st: "$.data.status" } }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: ComplianceOfficer, captures: { expo0: "$.data.exposure_30d_amount", posture0: "$.data.aml_posture" } }
          trigger:
            - { call: "POST /aml/certificate-deposits/${dep_id}/decision", payload: { expected_deposit_version: "${dep_v}", outcome: "REJECT_SUSPICIOUS", reason: "counterfeit certificate paper" }, as: ComplianceOfficer, captures: { dep_final: "$.data.status" } }
            - { call: "GET /aml/transactions/${dep_txn}", payload: {}, as: OperationsAnalyst, captures: { txn_st: "$.data.status" } }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: ComplianceOfficer, captures: { expo1: "$.data.exposure_30d_amount", posture1: "$.data.aml_posture", susp: "$.data.has_suspicion_flag" } }
            - { call: "GET /aml/alerts", payload: { account_id: "${acct_id}" }, as: ComplianceOfficer, captures: { alert_rule: "$.data[0].rule_code", alert_st: "$.data[0].status", alert_txn: "$.data[0].transaction_id" } }
          assert:
            - "captured dep_st == READY_TO_ACCEPT and dep_final == REJECTED_SUSPICIOUS"
            - "captured txn_st == REVERSED (hop 1)"
            - "captured expo0 == 4000.00 and expo1 == 0.00 (reversal removed the deposit from exposure)"
            - "captured posture0 == STANDARD and posture1 == ELEVATED and susp == true (hop 2)"
            - "captured alert_rule == CERT_SUSPICION and alert_st == NEW and alert_txn == ${dep_txn} (hop 3)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_restricted_account_wire
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors[ERR_ACCOUNT_RESTRICTED]
          - errors[ERR_VELOCITY_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair = state (ERR_ACCOUNT_RESTRICTED, priority 6) vs
          business_fiscal (ERR_VELOCITY_LIMIT_EXCEEDED, priority 17) — distinct from
          the safety-vs-constraint pair of the other instance. One request violates
          BOTH (RESTRICTED account AND wire of 300000.00 over the LOW limit 250000.00);
          the state error MUST win.
        test_recipe:
          setup:
            - "Clock 2026-05-01. LOW account approved OPEN; one wire 1000.00 posted; account restricted by ComplianceOfficer."
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep K", crd_number: "CRD-PP1" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "K Low", tax_id: "TIN-PP1", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-PP1", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 1000.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/accounts/${acct_id}/restrict", payload: { reason: "review" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 300000.00 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_ACCOUNT_RESTRICTED (state priority 6 beats fiscal priority 17)"
            - "HTTP status == 409 (not 422)"
            - "BrokerageAccount.${acct_id}.wire_velocity_30d_amount == 1000.00 (no partial posting)"

      - name: safety_beats_constraint_on_lost_stolen_duplicate_cert
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_CERT_REPORTED_LOST_STOLEN]
          - errors[ERR_DUPLICATE_CERTIFICATE_NUMBER]
        distinguishing_aspect: |
          Error-category pair = business_safety (ERR_CERT_REPORTED_LOST_STOLEN,
          priority 8) vs business_constraint (ERR_DUPLICATE_CERTIFICATE_NUMBER,
          priority 11) — distinct from the state-vs-fiscal pair. The deposit's
          certificate number is BOTH on the ACTIVE lost/stolen registry AND already
          used by another in-flight deposit; the safety error MUST win.
        test_recipe:
          setup:
            - "Clock 2026-05-01. OPEN LOW account A with in-flight deposit using certificate CN-PP2 (status RECEIVED)."
            - "Lost/stolen registry has ACTIVE entry for CN-PP2."
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
