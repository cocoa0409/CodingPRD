  - method: POST
    path: "/labor-encounters"
    description: "Admits a walk-in patient: creates a LaborEncounter with labor_phase ANTEPARTUM, staffing_state UNASSIGNED, admitted_at := clock_now, bed_id null and source_booking_id null. is_ntsv, acuity_tier, one_to_one_required and required_coverage_units are derived immediately. The bed is attached separately by POST /labor-encounters/{encounterId}/assign-bed."
    roles: [ChargeNurse, PatientAccessCoordinator]
    code: 201
    input: [unit_id, patient_record_code, parity, gestational_age_weeks, "prior_cesarean?", "fetus_count?", "presentation?"]
    input_types: { unit_id: "string, required — FK -> ObstetricUnit.id, immutable once set", patient_record_code: "string 1..60, required, unique per unit among non-terminal labor phases", parity: "integer >= 0, required", gestational_age_weeks: "integer 20..44, required", prior_cesarean: "boolean, optional, default false", fetus_count: "integer >= 1, optional, default 1", presentation: "enum VERTEX|BREECH|OTHER, optional, default VERTEX" }
    output: LaborEncounter
    validation_priorities: [1, 2, 4, 5, 8.02, 13.1]
    transitions: ["LaborEncounter.labor_phase := ANTEPARTUM and LaborEncounter.staffing_state := UNASSIGNED (both initial states)"]
    side_effects:
      - "calc encounter_required_coverage_units -> acuity_tier, one_to_one_required, required_coverage_units; is_ntsv derived from parity/prior_cesarean/gestational_age_weeks/fetus_count/presentation"
      - "Recompute calc unit_posture_derivation (a fresh uncovered encounter raises coverage_deficit_units); increments unit.version; encounter.version := 1"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_UNIT_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_UNIT_POSTURE_BLOCKS_OPERATION, ERR_DUPLICATE_PATIENT_RECORD_CODE]
    note: "§1.4 GAP RESOLUTION — priority 4 (body-id existence) extends to this endpoint's unit_id, since the unit is named in the body rather than the path; ERR_UNIT_NOT_FOUND is raised there."

  - method: GET
    path: "/labor-encounters"
    description: "Filtered list providing reverse reachability for LaborEncounter.unit_id, LaborEncounter.bed_id and LaborEncounter.source_booking_id (the encounter minted by an induction admit is discoverable only here or via the booking). Ordered admitted_at ASC, tie-break created_at ASC."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, AnesthesiaLead, PerinatalSafetyOfficer, PatientAccessCoordinator]
    code: 200
    input: ["unit_id?", "bed_id?", "source_booking_id?", "patient_record_code?", "labor_phase?", "staffing_state?", "acuity_tier?", "is_ntsv?", "limit?", "offset?"]
    input_types: { unit_id: "string, optional", bed_id: "string, optional", source_booking_id: "string, optional", patient_record_code: "string, optional", labor_phase: "enum ANTEPARTUM|LATENT|ACTIVE_FIRST_STAGE|SECOND_STAGE|THIRD_STAGE_DELIVERED|POSTPARTUM_RECOVERY|DISCHARGED|TRANSFERRED_OUT, optional", staffing_state: "enum UNASSIGNED|RATIO_COVERED|ONE_TO_ONE_COVERED|COVERAGE_BREACH|RELEASED, optional", acuity_tier: "enum TIER_I|TIER_II|TIER_III|TIER_IV, optional", is_ntsv: "boolean, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: LaborEncounter[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/labor-encounters/{encounterId}"
    description: "Reads one LaborEncounter with BOTH state axes (labor_phase, staffing_state), every derived coverage field, magnesium_infusion_active, review_required, delivery_mode / episiotomy_performed / delivery_recorded_at and `version` (the value an OCC caller echoes as expected_encounter_version)."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, AnesthesiaLead, PerinatalSafetyOfficer, PatientAccessCoordinator]
    code: 200
    input: []
    input_types: {}
    output: LaborEncounter
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ENCOUNTER_NOT_FOUND]

  - method: GET
    path: "/labor-encounters/{encounterId}/coverage-summary"
    description: "Computed read decomposing calc encounter_required_coverage_units and calc support_person_occupancy for one encounter: which clause set the acuity_tier, why one_to_one_required is on or off, the per-assignment debits from calc care_assignment_unit_debit, and the current support-person allowance with the checked-in count."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, PerinatalSafetyOfficer, PatientAccessCoordinator]
