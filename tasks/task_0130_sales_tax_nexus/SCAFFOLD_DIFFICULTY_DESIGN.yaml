  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: return_accept_requires_nexusprofile_registered
        grounds:
          - state_machines.TaxReturn.DRAFT_to_ACCEPTED
          - validations[priority=12]
          - entities.NexusProfile.fields.nexus_status
          - errors[ERR_NEXUS_NOT_REGISTERED]
        distinguishing_aspect: |
          Entity pair TaxReturn -> NexusProfile: a DRAFT TaxReturn cannot move to ACCEPTED unless the SEPARATE
          NexusProfile(seller,jurisdiction) entity is in nexus_status REGISTERED; with NexusProfile at
          THRESHOLD_MET (not REGISTERED) the accept is rejected with ERR_NEXUS_NOT_REGISTERED.
        test_recipe:
          setup:
            - "CA jurisdiction; seller s; a CA NexusProfile at THRESHOLD_MET (crossed via a 100000 settle) but NOT registered."
