          setup:
            - "Licence licA (LIC-US-CA-KA-01, expires 2027-12-31) is ACTIVE + COORDINATED and radiates BEAM-01; licence licB (LIC-US-CA-KA-02, expires 2029-06-30) is ACTIVE + COORDINATED; licence licC (LIC-US-CA-KA-03, expires 2031-01-01) is still PENDING_COORDINATION."
            - "Subscription sn1 on CELL-001 is ACTIVE + AUTHORIZED_FIXED on a roaming_allowed plan and has a REQUESTED ROAM_TEMPORARY authorisation for US-CA covering [2026-08-05T00:00:00Z, 2026-08-06T00:00:00Z]."
