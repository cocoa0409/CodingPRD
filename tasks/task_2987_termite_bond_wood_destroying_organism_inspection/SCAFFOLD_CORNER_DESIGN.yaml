# §1.9 Scaffold Corner Design — Termite Bond & WDO Inspection
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7, walked against
# references/claim-extraction-guide.md. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is the depth
# probe; rows already asserted there appear here as `excluded_because:` stubs.
#
# Shared literals used by many recipes (all re-derived from §1.3 with the same constants):
#   P1  = FL / SLAB / 2000 sq ft / 180 lf / 1995 / no attached structures
#         LIQUID_BARRIER plan: target_gallons 190 (180 * 1.0 + ceil(2000/100) * 0.5)
#         quote 1080.00 (min(2000,1500)*0.42 = 630.00 + 500*0.35 = 175.00 -> 805.00; + 275.00
#         base fee = 1080.00; SLAB multiplier 1.00; no infestation surcharge; below the 4200.00 cap)
#         REPAIR_AND_RETREAT bond: base_premium 194.40, cap 11664.00, annual_premium 241.06
#   The logical clock starts every recipe at 2026-08-01T00:00:00Z unless the recipe moves it.

scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: property_create_returns_every_field_with_a_zeroed_conducive_ledger
        claim_type: creation
        grounds:
          - entities.Property
          - endpoints[POST /properties]
          - response_envelope.success
        distinguishing_aspect: >-
          A 201 that echoes all eight input fields AND initialises the four derived ledger fields to
          0 / false before any inspection exists, wrapped in the declared success envelope.
        test_recipe:
          setup:
            - "Empty database; the logical clock is parked at the mandatory startup default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
          assert:
            - "HTTP 201 with response_type object and a meta block carrying api_request_id and api_request_timestamp"
            - "data echoes address_line1 '411 Cypress Row', state_code FL, construction_type SLAB, square_footage 2000, linear_footage 180, year_built 1995, has_attached_structures false"
            - "crawl_clearance_inches is null because it was omitted and construction_type is SLAB"
            - "total_conducive_condition_count 0, waived_conducive_condition_count 0, open_conducive_condition_count 0, active_infestation_on_record false"
            - "version == 1 and created_at == updated_at, both ISO 8601 UTC with three fractional digits"
            - "id is a bare UUID with no type prefix"

      - name: inspector_get_returns_the_stored_licence_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Inspector
          - endpoints[GET /inspectors/{id}]
        distinguishing_aspect: >-
          A read-after-write on a row whose optional inputs were omitted, proving the GET returns
          the persisted values (including the two defaults) rather than re-deriving anything.
        test_recipe:
          setup:
            - "One inspector registered with license_categories [WDO_INSPECTOR] and both optional fields omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
          trigger:
            - call: "GET /inspectors/${insb}"
              payload: {}
              as: BranchManager
          assert:
            - "HTTP 200 with data.id == ${insb}"
            - "full_name 'Rosa Vance', license_number 'FL-10001', license_state FL, license_categories exactly ['WDO_INSPECTOR'], license_expires_on '2029-06-30'"
            - "status == ACTIVE (the system default at registration)"
            - "fumigation_endorsement == false and ce_credits == 0 — the two omitted optional inputs took their declared defaults"
            - "version == 1: a GET is not a mutation"

      - name: properties_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /properties]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: >-
          Three rows read with limit 2 twice: page 1 must report has_more true with total_count 3,
          page 2 must report has_more false while total_count stays 3, and the newest-first ordering
          must place the last-created property first.
        test_recipe:
          setup:
            - "Three properties created in a known order: pA, then pB, then pC, all FL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "1 First St", state_code: "FL", construction_type: "SLAB", square_footage: 1600, linear_footage: 140, year_built: 1990, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { pA: $.data.id }
            - call: "POST /properties"
              payload: { address_line1: "2 Second St", state_code: "FL", construction_type: "CRAWLSPACE", square_footage: 1400, linear_footage: 150, year_built: 1988, crawl_clearance_inches: 22, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { pB: $.data.id }
            - call: "POST /properties"
              payload: { address_line1: "3 Third St", state_code: "GA", construction_type: "SLAB", square_footage: 2200, linear_footage: 190, year_built: 2004, has_attached_structures: true }
              as: ComplianceOfficer
              captures: { pC: $.data.id }
          trigger:
            - call: "GET /properties"
              payload: { limit: 2, offset: 0 }
              as: BranchManager
              captures: { first_row: "$.data[0].id" }
            - call: "GET /properties"
              payload: { limit: 2, offset: 2 }
              as: BranchManager
            - call: "GET /properties"
              payload: { state_code: "FL" }
              as: BranchManager
          assert:
            - "page 1 returns response_type array with exactly 2 rows, total_count 3, has_more true, limit 2, offset 0"
            - "page 1 row 0 is ${pC} and row 1 is ${pB} — newest first by created_at"
            - "page 2 returns exactly 1 row (${pA}), total_count 3, has_more false, offset 2"
            - "the unpaginated third call applies the default limit 10 and offset 0 and returns the 2 FL rows with total_count 2 and has_more false"
            - "the filtered call does not include ${pC}, whose state_code is GA"

      - name: bond_get_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors.ERR_BOND_NOT_FOUND
          - endpoints[GET /bonds/{id}]
        distinguishing_aspect: >-
          A well-formed UUID that names no row must produce the path-existence error for the
          addressed entity (ERR_BOND_NOT_FOUND, 404) — not a 200 with a null body and not the
          generic request-shape error.
        test_recipe:
          setup:
            - "Empty database: no Bond row has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /bonds/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BranchManager
              captures: { e: $.data.error_id }
          assert:
            - "HTTP 404 with response_type error and data.error_id == ERR_BOND_NOT_FOUND"
            - "data carries a non-empty message string and no entity fields"
            - "priority 40 owns this: the leftmost unresolved path segment reports its own entity's error_id"

      - name: inspection_create_missing_required_purpose_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=50]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /inspections]
        distinguishing_aspect: >-
          purpose is a required input with no default, so omitting it is a shape failure (priority
          50, 422) that must be reported BEFORE any business rule looks at the referenced rows.
        test_recipe:
          setup:
            - "One property and one WDO inspector exist, so every reference in the body would resolve if the shape were valid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { e: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "no Inspection row is created: GET /inspections with property_id ${p1} returns total_count 0"
            - "no sequence_no is consumed, so the property's first successful inspection still gets sequence_no 1"

      - name: finding_create_omits_optional_fields_and_defaults_are_applied
        claim_type: defaults
        grounds:
          - entities.GraphFinding.severity
          - entities.GraphFinding.organism
          - entities.GraphFinding.damage_estimate_usd
          - endpoints[POST /inspections/{id}/findings]
        distinguishing_aspect: >-
          A CONDUCIVE_CONDITION cell supplying only finding_type, grid_ref and conducive_code must
          come back with severity 1, organism NONE, damage_estimate_usd 0.00 — the three declared
          defaults — and the parent inspection's rollups must count it.
        test_recipe:
          setup:
            - "One DRAFT inspection owned by insb on property P1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins1: $.data.id }
          trigger:
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "A1", conducive_code: "EXCESS_MOISTURE" }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "GET /inspections/${ins1}"
              payload: {}
              as: BranchManager
          assert:
            - "HTTP 201 with severity == 1, organism == NONE, damage_estimate_usd == 0.00, pre_existing == false"
            - "the row carries id and created_at only — GraphFinding declares common_fields false, so there is no version and no updated_at"
            - "the parent rollups move: Inspection.findings_count == 1 and conducive_condition_count == 1"
            - "active_infestation_found stays false and damage_estimate_total_usd stays 0.00"

      - name: plan_create_computes_gallons_and_quote_for_a_crawlspace_property
        claim_type: computed_fields
        grounds:
          - calculations.treatment_sizing_and_quote
          - entities.TreatmentPlan.target_gallons
          - entities.TreatmentPlan.quoted_price_usd
          - endpoints[POST /treatment-plans]
        distinguishing_aspect: >-
          A CRAWLSPACE geometry that no §1.8 instance uses: trench gallons take the 1.5 gal/lf rate
          with NO slab-drill term (225.00), and the price picks up the 1.15 construction multiplier
          on a single-tier square footage (992.45), so a SLAB-shaped implementation cannot pass.
        test_recipe:
          setup:
            - "One CRAWLSPACE property: 1400 sq ft, 150 linear feet, crawl_clearance_inches 22."
            - "Its INITIAL graph is signed with zero findings, so active_infestation_found is false and the surcharge is not applied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "2 Second St", state_code: "FL", construction_type: "CRAWLSPACE", square_footage: 1400, linear_footage: 150, year_built: 1988, crawl_clearance_inches: 22, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { pB: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Dale Ortiz", license_number: "FL-10002", license_state: "FL", license_categories: ["TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insa: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${pB}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { insB1: $.data.id }
            - call: "POST /inspections/${insB1}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insb}"
          trigger:
            - call: "POST /treatment-plans"
              payload: { property_id: "${pB}", inspection_id: "${insB1}", applicator_id: "${insa}", method: "LIQUID_BARRIER", chemical_product_code: "FIPRO_9" }
              as: BranchManager
          assert:
            - "target_gallons == 225.00 — ceil(150 * 1.5) with no slab-drill term, because construction_type is not SLAB"
            - "target_station_count == 0 for a LIQUID_BARRIER plan"
            - "quoted_price_usd == 992.45 — sqft_tier_subtotal 588.00 (1400 * 0.42, single tier) + base fee 275.00 = 863.00, times the CRAWLSPACE multiplier 1.15 = 992.45, rounded once"
            - "status == PROPOSED, gallons_applied_total == 0.00, escalated_station_count == 0, retreat_required false, completed_at null"
            - "fumigation_permit_number, fumigation_start_at and fumigation_reentry_at are all null for a non-FUMIGATION plan"

      - name: property_create_extra_field_system_values_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Property
          - endpoints[POST /properties]
        distinguishing_aspect: >-
          A creation body that also carries id, version, created_at and a computed counter must not
          adopt any of them: the four common/system fields are minted server-side and the derived
          ledger stays at its computed 0.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false, id: "11111111-1111-4111-8111-111111111111", version: 77, created_at: "2000-01-01T00:00:00.000Z", total_conducive_condition_count: 9 }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
          assert:
            - "HTTP 201 and data.id != '11111111-1111-4111-8111-111111111111'"
            - "version == 1, not 77"
            - "created_at is the 2026-08-01T00:00:00.000Z logical-clock instant, not the supplied 2000-01-01 value"
            - "total_conducive_condition_count == 0, not 9 — a computed field is never taken from input"
            - "GET /properties/${p1} confirms the persisted row matches the response, so nothing was stored from the ignored keys"

      - name: finding_create_with_invalid_enum_or_out_of_range_severity_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=50]
          - validations[priority=52]
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_FIELD_COMBINATION_INVALID
          - entities.GraphFinding
        distinguishing_aspect: >-
          Four separate shape failures on one endpoint, three of them priority 50 (unknown enum
          member, severity above its 1..5 range, grid_ref outside the ^[A-J](10|[1-9])$ pattern) and
          one of them priority 52 (a DAMAGE cell with damage_estimate_usd 0.00, which the
          exactly-when rule forbids).
        test_recipe:
          setup:
            - "One DRAFT inspection owned by insb."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins1: $.data.id }
          trigger:
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "A2", organism: "CARPENTER_BEE", severity: 2, damage_estimate_usd: 500.00, pre_existing: false }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { e_enum: $.data.error_id }
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "A2", organism: "FUNGUS", severity: 9, damage_estimate_usd: 500.00, pre_existing: false }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { e_range: $.data.error_id }
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "K11", organism: "FUNGUS", severity: 2, damage_estimate_usd: 500.00, pre_existing: false }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { e_pattern: $.data.error_id }
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "A2", organism: "FUNGUS", severity: 2, damage_estimate_usd: 0.00, pre_existing: false }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { e_combo: $.data.error_id }
          assert:
            - "the unknown organism CARPENTER_BEE returns ERR_INVALID_REQUEST with HTTP 422"
            - "severity 9 returns ERR_INVALID_REQUEST with HTTP 422 — the declared range is 1..5"
            - "grid_ref 'K11' returns ERR_INVALID_REQUEST with HTTP 422 — column K and row 11 are both outside ^[A-J](10|[1-9])$"
            - "the DAMAGE cell with damage_estimate_usd 0.00 returns ERR_FIELD_COMBINATION_INVALID with HTTP 422, and NOT ERR_INVALID_REQUEST — every individual field is in range, only the combination is illegal"
            - "all four calls create nothing: Inspection.${ins1}.findings_count is still 0 and GET /inspections/${ins1}/findings returns total_count 0"

      - name: pesticide_record_and_station_service_are_immutable_rows
        claim_type: immutability
        grounds:
          - entities.PesticideRecord
          - entities.StationService
          - endpoints[GET /treatment-plans/{id}/applications]
        distinguishing_aspect: >-
          Both audit entities declare common_fields false, so their rows must expose id and
          created_at only — no version, no updated_at — and §1.5 offers no endpoint that mutates or
          deletes them, which is what makes the state pesticide record retention claim meaningful.
        test_recipe:
          setup:
            - "P1 with an APPROVED liquid-barrier plan and one recorded application of 190.00 gallons."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Dale Ortiz", license_number: "FL-10002", license_state: "FL", license_categories: ["TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insa: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins1: $.data.id }
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /treatment-plans"
              payload: { property_id: "${p1}", inspection_id: "${ins1}", applicator_id: "${insa}", method: "LIQUID_BARRIER", chemical_product_code: "FIPRO_9" }
              as: BranchManager
              captures: { plan1: $.data.id }
            - call: "POST /treatment-plans/${plan1}/approve"
              payload: {}
              as: BranchManager
            - call: "GET /treatment-plans/${plan1}"
              payload: {}
              as: BranchManager
              captures: { pv1: $.data.version }
            - call: "POST /treatment-plans/${plan1}/applications"
              payload: { product_epa_number: "432-1234", gallons_applied: 190.00, concentration_pct: 0.06, expected_treatment_plan_version: "${pv1}" }
              as: Applicator
              as_user_id: "${insa}"
          trigger:
            - call: "GET /treatment-plans/${plan1}/applications"
              payload: {}
              as: ComplianceOfficer
              captures: { rec1: "$.data[0].id" }
          assert:
            - "HTTP 200 with exactly 1 row and total_count 1"
            - "row 0 carries id, created_at, treatment_plan_id, product_epa_number, gallons_applied 190.00, concentration_pct 0.06, applied_at and retention_until"
            - "row 0 carries NO version key and NO updated_at key — PesticideRecord declares common_fields false"
            - "applied_at == 2026-08-01T00:00:00.000Z and retention_until == '2030-07-31' (FL retention 4 * 365 days from the applied_at date)"
            - "the parent plan absorbed the write instead: TreatmentPlan.${plan1}.gallons_applied_total == 190.00 and its version advanced to 3"

      - name: plan_create_with_unknown_inspection_id_returns_not_found
        claim_type: parent_relationships
        grounds:
