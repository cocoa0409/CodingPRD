# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Corporate Flight Department Scheduling
#
# 9 Difficulty Rules × 2 instances each = 18 instances. Every instance grounds
# in §1.1–§1.7 of SCAFFOLD.yaml and provides a directly executable
# setup_api_calls chain.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two calculations on DIFFERENT entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: sifl_provisional_vs_final_diverge_on_leg_status
        grounds:
          - calculations.sifl_imputed_income
          - entities.TripRequest.fields.sifl_imputed_income_cents
        distinguishing_aspect: |
          SIFL operates on the TripRequest entity domain; its provisional variant
          (sifl-preview) includes PLANNED legs, while the final variant (settle)
          includes only COMPLETED legs — for the same trip data the two variants
          produce different cent totals purely from input-set filtering.
        test_recipe:
          setup:
            - "A SiflRatePeriod covering 2026-08 exists with terminal=5000, band1=30, band2=20, band3=10, control_mult=400"
            - "A TIER_1 non-control passenger exists"
            - "A BUSINESS_UNIT exists"
            - "A TRIP (PERSONAL) exists with 1 passenger, 2 legs of 600 mi each"
            - "Trip is APPROVED, legs are still in PLANNED (no aircraft assigned yet)"
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-EXEC", name: "Executive", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E100", full_name: "Alice Exec", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax_id: $.data.id }
            - call: "POST /flight-ops/sifl-rate-periods"
              payload: { period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", terminal_charge_cents: 5000, rate_band_1_cents_per_mile: 30, rate_band_2_cents_per_mile: 20, rate_band_3_cents_per_mile: 10, control_employee_multiplier_pct: 400 }
              as: FinanceAdmin
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax_id}", charge_bu_id: "${bu_id}", trip_kind: "PERSONAL", purpose: "Vacation", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T20:00:00Z", passenger_ids: ["${pax_id}"], personal_use_flag: true }
              as: ExecutiveRequester
              as_user_id: "${pax_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KPBI", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T15:00:00Z", distance_statute_miles: 600 }
              as: ExecutiveRequester
              as_user_id: "${pax_id}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 2, origin_icao: "KPBI", destination_icao: "KTEB", scheduled_departure_utc: "2026-08-10T17:00:00Z", scheduled_arrival_utc: "2026-08-10T20:00:00Z", distance_statute_miles: 600 }
              as: ExecutiveRequester
              as_user_id: "${pax_id}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax_id}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/approve"
              payload: {}
              as: FlightDeptManager
          trigger:
            - call: "GET /flight-ops/trip-requests/${trip_id}/sifl-preview"
              as: FinanceAdmin
              captures: { preview_cents: $.data.provisional_sifl_cents, preview_legs: $.data.leg_count_included }
          assert:
            - "preview_cents == 44000 (two 600-mi legs × 22000 per leg; provisional variant includes PLANNED legs)"
            - "preview_legs == 2"
            - "TripRequest.${trip_id}.sifl_imputed_income_cents == 0 (final variant has not run; legs not COMPLETED)"

      - name: cost_allocation_owned_vs_charter_diverge_on_same_legs
        grounds:
          - calculations.trip_cost_allocation
          - entities.TripRequest.fields.allocated_cost_cents
        distinguishing_aspect: |
          Trip cost allocation operates on the BusinessUnit/fiscal domain
          (distinct from SIFL's passenger-tax domain); for an identical leg
          (same block_minutes, same services), the owned-fleet variant yields
          block_minutes × type-rate + services while the charter variant
          replaces that with prorated share of the charter quote — same inputs,
          different totals.
        test_recipe:
          setup:
            - "Two BusinessUnits BU-A and BU-B exist"
            - "Two TIER_1 passengers P1 and P2 exist"
            - "A LIGHT_JET Aircraft exists, ACTIVE, posture AVAILABLE, capacity 6"
            - "PIC and SIC CrewMembers exist, type-rated LIGHT_JET, training_valid_until far future, ACTIVE"
            - "Trip A (BUSINESS, BU-A) with one 120-min leg; Trip B (BUSINESS, BU-B) with one 120-min leg"
            - "Trip A assigned to fleet aircraft, crewed, released, completed"
            - "Trip B has no fleet aircraft available (aircraft retired before assign); a CharterSupplement for 1,200,000 cents was created and ACCEPTED, putting trip B into DISPATCHED; then the charter-operated flight completes via a fleet-recorded leg that is manually completed by dispatcher after leg status reaches RELEASED"
            - "Both trips settled"
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-A", name: "BU A", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_a: $.data.id }
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-B", name: "BU B", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_b: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E201", full_name: "P One", priority_tier: "TIER_1", home_bu_id: "${bu_a}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax1: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E202", full_name: "P Two", priority_tier: "TIER_1", home_bu_id: "${bu_b}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax2: $.data.id }
            - call: "POST /flight-ops/sifl-rate-periods"
              payload: { period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", terminal_charge_cents: 5000, rate_band_1_cents_per_mile: 30, rate_band_2_cents_per_mile: 20, rate_band_3_cents_per_mile: 10, control_employee_multiplier_pct: 400 }
              as: FinanceAdmin
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N100CA", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
              captures: { ac_id: $.data.id }
            - call: "POST /flight-ops/crew-members"
              payload: { employee_number: "C301", full_name: "Pilot A", seat_qualification: "PIC", type_ratings: ["LIGHT_JET"], training_valid_until: "2027-01-01T00:00:00Z" }
              as: FlightDeptManager
              captures: { pic_id: $.data.id }
            - call: "POST /flight-ops/crew-members"
              payload: { employee_number: "C302", full_name: "Pilot B", seat_qualification: "SIC", type_ratings: ["LIGHT_JET"], training_valid_until: "2027-01-01T00:00:00Z" }
              as: FlightDeptManager
              captures: { sic_id: $.data.id }
            # ---- Trip A: owned-fleet path ----
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax1}", charge_bu_id: "${bu_a}", trip_kind: "BUSINESS", purpose: "Client visit", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax1}"] }
              as: ExecutiveRequester
              as_user_id: "${pax1}"
              captures: { trip_a: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_a}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax1}"
              captures: { leg_a: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_a}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax1}"
            - call: "POST /flight-ops/trip-requests/${trip_a}/approve"
              payload: {}
              as: FlightDeptManager
            - call: "GET /flight-ops/trip-requests/${trip_a}"
              as: FlightDeptManager
              captures: { trip_a_v: $.data.version }
            - call: "POST /flight-ops/trip-requests/${trip_a}/assign-aircraft"
              payload: { expected_trip_request_version: "${trip_a_v}" }
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /flight-ops/flight-legs/${leg_a}/assign-crew"
              payload: { pic_crew_id: "${pic_id}", sic_crew_id: "${sic_id}" }
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /flight-ops/flight-legs/${leg_a}/release"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /flight-ops/trip-requests/${trip_a}/dispatch"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T14:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/flight-legs/${leg_a}/complete"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "GET /flight-ops/trip-requests/${trip_a}"
              as: FlightDeptManager
              captures: { trip_a_v2: $.data.version }
            - call: "POST /flight-ops/trip-requests/${trip_a}/settle"
              payload: { expected_trip_request_version: "${trip_a_v2}" }
              as: FinanceAdmin
              as_user_id: "fin-1"
            # ---- Trip B: charter path (no fleet aircraft available) ----
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax2}", charge_bu_id: "${bu_b}", trip_kind: "BUSINESS", purpose: "Charter trip", requested_departure_utc: "2026-08-20T12:00:00Z", requested_return_utc: "2026-08-20T14:00:00Z", passenger_ids: ["${pax2}"] }
              as: ExecutiveRequester
              as_user_id: "${pax2}"
              captures: { trip_b: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_b}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KMIA", scheduled_departure_utc: "2026-08-20T12:00:00Z", scheduled_arrival_utc: "2026-08-20T14:00:00Z", distance_statute_miles: 1100 }
              as: ExecutiveRequester
              as_user_id: "${pax2}"
              captures: { leg_b: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_b}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax2}"
            - call: "POST /flight-ops/trip-requests/${trip_b}/approve"
              payload: {}
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft/${ac_id}/retire"
              payload: {}
              as: FlightDeptManager
            - call: "POST /flight-ops/charter-supplements"
              payload: { trip_request_id: "${trip_b}", vendor_name: "CharterCo", quoted_cost_cents: 1200000, aircraft_type_offered: "LIGHT_JET" }
              as: Dispatcher
              captures: { charter_b: $.data.id }
            - call: "POST /flight-ops/charter-supplements/${charter_b}/accept"
              payload: {}
              as: FlightDeptManager
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T14:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/flight-legs/${leg_b}/complete"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "GET /flight-ops/trip-requests/${trip_b}"
              as: FlightDeptManager
              captures: { trip_b_v: $.data.version }
            - call: "POST /flight-ops/trip-requests/${trip_b}/settle"
              payload: { expected_trip_request_version: "${trip_b_v}" }
              as: FinanceAdmin
              as_user_id: "fin-1"
          trigger:
            - call: "GET /flight-ops/trip-requests/${trip_a}"
              as: FinanceAdmin
              captures: { a_alloc: $.data.allocated_cost_cents }
            - call: "GET /flight-ops/trip-requests/${trip_b}"
              as: FinanceAdmin
              captures: { b_alloc: $.data.allocated_cost_cents }
          assert:
            - "a_alloc == 1020000 (120 min × 8500 cents/min LIGHT_JET owned-fleet rate, no services)"
            - "b_alloc == 1200000 (full charter quote prorated onto a single leg; aircraft-type rate ignored)"
            - "a_alloc != b_alloc (same block_minutes, different algorithm variant)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two calculations, different modes {(a),(b),(c)}
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: sifl_tiered_banding_with_control_multiplier_mode_a
        grounds:
          - calculations.sifl_imputed_income
          - entities.SiflRatePeriod.fields.rate_band_2_cents_per_mile
        distinguishing_aspect: |
          SIFL satisfies mode (a): a formula with >=3 inputs (miles, terminal
          charge, three band rates, control multiplier) and non-linear
          interaction via tiered-rate selection across band1/band2/band3 plus a
          conditional control-employee multiplier branch on PassengerProfile
          state. 1600-mile control-employee leg exercises all three bands plus
          the multiplier branch.
        test_recipe:
          setup:
            - "SiflRatePeriod: terminal=5000, band1=30, band2=20, band3=10, control_mult=400"
            - "Control-employee passenger CPAX (sifl_control_employee=true), TIER_1"
            - "BU exists; trip is PERSONAL, 1 passenger (CPAX), 1 leg of 1600 miles"
            - "Trip COMPLETED via owned-fleet flow (crew/aircraft assigned, dispatched, completed)"
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-X", name: "BU X", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E401", full_name: "Ctrl Pax", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: true }
              as: FlightDeptManager
              captures: { cpax: $.data.id }
            - call: "POST /flight-ops/sifl-rate-periods"
              payload: { period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", terminal_charge_cents: 5000, rate_band_1_cents_per_mile: 30, rate_band_2_cents_per_mile: 20, rate_band_3_cents_per_mile: 10, control_employee_multiplier_pct: 400 }
              as: FinanceAdmin
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N401CF", aircraft_type: "HEAVY_JET", passenger_capacity: 12, home_base_icao: "KTEB" }
              as: FlightDeptManager
              captures: { ac_id: $.data.id }
            - call: "POST /flight-ops/crew-members"
              payload: { employee_number: "C401", full_name: "Pilot P", seat_qualification: "PIC", type_ratings: ["HEAVY_JET"], training_valid_until: "2027-01-01T00:00:00Z" }
              as: FlightDeptManager
              captures: { pic_id: $.data.id }
            - call: "POST /flight-ops/crew-members"
              payload: { employee_number: "C402", full_name: "Pilot S", seat_qualification: "SIC", type_ratings: ["HEAVY_JET"], training_valid_until: "2027-01-01T00:00:00Z" }
              as: FlightDeptManager
              captures: { sic_id: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${cpax}", charge_bu_id: "${bu_id}", trip_kind: "PERSONAL", purpose: "Personal", requested_departure_utc: "2026-08-10T10:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${cpax}"], personal_use_flag: true }
              as: ExecutiveRequester
              as_user_id: "${cpax}"
              captures: { trip_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KSEA", scheduled_departure_utc: "2026-08-10T10:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 1600 }
              as: ExecutiveRequester
              as_user_id: "${cpax}"
              captures: { leg_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${cpax}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/approve"
              payload: {}
              as: FlightDeptManager
            - call: "GET /flight-ops/trip-requests/${trip_id}"
              as: FlightDeptManager
              captures: { trip_v: $.data.version }
            - call: "POST /flight-ops/trip-requests/${trip_id}/assign-aircraft"
              payload: { expected_trip_request_version: "${trip_v}" }
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /flight-ops/flight-legs/${leg_id}/assign-crew"
              payload: { pic_crew_id: "${pic_id}", sic_crew_id: "${sic_id}" }
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /flight-ops/flight-legs/${leg_id}/release"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /flight-ops/trip-requests/${trip_id}/approve-personal-use"
              payload: {}
              as: FinanceAdmin
              as_user_id: "fin-1"
            - call: "POST /flight-ops/trip-requests/${trip_id}/dispatch"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-2"
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T14:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/flight-legs/${leg_id}/complete"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-2"
            - call: "GET /flight-ops/trip-requests/${trip_id}"
              as: FinanceAdmin
              captures: { trip_v2: $.data.version }
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/settle"
              payload: { expected_trip_request_version: "${trip_v2}" }
              as: FinanceAdmin
              as_user_id: "fin-2"
          assert:
            - "TripRequest.sifl_imputed_income_cents == 164000 (terminal 5000 + band1 500*30=15000 + band2 1000*20=20000 + band3 100*10=1000 = 41000; ×4 control multiplier = 164000)"

      - name: charter_proration_per_line_rounding_mode_b
        grounds:
          - calculations.trip_cost_allocation
          - entities.TripRequest.fields.allocated_cost_cents
        distinguishing_aspect: |
          Charter proration satisfies mode (b): nested rounding where the order
          matters — per-leg prorated share is rounded round_half_up per leg
          BEFORE summing, and any cent remainder is credited to the highest
          leg_sequence leg so the leg shares sum exactly to the charter quote.
          A 1,000,001-cent quote split 1:2 across 60-min and 120-min legs
          produces 333334 + 666667, not 333333 + 666668 (naive).
        test_recipe:
          setup:
            - "BU exists; TIER_1 passenger exists; SiflRatePeriod exists"
            - "Aircraft, PIC, SIC exist (for charter reject → force charter path)"
            - "Trip BUSINESS with 2 legs: leg1 60 min / leg2 120 min"
            - "Aircraft retired after approve → selector pool empty → CharterSupplement of 1,000,001 cents created and ACCEPTED"
            - "Both legs completed via dispatcher (charter flight recorded as completed)"
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-Y", name: "BU Y", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E501", full_name: "Pax Y", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax: $.data.id }
            - call: "POST /flight-ops/sifl-rate-periods"
              payload: { period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", terminal_charge_cents: 5000, rate_band_1_cents_per_mile: 30, rate_band_2_cents_per_mile: 20, rate_band_3_cents_per_mile: 10, control_employee_multiplier_pct: 400 }
              as: FinanceAdmin
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N501CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
              captures: { ac_id: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "Multi-leg", requested_departure_utc: "2026-08-10T10:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KBOS", scheduled_departure_utc: "2026-08-10T10:00:00Z", scheduled_arrival_utc: "2026-08-10T11:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { leg1: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 2, origin_icao: "KBOS", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 400 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { leg2: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/approve"
              payload: {}
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft/${ac_id}/retire"
              payload: {}
              as: FlightDeptManager
            - call: "POST /flight-ops/charter-supplements"
              payload: { trip_request_id: "${trip_id}", vendor_name: "CharterCo", quoted_cost_cents: 1000001, aircraft_type_offered: "LIGHT_JET" }
              as: Dispatcher
              captures: { charter_id: $.data.id }
            - call: "POST /flight-ops/charter-supplements/${charter_id}/accept"
              payload: {}
              as: FlightDeptManager
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T14:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/flight-legs/${leg1}/complete"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /flight-ops/flight-legs/${leg2}/complete"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "GET /flight-ops/trip-requests/${trip_id}"
              as: FinanceAdmin
              captures: { trip_v: $.data.version }
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/settle"
              payload: { expected_trip_request_version: "${trip_v}" }
              as: FinanceAdmin
              as_user_id: "fin-1"
          assert:
            - "TripRequest.allocated_cost_cents == 1000001 (sum of per-leg prorated shares must reconcile exactly to the charter quote)"
            - "leg1 share == round_half_up(1000001 * 60/180) = round_half_up(333333.666…) = 333334"
            - "leg2 share == 1000001 - 333334 = 666667 (remainder credited to highest leg_sequence)"
            - "Sum of rounded per-leg shares == 1000001, not 1000002 (naive round-each-and-sum) and not 1000000 (naive truncate-each)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: on DIFFERENT entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: trip_request_parallel_dimensions_independent
        grounds:
          - state_machines.TripRequest
          - entities.TripRequest.fields.approval_status
          - entities.TripRequest.fields.assignment_status
        distinguishing_aspect: |
          TripRequest carries parallel state dimensions (approval_status ×
          assignment_status). Approving a trip (DRAFT→SUBMITTED→APPROVED) does
          not change assignment_status (stays UNASSIGNED); conversely a trip
          can be assignment_status=CANCELLED while approval_status=APPROVED
          (ops cancel after approval). The two axes evolve independently.
        test_recipe:
          setup:
            - "BU + passenger exist; trip has 1 leg, SUBMITTED then APPROVED"
            - "assignment_status remains UNASSIGNED throughout approval"
            - "After approval, dispatcher cancels the trip — assignment_status transitions to CANCELLED while approval_status remains APPROVED"
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-PD", name: "BU PD", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E601", full_name: "Pax PD", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "X", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/approve"
              payload: {}
              as: FlightDeptManager
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/cancel"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "GET /flight-ops/trip-requests/${trip_id}"
              as: Dispatcher
              captures: { a_stat: $.data.approval_status, s_stat: $.data.assignment_status }
          assert:
            - "a_stat == APPROVED (approval axis unchanged by cancel)"
            - "s_stat == CANCELLED (assignment axis advanced independently)"

      - name: aircraft_posture_compound_from_children
        grounds:
          - state_machines.Aircraft
          - calculations.aircraft_posture_derivation
          - entities.Aircraft.fields.posture
        distinguishing_aspect: |
          Aircraft posture is a compound/aggregate state derived from child
          collections (MaintenanceWindow status set + DocumentPermit expiry).
          A single Aircraft with status=ACTIVE still reports MAINTENANCE_HOLD
          when an IN_PROGRESS window exists, and DOCUMENT_LAPSE when a required
          doc expires — three postures from one row, driven by children, not by
          the parent's own status field.
        test_recipe:
          setup:
            - "Aircraft created ACTIVE; no documents; no maintenance windows"
            - "Initial posture AVAILABLE"
            - "Add a PLANNED MaintenanceWindow covering current clock → posture recomputes to MAINTENANCE_HOLD (auto-start fires)"
            - "Cancel the window → posture returns to AVAILABLE"
            - "Add an EXPIRED AIRWORTHINESS_CERT → posture DOCUMENT_LAPSE"
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N701CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
              captures: { ac_id: $.data.id }
            - call: "POST /flight-ops/aircraft/${ac_id}/maintenance-windows"
              payload: { window_start_utc: "2026-07-31T00:00:00Z", window_end_utc: "2026-08-05T00:00:00Z", maintenance_kind: "SCHEDULED_INSPECTION" }
              as: MaintenancePlanner
              captures: { mw_id: $.data.id }
            - call: "GET /flight-ops/aircraft/${ac_id}"
              as: Dispatcher
              captures: { posture_1: $.data.posture }
            - call: "POST /flight-ops/maintenance-windows/${mw_id}/cancel"
              payload: {}
              as: MaintenancePlanner
            - call: "GET /flight-ops/aircraft/${ac_id}"
              as: Dispatcher
              captures: { posture_2: $.data.posture }
            - call: "POST /flight-ops/aircraft/${ac_id}/documents"
              payload: { doc_kind: "AIRWORTHINESS_CERT", identifier: "AW-1", issued_at: "2020-01-01T00:00:00Z", expires_at: "2026-07-01T00:00:00Z" }
              as: MaintenancePlanner
          trigger:
            - call: "GET /flight-ops/aircraft/${ac_id}"
              as: Dispatcher
              captures: { posture_3: $.data.posture }
          assert:
            - "posture_1 == MAINTENANCE_HOLD (auto-started IN_PROGRESS window on ACTIVE aircraft)"
            - "posture_2 == AVAILABLE (window cancelled, no docs expired yet)"
            - "posture_3 == DOCUMENT_LAPSE (AIRWORTHINESS_CERT expired relative to clock 2026-08-01)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: chains from DIFFERENT triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: reject_trip_cascades_leg_then_services
        grounds:
          - state_machines.TripRequest.transitions
          - state_machines.FlightLeg.transitions
          - state_machines.CateringOrder.transitions
        distinguishing_aspect: |
          Cascade depth 3: TripRequest.reject → FlightLeg CANCELLED →
          CateringOrder CANCELLED (each hop caused by the previous, not by the
          original reject call). Different trigger from the aircraft-ground
          cascade (Rule 4 second instance).
        test_recipe:
          setup:
            - "BU, pax exist; trip has 1 leg; CateringOrder in CONFIRMED on that leg"
            - "Trip SUBMITTED"
          setup_api_calls:
