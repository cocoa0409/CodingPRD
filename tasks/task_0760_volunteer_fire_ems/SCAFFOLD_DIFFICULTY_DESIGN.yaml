# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. Clock default 2026-03-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: cert_strict_vs_carryover_hours
        grounds:
          - calculations.cert_completed_hours
          - entities.Certification.fields.completed_hours_strict
          - entities.Certification.fields.completed_hours_carryover
          - state_machines.Certification.EXPIRED_to_CURRENT
        distinguishing_aspect: "On the SAME cert (Certification domain), STRICT counts 16.0 in-cycle hours while CARRYOVER adds 8.0 capped pre-cycle hours to reach 24.0 — renew (uses CARRYOVER) succeeds where an issue-style STRICT check would fail."
        test_recipe:
          setup:
            - "Member M with a FIREFIGHTER_1 (category FIRE, required 24) cert that has been issued, expired via sweep, and re-set so cycle_start_at=2027-03-01."
            - "TrainingRecords: 24h FIRE dated 2026-03-01 (initial issue), 8h FIRE dated 2027-01-15 (pre-cycle window), 16h FIRE dated 2027-03-01 (new cycle)."
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off One", email: "off1a@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M CarryOver", email: "mco@x.com", role_class: "FIREFIGHTER", join_date: "2026-01-01T00:00:00Z", dues_balance_cents: 0 }, as: Chief, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/certifications", payload: { cert_type: "FIREFIGHTER_1", category: "FIRE" }, as: Officer, as_user_id: "${off_id}", captures: { c_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/training-records", payload: { category: "FIRE", hours: 24, training_date: "2026-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /certifications/${c_id}/issue", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: Chief }
            - { call: "POST /certifications/sweep", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /members/${m_id}/training-records", payload: { category: "FIRE", hours: 8, training_date: "2027-01-15T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /members/${m_id}/training-records", payload: { category: "FIRE", hours: 16, training_date: "2027-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
          trigger:
            - { call: "POST /certifications/${c_id}/renew", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { rstatus: "$.data.status" } }
            - { call: "GET /certifications/${c_id}", payload: {}, as: Officer, as_user_id: "${off_id}" }
          assert:
            - "Certification.${c_id}.status == CURRENT"
            - "Certification.${c_id}.completed_hours_strict == 16.0"
            - "Certification.${c_id}.completed_hours_carryover == 24.0"

      - name: stipend_provisional_vs_final
        grounds:
          - calculations.member_stipend
          - entities.Member.fields.stipend_cents
          - entities.Member.fields.points_ytd
        distinguishing_aspect: "On the SAME member (Member domain, distinct from the Certification-domain instance), PROVISIONAL counts a scheduled ASSIGNED duty shift (P=21, GOLD, stipend 5250) while FINAL excludes it (P=15, SILVER, stipend 2250)."
        test_recipe:
          setup:
            - "Eligible EMT member M with one RELEASED turnout worth 9 pts, one VERIFIED 12h duty (6 pts), and one still-ASSIGNED future 12h duty (6 provisional-only pts). dues_balance_cents=0."
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Two", email: "off2b@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M Stipend", email: "mstip@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z", dues_balance_cents: 0 }, as: Chief, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/certifications", payload: { cert_type: "EMT_BASIC", category: "EMS" }, as: Officer, as_user_id: "${off_id}", captures: { c_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/training-records", payload: { category: "EMS", hours: 20, training_date: "2026-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /certifications/${c_id}/issue", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /members/${m_id}/activate", payload: {}, as: Chief }
            - { call: "POST /stations", payload: { name: "S1" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "MEDIC-1", apparatus_type: "AMBULANCE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            # ---- incident -> turnout worth 9 pts ----
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T01:00:00Z" }, as: Chief }
            - { call: "POST /incidents", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", incident_type: "STRUCTURE_FIRE", alarm_at: "2026-03-02T00:55:00Z" }, as: Officer, as_user_id: "${off_id}", captures: { inc_id: "$.data.id" } }
            - { call: "POST /incidents/${inc_id}/enroute", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/arrive", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/turnouts", payload: { member_id: "${m_id}" }, as: Officer, as_user_id: "${off_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T03:30:00Z" }, as: Chief }
            - { call: "POST /incidents/${inc_id}/clear", payload: {}, as: Officer, as_user_id: "${off_id}" }
            # ---- verified 12h duty shift (6 pts) ----
            - { call: "POST /duty-shifts", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", start_at: "2026-03-03T06:00:00Z", end_at: "2026-03-03T18:00:00Z", max_crew: 4, min_crew: 1 }, as: Officer, as_user_id: "${off_id}", captures: { sh1_id: "$.data.id", sh1_v: "$.data.version" } }
            - { call: "POST /duty-shifts/${sh1_id}/publish", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /duty-shifts/${sh1_id}/assignments", payload: { member_id: "${m_id}", expected_duty_shift_version: "${sh1_v}" }, as: Officer, as_user_id: "${off_id}", captures: { a1_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-03T06:05:00Z" }, as: Chief }
            - { call: "POST /duty-assignments/${a1_id}/check-in", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-03T18:05:00Z" }, as: Chief }
            - { call: "POST /duty-shifts/sweep", payload: {}, as: Officer, as_user_id: "${off_id}" }
            # ---- scheduled (ASSIGNED, future) 12h duty shift (6 provisional pts) ----
            - { call: "POST /duty-shifts", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", start_at: "2026-03-10T06:00:00Z", end_at: "2026-03-10T18:00:00Z", max_crew: 4, min_crew: 1 }, as: Officer, as_user_id: "${off_id}", captures: { sh2_id: "$.data.id", sh2_v: "$.data.version" } }
            - { call: "POST /duty-shifts/${sh2_id}/publish", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /duty-shifts/${sh2_id}/assignments", payload: { member_id: "${m_id}", expected_duty_shift_version: "${sh2_v}" }, as: Officer, as_user_id: "${off_id}" }
          trigger:
            - { call: "GET /members/${m_id}/summary?basis=FINAL", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { pf: "$.data.points_ytd", sf: "$.data.stipend_cents" } }
            - { call: "GET /members/${m_id}/summary?basis=PROVISIONAL", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { pp: "$.data.points_ytd", sp: "$.data.stipend_cents" } }
          assert:
            - "GET summary?basis=FINAL: data.points_ytd == 15 AND data.stipend_cents == 2250"
            - "GET summary?basis=PROVISIONAL: data.points_ytd == 21 AND data.stipend_cents == 5250"

  - rule_id: combinatorial_formula
    instances:
      - name: turnout_points_tiered_role_and_officer_bonus
        grounds:
          - calculations.turnout_points
          - state_machines.Incident.response_ONSCENE_to_response_CLEARED
          - entities.TurnoutResponse.fields.turnout_points
        distinguishing_aspect: "Mode (a): turnout_points takes >=3 inputs (incident_type base, role_class multiplier, nested min-capped scene hours, conditional OFFICER IC bonus) — EMT scores round(5*1.2)+3+0=9 while OFFICER scores round(5*1.5)+3+2=13 on the same incident."
        test_recipe:
          setup:
            - "One STRUCTURE_FIRE incident, onscene 01:00 -> cleared 03:30 (2.5h -> ceil 3). One EMT turnout and one OFFICER turnout, both RELEASED on clear."
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Cmd", email: "offc@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M Emt", email: "memt@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { emt_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S2" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "ENGINE-2", apparatus_type: "ENGINE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T01:00:00Z" }, as: Chief }
            - { call: "POST /incidents", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", incident_type: "STRUCTURE_FIRE", alarm_at: "2026-03-02T00:50:00Z" }, as: Officer, as_user_id: "${off_id}", captures: { inc_id: "$.data.id" } }
            - { call: "POST /incidents/${inc_id}/enroute", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/arrive", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/turnouts", payload: { member_id: "${emt_id}" }, as: Officer, as_user_id: "${off_id}", captures: { t_emt: "$.data.id" } }
            - { call: "POST /incidents/${inc_id}/turnouts", payload: { member_id: "${off_id}" }, as: Officer, as_user_id: "${off_id}", captures: { t_off: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T03:30:00Z" }, as: Chief }
          trigger:
            - { call: "POST /incidents/${inc_id}/clear", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "GET /turnouts/${t_emt}", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "GET /turnouts/${t_off}", payload: {}, as: Officer, as_user_id: "${off_id}" }
          assert:
            - "TurnoutResponse.${t_emt}.turnout_points == 9"
            - "TurnoutResponse.${t_off}.turnout_points == 13"

      - name: stipend_pinned_tier_then_waiver_order
        grounds:
          - calculations.member_stipend
          - entities.Member.fields.stipend_cents
          - entities.Member.fields.dues_balance_cents
        distinguishing_aspect: "Mode (c): the tier<->dues-waiver dependency is circular-looking; evaluation order is PINNED so tier=GOLD is fixed from P=20 BEFORE the waiver, giving gross 5000, full dues waiver of 1000, net = max(0, 5000 - (1000-1000)) = 5000 (waiver never re-upgrades tier)."
        test_recipe:
          setup:
            - "Member with dues_balance_cents=1000 and exactly 20 points (via a single +20 PointAdjustment) -> GOLD tier."
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Three", email: "off3@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M Gold", email: "mgold@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z", dues_balance_cents: 1000 }, as: Chief, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/point-adjustments", payload: { points: 20, reason: "drill points" }, as: Officer, as_user_id: "${off_id}" }
          trigger:
            - { call: "GET /members/${m_id}/summary?basis=FINAL", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { tier: "$.data.points_tier", st: "$.data.stipend_cents" } }
          assert:
            - "GET summary: data.points_tier == GOLD"
            - "GET summary: data.stipend_cents == 5000"

  - rule_id: non_linear_state_machine
    instances:
      - name: certification_recert_cycle_revisits_current
        grounds:
          - state_machines.Certification.CURRENT_to_EXPIRING
          - state_machines.Certification.EXPIRING_to_EXPIRED
          - state_machines.Certification.EXPIRED_to_CURRENT
        distinguishing_aspect: "Certification is CYCLIC: CURRENT -> EXPIRING -> EXPIRED -> CURRENT re-enters CURRENT (a previously-visited state), which a linear pipeline cannot do."
        test_recipe:
          setup:
            - "A FIREFIGHTER_1 cert issued CURRENT at 2026-03-01 (expires 2027-03-01); enough training exists to renew via carryover."
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Cyc", email: "offcyc@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M Cyc", email: "mcyc@x.com", role_class: "FIREFIGHTER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/certifications", payload: { cert_type: "FIREFIGHTER_1", category: "FIRE" }, as: Officer, as_user_id: "${off_id}", captures: { c_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/training-records", payload: { category: "FIRE", hours: 24, training_date: "2026-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /certifications/${c_id}/issue", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-15T00:00:00Z" }, as: Chief }
            - { call: "POST /certifications/sweep", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: Chief }
            - { call: "POST /certifications/sweep", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /members/${m_id}/training-records", payload: { category: "FIRE", hours: 24, training_date: "2027-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
          trigger:
            - { call: "GET /certifications/${c_id}", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { pre: "$.data.status" } }
            - { call: "POST /certifications/${c_id}/renew", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { post: "$.data.status" } }
          assert:
            - "Before renew (after 2027-03-01 sweep): Certification.${c_id}.status == EXPIRED"
            - "After renew: Certification.${c_id}.status == CURRENT"

      - name: incident_parallel_response_and_report_dimensions
        grounds:
          - state_machines.Incident.response_ONSCENE_to_response_CLEARED
          - state_machines.Incident.report_NONE_to_report_DRAFT
          - state_machines.Incident.report_DRAFT_to_report_LOCKED
          - entities.Incident.fields.response_status
          - entities.Incident.fields.report_status
        distinguishing_aspect: "Incident carries two INDEPENDENT (parallel) state dimensions on one row: report_status advances NONE->DRAFT->LOCKED while response_status stays fixed at CLEARED (the report dimension does not move the response dimension)."
        test_recipe:
          setup:
            - "One incident driven to response CLEARED with NFIRS fields supplied on the draft."
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Par", email: "offpar@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S3" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "ENGINE-3", apparatus_type: "ENGINE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /incidents", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", incident_type: "MVA", alarm_at: "2026-03-02T00:00:00Z" }, as: Officer, as_user_id: "${off_id}", captures: { inc_id: "$.data.id" } }
            - { call: "POST /incidents/${inc_id}/enroute", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/arrive", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/clear", payload: {}, as: Officer, as_user_id: "${off_id}" }
          trigger:
            - { call: "POST /incidents/${inc_id}/report", payload: { nfirs_property_use: "419", nfirs_actions_taken: "11" }, as: Officer, as_user_id: "${off_id}", captures: { rs1: "$.data.report_status", resp1: "$.data.response_status" } }
            - { call: "POST /incidents/${inc_id}/report/lock", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { rs2: "$.data.report_status", resp2: "$.data.response_status" } }
          assert:
            - "After report: Incident.${inc_id}.report_status == DRAFT AND Incident.${inc_id}.response_status == CLEARED"
            - "After lock: Incident.${inc_id}.report_status == LOCKED AND Incident.${inc_id}.response_status == CLEARED"

  - rule_id: transitive_cascade
    instances:
      - name: cert_expiry_cascades_to_shift_understaffing
        grounds:
          - state_machines.Certification.EXPIRING_to_EXPIRED
          - calculations.response_eligibility
          - state_machines.DutyAssignment.ASSIGNED_to_CANCELLED
          - calculations.shift_staffing
        distinguishing_aspect: "Depth-4 chain from a cert sweep: Certification EXPIRING->EXPIRED (A) -> Member.response_eligible=false (B) -> member's future ASSIGNED DutyAssignment CANCELLED (C) -> DutyShift.staffing_status UNDERSTAFFED (D); each hop is caused by the prior hop."
        test_recipe:
          setup:
            - "Eligible EMT member M assigned (ASSIGNED) to a PUBLISHED future shift (start 2027-03-05, min_crew 1) whose only required cert expires 2027-03-01."
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Csc", email: "offcsc@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M Csc", email: "mcsc@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z", dues_balance_cents: 0 }, as: Chief, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/certifications", payload: { cert_type: "EMT_BASIC", category: "EMS" }, as: Officer, as_user_id: "${off_id}", captures: { c_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/training-records", payload: { category: "EMS", hours: 20, training_date: "2026-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /certifications/${c_id}/issue", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /members/${m_id}/activate", payload: {}, as: Chief }
            - { call: "POST /stations", payload: { name: "S4" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "MEDIC-4", apparatus_type: "AMBULANCE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /duty-shifts", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", start_at: "2027-03-05T06:00:00Z", end_at: "2027-03-05T18:00:00Z", max_crew: 4, min_crew: 1 }, as: Officer, as_user_id: "${off_id}", captures: { sh_id: "$.data.id", sh_v: "$.data.version" } }
            - { call: "POST /duty-shifts/${sh_id}/publish", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /duty-shifts/${sh_id}/assignments", payload: { member_id: "${m_id}", expected_duty_shift_version: "${sh_v}" }, as: Officer, as_user_id: "${off_id}", captures: { a_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: Chief }
          trigger:
            - { call: "POST /certifications/sweep", payload: {}, as: Officer, as_user_id: "${off_id}" }
          assert:
            - "Certification.${c_id}.status == EXPIRED"
            - "Member.${m_id}.response_eligible == false"
            - "DutyAssignment.${a_id}.status == CANCELLED"
            - "DutyShift.${sh_id}.staffing_status == UNDERSTAFFED"

      - name: equipment_oos_cascades_to_shift_suspend
        grounds:
          - state_machines.Equipment.OPERATIONAL_to_OUT_OF_SERVICE
          - calculations.apparatus_posture
          - state_machines.DutyShift.PUBLISHED_to_SUSPENDED
        distinguishing_aspect: "Depth-3 chain from a different trigger (equipment failure): Equipment OPERATIONAL->OUT_OF_SERVICE (A) -> Apparatus.posture OUT_OF_SERVICE (B) -> PUBLISHED future DutyShift SUSPENDED (C)."
        test_recipe:
          setup:
            - "Apparatus IN_SERVICE with one critical Equipment OPERATIONAL; one PUBLISHED future shift (start 2026-04-01) on it."
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Eq", email: "offeq@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S5" }, as: Chief, captures: { st_id: "$.data.id" } }
