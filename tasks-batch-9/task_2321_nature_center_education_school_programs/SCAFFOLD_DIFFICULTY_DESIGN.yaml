scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: booking_fee_provisional_vs_final_diverges_on_actual_headcount
        grounds:
          - calculations.booking_fee_assessment
          - entities.Booking.fields.provisional_gross_fee_cents
          - entities.Booking.fields.final_gross_fee_cents
          - state_machines.Booking.CONFIRMED_to_DELIVERED
        distinguishing_aspect: |
          This dual variant lives in the cost-accounting domain on Booking: the provisional
          variant prices 30 planned students in the 30-59 volume band (10% off) and the final
          variant prices 28 recorded students in the 15-29 band (5% off), so the same booking
          carries two different gross fees, 33300 and 32788.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z (Monday of the ISO week [2026-09-28, 2026-10-05))"
            - "ProgramOffering PUBLISHED: G3_5, ONSITE_FIELD_TRIP, 120 minutes, max_group_size 60, ratio 10, base_fee_cents_per_student 1233, two standard alignments, both materials PUBLISHED"
            - "SchoolPartner ACTIVE with title_i_pct 0.82 and distance_miles 12.5"
            - "Educator CLEARED and CURRICULUM-certified for G3_5"
            - "Booking CONFIRMED for 30 students and 3 chaperones with provisional_gross_fee_cents 33300"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T07:00:00Z" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/program-offerings"
              payload: { title: "Pond Ecology Field Study", grade_band: "G3_5", delivery_mode: "ONSITE_FIELD_TRIP", duration_minutes: 120, max_group_size: 60, min_chaperone_ratio_students_per_adult: 10, base_fee_cents_per_student: 1233, requires_live_animal: false, requires_trail_segment: false, public_contact_required: false }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off_id: $.data.id }
            - call: "POST /nature-center/program-offerings/${off_id}/standard-alignments"
              payload: { standard_code: "3-LS4-3", dimension: "DISCIPLINARY_CORE_IDEA" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/standard-alignments"
              payload: { standard_code: "3-LS4-4", dimension: "SCIENCE_PRACTICE" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/materials"
              payload: { phase: "PRE_VISIT", url_slug: "pond-pre" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { pre_mat_id: $.data.id }
            - call: "POST /nature-center/program-offerings/${off_id}/materials"
              payload: { phase: "POST_VISIT", url_slug: "pond-post" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { post_mat_id: $.data.id }
            - call: "POST /nature-center/curriculum-materials/${pre_mat_id}/publish"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/curriculum-materials/${post_mat_id}/publish"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/submit-for-review"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/review"
              payload: { decision: "PUBLISH" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/schools"
              payload: { name: "Cedar Grove Elementary", district_code: "LEA-77", title_i_pct: 0.82, distance_miles: 12.5 }
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { school_id: $.data.id }
            - call: "POST /nature-center/educators"
              payload: { full_name: "Rae Alder", employment_type: "STAFF_NATURALIST" }
              as: EducationDirector
              as_user_id: "ed-01"
              captures: { edu_id: $.data.id }
            - call: "POST /nature-center/educators/${edu_id}/advance-hiring"
              payload: { action: "START_ONBOARDING" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/educators/${edu_id}/training-records"
              payload: { track: "CURRICULUM", grade_band: "G3_5" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { tr_id: $.data.id }
            - call: "POST /nature-center/training-records/${tr_id}/assess"
              payload: { outcome: "PASS", score: 88 }
              as: CurriculumSpecialist
              as_user_id: "cs-02"
            - call: "POST /nature-center/educators/${edu_id}/advance-hiring"
              payload: { action: "CLEAR" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/bookings"
              payload: { school_id: "${school_id}", offering_id: "${off_id}", start_utc: "2026-09-29T14:00:00Z", end_utc: "2026-09-29T16:00:00Z", student_count: 30, chaperone_count: 3 }
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { bk_id: $.data.id, bk_ver: $.data.version }
            - call: "POST /nature-center/bookings/${bk_id}/assign-resources"
              payload: { expected_booking_version: "${bk_ver}", lead_educator_id: "${edu_id}" }
              as: BookingCoordinator
              as_user_id: "bc-01"
            - call: "POST /nature-center/bookings/${bk_id}/confirm"
              payload: {}
              as: BookingCoordinator
              as_user_id: "bc-01"
          trigger:
            - call: "POST /nature-center/bookings/${bk_id}/deliver"
              payload: { actual_student_count: 28, actual_chaperone_count: 3 }
              as: BookingCoordinator
              as_user_id: "bc-01"
          assert:
            - "Booking.${bk_id}.provisional_gross_fee_cents == 33300"
            - "Booking.${bk_id}.final_gross_fee_cents == 32788"
            - "Booking.${bk_id}.final_gross_fee_cents != Booking.${bk_id}.provisional_gross_fee_cents"
            - "Booking.${bk_id}.net_due_cents == 32788"
            - "Booking.${bk_id}.delivery_status == DELIVERED"
            - "Booking.${bk_id}.funding_status == INVOICED"

      - name: animal_exposure_projected_vs_realized_diverges_on_contact_minutes
        grounds:
          - calculations.animal_exposure_and_welfare_posture
          - entities.AnimalAmbassador.fields.projected_exposure_minutes_7d
          - entities.AnimalAmbassador.fields.realized_exposure_minutes_7d
          - state_machines.Booking.CONFIRMED_to_DELIVERED
        distinguishing_aspect: |
          This dual variant lives in the animal-welfare domain on AnimalAmbassador, not in cost
          accounting: the projected variant reserves the offering's scheduled 120 minutes while
          the booking is CONFIRMED, and the realized variant records the 75 minutes of contact
          actually logged at delivery, so the two exposure metrics diverge by 45 minutes on the
          same animal.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "ACTIVE Permit valid 2026-01-01 through 2027-12-31"
            - "AnimalAmbassador AVAILABLE under that permit with weekly_exposure_cap_minutes 240, contact_rule VIEW_ONLY, handling_tier_required TIER_1"
            - "ProgramOffering PUBLISHED requiring a live animal, 120 minutes, G3_5"
            - "Educator CLEARED, CURRICULUM-certified for G3_5 and holding a TIER_1 animal-handling pass"
            - "Booking CONFIRMED with that animal, so projected_exposure_minutes_7d is 120 and realized is 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T07:00:00Z" }
              as: EducationDirector
              as_user_id: "ed-01"
