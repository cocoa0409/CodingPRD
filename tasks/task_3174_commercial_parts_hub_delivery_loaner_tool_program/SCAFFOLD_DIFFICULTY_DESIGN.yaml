# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml  (§1.8 Test Targeting Index)
# Task: task_3174_commercial_parts_hub_delivery_loaner_tool_program
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.6 and is realised by a
# structured, empty-DB-executable test_recipe. 18 instances, 2 per §0.5 rule.
#
# Shared preamble used by every recipe below (repeated per instance so each is
# self-contained): the logical clock starts at the fixed startup default
# 2026-09-01T00:00:00Z and is moved with POST /commercial/_clock/set_current_utc.
# There is no seeding endpoint; every fixture is built from the declared
# business surface.
# =============================================================================
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: delivery_fee_point_of_sale_vs_final_actual
    grounds:
    - calculations.delivery_fee_schedule
    - calculations.source_promise
    - entities.PartOrder.fields.delivery_fee_cents
    - entities.PartOrder.fields.fulfillment_route
    distinguishing_aspect: 'The two variants of delivery_fee_schedule sit on the PartOrder

      delivery-fee metric (read at DRAFT/CONFIRMED versus re-read at

      DELIVERED), whereas the sibling instance reads the CommercialAccount

      posture metric — so dual-variant logic is exercised on two different

      entity domains, not twice on the same subject.

      '
    test_recipe:
      setup:
      - Satellite store s_sat and hub store s_hub; account A on SHOP_DELIVERY with credit_terms_days 30
      - Only s_hub stocks p_plug (20 units); s_sat stocks none of p_plug
      - Order O4 is routed the same way in both variants but with a different delivery_service_level reading (HUB_DAILY versus HUB_DAILY_SHORT)
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Riverside Satellite
          store_type: SATELLITE
          delivery_radius_miles: 8.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/stores
        payload:
          store_code: S200
          name: Riverside Hub
          store_type: HUB
          delivery_radius_miles: 30.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 60
          daily_capacity_units: 500
          hub_store_id: null
        as: PartsCategoryManager
        captures:
          s_hub: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: PLUG-100
          description: Spark Plug Set
          line_code: IGN
          list_price_cents: 1673
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p_plug: $.data.id
      - call: POST /commercial/vehicles
        payload:
          vin: 1HGCM82633A004352
          year: 2019
          make: Kestrel
          model: Vireo
          engine_code: 2.4L-I4
          drive_type: FWD
        as: CommercialSalesRep
        captures:
          ven_v: $.data.id
      - call: POST /commercial/parts/{partId}/fitments
        payload:
          year_from: 2015
          year_to: 2024
          make: Kestrel
          model: Vireo
          engine_code: 2.4L-I4
          drive_type: FWD
        as: PartsCategoryManager
        captures:
          f_plug: $.data.id
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_hub}
          part_id: ${p_plug}
          on_hand_units: 20
        as: PartsCategoryManager
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Delta Auto Care
          tax_id: TX-9911
          billing_address: 9 Mission Rd
          home_store_id: ${s_sat}
          credit_limit_cents: 1000000
          credit_terms_days: 30
          delivery_service_level: HUB_DAILY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
          acct_v: $.data.version
      trigger:
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          vehicle_id: ${ven_v}
          line_items:
          - part_id: ${p_plug}
            quantity: 1
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          o1: $.data.id
          o1_route: $.data.fulfillment_route
          o1_fee: $.data.delivery_fee_cents
      assert:
      - PartOrder.${o1}.fulfillment_route == "HUB" — the satellite holds no p_plug, so band 1 fails and band 2 selects the hub
      - 'PartOrder.${o1}.delivery_fee_cents == 0 (point_of_sale variant: route HUB and delivery_service_level exactly HUB_DAILY)'
      - a second account on delivery_service_level HUB_DAILY_SHORT getting the identical HUB route reads delivery_fee_cents == 795, so the two variants diverge on identical routing input
  - name: account_posture_aging_first_vs_exposure_first
    grounds:
    - calculations.account_posture_derivation
    - state_machines.CommercialAccount.field.account_posture.transitions.OPEN_to_CREDIT_SUSPENDED
    - entities.CommercialAccount.fields.account_posture
    distinguishing_aspect: 'The two variants of account_posture_derivation sit on the

      CommercialAccount aggregate posture (aging-test-first versus

      exposure-test-first), whereas the sibling instance reads the PartOrder

      delivery-fee metric — the dual-variant logic therefore operates on two

      distinct entity domains.

      '
    test_recipe:
      setup:
      - Account A on NET_30 (credit_terms_days 30) with credit_limit_cents 1000 and an oldest delivered_payment_due_at far behind the clock
      - Account A also carries credit_exposure_cents above its 1000-cent limit, so BOTH the aging condition and the exposure condition hold
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S300
          name: Aging Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: AGING-1
          description: Oil Filter
          line_code: FLT
          list_price_cents: 200000
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p_f: $.data.id
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_sat}
          part_id: ${p_f}
          on_hand_units: 10
        as: PartsCategoryManager
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Overdue Garage
          tax_id: TX-9912
          billing_address: 1 Old Rd
          home_store_id: ${s_sat}
          credit_limit_cents: 1000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
          acct_v: $.data.version
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          line_items:
          - part_id: ${p_f}
            quantity: 1
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          o1: $.data.id
          o1_v: $.data.version
      - call: POST /commercial/part-orders/{orderId}/confirm
        payload:
          expected_order_version: ${o1_v}
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          o1_v2: $.data.version
          acct_v2: $.data.version
      - call: POST /commercial/part-orders/{orderId}/allocate
        payload:
          expected_order_version: ${o1_v2}
          expected_account_version: ${acct_v2}
        as: CommercialSalesRep
        captures:
          acct_v3: $.data.version
      - call: POST /commercial/part-orders/{orderId}/pick
        payload: {}
        as: CommercialSalesRep
      - call: POST /commercial/part-orders/{orderId}/deliver
        payload: {}
        as: DeliveryDriver
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-11-15T08:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /commercial/commercial-accounts/${acct}/posture
        payload: {}
        as: CreditAnalyst
      assert:
      - the response data account_posture == "CREDIT_SUSPENDED" — the aging test is evaluated before the exposure test
      - the response data receivable_balance_cents == 200000, which itself exceeds credit_limit_cents == 1000
      - GET /commercial/commercial-accounts/${acct} reports account_posture == "CREDIT_SUSPENDED" and never ON_HOLD for the same row
      - an account whose oldest due instant is exactly credit_terms_days + 30 days before the clock stays OPEN, because the aging comparison is strictly earlier
- rule_id: combinatorial_formula
  instances:
  - name: tier_line_price_per_line_rounding_plus_band_step
    grounds:
    - calculations.tier_line_price
    - entities.PartOrder.fields.member_sequence
    - entities.PartOrder.fields.pricing_band
    - entities.PartOrder.fields.tier_discount_cents
    distinguishing_aspect: 'Satisfies mode (b): the rounding order is decisive — rounding each

      line then summing yields 630 cents of discount on order O4 while

      summing then rounding yields 631, so the scaffold pins the per-line

      order for DRAFT/CONFIRMED and the order-level order for ALLOCATED.

      '
    test_recipe:
      setup:
      - Satellite s_sat and mega-hub s_mega; account A on SHOP_DELIVERY with credit_terms_days 30
      - O4 is the account's fourth order, so member_sequence 4 puts it in the SILVER band (0.05)
      - 'O4 carries two lines: 3 x p_hubassy at list 3005 (hub stock) and 3 x p_fog at list 1199 (mega-hub stock)'
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S400
          name: Rounding Satellite
          store_type: SATELLITE
          delivery_radius_miles: 8.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/stores
        payload:
          store_code: S500
          name: Rounding Hub
          store_type: HUB
          delivery_radius_miles: 30.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 90
          daily_capacity_units: 500
          hub_store_id: null
        as: PartsCategoryManager
        captures:
          s_hub: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: PLUG-100
          description: Spark Plug Set
          line_code: IGN
          list_price_cents: 1673
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p_plug: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: HUBASSY-9
          description: Hub Assembly
          line_code: DRV
          list_price_cents: 3005
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p_hubassy: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: FOG-3
          description: Fog Lamp
          line_code: LGT
          list_price_cents: 1199
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p_fog: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: NOTFIT-1
          description: Universal Clamp
          line_code: ACC
          list_price_cents: 199
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p_notfit: $.data.id
      - call: POST /commercial/vehicles
        payload:
          vin: 1HGCM82633A004352
          year: 2019
          make: Kestrel
          model: Vireo
          engine_code: 2.4L-I4
          drive_type: FWD
        as: CommercialSalesRep
        captures:
          ven_v: $.data.id
      - call: POST /commercial/parts/{partId}/fitments
        payload:
          year_from: 2015
          year_to: 2024
          make: Kestrel
          model: Vireo
          engine_code: 2.4L-I4
          drive_type: FWD
        as: PartsCategoryManager
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_sat}
          part_id: ${p_plug}
          on_hand_units: 10
        as: PartsCategoryManager
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_hub}
          part_id: ${p_plug}
          on_hand_units: 20
        as: PartsCategoryManager
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_hub}
          part_id: ${p_hubassy}
          on_hand_units: 10
        as: PartsCategoryManager
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_hub}
          part_id: ${p_notfit}
          on_hand_units: 2
        as: PartsCategoryManager
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_hub}
          part_id: ${p_fog}
          on_hand_units: 20
        as: PartsCategoryManager
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Rounding Motors
          tax_id: TX-9920
          billing_address: 12 Gear St
          home_store_id: ${s_sat}
          credit_limit_cents: 1000000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
          acct_v: $.data.version
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          vehicle_id: ${ven_v}
          line_items:
          - part_id: ${p_plug}
            quantity: 2
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          o1: $.data.id
          o1_v: $.data.version
          acct_v1: $.data.version
      - call: POST /commercial/part-orders/{orderId}/confirm
        payload:
          expected_order_version: ${o1_v}
          expected_account_version: ${acct_v1}
        as: CommercialSalesRep
        captures:
          acct_v2: $.data.version
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          vehicle_id: ${ven_v}
          line_items:
          - part_id: ${p_plug}
            quantity: 2
          expected_account_version: ${acct_v2}
        as: CommercialSalesRep
        captures:
          o2: $.data.id
          o2_v: $.data.version
          acct_v3: $.data.version
      - call: POST /commercial/part-orders/{orderId}/confirm
        payload:
          expected_order_version: ${o2_v}
          expected_account_version: ${acct_v3}
        as: CommercialSalesRep
        captures:
          acct_v4: $.data.version
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          vehicle_id: ${ven_v}
          line_items:
          - part_id: ${p_plug}
            quantity: 2
          expected_account_version: ${acct_v4}
        as: CommercialSalesRep
        captures:
          o3: $.data.id
          o3_v: $.data.version
          acct_v5: $.data.version
      - call: POST /commercial/part-orders/{orderId}/confirm
        payload:
          expected_order_version: ${o3_v}
          expected_account_version: ${acct_v5}
        as: CommercialSalesRep
        captures:
          acct_v6: $.data.version
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          vehicle_id: ${ven_v}
          line_items:
          - part_id: ${p_hubassy}
            quantity: 3
          - part_id: ${p_fog}
            quantity: 3
          expected_account_version: ${acct_v6}
        as: CommercialSalesRep
        captures:
          o4: $.data.id
          o4_v: $.data.version
          acct_v7: $.data.version
          o4_prov_disc: $.data.tier_discount_cents
          o4_prov_sub: $.data.parts_subtotal_cents
      trigger:
      - call: POST /commercial/part-orders/${o4}/confirm
        payload:
          expected_order_version: ${o4_v}
          expected_account_version: ${acct_v7}
        as: CommercialSalesRep
        captures:
          o4_v2: $.data.version
      - call: POST /commercial/part-orders/${o4}/allocate
        payload:
          expected_order_version: ${o4_v2}
          expected_account_version: ${acct_v7}
        as: CommercialSalesRep
      assert:
      - PartOrder.${o4}.member_sequence == 4 and PartOrder.${o4}.pricing_band == "SILVER"
      - 'the DRAFT reading was PartOrder.${o4}.tier_discount_cents == 630 (round each line: 150+59, times 3 lines each)'
      - the DRAFT reading was PartOrder.${o4}.parts_subtotal_cents == 11982
      - after ALLOCATED, PartOrder.${o4}.tier_discount_cents == 631 (round the 12612-cent order subtotal once)
      - after ALLOCATED, PartOrder.${o4}.parts_subtotal_cents == 11981
      - rounding order changes the answer by exactly 1 cent on identical input data
  - name: core_credit_nested_core_portion_max_and_waterfall_cap
    grounds:
    - calculations.core_credit
    - calculations.ordered_quantity_credit
    - calculations.refundable_deposit_amount
    - entities.CoreReturn.fields.credit_amount_cents
    distinguishing_aspect: 'Satisfies mode (a): core_credit nests a per-term ceil inside a max

      across two differently-keyed bases and then subtracts a restocking

      fee, while refundable_deposit_amount wraps the result in a monotone

      waterfall cap — at least three interacting inputs with conditional

      branches on state.

      '
    test_recipe:
      setup:
      - Delivered order O1 on account A with 4 x p_machined (core 3000) and 2 x p_coreused (core 500), so core_charge_total_cents == 13000 and refundable_deposit_cents == 2600
      - CR1 returns 4 x p_machined; CR2 returns 2 x p_coreused; CR2's p_coreused carries a WarrantyRegistration that has not lapsed
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S800
          name: Core Satellite
          store_type: SATELLITE
          delivery_radius_miles: 6.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/stores
        payload:
          store_code: S900
          name: Core Hub
          store_type: HUB
          delivery_radius_miles: 40.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 150
          daily_capacity_units: 800
          hub_store_id: null
        as: PartsCategoryManager
        captures:
          s_hub: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: MACHINED-1
          description: Machined Rotor
          line_code: BRK
          list_price_cents: 8000
          core_charge_cents: 3000
        as: PartsCategoryManager
        captures:
          p_mach: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: COREUSED-1
          description: Reworked Caliper
          line_code: BRK
          list_price_cents: 4000
          core_charge_cents: 500
        as: PartsCategoryManager
        captures:
          p_used: $.data.id
      - call: POST /commercial/vehicles
        payload:
          vin: 1HGCM82633A004353
          year: 2020
          make: Kestrel
          model: Vireo
          engine_code: 2.4L-I4
          drive_type: FWD
        as: CommercialSalesRep
        captures:
          ven_v: $.data.id
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_hub}
          part_id: ${p_mach}
          on_hand_units: 10
        as: PartsCategoryManager
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_hub}
          part_id: ${p_used}
          on_hand_units: 10
        as: PartsCategoryManager
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Core Works
          tax_id: TX-9930
          billing_address: 44 Axle Ave
          home_store_id: ${s_sat}
          credit_limit_cents: 5000000
          credit_terms_days: 60
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
          acct_v: $.data.version
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          vehicle_id: ${ven_v}
          line_items:
          - part_id: ${p_mach}
            quantity: 4
          - part_id: ${p_used}
            quantity: 2
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          o1: $.data.id
          o1_v: $.data.version
          acct_v1: $.data.version
          o1_core_total: $.data.core_charge_total_cents
          o1_deposit: $.data.refundable_deposit_cents
      - call: POST /commercial/part-orders/{orderId}/confirm
        payload:
          expected_order_version: ${o1_v}
          expected_account_version: ${acct_v1}
        as: CommercialSalesRep
        captures:
          o1_v2: $.data.version
          acct_v2: $.data.version
      - call: POST /commercial/part-orders/{orderId}/allocate
        payload:
          expected_order_version: ${o1_v2}
          expected_account_version: ${acct_v2}
        as: CommercialSalesRep
        captures:
          o1_v3: $.data.version
          acct_v3: $.data.version
      - call: POST /commercial/part-orders/{orderId}/pick
        payload: {}
        as: CommercialSalesRep
      - call: POST /commercial/part-orders/{orderId}/deliver
        payload: {}
        as: DeliveryDriver
      - call: POST /commercial/warranty-registrations
        payload:
          account_id: ${acct}
          part_id: ${p_used}
          purchase_order_id: null
          purchased_at: '2026-08-01T00:00:00Z'
          warranty_expires_at: '2027-08-01T00:00:00Z'
          claim_reference: null
        as: CommercialSalesRep
        captures:
          wr1: $.data.id
      - call: POST /commercial/core-returns
        payload:
          order_id: ${o1}
          line_items:
          - part_id: ${p_mach}
            quantity: 4
        as: CommercialSalesRep
        captures:
          cr1: $.data.id
      - call: POST /commercial/core-returns/{coreReturnId}/transit
        payload: {}
        as: DeliveryDriver
      - call: POST /commercial/core-returns/{coreReturnId}/inspect
        payload: {}
        as: ToolCribAttendant
        captures:
          cr1_credit: $.data.credit_amount_cents
      - call: POST /commercial/core-returns/{coreReturnId}/credit
        payload: {}
        as: CreditAnalyst
      - call: POST /commercial/core-returns
        payload:
          order_id: ${o1}
          line_items:
          - part_id: ${p_used}
            quantity: 2
        as: CommercialSalesRep
        captures:
          cr2: $.data.id
      - call: POST /commercial/core-returns/{coreReturnId}/transit
        payload: {}
        as: DeliveryDriver
      trigger:
      - call: POST /commercial/core-returns/${cr2}/inspect
        payload: {}
        as: ToolCribAttendant
      assert:
      - CoreReturn.${cr2}.core_subtotal_cents == 1000
      - CoreReturn.${cr2}.warranty_covered == true — the registration matches on account and part, with claim_reference and purchase_order_id both null
      - CoreReturn.${cr2}.restocking_fee_cents == 0
      - CoreReturn.${cr2}.credit_amount_cents == 4100 (refundable portion min(round(1000*0.20), 2600-2400) == 200, plus the unwarranted core portion max(ceil(600), ceil(3900)) == 3900 with restocking fee 0)
      - the earlier tracked credit was CoreReturn.${cr1}.credit_amount_cents == 8520 (refundable 2400 plus 7200-1080)
      - PartOrder.${o1}.refundable_deposit_consumed_cents == 2600, exactly the order's refundable_deposit_cents ceiling
      - the account's entitled credit by ordered quantity is ordered_quantity_credit_cents == 13000, strictly larger than the 12620 actually paid, so the two calculations are not interchangeable
- rule_id: non_linear_state_machine
  instances:
  - name: service_route_cycle_and_part_order_fork_join
    grounds:
    - state_machines.ServiceRoute.field.status.transitions.PLANNED_to_DRAFT
