- rule_id: cross_entity_state_dependency
  instances:
  - name: instrumented_quote_refuses_expiry_once_its_load_has_left_posted
    grounds:
    - state_machines.RateQuote.ACTIVE_to_EXPIRED
    - state_machines.RateQuote.transitions.VIEWED_to_ACCEPTED
    - errors.ERR_QUOTE_NOT_VIEWABLE
    - state_machines.Load.POSTED_to_BOOKED
    distinguishing_aspect: 'After a reprice every quote is INSTRUMENTED, and RateQuote''s own expiry precondition reads the
      load''s live state: carrier A''s VIEWED quote on the still-POSTED load is blocked by ERR_QUOTE_NOT_VIEWABLE because
      its load moved to BOOKED, while carrier A''s ACTIVE view on the untouched posted load still succeeds — the same quote
      state resolves differently on the sibling load''s status.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One shipper, lane TX>CA, one VERIFIED carrier with two DRY_VAN units, and two
