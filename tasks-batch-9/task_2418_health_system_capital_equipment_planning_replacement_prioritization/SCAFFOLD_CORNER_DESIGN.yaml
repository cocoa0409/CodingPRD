          - errors.ERR_SAFETY_REVIEW_REQUIRED
        distinguishing_aspect: >-
          The gate reads the request's stored safety_driver (a derived score), not any field the client
          sends, and the bar is `safety_driver < 90.00 OR ack`: an asset engineered to land on exactly
          90.00 blocks the accept until the optional acknowledgement flag is supplied — the same call
          with `safety_review_ack: true` succeeds unchanged in every other respect.
