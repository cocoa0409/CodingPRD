  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call without X-User-ID/X-User-Role fails at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role or existence check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clubs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
        # Negative test: intentionally no `as:` role (headers absent).

      - name: member_cannot_pay_other_members_session
        claim_type: violation_to_error
        grounds: ["validations[priority=2.5]", "errors[ERR_FORBIDDEN_RESOURCE_OWNERSHIP]"]
        distinguishing_aspect: "Ownership check: member B holds a valid role but X-User-ID != session.member_id, so pay on member A's session fails with ERR_FORBIDDEN_RESOURCE_OWNERSHIP."
        test_recipe:
          setup: ["Club, UNIT item 500c, members A and B, clock 12:00; A's session with one line"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club OW", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "MILK", item_name: "Milk", pricing_mode: "UNIT", unit_price_cents: 500 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_a: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1991, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_b: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_a}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_a}"
          trigger:
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_b}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_RESOURCE_OWNERSHIP"
            - "ScanSession.${session_id}.status == OPEN"

      - name: age_verification_failed_for_underage_alcohol_approval
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_AGE_VERIFICATION_FAILED]"]
        distinguishing_aspect: "Member born 2010 is 16 at clock year 2026; associate approval with birth_year_verified true still fails because age < 21 — the check is computational, not honor-system."
        test_recipe:
          setup: ["Club, ALCOHOL item 1500c, member birth_year 2010, clock 12:00, session with intercepted line"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club AG", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "BEER", item_name: "Beer", pricing_mode: "UNIT", unit_price_cents: 1500, restricted_class: "ALCOHOL" }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 2010, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /scan-sessions/${session_id}/intercepts"
              as: Associate
              captures: { int_id: "$.data[0].id" }
          trigger:
            - call: "POST /intercepts/${int_id}/resolve"
              payload: { decision: "APPROVE", birth_year_verified: true }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AGE_VERIFICATION_FAILED"
            - "RestrictedIntercept.${int_id}.status == PENDING"

      - name: pharmacy_approval_requires_pharmacist_note
        claim_type: violation_to_error
