scenario: "HVAC Equipment Distribution & Contractor Program (Watsco/Carrier Enterprise): equipment matchup & AHRI-rated system pairing, dealer tier & co-op advertising accrual, seasonal pre-buy & stocking terms, warranty registration & parts claim, refrigerant tracking & cylinder return, rebate/tax-credit qualification documentation, equipment allocation during peak, technical training credits"
domain_name: hvac-equipment-distribution-contractor
api_prefix: /api/v1

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal company name of the dealer/contractor" }
      - { name: license_number, type: string, source: input, description: "State HVAC license number; unique across all contractors", constraints: "unique" }
      - { name: tier, type: enum, source: computed, description: "Dealer tier derived from ytd_purchase_cents by dealer_tier_calculation; input ignored", constraints: "STANDARD | SILVER | GOLD | PLATINUM", default: STANDARD }
      - { name: ytd_purchase_cents, type: integer, source: computed, description: "Year-to-date delivered-order merchandise total; recomputed by dealer_tier_calculation on every Order DELIVERED transition", default: 0 }
      - { name: coop_accrual_provisional_cents, type: integer, source: computed, description: "Provisional co-op accrual; includes SUBMITTED/BACKORDERED/ALLOCATED/SHIPPED order lines", default: 0 }
      - { name: coop_accrual_final_cents, type: integer, source: computed, description: "Final co-op accrual; includes only DELIVERED order lines, minus PAID CoopClaims", default: 0 }
      - { name: training_credit_balance_hours, type: integer, source: computed, description: "Sum of credit_hours minus consumed_hours over TrainingCredits with status ACTIVE or PARTIALLY_CONSUMED and expires_at > logical clock", default: 0 }
      - { name: compliance_standing, type: enum, source: computed, description: "Derived standing: GOOD normally; WATCH on first cylinder heel violation; HOLD on second violation within 12 rolling months or any overdue cylinder > 30 days", constraints: "GOOD | WATCH | HOLD", default: GOOD }
      - { name: heel_violation_count_12m, type: integer, source: computed, description: "Count of heel-shortfall RefrigerantEvents recorded against this contractor in the trailing 12 months (logical clock)", default: 0 }
      - { name: credit_hold, type: boolean, source: input, description: "Distributor-placed credit hold flag; blocks order submit", default: false }
      - { name: status, type: enum, source: input, description: "Lifecycle of the dealer account", constraints: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: EquipmentModel
    parent: null
    common_fields: true
    fields:
      - { name: model_number, type: string, source: input, description: "Manufacturer model number; unique", constraints: "unique" }
      - { name: equipment_type, type: enum, source: input, description: "Component role in a system matchup", constraints: "CONDENSER | HEAT_PUMP | COIL | FURNACE | AIR_HANDLER" }
      - { name: refrigerant_type, type: enum, source: input, description: "Refrigerant the equipment is charged/rated for; NONE for furnaces and coils shipped dry", constraints: "R410A | R454B | R32 | NONE" }
      - { name: capacity_btuh, type: integer, source: input, description: "Nominal cooling/heating capacity in BTU/h" }
      - { name: family_code, type: string, source: input, description: "Allocation family used by AllocationPool and PreBuyProgram scoping (e.g. RES_AC_3T)" }
      - { name: list_price_cents, type: integer, source: input, description: "Current list price" }
      - { name: status, type: enum, source: input, description: "ACTIVE = orderable; DISCONTINUED = not orderable on new lines; ALLOCATED_ONLY = orderable only while an AllocationPool covers the family", constraints: "ACTIVE | DISCONTINUED | ALLOCATED_ONLY", default: ACTIVE }

  - name: AHRISystemRating
    parent: null
    common_fields: true
    fields:
      - { name: ahri_reference_number, type: string, source: input, description: "AHRI certified reference number; unique", constraints: "unique" }
      - { name: outdoor_unit_id, type: string, source: input, description: "FK -> EquipmentModel.id; must reference a model with equipment_type CONDENSER or HEAT_PUMP" }
      - { name: indoor_unit_id, type: string, source: input, description: "FK -> EquipmentModel.id; must reference a model with equipment_type COIL or AIR_HANDLER" }
      - { name: furnace_id, type: string, source: input, description: "FK -> EquipmentModel.id; nullable; when present must reference a model with equipment_type FURNACE", constraints: "nullable" }
      - { name: seer2, type: number, source: input, description: "Certified SEER2 rating, 1 decimal" }
      - { name: eer2, type: number, source: input, description: "Certified EER2 rating, 1 decimal" }
      - { name: hspf2, type: number, source: input, description: "Certified HSPF2 rating, 1 decimal; nullable for straight-cool systems", constraints: "nullable" }
      - { name: efficiency_class, type: enum, source: computed, description: "Derived by ahri_matchup_classification: PREMIUM when seer2 >= 17.0 AND eer2 >= 12.0; HIGH when seer2 >= 15.2 AND eer2 >= 11.7; otherwise STANDARD", constraints: "STANDARD | HIGH | PREMIUM" }
      - { name: tax_credit_eligible, type: boolean, source: computed, description: "true iff efficiency_class == PREMIUM, or (efficiency_class == HIGH AND hspf2 != null AND hspf2 >= 8.1)" }
      - { name: status, type: enum, source: input, description: "ACTIVE ratings may be quoted on new order lines; WITHDRAWN ratings may not", constraints: "ACTIVE | WITHDRAWN", default: ACTIVE }

  - name: PreBuyProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name (e.g. SPRING-2026-RES-AC)" }
      - { name: family_code, type: string, source: input, description: "Equipment family this program prices; windows for the same family_code may not overlap (half-open semantics)" }
      - { name: window_start, type: datetime, source: input, description: "Order window opens (inclusive lower bound of half-open [window_start, window_end))" }
      - { name: window_end, type: datetime, source: input, description: "Order window closes (exclusive upper bound)" }
      - { name: ship_by_date, type: datetime, source: input, description: "All orders taken under this program must reach SHIPPED by this date or the deposit is forfeitable" }
      - { name: deposit_pct, type: number, source: input, description: "Deposit fraction of discounted order total, 0 < deposit_pct <= 0.5" }
      - { name: discount_pct, type: number, source: input, description: "Pre-buy discount applied per line, 0 < discount_pct <= 0.20" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED before window_start; OPEN inside window; CLOSED after window_end or via close action; SETTLED after ship_by_date once all orders terminal", constraints: "SCHEDULED | OPEN | CLOSED | SETTLED", default: SCHEDULED }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; purchasing dealer" }
      - { name: prebuy_program_id, type: string, source: input, description: "FK -> PreBuyProgram.id; nullable; when present the order prices under pre-buy terms", constraints: "nullable" }
      - { name: status, type: enum, source: computed, description: "Fulfillment dimension; transitions per Order state machine", constraints: "DRAFT | SUBMITTED | BACKORDERED | ALLOCATED | SHIPPED | DELIVERED | CANCELLED", default: DRAFT }
      - { name: billing_status, type: enum, source: computed, description: "Billing dimension, evolves independently of status; transitions via billing-events", constraints: "UNBILLED | DEPOSIT_INVOICED | DEPOSIT_PAID | FINAL_INVOICED | PAID | FORFEITED", default: UNBILLED }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line unit_price_cents * quantity before line discounts", default: 0 }
      - { name: discount_cents, type: integer, source: computed, description: "Sum of line_discount_cents over lines", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents; pinned evaluation order per prebuy_discount_calculation", default: 0 }
      - { name: deposit_due_cents, type: integer, source: computed, description: "0 for non-prebuy orders; round_half_up(total_cents * deposit_pct) for pre-buy orders", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of the DRAFT -> SUBMITTED transition; null until submitted", constraints: "nullable" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; owning order (must be DRAFT at line creation)" }
      - { name: ahri_rating_id, type: string, source: input, description: "FK -> AHRISystemRating.id; exactly one of ahri_rating_id / equipment_model_id must be present", constraints: "nullable" }
      - { name: equipment_model_id, type: string, source: input, description: "FK -> EquipmentModel.id; used for part-only lines; exactly one of ahri_rating_id / equipment_model_id must be present", constraints: "nullable" }
      - { name: quantity, type: integer, source: input, description: "Units ordered; must be >= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Per-unit price resolved from tier discount or pre-buy terms at line creation; input ignored" }
      - { name: line_discount_cents, type: integer, source: computed, description: "Discount for this line, rounded per line per prebuy_discount_calculation", default: 0 }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity - line_discount_cents", default: 0 }

  - name: AllocationPool
    parent: null
    common_fields: true
    fields:
      - { name: family_code, type: string, source: input, description: "Equipment family this pool constrains during its season" }
      - { name: season_start, type: datetime, source: input, description: "Season opens (inclusive)" }
      - { name: season_end, type: datetime, source: input, description: "Season closes (exclusive; half-open [season_start, season_end))" }
      - { name: total_qty, type: integer, source: input, description: "Total units available for reservation in this pool" }
      - { name: reserved_qty, type: integer, source: computed, description: "Units reserved by SUBMITTED/BACKORDERED orders drawing on this pool", default: 0 }
      - { name: committed_qty, type: integer, source: computed, description: "Units committed by ALLOCATED/SHIPPED/DELIVERED orders drawing on this pool", default: 0 }
      - { name: status, type: enum, source: computed, description: "OPEN while logical clock inside season and not manually closed; CLOSED otherwise", constraints: "OPEN | CLOSED", default: OPEN }

  - name: WarrantyRegistration
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Factory serial number of the installed unit; unique", constraints: "unique" }
      - { name: equipment_model_id, type: string, source: input, description: "FK -> EquipmentModel.id; the installed model" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; installing dealer" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order the unit shipped on (must be DELIVERED at registration-create time)" }
      - { name: install_date, type: datetime, source: input, description: "Date unit was placed in service; may not be in the future relative to the logical clock" }
      - { name: registration_deadline, type: datetime, source: computed, description: "install_date + 60 days; register action at or before this timestamp (inclusive) succeeds" }
      - { name: registered_at, type: datetime, source: system, description: "Logical-clock timestamp of the register transition; null until REGISTERED", constraints: "nullable" }
      - { name: extended_coverage_years, type: integer, source: computed, description: "10 when registered on time; 5 when LAPSED (unregistered)", default: 5 }
      - { name: status, type: enum, source: computed, description: "PENDING_REGISTRATION -> REGISTERED via register; PENDING_REGISTRATION -> LAPSED automatically when clock passes registration_deadline; any -> VOID via distributor action", constraints: "PENDING_REGISTRATION | REGISTERED | LAPSED | VOID", default: PENDING_REGISTRATION }

  - name: PartsClaim
    parent: null
    common_fields: true
    fields:
      - { name: claim_number, type: string, source: system, description: "Server-minted human-readable claim number, format PC-<8 hex chars>" }
      - { name: warranty_registration_id, type: string, source: input, description: "FK -> WarrantyRegistration.id; claim anchors to this registration" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; must equal the registration's contractor_id" }
      - { name: failure_date, type: datetime, source: input, description: "Date of equipment failure; must be <= logical clock" }
      - { name: part_cost_cents, type: integer, source: input, description: "Claimed parts cost" }
      - { name: labor_cost_cents, type: integer, source: input, description: "Claimed labor cost" }
      - { name: covered_part_cents, type: integer, source: computed, description: "Covered parts amount per warranty_coverage_calculation", default: 0 }
      - { name: covered_labor_cents, type: integer, source: computed, description: "Covered labor amount per warranty_coverage_calculation", default: 0 }
      - { name: total_award_cents, type: integer, source: computed, description: "covered_part_cents + covered_labor_cents; finalized at APPROVED", default: 0 }
      - { name: revision_count, type: integer, source: computed, description: "Number of SUBMITTED -> MORE_INFO_REQUESTED -> SUBMITTED cycles", default: 0 }
      - { name: status, type: enum, source: computed, description: "Claim lifecycle with revision loop per PartsClaim state machine", constraints: "SUBMITTED | UNDER_REVIEW | MORE_INFO_REQUESTED | APPROVED | DENIED | PAID", default: SUBMITTED }

  - name: RefrigerantCylinder
    parent: null
    common_fields: true
    fields:
      - { name: cylinder_tag, type: string, source: input, description: "Physical cylinder serial/tag; unique", constraints: "unique" }
      - { name: refrigerant_type, type: enum, source: input, description: "Gas contained", constraints: "R410A | R454B | R32" }
      - { name: tare_weight_lbs, type: number, source: input, description: "Empty cylinder weight, 2 decimals" }
      - { name: full_weight_lbs, type: number, source: input, description: "Full cylinder gross weight, 2 decimals" }
      - { name: current_weight_lbs, type: number, source: computed, description: "Derived by chronological replay of RefrigerantEvent weight deltas (refrigerant_net_balance)", default: 0 }
      - { name: holder_contractor_id, type: string, source: input, description: "FK -> Contractor.id; nullable; dealer currently in possession (set on issue, cleared on return)", constraints: "nullable" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of last ISSUE transition; null when not issued", constraints: "nullable" }
      - { name: status, type: enum, source: computed, description: "Cylinder lifecycle per RefrigerantCylinder state machine (cyclic IN_STOCK -> ISSUED -> RETURNED -> IN_STOCK)", constraints: "IN_STOCK | ISSUED | RETURN_PENDING | RETURNED | RECLAIMED", default: IN_STOCK }

  - name: RefrigerantEvent
    parent: null
    common_fields: false
    fields:
      - { name: cylinder_id, type: string, source: input, description: "FK -> RefrigerantCylinder.id; the cylinder this event belongs to" }
      - { name: event_type, type: enum, source: input, description: "Ledger entry kind", constraints: "ISSUE | RECOVERY_IN | RETURN | RECLAIM | ADJUSTMENT" }
      - { name: weight_delta_lbs, type: number, source: input, description: "Signed gross-weight delta in lbs, 2 decimals; negative when gas leaves the cylinder" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp the event was appended" }
      - { name: note, type: string, source: input, description: "Free-text note; HEEL_SHORTFALL marker text recorded by system on shortfall adjustments", constraints: "nullable" }

  - name: RebateSubmission
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; submitting dealer" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the equipment order (must be DELIVERED at submit)" }
      - { name: ahri_rating_id, type: string, source: input, description: "FK -> AHRISystemRating.id; the installed system rating (must be ACTIVE and match a line on the order)" }
      - { name: program_type, type: enum, source: input, description: "Incentive program lane", constraints: "FEDERAL_TAX_CREDIT | UTILITY_REBATE" }
      - { name: homeowner_name, type: string, source: input, description: "End-customer name" }
      - { name: install_address, type: string, source: input, description: "Installation site address" }
      - { name: install_date, type: datetime, source: input, description: "Install date; must be >= the order's submitted_at and <= logical clock" }
      - { name: docs, type: array, source: input, description: "Document checklist, subset of [AHRI_CERTIFICATE, INVOICE, LOAD_CALC, PERMIT]; all four required to reach DOCS_COMPLETE" }
      - { name: qualified_amount_cents, type: integer, source: computed, description: "Incentive amount per rebate_qualification_calculation", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of DRAFT -> SUBMITTED", constraints: "nullable" }
      - { name: decision_deadline, type: datetime, source: computed, description: "submitted_at + 45 days; QUALIFIED submissions not PAID by this date auto-transition to EXPIRED", constraints: "nullable" }
      - { name: status, type: enum, source: computed, description: "Dossier lifecycle per RebateSubmission state machine", constraints: "DRAFT | SUBMITTED | DOCS_COMPLETE | QUALIFIED | REJECTED | PAID | EXPIRED", default: DRAFT }

  - name: TrainingCourse
    parent: null
    common_fields: true
    fields:
      - { name: course_code, type: string, source: input, description: "Unique course code", constraints: "unique" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: credit_hours, type: integer, source: input, description: "Training credit hours granted on completion" }
      - { name: session_start, type: datetime, source: input, description: "Session start (inclusive lower bound of closed interval)" }
      - { name: session_end, type: datetime, source: input, description: "Session end (inclusive upper bound; sessions for the same instructor must not overlap and require a 1-day buffer)" }
      - { name: instructor_name, type: string, source: input, description: "Instructor; two sessions with the same instructor_name conflict per closed-interval-plus-buffer semantics" }
      - { name: max_seats, type: integer, source: input, description: "Seat cap; completion grants credits only to enrolled contractors up to max_seats" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED -> COMPLETED via complete action; SCHEDULED -> CANCELLED via distributor", constraints: "SCHEDULED | COMPLETED | CANCELLED", default: SCHEDULED }

  - name: TrainingCredit
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; credit recipient" }
      - { name: course_id, type: string, source: input, description: "FK -> TrainingCourse.id; granting course" }
      - { name: credit_hours, type: integer, source: input, description: "Hours granted" }
      - { name: earned_at, type: datetime, source: system, description: "Logical-clock timestamp the credit was granted (course completion)" }
      - { name: expires_at, type: datetime, source: computed, description: "earned_at + 24 months; credit EXPIRED when logical clock reaches expires_at" }
      - { name: consumed_hours, type: integer, source: computed, description: "Hours consumed via tier-exemption consumption (FIFO by earned_at, tie-break created_at ASC)", default: 0 }
      - { name: status, type: enum, source: computed, description: "ACTIVE -> PARTIALLY_CONSUMED -> CONSUMED; ACTIVE/PARTIALLY_CONSUMED -> EXPIRED when clock passes expires_at", constraints: "ACTIVE | PARTIALLY_CONSUMED | CONSUMED | EXPIRED", default: ACTIVE }

  - name: CoopClaim
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; claiming dealer" }
      - { name: invoice_reference, type: string, source: input, description: "Advertising invoice reference; unique per contractor", constraints: "unique per contractor_id" }
      - { name: period, type: string, source: input, description: "Accrual period label YYYY-H1 or YYYY-H2; cap per period is 50% of final accrual for that period window" }
      - { name: spend_cents, type: integer, source: input, description: "Claimed advertising spend" }
      - { name: eligible_amount_cents, type: integer, source: computed, description: "min(spend_cents, coop_accrual_final_cents at verification, remaining period cap)", default: 0 }
      - { name: approved_amount_cents, type: integer, source: input, description: "Amount approved by distributor; must be <= eligible_amount_cents; null until APPROVED", constraints: "nullable" }
      - { name: status, type: enum, source: computed, description: "Claim lifecycle per CoopClaim state machine (DISPUTED -> SUBMITTED resubmission loop)", constraints: "SUBMITTED | VERIFIED | APPROVED | PAID | DISPUTED | REJECTED", default: SUBMITTED }

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Order
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /orders/{id}/submit"
        actor: ContractorUser
        preconditions:
          - "order.status == DRAFT"
          - "order has >= 1 OrderLine"
          - "contractor.status == ACTIVE"
          - "contractor.credit_hold == false"
          - "contractor.compliance_standing != HOLD"
          - "if order.prebuy_program_id present: program.status == OPEN and logical clock in [window_start, window_end)"
        side_effects:
          - "order.submitted_at := logical clock"
          - "for each line: resolve unit_price_cents via dealer_tier_discount or pre-buy pricing (pre-buy pricing wins when prebuy_program_id present)"
          - "recompute order.subtotal_cents, discount_cents, total_cents, deposit_due_cents (prebuy_discount_calculation)"
          - "allocation_consumption: for each line, draw from the OPEN AllocationPool matching each component's family_code when one exists (season covers logical clock); if pool available qty insufficient -> order transitions to BACKORDERED instead of ALLOCATED downstream"
          - "recompute contractor.coop_accrual_provisional_cents (coop_accrual_calculation provisional variant)"
        note: "Allocation reservation happens at submit; pool.reserved_qty increments here."
      - from: SUBMITTED
        to: BACKORDERED
        trigger: "system: allocation_consumption finds insufficient pool availability for any line"
        actor: system
        preconditions:
          - "at least one line's component family has an OPEN AllocationPool whose (total_qty - reserved_qty - committed_qty) < line quantity"
        side_effects:
          - "pool.reserved_qty incremented only for lines fully reservable; short lines are not reserved (all-or-nothing per line)"
          - "recompute contractor.coop_accrual_provisional_cents (BACKORDERED lines still accrue provisionally)"
      - from: SUBMITTED
        to: ALLOCATED
        trigger: "system: all lines fully reserved at submit time"
        actor: system
        preconditions:
          - "every line either draws on no pool or is fully reservable"
        side_effects:
          - "move each line's reservation: pool.reserved_qty -= qty; pool.committed_qty += qty"
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "system: an AllocationPool for the short family reopens availability (pool created or total_qty increased) — waterfall re-reservation"
        actor: system
        preconditions:
          - "all lines now fully reservable"
        side_effects:
          - "pool.reserved_qty/committed_qty rebalanced: each short line's qty moves reserved -> committed"
      - from: BACKORDERED
        to: SUBMITTED
        trigger: "system reversion: the AllocationPool whose shortage caused BACKORDERED transitions OPEN -> CLOSED"
        actor: system
        preconditions:
          - "the AllocationPool whose shortage caused BACKORDERED transitions OPEN -> CLOSED"
        side_effects:
          - "release partial reservations made at submit: pool.reserved_qty -= sum(reserved line qty)"
          - "recompute contractor.coop_accrual_provisional_cents"
        note: "Cyclic edge BACKORDERED -> SUBMITTED -> BACKORDERED is reachable across pool open/close epochs."
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /orders/{id}/ship"
        actor: DistributorAdmin
        preconditions:
          - "order.status == ALLOCATED"
          - "if order.prebuy_program_id present: logical clock <= program.ship_by_date, else ship allowed"
        side_effects:
          - "no pool quantity change (already committed)"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /orders/{id}/deliver"
        actor: DistributorAdmin
        preconditions:
          - "order.status == SHIPPED"
        side_effects:
          - "cascade 1: recompute contractor.ytd_purchase_cents and contractor.coop_accrual_final_cents (final variant, DELIVERED lines only)"
          - "cascade 2 (from 1): dealer_tier_calculation re-evaluates contractor.tier from new ytd_purchase_cents; on tier change, pending CoopClaims' period caps re-derive"
          - "cascade 3 (from 2): contractor.coop_accrual_provisional_cents recompute drops this order's lines from the provisional base"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: ContractorUser
        preconditions:
          - "order.status in {DRAFT, SUBMITTED, BACKORDERED}"
        side_effects:
          - "release all pool reservations: pool.reserved_qty -= sum(reserved qty); pool.committed_qty -= sum(committed qty) for ALLOCATED-committed lines (compensating invariant: reserved+committed conserved)"
          - "recompute contractor.coop_accrual_provisional_cents"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: ContractorUser
        preconditions:
          - "order.status in {DRAFT, SUBMITTED, BACKORDERED}"
          - "order.billing_status in {UNBILLED, DEPOSIT_INVOICED}"
        side_effects:
          - "release reservations as above (invariant: pool.reserved_qty + pool.committed_qty unchanged across submit-then-cancel pair)"
          - "if billing_status == DEPOSIT_INVOICED: billing_status := FORFEITED"
          - "recompute contractor.coop_accrual_provisional_cents"
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: ContractorUser
        preconditions:
          - "order.status in {DRAFT, SUBMITTED, BACKORDERED}"
          - "order.billing_status in {UNBILLED, DEPOSIT_INVOICED}"
        side_effects:
          - "release partial reservations"
          - "recompute contractor.coop_accrual_provisional_cents"

  - entity: OrderBilling
    initial_state: UNBILLED
    terminal_states: [PAID, FORFEITED]
    transitions:
      - from: UNBILLED
        to: DEPOSIT_INVOICED
        trigger: "POST /orders/{id}/billing-events {event_type: INVOICE_DEPOSIT}"
        actor: DistributorAdmin
        preconditions:
          - "order.billing_status == UNBILLED"
          - "order.status in {SUBMITTED, BACKORDERED, ALLOCATED}"
          - "order.prebuy_program_id present (deposit applies only to pre-buy orders)"
        side_effects: ["none beyond status"]
      - from: DEPOSIT_INVOICED
        to: DEPOSIT_PAID
        trigger: "POST /orders/{id}/billing-events {event_type: PAY_DEPOSIT}"
        actor: ContractorUser
        preconditions:
          - "order.billing_status == DEPOSIT_INVOICED"
        side_effects: ["none beyond status"]
      - from: DEPOSIT_PAID
        to: FINAL_INVOICED
        trigger: "POST /orders/{id}/billing-events {event_type: INVOICE_FINAL}"
        actor: DistributorAdmin
        preconditions:
          - "order.billing_status == DEPOSIT_PAID"
          - "order.status == SHIPPED"
        side_effects: ["final invoice = order.total_cents - order.deposit_due_cents"]
      - from: UNBILLED
        to: FINAL_INVOICED
        trigger: "POST /orders/{id}/billing-events {event_type: INVOICE_FINAL}"
        actor: DistributorAdmin
        preconditions:
          - "order.billing_status == UNBILLED"
          - "order.status == SHIPPED"
          - "order.prebuy_program_id absent (non-prebuy orders bill once at ship)"
        side_effects: ["final invoice = order.total_cents"]
      - from: FINAL_INVOICED
        to: PAID
        trigger: "POST /orders/{id}/billing-events {event_type: PAY_FINAL}"
        actor: ContractorUser
        preconditions:
          - "order.billing_status == FINAL_INVOICED"
        side_effects: ["none beyond status"]
      - from: DEPOSIT_INVOICED
        to: FORFEITED
        trigger: "system: pre-buy program ship_by_date passes while order not yet SHIPPED, OR order cancelled while DEPOSIT_INVOICED"
        actor: system
        preconditions:
          - "order.billing_status == DEPOSIT_INVOICED"
          - "logical clock > program.ship_by_date AND order.status not in {SHIPPED, DELIVERED}, or cancel transition fired"
        side_effects:
          - "deposit retained by distributor; order may still be cancelled (reservations released)"
        note: "FORFEITED is a billing terminal state independent of fulfillment status (parallel dimension)."

  - entity: PartsClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /parts-claims/{id}/decision {action: BEGIN_REVIEW}"
        actor: WarrantyProcessor
        preconditions:
          - "claim.status == SUBMITTED"
          - "claim's WarrantyRegistration.status == REGISTERED (cross-entity dependency)"
        side_effects: ["none beyond status"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /parts-claims/{id}/decision {action: APPROVE}"
        actor: WarrantyProcessor
        preconditions:
          - "claim.status == UNDER_REVIEW"
        side_effects:
          - "warranty_coverage_calculation finalizes covered_part_cents, covered_labor_cents, total_award_cents"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /parts-claims/{id}/decision {action: DENY}"
        actor: WarrantyProcessor
        preconditions:
          - "claim.status == UNDER_REVIEW"
        side_effects:
          - "none beyond status; total_award_cents stays 0"
      - from: UNDER_REVIEW
        to: MORE_INFO_REQUESTED
        trigger: "POST /parts-claims/{id}/decision {action: REQUEST_INFO}"
        actor: WarrantyProcessor
        preconditions:
          - "claim.status == UNDER_REVIEW"
        side_effects: ["none beyond status"]
      - from: MORE_INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /parts-claims/{id}/resubmit"
        actor: ContractorUser
        preconditions:
          - "claim.status == MORE_INFO_REQUESTED"
          - "revision_count < 3 (max 3 revision loops)"
        side_effects:
          - "revision_count += 1"
        note: "Cyclic revision loop SUBMITTED -> UNDER_REVIEW -> MORE_INFO_REQUESTED -> SUBMITTED, bounded at 3 cycles."
      - from: APPROVED
        to: PAID
        trigger: "POST /parts-claims/{id}/decision {action: PAY}"
        actor: DistributorAdmin
        preconditions:
          - "claim.status == APPROVED"
        side_effects: ["none beyond status"]
      - from: SUBMITTED
        to: DENIED
        trigger: "system: the anchored WarrantyRegistration transitions to LAPSED or VOID while claim is SUBMITTED or MORE_INFO_REQUESTED"
        actor: system
        preconditions:
          - "claim.status in {SUBMITTED, MORE_INFO_REQUESTED}"
        side_effects:
          - "claim auto-denied; total_award_cents stays 0"
        note: "Cross-entity cascade: registration lapse denies the open claim."

  - entity: RefrigerantCylinder
    initial_state: IN_STOCK
    terminal_states: [RECLAIMED]
    transitions:
      - from: IN_STOCK
        to: ISSUED
        trigger: "POST /refrigerant-cylinders/{id}/issue"
        actor: DistributorAdmin
        preconditions:
          - "cylinder.status == IN_STOCK"
          - "target contractor.status == ACTIVE"
          - "target contractor.compliance_standing != HOLD (safety gate)"
        side_effects:
          - "append RefrigerantEvent(event_type=ISSUE, weight_delta_lbs=0)"
          - "cylinder.holder_contractor_id := contractor; cylinder.issued_at := logical clock"
      - from: ISSUED
        to: RETURN_PENDING
        trigger: "system: logical clock exceeds issued_at + 30 days (cylinder overdue)"
        actor: system
        preconditions:
          - "cylinder.status == ISSUED and clock > issued_at + 30 days"
        side_effects:
          - "cascade 1: holder contractor.compliance_standing := HOLD if not already"
          - "cascade 2 (from 1): subsequent POST /orders/{id}/submit for that contractor fails the compliance gate"
      - from: ISSUED
        to: RETURNED
        trigger: "POST /refrigerant-cylinders/{id}/return"
        actor: DistributorAdmin
        preconditions:
          - "cylinder.status in {ISSUED, RETURN_PENDING}"
          - "returned_weight_lbs >= cylinder.tare_weight_lbs"
        side_effects:
          - "append RefrigerantEvent(event_type=RETURN, weight_delta_lbs = returned_weight_lbs - current_weight_lbs)"
          - "cylinder.current_weight_lbs := returned_weight_lbs"
          - "refrigerant_net_balance heel check: if returned_weight_lbs < full_weight_lbs * 0.90 (heel shortfall > 10% of charge), append RefrigerantEvent(event_type=ADJUSTMENT, note='HEEL_SHORTFALL') and increment holder contractor.heel_violation_count_12m"
          - "cascade: heel_violation_count_12m >= 2 within rolling 12 months -> contractor.compliance_standing := HOLD; == 1 -> WATCH"
          - "cylinder.holder_contractor_id := null; cylinder.issued_at := null"
      - from: RETURN_PENDING
        to: RETURNED
        trigger: "POST /refrigerant-cylinders/{id}/return"
        actor: DistributorAdmin
        preconditions:
          - "cylinder.status in {ISSUED, RETURN_PENDING}"
          - "returned_weight_lbs >= cylinder.tare_weight_lbs"
        side_effects:
          - "same as ISSUED -> RETURNED"
          - "additional cascade: holder contractor.compliance_standing recomputed — overdue alone had forced HOLD; on return with no other violations, standing downgrades to WATCH (not directly to GOOD)"
      - from: RETURNED
        to: IN_STOCK
        trigger: "POST /refrigerant-cylinders/{id}/refill (appends the ADJUSTMENT event restoring full weight)"
        actor: DistributorAdmin
        preconditions:
          - "cylinder.status == RETURNED"
          - "the refill ADJUSTMENT RefrigerantEvent brings current_weight_lbs == full_weight_lbs"
        side_effects: ["cylinder ready for re-issue (cycle)"]
        note: "Cyclic edge IN_STOCK -> ISSUED -> RETURNED -> IN_STOCK."
      - from: RETURNED
        to: RECLAIMED
        trigger: "POST /refrigerant-cylinders/{id}/reclaim"
        actor: DistributorAdmin
        preconditions:
          - "cylinder.status == RETURNED"
        side_effects:
          - "append RefrigerantEvent(event_type=RECLAIM, weight_delta_lbs = tare_weight_lbs - current_weight_lbs)"
          - "cylinder.current_weight_lbs := tare_weight_lbs"

  - entity: WarrantyRegistration
    initial_state: PENDING_REGISTRATION
    terminal_states: [REGISTERED, LAPSED, VOID]
    transitions:
      - from: PENDING_REGISTRATION
        to: REGISTERED
        trigger: "POST /warranty-registrations/{id}/register"
        actor: ContractorUser
        preconditions:
          - "registration.status == PENDING_REGISTRATION"
          - "logical clock <= registration.registration_deadline (inclusive boundary)"
        side_effects:
          - "registered_at := logical clock"
          - "extended_coverage_years := 10"
      - from: PENDING_REGISTRATION
        to: LAPSED
        trigger: "system: logical clock passes registration_deadline"
        actor: system
        preconditions:
          - "registration.status == PENDING_REGISTRATION"
          - "logical clock > registration_deadline"
        side_effects:
          - "cascade 1: every anchored PartsClaim with status in {SUBMITTED, MORE_INFO_REQUESTED} auto-transitions to DENIED"
          - "cascade 2 (from 1): each auto-denied claim's total_award_cents remains 0 and revision loop terminates"
      - from: PENDING_REGISTRATION
        to: VOID
        trigger: "POST /warranty-registrations/{id}/void"
        actor: DistributorAdmin
        preconditions:
          - "registration.status in {PENDING_REGISTRATION, REGISTERED}"
        side_effects:
          - "cascade: anchored open PartsClaims auto-DENIED as with LAPSED"
      - from: REGISTERED
        to: VOID
        trigger: "POST /warranty-registrations/{id}/void"
        actor: DistributorAdmin
        preconditions:
          - "registration.status in {PENDING_REGISTRATION, REGISTERED}"
        side_effects:
          - "cascade: anchored open PartsClaims auto-DENIED"

  - entity: RebateSubmission
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rebate-submissions/{id}/submit"
        actor: ContractorUser
        preconditions:
          - "submission.status == DRAFT"
          - "referenced order.status == DELIVERED (cross-entity dependency)"
          - "referenced ahri rating.status == ACTIVE"
          - "for program_type == FEDERAL_TAX_CREDIT: rating.tax_credit_eligible == true"
          - "docs contains AHRI_CERTIFICATE and INVOICE at minimum"
        side_effects:
          - "submitted_at := logical clock"
          - "decision_deadline := submitted_at + 45 days"
      - from: SUBMITTED
        to: DOCS_COMPLETE
        trigger: "system: docs checklist contains all four items (evaluated on the submit transition and on every PATCH /rebate-submissions/{id})"
        actor: system
        preconditions:
          - "submission.status == SUBMITTED"
          - "docs == {AHRI_CERTIFICATE, INVOICE, LOAD_CALC, PERMIT}"
        side_effects: ["none beyond status"]
        note: "A dossier submitted with all four docs present transitions DRAFT -> SUBMITTED -> DOCS_COMPLETE within the same request."
      - from: DOCS_COMPLETE
        to: QUALIFIED
        trigger: "POST /rebate-submissions/{id}/decision {action: QUALIFY}"
        actor: ComplianceOfficer
        preconditions:
          - "submission.status == DOCS_COMPLETE"
        side_effects:
          - "rebate_qualification_calculation finalizes qualified_amount_cents"
      - from: DOCS_COMPLETE
        to: REJECTED
        trigger: "POST /rebate-submissions/{id}/decision {action: REJECT}"
        actor: ComplianceOfficer
        preconditions:
          - "submission.status == DOCS_COMPLETE"
        side_effects: ["none beyond status"]
      - from: QUALIFIED
        to: PAID
        trigger: "POST /rebate-submissions/{id}/decision {action: PAY}"
        actor: DistributorAdmin
        preconditions:
          - "submission.status == QUALIFIED"
          - "logical clock <= decision_deadline"
        side_effects: ["none beyond status"]
      - from: QUALIFIED
        to: EXPIRED
        trigger: "system: logical clock passes decision_deadline while unpaid"
        actor: system
        preconditions:
          - "submission.status == QUALIFIED"
          - "logical clock > decision_deadline"
        side_effects: ["qualified_amount_cents remains but is no longer payable"]

  - entity: CoopClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /coop-claims/{id}/decision {action: VERIFY}"
        actor: DistributorAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "eligible_amount_cents := min(spend_cents, contractor.coop_accrual_final_cents, remaining period cap)"
      - from: VERIFIED
        to: APPROVED
        trigger: "POST /coop-claims/{id}/decision {action: APPROVE, approved_amount_cents}"
        actor: DistributorAdmin
        preconditions:
          - "claim.status == VERIFIED"
          - "approved_amount_cents <= eligible_amount_cents"
        side_effects: ["none beyond status"]
      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /coop-claims/{id}/decision {action: DISPUTE}"
        actor: DistributorAdmin
        preconditions:
          - "claim.status == VERIFIED"
        side_effects: ["none beyond status"]
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /coop-claims/{id}/decision {action: RESUBMIT, spend_cents}"
        actor: ContractorUser
        preconditions:
          - "claim.status == DISPUTED"
        side_effects:
          - "spend_cents replaced; eligible_amount_cents reset to 0 until re-verified"
        note: "Cyclic loop SUBMITTED -> VERIFIED -> DISPUTED -> SUBMITTED."
      - from: APPROVED
        to: PAID
        trigger: "POST /coop-claims/{id}/decision {action: PAY}"
        actor: DistributorAdmin
        preconditions:
          - "claim.status == APPROVED"
        side_effects:
          - "contractor.coop_accrual_final_cents -= approved_amount_cents (final accrual is spendable balance)"
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /coop-claims/{id}/decision {action: REJECT}"
        actor: DistributorAdmin
        preconditions:
          - "claim.status == VERIFIED"
        side_effects: ["none beyond status"]

  - entity: TrainingCourse
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /training-courses/{id}/complete"
        actor: TrainingCoordinator
        preconditions:
          - "course.status == SCHEDULED"
          - "logical clock >= course.session_end"
          - "attendee_contractor_ids length <= course.max_seats"
        side_effects:
          - "for each attendee_contractor_ids: create TrainingCredit(credit_hours = course.credit_hours, earned_at = logical clock, expires_at = earned_at + 24 months)"
          - "recompute each attendee contractor.training_credit_balance_hours"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "PATCH /training-courses/{id} with payload {action: CANCEL}"
        actor: DistributorAdmin
        preconditions:
          - "course.status == SCHEDULED"
        side_effects: ["no credits granted"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: order-patch-stale-version
    parent_entity: Order
    write_endpoint: "PATCH /orders/{id}"
    occ_field: expected_order_version
    description: |
      Updating a DRAFT Order (e.g. swapping its prebuy_program_id) is rejected
      when the client's expected_order_version no longer matches the Order's
      current version, because another writer legitimately mutated the draft
      (added a line, changed the program) since the client last observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: rebate-docs-stale-version
    parent_entity: RebateSubmission
    write_endpoint: "PATCH /rebate-submissions/{id}"
    occ_field: expected_rebate_version
    description: |
      Patching a RebateSubmission's docs checklist is rejected when
      expected_rebate_version is stale: the checklist is cumulative, and a
      writer working from an old checklist snapshot would silently drop
      documents another writer already attached.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: ahri_matchup_classification
    trigger: "on POST /ahri-ratings (create) and whenever a referenced EquipmentModel's status changes to DISCONTINUED"
    algorithm: threshold
    formula: |
      if seer2 >= 17.0 and eer2 >= 12.0: efficiency_class = PREMIUM
      elif seer2 >= 15.2 and eer2 >= 11.7: efficiency_class = HIGH
      else: efficiency_class = STANDARD
      tax_credit_eligible = (efficiency_class == PREMIUM) or
                            (efficiency_class == HIGH and hspf2 != null and hspf2 >= 8.1)
    input_set: "the AHRISystemRating row being created; thresholds are constants"
    constants:
      PREMIUM_SEER2: 17.0
      PREMIUM_EER2: 12.0
      HIGH_SEER2: 15.2
      HIGH_EER2: 11.7
      HEATPUMP_HSPF2_MIN: 8.1
    precision: "1 decimal input comparison, no rounding"
    variants:
      - name: strict_boundary
        when: "always"
        difference: "boundary is >= (inclusive): seer2 == 17.0 exactly classifies PREMIUM when eer2 >= 12.0"

  - name: dealer_tier_calculation
    trigger: "on every Order transition to DELIVERED (cascade), and on Contractor creation"
    algorithm: threshold
    formula: |
      # ytd_purchase_cents accumulated over DELIVERED orders in the calendar year (logical clock)
      if ytd_purchase_cents >= 50000000: tier = PLATINUM      # $500k
      elif ytd_purchase_cents >= 20000000: tier = GOLD        # $200k
      elif ytd_purchase_cents >= 5000000: tier = SILVER       # $50k
      else: tier = STANDARD
      # tier discount applied to list price at line pricing time:
      tier_discount_pct = { STANDARD: 0.00, SILVER: 0.03, GOLD: 0.05, PLATINUM: 0.07 }
    input_set: "orders of the contractor with status == DELIVERED and submitted_at in current calendar year (logical clock); CANCELLED and in-flight orders excluded"
    constants:
      SILVER_THRESHOLD_CENTS: 5000000
      GOLD_THRESHOLD_CENTS: 20000000
      PLATINUM_THRESHOLD_CENTS: 50000000
    precision: "integer cents; thresholds compared with >= (inclusive)"
    variants:
      - name: list_price_basis
        when: "non-prebuy orders"
        difference: "unit_price_cents = round_half_up(list_price_cents * (1 - tier_discount_pct))"
      - name: prebuy_price_basis
        when: "orders with prebuy_program_id present"
        difference: "unit_price_cents = list_price_cents (tier discount NOT applied); pre-buy discount replaces tier discount"

  - name: coop_accrual_calculation
    trigger: "on Order submit (provisional), on Order deliver (final), on Order cancel (provisional), on CoopClaim PAY (final debit)"
    algorithm: aggregation
    formula: |
      ACCRUAL_RATE = 0.02  # 2% of net merchandise
      # PROVISIONAL variant (displayed accrual potential):
      provisional_base = sum(line_total_cents over OrderLines whose order
        status in {SUBMITTED, BACKORDERED, ALLOCATED, SHIPPED, DELIVERED} and
        order not CANCELLED)
      coop_accrual_provisional_cents = round_half_up(provisional_base * 0.02)
      # FINAL variant (spendable balance):
      final_base = sum(line_total_cents over OrderLines whose order status == DELIVERED)
      accrued_final = round_half_up(final_base * 0.02)
      paid_claims = sum(approved_amount_cents over CoopClaims with status == PAID)
      coop_accrual_final_cents = accrued_final - paid_claims
    input_set: "provisional: order lines on orders in {SUBMITTED, BACKORDERED, ALLOCATED, SHIPPED, DELIVERED}; final: DELIVERED only; both exclude CANCELLED orders"
    constants:
      ACCRUAL_RATE: 0.02
    precision: "2 decimal places, round_half_up at the aggregate level (not per line)"
    variants:
      - name: provisional
        when: "between submit and delivery; drives the displayed accrual"
        difference: "includes in-flight orders; a $100k SUBMITTED order raises provisional by $2k but final by $0"
      - name: final
        when: "after delivery and after claim payouts"
        difference: "DELIVERED lines only, minus PAID CoopClaims; identical data yields a different number than provisional"

  - name: prebuy_discount_calculation
    trigger: "on POST /orders/{id}/submit for orders with prebuy_program_id, and on any OrderLine add/remove while DRAFT"
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER (mode b): discount is computed per line, rounded,
      # then summed. Sum-then-discount is FORBIDDEN.
      for each line:
        gross_line_cents = unit_price_cents * quantity
        line_discount_cents = round_half_up(gross_line_cents * program.discount_pct)
        line_total_cents = gross_line_cents - line_discount_cents
      order.subtotal_cents = sum(gross_line_cents)
      order.discount_cents = sum(line_discount_cents)
      order.total_cents = order.subtotal_cents - order.discount_cents
      order.deposit_due_cents = round_half_up(order.total_cents * program.deposit_pct)
    input_set: "all OrderLines on the order; program.discount_pct / deposit_pct from the referenced PreBuyProgram"
    constants:
      MAX_DISCOUNT_PCT: 0.20
      MAX_DEPOSIT_PCT: 0.5
    precision: "integer cents, round_half_up per line BEFORE summing; deposit rounded once on the summed total"

  - name: allocation_consumption
    trigger: "on POST /orders/{id}/submit (reserve), on cancel (release), on BACKORDERED recovery (re-reserve)"
    algorithm: waterfall_allocation
    formula: |
      # Candidate pool selection for a line component's family_code:
      # eligibility: AllocationPool.family_code == component.family_code AND
      #   status == OPEN AND season_start <= clock < season_end
      # ranking: season_start DESC (most recent season first)
      # tie-break: created_at ASC
      # fallback: no eligible pool -> line is unrestricted (no reservation)
      available(pool) = pool.total_qty - pool.reserved_qty - pool.committed_qty
      per line: if a pool is selected and available(pool) >= quantity:
                  reserve quantity (reserved_qty += quantity)
                elif a pool is selected and available(pool) < quantity:
                  reserve NOTHING for this line (all-or-nothing per line) and
                  mark order for BACKORDERED
      # allocation_priority across competing BACKORDERED orders when
      # availability reopens: tier rank (PLATINUM > GOLD > SILVER > STANDARD),
      # then order.submitted_at ASC, then order.created_at ASC.
    input_set: "OPEN AllocationPools whose season covers the logical clock; lines of the submitting order; BACKORDERED orders for re-reservation sweep"
    constants: {}
    precision: "integer units; availability check uses >= (available == quantity succeeds)"

  - name: warranty_coverage_calculation
    trigger: "on PartsClaim UNDER_REVIEW -> APPROVED"
    algorithm: threshold
    formula: |
      # Non-linear, state-dependent coverage (mode a: >=3 inputs, conditional
      # branches on entity state):
      age_years = floor((claim.failure_date - registration.install_date) / 365.25 days)
      coverage_years = registration.extended_coverage_years  # 10 if REGISTERED on time, 5 if LAPSED
      if age_years > coverage_years:
        covered_part_cents = 0; covered_labor_cents = 0
      else:
        # parts coverage by age band (of failure_date vs install_date):
        part_pct = 1.00 if age_years <= 1 else (0.75 if age_years <= 5 else 0.50)
        # labor coverage only within first year AND only if registered on time:
        labor_pct = 0.50 if (age_years <= 1 and registration.registered_at != null) else 0.0
        covered_part_cents = round_half_up(part_cost_cents * part_pct)
        covered_labor_cents = round_half_up(labor_cost_cents * labor_pct)
      total_award_cents = covered_part_cents + covered_labor_cents
    input_set: "the PartsClaim row; its WarrantyRegistration row"
    constants:
      FULL_PART_YEARS: 1
      REDUCED_PART_YEARS: 5
      LABOR_COVERAGE_PCT_FIRST_YEAR: 0.5
    precision: "integer cents, round_half_up per component"

  - name: refrigerant_net_balance
    trigger: "on every RefrigerantEvent append (ISSUE, RETURN, RECLAIM, ADJUSTMENT)"
    algorithm: chronological
    formula: |
      # Replay events in recorded_at ASC order (tie-break: created_at ASC):
      current_weight_lbs = full_weight_lbs + sum(weight_delta_lbs over all events)
      # Heel shortfall check at RETURN time:
      if returned_weight_lbs < full_weight_lbs * 0.90:
        heel_shortfall = true
        -> append ADJUSTMENT event with note='HEEL_SHORTFALL'
        -> holder.heel_violation_count_12m += 1 (rolling 12-month window by recorded_at)
      # standing recomputation:
      if any cylinder of holder is overdue > 30 days OR heel_violation_count_12m >= 2:
        compliance_standing = HOLD
      elif heel_violation_count_12m == 1 or recent overdue-return cleared:
        compliance_standing = WATCH
      else:
        compliance_standing = GOOD
    input_set: "all RefrigerantEvents for the cylinder, replayed chronologically; holder contractor's events in trailing 12 months for the violation count"
    constants:
      HEEL_MIN_FRACTION: 0.90
      OVERDUE_DAYS: 30
      VIOLATION_WINDOW_MONTHS: 12
    precision: "weight in lbs with 2 decimals; comparisons exact"

  - name: training_credit_expiry
    trigger: "on TrainingCourse completion (grant), on tier-exemption consumption, on any read of contractor.training_credit_balance_hours (lazy expiry sweep)"
    algorithm: decay_function
    formula: |
      # Lazy expiry: a TrainingCredit with expires_at <= logical clock is
      # treated as EXPIRED regardless of stored status (sweep on read).
      # Consumption order (FIFO): credits consumed from the candidate set
      # {status in {ACTIVE, PARTIALLY_CONSUMED}, expires_at > clock}
      # ranked earned_at ASC, tie-break created_at ASC.
      contractor.training_credit_balance_hours =
        sum(credit_hours - consumed_hours over non-expired, non-CONSUMED credits)
    input_set: "TrainingCredits of the contractor with status in {ACTIVE, PARTIALLY_CONSUMED} and expires_at > logical clock"
    constants:
      CREDIT_TTL_MONTHS: 24
    precision: "integer hours"

  - name: rebate_qualification_calculation
    trigger: "on RebateSubmission DOCS_COMPLETE -> QUALIFIED"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER (mode c — circular-looking, order pinned):
      # step 1: installed_cost_cents = sum(line_total_cents over the order's
      #         lines referencing this ahri_rating_id)  [already discounted]
      # step 2: efficiency tier amount from rating.efficiency_class:
      #         PREMIUM -> 200000; HIGH -> 100000; STANDARD -> 0
      # step 3: program cap: FEDERAL_TAX_CREDIT caps at min(tier_amount, 30% of
      #         installed_cost_cents); UTILITY_REBATE pays flat tier_amount but
      #         requires efficiency_class != STANDARD
      # step 4: if program_type == FEDERAL_TAX_CREDIT and
      #         rating.tax_credit_eligible == false -> 0
      if program_type == FEDERAL_TAX_CREDIT:
        if not rating.tax_credit_eligible: qualified = 0
        else: qualified = min(tier_amount, round_half_up(installed_cost_cents * 0.30))
      else:  # UTILITY_REBATE
        qualified = 0 if efficiency_class == STANDARD else tier_amount
    input_set: "the RebateSubmission; referenced Order's lines with ahri_rating_id == submission.ahri_rating_id; referenced AHRISystemRating"
    constants:
      PREMIUM_AMOUNT_CENTS: 200000
      HIGH_AMOUNT_CENTS: 100000
      FEDERAL_COST_CAP_PCT: 0.30
    precision: "integer cents, round_half_up only on the 30% cost-cap term before min()"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for the endpoint per RBAC matrix", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path resource exists (validated left-to-right); non-existent id -> 404", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "body-referenced FK ids exist (contractor_id, order_id, ahri_rating_id, etc.)", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "all POST/PATCH with FK fields" }
  - { priority: 5, category: state, check: "target resource in a legal from-state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "terminal-state lockdown: no transition from DELIVERED/CANCELLED/PAID/REJECTED/EXPIRED/RECLAIMED/VOID", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "refrigerant compliance: contractor.compliance_standing == HOLD blocks order submit and cylinder issue", error_id: ERR_COMPLIANCE_HOLD, http_status: 422, applies_to: "POST /orders/{id}/submit, POST /refrigerant-cylinders/{id}/issue" }
  - { priority: 8, category: business_safety, check: "cylinder return weight sanity: returned_weight_lbs >= tare_weight_lbs and <= full_weight_lbs", error_id: ERR_INVALID_CYLINDER_WEIGHT, http_status: 422, applies_to: "POST /refrigerant-cylinders/{id}/return" }
  - { priority: 9, category: business_temporal, check: "window validity: pre-buy order submit requires clock in [window_start, window_end); ship requires clock <= ship_by_date; registration requires clock <= registration_deadline", error_id: ERR_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /orders/{id}/submit, POST /orders/{id}/ship, POST /warranty-registrations/{id}/register" }
  - { priority: 10, category: business_temporal, check: "PreBuyProgram window overlap: same family_code windows may not overlap under half-open semantics ([a_start,a_end) vs [b_start,b_end) overlap iff a_start < b_end AND b_start < a_end); touching endpoints allowed", error_id: ERR_WINDOW_OVERLAP, http_status: 422, applies_to: "POST /prebuy-programs" }
  - { priority: 11, category: business_temporal, check: "TrainingCourse instructor conflict: same instructor_name sessions may not overlap under CLOSED interval semantics and additionally require a 1-day buffer between any two sessions (a_end + 1 day < b_start or b_end + 1 day < a_start)", error_id: ERR_INSTRUCTOR_CONFLICT, http_status: 422, applies_to: "POST /training-courses" }
  - { priority: 12, category: business_temporal, check: "AllocationPool aggregate capacity: overlapping pools for the same family_code are allowed, but the sum of total_qty over pools covering any instant must not exceed 2x the largest single pool's total_qty for that family (anti-over-subscription)", error_id: ERR_POOL_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /allocation-pools" }
  - { priority: 13, category: business_constraint, check: "AHRI pairing sanity: outdoor_unit equipment_type in {CONDENSER, HEAT_PUMP}; indoor_unit in {COIL, AIR_HANDLER}; furnace_id (if present) is FURNACE; refrigerant_type of outdoor and indoor must match unless indoor is NONE", error_id: ERR_INVALID_SYSTEM_PAIRING, http_status: 422, applies_to: "POST /ahri-ratings" }
  - { priority: 14, category: business_constraint, check: "uniqueness: license_number, model_number, ahri_reference_number, cylinder_tag, course_code, serial_number, (contractor_id, invoice_reference)", error_id: ERR_DUPLICATE, http_status: 409, applies_to: "create endpoints" }
  - { priority: 15, category: business_constraint, check: "OrderLine exclusivity: exactly one of ahri_rating_id / equipment_model_id present; quantity >= 1", error_id: ERR_INVALID_LINE, http_status: 422, applies_to: "POST /orders/{id}/lines" }
  - { priority: 16, category: business_referential, check: "referenced EquipmentModel.status: order lines may not reference DISCONTINUED models; ALLOCATED_ONLY models require an OPEN covering AllocationPool; WITHDRAWN ratings may not be quoted on new lines", error_id: ERR_MODEL_NOT_ORDERABLE, http_status: 422, applies_to: "POST /orders/{id}/lines, POST /ahri-ratings" }
  - { priority: 17, category: business_referential, check: "RebateSubmission consistency: referenced ahri_rating_id must appear on a line of the referenced order; install_date >= order.submitted_at", error_id: ERR_REBATE_MISMATCH, http_status: 422, applies_to: "POST /rebate-submissions, POST /rebate-submissions/{id}/submit" }
  - { priority: 18, category: business_referential, check: "PartsClaim anchors: claim.contractor_id must equal registration.contractor_id; registration status must be REGISTERED to begin review", error_id: ERR_WARRANTY_NOT_ACTIVE, http_status: 422, applies_to: "POST /parts-claims, POST /parts-claims/{id}/decision" }
  - { priority: 19, category: business_fiscal, check: "contractor.credit_hold == false required to submit orders", error_id: ERR_CREDIT_HOLD, http_status: 422, applies_to: "POST /orders/{id}/submit" }
  - { priority: 20, category: business_fiscal, check: "CoopClaim approved_amount_cents <= eligible_amount_cents at approval; eligible_amount_cents recomputed against current final accrual at VERIFY", error_id: ERR_ACCRUAL_EXCEEDED, http_status: 422, applies_to: "POST /coop-claims/{id}/decision" }
  - { priority: 21, category: business_fiscal, check: "OCC: expected_<parent>_version must match current version on guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /orders/{id}, PATCH /rebate-submissions/{id}" }
  - { priority: 22, category: business_constraint, check: "required fields present and well-typed on create/update; unknown fields rejected", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST/PATCH" }

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- test-driving ---
  - method: POST
    path: /api/v1/_clock/set_current_utc
    description: "Test-driving endpoint: sets the logical clock. Server startup default is 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock; all deadline/window/expiry logic reads this clock."
    roles: [DistributorAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["lazy sweeps triggered by the new clock position are deferred to the next read/transition (registration lapse, rebate expiry, cylinder overdue, credit expiry, pool/program window recomputation)"]

  # --- contractors ---
  - method: POST
    path: /api/v1/contractors
    description: "Create a dealer/contractor account"
    roles: [DistributorAdmin]
    code: 201
    input: [company_name, license_number, "credit_hold?", "status?"]
    output: Contractor
    side_effects: ["dealer_tier_calculation initializes tier=STANDARD, ytd=0"]
  - method: GET
    path: /api/v1/contractors/{id}
    description: "Fetch one contractor"
    roles: [DistributorAdmin, ContractorUser, WarrantyProcessor, ComplianceOfficer, TrainingCoordinator]
    code: 200
    input: []
    output: Contractor
    side_effects: ["lazy training_credit_expiry sweep refreshes training_credit_balance_hours"]
  - method: GET
    path: /api/v1/contractors
    description: "List contractors with filters and pagination"
    roles: [DistributorAdmin, WarrantyProcessor, ComplianceOfficer, TrainingCoordinator]
    code: 200
    input: ["status?", "tier?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []
  - method: PATCH
    path: /api/v1/contractors/{id}
    description: "Update mutable contractor fields (credit_hold, status)"
    roles: [DistributorAdmin]
    code: 200
    input: ["credit_hold?", "status?"]
    output: Contractor
    side_effects: ["increments version by 1"]

  # --- equipment catalog ---
  - method: POST
    path: /api/v1/equipment-models
    description: "Create an equipment model"
    roles: [DistributorAdmin]
    code: 201
    input: [model_number, equipment_type, refrigerant_type, capacity_btuh, family_code, list_price_cents, "status?"]
    output: EquipmentModel
    side_effects: []
  - method: GET
    path: /api/v1/equipment-models/{id}
    description: "Fetch one equipment model"
    roles: [DistributorAdmin, ContractorUser, WarrantyProcessor, ComplianceOfficer, TrainingCoordinator]
    code: 200
    input: []
    output: EquipmentModel
    side_effects: []
  - method: GET
    path: /api/v1/equipment-models
    description: "List equipment models"
    roles: [DistributorAdmin, ContractorUser, WarrantyProcessor, ComplianceOfficer, TrainingCoordinator]
    code: 200
    input: ["equipment_type?", "family_code?", "status?", "limit?", "offset?"]
    output: EquipmentModel[]
    side_effects: []

  # --- AHRI ratings ---
  - method: POST
    path: /api/v1/ahri-ratings
    description: "Register an AHRI-rated system pairing (validates component types and refrigerant compatibility)"
    roles: [DistributorAdmin]
    code: 201
    input: [ahri_reference_number, outdoor_unit_id, indoor_unit_id, "furnace_id?", seer2, eer2, "hspf2?"]
    output: AHRISystemRating
    side_effects: ["ahri_matchup_classification computes efficiency_class and tax_credit_eligible"]
  - method: GET
    path: /api/v1/ahri-ratings/{id}
    description: "Fetch one AHRI rating"
    roles: [DistributorAdmin, ContractorUser, WarrantyProcessor, ComplianceOfficer, TrainingCoordinator]
    code: 200
    input: []
    output: AHRISystemRating
    side_effects: []
  - method: GET
    path: /api/v1/ahri-ratings
    description: "List AHRI ratings (reverse-reachability for the three EquipmentModel FKs)"
    roles: [DistributorAdmin, ContractorUser, WarrantyProcessor, ComplianceOfficer, TrainingCoordinator]
    code: 200
    input: ["outdoor_unit_id?", "indoor_unit_id?", "furnace_id?", "efficiency_class?", "limit?", "offset?"]
    output: AHRISystemRating[]
    side_effects: []

  # --- pre-buy programs ---
  - method: POST
    path: /api/v1/prebuy-programs
    description: "Create a seasonal pre-buy program (window overlap validation per family)"
    roles: [DistributorAdmin]
    code: 201
    input: [name, family_code, window_start, window_end, ship_by_date, deposit_pct, discount_pct]
    output: PreBuyProgram
    side_effects: []
  - method: GET
    path: /api/v1/prebuy-programs/{id}
    description: "Fetch one program"
    roles: [DistributorAdmin, ContractorUser]
    code: 200
    input: []
    output: PreBuyProgram
    side_effects: []
  - method: GET
    path: /api/v1/prebuy-programs
    description: "List programs"
    roles: [DistributorAdmin, ContractorUser]
    code: 200
    input: ["family_code?", "status?", "limit?", "offset?"]
    output: PreBuyProgram[]
    side_effects: []
  - method: POST
    path: /api/v1/prebuy-programs/{id}/close
    description: "Manually close a program window early"
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: PreBuyProgram
    side_effects: ["status := CLOSED; BACKORDERED pre-buy orders referencing it remain until pool close rules apply"]

  # --- allocation pools ---
  - method: POST
    path: /api/v1/allocation-pools
    description: "Create a peak-season allocation pool (aggregate capacity validation)"
    roles: [DistributorAdmin]
    code: 201
    input: [family_code, season_start, season_end, total_qty]
    output: AllocationPool
    side_effects: ["allocation_consumption re-reservation sweep: BACKORDERED orders whose short family now has availability are re-evaluated in tier/submitted_at priority"]
  - method: GET
    path: /api/v1/allocation-pools/{id}
    description: "Fetch one pool"
    roles: [DistributorAdmin, ContractorUser]
    code: 200
    input: []
    output: AllocationPool
    side_effects: []
  - method: GET
    path: /api/v1/allocation-pools
    description: "List pools"
    roles: [DistributorAdmin, ContractorUser]
    code: 200
    input: ["family_code?", "status?", "limit?", "offset?"]
    output: AllocationPool[]
    side_effects: []
  - method: POST
    path: /api/v1/allocation-pools/{id}/close
    description: "Close a pool (releases nothing; committed quantities remain)"
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: AllocationPool
    side_effects: ["status := CLOSED; BACKORDERED orders shorted by this pool revert to SUBMITTED with partial reservations released"]

  # --- orders ---
