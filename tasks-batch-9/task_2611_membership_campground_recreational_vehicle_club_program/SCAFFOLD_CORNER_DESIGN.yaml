# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design
# Task 2611 — Membership Campground & Recreational Vehicle Club Program
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's §1.1-§1.7.
# `section:` values are the guide's nine section names; `claim_type:` values are the rows of
# each section's tables. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted
# as `excluded_because:` stubs naming the covering §1.8 instance.
#
# Fixture conventions shared with §1.8 (repeated per instance so each recipe replays from an
# empty database):
#   - the logical clock default is 2026-08-01T00:00:00Z
#   - tier CLASSIC   : rank 1, upfront 795000,  dues 42000, A/B/C 0/10/18,  cap 24, advance 60,
#                      max_consecutive 14, min_out 3, affiliate false, resale false, fee 60000
#   - tier PRESIDENT : rank 3, upfront 1850000, dues 58000, A/B/C 14/21/28, cap 45, advance 120,
#                      max_consecutive 21, min_out 1, affiliate true,  resale true,  fee 95000
#   - every park uses season_open_date 2026-01-05 and season_close_date 2026-12-20, so a
#     season-opening is legal at any 2026 clock, and must be opened before any booking
#   - CLASSIC dues invoice = 45360 cents; PRESIDENT dues invoice = 59508 cents; both due
#     2026-08-31 when the membership is sold at the default clock

scaffold_corner_design:
  - section: entities
    instances:
      - name: membership_tier_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.MembershipTier
          - endpoints["POST /membership-tiers"]
        distinguishing_aspect: "POST /membership-tiers with all 15 input fields returns 201 and echoes every declared field plus the four common fields; version starts at 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id", tier_cls_version: "$.data.version" }
          assert:
            - "HTTP 201 with response_type object"
            - "data.code == CLASSIC, data.tier_rank == 1, data.entitlement_nights_class_b == 10, data.min_out_nights_between_stays == 3, data.affiliate_access_enabled == false, data.resale_allowed == false, data.transfer_fee_cents == 60000"
            - "data.id is a server-minted identifier, data.created_at == 2026-08-01T00:00:00Z, data.updated_at == data.created_at, data.version == 1"
      - name: park_retrieval_returns_the_stored_pool_split_and_creation_defaults
        claim_type: retrieval
        grounds:
          - entities.Park
          - endpoints["GET /parks/{id}"]
          - calculations.park_capacity_allocation
        distinguishing_aspect: "GET /parks/{id} returns the stored row exactly as POST /parks left it: the floor-derived 15/10 pool split, park_status SEASONAL_CLOSED, rating_score 0.00 and network_type CLUB_OWNED."
        test_recipe:
          setup:
            - "One CLASS_B park with total_sites 25 and member_allocation_pct 60, created at the default clock and never opened"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Elk Meadow RV Resort", park_class: "CLASS_B", total_sites: 25, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_em_id: "$.data.id" }
          trigger:
            - call: "GET /parks/${park_em_id}"
              payload: {}
              as: Member
              captures: { park_em_status: "$.data.park_status" }
          assert:
            - "HTTP 200 and data.id == the id returned by POST /parks"
            - "data.member_pool_sites == 15 and data.transient_pool_sites == 10 — floor(25 * 60 / 100) with the remainder to the transient pool"
            - "data.park_status == SEASONAL_CLOSED, data.amenity_compliance_status == COMPLIANT, data.rating_score == 0.00"
            - "data.forced_cancellation_count == 0, data.funded_capital_cents_ytd == 0, data.last_inspection_at == null"
            - "data.network_type == CLUB_OWNED because affiliate_agreement_id is null"
      - name: membership_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /memberships"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /memberships with limit 2 over three rows reports limit 2, offset 0, total_count 3, has_more true; the second page returns the remaining row with has_more false. total_count counts matching rows, not returned rows."
        test_recipe:
          setup:
            - "One CLASSIC tier and three members, each holding exactly one ACTIVE membership, created in the order Ada, Bo, Chi at the default clock"
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Ada Quill", email: "ada@example.com" }
              as: ClubAdmin
              captures: { mbr_ada_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Bo Ferreira", email: "bo@example.com" }
              as: ClubAdmin
              captures: { mbr_bo_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Chi Nakamura", email: "chi@example.com" }
              as: ClubAdmin
              captures: { mbr_chi_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_ada_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { ms_ada_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_bo_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { ms_bo_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_chi_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { ms_chi_id: "$.data.id" }
          trigger:
            - call: "GET /memberships"
              payload: { limit: 2, offset: 0 }
              as: ClubAdmin
              captures: { page1_first_id: "$.data[0].id", page1_second_id: "$.data[1].id" }
            - call: "GET /memberships"
              payload: { limit: 2, offset: 2 }
              as: ClubAdmin
              captures: { page2_first_id: "$.data[0].id" }
          assert:
            - "first page: HTTP 200, response_type array, exactly 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "second page: exactly 1 row, limit == 2, offset == 2, total_count == 3, has_more == false"
            - "the three ids across both pages are exactly ${ms_ada_id}, ${ms_bo_id} and ${ms_chi_id} with no repeats, ordered created_at ASC"
      - name: reservation_read_with_an_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_RESERVATION_NOT_FOUND]
          - validations[priority=9]
        distinguishing_aspect: "GET /reservations/{id} with a well-formed but unused identifier returns 404 ERR_RESERVATION_NOT_FOUND; the call is made as ClubAdmin so the Member ownership rule at priority 3 cannot pre-empt the 404."
        test_recipe:
          setup:
            - "Empty database with the clock at the default; no Reservation row has ever been created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "GET /reservations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClubAdmin
              captures: { missing_reservation_error_id: "$.data.error_id" }
          assert:
            - "HTTP 404 with response_type error and data.error_id == ERR_RESERVATION_NOT_FOUND"
            - "data.message is present and non-empty"
      - name: membership_create_missing_required_tier_id_is_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=16]
          - entities.Membership.fields.tier_id
        distinguishing_aspect: "tier_id has source input with no default, so omitting it from POST /memberships must return 400 ERR_INVALID_REQUEST and persist nothing — no Membership row and no DuesInvoice."
        test_recipe:
          setup:
            - "One CLASSIC tier and one member exist; no membership has been sold"
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Nadia Brandt", email: "nadia@example.com" }
              as: ClubAdmin
              captures: { mbr_nadia_id: "$.data.id" }
          trigger:
            - call: "POST /memberships"
              payload: { member_id: "${mbr_nadia_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { missing_field_error_id: "$.data.error_id" }
            - call: "GET /memberships"
              payload: { member_id: "${mbr_nadia_id}" }
              as: ClubAdmin
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the follow-up list returns total_count == 0 — nothing was persisted, so no DuesInvoice was minted either"
      - name: member_create_omitting_home_region_applies_the_declared_default
        claim_type: defaults
        grounds:
          - entities.Member.fields.home_region
          - entities.Member.fields.status
          - endpoints["POST /members"]
        distinguishing_aspect: "home_region is the only optional input on POST /members; omitting it stores null rather than an empty string, while the system field status defaults to ACTIVE."
        test_recipe:
          setup:
            - "Empty database with the clock at the default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /members"
              payload: { full_name: "Peregrine Osei", email: "peregrine@example.com" }
              as: ClubAdmin
              captures: { mbr_pere_id: "$.data.id", mbr_pere_region: "$.data.home_region" }
          assert:
            - "HTTP 201 and data.home_region == null"
            - "data.status == ACTIVE and data.version == 1"
            - "data.full_name == Peregrine Osei and data.email == peregrine@example.com"
      - name: dues_invoice_amount_cents_is_computed_from_the_tier_not_from_the_request
        claim_type: computed_fields
        grounds:
          - entities.DuesInvoice.fields.amount_cents
          - calculations.dues_invoice_total
          - endpoints["POST /memberships"]
        distinguishing_aspect: "POST /memberships accepts only member_id, tier_id and upfront_paid_cents, yet mints a DuesInvoice whose amount_cents, base_dues_cents, capital_assessment_cents and loyalty_credit_cents are all derived from the tier — a client cannot influence any of them."
        test_recipe:
          setup:
            - "One CLASSIC tier (annual_dues_cents 42000) and one member, at the default clock"
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Rafi Osborne", email: "rafi@example.com" }
              as: ClubAdmin
              captures: { mbr_rafi_id: "$.data.id" }
          trigger:
            - call: "POST /memberships"
              payload: { member_id: "${mbr_rafi_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { ms_rafi_id: "$.data.id" }
            - call: "GET /memberships/${ms_rafi_id}/dues-invoices"
              payload: {}
              as: ClubAdmin
              captures: { inv_rafi_id: "$.data[0].id", inv_rafi_amount: "$.data[0].amount_cents" }
          assert:
            - "exactly one DuesInvoice exists for the membership, status OPEN, cycle_year 2026"
            - "base_dues_cents == 42000, capital_assessment_cents == 3360, loyalty_credit_cents == 0, amount_cents == 45360"
            - "due_date == 2026-08-31 (current logical date + DUES_NET_DAYS)"
            - "Membership.${ms_rafi_id}.dues_balance_cents == 45360 and dues_status == CURRENT"
      - name: park_system_fields_are_server_generated_and_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Park
          - endpoints["POST /parks"]
        distinguishing_aspect: "id, created_at, updated_at and version are not inputs of POST /parks: the response carries a server-minted id, created_at stamped from the logical clock rather than wall-clock time, and version exactly 1."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z, which is deliberately not wall-clock time"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /parks"
              payload: { name: "Kestrel Point RV Resort", park_class: "CLASS_A", total_sites: 30, member_allocation_pct: 50, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_kp_id: "$.data.id", park_kp_created: "$.data.created_at", park_kp_version: "$.data.version" }
          assert:
            - "HTTP 201 and data.id is present and was not supplied by the client"
            - "data.created_at == 2026-08-01T00:00:00Z, taken from the logical clock"
            - "data.updated_at == data.created_at and data.version == 1"
            - "data.member_pool_sites == 15 and data.transient_pool_sites == 15 for the 50% split"
      - name: capital_project_category_invalid_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.CapitalProject.fields.category
          - validations[priority=16]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "category is constrained to {SAFETY, UTILITY, AMENITY, EXPANSION}; a value outside that set fails the existence-category check with 400 ERR_INVALID_REQUEST before any priority scoring happens, and a negative requested_cost_cents fails the same rule."
        test_recipe:
          setup:
            - "One OPEN CLASS_B park with 40 sites and 60% member allocation and no capital projects"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Marsh Landing RV Resort", park_class: "CLASS_B", total_sites: 40, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_ml_id: "$.data.id" }
            - call: "POST /parks/${park_ml_id}/season-openings"
              payload: {}
              as: ClubAdmin
          trigger:
            - call: "POST /capital-projects"
              payload: { park_id: "${park_ml_id}", title: "Add a splash pad", category: "PLAYGROUND", requested_cost_cents: 4500000, fiscal_year: 2026 }
              as: ParkManager
              as_user_id: "${park_ml_id}"
              captures: { bad_enum_error_id: "$.data.error_id" }
            - call: "POST /capital-projects"
              payload: { park_id: "${park_ml_id}", title: "Negative cost probe", category: "UTILITY", requested_cost_cents: -1, fiscal_year: 2026 }
              as: ParkManager
              as_user_id: "${park_ml_id}"
              captures: { bad_amount_error_id: "$.data.error_id" }
            - call: "GET /parks/${park_ml_id}/capital-projects"
              payload: {}
              as: ParkManager
              as_user_id: "${park_ml_id}"
          assert:
            - "unknown enum: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "negative amount: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the follow-up list returns total_count == 0 — neither rejected request created a CapitalProject"
      - name: amenity_inspection_is_immutable_with_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.AmenityInspection
          - calculations.amenity_composite_score
          - endpoints["POST /parks/{id}/amenity-inspections"]
        distinguishing_aspect: "AmenityInspection is declared common_fields false: rows carry inspected_at but no version and no updated_at, §1.5 exposes no PATCH/PUT/DELETE for them, and re-inspecting appends a second immutable row instead of mutating the first."
        test_recipe:
          setup:
            - "One OPEN CLASS_B park with 40 sites and 60% member allocation, never inspected"
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Fern Gully RV Resort", park_class: "CLASS_B", total_sites: 40, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_fg_id: "$.data.id" }
            - call: "POST /parks/${park_fg_id}/season-openings"
              payload: {}
              as: ClubAdmin
          trigger:
            - call: "POST /parks/${park_fg_id}/amenity-inspections"
              payload: { restroom_score: 5, hookup_score: 4, utility_score: 3, road_score: 2 }
              as: ParkManager
              as_user_id: "${park_fg_id}"
              captures: { insp_first_id: "$.data.id", insp_first_score: "$.data.composite_score" }
            - call: "POST /parks/${park_fg_id}/amenity-inspections"
              payload: { restroom_score: 4, hookup_score: 4, utility_score: 4, road_score: 4 }
              as: ComplianceOfficer
              captures: { insp_second_id: "$.data.id", insp_second_result: "$.data.result" }
            - call: "GET /parks/${park_fg_id}/amenity-inspections"
              payload: {}
              as: ClubAdmin
              captures: { insp_list_first_id: "$.data[0].id" }
          assert:
            - "first inspection: composite_score == 3.80 and result == PROBATION; the response carries inspected_at and inspector_user_id but no version and no updated_at field"
            - "second inspection: composite_score == 4.00 and result == PASS, and it is a new id distinct from ${insp_first_id}"
            - "the list returns total_count == 2 — the first row is preserved verbatim with composite_score 3.80, not overwritten"
            - "Park.${park_fg_id}.amenity_compliance_status == COMPLIANT after the second inspection and last_inspection_at equals the second inspection's inspected_at"
      - name: reservation_create_with_an_unknown_park_id_is_park_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Reservation.fields.park_id
          - validations[priority=8]
          - errors[ERR_PARK_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "flat topology: Reservation carries FKs rather than nesting under a parent, so both FKs are resolved before any business rule runs. An unused park_id with an otherwise valid, owner-matching payload returns 404 ERR_PARK_NOT_FOUND, and swapping in the real park id makes the identical call succeed."
        test_recipe:
          setup:
            - "One ACTIVE PRESIDENT membership owned by the calling member and one OPEN CLASS_B park with 40 sites and 60% member allocation"
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "PRESIDENT", name: "President Class", tier_rank: 3, upfront_cost_cents: 1850000, annual_dues_cents: 58000, entitlement_nights_class_a: 14, entitlement_nights_class_b: 21, entitlement_nights_class_c: 28, annual_total_night_cap: 45, advance_window_days: 120, max_consecutive_stay_nights: 21, min_out_nights_between_stays: 1, affiliate_access_enabled: true, resale_allowed: true, transfer_fee_cents: 95000 }
              as: ClubAdmin
              captures: { tier_pres_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Saoirse Whitlock", email: "saoirse@example.com" }
              as: ClubAdmin
              captures: { mbr_saoirse_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_saoirse_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_saoirse_id: "$.data.id" }
            - call: "POST /parks"
              payload: { name: "Dune Crest RV Resort", park_class: "CLASS_B", total_sites: 40, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_dc_id: "$.data.id" }
            - call: "POST /parks/${park_dc_id}/season-openings"
              payload: {}
              as: ClubAdmin
          trigger:
            - call: "POST /reservations"
              payload: { park_id: "11111111-1111-4111-8111-111111111111", membership_id: "${ms_saoirse_id}", arrival_date: "2026-09-14", scheduled_departure_date: "2026-09-17" }
              as: Member
              as_user_id: "${mbr_saoirse_id}"
              captures: { unknown_park_error_id: "$.data.error_id" }
            - call: "POST /reservations"
              payload: { park_id: "${park_dc_id}", membership_id: "${ms_saoirse_id}", arrival_date: "2026-09-14", scheduled_departure_date: "2026-09-17" }
              as: Member
              as_user_id: "${mbr_saoirse_id}"
              captures: { res_saoirse_id: "$.data.id" }
          assert:
            - "unknown park: HTTP 404 with data.error_id == ERR_PARK_NOT_FOUND"
            - "unknown park: Membership.${ms_saoirse_id}.nights_used_class_b stays 0 — the FK check runs before any entitlement debit"
            - "real park: HTTP 201, Reservation.${res_saoirse_id}.status == CONFIRMED, park_id == ${park_dc_id}, entitlement_nights_charged == 3"
  - section: state_machines
    instances:
      - name: transfer_request_approval_terminates_the_source_and_mints_a_successor_membership
        claim_type: valid_transition
        grounds:
          - state_machines.TransferRequest
          - state_machines.Membership
          - calculations.transfer_fee_total
          - endpoints["POST /transfer-requests/{id}/decision"]
        distinguishing_aspect: "SUBMITTED -> APPROVED fires every declared side effect at once: the source membership leaves TRANSFER_PENDING for the terminal TERMINATED, a successor membership appears on the same tier with transfer_count 1 and the source's tenure_origin_at, and successor_membership_id is back-filled on the request."
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "One PRESIDENT membership held by Gia with no reservations of any kind, so the open-reservation block cannot fire"
            - "One receiving member Hal who holds no membership yet"
          setup_api_calls:
            - call: "POST /membership-tiers"
