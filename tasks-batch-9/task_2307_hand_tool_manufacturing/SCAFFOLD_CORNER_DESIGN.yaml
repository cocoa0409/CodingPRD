              as: QualityEngineer
              captures: { passed_run_id: $.data.id }
            - call: "POST /toolworks/test-runs/${passed_run_id}/results"
              payload: { readings: [52.0, 53.0] }
              as: QualityEngineer
              captures: { idx_sample: $.data.mean_reading }
            - call: "GET /toolworks/production-lots/${lot_id}"
              payload: {}
              as: QualityEngineer
              captures: { pooled: $.data.hardness_index_pooled, sample: $.data.hardness_index_sample }
          assert:
            - "TestRun.${void_run_id}.status == 'VOID' and TestRun.${pending_run_id}.status == 'SCHEDULED'"
            - "TestRun.${passed_run_id}.status == 'PASSED' with mean_reading == 52.5"
            - "ProductionLot.${lot_id}.hardness_index_pooled == 52.50 and hardness_index_sample == 52.50 (single qualifying run, so the two variants coincide)"
            - "ProductionLot.${lot_id}.specimens_committed == 3 (only the SCHEDULED run), specimens_consumed == 2, specimens_available == 15"
            - "GET /toolworks/production-lots/${lot_id}/test-runs?test_type=HARDNESS returns total_count 3"

      - name: pack_member_line_extension_applies_pack_type_discount
        claim_type: correct_result
        grounds:
          - calculations.pack_pricing
          - calculations.pack_pricing.constants.PACK_TYPE_DISCOUNT
          - entities.PackMember.fields.line_extended_cents
        distinguishing_aspect: "line_extended_cents is computed per member at append time from list_price_cents * quantity * PACK_TYPE_DISCOUNT[pack_type], so the same SKU and quantity yields 6600 in a RETAIL_DISPLAY pack and 5808 in a MULTIPACK, while the pack-level totals stay 0 until approval."
        test_recipe:
          setup:
            - "Two BRANDED SKUs priced 3300 and 1500."
            - "One DRAFT RETAIL_DISPLAY pack and one DRAFT MULTIPACK pack, both keyed on the first SKU."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku1_id: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "SO-20-BR", tool_family: "SOCKET", channel: "BRANDED", nominal_size_mm: 20, alloy_grade: "CR_V", list_price_cents: 1500, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku2_id: $.data.id }
            - call: "POST /toolworks/pack-configurations"
              payload: { pack_code: "PK-RD-1", pack_type: "RETAIL_DISPLAY", primary_sku_id: "${sku1_id}" }
              as: ChannelManager
              captures: { rd_pack_id: $.data.id }
            - call: "POST /toolworks/pack-configurations"
              payload: { pack_code: "PK-MP-1", pack_type: "MULTIPACK", primary_sku_id: "${sku1_id}" }
              as: ChannelManager
              captures: { mp_pack_id: $.data.id }
          trigger:
            - call: "POST /toolworks/pack-configurations/${rd_pack_id}/members"
              payload: { sku_id: "${sku1_id}", quantity: 2 }
              as: ChannelManager
              captures: { rd_line: $.data.line_extended_cents }
            - call: "POST /toolworks/pack-configurations/${mp_pack_id}/members"
              payload: { sku_id: "${sku1_id}", quantity: 2 }
              as: ChannelManager
              captures: { mp_line1: $.data.line_extended_cents }
            - call: "POST /toolworks/pack-configurations/${mp_pack_id}/members"
              payload: { sku_id: "${sku2_id}", quantity: 3 }
              as: ChannelManager
              captures: { mp_line2: $.data.line_extended_cents }
          assert:
            - "rd_line == 6600 (3300 * 2 * 1.00)"
            - "mp_line1 == 5808 (3300 * 2 * 0.88) and mp_line2 == 3960 (1500 * 3 * 0.88)"
            - "PackConfiguration.${mp_pack_id}.distinct_member_count == 2 while member_subtotal_cents, security_surcharge_cents and pack_total_cents are all still 0 (DRAFT)"
            - "PackConfiguration.${rd_pack_id}.distinct_member_count == 1"

      - name: sku_lineage_depth_walk_and_chain_rejections
        claim_type: correct_result
        grounds:
          - calculations.sku_lineage_depth
          - validations[priority=910]
          - validations[priority=911]
          - validations[priority=912]
          - errors[ERR_SKU_LINEAGE_CYCLE]
          - errors[ERR_LINEAGE_FAMILY_MISMATCH]
          - errors[ERR_LINEAGE_DEPTH_EXCEEDED]
        distinguishing_aspect: "The topological walk counts hops from the candidate parent, so a four-deep chain is accepted at lineage_depth 3 and refused at 4 with ERR_LINEAGE_DEPTH_EXCEEDED; a cross-family parent is ERR_LINEAGE_FAMILY_MISMATCH; and because the cycle check runs first, pointing a SKU at itself is ERR_SKU_LINEAGE_CYCLE rather than a depth error."
        test_recipe:
          setup:
            - "Four WRENCH SKUs forming the chain V4 -> V3 -> V2 -> V1 with lineage_depth 3, 2, 1, 0."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-V1", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { v1_id: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-V2", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3400, warranty_tier: "LIFETIME", supersedes_sku_id: "${v1_id}" }
              as: ChannelManager
              captures: { v2_id: $.data.id, v2_depth: $.data.lineage_depth }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-V3", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3500, warranty_tier: "LIFETIME", supersedes_sku_id: "${v2_id}" }
              as: ChannelManager
              captures: { v3_id: $.data.id, v3_depth: $.data.lineage_depth }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-V4", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3600, warranty_tier: "LIFETIME", supersedes_sku_id: "${v3_id}" }
              as: ChannelManager
              captures: { v4_id: $.data.id, v4_depth: $.data.lineage_depth }
          trigger:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-V5", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3700, warranty_tier: "LIFETIME", supersedes_sku_id: "${v4_id}" }
              as: ChannelManager
              captures: { e_depth: $.data.error_id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "SO-20-V1", tool_family: "SOCKET", channel: "BRANDED", nominal_size_mm: 20, alloy_grade: "CR_V", list_price_cents: 1500, warranty_tier: "LIFETIME", supersedes_sku_id: "${v1_id}" }
              as: ChannelManager
              captures: { e_family: $.data.error_id }
            - call: "PATCH /toolworks/tool-skus/${v1_id}"
              payload: { supersedes_sku_id: "${v1_id}" }
              as: ChannelManager
              captures: { e_self: $.data.error_id }
            - call: "PATCH /toolworks/tool-skus/${v1_id}"
              payload: { supersedes_sku_id: "${v4_id}" }
              as: ChannelManager
              captures: { e_cycle: $.data.error_id }
          assert:
            - "v2_depth == 1, v3_depth == 2, v4_depth == 3 (LINEAGE_MAX_DEPTH is 3, so V4 is exactly at the limit)"
            - "The fifth SKU returns HTTP 422 with error_id == 'ERR_LINEAGE_DEPTH_EXCEEDED' and no row is created"
            - "The SOCKET superseding a WRENCH returns HTTP 422 with error_id == 'ERR_LINEAGE_FAMILY_MISMATCH'"
            - "The self-reference PATCH returns HTTP 422 with error_id == 'ERR_SKU_LINEAGE_CYCLE' (cycle check precedes the depth check)"
            - "Pointing V1 at V4 returns HTTP 422 with error_id == 'ERR_SKU_LINEAGE_CYCLE' because V1 is already inside V4's chain"
            - "ToolSku.${v1_id}.supersedes_sku_id is still null and lineage_depth is still 0"
            - "GET /toolworks/tool-skus returns total_count 4"

