            - "DownstreamSystem.${sys_lf_id}.unacked_task_count == 2"

  - rule_id: boundary_precision_check
    instances:

      - name: match_score_exactly_at_review_threshold_is_inclusive
        grounds:
          - calculations.pair_match_score
          - entities.MatchRuleSet.fields.review_threshold
          - endpoints[POST /mpi/candidate-pairs/{id}/rescore]
        distinguishing_aspect: |
          Tests INCLUSIVITY of a comparison operator: a match_score of exactly 70.00 classifies
          as POTENTIAL_DUPLICATE against review_threshold 70.00 (>= is inclusive) and as
          NON_DUPLICATE against review_threshold 70.01, while match_score itself and both
          bands stay unchanged - a one-hundredth shift in the threshold, not in the score,
          flips the classification.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-BD."
            - "Two MatchRuleSet rows sharing identical attribute_weights and auto_link_threshold 85.00: RS-BASE with review_threshold 70.00 and RS-HI with review_threshold 70.01. Neither needs activation because POST /mpi/candidate-pairs and POST /mpi/candidate-pairs/{id}/rescore accept a rule_set_id in any status."
            - "Two ACTIVE PatientRecord rows BD-3001 and BD-3002 that agree exactly on last_name, first_name, dob and sex; BD-3002 leaves ssn_last4, postal_code and phone null."
            - "STRICT scoring therefore contributes 25.00 + 15.00 + 25.00 + 0.00 + 5.00 + 0.00 + 0.00 = 70.00, landing exactly on RS-BASE's review_threshold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-BD", name: "Boundary Clinic", region_code: "US-NY", registrar_headcount: 6 }
              as: MpiAdmin
              captures: { site_bd_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Raised Review Threshold Rules", version_label: "V-HI-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.01, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_hi_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_bd_id}", mrn: "BD-3001", last_name: "Petrov", first_name: "Dmitri", dob: "1972-08-19", sex: "M", ssn_last4: "3388", postal_code: "10011", phone: "2125550142", clinical_element_count: 11 }
              as: IdentityAnalyst
              captures: { rec_bd1_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_bd_id}", mrn: "BD-3002", last_name: "Petrov", first_name: "Dmitri", dob: "1972-08-19", sex: "M", clinical_element_count: 2 }
              as: IdentityAnalyst
              captures: { rec_bd2_id: $.data.id }
          trigger:
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_bd1_id}", record_b_id: "${rec_bd2_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_bd_id: $.data.id, pair_bd_v1: $.data.version }
            - call: "POST /mpi/candidate-pairs/${pair_bd_id}/rescore"
              payload: { rule_set_id: "${rs_hi_id}", score_variant: "STRICT", expected_pair_version: "${pair_bd_v1}" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "After the first trigger call: DuplicateCandidatePair.${pair_bd_id}.raw_score == 70.00 and match_score == 70.00"
            - "After the first trigger call: attribute_score_breakdown == {\"last_name\": 25.00, \"first_name\": 15.00, \"dob\": 25.00, \"ssn_last4\": 0.00, \"sex\": 5.00, \"postal_code\": 0.00, \"phone\": 0.00}"
            - "After the first trigger call: conflict_flags == [] (a null on one side is never a conflict)"
            - "After the first trigger call: classification == POTENTIAL_DUPLICATE (70.00 >= review_threshold 70.00 is inclusive)"
            - "After the first trigger call: queue_state == NEW and version == 1"
            - "After the first trigger call: base_band == P2 and effective_score == 70.00 and priority_band == P2"
            - "After the second trigger call: HTTP 200 and DuplicateCandidatePair.${pair_bd_id}.rule_set_id == ${rs_hi_id}"
            - "After the second trigger call: match_score == 70.00 (unchanged - only the threshold moved)"
            - "After the second trigger call: classification == NON_DUPLICATE (70.00 < review_threshold 70.01)"
            - "After the second trigger call: base_band == P2 and priority_band == P2 (bands read the global BAND_CUTOFF_P2 = 70.0, not the rule set's review_threshold)"
            - "After the second trigger call: queue_state == NEW (rescore never moves the queue) and version == 2"

      - name: evidence_adjustment_rounds_half_up_at_third_decimal
        grounds:
          - calculations.pair_triage_effective_score
          - global_constants.SCORE_ROUNDING
          - global_constants.BAND_MULTIPLIER_P1
          - endpoints[POST /mpi/candidate-pairs/{id}/evidence]
        distinguishing_aspect: |
          A DIFFERENT boundary kind from the threshold-inclusivity instance above - this one
          pins the ROUNDING MODE at the third decimal place: cumulative evidence_points of
          8.15 times BAND_MULTIPLIER_P1 1.50 equals exactly 12.225, which SCORE_ROUNDING
          round_half_up must render as 12.23 (banker's rounding would produce 12.22 and an
          effective_score of 97.22 instead of 97.23).
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-EV."
            - "One MatchRuleSet RS-BAND with auto_link_threshold 90.00 and review_threshold 70.00, so a score of 85.00 is POTENTIAL_DUPLICATE and the pair stays in NEW rather than auto-jumping to RECOMMENDED_MERGE."
            - "Two ACTIVE PatientRecord rows EV-4001 and EV-4002 agreeing exactly on last_name, first_name, dob, sex and ssn_last4, both with postal_code and phone null."
            - "STRICT scoring gives 25.00 + 15.00 + 25.00 + 15.00 + 5.00 + 0.00 + 0.00 = 85.00, which is exactly BAND_CUTOFF_P1, so base_band is P1 and the evidence multiplier is BAND_MULTIPLIER_P1 = 1.50."
            - "The pair is triaged and taken into review so that evidence can be attached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-EV", name: "Evidence Clinic", region_code: "US-GA", registrar_headcount: 5 }
              as: MpiAdmin
              captures: { site_ev_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Band Test Rules", version_label: "V-BAND-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 90.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_band_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_ev_id}", mrn: "EV-4001", last_name: "Adeyemi", first_name: "Folake", dob: "1988-02-29", sex: "F", ssn_last4: "7071", clinical_element_count: 14 }
              as: IdentityAnalyst
              captures: { rec_ev1_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_ev_id}", mrn: "EV-4002", last_name: "Adeyemi", first_name: "Folake", dob: "1988-02-29", sex: "F", ssn_last4: "7071", clinical_element_count: 6 }
              as: IdentityAnalyst
              captures: { rec_ev2_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_ev1_id}", record_b_id: "${rec_ev2_id}", rule_set_id: "${rs_band_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_ev_id: $.data.id, pair_ev_base_band: $.data.base_band }
            - call: "POST /mpi/candidate-pairs/${pair_ev_id}/triage"
              payload: { triage_note: "Rounding-mode probe pair." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_ev_id}/start-review"
              payload: {}
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /mpi/candidate-pairs/${pair_ev_id}/evidence"
              payload: { evidence_type: "PHOTO_ID", outcome: "SUPPORTS_SAME_PERSON", weight_points: 4.00, note: "Same photograph on both encounters." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_ev_id}/evidence"
              payload: { evidence_type: "INSURANCE_CARD", outcome: "SUPPORTS_SAME_PERSON", weight_points: 4.15, note: "Identical member id and group number." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "Before any evidence: DuplicateCandidatePair.${pair_ev_id}.match_score == 85.00 and classification == POTENTIAL_DUPLICATE and base_band == P1"
            - "Before any evidence: evidence_points == 0.00 and evidence_adjustment == 0.00 and effective_score == 85.00 and priority_band == P1"
            - "After the first trigger call: evidence_points == 4.00 and evidence_adjustment == 6.00 and effective_score == 91.00 and priority_band == P1"
            - "After the second trigger call: evidence_points == 8.15"
            - "After the second trigger call: evidence_adjustment == 12.23 (8.15 * 1.50 = 12.225 rounded half-up to 2dp; round-half-even would give 12.22)"
            - "After the second trigger call: effective_score == 97.23"
            - "After the second trigger call: base_band == P1 (still derived from match_score 85.00, not from effective_score) and priority_band == P1"
            - "After the second trigger call: DuplicateCandidatePair.${pair_ev_id}.queue_state == UNDER_REVIEW and version == 5"
            - "GET /mpi/candidate-pairs/${pair_ev_id}/evidence returns exactly 2 rows in created_at ASC order with weight_points 4.00 then 4.15"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: merge_completes_only_after_ack_required_task_is_acked
        grounds:
          - state_machines.MergeOperation
          - state_machines.PropagationTask
          - entities.DownstreamSystem.fields.ack_required
          - endpoints[POST /mpi/propagation-tasks/{id}/ack]
        distinguishing_aspect: |
          A MergeOperation's own state is not decidable from its own fields: it sits in
          PENDING_PROPAGATION while its single PropagationTask is QUEUED and again while that
          task is SENT, and only reaches COMPLETED (minting completed_at and
          reversal_deadline_at) when that foreign PropagationTask is ACKED - the dependency
          runs MergeOperation -> PropagationTask -> DownstreamSystem.ack_required.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-CE and one MatchRuleSet RS-BASE."
            - "One ACTIVE DownstreamSystem CLAIMS-HUB with propagation_mode BATCH, ack_required true and max_concurrent_dispatch 3, so exactly one acknowledgement gates the merge."
            - "Two ACTIVE PatientRecord rows CE-6001 (clinical_element_count 12) and CE-6002 (clinical_element_count 8) that agree on all seven scored attributes, giving STRICT match_score 100.00 with no conflicts."
            - "Because 100.00 >= auto_link_threshold 85.00 and conflict_flags is empty, the pair is created directly in RECOMMENDED_MERGE with recommended_by_user_id null, so the segregation-of-duties check at priority 34 is vacuous and no review evidence is required."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-CE", name: "Cross Entity Clinic", region_code: "US-MA", registrar_headcount: 7 }
              as: MpiAdmin
              captures: { site_ce_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/downstream-systems"
              payload: { system_code: "CLAIMS-HUB", name: "Enterprise Claims Hub", propagation_mode: "BATCH", ack_required: true, max_concurrent_dispatch: 3 }
              as: MpiAdmin
              captures: { sys_ce_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_ce_id}", mrn: "CE-6001", last_name: "Halvorsen", first_name: "Ingrid", dob: "1959-06-14", sex: "F", ssn_last4: "8181", postal_code: "02139", phone: "6175550188", clinical_element_count: 12 }
              as: IdentityAnalyst
              captures: { rec_ce1_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_ce_id}", mrn: "CE-6002", last_name: "Halvorsen", first_name: "Ingrid", dob: "1959-06-14", sex: "F", ssn_last4: "8181", postal_code: "02139", phone: "6175550188", clinical_element_count: 8 }
              as: IdentityAnalyst
              captures: { rec_ce2_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_ce1_id}", record_b_id: "${rec_ce2_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_ce_id: $.data.id, pair_ce_state: $.data.queue_state }
          trigger:
            - call: "POST /mpi/merge-operations"
              payload: { pair_id: "${pair_ce_id}", survivor_record_id: "${rec_ce1_id}", subsumed_record_id: "${rec_ce2_id}", rationale: "Identical demographics on all seven scored attributes." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { merge_ce_id: $.data.id, merge_ce_state: $.data.state }
            - call: "GET /mpi/propagation-tasks"
              payload: { merge_operation_id: "${merge_ce_id}" }
              as: MpiAdmin
              captures: { task_ce_id: "$.data[0].id", task_ce_state: "$.data[0].state" }
            - call: "POST /mpi/propagation-tasks/${task_ce_id}/send"
              payload: { dispatch_window_start_at: "2026-08-02T09:00:00Z", dispatch_window_end_at: "2026-08-02T10:00:00Z" }
              as: MpiAdmin
            - call: "GET /mpi/merge-operations/${merge_ce_id}"
              payload: {}
              as: IdentityStewardApprover
              captures: { merge_ce_state_mid: $.data.state }
            - call: "POST /mpi/propagation-tasks/${task_ce_id}/ack"
              payload: {}
              as: MpiAdmin
          assert:
            - "DuplicateCandidatePair.${pair_ce_id}.match_score == 100.00 and classification == AUTO_LINK and queue_state == RECOMMENDED_MERGE and recommended_by_user_id == null"
            - "After the merge: MergeOperation.${merge_ce_id}.moved_clinical_element_count == 8 and propagation_task_count == 1"
            - "After the merge: MergeOperation.${merge_ce_id}.state == PENDING_PROPAGATION and completed_at == null and reversal_deadline_at == null"
            - "After the merge: PatientRecord.${rec_ce1_id}.clinical_element_count == 20 and PatientRecord.${rec_ce2_id}.clinical_element_count == 0"
            - "After the merge: PatientRecord.${rec_ce2_id}.identity_state == MERGED_SUBSUMED and DuplicateCandidatePair.${pair_ce_id}.queue_state == RESOLVED_MERGED"
            - "After the merge: PropagationTask.${task_ce_id}.state == QUEUED and operation_kind == MERGE and propagation_deadline_at == \"2026-08-04T00:00:00Z\" (BATCH => +72h)"
            - "After the send: PropagationTask.${task_ce_id}.state == SENT and ${merge_ce_state_mid} == \"PENDING_PROPAGATION\" (a SENT task still does not complete the merge)"
            - "After the ack: PropagationTask.${task_ce_id}.state == ACKED"
            - "After the ack: MergeOperation.${merge_ce_id}.state == COMPLETED"
            - "After the ack: MergeOperation.${merge_ce_id}.completed_at == \"2026-08-01T00:00:00Z\" and reversal_deadline_at == \"2026-10-30T00:00:00Z\" (completed_at + REVERSAL_WINDOW_DAYS 90)"
            - "After the ack: DownstreamSystem.${sys_ce_id}.unacked_task_count == 0"

      - name: registration_blocked_by_active_record_at_a_different_site
        grounds:
          - calculations.registration_search_evaluation
          - validations[priority=46]
          - entities.RegistrationSearchAttempt.fields.blocked_creation
          - endpoints[POST /mpi/registration-sites/{id}/search-attempts]
        distinguishing_aspect: |
          A DIFFERENT entity dependency chain from the merge/task instance - here a
          PatientRecord create at SITE-AWAY is decided by the identity_state of a
          PatientRecord owned by SITE-HOME, mediated by the RegistrationSearchAttempt's
          computed blocked_creation flag and the enterprise-wide search pool; the identical
          create succeeds when it cites a search attempt whose pool match was absent.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Two ACTIVE RegistrationSite rows SITE-HOME and SITE-AWAY."
            - "One MatchRuleSet RS-BASE created AND activated - registration_search_evaluation always scores against the ACTIVE rule set, so activation is mandatory here."
            - "One ACTIVE PatientRecord H-9100 at SITE-HOME with all seven scored attributes populated."
            - "A SiteRegistrar acting for SITE-AWAY runs a search attempt supplying all seven matching terms; the enterprise-wide pool contains H-9100 from the OTHER site, so top_score is 100.00 >= auto_link_threshold 85.00 and blocked_creation is true."
            - "The same registrar then runs a second search attempt for an unrelated surname, which finds nothing and yields blocked_creation false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
