              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/claims/${claim_id}/disputes/${disp_id}/resolve"
              payload: { resolution: "UPHELD" }
              as: ClaimsAdjuster
              captures: { delta: $.data.adjustment_delta_cents }
            - call: "GET /programs/${prog_id}/claims/${claim_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { final_after: $.data.final_payout_cents }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramManager
              captures: { incurred_after: $.data.incurred_claims_cents }
          assert:
            - "incurred before dispute (${incurred_before}) == 500000 (== claim final at release; ledger starts consistent)"
            - "adjustment_delta_cents (${delta}) == 500000 (tier2 target 1000000 - final 500000)"
            - "claim final_payout_cents after resolve (${final_after}) == 1000000"
            - "incurred after (${incurred_after}) == 1000000 == 500000 + 500000 — program ledger and claim field move identically (no drift)"
