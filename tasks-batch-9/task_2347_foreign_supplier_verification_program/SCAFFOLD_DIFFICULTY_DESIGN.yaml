              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { rec_first: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fsvp/verification-records"
              payload: { activity_id: "${act5}", outcome: "PASS", performed_start: "2026-10-14T00:00:00Z", performed_end: "2026-10-16T00:00:00Z", findings_count: 0, document_reference: "AUD-2026-1014-RV" }
