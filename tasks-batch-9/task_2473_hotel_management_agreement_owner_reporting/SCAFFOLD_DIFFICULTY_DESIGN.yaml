              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${bud6b}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${agr6b}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 40000015, fnb_revenue_cents: 12000005, other_revenue_cents: 3000005, operating_expenses_cents: 30000000, closing_cash_available_cents: 6000000 }
              as: HotelManagerOps
              captures: { pkg6b: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkg6b}/centralized-charges"
              payload: { service_code: "RESERVATIONS", allocation_basis: "GROSS_REVENUE", pool_amount_cents: 10000000, hotel_basis_share: 0.05 }
              as: HotelManagerOps
              captures: { chg6b: $.data.id }
          trigger:
            - call: "POST /hotel-management/report-packages/${pkg6b}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${pkg6b}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /hotel-management/agreements/${agr6b}"
              payload: {}
              as: HotelManagerOps
              captures: { agr6b_vf: $.data.version }
            - call: "POST /hotel-management/agreements/${agr6b}/annual-true-up"
