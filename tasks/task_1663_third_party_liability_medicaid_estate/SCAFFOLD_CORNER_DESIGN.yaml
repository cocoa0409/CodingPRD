      - name: lien_amend_state_beats_sol_temporal
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]", "errors[ERR_LIEN_NOT_AMENDABLE]"]
        distinguishing_aspect: "Amend on a RELEASED lien past the SOL -> ERR_LIEN_NOT_AMENDABLE (state, priority 6) wins over ERR_SOL_EXPIRED (temporal, priority 7); no lazy-expiry mutation fires."
        test_recipe:
          setup: ["Case injury 2023-01-01 (sol 2026-01-01): lien FILED then RELEASED (case back to ATTORNEY_NOTIFIED); clock moved to 2026-06-01"]
          setup_api_calls:
            - { call: "POST /recovery/members", payload: { medicaid_id: "M-PS-1", full_name: "Prio State", state_code: "CA" }, as: SystemAdmin, as_user_id: admin_1, captures: { m_id: $.data.id } }
            - { call: "POST /recovery/cases", payload: { member_id: "${m_id}", attorney_name: "Atty A", attorney_email: "a@x.com", injury_date: "2023-01-01", third_party_insurer: "InsCo" }, as: RecoverySpecialist, as_user_id: spec_1, captures: { c_id: $.data.id } }
