      - name: nutrition_factor_rounds_half_up_before_multiplication
        claim_type: precision
        grounds:
          - calculations.flock_settable_forecast.precision
          - calculations.flock_settable_forecast.constants.TARGET_FEED_G
        distinguishing_aspect: "A feed step of 155.0 g gives 155.0 / 160.0 = 0.96875 exactly on the 4-dp rounding boundary: round_half_up must store 0.9688 BEFORE the multiplication, which yields settable_forecast 5309, whereas truncating to 0.9687 yields 5308."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z. Program P2 has feed steps 21->150.0 g and 26->155.0 g and lighting steps 21->12.0 h, 24->14.0 h, 30->16.0 h."
            - "Flock F2 hatched 2026-01-05 is 29 weeks old at creation, so production_rate_pct is the 82.0 tier, photoperiod is 14.0 h and the feed step is 155.0 g."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P2", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 155.0}]}, as: HatcheryManager, captures: {p2: "$.data.id"}}
          trigger:
            - {call: "POST /breeder-flocks", payload: {code: "F2", program_id: "${p2}", breed: "ROSS_308", house_code: "H2", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f2: "$.data.id"}}
            - {call: "POST /breeder-flocks/${f2}/recompute-forecast", payload: {}, as: FlockManager}
          assert:
            - "age_weeks == 29, production_rate_pct == 82.0, photoperiod_hours == 14.0, feed_grams_per_hen_day == 155.0"
            - "lighting_factor == 0.7900 (0.70 + 0.03 * 3.0, no rounding artefact)"
            - "nutrition_factor == 0.9688 exactly - 0.96875 rounds half UP, not to 0.9687 and not to 0.9690"
            - "settable_forecast == 5309 (floor(9000 * 0.82 * 0.7900 * 0.9688 * 0.94) = floor(5309.3998944))"
            - "The recompute-forecast call returns the identical numbers: the calculation is deterministic and idempotent"
            - "A truncating implementation would store 0.9687 and forecast 5308, so the two are distinguishable by one chick"

