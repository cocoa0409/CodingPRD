            - "ChangeOrder.${co_t}.status == APPROVED"
            - "Project.${proj_t}.commercial_status == CLEAN"
            - "Project.${proj_t}.delivery_status == DESIGN and Project.${proj_t}.design_version == 1 (scope_delta_cph 0 fires no design cascade)"

  # =========================================================================
  # Rule 3 — non_linear_state_machine
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: fabrication_lot_fat_rework_cycle_then_third_failure_scraps
        grounds:
          - state_machines.FabricationLot.STAGED_to_FAT_FAILED
          - state_machines.FabricationLot.FAT_FAILED_to_FABRICATING
          - state_machines.FabricationLot.STAGED_to_SCRAPPED
          - calculations.fat_result_evaluation
        distinguishing_aspect: |
          The lot re-enters FABRICATING from FAT_FAILED, so STAGED -> FAT_FAILED -> FABRICATING -> STAGED is a
          true cycle rather than a forward-only path, and the cycle is bounded: the third FatTest failure routes
          STAGED to SCRAPPED instead of FAT_FAILED even though the inputs are identical to attempts one and two.
        test_recipe:
          setup:
            - "Project frozen with required_throughput_cph 1250, so FabricationLot.fat_target_cph is 1313."
            - "One FabricationLot in STAGED with fat_attempt_count 0."
