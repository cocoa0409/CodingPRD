              as: MillAdmin
              captures: { e_season: $.data.error_id }
            - call: "GET /mill/growers/00000000-0000-0000-0000-000000000000"
              as: MillAdmin
              captures: { e_grower: $.data.error_id }
            - call: "GET /mill/contracts/00000000-0000-0000-0000-000000000000"
              as: MillAdmin
              captures: { e_contract: $.data.error_id }
            - call: "GET /mill/bins/00000000-0000-0000-0000-000000000000"
              as: MillAdmin
              captures: { e_bin: $.data.error_id }
            - call: "GET /mill/lots/00000000-0000-0000-0000-000000000000"
              as: MillAdmin
              captures: { e_lot: $.data.error_id }
            - call: "GET /mill/drying-runs/00000000-0000-0000-0000-000000000000"
              as: MillAdmin
              captures: { e_dr: $.data.error_id }
            - call: "GET /mill/mill-runs/00000000-0000-0000-0000-000000000000"
              as: MillAdmin
              captures: { e_mr: $.data.error_id }
            - call: "GET /mill/packaging-runs/00000000-0000-0000-0000-000000000000"
              as: MillAdmin
              captures: { e_pr: $.data.error_id }
            - call: "GET /mill/byproduct-orders/00000000-0000-0000-0000-000000000000"
              as: MillAdmin
              captures: { e_bo: $.data.error_id }
            - call: "GET /mill/fumigation-events/00000000-0000-0000-0000-000000000000"
              as: MillAdmin
              captures: { e_fum: $.data.error_id }
            - call: "GET /mill/holds/00000000-0000-0000-0000-000000000000"
              as: MillAdmin
              captures: { e_hold: $.data.error_id }
