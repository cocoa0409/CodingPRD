            - { call: "POST /subscribers/${ep2_sb}/churn", payload: { reason: "PRODUCT" }, as: ClientOps, as_user_id: "${ep2_cl}" }
          trigger:
            - call: "GET /clients/${ep2_cl}/reports/fulfillment-summary"
              payload: { period: "2026-05" }
              as: ClientOps
              as_user_id: "${ep2_cl}"
              captures: { ep2_rep_planned: $.data.planned_boxes, ep2_rep_kitted: $.data.kitted_boxes, ep2_rep_fill: $.data.fill_rate_pct, ep2_rep_active: $.data.active_subscribers, ep2_rep_churn: $.data.churned_in_period, ep2_rep_shipped: $.data.shipped_boxes }
          assert:
            - "planned_boxes == 2 and kitted_boxes == 1 (LOCKED+ run included; excess-cancelled shipment ignored)"
            - "fill_rate_pct == 50.0 (round_half_up(1*100.0/2, 1))"
            - "shipped_boxes == 0 and returned_boxes == 0"
            - "active_subscribers == 1 and churned_in_period == 1 (churned_at 2026-05-20 inside the period window)"

      - name: kit_revision_supersession_chain
        claim_type: cross_reference_link
        grounds:
          - entities.KitRevision.fields.supersedes_revision_id
          - state_machines.KitRevision.DRAFT_to_RETIRED
        distinguishing_aspect: "Self-referential chain: creating revision 2 while revision 1 is DRAFT retires revision 1 and links rev2.supersedes_revision_id -> rev1; the reverse lookup GET /kit-revisions?supersedes_revision_id=rev1 finds rev2."
        test_recipe:
          setup: ["client + plan PL-EP3 (DRAFT); revision 1 exists as DRAFT"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "EP3 Client", billing_email: "ep3@acme.test" }
              as: PlatformAdmin
              captures: { ep3_cl: $.data.id }
            - call: "POST /box-plans"
              payload: { client_id: "${ep3_cl}", name: "EP3 Box", sku: "PL-EP3", price_per_box_cents: 1000, shipping_weight_grams: 500 }
              as: ClientOps
              as_user_id: "${ep3_cl}"
              captures: { ep3_pl: $.data.id, ep3_pl_v: $.data.version }
            - call: "POST /box-plans/${ep3_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${ep3_pl_v}" }
              as: ClientOps
              as_user_id: "${ep3_cl}"
              captures: { ep3_rv1: $.data.id }
            - call: "GET /box-plans/${ep3_pl}"
              as: ClientOps
              as_user_id: "${ep3_cl}"
              captures: { ep3_pl_v2: $.data.version }
          trigger:
            - call: "POST /box-plans/${ep3_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${ep3_pl_v2}" }
              as: ClientOps
              as_user_id: "${ep3_cl}"
              captures: { ep3_rv2: $.data.id, ep3_rv2_sup: $.data.supersedes_revision_id }
            - call: "GET /kit-revisions/${ep3_rv1}"
              as: ClientOps
              as_user_id: "${ep3_cl}"
              captures: { ep3_rv1_status: $.data.status }
            - call: "GET /kit-revisions"
              payload: { supersedes_revision_id: "${ep3_rv1}" }
              as: ClientOps
              as_user_id: "${ep3_cl}"
              captures: { ep3_lookup_id: "$.data[0].id" }
          assert:
            - "KitRevision.${ep3_rv2}.supersedes_revision_id == ${ep3_rv1}"
            - "KitRevision.${ep3_rv1}.status == RETIRED (superseded)"
            - "reverse lookup by supersedes_revision_id returns exactly revision 2 (${ep3_lookup_id} == ${ep3_rv2})"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers fails at priority 1 with ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["one client exists so a valid path id is available"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "ER1 Client", billing_email: "er1@acme.test" }
              as: PlatformAdmin
              captures: { er1_cl: $.data.id }
          trigger:
            - call: "GET /clients/${er1_cl}"
              as: PlatformAdmin
              captures: { er1_err: $.data.error_id }
          assert:
            - "when the test harness omits both auth headers: error_id == ERR_UNAUTHENTICATED with HTTP 401"
            - "the error fires before authorization/existence checks (priority 1)"

