            - { call: "POST /disposition/analyses", payload: { asset_id: "${g_id}", expected_asset_version: "${g_v}", cap_rate_bps: 500, discount_rate_bps: 800, exit_cap_rate_bps: 600, hold_years: 5, selected_method: DIRECT_CAP, est_sale_price_cents: 1900000000, est_selling_costs_cents: 0 }, as: AssetAnalyst, as_user_id: analyst-1, captures: { an: $.data.id } }
