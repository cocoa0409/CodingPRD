      - name: appraisal_assignment_is_guarded_by_the_application_status_dimension
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Appraisal.null_to_ASSIGNED.preconditions
          - state_machines.Application.RECEIVED_to_WITHDRAWN
          - validations[priority=12]
          - errors.ERR_INVALID_APPLICATION_STATE
        distinguishing_aspect: "A guarded transition across entities: POST /applications/{id}/appraisals is admitted only while the parent Application is in {RECEIVED, RANKED, OFFER_ISSUED, COUNTERED}, so the identical payload that succeeds on the RECEIVED application AP1 is refused 409 ERR_INVALID_APPLICATION_STATE on the WITHDRAWN application AP2 — the guard reads the other entity's state, not the appraisal's own."
        test_recipe:
          setup:
            - "Round R1 is OPEN with two ELIGIBLE parcels, PA1 for AP1 and PA3 for AP2, both filed at clock 2026-08-10."
            - "AP2 is then withdrawn by its landowner while AP1 stays RECEIVED."
          setup_api_calls:
            - *k_prog1
