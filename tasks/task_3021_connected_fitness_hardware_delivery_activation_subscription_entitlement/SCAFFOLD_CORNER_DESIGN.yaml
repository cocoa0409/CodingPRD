            - "GET /fitness/service-orders?part_id=${pi_id} returns exactly 1 row, the BELT_SLIP order ${so1}"
            - "GET /fitness/service-orders?status=DISPATCHED returns exactly 1 row, the SENSOR_FAULT order ${so2}"
            - "GET /fitness/parts-inventory/${pi_id}/service-orders returns exactly 1 row"
            - "every row in every response carries the pagination envelope keys limit, offset, total_count and has_more"

      - name: delivery_quote_reports_the_advisory_charges_and_writes_nothing
        claim_type: Computed read
        grounds:
          - endpoints.POST_/fitness/delivery-quotes
          - calculations.delivery_charge
          - calculations.stair_carry_surcharge
        distinguishing_aspect: "The advisory quote endpoint is a pure read that reports the RURAL leg charge and the pinned per-term stair surcharge while leaving every aggregate entity count unchanged."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
