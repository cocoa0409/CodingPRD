  - rule_id: transitive_cascade
    instances:
      - name: blank_sailing_cascade_depth4
        grounds:
          - state_machines.Voyage.BOOKING_OPEN_to_BLANKED
          - state_machines.Booking.CONFIRMED_to_ROLLED
          - state_machines.BillOfLading.ISSUED_to_VOIDED
          - state_machines.Invoice.DRAFT_to_VOID
          - calculations.credit_exposure
        distinguishing_aspect: |
          Depth-4 chain from trigger POST /voyages/{id}/blank: voyage BLANKED
          -> booking CONFIRMED -> ROLLED (link 1, caused by the voyage) -> that
          booking's ISSUED BillOfLading -> VOIDED (link 2, caused by the
          booking roll) -> its DRAFT FREIGHT invoice -> VOID (link 3, caused by
          the same roll cascade) -> shipper credit_exposure_forward_cents
          recompute drops the estimate (link 4, caused by the invoice/booking
          mutations). Not a fan-out: each link is a precondition consequence of
          the previous entity's mutation.
        test_recipe:
          setup:
            - "Booking CONFIRMED (LCL, estimate 77400) with ISSUED B/L and a DRAFT FREIGHT invoice; voyage still BOOKING_OPEN"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME BLANK", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
