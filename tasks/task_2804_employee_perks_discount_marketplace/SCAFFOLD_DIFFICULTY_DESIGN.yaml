  - rule_id: resource_temporal_overlap
    instances:

      - name: closed_interval_featured_slot_capacity_outranks_merchant_cooldown_separation
        grounds:
          - validations[priority=83]
          - validations[priority=84]
          - errors[ERR_SLOT_CAPACITY_CONFLICT]
          - errors[ERR_SLOT_COOLDOWN_CONFLICT]
          - calculations.placement_fee_pricing
          - state_machines.PlacementSlot.RESERVED_to_RELEASED
          - concurrency_rules[slot-reserve-stale-offer]
        distinguishing_aspect: |
          The contended resource is FEATURED PlacementSlot capacity on one
          (employer_id, category) lane and the intervals are CLOSED
          [slot_window_start, slot_window_end], so a run that starts exactly when another ends
          still intersects it: a third intersecting FEATURED run is refused with
          ERR_SLOT_CAPACITY_CONFLICT even though the same request also violates the
          lower-priority 7-day merchant separation rule, and once one competing run is released
          the identical request returns ERR_SLOT_COOLDOWN_CONFLICT instead.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. Two merchants, Bistro Uno and Cafe Duo, each hold their own ACTIVE DINING/CA agreement with placement_fee_base_cents 36000 and one ACTIVE offer."
