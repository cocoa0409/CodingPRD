        grounds:
          - roles.PriorAuthCoordinator
          - roles.Pharmacist
          - "validations[priority=2]"
        distinguishing_aspect: "A Pharmacist calling POST /prior-authorizations/{id}/decide (PriorAuthCoordinator-exclusive) is denied with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A REQUESTED prior authorization"]
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C22", full_name: "Corner TwentyTwo", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/prior-authorizations"
              payload: { patient_id: "${pat_id}", drug_name: "SpecialtyX", payer: "Acme" }
              as: PriorAuthCoordinator
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /infusion-center/prior-authorizations/${pa_id}/decide"
              payload: { decision: "APPROVE", authorized_units_mg: 500 }
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"

      - name: rbac_missing_auth_header_rejected
        claim_type: peer_roles
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_AUTH]"
        distinguishing_aspect: "A request with no X-User-Role header returns ERR_MISSING_AUTH (401)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C23", full_name: "Corner TwentyThree", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MISSING_AUTH"

