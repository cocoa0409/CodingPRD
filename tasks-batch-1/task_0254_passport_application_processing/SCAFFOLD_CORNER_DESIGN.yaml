              as: Applicant
              as_user_id: "${appl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 422"
            - "data.error_id == \"ERR_INVALID_INTERVAL\""

      - name: duplicate_urgent_appointment_rejected
        claim_type: Aggregate validation
        grounds:
          - validations[priority=14]
          - errors[ERR_DUPLICATE_URGENT_APPOINTMENT]
          - entities.Application.fields.urgent_travel
        distinguishing_aspect: "An application that already holds one BOOKED URGENT_TRAVEL_COUNTER appointment is rejected with ERR_DUPLICATE_URGENT_APPOINTMENT (409) when booking a second non-overlapping urgent appointment; the at-most-one rule is per application, not per counter."
        test_recipe:
