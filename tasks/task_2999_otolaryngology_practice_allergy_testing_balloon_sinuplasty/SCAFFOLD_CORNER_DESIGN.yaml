          - calculations.surgery_block_utilization
        distinguishing_aspect: "The derived overnight_observation_required flag (TONSILLECTOMY below 36 months) is matched against the block's overnight_capable, so the identical booking payload is refused by one block and accepted by another that differs only in that boolean."
        test_recipe:
          setup:
            - "PayerPolicy with defaults; one Patient born 2024-06-01, which is age_months 26 at the default clock of 2026-08-01."
            - "Two four-hour blocks with max_concurrent_cases 2 and therefore capacity_minutes 480: block A overnight_capable false, block B overnight_capable true."
