      - name: credit_limit_equality_allowed
        grounds:
          - calculations.customer_open_exposure
          - validations[priority=27]
        distinguishing_aspect: |
          Metric: open exposure cents; endpoint: POST /work-orders/{id}/confirm.
          candidate_exposure == credit_limit_cents (5,000,000) is ALLOWED
          (rejection requires strictly >), while one more identical order pushes
          the candidate to 10,000,000 and fails.
        test_recipe:
          setup:
            - "Customer credit_limit_cents=5000000; two identical QUOTED orders, each estimating 5000 m * 1000 cents/m = 5,000,000 (adj 0 at clock 2026-06)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-06", index_cents_per_kg: 100.0 }, as: PlantManager }
