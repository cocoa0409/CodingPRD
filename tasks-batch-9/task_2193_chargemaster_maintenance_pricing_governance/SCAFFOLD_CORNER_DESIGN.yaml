          assert:
            - "HTTP status == 422"
            - "${err} == \"ERR_COMPANION_ITEM_INVALID\""
            - "GET /chargemaster/charge-items with facility_id=${facA} returns total_count == 0"

      - name: code_update_cycle_and_entry_defaults_loaded_pending_and_inflator
        claim_type: defaults
        grounds:
          - entities.CodeUpdateCycle.fields.cost_inflator_bp
          - entities.CodeUpdateCycle.fields.status
          - entities.CodeUpdateEntry.fields.status
          - endpoints[POST /chargemaster/code-update-cycles/{cycle_id}/entries]
        distinguishing_aspect: "A cycle created without cost_inflator_bp defaults to 10300 with status LOADED and all three entry counters 0; an entry appended to it defaults to status PENDING with carried_gross_charge_cents null and target_charge_item_id null, and the cycle's entry_count / unmapped_entry_count both become 1."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one facility; no cycles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001" }
              as: SystemAdmin
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /chargemaster/code-update-cycles"
              payload: { facility_id: "${fac}", cycle_year: 2027, code_set: "CPT" }
              as: RevenueIntegrityAnalyst
              captures: { cyc: $.data.id }
            - call: "POST /chargemaster/code-update-cycles/${cyc}/entries"
              payload: { action: "CROSSWALK", old_code_value: "93458", new_code_value: "93459" }
              as: RevenueIntegrityAnalyst
              captures: { ent: $.data.id }
            - call: "GET /chargemaster/code-update-cycles/${cyc}"
              payload: {}
              as: RevenueIntegrityAnalyst
          assert:
            - "First call: HTTP status == 201 and data.status == LOADED"
            - "CodeUpdateCycle.${cyc}.cost_inflator_bp == 10300"
            - "CodeUpdateCycle.${cyc}.pre_activation_active_item_count == null"
            - "CodeUpdateCycle.${cyc}.activated_at == null and CodeUpdateCycle.${cyc}.rolled_back_at == null"
            - "Second call: HTTP status == 201 and data.status == PENDING"
            - "CodeUpdateEntry.${ent}.target_charge_item_id == null"
            - "CodeUpdateEntry.${ent}.carried_gross_charge_cents == null"
            - "CodeUpdateEntry.${ent}.mapped_by_user_id == null"
            - "Third call: data.entry_count == 1 and data.unmapped_entry_count == 1 and data.applied_entry_count == 0"

  # ===========================================================================
  # SECTION 2 — STATE MACHINES (§1.2 / §1.2.1)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: change_request_initial_state_is_submitted_with_revision_round_zero
        claim_type: initial_state
        grounds:
          - state_machines.ChangeRequest.initial_state
          - entities.ChangeRequest.fields.status
          - entities.ChangeRequest.fields.revision_round
        distinguishing_aspect: "A freshly created ChangeRequest lands in the declared initial_state SUBMITTED with revision_round == 0, reviewed_by_user_id == null, approved_by_user_id == null and pinned_charge_item_version == null."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; facility NEAREST_CENT; RevenueCode 0300; department managed by mgr_cath."
            - "COST_PLUS_MARKUP rule (default tiers) in force so the dry-run projection can be computed."
            - "DRAFT ChargeItem CDM-1001 (cost 100000, medicare 50000, market_p75 900000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000 }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { pr300: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
          trigger:
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept}", charge_item_id: "${item}", request_type: "PRICE_CHANGE", justification: "Supply contract renegotiated upward in Q3", proposed_cost_basis_cents: 200000, proposed_description: "CARDIAC CATH BASIC V2" }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { cr: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ChangeRequest.${cr}.status == SUBMITTED"
            - "ChangeRequest.${cr}.revision_round == 0"
            - "ChangeRequest.${cr}.submitted_by_user_id == \"mgr_cath\""
            - "ChangeRequest.${cr}.reviewed_by_user_id == null"
            - "ChangeRequest.${cr}.approved_by_user_id == null"
            - "ChangeRequest.${cr}.pinned_charge_item_version == null"
            - "ChangeRequest.${cr}.decision_note == null"
            - "ChangeRequest.${cr}.projected_gross_charge_cents == 480000"
            - "ChangeRequest.${cr}.projected_markup_ratio_bp == 24000"
            - "ChangeRequest.${cr}.version == 1"
            - "Department.${dept}.open_request_count == 1"

      - name: item_submit_for_review_moves_draft_to_pending_review_only
        claim_type: valid_transition
        grounds:
          - state_machines.ChargeItem.lifecycle_status.DRAFT_to_PENDING_REVIEW
          - endpoints[POST /chargemaster/charge-items/{charge_item_id}/lifecycle]
        distinguishing_aspect: "SUBMIT_FOR_REVIEW on a DRAFT item sets lifecycle_status = PENDING_REVIEW and bumps ChargeItem.version to 2 while leaving price_status at PRICE_STALE and gross_charge_cents at 0 — the declared 'price_status is NOT touched' side effect."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; facility OPEN; RevenueCode 0300 with requires_hcpcs false and allowed_code_types containing CPT."
            - "Department allowed_revenue_code_values is empty (unrestricted)."
            - "DRAFT, never-repriced ChargeItem CDM-1001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
          trigger:
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW", note: "Ready for pricing review" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
          assert:
            - "HTTP status == 200"
            - "ChargeItem.${item}.lifecycle_status == PENDING_REVIEW"
            - "ChargeItem.${item}.price_status == PRICE_STALE"
            - "ChargeItem.${item}.gross_charge_cents == 0"
            - "ChargeItem.${item}.version == 2"
            - "Facility.${fac}.active_item_count == 0"
            - "Facility.${fac}.chargemaster_posture == OPEN"

      - name: item_approve_from_draft_rejected_invalid_lifecycle_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.ChargeItem.lifecycle_status.PENDING_REVIEW_to_APPROVED
          - validations[priority=13]
          - errors[ERR_INVALID_ITEM_LIFECYCLE_STATE]
        distinguishing_aspect: "APPROVE is declared only from PENDING_REVIEW; issuing it on a DRAFT item returns ERR_INVALID_ITEM_LIFECYCLE_STATE (409) from priority 13, NOT the priority-49 ERR_ITEM_PRICE_NOT_CURRENT that the same never-repriced item would also violate."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; DRAFT ChargeItem CDM-1001 that has never been repriced (price_status == PRICE_STALE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
          trigger:
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == \"ERR_INVALID_ITEM_LIFECYCLE_STATE\""
            - "${err} != \"ERR_ITEM_PRICE_NOT_CURRENT\""
            - "ChargeItem.${item}.lifecycle_status == DRAFT"
            - "ChargeItem.${item}.approved_by_user_id == null"
            - "ChargeItem.${item}.version == 1"

      - name: archived_item_terminal_state_rejects_reactivate_and_reprice
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ChargeItem.lifecycle_status.terminal_states
          - state_machines.ChargeItem.lifecycle_status.INACTIVE_to_ARCHIVED
          - errors[ERR_INVALID_ITEM_LIFECYCLE_STATE]
        distinguishing_aspect: "ARCHIVED is the only terminal lifecycle state; both REACTIVATE (declared only from INACTIVE) and POST /reprice (which requires lifecycle_status != ARCHIVED) return ERR_INVALID_ITEM_LIFECYCLE_STATE (409) and leave lifecycle_status == ARCHIVED with version unchanged."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; facility OPEN; ChargeItem driven DRAFT -> ... -> ACTIVE -> INACTIVE -> ARCHIVED."
            - "No ChangeRequest and no CapturedCharge reference the item, so ARCHIVE's preconditions hold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }] }
              as: RevenueIntegrityAnalyst
              captures: { pr300: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "DEACTIVATE", note: "Retired from the CDM" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ARCHIVE", note: "Archived after retention window" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { archived_v: $.data.version }
          trigger:
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "REACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { err1: $.data.error_id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { err2: $.data.error_id }
          assert:
