              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cp: $.data.id }
            - call: "POST /surveillance/cases/${cp}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cp}/classify"
              payload: { classification: "PROBABLE" }
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "GET /surveillance/cases/${cp}"
              as: EpiAnalyst
              captures: { cp_v: $.data.version }
            - call: "POST /surveillance/jurisdiction-transfers"
              payload: { program_id: "${prog}", case_id: "${cp}", to_jurisdiction_id: "${j2}", expected_case_version: "${cp_v}" }
              as: EpiAnalyst
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /surveillance/cases/${cp}/close"
