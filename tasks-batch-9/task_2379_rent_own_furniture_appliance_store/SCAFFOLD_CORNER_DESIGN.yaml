      - name: agreement_pricing_fields_are_computed_not_accepted
        claim_type: computed_fields
        grounds:
          - entities.Agreement.fields.renewal_rate_cents
          - entities.Agreement.fields.processing_fee_cents
          - calculations.agreement_pricing
        excluded_because:
          difficulty_instance: combinatorial_formula / pricing_ceil_rate_before_multiply_inflates_disclosed_subtotal
          rationale: "That instance already asserts every computed pricing field of a created agreement (5077 / 264004 / 5000 / 269004 / 22000) plus the derived disclosure read, from a body that supplies none of them."

      - name: loyalty_ledger_entries_are_append_only
        claim_type: immutability
        grounds:
          - entities.LoyaltyLedgerEntry.common_fields
          - entities.LoyaltyLedgerEntry.fields.delta_points
        excluded_because:
          difficulty_instance: non_linear_state_machine / payment_status_cycles_current_delinquent_current_delinquent_via_reversal
          rationale: "That instance asserts the reversal appends a second PAYMENT_REVERSAL row of -50 instead of mutating or deleting the original PAYMENT_ACCRUAL row of +50, which is exactly the append-only claim; §1.5 declares no update or delete endpoint for the collection."

  # ===========================================================================
  # 2. State Machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: store_and_unit_start_in_their_declared_initial_state
        claim_type: initial_state
        grounds:
          - entities.Store.fields.service_intake_open
          - entities.InventoryUnit.fields.status
          - entities.InventoryUnit.fields.condition_grade
          - state_machines.InventoryUnit.initial_state
        distinguishing_aspect: |
          A freshly created store must start with both unit counters at 0 and
          service_intake_open true (the posture is derived, not supplied), and a
          freshly created unit must start AVAILABLE / NEW / rent_cycle_count 0
          with residual_valuation_basis NONE and retired_reason NONE — the whole
          initial vector of the two machines that later cycle.
        test_recipe:
          setup:
            - "a TX StateRtoRule exists and nothing else has been created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
          trigger:
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX" }
              as: PlatformAdmin
              captures: { store_tx_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_tx_id: $.data.id }
            - call: "GET /stores/${store_tx_id}"
              as: StoreManager
            - call: "GET /inventory-units/${unit_tx_id}"
              as: StoreManager
          assert:
            - "Store.${store_tx_id}.service_bay_capacity == 1 (the declared default, since the body omitted it), units_on_rent_count == 0, units_in_service_count == 0, service_intake_open == true, version == 1"
            - "InventoryUnit.${unit_tx_id}.status == AVAILABLE, condition_grade == NEW, rent_cycle_count == 0"
            - "InventoryUnit.${unit_tx_id}.accumulated_rent_received_cents == 0, residual_value_cents == 0, residual_valuation_basis == NONE, retired_reason == NONE, version == 1"
            - "InventoryUnit.${unit_tx_id}.store_id == ${store_tx_id} and replaced_unit_id is null"

      - name: checking_a_reference_twice_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.CustomerReference.PENDING_to_VERIFIED
          - validations[priority=20].ERR_REFERENCE_ALREADY_CHECKED
          - entities.Customer.fields.verified_reference_count
        distinguishing_aspect: |
          A reference check is single-shot: the second call on the same
          reference must return 409 ERR_REFERENCE_ALREADY_CHECKED and must not
          overwrite VERIFIED with UNREACHABLE, so the derived
          verified_reference_count stays 1 instead of dropping to 0 — the
          rejected retry leaves no trace at all.
        test_recipe:
          setup:
            - "one PENDING customer with exactly one PENDING CustomerReference"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Ruth Vega", relationship: "FAMILY", phone: "+15125550102" }
              as: SalesAssociate
              captures: { ref1_id: $.data.id }
          trigger:
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
              as_user_id: "u_sales_1"
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "UNREACHABLE" }
              as: SalesAssociate
              as_user_id: "u_sales_1"
            - call: "GET /customers/${cust_id}/references"
              as: StoreManager
          assert:
            - "the first check returns 200 with CustomerReference.${ref1_id}.check_status == VERIFIED, checked_at == 2026-08-01T00:00:00Z and checked_by_user_id == u_sales_1"
            - "the second check returns 409 ERR_REFERENCE_ALREADY_CHECKED"
            - "the reference list still reports total_count == 1 with check_status == VERIFIED (not UNREACHABLE)"
            - "Customer.${cust_id}.verified_reference_count == 1 and verification_status is still PENDING"

      - name: day_close_repeated_at_the_same_clock_instant_changes_nothing
        claim_type: idempotency
        grounds:
          - endpoints[POST /stores/{id}/day-close]
          - state_machines.Agreement.payment_status.CURRENT_to_DELINQUENT
          - calculations.late_fee_assessment
          - calculations.reinstatement_window_length
        distinguishing_aspect: |
          The ops-run checkpoint is idempotent per (store, clock instant): the
          first close assesses one 508-cent late fee and opens one 5-day window,
          the second close at the identical clock value still reports
          agreements_scanned 1 but every effect counter 0, and no row moves —
          late_fee_assessed_cents stays 508, exactly one OPEN window exists and
          lifetime_delinquency_count stays 1 rather than doubling to 2.
