          own_balance: $.data.outstanding_balance_cents
          own_settled: $.data.settled_charges_cents
          own_credits: $.data.credits_applied_cents
      assert:
      - The entity-backed read returns HTTP 200 with data.outstanding_balance_cents == ${own_balance}
        == 0
      - 'The breakdown is the full declared triple: data.settled_charges_cents == ${own_settled} == 0
        and data.credits_applied_cents == ${own_credits} == 0'
      - The response is the balance object rather than a Lessee row, so the read resolves the §1.3 lessee_balance_reconciliation
        view for the id in the path
      - The call succeeds with X-User-ID equal to the path id ${ls_a_id}, which is the only identity this
        entity_backed role may present
      - 'The sibling read against the other account is the denial half of this pair: rbac_lessee_denied_another_lessees_balance_returns_forbidden'
