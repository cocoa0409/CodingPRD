      - name: clinician_concurrent_visit_cap_uses_half_open_zero_buffer_intervals
        grounds:
          - validations.priority_46_ERR_CLINICIAN_CAPACITY_EXCEEDED
          - calculations.visit_slot_interval
          - endpoints.POST_visits
        distinguishing_aspect: |
          A different resource entity (Clinician rather than InfusionChair) with deliberately
          different interval semantics: ZERO buffer and a HALF-OPEN comparison, plus a cap of two
          concurrent visits instead of one. Two 30-minute FOLLOW_UP visits at 14:00 and 14:10 both
          cover 14:20, so a third visit starting at 14:20 is refused; a visit starting exactly at
          14:40 — the end instant of the 14:10 visit — is accepted, which is the opposite outcome
          from the chair instance where a start inside the extended block was refused.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One rheumatologist (the constrained resource) and four patients."
            - "FOLLOW_UP visits last 30 minutes and the clinician cap is 2 concurrent visits, with no turnover buffer."
            - "Two visits already booked with that rheumatologist on 2026-08-03: 14:00 (running to 14:30) and 14:10 (running to 14:40)."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0002", full_name: "Pat Two", date_of_birth: "1980-09-30", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat2_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0003", full_name: "Pat Three", date_of_birth: "1968-02-02", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat3_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0004", full_name: "Pat Four", date_of_birth: "1991-11-11", diagnosis_code: "PSA", registry_consent: true }
              as: RegistryAdmin
              captures: { pat4_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat1_id}", clinician_id: "${rheum1_id}", visit_datetime: "2026-08-03T14:00:00Z", visit_type: "FOLLOW_UP" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat2_id}", clinician_id: "${rheum1_id}", visit_datetime: "2026-08-03T14:10:00Z", visit_type: "FOLLOW_UP" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { v2_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { patient_id: "${pat3_id}", clinician_id: "${rheum1_id}", visit_datetime: "2026-08-03T14:20:00Z", visit_type: "FOLLOW_UP" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { err_capacity: $.data.error_id }
            - call: "POST /visits"
              payload: { patient_id: "${pat4_id}", clinician_id: "${rheum1_id}", visit_datetime: "2026-08-03T14:40:00Z", visit_type: "FOLLOW_UP" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { v4_id: $.data.id }
          assert:
            - "Visit.${v1_id}.visit_end_datetime == \"2026-08-03T14:30:00Z\" and Visit.${v2_id}.visit_end_datetime == \"2026-08-03T14:40:00Z\""
            - "${err_capacity} == \"ERR_CLINICIAN_CAPACITY_EXCEEDED\" with HTTP 409 (14:20 lies inside both existing half-open intervals)"
            - "Visit.${v4_id}.visit_datetime == \"2026-08-03T14:40:00Z\" and visit_end_datetime == \"2026-08-03T15:10:00Z\" and status == \"SCHEDULED\""
            - "the 14:40 start does NOT overlap the 14:10 visit even though it equals its visit_end_datetime (half-open, zero buffer)"
            - "GET /visits?clinician_id=${rheum1_id} returns total_count == 3"
            - "no Visit exists for Patient ${pat3_id}: GET /visits?patient_id=${pat3_id} returns total_count == 0"

  - rule_id: compensating_invariant
    instances:
      - name: authorization_unit_conservation_across_administration_and_reversal
        grounds:
          - state_machines.InfusionAppointment.SCHEDULED_to_ADMINISTERED
          - state_machines.InfusionAppointment.ADMINISTERED_to_SCHEDULED
          - entities.Authorization.fields.units_reserved
          - entities.Authorization.fields.units_consumed
          - entities.Authorization.fields.units_remaining
        distinguishing_aspect: |
          Conserved quantity: authorization UNITS. The invariant
          approved_units == units_reserved + units_consumed + units_remaining must hold at every
          observation point. Scheduling moves 1 unit remaining -> reserved, administration moves it
          reserved -> consumed, and reverse-administration moves it consumed -> reserved; the
          triple therefore reads 0/0/6 then 1/0/5 then 0/1/5 then 1/0/5 again, each summing to 6,
          and TherapyEpisode.doses_administered plus Patient.administered_dose_total return to 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, advanced to 2026-08-12T09:00:00Z before administration."
            - "Infliximab (TNFI, IV, 150 minutes) on Meridian PPO; chair AIC-1 OPEN with a 30-minute buffer."
            - "Patient cleared for TB and hepatitis B; CMP panel collected 2026-07-25 normal; episode ACTIVE."
            - "Authorization APPROVED for 6 units valid 2026-08-01 through 2027-01-28."
            - "No assistance enrollment, so the dollar invariant is out of scope for this instance and the unit ledger is observed in isolation."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
