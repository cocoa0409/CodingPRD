            - "ar-summary ar_balance_cents == 30000 after the 20000 payment (invoice PARTIALLY_PAID)"

      - name: cascade_partial_payment_sets_partially_paid
        claim_type: cascading_side_effects
        grounds: [state_machines.Invoice.billing_status=ISSUED_to_billing_status=PARTIALLY_PAID, entities.Invoice.fields.amount_paid_cents]
