            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "SILVERADO-1998", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w1v: $.data.version }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
              captures: { o1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${o1}/perform"
              payload: { station_code: "STN-CRANK-10", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { e1: $.data.reman_engine_id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
          trigger:
            - call: "POST /reman-engines/${e1}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { err_no_test: $.data.error_id }
            - call: "POST /reman-engines/${e1}/dyno-tests"
              payload: { dyno_cell_code: "CELL-10", started_at: "2026-08-03T08:00:00Z", ended_at: "2026-08-03T09:00:00Z", horsepower: 250, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
