            - "GET /submittals?project_id=${p1} returns exactly 1 row"

      - name: auxiliary_withdrawal_returns_the_demand_ledger_to_its_exact_prior_total
        grounds:
          - state_machines.AuxiliarySystem.PROPOSED_to_WITHDRAWN
          - calculations.project_demand_ledger
          - calculations.auxiliary_system_demand
          - entities.Project.fields.total_system_demand_gpm
          - validations[priority=15]
        distinguishing_aspect: |
          The ledger is a derived aggregate, so adding a 480.0 gpm foam deluge and then withdrawing it
          must return total_system_demand_gpm to exactly 2130.0 - not 2129.9 or 2130.1 - which forces
          the implementation to RE-SUM the surviving rows at 1 dp rather than to subtract the withdrawn
          row from the running total. The withdrawn row keeps its own demand_gpm 480.0 on the record
          while dropping out of the input set, and a second withdrawal of the same terminal row is
          refused, so the compensation cannot be applied twice.
        test_recipe:
          setup:
            - "Project FP-2601 with HC-1 CONVERGED (governing_demand_gpm 1380.0) and a STANDPIPE_CLASS_I of 2 risers (750.0 gpm)"
            - "Baseline ledger: auxiliary_demand_gpm 750.0, total_system_demand_gpm 2130.0"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
