          vote_out: $.data
      assert:
      - District.${d4_id}.reserve_balance_cents == 9 (one close deposited ceil(1000/120) = 9)
      - District.${d4_id}.reserve_target_cents == 1000 (after LOAN_AMENDMENT)
      - 'Reserve withdrawal of 1 cent rejected: 9 - 1 = 8 < floor(1000 * 0.75) = 750'
      - BoardResolution.${res4c_id} adoption fails with ERR_RESERVE_COVENANT_BREACH (vote cascade rejects)
      - District.${d4_id}.reserve_balance_cents unchanged at 9 after the failed adoption
- rule_id: non_linear_state_machine
  instances:
  - name: invoice_parallel_dimensions_cure_cycle
    grounds:
    - state_machines.Invoice
    - calculations.delinquency_escalation
    - calculations.payment_waterfall
    distinguishing_aspect: 'Invoice carries two parallel state dimensions (billing_status x

      collection_status) that evolve independently, and collection_status

      is CYCLIC: an invoice at DELINQUENT -> NOTICED returns to CURRENT on

      payment in full while billing_status walks ISSUED -> PARTIALLY_PAID ->

      PAID — a non-linear machine on Invoice.

      '
    test_recipe:
      setup:
      - District+S1 adopted; member with INSTALLED tap; cycle C1 billed with invoice total 4850 (usage 4300); logical clock advanced past due+10d so invoice is DELINQUENT;
        notice issued (NOTICED)
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: D5
          usda_loan_principal_cents: 5000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          d5_id: $.data.id
      - call: POST /districts/${d5_id}/rate-schedules
        payload:
          schedule_label: S1
          base_minimum_cents: 3500
