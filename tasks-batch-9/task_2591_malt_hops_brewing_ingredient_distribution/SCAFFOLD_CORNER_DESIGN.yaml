          - validations[priority=37]
          - calculations.contract_allocation_ledger
        distinguishing_aspect: "ERR_NO_UNCOMMITTED_VOLUME is reachable on exactly one of its two declared endpoints: on the carry-forward route the priority 36 cap test fires first, because eligible_lbs collapses to min(1250, 0) == 0 and any positive request already exceeds it, so only declare-default can surface the zero-remaining code."
