            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "IN_PERSON" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/episodes/${ep_id}/alerts", payload: { severity: "ROUTINE", arrhythmia_type: "AFIB" }, as: DeviceGateway, captures: { a1_id: $.data.id } }
            - { call: "POST /v1/episodes/${ep_id}/alerts", payload: { severity: "ROUTINE", arrhythmia_type: "AFIB" }, as: DeviceGateway, captures: { a2_id: $.data.id } }
            - { call: "POST /v1/episodes/${ep_id}/alerts", payload: { severity: "ROUTINE", arrhythmia_type: "PAUSE" }, as: DeviceGateway, captures: { a3_id: $.data.id } }
            - { call: "POST /v1/alerts/${a1_id}/acknowledge", payload: {}, as: MonitoringTechnician, as_user_id: "${t_id}" }
