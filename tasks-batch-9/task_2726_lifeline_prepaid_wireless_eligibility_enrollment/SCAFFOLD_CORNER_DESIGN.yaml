  # =========================================================================
  - section: errors
    instances:

      - name: unknown_path_ids_return_the_entity_specific_not_found_code
        claim_type: error_triggerability
        grounds:
          - validations[priority=22]
          - errors[ERR_ADDRESS_NOT_FOUND]
          - errors[ERR_ELIGIBILITY_CHECK_NOT_FOUND]
          - errors[ERR_DEVICE_NOT_FOUND]
