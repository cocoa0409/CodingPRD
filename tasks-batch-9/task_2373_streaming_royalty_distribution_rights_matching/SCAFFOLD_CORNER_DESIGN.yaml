          assert:
            - "The calculate RESPONSE ITSELF already carries distributable_cents 70001, holding_cents 70000 and rounding_residual_cents 1 — no follow-up call is needed to materialise them."
            - "The immediately following read of the first usage line shows attributed_revenue_cents 52500 on the first attempt."
            - "The finalize RESPONSE ITSELF already carries status FINALIZED and residual_payee_holder_id null."
            - "The immediately following reads show the period DISTRIBUTED with total_holding_cents 70000 and the batch RECONCILED — the bubble-up and the cascade-down are both complete within the finalize request."

  - section: errors
    instances:
      - name: error_envelope_is_uniform_across_every_status_class
        claim_type: triggerability
        grounds:
          - response_envelope.error
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_FORBIDDEN_ROLE
          - errors.ERR_WORK_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_DUPLICATE_PERIOD_LABEL
          - errors.ERR_STALE_WORK_VERSION
          - errors.ERR_INVALID_EFFECTIVE_PERIOD
        distinguishing_aspect: |
          The catalogue spans seven HTTP status classes (401, 403, 404, 400, 409, 412, 422) and every
          one of them must come back in the SAME error envelope — response_type "error" with
          data.error_id and data.message and nothing else — rather than a bare string for the 401, a
          framework default for the 400, or a 500 for the 412. The 412 in particular is produced by a
          version bump the caller never requested (approval of an earlier claim), so it must be a
          clean ERR_STALE_WORK_VERSION and not an unhandled conflict.
        test_recipe:
          setup:
            - "A LABEL with direct_deal_rate_bps 800, an OPEN period 2026-06, and one RECORDING work whose version is captured at creation."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
              as: RoyaltyAdmin
              captures: { lbl: "$.data.id" }
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Midnight Ledger", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { w1: "$.data.id", v1: "$.data.version" }
          trigger:
            - name: unauthenticated_401
              call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600099", title: "No Headers" }
              as: NONE
              captures: { e401: "$.data.error_id", m401: "$.data.message" }
            - name: forbidden_role_403
              call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600098", title: "Wrong Role" }
              as: RegulatoryOfficer
              captures: { e403: "$.data.error_id", m403: "$.data.message" }
            - name: work_not_found_404
              call: "POST /royalties/rights-registrations"
              payload: { work_id: "11111111-1111-4111-8111-111111111150", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 10000, territory_set: ["WORLD"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${v1}" }
              as: RoyaltyAdmin
              captures: { e404: "$.data.error_id", m404: "$.data.message" }
            - name: invalid_request_400
              call: "POST /royalties/periods"
              payload: { label: "2026-07", usage_start: "2026-07-01" }
              as: RoyaltyAdmin
              captures: { e400: "$.data.error_id", m400: "$.data.message" }
            - name: duplicate_period_label_409
              call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-09-01", usage_end: "2026-09-30" }
              as: RoyaltyAdmin
              captures: { e409: "$.data.error_id", m409: "$.data.message" }
            - call: "POST /royalties/rights-registrations"
              payload: { work_id: "${w1}", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 10000, territory_set: ["WORLD"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${v1}" }
              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { rg1: "$.data.id" }
            - call: "POST /royalties/rights-registrations/${rg1}/review"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-review-2"
            - call: "POST /royalties/rights-registrations/${rg1}/approve"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-review-2"
            - call: "GET /royalties/works/${w1}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { v2: "$.data.version", rs: "$.data.rights_state" }
            - name: stale_work_version_412
              call: "POST /royalties/rights-registrations"
              payload: { work_id: "${w1}", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 10000, territory_set: ["FR"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${v1}" }
              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { e412: "$.data.error_id", m412: "$.data.message" }
            - name: invalid_effective_period_422
              call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-ZZ", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-01-01", effective_to: "2026-01-01" }
              as: RegulatoryOfficer
              captures: { e422: "$.data.error_id", m422: "$.data.message" }
          assert:
            - "401 / ERR_UNAUTHENTICATED for the header-less call, 403 / ERR_FORBIDDEN_ROLE for the officer, 404 / ERR_WORK_NOT_FOUND for the unknown work, 400 / ERR_INVALID_REQUEST for the missing usage_end, 409 / ERR_DUPLICATE_PERIOD_LABEL for the reused label, 412 / ERR_STALE_WORK_VERSION for the pre-approval version token, 422 / ERR_INVALID_EFFECTIVE_PERIOD for the zero-length closed interval."
            - "Every one of the seven responses has response_type \"error\" and a data object containing exactly error_id and message, both non-empty strings; none of them carries entity fields, a stack trace, or a bare-string body."
            - "The approval moved the work to rights_state REGISTERED and bumped its version, which is the only reason the replayed token is stale — the 412 is a declared error, not an unhandled conflict."
            - "No period named 2026-07 exists, exactly one period is labelled 2026-06, and only one registration row exists at the end."

      - name: error_id_walks_down_the_priority_ladder_as_each_defect_is_removed
        claim_type: triggerability
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_FORBIDDEN_ROLE
          - errors.ERR_PERIOD_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_DUPLICATE_POOL
          - validations.priority_1
          - validations.priority_5
        distinguishing_aspect: |
          A single endpoint is called six times, each time with exactly one more defect repaired, so
          the returned error_id must step through the ladder 401 -> 403 -> 404 -> 400 -> 201 -> 409
          in that order. An implementation that validates structure before authentication, or
          existence before role, produces the right set of codes in the wrong order and fails here
          even though every individual code is triggerable. Note the pool create does NOT require the
          period to be in a particular state, so no state error may appear anywhere in the ladder.
        test_recipe:
          setup:
            - "One OPEN period 2026-06 and nothing else; no rate schedule is needed because calculate is never called."
          setup_api_calls:
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id", pst: "$.data.status" }
          trigger:
            - name: rung1_no_headers_unauthenticated
              call: "POST /royalties/pools"
              payload: { period_id: "11111111-1111-4111-8111-111111111151", territory_code: "GB", subscription_tier: "INDIVIDUAL" }
              as: NONE
              captures: { r1: "$.data.error_id" }
            - name: rung2_wrong_role_forbidden
              call: "POST /royalties/pools"
              payload: { period_id: "11111111-1111-4111-8111-111111111151", territory_code: "GB", subscription_tier: "INDIVIDUAL" }
              as: RightsOpsAnalyst
              captures: { r2: "$.data.error_id" }
            - name: rung3_unknown_period_not_found
              call: "POST /royalties/pools"
              payload: { period_id: "11111111-1111-4111-8111-111111111151", territory_code: "GB", subscription_tier: "INDIVIDUAL" }
              as: RoyaltyAdmin
              captures: { r3: "$.data.error_id" }
            - name: rung4_known_period_but_missing_money_fields_invalid_request
              call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "INDIVIDUAL" }
              as: RoyaltyAdmin
              captures: { r4: "$.data.error_id" }
            - call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "INDIVIDUAL", subscriber_count: 1000, gross_revenue_cents: 1428570 }
              as: RoyaltyAdmin
              captures: { pl: "$.data.id", plst: "$.data.status", dist0: "$.data.distributable_cents" }
            - name: rung6_same_cell_again_duplicate_pool
              call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "INDIVIDUAL", subscriber_count: 999, gross_revenue_cents: 1 }
              as: RoyaltyAdmin
              captures: { r6: "$.data.error_id" }
            - call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "FAMILY", subscriber_count: 400, gross_revenue_cents: 200000 }
              as: RoyaltyAdmin
              captures: { pl2: "$.data.id" }
            - call: "GET /royalties/pools"
              payload: { period_id: "${per}" }
              as: RoyaltyAdmin
              captures: { rows: "$.data" }
          assert:
            - "Rung 1 returns 401 ERR_UNAUTHENTICATED even though the role would also have been wrong, the period unknown and the body incomplete."
            - "Rung 2 returns 403 ERR_FORBIDDEN_ROLE, Rung 3 returns 404 ERR_PERIOD_NOT_FOUND, Rung 4 returns 400 ERR_INVALID_REQUEST — one defect repaired per step, one rung down the ladder each time."
            - "Rung 5 returns 201 with status DRAFT and distributable_cents 0."
            - "Rung 6 returns 409 ERR_DUPLICATE_POOL because (period_id, territory_code, subscription_tier) repeats, and the stored pool keeps subscriber_count 1000 / gross_revenue_cents 1428570 — the rejected call overwrote nothing."
            - "The same period accepts a second pool for the FAMILY tier (201), and the period ends with exactly two pools."

      - name: statutory_floor_breach_is_triggerable
        claim_type: triggerability
        grounds: [errors.ERR_STATUTORY_RATE_FLOOR_BREACH]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / rate_floor_ratchet_beats_schedule_overlap
          rationale: "The floor-ratchet refusal is triggered there at priority 16 against a competing priority-23 overlap defect, which proves both triggerability and ordering."

      - name: claim_window_closed_is_triggerable
        claim_type: triggerability
        grounds: [errors.ERR_CLAIM_WINDOW_CLOSED]
        excluded_because:
          difficulty_instance: boundary_precision_check / claim_window_inclusive_bound_to_the_second
          rationale: "Triggered at the exact second boundary (accepted at claim_window_closes_at, refused one second later), and again in priority_pair_validation_conflict / claim_window_temporal_beats_collective_eligibility."

      - name: rate_schedule_overlap_is_triggerable
        claim_type: triggerability
        grounds: [errors.ERR_RATE_SCHEDULE_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rate_schedule_closed_interval_and_specificity_layers
          rationale: "Triggered for touching closed intervals and for genuine overlap, with the supersede_incumbent escape verified, so a separate triggerability instance would only repeat it."

      - name: evidence_rounds_exhausted_is_triggerable
        claim_type: triggerability
        grounds: [errors.ERR_EVIDENCE_ROUNDS_EXHAUSTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / registration_evidence_loop_bounded_by_round_counter
          rationale: "The bounded loop instance drives evidence_round to MAX_EVIDENCE_ROUNDS and asserts the next request-evidence call is refused, which is the only way to reach this code."

      - name: dispute_by_claimant_is_triggerable
        claim_type: triggerability
        grounds: [errors.ERR_DISPUTE_BY_CLAIMANT]
        excluded_because:
          difficulty_instance: compensating_invariant / royalty_pool_value_conservation
          rationale: "The self-dispute refusal is exercised there alongside a legitimate third-party dispute, so both the accepted and the refused branch of the claim window are covered."

      - name: settlement_exceeds_assertion_is_triggerable
        claim_type: triggerability
        grounds: [errors.ERR_SETTLEMENT_EXCEEDS_ASSERTION]
        excluded_because:
          difficulty_instance: compensating_invariant / holder_receivable_conservation
          rationale: "Both branches of the rule (UPHOLD above the asserted amount, WITHDRAW with a non-zero amount) are refused there before the conserving settlement is accepted."
