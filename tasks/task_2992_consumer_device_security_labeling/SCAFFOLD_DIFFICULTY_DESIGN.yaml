          A different entity pair whose gate reads TWO status columns of the other entity at once: the
          same display-authorization request fails while the grant is PENDING_REGISTRY/DRAFT, fails
          again while the grant is ACTIVE/WITHHELD, and succeeds only when the pair is ACTIVE/PUBLISHED
          — so an implementation that checks grant_status alone accepts the WITHHELD case.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "TIER_1 tier, ELIGIBLE SMART_SPEAKER category, five-criterion catalogue."
            - "One SMALL manufacturer with an ELIGIBLE speaker product whose assessment is APPROVED."
            - "A label grant on that product with a COMPLETE registry entry but still PENDING_REGISTRY / DRAFT."
            - "One retailer with education_materials_ack true and no display authorizations."
