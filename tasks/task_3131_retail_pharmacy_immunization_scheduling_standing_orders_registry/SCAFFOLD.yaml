# =============================================================================
# PRD Benchmark Scaffold — Retail Pharmacy Immunization Scheduling,
# Standing Orders & Registry Reporting (Walgreens-style)
#
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and §1.9 lives in
# SCAFFOLD_CORNER_DESIGN.yaml — neither key appears here.
# =============================================================================

scenario: |
  Retail Pharmacy Immunization Scheduling, Standing Orders & Registry Reporting
  (Walgreens): appointment scheduling with age and vaccine eligibility screening
  and walk-in accommodation, pharmacist authority by state including standing
  orders, protocols and minimum patient age, prescreening questionnaire, consent
  capture and contraindication review at the counter, vaccine inventory
  management by lot with refrigerator temperature monitoring and excursion
  handling, insurance adjudication under pharmacy and medical benefits with cash
  pricing fallback, immunization registry submission with jurisdiction-specific
  formats and timeliness rules, observation period staffing and adverse reaction
  response, off-site and employer clinic events with mobile inventory.

domain_name: retail-pharmacy-immunization
api_prefix: /immunization

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Tree: PharmacyStore → VaccineLot → TemperatureReading; PharmacyStore → ImmunizationAppointment
  # Cross-cutting: Patient, StateProtocol, ClinicEvent all referenced by FK from multiple entities

  state_machine_shape: branching
  # ImmunizationAppointment: SCHEDULED → {CHECKED_IN, CANCELLED, NO_SHOW, EXPIRED} → VACCINATED
  # VaccineLot: QUARANTINED ↔ RELEASED cycle via excursion resolution + RETIRED terminal
  # ImmunizationRecord × RegistrySubmission: parallel (record lifecycle) × (reporting lifecycle)

  relationship_patterns:
    - one_to_many          # Store → Lot, Store → Appointment, Appointment → RegistrySubmission
    - cross_aggregate      # Appointment references Patient, VaccineProduct, StateProtocol (across store tree)
    - polymorphic          # RegistrySubmission.payload_format is jurisdiction-polymorphic

  role_model: segregation_of_duties
  # Pharmacist screens + authorizes; Immunizer administers; Observer monitors observation window;
  # StoreManager handles cash fallback and excursions; ComplianceOfficer audits registry.

  consistency_model: immediate
  # All side effects (lot decrement, registry queueing, observation scheduling) commit atomically
  # in the same request as the state transition that triggers them.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: PharmacyStore
    parent: null
    common_fields: true
    fields:
      - { name: store_number, type: string, source: input, description: "Unique human-readable store identifier" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state where the store is licensed; determines which StateProtocol applies" }
      - { name: address_line, type: string, source: input, description: "Street address" }
      - { name: status, type: enum, source: system, default: "ACTIVE", constraints: "ACTIVE | SUSPENDED", description: "SUSPENDED stores cannot book appointments or administer vaccines" }

  - name: StateProtocol
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state this protocol governs; unique per (state_code, vaccine_product_id) pair" }
      - { name: vaccine_product_id, type: string, source: input, description: "FK -> VaccineProduct.id; which vaccine this protocol row authorizes" }
      - { name: authority_type, type: enum, source: input, constraints: "STANDING_ORDER | PROTOCOL | PRESCRIPTION_REQUIRED", description: "Legal basis for pharmacist administration; PRESCRIPTION_REQUIRED forbids walk-in and standing-order administration" }
      - { name: min_patient_age_years, type: integer, source: input, description: "Youngest patient age (in whole years) a pharmacist may immunize under this protocol" }
      - { name: max_doses_per_patient_per_day, type: integer, source: input, default: 2, description: "Cap on distinct vaccine administrations to the same patient within one calendar day" }
      - { name: registry_format, type: enum, source: input, constraints: "HL7_VXU | FLAT_FILE_CSV | STATE_API_JSON", description: "Jurisdiction-specific immunization registry message format" }
      - { name: registry_deadline_hours, type: integer, source: input, description: "Hours after administration by which a RegistrySubmission must reach ACKNOWLEDGED" }
      - { name: status, type: enum, source: system, default: "ACTIVE", constraints: "ACTIVE | RETIRED", description: "RETIRED protocols cannot authorize new appointments or administrations" }

  - name: VaccineProduct
    parent: null
    common_fields: true
    fields:
      - { name: cvx_code, type: string, source: input, description: "CDC CVX code for the vaccine type" }
      - { name: name, type: string, source: input, description: "Product display name (e.g. 'Influenza Quadrivalent')" }
      - { name: min_patient_age_years, type: integer, source: input, description: "Manufacturer minimum patient age" }
      - { name: doses_per_series, type: integer, source: input, description: "Number of doses in a complete series (1 for flu, 2 for shingles)" }
      - { name: min_interval_days, type: integer, source: input, default: 0, description: "Minimum days between successive doses of this product" }
      - { name: cash_price_cents, type: integer, source: input, description: "Cash (self-pay) price per dose when no benefit applies" }
      - { name: fridge_temp_min_c, type: number, source: input, description: "Lower bound of acceptable refrigerator temperature in Celsius" }
      - { name: fridge_temp_max_c, type: number, source: input, description: "Upper bound of acceptable refrigerator temperature in Celsius" }
      - { name: observation_minutes, type: integer, source: input, default: 15, description: "Required post-vaccination observation window in minutes (15 standard, 30 for flagged-risk patients)" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date; age is computed against the logical clock" }
      - { name: state_code, type: string, source: input, description: "Patient residence state; informational — protocol jurisdiction comes from the STORE's state" }
      - { name: allergy_flags, type: array, source: input, default: [], description: "List of known allergen codes; contraindication review matches these against vaccine excipient lists" }
      - { name: high_risk_flag, type: boolean, source: input, default: false, description: "True when the patient requires a 30-minute observation window instead of 15" }
      - { name: insurance_plan_id, type: string, source: input, description: "FK -> InsurancePlan.id; optional at registration, required before non-cash checkout" , required: false }

  - name: InsurancePlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_name, type: string, source: input, description: "Payer plan name" }
      - { name: benefit_type, type: enum, source: input, constraints: "PHARMACY | MEDICAL | BOTH", description: "Which benefit channel covers immunizations" }
      - { name: copay_cents, type: integer, source: input, description: "Patient copay under the pharmacy benefit channel" }
      - { name: coinsurance_pct, type: number, source: input, default: 0, description: "Patient coinsurance percentage under the medical benefit channel (0–100)" }
      - { name: deductible_remaining_cents, type: integer, source: input, default: 0, description: "Remaining medical-benefit deductible applied before coinsurance" }
      - { name: covered_cvx_codes, type: array, source: input, description: "List of CVX codes this plan covers at all; administration of a non-listed CVX falls to cash pricing" }

  - name: VaccineLot
    parent: PharmacyStore
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> PharmacyStore.id; the store whose refrigerator holds this lot" }
      - { name: vaccine_product_id, type: string, source: input, description: "FK -> VaccineProduct.id" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number; unique per (store_id, lot_number)" }
      - { name: expiration_date, type: string, source: input, description: "ISO 8601 date; doses cannot be administered on or after this date" }
      - { name: doses_received, type: integer, source: input, description: "Doses received into this lot" }
      - { name: doses_available, type: integer, source: computed, description: "= doses_received − administered − wasted − quarantined_unresolved; never negative" }
      - { name: status, type: enum, source: system, default: "RELEASED", constraints: "RELEASED | QUARANTINED | RETIRED", description: "QUARANTINED lots cannot be administered; RETIRED lots are terminal" }
      - { name: quarantine_reason, type: string, source: system, required: false, description: "Why the lot was quarantined (EXCURSION or MANUAL)" }
      - { name: last_excursion_severity_tier, type: enum, source: computed, required: false, constraints: "NONE | MINOR | MODERATE | SEVERE", description: "Severity tier of the most recent excursion; computed by peak-delta base variant, or recomputed by cumulative_excursion_minutes variant when released with excursion_disposition = RELEASE_OK_CUMULATIVE" }

  - name: TemperatureReading
    parent: VaccineLot
    common_fields: false
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> VaccineLot.id" }
      - { name: recorded_at, type: string, source: input, description: "ISO 8601 timestamp the reading was taken" }
      - { name: temperature_c, type: number, source: input, description: "Refrigerator temperature in Celsius" }
      - { name: is_excursion, type: boolean, source: computed, description: "True when temperature_c < product.fridge_temp_min_c or > product.fridge_temp_max_c" }
      - { name: excursion_severity_tier, type: enum, source: computed, constraints: "NONE | MINOR | MODERATE | SEVERE", description: "Peak-delta tier of this reading per excursion_severity_charge base variant; NONE when is_excursion is false" }

  - name: ImmunizationAppointment
    parent: PharmacyStore
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> PharmacyStore.id" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: vaccine_product_id, type: string, source: input, description: "FK -> VaccineProduct.id" }
      - { name: state_protocol_id, type: string, source: computed, description: "FK -> StateProtocol.id; resolved at booking from (store.state_code, vaccine_product_id)" }
      - { name: slot_start, type: string, source: input, description: "ISO 8601 appointment start; walk-ins set this equal to creation time" }
      - { name: is_walk_in, type: boolean, source: input, default: false, description: "Walk-in appointments bypass slot-availability but not eligibility or inventory checks" }
      - { name: dose_number, type: integer, source: computed, description: "1-based dose number in the patient's series for this product, computed from prior COMPLETED ImmunizationRecords" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", constraints: "SCHEDULED | CHECKED_IN | SCREENED | CONSENTED | VACCINATED | CANCELLED | NO_SHOW | EXPIRED", description: "See state machine" }
      - { name: scheduled_dose_count_today, type: integer, source: computed, default: 0, description: "Count of the patient's VACCINATED records at this store on the appointment's calendar day; gates max_doses_per_patient_per_day" }

  - name: PrescreeningQuestionnaire
    parent: ImmunizationAppointment
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: system, description: "FK -> ImmunizationAppointment.id; exactly one questionnaire per appointment" }
      - { name: answers, type: object, source: input, description: "Questionnaire answer map keyed by question code (e.g. FEVER_TODAY, PREGNANT, IMMUNOCOMPROMISED, PRIOR_ANAPHYLAXIS)" }
      - { name: contraindication_detected, type: boolean, source: computed, description: "True when any answer or patient allergy flag is a hard contraindication for the appointment's vaccine" }
      - { name: reviewed_by_pharmacist_id, type: string, source: system, required: false, description: "Opaque X-User-ID of the Pharmacist who completed contraindication review" }
      - { name: review_outcome, type: enum, source: system, required: false, constraints: "CLEARED | REFERRED_OUT", description: "CLEARED advances the appointment; REFERRED_OUT cancels it" }

  - name: ImmunizationRecord
    parent: ImmunizationAppointment
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: system, description: "FK -> ImmunizationAppointment.id" }
      - { name: patient_id, type: string, source: computed, description: "FK -> Patient.id; copied from the appointment" }
      - { name: lot_id, type: string, source: input, description: "FK -> VaccineLot.id; the lot the dose was drawn from" }
      - { name: administered_by, type: string, source: system, description: "Opaque X-User-ID of the Immunizer who administered" }
      - { name: administered_at, type: string, source: system, description: "Server logical-clock timestamp of administration" }
      - { name: dose_number, type: integer, source: computed, description: "Copied from the appointment at administration time" }
      - { name: charge_cents, type: integer, source: computed, description: "Final patient charge after benefit adjudication or cash pricing; see calculation adjudicated_charge" }
      - { name: billing_channel, type: enum, source: computed, constraints: "PHARMACY_BENEFIT | MEDICAL_BENEFIT | CASH", description: "Which channel produced charge_cents" }
      - { name: status, type: enum, source: system, default: "COMPLETED", constraints: "COMPLETED | VOIDED", description: "VOIDED when the administration is rescinded before registry submission" }

  - name: RegistrySubmission
    parent: ImmunizationRecord
    common_fields: true
    fields:
      - { name: immunization_record_id, type: string, source: system, description: "FK -> ImmunizationRecord.id; one active submission per record" }
      - { name: payload_format, type: enum, source: computed, constraints: "HL7_VXU | FLAT_FILE_CSV | STATE_API_JSON", description: "Copied from the governing StateProtocol.registry_format" }
      - { name: payload, type: string, source: computed, description: "Rendered jurisdiction-specific message body" }
      - { name: due_at, type: string, source: computed, description: "= administered_at + StateProtocol.registry_deadline_hours" }
      - { name: submitted_at, type: string, source: system, required: false, description: "Logical-clock time the submission was transmitted" }
      - { name: acknowledged_at, type: string, source: system, required: false, description: "Logical-clock time the registry acknowledged" }
      - { name: is_late, type: boolean, source: computed, description: "True when acknowledged_at > due_at (or now > due_at while unacknowledged)" }
      - { name: status, type: enum, source: system, default: "PENDING", constraints: "PENDING | SUBMITTED | ACKNOWLEDGED | REJECTED | LATE_UNRESOLVED", description: "REJECTED submissions must be corrected and re-submitted (cycle)" }

  - name: ObservationSession
    parent: ImmunizationRecord
    common_fields: true
    fields:
      - { name: immunization_record_id, type: string, source: system, description: "FK -> ImmunizationRecord.id" }
      - { name: observer_id, type: string, source: input, description: "Opaque X-User-ID of the ObservationMonitor staffing this session" }
      - { name: required_minutes, type: integer, source: computed, description: "= 30 if patient.high_risk_flag else product.observation_minutes" }
      - { name: started_at, type: string, source: system, description: "Logical-clock time observation began" }
      - { name: ended_at, type: string, source: system, required: false, description: "Logical-clock time observation ended" }
      - { name: adverse_reaction, type: boolean, source: input, default: false, description: "True when a reaction occurred during the window" }
      - { name: reaction_notes, type: string, source: input, required: false, description: "Free-text reaction description; required when adverse_reaction is true" }
      - { name: status, type: enum, source: system, default: "IN_PROGRESS", constraints: "IN_PROGRESS | COMPLETED | ESCALATED", description: "ESCALATED when adverse_reaction is true; requires incident report before close" }

  - name: ClinicEvent
    parent: PharmacyStore
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> PharmacyStore.id; sponsoring store" }
      - { name: employer_name, type: string, source: input, description: "Employer or venue hosting the off-site clinic" }
      - { name: event_start, type: string, source: input, description: "ISO 8601 event start" }
      - { name: event_end, type: string, source: input, description: "ISO 8601 event end; must be strictly after event_start and within the same calendar day" }
      - { name: mobile_lot_id, type: string, source: input, description: "FK -> VaccineLot.id; the lot checked out as mobile inventory — must be RELEASED and non-expired" }
      - { name: doses_reserved, type: integer, source: input, description: "Doses checked out from mobile_lot for this event; decrements lot availability for the event duration" }
      - { name: doses_administered, type: integer, source: computed, default: 0, description: "Doses actually administered at the event" }
      - { name: status, type: enum, source: system, default: "PLANNED", constraints: "PLANNED | ACTIVE | CLOSED | CANCELLED", description: "ACTIVE while within [event_start, event_end); CLOSED after reconciliation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: ImmunizationAppointment
    initial_state: SCHEDULED
    terminal_states: [VACCINATED, CANCELLED, NO_SHOW, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /immunization/appointments/{appointmentId}/check-in"
        actor: PharmacyTechnician | Pharmacist
        preconditions:
          - "Appointment is SCHEDULED (ERR_APPOINTMENT_NOT_SCHEDULED)"
          - "Logical clock is within [slot_start − 30min, slot_start + 60min], or appointment is_walk_in (ERR_CHECKIN_WINDOW_MISSED)"
          - "Store is ACTIVE (ERR_STORE_SUSPENDED)"
        side_effects: []

      - from: CHECKED_IN
        to: SCREENED
        trigger: "POST /immunization/appointments/{appointmentId}/questionnaire"
        actor: PharmacyTechnician
        preconditions:
          - "Appointment is CHECKED_IN (ERR_APPOINTMENT_NOT_CHECKED_IN)"
          - "No prior PrescreeningQuestionnaire exists for this appointment (ERR_QUESTIONNAIRE_ALREADY_EXISTS)"
        side_effects:
          - "PrescreeningQuestionnaire created; contraindication_detected computed from answers + patient.allergy_flags"

      - from: SCREENED
        to: CONSENTED
        trigger: "POST /immunization/appointments/{appointmentId}/review-consent"
        actor: Pharmacist
        preconditions:
          - "Appointment is SCREENED (ERR_APPOINTMENT_NOT_SCREENED)"
          - "Questionnaire.contraindication_detected is false (ERR_CONTRAINDICATION_DETECTED)"
          - "StateProtocol governing this appointment is ACTIVE (ERR_PROTOCOL_NOT_ACTIVE)"
          - "Patient age at administration date >= max(protocol.min_patient_age_years, product.min_patient_age_years) (ERR_PATIENT_UNDER_MIN_AGE)"
          - "Patient's scheduled_dose_count_today < protocol.max_doses_per_patient_per_day (ERR_DAILY_DOSE_LIMIT_REACHED)"
          - "At least one RELEASED, non-expired lot of the product exists at this store with doses_available > 0, OR appointment is attached to an ACTIVE ClinicEvent with remaining reserved doses (ERR_NO_ELIGIBLE_LOT)"
          - "Pharmacist completing review is NOT the same X-User-ID that performed check-in (segregation of duties) (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "Questionnaire.review_outcome = CLEARED, reviewed_by_pharmacist_id set"

      - from: SCREENED
        to: CANCELLED
        trigger: "POST /immunization/appointments/{appointmentId}/review-consent with outcome=REFER_OUT"
        actor: Pharmacist
        preconditions:
          - "Appointment is SCREENED (ERR_APPOINTMENT_NOT_SCREENED)"
        side_effects:
          - "Questionnaire.review_outcome = REFERRED_OUT"
          - "If a lot had been soft-held for this appointment, the hold is released (doses_available restored)"

      - from: CONSENTED
        to: VACCINATED
        trigger: "POST /immunization/appointments/{appointmentId}/administer"
        actor: Immunizer
        preconditions:
          - "Appointment is CONSENTED (ERR_APPOINTMENT_NOT_CONSENTED)"
          - "Target lot is RELEASED and not expired (ERR_LOT_NOT_ADMINISTERABLE)"
          - "Target lot.doses_available > 0 (ERR_LOT_DEPLETED)"
          - "Target lot's product matches appointment.vaccine_product_id (ERR_LOT_PRODUCT_MISMATCH)"
          - "Immunizer's X-User-ID differs from the reviewing Pharmacist's (segregation of duties) (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "ImmunizationRecord created (status COMPLETED); charge_cents computed by adjudicated_charge"
          - "VaccineLot.doses_available -= 1"
          - "RegistrySubmission created (status PENDING) with payload rendered per protocol.registry_format; due_at = administered_at + registry_deadline_hours"
          - "ObservationSession created (status IN_PROGRESS); required_minutes = 30 if patient.high_risk_flag else product.observation_minutes"
          - "If appointment attached to ClinicEvent: event.doses_administered += 1"
          - "Patient.scheduled_dose_count_today for the day increments"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /immunization/appointments/{appointmentId}/cancel"
        actor: PharmacyTechnician | Pharmacist | Patient
        preconditions:
          - "Appointment is SCHEDULED or CHECKED_IN (ERR_APPOINTMENT_NOT_CANCELLABLE)"
        side_effects: []

      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /immunization/appointments/{appointmentId}/cancel"
        actor: PharmacyTechnician | Pharmacist
        preconditions:
          - "Appointment is SCHEDULED or CHECKED_IN (ERR_APPOINTMENT_NOT_CANCELLABLE)"
        side_effects: []

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (logical clock passes slot_start + 60min with no check-in; only for non-walk-in appointments)"
        actor: system
        preconditions:
          - "Appointment is SCHEDULED and is_walk_in is false and now > slot_start + 60min"
        side_effects: []

      - from: SCHEDULED
        to: EXPIRED
        trigger: "system (logical clock passes end of appointment calendar day for walk-ins never checked in)"
        actor: system
        preconditions:
          - "Appointment is SCHEDULED and is_walk_in is true and now > end of slot_start's calendar day"
        side_effects: []

  - entity: VaccineLot
    initial_state: RELEASED
    terminal_states: [RETIRED]
    transitions:
      - from: RELEASED
        to: QUARANTINED
        trigger: "system (a TemperatureReading with is_excursion=true posts against the lot) OR POST /immunization/lots/{lotId}/quarantine (manual)"
        actor: system | StoreManager
        preconditions:
          - "Lot is RELEASED (ERR_LOT_NOT_RELEASED)"
        side_effects:
          - "quarantine_reason = EXCURSION or MANUAL"
          - "Any SCHEDULED/CHECKED_IN appointments at the store whose only eligible lot was this lot remain valid only if another RELEASED lot of the same product exists"

      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /immunization/lots/{lotId}/release"
        actor: StoreManager
        preconditions:
          - "Lot is QUARANTINED (ERR_LOT_NOT_QUARANTINED)"
          - "excursion_disposition in {RELEASE_OK, RELEASE_OK_CUMULATIVE} supplied (ERR_EXCURSION_DISPOSITION_REQUIRED)"
        side_effects:
          - "quarantine_reason cleared"
          - "Lot version increments"

      - from: QUARANTINED
        to: RETIRED
        trigger: "POST /immunization/lots/{lotId}/retire"
        actor: StoreManager
        preconditions:
          - "Lot is QUARANTINED or RELEASED (ERR_LOT_NOT_RETIRABLE)"
        side_effects:
          - "Remaining doses_available permanently written off (doses_available → 0)"
          - "If this lot is the mobile_lot of a PLANNED ClinicEvent, that event auto-cancels"

      - from: RELEASED
        to: RETIRED
        trigger: "POST /immunization/lots/{lotId}/retire"
        actor: StoreManager
        preconditions:
          - "Lot is QUARANTINED or RELEASED (ERR_LOT_NOT_RETIRABLE)"
        side_effects:
          - "Remaining doses_available permanently written off (doses_available → 0)"

  - entity: RegistrySubmission
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /immunization/registry-submissions/{submissionId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Submission is PENDING or REJECTED (ERR_SUBMISSION_NOT_SUBMITTABLE)"
          - "Parent ImmunizationRecord is COMPLETED, not VOIDED (ERR_RECORD_VOIDED)"
        side_effects:
          - "submitted_at = logical clock"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /immunization/registry-submissions/{submissionId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Submission is PENDING or REJECTED (ERR_SUBMISSION_NOT_SUBMITTABLE)"
          - "corrected_payload supplied (ERR_CORRECTED_PAYLOAD_REQUIRED)"
        side_effects:
          - "payload replaced with corrected_payload; submitted_at = logical clock"

      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /immunization/registry-submissions/{submissionId}/acknowledge"
        actor: ComplianceOfficer
        preconditions:
          - "Submission is SUBMITTED (ERR_SUBMISSION_NOT_SUBMITTED)"
        side_effects:
          - "acknowledged_at = logical clock"
          - "is_late = (acknowledged_at > due_at)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /immunization/registry-submissions/{submissionId}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Submission is SUBMITTED (ERR_SUBMISSION_NOT_SUBMITTED)"
        side_effects: []

      - from: PENDING
        to: LATE_UNRESOLVED
        trigger: "system (logical clock passes due_at while status is PENDING or REJECTED)"
        actor: system
        preconditions:
          - "now > due_at and status in {PENDING, REJECTED}"
        side_effects: []

      - from: LATE_UNRESOLVED
        to: SUBMITTED
        trigger: "POST /immunization/registry-submissions/{submissionId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Submission is LATE_UNRESOLVED (ERR_SUBMISSION_NOT_SUBMITTABLE)"
        side_effects:
          - "submitted_at = logical clock; is_late remains true permanently"

  - entity: ObservationSession
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED, ESCALATED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /immunization/observation-sessions/{sessionId}/complete"
        actor: ObservationMonitor
        preconditions:
          - "Session is IN_PROGRESS (ERR_SESSION_NOT_IN_PROGRESS)"
          - "Logical clock >= started_at + required_minutes (ERR_OBSERVATION_TOO_EARLY)"
          - "adverse_reaction is false (ERR_REACTION_MUST_ESCALATE)"
          - "Session's observer_id equals caller X-User-ID (ERR_NOT_ASSIGNED_OBSERVER)"
        side_effects:
          - "ended_at = logical clock"

      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "POST /immunization/observation-sessions/{sessionId}/escalate"
        actor: ObservationMonitor | Pharmacist
        preconditions:
          - "Session is IN_PROGRESS (ERR_SESSION_NOT_IN_PROGRESS)"
          - "adverse_reaction = true and reaction_notes non-empty supplied (ERR_REACTION_NOTES_REQUIRED)"
        side_effects:
          - "adverse_reaction = true recorded on session"
          - "An adverse-event audit flag is written to the parent ImmunizationRecord (record stays COMPLETED; registry submission unaffected)"

  - entity: ClinicEvent
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "system (logical clock enters [event_start, event_end))"
        actor: system
        preconditions:
          - "Event is PLANNED and now >= event_start and now < event_end"
        side_effects:
          - "mobile_lot.doses_available -= doses_reserved (checkout of mobile inventory)"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /immunization/clinic-events/{eventId}/cancel OR system (mobile lot retired before event start)"
        actor: StoreManager | system
        preconditions:
          - "Event is PLANNED (ERR_EVENT_NOT_CANCELLABLE)"
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /immunization/clinic-events/{eventId}/close"
        actor: StoreManager
        preconditions:
          - "Event is ACTIVE (ERR_EVENT_NOT_ACTIVE)"
          - "Logical clock >= event_end (ERR_EVENT_STILL_RUNNING)"
        side_effects:
          - "Unused reserved doses return to mobile_lot: mobile_lot.doses_available += (doses_reserved − doses_administered)"
          - "Invariant: administered doses were already decremented at administration time; the return covers only the unadministered remainder"

  - entity: PharmacyStore
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PUT /immunization/stores/{storeId}"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "All SCHEDULED appointments at this store transition to CANCELLED with reason STORE_SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "PUT /immunization/stores/{storeId}"
        actor: StoreManager
        preconditions: []
        side_effects: []

  - entity: ImmunizationRecord
    initial_state: COMPLETED
    terminal_states: [VOIDED]
    transitions:
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /immunization/immunization-records/{recordId}/void"
        actor: Pharmacist
        preconditions:
          - "Record is COMPLETED (ERR_RECORD_ALREADY_VOIDED)"
          - "Record's RegistrySubmission is still PENDING or REJECTED — a SUBMITTED or ACKNOWLEDGED submission cannot be voided back (ERR_SUBMISSION_ALREADY_TRANSMITTED)"
        side_effects:
          - "VaccineLot.doses_available += 1 (compensating restore of the administered dose; lot.version bumped)"
          - "RegistrySubmission for this record is removed from the reporting queue (row deleted; the record keeps its history)"
          - "The parent ObservationSession, if still IN_PROGRESS, transitions to COMPLETED with ended_at = logical clock (observation is moot once the dose is voided; this system transition bypasses the required_minutes floor that the manual complete endpoint enforces)"
          - "If the record was administered under a ClinicEvent, event.doses_administered -= 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: appointment-administer-stale-lot
    parent_entity: VaccineLot
    write_endpoint: "POST /immunization/appointments/{appointmentId}/administer"
    occ_field: "expected_lot_version"
    description: |
      Administering a dose from a VaccineLot whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just administered from the same lot (decrementing
      doses_available and bumping the lot version) or quarantined the lot,
      and the current writer's view of the lot is therefore stale.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: questionnaire-review-stale-appointment
    parent_entity: ImmunizationAppointment
    write_endpoint: "POST /immunization/appointments/{appointmentId}/review-consent"
    occ_field: "expected_appointment_version"
    description: |
      Completing contraindication review against an ImmunizationAppointment
      whose version has advanced since the pharmacist loaded the screening
      is rejected — e.g., the questionnaire was just replaced or the
      appointment was re-screened, so the reviewed snapshot is stale.
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: adjudicated_charge
    trigger: "ImmunizationRecord creation (administer transition)"
    algorithm: waterfall_allocation
    formula: |
      Evaluate channels in strict order; first applicable channel wins.
      Let price = product.cash_price_cents (integer cents).
      Let plan = patient.insurance_plan_id → InsurancePlan (may be absent).

      Channel 1 — PHARMACY_BENEFIT: applicable iff plan exists AND
        plan.benefit_type in {PHARMACY, BOTH} AND product.cvx_code ∈ plan.covered_cvx_codes.
        charge = min(plan.copay_cents, price).

      Channel 2 — MEDICAL_BENEFIT: applicable iff Channel 1 inapplicable AND
        plan exists AND plan.benefit_type in {MEDICAL, BOTH} AND cvx covered.
        deductible_applied = min(plan.deductible_remaining_cents, price)
        remainder = price − deductible_applied
        coinsurance_cents = floor(remainder * plan.coinsurance_pct / 100)
        charge = deductible_applied + coinsurance_cents
        Rounding: floor at the cents step, AFTER multiplying the full remainder —
        do NOT round the percentage first.

      Channel 3 — CASH: applicable iff no plan, or cvx not covered, or both
        channels inapplicable. charge = price (no discount).

      The evaluation order is pinned: pharmacy before medical before cash.
      A plan with benefit_type BOTH ALWAYS resolves to PHARMACY_BENEFIT when
      the cvx is covered, even if the medical channel would yield a lower charge.
    input_set: "patient.insurance_plan_id, InsurancePlan row, VaccineProduct row"
    constants:
      COINSURANCE_DENOMINATOR: 100
    precision: "integer cents; floor at the coinsurance multiplication step"
    variants:
      - name: provisional_quote
        when: "GET /immunization/appointments/{id}/price-quote before administration"
        difference: "Runs the same waterfall but does NOT consume the deductible: deductible_remaining_cents is treated as read-only. The quote is an estimate — the administered charge re-reads the plan row at administration time, so a plan whose deductible changed between quote and administration produces a different charge than quoted."

  - name: patient_age_years
    trigger: "appointment booking, review-consent, any eligibility check"
    algorithm: chronological
    formula: |
      age = number of whole years between patient.date_of_birth and the
      logical-clock date of the check. A patient turns N on their birthday:
      age(date) = year(date) − year(dob) − (1 if (month,day)(date) < (month,day)(dob) else 0)
      Eligibility requires age >= max(protocol.min_patient_age_years, product.min_patient_age_years).
      The comparison is >=: a patient exactly at the minimum age ON their birthday IS eligible.
      Age is evaluated at the ADMINISTRATION date (appointment slot_start's calendar day),
      not the booking date — a patient may book while underage and become eligible by slot day.
    input_set: "Patient.date_of_birth, logical clock, appointment.slot_start"
    precision: "whole years"

  - name: dose_number_in_series
    trigger: "appointment booking"
    algorithm: aggregation
    formula: |
      dose_number = 1 + count(ImmunizationRecord where patient_id = appointment.patient_id
        AND record's lot's vaccine_product_id = appointment.vaccine_product_id
        AND status = COMPLETED)
      Series completion: if dose_number > product.doses_per_series, booking is rejected
      (ERR_SERIES_ALREADY_COMPLETE).
      Interval: if dose_number >= 2, the most recent prior COMPLETED record's
      administered_at must be >= product.min_interval_days before slot_start
      (ERR_MIN_INTERVAL_NOT_MET). Ties at exactly min_interval_days ARE allowed (>=).
      Ordering of prior records: by administered_at ASC; ties broken by created_at ASC.
    input_set: "COMPLETED ImmunizationRecords for (patient, product); excludes VOIDED"
    precision: "integer"

  - name: excursion_severity_charge
    trigger: "TemperatureReading posted with is_excursion = true"
    algorithm: threshold
    formula: |
      Let delta_raw = max(0, reading.temperature_c − product.fridge_temp_max_c,
                          product.fridge_temp_min_c − reading.temperature_c) — degrees
      outside the acceptable band, taking the worse side.
      PINNED ORDER: delta_c = round_half_up(delta_raw, 2) FIRST, then tier comparison
      on the ROUNDED value. (Without this order, delta_raw = 2.004 would tier MODERATE;
      with rounding first, delta_c = 2.00 tiers MINOR. The two orders genuinely diverge.)
      The lot auto-quarantines on ANY excursion (delta_c > 0).
      Severity tier for audit reporting:
        delta_c == 0            → no excursion (reading accepted, no side effects)
        0 < delta_c <= 2.0      → tier MINOR
        2.0 < delta_c <= 5.0    → tier MODERATE
        delta_c > 5.0           → tier SEVERE
      Boundary precision: the MINOR/MODERATE boundary is > 2.0, not >= — a reading
      whose rounded delta is exactly 2.00 is MINOR; 2.01 is MODERATE.
    input_set: "TemperatureReading.temperature_c, VaccineProduct.fridge_temp_min_c/max_c"
    constants:
      MINOR_MAX_C: 2.0
      MODERATE_MAX_C: 5.0
    precision: "delta computed to 2 decimal places, round_half_up, BEFORE tier comparison"
    variants:
      - name: cumulative_excursion_minutes
        when: "Jurisdictions that grade excursion severity by total time outside the band instead of peak deviation (used when the lot's store opts into cumulative reporting via the excursion review flow)"
        difference: "Severity is computed from total excursion minutes: sum over consecutive out-of-band readings of (recorded_at[i+1] − recorded_at[i]) in minutes, tiered as <= 30 MINOR, 30–120 MODERATE, > 120 SEVERE. For identical temperature data this produces a different tier than the peak-delta base variant whenever a shallow-but-long excursion occurs."

  - name: observation_required_minutes
    trigger: "ObservationSession creation (administer transition)"
    algorithm: threshold
    formula: |
      required_minutes = 30 if patient.high_risk_flag else product.observation_minutes
      A session may complete only when logical clock >= started_at + required_minutes.
      Completion at exactly started_at + required_minutes IS allowed (>= boundary).
    input_set: "Patient.high_risk_flag, VaccineProduct.observation_minutes"
    precision: "whole minutes"

  - name: registry_lateness
    trigger: "RegistrySubmission acknowledge; system sweep of overdue PENDING/REJECTED submissions"
    algorithm: chronological
    formula: |
      due_at = record.administered_at + protocol.registry_deadline_hours (exact hour arithmetic)
      On acknowledge: is_late = (acknowledged_at > due_at) — strictly greater;
      an acknowledgement at exactly due_at is ON TIME.
      System sweep: a PENDING or REJECTED submission whose due_at < now transitions
      to LATE_UNRESOLVED. LATE_UNRESOLVED submissions may still be submitted and
      acknowledged, but is_late can never flip back to false.
    input_set: "ImmunizationRecord.administered_at, StateProtocol.registry_deadline_hours, logical clock"
    precision: "second precision on timestamps"

  - name: clinic_event_reconciliation
    trigger: "ClinicEvent close transition"
    algorithm: aggregation
    formula: |
      On ACTIVE → CLOSED:
        returned = doses_reserved − doses_administered
        mobile_lot.doses_available += returned
      Invariant (compensating): at close, mobile_lot.doses_available must equal
      (value before event activation) − doses_administered. The checkout at
      activation (doses_available −= doses_reserved) plus the return at close
      (+= returned) plus the per-administration decrements (−= 1 each) must net
      to exactly −doses_administered. A close with doses_administered >
      doses_reserved is rejected (ERR_RECONCILIATION_OVERFLOW).
    input_set: "ClinicEvent.doses_reserved, doses_administered; VaccineLot.doses_available history"
    precision: "integer doses"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles list"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-segment resource ids exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "OCC expected_*_version matches the parent entity's current version (when the endpoint declares one)"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /immunization/appointments/{appointmentId}/administer; POST /immunization/appointments/{appointmentId}/review-consent"
    note: "Version check runs BEFORE business-rule validation; error id is ERR_STALE_LOT_VERSION for administer and ERR_STALE_APPOINTMENT_VERSION for review-consent"

  - priority: 5
    category: state
    check: "Target resource in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "Contraindication: questionnaire flags or patient allergies vs vaccine → block consent"
    error_id: ERR_CONTRAINDICATION_DETECTED
    http_status: 422
    applies_to: "POST /immunization/appointments/{appointmentId}/review-consent"

  - priority: 7
    category: business_safety
    check: "Pharmacist authority: governing StateProtocol is ACTIVE and authority_type != PRESCRIPTION_REQUIRED for walk-ins; patient age >= max(protocol, product minimums)"
    error_id: ERR_PATIENT_UNDER_MIN_AGE
    http_status: 422
    applies_to: "POST /immunization/appointments; POST /immunization/appointments/{appointmentId}/review-consent"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: reviewer/administerer must differ from prior actor on the same appointment"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 409
    applies_to: "POST /immunization/appointments/{appointmentId}/review-consent; POST /immunization/appointments/{appointmentId}/administer"

  - priority: 9
    category: business_constraint
    check: "Series rules: dose_number <= doses_per_series; min_interval_days between doses"
    error_id: ERR_SERIES_ALREADY_COMPLETE
    http_status: 422
    applies_to: "POST /immunization/appointments"

  - priority: 10
    category: business_constraint
    check: "Slot overlap: non-walk-in appointments at a store must not overlap an existing SCHEDULED/CHECKED_IN appointment's [slot_start, slot_start+15min) interval (half-open; back-to-back adjacency allowed)"
    error_id: ERR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /immunization/appointments"

  - priority: 11
    category: business_temporal
    check: "Check-in window: now within [slot_start − 30min, slot_start + 60min] for non-walk-ins"
    error_id: ERR_CHECKIN_WINDOW_MISSED
    http_status: 409
    applies_to: "POST /immunization/appointments/{appointmentId}/check-in"

  - priority: 12
    category: business_temporal
    check: "Observation window elapsed: now >= started_at + required_minutes"
    error_id: ERR_OBSERVATION_TOO_EARLY
    http_status: 409
    applies_to: "POST /immunization/observation-sessions/{sessionId}/complete"

  - priority: 13
    category: business_temporal
    check: "Clinic event timing: close only at/after event_end; event_end strictly after event_start and same calendar day"
    error_id: ERR_EVENT_STILL_RUNNING
    http_status: 409
    applies_to: "POST /immunization/clinic-events/{eventId}/close; POST /immunization/clinic-events"

  - priority: 14
    category: business_referential
    check: "Lot eligibility for administration: RELEASED, unexpired, product match, doses_available > 0"
    error_id: ERR_LOT_NOT_ADMINISTERABLE
    http_status: 409
    applies_to: "POST /immunization/appointments/{appointmentId}/administer"

  - priority: 15
    category: business_fiscal
    check: "Clinic event dose reservation raw capacity: doses_reserved <= mobile_lot.doses_available at creation"
    error_id: ERR_INSUFFICIENT_DOSES
    http_status: 422
    applies_to: "POST /immunization/clinic-events"

  - priority: 16
    category: business_constraint
    check: "Mobile lot over-reservation across overlapping events: for the same mobile_lot, the sum of doses_reserved across all PLANNED or ACTIVE ClinicEvents whose [event_start, event_end) intervals overlap (closed-start, open-end; touching endpoints do NOT overlap) the new event's window must satisfy new_event.doses_reserved <= mobile_lot.doses_available − overlapping_reserved_sum. Checked only after raw capacity passes."
    error_id: ERR_MOBILE_LOT_OVER_RESERVED
    http_status: 422
    applies_to: "POST /immunization/clinic-events"

  - priority: 17
    category: business_safety
    check: "Daily dose cap: patient's administrations at this store today < protocol.max_doses_per_patient_per_day"
    error_id: ERR_DAILY_DOSE_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /immunization/appointments/{appointmentId}/review-consent"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Clock (test-driving) ---
  - method: POST
    path: "/immunization/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default is 2026-09-01T00:00:00Z; before any set call the clock reads exactly that instant and never falls back to wall-clock time."
    roles: [StoreManager, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Triggers system transitions: appointment NO_SHOW/EXPIRED sweeps, RegistrySubmission LATE_UNRESOLVED sweep, ClinicEvent PLANNED→ACTIVE activation"]

  # --- Stores ---
  - method: POST
    path: "/immunization/stores"
    description: "Register a pharmacy store"
    roles: [StoreManager]
    code: 201
    input: [store_number, state_code, address_line]
    output: PharmacyStore
    side_effects: []

  - method: GET
    path: "/immunization/stores"
    description: "List stores"
    roles: [StoreManager, Pharmacist, PharmacyTechnician, Immunizer, ComplianceOfficer, ObservationMonitor]
    code: 200
    input: ["state_code?", "status?", "limit?", "offset?"]
    output: "PharmacyStore[]"
    side_effects: []

  - method: GET
    path: "/immunization/stores/{storeId}"
    description: "Get one store"
    roles: [StoreManager, Pharmacist, PharmacyTechnician, Immunizer, ComplianceOfficer, ObservationMonitor]
    code: 200
    input: []
    output: PharmacyStore
    side_effects: []

  - method: PUT
    path: "/immunization/stores/{storeId}"
    description: "Update store (including status transitions ACTIVE ↔ SUSPENDED)"
    roles: [StoreManager]
    code: 200
    input: ["address_line?", "status?"]
    output: PharmacyStore
    side_effects: ["SUSPENDED cancels all SCHEDULED appointments at the store"]

  # --- State Protocols ---
  - method: POST
    path: "/immunization/state-protocols"
    description: "Create a state pharmacist-authority protocol row"
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, vaccine_product_id, authority_type, min_patient_age_years, registry_format, registry_deadline_hours, "max_doses_per_patient_per_day?"]
    output: StateProtocol
    side_effects: []

  - method: GET
    path: "/immunization/state-protocols"
    description: "List protocols"
    roles: [StoreManager, Pharmacist, ComplianceOfficer]
    code: 200
    input: ["state_code?", "vaccine_product_id?", "status?", "limit?", "offset?"]
    output: "StateProtocol[]"
    side_effects: []

  - method: GET
    path: "/immunization/state-protocols/{protocolId}"
    description: "Get one protocol"
    roles: [StoreManager, Pharmacist, ComplianceOfficer]
    code: 200
    input: []
    output: StateProtocol
    side_effects: []

  - method: PUT
    path: "/immunization/state-protocols/{protocolId}"
    description: "Update protocol (e.g., retire)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["min_patient_age_years?", "registry_deadline_hours?", "status?"]
    output: StateProtocol
    side_effects: []

  # --- Vaccine Products ---
  - method: POST
    path: "/immunization/vaccine-products"
    description: "Register a vaccine product"
    roles: [ComplianceOfficer]
    code: 201
    input: [cvx_code, name, min_patient_age_years, doses_per_series, cash_price_cents, fridge_temp_min_c, fridge_temp_max_c, "min_interval_days?", "observation_minutes?"]
    output: VaccineProduct
    side_effects: []

  - method: GET
    path: "/immunization/vaccine-products"
    description: "List vaccine products"
    roles: [StoreManager, Pharmacist, PharmacyTechnician, Immunizer, ComplianceOfficer, ObservationMonitor]
    code: 200
    input: ["cvx_code?", "limit?", "offset?"]
    output: "VaccineProduct[]"
    side_effects: []

  - method: GET
    path: "/immunization/vaccine-products/{productId}"
    description: "Get one vaccine product"
    roles: [StoreManager, Pharmacist, PharmacyTechnician, Immunizer, ComplianceOfficer, ObservationMonitor]
    code: 200
    input: []
    output: VaccineProduct
    side_effects: []

  # --- Insurance Plans ---
  - method: POST
    path: "/immunization/insurance-plans"
    description: "Register an insurance plan"
    roles: [ComplianceOfficer]
    code: 201
    input: [plan_name, benefit_type, copay_cents, covered_cvx_codes, "coinsurance_pct?", "deductible_remaining_cents?"]
    output: InsurancePlan
    side_effects: []

  - method: GET
    path: "/immunization/insurance-plans/{planId}"
    description: "Get one insurance plan"
    roles: [StoreManager, Pharmacist, PharmacyTechnician, ComplianceOfficer]
    code: 200
    input: []
    output: InsurancePlan
    side_effects: []

  - method: PUT
    path: "/immunization/insurance-plans/{planId}"
    description: "Update an insurance plan (e.g., deductible consumption from external claims, coverage changes)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["copay_cents?", "coinsurance_pct?", "deductible_remaining_cents?", "covered_cvx_codes?", "benefit_type?"]
    output: InsurancePlan
    side_effects: []

  # --- Patients ---
  - method: POST
    path: "/immunization/patients"
    description: "Register a patient"
    roles: [PharmacyTechnician, Pharmacist]
