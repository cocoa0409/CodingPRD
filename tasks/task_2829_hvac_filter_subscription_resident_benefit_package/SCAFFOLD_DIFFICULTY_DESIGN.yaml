          assert:
            - "the DAMAGE_WAIVER submission returns ERR_BENEFIT_NOT_ENTITLED with HTTP 422 (priority 17 wins)"
            - "the DAMAGE_WAIVER submission does NOT return ERR_OUTSIDE_COVERAGE_WINDOW even though the incident is 91 days old"
            - "no Claim row was created by the DAMAGE_WAIVER submission"
            - "the AIR_QUALITY_GUARANTEE submission — entitled, so only priority 18 is violated — returns ERR_OUTSIDE_COVERAGE_WINDOW with HTTP 422, proving the temporal rule was genuinely violated in the first call too"
