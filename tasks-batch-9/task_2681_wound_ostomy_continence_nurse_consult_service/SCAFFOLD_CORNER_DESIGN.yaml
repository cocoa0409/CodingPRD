  # ==========================================================================
  # SECTION: errors  (claim-extraction-guide Table 6 — "verify every error code
  # is triggerable"). Every 409/412/422/402 code in the catalog is already
  # triggered by a named instance in the entities / state_machines /
  # calculations / validations / endpoints sections above, or by an §1.8
  # instance cited from one of the stubs there; ERR_UNAUTHENTICATED and
  # ERR_UNAUTHORIZED are triggered in the rbac section below, and the two 412
  # stale-version codes in the cross_cutting_complexity_layers section. What
  # remains uncovered is the 404 family — eleven entity-specific codes plus the
  # two ordering rules (path before body, declared field order within the
  # body) that decide WHICH 404 comes back. Those are this section's subject.
  # ==========================================================================
  - section: errors
    instances:
      - name: unknown_path_ids_on_the_clinical_spine_return_not_found
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - errors[ERR_PATIENT_NOT_FOUND]
          - errors[ERR_NURSE_NOT_FOUND]
          - errors[ERR_CONSULT_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_CASE_NOT_FOUND]
          - endpoints[GET /patients/{patient_id}]
          - endpoints[GET /woc-nurses/{nurse_id}]
          - endpoints[GET /consult-requests/{consult_id}]
          - endpoints[GET /skin-assessments/{assessment_id}]
          - endpoints[GET /pressure-injury-cases/{case_id}]
        distinguishing_aspect: "Each of the five clinical-spine reads must answer an unknown-but-well-formed UUID with ITS OWN 404 code (ERR_PATIENT_NOT_FOUND vs ERR_NURSE_NOT_FOUND vs ERR_CONSULT_NOT_FOUND vs ERR_ASSESSMENT_NOT_FOUND vs ERR_CASE_NOT_FOUND) while a real row of the same type is present in the table, so a blanket 404 or a 200-with-null body both fail."
        test_recipe:
          setup:
            - "Unit U1 exists; Patient P1 is ADMITTED on U1; WocNurse N1 is CANDIDATE (one competency sign-off, then advanced) so it can hold an assignment."
            - "ConsultRequest C1 has been triaged and assigned to N1, and SkinAssessment A1 has been filed against it, which auto-created PressureInjuryCase K1 with classification UNDETERMINED."
            - "So every one of the five entity tables probed below is non-empty and the real id resolves; only the probed ids are unknown."
