            - { call: "POST /api/ucut-tags", payload: { block_id: "${blku}", bucket_id: "${bu}", customer_name: "Patron Y", price_cents: 6000 }, as: FarmManager, captures: { tag: $.data.id } }
          assert:
            - "non-designated block: 422 with error_id == ERR_BLOCK_NOT_UCUT"
            - "designated block: 201, UcutTag.${tag}.status == ACTIVE"
            - "B-N bucket standing_count still 10 (rejected tag claimed nothing)"

      - name: consignment_settle_requires_settlement_posture
        claim_type: cross_entity_validation
        grounds: ["state_machines.Consignment.SETTLING_to_SETTLED", "validations[priority=7]"]
