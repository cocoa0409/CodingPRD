  - section: rbac
    instances:
      - name: customer_cannot_create_product
        claim_type: peer_roles
        grounds:
          - roles.Customer
          - roles.StoreManager
          - endpoints.POST_/products
        distinguishing_aspect: "A Customer calling POST /products (a StoreManager-exclusive catalog op) is denied with ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "rb1@x.com", full_name: "RB One", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { name: "Sneaky", category: "TOPS", base_price_cents: 1000, size_min: 10, size_max: 34 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: customer_cannot_checkout_another_customers_order
        claim_type: peer_roles
        grounds:
          - roles.Customer
          - endpoints.POST_/orders/{id}/checkout
        distinguishing_aspect: "Customer B checking out Customer A's order (entity_backed ownership: X-User-ID != order.customer_id) is denied with ERR_UNAUTHORIZED."
        test_recipe:
