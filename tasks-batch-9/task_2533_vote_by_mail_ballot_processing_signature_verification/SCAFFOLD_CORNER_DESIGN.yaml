          assert:
            - "Cure issuance: HTTP 409 with data.error_id == \"ERR_ENVELOPE_SIGNATURE_STATE_INVALID\""
            - "New review round: HTTP 409 with data.error_id == \"ERR_ENVELOPE_SIGNATURE_STATE_INVALID\""
            - "GET /vote-by-mail/cure-notices?return_envelope_id=${en1} returns total_count == 0 and GET /vote-by-mail/elections/${e1} returns open_cure_count == 0"
            - "GET /vote-by-mail/signature-reviews?return_envelope_id=${en1} returns total_count == 1 and GET /vote-by-mail/return-envelopes/${en1} returns review_round_count == 1"
            - "GET /vote-by-mail/reviewers/${rv1} returns active_review_count == 0 (the refused round did not re-arm the reviewer)"

      - name: second_decision_on_the_same_review_returns_review_already_submitted
        claim_type: Idempotency
        grounds:
          - errors[ERR_REVIEW_ALREADY_SUBMITTED]
          - validations[ERR_REVIEW_ALREADY_SUBMITTED]
          - state_machines.SignatureReview.transitions.ASSIGNED_to_SUBMITTED
        distinguishing_aspect: "Replaying rv1's decision on sr1 with a different similarity_score returns 409 ERR_REVIEW_ALREADY_SUBMITTED and leaves confidence_score at the first value 0.8000, so the reviewer's counters are not double-counted."
        test_recipe:
          setup:
