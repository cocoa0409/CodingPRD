          One request violates priority 12 (category state) and priority 35 (category
          business_temporal) at the same time: the shipment is still SURVEYED and the submitted
          pickup date 2026-09-05 sits outside the spread window [2026-08-15, 2026-08-24]. The
          response must be ERR_INVALID_SHIPMENT_MOVEMENT_STATE (409), and the control call proves
          the temporal rule really is violated by returning ERR_PICKUP_OUTSIDE_SPREAD (422) once
