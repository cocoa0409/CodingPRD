# =============================================================================
# Task 2922 — Reinsurance Broker Placement & Treaty Marketing
# Seed tables (§1.0–§1.7). §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Reinsurance Broker Placement & Treaty Marketing (reinsurance intermediary):
  cedent exposure data preparation and submission packaging with actuarial
  support, program structure design across quota share, excess of loss and
  catastrophe layers, market submission, quote gathering and signing line
  allocation across reinsurers, terms negotiation on reinstatements, sublimits,
  exclusions and commission structures, binding, contract wording certainty and
  slip-to-contract documentation timelines, brokerage compensation disclosure
  and fiduciary premium handling, claims advocacy and collection support on
  disputed cessions, renewal analytics and market condition reporting.

domain_name: reinsurance-treaty-placement

# Flat topology: every entity owns a root-level collection segment
# (/programs, /layers, /quotes, ...). No shared URL namespace prefix.
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting deeper than
  # /<parent-collection>/{id}/<child-collection> for creation endpoints, and
  # every entity is readable at /<own-collection>/{id}.

  state_machine_shape: parallel
  # Program carries two independent state dimensions (placement_status ×
  # documentation_status); Quote is cyclic (COUNTERED ⇄ REQUOTED negotiation
  # rounds); Layer is compound (derived from its signing lines, with reverts);
  # ClaimAdvocacy is branching fork-join (NEGOTIATION | ARBITRATION → RESOLVED).

  relationship_patterns:
    - one_to_many          # Program → Layer → MarketSubmission → Quote
    - many_to_many         # Layer ↔ Reinsurer, materialised by SigningLine
    - self_referential     # Program.prior_program_id, FiduciaryTransaction.reverses_transaction_id
    - cross_aggregate      # SigningLine references Layer, Quote and Reinsurer

  role_model: segregation_of_duties
  # Broker-side roles are split so that the user who books a fiduciary movement
  # can never be the user who approves it; cedent and reinsurer roles are
  # entity-backed peers that may only touch their own resources.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
  collection_ordering: |
    Every collection GET returns its rows ordered by created_at ascending. The logical
    clock makes identical created_at values reachable, so the tie-break is pinned: rows
    sharing a created_at to the millisecond are returned in the server's monotonically
    increasing insertion sequence for that collection (the order in which they were
    created — equivalently ORDER BY created_at ASC, insertion_sequence ASC). The random
    id never participates in ordering. total_count is the count of rows matching the
    filters before limit/offset are applied; has_more is (offset + returned_rows) <
    total_count.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- Cedent ---
  - name: Cedent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Ceding insurer legal name", constraints: "1–120 chars, unique" }
      - { name: domicile_code, type: string, source: input, description: "Regulatory domicile, e.g. US-NY", constraints: "5 chars, uppercase" }
      - { name: financial_rating, type: enum, source: input, description: "Cedent credit rating used in renewal analytics", constraints: "A_PLUS | A | B_PLUS | B" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED blocks go-to-market on all its programs", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }
      - { name: suspension_reason, type: string, source: system, description: "Reason recorded by the last suspension call; null while ACTIVE", default: null }
      - { name: settled_receipts_minor, type: number, source: computed, description: "Sum of amount_minor over FiduciaryTransaction rows with txn_type=CEDENT_RECEIPT and status=SETTLED across all programs of this cedent" }
      - { name: outstanding_reinstatement_premium_minor, type: number, source: computed, description: "Sum of amount_minor over FiduciaryTransaction rows with txn_type=REINSTATEMENT_PREMIUM and status IN {PENDING, APPROVED} across all programs of this cedent" }

  # ------------------------------------------------------------- Reinsurer ---
  - name: Reinsurer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Reinsurer legal name — also the final deterministic tie-break key in signing-down remainder allocation", constraints: "1–120 chars, unique" }
      - { name: security_rating, type: enum, source: input, description: "Security rating of the market", constraints: "AAA | AA | A | BBB | BB" }
      - { name: capacity_limit_minor, type: number, source: input, description: "Aggregate capacity this market will expose per aggregation window, in minor currency units", constraints: "integer > 0" }
      - { name: max_line_pct, type: number, source: input, description: "Largest line this market may write on any single Layer", constraints: "0 < value <= 100, 4 decimal places" }
      - { name: lead_authorised, type: boolean, source: input, description: "Whether this market may quote as lead (is_lead=true)", default: false }
      - { name: security_status, type: enum, source: system, description: "APPROVED | RESTRICTED | SUSPENDED — set by ComplianceOfficer; RESTRICTED may follow but not lead, SUSPENDED may not receive submissions", default: APPROVED, constraints: "APPROVED | RESTRICTED | SUSPENDED" }
      - { name: committed_capacity_minor, type: number, source: computed, description: "Per calculations.reinsurer_aggregate_capacity variant LIFETIME_TOTAL — capacity tied up by SigningLine rows in status IN {PROVISIONAL, SIGNED, BOUND} across every program; the firm-order capacity gate instead uses variant WINDOWED_AT_FIRM_ORDER" }
      - { name: available_capacity_minor, type: number, source: computed, description: "= capacity_limit_minor - committed_capacity_minor" }

  # --------------------------------------------------------------- Program ---
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: cedent_id, type: string, source: input, description: "FK -> Cedent.id; the ceding insurer this treaty program is placed for" }
      - { name: prior_program_id, type: string, source: input, description: "FK -> Program.id; the expiring program of the same cedent and line_of_business whose underwriting_year is exactly one less — null for a first-time placement", default: null }
      - { name: program_name, type: string, source: input, description: "Treaty program label", constraints: "1–120 chars" }
      - { name: line_of_business, type: enum, source: input, description: "Treaty class", constraints: "PROPERTY | CASUALTY | MARINE | MOTOR" }
      - { name: underwriting_year, type: integer, source: input, description: "Underwriting year of account", constraints: "2020 <= value <= 2035" }
      - { name: inception_date, type: datetime, source: input, description: "Treaty inception instant (ISO 8601 UTC, three fractional digits); interval [inception_date, expiry_date) is half-open" }
      - { name: expiry_date, type: datetime, source: input, description: "Treaty expiry instant; must be strictly after inception_date" }
      - { name: currency_code, type: string, source: input, description: "Settlement currency", default: "USD", constraints: "3 chars, uppercase" }
      - { name: estimated_premium_income_minor, type: number, source: input, description: "Cedent-declared EPI for the whole program, minor units", constraints: "integer > 0" }
      - { name: brokerage_pct, type: number, source: input, description: "Brokerage retained by the intermediary on each signing line's share of premium", default: 2.5000, constraints: "0 <= value <= 10, 4 decimal places" }
      - { name: signdown_method, type: enum, source: input, description: "Which variant of calculations.signing_down_allocation applies when a Layer is oversubscribed", default: PRO_RATA, constraints: "PRO_RATA | LEAD_PROTECTED" }
      - { name: placement_status, type: enum, source: system, description: "Placement dimension — DRAFT | SUBMISSION_READY | IN_MARKET | FIRM_ORDER | BOUND | SETTLED | WITHDRAWN", default: DRAFT, constraints: "DRAFT | SUBMISSION_READY | IN_MARKET | FIRM_ORDER | BOUND | SETTLED | WITHDRAWN" }
      - { name: documentation_status, type: enum, source: system, description: "Documentation dimension, evolves independently of placement_status — NOT_STARTED | SLIP_ISSUED | WORDING_DRAFTED | WORDING_AGREED | EXECUTED | CERTAINTY_BREACHED", default: NOT_STARTED, constraints: "NOT_STARTED | SLIP_ISSUED | WORDING_DRAFTED | WORDING_AGREED | EXECUTED | CERTAINTY_BREACHED" }
      - { name: contract_certainty_deadline, type: datetime, source: computed, description: "= inception_date + CONTRACT_CERTAINTY_DAYS (30) days; the instant by which documentation_status must have reached WORDING_AGREED" }
      - { name: disclosure_acknowledged, type: boolean, source: computed, description: "true once a BrokerageDisclosure of this program reaches status=ACKNOWLEDGED", default: false }
      - { name: gross_written_premium_minor, type: number, source: computed, description: "Sum of Layer.quoted_gross_premium_minor over this program's layers with status=BOUND; 0 before binding" }
      - { name: brokerage_earned_minor, type: number, source: computed, description: "Per calculations.brokerage_and_net_remittance — rounded per signing line, then summed" }
      - { name: net_remittance_minor, type: number, source: computed, description: "Per calculations.brokerage_and_net_remittance — sum of per-signing-line net amounts owed to markets" }
      - { name: rounding_residue_minor, type: number, source: computed, description: "= gross_written_premium_minor - (brokerage_earned_minor + net_remittance_minor); the cents the per-line rounding order leaves in the fiduciary account" }
      - { name: fiduciary_holding_minor, type: number, source: computed, description: "Per calculations.fiduciary_holding — inflows minus outflows over this program's FiduciaryTransaction rows in status IN {SETTLED, REVERSED}; the settle-time balance check keeps it from going negative" }
      - { name: withdrawal_reason, type: string, source: system, description: "Reason captured when placement_status became WITHDRAWN; null otherwise", default: null }

  # ---------------------------------------------------- ExposureSubmission ---
  - name: ExposureSubmission
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; the program this exposure package supports" }
      - { name: package_label, type: string, source: input, description: "Submission package label", constraints: "1–80 chars" }
      - { name: exposure_records_count, type: integer, source: input, description: "Number of exposure records supplied by the cedent", constraints: "integer >= 0" }
      - { name: data_quality_flags_count, type: integer, source: input, description: "Records flagged by the data-quality scrub", constraints: "0 <= value <= exposure_records_count" }
      - { name: historical_years_supplied, type: integer, source: input, description: "Years of loss history supplied", constraints: "0 <= value <= 20" }
      - { name: cat_model_version, type: string, source: input, description: "Catastrophe model version used for the exposure run", constraints: "1–40 chars" }
      - { name: loss_history_completeness_pct, type: number, source: input, description: "Actuarial assessment of loss-history completeness", constraints: "0 <= value <= 100, 4 decimal places" }
      - { name: actuarial_report_attached, type: boolean, source: input, description: "Whether the signed actuarial support report is attached", default: false }
      - { name: completeness_score, type: number, source: computed, description: "Per calculations.submission_completeness_score, 2 decimal places" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTUARY_REVIEW | SIGNED_OFF | REJECTED | SUPERSEDED", default: DRAFT, constraints: "DRAFT | ACTUARY_REVIEW | SIGNED_OFF | REJECTED | SUPERSEDED" }
      - { name: actuary_signoff_user_id, type: string, source: system, description: "X-User-ID of the BrokerActuary who signed off; null until SIGNED_OFF", default: null }
      - { name: signed_off_at, type: datetime, source: system, description: "Logical-clock instant of sign-off; null until SIGNED_OFF", default: null }
      - { name: review_note, type: string, source: system, description: "Note supplied with the last sign-off decision", default: null }

  # ----------------------------------------------------------------- Layer ---
  - name: Layer
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; the program whose structure this layer belongs to" }
      - { name: layer_label, type: string, source: input, description: "Structure label, e.g. 'Cat XL 10xs20'", constraints: "1–80 chars" }
      - { name: layer_type, type: enum, source: input, description: "QUOTA_SHARE | EXCESS_OF_LOSS | CATASTROPHE", constraints: "QUOTA_SHARE | EXCESS_OF_LOSS | CATASTROPHE" }
      - { name: attachment_minor, type: number, source: input, description: "Retention beneath the layer, minor units; must be 0 for QUOTA_SHARE and > 0 otherwise", constraints: "integer >= 0" }
      - { name: limit_minor, type: number, source: input, description: "Layer limit per occurrence, minor units", constraints: "integer > 0" }
      - { name: cession_pct, type: number, source: input, description: "Quota-share cession percentage; must be 0 for EXCESS_OF_LOSS and CATASTROPHE", default: 0.0000, constraints: "0 <= value <= 100, 4 decimal places" }
      - { name: base_rate_pct, type: number, source: input, description: "Rate applied to subject_premium_base_minor before loadings; must equal cession_pct for QUOTA_SHARE", constraints: "0 < value <= 100, 4 decimal places" }
      - { name: subject_premium_base_minor, type: number, source: input, description: "Premium base the rate applies to, minor units", constraints: "integer > 0" }
      - { name: expected_loss_cost_minor, type: number, source: input, description: "Actuarial expected loss cost for the layer, minor units", constraints: "integer >= 0" }
      - { name: reinstatements_total, type: integer, source: input, description: "Number of reinstatements purchased", default: 0, constraints: "0 <= value <= 5" }
      - { name: reinstatement_premium_pct, type: number, source: input, description: "Reinstatement premium as a percentage of layer premium, pro rata as to amount", default: 100.0000, constraints: "0 <= value <= 200, 4 decimal places" }
      - { name: sublimit_minor, type: number, source: input, description: "Per-event sublimit; 0 means no sublimit and the full limit_minor applies", default: 0, constraints: "0 <= value <= limit_minor" }
      - { name: ceding_commission_pct, type: number, source: input, description: "Provisional ceding commission on quota-share business; 0 for excess layers", default: 0.0000, constraints: "0 <= value <= 60, 4 decimal places" }
      - { name: excluded_perils, type: array, source: input, description: "Peril exclusions agreed on the slip; enum members TERROR, CYBER, FLOOD, NUCLEAR, WAR", default: [] }
      - { name: quoted_gross_premium_minor, type: number, source: computed, description: "Per calculations.layer_technical_premium; recomputed only while Layer.status=OPEN" }
      - { name: written_line_total_pct, type: number, source: computed, description: "Sum of SigningLine.written_line_pct over lines of this layer with status IN {PROVISIONAL, SIGNED, BOUND}", default: 0.0000 }
      - { name: signed_line_total_pct, type: number, source: computed, description: "Sum of SigningLine.signed_line_pct over lines of this layer with status IN {SIGNED, BOUND}", default: 0.0000 }
      - { name: limit_eroded_minor, type: number, source: computed, description: "Cumulative ceded loss charged against limit_minor * (1 + reinstatements_total)", default: 0 }
      - { name: reinstatements_used, type: integer, source: computed, description: "Reinstatements consumed by erosion so far", default: 0 }
      - { name: incurred_ceded_minor, type: number, source: computed, description: "Sum of ClaimAdvocacy.ceded_claim_minor over this layer's advocacies with status IN {RESOLVED, COLLECTED}", default: 0 }
      - { name: loss_ratio_pct, type: number, source: computed, description: "= round_half_up(100 * incurred_ceded_minor / quoted_gross_premium_minor, 4); null until the program is settled", default: null }
      - { name: provisional_ceding_commission_minor, type: number, source: computed, description: "Per calculations.ceding_commission_settlement variant PROVISIONAL_FLAT; set when the layer becomes BOUND", default: null }
      - { name: final_ceding_commission_minor, type: number, source: computed, description: "Per calculations.ceding_commission_settlement variant FINAL_SLIDING; set when the program is settled", default: null }
      - { name: ceding_commission_delta_minor, type: number, source: computed, description: "= final_ceding_commission_minor - provisional_ceding_commission_minor; null until settlement", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | IN_MARKET | PARTIALLY_PLACED | FULLY_PLACED | OVERSUBSCRIBED | SIGNED_DOWN | BOUND | LAPSED — compound, derived from its signing lines", default: OPEN, constraints: "OPEN | IN_MARKET | PARTIALLY_PLACED | FULLY_PLACED | OVERSUBSCRIBED | SIGNED_DOWN | BOUND | LAPSED" }

  # ---------------------------------------------------- MarketSubmission ---
  - name: MarketSubmission
    parent: Layer
    common_fields: true
    fields:
      - { name: layer_id, type: string, source: system, description: "FK -> Layer.id; the layer offered to the market" }
      - { name: reinsurer_id, type: string, source: input, description: "FK -> Reinsurer.id; the market the submission is sent to" }
      - { name: response_deadline, type: datetime, source: input, description: "Instant by which the market must respond; must be strictly after the logical clock at submission time" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the BrokerPlacementLead who released the submission" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock instant the submission was released" }
      - { name: status, type: enum, source: system, description: "SENT | QUOTED | DECLINED | CLOSED | EXPIRED", default: SENT, constraints: "SENT | QUOTED | DECLINED | CLOSED | EXPIRED" }

  # ----------------------------------------------------------------- Quote ---
  - name: Quote
    parent: MarketSubmission
    common_fields: true
    fields:
      - { name: market_submission_id, type: string, source: system, description: "FK -> MarketSubmission.id; the submission this quote answers" }
      - { name: layer_id, type: string, source: system, description: "FK -> Layer.id; copied from the market submission at creation" }
      - { name: reinsurer_id, type: string, source: system, description: "FK -> Reinsurer.id; copied from the market submission at creation" }
      - { name: offered_line_pct, type: number, source: input, description: "Line the market offers to write on the layer", constraints: "0 < value <= 100, 4 decimal places" }
      - { name: quoted_rate_pct, type: number, source: input, description: "Rate on line / ceded rate the market quotes", constraints: "0 < value <= 100, 4 decimal places" }
      - { name: ceding_commission_pct, type: number, source: input, description: "Ceding commission the market offers", constraints: "0 <= value <= 60, 4 decimal places" }
      - { name: reinstatements_offered, type: integer, source: input, description: "Reinstatements the market grants", constraints: "0 <= value <= 5" }
      - { name: sublimit_minor, type: number, source: input, description: "Per-event sublimit the market insists on; 0 means none", constraints: "integer >= 0" }
      - { name: additional_exclusions, type: array, source: input, description: "Extra exclusions the market attaches; enum members TERROR, CYBER, FLOOD, NUCLEAR, WAR", default: [] }
      - { name: is_lead, type: boolean, source: input, description: "Whether this is the lead quote; only a Reinsurer with lead_authorised=true and security_status=APPROVED may set it", default: false }
      - { name: expires_at, type: datetime, source: input, description: "Instant the quote lapses if not firm-ordered; must be strictly after the logical clock at quote time" }
      - { name: negotiation_round, type: integer, source: system, description: "Incremented on every broker counter; capped by MAX_NEGOTIATION_ROUNDS", default: 0 }
      - { name: last_counter_note, type: string, source: system, description: "Note from the most recent broker counter", default: null }
      - { name: accepted_line_pct, type: number, source: system, description: "Line the broker firm-ordered; null until status=FIRM_ORDER", default: null }
      - { name: status, type: enum, source: system, description: "QUOTED | COUNTERED | REQUOTED | FIRM_ORDER | DECLINED | LAPSED | BOUND", default: QUOTED, constraints: "QUOTED | COUNTERED | REQUOTED | FIRM_ORDER | DECLINED | LAPSED | BOUND" }

  # ----------------------------------------------------------- SigningLine ---
  - name: SigningLine
    parent: Layer
    common_fields: true
    fields:
      - { name: layer_id, type: string, source: system, description: "FK -> Layer.id; the layer this line is written on" }
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; the firm-ordered quote this line materialises" }
      - { name: reinsurer_id, type: string, source: system, description: "FK -> Reinsurer.id; the market writing the line" }
      - { name: written_line_pct, type: number, source: system, description: "Line as firm-ordered, copied from Quote.accepted_line_pct; never mutated after creation", constraints: "0 < value <= 100, 4 decimal places" }
      - { name: signed_line_pct, type: number, source: computed, description: "Line after signing down; null until the layer is signed down or bound at written terms", default: null }
      - { name: effective_line_pct, type: number, source: computed, description: "= signed_line_pct when signed_line_pct is not null, else written_line_pct" }
      - { name: committed_capacity_minor, type: number, source: computed, description: "= round_half_up(Layer.limit_minor * effective_line_pct / 100)" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | SIGNED | BOUND | RELEASED", default: PROVISIONAL, constraints: "PROVISIONAL | SIGNED | BOUND | RELEASED" }
      - { name: release_reason, type: enum, source: system, description: "WITHDRAWN_BY_BROKER | SECURITY_FAILURE | SIGNDOWN_ZEROED | PROGRAM_WITHDRAWN; null unless status=RELEASED", default: null, constraints: "WITHDRAWN_BY_BROKER | SECURITY_FAILURE | SIGNDOWN_ZEROED | PROGRAM_WITHDRAWN" }

  # ------------------------------------------------------ ContractDocument ---
  - name: ContractDocument
    parent: Program
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; the program the document belongs to" }
      - { name: document_type, type: enum, source: input, description: "SLIP | WORDING_DRAFT | AGREED_WORDING | EXECUTED_CONTRACT", constraints: "SLIP | WORDING_DRAFT | AGREED_WORDING | EXECUTED_CONTRACT" }
      - { name: wording_reference, type: string, source: input, description: "Market wording reference, e.g. 'NMA2962'", constraints: "1–60 chars" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant the document was filed; append-only, never mutated" }
      - { name: days_from_inception, type: integer, source: computed, description: "= floor((issued_at - Program.inception_date) / 86400 seconds); negative when filed before inception" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the BrokerPlacementLead who filed the document" }

  # --------------------------------------------------- BrokerageDisclosure ---
  - name: BrokerageDisclosure
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; the program whose compensation is disclosed" }
      - { name: brokerage_pct, type: number, source: input, description: "Brokerage disclosed to the cedent; must equal Program.brokerage_pct at disclosure time", constraints: "0 <= value <= 10, 4 decimal places" }
      - { name: contingent_commission_pct, type: number, source: input, description: "Contingent / profit commission received from markets", default: 0.0000, constraints: "0 <= value <= 10, 4 decimal places" }
      - { name: market_service_fee_minor, type: number, source: input, description: "Flat market-service fee retained by the intermediary, minor units", default: 0, constraints: "integer >= 0" }
      - { name: disclosed_by_user_id, type: string, source: system, description: "X-User-ID of the BrokerAccountant who released the disclosure", default: null }
      - { name: acknowledged_by_user_id, type: string, source: system, description: "X-User-ID of the acknowledging CedentUnderwriter; equals Program.cedent_id", default: null }
      - { name: decision_note, type: string, source: system, description: "Note supplied with the cedent's decision", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | DISCLOSED | ACKNOWLEDGED | REJECTED", default: DRAFT, constraints: "DRAFT | DISCLOSED | ACKNOWLEDGED | REJECTED" }

  # -------------------------------------------------- FiduciaryTransaction ---
  - name: FiduciaryTransaction
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; the program whose fiduciary account is moved" }
      - { name: signing_line_id, type: string, source: input, description: "FK -> SigningLine.id; required for REINSURER_REMITTANCE, REINSTATEMENT_PREMIUM and CLAIM_COLLECTION, forbidden otherwise", default: null }
      - { name: reverses_transaction_id, type: string, source: input, description: "FK -> FiduciaryTransaction.id; set only on system-created REMITTANCE_REVERSAL rows", default: null }
      - { name: txn_type, type: enum, source: input, description: "CEDENT_RECEIPT | CLAIM_COLLECTION | REMITTANCE_REVERSAL (inflows) | REINSURER_REMITTANCE | BROKERAGE_DEDUCTION | REINSTATEMENT_PREMIUM | CEDENT_PAYOUT (outflows)", constraints: "CEDENT_RECEIPT | CLAIM_COLLECTION | REMITTANCE_REVERSAL | REINSURER_REMITTANCE | BROKERAGE_DEDUCTION | REINSTATEMENT_PREMIUM | CEDENT_PAYOUT" }
      - { name: amount_minor, type: number, source: input, description: "Absolute movement in minor units; direction is implied by txn_type", constraints: "integer > 0" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the booking user; compared against the approver for segregation of duties" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving user (a ComplianceOfficer, or a BrokerAccountant other than the booker); null until APPROVED", default: null }
      - { name: value_date, type: datetime, source: system, description: "Logical-clock instant the movement settled; null until SETTLED", default: null }
      - { name: hold_reason, type: string, source: system, description: "Reason the movement was placed on HELD by the documentation checkpoint", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | SETTLED | HELD | REVERSED", default: PENDING, constraints: "PENDING | APPROVED | SETTLED | HELD | REVERSED" }

  # ---------------------------------------------------------- ClaimAdvocacy ---
  - name: ClaimAdvocacy
    parent: Layer
    common_fields: true
    fields:
      - { name: layer_id, type: string, source: system, description: "FK -> Layer.id; the layer the loss is ceded to" }
      - { name: claim_reference, type: string, source: input, description: "Cedent claim reference", constraints: "1–60 chars, unique per layer" }
      - { name: event_date, type: datetime, source: input, description: "Loss event instant; must fall inside [Program.inception_date, Program.expiry_date)" }
      - { name: gross_claim_minor, type: number, source: input, description: "Cedent ground-up gross loss, minor units", constraints: "integer > 0" }
      - { name: ceded_claim_minor, type: number, source: computed, description: "Per calculations.claim_cession_waterfall; the amount ceded to this layer" }
      - { name: disputed_minor, type: number, source: computed, description: "Per calculations.claim_cession_waterfall — full disputed_minor for disputes in status RAISED or UPHELD, plus (disputed_minor - settled_minor) for SETTLED_PARTIAL disputes; WITHDRAWN disputes contribute 0", default: 0 }
      - { name: collected_minor, type: number, source: computed, description: "Sum of amount_minor over FiduciaryTransaction rows with txn_type=CLAIM_COLLECTION linked to this advocacy's signing lines and status IN {PENDING, APPROVED, SETTLED}", default: 0 }
      - { name: collectible_minor, type: number, source: computed, description: "= ceded_claim_minor - disputed_minor, floored at 0" }
      - { name: advocacy_route, type: enum, source: system, description: "NEGOTIATION | ARBITRATION; null until a route is chosen", default: null, constraints: "NEGOTIATION | ARBITRATION" }
      - { name: arbitration_cost_minor, type: number, source: computed, description: "= round_half_up(ceded_claim_minor * ARBITRATION_COST_PCT / 100) when advocacy_route=ARBITRATION, else 0", default: 0 }
      - { name: reinstatement_triggered, type: boolean, source: computed, description: "true when this cession consumed at least one reinstatement of the layer", default: false }
      - { name: status, type: enum, source: system, description: "NOTIFIED | UNDER_REVIEW | DISPUTED | ADVOCACY_NEGOTIATION | ADVOCACY_ARBITRATION | RESOLVED | COLLECTED | WITHDRAWN", default: NOTIFIED, constraints: "NOTIFIED | UNDER_REVIEW | DISPUTED | ADVOCACY_NEGOTIATION | ADVOCACY_ARBITRATION | RESOLVED | COLLECTED | WITHDRAWN" }

  # --------------------------------------------------------- CessionDispute ---
  - name: CessionDispute
    parent: ClaimAdvocacy
    common_fields: true
    fields:
      - { name: claim_advocacy_id, type: string, source: system, description: "FK -> ClaimAdvocacy.id; the advocacy file the dispute sits on" }
      - { name: signing_line_id, type: string, source: input, description: "FK -> SigningLine.id; the disputing market's line, which must belong to the advocacy's layer" }
      - { name: disputed_minor, type: number, source: input, description: "Amount of the cession the market disputes, minor units", constraints: "integer > 0" }
      - { name: dispute_reason, type: enum, source: input, description: "EXCLUSION_APPLIES | LATE_NOTIFICATION | AGGREGATION_DISAGREEMENT | WORDING_AMBIGUITY", constraints: "EXCLUSION_APPLIES | LATE_NOTIFICATION | AGGREGATION_DISAGREEMENT | WORDING_AMBIGUITY" }
      - { name: settled_minor, type: number, source: computed, description: "Amount conceded by the market on resolution", default: 0 }
      - { name: resolution_note, type: string, source: system, description: "Note captured at resolution", default: null }
      - { name: status, type: enum, source: system, description: "RAISED | UPHELD | WITHDRAWN | SETTLED_PARTIAL", default: RAISED, constraints: "RAISED | UPHELD | WITHDRAWN | SETTLED_PARTIAL" }

  # ---------------------------------------------------------- RenewalReport ---
  - name: RenewalReport
    parent: Program
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; the renewing program the report is generated for" }
      - { name: current_rate_on_line_pct, type: number, source: computed, description: "Per calculations.renewal_analytics; 4 decimal places" }
      - { name: prior_rate_on_line_pct, type: number, source: computed, description: "Per calculations.renewal_analytics on Program.prior_program_id; 4 decimal places" }
      - { name: rate_change_pct, type: number, source: computed, description: "Nominal rate movement, 2 decimal places" }
      - { name: exposure_change_pct, type: number, source: computed, description: "Change in total bound limit, 2 decimal places" }
      - { name: risk_adjusted_rate_change_pct, type: number, source: computed, description: "= round_half_up(rate_change_pct - exposure_change_pct * EXPOSURE_ELASTICITY, 2), computed from the already-rounded inputs" }
      - { name: placement_efficiency_pct, type: number, source: computed, description: "Signed capacity as a percentage of offered capacity, 2 decimal places" }
      - { name: market_condition_index, type: number, source: computed, description: "= round_half_up(0.6 * risk_adjusted_rate_change_pct + 0.4 * (100 - placement_efficiency_pct), 2)" }
      - { name: generated_by_user_id, type: string, source: system, description: "X-User-ID of the BrokerActuary who generated the report" }
      - { name: as_of, type: datetime, source: system, description: "Logical-clock instant the report was generated; append-only" }

# =============================================================================
# §1.2 State Machine Table
# Program carries TWO independent dimensions (placement_status ×
# documentation_status); each is declared as its own machine with an explicit
# `state_field:`.
# =============================================================================
state_machines:

  # ------------------------------------------- Program / placement_status ---
  - entity: Program
    state_field: placement_status
    initial_state: DRAFT
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMISSION_READY
        trigger: "system cascade from POST /exposure-submissions/{submission_id}/signoff with decision=SIGNED_OFF"
        actor: system
        preconditions:
          - "the signed-off ExposureSubmission.program_id equals this Program.id"
          - "Program.placement_status == DRAFT"
        side_effects:
          - "Program.placement_status = SUBMISSION_READY"
          - "every other ExposureSubmission of this program with status == SIGNED_OFF becomes SUPERSEDED"
          - "increments Program.version by 1"
        note: "Bubble-up: the actuary's sign-off, not a broker action, opens the marketing window."

      - from: SUBMISSION_READY
        to: IN_MARKET
        trigger: "POST /programs/{program_id}/go-to-market"
        actor: BrokerPlacementLead
        preconditions:
          - "Cedent.status == ACTIVE for Program.cedent_id"
          - "at least one Layer of this program has status == OPEN"
          - "Program.documentation_status == NOT_STARTED"
        side_effects:
          - "Program.placement_status = IN_MARKET"
          - "increments Program.version by 1"

      - from: IN_MARKET
        to: FIRM_ORDER
        trigger: "system cascade from POST /quotes/{quote_id}/firm-order (third hop of the firm-order cascade)"
        actor: system
        preconditions:
          - "every Layer of this program with status != LAPSED has status IN {FULLY_PLACED, OVERSUBSCRIBED}"
        side_effects:
          - "Program.placement_status = FIRM_ORDER"
          - "every Quote on this program's layers with status IN {QUOTED, COUNTERED, REQUOTED} becomes LAPSED"
          - "every MarketSubmission on this program's layers with status IN {SENT, QUOTED} becomes CLOSED"
          - "increments Program.version by 1"
        note: "Fourth hop of the firm-order cascade (quote LAPSED / submission CLOSED) is caused by this Program transition, not by the original firm-order call."

      - from: FIRM_ORDER
        to: IN_MARKET
        trigger: "system revert cascade from POST /signing-lines/{signing_line_id}/release or POST /reinsurers/{reinsurer_id}/security-status with security_status=SUSPENDED"
        actor: system
        preconditions:
          - "after the releasing hop, at least one Layer of this program has status IN {IN_MARKET, PARTIALLY_PLACED}"
        side_effects:
          - "Program.placement_status = IN_MARKET"
          - "increments Program.version by 1"
        note: "Third hop of the security-suspension cascade; already-LAPSED quotes are NOT revived."

      - from: FIRM_ORDER
        to: BOUND
        trigger: "POST /programs/{program_id}/bind"
        actor: BrokerPlacementLead
        preconditions:
          - "Program.disclosure_acknowledged == true"
          - "every Layer of this program with status != LAPSED has status IN {FULLY_PLACED, SIGNED_DOWN}"
        side_effects:
          - "every Layer with status IN {FULLY_PLACED, SIGNED_DOWN} becomes BOUND"
          - "every SigningLine of those layers with status == PROVISIONAL gets signed_line_pct = written_line_pct and becomes BOUND"
          - "every SigningLine of those layers with status == SIGNED becomes BOUND"
          - "every Quote with status == FIRM_ORDER on those layers becomes BOUND"
          - "recompute Program.gross_written_premium_minor, brokerage_earned_minor, net_remittance_minor and rounding_residue_minor per calculations.brokerage_and_net_remittance"
          - "set Layer.provisional_ceding_commission_minor per calculations.ceding_commission_settlement variant PROVISIONAL_FLAT on every BOUND layer with layer_type == QUOTA_SHARE"
          - "Program.placement_status = BOUND"
          - "increments Program.version by 1"

      - from: BOUND
        to: SETTLED
        trigger: "POST /programs/{program_id}/settle"
        actor: BrokerAccountant
        preconditions:
          - "Program.documentation_status IN {WORDING_AGREED, EXECUTED}"
          - "no FiduciaryTransaction of this program has status IN {PENDING, APPROVED, HELD}"
        side_effects:
          - "for every BOUND Layer: set loss_ratio_pct and incurred_ceded_minor"
          - "for every BOUND Layer with layer_type == QUOTA_SHARE: set final_ceding_commission_minor per calculations.ceding_commission_settlement variant FINAL_SLIDING and ceding_commission_delta_minor = final - provisional"
          - "Program.placement_status = SETTLED"
          - "increments Program.version by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /programs/{program_id}/withdraw"
        actor: BrokerPlacementLead
        preconditions: ["Program.placement_status IN {DRAFT, SUBMISSION_READY, IN_MARKET, FIRM_ORDER}"]
        side_effects:
          - "Program.withdrawal_reason = request reason"
          - "Program.placement_status = WITHDRAWN"
          - "increments Program.version by 1"

      - from: IN_MARKET
        to: WITHDRAWN
        trigger: "POST /programs/{program_id}/withdraw"
        actor: BrokerPlacementLead
        preconditions: ["Program.placement_status IN {DRAFT, SUBMISSION_READY, IN_MARKET, FIRM_ORDER}"]
        side_effects:
          - "every Layer of this program with status != BOUND becomes LAPSED"
          - "every SigningLine on those layers with status IN {PROVISIONAL, SIGNED} becomes RELEASED with release_reason = PROGRAM_WITHDRAWN"
          - "every Quote on those layers with status IN {QUOTED, COUNTERED, REQUOTED, FIRM_ORDER} becomes LAPSED"
          - "every MarketSubmission on those layers with status IN {SENT, QUOTED} becomes CLOSED"
          - "recompute Reinsurer.committed_capacity_minor for every affected market"
          - "Program.placement_status = WITHDRAWN"
          - "increments Program.version by 1"
        note: "Same trigger as the DRAFT→WITHDRAWN row; the cascade fires only for the states that actually own children."

      - from: FIRM_ORDER
        to: WITHDRAWN
        trigger: "POST /programs/{program_id}/withdraw"
        actor: BrokerPlacementLead
        preconditions: ["Program.placement_status IN {DRAFT, SUBMISSION_READY, IN_MARKET, FIRM_ORDER}"]
        side_effects:
          - "identical cascade to the IN_MARKET→WITHDRAWN row"
          - "Program.placement_status = WITHDRAWN"
          - "increments Program.version by 1"

  # --------------------------------------- Program / documentation_status ---
  - entity: Program
    state_field: documentation_status
    initial_state: NOT_STARTED
    terminal_states: [EXECUTED]
    transitions:
      - from: NOT_STARTED
        to: SLIP_ISSUED
        trigger: "POST /programs/{program_id}/contract-documents with document_type=SLIP"
        actor: BrokerPlacementLead
        preconditions:
          - "Program.placement_status IN {FIRM_ORDER, BOUND}"
        side_effects:
          - "append a ContractDocument row with issued_at = logical clock and days_from_inception computed"
          - "Program.documentation_status = SLIP_ISSUED"
          - "increments Program.version by 1"

      - from: SLIP_ISSUED
        to: WORDING_DRAFTED
        trigger: "POST /programs/{program_id}/contract-documents with document_type=WORDING_DRAFT"
        actor: BrokerPlacementLead
        preconditions: ["Program.documentation_status == SLIP_ISSUED"]
        side_effects:
          - "append a ContractDocument row"
          - "Program.documentation_status = WORDING_DRAFTED"
          - "increments Program.version by 1"

      - from: WORDING_DRAFTED
        to: WORDING_AGREED
        trigger: "POST /programs/{program_id}/contract-documents with document_type=AGREED_WORDING"
        actor: BrokerPlacementLead
        preconditions: ["Program.documentation_status IN {WORDING_DRAFTED, CERTAINTY_BREACHED}"]
        side_effects:
          - "append a ContractDocument row"
          - "every FiduciaryTransaction of this program with status == HELD returns to PENDING and hold_reason is cleared to null"
          - "Program.documentation_status = WORDING_AGREED"
          - "increments Program.version by 1"

      - from: WORDING_AGREED
        to: EXECUTED
        trigger: "POST /programs/{program_id}/contract-documents with document_type=EXECUTED_CONTRACT"
        actor: BrokerPlacementLead
        preconditions:
          - "Program.documentation_status == WORDING_AGREED"
          - "Program.placement_status == BOUND"
        side_effects:
          - "append a ContractDocument row"
          - "Program.documentation_status = EXECUTED"
          - "increments Program.version by 1"

      - from: SLIP_ISSUED
        to: CERTAINTY_BREACHED
        trigger: "POST /programs/{program_id}/documentation-checkpoint"
        actor: ComplianceOfficer
        preconditions:
          - "logical clock now > Program.contract_certainty_deadline"
          - "Program.documentation_status IN {NOT_STARTED, SLIP_ISSUED, WORDING_DRAFTED}"
        side_effects:
          - "every FiduciaryTransaction of this program with txn_type IN {REINSURER_REMITTANCE, REINSTATEMENT_PREMIUM} and status IN {PENDING, APPROVED} becomes HELD with hold_reason = 'CONTRACT_CERTAINTY_BREACHED'"
          - "Program.documentation_status = CERTAINTY_BREACHED"
          - "increments Program.version by 1"

      - from: NOT_STARTED
        to: CERTAINTY_BREACHED
        trigger: "POST /programs/{program_id}/documentation-checkpoint"
        actor: ComplianceOfficer
        preconditions:
          - "logical clock now > Program.contract_certainty_deadline"
          - "Program.documentation_status IN {NOT_STARTED, SLIP_ISSUED, WORDING_DRAFTED}"
        side_effects:
          - "identical hold cascade to the SLIP_ISSUED→CERTAINTY_BREACHED row"
          - "Program.documentation_status = CERTAINTY_BREACHED"
          - "increments Program.version by 1"

      - from: WORDING_DRAFTED
        to: CERTAINTY_BREACHED
        trigger: "POST /programs/{program_id}/documentation-checkpoint"
        actor: ComplianceOfficer
        preconditions:
          - "logical clock now > Program.contract_certainty_deadline"
          - "Program.documentation_status IN {NOT_STARTED, SLIP_ISSUED, WORDING_DRAFTED}"
        side_effects:
          - "identical hold cascade to the SLIP_ISSUED→CERTAINTY_BREACHED row"
          - "Program.documentation_status = CERTAINTY_BREACHED"
          - "increments Program.version by 1"

      - from: CERTAINTY_BREACHED
        to: WORDING_AGREED
        trigger: "POST /programs/{program_id}/contract-documents with document_type=AGREED_WORDING (remediation filing)"
        actor: BrokerPlacementLead
        preconditions: ["Program.documentation_status == CERTAINTY_BREACHED"]
        side_effects:
          - "append a ContractDocument row"
          - "every FiduciaryTransaction of this program with status == HELD returns to PENDING and hold_reason is cleared to null"
          - "Program.documentation_status = WORDING_AGREED"
          - "increments Program.version by 1"
        note: "Late contract certainty is remediable; the breach is remembered only through the ContractDocument.days_from_inception evidence trail."

  # ----------------------------------------------- ExposureSubmission ------
  - entity: ExposureSubmission
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTUARY_REVIEW
        trigger: "POST /exposure-submissions/{submission_id}/submit-for-review"
        actor: BrokerPlacementLead
        preconditions: ["ExposureSubmission.status == DRAFT", "Program.placement_status == DRAFT"]
        side_effects: ["recompute completeness_score per calculations.submission_completeness_score", "status = ACTUARY_REVIEW"]

      - from: ACTUARY_REVIEW
        to: SIGNED_OFF
        trigger: "POST /exposure-submissions/{submission_id}/signoff with decision=SIGNED_OFF"
        actor: BrokerActuary
        preconditions:
          - "ExposureSubmission.status == ACTUARY_REVIEW"
          - "completeness_score >= SIGNOFF_MIN_SCORE (70.00)"
        side_effects:
          - "actuary_signoff_user_id = X-User-ID, signed_off_at = logical clock, review_note = request note"
          - "status = SIGNED_OFF"
          - "cascades Program.placement_status DRAFT → SUBMISSION_READY"

      - from: ACTUARY_REVIEW
        to: REJECTED
        trigger: "POST /exposure-submissions/{submission_id}/signoff with decision=REJECTED"
        actor: BrokerActuary
        preconditions: ["ExposureSubmission.status == ACTUARY_REVIEW"]
        side_effects: ["review_note = request note", "status = REJECTED", "Program.placement_status is unchanged"]

      - from: REJECTED
        to: DRAFT
        trigger: "POST /exposure-submissions/{submission_id}/revise"
        actor: CedentUnderwriter
        preconditions: ["ExposureSubmission.status == REJECTED"]
        side_effects: ["overwrite supplied exposure fields", "recompute completeness_score", "status = DRAFT"]
        note: "Revision loop: DRAFT → ACTUARY_REVIEW → REJECTED → DRAFT is a cycle on this entity."

      - from: SIGNED_OFF
        to: SUPERSEDED
        trigger: "system cascade when another ExposureSubmission of the same program reaches SIGNED_OFF"
        actor: system
        preconditions: ["another ExposureSubmission of the same program_id has just become SIGNED_OFF"]
        side_effects: ["status = SUPERSEDED"]

  # ------------------------------------------------------------- Layer ----
  - entity: Layer
    state_field: status
    initial_state: OPEN
    terminal_states: [BOUND, LAPSED]
    transitions:
      - from: OPEN
        to: IN_MARKET
        trigger: "POST /layers/{layer_id}/market-submissions (first submission on this layer)"
        actor: BrokerPlacementLead
        preconditions: ["Program.placement_status == IN_MARKET", "Layer.status == OPEN"]
        side_effects: ["Layer.status = IN_MARKET", "quoted_gross_premium_minor is frozen and no longer recomputed", "increments Layer.version by 1"]

      - from: IN_MARKET
        to: PARTIALLY_PLACED
        trigger: "system cascade from POST /quotes/{quote_id}/firm-order (second hop)"
        actor: system
        preconditions: ["recomputed written_line_total_pct > 0 and < 100.0000"]
        side_effects: ["Layer.written_line_total_pct recomputed", "Layer.status = PARTIALLY_PLACED", "increments Layer.version by 1"]

      - from: PARTIALLY_PLACED
        to: FULLY_PLACED
        trigger: "system cascade from POST /quotes/{quote_id}/firm-order (second hop)"
        actor: system
        preconditions: ["recomputed written_line_total_pct == 100.0000 exactly"]
        side_effects: ["Layer.written_line_total_pct recomputed", "Layer.status = FULLY_PLACED", "may cascade Program.placement_status IN_MARKET → FIRM_ORDER", "increments Layer.version by 1"]

      - from: PARTIALLY_PLACED
        to: OVERSUBSCRIBED
        trigger: "system cascade from POST /quotes/{quote_id}/firm-order (second hop)"
        actor: system
        preconditions: ["recomputed written_line_total_pct > 100.0000"]
        side_effects: ["Layer.written_line_total_pct recomputed", "Layer.status = OVERSUBSCRIBED", "may cascade Program.placement_status IN_MARKET → FIRM_ORDER", "increments Layer.version by 1"]

      - from: IN_MARKET
        to: FULLY_PLACED
        trigger: "system cascade from POST /quotes/{quote_id}/firm-order when a single line fills the layer"
        actor: system
        preconditions: ["recomputed written_line_total_pct == 100.0000 exactly"]
        side_effects: ["Layer.status = FULLY_PLACED", "may cascade Program.placement_status IN_MARKET → FIRM_ORDER", "increments Layer.version by 1"]

      - from: OVERSUBSCRIBED
        to: SIGNED_DOWN
        trigger: "POST /layers/{layer_id}/sign-down"
        actor: BrokerPlacementLead
        preconditions:
          - "Layer.status == OVERSUBSCRIBED (written_line_total_pct > 100.0000 strictly)"
          - "Program.placement_status == FIRM_ORDER"
          - "when Program.signdown_method == LEAD_PROTECTED, exactly one PROVISIONAL SigningLine of this layer has Quote.is_lead == true"
        side_effects:
          - "set SigningLine.signed_line_pct on every PROVISIONAL line per calculations.signing_down_allocation"
          - "lines whose signed_line_pct resolves to 0.0000 become RELEASED with release_reason = SIGNDOWN_ZEROED"
          - "all other PROVISIONAL lines become SIGNED"
          - "Layer.signed_line_total_pct = 100.0000"
          - "recompute Reinsurer.committed_capacity_minor for every market on the layer"
          - "Layer.status = SIGNED_DOWN"
          - "increments Layer.version by 1"

      - from: FULLY_PLACED
        to: PARTIALLY_PLACED
        trigger: "system revert cascade from POST /signing-lines/{signing_line_id}/release or from a SUSPENDED security-status change"
        actor: system
        preconditions: ["recomputed written_line_total_pct < 100.0000"]
        side_effects:
          - "Layer.written_line_total_pct recomputed"
          - "Layer.status = PARTIALLY_PLACED"
          - "may cascade Program.placement_status FIRM_ORDER → IN_MARKET"
          - "increments Layer.version by 1"

      - from: OVERSUBSCRIBED
        to: PARTIALLY_PLACED
        trigger: "system revert cascade from POST /signing-lines/{signing_line_id}/release"
        actor: system
        preconditions: ["recomputed written_line_total_pct < 100.0000"]
        side_effects: ["Layer.written_line_total_pct recomputed", "Layer.status = PARTIALLY_PLACED", "may cascade Program.placement_status FIRM_ORDER → IN_MARKET", "increments Layer.version by 1"]

      - from: OVERSUBSCRIBED
        to: FULLY_PLACED
        trigger: "system revert cascade from POST /signing-lines/{signing_line_id}/release"
        actor: system
        preconditions: ["recomputed written_line_total_pct == 100.0000 exactly"]
        side_effects: ["Layer.written_line_total_pct recomputed", "Layer.status = FULLY_PLACED", "increments Layer.version by 1"]

      - from: SIGNED_DOWN
        to: PARTIALLY_PLACED
        trigger: "system revert cascade from POST /signing-lines/{signing_line_id}/release on a SIGNED line"
        actor: system
        preconditions: ["recomputed signed_line_total_pct < 100.0000"]
        side_effects:
          - "Layer.signed_line_total_pct and written_line_total_pct recomputed"
          - "remaining SIGNED lines keep their signed_line_pct (the sign-down is NOT recomputed)"
          - "Layer.status = PARTIALLY_PLACED"
          - "may cascade Program.placement_status FIRM_ORDER → IN_MARKET"
          - "increments Layer.version by 1"

      - from: FULLY_PLACED
        to: BOUND
        trigger: "system cascade from POST /programs/{program_id}/bind"
        actor: system
        preconditions: ["Program.placement_status == FIRM_ORDER at the moment of binding"]
        side_effects: ["Layer.status = BOUND", "signed_line_pct := written_line_pct on every PROVISIONAL line", "increments Layer.version by 1"]

      - from: SIGNED_DOWN
        to: BOUND
        trigger: "system cascade from POST /programs/{program_id}/bind"
        actor: system
        preconditions: ["Program.placement_status == FIRM_ORDER at the moment of binding"]
        side_effects: ["Layer.status = BOUND", "increments Layer.version by 1"]

      - from: IN_MARKET
        to: LAPSED
        trigger: "system cascade from POST /programs/{program_id}/withdraw"
        actor: system
        preconditions: ["Layer.status != BOUND"]
        side_effects: ["Layer.status = LAPSED", "increments Layer.version by 1"]

      - from: OPEN
        to: LAPSED
        trigger: "system cascade from POST /programs/{program_id}/withdraw"
        actor: system
        preconditions: ["Layer.status != BOUND"]
        side_effects: ["Layer.status = LAPSED", "increments Layer.version by 1"]

  # ------------------------------------------------------------- Quote ----
  - entity: Quote
    state_field: status
    initial_state: QUOTED
    terminal_states: [DECLINED, LAPSED, BOUND]
    transitions:
      - from: QUOTED
        to: COUNTERED
        trigger: "POST /quotes/{quote_id}/counter"
        actor: BrokerPlacementLead
        preconditions:
          - "Quote.status IN {QUOTED, REQUOTED}"
          - "Quote.negotiation_round < MAX_NEGOTIATION_ROUNDS (3)"
          - "logical clock now < Quote.expires_at"
        side_effects: ["negotiation_round += 1", "last_counter_note = request note", "status = COUNTERED"]

      - from: COUNTERED
        to: REQUOTED
        trigger: "POST /quotes/{quote_id}/requote"
        actor: ReinsurerUnderwriter
        preconditions: ["Quote.status == COUNTERED", "X-User-ID == Quote.reinsurer_id"]
        side_effects: ["overwrite offered_line_pct, quoted_rate_pct, ceding_commission_pct, reinstatements_offered, sublimit_minor, additional_exclusions, expires_at", "status = REQUOTED"]

      - from: REQUOTED
        to: COUNTERED
        trigger: "POST /quotes/{quote_id}/counter"
        actor: BrokerPlacementLead
        preconditions:
          - "Quote.status IN {QUOTED, REQUOTED}"
          - "Quote.negotiation_round < MAX_NEGOTIATION_ROUNDS (3)"
          - "logical clock now < Quote.expires_at"
        side_effects: ["negotiation_round += 1", "last_counter_note = request note", "status = COUNTERED"]
        note: "Cycle: COUNTERED → REQUOTED → COUNTERED, bounded by MAX_NEGOTIATION_ROUNDS."

      - from: QUOTED
        to: FIRM_ORDER
        trigger: "POST /quotes/{quote_id}/firm-order"
        actor: BrokerPlacementLead
        preconditions:
          - "Quote.status IN {QUOTED, REQUOTED}"
          - "logical clock now < Quote.expires_at"
          - "Program.placement_status == IN_MARKET"
          - "Reinsurer.security_status IN {APPROVED, RESTRICTED}"
          - "accepted_line_pct <= Quote.offered_line_pct"
          - "accepted_line_pct <= Reinsurer.max_line_pct"
          - "the market's windowed committed capacity per calculations.reinsurer_aggregate_capacity variant WINDOWED_AT_FIRM_ORDER, plus round_half_up(Layer.limit_minor * accepted_line_pct / 100), is <= Reinsurer.capacity_limit_minor"
          - "expected_layer_version == Layer.version"
        side_effects:
          - "Quote.accepted_line_pct = request accepted_line_pct, status = FIRM_ORDER"
          - "create SigningLine {layer_id, quote_id, reinsurer_id, written_line_pct = accepted_line_pct, status = PROVISIONAL} — first cascade hop"
          - "that SigningLine creation recomputes Layer.written_line_total_pct and drives the Layer status transition — second hop"
          - "recompute Reinsurer.committed_capacity_minor and available_capacity_minor"
          - "increments Layer.version by 1"

      - from: REQUOTED
        to: FIRM_ORDER
        trigger: "POST /quotes/{quote_id}/firm-order"
        actor: BrokerPlacementLead
        preconditions: ["identical to the QUOTED→FIRM_ORDER row"]
        side_effects: ["identical to the QUOTED→FIRM_ORDER row"]

      - from: QUOTED
        to: DECLINED
        trigger: "POST /quotes/{quote_id}/decline"
        actor: ReinsurerUnderwriter
        preconditions: ["Quote.status IN {QUOTED, COUNTERED, REQUOTED}", "X-User-ID == Quote.reinsurer_id"]
        side_effects: ["status = DECLINED", "MarketSubmission.status = DECLINED"]

      - from: COUNTERED
        to: DECLINED
        trigger: "POST /quotes/{quote_id}/decline"
        actor: ReinsurerUnderwriter
        preconditions: ["Quote.status IN {QUOTED, COUNTERED, REQUOTED}", "X-User-ID == Quote.reinsurer_id"]
        side_effects: ["status = DECLINED", "MarketSubmission.status = DECLINED"]

      - from: REQUOTED
        to: DECLINED
        trigger: "POST /quotes/{quote_id}/decline"
        actor: ReinsurerUnderwriter
        preconditions: ["Quote.status IN {QUOTED, COUNTERED, REQUOTED}", "X-User-ID == Quote.reinsurer_id"]
        side_effects: ["status = DECLINED", "MarketSubmission.status = DECLINED"]

      - from: QUOTED
        to: LAPSED
        trigger: "system cascade from Program IN_MARKET→FIRM_ORDER, from POST /programs/{program_id}/market-sweep when expires_at <= now, or from POST /programs/{program_id}/withdraw"
        actor: system
        preconditions: ["Quote.status IN {QUOTED, COUNTERED, REQUOTED}"]
        side_effects: ["status = LAPSED"]

      - from: COUNTERED
        to: LAPSED
        trigger: "system cascade from Program IN_MARKET→FIRM_ORDER, from POST /programs/{program_id}/market-sweep when expires_at <= now, or from POST /programs/{program_id}/withdraw"
        actor: system
        preconditions: ["Quote.status IN {QUOTED, COUNTERED, REQUOTED}"]
        side_effects: ["status = LAPSED"]

      - from: REQUOTED
        to: LAPSED
        trigger: "system cascade from Program IN_MARKET→FIRM_ORDER, from POST /programs/{program_id}/market-sweep when expires_at <= now, or from POST /programs/{program_id}/withdraw"
        actor: system
        preconditions: ["Quote.status IN {QUOTED, COUNTERED, REQUOTED}"]
        side_effects: ["status = LAPSED"]

      - from: FIRM_ORDER
        to: LAPSED
        trigger: "system cascade from POST /signing-lines/{signing_line_id}/release, from a SUSPENDED security-status change, or from POST /programs/{program_id}/withdraw"
        actor: system
        preconditions: ["the SigningLine materialising this quote has become RELEASED"]
        side_effects: ["status = LAPSED"]

      - from: FIRM_ORDER
        to: BOUND
        trigger: "system cascade from POST /programs/{program_id}/bind"
        actor: system
        preconditions: ["the quote's Layer became BOUND in the same request"]
        side_effects: ["status = BOUND"]

  # -------------------------------------------------------- SigningLine ----
  - entity: SigningLine
    state_field: status
    initial_state: PROVISIONAL
    terminal_states: [BOUND, RELEASED]
    transitions:
      - from: PROVISIONAL
        to: SIGNED
        trigger: "system cascade from POST /layers/{layer_id}/sign-down"
        actor: system
        preconditions: ["resolved signed_line_pct > 0.0000"]
        side_effects: ["signed_line_pct set per calculations.signing_down_allocation", "effective_line_pct and committed_capacity_minor recomputed", "status = SIGNED"]

      - from: PROVISIONAL
        to: RELEASED
        trigger: "system cascade from POST /layers/{layer_id}/sign-down when the allocation resolves to 0.0000"
        actor: system
        preconditions: ["resolved signed_line_pct == 0.0000"]
        side_effects: ["signed_line_pct = 0.0000", "release_reason = SIGNDOWN_ZEROED", "status = RELEASED", "Quote status FIRM_ORDER → LAPSED", "Reinsurer.committed_capacity_minor recomputed"]

      - from: PROVISIONAL
        to: BOUND
        trigger: "system cascade from POST /programs/{program_id}/bind on a FULLY_PLACED layer"
        actor: system
        preconditions: ["Layer.status == FULLY_PLACED at binding"]
        side_effects: ["signed_line_pct = written_line_pct", "status = BOUND"]

      - from: SIGNED
        to: BOUND
        trigger: "system cascade from POST /programs/{program_id}/bind on a SIGNED_DOWN layer"
        actor: system
        preconditions: ["Layer.status == SIGNED_DOWN at binding"]
        side_effects: ["status = BOUND"]

      - from: PROVISIONAL
        to: RELEASED
        trigger: "POST /signing-lines/{signing_line_id}/release, POST /reinsurers/{reinsurer_id}/security-status with security_status=SUSPENDED, or POST /programs/{program_id}/withdraw"
        actor: BrokerPlacementLead
        preconditions: ["SigningLine.status IN {PROVISIONAL, SIGNED}", "Layer.status != BOUND"]
        side_effects:
          - "release_reason = WITHDRAWN_BY_BROKER (manual), SECURITY_FAILURE (suspension cascade) or PROGRAM_WITHDRAWN (withdrawal cascade)"
          - "status = RELEASED"
          - "Quote status FIRM_ORDER → LAPSED — first cascade hop"
          - "Layer.written_line_total_pct / signed_line_total_pct recomputed, driving the Layer revert transition — second hop"
          - "Reinsurer.committed_capacity_minor and available_capacity_minor recomputed"
        note: "The Layer revert may itself cascade Program FIRM_ORDER → IN_MARKET — third hop."

      - from: SIGNED
        to: RELEASED
        trigger: "POST /signing-lines/{signing_line_id}/release or POST /programs/{program_id}/withdraw"
        actor: BrokerPlacementLead
        preconditions: ["SigningLine.status IN {PROVISIONAL, SIGNED}", "Layer.status != BOUND"]
        side_effects: ["identical to the PROVISIONAL→RELEASED manual row, plus Layer.signed_line_total_pct recomputed"]

  # ------------------------------------------------- MarketSubmission -----
  - entity: MarketSubmission
    state_field: status
    initial_state: SENT
    terminal_states: [DECLINED, CLOSED, EXPIRED]
    transitions:
      - from: SENT
        to: QUOTED
        trigger: "POST /market-submissions/{market_submission_id}/quotes"
        actor: ReinsurerUnderwriter
        preconditions: ["MarketSubmission.status == SENT", "logical clock now <= response_deadline", "X-User-ID == MarketSubmission.reinsurer_id"]
        side_effects: ["create the Quote in status QUOTED", "status = QUOTED"]

      - from: SENT
        to: EXPIRED
        trigger: "POST /programs/{program_id}/market-sweep"
        actor: BrokerPlacementLead
        preconditions: ["MarketSubmission.status == SENT", "logical clock now > response_deadline"]
        side_effects: ["status = EXPIRED"]

      - from: SENT
        to: DECLINED
        trigger: "system cascade from POST /quotes/{quote_id}/decline"
        actor: system
        preconditions: ["the quote being declined belongs to this submission"]
        side_effects: ["status = DECLINED"]

      - from: QUOTED
        to: DECLINED
        trigger: "system cascade from POST /quotes/{quote_id}/decline"
        actor: system
        preconditions: ["the quote being declined belongs to this submission"]
        side_effects: ["status = DECLINED"]

      - from: SENT
        to: CLOSED
        trigger: "system cascade from Program IN_MARKET→FIRM_ORDER or POST /programs/{program_id}/withdraw"
        actor: system
        preconditions: ["MarketSubmission.status IN {SENT, QUOTED}"]
        side_effects: ["status = CLOSED"]

      - from: QUOTED
        to: CLOSED
        trigger: "system cascade from Program IN_MARKET→FIRM_ORDER or POST /programs/{program_id}/withdraw"
        actor: system
        preconditions: ["MarketSubmission.status IN {SENT, QUOTED}"]
        side_effects: ["status = CLOSED"]

  # -------------------------------------------- FiduciaryTransaction ------
  - entity: FiduciaryTransaction
    state_field: status
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /fiduciary-transactions/{transaction_id}/approve"
        actor: "ComplianceOfficer or BrokerAccountant"
        preconditions:
          - "FiduciaryTransaction.status == PENDING"
          - "X-User-ID != FiduciaryTransaction.created_by_user_id (segregation of duties — a BrokerAccountant may approve only a movement booked by a different accounting identity)"
        side_effects: ["approved_by_user_id = X-User-ID", "status = APPROVED"]

      - from: APPROVED
        to: SETTLED
        trigger: "POST /fiduciary-transactions/{transaction_id}/settle"
        actor: BrokerAccountant
        preconditions:
          - "FiduciaryTransaction.status == APPROVED"
          - "for txn_type IN {REINSURER_REMITTANCE, REINSTATEMENT_PREMIUM}: Program.documentation_status IN {WORDING_AGREED, EXECUTED}"
          - "for outflow types: amount_minor <= Program.fiduciary_holding_minor"
        side_effects:
          - "value_date = logical clock, status = SETTLED"
          - "recompute Program.fiduciary_holding_minor per calculations.fiduciary_holding"
          - "recompute Cedent.settled_receipts_minor and Cedent.outstanding_reinstatement_premium_minor"

      - from: PENDING
        to: HELD
        trigger: "system cascade from POST /programs/{program_id}/documentation-checkpoint on breach"
        actor: system
        preconditions: ["txn_type IN {REINSURER_REMITTANCE, REINSTATEMENT_PREMIUM}", "status IN {PENDING, APPROVED}"]
        side_effects: ["hold_reason = 'CONTRACT_CERTAINTY_BREACHED'", "status = HELD"]

      - from: APPROVED
        to: HELD
        trigger: "system cascade from POST /programs/{program_id}/documentation-checkpoint on breach"
        actor: system
        preconditions: ["txn_type IN {REINSURER_REMITTANCE, REINSTATEMENT_PREMIUM}", "status IN {PENDING, APPROVED}"]
        side_effects: ["hold_reason = 'CONTRACT_CERTAINTY_BREACHED'", "approved_by_user_id is retained", "status = HELD"]

      - from: HELD
        to: PENDING
        trigger: "system cascade from a documentation filing that sets Program.documentation_status = WORDING_AGREED"
        actor: system
        preconditions: ["status == HELD"]
        side_effects: ["hold_reason = null", "approved_by_user_id = null", "status = PENDING"]
        note: "A held movement must be re-approved, so the segregation-of-duties check runs again."

      - from: SETTLED
        to: REVERSED
        trigger: "POST /fiduciary-transactions/{transaction_id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "FiduciaryTransaction.status == SETTLED"
          - "txn_type IN {REINSURER_REMITTANCE, BROKERAGE_DEDUCTION, REINSTATEMENT_PREMIUM, CEDENT_PAYOUT}"
          - "no REMITTANCE_REVERSAL row already references this transaction"
        side_effects:
          - "status = REVERSED"
          - "create a compensating FiduciaryTransaction {txn_type = REMITTANCE_REVERSAL, amount_minor = the reversed amount, signing_line_id copied, reverses_transaction_id = this id, status = SETTLED, value_date = logical clock}"
          - "recompute Program.fiduciary_holding_minor — it returns to exactly its value before the reversed movement settled"

  # ------------------------------------------------------ ClaimAdvocacy ---
  - entity: ClaimAdvocacy
    state_field: status
    initial_state: NOTIFIED
    terminal_states: [COLLECTED, WITHDRAWN]
    transitions:
      - from: NOTIFIED
        to: UNDER_REVIEW
        trigger: "POST /claim-advocacies/{claim_advocacy_id}/review"
        actor: BrokerPlacementLead
        preconditions: ["ClaimAdvocacy.status == NOTIFIED", "Layer.status == BOUND"]
        side_effects: ["status = UNDER_REVIEW"]

      - from: NOTIFIED
        to: WITHDRAWN
        trigger: "POST /claim-advocacies/{claim_advocacy_id}/withdraw"
        actor: CedentUnderwriter
        preconditions: ["ClaimAdvocacy.status == NOTIFIED", "X-User-ID == Program.cedent_id"]
        side_effects: ["status = WITHDRAWN", "Layer.limit_eroded_minor and reinstatements_used are unaffected because notification never eroded them"]

      - from: UNDER_REVIEW
        to: DISPUTED
        trigger: "system cascade from POST /claim-advocacies/{claim_advocacy_id}/cession-disputes"
        actor: system
        preconditions: ["the first CessionDispute on this advocacy has just been created"]
        side_effects: ["recompute disputed_minor and collectible_minor", "status = DISPUTED"]

      - from: DISPUTED
        to: ADVOCACY_NEGOTIATION
        trigger: "POST /claim-advocacies/{claim_advocacy_id}/advocacy-route with route=NEGOTIATION"
        actor: BrokerPlacementLead
        preconditions: ["ClaimAdvocacy.status == DISPUTED"]
        side_effects: ["advocacy_route = NEGOTIATION", "arbitration_cost_minor stays 0", "status = ADVOCACY_NEGOTIATION"]
        note: "Fork branch A — no cost accrues and collections stay open while the route runs."

      - from: DISPUTED
        to: ADVOCACY_ARBITRATION
        trigger: "POST /claim-advocacies/{claim_advocacy_id}/advocacy-route with route=ARBITRATION"
        actor: BrokerPlacementLead
        preconditions: ["ClaimAdvocacy.status == DISPUTED"]
        side_effects:
          - "advocacy_route = ARBITRATION"
          - "arbitration_cost_minor = round_half_up(ceded_claim_minor * ARBITRATION_COST_PCT / 100)"
          - "status = ADVOCACY_ARBITRATION"
        note: "Fork branch B — divergent side-effect set: a cost accrues and no CLAIM_COLLECTION may be booked until the branch joins at RESOLVED."

      - from: ADVOCACY_NEGOTIATION
        to: RESOLVED
        trigger: "system cascade from POST /cession-disputes/{dispute_id}/resolve (join)"
        actor: system
        preconditions: ["no CessionDispute of this advocacy remains in status RAISED"]
        side_effects: ["recompute disputed_minor and collectible_minor", "recompute Layer.incurred_ceded_minor", "status = RESOLVED"]

      - from: ADVOCACY_ARBITRATION
        to: RESOLVED
        trigger: "system cascade from POST /cession-disputes/{dispute_id}/resolve (join)"
        actor: system
        preconditions: ["no CessionDispute of this advocacy remains in status RAISED"]
        side_effects: ["recompute disputed_minor and collectible_minor", "recompute Layer.incurred_ceded_minor", "status = RESOLVED"]

      - from: UNDER_REVIEW
        to: COLLECTED
        trigger: "system cascade from POST /claim-advocacies/{claim_advocacy_id}/collections"
        actor: system
        preconditions: ["collected_minor >= collectible_minor after this collection", "no CessionDispute exists on this advocacy"]
        side_effects:
          - "status = COLLECTED"
          - "Layer.limit_eroded_minor += ceded_claim_minor and Layer.reinstatements_used recomputed — first cascade hop"
          - "when the erosion consumes a reinstatement, a FiduciaryTransaction {txn_type = REINSTATEMENT_PREMIUM, status = PENDING} is created per calculations.claim_cession_waterfall — second hop"
          - "Cedent.outstanding_reinstatement_premium_minor recomputed from that new transaction — third hop"
          - "recompute Layer.incurred_ceded_minor"

      - from: RESOLVED
        to: COLLECTED
        trigger: "system cascade from POST /claim-advocacies/{claim_advocacy_id}/collections"
        actor: system
        preconditions: ["collected_minor >= collectible_minor after this collection"]
        side_effects: ["identical cascade to the UNDER_REVIEW→COLLECTED row"]

  # ------------------------------------------------------ CessionDispute ---
  - entity: CessionDispute
    state_field: status
    initial_state: RAISED
    terminal_states: [UPHELD, WITHDRAWN, SETTLED_PARTIAL]
    transitions:
      - from: RAISED
        to: UPHELD
        trigger: "POST /cession-disputes/{dispute_id}/resolve with resolution=UPHELD"
        actor: BrokerPlacementLead
        preconditions: ["CessionDispute.status == RAISED", "settled_minor in the request equals 0"]
        side_effects: ["settled_minor = 0", "status = UPHELD", "ClaimAdvocacy.disputed_minor keeps the full disputed amount", "may cascade the advocacy to RESOLVED"]

      - from: RAISED
        to: WITHDRAWN
        trigger: "POST /cession-disputes/{dispute_id}/resolve with resolution=WITHDRAWN"
        actor: BrokerPlacementLead
        preconditions: ["CessionDispute.status == RAISED", "settled_minor in the request equals the dispute's disputed_minor"]
        side_effects: ["settled_minor = disputed_minor", "status = WITHDRAWN", "ClaimAdvocacy.disputed_minor drops by the full amount", "may cascade the advocacy to RESOLVED"]

      - from: RAISED
        to: SETTLED_PARTIAL
        trigger: "POST /cession-disputes/{dispute_id}/resolve with resolution=SETTLED_PARTIAL"
        actor: BrokerPlacementLead
        preconditions: ["CessionDispute.status == RAISED", "0 < settled_minor < disputed_minor"]
        side_effects: ["settled_minor = request settled_minor", "status = SETTLED_PARTIAL", "ClaimAdvocacy.disputed_minor keeps (disputed_minor - settled_minor)", "may cascade the advocacy to RESOLVED"]

  # ------------------------------------------------- BrokerageDisclosure ---
  # Compensation-disclosure track. Runs independently of placement_status and
  # of documentation_status; POST /programs/{program_id}/bind reads only its
  # terminal outcome through the derived field Program.disclosure_acknowledged.
  - entity: BrokerageDisclosure
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: DISCLOSED
        trigger: "POST /brokerage-disclosures/{disclosure_id}/disclose"
        actor: BrokerAccountant
        preconditions:
          - "BrokerageDisclosure.status == DRAFT"
          - "BrokerageDisclosure.brokerage_pct equals Program.brokerage_pct of the parent program (else validations[priority=60] ERR_DISCLOSURE_PCT_MISMATCH)"
          - "Program.placement_status IN {IN_MARKET, FIRM_ORDER}"
        side_effects:
          - "disclosed_by_user_id = X-User-ID of the acting BrokerAccountant"
          - "status = DISCLOSED"
          - "increments BrokerageDisclosure.version by 1"

      - from: DISCLOSED
        to: ACKNOWLEDGED
        trigger: "POST /brokerage-disclosures/{disclosure_id}/decision with decision=ACKNOWLEDGE"
        actor: CedentUnderwriter
        preconditions:
          - "BrokerageDisclosure.status == DISCLOSED"
          - "the acting CedentUnderwriter's X-User-ID equals Program.cedent_id of the parent program (else validations[priority=4] ERR_FOREIGN_RESOURCE)"
        side_effects:
          - "acknowledged_by_user_id = X-User-ID of the acting CedentUnderwriter"
          - "decision_note = request decision_note when supplied"
          - "status = ACKNOWLEDGED"
          - "Program.disclosure_acknowledged = true (ledger sync onto the parent; unblocks POST /programs/{program_id}/bind, validations[priority=41])"
          - "increments BrokerageDisclosure.version by 1"
          - "increments Program.version by 1"

      - from: DISCLOSED
        to: REJECTED
        trigger: "POST /brokerage-disclosures/{disclosure_id}/decision with decision=REJECT"
        actor: CedentUnderwriter
        preconditions:
          - "BrokerageDisclosure.status == DISCLOSED"
          - "the acting CedentUnderwriter's X-User-ID equals Program.cedent_id of the parent program"
        side_effects:
          - "acknowledged_by_user_id = X-User-ID of the acting CedentUnderwriter"
          - "decision_note = request decision_note when supplied"
          - "status = REJECTED"
          - "Program.disclosure_acknowledged = false (no BrokerageDisclosure of this program is ACKNOWLEDGED)"
          - "increments BrokerageDisclosure.version by 1"
          - "increments Program.version by 1"
        note: "REJECTED is non-terminal: the broker re-discloses the corrected terms below."

      - from: REJECTED
        to: DISCLOSED
        trigger: "POST /brokerage-disclosures/{disclosure_id}/disclose (re-disclosure after a cedent rejection)"
        actor: BrokerAccountant
        preconditions:
          - "BrokerageDisclosure.status == REJECTED"
          - "BrokerageDisclosure.brokerage_pct equals Program.brokerage_pct of the parent program"
          - "Program.placement_status IN {IN_MARKET, FIRM_ORDER}"
        side_effects:
          - "disclosed_by_user_id = X-User-ID of the acting BrokerAccountant"
          - "acknowledged_by_user_id = null"
          - "decision_note = null"
          - "status = DISCLOSED"
          - "increments BrokerageDisclosure.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: firm-order-stale-layer
    parent_entity: Layer
    write_endpoint: "POST /quotes/{quote_id}/firm-order"
    occ_field: "expected_layer_version"
    description: |
      Firm-ordering a quote against a Layer whose version has advanced since the
      client last read it is rejected. Oversubscription is legitimate product
      behaviour — a second firm order on the same layer would otherwise succeed
      and be resolved later by signing down — so the stale-version check is the
      only way the system tells the broker that the layer's placed capacity is
      no longer what they priced their allocation against.
    error_id: ERR_STALE_LAYER_VERSION
    http_status: 412

  - rule_id: fiduciary-booking-stale-program
    parent_entity: Program
    write_endpoint: "POST /programs/{program_id}/fiduciary-transactions"
    occ_field: "expected_program_version"
    description: |
      Booking a fiduciary movement against a Program whose version has advanced
      since the client last read it is rejected. Multiple movements on one
      program are legitimate, so the booking would otherwise succeed against a
      fiduciary_holding_minor the client never saw; the stale-version check
      forces the accountant to re-read the balance before committing funds.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money is integer minor currency units. All percentages carry 4 decimal
# places unless stated otherwise. `round_half_up` means round-half-away-from-zero
# at the stated precision; `floor_4dp` truncates toward zero at 4 decimals.
# =============================================================================
calculations:

  - name: layer_technical_premium
    trigger: "On POST /programs/{program_id}/layers and on PATCH /layers/{layer_id} while Layer.status == OPEN; frozen the moment the layer reaches IN_MARKET"
    algorithm: tiered_pricing
    formula: |
      # step 1 — reinstatement loading on the rate (exact, no intermediate rounding)
      reinstatement_load_pct = REINSTATEMENT_LOAD_PER_UNIT_PCT * Layer.reinstatements_total
      loaded_rate_pct        = Layer.base_rate_pct * (1 + reinstatement_load_pct / 100)

      # step 2 — undiscounted premium, rounded to minor units ONCE
      provisional_premium_minor =
          round_half_up(Layer.subject_premium_base_minor * loaded_rate_pct / 100)

      # step 3 — the volume tier is selected from provisional_premium_minor, i.e.
      #          from the premium BEFORE the discount. It is NEVER re-derived from
      #          the discounted result (that would let a large layer fall back into
      #          a cheaper tier and produce a different, wrong premium).
      if   provisional_premium_minor <  VOLUME_TIER_1_MINOR: tier_discount_pct = TIER_DISCOUNT_0_PCT
      elif provisional_premium_minor <  VOLUME_TIER_2_MINOR: tier_discount_pct = TIER_DISCOUNT_1_PCT
      elif provisional_premium_minor <  VOLUME_TIER_3_MINOR: tier_discount_pct = TIER_DISCOUNT_2_PCT
      else:                                                  tier_discount_pct = TIER_DISCOUNT_3_PCT

      # step 4 — discounted quote
      quoted_gross_premium_minor =
          round_half_up(provisional_premium_minor * (1 - tier_discount_pct / 100))
    input_set: "A single Layer row and its own input fields; no sibling layers, quotes or signing lines participate. Recomputed on every mutation while status == OPEN, never after."
    constants:
      REINSTATEMENT_LOAD_PER_UNIT_PCT: 5.0000
      VOLUME_TIER_1_MINOR: 5000000
      VOLUME_TIER_2_MINOR: 25000000
      VOLUME_TIER_3_MINOR: 100000000
      TIER_DISCOUNT_0_PCT: 0.0000
      TIER_DISCOUNT_1_PCT: 2.5000
      TIER_DISCOUNT_2_PCT: 5.0000
      TIER_DISCOUNT_3_PCT: 7.5000
    precision: "integer minor currency units, round_half_up; the rate is carried unrounded through step 1"
    worked_example: |
      subject_premium_base_minor = 1250000000, base_rate_pct = 8.0000, reinstatements_total = 1
      -> loaded_rate_pct = 8.4000, provisional_premium_minor = 105000000
      -> tier from 105000000 >= 100000000 => 7.5000  => quoted_gross_premium_minor = 97125000
      (evaluating the tier from the discounted 97125000 instead would select 5.0000 and
       yield 99750000 — the observable trap.)

  - name: signing_down_allocation
    trigger: "On POST /layers/{layer_id}/sign-down for an OVERSUBSCRIBED layer"
    algorithm: waterfall_allocation
    formula: |
      lines = SigningLine rows of this layer with status == PROVISIONAL,
              ordered by created_at ascending
      written_total_pct = sum(line.written_line_pct for line in lines)   # > 100.0000

      # base allocation (variant PRO_RATA)
      for line in lines:
          raw_pct[line]    = line.written_line_pct * 100 / written_total_pct   # exact rational
          signed_pct[line] = floor_4dp(raw_pct[line])
          dropped[line]    = raw_pct[line] - signed_pct[line]

      residue_pct = 100.0000 - sum(signed_pct.values())
      steps       = residue_pct / 0.0001                                  # always an integer

      # remainder distribution order — fully deterministic, no random field participates
      order = sort(lines, key = (dropped DESC,
                                 written_line_pct DESC,
                                 created_at ASC,
                                 Reinsurer.name ASC))
      for k in 0 .. steps - 1:
          signed_pct[order[k mod len(order)]] += 0.0001

      # ledger sync
      for line in lines:
          line.signed_line_pct         = signed_pct[line]
          line.effective_line_pct      = signed_pct[line]
          line.committed_capacity_minor = round_half_up(Layer.limit_minor * signed_pct[line] / 100)
      Layer.signed_line_total_pct = 100.0000   # invariant: the allocation always closes exactly
    input_set: "Only SigningLine rows of the layer in status PROVISIONAL. RELEASED lines are excluded; SIGNED and BOUND lines cannot exist on an OVERSUBSCRIBED layer."
    constants:
      ALLOCATION_STEP_PCT: 0.0001
      TARGET_TOTAL_PCT: 100.0000
    precision: "4 decimal places; floor_4dp on the raw share, then whole 0.0001 steps of remainder — the signed total is exactly 100.0000, never 99.9999 or 100.0001"
    variants:
      - name: PRO_RATA
        when: "Program.signdown_method == PRO_RATA (the default)"
        difference: "Every line, lead or follower, is scaled by 100 / written_total_pct. The lead's protection is worth nothing."
      - name: LEAD_PROTECTED
        when: "Program.signdown_method == LEAD_PROTECTED"
        difference: |
          The line whose Quote.is_lead == true keeps its written_line_pct untouched;
          followers share only (100.0000 - lead.written_line_pct):
            follower_total_pct = sum(written_line_pct of non-lead PROVISIONAL lines)
            raw_pct[f]         = f.written_line_pct * (100.0000 - lead.written_line_pct) / follower_total_pct
          The floor + remainder pass then runs over the followers only, and the residue
          closes against (100.0000 - lead.written_line_pct) rather than 100.0000.
    worked_example: |
      Written lines 35.0000 / 30.0000 / 25.0000 / 20.0000 (total 110.0000), created in that order,
      markets Alpha Re / Bravo Re / Charlie Re / Delta Re, layer limit 1000000000:
        PRO_RATA        -> 31.8182 / 27.2727 / 22.7273 / 18.1818  (residue 0.0002 -> Alpha Re, Charlie Re)
                           committed capacity 318182000 / 272727000 / 227273000 / 181818000
        LEAD_PROTECTED  -> Alpha Re 35.0000 (lead, untouched), then 26.0000 / 21.6667 / 17.3333
                           (residue 0.0001 -> Charlie Re)
                           committed capacity 350000000 / 260000000 / 216667000 / 173333000
      Both variants total exactly 100.0000 and differ on every follower line.

  - name: brokerage_and_net_remittance
    trigger: "On POST /programs/{program_id}/bind, after every Layer of the program has reached BOUND"
    algorithm: aggregation
    formula: |
      bound_lines = SigningLine rows with status == BOUND whose Layer.status == BOUND and
                    whose Layer.program_id == this program, ordered by created_at ascending

      # per-line rounding, THEN summation — the order is pinned and observable
      for line in bound_lines:
          line_gross_minor     = round_half_up(line.Layer.quoted_gross_premium_minor
                                               * line.signed_line_pct / 100)
          line_brokerage_minor = round_half_up(line_gross_minor * Program.brokerage_pct / 100)
          line_net_minor       = line_gross_minor - line_brokerage_minor

      Program.gross_written_premium_minor = sum(Layer.quoted_gross_premium_minor
                                                for BOUND layers of this program)
      Program.brokerage_earned_minor      = sum(line_brokerage_minor)   # NOT
                                            # round_half_up(gross_written_premium_minor
                                            #               * brokerage_pct / 100)
      Program.net_remittance_minor        = sum(line_net_minor)
      Program.rounding_residue_minor      = Program.gross_written_premium_minor
                                            - (Program.brokerage_earned_minor
                                               + Program.net_remittance_minor)
    input_set: "Only BOUND signing lines on BOUND layers. PROVISIONAL, SIGNED and RELEASED lines and LAPSED layers contribute nothing."
    constants: {}
    precision: "integer minor currency units, round_half_up at each of the two per-line steps; summation is exact"
    worked_example: |
      One BOUND layer, quoted_gross_premium_minor = 9750000, brokerage_pct = 2.5000,
      four BOUND lines at 35.0000 / 30.0000 / 20.0000 / 15.0000:
        line_gross     3412500 / 2925000 / 1950000 / 1462500  (sum 9750000)
        line_brokerage   85313 /   73125 /   48750 /   36563
        brokerage_earned_minor = 243751
        round_half_up(9750000 * 2.5 / 100) = 243750  <- the sum-then-round trap, off by 1
        net_remittance_minor   = 9506249, rounding_residue_minor = 0
      Second worked case (layer premium 97125000, signed 31.8182 / 27.2727 / 22.7273 / 18.1818):
        line_gross 30903427 / 26488610 / 22073890 / 17659073 (sum 97125000)
        brokerage_earned_minor = 2428125, net_remittance_minor = 94696875, residue 0

  - name: submission_completeness_score
    trigger: "On POST /programs/{program_id}/exposure-submissions, on POST /exposure-submissions/{submission_id}/revise and on POST /exposure-submissions/{submission_id}/submit-for-review"
    algorithm: weighted_scoring
    formula: |
      if exposure_records_count == 0:
          data_quality_ratio = 0
      else:
          data_quality_ratio = (exposure_records_count - data_quality_flags_count)
                               / exposure_records_count            # exact rational
      history_factor = min(historical_years_supplied, HISTORY_TARGET_YEARS) / HISTORY_TARGET_YEARS

      raw_score = WEIGHT_DATA_QUALITY * data_quality_ratio
                + WEIGHT_HISTORY      * history_factor
                + WEIGHT_LOSS_COMPLETENESS * loss_history_completeness_pct / 100
                + (WEIGHT_ACTUARIAL_REPORT if actuarial_report_attached else 0)

      completeness_score = round_half_up(raw_score, 2)     # weights total exactly 100
    input_set: "The submission's own input fields only. Sibling submissions of the same program never contribute."
    constants:
      WEIGHT_DATA_QUALITY: 40
      WEIGHT_HISTORY: 25
      WEIGHT_LOSS_COMPLETENESS: 25
      WEIGHT_ACTUARIAL_REPORT: 10
      HISTORY_TARGET_YEARS: 5
      SIGNOFF_MIN_SCORE: 70.00
    precision: "2 decimal places, round_half_up; every intermediate ratio stays unrounded so the weights cannot drift"
    worked_example: |
      records 1000, flags 100, years 4, loss_history_completeness_pct 56.0000, report false
        -> 40*0.9 + 25*0.8 + 25*0.56 + 0 = 36 + 20 + 14 = 70.00  (exactly SIGNOFF_MIN_SCORE)
      records 1000, flags 150, years 4, 56.0000, false -> 68.00 (below the gate)
      records 1000, flags 20, years 5, 90.0000, true   -> 96.70
      records 0,    flags 0,  years 5, 90.0000, true   -> 57.50 (zero-record guard, not a crash)

  - name: ceding_commission_settlement
    trigger: "PROVISIONAL_FLAT on POST /programs/{program_id}/bind; FINAL_SLIDING on POST /programs/{program_id}/settle"
    algorithm: threshold
    formula: |
      # applies to BOUND layers with layer_type == QUOTA_SHARE only
      provisional_ceding_commission_minor =
          round_half_up(Layer.quoted_gross_premium_minor * Layer.ceding_commission_pct / 100)

      loss_ratio_pct = round_half_up(100 * Layer.incurred_ceded_minor
                                     / Layer.quoted_gross_premium_minor, 4)

      raw_commission_pct = Layer.ceding_commission_pct
                         + (SLIDE_PIVOT_LOSS_RATIO_PCT - loss_ratio_pct) * SLIDE_FACTOR
      # clamp FIRST, round SECOND — clamping a rounded value and rounding a clamped
      # value differ at the boundary
      final_commission_pct = round_half_up(
          min(COMMISSION_MAX_PCT, max(COMMISSION_MIN_PCT, raw_commission_pct)), 4)

      final_ceding_commission_minor =
          round_half_up(Layer.quoted_gross_premium_minor * final_commission_pct / 100)
      ceding_commission_delta_minor =
          final_ceding_commission_minor - provisional_ceding_commission_minor
    input_set: "One BOUND QUOTA_SHARE Layer. incurred_ceded_minor aggregates only that layer's ClaimAdvocacy rows in status IN {RESOLVED, COLLECTED}; NOTIFIED, UNDER_REVIEW, DISPUTED, ADVOCACY_* and WITHDRAWN advocacies are excluded."
    constants:
      SLIDE_PIVOT_LOSS_RATIO_PCT: 60.0000
      SLIDE_FACTOR: 0.5000
      COMMISSION_MIN_PCT: 20.0000
      COMMISSION_MAX_PCT: 35.0000
    precision: "loss_ratio_pct and final_commission_pct 4 decimal places round_half_up; commission amounts integer minor units round_half_up"
    variants:
      - name: PROVISIONAL_FLAT
        when: "At binding — no loss experience exists yet"
        difference: "Uses Layer.ceding_commission_pct verbatim; the slide, the pivot loss ratio and both clamps are ignored entirely."
      - name: FINAL_SLIDING
        when: "At settlement — incurred_ceded_minor is known"
        difference: "Slides the commission against the realised loss ratio and clamps it into [20.0000, 35.0000]; on identical layer data the two variants disagree whenever loss_ratio_pct != SLIDE_PIVOT_LOSS_RATIO_PCT."
    worked_example: |
      QUOTA_SHARE layer, quoted_gross_premium_minor = 740000000, ceding_commission_pct = 30.0000
        PROVISIONAL_FLAT                       -> 222000000
        incurred 400000000 -> LR 54.0541, raw 32.97295 -> 32.9730 -> 244000200 (delta  +22000200)
        incurred 200000000 -> LR 27.0270, raw 46.48650 -> clamped MAX 35.0000 -> 259000000 (delta +37000000)
        incurred 592000000 -> LR 80.0000, raw 20.00000 -> exactly COMMISSION_MIN_PCT -> 148000000 (delta -74000000)

  - name: claim_cession_waterfall
    trigger: "On POST /layers/{layer_id}/claim-advocacies (initial cession) and re-evaluated on POST /cession-disputes/{dispute_id}/resolve"
    algorithm: waterfall_allocation
    formula: |
      # bucket 0 — what the treaty is even exposed to
      if Layer.layer_type == QUOTA_SHARE:
          subject_minor = round_half_up(ClaimAdvocacy.gross_claim_minor * Layer.cession_pct / 100)
      else:
          subject_minor = max(0, ClaimAdvocacy.gross_claim_minor - Layer.attachment_minor)

      # bucket 1 — per-event cap: the sublimit when one is agreed, otherwise the limit
      event_cap_minor = Layer.sublimit_minor if Layer.sublimit_minor > 0 else Layer.limit_minor

      # bucket 2 — aggregate cap: one limit plus the purchased reinstatements, less erosion
      aggregate_available_minor = max(0, Layer.limit_minor * (1 + Layer.reinstatements_total)
                                        - Layer.limit_eroded_minor)

      ceded_claim_minor = min(subject_minor, event_cap_minor,
                              Layer.limit_minor, aggregate_available_minor)

      # erosion + reinstatement accounting (on collection, not on notification)
      previous_used = Layer.reinstatements_used
      new_eroded    = Layer.limit_eroded_minor + ceded_claim_minor
      Layer.reinstatements_used = max(0, ceil(new_eroded / Layer.limit_minor) - 1)
      reinstatement_triggered   = Layer.reinstatements_used > previous_used
      if reinstatement_triggered:
          reinstated_amount_minor    = new_eroded - Layer.limit_minor * (1 + previous_used)
          reinstatement_premium_minor = round_half_up(
              Layer.quoted_gross_premium_minor * Layer.reinstatement_premium_pct / 100
              * reinstated_amount_minor / Layer.limit_minor)

      # dispute overlay
      ClaimAdvocacy.disputed_minor =
            sum(d.disputed_minor                    for d in disputes if d.status == RAISED)
          + sum(d.disputed_minor                    for d in disputes if d.status == UPHELD)
          + sum(d.disputed_minor - d.settled_minor  for d in disputes if d.status == SETTLED_PARTIAL)
          # WITHDRAWN disputes contribute 0 — the market conceded in full
      ClaimAdvocacy.collectible_minor = max(0, ceded_claim_minor - ClaimAdvocacy.disputed_minor)
      ClaimAdvocacy.arbitration_cost_minor =
          round_half_up(ceded_claim_minor * ARBITRATION_COST_PCT / 100)
              if advocacy_route == ARBITRATION else 0
    input_set: "The advocacy's own gross_claim_minor plus the layer's structural fields and its current limit_eroded_minor / reinstatements_used. Erosion is charged only when the advocacy reaches COLLECTED, so a NOTIFIED or WITHDRAWN advocacy never moves the layer."
    constants:
      ARBITRATION_COST_PCT: 1.5000
    precision: "integer minor currency units; round_half_up on the quota-share cession, the reinstatement premium and the arbitration cost; ceil on the reinstatement count"
    worked_example: |
      CATASTROPHE layer: limit 1000000000, attachment 2000000000, reinstatements_total 1,
      sublimit 0, reinstatement_premium_pct 100.0000, quoted_gross_premium_minor 97125000
        gross 2600000000, eroded          0 -> subject  600000000 -> ceded  600000000, used 0
        gross 3200000000, eroded  600000000 -> subject 1200000000 -> ceded 1000000000 (limit binds),
                                               used 1, reinstated 600000000, premium 58275000
        gross 3200000000, eroded 1600000000 -> aggregate_available 400000000 -> ceded 400000000
        gross 2600000000, eroded 2000000000 -> aggregate_available 0 exactly -> ceded 0

  - name: reinsurer_aggregate_capacity
    trigger: "LIFETIME_TOTAL on every SigningLine create / sign-down / release; WINDOWED_AT_FIRM_ORDER inside the capacity check on POST /quotes/{quote_id}/firm-order"
    algorithm: aggregation
    formula: |
      live_lines(R) = SigningLine rows with reinsurer_id == R.id and
                      status IN {PROVISIONAL, SIGNED, BOUND}
      # RELEASED lines are excluded — releasing a line always hands capacity back

      line_capacity_minor(L) = round_half_up(L.Layer.limit_minor * L.effective_line_pct / 100)
      # effective_line_pct = signed_line_pct when set, else written_line_pct, so a
      # PROVISIONAL line reserves its full written line before sign-down shrinks it

      Reinsurer.committed_capacity_minor = sum(line_capacity_minor(L) for L in live_lines(R))
      Reinsurer.available_capacity_minor = Reinsurer.capacity_limit_minor
                                           - Reinsurer.committed_capacity_minor
    input_set: "Live signing lines of one reinsurer. Which lines are in scope depends on the variant: the stored field is unwindowed, the firm-order gate is windowed."
    constants:
      AGGREGATION_BUFFER_DAYS: 30
    precision: "integer minor currency units, round_half_up per line then summed"
    variants:
      - name: LIFETIME_TOTAL
        when: "Materialising Reinsurer.committed_capacity_minor / available_capacity_minor for GET /reinsurers and GET /reinsurers/{reinsurer_id}"
        difference: "Every live line of the market counts, whatever treaty period its program covers."
      - name: WINDOWED_AT_FIRM_ORDER
        when: "Deciding whether POST /quotes/{quote_id}/firm-order breaches the market's capacity"
        difference: |
          Only lines whose program's treaty period is contemporaneous with the target
          program P count. The aggregation window is CLOSED at both ends and buffered:
            window(P) = [P.inception_date - AGGREGATION_BUFFER_DAYS,
                         P.expiry_date   + AGGREGATION_BUFFER_DAYS]
          A live line counts iff its own program's inception_date lies INSIDE window(P),
          inclusive of both endpoints — a program incepting exactly 30 days before P
          incepts is inside the window and consumes capacity. The gate is
            windowed_committed + round_half_up(Layer.limit_minor * accepted_line_pct / 100)
                <= Reinsurer.capacity_limit_minor
          so equality passes and one minor unit more fails.

  - name: fiduciary_holding
    trigger: "On POST /fiduciary-transactions/{transaction_id}/settle and on POST /fiduciary-transactions/{transaction_id}/reverse"
    algorithm: projection
    formula: |
      INFLOW_TYPES  = {CEDENT_RECEIPT, CLAIM_COLLECTION, REMITTANCE_REVERSAL}
      OUTFLOW_TYPES = {REINSURER_REMITTANCE, BROKERAGE_DEDUCTION,
                       REINSTATEMENT_PREMIUM, CEDENT_PAYOUT}

      # the ledger is append-only: a movement that has settled stays in the projection
      # for ever, even after it is reversed. Its compensating REMITTANCE_REVERSAL row
      # cancels it exactly, so no amount is ever counted twice and none is lost.
      ledger = FiduciaryTransaction rows of this program with status IN {SETTLED, REVERSED}

      Program.fiduciary_holding_minor =
            sum(t.amount_minor for t in ledger if t.txn_type in INFLOW_TYPES)
          - sum(t.amount_minor for t in ledger if t.txn_type in OUTFLOW_TYPES)

      Cedent.settled_receipts_minor =
          sum(t.amount_minor for t in all programs of the cedent
              if t.txn_type == CEDENT_RECEIPT and t.status == SETTLED)
      Cedent.outstanding_reinstatement_premium_minor =
          sum(t.amount_minor for t in all programs of the cedent
              if t.txn_type == REINSTATEMENT_PREMIUM and t.status IN {PENDING, APPROVED})
    input_set: "Rows in status SETTLED or REVERSED only. PENDING, APPROVED and HELD rows are invisible to the balance — approving or holding a movement never moves money."
    constants: {}
    precision: "exact integer minor currency units; no rounding occurs anywhere in this projection"
    worked_example: |
      CEDENT_RECEIPT 97125000 settles          -> fiduciary_holding_minor = 97125000
      REINSURER_REMITTANCE 94696875 settles    -> fiduciary_holding_minor =  2428125
      that remittance is reversed:
        the original row becomes REVERSED but stays in the ledger as an outflow, and a
        REMITTANCE_REVERSAL inflow of 94696875 is appended in status SETTLED
        -> fiduciary_holding_minor = 97125000 exactly, a delta of +94696875 and not one unit more

  - name: renewal_analytics
    trigger: "On POST /programs/{program_id}/renewal-reports"
    algorithm: aggregation
    formula: |
      def bound_limit(P):   return sum(L.limit_minor for L in P.layers if L.status == BOUND)
      def bound_gross(P):   return P.gross_written_premium_minor
      def rate_on_line(P):
          if bound_limit(P) == 0: return 0.0000
          return round_half_up(100 * bound_gross(P) / bound_limit(P), 4)

      current_rate_on_line_pct = rate_on_line(this program)
      prior = Program.prior_program_id
      prior_rate_on_line_pct   = rate_on_line(prior) if prior is not null else 0.0000

      # every downstream figure consumes the ALREADY-ROUNDED value above, never the
      # unrounded ratio — the rounding order is part of the contract
      if prior is null or prior_rate_on_line_pct == 0.0000 or bound_limit(prior) == 0:
          rate_change_pct     = 0.00
          exposure_change_pct = 0.00
      else:
          rate_change_pct     = round_half_up(
              100 * (current_rate_on_line_pct / prior_rate_on_line_pct - 1), 2)
          exposure_change_pct = round_half_up(
              100 * (bound_limit(this) - bound_limit(prior)) / bound_limit(prior), 2)

      risk_adjusted_rate_change_pct = round_half_up(
          rate_change_pct - exposure_change_pct * EXPOSURE_ELASTICITY, 2)

      # placement efficiency: signed capacity against everything ever offered, so
      # RELEASED lines DO count in the denominator — this is the one aggregate in the
      # scaffold that reads released rows
      offered_line_total_pct = sum(S.written_line_pct for S in all SigningLine rows of
                                  this program's layers, any status including RELEASED)
      signed_line_total_pct  = sum(S.signed_line_pct  for S in those rows if S.status == BOUND)
      placement_efficiency_pct = 0.00 if offered_line_total_pct == 0 else round_half_up(
          100 * signed_line_total_pct / offered_line_total_pct, 2)

      market_condition_index = round_half_up(
          INDEX_RATE_WEIGHT * risk_adjusted_rate_change_pct
        + INDEX_EFFICIENCY_WEIGHT * (100 - placement_efficiency_pct), 2)
    input_set: "BOUND layers of this program and of Program.prior_program_id for the rate figures; every SigningLine row of this program's layers — RELEASED included — for the efficiency figure."
    constants:
      EXPOSURE_ELASTICITY: 0.5000
      INDEX_RATE_WEIGHT: 0.6000
      INDEX_EFFICIENCY_WEIGHT: 0.4000
    precision: "rate_on_line 4 decimal places; every other output 2 decimal places; all round_half_up, each stage consuming the previous stage's rounded value"
    worked_example: |
      current program: one BOUND CATASTROPHE layer, limit 1000000000, gross 97125000
      prior program:   one BOUND CATASTROPHE layer, limit  800000000, gross 69825000
      offered lines 35.0000 + 30.0000 + 25.0000 + 20.0000 = 110.0000, signed total 100.0000
        current_rate_on_line_pct      = 9.7125
        prior_rate_on_line_pct        = 8.7281
        rate_change_pct               = 11.28
        exposure_change_pct           = 25.00
        risk_adjusted_rate_change_pct = -1.22
        placement_efficiency_pct      = 90.91
        market_condition_index        = 2.90
      with prior_program_id null and the same current placement:
        rate_change_pct = 0.00, exposure_change_pct = 0.00,
        risk_adjusted_rate_change_pct = 0.00, market_condition_index = 3.64

  - name: contract_certainty_window
    trigger: "On POST /programs (deadline materialised) and on POST /programs/{program_id}/documentation-checkpoint (breach test)"
    algorithm: threshold
    formula: |
      Program.contract_certainty_deadline =
          Program.inception_date + CONTRACT_CERTAINTY_DAYS days

      # the checkpoint is a strict comparison against the logical clock
      breached = current_utc > Program.contract_certainty_deadline
      # current_utc exactly equal to the deadline is NOT a breach

      ContractDocument.days_from_inception =
          floor((ContractDocument.issued_at - Program.inception_date) / 86400 seconds)
          # negative when a slip is filed before inception
    input_set: "One Program plus the logical clock. No other entity participates."
    constants:
      CONTRACT_CERTAINTY_DAYS: 30
      MAX_NEGOTIATION_ROUNDS: 3
    precision: "whole days; instants compared at millisecond resolution"
    worked_example: |
      inception_date 2026-01-01T00:00:00.000Z -> contract_certainty_deadline 2026-01-31T00:00:00.000Z
      clock 2026-01-31T00:00:00.000Z -> not breached; clock 2026-01-31T00:00:00.001Z -> breached
      a SLIP issued at 2026-01-20T12:00:00.000Z has days_from_inception 19

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; the FIRST
# violated rule decides the response, later violations are never reported)
#
# Ladder: authentication -> authorization -> request shape -> existence
#      -> own-state -> cross-entity state -> stale parent version
#      -> regulatory / compliance safety -> temporal windows
#      -> structural constraints -> referential linkage -> fiscal capacity.
#
# Fiscal checks come LAST deliberately: in a placement business the broker must
# be told that the terms themselves are inadmissible (wrong state, suspended
# market, blown deadline, oversized line) before being told the market has run
# out of money for them.
# =============================================================================
validations:

  # ------------------------------------------------------------- authentication
  - priority: 1
    category: auth
    check: "X-User-ID header is present and not blank (an empty-string or whitespace-only header counts as absent)"
    error_id: ERR_MISSING_USER_ID
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "X-User-ID resolves to a known actor — one of the fixed opaque role identities (PlatformAdmin: admin-1; BrokerPlacementLead: lead-1, lead-2; BrokerActuary: act-1; BrokerAccountant: acct-1, acct-2; ComplianceOfficer: compl-1 — a role may have more than one identity, and the segregation-of-duties check at priority 42 compares identities, not roles), or the id of an existing Cedent (CedentUnderwriter) or Reinsurer (ReinsurerUnderwriter)"
    error_id: ERR_UNKNOWN_USER
    http_status: 401
    applies_to: "all endpoints"

  # ------------------------------------------------------------- authorization
  - priority: 3
    category: auth
    check: "the caller's role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 4
    category: auth
    check: "an entity-backed caller may only act on its own resources — a CedentUnderwriter's X-User-ID must equal the target Program.cedent_id, and a ReinsurerUnderwriter's X-User-ID must equal the target MarketSubmission.reinsurer_id / Quote.reinsurer_id"
    error_id: ERR_FOREIGN_RESOURCE
    http_status: 403
    applies_to: "POST /exposure-submissions/{submission_id}/revise, POST /market-submissions/{market_submission_id}/quotes, POST /quotes/{quote_id}/requote, POST /quotes/{quote_id}/decline, POST /brokerage-disclosures/{disclosure_id}/decision, POST /claim-advocacies/{claim_advocacy_id}/withdraw, POST /claim-advocacies/{claim_advocacy_id}/cession-disputes"

  # -------------------------------------------------------------- request shape
  - priority: 5
    category: business_constraint
    check: "every input field without a declared default is present and non-null"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  - priority: 6
    category: business_constraint
    check: "enum values are declared members; numbers respect their declared range and decimal places (money is an integer in minor units, percentages carry at most 4 decimals); datetimes are ISO-8601 UTC instants with exactly three fractional digits; arrays contain only declared members"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  - priority: 7
    category: business_constraint
    check: "pagination limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all collection GET endpoints"

  # ------------------------------------------------------------------ existence
  # Path segments are resolved strictly left to right; a body FK is resolved only
  # after every path segment has resolved.
  - priority: 8
    category: existence
    check: "the {cedent_id} path segment, or a cedent_id supplied in the body, resolves to an existing Cedent"
    error_id: ERR_CEDENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /cedents/{cedent_id}, POST /cedents/{cedent_id}/suspension, GET /cedents/{cedent_id}/programs, POST /programs"

  - priority: 9
    category: existence
    check: "the {reinsurer_id} path segment, or a reinsurer_id supplied in the body, resolves to an existing Reinsurer"
    error_id: ERR_REINSURER_NOT_FOUND
    http_status: 404
    applies_to: "GET /reinsurers/{reinsurer_id}, POST /reinsurers/{reinsurer_id}/security-status, GET /reinsurers/{reinsurer_id}/signing-lines, GET /reinsurers/{reinsurer_id}/market-submissions, POST /layers/{layer_id}/market-submissions"

  - priority: 10
    category: existence
    check: "the {program_id} path segment resolves to an existing Program"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "every /programs/{program_id}... endpoint"

  - priority: 11
    category: existence
    check: "a non-null prior_program_id in the body resolves to an existing Program"
    error_id: ERR_PRIOR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "POST /programs"

  - priority: 12
    category: existence
    check: "the {submission_id} path segment resolves to an existing ExposureSubmission"
    error_id: ERR_EXPOSURE_SUBMISSION_NOT_FOUND
    http_status: 404
    applies_to: "every /exposure-submissions/{submission_id}... endpoint"

  - priority: 13
    category: existence
    check: "the {layer_id} path segment resolves to an existing Layer"
    error_id: ERR_LAYER_NOT_FOUND
    http_status: 404
    applies_to: "every /layers/{layer_id}... endpoint"

  - priority: 14
    category: existence
    check: "the {market_submission_id} path segment resolves to an existing MarketSubmission"
    error_id: ERR_MARKET_SUBMISSION_NOT_FOUND
    http_status: 404
    applies_to: "every /market-submissions/{market_submission_id}... endpoint"

  - priority: 15
    category: existence
    check: "the {quote_id} path segment resolves to an existing Quote"
    error_id: ERR_QUOTE_NOT_FOUND
    http_status: 404
    applies_to: "every /quotes/{quote_id}... endpoint"

  - priority: 16
    category: existence
    check: "the {signing_line_id} path segment, or a non-null signing_line_id supplied in the body, resolves to an existing SigningLine"
    error_id: ERR_SIGNING_LINE_NOT_FOUND
    http_status: 404
    applies_to: "POST /signing-lines/{signing_line_id}/release, GET /signing-lines/{signing_line_id}, POST /programs/{program_id}/fiduciary-transactions, POST /claim-advocacies/{claim_advocacy_id}/cession-disputes"

  - priority: 17
    category: existence
    check: "the {disclosure_id} path segment resolves to an existing BrokerageDisclosure"
    error_id: ERR_DISCLOSURE_NOT_FOUND
    http_status: 404
    applies_to: "every /brokerage-disclosures/{disclosure_id}... endpoint"

  - priority: 18
    category: existence
    check: "the {transaction_id} path segment resolves to an existing FiduciaryTransaction"
    error_id: ERR_TRANSACTION_NOT_FOUND
    http_status: 404
    applies_to: "every /fiduciary-transactions/{transaction_id}... endpoint"

  - priority: 19
    category: existence
    check: "the {claim_advocacy_id} path segment resolves to an existing ClaimAdvocacy"
    error_id: ERR_CLAIM_ADVOCACY_NOT_FOUND
    http_status: 404
    applies_to: "every /claim-advocacies/{claim_advocacy_id}... endpoint"

  - priority: 20
    category: existence
    check: "the {dispute_id} path segment resolves to an existing CessionDispute"
    error_id: ERR_CESSION_DISPUTE_NOT_FOUND
    http_status: 404
    applies_to: "POST /cession-disputes/{dispute_id}/resolve, GET /cession-disputes/{dispute_id}"

  # ------------------------------------------------------------------ own state
  - priority: 21
    category: state
    check: "Program.placement_status is in the set the action declares in §1.2 — go-to-market requires SUBMISSION_READY, bind requires FIRM_ORDER, settle requires BOUND, withdraw requires one of DRAFT / SUBMISSION_READY / IN_MARKET / FIRM_ORDER, market-sweep requires IN_MARKET, renewal-reports requires BOUND or SETTLED"
    error_id: ERR_PROGRAM_STATE_INVALID
    http_status: 409
    applies_to: "POST /programs/{program_id}/go-to-market, /bind, /settle, /withdraw, /market-sweep, /renewal-reports"

  - priority: 22
    category: state
    check: "Program.documentation_status admits the filed document_type — SLIP from NOT_STARTED, WORDING_DRAFT from SLIP_ISSUED, AGREED_WORDING from WORDING_DRAFTED or CERTAINTY_BREACHED, EXECUTED_CONTRACT from WORDING_AGREED"
    error_id: ERR_DOCUMENT_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /programs/{program_id}/contract-documents"

  - priority: 23
    category: state
    check: "ExposureSubmission.status admits the action — submit-for-review requires DRAFT, signoff requires ACTUARY_REVIEW, revise requires REJECTED"
    error_id: ERR_SUBMISSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /exposure-submissions/{submission_id}/submit-for-review, /signoff, /revise"

  - priority: 24
    category: state
    check: "Layer.status admits the action — market-submissions require OPEN or IN_MARKET, PATCH requires OPEN, sign-down requires OVERSUBSCRIBED. Claim notification is NOT covered here: the BOUND requirement for POST /layers/{layer_id}/claim-advocacies belongs to validations[priority=33] alone, so exactly one error is possible on that path"
    error_id: ERR_LAYER_STATE_INVALID
    http_status: 409
    applies_to: "PATCH /layers/{layer_id}, POST /layers/{layer_id}/market-submissions, /sign-down"

  - priority: 25
    category: state
    check: "MarketSubmission.status == SENT when a quote is created against it"
    error_id: ERR_MARKET_SUBMISSION_CLOSED
    http_status: 409
    applies_to: "POST /market-submissions/{market_submission_id}/quotes"

  - priority: 26
    category: state
    check: "Quote.status admits the action — counter requires QUOTED or REQUOTED, requote requires COUNTERED, firm-order requires QUOTED or REQUOTED, decline requires QUOTED / COUNTERED / REQUOTED"
    error_id: ERR_QUOTE_STATE_INVALID
    http_status: 409
    applies_to: "POST /quotes/{quote_id}/counter, /requote, /firm-order, /decline"

  - priority: 27
    category: state
    check: "SigningLine.status IN {PROVISIONAL, SIGNED} when it is released; a BOUND or already RELEASED line cannot be released"
    error_id: ERR_SIGNING_LINE_STATE_INVALID
    http_status: 409
    applies_to: "POST /signing-lines/{signing_line_id}/release"

  - priority: 28
    category: state
    check: "BrokerageDisclosure.status admits the action — disclose requires DRAFT, decision requires DISCLOSED"
    error_id: ERR_DISCLOSURE_STATE_INVALID
    http_status: 409
    applies_to: "POST /brokerage-disclosures/{disclosure_id}/disclose, /decision"

  - priority: 29
    category: state
    check: "FiduciaryTransaction.status admits the action — approve requires PENDING, settle requires APPROVED, reverse requires SETTLED"
    error_id: ERR_TRANSACTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /fiduciary-transactions/{transaction_id}/approve, /settle, /reverse"

  - priority: 30
    category: state
    check: "ClaimAdvocacy.status admits the action — review requires NOTIFIED, withdraw requires NOTIFIED, cession-disputes require UNDER_REVIEW or DISPUTED, advocacy-route requires DISPUTED, collections require UNDER_REVIEW / ADVOCACY_NEGOTIATION / ADVOCACY_ARBITRATION / RESOLVED"
    error_id: ERR_ADVOCACY_STATE_INVALID
    http_status: 409
    applies_to: "POST /claim-advocacies/{claim_advocacy_id}/review, /withdraw, /cession-disputes, /advocacy-route, /collections"

  - priority: 31
    category: state
    check: "CessionDispute.status == RAISED when it is resolved"
    error_id: ERR_DISPUTE_STATE_INVALID
    http_status: 409
    applies_to: "POST /cession-disputes/{dispute_id}/resolve"

  # --------------------------------------------------------- cross-entity state
  - priority: 32
    category: state
    check: "the Program owning the target Layer / MarketSubmission / Quote is in the placement_status the action needs — market-submissions and quotes need IN_MARKET, sign-down and signing-line release need FIRM_ORDER, layer creation and PATCH need DRAFT or SUBMISSION_READY"
    error_id: ERR_PROGRAM_STATE_INVALID
    http_status: 409
    applies_to: "POST /programs/{program_id}/layers, PATCH /layers/{layer_id}, POST /layers/{layer_id}/market-submissions, POST /market-submissions/{market_submission_id}/quotes, POST /quotes/{quote_id}/firm-order, POST /layers/{layer_id}/sign-down, POST /signing-lines/{signing_line_id}/release"

  - priority: 33
    category: state
    check: "the Layer the loss is ceded to has status == BOUND before any ClaimAdvocacy may be notified against it"
    error_id: ERR_LAYER_NOT_BOUND
    http_status: 409
    applies_to: "POST /layers/{layer_id}/claim-advocacies"

  - priority: 34
    category: state
    check: "Program.documentation_status IN {WORDING_AGREED, EXECUTED} before a REINSURER_REMITTANCE or REINSTATEMENT_PREMIUM movement may settle — contract certainty gates the money, not the booking"
    error_id: ERR_DOCUMENTATION_NOT_AGREED
    http_status: 409
    applies_to: "POST /fiduciary-transactions/{transaction_id}/settle"

  # ------------------------------------------------------ stale parent version
  - priority: 35
    category: state
    check: "expected_layer_version equals the current Layer.version (per §1.2.1 firm-order-stale-layer)"
    error_id: ERR_STALE_LAYER_VERSION
    http_status: 412
    applies_to: "POST /quotes/{quote_id}/firm-order"

  - priority: 36
    category: state
    check: "expected_program_version equals the current Program.version (per §1.2.1 fiduciary-booking-stale-program)"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /programs/{program_id}/fiduciary-transactions"

  # --------------------------------------------- regulatory / compliance safety
  - priority: 37
    category: business_safety
    check: "the target Reinsurer.security_status is not SUSPENDED — a suspended market may neither receive a submission nor be firm-ordered"
    error_id: ERR_MARKET_SUSPENDED
    http_status: 422
    applies_to: "POST /layers/{layer_id}/market-submissions, POST /quotes/{quote_id}/firm-order"

  - priority: 38
    category: business_safety
    check: "is_lead may be true only when the quoting Reinsurer has lead_authorised == true AND security_status == APPROVED; a RESTRICTED market may follow but never lead"
    error_id: ERR_LEAD_NOT_AUTHORISED
    http_status: 422
    applies_to: "POST /market-submissions/{market_submission_id}/quotes, POST /quotes/{quote_id}/requote"

  - priority: 39
    category: business_safety
    check: "Cedent.status == ACTIVE when the program is taken to market"
    error_id: ERR_CEDENT_SUSPENDED
    http_status: 422
    applies_to: "POST /programs/{program_id}/go-to-market"

  - priority: 40
    category: business_safety
    check: "ExposureSubmission.completeness_score >= SIGNOFF_MIN_SCORE (70.00) before an actuary may sign off; exactly 70.00 passes"
    error_id: ERR_SIGNOFF_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /exposure-submissions/{submission_id}/signoff with decision=SIGNED_OFF"

  - priority: 41
    category: business_safety
    check: "Program.disclosure_acknowledged == true before binding — brokerage compensation must be disclosed to and acknowledged by the cedent first"
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /programs/{program_id}/bind"

  - priority: 42
    category: business_safety
    check: "the approving X-User-ID differs from FiduciaryTransaction.created_by_user_id — the user who books fiduciary money can never approve it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /fiduciary-transactions/{transaction_id}/approve"

  # ---------------------------------------------------------- temporal windows
  - priority: 43
    category: business_temporal
    check: "expiry_date is strictly after inception_date; the treaty period is the half-open interval [inception_date, expiry_date)"
    error_id: ERR_TREATY_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /programs"

  - priority: 44
    category: business_temporal
    check: "response_deadline (market submission) and expires_at (quote) are strictly after the current logical clock at the time of the call"
    error_id: ERR_DEADLINE_NOT_IN_FUTURE
    http_status: 422
    applies_to: "POST /layers/{layer_id}/market-submissions, POST /market-submissions/{market_submission_id}/quotes, POST /quotes/{quote_id}/requote"

  - priority: 45
    category: business_temporal
    check: "the current logical clock is <= MarketSubmission.response_deadline when the market quotes; equality still admits the quote"
    error_id: ERR_RESPONSE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /market-submissions/{market_submission_id}/quotes"

  - priority: 46
    category: business_temporal
    check: "the current logical clock is strictly before Quote.expires_at when the quote is countered or firm-ordered; a clock exactly equal to expires_at has already lapsed"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 422
    applies_to: "POST /quotes/{quote_id}/counter, POST /quotes/{quote_id}/firm-order"

  - priority: 47
    category: business_temporal
    check: "ClaimAdvocacy.event_date lies inside the half-open treaty period [Program.inception_date, Program.expiry_date) — an event exactly at inception is covered, an event exactly at expiry is not"
    error_id: ERR_EVENT_DATE_OUT_OF_PERIOD
    http_status: 422
    applies_to: "POST /layers/{layer_id}/claim-advocacies"

  - priority: 48
    category: business_temporal
    check: "the current logical clock is strictly after Program.contract_certainty_deadline when the documentation checkpoint is run; equality is not yet a breach"
    error_id: ERR_CERTAINTY_NOT_BREACHED
    http_status: 422
    applies_to: "POST /programs/{program_id}/documentation-checkpoint"

  # ---------------------------------------------------- structural constraints
  - priority: 49
    category: business_constraint
    check: "Cedent.name and Reinsurer.name are each unique across their collection"
    error_id: ERR_DUPLICATE_NAME
    http_status: 409
    applies_to: "POST /cedents, POST /reinsurers"

  - priority: 50
    category: business_constraint
    check: "no other Program of the same cedent_id and line_of_business whose placement_status != WITHDRAWN has a treaty period overlapping this one; periods are half-open, so a program incepting exactly when another expires does NOT overlap"
    error_id: ERR_OVERLAPPING_TREATY_PERIOD
    http_status: 409
    applies_to: "POST /programs"

  - priority: 51
    category: business_referential
    check: "when prior_program_id is supplied it must reference a Program of the same cedent_id and line_of_business whose underwriting_year is exactly this program's underwriting_year minus one"
    error_id: ERR_RENEWAL_PRIOR_MISMATCH
    http_status: 422
    applies_to: "POST /programs"

  - priority: 52
    category: business_constraint
    check: "layer structure is coherent — QUOTA_SHARE requires attachment_minor == 0, cession_pct > 0 and base_rate_pct == cession_pct; EXCESS_OF_LOSS and CATASTROPHE require attachment_minor > 0 and cession_pct == 0 and ceding_commission_pct == 0"
    error_id: ERR_LAYER_STRUCTURE_INVALID
    http_status: 422
    applies_to: "POST /programs/{program_id}/layers, PATCH /layers/{layer_id}"

  - priority: 53
    category: business_constraint
    check: "sublimit_minor is 0 or <= limit_minor"
    error_id: ERR_SUBLIMIT_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /programs/{program_id}/layers, PATCH /layers/{layer_id}"

  - priority: 54
    category: business_constraint
    check: "no other MarketSubmission for the same (layer_id, reinsurer_id) is in status SENT or QUOTED"
    error_id: ERR_DUPLICATE_MARKET_SUBMISSION
    http_status: 409
    applies_to: "POST /layers/{layer_id}/market-submissions"

  - priority: 55
    category: business_constraint
    check: "accepted_line_pct <= Quote.offered_line_pct — the broker may firm-order less than a market offered but never more"
    error_id: ERR_LINE_EXCEEDS_OFFER
    http_status: 422
    applies_to: "POST /quotes/{quote_id}/firm-order"

  - priority: 56
    category: business_constraint
    check: "accepted_line_pct <= Reinsurer.max_line_pct — the market's per-layer line cap; equality passes"
    error_id: ERR_LINE_EXCEEDS_MAX_LINE
    http_status: 422
    applies_to: "POST /quotes/{quote_id}/firm-order"

  - priority: 57
    category: business_constraint
    check: "Quote.negotiation_round < MAX_NEGOTIATION_ROUNDS (3) before a further broker counter is accepted"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /quotes/{quote_id}/counter"

  - priority: 58
    category: business_constraint
    check: "Layer.written_line_total_pct > 100.0000 strictly before a sign-down is admitted — a layer sitting at exactly 100.0000 is fully placed and has nothing to sign down"
    error_id: ERR_LAYER_NOT_OVERSUBSCRIBED
    http_status: 422
    applies_to: "POST /layers/{layer_id}/sign-down"

  - priority: 59
    category: business_constraint
    check: "under Program.signdown_method == LEAD_PROTECTED exactly one PROVISIONAL SigningLine of the layer must derive from a Quote with is_lead == true"
    error_id: ERR_LEAD_LINE_MISSING
    http_status: 422
    applies_to: "POST /layers/{layer_id}/sign-down"

  - priority: 60
    category: business_constraint
    check: "BrokerageDisclosure.brokerage_pct equals the owning Program.brokerage_pct at disclosure time"
    error_id: ERR_DISCLOSURE_PCT_MISMATCH
    http_status: 422
    applies_to: "POST /brokerage-disclosures/{disclosure_id}/disclose"

  - priority: 61
    category: business_constraint
    check: "ClaimAdvocacy.claim_reference is unique among the advocacies of the same layer"
    error_id: ERR_DUPLICATE_CLAIM_REFERENCE
    http_status: 409
    applies_to: "POST /layers/{layer_id}/claim-advocacies"

  - priority: 62
    category: business_constraint
    check: "signing_line_id is supplied for txn_type IN {REINSURER_REMITTANCE, REINSTATEMENT_PREMIUM, CLAIM_COLLECTION} and omitted for every other txn_type; REMITTANCE_REVERSAL may never be booked through the API"
    error_id: ERR_TRANSACTION_TYPE_LINK_INVALID
    http_status: 422
    applies_to: "POST /programs/{program_id}/fiduciary-transactions"

  - priority: 63
    category: business_referential
    check: "a supplied signing_line_id belongs to a Layer of the same Program (fiduciary transactions) or to the Layer of the advocacy under dispute (cession disputes)"
    error_id: ERR_LINE_LAYER_MISMATCH
    http_status: 422
    applies_to: "POST /programs/{program_id}/fiduciary-transactions, POST /claim-advocacies/{claim_advocacy_id}/cession-disputes"

  - priority: 64
    category: business_constraint
    check: "no REMITTANCE_REVERSAL row already carries reverses_transaction_id == this transaction's id"
    error_id: ERR_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /fiduciary-transactions/{transaction_id}/reverse"

  - priority: 65
    category: business_constraint
    check: "the settled_minor supplied at resolution matches the resolution — 0 for UPHELD, exactly disputed_minor for WITHDRAWN, strictly between 0 and disputed_minor for SETTLED_PARTIAL"
    error_id: ERR_RESOLUTION_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /cession-disputes/{dispute_id}/resolve"

  - priority: 66
    category: business_constraint
    check: "no CLAIM_COLLECTION may be booked while the advocacy sits in ADVOCACY_ARBITRATION — the arbitration branch freezes collections until it joins at RESOLVED"
    error_id: ERR_COLLECTION_BLOCKED_BY_ARBITRATION
    http_status: 422
    applies_to: "POST /claim-advocacies/{claim_advocacy_id}/collections"

  # ------------------------------------------------------------ fiscal capacity
  - priority: 67
    category: business_fiscal
    check: "the market's windowed committed capacity plus this line's capacity is <= Reinsurer.capacity_limit_minor, per calculations.reinsurer_aggregate_capacity variant WINDOWED_AT_FIRM_ORDER; exact equality passes"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /quotes/{quote_id}/firm-order"

  - priority: 68
    category: business_fiscal
    check: "the layer's aggregate_available_minor is > 0 when a loss is ceded — limit plus reinstatements fully eroded means nothing left to cede"
    error_id: ERR_AGGREGATE_LIMIT_EXHAUSTED
    http_status: 422
    applies_to: "POST /layers/{layer_id}/claim-advocacies"

  - priority: 69
    category: business_fiscal
    check: "the sum of disputed_minor across an advocacy's RAISED / UPHELD / SETTLED_PARTIAL disputes may not exceed ClaimAdvocacy.ceded_claim_minor"
    error_id: ERR_DISPUTE_EXCEEDS_CESSION
    http_status: 422
    applies_to: "POST /claim-advocacies/{claim_advocacy_id}/cession-disputes"

  - priority: 70
    category: business_fiscal
    check: "ClaimAdvocacy.collected_minor + this collection's amount_minor <= ClaimAdvocacy.collectible_minor; exact equality closes the file"
    error_id: ERR_COLLECTION_EXCEEDS_COLLECTIBLE
    http_status: 422
    applies_to: "POST /claim-advocacies/{claim_advocacy_id}/collections"

  - priority: 71
    category: business_fiscal
    check: "an outflow movement's amount_minor is <= Program.fiduciary_holding_minor at settlement — fiduciary funds may never be overdrawn"
    error_id: ERR_INSUFFICIENT_FIDUCIARY_BALANCE
    http_status: 422
    applies_to: "POST /fiduciary-transactions/{transaction_id}/settle"

  - priority: 72
    category: business_fiscal
    check: "no FiduciaryTransaction of the program remains in status PENDING, APPROVED or HELD when the program is settled"
    error_id: ERR_PROGRAM_HAS_OPEN_TRANSACTIONS
    http_status: 409
    applies_to: "POST /programs/{program_id}/settle"

# =============================================================================
# §1.5 API Endpoint Table
#
# Flat root-level collections (api_prefix is ""). Every entity that needs to be
# discovered has BOTH a single-resource GET (`/<collection>/{id}`) and either a
# sub-resource listing on its parent or a filtered list carrying its FK fields,
# so every §1.1 FK is reverse-reachable.
#
# Path parameters are NOT repeated in `input:` — `input:` lists body / query
# fields only. Every query filter is declared optional so a bare call is legal.
# =============================================================================
endpoints:

  # ------------------------------------------------- logical clock (test-driving)
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Every deadline, expiry, treaty-period and contract-certainty comparison in this API reads this clock and never the wall clock. Before the first call the clock reads exactly 2026-08-01T00:00:00.000Z — that startup default is mandatory and MUST NOT fall back to real time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["no entity is mutated; subsequent requests evaluate every temporal rule against the new instant"]

  # ------------------------------------------------------------------- Cedent ---
  - method: POST
    path: "/cedents"
    description: "Register a ceding insurer"
    roles: [PlatformAdmin]
    code: 201
    input: [name, domicile_code, financial_rating]
    output: Cedent
    side_effects: ["status defaults to ACTIVE", "settled_receipts_minor and outstanding_reinstatement_premium_minor initialise to 0"]

  - method: GET
    path: "/cedents"
    description: "List cedents"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: ["status?", "financial_rating?", "limit?", "offset?"]
    output: Cedent[]
    side_effects: []

  - method: GET
    path: "/cedents/{cedent_id}"
    description: "Read one cedent with its live fiduciary aggregates"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: []
    output: Cedent
    side_effects: []

  - method: POST
    path: "/cedents/{cedent_id}/suspension"
    description: "Set a cedent's ACTIVE / SUSPENDED posture"
    roles: [ComplianceOfficer]
    code: 200
    input: [status, suspension_reason]
    output: Cedent
    side_effects: ["Cedent.status and suspension_reason updated", "a SUSPENDED cedent can no longer take any program to market; programs already IN_MARKET are untouched"]

  - method: GET
    path: "/cedents/{cedent_id}/programs"
    description: "Every treaty program placed for this cedent (FK reverse-reachability for Program.cedent_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: ["placement_status?", "line_of_business?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  # ---------------------------------------------------------------- Reinsurer ---
  - method: POST
    path: "/reinsurers"
    description: "Register a reinsurance market"
    roles: [PlatformAdmin]
    code: 201
    input: [name, security_rating, capacity_limit_minor, max_line_pct, "lead_authorised?"]
    output: Reinsurer
    side_effects: ["security_status defaults to APPROVED", "committed_capacity_minor initialises to 0 and available_capacity_minor to capacity_limit_minor"]

  - method: GET
    path: "/reinsurers"
    description: "List markets with live capacity aggregates"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: ["security_status?", "security_rating?", "lead_authorised?", "limit?", "offset?"]
    output: Reinsurer[]
    side_effects: []

  - method: GET
    path: "/reinsurers/{reinsurer_id}"
    description: "Read one market; committed_capacity_minor is materialised per calculations.reinsurer_aggregate_capacity variant LIFETIME_TOTAL"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: []
    output: Reinsurer
    side_effects: []

  - method: POST
    path: "/reinsurers/{reinsurer_id}/security-status"
    description: "Set a market's security posture; SUSPENDED triggers the security cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: [security_status, reason]
    output: Reinsurer
    side_effects:
      - "Reinsurer.security_status updated"
      - "on SUSPENDED: every SigningLine of this market with status IN {PROVISIONAL, SIGNED} on a non-BOUND layer becomes RELEASED with release_reason = SECURITY_FAILURE (hop 1)"
      - "each affected Layer recomputes written_line_total_pct / signed_line_total_pct and reverts FULLY_PLACED or OVERSUBSCRIBED to PARTIALLY_PLACED (hop 2)"
      - "each affected Program in FIRM_ORDER reverts to IN_MARKET (hop 3)"
      - "each affected Quote in FIRM_ORDER becomes LAPSED"
      - "committed_capacity_minor and available_capacity_minor recomputed"

  - method: GET
    path: "/reinsurers/{reinsurer_id}/signing-lines"
    description: "Every line this market has written (FK reverse-reachability for SigningLine.reinsurer_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SigningLine[]
    side_effects: []

  - method: GET
    path: "/reinsurers/{reinsurer_id}/market-submissions"
    description: "Every submission sent to this market (FK reverse-reachability for MarketSubmission.reinsurer_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MarketSubmission[]
    side_effects: []

  # ------------------------------------------------------------------ Program ---
  - method: POST
    path: "/programs"
    description: "Open a treaty placement file"
    roles: [BrokerPlacementLead]
    code: 201
    input: [cedent_id, program_name, line_of_business, underwriting_year, inception_date, expiry_date, estimated_premium_income_minor, "prior_program_id?", "currency_code?", "brokerage_pct?", "signdown_method?"]
    output: Program
    side_effects:
      - "placement_status = DRAFT, documentation_status = NOT_STARTED"
      - "contract_certainty_deadline computed per calculations.contract_certainty_window"
      - "gross_written_premium_minor, brokerage_earned_minor, net_remittance_minor, rounding_residue_minor and fiduciary_holding_minor initialise to 0"

  - method: GET
    path: "/programs"
    description: "List programs; carries every Program FK as a filter (cedent_id, prior_program_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: ["cedent_id?", "prior_program_id?", "line_of_business?", "underwriting_year?", "placement_status?", "documentation_status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: GET
    path: "/programs/{program_id}"
    description: "Read one program with both state dimensions, the fiduciary balance and the placement money"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/go-to-market"
    description: "Release a submission-ready program to the market"
    roles: [BrokerPlacementLead]
    code: 200
    input: []
    output: Program
    side_effects: ["placement_status SUBMISSION_READY -> IN_MARKET", "increments Program.version"]

  - method: POST
    path: "/programs/{program_id}/bind"
    description: "Bind the placement once every layer is fully placed or signed down"
    roles: [BrokerPlacementLead]
    code: 200
    input: []
    output: Program
    side_effects:
      - "layers FULLY_PLACED / SIGNED_DOWN -> BOUND; PROVISIONAL lines take signed_line_pct = written_line_pct; lines -> BOUND; FIRM_ORDER quotes -> BOUND"
      - "gross_written_premium_minor, brokerage_earned_minor, net_remittance_minor and rounding_residue_minor computed per calculations.brokerage_and_net_remittance"
      - "provisional_ceding_commission_minor set on every BOUND QUOTA_SHARE layer per calculations.ceding_commission_settlement variant PROVISIONAL_FLAT"
      - "placement_status FIRM_ORDER -> BOUND"
      - "increments Program.version"

  - method: POST
    path: "/programs/{program_id}/settle"
    description: "Close the placement year: reconcile the provisional ceding commission against realised experience"
    roles: [BrokerAccountant]
    code: 200
    input: []
    output: Program
    side_effects:
      - "loss_ratio_pct, final_ceding_commission_minor and ceding_commission_delta_minor set per calculations.ceding_commission_settlement variant FINAL_SLIDING"
      - "placement_status BOUND -> SETTLED"
      - "increments Program.version"

  - method: POST
    path: "/programs/{program_id}/withdraw"
    description: "Abandon a placement and hand every reserved line back to the market"
    roles: [BrokerPlacementLead]
    code: 200
    input: [reason]
    output: Program
    side_effects:
      - "non-BOUND layers -> LAPSED; PROVISIONAL / SIGNED lines -> RELEASED (PROGRAM_WITHDRAWN); open quotes -> LAPSED; SENT / QUOTED submissions -> CLOSED"
      - "committed_capacity_minor recomputed for every affected market"
      - "placement_status -> WITHDRAWN, withdrawal_reason recorded"
      - "increments Program.version"

  - method: POST
    path: "/programs/{program_id}/market-sweep"
    description: "Age the market: expire submissions and quotes whose deadlines the logical clock has passed"
    roles: [BrokerPlacementLead]
    code: 200
    input: []
    output: Program
    side_effects:
      - "every MarketSubmission of this program's layers in status SENT whose response_deadline <= current_utc becomes EXPIRED"
      - "every Quote of this program's layers in status IN {QUOTED, COUNTERED, REQUOTED} whose expires_at <= current_utc becomes LAPSED"
      - "layer and program statuses are NOT changed — an unplaced layer stays IN_MARKET"

  - method: POST
    path: "/programs/{program_id}/documentation-checkpoint"
    description: "Compliance test of contract certainty against the logical clock"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Program
    side_effects:
      - "documentation_status -> CERTAINTY_BREACHED when current_utc > contract_certainty_deadline and documentation_status IN {NOT_STARTED, SLIP_ISSUED, WORDING_DRAFTED}"
      - "every REINSURER_REMITTANCE / REINSTATEMENT_PREMIUM movement of this program in status PENDING or APPROVED becomes HELD with hold_reason = 'CONTRACT_CERTAINTY_BREACHED'"
      - "increments Program.version"

  - method: POST
    path: "/programs/{program_id}/exposure-submissions"
    description: "Package the cedent's exposure data for the market"
    roles: [BrokerPlacementLead, CedentUnderwriter]
    code: 201
    input: [package_label, exposure_records_count, data_quality_flags_count, historical_years_supplied, cat_model_version, loss_history_completeness_pct, "actuarial_report_attached?"]
    output: ExposureSubmission
    side_effects: ["status = DRAFT", "completeness_score computed per calculations.submission_completeness_score"]

  - method: GET
    path: "/programs/{program_id}/exposure-submissions"
    description: "Exposure packages of this program (FK reverse-reachability for ExposureSubmission.program_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExposureSubmission[]
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/layers"
    description: "Add a layer to the program structure"
    roles: [BrokerPlacementLead]
    code: 201
    input: [layer_label, layer_type, attachment_minor, limit_minor, base_rate_pct, subject_premium_base_minor, expected_loss_cost_minor, "cession_pct?", "reinstatements_total?", "reinstatement_premium_pct?", "sublimit_minor?", "ceding_commission_pct?", "excluded_perils?"]
    output: Layer
    side_effects: ["status = OPEN", "quoted_gross_premium_minor computed per calculations.layer_technical_premium", "written_line_total_pct and signed_line_total_pct initialise to 0.0000"]

  - method: GET
    path: "/programs/{program_id}/layers"
    description: "Layers of this program (FK reverse-reachability for Layer.program_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter, ReinsurerUnderwriter]
    code: 200
    input: ["status?", "layer_type?", "limit?", "offset?"]
    output: Layer[]
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/contract-documents"
    description: "File a slip-to-contract document; drives the documentation_status dimension"
    roles: [BrokerPlacementLead]
    code: 201
    input: [document_type, wording_reference]
    output: ContractDocument
    side_effects:
      - "append-only ContractDocument with issued_at = current_utc and days_from_inception computed"
      - "documentation_status advances (SLIP -> SLIP_ISSUED, WORDING_DRAFT -> WORDING_DRAFTED, AGREED_WORDING -> WORDING_AGREED, EXECUTED_CONTRACT -> EXECUTED)"
      - "on AGREED_WORDING every HELD FiduciaryTransaction of the program returns to PENDING with hold_reason and approved_by_user_id cleared"
      - "increments Program.version"

  - method: GET
    path: "/programs/{program_id}/contract-documents"
    description: "Documentation trail of this program (FK reverse-reachability for ContractDocument.program_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: ["document_type?", "limit?", "offset?"]
    output: ContractDocument[]
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/brokerage-disclosures"
    description: "Draft the intermediary's compensation disclosure"
    roles: [BrokerAccountant]
    code: 201
    input: [brokerage_pct, "contingent_commission_pct?", "market_service_fee_minor?"]
    output: BrokerageDisclosure
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/programs/{program_id}/brokerage-disclosures"
    description: "Disclosures of this program (FK reverse-reachability for BrokerageDisclosure.program_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BrokerageDisclosure[]
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/fiduciary-transactions"
    description: "Book a movement on the program's fiduciary premium account. Optimistic concurrency: expected_program_version must match Program.version (§1.2.1 fiduciary-booking-stale-program)."
    roles: [BrokerAccountant]
    code: 201
    input: [txn_type, amount_minor, expected_program_version, "signing_line_id?"]
    output: FiduciaryTransaction
    side_effects:
      - "status = PENDING, created_by_user_id = X-User-ID"
      - "no money moves yet — fiduciary_holding_minor is unchanged until the movement settles"
      - "increments Program.version by 1"

  - method: GET
    path: "/programs/{program_id}/fiduciary-transactions"
    description: "Fiduciary ledger of this program (FK reverse-reachability for FiduciaryTransaction.program_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerAccountant, ComplianceOfficer]
    code: 200
    input: ["txn_type?", "status?", "limit?", "offset?"]
    output: FiduciaryTransaction[]
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/renewal-reports"
    description: "Generate renewal analytics and a market-condition reading for this program"
    roles: [BrokerActuary]
    code: 201
    input: []
    output: RenewalReport
    side_effects: ["append-only RenewalReport with as_of = current_utc and every figure computed per calculations.renewal_analytics"]

  - method: GET
    path: "/programs/{program_id}/renewal-reports"
    description: "Renewal reports of this program (FK reverse-reachability for RenewalReport.program_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: ["limit?", "offset?"]
    output: RenewalReport[]
    side_effects: []

  # -------------------------------------------------------- ExposureSubmission ---
  - method: GET
    path: "/exposure-submissions/{submission_id}"
    description: "Read one exposure package with its completeness score"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: []
    output: ExposureSubmission
    side_effects: []

  - method: POST
    path: "/exposure-submissions/{submission_id}/submit-for-review"
    description: "Send the exposure package to the broker actuary"
    roles: [BrokerPlacementLead]
    code: 200
    input: []
    output: ExposureSubmission
    side_effects: ["completeness_score recomputed", "status DRAFT -> ACTUARY_REVIEW"]

  - method: POST
    path: "/exposure-submissions/{submission_id}/signoff"
    description: "Actuarial sign-off or rejection of the exposure package"
    roles: [BrokerActuary]
    code: 200
    input: [decision, "review_note?"]
    output: ExposureSubmission
    side_effects:
      - "decision=SIGNED_OFF: status -> SIGNED_OFF, actuary_signoff_user_id and signed_off_at stamped, every other SIGNED_OFF submission of the program -> SUPERSEDED, and Program.placement_status DRAFT -> SUBMISSION_READY (bubble-up)"
      - "decision=REJECTED: status -> REJECTED, Program.placement_status unchanged"

  - method: POST
    path: "/exposure-submissions/{submission_id}/revise"
    description: "Cedent resupplies exposure data after a rejection"
    roles: [CedentUnderwriter]
    code: 200
    input: ["exposure_records_count?", "data_quality_flags_count?", "historical_years_supplied?", "cat_model_version?", "loss_history_completeness_pct?", "actuarial_report_attached?"]
    output: ExposureSubmission
    side_effects: ["supplied fields overwritten", "completeness_score recomputed", "status REJECTED -> DRAFT"]

  # -------------------------------------------------------------------- Layer ---
  - method: GET
    path: "/layers/{layer_id}"
    description: "Read one layer with its placement totals, erosion and commission figures. `version` is the OCC token for firm orders."
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter, ReinsurerUnderwriter]
    code: 200
    input: []
    output: Layer
    side_effects: []

  - method: PATCH
    path: "/layers/{layer_id}"
    description: "Restructure a layer while it is still OPEN"
    roles: [BrokerPlacementLead]
    code: 200
    input: ["layer_label?", "attachment_minor?", "limit_minor?", "base_rate_pct?", "subject_premium_base_minor?", "expected_loss_cost_minor?", "cession_pct?", "reinstatements_total?", "reinstatement_premium_pct?", "sublimit_minor?", "ceding_commission_pct?", "excluded_perils?"]
    output: Layer
    side_effects: ["quoted_gross_premium_minor recomputed per calculations.layer_technical_premium", "increments Layer.version by 1"]

  - method: POST
    path: "/layers/{layer_id}/market-submissions"
    description: "Send this layer to a reinsurance market"
    roles: [BrokerPlacementLead]
    code: 201
    input: [reinsurer_id, response_deadline]
    output: MarketSubmission
    side_effects:
      - "status = SENT, sent_at = current_utc, submitted_by_user_id = X-User-ID"
      - "the first submission moves Layer.status OPEN -> IN_MARKET and freezes quoted_gross_premium_minor"
      - "increments Layer.version by 1"

  - method: GET
    path: "/layers/{layer_id}/market-submissions"
    description: "Submissions on this layer (FK reverse-reachability for MarketSubmission.layer_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: ["status?", "reinsurer_id?", "limit?", "offset?"]
    output: MarketSubmission[]
    side_effects: []

  - method: POST
    path: "/layers/{layer_id}/sign-down"
    description: "Resolve an oversubscribed layer down to exactly 100.0000 signed"
    roles: [BrokerPlacementLead]
    code: 200
    input: []
    output: Layer
    side_effects:
      - "signed_line_pct set on every PROVISIONAL line per calculations.signing_down_allocation using Program.signdown_method"
      - "lines allocated 0.0000 become RELEASED with release_reason = SIGNDOWN_ZEROED and their quotes LAPSE"
      - "all other PROVISIONAL lines become SIGNED; signed_line_total_pct = 100.0000; status -> SIGNED_DOWN"
      - "committed_capacity_minor recomputed for every market on the layer"
      - "increments Layer.version by 1"

  - method: GET
    path: "/layers/{layer_id}/signing-lines"
    description: "Lines written on this layer (FK reverse-reachability for SigningLine.layer_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: ["status?", "reinsurer_id?", "limit?", "offset?"]
    output: SigningLine[]
    side_effects: []

  - method: POST
    path: "/layers/{layer_id}/claim-advocacies"
    description: "Notify a ceded loss on a bound layer and open the advocacy file"
    roles: [BrokerPlacementLead, CedentUnderwriter]
    code: 201
    input: [claim_reference, event_date, gross_claim_minor]
    output: ClaimAdvocacy
    side_effects:
      - "status = NOTIFIED"
      - "ceded_claim_minor, collectible_minor and arbitration_cost_minor computed per calculations.claim_cession_waterfall"
      - "Layer.limit_eroded_minor and reinstatements_used are NOT touched — notification never erodes the layer"

  - method: GET
    path: "/layers/{layer_id}/claim-advocacies"
    description: "Advocacy files on this layer (FK reverse-reachability for ClaimAdvocacy.layer_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter, ReinsurerUnderwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClaimAdvocacy[]
    side_effects: []

  # --------------------------------------------------------- MarketSubmission ---
  - method: GET
    path: "/market-submissions/{market_submission_id}"
    description: "Read one market submission"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: []
    output: MarketSubmission
    side_effects: []

  - method: POST
    path: "/market-submissions/{market_submission_id}/quotes"
    description: "Market answers the submission with terms"
    roles: [ReinsurerUnderwriter]
    code: 201
    input: [offered_line_pct, quoted_rate_pct, ceding_commission_pct, reinstatements_offered, sublimit_minor, expires_at, "is_lead?", "additional_exclusions?"]
    output: Quote
    side_effects: ["Quote created in status QUOTED with negotiation_round = 0", "layer_id and reinsurer_id copied from the submission", "MarketSubmission.status SENT -> QUOTED"]

  - method: GET
    path: "/market-submissions/{market_submission_id}/quotes"
    description: "Quotes answering this submission (FK reverse-reachability for Quote.market_submission_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  # -------------------------------------------------------------------- Quote ---
  - method: GET
    path: "/quotes"
    description: "List quotes; carries every Quote FK as a filter (market_submission_id, layer_id, reinsurer_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: ["market_submission_id?", "layer_id?", "reinsurer_id?", "status?", "is_lead?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: GET
    path: "/quotes/{quote_id}"
    description: "Read one quote with its negotiation round and accepted line"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: POST
    path: "/quotes/{quote_id}/counter"
    description: "Broker counters the market's terms"
    roles: [BrokerPlacementLead]
    code: 200
    input: [counter_note]
    output: Quote
    side_effects: ["negotiation_round += 1", "last_counter_note recorded", "status QUOTED|REQUOTED -> COUNTERED"]

  - method: POST
    path: "/quotes/{quote_id}/requote"
    description: "Market answers the broker's counter with revised terms"
    roles: [ReinsurerUnderwriter]
    code: 200
    input: [offered_line_pct, quoted_rate_pct, ceding_commission_pct, reinstatements_offered, sublimit_minor, expires_at, "is_lead?", "additional_exclusions?"]
    output: Quote
    side_effects: ["terms overwritten, negotiation_round unchanged", "status COUNTERED -> REQUOTED"]

  - method: POST
    path: "/quotes/{quote_id}/decline"
    description: "Market walks away from the risk"
    roles: [ReinsurerUnderwriter]
    code: 200
    input: ["decline_reason?"]
    output: Quote
    side_effects: ["status -> DECLINED", "MarketSubmission.status -> DECLINED"]

  - method: POST
    path: "/quotes/{quote_id}/firm-order"
    description: "Broker firm-orders a line against the quote, materialising a signing line. Optimistic concurrency: expected_layer_version must match Layer.version (§1.2.1 firm-order-stale-layer)."
    roles: [BrokerPlacementLead]
    code: 201
    input: [accepted_line_pct, expected_layer_version]
    output: SigningLine
    side_effects:
      - "Quote.accepted_line_pct recorded, Quote.status -> FIRM_ORDER"
      - "hop 1: SigningLine created in status PROVISIONAL with written_line_pct = accepted_line_pct"
      - "hop 2: Layer.written_line_total_pct recomputed, driving IN_MARKET / PARTIALLY_PLACED / FULLY_PLACED / OVERSUBSCRIBED"
      - "hop 3: when every non-LAPSED layer of the program is FULLY_PLACED or OVERSUBSCRIBED, Program.placement_status IN_MARKET -> FIRM_ORDER"
      - "hop 4: that Program transition LAPSES every still-open quote and CLOSES every still-open market submission of the program"
      - "Reinsurer.committed_capacity_minor and available_capacity_minor recomputed"
      - "increments Layer.version by 1"

  # -------------------------------------------------------------- SigningLine ---
  - method: GET
    path: "/signing-lines"
    description: "List signing lines; carries every SigningLine FK as a filter (layer_id, quote_id, reinsurer_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: ["layer_id?", "quote_id?", "reinsurer_id?", "status?", "limit?", "offset?"]
    output: SigningLine[]
    side_effects: []

  - method: GET
    path: "/signing-lines/{signing_line_id}"
    description: "Read one signing line with its written, signed and effective lines"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: []
    output: SigningLine
    side_effects: []

  - method: POST
    path: "/signing-lines/{signing_line_id}/release"
    description: "Broker hands a reserved line back to the market before binding"
    roles: [BrokerPlacementLead]
    code: 200
    input: []
    output: SigningLine
    side_effects:
      - "status -> RELEASED with release_reason = WITHDRAWN_BY_BROKER"
      - "hop 1: the materialising Quote FIRM_ORDER -> LAPSED"
      - "hop 2: Layer.written_line_total_pct / signed_line_total_pct recomputed, reverting FULLY_PLACED / OVERSUBSCRIBED / SIGNED_DOWN to PARTIALLY_PLACED (or FULLY_PLACED when the total lands on exactly 100.0000)"
      - "hop 3: Program.placement_status FIRM_ORDER -> IN_MARKET when a layer fell below full placement"
      - "Reinsurer.committed_capacity_minor and available_capacity_minor recomputed"
      - "increments Layer.version by 1"

  # ------------------------------------------------------ BrokerageDisclosure ---
  - method: GET
    path: "/brokerage-disclosures/{disclosure_id}"
    description: "Read one compensation disclosure"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: []
    output: BrokerageDisclosure
    side_effects: []

  - method: POST
    path: "/brokerage-disclosures/{disclosure_id}/disclose"
    description: "Release the disclosure to the cedent"
    roles: [BrokerAccountant]
    code: 200
    input: []
    output: BrokerageDisclosure
    side_effects: ["disclosed_by_user_id = X-User-ID", "status DRAFT -> DISCLOSED"]

  - method: POST
    path: "/brokerage-disclosures/{disclosure_id}/decision"
    description: "Cedent acknowledges or rejects the disclosure"
    roles: [CedentUnderwriter]
    code: 200
    input: [decision, "decision_note?"]
    output: BrokerageDisclosure
    side_effects:
      - "acknowledged_by_user_id = X-User-ID, decision_note recorded"
      - "decision=ACKNOWLEDGE: status -> ACKNOWLEDGED and Program.disclosure_acknowledged = true"
      - "decision=REJECT: status -> REJECTED and Program.disclosure_acknowledged stays false"

  # ------------------------------------------------------ FiduciaryTransaction ---
  - method: GET
    path: "/fiduciary-transactions"
    description: "List fiduciary movements; carries every FiduciaryTransaction FK as a filter (program_id, signing_line_id, reverses_transaction_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerAccountant, ComplianceOfficer]
    code: 200
    input: ["program_id?", "signing_line_id?", "reverses_transaction_id?", "txn_type?", "status?", "limit?", "offset?"]
    output: FiduciaryTransaction[]
    side_effects: []

  - method: GET
    path: "/fiduciary-transactions/{transaction_id}"
    description: "Read one fiduciary movement"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerAccountant, ComplianceOfficer]
    code: 200
    input: []
    output: FiduciaryTransaction
    side_effects: []

  - method: POST
    path: "/fiduciary-transactions/{transaction_id}/approve"
    description: "A second pair of eyes approves a booked movement; the approver may never be the booker (validations[priority=42]), so the accounting role is admitted here but only for movements someone else booked"
    roles: [ComplianceOfficer, BrokerAccountant]
    code: 200
    input: []
    output: FiduciaryTransaction
    side_effects: ["approved_by_user_id = X-User-ID", "status PENDING -> APPROVED", "no money moves"]

  - method: POST
    path: "/fiduciary-transactions/{transaction_id}/settle"
    description: "Move the money; contract certainty gates premium out-payments"
    roles: [BrokerAccountant]
    code: 200
    input: []
    output: FiduciaryTransaction
    side_effects:
      - "value_date = current_utc, status APPROVED -> SETTLED"
      - "Program.fiduciary_holding_minor recomputed per calculations.fiduciary_holding"
      - "Cedent.settled_receipts_minor and Cedent.outstanding_reinstatement_premium_minor recomputed"

  - method: POST
    path: "/fiduciary-transactions/{transaction_id}/reverse"
    description: "Compensate a settled movement with an equal and opposite ledger row"
    roles: [ComplianceOfficer]
    code: 201
    input: []
    output: FiduciaryTransaction
    side_effects:
      - "the reversed row's status SETTLED -> REVERSED (it stays in the ledger projection)"
      - "a new REMITTANCE_REVERSAL row is appended in status SETTLED with the same amount_minor and signing_line_id and reverses_transaction_id = the reversed row's id — this new row is the response body"
      - "Program.fiduciary_holding_minor returns to exactly its pre-settlement value"

  # ------------------------------------------------------------- ClaimAdvocacy ---
  - method: GET
    path: "/claim-advocacies/{claim_advocacy_id}"
    description: "Read one advocacy file with its cession, dispute and collection figures"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter, ReinsurerUnderwriter]
    code: 200
    input: []
    output: ClaimAdvocacy
    side_effects: []

  - method: POST
    path: "/claim-advocacies/{claim_advocacy_id}/review"
    description: "Broker takes the notified loss under review"
    roles: [BrokerPlacementLead]
    code: 200
    input: []
    output: ClaimAdvocacy
    side_effects: ["status NOTIFIED -> UNDER_REVIEW"]

  - method: POST
    path: "/claim-advocacies/{claim_advocacy_id}/withdraw"
    description: "Cedent withdraws a notified loss before review"
    roles: [CedentUnderwriter]
    code: 200
    input: []
    output: ClaimAdvocacy
    side_effects: ["status NOTIFIED -> WITHDRAWN", "the layer's erosion and reinstatements are untouched"]

  - method: POST
    path: "/claim-advocacies/{claim_advocacy_id}/advocacy-route"
    description: "Choose the advocacy branch for a disputed cession"
    roles: [BrokerPlacementLead]
    code: 200
    input: [route]
    output: ClaimAdvocacy
    side_effects:
      - "route=NEGOTIATION: advocacy_route = NEGOTIATION, arbitration_cost_minor stays 0, status DISPUTED -> ADVOCACY_NEGOTIATION, collections stay open"
      - "route=ARBITRATION: advocacy_route = ARBITRATION, arbitration_cost_minor = round_half_up(ceded_claim_minor * 1.5 / 100), status DISPUTED -> ADVOCACY_ARBITRATION, collections are frozen until the branch joins"

  - method: POST
    path: "/claim-advocacies/{claim_advocacy_id}/cession-disputes"
    description: "Market disputes part of the cession"
    roles: [ReinsurerUnderwriter]
    code: 201
    input: [signing_line_id, disputed_minor, dispute_reason]
    output: CessionDispute
    side_effects:
      - "CessionDispute created in status RAISED"
      - "ClaimAdvocacy.disputed_minor and collectible_minor recomputed per calculations.claim_cession_waterfall"
      - "the first dispute moves the advocacy UNDER_REVIEW -> DISPUTED"

  - method: GET
    path: "/claim-advocacies/{claim_advocacy_id}/cession-disputes"
    description: "Disputes on this advocacy (FK reverse-reachability for CessionDispute.claim_advocacy_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter, ReinsurerUnderwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CessionDispute[]
    side_effects: []

  - method: POST
    path: "/claim-advocacies/{claim_advocacy_id}/collections"
    description: "Book a collection received from a market against the advocacy"
    roles: [BrokerAccountant]
    code: 201
    input: [signing_line_id, amount_minor]
    output: FiduciaryTransaction
    side_effects:
      - "a CLAIM_COLLECTION FiduciaryTransaction is created in status PENDING on the advocacy's program"
      - "ClaimAdvocacy.collected_minor recomputed"
      - "when collected_minor >= collectible_minor the advocacy becomes COLLECTED, which erodes Layer.limit_eroded_minor / reinstatements_used (hop 1), may append a PENDING REINSTATEMENT_PREMIUM movement (hop 2) and refreshes Cedent.outstanding_reinstatement_premium_minor (hop 3)"

  # ------------------------------------------------------------ CessionDispute ---
  - method: GET
    path: "/cession-disputes"
    description: "List cession disputes; carries every CessionDispute FK as a filter (claim_advocacy_id, signing_line_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter, ReinsurerUnderwriter]
    code: 200
    input: ["claim_advocacy_id?", "signing_line_id?", "status?", "dispute_reason?", "limit?", "offset?"]
    output: CessionDispute[]
    side_effects: []

  - method: GET
    path: "/cession-disputes/{dispute_id}"
    description: "Read one cession dispute"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter, ReinsurerUnderwriter]
    code: 200
    input: []
    output: CessionDispute
    side_effects: []

  - method: POST
    path: "/cession-disputes/{dispute_id}/resolve"
    description: "Close a dispute; the advocacy joins its branch once no dispute remains RAISED"
    roles: [BrokerPlacementLead]
    code: 200
    input: [resolution, settled_minor, "resolution_note?"]
    output: CessionDispute
    side_effects:
      - "status -> UPHELD | WITHDRAWN | SETTLED_PARTIAL with settled_minor recorded"
      - "ClaimAdvocacy.disputed_minor and collectible_minor recomputed"
      - "when no dispute of the advocacy remains RAISED, ADVOCACY_NEGOTIATION / ADVOCACY_ARBITRATION -> RESOLVED and Layer.incurred_ceded_minor is refreshed"


  # --------------------------------------- flat discovery collections ---
  # Every §1.1 FK is reachable from its parent id through one of these
  # filtered lists as well as through the nested sub-resource above; the
  # flat form is what a client uses when it holds only the parent id.
  - method: GET
    path: "/exposure-submissions"
    description: "List exposure packages across programs (FK reverse-reachability for ExposureSubmission.program_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: ExposureSubmission[]
    side_effects: []

  - method: GET
    path: "/layers"
    description: "List layers across programs (FK reverse-reachability for Layer.program_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter, ReinsurerUnderwriter]
    code: 200
    input: ["program_id?", "status?", "layer_type?", "limit?", "offset?"]
    output: Layer[]
    side_effects: []

  - method: GET
    path: "/market-submissions"
    description: "List market submissions (FK reverse-reachability for MarketSubmission.layer_id and MarketSubmission.reinsurer_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, ReinsurerUnderwriter]
    code: 200
    input: ["layer_id?", "reinsurer_id?", "status?", "limit?", "offset?"]
    output: MarketSubmission[]
    side_effects: []

  - method: GET
    path: "/brokerage-disclosures"
    description: "List brokerage disclosures (FK reverse-reachability for BrokerageDisclosure.program_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: BrokerageDisclosure[]
    side_effects: []

  - method: GET
    path: "/claim-advocacies"
    description: "List claim advocacies (FK reverse-reachability for ClaimAdvocacy.layer_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter, ReinsurerUnderwriter]
    code: 200
    input: ["layer_id?", "status?", "limit?", "offset?"]
    output: ClaimAdvocacy[]
    side_effects: []

  - method: GET
    path: "/contract-documents"
    description: "List contract documents (FK reverse-reachability for ContractDocument.program_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: ["program_id?", "document_type?", "limit?", "offset?"]
    output: ContractDocument[]
    side_effects: []

  - method: GET
    path: "/contract-documents/{document_id}"
    description: "Read one filed contract document"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: []
    output: ContractDocument
    side_effects: []

  - method: GET
    path: "/renewal-reports"
    description: "List renewal reports (FK reverse-reachability for RenewalReport.program_id)"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: RenewalReport[]
    side_effects: []

  - method: GET
    path: "/renewal-reports/{report_id}"
    description: "Read one renewal report"
    roles: [PlatformAdmin, BrokerPlacementLead, BrokerActuary, BrokerAccountant, ComplianceOfficer, CedentUnderwriter]
    code: 200
