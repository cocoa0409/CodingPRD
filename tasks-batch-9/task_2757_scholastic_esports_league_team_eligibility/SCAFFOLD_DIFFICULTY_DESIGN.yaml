  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: team_competing_suspended_competing_cycle_via_sustain_then_appeal_overturn
        grounds:
          - state_machines.Team.COMPETING_to_SUSPENDED
          - state_machines.Team.SUSPENDED_to_COMPETING
          - state_machines.FairPlayCase.SUSTAINED_to_APPEALED
          - state_machines.FairPlayCase.APPEALED_to_OVERTURNED
          - state_machines.RosterSlot.participation_ACTIVE_to_INELIGIBLE
          - state_machines.RosterSlot.participation_INELIGIBLE_to_ACTIVE
          - entities.Team.fields.suspension_reason
        distinguishing_aspect: |
          A genuine cycle on the Team dimension: COMPETING -> SUSPENDED -> COMPETING, entered
          by a sustained student sanction that starves the roster and exited only when the
          appeal is OVERTURNED. Re-entry is guarded by two conditions that must both hold
          (active_starter_count back at or above min_starters AND no other team-suspending
          case), and the re-entered state is not a fresh state but the one previously
          occupied, so an implementation modelled as a forward-only ladder cannot express it.
        test_recipe:
          setup:
            - "One district, school, two CERTIFIED coaches, two students each with a 3.100 / 6-credit posting, on a district-APPROVED title"
            - "Teams Alpha and Bravo each hold one ACTIVE STARTER slot, both REGISTERED then ROSTER_LOCKED, then COMPETING once the season reaches REGULAR_SEASON"
            - "A FairPlayCase (subject STUDENT, ACCOUNT_SHARING) against Alpha's student is investigated by integrity-a and sustained at MINOR by integrity-b"
