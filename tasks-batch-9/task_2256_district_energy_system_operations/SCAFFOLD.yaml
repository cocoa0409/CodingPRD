        preconditions: ["ProductionAsset.availability_state == AVAILABLE", "ProductionAsset.derated_capacity_kw > 0"]
        side_effects: ["sets ProductionAsset.availability_state = DERATED", "increments ProductionAsset.version by 1"]
      - from: DERATED
        to: AVAILABLE
