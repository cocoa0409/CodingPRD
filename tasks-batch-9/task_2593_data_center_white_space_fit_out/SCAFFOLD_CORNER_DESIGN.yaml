      - name: release_packet_submit_gate_errors_scope_tags_and_cage_coverage
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RELEASE_SCOPE_EMPTY] (409, a release packet is submitted with no rack in scope)"
          - "errors[ERR_ASSET_TAGS_INCOMPLETE] (422, a release packet is submitted while asset_tag_completion_pct < 100.00)"
          - "errors[ERR_CAGE_COVERAGE_INSUFFICIENT] (422, a release packet is submitted while the cage misses its camera coverage or reader zone floor)"
          - "validations[39] priority 39, validations[40] priority 40, validations[41] priority 41 on POST /release-packets/{packet_id}/submit"
          - "calculations[asset_tag_completion] and calculations[cage_security_coverage]"
        distinguishing_aspect: "The three submit gates fire in the declared priority order on the SAME endpoint, so each has to be cleared in turn: an empty cage stops at scope (39) before tags are even considered, a POWERED but untagged rack stops at tags (40), and a fully tagged rack in a camera-less cage stops at coverage (41). Coverage itself has two independent floors — 75.00 percent camera coverage still fails at the 95.00 percent default, and 100 percent coverage with only one reader zone still fails the two-zone floor — so an implementation that checks cameras only passes too early."
