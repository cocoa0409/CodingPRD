            - "Drop.${d2_id}.planned_quantity == 0 and its cost_basis is still ESTIMATED_POSTAGE"

      - name: placement_position_multipliers_drive_a_re_divided_productivity
        claim_type: constants_applied
        grounds:
          - calculations.page_placement_space_productivity
          - entities.Drop.fields.allocated_square_inches
          - entities.Drop.fields.unallocated_square_inches
          - endpoints[POST /catalog-circulation/drops/{id}/page-placements]
        distinguishing_aspect: "Three positions pin three of the four multipliers, and the BACK_COVER case lands the forecast numerator on an exact .5 so ROUND_HALF_UP is separated from banker's rounding (15659, not 15658). Productivity is then asserted as a re-division of that ALREADY-ROUNDED numerator, and the drop's square-inch ledger is reconciled against the 5632-inch capacity in the same instance."
        test_recipe:
          setup:
            - "Season FW26; plan P1 budget 20000000 in DRAFT; drop 1 at page_count 64, so square_inch_capacity is 64 * 88 == 5632 and weight_oz_milli is 2560."
            - "Position multipliers: FRONT_COVER 18000, HOT_SPOT 14000, BACK_COVER 13000, INSIDE 10000 bps."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id", cap: "$.data.square_inch_capacity", wt: "$.data.weight_oz_milli", unalloc0: "$.data.unallocated_square_inches" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-FRONT", product_name: "Wool throw", unit_price_cents: 12900, unit_cogs_cents: 5400, demand_per_sq_inch_cents: 4200, page_number: 1, sq_in_offset: 0, square_inches: 44, placement_position: "FRONT_COVER" }
              as: CirculationPlanner
              captures: { f_mult: "$.data.position_multiplier_bps", f_fc: "$.data.forecast_space_demand_cents", f_prod: "$.data.space_productivity_cents_per_sq_in" }
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-HOT", product_name: "Cast pan", unit_price_cents: 8900, unit_cogs_cents: 3700, demand_per_sq_inch_cents: 4133, page_number: 2, sq_in_offset: 0, square_inches: 7, placement_position: "HOT_SPOT" }
              as: CirculationPlanner
              captures: { h_mult: "$.data.position_multiplier_bps", h_fc: "$.data.forecast_space_demand_cents", h_prod: "$.data.space_productivity_cents_per_sq_in" }
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-BACK", product_name: "Barn coat", unit_price_cents: 24900, unit_cogs_cents: 10400, demand_per_sq_inch_cents: 4015, page_number: 64, sq_in_offset: 0, square_inches: 3, placement_position: "BACK_COVER" }
              as: CirculationPlanner
              captures: { b_mult: "$.data.position_multiplier_bps", b_fc: "$.data.forecast_space_demand_cents", b_prod: "$.data.space_productivity_cents_per_sq_in" }
            - call: "GET /catalog-circulation/drops/${d1_id}"
              payload: {}
              as: CirculationPlanner
              captures: { alloc_sq: "$.data.allocated_square_inches", unalloc_sq: "$.data.unallocated_square_inches" }
          assert:
            - "${cap} == 5632, ${wt} == 2560 and ${unalloc0} == 5632  # an empty drop has its whole capacity free"
            - "${f_mult} == 18000, ${f_fc} == 332640 == round_half_up(44 * 4200 * 18000 / 10000) and ${f_prod} == 7560"
            - "${h_mult} == 14000, ${h_fc} == 40503 == round_half_up(7 * 4133 * 14000 / 10000 == 40503.4) and ${h_prod} == 5786 == round_half_up(40503 / 7)  # 5786.142857 re-divided from the rounded numerator"
            - "${b_mult} == 13000 and ${b_fc} == 15659  # the exact product is 15658.5, so ROUND_HALF_UP goes up; banker's rounding would report 15658"
            - "${b_prod} == 5220 == round_half_up(15659 / 3)  # derived from the rounded 15659, not from the exact 15658.5"
            - "${alloc_sq} == 54 == 44 + 7 + 3 and ${unalloc_sq} == 5578"
            - "${cap} == ${alloc_sq} + ${unalloc_sq}  # the page-space compensating invariant holds after three creates"

      - name: gross_and_net_demand_variants_produce_different_numbers
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: line_demand_forecast_gross_vs_net_diverge_on_holdout_line
          rationale: "The §1.8 dual_variant_calc instance already computes PRE_MERGE_GROSS and POST_MERGE_NET on the same holdout line and pins the delta, including the fact that the gross variant ignores the holdout carve-out entirely while the net variant prices only the mailable books."

      - name: the_provisional_rate_is_used_at_allocation_and_the_final_rate_afterwards
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: provisional_then_final_rebate_band_evaluation_order_pinned
          rationale: "The §1.8 combinatorial_formula mode-c instance already establishes that the rebate band is chosen from requested_quantity_total for the provisional rate and from planned_quantity for the final one, and that the provisional rate is deliberately not recomputed after the waterfall spends the budget at it."

      - name: switching_postage_basis_reprices_the_book_and_the_lines
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: cost_per_book_per_component_rounding_order_pinned_at_306
          rationale: "The §1.8 instance already drives the ESTIMATED_POSTAGE -> PRESORTED_ACTUAL switch and reconciles the delta through the three independently rounded components (232 + 22 + 52 == 306 rather than 305), together with the resulting line-level contribution move while committed_cost_cents stays frozen."

      - name: automation_share_threshold_is_all_or_nothing_at_its_edge
        claim_type: threshold_boundary
        excluded_because:
          difficulty_instance: automation_share_exactly_nine_thousand_bps_qualifies
          rationale: "The §1.8 boundary_precision_check instance already tests the floored automation share at exactly 9000 bps and one piece below it on two otherwise identical drops, pinning the whole-discount / no-discount split and the resulting cost-per-book difference."

      - name: presort_tier_minimums_and_the_weight_surcharge_compose
        claim_type: constants_applied
        excluded_because:
          difficulty_instance: presort_tier_fallback_weight_surcharge_and_automation_share_compose
          rationale: "The §1.8 combinatorial_formula mode-a instance already composes the per-batch minimum-volume fallback to MIXED_AADC, the per-drop weight surcharge added to each batch's per-piece rate before multiplication, and the automation-share numerator that the fallback shrinks."

  # ===========================================================================
  # SECTION 4 — validations
  # ===========================================================================
  - section: validations
    instances:

      - name: a_line_must_name_exactly_one_audience_or_it_is_rejected
        claim_type: violation_error
        grounds:
          - validations[priority 38].ERR_AUDIENCE_SPEC_INVALID
          - validations[priority 32]
          - validations[priority 35]
          - endpoints[POST /catalog-circulation/drops/{id}/circulation-lines]
        distinguishing_aspect: "Four different malformed audience specifications are sent to the same endpoint and each must return the error of the priority that owns it: an unresolvable segment id is a 404 at priority 32, a bad enum is ERR_INVALID_REQUEST at 35, and only a well-formed, resolvable request that names both or neither audience reaches ERR_AUDIENCE_SPEC_INVALID at 38. A handler that checks the audience shape first reports 422 ERR_AUDIENCE_SPEC_INVALID for the unresolvable id."
        test_recipe:
          setup:
            - "Season FW26; leaf segment S_A (30000 names, not suppressed); rental R1 left in REQUESTED; plan P1 budget 20000000 in DRAFT; drop 1 (in_home 2026-09-15, page_count 64)."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "COOP-A", requested_gross_names: 10000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 1000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { r1_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", requested_quantity: 5000, housefile_segment_id: "${seg_id}", prospect_list_rental_id: "${r1_id}" }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", requested_quantity: 5000 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "RENTAL", requested_quantity: 5000, housefile_segment_id: "${seg_id}" }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "PROSPECT", requested_quantity: 5000, housefile_segment_id: "${seg_id}" }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", requested_quantity: 5000, housefile_segment_id: "00000000-0000-4000-8000-00000000dead" }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", requested_quantity: 5000, housefile_segment_id: "${seg_id}" }
              as: CirculationPlanner
              captures: { ok_line: "$.data.id", ok_status: "$.data.status" }
          assert:
            - "call 1 (both audience ids set) -> 422 ERR_AUDIENCE_SPEC_INVALID"
            - "call 2 (neither audience id set) -> 422 ERR_AUDIENCE_SPEC_INVALID"
            - "call 3 (audience_type RENTAL but a housefile id supplied) -> 422 ERR_AUDIENCE_SPEC_INVALID  # the type must agree with which id is present"
            - "call 4 (audience_type outside its enum) -> 422 ERR_INVALID_REQUEST, NOT ERR_AUDIENCE_SPEC_INVALID  # priority 35 runs before 38"
            - "call 5 (well-formed but unresolvable segment id) -> 404 ERR_SEGMENT_NOT_FOUND, NOT ERR_AUDIENCE_SPEC_INVALID  # priority 32 runs before 38"
            - "call 6 -> 201 with ${ok_status} == PROPOSED"
            - "GET /catalog-circulation/circulation-lines?drop_id=${d1_id} returns exactly one row, ${ok_line}  # none of the five rejected calls left a partial row"
            - "Drop.${d1_id}.requested_quantity_total == 5000 and CirculationPlan.${plan_id}.committed_cost_cents == 0"

      - name: allocation_requires_a_completed_merge_purge_run_on_the_same_plan
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 64].ERR_MERGE_PURGE_REQUIRED
          - state_machines[MergePurgeRun.status].transitions[PENDING->FAILED]
          - endpoints[POST /catalog-circulation/drops/{id}/allocate]
        distinguishing_aspect: "The plan's first merge-purge run is created before any segment exists, so it lands on the FAILED branch with zero net names. Allocation must still be refused: the guard is satisfied only by a run in COMPLETED, not by the mere existence of a run. A handler that checks for any MergePurgeRun row - or that treats net 0 as a successful dedupe - allocates against a list of nobody."
        test_recipe:
          setup:
            - "Season FW26 and plan P1 (budget 20000000) are created first; NO housefile segments exist yet, so the first run sees gross_input_names 0."
            - "Segment S_A (30000 names) and drop 1 with one 20000-book line are created afterwards."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
              captures: { run1: "$.data.id", run1_status: "$.data.status", run1_gross: "$.data.gross_input_names", run1_net: "$.data.net_mailable_names" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", requested_quantity: 20000, housefile_segment_id: "${seg_id}" }
              as: CirculationPlanner
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: CirculationPlanner
              captures: { plan_v2: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v2}", input_rental_ids: [] }
              as: ListBroker
              captures: { run2_status: "$.data.status", run2_net: "$.data.net_mailable_names" }
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
              captures: { planned_qty: "$.data.planned_quantity" }
          assert:
            - "${run1_status} == FAILED with ${run1_gross} == 0 and ${run1_net} == 0  # the PENDING->FAILED branch, chosen because net_mailable_names is not > 0"
            - "the first allocate -> 409 ERR_MERGE_PURGE_REQUIRED  # a FAILED run does not satisfy the guard"
            - "after the rejected allocate, CirculationLine.${line_id}.status is still PROPOSED with allocated_quantity 0 and the plan's committed_cost_cents is still 0"
            - "${run2_status} == COMPLETED and ${run2_net} == 30000  # the segment now exists"
            - "MergePurgeRun.${run1} is still FAILED, NOT SUPERSEDED  # only COMPLETED runs are superseded by a newer COMPLETED run"
            - "the second allocate -> 200 with ${planned_qty} == 20000 and CirculationLine.${line_id}.status == ALLOCATED"

      - name: in_home_date_must_not_precede_the_logical_clock_at_create_or_patch
        claim_type: temporal_validation
        grounds:
          - validations[priority 70].ERR_INHOME_DATE_IN_PAST
          - endpoints[POST /catalog-circulation/circulation-plans/{id}/drops]
          - endpoints[PATCH /catalog-circulation/drops/{id}]
          - endpoints[POST /catalog-circulation/_clock/set_current_utc]
        distinguishing_aspect: "The same date is legal and then illegal for the same drop: 2026-08-25 is accepted at creation under a 2026-08-01 clock and rejected by PATCH once the clock has moved to 2026-09-01. The boundary is also pinned on the fresh side - an in-home date equal to the clock's current date is accepted - so the comparison is >= today, not > today."
        test_recipe:
          setup:
            - "Clock set explicitly to 2026-08-01T00:00:00Z; season FW26; plan P1 budget 20000000 in DRAFT."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-07-31", page_count: 64 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-08-01", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id", d1_date: "$.data.in_home_date", d1_v1: "$.data.version" }
            - call: "PATCH /catalog-circulation/drops/${d1_id}"
              payload: { in_home_date: "2026-08-25" }
              as: CirculationPlanner
              captures: { d1_v2: "$.data.version" }
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "PATCH /catalog-circulation/drops/${d1_id}"
              payload: { in_home_date: "2026-08-25" }
              as: CirculationPlanner
            - call: "PATCH /catalog-circulation/drops/${d1_id}"
              payload: { page_count: 32 }
              as: CirculationPlanner
              captures: { d1_pages: "$.data.page_count", d1_v3: "$.data.version" }
            - call: "PATCH /catalog-circulation/drops/${d1_id}"
              payload: { in_home_date: "2026-09-01" }
              as: CirculationPlanner
              captures: { d1_date_final: "$.data.in_home_date" }
          assert:
            - "the 2026-07-31 create -> 422 ERR_INHOME_DATE_IN_PAST and GET /catalog-circulation/circulation-plans/${plan_id}/drops is still empty"
            - "the 2026-08-01 create -> 201 with ${d1_date} == 2026-08-01  # a date equal to the clock's date is in the future-or-today half of the boundary"
            - "the first PATCH to 2026-08-25 -> 200 with ${d1_v2} == ${d1_v1} + 1  # still ahead of the 2026-08-01 clock"
            - "after the clock moves to 2026-09-01, the identical PATCH to 2026-08-25 -> 422 ERR_INHOME_DATE_IN_PAST and in_home_date stays 2026-08-25"
            - "the page_count-only PATCH -> 200 with ${d1_pages} == 32 and ${d1_v3} == ${d1_v2} + 1  # the temporal rule is not evaluated when in_home_date is absent from the body, even though the stored date is now in the past"
            - "the PATCH to 2026-09-01 -> 200 with ${d1_date_final} == 2026-09-01"
            - "the rejected PATCH did not bump version: ${d1_v3} == ${d1_v2} + 1 proves no version was consumed by the 422"

      - name: presort_batches_must_cover_the_planned_quantity_exactly
        claim_type: aggregate_validation
        grounds:
          - validations[priority 88].ERR_PRESORT_COVERAGE_MISMATCH
          - state_machines[Drop.production_status].transitions[PLANNED->PRESORTED]
          - calculations.drop_postage_total
        distinguishing_aspect: "Three sibling drops in one approved plan carry batch sets that are short by one piece, over by one piece and exact, so the rule is shown to be an equality rather than a ceiling: the over-covered drop is rejected too. Because /presort requires an APPROVED plan while creating batches requires an editable one, the batches must all be laid down before costing - which is the ordering an implementation that lets you fix coverage after approval gets wrong."
        test_recipe:
          setup:
            - "Season FW26; segments S_A, S_B, S_C each with 30000 names and distinct codes; plan P1 budget 20000000 with a COMPLETED merge-purge run."
            - "Drop 1 (2026-09-15, page_count 32) line S_A 10000; drop 2 (2026-09-16, page_count 32) line S_B 8000; drop 3 (2026-09-17, page_count 32) line S_C 6000. Each drop is allocated on its own, so each requested_quantity_total is below the 40000 rebate band and every provisional cost per book is 83 + 7 + 55 == 145."
            - "Batches are created while the plan is still DRAFT: drop 1 FIVE_DIGIT 10000 (exact), drop 2 FIVE_DIGIT 7999 (one short), drop 3 FIVE_DIGIT 6001 (one over)."
            - "The plan is then costed by u-planner-1, submitted by u-planner-1 and approved by u-director-9."
          setup_api_calls:
            - call: "POST /catalog-circulation/drops/${d1_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 10000 }
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/drops/${d2_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 7999 }
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/drops/${d3_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 6001 }
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
              captures: { plan_status: "$.data.status" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d2_id}/presort"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/drops/${d3_id}/presort"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/drops/${d1_id}/presort"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { d1_prod: "$.data.production_status", d1_basis: "$.data.cost_basis", d1_postage: "$.data.postage_total_cents", d1_share: "$.data.automation_share_bps", d1_qual: "$.data.automation_qualified", d1_cpb: "$.data.cost_per_book_cents" }
            - call: "POST /catalog-circulation/drops/${d2_id}/presort-batches"
              payload: { declared_tier: "AADC", piece_count: 1 }
              as: CirculationPlanner
              as_user_id: "u-planner-1"
          assert:
            - "${plan_status} == APPROVED"
            - "drop 2 /presort -> 422 ERR_PRESORT_COVERAGE_MISMATCH  # 7999 != planned_quantity 8000"
            - "drop 3 /presort -> 422 ERR_PRESORT_COVERAGE_MISMATCH  # 6001 != planned_quantity 6000; over-coverage is a violation too, so the check is equality and not >="
            - "both rejected drops keep production_status PLANNED, cost_basis ESTIMATED_POSTAGE, postage_total_cents 0 and automation_qualified false"
            - "drop 1 /presort -> 200 with ${d1_prod} == PRESORTED and ${d1_basis} == PRESORTED_ACTUAL"
            - "${d1_share} == 10000 and ${d1_qual} == true  # the single FIVE_DIGIT batch of 10000 clears its 150-piece minimum, so every piece is automation-qualified"
            - "${d1_postage} == 400000  # 10000 * 42 == 420000 gross, page_count 32 puts weight_oz_milli at 1280 so the surcharge is 0, less the all-or-nothing 2-cent automation discount of 20000"
            - "${d1_cpb} == 130 == 83 printing + 7 paper + round_half_up(400000 / 10000) == 40 postage"
            - "the trailing 1-piece batch POST on drop 2 -> 409 ERR_PLAN_NOT_EDITABLE  # once the plan is APPROVED the coverage can no longer be repaired, which is why the batches must precede costing"

      - name: test_cell_quantities_are_capped_per_line_and_extra_cells_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority 87].ERR_TEST_CELL_QUANTITY_EXCEEDS_LINE
          - validations[priority 86].ERR_DUPLICATE_CONTROL_CELL
          - validations[priority 79].ERR_DUPLICATE_TEST_CELL_CODE
          - endpoints[POST /catalog-circulation/circulation-lines/{id}/test-cells]
        distinguishing_aspect: "Each individual cell quantity is legal and only the running sum crosses the line's allocated_quantity, so the rule must be evaluated as an aggregate over the line's existing cells. The rejected attempts are also arranged to violate two rules at once: a second CONTROL cell that would ALSO overflow the line returns the 409 duplicate at priority 86, not the 422 overflow at 87, and a duplicate cell_code beats both at 79."
        test_recipe:
          setup:
            - "Season FW26; segment S_A (30000 names); plan P1 budget 20000000 with a COMPLETED merge-purge run; drop 1 (2026-09-15, page_count 64) with one S_A line requested 10000, allocated to exactly 10000 at 236 per book."
            - "Cells are added in order: C_CTRL (CONTROL, 4000) then C_T1 (TEST, 5000), leaving 1000 of the line unassigned."
          setup_api_calls:
            - call: "POST /catalog-circulation/circulation-lines/${line_id}/test-cells"
              payload: { cell_code: "C_CTRL", test_type: "OFFER", cell_role: "CONTROL", quantity: 4000 }
              as: MarketingAnalyst
              captures: { ctrl_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-lines/${line_id}/test-cells"
              payload: { cell_code: "C_T1", test_type: "OFFER", cell_role: "TEST", quantity: 5000 }
              as: MarketingAnalyst
              captures: { t1_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/circulation-lines/${line_id}/test-cells"
              payload: { cell_code: "C_T2", test_type: "OFFER", cell_role: "TEST", quantity: 1001 }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/circulation-lines/${line_id}/test-cells"
              payload: { cell_code: "C_CTRL2", test_type: "OFFER", cell_role: "CONTROL", quantity: 9000 }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/circulation-lines/${line_id}/test-cells"
              payload: { cell_code: "C_T1", test_type: "FORMAT", cell_role: "TEST", quantity: 9000 }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/circulation-lines/${line_id}/test-cells"
              payload: { cell_code: "C_T2", test_type: "OFFER", cell_role: "TEST", quantity: 1000 }
              as: MarketingAnalyst
              captures: { t2_id: "$.data.id", t2_qty: "$.data.quantity", t2_status: "$.data.status" }
          assert:
            - "the 1001-quantity cell -> 422 ERR_TEST_CELL_QUANTITY_EXCEEDS_LINE  # 4000 + 5000 + 1001 > 10000 even though 1001 alone is trivially small"
            - "the second CONTROL cell (9000) -> 409 ERR_DUPLICATE_CONTROL_CELL, NOT ERR_TEST_CELL_QUANTITY_EXCEEDS_LINE  # priority 86 precedes 87 although both rules are violated"
            - "the reused cell_code C_T1 (9000) -> 409 ERR_DUPLICATE_TEST_CELL_CODE, NOT the duplicate-control or overflow error  # priority 79 precedes 86 and 87, and cell_code uniqueness is scoped per line"
            - "the 1000-quantity cell -> 201 with ${t2_qty} == 1000 and ${t2_status} == PLANNED  # the sum reaching allocated_quantity exactly is permitted"
            - "GET /catalog-circulation/circulation-lines/${line_id}/test-cells returns exactly three rows: ${ctrl_id}, ${t1_id}, ${t2_id}"
            - "the three surviving quantities sum to 10000 == CirculationLine.${line_id}.allocated_quantity"

      - name: the_contact_cap_binds_only_when_an_enabled_rule_matches_first_by_priority
        claim_type: conditional_validation
        grounds:
          - validations[priority 58].ERR_CONTACT_CAP_EXCEEDED
          - entities.SuppressionRule.fields.is_enabled
          - entities.SuppressionRule.fields.priority
          - entities.SuppressionRule.fields.channel_scope
        distinguishing_aspect: "The same MAIL contact is refused and then accepted without any event being deleted: adding a lower-priority-number MAIL rule with a generous cap displaces the ALL-scope rule that was blocking, because the FIRST matching enabled rule decides rather than the strictest one. The disabled rule at the start proves is_enabled gates the whole check, and every contact date is aged 60-90 days so the fatigue score never reaches the suppression threshold and cannot mask the outcome."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season FW26 with the default fatigue_window_days 90 and threshold 100; segment S_A."
            - "Rule CAP_MAIL_OFF: channel_scope MAIL, window_days 90, max_contacts_per_window 2, priority 10, is_enabled false."
            - "All contact dates lie 60-90 days back, so each MAIL is worth 10 fatigue points, each EMAIL 3 and each DIGITAL 2."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_id: "$.data.id" }
            - call: "POST /catalog-circulation/seasons/${season_id}/suppression-rules"
              payload: { rule_code: "CAP_MAIL_OFF", channel_scope: "MAIL", window_days: 90, max_contacts_per_window: 2, priority: 10, is_enabled: false }
              as: PlatformAdmin
              captures: { rule_off: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "MAIL", contact_date: "2026-06-01", source: "MANUAL_LOG" }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "MAIL", contact_date: "2026-05-20", source: "MANUAL_LOG" }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "MAIL", contact_date: "2026-05-10", source: "MANUAL_LOG" }
              as: MarketingAnalyst
              captures: { third_mail: "$.data.id" }
            - call: "POST /catalog-circulation/seasons/${season_id}/suppression-rules"
              payload: { rule_code: "CAP_ALL", channel_scope: "ALL", window_days: 90, max_contacts_per_window: 5, priority: 20, is_enabled: true }
              as: PlatformAdmin
              captures: { rule_all: "$.data.id" }
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "EMAIL", contact_date: "2026-05-15", source: "MANUAL_LOG" }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "DIGITAL", contact_date: "2026-05-16", source: "MANUAL_LOG" }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "EMAIL", contact_date: "2026-05-17", source: "MANUAL_LOG" }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/seasons/${season_id}/suppression-rules"
              payload: { rule_code: "CAP_MAIL_LOOSE", channel_scope: "MAIL", window_days: 90, max_contacts_per_window: 10, priority: 5, is_enabled: true }
              as: PlatformAdmin
              captures: { rule_loose: "$.data.id" }
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "MAIL", contact_date: "2026-05-18", source: "MANUAL_LOG" }
              as: MarketingAnalyst
              captures: { fourth_mail: "$.data.id" }
            - call: "GET /catalog-circulation/housefile-segments/${seg_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { score: "$.data.fatigue_score", strategy: "$.data.contact_strategy" }
          assert:
            - "the first three MAIL events all -> 201 even though CAP_MAIL_OFF caps MAIL at 2  # a rule with is_enabled false is skipped entirely"
            - "the EMAIL on 2026-05-15 -> 201 (4 of 5 in window) and the DIGITAL on 2026-05-16 -> 201 (5 of 5)  # a count reaching max_contacts_per_window exactly is still permitted"
            - "the EMAIL on 2026-05-17 -> 422 ERR_CONTACT_CAP_EXCEEDED  # it would be the sixth event against the ALL-scope cap of 5"
            - "after CAP_MAIL_LOOSE is added at priority 5, the MAIL on 2026-05-18 -> 201  # the first matching enabled rule for the channel is the priority-5 MAIL rule (4 mails against a cap of 10), so the priority-20 ALL rule that just blocked the EMAIL never runs"
            - "an EMAIL would still be refused at this point: CAP_MAIL_LOOSE does not match EMAIL, so CAP_ALL still governs it - the two channels now behave differently under the same event history"
            - "GET /catalog-circulation/housefile-segments/${seg_id}/contact-events returns 6 rows, including ${third_mail} and ${fourth_mail}; the rejected EMAIL left no row"
            - "${score} == 45 == 4 MAIL * 10 + 1 EMAIL * 3 + 1 DIGITAL * 2 and ${strategy} == PREMIUM_FULL  # all events sit in the 61-90 day 2500 bps band, well under the threshold of 100"
            - "GET /catalog-circulation/seasons/${season_id}/suppression-rules?is_enabled=true returns exactly ${rule_all} and ${rule_loose}, never ${rule_off}"

      - name: page_count_may_not_shrink_below_the_space_already_allocated
        claim_type: violation_error
        grounds:
          - validations[priority 85].ERR_DROP_SQ_IN_CAPACITY_EXCEEDED
          - endpoints[PATCH /catalog-circulation/drops/{id}]
          - endpoints[DELETE /catalog-circulation/page-placements/{id}]
          - entities.Drop.fields.square_inch_capacity
        distinguishing_aspect: "The drop-level square-inch rule is only reachable through a page_count reduction, because the per-page rule at priority 84 already prevents any single placement from overflowing. Two independent reasons to refuse a shrink are separated: page 3 being occupied blocks the move to 2 pages, and after that placement is deleted the same shrink to 1 page is refused only if the remaining 80 inches would not fit - which they do, so it succeeds."
        test_recipe:
          setup:
            - "Season FW26 with the default usable_sq_in_per_page 88; plan P1 budget 20000000 in DRAFT; drop 1 (2026-09-15, page_count 4) so square_inch_capacity is 352."
            - "Placement P1 on page 1 (offset 0, 80 sq in) and placement P2 on page 3 (offset 0, 40 sq in), giving allocated_square_inches 120 and a highest occupied page_number of 3."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 4 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id", cap4: "$.data.square_inch_capacity" }
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-1", product_name: "Wool throw", unit_price_cents: 12900, unit_cogs_cents: 5400, demand_per_sq_inch_cents: 4200, page_number: 1, sq_in_offset: 0, square_inches: 80, placement_position: "FRONT_COVER" }
              as: CirculationPlanner
              captures: { p1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-2", product_name: "Cast pan", unit_price_cents: 8900, unit_cogs_cents: 3700, demand_per_sq_inch_cents: 4100, page_number: 3, sq_in_offset: 0, square_inches: 40, placement_position: "INSIDE" }
              as: CirculationPlanner
              captures: { p2_id: "$.data.id", alloc120: "$.data.id" }
          trigger:
            - call: "PATCH /catalog-circulation/drops/${d1_id}"
              payload: { page_count: 2 }
              as: CirculationPlanner
            - call: "PATCH /catalog-circulation/drops/${d1_id}"
              payload: { page_count: 1 }
              as: CirculationPlanner
            - call: "PATCH /catalog-circulation/drops/${d1_id}"
              payload: { page_count: 3 }
              as: CirculationPlanner
              captures: { cap3: "$.data.square_inch_capacity", alloc3: "$.data.allocated_square_inches", unalloc3: "$.data.unallocated_square_inches" }
            - call: "DELETE /catalog-circulation/page-placements/${p2_id}"
              payload: {}
              as: CirculationPlanner
              captures: { alloc_after_del: "$.data.allocated_square_inches" }
            - call: "PATCH /catalog-circulation/drops/${d1_id}"
              payload: { page_count: 1 }
              as: CirculationPlanner
              captures: { cap1: "$.data.square_inch_capacity", alloc1: "$.data.allocated_square_inches", unalloc1: "$.data.unallocated_square_inches", wt1: "$.data.weight_oz_milli" }
          assert:
            - "${cap4} == 352 == 4 * 88"
            - "the shrink to 2 pages -> 422 ERR_DROP_SQ_IN_CAPACITY_EXCEEDED  # page 3 is occupied, even though 120 allocated inches would still fit inside a 176-inch capacity"
            - "the first shrink to 1 page -> 422 ERR_DROP_SQ_IN_CAPACITY_EXCEEDED  # both reasons apply: page 3 is occupied AND 120 > 88"
            - "the shrink to 3 pages -> 200 with ${cap3} == 264, ${alloc3} == 120 and ${unalloc3} == 144  # the highest occupied page is exactly the new page_count, which is permitted"
            - "the DELETE returns the Drop with ${alloc_after_del} == 80 and no placement rows for ${p2_id} in GET /catalog-circulation/drops/${d1_id}/page-placements"
            - "the second shrink to 1 page -> 200 with ${cap1} == 88, ${alloc1} == 80 and ${unalloc1} == 8  # the identical request that failed twice now succeeds because the blocking placement is gone"
            - "${wt1} == 40 == 1 * 40  # the page-count PATCH re-derives weight_oz_milli, so the drop's postage inputs follow the shrink"
            - "placement ${p1_id} is untouched throughout: still page_number 1, offset 0, 80 square inches"

      - name: a_plan_with_negative_contribution_cannot_be_approved
        claim_type: violation_error
        grounds:
          - validations[priority 94].ERR_PLAN_CONTRIBUTION_NEGATIVE
          - state_machines[CirculationPlan.status].transitions[UNDER_REVIEW->APPROVED]
          - calculations.plan_profitability_rollup
        distinguishing_aspect: "The plan is fully legal in every other respect - budget intact, segregation of duties satisfied, merge-purge complete - and is refused purely on the sign of planned_contribution_cents. It is then repaired by the revision back-edge rather than by a new plan, and the SAME approve call succeeds, so the rule is shown to read the current roll-up rather than a flag set at costing."
        test_recipe:
          setup:
            - "Season FW26; segment S_POOR (recency 45 / orders 7 / ltv 62000 so it is not suppressed, but response 10 bps and avg_order_value 1000 cents) and segment S_GOOD (response 620 bps, aov 18500); plan P1 budget 20000000 with a COMPLETED merge-purge run."
            - "Drop 1 (2026-09-15, page_count 64) carries one S_POOR line requested 20000, allocated at the provisional 236."
            - "u-planner-1 costs and submits; u-director-9 approves, so ERR_SEGREGATION_OF_DUTIES at priority 50 cannot fire."
          setup_api_calls:
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { qty: "$.data.planned_quantity", cpb: "$.data.cost_per_book_cents" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { contrib_bad: "$.data.planned_contribution_cents", demand_bad: "$.data.planned_demand_cents", cost_bad: "$.data.planned_cost_cents" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { st_review: "$.data.status" }
          trigger:
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/request-revision"
              payload: { note: "kill the unprofitable segment" }
              as: CirculationDirector
              as_user_id: "u-director-9"
              captures: { st_draft: "$.data.status", rev: "$.data.revision_round", costed_by: "$.data.costed_by_user_id" }
            - call: "POST /catalog-circulation/circulation-lines/${poor_line_id}/void"
              payload: { reason: "negative contribution" }
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { committed_after_void: "$.data.committed_cost_cents" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", requested_quantity: 20000, housefile_segment_id: "${good_seg_id}" }
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { good_line_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { contrib_good: "$.data.planned_contribution_cents" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
              captures: { st_approved: "$.data.status", approved_rev: "$.data.revision_round" }
          assert:
            - "${qty} == 20000 and ${cpb} == 236"
            - "${cost_bad} == 4720000, ${demand_bad} == 20000 (floor(20000 * 10 / 10000) == 20 orders at 1000 cents) and ${contrib_bad} == -4711600 == round_half_up(20000 * 4200 / 10000) == 8400 minus 4720000"
            - "${st_review} == UNDER_REVIEW"
            - "the first approve -> 422 ERR_PLAN_CONTRIBUTION_NEGATIVE and the plan stays UNDER_REVIEW with approved_by_user_id null  # the 403 segregation rule at priority 50 did not fire because the approver is a third user"
            - "${st_draft} == DRAFT, ${rev} == 1 and ${costed_by} is null  # the revision back-edge clears the costing operator"
            - "${committed_after_void} is observable on the plan as 0 after the void  # the 4720000 commitment is released before the replacement line is allocated"
            - "${contrib_good} == 4914800 == round_half_up(22940000 * 4200 / 10000) == 9634800 minus 4720000"
            - "the second approve -> 200 with ${st_approved} == APPROVED and ${approved_rev} == 1  # the identical call now passes because the roll-up is re-read, not cached from the first costing"
            - "CirculationLine.${good_line_id}.status == ALLOCATED and the voided S_POOR line contributes nothing to the approved roll-up"

      - name: duplicate_codes_are_rejected_only_inside_their_own_parent_scope
        claim_type: violation_error
        grounds:
          - validations[priority 78].ERR_DUPLICATE_DROP_NUMBER
          - validations[priority 79]
          - validations[priority 81].ERR_DUPLICATE_AUDIENCE_LINE
        distinguishing_aspect: "Every uniqueness scope is tested twice: once for the collision inside the scope and once for the same literal value succeeding in a sibling scope. segment_code S_A repeats across two seasons, drop_number 1 repeats across two plans, and product_sku repeats across two drops - so an implementation that made any of these globally unique fails on the success half rather than on the error half."
        test_recipe:
          setup:
            - "Two seasons FW26 and SS27; in FW26, segment S_A and plans P1 and P2; drop 1 under each plan; two placements and two lines under FW26's drop 1."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "SS27", fiscal_year: 2027 }
              as: PlatformAdmin
              captures: { s2: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${s1}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg1: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${s1}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan1: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${s1}", plan_code: "P2", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan2: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan1}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { p1d1: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${p1d1}/page-placements"
              payload: { product_sku: "SKU-1", product_name: "Wool throw", unit_price_cents: 12900, unit_cogs_cents: 5400, demand_per_sq_inch_cents: 4200, page_number: 1, sq_in_offset: 0, square_inches: 40, placement_position: "FRONT_COVER" }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${p1d1}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", requested_quantity: 10000, housefile_segment_id: "${seg1}" }
              as: CirculationPlanner
              captures: { line1: "$.data.id" }
            - call: "POST /catalog-circulation/seasons/${s1}/suppression-rules"
              payload: { rule_code: "CAP_ALL", channel_scope: "ALL", window_days: 30, max_contacts_per_window: 5, priority: 20 }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2027 }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${s1}", segment_code: "S_A", recency_days: 90, orders_12mo: 2, ltv_cents: 5000, housefile_count: 1000, avg_order_value_cents: 9000, historical_response_rate_bps: 300 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${s2}", segment_code: "S_A", recency_days: 90, orders_12mo: 2, ltv_cents: 5000, housefile_count: 1000, avg_order_value_cents: 9000, historical_response_rate_bps: 300 }
              as: CirculationPlanner
              captures: { seg2: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${s1}", plan_code: "P1", budget_cents: 999 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/seasons/${s1}/suppression-rules"
              payload: { rule_code: "CAP_ALL", channel_scope: "MAIL", window_days: 60, max_contacts_per_window: 1, priority: 30 }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/circulation-plans/${plan1}/drops"
              payload: { drop_number: 1, in_home_date: "2026-10-20", page_count: 64 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-plans/${plan2}/drops"
              payload: { drop_number: 1, in_home_date: "2026-10-20", page_count: 64 }
              as: CirculationPlanner
              captures: { p2d1: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${p1d1}/page-placements"
              payload: { product_sku: "SKU-1", product_name: "Duplicate sku", unit_price_cents: 8900, unit_cogs_cents: 3700, demand_per_sq_inch_cents: 4100, page_number: 2, sq_in_offset: 0, square_inches: 10, placement_position: "INSIDE" }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${p2d1}/page-placements"
              payload: { product_sku: "SKU-1", product_name: "Same sku other drop", unit_price_cents: 8900, unit_cogs_cents: 3700, demand_per_sq_inch_cents: 4100, page_number: 2, sq_in_offset: 0, square_inches: 10, placement_position: "INSIDE" }
              as: CirculationPlanner
              captures: { ok_placement: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${p1d1}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", requested_quantity: 500, housefile_segment_id: "${seg1}" }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-lines/${line1}/void"
              payload: { reason: "make room" }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${p1d1}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", requested_quantity: 500, housefile_segment_id: "${seg1}" }
              as: CirculationPlanner
              captures: { relisted_line: "$.data.id" }
          assert:
            - "the repeated season_code -> 409 ERR_DUPLICATE_SEASON_CODE even though fiscal_year differs  # season_code is globally unique"
            - "the repeated segment_code in FW26 -> 409 ERR_DUPLICATE_SEGMENT_CODE, while the identical S_A under SS27 -> 201 as ${seg2}  # segment_code is unique per season"
            - "the repeated plan_code in FW26 -> 409 ERR_DUPLICATE_PLAN_CODE"
            - "the repeated rule_code in FW26 -> 409 ERR_DUPLICATE_SUPPRESSION_RULE_CODE even with a different channel_scope, window and priority"
            - "drop_number 1 again under plan1 -> 409 ERR_DUPLICATE_DROP_NUMBER, while drop_number 1 under plan2 -> 201 as ${p2d1}  # drop_number is unique per plan"
            - "product_sku SKU-1 again on ${p1d1} -> 409 ERR_DUPLICATE_PLACEMENT_SKU, while SKU-1 on ${p2d1} -> 201 as ${ok_placement}  # product_sku is unique per drop"
            - "the second S_A line on ${p1d1} while the first is live -> 409 ERR_DUPLICATE_AUDIENCE_LINE"
            - "after ${line1} is VOIDED, the same S_A line is accepted as ${relisted_line}  # only PROPOSED and ALLOCATED rows occupy the audience slot"
            - "every 409 above left no row behind: GET /catalog-circulation/circulation-plans/${plan1}/drops returns exactly one drop and GET /catalog-circulation/drops/${p1d1}/page-placements exactly one placement"

      - name: an_uneditable_plan_reports_its_state_error_before_any_fiscal_check
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: plan_not_editable_at_40_wins_over_budget_exhausted_at_92
          rationale: "The §1.8 priority_pair_validation_conflict instance already constructs an APPROVED plan whose next allocation would also exhaust the budget and pins the 409 ERR_PLAN_NOT_EDITABLE from priority 40 over the 422 ERR_PLAN_BUDGET_EXHAUSTED from priority 92."

      - name: a_suppressed_segment_outranks_a_spacing_collision
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: segment_suppressed_at_55_wins_over_inhome_spacing_at_74
          rationale: "The §1.8 instance already drives one line whose segment is both fatigue-suppressed and inside another drop's in-home buffer, and pins ERR_SEGMENT_SUPPRESSED at priority 55 ahead of ERR_INHOME_SPACING_VIOLATION at priority 74."

      - name: the_role_check_runs_before_the_path_id_is_resolved
        claim_type: cascading_validation
        excluded_because:
          difficulty_instance: auth_forbidden_role_at_20_wins_over_line_not_found_at_30
          rationale: "The §1.8 instance already sends a wrong-role call against a non-existent line id and pins 403 ERR_FORBIDDEN_ROLE from priority 20 ahead of the 404 at priority 30, which is exactly the cascading-order claim."

      - name: a_gap_of_exactly_the_minimum_is_allowed
        claim_type: satisfaction_pass
        excluded_because:
          difficulty_instance: inhome_spacing_is_a_symmetric_day_buffer_around_a_segment
          rationale: "The §1.8 compensating_invariant instance already tests the satisfaction side of the spacing rule from both directions: a gap of exactly min_inhome_gap_days passes whether the new drop is earlier or later, and a voided line releases the buffer it occupied."

  # ===========================================================================
  # SECTION 5 — endpoints
  # ===========================================================================
  - section: endpoints
    instances:

      - name: housefile_segment_crud_reads_writes_lists_and_has_no_delete
        claim_type: standard_crud
        grounds:
          - endpoints[POST /catalog-circulation/housefile-segments]
          - endpoints[GET /catalog-circulation/housefile-segments/{id}]
          - endpoints[PATCH /catalog-circulation/housefile-segments/{id}]
          - endpoints[GET /catalog-circulation/housefile-segments]
        distinguishing_aspect: "The update leg is the interesting one: a PATCH of a single scoring input re-runs the whole RFM calculation and re-defaults the tier and strategy, and a PATCH of housefile_count on a child re-derives the PARENT's rollup_housefile_count. The list leg is then filtered on two derived columns (is_leaf, segment_tier) that no request ever set, and the absence of a DELETE route is asserted because circulation lines reference these rows."
        test_recipe:
          setup:
            - "Season FW26; segment S_PARENT (45 / 7 / 62000, 10000 names) and its child S_CHILD (45 / 7 / 62000, 20000 names)."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_PARENT", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 10000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { parent_id: "$.data.id", p_leaf0: "$.data.is_leaf", p_roll0: "$.data.rollup_housefile_count", p_tier: "$.data.segment_tier" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_CHILD", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 20000, avg_order_value_cents: 18500, historical_response_rate_bps: 620, parent_segment_id: "${parent_id}" }
              as: CirculationPlanner
              captures: { child_id: "$.data.id", c_ver1: "$.data.version" }
            - call: "GET /catalog-circulation/housefile-segments/${parent_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { p_leaf1: "$.data.is_leaf", p_roll1: "$.data.rollup_housefile_count" }
            - call: "PATCH /catalog-circulation/housefile-segments/${child_id}"
              payload: { housefile_count: 25000 }
              as: CirculationPlanner
              captures: { c_count: "$.data.housefile_count", c_ver2: "$.data.version", c_score2: "$.data.rfm_score" }
            - call: "GET /catalog-circulation/housefile-segments/${parent_id}"
              payload: {}
              as: CirculationPlanner
              captures: { p_roll2: "$.data.rollup_housefile_count" }
            - call: "PATCH /catalog-circulation/housefile-segments/${child_id}"
              payload: { recency_days: 400 }
              as: CirculationPlanner
              captures: { c_score3: "$.data.rfm_score", c_tier3: "$.data.segment_tier", c_strategy3: "$.data.contact_strategy", c_ver3: "$.data.version" }
            - call: "GET /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", is_leaf: true }
              as: CirculationDirector
              captures: { leaf_rows: "$.data" }
            - call: "GET /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_tier: "CORE" }
              as: CirculationDirector
              captures: { core_rows: "$.data" }
            - call: "GET /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", limit: 1, offset: 0 }
              as: ListBroker
              captures: { page1: "$.data" }
          assert:
            - "creation returns 201 with ${p_leaf0} == true, ${p_roll0} == 10000 and ${p_tier} == BEST"
            - "${p_leaf1} == false and ${p_roll1} == 30000  # creating the child flipped the parent's derived is_leaf and rolled its 20000 names up"
            - "${c_count} == 25000, ${c_ver2} == ${c_ver1} + 1 and ${c_score2} == 1000  # a housefile_count PATCH does not disturb the RFM score"
            - "${p_roll2} == 35000  # the parent's rollup follows the child's PATCH without the parent being written directly"
            - "${c_score3} == 680 == (8 + 30 + 30) * 10, ${c_tier3} == CORE and ${c_strategy3} == STANDARD  # recency 400 falls into the 8-point band, so the tier and its default strategy are both re-derived (a fatigue-imposed SUPPRESS_ONLY would NOT have been reverted)"
            - "${c_ver3} == ${c_ver2} + 1 and S_CHILD.updated_at moved while created_at did not"
            - "${leaf_rows} contains exactly ${child_id}; the parent is excluded by is_leaf == false"
            - "${core_rows} contains exactly ${child_id}; filtering on a computed column reflects the PATCH"
            - "the limit-1 page reports total_count 2 and has_more true and returns one row  # the §1.0 pagination envelope"
            - "no DELETE route exists for /catalog-circulation/housefile-segments/{id}: the §1.5 table has no such row, so segments referenced by circulation lines can never be removed"

      - name: the_order_feed_ingest_is_all_or_nothing_across_the_batch
        claim_type: bulk_action
        grounds:
          - endpoints[POST /catalog-circulation/_online-orders/ingest]
          - validations[priority 32]
          - calculations.matchback_attribution
        distinguishing_aspect: "One bad segment id in the middle of a three-order batch must reject the whole batch, and the proof is indirect: a matchback run taken immediately afterwards sees zero orders, so not even the first order of the batch was persisted before the failure. The retry then reports ingested_count 2 with the external ids echoed in payload order."
        test_recipe:
          setup:
            - "The reusable approved-and-mailed chain: season FW26, leaf segment S_A (30000 names, 620 bps, aov 18500), plan P1 (budget 20000000) with a COMPLETED merge-purge run, drop 1 (in_home 2026-09-15, page_count 64) with one 20000-book S_A line allocated, costed by u-planner-1, submitted by u-planner-1, approved by u-director-9, presorted with a single FIVE_DIGIT batch of 20000 pieces, and mailed once the clock reaches 2026-09-15 - which leaves exactly one MAIL ContactEvent on S_A dated 2026-09-15."
            - "The clock is then advanced to 2026-09-25T00:00:00Z so both feed orders are in the past."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog-circulation/_online-orders/ingest"
              payload: { orders: [ { external_order_id: "OK-1", housefile_segment_id: "${seg_id}", order_date: "2026-09-15", demand_cents: 40000 }, { external_order_id: "BAD-2", housefile_segment_id: "00000000-0000-4000-8000-00000000dead", order_date: "2026-09-16", demand_cents: 10000 }, { external_order_id: "OK-3", housefile_segment_id: "${seg_id}", order_date: "2026-09-20", demand_cents: 30000 } ] }
              as: PlatformAdmin
            - call: "GET /catalog-circulation/drops/${d1_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { dv1: "$.data.version" }
            - call: "POST /catalog-circulation/drops/${d1_id}/matchback-runs"
              payload: { expected_drop_version: "${dv1}", attribution_variant: "LAST_TOUCH_MAIL", attribution_window_days: 30 }
              as: MarketingAnalyst
              captures: { empty_matched: "$.data.matched_order_count", empty_demand: "$.data.attributed_demand_cents" }
            - call: "POST /catalog-circulation/_online-orders/ingest"
              payload: { orders: [ { external_order_id: "OK-1", housefile_segment_id: "${seg_id}", order_date: "2026-09-15", demand_cents: 40000 }, { external_order_id: "OK-3", housefile_segment_id: "${seg_id}", order_date: "2026-09-20", demand_cents: 30000 } ] }
              as: PlatformAdmin
              captures: { count2: "$.data.ingested_count", ids2: "$.data.external_order_ids" }
            - call: "GET /catalog-circulation/drops/${d1_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { dv2: "$.data.version" }
            - call: "POST /catalog-circulation/drops/${d1_id}/matchback-runs"
              payload: { expected_drop_version: "${dv2}", attribution_variant: "LAST_TOUCH_MAIL", attribution_window_days: 30 }
              as: MarketingAnalyst
              captures: { matched2: "$.data.matched_order_count", attributed2: "$.data.attributed_order_count", demand2: "$.data.attributed_demand_cents" }
          assert:
            - "the mixed batch -> 404 ERR_SEGMENT_NOT_FOUND with no ingested_count in the body"
            - "${empty_matched} == 0 and ${empty_demand} == 0  # OK-1 preceded the bad row in the payload and was still not persisted, so the batch is atomic rather than fail-fast-with-partial-writes"
            - "${count2} == 2 and ${ids2} == [OK-1, OK-3]  # the echo preserves payload order"
            - "${matched2} == 2, ${attributed2} == 2 and ${demand2} == 70000  # both orders fall inside the 30-day window after the 2026-09-15 mail contact"
            - "${dv2} == ${dv1} + 1  # only the first matchback run bumped the drop; the rejected ingest touched no version anywhere"
            - "the first matchback run is now SUPERSEDED by the second and Drop.${d1_id}.measurement_status is MATCHBACK_OPEN"

      - name: a_merge_purge_run_links_only_delivered_rentals_of_its_own_season
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /catalog-circulation/circulation-plans/{id}/merge-purge-runs]
          - state_machines[MergePurgeRun.status].transitions[PENDING->COMPLETED].preconditions
          - entities.MergePurgeRun.fields.input_rental_ids
        distinguishing_aspect: "Three ways of naming the wrong rental are separated on the same endpoint: an id that resolves to nothing is a 404 at priority 32, a rental still in MODELED is ERR_RENTAL_NOT_NETTED, and a DELIVERED rental belonging to a DIFFERENT season is also ERR_RENTAL_NOT_NETTED rather than a not-found - the season check rides on the same precondition. The successful link then flips both rentals to NETTED and writes their post-dedup counts back."
        test_recipe:
          setup:
            - "Season FW26 with leaf segment S_A (30000 names) and plan P1 (budget 20000000); season SS27 with its own rental R_OTHER driven all the way to DELIVERED."
            - "In FW26: R1 (coop 900, gross 10000, housefile overlap 1000 bps, inter-list 0) and R2 (coop 500, gross 20000, housefile overlap 1500 bps, inter-list 3000 bps) both driven to DELIVERED; R3 (coop 700, gross 5000) stopped at MODELED."
          setup_api_calls:
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: ListBroker
              captures: { pv: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${pv}", input_rental_ids: ["${r1_id}", "00000000-0000-4000-8000-00000000dead"] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${pv}", input_rental_ids: ["${r1_id}", "${r3_modeled_id}"] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${pv}", input_rental_ids: ["${r1_id}", "${r_other_season_id}"] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${pv}", input_rental_ids: ["${r1_id}", "${r2_id}"] }
              as: ListBroker
              captures: { run_id: "$.data.id", run_status: "$.data.status", run_order: "$.data.processing_order", run_gross: "$.data.gross_input_names", run_dupes: "$.data.duplicates_removed", run_net: "$.data.net_mailable_names", observed: "$.data.observed_plan_version" }
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { status: "COMPLETED" }
              as: CirculationDirector
              captures: { completed_rows: "$.data" }
          assert:
            - "the unresolvable id -> 404 ERR_RENTAL_NOT_FOUND  # every element of input_rental_ids is resolved at priority 32"
            - "the MODELED rental -> 409 ERR_RENTAL_NOT_NETTED  # a rental must have reached DELIVERED before it can enter a dedupe universe"
            - "the DELIVERED rental from SS27 -> 409 ERR_RENTAL_NOT_NETTED, NOT a 404  # the same-season requirement is enforced by the state precondition, so a valid id from the wrong aggregate is refused as a state error"
            - "after all three rejections no MergePurgeRun row exists for the plan and ${pv} is still the plan's current version, so none of them consumed the optimistic token"
            - "the valid link -> 201 with ${run_status} == COMPLETED, ${observed} == ${pv} and ${run_order} == [${r1_id}, ${r2_id}]  # coop 900 before coop 500"
            - "ProspectListRental.${r1_id}: status NETTED, net_names_delivered 9000 (10000 - 1000 housefile, inter-list forced to 0 at index 0)"
            - "ProspectListRental.${r2_id}: status NETTED, net_names_delivered 11900 (20000 - 3000 housefile - floor(17000 * 3000 / 10000) == 5100)"
            - "${run_gross} == 60000, ${run_dupes} == 9100 and ${run_net} == 50900 == 30000 + 9000 + 11900"
            - "ProspectListRental.${r3_modeled_id} is still MODELED and ${r_other_season_id} is still DELIVERED  # a rejected link mutates neither side"
            - "${completed_rows} contains exactly ${run_id}"

      - name: the_profitability_read_recomputes_and_never_writes
        claim_type: computed_read
        grounds:
          - endpoints[GET /catalog-circulation/circulation-plans/{id}/profitability]
          - calculations.plan_profitability_rollup
          - state_machines[CirculationPlan.status].transitions[COSTED->DRAFT]
        distinguishing_aspect: "The read is taken after a structural change that has invalidated the stored roll-up: voiding a line knocks the plan from COSTED back to DRAFT without re-costing it, so the endpoint must return freshly recomputed figures that differ from the last costing while leaving status DRAFT and version untouched. An implementation that returns the stored columns reports the pre-void totals; one that re-costs as a side effect moves the plan back to COSTED."
        test_recipe:
          setup:
            - "Season FW26; segments S_A (30000 names, 620 bps, aov 18500) and S_B (30000 names, 400 bps, aov 12000); plan P1 budget 20000000 with a COMPLETED merge-purge run."
            - "Drop 1 (2026-09-15, page_count 64) carries line A (S_A, 20000) and line B (S_B, 10000); requested_quantity_total 30000 is below the 40000 rebate band so the cost per book is 236."
            - "Both lines are allocated, then the plan is costed by u-planner-1."
          setup_api_calls:
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { cost0: "$.data.planned_cost_cents", demand0: "$.data.planned_demand_cents", contrib0: "$.data.planned_contribution_cents", ver0: "$.data.version", status0: "$.data.status" }
          trigger:
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}/profitability"
              payload: {}
              as: MarketingAnalyst
              captures: { r1_cost: "$.data.planned_cost_cents", r1_contrib: "$.data.planned_contribution_cents", r1_ver: "$.data.version", r1_status: "$.data.status" }
            - call: "POST /catalog-circulation/circulation-lines/${line_b_id}/void"
              payload: { reason: "negative contribution line" }
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { ver1: "$.data.version", status1: "$.data.status", stored_cost: "$.data.planned_cost_cents" }
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}/profitability"
              payload: {}
              as: MarketingAnalyst
              captures: { r2_cost: "$.data.planned_cost_cents", r2_demand: "$.data.planned_demand_cents", r2_contrib: "$.data.planned_contribution_cents", r2_ver: "$.data.version", r2_status: "$.data.status" }
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}/profitability"
              payload: {}
              as: CirculationDirector
              captures: { r3_cost: "$.data.planned_cost_cents", r3_ver: "$.data.version" }
          assert:
            - "${status0} == COSTED, ${cost0} == 7080000, ${demand0} == 27740000 and ${contrib0} == 4570800  # line A contributes 4914800 and line B minus 344000 (2016000 margin against 2360000 of cost)"
            - "${r1_cost} == ${cost0}, ${r1_contrib} == ${contrib0}, ${r1_status} == COSTED and ${r1_ver} == ${ver0}  # the read agrees with the fresh costing and bumps nothing"
            - "${status1} == DRAFT  # the void is a structural mutation, so the COSTED -> DRAFT invalidation edge fired"
            - "${r2_cost} == 4720000, ${r2_demand} == 22940000 and ${r2_contrib} == 4914800  # recomputed from the single surviving ALLOCATED line"
            - "${r2_status} == DRAFT and ${r2_ver} == ${ver1}  # the recompute did not re-cost the plan and did not bump the version"
            - "${r3_cost} == ${r2_cost} and ${r3_ver} == ${r2_ver}  # a second identical read is idempotent"
            - "the plan's committed_cost_cents is 4720000 and uncommitted_budget_cents is 15280000 throughout the two reads"
            - "GET /catalog-circulation/circulation-plans/${plan_id}/profitability with an unresolvable id -> 404 ERR_PLAN_NOT_FOUND"

      - name: mail_is_allowed_only_once_the_clock_reaches_the_in_home_date
        claim_type: conditional_action
        grounds:
          - state_machines[Drop.production_status].transitions[PRESORTED->MAILED].preconditions
          - state_machines[Drop.production_status].transitions[MAILED->DELIVERED]
          - endpoints[POST /catalog-circulation/drops/{id}/mail]
        distinguishing_aspect: "The identical /mail call is refused twice and then accepted with nothing changed but the clock, and the refusal is a 409 ERR_INVALID_DROP_STATE even though the drop's state is perfectly valid - the blocking condition is temporal. The successful mail then dates its cascade ContactEvent on the in-home date while stamping mailed_at from the clock, so the two timestamps deliberately disagree."
        test_recipe:
          setup:
            - "The reusable approved chain on season FW26: plan P1 approved by u-director-9, drop 1 (in_home 2026-09-15, page_count 64) presorted with a single FIVE_DIGIT batch covering its 20000 allocated books, one S_A line."
            - "The clock is at 2026-08-01T00:00:00Z when the first attempts are made."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/mail"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/deliver"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/drops/${d1_id}/mail"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/drops/${d1_id}/mail"
              payload: {}
              as: CirculationPlanner
              captures: { prod: "$.data.production_status", mailed_at: "$.data.mailed_at", meas: "$.data.measurement_status" }
            - call: "GET /catalog-circulation/drops/${d1_id}/contact-events"
              payload: { channel: "MAIL" }
              as: MarketingAnalyst
              captures: { events: "$.data" }
            - call: "POST /catalog-circulation/drops/${d1_id}/deliver"
              payload: {}
              as: CirculationPlanner
              captures: { prod2: "$.data.production_status", meas2: "$.data.measurement_status" }
          assert:
            - "the first /mail (clock 2026-08-01) -> 409 ERR_INVALID_DROP_STATE  # production_status is a legal PRESORTED, so the refusal comes purely from in_home_date > now"
            - "the /deliver on a PRESORTED drop -> 409 ERR_INVALID_DROP_STATE and the drop stays PRESORTED  # the step cannot be skipped"
            - "the /mail one day early (clock 2026-09-14) -> 409 ERR_INVALID_DROP_STATE and no ContactEvent exists yet for the drop"
            - "the /mail at clock 2026-09-16 -> 200 with ${prod} == MAILED and ${mailed_at} == 2026-09-16T00:00:00Z  # mailed_at comes from the clock, and a clock at or past the in-home date qualifies"
            - "${events} holds exactly one row with contact_date == 2026-09-15 and source == DROP_MAIL_CASCADE  # the cascade dates the contact on the IN-HOME date, not on mailed_at"
            - "${meas} == PENDING and ${meas2} == PENDING  # neither /mail nor /deliver touches the measurement dimension"
            - "the /deliver after mailing -> 200 with ${prod2} == DELIVERED"
            - "each of the three rejected calls left Drop.${d1_id}.version unchanged; only the two accepted transitions bumped it"

      - name: an_action_endpoint_fires_its_declared_side_effects
        claim_type: action_endpoint
        excluded_because:
          difficulty_instance: mail_drop_cascades_five_hops_to_plan_budget_via_fatigue_suppression
          rationale: "The §1.8 transitive_cascade instance already exercises the richest action endpoint in the domain end to end, verifying every declared side effect of POST /drops/{id}/mail across all five hops down to the plan's budget ledger, which subsumes the generic action-endpoint claim."

  # ===========================================================================
  # SECTION 6 — errors  (every §1.6 code must be triggerable; codes already
  # driven by a §1.8 instance are recorded here as excluded stubs so the
  # coverage ledger stays complete and auditable)
  # ===========================================================================
  - section: errors
    instances:

      - name: a_missing_or_empty_x_user_id_is_unauthenticated_before_anything_else
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority 10]
          - endpoints[* every endpoint requires the X-User-ID header]
        distinguishing_aspect: "Priority 10 is asserted against the three cheapest ways to fail later: a wrong-role endpoint, an unresolvable path id and a malformed body all return 401 when the header is absent, so authentication cannot be reached through any of them. An empty-string header is treated identically to a missing one, and the test-driving endpoints are held to the same rule."
        test_recipe:
          setup:
            - "Season FW26 and plan P1 exist, created normally with headers present."
            - "Each trigger call below is issued with the X-User-ID header OMITTED entirely, except where the assert says the header is present but empty."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "GET /catalog-circulation/seasons/${season_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: ""
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              as_user_id: ""
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "SS27", fiscal_year: 2027 }
              as: MarketingAnalyst
              as_user_id: ""
            - call: "GET /catalog-circulation/circulation-plans/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: CirculationDirector
              as_user_id: ""
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "not-a-timestamp" }
              as: PlatformAdmin
              as_user_id: ""
          assert:
            - "the header-less GET -> 401 ERR_UNAUTHENTICATED  # even a pure read is gated"
            - "the header-less segment POST -> 401 ERR_UNAUTHENTICATED and no segment row exists afterwards"
            - "the header-less wrong-role POST /seasons as MarketingAnalyst -> 401 ERR_UNAUTHENTICATED, NOT 403 ERR_FORBIDDEN_ROLE  # priority 10 precedes priority 20"
            - "the header-less GET on an unresolvable plan id -> 401 ERR_UNAUTHENTICATED, NOT 404 ERR_PLAN_NOT_FOUND  # priority 10 precedes priority 30"
            - "the header-less clock POST with a malformed timestamp -> 401 ERR_UNAUTHENTICATED, NOT 422 ERR_INVALID_REQUEST  # priority 10 precedes priority 35, and the test-driving endpoints are not exempt"
            - "an X-User-ID header present but empty produces exactly the same 401 as an omitted header in all five cases"
            - "every response body carries the §1.0 error envelope with response_type == error and data.error_id == ERR_UNAUTHENTICATED"

      - name: err_forbidden_role_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: auth_forbidden_role_at_20_wins_over_line_not_found_at_30
          rationale: "That §1.8 instance issues a wrong-role call and asserts 403 ERR_FORBIDDEN_ROLE, and the §1.9 rbac section then covers the full denial grid, so a dedicated errors-section test would be redundant."

      - name: err_line_not_found_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: auth_forbidden_role_at_20_wins_over_line_not_found_at_30
          rationale: "The same §1.8 instance resolves an allowed-role call against a non-existent circulation line id and asserts the 404, which is the only thing an errors-section test would add."

      - name: err_plan_not_editable_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: plan_not_editable_at_40_wins_over_budget_exhausted_at_92
          rationale: "That §1.8 instance mutates an APPROVED plan's structure and asserts 409 ERR_PLAN_NOT_EDITABLE; the §1.9 presort-coverage instance also hits the code from the batch-repair path."

      - name: err_plan_budget_exhausted_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: plan_not_editable_at_40_wins_over_budget_exhausted_at_92
          rationale: "The same §1.8 instance builds an allocation whose highest-priority line cannot afford one book on an editable plan and asserts 422 ERR_PLAN_BUDGET_EXHAUSTED on that control leg."

      - name: err_segment_suppressed_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: segment_suppressed_at_55_wins_over_inhome_spacing_at_74
          rationale: "That §1.8 instance drives a fatigue-suppressed segment onto a new circulation line and asserts 422 ERR_SEGMENT_SUPPRESSED."

      - name: err_inhome_spacing_violation_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: inhome_spacing_is_a_symmetric_day_buffer_around_a_segment
          rationale: "That §1.8 instance asserts 409 ERR_INHOME_SPACING_VIOLATION from both temporal directions and on the day inside the buffer, which is strictly more than a triggerability test."

      - name: err_invalid_plan_state_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: presorting_a_drop_requires_its_plan_to_be_approved
          rationale: "That §1.8 cross_entity_state_dependency instance presorts a drop under a DRAFT, COSTED and UNDER_REVIEW plan in turn and asserts 409 ERR_INVALID_PLAN_STATE each time."

      - name: err_rental_not_netted_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: allocating_a_rental_line_requires_its_rental_to_be_netted
          rationale: "That §1.8 instance allocates a RENTAL line whose rental is still DELIVERED and asserts 409 ERR_RENTAL_NOT_NETTED; the §1.9 cross-reference instance additionally reaches the code through the merge-purge input list."

      - name: err_invalid_drop_state_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: opening_a_matchback_run_requires_its_drop_to_be_mailed
          rationale: "That §1.8 instance opens a matchback run against a PLANNED and a PRESORTED drop and asserts 409 ERR_INVALID_DROP_STATE from the measurement dimension's guard on the production dimension."

      - name: err_page_space_overlap_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: page_space_is_a_half_open_interval_that_permits_adjacency
          rationale: "That §1.8 instance places overlapping and exactly-adjacent intervals on the same page and asserts 409 ERR_PAGE_SPACE_OVERLAP only for the true overlap."

      - name: err_page_capacity_exceeded_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: page_space_is_a_half_open_interval_that_permits_adjacency
          rationale: "The same §1.8 instance runs a placement past the end of its page and past the drop's last page and asserts 422 ERR_PAGE_CAPACITY_EXCEEDED; the §1.9 page_count-shrink instance covers the drop-level sibling code."

  # ===========================================================================
  # SECTION 7 — rbac  (role_model: segregation_of_duties over peer roles)
  # ===========================================================================
  - section: rbac
    instances:

      - name: each_role_can_perform_its_own_exclusive_operations
        claim_type: exclusive_operations_allowed
        grounds:
          - roles.PlatformAdmin
          - roles.CirculationPlanner
          - roles.CirculationDirector
          - roles.ListBroker
          - roles.MarketingAnalyst
        distinguishing_aspect: "One representative exclusive write per role is driven in a single dependency chain, so the five peer ownership zones are shown to interlock: the broker's rental and the analyst's contact event attach to the planner's season-scoped rows, and the director closes the plan the planner opened. Every role also succeeds on a shared GET of a row it cannot write."
        test_recipe:
          setup:
            - "Nothing pre-exists; the chain is built entirely by the five roles under test."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { seg_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "COOP-A", requested_gross_names: 10000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 1000, inter_list_overlap_bps: 0 }
              as: ListBroker
              as_user_id: "u-broker-1"
              captures: { rental_id: "$.data.id" }
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "EMAIL", contact_date: "2026-07-20", source: "MANUAL_LOG" }
              as: MarketingAnalyst
              as_user_id: "u-analyst-1"
              captures: { event_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { plan_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cancel"
              payload: { reason: "role smoke test" }
              as: CirculationDirector
              as_user_id: "u-director-9"
              captures: { plan_status: "$.data.status" }
            - call: "GET /catalog-circulation/seasons/${season_id}"
              payload: {}
              as: ListBroker
              as_user_id: "u-broker-1"
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: MarketingAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /catalog-circulation/seasons/${season_id}/prospect-list-rentals"
              payload: { status: "REQUESTED" }
              as: CirculationDirector
              as_user_id: "u-director-9"
              captures: { rental_rows: "$.data" }
          assert:
            - "PlatformAdmin creating the season -> 201; CirculationPlanner creating the segment and the plan -> 201; ListBroker creating the rental -> 201; MarketingAnalyst creating the contact event -> 201; CirculationDirector cancelling the plan -> 200 with ${plan_status} == CANCELLED"
            - "every one of those five writes belongs to exactly one role's exclusive_operations list in §1.7"
            - "the three shared GETs all -> 200: ListBroker reads a season it cannot write, MarketingAnalyst reads a plan it cannot write, CirculationDirector lists rentals it cannot create"
            - "${rental_rows} contains ${rental_id}, and GET /catalog-circulation/housefile-segments/${seg_id}/contact-events contains ${event_id}"
            - "ContactEvent.${event_id} was accepted on a season whose plan the analyst never touched, confirming the analyst's zone spans aggregates the planner owns"

      - name: a_role_cannot_perform_another_roles_exclusive_operations
        claim_type: exclusive_operations_denied
        grounds:
          - roles.*.exclusive_operations
          - validations[priority 20].ERR_FORBIDDEN_ROLE
          - complexity_profile.role_model
        distinguishing_aspect: "The denial grid is deliberately anti-hierarchical: PlatformAdmin - the role that creates seasons and drives the clock - is refused on both the planner's and the director's exclusive writes, so there is no super-user. Two shared-looking GETs are also refused to ListBroker, proving the read surface is per-endpoint rather than blanket."
        test_recipe:
          setup:
            - "Season FW26, segment S_A, plan P1 (DRAFT), drop 1 with one allocated S_A line and one page placement, and rental R1 all exist, created by their proper roles."
          setup_api_calls:
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { plan_status: "$.data.status" }
          trigger:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "SS27", fiscal_year: 2027 }
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_ADMIN", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 1000, avg_order_value_cents: 9000, historical_response_rate_bps: 300 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cancel"
              payload: { reason: "admin overreach" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P_DIR", budget_cents: 100000 }
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: ListBroker
              as_user_id: "u-broker-1"
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: MarketingAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: MarketingAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "MAIL", contact_date: "2026-07-20", source: "MANUAL_LOG" }
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "RENTAL", requested_quantity: 1000, prospect_list_rental_id: "${rental_id}" }
              as: ListBroker
              as_user_id: "u-broker-1"
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "DIRECTOR-LIST", requested_gross_names: 5000, cost_per_thousand_cents: 8000, housefile_overlap_bps: 500, inter_list_overlap_bps: 0 }
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "GET /catalog-circulation/drops/${d1_id}/page-placements"
              payload: {}
              as: ListBroker
              as_user_id: "u-broker-1"
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}/profitability"
              payload: {}
              as: ListBroker
              as_user_id: "u-broker-1"
          assert:
            - "all twelve calls -> 403 ERR_FORBIDDEN_ROLE"
            - "PlatformAdmin is refused on both POST /housefile-segments and POST /circulation-plans/{id}/cancel  # peer roles, no hierarchical override: the role that seeds the season cannot plan or govern with it"
            - "CirculationDirector is refused on POST /circulation-plans and POST /prospect-list-rentals  # the approver cannot author what it approves, which is the structural half of segregation of duties"
            - "ListBroker is refused on /approve and on POST /drops/{id}/circulation-lines; MarketingAnalyst is refused on /allocate and on the clock endpoint; CirculationPlanner is refused on POST /seasons and POST /contact-events"
            - "ListBroker is refused on GET /drops/{id}/page-placements and GET /circulation-plans/{id}/profitability  # the read surface is enumerated per endpoint, so 'all roles share every GET' is false"
            - "${plan_status} is still DRAFT after all twelve refusals and no new season, plan, rental, line or contact event exists"
            - "every refusal is a 403 with error_id ERR_FORBIDDEN_ROLE even when the body would also have failed validation (for example the director's 100000-cent plan)"

      - name: the_operator_who_costs_or_submits_a_plan_cannot_approve_it
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 50].ERR_SEGREGATION_OF_DUTIES
          - state_machines[CirculationPlan.status].transitions[UNDER_REVIEW->APPROVED].preconditions
          - complexity_profile.role_model
        distinguishing_aspect: "Two plans separate the two forbidden identities: on P1 the approver equals costed_by_user_id and on P2 the approver equals submitted_by_user_id, and both are refused with the same 403 while a third operator succeeds on each. The role header is correct in every case - only X-User-ID differs - so the check is identity-based rather than role-based, and the revision back-edge is shown to clear the recorded identities."
        test_recipe:
          setup:
            - "Season FW26; segment S_A (30000 names, 620 bps, aov 18500); two plans P1 and P2, each with budget 20000000, a COMPLETED merge-purge run and one drop carrying a single allocated 20000-book S_A line, so each plan's planned_contribution_cents is a positive 4914800."
            - "On P1: u-planner-1 costs and u-planner-2 submits. On P2: u-planner-3 costs and u-planner-4 submits."
            - "Every approve call below is sent with the CirculationDirector role; only the X-User-ID changes."
          setup_api_calls:
            - call: "POST /catalog-circulation/circulation-plans/${p1_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { p1_costed_by: "$.data.costed_by_user_id" }
            - call: "POST /catalog-circulation/circulation-plans/${p1_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-2"
              captures: { p1_submitted_by: "$.data.submitted_by_user_id" }
            - call: "POST /catalog-circulation/circulation-plans/${p2_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-3"
            - call: "POST /catalog-circulation/circulation-plans/${p2_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-4"
          trigger:
            - call: "POST /catalog-circulation/circulation-plans/${p1_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${p2_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-planner-4"
            - call: "POST /catalog-circulation/circulation-plans/${p1_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-planner-2"
            - call: "POST /catalog-circulation/circulation-plans/${p1_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
              captures: { p1_status: "$.data.status", p1_approved_by: "$.data.approved_by_user_id" }
            - call: "POST /catalog-circulation/circulation-plans/${p2_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-planner-3"
            - call: "POST /catalog-circulation/circulation-plans/${p2_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
              captures: { p2_status: "$.data.status" }
            - call: "POST /catalog-circulation/circulation-plans/${p1_id}/request-revision"
              payload: { note: "re-plan" }
              as: CirculationDirector
              as_user_id: "u-director-9"
              captures: { p1_after_rev_costed_by: "$.data.costed_by_user_id", p1_after_rev_submitted_by: "$.data.submitted_by_user_id", p1_after_rev_status: "$.data.status" }
          assert:
            - "${p1_costed_by} == u-planner-1 and ${p1_submitted_by} == u-planner-2"
            - "approving P1 as u-planner-1 -> 403 ERR_SEGREGATION_OF_DUTIES  # the approver equals costed_by_user_id"
            - "approving P1 as u-planner-2 -> 403 ERR_SEGREGATION_OF_DUTIES  # the approver equals submitted_by_user_id"
            - "approving P2 as u-planner-4 -> 403 ERR_SEGREGATION_OF_DUTIES and as u-planner-3 -> 403 ERR_SEGREGATION_OF_DUTIES  # both identities are blocked on the second plan too"
            - "all four refusals carry the CirculationDirector role, so a correct role is not sufficient; the plans stay UNDER_REVIEW with approved_by_user_id null"
            - "approving P1 and P2 as u-director-9 -> 200 with ${p1_status} == APPROVED, ${p2_status} == APPROVED and ${p1_approved_by} == u-director-9"
            - "${p1_after_rev_status} == DRAFT with ${p1_after_rev_costed_by} == null and ${p1_after_rev_submitted_by} == null  # the revision edge clears both recorded identities, so u-planner-1 could now cost, submit and later be a legal approver only if it is not the one who re-costs"

  # ===========================================================================
  # SECTION 8 — cross_cutting_complexity_layers
  # (active layers: optimistic_concurrency, cascading_side_effects,
  #  dual_variant_calculation, rate_threshold_triggers)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: a_stale_expected_plan_version_blocks_a_merge_purge_run
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.merge-purge-create-stale-plan
          - endpoints[POST /catalog-circulation/circulation-plans/{id}/merge-purge-runs]
          - entities.CirculationPlan.fields.version
        distinguishing_aspect: "The token is invalidated by the run's OWN side effect: a successful merge-purge increments the plan's version, so replaying the very token that just worked must now fail. The rejection is also shown to be inert - no run row, no supersede of the previous COMPLETED universe and no version consumed - and the retry with the refreshed token supersedes exactly one prior run."
        test_recipe:
          setup:
            - "Season FW26 with leaf segment S_A (30000 names, not suppressed) and plan P1 (budget 20000000, DRAFT)."
            - "concurrency_rules.merge-purge-create-stale-plan declares occ_field expected_plan_version on CirculationPlan with error ERR_STALE_PLAN_VERSION (412)."
          setup_api_calls:
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: ListBroker
              captures: { v1: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${v1}", input_rental_ids: [] }
              as: ListBroker
              captures: { run1: "$.data.id", run1_status: "$.data.status", run1_observed: "$.data.observed_plan_version" }
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: ListBroker
              captures: { v2: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${v2}", input_rental_ids: [] }
              as: ListBroker
              captures: { run2: "$.data.id", run2_status: "$.data.status", run2_observed: "$.data.observed_plan_version" }
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: {}
              as: CirculationDirector
              captures: { all_runs: "$.data" }
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: ListBroker
              captures: { v3: "$.data.version" }
          assert:
            - "${run1_status} == COMPLETED with ${run1_observed} == ${v1} and net_mailable_names 30000"
            - "${v2} == ${v1} + 1  # the write increments the plan version, which is what invalidates the token that produced it"
            - "the replay with ${v1} -> 412 ERR_STALE_PLAN_VERSION"
            - "the 412 is inert: ${all_runs} holds exactly two rows, so no third run was created by the rejected call"
            - "MergePurgeRun.${run1} was still COMPLETED at the moment of the 412 - a rejected create supersedes nothing"
            - "the retry with ${v2} -> 201 with ${run2_status} == COMPLETED and ${run2_observed} == ${v2}"
            - "MergePurgeRun.${run1}.status == SUPERSEDED once ${run2} completes, and exactly one run is COMPLETED"
            - "${v3} == ${v2} + 1  # every accepted write increments the version, and the rejected one did not"
            - "an expected_plan_version far ahead of reality (${v3} plus 50) is rejected with the same 412 ERR_STALE_PLAN_VERSION, so the check is equality and not a lower bound"

      - name: a_stale_expected_drop_version_blocks_a_matchback_run
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.matchback-create-stale-drop
          - endpoints[POST /catalog-circulation/drops/{id}/matchback-runs]
          - entities.Drop.fields.version
        distinguishing_aspect: "The same self-invalidating token shape is verified on the second OCC rule, and the ordering of the two guards is pinned as well: a call that is BOTH aimed at a not-yet-mailed drop and carrying a stale token reports the priority-42 state error, never the priority-45 412. The successful self-loop supersedes the previous run while the rejected one leaves it OPEN."
        test_recipe:
          setup:
            - "The reusable approved chain: plan P1 approved, drop 1 (in_home 2026-09-15, page_count 64) presorted and mailed at clock 2026-09-16, plus drop 2 (in_home 2026-10-20) still PLANNED under the same plan."
            - "The clock is then advanced to 2026-09-25T00:00:00Z and two orders for S_A are ingested (2026-09-15 for 40000 cents and 2026-09-20 for 30000 cents)."
          setup_api_calls:
            - call: "GET /catalog-circulation/drops/${d1_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { dv1: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/matchback-runs"
              payload: { expected_drop_version: "${dv1}", attribution_variant: "LAST_TOUCH_MAIL", attribution_window_days: 30 }
              as: MarketingAnalyst
              captures: { mb1: "$.data.id", mb1_status: "$.data.status", mb1_demand: "$.data.attributed_demand_cents" }
            - call: "GET /catalog-circulation/drops/${d1_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { dv2: "$.data.version", meas1: "$.data.measurement_status" }
            - call: "POST /catalog-circulation/drops/${d1_id}/matchback-runs"
              payload: { expected_drop_version: "${dv1}", attribution_variant: "FRACTIONAL_MULTI_TOUCH", attribution_window_days: 30 }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/drops/${d2_id}/matchback-runs"
              payload: { expected_drop_version: "${dv1}", attribution_variant: "LAST_TOUCH_MAIL", attribution_window_days: 30 }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/drops/${d1_id}/matchback-runs"
              payload: { expected_drop_version: "${dv2}", attribution_variant: "FRACTIONAL_MULTI_TOUCH", attribution_window_days: 30 }
              as: MarketingAnalyst
              captures: { mb2: "$.data.id", mb2_status: "$.data.status" }
            - call: "GET /catalog-circulation/drops/${d1_id}/matchback-runs"
              payload: {}
              as: MarketingAnalyst
              captures: { runs: "$.data" }
          assert:
            - "${mb1_status} == OPEN with ${mb1_demand} == 70000 and ${meas1} == MATCHBACK_OPEN"
            - "${dv2} == ${dv1} + 1  # the matchback create bumps the DROP, not the plan"
            - "the replay with ${dv1} -> 412 ERR_STALE_DROP_VERSION, and MatchbackRun.${mb1} is still OPEN afterwards - a rejected self-loop supersedes nothing"
            - "the call against the PLANNED drop 2 carrying drop 1's version token ${dv1} -> 409 ERR_INVALID_DROP_STATE, NOT 412  # drop 1 has been presorted and mailed, so ${dv1} cannot be drop 2's current version either; priority 42 precedes priority 45, so the state guard is reported even though the token is also wrong"
            - "drop 2 keeps measurement_status PENDING and its version is unchanged"
            - "the retry with ${dv2} -> 201 with ${mb2_status} == OPEN, MatchbackRun.${mb1}.status == SUPERSEDED and ${runs} holding exactly two rows"
            - "Drop.${d1_id}.version == ${dv2} + 1 and production_status is still MAILED  # the measurement dimension advanced twice without touching production"

      - name: a_cascade_reaches_every_declared_hop
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: mail_drop_cascades_five_hops_to_plan_budget_via_fatigue_suppression
          rationale: "The §1.8 transitive_cascade instance already verifies the five-hop mail cascade end to end - contact event, fatigue recompute, suppression flip, line suppression on still-PLANNED drops only, and the budget credit back to the plan - which is exactly the layer's claim; the rental-cancel instance covers a second, four-hop chain."
      - name: both_variants_of_a_dual_calculation_are_reachable
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: line_demand_forecast_gross_vs_net_diverge_on_holdout_line
          rationale: "The §1.8 dual_variant_calc instances already drive both variants of the demand forecast and of the matchback attribution on identical data and pin the deltas, and the cost-per-book instance pins the ledger effect of switching from ESTIMATED_POSTAGE to PRESORTED_ACTUAL."
      - name: a_cumulative_threshold_fires_exactly_at_its_boundary
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: fatigue_score_exactly_at_threshold_suppresses
          rationale: "The §1.8 boundary_precision_check instances already sit the cumulative fatigue score exactly on fatigue_suppression_threshold and one point below it, and put the instantaneous automation share exactly on 9000 bps and one piece below, which covers both threshold shapes this layer names."

  # ===========================================================================
  # SECTION 9 — consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_and_cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines[Drop.production_status].transitions[PRESORTED->MAILED].side_effects
          - calculations.drop_allocation_waterfall
          - calculations.plan_profitability_rollup
        distinguishing_aspect: "The two deepest write paths in the domain are read back with no intervening action: the /allocate response itself already carries the recomputed drop aggregates, and the very next read of the plan shows the ledger debited - while the /mail response's drop already reflects work done by hop 5 of its own cascade. Nothing here is allowed to require a second request, a retry or a re-read to settle."
        test_recipe:
          setup:
            - "Season FW26; segments S_HOT (fatigue-primed so that the mail contact pushes it over the threshold of 100: three MAIL contacts inside the freshest decay band already give it 90 points) and S_COLD; plan P1 budget 20000000 with a COMPLETED merge-purge run."
            - "Drop 1 (in_home 2026-09-15, page_count 64) carries an allocated S_HOT line; drop 2 (in_home 2026-10-20, page_count 64) is still PLANNED and carries an ALLOCATED S_HOT line plus an ALLOCATED S_COLD line."
            - "Plan P1 is costed, submitted and approved by distinct operators, and drop 1 is presorted; the clock is then set to 2026-09-16."
          setup_api_calls:
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: CirculationPlanner
              captures: { committed_before: "$.data.committed_cost_cents", unc_before: "$.data.uncommitted_budget_cents", ver_before: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/mail"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { mail_prod: "$.data.production_status", mail_at: "$.data.mailed_at" }
            - call: "GET /catalog-circulation/housefile-segments/${hot_seg_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { hot_score: "$.data.fatigue_score", hot_strategy: "$.data.contact_strategy", hot_suppressed_at: "$.data.suppressed_at" }
            - call: "GET /catalog-circulation/circulation-lines"
              payload: { drop_id: "${d2_id}" }
              as: CirculationPlanner
              captures: { d2_lines: "$.data" }
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: CirculationPlanner
              captures: { committed_after: "$.data.committed_cost_cents", unc_after: "$.data.uncommitted_budget_cents", ver_after: "$.data.version" }
            - call: "GET /catalog-circulation/drops/${d2_id}"
              payload: {}
              as: CirculationPlanner
              captures: { d2_qty: "$.data.planned_quantity", d2_cpb: "$.data.cost_per_book_cents" }
          assert:
            - "${mail_prod} == MAILED and ${mail_at} == 2026-09-16T00:00:00Z, returned by the mail call itself"
            - "the FIRST read of the segment after the mail already shows ${hot_score} >= 100, ${hot_strategy} == SUPPRESS_ONLY and ${hot_suppressed_at} == 2026-09-16T00:00:00Z  # hops 2 and 3 completed inside the mail request"
            - "${d2_lines} shows the S_HOT line on the still-PLANNED drop 2 already SUPPRESSED with allocated_quantity, mailable_quantity, forecast_demand_cents, gross_margin_cents, circulation_cost_cents and contribution_cents all 0, while the S_COLD line is untouched and still ALLOCATED  # hop 4, conditional on the drop being PLANNED"
            - "${committed_after} < ${committed_before} by exactly the suppressed line's former committed_cost_cents and ${unc_after} == 20000000 - ${committed_after}  # hop 5's credit is visible on the first read, with no reconciliation pass"
            - "${ver_after} > ${ver_before}: the plan row was rewritten by the cascade, not marked dirty for later"
            - "${d2_qty} and ${d2_cpb} were already re-derived for drop 2 in the same request, so the drop that lost an audience reprices immediately"
            - "the line on drop 1 is NOT suppressed even though its segment is: the drop is past PLANNED, which is the conditional half of hop 4"
            - "repeating all five reads a second time returns byte-identical values  # nothing settles late, so no read is order-dependent"
