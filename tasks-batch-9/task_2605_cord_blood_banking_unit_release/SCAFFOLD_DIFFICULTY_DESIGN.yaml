            - call: "POST /cbb/storage-accounts"
              payload: { enrollment_id: "${enr_lg_id}", billing_contact_email: "lg@example.test", plan_term_years: 1, prepaid_through_date: "2027-06-30" }
              as: BillingAdministrator
              captures: { acct_lg_id: "$.data.id" }
            - call: "POST /cbb/collection-kits"
              payload: { enrollment_id: "${enr_lg_id}", kit_lot_code: "LOT-2026-L", courier_tracking_code: "TRK-1600" }
              as: IntakeCoordinator
              captures: { kit_lg_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/maternal-screenings"
              payload: { enrollment_id: "${enr_lg_id}", collected_at: "2026-08-10T05:00:00Z", hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "POST /cbb/collections"
              payload: { kit_id: "${kit_lg_id}", collected_at: "2026-08-10T05:00:00Z", collection_volume_ml: 130.0, anticoagulant_volume_ml: 25.0, delivery_mode: "VAGINAL" }
              as: CollectionSite
              captures: { col_lg_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/collections/${col_lg_id}/receive"
              payload: { transport_temp_c: 20.0 }
              as: ProcessingTechnologist
            - call: "GET /cbb/collections/${col_lg_id}/units"
              payload: {}
              as: ProcessingTechnologist
              captures: { unit_lg_id: "$.data[0].id" }
            - call: "POST /cbb/processing-runs"
              payload: { unit_id: "${unit_lg_id}", method: "HES_SEDIMENTATION", pre_tnc_millions: 1100 }
              as: ProcessingTechnologist
              captures: { run_lg_id: "$.data.id" }
            - call: "POST /cbb/processing-runs/${run_lg_id}/complete"
              payload: { outcome: "COMPLETED", post_volume_ml: 25.0, post_tnc_millions: 1000 }
              as: ProcessingTechnologist
            - call: "POST /cbb/quality-tests"
              payload: { unit_id: "${unit_lg_id}", test_kind: "POST_PROCESSING", tnc_millions: 1000, cd34_thousands: 2400, viability_pct: 88.0, volume_ml: 25.0, sterility_result: "NEGATIVE" }
              as: ProcessingTechnologist
              as_user_id: "tech-001"
            - call: "POST /cbb/units/${unit_lg_id}/eligibility-determination"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "POST /cbb/units/${unit_lg_id}/cryopreserve"
              payload: { tank_id: "${tank_n_id}", slot_code: "N-01", freeze_at: "2026-08-11T02:00:00Z" }
              as: ProcessingTechnologist
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/storage-invoices"
              payload: { account_id: "${acct_lg_id}", billing_period_start: "2026-09-01", billing_period_end: "2027-08-31", prorated_days: 365 }
              as: BillingAdministrator
              captures: { inv_lg_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/ops/nightly-run"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
