# =============================================================================
# Scaffold: mobile-home-lot-lease benchmark seed tables (v1)
# =============================================================================

scenario: |
  51. Mobile Home Community Lot Lease: lot rental, utility apportionment, home
  sale with lot lease, annual increase cap (state-specific), eviction for
  violation, Park-owned/Resident-owned conversion

domain_name: mobile-home-lot-lease
api_prefix: /

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation       # utility apportionment: per-capita vs sub-meter; rent increase: cap vs CPI-floor
    - rate_threshold_triggers        # state-specific annual increase cap; arrears threshold for eviction
    - cascading_side_effects         # eviction cascade; conversion cascade
    - optimistic_concurrency         # OCC on Lot.version for lease-create supersede
  entity_topology: flat
  # Peer entities linked by foreign keys; Lot/Resident/Lease/Bill reference each
  # other without deep URL nesting. Community is a light scoping parent.
  state_machine_shape: branching
  # LotLease and EvictionCase fork/join (cure-or-evict); RentSchedule has a
  # branching accept/contest cycle; ConversionVote branches pass/fail.
  relationship_patterns:
    - one_to_many        # Community → Lot, Community → Resident
    - cross_aggregate    # LotLease ties a Lot to a Resident across aggregates
    - self_referential   # LotLease.supersedes_lease_id chains lease succession on home sale
  role_model: peer_roles
  # ParkManager owns community/lot/billing/eviction operations; Resident acts on
  # own lease/sale/vote; HousingAuthority is an opaque compliance auditor.
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity Relationship Table
# =============================================================================
entities:
  - name: Community
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Community name" }
      - { name: state_code, type: enum, source: input, description: "Two-letter state where the community sits: CA | OR | FL | TX. Selects the annual increase cap regime." }
      - { name: ownership_model, type: enum, source: system, description: "PARK_OWNED | RESIDENT_OWNED — governance model. Starts PARK_OWNED; flips to RESIDENT_OWNED only via a passed ConversionVote.", default: "PARK_OWNED" }
      - { name: utility_apportionment_method, type: enum, source: input, description: "PER_CAPITA | SUB_METER — how a UtilityBill master charge is split across lots. PER_CAPITA divides by occupied-lot count; SUB_METER divides by metered consumption.", default: "PER_CAPITA" }
      - { name: occupied_lot_count, type: integer, source: computed, description: "Count of Lots whose status is OCCUPIED. Drives PER_CAPITA apportionment denominator." }
      - { name: total_metered_units, type: number, source: computed, description: "Sum of metered_units across UtilityReading rows for the bill period being apportioned (recomputed per apportionment run)." }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: lot_number, type: string, source: input, description: "Human-readable lot label, unique within the community" }
      - { name: base_rent_cents, type: integer, source: input, description: "Monthly base lot rent in cents at lot creation; the anchor for the first RentSchedule" }
      - { name: status, type: enum, source: system, description: "VACANT | OCCUPIED | EVICTING | FROZEN — lifecycle. FROZEN blocks new leases during community conversion.", default: "VACANT" }
      - { name: current_lease_id, type: string, source: system, description: "FK -> LotLease.id; the ACTIVE lease occupying this lot, or null when VACANT", default: null }
      - { name: current_rent_cents, type: integer, source: computed, description: "Monthly rent in effect = the EFFECTIVE RentSchedule.new_rent_cents for this lot, else base_rent_cents when no schedule is effective" }

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: full_name, type: string, source: input, description: "Resident legal name" }
      - { name: household_size, type: integer, source: input, description: "Number of occupants in the household; feeds PER_CAPITA weighting", constraints: ">= 1" }
      - { name: standing, type: enum, source: system, description: "GOOD | DELINQUENT | EVICTED — payment/eviction standing", default: "GOOD" }
      - { name: arrears_cents, type: integer, source: computed, description: "Sum of unpaid LotLedgerEntry.amount_cents (charges minus payments) for this resident's active lease; non-negative" }

  - name: LotLease
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id" }
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id" }
      - { name: supersedes_lease_id, type: string, source: input, description: "FK -> LotLease.id; set when this lease is created by a home sale taking over the prior lease's lot. Null for first-occupancy leases.", default: null }
      - { name: start_date, type: string, source: input, description: "ISO date the lease term begins" }
      - { name: rent_cents_at_signing, type: integer, source: system, description: "Lot.current_rent_cents snapshotted onto the lease at activation" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | TERMINATED | TRANSFERRED — TRANSFERRED means superseded by a home-sale successor lease", default: "PENDING" }
      - { name: expected_lot_version, type: integer, source: input, description: "OCC token: the Lot.version the client observed before creating this lease (supersede path)", default: null }

  - name: RentSchedule
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id" }
      - { name: prior_rent_cents, type: integer, source: system, description: "The Lot.current_rent_cents at the moment this schedule was proposed (the cap baseline)" }
      - { name: proposed_rent_cents, type: integer, source: input, description: "Manager's proposed new monthly rent in cents" }
      - { name: new_rent_cents, type: integer, source: computed, description: "The capped, legally effective rent = min(proposed, cap-limited maximum) once ACCEPTED/EFFECTIVE" }
      - { name: effective_date, type: string, source: input, description: "ISO date the new rent takes effect; must be >= 12 months after the lot's last EFFECTIVE schedule effective_date" }
      - { name: cap_applied, type: boolean, source: computed, description: "True when proposed_rent_cents exceeded the state cap maximum and was reduced" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | CONTESTED | EFFECTIVE | WITHDRAWN — branching accept/contest cycle", default: "PROPOSED" }

  - name: UtilityBill
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: utility_type, type: enum, source: input, description: "WATER | ELECTRIC | SEWER" }
      - { name: period_start, type: string, source: input, description: "ISO date — inclusive start of the billing period" }
      - { name: period_end, type: string, source: input, description: "ISO date — exclusive end of the billing period" }
      - { name: master_charge_cents, type: integer, source: input, description: "Total master-meter charge the community must apportion across occupied lots" }
      - { name: apportioned_total_cents, type: integer, source: computed, description: "Sum of all generated UtilityCharge.amount_cents; MUST equal master_charge_cents (conservation invariant)" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPORTIONED — DRAFT until apportionment runs, then APPORTIONED", default: "DRAFT" }

  - name: UtilityReading
    parent: null
    common_fields: false  # id, created_at only — append-only reading record
    fields:
      - { name: utility_bill_id, type: string, source: input, description: "FK -> UtilityBill.id" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id" }
      - { name: metered_units, type: number, source: input, description: "Sub-meter consumption units for this lot in the bill period; used only under SUB_METER apportionment" }

  - name: UtilityCharge
    parent: null
    common_fields: false  # id, created_at only — immutable apportionment line item
    fields:
      - { name: utility_bill_id, type: string, source: system, description: "FK -> UtilityBill.id" }
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id" }
      - { name: resident_id, type: string, source: system, description: "FK -> Resident.id; the resident on the lot's ACTIVE lease at apportionment time" }
      - { name: amount_cents, type: integer, source: computed, description: "This lot's apportioned share of master_charge_cents" }

  - name: EvictionCase
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> LotLease.id" }
      - { name: reason, type: enum, source: input, description: "NONPAYMENT | LEASE_VIOLATION — NONPAYMENT requires arrears over the threshold; LEASE_VIOLATION is a documented rule breach" }
      - { name: cure_deadline, type: string, source: system, description: "ISO date by which the resident may cure; period length is state-specific" }
      - { name: status, type: enum, source: system, description: "NOTICE_SERVED | CURED | ADJUDICATED | DISMISSED — branching cure-or-evict", default: "NOTICE_SERVED" }

  - name: ConversionVote
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: quorum_threshold_pct, type: number, source: input, description: "Fraction (0..1) of occupied lots whose ballots must be YES for the conversion to pass", constraints: "0 < x <= 1" }
      - { name: yes_count, type: integer, source: computed, description: "Count of YES ConversionBallot rows for this vote", default: 0 }
      - { name: eligible_lot_count, type: integer, source: system, description: "occupied_lot_count snapshotted at vote OPEN; the fixed denominator for the quorum test" }
      - { name: status, type: enum, source: system, description: "OPEN | PASSED | FAILED — branching tally outcome", default: "OPEN" }

  - name: ConversionBallot
    parent: null
    common_fields: false  # id, created_at only — one ballot per occupied lot
    fields:
      - { name: conversion_vote_id, type: string, source: input, description: "FK -> ConversionVote.id" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id" }
      - { name: choice, type: enum, source: input, description: "YES | NO" }

  - name: LotLedgerEntry
    parent: null
    common_fields: false  # id, created_at only — append-only ledger
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> LotLease.id" }
      - { name: resident_id, type: string, source: system, description: "FK -> Resident.id" }
      - { name: entry_type, type: enum, source: system, description: "RENT_CHARGE | UTILITY_CHARGE | PAYMENT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: positive for charges, negative for payments" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Lot
    initial_state: VACANT
    terminal_states: []
    transitions:
      - from: VACANT
        to: OCCUPIED
        trigger: "POST /lot-leases/{id}/activate"
        actor: ParkManager
        preconditions:
          - "Lot.status == VACANT (ERR_LOT_NOT_VACANT)"
          - "Community.ownership_model permits new occupancy (Lot not FROZEN) (ERR_LOT_FROZEN)"
        side_effects:
          - "Lot.status -> OCCUPIED"
          - "Lot.current_lease_id = lease.id"
          - "lease.status PENDING -> ACTIVE; lease.rent_cents_at_signing = Lot.current_rent_cents"
          - "Community.occupied_lot_count increases by 1"
          - "increments Lot.version by 1"

      - from: OCCUPIED
        to: OCCUPIED
        trigger: "POST /lot-leases/{id}/activate (home-sale supersede; supersedes_lease_id set)"
        actor: ParkManager
        preconditions:
          - "Lot.status == OCCUPIED and supersedes_lease_id == Lot.current_lease_id (ERR_INVALID_STATE)"
          - "supersede lease's expected_lot_version == Lot.version (ERR_STALE_LOT_VERSION)"
          - "no open EvictionCase on the prior lease (ERR_EVICTION_IN_PROGRESS)"
        side_effects:
          - "prior lease.status ACTIVE -> TRANSFERRED"
          - "new lease.status PENDING -> ACTIVE; rent_cents_at_signing = Lot.current_rent_cents (rent rides with the lot, not the home)"
          - "Lot.current_lease_id = new lease.id"
          - "increments Lot.version by 1"

      - from: OCCUPIED
        to: EVICTING
        trigger: "POST /eviction-cases (NOTICE_SERVED on the lot's active lease)"
        actor: ParkManager
        preconditions:
          - "Lot.status == OCCUPIED (ERR_INVALID_STATE)"
        side_effects:
          - "Lot.status -> EVICTING"
          - "increments Lot.version by 1"

      - from: EVICTING
        to: VACANT
        trigger: "POST /eviction-cases/{id}/adjudicate (uphold)"
        actor: ParkManager
        preconditions:
          - "EvictionCase.status == NOTICE_SERVED and cure_deadline has passed (ERR_CURE_PERIOD_ACTIVE)"
        side_effects:
          - "lease.status ACTIVE -> TERMINATED"
          - "Lot.status -> VACANT; Lot.current_lease_id = null"
          - "Resident.standing -> EVICTED"
          - "Community.occupied_lot_count decreases by 1"
          - "increments Lot.version by 1"

      - from: EVICTING
        to: OCCUPIED
        trigger: "POST /eviction-cases/{id}/cure"
        actor: Resident
        preconditions:
          - "EvictionCase.status == NOTICE_SERVED and now <= cure_deadline (ERR_CURE_PERIOD_EXPIRED)"
          - "for NONPAYMENT: a PAYMENT clearing arrears below threshold has posted (ERR_ARREARS_NOT_CLEARED)"
        side_effects:
          - "EvictionCase.status -> CURED"
          - "Lot.status -> OCCUPIED"
          - "Resident.standing DELINQUENT -> GOOD"
          - "increments Lot.version by 1"

      - from: OCCUPIED
        to: FROZEN
        trigger: "POST /conversion-votes/{id}/open (system cascade across community lots)"
        actor: system
        preconditions:
          - "Lot.status == OCCUPIED"
        side_effects:
          - "Lot.status -> FROZEN (new leases blocked while a vote is OPEN)"
          - "increments Lot.version by 1"

      - from: FROZEN
        to: OCCUPIED
        trigger: "POST /conversion-votes/{id}/tally (system cascade after vote resolves)"
        actor: system
        preconditions: []
        side_effects:
          - "Lot.status -> OCCUPIED"
          - "increments Lot.version by 1"

  - entity: LotLease
    initial_state: PENDING
    terminal_states: [TERMINATED, TRANSFERRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /lot-leases/{id}/activate"
        actor: ParkManager
        preconditions:
          - "lease.status == PENDING (ERR_INVALID_STATE)"
          - "target Lot is VACANT, or OCCUPIED with matching supersedes_lease_id (ERR_LOT_NOT_VACANT)"
        side_effects:
          - "Lot transitions per Lot state machine"
          - "first RENT_CHARGE LotLedgerEntry posted = rent_cents_at_signing"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /eviction-cases/{id}/adjudicate (uphold)"
        actor: ParkManager
        preconditions:
          - "lease.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Lot vacated; Resident.standing -> EVICTED (see Lot EVICTING->VACANT)"

      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /lot-leases/{id}/activate (successor lease activated on home sale)"
        actor: ParkManager
        preconditions:
          - "lease.status == ACTIVE and lease.id == Lot.current_lease_id (ERR_INVALID_STATE)"
        side_effects:
          - "successor lease becomes ACTIVE and current; this lease frozen as TRANSFERRED"

  - entity: RentSchedule
    initial_state: PROPOSED
    terminal_states: [EFFECTIVE, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /rent-schedules/{id}/accept"
        actor: Resident
        preconditions:
          - "RentSchedule.status == PROPOSED (ERR_INVALID_STATE)"
        side_effects:
          - "RentSchedule.status -> ACCEPTED"

      - from: PROPOSED
        to: CONTESTED
        trigger: "POST /rent-schedules/{id}/contest"
        actor: Resident
        preconditions:
          - "RentSchedule.status == PROPOSED (ERR_INVALID_STATE)"
        side_effects:
          - "RentSchedule.status -> CONTESTED"

      - from: CONTESTED
        to: PROPOSED
        trigger: "POST /rent-schedules/{id}/revise"
        actor: ParkManager
        preconditions:
          - "RentSchedule.status == CONTESTED (ERR_INVALID_STATE)"
        side_effects:
          - "proposed_rent_cents updated; new_rent_cents and cap_applied recomputed against the SAME prior_rent_cents and effective_date baseline (branching revision loop)"
          - "RentSchedule.status -> PROPOSED"

      - from: ACCEPTED
        to: EFFECTIVE
        trigger: "POST /rent-schedules/{id}/apply"
        actor: ParkManager
        preconditions:
          - "RentSchedule.status == ACCEPTED (ERR_INVALID_STATE)"
          - "effective_date >= 12 months after the lot's last EFFECTIVE schedule's effective_date (ERR_INCREASE_TOO_SOON)"
        side_effects:
          - "RentSchedule.status -> EFFECTIVE"
          - "Lot.current_rent_cents recomputes to new_rent_cents"
          - "increments Lot.version by 1"

      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /rent-schedules/{id}/withdraw"
        actor: ParkManager
        preconditions:
          - "RentSchedule.status == PROPOSED (ERR_INVALID_STATE)"
        side_effects:
          - "RentSchedule.status -> WITHDRAWN"

  - entity: EvictionCase
    initial_state: NOTICE_SERVED
    terminal_states: [CURED, ADJUDICATED, DISMISSED]
    transitions:
      - from: NOTICE_SERVED
        to: ADJUDICATED
        trigger: "POST /eviction-cases/{id}/adjudicate"
        actor: ParkManager
        preconditions:
          - "EvictionCase.status == NOTICE_SERVED (ERR_INVALID_STATE)"
          - "now > cure_deadline (ERR_CURE_PERIOD_ACTIVE)"
        side_effects:
          - "EvictionCase.status -> ADJUDICATED"
          - "lease TERMINATED, Lot VACANT, Resident EVICTED (Lot EVICTING->VACANT cascade)"

      - from: NOTICE_SERVED
        to: CURED
        trigger: "POST /eviction-cases/{id}/cure"
        actor: Resident
        preconditions:
          - "EvictionCase.status == NOTICE_SERVED (ERR_INVALID_STATE)"
          - "now <= cure_deadline (ERR_CURE_PERIOD_EXPIRED)"
          - "for NONPAYMENT: arrears cleared below threshold (ERR_ARREARS_NOT_CLEARED)"
        side_effects:
          - "EvictionCase.status -> CURED; Lot EVICTING->OCCUPIED; Resident standing restored"

      - from: NOTICE_SERVED
        to: DISMISSED
        trigger: "POST /eviction-cases/{id}/dismiss"
        actor: ParkManager
        preconditions:
          - "EvictionCase.status == NOTICE_SERVED (ERR_INVALID_STATE)"
        side_effects:
          - "EvictionCase.status -> DISMISSED; Lot EVICTING->OCCUPIED"

  - entity: ConversionVote
    initial_state: OPEN
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: OPEN
        to: PASSED
        trigger: "POST /conversion-votes/{id}/tally"
        actor: ParkManager
        preconditions:
          - "ConversionVote.status == OPEN (ERR_INVALID_STATE)"
          - "yes_count / eligible_lot_count >= quorum_threshold_pct (ERR_QUORUM_NOT_MET routes to FAILED, not error)"
        side_effects:
          - "ConversionVote.status -> PASSED"
          - "Community.ownership_model PARK_OWNED -> RESIDENT_OWNED"
          - "all community Lots FROZEN -> OCCUPIED (unfreeze cascade)"

      - from: OPEN
        to: FAILED
        trigger: "POST /conversion-votes/{id}/tally"
        actor: ParkManager
        preconditions:
          - "ConversionVote.status == OPEN (ERR_INVALID_STATE)"
          - "yes_count / eligible_lot_count < quorum_threshold_pct"
        side_effects:
          - "ConversionVote.status -> FAILED"
          - "Community.ownership_model unchanged"
          - "all community Lots FROZEN -> OCCUPIED (unfreeze cascade)"

  - entity: UtilityBill
    initial_state: DRAFT
    terminal_states: [APPORTIONED]
    transitions:
      - from: DRAFT
        to: APPORTIONED
        trigger: "POST /utility-bills/{id}/apportion"
        actor: ParkManager
        preconditions:
          - "UtilityBill.status == DRAFT (ERR_INVALID_STATE)"
          - "Community.occupied_lot_count >= 1 (ERR_NO_OCCUPIED_LOTS)"
          - "if method SUB_METER: total_metered_units > 0 (ERR_NO_METER_READINGS)"
        side_effects:
          - "one immutable UtilityCharge created per OCCUPIED lot"
          - "UTILITY_CHARGE LotLedgerEntry posted per charge against the lot's active resident"
          - "apportioned_total_cents set; conservation: sum == master_charge_cents"
          - "UtilityBill.status -> APPORTIONED"

# -----------------------------------------------------------------------------
# Concurrency Rules (§1.2.1)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: lease-activate-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /lot-leases/{id}/activate"
    occ_field: "expected_lot_version"
    description: |
      Activating a home-sale successor lease (supersedes_lease_id set) against a
      Lot whose version has advanced since the client last observed it is
      rejected. This captures the case where the lot's occupancy already changed
      (a prior successor lease activated, or a rent schedule went EFFECTIVE bumping
      the lot version) so the current writer's view of the lot is stale.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: utility_apportionment
    trigger: "POST /utility-bills/{id}/apportion (UtilityBill DRAFT -> APPORTIONED)"
    algorithm: waterfall_allocation
    formula: |
      Apportion master_charge_cents across the set OCC = { Lots with status OCCUPIED }
      ordered by Lot.created_at ASC (then lot_number ASC as a stable common-field
      tie-break) using the community's utility_apportionment_method:

      Variant PER_CAPITA (default):
        weight(lot) = household_size of the resident on the lot's ACTIVE lease.
        total_weight = sum(weight(lot) for lot in OCC)
        raw(lot) = master_charge_cents * weight(lot) / total_weight

      Variant SUB_METER:
        weight(lot) = sum(UtilityReading.metered_units for lot in this bill)
        total_weight = total_metered_units = sum over OCC
        raw(lot) = master_charge_cents * weight(lot) / total_weight

      Rounding (LARGEST-REMAINDER, order pinned): floor each raw(lot) to whole
      cents; the leftover remainder = master_charge_cents - sum(floors) is
      distributed one cent at a time to lots in DESCENDING fractional-remainder
      order, ties broken by Lot.created_at ASC. This guarantees
      sum(amount_cents) == master_charge_cents exactly (conservation invariant).
    input_set: "Lots with status == OCCUPIED in the bill's community at apportion time; each must have an ACTIVE lease."
    constants: {}
    precision: "integer cents; largest-remainder distribution, no fractional cents survive"
    variants:
      - name: per_capita
        when: "Community.utility_apportionment_method == PER_CAPITA"
        difference: "weight = household_size; ignores meter readings entirely"
      - name: sub_meter
        when: "Community.utility_apportionment_method == SUB_METER"
        difference: "weight = summed metered_units; ignores household_size"

  - name: capped_rent_increase
    trigger: "POST /rent-schedules (proposal) and POST /rent-schedules/{id}/revise"
    algorithm: threshold
    formula: |
      Compute the legally effective new_rent_cents for a RentSchedule against
      prior_rent_cents using the community's state_code cap regime:

        cap_pct(state):
          CA -> 0.05    # 5% hard annual cap
          OR -> 0.07    # 7% hard annual cap
          FL -> 0.10    # 10% (no statutory cap modeled as generous ceiling)
          TX -> null    # no cap

        if cap_pct is null:
          max_allowed = proposed_rent_cents          # uncapped state
        else:
          max_allowed = floor(prior_rent_cents * (1 + cap_pct))

        new_rent_cents = min(proposed_rent_cents, max_allowed)
        cap_applied    = proposed_rent_cents > max_allowed   # boundary: strictly greater
    input_set: "Single lot; prior_rent_cents is the snapshotted Lot.current_rent_cents baseline at proposal."
    constants:
      CAP_PCT_CA: 0.05
      CAP_PCT_OR: 0.07
      CAP_PCT_FL: 0.10
      CAP_PCT_TX: null
    precision: "integer cents; floor on the cap ceiling; cap_applied uses strict > comparison"
    variants:
      - name: capped_state
        when: "state_code in {CA, OR, FL}"
        difference: "max_allowed = floor(prior * (1+cap_pct)); proposals above are reduced and cap_applied=true"
      - name: uncapped_state
        when: "state_code == TX"
        difference: "max_allowed = proposed; cap never applies, cap_applied always false"

  - name: resident_arrears
    trigger: "any LotLedgerEntry post (RENT_CHARGE, UTILITY_CHARGE, PAYMENT) on the resident's active lease"
    algorithm: aggregation
    formula: |
      arrears_cents = max(0, sum(LotLedgerEntry.amount_cents
                                  for entries on the resident's ACTIVE lease))
      Charges are positive, payments negative. Recomputed on every ledger post.
      Eviction NONPAYMENT eligibility: arrears_cents >= ARREARS_THRESHOLD_CENTS.
    input_set: "All LotLedgerEntry rows for the resident's current ACTIVE lease (excludes TRANSFERRED/TERMINATED prior leases)."
    constants:
      ARREARS_THRESHOLD_CENTS: 50000   # $500.00 — NONPAYMENT eviction threshold
    precision: "integer cents; floored at 0"

  - name: cure_deadline_derivation
    trigger: "POST /eviction-cases (NOTICE_SERVED)"
    algorithm: threshold
    formula: |
      cure_deadline = period_end_of(notice_date + CURE_DAYS[state_code]) where
      notice_date = EvictionCase.created_at (date portion):
        CA -> 60 days
        OR -> 30 days
        FL -> 30 days
        TX -> 14 days
      A cure posted strictly after cure_deadline is rejected; an adjudication on
      or before cure_deadline is rejected (boundary: cure allowed while now <=
      cure_deadline; adjudication allowed only while now > cure_deadline).
    input_set: "Single eviction case; state_code from the lease's lot's community."
    constants:
      CURE_DAYS_CA: 60
      CURE_DAYS_OR: 30
      CURE_DAYS_FL: 30
      CURE_DAYS_TX: 14
    precision: "whole days added to the notice date"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path/body resource IDs exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enums in allowed set"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH"

  - priority: 5
    category: business_referential
    check: "FK targets belong to the same Community (Lot, Resident, lease must share community_id)"
    error_id: ERR_CROSS_COMMUNITY_REFERENCE
    http_status: 409
    applies_to: "POST /lot-leases, POST /utility-bills, POST /conversion-votes/{id}/ballots"

  - priority: 6
    category: business_constraint
    check: "lot_number unique within its community"
    error_id: ERR_DUPLICATE_LOT_NUMBER
    http_status: 409
    applies_to: "POST /lots"

  - priority: 7
    category: state
    check: "Target resource in correct state for the transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "Lot must be VACANT for a first-occupancy lease activation"
    error_id: ERR_LOT_NOT_VACANT
    http_status: 409
    applies_to: "POST /lot-leases/{id}/activate"

  - priority: 9
    category: state
    check: "Lot must not be FROZEN by an open conversion vote when activating a new lease"
    error_id: ERR_LOT_FROZEN
    http_status: 409
    applies_to: "POST /lot-leases/{id}/activate"

  - priority: 10
    category: business_constraint
    check: "Home-sale supersede activation: a Lot under an open EvictionCase cannot be transferred"
    error_id: ERR_EVICTION_IN_PROGRESS
    http_status: 409
    applies_to: "POST /lot-leases/{id}/activate (supersede)"

  - priority: 11
    category: business_temporal
    check: "An EFFECTIVE rent schedule's effective_date must be >= 12 months after the lot's last EFFECTIVE schedule"
    error_id: ERR_INCREASE_TOO_SOON
    http_status: 409
    applies_to: "POST /rent-schedules/{id}/apply"

  - priority: 12
    category: business_temporal
    check: "Eviction cure permitted only while now <= cure_deadline"
    error_id: ERR_CURE_PERIOD_EXPIRED
    http_status: 409
    applies_to: "POST /eviction-cases/{id}/cure"

  - priority: 13
    category: business_temporal
    check: "Eviction adjudication permitted only while now > cure_deadline"
    error_id: ERR_CURE_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /eviction-cases/{id}/adjudicate"

  - priority: 14
    category: business_safety
    check: "NONPAYMENT eviction requires arrears_cents >= ARREARS_THRESHOLD_CENTS at notice time"
    error_id: ERR_ARREARS_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /eviction-cases"

  - priority: 15
    category: business_safety
    check: "NONPAYMENT cure requires arrears cleared below the threshold by a posted PAYMENT"
    error_id: ERR_ARREARS_NOT_CLEARED
    http_status: 409
    applies_to: "POST /eviction-cases/{id}/cure"

  - priority: 16
    category: business_constraint
    check: "Apportionment requires >= 1 OCCUPIED lot; SUB_METER additionally requires total_metered_units > 0"
    error_id: ERR_NO_OCCUPIED_LOTS
    http_status: 409
    applies_to: "POST /utility-bills/{id}/apportion"

  - priority: 17
    category: business_constraint
    check: "One ballot per lot per conversion vote; lot must be OCCUPIED (eligible)"
    error_id: ERR_DUPLICATE_BALLOT
    http_status: 409
    applies_to: "POST /conversion-votes/{id}/ballots"

  - priority: 18
    category: state
    check: "OCC stale-version on home-sale supersede activation"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /lot-leases/{id}/activate (supersede)"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Community ---
  - method: POST
    path: "/communities"
    description: "Create a community"
    roles: [ParkManager]
    code: 201
    input: [name, state_code, "utility_apportionment_method?"]
    output: Community
    side_effects: ["ownership_model=PARK_OWNED, occupied_lot_count=0"]

  - method: GET
    path: "/communities/{id}"
    description: "Get a community (includes computed occupied_lot_count, ownership_model)"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: []
    output: Community
    side_effects: []

  # --- Lot ---
  - method: POST
    path: "/lots"
    description: "Create a lot in a community"
    roles: [ParkManager]
    code: 201
    input: [community_id, lot_number, base_rent_cents]
    output: Lot
    side_effects: ["status=VACANT, current_rent_cents=base_rent_cents"]

  - method: GET
    path: "/lots/{id}"
    description: "Get a lot (includes computed current_rent_cents, version)"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/lots"
    description: "List lots, filterable by community or current lease"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: ["community_id?", "current_lease_id?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  # --- Resident ---
  - method: POST
    path: "/residents"
    description: "Register a resident in a community"
    roles: [ParkManager]
    code: 201
    input: [community_id, full_name, household_size]
    output: Resident
    side_effects: ["standing=GOOD, arrears_cents=0"]

  - method: GET
    path: "/residents/{id}"
    description: "Get a resident (includes computed arrears_cents, standing)"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: []
    output: Resident
    side_effects: []

  - method: GET
    path: "/residents"
    description: "List residents, filterable by community"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: ["community_id?", "limit?", "offset?"]
    output: Resident[]
    side_effects: []

  # --- LotLease ---
  - method: POST
    path: "/lot-leases"
    description: "Create a PENDING lease binding a resident to a lot (optionally a home-sale supersede)"
    roles: [ParkManager]
    code: 201
    input: [lot_id, resident_id, start_date, "supersedes_lease_id?", "expected_lot_version?"]
    output: LotLease
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/lot-leases/{id}"
    description: "Get a lease"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: []
    output: LotLease
    side_effects: []

  - method: GET
    path: "/lot-leases"
    description: "List leases, filterable by lot or resident"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: ["lot_id?", "resident_id?", "supersedes_lease_id?", "limit?", "offset?"]
    output: LotLease[]
    side_effects: []

  - method: POST
    path: "/lot-leases/{id}/activate"
    description: "Activate a PENDING lease, occupying the lot (or superseding the prior lease on a home sale)"
    roles: [ParkManager]
    code: 200
    input: ["expected_lot_version?"]
    output: LotLease
    side_effects:
      - "lease PENDING -> ACTIVE"
      - "Lot VACANT->OCCUPIED, or OCCUPIED supersede (prior lease -> TRANSFERRED)"
      - "rent_cents_at_signing = Lot.current_rent_cents; first RENT_CHARGE ledger entry posted"
      - "Community.occupied_lot_count adjusts"
      - "increments Lot.version by 1"

  # --- RentSchedule ---
  - method: POST
    path: "/rent-schedules"
    description: "Propose a rent increase for a lot (cap computed at proposal)"
    roles: [ParkManager]
    code: 201
    input: [lot_id, proposed_rent_cents, effective_date]
    output: RentSchedule
    side_effects: ["status=PROPOSED; prior_rent_cents snapshotted; new_rent_cents & cap_applied computed"]

  - method: GET
    path: "/rent-schedules/{id}"
    description: "Get a rent schedule (includes computed new_rent_cents, cap_applied)"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: []
    output: RentSchedule
    side_effects: []

  - method: GET
    path: "/rent-schedules"
    description: "List rent schedules, filterable by lot"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: ["lot_id?", "limit?", "offset?"]
    output: RentSchedule[]
    side_effects: []

  - method: POST
    path: "/rent-schedules/{id}/accept"
    description: "Resident accepts the proposed increase"
    roles: [Resident]
    code: 200
    input: []
    output: RentSchedule
    side_effects: ["status PROPOSED -> ACCEPTED"]

  - method: POST
    path: "/rent-schedules/{id}/contest"
    description: "Resident contests the proposed increase"
    roles: [Resident]
    code: 200
    input: []
    output: RentSchedule
    side_effects: ["status PROPOSED -> CONTESTED"]

  - method: POST
    path: "/rent-schedules/{id}/revise"
    description: "Manager revises a contested proposal (recomputes cap, returns to PROPOSED)"
    roles: [ParkManager]
    code: 200
    input: [proposed_rent_cents]
    output: RentSchedule
    side_effects: ["status CONTESTED -> PROPOSED; new_rent_cents & cap_applied recomputed"]

  - method: POST
    path: "/rent-schedules/{id}/apply"
    description: "Apply an ACCEPTED schedule, making it EFFECTIVE and updating lot rent"
    roles: [ParkManager]
    code: 200
    input: []
    output: RentSchedule
    side_effects:
      - "status ACCEPTED -> EFFECTIVE"
      - "Lot.current_rent_cents = new_rent_cents"
      - "increments Lot.version by 1"

  - method: POST
    path: "/rent-schedules/{id}/withdraw"
    description: "Manager withdraws a proposed schedule"
    roles: [ParkManager]
    code: 200
    input: []
    output: RentSchedule
    side_effects: ["status PROPOSED -> WITHDRAWN"]

  # --- UtilityBill / readings / charges ---
  - method: POST
    path: "/utility-bills"
    description: "Create a DRAFT utility master bill for a community"
    roles: [ParkManager]
    code: 201
    input: [community_id, utility_type, period_start, period_end, master_charge_cents]
    output: UtilityBill
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/utility-bills/{id}"
    description: "Get a utility bill (includes computed apportioned_total_cents)"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: []
    output: UtilityBill
    side_effects: []

  - method: GET
    path: "/utility-bills"
    description: "List utility bills, filterable by community"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: ["community_id?", "limit?", "offset?"]
    output: UtilityBill[]
    side_effects: []

  - method: POST
    path: "/utility-bills/{id}/readings"
    description: "Attach a sub-meter reading for a lot to a DRAFT bill"
    roles: [ParkManager]
    code: 201
    input: [lot_id, metered_units]
    output: UtilityReading
    side_effects: ["appended to bill's reading set"]

  - method: GET
    path: "/utility-readings/{id}"
    description: "Get a single sub-meter reading"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: []
    output: UtilityReading
    side_effects: []

  - method: GET
    path: "/utility-readings"
    description: "List sub-meter readings, filterable by bill or lot"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: ["utility_bill_id?", "lot_id?", "limit?", "offset?"]
    output: UtilityReading[]
    side_effects: []

  - method: POST
    path: "/utility-bills/{id}/apportion"
    description: "Run apportionment: split master charge across occupied lots, emit charges"
    roles: [ParkManager]
    code: 200
    input: []
    output: UtilityBill
    side_effects:
      - "status DRAFT -> APPORTIONED"
      - "one UtilityCharge per OCCUPIED lot; UTILITY_CHARGE ledger entries posted"
      - "apportioned_total_cents set; conservation sum == master_charge_cents"

  - method: GET
    path: "/utility-charges/{id}"
    description: "Get a single apportioned charge"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: []
    output: UtilityCharge
    side_effects: []

  - method: GET
    path: "/utility-charges"
    description: "List apportioned charges, filterable by bill, lot, or resident"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: ["utility_bill_id?", "lot_id?", "resident_id?", "limit?", "offset?"]
    output: UtilityCharge[]
    side_effects: []

  # --- Ledger / payments ---
  - method: POST
    path: "/lot-leases/{id}/payments"
    description: "Post a resident PAYMENT against a lease ledger (reduces arrears)"
    roles: [ParkManager, Resident]
    code: 201
    input: [amount_cents]
    output: LotLedgerEntry
    side_effects: ["PAYMENT ledger entry (negative); resident arrears_cents recomputed; standing may revert to GOOD"]

  - method: GET
    path: "/lot-ledger-entries/{id}"
    description: "Get a single ledger entry"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: []
    output: LotLedgerEntry
    side_effects: []

  - method: GET
    path: "/lot-ledger-entries"
    description: "List ledger entries, filterable by lease or resident"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: ["lease_id?", "resident_id?", "limit?", "offset?"]
    output: LotLedgerEntry[]
    side_effects: []

  # --- EvictionCase ---
  - method: POST
    path: "/eviction-cases"
    description: "Serve an eviction notice on a lease's active resident"
    roles: [ParkManager]
    code: 201
    input: [lease_id, reason]
    output: EvictionCase
    side_effects:
      - "status=NOTICE_SERVED; cure_deadline derived by state"
      - "Lot OCCUPIED -> EVICTING; Resident standing -> DELINQUENT (NONPAYMENT)"
      - "increments Lot.version by 1"

  - method: GET
    path: "/eviction-cases/{id}"
    description: "Get an eviction case (includes cure_deadline, status)"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: []
    output: EvictionCase
    side_effects: []

  - method: GET
    path: "/eviction-cases"
    description: "List eviction cases, filterable by lease"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: ["lease_id?", "limit?", "offset?"]
    output: EvictionCase[]
    side_effects: []

  - method: POST
    path: "/eviction-cases/{id}/cure"
    description: "Resident cures within the cure period"
    roles: [Resident]
    code: 200
    input: []
    output: EvictionCase
    side_effects:
      - "status -> CURED; Lot EVICTING -> OCCUPIED; Resident standing restored"
      - "increments Lot.version by 1"

  - method: POST
    path: "/eviction-cases/{id}/adjudicate"
    description: "Uphold eviction after the cure period lapses"
    roles: [ParkManager]
    code: 200
    input: []
    output: EvictionCase
    side_effects:
      - "status -> ADJUDICATED; lease TERMINATED; Lot VACANT; Resident EVICTED; occupied_lot_count decreases"
      - "increments Lot.version by 1"

  - method: POST
    path: "/eviction-cases/{id}/dismiss"
    description: "Manager dismisses the eviction"
    roles: [ParkManager]
    code: 200
    input: []
    output: EvictionCase
    side_effects:
      - "status -> DISMISSED; Lot EVICTING -> OCCUPIED"
      - "increments Lot.version by 1"

  # --- ConversionVote ---
  - method: POST
    path: "/conversion-votes"
    description: "Create a Park-owned -> Resident-owned conversion vote (OPEN)"
    roles: [ParkManager]
    code: 201
    input: [community_id, quorum_threshold_pct]
    output: ConversionVote
    side_effects: ["status=OPEN(prep); eligible_lot_count snapshotted on open"]

  - method: GET
    path: "/conversion-votes/{id}"
    description: "Get a conversion vote (includes yes_count, eligible_lot_count)"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: []
    output: ConversionVote
    side_effects: []

  - method: GET
    path: "/conversion-votes"
    description: "List conversion votes, filterable by community"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: ["community_id?", "limit?", "offset?"]
    output: ConversionVote[]
    side_effects: []

  - method: POST
    path: "/conversion-votes/{id}/open"
    description: "Open balloting: snapshot eligible_lot_count, FREEZE all occupied community lots"
    roles: [ParkManager]
    code: 200
    input: []
    output: ConversionVote
    side_effects:
      - "eligible_lot_count = community.occupied_lot_count"
      - "all OCCUPIED community lots -> FROZEN (cascade); each Lot.version increments"

  - method: POST
    path: "/conversion-votes/{id}/ballots"
    description: "Cast one ballot for an occupied lot"
    roles: [ParkManager, Resident]
    code: 201
    input: [lot_id, choice]
    output: ConversionBallot
    side_effects: ["yes_count recomputed on the vote"]

  - method: GET
    path: "/conversion-votes/{id}/ballots"
    description: "List ballots for a vote (FK reverse-reachability for ConversionBallot.conversion_vote_id)"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: ["limit?", "offset?"]
    output: ConversionBallot[]
    side_effects: []

  - method: GET
    path: "/conversion-ballots/{id}"
    description: "Get a single ballot"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: []
    output: ConversionBallot
    side_effects: []

  - method: GET
    path: "/conversion-ballots"
    description: "List ballots, filterable by vote or lot (FK reverse-reachability for ConversionBallot.lot_id)"
    roles: [ParkManager, Resident, HousingAuthority]
    code: 200
    input: ["conversion_vote_id?", "lot_id?", "limit?", "offset?"]
    output: ConversionBallot[]
    side_effects: []

  - method: POST
    path: "/conversion-votes/{id}/tally"
    description: "Tally ballots; pass/fail by quorum; unfreeze lots; flip ownership on pass"
    roles: [ParkManager]
    code: 200
    input: []
    output: ConversionVote
    side_effects:
      - "status OPEN -> PASSED or FAILED by quorum"
      - "on PASSED: Community.ownership_model -> RESIDENT_OWNED"
      - "all FROZEN community lots -> OCCUPIED (unfreeze cascade); each Lot.version increments"

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC instant (test-driving; gates cure/adjudicate deadlines)"
    roles: [ParkManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock advanced for deadline evaluation"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/ill-typed required field or invalid enum value" }
  - { id: ERR_CROSS_COMMUNITY_REFERENCE, http: 409, condition: "FK targets do not share the same community_id" }
  - { id: ERR_DUPLICATE_LOT_NUMBER, http: 409, condition: "lot_number already used within the community" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_LOT_NOT_VACANT, http: 409, condition: "First-occupancy activation requires a VACANT lot" }
  - { id: ERR_LOT_FROZEN, http: 409, condition: "Lot is FROZEN by an open conversion vote; cannot activate a new lease" }
  - { id: ERR_EVICTION_IN_PROGRESS, http: 409, condition: "Home-sale supersede blocked by an open EvictionCase on the lot" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_lot_version does not match current Lot.version (supersede OCC)" }
  - { id: ERR_INCREASE_TOO_SOON, http: 409, condition: "Rent increase effective_date is less than 12 months after the last EFFECTIVE schedule" }
  - { id: ERR_CURE_PERIOD_EXPIRED, http: 409, condition: "Cure attempted after cure_deadline" }
  - { id: ERR_CURE_PERIOD_ACTIVE, http: 409, condition: "Adjudication attempted on or before cure_deadline" }
  - { id: ERR_ARREARS_BELOW_THRESHOLD, http: 409, condition: "NONPAYMENT eviction served while arrears below ARREARS_THRESHOLD_CENTS" }
  - { id: ERR_ARREARS_NOT_CLEARED, http: 409, condition: "NONPAYMENT cure attempted while arrears still at/above threshold" }
  - { id: ERR_NO_OCCUPIED_LOTS, http: 409, condition: "Apportionment with zero occupied lots" }
  - { id: ERR_NO_METER_READINGS, http: 409, condition: "SUB_METER apportionment with total_metered_units == 0" }
  - { id: ERR_DUPLICATE_BALLOT, http: 409, condition: "A ballot already exists for this lot in this vote, or the lot is not OCCUPIED/eligible" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: ParkManager
    description: "Community operator: manages lots, residents, leases, rent schedules, utility billing, evictions, and conversion votes"
    identity: "opaque"
    exclusive_operations:
      - "POST /communities — create community"
      - "POST /lots — create lot"
      - "POST /residents — register resident"
      - "POST /lot-leases — create lease"
      - "POST /lot-leases/{id}/activate — activate/supersede lease"
      - "POST /rent-schedules — propose increase"
      - "POST /rent-schedules/{id}/revise — revise contested proposal"
      - "POST /rent-schedules/{id}/apply — make schedule effective"
      - "POST /rent-schedules/{id}/withdraw — withdraw proposal"
      - "POST /utility-bills — create master bill"
