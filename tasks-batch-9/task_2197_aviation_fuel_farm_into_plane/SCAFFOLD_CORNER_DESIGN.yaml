scaffold_corner_design:
  entities:
    - target: FuelFarm
      cases:
        - name: farm_iata_code_uniqueness_is_global
          corner: "a second farm is created with iata_code SFO while an SFO farm already exists"
          expected_behavior: "409 ERR_DUPLICATE_KEY; the existing farm is untouched and no second row is created"
          notes: "iata_code uniqueness is global, unlike tank_code and asset_code which are unique only per fuel_farm_id"
        - name: posture_recomputed_by_clock_advance_alone
          corner: "the logical clock is advanced past the only permit's valid_until_utc without any other mutation"
          expected_behavior: "EnvironmentalPermit becomes EXPIRED, FuelFarm.posture becomes FROZEN and in_service_asset_count is unchanged; the farm freezes with no child write at all"
          notes: "exercises the clock-driven recompute listed on POST /_clock/set_current_utc"
    - target: EnvironmentalPermit
      cases:
        - name: latest_valid_from_permit_governs_with_created_at_tiebreak
          corner: "two permits exist for the same farm, one with valid_from_utc 2026-01-01 and one with 2026-06-01, and a third is created with the same valid_from_utc 2026-06-01 as the second"
          expected_behavior: "the permit with the latest valid_from_utc governs posture and throughput; on the tie the earliest created_at wins, so the second permit (not the third) supplies max_daily_throughput_liters"
        - name: reinstate_after_validity_window_closed
          corner: "a SUSPENDED permit is reinstated after the clock has passed valid_until_utc"
          expected_behavior: "409 ERR_INVALID_PERMIT_STATE is not used; the transition guard clock_now < valid_until_utc fails, so the request is refused and the farm stays FROZEN"
          expected_error: ERR_PERMIT_NOT_ACTIVE
    - target: StorageTank
      cases:
        - name: gauge_with_water_bottom_at_25mm_quarantines_the_tank
          corner: "POST /storage-tanks/{id}/gauge-measurements posts water_bottom_mm exactly 25.0 on a RELEASED tank"
          expected_behavior: "the >= comparison fires: quality_status moves RELEASED -> QUARANTINED with the full depth-2/3 cascade, and FuelFarm.posture becomes RESTRICTED; 24.99 leaves the tank RELEASED"
        - name: safe_fill_reached_exactly_is_allowed
          corner: "a receipt release brings book_volume_liters to exactly safe_fill_liters"
          expected_behavior: "the release succeeds because the guard is <=; one hundredth of a liter more returns 409 ERR_SAFE_FILL_EXCEEDED"
        - name: isolation_slot_capacity_one_per_farm
          corner: "a second tank at the same farm requests an isolation window overlapping the first isolated tank's window"
          expected_behavior: "409 ERR_TANK_ISOLATION_CONFLICT; a non-overlapping window is accepted, so the constraint is on window intersection and not on the count of isolated tanks alone"
    - target: FuelReceipt
      cases:
        - name: closing_gauge_not_greater_than_opening_gauge
          corner: "tank_closing_gauge_liters equals tank_opening_gauge_liters"
          expected_behavior: "422 ERR_FIELD_OUT_OF_RANGE before any volume maths runs"
        - name: duplicate_meter_ticket_number
          corner: "a second receipt reuses meter_ticket_number MT-8001"
          expected_behavior: "409 ERR_DUPLICATE_KEY; uniqueness is global across FuelReceipt, not per tank"
        - name: water_deduction_cap_when_water_is_zero
          corner: "measured_water_liters is omitted entirely"
          expected_behavior: "it defaults to 0.0, deducted water is 0.00 and net_volume_liters equals the corrected gross exactly"
    - target: QualitySample
      cases:
        - name: all_metrics_null_is_rejected
          corner: "POST /quality-samples/{id}/test-results with every metric omitted"
          expected_behavior: "422 ERR_EMPTY_TEST_RESULT_SET; the sample stays DRAWN and the parent receipt stays SAMPLED"
        - name: exactly_one_polymorphic_parent_is_set
          corner: "a sample created from POST /storage-tanks/{id}/samples is inspected"
          expected_behavior: "storage_tank_id is set while fuel_receipt_id and fueling_asset_id are null; the three FK slots are mutually exclusive and sample_purpose agrees with the populated slot"
        - name: partial_metric_set_still_yields_a_verdict
          corner: "only flash_point_c is supplied and it is 37.9 (below the 38.0 minimum)"
          expected_behavior: "verdict FAIL with failed_metrics [\"flash_point_c\"]; absent metrics are neither passed nor failed and never appear in failed_metrics"
    - target: FuelingAsset
      cases:
        - name: differential_pressure_at_103_kpa_downs_the_asset_immediately
          corner: "an asset is registered with differential_pressure_kpa exactly 103.0"
          expected_behavior: "element_life_pct is exactly 100.0 from the dp leg alone while the throughput and days legs are 0.0; the asset is created IN_SERVICE but the first assign returns 409 ERR_ASSET_NOT_SERVICEABLE, and 102.99 kpa yields 99.9903 and assigns cleanly"
        - name: onboard_volume_counts_only_posted_tickets_of_fueling_truck_orders
          corner: "a truck has one POSTED ticket on a FUELING order and one BILLED ticket on a COMPLETED order"
          expected_behavior: "onboard_volume_liters counts only the POSTED ticket of the FUELING order; the BILLED ticket has already left the truck"
    - target: FilterChange
      cases:
        - name: filter_change_row_has_no_common_fields
          corner: "a FilterChange is created and then read back"
          expected_behavior: "the row exposes no version and no updated_at (common_fields is false) and is never mutated afterwards; it captures liters_at_change and differential_pressure_before_kpa as of the instant before the reset"
        - name: filter_change_on_an_in_service_asset
          corner: "POST /fueling-assets/{id}/filter-changes on an asset whose status is IN_SERVICE"
          expected_behavior: "409 ERR_INVALID_ASSET_STATE; only FILTER_DUE and DOWN_FOR_FILTER assets accept a change"
    - target: HydrantPit
      cases:
        - name: pit_locked_out_when_source_tank_goes_out_of_service
          corner: "the pit's source tank moves ISOLATED -> OUT_OF_SERVICE"
          expected_behavior: "every pit fed by that tank becomes LOCKED_OUT and a HYDRANT assign naming it returns 422 ERR_DELIVERY_MODE_MISMATCH; LOCKED_OUT is administrative only and is never used to express window occupancy"
        - name: pit_stand_code_must_match_the_flight_stand
          corner: "a HYDRANT order for a flight at stand A12 is assigned a pit whose stand_code is B07"
          expected_behavior: "422 ERR_DELIVERY_MODE_MISMATCH; the order stays AUTHORIZED"
    - target: AirlineAccount
      cases:
        - name: tax_exempt_account_zeroes_both_tax_components
          corner: "an uplift of 20000.00 net liters is priced for a tax_exempt account"
          expected_behavior: "excise and sales tax components are 0, so billed_line_cents is 1304000 + 9000 + 2400 == 1315400 instead of 1433393"
        - name: into_plane_only_contract_drops_the_fuel_component
          corner: "an INTO_PLANE_ONLY account with base_price_cents_per_liter 0 uplifts 20000.00 liters"
          expected_behavior: "fuel_component_cents is 0 and billed_line_cents is the into-plane fee plus flowage fee only (9000 + 2400 == 11400); the tier differential is not applied"
        - name: credit_hold_blocks_authorization_independently_of_the_limit
          corner: "an account with status CREDIT_HOLD authorizes an order well inside its credit limit"
          expected_behavior: "402 ERR_CREDIT_LIMIT_EXCEEDED; the status check and the numeric limit check share one error id and one priority"
    - target: Flight
      cases:
        - name: flight_created_by_a_rep_of_another_account
          corner: "an AirlineRep whose X-User-ID is account BB posts a flight with airline_account_id of account AA"
          expected_behavior: "403 ERR_ACCOUNT_OWNERSHIP_REQUIRED, checked at priority 3 before any payload validation"
        - name: departure_in_the_past_relative_to_the_logical_clock
          corner: "a flight is created with scheduled_departure_utc before clock_now"
          expected_behavior: "the flight is created (no temporal guard on creation) but any authorization minted for it has expires_at_utc already in the past, so the first authorize attempt returns 409 ERR_AUTHORIZATION_NOT_REDEEMABLE"
    - target: FuelAuthorization
      cases:
        - name: day_sequence_counts_voided_and_expired_siblings
          corner: "the first authorization of the day is voided and a second is then minted for another flight departing the same UTC day"
          expected_behavior: "day_sequence is 2, not 1, and the two authorization_code values differ; sequence numbers are never reused"
        - name: authorization_code_is_fourteen_characters_with_a_mod_97_check
          corner: "an authorization for account AA on a flight departing 2026-08-10 as the first of the day is inspected"
          expected_behavior: "authorization_code is exactly 14 characters, its first 12 are AA + 260810 + 0001 and the last 2 are the sum of the 12 ASCII code points modulo 97 zero-padded; no random component appears"
        - name: manual_void_while_an_order_is_in_flight
          corner: "POST /fuel-authorizations/{id}/void is called while a referencing order is ASSIGNED"
          expected_behavior: "409 ERR_INVALID_AUTHORIZATION_STATE is not used; the guard on the manual void path fails and the authorization stays ISSUED"
          expected_error: ERR_AUTHORIZATION_NOT_REDEEMABLE
    - target: FuelingOrder
      cases:
        - name: cross_farm_reference_between_tank_and_flight_stand
          corner: "an order names a storage_tank_id belonging to farm SFO and a fuel_authorization_id whose flight_id differs from the order's flight_id"
          expected_behavior: "422 ERR_CROSS_FARM_REFERENCE at priority 6, before any state or fiscal check"
        - name: repeated_unassign_reassign_accumulates_unassign_count
          corner: "an order is assigned, unassigned, assigned again and unassigned again"
          expected_behavior: "unassign_count is 2, the reservation on the tank is unchanged throughout because it belongs to AUTHORIZED, and no error is raised: the cycle is legal"
        - name: cancel_is_not_available_from_fueling
          corner: "POST /fueling-orders/{id}/cancel on a FUELING order"
          expected_behavior: "409 ERR_INVALID_ORDER_STATE; only abort can leave FUELING"
    - target: UpliftRecord
      cases:
        - name: second_ticket_on_the_same_order_is_legitimate
          corner: "a top-up ticket is posted on an order that already has one POSTED ticket, quoting the order's current version"
          expected_behavior: "201; both tickets are POSTED, posted_net_liters is their sum, and the second ticket's tier differential is recomputed from the account's month-to-date liters including both tickets"
        - name: uplift_five_percent_authorization_tolerance
          corner: "posted_net_liters after the ticket is exactly 105 percent of max_authorized_liters (21000.00 against 20000.0)"
          expected_behavior: "the ticket is accepted because the posting guard is <= 1.05 * max_authorized_liters, but the subsequent complete call returns 409 ERR_UPLIFT_EXCEEDS_AUTHORIZATION because completion requires <= max_authorized_liters"
        - name: meter_rollback_is_rejected
          corner: "meter_end_liters is less than meter_start_liters"
          expected_behavior: "422 ERR_FIELD_OUT_OF_RANGE; no ledger movement and no version increment on the order"
    - target: SpillIncident
      cases:
        - name: escalate_below_the_reportable_volume
          corner: "a 19.99-liter spill is escalated against a permit whose max_reportable_spill_liters is 20.0"
          expected_behavior: "422 ERR_SPILL_NOT_REPORTABLE; exactly 20.0 escalates and freezes the farm"
        - name: storm_drain_incident_cannot_close_without_a_regulator_reference
          corner: "a REMEDIATED incident on surface STORM_DRAIN with an empty regulator_reference is closed"
          expected_behavior: "not ERR_INVALID_SPILL_STATE, because REMEDIATED is a legal source state; the regulator-reference guard fails instead and the incident stays REMEDIATED"
          expected_error: ERR_SPILL_NOT_REPORTABLE
        - name: contained_volume_greater_than_spilled_volume
          corner: "contain is called with contained_volume_liters 30.0 for a 25.0-liter spill"
          expected_behavior: "422 ERR_FIELD_OUT_OF_RANGE; the reliability penalty is not applied"
    - target: ReconciliationRun
      cases:
        - name: measure_before_the_period_has_elapsed
          corner: "measure is called while clock_now is still inside [period_start_utc, period_end_utc)"
          expected_behavior: "409 ERR_PERIOD_NOT_ELAPSED; exactly clock_now == period_end_utc is allowed"
        - name: measurement_set_must_cover_in_service_and_isolated_tanks_only
          corner: "a farm has three tanks, one of them OUT_OF_SERVICE, and the payload supplies measurements for all three"
          expected_behavior: "422 ERR_MEASUREMENT_SET_INCOMPLETE; the set must contain exactly the IN_SERVICE and ISOLATED tanks, so both a missing tank and an extra OUT_OF_SERVICE tank fail"
        - name: post_blocked_while_any_tank_is_quarantined
          corner: "a MEASURED run is posted while another tank at the farm is QUARANTINED"
          expected_behavior: "not ERR_INVALID_RUN_STATE, because MEASURED is a legal source state; the guard no tank has quality_status == QUARANTINED fails instead and the run stays MEASURED"
          expected_error: ERR_TANK_QUARANTINED
    - target: Invoice
      cases:
        - name: dispute_budget_is_exhausted_after_two_rounds
          corner: "an invoice is disputed, resolved, disputed and resolved, then disputed a third time"
          expected_behavior: "409 ERR_DISPUTE_LIMIT_REACHED on the third dispute; dispute_round is 2 and the invoice stays ISSUED"
        - name: reissue_links_through_replaces_invoice_id
          corner: "a voided invoice's tickets are swept into a new invoice created with replaces_invoice_id pointing at the voided one"
          expected_behavior: "the new invoice sweeps exactly the same tickets and reproduces the same total_cents; GET /invoices?replaces_invoice_id={id} returns the replacement, giving the self-FK its reverse-reachability path"
        - name: payment_larger_than_the_balance
          corner: "a payment of total_cents + 1 is posted on an ISSUED invoice"
          expected_behavior: "422 ERR_PAYMENT_EXCEEDS_BALANCE; a payment of exactly total_cents settles the invoice to PAID and drops both exposure figures by total_cents"
  state_machines:
    - target: FuelReceipt
      cases:
        - name: terminal_released_rejects_every_further_action
          corner: "verdict, reject and samples are each called on a RELEASED receipt"
          expected_behavior: "409 ERR_ALREADY_TERMINAL for all three, checked at priority 12 before ERR_INVALID_RECEIPT_STATE; the tank's book volume is not moved a second time"
        - name: verdict_from_recorded_skips_the_test_phase
          corner: "POST /fuel-receipts/{id}/verdict is called on a RECORDED receipt that has no sample"
          expected_behavior: "409 ERR_INVALID_RECEIPT_STATE; UNDER_TEST is the only source state for a verdict, so RECORDED -> RELEASED is unreachable and no volume is ever credited without a passing test"
        - name: quarantined_is_not_terminal
          corner: "a QUARANTINED receipt is re-sampled"
          expected_behavior: "201 and the receipt returns to SAMPLED with retest_round incremented; QUARANTINED is the only non-terminal state that can be re-entered, and ERR_ALREADY_TERMINAL must not fire here"
          excluded_because: "the full re-entry loop and its retest budget are already driven to exhaustion by scaffold_difficulty_design instance receipt_sampled_node_revisited_then_retest_budget_exhausted; only the single happy re-sample hop is left as a corner"
    - target: StorageTank
      cases:
        - name: two_orthogonal_dimensions_advance_independently
          corner: "a tank is isolated while its quality_status is QUARANTINED, then quality-released back through ON_TEST while still ISOLATED"
          expected_behavior: "the service and quality dimensions move independently; service_status stays ISOLATED across both quality hops and no combined super-state is enforced"
        - name: out_of_service_is_absolutely_terminal
          corner: "an OUT_OF_SERVICE tank is asked to return to IN_SERVICE and separately to accept a receipt"
          expected_behavior: "409 ERR_ALREADY_TERMINAL on the service-status call and 409 ERR_INVALID_TANK_STATE on the receipt; the tank's book volume is frozen forever and it is excluded from reconciliation measurement sets"
        - name: quality_release_from_released_is_a_no_op_error
          corner: "POST /storage-tanks/{id}/quality-release on an already RELEASED tank"
          expected_behavior: "409 ERR_INVALID_TANK_STATE; ON_TEST is the only source state, so a second release cannot silently succeed"
    - target: FuelingOrder
      cases:
        - name: three_terminal_states_are_mutually_exclusive
          corner: "an ABORTED order is cancelled and a CANCELLED order is aborted"
          expected_behavior: "409 ERR_ALREADY_TERMINAL both ways; abort_reason and the cancellation path never coexist on one order"
        - name: start_from_authorized_without_an_assignment
          corner: "POST /fueling-orders/{id}/start on an AUTHORIZED order with no fueling_asset_id"
          expected_behavior: "409 ERR_INVALID_ORDER_STATE; AUTHORIZED -> FUELING is unreachable, which is what forces every uplift to carry an asset attribution"
        - name: unassign_from_fueling_is_refused
          corner: "POST /fueling-orders/{id}/unassign on a FUELING order"
          expected_behavior: "409 ERR_INVALID_ORDER_STATE; once fuel is moving the asset cannot be detached, so onboard_volume_liters can never be orphaned"
    - target: FuelAuthorization
      cases:
        - name: expired_beats_redeemed_when_the_clock_has_passed
          corner: "the clock is advanced past expires_at_utc while a referencing order sits in FUELING, and complete is then called"
          expected_behavior: "the authorization is evaluated EXPIRED on read, so complete returns 409 ERR_AUTHORIZATION_NOT_REDEEMABLE and the ISSUED -> REDEEMED hop never happens; the order stays FUELING and can only be aborted"
        - name: redeemed_authorization_cannot_be_reused_by_a_second_order
          corner: "a second order is created quoting the authorization_code of a REDEEMED authorization"
          expected_behavior: "the code matches (no ERR_AUTH_CODE_MISMATCH) but authorize returns 409 ERR_AUTHORIZATION_NOT_REDEEMABLE; the code check and the state check are distinct failures with distinct ids"
        - name: all_three_exits_are_terminal
          corner: "void is called on a VOIDED authorization and on an EXPIRED one"
          expected_behavior: "409 ERR_ALREADY_TERMINAL in both cases; there is no re-issue path, a new authorization must be minted and it consumes the next day_sequence"
    - target: FuelingAsset
      cases:
        - name: no_terminal_state_means_every_asset_is_recoverable
          corner: "an asset is driven IN_SERVICE -> DOWN_MAINTENANCE -> IN_SERVICE -> FILTER_DUE -> DOWN_FOR_FILTER -> IN_SERVICE"
          expected_behavior: "every hop succeeds and ERR_ALREADY_TERMINAL never fires for FuelingAsset; the reliability score is not restored by a filter change, so a score-driven DOWN_MAINTENANCE recurs on the next recompute unless the score itself has recovered"
        - name: filter_due_cannot_be_assigned_but_can_finish_its_order
          corner: "an asset crosses 100.0 element_life_pct while its order is FUELING, then that order is completed and a fresh order is assigned to it"
          expected_behavior: "the in-flight order completes normally, but the new assign returns 409 ERR_ASSET_NOT_SERVICEABLE; FILTER_DUE blocks new work without stranding fuel in progress"
        - name: down_for_filter_to_filter_due_is_unreachable
          corner: "POST /fueling-assets/{id}/status with to_status == FILTER_DUE"
          expected_behavior: "422 ERR_FIELD_OUT_OF_RANGE or 409 ERR_INVALID_ASSET_STATE; FILTER_DUE is entered only by the system when element life reaches 100.0 and can never be set manually"
    - target: SpillIncident
      cases:
        - name: contain_reachable_from_two_predecessors
          corner: "one incident goes REPORTED -> CONTAINED and another goes REPORTED -> ESCALATED -> CONTAINED"
          expected_behavior: "both reach CONTAINED, but only the escalated one required a regulator_reference and only it froze the farm; posture returns to RESTRICTED on containment of the escalated incident and to OPEN on containment of the unescalated one"
        - name: escalate_after_containment
          corner: "POST /spill-incidents/{id}/escalate on a CONTAINED incident"
          expected_behavior: "409 ERR_INVALID_SPILL_STATE; escalation is only possible while the incident is still REPORTED, so a farm cannot be re-frozen after cleanup has begun"
        - name: closed_incident_still_carries_its_reliability_penalty
          corner: "an incident is closed and the attributed asset's reliability score is read"
          expected_behavior: "the penalty persists after CLOSED; closing is a paperwork terminal state and never restores asset_reliability_score to 100"
    - target: ReconciliationRun
      cases:
        - name: variance_hold_is_entered_by_the_same_request_that_measured
          corner: "a measure call whose variance exceeds tolerance is inspected in its own response body"
          expected_behavior: "the response already shows status VARIANCE_HOLD, not MEASURED; the system hop is applied inside the request, consistent with the immediate consistency model"
        - name: post_from_variance_hold_without_an_override_reason
          corner: "POST /reconciliation-runs/{id}/post on a VARIANCE_HOLD run with variance_override_reason omitted"
          expected_behavior: "409 ERR_VARIANCE_OVERRIDE_REQUIRED; supplying the reason on a merely MEASURED run is harmless and is ignored"
        - name: posted_run_is_immutable
          corner: "measure and post are each called again on a POSTED run"
          expected_behavior: "409 ERR_ALREADY_TERMINAL for both; the gain/loss adjustment is applied exactly once to each tank's book volume"
    - target: Invoice
      cases:
        - name: dispute_resolve_loop_returns_to_the_same_state
          corner: "an ISSUED invoice is disputed and resolved"
          expected_behavior: "the invoice is ISSUED again with dispute_round 1; total_cents and the swept ticket set are unchanged by the round trip, so a dispute never re-prices"
        - name: payment_on_a_disputed_invoice
          corner: "POST /invoices/{id}/payments on a DISPUTED invoice"
          expected_behavior: "409 ERR_INVALID_INVOICE_STATE; DISPUTED -> PAID is unreachable, the dispute must be resolved or the invoice voided first"
        - name: draft_invoice_cannot_be_disputed_or_voided_into_paid
          corner: "dispute is called on a DRAFT invoice"
          expected_behavior: "409 ERR_INVALID_INVOICE_STATE; a DRAFT invoice contributes to the accrual exposure basis but not to the invoiced basis, and only issue can move it forward"
    - target: FuelFarm
      cases:
        - name: posture_is_never_settable_by_an_endpoint
          corner: "no endpoint accepts a posture field on the farm"
          expected_behavior: "posture is derived by calculations.farm_posture on every read and after every child mutation; a payload containing posture is rejected as 400 ERR_INVALID_PAYLOAD by strict field validation"
        - name: frozen_to_open_skips_restricted
          corner: "a farm whose only defect was an ESCALATED spill has that spill CONTAINED while no tank is quarantined, utilisation is under 90 percent and at least one asset is IN_SERVICE"
          expected_behavior: "posture goes straight FROZEN -> OPEN in one recompute; the intermediate RESTRICTED state is not passed through and no transition record is required"
        - name: restricted_has_four_independent_causes
          corner: "utilisation is driven to 90 percent and a tank is separately quarantined, then the quarantine is cleared while utilisation stays at 90 percent"
          expected_behavior: "posture stays RESTRICTED after the quarantine clears because the utilisation cause is still active; posture is the disjunction of its causes, not a counter"
          excluded_because: "the 90 percent utilisation boundary itself is pinned by scaffold_difficulty_design instance permit_utilisation_exactly_ninety_percent_restricts_the_farm; this corner adds only the multi-cause overlap"
    - target: EnvironmentalPermit
      cases:
        - name: expired_permit_cannot_be_suspended_or_reinstated
          corner: "suspend and reinstate are called on an EXPIRED permit"
          expected_behavior: "409 ERR_ALREADY_TERMINAL for both; the only remedy is a new permit, which then governs by having the latest valid_from_utc"
        - name: suspension_of_a_non_governing_permit_does_not_freeze_the_farm
          corner: "the older of two overlapping permits is suspended while the governing one stays ACTIVE"
          expected_behavior: "posture is unchanged; only the governing permit's state feeds farm_posture and only its max_daily_throughput_liters caps receipts"
        - name: valid_from_in_the_future_is_active_but_not_covering
          corner: "a permit is created with valid_from_utc after clock_now"
          expected_behavior: "its status is ACTIVE yet it does not cover clock_now; because it has the latest valid_from_utc it becomes the governing permit and the farm goes FROZEN with ERR_PERMIT_NOT_ACTIVE on receipt creation"
  calculations:
    - target: receipt_net_volume_at_15c
      cases:
        - name: density_exactly_at_both_band_edges
          corner: "two receipts are recorded with certificate_density_kg_per_m3 exactly 800.0 and exactly 780.0"
          expected_behavior: "the 800.0 receipt uses alpha 0.000850 and the 780.0 receipt uses alpha 0.000900; both bounds are inclusive lower edges, so 799.99 falls to the mid band and 779.99 to the light band"
        - name: temperature_exactly_at_the_reference
          corner: "temperature_c is exactly 15.0"
          expected_behavior: "vcf is exactly 1.00000 for every density band, so corrected equals the governing gross and only the water deduction can move net_volume_liters"
        - name: net_volume_is_frozen_at_creation
          corner: "the source tank's density_kg_per_m3 is later changed and the receipt is re-read"
          expected_behavior: "net_volume_liters and advisory_net_volume_liters are unchanged; the receipt calculation reads only its own fields and is never recomputed after creation, unlike uplift_net_liters which reads the tank live"
      excluded_because: "the density-band / water-cap interaction and the TRUCK-versus-PIPELINE governing basis are already pinned by scaffold_difficulty_design instances receipt_density_band_vcf_and_water_cap_interaction and receipt_governing_basis_truck_meter_vs_pipeline_gauge; only band edges, the identity vcf and the freeze property remain"
    - target: sample_verdict
      cases:
        - name: conductivity_is_a_two_sided_inclusive_band
          corner: "three samples post conductivity_ps_per_m 50.0, 49.9 and 600.0"
          expected_behavior: "50.0 and 600.0 PASS; 49.9 FAILs with failed_metrics [\"conductivity_ps_per_m\"]; a too-conductive reading fails exactly like a too-resistive one, so a one-sided threshold implementation is caught"
        - name: density_tolerance_uses_the_receipt_certificate_for_receipt_qc
          corner: "a RECEIPT_QC sample posts observed_density 798.0 against a receipt certificate of 795.0 while the tank's density is 790.0"
          expected_behavior: "abs(798.0 - 795.0) == 3.0 is within tolerance so it PASSes; comparing against the tank's 790.0 would have failed, which distinguishes the two comparison sources"
        - name: failed_metrics_ordering_is_canonical_not_insertion
          corner: "flash_point_c 30.0 and water_reaction_rating 3 both fail on one sample"
          expected_behavior: "failed_metrics is exactly [\"water_reaction_rating\", \"flash_point_c\"] in the pinned metric order regardless of payload key order"
    - target: tank_book_inventory
      cases:
        - name: available_volume_floors_at_zero_and_never_goes_negative
          corner: "reservations plus the unpumpable bottom exceed the book volume"
          expected_behavior: "available_volume_liters is 0.0, not a negative number; book_volume_liters itself is untouched and may still be large"
        - name: quarantined_receipt_contributes_nothing_then_everything
          corner: "a receipt sits QUARANTINED, is re-sampled, passes and is released"
          expected_behavior: "book_volume_liters is unchanged while the receipt is RECORDED, SAMPLED, UNDER_TEST or QUARANTINED and jumps by net_volume_liters only on the hop into RELEASED; the release is what moves the ledger, not the receipt's creation"
        - name: full_recompute_survives_a_void_and_repost
          corner: "a ticket is voided and an identical ticket is posted afterwards"
          expected_behavior: "book_volume_liters returns to exactly the pre-void value; because the rule is a full recompute over source rows rather than an incremental delta, no drift accumulates over repeated void/repost cycles"
    - target: uplift_net_liters
      cases:
        - name: zero_gross_ticket
          corner: "meter_start_liters equals meter_end_liters"
          expected_behavior: "gross_liters and net_liters are both 0.00 and the ticket is created; billed_line_cents is still the 2500-cent into-plane minimum plus 0 flowage and the taxes computed from it, so a zero-volume visit is not free"
        - name: tank_density_read_live_at_posting_time
          corner: "the source tank's density_kg_per_m3 is 779.0 for the first ticket and is corrected to 795.0 before the second"
          expected_behavior: "the first ticket uses alpha 0.000950 and the second 0.000900; the tank is read at posting time, so two tickets on the same order can legitimately carry different vcf values"
    - target: uplift_invoice_line_amount
      cases:
        - name: month_to_date_resets_at_the_month_boundary
          corner: "the clock is advanced from 2026-08-31T23:59:00Z to 2026-09-01T00:00:00Z between two tickets of an account already past 500000 liters"
          expected_behavior: "the September ticket falls back to the 3.20 tier because the window starts at the first instant of the ticket's own calendar UTC month; the August tickets keep their 1.60 rate and are not repriced"
        - name: voiding_a_ticket_can_cheapen_a_later_one
          corner: "a large ticket that pushed the account over 100000 liters is voided, then a new ticket is posted"
          expected_behavior: "the new ticket prices at 3.20 because VOIDED tickets leave the cumulative; already-BILLED tickets are not retroactively repriced by the void"
        - name: into_plane_minimum_dominates_a_small_ticket
          corner: "a ticket of 5000.00 net liters is priced"
          expected_behavior: "into_plane_fee_cents is 2500 from the minimum (5000 * 0.45 == 2250 loses), and the sales tax is computed on the floored 2500, not on 2250"
      excluded_because: "the per-component-then-sum rounding rule and the tier selection including the current ticket are already pinned by scaffold_difficulty_design instance uplift_line_per_component_rounding_beats_sum_then_round"
    - target: invoice_total_with_fees
      cases:
        - name: rebate_boundary_at_exactly_one_hundred_thousand_liters
          corner: "the swept tickets total exactly 100000.00 net liters"
          expected_behavior: "the 0.75 percent rebate band applies because the comparison is >=; 99999.99 liters earns no rebate at all and produces a strictly larger total"
        - name: admin_fee_cap_binds_at_a_large_subtotal
          corner: "the subtotal net of rebate exceeds 12500000 cents"
          expected_behavior: "admin_fee_cents is exactly 50000 from the cap; a subtotal one cent lower yields 49999 or less, so the cap must be a min() and not a rounded percentage"
        - name: single_ticket_invoice_equals_its_line_plus_fees
          corner: "an invoice sweeps exactly one ticket of 20000.00 net liters"
          expected_behavior: "subtotal_cents equals that ticket's billed_line_cents; the rebate is 0 because 20000 is under 100000 and total_cents is subtotal + admin fee only"
      excluded_because: "the pinned rebate-before-admin-fee evaluation order and its wrong-order counterfactual are already covered by scaffold_difficulty_design instance invoice_volume_rebate_before_admin_fee_evaluation_order"
    - target: airline_credit_exposure
      cases:
        - name: reservation_term_excludes_flowage_and_taxes
          corner: "an AUTHORIZED order of 20000.0 requested liters is the account's only activity"
          expected_behavior: "the accrual exposure counts round(20000 * (base + diff)) + max(2500, round(20000 * 0.45)) only; flowage, excise and sales tax are deliberately absent from the reservation, so the accrual figure is lower than the eventual billed line"
        - name: a_ticket_replaces_its_order_reservation_rather_than_adding_to_it
          corner: "an order that reserved 20000.0 liters has a POSTED ticket of 20000.00 net liters"
          expected_behavior: "the accrual exposure counts the ticket's billed_line_cents and no longer counts the order reservation; exposure does not double-count the same fuel"
        - name: paid_invoice_leaves_both_bases
          corner: "the only invoice is settled in full"
          expected_behavior: "both the invoiced basis and the accrual basis drop to 0 and a subsequent authorize succeeds against the full credit limit"
      excluded_because: "the invoiced-versus-accrual divergence itself is pinned by scaffold_difficulty_design instance airline_exposure_accrual_basis_vs_invoiced_basis and its conservation across issue and void by airline_exposure_conservation_across_invoice_issue_and_void"
    - target: reconciliation_gain_loss
      cases:
        - name: quiet_period_denominator_is_floored_at_one_liter
          corner: "a period with no receipts and no uplifts is measured against a non-zero variance"
          expected_behavior: "the denominator is max(throughput, 1.0) == 1.0, so variance_pct_throughput_basis becomes an enormous number rather than a division-by-zero error, and the run goes to VARIANCE_HOLD"
        - name: gain_and_loss_cancel_across_tanks
          corner: "tank A measures 300.00 liters high and tank B measures 300.00 liters low in the same run"
          expected_behavior: "variance_liters is 0.00 and the run posts clean, yet each tank still receives its own signed adjustment_liters of +300.00 and -300.00; the run-level netting must not suppress the per-tank ledger movement"
        - name: out_of_service_tank_is_excluded_from_the_measurement_set
          corner: "a tank is moved OUT_OF_SERVICE between the run's creation and its measurement"
          expected_behavior: "the payload must omit it; including it returns 422 ERR_MEASUREMENT_SET_INCOMPLETE and its book volume is frozen out of both the variance and the opening-stock denominator"
      excluded_because: "the dual-basis variance percentages and the exactly-at-tolerance posting boundary are pinned by scaffold_difficulty_design instances reconciliation_variance_throughput_basis_vs_opening_stock_basis and reconciliation_variance_exactly_at_tolerance_posts_without_override"
    - target: permit_daily_throughput_used
      cases:
        - name: released_at_utc_not_created_at_decides_the_day
          corner: "a receipt is created at 2026-08-10T23:50:00Z and released after the clock is advanced to 2026-08-11T00:10:00Z"
          expected_behavior: "the volume counts against 2026-08-11, not 2026-08-10; the 10th's counter stays at its previous value"
        - name: day_window_is_half_open_at_midnight
          corner: "one ticket is created at exactly 00:00:00Z and another at exactly 23:59:59.999Z of the same UTC day"
          expected_behavior: "both count against that day; the next 00:00:00Z ticket starts a fresh counter, so a receipt release at midnight can never be double-counted"
        - name: throughput_cap_breach_is_evaluated_before_the_ledger_moves
          corner: "a receipt whose net volume would exceed the remaining daily cap is released"
          expected_behavior: "409 ERR_PERMIT_THROUGHPUT_EXCEEDED and the tank's book_volume_liters is unchanged; the receipt stays UNDER_TEST and can be released after the clock rolls to the next UTC day"
    - target: farm_posture
      cases:
        - name: no_permit_at_all_freezes_a_brand_new_farm
          corner: "a farm is created and read before any permit is registered"
          expected_behavior: "posture is FROZEN immediately; a covering ACTIVE permit is a precondition rather than a later enhancement, so the very first receipt attempt returns 409 ERR_PERMIT_NOT_ACTIVE"
        - name: reported_spill_restricts_but_does_not_freeze
          corner: "a 5.0-liter spill on CONCRETE is reported and left unescalated"
          expected_behavior: "posture is RESTRICTED, so already-AUTHORIZED orders survive; escalation is what cancels them, which is the difference between the RESTRICTED and FROZEN cascade depths"
        - name: last_in_service_asset_going_down_restricts_the_farm
          corner: "the farm's only IN_SERVICE asset is put DOWN_MAINTENANCE"
          expected_behavior: "in_service_asset_count becomes 0 and posture becomes RESTRICTED; returning the asset to IN_SERVICE restores OPEN in the same recompute"
      excluded_because: "the FROZEN cascade and the 90-percent utilisation edge are pinned by scaffold_difficulty_design instances spill_escalation_depth3_environmental_cascade and permit_utilisation_exactly_ninety_percent_restricts_the_farm"
    - target: filter_element_life_pct
      cases:
        - name: days_leg_floors_to_whole_days
          corner: "the clock is advanced to exactly 364 days and 23 hours after last_filter_change_at_utc"
          expected_behavior: "days_since is 364 and days_pct is 99.7260, so the asset stays IN_SERVICE; one more hour makes it 365 days, days_pct 100.0000 and the asset FILTER_DUE with no uplift involved"
        - name: filter_change_resets_only_the_legs_it_owns
          corner: "a filter change is posted with post_change_differential_pressure_kpa 8.0 on an asset that was DOWN_FOR_FILTER at 4200000 liters"
          expected_behavior: "liters_since_filter_change returns to 0.0, last_filter_change_at_utc becomes clock_now and differential_pressure_kpa becomes 8.0, so element_life_pct drops to 7.7670; the asset's reliability score is untouched by the change"
        - name: voided_ticket_volume_is_subtracted_back_out
          corner: "a ticket metered by the asset is voided"
          expected_behavior: "liters_since_filter_change decreases by that ticket's net_liters and element_life_pct falls accordingly; a FILTER_DUE asset can therefore return to IN_SERVICE by a void, which is legal"
      excluded_because: "the worst-of-three max() selection itself is exercised by the difficulty-design filter arithmetic; only per-leg edges are left here"
    - target: asset_reliability_score
      cases:
        - name: surface_multiplier_applies_before_the_per_incident_cap
          corner: "a 200.0-liter spill on STORM_DRAIN is attributed to an asset"
          expected_behavior: "the per-incident penalty is min(40, min(40, ceil(200/10) * 5) * 2) == 40, so the doubling cannot push a single incident past 40 points; the score is 60 and the asset is still IN_SERVICE at exactly 60"
        - name: small_spill_on_sealed_ground_costs_five_points
          corner: "a 1.0-liter spill on CONCRETE"
          expected_behavior: "ceil(1/10) * 5 == 5 points with no multiplier, giving a score of 95; the ceiling means even a fractional liter costs the full first step"
        - name: unattributed_spill_penalises_nothing
          corner: "a spill is reported with neither fueling_asset_id nor storage_tank_id"
          expected_behavior: "no asset score changes, yet the farm posture still becomes RESTRICTED; environmental consequence and asset consequence are independent"
      excluded_because: "the cumulative decay across several incidents and the sub-60 DOWN_MAINTENANCE crossing are pinned by scaffold_difficulty_design instance order_start_gated_by_asset_reliability_driven_down_by_spill_history"
    - target: authorization_code
      cases:
        - name: check_digits_are_zero_padded_to_two_characters
          corner: "an account and date whose 12-character prefix has an ASCII sum congruent to a value under 10 modulo 97"
          expected_behavior: "the code ends in a zero-padded two-digit group such as 07; the code length is always exactly 14 characters"
        - name: day_sequence_is_keyed_on_the_departure_day_not_the_creation_day
          corner: "two authorizations are minted on 2026-08-10 for flights departing 2026-08-10 and 2026-08-11"
          expected_behavior: "each carries day_sequence 1 with a different YYMMDD group; the counter is per account per departure UTC day"
        - name: quoted_code_is_compared_exactly
          corner: "an order quotes the right code with a lowercased airline prefix"
          expected_behavior: "422 ERR_AUTH_CODE_MISMATCH; the comparison is byte-exact with no normalisation, and this check precedes ERR_AUTHORIZATION_NOT_REDEEMABLE in the ladder"
        - name: expiry_is_departure_plus_two_hours
          corner: "the clock is set to exactly scheduled_departure_utc + 2 hours"
          expected_behavior: "the authorization is EXPIRED because the comparison is >=; one second earlier it is still ISSUED and redeemable"
  validations:
    - target: "priority 1 - ERR_UNAUTHENTICATED (401)"
      cases:
        - name: unknown_role_string_is_unauthenticated_not_forbidden
          corner: "X-User-Role is TruckDriver, a role that does not exist, on an endpoint that would also have failed the role check"
          expected_behavior: "401 ERR_UNAUTHENTICATED, never 403; an unrecognised role is an authentication failure because it cannot be resolved to a principal"
        - name: role_present_but_user_id_missing
          corner: "X-User-Role is FarmOperator and X-User-ID is absent"
          expected_behavior: "401 ERR_UNAUTHENTICATED; both headers are required together even on endpoints that never consult the user id"
    - target: "priority 2 - ERR_ROLE_NOT_PERMITTED (403)"
      cases:
        - name: role_check_precedes_resource_existence
          corner: "a BillingClerk calls POST /fuel-receipts/{id}/verdict with a fuel receipt id that does not exist"
          expected_behavior: "403 ERR_ROLE_NOT_PERMITTED, not 404; priority 2 runs before priority 4, so a wrong role cannot probe which ids exist"
        - name: read_endpoints_are_broadly_permitted
          corner: "an EnvironmentalOfficer performs GET /storage-tanks/{id}"
          expected_behavior: "200; the GET is in the shared read surface even though the officer holds no write operation on tanks"
    - target: "priority 3 - ERR_ACCOUNT_OWNERSHIP_REQUIRED (403)"
      cases:
        - name: non_airline_roles_bypass_the_ownership_check_entirely
          corner: "an IntoPlaneAgent creates a fueling order for account AA"
          expected_behavior: "201; the ownership rule is scoped to X-User-Role == AirlineRep, so staff roles act across all accounts"
        - name: ownership_is_evaluated_through_the_parent_chain
          corner: "an AirlineRep for account BB disputes an invoice belonging to account AA"
          expected_behavior: "403 ERR_ACCOUNT_OWNERSHIP_REQUIRED; ownership is resolved through the invoice's airline_account_id rather than from the payload"
      excluded_because: "the flight-creation ownership case is already covered by the entities corner flight_created_by_a_rep_of_another_account"
    - target: "priority 4 - ERR_RESOURCE_NOT_FOUND (404) and priority 5 - ERR_REFERENCED_ENTITY_NOT_FOUND (404)"
      cases:
        - name: path_id_versus_body_fk_use_different_error_ids
          corner: "POST /fueling-orders is called with a valid flight_id but a storage_tank_id that does not exist, and separately POST /fueling-orders/{missing}/authorize is called"
          expected_behavior: "the first returns ERR_REFERENCED_ENTITY_NOT_FOUND and the second ERR_RESOURCE_NOT_FOUND; both are 404 but the ids must not be interchanged"
        - name: syntactically_valid_but_unknown_uuid
          corner: "a well-formed uuid that was never issued is used as a path id"
          expected_behavior: "404 ERR_RESOURCE_NOT_FOUND rather than 400 ERR_INVALID_PAYLOAD; id format is not validated as a payload concern"
    - target: "priority 6 - ERR_CROSS_FARM_REFERENCE (422)"
      cases:
        - name: reconciliation_measurement_naming_a_foreign_tank
          corner: "a run at farm SFO is measured with a tank_measurements entry whose storage_tank_id belongs to farm OAK"
          expected_behavior: "422 ERR_CROSS_FARM_REFERENCE at priority 6, before the completeness check at priority 38 could report the missing local tank"
        - name: hydrant_pit_from_another_farm
          corner: "an assign names a pit belonging to a different farm than the order's tank"
          expected_behavior: "422 ERR_CROSS_FARM_REFERENCE, not ERR_DELIVERY_MODE_MISMATCH; the tenancy check outranks the mode check"
    - target: "priority 7 - ERR_INVALID_PAYLOAD (400) and priority 8 - ERR_FIELD_OUT_OF_RANGE (422)"
      cases:
        - name: unknown_field_is_rejected_strictly
          corner: "POST /fuel-receipts includes an extra key vcf_override"
          expected_behavior: "400 ERR_INVALID_PAYLOAD; no unknown key is silently ignored, which is what stops a client from injecting a derived value"
        - name: wrong_type_beats_out_of_range
          corner: "meter_ticket_gross_liters is the string \"-5\""
          expected_behavior: "400 ERR_INVALID_PAYLOAD at priority 7, not 422 ERR_FIELD_OUT_OF_RANGE; type failures precede domain-range failures"
        - name: zero_is_out_of_range_where_strictly_positive_is_required
          corner: "max_authorized_liters is 0.0"
          expected_behavior: "422 ERR_FIELD_OUT_OF_RANGE; the field is strictly positive, while measured_water_liters 0.0 is perfectly valid, so the bound differs per field"
        - name: window_end_not_after_window_start
          corner: "window_start_utc equals window_end_utc on an order"
          expected_behavior: "422 ERR_FIELD_OUT_OF_RANGE; a zero-length window is refused before any overlap search runs, so it can never be trivially conflict-free"
    - target: "priority 9 - ERR_DUPLICATE_KEY (409)"
      cases:
        - name: uplift_ticket_number_is_unique_per_farm_not_globally
          corner: "ticket_number TK-0001 is reused on an order at a different farm and then on another order at the same farm"
          expected_behavior: "the cross-farm reuse succeeds and the same-farm reuse returns 409 ERR_DUPLICATE_KEY"
        - name: duplicate_check_runs_after_range_checks
          corner: "a duplicate meter_ticket_number is submitted together with a negative temperature far outside the accepted band"
          expected_behavior: "422 ERR_FIELD_OUT_OF_RANGE wins at priority 8; the duplicate is only reported once the payload is otherwise sound"
    - target: "priority 10 and 11 - ERR_STALE_ORDER_VERSION / ERR_STALE_ACCOUNT_VERSION (412)"
      cases:
        - name: version_from_before_an_unrelated_mutation_is_stale
          corner: "an order version is captured, the order is unassigned and reassigned, then an uplift is posted quoting the captured version"
          expected_behavior: "412 ERR_STALE_ORDER_VERSION; every mutation of the parent bumps version, even ones that do not touch fuel volume"
        - name: occ_check_precedes_every_business_guard
          corner: "an uplift quotes a stale expected_fueling_order_version on an order that is also outside its fueling window and whose asset is unserviceable"
          expected_behavior: "412 ERR_STALE_ORDER_VERSION wins over ERR_OUTSIDE_FUELING_WINDOW and ERR_ASSET_NOT_SERVICEABLE; the client must re-read before any other diagnosis is offered"
        - name: correct_version_is_accepted_after_a_re_read
          corner: "the client re-reads the order and retries with the fresh version"
          expected_behavior: "201 and the order's version increments by exactly one; there is no retry counter and no lockout"
    - target: "priority 12 - ERR_ALREADY_TERMINAL (409)"
      cases:
        - name: terminal_check_precedes_the_entity_specific_state_error
          corner: "POST /fueling-orders/{id}/start on a CANCELLED order"
          expected_behavior: "409 ERR_ALREADY_TERMINAL, not ERR_INVALID_ORDER_STATE; the two are distinguished purely by whether the current state is terminal"
        - name: terminal_check_does_not_apply_to_stateless_children
          corner: "a FilterChange or GaugeMeasurement is created against an asset or tank"
          expected_behavior: "no terminal check applies because those rows carry no status; only OUT_OF_SERVICE on the tank blocks the write"
    - target: "priorities 13 to 19 - the entity state errors (409)"
      cases:
        - name: each_entity_has_its_own_state_error_id
          corner: "an invalid transition is attempted on a receipt, an order, a tank, an asset, a spill, an invoice and a run in turn"
          expected_behavior: "seven distinct ids ERR_INVALID_RECEIPT_STATE, ERR_INVALID_ORDER_STATE, ERR_INVALID_TANK_STATE, ERR_INVALID_ASSET_STATE, ERR_INVALID_SPILL_STATE, ERR_INVALID_INVOICE_STATE and ERR_INVALID_RUN_STATE; they are never collapsed into a generic ERR_INVALID_STATE"
        - name: state_error_of_the_acted_on_entity_wins_over_a_related_entity
          corner: "start is called on an AUTHORIZED order whose tank is also QUARANTINED"
          expected_behavior: "409 ERR_INVALID_ORDER_STATE at priority 14 beats ERR_TANK_QUARANTINED at priority 23; the entity in the path is diagnosed first"
    - target: "priority 20 - ERR_FARM_FROZEN (409) and priority 21 - ERR_PERMIT_NOT_ACTIVE (409)"
      cases:
        - name: frozen_farm_still_permits_remediation_writes
          corner: "on a FROZEN farm, spill contain, spill remediate, filter changes and gauge measurements are attempted"
          expected_behavior: "all succeed; the freeze blocks fuel movement and new orders only, otherwise the farm could never be un-frozen"
        - name: permit_not_active_is_distinguishable_from_farm_frozen
          corner: "a receipt is created at a farm whose governing permit is SUSPENDED"
          expected_behavior: "the ladder reports ERR_FARM_FROZEN at priority 20 because the posture check runs first; ERR_PERMIT_NOT_ACTIVE surfaces only on permit-scoped operations such as reinstate outside the validity window"
      excluded_because: "the two-hop permit-to-posture gate is already pinned by scaffold_difficulty_design instance receipt_sampling_gated_by_environmental_permit_state_two_hops_away"
    - target: "priority 22 - ERR_SEGREGATION_OF_DUTIES (403)"
      cases:
        - name: sampler_cannot_release_their_own_sample
          corner: "the QualityInspector whose X-User-ID equals FuelReceipt.sampled_by_user_id posts the verdict"
          expected_behavior: "403 ERR_SEGREGATION_OF_DUTIES even though the role is permitted; a second inspector's id succeeds, and released_by_user_id then differs from sampled_by_user_id"
        - name: segregation_is_not_rbac
          corner: "the same inspector posts the test results for their own sample"
          expected_behavior: "200; only the release decision is segregated, so the rule must be attached to the verdict endpoint and not to the inspector role"
        - name: segregation_check_follows_the_state_checks
          corner: "the sampling inspector posts a verdict on a RECORDED receipt"
          expected_behavior: "409 ERR_INVALID_RECEIPT_STATE at priority 13 wins over ERR_SEGREGATION_OF_DUTIES at priority 22"
    - target: "priorities 23 to 27 - quality and asset gates (409)"
      cases:
        - name: sample_verdict_fail_blocks_the_quality_release
          corner: "POST /storage-tanks/{id}/quality-release after the tank's latest PERIODIC_TANK_QA sample returned FAIL"
          expected_behavior: "409 ERR_SAMPLE_VERDICT_FAIL; only the latest sample by created_at counts, so an earlier PASS does not rescue the tank"
        - name: water_bottom_exceeded_is_its_own_diagnosis
          corner: "a quality-release is attempted on a tank whose latest gauge shows water_bottom_mm 30.0"
          expected_behavior: "409 ERR_WATER_BOTTOM_EXCEEDED at priority 25, distinct from ERR_TANK_QUARANTINED at 23 and from ERR_SAMPLE_VERDICT_FAIL at 24"
        - name: asset_not_serviceable_covers_all_three_down_states
          corner: "assign is attempted against a FILTER_DUE, a DOWN_FOR_FILTER and a DOWN_MAINTENANCE asset"
          expected_behavior: "409 ERR_ASSET_NOT_SERVICEABLE in all three cases with the same id; only IN_SERVICE assets can be assigned"
      excluded_because: "the tank-quarantine and retest-budget gates are pinned by scaffold_difficulty_design instances tank_quarantined_beats_insufficient_tank_volume_on_authorize and receipt_sampled_node_revisited_then_retest_budget_exhausted"
    - target: "priorities 28 to 32 - reference and code integrity (422)"
      cases:
        - name: delivery_mode_mismatch_covers_both_directions
          corner: "a HYDRANT order is assigned a TRUCK asset, and a TRUCK order is assigned a hydrant_pit_id"
          expected_behavior: "422 ERR_DELIVERY_MODE_MISMATCH both ways; a TRUCK order must leave hydrant_pit_id null and a HYDRANT order must supply it"
        - name: order_mode_must_match_the_farm_capability
          corner: "a HYDRANT order is created at a farm whose hydrant_system_available is false"
          expected_behavior: "422 ERR_DELIVERY_MODE_MISMATCH at order creation, before any pit is named"
    - target: "priorities 33 to 36 - temporal and window gates (409)"
      cases:
        - name: outside_fueling_window_is_evaluated_against_the_logical_clock
          corner: "start is called after the clock has been advanced past window_end_utc"
          expected_behavior: "409 ERR_OUTSIDE_FUELING_WINDOW; exactly window_end_utc is already outside because the window is half-open, while exactly window_start_utc is inside"
        - name: tank_isolation_conflict_is_not_an_asset_conflict
          corner: "an isolation window collides with another tank's isolation window while no asset is involved"
          expected_behavior: "409 ERR_TANK_ISOLATION_CONFLICT, distinct from ERR_ASSET_WINDOW_CONFLICT and ERR_PIT_WINDOW_CONFLICT; the three overlap families never share an id"
      excluded_because: "pit and asset window semantics including the turnaround buffer are pinned by scaffold_difficulty_design instances hydrant_pit_half_open_windows_allow_adjacency_but_reject_intersection and truck_closed_window_plus_turnaround_buffer_rejects_exact_adjacency, and the window-versus-state precedence by invalid_order_state_beats_outside_fueling_window_on_start"
    - target: "priorities 37 to 42 - run, sweep and dispute gates"
      cases:
        - name: nothing_to_sweep_versus_no_uplift_recorded
          corner: "an invoice period with no BILLED-eligible tickets is created, and separately an order with no ticket is completed"
          expected_behavior: "422 ERR_NOTHING_TO_SWEEP for the invoice and 409 ERR_NO_UPLIFT_RECORDED for the order; an empty aggregate is a payload-level 422 on the billing side and a state-level 409 on the operations side"
        - name: variance_override_reason_must_be_non_empty
          corner: "post is called on a VARIANCE_HOLD run with variance_override_reason set to an empty string"
          expected_behavior: "409 ERR_VARIANCE_OVERRIDE_REQUIRED; a whitespace-only reason is treated as absent"
      excluded_because: "the empty-aggregate pair is already pinned by scaffold_difficulty_design instance empty_aggregate_sets_block_completion_and_invoice_sweep and the dispute budget by the entities corner dispute_budget_is_exhausted_after_two_rounds"
    - target: "priorities 43 to 48 - fiscal and volume ceilings"
      cases:
        - name: insufficient_tank_volume_uses_available_not_book
          corner: "an order reserves more than available_volume_liters while book_volume_liters is comfortably larger"
          expected_behavior: "409 ERR_INSUFFICIENT_TANK_VOLUME; the unpumpable bottom and existing reservations are both subtracted, so a full tank can still refuse an order"
        - name: credit_limit_boundary_is_inclusive
          corner: "an authorize brings the accrual exposure to exactly credit_limit_cents"
          expected_behavior: "the authorize succeeds; one cent more returns 402 ERR_CREDIT_LIMIT_EXCEEDED, the only 402 in the ladder"
        - name: uplift_exceeds_authorization_only_bites_at_completion
          corner: "posted liters sit between 100 and 105 percent of the authorization"
          expected_behavior: "the ticket posts but complete returns 409 ERR_UPLIFT_EXCEEDS_AUTHORIZATION; voiding the excess ticket lets the order complete"
        - name: payment_exceeds_balance_is_422_not_409
          corner: "an overpayment is attempted"
          expected_behavior: "422 ERR_PAYMENT_EXCEEDS_BALANCE; it is a payload-value failure rather than a state conflict, and the invoice stays ISSUED with no partial payment recorded"
  endpoints:
    - target: "POST /_clock/set_current_utc"
      cases:
        - name: startup_default_clock_value
          corner: "a receipt is created before the clock has ever been set"
          expected_behavior: "created_at is 2026-08-01T00:00:00Z, the declared startup default; every timestamp in the system derives from the logical clock and never from the wall clock"
        - name: clock_may_move_backwards
          corner: "the clock is set to 2026-08-05T00:00:00Z after having been at 2026-08-12T00:00:00Z"
          expected_behavior: "200; an EXPIRED authorization does not return to ISSUED because EXPIRED is terminal, but filter days_pct and the permit day window are recomputed from the new value, so the asset can leave FILTER_DUE"
        - name: clock_set_returns_the_recomputed_side_effects
          corner: "the clock is advanced past an authorization expiry and a permit expiry in one call"
          expected_behavior: "200 with response_type object; the affected authorizations are EXPIRED, the permit is EXPIRED and the farm is FROZEN by the time the very next read happens, with no intervening request needed"
    - target: "collection GET endpoints"
      cases:
        - name: pagination_defaults_and_bounds
          corner: "GET /uplift-records with no query params, then with limit 101, then with limit 0"
          expected_behavior: "the default page is limit 10 offset 0 with total_count and has_more present; limit 101 and limit 0 both return 422 ERR_FIELD_OUT_OF_RANGE because the accepted range is 1 to 100"
        - name: empty_collection_is_an_empty_array_not_a_404
          corner: "GET /spill-incidents on a fresh database"
          expected_behavior: "200 with response_type array, data [], total_count 0 and has_more false"
        - name: offset_past_the_end
          corner: "GET /invoices?offset=1000 when three invoices exist"
          expected_behavior: "200 with data [], total_count 3 and has_more false; an out-of-range offset is not an error"
    - target: "reverse reachability of every foreign key"
      cases:
        - name: every_fk_has_a_listing_or_nested_route
          corner: "each FK in the model is traversed backwards from the parent"
          expected_behavior: "GET /fuel-farms/{id}/storage-tanks, /environmental-permits, /hydrant-pits and /reconciliation-runs cover the farm's children; GET /fuel-receipts?storage_tank_id=, /quality-samples?fuel_receipt_id=, /quality-samples?storage_tank_id=, /fueling-assets?fuel_farm_id=, /fueling-assets/{id}/filter-changes, /hydrant-pits?source_storage_tank_id=, /flights?airline_account_id=, /fuel-authorizations?flight_id=, /fueling-orders?flight_id=, /fueling-orders?fueling_asset_id=, /uplift-records?fueling_order_id=, /spill-incidents?fuel_farm_id= and /invoices?airline_account_id= cover the rest; no FK is write-only"
        - name: filter_by_a_nullable_fk
          corner: "GET /fueling-orders?fueling_asset_id={id} for an order that has been unassigned"
          expected_behavior: "the unassigned order is absent from the result because its fueling_asset_id is null again; the filter reflects live state rather than assignment history"
        - name: filter_by_status_combines_with_the_fk_filter
          corner: "GET /uplift-records?fueling_order_id={id}&status=VOIDED"
          expected_behavior: "only the voided tickets of that order are returned; filters combine with AND and an unknown status value returns 422 ERR_FIELD_OUT_OF_RANGE"
    - target: "detail GET endpoints and derived fields"
      cases:
        - name: derived_fields_appear_on_the_detail_read
          corner: "GET /storage-tanks/{id} immediately after a receipt release"
          expected_behavior: "book_volume_liters, reserved_volume_liters and available_volume_liters are all present and already reflect the release; the consistency model is immediate, so no recompute endpoint exists"
        - name: farm_detail_exposes_posture_and_permit_utilisation
          corner: "GET /fuel-farms/{id} after a partial day of throughput"
          expected_behavior: "posture, in_service_asset_count and active_permit_throughput_used_liters are all present on the farm payload, which is what makes the 90-percent restriction observable without reading the permit"
        - name: invoice_detail_lists_its_swept_tickets
          corner: "GET /invoices/{id} after issue"
          expected_behavior: "the invoice carries subtotal_cents, volume_rebate_cents, admin_fee_cents and total_cents, and GET /uplift-records?invoice_id={id} returns exactly the swept tickets in BILLED status"
    - target: "POST status codes"
      cases:
        - name: creates_are_201_and_actions_are_200
          corner: "the full lifecycle of one order is walked end to end"
          expected_behavior: "POST /fueling-orders and POST /fueling-orders/{id}/uplift-records return 201 while authorize, assign, unassign, start, complete, abort and cancel all return 200; the sub-resource creates POST /fuel-receipts/{id}/samples and POST /storage-tanks/{id}/samples are 201 because they mint a QualitySample row"
        - name: action_endpoints_return_the_mutated_parent
          corner: "POST /fueling-orders/{id}/authorize is inspected"
          expected_behavior: "the response data is the FuelingOrder with its incremented version, which is exactly what the client captures for the next OCC-guarded uplift; actions never return a bare acknowledgement"
        - name: no_endpoint_is_idempotent_by_replay
          corner: "the same authorize request is replayed"
          expected_behavior: "409 ERR_INVALID_ORDER_STATE on the second call; there is no idempotency key and a replay is a state error, not a silent success"
    - target: "request envelope and headers"
      cases:
        - name: every_response_carries_the_meta_block
          corner: "a 201, a 200 and a 409 response are compared"
          expected_behavior: "all three carry meta.api_request_id and meta.api_request_timestamp; the success bodies use response_type object or array and the failure body uses response_type error with data.error_id and data.message"
        - name: meta_timestamp_follows_the_logical_clock
          corner: "the clock is set to 2026-08-10T06:00:00Z and any request is made"
          expected_behavior: "meta.api_request_timestamp reflects the logical clock, so a test can assert it exactly; using the wall clock here would make every response non-deterministic"
  errors:
    - target: "error id and status pairing"
      cases:
        - name: every_error_id_maps_to_exactly_one_status
          corner: "the whole ladder is exercised"
          expected_behavior: "each of the 48 ids always returns the same status: 401 once, 403 three times, 402 once for ERR_CREDIT_LIMIT_EXCEEDED, 404 twice, 412 twice, 400 once, and the rest split between 409 conflicts and 422 unprocessable payloads"
        - name: message_text_is_never_asserted
          corner: "two implementations word the same failure differently"
          expected_behavior: "only data.error_id and the status are contractual; message is free text and must never be relied on to distinguish two failures, which is why near-duplicate conditions were given distinct ids"
        - name: no_error_leaks_a_stack_trace_or_a_second_id
          corner: "a request fails several checks at once"
          expected_behavior: "exactly one error_id is returned, the highest-priority one; there is no errors array and no field-level detail map"
  rbac:
    - target: "role coverage"
      cases:
        - name: every_role_owns_at_least_one_exclusive_operation
          corner: "the seven roles are each exercised on their exclusive surface"
          expected_behavior: "ConsortiumAdmin owns farm and account setup, FarmOperator the tank service and receipt recording, QualityInspector sampling and verdicts, IntoPlaneAgent order assignment and uplifts, AirlineRep authorization requests and disputes, EnvironmentalOfficer permits and spills, BillingClerk invoices and payments; no role is a superset of another"
        - name: no_role_can_perform_both_halves_of_a_segregated_pair
          corner: "a QualityInspector attempts to record the receipt they will later release"
          expected_behavior: "403 ERR_ROLE_NOT_PERMITTED on the receipt creation because recording is a FarmOperator operation; role separation and user-level segregation of duties are two different mechanisms and both are enforced"
        - name: airline_rep_is_entity_backed
          corner: "an AirlineRep whose X-User-ID is not any AirlineAccount id acts on an order"
          expected_behavior: "403 ERR_ACCOUNT_OWNERSHIP_REQUIRED; the header must resolve to an existing account row, so the role cannot be used as an anonymous customer role"
        - name: consortium_admin_is_not_an_operational_override
          corner: "a ConsortiumAdmin attempts POST /fueling-orders/{id}/uplift-records and POST /fuel-receipts/{id}/verdict"
          expected_behavior: "403 ERR_ROLE_NOT_PERMITTED for both; there is no superuser, so no test can shortcut the segregated flows through the admin role"
  complexity_layers:
    - target: "optimistic_concurrency"
      cases:
        - name: both_occ_rules_are_independently_reachable
          corner: "an uplift is posted with a stale expected_fueling_order_version and an invoice is created with a stale expected_airline_account_version"
          expected_behavior: "412 ERR_STALE_ORDER_VERSION and 412 ERR_STALE_ACCOUNT_VERSION respectively; the two rules guard different parents and their error ids are never interchanged"
        - name: occ_is_the_only_concurrency_mechanism
          corner: "any other endpoint is inspected for a version guard"
          expected_behavior: "no other endpoint accepts an expected_*_version field; conflicts elsewhere are expressed as state errors, and no request is ever described as running at the same time as another"
        - name: account_version_bumps_on_pricing_relevant_changes
          corner: "an account's credit limit is adjusted between capturing its version and creating an invoice"
          expected_behavior: "412 ERR_STALE_ACCOUNT_VERSION; the guard exists precisely so a sweep cannot be built on a stale credit or contract picture"
    - target: "cascading_side_effects"
      cases:
        - name: cascade_is_atomic_with_its_trigger
          corner: "the quarantine verdict response is inspected before any follow-up read"
          expected_behavior: "the triggering response already reflects the tank quarantine; the dependent order, uplift and authorization changes are observable on their own reads immediately afterwards with no background job and no eventual convergence"
        - name: cascade_does_not_touch_terminal_children
          corner: "a farm is frozen while one of its orders is already COMPLETED and one authorization already REDEEMED"
          expected_behavior: "the COMPLETED order and the REDEEMED authorization are untouched; the cascade skips terminal rows rather than raising ERR_ALREADY_TERMINAL and aborting the whole freeze"
        - name: cascade_is_idempotent_under_repetition
          corner: "a second spill is escalated at an already FROZEN farm"
          expected_behavior: "the posture stays FROZEN, no order changes state twice and no authorization is voided twice; containing only one of the two spills leaves the farm FROZEN because the other is still open"
      excluded_because: "the two depth-3 cascades themselves are pinned by scaffold_difficulty_design instances receipt_quarantine_verdict_depth3_quality_cascade and spill_escalation_depth3_environmental_cascade"
    - target: "dual_variant_calculation"
      cases:
        - name: both_variants_are_persisted_side_by_side
          corner: "a TRUCK receipt and a reconciliation run are read back"
          expected_behavior: "the receipt exposes governing_gross_liters and advisory_gross_liters together with net_volume_liters and advisory_net_volume_liters, and the run exposes both variance_pct_throughput_basis and variance_pct_opening_stock_basis; the advisory figure is never the one that gates a decision"
        - name: only_the_governing_variant_moves_money_or_fuel
          corner: "a receipt whose advisory net exceeds its governing net by 400 liters is released"
          expected_behavior: "the tank's book volume rises by the governing net only; the advisory figure is reportable evidence of a meter-versus-gauge discrepancy and has no ledger effect"
    - target: "ops_run_checkpoint"
      cases:
        - name: a_run_is_the_only_way_to_correct_the_ledger
          corner: "no endpoint offers a direct adjustment to book_volume_liters"
          expected_behavior: "the only way to change a tank's book volume outside receipts and uplifts is a POSTED ReconciliationRun; the checkpoint is therefore auditable and its adjustment is attributable to a period"
        - name: overlapping_run_periods_are_permitted_but_double_count
          corner: "two runs are created for overlapping periods and both are posted"
          expected_behavior: "both post and each applies its own per-tank adjustment, so the second run measures against the book already corrected by the first and normally computes a near-zero variance; no ERR_DUPLICATE_KEY guards period overlap"
        - name: run_period_must_be_well_ordered
          corner: "period_end_utc precedes period_start_utc"
          expected_behavior: "422 ERR_FIELD_OUT_OF_RANGE at creation, before the elapsed-period check could report ERR_PERIOD_NOT_ELAPSED"
    - target: "graph topology"
      cases:
        - name: an_uplift_reaches_its_farm_by_two_distinct_paths
          corner: "an uplift's farm is resolved through its order's storage tank and through its order's fueling asset"
          expected_behavior: "both paths reach the same FuelFarm; the diamond is what makes ERR_CROSS_FARM_REFERENCE necessary, because the two paths could otherwise disagree"
        - name: the_self_referencing_invoice_edge_terminates
          corner: "an invoice replaces an invoice that itself replaced an earlier one"
          expected_behavior: "the chain is walkable and finite, and no invoice may name itself in replaces_invoice_id, which returns 422 ERR_FIELD_OUT_OF_RANGE"
        - name: polymorphic_sample_parents_do_not_create_a_cycle
          corner: "a sample drawn from an asset is traced to its farm"
          expected_behavior: "the asset path reaches the farm without passing through a tank; the three parent slots are alternative edges and never populated together"
    - target: "parallel state machine shape"
      cases:
        - name: the_tank_carries_two_independent_status_dimensions
          corner: "the four reachable combinations of service_status and quality_status are enumerated"
          expected_behavior: "IN_SERVICE with ON_TEST, RELEASED or QUARANTINED and ISOLATED with the same three are all reachable; only the pair of transitions relevant to the requested dimension is validated on each call, and the two dimensions never share an error id"
        - name: an_operation_may_require_agreement_across_both_dimensions
          corner: "an order is authorized against a tank that is IN_SERVICE but QUARANTINED, and against one that is RELEASED but ISOLATED"
          expected_behavior: "the first returns 409 ERR_TANK_QUARANTINED and the second 409 ERR_INVALID_TANK_STATE; fuel may only be drawn when both dimensions agree"
      excluded_because: "the non-monotonic re-entry into ISOLATED -> IN_SERVICE that depends on the other dimension is pinned by scaffold_difficulty_design instance tank_isolated_to_in_service_blocked_on_second_visit_by_quality_dimension"
    - target: "segregation_of_duties role model"
      cases:
        - name: the_sample_release_pair_is_the_only_segregated_pair
          corner: "other two-step flows such as measure-then-post and issue-then-pay are performed by one user"
          expected_behavior: "they succeed; segregation is scoped to the receipt sampling and release pair, so a blanket same-user prohibition would be wrong"
        - name: segregation_survives_a_retest_round
          corner: "inspector A samples, the receipt is quarantined, inspector A re-samples and inspector B releases"
          expected_behavior: "200; the check compares against the sampled_by_user_id of the latest sample round, so B remains eligible and A does not"
  consistency_model:
    - target: "immediate consistency"
      cases:
        - name: no_endpoint_returns_a_pending_or_accepted_status
          corner: "the whole endpoint surface is inspected for 202 responses"
          expected_behavior: "there is none; every derived value, cascade and posture recompute is complete when the triggering response is returned"
        - name: derived_values_are_recomputed_not_cached
          corner: "a tank's book volume is read, an unrelated reconciliation run is posted for another tank, and the first tank is read again"
          expected_behavior: "the first tank's figures are unchanged; recomputation is a full re-derivation from the source rows scoped to the entity being read, so it neither drifts nor bleeds across siblings"
        - name: the_logical_clock_is_the_only_source_of_time_ordering
          corner: "two rows are created without advancing the clock between them"
          expected_behavior: "they share an identical created_at; every tie-break rule in the design therefore names an explicit secondary key such as created_at ASC then posting order, and no rule depends on wall-clock resolution or on id ordering"
