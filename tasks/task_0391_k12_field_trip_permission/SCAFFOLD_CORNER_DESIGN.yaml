        distinguishing_aspect: "Locking with expected_trip_version one behind the live FieldTrip.version (a sign bumped it) → ERR_STALE_TRIP_VERSION (412); trip stays APPROVED."
        test_recipe:
          setup: ["Trip APPROVED, lockable (1 SIGNED slip, 1 CLEARED chaperone, CONFIRMED transport >= 1 seat). Capture version BEFORE the last sign so it is stale."]
          setup_api_calls:
            - call: "POST /guardians"
