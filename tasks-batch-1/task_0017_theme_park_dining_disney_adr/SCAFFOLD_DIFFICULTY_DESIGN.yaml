            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_a_id}", restaurant_id: "${r_id}", park_session_id: "${ps_a_id}", dining_plan_id: "${dp_a_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 2 }
              as: Guest
