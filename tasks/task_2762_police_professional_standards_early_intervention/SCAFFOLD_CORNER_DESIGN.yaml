      - name: investigation_calls_out_of_order_are_refused_by_the_state_ladder
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Investigation.transitions
          - validations[priority=8]
          - endpoints["POST /investigations/{id}/tolling"]
          - endpoints["POST /investigations/{id}/findings"]
          - endpoints["POST /investigations/{id}/close"]
        distinguishing_aspect: |
          From UNASSIGNED the Investigation machine declares exactly one outgoing trigger, the
          assignment; from ASSIGNED it declares reassignment, interview scheduling, tolling
          RESUME and the withdrawal cascade. Every other trigger aimed at those two states is
          not in the transition list and must return ERR_INVESTIGATION_STATE_INVALID (409) with
          no ledger movement — including findings submitted by the correctly assigned
          investigator, whose identity check at priority 6 passes before the state check fails.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit holds Commander Reyes and Investigator Ahn; one PATROL_DIVISION unit holds Sergeant Doyle and Officer Vance."
            - "A CLASS_II complaint with one allegation against Officer Vance is UNDER_INVESTIGATION and its Investigation is UNASSIGNED."
