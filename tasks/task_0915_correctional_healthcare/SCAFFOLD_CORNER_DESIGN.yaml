            - "Inmate.${inm}.custody_status == DECEASED"

  - section: calculations
    instances:

      - name: sick_call_upgrade_anchors_on_original_submission
        claim_type: Variant Selection
        grounds:
          - calculations.sick_call_response_deadline
          - entities.SickCallRequest.fields.deadline_anchor_at
        distinguishing_aspect: "An upgrade from ROUTINE to URGENT one day after submission re-measures from submitted_at, so response_deadline_at becomes 2026-05-02T00:00:00Z - 24 hours after submission, not 24 hours after the re-triage."
        test_recipe:
          setup:
            - "A sick-call request submitted at 2026-05-01T00:00:00Z and triaged ROUTINE at the same instant, giving response_deadline_at 2026-05-04T00:00:00Z."
            - "Clock then advanced to 2026-05-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2220", full_name: "Nia Prasad", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /sick-call-requests"
              payload: { inmate_id: "${inm}", complaint_text: "abdominal pain", encounter_type: "SICK_CALL" }
              as: Inmate
              as_user_id: "${inm}"
              captures: { sc: $.data.id }
            - call: "POST /sick-call-requests/${sc}/triage"
              payload: { acuity: "ROUTINE" }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /sick-call-requests/${sc}/triage"
              payload: { acuity: "URGENT" }
              as: Nurse
              as_user_id: "u-nurse-1"
          assert:
            - "SickCallRequest.${sc}.acuity == URGENT"
            - "SickCallRequest.${sc}.retriage_count == 1"
            - "SickCallRequest.${sc}.deadline_anchor_at == 2026-05-01T00:00:00.000Z"
            - "SickCallRequest.${sc}.response_deadline_at == 2026-05-02T00:00:00.000Z"
            - "SickCallRequest.${sc}.sla_breached == false, because the clock equals the deadline and breach requires strictly after"

      - name: sick_call_downgrade_anchors_on_retriage_instant
        claim_type: Variant Divergence
        grounds:
          - calculations.sick_call_response_deadline
          - entities.SickCallRequest.fields.deadline_anchor_at
        distinguishing_aspect: "A downgrade from URGENT to ROUTINE at 2026-05-02T00:00:00Z re-measures from the re-triage instant, giving 2026-05-05T00:00:00Z rather than the 2026-05-04T00:00:00Z an original-submission anchor would produce."
        test_recipe:
          setup:
            - "A sick-call request submitted and triaged URGENT at 2026-05-01T00:00:00Z, giving response_deadline_at 2026-05-02T00:00:00Z."
            - "Clock then advanced to 2026-05-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2230", full_name: "Oz Ramirez", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /sick-call-requests"
              payload: { inmate_id: "${inm}", complaint_text: "sore throat", encounter_type: "SICK_CALL" }
              as: Inmate
              as_user_id: "${inm}"
              captures: { sc: $.data.id }
            - call: "POST /sick-call-requests/${sc}/triage"
              payload: { acuity: "URGENT" }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /sick-call-requests/${sc}/triage"
              payload: { acuity: "ROUTINE" }
              as: Nurse
              as_user_id: "u-nurse-1"
          assert:
            - "SickCallRequest.${sc}.deadline_anchor_at == 2026-05-02T00:00:00.000Z"
            - "SickCallRequest.${sc}.response_deadline_at == 2026-05-05T00:00:00.000Z"
            - "response_deadline_at != 2026-05-04T00:00:00.000Z, which the original-submission anchor would have produced"

      - name: sick_call_sla_breach_strict_after_deadline
        claim_type: Correct Result
        grounds:
          - calculations.sick_call_sla_breach
          - entities.SickCallRequest.fields.sla_breached
        distinguishing_aspect: "For an EMERGENT request submitted at 2026-05-01T00:00:00Z the deadline is 2026-05-01T01:00:00Z; sla_breached is false at exactly that instant and true one second later."
        test_recipe:
          setup:
            - "A sick-call request submitted and triaged EMERGENT at 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2240", full_name: "Pia Sadiq", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /sick-call-requests"
              payload: { inmate_id: "${inm}", complaint_text: "shortness of breath", encounter_type: "SICK_CALL" }
              as: Inmate
              as_user_id: "${inm}"
              captures: { sc: $.data.id }
            - call: "POST /sick-call-requests/${sc}/triage"
              payload: { acuity: "EMERGENT" }
              as: Nurse
              as_user_id: "u-nurse-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T01:00:00Z" }
              as: HealthServicesAdmin
            - call: "GET /sick-call-requests/${sc}"
              payload: {}
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T01:00:01Z" }
              as: HealthServicesAdmin
            - call: "GET /sick-call-requests/${sc}"
              payload: {}
              as: Nurse
              as_user_id: "u-nurse-1"
          assert:
            - "SickCallRequest.${sc}.response_deadline_at == 2026-05-01T01:00:00.000Z"
            - "The second trigger call returns sla_breached == false"
            - "The fourth trigger call returns sla_breached == true"

      - name: ur_retrospective_flat_turnaround_variant
        claim_type: Variant Divergence
        grounds:
          - calculations.ur_turnaround_deadline
          - entities.UtilizationReview.fields.retrospective
        distinguishing_aspect: "Two EMERGENT referrals opened at the same instant get turnaround_deadline_at 2026-05-01T04:00:00Z when prospective and 2026-05-31T00:00:00Z when retrospective - a 716-hour divergence from identical urgency."
        test_recipe:
          setup:
            - "One inmate with two EMERGENT referrals in REQUESTED at 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
