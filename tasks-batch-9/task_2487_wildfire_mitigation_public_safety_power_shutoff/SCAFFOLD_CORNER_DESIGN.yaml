# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2487 — Wildfire Mitigation & Public Safety Power Shutoff
#
# Breadth walk of the claim-extraction guide's nine sections over §1.1–§1.7.
# Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs with no test_recipe.
#
# Shared fixture calls are declared once as YAML anchors and reused by alias:
#   &k_clock_*   logical-clock sets            &k_alpha/&k_bravo/&k_charlie
#   &k_ws_*      ALPHA's two weather stations  &k_obs_*   the four observations
#   &k_fpi15     ALPHA's FORECAST index for 2026-08-15 (fpi_score 85.93, R5)
#   &k_cust_*    the five F-CHAIN customers   &k_ev1/&k_scope  event EV-1
#   &k_*         the full arm -> de-energize -> patrol -> restore -> close cycle
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: circuit_create_applies_every_declared_default_and_system_field
        claim_type: Creation
        grounds:
          - entities.Circuit
          - endpoints.POST_/circuits
        distinguishing_aspect: "A circuit posted with only its five required fields comes back 201 carrying every default (inspection_cycle_months 36, fast_trip_enabled false), every computed counter at zero, energization_state ENERGIZED, risk_posture NORMAL and version 1 — none of which the client supplied."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - &k_clock_default
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GridPlanner
          trigger:
            - call: "POST /circuits"
              payload: { circuit_code: "MINIMAL-1", district_code: "D-NORTH", hftd_tier: "TIER_1", overhead_miles: 3.0, equipment_condition_index: 90 }
              as: GridPlanner
              captures: { min_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Circuit.${min_id}.inspection_cycle_months == 36 and fast_trip_enabled == false"
            - "Circuit.${min_id}.last_inspection_completed_at is null and upstream_circuit_id is null"
            - "Circuit.${min_id}.covered_conductor_miles == 0.0, underground_miles == 0.0, hardened_fraction == 0.0000"
            - "Circuit.${min_id}.customer_count == 0, medical_baseline_count == 0, critical_facility_count == 0"
            - "Circuit.${min_id}.energization_state == ENERGIZED and risk_posture == NORMAL"
            - "Circuit.${min_id}.latest_forecast_fpi_score is null and latest_forecast_fpi_tier is null"
            - "Circuit.${min_id}.version == 1 with non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: circuit_get_round_trips_every_stored_input_field
        claim_type: Retrieval
        grounds:
          - entities.Circuit
          - endpoints.GET_/circuits/{id}
        distinguishing_aspect: "Every client-supplied attribute of circuit ALPHA — including the 36-month cycle, the 2026-05-01 inspection stamp and fast_trip_enabled false — round-trips through GET byte-for-byte."
        test_recipe:
          setup:
            - "Circuit ALPHA created with the full attribute set."
          setup_api_calls:
            - *k_clock_default
            - &k_alpha
              call: "POST /circuits"
              payload: { circuit_code: "ALPHA", district_code: "D-NORTH", hftd_tier: "TIER_3", overhead_miles: 7.0, equipment_condition_index: 55, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { alpha_id: $.data.id }
          trigger:
            - call: "GET /circuits/${alpha_id}"
              payload: {}
              as: RegulatoryReviewer
          assert:
            - "the response status is 200"
            - "Circuit.${alpha_id}.circuit_code == \"ALPHA\" and district_code == \"D-NORTH\""
            - "Circuit.${alpha_id}.hftd_tier == TIER_3 and overhead_miles == 7.0"
            - "Circuit.${alpha_id}.equipment_condition_index == 55 and inspection_cycle_months == 36"
            - "Circuit.${alpha_id}.last_inspection_completed_at == 2026-05-01T00:00:00Z"
            - "Circuit.${alpha_id}.fast_trip_enabled == false"

      - name: circuits_list_paginates_and_filters_by_district_and_energization_state
        claim_type: Listing
        grounds:
          - endpoints.GET_/circuits
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With the three-circuit feeder chain on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, offset=2 returns the last row with has_more false, and district_code / energization_state filters narrow total_count to the filtered set rather than the page."
        test_recipe:
          setup:
            - "Circuits ALPHA -> BRAVO -> CHARLIE all in district D-NORTH and all ENERGIZED."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - &k_bravo
              call: "POST /circuits"
              payload: { circuit_code: "BRAVO", district_code: "D-NORTH", hftd_tier: "TIER_2", overhead_miles: 6.0, equipment_condition_index: 70, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", upstream_circuit_id: "${alpha_id}", fast_trip_enabled: false }
              as: GridPlanner
              captures: { bravo_id: $.data.id }
            - &k_charlie
              call: "POST /circuits"
              payload: { circuit_code: "CHARLIE", district_code: "D-NORTH", hftd_tier: "TIER_2", overhead_miles: 5.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", upstream_circuit_id: "${bravo_id}", fast_trip_enabled: false }
              as: GridPlanner
              captures: { charlie_id: $.data.id }
          trigger:
            - call: "GET /circuits"
              payload: { limit: 2, offset: 0 }
              as: MeteorologyAnalyst
            - call: "GET /circuits"
              payload: { limit: 2, offset: 2 }
              as: MeteorologyAnalyst
            - call: "GET /circuits"
              payload: { hftd_tier: "TIER_2" }
              as: MeteorologyAnalyst
            - call: "GET /circuits"
              payload: { energization_state: "ENERGIZED", district_code: "D-NORTH" }
              as: MeteorologyAnalyst
          assert:
            - "the first page carries 2 rows with total_count 3, limit 2, offset 0 and has_more true"
            - "the second page carries 1 row with total_count 3, offset 2 and has_more false"
            - "the hftd_tier=TIER_2 page carries 2 rows with total_count 2 and has_more false"
            - "the ENERGIZED + D-NORTH page carries 3 rows with total_count 3"
            - "an unfiltered GET /circuits with no query parameters applies the declared defaults limit 10 and offset 0"
            - "response_type is array on every one of these reads"

      - name: circuit_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/circuits/{id}
          - errors[ERR_CIRCUIT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated UUID in the circuit path yields ERR_CIRCUIT_NOT_FOUND with HTTP 404 and the error envelope, not an empty 200 body."
        test_recipe:
          setup:
            - "Circuit ALPHA exists so the collection is non-empty."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
          trigger:
            - call: "GET /circuits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GridPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_CIRCUIT_NOT_FOUND"
            - "response_type is error and data.message is a non-empty string"
            - "meta.api_request_id is still present on the error envelope"

      - name: circuit_create_missing_required_overhead_miles_rejected
        claim_type: Required Fields
        grounds:
          - entities.Circuit.fields.overhead_miles
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "overhead_miles has source input and no default, so omitting it is ERR_INVALID_REQUEST (400) rather than a silent zero — which matters because it is the denominator of hardened_fraction."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *k_clock_default
          trigger:
            - call: "POST /circuits"
              payload: { circuit_code: "NO-MILES", district_code: "D-NORTH", hftd_tier: "TIER_2", equipment_condition_index: 80 }
              as: GridPlanner
              captures: { err: $.data.error_id }
            - call: "POST /circuits"
              payload: { circuit_code: "ZERO-MILES", district_code: "D-NORTH", hftd_tier: "TIER_2", overhead_miles: 0.0, equipment_condition_index: 80 }
              as: GridPlanner
              captures: { err2: $.data.error_id }
          assert:
            - "both calls return HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no Circuit row is created — GET /circuits returns total_count 0"

      - name: customer_create_applies_medical_baseline_and_accessibility_defaults
        claim_type: Defaults
        grounds:
          - entities.Customer.fields.medical_baseline
          - entities.Customer.fields.accessibility_needs
          - calculations.customer_notification_tier
        distinguishing_aspect: "Omitting medical_baseline and accessibility_needs yields false and the empty array, which in turn makes notification_tier TIER_C_STANDARD — the default cascades into a computed field in the same response."
        test_recipe:
          setup:
            - "Circuit ALPHA exists."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
          trigger:
            - call: "POST /customers"
              payload: { account_number: "ACC-DEF", circuit_id: "${alpha_id}", customer_class: "RESIDENTIAL", preferred_language: "EN", notification_channels: ["SMS"], address_zone_code: "Z9" }
              as: GridPlanner
              captures: { cust_def_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Customer.${cust_def_id}.medical_baseline == false"
            - "Customer.${cust_def_id}.accessibility_needs == []"
            - "Customer.${cust_def_id}.notification_tier == TIER_C_STANDARD"
            - "Circuit.${alpha_id}.customer_count == 1 and medical_baseline_count == 0 and critical_facility_count == 0"

      - name: weather_station_create_defaults_telemetry_status_and_observation_counters
        claim_type: Defaults
        grounds:
          - entities.WeatherStation.fields.telemetry_status
          - entities.WeatherStation.fields.observation_count
          - entities.WeatherStation.fields.last_observation_at
        distinguishing_aspect: "A station posted without telemetry_status defaults to ONLINE and starts with observation_count 0 and last_observation_at null; both counters are computed, so they must move only when observations arrive."
        test_recipe:
          setup:
            - "Circuit ALPHA exists."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
          trigger:
            - call: "POST /weather-stations"
              payload: { station_code: "WS-DEF", circuit_id: "${alpha_id}", elevation_ft: 1500, representativeness_weight: 0.25 }
              as: GridPlanner
              captures: { ws_def_id: $.data.id }
          assert:
            - "the response status is 201"
            - "WeatherStation.${ws_def_id}.telemetry_status == ONLINE"
            - "WeatherStation.${ws_def_id}.observation_count == 0 and last_observation_at is null"
            - "WeatherStation.${ws_def_id}.representativeness_weight == 0.25 and version == 1"

      - name: circuit_customer_counters_derive_from_customer_rows
        claim_type: Computed Fields
        grounds:
          - entities.Circuit.fields.customer_count
          - entities.Circuit.fields.medical_baseline_count
          - entities.Circuit.fields.critical_facility_count
        distinguishing_aspect: "The three Circuit customer counters are pure derivations over Customer rows: after the five F-CHAIN accounts are booked ALPHA reads 3 / 1 / 1, BRAVO 1 / 0 / 0 and CHARLIE 1 / 0 / 0, and the CRITICAL_FACILITY account is counted in critical_facility_count without also being counted in medical_baseline_count."
        test_recipe:
          setup:
            - "Circuits ALPHA -> BRAVO -> CHARLIE exist with no customers."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
            - &k_cust_a1
              call: "POST /customers"
              payload: { account_number: "ACC-A1", circuit_id: "${alpha_id}", customer_class: "RESIDENTIAL", medical_baseline: true, preferred_language: "ES", notification_channels: ["SMS", "VOICE"], accessibility_needs: [], address_zone_code: "Z1" }
              as: GridPlanner
              captures: { cust_a1_id: $.data.id }
            - &k_cust_a2
              call: "POST /customers"
              payload: { account_number: "ACC-A2", circuit_id: "${alpha_id}", customer_class: "CRITICAL_FACILITY", medical_baseline: false, preferred_language: "EN", notification_channels: ["VOICE", "EMAIL"], accessibility_needs: [], address_zone_code: "Z1" }
              as: GridPlanner
              captures: { cust_a2_id: $.data.id }
            - &k_cust_a3
              call: "POST /customers"
              payload: { account_number: "ACC-A3", circuit_id: "${alpha_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "ZH", notification_channels: ["SMS"], accessibility_needs: ["AUDIO", "TTY"], address_zone_code: "Z2" }
              as: GridPlanner
              captures: { cust_a3_id: $.data.id }
            - &k_cust_b1
              call: "POST /customers"
              payload: { account_number: "ACC-B1", circuit_id: "${bravo_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "EN", notification_channels: ["SMS"], accessibility_needs: [], address_zone_code: "Z3" }
              as: GridPlanner
              captures: { cust_b1_id: $.data.id }
            - &k_cust_c1
              call: "POST /customers"
              payload: { account_number: "ACC-C1", circuit_id: "${charlie_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "EN", notification_channels: ["EMAIL"], accessibility_needs: [], address_zone_code: "Z4" }
              as: GridPlanner
              captures: { cust_c1_id: $.data.id }
          trigger:
            - call: "GET /circuits/${alpha_id}"
              payload: {}
              as: PSPSDutyOfficer
            - call: "GET /circuits/${alpha_id}/customers"
              payload: { medical_baseline: true }
              as: CommunityLiaison
          assert:
            - "Circuit.${alpha_id}.customer_count == 3, medical_baseline_count == 1, critical_facility_count == 1"
            - "Circuit.${bravo_id}.customer_count == 1, medical_baseline_count == 0, critical_facility_count == 0"
            - "Circuit.${charlie_id}.customer_count == 1, medical_baseline_count == 0, critical_facility_count == 0"
            - "GET /circuits/${alpha_id}/customers?medical_baseline=true returns exactly the ACC-A1 row with total_count 1"
            - "Customer.${cust_a2_id}.notification_tier == TIER_A_CRITICAL and Customer.${cust_a1_id}.notification_tier == TIER_B_MEDICAL"

      - name: notification_record_fields_are_entirely_server_derived
        claim_type: Computed Fields
        grounds:
          - entities.NotificationRecord
          - calculations.notification_routing
          - endpoints.GET_/notification-records
        distinguishing_aspect: "NotificationRecord has no client-writable field beyond its two foreign keys: attempt_order, language_used, channel_used, accessibility_format and delivery_status are all written by the dispatch routine, and there is no POST /notification-records in §1.5 at all."
        test_recipe:
          setup:
            - "The F-CHAIN with its five customers, ALPHA's R5 FORECAST index for 2026-08-15, event EV-1 scoped over all three circuits, and its ADVANCE_48H batch dispatched at 2026-08-13T18:00:00Z."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
            - &k_ws_a1
              call: "POST /weather-stations"
              payload: { station_code: "WS-A1", circuit_id: "${alpha_id}", elevation_ft: 3200, representativeness_weight: 0.70, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_a1_id: $.data.id }
            - &k_ws_a2
              call: "POST /weather-stations"
              payload: { station_code: "WS-A2", circuit_id: "${alpha_id}", elevation_ft: 2600, representativeness_weight: 0.45, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_a2_id: $.data.id }
            - &k_obs_a1a
              call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a1_id}", observed_at: "2026-08-14T18:00:00Z", wind_gust_mph: 62.0, relative_humidity_pct: 22.0, temperature_f: 104.0, dead_fuel_moisture_pct: 8.0 }
              as: MeteorologyAnalyst
            - &k_obs_a1b
              call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a1_id}", observed_at: "2026-08-15T15:00:00Z", wind_gust_mph: 57.0, relative_humidity_pct: 28.0, temperature_f: 99.0, dead_fuel_moisture_pct: 9.5 }
              as: MeteorologyAnalyst
            - &k_obs_a2a
              call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a2_id}", observed_at: "2026-08-14T17:00:00Z", wind_gust_mph: 48.0, relative_humidity_pct: 26.0, temperature_f: 101.0, dead_fuel_moisture_pct: 9.0 }
              as: MeteorologyAnalyst
            - &k_obs_a2b
              call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a2_id}", observed_at: "2026-08-15T16:00:00Z", wind_gust_mph: 44.0, relative_humidity_pct: 31.0, temperature_f: 96.0, dead_fuel_moisture_pct: 10.0 }
              as: MeteorologyAnalyst
            - &k_fpi15
              call: "POST /fire-potential-indices"
              payload: { circuit_id: "${alpha_id}", forecast_date: "2026-08-15", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_fc_id: $.data.id }
            - *k_cust_a1
            - *k_cust_a2
            - *k_cust_a3
            - *k_cust_b1
            - *k_cust_c1
            - &k_ev1
              call: "POST /psps-events"
              payload: { event_code: "EV-1", trigger_fire_potential_index_id: "${fpi_fc_id}", forecast_onset_at: "2026-08-15T18:00:00Z", forecast_all_clear_at: "2026-08-16T18:00:00Z" }
              as: PSPSDutyOfficer
              captures: { ev1_id: $.data.id, ev1_v0: $.data.version }
            - &k_scope
              call: "POST /psps-events/${ev1_id}/scope"
              payload: { expected_psps_event_version: "${ev1_v0}" }
              as: PSPSDutyOfficer
            - &k_batch_adv
              call: "POST /notification-batches"
              payload: { psps_event_id: "${ev1_id}", stage: "ADVANCE_48H", scheduled_send_at: "2026-08-13T18:00:00Z" }
              as: CommunityLiaison
              captures: { batch_adv_id: $.data.id }
            - &k_clock_0813
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T18:00:00Z" }
              as: PSPSDutyOfficer
            - &k_disp_adv
              call: "POST /notification-batches/${batch_adv_id}/dispatch"
              payload: {}
              as: CommunityLiaison
          trigger:
            - call: "GET /notification-records"
              payload: { notification_batch_id: "${batch_adv_id}" }
              as: RegulatoryReviewer
          assert:
            - "the read returns 5 rows with total_count 5"
            - "every row carries a non-null attempt_order, language_used, accessibility_format and delivery_status"
            - "attempt_order values are exactly 1..5 with no gaps and no duplicates"
            - "no NotificationRecord row exposes a version field (its entity declares common_fields false)"
            - "§1.5 declares no POST, PUT, PATCH or DELETE endpoint on /notification-records — records only ever appear as a dispatch side effect"

      - name: immutable_entities_expose_no_version_and_no_mutating_endpoint
        claim_type: Immutability
        grounds:
          - entities.WeatherObservation
          - entities.FirePotentialIndex
          - entities.NotificationRecord
          - entities.DamageFinding
        distinguishing_aspect: "The four common_fields:false entities are append-only records of what was true at an instant: none carries created_at/updated_at/version, and §1.5 offers no PUT, PATCH or DELETE for any of them — a re-run of the same computation produces a NEW FirePotentialIndex row rather than mutating the old one."
        test_recipe:
          setup:
            - "Circuit ALPHA with its two stations and four observations; one FORECAST index already computed for 2026-08-15."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_ws_a1
            - *k_ws_a2
            - *k_obs_a1a
            - *k_obs_a1b
            - *k_obs_a2a
            - *k_obs_a2b
            - *k_fpi15
          trigger:
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${alpha_id}", forecast_date: "2026-08-15", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_again_id: $.data.id }
            - call: "GET /circuits/${alpha_id}/fire-potential-indices"
              payload: { computation_variant: "FORECAST", forecast_date: "2026-08-15" }
              as: AssetInspector
            - call: "GET /weather-stations/${ws_a1_id}/observations"
              payload: {}
              as: AssetInspector
          assert:
            - "${fpi_again_id} != ${fpi_fc_id} — recomputation appends a second row instead of overwriting the first"
            - "the FORECAST list for 2026-08-15 returns 2 rows, both with fpi_score 85.93 and fpi_tier R5"
            - "no FirePotentialIndex row carries version, created_at or updated_at fields"
            - "no WeatherObservation row carries version, created_at or updated_at fields"
            - "the observation list for WS-A1 returns 2 rows with total_count 2"
            - "§1.5 declares no PUT, PATCH or DELETE method on any path — every entity is create-and-transition only"

      - name: weather_station_with_unknown_circuit_parent_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.WeatherStation.fields.circuit_id
          - validations[priority=6]
          - errors[ERR_CIRCUIT_NOT_FOUND]
        distinguishing_aspect: "circuit_id is a body foreign key, so an unallocated UUID is caught by the priority-6 body-FK gate as ERR_CIRCUIT_NOT_FOUND (404) — a 404 for a body field rather than a 400, and distinct from the priority-5 schema gate."
        test_recipe:
          setup:
            - "Circuit ALPHA exists so the circuits table is non-empty."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
          trigger:
            - call: "POST /weather-stations"
              payload: { station_code: "WS-ORPHAN", circuit_id: "00000000-0000-4000-8000-000000000000", elevation_ft: 1200, representativeness_weight: 0.5 }
              as: MeteorologyAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_CIRCUIT_NOT_FOUND"
            - "GET /circuits/${alpha_id}/weather-stations returns total_count 0 — nothing was written"

      - name: circuit_upstream_self_reference_is_validated_and_reverse_listable
        claim_type: Parent Relationships
        grounds:
          - entities.Circuit.fields.upstream_circuit_id
          - endpoints.GET_/circuits
          - complexity_profile.relationship_patterns
        distinguishing_aspect: "upstream_circuit_id is a nullable self-reference: ALPHA holds null, BRAVO points at ALPHA, CHARLIE at BRAVO, and the reverse direction is reachable through the declared upstream_circuit_id query filter — the same field serving as both the forward FK and the reverse-reachability channel."
        test_recipe:
          setup:
            - "The three-circuit feeder chain ALPHA -> BRAVO -> CHARLIE."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
          trigger:
            - call: "GET /circuits"
              payload: { upstream_circuit_id: "${alpha_id}" }
              as: TransmissionEngineer
            - call: "GET /circuits"
              payload: { upstream_circuit_id: "${bravo_id}" }
              as: TransmissionEngineer
            - call: "POST /circuits"
              payload: { circuit_code: "ORPHAN-FEED", district_code: "D-NORTH", hftd_tier: "TIER_1", overhead_miles: 2.0, equipment_condition_index: 90, upstream_circuit_id: "00000000-0000-4000-8000-000000000000" }
              as: GridPlanner
              captures: { err: $.data.error_id }
          assert:
