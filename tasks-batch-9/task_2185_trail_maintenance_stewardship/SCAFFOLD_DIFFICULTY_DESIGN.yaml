# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Deleting this file must not
# change any declared behaviour - it only makes coverage harder to audit.
#
# Shared fixture vocabulary used by the chains below (all values are literals):
#   LandManager  "Cascade National Forest" / USFS-R6-ALDER, permit_lead_days 14,
#                max_party_size 20, wet_threshold_index 0.65,
#                requires_engineering_review true, requires_certified_sawyer true
#   Volunteers   rae@example.org   (CREW_LEADER + TRAIL_SKILLS + FIRST_AID) -> SKILLED_TRAIL
#                milo@example.org  (SAWYER_B + FIRST_AID)                   -> CERTIFIED_SAWYER
#                petra@example.org (no certifications)                      -> GENERAL
#   Segment      "Alder Creek", NATIVE_SOIL, traffic_class MODERATE
#   Clock        server default 2026-08-01T00:00:00Z
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: condition_report_initial_triage_vs_reassessed_priority_diverges
        grounds:
          - calculations.condition_report_priority_score
          - calculations.condition_report_priority_score.variants.INITIAL_TRIAGE
          - calculations.condition_report_priority_score.variants.REASSESSED
          - state_machines.ConditionReport.TRIAGED_to_DEFERRED
          - state_machines.ConditionReport.TRIAGED_to_ESCALATED
          - validations[priority=32]
          - errors[ERR_PRIORITY_TOO_HIGH_TO_DEFER]
        distinguishing_aspect: |
          This dual-variant pair operates on the ConditionReport risk domain: the identical
          row scores 63 under INITIAL_TRIAGE (age_bonus and wet_surcharge forced to zero) and
          77 under REASSESSED (age_bonus 6 after fourteen days plus WET_SURCHARGE 8), which
          flips the DEFER gate from allowed to refused.
        test_recipe:
          setup:
            - "One LandManager, one volunteer, one trail segment with traffic_class MODERATE."
            - "One ConditionReport created at clock 2026-08-01T00:00:00Z, triaged the same instant with exposure_class HIGH and severity MODERATE, storing priority_score 63 / priority_variant INITIAL_TRIAGE."
            - "Clock then advanced exactly fourteen days to 2026-08-15T00:00:00Z and a soil-moisture observation of 0.72 recorded, putting the segment in posture WET_RESTRICTED."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Petra Novak", email: "petra@example.org", waiver_signed_on: "2026-07-01", certifications: [] }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { gen_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Alder Creek", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "MODERATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { seg_id: $.data.id }
            - call: "POST /stewardship/condition-reports"
              payload: { trail_segment_id: "${seg_id}", reported_by_volunteer_id: "${gen_id}", hazard_type: "TREAD_EROSION", severity_class: "MODERATE", description: "Rutting below the switchback." }
              as: Volunteer
              as_user_id: "${gen_id}"
              captures: { cr_id: $.data.id }
            - call: "POST /stewardship/condition-reports/${cr_id}/triage"
              payload: { exposure_class: "HIGH" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { initial_score: $.data.priority_score, initial_variant: $.data.priority_variant }
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00.000Z" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
            - call: "POST /stewardship/_weather/observations"
              payload: { trail_segment_id: "${seg_id}", soil_moisture_index: 0.72, observed_at: "2026-08-14T22:00:00.000Z" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { posture_after_rain: $.data.posture }
          trigger:
            - call: "POST /stewardship/condition-reports/${cr_id}/disposition"
              payload: { disposition: "DEFER", defer_until_date: "2026-10-01" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { defer_error: $.data.error_id }
            - call: "POST /stewardship/condition-reports/${cr_id}/disposition"
              payload: { disposition: "ESCALATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { final_score: $.data.priority_score, final_variant: $.data.priority_variant }
          assert:
            - "${initial_score} == 63"
            - "${initial_variant} == INITIAL_TRIAGE"
            - "${posture_after_rain} == WET_RESTRICTED"
            - "The DEFER disposition returns HTTP 422 with ${defer_error} == ERR_PRIORITY_TOO_HIGH_TO_DEFER"
            - "${final_score} == 77"
            - "${final_variant} == REASSESSED"
            - "ConditionReport.${cr_id}.status == ESCALATED"
            - "TrailSegment.${seg_id}.escalated_hazard_count == 1"
            - "TrailSegment.${seg_id}.hazard_index == 39"

      - name: grant_match_provisional_vs_certified_diverges
        grounds:
          - calculations.grant_match_value_usd
          - calculations.grant_match_value_usd.variants.PROVISIONAL
          - calculations.grant_match_value_usd.variants.CERTIFIED
          - entities.VolunteerShift.fields.skill_class_snapshot
          - endpoints["GET /stewardship/work-plans/{id}/grant-match"]
        distinguishing_aspect: |
          This dual-variant pair operates on the WorkPlan money domain, not on the
          ConditionReport risk domain: the same two certified shifts (6.50 h GENERAL and
          6.50 h CERTIFIED_SAWYER) yield labor_match_usd 371.02 under PROVISIONAL
          (sum-hours then one flat multiply) and 599.89 under CERTIFIED (per-shift rate,
          per-shift rounding), with average_rate_usd 28.54 versus 46.15.
        test_recipe:
          setup:
            - "An ACTIVE adoption on Alder Creek with an APPROVED work plan (approved_budget_cents 250000) and an ISSUED permit for 2026-09-01..2026-09-30."
            - "Work party P1 on 2026-09-05T09:00Z-15:00Z, travel_allowance_minutes 45, briefed, CONFIRMED, then started and completed."
            - "Milo (CERTIFIED_SAWYER) checked out after 380 worked minutes -> credited_hours 6.50; Petra (GENERAL) checked out after 382 worked minutes -> credited_hours 6.50."
            - "Both shifts verified by coordinator user coord-1 and certified by grants user grants-1."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Rae Lindqvist", email: "rae@example.org", waiver_signed_on: "2026-07-01", certifications: ["CERT_CREW_LEADER", "CERT_TRAIL_SKILLS", "CERT_FIRST_AID"], first_aid_expires_on: "2027-06-30" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lead_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Milo Okonkwo", email: "milo@example.org", waiver_signed_on: "2026-07-01", certifications: ["CERT_SAWYER_B", "CERT_FIRST_AID"], first_aid_expires_on: "2027-06-30" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { saw_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Petra Novak", email: "petra@example.org", waiver_signed_on: "2026-07-01", certifications: [] }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { gen_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Alder Creek", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "MODERATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { seg_id: $.data.id }
            - call: "POST /stewardship/adoption-agreements"
              payload: { trail_segment_id: "${seg_id}", crew_leader_volunteer_id: "${lead_id}", term_start_date: "2026-08-01", term_end_date: "2027-07-31" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { aa_id: $.data.id }
            - call: "POST /stewardship/adoption-agreements/${aa_id}/submit"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/adoption-agreements/${aa_id}/review"
              payload: { decision: "APPROVE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
            - call: "POST /stewardship/adoption-agreements/${aa_id}/activate"
              payload: {}
              as: LandManagerOfficer
              as_user_id: "${lm_id}"
            - call: "POST /stewardship/work-plans"
              payload: { adoption_agreement_id: "${aa_id}", season_year: 2026, requested_budget_cents: 250000 }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { wp_id: $.data.id }
            - call: "POST /stewardship/work-plans/${wp_id}/submit"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/work-plans/${wp_id}/review"
              payload: { decision: "APPROVE", approved_budget_cents: 250000 }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
            - call: "POST /stewardship/work-permits"
              payload: { work_plan_id: "${wp_id}", trail_segment_id: "${seg_id}", window_start_date: "2026-09-01", window_end_date: "2026-09-30", requested_work_types: ["TREAD_WORK", "CHAINSAW", "SIGNAGE", "BRUSHING", "DRY_WORK", "BRIDGE_CONSTRUCTION"] }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /stewardship/work-permits/${pm_id}/decision"
              payload: { decision: "ISSUE", allowed_work_types: ["TREAD_WORK", "CHAINSAW", "SIGNAGE", "BRUSHING", "DRY_WORK", "BRIDGE_CONSTRUCTION"], max_party_size: 12 }
              as: LandManagerOfficer
              as_user_id: "${lm_id}"
            - call: "POST /stewardship/work-parties"
              payload: { work_plan_id: "${wp_id}", trail_segment_id: "${seg_id}", work_permit_id: "${pm_id}", start_at: "2026-09-05T09:00:00.000Z", end_at: "2026-09-05T15:00:00.000Z", work_type: "TREAD_WORK", max_participants: 8, travel_allowance_minutes: 45 }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /stewardship/work-parties/${p1_id}/briefing"
              payload: { tool_checklist_complete: true, first_aid_kit_count: 2 }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { p1_v1: $.data.version }
            - call: "POST /stewardship/work-parties/${p1_id}/shifts"
              payload: { volunteer_id: "${saw_id}", expected_work_party_version: "${p1_v1}", role_on_crew: "SAWYER" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { sh_saw_id: $.data.id }
            - call: "GET /stewardship/work-parties/${p1_id}"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { p1_v2: $.data.version }
            - call: "POST /stewardship/work-parties/${p1_id}/shifts"
              payload: { volunteer_id: "${gen_id}", expected_work_party_version: "${p1_v2}", role_on_crew: "CREW_MEMBER" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { sh_gen_id: $.data.id }
            - call: "POST /stewardship/work-parties/${p1_id}/confirm"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T09:00:00.000Z" }
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/work-parties/${p1_id}/start"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/shifts/${sh_saw_id}/check-in"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/shifts/${sh_gen_id}/check-in"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T15:20:00.000Z" }
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/shifts/${sh_saw_id}/check-out"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { saw_hours: $.data.credited_hours, saw_skill: $.data.skill_class_snapshot }
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T15:22:00.000Z" }
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/shifts/${sh_gen_id}/check-out"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { gen_hours: $.data.credited_hours, gen_skill: $.data.skill_class_snapshot }
            - call: "POST /stewardship/work-parties/${p1_id}/complete"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/shifts/${sh_saw_id}/hours-review"
              payload: { decision: "VERIFY" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
            - call: "POST /stewardship/shifts/${sh_gen_id}/hours-review"
              payload: { decision: "VERIFY" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
            - call: "POST /stewardship/shifts/${sh_saw_id}/certify"
              payload: {}
              as: GrantsAdministrator
              as_user_id: "grants-1"
            - call: "POST /stewardship/shifts/${sh_gen_id}/certify"
              payload: {}
              as: GrantsAdministrator
              as_user_id: "grants-1"
          trigger:
            - call: "GET /stewardship/work-plans/${wp_id}/grant-match"
              payload: { variant: "CERTIFIED" }
              as: GrantsAdministrator
              as_user_id: "grants-1"
              captures: { c_hours: $.data.total_credited_hours, c_labor: $.data.labor_match_usd, c_total: $.data.grant_match_total_usd, c_avg: $.data.average_rate_usd, c_count: $.data.included_shift_count }
            - call: "GET /stewardship/work-plans/${wp_id}/grant-match"
              payload: { variant: "PROVISIONAL" }
              as: GrantsAdministrator
              as_user_id: "grants-1"
              captures: { p_hours: $.data.total_credited_hours, p_labor: $.data.labor_match_usd, p_total: $.data.grant_match_total_usd, p_avg: $.data.average_rate_usd, p_count: $.data.included_shift_count }
          assert:
            - "${saw_hours} == 6.50 and ${saw_skill} == CERTIFIED_SAWYER"
            - "${gen_hours} == 6.50 and ${gen_skill} == GENERAL"
            - "${c_count} == 2 and ${c_hours} == 13.00"
            - "${c_labor} == 599.89"
            - "${c_total} == 599.89"
            - "${c_avg} == 46.15"
            - "${p_count} == 2 and ${p_hours} == 13.00"
            - "${p_labor} == 371.02"
            - "${p_total} == 371.02"
            - "${p_avg} == 28.54"
            - "${c_labor} != ${p_labor}"

  - rule_id: combinatorial_formula
    instances:
      - name: shift_hours_quantized_per_shift_then_summed_not_summed_then_quantized
        grounds:
          - calculations.shift_credited_hours
          - entities.VolunteerShift.fields.billable_minutes
          - entities.VolunteerShift.fields.credited_hours
          - entities.WorkPlan.fields.verified_volunteer_hours
          - state_machines.VolunteerShift.CHECKED_IN_to_CHECKED_OUT
          - state_machines.VolunteerShift.CHECKED_OUT_to_HOURS_VERIFIED
        distinguishing_aspect: |
          Mode (b) - nested rounding whose ORDER changes the answer. Two shifts of 395 and
          397 billable minutes quantize to 6.50 h each and sum to exactly 13.00 h under the
          pinned per-shift-first order, whereas quantizing the 792-minute total would give
          13.25 h; the scaffold pins per-shift-first and WorkPlan.verified_volunteer_hours
          must read 13.00.
        test_recipe:
          setup:
            - "An ACTIVE adoption on Alder Creek with an APPROVED 250000-cent plan and an ISSUED permit for 2026-09-01..2026-09-30."
            - "Work party P1 on 2026-09-05T09:00Z-15:00Z with travel_allowance_minutes 45, briefed, CONFIRMED, started at 09:00Z."
            - "Milo checked in at 09:00Z and out at 15:20Z (380 worked minutes); Petra checked in at 09:00Z and out at 15:22Z (382 worked minutes). The party is then COMPLETED."
