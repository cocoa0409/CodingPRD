# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2868 - Multifamily Physical Inspection Readiness
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Deleting this file
# leaves the declared behaviour identical.
#
# Shared fixture vocabulary used by the chains below (all values are literals):
#   standard NSPIRE-2026, weights 50.00 / 30.00 / 20.00
#   LT_GAS       UNIT     LIFE_THREATENING base 10.00 deadline 24h  -> 36.00 pts on an OCCUPIED unit
#   SEV_WINDOW   UNIT     SEVERE           base  8.00 deadline 720h -> 16.00 pts
#   MOD_HANDRAIL INSIDE   MODERATE         base  6.00 deadline 720h ->  4.80 pts
#   LOW_TRASH    OUTSIDE  LOW              base  4.00 deadline 720h ->  1.20 pts
#   logical clock default 2026-08-01T00:00:00Z (never advanced unless a chain says so)
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: inspection_score_provisional_vs_final_diverge_on_unreplaced_refusal
        grounds:
          - calculations.inspection_score
          - entities.Inspection.fields.provisional_score
          - entities.Inspection.fields.final_score
          - entities.Inspection.fields.inspected_unit_count
          - entities.Inspection.fields.refused_unit_count
          - state_machines.Inspection.IN_PROGRESS_to_SCORED
        distinguishing_aspect: |
          The two variants differ ONLY in the UNIT-area denominator and the refusal penalty:
          PROVISIONAL divides unit_raw 52.00 by inspected_unit_count 1 and ignores the refusal,
          FINAL divides (52.00 + 12.00 * 1) by sample_size 2, so one single scoring call must
          write provisional_score 72.3 and final_score 82.3 to the same row.
        test_recipe:
          setup:
            - "ADOPTED standard NSPIRE-2026 with unit/inside/outside weights 50.00/30.00/20.00 and the four defect definitions above."
            - "Property Maple Court declares total_unit_count 4 but owns only two OCCUPIED units 101 and 102, so sample_tier_value 4 clamps to sample_size 2."
            - "Unit 101 granted access, unit 102 refused with no eligible replacement unit left, so the refused slot stays ACTIVE."
            - "Four deficiencies recorded: SEV_WINDOW 16.00 and LT_GAS 36.00 on unit 101 (unit_raw 52.00), MOD_HANDRAIL 4.80 INSIDE, LOW_TRASH 1.20 OUTSIDE; the life-threatening one corrected inside its 24-hour clock so scoring is not blocked."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
              captures: { dd_lt: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Inoperable egress window", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_sev: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "MOD_HANDRAIL", name: "Loose stairwell handrail", inspectable_area: "INSIDE", severity: "MODERATE", base_point_value: 6.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_mod: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LOW_TRASH", name: "Uncontained refuse at pad", inspectable_area: "OUTSIDE", severity: "LOW", base_point_value: 4.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_low: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Maple Court", total_unit_count: 4, capital_reserve_cents: 1000000, owner_contact_email: "owner@maple.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 2, occupancy_status: "OCCUPIED", occupant_display_name: "Household 101" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "102", bedroom_count: 1, occupancy_status: "OCCUPIED", occupant_display_name: "Household 102" }
              as: PlatformAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T17:00:00.000Z", inspection_kind: "INITIAL" }
              as: HousingAgencyInspector
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/draw-sample"
              payload: { drawn_at: "2026-08-02T00:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "GET /sample-selections?inspection_id=${insp_id}&unit_id=${u1_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { sel1_id: "$.data[0].id" }
            - call: "GET /sample-selections?inspection_id=${insp_id}&unit_id=${u2_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { sel2_id: "$.data[0].id" }
            - call: "POST /sample-selections/${sel1_id}/notice"
              payload: { notice_method: "POSTED_AND_MAILED", notified_at: "2026-08-05T09:00:00.000Z", access_window_start: "2026-09-10T09:00:00.000Z", access_window_end: "2026-09-10T11:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /sample-selections/${sel2_id}/notice"
              payload: { notice_method: "POSTED_AND_MAILED", notified_at: "2026-08-05T09:00:00.000Z", access_window_start: "2026-09-10T11:00:00.000Z", access_window_end: "2026-09-10T13:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /inspections/${insp_id}/start"
              payload: { started_at: "2026-09-10T09:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "POST /sample-selections/${sel1_id}/access"
              payload: { access_result: "GRANTED", recorded_at: "2026-09-10T09:05:00.000Z" }
              as: HousingAgencyInspector
            - call: "POST /sample-selections/${sel2_id}/access"
              payload: { access_result: "REFUSED", recorded_at: "2026-09-10T11:05:00.000Z", refusal_reason: "Household declined entry" }
              as: HousingAgencyInspector
            - call: "GET /inspections/${insp_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { v1: $.data.version }
            - call: "POST /inspections/${insp_id}/deficiencies"
              payload: { expected_inspection_version: "${v1}", defect_definition_id: "${dd_sev}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-09-10T10:00:00.000Z" }
              as: HousingAgencyInspector
              captures: { d1_id: $.data.id, v2: $.data.inspection_version_after_record }
            - call: "POST /inspections/${insp_id}/deficiencies"
              payload: { expected_inspection_version: "${v2}", defect_definition_id: "${dd_mod}", inspectable_area: "INSIDE", observed_at: "2026-09-10T10:10:00.000Z" }
              as: HousingAgencyInspector
              captures: { d3_id: $.data.id, v3: $.data.inspection_version_after_record }
            - call: "POST /inspections/${insp_id}/deficiencies"
              payload: { expected_inspection_version: "${v3}", defect_definition_id: "${dd_low}", inspectable_area: "OUTSIDE", observed_at: "2026-09-10T10:15:00.000Z" }
              as: HousingAgencyInspector
              captures: { d4_id: $.data.id, v4: $.data.inspection_version_after_record }
            - call: "POST /inspections/${insp_id}/deficiencies"
              payload: { expected_inspection_version: "${v4}", defect_definition_id: "${dd_lt}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-09-10T10:20:00.000Z" }
              as: HousingAgencyInspector
              captures: { d5_id: $.data.id, v5: $.data.inspection_version_after_record }
            - call: "POST /deficiencies/${d5_id}/correction"
              payload: { corrected_at: "2026-09-10T14:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
          trigger:
            - call: "POST /inspections/${insp_id}/score"
              payload: { scored_at: "2026-09-11T09:00:00.000Z" }
              as: HousingAgencyInspector
          assert:
            - "Inspection.${insp_id}.status == SCORED"
            - "Inspection.${insp_id}.inspected_unit_count == 1"
            - "Inspection.${insp_id}.refused_unit_count == 1"
            - "Inspection.${insp_id}.sample_size == 2"
            - "Inspection.${insp_id}.unit_area_points == 52.00"
            - "Inspection.${insp_id}.inside_area_points == 4.80"
            - "Inspection.${insp_id}.outside_area_points == 1.20"
            - "Inspection.${insp_id}.total_points_deducted == 58.00"
            - "Inspection.${insp_id}.provisional_score == 72.3"
            - "Inspection.${insp_id}.final_score == 82.3"
            - "Inspection.${insp_id}.provisional_score != Inspection.${insp_id}.final_score"
            - "Property.${prop_id}.last_final_score == 82.3"
            - "Inspection.${insp_id}.appeal_deadline_at == 2026-09-26T09:00:00.000Z"

      - name: capital_recurrence_inspection_scoped_vs_calendar_scoped_diverge
        grounds:
          - calculations.capital_need_recurrence_count
          - calculations.capital_need_priority_score
          - entities.CapitalNeedItem.fields.recurrence_basis
          - entities.CapitalNeedItem.fields.recurrence_count
          - entities.CapitalNeedItem.fields.priority_score
          - concurrency_rules[capital-recompute-stale-property]
        distinguishing_aspect: |
          Different entity domain from the scoring variant: the same three CLOSED historical
          inspections yield recurrence_count 3 / priority_score 48.00 for SEV_WINDOW under
          CALENDAR_SCOPED but recurrence_count 2 / priority_score 32.00 under INSPECTION_SCOPED,
          because the INSPECTION_SCOPED window is hard-capped at the 2 most recent inspections.
        test_recipe:
          setup:
            - "ADOPTED standard with three UNIT-area definitions: SEV_WINDOW (SEVERE, base 8.00), SEV_DOOR (SEVERE, base 8.00), MOD_FLOOR (MODERATE, base 8.00)."
            - "Property Birch Row with capital_reserve_cents 1000000 and one unit 201."
            - "Three injected CLOSED inspections: 2024-09-15 citing SEV_WINDOW only; 2025-06-15 and 2026-03-15 each citing all three definitions."
            - "The logical clock stays at its 2026-08-01T00:00:00Z default, so the 730-day calendar window opens at 2024-08-01T00:00:00Z and all three inspections are inside it."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Inoperable egress window", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_window: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_DOOR", name: "Non-latching entry door", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_door: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "MOD_FLOOR", name: "Damaged floor covering", inspectable_area: "UNIT", severity: "MODERATE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_floor: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Birch Row", total_unit_count: 12, capital_reserve_cents: 1000000, owner_contact_email: "owner@birch.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "201", bedroom_count: 2, occupancy_status: "OCCUPIED", occupant_display_name: "Household 201" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /_inject/completed-inspection-history"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", finalized_at: "2024-09-15T00:00:00.000Z", defect_definition_ids: ["${dd_window}"], unit_id: "${u1_id}" }
              as: PlatformAdmin
            - call: "POST /_inject/completed-inspection-history"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", finalized_at: "2025-06-15T00:00:00.000Z", defect_definition_ids: ["${dd_window}", "${dd_door}", "${dd_floor}"], unit_id: "${u1_id}" }
              as: PlatformAdmin
            - call: "POST /_inject/completed-inspection-history"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", finalized_at: "2026-03-15T00:00:00.000Z", defect_definition_ids: ["${dd_window}", "${dd_door}", "${dd_floor}"], unit_id: "${u1_id}" }
              as: PlatformAdmin
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { pv1: $.data.version }
            - call: "POST /capital-needs/recompute"
              payload: { property_id: "${prop_id}", expected_property_version: "${pv1}", recurrence_basis: "CALENDAR_SCOPED" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "GET /capital-needs?property_id=${prop_id}&defect_definition_id=${dd_window}&status=ACTIVE"
              payload: {}
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { cal_window_item: "$.data[0].id" }
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /capital-needs/recompute"
              payload: { property_id: "${prop_id}", expected_property_version: "${pv2}", recurrence_basis: "INSPECTION_SCOPED" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "CapitalNeedItem.${cal_window_item}.recurrence_basis == CALENDAR_SCOPED"
            - "CapitalNeedItem.${cal_window_item}.recurrence_count == 3"
            - "CapitalNeedItem.${cal_window_item}.priority_score == 48.00"
            - "CapitalNeedItem.${cal_window_item}.status == SUPERSEDED"
            - "the ACTIVE CapitalNeedItem with property_id ${prop_id} and defect_definition_id ${dd_window} has recurrence_basis == INSPECTION_SCOPED, recurrence_count == 2 and priority_score == 32.00"
            - "the ACTIVE CapitalNeedItem with defect_definition_id ${dd_door} has recurrence_count == 2 and priority_score == 32.00"
            - "the ACTIVE CapitalNeedItem with defect_definition_id ${dd_floor} has recurrence_count == 2 and priority_score == 16.00"
            - "exactly 3 CapitalNeedItem rows for property ${prop_id} have status == ACTIVE"

  - rule_id: combinatorial_formula
    instances:
      - name: deficiency_points_five_factor_product_with_occupancy_branch_and_cap
        grounds:
          - calculations.deficiency_points_deducted
          - entities.Deficiency.fields.points_deducted
          - entities.Deficiency.fields.recurrence_applied
          - entities.Unit.fields.occupancy_status
          - state_machines.Inspection.IN_PROGRESS_to_IN_PROGRESS
        distinguishing_aspect: |
          One deduction is the product of five independent inputs drawn from three entities -
          DefectDefinition.base_point_value 10.00, SEVERITY_MULT[LIFE_THREATENING] 3.0,
          AREA_MULT[UNIT] 1.0, RECURRENCE_MULT 1.5 (present only when supersedes_deficiency_id
          is set) and OCCUPIED_LIFE_THREATENING_MULT 1.2 (read from a DIFFERENT entity, the
          cited Unit) - and the raw 54.00 must then be clamped by DEFICIENCY_POINT_CAP 40.00.
          The same definition on a VACANT unit drops the occupancy factor and yields 30.00, so
          no single-factor implementation can satisfy all three rows.
        test_recipe:
          setup:
            - "ADOPTED standard NSPIRE-2026 with LT_GAS (UNIT, LIFE_THREATENING, base 10.00, 24h)."
            - "Property Maple Court, total_unit_count 4, with unit 101 OCCUPIED and unit 102 VACANT; both are drawn and both grant access."
            - "One LT_GAS deficiency on the OCCUPIED unit 101 and one on the VACANT unit 102, neither superseding anything."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
              captures: { dd_lt: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Maple Court", total_unit_count: 4, capital_reserve_cents: 1000000, owner_contact_email: "owner@maple.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 2, occupancy_status: "OCCUPIED", occupant_display_name: "Household 101" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "102", bedroom_count: 1, occupancy_status: "VACANT" }
              as: PlatformAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T17:00:00.000Z", inspection_kind: "INITIAL" }
              as: HousingAgencyInspector
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/draw-sample"
              payload: { drawn_at: "2026-08-02T00:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "GET /sample-selections?inspection_id=${insp_id}&unit_id=${u1_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { sel1_id: "$.data[0].id" }
            - call: "GET /sample-selections?inspection_id=${insp_id}&unit_id=${u2_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { sel2_id: "$.data[0].id" }
            - call: "POST /sample-selections/${sel1_id}/notice"
              payload: { notice_method: "POSTED_AND_MAILED", notified_at: "2026-08-05T09:00:00.000Z", access_window_start: "2026-09-10T09:00:00.000Z", access_window_end: "2026-09-10T11:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /sample-selections/${sel2_id}/notice"
              payload: { notice_method: "POSTED", notified_at: "2026-08-05T09:00:00.000Z", access_window_start: "2026-09-10T11:00:00.000Z", access_window_end: "2026-09-10T13:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /inspections/${insp_id}/start"
              payload: { started_at: "2026-09-10T09:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "POST /sample-selections/${sel1_id}/access"
              payload: { access_result: "GRANTED", recorded_at: "2026-09-10T09:05:00.000Z" }
              as: HousingAgencyInspector
            - call: "POST /sample-selections/${sel2_id}/access"
              payload: { access_result: "GRANTED", recorded_at: "2026-09-10T11:05:00.000Z" }
              as: HousingAgencyInspector
            - call: "GET /inspections/${insp_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { v1: $.data.version }
            - call: "POST /inspections/${insp_id}/deficiencies"
              payload: { expected_inspection_version: "${v1}", defect_definition_id: "${dd_lt}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-09-10T10:00:00.000Z" }
              as: HousingAgencyInspector
              captures: { d_occ: $.data.id, v2: $.data.inspection_version_after_record }
            - call: "POST /inspections/${insp_id}/deficiencies"
              payload: { expected_inspection_version: "${v2}", defect_definition_id: "${dd_lt}", inspectable_area: "UNIT", unit_id: "${u2_id}", observed_at: "2026-09-10T11:10:00.000Z" }
              as: HousingAgencyInspector
              captures: { d_vac: $.data.id, v3: $.data.inspection_version_after_record }
          trigger:
            - call: "POST /inspections/${insp_id}/deficiencies"
              payload: { expected_inspection_version: "${v3}", defect_definition_id: "${dd_lt}", inspectable_area: "UNIT", unit_id: "${u1_id}", supersedes_deficiency_id: "${d_occ}", observed_at: "2026-09-10T12:00:00.000Z", note: "Recurrence of the same gas leak" }
              as: HousingAgencyInspector
              captures: { d_rec: $.data.id }
          assert:
            - "Deficiency.${d_occ}.points_deducted == 36.00"
            - "Deficiency.${d_occ}.recurrence_applied == false"
            - "Deficiency.${d_vac}.points_deducted == 30.00"
            - "Deficiency.${d_rec}.points_deducted == 40.00"
            - "Deficiency.${d_rec}.recurrence_applied == true"
            - "Deficiency.${d_rec}.points_deducted != 54.00"
            - "Deficiency.${d_rec}.correction_due_at == 2026-09-11T12:00:00.000Z"
            - "Inspection.${insp_id}.unit_area_points == 106.00"
            - "Inspection.${insp_id}.life_threatening_count == 3"

      - name: capital_reserve_allocation_floor_then_remainder_walk
        grounds:
          - calculations.capital_reserve_allocation
          - entities.CapitalNeedItem.fields.allocated_reserve_cents
          - entities.CapitalNeedItem.fields.allocation_rank
          - entities.Property.fields.allocated_reserve_total_cents
        distinguishing_aspect: |
          Three priority scores 48.00 / 32.00 / 16.00 over a 1000000-cent reserve give exact
          shares 500000 / 333333.33 / 166666.67. The pinned order - floor EVERY share first,
          then walk the 1-cent remainder in allocation_rank order - yields
          500001 / 333333 / 166666, while rounding each share half-up independently yields
          500000 / 333333 / 166667. Both sum to the reserve, so only the per-item cents
          distinguish the correct evaluation order.
        test_recipe:
          setup:
            - "ADOPTED standard with SEV_WINDOW (SEVERE, base 8.00), SEV_DOOR (SEVERE, base 8.00) and MOD_FLOOR (MODERATE, base 8.00), plus a LIFE_THREATENING definition so the standard may be adopted."
