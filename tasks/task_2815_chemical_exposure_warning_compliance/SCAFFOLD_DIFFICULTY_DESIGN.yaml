            - "ExposureAssessment.${asmt_1}.daily_exposure_ug != 2.469 (the sum-then-round order is wrong)"
            - "ExposureAssessment.${asmt_1}.contribution_count == 2"
            - "ExposureAssessment.${asmt_1}.margin_ratio == 4.94"
            - "ExposureAssessment.${asmt_1}.result == AT_OR_ABOVE_SAFE_HARBOR"

      - name: settlement_pinned_penalty_then_cap_then_fees
        grounds:
          - calculations.settlement_money
          - entities.Settlement.fields.fee_cap_cents
          - entities.Settlement.fields.noticing_party_share_cents
          - state_machines.NoticeOfViolation.UNDER_EVALUATION_to_SETTLEMENT_NEGOTIATION
        distinguishing_aspect: |
          Seven-step money waterfall whose apparent circularity is resolved by a pinned order:
          the fee cap tier is keyed on the ADJUSTED penalty (1,500,000 -> 0.60 tier -> 900,000),
          never on the base penalty (which would give 1,200,000), and allowed_fees_cents never
          re-enters the penalty, while noticing_party_share_cents absorbs the floor remainder so
          state_share + noticing_share equals adjusted_penalty exactly.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED."
            - "Product SKU-CF2 has annual_units 500000 and, deliberately, zero ACTIVE components, so warranty_defense_applies is false (the empty product is excluded rather than vacuously covered)."
