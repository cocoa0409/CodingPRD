  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_booking_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appointment-booking-stale-referral]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Create-with-supersede OCC: after a first booking advances the referral version 3 -> 4, a second booking replaying expected_referral_version=3 is rejected ERR_STALE_VERSION (412); re-reading and booking with 4 succeeds and supersedes the first appointment."
        test_recipe:
          setup: ["full bootstrap; referral accepted + assigned S1 (version 3); first booking done (version 4)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
