      assert:
      - error_id == ERR_INVALID_STATE_TRANSITION (${err}), HTTP 409
      - DrawRequest.${drw}.status still REQUESTED; loan outstanding_principal_cents == 0
  - name: paid_off_loan_blocks_new_draw_approval
    claim_type: terminal_lockdown
    grounds:
    - state_machines.LoanAccount.ACTIVE_to_PAID_OFF
    - errors[ERR_LOAN_NOT_ACTIVE]
    distinguishing_aspect: An exact payoff auto-transitions the loan to terminal PAID_OFF; a later draw approve hits the loan-status gate with ERR_LOAN_NOT_ACTIVE.
    test_recipe:
      setup:
      - ACTIVE loan; draw 1,000,000 disbursed 2026-04-01
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-03-01T00:00:00Z'
        as: System
      - call: POST /associations
        payload:
          name: Blackhawk FCS
          charter_number: CH-1850
        as: AssociationBoard
        captures:
