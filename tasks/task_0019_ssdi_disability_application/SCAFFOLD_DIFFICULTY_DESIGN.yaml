      - name: hearing_lead_time_open_lower_bound_interval_collides
        grounds:
          - validations[priority=12]
          - errors[ERR_HEARING_LEAD_TIME]
        distinguishing_aspect: |
          Different interval semantics from instance 1: a HALF-OPEN
          [requested_date + 75 days, +∞) interval on HearingRequest resource
          (not the Application resource). The scheduled date must lie inside
          this half-open interval. Adjacency: requested_date + 74 days falls
          outside (rejected); requested_date + 75 days falls inside
          (accepted). The geometric treatment of the bound differs from the
          reconsideration window's [decision_date, decision_date + 60 days]
          closed interval. Different resource entity (HearingRequest, not
          Application).
