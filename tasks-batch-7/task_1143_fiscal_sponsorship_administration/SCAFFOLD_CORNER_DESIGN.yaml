            - "st1 == PENDING_SPONSOR (not APPROVED_FOR_PAYMENT)"
            - "pay in PENDING_SPONSOR: error_id == ERR_DISBURSEMENT_STATE_INVALID"
            - "st2 == APPROVED_FOR_PAYMENT after sponsor-approve; st3 == PAID"

