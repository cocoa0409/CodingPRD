  - name: salvage_per_class_round_then_sum_order
    grounds:
    - calculations.salvage_settlement_value
    - entities.SalvageBatch.fields.settlement_value_cents
    distinguishing_aspect: 'Mode (b): nested rounding order is observable — COBRA_HEAD 50.5 lb x 85c = 4292.5 -> 4293,

      POST_TOP 105.5 lb x 70c = 7385, FLOOD 50.5 lb x 95c = 4797.5 -> 4798; the PINNED

      per-class-round-then-sum order yields 16476 - 4500 = 11976 cents, while the forbidden

      sum-then-round order would yield 16475 - 4500 = 11975 — exactly one cent apart.

      '
    test_recipe:
      setup:
      - 'ACTIVE program, RESIDENTIAL district, crew; three UTILITY_OWNED poles attested: COBRA_HEAD, POST_TOP, FLOOD (250W each)'
      - Route 2026-08-02..2026-08-02 with the three poles, RELEASED; all three work orders completed at clock 2026-08-02T10:00:00Z (three unbatched SalvageItems, weight 0)
      - Salvage batch BATCH-1 created; items added with weights 50.5 / 105.5 / 50.5 lb, mercury_flag false
      setup_api_calls:
      - call: POST /streetlights/programs
        payload:
          program_name: LED-SV2
          program_budget_cents: 10000000
          fy_rebate_cap_cents: 100000
          rebate_cents_per_kwh: 50
