              captures: { st: $.data.status }
          assert:
            - "H1BPetition.${pet2}.status == APPROVED (adjacency at 2027-10-01 allowed under half-open semantics)"

  - rule_id: compensating_invariant
    instances:
      - name: cap_seats_conserved_on_select_then_withdraw
        grounds:
          - state_machines.H1BRegistration.SUBMITTED_to_SELECTED
          - state_machines.H1BRegistration.SELECTED_to_WITHDRAWN
          - entities.CapProgram.fields.available_seats
        distinguishing_aspect: |
          Conserved quantity = cap seats: available_seats + selected_count == selection_quota
          (5). Selecting one seat then withdrawing it returns selected_count to 0 and
          available_seats to 5 — no drift.
        test_recipe:
          setup:
            - "CapProgram FY2027 quota 5; one registration SELECTED (selected_count=1, available_seats=4)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "171717171", legal_name: "Omicron Co", employee_count: 6 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Tomas Vidal", passport_number: "P-III-1" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { ben_id: $.data.id }
            - call: "POST /cap-programs"
              payload: { fiscal_year: 2027, selection_quota: 5 }
              as: USCISOfficer
              captures: { cap_id: $.data.id }
            - call: "POST /h1b-registrations"
              payload: { employer_id: "${emp_id}", beneficiary_id: "${ben_id}", fiscal_year: 2027 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /cap-programs/${cap_id}/run-lottery"
              as: USCISOfficer
              captures: { sel_after: $.data.selected_count, avail_after: $.data.available_seats }
          trigger:
            - call: "POST /h1b-registrations/${reg_id}/transitions"
              payload: { to_status: "WITHDRAWN" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
          assert:
            - "sel_after == 1 and avail_after == 4 after the lottery (invariant holds: 4+1==5)"
            - "CapProgram.${cap_id}.selected_count == 0 after withdrawal"
            - "CapProgram.${cap_id}.available_seats == 5 after withdrawal (restored to selection_quota)"

      - name: employer_wage_obligation_conserved_on_certify_then_withdraw
        grounds:
          - state_machines.LCA.DRAFT_to_CERTIFIED
          - state_machines.LCA.CERTIFIED_to_WITHDRAWN
          - entities.Employer.fields.total_wage_obligation_cents
        distinguishing_aspect: |
          Conserved quantity = employer wage-obligation cents: total_wage_obligation_cents
          rises by required_wage_cents (12000000) on certification and falls by exactly the
          same amount on withdrawal, returning to 0 — a different conserved quantity than cap seats.
        test_recipe:
          setup:
            - "A DRAFT LCA with required_wage_cents 12000000 (offered 12000000 >= prevailing 10000000); employer total_wage_obligation_cents starts at 0."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "181818181", legal_name: "Pi Co", employee_count: 30 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
            - call: "POST /lcas"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", worksite_areas: ["AREA_A"], area_wage_map: { AREA_A: 10000000 }, offered_wage_cents: 12000000, prevailing_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2028-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { lca_id: $.data.id }
            - call: "POST /lcas/${lca_id}/transitions"
              payload: { to_status: "CERTIFIED" }
              as: DOLAnalyst
            - call: "GET /employers/${emp_id}"
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { oblig_after_certify: $.data.total_wage_obligation_cents }
          trigger:
            - call: "POST /lcas/${lca_id}/transitions"
              payload: { to_status: "WITHDRAWN" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
          assert:
            - "oblig_after_certify == 12000000 (obligation rose by required_wage_cents)"
            - "Employer.${emp_id}.total_wage_obligation_cents == 0 after withdrawal (restored, no drift)"
