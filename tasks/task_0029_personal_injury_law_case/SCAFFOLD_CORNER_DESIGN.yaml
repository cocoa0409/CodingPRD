              as: Paralegal
              captures: { di_id: $.data.id }
            - call: "POST /damages-items/${di_id}/include"
              payload: {}
              as: Attorney
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_dr"
              captures: { dl_id: $.data.id }
            - call: "POST /demand-letters/${dl_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "partner_dr"
            - call: "POST /medical-liens"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}", asserted_amount_cents: 500000 }
              as: Paralegal
              captures: { lien_id: $.data.id }
            - call: "POST /settlement-offers"
              payload: { case_id: "${case_id}", offer_amount_cents: 6000000, by_party: "CARRIER" }
              as: Attorney
