  - rule_id: priority_pair_validation_conflict
    instances:

      - name: settle_draft_statement_below_floor_reports_state_over_fiscal
        grounds:
          - validations[priority 9 — statement lifecycle_state does not admit the operation]
          - validations[priority 13 — net_payable_cents >= MIN_PAYOUT_CENTS]
          - state_machines.AgentStatement.settlement_UNSETTLED_to_SETTLED
          - errors.ERR_STATEMENT_STATE_INVALID
          - errors.ERR_BELOW_MIN_PAYOUT
        distinguishing_aspect: |
          Pair (state band 9) x (fiscal band 13). The statement is both
          un-issued AND worth only 32 cents, so both the lifecycle precondition and the
          MIN_PAYOUT_CENTS floor are violated by one settle call; only
          ERR_STATEMENT_STATE_INVALID (409) may surface. An implementation that computes
          money before checking lifecycle returns ERR_BELOW_MIN_PAYOUT and fails here
          while still passing every single-violation settle test.
        test_recipe:
          setup:
            - "Program P1 with a thin merchant M2 (per-transaction fee 20, no equipment, no chargebacks)."
            - "A POSTED 2026-07 batch whose only line nets 70 cents, giving A1 a DRAFT statement of 32 cents — far below MIN_PAYOUT_CENTS (2500)."
            - "The statement is NEVER issued, so its lifecycle_state is DRAFT while its settlement_state is UNSETTLED."
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "FirstAtlantic Core", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.45, override_pct: 0.45, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-6001", monthly_minimum_cents: 2500, per_transaction_fee_cents: 20, equipment_lease_monthly_cents: 0, boarded_on: "2026-01-05" }
              as: IsoAdmin
              captures: { m2: $.data.id }
            - call: "POST /merchants/${m2}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:thin-0001" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m2}", transaction_count: 125, sales_volume_cents: 100000, interchange_cents: 1800, assessments_cents: 130, gross_income_cents: 3200 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
            - call: "GET /agent-statements"
              payload: { agent_id: "${a1}", period_month: "2026-07" }
              as: ResidualController
              captures: { st: "$.data[0].id" }
          trigger:
            - call: "POST /agent-statements/${st}/settle"
              payload: { paid_on: "2026-08-15" }
              as: ResidualController
              is_negative_trigger: true
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_STATEMENT_STATE_INVALID"
            - "error_id != ERR_BELOW_MIN_PAYOUT   # band 9 outranks band 13"
            - "AgentStatement.${st}.net_payable_cents == 32 (so the fiscal floor really is violated too) and settlement_state is still UNSETTLED and paid_on is still null"

      - name: batch_ingest_overlap_and_duplicate_checksum_reports_temporal_over_constraint
        grounds:
          - validations[priority 11 — half-open coverage interval overlap]
          - validations[priority 12 — file_checksum uniqueness]
          - errors.ERR_COVERAGE_OVERLAP
          - errors.ERR_DUPLICATE_FILE_CHECKSUM
          - endpoints.POST /residual-batches
        distinguishing_aspect: |
          Pair (temporal band 11) x (constraint band 12) on the SAME request: the new
          batch both overlaps B1's coverage interval and reuses B1's file_checksum.
          ERR_COVERAGE_OVERLAP must win. The second trigger call proves the loser rule
          is live — same duplicate checksum, disjoint coverage — so the test cannot be
          passed by simply never implementing the checksum check.
        test_recipe:
          setup:
            - "Program P1 with one NORMALIZED batch B1 for 2026-07 covering [2026-07-01, 2026-08-01) under file_checksum sha256:aaa1."
            - "No other batch exists on P1."
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "FirstAtlantic Core", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:aaa1" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
          trigger:
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-08", coverage_start: "2026-07-15", coverage_end: "2026-08-20", file_checksum: "sha256:aaa1" }
              as: ResidualAnalyst
              is_negative_trigger: true
              captures: { err: $.data.error_id }
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-09", coverage_start: "2026-09-01", coverage_end: "2026-10-01", file_checksum: "sha256:aaa1" }
              as: ResidualAnalyst
              is_negative_trigger: true
              captures: { err2: $.data.error_id }
          assert:
            - "first trigger call: HTTP 409 with error_id == ERR_COVERAGE_OVERLAP, never ERR_DUPLICATE_FILE_CHECKSUM"
            - "second trigger call: HTTP 409 with error_id == ERR_DUPLICATE_FILE_CHECKSUM   # control: the band-12 rule is implemented"
            - "GET /residual-batches?processor_program_id=${p1} still returns total_count 1"

      - name: approve_own_unreviewed_adjustment_reports_state_over_segregation
        grounds:
          - validations[priority 9 — adjustment state does not admit the operation]
          - validations[priority 10 — X-User-ID != created_by_user_id on approve]
          - state_machines.StatementAdjustment.UNDER_REVIEW_to_APPLIED
          - errors.ERR_ADJUSTMENT_STATE_INVALID
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          Pair (state band 9) x (safety band 10), and a different error pair from the
          other two instances. The controller ctrl-1 proposes an adjustment and
          immediately approves it: the row is PROPOSED (not UNDER_REVIEW) AND the
          approver is its own author, so both preconditions fail on one call and
          ERR_ADJUSTMENT_STATE_INVALID must win. The control call routes the row through
          /review by ctrl-2 and then has ctrl-1 approve it, isolating the band-10 rule.
        test_recipe:
          setup:
            - "Program P1, agent A1 and a thin ACTIVE merchant, with a POSTED 2026-07 batch giving A1 a DRAFT statement."
            - "ResidualController user ctrl-1 proposes a DISPUTE_CREDIT adjustment of +5000 on that statement (created_by_user_id = ctrl-1, state PROPOSED)."
            - "A second PROPOSED adjustment authored by ctrl-1 exists for the control call."
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "FirstAtlantic Core", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT" }
