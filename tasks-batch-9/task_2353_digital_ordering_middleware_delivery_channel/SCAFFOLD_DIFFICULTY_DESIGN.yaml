            - "The first trigger POST /orders returns 409 ERR_CAPACITY_BUCKET_FULL because bucket_load 2 >= prep_capacity_per_bucket 2"
            - "After the clock moves to 16:15:00Z the identical request returns 201 and Order.${o3_id}.bucket_index == 45"
            - "Order.${o3_id}.promised_ready_at == 2026-08-03T16:31:00Z (base 12 + 2 x 2 load pad, PICKUP so no travel)"
            - "Store.${store_id}.open_order_count == 3 and reserved_prep_slots == 3"

      - name: empty_courier_candidate_set_rejected
        grounds:
          - calculations.courier_network_selection
          - validations[priority=30]
          - endpoints["POST /orders/{id}/dispatch"]
        distinguishing_aspect: |
          Metric is an empty-collection edge rather than a numeric threshold,
          and it is reached through a different endpoint (dispatch): every
          network is filtered out — one because is_active is false, the other
          because a MARKETPLACE network is only eligible for MARKETPLACE
          channels and the order came from an AGGREGATOR — so the candidate set
          has size 0 and dispatch is rejected; adding one active COURIER
          network takes the set to size 1 and the same dispatch succeeds.
