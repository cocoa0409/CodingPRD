      - name: budget_line_loan_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_BUDGET_LINE_LOAN_MISMATCH]"]
        distinguishing_aspect: "FK integrity across aggregates: a line item referencing a budget line that belongs to a DIFFERENT loan than the draw fails with 422 ERR_BUDGET_LINE_LOAN_MISMATCH."
