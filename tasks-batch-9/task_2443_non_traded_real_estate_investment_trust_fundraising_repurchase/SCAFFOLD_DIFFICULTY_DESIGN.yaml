  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offering_parallel_axes_independent_with_locked_escrow_axis
        grounds:
          - state_machines.Offering.registration_status
          - state_machines.Offering.escrow_status
          - state_machines.Offering.repurchase_plan_status
          - entities.Offering.fields.repurchase_plan_suspension_reason
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          The Offering carries three simultaneously live status axes that are not
          a single linear chain: registration walks EFFECTIVE -> SUSPENDED ->
          EFFECTIVE while the repurchase plan independently walks ACTIVE ->
          SUSPENDED -> ACTIVE, and the escrow axis stays pinned at its terminal
          BROKEN throughout, so the same offering row must reject an escrow FAIL
          while still accepting registration and repurchase-plan transitions.
        test_recipe:
          setup:
            - "Offering 'Northgate Core REIT' with minimum_offering_amount_cents 30000000, escrow already BROKEN off a single 30000000-cent subscription."
            - "Registration then driven EFFECTIVE -> SUSPENDED, repurchase plan driven ACTIVE -> SUSPENDED with a reason, registration driven SUSPENDED -> EFFECTIVE again."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Northgate Core REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000, rescission_window_days: 5 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_i_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Northgate Distribution LLC", crd_number: "CRD-500001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100, suitability_documentation_required: true }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Nora Whitfield", email: "nora.whitfield@example.com", state_code: "TX", net_worth_cents: 5000000000, annual_income_cents: 1000000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-N-2026-08" }
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_i_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 30000000 }
              as: SponsorOperator
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "BREAK" }
              as: ComplianceOfficer
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "SUSPEND", reason: "PROSPECTUS_SUPPLEMENT_PENDING" }
              as: ComplianceOfficer
            - call: "POST /offerings/${off_id}/repurchase-plan"
              payload: { action: "SUSPEND", reason: "MARKET_DISLOCATION" }
              as: ComplianceOfficer
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "REINSTATE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /offerings/${off_id}/repurchase-plan"
              payload: { action: "RESUME" }
              as: ComplianceOfficer
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "FAIL" }
              as: ComplianceOfficer
              captures: { escrow_fail_error: $.data.error_id }
          assert:
            - "escrow_fail_error == \"ERR_INVALID_STATE_TRANSITION\""
            - "Offering.${off_id}.registration_status == \"EFFECTIVE\""
            - "Offering.${off_id}.escrow_status == \"BROKEN\""
            - "Offering.${off_id}.repurchase_plan_status == \"ACTIVE\""
            - "Offering.${off_id}.repurchase_plan_suspension_reason == null"
            - "Offering.${off_id}.escrow_balance_cents == 0"
            - "Offering.${off_id}.gross_proceeds_cents == 30000000"
            - "Subscription.${sub_id}.status == \"ACCEPTED\""

      - name: nav_record_advisor_pushback_revision_cycle
        grounds:
          - state_machines.NavRecord.ADVISOR_REVIEW_to_DRAFT
          - state_machines.NavRecord.DRAFT_to_ADVISOR_REVIEW
