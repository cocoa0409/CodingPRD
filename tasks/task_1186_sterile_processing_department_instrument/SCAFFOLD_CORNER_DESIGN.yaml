            - { call: "POST /spd/trays/${d1}/decontamination/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${d1}/decontamination/complete", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${d1}/assembly/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${d1}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "D2" }, as: SpdTechnician, as_user_id: "${ta}", captures: { d2: "$.data.id" } }
            - { call: "POST /spd/trays/${d2}/decontamination/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${d2}/decontamination/complete", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${d2}/assembly/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${d2}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${ta}", captures: { ld: "$.data.id", cb0: "$.data.total_chargeback_cents" } }
          trigger:
            - { call: "POST /spd/sterilization-loads/${ld}/trays", payload: { tray_id: "${d1}" }, as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/sterilization-loads/${ld}/trays", payload: { tray_id: "${d2}" }, as: SpdTechnician, as_user_id: "${ta}", captures: { tc2: "$.data.tray_count" } }
            - { call: "POST /spd/sterilization-loads/${ld}/abort", as: SpdTechnician, as_user_id: "${ta}", captures: { tc0: "$.data.tray_count" } }
          assert:
            - "cb0 == null at creation (chargeback computed only at release)"
            - "tc2 == 2 after two adds; tc0 == 0 after abort (derived count reconciled on every mutation)"

      - name: response_envelope_shape_on_success_and_error
        claim_type: standard_crud
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Every response carries meta.api_request_id and meta.api_request_timestamp; success has response_type object/array with data; errors have response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 1, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/trays/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: "$.data.error_id" } }
          assert:
