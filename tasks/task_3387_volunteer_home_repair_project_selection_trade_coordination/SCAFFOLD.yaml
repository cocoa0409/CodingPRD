    description: "List events; filter by project"
    roles: [Any]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: "RebuildEvent[]"
    side_effects: []

  - method: GET
    path: "/rebuild/events/{eventId}"
