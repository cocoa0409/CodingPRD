          err: $.data.error_id
      assert:
      - the response status is 422 and error_id == ERR_PROGRAM_CLOSED
      - GET /servicing/transactions?account_id=${acct_id} returns 0 rows
      - GET /servicing/credit-programs/${g_id}/summary program_status == CLOSED
- rule_id: resource_temporal_overlap
  instances:
  - name: settlement_periods_half_open_non_overlap
    grounds:
    - validations[priority=14]
    - entities.SettlementBatch.fields.period_start
    - entities.SettlementBatch.fields.period_end
    - calculations.promo_subsidy_settlement
    distinguishing_aspect: 'SettlementBatch windows are half-open [period_start, period_end): two batches that share only an endpoint instant are disjoint, while a one-second overlap collides — adjacency is allowed, overlap is not, on the settlement-period resource.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agreement and program; the 2026-09 window is already occupied by a SETTLED batch.
      setup_api_calls:
      - call: POST /servicing/partners
        payload:
          retailer_name: Lund Floors
          loyalty_program_code: LUND
        as: ProgramAdmin
        captures:
          p_id: $.data.id
      - call: POST /servicing/agreements
        payload:
          partner_id: ${p_id}
          revenue_share_rate: 0.12
          promo_subsidy_rate: 0.3
          promo_term_months: 12
        as: ProgramAdmin
        captures:
          ag_id: $.data.id
          ag_v0: $.data.version
      - call: POST /servicing/agreements/${ag_id}/open-negotiation
        payload: {}
        as: ProgramAdmin
        captures:
          ag_v_neg: $.data.version
      - call: POST /servicing/agreements/${ag_id}/execute
        payload:
          expected_agreement_version: ${ag_v_neg}
        as: ProgramAdmin
      - call: POST /servicing/credit-programs
        payload:
          partner_id: ${p_id}
          agreement_id: ${ag_id}
          cycle_day: 1
        as: ProgramAdmin
        captures:
          g_id: $.data.id
      - call: POST /servicing/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /servicing/settlement-batches
        payload:
          agreement_id: ${ag_id}
          period_start: '2026-09-01T00:00:00Z'
          period_end: '2026-10-01T00:00:00Z'
          settlement_method: AS_CHARGED
          reconciliation_method: PROJECTED
        as: ProgramAdmin
        captures:
          b1: $.data.id
      - call: POST /servicing/settlement-batches/${b1}/finalize
        payload: {}
        as: ProgramAdmin
      trigger:
      - call: POST /servicing/settlement-batches
        payload:
          agreement_id: ${ag_id}
          period_start: '2026-10-01T00:00:00Z'
          period_end: '2026-11-01T00:00:00Z'
          settlement_method: AS_CHARGED
          reconciliation_method: PROJECTED
        as: ProgramAdmin
        captures:
          b2: $.data.id
          b2_status: $.data.batch_status
      assert:
      - SettlementBatch.${b2}.batch_status == OPEN
      - the adjacent batch is accepted because [2026-09-01, 2026-10-01) and [2026-10-01, 2026-11-01) share no instant
      - a batch with period_start 2026-09-30T23:59:59Z and period_end 2026-11-01T00:00:00Z is rejected as overlapping the SETTLED window
  - name: promotional_windows_payoff_at_expiry_boundary
    grounds:
    - state_machines.PromoPlan.transitions.ACTIVE_to_EXPIRED
    - entities.PromoPlan.fields.promo_start_at
    - entities.PromoPlan.fields.promo_expires_at
    - calculations.promo_subsidy_at_risk
    distinguishing_aspect: 'PromoPlan occupancy uses an inclusive-expiry rule on a different resource: the plan is expired when the clock is at or after promo_expires_at, and a payoff one logical day before expiry is in-term while on the expiry instant it is not.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One program and one promo purchase (120000/12mo) whose promo_expires_at is 2027-08-30T00:00:00Z.
      setup_api_calls:
