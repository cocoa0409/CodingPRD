            - "run B is CANCELLED and the die is WORN at trigger time (both failures hold)"
            - "error_id == ERR_INVALID_STATE_TRANSITION (state priority 6 wins)"
            - "NOT ERR_DIE_WORN (business_safety priority 10 loses); HTTP 409"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: die_hits_exactly_at_wear_limit
        grounds:
          - calculations.die_wear_accumulation
          - entities.DieSet.fields.cumulative_hits
        distinguishing_aspect: |
          Boundary on an INTEGER hit-count metric via POST /forge-runs/{id}/heats:
          27 hits (one part short) leaves the die INSTALLED; the next heat lands
          cumulative_hits EXACTLY on wear_limit_hits (30) and the >= comparison
          flips the die to WORN. Distinct metric and endpoint from the flash
          percentage boundary below.
        test_recipe:
          setup:
            - "Alloy AISI-4140 (3 strokes/part); DIE-W32 wear_limit_hits 30 installed on WC-1"
            - "Heat H-5001 CERT_VERIFIED; 10 billets; charges READY (9 + 1); WO-12 run started"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-5001", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 10 } ] }, as: SawOperator, captures: { b1: "$.data[0].id", b2: "$.data[1].id", b3: "$.data[2].id", b4: "$.data[3].id", b5: "$.data[4].id", b6: "$.data[5].id", b7: "$.data[6].id", b8: "$.data[7].id", b9: "$.data[8].id", b10: "$.data[9].id" } }
