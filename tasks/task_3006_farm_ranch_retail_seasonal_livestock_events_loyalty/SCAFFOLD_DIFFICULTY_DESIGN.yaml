  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: chick_fulfill_gated_by_lot_state
        grounds:
          - state_machines.ChickOrder.BROODER_VERIFIED_to_FULFILLED
          - state_machines.LivestockLot
        distinguishing_aspect: |
          Entity pair ChickOrder -> LivestockLot: the order's fulfill transition
          is governed by the state of a DIFFERENT entity (its lot). Once the lot
          leaves ON_SALE the closure cascade expires the BROODER_VERIFIED order,
          and the subsequent fulfill surfaces ERR_INVALID_STATE_TRANSITION — the
          order can never be fulfilled against a closed lot even though its own
          verification was valid.
        test_recipe:
          setup:
            - "Spring store; lot ON_SALE; order BROODER_VERIFIED; fresh care log posted; lot then closed; clock 2026-03-10T10:00:00Z."
          setup_api_calls:
            - *d3_clock_mar10
            - *d3_store
            - *d3_campaign
            - *d3_teardown
            - *d3_reset
            - *d3_verify
            - *d3_activate
            - *d3_schedule
            - *d3_publish
            - *d3_lot
            - *d3_open_sale
            - *d3_account
            - *d3_order6
            - *d3_brooder_ok
            - call: "POST /livestock-lots/${lot_id}/care-logs"
              payload: { entry_type: "FEEDING" }
              as: StoreAssociate
            - call: "POST /livestock-lots/${lot_id}/close-sale"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /chick-orders/${order_id}/fulfill"
              payload: {}
              as: StoreAssociate
              captures: { gate_err: $.data.error_id }
            - call: "GET /chick-orders/${order_id}"
              payload: {}
              as: StoreManager
              captures: { ord_after: $.data.status }
          assert:
            - "ord_after == EXPIRED (the lot closure cascade expired the BROODER_VERIFIED order and released its 6 birds)"
            - "gate_err == ERR_INVALID_STATE_TRANSITION (fulfill on the cascade-expired order — the lot's state change, not the order's own fields, made fulfillment impossible)"

      - name: booking_gated_by_service_event_state
        grounds:
          - state_machines.EventBooking
          - state_machines.ServiceEvent.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Entity pair EventBooking -> ServiceEvent (different pair than
          ChickOrder -> LivestockLot): booking creation is rejected while the
          event is DRAFT and accepted once the same event is PUBLISHED, with the
          booking's own fields unchanged.
        test_recipe:
          setup:
            - "Store; PET_WASH event DRAFT on wash-bay-1, 2026-09-15, window 09:00-12:00, slot 30, buffer 0, capacity 1; account; clock 2026-09-10T09:00:00Z."
