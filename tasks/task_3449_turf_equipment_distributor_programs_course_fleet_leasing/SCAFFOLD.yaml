# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not listed in the endpoint's roles" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed identity does not resolve, or the acting identity does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body reference does not resolve (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, type mismatch, or unknown transition target" }
  - { id: ERR_EMPTY_ORDER, http: 422, condition: "Parts order submitted/created with zero lines" }
  - { id: ERR_ZERO_QUANTITY_LINE, http: 422, condition: "Parts order line with qty < 1" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not declared for the resource's current state, or resource is terminal" }
  - { id: ERR_STALE_LEASE_VERSION, http: 412, condition: "expected_lease_version != lease.version on a lease transition" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version != claim.version on a claim transition" }
  - { id: ERR_TERRITORY_MISMATCH, http: 409, condition: "Course assigned to a different distributor, or claim technician/unit belongs to another distributor" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "Lease start_date before current logical date, or irrigation install_window_end not after current date" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Irrigation install window half-open overlap with a sibling project of the same course; adjacency allowed" }
  - { id: ERR_LEASE_CYCLE_OVERLAP, http: 409, condition: "New lease closed [start_date, end_date] intersects a sibling APPROVED|ACTIVE|TURNOVER_IN_PROGRESS lease of the same course; shared boundary dates count as overlap" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Claim unit age from delivered_at exceeds the model's factory_warranty_months" }
  - { id: ERR_TECHNICIAN_CERT_INVALID, http: 409, condition: "Claim references a technician whose cert_status is not CERT_ACTIVE" }
  - { id: ERR_PART_DISCONTINUED, http: 422, condition: "Parts order line references a part in DISCONTINUED (or SUPERSEDED without mapping) support_status" }
  - { id: ERR_MODEL_DISCONTINUED, http: 409, condition: "Lease line or irrigation controller references a model past its sales window" }
  - { id: ERR_STALE_REFERENCE, http: 409, condition: "Irrigation design approval when the pinned controller model has left CATALOG_ACTIVE since submission" }
  - { id: ERR_SPEC_VIOLATION, http: 422, condition: "Lease approve when spec_compliant is false (tier or turf mismatch on any line)" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "Unit delivery with a serial_number already used by another unit of the same model" }
  - { id: ERR_SUPERSESSION_CYCLE, http: 422, condition: "Superseding a part would create a cycle in the supersession graph" }
  - { id: ERR_DISTRIBUTOR_NOT_ACTIVE, http: 409, condition: "Distributor standing is not ACTIVE where the workflow requires it" }
  - { id: ERR_WRONG_CHANNEL, http: 422, condition: "Distributor channel does not match the workflow (equipment vs irrigation)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Lease total_contract_value_cents exceeds the course credit_limit_cents at approve" }
  - { id: ERR_CLAIM_CAP_EXCEEDED, http: 422, condition: "Paying the claim would push the distributor's calendar-year paid total past annual_claim_cap_cents" }
  - { id: ERR_LEASE_NOT_STARTED, http: 409, condition: "Activation before start_date, or installation before install_window_start" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CorporateAdmin
    description: "Manufacturer corporate operations: catalog, certification, compliance reviews, lease approval, claim adjudication, clock and rollover"
    identity: opaque
    exclusive_operations:
      - "POST /turf/distributors, /turf/courses, /turf/models, /turf/parts"
      - "POST /turf/technicians/{id}/certify, POST /turf/distributors/{id}/compliance_review"
      - "POST /turf/_clock/set_current_utc, POST /turf/admin/run_season_rollover"
      - "Lease SPEC_REVIEW -> APPROVED; claim adjudication and payment"
    shared_operations:
      - "reads; order ALLOCATED/SHIPPED transitions; lease DRAFT/CANCELLED transitions"
  - name: DistributorManager
    description: "Runs one distributorship: technicians, fleet leases, unit deliveries and returns, appraisals, parts orders, warranty claims"
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /turf/technicians, /turf/leases, /turf/appraisals, /turf/parts-orders, /turf/warranty-claims"
      - "Unit DELIVERED/RETURNED/REMARKET_LISTED/RETIRED; order SUBMITTED/RECEIVED/CANCELLED; claim DISPUTED"
    shared_operations:
      - "reads of own distributor scope; lease DRAFT/CANCELLED transitions"
  - name: CourseManager
    description: "Runs one golf course: accepts deliveries, requests returns, answers appraisals, approves irrigation designs, buys remarketed units"
    identity: "entity_backed:GolfCourse"
    exclusive_operations:
      - "Unit IN_SERVICE and RETURN_REQUESTED; appraisal ACCEPTED/DISPUTED; irrigation APPROVED; unit RESERVED/SOLD"
    shared_operations:
      - "reads of own course, leases, units, appraisals"
  - name: IrrigationDealer
    description: "Runs one irrigation-channel distributor: project briefs, design submission, installation, commissioning"
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /turf/irrigation-projects and its DESIGN_SUBMITTED/BRIEF/INSTALLED/COMMISSIONED transitions"
    shared_operations:
      - "reads of own dealer scope"
