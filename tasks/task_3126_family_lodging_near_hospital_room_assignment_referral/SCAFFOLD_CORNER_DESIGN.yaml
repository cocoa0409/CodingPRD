              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: VolunteerCoordinator
              as_user_id: "vc-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "Referral.${ref_id}.status remains PENDING"

      - name: family_contact_cannot_create_house
        claim_type: role_denial
        grounds: [roles.FamilyContact, endpoints.POST_/api/houses, errors.ERR_FORBIDDEN]
        distinguishing_aspect: "FamilyContact has no administrative surface: POST /api/houses is refused with ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "One hospital exists."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
          trigger:
            - call: "POST /api/houses"
              payload: { name: "Rogue House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: FamilyContact
              as_user_id: "some-family-id"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stay_request_create_stale_family_version_rejected
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[stay-request-create-stale-family]', errors.ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Family.version: after the first request bumps Family.version from 1 to 2, a second create carrying the stale version 1 is refused 412 — and with the fresh version it legitimately supersedes the first request."
        test_recipe:
          setup:
            - "Hospital, house, family F (version captured at creation), and a VERIFIED referral. First stay request created with the captured version."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id, fam_v1: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 3, self_reported_acuity: "MODERATE", expected_family_version: "${fam_v1}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { sr1_id: $.data.id }
            - call: "GET /api/families/${fam_id}"
              payload: {}
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { fam_v2: $.data.version }
          trigger:
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 5, self_reported_acuity: "HIGH", expected_family_version: "${fam_v1}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
