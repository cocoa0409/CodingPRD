        distinguishing_aspect: |
          With BOTH storage_id and hauler_id absent from the database, the flat topology's
          declaration-order rule must surface ERR_STORAGE_NOT_FOUND (storage_id is declared
          before hauler_id in §1.1), and only after storage_id is fixed does the hauler code appear.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation with a COVERED permit and one EARTHEN_LAGOON structure"
