            - { call: "POST /shifts", payload: { volunteer_id: "${v}", shift_role: "FLOOR", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ShopCoordinator, captures: { sh2: $.data.id } }
            - { call: "POST /shifts", payload: { volunteer_id: "${v}", shift_role: "FLOOR", scheduled_start: "2026-08-04T09:00:00Z", scheduled_end: "2026-08-04T10:00:00Z" }, as: ShopCoordinator, captures: { sh3: $.data.id } }
            - { call: "POST /shifts", payload: { volunteer_id: "${v}", shift_role: "FLOOR", scheduled_start: "2026-08-20T09:00:00Z", scheduled_end: "2026-08-20T10:00:00Z" }, as: ShopCoordinator, captures: { sh4: $.data.id } }
