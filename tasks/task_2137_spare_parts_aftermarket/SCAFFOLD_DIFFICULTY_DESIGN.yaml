  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_fiscal_on_allocation_request_create
        grounds:
          - validations[priority=9]
          - validations[priority=29]
          - errors[ERR_CAMPAIGN_STATE_INVALID]
          - errors[ERR_DEALER_CREDIT_HOLD]
        distinguishing_aspect: |
          Category pair `state` (priority 9) versus `business_fiscal` (priority 29): one request
          violates both — the campaign is still DRAFT and the dealer is on credit hold — and the
          server must answer ERR_CAMPAIGN_STATE_INVALID with HTTP 409, never ERR_DEALER_CREDIT_HOLD
          with HTTP 402.
        test_recipe:
          setup:
            - "a SILVER dealer with credit_limit_cents 0 and a +100 cent manual debit, so outstanding_balance_cents == 100 and credit_hold == true"
            - "part PRI-1 with a CURRENT 12-month INSTALLED_BASE_RATE forecast of 0 units (no installed units exist)"
            - "a LastTimeBuyCampaign on that part still in status DRAFT with remaining_qty 0"
          setup_api_calls:
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-HOLD", tier: "SILVER", region: "LATAM", credit_limit_cents: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
            - call: "POST /aftermarket/dealers/${d_id}/balance-adjustments"
              payload: { amount_cents: 100, reason: "opening debit to force credit hold" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /aftermarket/parts"
              payload: { part_number: "PRI-1", description: "Priority probe part", unit_cost_cents: 1000, lead_time_days: 30, weight_kg: 1.0 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/parts/${p_id}/forecasts"
              payload: { horizon_months: 12, method: "INSTALLED_BASE_RATE" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "GET /aftermarket/parts/${p_id}"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_v: $.data.version }
            - call: "POST /aftermarket/last-time-buy-campaigns"
              payload: { part_id: "${p_id}", method: "FLAT_RATE", coverage_years: 5, ltb_window_start: "2026-09-01T00:00:00Z", ltb_window_end: "2026-10-01T00:00:00Z", expected_part_version: "${p_v}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { c_id: $.data.id }
            - call: "GET /aftermarket/last-time-buy-campaigns/${c_id}"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { c_v: $.data.version }
          trigger:
            - call: "POST /aftermarket/allocation-requests"
              payload: { campaign_id: "${c_id}", dealer_id: "${d_id}", requested_units: 5, expected_campaign_version: "${c_v}" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_CAMPAIGN_STATE_INVALID"
            - "response data.error_id != ERR_DEALER_CREDIT_HOLD"
            - "Dealer.${d_id}.credit_hold == true (the fiscal violation really was present)"
            - "LastTimeBuyCampaign.${c_id}.status == DRAFT and version is unchanged"
            - "GET /aftermarket/allocation-requests?campaign_id=${c_id} returns total_count == 0"

      - name: safety_beats_referential_on_part_line_create
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_PART_NOT_APPLICABLE]
          - errors[ERR_PART_SUPERSEDED]
        distinguishing_aspect: |
          A DIFFERENT category pair — `business_safety` (priority 10) versus
          `business_referential` (priority 12): the requested part is both inapplicable to the
          machine's build revision and already SUPERSEDED, and the answer must be
          ERR_PART_NOT_APPLICABLE, because fitting a wrong part is a safety failure that
          outranks the catalogue-successor rule.
        test_recipe:
          setup:
            - "one ACTIVE DESIRABLE price rule with base_uplift_pct 0.35, max_uplift_pct 0.60, min_margin_pct 0.20"
