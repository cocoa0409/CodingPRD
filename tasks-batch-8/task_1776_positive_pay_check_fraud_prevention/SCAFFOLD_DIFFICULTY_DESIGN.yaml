  - rule_id: priority_pair_validation_conflict
    instances:
      - name: exception_not_open_beats_deadline_passed
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_EXCEPTION_NOT_OPEN]
          - errors[ERR_DECISION_DEADLINE_PASSED]
        distinguishing_aspect: |
          Category pair {state, business_temporal}: after DAILY_SWEEP defaults the
          exception, a decision attempt violates BOTH 'not OPEN' (p7) and 'past
          deadline' (p8); the state error must win.
