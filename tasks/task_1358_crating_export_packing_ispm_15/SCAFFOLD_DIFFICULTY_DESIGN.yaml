            - "first seal at stamps_available == 1 succeeds: status SEALED, serial ISPM15-HT-2026-0051-0001 (> 0 boundary passes)"
            - "second seal at stamps_available == 0 fails: error_id == ERR_STAMPS_EXHAUSTED (zero-count boundary)"
            - "Crate.${crate2_id}.status remains PACKED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: seal_requires_approved_hazmat_declaration
        grounds:
          - state_machines.Crate.PACKED_to_SEALED
          - state_machines.HazmatDeclaration.SUBMITTED_to_APPROVED
          - validations[priority=19]
        distinguishing_aspect: |
          Entity pair Crate -> HazmatDeclaration: the crate's SEALED transition is
          gated on a DIFFERENT entity's state (declaration APPROVED). Same setup
          fails at SUBMITTED, then succeeds after the declaration is approved —
          the crate itself is untouched between attempts.
        test_recipe:
          setup:
            - "Hazmat item (dg_class '3'), declaration created by ShopForeman u-foreman-1 and SUBMITTED; crate PACKED; batch has 2 stamps"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Haz Gate Co", site_code: "HZG-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Paint line robot", length_cm: 100, width_cm: 80, height_cm: 60, weight_kg: 40, fragile_class: STANDARD, hazmat: true, declared_value_cents: 120000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0060", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 5000, stamps_acquired: 2 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/items/${item_id}/hazmat-declarations", payload: { un_number: "UN1263", dg_class: "3", packing_group: "II" }, as: ShopForeman, as_user_id: "u-foreman-1", captures: { decl_id: $.data.id } }
            - { call: "POST /crating/hazmat-declarations/${decl_id}/submit", payload: {}, as: ShopForeman, as_user_id: "u-foreman-1" }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /crating/packing-jobs/${job_id}/start-packing", payload: {}, as: ShopForeman }
            - { call: "POST /crating/items/${item_id}/crates", payload: { design_id: "${design_id}" }, as: ShopForeman, captures: { crate_id: $.data.id } }
            - { call: "POST /crating/crates/${crate_id}/build", payload: {}, as: ShopForeman }
            - { call: "POST /crating/crates/${crate_id}/pack", payload: { indicator_g: 75, moisture_barrier: NONE }, as: ShopForeman }
          trigger:
            - { call: "POST /crating/crates/${crate_id}/seal", payload: {}, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /crating/hazmat-declarations/${decl_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "u-officer-9" }
            - { call: "POST /crating/crates/${crate_id}/seal", payload: {}, as: ComplianceOfficer, captures: { seal_state: $.data.status } }
          assert:
            - "seal with declaration SUBMITTED: error_id == ERR_HAZMAT_DECLARATION_REQUIRED"
            - "after HazmatDeclaration.${decl_id} -> APPROVED (approver u-officer-9 != preparer u-foreman-1): retry seal succeeds, Crate status == SEALED"
            - "the only state that changed between attempts is the declaration's — the Crate entity was not modified"
      - name: onsite_start_packing_requires_confirmed_permit
        grounds:
          - state_machines.PackingJob.DESIGN_to_PACKING
          - state_machines.OnsitePermit.REQUESTED_to_CONFIRMED
          - validations[priority=15]
        distinguishing_aspect: |
          Entity pair PackingJob -> OnsitePermit (different pair than the
          Crate -> HazmatDeclaration instance): start-packing on an ONSITE job is
          gated on the existence of a CONFIRMED permit; a merely REQUESTED permit
          does not satisfy the guard.
        test_recipe:
          setup:
            - "ONSITE job in DESIGN (item + approved design + accepted quote); a permit exists but only REQUESTED at first attempt"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Field Co", site_code: "FLD-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: ONSITE, incoterm: EXW }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Lathe bed", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 45000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0061", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 5000, stamps_acquired: 2 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/start-packing", payload: {}, as: ShopForeman, captures: { err1: $.data.error_id } }
            - { call: "POST /crating/packing-jobs/${job_id}/onsite-permit", payload: { window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: LogisticsCoordinator, captures: { permit_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/start-packing", payload: {}, as: ShopForeman, captures: { err2: $.data.error_id } }
            - { call: "POST /crating/onsite-permits/${permit_id}/confirm", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /crating/packing-jobs/${job_id}/start-packing", payload: {}, as: ShopForeman, captures: { job_state: $.data.status } }
          assert:
            - "no permit: error_id == ERR_PERMIT_REQUIRED"
            - "permit REQUESTED (not CONFIRMED): error_id == ERR_PERMIT_REQUIRED again"
            - "after confirm: start-packing succeeds, PackingJob.status == PACKING"

  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_half_open_adjacency_vs_overlap
        grounds:
          - validations[priority=26]
          - entities.LaborBooking.fields.start_at
          - entities.LaborBooking.fields.end_at
        distinguishing_aspect: |
          Resource = Crew, interval semantics = strict half-open [start_at, end_at):
          the booking starting exactly at the previous booking's end_at (12:00)
          is ACCEPTED (adjacency), while [11:00,13:00) intersecting two existing
          bookings is REJECTED with ERR_CREW_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Accepted SHOP job; Crew with SHOP_BUILD; existing bookings [09:00,12:00) and [12:00,14:00) on that crew"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Labor Co", site_code: "LAB-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Fixture", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 40, fragile_class: STANDARD, declared_value_cents: 20000 }, as: SalesRep, captures: { item_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /crating/crews", payload: { name: "Crew Alpha", capabilities: [SHOP_BUILD] }, as: ShopForeman, captures: { crew_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/labor-bookings", payload: { crew_id: "${crew_id}", mode: SHOP, start_at: "2026-08-10T09:00:00Z", end_at: "2026-08-10T12:00:00Z" }, as: ShopForeman, captures: { bk1: $.data.id } }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/labor-bookings", payload: { crew_id: "${crew_id}", mode: SHOP, start_at: "2026-08-10T12:00:00Z", end_at: "2026-08-10T14:00:00Z" }, as: ShopForeman, captures: { bk2: $.data.id, bk2_hours: $.data.hours } }
            - { call: "POST /crating/packing-jobs/${job_id}/labor-bookings", payload: { crew_id: "${crew_id}", mode: SHOP, start_at: "2026-08-10T11:00:00Z", end_at: "2026-08-10T13:00:00Z" }, as: ShopForeman, captures: { err: $.data.error_id } }
          assert:
            - "adjacent booking [12:00,14:00) after [09:00,12:00) is ACCEPTED (half-open: end is exclusive), hours == 2.0"
            - "overlapping booking [11:00,13:00) is REJECTED with ERR_CREW_DOUBLE_BOOKED"
            - "exactly 2 bookings exist for the crew afterwards"
      - name: permit_buffered_window_conflict
        grounds:
          - validations[priority=27]
          - entities.OnsitePermit.fields.window_start
          - entities.OnsitePermit.fields.site_code
        distinguishing_aspect: |
          Resource = site_code (via OnsitePermit), interval semantics = CLOSED
          window plus a 60-minute buffer on both sides — different semantics than
          the crew's half-open rule: a permit starting at 12:30 after a 09:00-12:00
          permit is REJECTED (inside the 60-minute post-buffer), while 13:00 is
          ACCEPTED (exactly at the buffer edge, inclusive pass).
        test_recipe:
          setup:
            - "Customer with site_code SITE-BUF; two ONSITE jobs on that customer; permit P1 09:00-12:00 REQUESTED on job1"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Site Co", site_code: "SITE-BUF", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: ONSITE, incoterm: EXW }, as: SalesRep, captures: { job1_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: ONSITE, incoterm: EXW }, as: SalesRep, captures: { job2_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job1_id}/onsite-permit", payload: { window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: LogisticsCoordinator, captures: { permit1_id: $.data.id } }
          trigger:
            - { call: "POST /crating/packing-jobs/${job2_id}/onsite-permit", payload: { window_start: "2026-08-10T12:30:00Z", window_end: "2026-08-10T14:00:00Z" }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /crating/packing-jobs/${job2_id}/onsite-permit", payload: { window_start: "2026-08-10T13:00:00Z", window_end: "2026-08-10T15:00:00Z" }, as: LogisticsCoordinator, captures: { permit2_id: $.data.id } }
          assert:
            - "12:30 start is REJECTED with ERR_PERMIT_WINDOW_CONFLICT (12:30 < 12:00 + 60min buffer)"
            - "13:00 start is ACCEPTED (exactly at buffer edge — buffer satisfied inclusively)"
            - "OnsitePermit.${permit2_id}.site_code == SITE-BUF (resource key copied from Customer)"

  - rule_id: compensating_invariant
    instances:
      - name: wood_ledger_reserve_release_conservation
        grounds:
          - state_machines.CrateDesign.IN_REVIEW_to_APPROVED
          - state_machines.CrateDesign.APPROVED_to_SUPERSEDED
          - entities.WoodBatch.fields.available_board_feet
        distinguishing_aspect: |
          Conserved quantity = board feet: after the forward action (approve
          reserves 27) and its compensating action (job cancel releases 27),
          received(500) == reserved(0) + consumed(0) + scrapped(0) + available(500)
          holds exactly — the ledger returns to its pre-action value.
        test_recipe:
          setup:
            - "QUOTED job with one item (bf 27); batch HT-2026-0070 received 500; design approved (reserved 27, available 473)"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Wood Co", site_code: "WOD-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Pump", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 30000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0070", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 500, stamps_acquired: 0 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "GET /crating/wood-batches/${batch_id}", payload: {}, as: ComplianceOfficer, captures: { reserved_mid: $.data.reserved_board_feet, avail_mid: $.data.available_board_feet } }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/cancel", payload: {}, as: SalesRep }
            - { call: "GET /crating/wood-batches/${batch_id}", payload: {}, as: ComplianceOfficer, captures: { reserved_end: $.data.reserved_board_feet, avail_end: $.data.available_board_feet, consumed_end: $.data.consumed_board_feet, scrapped_end: $.data.scrapped_board_feet } }
          assert:
            - "after approve: reserved_board_feet == 27, available_board_feet == 473"
            - "after cancel (compensating action): reserved == 0, consumed == 0, scrapped == 0, available == 500"
            - "invariant: reserved + consumed + scrapped + available == received_board_feet (500) at both observation points"
      - name: container_payload_load_unload_conservation
        grounds:
          - state_machines.Crate.SEALED_to_LOADED
          - state_machines.Crate.LOADED_to_SEALED
          - entities.Container.fields.payload_used_kg
        distinguishing_aspect: |
          Conserved quantity = container payload kilograms (different conserved
          quantity than board feet): load-crate adds exactly gross 98.6 and its
          compensating unload-crate subtracts exactly 98.6, returning
          payload_used_kg to 0 and the crate to SEALED — no drift.
        test_recipe:
          setup:
            - "One SEALED crate (item 50x50x50 / 50 kg -> gross 98.6) on a 20FT container (max 21770, dunnage 0)"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Payload Co", site_code: "PAY-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Gearmotor", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 30000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0071", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 500, stamps_acquired: 2 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /crating/packing-jobs/${job_id}/start-packing", payload: {}, as: ShopForeman }
            - { call: "POST /crating/items/${item_id}/crates", payload: { design_id: "${design_id}" }, as: ShopForeman, captures: { crate_id: $.data.id } }
            - { call: "POST /crating/crates/${crate_id}/build", payload: {}, as: ShopForeman }
            - { call: "POST /crating/crates/${crate_id}/pack", payload: { indicator_g: 75, moisture_barrier: NONE }, as: ShopForeman }
            - { call: "POST /crating/crates/${crate_id}/seal", payload: {}, as: ComplianceOfficer }
            - { call: "POST /crating/containers", payload: { container_no: "TCLU2223334", size: 20FT, dunnage_weight_kg: 0 }, as: LogisticsCoordinator, captures: { cont_id: $.data.id } }
          trigger:
            - { call: "POST /crating/containers/${cont_id}/load-crate", payload: { crate_id: "${crate_id}" }, as: LogisticsCoordinator, captures: { crate_state_loaded: $.data.status } }
            - { call: "GET /crating/containers/${cont_id}", payload: {}, as: LogisticsCoordinator, captures: { payload_mid: $.data.payload_used_kg } }
            - { call: "POST /crating/containers/${cont_id}/unload-crate", payload: { crate_id: "${crate_id}" }, as: LogisticsCoordinator, captures: { crate_state_back: $.data.status } }
            - { call: "GET /crating/containers/${cont_id}", payload: {}, as: LogisticsCoordinator, captures: { payload_end: $.data.payload_used_kg } }
          assert:
            - "after load: Crate status == LOADED, Container.payload_used_kg == 98.6 (gross = 50 + 27*1.8)"
            - "after unload (compensating action): Crate status == SEALED, Container.payload_used_kg == 0"
            - "invariant: payload_used_kg == sum of gross over LOADED crates — 0 after the pair, no drift"
