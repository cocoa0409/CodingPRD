            - "pin transitions did NOT move lifecycle_status; lifecycle transitions did NOT move pin_status"

  # ============================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ============================================================
  - rule_id: transitive_cascade
    instances:
      - name: card_compromise_cascade_depth_3
        grounds:
          - state_machines.Card.ACTIVE_to_COMPROMISED
          - state_machines.CardAccount.OPEN_to_SUSPENDED
          - state_machines.Card.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Trigger=POST /cards/{id}/mark_compromised on the third card of an account causes a
          depth-3 transitive cascade:
          (1) Card.ACTIVE→COMPROMISED on card3 triggers the rate_threshold rule (3rd
          compromise in rolling 7-day window);
          (2) The threshold breach mutates CardAccount: risk_tier ← RESTRICTED AND
          lifecycle_status OPEN→SUSPENDED;
          (3) That account-level suspension itself cascades: every OTHER Card under the
          same account with lifecycle_status=ACTIVE flips to SUSPENDED.
          Each link is caused by the previous link (card → account → sibling cards), NOT
          by fan-out from the original mark_compromised call.
        test_recipe:
          setup:
            - "CardProgram prog7 LIVE"
            - "CardAccount acct7 OPEN"
            - "Cards c1, c2, c3, c4 all ACTIVE under acct7"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-7", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog7_id: $.data.id }
            - call: "POST /issuing/programs/${prog7_id}/bin-ranges"
              payload: { bin_prefix: "466666", range_size: 1000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog7_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts"
              payload: { program_id: "${prog7_id}", external_account_ref: "A-7", account_class: "INDIVIDUAL", daily_spend_cap_cents: 10000 }
              as: ProgramManager
              captures: { acct7_id: $.data.id }
            - call: "POST /issuing/accounts/${acct7_id}/activate"
              payload: {}
              as: ProgramManager
            # card 1
            - call: "POST /issuing/accounts/${acct7_id}/cards"
              payload: { expiry_month: 12, expiry_year: 2030, form_factor: "PHYSICAL" }
              as: ProgramManager
              captures: { c1_id: $.data.id }
            - call: "POST /issuing/cards/${c1_id}/pin"
              payload: { new_pin: "1111" }
              as: CardholderOps
            - call: "GET /issuing/cards/${c1_id}/activation-tokens"
              payload: {}
              as: CardholderOps
              captures: { tok_c1: "$.data[0].token_value" }
            - call: "POST /issuing/cards/${c1_id}/activate"
              payload: { activation_token: "${tok_c1}" }
              as: CardholderOps
            # card 2
            - call: "POST /issuing/accounts/${acct7_id}/cards"
              payload: { expiry_month: 12, expiry_year: 2030, form_factor: "PHYSICAL" }
              as: ProgramManager
              captures: { c2_id: $.data.id }
            - call: "POST /issuing/cards/${c2_id}/pin"
              payload: { new_pin: "2222" }
              as: CardholderOps
            - call: "GET /issuing/cards/${c2_id}/activation-tokens"
              payload: {}
              as: CardholderOps
              captures: { tok_c2: "$.data[0].token_value" }
            - call: "POST /issuing/cards/${c2_id}/activate"
              payload: { activation_token: "${tok_c2}" }
              as: CardholderOps
            # card 3
            - call: "POST /issuing/accounts/${acct7_id}/cards"
              payload: { expiry_month: 12, expiry_year: 2030, form_factor: "PHYSICAL" }
              as: ProgramManager
              captures: { c3_id: $.data.id }
            - call: "POST /issuing/cards/${c3_id}/pin"
              payload: { new_pin: "3333" }
              as: CardholderOps
            - call: "GET /issuing/cards/${c3_id}/activation-tokens"
              payload: {}
              as: CardholderOps
              captures: { tok_c3: "$.data[0].token_value" }
            - call: "POST /issuing/cards/${c3_id}/activate"
              payload: { activation_token: "${tok_c3}" }
              as: CardholderOps
            # card 4
            - call: "POST /issuing/accounts/${acct7_id}/cards"
              payload: { expiry_month: 12, expiry_year: 2030, form_factor: "PHYSICAL" }
              as: ProgramManager
              captures: { c4_id: $.data.id }
            - call: "POST /issuing/cards/${c4_id}/pin"
              payload: { new_pin: "4444" }
              as: CardholderOps
            - call: "GET /issuing/cards/${c4_id}/activation-tokens"
              payload: {}
              as: CardholderOps
              captures: { tok_c4: "$.data[0].token_value" }
            - call: "POST /issuing/cards/${c4_id}/activate"
              payload: { activation_token: "${tok_c4}" }
              as: CardholderOps
            # Mark c1 and c2 compromised (first two — threshold not yet reached)
            - call: "POST /issuing/cards/${c1_id}/mark_compromised"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /issuing/cards/${c2_id}/mark_compromised"
              payload: {}
              as: ComplianceOfficer
          trigger:
            # Third compromise — this is the trigger; cascade must fire
            - call: "POST /issuing/cards/${c3_id}/mark_compromised"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /issuing/accounts/${acct7_id}"
              payload: {}
              as: ProgramManager
              captures: { acct7_lifecycle: $.data.lifecycle_status, acct7_risk: $.data.risk_tier }
            - call: "GET /issuing/cards/${c4_id}"
              payload: {}
              as: ProgramManager
              captures: { c4_status: $.data.lifecycle_status }
          assert:
            - "CardAccount.${acct7_id}.risk_tier == RESTRICTED              # hop 1→2 consequence"
            - "CardAccount.${acct7_id}.lifecycle_status == SUSPENDED        # hop 2"
            - "Card.${c4_id}.lifecycle_status == SUSPENDED                  # hop 3: account cascade"

      - name: mandate_retire_cascade_depth_2
        grounds:
          - state_machines.Mandate.EFFECTIVE_to_RETIRED
          - state_machines.MandateAck.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Trigger=POST /mandates/{id}/retire causes a depth-2 transitive cascade originating
          from a DIFFERENT trigger than program_termination_cascade_depth_3:
          (1) Mandate EFFECTIVE→RETIRED causes MandateAcks in {DRAFT, RETURNED} to flip to
          REJECTED; (2) each such ack flip causes the parent CardProgram's
          authorization_rules_locked to be recomputed (false when no other SUBMITTED ack).
          Each link is caused by the previous link.
        test_recipe:
          setup:
            - "CardProgram prog8 (VISA, DEBIT_CONSUMER) LIVE"
            - "Mandate mand8 in EFFECTIVE status (clock > effective_at)"
            - "MandateAck ack8 for prog8 + mand8 in DRAFT (never submitted)"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-8", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog8_id: $.data.id }
            - call: "POST /issuing/programs/${prog8_id}/bin-ranges"
              payload: { bin_prefix: "477777", range_size: 100, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog8_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/mandates"
              payload: { network: "VISA", mandate_code: "VI-2026-Q3-RET", title: "Retiring mandate", effective_at: "2026-08-02T00:00:00Z", compliance_deadline: "2026-12-01T00:00:00Z", severity: "ADVISORY" }
              as: ComplianceOfficer
              captures: { mand8_id: $.data.id }
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /issuing/mandates/${mand8_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { mand8_status: $.data.status }
            - call: "POST /issuing/mandates/${mand8_id}/acks"
              payload: { program_id: "${prog8_id}", implementation_notes: "draft notes" }
              as: ComplianceOfficer
              captures: { ack8_id: $.data.id }
          trigger:
            - call: "POST /issuing/mandates/${mand8_id}/retire"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /issuing/mandates/${mand8_id}/acks/${ack8_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ack8_status: $.data.status }
            - call: "GET /issuing/programs/${prog8_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { prog8_lock: $.data.authorization_rules_locked }
          assert:
            - "Mandate.${mand8_id}.status == RETIRED"
            - "MandateAck.${ack8_id}.status == REJECTED                       # cascaded from mandate retire"
            - "CardProgram.${prog8_id}.authorization_rules_locked == false   # recomputed as cascade end-state"

  # ============================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_sod
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair: state (priority 6) vs business_safety (priority 7). When a MandateAck is
          already VERIFIED (terminal state) AND the request carries X-User-ID equal to
          submitted_by_user_id (would be an SoD violation if it could run), the priority
          order dictates ERR_INVALID_STATE wins because state (6) is checked BEFORE
          business_safety (7). Test asserts error_id == ERR_INVALID_STATE, not ERR_SOD_SAME_USER.
        test_recipe:
          setup:
            - "CardProgram prog9 LIVE"
            - "Mandate mand9 ANNOUNCED (or EFFECTIVE)"
            - "MandateAck ack9 VERIFIED, with submitted_by_user_id='user-cto-1'"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-9", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog9_id: $.data.id }
            - call: "POST /issuing/programs/${prog9_id}/bin-ranges"
              payload: { bin_prefix: "488888", range_size: 100, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog9_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/mandates"
              payload: { network: "VISA", mandate_code: "VI-P9", title: "M9", effective_at: "2026-09-01T00:00:00Z", compliance_deadline: "2026-12-01T00:00:00Z", severity: "REQUIRED" }
              as: ComplianceOfficer
              captures: { mand9_id: $.data.id }
            - call: "POST /issuing/mandates/${mand9_id}/acks"
              payload: { program_id: "${prog9_id}", implementation_notes: "first round" }
              as: ComplianceOfficer
              captures: { ack9_id: $.data.id }
            - call: "POST /issuing/mandates/${mand9_id}/acks/${ack9_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-cto-1"
            - call: "POST /issuing/mandates/${mand9_id}/acks/${ack9_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-cto-9"
          trigger:
            - call: "POST /issuing/mandates/${mand9_id}/acks/${ack9_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-cto-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE   # state priority 6 wins over SoD priority 7"

      - name: business_temporal_vs_business_fiscal_velocity
        grounds:
          - validations[priority=13]
          - validations[priority=18]
        distinguishing_aspect: |
          Pair: business_temporal (priority 13, ERR_VENDOR_BATCH_OVERLAP) vs business_fiscal
          (priority 18, ERR_VELOCITY_EXCEEDED) — DIFFERENT pair from instance 1.
          When a single batch submit violates both a temporal-overlap rule AND would exceed
          some fiscal limit (velocity would never apply at submit; instead use account balance
          on card activation which is fiscal priority 17). Construct: simultaneous temporal
          overlap + account balance violation on a single batch submit is not realistic;
          instead use batch submit that violates BOTH temporal (vendor has another batch on
          same date) AND referential (vendor_id is invalid). Priority 13 (temporal) vs
          priority 15 (referential) is cleaner. Rephrase: business_temporal (13) vs
          business_referential (15).
        test_recipe:
          setup:
            - "CardProgram prog10 LIVE"
            - "ProductionVendor vendA with daily_capacity=100"
            - "ProductionBatch batchExisting (vendor=vendA, scheduled=2026-08-15, status=SUBMITTED)"
            - "ProductionBatch batchNew (vendor=vendA, scheduled=2026-08-15, status=PLANNED)"
            - "A second scenario: batchNew has vendor_id intact but we're testing overlap only"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-10", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog10_id: $.data.id }
            - call: "POST /issuing/programs/${prog10_id}/bin-ranges"
              payload: { bin_prefix: "499999", range_size: 100, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog10_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/vendors"
              payload: { vendor_code: "VEND-X", capability_flags: ["EMV_CHIP"], daily_capacity_cards: 100, supported_networks: ["VISA"], is_active: true }
              as: PlatformAdmin
              captures: { vendA_id: $.data.id }
            - call: "POST /issuing/programs/${prog10_id}/production-batches"
              payload: { vendor_id: "${vendA_id}", scheduled_for_utc_date: "2026-08-15", requested_card_count: 50, unit_cost_cents: 100 }
              as: OperationsAnalyst
              captures: { batch_existing_id: $.data.id }
            - call: "POST /issuing/production-batches/${batch_existing_id}/submit"
              payload: {}
              as: OperationsAnalyst
            - call: "POST /issuing/programs/${prog10_id}/production-batches"
              payload: { vendor_id: "${vendA_id}", scheduled_for_utc_date: "2026-08-15", requested_card_count: 50, unit_cost_cents: 100 }
              as: OperationsAnalyst
              captures: { batch_new_id: $.data.id }
          trigger:
            - call: "POST /issuing/production-batches/${batch_new_id}/submit"
              payload: {}
              as: OperationsAnalyst
              captures: { err_id2: $.data.error_id }
          assert:
            - "error_id == ERR_VENDOR_BATCH_OVERLAP   # business_temporal priority 13 wins over any lower-priority failure"

  # ============================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ============================================================
  - rule_id: boundary_precision_check
    instances:
      - name: velocity_window_lower_bound_inclusive
        grounds:
          - calculations.velocity_rule_evaluation
          - validations[priority=18]
        distinguishing_aspect: |
          Metric=transaction count via POST /issuing/cards/{id}/authorizations. Boundary:
          events at exactly clock - window_seconds are INCLUDED (inclusive lower bound).
          Fixture: VELOCITY rule with window_seconds=60, max_txn_count=2. Auth A at
          t=100 (approved). Auth B at t=160 (exactly 60s later — at the inclusive boundary,
          so still inside the window when evaluated at t=161). At t=161: window is [101, 161];
          auth A at t=100 is OUTSIDE; auth B at t=160 is INSIDE (count=1). A new auth C of
          1 cent at t=161 would have count_in_window + 1 = 2 = max → APPROVED.
          Counter-fixture at t=160: window is [100, 160]; auth A at t=100 IS at the inclusive
          boundary → count=1 (both A and B); new auth of 1 cent at t=160 would have
          count_in_window+1 = 3 > 2 → DECLINED_VELOCITY.
        test_recipe:
          setup:
            - "CardProgram prog11 (VISA, DEBIT_CONSUMER) LIVE; account OPEN; card ACTIVE"
            - "VELOCITY rule on account: window_seconds=60, max_txn_count=2, max_amount_cents=1000000, ACTIVE"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-11", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 10000000 }
              as: ProgramManager
              captures: { prog11_id: $.data.id }
            - call: "POST /issuing/programs/${prog11_id}/bin-ranges"
              payload: { bin_prefix: "411100", range_size: 100, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog11_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts"
              payload: { program_id: "${prog11_id}", external_account_ref: "A-11", account_class: "INDIVIDUAL", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { acct11_id: $.data.id }
            - call: "POST /issuing/accounts/${acct11_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts/${acct11_id}/fund"
              payload: { amount_cents: 100000 }
              as: FinanceController
            - call: "POST /issuing/accounts/${acct11_id}/cards"
              payload: { expiry_month: 12, expiry_year: 2030, form_factor: "PHYSICAL" }
              as: ProgramManager
              captures: { card11_id: $.data.id }
            - call: "POST /issuing/cards/${card11_id}/pin"
              payload: { new_pin: "1111" }
              as: CardholderOps
            - call: "GET /issuing/cards/${card11_id}/activation-tokens"
              payload: {}
              as: CardholderOps
              captures: { tok11: "$.data[0].token_value" }
            - call: "POST /issuing/cards/${card11_id}/activate"
              payload: { activation_token: "${tok11}" }
              as: CardholderOps
            - call: "POST /issuing/authorization-rules"
              payload: { subject_kind: "ACCOUNT", subject_ref: "${acct11_id}", rule_kind: "VELOCITY", window_seconds: 60, max_txn_count: 2, max_amount_cents: 1000000, priority_rank: 1 }
              as: ComplianceOfficer
              captures: { rule11_id: $.data.id, rule11_v: $.data.version }
            - call: "POST /issuing/authorization-rules/${rule11_id}/activate"
              payload: { expected_rule_version: "${rule11_v}" }
              as: ComplianceOfficer
            # Seed 2 auths inside the window: t=00:00:00 and t=00:00:30
            - call: "POST /issuing/cards/${card11_id}/authorizations"
              payload: { amount_cents: 100, mcc: "5411", country_code: "US" }
              as: CardholderOps
              captures: { authA_id: $.data.id, authA_decision: $.data.decision }
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:30Z" }
              as: PlatformAdmin
            - call: "POST /issuing/cards/${card11_id}/authorizations"
              payload: { amount_cents: 100, mcc: "5411", country_code: "US" }
              as: CardholderOps
              captures: { authB_id: $.data.id, authB_decision: $.data.decision }
          trigger:
            # Move clock to t=00:01:00 — exactly 60s after auth A. Auth A is at the inclusive
            # lower bound so still counted. Window [00:00:00, 00:01:00] contains A and B.
            # count_in_window = 2; new auth → 2+1 = 3 > 2 → DECLINED_VELOCITY.
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:01:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/cards/${card11_id}/authorizations"
              payload: { amount_cents: 100, mcc: "5411", country_code: "US" }
              as: CardholderOps
              captures: { authC_decision: $.data.decision }
          assert:
            - "AuthorizationEvent.${authA_id}.decision == APPROVED"
            - "AuthorizationEvent.${authB_id}.decision == APPROVED"
            - "third auth decision == DECLINED_VELOCITY   # inclusive lower bound keeps authA in window"

      - name: campaign_empty_selection_zero_count
        grounds:
          - calculations.reissue_batch_selection
          - validations[priority=13]
        distinguishing_aspect: |
          Metric=card set cardinality via POST /issuing/reissue-campaigns/{id}/schedule —
          DIFFERENT metric (empty set vs numeric threshold) and DIFFERENT endpoint than
          instance 1. Boundary: estimated_card_count must be >= 1; exactly 0 matching cards
          triggers ERR_CAMPAIGN_EMPTY_SELECTION. The >= vs > distinction pins the boundary.
        test_recipe:
          setup:
            - "CardProgram prog12 (VISA, DEBIT_CONSUMER) LIVE with NO cards yet (empty pool)"
            - "ReissueCampaign camp12 (kind=EXPIRY_SWEEP, blanket_unit_fee=100, selection_filter={expiry_before: 2027-01-01}, scheduled_for future)"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-12", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog12_id: $.data.id }
            - call: "POST /issuing/programs/${prog12_id}/bin-ranges"
              payload: { bin_prefix: "422200", range_size: 100, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog12_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/programs/${prog12_id}/reissue-campaigns"
              payload:
                campaign_kind: "EXPIRY_SWEEP"
                scheduled_for: "2026-08-05T00:00:00Z"
                selection_filter: { expiry_before: "2027-01-01" }
                blanket_unit_fee_cents: 100
              as: OperationsAnalyst
              captures: { camp12_id: $.data.id }
          trigger:
            - call: "POST /issuing/reissue-campaigns/${camp12_id}/schedule"
              payload: {}
              as: OperationsAnalyst
              captures: { err_empty: $.data.error_id }
          assert:
            - "error_id == ERR_CAMPAIGN_EMPTY_SELECTION   # empty pool boundary (0 cards)"

  # ============================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ============================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: card_activation_requires_account_open
        grounds:
          - state_machines.Card.ISSUED_to_ACTIVE
        distinguishing_aspect: |
          Pair: Card → CardAccount. Card ISSUED→ACTIVE requires account.lifecycle_status=OPEN.
          When account is SUSPENDED, card activation is rejected with ERR_ACCOUNT_NOT_OPEN.
        test_recipe:
          setup:
            - "CardProgram prog13 LIVE; account13 OPEN; card13 ISSUED with pin SET"
            - "Then account13 is SUSPENDED (lifecycle_status=SUSPENDED)"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-13", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog13_id: $.data.id }
            - call: "POST /issuing/programs/${prog13_id}/bin-ranges"
              payload: { bin_prefix: "433300", range_size: 100, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog13_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts"
              payload: { program_id: "${prog13_id}", external_account_ref: "A-13", account_class: "INDIVIDUAL", daily_spend_cap_cents: 100000 }
              as: ProgramManager
              captures: { acct13_id: $.data.id }
            - call: "POST /issuing/accounts/${acct13_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts/${acct13_id}/cards"
              payload: { expiry_month: 12, expiry_year: 2030, form_factor: "PHYSICAL" }
              as: ProgramManager
              captures: { card13_id: $.data.id }
            - call: "POST /issuing/cards/${card13_id}/pin"
              payload: { new_pin: "1111" }
              as: CardholderOps
            - call: "POST /issuing/accounts/${acct13_id}/suspend"
              payload: {}
              as: ProgramManager
            - call: "GET /issuing/cards/${card13_id}/activation-tokens"
              payload: {}
              as: CardholderOps
              captures: { tok13: "$.data[0].token_value" }
          trigger:
            - call: "POST /issuing/cards/${card13_id}/activate"
              payload: { activation_token: "${tok13}" }
              as: CardholderOps
              captures: { err13: $.data.error_id }
          assert:
            - "error_id == ERR_ACCOUNT_NOT_OPEN   # Card→CardAccount cross-entity dependency"

      - name: mandate_verify_blocked_by_deadline
        grounds:
          - state_machines.MandateAck.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Pair: MandateAck → Mandate (DIFFERENT pair than instance 1). MandateAck
          SUBMITTED→VERIFIED requires clock < mandate.compliance_deadline. When clock
          advances past the deadline, verify is rejected with ERR_MANDATE_DEADLINE_PASSED.
        test_recipe:
          setup:
            - "CardProgram prog14 LIVE"
            - "Mandate mand14 with compliance_deadline = 2026-08-10T00:00:00Z"
            - "MandateAck ack14 in SUBMITTED"
            - "Clock advanced to 2026-08-15T00:00:00Z (past deadline)"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-14", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog14_id: $.data.id }
            - call: "POST /issuing/programs/${prog14_id}/bin-ranges"
              payload: { bin_prefix: "444400", range_size: 100, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog14_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/mandates"
              payload: { network: "VISA", mandate_code: "VI-14", title: "M14", effective_at: "2026-08-02T00:00:00Z", compliance_deadline: "2026-08-10T00:00:00Z", severity: "REQUIRED" }
              as: ComplianceOfficer
              captures: { mand14_id: $.data.id }
            - call: "POST /issuing/mandates/${mand14_id}/acks"
              payload: { program_id: "${prog14_id}", implementation_notes: "notes" }
              as: ComplianceOfficer
              captures: { ack14_id: $.data.id }
            - call: "POST /issuing/mandates/${mand14_id}/acks/${ack14_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-cto-1"
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /issuing/mandates/${mand14_id}/acks/${ack14_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-cto-2"
              captures: { err14: $.data.error_id }
          assert:
            - "error_id == ERR_MANDATE_DEADLINE_PASSED   # MandateAck→Mandate cross-entity dependency"

  # ============================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vendor_batch_same_date_overlap
        grounds:
          - validations[priority=13]
        distinguishing_aspect: |
          Resource=ProductionVendor, interval-semantics=same-UTC-date collision on a status
          set {SUBMITTED, IN_PRODUCTION}. Two batches for the same vendor on the same UTC
          date collide ONLY if the existing batch is in SUBMITTED or IN_PRODUCTION. If the
          existing batch is CANCELLED (or DELIVERED), no collision. Boundary adjacency:
          two batches on DIFFERENT UTC dates NEVER collide, even if submitted back-to-back.
        test_recipe:
          setup:
            - "Vendor vendY (capacity=1000, is_active=true)"
            - "CardProgram prog15 LIVE"
            - "ProductionBatch batch1 (vendor=vendY, scheduled=2026-08-15, status=SUBMITTED)"
            - "ProductionBatch batch2 (vendor=vendY, scheduled=2026-08-16 (next day), PLANNED)"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-15", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog15_id: $.data.id }
            - call: "POST /issuing/programs/${prog15_id}/bin-ranges"
              payload: { bin_prefix: "455500", range_size: 100, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog15_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/vendors"
              payload: { vendor_code: "VEND-Y", capability_flags: ["EMV_CHIP"], daily_capacity_cards: 1000, supported_networks: ["VISA"], is_active: true }
              as: PlatformAdmin
              captures: { vendY_id: $.data.id }
            - call: "POST /issuing/programs/${prog15_id}/production-batches"
              payload: { vendor_id: "${vendY_id}", scheduled_for_utc_date: "2026-08-15", requested_card_count: 100, unit_cost_cents: 50 }
              as: OperationsAnalyst
              captures: { batch1_id: $.data.id }
            - call: "POST /issuing/production-batches/${batch1_id}/submit"
              payload: {}
              as: OperationsAnalyst
            - call: "POST /issuing/programs/${prog15_id}/production-batches"
              payload: { vendor_id: "${vendY_id}", scheduled_for_utc_date: "2026-08-16", requested_card_count: 100, unit_cost_cents: 50 }
              as: OperationsAnalyst
              captures: { batch2_id: $.data.id }
          trigger:
            - call: "POST /issuing/production-batches/${batch2_id}/submit"
              payload: {}
              as: OperationsAnalyst
              captures: { batch2_status: $.data.status }
          assert:
            - "ProductionBatch.${batch2_id}.status == SUBMITTED   # different UTC date → no overlap, submit succeeds"

      - name: bin_range_effective_window_card_issuance
        grounds:
          - validations[priority=14]
          - state_machines.BinRange
        distinguishing_aspect: |
          Resource=BinRange, interval-semantics=half-open [effective_from, effective_until)
          on a continuous datetime axis — DIFFERENT interval semantics from instance 1
          (which used date-equality on a status filter). Card issuance outside the window
          (clock < effective_from OR clock >= effective_until) is rejected with
          ERR_BIN_NOT_IN_WINDOW; clock == effective_from is INSIDE (inclusive); clock ==
          effective_until is OUTSIDE (exclusive upper bound).
        test_recipe:
          setup:
            - "CardProgram prog16 LIVE"
            - "BinRange bin16 with effective_from=2026-09-01T00:00:00Z, effective_until=2026-12-01T00:00:00Z"
            - "CardAccount acct16 OPEN"
            - "Clock at 2026-08-15T00:00:00Z — BEFORE effective_from"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-16", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog16_id: $.data.id }
            - call: "POST /issuing/programs/${prog16_id}/bin-ranges"
              payload: { bin_prefix: "466600", range_size: 100, effective_from: "2026-09-01T00:00:00Z", effective_until: "2026-12-01T00:00:00Z" }
              as: ProgramManager
              captures: { bin16_id: $.data.id }
            - call: "POST /issuing/programs/${prog16_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts"
              payload: { program_id: "${prog16_id}", external_account_ref: "A-16", account_class: "INDIVIDUAL", daily_spend_cap_cents: 100000 }
              as: ProgramManager
              captures: { acct16_id: $.data.id }
            - call: "POST /issuing/accounts/${acct16_id}/activate"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /issuing/accounts/${acct16_id}/cards"
              payload: { expiry_month: 12, expiry_year: 2030, form_factor: "PHYSICAL", bin_range_id: "${bin16_id}" }
              as: ProgramManager
              captures: { err16: $.data.error_id }
          assert:
            - "error_id == ERR_BIN_NOT_IN_WINDOW   # half-open window, clock before effective_from"

  # ============================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: card_cancel_restores_pan_inventory
        grounds:
          - state_machines.Card.ACTIVE_to_CANCELLED
          - entities.BinRange.fields.pans_allocated
        distinguishing_aspect: |
          Conserved quantity = BinRange.pans_allocated. Issue a card (+1), cancel the card
          (-1) — pans_allocated returns to its original value. Invariant:
          pans_allocated_after_cancel == pans_allocated_before_issue.
        test_recipe:
          setup:
            - "CardProgram prog17 LIVE; BinRange bin17 with pans_allocated=0"
            - "CardAccount acct17 OPEN"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-17", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog17_id: $.data.id }
            - call: "POST /issuing/programs/${prog17_id}/bin-ranges"
              payload: { bin_prefix: "477700", range_size: 100, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
              captures: { bin17_id: $.data.id, bin17_v_pre: $.data.version }
            - call: "POST /issuing/programs/${prog17_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts"
              payload: { program_id: "${prog17_id}", external_account_ref: "A-17", account_class: "INDIVIDUAL", daily_spend_cap_cents: 100000 }
              as: ProgramManager
              captures: { acct17_id: $.data.id }
            - call: "POST /issuing/accounts/${acct17_id}/activate"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /issuing/accounts/${acct17_id}/cards"
              payload: { expiry_month: 12, expiry_year: 2030, form_factor: "PHYSICAL", bin_range_id: "${bin17_id}" }
              as: ProgramManager
              captures: { card17_id: $.data.id }
            - call: "GET /issuing/bin-ranges/${bin17_id}"
              payload: {}
              as: ProgramManager
              captures: { bin17_pans_after_issue: $.data.pans_allocated }
            - call: "POST /issuing/cards/${card17_id}/cancel"
              payload: {}
              as: ProgramManager
            - call: "GET /issuing/bin-ranges/${bin17_id}"
              payload: {}
              as: ProgramManager
              captures: { bin17_pans_after_cancel: $.data.pans_allocated }
          assert:
            - "BinRange.pans_allocated after issue == 1"
            - "BinRange.pans_allocated after cancel == 0   # invariant restored"

      - name: account_fund_then_settle_conserves_cash
        grounds:
          - calculations.interchange_qualification
          - entities.CardAccount.fields.available_balance_cents
        distinguishing_aspect: |
          Conserved quantity = CardAccount.available_balance_cents modulo interchange
          expense. Different conserved quantity from instance 1 (PAN inventory vs cash
          balance). Fund the account (+N), authorize amount A (-A), then settle for the
          FULL A (settled_amount_cents = A): available_balance_cents goes from N → N-A on
          auth and stays at N-A on full settlement. The invariant is: authorization +
          full settlement = pure -A on balance, with no drift. Settlement does not double-debit.
        test_recipe:
          setup:
            - "CardProgram prog18 LIVE; BinRange; CardAccount acct18 OPEN with balance 0; Card card18 ACTIVE"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-18", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog18_id: $.data.id }
            - call: "POST /issuing/programs/${prog18_id}/bin-ranges"
              payload: { bin_prefix: "488800", range_size: 100, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog18_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts"
              payload: { program_id: "${prog18_id}", external_account_ref: "A-18", account_class: "INDIVIDUAL", daily_spend_cap_cents: 100000 }
              as: ProgramManager
              captures: { acct18_id: $.data.id }
            - call: "POST /issuing/accounts/${acct18_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts/${acct18_id}/fund"
              payload: { amount_cents: 50000 }
              as: FinanceController
            - call: "POST /issuing/accounts/${acct18_id}/cards"
              payload: { expiry_month: 12, expiry_year: 2030, form_factor: "PHYSICAL" }
              as: ProgramManager
              captures: { card18_id: $.data.id }
            - call: "POST /issuing/cards/${card18_id}/pin"
              payload: { new_pin: "1111" }
              as: CardholderOps
            - call: "GET /issuing/cards/${card18_id}/activation-tokens"
              payload: {}
              as: CardholderOps
              captures: { tok18: "$.data[0].token_value" }
            - call: "POST /issuing/cards/${card18_id}/activate"
              payload: { activation_token: "${tok18}" }
              as: CardholderOps
          trigger:
            - call: "POST /issuing/cards/${card18_id}/authorizations"
              payload: { amount_cents: 10000, mcc: "5411", country_code: "US" }
              as: CardholderOps
              captures: { auth18_id: $.data.id, auth18_decision: $.data.decision }
            - call: "GET /issuing/accounts/${acct18_id}"
              payload: {}
              as: ProgramManager
              captures: { bal_after_auth: $.data.available_balance_cents }
            - call: "POST /issuing/authorization-events/${auth18_id}/settle"
              payload: { settled_amount_cents: 10000 }
              as: FinanceController
            - call: "GET /issuing/accounts/${acct18_id}"
              payload: {}
              as: ProgramManager
              captures: { bal_after_settle: $.data.available_balance_cents }
          assert:
            - "AuthorizationEvent.${auth18_id}.decision == APPROVED"
            - "bal_after_auth == 40000     # 50000 - 10000"
            - "bal_after_settle == 40000   # full settlement: no double-debit; invariant conserved"
