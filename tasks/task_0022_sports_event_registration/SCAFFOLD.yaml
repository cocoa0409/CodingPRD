scenario: |
  Sports event registration system: event creation with event-type configuration,
  event rules and regulations, registration period, entry fee, and capacity limits;
  group draw with seeding rules (ranking/region/random), avoidance rules
  (same-team/same-country), bye handling for odd-numbered participants, and bracket
  generation; referee assignment with referee qualification matching,
  conflict-of-interest avoidance, multi-match parallel scheduling, and substitute
  referee arrangement; result entry with referee-submitted results, multi-referee
  cross-verification, dispute review, score correction workflow, and result locking;
  ranking calculation with multi-rule support (points/goal difference/head-to-head/
  away goals/sets won), tie-breaking sequential rules, real-time ranking updates,
  and final ranking confirmation; prize money distribution with prize structure by
  ranking, tax withholding, multi-currency settlement, prize forfeiture rules, and
  payment scheduling; doping test records with sampling list management, sample
  chain-of-custody, test result entry, positive-result handling workflow, sanction
  record archiving, and appeal handling; event-driven synchronization with payment,
  governing-body database, and IM systems; audit logging for result changes and
  sanction records.

domain_name: "sports-event-registration"
api_prefix: "/events"

complexity_profile:
  primary_archetype: "Workflow orchestration"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Scheduled / deferred actions"
    - "Selector policy"
  entity_topology: "hybrid"
  state_machine_shape: "branching"
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: "segregation_of_duties"
  consistency_model: "saga"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Event name."
        constraints: "1..120 chars, required."
      - name: event_type
        type: enum
        source: input
        description: "Discipline-class controlling scoring & ranking rules."
        constraints: "Enum: SINGLE_ELIM, ROUND_ROBIN, SETS_MATCH (e.g. tennis-style)."
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 host country."
        constraints: "Exactly 2 uppercase letters."
      - name: regulations_text
        type: string
        source: input
        description: "Free-text regulations summary."
        constraints: "1..4000 chars."
      - name: registration_opens_at
        type: datetime
        source: input
        description: "Inclusive start of registration window."
      - name: registration_closes_at
        type: datetime
        source: input
        description: "Exclusive end of registration window."
        constraints: "registration_closes_at > registration_opens_at."
      - name: starts_at
        type: datetime
        source: input
        description: "Scheduled event start (also bracket lock cutoff)."
        constraints: "starts_at >= registration_closes_at."
      - name: entry_fee_cents
        type: integer
        source: input
        description: "Per-participant entry fee in minor units."
        constraints: ">= 0."
      - name: settlement_currency
        type: enum
        source: input
        description: "Currency used for entry fee + prize payouts."
        constraints: "Enum: USD, EUR, JPY, GBP."
      - name: capacity_min
        type: integer
        source: input
        description: "Minimum participants required to start the draw."
        constraints: ">= 2."
      - name: capacity_max
        type: integer
        source: input
        description: "Maximum participants allowed."
        constraints: ">= capacity_min and <= 256."
      - name: prize_pool_cents
        type: integer
        source: input
        description: "Total prize pool funded by organizer (gross, before tax)."
        constraints: ">= 0."
      - name: tax_withholding_pct
        type: number
        source: input
        description: "Tax withholding percent applied to gross prize amounts."
        constraints: "0.00 .. 50.00, two decimals, round_half_up."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status; see §1.2 Event."
        constraints: "Enum: DRAFT, OPEN, REGISTRATION_CLOSED, DRAWN, IN_PROGRESS, COMPLETED, CANCELLED."
        default: "DRAFT"
      - name: registered_count
        type: integer
        source: computed
        description: "Count of Participant rows in {REGISTERED, SEEDED, ACTIVE} for this event."
        default: 0
      - name: prize_paid_total_cents
        type: integer
        source: computed
        description: "Sum of PrizePayment.net_amount_cents for status in {SCHEDULED, PAID}."
        default: 0
      - name: posture
        type: enum
        source: computed
        description: "Aggregate gating flag derived from open SanctionRecord/Appeal counts."
        constraints: "Enum: CLEAN, UNDER_REVIEW, FROZEN."
        default: "CLEAN"

  - name: Participant
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "Event this participant is registered to."
      - name: athlete_external_id
        type: string
        source: input
        description: "Stable id from governing-body roster."
      - name: display_name
        type: string
        source: input
        description: "Public name on bracket."
        constraints: "1..80 chars."
      - name: team_code
        type: string
        source: input
        description: "Team affiliation; null = unaffiliated."
        constraints: "Exactly 3 uppercase letters or null."
      - name: country_code
        type: string
        source: input
        description: "Athlete nationality (ISO 3166-1 alpha-2)."
      - name: world_ranking
        type: integer
        source: input
        description: "Lower is better; null treated as worst."
      - name: region
        type: enum
        source: input
        description: "Continental federation (used for region seeding)."
        constraints: "Enum: AFC, CAF, CONCACAF, CONMEBOL, OFC, UEFA."
      - name: entry_fee_paid_cents
        type: integer
        source: input
        description: "Confirmed paid amount; must equal Event.entry_fee_cents on register."
      - name: status
        type: enum
        source: computed
        description: "See §1.2 Participant."
        constraints: "Enum: REGISTERED, SEEDED, ACTIVE, ELIMINATED, WITHDRAWN, DISQUALIFIED."
        default: "REGISTERED"
      - name: bracket_seed
        type: integer
        source: computed
        description: "Seed assigned at draw; null until DRAWN."
        default: null
      - name: gross_prize_cents
        type: integer
        source: computed
        description: "Gross prize accrued from final_rank, in Event.settlement_currency."
        default: 0
      - name: net_prize_cents
        type: integer
        source: computed
        description: "Gross minus withholding minus forfeitures."
        default: 0
      - name: final_rank
        type: integer
        source: computed
        description: "1 = champion. Set when Event.status = COMPLETED."
        default: null

  - name: Referee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Referee name."
      - name: country_code
        type: string
        source: input
        description: "Referee nationality."
      - name: team_affiliation
        type: string
        source: input
        description: "Affiliated team code (3 letters), or null."
      - name: qualifications
        type: array
        source: input
        description: "Array of event_type values the referee is certified for."
        constraints: "Non-empty subset of {SINGLE_ELIM, ROUND_ROBIN, SETS_MATCH}."
      - name: grade
        type: enum
        source: input
        description: "Career grade; A is highest."
        constraints: "Enum: A, B, C."
      - name: is_active
        type: boolean
        source: input
        description: "If false, never selected."
        default: true

  - name: Match
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "Owning event."
      - name: round_index
        type: integer
        source: computed
        description: "1 = first round. Bye rounds advance without a match row but counter still increments for survivors."
      - name: bracket_position
        type: integer
        source: computed
        description: "Position in round_index (1..N)."
      - name: home_participant_id
        type: string
        source: computed
        description: "Higher-seed participant (or sole survivor on a bye)."
      - name: away_participant_id
        type: string
        source: computed
        description: "Lower-seed participant; null when this slot is a BYE."
        default: null
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Match start time (assigned at scheduling)."
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Match end time. scheduled_end_at > scheduled_start_at."
      - name: status
        type: enum
        source: computed
        description: "See §1.2 Match."
        constraints: "Enum: SCHEDULED, RESULT_PENDING, DISPUTED, LOCKED, BYE, VOIDED."
        default: "SCHEDULED"
      - name: locked_home_score
        type: integer
        source: computed
        description: "Final accepted score for home; written on lock."
        default: null
      - name: locked_away_score
        type: integer
        source: computed
        description: "Final accepted score for away; written on lock."
        default: null
      - name: locked_home_sets_won
        type: integer
        source: computed
        description: "For SETS_MATCH event_type only; null otherwise."
        default: null
      - name: locked_away_sets_won
        type: integer
        source: computed
        description: "For SETS_MATCH event_type only; null otherwise."
        default: null
      - name: winner_participant_id
        type: string
        source: computed
        description: "Participant who advances; written on lock."
        default: null

  - name: RefereeAssignment
    parent: Match
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: "Match the referee is assigned to."
      - name: referee_id
        type: string
        source: input
        description: "Referee acting on this match."
      - name: role
        type: enum
        source: input
        description: "Crew role on the match."
        constraints: "Enum: HEAD, ASSISTANT, SUBSTITUTE."
      - name: status
        type: enum
        source: computed
        description: "See §1.2 RefereeAssignment."
        constraints: "Enum: ASSIGNED, REVOKED, ACTIVATED."
        default: "ASSIGNED"
      - name: replaces_assignment_id
        type: string
        source: input
        description: "If this is a SUBSTITUTE activation, the original assignment it replaces."
        default: null

  - name: ResultEntry
    parent: Match
    common_fields: false
    fields:
      - name: match_id
        type: string
        source: input
        description: "Match this result was entered against."
      - name: submitted_by_assignment_id
        type: string
        source: input
        description: "RefereeAssignment whose referee submitted this entry."
      - name: home_score
        type: integer
        source: input
        description: "Reported home score."
        constraints: ">= 0."
      - name: away_score
        type: integer
        source: input
        description: "Reported away score."
        constraints: ">= 0."
      - name: home_sets_won
        type: integer
        source: input
        description: "For SETS_MATCH event_type; otherwise null."
        default: null
      - name: away_sets_won
        type: integer
        source: input
        description: "For SETS_MATCH event_type; otherwise null."
        default: null
      - name: kind
        type: enum
        source: input
        description: "Why the entry exists."
        constraints: "Enum: REFEREE_SUBMISSION, CORRECTION."
        default: "REFEREE_SUBMISSION"
      - name: superseded_by_id
        type: string
        source: computed
        description: "Set when a CORRECTION supersedes this row."
        default: null

  - name: Dispute
    parent: Match
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: "Match under dispute."
      - name: filed_by_participant_id
        type: string
        source: input
        description: "Participant who filed the dispute."
      - name: reason_text
        type: string
        source: input
        description: "Free-text reason."
        constraints: "1..1000 chars."
      - name: status
        type: enum
        source: computed
        description: "See §1.2 Dispute."
        constraints: "Enum: OPEN, UPHELD, REJECTED."
        default: "OPEN"
      - name: corrected_result_entry_id
        type: string
        source: computed
        description: "If UPHELD with score correction, the CORRECTION ResultEntry id."
        default: null

  - name: RankingEntry
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "Event being ranked."
      - name: participant_id
        type: string
        source: input
        description: "Participant whose row this is."
      - name: points
        type: integer
        source: computed
        description: "Aggregated points across LOCKED matches."
        default: 0
      - name: goal_difference
        type: integer
        source: computed
        description: "Sum of (home_score - away_score) across LOCKED matches participated in (sign normalized to this participant)."
        default: 0
      - name: away_goals
        type: integer
        source: computed
        description: "Sum of away-side goals scored by this participant in LOCKED matches."
        default: 0
      - name: sets_won
        type: integer
        source: computed
        description: "For SETS_MATCH only; sum of locked sets won."
        default: 0
      - name: provisional_rank
        type: integer
        source: computed
        description: "Live rank; recomputed on every match lock."
      - name: final_rank
        type: integer
        source: computed
        description: "Confirmed rank when Event reaches COMPLETED; null otherwise."
        default: null

  - name: PrizePayment
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "Event the payment relates to."
      - name: participant_id
        type: string
        source: input
        description: "Recipient participant."
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Gross prize accrued for this participant in Event.settlement_currency."
      - name: tax_withheld_cents
        type: integer
        source: computed
        description: "Withheld tax in Event.settlement_currency."
      - name: forfeit_amount_cents
        type: integer
        source: computed
        description: "Amount forfeited (e.g., DISQUALIFIED participants forfeit 100% gross)."
      - name: net_amount_cents
        type: integer
        source: computed
        description: "Net = gross - tax_withheld - forfeit_amount; >= 0."
      - name: scheduled_pay_at
        type: datetime
        source: computed
        description: "Scheduled payout time (Event.starts_at + 7 days)."
      - name: status
        type: enum
        source: computed
        description: "See §1.2 PrizePayment."
        constraints: "Enum: SCHEDULED, FORFEITED, PAID, CANCELLED."
        default: "SCHEDULED"

  - name: DopingSample
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "Event the sample was collected at."
      - name: participant_id
        type: string
        source: input
        description: "Participant who provided the sample."
      - name: collected_at
        type: datetime
        source: input
        description: "Sampling time."
      - name: chain_log
        type: array
        source: computed
        description: "Append-only list of {actor_user_id, action, at} events. Custody append must be strictly later than the last entry's `at`."
        default: []
      - name: status
        type: enum
        source: computed
        description: "See §1.2 DopingSample."
        constraints: "Enum: COLLECTED, IN_TRANSIT, RECEIVED, NEGATIVE, POSITIVE, VOIDED."
        default: "COLLECTED"
      - name: result_text
        type: string
        source: input
        description: "Lab finding free text on result entry."
        default: null

  - name: SanctionRecord
    parent: DopingSample
    common_fields: false
    fields:
      - name: sample_id
        type: string
        source: input
        description: "Originating sample (must be POSITIVE)."
      - name: participant_id
        type: string
        source: input
        description: "Sanctioned participant (denormalized for archival)."
      - name: ban_months
        type: integer
        source: input
        description: "Suspension months."
        constraints: "1..120."
      - name: prize_forfeited_cents
        type: integer
        source: computed
        description: "Recorded forfeiture amount at issuance time (snapshot of PrizePayment.gross_amount_cents)."
      - name: status
        type: enum
        source: computed
        description: "See §1.2 SanctionRecord."
        constraints: "Enum: ISSUED, APPEALED, FINAL, REVOKED."
        default: "ISSUED"

  - name: Appeal
    parent: SanctionRecord
    common_fields: true
    fields:
      - name: sanction_id
        type: string
        source: input
        description: "Sanction being appealed."
      - name: filed_by_user_id
        type: string
        source: input
        description: "Participant id (must equal SanctionRecord.participant_id)."
      - name: ground_text
        type: string
        source: input
        description: "Free-text grounds."
        constraints: "1..2000 chars."
      - name: status
        type: enum
        source: computed
        description: "See §1.2 Appeal."
        constraints: "Enum: PENDING, UPHELD, DISMISSED."
        default: "PENDING"

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: kind
        type: enum
        source: system
        description: "What changed."
        constraints: "Enum: RESULT_CHANGE, SANCTION_CHANGE."
      - name: subject_kind
        type: enum
        source: system
        description: "Subject entity kind."
        constraints: "Enum: MATCH, SANCTION_RECORD."
      - name: subject_id
        type: string
        source: system
        description: "Id of the subject row."
      - name: actor_user_id
        type: string
        source: system
        description: "X-User-ID at the time of the action."
      - name: actor_role
        type: string
        source: system
        description: "X-User-Role at the time of the action."
      - name: from_value
        type: object
        source: system
        description: "JSON snapshot of fields before change."
      - name: to_value
        type: object
        source: system
        description: "JSON snapshot of fields after change."

  - name: SyncEvent
    parent: null
    common_fields: false
    fields:
      - name: target_system
        type: enum
        source: system
        description: "Downstream system to be synced."
        constraints: "Enum: PAYMENT, GOVERNING_BODY, IM."
      - name: kind
        type: enum
        source: system
        description: "Specific outbox event kind."
        constraints: "Enum: ENTRY_FEE_CHARGED, PRIZE_PAID, SANCTION_ARCHIVED, DRAW_ANNOUNCED."
      - name: payload
        type: object
        source: system
        description: "Frozen JSON payload at emit time."
      - name: emitted_at
        type: datetime
        source: system
        description: "Server time the event was queued."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /events/{id}/open"
        actor: Organizer
        preconditions:
          - "registration_opens_at <= now() < registration_closes_at."
          - "capacity_max >= capacity_min >= 2."
        side_effects:
          - "Event.status = OPEN; Participant register endpoint accepts new rows."
      - from: OPEN
        to: REGISTRATION_CLOSED
        trigger: "POST /events/{id}/close-registration OR clock-driven via POST /_clock/advance crossing registration_closes_at"
        actor: system
        preconditions:
          - "now() >= registration_closes_at."
        side_effects:
          - "Event.status = REGISTRATION_CLOSED; further Participant POST rejected with ERR_REGISTRATION_CLOSED."
      - from: REGISTRATION_CLOSED
        to: DRAWN
        trigger: "POST /events/{id}/draw"
        actor: Organizer
        preconditions:
          - "registered_count >= capacity_min."
          - "Event.posture == CLEAN (no UNDER_REVIEW or FROZEN gating)."
        side_effects:
          - "Cascade: assign Participant.bracket_seed using §1.3 bracket_seeding (Participant REGISTERED -> SEEDED)."
          - "Cascade: generate Match rows including BYE rows for odd-numbered participants per §1.3 bracket_seeding."
          - "Emit SyncEvent(target_system=GOVERNING_BODY, kind=DRAW_ANNOUNCED)."
      - from: DRAWN
        to: IN_PROGRESS
        trigger: "POST /events/{id}/start OR clock-driven crossing starts_at"
        actor: system
        preconditions:
          - "now() >= starts_at."
          - "Every round-1 Match has at least one ASSIGNED HEAD RefereeAssignment."
        side_effects:
          - "Event.status = IN_PROGRESS; Participant SEEDED -> ACTIVE for non-BYE participants in round 1."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /events/{id}/complete"
        actor: Organizer
        preconditions:
          - "All non-BYE Match rows have status == LOCKED."
          - "No Dispute with status == OPEN."
        side_effects:
          - "RankingEntry.final_rank = provisional_rank for every participant."
          - "Trigger §1.3 prize_calculation for each ranked participant -> create PrizePayment rows."
          - "Cascade: PrizePayment SCHEDULED for non-DISQUALIFIED winners; FORFEITED for DISQUALIFIED."
          - "Emit SyncEvent(target_system=PAYMENT, kind=PRIZE_PAID payload preview) per scheduled row."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Organizer
        preconditions: []
        side_effects:
          - "Event.status = CANCELLED."
      - from: OPEN
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Organizer
        preconditions: []
        side_effects:
          - "Cascade: every Participant in {REGISTERED, SEEDED, ACTIVE} -> WITHDRAWN."
          - "Each WITHDRAWN cascade itself emits SyncEvent(target_system=PAYMENT, kind=ENTRY_FEE_CHARGED with negative amount = refund)."
      - from: REGISTRATION_CLOSED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Organizer
        preconditions: []
        side_effects:
          - "Same cascade as OPEN -> CANCELLED."

  - entity: Participant
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN, DISQUALIFIED, ELIMINATED]
    transitions:
      - from: REGISTERED
        to: SEEDED
        trigger: "system on Event DRAWN"
        actor: system
        preconditions:
          - "Event.status transitioning REGISTRATION_CLOSED -> DRAWN."
        side_effects:
          - "Assign bracket_seed."
      - from: SEEDED
        to: ACTIVE
        trigger: "system on Event IN_PROGRESS or on advancing past a BYE round"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: ELIMINATED
        trigger: "system on Match LOCK where this participant is the loser"
        actor: system
        preconditions:
          - "Match.status -> LOCKED and winner_participant_id != self."
        side_effects: []
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /participants/{id}/withdraw"
        actor: Organizer
        preconditions:
          - "Event.status in {OPEN, REGISTRATION_CLOSED}."
        side_effects:
          - "Decrement Event.registered_count."
          - "Emit SyncEvent(target_system=PAYMENT, kind=ENTRY_FEE_CHARGED, payload includes refund_cents = entry_fee_paid_cents)."
      - from: SEEDED
        to: WITHDRAWN
        trigger: "POST /participants/{id}/withdraw"
        actor: Organizer
        preconditions:
          - "Event.status == DRAWN."
        side_effects:
          - "Cascade: every scheduled Match featuring this participant -> VOIDED with opponent advancing as if BYE."
          - "Cascade: every RefereeAssignment on those VOIDED Match rows -> REVOKED."
      - from: ACTIVE
        to: DISQUALIFIED
        trigger: "system on SanctionRecord ISSUED whose sample.participant_id == self"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: any future Match featuring participant -> VOIDED."
          - "Cascade: any PrizePayment where status == SCHEDULED -> FORFEITED (forfeit_amount_cents = gross_amount_cents)."
          - "Recompute RankingEntry.provisional_rank (this participant excluded from ordering)."

  - entity: Match
    initial_state: SCHEDULED
    terminal_states: [LOCKED, BYE, VOIDED]
    transitions:
      - from: SCHEDULED
        to: BYE
        trigger: "system on Event DRAWN, when away_participant_id is null"
        actor: system
        preconditions: []
        side_effects:
          - "winner_participant_id = home_participant_id."
          - "Home Participant SEEDED -> ACTIVE on next round."
      - from: SCHEDULED
        to: RESULT_PENDING
        trigger: "POST /matches/{id}/results (first ResultEntry of kind REFEREE_SUBMISSION)"
        actor: Referee
        preconditions:
          - "submitted_by_assignment_id resolves to a RefereeAssignment with role in {HEAD, ASSISTANT} and status == ACTIVATED on this match."
          - "Match.scheduled_end_at <= now()."
          - "Event.posture != FROZEN."
        side_effects:
          - "Persist ResultEntry."
      - from: RESULT_PENDING
        to: LOCKED
        trigger: "POST /matches/{id}/results (second cross-verifying ResultEntry, scores match within tolerance)"
        actor: Referee
        preconditions:
          - "Two ResultEntry rows exist, each from a distinct RefereeAssignment.referee_id."
          - "Both entries report identical home_score and away_score (and identical sets_won fields when event_type == SETS_MATCH)."
          - "No OPEN Dispute."
        side_effects:
          - "Match.status = LOCKED; copy scores into locked_* fields; compute winner_participant_id."
          - "Cascade: loser Participant ACTIVE -> ELIMINATED."
          - "Cascade: §1.3 ranking_calculation reruns; RankingEntry.points/goal_difference/away_goals/sets_won updated; provisional_rank recomputed."
          - "Cascade: if next-round Match exists, set its home_participant_id or away_participant_id to winner."
      - from: RESULT_PENDING
        to: DISPUTED
        trigger: "POST /matches/{id}/disputes"
        actor: Participant
        preconditions:
          - "Match.status in {RESULT_PENDING, LOCKED}."
        side_effects:
          - "Create Dispute(status=OPEN). If Match was LOCKED, Match -> DISPUTED (snapshot locked_* preserved)."
      - from: DISPUTED
        to: LOCKED
        trigger: "POST /disputes/{id}/resolve (uphold=false)"
        actor: DisciplinaryOfficer
        preconditions:
          - "Dispute.status == OPEN."
        side_effects:
          - "Dispute.status = REJECTED; Match.status = LOCKED with original locked_* values restored."
      - from: DISPUTED
        to: LOCKED
        trigger: "POST /disputes/{id}/resolve (uphold=true with corrected scores)"
        actor: DisciplinaryOfficer
        preconditions:
          - "Dispute.status == OPEN."
          - "Corrected scores satisfy event_type score validity (§1.4)."
        side_effects:
          - "Persist new ResultEntry of kind=CORRECTION; old superseded ResultEntry rows get superseded_by_id set."
          - "AuditLog row written kind=RESULT_CHANGE with from_value=old locked_*, to_value=new locked_*."
          - "Match.locked_* updated; winner_participant_id may change."
          - "Cascade: if winner flipped, previous winner ACTIVE/ELIMINATED toggled, RankingEntry recomputed."
      - from: SCHEDULED
        to: VOIDED
        trigger: "system on Participant -> WITHDRAWN/DISQUALIFIED side-effect cascade"
        actor: system
        preconditions: []
        side_effects:
          - "All RefereeAssignment on this match -> REVOKED."

  - entity: RefereeAssignment
    initial_state: ASSIGNED
    terminal_states: [REVOKED]
    transitions:
      - from: ASSIGNED
        to: ACTIVATED
        trigger: "system on Match RESULT_PENDING entry, OR explicit POST /referee-assignments/{id}/activate when Match.scheduled_start_at <= now()"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: REVOKED
        trigger: "POST /referee-assignments/{id}/revoke"
        actor: Organizer
        preconditions:
          - "Match.status in {SCHEDULED, RESULT_PENDING}."
        side_effects: []
      - from: ACTIVATED
        to: REVOKED
        trigger: "POST /referee-assignments/{id}/revoke"
        actor: Organizer
        preconditions: []
        side_effects:
          - "If role == HEAD or ASSISTANT and a SUBSTITUTE is queued on the match, that SUBSTITUTE is auto-promoted via creation of a new ASSIGNED row with replaces_assignment_id = revoked.id."

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [UPHELD, REJECTED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /disputes/{id}/resolve (uphold=true)"
        actor: DisciplinaryOfficer
        preconditions: []
        side_effects:
          - "Triggers Match DISPUTED -> LOCKED with correction (see Match transition)."
      - from: OPEN
        to: REJECTED
        trigger: "POST /disputes/{id}/resolve (uphold=false)"
        actor: DisciplinaryOfficer
        preconditions: []
        side_effects:
          - "Triggers Match DISPUTED -> LOCKED restoring original scores."

  - entity: DopingSample
    initial_state: COLLECTED
    terminal_states: [NEGATIVE, POSITIVE, VOIDED]
    transitions:
      - from: COLLECTED
        to: IN_TRANSIT
        trigger: "POST /doping-samples/{id}/custody"
        actor: DopingOfficer
        preconditions:
          - "chain_log append at strictly greater than last entry."
        side_effects:
          - "chain_log appended with action=DISPATCH."
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /doping-samples/{id}/custody"
        actor: DopingOfficer
        preconditions:
          - "chain_log append at strictly greater than last entry."
        side_effects:
          - "chain_log appended with action=RECEIVE."
      - from: RECEIVED
        to: NEGATIVE
        trigger: "POST /doping-samples/{id}/result (positive=false)"
        actor: DopingOfficer
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: POSITIVE
        trigger: "POST /doping-samples/{id}/result (positive=true)"
        actor: DopingOfficer
        preconditions: []
        side_effects:
          - "Auto-create SanctionRecord(status=ISSUED, sample_id=self.id, participant_id=self.participant_id) with prize_forfeited_cents snapshot of participant's existing PrizePayment.gross_amount_cents (0 if none)."
          - "AuditLog row kind=SANCTION_CHANGE."
          - "Cascade: Participant ACTIVE -> DISQUALIFIED (per Participant transition)."
          - "Event.posture flips to UNDER_REVIEW (recomputed: any open SanctionRecord OR Appeal -> UNDER_REVIEW; any with status APPEALED -> FROZEN)."
      - from: COLLECTED
        to: VOIDED
        trigger: "POST /doping-samples/{id}/void"
        actor: DopingOfficer
        preconditions: []
        side_effects: []

  - entity: SanctionRecord
    initial_state: ISSUED
    terminal_states: [FINAL, REVOKED]
    transitions:
      - from: ISSUED
        to: APPEALED
        trigger: "POST /appeals (creates Appeal)"
        actor: Participant
        preconditions:
          - "Appeal filed within 14 days of SanctionRecord.created_at (use POST /_clock/advance to test)."
        side_effects:
          - "Event.posture -> FROZEN (an APPEALED sanction freezes; see Event.posture rule)."
          - "AuditLog row kind=SANCTION_CHANGE."
      - from: APPEALED
        to: FINAL
        trigger: "POST /appeals/{id}/decide (uphold=false)"
        actor: AppealsBoard
        preconditions: []
        side_effects:
          - "Appeal.status = DISMISSED."
          - "Event.posture recomputed (no APPEALED -> back to UNDER_REVIEW unless other open sanctions)."
          - "AuditLog row kind=SANCTION_CHANGE."
      - from: APPEALED
        to: REVOKED
        trigger: "POST /appeals/{id}/decide (uphold=true)"
        actor: AppealsBoard
        preconditions: []
        side_effects:
          - "Appeal.status = UPHELD."
          - "Cascade: Participant DISQUALIFIED -> reinstated (status flips back to ELIMINATED if event in COMPLETED, else ACTIVE)."
          - "Cascade: PrizePayment FORFEITED -> SCHEDULED with forfeit_amount_cents = 0; net_amount_cents recomputed."
          - "Event.posture recomputed (no APPEALED, no ISSUED for this sample -> CLEAN if all clear)."
          - "AuditLog row kind=SANCTION_CHANGE."
      - from: ISSUED
        to: FINAL
        trigger: "system: 14-day appeal deadline elapsed without Appeal (driven by POST /_clock/advance crossing created_at + 14d)"
        actor: system
        preconditions:
          - "now() >= SanctionRecord.created_at + 14 days."
          - "No Appeal exists for this sanction."
        side_effects:
          - "Event.posture recomputed."
          - "Emit SyncEvent(target_system=GOVERNING_BODY, kind=SANCTION_ARCHIVED)."

  - entity: Appeal
    initial_state: PENDING
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: PENDING
        to: UPHELD
        trigger: "POST /appeals/{id}/decide (uphold=true)"
        actor: AppealsBoard
        preconditions: []
        side_effects:
          - "See SanctionRecord APPEALED -> REVOKED transition."
      - from: PENDING
        to: DISMISSED
        trigger: "POST /appeals/{id}/decide (uphold=false)"
        actor: AppealsBoard
        preconditions: []
        side_effects:
          - "See SanctionRecord APPEALED -> FINAL transition."

  - entity: PrizePayment
    initial_state: SCHEDULED
    terminal_states: [PAID, FORFEITED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: FORFEITED
        trigger: "system: cascade on Participant DISQUALIFIED OR sanction ISSUED"
        actor: system
        preconditions: []
        side_effects:
          - "forfeit_amount_cents = gross_amount_cents; net_amount_cents = 0."
      - from: FORFEITED
        to: SCHEDULED
        trigger: "system: cascade on Sanction REVOKED"
        actor: system
        preconditions: []
        side_effects:
          - "forfeit_amount_cents = 0; recompute net_amount_cents."
      - from: SCHEDULED
        to: PAID
        trigger: "system: clock crosses scheduled_pay_at via POST /_clock/advance"
        actor: system
        preconditions:
          - "now() >= scheduled_pay_at."
          - "Event.posture == CLEAN."
        side_effects:
          - "Emit SyncEvent(target_system=PAYMENT, kind=PRIZE_PAID)."
          - "Emit SyncEvent(target_system=IM, kind=PRIZE_PAID notice)."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade on Event CANCELLED"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two referees race to submit cross-verifying ResultEntry; the second one's scores disagree with the first"
    guarantee: "First-writer-wins on Match.status -> RESULT_PENDING. Second submission with mismatched scores is rejected; Match remains RESULT_PENDING and Dispute is NOT auto-opened."
    error_id: ERR_RESULT_DISAGREEMENT
    http_status: 409
    serialization: "Compare to existing REFEREE_SUBMISSION ResultEntry; reject if scores differ."

  - scenario: "Organizer revokes a HEAD RefereeAssignment while the same referee races to submit a result"
    guarantee: "Exactly one operation succeeds; loser is rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on RefereeAssignment.status."

  - scenario: "Organizer issues /events/{id}/draw concurrently with a Participant /withdraw"
    guarantee: "First-writer-wins on Event.status. If draw wins, the late withdraw still succeeds (cascade voids matches). If withdraw wins and registered_count drops below capacity_min, draw is rejected."
    error_id: ERR_REGISTRATION_BELOW_MIN
    http_status: 409
    serialization: "First-writer-wins on Event.status -> DRAWN."

  - scenario: "Two organizers concurrently /complete the same event"
    guarantee: "At most one COMPLETED transition fires; second is rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Event.status."

  - scenario: "DopingOfficer concurrently appends two custody rows to the same DopingSample"
    guarantee: "Second append rejected if its at <= prior chain_log tail.at; chain_log strictly monotone."
    error_id: ERR_CHAIN_OF_CUSTODY_BROKEN
    http_status: 409
    serialization: "Strict monotonicity on chain_log[].at."

  - scenario: "Participant files Appeal at the exact moment the 14-day system deadline runs (clock advance crossing created_at+14d)"
    guarantee: "Inclusive boundary belongs to the participant: an Appeal POSTed when now() == created_at + 14d still succeeds; the system FINAL transition runs only when now() > created_at + 14d."
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bracket_seeding
    trigger: "Event REGISTRATION_CLOSED -> DRAWN"
    algorithm: weighted_scoring
    formula: |
      Inputs: Participants P with status REGISTERED for the event, ordered.
      Step 1 — Sort participants by composite key, ascending:
        sort_key(p) = ( seeding_priority(p), -ranking_score(p), p.id )
      where:
        seeding_priority(p) =
          0 if p.world_ranking is not null AND p.world_ranking <= 16
          1 if p.region == event.country_code's region (REGION seeding band)
          2 otherwise (RANDOM band, deterministically ordered by p.id)
        ranking_score(p) =
          (10000 - p.world_ranking) if p.world_ranking is not null else 0
        Tie-break: ascending p.id (UUID lexicographic).
      Step 2 — Assign bracket_seed = 1..N in sorted order; N = registered_count.
      Step 3 — Build single-elimination bracket of size 2^ceil(log2(N)).
        Pair seed 1 vs seed N, seed 2 vs seed N-1, ...
        Apply avoidance rules: never seat two participants with the same team_code or same country_code
          in the same first-round Match. Avoidance pass scans pairs left-to-right;
          on conflict, swap the lower-seed participant of the conflicting pair with
          the next non-conflicting lower-seed participant downstream (deterministic).
        If the avoidance pass cannot resolve all conflicts in one sweep,
          calculation fails with ERR_AVOIDANCE_INFEASIBLE.
      Step 4 — Bye handling: if N < 2^ceil(log2(N)), the top (2^ceil(log2(N)) - N) seeds receive
        BYEs in round 1 (their Match has away_participant_id = null and status = BYE on Event DRAWN).
    input_set: "Participant rows with status == REGISTERED at the moment of the /draw call. Late withdrawals processed before the draw lower the input set."
    constants:
      MAX_PARTICIPANTS: 256
    precision: "Integer seeds; deterministic across reruns."

  - name: ranking_calculation
    trigger: "Match SCHEDULED/RESULT_PENDING/DISPUTED -> LOCKED, and Participant DISQUALIFIED, and Event IN_PROGRESS -> COMPLETED"
    algorithm: aggregation
    formula: |
      For each Participant p in event with status NOT IN {WITHDRAWN, DISQUALIFIED}:
        Let M = { Match m : m.event_id = event.id AND m.status = LOCKED AND p in {home_participant_id, away_participant_id} }
        points(p) =
          for event_type SINGLE_ELIM:    sum over m in M of (3 if winner_participant_id == p else 0)
          for event_type ROUND_ROBIN:    sum over m in M of:
              3 if winner_participant_id == p
              1 if locked_home_score == locked_away_score (draw)
              0 otherwise
          for event_type SETS_MATCH:     sum over m in M of (locked_<side>_sets_won where p is that side)
        goal_difference(p) = sum over m in M of (locked_p_score - locked_opponent_score)
        away_goals(p) = sum over m in M of (locked_p_score where p == away_participant_id)
        sets_won(p) = sum over m in M of (locked_<side>_sets_won where p is that side)  [SETS_MATCH only]
      Provisional rank: sort participants ascending by tie-break sequence (see variants).
      DISQUALIFIED participants excluded from ordering; their RankingEntry rows are kept
      with provisional_rank = null.
    input_set: "All Match rows with status == LOCKED. WITHDRAWN/DISQUALIFIED participants excluded from ordering but their participated matches still count for opponents."
    constants:
      WIN_POINTS_TEAM: 3
      DRAW_POINTS_TEAM: 1
    precision: "Integer accumulators."
    variants:
      - name: provisional
        when: "Recomputed on each Match LOCK during IN_PROGRESS."
        difference: "Points/goal_difference/etc reflect only matches LOCKED so far. provisional_rank populated, final_rank null."
      - name: final
        when: "Event IN_PROGRESS -> COMPLETED."
        difference: "Recomputed once over all LOCKED matches; final_rank = provisional_rank at that instant. Subsequent dispute corrections do NOT update final_rank — only AuditLog records the divergence."

  - name: tie_break_sequence
    trigger: "Embedded inside ranking_calculation when sorting"
    algorithm: chronological
    formula: |
      Sort participants ascending by these keys IN ORDER, the first non-tie wins:
        1. -points(p)                      (more points first)
        2. -goal_difference(p)             (better diff first)
        3. -head_to_head_points(p, peer)   (only when comparing two specific tied peers — pairwise lookup)
        4. -away_goals(p)                  (more away goals first)
        5. -sets_won(p)                    (only for SETS_MATCH event_type; otherwise skipped)
        6. p.id                            (UUID lexicographic; stable deterministic break)
      head_to_head_points(p, peer) is the points p earned in LOCKED matches vs peer only.
      Keys 4 and 5 are evaluated in this strict order regardless of event_type, but key 5 is null for non-SETS_MATCH and behaves as 0.
    input_set: "Participants competing for adjacent ranks."
    constants:
      MAX_TIE_BREAK_DEPTH: 6
    precision: "Integer comparisons."

  - name: prize_calculation
    trigger: "Event IN_PROGRESS -> COMPLETED, and recomputed on Sanction ISSUED/REVOKED cascade"
    algorithm: tiered_pricing
    formula: |
      Event.prize_pool_cents is allocated by final_rank tier:
        tier 1 (rank 1):       50% of prize_pool_cents
        tier 2 (rank 2):       25% of prize_pool_cents
        tier 3 (ranks 3-4):    10% of prize_pool_cents EACH
        tier 4 (ranks 5-8):     1.25% of prize_pool_cents EACH
        ranks > 8:              0
      Step 1 — gross_per_rank(rank) computed by integer-math, rounded HALF-UP per cent.
        Use the formula's percent as a rational: gross_cents = ceil_div_round_half_up(prize_pool_cents * pct_numerator, pct_denominator * 100).
        Allocate per rank in this order: rank 1, 2, 3, 4, 5, 6, 7, 8.
        Any residual cent from rounding accumulates and is added to rank-1's allocation.
      Step 2 — tax_withheld_cents = round_half_up(gross_amount_cents * tax_withholding_pct / 100), with rounding done AFTER the per-tier rounding (rounding order pinned: per-rank rounding first, then per-row tax rounding).
      Step 3 — forfeit_amount_cents:
        if Participant.status == DISQUALIFIED OR a SanctionRecord with status in {ISSUED, FINAL} exists for the participant in this event: forfeit_amount_cents = gross_amount_cents.
        else: forfeit_amount_cents = 0.
      Step 4 — net_amount_cents = gross_amount_cents - tax_withheld_cents - forfeit_amount_cents (>= 0; clamp at 0).
      Step 5 — scheduled_pay_at = Event.starts_at + 7 * 24 * 3600 seconds.
      Step 6 — Multi-currency: amounts always denominated in Event.settlement_currency; for JPY, all cents fields treat 1 unit = 1 yen (no fractional yen — set precision constant FRACTIONAL_UNITS[JPY]=1, others=100). All "cents" math still uses integers.
    input_set: "All ranked Participant rows for this event."
    constants:
      TIER_PCTS:
        rank_1: "50"
        rank_2: "25"
        rank_3_each: "10"
        rank_5_8_each: "1.25"
      PAYOUT_DELAY_SECONDS: 604800
      FRACTIONAL_UNITS:
        USD: 100
        EUR: 100
        GBP: 100
        JPY: 1
    precision: "Per-rank rounding HALF-UP first, then per-row tax rounding HALF-UP."
    variants:
      - name: gross_first
        when: "Initial computation at Event COMPLETED."
        difference: "tax_withheld and forfeit applied to the just-rounded gross_amount_cents — order pinned per Step 2."
      - name: post_sanction_recompute
        when: "Sanction ISSUED/REVOKED triggers cascade on PrizePayment."
        difference: "gross_amount_cents is FROZEN at COMPLETED time — only forfeit_amount_cents flips; tax stays as originally computed (i.e., we recompute net as gross - frozen_tax - new_forfeit). This is structurally distinct from variant gross_first because re-running gross_first on a partially-paid pool produces different cents due to rank-1 residual reallocation."

  - name: event_posture
    trigger: "On every SanctionRecord/Appeal status change"
    algorithm: aggregation
    formula: |
      open_sanctions = count of SanctionRecord with sample.event_id == self AND status IN {ISSUED, APPEALED}
      pending_appeals = count of Appeal with sanction.sample.event_id == self AND status == PENDING
      if pending_appeals > 0 OR exists SanctionRecord with status == APPEALED for this event:
        posture = FROZEN
      elif open_sanctions > 0:
        posture = UNDER_REVIEW
      else:
        posture = CLEAN
    input_set: "All SanctionRecord and Appeal rows traceable to this event via DopingSample.event_id."
    constants: {}
    precision: "Enum result."

# =============================================================================
# §1.4 Validation Rules Table (ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request carries valid X-User-ID and X-User-Role headers."
    error_id: ERR_AUTH
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role permitted for endpoint per RBAC."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All resources referenced left-to-right in URL path exist (Event, Match, RefereeAssignment, Participant, DopingSample, SanctionRecord, Appeal, Dispute)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all GET/PUT/PATCH/DELETE/POST on /{id} subpaths"

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys (event_id, match_id, participant_id, referee_id, sample_id) refer to existing rows in the same scope."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all POSTs that name FKs in body"

  - priority: 5
    category: state
    check: "Operation's source state is the resource's current state (per §1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "Event.posture != FROZEN gates: POST /matches/{id}/results, POST /prize-payments (system pay), POST /events/{id}/complete."
    error_id: ERR_EVENT_FROZEN
    http_status: 409
    applies_to: "/matches/{id}/results, /events/{id}/complete, system pay transitions"

  - priority: 7
    category: business_safety
    check: "Chain-of-custody monotonicity: appended at must be strictly greater than the last chain_log entry's at."
    error_id: ERR_CHAIN_OF_CUSTODY_BROKEN
    http_status: 409
    applies_to: "/doping-samples/{id}/custody"

  - priority: 8
    category: business_safety
    check: "Doping result entry is restricted: the same DopingOfficer who appended a RECEIVE custody entry CANNOT submit the result (segregation of duties)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "/doping-samples/{id}/result"

  - priority: 9
    category: business_safety
    check: "Conflict-of-interest: RefereeAssignment refused when Referee.country_code equals one of the Match's participants' country_code, OR Referee.team_affiliation equals a participant's team_code."
    error_id: ERR_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /matches/{id}/referee-assignments"

  - priority: 10
    category: business_referential
    check: "Referee qualification matches event.event_type (qualifications array contains event_type)."
    error_id: ERR_REFEREE_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /matches/{id}/referee-assignments"

  - priority: 11
    category: business_referential
    check: "On RefereeAssignment, no two assignments for the same referee may overlap in [scheduled_start_at, scheduled_end_at] across all matches; ADJACENT half-open intervals (one ends at the same instant the next begins) are allowed without buffer."
    error_id: ERR_REFEREE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /matches/{id}/referee-assignments"

  - priority: 12
    category: business_referential
    check: "On Match scheduling, the same Participant cannot be in two non-VOIDED Matches whose [scheduled_start_at, scheduled_end_at] intervals collide; ADJACENT intervals require a hard 30-minute gap (different interval semantics from referee rule)."
    error_id: ERR_PARTICIPANT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /events/{id}/draw, POST /matches (manual scheduling)"

  - priority: 13
    category: business_temporal
    check: "Registration window: registration_opens_at <= now() < registration_closes_at when registering a Participant."
    error_id: ERR_REGISTRATION_CLOSED
    http_status: 409
    applies_to: "POST /events/{id}/participants"

  - priority: 14
    category: business_temporal
    check: "Appeal window: Appeal must be filed when now() <= sanction.created_at + 14 days (inclusive boundary belongs to participant)."
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /appeals"

  - priority: 15
    category: business_constraint
    check: "Capacity: registered_count < capacity_max when registering a participant."
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /events/{id}/participants"

  - priority: 16
    category: business_constraint
    check: "Draw eligibility: registered_count >= capacity_min when calling /draw."
    error_id: ERR_REGISTRATION_BELOW_MIN
    http_status: 409
    applies_to: "POST /events/{id}/draw"

  - priority: 17
    category: business_constraint
    check: "Avoidance feasibility: bracket_seeding's avoidance pass succeeds (no first-round same-team or same-country pairing remains)."
    error_id: ERR_AVOIDANCE_INFEASIBLE
    http_status: 422
    applies_to: "POST /events/{id}/draw"

  - priority: 18
    category: business_constraint
    check: "Result entry score validity per event_type: SINGLE_ELIM requires home_score != away_score (one must win); ROUND_ROBIN allows draws; SETS_MATCH requires home_sets_won != away_sets_won AND non-null sets_won fields."
    error_id: ERR_INVALID_SCORE
    http_status: 422
    applies_to: "POST /matches/{id}/results, dispute-driven CORRECTION"

  - priority: 19
    category: business_constraint
    check: "Cross-verification: the second ResultEntry must come from a referee whose RefereeAssignment.referee_id != the first entry's referee. Otherwise ERR_DUPLICATE_REFEREE_ENTRY."
    error_id: ERR_DUPLICATE_REFEREE_ENTRY
    http_status: 409
    applies_to: "POST /matches/{id}/results"

  - priority: 20
    category: business_constraint
    check: "Cross-verification disagreement: scores disagree with the prior REFEREE_SUBMISSION."
    error_id: ERR_RESULT_DISAGREEMENT
    http_status: 409
    applies_to: "POST /matches/{id}/results"

  - priority: 21
    category: business_fiscal
    check: "Entry fee paid amount matches Event.entry_fee_cents exactly (no over/underpay)."
    error_id: ERR_ENTRY_FEE_MISMATCH
    http_status: 422
    applies_to: "POST /events/{id}/participants"

  - priority: 22
    category: business_fiscal
    check: "Tax withholding percentage 0.00..50.00 inclusive."
    error_id: ERR_TAX_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /events"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Events -----
  - method: POST
    path: "/events"
    description: "Create a new event (DRAFT)."
    roles: [Organizer]
    code: 201
    input: [name, event_type, country_code, regulations_text, registration_opens_at, registration_closes_at, starts_at, entry_fee_cents, settlement_currency, capacity_min, capacity_max, prize_pool_cents, tax_withholding_pct]
    output: Event
    side_effects: []

  - method: GET
    path: "/events/{event_id}"
    description: "Read event."
    roles: [Organizer, Referee, Participant, DisciplinaryOfficer, DopingOfficer, AppealsBoard]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: GET
    path: "/events"
    description: "List events with filtering by status, country_code."
    roles: [Organizer, Referee, Participant, DisciplinaryOfficer, DopingOfficer, AppealsBoard]
    code: 200
    input: ["status?", "country_code?", "limit?", "offset?"]
    output: "Event[]"
    side_effects: []

  - method: POST
    path: "/events/{event_id}/open"
    description: "DRAFT -> OPEN."
    roles: [Organizer]
    code: 200
    input: ["version?"]
    output: Event
    side_effects: ["Event.status -> OPEN"]

  - method: POST
    path: "/events/{event_id}/close-registration"
    description: "OPEN -> REGISTRATION_CLOSED (manual override)."
    roles: [Organizer]
    code: 200
    input: ["version?"]
    output: Event
    side_effects: ["Event.status -> REGISTRATION_CLOSED"]

  - method: POST
    path: "/events/{event_id}/draw"
    description: "REGISTRATION_CLOSED -> DRAWN; runs bracket_seeding."
    roles: [Organizer]
    code: 200
    input: ["version?"]
    output: Event
    side_effects: ["bracket_seeding cascade", "Match rows created", "Participant SEEDED", "SyncEvent DRAW_ANNOUNCED emitted"]

  - method: POST
    path: "/events/{event_id}/start"
    description: "DRAWN -> IN_PROGRESS."
    roles: [Organizer]
    code: 200
    input: ["version?"]
    output: Event
    side_effects: ["Participant SEEDED -> ACTIVE"]

  - method: POST
    path: "/events/{event_id}/complete"
    description: "IN_PROGRESS -> COMPLETED; computes final ranking and prize payments."
    roles: [Organizer]
    code: 200
    input: ["version?"]
    output: Event
    side_effects: ["ranking_calculation final variant", "prize_calculation cascade", "PrizePayment rows created"]

  - method: POST
    path: "/events/{event_id}/cancel"
    description: "Cancel event (DRAFT/OPEN/REGISTRATION_CLOSED -> CANCELLED)."
    roles: [Organizer]
    code: 200
    input: ["version?"]
    output: Event
    side_effects: ["Cascade Participant -> WITHDRAWN", "Cascade PrizePayment -> CANCELLED if any"]

  # ----- Participants -----
  - method: POST
    path: "/events/{event_id}/participants"
    description: "Register a participant."
    roles: [Organizer]
    code: 201
    input: [athlete_external_id, display_name, team_code, country_code, world_ranking, region, entry_fee_paid_cents]
    output: Participant
    side_effects: ["Increment Event.registered_count", "Emit SyncEvent ENTRY_FEE_CHARGED to PAYMENT"]

  - method: GET
    path: "/events/{event_id}/participants"
    description: "List participants for event."
    roles: [Organizer, Referee, Participant, DisciplinaryOfficer, DopingOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Participant[]"
    side_effects: []

  - method: POST
    path: "/participants/{participant_id}/withdraw"
    description: "Participant -> WITHDRAWN."
    roles: [Organizer]
    code: 200
    input: ["version?"]
    output: Participant
    side_effects: ["Match VOIDED cascade if SEEDED participant; SyncEvent ENTRY_FEE_CHARGED refund"]

  # ----- Referees & Assignments -----
  - method: POST
    path: "/referees"
    description: "Create a referee record."
    roles: [Organizer]
    code: 201
    input: [full_name, country_code, team_affiliation, qualifications, grade]
    output: Referee
    side_effects: []

  - method: GET
    path: "/referees"
    description: "List referees with qualification & active filters."
    roles: [Organizer]
    code: 200
    input: ["qualification?", "is_active?", "limit?", "offset?"]
    output: "Referee[]"
    side_effects: []

  - method: POST
    path: "/matches/{match_id}/referee-assignments"
    description: "Assign a referee (HEAD/ASSISTANT/SUBSTITUTE) to a match."
    roles: [Organizer]
    code: 201
    input: [referee_id, role, "replaces_assignment_id?"]
    output: RefereeAssignment
    side_effects: []

  - method: POST
    path: "/referee-assignments/{assignment_id}/activate"
    description: "ASSIGNED -> ACTIVATED (manual; system may also auto-activate)."
    roles: [Organizer]
    code: 200
    input: ["version?"]
    output: RefereeAssignment
    side_effects: []

  - method: POST
    path: "/referee-assignments/{assignment_id}/revoke"
    description: "ASSIGNED/ACTIVATED -> REVOKED."
    roles: [Organizer]
    code: 200
    input: ["version?"]
    output: RefereeAssignment
    side_effects: ["If HEAD/ASSISTANT and SUBSTITUTE queued, auto-promote substitute via new ASSIGNED row"]

  # ----- Matches & Results & Disputes -----
  - method: GET
    path: "/events/{event_id}/matches"
    description: "List matches for event with status filter."
    roles: [Organizer, Referee, Participant, DisciplinaryOfficer]
    code: 200
    input: ["status?", "round_index?", "limit?", "offset?"]
    output: "Match[]"
    side_effects: []

  - method: POST
    path: "/matches/{match_id}/results"
    description: "Referee submits a result (REFEREE_SUBMISSION). Cross-verification logic gates LOCK."
    roles: [Referee]
    code: 201
    input: [submitted_by_assignment_id, home_score, away_score, "home_sets_won?", "away_sets_won?"]
    output: ResultEntry
    side_effects: ["Match SCHEDULED -> RESULT_PENDING on first entry; -> LOCKED on matching second entry; ranking_calculation cascade on lock"]

  - method: POST
    path: "/matches/{match_id}/disputes"
    description: "Participant files dispute on a match (RESULT_PENDING or LOCKED)."
    roles: [Participant]
    code: 201
    input: [filed_by_participant_id, reason_text]
    output: Dispute
    side_effects: ["Match -> DISPUTED if was LOCKED"]

  - method: POST
    path: "/disputes/{dispute_id}/resolve"
    description: "DisciplinaryOfficer upholds (with optional corrected scores) or rejects a dispute."
    roles: [DisciplinaryOfficer]
    code: 200
    input: [uphold, "corrected_home_score?", "corrected_away_score?", "corrected_home_sets_won?", "corrected_away_sets_won?", "version?"]
    output: Dispute
    side_effects: ["Match DISPUTED -> LOCKED; if uphold=true, write CORRECTION ResultEntry & AuditLog RESULT_CHANGE"]

  # ----- Doping -----
  - method: POST
    path: "/events/{event_id}/doping-samples"
    description: "Open a sampling list entry for a participant."
    roles: [DopingOfficer]
    code: 201
    input: [participant_id, collected_at]
    output: DopingSample
    side_effects: []

  - method: POST
    path: "/doping-samples/{sample_id}/custody"
    description: "Append chain-of-custody entry (DISPATCH/RECEIVE)."
    roles: [DopingOfficer]
    code: 200
    input: [action, at, "version?"]
    output: DopingSample
    side_effects: ["State transition COLLECTED->IN_TRANSIT or IN_TRANSIT->RECEIVED"]

  - method: POST
    path: "/doping-samples/{sample_id}/result"
    description: "Submit lab result (positive or negative)."
    roles: [DopingOfficer]
    code: 200
    input: [positive, "result_text?", "version?"]
    output: DopingSample
    side_effects: ["If positive=true: SanctionRecord ISSUED, Participant DISQUALIFIED, Event.posture recomputed, AuditLog written"]

  - method: POST
    path: "/doping-samples/{sample_id}/void"
    description: "Void a sample (administrative)."
    roles: [DopingOfficer]
    code: 200
    input: ["version?"]
    output: DopingSample
    side_effects: []

  # ----- Sanctions & Appeals -----
  - method: GET
    path: "/sanctions/{sanction_id}"
    description: "Read sanction record."
    roles: [DisciplinaryOfficer, AppealsBoard, Participant]
    code: 200
    input: []
    output: SanctionRecord
    side_effects: []

  - method: POST
    path: "/appeals"
    description: "Participant files appeal on a sanction."
    roles: [Participant]
    code: 201
    input: [sanction_id, ground_text]
    output: Appeal
    side_effects: ["SanctionRecord ISSUED -> APPEALED; Event.posture FROZEN; AuditLog SANCTION_CHANGE"]

  - method: POST
    path: "/appeals/{appeal_id}/decide"
    description: "AppealsBoard upholds or dismisses an appeal."
    roles: [AppealsBoard]
    code: 200
    input: [uphold, "version?"]
    output: Appeal
    side_effects: ["Cascade SanctionRecord REVOKED/FINAL; PrizePayment FORFEITED -> SCHEDULED on revoke; Event.posture recomputed"]

  # ----- Rankings & Prize Payments -----
  - method: GET
    path: "/events/{event_id}/rankings"
    description: "Read provisional or final rankings."
    roles: [Organizer, Referee, Participant, DisciplinaryOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "RankingEntry[]"
    side_effects: []

  - method: GET
    path: "/events/{event_id}/prize-payments"
    description: "List prize payments."
    roles: [Organizer, Participant, DisciplinaryOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PrizePayment[]"
    side_effects: []

  # ----- Audit & Sync -----
  - method: GET
    path: "/audit-logs"
    description: "List audit log entries (immutable)."
    roles: [Organizer, DisciplinaryOfficer, AppealsBoard]
    code: 200
    input: ["kind?", "subject_kind?", "subject_id?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

  - method: GET
    path: "/sync-events"
    description: "List outbox events."
    roles: [Organizer]
    code: 200
    input: ["target_system?", "kind?", "limit?", "offset?"]
    output: "SyncEvent[]"
    side_effects: []

  # ----- Test-driving endpoints (system) -----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock to the given ISO 8601 instant. Triggers all clock-driven transitions: registration auto-close, event auto-start, prize-payment payout, sanction FINAL after 14d."
    roles: [Organizer]
    code: 200
    input: [to]
    output: object
    side_effects: ["Cascade: Event auto-close/start; PrizePayment SCHEDULED -> PAID; SanctionRecord ISSUED -> FINAL"]

  - method: POST
    path: "/_sweep/run"
    description: "Run all idempotent system sweeps once (recompute postures, advance auto-state machines)."
    roles: [Organizer]
    code: 200
    input: []
    output: object
    side_effects: ["Idempotent recompute"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH
    http: 401
    condition: "Missing or unrecognized X-User-ID / X-User-Role."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "X-User-Role lacks permission for endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "URL path resource missing."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body-referenced resource missing."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in required state for transition."
  - id: ERR_EVENT_FROZEN
    http: 409
    condition: "Event.posture == FROZEN gates the operation."
  - id: ERR_REGISTRATION_CLOSED
    http: 409
    condition: "Registration window has closed (now() >= registration_closes_at) or not yet open."
  - id: ERR_REGISTRATION_BELOW_MIN
    http: 409
    condition: "registered_count < capacity_min at /draw."
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "registered_count >= capacity_max on /participants."
  - id: ERR_AVOIDANCE_INFEASIBLE
    http: 422
    condition: "Same-team / same-country avoidance pass cannot resolve all first-round conflicts."
  - id: ERR_INVALID_SCORE
    http: 422
    condition: "Score is invalid for the event_type (e.g., draw on SINGLE_ELIM, missing sets_won on SETS_MATCH)."
  - id: ERR_DUPLICATE_REFEREE_ENTRY
    http: 409
    condition: "Same referee submits a second result entry on the same match."
  - id: ERR_RESULT_DISAGREEMENT
    http: 409
    condition: "Cross-verifying entry has scores not matching the prior REFEREE_SUBMISSION."
  - id: ERR_REFEREE_NOT_QUALIFIED
    http: 422
    condition: "Referee.qualifications does not include event.event_type."
  - id: ERR_CONFLICT_OF_INTEREST
    http: 422
    condition: "Referee shares country_code or team_affiliation with a participant of the match."
  - id: ERR_REFEREE_TIME_CONFLICT
    http: 409
    condition: "Same referee assigned to overlapping intervals across matches."
  - id: ERR_PARTICIPANT_TIME_CONFLICT
    http: 409
    condition: "Same participant scheduled in overlapping (or sub-30-min adjacent) matches."
  - id: ERR_ENTRY_FEE_MISMATCH
    http: 422
    condition: "entry_fee_paid_cents != Event.entry_fee_cents."
  - id: ERR_TAX_OUT_OF_RANGE
    http: 422
    condition: "tax_withholding_pct outside [0, 50]."
  - id: ERR_CHAIN_OF_CUSTODY_BROKEN
    http: 409
    condition: "Append at <= last chain_log entry's at."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same DopingOfficer who recorded RECEIVE custody is attempting to enter the lab result."
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "Now > sanction.created_at + 14 days at /appeals."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC: supplied version != server-stored version."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic body validation failure (unknown field, type mismatch, missing required field)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Organizer
    description: "Creates and manages events, participants, referees, draws, scheduling, and cancellations."
    identity: "opaque"
    exclusive_operations:
      - "POST /events"
      - "POST /events/{id}/open"
      - "POST /events/{id}/close-registration"
      - "POST /events/{id}/draw"
      - "POST /events/{id}/start"
      - "POST /events/{id}/complete"
      - "POST /events/{id}/cancel"
      - "POST /events/{id}/participants"
      - "POST /participants/{id}/withdraw"
      - "POST /referees"
      - "POST /matches/{id}/referee-assignments"
      - "POST /referee-assignments/{id}/activate"
      - "POST /referee-assignments/{id}/revoke"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "GET /events"
      - "GET /events/{id}"
      - "GET /events/{id}/participants"
      - "GET /events/{id}/matches"
      - "GET /events/{id}/rankings"
      - "GET /events/{id}/prize-payments"
      - "GET /audit-logs"
      - "GET /sync-events"
      - "GET /referees"
      - "GET /sanctions/{id}"

  - name: Referee
    description: "Submits match results."
    identity: "entity_backed:Referee"
    exclusive_operations:
      - "POST /matches/{match_id}/results"
    shared_operations:
      - "GET /events"
      - "GET /events/{id}"
      - "GET /events/{id}/matches"
      - "GET /events/{id}/participants"
      - "GET /events/{id}/rankings"

  - name: Participant
    description: "A registered athlete; can file disputes and appeals."
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /matches/{match_id}/disputes"
      - "POST /appeals"
    shared_operations:
      - "GET /events"
      - "GET /events/{id}"
      - "GET /events/{id}/participants"
      - "GET /events/{id}/matches"
      - "GET /events/{id}/rankings"
      - "GET /events/{id}/prize-payments"
      - "GET /sanctions/{id}"

  - name: DisciplinaryOfficer
    description: "Resolves disputes (score corrections). MUST NOT also act as Referee on the same match — segregation of duties enforced via role distinction."
    identity: "opaque"
    exclusive_operations:
      - "POST /disputes/{id}/resolve"
    shared_operations:
      - "GET /events"
      - "GET /events/{id}/matches"
      - "GET /events/{id}/rankings"
      - "GET /events/{id}/prize-payments"
      - "GET /audit-logs"
      - "GET /sanctions/{id}"
      - "GET /events/{id}/participants"

  - name: DopingOfficer
    description: "Manages doping samples, custody, and lab result entry. MUST NOT submit a sample's lab result if they are the DopingOfficer who recorded its RECEIVE custody (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /events/{event_id}/doping-samples"
      - "POST /doping-samples/{id}/custody"
      - "POST /doping-samples/{id}/result"
      - "POST /doping-samples/{id}/void"
    shared_operations:
      - "GET /events"
      - "GET /events/{id}"
      - "GET /events/{id}/participants"

  - name: AppealsBoard
    description: "Decides appeals against sanctions."
    identity: "opaque"
    exclusive_operations:
      - "POST /appeals/{id}/decide"
    shared_operations:
      - "GET /events"
      - "GET /events/{id}"
      - "GET /sanctions/{id}"
      - "GET /audit-logs"
