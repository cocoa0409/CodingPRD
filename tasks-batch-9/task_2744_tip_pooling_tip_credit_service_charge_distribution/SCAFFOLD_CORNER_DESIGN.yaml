            - "trigger 5 returns HTTP 200 with status == APPLIED, and GET /pay-lines/${line_id} reports version == 5, correction_applied_cents == 800, pending_correction_cents == 0 and total_gross_cents == 2504"
            - "trigger 6 returns HTTP 412 with data.error_id == ERR_STALE_PAY_LINE_VERSION: applying a correction is the fourth writer of the version, so a value read before the apply is stale even though no correction was issued in between"
            - "the captured ${v5} equals 5"
            - "trigger 8 returns HTTP 201 with status == PENDING, dispute_id == null and supersedes_correction_id == null, and GET /pay-lines/${line_id} finally reports version == 6, pending_correction_cents == 200 and total_gross_cents == 2504"

      - name: eight_percent_allocated_tips_threshold_boundary
