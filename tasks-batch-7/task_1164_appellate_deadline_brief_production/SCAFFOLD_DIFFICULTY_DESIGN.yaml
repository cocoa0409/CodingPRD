              payload: { bar_number: "BAR-CE2", full_name: "CE2", email: "ce2@x.com", admitted_court_ids: ["${court_ce2}"] }
              as: CourtAdmin
              captures: { att_ce2: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${court_ce2}", docket_number: "CE-2", caption: "CE2", lead_attorney_id: "${att_ce2}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-02T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_ce2}"
              captures: { case_ce2: $.data.id }
            - call: "POST /appellate/cases/${case_ce2}/decisions"
              payload: { outcome: "AFFIRMED", issued_at: "2026-08-01T12:00:00Z" }
              as: CourtClerk
              captures: { dec_ce2: $.data.id }
            # Create petition (allowed even before posture is DECIDED? spec says posture must be DECIDED at FILE time, not at create)
            - call: "POST /appellate/cases/${case_ce2}/petitions"
              payload: { petition_type: "REHEARING", basis_decision_id: "${dec_ce2}" }
              as: Attorney
              as_user_id: "${att_ce2}"
              captures: { pet_ce2: $.data.id }
          trigger:
            # Petition created OK because decision exists; but verify the file gate respects posture
            # In this setup posture is already DECIDED (decision was entered), so file should succeed.
            # To make the test meaningful, we instead try filing BEFORE the decision — but petition requires basis_decision_id.
            # Alternative: verify petition CANNOT be filed when its due_at has passed — but that's a different validation.
            # The honest test: file the petition; assert it succeeds (because posture == DECIDED).
            - call: "POST /appellate/petitions/${pet_ce2}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_ce2}"
              captures: { pet_status: "$.data.status" }
          assert:
            - "FurtherReviewPetition.${pet_ce2}.status == FILED (file gate passed because case.posture == DECIDED after decision entered)"
            - "Decision.${dec_ce2}.rehearing_deadline_at == '2026-08-15T12:00:00Z'"

  # -------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: oral_argument_half_open_overlap_rejected
        grounds:
          - calculations.oral_argument_conflict_check
          - validations[priority=12]
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on the resource = court
          hearing calendar. A second argument that overlaps by any positive
          epsilon (e.g., second starts 1 minute before first ends) is rejected
          with ERR_ARGUMENT_OVERLAP. Adjacency (end == start) is NOT overlap.
          Resource = Court calendar.
        test_recipe:
          setup:
            - "Court with default notice window"
            - "Two cases in ARGUMENT_PENDING with OralArgument in REQUESTED"
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "OV1", name: "OV1 Court", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: false, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { court_ov1: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-OV1", full_name: "OV1", email: "ov1@x.com", admitted_court_ids: ["${court_ov1}"] }
              as: CourtAdmin
              captures: { att_ov1: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${court_ov1}", docket_number: "OV-A", caption: "OV-A", lead_attorney_id: "${att_ov1}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-02T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_ov1}"
              captures: { case_ova: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${court_ov1}", docket_number: "OV-B", caption: "OV-B", lead_attorney_id: "${att_ov1}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-02T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_ov1}"
              captures: { case_ovb: $.data.id }
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/cases/${case_ova}/oral-arguments"
              payload: { scheduled_start: "2026-08-01T14:00:00Z", duration_minutes: 30, panel_judges: ["J1"] }
              as: CourtClerk
              captures: { oa_ova: $.data.id }
            - call: "POST /appellate/cases/${case_ovb}/oral-arguments"
              payload: { scheduled_start: "2026-08-01T14:29:00Z", duration_minutes: 30, panel_judges: ["J1"] }
              as: CourtClerk
              captures: { oa_ovb: $.data.id }
            - call: "POST /appellate/oral-arguments/${oa_ova}/schedule"
              payload: { scheduled_start: "2026-08-01T14:00:00Z", duration_minutes: 30 }
              as: CourtClerk
          trigger:
            - call: "POST /appellate/oral-arguments/${oa_ovb}/schedule"
              payload: { scheduled_start: "2026-08-01T14:29:00Z", duration_minutes: 30 }
              as: CourtClerk
              captures: { err_id: "$.data.error_id" }
          assert:
            - "error_id == ERR_ARGUMENT_OVERLAP"
            - "HTTP status == 409"
            - "Second argument starting at 14:29 (1 minute before first ends at 14:30) overlaps with [14:00, 14:30) — strictly-less comparison triggers rejection"

      - name: transcript_delivery_deadline_vs_record_designation_window
        grounds:
          - calculations.oral_argument_conflict_check
          - entities.TranscriptOrder.fields.due_at
          - entities.Record.fields.designation_due_at
        distinguishing_aspect: |
          Interval semantics = aggregate-capacity / deadline stacking on the
          resource = attorney time budget across cases. The TranscriptOrder
          due_at is computed as ordered_at + 30 days; the Record designation
          window is computed independently from notice_filed_at + court
          designation_days. A transcript ordered on the LAST day of the
          designation window can have its delivery deadline fall AFTER the
          designation_due_at — a stacked-deadline conflict detectable only by
          interval arithmetic on two independent windows. Different interval
          semantics (aggregate stacking, not half-open overlap) and different
          resource (attorney calendar, not court calendar).
        test_recipe:
          setup:
            - "Case with notice filed 2026-06-01; record designation_due_at = 2026-06-11 (10 days)"
            - "Transcript order placed on 2026-06-11 (last day of designation window)"
            - "Transcript due_at = 2026-07-11 (ordered_at + 30 days) — falls AFTER designation window closes"
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "OV2", name: "OV2 Court", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: false, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { court_ov2: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-OV2", full_name: "OV2", email: "ov2@x.com", admitted_court_ids: ["${court_ov2}"] }
              as: CourtAdmin
              captures: { att_ov2: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${court_ov2}", docket_number: "OV-2", caption: "OV-2", lead_attorney_id: "${att_ov2}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_ov2}"
              captures: { case_ov2: $.data.id }
            - call: "POST /appellate/cases/${case_ov2}/filings"
              payload: { filing_type: "NOTICE_OF_APPEAL", method: "EFILE", served_party_emails: ["o@x.com"] }
              as: Attorney
              as_user_id: "${att_ov2}"
              captures: { f_ov2: $.data.id }
            - call: "POST /appellate/filings/${f_ov2}/accept"
              payload: {}
              as: CourtClerk
            - call: "GET /appellate/cases/${case_ov2}/record"
              payload: {}
              as: Attorney
              as_user_id: "${att_ov2}"
              captures: { rec_ov2: "$.data[0].id", rec_desig_due: "$.data[0].designation_due_at" }
            - call: "POST /appellate/records/${rec_ov2}/designate"
              payload: {}
              as: Attorney
              as_user_id: "${att_ov2}"
            # Advance clock to last day of designation window
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: CourtAdmin
          trigger:
            - call: "POST /appellate/records/${rec_ov2}/transcript-orders"
              payload: { hearing_date: "2026-04-01T10:00:00Z", court_reporter: "R", estimated_pages: 5 }
              as: Attorney
              as_user_id: "${att_ov2}"
              captures: { to_ov2: $.data.id, to_due_at: "$.data.due_at" }
          assert:
            - "TranscriptOrder.${to_ov2}.due_at == '2026-07-11T00:00:00Z' (ordered_at 2026-06-11 + 30 days)"
            - "TranscriptOrder.due_at falls AFTER Record.designation_due_at — stacked-deadline conflict that pure overlap-detection would miss"
            - "Record.designation_due_at < TranscriptOrder.due_at"

  # -------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: schedule_vacate_restores_brief_state_invariant
        grounds:
          - state_machines.BriefingSchedule.ACTIVE_to_VACATED
          - state_machines.BriefingSchedule.PENDING_to_VACATED
        distinguishing_aspect: |
          Conserved quantity = count(Brief.status == DRAFT) on the schedule.
          Forward action: brief transitions DRAFT → IN_REVIEW → READY.
          Compensating action: schedule vacate — all briefs return to DRAFT.
          Invariant: after vacate, every brief on the schedule is back in
          DRAFT (the count of briefs in non-DRAFT states on this schedule is
          zero), and the schedule's extensions_granted_count remains whatever
          it was (vacate does NOT reset extension history).
        test_recipe:
          setup:
            - "Case in BRIEFING with ACTIVE schedule"
            - "Two briefs on the schedule: one in IN_REVIEW, one in READY"
            - "No brief EFILED or ACCEPTED (vacate precondition)"
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "CI1", name: "CI1 Court", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: false, weekend_holiday_rollforward: false }
