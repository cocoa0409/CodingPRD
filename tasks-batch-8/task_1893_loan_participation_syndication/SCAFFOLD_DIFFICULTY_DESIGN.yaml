  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: facility_default_cure_cycle
        grounds:
          - state_machines.Facility.ACTIVE_to_IN_DEFAULT
          - state_machines.Facility.IN_DEFAULT_to_ACTIVE
        distinguishing_aspect: |
          Facility machine is cyclic: ACTIVE -> IN_DEFAULT -> ACTIVE -> IN_DEFAULT again;
          the borrower status cascades DELINQUENT and back on each revolution. Different
          entity from the ConsentVote/ModificationRequest cycle instance.
        test_recipe:
          setup:
            - "Facility 2,000,000 with one funded participant, one SETTLED draw 1,000,000; clock default 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Cycle Borrower", sector: "OTHER", risk_rating: "SPECULATIVE" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Cycle", total_commitment_cents: 2000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 2000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 1000000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
          trigger:
            - { call: "POST /api/default_cases", payload: { facility_id: "${f_id}", default_type: "COVENANT_DEFAULT" }, as: AgentBank, captures: { dc1: $.data.id } }
            - { call: "POST /api/default_cases/${dc1}/cure", payload: {}, as: AgentBank }
            - { call: "POST /api/default_cases", payload: { facility_id: "${f_id}", default_type: "PAYMENT_DEFAULT" }, as: AgentBank, captures: { dc2: $.data.id } }
          assert:
            - "Facility.${f_id}.status == IN_DEFAULT after first declare, == ACTIVE after cure, == IN_DEFAULT again after second declare (cycle traversed twice)"
            - "Borrower.${b_id}.status == DELINQUENT after first declare, == ACTIVE after cure, == DELINQUENT after second declare"
            - "DefaultCase.${dc1}.status == CURED and DefaultCase.${dc2}.status == DECLARED"

      - name: consent_recast_and_resolicitation_cycles
        grounds:
          - state_machines.ConsentVote.CAST_to_RECAST
          - state_machines.ModificationRequest.FAILED_to_SOLICITING
        distinguishing_aspect: |
          ConsentVote CAST -> RECAST -> RECAST self-loop cycle plus ModificationRequest
          SOLICITING -> FAILED -> SOLICITING re-solicitation cycle (prior votes VOIDED);
          non-linear shapes on entities other than Facility.
        test_recipe:
          setup:
            - "Facility 10,000,000 with P1 6,000,000 / P2 3,000,000 / P3 1,000,000 funded; SUPERMAJORITY (6667) RATE_CHANGE modification solicited at 2026-08-01 (window closes 2026-08-16)"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Recast Borrower", sector: "FINANCIAL", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Recast", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 3000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P3", commitment_cents: 1000000 }, as: AgentBank, captures: { p3_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p3_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { s2: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p3_id}", as: AgentBank, captures: { s3: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 600000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s2}/report_wire", payload: { amount_cents: 300000 }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/funding_settlements/${s2}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s3}/report_wire", payload: { amount_cents: 100000 }, as: ParticipantLender, as_user_id: "${p3_id}" }
            - { call: "POST /api/funding_settlements/${s3}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/modification_requests", payload: { facility_id: "${f_id}", modification_type: "RATE_CHANGE", terms: { new_interest_rate_bps: 1100 } }, as: Borrower, as_user_id: "${b_id}", captures: { m_id: $.data.id } }
            - { call: "POST /api/modification_requests/${m_id}/solicit", payload: {}, as: AgentBank }
            - { call: "POST /api/modification_requests/${m_id}/votes", payload: { vote: "APPROVE" }, as: ParticipantLender, as_user_id: "${p1_id}", captures: { v1: $.data.id } }
            - { call: "POST /api/consent_votes/${v1}/recast", payload: { vote: "REJECT" }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/consent_votes/${v1}/recast", payload: { vote: "APPROVE" }, as: ParticipantLender, as_user_id: "${p1_id}", captures: { rc: $.data.recast_count } }
            - { call: "POST /api/modification_requests/${m_id}/votes", payload: { vote: "ABSTAIN" }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: AgentBank }
          trigger:
            - { call: "POST /api/modification_requests/${m_id}/tally_close", payload: {}, as: AgentBank, captures: { tally1: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T00:00:00Z" }, as: AgentBank }
            - { call: "POST /api/modification_requests/${m_id}/solicit", payload: {}, as: AgentBank }
            - { call: "POST /api/modification_requests/${m_id}/votes", payload: { vote: "APPROVE" }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/modification_requests/${m_id}/votes", payload: { vote: "APPROVE" }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: AgentBank }
            - { call: "POST /api/modification_requests/${m_id}/tally_close", payload: {}, as: AgentBank }
            - { call: "POST /api/modification_requests/${m_id}/implement", payload: {}, as: AgentBank }
          assert:
            - "ConsentVote.${v1}.recast_count == 2 after two recasts (self-loop cycle)"
            - "first tally: ModificationRequest.${m_id}.status == FAILED (approving 6000 < 6667, cast 7000 >= quorum 5000)"
            - "after re-solicit: ConsentVote.${v1}.status == VOIDED (prior round wiped)"
            - "second tally: status == PASSED (approving 9000 >= 6667)"
            - "after implement: Facility.${f_id}.interest_rate_bps == 1100 and request status IMPLEMENTED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 4, 3, 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: remit_cascade_closes_facility
        grounds:
          - state_machines.DistributionRun.COMPUTED_to_REMITTED
          - state_machines.DistributionLine.PENDING_to_REMITTED
          - state_machines.Facility.ACTIVE_to_CLOSED
          - calculations.principal_reduction_allocation
        distinguishing_aspect: |
          Depth-4 chain triggered by run remit: DistributionRun -> DistributionLine REMITTED
          -> Participant cumulative ledgers credited -> Facility outstanding/accrued reduced
          -> Facility status bubble ACTIVE -> CLOSED when both reach zero on a full payoff.
        test_recipe:
          setup:
            - "Facility 2,000,000 with P1/P2 1,000,000 each (5000/5000 bps), draw 2,000,000 SETTLED 2026-08-01"
            - "Payment 2,020,416 REGULAR value 2026-08-31 covers fee 416 + interest 20,000 + principal 2,000,000 exactly"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Payoff Borrower", sector: "ENERGY", risk_rating: "INVESTMENT_GRADE" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Payoff", total_commitment_cents: 2000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 1000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 1000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 2000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { s2: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 1000000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s2}/report_wire", payload: { amount_cents: 1000000 }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/funding_settlements/${s2}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/payments", payload: { facility_id: "${f_id}", payment_type: "REGULAR", amount_cents: 2020416, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay_id: $.data.id, pay_v: $.data.version } }
            - { call: "POST /api/payments/${pay_id}/distribution_runs", payload: { expected_payment_version: "${pay_v}" }, as: AgentBank, captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /api/distribution_runs/${run_id}/remit", payload: {}, as: AgentBank }
          assert:
            - "DistributionRun.${run_id}.status == REMITTED and both DistributionLines REMITTED"
            - "Participant.${p1_id}.cumulative_interest_cents == 10000 and cumulative_principal_cents == 1000000"
            - "Participant.${p2_id}.cumulative_interest_cents == 10000 and cumulative_principal_cents == 1000000"
            - "Facility.${f_id}.outstanding_principal_cents == 0 and accrued_interest_cents == 0"
            - "Facility.${f_id}.status == CLOSED (hop-4 bubble) and BorrowerPayment.${pay_id}.status == REMITTED"

      - name: default_declaration_cascade_reprices_accrual
        grounds:
          - state_machines.Facility.ACTIVE_to_IN_DEFAULT
          - calculations.default_interest_re_rate
          - state_machines.ModificationRequest.SOLICITING_to_WITHDRAWN
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (default declare): DefaultCase DECLARED ->
          Facility IN_DEFAULT -> each Draw accrual re-rated with the default addon ->
          Facility.accrued_interest_cents reconciled to 57,777; side branch voids the open
          solicitation and its cast vote.
        test_recipe:
          setup:
            - "Facility 10,000,000 (P1 6,000,000 / P2 3,000,000 / P3 1,000,000 funded), draw 4,000,000 SETTLED 2026-08-01"
            - "COVENANT_WAIVER solicitation open since 2026-08-01 with one CAST vote from P1"
            - "Default declared 2026-08-11; payment 100,000 value 2026-08-31 distributed while IN_DEFAULT"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Default Borrower", sector: "INDUSTRIAL", risk_rating: "DISTRESSED" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Def", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 3000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P3", commitment_cents: 1000000 }, as: AgentBank, captures: { p3_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p3_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 4000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { s2: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p3_id}", as: AgentBank, captures: { s3: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 2400000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s2}/report_wire", payload: { amount_cents: 1200000 }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/funding_settlements/${s2}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s3}/report_wire", payload: { amount_cents: 400000 }, as: ParticipantLender, as_user_id: "${p3_id}" }
            - { call: "POST /api/funding_settlements/${s3}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/modification_requests", payload: { facility_id: "${f_id}", modification_type: "COVENANT_WAIVER", terms: { waiver_text: "Waive leverage covenant Q3" } }, as: Borrower, as_user_id: "${b_id}", captures: { m_id: $.data.id } }
            - { call: "POST /api/modification_requests/${m_id}/solicit", payload: {}, as: AgentBank }
            - { call: "POST /api/modification_requests/${m_id}/votes", payload: { vote: "APPROVE" }, as: ParticipantLender, as_user_id: "${p1_id}", captures: { v1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: AgentBank }
          trigger:
            - { call: "POST /api/default_cases", payload: { facility_id: "${f_id}", default_type: "PAYMENT_DEFAULT" }, as: AgentBank, captures: { dc: $.data.id } }
            - { call: "POST /api/payments", payload: { facility_id: "${f_id}", payment_type: "REGULAR", amount_cents: 100000, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay_id: $.data.id, pay_v: $.data.version } }
            - { call: "POST /api/payments/${pay_id}/distribution_runs", payload: { expected_payment_version: "${pay_v}" }, as: AgentBank, captures: { run_id: $.data.id } }
          assert:
