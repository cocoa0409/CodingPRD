# =============================================================================
# SCAFFOLD_CORNER_DESIGN — task_0491_regulated_sportsbook (§1.9)
# Breadth probe over the claim-extraction-guide taxonomy against §1.1–§1.7.
# Every active instance's setup_api_calls/trigger resolves to §1.5; every ${var}
# is captured earlier; OCC fields use ${var}. excluded_because stubs cite a §1.8
# instance by name and carry no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_pending_active_zero_balances
        claim_type: Creation
        grounds:
          - entities.Account
          - endpoints
        distinguishing_aspect: "POST /accounts with all required fields → 201; kyc_status==PENDING, rg_status==ACTIVE, cash_balance_cents==0, bonus_balance_cents==0, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "e1@x.com", full_name: "New Acct", date_of_birth: "1990-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, kyc: $.data.kyc_status, rg: $.data.rg_status, bal: $.data.cash_balance_cents, ver: $.data.version }
          assert:
            - "Account.${acct}.kyc_status == PENDING"
            - "Account.${acct}.rg_status == ACTIVE"
            - "Account.${acct}.cash_balance_cents == 0"
            - "Account.${acct}.bonus_balance_cents == 0"
            - "Account.${acct}.version == 1"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Account
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /accounts/{nonexistent-uuid} → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB; use a random UUID that was never created."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: create_account_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.Account.fields.residence_state
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /accounts omitting residence_state → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "missing@x.com", full_name: "No State", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: invalid_residence_state_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Account.fields.residence_state
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "residence_state not in {NJ,NY,PA,CO,AZ,NV} → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "bad@x.com", full_name: "Bad State", date_of_birth: "1990-01-01", residence_state: "ZZ" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: selection_american_odds_below_100_magnitude_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Selection.fields.american_odds
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /markets/{id}/selections with american_odds=50 (|odds|<100) → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Event SCHEDULED, one MONEYLINE market OPEN."]
          setup_api_calls:
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 9000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
          trigger:
            - call: "POST /markets/${mkt}/selections"
              payload: { name: "HOME", american_odds: 50 }
              as: TradingOps
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: geocheck_computed_eligible_and_immutable_id_only
        claim_type: Computed Fields
        grounds:
          - entities.GeoCheck.fields.eligible
          - entities.GeoCheck.fields.expires_at
        distinguishing_aspect: "POST geo-check with detected_state=NJ, accuracy 20, vpn false → eligible==true; an ineligible state (INTL) → eligible==false. GeoCheck has no version field (common_fields:false)."
        test_recipe:
          setup: ["Account registered."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "geo@x.com", full_name: "Geo", date_of_birth: "1990-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "NJ", accuracy_meters: 20 }
              as: Bettor
              as_user_id: "${acct}"
              captures: { elig: $.data.eligible, exp: $.data.expires_at }
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "INTL", accuracy_meters: 20 }
              as: Bettor
              as_user_id: "${acct}"
              captures: { elig2: $.data.eligible }
          assert:
            - "first GeoCheck.eligible == true"
            - "second GeoCheck.eligible == false (INTL is not a permitted state)"

      - name: geocheck_vpn_suspected_marks_ineligible
        claim_type: Computed Fields
        grounds:
          - entities.GeoCheck.fields.eligible
          - entities.GeoCheck.fields.is_vpn_suspected
        distinguishing_aspect: "Permitted state NJ but is_vpn_suspected=true → eligible==false."
        test_recipe:
          setup: ["Account registered."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "vpn@x.com", full_name: "Vpn", date_of_birth: "1990-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "NJ", accuracy_meters: 20, is_vpn_suspected: true }
              as: Bettor
              as_user_id: "${acct}"
              captures: { elig: $.data.eligible }
          assert:
            - "GeoCheck.eligible == false"

      - name: list_accounts_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Account
          - endpoints
        distinguishing_aspect: "GET /accounts returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two accounts registered."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "l1@x.com", full_name: "L1", date_of_birth: "1990-01-01", residence_state: "NJ" }
              as: Anonymous
            - call: "POST /accounts"
              payload: { email: "l2@x.com", full_name: "L2", date_of_birth: "1990-01-01", residence_state: "NY" }
              as: Anonymous
          trigger:
            - call: "GET /accounts"
              payload: { limit: 1, offset: 0 }
              as: ComplianceOfficer
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true with limit 1"

      - name: deposit_returns_ledgerentry_with_signed_amount
        claim_type: Computed Fields
        grounds:
          - entities.LedgerEntry.fields.amount_cents
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: "Deposit 30000 → LedgerEntry entry_type==DEPOSIT, bucket==CASH, amount_cents==30000 (positive)."
        test_recipe:
          setup: ["Verified Bettor."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "dep@x.com", full_name: "Dep", date_of_birth: "1990-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v0}" }
              as: ComplianceOfficer
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /accounts/${acct}/deposits"
              payload: { amount_cents: 30000, expected_account_version: "${v1}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { etype: $.data.entry_type, bucket: $.data.bucket, amt: $.data.amount_cents }
          assert:
            - "LedgerEntry.entry_type == DEPOSIT"
            - "LedgerEntry.bucket == CASH"
            - "LedgerEntry.amount_cents == 30000"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: kyc_decision_on_already_verified_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Account.PENDING_to_VERIFIED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Second VERIFY on an already-VERIFIED account → ERR_INVALID_STATE (PENDING is the only valid from-state)."
        test_recipe:
          setup: ["Account VERIFIED once."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "kyc2@x.com", full_name: "Kyc2", date_of_birth: "1990-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v0}" }
              as: ComplianceOfficer
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v1}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: self_excluded_is_terminal_no_rg_control_advances
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Account.ACTIVE_to_SELF_EXCLUDED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "After SELF_EXCLUDED, a COOLING_OFF rg-control attempt → ERR_INVALID_STATE (SELF_EXCLUDED is terminal/irreversible)."
        test_recipe:
          setup: ["Account SELF_EXCLUDED."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "term@x.com", full_name: "Term", date_of_birth: "1990-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/rg-controls"
              payload: { control_type: "SELF_EXCLUSION", expected_account_version: "${v0}" }
              as: ComplianceOfficer
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /accounts/${acct}/rg-controls"
              payload: { control_type: "COOLING_OFF", duration_days: 7, expected_account_version: "${v1}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: cooling_off_auto_clears_when_clock_passes_until
        claim_type: Valid Transition
        grounds:
          - state_machines.Account.COOLING_OFF_to_ACTIVE
          - entities.Account.fields.cooling_off_until
        distinguishing_aspect: "Account set COOLING_OFF for 7 days; advancing the clock past cooling_off_until and reading the account re-evaluates rg_status to ACTIVE and clears cooling_off_until."
        test_recipe:
          setup: ["Clock 2026-01-01. Account ACTIVE → COOLING_OFF for 7 days (until 2026-01-08)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "cool@x.com", full_name: "Cool", date_of_birth: "1990-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/rg-controls"
              payload: { control_type: "COOLING_OFF", duration_days: 7, expected_account_version: "${v0}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { rgs: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: TradingOps
          trigger:
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { rg: $.data.rg_status, cu: $.data.cooling_off_until }
          assert:
            - "Account.${acct}.rg_status == ACTIVE"
            - "Account.${acct}.cooling_off_until == null"

      - name: event_void_cascades_markets_and_selections_void
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Event.SCHEDULED_to_VOIDED
          - state_machines.Market.OPEN_to_VOIDED
          - entities.Selection.fields.result
        distinguishing_aspect: "Voiding a SCHEDULED event cascades its market to VOIDED and its selection.result to VOID."
        test_recipe:
          setup: ["Event SCHEDULED with one market+selection."]
          setup_api_calls:
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 9000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
            - call: "POST /markets/${mkt}/selections"
              payload: { name: "AWAY", american_odds: 200 }
              as: TradingOps
              captures: { sel: $.data.id }
          trigger:
            - call: "POST /events/${ev}/status"
              payload: { to: "VOIDED" }
              as: TradingOps
            - call: "GET /markets/${mkt}"
              payload: {}
              as: TradingOps
              captures: { mst: $.data.status }
            - call: "GET /selections/${sel}"
              payload: {}
              as: TradingOps
              captures: { sres: $.data.result }
          assert:
            - "Market.${mkt}.status == VOIDED"
            - "Selection.${sel}.result == VOID"

      - name: market_reopen_blocked_when_event_live
        claim_type: guarded transitions
        grounds:
          - state_machines.Market.SUSPENDED_to_OPEN
          - "errors[ERR_EVENT_LOCKED]"
        distinguishing_aspect: "Reopening a SUSPENDED market while its Event is LIVE → ERR_EVENT_LOCKED (precondition Event.status==SCHEDULED)."
        test_recipe:
          setup: ["Event taken LIVE (which suspended the market)."]
          setup_api_calls:
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 9000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
            - call: "POST /events/${ev}/status"
              payload: { to: "LIVE" }
              as: TradingOps
          trigger:
            - call: "POST /markets/${mkt}/status"
              payload: { to: "OPEN" }
              as: TradingOps
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EVENT_LOCKED"

      - name: settlement_won_payout_credited_to_cash
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Bet.PLACED_to_WON
          - calculations.bet_settlement_payout
          - entities.Bet.fields.actual_payout_cents
        distinguishing_aspect: "SINGLE stake 5000 @+200 settled WON → status WON, actual_payout_cents==15000, a PAYOUT LedgerEntry credited to CASH."
        test_recipe:
          setup: ["Verified/active Bettor, cash 100000, eligible geo. SINGLE stake 5000 @+200 placed; event settled HOME loses → AWAY WON."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "won@x.com", full_name: "Won", date_of_birth: "1980-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v0}" }
              as: ComplianceOfficer
              captures: { v1: $.data.version }
            - call: "POST /accounts/${acct}/deposits"
              payload: { amount_cents: 100000, expected_account_version: "${v1}" }
              as: Bettor
              as_user_id: "${acct}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { v2: $.data.version }
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "NJ", accuracy_meters: 20 }
              as: Bettor
              as_user_id: "${acct}"
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 90000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
            - call: "POST /markets/${mkt}/selections"
              payload: { name: "AWAY", american_odds: 200 }
              as: TradingOps
              captures: { sel: $.data.id }
            - call: "POST /bets"
              payload: { account_id: "${acct}", bet_type: "SINGLE", stake_cents: 5000, legs: [{ selection_id: "${sel}" }], expected_account_version: "${v2}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { bet: $.data.id }
            - call: "POST /events/${ev}/status"
              payload: { to: "LIVE" }
              as: TradingOps
          trigger:
            - call: "POST /events/${ev}/result"
              payload: { home_score: 90, away_score: 110 }
              as: SettlementAgent
            - call: "GET /bets/${bet}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { st: $.data.status, payout: $.data.actual_payout_cents }
            - call: "GET /ledger-entries"
              payload: { ref_id: "${bet}" }
              as: ComplianceOfficer
          assert:
            - "Bet.${bet}.status == WON"
            - "Bet.${bet}.actual_payout_cents == 15000"
            - "GET /ledger-entries?ref_id=${bet} includes a PAYOUT entry of amount_cents 15000 in CASH bucket"

      - name: error_self_exclusion_cascade_already_in_difficulty
        claim_type: Compensation
        grounds:
          - state_machines.Account.ACTIVE_to_SELF_EXCLUDED
        excluded_because:
          difficulty_instance: transitive_cascade / self_exclusion_voids_bet_refunds_and_forfeits_bonus
          rationale: "SELF_EXCLUSION void/refund/forfeit cascade is fully asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: american_to_decimal_negative_odds_correct
        claim_type: Correct Result
        grounds:
          - calculations.american_to_decimal_odds
          - entities.Selection.fields.american_odds
        distinguishing_aspect: "Selection created at american_odds -150 → decimal 1.6667 (1 + 100/150, round_half_up 4dp); +200 → 3.0."
        test_recipe:
          setup: ["Event SCHEDULED, one MONEYLINE market OPEN."]
          setup_api_calls:
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 9000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
          trigger:
            - call: "POST /markets/${mkt}/selections"
              payload: { name: "HOME", american_odds: -150 }
              as: TradingOps
              captures: { sel: $.data.id }
            - call: "GET /selections/${sel}"
              payload: {}
              as: Bettor
              as_user_id: "any"
          assert:
            - "Selection -150 maps to decimal 1.6667 in the SINGLE potential_payout path (floor(5000*1.6667)=8333 for a 5000 stake)"

      - name: potential_payout_floor_not_round_up
        claim_type: Precision
        grounds:
          - calculations.potential_payout
          - entities.Bet.fields.potential_payout_cents
        distinguishing_aspect: "SINGLE stake 5000 @-150 (decimal 1.6667) → potential_payout floor(5000*1.6667)=8333, never 8334 (floor, not round-half-up)."
        test_recipe:
          setup: ["Verified/active Bettor, cash 100000, eligible geo; market with -150 selection."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "floor@x.com", full_name: "Floor", date_of_birth: "1980-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v0}" }
              as: ComplianceOfficer
              captures: { v1: $.data.version }
            - call: "POST /accounts/${acct}/deposits"
              payload: { amount_cents: 100000, expected_account_version: "${v1}" }
              as: Bettor
              as_user_id: "${acct}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { v2: $.data.version }
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "NJ", accuracy_meters: 20 }
              as: Bettor
              as_user_id: "${acct}"
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 90000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
            - call: "POST /markets/${mkt}/selections"
              payload: { name: "HOME", american_odds: -150 }
              as: TradingOps
              captures: { sel: $.data.id }
          trigger:
            - call: "POST /bets"
              payload: { account_id: "${acct}", bet_type: "SINGLE", stake_cents: 5000, legs: [{ selection_id: "${sel}" }], expected_account_version: "${v2}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { pot: $.data.potential_payout_cents, comb: $.data.combined_decimal_odds }
          assert:
            - "Bet.combined_decimal_odds == 1.6667"
            - "Bet.potential_payout_cents == 8333"

      - name: wager_limit_gross_excess_rejected
        claim_type: Constants Applied
        grounds:
          - calculations.net_loss_limit_check
          - "validations[priority=13]"
          - "errors[ERR_WAGER_LIMIT_EXCEEDED]"
        distinguishing_aspect: "ACTIVE WAGER_LIMIT DAILY 10000; a prior PLACED bet stake 6000 plus a new stake 5000 = 11000 gross > 10000 → ERR_WAGER_LIMIT_EXCEEDED."
        test_recipe:
          setup: ["Verified/active Bettor, cash 100000, eligible geo, ACTIVE WAGER_LIMIT DAILY 10000; one PLACED bet stake 6000."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "wl@x.com", full_name: "Wager", date_of_birth: "1980-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
