          - "validations[priority 72]"
        distinguishing_aspect: "Advancing the logical clock to 2026-08-14T12:00:00Z makes a published_at of 2026-08-14T00:00:00Z legal (it was in the future before the advance) and stamps the new row's created_at with the advanced instant."
        test_recipe:
          setup: ["One creator; the logical clock at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
