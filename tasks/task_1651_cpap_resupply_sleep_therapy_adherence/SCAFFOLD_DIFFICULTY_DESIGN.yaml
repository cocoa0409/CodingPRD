# =============================================================================
# Task 1651 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine Difficulty Rules × ≥ 2 instances each = ≥ 18 instances total
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: ≥2 instances on DIFFERENT entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: adherence_provisional_vs_final_missing_nights
        grounds:
          - calculations.adherence_percentage_dual_variant
          - entities.AdherenceReport.fields.adherence_pct_provisional
          - entities.AdherenceReport.fields.adherence_pct_final
        distinguishing_aspect: |
          Entity domain = AdherenceReport. For identical inputs
          (compliant_nights=18, nights_reported=25, compliance_window_days=30),
          the PROVISIONAL variant divides by nights_reported (18/25=72.0) while
          the FINAL variant divides by the full payer window (18/30=60.0) —
          same data, two valid algorithms, different results on the same entity.
        test_recipe:
          setup:
            - "PayerPolicy p1: compliance_threshold_pct=70, compliance_min_hours_per_night=4.0, compliance_window_days=30, compliance_min_nights=21, rental_months_to_own=3, mask_cadence_days=90, cushion_cadence_days=30, filter_cadence_days=14, tubing_cadence_days=90, mask_exchange_window_days=30, max_exchanges_per_window=1, requires_prior_auth=false"
            - "Patient pat1 registered under p1, in INTAKE"
            - "DeviceEnrollment de1 (RENTAL) created, begin-setup, complete-setup -> Patient ACTIVE_THERAPY"
            - "AdherenceReport ar1 created with window_end_on=2026-08-30, nights_reported=25, compliant_nights=18"
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { pp1: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "Pat One", date_of_birth: "1970-01-15", payer_policy_id: "${pp1}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pat1}", device_serial: "SN-001", device_model: "Airsense-11", acquisition_type: "RENTAL" }
              as: IntakeCoordinator
              captures: { de1: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${de1}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${de1}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports"
              payload: { patient_id: "${pat1}", device_enrollment_id: "${de1}", window_end_on: "2026-08-30", nights_reported: 25, compliant_nights: 18 }
              as: RespiratoryTherapist
              captures: { ar1: $.data.id, ar1_prov: $.data.adherence_pct_provisional }
          trigger:
            - call: "POST /sleep-therapy/adherence-reports/${ar1}/begin-review"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports/${ar1}/finalize"
              payload: {}
              as: RespiratoryTherapist
              captures: { ar1_final: $.data.adherence_pct_final }
          assert:
            - "AdherenceReport.${ar1}.adherence_pct_provisional == 72.0"
            - "AdherenceReport.${ar1}.adherence_pct_final == 60.0"
            - "AdherenceReport.${ar1}.adherence_pct_provisional != AdherenceReport.${ar1}.adherence_pct_final"

      - name: rental_straight_line_vs_actual_usage_conversion
        grounds:
          - calculations.rental_month_accrual_dual_variant
          - entities.RentalContract.fields.conversion_eligible_on
          - entities.RentalContract.fields.rental_months_billed
        distinguishing_aspect: |
          Entity domain = RentalContract. The straight-line projection variant
          (conversion_eligible_on = rental_start_on + 3 months, ignoring pauses)
          diverges from the actual-usage variant (which counts only BILLING
          months) when the contract spends one month in PAUSED_NON_COMPLIANCE —
          same start date, two valid readings, different conversion dates.
        test_recipe:
          setup:
            - "PayerPolicy p1 with rental_months_to_own=3, compliance_threshold_pct=70, window=30"
            - "Patient pat2 with RENTAL device; setup completes 2026-08-01; RentalContract rc1 created with rental_start_on=2026-08-01, monthly_rental_cents=15000"
            - "conversion_eligible_on projected as 2026-11-01 (straight-line)"
            - "Bill month 1 on 2026-09-01 (rc1.rental_months_billed=1)"
            - "Finalize a non-compliant AdherenceReport on 2026-09-15 -> billing pauses"
            - "Advance clock to 2026-10-01; bill-rental-month rejected because PAUSED"
            - "Finalize a compliant report on 2026-10-05 -> billing resumes"
            - "Advance clock to 2026-11-01; bill month 2 (rental_months_billed=2)"
            - "Advance clock to 2026-12-01; bill month 3 -> converts"
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { pp2: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "Pat Two", date_of_birth: "1975-05-20", payer_policy_id: "${pp2}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pat2: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pat2}", device_serial: "SN-002", device_model: "Airsense-11", acquisition_type: "RENTAL" }
              as: IntakeCoordinator
              captures: { de2: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${de2}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${de2}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/rental-contracts"
              payload: { patient_id: "${pat2}" }
              as: OpsAdmin
              captures: { rc2: "$.data[0].id", rc2_conv_eligible: "$.data[0].conversion_eligible_on" }
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/_ops/run-daily-sweep"
              payload: {}
              as: OpsAdmin
            - call: "POST /sleep-therapy/rental-contracts/${rc2}/bill-rental-month"
              payload: {}
              as: BillingSpecialist
            # pause via non-compliant adherence
            - call: "POST /sleep-therapy/adherence-reports"
              payload: { patient_id: "${pat2}", device_enrollment_id: "${de2}", window_end_on: "2026-09-10", nights_reported: 30, compliant_nights: 5 }
              as: RespiratoryTherapist
              captures: { ar2a: $.data.id }
            - call: "POST /sleep-therapy/adherence-reports/${ar2a}/begin-review"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports/${ar2a}/finalize"
              payload: {}
              as: RespiratoryTherapist
            # 2026-10-01 attempt to bill while paused -> rejected (validates pause semantics)
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/rental-contracts/${rc2}/bill-rental-month"
              payload: {}
              as: BillingSpecialist
              captures: { paused_err: $.data.error_id }
            # resume compliance
            - call: "POST /sleep-therapy/adherence-reports"
              payload: { patient_id: "${pat2}", device_enrollment_id: "${de2}", window_end_on: "2026-10-05", nights_reported: 30, compliant_nights: 25 }
              as: RespiratoryTherapist
              captures: { ar2b: $.data.id }
            - call: "POST /sleep-therapy/adherence-reports/${ar2b}/begin-review"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports/${ar2b}/finalize"
              payload: {}
              as: RespiratoryTherapist
          trigger:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/rental-contracts/${rc2}/bill-rental-month"
              payload: {}
              as: BillingSpecialist
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/rental-contracts/${rc2}/bill-rental-month"
              payload: {}
              as: BillingSpecialist
              captures: { rc2_final_status: $.data.billing_status, rc2_months: $.data.rental_months_billed }
          assert:
            - "RentalContract.${rc2}.conversion_eligible_on == '2026-11-01'   # straight-line projection"
            - "billing during PAUSED_NON_COMPLIANCE rejected: ${paused_err} == 'ERR_RENTAL_NOT_BILLING'"
            - "RentalContract.${rc2}.rental_months_billed == 3"
            - "RentalContract.${rc2}.billing_status == 'CONVERTED_TO_OWNERSHIP'"
            - "actual conversion date 2026-12-01 is 1 month after straight-line projection 2026-11-01"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: ≥2 instances in DIFFERENT modes (a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: mask_exchange_window_and_count_intersection
        grounds:
          - calculations.mask_exchange_window_check
          - validations[priority=18]
          - validations[priority=19]
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction: window
          date arithmetic (current_date <= anchor + mask_exchange_window_days)
          AND count check (completed_same_window < max_exchanges_per_window)
          AND anchor selection (setup_completed_on for first exchange else
          prior completed_on) all gate the same approve; failure of any one
          branch produces a different error.
        test_recipe:
          setup:
            - "PayerPolicy p1 with mask_exchange_window_days=30, max_exchanges_per_window=1"
            - "Patient pat3 with RENTAL device, setup completed 2026-08-01 -> first exchange window anchored at 2026-08-01"
            - "First MaskExchange me1 created, approved 2026-08-10, shipped, completed 2026-08-12 (window anchor stays 2026-08-01)"
            - "Second MaskExchange me2 created 2026-08-20 (same window_anchor_on=2026-08-01)"
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { pp3: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "Pat Three", date_of_birth: "1980-03-10", payer_policy_id: "${pp3}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pat3: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pat3}", device_serial: "SN-003", device_model: "Airsense-11", acquisition_type: "RENTAL" }
              as: IntakeCoordinator
              captures: { de3: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${de3}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${de3}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${pat3}", component_type: "MASK" }
              as: OpsAdmin
              captures: { mask_plan3: "$.data[0].id" }
            # first exchange: full cycle to COMPLETED
            - call: "POST /sleep-therapy/mask-exchanges"
              payload: { patient_id: "${pat3}", device_enrollment_id: "${de3}", original_mask_plan_id: "${mask_plan3}", reason_code: "FIT_LEAK" }
              as: IntakeCoordinator
              captures: { me1: $.data.id, me1_anchor: $.data.window_anchor_on }
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/mask-exchanges/${me1}/approve"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/mask-exchanges/${me1}/ship"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/mask-exchanges/${me1}/complete"
              payload: {}
              as: IntakeCoordinator
            # second exchange in same window
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/mask-exchanges"
              payload: { patient_id: "${pat3}", device_enrollment_id: "${de3}", original_mask_plan_id: "${mask_plan3}", reason_code: "WRONG_SIZE" }
              as: IntakeCoordinator
              captures: { me2: $.data.id, me2_anchor: $.data.window_anchor_on }
          trigger:
            - call: "POST /sleep-therapy/mask-exchanges/${me2}/approve"
              payload: {}
              as: RespiratoryTherapist
              captures: { me2_err: $.data.error_id }
          assert:
            - "MaskExchange.${me1}.window_anchor_on == '2026-08-01'"
            - "MaskExchange.${me2}.window_anchor_on == '2026-08-01'   # same window"
            - "approve of me2 rejected with ${me2_err} == 'ERR_EXCHANGE_LIMIT_REACHED'   # max_exchanges_per_window=1 already consumed"

      - name: coinsurance_line_total_rounding_order
        grounds:
          - calculations.patient_coinsurance_share
          - entities.ResupplyOrder.fields.patient_responsibility_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: scaffold pins
          'round line total after multiplication, NOT per-unit'. With
          unit_allowable_cents=33333 and requested_quantity=3 at 20%:
          per-line = round_half_up(33333*3*0.20)=round_half_up(19999.8)=20000;
          per-unit-then-sum would be 3*round_half_up(33333*0.20)=3*6667=20001.
          The two orderings differ by 1 cent; the scaffold picks per-line.
        test_recipe:
          setup:
            - "PayerPolicy p1 standard"
            - "Patient pat4 with PURCHASE device (no rental), setup complete -> ACTIVE_THERAPY"
            - "Manually set unit_allowable via authorize snapshot — we drive unit_allowable_cents by payer's fee schedule; for this test we rely on the implementation's snapshot at authorize. To pin the arithmetic, we select a cushion plan and authorize, capturing unit_allowable_cents from the response."
            - "Create ResupplyOrder for CUSHION, clinical-clear, authorize (captures unit_allowable_cents)"
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { pp4: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "Pat Four", date_of_birth: "1982-07-04", payer_policy_id: "${pp4}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pat4: $.data.id, pat4_v: $.data.version }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pat4}", device_serial: "SN-004", device_model: "Airsense-11", acquisition_type: "PURCHASE" }
              as: IntakeCoordinator
              captures: { de4: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${de4}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${de4}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${pat4}", component_type: "CUSHION" }
              as: OpsAdmin
              captures: { cush_plan4: "$.data[0].id" }
            - call: "GET /sleep-therapy/patients/${pat4}"
              payload: {}
              as: OpsAdmin
              captures: { pat4_v_pre_order: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${pat4}", component_supply_plan_id: "${cush_plan4}", requested_quantity: 1, expected_patient_version: "${pat4_v_pre_order}" }
              as: IntakeCoordinator
              captures: { ro4: $.data.id }
            - call: "POST /sleep-therapy/resupply-orders/${ro4}/clinical-clear"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/resupply-orders/${ro4}/authorize"
              payload: { expected_patient_version: "${pat4_v_pre_order}" }
              as: BillingSpecialist
              captures: { ro4_unit: $.data.unit_allowable_cents }
            - call: "GET /sleep-therapy/patients/${pat4}"
              payload: {}
              as: OpsAdmin
              captures: { pat4_v_pre_ship: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders/${ro4}/ship"
              payload: { expected_patient_version: "${pat4_v_pre_ship}" }
              as: IntakeCoordinator
            - call: "POST /sleep-therapy/resupply-orders/${ro4}/mark-delivered"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /sleep-therapy/resupply-orders/${ro4}/invoice"
              payload: {}
              as: BillingSpecialist
              captures: { ro4_share: $.data.patient_responsibility_cents }
          assert:
            - "ResupplyOrder.${ro4}.patient_responsibility_cents == round_half_up(${ro4_unit} * 1 * 0.20)   # per-line, not per-unit-then-sum"
            - "Patient.${pat4}.outstanding_balance_cents == ResupplyOrder.${ro4}.patient_responsibility_cents"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: ≥2 instances on DIFFERENT entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: resupply_order_parallel_auth_and_fulfillment_dimensions
        grounds:
          - state_machines.ResupplyOrder
          - entities.ResupplyOrder.fields.auth_status
          - entities.ResupplyOrder.fields.fulfillment_status
        distinguishing_aspect: |
          Entity = ResupplyOrder. auth_status and fulfillment_status evolve as
          parallel dimensions on one row: authorize flips auth PENDING_PAYER_AUTH
          -> AUTHORIZED and atomically flips fulfillment NOT_READY ->
          READY_TO_SHIP; ship then advances only the fulfillment dimension
          (READY_TO_SHIP -> SHIPPED) while auth stays AUTHORIZED. A cancel from
          PENDING_CLINICAL_CLEARANCE terminates auth without ever touching
          fulfillment — branching shape, not a linear pipeline.
        test_recipe:
          setup:
            - "PayerPolicy p1 standard; Patient pat5 PURCHASE device, setup complete"
            - "ResupplyOrder ro5 created (auth=PENDING_CLINICAL_CLEARANCE, fulfillment=NOT_READY)"
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { pp5: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "Pat Five", date_of_birth: "1978-11-11", payer_policy_id: "${pp5}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pat5: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pat5}", device_serial: "SN-005", device_model: "Airsense-11", acquisition_type: "PURCHASE" }
              as: IntakeCoordinator
              captures: { de5: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${de5}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${de5}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${pat5}", component_type: "FILTER" }
              as: OpsAdmin
              captures: { filt_plan5: "$.data[0].id" }
            - call: "GET /sleep-therapy/patients/${pat5}"
              payload: {}
              as: OpsAdmin
              captures: { pat5_v: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${pat5}", component_supply_plan_id: "${filt_plan5}", requested_quantity: 1, expected_patient_version: "${pat5_v}" }
              as: IntakeCoordinator
              captures: { ro5: $.data.id, ro5_auth0: $.data.auth_status, ro5_fulf0: $.data.fulfillment_status }
          trigger:
            - call: "POST /sleep-therapy/resupply-orders/${ro5}/clinical-clear"
              payload: {}
              as: RespiratoryTherapist
              captures: { ro5_auth1: $.data.auth_status, ro5_fulf1: $.data.fulfillment_status }
            - call: "POST /sleep-therapy/resupply-orders/${ro5}/authorize"
              payload: { expected_patient_version: "${pat5_v}" }
              as: BillingSpecialist
              captures: { ro5_auth2: $.data.auth_status, ro5_fulf2: $.data.fulfillment_status }
            - call: "GET /sleep-therapy/patients/${pat5}"
              payload: {}
              as: OpsAdmin
              captures: { pat5_v2: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders/${ro5}/ship"
