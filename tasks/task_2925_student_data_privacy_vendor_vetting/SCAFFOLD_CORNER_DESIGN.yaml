          rationale: "That §1.8 dual_variant_calc instance already drives the same stored rows through both variants and pins the divergence (provisional 60.67 vs final 64.00), which is exactly this row's claim."

      - name: vendor_risk_variant_selection
        claim_type: Variant Selection
        grounds:
          - calculations.vendor_risk_score.variants
        excluded_because:
          difficulty_instance: vendor_risk_live_vs_reauthorization_diverge
          rationale: "That §1.8 dual_variant_calc instance already proves the context selection: the live variant is written to risk_score on every trigger (50.50) while the reauthorization variant is written to reauthorization_risk_score only during reauthorize (20.50), forgiving REMEDIATED incidents."

      - name: exposed_points_rounding_order_precision
        claim_type: Precision
        grounds:
          - calculations.exposed_sensitivity_points.precision
        excluded_because:
          difficulty_instance: exposed_points_round_each_element_then_sum
          rationale: "That §1.8 combinatorial_formula instance already pins the round-each-then-sum order against the sum-then-round order (4.32 rather than 4.31), which is the whole content of this precision row."

      - name: exposed_points_reconciliation_after_reversal
        claim_type: Reconciliation
        grounds:
          - calculations.exposed_sensitivity_points
          - state_machines.DataElementCommitment.ACCEPTED_to_REJECTED
        excluded_because:
          difficulty_instance: reject_accepted_commitment_restores_exposed_points_exactly
          rationale: "That §1.8 compensating_invariant instance already reconciles the derived totals across a reversal (2.88 -> 1.44 and vendor risk 1.44 -> 0.72) with no residual drift."

