            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - *cd2_whv1
            - *cd2_store1
            - *cd2_whv2
            - *cd2_store2
          trigger:
            - call: "GET /warehouses/${wh}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /finished-units/${fu1}/release-storage"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /finished-units/${fu2}"
              payload: {}
