            - call: "POST /screenings/${s_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
            - call: "POST /centers/${c_id}/shifts"
              payload: { start_at: "2026-09-03T08:00:00Z", end_at: "2026-09-03T12:00:00Z", role_required: "DESK", capacity: 2 }
              as: CenterManager
