  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: agreement_closed_interval_touching_endpoints_collide
        grounds:
          - validations.priority_7_business_referential
          - state_machines.MarketPartnerAgreement.DRAFT_to_ACTIVE
          - errors.ERR_OVERRIDE_COVERAGE_OVERLAP
        distinguishing_aspect: |
          CLOSED-interval semantics on MarketPartnerAgreement: agreement B
          [2027-07-01, 2027-12-31] collides with active agreement A
          [2027-01-01, 2027-07-01] because they share the single date
          2027-07-01 — touching endpoints overlap under inclusive-both-ends.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Market group G ACTIVE with one ACTIVE restaurant. Market partners P2 and P3. Agreement A ACTIVE on G with coverage [2027-01-01, 2027-07-01]."
