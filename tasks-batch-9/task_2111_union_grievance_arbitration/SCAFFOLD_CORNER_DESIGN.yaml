- section: endpoints
  instances:
  - name: arbitration_sub_resource_reads_expose_cascade_created_rows
    claim_type: computed_read
    grounds:
    - endpoints[GET /labor-relations/arbitration-demands/{id}/panel-strikes]
    - endpoints[GET /labor-relations/arbitrators/{id}/strike-history]
    - endpoints[GET /labor-relations/arbitration-demands/{id}/awards]
    - endpoints[GET /labor-relations/awards/{id}]
    distinguishing_aspect: 'PanelStrike and Award rows are created by cascades and never appear in a creation response, so the three sub-resource reads are their only discovery channel: panel-strikes returns both strikes in strike_order ASC, strike-history returns the single strike against Alvarez, and the awards sub-resource returns an array of exactly one row.'
