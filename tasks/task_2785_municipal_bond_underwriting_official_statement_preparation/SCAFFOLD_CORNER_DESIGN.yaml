      - name: pricing_is_exclusive_to_the_underwriter_before_any_state_check
        claim_type: exclusive_operations
        grounds:
          - roles[Underwriter].exclusive_operations "POST /bond-offerings/deals/{id}/price"
          - validations[auth-role-permits-operation] (priority 2) versus validations[state-transition-legal] (priority 11)
        distinguishing_aspect: |
          The deal used here is still DRAFT, so a price attempt is doubly wrong: wrong role AND
          an illegal transition. The role denial at priority 2 must win, so the MunicipalAdvisor
          gets 403 ERR_UNAUTHORIZED while the Underwriter on the same DRAFT deal gets 409
