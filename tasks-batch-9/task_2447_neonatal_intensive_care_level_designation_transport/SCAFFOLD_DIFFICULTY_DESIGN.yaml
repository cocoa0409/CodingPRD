  - rule_id: priority_pair_validation_conflict
    instances:

      - name: own_state_precedes_stabilization_safety_gate
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_STABILIZATION_INCOMPLETE]
          - calculations.stabilization_score
        distinguishing_aspect: |
          Pair (state, business_safety): one call violates priority 8 (depart is
          not legal from ON_SCENE) and priority 11 (no bundle recorded at all) at
          the same time and must answer ERR_INVALID_STATE. The control call then
          satisfies priority 8 only, and the same endpoint answers
          ERR_STABILIZATION_INCOMPLETE — proving the ordering rather than a fixed
          preference for one code.
        test_recipe:
          setup:
            - "Prelude as above, plus the TRANSPORT_ISOLETTE asset."
            - "A referral requiring LEVEL_III (30.0 weeks, 1250 g, HFOV) is accepted at Regional NICU A and a GROUND run has been dispatched and is ON_SCENE, with no stabilization values recorded."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - *k_isolette
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-V1", gestational_age_weeks: 30.0, birth_weight_grams: 1250, support_modality: "HFOV" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_v1: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_v1: $.data.version }
            - call: "POST /referrals/${ref_v1}/accept"
              payload: { expected_unit_version: "${v_v1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { res_v1: $.data.reservation_id }
            - call: "POST /transport-runs"
              payload: { reservation_id: "${res_v1}", isolette_asset_id: "${isolette_a}", mode: "GROUND", crew_composition: ["TRANSPORT_RN", "NNP"], depart_at: "2026-08-02T08:00:00Z", planned_return_at: "2026-08-02T12:00:00Z", weather_minimums_met: false }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { run_v1: $.data.id }
            - call: "POST /transport-runs/${run_v1}/dispatch"
              payload: {}
              as: TransportCoordinator
              as_user_id: "coord-1"
            - call: "POST /transport-runs/${run_v1}/on-scene"
              payload: {}
              as: TransportCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /transport-runs/${run_v1}/depart"
              payload: {}
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { err_state: $.data.error_id }
            - call: "POST /transport-runs/${run_v1}/stabilize"
              payload: { temp_c: 36.4, glucose_mg_dl: 44, mean_bp_mmhg: 26, spo2_pct: 89 }
              as: TransportCoordinator
              as_user_id: "coord-1"
            - call: "POST /transport-runs/${run_v1}/depart"
              payload: {}
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { err_safety: $.data.error_id }
          assert:
            - "${err_state} == ERR_INVALID_STATE with HTTP 409 — priority 8 wins over priority 11"
            - "TransportRun.${run_v1}.status == ON_SCENE (unchanged by the refused call)"
            - "After the stabilize call: stabilization_score == 68 and stabilization_bundle_complete == false and status == STABILIZING"
            - "${err_safety} == ERR_STABILIZATION_INCOMPLETE with HTTP 422 — with priority 8 satisfied, priority 11 surfaces"
            - "TransportRun.${run_v1}.status == STABILIZING (still not EN_ROUTE)"

      - name: milk_expiry_safety_precedes_volume_capacity
        grounds:
          - validations[priority=11]
          - validations[priority=15]
          - errors[ERR_MILK_EXPIRED]
          - errors[ERR_MILK_VOLUME_EXCEEDED]
          - calculations.milk_expiry
        distinguishing_aspect: |
          A different error-category pair (business_safety, business_fiscal) on a
          different endpoint: at 2026-08-02 an over-volume administration answers
          ERR_MILK_VOLUME_EXCEEDED, and once the clock reaches the expiry instant
          the identical over-volume call answers ERR_MILK_EXPIRED instead. The
          fiscal check is not merely later — it is unreachable while the safety
          gate is violated.
        test_recipe:
          setup:
            - "Prelude as above."
            - "One ADMITTED admission at Regional NICU A."
            - "One VERIFIED MOTHERS_OWN batch of 120.0 ml expressed 2026-08-01T00:00:00Z (expires 2026-08-05T00:00:00Z), received by nurse-1 and verified by nurse-2."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-M2", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
