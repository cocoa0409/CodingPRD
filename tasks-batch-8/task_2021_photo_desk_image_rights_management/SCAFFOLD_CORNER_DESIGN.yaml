  # =====================================================================
  # Section: complexity_layers
  # =====================================================================
  - section: complexity_layers
    instances:
      - name: license_create_stale_image_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[license-create-stale-image]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Image.version: after one license creation bumps the image version, a second creation carrying the previously observed expected_image_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["CLEARED WIRE image read at version V; one license successfully created with expected_image_version V (image version now V+1)"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", expected_image_version: "${w_v}" }, as: RightsManager, captures: { l1_id: $.data.id } }
          trigger:
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "SOCIAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", expected_image_version: "${w_v}" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_STALE_VERSION (stale expected_image_version rejected with 412)"

      - name: payment_run_create_stale_photographer_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[payment-run-create-stale-photographer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Photographer.version: after one payment-run creation bumps the photographer version, a second creation carrying the previously observed expected_photographer_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["photographer read at version V; one DRAFT run for [2026-08-01, 2026-09-01) created with expected_photographer_version V"]
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "GET /photographers/${p_id}", as: FinanceAdmin, captures: { p_v: $.data.version } }
            - { call: "POST /photographers/${p_id}/payment-runs", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", expected_photographer_version: "${p_v}" }, as: FinanceAdmin, captures: { run1_id: $.data.id } }
          trigger:
            - { call: "POST /photographers/${p_id}/payment-runs", payload: { period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", expected_photographer_version: "${p_v}" }, as: FinanceAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_STALE_VERSION (stale expected_photographer_version rejected with 412)"

      - name: image_times_used_derived_field_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [entities.Image.fields.times_used, calculations.usage_ordinal_and_tier]
        distinguishing_aspect: "times_used is a derived counter that must reconcile with the UsageRun log: 0 at ingest, 2 after two runs, and still 2 after archival (archival does not erase usage history)."
        test_recipe:
          setup: ["CLEARED WIRE image with ACTIVE DIGITAL license covering August"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
          trigger:
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "flood-day-one", published_at: "2026-08-03T12:00:00Z" }, as: RightsManager }
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "flood-day-two", published_at: "2026-08-04T12:00:00Z" }, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { used1: $.data.times_used } }
            - { call: "POST /images/${w_id}/archive", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { used2: $.data.times_used, st2: $.data.status } }
          assert:
            - "captured used1 == 2 (counter reconciled with the two usage runs)"
            - "captured st2 == ARCHIVED and used2 == 2 (archival preserves usage history)"

      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: [calculations.license_fee_quote, calculations.photographer_payout]
        excluded_because:
          difficulty_instance: license_fee_first_use_vs_reuse
          rationale: "Both variants of both calculations are exercised by §1.8 instances license_fee_first_use_vs_reuse and payout_guarantee_vs_royalty_same_period."

      - name: layer_cascading_side_effects
