  # ------- ScheduleChange (the event-driven-sync surface) -----------------
  - method: POST
    path: "/festivals/{festivalId}/schedule-changes"
    description: "Create a ScheduleChange in status PROPOSED.  The body's change_kind discriminates the payload's required shape (see §1.1 ScheduleChange.payload).  Accepts an idempotency_key.  No cascade fires until /apply."
    roles: [FestivalProducer]
    code: 201
    input: ["change_kind", "target_program_item_id?", "payload", "idempotency_key?"]
    output: ScheduleChange
    side_effects: ["AuditEntry."]

  - method: GET
    path: "/festivals/{festivalId}/schedule-changes"
    description: "List schedule changes."
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?", "change_kind?", "target_program_item_id?"]
    output: "ScheduleChange[]"
    side_effects: []

  - method: GET
    path: "/festivals/{festivalId}/schedule-changes/{changeId}"
    description: "Read one schedule change, including its sync_envelopes array."
    roles: [Any]
    code: 200
    input: []
    output: ScheduleChange
    side_effects: []

  - method: POST
    path: "/festivals/{festivalId}/schedule-changes/{changeId}/apply"
    description: "PROPOSED → APPLIED.  Runs the cascade keyed on change_kind: ITEM_CANCEL fires the depth-3 cascade A (sound-check-leg) and the depth-2 cascade B (exposure-allocation-leg); ITEM_RESCHEDULE moves the item's window and re-runs the overlap/buffer/travel checks; STAGE_SWAP rotates the stage_id and re-runs equipment-and-overlap checks; VERSION_PUBLISH is a no-op-on-state and only seeds sync envelopes; TICKET_NOTIFY is the do-nothing-but-fan-out path.  Stamps applied_at and provisional_refund_cents_total when applicable.  Idempotent under the idempotency_key."
    roles: [FestivalProducer]
    code: 200
    input: ["If-Match?"]
    output: ScheduleChange
    side_effects:
      - "Cascade A's first link (the target ProgramItem flipping to CANCELLED for kind=ITEM_CANCEL) and downstream links into SoundCheckSlot and SoundEngineerTeam (the rule-4 instance A chain)."
      - "Cascade B (parallel) into ExposureAllocation and SponsorTier (rule-4 instance B chain)."
      - "Provisional refund computation for kind=ITEM_CANCEL — TicketType.provisional_refund_cents_outstanding rows bulged."
      - "sync_envelopes initialised to four QUEUED records (ticketing, im, broadcasting, sponsor)."
      - "AuditEntry of event_category=SCHEDULE_CHANGE."

  - method: POST
    path: "/festivals/{festivalId}/schedule-changes/{changeId}/reject"
    description: "PROPOSED → REJECTED.  No cascade.  Requires a `reason`."
    roles: [FestivalProducer]
    code: 200
    input: ["reason", "If-Match?"]
    output: ScheduleChange
    side_effects: ["AuditEntry."]

  - method: POST
    path: "/festivals/{festivalId}/schedule-changes/{changeId}/revert"
    description: "APPLIED → REVERTED.  Allowed only when no sync_envelopes element has reached ACKNOWLEDGED; the precondition lookup is performed atomically against the row.  The inverse fan-out reverses the apply's side-effects on TicketType.provisional_refund_cents_outstanding (restoring the rule-9 instance A outstanding-tickets invariant) and on ProgramItem.status (the target item's status is restored to the from_state recorded in the apply's AuditEntry).  Sound-check and exposure-allocation cascade effects are NOT auto-reinstated — operators must reissue those manually if they want them back; the invariant is on the global outstanding-ticket count, not on each cascaded entity's state."
    roles: [FestivalProducer]
    code: 200
    input: ["If-Match?"]
    output: ScheduleChange
    side_effects:
      - "All QUEUED sync_envelopes flip to status=CANCELLED."
      - "TicketType.provisional_refund_cents_outstanding decrements back to zero for the rows touched by this change."
      - "AuditEntry of event_category=SCHEDULE_CHANGE, payload_summary='reverted'."

