scenario: "1034. Skate & Surf Shop: SKU & board build/setup, grip/wheel/wax service, lesson/rental linkage, team/sponsor & event, trade-in/consignment, loyalty, special order, inventory"
domain_name: skate-surf-shop
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation          # finite inventory reserved/committed/released across builds & service
  secondary_archetype: temporal_windowing      # service bays, instructors, rental units scheduled with distinct interval semantics
  complexity_layers:
    - dual_variant_calculation                 # build provisional-vs-final price; trade-in cash-vs-credit payout
    - cascading_side_effects                    # member suspend and event close each drive multi-hop cascades
    - optimistic_concurrency                    # special-order re-quote supersede guarded by OCC on SpecialOrder.version
    - derived_field_reconciliation              # Product.stock_available & Event.registration_count kept consistent

  entity_topology: flat                         # peer entities linked by FK ids in the body, no deep URL nesting
  state_machine_shape: cyclic                   # BoardBuild ASSEMBLED->DRAFT revision loop; Member ACTIVE<->SUSPENDED; TradeIn branches
  relationship_patterns:
    - one_to_many                               # Member -> BoardBuild/Rental/Lesson/TradeIn/SpecialOrder
    - many_to_many                              # Member <-> Event via EventRegistration
    - cross_aggregate                           # ServiceOrder -> BoardBuild; Rental -> Lesson
  role_model: peer_roles                        # ShopManager (superset), Associate (floor ops), Instructor (own lessons), Member (own)
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE
# ============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique stock-keeping unit code" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: category, type: enum, source: input, description: "Catalog category", constraints: "one of DECK, TRUCK, WHEELS, BEARINGS, GRIP, WAX, SURFBOARD, ACCESSORY" }
      - { name: unit_price_cents, type: integer, source: input, description: "List price per unit in cents", constraints: ">= 0" }
      - { name: buildable_component, type: boolean, source: input, default: false, description: "Whether this product may be a BoardBuild component" }
      - { name: stock_on_hand, type: integer, source: input, default: 0, description: "Physical units in inventory", constraints: ">= 0" }
      - { name: stock_reserved, type: integer, source: system, default: 0, description: "Units reserved by builds/service orders but not yet consumed", constraints: ">= 0" }
      - { name: reorder_threshold, type: integer, source: input, default: 0, description: "Low-stock threshold for reporting", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Lifecycle status", constraints: "one of ACTIVE, DISCONTINUED" }
      - { name: stock_available, type: integer, source: computed, description: "Derived = stock_on_hand - stock_reserved; recomputed on every reserve/release/consume/restock" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Contact email; unique" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: tier, type: enum, source: input, default: STANDARD, description: "Loyalty/sponsorship tier driving discount & multiplier", constraints: "one of STANDARD, PRO, TEAM" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Account status", constraints: "one of ACTIVE, SUSPENDED" }
      - { name: points_balance, type: integer, source: system, default: 0, description: "Spendable loyalty points", constraints: ">= 0" }
      - { name: lifetime_points, type: integer, source: system, default: 0, description: "Cumulative loyalty points ever earned (never decremented)" }
      - { name: store_credit_cents, type: integer, source: system, default: 0, description: "Store credit balance in cents from trade-ins/consignment", constraints: ">= 0" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Instructor name" }
      - { name: discipline, type: enum, source: input, description: "Teaching discipline", constraints: "one of SKATE, SURF" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "Availability status", constraints: "one of ACTIVE, INACTIVE" }

  - name: ServiceBay
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Bay label" }
      - { name: status, type: enum, source: input, default: OPEN, description: "Bay operational status", constraints: "one of OPEN, CLOSED" }

  - name: RentalUnit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Rental asset label" }
      - { name: kind, type: enum, source: input, description: "Asset kind", constraints: "one of SKATEBOARD, SURFBOARD, WETSUIT" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Rental price per day in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: input, default: AVAILABLE, description: "Asset status", constraints: "one of AVAILABLE, RETIRED" }

  - name: BoardBuild
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the customer the build is for" }
      - { name: component_lines, type: array, source: input, description: "List of { product_id (references Product.id), qty:int>0 } component lines; each product must have buildable_component=true" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Build lifecycle", constraints: "one of DRAFT, COMPONENTS_RESERVED, ASSEMBLED, SETUP_COMPLETE, COMPLETED, CANCELLED" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Provisional price estimate set at reserve (build_price provisional variant); null before reserve" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final price set at setup (build_price final variant); null before setup" }
      - { name: reserved_at, type: datetime, source: system, description: "When components were reserved; null if never" }
      - { name: assembled_at, type: datetime, source: system, description: "When assembled; null if never" }
      - { name: setup_at, type: datetime, source: system, description: "When setup completed; null if never" }
      - { name: completed_at, type: datetime, source: system, description: "When picked up/sold; null if never" }

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the customer" }
      - { name: bay_id, type: string, source: input, description: "FK -> ServiceBay.id; the bay the work is scheduled on" }
      - { name: build_id, type: string, source: input, description: "FK -> BoardBuild.id; optional build being serviced; null for walk-in service" }
      - { name: service_type, type: enum, source: input, description: "Kind of service", constraints: "one of GRIP, WHEEL, WAX" }
      - { name: parts_lines, type: array, source: input, default: [], description: "List of { product_id (references Product.id), qty:int>0 } parts consumed; reserved at schedule, consumed at completion" }
      - { name: slot_start, type: datetime, source: input, description: "Scheduled slot start (ISO 8601)" }
      - { name: slot_end, type: datetime, source: input, description: "Scheduled slot end (ISO 8601)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Service lifecycle", constraints: "one of SCHEDULED, IN_PROGRESS, DONE, CANCELLED" }
      - { name: labor_total_cents, type: integer, source: computed, description: "Labor charge set at completion (service_charge); null before" }
      - { name: parts_total_cents, type: integer, source: computed, description: "Parts charge set at completion (service_charge); null before" }
      - { name: total_cents, type: integer, source: computed, description: "labor_total_cents + parts_total_cents; null before completion" }
      - { name: started_at, type: datetime, source: system, description: "When work started; null if never" }
      - { name: completed_at, type: datetime, source: system, description: "When work completed; null if never" }

  - name: Rental
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the renter" }
      - { name: unit_id, type: string, source: input, description: "FK -> RentalUnit.id; the rented asset" }
      - { name: lesson_id, type: string, source: input, description: "FK -> Lesson.id; optional lesson this rental is linked to; null for standalone rental" }
      - { name: start_date, type: string, source: input, description: "Rental start date (YYYY-MM-DD, inclusive)" }
      - { name: end_date, type: string, source: input, description: "Rental end date (YYYY-MM-DD, inclusive)" }
      - { name: deposit_cents, type: integer, source: input, default: 0, description: "Security deposit in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "Rental lifecycle", constraints: "one of RESERVED, CHECKED_OUT, RETURNED, CANCELLED" }
      - { name: rental_total_cents, type: integer, source: computed, description: "Base rental charge set at return (rental_charge); null before" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Late fee set at return (rental_charge); null before" }
      - { name: returned_on, type: string, source: system, description: "Logical-clock date of return (YYYY-MM-DD); null before" }
      - { name: checked_out_at, type: datetime, source: system, description: "When checked out; null if never" }
      - { name: cancelled_at, type: datetime, source: system, description: "When cancelled; null if never" }

  - name: Lesson
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the student" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; the teaching instructor" }
      - { name: discipline, type: enum, source: input, description: "Lesson discipline", constraints: "one of SKATE, SURF" }
      - { name: start_at, type: datetime, source: input, description: "Lesson start (ISO 8601)" }
      - { name: end_at, type: datetime, source: input, description: "Lesson end (ISO 8601)" }
      - { name: fee_cents, type: integer, source: input, description: "Lesson fee in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "Lesson lifecycle", constraints: "one of BOOKED, CONFIRMED, COMPLETED, CANCELLED" }
      - { name: confirmed_at, type: datetime, source: system, description: "When confirmed; null if never" }
      - { name: completed_at, type: datetime, source: system, description: "When completed; null if never" }

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the trading customer" }
      - { name: description, type: string, source: input, description: "Free-text description of the traded item" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "Trade-in lifecycle", constraints: "one of RECEIVED, APPRAISED, CASH_SETTLED, LISTED, SOLD, RETURNED" }
      - { name: appraised_value_cents, type: integer, source: system, description: "Appraised base value set at appraise; null before", constraints: ">= 0" }
      - { name: list_price_cents, type: integer, source: system, description: "Consignment list price set at list; null unless LISTED/SOLD", constraints: ">= 0" }
      - { name: payout_cents, type: integer, source: computed, description: "Payout to the member set at buyout or sell (tradein_payout); null before" }
      - { name: payout_method, type: enum, source: system, description: "How payout was rendered", constraints: "one of CASH, STORE_CREDIT, CONSIGNMENT; null before settlement" }
      - { name: appraised_at, type: datetime, source: system, description: "When appraised; null if never" }
      - { name: settled_at, type: datetime, source: system, description: "When cash-settled or sold; null if never" }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the requesting customer" }
      - { name: product_name, type: string, source: input, description: "Free-text description of the special-order item (not in catalog)" }
      - { name: qty, type: integer, source: input, description: "Quantity requested", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Special-order lifecycle", constraints: "one of REQUESTED, QUOTED, DEPOSIT_PAID, FULFILLED, CANCELLED" }
      - { name: quoted_price_cents, type: integer, source: system, description: "Latest quoted price set at quote/re-quote; null before first quote", constraints: ">= 0" }
      - { name: deposit_cents, type: integer, source: system, description: "Deposit collected at deposit; null before" }
      - { name: quoted_at, type: datetime, source: system, description: "When last quoted; null before" }
      - { name: fulfilled_at, type: datetime, source: system, description: "When fulfilled; null if never" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: capacity, type: integer, source: input, description: "Maximum registrations allowed", constraints: "> 0" }
      - { name: entry_points_cost, type: integer, source: input, default: 0, description: "Loyalty points charged to a member to register", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Event lifecycle", constraints: "one of OPEN, CLOSED" }
      - { name: registration_count, type: integer, source: computed, description: "Derived count of REGISTERED registrations; incremented on register, decremented on registration cancel" }

  - name: EventRegistration
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; the event registered for" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the registering member" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "Registration status", constraints: "one of REGISTERED, CANCELLED" }
      - { name: points_charged, type: integer, source: system, description: "Points debited from the member at registration; refunded exactly on cancel" }

# ============================================================================
# §1.2 STATE MACHINE TABLE
# ============================================================================
state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /members/{id}/suspend"
        actor: ShopManager
        preconditions: ["member.status == ACTIVE"]
        side_effects:
          - "CASCADE hop 1: every BoardBuild of this member with status in {DRAFT, COMPONENTS_RESERVED, ASSEMBLED, SETUP_COMPLETE} transitions to CANCELLED (see BoardBuild cancel)"
          - "CASCADE hop 2 (via build cancel): each cancelled build cancels its linked ServiceOrder(s) with status in {SCHEDULED, IN_PROGRESS}"
          - "CASCADE hop 3 (via service-order cancel): each cancelled ServiceOrder releases its reserved parts, decrementing Product.stock_reserved by each parts_line.qty"
        note: "Depth-3 cascade Member -> BoardBuild -> ServiceOrder -> Product; each hop caused by the previous."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{id}/reinstate"
        actor: ShopManager
        preconditions: ["member.status == SUSPENDED"]
        side_effects: ["refresh updated_at"]
        note: "ACTIVE<->SUSPENDED forms a cycle (non-linear machine)."

  - entity: BoardBuild
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: COMPONENTS_RESERVED
        trigger: "POST /board-builds/{id}/reserve"
        actor: Associate
        preconditions:
          - "build.status == DRAFT"
          - "every component_lines[].product_id references a Product with status == ACTIVE (else ERR_PRODUCT_DISCONTINUED)"
          - "for every component Product, stock_available >= line.qty (else ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "for each component_line: Product.stock_reserved += line.qty (stock_available recomputed)"
          - "compute provisional_total_cents via build_price provisional variant"
          - "set reserved_at = clock now"
      - from: COMPONENTS_RESERVED
        to: ASSEMBLED
        trigger: "POST /board-builds/{id}/assemble"
        actor: Associate
        preconditions: ["build.status == COMPONENTS_RESERVED"]
        side_effects: ["set assembled_at = clock now"]
      - from: ASSEMBLED
        to: DRAFT
        trigger: "POST /board-builds/{id}/revise"
        actor: Associate
        preconditions: ["build.status == ASSEMBLED"]
        side_effects:
          - "for each component_line: Product.stock_reserved -= line.qty (releases the reservation; stock_available recomputed)"
          - "clear provisional_total_cents (set null); clear assembled_at"
        note: "ASSEMBLED->DRAFT revision loop makes BoardBuild cyclic; releasing reservations is the compensating action for reserve."
      - from: ASSEMBLED
        to: SETUP_COMPLETE
        trigger: "POST /board-builds/{id}/setup"
        actor: Associate
        preconditions: ["build.status == ASSEMBLED"]
        side_effects:
          - "compute final_total_cents via build_price final variant"
          - "set setup_at = clock now"
      - from: SETUP_COMPLETE
        to: COMPLETED
        trigger: "POST /board-builds/{id}/complete"
        actor: Associate
        preconditions: ["build.status == SETUP_COMPLETE", "member.status == ACTIVE (else ERR_MEMBER_SUSPENDED)"]
        side_effects:
          - "for each component_line: Product.stock_on_hand -= line.qty AND Product.stock_reserved -= line.qty (converts reservation to consumption; stock_available unchanged by this pair)"
          - "award loyalty to member on net_amount = final_total_cents (loyalty_earn): member.points_balance += earned, member.lifetime_points += earned"
          - "set completed_at = clock now"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /board-builds/{id}/cancel (or cascade from Member suspend)"
        actor: Associate
        preconditions: ["build.status == DRAFT"]
        side_effects: ["no reservation held; set updated_at"]
      - from: COMPONENTS_RESERVED
        to: CANCELLED
        trigger: "POST /board-builds/{id}/cancel (or cascade from Member suspend)"
        actor: Associate
        preconditions: ["build.status == COMPONENTS_RESERVED"]
        side_effects:
          - "for each component_line: Product.stock_reserved -= line.qty (release)"
          - "cancel linked ServiceOrder(s) where build_id == this build and status in {SCHEDULED, IN_PROGRESS}"
      - from: ASSEMBLED
        to: CANCELLED
        trigger: "POST /board-builds/{id}/cancel (or cascade from Member suspend)"
        actor: Associate
        preconditions: ["build.status == ASSEMBLED"]
        side_effects:
          - "for each component_line: Product.stock_reserved -= line.qty (release)"
          - "cancel linked ServiceOrder(s) where build_id == this build and status in {SCHEDULED, IN_PROGRESS}"
      - from: SETUP_COMPLETE
        to: CANCELLED
        trigger: "POST /board-builds/{id}/cancel (or cascade from Member suspend)"
        actor: Associate
        preconditions: ["build.status == SETUP_COMPLETE"]
        side_effects:
          - "for each component_line: Product.stock_reserved -= line.qty (release)"
          - "cancel linked ServiceOrder(s) where build_id == this build and status in {SCHEDULED, IN_PROGRESS}"

  - entity: ServiceOrder
    initial_state: SCHEDULED
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /service-orders"
        actor: Associate
        preconditions:
          - "ServiceBay exists and status == OPEN"
          - "if build_id present, referenced BoardBuild.status in {SETUP_COMPLETE, COMPLETED} (else ERR_BUILD_NOT_READY)"
          - "slot_start < slot_end"
          - "no other ServiceOrder on the same bay with status in {SCHEDULED, IN_PROGRESS} whose [slot_start, slot_end) is closer than SETUP_BUFFER_MINUTES (= 30 minutes) (else ERR_BAY_UNAVAILABLE)"
          - "for each parts_line Product, stock_available >= qty (else ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "for each parts_line: Product.stock_reserved += qty"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /service-orders/{id}/start"
        actor: Associate
        preconditions: ["order.status == SCHEDULED"]
        side_effects: ["set started_at = clock now"]
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /service-orders/{id}/complete"
        actor: Associate
        preconditions: ["order.status == IN_PROGRESS"]
        side_effects:
          - "compute labor_total_cents, parts_total_cents, total_cents via service_charge"
          - "for each parts_line: Product.stock_on_hand -= qty AND Product.stock_reserved -= qty (consume)"
          - "award loyalty to member on net_amount = total_cents (loyalty_earn)"
          - "set completed_at = clock now"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /service-orders/{id}/cancel (or cascade from build cancel)"
        actor: Associate
        preconditions: ["order.status == SCHEDULED"]
        side_effects: ["for each parts_line: Product.stock_reserved -= qty (release)"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /service-orders/{id}/cancel (or cascade from build cancel)"
        actor: Associate
        preconditions: ["order.status == IN_PROGRESS"]
        side_effects: ["for each parts_line: Product.stock_reserved -= qty (release)"]

  - entity: Rental
    initial_state: RESERVED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: null
        to: RESERVED
        trigger: "POST /rentals"
        actor: Associate
        preconditions:
          - "RentalUnit exists and status == AVAILABLE"
          - "start_date <= end_date"
          - "duration_days = (end_date - start_date).days + 1 <= MAX_RENTAL_DAYS (= 14) (else ERR_RENTAL_TOO_LONG)"
          - "no other Rental on the same unit with status in {RESERVED, CHECKED_OUT} whose [start_date, end_date] closed interval intersects this one (else ERR_UNIT_UNAVAILABLE)"
          - "if lesson_id present, referenced Lesson exists"
        side_effects: ["status = RESERVED"]
      - from: RESERVED
        to: CHECKED_OUT
        trigger: "POST /rentals/{id}/checkout"
        actor: Associate
        preconditions: ["rental.status == RESERVED"]
        side_effects: ["set checked_out_at = clock now"]
      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /rentals/{id}/return"
        actor: Associate
        preconditions: ["rental.status == CHECKED_OUT"]
        side_effects:
          - "compute rental_total_cents and late_fee_cents via rental_charge using clock current date as actual return date"
          - "award loyalty to member on net_amount = rental_total_cents + late_fee_cents (loyalty_earn)"
          - "set returned_on = clock current date"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /rentals/{id}/cancel (or cascade from lesson cancel)"
        actor: Associate
        preconditions: ["rental.status == RESERVED"]
        side_effects: ["set cancelled_at = clock now (unit becomes bookable again)"]
      - from: CHECKED_OUT
        to: CANCELLED
        trigger: "POST /rentals/{id}/cancel (or cascade from lesson cancel)"
        actor: Associate
        preconditions: ["rental.status == CHECKED_OUT"]
        side_effects: ["set cancelled_at = clock now"]

  - entity: Lesson
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: null
        to: BOOKED
        trigger: "POST /lessons"
        actor: Associate
        preconditions:
          - "Instructor exists and status == ACTIVE"
          - "start_at < end_at"
          - "no other Lesson for the same instructor with status in {BOOKED, CONFIRMED} whose [start_at, end_at) half-open interval overlaps this one (adjacency end==start is allowed) (else ERR_INSTRUCTOR_UNAVAILABLE)"
        side_effects: ["status = BOOKED"]
      - from: BOOKED
        to: CONFIRMED
        trigger: "POST /lessons/{id}/confirm"
        actor: Instructor
        preconditions:
          - "lesson.status == BOOKED"
          - "every Rental with lesson_id == this lesson has status in {RESERVED, CHECKED_OUT} (else ERR_RENTAL_NOT_READY)"
        side_effects: ["set confirmed_at = clock now"]
        note: "Cross-entity dependency Lesson -> Rental."
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /lessons/{id}/complete"
        actor: Instructor
        preconditions: ["lesson.status == CONFIRMED"]
        side_effects:
          - "award loyalty to member on net_amount = fee_cents (loyalty_earn)"
          - "set completed_at = clock now"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /lessons/{id}/cancel"
        actor: Instructor
        preconditions: ["lesson.status == BOOKED"]
        side_effects:
          - "CASCADE: every Rental with lesson_id == this lesson and status in {RESERVED, CHECKED_OUT} transitions to CANCELLED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /lessons/{id}/cancel"
        actor: Instructor
        preconditions: ["lesson.status == CONFIRMED"]
        side_effects:
          - "CASCADE: every Rental with lesson_id == this lesson and status in {RESERVED, CHECKED_OUT} transitions to CANCELLED"

  - entity: TradeIn
    initial_state: RECEIVED
    terminal_states: [CASH_SETTLED, SOLD, RETURNED]
    transitions:
      - from: RECEIVED
        to: APPRAISED
        trigger: "POST /trade-ins/{id}/appraise"
        actor: ShopManager
        preconditions: ["tradein.status == RECEIVED"]
        side_effects: ["set appraised_value_cents = input; set appraised_at = clock now"]
      - from: APPRAISED
        to: CASH_SETTLED
        trigger: "POST /trade-ins/{id}/buyout"
        actor: Associate
        preconditions: ["tradein.status == APPRAISED"]
        side_effects:
          - "compute payout_cents via tradein_payout buyout variant selected by payout_method (CASH or STORE_CREDIT)"
          - "set payout_method = input"
          - "if payout_method == STORE_CREDIT: member.store_credit_cents += payout_cents (CASH pays out physically, no member balance change)"
          - "set settled_at = clock now"
        note: "Branch 1 of the TradeIn fork; divergent side-effect set from the LISTED branch."
      - from: APPRAISED
        to: LISTED
        trigger: "POST /trade-ins/{id}/list"
        actor: Associate
        preconditions: ["tradein.status == APPRAISED"]
        side_effects: ["set list_price_cents = input"]
        note: "Branch 2 of the TradeIn fork (consignment)."
      - from: LISTED
        to: SOLD
        trigger: "POST /trade-ins/{id}/sell"
        actor: Associate
        preconditions: ["tradein.status == LISTED"]
        side_effects:
          - "compute payout_cents via tradein_payout consignment variant over list_price_cents"
          - "set payout_method = CONSIGNMENT"
          - "member.store_credit_cents += payout_cents"
          - "set settled_at = clock now"
      - from: RECEIVED
        to: RETURNED
        trigger: "POST /trade-ins/{id}/return"
        actor: Associate
        preconditions: ["tradein.status == RECEIVED"]
        side_effects: ["set updated_at"]
      - from: APPRAISED
        to: RETURNED
        trigger: "POST /trade-ins/{id}/return"
        actor: Associate
        preconditions: ["tradein.status == APPRAISED"]
        side_effects: ["set updated_at"]
      - from: LISTED
        to: RETURNED
        trigger: "POST /trade-ins/{id}/return"
        actor: Associate
        preconditions: ["tradein.status == LISTED"]
        side_effects: ["clear list_price_cents (removed from consignment)"]

  - entity: SpecialOrder
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote"
        actor: Associate
        preconditions:
          - "order.status in {REQUESTED, QUOTED}"
          - "expected_special_order_version == order.version (else ERR_STALE_VERSION)"
        side_effects: ["set quoted_price_cents = input; set quoted_at = clock now; increments SpecialOrder.version by 1"]
      - from: QUOTED
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote (re-quote / supersede)"
        actor: Associate
        preconditions:
          - "order.status in {REQUESTED, QUOTED}"
          - "expected_special_order_version == order.version (else ERR_STALE_VERSION)"
        side_effects: ["overwrite quoted_price_cents = input; set quoted_at = clock now; increments SpecialOrder.version by 1"]
        note: "Re-quote legitimately supersedes the prior quote; OCC on version is the only guard (see §1.2.1)."
      - from: QUOTED
        to: DEPOSIT_PAID
        trigger: "POST /special-orders/{id}/deposit"
        actor: Associate
        preconditions: ["order.status == QUOTED"]
        side_effects: ["set deposit_cents = input"]
      - from: DEPOSIT_PAID
        to: FULFILLED
        trigger: "POST /special-orders/{id}/fulfill"
        actor: Associate
        preconditions: ["order.status == DEPOSIT_PAID"]
        side_effects:
          - "award loyalty to member on net_amount = quoted_price_cents (loyalty_earn)"
          - "set fulfilled_at = clock now"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: Associate
        preconditions: ["order.status == REQUESTED"]
        side_effects: ["set updated_at"]
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: Associate
        preconditions: ["order.status == QUOTED"]
        side_effects: ["set updated_at"]
      - from: DEPOSIT_PAID
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: Associate
        preconditions: ["order.status == DEPOSIT_PAID"]
        side_effects: ["set updated_at"]

  - entity: Event
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /events/{id}/close"
        actor: ShopManager
        preconditions: ["event.status == OPEN"]
        side_effects:
          - "CASCADE hop 1: every EventRegistration with event_id == this event and status == REGISTERED transitions to CANCELLED"
          - "CASCADE hop 2 (via registration cancel): each cancelled registration refunds member.points_balance += points_charged and decrements event.registration_count"
        note: "Depth-2 cascade Event -> EventRegistration -> Member."

  - entity: EventRegistration
    initial_state: REGISTERED
    terminal_states: [CANCELLED]
    transitions:
      - from: null
        to: REGISTERED
        trigger: "POST /events/{id}/register"
        actor: Associate
        preconditions:
          - "Event exists and status == OPEN (else ERR_EVENT_CLOSED)"
          - "Member exists and status == ACTIVE (else ERR_MEMBER_SUSPENDED)"
          - "no existing EventRegistration with same event_id and member_id in status REGISTERED (else ERR_DUPLICATE_REGISTRATION)"
          - "event.registration_count < event.capacity (else ERR_EVENT_FULL)"
          - "member.points_balance >= event.entry_points_cost (else ERR_INSUFFICIENT_POINTS)"
        side_effects:
          - "set points_charged = event.entry_points_cost"
          - "member.points_balance -= points_charged"
          - "event.registration_count += 1"
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /event-registrations/{id}/cancel (or cascade from event close)"
        actor: Member
        preconditions: ["registration.status == REGISTERED"]
        side_effects:
          - "member.points_balance += points_charged (exact refund)"
          - "event.registration_count -= 1"

# ============================================================================
# §1.2.1 CONCURRENCY RULES
# ============================================================================
concurrency_rules:
  - rule_id: special-order-requote-stale
    parent_entity: SpecialOrder
    write_endpoint: "POST /special-orders/{id}/quote"
    occ_field: "expected_special_order_version"
    description: |
      Re-quoting a SpecialOrder whose version has advanced since the client last
      observed it is rejected. A re-quote legitimately overwrites (supersedes) the
      prior quoted_price_cents, so the operation itself would succeed from the
      observed state; the only guard is that the caller's expected_special_order_version
      matches the current version. A stale expected version (a quote issued after
      another quote already advanced the version) is rejected with a precondition
      failure.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ============================================================================
# §1.3 CALCULATION RULES TABLE
# ============================================================================
calculations:
  - name: build_price
    trigger: "On POST /board-builds/{id}/reserve (provisional) and POST /board-builds/{id}/setup (final)"
    algorithm: aggregation
    formula: |
      # provisional variant (at reserve): raw list price sum, no discount, no setup fee
      provisional_total_cents = sum over component_lines of (product.unit_price_cents * line.qty)

      # final variant (at setup): per-line member-tier discount, ROUND EACH LINE, then sum, then add setup fee
      # Rounding order is PINNED: round the discounted per-unit price first, multiply by qty, then sum.
      for each line:
        disc_unit = round_half_up(product.unit_price_cents * (1 - TIER_DISCOUNT[member.tier]))
        line_total = disc_unit * line.qty
      final_total_cents = (sum over lines of line_total) + SETUP_FEE_CENTS
    input_set: "component_lines of the build; member.tier read from the owning Member at the moment of each transition"
    constants:
      TIER_DISCOUNT: { STANDARD: 0.0, PRO: 0.10, TEAM: 0.20 }
      SETUP_FEE_CENTS: 2500
    precision: "integer cents; round_half_up applied to the discounted per-unit price BEFORE multiplying by qty"
    variants:
      - name: provisional
        when: "at reserve (DRAFT -> COMPONENTS_RESERVED)"
        difference: "raw list-price sum with no tier discount and no setup fee"
      - name: final
        when: "at setup (ASSEMBLED -> SETUP_COMPLETE)"
        difference: "per-line rounded tier discount then sum, plus SETUP_FEE_CENTS; diverges from provisional for the same lines"

  - name: tradein_payout
    trigger: "On POST /trade-ins/{id}/buyout (CASH or STORE_CREDIT) and POST /trade-ins/{id}/sell (CONSIGNMENT)"
    algorithm: threshold
    formula: |
      # buyout variants operate on appraised_value_cents
      if payout_method == CASH:          payout_cents = round_half_up(appraised_value_cents * CASH_RATE)
      elif payout_method == STORE_CREDIT: payout_cents = round_half_up(appraised_value_cents * CREDIT_RATE)
      # consignment variant operates on list_price_cents
      elif payout_method == CONSIGNMENT:  payout_cents = round_half_up(list_price_cents * (1 - CONSIGNMENT_FEE))
    input_set: "single TradeIn; appraised_value_cents for buyout, list_price_cents for consignment"
    constants:
      CASH_RATE: 0.50
      CREDIT_RATE: 0.70
      CONSIGNMENT_FEE: 0.30
    precision: "integer cents, round_half_up"
    variants:
      - name: cash
        when: "buyout with payout_method == CASH"
        difference: "50% of appraised value, paid physically (no store_credit change)"
      - name: store_credit
        when: "buyout with payout_method == STORE_CREDIT"
        difference: "70% of appraised value, credited to member.store_credit_cents; strictly higher than cash for identical appraised_value_cents"
      - name: consignment
        when: "sell of a LISTED item"
        difference: "70% of list_price_cents (30% consignment fee), credited to store_credit"

  - name: loyalty_earn
    trigger: "On BoardBuild complete, ServiceOrder complete, Rental return, Lesson complete, SpecialOrder fulfill"
    algorithm: tiered_pricing
    formula: |
      # 3 inputs: net_amount_cents, member.tier (-> multiplier), double_points flag
      base_points = floor(net_amount_cents / POINTS_DIVISOR)
      mult = TIER_MULTIPLIER[member.tier] * (2 if double_points else 1)
      earned = min(base_points * mult, MAX_POINTS_PER_TXN)
      member.points_balance += earned
      member.lifetime_points += earned
    input_set: "net_amount_cents supplied by the triggering transition; member.tier; double_points flag from the completing request (default false)"
    constants:
      POINTS_DIVISOR: 100
      TIER_MULTIPLIER: { STANDARD: 1, PRO: 2, TEAM: 3 }
      MAX_POINTS_PER_TXN: 500
    precision: "integer points; floor on the division, min-cap applied AFTER the multiplier"

  - name: rental_charge
    trigger: "On POST /rentals/{id}/return"
    algorithm: threshold
    formula: |
      duration_days = (end_date - start_date).days + 1     # closed inclusive interval
      rental_total_cents = unit.daily_rate_cents * duration_days
      late_days = max(0, (clock_current_date - end_date).days)
      late_fee_cents = late_days * LATE_FEE_PER_DAY_CENTS
    input_set: "the Rental's dates and its RentalUnit.daily_rate_cents; clock_current_date is the logical clock date at return"
    constants:
      LATE_FEE_PER_DAY_CENTS: 1500
    precision: "integer cents; day counts are whole-day differences"

  - name: service_charge
    trigger: "On POST /service-orders/{id}/complete"
    algorithm: aggregation
    formula: |
      labor_total_cents = SERVICE_LABOR_CENTS[service_type]
      parts_total_cents = sum over parts_lines of (product.unit_price_cents * qty)
      total_cents = labor_total_cents + parts_total_cents
    input_set: "the ServiceOrder's service_type and parts_lines; product prices read at completion"
    constants:
      SERVICE_LABOR_CENTS: { GRIP: 800, WHEEL: 1500, WAX: 500 }
    precision: "integer cents"

# ============================================================================
# §1.4 VALIDATION RULES TABLE (ordered by priority)
# ============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is permitted for this operation per §1.7", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path id and every body FK reference resolve to an existing resource, validated left-to-right", error_id: "ERR_<ENTITY>_NOT_FOUND", http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "request body well-formed: required fields present, enum members valid, integers non-negative where constrained, qty > 0, interval start strictly before end", error_id: ERR_VALIDATION, http_status: 422, applies_to: "all writes" }
  - { priority: 5, category: state, check: "target resource is in a state from which this transition is allowed (build DRAFT for reserve, event OPEN for register, etc.)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 5, category: state, check: "acting/target Member.status == ACTIVE where the operation requires an active member (build complete, event register)", error_id: ERR_MEMBER_SUSPENDED, http_status: 409, applies_to: "POST /board-builds/{id}/complete, POST /events/{id}/register" }
  - { priority: 5, category: state, check: "Event.status == OPEN for registration", error_id: ERR_EVENT_CLOSED, http_status: 409, applies_to: "POST /events/{id}/register" }
  - { priority: 5, category: state, check: "referenced Product.status == ACTIVE when reserving it as a build component", error_id: ERR_PRODUCT_DISCONTINUED, http_status: 409, applies_to: "POST /board-builds/{id}/reserve" }
  - { priority: 6, category: business_referential, check: "if ServiceOrder.build_id set, the BoardBuild.status in {SETUP_COMPLETE, COMPLETED}", error_id: ERR_BUILD_NOT_READY, http_status: 409, applies_to: "POST /service-orders" }
  - { priority: 6, category: business_referential, check: "for lesson confirm, every Rental linked to this lesson has status in {RESERVED, CHECKED_OUT}", error_id: ERR_RENTAL_NOT_READY, http_status: 409, applies_to: "POST /lessons/{id}/confirm" }
  - { priority: 7, category: business_constraint, check: "no duplicate active EventRegistration for (event, member)", error_id: ERR_DUPLICATE_REGISTRATION, http_status: 409, applies_to: "POST /events/{id}/register" }
  - { priority: 7, category: business_constraint, check: "event.registration_count < event.capacity", error_id: ERR_EVENT_FULL, http_status: 409, applies_to: "POST /events/{id}/register" }
  - { priority: 7, category: business_constraint, check: "rental duration_days = (end-start).days+1 <= MAX_RENTAL_DAYS (= 14)", error_id: ERR_RENTAL_TOO_LONG, http_status: 422, applies_to: "POST /rentals" }
  - { priority: 7, category: business_constraint, check: "for every component/parts Product, stock_available >= requested qty", error_id: ERR_INSUFFICIENT_STOCK, http_status: 409, applies_to: "POST /board-builds/{id}/reserve, POST /service-orders" }
  - { priority: 8, category: business_temporal, check: "no lesson overlap on the same instructor using half-open [start_at, end_at) semantics (adjacency allowed)", error_id: ERR_INSTRUCTOR_UNAVAILABLE, http_status: 409, applies_to: "POST /lessons" }
  - { priority: 8, category: business_temporal, check: "no service-order on the same bay within SETUP_BUFFER_MINUTES (= 30 minutes) of an existing SCHEDULED/IN_PROGRESS slot", error_id: ERR_BAY_UNAVAILABLE, http_status: 409, applies_to: "POST /service-orders" }
  - { priority: 8, category: business_temporal, check: "no rental overlap on the same unit using closed inclusive [start_date, end_date] semantics", error_id: ERR_UNIT_UNAVAILABLE, http_status: 409, applies_to: "POST /rentals" }
  - { priority: 9, category: business_fiscal, check: "member.points_balance >= event.entry_points_cost", error_id: ERR_INSUFFICIENT_POINTS, http_status: 402, applies_to: "POST /events/{id}/register" }
  - { priority: 10, category: business_constraint, check: "OCC: expected_special_order_version == SpecialOrder.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /special-orders/{id}/quote" }

# ============================================================================
# §1.5 API ENDPOINT TABLE
# ============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. Governs rental late-fee day counts and *_at stamps."
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets logical clock to to_iso8601"]

  # ---- Product ----
  - { method: POST, path: "/products", description: "Create a catalog product", roles: [ShopManager], code: 201, input: [sku, name, category, unit_price_cents, "buildable_component?", "stock_on_hand?", "reorder_threshold?"], output: Product, side_effects: ["stock_reserved=0, status=ACTIVE, stock_available=stock_on_hand"] }
  - { method: GET, path: "/products/{id}", description: "Fetch a product", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: Product }
  - { method: GET, path: "/products", description: "List products", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: ["category?", "status?", "limit?", "offset?"], output: "Product[]" }
  - { method: PATCH, path: "/products/{id}", description: "Update price or status (e.g., discontinue)", roles: [ShopManager], code: 200, input: ["unit_price_cents?", "status?"], output: Product, side_effects: ["version += 1"] }
  - { method: POST, path: "/products/{id}/restock", description: "Add physical units", roles: [ShopManager], code: 200, input: [quantity], output: Product, side_effects: ["stock_on_hand += quantity; stock_available recomputed; version += 1"] }

  # ---- Member ----
  - { method: POST, path: "/members", description: "Create a member", roles: [ShopManager, Associate], code: 201, input: [email, full_name, "tier?"], output: Member, side_effects: ["status=ACTIVE, points_balance=0, lifetime_points=0, store_credit_cents=0"] }
  - { method: GET, path: "/members/{id}", description: "Fetch a member", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: Member }
  - { method: POST, path: "/members/{id}/suspend", description: "Suspend a member (depth-3 cascade)", roles: [ShopManager], code: 200, input: [], output: Member, side_effects: ["ACTIVE->SUSPENDED; cascade cancel active builds -> service orders -> release parts reservations"] }
  - { method: POST, path: "/members/{id}/reinstate", description: "Reinstate a suspended member", roles: [ShopManager], code: 200, input: [], output: Member, side_effects: ["SUSPENDED->ACTIVE"] }

  # ---- Instructor ----
  - { method: POST, path: "/instructors", description: "Create an instructor", roles: [ShopManager], code: 201, input: [full_name, discipline, "status?"], output: Instructor }
  - { method: GET, path: "/instructors/{id}", description: "Fetch an instructor", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: Instructor }

  # ---- ServiceBay ----
  - { method: POST, path: "/service-bays", description: "Create a service bay", roles: [ShopManager], code: 201, input: [name, "status?"], output: ServiceBay }
  - { method: GET, path: "/service-bays/{id}", description: "Fetch a service bay", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: ServiceBay }

  # ---- RentalUnit ----
  - { method: POST, path: "/rental-units", description: "Create a rental unit", roles: [ShopManager], code: 201, input: [name, kind, daily_rate_cents, "status?"], output: RentalUnit }
  - { method: GET, path: "/rental-units/{id}", description: "Fetch a rental unit", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: RentalUnit }

  # ---- BoardBuild ----
  - { method: POST, path: "/board-builds", description: "Create a board build in DRAFT", roles: [ShopManager, Associate], code: 201, input: [member_id, component_lines], output: BoardBuild, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/board-builds/{id}", description: "Fetch a build", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: BoardBuild }
  - { method: GET, path: "/board-builds", description: "List builds (reverse-reachability for member_id)", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: ["member_id?", "status?", "limit?", "offset?"], output: "BoardBuild[]" }
  - { method: POST, path: "/board-builds/{id}/reserve", description: "Reserve components", roles: [ShopManager, Associate], code: 200, input: [], output: BoardBuild, side_effects: ["DRAFT->COMPONENTS_RESERVED; Product.stock_reserved += qty per line; compute provisional_total_cents"] }
  - { method: POST, path: "/board-builds/{id}/assemble", description: "Mark assembled", roles: [ShopManager, Associate], code: 200, input: [], output: BoardBuild, side_effects: ["COMPONENTS_RESERVED->ASSEMBLED"] }
  - { method: POST, path: "/board-builds/{id}/revise", description: "Return to DRAFT, releasing reservations", roles: [ShopManager, Associate], code: 200, input: [], output: BoardBuild, side_effects: ["ASSEMBLED->DRAFT; Product.stock_reserved -= qty per line; clear provisional_total_cents"] }
  - { method: POST, path: "/board-builds/{id}/setup", description: "Complete grip/wheel setup, compute final price", roles: [ShopManager, Associate], code: 200, input: [], output: BoardBuild, side_effects: ["ASSEMBLED->SETUP_COMPLETE; compute final_total_cents"] }
  - { method: POST, path: "/board-builds/{id}/complete", description: "Hand over / sell the build", roles: [ShopManager, Associate], code: 200, input: ["double_points?"], output: BoardBuild, side_effects: ["SETUP_COMPLETE->COMPLETED; Product.stock_on_hand -= qty & stock_reserved -= qty per line; loyalty_earn on final_total_cents"] }
  - { method: POST, path: "/board-builds/{id}/cancel", description: "Cancel a build", roles: [ShopManager, Associate], code: 200, input: [], output: BoardBuild, side_effects: ["->CANCELLED; release reservations if held; cancel linked service orders"] }

  # ---- ServiceOrder ----
  - { method: POST, path: "/service-orders", description: "Schedule a grip/wheel/wax service", roles: [ShopManager, Associate], code: 201, input: [member_id, bay_id, service_type, slot_start, slot_end, "build_id?", "parts_lines?"], output: ServiceOrder, side_effects: ["status=SCHEDULED; Product.stock_reserved += qty per parts_line"] }
  - { method: GET, path: "/service-orders/{id}", description: "Fetch a service order", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: ServiceOrder }
  - { method: GET, path: "/service-orders", description: "List service orders (reverse-reachability for member_id/bay_id/build_id)", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: ["member_id?", "bay_id?", "build_id?", "status?", "limit?", "offset?"], output: "ServiceOrder[]" }
  - { method: POST, path: "/service-orders/{id}/start", description: "Start the work", roles: [ShopManager, Associate], code: 200, input: [], output: ServiceOrder, side_effects: ["SCHEDULED->IN_PROGRESS"] }
  - { method: POST, path: "/service-orders/{id}/complete", description: "Complete the work, consume parts", roles: [ShopManager, Associate], code: 200, input: ["double_points?"], output: ServiceOrder, side_effects: ["IN_PROGRESS->DONE; service_charge; Product.stock_on_hand -= & stock_reserved -= per part; loyalty_earn on total_cents"] }
  - { method: POST, path: "/service-orders/{id}/cancel", description: "Cancel a service order", roles: [ShopManager, Associate], code: 200, input: [], output: ServiceOrder, side_effects: ["->CANCELLED; release reserved parts"] }

  # ---- Rental ----
  - { method: POST, path: "/rentals", description: "Create a rental reservation", roles: [ShopManager, Associate], code: 201, input: [member_id, unit_id, start_date, end_date, "lesson_id?", "deposit_cents?"], output: Rental, side_effects: ["status=RESERVED"] }
  - { method: GET, path: "/rentals/{id}", description: "Fetch a rental", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: Rental }
  - { method: GET, path: "/rentals", description: "List rentals (reverse-reachability for member_id/unit_id/lesson_id)", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: ["member_id?", "unit_id?", "lesson_id?", "status?", "limit?", "offset?"], output: "Rental[]" }
  - { method: POST, path: "/rentals/{id}/checkout", description: "Check out a reserved rental", roles: [ShopManager, Associate], code: 200, input: [], output: Rental, side_effects: ["RESERVED->CHECKED_OUT"] }
  - { method: POST, path: "/rentals/{id}/return", description: "Return a rental, compute charges", roles: [ShopManager, Associate], code: 200, input: ["double_points?"], output: Rental, side_effects: ["CHECKED_OUT->RETURNED; rental_charge; loyalty_earn on rental_total_cents+late_fee_cents"] }
  - { method: POST, path: "/rentals/{id}/cancel", description: "Cancel a rental", roles: [ShopManager, Associate], code: 200, input: [], output: Rental, side_effects: ["->CANCELLED"] }

  # ---- Lesson ----
  - { method: POST, path: "/lessons", description: "Book a lesson", roles: [ShopManager, Associate], code: 201, input: [member_id, instructor_id, discipline, start_at, end_at, fee_cents], output: Lesson, side_effects: ["status=BOOKED"] }
  - { method: GET, path: "/lessons/{id}", description: "Fetch a lesson", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: Lesson }
  - { method: GET, path: "/lessons", description: "List lessons (reverse-reachability for member_id/instructor_id)", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: ["member_id?", "instructor_id?", "status?", "limit?", "offset?"], output: "Lesson[]" }
  - { method: POST, path: "/lessons/{id}/confirm", description: "Confirm a lesson (checks linked rentals)", roles: [ShopManager, Instructor], code: 200, input: [], output: Lesson, side_effects: ["BOOKED->CONFIRMED"] }
  - { method: POST, path: "/lessons/{id}/complete", description: "Complete a lesson", roles: [ShopManager, Instructor], code: 200, input: ["double_points?"], output: Lesson, side_effects: ["CONFIRMED->COMPLETED; loyalty_earn on fee_cents"] }
  - { method: POST, path: "/lessons/{id}/cancel", description: "Cancel a lesson (cascade cancels linked rentals)", roles: [ShopManager, Instructor], code: 200, input: [], output: Lesson, side_effects: ["->CANCELLED; cascade cancel linked rentals"] }

  # ---- TradeIn ----
  - { method: POST, path: "/trade-ins", description: "Receive a trade-in", roles: [ShopManager, Associate], code: 201, input: [member_id, description], output: TradeIn, side_effects: ["status=RECEIVED"] }
  - { method: GET, path: "/trade-ins/{id}", description: "Fetch a trade-in", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: TradeIn }
  - { method: GET, path: "/trade-ins", description: "List trade-ins (reverse-reachability for member_id)", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: ["member_id?", "status?", "limit?", "offset?"], output: "TradeIn[]" }
  - { method: POST, path: "/trade-ins/{id}/appraise", description: "Appraise a received trade-in", roles: [ShopManager], code: 200, input: [appraised_value_cents], output: TradeIn, side_effects: ["RECEIVED->APPRAISED; set appraised_value_cents"] }
  - { method: POST, path: "/trade-ins/{id}/buyout", description: "Instant buyout (cash or store credit)", roles: [ShopManager, Associate], code: 200, input: [payout_method], output: TradeIn, side_effects: ["APPRAISED->CASH_SETTLED; tradein_payout; if STORE_CREDIT member.store_credit_cents += payout"] }
  - { method: POST, path: "/trade-ins/{id}/list", description: "List for consignment", roles: [ShopManager, Associate], code: 200, input: [list_price_cents], output: TradeIn, side_effects: ["APPRAISED->LISTED; set list_price_cents"] }
  - { method: POST, path: "/trade-ins/{id}/sell", description: "Sell a listed consignment item", roles: [ShopManager, Associate], code: 200, input: [], output: TradeIn, side_effects: ["LISTED->SOLD; tradein_payout consignment; member.store_credit_cents += payout"] }
  - { method: POST, path: "/trade-ins/{id}/return", description: "Return the item to the member", roles: [ShopManager, Associate], code: 200, input: [], output: TradeIn, side_effects: ["{RECEIVED,APPRAISED,LISTED}->RETURNED"] }

  # ---- SpecialOrder ----
  - { method: POST, path: "/special-orders", description: "Request a special order", roles: [ShopManager, Associate, Member], code: 201, input: [member_id, product_name, qty], output: SpecialOrder, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/special-orders/{id}", description: "Fetch a special order", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: SpecialOrder }
  - { method: GET, path: "/special-orders", description: "List special orders (reverse-reachability for member_id)", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: ["member_id?", "status?", "limit?", "offset?"], output: "SpecialOrder[]" }
  - { method: POST, path: "/special-orders/{id}/quote", description: "Quote / re-quote a price (OCC guarded)", roles: [ShopManager, Associate], code: 200, input: [quoted_price_cents, expected_special_order_version], output: SpecialOrder, side_effects: ["-> QUOTED (re-quote supersedes); set quoted_price_cents; increments SpecialOrder.version by 1"] }
  - { method: POST, path: "/special-orders/{id}/deposit", description: "Collect a deposit", roles: [ShopManager, Associate], code: 200, input: [deposit_cents], output: SpecialOrder, side_effects: ["QUOTED->DEPOSIT_PAID; set deposit_cents"] }
  - { method: POST, path: "/special-orders/{id}/fulfill", description: "Fulfill the special order", roles: [ShopManager, Associate], code: 200, input: ["double_points?"], output: SpecialOrder, side_effects: ["DEPOSIT_PAID->FULFILLED; loyalty_earn on quoted_price_cents"] }
  - { method: POST, path: "/special-orders/{id}/cancel", description: "Cancel a special order", roles: [ShopManager, Associate, Member], code: 200, input: [], output: SpecialOrder, side_effects: ["->CANCELLED"] }

  # ---- Event & EventRegistration ----
  - { method: POST, path: "/events", description: "Create a shop event", roles: [ShopManager], code: 201, input: [name, capacity, "entry_points_cost?"], output: Event, side_effects: ["status=OPEN; registration_count=0"] }
  - { method: GET, path: "/events/{id}", description: "Fetch an event", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: Event }
  - { method: POST, path: "/events/{id}/close", description: "Close an event (cascade cancels registrations, refunds points)", roles: [ShopManager], code: 200, input: [], output: Event, side_effects: ["OPEN->CLOSED; cascade cancel REGISTERED registrations -> refund points"] }
  - { method: POST, path: "/events/{id}/register", description: "Register a member for an event (charges points)", roles: [ShopManager, Associate, Member], code: 201, input: [member_id], output: EventRegistration, side_effects: ["create EventRegistration REGISTERED; member.points_balance -= entry_points_cost; event.registration_count += 1"] }
  - { method: GET, path: "/event-registrations/{id}", description: "Fetch a registration", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: [], output: EventRegistration }
  - { method: GET, path: "/event-registrations", description: "List registrations (reverse-reachability for event_id/member_id)", roles: [ShopManager, Associate, Instructor, Member], code: 200, input: ["event_id?", "member_id?", "status?", "limit?", "offset?"], output: "EventRegistration[]" }
  - { method: POST, path: "/event-registrations/{id}/cancel", description: "Cancel a registration (refunds points)", roles: [ShopManager, Member], code: 200, input: [], output: EventRegistration, side_effects: ["REGISTERED->CANCELLED; member.points_balance += points_charged; event.registration_count -= 1"] }

# ============================================================================
# §1.6 ERROR CODE CATALOG
# ============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation (or entity-backed ownership mismatch)" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, negative amount, qty<=0, or interval start>=end" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member_id / path member id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "A referenced product_id does not exist" }
  - { id: ERR_INSTRUCTOR_NOT_FOUND, http: 404, condition: "instructor_id does not exist" }
  - { id: ERR_BAY_NOT_FOUND, http: 404, condition: "bay_id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "unit_id does not exist" }
  - { id: ERR_BUILD_NOT_FOUND, http: 404, condition: "board build id does not exist" }
  - { id: ERR_SERVICE_ORDER_NOT_FOUND, http: 404, condition: "service order id does not exist" }
  - { id: ERR_RENTAL_NOT_FOUND, http: 404, condition: "rental id / lesson-linked rental does not exist" }
  - { id: ERR_LESSON_NOT_FOUND, http: 404, condition: "lesson id does not exist" }
  - { id: ERR_TRADEIN_NOT_FOUND, http: 404, condition: "trade-in id does not exist" }
  - { id: ERR_SPECIAL_ORDER_NOT_FOUND, http: 404, condition: "special order id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "event id does not exist" }
  - { id: ERR_REGISTRATION_NOT_FOUND, http: 404, condition: "event registration id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that allows this transition" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Operation requires an ACTIVE member but member is SUSPENDED" }
  - { id: ERR_EVENT_CLOSED, http: 409, condition: "Registration attempted on a CLOSED event" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 409, condition: "A build component references a DISCONTINUED product" }
  - { id: ERR_BUILD_NOT_READY, http: 409, condition: "Service order references a build not in SETUP_COMPLETE/COMPLETED" }
  - { id: ERR_RENTAL_NOT_READY, http: 409, condition: "Lesson confirm blocked: a linked rental is not in RESERVED/CHECKED_OUT" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "stock_available < requested qty for a component or part" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "Member already has a REGISTERED registration for the event" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "registration_count already equals capacity" }
  - { id: ERR_RENTAL_TOO_LONG, http: 422, condition: "Rental duration_days exceeds MAX_RENTAL_DAYS (= 14)" }
  - { id: ERR_INSTRUCTOR_UNAVAILABLE, http: 409, condition: "Lesson overlaps an existing lesson for the instructor (half-open)" }
  - { id: ERR_BAY_UNAVAILABLE, http: 409, condition: "Service slot violates the bay SETUP_BUFFER_MINUTES (= 30 minutes) separation" }
  - { id: ERR_UNIT_UNAVAILABLE, http: 409, condition: "Rental overlaps an existing rental on the unit (closed inclusive)" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 402, condition: "member.points_balance < event.entry_points_cost" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_special_order_version does not match SpecialOrder.version (OCC)" }

# ============================================================================
# §1.7 RBAC MATRIX
# ============================================================================
roles:
  - name: ShopManager
    description: "Store manager / owner; full operational authority including catalog, appraisals, events, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /products, PATCH /products/{id}, POST /products/{id}/restock"
      - "POST /instructors, POST /service-bays, POST /rental-units"
      - "POST /members/{id}/suspend, POST /members/{id}/reinstate"
      - "POST /trade-ins/{id}/appraise"
      - "POST /events, POST /events/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all build/service/rental/lesson/trade-in/special-order/registration operations and reads"
  - name: Associate
    description: "Floor staff running builds, service, rentals, trade-ins, special orders, registrations"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /members; build/service/rental lifecycle; POST /lessons; trade-in buyout/list/sell/return; special-order create/quote/deposit/fulfill/cancel; POST /events/{id}/register; all reads"
  - name: Instructor
    description: "Teaches lessons; manages the lifecycle of lessons they are assigned to"
    identity: "entity_backed:Instructor"
    exclusive_operations: []
    shared_operations:
      - "POST /lessons/{id}/confirm, POST /lessons/{id}/complete, POST /lessons/{id}/cancel (for own lessons); all reads"
  - name: Member
    description: "Customer acting on their own account: request special orders, register/cancel events, read own resources"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /special-orders, POST /special-orders/{id}/cancel (own); POST /events/{id}/register (own), POST /event-registrations/{id}/cancel (own); all reads"
