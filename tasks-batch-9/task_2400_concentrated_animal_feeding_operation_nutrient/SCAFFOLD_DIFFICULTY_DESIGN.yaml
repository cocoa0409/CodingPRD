  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_event_depends_on_permit_coverage_state
        grounds:
          - validations[priority=18]
          - errors.ERR_PERMIT_COVERAGE_EXPIRED
          - state_machines.Permit.COVERED_to_EXPIRED
          - endpoints.POST /cafo/application-events
        distinguishing_aspect: |
          The gate lives on a GRANDPARENT entity: an identical application-event payload succeeds while
          the operation's Permit is COVERED and is rejected with ERR_PERMIT_COVERAGE_EXPIRED once the
          logical clock has driven that Permit to EXPIRED, with the plan and budget states untouched in
          both attempts.
