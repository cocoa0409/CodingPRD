            - call: "POST /appraisal-desk/appraisals"
              payload: { loan_file_id: "${lf1_id}", appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", report_form_type: "FORM_1004", effective_date: "2026-07-15T00:00:00Z", reported_value_cents: 48000000, sections_present: ["SUBJECT", "CONTRACT", "NEIGHBORHOOD", "SITE", "IMPROVEMENTS", "SALES_COMPARISON", "RECONCILIATION", "CERTIFICATION"], exhibit_count: 1, narrative_text: "Average condition, typical marketability for the market area.", subject_census_tract_band: "A", expected_loan_file_version: "${lf1_v}" }
