            - { call: "GET /api/foreclosure-cases/${cb_id}", as: CaseManager, captures: { cb_v: $.data.version } }
            - { call: "POST /api/foreclosure-cases/${cb_id}/bidding-instructions", payload: { opening_bid_cents: 42000000, max_bid_cents: 43000000, strategy: "UP_TO_MAX", expected_foreclosure_case_version: "${cb_v}" }, as: Beneficiary, as_user_id: "${ben_id}" }
            - { call: "POST /api/auction-sales/${sale_a}/bidder-registrations", payload: { bidder_name: "Bidder A", bidder_email: "ba@bid.example", deposit_cents: 1000000 }, as: Auctioneer, captures: { reg_a: $.data.id } }
