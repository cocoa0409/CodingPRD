      - name: second_certificate_is_refused_until_the_first_one_is_recert_authorized
        claim_type: violation_to_error
        grounds:
          - validations[priority=39]
          - errors.ERR_DUPLICATE_ACTIVE_CERTIFICATE
          - state_machines.Certificate
          - calculations.certificate_validity_window
        distinguishing_aspect: |
          The one-active-certificate rule is scoped to (candidate, jurisdiction) and carries an explicit
          escape hatch: while the held certificate has recert_authorized_at == null a second issuance is 409
          ERR_DUPLICATE_ACTIVE_CERTIFICATE, but the SAME issuance from the SAME already-FINAL score report
