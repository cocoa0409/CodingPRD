      - name: empty_registration_set_closes_with_zero_fill_and_equity_only_index
        grounds:
          - calculations.distribution_fill_projection
          - calculations.school_impact_index
          - state_machines.DistributionEvent.LOCKED_to_CLOSED
          - entities.DistributionEvent.fields.final_fill_pct
        distinguishing_aspect: |
          Boundary #2 sits on a different metric — an empty collection rather than a
          numeric threshold — and is reached through a different endpoint,
          POST /distribution-events/{id}/transitions: with zero registrations the fill
