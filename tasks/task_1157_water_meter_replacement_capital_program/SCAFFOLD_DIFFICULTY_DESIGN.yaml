  - rule_id: cross_entity_state_dependency
    instances:
      - name: swap_requires_completed_appointment
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_SWAPPED
          - state_machines.Appointment.BOOKED_to_COMPLETED
        distinguishing_aspect: |
          Entity pair WorkOrder -> Appointment: swap is rejected while the work
          order's appointment is still BOOKED, and succeeds after that appointment
          reaches COMPLETED — the valid transition set of the work order depends
          on the appointment's state.
        test_recipe:
          setup:
            - "Work order SCHEDULED with appointment BOOKED (not yet completed)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 5000000, target_meter_count: 2400, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000, notice_days: 3 }, as: ProgramManager, captures: { prog: $.data.id } }
