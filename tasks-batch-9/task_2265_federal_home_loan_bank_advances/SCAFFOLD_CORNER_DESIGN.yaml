            - "an immediate GET /fhlb/stock-subscriptions?member_bank_id={member_id} lists the 50,000 ACTIVITY subscription in status ISSUED"
            - "the immediate GET /fhlb/member-banks/{member_id}/borrowing-capacity returns the same 14,600,000 as the member row, so no read path lags another"

