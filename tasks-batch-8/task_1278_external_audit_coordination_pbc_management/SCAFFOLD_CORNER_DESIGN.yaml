  # ---------------------------------------------------------------------------
  # Section: cross-cutting complexity layers — OCC
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_engagement_version_on_upload_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pbc-upload-stale-engagement]
          - errors[ERR_STALE_ENGAGEMENT_VERSION]
        distinguishing_aspect: "Evidence upload carrying a stale expected_engagement_version returns ERR_STALE_ENGAGEMENT_VERSION with http 412."
        test_recipe:
          setup: ["Engagement E in FIELDWORK; PBCRequest P1 owned by prep1; client captured version BEFORE another mutation advanced it"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 500000, materiality_cents: 50000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/locations"
              payload: { location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/pbc-requests"
              payload: { title: "T", owner_user_id: "prep1", due_date: "2026-11-30" }
              as: ExternalAuditor
              captures: { pbc_id: $.data.id }
            - call: "GET /audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v_snapshot: $.data.version }
            # advance version by uploading to another PBCRequest
            - call: "POST /audit-engagements/${eng_id}/pbc-requests"
              payload: { title: "T2", owner_user_id: "prep1", due_date: "2026-11-30" }
              as: ExternalAuditor
              captures: { pbc2_id: $.data.id }
          trigger:
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/evidence-uploads"
              payload: { file_name: "f.pdf", file_size_bytes: 100, sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", expected_engagement_version: "${eng_v_snapshot} - 1" }
              as: Preparer
              as_user_id: "prep1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_STALE_ENGAGEMENT_VERSION"

      - name: derived_field_reconciliation_total_fee_updates_on_approve
        claim_type: derived_field_reconciliation
        grounds:
          - entities.AuditEngagement.fields.total_fee_cents
          - calculations.engagement_total_fee
        distinguishing_aspect: "Derived total_fee_cents reconciles immediately after each fee-change APPROVE; remains unchanged on REJECT or WITHDRAW."
        test_recipe:
          setup: ["Engagement E in FIELDWORK with base=1000000"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 1000000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/locations"
              payload: { location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests"
              payload: { scope_description: "F1", delta_cents: 100000 }
              as: ExternalAuditor
              captures: { f1: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests"
              payload: { scope_description: "F2", delta_cents: 50000 }
              as: ExternalAuditor
              captures: { f2: $.data.id }
          trigger:
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests/${f1}/resolve"
              payload: { decision: "APPROVE" }
              as: Controller
            - call: "GET /audit-engagements/${eng_id}"
              as: Controller
              captures: { total_after_f1: $.data.total_fee_cents }
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests/${f2}/resolve"
              payload: { decision: "REJECT" }
              as: Controller
            - call: "GET /audit-engagements/${eng_id}"
              as: Controller
              captures: { total_after_f2: $.data.total_fee_cents }
          assert:
            - "total_after_f1 == 1100000 (base + 100000 APPROVED)"
            - "total_after_f2 == 1100000 (REJECTED delta does not change derived field)"
