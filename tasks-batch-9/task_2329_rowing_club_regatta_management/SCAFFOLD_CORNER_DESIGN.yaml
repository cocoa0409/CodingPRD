          setup:
            - "one RECREATIONAL member with logged_session_count 0 and one ISSUED invoice for season 2026, billable_months 12, already trued up once"
            - "the true-up rebills at max(4500 * 0, round_half_up(61500 * 0.40)) + 5000 == 29600, a signed delta of -44400 against the 74000 provisional figure"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Rita Rower", tier: "RECREATIONAL", body_weight_kg: 70.0 }
              as: ClubAdmin
