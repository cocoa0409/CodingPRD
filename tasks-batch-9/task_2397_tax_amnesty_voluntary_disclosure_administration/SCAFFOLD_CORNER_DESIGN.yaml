            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-01-01", period_end_date: "2025-03-31", original_due_date: "2025-10-27", reported_tax_cents: 20000 }
