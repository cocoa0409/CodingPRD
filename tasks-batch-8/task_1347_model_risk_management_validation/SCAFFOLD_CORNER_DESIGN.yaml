          trigger:
            - call: "POST /mrm/regulatory-reports"
              payload: { report_type: "REGULATOR_ANNUAL", period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", aggregation_method: "EXPOSURE_WEIGHTED" }
              as: RegulatoryReporter
              as_user_id: u_rep
              captures: { rep_idx: $.data.inventory_risk_index, rep_total: $.data.total_models }
          assert:
            - "captured ${rep_total} == 2"
