  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: seating_half_open_aggregate_overlap
        grounds:
          - calculations.seating_available
          - entities.SeatingAllocation.fields.start_time
          - errors[ERR_SEATING_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Seating uses half-open [start,end) aggregate-capacity geometry on the FoodHall seating resource: an adjacent request touching at the endpoint (start==prior.end) does NOT overlap and is admitted, while a truly overlapping request that pushes concurrent seats over capacity is rejected."
        test_recipe:
          setup:
            - "Hall capacity 100; one RESERVED allocation of 70 seats over 2026-06-15T10:00Z..12:00Z."
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /seating-allocations"
              payload: { food_hall_id: "${fh}", seats: 70, start_time: "2026-06-15T10:00:00Z", end_time: "2026-06-15T12:00:00Z" }
              as: POSOperator
              captures: { a: $.data.id }
          trigger:
            - call: "POST /seating-allocations"
              payload: { food_hall_id: "${fh}", seats: 90, start_time: "2026-06-15T12:00:00Z", end_time: "2026-06-15T14:00:00Z" }
              as: POSOperator
              captures: { adjacent: $.data.id }
            - call: "POST /seating-allocations"
              payload: { food_hall_id: "${fh}", seats: 90, start_time: "2026-06-15T11:00:00Z", end_time: "2026-06-15T13:00:00Z" }
              as: POSOperator
              captures: { err: $.data.error_id }
          assert:
            - "adjacent 90-seat request [12:00,14:00) -> 201 (touching 70-seat block at 12:00 is not overlap under half-open)"
            - "overlapping 90-seat request [11:00,13:00) -> ERR_SEATING_CAPACITY_EXCEEDED (70+90==160 concurrent)"

      - name: event_buffer_dilated_overlap
        grounds:
          - calculations.event_buffer_conflict
          - state_machines.MarketingEvent.PLANNED_to_SCHEDULED
          - errors[ERR_EVENT_TIME_CONFLICT]
        distinguishing_aspect: "MarketingEvent uses closed intervals dilated by a 60-minute buffer on the common-area resource: a second event only 30 min after a SCHEDULED one conflicts, but one exactly 60 min after is admitted - buffer-gap geometry, distinct from seating's aggregate half-open overlap."
        test_recipe:
          setup:
            - "Hall event_buffer_minutes 60; event E1 SCHEDULED 2026-07-01T09:00Z..12:00Z."
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320, event_buffer_minutes: 60 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /marketing-events"
              payload: { food_hall_id: "${fh}", name: "E1", start_time: "2026-07-01T09:00:00Z", end_time: "2026-07-01T12:00:00Z", reserved_capacity: 100, expected_footfall: 300 }
              as: HallManager
              captures: { e1: $.data.id }
            - call: "POST /marketing-events/${e1}/schedule"
              payload: {}
              as: HallManager
            - call: "POST /marketing-events"
              payload: { food_hall_id: "${fh}", name: "E2", start_time: "2026-07-01T12:30:00Z", end_time: "2026-07-01T14:00:00Z", reserved_capacity: 100, expected_footfall: 200 }
              as: HallManager
              captures: { e2: $.data.id }
            - call: "POST /marketing-events"
              payload: { food_hall_id: "${fh}", name: "E3", start_time: "2026-07-01T13:00:00Z", end_time: "2026-07-01T15:00:00Z", reserved_capacity: 100, expected_footfall: 200 }
              as: HallManager
              captures: { e3: $.data.id }
          trigger:
            - call: "POST /marketing-events/${e2}/schedule"
              payload: {}
              as: HallManager
              captures: { err: $.data.error_id }
            - call: "POST /marketing-events/${e3}/schedule"
              payload: {}
              as: HallManager
              captures: { e3_status: $.data.status }
          assert:
            - "scheduling E2 (gap 30 min < 60) -> ERR_EVENT_TIME_CONFLICT"
            - "scheduling E3 (gap exactly 60 min) -> 200 with status SCHEDULED"

