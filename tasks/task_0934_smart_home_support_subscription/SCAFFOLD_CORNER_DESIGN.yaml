  # =======================================================================
  - section: state_machines
    instances:
      - name: reclaim_on_an_active_device_is_rejected_as_not_eligible
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Device.lifecycle.RECLAIMABLE_to_CLAIMED
          - validations[priority=33]
          - errors[ERR_RECLAIM_NOT_ELIGIBLE]
        distinguishing_aspect: "Reclaim is only defined from RECLAIMABLE; calling it on an ACTIVE device returns ERR_RECLAIM_NOT_ELIGIBLE (409) and leaves activation_token null."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z, a PRO plan, a household with an OWNER and an ACTIVE subscription, and one HUB device claimed AND activated so lifecycle_status is ACTIVE."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 2, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /smart-home-support/households"
              payload: { name: "Rec2 House", region_code: "NWA", billing_email: "rec2@example.com" }
              as: PlatformAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Rec O", email: "reco@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: "$.data.id" }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${plan_id}", allow_overage: false }
              as: PlatformAdmin
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "HUB-X1", display_name: "Hub X1", device_class: "HUB", serial_prefix: "HBX", base_warranty_months: 24, requires_install: true, manufacturer_service_only: false, msrp_cents: 24900, current_firmware_version: "1.0.0" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_id}", serial_number: "HBX000001", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { d_id: "$.data.id", tok: "$.data.activation_token" }
            - call: "POST /smart-home-support/devices/${d_id}/activate"
              payload: { activation_code: "${tok}" }
              as: Owner
              as_user_id: "${own_id}"
          trigger:
            - call: "POST /smart-home-support/devices/${d_id}/reclaim"
              payload: {}
              as: SupportAgent
              as_user_id: "agent-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_RECLAIM_NOT_ELIGIBLE"
            - "Device.${d_id}.lifecycle_status == ACTIVE"
            - "Device.${d_id}.activation_token == null"

      - name: closed_ticket_is_locked_down_and_reports_the_ticket_closed_gate
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Ticket.workflow.RESOLVED_to_CLOSED
          - gate_precedence[3]
          - validations[priority=25]
          - errors[ERR_TICKET_CLOSED]
        distinguishing_aspect: "Once a ticket is CLOSED, gate 3 fires at priority 25 for every ticket-scoped mutation, so a customer reply returns ERR_TICKET_CLOSED (409) rather than ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z, a PRO plan with 24x7 coverage, a household with an OWNER and an ACTIVE subscription."
            - "One P2 ticket first-responded at 00:10, moved into REMOTE_DIAG by one session, resolved by a RESOLVED verdict at 00:20 and then CLOSED."
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 2, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /smart-home-support/households"
              payload: { name: "Closed House", region_code: "NWA", billing_email: "clo@example.com" }
              as: PlatformAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Clo O", email: "cloo@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: "$.data.id" }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${plan_id}", allow_overage: false }
              as: PlatformAdmin
            - call: "POST /smart-home-support/tickets"
              payload: { household_id: "${h_id}", severity: "P2", summary: "Chime not sounding", opened_by_member_id: "${own_id}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:10:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/tickets/${t_id}/first-response"
              payload: { note: "Triaged." }
              as: SupportAgent
              as_user_id: "agent-1"
            - call: "POST /smart-home-support/tickets/${t_id}/remote-sessions"
              payload: {}
              as: SupportAgent
              as_user_id: "agent-1"
              captures: { s_id: "$.data.id" }
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:20:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/remote-sessions/${s_id}/complete"
              payload: { outcome: "RESOLVED", diagnostic_notes: "Re-paired the chime." }
