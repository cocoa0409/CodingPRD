          - state_machines.EquipmentIssuance.ISSUED_to_LOST_WRITTEN_OFF
        distinguishing_aspect: |
          Dual-variant instance #2 lives in a different entity domain - EQUIPMENT FISCAL SETTLEMENT
          on EquipmentIssuance, not trainee competency: two kits issued on the same instant and lost on
          the same instant settle at 17435 cents (DEPRECIATED_WRITEOFF, credential ACTIVE) and 8300 cents
