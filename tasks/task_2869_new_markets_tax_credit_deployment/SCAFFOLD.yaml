# =============================================================================
# PRD Benchmark Scaffold — New Markets Tax Credit (NMTC) Deployment
# Community Development Entity (CDE) allocation deployment, compliance and unwind
# =============================================================================

scenario: |
  New Markets Tax Credit Deployment (community development entity): allocation
  award receipt with commitment on service area, targeted distress criteria and
  community outcomes, qualified active low-income community business
  identification and eligibility testing, transaction structuring with leverage
  loan, investment fund and sub-allocation to the project, substantially-all
  requirement monitoring and reinvestment of returned capital, community
  benefits agreement with job quality, hiring and reporting commitments,
  seven-year compliance period monitoring with recapture triggers, annual
  reporting to the certifying agency on deployment and impact, unwind at the end
  of the compliance period with put/call exercise.

domain_name: "new-markets-tax-credit-deployment"
api_prefix: "/nmtc"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # QLICI is a junction entity between QEI and QALICB (many-to-many): one QEI
  # funds many QALICBs, one QALICB may be funded by QEIs from several awards.
  # CensusTract carries a self-referential edge (contiguous_lic_tract_id), so
  # QALICB location eligibility is a two-hop graph question, not a tree lookup.

  state_machine_shape: parallel
  # QEI carries two independent state dimensions on the same row:
  #   deployment_status (cash placement) x compliance_status (testing outcome).
  # QALICB.eligibility_status is cyclic (CERTIFIED -> RECERTIFICATION_DUE ->
  # CERTIFIED, FAILED -> CERTIFIED); UnwindTransaction is a branching fork-join
  # (OPTION_WINDOW_OPEN -> {PUT_EXERCISED, CALL_EXERCISED} -> SETTLED).

  relationship_patterns:
    - one_to_many          # CDE -> AllocationAward -> QEI
    - many_to_many         # QEI <-> QALICB via QLICI
    - self_referential     # CensusTract.contiguous_lic_tract_id -> CensusTract.id
    - cross_aggregate      # CommunityBenefitsAgreement spans QALICB and AllocationAward

  role_model: segregation_of_duties
  # The party that places capital (CDESponsor) can never be the party that
  # measures compliance (ComplianceReviewer); additionally the reviewer user who
  # certified a QALICB's eligibility may not run the annual test of a QEI that
  # funds that QALICB.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# Global conventions that every table below depends on
# -----------------------------------------------------------------------------
global_conventions:
  logical_clock: |
    All server-stamped business instants (QEI.issued_at, QLICI.deployed_at,
    EligibilityTest.performed_at, ReinvestmentObligation.arose_at,
    CommunityBenefitsAgreement.agreement_start_at, UnwindTransaction.exercised_at,
    AnnualComplianceTest.performed_at) are read from the logical clock, never
    from real wall-clock time. The clock starts at exactly
    2026-08-01T00:00:00.000Z and only POST /_clock/set_current_utc moves it.
  year_length: |
    A "year" anywhere in this scaffold means exactly 365 days (31,536,000
    seconds). Leap days are NOT counted, so compliance-year windows drift
    relative to calendar anniversaries. This is intentional and MUST be
    implemented literally: compliance year n of a QEI spans the half-open
    interval [issued_at + 365*(n-1) days, issued_at + 365*n days).
  money: "All monetary fields are integer cents. No floats anywhere in money math."
  rounding: |
    Unless a calculation says otherwise: percentages round to 2 decimal places
    round_half_up; cent amounts round to whole cents round_half_up.
  timestamps: "ISO 8601 UTC with exactly three fractional digits, e.g. 2026-09-01T00:00:00.000Z."

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: CDE
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the community development entity"
        constraints: "1..120 chars"
      - name: certification_number
        type: string
        source: input
        description: "Certification number issued by the certifying agency"
        constraints: "unique across all CDE rows; 1..40 chars"
      - name: service_area_scope
        type: enum
        source: input
        description: "Geographic scope the CDE is certified to serve"
        constraints: "one of NATIONAL, MULTI_STATE, STATEWIDE, LOCAL"
      - name: certification_status
        type: enum
        source: system
        description: "Certification standing with the certifying agency"
        default: CERTIFIED
        constraints: "one of CERTIFIED, DECERTIFIED"
      - name: decertified_at
        type: datetime
        source: system
        description: "Logical-clock instant at which decertification was recorded; null while CERTIFIED"
        default: null
      - name: decertification_reason
        type: string
        source: system
        description: "Reason text copied from the decertification request; null while CERTIFIED"
        default: null
      - name: award_count
        type: integer
        source: computed
        description: "Count of AllocationAward rows whose cde_id equals this CDE id, any lifecycle_status"
        default: 0

  - name: AllocationAward
    parent: CDE
    common_fields: true
    entity_kind: resource
    fields:
      - name: cde_id
        type: string
        source: input
        description: "FK -> CDE.id; the allocatee CDE that received this allocation authority"
      - name: award_year
        type: integer
        source: input
        description: "Allocation round year"
        constraints: "2020..2035; (cde_id, award_year) must be unique"
      - name: allocation_amount_cents
        type: integer
        source: input
        description: "Total allocation authority awarded, in cents"
        constraints: ">= 100000000 (i.e. at least $1,000,000)"
      - name: remaining_authority_cents
        type: integer
        source: computed
        description: "Unissued allocation authority; see calculations.allocation_authority_ledger"
      - name: service_area_state_codes
        type: array
        source: input
        description: "Two-letter state codes the award commits the CDE to serve"
        constraints: "1..10 entries, each exactly 2 uppercase letters, no duplicates"
      - name: min_severe_distress_share_pct
        type: number
        source: input
        description: "Commitment: minimum share of deployed QLICI principal that must sit in SEVERE distress tracts"
        constraints: "0.00..100.00, 2 decimals"
      - name: substantially_all_method
        type: enum
        source: input
        description: "Which substantially-all variant governs this award's annual compliance tests"
        constraints: "one of DIRECT_TRACING, AGGREGATE_BALANCE"
      - name: lifecycle_status
        type: enum
        source: system
        description: "Award lifecycle dimension (independent of compliance_posture)"
        default: ANNOUNCED
        constraints: "one of ANNOUNCED, ACTIVE, COMPLIANCE_PERIOD_CLOSED, TERMINATED"
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived gating dimension recomputed by calculations.award_compliance_posture"
        default: UNRESTRICTED
        constraints: "one of UNRESTRICTED, RESTRICTED, FROZEN"
      - name: allocation_agreement_signed_at
        type: datetime
        source: system
        description: "Logical-clock instant the allocation agreement was signed; null while ANNOUNCED"
        default: null
      - name: signatory_name
        type: string
        source: system
        description: "Name recorded on the signed allocation agreement; null while ANNOUNCED"
        default: null
      - name: issued_qei_count
        type: integer
        source: computed
        description: "Count of QEI rows on this award whose deployment_status != VOIDED"
        default: 0
      - name: at_risk_qei_count
        type: integer
        source: computed
        description: "Count of QEI rows on this award whose compliance_status == AT_RISK"
        default: 0
      - name: recaptured_qei_count
        type: integer
        source: computed
        description: "Count of QEI rows on this award whose compliance_status == RECAPTURED"
        default: 0
      - name: severe_distress_share_pct
        type: number
        source: computed
        description: "Derived share of deployed principal in SEVERE tracts; see calculations.award_severe_distress_share"
        default: 0.00
      - name: cba_breach_count
        type: integer
        source: computed
        description: "Count of CommunityBenefitsAgreement rows on this award whose status == BREACHED"
        default: 0
      - name: last_agency_report_year
        type: integer
        source: system
        description: "Highest report_year successfully submitted to the certifying agency; null before the first submission"
        default: null

  - name: CensusTract
    parent: null
    common_fields: false
    entity_kind: configuration
    fields:
      - name: tract_code
        type: string
        source: input
        description: "Census tract identifier"
        constraints: "unique across all CensusTract rows; exactly 11 digits"
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code the tract sits in"
        constraints: "exactly 2 uppercase letters"
      - name: poverty_rate_pct
        type: number
        source: input
        description: "Tract poverty rate as a percentage"
        constraints: "0.00..100.00, 2 decimals"
      - name: mfi_ratio_pct
        type: number
        source: input
        description: "Tract median family income as a percentage of the applicable area median family income"
        constraints: "0.00..300.00, 2 decimals"
      - name: unemployment_ratio
        type: number
        source: input
        description: "Tract unemployment rate divided by the national average rate"
        constraints: "0.00..10.00, 2 decimals"
      - name: contiguous_lic_tract_id
        type: string
        source: input
        description: "FK -> CensusTract.id; optional self-referential edge naming an adjoining tract that is itself a low-income community"
        default: null
      - name: is_low_income_community
        type: boolean
        source: computed
        description: "True when the tract qualifies as a low-income community on its own statistics"
      - name: qualifies_by_contiguity
        type: boolean
        source: computed
        description: "True when the tract is not itself a low-income community but qualifies through its contiguous tract"
      - name: eligible_for_qlici
        type: boolean
        source: computed
        description: "True when a QALICB principally located in this tract may receive a QLICI"
      - name: severe_criteria_met_count
        type: integer
        source: computed
        description: "How many of the three targeted-distress criteria the tract meets (0..3)"
      - name: distress_score
        type: number
        source: computed
        description: "Weighted distress score 0.00..100.00; see calculations.tract_distress_profile"
      - name: distress_tier
        type: enum
        source: computed
        description: "Distress tier derived from severe_criteria_met_count and distress_score"
        constraints: "one of SEVERE, HIGH, MODERATE, INELIGIBLE"

  - name: QALICB
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: census_tract_id
        type: string
        source: input
        description: "FK -> CensusTract.id; principal place of business of the qualified business"
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the qualified active low-income community business"
        constraints: "1..120 chars"
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code of the QALICB's principal place of business"
        constraints: "exactly 2 uppercase letters"
      - name: naics_code
        type: string
        source: input
        description: "Six-digit industry classification code"
        constraints: "exactly 6 digits"
      - name: sponsor_user_id
        type: string
        source: system
        description: "Opaque operator identifier of the QALICBSponsor authorised to act for this business; stamped from the creating request's X-User-ID header, never taken from the body"
        constraints: "1..64 chars"
      - name: eligibility_status
        type: enum
        source: system
        description: "Cyclic eligibility lifecycle driven by EligibilityTest results and annual-test recertification sweeps"
        default: PENDING
        constraints: "one of PENDING, CERTIFIED, RECERTIFICATION_DUE, FAILED, DISQUALIFIED"
      - name: last_certified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent PASS result; null until first PASS"
        default: null
      - name: latest_test_result
        type: enum
        source: system
        description: "Result of the most recent EligibilityTest; null until the first test"
        default: null
        constraints: "one of PASS, FAIL"
      - name: consecutive_failed_test_count
        type: integer
        source: computed
        description: "Number of consecutive FAIL results since the last PASS; reset to 0 on any PASS"
        default: 0
      - name: funding_qlici_count
        type: integer
        source: computed
        description: "Count of QLICI rows on this QALICB whose status != REPAID"
        default: 0

  - name: EligibilityTest
    parent: QALICB
    common_fields: false
    entity_kind: event
    fields:
      - name: qalicb_id
        type: string
        source: input
        description: "FK -> QALICB.id; the business under test (supplied in the path)"
      - name: performed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceReviewer that ran the test; used by the segregation-of-duties check"
      - name: performed_at
        type: datetime
        source: system
        description: "Logical-clock instant the test was run"
      - name: gross_income_lic_pct
        type: number
        source: input
        description: "Percentage of the business gross income derived from the active conduct of business in low-income communities"
        constraints: "0.00..100.00, 2 decimals"
      - name: services_lic_pct
        type: number
        source: input
        description: "Percentage of services performed by employees inside low-income communities"
        constraints: "0.00..100.00, 2 decimals"
      - name: tangible_property_lic_pct
        type: number
        source: input
        description: "Percentage of tangible property located inside low-income communities"
        constraints: "0.00..100.00, 2 decimals"
      - name: collectibles_pct
        type: number
        source: input
        description: "Percentage of assets held as collectibles other than inventory"
        constraints: "0.00..100.00, 2 decimals"
      - name: nonqualified_financial_property_pct
        type: number
        source: input
        description: "Percentage of assets held as nonqualified financial property"
        constraints: "0.00..100.00, 2 decimals"
      - name: location_prong_passed
        type: boolean
        source: computed
        description: "Mirror of CensusTract.eligible_for_qlici for the QALICB's tract at the instant of the test"
      - name: result
        type: enum
        source: computed
        description: "PASS only when all six prongs pass; see calculations.qalicb_eligibility_evaluation"
        constraints: "one of PASS, FAIL"
      - name: failed_prongs
        type: array
        source: computed
        description: "Names of failing prongs in the fixed order LOCATION, GROSS_INCOME, SERVICES, TANGIBLE_PROPERTY, COLLECTIBLES, NQFP; empty array on PASS"

  - name: InvestmentFund
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the single-purpose investment fund"
        constraints: "1..120 chars"
      - name: investor_user_id
        type: string
        source: system
        description: "X-User-ID of the TaxCreditInvestor that created the fund; every later TaxCreditInvestor ownership check compares against this value"
      - name: equity_contribution_cents
        type: integer
        source: input
        description: "Tax credit investor equity the fund commits to contribute, in cents"
        constraints: ">= 0"
      - name: leverage_lender_name
        type: string
        source: input
        description: "Name of the leverage lender"
        constraints: "1..120 chars"
      - name: leverage_loan_principal_cents
        type: integer
        source: input
        description: "Committed leverage loan principal, in cents"
        constraints: ">= 0"
      - name: leverage_loan_rate_bps
        type: integer
        source: input
        description: "Leverage loan interest rate in basis points"
        constraints: "0..5000"
      - name: equity_received_cents
        type: integer
        source: system
        description: "Equity actually received at closing"
        default: 0
      - name: leverage_received_cents
        type: integer
        source: system
        description: "Leverage loan proceeds actually received at closing"
        default: 0
      - name: leverage_loan_outstanding_cents
        type: integer
        source: computed
        description: "Equals leverage_received_cents while status IN {FUNDED, QEI_MADE}; set to 0 when status becomes WOUND_UP"
        default: 0
      - name: capital_available_cents
        type: integer
        source: computed
        description: "equity_received_cents + leverage_received_cents - deployed_to_qei_cents"
        default: 0
      - name: deployed_to_qei_cents
        type: integer
        source: computed
        description: "Sum of qei_amount_cents over QEI rows on this fund whose deployment_status != VOIDED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Fund lifecycle"
        default: FORMED
        constraints: "one of FORMED, FUNDED, QEI_MADE, WOUND_UP"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of financial closing; null while FORMED"
        default: null

  - name: QEI
    parent: AllocationAward
    common_fields: true
    entity_kind: resource
    fields:
      - name: allocation_award_id
        type: string
        source: input
        description: "FK -> AllocationAward.id; the award whose authority this qualified equity investment consumes"
      - name: investment_fund_id
        type: string
        source: input
        description: "FK -> InvestmentFund.id; the fund that made the investment"
      - name: qei_amount_cents
        type: integer
        source: input
        description: "Qualified equity investment amount, in cents"
        constraints: ">= 10000000 (i.e. at least $100,000)"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the QEI was issued; anchors every compliance-year window"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CDESponsor that issued the QEI"
      - name: reserve_bps
        type: integer
        source: computed
        description: "Permitted reserve/fee rate selected from the gross qei_amount_cents tier; see calculations.qei_reserve_and_net_deployable"
      - name: permitted_fees_cents
        type: integer
        source: computed
        description: "Cents held back for permitted reserves and fees; never deployable into QLICIs"
      - name: net_deployable_cents
        type: integer
        source: computed
        description: "qei_amount_cents - permitted_fees_cents; the initial uninvested cash balance"
      - name: uninvested_cash_cents
        type: integer
        source: computed
        description: "Cash inside the QEI not currently placed in a QLICI; see calculations.qei_capital_ledger"
      - name: deployment_deadline_at
        type: datetime
        source: computed
        description: "issued_at + 365 days; the last instant at which a QLICI may be deployed from this QEI"
      - name: deployment_status
        type: enum
        source: system
        description: "Cash-placement state dimension; evolves independently of compliance_status"
        default: ISSUED
        constraints: "one of ISSUED, DEPLOYING, FULLY_DEPLOYED, REINVESTMENT_PENDING, VOIDED, UNWOUND"
      - name: compliance_status
        type: enum
        source: system
        description: "Testing-outcome state dimension; evolves independently of deployment_status"
        default: COMPLIANT
        constraints: "one of COMPLIANT, AT_RISK, RECAPTURED, RELEASED"
      - name: substantially_all_pct_direct
        type: number
        source: computed
        description: "Most recently computed direct-tracing substantially-all percentage"
        default: 0.00
      - name: substantially_all_pct_aggregate
        type: number
        source: computed
        description: "Most recently computed aggregate-balance substantially-all percentage; only written by annual tests"
        default: 0.00
      - name: compliance_years_completed
        type: integer
        source: computed
        description: "Number of AnnualComplianceTest rows recorded against this QEI, PASS or FAIL"
        default: 0
      - name: cure_deadline_at
        type: datetime
        source: system
        description: "Last instant a substantially-all shortfall may be cured; set when compliance_status becomes AT_RISK, cleared to null on cure"
        default: null
      - name: accrued_unpaid_fee_cents
        type: integer
        source: computed
        description: "Cumulative CDE asset-management fee allocated across annual tests and not yet paid"
        default: 0
      - name: recapture_trigger_type
        type: enum
        source: system
        description: "Which recapture trigger fired, if any"
        default: NONE
        constraints: "one of NONE, SUBSTANTIALLY_ALL_FAILURE, CDE_DECERTIFICATION, REINVESTMENT_BREACH"
      - name: recapture_exposure_cents
        type: integer
        source: computed
        description: "Credit subject to recapture plus interest; see calculations.recapture_exposure"
        default: 0
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock instant the QEI was voided; null unless deployment_status == VOIDED"
        default: null

  - name: QLICI
    parent: QEI
    common_fields: true
    entity_kind: resource
    fields:
      - name: qei_id
        type: string
        source: input
        description: "FK -> QEI.id; the qualified equity investment funding this sub-allocation"
      - name: qalicb_id
        type: string
        source: input
        description: "FK -> QALICB.id; the project company receiving the sub-allocation"
      - name: loan_class
        type: enum
        source: input
        description: "Sub-allocation tranche: A is the leveraged senior note, B is the equity-equivalent note"
        constraints: "one of A, B"
      - name: principal_cents
        type: integer
        source: input
        description: "Original principal placed, in cents"
        constraints: ">= 100000"
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: "principal_cents - total_repaid_cents"
      - name: total_repaid_cents
        type: integer
        source: computed
        description: "Cumulative principal returned across all repayments on this QLICI"
        default: 0
      - name: deployed_at
        type: datetime
        source: system
        description: "Logical-clock instant the sub-allocation was placed; used by the aggregate-balance day weighting"
      - name: status
        type: enum
        source: system
        description: "Sub-allocation state; NON_QUALIFYING principal is excluded from every substantially-all numerator"
        default: DEPLOYED
        constraints: "one of DEPLOYED, PARTIALLY_REPAID, REPAID, NON_QUALIFYING"
      - name: non_qualifying_since_at
        type: datetime
        source: system
        description: "Logical-clock instant the QLICI became NON_QUALIFYING; null otherwise"
        default: null
      - name: allocated_fee_cents
        type: integer
        source: computed
        description: "Cumulative CDE asset-management fee allocated to this QLICI across annual tests"
        default: 0
      - name: created_by_cure
        type: boolean
        source: system
        description: "True when this QLICI was created by POST /nmtc/qeis/{id}/cures rather than by POST /nmtc/qlicis"
        default: false

  - name: ReinvestmentObligation
    parent: QEI
    common_fields: true
    entity_kind: resource
    fields:
      - name: qei_id
        type: string
        source: input
        description: "FK -> QEI.id; the QEI whose returned capital must be redeployed"
      - name: source_qlici_id
        type: string
        source: input
        description: "FK -> QLICI.id; the sub-allocation whose principal repayment created this obligation"
      - name: amount_cents
        type: integer
        source: system
        description: "Principal returned by the triggering repayment, in cents"
      - name: reinvested_cents
        type: integer
        source: computed
        description: "Cumulative amount redeployed against this obligation"
        default: 0
      - name: arose_at
        type: datetime
        source: system
        description: "Logical-clock instant of the triggering repayment"
      - name: reinvest_by_at
        type: datetime
        source: computed
        description: "arose_at + 365 days; the last instant a reinvestment may be recorded"
      - name: status
        type: enum
        source: system
        description: "OPEN until fully redeployed, SATISFIED when reinvested_cents == amount_cents, BREACHED when an annual test observes it open past reinvest_by_at"
        default: OPEN
        constraints: "one of OPEN, SATISFIED, BREACHED"
      - name: satisfied_at
        type: datetime
        source: system
        description: "Logical-clock instant the obligation became SATISFIED; null otherwise"
        default: null
      - name: breached_at
        type: datetime
        source: system
        description: "Logical-clock instant the obligation became BREACHED; null otherwise"
        default: null

  - name: AnnualComplianceTest
    parent: QEI
    common_fields: false
    entity_kind: event
    fields:
      - name: qei_id
        type: string
        source: input
        description: "FK -> QEI.id; the QEI under test (supplied in the path)"
      - name: compliance_year
        type: integer
        source: input
        description: "Which compliance year is being measured"
        constraints: "1..7"
      - name: window_start_at
        type: datetime
        source: computed
        description: "qei.issued_at + 365*(compliance_year-1) days; inclusive lower bound"
      - name: window_end_at
        type: datetime
        source: computed
        description: "qei.issued_at + 365*compliance_year days; exclusive upper bound"
      - name: window_days
        type: integer
        source: computed
        description: "Always 365 under the fixed-year convention"
      - name: measured_pct_direct
        type: number
        source: computed
        description: "Direct-tracing substantially-all percentage for this window"
      - name: measured_pct_aggregate
        type: number
        source: computed
        description: "Aggregate-balance substantially-all percentage for this window"
      - name: governing_method
        type: enum
        source: computed
        description: "Copied from the award's substantially_all_method at test time"
        constraints: "one of DIRECT_TRACING, AGGREGATE_BALANCE"
      - name: governing_pct
        type: number
        source: computed
        description: "measured_pct_direct when governing_method == DIRECT_TRACING, else measured_pct_aggregate"
      - name: result
        type: enum
        source: computed
        description: "PASS when governing_pct >= 85.00 and breached_obligation_count == 0, else FAIL"
        constraints: "one of PASS, FAIL"
      - name: breached_obligation_count
        type: integer
        source: computed
        description: "ReinvestmentObligation rows on this QEI flipped to BREACHED by this test run"
      - name: fee_allocation_total_cents
        type: integer
        source: computed
        description: "CDE asset-management fee allocated by this test run; see calculations.cde_asset_management_fee_allocation"
      - name: recapture_triggered
        type: boolean
        source: computed
        description: "True when this test moved the QEI's compliance_status to RECAPTURED"
      - name: recertification_swept_qalicb_count
        type: integer
        source: computed
        description: "How many QALICBs this test run moved from CERTIFIED to RECERTIFICATION_DUE"
      - name: performed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceReviewer that ran the test"
      - name: performed_at
        type: datetime
        source: system
        description: "Logical-clock instant the test was run"

  - name: CommunityBenefitsAgreement
    parent: QALICB
    common_fields: true
    entity_kind: resource
    fields:
      - name: qalicb_id
        type: string
        source: input
        description: "FK -> QALICB.id; the business bound by the job quality and hiring commitments"
      - name: allocation_award_id
        type: string
        source: input
        description: "FK -> AllocationAward.id; the award under whose community-outcome commitments this agreement sits"
      - name: target_fte_count
        type: integer
        source: input
        description: "Committed number of qualifying full-time-equivalent jobs per certification year"
        constraints: ">= 1"
      - name: wage_floor_cents_per_hour
        type: integer
        source: input
        description: "Minimum average hourly wage in cents for a JobReport to count toward the commitment"
        constraints: ">= 0"
      - name: local_hire_pct_target
        type: number
        source: input
        description: "Committed minimum share of headcount hired from the service area"
        constraints: "0.00..100.00, 2 decimals"
      - name: measurement_basis
        type: enum
        source: input
        description: "Which job-quality variant governs this agreement's annual certifications"
        constraints: "one of HEADCOUNT, PAYROLL_HOURS"
      - name: agreement_start_at
        type: datetime
        source: system
        description: "Logical-clock instant the agreement was executed; anchors every certification-year window"
      - name: status
        type: enum
        source: system
        description: "Cyclic agreement state: ACTIVE <-> CURE_REQUIRED, terminal BREACHED or CLOSED"
        default: ACTIVE
        constraints: "one of ACTIVE, CURE_REQUIRED, BREACHED, CLOSED"
      - name: consecutive_cure_required_count
        type: integer
        source: computed
        description: "Number of consecutive certification years classified CURE_REQUIRED; reset to 0 on a CERTIFIED year"
        default: 0
      - name: last_certified_year
        type: integer
        source: system
        description: "Highest certification_year already certified; null before the first certification"
        default: null
      - name: latest_compliance_pct
        type: number
        source: computed
        description: "Governing job-quality compliance percentage from the most recent certification"
        default: 0.00
      - name: latest_local_hire_pct
        type: number
        source: computed
        description: "Local-hire percentage from the most recent certification"
        default: 0.00
      - name: breached_at
        type: datetime
        source: system
        description: "Logical-clock instant the agreement became BREACHED; null otherwise"
        default: null

  - name: JobReport
    parent: CommunityBenefitsAgreement
    common_fields: false
    entity_kind: event
    fields:
      - name: community_benefits_agreement_id
        type: string
        source: input
        description: "FK -> CommunityBenefitsAgreement.id; the agreement this report is filed under (supplied in the path)"
      - name: period_start_at
        type: datetime
        source: input
        description: "Inclusive start of the reporting period"
      - name: period_end_at
        type: datetime
        source: input
        description: "Inclusive end of the reporting period; must be strictly after period_start_at"
      - name: headcount
        type: integer
        source: input
        description: "Total employees on payroll during the period"
        constraints: ">= 0"
      - name: qualifying_headcount
        type: integer
        source: input
        description: "Employees meeting the agreement's job-quality definition"
        constraints: ">= 0 and <= headcount"
      - name: total_hours
        type: integer
        source: input
        description: "Total payroll hours in the period"
        constraints: ">= 0"
      - name: qualifying_hours
        type: integer
        source: input
        description: "Payroll hours attributable to qualifying employees"
        constraints: ">= 0 and <= total_hours"
      - name: local_hires
        type: integer
        source: input
        description: "Employees hired from the service area"
        constraints: ">= 0 and <= headcount"
      - name: avg_hourly_wage_cents
        type: integer
        source: input
        description: "Average hourly wage across the period, in cents"
        constraints: ">= 0"
      - name: wage_floor_met
        type: boolean
        source: computed
        description: "avg_hourly_wage_cents >= cba.wage_floor_cents_per_hour evaluated at filing time"
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QALICBSponsor that filed the report"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the report was filed"

  - name: UnwindTransaction
    parent: QEI
    common_fields: true
    entity_kind: resource
    fields:
      - name: qei_id
        type: string
        source: input
        description: "FK -> QEI.id; the QEI being unwound at the end of its compliance period"
      - name: call_holder_user_id
        type: string
        source: input
        description: "Opaque QALICBSponsor identifier holding the call option"
        constraints: "1..64 chars"
      - name: put_holder_user_id
        type: string
        source: computed
        description: "Copied from the QEI's InvestmentFund.investor_user_id at creation; the only identity allowed to exercise the put"
      - name: option_window_open_at
        type: datetime
        source: computed
        description: "qei.issued_at + 2555 days (365*7); first instant an option may be exercised"
      - name: option_window_close_at
        type: datetime
        source: computed
        description: "option_window_open_at + 90 days; exclusive upper bound of the exercise window"
      - name: fund_residual_value_cents
        type: integer
        source: computed
        description: "Residual fund value at creation; see calculations.unwind_option_pricing"
      - name: put_price_cents
        type: integer
        source: computed
        description: "Nominal put price fixed at creation"
      - name: call_price_cents
        type: integer
        source: computed
        description: "Fair-market call price fixed at creation"
      - name: exercised_option_type
        type: enum
        source: system
        description: "Which option was exercised; null while OPTION_WINDOW_OPEN"
        default: null
        constraints: "one of PUT, CALL"
      - name: exercised_at
        type: datetime
        source: system
        description: "Logical-clock instant of exercise; null while OPTION_WINDOW_OPEN"
        default: null
      - name: settlement_amount_cents
        type: integer
        source: computed
        description: "put_price_cents when exercised_option_type == PUT, call_price_cents when CALL; 0 before exercise"
        default: 0
      - name: settlement_reference
        type: string
        source: system
        description: "Reference recorded at settlement; null until SETTLED"
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant of settlement; null until SETTLED"
        default: null
      - name: status
        type: enum
        source: system
        description: "Branching fork-join: OPTION_WINDOW_OPEN -> {PUT_EXERCISED, CALL_EXERCISED} -> SETTLED, or -> EXPIRED"
        default: OPTION_WINDOW_OPEN
        constraints: "one of OPTION_WINDOW_OPEN, PUT_EXERCISED, CALL_EXERCISED, SETTLED, EXPIRED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: CDE
    state_field: certification_status
    initial_state: CERTIFIED
    terminal_states: [DECERTIFIED]
    transitions:
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "POST /nmtc/cdes/{id}/decertification"
        actor: CertifyingAgency
        preconditions:
          - "cde.certification_status == CERTIFIED"
        side_effects:
          - "sets cde.decertified_at = logical clock and cde.decertification_reason = request reason"
          - "CASCADE HOP 1: every AllocationAward whose cde_id == cde.id and whose lifecycle_status IN {ANNOUNCED, ACTIVE} has compliance_posture recomputed by calculations.award_compliance_posture, which returns FROZEN because cde.certification_status != CERTIFIED"
          - "CASCADE HOP 2: because each such award became FROZEN, every QEI on that award whose compliance_status == COMPLIANT or AT_RISK moves to RECAPTURED with recapture_trigger_type = CDE_DECERTIFICATION and recapture_exposure_cents set by calculations.recapture_exposure"
          - "CASCADE HOP 3: because those QEIs became RECAPTURED, each award's recaptured_qei_count and at_risk_qei_count are recomputed (at_risk_qei_count drops as AT_RISK rows leave that state)"
          - "increments cde.version by 1 and each touched AllocationAward.version and QEI.version by 1"
        note: "Recapture trigger 1 of 3: the entity ceases to be a qualified CDE. Awards already COMPLIANCE_PERIOD_CLOSED or TERMINATED are skipped, and QEIs already RECAPTURED, RELEASED, VOIDED or UNWOUND are skipped (conditional cascade)."

  - entity: AllocationAward
    state_field: lifecycle_status
    initial_state: ANNOUNCED
    terminal_states: [COMPLIANCE_PERIOD_CLOSED, TERMINATED]
    transitions:
      - from: ANNOUNCED
        to: ACTIVE
        trigger: "POST /nmtc/allocation-awards/{id}/allocation-agreement"
        actor: CDESponsor
        preconditions:
          - "award.lifecycle_status == ANNOUNCED"
          - "cde.certification_status == CERTIFIED for award.cde_id"
          - "X-User-ID == award.cde_id"
        side_effects:
          - "sets award.allocation_agreement_signed_at = logical clock and award.signatory_name = request signatory_name"
          - "recomputes award.compliance_posture (UNRESTRICTED while the CDE is CERTIFIED and at_risk_qei_count < 2)"
          - "increments award.version by 1"
        note: "QEI issuance is impossible before this transition; the allocation agreement is the commitment on service area, targeted distress and community outcomes."
      - from: ACTIVE
        to: COMPLIANCE_PERIOD_CLOSED
        trigger: "POST /nmtc/unwind-transactions/{id}/settlement (system, conditional)"
        actor: system
        preconditions:
          - "the settled UnwindTransaction's QEI was the last QEI on the award whose deployment_status != VOIDED"
          - "every non-VOIDED QEI on the award has deployment_status == UNWOUND"
        side_effects:
          - "sets award.lifecycle_status = COMPLIANCE_PERIOD_CLOSED"
          - "every CommunityBenefitsAgreement on this award whose status IN {ACTIVE, CURE_REQUIRED} moves to CLOSED"
          - "increments award.version by 1 and each touched CommunityBenefitsAgreement.version by 1"
        note: "Bubble-up: parent award auto-transitions from the aggregate state of its QEI children."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /nmtc/cdes/{id}/decertification (system, conditional)"
        actor: system
        preconditions:
          - "the award's CDE moved to DECERTIFIED"
          - "award.issued_qei_count == 0"
        side_effects:
          - "sets award.lifecycle_status = TERMINATED and award.remaining_authority_cents = 0"
          - "increments award.version by 1"
        note: "An award with no issued QEI has nothing to recapture, so decertification terminates it outright instead of freezing it."

  - entity: AllocationAward
    state_field: compliance_posture
    initial_state: UNRESTRICTED
    terminal_states: []
    transitions:
      - from: UNRESTRICTED
        to: RESTRICTED
        trigger: "system recomputation of calculations.award_compliance_posture"
        actor: system
        preconditions:
          - "cde.certification_status == CERTIFIED"
          - "award.at_risk_qei_count >= 2 OR (award.issued_qei_count >= 2 AND award.severe_distress_share_pct < award.min_severe_distress_share_pct)"
        side_effects:
          - "POST /nmtc/qeis is refused with ERR_AWARD_POSTURE_RESTRICTED while RESTRICTED"
          - "increments award.version by 1"
        note: "Recomputed after every QEI compliance_status change, every QLICI deployment, every annual test, and every CDE certification change. The posture dimension is orthogonal to lifecycle_status: an ACTIVE award may be RESTRICTED and a RESTRICTED award still accepts QLICI deployments on QEIs already issued."
      - from: RESTRICTED
        to: UNRESTRICTED
        trigger: "system recomputation of calculations.award_compliance_posture"
        actor: system
        preconditions:
          - "cde.certification_status == CERTIFIED"
          - "award.at_risk_qei_count < 2"
          - "award.issued_qei_count < 2 OR award.severe_distress_share_pct >= award.min_severe_distress_share_pct"
        side_effects:
          - "POST /nmtc/qeis becomes available again"
          - "increments award.version by 1"
        note: "Cycle: a cured QEI lowers at_risk_qei_count and the award returns to UNRESTRICTED without any operator action."
      - from: UNRESTRICTED
        to: FROZEN
        trigger: "POST /nmtc/cdes/{id}/decertification (system cascade hop 1)"
        actor: system
        preconditions:
          - "cde.certification_status == DECERTIFIED for award.cde_id"
        side_effects:
          - "POST /nmtc/qeis and POST /nmtc/qlicis are both refused with ERR_CDE_NOT_CERTIFIED"
          - "increments award.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /nmtc/cdes/{id}/decertification (system cascade hop 1)"
        actor: system
        preconditions:
          - "cde.certification_status == DECERTIFIED for award.cde_id"
        side_effects:
          - "POST /nmtc/qeis and POST /nmtc/qlicis are both refused with ERR_CDE_NOT_CERTIFIED"
          - "increments award.version by 1"

  - entity: QALICB
    state_field: eligibility_status
    initial_state: PENDING
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests with result PASS"
        actor: ComplianceReviewer
        preconditions:
          - "qalicb.eligibility_status IN {PENDING, CERTIFIED, RECERTIFICATION_DUE, FAILED}"
          - "calculations.qalicb_eligibility_evaluation returns PASS"
        side_effects:
          - "sets qalicb.last_certified_at = logical clock, qalicb.latest_test_result = PASS, qalicb.consecutive_failed_test_count = 0"
          - "increments qalicb.version by 1"
      - from: RECERTIFICATION_DUE
        to: CERTIFIED
        trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests with result PASS"
        actor: ComplianceReviewer
        preconditions:
          - "calculations.qalicb_eligibility_evaluation returns PASS"
        side_effects:
          - "sets qalicb.last_certified_at = logical clock, qalicb.latest_test_result = PASS, qalicb.consecutive_failed_test_count = 0"
          - "increments qalicb.version by 1"
        note: "Cycle close: CERTIFIED -> RECERTIFICATION_DUE -> CERTIFIED. New QLICI deployment is blocked only while RECERTIFICATION_DUE; principal already outstanding keeps counting."
      - from: FAILED
        to: CERTIFIED
        trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests with result PASS"
        actor: ComplianceReviewer
        preconditions:
          - "qalicb.eligibility_status == FAILED"
          - "calculations.qalicb_eligibility_evaluation returns PASS"
        side_effects:
          - "sets qalicb.last_certified_at = logical clock, qalicb.latest_test_result = PASS, qalicb.consecutive_failed_test_count = 0"
          - "REQUALIFICATION CASCADE HOP 1: every QLICI whose qalicb_id == qalicb.id and status == NON_QUALIFYING returns to REPAID when outstanding_principal_cents == 0, else PARTIALLY_REPAID when total_repaid_cents > 0, else DEPLOYED; non_qualifying_since_at is cleared to null"
          - "REQUALIFICATION CASCADE HOP 2: because those QLICI rows became qualifying again, each parent QEI's substantially_all_pct_direct is recomputed; a QEI whose compliance_status == AT_RISK and whose recomputed substantially_all_pct_direct >= 85.00 and whose logical clock <= cure_deadline_at returns to COMPLIANT and cure_deadline_at is cleared to null"
          - "REQUALIFICATION CASCADE HOP 3: because those QEIs left AT_RISK, each award's at_risk_qei_count is recomputed and compliance_posture re-derived"
          - "increments qalicb.version by 1, each touched QLICI.version, QEI.version and AllocationAward.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests with result FAIL"
        actor: ComplianceReviewer
        preconditions:
          - "calculations.qalicb_eligibility_evaluation returns FAIL"
          - "qalicb.consecutive_failed_test_count + 1 < 2"
        side_effects:
          - "sets qalicb.latest_test_result = FAIL and qalicb.consecutive_failed_test_count += 1"
          - "increments qalicb.version by 1"
      - from: CERTIFIED
        to: FAILED
        trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests with result FAIL"
        actor: ComplianceReviewer
        preconditions:
          - "calculations.qalicb_eligibility_evaluation returns FAIL"
          - "qalicb.consecutive_failed_test_count + 1 < 2"
        side_effects:
          - "sets qalicb.latest_test_result = FAIL and qalicb.consecutive_failed_test_count += 1"
          - "DISQUALIFICATION CASCADE HOP 1: every QLICI whose qalicb_id == qalicb.id and status IN {DEPLOYED, PARTIALLY_REPAID} moves to NON_QUALIFYING with non_qualifying_since_at = logical clock"
          - "DISQUALIFICATION CASCADE HOP 2: because those QLICI rows stopped qualifying, each parent QEI recomputes substantially_all_pct_direct; any such QEI whose compliance_status == COMPLIANT and whose recomputed substantially_all_pct_direct < 85.00 moves to AT_RISK with cure_deadline_at = logical clock + 180 days"
          - "DISQUALIFICATION CASCADE HOP 3: because those QEIs entered AT_RISK, each parent award's at_risk_qei_count is incremented and compliance_posture re-derived, so an award reaching at_risk_qei_count >= 2 moves UNRESTRICTED -> RESTRICTED and stops accepting new QEI issuance"
          - "increments qalicb.version by 1, each touched QLICI.version, QEI.version and AllocationAward.version by 1"
        note: "Interim (non annual-test) recomputations always use the DIRECT_TRACING variant regardless of the award's substantially_all_method; the AGGREGATE_BALANCE variant needs a closed measurement window and is only computed by POST /nmtc/qeis/{id}/annual-tests."
      - from: RECERTIFICATION_DUE
        to: FAILED
        trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests with result FAIL"
        actor: ComplianceReviewer
        preconditions:
          - "calculations.qalicb_eligibility_evaluation returns FAIL"
          - "qalicb.consecutive_failed_test_count + 1 < 2"
        side_effects:
          - "identical three-hop disqualification cascade as CERTIFIED -> FAILED"
          - "increments qalicb.version by 1"
      - from: CERTIFIED
        to: RECERTIFICATION_DUE
        trigger: "POST /nmtc/qeis/{id}/annual-tests (system recertification sweep)"
        actor: system
        preconditions:
          - "the QALICB is funded by at least one QLICI whose qei_id == the tested QEI and whose status IN {DEPLOYED, PARTIALLY_REPAID}"
          - "logical clock > qalicb.last_certified_at + 365 days (STRICT: at exactly 365 days the certification is still fresh and the QALICB is NOT swept)"
        side_effects:
          - "sets qalicb.eligibility_status = RECERTIFICATION_DUE"
          - "increments the test's recertification_swept_qalicb_count by 1"
          - "increments qalicb.version by 1"
        note: "Ops-run checkpoint: the annual test is the only epoch advance that sweeps stale QALICB certifications. Outstanding principal keeps qualifying while RECERTIFICATION_DUE, but POST /nmtc/qlicis refuses new deployment."
      - from: FAILED
        to: DISQUALIFIED
        trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests with result FAIL"
        actor: ComplianceReviewer
        preconditions:
          - "calculations.qalicb_eligibility_evaluation returns FAIL"
          - "qalicb.consecutive_failed_test_count + 1 >= 2"
        side_effects:
          - "sets qalicb.latest_test_result = FAIL, qalicb.consecutive_failed_test_count += 1, qalicb.eligibility_status = DISQUALIFIED"
          - "the same three-hop disqualification cascade runs for any QLICI still in {DEPLOYED, PARTIALLY_REPAID}"
          - "every CommunityBenefitsAgreement whose qalicb_id == qalicb.id and status IN {ACTIVE, CURE_REQUIRED} moves to BREACHED with breached_at = logical clock, and each parent award's cba_breach_count is recomputed"
          - "increments qalicb.version by 1 and each touched child version by 1"
        note: "Terminal: two consecutive FAIL results permanently disqualify the business; no transition leaves DISQUALIFIED."

  - entity: InvestmentFund
    state_field: status
    initial_state: FORMED
    terminal_states: [WOUND_UP]
    transitions:
      - from: FORMED
        to: FUNDED
        trigger: "POST /nmtc/investment-funds/{id}/closing"
        actor: TaxCreditInvestor
        preconditions:
          - "fund.status == FORMED"
          - "X-User-ID == fund.investor_user_id"
          - "request equity_received_cents == fund.equity_contribution_cents"
          - "request leverage_received_cents == fund.leverage_loan_principal_cents"
        side_effects:
          - "sets fund.equity_received_cents, fund.leverage_received_cents, fund.leverage_loan_outstanding_cents = leverage_received_cents, fund.closed_at = logical clock"
          - "sets fund.capital_available_cents = equity_received_cents + leverage_received_cents - deployed_to_qei_cents"
          - "increments fund.version by 1"
        note: "Transaction structuring: the leverage loan and the investor equity land in the fund before any QEI can be made."
      - from: FUNDED
        to: QEI_MADE
        trigger: "POST /nmtc/qeis"
        actor: system
        preconditions:
          - "fund.status == FUNDED"
          - "the QEI being created names this fund"
        side_effects:
          - "sets fund.deployed_to_qei_cents += qei.qei_amount_cents and recomputes fund.capital_available_cents"
          - "increments fund.version by 1"
      - from: QEI_MADE
        to: FUNDED
        trigger: "POST /nmtc/qeis/{id}/void"
        actor: system
        preconditions:
          - "the voided QEI was the only QEI on this fund with deployment_status != VOIDED"
        side_effects:
          - "sets fund.deployed_to_qei_cents -= qei.qei_amount_cents and recomputes fund.capital_available_cents"
          - "increments fund.version by 1"
        note: "Compensating transition that restores the fund to FUNDED so a replacement QEI can be made."
      - from: QEI_MADE
        to: WOUND_UP
        trigger: "POST /nmtc/unwind-transactions/{id}/settlement"
        actor: system
        preconditions:
          - "every QEI on this fund whose deployment_status != VOIDED has deployment_status == UNWOUND"
        side_effects:
          - "sets fund.leverage_loan_outstanding_cents = 0 and fund.capital_available_cents = 0"
          - "increments fund.version by 1"

  - entity: QEI
    state_field: deployment_status
    initial_state: ISSUED
    terminal_states: [VOIDED, UNWOUND]
    transitions:
      - from: ISSUED
        to: DEPLOYING
        trigger: "POST /nmtc/qlicis (first sub-allocation on this QEI)"
        actor: CDESponsor
        preconditions:
          - "qei.deployment_status == ISSUED"
          - "qei.uninvested_cash_cents >= request principal_cents"
          - "logical clock <= qei.deployment_deadline_at"
        side_effects:
          - "decreases qei.uninvested_cash_cents by principal_cents, preserving calculations.qei_capital_ledger"
          - "recomputes qei.substantially_all_pct_direct"
          - "recomputes the award's severe_distress_share_pct and compliance_posture"
          - "increments qei.version by 1 and the award's version by 1"
      - from: DEPLOYING
        to: DEPLOYING
        trigger: "POST /nmtc/qlicis (further sub-allocations while cash remains)"
        actor: CDESponsor
        preconditions:
          - "qei.uninvested_cash_cents >= request principal_cents"
          - "qei.uninvested_cash_cents - request principal_cents > 0"
          - "logical clock <= qei.deployment_deadline_at"
        side_effects:
          - "decreases qei.uninvested_cash_cents by principal_cents"
          - "recomputes qei.substantially_all_pct_direct, the award's severe_distress_share_pct and compliance_posture"
          - "increments qei.version by 1"
      - from: DEPLOYING
        to: FULLY_DEPLOYED
        trigger: "POST /nmtc/qlicis (sub-allocation that consumes the last uninvested cent)"
        actor: CDESponsor
        preconditions:
          - "qei.uninvested_cash_cents - request principal_cents == 0"
          - "logical clock <= qei.deployment_deadline_at"
        side_effects:
          - "sets qei.uninvested_cash_cents = 0"
          - "recomputes qei.substantially_all_pct_direct, the award's severe_distress_share_pct and compliance_posture"
          - "increments qei.version by 1"
      - from: ISSUED
        to: FULLY_DEPLOYED
        trigger: "POST /nmtc/qlicis (single sub-allocation consuming the whole net deployable amount)"
        actor: CDESponsor
        preconditions:
          - "qei.deployment_status == ISSUED"
          - "qei.uninvested_cash_cents - request principal_cents == 0"
          - "logical clock <= qei.deployment_deadline_at"
        side_effects:
          - "sets qei.uninvested_cash_cents = 0 and recomputes qei.substantially_all_pct_direct"
          - "recomputes the award's severe_distress_share_pct and compliance_posture"
          - "increments qei.version by 1"
      - from: DEPLOYING
        to: REINVESTMENT_PENDING
        trigger: "POST /nmtc/qlicis/{id}/principal-repayments"
        actor: CDESponsor
        preconditions:
          - "the repaid QLICI's qei_id == qei.id"
          - "request amount_cents <= qlici.outstanding_principal_cents"
        side_effects:
          - "REPAYMENT CASCADE HOP 1: qlici.total_repaid_cents += amount_cents, qlici.outstanding_principal_cents -= amount_cents and qlici.status moves DEPLOYED -> PARTIALLY_REPAID (or -> REPAID when outstanding reaches 0)"
          - "REPAYMENT CASCADE HOP 2: because principal came back, qei.uninvested_cash_cents += amount_cents (preserving calculations.qei_capital_ledger) and a ReinvestmentObligation row is created with amount_cents = the repaid amount, arose_at = logical clock, reinvest_by_at = arose_at + 365 days, status = OPEN"
          - "REPAYMENT CASCADE HOP 3: because uninvested cash rose while outstanding qualifying principal fell, qei.substantially_all_pct_direct is recomputed; when the recomputed value < 85.00 and qei.compliance_status == COMPLIANT, compliance_status moves to AT_RISK with cure_deadline_at = logical clock + 180 days, which in turn increments the award's at_risk_qei_count and re-derives compliance_posture"
          - "increments qlici.version, qei.version and (when touched) the award's version by 1"
      - from: FULLY_DEPLOYED
        to: REINVESTMENT_PENDING
        trigger: "POST /nmtc/qlicis/{id}/principal-repayments"
        actor: CDESponsor
        preconditions:
          - "the repaid QLICI's qei_id == qei.id"
          - "request amount_cents <= qlici.outstanding_principal_cents"
        side_effects:
          - "identical three-hop repayment cascade as DEPLOYING -> REINVESTMENT_PENDING"
          - "increments qlici.version and qei.version by 1"
      - from: REINVESTMENT_PENDING
        to: DEPLOYING
        trigger: "POST /nmtc/reinvestment-obligations/{id}/reinvestments (last OPEN obligation satisfied, cash remains)"
        actor: CDESponsor
        preconditions:
          - "no ReinvestmentObligation on this QEI remains in status OPEN after this reinvestment"
          - "qei.uninvested_cash_cents > 0 after the reinvestment"
        side_effects:
          - "moves the obligation to SATISFIED, decreases qei.uninvested_cash_cents by amount_cents and increases the target QLICI's outstanding principal"
          - "recomputes qei.substantially_all_pct_direct; when it reaches >= 85.00 and compliance_status == AT_RISK within cure_deadline_at, compliance_status returns to COMPLIANT"
          - "increments qei.version by 1"
        note: "Cycle: DEPLOYING -> REINVESTMENT_PENDING -> DEPLOYING, driven by returned capital and its redeployment."
      - from: REINVESTMENT_PENDING
        to: FULLY_DEPLOYED
        trigger: "POST /nmtc/reinvestment-obligations/{id}/reinvestments (last OPEN obligation satisfied, no cash left)"
        actor: CDESponsor
        preconditions:
          - "no ReinvestmentObligation on this QEI remains in status OPEN after this reinvestment"
          - "qei.uninvested_cash_cents == 0 after the reinvestment"
        side_effects:
          - "moves the obligation to SATISFIED and sets qei.uninvested_cash_cents = 0"
          - "recomputes qei.substantially_all_pct_direct and, when applicable, returns compliance_status AT_RISK -> COMPLIANT"
          - "increments qei.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /nmtc/qeis/{id}/void"
        actor: CDESponsor
        preconditions:
          - "qei.deployment_status == ISSUED"
          - "no QLICI row exists whose qei_id == qei.id"
          - "qei.compliance_years_completed == 0"
        side_effects:
          - "sets qei.voided_at = logical clock, qei.uninvested_cash_cents = 0, qei.permitted_fees_cents = 0, qei.net_deployable_cents = 0"
          - "credits the award: remaining_authority_cents is recomputed by calculations.allocation_authority_ledger so that award.allocation_amount_cents is conserved exactly"
          - "recomputes award.issued_qei_count and award.compliance_posture; recomputes fund.deployed_to_qei_cents and fund.capital_available_cents"
          - "increments qei.version, award.version and fund.version by 1"
        note: "Compensating action for QEI issuance; the conserved quantity is allocation authority."
      - from: FULLY_DEPLOYED
        to: UNWOUND
        trigger: "POST /nmtc/unwind-transactions/{id}/settlement"
        actor: CDESponsor
        preconditions:
          - "the UnwindTransaction's status IN {PUT_EXERCISED, CALL_EXERCISED}"
          - "qei.compliance_years_completed == 7"
        side_effects:
          - "sets qei.deployment_status = UNWOUND and moves compliance_status COMPLIANT -> RELEASED"
          - "every QLICI on this QEI whose status IN {DEPLOYED, PARTIALLY_REPAID, NON_QUALIFYING} moves to REPAID with outstanding_principal_cents = 0 and total_repaid_cents = principal_cents"
          - "the fund moves QEI_MADE -> WOUND_UP; the award may bubble up ACTIVE -> COMPLIANCE_PERIOD_CLOSED"
          - "increments qei.version, each QLICI.version, fund.version and (when touched) award.version by 1"
      - from: DEPLOYING
        to: UNWOUND
        trigger: "POST /nmtc/unwind-transactions/{id}/settlement"
        actor: CDESponsor
        preconditions:
          - "the UnwindTransaction's status IN {PUT_EXERCISED, CALL_EXERCISED}"
          - "qei.compliance_years_completed == 7"
        side_effects:
          - "identical settlement side effects as FULLY_DEPLOYED -> UNWOUND"
          - "increments qei.version by 1"

  - entity: QEI
    state_field: compliance_status
    initial_state: COMPLIANT
    terminal_states: [RECAPTURED, RELEASED]
    transitions:
      - from: COMPLIANT
        to: AT_RISK
        trigger: "POST /nmtc/qeis/{id}/annual-tests with result FAIL, or any interim recomputation of substantially_all_pct_direct that lands below 85.00"
        actor: system
        preconditions:
          - "qei.compliance_status == COMPLIANT"
          - "the governing substantially-all percentage < 85.00 OR at least one ReinvestmentObligation on the QEI is BREACHED"
        side_effects:
          - "sets qei.cure_deadline_at = logical clock + 180 days"
          - "increments the award's at_risk_qei_count and re-derives award.compliance_posture"
          - "increments qei.version and award.version by 1"
      - from: AT_RISK
        to: COMPLIANT
        trigger: "POST /nmtc/qeis/{id}/cures, POST /nmtc/reinvestment-obligations/{id}/reinvestments, or the QALICB requalification cascade"
        actor: system
        preconditions:
          - "qei.compliance_status == AT_RISK"
          - "logical clock <= qei.cure_deadline_at"
          - "recomputed substantially_all_pct_direct >= 85.00"
          - "no ReinvestmentObligation on this QEI has status BREACHED"
        side_effects:
          - "clears qei.cure_deadline_at to null"
          - "decrements the award's at_risk_qei_count and re-derives award.compliance_posture, so an award may return RESTRICTED -> UNRESTRICTED"
          - "increments qei.version and award.version by 1"
        note: "Cycle: COMPLIANT -> AT_RISK -> COMPLIANT."
      - from: AT_RISK
        to: RECAPTURED
        trigger: "POST /nmtc/qeis/{id}/annual-tests (system, cure window elapsed)"
        actor: system
        preconditions:
          - "qei.compliance_status == AT_RISK"
          - "logical clock > qei.cure_deadline_at"
        side_effects:
          - "sets qei.recapture_trigger_type = SUBSTANTIALLY_ALL_FAILURE (or REINVESTMENT_BREACH when the test's breached_obligation_count > 0) and qei.recapture_exposure_cents per calculations.recapture_exposure"
          - "sets the test's recapture_triggered = true"
          - "decrements the award's at_risk_qei_count, increments recaptured_qei_count and re-derives compliance_posture"
          - "increments qei.version and award.version by 1"
        note: "Recapture trigger 2 and 3 of 3: proceeds ceased to be used for QLICIs, or returned capital was not reinvested inside the 365-day window."
      - from: COMPLIANT
        to: RECAPTURED
        trigger: "POST /nmtc/cdes/{id}/decertification (system cascade hop 2)"
        actor: system
        preconditions:
          - "the award's CDE moved to DECERTIFIED"
          - "qei.deployment_status NOT IN {VOIDED, UNWOUND}"
        side_effects:
          - "sets qei.recapture_trigger_type = CDE_DECERTIFICATION and qei.recapture_exposure_cents per calculations.recapture_exposure"
          - "increments the award's recaptured_qei_count"
          - "increments qei.version and award.version by 1"
      - from: AT_RISK
        to: RECAPTURED
        trigger: "POST /nmtc/cdes/{id}/decertification (system cascade hop 2)"
        actor: system
        preconditions:
          - "the award's CDE moved to DECERTIFIED"
          - "qei.deployment_status NOT IN {VOIDED, UNWOUND}"
        side_effects:
          - "sets qei.recapture_trigger_type = CDE_DECERTIFICATION and qei.recapture_exposure_cents per calculations.recapture_exposure"
          - "decrements the award's at_risk_qei_count and increments recaptured_qei_count"
          - "increments qei.version and award.version by 1"
      - from: COMPLIANT
        to: RELEASED
        trigger: "POST /nmtc/unwind-transactions/{id}/settlement"
        actor: CDESponsor
        preconditions:
          - "qei.compliance_years_completed == 7"
          - "the UnwindTransaction's status IN {PUT_EXERCISED, CALL_EXERCISED}"
        side_effects:
          - "the seven-year compliance period closes with no recapture; qei.deployment_status moves to UNWOUND in the same request"
          - "increments qei.version by 1"
        note: "Terminal. RELEASED and RECAPTURED are the only terminal compliance states, and the two dimensions reach terminal states independently: a VOIDED QEI stays COMPLIANT forever, and a RECAPTURED QEI may still be sitting in deployment_status DEPLOYING."

  - entity: QLICI
    state_field: status
    initial_state: DEPLOYED
    terminal_states: [REPAID]
    transitions:
      - from: DEPLOYED
        to: PARTIALLY_REPAID
        trigger: "POST /nmtc/qlicis/{id}/principal-repayments (amount < outstanding)"
        actor: CDESponsor
        preconditions:
          - "qlici.status == DEPLOYED"
          - "0 < request amount_cents < qlici.outstanding_principal_cents"
        side_effects:
          - "see the three-hop repayment cascade under QEI.deployment_status DEPLOYING -> REINVESTMENT_PENDING"
          - "increments qlici.version by 1"
      - from: PARTIALLY_REPAID
        to: PARTIALLY_REPAID
        trigger: "POST /nmtc/qlicis/{id}/principal-repayments (amount < outstanding)"
        actor: CDESponsor
        preconditions:
          - "0 < request amount_cents < qlici.outstanding_principal_cents"
        side_effects:
          - "a further ReinvestmentObligation row is created for the newly returned amount"
          - "increments qlici.version by 1"
      - from: DEPLOYED
        to: REPAID
        trigger: "POST /nmtc/qlicis/{id}/principal-repayments (amount == outstanding)"
        actor: CDESponsor
        preconditions:
          - "request amount_cents == qlici.outstanding_principal_cents"
        side_effects:
          - "sets qlici.outstanding_principal_cents = 0 and qlici.total_repaid_cents = qlici.principal_cents"
          - "the QEI capital ledger is preserved exactly: qei.uninvested_cash_cents returns to its pre-deployment value"
          - "increments qlici.version by 1"
        note: "Full repayment is the compensating action for deployment; the conserved quantity is QEI capital."
      - from: PARTIALLY_REPAID
        to: REPAID
        trigger: "POST /nmtc/qlicis/{id}/principal-repayments (amount == outstanding)"
        actor: CDESponsor
        preconditions:
          - "request amount_cents == qlici.outstanding_principal_cents"
        side_effects:
          - "sets qlici.outstanding_principal_cents = 0"
          - "increments qlici.version by 1"
      - from: DEPLOYED
        to: NON_QUALIFYING
        trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests with result FAIL (disqualification cascade hop 1)"
        actor: system
        preconditions:
          - "qlici.qalicb_id == the failing QALICB"
          - "qlici.status IN {DEPLOYED, PARTIALLY_REPAID}"
        side_effects:
          - "sets qlici.non_qualifying_since_at = logical clock; the principal leaves every substantially-all numerator"
          - "increments qlici.version by 1"
      - from: PARTIALLY_REPAID
        to: NON_QUALIFYING
        trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests with result FAIL (disqualification cascade hop 1)"
        actor: system
        preconditions:
          - "qlici.qalicb_id == the failing QALICB"
        side_effects:
          - "sets qlici.non_qualifying_since_at = logical clock"
          - "increments qlici.version by 1"
      - from: NON_QUALIFYING
        to: DEPLOYED
        trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests with result PASS from FAILED (requalification cascade hop 1)"
        actor: system
        preconditions:
          - "qlici.status == NON_QUALIFYING"
          - "qlici.total_repaid_cents == 0"
        side_effects:
          - "clears qlici.non_qualifying_since_at to null; the principal re-enters every substantially-all numerator"
          - "increments qlici.version by 1"
        note: "Cycle: DEPLOYED -> NON_QUALIFYING -> DEPLOYED."
      - from: NON_QUALIFYING
        to: PARTIALLY_REPAID
        trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests with result PASS from FAILED (requalification cascade hop 1)"
        actor: system
        preconditions:
          - "qlici.status == NON_QUALIFYING"
          - "qlici.total_repaid_cents > 0 AND qlici.outstanding_principal_cents > 0"
        side_effects:
          - "clears qlici.non_qualifying_since_at to null"
          - "increments qlici.version by 1"
      - from: NON_QUALIFYING
        to: REPAID
        trigger: "POST /nmtc/unwind-transactions/{id}/settlement"
        actor: CDESponsor
        preconditions:
          - "the settling UnwindTransaction's QEI is this QLICI's qei_id"
        side_effects:
          - "sets qlici.outstanding_principal_cents = 0 and qlici.total_repaid_cents = qlici.principal_cents"
          - "increments qlici.version by 1"

  - entity: ReinvestmentObligation
    state_field: status
    initial_state: OPEN
    terminal_states: [SATISFIED, BREACHED]
    transitions:
      - from: OPEN
        to: SATISFIED
        trigger: "POST /nmtc/reinvestment-obligations/{id}/reinvestments (cumulative reinvested_cents reaches amount_cents)"
        actor: CDESponsor
        preconditions:
          - "obligation.status == OPEN"
          - "logical clock <= obligation.reinvest_by_at"
          - "obligation.reinvested_cents + request amount_cents == obligation.amount_cents"
          - "the target QLICI's qei_id == obligation.qei_id and its status IN {DEPLOYED, PARTIALLY_REPAID}"
        side_effects:
          - "sets obligation.reinvested_cents = obligation.amount_cents and obligation.satisfied_at = logical clock"
          - "the target QLICI's principal_cents and outstanding_principal_cents both increase by amount_cents, and qei.uninvested_cash_cents decreases by amount_cents"
          - "may move qei.deployment_status REINVESTMENT_PENDING -> DEPLOYING or -> FULLY_DEPLOYED and qei.compliance_status AT_RISK -> COMPLIANT"
          - "increments obligation.version, qlici.version and qei.version by 1"
      - from: OPEN
        to: OPEN
        trigger: "POST /nmtc/reinvestment-obligations/{id}/reinvestments (partial reinvestment)"
        actor: CDESponsor
        preconditions:
          - "logical clock <= obligation.reinvest_by_at"
          - "obligation.reinvested_cents + request amount_cents < obligation.amount_cents"
        side_effects:
          - "increases obligation.reinvested_cents by amount_cents and the target QLICI's principal by the same amount"
          - "increments obligation.version by 1"
      - from: OPEN
        to: BREACHED
        trigger: "POST /nmtc/qeis/{id}/annual-tests (system sweep)"
        actor: system
        preconditions:
          - "obligation.status == OPEN"
          - "logical clock > obligation.reinvest_by_at"
        side_effects:
          - "sets obligation.breached_at = logical clock and counts into the test's breached_obligation_count"
          - "forces the test result to FAIL regardless of the governing percentage"
          - "increments obligation.version by 1"
        note: "The reinvestment deadline is only enforced at the annual-test epoch boundary, never on read."

  - entity: CommunityBenefitsAgreement
    state_field: status
    initial_state: ACTIVE
    terminal_states: [BREACHED, CLOSED]
    transitions:
      - from: ACTIVE
        to: CURE_REQUIRED
        trigger: "POST /nmtc/community-benefits-agreements/{id}/annual-certifications with classification CURE_REQUIRED"
        actor: ComplianceReviewer
        preconditions:
          - "cba.status == ACTIVE"
          - "80.00 <= governing compliance_pct < 100.00 AND local_hire_pct >= cba.local_hire_pct_target"
        side_effects:
          - "sets cba.consecutive_cure_required_count += 1, cba.latest_compliance_pct and cba.latest_local_hire_pct"
          - "increments cba.version by 1"
      - from: CURE_REQUIRED
        to: ACTIVE
        trigger: "POST /nmtc/community-benefits-agreements/{id}/annual-certifications with classification CERTIFIED"
        actor: ComplianceReviewer
        preconditions:
          - "cba.status == CURE_REQUIRED"
          - "governing compliance_pct >= 100.00 AND local_hire_pct >= cba.local_hire_pct_target"
        side_effects:
          - "resets cba.consecutive_cure_required_count = 0 and sets cba.last_certified_year = certification_year"
          - "increments cba.version by 1"
        note: "Cycle: ACTIVE -> CURE_REQUIRED -> ACTIVE."
      - from: ACTIVE
        to: BREACHED
        trigger: "POST /nmtc/community-benefits-agreements/{id}/annual-certifications with classification SHORTFALL"
        actor: ComplianceReviewer
        preconditions:
          - "governing compliance_pct < 80.00 OR local_hire_pct < cba.local_hire_pct_target"
        side_effects:
          - "sets cba.breached_at = logical clock; recomputes the award's cba_breach_count"
          - "POST /nmtc/qlicis to this QALICB is refused with ERR_CBA_BREACHED from now on"
          - "increments cba.version and the award's version by 1"
      - from: CURE_REQUIRED
        to: BREACHED
        trigger: "POST /nmtc/community-benefits-agreements/{id}/annual-certifications with classification CURE_REQUIRED for a second consecutive year"
        actor: ComplianceReviewer
        preconditions:
          - "cba.status == CURE_REQUIRED"
          - "cba.consecutive_cure_required_count + 1 >= 2"
        side_effects:
          - "sets cba.breached_at = logical clock; recomputes the award's cba_breach_count"
          - "increments cba.version and the award's version by 1"
        note: "Two consecutive cure years are treated as a breach even though neither year alone was a SHORTFALL."
      - from: ACTIVE
        to: BREACHED
        trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests reaching DISQUALIFIED"
        actor: system
        preconditions:
          - "cba.qalicb_id == the disqualified QALICB"
        side_effects:
          - "sets cba.breached_at = logical clock; recomputes the award's cba_breach_count"
          - "increments cba.version and the award's version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /nmtc/unwind-transactions/{id}/settlement (award bubble-up)"
        actor: system
        preconditions:
          - "the parent award moved ACTIVE -> COMPLIANCE_PERIOD_CLOSED in the same request"
        side_effects:
          - "sets cba.status = CLOSED; further job reports and certifications are refused with ERR_INVALID_STATE_TRANSITION"
          - "increments cba.version by 1"
      - from: CURE_REQUIRED
        to: CLOSED
        trigger: "POST /nmtc/unwind-transactions/{id}/settlement (award bubble-up)"
        actor: system
        preconditions:
          - "the parent award moved ACTIVE -> COMPLIANCE_PERIOD_CLOSED in the same request"
        side_effects:
          - "sets cba.status = CLOSED"
          - "increments cba.version by 1"

  - entity: UnwindTransaction
    state_field: status
    initial_state: OPTION_WINDOW_OPEN
    terminal_states: [SETTLED, EXPIRED]
    transitions:
      - from: OPTION_WINDOW_OPEN
        to: PUT_EXERCISED
        trigger: "POST /nmtc/unwind-transactions/{id}/exercise with option_type PUT"
        actor: TaxCreditInvestor
        preconditions:
          - "unwind.status == OPTION_WINDOW_OPEN"
          - "X-User-ID == unwind.put_holder_user_id"
          - "option_window_open_at <= logical clock < option_window_close_at"
          - "qei.compliance_status == COMPLIANT"
        side_effects:
          - "sets unwind.exercised_option_type = PUT, unwind.exercised_at = logical clock and unwind.settlement_amount_cents = unwind.put_price_cents"
          - "PUT BRANCH ONLY: the investor's fund interest transfers at the nominal put price, so fund.leverage_loan_outstanding_cents is left untouched and no fee sweep occurs"
          - "increments unwind.version by 1"
      - from: OPTION_WINDOW_OPEN
        to: CALL_EXERCISED
        trigger: "POST /nmtc/unwind-transactions/{id}/exercise with option_type CALL"
        actor: QALICBSponsor
        preconditions:
          - "unwind.status == OPTION_WINDOW_OPEN"
          - "X-User-ID == unwind.call_holder_user_id"
          - "option_window_open_at <= logical clock < option_window_close_at"
          - "qei.compliance_status == COMPLIANT"
        side_effects:
          - "sets unwind.exercised_option_type = CALL, unwind.exercised_at = logical clock and unwind.settlement_amount_cents = unwind.call_price_cents"
          - "CALL BRANCH ONLY: the sponsor buys the fund interest at fair market value, so qei.accrued_unpaid_fee_cents is swept to 0 in the same request (the accrued CDE fee is netted inside call_price_cents)"
          - "increments unwind.version and qei.version by 1"
        note: "Divergent side-effect sets: the PUT branch preserves accrued_unpaid_fee_cents and the CALL branch zeroes it. Both branches join at SETTLED."
      - from: PUT_EXERCISED
        to: SETTLED
        trigger: "POST /nmtc/unwind-transactions/{id}/settlement"
        actor: CDESponsor
        preconditions:
          - "unwind.status == PUT_EXERCISED"
          - "X-User-ID == the CDE that holds the QEI's award"
        side_effects:
          - "sets unwind.settlement_reference and unwind.settled_at = logical clock"
          - "the QEI moves to deployment_status UNWOUND and compliance_status RELEASED; every remaining QLICI moves to REPAID; the fund moves to WOUND_UP; the award may bubble up to COMPLIANCE_PERIOD_CLOSED and close its agreements"
          - "increments unwind.version, qei.version, each QLICI.version, fund.version and (when touched) award.version and CommunityBenefitsAgreement.version by 1"
      - from: CALL_EXERCISED
        to: SETTLED
        trigger: "POST /nmtc/unwind-transactions/{id}/settlement"
        actor: CDESponsor
        preconditions:
          - "unwind.status == CALL_EXERCISED"
          - "X-User-ID == the CDE that holds the QEI's award"
        side_effects:
          - "identical join side effects as PUT_EXERCISED -> SETTLED"
          - "increments unwind.version by 1"
      - from: OPTION_WINDOW_OPEN
        to: EXPIRED
        trigger: "POST /nmtc/qeis/{id}/annual-tests (system, window elapsed unexercised)"
        actor: system
        preconditions:
          - "unwind.status == OPTION_WINDOW_OPEN"
          - "logical clock >= unwind.option_window_close_at"
        side_effects:
          - "sets unwind.status = EXPIRED; a new UnwindTransaction may then be opened on the same QEI"
          - "increments unwind.version by 1"
        note: "Terminal for this row only; the QEI keeps its compliance_status until a later unwind settles."

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's version — the only sanctioned
#        write-write conflict mechanism in this scaffold)
# =============================================================================
concurrency_rules:
  - rule_id: qei-issue-stale-award
    parent_entity: AllocationAward
    write_endpoint: "POST /nmtc/qeis"
    occ_field: "expected_allocation_award_version"
    description: |
      Issuing a QEI against an AllocationAward whose version has advanced since
      the client last observed it is rejected. An award legitimately accepts many
      QEIs, so the second issuance is not blocked by any state precondition: it
      would succeed on its own terms. What makes it wrong is that the client
      sized qei_amount_cents against a stale remaining_authority_cents (and a
      stale compliance_posture) that another issuance, a QEI void, a cascade from
      a QALICB eligibility failure, or an annual test has since changed. The OCC
      check reduces that to a deterministic stale-version comparison.
    error_id: ERR_STALE_AWARD_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: tract_distress_profile
    trigger: "POST /nmtc/census-tracts (once, at creation — CensusTract is immutable configuration)"
    algorithm: weighted_scoring
    formula: |
      # --- Step 1: statutory low-income-community test (OR of two prongs) ---
      is_low_income_community = (poverty_rate_pct >= 20.00) OR (mfi_ratio_pct <= 80.00)

      # --- Step 2: contiguity relief (only for tracts that FAIL step 1) ---
      qualifies_by_contiguity =
          (NOT is_low_income_community)
          AND (contiguous_lic_tract_id IS NOT NULL)
          AND (poverty_rate_pct >= 15.00)
      # NOTE: the referenced tract must itself have is_low_income_community == true,
      # else POST is rejected with ERR_TRACT_NOT_LIC_ELIGIBLE.

      eligible_for_qlici = is_low_income_community OR qualifies_by_contiguity

      # --- Step 3: severe-distress criteria count (three independent tests) ---
      severe_criteria_met_count =
            (1 if poverty_rate_pct   >= 30.00 else 0)
          + (1 if mfi_ratio_pct      <= 60.00 else 0)
          + (1 if unemployment_ratio >=  1.50 else 0)

      # --- Step 4: weighted distress score, three normalised factors ---
      poverty_factor      = min(1, poverty_rate_pct / 30.00)
      income_factor       = min(1, max(0, 80.00 - mfi_ratio_pct) / 20.00)
      unemployment_factor = min(1, max(0, unemployment_ratio - 1.00) / 0.50)
      distress_score = min(100.00, round_half_up(
            40 * poverty_factor
          + 35 * income_factor
          + 25 * unemployment_factor, 2))

      # --- Step 5: tier — BOTH a count gate and a score gate, checked in order ---
      if NOT eligible_for_qlici:                              distress_tier = INELIGIBLE
      elif severe_criteria_met_count >= 2 AND distress_score >= 75.00: distress_tier = SEVERE
      elif severe_criteria_met_count >= 1 AND distress_score >= 50.00: distress_tier = HIGH
      else:                                                   distress_tier = MODERATE
      # A tract may therefore score very high and still land MODERATE when it
      # meets zero severe criteria (e.g. poverty 28.00 / mfi 62.00 / unemp 1.40
      # -> score 88.83, severe count 0, tier MODERATE).
    input_set: "The single CensusTract being created; plus the referenced contiguous tract's is_low_income_community flag when contiguous_lic_tract_id is supplied."
    constants:
      POVERTY_LIC_THRESHOLD_PCT: 20.00
      MFI_LIC_THRESHOLD_PCT: 80.00
      CONTIGUITY_MIN_POVERTY_PCT: 15.00
      SEVERE_POVERTY_PCT: 30.00
      SEVERE_MFI_PCT: 60.00
      SEVERE_UNEMPLOYMENT_RATIO: 1.50
      POVERTY_WEIGHT: 40
      INCOME_WEIGHT: 35
      UNEMPLOYMENT_WEIGHT: 25
      POVERTY_NORMALISER_PCT: 30.00
      INCOME_NORMALISER_PCT: 20.00
      UNEMPLOYMENT_NORMALISER: 0.50
      SEVERE_TIER_MIN_CRITERIA: 2
      SEVERE_TIER_MIN_SCORE: 75.00
      HIGH_TIER_MIN_CRITERIA: 1
      HIGH_TIER_MIN_SCORE: 50.00
    precision: "poverty_rate_pct, mfi_ratio_pct and distress_score to 2 decimal places, round_half_up; unemployment_ratio to 2 decimal places; every factor is clamped to [0,1] BEFORE weighting, never after."

  - name: qalicb_eligibility_evaluation
    trigger: "POST /nmtc/qalicbs/{id}/eligibility-tests"
    algorithm: threshold
    formula: |
      # Six prongs, evaluated independently; ALL must pass for result == PASS.
      # failed_prongs is emitted in this FIXED order regardless of input order.
      prong_LOCATION          = (location_prong_passed == true)
      prong_GROSS_INCOME      = (gross_income_lic_pct        >= 50.00)
      prong_SERVICES          = (services_lic_pct            >= 40.00)
      prong_TANGIBLE_PROPERTY = (tangible_property_lic_pct    >= 40.00)
      prong_COLLECTIBLES      = (collectibles_pct             <=  5.00)
      prong_NQFP              = (nonqualified_financial_property_pct <= 5.00)

      failed_prongs = [name for name in
          [LOCATION, GROSS_INCOME, SERVICES, TANGIBLE_PROPERTY, COLLECTIBLES, NQFP]
          if prong_<name> is false]
      result = PASS if len(failed_prongs) == 0 else FAIL

      # --- QALICB.eligibility_status transition driven by the result ---
      if result == PASS:
          qalicb.eligibility_status = CERTIFIED
          qalicb.consecutive_failed_test_count = 0
          qalicb.last_certified_at = logical clock
      else:
          qalicb.consecutive_failed_test_count += 1
          qalicb.eligibility_status =
              DISQUALIFIED if qalicb.consecutive_failed_test_count >= 2 else FAILED
      qalicb.latest_test_result = result
    input_set: "Only the prong percentages supplied on this request; prior EligibilityTest rows affect nothing except consecutive_failed_test_count."
    constants:
      GROSS_INCOME_MIN_PCT: 50.00
      SERVICES_MIN_PCT: 40.00
      TANGIBLE_PROPERTY_MIN_PCT: 40.00
      COLLECTIBLES_MAX_PCT: 5.00
      NQFP_MAX_PCT: 5.00
      DISQUALIFICATION_FAIL_COUNT: 2
    precision: "All prong percentages compared at 2 decimal places with inclusive bounds (>= for floors, <= for ceilings). 50.00 gross income PASSES; 49.99 FAILS. 5.00 collectibles PASSES; 5.01 FAILS."

  - name: qei_reserve_and_net_deployable
    trigger: "POST /nmtc/qeis (once, at issuance)"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. The tier is selected from the GROSS
      # qei_amount_cents, never from a net or post-fee figure.
      # Step 1 - select reserve_bps from GROSS qei_amount_cents:
      if   qei_amount_cents <  500_000_000: reserve_bps = 500
      elif qei_amount_cents < 1_500_000_000: reserve_bps = 400
      else:                                  reserve_bps = 300
      # Step 2 - permitted fees from GROSS amount and the tier just chosen:
      permitted_fees_cents = round_half_up(qei_amount_cents * reserve_bps / 10_000)
      # Step 3 - net deployable:
      net_deployable_cents = qei_amount_cents - permitted_fees_cents
      uninvested_cash_cents = net_deployable_cents
      # Step 4 - deployment deadline, exactly one 365-day year from issuance:
      deployment_deadline_at = issued_at + 365 days
      # Worked example of the pinned order: qei_amount_cents = 500_000_000 sits
      # in the 400 bps tier -> fees 20_000_000, net 480_000_000. Deriving the
      # tier from a net figure would fall back to 500 bps and wrongly yield
      # fees 25_000_000 / net 475_000_000.
    input_set: "The single QEI being issued."
    constants:
      TIER1_CEILING_CENTS: 500000000
      TIER1_RESERVE_BPS: 500
      TIER2_CEILING_CENTS: 1500000000
      TIER2_RESERVE_BPS: 400
      TIER3_RESERVE_BPS: 300
      DEPLOYMENT_WINDOW_DAYS: 365
    precision: "Integer cents throughout; the single bps multiplication is rounded half-up once, at step 2. Tier bounds are half-open: 499_999_999 -> 500 bps, 500_000_000 -> 400 bps, 1_499_999_999 -> 400 bps, 1_500_000_000 -> 300 bps."

  - name: substantially_all_percentage
    trigger: "Recomputed on POST /nmtc/qlicis, POST /nmtc/qlicis/{id}/principal-repayments, POST /nmtc/reinvestment-obligations/{id}/reinvestments, POST /nmtc/qalicbs/{id}/eligibility-tests (cascade), and POST /nmtc/qeis/{id}/annual-tests."
    algorithm: aggregation
    formula: |
      QUALIFYING = QLICI rows of this QEI whose status IN {DEPLOYED, PARTIALLY_REPAID}
      # NON_QUALIFYING and REPAID rows contribute nothing to either numerator.

      # --- DIRECT_TRACING variant: point-in-time balance ---
      denominator_direct = qei.qei_amount_cents - qei.permitted_fees_cents
      substantially_all_pct_direct = round_half_up(
          100 * sum(q.outstanding_principal_cents for q in QUALIFYING)
          / denominator_direct, 2)

      # --- AGGREGATE_BALANCE variant: time-weighted over the test window ---
      # days_outstanding is clamped to the window: from max(window_start_at,
      # q.deployed_at) to min(window_end_at, logical clock), whole days, and a
      # NON_QUALIFYING row stops accruing at q.non_qualifying_since_at.
      numerator_aggregate = sum(q.principal_cents * days_outstanding(q) for q in QUALIFYING)
      substantially_all_pct_aggregate = round_half_up(
          100 * numerator_aggregate
          / (qei.qei_amount_cents * window_days), 2)
      # NOTE the deliberately different denominators: the direct variant nets out
      # permitted fees, the aggregate variant does NOT.

      # --- Variant selection is context-driven, not client-driven ---
      # Interim recomputes (every trigger except the annual test) ALWAYS use
      # DIRECT_TRACING, whatever award.substantially_all_method says.
      # Only POST /nmtc/qeis/{id}/annual-tests honours the award's method to pick
      # governing_pct, and it stores BOTH measured values on the test row.
      passes = (governing_pct >= 85.00)
    input_set: "QLICI rows of the QEI with status IN {DEPLOYED, PARTIALLY_REPAID}; the aggregate variant additionally needs each row's deployed_at, non_qualifying_since_at and the annual-test window bounds."
    constants:
      SUBSTANTIALLY_ALL_THRESHOLD_PCT: 85.00
      COMPLIANCE_YEAR_DAYS: 365
    precision: "2 decimal places, round_half_up, on the percentage only — never on the intermediate sums, which stay in integer cents. The threshold is inclusive: exactly 85.00 PASSES, 84.99 FAILS."
    variants:
      - name: DIRECT_TRACING
        when: "award.substantially_all_method == DIRECT_TRACING at an annual test; and unconditionally for every interim recompute."
        difference: "Point-in-time outstanding balances over a fee-netted denominator (qei_amount - permitted_fees). Ignores how long each QLICI was outstanding."
      - name: AGGREGATE_BALANCE
        when: "award.substantially_all_method == AGGREGATE_BALANCE, and only at POST /nmtc/qeis/{id}/annual-tests."
        difference: "Principal-days over (gross qei_amount x window_days). A QLICI deployed late in the window is heavily discounted, so the same data can PASS under DIRECT_TRACING and FAIL under AGGREGATE_BALANCE."

  - name: cde_asset_management_fee_allocation
    trigger: "POST /nmtc/qeis/{id}/annual-tests (allocates the year's CDE asset-management fee across the QEI's QLICIs)"
    algorithm: waterfall_allocation
    formula: |
      fee_allocation_total_cents = round_half_up(qei.qei_amount_cents * 50 / 10_000)
      TARGETS = QLICI rows of this QEI with status IN {DEPLOYED, PARTIALLY_REPAID},
                ordered by created_at ASC   # never by id
      basis = sum(q.principal_cents for q in TARGETS)
      if basis == 0 or len(TARGETS) == 0:
          the whole fee accrues: qei.accrued_unpaid_fee_cents += fee_allocation_total_cents
          and no QLICI.allocated_fee_cents changes.

      # ROUNDING ORDER IS PINNED: round EACH share first, then sum, then push the
      # signed residual onto ONE row. Rounding the running total instead would
      # produce different per-row values.
      share(q) = round_half_up(fee_allocation_total_cents * q.principal_cents / basis)
      residual = fee_allocation_total_cents - sum(share(q) for q in TARGETS)
      # residual may be negative (over-allocation) or positive (under-allocation).
      residual_target = the TARGET with the greatest outstanding_principal_cents;
                        ties broken by created_at ASC (earliest created wins).
      q.allocated_fee_cents += share(q)   for every q in TARGETS
      residual_target.allocated_fee_cents += residual
      # Worked example: fee 500_000 over principals [31_666_667, 31_666_667,
      # 31_666_666] (basis 95_000_000) gives shares [166_667, 166_667, 166_667]
      # = 500_001, residual -1, so the earliest-created largest row ends at
      # 166_666 and the final vector is [166_666, 166_667, 166_667].
    input_set: "QLICI rows of the QEI with status IN {DEPLOYED, PARTIALLY_REPAID} at the moment the annual test runs; NON_QUALIFYING and REPAID rows are excluded and their share is not redistributed to them."
    constants:
      ANNUAL_FEE_BPS: 50
    precision: "Integer cents. Per-row round_half_up, then a single signed residual adjustment, so sum(allocated_fee_cents deltas) == fee_allocation_total_cents exactly."

  - name: job_quality_compliance
    trigger: "POST /nmtc/community-benefits-agreements/{id}/annual-certifications"
    algorithm: aggregation
    formula: |
      REPORTS = JobReport rows of this CBA whose period_start_at >= window_start_at
                AND period_end_at <= window_end_at, ordered by period_start_at ASC
      # Wage gate: a report whose avg_hourly_wage_cents < cba.wage_floor_cents_per_hour
      # has wage_floor_met == false and is EXCLUDED from the job-quality numerator
      # entirely (it still counts toward local_hire_pct — see below).
      QUALIFYING = [r for r in REPORTS if r.wage_floor_met]

      # --- HEADCOUNT variant ---
      achieved_fte = sum(r.qualifying_headcount for r in QUALIFYING)
      # --- PAYROLL_HOURS variant ---
      achieved_fte = round_half_up(sum(r.qualifying_hours for r in QUALIFYING) / 2080, 2)

      compliance_pct = round_half_up(100 * achieved_fte / cba.target_fte_count, 2)

      # local_hire_pct spans ALL filed reports in the window, wage-failing ones
      # INCLUDED — a sponsor cannot improve its local-hire ratio by underpaying.
      total_hc = sum(r.headcount for r in REPORTS)
      local_hire_pct = 0.00 if total_hc == 0
                       else round_half_up(100 * sum(r.local_hires for r in REPORTS) / total_hc, 2)

      if compliance_pct >= 100.00 AND local_hire_pct >= cba.local_hire_pct_target:
          classification = CERTIFIED
      elif compliance_pct >= 80.00 AND local_hire_pct >= cba.local_hire_pct_target:
          classification = CURE_REQUIRED
      else:
          classification = SHORTFALL
      # An empty REPORTS set yields achieved_fte 0, compliance_pct 0.00,
      # local_hire_pct 0.00 and classification SHORTFALL -> immediate breach.
    input_set: "JobReport rows of the CBA fully inside the certification window. The job-quality numerator uses only wage_floor_met rows; local_hire_pct uses every row in the window."
    constants:
      FTE_ANNUAL_HOURS: 2080
      CERTIFIED_MIN_PCT: 100.00
      CURE_REQUIRED_MIN_PCT: 80.00
    precision: "achieved_fte and both percentages to 2 decimal places, round_half_up. Under HEADCOUNT achieved_fte is a whole number of people. Classification bounds are inclusive at the floor: exactly 100.00 is CERTIFIED, exactly 80.00 is CURE_REQUIRED, 79.99 is SHORTFALL."
    variants:
      - name: HEADCOUNT
        when: "cba.measurement_basis == HEADCOUNT"
        difference: "Counts qualifying_headcount bodies. A part-time-heavy project reports many hours but few heads, so it scores LOWER here than under PAYROLL_HOURS."
      - name: PAYROLL_HOURS
        when: "cba.measurement_basis == PAYROLL_HOURS"
        difference: "Converts qualifying_hours to FTE at 2080 hours/year. The same reports can land CURE_REQUIRED here and SHORTFALL under HEADCOUNT (e.g. target 25 with 18 heads / 45_000 qualifying hours -> 72.00% vs 86.52%)."

  - name: recapture_exposure
    trigger: "Recomputed whenever qei.compliance_status becomes AT_RISK or RECAPTURED (annual test failure, reinvestment breach, or CDE decertification)."
    algorithm: chronological
    formula: |
      # The 39% credit vests on a fixed statutory ladder. Cumulative bps claimed
      # after N completed compliance years:
      CUMULATIVE_CREDIT_BPS = {1: 500, 2: 1000, 3: 1500, 4: 2100, 5: 2700, 6: 3300, 7: 3900}
      years = qei.compliance_years_completed        # 0..7
      if years == 0:
          recapture_exposure_cents = 0
      else:
          claimed = round_half_up(qei.qei_amount_cents * CUMULATIVE_CREDIT_BPS[years] / 10_000)
          # Simple (never compounded) interest at 300 bps per completed year,
          # applied to the CUMULATIVE claimed amount, not year by year:
          interest = round_half_up(claimed * 300 * years / 10_000)
          recapture_exposure_cents = claimed + interest
      # Worked ladder for qei_amount_cents = 100_000_000:
      #   year 1 -> 5_000_000 +   150_000 =  5_150_000
      #   year 3 -> 15_000_000 + 1_350_000 = 16_350_000
      #   year 5 -> 27_000_000 + 4_050_000 = 31_050_000
      #   year 7 -> 39_000_000 + 8_190_000 = 47_190_000
    input_set: "The single QEI: its qei_amount_cents and its compliance_years_completed AFTER the triggering annual test has advanced that counter to compliance_year (see the ORDER PIN in POST /nmtc/qeis/{id}/annual-tests). Later years never retro-reduce an exposure already recorded."
    constants:
      CUMULATIVE_CREDIT_BPS_BY_YEAR: "{1:500, 2:1000, 3:1500, 4:2100, 5:2700, 6:3300, 7:3900}"
      RECAPTURE_INTEREST_BPS_PER_YEAR: 300
      COMPLIANCE_PERIOD_YEARS: 7
    precision: "Integer cents; two independent round_half_up steps (claimed, then interest) — never one combined multiplication."

  - name: unwind_option_pricing
    trigger: "POST /nmtc/qeis/{id}/unwind-transactions (priced once, at option-window opening)"
    algorithm: threshold
    formula: |
      fund_residual_value_cents =
            qei.uninvested_cash_cents
          + sum(q.outstanding_principal_cents for q in QLICIs of this QEI
                where status IN {DEPLOYED, PARTIALLY_REPAID, NON_QUALIFYING})
          - fund.leverage_loan_outstanding_cents
      # A NON_QUALIFYING loan is still a real receivable, so it counts here even
      # though it is excluded from every substantially-all numerator.
      put_price_cents = 100_000            # flat nominal put, never scaled
      call_price_cents = max(100_000,
          round_half_up(max(0, fund_residual_value_cents) * 250 / 10_000)
          - qei.accrued_unpaid_fee_cents)
      option_window_open_at  = qei.issued_at + 2555 days     # 7 x 365
      option_window_close_at = option_window_open_at + 90 days
      # Worked examples (leverage outstanding 35_000_000):
      #   uninvested 95_000_000, no QLICIs, accrued fee   500_000 -> residual 60_000_000, call 1_000_000
      #   uninvested 15_000_000, outstanding 80_000_000, fee 1_000_000 -> residual 60_000_000, call   500_000
      #   uninvested 0,          outstanding 95_000_000, fee 0         -> residual 60_000_000, call 1_500_000
    input_set: "The QEI, its non-REPAID QLICIs, and the funding InvestmentFund's leverage_loan_outstanding_cents."
    constants:
      PUT_PRICE_FLOOR_CENTS: 100000
      CALL_FMV_BPS: 250
      COMPLIANCE_PERIOD_DAYS: 2555
      OPTION_WINDOW_DAYS: 90
    precision: "Integer cents. The 250 bps multiplication is rounded half-up BEFORE the accrued-fee subtraction, and the 100_000 floor is applied LAST, so a large accrued fee cannot drive the call price below the floor or negative."

  - name: allocation_authority_ledger
    trigger: "POST /nmtc/qeis (draw) and POST /nmtc/qeis/{id}/void (restore)"
    algorithm: aggregation
    formula: |
      # CONSERVED INVARIANT, must hold after every request:
      award.remaining_authority_cents
        == award.allocation_amount_cents
           - sum(q.qei_amount_cents for q in QEIs of this award
                 where q.deployment_status != VOIDED)
      # Issuance draws:  remaining_authority_cents -= qei_amount_cents,
      #                  issued_qei_count += 1
      # Void restores:   remaining_authority_cents += qei_amount_cents,
      #                  issued_qei_count -= 1
      # A voided QEI's amount returns exactly, with no drift and no fee retained;
      # re-issuing the same amount afterwards must succeed.
      # Guard (business_fiscal, evaluated last): a request whose qei_amount_cents
      # exceeds remaining_authority_cents is refused with
      # ERR_INSUFFICIENT_ALLOCATION_AUTHORITY and leaves the ledger untouched.
    input_set: "All QEI rows of the award whose deployment_status != VOIDED. RECAPTURED QEIs still consume authority — recapture is a credit clawback, not an authority release."
    constants:
      AUTHORITY_FLOOR_CENTS: 0
    precision: "Integer cents, exact — no rounding is ever applied to this ledger."

  - name: qei_capital_ledger
    trigger: "POST /nmtc/qlicis, POST /nmtc/qlicis/{id}/principal-repayments, POST /nmtc/reinvestment-obligations/{id}/reinvestments"
    algorithm: aggregation
    formula: |
      # CONSERVED INVARIANT, must hold after every request touching a QEI's capital:
      qei.qei_amount_cents
        == qei.permitted_fees_cents
         + qei.uninvested_cash_cents
         + sum(q.outstanding_principal_cents for q in QLICIs of this QEI
               where q.status IN {DEPLOYED, PARTIALLY_REPAID, NON_QUALIFYING})
         + sum(q.total_repaid_cents - reinvested-forward portion ...)   # see below
      # Concretely, capital moves between exactly two buckets:
      #   deploy a QLICI:      uninvested_cash -= principal;  outstanding += principal
      #   repay principal:     outstanding -= amount;         uninvested_cash += amount
      #                        and an OPEN ReinvestmentObligation for amount is created
      #   reinvest:            uninvested_cash -= amount;     outstanding += amount
      #                        and the obligation's reinvested_cents += amount
      # A full deploy-then-repay round trip therefore returns uninvested_cash_cents
      # to its exact pre-deployment value.
      # Guards (business_fiscal, evaluated last):
      #   principal_cents > uninvested_cash_cents -> ERR_INSUFFICIENT_UNINVESTED_CASH
      #   amount_cents > outstanding_principal_cents -> ERR_REPAYMENT_EXCEEDS_PRINCIPAL
      #   reinvested_cents + amount > obligation.amount_cents -> ERR_REINVESTMENT_EXCEEDS_OBLIGATION
    input_set: "The QEI and every QLICI of it whose status != REPAID; plus that QEI's ReinvestmentObligation rows."
    constants:
      UNINVESTED_CASH_FLOOR_CENTS: 0
    precision: "Integer cents, exact. Repayment never touches permitted_fees_cents, so the fee bucket is invariant for the QEI's whole life."

  - name: award_compliance_posture
    trigger: "Recomputed after every request that changes any QEI's compliance_status, any CBA's status, or the CDE's certification_status."
    algorithm: constraint_propagation
    formula: |
      at_risk    = count(QEIs of award with compliance_status == AT_RISK)
      recaptured = count(QEIs of award with compliance_status == RECAPTURED)
      cba_breaches = count(CommunityBenefitsAgreements with this allocation_award_id
                           and status == BREACHED)
      # Evaluated top-down; the FIRST matching clause wins.
      if cde.certification_status == DECERTIFIED or recaptured >= 1:
          compliance_posture = FROZEN     # no new QEI, no new QLICI
      elif at_risk >= 2 or cba_breaches >= 1:
          compliance_posture = RESTRICTED # no new QEI; QLICIs to CERTIFIED QALICBs still allowed
      else:
          compliance_posture = UNRESTRICTED
      # The posture is fully derived: curing a QEI back to COMPLIANT lowers
      # at_risk and can move RESTRICTED -> UNRESTRICTED in the same request.
      # It is NOT sticky.

      # Severe-distress share, over currently qualifying deployments only:
      severe_outstanding = sum(q.outstanding_principal_cents for every QLICI q of
          every non-VOIDED QEI of this award where q.status IN {DEPLOYED,
          PARTIALLY_REPAID} and q.qalicb -> census_tract.distress_tier == SEVERE)
      all_outstanding = the same sum without the SEVERE filter
      severe_distress_share_pct = 0.00 if all_outstanding == 0
          else round_half_up(100 * severe_outstanding / all_outstanding, 2)
      # Reported to the agency; below award.min_severe_distress_share_pct the
      # annual agency report is flagged, but no request is refused.
    input_set: "Every non-VOIDED QEI of the award, their DEPLOYED/PARTIALLY_REPAID QLICIs, those QLICIs' QALICBs and census tracts, and every CBA pointing at the award."
    constants:
      RESTRICTED_AT_RISK_COUNT: 2
      FROZEN_RECAPTURED_COUNT: 1
      RESTRICTED_CBA_BREACH_COUNT: 1
    precision: "severe_distress_share_pct to 2 decimal places, round_half_up (e.g. severe 60_000_000 of 95_000_000 total -> 63.16). Counts are exact integers."

# =============================================================================
# 1.4 Validation Rules (evaluated strictly in ascending priority; the FIRST
#     violated rule decides the response and NOTHING is persisted)
#
#     Domain ordering rationale: this is a tax-compliance system, so regulatory
#     eligibility (safety) outranks referential wiring, which outranks temporal
#     windows, which outranks structural constraints, and money checks
#     (business_fiscal) always run LAST. A request that both draws on exhausted
#     allocation authority AND targets an uncertified QALICB therefore reports
#     the eligibility failure, never the funding failure.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: request_shape
    check: "every required input field is present, of the declared type, within any declared range, and every enum-valued field carries a declared value; unknown fields and attempts to set source: system or source: computed fields are ignored, not rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: request_shape
    check: "limit is an integer in [1,100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 6
    category: existence
    check: "every {id} path segment resolves to an existing row, validated left-to-right"
    error_id: "ERR_CDE_NOT_FOUND | ERR_ALLOCATION_AWARD_NOT_FOUND | ERR_CENSUS_TRACT_NOT_FOUND | ERR_QALICB_NOT_FOUND | ERR_INVESTMENT_FUND_NOT_FOUND | ERR_QEI_NOT_FOUND | ERR_QLICI_NOT_FOUND | ERR_REINVESTMENT_OBLIGATION_NOT_FOUND | ERR_CBA_NOT_FOUND | ERR_UNWIND_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are declared in 1.5 input"
    error_id: "ERR_CDE_NOT_FOUND | ERR_ALLOCATION_AWARD_NOT_FOUND | ERR_CENSUS_TRACT_NOT_FOUND | ERR_QALICB_NOT_FOUND | ERR_INVESTMENT_FUND_NOT_FOUND | ERR_QEI_NOT_FOUND | ERR_QLICI_NOT_FOUND"
    http_status: 404
    applies_to: "POST /nmtc/allocation-awards, POST /nmtc/census-tracts, POST /nmtc/qalicbs, POST /nmtc/qeis, POST /nmtc/qlicis, POST /nmtc/community-benefits-agreements"

  - priority: 8
    category: existence
    check: "the acting user owns the resource: a CDESponsor's X-User-ID equals the CDE that owns the target award/QEI/QLICI chain; a TaxCreditInvestor's X-User-ID equals the target InvestmentFund.investor_user_id (or UnwindTransaction.put_holder_user_id); a QALICBSponsor's X-User-ID equals the target QALICB.sponsor_user_id (or UnwindTransaction.call_holder_user_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all write endpoints acted on by CDESponsor, TaxCreditInvestor or QALICBSponsor"

  - priority: 9
    category: auth
    check: "segregation of duties: the ComplianceReviewer whose user id performed the latest EligibilityTest of any QALICB funded by this QEI may not also run the QEI's annual compliance test"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /nmtc/qeis/{id}/annual-tests"

  - priority: 10
    category: state
    check: "expected_allocation_award_version equals the award's current version"
    error_id: ERR_STALE_AWARD_VERSION
    http_status: 412
    applies_to: "POST /nmtc/qeis"

  - priority: 11
    category: business_constraint
    check: "CDE.certification_number and CensusTract.tract_code are globally unique"
    error_id: "ERR_DUPLICATE_CERTIFICATION_NUMBER | ERR_DUPLICATE_TRACT_CODE"
    http_status: 409
    applies_to: "POST /nmtc/cdes, POST /nmtc/census-tracts"

  - priority: 12
    category: state
    check: "the CDE that owns the target award is still CERTIFIED"
    error_id: ERR_CDE_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /nmtc/allocation-awards, POST /nmtc/allocation-awards/{id}/allocation-agreement, POST /nmtc/qeis, POST /nmtc/qlicis"

  - priority: 13
    category: state
    check: "the target AllocationAward.lifecycle_status == ACTIVE (the allocation agreement has been signed and the compliance period is not closed or terminated)"
    error_id: ERR_AWARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /nmtc/qeis, POST /nmtc/qlicis, POST /nmtc/community-benefits-agreements, POST /nmtc/allocation-awards/{id}/agency-reports"

  - priority: 14
    category: state
    check: "the target AllocationAward.compliance_posture permits the operation: RESTRICTED blocks new QEI issuance, FROZEN blocks both QEI issuance and QLICI deployment"
    error_id: ERR_AWARD_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /nmtc/qeis, POST /nmtc/qlicis"
    note: "PRIORITY PAIR (a), high side. Deliberately ordered ABOVE the fiscal authority check at priority 34 so a RESTRICTED award that is ALSO out of allocation authority reports the posture, not the shortfall."

  - priority: 15
    category: state
    check: "the source state permits the requested transition per the 1.2 state machines (e.g. an already-signed agreement cannot be re-signed, a FUNDED fund cannot be re-closed, a SETTLED unwind cannot be exercised, a CLOSED CBA cannot accept job reports, a VOIDED QEI cannot receive QLICIs)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 16
    category: state
    check: "the target QEI's compliance_status is not RECAPTURED — a recaptured QEI is frozen against deployment, cures, reinvestment and unwind"
    error_id: ERR_QEI_RECAPTURED
    http_status: 409
    applies_to: "POST /nmtc/qlicis, POST /nmtc/qeis/{id}/cures, POST /nmtc/qeis/{id}/unwind-transactions, POST /nmtc/reinvestment-obligations/{id}/reinvestments"

  - priority: 17
    category: state
    check: "annual tests never skip ahead: compliance_year is an integer with 1 <= compliance_year <= 7 AND compliance_year <= qei.compliance_years_completed + 1. A request for a LATER year than the next one is a sequence error here; a request for an ALREADY-TESTED year passes this rung and is caught by the window-overlap check at priority 18"
    error_id: ERR_TEST_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /nmtc/qeis/{id}/annual-tests"

  - priority: 18
    category: state
    check: "no existing AnnualComplianceTest of this QEI already covers the requested compliance_year window (windows are half-open [window_start_at, window_end_at) and must not overlap)"
    error_id: ERR_TEST_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /nmtc/qeis/{id}/annual-tests"

  - priority: 19
    category: state
    check: "the requested JobReport period does not overlap any existing report of the same CBA; periods are CLOSED intervals [period_start_at, period_end_at], so two reports sharing a single endpoint instant DO collide and there is no buffer"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /nmtc/community-benefits-agreements/{id}/job-reports"

  - priority: 20
    category: state
    check: "the QALICB is not already inside another award's seven-year compliance period: for every existing non-VOIDED QEI from a DIFFERENT allocation_award_id that funds this QALICB, the half-open interval [issued_at - 30 days, issued_at + 2555 days + 30 days) must not contain this QEI's issued_at; QLICIs funded from the SAME award are exempt"
    error_id: ERR_QALICB_COMPLIANCE_PERIOD_CONFLICT
    http_status: 409
    applies_to: "POST /nmtc/qlicis"

  - priority: 21
    category: state
    check: "the target QEI has no UnwindTransaction in status OPTION_WINDOW_OPEN, PUT_EXERCISED, CALL_EXERCISED or SETTLED; only an EXPIRED prior row allows a new one"
    error_id: ERR_UNWIND_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /nmtc/qeis/{id}/unwind-transactions"

  - priority: 22
    category: business_safety
    check: "the census tract referenced by a new QALICB has eligible_for_qlici == true; and a tract created with contiguous_lic_tract_id must reference a tract whose is_low_income_community == true"
    error_id: ERR_TRACT_NOT_LIC_ELIGIBLE
    http_status: 422
    applies_to: "POST /nmtc/census-tracts, POST /nmtc/qalicbs"

  - priority: 23
    category: business_safety
    check: "the target QALICB.eligibility_status == CERTIFIED; PENDING, RECERTIFICATION_DUE and FAILED all block new deployment"
    error_id: ERR_QALICB_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /nmtc/qlicis"
    note: "PRIORITY PAIR (b), high side. Ordered ABOVE the temporal deployment-window check at priority 29, so a QLICI aimed at a RECERTIFICATION_DUE QALICB after the deployment deadline reports the eligibility failure."

  - priority: 24
    category: business_safety
    check: "the target QALICB.eligibility_status != DISQUALIFIED — a disqualified business is permanently barred, including from cure deployments"
    error_id: ERR_QALICB_DISQUALIFIED
    http_status: 422
    applies_to: "POST /nmtc/qlicis, POST /nmtc/community-benefits-agreements, POST /nmtc/qeis/{id}/cures"

  - priority: 25
    category: business_safety
    check: "the QALICB's CommunityBenefitsAgreement is not BREACHED"
    error_id: ERR_CBA_BREACHED
    http_status: 422
    applies_to: "POST /nmtc/qlicis"

  - priority: 26
    category: business_referential
    check: "the QALICB receiving a QLICI already has a CommunityBenefitsAgreement bound to the same allocation_award_id as the funding QEI"
    error_id: ERR_CBA_MISSING
    http_status: 422
    applies_to: "POST /nmtc/qlicis"

  - priority: 27
    category: business_referential
    check: "the InvestmentFund backing a new QEI is in status FUNDED (its equity and leverage proceeds have both been received and closing has run)"
    error_id: ERR_FUND_NOT_FUNDED
    http_status: 422
    applies_to: "POST /nmtc/qeis"

  - priority: 28
    category: business_temporal
    check: "the reinvestment is made on or before obligation.reinvest_by_at (arose_at + 365 days)"
    error_id: ERR_REINVESTMENT_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /nmtc/reinvestment-obligations/{id}/reinvestments"

  - priority: 29
    category: business_temporal
    check: "the logical clock is at or before qei.deployment_deadline_at (issued_at + 365 days) when deploying new QLICI principal"
    error_id: ERR_DEPLOYMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /nmtc/qlicis"
    note: "PRIORITY PAIR (b), low side — see priority 23."

  - priority: 30
    category: business_temporal
    check: "the logical clock satisfies option_window_open_at <= now < option_window_close_at when exercising a put or call"
    error_id: ERR_OPTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /nmtc/unwind-transactions/{id}/exercise"

  - priority: 31
    category: business_constraint
    check: "the QALICB's state_code is inside the award's service_area_state_codes (skipped when the CDE's service_area_scope == NATIONAL)"
    error_id: ERR_OUTSIDE_SERVICE_AREA
    http_status: 422
    applies_to: "POST /nmtc/qlicis"

  - priority: 32
    category: business_constraint
    check: "the QEI has completed all seven compliance years (compliance_years_completed == 7) before an unwind may be opened"
    error_id: ERR_COMPLIANCE_PERIOD_NOT_COMPLETE
    http_status: 422
    applies_to: "POST /nmtc/qeis/{id}/unwind-transactions"

  - priority: 33
    category: business_fiscal
    check: "an InvestmentFund closing has received both legs in full: equity_received_cents == equity_contribution_cents AND leverage_received_cents == leverage_loan_principal_cents"
    error_id: ERR_CAPITAL_STACK_SHORTFALL
    http_status: 422
    applies_to: "POST /nmtc/investment-funds/{id}/closing"

  - priority: 34
    category: business_fiscal
    check: "qei_amount_cents <= award.remaining_authority_cents, and qei_amount_cents <= fund.capital_available_cents"
    error_id: ERR_INSUFFICIENT_ALLOCATION_AUTHORITY
    http_status: 422
    applies_to: "POST /nmtc/qeis"
    note: "PRIORITY PAIR (a), low side — see priority 14."

  - priority: 35
    category: business_fiscal
    check: "principal_cents <= qei.uninvested_cash_cents when deploying a QLICI, and amount_cents <= qei.uninvested_cash_cents when reinvesting"
    error_id: ERR_INSUFFICIENT_UNINVESTED_CASH
    http_status: 422
    applies_to: "POST /nmtc/qlicis, POST /nmtc/reinvestment-obligations/{id}/reinvestments"

  - priority: 36
    category: business_fiscal
    check: "amount_cents <= qlici.outstanding_principal_cents"
    error_id: ERR_REPAYMENT_EXCEEDS_PRINCIPAL
    http_status: 422
    applies_to: "POST /nmtc/qlicis/{id}/principal-repayments"

  - priority: 37
    category: business_fiscal
    check: "obligation.reinvested_cents + amount_cents <= obligation.amount_cents"
    error_id: ERR_REINVESTMENT_EXCEEDS_OBLIGATION
    http_status: 422
    applies_to: "POST /nmtc/reinvestment-obligations/{id}/reinvestments"

# =============================================================================
# 1.5 API Endpoints  (every business path lives under /nmtc; the single
#     test-driving endpoint lives under /_clock)
# =============================================================================
endpoints:
  # --------------------------- CDE ------------------------------------------
  - method: POST
    path: "/nmtc/cdes"
    description: "Certify a community development entity. certification_status starts CERTIFIED."
    roles: [CertifyingAgency]
    code: 201
    input: [legal_name, certification_number, service_area_scope]
    output: CDE
    side_effects: ["award_count initialised to 0"]

  - method: GET
    path: "/nmtc/cdes"
    description: "List community development entities, newest first."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["certification_status?", "service_area_scope?", "limit?", "offset?"]
    output: CDE[]
    side_effects: []

  - method: GET
    path: "/nmtc/cdes/{id}"
    description: "Read one CDE."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: []
    output: CDE
    side_effects: []

  - method: POST
    path: "/nmtc/cdes/{id}/decertification"
    description: "Decertify a CDE. Cascades to every award and every non-terminal QEI of those awards."
    roles: [CertifyingAgency]
    code: 200
    input: [decertification_reason]
    output: CDE
    side_effects:
      - "cde.certification_status = DECERTIFIED, decertified_at = logical clock"
      - "every award of the CDE with lifecycle_status ACTIVE moves to TERMINATED"
      - "every QEI of those awards with compliance_status IN {COMPLIANT, AT_RISK} moves to RECAPTURED with recapture_trigger_type = CDE_DECERTIFICATION and recapture_exposure_cents recomputed"
      - "award.compliance_posture recomputed to FROZEN; award.recaptured_qei_count updated"
      - "increments cde.version, each award.version and each QEI.version by 1"

  # ----------------------- AllocationAward ----------------------------------
  - method: POST
    path: "/nmtc/allocation-awards"
    description: "Record an allocation award to a certified CDE. lifecycle_status starts ANNOUNCED, compliance_posture starts UNRESTRICTED."
    roles: [CertifyingAgency]
    code: 201
    input: [cde_id, award_year, allocation_amount_cents, service_area_state_codes, min_severe_distress_share_pct, substantially_all_method]
    output: AllocationAward
    side_effects:
      - "remaining_authority_cents initialised to allocation_amount_cents"
      - "cde.award_count += 1; increments cde.version by 1"

  - method: GET
    path: "/nmtc/allocation-awards/{id}"
    description: "Read one allocation award, including its derived compliance_posture and severe_distress_share_pct."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: []
    output: AllocationAward
    side_effects: []

  - method: GET
    path: "/nmtc/allocation-awards"
    description: "List allocation awards, newest created_at first, with filters and pagination."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["cde_id?", "lifecycle_status?", "compliance_posture?", "award_year?", "limit?", "offset?"]
    output: AllocationAward[]
    side_effects: []

  - method: POST
    path: "/nmtc/allocation-awards/{id}/allocation-agreement"
    description: "Sign the allocation agreement, moving the award ANNOUNCED -> ACTIVE and opening it for QEI issuance."
    roles: [CDESponsor]
    code: 200
    input: [signatory_name]
    output: AllocationAward
    side_effects:
      - "lifecycle_status = ACTIVE, allocation_agreement_signed_at = logical clock"
      - "increments award.version by 1"

  - method: POST
    path: "/nmtc/allocation-awards/{id}/agency-reports"
    description: "File the annual deployment-and-impact report with the certifying agency for one award year."
    roles: [CDESponsor]
    code: 201
    input: [report_year]
    output:
      report_year: integer
      allocation_award_id: string
      issued_qei_count: integer
      deployed_principal_cents: integer
      severe_distress_share_pct: number
      severe_distress_shortfall: boolean
      at_risk_qei_count: integer
      recaptured_qei_count: integer
      cba_breach_count: integer
      qualifying_qalicb_count: integer
    side_effects:
      - "award.last_agency_report_year = report_year; award.severe_distress_share_pct recomputed"
      - "issued_qei_count = count of non-VOIDED QEIs of the award; deployed_principal_cents = sum of outstanding_principal_cents over the QLICIs of those QEIs whose status IN {DEPLOYED, PARTIALLY_REPAID}; qualifying_qalicb_count = count of DISTINCT qalicb_id over those same QLICIs; at_risk_qei_count / recaptured_qei_count / cba_breach_count are copied from the award's derived counters"
      - "severe_distress_shortfall = (severe_distress_share_pct < award.min_severe_distress_share_pct); flagged, never refused"
      - "increments award.version by 1"

  # -------------------------- CensusTract -----------------------------------
  - method: POST
    path: "/nmtc/census-tracts"
    description: "Register an immutable census tract and compute its distress profile."
    roles: [CertifyingAgency]
    code: 201
    input: ["tract_code", "state_code", "poverty_rate_pct", "mfi_ratio_pct", "unemployment_ratio", "contiguous_lic_tract_id?"]
    output: CensusTract
    side_effects: ["runs tract_distress_profile, setting is_low_income_community, qualifies_by_contiguity, eligible_for_qlici, severe_criteria_met_count, distress_score and distress_tier"]

  - method: GET
    path: "/nmtc/census-tracts/{id}"
    description: "Read one census tract."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: []
    output: CensusTract
    side_effects: []

  - method: GET
    path: "/nmtc/census-tracts"
    description: "List census tracts, newest created_at first. contiguous_lic_tract_id resolves the self-referential adjacency edge."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["state_code?", "distress_tier?", "contiguous_lic_tract_id?", "limit?", "offset?"]
    output: CensusTract[]
    side_effects: []

  # ---------------------------- QALICB --------------------------------------
  - method: POST
    path: "/nmtc/qalicbs"
    description: "Register a qualified active low-income community business. eligibility_status starts PENDING; sponsor_user_id is taken from X-User-ID."
    roles: [QALICBSponsor]
    code: 201
    input: [census_tract_id, legal_name, state_code, naics_code]
    output: QALICB
    side_effects: ["sponsor_user_id = X-User-ID (any value supplied in the body is ignored)"]

  - method: GET
    path: "/nmtc/qalicbs/{id}"
    description: "Read one QALICB."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: []
    output: QALICB
    side_effects: []

  - method: GET
    path: "/nmtc/qalicbs"
    description: "List QALICBs, newest created_at first, with filters and pagination."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["census_tract_id?", "eligibility_status?", "state_code?", "limit?", "offset?"]
    output: QALICB[]
    side_effects: []

  - method: POST
    path: "/nmtc/qalicbs/{id}/eligibility-tests"
    description: "Run the six-prong QALICB eligibility test and record the result."
    roles: [ComplianceReviewer]
    code: 201
    input: [gross_income_lic_pct, services_lic_pct, tangible_property_lic_pct, collectibles_pct, nonqualified_financial_property_pct, location_prong_passed]
    output: EligibilityTest
    side_effects:
      - "runs qalicb_eligibility_evaluation; sets result and failed_prongs in fixed prong order"
      - "moves qalicb.eligibility_status (PENDING/RECERTIFICATION_DUE/FAILED -> CERTIFIED on PASS; -> FAILED then DISQUALIFIED on the second consecutive FAIL)"
      - "ON FAIL, disqualification cascade: every QLICI of this QALICB with status IN {DEPLOYED, PARTIALLY_REPAID} -> NON_QUALIFYING; each affected QEI's substantially_all recomputed and, if governing_pct < 85.00, compliance_status COMPLIANT -> AT_RISK with cure_deadline_at = logical clock + 180 days; each affected award's at_risk_qei_count and compliance_posture recomputed"
      - "ON DISQUALIFIED, every CommunityBenefitsAgreement of this QALICB in status ACTIVE or CURE_REQUIRED -> BREACHED"
      - "ON PASS from FAILED, requalification cascade: NON_QUALIFYING QLICIs of this QALICB return to REPAID / PARTIALLY_REPAID / DEPLOYED per their repayment history and each affected QEI may move AT_RISK -> COMPLIANT"
      - "increments qalicb.version, each affected QLICI.version, QEI.version, CBA.version and award.version by 1"

  - method: GET
    path: "/nmtc/qalicbs/{id}/eligibility-tests"
    description: "List the eligibility tests of one QALICB, oldest performed_at first."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: EligibilityTest[]
    side_effects: []

  # ------------------------ InvestmentFund ----------------------------------
  - method: POST
    path: "/nmtc/investment-funds"
    description: "Form the investment fund holding the leverage loan and the tax-credit investor equity. status starts FORMED; investor_user_id is taken from X-User-ID."
    roles: [TaxCreditInvestor]
    code: 201
    input: [legal_name, equity_contribution_cents, leverage_lender_name, leverage_loan_principal_cents, leverage_loan_rate_bps]
    output: InvestmentFund
    side_effects: ["equity_received_cents, leverage_received_cents, capital_available_cents and deployed_to_qei_cents all initialised to 0"]

  - method: GET
    path: "/nmtc/investment-funds/{id}"
    description: "Read one investment fund."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: []
    output: InvestmentFund
    side_effects: []

  - method: GET
    path: "/nmtc/investment-funds"
    description: "List investment funds, newest created_at first."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["investor_user_id?", "status?", "limit?", "offset?"]
    output: InvestmentFund[]
    side_effects: []

  - method: POST
    path: "/nmtc/investment-funds/{id}/closing"
    description: "Record receipt of both capital-stack legs and close the fund, moving FORMED -> FUNDED."
    roles: [TaxCreditInvestor]
    code: 200
    input: [equity_received_cents, leverage_received_cents]
    output: InvestmentFund
    side_effects:
      - "requires equity_received_cents == equity_contribution_cents AND leverage_received_cents == leverage_loan_principal_cents, else ERR_CAPITAL_STACK_SHORTFALL"
      - "capital_available_cents = equity_received_cents + leverage_received_cents; leverage_loan_outstanding_cents = leverage_received_cents"
      - "status = FUNDED, closed_at = logical clock; increments fund.version by 1"

  # ------------------------------ QEI ---------------------------------------
  - method: POST
    path: "/nmtc/qeis"
    description: "Issue a qualified equity investment against an ACTIVE award, drawing allocation authority. Requires the award's current version."
    roles: [CDESponsor]
    code: 201
    input: [allocation_award_id, investment_fund_id, qei_amount_cents, expected_allocation_award_version]
    output: QEI
    side_effects:
      - "runs qei_reserve_and_net_deployable, setting reserve_bps, permitted_fees_cents, net_deployable_cents, uninvested_cash_cents and deployment_deadline_at (issued_at + 365 days)"
      - "issued_at = logical clock; issued_by_user_id = X-User-ID; deployment_status = ISSUED; compliance_status = COMPLIANT; compliance_years_completed = 0"
      - "award.remaining_authority_cents -= qei_amount_cents; award.issued_qei_count += 1; increments AllocationAward.version by 1"
      - "fund.deployed_to_qei_cents += qei_amount_cents; fund.capital_available_cents -= qei_amount_cents; fund.status FUNDED -> QEI_MADE; increments fund.version by 1"

  - method: GET
    path: "/nmtc/qeis/{id}"
    description: "Read one QEI, including both substantially-all measurements and its recapture exposure."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: []
    output: QEI
    side_effects: []

  - method: GET
    path: "/nmtc/qeis"
    description: "List QEIs, newest created_at first, with filters and pagination."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["allocation_award_id?", "investment_fund_id?", "deployment_status?", "compliance_status?", "limit?", "offset?"]
    output: QEI[]
    side_effects: []

  - method: POST
    path: "/nmtc/qeis/{id}/void"
    description: "Void an undeployed QEI, restoring the award's allocation authority exactly. Compensating action for issuance."
    roles: [CDESponsor]
    code: 200
    input: [void_reason]
    output: QEI
    side_effects:
      - "requires deployment_status == ISSUED with no QLICI rows, else ERR_INVALID_STATE_TRANSITION"
      - "deployment_status = VOIDED, voided_at = logical clock, uninvested_cash_cents = 0, permitted_fees_cents = 0"
      - "award.remaining_authority_cents += qei_amount_cents; award.issued_qei_count -= 1; increments AllocationAward.version by 1"
      - "fund.deployed_to_qei_cents -= qei_amount_cents; fund.capital_available_cents += qei_amount_cents; fund.status QEI_MADE -> FUNDED; increments fund.version by 1"

  - method: POST
    path: "/nmtc/qeis/{id}/annual-tests"
    description: "Run one compliance-year substantially-all test, in strict year order, allocating the year's CDE asset-management fee and sweeping deadlines."
    roles: [ComplianceReviewer]
    code: 201
    input: [compliance_year]
    output: AnnualComplianceTest
    side_effects:
      - "window_start_at = qei.issued_at + (compliance_year - 1) * 365 days; window_end_at = qei.issued_at + compliance_year * 365 days; window_days = 365"
      - "runs substantially_all_percentage for BOTH variants, stores measured_pct_direct and measured_pct_aggregate, and sets governing_method / governing_pct from award.substantially_all_method"
      - "runs cde_asset_management_fee_allocation, setting fee_allocation_total_cents and each QLICI's allocated_fee_cents (or accruing the whole fee to qei.accrued_unpaid_fee_cents when no QLICI qualifies)"
      - "sweeps every OPEN ReinvestmentObligation past reinvest_by_at to BREACHED and counts them in breached_obligation_count; any breach forces result = FAIL"
      - "sweeps every CERTIFIED QALICB funded by this QEI whose last_certified_at is more than 365 days before the logical clock to RECERTIFICATION_DUE, counted in recertification_swept_qalicb_count"
      - "sweeps any OPTION_WINDOW_OPEN UnwindTransaction of this QEI to EXPIRED once the logical clock reaches option_window_close_at"
      - "result = FAIL when governing_pct < 85.00 or breached_obligation_count > 0, else PASS"
      - "ORDER PIN: qei.compliance_years_completed = compliance_year is assigned BEFORE any recapture arithmetic, so recapture_exposure reads the year just completed; at compliance_year 7 with result PASS the QEI becomes eligible for unwind"
      - "on FAIL: compliance_status COMPLIANT -> AT_RISK with cure_deadline_at = logical clock + 180 days; a FAIL while already AT_RISK past cure_deadline_at moves to RECAPTURED, sets recapture_trigger_type = SUBSTANTIALLY_ALL_FAILURE (or REINVESTMENT_BREACH when breached_obligation_count > 0) and runs recapture_exposure against the just-advanced compliance_years_completed"
      - "on PASS: compliance_status AT_RISK -> COMPLIANT and cure_deadline_at cleared"
      - "award.at_risk_qei_count / recaptured_qei_count and compliance_posture recomputed; increments qei.version and award.version by 1"

  - method: GET
    path: "/nmtc/qeis/{id}/annual-tests"
    description: "List the annual compliance tests of one QEI, oldest compliance_year first."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: AnnualComplianceTest[]
    side_effects: []

  - method: POST
    path: "/nmtc/qeis/{id}/cures"
    description: "Cure an AT_RISK QEI by deploying additional qualifying principal before cure_deadline_at."
    roles: [CDESponsor]
    code: 200
    input: [qalicb_id, principal_cents]
    output: QEI
    side_effects:
      - "requires compliance_status == AT_RISK and logical clock <= cure_deadline_at, else ERR_INVALID_STATE_TRANSITION"
      - "creates a QLICI with created_by_cure = true, loan_class A and status DEPLOYED (discoverable via GET /nmtc/qlicis?qei_id=...)"
      - "uninvested_cash_cents -= principal_cents; substantially_all recomputed under DIRECT_TRACING"
      - "compliance_status AT_RISK -> COMPLIANT when the recomputed percentage reaches 85.00, and cure_deadline_at is cleared; otherwise the QEI stays AT_RISK"
      - "award.at_risk_qei_count and compliance_posture recomputed; increments qei.version and award.version by 1"

  - method: POST
    path: "/nmtc/qeis/{id}/unwind-transactions"
    description: "Open the put/call option window at the end of the seven-year compliance period and price both options."
    roles: [CDESponsor]
    code: 201
    input: [call_holder_user_id]
    output: UnwindTransaction
    side_effects:
      - "requires compliance_years_completed == 7 (else ERR_COMPLIANCE_PERIOD_NOT_COMPLETE) and no live unwind row (else ERR_UNWIND_ALREADY_OPEN)"
      - "put_holder_user_id = fund.investor_user_id (never taken from the body)"
      - "runs unwind_option_pricing, setting fund_residual_value_cents, put_price_cents, call_price_cents, option_window_open_at (issued_at + 2555 days) and option_window_close_at (+ 90 days)"
      - "status = OPTION_WINDOW_OPEN"

  - method: GET
    path: "/nmtc/qeis/{id}/unwind-transactions"
    description: "List the unwind transactions opened on one QEI, oldest created_at first."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: UnwindTransaction[]
    side_effects: []

  # ----------------------------- QLICI --------------------------------------
  - method: POST
    path: "/nmtc/qlicis"
    description: "Deploy a qualified low-income community investment (sub-allocation) from a QEI to a certified QALICB."
    roles: [CDESponsor]
    code: 201
    input: [qei_id, qalicb_id, loan_class, principal_cents]
    output: QLICI
    side_effects:
      - "deployed_at = logical clock; status = DEPLOYED; outstanding_principal_cents = principal_cents; total_repaid_cents = 0; created_by_cure = false"
      - "qei.uninvested_cash_cents -= principal_cents; qei.deployment_status ISSUED -> DEPLOYING, or -> FULLY_DEPLOYED once uninvested_cash_cents reaches 0"
      - "substantially_all recomputed under DIRECT_TRACING; qei.compliance_status may move AT_RISK -> COMPLIANT"
      - "qalicb.funding_qlici_count += 1; award.severe_distress_share_pct and compliance_posture recomputed"
      - "increments qei.version, qalicb.version and award.version by 1"

  - method: GET
    path: "/nmtc/qlicis/{id}"
    description: "Read one QLICI."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: []
    output: QLICI
    side_effects: []

  - method: GET
    path: "/nmtc/qlicis"
    description: "List QLICIs, newest created_at first, with filters and pagination."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["qei_id?", "qalicb_id?", "status?", "loan_class?", "limit?", "offset?"]
    output: QLICI[]
    side_effects: []

  - method: POST
    path: "/nmtc/qlicis/{id}/principal-repayments"
    description: "Record a principal repayment on a QLICI, returning capital to the QEI and creating a reinvestment obligation."
    roles: [CDESponsor]
    code: 200
    input: [amount_cents]
    output: QLICI
    side_effects:
      - "HOP 1: outstanding_principal_cents -= amount_cents; total_repaid_cents += amount_cents; status -> PARTIALLY_REPAID or REPAID"
      - "HOP 2: qei.uninvested_cash_cents += amount_cents; a ReinvestmentObligation is created with amount_cents, arose_at = logical clock and reinvest_by_at = arose_at + 365 days (discoverable via GET /nmtc/reinvestment-obligations?source_qlici_id=...); qei.deployment_status -> REINVESTMENT_PENDING"
      - "HOP 3: substantially_all recomputed under DIRECT_TRACING; qei.compliance_status COMPLIANT -> AT_RISK when the recomputed percentage drops below 85.00, with cure_deadline_at = logical clock + 180 days"
      - "award.at_risk_qei_count, severe_distress_share_pct and compliance_posture recomputed"
      - "increments qlici.version, qei.version and award.version by 1"

  # ---------------------- ReinvestmentObligation ----------------------------
  - method: GET
    path: "/nmtc/reinvestment-obligations/{id}"
    description: "Read one reinvestment obligation."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: []
    output: ReinvestmentObligation
    side_effects: []

  - method: GET
    path: "/nmtc/reinvestment-obligations"
    description: "List reinvestment obligations, oldest arose_at first, with filters and pagination."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["qei_id?", "source_qlici_id?", "status?", "limit?", "offset?"]
    output: ReinvestmentObligation[]
    side_effects: []

  - method: POST
    path: "/nmtc/reinvestment-obligations/{id}/reinvestments"
    description: "Redeploy returned capital into an existing qualifying QLICI of the same QEI, satisfying the obligation."
    roles: [CDESponsor]
    code: 200
    input: [target_qlici_id, amount_cents]
    output: ReinvestmentObligation
    side_effects:
      - "reinvested_cents += amount_cents; status -> SATISFIED once reinvested_cents == amount_cents, with satisfied_at = logical clock"
      - "target QLICI principal_cents and outstanding_principal_cents both += amount_cents; qei.uninvested_cash_cents -= amount_cents"
      - "substantially_all recomputed under DIRECT_TRACING; qei.deployment_status REINVESTMENT_PENDING -> DEPLOYING or FULLY_DEPLOYED; qei.compliance_status may move AT_RISK -> COMPLIANT"
      - "increments obligation.version, qlici.version, qei.version and award.version by 1"

  # ------------------ CommunityBenefitsAgreement ----------------------------
  - method: POST
    path: "/nmtc/community-benefits-agreements"
    description: "Bind a QALICB to job quality, local hiring and reporting commitments under one allocation award. status starts ACTIVE."
    roles: [CDESponsor]
    code: 201
    input: [qalicb_id, allocation_award_id, target_fte_count, wage_floor_cents_per_hour, local_hire_pct_target, measurement_basis]
    output: CommunityBenefitsAgreement
    side_effects: ["agreement_start_at = logical clock; consecutive_cure_required_count = 0; latest_compliance_pct and latest_local_hire_pct = 0.00"]

  - method: GET
    path: "/nmtc/community-benefits-agreements/{id}"
    description: "Read one community benefits agreement."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: []
    output: CommunityBenefitsAgreement
    side_effects: []

  - method: GET
    path: "/nmtc/community-benefits-agreements"
    description: "List community benefits agreements, newest created_at first, with filters and pagination."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["qalicb_id?", "allocation_award_id?", "status?", "limit?", "offset?"]
    output: CommunityBenefitsAgreement[]
    side_effects: []

  - method: POST
    path: "/nmtc/community-benefits-agreements/{id}/job-reports"
    description: "File one job-quality reporting period for a community benefits agreement. Periods are closed intervals and must not overlap."
    roles: [QALICBSponsor]
    code: 201
    input: [period_start_at, period_end_at, headcount, qualifying_headcount, total_hours, qualifying_hours, local_hires, avg_hourly_wage_cents]
    output: JobReport
    side_effects:
      - "wage_floor_met = (avg_hourly_wage_cents >= cba.wage_floor_cents_per_hour); a false value excludes the report from the job-quality numerator but not from local_hire_pct"
      - "filed_by_user_id = X-User-ID; filed_at = logical clock"

  - method: GET
    path: "/nmtc/community-benefits-agreements/{id}/job-reports"
    description: "List the job reports filed under one agreement, oldest period_start_at first."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: ["wage_floor_met?", "limit?", "offset?"]
    output: JobReport[]
    side_effects: []

  - method: POST
    path: "/nmtc/community-benefits-agreements/{id}/annual-certifications"
    description: "Certify one year of community benefits performance from the job reports inside the window."
    roles: [ComplianceReviewer]
    code: 201
    input: [certification_year, window_start_at, window_end_at]
    output:
      community_benefits_agreement_id: string
      certification_year: integer
      measurement_basis: string
      achieved_fte: number
      compliance_pct: number
      local_hire_pct: number
      classification: string
      report_count: integer
      excluded_wage_failing_report_count: integer
      resulting_status: string
    side_effects:
      - "runs job_quality_compliance under cba.measurement_basis, producing classification CERTIFIED | CURE_REQUIRED | SHORTFALL"
      - "moves cba.status per the 1.2 machine (ACTIVE <-> CURE_REQUIRED, or -> BREACHED on SHORTFALL or a second consecutive CURE_REQUIRED)"
      - "sets latest_compliance_pct, latest_local_hire_pct, consecutive_cure_required_count and (on CERTIFIED) last_certified_year"
      - "on BREACHED, award.cba_breach_count and compliance_posture are recomputed; increments cba.version and award.version by 1"

  # ----------------------- UnwindTransaction --------------------------------
  - method: GET
    path: "/nmtc/unwind-transactions/{id}"
    description: "Read one unwind transaction, including both option prices."
    roles: [CertifyingAgency, CDESponsor, ComplianceReviewer, TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: []
    output: UnwindTransaction
    side_effects: []

  - method: POST
    path: "/nmtc/unwind-transactions/{id}/exercise"
    description: "Exercise the put (investor) or the call (QALICB sponsor) inside the option window. The two branches have divergent side-effect sets."
    roles: [TaxCreditInvestor, QALICBSponsor]
    code: 200
    input: [option_type]
    output: UnwindTransaction
    side_effects:
      - "PUT requires X-User-ID == put_holder_user_id and the TaxCreditInvestor role; CALL requires X-User-ID == call_holder_user_id and the QALICBSponsor role"
      - "settlement_amount_cents = put_price_cents on a PUT, call_price_cents on a CALL; exercised_at = logical clock"
      - "CALL ONLY: qei.accrued_unpaid_fee_cents swept to 0 and qei.version incremented; the PUT branch leaves it untouched"
      - "increments unwind.version by 1"

  - method: POST
    path: "/nmtc/unwind-transactions/{id}/settlement"
    description: "Settle an exercised option, releasing the QEI and winding up the fund."
    roles: [CDESponsor]
    code: 200
    input: [settlement_reference]
    output: UnwindTransaction
    side_effects:
      - "status -> SETTLED, settled_at = logical clock"
      - "qei.deployment_status -> UNWOUND and compliance_status -> RELEASED; every non-REPAID QLICI of the QEI -> REPAID with outstanding_principal_cents 0"
      - "fund.status -> WOUND_UP and fund.leverage_loan_outstanding_cents -> 0"
      - "when every non-VOIDED QEI of the award is UNWOUND, award.lifecycle_status ACTIVE -> COMPLIANCE_PERIOD_CLOSED and every ACTIVE/CURE_REQUIRED CBA of that award -> CLOSED"
      - "increments unwind.version, qei.version, each QLICI.version, fund.version and (when touched) award.version and CBA.version by 1"

  # ------------------------- test-driving clock -----------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, window and deemed-expiry rule reads. Before any call the clock reads exactly 2026-08-01T00:00:00.000Z and MUST NOT fall back to wall-clock time. The clock may move backwards as well as forwards."
    roles: [CertifyingAgency]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
    side_effects: ["no entity is mutated; only subsequent requests observe the new instant"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role missing/empty, or X-User-Role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "the acting CDESponsor does not own the award chain, the acting TaxCreditInvestor is not the fund's investor_user_id / put_holder_user_id, or the acting QALICBSponsor is not the QALICB's sponsor_user_id / the unwind's call_holder_user_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the ComplianceReviewer who performed the latest eligibility test of a QALICB funded by this QEI attempts to run the QEI's annual compliance test"

  # ---- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, mistyped, out of range, or carries an undeclared enum value"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1,100] or offset negative or non-integer"

  # ---- existence ----------------------------------------------------------
  - id: ERR_CDE_NOT_FOUND
    http: 404
    condition: "no CDE with the given id"
  - id: ERR_ALLOCATION_AWARD_NOT_FOUND
    http: 404
    condition: "no AllocationAward with the given id"
  - id: ERR_CENSUS_TRACT_NOT_FOUND
    http: 404
    condition: "no CensusTract with the given id (including contiguous_lic_tract_id)"
  - id: ERR_QALICB_NOT_FOUND
    http: 404
    condition: "no QALICB with the given id"
  - id: ERR_INVESTMENT_FUND_NOT_FOUND
    http: 404
    condition: "no InvestmentFund with the given id"
  - id: ERR_QEI_NOT_FOUND
    http: 404
    condition: "no QEI with the given id"
  - id: ERR_QLICI_NOT_FOUND
    http: 404
    condition: "no QLICI with the given id (including target_qlici_id on a reinvestment)"
  - id: ERR_REINVESTMENT_OBLIGATION_NOT_FOUND
    http: 404
    condition: "no ReinvestmentObligation with the given id"
  - id: ERR_CBA_NOT_FOUND
    http: 404
    condition: "no CommunityBenefitsAgreement with the given id"
  - id: ERR_UNWIND_NOT_FOUND
    http: 404
    condition: "no UnwindTransaction with the given id"

  # ---- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_AWARD_VERSION
    http: 412
    condition: "expected_allocation_award_version does not equal the award's current version at POST /nmtc/qeis"

  # ---- uniqueness --------------------------------------------------------
  - id: ERR_DUPLICATE_CERTIFICATION_NUMBER
    http: 409
    condition: "another CDE already holds this certification_number"
  - id: ERR_DUPLICATE_TRACT_CODE
    http: 409
    condition: "another CensusTract already holds this tract_code"

  # ---- state -------------------------------------------------------------
  - id: ERR_CDE_NOT_CERTIFIED
    http: 409
    condition: "the CDE owning the award has certification_status DECERTIFIED"
  - id: ERR_AWARD_NOT_ACTIVE
    http: 409
    condition: "the award's lifecycle_status is ANNOUNCED, COMPLIANCE_PERIOD_CLOSED or TERMINATED where ACTIVE is required"
  - id: ERR_AWARD_POSTURE_RESTRICTED
    http: 409
    condition: "the award's compliance_posture is RESTRICTED (blocks QEI issuance) or FROZEN (blocks QEI issuance and QLICI deployment)"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested action is not a declared transition from the resource's current state (re-signing an agreement, re-closing a fund, voiding a deployed QEI, curing a COMPLIANT QEI or one past cure_deadline_at, exercising a settled unwind, reporting under a CLOSED agreement)"
  - id: ERR_QEI_RECAPTURED
    http: 409
    condition: "the target QEI's compliance_status is RECAPTURED, freezing deployment, cures, reinvestment and unwind"
  - id: ERR_TEST_SEQUENCE_INVALID
    http: 409
    condition: "compliance_year > qei.compliance_years_completed + 1 (a skipped year), or compliance_year outside 1..7"
  - id: ERR_TEST_WINDOW_OVERLAP
    http: 409
    condition: "the requested annual-test window overlaps an existing test window of the same QEI (half-open intervals) — reached when compliance_year names an already-tested year, which priority 17 deliberately lets through"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "the requested job-report period overlaps an existing report period of the same agreement (closed intervals; a shared endpoint instant collides)"
  - id: ERR_QALICB_COMPLIANCE_PERIOD_CONFLICT
    http: 409
    condition: "the QALICB is already inside another award's seven-year compliance period, including the 30-day symmetric buffer; QLICIs from the same award are exempt"
  - id: ERR_UNWIND_ALREADY_OPEN
    http: 409
    condition: "the QEI already has an UnwindTransaction that is not EXPIRED"

  # ---- business: safety / regulatory eligibility -------------------------
  - id: ERR_TRACT_NOT_LIC_ELIGIBLE
    http: 422
    condition: "the referenced census tract has eligible_for_qlici false, or a contiguity claim points at a tract that is not itself a low-income community"
  - id: ERR_QALICB_NOT_CERTIFIED
    http: 422
    condition: "the target QALICB's eligibility_status is PENDING, RECERTIFICATION_DUE or FAILED where CERTIFIED is required"
  - id: ERR_QALICB_DISQUALIFIED
    http: 422
    condition: "the target QALICB's eligibility_status is DISQUALIFIED (permanent bar)"
  - id: ERR_CBA_BREACHED
    http: 422
    condition: "the target QALICB's community benefits agreement is BREACHED"

  # ---- business: referential wiring --------------------------------------
  - id: ERR_CBA_MISSING
    http: 422
    condition: "the QALICB has no CommunityBenefitsAgreement bound to the funding QEI's allocation award"
  - id: ERR_FUND_NOT_FUNDED
    http: 422
    condition: "the InvestmentFund backing a new QEI is not in status FUNDED"

  # ---- business: temporal windows ----------------------------------------
  - id: ERR_DEPLOYMENT_WINDOW_CLOSED
    http: 422
    condition: "the logical clock is past qei.deployment_deadline_at (issued_at + 365 days)"
  - id: ERR_OPTION_WINDOW_CLOSED
    http: 422
    condition: "the logical clock is before option_window_open_at or at/after option_window_close_at"
  - id: ERR_REINVESTMENT_DEADLINE_PASSED
    http: 422
    condition: "the logical clock is past obligation.reinvest_by_at (arose_at + 365 days)"

  # ---- business: structural constraints ----------------------------------
  - id: ERR_OUTSIDE_SERVICE_AREA
    http: 422
    condition: "the QALICB's state_code is outside the award's service_area_state_codes and the CDE's service_area_scope is not NATIONAL"
  - id: ERR_COMPLIANCE_PERIOD_NOT_COMPLETE
    http: 422
    condition: "an unwind is opened before qei.compliance_years_completed reaches 7"

  # ---- business: fiscal (always evaluated last) --------------------------
  - id: ERR_CAPITAL_STACK_SHORTFALL
    http: 422
    condition: "a fund closing reports equity or leverage proceeds short of the committed amounts"
  - id: ERR_INSUFFICIENT_ALLOCATION_AUTHORITY
    http: 422
    condition: "qei_amount_cents exceeds award.remaining_authority_cents or fund.capital_available_cents"
  - id: ERR_INSUFFICIENT_UNINVESTED_CASH
    http: 422
    condition: "a QLICI deployment, cure or reinvestment exceeds qei.uninvested_cash_cents"
  - id: ERR_REPAYMENT_EXCEEDS_PRINCIPAL
    http: 422
    condition: "amount_cents exceeds qlici.outstanding_principal_cents"
  - id: ERR_REINVESTMENT_EXCEEDS_OBLIGATION
    http: 422
    condition: "reinvested_cents + amount_cents would exceed obligation.amount_cents"

# =============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: CertifyingAgency
    description: "The federal certifying and allocating agency. Certifies and decertifies CDEs, announces allocation awards, registers census-tract data, and drives the logical clock. Never touches deployment, testing or unwind."
    identity: "opaque"
    exclusive_operations:
      - "POST /nmtc/cdes"
      - "POST /nmtc/cdes/{id}/decertification"
      - "POST /nmtc/allocation-awards"
      - "POST /nmtc/census-tracts"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET under /nmtc"

  - name: CDESponsor
    description: "The allocatee community development entity itself. Signs the allocation agreement, issues and voids QEIs, deploys and collects QLICIs, redeploys returned capital, cures at-risk QEIs, binds community benefits agreements, files agency reports, and opens and settles unwinds. Explicitly cannot run any compliance test."
    identity: "entity_backed:CDE"
    exclusive_operations:
      - "POST /nmtc/allocation-awards/{id}/allocation-agreement"
      - "POST /nmtc/allocation-awards/{id}/agency-reports"
      - "POST /nmtc/qeis"
      - "POST /nmtc/qeis/{id}/void"
      - "POST /nmtc/qeis/{id}/cures"
      - "POST /nmtc/qeis/{id}/unwind-transactions"
      - "POST /nmtc/qlicis"
      - "POST /nmtc/qlicis/{id}/principal-repayments"
      - "POST /nmtc/reinvestment-obligations/{id}/reinvestments"
      - "POST /nmtc/community-benefits-agreements"
      - "POST /nmtc/unwind-transactions/{id}/settlement"
    shared_operations:
      - "every GET under /nmtc"
    note: "X-User-ID equals a CDE.id. Ownership reaches through award.cde_id, and transitively through QEI -> award -> cde and QLICI -> QEI -> award -> cde."

  - name: ComplianceReviewer
    description: "Independent compliance function. Runs QALICB eligibility tests, QEI annual substantially-all tests, and community benefits annual certifications. Cannot move money, issue QEIs or sign anything."
    identity: "opaque"
    exclusive_operations:
      - "POST /nmtc/qalicbs/{id}/eligibility-tests"
      - "POST /nmtc/qeis/{id}/annual-tests"
      - "POST /nmtc/community-benefits-agreements/{id}/annual-certifications"
    shared_operations:
      - "every GET under /nmtc"
    note: "Segregation of duties: the reviewer user id recorded on a QALICB's latest EligibilityTest is barred from running the annual test of any QEI funding that QALICB. Two distinct ComplianceReviewer user ids are therefore required to exercise the full compliance chain."

  - name: TaxCreditInvestor
    description: "The tax-credit investor that capitalises the investment fund alongside the leverage lender, and holds the put option at unwind."
    identity: "opaque"
    exclusive_operations:
      - "POST /nmtc/investment-funds"
      - "POST /nmtc/investment-funds/{id}/closing"
    shared_operations:
      - "POST /nmtc/unwind-transactions/{id}/exercise (PUT branch only)"
      - "every GET under /nmtc"
    note: "X-User-ID is an operator identifier stored on InvestmentFund.investor_user_id at creation and copied to UnwindTransaction.put_holder_user_id when the option window opens; it is never required to equal any entity's id."

  - name: QALICBSponsor
    description: "The sponsor of the qualified active low-income community business. Registers the business, files its job reports, and holds the call option at unwind."
    identity: "opaque"
    exclusive_operations:
      - "POST /nmtc/qalicbs"
      - "POST /nmtc/community-benefits-agreements/{id}/job-reports"
    shared_operations:
      - "POST /nmtc/unwind-transactions/{id}/exercise (CALL branch only)"
      - "every GET under /nmtc"
    note: "X-User-ID is an operator identifier stored on QALICB.sponsor_user_id at creation; the CDE names the call holder explicitly when opening the unwind, so the call holder need not be the sponsor of any particular QALICB."
