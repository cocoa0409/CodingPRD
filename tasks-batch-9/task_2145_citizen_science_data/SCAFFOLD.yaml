scenario: "desgin task harder than expert level.!!!!2145. Citizen Science Data Collection Program (Audubon style citizen science project): protocol design & volunteer training/certification, observation submission with location/time & photo evidence, data validation & expert verification queue, data quality scoring by observer & feedback, seasonal campaign & sampling coverage gaps, equipment loan & calibration, data publication & research partner access, volunteer recognition & retention"
domain_name: citizen-science-data-collection
api_prefix: /citizen-science

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: beyond_expert
  notes: |
    Weighted multi-expert verification quorum (multi_party_negotiation) drives the Observation
    lifecycle, which carries two independent state dimensions (review_status x publication_status)
    plus a bounded revision cycle. Layered on top: two structurally different interval-overlap
    regimes (half-open equipment-loan intervals with a post-return quarantine buffer on Equipment,
    versus closed inclusive season-date intervals on Protocol), a self-referential Protocol version
    chain, and a points ledger whose sum must equal the denormalized Volunteer.lifetime_points at
    all times.

entities:
  - name: Protocol
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: human-readable protocol code
        constraints: "unique across all Protocol rows regardless of status"
      - name: title
        type: string
        source: input
        description: descriptive protocol title
      - name: version_number
        type: integer
        source: computed
        description: "1 when supersedes_protocol_id is null, otherwise superseded protocol's version_number + 1"
        default: 1
      - name: supersedes_protocol_id
        type: string
        source: input
        description: "FK -> Protocol.id; null for a first-generation protocol, self-referential version chain"
        default: null
      - name: status
        type: enum
        source: system
        description: protocol lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, RETIRED}"
      - name: required_certification_level
        type: enum
        source: input
        description: minimum Certification.level a volunteer must hold to submit under this protocol
        constraints: "one of {BASIC, ADVANCED, EXPERT}; ordinal rank BASIC=1, ADVANCED=2, EXPERT=3"
      - name: min_photo_count
        type: integer
        source: input
        description: minimum number of ACCEPTED PhotoEvidence rows required before review may start
        constraints: ">= 0"
      - name: max_submission_lag_hours
        type: integer
        source: input
        description: maximum permitted hours between Observation.observed_at and Observation.submitted_at
        constraints: "> 0"
      - name: required_equipment_type
        type: enum
        source: input
        description: equipment class an observation must be backed by
        default: NONE
        constraints: "one of {NONE, ACOUSTIC_RECORDER, GPS_LOGGER, SPOTTING_SCOPE}"
      - name: certification_valid_days
        type: integer
        source: input
        description: days a granted Certification stays CERTIFIED before the maintenance run expires it
        default: 365
        constraints: "> 0"
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant at which the protocol moved DRAFT -> ACTIVE
        default: null

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: volunteer display name
      - name: email
        type: string
        source: input
        description: contact email
        constraints: "unique across all Volunteer rows"
      - name: home_region_code
        type: string
        source: input
        description: region code used for campaign eligibility reporting
      - name: status
        type: enum
        source: system
        description: volunteer standing
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, PROBATION, SUSPENDED}"
      - name: quality_score
        type: number
        source: computed
        description: "rolling_window variant of volunteer_quality_score (4 dp); the gate used by eligibility checks"
        default: 0.5
      - name: lifetime_quality_score
        type: number
        source: computed
        description: "lifetime_weighted variant of volunteer_quality_score (4 dp); the input to recognition_tier"
        default: 0.5
      - name: recognition_tier
        type: enum
        source: computed
        description: recognition band derived from lifetime_quality_score
        default: BRONZE
        constraints: "one of {BRONZE, SILVER, GOLD, PLATINUM}"
      - name: lifetime_points
        type: integer
        source: computed
        description: denormalized sum of RecognitionAward.points_awarded for this volunteer
        default: 0
      - name: accepted_observation_count
        type: integer
        source: computed
        description: count of this volunteer's Observations with review_status ACCEPTED
        default: 0
      - name: rejected_observation_count
        type: integer
        source: computed
        description: count of this volunteer's Observations with review_status in {REJECTED, RETRACTED}
        default: 0
      - name: consecutive_accepted
        type: integer
        source: computed
        description: length of the current unbroken run of ACCEPTED adjudications
        default: 0
      - name: consecutive_rejections
        type: integer
        source: computed
        description: length of the current unbroken run of REJECTED adjudications
        default: 0

  - name: Expert
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: expert display name
      - name: specialty_taxon
        type: string
        source: input
        description: taxonomic group this expert verifies
      - name: verification_weight
        type: number
        source: input
        description: base weight this expert's vote carries in verification_consensus
        constraints: "0.50 <= verification_weight <= 4.00, 2 dp"
      - name: linked_volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; the Volunteer account this expert also submits observations under; null when the expert never submits"
        default: null
      - name: status
        type: enum
        source: system
        description: expert standing
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: vote_count
        type: integer
        source: computed
        description: number of VerificationVote rows cast by this expert
        default: 0
      - name: retracted_confirm_count
        type: integer
        source: computed
        description: number of deciding-round CONFIRM votes by this expert whose observation was later RETRACTED
        default: 0

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id"
      - name: protocol_id
        type: string
        source: input
        description: "FK -> Protocol.id"
      - name: trainer_expert_id
        type: string
        source: input
        description: "FK -> Expert.id; the Expert who ran the training session and is therefore barred from round-0 verification of this volunteer's observations under this protocol"
      - name: level
        type: enum
        source: input
        description: certification level attained
        constraints: "one of {BASIC, ADVANCED, EXPERT}; ordinal rank BASIC=1, ADVANCED=2, EXPERT=3"
      - name: status
        type: enum
        source: system
        description: certification lifecycle state
        default: ENROLLED
        constraints: "one of {ENROLLED, TRAINED, CERTIFIED, SUSPENDED, EXPIRED, REVOKED}"
      - name: exam_score
        type: integer
        source: system
        description: score recorded by the complete-training action
        default: null
        constraints: "0..100"
      - name: granted_at
        type: datetime
        source: system
        description: logical-clock instant at which status became CERTIFIED
        default: null
      - name: expires_at
        type: datetime
        source: system
        description: granted_at + Protocol.certification_valid_days
        default: null
      - name: suspended_reason
        type: enum
        source: system
        description: why the certification was suspended
        default: NONE
        constraints: "one of {NONE, QUALITY_PROBATION}"

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: campaign display name
      - name: protocol_id
        type: string
        source: input
        description: "FK -> Protocol.id"
      - name: season_start_date
        type: string
        source: input
        description: "inclusive first calendar date of the sampling season, ISO date YYYY-MM-DD"
      - name: season_end_date
        type: string
        source: input
        description: "inclusive last calendar date of the sampling season, ISO date YYYY-MM-DD"
        constraints: "season_end_date >= season_start_date"
      - name: status
        type: enum
        source: system
        description: campaign lifecycle state
        default: PLANNED
        constraints: "one of {PLANNED, OPEN, CLOSED, PUBLISHED, ARCHIVED}"
      - name: target_observations_per_site
        type: integer
        source: input
        description: accepted-observation target used by campaign_coverage_score
        constraints: "> 0"
      - name: coverage_score
        type: number
        source: computed
        description: mean of per-site coverage_ratio values, 4 dp
        default: 0.0
      - name: gap_count
        type: integer
        source: computed
        description: number of SurveySite children whose coverage_ratio < 0.50
        default: 0
      - name: site_count
        type: integer
        source: computed
        description: number of SurveySite children
        default: 0
      - name: accepted_observation_count
        type: integer
        source: computed
        description: count of Observations in this campaign with review_status ACCEPTED
        default: 0

  - name: SurveySite
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id"
      - name: site_code
        type: string
        source: input
        description: site identifier code
        constraints: "unique within the owning campaign_id"
      - name: latitude
        type: number
        source: input
        description: site latitude in decimal degrees
      - name: longitude
        type: number
        source: input
        description: site longitude in decimal degrees
      - name: habitat_type
        type: enum
        source: input
        description: habitat classification
        constraints: "one of {WETLAND, FOREST, GRASSLAND, URBAN, COASTAL}"
      - name: priority_weight
        type: number
        source: input
        description: site multiplier fed into observation_quality_points
        default: 1.0
        constraints: "0.50 <= priority_weight <= 2.00, 2 dp"
      - name: accepted_observation_count
        type: integer
        source: computed
        description: count of Observations at this site with review_status ACCEPTED
        default: 0
      - name: coverage_ratio
        type: number
        source: computed
        description: "min(1.0, accepted_observation_count / Campaign.target_observations_per_site) rounded to 2 dp"
        default: 0.0
      - name: coverage_status
        type: enum
        source: computed
        description: coverage band derived from coverage_ratio and saturation
        default: GAP
        constraints: "one of {GAP, UNDER, MET, SATURATED}"

  - name: Observation
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id"
      - name: site_id
        type: string
        source: input
        description: "FK -> SurveySite.id; must belong to campaign_id"
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; must equal X-User-ID when the caller acts as Volunteer"
      - name: equipment_loan_id
        type: string
        source: input
        description: "FK -> EquipmentLoan.id; null only when the campaign's protocol has required_equipment_type NONE"
        default: null
      - name: publication_id
        type: string
        source: system
        description: "FK -> DataPublication.id; set when the observation is bound into a publication"
        default: null
      - name: observed_at
        type: datetime
        source: input
        description: instant the observation was made in the field
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent SUBMITTED entry (initial submit or resubmit)
      - name: latitude
        type: number
        source: input
        description: observation latitude in decimal degrees
      - name: longitude
        type: number
        source: input
        description: observation longitude in decimal degrees
      - name: species_code
        type: string
        source: input
        description: species identifier
      - name: count_value
        type: integer
        source: input
        description: number of individuals counted
        constraints: ">= 0"
      - name: photo_count
        type: integer
        source: computed
        description: count of PhotoEvidence children with status ACCEPTED
        default: 0
      - name: review_status
        type: enum
        source: system
        description: verification dimension of the parallel state machine
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, NEEDS_REVISION, ACCEPTED, REJECTED, RETRACTED}"
      - name: publication_status
        type: enum
        source: system
        description: publication dimension of the parallel state machine, evolves independently of review_status
        default: UNPUBLISHED
        constraints: "one of {UNPUBLISHED, QUEUED, PUBLISHED, WITHDRAWN}"
      - name: revision_round
        type: integer
        source: system
        description: number of completed NEEDS_REVISION -> SUBMITTED loops
        default: 0
      - name: provisional_quality_points
        type: number
        source: computed
        description: observation_quality_points provisional variant, 2 dp
        default: 0.0
      - name: final_quality_points
        type: number
        source: computed
        description: observation_quality_points final variant, 2 dp; stays 0.0 until review_status becomes ACCEPTED
        default: 0.0
      - name: consensus_confidence
        type: number
        source: computed
        description: weighted mean confidence of CONFIRM votes in the deciding round, 4 dp
        default: 0.0
      - name: confirm_weight
        type: number
        source: computed
        description: sum of weight_applied over current-round CONFIRM votes, 4 dp
        default: 0.0
      - name: reject_weight
        type: number
        source: computed
        description: sum of weight_applied over current-round REJECT votes, 4 dp
        default: 0.0
      - name: revision_weight
        type: number
        source: computed
        description: sum of weight_applied over current-round REQUEST_REVISION votes, 4 dp
        default: 0.0

  - name: PhotoEvidence
    parent: Observation
    common_fields: true
    fields:
      - name: observation_id
        type: string
        source: input
        description: "FK -> Observation.id"
      - name: file_hash
        type: string
        source: input
        description: content hash of the uploaded image
        constraints: "unique within the owning observation_id"
      - name: captured_at
        type: datetime
        source: input
        description: EXIF capture instant
      - name: exif_latitude
        type: number
        source: input
        description: EXIF latitude in decimal degrees
      - name: exif_longitude
        type: number
        source: input
        description: EXIF longitude in decimal degrees
      - name: geo_delta_meters
        type: number
        source: computed
        description: planar distance between the EXIF fix and the observation fix, 2 dp
        default: 0.0
      - name: status
        type: enum
        source: computed
        description: evidence acceptance state, decided at upload time
        default: ACCEPTED
        constraints: "one of {ACCEPTED, FLAGGED_MISMATCH, REJECTED}"

  - name: VerificationVote
    parent: Observation
    common_fields: false
    fields:
      - name: observation_id
        type: string
        source: input
        description: "FK -> Observation.id"
      - name: expert_id
        type: string
        source: input
        description: "FK -> Expert.id"
      - name: round_number
        type: integer
        source: system
        description: value of Observation.revision_round at insert time
      - name: decision
        type: enum
        source: input
        description: this expert's adjudication
        constraints: "one of {CONFIRM, REJECT, REQUEST_REVISION}"
      - name: confidence
        type: integer
        source: input
        description: self-reported confidence
        constraints: "1 <= confidence <= 5"
      - name: weight_applied
        type: number
        source: computed
        description: "round(Expert.verification_weight * (0.6 + 0.1 * confidence), 4)"
      - name: comment
        type: string
        source: input
        description: free-text feedback returned to the observer
        default: null

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - name: asset_tag
        type: string
        source: input
        description: physical asset tag
        constraints: "unique across all Equipment rows"
      - name: equipment_type
        type: enum
        source: input
        description: equipment class
        constraints: "one of {ACOUSTIC_RECORDER, GPS_LOGGER, SPOTTING_SCOPE}"
      - name: status
        type: enum
        source: system
        description: custody and serviceability state
        default: AVAILABLE
        constraints: "one of {AVAILABLE, ON_LOAN, QUARANTINE, IN_CALIBRATION, RETIRED}"
      - name: calibration_valid_until
        type: datetime
        source: input
        description: instant after which the unit may not be issued
      - name: calibration_drift_ppm
        type: number
        source: system
        description: accumulated measurement drift in parts per million, 2 dp
        default: 0.0
      - name: quarantine_until
        type: datetime
        source: system
        description: returned_at + QUARANTINE_HOURS; quarantine may not be cleared before this instant
        default: null
      - name: total_loan_hours
        type: integer
        source: computed
        description: sum of EquipmentLoan.loan_hours over loans with status in {RETURNED, LOST}
        default: 0

  - name: EquipmentLoan
    parent: null
    common_fields: true
    fields:
      - name: equipment_id
        type: string
        source: input
        description: "FK -> Equipment.id"
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id"
      - name: start_at
        type: datetime
        source: input
        description: inclusive start of the requested half-open occupation interval
      - name: due_at
        type: datetime
        source: input
        description: exclusive end of the requested half-open occupation interval
        constraints: "due_at > start_at"
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of the issue action
        default: null
      - name: returned_at
        type: datetime
        source: system
        description: logical-clock instant of the return action
        default: null
      - name: status
        type: enum
        source: system
        description: loan lifecycle state
        default: REQUESTED
        constraints: "one of {REQUESTED, ISSUED, RETURNED, OVERDUE, LOST, CANCELLED}"
      - name: condition_on_return
        type: enum
        source: system
        description: condition reported by the return action
        default: NONE
        constraints: "one of {NONE, GOOD, DAMAGED, LOST}"
      - name: loan_hours
        type: integer
        source: computed
        description: "ceil((returned_at - issued_at) in hours); 0 until returned"
        default: 0
      - name: drift_added_ppm
        type: number
        source: computed
        description: drift this loan contributed to the equipment, 2 dp
        default: 0.0

  - name: DataPublication
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id"
      - name: supersedes_publication_id
        type: string
        source: system
        description: "FK -> DataPublication.id; set to the campaign's prior non-WITHDRAWN publication when one exists"
        default: null
      - name: doi
        type: string
        source: input
        description: digital object identifier for the released dataset
        constraints: "unique across all DataPublication rows"
      - name: status
        type: enum
        source: system
        description: publication lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, EMBARGOED, RELEASED, WITHDRAWN}"
      - name: embargo_until
        type: datetime
        source: input
        description: instant before which only AGGREGATE scope grants may be approved; null means no embargo
        default: null
      - name: quality_floor
        type: number
        source: computed
        description: inclusion floor pinned at publication-create time, 2 dp
        default: 0.0
      - name: record_count
        type: integer
        source: computed
        description: number of Observations bound into this publication
        default: 0
      - name: mean_quality
        type: number
        source: computed
        description: mean final_quality_points over the bound observations, 2 dp
        default: 0.0
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant of the release action
        default: null

  - name: ResearchPartner
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: partner organisation name
        constraints: "unique across all ResearchPartner rows"
      - name: contact_email
        type: string
        source: input
        description: partner contact email
      - name: status
        type: enum
        source: system
        description: partner standing
        default: PENDING
        constraints: "one of {PENDING, APPROVED, SUSPENDED}"
      - name: data_use_agreement_signed_at
        type: datetime
        source: input
        description: instant the data use agreement was signed; null when unsigned
        default: null
      - name: trust_tier
        type: enum
        source: input
        description: trust band gating the SENSITIVE scope
        default: STANDARD
        constraints: "one of {STANDARD, TRUSTED}"
      - name: active_grant_count
        type: integer
        source: computed
        description: number of PartnerAccessGrant rows for this partner with status APPROVED
        default: 0

  - name: PartnerAccessGrant
    parent: null
    common_fields: true
    fields:
      - name: publication_id
        type: string
        source: input
        description: "FK -> DataPublication.id"
      - name: partner_id
        type: string
        source: input
        description: "FK -> ResearchPartner.id"
      - name: scope
        type: enum
        source: input
        description: breadth of data the grant exposes
        constraints: "one of {AGGREGATE, FULL, SENSITIVE}"
      - name: status
        type: enum
        source: system
        description: grant lifecycle state
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DENIED, REVOKED, EXPIRED}"
      - name: expires_at
        type: datetime
        source: input
        description: instant at which the maintenance run expires an APPROVED grant
      - name: denied_reason
        type: enum
        source: system
        description: reason recorded when the grant was denied or revoked
        default: NONE
        constraints: "one of {NONE, PUBLICATION_WITHDRAWN, GRANT_EXPIRED, ADMIN_REVOKED}"

  - name: RecognitionAward
    parent: null
    common_fields: false
    fields:
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id"
      - name: observation_id
        type: string
        source: system
        description: "FK -> Observation.id; null for tier milestone awards not tied to a single observation"
        default: null
      - name: award_type
        type: enum
        source: system
        description: award category
        constraints: "one of {OBSERVATION_ACCEPTED, STREAK_BONUS, MILESTONE, REVERSAL}"
      - name: points_awarded
        type: integer
        source: system
        description: signed point delta; negative for REVERSAL rows
      - name: reason
        type: string
        source: system
        description: human-readable justification

state_machines:
  - entity: Protocol
    dimension: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /citizen-science/protocols/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "protocol.status == DRAFT"
          - "no other Protocol row with the same code has status == ACTIVE, unless that row is exactly this row's supersedes_protocol_id"
        side_effects:
          - "sets activated_at to the logical clock"
          - "CASCADE-P link 1: when supersedes_protocol_id is not null and that Protocol.status == ACTIVE, that Protocol transitions ACTIVE -> RETIRED"
          - "increments Protocol.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "system cascade from activating a Protocol whose supersedes_protocol_id points at this row"
        actor: system
        preconditions:
          - "protocol.status == ACTIVE"
        side_effects:
          - "CASCADE-P link 2 (caused by link 1): every Certification with protocol_id == this protocol and status in {ENROLLED, TRAINED, CERTIFIED, SUSPENDED} transitions to REVOKED"
          - "CASCADE-P link 3 (caused by link 2): every Volunteer that lost its last CERTIFIED Certification in link 2 and whose status == ACTIVE transitions ACTIVE -> PENDING"
          - "increments Protocol.version by 1"

  - entity: Volunteer
    dimension: status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system cascade from POST /citizen-science/certifications/{id}/grant"
        actor: system
        preconditions:
          - "volunteer.status == PENDING"
        side_effects:
          - "increments Volunteer.version by 1"
      - from: ACTIVE
        to: PROBATION
        trigger: "system cascade from an Observation resolving UNDER_REVIEW -> REJECTED (CASCADE-R link 3)"
        actor: system
        preconditions:
          - "volunteer.status == ACTIVE"
          - "recomputed volunteer.quality_score < PROBATION_FLOOR (0.50)"
        side_effects:
          - "CASCADE-R link 4 (caused by link 3): every Certification of this volunteer with status == CERTIFIED and level in {ADVANCED, EXPERT} transitions CERTIFIED -> SUSPENDED with suspended_reason = QUALITY_PROBATION"
          - "CASCADE-R link 5 (caused by link 4): every EquipmentLoan of this volunteer with status == REQUESTED transitions REQUESTED -> CANCELLED"
          - "increments Volunteer.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system cascade from an Observation resolving UNDER_REVIEW -> REJECTED"
        actor: system
        preconditions:
          - "volunteer.status == PROBATION"
          - "volunteer.consecutive_rejections >= 3 after the increment"
        side_effects:
          - "every Certification of this volunteer with status == CERTIFIED transitions CERTIFIED -> SUSPENDED with suspended_reason = QUALITY_PROBATION, regardless of level"
          - "increments Volunteer.version by 1"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /citizen-science/volunteers/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "volunteer.status in {PROBATION, SUSPENDED}"
          - "volunteer.quality_score >= PROBATION_FLOOR (0.50)"
        side_effects:
          - "every Certification of this volunteer with status == SUSPENDED and suspended_reason == QUALITY_PROBATION transitions SUSPENDED -> CERTIFIED and suspended_reason resets to NONE"
          - "resets consecutive_rejections to 0"
          - "increments Volunteer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /citizen-science/volunteers/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "volunteer.status in {PROBATION, SUSPENDED}"
          - "volunteer.quality_score >= PROBATION_FLOOR (0.50)"
        side_effects:
          - "every Certification of this volunteer with status == SUSPENDED and suspended_reason == QUALITY_PROBATION transitions SUSPENDED -> CERTIFIED and suspended_reason resets to NONE"
          - "resets consecutive_rejections to 0"
          - "increments Volunteer.version by 1"
      - from: ACTIVE
        to: PENDING
        trigger: "system cascade from Protocol ACTIVE -> RETIRED (CASCADE-P link 3)"
        actor: system
        preconditions:
          - "volunteer.status == ACTIVE"
          - "the volunteer holds zero Certification rows with status == CERTIFIED after link 2 completed"
        side_effects:
          - "increments Volunteer.version by 1"

  - entity: Certification
    dimension: status
    initial_state: ENROLLED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ENROLLED
        to: TRAINED
        trigger: "POST /citizen-science/certifications/{id}/complete-training"
        actor: Expert
        preconditions:
          - "certification.status == ENROLLED"
          - "X-User-ID == certification.trainer_expert_id"
          - "exam_score >= PASSING_EXAM_SCORE (70)"
        side_effects:
          - "stores exam_score"
          - "increments Certification.version by 1"
      - from: TRAINED
        to: CERTIFIED
        trigger: "POST /citizen-science/certifications/{id}/grant"
        actor: ProgramAdmin
        preconditions:
          - "certification.status == TRAINED"
          - "the referenced Protocol.status == ACTIVE"
        side_effects:
          - "sets granted_at to the logical clock"
          - "sets expires_at to granted_at + Protocol.certification_valid_days days"
          - "when the owning Volunteer.status == PENDING, that Volunteer transitions PENDING -> ACTIVE"
          - "increments Certification.version by 1"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "system cascade from Volunteer ACTIVE -> PROBATION or PROBATION -> SUSPENDED"
        actor: system
        preconditions:
          - "certification.status == CERTIFIED"
        side_effects:
          - "sets suspended_reason to QUALITY_PROBATION"
          - "increments Certification.version by 1"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "system cascade from POST /citizen-science/volunteers/{id}/reinstate"
        actor: system
        preconditions:
          - "certification.status == SUSPENDED"
          - "certification.suspended_reason == QUALITY_PROBATION"
        side_effects:
          - "resets suspended_reason to NONE"
          - "increments Certification.version by 1"
        note: "SUSPENDED -> CERTIFIED closes the certification revocation cycle; a certification may traverse it any number of times."
      - from: CERTIFIED
        to: EXPIRED
        trigger: "POST /citizen-science/maintenance-runs"
        actor: ProgramAdmin
        preconditions:
          - "certification.status == CERTIFIED"
          - "logical clock >= certification.expires_at"
        side_effects:
          - "increments Certification.version by 1"
      - from: CERTIFIED
        to: REVOKED
        trigger: "system cascade from Protocol ACTIVE -> RETIRED (CASCADE-P link 2)"
        actor: system
        preconditions:
          - "certification.status in {ENROLLED, TRAINED, CERTIFIED, SUSPENDED}"
        side_effects:
          - "increments Certification.version by 1"
      - from: ENROLLED
        to: REVOKED
        trigger: "system cascade from Protocol ACTIVE -> RETIRED (CASCADE-P link 2)"
        actor: system
        preconditions:
          - "certification.status in {ENROLLED, TRAINED, CERTIFIED, SUSPENDED}"
        side_effects:
          - "increments Certification.version by 1"
      - from: TRAINED
        to: REVOKED
        trigger: "system cascade from Protocol ACTIVE -> RETIRED (CASCADE-P link 2)"
        actor: system
        preconditions:
          - "certification.status in {ENROLLED, TRAINED, CERTIFIED, SUSPENDED}"
        side_effects:
          - "increments Certification.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system cascade from Protocol ACTIVE -> RETIRED (CASCADE-P link 2)"
        actor: system
        preconditions:
          - "certification.status in {ENROLLED, TRAINED, CERTIFIED, SUSPENDED}"
        side_effects:
          - "increments Certification.version by 1"

  - entity: Campaign
    dimension: status
    initial_state: PLANNED
    terminal_states: [ARCHIVED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /citizen-science/campaigns/{id}/open"
        actor: ProgramAdmin
        preconditions:
          - "campaign.status in {PLANNED, CLOSED}"
          - "the referenced Protocol.status == ACTIVE"
          - "campaign.site_count >= 1"
        side_effects:
          - "recomputes coverage_score, gap_count and site_count via campaign_coverage_score"
          - "increments Campaign.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /citizen-science/campaigns/{id}/open, or system cascade from an Observation ACCEPTED -> RETRACTED that raises gap_count above 0 (CASCADE-T link 4)"
        actor: ProgramAdmin | system
        preconditions:
          - "campaign.status == CLOSED"
          - "for the admin trigger: the referenced Protocol.status == ACTIVE and campaign.site_count >= 1"
          - "for the system cascade: the retraction recompute raised campaign.gap_count above its pre-retraction value"
        side_effects:
          - "recomputes coverage_score, gap_count and site_count via campaign_coverage_score"
          - "increments Campaign.version by 1"
        note: "CLOSED -> OPEN is the campaign revision cycle; a campaign may re-open any number of times before it is published."
      - from: OPEN
        to: CLOSED
        trigger: "POST /citizen-science/campaigns/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "campaign.status == OPEN"
          - "campaign.site_count >= 1"
          - "zero Observations in this campaign have review_status in {SUBMITTED, UNDER_REVIEW, NEEDS_REVISION}"
        side_effects:
          - "recomputes coverage_score, gap_count and site_count via campaign_coverage_score"
          - "increments Campaign.version by 1"
      - from: CLOSED
        to: PUBLISHED
        trigger: "system cascade from POST /citizen-science/publications/{id}/release"
        actor: system
        preconditions:
          - "campaign.status == CLOSED"
        side_effects:
          - "increments Campaign.version by 1"
      - from: PUBLISHED
        to: CLOSED
        trigger: "system cascade from POST /citizen-science/publications/{id}/withdraw"
        actor: system
        preconditions:
          - "campaign.status == PUBLISHED"
          - "the campaign has zero DataPublication rows left with status == RELEASED after the withdrawal"
        side_effects:
          - "increments Campaign.version by 1"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /citizen-science/maintenance-runs"
        actor: ProgramAdmin
        preconditions:
          - "campaign.status == PUBLISHED"
          - "logical clock date > season_end_date + ARCHIVE_GRACE_DAYS (30)"
        side_effects:
          - "increments Campaign.version by 1"

  - entity: Observation
    dimension: review_status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, RETRACTED]
    note: |
      Observation carries TWO independent state dimensions on the same row: review_status (this
      machine) and publication_status (the next machine). They advance on different triggers and
      neither is a function of the other except at the two coupling points named in side_effects.
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /citizen-science/observations"
        actor: Volunteer
        preconditions:
          - "campaign.status == OPEN"
          - "site.campaign_id == campaign.id"
          - "the acting Volunteer holds a Certification for campaign.protocol_id with status == CERTIFIED whose expires_at > logical clock, and whose level ordinal rank >= protocol.required_certification_level ordinal rank"
          - "volunteer.status in {ACTIVE, PROBATION}"
          - "observed_at date falls inside the closed interval [campaign.season_start_date, campaign.season_end_date]"
          - "(logical clock - observed_at) in hours <= protocol.max_submission_lag_hours"
          - "when protocol.required_equipment_type != NONE: equipment_loan_id is present, that loan.status == ISSUED, loan.volunteer_id == volunteer_id, and the loan's Equipment.equipment_type == protocol.required_equipment_type"
        side_effects:
          - "sets submitted_at to the logical clock"
          - "computes provisional_quality_points via observation_quality_points (provisional variant)"
          - "publication_status initialises to UNPUBLISHED"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /citizen-science/observations/{id}/start-review"
        actor: Expert
        preconditions:
          - "observation.review_status == SUBMITTED"
          - "expert.status == ACTIVE"
          - "observation.photo_count >= protocol.min_photo_count"
          - "campaign.status in {OPEN, CLOSED}"
        side_effects:
          - "increments Observation.version by 1"
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /citizen-science/observations/{id}/votes when verification_consensus resolves to HOLD"
        actor: Expert
        preconditions:
          - "observation.review_status == UNDER_REVIEW"
          - "no VerificationVote exists for this (observation_id, expert_id, round_number) triple"
          - "expert.id != the linked_volunteer_id path to observation.volunteer_id (see ERR_SELF_VERIFICATION)"
          - "when observation.revision_round == 0, the acting Expert is not the trainer_expert_id of the observer's Certification for this protocol"
        side_effects:
          - "appends a VerificationVote with weight_applied = round(expert.verification_weight * (0.6 + 0.1 * confidence), 4)"
          - "recomputes confirm_weight, reject_weight, revision_weight and consensus_confidence for the current round"
          - "increments Expert.vote_count by 1"
          - "increments Observation.version by 1"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /citizen-science/observations/{id}/votes when verification_consensus resolves to ACCEPT"
        actor: Expert
        preconditions:
          - "observation.review_status == UNDER_REVIEW"
          - "the current round holds at least QUORUM_MIN_VOTES (2) votes after this vote"
          - "confirm_weight >= CONSENSUS_WEIGHT_THRESHOLD (3.0) and confirm_weight > reject_weight after this vote"
        side_effects:
          - "CASCADE-A link 1: computes final_quality_points via observation_quality_points (final variant) and sets publication_status UNPUBLISHED -> QUEUED"
          - "CASCADE-A link 2 (caused by link 1): appends a RecognitionAward of award_type OBSERVATION_ACCEPTED whose points_awarded = recognition_points_award over final_quality_points, increments Volunteer.accepted_observation_count and consecutive_accepted, resets consecutive_rejections to 0, and adds the points to Volunteer.lifetime_points"
          - "CASCADE-A link 3 (caused by link 2): when the post-increment consecutive_accepted is a positive multiple of STREAK_LENGTH (5), appends a second RecognitionAward of award_type STREAK_BONUS worth STREAK_BONUS_POINTS (5) and adds it to Volunteer.lifetime_points"
          - "CASCADE-A link 4 (caused by link 2): recomputes Volunteer.quality_score and Volunteer.lifetime_quality_score, then recomputes recognition_tier; when the tier ordinal rank increased, appends a RecognitionAward of award_type MILESTONE worth TIER_MILESTONE_POINTS (25) and adds it to Volunteer.lifetime_points"
          - "increments SurveySite.accepted_observation_count by 1, then recomputes site coverage_ratio and coverage_status"
          - "increments Campaign.accepted_observation_count by 1, then recomputes campaign coverage_score and gap_count"
          - "increments Observation.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /citizen-science/observations/{id}/votes when verification_consensus resolves to REJECT"
        actor: Expert
        preconditions:
          - "observation.review_status == UNDER_REVIEW"
          - "the current round holds at least QUORUM_MIN_VOTES (2) votes after this vote"
          - "reject_weight >= CONSENSUS_WEIGHT_THRESHOLD (3.0) and reject_weight >= confirm_weight after this vote"
        side_effects:
          - "CASCADE-R link 1: review_status becomes REJECTED and publication_status stays UNPUBLISHED"
          - "CASCADE-R link 2 (caused by link 1): increments Volunteer.rejected_observation_count and consecutive_rejections, resets consecutive_accepted to 0, then recomputes Volunteer.quality_score and lifetime_quality_score"
          - "CASCADE-R link 3 (caused by link 2): when the recomputed quality_score < PROBATION_FLOOR (0.50) and volunteer.status == ACTIVE, the Volunteer transitions ACTIVE -> PROBATION"
          - "CASCADE-R link 4 (caused by link 3): every Certification of that Volunteer with status == CERTIFIED and level in {ADVANCED, EXPERT} transitions CERTIFIED -> SUSPENDED"
          - "CASCADE-R link 5 (caused by link 4): every EquipmentLoan of that Volunteer with status == REQUESTED transitions REQUESTED -> CANCELLED"
          - "increments Observation.version by 1"
      - from: UNDER_REVIEW
        to: NEEDS_REVISION
        trigger: "POST /citizen-science/observations/{id}/votes when verification_consensus resolves to REVISE"
        actor: Expert
        preconditions:
          - "observation.review_status == UNDER_REVIEW"
          - "the current round holds at least QUORUM_MIN_VOTES (2) votes after this vote"
          - "revision_weight >= REVISION_WEIGHT_THRESHOLD (2.0) after this vote"
        side_effects:
          - "the comment text of every REQUEST_REVISION vote in the current round becomes the observer feedback set"
          - "increments Observation.version by 1"
      - from: NEEDS_REVISION
        to: SUBMITTED
        trigger: "POST /citizen-science/observations/{id}/resubmit"
        actor: Volunteer
        preconditions:
          - "observation.review_status == NEEDS_REVISION"
          - "X-User-ID == observation.volunteer_id"
          - "observation.revision_round < MAX_REVISION_ROUNDS (2)"
          - "campaign.status == OPEN"
          - "the observer's Certification for this protocol is still CERTIFIED"
        side_effects:
          - "increments revision_round by 1"
          - "sets submitted_at to the logical clock"
          - "recomputes provisional_quality_points via observation_quality_points (provisional variant) using the new submitted_at"
          - "votes from earlier rounds are retained but excluded from verification_consensus, which only sums votes whose round_number equals the current revision_round"
          - "increments Observation.version by 1"
        note: "This edge closes the revision cycle SUBMITTED -> UNDER_REVIEW -> NEEDS_REVISION -> SUBMITTED, traversable at most MAX_REVISION_ROUNDS times."
      - from: NEEDS_REVISION
        to: REJECTED
        trigger: "POST /citizen-science/maintenance-runs"
        actor: ProgramAdmin
        preconditions:
          - "observation.review_status == NEEDS_REVISION"
          - "observation.revision_round >= MAX_REVISION_ROUNDS (2)"
        side_effects:
          - "runs the same CASCADE-R links 2-5 as a vote-driven rejection"
          - "increments Observation.version by 1"
        note: "Clears the dead end created when a round-2 observation is sent back for revision that its observer may no longer submit."
      - from: ACCEPTED
        to: RETRACTED
        trigger: "POST /citizen-science/observations/{id}/retract"
        actor: ProgramAdmin
        preconditions:
          - "observation.review_status == ACCEPTED"
        side_effects:
          - "CASCADE-T link 1: review_status becomes RETRACTED"
          - "CASCADE-T link 2 (caused by link 1): publication_status moves QUEUED -> WITHDRAWN or PUBLISHED -> WITHDRAWN; when the observation was bound to a DataPublication, that publication's record_count decreases by 1, mean_quality is recomputed over the remaining bound observations, and DataPublication.version increments"
          - "CASCADE-T link 3 (caused by link 2): SurveySite.accepted_observation_count decreases by 1 and site coverage_ratio and coverage_status are recomputed; Campaign.accepted_observation_count decreases by 1 and campaign coverage_score and gap_count are recomputed"
          - "CASCADE-T link 4 (caused by link 3): when the recompute raises campaign.gap_count above its pre-retraction value and campaign.status == CLOSED, the Campaign transitions CLOSED -> OPEN"
          - "COMPENSATION: appends a RecognitionAward of award_type REVERSAL whose points_awarded equals -1 times the sum of points_awarded over all prior RecognitionAward rows with observation_id == this observation, and subtracts that sum from Volunteer.lifetime_points; decrements Volunteer.accepted_observation_count, increments rejected_observation_count, resets consecutive_accepted to 0"
          - "Volunteer.quality_score and lifetime_quality_score are recomputed with the RETRACTED observation scoring as a rejection, but the ACTIVE -> PROBATION cascade does NOT fire on retraction: only an UNDER_REVIEW -> REJECTED resolution can drive a Volunteer into PROBATION"
          - "for every Expert holding a CONFIRM vote in the deciding round: increments Expert.retracted_confirm_count by 1, and when it reaches RETRACTED_CONFIRM_SUSPEND_THRESHOLD (2) that Expert transitions ACTIVE -> SUSPENDED"
          - "increments Observation.version by 1"

  - entity: Observation
    dimension: publication_status
    initial_state: UNPUBLISHED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: UNPUBLISHED
        to: QUEUED
        trigger: "system cascade from Observation review_status UNDER_REVIEW -> ACCEPTED"
        actor: system
        preconditions:
          - "observation.publication_status == UNPUBLISHED"
        side_effects:
          - "the observation becomes a candidate for the next publication_release_metrics run of its campaign"
      - from: QUEUED
        to: PUBLISHED
        trigger: "system cascade from POST /citizen-science/publications/{id}/release"
        actor: system
        preconditions:
          - "observation.publication_status == QUEUED"
          - "observation.publication_id == the released publication's id"
        side_effects:
          - "increments Observation.version by 1"
      - from: QUEUED
        to: UNPUBLISHED
        trigger: "system cascade from POST /citizen-science/publications/{id}/withdraw on a DRAFT or EMBARGOED publication"
        actor: system
        preconditions:
          - "observation.publication_status == QUEUED"
          - "observation.publication_id == the withdrawn publication's id"
        side_effects:
          - "clears publication_id back to null so the observation re-enters the candidate pool"
          - "increments Observation.version by 1"
      - from: QUEUED
        to: WITHDRAWN
        trigger: "system cascade from Observation review_status ACCEPTED -> RETRACTED (CASCADE-T link 2)"
        actor: system
        preconditions:
          - "observation.publication_status == QUEUED"
        side_effects:
          - "increments Observation.version by 1"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "system cascade from Observation review_status ACCEPTED -> RETRACTED (CASCADE-T link 2), or from POST /citizen-science/publications/{id}/withdraw on a RELEASED publication"
        actor: system
        preconditions:
          - "observation.publication_status == PUBLISHED"
        side_effects:
          - "decrements the owning DataPublication.record_count by 1 and recomputes its mean_quality"
          - "increments Observation.version by 1"

  - entity: Equipment
    dimension: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    note: "QUARANTINE is a three-way fork: clear-quarantine routes to AVAILABLE, IN_CALIBRATION or RETIRED purely on calibration_drift_ppm, and each branch carries a different side-effect set."
    transitions:
      - from: AVAILABLE
        to: ON_LOAN
        trigger: "POST /citizen-science/equipment-loans/{id}/issue"
        actor: ProgramAdmin
        preconditions:
          - "equipment.status == AVAILABLE"
          - "equipment.calibration_valid_until > logical clock"
        side_effects:
          - "increments Equipment.version by 1"
      - from: ON_LOAN
        to: QUARANTINE
        trigger: "POST /citizen-science/equipment-loans/{id}/return with condition_on_return in {GOOD, DAMAGED}"
        actor: ProgramAdmin
        preconditions:
          - "equipment.status == ON_LOAN"
        side_effects:
          - "sets quarantine_until to the logical clock + QUARANTINE_HOURS (48)"
          - "adds equipment_calibration_drift output to calibration_drift_ppm"
          - "adds the loan's loan_hours to total_loan_hours"
          - "increments Equipment.version by 1"
      - from: ON_LOAN
        to: RETIRED
        trigger: "POST /citizen-science/equipment-loans/{id}/return with condition_on_return == LOST"
        actor: ProgramAdmin
        preconditions:
          - "equipment.status == ON_LOAN"
        side_effects:
          - "every EquipmentLoan on this equipment with status == REQUESTED transitions REQUESTED -> CANCELLED"
          - "increments Equipment.version by 1"
      - from: QUARANTINE
        to: AVAILABLE
        trigger: "POST /citizen-science/equipment/{id}/clear-quarantine"
        actor: ProgramAdmin
        preconditions:
          - "equipment.status == QUARANTINE"
          - "logical clock >= equipment.quarantine_until"
          - "equipment.calibration_drift_ppm < CALIBRATION_DRIFT_LIMIT_PPM (500.00)"
        side_effects:
          - "clears quarantine_until to null"
          - "increments Equipment.version by 1"
      - from: QUARANTINE
        to: IN_CALIBRATION
        trigger: "POST /citizen-science/equipment/{id}/clear-quarantine"
        actor: ProgramAdmin
        preconditions:
          - "equipment.status == QUARANTINE"
          - "logical clock >= equipment.quarantine_until"
          - "CALIBRATION_DRIFT_LIMIT_PPM (500.00) <= equipment.calibration_drift_ppm < CALIBRATION_RETIRE_PPM (1000.00)"
        side_effects:
          - "clears quarantine_until to null"
          - "increments Equipment.version by 1"
      - from: QUARANTINE
        to: RETIRED
        trigger: "POST /citizen-science/equipment/{id}/clear-quarantine"
        actor: ProgramAdmin
        preconditions:
          - "equipment.status == QUARANTINE"
          - "logical clock >= equipment.quarantine_until"
          - "equipment.calibration_drift_ppm >= CALIBRATION_RETIRE_PPM (1000.00)"
        side_effects:
          - "clears quarantine_until to null"
          - "every EquipmentLoan on this equipment with status == REQUESTED transitions REQUESTED -> CANCELLED"
          - "increments Equipment.version by 1"
      - from: IN_CALIBRATION
        to: AVAILABLE
        trigger: "POST /citizen-science/equipment/{id}/complete-calibration"
        actor: ProgramAdmin
        preconditions:
          - "equipment.status == IN_CALIBRATION"
        side_effects:
          - "resets calibration_drift_ppm to 0.0"
          - "sets calibration_valid_until to the logical clock + CALIBRATION_VALID_DAYS (365) days"
          - "increments Equipment.version by 1"
        note: "Closes the AVAILABLE -> ON_LOAN -> QUARANTINE -> IN_CALIBRATION -> AVAILABLE service cycle."

  - entity: EquipmentLoan
    dimension: status
    initial_state: REQUESTED
    terminal_states: [RETURNED, LOST, CANCELLED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /citizen-science/equipment-loans"
        actor: ProgramAdmin | Volunteer
        preconditions:
          - "equipment.status in {AVAILABLE, ON_LOAN, QUARANTINE, IN_CALIBRATION}"
          - "volunteer.status in {ACTIVE, PROBATION}"
          - "expected_equipment_version == equipment.version"
          - "the requested half-open interval [start_at, due_at) does not intersect any occupied interval on this equipment (see validation priority 42)"
        side_effects:
          - "increments Equipment.version by 1"
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /citizen-science/equipment-loans/{id}/issue"
        actor: ProgramAdmin
        preconditions:
          - "loan.status == REQUESTED"
          - "equipment.status == AVAILABLE"
          - "equipment.calibration_valid_until > logical clock"
          - "logical clock < loan.due_at"
        side_effects:
          - "sets issued_at to the logical clock"
          - "the Equipment transitions AVAILABLE -> ON_LOAN"
          - "increments EquipmentLoan.version by 1"
      - from: ISSUED
        to: RETURNED
        trigger: "POST /citizen-science/equipment-loans/{id}/return with condition_on_return in {GOOD, DAMAGED}"
        actor: ProgramAdmin
        preconditions:
          - "loan.status in {ISSUED, OVERDUE}"
        side_effects:
          - "sets returned_at to the logical clock and condition_on_return to the supplied value"
          - "computes loan_hours and drift_added_ppm via equipment_calibration_drift"
          - "the Equipment transitions ON_LOAN -> QUARANTINE"
          - "increments EquipmentLoan.version by 1"
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /citizen-science/equipment-loans/{id}/return with condition_on_return in {GOOD, DAMAGED}"
        actor: ProgramAdmin
        preconditions:
          - "loan.status in {ISSUED, OVERDUE}"
        side_effects:
          - "sets returned_at to the logical clock and condition_on_return to the supplied value"
          - "computes loan_hours and drift_added_ppm via equipment_calibration_drift, including the OVERDUE_DRIFT_PENALTY_PPM surcharge"
          - "the Equipment transitions ON_LOAN -> QUARANTINE"
          - "increments EquipmentLoan.version by 1"
      - from: ISSUED
        to: OVERDUE
        trigger: "POST /citizen-science/maintenance-runs"
        actor: ProgramAdmin
        preconditions:
          - "loan.status == ISSUED"
          - "logical clock >= loan.due_at"
        side_effects:
          - "increments EquipmentLoan.version by 1"
      - from: ISSUED
        to: LOST
        trigger: "POST /citizen-science/equipment-loans/{id}/return with condition_on_return == LOST"
        actor: ProgramAdmin
        preconditions:
          - "loan.status in {ISSUED, OVERDUE}"
        side_effects:
          - "sets returned_at to the logical clock and condition_on_return to LOST"
          - "loan_hours is computed but drift_added_ppm stays 0.0"
          - "the Equipment transitions ON_LOAN -> RETIRED"
          - "increments EquipmentLoan.version by 1"
      - from: OVERDUE
        to: LOST
        trigger: "POST /citizen-science/equipment-loans/{id}/return with condition_on_return == LOST"
        actor: ProgramAdmin
        preconditions:
          - "loan.status in {ISSUED, OVERDUE}"
        side_effects:
          - "sets returned_at to the logical clock and condition_on_return to LOST"
          - "the Equipment transitions ON_LOAN -> RETIRED"
          - "increments EquipmentLoan.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system cascade from Equipment -> RETIRED, or from Volunteer ACTIVE -> PROBATION (CASCADE-R link 5)"
        actor: system
        preconditions:
          - "loan.status == REQUESTED"
        side_effects:
          - "increments EquipmentLoan.version by 1"

  - entity: DataPublication
    dimension: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /citizen-science/publications"
        actor: ProgramAdmin
        preconditions:
          - "campaign.status in {CLOSED, PUBLISHED}"
          - "expected_campaign_version == campaign.version"
          - "at least MIN_RECORD_FLOOR (2) candidate observations exist"
        side_effects:
          - "STEP 1 (pinned first): when the campaign already has a DataPublication with status in {DRAFT, EMBARGOED, RELEASED}, that prior publication transitions to WITHDRAWN and this row's supersedes_publication_id is set to it; its bound observations with publication_status QUEUED have publication_id cleared and therefore re-enter the candidate pool, while its bound observations with publication_status PUBLISHED move to WITHDRAWN and do NOT re-enter"
          - "STEP 2: runs publication_release_metrics over the refreshed candidate set to pin quality_floor, record_count and mean_quality"
          - "STEP 3: sets publication_id on every included Observation"
          - "increments Campaign.version by 1"
      - from: DRAFT
        to: RELEASED
        trigger: "POST /citizen-science/publications/{id}/release"
        actor: ProgramAdmin
        preconditions:
          - "publication.status == DRAFT"
          - "publication.embargo_until is null OR logical clock >= publication.embargo_until"
          - "publication.record_count >= MIN_RECORD_FLOOR (2)"
        side_effects:
          - "sets released_at to the logical clock"
          - "every bound Observation moves publication_status QUEUED -> PUBLISHED"
          - "the owning Campaign transitions CLOSED -> PUBLISHED"
          - "increments DataPublication.version by 1"
      - from: DRAFT
        to: EMBARGOED
        trigger: "POST /citizen-science/publications/{id}/release"
        actor: ProgramAdmin
        preconditions:
          - "publication.status == DRAFT"
          - "publication.embargo_until is not null AND logical clock < publication.embargo_until"
          - "publication.record_count >= MIN_RECORD_FLOOR (2)"
        side_effects:
          - "bound Observations stay QUEUED"
          - "increments DataPublication.version by 1"
      - from: EMBARGOED
        to: RELEASED
        trigger: "POST /citizen-science/maintenance-runs"
        actor: ProgramAdmin
        preconditions:
          - "publication.status == EMBARGOED"
          - "logical clock >= publication.embargo_until"
        side_effects:
          - "sets released_at to the logical clock"
          - "every bound Observation moves publication_status QUEUED -> PUBLISHED"
          - "the owning Campaign transitions CLOSED -> PUBLISHED"
          - "increments DataPublication.version by 1"
      - from: RELEASED
        to: WITHDRAWN
        trigger: "POST /citizen-science/publications/{id}/withdraw"
        actor: ProgramAdmin
        preconditions:
          - "publication.status in {DRAFT, EMBARGOED, RELEASED}"
        side_effects:
          - "CASCADE-W link 1: every bound Observation with publication_status == PUBLISHED moves to WITHDRAWN; every bound Observation with publication_status == QUEUED has publication_id cleared to null"
          - "CASCADE-W link 2 (caused by link 1): every PartnerAccessGrant on this publication with status == APPROVED transitions APPROVED -> REVOKED with denied_reason PUBLICATION_WITHDRAWN and decrements ResearchPartner.active_grant_count; every grant with status == REQUESTED transitions to DENIED with the same denied_reason"
          - "CASCADE-W link 3 (caused by link 2): every ResearchPartner whose active_grant_count reached 0 in link 2 and whose status == APPROVED transitions APPROVED -> SUSPENDED"
          - "the owning Campaign transitions PUBLISHED -> CLOSED when no RELEASED publication remains"
          - "increments DataPublication.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /citizen-science/publications/{id}/withdraw, or system cascade from a superseding POST /citizen-science/publications"
        actor: ProgramAdmin | system
        preconditions:
          - "publication.status in {DRAFT, EMBARGOED, RELEASED}"
        side_effects:
          - "every bound Observation with publication_status == QUEUED has publication_id cleared to null"
          - "increments DataPublication.version by 1"
      - from: EMBARGOED
        to: WITHDRAWN
        trigger: "POST /citizen-science/publications/{id}/withdraw, or system cascade from a superseding POST /citizen-science/publications"
        actor: ProgramAdmin | system
        preconditions:
          - "publication.status in {DRAFT, EMBARGOED, RELEASED}"
        side_effects:
          - "every bound Observation with publication_status == QUEUED has publication_id cleared to null"
          - "increments DataPublication.version by 1"

  - entity: ResearchPartner
    dimension: status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /citizen-science/partners/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "partner.status in {PENDING, SUSPENDED}"
        side_effects:
          - "increments ResearchPartner.version by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /citizen-science/partners/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "partner.status in {PENDING, SUSPENDED}"
        side_effects:
          - "increments ResearchPartner.version by 1"
        note: "Closes the partner reinstatement cycle APPROVED -> SUSPENDED -> APPROVED."
      - from: APPROVED
        to: SUSPENDED
        trigger: "system cascade from POST /citizen-science/publications/{id}/withdraw (CASCADE-W link 3)"
        actor: system
        preconditions:
          - "partner.status == APPROVED"
          - "partner.active_grant_count reached 0 as a result of link 2"
        side_effects:
          - "increments ResearchPartner.version by 1"

  - entity: PartnerAccessGrant
    dimension: status
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /citizen-science/access-grants/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "grant.status == REQUESTED"
          - "partner.status == APPROVED"
          - "publication.status == RELEASED, or publication.status == EMBARGOED and grant.scope == AGGREGATE"
          - "when scope in {FULL, SENSITIVE}: partner.data_use_agreement_signed_at is not null"
          - "when scope == SENSITIVE: partner.trust_tier == TRUSTED"
          - "grant.expires_at > logical clock"
        side_effects:
          - "increments ResearchPartner.active_grant_count by 1"
          - "increments PartnerAccessGrant.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /citizen-science/access-grants/{id}/revoke, or system cascade from publication withdrawal (CASCADE-W link 2)"
        actor: ProgramAdmin | system
        preconditions:
          - "grant.status == APPROVED"
        side_effects:
          - "sets denied_reason to ADMIN_REVOKED for the admin trigger and PUBLICATION_WITHDRAWN for the cascade"
          - "decrements ResearchPartner.active_grant_count by 1"
          - "increments PartnerAccessGrant.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "system cascade from POST /citizen-science/publications/{id}/withdraw (CASCADE-W link 2)"
        actor: system
        preconditions:
          - "grant.status == REQUESTED"
        side_effects:
          - "sets denied_reason to PUBLICATION_WITHDRAWN"
          - "increments PartnerAccessGrant.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /citizen-science/maintenance-runs"
        actor: ProgramAdmin
        preconditions:
          - "grant.status == APPROVED"
          - "logical clock >= grant.expires_at"
        side_effects:
          - "sets denied_reason to GRANT_EXPIRED"
          - "decrements ResearchPartner.active_grant_count by 1"
          - "increments PartnerAccessGrant.version by 1"

concurrency_rules:
  - rule_id: vote-against-stale-observation
    parent_entity: Observation
    write_endpoint: "POST /citizen-science/observations/{id}/votes"
    occ_field: "expected_observation_version"
    description: |
      Casting a VerificationVote against an Observation whose version has advanced since the
      acting Expert last read it is rejected. A second expert vote is legitimate product
      behaviour on its own, so the stale-version check is what forces each voter to re-read the
      accumulated weights (and the possibly-resolved review_status) before adding their weight.
    error_id: ERR_STALE_OBSERVATION_VERSION
    http_status: 412
  - rule_id: loan-request-against-stale-equipment
    parent_entity: Equipment
    write_endpoint: "POST /citizen-science/equipment-loans"
    occ_field: "expected_equipment_version"
    description: |
      Creating an EquipmentLoan against an Equipment row whose version has advanced since the
      requester last read it is rejected. Two non-overlapping loan windows on the same unit are
      both legitimate, so the stale-version check is what forces the requester to re-read the
      occupied intervals (and the current quarantine window) before booking.
    error_id: ERR_STALE_EQUIPMENT_VERSION
    http_status: 412
  - rule_id: publication-create-against-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /citizen-science/publications"
    occ_field: "expected_campaign_version"
    description: |
      Creating a DataPublication for a Campaign whose version has advanced since the creator last
      read it is rejected. A new publication legitimately supersedes the campaign's prior one, so
      the stale-version check is what stops a creator from superseding a publication set they
      never observed.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

calculations:
  - name: observation_quality_points
    trigger: "on POST /citizen-science/observations, on every POST /citizen-science/observations/{id}/photos, and on POST /citizen-science/observations/{id}/resubmit (provisional variant); on the vote that resolves UNDER_REVIEW -> ACCEPTED (final variant)"
    algorithm: weighted_scoring
    formula: |
      # inputs: observation.photo_count, protocol.min_photo_count, observation.observed_at,
      #         observation.submitted_at, site.priority_weight, observation.consensus_confidence,
      #         observation.revision_round
      photo_bonus   = min(20, 5 * max(0, observation.photo_count - protocol.min_photo_count))
      lag_hours     = (observation.submitted_at - observation.observed_at) in exact fractional hours
      timeliness    = 1.00 if lag_hours <= 6
                      else 0.90 if lag_hours <= 24
                      else 0.75 if lag_hours <= 72
                      else 0.50
      site_factor   = max(0.80, min(1.50, site.priority_weight))
      raw           = (BASE_POINTS + photo_bonus) * timeliness * site_factor      # NOT rounded
      # provisional variant stores the rounded raw:
      observation.provisional_quality_points = round(raw, 2)
      # final variant multiplies the UNROUNDED raw:
      confidence_multiplier = 0.60 + 0.10 * observation.consensus_confidence      # consensus_confidence is the 4-dp stored value
      revision_penalty      = 1.00 - REVISION_PENALTY_STEP * observation.revision_round
      observation.final_quality_points = round(raw * confidence_multiplier * revision_penalty, 2)
    input_set: |
      photo_count counts only PhotoEvidence children with status == ACCEPTED. site is the
      SurveySite named by observation.site_id. protocol is the Protocol named by the observation's
      Campaign.protocol_id. consensus_confidence is the 4-dp value stored by verification_consensus
      for the deciding round only.
    constants:
      BASE_POINTS: 40
      PHOTO_BONUS_PER_EXTRA: 5
      PHOTO_BONUS_CAP: 20
      REVISION_PENALTY_STEP: 0.15
    precision: "provisional_quality_points and final_quality_points: 2 decimal places, round_half_up. `raw` is carried at full precision and is NEVER rounded before the final-variant multiplication."
    variants:
      - name: provisional
        when: "at submission, at each photo upload, and at each resubmission — before any verification outcome exists"
        difference: "rounds `raw` to 2 dp and stores it; ignores consensus_confidence and revision_penalty entirely, so an observation with revision_round 2 still shows the same provisional value as one at round 0 with identical inputs."
      - name: final
        when: "on the vote that resolves the observation to ACCEPTED"
        difference: "multiplies the UNROUNDED `raw` by confidence_multiplier and revision_penalty, so final_quality_points differs from provisional_quality_points for the same observation even when consensus_confidence is exactly 4.0000 and revision_round is 2 (0.85^... penalty applies)."

  - name: volunteer_quality_score
    trigger: "on every Observation transition into ACCEPTED, REJECTED or RETRACTED"
    algorithm: decay_function
    formula: |
      # adjudicated set A(V) = every Observation with volunteer_id == V.id and
      #                        review_status in {ACCEPTED, REJECTED, RETRACTED}
      # a_i = 1 when review_status == ACCEPTED, else 0 (RETRACTED scores as 0)

      # --- rolling_window variant -> Volunteer.quality_score ---
      W = the ROLLING_WINDOW_N most recent members of A(V), ordered by observed_at DESC,
          tie-break created_at DESC
      quality_score = NEUTRAL_SEED if |W| == 0 else round(sum(a_i for i in W) / |W|, 4)

      # --- lifetime_weighted variant -> Volunteer.lifetime_quality_score ---
      age_days_i = (logical clock - observation_i.observed_at) in exact fractional days
      w_i        = 0.5 ** (age_days_i / DECAY_HALF_LIFE_DAYS)
      lifetime_quality_score = NEUTRAL_SEED if |A(V)| == 0
                               else round(sum(w_i * a_i) / sum(w_i), 4)
    input_set: "Observations with review_status in {SUBMITTED, UNDER_REVIEW, NEEDS_REVISION} are excluded from both variants. RETRACTED observations remain in the set and score as a rejection."
    constants:
      ROLLING_WINDOW_N: 20
      DECAY_HALF_LIFE_DAYS: 180
      NEUTRAL_SEED: 0.5
      PROBATION_FLOOR: 0.50
    precision: "4 decimal places, round_half_up"
    variants:
      - name: rolling_window
        when: "consumed by the PROBATION gate, by the reinstate precondition, and by campaign eligibility"
        difference: "unweighted hit rate over at most the 20 most recent adjudications; an old rejection outside the window is invisible to it."
      - name: lifetime_weighted
        when: "consumed by recognition_tier and therefore by recognition_points_award"
        difference: "every adjudication ever recorded contributes, exponentially discounted by age, so a volunteer whose window is all-accepted can still hold lifetime_quality_score below 0.90."

  - name: verification_consensus
    trigger: "on every POST /citizen-science/observations/{id}/votes"
    algorithm: threshold
    formula: |
      R = observation.revision_round                     # only votes with round_number == R count
      per-vote weight_applied = round(expert.verification_weight * (0.6 + 0.1 * vote.confidence), 4)
      confirm_weight  = sum(weight_applied for votes in round R with decision == CONFIRM)     # sums the ROUNDED per-vote weights
      reject_weight   = sum(weight_applied for votes in round R with decision == REJECT)
      revision_weight = sum(weight_applied for votes in round R with decision == REQUEST_REVISION)
      vote_count_R    = number of votes in round R

      consensus_confidence =
          0.0000 if no CONFIRM vote exists in round R
          else round( sum(vote.confidence * expert.verification_weight for CONFIRM votes in R)
                      / sum(expert.verification_weight for CONFIRM votes in R), 4 )

      # resolution ladder — evaluated in EXACTLY this order after each vote is stored
      if vote_count_R < QUORUM_MIN_VOTES:                       -> HOLD   (review_status unchanged)
      elif reject_weight >= CONSENSUS_WEIGHT_THRESHOLD
           and reject_weight >= confirm_weight:                 -> REJECT (ties go to REJECT)
      elif confirm_weight >= CONSENSUS_WEIGHT_THRESHOLD
           and confirm_weight > reject_weight:                  -> ACCEPT
      elif revision_weight >= REVISION_WEIGHT_THRESHOLD:      -> REVISE
      else:                                                     -> HOLD
    input_set: "Only VerificationVote rows whose round_number equals the observation's current revision_round participate. Votes from earlier rounds are retained for audit and are never re-summed."
    constants:
      QUORUM_MIN_VOTES: 2
      CONSENSUS_WEIGHT_THRESHOLD: 3.0
      REVISION_WEIGHT_THRESHOLD: 2.0
      MAX_REVISION_ROUNDS: 2
    precision: "weight_applied, confirm_weight, reject_weight, revision_weight and consensus_confidence: 4 decimal places, round_half_up"

  - name: campaign_coverage_score
    trigger: "on every Observation transition into or out of ACCEPTED, on POST /citizen-science/campaigns/{id}/sites, on campaign open, and on campaign close"
    algorithm: aggregation
    formula: |
      for each SurveySite S of the campaign (every site row, no status filter):
          S.accepted_observation_count = count(Observation
                                               where site_id == S.id
                                                 and review_status == ACCEPTED)
          # STEP 1 — round PER SITE, to 2 dp, BEFORE any aggregation
          S.coverage_ratio = round(min(1.0, S.accepted_observation_count
                                            / campaign.target_observations_per_site), 2)
          S.coverage_status =
              GAP       if S.coverage_ratio < GAP_RATIO_CEILING
              SATURATED if S.accepted_observation_count
                           >= SATURATION_MULTIPLIER * campaign.target_observations_per_site
              MET       if S.coverage_ratio == 1.00
              UNDER     otherwise
      # STEP 2 — mean of the ALREADY-ROUNDED per-site ratios, THEN round to 4 dp
      campaign.site_count       = number of SurveySite rows
      campaign.coverage_score   = 0.0000 if site_count == 0
                                  else round(sum(S.coverage_ratio) / site_count, 4)
      campaign.gap_count        = count(S where S.coverage_ratio < GAP_RATIO_CEILING)
    input_set: "All SurveySite rows of the campaign participate, including sites with zero accepted observations. Only Observations with review_status == ACCEPTED are counted; SUBMITTED, UNDER_REVIEW, NEEDS_REVISION, REJECTED and RETRACTED are all excluded."
    constants:
      GAP_RATIO_CEILING: 0.50
      SATURATION_MULTIPLIER: 2
    precision: |
      Two-stage rounding, order PINNED: per-site coverage_ratio is rounded to 2 dp FIRST, and the
      campaign mean is computed over those rounded values and then rounded to 4 dp. Averaging the
      unrounded ratios and rounding once at the end is WRONG and yields a different number (e.g.
      target 3 with per-site accepted counts [1, 0] gives 0.1650 under the pinned order versus
      0.1667 under the single-rounding order). round_half_up at both stages.

  - name: publication_release_metrics
    trigger: "on POST /citizen-science/publications"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 — candidate set, fixed before anything else is computed
      C = [ o for o in Observation
            if o.campaign_id == publication.campaign_id
               and o.review_status == ACCEPTED
               and o.publication_status == QUEUED
               and o.publication_id is null ]
      # STEP 2 — floor derived from the CANDIDATE set only
      if len(C) == 0:
          quality_floor = 0.00
      else:
          sortedC = C sorted by final_quality_points ASC, tie-break created_at ASC
          median_points = sortedC[(len(C) - 1) // 2].final_quality_points     # LOWER median
          quality_floor = round(median_points * FLOOR_FRACTION, 2)
      # STEP 3 — inclusion, inclusive at the floor
      I = [ o for o in C if o.final_quality_points >= quality_floor ]
      # STEP 4 — outputs
      publication.record_count = len(I)
      publication.mean_quality = 0.00 if len(I) == 0
                                 else round(sum(o.final_quality_points for o in I) / len(I), 2)
      # STEP 5 — the floor is NEVER recomputed from I. Evaluation stops here; there is no
      #          fixed-point iteration. Re-deriving the median from I after STEP 3 is WRONG.
      for o in I: o.publication_id = publication.id      # observations stay QUEUED until release
    input_set: "Only ACCEPTED + QUEUED observations of the campaign that are not already bound to another publication. RETRACTED, WITHDRAWN and already-bound observations never enter C."
    constants:
      FLOOR_FRACTION: 0.80
      MIN_RECORD_FLOOR: 2
    precision: "quality_floor and mean_quality: 2 decimal places, round_half_up. The lower median is used for even-sized candidate sets."

  - name: recognition_points_award
    trigger: "on the vote that resolves an Observation to ACCEPTED, and on POST /citizen-science/observations/{id}/retract"
    algorithm: tiered_pricing
    formula: |
      # tier is read from the volunteer's lifetime_quality_score AS IT STANDS BEFORE this
      # observation's acceptance is folded into the score — PINNED ordering.
      tier_multiplier = 1.50 if lifetime_quality_score >= 0.90     # PLATINUM
                        else 1.25 if lifetime_quality_score >= 0.75  # GOLD
                        else 1.10 if lifetime_quality_score >= 0.60  # SILVER
                        else 1.00                                    # BRONZE
      base_points = floor(observation.final_quality_points * tier_multiplier)   # FLOOR, not round
      -> RecognitionAward(award_type=OBSERVATION_ACCEPTED, points_awarded=base_points)

      # streak, evaluated AFTER consecutive_accepted has been incremented
      if volunteer.consecutive_accepted % STREAK_LENGTH == 0:
          -> RecognitionAward(award_type=STREAK_BONUS, points_awarded=STREAK_BONUS_POINTS)

      # tier promotion, evaluated AFTER lifetime_quality_score has been recomputed
      if new recognition_tier ordinal (BRONZE=1, SILVER=2, GOLD=3, PLATINUM=4) > old ordinal:
          -> RecognitionAward(award_type=MILESTONE, points_awarded=TIER_MILESTONE_POINTS)

      # compensation on retraction
      reversal_points = -1 * sum(points_awarded for every RecognitionAward
                                 with observation_id == this observation)
      -> RecognitionAward(award_type=REVERSAL, points_awarded=reversal_points,
                          observation_id=this observation)

      Volunteer.lifetime_points = sum(points_awarded for every RecognitionAward
                                      with volunteer_id == V.id)      # INVARIANT, always true
    input_set: "Every RecognitionAward row of the volunteer, including MILESTONE rows whose observation_id is null. The REVERSAL row sums only rows whose observation_id equals the retracted observation, so MILESTONE rows (observation_id null) are never reversed."
    constants:
      STREAK_LENGTH: 5
      STREAK_BONUS_POINTS: 5
      TIER_MILESTONE_POINTS: 25
    precision: "points_awarded is an integer produced by floor(); no rounding mode applies."

  - name: equipment_calibration_drift
    trigger: "on POST /citizen-science/equipment-loans/{id}/return"
    algorithm: aggregation
    formula: |
      loan_hours      = ceil((returned_at - issued_at) in exact fractional hours)   # CEILING
      if condition_on_return == LOST:
          drift_added_ppm = 0.00
      else:
          base_drift      = round(loan_hours * DRIFT_PER_LOAN_HOUR_PPM, 2)          # round FIRST
          damage_penalty  = DAMAGE_DRIFT_PENALTY_PPM if condition_on_return == DAMAGED else 0.00
          overdue_penalty = OVERDUE_DRIFT_PENALTY_PPM if loan.status == OVERDUE at return else 0.00
          drift_added_ppm = round(base_drift + damage_penalty + overdue_penalty, 2) # round AGAIN
      equipment.calibration_drift_ppm = round(equipment.calibration_drift_ppm + drift_added_ppm, 2)
      equipment.total_loan_hours      = equipment.total_loan_hours + loan_hours
    input_set: "Only the loan being returned contributes; prior loans are already folded into calibration_drift_ppm and total_loan_hours."
    constants:
      DRIFT_PER_LOAN_HOUR_PPM: 0.75
      DAMAGE_DRIFT_PENALTY_PPM: 200.00
      OVERDUE_DRIFT_PENALTY_PPM: 100.00
      CALIBRATION_DRIFT_LIMIT_PPM: 500.00
      CALIBRATION_RETIRE_PPM: 1000.00
      CALIBRATION_VALID_DAYS: 365
      QUARANTINE_HOURS: 48
    precision: "loan_hours is an integer from ceil(); every ppm value is 2 decimal places, round_half_up, rounded at each of the two stages shown."

  - name: photo_evidence_screening
    trigger: "on POST /citizen-science/observations/{id}/photos"
    algorithm: threshold
    formula: |
      geo_delta_meters = round(METERS_PER_DEGREE
                               * sqrt((exif_latitude  - observation.latitude)  ** 2
                                    + (exif_longitude - observation.longitude) ** 2), 2)
      # screening ladder, evaluated in EXACTLY this order
      if captured_at < observation.observed_at - PHOTO_TIME_TOLERANCE_HOURS hours
         or captured_at > observation.observed_at + PHOTO_TIME_TOLERANCE_HOURS hours:
             status = REJECTED            # geo is NOT evaluated on this branch
      elif geo_delta_meters > PHOTO_GEO_TOLERANCE_M:
             status = FLAGGED_MISMATCH
      else:
             status = ACCEPTED
      observation.photo_count = count(PhotoEvidence children with status == ACCEPTED)
      observation.provisional_quality_points is then recomputed via observation_quality_points
    input_set: "Only the photo being uploaded is screened; existing photos are never re-screened."
    constants:
      METERS_PER_DEGREE: 111320.0
      PHOTO_GEO_TOLERANCE_M: 250.00
      PHOTO_TIME_TOLERANCE_HOURS: 2
    precision: "geo_delta_meters: 2 decimal places, round_half_up. Both tolerance comparisons are STRICT (>), so a photo exactly PHOTO_TIME_TOLERANCE_HOURS after observed_at, or with geo_delta_meters exactly 250.00, is ACCEPTED."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of {ProgramAdmin, Volunteer, Expert, ResearchPartner}"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "every path-templated resource exists, validated strictly left-to-right"
    error_id: "ERR_PROTOCOL_NOT_FOUND | ERR_VOLUNTEER_NOT_FOUND | ERR_EXPERT_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_OBSERVATION_NOT_FOUND | ERR_EQUIPMENT_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_PUBLICATION_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_AWARD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a templated path segment"
  - priority: 5
    category: existence
    check: "for entity_backed roles, X-User-ID resolves to a live row of the backing entity"
    error_id: ERR_ACTOR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints called as Volunteer, Expert or ResearchPartner"
  - priority: 6
    category: business_constraint
    check: "request body carries every required field, every value matches its declared type, every enum value is a declared member, and every numeric field is inside its declared range"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST endpoints"
  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_PROTOCOL_NOT_FOUND | ERR_VOLUNTEER_NOT_FOUND | ERR_EXPERT_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_EQUIPMENT_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_PUBLICATION_NOT_FOUND | ERR_PARTNER_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"
  - priority: 8
    category: auth
    check: "an entity_backed actor may only write resources it owns: Volunteer.X-User-ID == observation.volunteer_id / loan.volunteer_id, Expert.X-User-ID == certification.trainer_expert_id for complete-training, ResearchPartner.X-User-ID == grant.partner_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /citizen-science/observations, POST /citizen-science/observations/{id}/photos, POST /citizen-science/observations/{id}/resubmit, POST /citizen-science/certifications/{id}/complete-training, POST /citizen-science/equipment-loans, POST /citizen-science/access-grants"
  - priority: 9
    category: business_safety
    check: "the acting Expert's linked_volunteer_id is not equal to the observation's volunteer_id"
    error_id: ERR_SELF_VERIFICATION
    http_status: 403
    applies_to: "POST /citizen-science/observations/{id}/start-review, POST /citizen-science/observations/{id}/votes"
  - priority: 10
    category: business_safety
    check: "when observation.revision_round == 0, the acting Expert is not the trainer_expert_id on the observer's Certification for the campaign's protocol"
    error_id: ERR_TRAINER_VERIFICATION_CONFLICT
    http_status: 403
    applies_to: "POST /citizen-science/observations/{id}/votes"
  - priority: 11
    category: business_constraint
    check: "no VerificationVote already exists for this (observation_id, expert_id, round_number) triple"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /citizen-science/observations/{id}/votes"
  - priority: 12
    category: state
    check: "the supplied expected_<parent>_version equals the parent row's current version"
    error_id: "ERR_STALE_OBSERVATION_VERSION | ERR_STALE_EQUIPMENT_VERSION | ERR_STALE_CAMPAIGN_VERSION"
    http_status: 412
    applies_to: "POST /citizen-science/observations/{id}/votes, POST /citizen-science/equipment-loans, POST /citizen-science/publications"
  - priority: 20
    category: state
    check: "protocol.status == DRAFT on activate"
    error_id: ERR_PROTOCOL_NOT_DRAFT
    http_status: 409
    applies_to: "POST /citizen-science/protocols/{id}/activate"
  - priority: 21
    category: state
    check: "certification.status matches the action's required from-state (ENROLLED for complete-training, TRAINED for grant)"
    error_id: ERR_CERTIFICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /citizen-science/certifications/{id}/complete-training, POST /citizen-science/certifications/{id}/grant"
  - priority: 22
    category: state
    check: "campaign.status == OPEN for observation submission and resubmission; campaign.status in {PLANNED, CLOSED} for open; campaign.status == OPEN for close"
    error_id: ERR_CAMPAIGN_NOT_OPEN
    http_status: 409
    applies_to: "POST /citizen-science/observations, POST /citizen-science/observations/{id}/resubmit, POST /citizen-science/campaigns/{id}/open, POST /citizen-science/campaigns/{id}/close, POST /citizen-science/campaigns/{id}/sites"
  - priority: 23
    category: state
    check: "observation.review_status matches the action's required from-state (SUBMITTED for start-review, UNDER_REVIEW for votes, NEEDS_REVISION for resubmit, ACCEPTED for retract)"
    error_id: ERR_OBSERVATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /citizen-science/observations/{id}/start-review, POST /citizen-science/observations/{id}/votes, POST /citizen-science/observations/{id}/resubmit, POST /citizen-science/observations/{id}/retract"
  - priority: 24
    category: state
    check: "loan.status == REQUESTED for issue and in {ISSUED, OVERDUE} for return; equipment.status == QUARANTINE for clear-quarantine and IN_CALIBRATION for complete-calibration; equipment.status != RETIRED when a loan is requested"
    error_id: "ERR_LOAN_STATE_INVALID | ERR_EQUIPMENT_STATE_INVALID"
    http_status: 409
    applies_to: "POST /citizen-science/equipment-loans, POST /citizen-science/equipment-loans/{id}/issue, POST /citizen-science/equipment-loans/{id}/return, POST /citizen-science/equipment/{id}/clear-quarantine, POST /citizen-science/equipment/{id}/complete-calibration"
  - priority: 25
    category: state
    check: "publication.status == DRAFT on release and in {DRAFT, EMBARGOED, RELEASED} on withdraw; campaign.status in {CLOSED, PUBLISHED} on publication create"
    error_id: ERR_PUBLICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /citizen-science/publications, POST /citizen-science/publications/{id}/release, POST /citizen-science/publications/{id}/withdraw"
  - priority: 26
    category: state
    check: "grant.status == REQUESTED on approve and APPROVED on revoke"
    error_id: ERR_GRANT_STATE_INVALID
    http_status: 409
    applies_to: "POST /citizen-science/access-grants/{id}/approve, POST /citizen-science/access-grants/{id}/revoke"
  - priority: 27
    category: state
    check: "the referenced ResearchPartner.status == APPROVED when a grant is approved"
    error_id: ERR_PARTNER_NOT_APPROVED
    http_status: 409
    applies_to: "POST /citizen-science/access-grants/{id}/approve"
  - priority: 28
    category: state
    check: "the referenced Protocol.status == ACTIVE when a Certification is granted and when a Campaign is opened"
    error_id: ERR_PROTOCOL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /citizen-science/certifications/{id}/grant, POST /citizen-science/campaigns/{id}/open"
  - priority: 30
    category: business_safety
    check: "volunteer.status is in {ACTIVE, PROBATION} for submission, resubmission and loan request"
    error_id: ERR_VOLUNTEER_NOT_IN_GOOD_STANDING
    http_status: 403
    applies_to: "POST /citizen-science/observations, POST /citizen-science/observations/{id}/resubmit, POST /citizen-science/equipment-loans"
  - priority: 31
    category: business_safety
    check: "the observer holds a Certification for the campaign's protocol with status == CERTIFIED whose expires_at is strictly after the logical clock"
    error_id: ERR_CERTIFICATION_NOT_VALID
    http_status: 403
    applies_to: "POST /citizen-science/observations, POST /citizen-science/observations/{id}/resubmit"
  - priority: 32
    category: business_safety
    check: "the observer's Certification.level ordinal rank (BASIC=1, ADVANCED=2, EXPERT=3) is >= the protocol's required_certification_level ordinal rank"
    error_id: ERR_CERTIFICATION_LEVEL_INSUFFICIENT
    http_status: 403
    applies_to: "POST /citizen-science/observations"
  - priority: 33
    category: business_safety
    check: "when protocol.required_equipment_type != NONE, equipment_loan_id is supplied, that loan has status == ISSUED, loan.volunteer_id equals the observer, and the loan's Equipment.equipment_type equals the required type"
    error_id: ERR_EQUIPMENT_REQUIREMENT_UNMET
    http_status: 422
    applies_to: "POST /citizen-science/observations"
  - priority: 34
    category: business_safety
    check: "the acting Expert has status == ACTIVE"
    error_id: ERR_EXPERT_SUSPENDED
    http_status: 403
    applies_to: "POST /citizen-science/observations/{id}/start-review, POST /citizen-science/observations/{id}/votes"
  - priority: 35
    category: business_safety
    check: "exam_score >= PASSING_EXAM_SCORE (70)"
    error_id: ERR_EXAM_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /citizen-science/certifications/{id}/complete-training"
  - priority: 36
    category: business_referential
    check: "the supplied site_id belongs to the supplied campaign_id"
    error_id: ERR_SITE_CAMPAIGN_MISMATCH
    http_status: 409
    applies_to: "POST /citizen-science/observations"
  - priority: 37
    category: business_referential
    check: "no Observation of the campaign has review_status in {SUBMITTED, UNDER_REVIEW, NEEDS_REVISION} when the campaign is closed"
    error_id: ERR_OPEN_REVIEWS_PENDING
    http_status: 409
    applies_to: "POST /citizen-science/campaigns/{id}/close"
  - priority: 38
    category: business_referential
    check: "grant.scope == SENSITIVE requires partner.trust_tier == TRUSTED"
    error_id: ERR_SCOPE_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /citizen-science/access-grants/{id}/approve"
  - priority: 39
    category: business_referential
    check: "grant.scope in {FULL, SENSITIVE} requires partner.data_use_agreement_signed_at to be non-null"
    error_id: ERR_DUA_NOT_SIGNED
    http_status: 403
    applies_to: "POST /citizen-science/access-grants/{id}/approve"
  - priority: 40
    category: business_temporal
    check: "the calendar date of observed_at falls inside the closed interval [campaign.season_start_date, campaign.season_end_date]"
    error_id: ERR_OBSERVED_OUTSIDE_SEASON
    http_status: 422
    applies_to: "POST /citizen-science/observations"
  - priority: 41
    category: business_temporal
    check: "(logical clock - observed_at) in hours <= protocol.max_submission_lag_hours"
    error_id: ERR_SUBMISSION_LAG_EXCEEDED
    http_status: 422
    applies_to: "POST /citizen-science/observations"
  - priority: 42
    category: business_temporal
    check: |
      HALF-OPEN INTERVAL REGIME on Equipment. The requested interval [start_at, due_at) must not
      intersect any occupied interval of the equipment. Occupied intervals are:
      loans with status in {REQUESTED, ISSUED, OVERDUE} -> [start_at, due_at);
      loans with status == RETURNED                     -> [start_at, returned_at + QUARANTINE_HOURS);
      loans with status in {LOST, CANCELLED}            -> no occupation.
      Two intervals intersect iff (requested.start_at < occupied.end) AND (occupied.start < requested.due_at).
      Adjacency is therefore PERMITTED: a request whose start_at exactly equals an occupied end is accepted.
    error_id: ERR_EQUIPMENT_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /citizen-science/equipment-loans"
  - priority: 43
    category: business_temporal
    check: |
      CLOSED INCLUSIVE DATE REGIME on Protocol. Two Campaigns bound to the same protocol_id may not
      have intersecting season windows. Each window is the closed date interval
      [season_start_date, season_end_date] on BOTH ends. Campaigns with status == ARCHIVED are
      excluded from the check; all other statuses occupy their window. Two windows intersect iff
      NOT (a.season_end_date < b.season_start_date OR b.season_end_date < a.season_start_date).
      Adjacency is therefore FORBIDDEN: a new campaign whose season_start_date equals an existing
      campaign's season_end_date is rejected.
    error_id: ERR_SEASON_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /citizen-science/campaigns"
  - priority: 44
    category: business_temporal
    check: "equipment.calibration_valid_until is strictly after the logical clock when a loan is issued"
    error_id: ERR_CALIBRATION_EXPIRED
    http_status: 409
    applies_to: "POST /citizen-science/equipment-loans/{id}/issue"
  - priority: 45
    category: business_temporal
    check: "the logical clock is at or after equipment.quarantine_until"
    error_id: ERR_QUARANTINE_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /citizen-science/equipment/{id}/clear-quarantine"
  - priority: 46
    category: business_temporal
    check: "grant.expires_at is strictly after the logical clock at approval time"
    error_id: ERR_GRANT_EXPIRY_IN_PAST
    http_status: 422
    applies_to: "POST /citizen-science/access-grants, POST /citizen-science/access-grants/{id}/approve"
  - priority: 47
    category: business_temporal
    check: "a grant on an EMBARGOED publication may only be approved when scope == AGGREGATE"
    error_id: ERR_EMBARGO_ACTIVE
    http_status: 409
    applies_to: "POST /citizen-science/access-grants/{id}/approve"
  - priority: 48
    category: business_constraint
    check: "uniqueness holds for Protocol.code, Volunteer.email, Equipment.asset_tag, DataPublication.doi, ResearchPartner.org_name, SurveySite.site_code within its campaign, and PhotoEvidence.file_hash within its observation"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /citizen-science/protocols, POST /citizen-science/volunteers, POST /citizen-science/equipment, POST /citizen-science/publications, POST /citizen-science/partners, POST /citizen-science/campaigns/{id}/sites, POST /citizen-science/observations/{id}/photos"
  - priority: 49
    category: business_constraint
    check: "observation.revision_round < MAX_REVISION_ROUNDS (2) on resubmit"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /citizen-science/observations/{id}/resubmit"
  - priority: 50
    category: business_constraint
    check: "observation.photo_count >= protocol.min_photo_count when review starts"
    error_id: ERR_PHOTO_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /citizen-science/observations/{id}/start-review"
  - priority: 51
    category: business_fiscal
    check: "campaign.site_count >= 1 when the campaign is opened or closed"
    error_id: ERR_CAMPAIGN_HAS_NO_SITES
    http_status: 422
    applies_to: "POST /citizen-science/campaigns/{id}/open, POST /citizen-science/campaigns/{id}/close"
  - priority: 52
    category: business_fiscal
    check: "the candidate set for a new publication holds at least MIN_RECORD_FLOOR (2) observations - counted AFTER any superseded publication has released its QUEUED observations back into the pool - and publication.record_count >= MIN_RECORD_FLOOR at release"
    error_id: ERR_INSUFFICIENT_RECORDS
    http_status: 422
    applies_to: "POST /citizen-science/publications, POST /citizen-science/publications/{id}/release"
  - priority: 53
    category: business_fiscal
    check: "site.accepted_observation_count < SATURATION_MULTIPLIER (2) * campaign.target_observations_per_site when a new observation is submitted to that site"
    error_id: ERR_SITE_SATURATED
    http_status: 409
    applies_to: "POST /citizen-science/observations"

endpoints:
  # ---------- Protocols ----------
  - method: POST
    path: "/citizen-science/protocols"
    description: "Create a survey protocol in DRAFT. When supersedes_protocol_id is supplied, version_number becomes that protocol's version_number + 1."
    roles: [ProgramAdmin]
    code: 201
    input: ["code", "title", "required_certification_level", "min_photo_count", "max_submission_lag_hours", "required_equipment_type?", "certification_valid_days?", "supersedes_protocol_id?"]
    output: Protocol
    side_effects: ["computes version_number", "status initialises to DRAFT"]
  - method: GET
    path: "/citizen-science/protocols"
    description: "List protocols with filtering and pagination."
    roles: [ProgramAdmin, Volunteer, Expert, ResearchPartner]
    code: 200
    input: ["status?", "code?", "supersedes_protocol_id?", "limit?", "offset?"]
    output: Protocol[]
    side_effects: []
  - method: GET
    path: "/citizen-science/protocols/{id}"
    description: "Read one protocol."
    roles: [ProgramAdmin, Volunteer, Expert, ResearchPartner]
    code: 200
    input: []
    output: Protocol
    side_effects: []
  - method: POST
    path: "/citizen-science/protocols/{id}/activate"
    description: "Move a DRAFT protocol to ACTIVE, retiring the protocol it supersedes and cascading certification revocation."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Protocol
    side_effects: ["sets activated_at", "CASCADE-P links 1-3", "increments Protocol.version by 1"]

  # ---------- Volunteers ----------
  - method: POST
    path: "/citizen-science/volunteers"
    description: "Register a volunteer observer in PENDING."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, email, home_region_code]
    output: Volunteer
    side_effects: ["quality_score and lifetime_quality_score seed to 0.5", "recognition_tier seeds to BRONZE"]
  - method: GET
    path: "/citizen-science/volunteers"
    description: "List volunteers with filtering and pagination."
    roles: [ProgramAdmin, Expert]
    code: 200
    input: ["status?", "recognition_tier?", "home_region_code?", "limit?", "offset?"]
    output: Volunteer[]
    side_effects: []
  - method: GET
    path: "/citizen-science/volunteers/{id}"
    description: "Read one volunteer including quality_score, lifetime_quality_score, recognition_tier and lifetime_points."
    roles: [ProgramAdmin, Expert, Volunteer]
    code: 200
    input: []
    output: Volunteer
    side_effects: []
  - method: POST
    path: "/citizen-science/volunteers/{id}/reinstate"
    description: "Return a PROBATION or SUSPENDED volunteer to ACTIVE and un-suspend their quality-suspended certifications."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["SUSPENDED certifications with suspended_reason QUALITY_PROBATION return to CERTIFIED", "resets consecutive_rejections", "increments Volunteer.version by 1"]

  # ---------- Experts ----------
  - method: POST
    path: "/citizen-science/experts"
    description: "Register an expert verifier."
    roles: [ProgramAdmin]
    code: 201
    input: ["full_name", "specialty_taxon", "verification_weight", "linked_volunteer_id?"]
    output: Expert
    side_effects: ["status initialises to ACTIVE"]
  - method: GET
    path: "/citizen-science/experts"
    description: "List experts with filtering and pagination."
    roles: [ProgramAdmin, Expert]
    code: 200
    input: ["status?", "specialty_taxon?", "linked_volunteer_id?", "limit?", "offset?"]
    output: Expert[]
    side_effects: []
  - method: GET
    path: "/citizen-science/experts/{id}"
    description: "Read one expert."
    roles: [ProgramAdmin, Expert]
    code: 200
    input: []
    output: Expert
    side_effects: []
  - method: GET
    path: "/citizen-science/experts/{id}/votes"
    description: "List every VerificationVote cast by this expert."
    roles: [ProgramAdmin, Expert]
    code: 200
    input: ["limit?", "offset?"]
    output: VerificationVote[]
    side_effects: []

  # ---------- Certifications ----------
  - method: POST
    path: "/citizen-science/certifications"
    description: "Enroll a volunteer on a protocol under a named trainer."
    roles: [ProgramAdmin]
    code: 201
    input: [volunteer_id, protocol_id, trainer_expert_id, level]
    output: Certification
    side_effects: ["status initialises to ENROLLED"]
  - method: GET
    path: "/citizen-science/certifications"
    description: "List certifications with filtering and pagination."
    roles: [ProgramAdmin, Expert, Volunteer]
    code: 200
    input: ["volunteer_id?", "protocol_id?", "trainer_expert_id?", "status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []
  - method: GET
    path: "/citizen-science/certifications/{id}"
    description: "Read one certification."
    roles: [ProgramAdmin, Expert, Volunteer]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: POST
    path: "/citizen-science/certifications/{id}/complete-training"
    description: "Record the training exam result; only the named trainer may call it."
    roles: [Expert]
    code: 200
    input: [exam_score]
    output: Certification
    side_effects: ["ENROLLED -> TRAINED", "stores exam_score", "increments Certification.version by 1"]
  - method: POST
    path: "/citizen-science/certifications/{id}/grant"
    description: "Grant a TRAINED certification, stamping granted_at and expires_at and activating a PENDING volunteer."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: ["TRAINED -> CERTIFIED", "sets granted_at and expires_at", "PENDING volunteer becomes ACTIVE", "increments Certification.version by 1"]

  # ---------- Campaigns ----------
  - method: POST
    path: "/citizen-science/campaigns"
    description: "Create a seasonal campaign in PLANNED; the season window must not intersect another campaign on the same protocol."
    roles: [ProgramAdmin]
    code: 201
    input: [name, protocol_id, season_start_date, season_end_date, target_observations_per_site]
    output: Campaign
    side_effects: ["status initialises to PLANNED", "coverage_score, gap_count and site_count initialise to 0"]
  - method: GET
    path: "/citizen-science/campaigns"
    description: "List campaigns with filtering and pagination."
    roles: [ProgramAdmin, Volunteer, Expert, ResearchPartner]
    code: 200
    input: ["protocol_id?", "status?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []
  - method: GET
    path: "/citizen-science/campaigns/{id}"
    description: "Read one campaign including coverage_score and gap_count."
    roles: [ProgramAdmin, Volunteer, Expert, ResearchPartner]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: POST
    path: "/citizen-science/campaigns/{id}/open"
    description: "Open a PLANNED or CLOSED campaign for submissions."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: ["recomputes campaign_coverage_score", "increments Campaign.version by 1"]
  - method: POST
    path: "/citizen-science/campaigns/{id}/close"
    description: "Close an OPEN campaign once no review is still in flight."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: ["recomputes campaign_coverage_score", "increments Campaign.version by 1"]

  # ---------- Survey sites ----------
  - method: POST
    path: "/citizen-science/campaigns/{id}/sites"
    description: "Add a survey site to a campaign that is not yet PUBLISHED."
    roles: [ProgramAdmin]
    code: 201
    input: ["site_code", "latitude", "longitude", "habitat_type", "priority_weight?"]
    output: SurveySite
    side_effects: ["increments Campaign.site_count", "recomputes campaign_coverage_score", "increments Campaign.version by 1"]
  - method: GET
    path: "/citizen-science/campaigns/{id}/sites"
    description: "List the survey sites of a campaign with their coverage_ratio and coverage_status."
    roles: [ProgramAdmin, Volunteer, Expert, ResearchPartner]
    code: 200
    input: ["coverage_status?", "limit?", "offset?"]
    output: SurveySite[]
    side_effects: []

  # ---------- Observations ----------
  - method: POST
    path: "/citizen-science/observations"
    description: "Submit a field observation. Enters review_status SUBMITTED and publication_status UNPUBLISHED."
    roles: [Volunteer]
    code: 201
    input: ["campaign_id", "site_id", "volunteer_id", "observed_at", "latitude", "longitude", "species_code", "count_value", "equipment_loan_id?"]
    output: Observation
    side_effects: ["stamps submitted_at from the logical clock", "computes provisional_quality_points"]
  - method: GET
    path: "/citizen-science/observations"
    description: "List observations with filtering and pagination."
    roles: [ProgramAdmin, Volunteer, Expert, ResearchPartner]
    code: 200
    input: ["campaign_id?", "site_id?", "volunteer_id?", "equipment_loan_id?", "publication_id?", "review_status?", "publication_status?", "limit?", "offset?"]
    output: Observation[]
    side_effects: []
  - method: GET
    path: "/citizen-science/observations/{id}"
    description: "Read one observation including both state dimensions, the weight tallies and both quality-point variants."
    roles: [ProgramAdmin, Volunteer, Expert, ResearchPartner]
    code: 200
    input: []
    output: Observation
    side_effects: []
  - method: POST
    path: "/citizen-science/observations/{id}/photos"
    description: "Attach photo evidence; the server screens it for time window then geographic agreement."
    roles: [Volunteer]
    code: 201
    input: [file_hash, captured_at, exif_latitude, exif_longitude]
    output: PhotoEvidence
    side_effects: ["computes geo_delta_meters and status via photo_evidence_screening", "recomputes Observation.photo_count and provisional_quality_points", "increments Observation.version by 1"]
  - method: GET
    path: "/citizen-science/observations/{id}/photos"
    description: "List the photo evidence attached to an observation."
    roles: [ProgramAdmin, Volunteer, Expert]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PhotoEvidence[]
    side_effects: []
  - method: POST
    path: "/citizen-science/observations/{id}/start-review"
    description: "Move a SUBMITTED observation into UNDER_REVIEW once photo evidence satisfies the protocol."
    roles: [Expert]
    code: 200
    input: []
    output: Observation
    side_effects: ["SUBMITTED -> UNDER_REVIEW", "increments Observation.version by 1"]
  - method: POST
    path: "/citizen-science/observations/{id}/votes"
    description: "Cast a weighted verification vote. Requires expected_observation_version to match the observation's current version."
    roles: [Expert]
    code: 201
    input: ["decision", "confidence", "expected_observation_version", "comment?"]
    output: VerificationVote
    side_effects: ["appends the vote with weight_applied", "runs verification_consensus", "may drive ACCEPTED / REJECTED / NEEDS_REVISION with all downstream cascades", "increments Observation.version by 1"]
  - method: GET
    path: "/citizen-science/observations/{id}/votes"
    description: "List the verification votes on an observation, all rounds."
    roles: [ProgramAdmin, Volunteer, Expert]
    code: 200
    input: ["round_number?", "limit?", "offset?"]
    output: VerificationVote[]
    side_effects: []
  - method: POST
    path: "/citizen-science/observations/{id}/resubmit"
    description: "Return a NEEDS_REVISION observation to SUBMITTED, incrementing revision_round."
    roles: [Volunteer]
    code: 200
    input: ["latitude?", "longitude?", "species_code?", "count_value?"]
    output: Observation
    side_effects: ["NEEDS_REVISION -> SUBMITTED", "increments revision_round", "restamps submitted_at", "recomputes provisional_quality_points", "increments Observation.version by 1"]
  - method: POST
    path: "/citizen-science/observations/{id}/retract"
    description: "Retract an ACCEPTED observation, running the full compensation cascade."
    roles: [ProgramAdmin]
    code: 200
    input: [reason]
    output: Observation
    side_effects: ["CASCADE-T links 1-4", "appends a REVERSAL RecognitionAward", "may suspend confirming experts", "increments Observation.version by 1"]

  # ---------- Equipment ----------
  - method: POST
    path: "/citizen-science/equipment"
    description: "Register a loanable instrument in AVAILABLE."
    roles: [ProgramAdmin]
    code: 201
    input: [asset_tag, equipment_type, calibration_valid_until]
    output: Equipment
    side_effects: ["calibration_drift_ppm initialises to 0.0"]
  - method: GET
    path: "/citizen-science/equipment"
    description: "List equipment with filtering and pagination."
    roles: [ProgramAdmin, Volunteer]
    code: 200
    input: ["status?", "equipment_type?", "limit?", "offset?"]
    output: Equipment[]
    side_effects: []
  - method: GET
    path: "/citizen-science/equipment/{id}"
    description: "Read one instrument including calibration_drift_ppm and quarantine_until."
    roles: [ProgramAdmin, Volunteer]
    code: 200
    input: []
    output: Equipment
    side_effects: []
  - method: POST
    path: "/citizen-science/equipment/{id}/clear-quarantine"
    description: "Three-way fork out of QUARANTINE decided purely by calibration_drift_ppm: below the limit to AVAILABLE, at or above it to IN_CALIBRATION, at or above the retire threshold to RETIRED."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Equipment
    side_effects: ["clears quarantine_until", "the RETIRED branch cancels every REQUESTED loan on the unit", "increments Equipment.version by 1"]
  - method: POST
    path: "/citizen-science/equipment/{id}/complete-calibration"
    description: "Finish calibration: reset drift and re-stamp calibration_valid_until."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Equipment
    side_effects: ["IN_CALIBRATION -> AVAILABLE", "resets calibration_drift_ppm to 0.0", "sets calibration_valid_until to clock + 365 days", "increments Equipment.version by 1"]

  # ---------- Equipment loans ----------
  - method: POST
    path: "/citizen-science/equipment-loans"
    description: "Request a loan window. Requires expected_equipment_version to match the instrument's current version, and the half-open window must not intersect any occupied interval."
    roles: [ProgramAdmin, Volunteer]
    code: 201
    input: [equipment_id, volunteer_id, start_at, due_at, expected_equipment_version]
    output: EquipmentLoan
    side_effects: ["status initialises to REQUESTED", "increments Equipment.version by 1"]
  - method: GET
    path: "/citizen-science/equipment-loans"
    description: "List loans with filtering and pagination."
    roles: [ProgramAdmin, Volunteer]
    code: 200
    input: ["equipment_id?", "volunteer_id?", "status?", "limit?", "offset?"]
    output: EquipmentLoan[]
    side_effects: []
  - method: GET
    path: "/citizen-science/equipment-loans/{id}"
    description: "Read one loan including loan_hours and drift_added_ppm."
    roles: [ProgramAdmin, Volunteer]
    code: 200
    input: []
    output: EquipmentLoan
    side_effects: []
  - method: POST
    path: "/citizen-science/equipment-loans/{id}/issue"
    description: "Hand the instrument over: loan REQUESTED -> ISSUED and equipment AVAILABLE -> ON_LOAN."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: EquipmentLoan
    side_effects: ["stamps issued_at", "equipment AVAILABLE -> ON_LOAN", "increments EquipmentLoan.version and Equipment.version by 1"]
  - method: POST
    path: "/citizen-science/equipment-loans/{id}/return"
    description: "Take the instrument back, run equipment_calibration_drift and quarantine or retire the unit."
    roles: [ProgramAdmin]
    code: 200
    input: [condition_on_return]
    output: EquipmentLoan
    side_effects: ["stamps returned_at", "computes loan_hours and drift_added_ppm", "equipment ON_LOAN -> QUARANTINE or ON_LOAN -> RETIRED", "increments EquipmentLoan.version and Equipment.version by 1"]

  # ---------- Publications ----------
  - method: POST
    path: "/citizen-science/publications"
    description: "Assemble a publication from the campaign's QUEUED accepted observations. Requires expected_campaign_version; supersedes the campaign's prior publication when one exists."
    roles: [ProgramAdmin]
    code: 201
    input: ["campaign_id", "doi", "expected_campaign_version", "embargo_until?"]
    output: DataPublication
    side_effects: ["runs publication_release_metrics", "binds publication_id onto included observations", "withdraws and records the superseded publication", "increments Campaign.version by 1"]
  - method: GET
    path: "/citizen-science/publications"
    description: "List publications with filtering and pagination."
    roles: [ProgramAdmin, Volunteer, Expert, ResearchPartner]
    code: 200
    input: ["campaign_id?", "supersedes_publication_id?", "status?", "limit?", "offset?"]
    output: DataPublication[]
    side_effects: []
  - method: GET
    path: "/citizen-science/publications/{id}"
    description: "Read one publication including quality_floor, record_count and mean_quality."
    roles: [ProgramAdmin, Volunteer, Expert, ResearchPartner]
    code: 200
    input: []
    output: DataPublication
    side_effects: []
  - method: POST
    path: "/citizen-science/publications/{id}/release"
    description: "Release a DRAFT publication, or park it in EMBARGOED when embargo_until is still in the future."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: DataPublication
    side_effects: ["bound observations move QUEUED -> PUBLISHED on the RELEASED branch", "campaign CLOSED -> PUBLISHED", "increments DataPublication.version by 1"]
  - method: POST
    path: "/citizen-science/publications/{id}/withdraw"
    description: "Withdraw a publication and cascade grant revocation and partner suspension."
    roles: [ProgramAdmin]
    code: 200
    input: [reason]
    output: DataPublication
    side_effects: ["CASCADE-W links 1-3", "campaign PUBLISHED -> CLOSED when no RELEASED publication remains", "increments DataPublication.version by 1"]

  # ---------- Research partners ----------
  - method: POST
    path: "/citizen-science/partners"
    description: "Register a research partner organisation in PENDING."
    roles: [ProgramAdmin]
    code: 201
    input: ["org_name", "contact_email", "trust_tier?", "data_use_agreement_signed_at?"]
    output: ResearchPartner
    side_effects: ["status initialises to PENDING", "active_grant_count initialises to 0"]
  - method: GET
    path: "/citizen-science/partners"
    description: "List research partners with filtering and pagination."
    roles: [ProgramAdmin]
    code: 200
    input: ["status?", "trust_tier?", "limit?", "offset?"]
    output: ResearchPartner[]
    side_effects: []
  - method: GET
    path: "/citizen-science/partners/{id}"
    description: "Read one research partner including active_grant_count."
    roles: [ProgramAdmin, ResearchPartner]
    code: 200
    input: []
    output: ResearchPartner
    side_effects: []
  - method: POST
    path: "/citizen-science/partners/{id}/approve"
    description: "Approve a PENDING or SUSPENDED partner."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ResearchPartner
    side_effects: ["increments ResearchPartner.version by 1"]

  # ---------- Partner access grants ----------
  - method: POST
    path: "/citizen-science/access-grants"
    description: "Request scoped access to a publication."
    roles: [ProgramAdmin, ResearchPartner]
    code: 201
    input: [publication_id, partner_id, scope, expires_at]
    output: PartnerAccessGrant
    side_effects: ["status initialises to REQUESTED"]
  - method: GET
    path: "/citizen-science/access-grants"
    description: "List access grants with filtering and pagination."
    roles: [ProgramAdmin, ResearchPartner]
    code: 200
    input: ["publication_id?", "partner_id?", "status?", "limit?", "offset?"]
    output: PartnerAccessGrant[]
    side_effects: []
  - method: GET
    path: "/citizen-science/access-grants/{id}"
    description: "Read one access grant."
    roles: [ProgramAdmin, ResearchPartner]
    code: 200
    input: []
    output: PartnerAccessGrant
    side_effects: []
  - method: POST
    path: "/citizen-science/access-grants/{id}/approve"
    description: "Approve a REQUESTED grant after the partner, publication, embargo, DUA and trust-tier gates all pass."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PartnerAccessGrant
    side_effects: ["increments ResearchPartner.active_grant_count", "increments PartnerAccessGrant.version by 1"]
  - method: POST
    path: "/citizen-science/access-grants/{id}/revoke"
    description: "Revoke an APPROVED grant."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PartnerAccessGrant
    side_effects: ["sets denied_reason to ADMIN_REVOKED", "decrements ResearchPartner.active_grant_count", "increments PartnerAccessGrant.version by 1"]

  # ---------- Recognition awards ----------
  - method: GET
    path: "/citizen-science/awards"
    description: "List recognition award ledger rows with filtering and pagination; the sum of points_awarded for a volunteer always equals Volunteer.lifetime_points."
    roles: [ProgramAdmin, Volunteer]
    code: 200
    input: ["volunteer_id?", "observation_id?", "award_type?", "limit?", "offset?"]
    output: RecognitionAward[]
    side_effects: []
  - method: GET
    path: "/citizen-science/awards/{id}"
    description: "Read one recognition award ledger row."
    roles: [ProgramAdmin, Volunteer]
    code: 200
    input: []
    output: RecognitionAward
    side_effects: []

  # ---------- Operations ----------
  - method: POST
    path: "/citizen-science/maintenance-runs"
    description: "Run the periodic maintenance sweep against the current logical clock, in this pinned order: (1) expire certifications, (2) mark ISSUED loans OVERDUE, (3) reject NEEDS_REVISION observations that have exhausted their revision rounds, (4) release matured embargoes, (5) expire grants, (6) archive campaigns."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: { expired_certification_count: integer, overdue_loan_count: integer, released_publication_count: integer, expired_grant_count: integer, archived_campaign_count: integer, exhausted_revision_count: integer }
    side_effects: ["Certification CERTIFIED -> EXPIRED", "EquipmentLoan ISSUED -> OVERDUE", "DataPublication EMBARGOED -> RELEASED", "PartnerAccessGrant APPROVED -> EXPIRED", "Campaign PUBLISHED -> ARCHIVED", "Observation NEEDS_REVISION -> REJECTED when revision_round >= 2, with the full CASCADE-R chain"]

  # ---------- Test-driving surface ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; the server never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["every subsequent timestamp stamp, lag computation, expiry comparison and quarantine comparison uses the new value"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is missing or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of ProgramAdmin, Volunteer, Expert, ResearchPartner"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed for the endpoint"
  - id: ERR_ACTOR_NOT_FOUND
    http: 404
    condition: "X-User-ID does not resolve to a row of the entity backing the acting role"
  - id: ERR_PROTOCOL_NOT_FOUND
    http: 404
    condition: "protocolId path segment or protocol_id body field names no Protocol"
  - id: ERR_VOLUNTEER_NOT_FOUND
    http: 404
    condition: "volunteerId path segment or volunteer_id body field names no Volunteer"
  - id: ERR_EXPERT_NOT_FOUND
    http: 404
    condition: "expertId path segment or trainer_expert_id body field names no Expert"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "certificationId path segment names no Certification"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaignId path segment or campaign_id body field names no Campaign"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "site_id body field names no SurveySite"
  - id: ERR_OBSERVATION_NOT_FOUND
    http: 404
    condition: "observationId path segment names no Observation"
  - id: ERR_EQUIPMENT_NOT_FOUND
    http: 404
    condition: "equipmentId path segment or equipment_id body field names no Equipment"
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "loanId path segment or equipment_loan_id body field names no EquipmentLoan"
  - id: ERR_PUBLICATION_NOT_FOUND
    http: 404
    condition: "publicationId path segment or publication_id body field names no DataPublication"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "partnerId path segment or partner_id body field names no ResearchPartner"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "grantId path segment names no PartnerAccessGrant"
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "awardId path segment names no RecognitionAward"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required body field is missing, a value has the wrong type, an enum value is not a declared member, or a numeric value falls outside its declared range"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed actor targets a resource whose owning foreign key does not equal X-User-ID"
  - id: ERR_SELF_VERIFICATION
    http: 403
    condition: "the acting Expert's linked_volunteer_id equals the observation's volunteer_id"
  - id: ERR_TRAINER_VERIFICATION_CONFLICT
    http: 403
    condition: "at revision_round 0 the acting Expert is the trainer_expert_id on the observer's Certification for the campaign's protocol"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "the acting Expert already voted on this observation in the current round"
  - id: ERR_STALE_OBSERVATION_VERSION
    http: 412
    condition: "expected_observation_version does not equal the observation's current version"
  - id: ERR_STALE_EQUIPMENT_VERSION
    http: 412
    condition: "expected_equipment_version does not equal the equipment's current version"
  - id: ERR_STALE_CAMPAIGN_VERSION
    http: 412
    condition: "expected_campaign_version does not equal the campaign's current version"
  - id: ERR_PROTOCOL_NOT_DRAFT
    http: 409
    condition: "activate was called on a protocol whose status is not DRAFT"
  - id: ERR_PROTOCOL_NOT_ACTIVE
    http: 409
    condition: "a certification grant or a campaign open referenced a protocol whose status is not ACTIVE"
  - id: ERR_CERTIFICATION_STATE_INVALID
    http: 409
    condition: "complete-training was called on a certification that is not ENROLLED, or grant on one that is not TRAINED"
  - id: ERR_CAMPAIGN_NOT_OPEN
    http: 409
    condition: "the campaign is not in the state the action requires (OPEN for submission and close, PLANNED or CLOSED for open, not PUBLISHED or ARCHIVED for adding sites)"
  - id: ERR_OBSERVATION_STATE_INVALID
    http: 409
    condition: "the observation's review_status does not permit the requested action"
  - id: ERR_LOAN_STATE_INVALID
    http: 409
    condition: "issue was called on a loan that is not REQUESTED, or return on a loan that is neither ISSUED nor OVERDUE"
  - id: ERR_EQUIPMENT_STATE_INVALID
    http: 409
    condition: "clear-quarantine was called on a unit that is not QUARANTINE, complete-calibration on one that is not IN_CALIBRATION, or a loan was requested against a RETIRED unit"
  - id: ERR_PUBLICATION_STATE_INVALID
    http: 409
    condition: "release was called on a publication that is not DRAFT, withdraw on one already WITHDRAWN, or a publication was created for a campaign that is neither CLOSED nor PUBLISHED"
  - id: ERR_GRANT_STATE_INVALID
    http: 409
    condition: "approve was called on a grant that is not REQUESTED, or revoke on a grant that is not APPROVED"
  - id: ERR_PARTNER_NOT_APPROVED
    http: 409
    condition: "the grant's ResearchPartner is not in status APPROVED"
  - id: ERR_VOLUNTEER_NOT_IN_GOOD_STANDING
    http: 403
    condition: "the acting volunteer's status is PENDING or SUSPENDED"
  - id: ERR_CERTIFICATION_NOT_VALID
    http: 403
    condition: "the observer holds no CERTIFIED, unexpired Certification for the campaign's protocol"
  - id: ERR_CERTIFICATION_LEVEL_INSUFFICIENT
    http: 403
    condition: "the observer's certification level rank is below the protocol's required_certification_level rank"
  - id: ERR_EQUIPMENT_REQUIREMENT_UNMET
    http: 422
    condition: "the protocol requires equipment but no ISSUED loan of the right type and owner was supplied"
  - id: ERR_EXPERT_SUSPENDED
    http: 403
    condition: "the acting Expert's status is SUSPENDED"
  - id: ERR_EXAM_SCORE_TOO_LOW
    http: 422
    condition: "exam_score is below PASSING_EXAM_SCORE (70)"
  - id: ERR_SITE_CAMPAIGN_MISMATCH
    http: 409
    condition: "the supplied site_id belongs to a different campaign than the supplied campaign_id"
  - id: ERR_OPEN_REVIEWS_PENDING
    http: 409
    condition: "the campaign still has observations in SUBMITTED, UNDER_REVIEW or NEEDS_REVISION at close time"
  - id: ERR_SCOPE_NOT_PERMITTED
    http: 403
    condition: "a SENSITIVE-scope grant was approved for a partner whose trust_tier is STANDARD"
  - id: ERR_DUA_NOT_SIGNED
    http: 403
    condition: "a FULL or SENSITIVE grant was approved for a partner with no data_use_agreement_signed_at"
  - id: ERR_OBSERVED_OUTSIDE_SEASON
    http: 422
    condition: "observed_at falls outside the campaign's closed season date interval"
  - id: ERR_SUBMISSION_LAG_EXCEEDED
    http: 422
    condition: "the gap between observed_at and the logical clock exceeds the protocol's max_submission_lag_hours"
  - id: ERR_EQUIPMENT_INTERVAL_CONFLICT
    http: 409
    condition: "the requested half-open loan window intersects an occupied interval, including a returned loan's quarantine tail"
  - id: ERR_SEASON_WINDOW_CONFLICT
    http: 409
    condition: "the new campaign's closed season date interval intersects a non-ARCHIVED campaign on the same protocol, adjacency included"
  - id: ERR_CALIBRATION_EXPIRED
    http: 409
    condition: "the instrument's calibration_valid_until is at or before the logical clock at issue time"
  - id: ERR_QUARANTINE_NOT_ELAPSED
    http: 409
    condition: "clear-quarantine was called before the instrument's quarantine_until"
  - id: ERR_GRANT_EXPIRY_IN_PAST
    http: 422
    condition: "expires_at is at or before the logical clock"
  - id: ERR_EMBARGO_ACTIVE
    http: 409
    condition: "a FULL or SENSITIVE grant was approved against an EMBARGOED publication"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "a uniqueness constraint was violated on protocol code, volunteer email, equipment asset_tag, publication doi, partner org_name, site_code within a campaign, or file_hash within an observation"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "resubmit was called on an observation that already used MAX_REVISION_ROUNDS revisions"
  - id: ERR_PHOTO_EVIDENCE_INSUFFICIENT
    http: 422
    condition: "start-review was called while photo_count is below the protocol's min_photo_count"
  - id: ERR_CAMPAIGN_HAS_NO_SITES
    http: 422
    condition: "open or close was called on a campaign with zero SurveySite children"
  - id: ERR_INSUFFICIENT_RECORDS
    http: 422
    condition: "fewer than MIN_RECORD_FLOOR observations are available to a publication at create or release time"
  - id: ERR_SITE_SATURATED
    http: 409
    condition: "the site already holds SATURATION_MULTIPLIER times the campaign target in accepted observations"

roles:
  - name: ProgramAdmin
    description: "Program staff who own protocol design, campaign operations, equipment stewardship, publication and partner administration."
    identity: opaque
    exclusive_operations:
      - "create and activate Protocols"
      - "register Volunteers, Experts, Equipment and ResearchPartners"
      - "enroll and grant Certifications"
      - "create, open and close Campaigns and add SurveySites"
      - "issue and take back EquipmentLoans, clear quarantine and complete calibration"
      - "retract ACCEPTED Observations"
      - "create, release and withdraw DataPublications"
      - "approve ResearchPartners, approve and revoke PartnerAccessGrants"
      - "reinstate PROBATION or SUSPENDED Volunteers"
      - "run maintenance sweeps and set the logical clock"
    shared_operations:
      - "read protocols, volunteers, experts, certifications, campaigns, sites, observations, photos, votes, equipment, loans, publications, partners, grants and awards"
      - "request EquipmentLoans"
      - "request PartnerAccessGrants"
  - name: Volunteer
    description: "Citizen observer who submits observations and photo evidence under a certification and may borrow instruments."
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "submit Observations"
      - "attach PhotoEvidence"
      - "resubmit NEEDS_REVISION Observations"
    shared_operations:
      - "request EquipmentLoans for themselves"
      - "read protocols, campaigns, sites, observations, photos, votes, equipment, loans, publications and awards"
  - name: Expert
    description: "Subject-matter verifier who trains volunteers and adjudicates observations; barred from verifying their own submissions and from casting the round-0 vote on volunteers they trained."
    identity: "entity_backed:Expert"
    exclusive_operations:
      - "complete training on a certification they are the named trainer for"
      - "start review on a SUBMITTED Observation"
      - "cast VerificationVotes"
    shared_operations:
      - "read protocols, volunteers, certifications, campaigns, sites, observations, photos, votes and publications"
  - name: ResearchPartner
    description: "External research organisation that requests scoped access to released datasets."
    identity: "entity_backed:ResearchPartner"
    exclusive_operations: []
    shared_operations:
      - "request PartnerAccessGrants for themselves"
      - "read protocols, campaigns, sites, observations, publications, their own partner record and their own grants"
