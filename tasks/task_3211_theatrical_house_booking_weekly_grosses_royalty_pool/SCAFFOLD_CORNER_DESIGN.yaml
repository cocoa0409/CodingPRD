scaffold_corner_design:
  # ===========================================================================
  # Entities section
  # ===========================================================================
  - section: entities
    instances:
      - name: theatre_create_returns_201_with_system_fields
        claim_type: creation
        grounds:
          - entities.Theatre
        distinguishing_aspect: "POST /theatres/houses with all required fields returns 201 and server-minted id, created_at, updated_at, version=1."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
          trigger:
            - call: "POST /theatres/houses"
              payload: { name: "Lyceum", capacity: 900, size_class: MEDIUM, is_landmark: false, base_weekly_rent_cents: 700000 }
              as: HouseManager
              captures: { h_id: $.data.id, h_v: $.data.version }
          assert:
            - "Theatre.${h_id}.version == 1"
            - "Theatre.${h_id}.size_class == MEDIUM"
            - "Theatre.${h_id}.created_at is present and ISO 8601"

      - name: theatre_get_missing_returns_404
        claim_type: not_found
        grounds:
          - entities.Theatre
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a non-existent theatre id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
          trigger:
            - call: "GET /theatres/houses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: HouseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: theatre_create_invalid_enum_size_class_returns_400
        claim_type: type_constraint
        grounds:
          - entities.Theatre
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "size_class outside {SMALL, MEDIUM, LARGE} is rejected as ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
          trigger:
            - call: "POST /theatres/houses"
              payload: { name: "BadClass", capacity: 100, size_class: HUGE, is_landmark: false, base_weekly_rent_cents: 1000 }
              as: HouseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"

      - name: ticket_order_computed_gross_input_ignored
        claim_type: computed_field
        grounds:
          - entities.TicketOrder.fields.computed_gross_cents
        distinguishing_aspect: "computed_gross_cents is server-computed; a client-supplied value in the create payload is rejected as unknown field and the stored value derives from the formula."
        test_recipe:
          setup:
            - "ACTIVE booking with crew and SIGNED license"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "CmpCo", contact_email: "cm@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "BijouC", capacity: 500, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 500000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show CC", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /theatres/bookings/${bk_id}/approve"
              payload: {}
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/license-agreements"
              payload: { weekly_rent_cents: 500000, stop_clause_weekly_floor_cents: 10000, stop_clause_consecutive_weeks: 2, expected_booking_version: "${bk_v}" }
              as: HouseManager
            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_v2: $.data.version }
            - call: "GET /theatres/bookings/${bk_id}/license-agreements"
              payload: {}
              as: HouseManager
              captures: { lic_id: "$.data[0].id" }
            - call: "POST /theatres/license-agreements/${lic_id}/sign"
              payload: { expected_booking_version: "${bk_v2}" }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/bookings/${bk_id}/crew-assignments"
              payload: { crew_size: 4 }
              as: HouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: HouseManager
          trigger:
            - call: "POST /theatres/bookings/${bk_id}/ticket-orders"
              payload: { performance_date: "2026-09-08T19:00:00Z", ticket_count: 2, is_group_sale: false, face_value_cents: 5000 }
              as: BoxOfficeAgent
              captures: { o_id: $.data.id, o_gross: $.data.computed_gross_cents }
          assert:
            - "TicketOrder.${o_id}.computed_gross_cents == 10000 (server-computed, 2 x 5000 x 1.0)"

      - name: booking_initial_state_is_requested
        claim_type: initial_state
        grounds:
          - state_machines.Booking
          - entities.Booking.fields.status
        distinguishing_aspect: "A newly created booking has status REQUESTED before any transition call."
        test_recipe:
          setup: ["Company, house, production exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "InitCo", contact_email: "in@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "BijouI", capacity: 500, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 500000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show Init", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_status: $.data.status }
          assert:
            - "Booking.${bk_id}.status == REQUESTED"

  # ===========================================================================
  # State machines section
  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_withdrawn_booking_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Booking
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approve from WITHDRAWN is not a declared transition; returns ERR_INVALID_STATE 409 with no side effects."
        test_recipe:
          setup: ["REQUESTED booking withdrawn by its company"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "WdCo", contact_email: "wd@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "BijouW", capacity: 500, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 500000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show W", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /theatres/bookings/${bk_id}/withdraw"
              payload: {}
              as: CompanyRep
              as_user_id: "${comp_id}"
          trigger:
            - call: "POST /theatres/bookings/${bk_id}/approve"
              payload: {}
              as: HouseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"
            - "Booking.${bk_id}.status remains WITHDRAWN"

      - name: refund_already_refunded_order_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - state_machines.TicketOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REFUNDED is terminal; a second refund on the same order returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE booking, one SOLD order refunded once"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "RfCo", contact_email: "rf@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "BijouR", capacity: 500, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 500000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show R2", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /theatres/bookings/${bk_id}/approve"
              payload: {}
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/license-agreements"
              payload: { weekly_rent_cents: 500000, stop_clause_weekly_floor_cents: 10000, stop_clause_consecutive_weeks: 2, expected_booking_version: "${bk_v}" }
              as: HouseManager
            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_v2: $.data.version }
            - call: "GET /theatres/bookings/${bk_id}/license-agreements"
              payload: {}
              as: HouseManager
              captures: { lic_id: "$.data[0].id" }
            - call: "POST /theatres/license-agreements/${lic_id}/sign"
              payload: { expected_booking_version: "${bk_v2}" }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/bookings/${bk_id}/crew-assignments"
              payload: { crew_size: 4 }
              as: HouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/ticket-orders"
              payload: { performance_date: "2026-09-08T19:00:00Z", ticket_count: 2, is_group_sale: false, face_value_cents: 5000 }
              as: BoxOfficeAgent
              captures: { o_id: $.data.id }
            - call: "POST /theatres/ticket-orders/${o_id}/refund"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /theatres/ticket-orders/${o_id}/refund"
              payload: {}
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"
            - "TicketOrder.${o_id}.status remains REFUNDED"

      - name: withdraw_cascades_void_license_and_discharge_notice
        claim_type: side_effect_execution
        grounds:
          - state_machines.Booking.REQUESTED_or_APPROVED_to_WITHDRAWN
          - state_machines.LicenseAgreement
          - state_machines.StopNotice
        distinguishing_aspect: "Withdrawing an APPROVED booking voids its SIGNED license (depth 1) and discharges any OPEN stop notice (depth 2) in the same request."
        test_recipe:
          setup:
            - "APPROVED booking with SIGNED license; ACTIVE booking with one under-floor VERIFIED week so a StopNotice is OPEN; then withdraw"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "CasCo", contact_email: "cs@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "BijouCas", capacity: 500, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 500000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show Cas", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /theatres/bookings/${bk_id}/approve"
              payload: {}
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/license-agreements"
              payload: { weekly_rent_cents: 500000, stop_clause_weekly_floor_cents: 50000, stop_clause_consecutive_weeks: 2, expected_booking_version: "${bk_v}" }
              as: HouseManager
              captures: { lic_id: $.data.id }
            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_v2: $.data.version }
            - call: "POST /theatres/license-agreements/${lic_id}/sign"
              payload: { expected_booking_version: "${bk_v2}" }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/bookings/${bk_id}/crew-assignments"
              payload: { crew_size: 4 }
              as: HouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/ticket-orders"
              payload: { performance_date: "2026-09-08T19:00:00Z", ticket_count: 2, is_group_sale: false, face_value_cents: 5000 }
              as: BoxOfficeAgent
            - call: "POST /theatres/bookings/${bk_id}/weekly-gross-reports"
              payload: { week_start: "2026-09-07T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/weekly-gross-reports/${rep_id}/submit"
              payload: {}
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/weekly-gross-reports/${rep_id}/verify"
              payload: {}
              as: HouseManager
          trigger:
            - call: "POST /theatres/bookings/${bk_id}/withdraw"
              payload: {}
              as: CompanyRep
              as_user_id: "${comp_id}"
          assert:
            - "Booking.${bk_id}.status == WITHDRAWN"
            - "LicenseAgreement.${lic_id}.status == VOIDED (depth 1 cascade)"
            - "StopNotice for booking ${bk_id} is DISCHARGED (depth 2 cascade)"

  # ===========================================================================
  # Calculations section
  # ===========================================================================
  - section: calculations
    instances:
      - name: crew_cost_uses_union_minimum_when_engaged_below
        claim_type: constants_applied
        grounds:
          - calculations.weekly_crew_cost
        distinguishing_aspect: "Settlement crew cost on a LARGE house with engaged crew below the 14 minimum is impossible (creation blocked), but engaged 16 > min 14 uses the engaged count 16 * 120000 = 1920000; the MEDIUM minimum 8 boundary is exercised separately by engaging exactly 8."
        test_recipe:
          setup:
            - "ACTIVE booking in MEDIUM house, crew exactly 8 (at the union minimum), SIGNED license rent 400000, gross week of 2000000, no participants"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "CrewCo", contact_email: "cr@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "MidH", capacity: 1200, size_class: MEDIUM, is_landmark: false, base_weekly_rent_cents: 400000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show Cr", required_size_class: MEDIUM, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /theatres/bookings/${bk_id}/approve"
              payload: {}
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/license-agreements"
              payload: { weekly_rent_cents: 400000, stop_clause_weekly_floor_cents: 10000, stop_clause_consecutive_weeks: 2, expected_booking_version: "${bk_v}" }
              as: HouseManager
            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_v2: $.data.version }
            - call: "GET /theatres/bookings/${bk_id}/license-agreements"
              payload: {}
              as: HouseManager
              captures: { lic_id: "$.data[0].id" }
            - call: "POST /theatres/license-agreements/${lic_id}/sign"
              payload: { expected_booking_version: "${bk_v2}" }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/bookings/${bk_id}/crew-assignments"
              payload: { crew_size: 8 }
              as: HouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/ticket-orders"
              payload: { performance_date: "2026-09-08T19:00:00Z", ticket_count: 8, is_group_sale: true, face_value_cents: 250000 }
              as: BoxOfficeAgent
            - call: "POST /theatres/bookings/${bk_id}/weekly-gross-reports"
              payload: { week_start: "2026-09-07T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/weekly-gross-reports/${rep_id}/submit"
              payload: {}
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/weekly-gross-reports/${rep_id}/verify"
              payload: {}
              as: HouseManager
          trigger:
            - call: "POST /theatres/weekly-gross-reports/${rep_id}/settlements"
              payload: { house_expenses_cents: 100000 }
              as: HouseManager
              captures: { s_id: $.data.id }
          assert:
            - "Settlement.${s_id}.crew_cost_cents == 960000 (8 * 120000 at exactly the MEDIUM minimum)"

      - name: royalty_pool_remainder_allocation_order
        claim_type: correct_result
        grounds:
          - calculations.weekly_settlement_split
        distinguishing_aspect: "Pool remainder cents are allocated one at a time by royalty_points DESC, tie-break created_at ASC; with points 33/33/34 and an odd pool the higher-point participant wins the remainder deterministically."
        test_recipe:
          setup:
            - "ACTIVE booking MEDIUM house, crew 8, rent 400000, house_expenses 0"
            - "Pool participants: P34 (34 points, created first), P33a (33 points), P33b (33 points)"
            - "Gross 1500000 -> theatre_share = max(400000, 450000) = 450000; profit = 1500000 - 0 - 960000 - 450000 - 0 = 90000; pool = round(0.65 * 90000) = 58500"
            - "floor(58500*34/100)=19890; floor(58500*33/100)=19305 x2; sum=58500 exactly; remainder 0 — deterministic split asserted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "PoolCo", contact_email: "po@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "MidP", capacity: 1200, size_class: MEDIUM, is_landmark: false, base_weekly_rent_cents: 400000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show Pool", required_size_class: MEDIUM, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_v: $.data.version }
