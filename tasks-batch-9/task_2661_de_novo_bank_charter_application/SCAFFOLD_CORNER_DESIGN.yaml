            - "the evidence call returns 200 and ApprovalCondition.${cb_id}.status == EVIDENCE_SUBMITTED"
            - "after the evidence call RegulatoryFiling.${f_ca_id}.open_blocking_condition_count == 1 - EVIDENCE_SUBMITTED still counts as open"
            - "after the evidence call RegulatoryFiling.${f_ca_id}.settled_condition_count == 1"
            - "the SATISFIED call returns 200 and ApprovalCondition.${cb_id}.status == SATISFIED with adjudication_count == 1"
            - "after the SATISFIED call RegulatoryFiling.${f_ca_id}.open_blocking_condition_count == 0"
            - "after the SATISFIED call RegulatoryFiling.${f_ca_id}.settled_condition_count == 2"
            - "after the SATISFIED call RegulatoryFiling.${f_ca_id}.condition_total_count == 2 - conserved throughout"
            - "after the SATISFIED call RegulatoryFiling.${f_ca_id}.pre_opening_clearance == true"
            - "RegulatoryFiling.${f_ca_id}.status == CONDITIONALLY_APPROVED and info_request_round == 0 - no cascade fired"
      - name: cascading_side_effects_from_a_policy_rejection
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PolicyDocument.EXAMINER_ACCEPTED_to_REJECTED
          - state_machines.OrganizingGroup.PRE_OPENING_to_CONDITIONALLY_APPROVED
          - state_machines.ReadinessExam.SCHEDULED_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / policy_rejection_cascades_five_levels_to_exam_cancellation
          rationale: "That instance drives the deepest cascade in the scaffold from one examiner-review call and asserts every link - condition FAILED, filing counts, filing state and info_request_round, group stage and opening_blocked_reason, and the CANCELLED exam - so the cascading-side-effects layer is covered."
      - name: dual_variant_calculation_on_one_stress_row
        claim_type: dual_variant_calculation
        grounds:
          - calculations.stress_leverage_path
          - entities.StressScenario.fields.static_min_leverage_ratio_bps
          - entities.StressScenario.fields.dynamic_min_leverage_ratio_bps
        excluded_because:
          difficulty_instance: dual_variant_calc / stress_path_static_vs_dynamic_divergence_on_severely_adverse
          rationale: "That instance stores both variants for the same scenario row, asserts the two differ, and asserts the governing selection, which is exactly the dual-variant layer claim."
  - section: consistency_model
    instances:
      - name: cascaded_group_stage_is_visible_without_any_re_read_lag
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.OrganizingGroup.UNDER_REVIEW_to_CONDITIONALLY_APPROVED
          - state_machines.RegulatoryFiling.FILED_to_CONDITIONALLY_APPROVED
          - state_machines.BusinessPlan.SUBMITTED_to_PINNED
        distinguishing_aspect: >
          Every derived value is recomputed inside the same request: the decision call on the second
          filing returns 200 and the very next read - with no retry, no polling and no intervening
          write - already shows group.stage CONDITIONALLY_APPROVED and the plan PINNED by the earlier
          decision, so no eventual-consistency window exists.
        test_recipe:
          setup:
            - "One OrganizingGroup at stage UNDER_REVIEW with both filings in status FILED."
            - "The CHARTERING_AUTHORITY filing has already been decided CONDITIONALLY_APPROVED, which"
            - "pinned the BusinessPlan; the group is still UNDER_REVIEW because the DEPOSIT_INSURER filing"
            - "is still FILED."
