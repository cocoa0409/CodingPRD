            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-TO2", year: 2023, make: "Kenworth", model: "T680", odometer_current: 28000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: $.data.id } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: $.data.id } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/service-bays", payload: { bay_code: "BAY-TO2", location: "Terminal 1" }, as: MaintenanceCoordinator, captures: { bay: $.data.id } }
            - { call: "POST /lease-program/maintenance-work-orders", payload: { lease_id: "${lease}", service_bay_id: "${bay}", category: "PREVENTIVE", description: "PM-A service", scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T10:00:00Z", estimated_cost_cents: 30000 }, as: MaintenanceCoordinator, captures: { wo1: $.data.id } }
            - { call: "POST /lease-program/maintenance-work-orders", payload: { lease_id: "${lease}", service_bay_id: "${bay}", category: "REPAIR", description: "Brake chamber", scheduled_start: "2026-08-04T12:00:00Z", scheduled_end: "2026-08-04T13:00:00Z", estimated_cost_cents: 25000 }, as: MaintenanceCoordinator, captures: { wo2: $.data.id } }
          trigger:
            - { call: "POST /lease-program/maintenance-work-orders", payload: { lease_id: "${lease}", service_bay_id: "${bay}", category: "REPAIR", description: "Air line", scheduled_start: "2026-08-04T13:30:00Z", scheduled_end: "2026-08-04T14:30:00Z", estimated_cost_cents: 15000 }, as: MaintenanceCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "WO1 and WO2 exist as OPEN (exactly-2h gap accepted at booking time)"
            - "captured err == ERR_BAY_WINDOW_CONFLICT  (30-minute gap < BAY_BUFFER_HOURS 2)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: escrow_credit_refund_conservation
        grounds:
          - calculations.escrow_credit_on_finalize
          - state_machines.EscrowAccount.REFUND_PENDING_to_REFUNDED
          - entities.EscrowAccount.fields.total_credited_cents
        distinguishing_aspect: |
          Conserved quantity = escrow dollars: for the lease's EscrowAccount,
          total_credited_cents == balance_cents + total_refunded_cents +
          total_applied_cents must hold after the forward action (3 finalize credits
          totaling 50000) paired with the compensating action (complete + disburse
          refunding all 50000). Asserted: 50000 == 0 + 50000 + 0.
        test_recipe:
          setup:
            - "ACTIVE lease (weekly 65000, escrow 20000/wk, cap 50000); W1..W3 finalized healthy (credited 20000+20000+10000 = 50000, balance 50000, status FULL)"
            - "clock advanced to 2027-08-03 (past term end)"
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-CI1" }, as: LeaseAdmin, captures: { op: $.data.id } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2028-08-01" }, as: ComplianceOfficer, captures: { d1: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2028-08-01" }, as: ComplianceOfficer, captures: { d2: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2028-08-01" }, as: ComplianceOfficer, captures: { d3: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-CI1", year: 2023, make: "Peterbilt", model: "579", odometer_current: 48000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: $.data.id } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 50000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: $.data.id } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "GET /lease-program/escrow-accounts", payload: { lease_id: "${lease}" }, as: LeaseAdmin, captures: { esc: "$.data[0].id" } }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-03", gross_revenue_cents: 250000, fuel_gallons: 200, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 22000, miles_driven: 2500, load_declined_flag: false }, as: SettlementClerk, captures: { st1: $.data.id } }
            - { call: "POST /lease-program/settlement-statements/${st1}/issue", payload: {}, as: SettlementClerk }
            - { call: "POST /lease-program/settlement-statements/${st1}/finalize", payload: {}, as: SettlementClerk }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-10", gross_revenue_cents: 250000, fuel_gallons: 200, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 22000, miles_driven: 2500, load_declined_flag: false }, as: SettlementClerk, captures: { st2: $.data.id } }
            - { call: "POST /lease-program/settlement-statements/${st2}/issue", payload: {}, as: SettlementClerk }
            - { call: "POST /lease-program/settlement-statements/${st2}/finalize", payload: {}, as: SettlementClerk }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-17", gross_revenue_cents: 250000, fuel_gallons: 200, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 22000, miles_driven: 2500, load_declined_flag: false }, as: SettlementClerk, captures: { st3: $.data.id } }
            - { call: "POST /lease-program/settlement-statements/${st3}/issue", payload: {}, as: SettlementClerk }
            - { call: "POST /lease-program/settlement-statements/${st3}/finalize", payload: {}, as: SettlementClerk }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2027-08-03T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/lease-agreements/${lease}/complete", payload: {}, as: LeaseAdmin }
          trigger:
            - { call: "POST /lease-program/escrow-accounts/${esc}/disburse", payload: {}, as: SettlementClerk }
          assert:
            - "EscrowAccount.${esc}.total_credited_cents == 50000  (20000 + 20000 + 10000 at the cap)"
            - "EscrowAccount.${esc}.total_refunded_cents == 50000 and balance_cents == 0 and total_applied_cents == 0"
            - "INVARIANT: total_credited_cents == balance_cents + total_refunded_cents + total_applied_cents  (50000 == 0 + 50000 + 0)"
            - "EscrowAccount.${esc}.status == REFUNDED"

      - name: settlement_funds_conservation_across_reissue
        grounds:
          - calculations.settlement_waterfall
          - state_machines.SettlementStatement.DISPUTED_to_ISSUED
          - entities.SettlementStatement.fields.net_pay_cents
        distinguishing_aspect: |
          Conserved quantity = weekly settlement funds: gross + top_up == net_pay +
          fuel + insurance + maintenance + lease_applied + escrow. The forward action
          (issue, maintenance 31250, net 41750) paired with its compensating dispute ->
          reissue cycle (override maintenance 10000, net 62500) preserves the equality
          250000 + 0 == 62500 + 70000 + 22000 + 10000 + 65000 + 20000.
        test_recipe:
          setup:
            - "ACTIVE lease (standard terms); settlement W1 ISSUED: gross 250000, fuel 200 gal @ 350, insurance 22000, miles 2500 (provisional maintenance 31250, escrow 20000, lease 65000, net 41750)"
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-CI2" }, as: LeaseAdmin, captures: { op: $.data.id } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-CI2", year: 2023, make: "Volvo", model: "VNL", odometer_current: 52000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: $.data.id } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: $.data.id } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-03", gross_revenue_cents: 250000, fuel_gallons: 200, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 22000, miles_driven: 2500, load_declined_flag: false }, as: SettlementClerk, captures: { st: $.data.id } }
            - { call: "POST /lease-program/settlement-statements/${st}/issue", payload: {}, as: SettlementClerk }
          trigger:
            - { call: "POST /lease-program/settlement-statements/${st}/dispute", payload: {}, as: Driver, as_user_id: "${op}" }
            - { call: "POST /lease-program/settlement-statements/${st}/reissue", payload: { maintenance_deduction_override_cents: 10000, reason: "warranty credit" }, as: SettlementClerk, captures: { st_net: $.data.net_pay_cents, st_maint: $.data.maintenance_deduction_cents } }
          assert:
            - "pre-dispute (ISSUED): maintenance 31250 and net_pay 41750 satisfy 250000 + 0 == 41750 + 70000 + 22000 + 31250 + 65000 + 20000"
            - "captured st_maint == 10000 (override) and captured st_net == 62500"
            - "INVARIANT after compensating reissue: 250000 + 0 == 62500 + 70000 + 22000 + 10000 + 65000 + 20000 (no drift)"
            - "SettlementStatement.${st}.gross_revenue_cents == 250000 (compensation never rewrites gross)"
