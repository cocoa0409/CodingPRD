      - name: a_request_with_a_missing_x_user_id_header_returns_unauthenticated_not_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=30]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_WORK_ITEM_NOT_FOUND]
        distinguishing_aspect: "Priority 10 runs before priority 30, so the same unknown workItemId yields 401 ERR_UNAUTHENTICATED when the X-User-ID header is absent and 404 ERR_WORK_ITEM_NOT_FOUND once the headers are supplied — an implementation that loads the row first would leak existence to an unauthenticated caller."
        test_recipe:
          setup:
            - "Empty database; no work item has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StandardsStaff
          trigger:
            - call: "GET /sdo/work-items/22222222-2222-2222-2222-222222222222"
              payload: {}
              as: NONE
              captures: { err: $.data.error_id }
            - call: "GET /sdo/work-items/22222222-2222-2222-2222-222222222222"
              payload: {}
              as: StandardsStaff
              captures: { err2: $.data.error_id }
          assert:
            - 'first call (X-User-Role and X-User-ID both omitted): HTTP status == 401'
            - 'first call: response.data.error_id == ERR_UNAUTHENTICATED'
            - 'second call (both headers present): HTTP status == 404'
            - 'second call: response.data.error_id == ERR_WORK_ITEM_NOT_FOUND'

      - name: a_forbidden_role_is_rejected_before_the_missing_required_field_is_noticed
        claim_type: priority_ordering
        grounds:
          - validations[priority=20]
          - validations[priority=40]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Priority 20 decides role admission from the header alone, before the body is parsed: a Proposer posting a participant with organization missing gets 403 ERR_UNAUTHORIZED, and only when StandardsStaff sends the identical malformed body does the 400 ERR_INVALID_REQUEST surface."
        test_recipe:
          setup:
            - "One registered participant (the PRODUCER) so that a valid X-User-ID exists."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /sdo/participants"
              payload: { full_name: "Hal Interloper", interest_category: "USER", employer_affiliation_code: "HALCO" }
              as: Proposer
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Hal Interloper", interest_category: "USER", employer_affiliation_code: "HALCO" }
              as: StandardsStaff
              captures: { err2: $.data.error_id }
          assert:
            - 'first call: HTTP status == 403 and response.data.error_id == ERR_UNAUTHORIZED'
            - 'second call: HTTP status == 400 and response.data.error_id == ERR_INVALID_REQUEST'
            - 'GET /sdo/participants returns total_count == 1 — neither attempt created a row'

