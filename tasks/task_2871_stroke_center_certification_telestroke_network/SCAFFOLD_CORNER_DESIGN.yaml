  - name: reading_a_center_returns_its_derived_operational_fields_without_mutating_it
    claim_type: computed_read
    grounds:
    - endpoints.GET /stroke-network/stroke-centers/{id} output StrokeCenter
    - entities.StrokeCenter.open_case_count, entities.StrokeCenter.equipment_readiness_posture
    - calculations.ems_routing_posture
    distinguishing_aspect: 'A GET must expose every derived field and must be free of side effects, which is easy to get wrong when a field is recomputed lazily on read: the version and updated_at must be IDENTICAL across two consecutive GETs even though open_case_count changed between them because of a write elsewhere. All six roles may read.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; one SPOKE centre with both readiness flags true.
      - Two CodeStrokeCases have been activated at that centre and neither has terminated.
