      - name: track_committed_railcars_exactly_at_spot_capacity_is_accepted
        grounds:
          - calculations.track_capacity_commitment
          - validations[priority=50]
          - errors[ERR_TRACK_CAPACITY_EXCEEDED]
          - entities.LoadingTrack.fields.spot_capacity
          - concurrency_rules[shipment-schedule-stale-track]
        distinguishing_aspect: |
          The capacity bound is inclusive on an aggregate: 60 plus 50 railcars in
          overlapping windows reach exactly spot_capacity 110 and are both
          accepted, while one further railcar in an overlapping window is
          rejected with ERR_TRACK_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Plant exists; tank T-301 is a DENATURED_E100 tank with 900000.00 gallons; track TRK-A has spot_capacity 110."
            - "Shipment UT-9001 holds 60 railcars over 2026-09-05T06:00:00Z to 2026-09-05T12:00:00Z."
            - "Shipment UT-9002 holds 50 railcars over 2026-09-05T08:00:00Z to 2026-09-05T14:00:00Z, so 110 railcars are committed across the overlap."
