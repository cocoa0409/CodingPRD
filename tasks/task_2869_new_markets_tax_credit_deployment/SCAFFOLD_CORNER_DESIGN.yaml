            - "THRESHOLD RE-CROSSED UPWARD — after the cure, substantially_all_pct_direct == 85.00 exactly (30,000,000 + 50,750,000 = 80,750,000 over 95,000,000), which is inclusive, so QEI compliance_status == \"COMPLIANT\""
