        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers (modeled here as an unknown role) returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { caption: "No Auth", docket_number: "C-2033", jurisdiction: "STATE_CA", noticing_attorney_id: "00000000-0000-4000-8000-000000000001" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Section: cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_job_version_on_assignment_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-job]", "endpoints[\"POST /jobs/{id}/assignments\"]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one assignment advances Job.version, a second assignment-create carrying the pre-advance version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A NOTICED job at version 1; a reporter and a videographer exist. One reporter assignment is added (job advances to version 2)."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C ThirtyFour", firm_name: "C34 LLP", bar_state: "CA", email: "c34@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "OCC Case", docket_number: "C-2034", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep KN", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Vid E", kind: "VIDEOGRAPHER", hourly_appearance_cents: 8000 }
              as: ScheduleCoordinator
              captures: { vid_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T11:00:00Z", requires_videographer: true }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
          trigger:
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${vid_id}", role: "VIDEOGRAPHER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: occ_correct_job_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-job]", "endpoints[\"POST /jobs/{id}/assignments\"]", entities.Job.fields.version]
        distinguishing_aspect: "Supplying the current Job.version on assignment create succeeds (201) and the job's version increments by exactly 1."
        test_recipe:
          setup: ["A NOTICED job at version 1 with a reporter and a videographer registered."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C ThirtyFive", firm_name: "C35 LLP", bar_state: "CA", email: "c35@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "OCC OK", docket_number: "C-2035", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep KO", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Vid F", kind: "VIDEOGRAPHER", hourly_appearance_cents: 8000 }
              as: ScheduleCoordinator
              captures: { vid_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", requires_videographer: true }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
          trigger:
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${vid_id}", role: "VIDEOGRAPHER", expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
          assert:
            - "response.status == 201"
            - "Job.${job_id}.version == 3"
            - "Job.${job_id}.staffing_posture == READY"

      - name: derived_invoice_total_reconciles_from_subtotals
        claim_type: derived_field_reconciliation
        grounds: [calculations.compute_invoice_total, entities.Invoice.fields.total_cents]
        distinguishing_aspect: "On invoice issue, total_cents == appearance_subtotal + page_subtotal + exhibit_subtotal exactly; for NY 40p STANDARD certified, reporter 2h @10000, exhibits 12+8 pages the total reconciles to 40000."
        test_recipe:
          setup: ["A delivered NY 40-page STANDARD certified transcript with exhibits 12 (public) + 8 (confidential) on a reporter-only 2h @10000 job; invoice created."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C ThirtySix", firm_name: "C36 LLP", bar_state: "NY", email: "c36@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Reconcile", docket_number: "C-2036", jurisdiction: "STATE_NY", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep KP", kind: "REPORTER", certifications: ["RPR"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/start"
              payload: { expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
              captures: { job_v3: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/adjourn"
              payload: { expected_job_version: "${job_v3}" }
              as: ScheduleCoordinator
            - call: "POST /transcript-orders"
              payload: { job_id: "${job_id}", ordering_attorney_id: "${att_id}", turnaround_tier: "STANDARD", certified_copy: true, estimated_pages: 40 }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { to_id: $.data.id }
            - call: "POST /transcript-orders/${to_id}/exhibits"
              payload: { marked_label: "Exhibit 1", page_count: 12, confidential: false }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /transcript-orders/${to_id}/exhibits"
              payload: { marked_label: "Exhibit 2", page_count: 8, confidential: true }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /transcript-orders/${to_id}/deliver-rough"
              payload: {}
              as: Reporter
              as_user_id: "${rep_id}"
            - call: "POST /transcript-orders/${to_id}/certify"
              payload: { final_pages: 40 }
              as: Reporter
              as_user_id: "${rep_id}"
            - call: "POST /transcript-orders/${to_id}/sign"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /transcript-orders/${to_id}/deliver"
              payload: {}
              as: ScheduleCoordinator
            - call: "POST /invoices"
              payload: { job_id: "${job_id}", transcript_order_id: "${to_id}" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingClerk
          assert:
            - "Invoice.${inv_id}.appearance_subtotal_cents == 20000"
            - "Invoice.${inv_id}.page_subtotal_cents == 18500"
            - "Invoice.${inv_id}.exhibit_subtotal_cents == 1500"
            - "Invoice.${inv_id}.total_cents == 40000"

      - name: cascade_adjourn_end_to_end_completes_and_prices
        claim_type: cascading_side_effects
        grounds: [state_machines.Job.IN_SESSION_to_ADJOURNED, state_machines.Assignment.ACTIVE_to_COMPLETED]
        excluded_because:
          difficulty_instance: transitive_cascade / adjourn_cascade_completes_assignment_then_computes_fee_depth3
          rationale: "The full adjourn cascade (Job->Assignment COMPLETED->appearance_fee) is exercised end-to-end by the named §1.8 depth-3 cascade instance."

