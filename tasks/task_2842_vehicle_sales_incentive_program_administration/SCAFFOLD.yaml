scenario: |
  2842. Vehicle Sales Incentive Program Administration (automaker incentive operations): incentive program design across customer cash, financing subvention, lease support and dealer stair-step objectives, eligibility rules by model, trim, build date and geography with stackability constraints, dealer objective setting from historical volume and market opportunity with protest handling, claim submission from the dealer system with retail delivery reporting validation, incentive payment timing, chargeback for unwound deals and back-dated sales detection, program overlap and re-pricing when programs change mid-month, budget accrual, per-unit incentive spend monitoring and residual value impact of lease support

domain_name: "vehicle-sales-incentive-program-administration"
api_prefix: "/incentives"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # IncentiveProgram is self-referential (supersedes_program_id) and joined to
  # itself many-to-many through StackabilityConstraint; Claim is a cross-aggregate
  # junction over (RetailDelivery, IncentiveProgram, Dealer, PaymentBatch).

  state_machine_shape: cyclic
  # DealerObjective loops PROPOSED -> PROTESTED -> REVISED -> PROTESTED (bounded at
  # 2 protest rounds); Claim additionally carries two independent state dimensions
  # (validation_status x payment_status); ObjectiveProtest is a fork-join branch
  # (OPEN -> {UPHELD, DENIED}) with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # Two enforced separations: (1) the X-User-ID that submits a program for
  # approval may not approve it; (2) the ClaimsAuditor X-User-ID that validated a
  # RetailDelivery may not adjudicate a Claim built on that delivery.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: IncentiveProgram
    parent: null
    common_fields: true
    description: "A funded incentive program of one incentive_type with an effective window, an eligibility footprint (EligibilityRule children), stackability edges and a money ledger."
    fields:
      - name: program_code
        type: string
        source: input
        description: "Human-readable program code, unique across all programs regardless of status."
        constraints: "1-32 chars; uniqueness is global (including CLOSED and SUPERSEDED programs)"
      - name: name
        type: string
        source: input
        description: "Display name of the program."
      - name: incentive_type
        type: enum
        source: input
        description: "Which incentive lever this program pulls."
        constraints: "one of {CUSTOMER_CASH, FINANCE_SUBVENTION, LEASE_SUPPORT, DEALER_STAIR_STEP}"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Lifecycle state; see state_machines.IncentiveProgram."
        constraints: "one of {DRAFT, PENDING_APPROVAL, ACTIVE, SUPERSEDED, CLOSED}"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the program window (ISO 8601 UTC, three fractional digits)."
      - name: effective_to
        type: datetime
        source: input
        description: "EXCLUSIVE end of the program window (ISO 8601 UTC, three fractional digits); window is half-open [effective_from, effective_to)."
        constraints: "must be strictly greater than effective_from"
      - name: per_unit_amount_cents
        type: integer
        source: input
        description: "Cash value in cents the program pays per eligible retail delivery (for DEALER_STAIR_STEP this is the base per-unit bonus before tier_schedule)."
        constraints: ">= 0"
      - name: apr_buydown_bps
        type: integer
        source: input
        default: 0
        description: "Basis points of APR bought down; only consulted when incentive_type == FINANCE_SUBVENTION."
        constraints: ">= 0 and <= 2000"
      - name: residual_support_bps
        type: integer
        source: input
        default: 0
        description: "Basis points of residual value supported by the automaker; only consulted when incentive_type == LEASE_SUPPORT."
        constraints: ">= 0 and <= 1500"
      - name: stack_group
        type: string
        source: input
        description: "Label used only for reporting groups; stackability decisions are made from StackabilityConstraint rows, never from this label."
      - name: priority_rank
        type: integer
        source: input
        description: "Waterfall order for stacking; lower rank is applied to the deal first. Ties are broken by created_at ASC."
        constraints: ">= 1"
      - name: stack_cap_cents
        type: integer
        source: input
        default: 0
        description: "Program-level ceiling in cents on the total stacked incentive of any single delivery that consumes this program; 0 means this program imposes no ceiling."
        constraints: ">= 0"
      - name: budget_cents
        type: integer
        source: input
        description: "Total funded budget in cents."
        constraints: ">= 0"
      - name: tier_schedule
        type: array
        source: input
        default: []
        description: "Ordered stair-step tiers, each an object { tier_index: integer, threshold_bps: integer, per_unit_bonus_cents: integer }. threshold_bps is attainment in basis points of the dealer objective (10000 == 100.00%). Must be strictly ascending by tier_index and by threshold_bps. Ignored unless incentive_type == DEALER_STAIR_STEP."
      - name: tier_bonus_mode
        type: enum
        source: input
        default: MARGINAL
        description: "Selects the stair-step payout variant; see calculations.dealer_stair_step_payout."
        constraints: "one of {MARGINAL, FULL_VOLUME}"
      - name: accrual_method
        type: enum
        source: input
        default: UNIT_BASED
        description: "Selects the budget accrual variant; see calculations.budget_accrual_amount."
        constraints: "one of {UNIT_BASED, TAKE_RATE_BASED}"
      - name: projected_take_rate_bps
        type: integer
        source: input
        default: 0
        description: "Projected share (basis points) of eligible model/region volume expected to take this incentive; only consulted by the TAKE_RATE_BASED accrual variant."
        constraints: ">= 0 and <= 10000"
      - name: committed_cents
        type: integer
        source: computed
        default: 0
        description: "Money the program has irrevocably committed; see calculations.program_committed_ledger."
      - name: paid_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of approved_amount_cents over this program's Claims with payment_status == PAID."
      - name: accrued_budget_cents
        type: integer
        source: computed
        default: 0
        description: "Net accrual carried on the books; see calculations.program_accrual_ledger."
      - name: claimed_units
        type: integer
        source: computed
        default: 0
        description: "Count of this program's Claims whose validation_status == VALIDATED and payment_status IN {UNPAID, SCHEDULED, PAID}."
      - name: per_unit_spend_cents
        type: integer
        source: computed
        default: 0
        description: "Per-unit incentive spend monitor; see calculations.per_unit_incentive_spend."
      - name: residual_impact_bps
        type: integer
        source: computed
        default: 0
        description: "Residual value impact of lease support in basis points; see calculations.residual_value_impact."
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID that performed the DRAFT -> PENDING_APPROVAL transition; cleared to null on a PENDING_APPROVAL -> DRAFT revision."
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID that performed the PENDING_APPROVAL -> ACTIVE transition."
      - name: supersedes_program_id
        type: string
        source: input
        default: null
        description: "FK -> IncentiveProgram.id; null unless this program replaces an earlier one, in which case approving this program drives the referenced program to SUPERSEDED."

  - name: EligibilityRule
    parent: IncentiveProgram
    common_fields: false
    description: "One row of the program's eligibility footprint. Append-only configuration: created while the program is DRAFT, never mutated."
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> IncentiveProgram.id; owning program, supplied by the path."
      - name: model_code
        type: string
        source: input
        description: "Vehicle model code this row admits."
        constraints: "1-16 chars; exact match, no wildcard"
      - name: trim_code
        type: string
        source: input
        default: null
        description: "Trim code this row admits; null admits every trim of model_code."
      - name: region_code
        type: string
        source: input
        description: "Geography code this row admits; matched against RetailDelivery.customer_region_code."
        constraints: "1-8 chars; exact match, no wildcard"
      - name: build_date_from
        type: datetime
        source: input
        description: "INCLUSIVE earliest RetailDelivery.build_date admitted (ISO 8601 UTC, three fractional digits)."
      - name: build_date_to
        type: datetime
        source: input
        description: "INCLUSIVE latest RetailDelivery.build_date admitted; build-date matching is the closed interval [build_date_from, build_date_to]."
        constraints: "must be >= build_date_from"
      - name: min_msrp_cents
        type: integer
        source: input
        default: 0
        description: "Inclusive MSRP floor in cents; 0 means no floor."
        constraints: ">= 0"
      - name: max_msrp_cents
        type: integer
        source: input
        default: null
        description: "Inclusive MSRP ceiling in cents; null means no ceiling."
      - name: allowed_deal_types
        type: array
        source: input
        default: ["CASH", "FINANCE", "LEASE"]
        description: "RetailDelivery.deal_type values this row admits; array of enum members from {CASH, FINANCE, LEASE}."

  - name: StackabilityConstraint
    parent: IncentiveProgram
    common_fields: false
    description: "Undirected stackability edge between two programs. Append-only configuration."
    fields:
      - name: program_a_id
        type: string
        source: input
        description: "FK -> IncentiveProgram.id; the program named in the request path (lower end of the edge for lookup purposes)."
      - name: program_b_id
        type: string
        source: input
        description: "FK -> IncentiveProgram.id; the other program of the edge."
        constraints: "must differ from program_a_id"
      - name: mode
        type: enum
        source: input
        description: "How the pair may combine on one delivery."
        constraints: "one of {FORBIDDEN, CAPPED_TOTAL, ALLOWED}"
      - name: cap_amount_cents
        type: integer
        source: input
        default: null
        description: "Combined ceiling in cents for the pair; required when mode == CAPPED_TOTAL, must be null otherwise."

  - name: Dealer
    parent: null
    common_fields: true
    description: "A franchised dealer that reports retail deliveries and submits incentive claims."
    fields:
      - name: dealer_code
        type: string
        source: input
        description: "Unique dealer code."
        constraints: "1-16 chars, globally unique"
      - name: name
        type: string
        source: input
        description: "Dealer legal name."
      - name: region_code
        type: string
        source: input
        description: "Geography the dealer belongs to; used for PaymentBatch region scoping."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Dealer standing; SUSPENDED dealers may still report and claim but their claims cannot be disbursed."
        constraints: "one of {ACTIVE, SUSPENDED, TERMINATED}"
      - name: historical_volume_units
        type: integer
        source: input
        description: "Trailing-12-month retail volume used as the objective-setting basis."
        constraints: ">= 0"
      - name: market_opportunity_bps
        type: integer
        source: input
        description: "Market opportunity uplift in basis points over historical volume (2500 == +25.00%)."
        constraints: ">= 0 and <= 20000"
      - name: paid_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of approved_amount_cents over this dealer's Claims with payment_status == PAID."
      - name: open_chargeback_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Chargeback.amount_cents with status == PENDING over this dealer's Claims."

  - name: DealerObjective
    parent: IncentiveProgram
    common_fields: true
    description: "A DEALER_STAIR_STEP objective assigned to one dealer for one program. Cyclic lifecycle through dealer protests."
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> IncentiveProgram.id; owning stair-step program, supplied by the path."
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer the objective binds."
      - name: stretch_bps
        type: integer
        source: input
        default: 0
        description: "Additional stretch applied on top of market_opportunity_bps when proposing the objective, in basis points."
        constraints: ">= 0 and <= 10000"
      - name: basis_units
        type: integer
        source: computed
        description: "Volume basis actually used for the current objective_units; equals Dealer.historical_volume_units at PROPOSED, and equals the upheld ObjectiveProtest.claimed_basis_units after a REVISED transition."
      - name: objective_units
        type: integer
        source: computed
        description: "Assigned unit objective; see calculations.objective_units_proposal."
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Lifecycle state; see state_machines.DealerObjective."
        constraints: "one of {PROPOSED, PROTESTED, REVISED, FINAL, VOID}"
      - name: protest_round
        type: integer
        source: computed
        default: 0
        description: "Number of ObjectiveProtest rows filed against this objective; hard-capped at MAX_PROTEST_ROUNDS."
      - name: achieved_units
        type: integer
        source: computed
        default: 0
        description: "Count of eligible VALIDATED retail deliveries credited to this objective; see calculations.objective_achieved_units."
      - name: attainment_bps
        type: integer
        source: computed
        default: 0
        description: "achieved_units / objective_units in basis points, floor-rounded; see calculations.dealer_stair_step_payout."
      - name: tier_attained
        type: integer
        source: computed
        default: 0
        description: "Highest tier_index of the program's tier_schedule whose threshold_bps is <= attainment_bps; 0 when no tier is reached."
      - name: payout_cents
        type: integer
        source: computed
        default: 0
        description: "Stair-step payout currently earned; see calculations.dealer_stair_step_payout."
      - name: paid_payout_cents
        type: integer
        source: system
        default: 0
        description: "Portion of payout_cents already carried by a STAIR_STEP_BONUS Claim with payment_status == PAID."

  - name: ObjectiveProtest
    parent: DealerObjective
    common_fields: true
    description: "A dealer's protest of an assigned objective. Fork-join branch: OPEN resolves to UPHELD or DENIED with divergent side-effect sets."
    fields:
      - name: objective_id
        type: string
        source: input
        description: "FK -> DealerObjective.id; the protested objective, supplied by the path."
      - name: round_index
        type: integer
        source: system
        description: "1-based protest round; equals DealerObjective.protest_round after this row is created."
      - name: claimed_basis_units
        type: integer
        source: input
        description: "The volume basis the dealer asserts should have been used instead of Dealer.historical_volume_units."
        constraints: ">= 0"
      - name: reason
        type: string
        source: input
        description: "Free-text protest justification."
        constraints: "1-500 chars"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Resolution state; see state_machines.ObjectiveProtest."
        constraints: "one of {OPEN, UPHELD, DENIED}"
      - name: resolved_units
        type: integer
        source: system
        default: null
        description: "objective_units recomputed from claimed_basis_units when the protest is UPHELD; stays null when DENIED."
      - name: resolved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the FieldSalesManager that resolved the protest."

  - name: RetailDelivery
    parent: Dealer
    common_fields: true
    description: "A retail delivery reported by the dealer system. Carries the vehicle attributes eligibility is matched against."
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; reporting dealer."
      - name: vin
        type: string
        source: input
        description: "Vehicle identification number; globally unique across all RetailDelivery rows including UNWOUND ones."
        constraints: "exactly 17 chars, globally unique"
      - name: model_code
        type: string
        source: input
        description: "Vehicle model code, matched against EligibilityRule.model_code."
      - name: trim_code
        type: string
        source: input
        description: "Vehicle trim code, matched against EligibilityRule.trim_code when that field is non-null."
      - name: build_date
        type: datetime
        source: input
        description: "Factory build instant (ISO 8601 UTC, three fractional digits), matched against the closed interval [build_date_from, build_date_to]."
      - name: msrp_cents
        type: integer
        source: input
        description: "Sticker price in cents."
        constraints: "> 0"
      - name: sale_date
        type: datetime
        source: input
        description: "Retail delivery instant asserted by the dealer (ISO 8601 UTC, three fractional digits)."
      - name: reported_at
        type: datetime
        source: system
        description: "Logical clock reading when the delivery was POSTed."
      - name: customer_region_code
        type: string
        source: input
        description: "Customer geography, matched against EligibilityRule.region_code."
      - name: deal_type
        type: enum
        source: input
        description: "Financing form of the deal."
        constraints: "one of {CASH, FINANCE, LEASE}"
      - name: term_months
        type: integer
        source: input
        default: 0
        description: "Contract term in months; must be > 0 when deal_type IN {FINANCE, LEASE}."
      - name: contract_apr_bps
        type: integer
        source: input
        default: 0
        description: "Customer contract APR in basis points; consulted by the finance-subvention leg of the claim amount."
      - name: base_residual_bps
        type: integer
        source: input
        default: 0
        description: "Unsupported residual of the vehicle in basis points of MSRP; must be > 0 when deal_type == LEASE."
      - name: status
        type: enum
        source: system
        default: REPORTED
        description: "Lifecycle state; see state_machines.RetailDelivery."
        constraints: "one of {REPORTED, VALIDATED, REJECTED, UNWOUND}"
      - name: reporting_lag_days
        type: integer
        source: computed
        description: "Whole days between sale_date and reported_at; see calculations.back_dated_sale_detection."
      - name: back_dated_flag
        type: boolean
        source: computed
        default: false
        description: "True when the delivery trips the back-dated-sale detector; see calculations.back_dated_sale_detection."
      - name: validated_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ClaimsAuditor that ran the REPORTED -> VALIDATED transition; the segregation-of-duties check on claim adjudication compares against this."
      - name: unwound_at
        type: datetime
        source: system
        default: null
        description: "Logical clock reading when the deal was unwound."

  - name: Claim
    parent: RetailDelivery
    common_fields: true
    description: "A dealer incentive claim against one program. Carries two independent state dimensions: validation_status and payment_status."
    fields:
      - name: delivery_id
        type: string
        source: input
        description: "FK -> RetailDelivery.id; the delivery being claimed. Null is never allowed for claim_type == UNIT_INCENTIVE; for STAIR_STEP_BONUS it points at the dealer's most recent VALIDATED delivery credited to the objective."
      - name: dealer_id
        type: string
        source: computed
        description: "FK -> Dealer.id; copied from the delivery's dealer_id at creation and never re-derived."
      - name: program_id
        type: string
        source: input
        description: "FK -> IncentiveProgram.id; the program being claimed against."
      - name: payment_batch_id
        type: string
        source: system
        default: null
        description: "FK -> PaymentBatch.id; set when the claim is scheduled into a batch, cleared to null on chargeback."
      - name: claim_type
        type: enum
        source: computed
        description: "UNIT_INCENTIVE when the claimed program's incentive_type is in {CUSTOMER_CASH, FINANCE_SUBVENTION, LEASE_SUPPORT}; STAIR_STEP_BONUS when it is DEALER_STAIR_STEP."
        constraints: "one of {UNIT_INCENTIVE, STAIR_STEP_BONUS}"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Amount in cents the dealer system asks for; recorded verbatim and compared against approved_amount_cents."
        constraints: ">= 0"
      - name: approved_amount_cents
        type: integer
        source: computed
        description: "Amount the automaker will actually pay; see calculations.claim_payable_amount."
      - name: rate_basis
        type: enum
        source: computed
        description: "Which rate the approved amount used; see calculations.claim_payable_amount variants."
        constraints: "one of {AS_SOLD_SNAPSHOT, REPRICED_CURRENT}"
      - name: snapshot_per_unit_cents
        type: integer
        source: system
        description: "IncentiveProgram.per_unit_amount_cents frozen at claim creation, used by the AS_SOLD_SNAPSHOT variant."
      - name: validation_status
        type: enum
        source: system
        default: SUBMITTED
        description: "Adjudication dimension; see state_machines.Claim."
        constraints: "one of {SUBMITTED, VALIDATED, REJECTED}"
      - name: payment_status
        type: enum
        source: system
        default: UNPAID
        description: "Money dimension, independent of validation_status; see state_machines.Claim."
        constraints: "one of {UNPAID, SCHEDULED, PAID, CHARGED_BACK}"
      - name: rejection_error_id
        type: string
        source: system
        default: null
        description: "The error_id recorded when adjudication rejected the claim."
      - name: adjudicated_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ClaimsAuditor that adjudicated the claim."
      - name: paid_at
        type: datetime
        source: system
        default: null
        description: "Logical clock reading when the owning batch was disbursed."

  - name: PaymentBatch
    parent: null
    common_fields: true
    description: "A regional disbursement batch covering a closed pay period. The pay period is the occupied interval of the region-as-resource."
    fields:
      - name: batch_code
        type: string
        source: input
        description: "Unique batch code."
        constraints: "1-24 chars, globally unique"
      - name: region_code
        type: string
        source: input
        description: "Region whose dealers this batch pays; period-overlap is checked only against batches of the same region_code."
      - name: period_start
        type: datetime
        source: input
        description: "INCLUSIVE start of the pay period (ISO 8601 UTC, three fractional digits)."
      - name: period_end
        type: datetime
        source: input
        description: "INCLUSIVE end of the pay period; the period is the closed interval [period_start, period_end]."
        constraints: "must be >= period_start"
      - name: scheduled_pay_date
        type: datetime
        source: input
        description: "Instant the batch is intended to disburse; disbursement is refused before this instant."
        constraints: "must be >= period_end"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Lifecycle state; see state_machines.PaymentBatch."
        constraints: "one of {OPEN, LOCKED, DISBURSED, CANCELLED}"
      - name: claim_count
        type: integer
        source: computed
        default: 0
        description: "Count of Claims whose payment_batch_id equals this batch and payment_status IN {SCHEDULED, PAID}."
      - name: total_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of approved_amount_cents over Claims whose payment_batch_id equals this batch and payment_status IN {SCHEDULED, PAID}."
      - name: held_claim_count
        type: integer
        source: computed
        default: 0
        description: "Count of this batch's SCHEDULED claims whose dealer_id points at a Dealer with status IN {SUSPENDED, TERMINATED} at the moment of the last disburse attempt."
      - name: disbursed_at
        type: datetime
        source: system
        default: null
        description: "Logical clock reading when the batch was disbursed."

  - name: Chargeback
    parent: Claim
    common_fields: true
    description: "A recovery of incentive money already committed or paid on a claim."
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim being charged back, supplied by the path."
      - name: reason
        type: enum
        source: input
        description: "Why the money is being recovered."
        constraints: "one of {UNWOUND_DEAL, BACK_DATED_SALE, DUPLICATE_CLAIM, OBJECTIVE_REVISED, REPRICING_ADJUSTMENT}"
      - name: amount_cents
        type: integer
        source: computed
        description: "Amount to recover; see calculations.chargeback_recovery_amount."
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Recovery state; see state_machines.Chargeback."
        constraints: "one of {PENDING, RECOVERED, WRITTEN_OFF}"
      - name: created_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ClaimsAuditor that raised the chargeback; null for system-raised chargebacks from an unwind, a protest uphold or a retroactive repricing."
      - name: recovered_at
        type: datetime
        source: system
        default: null
        description: "Logical clock reading when the chargeback was recovered or written off."

  - name: BudgetAccrual
    parent: IncentiveProgram
    common_fields: true
    description: "One accrual-run entry on a program's books for one calendar month. Entries are additive; reversals are separate rows."
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> IncentiveProgram.id; owning program, supplied by the path."
      - name: period_month
        type: string
        source: input
        description: "Accrual period in YYYY-MM form."
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$; at most one ACCRUAL entry per (program_id, period_month)"
      - name: accrual_method
        type: enum
        source: system
        description: "Copied from IncentiveProgram.accrual_method at run time so later program edits do not rewrite history."
        constraints: "one of {UNIT_BASED, TAKE_RATE_BASED}"
      - name: entry_type
        type: enum
        source: system
        description: "ACCRUAL for an accrual run, REVERSAL for a row raised by a chargeback cascade."
        constraints: "one of {ACCRUAL, REVERSAL}"
      - name: unit_basis
        type: integer
        source: computed
        default: 0
        description: "Unit count that drove the accrued amount; see calculations.budget_accrual_amount."
      - name: accrued_cents
        type: integer
        source: computed
        default: 0
        description: "Amount accrued by this entry; always 0 on a REVERSAL row."
      - name: reversal_cents
        type: integer
        source: computed
        default: 0
        description: "Amount reversed by this entry; always 0 on an ACCRUAL row."
      - name: source_reference
        type: string
        source: system
        default: null
        description: "Audit breadcrumb naming the Chargeback id that produced a REVERSAL row; a plain string, not a foreign key, and never used in any business decision."

  - name: RepricingEvent
    parent: IncentiveProgram
    common_fields: true
    description: "A mid-month change of a program's per-unit amount, applied prospectively or retroactively to the month start."
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> IncentiveProgram.id; the repriced program, supplied by the path."
      - name: mode
        type: enum
        source: input
        description: "PROSPECTIVE leaves existing claims alone; RETROACTIVE_TO_MONTH_START re-evaluates every claim of the current month."
        constraints: "one of {PROSPECTIVE, RETROACTIVE_TO_MONTH_START}"
      - name: new_per_unit_amount_cents
        type: integer
        source: input
        description: "Replacement value written onto IncentiveProgram.per_unit_amount_cents."
        constraints: ">= 0"
      - name: effective_at
        type: datetime
        source: system
        description: "Logical clock reading when the repricing was applied."
      - name: previous_per_unit_amount_cents
        type: integer
        source: system
        description: "IncentiveProgram.per_unit_amount_cents as it stood immediately before this event."
      - name: month_start
        type: datetime
        source: system
        description: "First instant of the calendar month containing effective_at; the retroactive re-evaluation window is the half-open interval [month_start, effective_at)."
      - name: affected_claim_count
        type: integer
        source: computed
        default: 0
        description: "Count of claims whose approved_amount_cents this event actually changed; see calculations.repricing_reevaluation."
      - name: net_adjustment_cents
        type: integer
        source: computed
        default: 0
        description: "Signed sum of per-claim approved-amount deltas this event produced; see calculations.repricing_reevaluation."

state_machines:
  - entity: IncentiveProgram
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CLOSED]
    shape: "branching with revert (DRAFT -> PENDING_APPROVAL -> DRAFT is a genuine cycle) plus a system-driven SUPERSEDED branch"
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /incentives/programs/{id}/submit"
        actor: ProgramDesigner
        preconditions:
          - "program.status == DRAFT"
          - "the program has at least one EligibilityRule child"
          - "program.effective_to > program.effective_from"
          - "if program.incentive_type == DEALER_STAIR_STEP then program.tier_schedule has at least one element"
          - "if program.incentive_type == LEASE_SUPPORT then program.residual_support_bps > 0"
          - "no other program with status IN {PENDING_APPROVAL, ACTIVE} and the same incentive_type collides per validations[priority=12] (program window/footprint overlap)"
        side_effects:
          - "sets program.submitted_by_user_id = X-User-ID of the caller"
          - "increments IncentiveProgram.version by 1"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /incentives/programs/{id}/revise"
        actor: ProgramDesigner
        preconditions:
          - "program.status == PENDING_APPROVAL"
        side_effects:
          - "sets program.submitted_by_user_id = null so the next submit re-establishes the segregation-of-duties baseline"
          - "increments IncentiveProgram.version by 1"
        note: "This is the revision loop that makes the machine cyclic: the same program may be submitted, revised and re-submitted without limit, and each re-submit re-runs the overlap check against the state of the world at that moment."
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /incentives/programs/{id}/approve"
        actor: IncentiveController
        preconditions:
          - "program.status == PENDING_APPROVAL"
          - "X-User-ID of the caller != program.submitted_by_user_id (segregation of duties)"
          - "if program.supersedes_program_id is non-null, the referenced program exists and has status == ACTIVE"
          - "the overlap check of validations[priority=12] still passes, ignoring any program this one supersedes"
        side_effects:
          - "sets program.approved_by_user_id = X-User-ID of the caller"
          - "CASCADE LINK 1: if program.supersedes_program_id is non-null, the referenced program transitions ACTIVE -> SUPERSEDED"
          - "increments IncentiveProgram.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: approval of a successor program whose supersedes_program_id points at this program"
        actor: system
        preconditions:
          - "program.status == ACTIVE"
        side_effects:
          - "CASCADE LINK 2 (caused by link 1, not by the approve call): every Claim of this program with validation_status == SUBMITTED is driven to validation_status = REJECTED with rejection_error_id = 'ERR_PROGRAM_NOT_ACTIVE'"
          - "CASCADE LINK 3 (caused by link 2): each such rejection drops the claim out of the committed input set, so program.committed_cents, program.claimed_units and program.per_unit_spend_cents are recomputed per calculations.program_committed_ledger and calculations.per_unit_incentive_spend"
          - "increments IncentiveProgram.version by 1 on the superseded program"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /incentives/programs/{id}/close"
        actor: IncentiveController
        preconditions:
          - "program.status == ACTIVE"
          - "no Claim of this program has payment_status == SCHEDULED"
        side_effects:
          - "conditional cascade: every DealerObjective of this program whose status IN {PROPOSED, PROTESTED, REVISED} transitions to VOID; objectives already FINAL or VOID are untouched"
          - "each VOIDed objective drives its ObjectiveProtest rows with status == OPEN to DENIED with resolved_units = null"
          - "increments IncentiveProgram.version by 1"

  - entity: DealerObjective
    initial_state: PROPOSED
    terminal_states: [VOID]
    shape: "cyclic — PROPOSED -> PROTESTED -> REVISED -> PROTESTED -> REVISED, and FINAL -> PROTESTED re-opens a finalized objective, all bounded by MAX_PROTEST_ROUNDS = 2. FINAL is NOT terminal: it freezes objective_units for claim adjudication only, and a protest filed while protest_round < MAX_PROTEST_ROUNDS un-finalizes it."
    transitions:
      - from: PROPOSED
        to: PROTESTED
        trigger: "POST /incentives/objectives/{id}/protests"
        actor: Dealer
        preconditions:
          - "objective.status IN {PROPOSED, REVISED, FINAL}"
          - "X-User-ID of the caller == objective.dealer_id"
          - "objective.protest_round < 2 (MAX_PROTEST_ROUNDS)"
          - "the owning program has status == ACTIVE"
        side_effects:
          - "creates an ObjectiveProtest with status = OPEN and round_index = objective.protest_round + 1"
          - "increments objective.protest_round by 1"
          - "increments DealerObjective.version by 1"
      - from: REVISED
        to: PROTESTED
        trigger: "POST /incentives/objectives/{id}/protests"
        actor: Dealer
        preconditions:
          - "objective.status == REVISED"
          - "X-User-ID of the caller == objective.dealer_id"
          - "objective.protest_round < 2 (MAX_PROTEST_ROUNDS)"
          - "the owning program has status == ACTIVE"
        side_effects:
          - "creates an ObjectiveProtest with status = OPEN and round_index = objective.protest_round + 1"
          - "increments objective.protest_round by 1"
          - "increments DealerObjective.version by 1"
        note: "This edge closes the cycle: an objective that was already revised once may be protested again, up to MAX_PROTEST_ROUNDS total."
      - from: FINAL
        to: PROTESTED
        trigger: "POST /incentives/objectives/{id}/protests"
        actor: Dealer
        preconditions:
          - "objective.status == FINAL"
          - "X-User-ID of the caller == objective.dealer_id"
          - "objective.protest_round < 2 (MAX_PROTEST_ROUNDS)"
          - "the owning program has status == ACTIVE"
        side_effects:
          - "creates an ObjectiveProtest with status = OPEN and round_index = objective.protest_round + 1"
          - "increments objective.protest_round by 1"
          - "increments DealerObjective.version by 1"
        note: "FINAL is a freeze, not a grave: this edge is the ONLY way objective.paid_payout_cents can be non-zero when the objective is recomputed, and therefore the only path that makes Chargeback.reason == OBJECTIVE_REVISED reachable. A finalized objective that is protested must be re-finalized afterwards."
      - from: PROTESTED
        to: REVISED
        trigger: "POST /incentives/objectives/{id}/protests/{protest_id}/resolve with resolution == UPHELD"
        actor: FieldSalesManager
        preconditions:
          - "objective.status == PROTESTED"
          - "the named protest belongs to this objective and has status == OPEN"
          - "the request carries expected_objective_version matching objective.version (see concurrency_rules.protest-resolve-stale-objective)"
        side_effects:
          - "sets protest.status = UPHELD, protest.resolved_units = the recomputed objective_units, protest.resolved_by_user_id = X-User-ID"
          - "CASCADE LINK 1: sets objective.basis_units = protest.claimed_basis_units and recomputes objective.objective_units per calculations.objective_units_proposal"
          - "CASCADE LINK 2 (caused by link 1): the new objective_units changes objective.attainment_bps, objective.tier_attained and objective.payout_cents per calculations.dealer_stair_step_payout"
          - "CASCADE LINK 3 (caused by link 2): if objective.paid_payout_cents > objective.payout_cents, a Chargeback with reason = OBJECTIVE_REVISED and amount_cents = objective.paid_payout_cents - objective.payout_cents is created (status PENDING) against the objective's STAIR_STEP_BONUS Claim; that claim's approved_amount_cents and the objective's paid_payout_cents are BOTH reduced to the new objective.payout_cents and the claim KEEPS payment_status = PAID — this is a partial recovery of an overpayment, not a full reversal, exactly like the REPRICING_ADJUSTMENT chargeback on a locked batch"
          - "CASCADE LINK 4 (caused by link 3): the reduced approved_amount_cents recomputes program.committed_cents, program.paid_cents and program.per_unit_spend_cents, and appends a BudgetAccrual row with entry_type = REVERSAL whose reversal_cents equals the chargeback amount_cents, which in turn recomputes program.accrued_budget_cents"
          - "increments DealerObjective.version by 1"
      - from: PROTESTED
        to: PROPOSED
        trigger: "POST /incentives/objectives/{id}/protests/{protest_id}/resolve with resolution == DENIED and protest.round_index == 1"
        actor: FieldSalesManager
        preconditions:
          - "objective.status == PROTESTED"
          - "the named protest belongs to this objective, has status == OPEN and round_index == 1"
          - "the request carries expected_objective_version matching objective.version"
        side_effects:
          - "sets protest.status = DENIED, protest.resolved_units = null, protest.resolved_by_user_id = X-User-ID"
          - "objective.basis_units, objective.objective_units and objective.payout_cents are left byte-identical to their pre-protest values (the DENIED branch performs no recomputation)"
          - "increments DealerObjective.version by 1"
        note: "Divergent branch: the UPHELD edge runs a four-link cascade, the DENIED edge runs none. This is the fork-join divergence of the ObjectiveProtest machine seen from the objective's side."
      - from: PROTESTED
        to: REVISED
        trigger: "POST /incentives/objectives/{id}/protests/{protest_id}/resolve with resolution == DENIED and protest.round_index == 2"
        actor: FieldSalesManager
        preconditions:
          - "objective.status == PROTESTED"
          - "the named protest belongs to this objective, has status == OPEN and round_index == 2"
          - "the request carries expected_objective_version matching objective.version"
        side_effects:
          - "sets protest.status = DENIED, protest.resolved_units = null, protest.resolved_by_user_id = X-User-ID"
          - "returns the objective to REVISED (the state it held before round 2 was filed) without recomputing any unit or money field"
          - "increments DealerObjective.version by 1"
        note: "The DENIED destination is pinned by round_index, never by wall-clock or id: round 1 denial returns the objective to PROPOSED, round 2 denial returns it to REVISED."
      - from: PROPOSED
        to: FINAL
        trigger: "POST /incentives/objectives/{id}/finalize"
        actor: FieldSalesManager
        preconditions:
          - "objective.status IN {PROPOSED, REVISED}"
          - "no ObjectiveProtest of this objective has status == OPEN"
        side_effects:
          - "freezes objective_units for STAIR_STEP_BONUS claim adjudication (validations[priority=19] requires this state); a further protest is still admissible while protest_round < MAX_PROTEST_ROUNDS and un-finalizes the objective"
          - "increments DealerObjective.version by 1"
      - from: REVISED
        to: FINAL
        trigger: "POST /incentives/objectives/{id}/finalize"
        actor: FieldSalesManager
        preconditions:
          - "objective.status == REVISED"
          - "no ObjectiveProtest of this objective has status == OPEN"
        side_effects:
          - "freezes objective_units for STAIR_STEP_BONUS claim adjudication; re-finalizing after a protest round is the normal path back to this state"
          - "increments DealerObjective.version by 1"
      - from: PROPOSED
        to: VOID
        trigger: "system event: owning program transitions ACTIVE -> CLOSED"
        actor: system
        preconditions:
          - "objective.status IN {PROPOSED, PROTESTED, REVISED}"
        side_effects:
          - "sets objective.payout_cents = 0"
          - "drives every OPEN ObjectiveProtest of this objective to DENIED"
          - "increments DealerObjective.version by 1"

  - entity: ObjectiveProtest
    initial_state: OPEN
    terminal_states: [UPHELD, DENIED]
    shape: "fork-join branch with divergent side-effect sets per branch"
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /incentives/objectives/{id}/protests/{protest_id}/resolve with resolution == UPHELD"
        actor: FieldSalesManager
        preconditions:
          - "protest.status == OPEN"
          - "the parent objective has status == PROTESTED"
        side_effects:
          - "sets resolved_units to the recomputed objective_units and triggers the four-link objective cascade described on DealerObjective.PROTESTED_to_REVISED"
          - "increments ObjectiveProtest.version by 1"
      - from: OPEN
        to: DENIED
        trigger: "POST /incentives/objectives/{id}/protests/{protest_id}/resolve with resolution == DENIED, or system event: parent objective transitions to VOID"
        actor: FieldSalesManager | system
        preconditions:
          - "protest.status == OPEN"
        side_effects:
          - "leaves resolved_units null and performs no objective recomputation"
          - "increments ObjectiveProtest.version by 1"

  - entity: RetailDelivery
    initial_state: REPORTED
    terminal_states: [REJECTED, UNWOUND]
    shape: "branching (REPORTED forks to VALIDATED or REJECTED) with a compensating UNWOUND leg off VALIDATED"
    transitions:
      - from: REPORTED
        to: VALIDATED
        trigger: "POST /incentives/deliveries/{id}/validate"
        actor: ClaimsAuditor
        preconditions:
          - "delivery.status == REPORTED"
          - "delivery.back_dated_flag == false"
          - "the reporting Dealer has status != TERMINATED"
        side_effects:
          - "sets delivery.validated_by_user_id = X-User-ID of the caller"
          - "for every DealerObjective whose program's eligibility footprint admits this delivery and whose status IN {PROPOSED, PROTESTED, REVISED, FINAL}, increments achieved_units and recomputes attainment_bps, tier_attained and payout_cents per calculations.objective_achieved_units"
          - "increments DealerObjective.version by 1 for every objective it recomputed, so a FieldSalesManager holding an earlier read is detected as stale by concurrency_rules.protest-resolve-stale-objective"
          - "increments RetailDelivery.version by 1"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /incentives/deliveries/{id}/reject"
        actor: ClaimsAuditor
        preconditions:
          - "delivery.status == REPORTED"
        side_effects:
          - "records the rejection reason; no objective or program ledger field changes"
          - "increments RetailDelivery.version by 1"
      - from: VALIDATED
        to: UNWOUND
        trigger: "POST /incentives/deliveries/{id}/unwind"
        actor: ClaimsAuditor
        preconditions:
          - "delivery.status == VALIDATED"
        side_effects:
          - "sets delivery.unwound_at = the logical clock reading"
          - "CASCADE LINK 1: every Claim on this delivery with payment_status IN {SCHEDULED, PAID} moves payment_status -> CHARGED_BACK and has payment_batch_id cleared to null"
          - "CASCADE LINK 2 (caused by link 1): each such claim transition creates a Chargeback with reason = UNWOUND_DEAL and amount_cents per calculations.chargeback_recovery_amount"
          - "CASCADE LINK 3 (caused by link 2): each created Chargeback appends a BudgetAccrual row with entry_type = REVERSAL and reversal_cents equal to the chargeback amount, and recomputes program.accrued_budget_cents"
          - "CASCADE LINK 4 (caused by link 3): the reversal recomputes program.committed_cents, program.paid_cents, program.claimed_units and program.per_unit_spend_cents, and decrements the matching DealerObjective.achieved_units with a fresh payout recomputation and a DealerObjective.version increment"
          - "increments RetailDelivery.version by 1"

  - entity: Claim
    initial_state: "validation_status = SUBMITTED and payment_status = UNPAID"
    terminal_states: [CHARGED_BACK, REJECTED]
    shape: "parallel dimensions — validation_status {SUBMITTED, VALIDATED, REJECTED} and payment_status {UNPAID, SCHEDULED, PAID, CHARGED_BACK} advance independently on the same row, coupled only by the guard that payment_status may not leave UNPAID until validation_status == VALIDATED"
    transitions:
      - from: "validation_status = SUBMITTED"
        to: "validation_status = VALIDATED"
        trigger: "POST /incentives/claims/{id}/adjudicate with decision == APPROVE"
        actor: ClaimsAuditor
        preconditions:
          - "claim.validation_status == SUBMITTED"
          - "the claim's RetailDelivery has status == VALIDATED"
          - "the claimed IncentiveProgram has status == ACTIVE"
          - "X-User-ID of the caller != the delivery's validated_by_user_id (segregation of duties)"
        side_effects:
          - "recomputes claim.approved_amount_cents and claim.rate_basis per calculations.claim_payable_amount"
          - "adds the approved amount to program.committed_cents per calculations.program_committed_ledger"
          - "increments program.claimed_units and recomputes program.per_unit_spend_cents"
          - "sets claim.adjudicated_by_user_id = X-User-ID of the caller"
          - "increments Claim.version by 1 and IncentiveProgram.version by 1"
      - from: "validation_status = SUBMITTED"
        to: "validation_status = REJECTED"
        trigger: "POST /incentives/claims/{id}/adjudicate with decision == REJECT, or system event: claimed program transitions ACTIVE -> SUPERSEDED"
        actor: ClaimsAuditor | system
        preconditions:
          - "claim.validation_status == SUBMITTED"
        side_effects:
          - "sets claim.approved_amount_cents = 0 and claim.rejection_error_id to the supplied or system-derived error_id"
          - "leaves program.committed_cents unchanged (a SUBMITTED claim was never committed)"
          - "increments Claim.version by 1"
      - from: "payment_status = UNPAID"
        to: "payment_status = SCHEDULED"
        trigger: "POST /incentives/payment-batches/{id}/schedule-claims"
        actor: IncentiveController
        preconditions:
          - "claim.payment_status == UNPAID"
          - "claim.validation_status == VALIDATED (cross-dimension guard)"
          - "batch.status == OPEN"
          - "the claim's dealer region_code == batch.region_code"
          - "the claim's delivery sale_date falls inside the closed interval [batch.period_start, batch.period_end]"
        side_effects:
          - "sets claim.payment_batch_id = batch.id"
          - "recomputes batch.claim_count and batch.total_cents"
          - "increments Claim.version by 1 and PaymentBatch.version by 1"
      - from: "payment_status = SCHEDULED"
        to: "payment_status = PAID"
        trigger: "POST /incentives/payment-batches/{id}/disburse"
        actor: IncentiveController
        preconditions:
          - "claim.payment_status == SCHEDULED"
          - "batch.status == LOCKED"
          - "the logical clock is >= batch.scheduled_pay_date"
          - "the claim's Dealer has status == ACTIVE (claims of SUSPENDED or TERMINATED dealers are held, not paid)"
        side_effects:
          - "sets claim.paid_at = the logical clock reading"
          - "adds the approved amount to program.paid_cents and to Dealer.paid_cents"
          - "for STAIR_STEP_BONUS claims, sets the objective's paid_payout_cents = claim.approved_amount_cents"
          - "increments Claim.version by 1"
      - from: "payment_status IN {SCHEDULED, PAID}"
        to: "payment_status = CHARGED_BACK"
        trigger: "POST /incentives/claims/{id}/chargebacks, or system event from a RetailDelivery unwind"
        actor: ClaimsAuditor | system
        preconditions:
          - "claim.payment_status IN {SCHEDULED, PAID}"
        side_effects:
          - "clears claim.payment_batch_id to null and recomputes the former batch's claim_count and total_cents"
          - "creates the Chargeback row and runs the reversal cascade described on RetailDelivery.VALIDATED_to_UNWOUND links 3 and 4"
          - "increments Claim.version by 1"
        note: "This edge is FULL reversal only. The two PARTIAL-recovery chargebacks never traverse it: reason = OBJECTIVE_REVISED (DealerObjective.PROTESTED_to_REVISED link 3) and reason = REPRICING_ADJUSTMENT (calculations.repricing_reevaluation on a LOCKED batch) each reduce claim.approved_amount_cents and leave payment_status where it was, PAID and SCHEDULED respectively."

  - entity: PaymentBatch
    initial_state: OPEN
    terminal_states: [DISBURSED, CANCELLED]
    shape: "linear with an early-exit CANCELLED branch"
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /incentives/payment-batches/{id}/lock"
        actor: IncentiveController
        preconditions:
          - "batch.status == OPEN"
          - "batch.claim_count >= 1"
        side_effects:
          - "no further claims may be scheduled into the batch"
          - "increments PaymentBatch.version by 1"
      - from: LOCKED
        to: DISBURSED
        trigger: "POST /incentives/payment-batches/{id}/disburse"
        actor: IncentiveController
        preconditions:
          - "batch.status == LOCKED"
          - "the logical clock is >= batch.scheduled_pay_date"
        side_effects:
          - "every SCHEDULED claim of an ACTIVE dealer moves payment_status -> PAID"
          - "claims of dealers with status IN {SUSPENDED, TERMINATED} stay SCHEDULED, keep payment_batch_id, and are counted in batch.held_claim_count"
          - "sets batch.disbursed_at = the logical clock reading and recomputes batch.total_cents over the claims that remain attached"
          - "increments PaymentBatch.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /incentives/payment-batches/{id}/cancel"
        actor: IncentiveController
        preconditions:
          - "batch.status == OPEN"
        side_effects:
          - "every SCHEDULED claim of this batch returns to payment_status = UNPAID with payment_batch_id cleared to null"
          - "sets batch.claim_count = 0 and batch.total_cents = 0"
          - "the batch's pay period stops occupying the region interval, so a later batch may reuse it"
          - "increments PaymentBatch.version by 1"

  - entity: Chargeback
    initial_state: PENDING
    terminal_states: [RECOVERED, WRITTEN_OFF]
    shape: "branching (PENDING forks to RECOVERED or WRITTEN_OFF with different ledger consequences)"
    transitions:
      - from: PENDING
        to: RECOVERED
        trigger: "POST /incentives/chargebacks/{id}/recover"
        actor: IncentiveController
        preconditions:
          - "chargeback.status == PENDING"
        side_effects:
          - "sets chargeback.recovered_at = the logical clock reading"
          - "subtracts amount_cents from Dealer.open_chargeback_cents and recomputes program.committed_cents per calculations.program_committed_ledger"
          - "increments Chargeback.version by 1"
      - from: PENDING
        to: WRITTEN_OFF
        trigger: "POST /incentives/chargebacks/{id}/write-off"
        actor: IncentiveController
        preconditions:
          - "chargeback.status == PENDING"
        side_effects:
          - "sets chargeback.recovered_at = the logical clock reading"
          - "subtracts amount_cents from Dealer.open_chargeback_cents but leaves program.committed_cents carrying the amount, because a written-off chargeback is spend the automaker never gets back"
          - "increments Chargeback.version by 1"

concurrency_rules:
  - rule_id: claim-create-stale-program
    parent_entity: IncentiveProgram
    write_endpoint: "POST /incentives/claims"
    occ_field: "expected_program_version"
    description: |
      Submitting a Claim against an IncentiveProgram whose version has advanced
      since the dealer system last read it is rejected. This captures the case
      where a RepricingEvent has already replaced the program's
      per_unit_amount_cents (which legitimately re-prices every subsequent
      claim), so the dealer system's view of the payable rate is stale.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: repricing-create-stale-program
    parent_entity: IncentiveProgram
    write_endpoint: "POST /incentives/programs/{id}/repricings"
    occ_field: "expected_program_version"
    description: |
      Applying a RepricingEvent to a program whose version has advanced since the
      designer last read it is rejected. This captures the case where an earlier
      repricing has already moved per_unit_amount_cents, so the second event's
      previous_per_unit_amount_cents baseline would be recorded against a value
      that no longer exists on the program.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: protest-resolve-stale-objective
    parent_entity: DealerObjective
    write_endpoint: "POST /incentives/objectives/{id}/protests/{protest_id}/resolve"
    occ_field: "expected_objective_version"
    description: |
      Resolving an ObjectiveProtest against a DealerObjective whose version has
      advanced since the manager last read it is rejected. This captures the case
      where a retail delivery has since been validated and legitimately moved the
      objective's achieved_units, attainment_bps and payout_cents, so the units
      the manager is about to uphold were computed from a superseded basis.
    error_id: ERR_STALE_OBJECTIVE_VERSION
    http_status: 412

calculations:
  - name: claim_payable_amount
    trigger: "POST /incentives/claims/{id}/adjudicate with decision == APPROVE (sets Claim.approved_amount_cents and Claim.rate_basis); re-run for UNPAID and SCHEDULED claims by calculations.repricing_reevaluation"
    algorithm: threshold
    formula: |
      # STEP 1 — pick the per-unit rate (variant selection, see `variants:` below)
      if exists RepricingEvent e on claim.program_id with
             e.mode == 'RETROACTIVE_TO_MONTH_START' and
             e.month_start <= delivery.sale_date < e.effective_at:
          rate_cents  = program.per_unit_amount_cents      # current schedule
          rate_basis  = 'REPRICED_CURRENT'
      else:
          rate_cents  = claim.snapshot_per_unit_cents      # frozen at claim creation
          rate_basis  = 'AS_SOLD_SNAPSHOT'

      # STEP 2 — incentive-type leg, conditional on program and delivery state
      if claim.claim_type == 'STAIR_STEP_BONUS':
          approved_amount_cents = objective.payout_cents - objective.paid_payout_cents
          # objective is the DealerObjective with (program_id = claim.program_id,
          # dealer_id = claim.dealer_id); it MUST have status == FINAL, otherwise
          # validations[priority=19] rejects the adjudication.
          return approved_amount_cents

      if program.incentive_type == 'CUSTOMER_CASH':
          leg_cents = 0
      elif program.incentive_type == 'FINANCE_SUBVENTION':
          effective_bps = min(program.apr_buydown_bps,
                              max(0, MARKET_APR_BPS - delivery.contract_apr_bps))
          leg_cents = round_half_up(delivery.msrp_cents * effective_bps
                                    * delivery.term_months / 120000)
      elif program.incentive_type == 'LEASE_SUPPORT':
          leg_cents = round_half_up(delivery.msrp_cents
                                    * program.residual_support_bps / 10000)

      # STEP 3 — gross, then the single pinned rounding boundary
      approved_amount_cents = rate_cents + leg_cents
      # No clamping happens here. Budget and stack ceilings are VALIDATIONS
      # (validations[priority=15] and validations[priority=14]), not silent
      # reductions, so an over-ceiling claim is rejected rather than trimmed.
    input_set: "One Claim, its RetailDelivery (any status; the VALIDATED precondition is enforced by the state machine, not by this formula), its IncentiveProgram, and — for STAIR_STEP_BONUS only — the DealerObjective with matching (program_id, dealer_id)."
    constants:
      MARKET_APR_BPS: 799
    precision: "integer cents; the only rounding step is round_half_up on leg_cents, applied ONCE to the whole leg expression (never per factor)"
    variants:
      - name: as_sold_snapshot
        when: "no RETROACTIVE_TO_MONTH_START RepricingEvent on this program has a [month_start, effective_at) window containing delivery.sale_date"
        difference: "uses claim.snapshot_per_unit_cents, the program rate frozen when the dealer submitted the claim, so a later prospective repricing cannot move an already-submitted claim"
      - name: repriced_current
        when: "such a RepricingEvent exists"
        difference: "uses the program's CURRENT per_unit_amount_cents, so the same claim on the same delivery with the same program produces a different approved_amount_cents than the snapshot variant"

  - name: dealer_stair_step_payout
    trigger: "recomputed by RetailDelivery.REPORTED_to_VALIDATED, RetailDelivery.VALIDATED_to_UNWOUND and DealerObjective.PROTESTED_to_REVISED (sets DealerObjective.attainment_bps, tier_attained and payout_cents)"
    algorithm: tiered_pricing
    formula: |
      attainment_bps = floor(objective.achieved_units * 10000 / objective.objective_units)
      # objective_units is >= MIN_OBJECTIVE_UNITS == 1 by construction, so no
      # division by zero is possible.

      tier_attained = max( t.tier_index for t in program.tier_schedule
                           if t.threshold_bps <= attainment_bps )   # INCLUSIVE
                      else 0 when the set is empty

      if tier_attained == 0: payout_cents = 0

      # unit threshold of a tier, in whole units
      threshold_units(t) = ceil(objective.objective_units * t.threshold_bps / 10000)

      MARGINAL:
        payout_cents = 0
        for t in tier_schedule with t.tier_index <= tier_attained, ascending tier_index:
            band_hi = (threshold_units(next tier after t) - 1) if a next tier exists
                      else +infinity
            band_units = min(objective.achieved_units, band_hi) - threshold_units(t) + 1
            payout_cents += band_units * t.per_unit_bonus_cents

      FULL_VOLUME:
        payout_cents = objective.achieved_units
                       * per_unit_bonus_cents of the tier with tier_index == tier_attained
    input_set: "One DealerObjective plus its program's tier_schedule. achieved_units comes from calculations.objective_achieved_units; tiers are read in ascending tier_index, which the submit-time validation guarantees is also ascending threshold_bps."
    constants:
      MIN_OBJECTIVE_UNITS: 1
    precision: "integer units and integer cents; attainment_bps uses floor, threshold_units uses ceil — the two roundings go in OPPOSITE directions and neither may be swapped"
    variants:
      - name: marginal_bands
        when: "program.tier_bonus_mode == MARGINAL"
        difference: "each unit earns only the bonus of the band it falls in, so the payout is a sum over bands"
      - name: full_volume_retroactive
        when: "program.tier_bonus_mode == FULL_VOLUME"
        difference: "every achieved unit is retroactively re-rated at the top attained tier's bonus, producing a strictly larger payout than marginal_bands for identical achieved_units, objective_units and tier_schedule"

  - name: budget_accrual_amount
    trigger: "POST /incentives/programs/{id}/accruals (sets BudgetAccrual.accrued_cents, BudgetAccrual.unit_basis and BudgetAccrual.accrual_method)"
    algorithm: aggregation
    formula: |
      month_start        = first instant of period_month  (e.g. '2026-08-01T00:00:00.000Z')
      month_end_exclusive = first instant of the following month

      # Line assignment: a delivery admitted by several EligibilityRule rows of this
      # program is attributed to the FIRST admitting row in created_at ASC order and
      # to no other, so no unit is double counted.
      for each EligibilityRule r of the program, in created_at ASC order:
          line_units(r) = count of RetailDelivery d where
                            d.status == 'VALIDATED'
                            and month_start <= d.sale_date < month_end_exclusive
                            and r admits d (see calculations.delivery_stack_allocation
                                            for the admission predicate)
                            and r is the first admitting rule of this program for d

          UNIT_BASED:
              line_cents(r) = round_half_up( line_units(r) * program.per_unit_amount_cents
                                             * (10000 - CANCEL_RESERVE_BPS) / 10000 )
          TAKE_RATE_BASED:
              line_cents(r) = round_half_up( line_units(r) * program.per_unit_amount_cents
                                             * program.projected_take_rate_bps / 10000 )

      # PINNED ROUNDING ORDER: round EACH LINE to whole cents first, THEN sum the
      # rounded line values. Summing the unrounded line values and rounding once at
      # the end is a DIFFERENT, WRONG answer and may differ by one or more cents.
      accrued_cents  = sum over rules r of line_cents(r)
      unit_basis     = sum over rules r of line_units(r)
      reversal_cents = 0            # ACCRUAL rows never carry a reversal
      entry_type     = 'ACCRUAL'
    input_set: "Every EligibilityRule of the program (all of them; rules are append-only and never disabled) crossed with the program's VALIDATED deliveries whose sale_date falls in the half-open month window. REPORTED, REJECTED and UNWOUND deliveries are excluded."
    constants:
      CANCEL_RESERVE_BPS: 275
    precision: "2-decimal money held as integer cents; round_half_up applied PER LINE then summed"
    variants:
      - name: unit_based_with_cancel_reserve
        when: "program.accrual_method == UNIT_BASED"
        difference: "accrues actual validated units net of a flat 2.75% cancellation reserve"
      - name: take_rate_projection
        when: "program.accrual_method == TAKE_RATE_BASED"
        difference: "accrues actual validated units scaled by projected_take_rate_bps instead of the cancellation reserve, so the same deliveries and the same per_unit_amount_cents produce a different accrued_cents"

  - name: residual_value_impact
    trigger: "recomputed on Claim validation_status SUBMITTED -> VALIDATED and on RetailDelivery.VALIDATED_to_UNWOUND for LEASE_SUPPORT programs (sets IncentiveProgram.residual_impact_bps); also read by GET /incentives/programs/{id}/spend-summary"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED TO EXACTLY THESE FIVE STEPS. No step may consult
      # the output of a later step. residual_impact_bps is 0 for programs whose
      # incentive_type != LEASE_SUPPORT.
      #
      # step 1
      S = the set of this program's Claims with validation_status == 'VALIDATED'
          and payment_status IN {'UNPAID','SCHEDULED','PAID'}
      gross_support_cents = sum of c.approved_amount_cents for c in S
      # step 2
      supported_units = count(S)
      if supported_units == 0: residual_impact_bps = 0 and STOP
      # step 3
      avg_cap_cost_cents = floor( sum of c.delivery.msrp_cents for c in S / supported_units )
      #
      # CIRCULARITY BREAK (why step 3 uses RAW msrp_cents): the intuitive definition
      # of capitalized cost is msrp_cents MINUS the customer cash stacked on the same
      # delivery. That definition is circular, because the stacked customer cash is
      # itself limited by StackabilityConstraint.cap_amount_cents evaluated against
      # the stacked TOTAL, and the stacked total includes this program's lease
      # support, whose size is what we are trying to express as a residual impact.
      # The scaffold therefore pins RAW msrp_cents so the whole quantity is
      # computable in one forward pass with no fixed-point iteration.
      #
      # step 4
      support_ratio_bps = floor( gross_support_cents * 10000
                                 / (avg_cap_cost_cents * supported_units) )
      # step 5
      residual_impact_bps = floor( support_ratio_bps * RESIDUAL_PASS_THROUGH_BPS / 10000 )
    input_set: "LEASE_SUPPORT programs only; claims with validation_status == VALIDATED and payment_status IN {UNPAID, SCHEDULED, PAID}. REJECTED and CHARGED_BACK claims are excluded, which is why an unwind lowers residual_impact_bps."
    constants:
      RESIDUAL_PASS_THROUGH_BPS: 6000
    precision: "integer basis points; every division uses floor (never round_half_up), applied at steps 3, 4 and 5 in that order"

  - name: objective_units_proposal
    trigger: "POST /incentives/programs/{id}/objectives (sets DealerObjective.basis_units and objective_units); re-run by DealerObjective.PROTESTED_to_REVISED with basis_units taken from the upheld protest"
    algorithm: weighted_scoring
    formula: |
      basis_units = dealer.historical_volume_units          # at creation
                    | upheld_protest.claimed_basis_units    # after an UPHELD protest
      uplift_bps  = min(MAX_TOTAL_UPLIFT_BPS,
                        dealer.market_opportunity_bps + objective.stretch_bps)
      raw_units   = basis_units * (10000 + uplift_bps) / 10000
      objective_units = max(MIN_OBJECTIVE_UNITS, round_half_up(raw_units))
    input_set: "One Dealer (historical_volume_units, market_opportunity_bps) and the objective's own stretch_bps; no other dealer's data participates."
    constants:
      MAX_TOTAL_UPLIFT_BPS: 5000
      MIN_OBJECTIVE_UNITS: 1
    precision: "integer units; round_half_up applied ONCE to raw_units, after the min() clamp on uplift_bps and before the max() clamp on units"

  - name: back_dated_sale_detection
    trigger: "POST /incentives/deliveries (sets RetailDelivery.reporting_lag_days and RetailDelivery.back_dated_flag at creation, from the logical clock reading stamped into reported_at)"
    algorithm: threshold
    formula: |
      reporting_lag_days = floor( (reported_at - sale_date) / 86400 seconds )
      # reporting_lag_days is NEGATIVE when the dealer reports a future-dated sale.
      back_dated_flag = (reporting_lag_days > MAX_REPORT_LAG_DAYS)
                        or (sale_date > reported_at)
      # STRICT > on the lag: a lag of exactly MAX_REPORT_LAG_DAYS days is clean.
    input_set: "One RetailDelivery at creation time; reported_at is the logical clock, never real wall-clock time."
    constants:
      MAX_REPORT_LAG_DAYS: 10
    precision: "whole days by floor division on seconds; no rounding of the boundary"

  - name: delivery_stack_allocation
    trigger: "GET /incentives/deliveries/{id}/eligible-programs (read-only projection) and POST /incentives/claims (the requested program must be accepted by this waterfall given the delivery's existing claims)"
    algorithm: waterfall_allocation
    formula: |
      # ADMISSION PREDICATE — an EligibilityRule r admits delivery d iff ALL hold:
      #   r.model_code == d.model_code
      #   (r.trim_code is null) or (r.trim_code == d.trim_code)
      #   r.region_code == d.customer_region_code
      #   r.build_date_from <= d.build_date <= r.build_date_to        (CLOSED interval)
      #   d.msrp_cents >= r.min_msrp_cents
      #   (r.max_msrp_cents is null) or (d.msrp_cents <= r.max_msrp_cents)
      #   d.deal_type is a member of r.allowed_deal_types
      #
      # CANDIDATE SET — programs p such that
      #   p.status == 'ACTIVE'
      #   p.effective_from <= d.sale_date < p.effective_to             (HALF-OPEN)
      #   at least one EligibilityRule of p admits d
      # RANKING — priority_rank ASC, then created_at ASC. `id` is never consulted.
      # EMPTY CANDIDATE SET — POST /incentives/claims fails ERR_NO_ELIGIBLE_PROGRAM;
      #   GET .../eligible-programs returns eligible_program_ids == [].
      #
      accepted      = programs of d's existing Claims with validation_status != 'REJECTED'
                      and payment_status != 'CHARGED_BACK'
      running_total = sum of approved_amount_cents (or, for a not-yet-adjudicated
                      claim, its gross per calculations.claim_payable_amount) over accepted
      for p in candidate_set ordered by (priority_rank ASC, created_at ASC):
          if p in accepted: continue
          for q in accepted:
              edge = the StackabilityConstraint row with {program_a_id, program_b_id}
                     == {p.id, q.id} (the edge is undirected; at most one row exists)
              if edge exists and edge.mode == 'FORBIDDEN':
                   p is BLOCKED -> ERR_STACK_COMBINATION_FORBIDDEN; go to next p
          pair_cap  = min( edge.cap_amount_cents for q in accepted where the edge
                           exists and edge.mode == 'CAPPED_TOTAL' )  else +infinity
          own_cap   = p.stack_cap_cents  if p.stack_cap_cents > 0 else +infinity
          part_cap  = min( q.stack_cap_cents for q in accepted
                           where q.stack_cap_cents > 0 )              else +infinity
          headroom  = min(pair_cap, own_cap, part_cap)
          gross     = calculations.claim_payable_amount gross for (d, p)
          if running_total + gross > headroom:
               p is CAPPED OUT -> ERR_STACK_CAP_EXCEEDED; go to next p
          accept p; running_total += gross
    input_set: "One RetailDelivery of any status, every ACTIVE program whose half-open window contains sale_date, all their EligibilityRule rows, all StackabilityConstraint rows touching those programs, and the delivery's own non-terminal Claims."
    constants: {}
    precision: "integer cents; the comparison is STRICT > against headroom, so a stacked total landing exactly on the cap is accepted"

  - name: per_unit_incentive_spend
    trigger: "recomputed on Claim validation_status SUBMITTED -> VALIDATED, on Claim payment_status -> CHARGED_BACK, on IncentiveProgram.ACTIVE_to_SUPERSEDED and by calculations.repricing_reevaluation (sets IncentiveProgram.claimed_units and IncentiveProgram.per_unit_spend_cents)"
    algorithm: aggregation
    formula: |
      S = Claims of this program with validation_status == 'VALIDATED'
          and payment_status IN {'UNPAID','SCHEDULED','PAID'}
      # REJECTED and CHARGED_BACK claims leave the set immediately.
      claimed_units        = count of c in S where c.claim_type == 'UNIT_INCENTIVE'
      spend_cents          = sum of c.approved_amount_cents for ALL c in S
                             (both UNIT_INCENTIVE and STAIR_STEP_BONUS)
      per_unit_spend_cents = 0 if claimed_units == 0
                             else floor(spend_cents / claimed_units)
    input_set: "Claims of one program, filtered exactly as above; window is the program's whole life (no month scoping); the aggregate is order-insensitive so no tie-break is required."
    constants: {}
    precision: "integer cents with floor division; an empty set yields exactly 0, never null and never a division error"

  - name: program_committed_ledger
    trigger: "recomputed on Claim validation_status SUBMITTED -> VALIDATED, on Claim payment_status -> CHARGED_BACK, on Chargeback.PENDING_to_RECOVERED, on Chargeback.PENDING_to_WRITTEN_OFF and by calculations.repricing_reevaluation (sets IncentiveProgram.committed_cents, IncentiveProgram.paid_cents and Dealer.paid_cents)"
    algorithm: aggregation
    formula: |
      committed_cents = sum( c.approved_amount_cents for c in Claims of this program
                             where c.validation_status == 'VALIDATED'
                               and c.payment_status IN {'UNPAID','SCHEDULED','PAID'} )
                      + sum( cb.amount_cents for cb in Chargebacks whose claim belongs
                             to this program where cb.status == 'WRITTEN_OFF' )
      paid_cents      = sum( c.approved_amount_cents for c in Claims of this program
                             where c.payment_status == 'PAID' )
      # CONSERVATION INVARIANT (money): for any claim that is approved, paid,
      # unwound and whose resulting chargeback is RECOVERED, committed_cents returns
      # to EXACTLY its pre-approval value — the charged-back claim leaves the first
      # sum and a RECOVERED chargeback adds nothing to the second. A WRITTEN_OFF
      # chargeback deliberately leaves the amount committed, because that money is
      # never coming back.
    input_set: "All Claims of the program regardless of claim_type, plus all Chargebacks reachable through those claims. Dealer.paid_cents uses the same PAID filter scoped by dealer_id instead of program_id."
    constants: {}
    precision: "integer cents, exact — no rounding anywhere in this ledger"

  - name: program_accrual_ledger
    trigger: "recomputed on POST /incentives/programs/{id}/accruals and on every Chargeback creation cascade that appends a REVERSAL row (sets IncentiveProgram.accrued_budget_cents)"
    algorithm: aggregation
    formula: |
      accrued_budget_cents = sum(a.accrued_cents for a in BudgetAccrual of this program)
                           - sum(a.reversal_cents for a in BudgetAccrual of this program)
      # CONSERVATION INVARIANT (accrual exposure): every Chargeback created by a
      # cascade appends EXACTLY ONE BudgetAccrual row with entry_type = REVERSAL
      # whose reversal_cents equals that chargeback's amount_cents — never zero
      # rows, never two, and never a different amount. Therefore
      #   accrued_budget_cents
      #     == sum(ACCRUAL rows) - sum(amount_cents of every cascade Chargeback),
      # and re-running the cascade twice on the same claim is impossible because
      # the claim has already left the chargeback-eligible payment_status set.
      # NOTE (deliberate, not drift): accrued_cents is booked NET of
      # CANCEL_RESERVE_BPS while a reversal is booked GROSS, so unwinding every
      # delivery of a month drives accrued_budget_cents NEGATIVE by exactly the
      # reserve that was withheld. That residue is the program's over-accrual
      # correction and MUST be visible, not netted away.
    input_set: "Every BudgetAccrual row of the program, both entry_types, all periods."
    constants: {}
    precision: "integer cents, exact"

  - name: objective_achieved_units
    trigger: "recomputed on RetailDelivery.REPORTED_to_VALIDATED and RetailDelivery.VALIDATED_to_UNWOUND (sets DealerObjective.achieved_units, then feeds calculations.dealer_stair_step_payout)"
    algorithm: aggregation
    formula: |
      achieved_units = count of RetailDelivery d where
                         d.dealer_id == objective.dealer_id
                         and d.status == 'VALIDATED'
                         and program.effective_from <= d.sale_date < program.effective_to
                         and at least one EligibilityRule of objective.program_id
                             admits d (admission predicate of
                             calculations.delivery_stack_allocation)
      # CONSERVATION INVARIANT (units): validating a delivery and then unwinding it
      # returns achieved_units to EXACTLY its prior value, and therefore returns
      # attainment_bps, tier_attained and payout_cents to their prior values.
    input_set: "Deliveries of one dealer only, status == VALIDATED only; REPORTED, REJECTED and UNWOUND deliveries never count. The count is order-insensitive."
    constants: {}
    precision: "whole units, exact"

  - name: chargeback_recovery_amount
    trigger: "any Chargeback creation — POST /incentives/claims/{id}/chargebacks, the RetailDelivery.VALIDATED_to_UNWOUND cascade, the DealerObjective.PROTESTED_to_REVISED cascade, or calculations.repricing_reevaluation (sets Chargeback.amount_cents)"
    algorithm: aggregation
    formula: |
      if reason IN {'UNWOUND_DEAL','BACK_DATED_SALE','DUPLICATE_CLAIM'}:
          amount_cents = claim.approved_amount_cents        # full recovery
      elif reason == 'OBJECTIVE_REVISED':
          amount_cents = objective.paid_payout_cents - objective.payout_cents
      elif reason == 'REPRICING_ADJUSTMENT':
          amount_cents = old_approved_amount_cents - new_approved_amount_cents
      # amount_cents is always > 0; a reason whose formula yields <= 0 means the
      # cascade does not raise a chargeback at all.
    input_set: "One Claim, and for OBJECTIVE_REVISED its DealerObjective as it stands AFTER the units recomputation of DealerObjective.PROTESTED_to_REVISED link 2."
    constants: {}
    precision: "integer cents, exact"

  - name: repricing_reevaluation
    trigger: "POST /incentives/programs/{id}/repricings (sets RepricingEvent.affected_claim_count, RepricingEvent.net_adjustment_cents, RepricingEvent.previous_per_unit_amount_cents, RepricingEvent.month_start and IncentiveProgram.per_unit_amount_cents)"
    algorithm: chronological
    formula: |
      previous_per_unit_amount_cents = program.per_unit_amount_cents   # before the write
      effective_at = the logical clock reading
      month_start  = first instant of the calendar month containing effective_at
      program.per_unit_amount_cents = new_per_unit_amount_cents

      if mode == 'PROSPECTIVE':
          affected_claim_count = 0
          net_adjustment_cents = 0
          # Already-submitted claims keep their frozen snapshot_per_unit_cents and
          # their AS_SOLD_SNAPSHOT rate_basis. Only claims submitted AFTER this
          # event see the new rate.
          STOP

      # mode == 'RETROACTIVE_TO_MONTH_START'
      window = [month_start, effective_at)          # HALF-OPEN
      T = Claims of this program where
              claim_type == 'UNIT_INCENTIVE'
              and validation_status == 'VALIDATED'
              and payment_status IN {'UNPAID','SCHEDULED'}     # PAID is untouchable
              and delivery.sale_date is in window
      process T in delivery.sale_date ASC, then claim.created_at ASC (never by id)
      affected_claim_count = 0 ; net_adjustment_cents = 0
      for c in T:
          new_approved = calculations.claim_payable_amount for c with
                         rate_basis = 'REPRICED_CURRENT'
          delta = new_approved - c.approved_amount_cents
          if delta == 0: continue
          affected_claim_count += 1
          net_adjustment_cents += delta
          batch = the PaymentBatch with id == c.payment_batch_id, if any
          if batch is null or batch.status == 'OPEN':
              c.approved_amount_cents = new_approved
              c.rate_basis = 'REPRICED_CURRENT'
              if batch is not null: recompute batch.total_cents and batch.claim_count
          else:   # batch.status == 'LOCKED' — a locked batch is immutable
              leave c.approved_amount_cents and c.rate_basis untouched
              if delta < 0:
                  create a Chargeback on c with reason = 'REPRICING_ADJUSTMENT'
                  and amount_cents = -delta, leaving c.payment_status == 'SCHEDULED'
              # delta > 0 on a locked batch records nothing: the uplift is simply
              # claimable in a later batch.
      recompute program.committed_cents, program.claimed_units and
      program.per_unit_spend_cents
    input_set: "Claims of one program with claim_type == UNIT_INCENTIVE, validation_status == VALIDATED and payment_status IN {UNPAID, SCHEDULED}, whose delivery sale_date lies in the half-open [month_start, effective_at) window. STAIR_STEP_BONUS, SUBMITTED, REJECTED, PAID and CHARGED_BACK claims are all excluded."
    constants: {}
    precision: "integer cents; deltas are signed and summed exactly, with no intermediate rounding"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "segregation of duties — on POST /incentives/programs/{id}/approve the caller's X-User-ID differs from program.submitted_by_user_id; on POST /incentives/claims/{id}/adjudicate the caller's X-User-ID differs from the claim's delivery.validated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /incentives/programs/{id}/approve, POST /incentives/claims/{id}/adjudicate"
  - priority: 4
    category: auth
    check: "dealer ownership — when the acting role is Dealer, X-User-ID equals the dealer_id of the resource being created or acted on (delivery.dealer_id, claim's delivery.dealer_id, objective.dealer_id)"
    error_id: ERR_DEALER_MISMATCH
    http_status: 403
    applies_to: "POST /incentives/deliveries, POST /incentives/claims, POST /incentives/objectives/{id}/protests"
  - priority: 5
    category: existence
    check: "every resource named in the path exists, validated left-to-right (program before its eligibility rule, objective before its protest, batch before its claim list)"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_OBJECTIVE_NOT_FOUND | ERR_PROTEST_NOT_FOUND | ERR_DEALER_NOT_FOUND | ERR_DELIVERY_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_CHARGEBACK_NOT_FOUND | ERR_BATCH_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 6
    category: business_constraint
    check: "payload shape — every required field present, enum members valid, integers within their declared ranges, ISO 8601 UTC instants parseable with three fractional digits, effective_to > effective_from, build_date_to >= build_date_from, period_end >= period_start, scheduled_pay_date >= period_end, cap_amount_cents non-null exactly when mode == CAPPED_TOTAL, tier_schedule strictly ascending in both tier_index and threshold_bps"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 7
    category: existence
    check: "every foreign key supplied in the request BODY resolves to an existing row (claims.delivery_id, claims.program_id, objectives.dealer_id, stackability-constraints.program_b_id, schedule-claims.claim_ids, programs.supersedes_program_id)"
    error_id: "ERR_DELIVERY_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_DEALER_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "POST /incentives/claims, POST /incentives/programs, POST /incentives/programs/{id}/objectives, POST /incentives/programs/{id}/stackability-constraints, POST /incentives/payment-batches/{id}/schedule-claims"
  - priority: 8
    category: business_constraint
    check: "global uniqueness — program_code across all programs, dealer_code across all dealers, vin across all retail deliveries (including UNWOUND ones), batch_code across all payment batches"
    error_id: "ERR_DUPLICATE_PROGRAM_CODE | ERR_DUPLICATE_DEALER_CODE | ERR_DUPLICATE_VIN | ERR_DUPLICATE_BATCH_CODE"
    http_status: 409
    applies_to: "POST /incentives/programs, POST /incentives/dealers, POST /incentives/deliveries, POST /incentives/payment-batches"
  - priority: 9
    category: state
    check: "optimistic concurrency — expected_program_version equals IncentiveProgram.version on POST /incentives/claims and POST /incentives/programs/{id}/repricings; expected_objective_version equals DealerObjective.version on the protest-resolve endpoint"
    error_id: "ERR_STALE_PROGRAM_VERSION | ERR_STALE_OBJECTIVE_VERSION"
    http_status: 412
    applies_to: "POST /incentives/claims, POST /incentives/programs/{id}/repricings, POST /incentives/objectives/{id}/protests/{protest_id}/resolve"
  - priority: 10
    category: state
    check: "the target resource is in a state the requested transition allows, per the §1.2 machine of that entity"
    error_id: "ERR_PROGRAM_INVALID_STATE | ERR_OBJECTIVE_INVALID_STATE | ERR_PROTEST_ALREADY_RESOLVED | ERR_DELIVERY_INVALID_STATE | ERR_CLAIM_ALREADY_ADJUDICATED | ERR_CLAIM_NOT_VALIDATED | ERR_BATCH_INVALID_STATE | ERR_CHARGEBACK_INVALID_STATE"
    http_status: 409
    applies_to: "every state-transition endpoint"
  - priority: 11
    category: state
    check: "cross-entity state — the claimed or referenced IncentiveProgram has status == ACTIVE when a Claim is submitted, when a Claim is adjudicated, when a DealerObjective is created and when an ObjectiveProtest is filed"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /incentives/claims, POST /incentives/claims/{id}/adjudicate, POST /incentives/programs/{id}/objectives, POST /incentives/objectives/{id}/protests"
  - priority: 12
    category: business_temporal
    check: "program overlap — no other program with status IN {PENDING_APPROVAL, ACTIVE}, the same incentive_type, an intersecting half-open [effective_from, effective_to) window and an intersecting eligibility footprint (same model_code, overlapping trim scope, same region_code, intersecting closed build-date interval) exists, unless a StackabilityConstraint row with mode IN {ALLOWED, CAPPED_TOTAL} joins the two programs. Half-open window semantics: a program starting exactly at another's effective_to does NOT overlap it."
    error_id: ERR_PROGRAM_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /incentives/programs/{id}/submit, POST /incentives/programs/{id}/approve"
  - priority: 13
    category: business_temporal
    check: "pay-period overlap — the new batch's CLOSED interval [period_start, period_end] does not intersect the closed period of any other batch with status IN {OPEN, LOCKED, DISBURSED} and the same region_code"
    error_id: ERR_BATCH_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /incentives/payment-batches"
  - priority: 14
    category: business_temporal
    check: "settlement buffer — even when the closed pay periods do not intersect, the gap between the new batch's period_start and the nearest preceding same-region batch's period_end must be strictly greater than SETTLEMENT_BUFFER_DAYS = 1 whole day; back-to-back or one-day-apart periods are refused"
    error_id: ERR_BATCH_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /incentives/payment-batches"
  - priority: 15
    category: business_temporal
    check: "the delivery's sale_date lies in the claimed program's half-open [effective_from, effective_to) window"
    error_id: ERR_SALE_DATE_OUTSIDE_PROGRAM_WINDOW
    http_status: 422
    applies_to: "POST /incentives/claims"
  - priority: 16
    category: business_safety
    check: "back-dated sale detection — a delivery whose back_dated_flag is true may not be validated"
    error_id: ERR_BACK_DATED_SALE_DETECTED
    http_status: 422
    applies_to: "POST /incentives/deliveries/{id}/validate"
  - priority: 17
    category: business_safety
    check: "dealer standing — a Dealer with status == TERMINATED may not report deliveries, may not have one of its already-reported deliveries validated (the REPORTED -> VALIDATED precondition), and may not submit claims. SUSPENDED is NOT blocked here: a suspended dealer keeps reporting, validating and claiming, and is stopped only at disbursement."
    error_id: ERR_DEALER_NOT_IN_GOOD_STANDING
    http_status: 403
    applies_to: "POST /incentives/deliveries, POST /incentives/deliveries/{id}/validate, POST /incentives/claims"
  - priority: 18
    category: business_referential
    check: "the claim's RetailDelivery has status == VALIDATED at adjudication time"
    error_id: ERR_DELIVERY_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /incentives/claims/{id}/adjudicate"
  - priority: 19
    category: business_referential
    check: "for a STAIR_STEP_BONUS claim, a DealerObjective with (program_id, dealer_id) matching the claim exists and has status == FINAL"
    error_id: ERR_OBJECTIVE_NOT_FINAL
    http_status: 409
    applies_to: "POST /incentives/claims/{id}/adjudicate"
  - priority: 20
    category: business_constraint
    check: "duplicate claim — no other Claim on the same (delivery_id, program_id) pair has validation_status != REJECTED and payment_status != CHARGED_BACK"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /incentives/claims"
  - priority: 21
    category: business_constraint
    check: "the claimed program is in the delivery's candidate set per calculations.delivery_stack_allocation (ACTIVE, window contains sale_date, at least one EligibilityRule admits the delivery)"
    error_id: ERR_NO_ELIGIBLE_PROGRAM
    http_status: 422
    applies_to: "POST /incentives/claims"
  - priority: 22
    category: business_constraint
    check: "no StackabilityConstraint with mode == FORBIDDEN joins the claimed program to the program of any already-accepted claim on the same delivery"
    error_id: ERR_STACK_COMBINATION_FORBIDDEN
    http_status: 422
    applies_to: "POST /incentives/claims"
  - priority: 23
    category: business_constraint
    check: "the stacked total including the new claim's gross does not STRICTLY exceed the headroom computed by calculations.delivery_stack_allocation (pair cap, own stack_cap_cents, partner stack_cap_cents)"
    error_id: ERR_STACK_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /incentives/claims"
  - priority: 24
    category: business_constraint
    check: "protest limit — DealerObjective.protest_round is strictly less than MAX_PROTEST_ROUNDS = 2"
    error_id: ERR_PROTEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /incentives/objectives/{id}/protests"
  - priority: 25
    category: business_constraint
    check: "eligibility footprint conflict — the new EligibilityRule does not duplicate an existing rule of the SAME program on (model_code, trim_code, region_code) with an intersecting closed build-date interval"
    error_id: ERR_ELIGIBILITY_RULE_CONFLICT
    http_status: 409
    applies_to: "POST /incentives/programs/{id}/eligibility-rules"
  - priority: 26
    category: business_constraint
    check: "stack edge sanity — program_b_id differs from the path program and no StackabilityConstraint row already joins the unordered pair"
    error_id: ERR_INVALID_STACK_EDGE
    http_status: 409
    applies_to: "POST /incentives/programs/{id}/stackability-constraints"
  - priority: 27
    category: business_temporal
    check: "repricing window — the program has status == ACTIVE and the logical clock lies inside the program's half-open [effective_from, effective_to) window"
    error_id: ERR_REPRICING_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /incentives/programs/{id}/repricings"
  - priority: 28
    category: business_constraint
    check: "accrual period — no BudgetAccrual row with entry_type == ACCRUAL already exists for this (program_id, period_month)"
    error_id: ERR_ACCRUAL_PERIOD_ALREADY_RUN
    http_status: 409
    applies_to: "POST /incentives/programs/{id}/accruals"
  - priority: 29
    category: business_constraint
    check: "chargeback applicability — the claim has payment_status IN {SCHEDULED, PAID}; an UNPAID or already CHARGED_BACK claim has nothing to recover"
    error_id: ERR_CHARGEBACK_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /incentives/claims/{id}/chargebacks"
  - priority: 30
    category: business_temporal
    check: "disbursement timing — the logical clock is >= batch.scheduled_pay_date"
    error_id: ERR_PAY_DATE_NOT_REACHED
    http_status: 422
    applies_to: "POST /incentives/payment-batches/{id}/disburse"
  - priority: 31
    category: business_fiscal
    check: "budget headroom — program.committed_cents + this claim's approved_amount_cents does not exceed program.budget_cents"
    error_id: ERR_PROGRAM_BUDGET_EXHAUSTED
    http_status: 402
    applies_to: "POST /incentives/claims/{id}/adjudicate"

endpoints:
  - method: POST
    path: "/incentives/programs"
    description: "Create an incentive program in DRAFT."
    roles: [ProgramDesigner]
    code: 201
    input: ["program_code", "name", "incentive_type", "effective_from", "effective_to", "per_unit_amount_cents", "budget_cents", "stack_group", "priority_rank", "apr_buydown_bps?", "residual_support_bps?", "stack_cap_cents?", "tier_schedule?", "tier_bonus_mode?", "accrual_method?", "projected_take_rate_bps?", "supersedes_program_id?"]
    output: IncentiveProgram
    side_effects: ["sets status = DRAFT, version = 1 and every computed money field to 0"]
  - method: GET
    path: "/incentives/programs"
    description: "List programs with filters; supports pagination."
    roles: [ProgramDesigner, IncentiveController, FieldSalesManager, ClaimsAuditor]
    code: 200
    input: ["status?", "incentive_type?", "supersedes_program_id?", "limit?", "offset?"]
    output: IncentiveProgram[]
    side_effects: []
  - method: GET
    path: "/incentives/programs/{id}"
    description: "Read one program, including the current version for optimistic concurrency."
    roles: [ProgramDesigner, IncentiveController, FieldSalesManager, ClaimsAuditor, Dealer]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: []
  - method: POST
    path: "/incentives/programs/{id}/eligibility-rules"
    description: "Append one eligibility footprint row to a DRAFT program."
    roles: [ProgramDesigner]
    code: 201
    input: ["model_code", "region_code", "build_date_from", "build_date_to", "trim_code?", "min_msrp_cents?", "max_msrp_cents?", "allowed_deal_types?"]
    output: EligibilityRule
    side_effects: ["increments IncentiveProgram.version by 1"]
  - method: GET
    path: "/incentives/programs/{id}/eligibility-rules"
    description: "List a program's eligibility footprint rows in created_at ASC order."
    roles: [ProgramDesigner, IncentiveController, FieldSalesManager, ClaimsAuditor, Dealer]
    code: 200
    input: ["limit?", "offset?"]
    output: EligibilityRule[]
    side_effects: []
  - method: POST
    path: "/incentives/programs/{id}/stackability-constraints"
    description: "Declare the stackability edge between the path program and another program."
    roles: [ProgramDesigner]
    code: 201
    input: ["program_b_id", "mode", "cap_amount_cents?"]
    output: StackabilityConstraint
    side_effects: ["increments IncentiveProgram.version by 1 on the path program"]
  - method: GET
    path: "/incentives/programs/{id}/stackability-constraints"
    description: "List every stackability edge touching this program, in either direction."
    roles: [ProgramDesigner, IncentiveController, ClaimsAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: StackabilityConstraint[]
    side_effects: []
  - method: POST
    path: "/incentives/programs/{id}/submit"
    description: "DRAFT -> PENDING_APPROVAL. Records the submitting X-User-ID for the segregation-of-duties check."
    roles: [ProgramDesigner]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: ["sets submitted_by_user_id", "runs the program-overlap check of validations[priority=12]", "increments IncentiveProgram.version by 1"]
  - method: POST
    path: "/incentives/programs/{id}/revise"
    description: "PENDING_APPROVAL -> DRAFT, closing the revision loop and clearing submitted_by_user_id."
    roles: [ProgramDesigner]
    code: 200
    input: ["revision_note?"]
    output: IncentiveProgram
    side_effects: ["sets submitted_by_user_id = null", "increments IncentiveProgram.version by 1"]
  - method: POST
    path: "/incentives/programs/{id}/approve"
    description: "PENDING_APPROVAL -> ACTIVE. The approver's X-User-ID must differ from submitted_by_user_id."
    roles: [IncentiveController]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: ["sets approved_by_user_id", "drives the program named by supersedes_program_id from ACTIVE to SUPERSEDED, which rejects that program's SUBMITTED claims and recomputes its ledgers", "increments IncentiveProgram.version by 1"]
  - method: POST
    path: "/incentives/programs/{id}/close"
    description: "ACTIVE -> CLOSED, voiding non-terminal dealer objectives and denying their open protests."
    roles: [IncentiveController]
    code: 200
    input: ["closure_note?"]
    output: IncentiveProgram
    side_effects: ["voids DealerObjective rows with status IN {PROPOSED, PROTESTED, REVISED}", "denies those objectives' OPEN protests", "increments IncentiveProgram.version by 1"]
  - method: POST
    path: "/incentives/programs/{id}/repricings"
    description: "Reprice a program mid-month, prospectively or retroactively to the month start."
    roles: [ProgramDesigner]
    code: 201
    input: ["mode", "new_per_unit_amount_cents", "expected_program_version"]
    output: RepricingEvent
    side_effects: ["writes IncentiveProgram.per_unit_amount_cents", "runs calculations.repricing_reevaluation, which rewrites eligible claims' approved_amount_cents, recomputes attached OPEN batches' totals, raises REPRICING_ADJUSTMENT chargebacks for downward deltas on LOCKED batches, and recomputes program.committed_cents, program.claimed_units and program.per_unit_spend_cents", "increments IncentiveProgram.version by 1"]
  - method: GET
    path: "/incentives/programs/{id}/repricings"
    description: "List a program's repricing events in created_at ASC order."
    roles: [ProgramDesigner, IncentiveController, ClaimsAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: RepricingEvent[]
    side_effects: []
  - method: POST
    path: "/incentives/programs/{id}/accruals"
    description: "Run the monthly budget accrual for one period_month using the program's accrual_method."
    roles: [IncentiveController]
    code: 201
    input: ["period_month"]
    output: BudgetAccrual
    side_effects: ["creates an ACCRUAL row per calculations.budget_accrual_amount", "recomputes IncentiveProgram.accrued_budget_cents per calculations.program_accrual_ledger", "increments IncentiveProgram.version by 1"]
  - method: GET
    path: "/incentives/programs/{id}/accruals"
    description: "List a program's accrual entries (both ACCRUAL and REVERSAL) in created_at ASC order."
    roles: [IncentiveController, ProgramDesigner, ClaimsAuditor]
    code: 200
    input: ["entry_type?", "period_month?", "limit?", "offset?"]
    output: BudgetAccrual[]
    side_effects: []
  - method: GET
    path: "/incentives/programs/{id}/spend-summary"
    description: "Computed read of the per-unit incentive spend monitor and the residual value impact of lease support."
    roles: [ProgramDesigner, IncentiveController, ClaimsAuditor]
    code: 200
    input: []
    output: "{ program_id: string, claimed_units: integer, committed_cents: integer, paid_cents: integer, accrued_budget_cents: integer, per_unit_spend_cents: integer, residual_impact_bps: integer, budget_remaining_cents: integer }"
    side_effects: []
  - method: POST
    path: "/incentives/programs/{id}/objectives"
    description: "Assign a stair-step objective to one dealer, computed from historical volume and market opportunity."
    roles: [FieldSalesManager]
    code: 201
    input: ["dealer_id", "stretch_bps?"]
    output: DealerObjective
    side_effects: ["computes basis_units and objective_units per calculations.objective_units_proposal", "sets status = PROPOSED and protest_round = 0", "computes achieved_units, attainment_bps, tier_attained and payout_cents from the dealer's already-VALIDATED deliveries"]
  - method: GET
    path: "/incentives/programs/{id}/objectives"
    description: "List the objectives assigned under one program."
    roles: [FieldSalesManager, IncentiveController, ProgramDesigner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DealerObjective[]
    side_effects: []
  - method: GET
    path: "/incentives/objectives/{id}"
    description: "Read one dealer objective, including the version for optimistic concurrency."
    roles: [FieldSalesManager, IncentiveController, ProgramDesigner, Dealer]
    code: 200
    input: []
    output: DealerObjective
    side_effects: []
  - method: GET
    path: "/incentives/objectives"
    description: "List objectives filtered by dealer or status."
    roles: [FieldSalesManager, IncentiveController, ProgramDesigner, Dealer]
    code: 200
    input: ["dealer_id?", "program_id?", "status?", "limit?", "offset?"]
    output: DealerObjective[]
    side_effects: []
  - method: POST
    path: "/incentives/objectives/{id}/protests"
    description: "Dealer protests an assigned objective, asserting a different volume basis."
    roles: [Dealer]
    code: 201
    input: ["claimed_basis_units", "reason"]
    output: ObjectiveProtest
    side_effects: ["drives the objective PROPOSED -> PROTESTED or REVISED -> PROTESTED", "increments DealerObjective.protest_round by 1", "increments DealerObjective.version by 1"]
  - method: GET
    path: "/incentives/objectives/{id}/protests"
    description: "List an objective's protests in round_index ASC order."
    roles: [FieldSalesManager, IncentiveController, Dealer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ObjectiveProtest[]
    side_effects: []
  - method: POST
    path: "/incentives/objectives/{id}/protests/{protest_id}/resolve"
    description: "Uphold or deny a protest. UPHELD recomputes the objective from the protested basis and runs the four-link cascade; DENIED returns the objective to its pre-protest state."
    roles: [FieldSalesManager]
    code: 200
    input: ["resolution", "expected_objective_version"]
    output: ObjectiveProtest
    side_effects: ["UPHELD: rewrites objective.basis_units and objective_units, recomputes attainment_bps, tier_attained and payout_cents, raises an OBJECTIVE_REVISED chargeback when paid_payout_cents exceeds the new payout, and appends a BudgetAccrual REVERSAL row", "DENIED: no recomputation", "increments DealerObjective.version by 1 and ObjectiveProtest.version by 1"]
  - method: POST
    path: "/incentives/objectives/{id}/finalize"
    description: "Freeze an objective at PROPOSED or REVISED into FINAL so stair-step bonus claims can be adjudicated."
    roles: [FieldSalesManager]
    code: 200
    input: []
    output: DealerObjective
    side_effects: ["increments DealerObjective.version by 1"]
  - method: POST
    path: "/incentives/dealers"
    description: "Register a dealer with its objective-setting basis."
    roles: [IncentiveController]
    code: 201
    input: ["dealer_code", "name", "region_code", "historical_volume_units", "market_opportunity_bps"]
    output: Dealer
    side_effects: ["sets status = ACTIVE, paid_cents = 0 and open_chargeback_cents = 0"]
  - method: GET
    path: "/incentives/dealers/{id}"
    description: "Read one dealer."
    roles: [IncentiveController, FieldSalesManager, ClaimsAuditor, ProgramDesigner, Dealer]
    code: 200
    input: []
    output: Dealer
    side_effects: []
  - method: POST
    path: "/incentives/dealers/{id}/status"
    description: "Set dealer standing to ACTIVE, SUSPENDED or TERMINATED. SUSPENDED dealers keep their scheduled claims but cannot be disbursed."
    roles: [IncentiveController]
    code: 200
    input: ["status", "note?"]
    output: Dealer
    side_effects: ["increments Dealer.version by 1"]
  - method: POST
    path: "/incentives/deliveries"
    description: "Dealer system reports a retail delivery. reported_at is stamped from the logical clock and back-dated detection runs immediately."
    roles: [Dealer]
    code: 201
    input: ["dealer_id", "vin", "model_code", "trim_code", "build_date", "msrp_cents", "sale_date", "customer_region_code", "deal_type", "term_months?", "contract_apr_bps?", "base_residual_bps?"]
    output: RetailDelivery
    side_effects: ["stamps reported_at from the logical clock", "computes reporting_lag_days and back_dated_flag per calculations.back_dated_sale_detection", "sets status = REPORTED"]
  - method: GET
    path: "/incentives/deliveries/{id}"
    description: "Read one retail delivery."
    roles: [ClaimsAuditor, IncentiveController, FieldSalesManager, Dealer]
    code: 200
    input: []
    output: RetailDelivery
    side_effects: []
  - method: GET
    path: "/incentives/deliveries"
    description: "List retail deliveries filtered by dealer or status."
    roles: [ClaimsAuditor, IncentiveController, FieldSalesManager, Dealer]
    code: 200
    input: ["dealer_id?", "status?", "back_dated_flag?", "limit?", "offset?"]
    output: RetailDelivery[]
    side_effects: []
  - method: POST
    path: "/incentives/deliveries/{id}/validate"
    description: "REPORTED -> VALIDATED. Refused when back_dated_flag is true."
    roles: [ClaimsAuditor]
    code: 200
    input: []
    output: RetailDelivery
    side_effects: ["sets validated_by_user_id", "increments matching DealerObjective.achieved_units and recomputes attainment_bps, tier_attained and payout_cents", "increments DealerObjective.version by 1 for each objective it recomputed", "increments RetailDelivery.version by 1"]
  - method: POST
    path: "/incentives/deliveries/{id}/reject"
    description: "REPORTED -> REJECTED with an auditor reason."
    roles: [ClaimsAuditor]
    code: 200
    input: ["reason"]
    output: RetailDelivery
    side_effects: ["increments RetailDelivery.version by 1"]
  - method: POST
    path: "/incentives/deliveries/{id}/unwind"
    description: "VALIDATED -> UNWOUND. Runs the four-link chargeback cascade over this delivery's committed and paid claims."
    roles: [ClaimsAuditor]
    code: 200
    input: ["reason?"]
    output: RetailDelivery
    side_effects: ["moves SCHEDULED and PAID claims of this delivery to CHARGED_BACK and clears their payment_batch_id", "creates one UNWOUND_DEAL Chargeback per charged-back claim", "appends a BudgetAccrual REVERSAL row per chargeback and recomputes accrued_budget_cents", "recomputes program.committed_cents, paid_cents, claimed_units, per_unit_spend_cents and residual_impact_bps", "decrements matching DealerObjective.achieved_units, recomputes its payout and increments DealerObjective.version by 1", "increments RetailDelivery.version by 1"]
  - method: GET
    path: "/incentives/deliveries/{id}/eligible-programs"
    description: "Computed read of calculations.delivery_stack_allocation for this delivery: which programs are eligible, blocked or capped out given the delivery's existing claims."
    roles: [ClaimsAuditor, IncentiveController, Dealer]
    code: 200
    input: []
    output: "{ delivery_id: string, eligible_program_ids: string, blocked_program_ids: string, capped_out_program_ids: string, stacked_total_cents: integer }"
    side_effects: []
  - method: POST
    path: "/incentives/claims"
    description: "Dealer system submits an incentive claim against one program for one delivery."
    roles: [Dealer]
    code: 201
    input: ["delivery_id", "program_id", "claimed_amount_cents", "expected_program_version"]
    output: Claim
    side_effects: ["freezes snapshot_per_unit_cents from the program's current per_unit_amount_cents", "derives claim_type from the program's incentive_type and copies dealer_id from the delivery", "sets validation_status = SUBMITTED and payment_status = UNPAID", "increments IncentiveProgram.version by 1"]
  - method: GET
    path: "/incentives/claims/{id}"
    description: "Read one claim with both state dimensions."
    roles: [ClaimsAuditor, IncentiveController, ProgramDesigner, Dealer]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/incentives/claims"
    description: "List claims filtered by program, dealer, delivery, batch or either state dimension."
    roles: [ClaimsAuditor, IncentiveController, ProgramDesigner, Dealer]
    code: 200
    input: ["program_id?", "dealer_id?", "delivery_id?", "payment_batch_id?", "validation_status?", "payment_status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/incentives/claims/{id}/adjudicate"
    description: "Approve or reject a submitted claim. Approving computes approved_amount_cents and commits the money."
    roles: [ClaimsAuditor]
    code: 200
    input: ["decision", "rejection_error_id?"]
    output: Claim
    side_effects: ["APPROVE: computes approved_amount_cents and rate_basis per calculations.claim_payable_amount, adds it to program.committed_cents, increments program.claimed_units, recomputes program.per_unit_spend_cents and, for LEASE_SUPPORT programs, program.residual_impact_bps", "REJECT: sets approved_amount_cents = 0 and rejection_error_id", "sets adjudicated_by_user_id", "increments Claim.version by 1 and IncentiveProgram.version by 1"]
  - method: POST
    path: "/incentives/claims/{id}/chargebacks"
    description: "Auditor raises a chargeback against a scheduled or paid claim (back-dated sale found after the fact, duplicate claim, and so on)."
    roles: [ClaimsAuditor]
    code: 201
    input: ["reason"]
    output: Chargeback
    side_effects: ["computes amount_cents per calculations.chargeback_recovery_amount", "moves the claim to payment_status = CHARGED_BACK and clears payment_batch_id", "appends a BudgetAccrual REVERSAL row and recomputes accrued_budget_cents", "recomputes program.committed_cents, paid_cents, claimed_units and per_unit_spend_cents", "sets created_by_user_id", "increments Claim.version by 1"]
  - method: GET
    path: "/incentives/claims/{id}/chargebacks"
    description: "List the chargebacks raised against one claim in created_at ASC order."
    roles: [ClaimsAuditor, IncentiveController, Dealer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Chargeback[]
    side_effects: []
  - method: POST
    path: "/incentives/chargebacks/{id}/recover"
    description: "PENDING -> RECOVERED. The money returns to the program, restoring committed_cents to its pre-claim value."
    roles: [IncentiveController]
    code: 200
    input: []
    output: Chargeback
    side_effects: ["sets recovered_at", "subtracts amount_cents from Dealer.open_chargeback_cents", "recomputes program.committed_cents per calculations.program_committed_ledger", "increments Chargeback.version by 1"]
  - method: POST
    path: "/incentives/chargebacks/{id}/write-off"
    description: "PENDING -> WRITTEN_OFF. The money stays committed because it is never coming back."
    roles: [IncentiveController]
    code: 200
    input: ["write_off_note?"]
    output: Chargeback
    side_effects: ["sets recovered_at", "subtracts amount_cents from Dealer.open_chargeback_cents", "leaves the amount inside program.committed_cents", "increments Chargeback.version by 1"]
  - method: POST
    path: "/incentives/payment-batches"
    description: "Open a regional disbursement batch for a closed pay period."
    roles: [IncentiveController]
    code: 201
    input: ["batch_code", "region_code", "period_start", "period_end", "scheduled_pay_date"]
    output: PaymentBatch
    side_effects: ["runs the period-overlap and settlement-buffer checks of validations[priority=13] and validations[priority=14]", "sets status = OPEN, claim_count = 0, total_cents = 0"]
  - method: GET
    path: "/incentives/payment-batches/{id}"
    description: "Read one payment batch with its computed totals."
    roles: [IncentiveController, ClaimsAuditor, ProgramDesigner]
    code: 200
    input: []
    output: PaymentBatch
    side_effects: []
  - method: POST
    path: "/incentives/payment-batches/{id}/schedule-claims"
    description: "Attach VALIDATED, UNPAID claims of this region and pay period to an OPEN batch. A claim_ids entry that is not VALIDATED and UNPAID is refused with ERR_CLAIM_NOT_VALIDATED and the whole call is a no-op."
    roles: [IncentiveController]
    code: 200
    input: ["claim_ids"]
    output: PaymentBatch
    side_effects: ["moves each claim's payment_status UNPAID -> SCHEDULED and sets payment_batch_id", "recomputes batch.claim_count and batch.total_cents", "increments PaymentBatch.version by 1 and each Claim.version by 1"]
  - method: POST
    path: "/incentives/payment-batches/{id}/lock"
    description: "OPEN -> LOCKED. No further claims may be attached and the batch's amounts become immutable to retroactive repricing."
    roles: [IncentiveController]
    code: 200
    input: []
    output: PaymentBatch
    side_effects: ["increments PaymentBatch.version by 1"]
  - method: POST
    path: "/incentives/payment-batches/{id}/disburse"
    description: "LOCKED -> DISBURSED. Pays the scheduled claims of ACTIVE dealers and holds the rest."
    roles: [IncentiveController]
    code: 200
    input: []
    output: PaymentBatch
    side_effects: ["moves SCHEDULED claims of ACTIVE dealers to PAID with paid_at stamped from the logical clock", "leaves claims of SUSPENDED or TERMINATED dealers SCHEDULED and counts them in held_claim_count", "adds paid amounts to program.paid_cents and Dealer.paid_cents", "sets objective.paid_payout_cents for STAIR_STEP_BONUS claims", "sets disbursed_at and recomputes total_cents", "increments PaymentBatch.version by 1"]
  - method: POST
    path: "/incentives/payment-batches/{id}/cancel"
    description: "OPEN -> CANCELLED, releasing the scheduled claims and freeing the pay period."
    roles: [IncentiveController]
    code: 200
    input: ["cancel_note?"]
    output: PaymentBatch
    side_effects: ["returns SCHEDULED claims to UNPAID with payment_batch_id cleared", "zeroes claim_count and total_cents", "increments PaymentBatch.version by 1"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00.000Z; before any call to this endpoint every reported_at, paid_at, effective_at, unwound_at and recovered_at reads that default, and the server NEVER falls back to real wall-clock time."
    roles: [IncentiveController]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["moves the logical clock; no entity is mutated and no transition fires"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approver's X-User-ID equals program.submitted_by_user_id, or the adjudicating auditor's X-User-ID equals the delivery's validated_by_user_id"
  - id: ERR_DEALER_MISMATCH
    http: 403
    condition: "a Dealer caller acts on a resource whose dealer_id is not the caller's X-User-ID"
  - id: ERR_DEALER_NOT_IN_GOOD_STANDING
    http: 403
    condition: "a Dealer with status == TERMINATED reports a delivery or submits a claim"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "no IncentiveProgram matches the id in the path or in supersedes_program_id / program_id / program_b_id"
  - id: ERR_OBJECTIVE_NOT_FOUND
    http: 404
    condition: "no DealerObjective matches the id in the path"
  - id: ERR_PROTEST_NOT_FOUND
    http: 404
    condition: "no ObjectiveProtest with the path id belongs to the path objective"
  - id: ERR_DEALER_NOT_FOUND
    http: 404
    condition: "no Dealer matches the id in the path or in the dealer_id body field"
  - id: ERR_DELIVERY_NOT_FOUND
    http: 404
    condition: "no RetailDelivery matches the id in the path or in the delivery_id body field"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no Claim matches the id in the path or an id inside claim_ids"
  - id: ERR_CHARGEBACK_NOT_FOUND
    http: 404
    condition: "no Chargeback matches the id in the path"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "no PaymentBatch matches the id in the path"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, an enum value is not a declared member, an integer is outside its declared range, an instant is not parseable ISO 8601 UTC, effective_to <= effective_from, build_date_to < build_date_from, period_end < period_start, scheduled_pay_date < period_end, cap_amount_cents present without mode == CAPPED_TOTAL (or absent with it), or tier_schedule is not strictly ascending in tier_index and threshold_bps"
  - id: ERR_DUPLICATE_PROGRAM_CODE
    http: 409
    condition: "program_code already used by any program, including CLOSED and SUPERSEDED ones"
  - id: ERR_DUPLICATE_DEALER_CODE
    http: 409
    condition: "dealer_code already used by any dealer"
  - id: ERR_DUPLICATE_VIN
    http: 409
    condition: "vin already used by any RetailDelivery, including UNWOUND and REJECTED ones"
  - id: ERR_DUPLICATE_BATCH_CODE
    http: 409
    condition: "batch_code already used by any PaymentBatch, including CANCELLED ones"
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not equal IncentiveProgram.version on claim submission or on a repricing"
  - id: ERR_STALE_OBJECTIVE_VERSION
    http: 412
    condition: "expected_objective_version does not equal DealerObjective.version on protest resolution"
  - id: ERR_PROGRAM_INVALID_STATE
    http: 409
    condition: "the requested program transition is not declared from the program's current status (submit from a non-DRAFT program, approve or revise from a non-PENDING_APPROVAL program, close from a non-ACTIVE program, or any transition out of SUPERSEDED or CLOSED)"
  - id: ERR_OBJECTIVE_INVALID_STATE
    http: 409
    condition: "a protest is filed against an objective whose status is not in {PROPOSED, REVISED, FINAL} (i.e. PROTESTED or VOID), or finalize is called on an objective whose status is not in {PROPOSED, REVISED}"
  - id: ERR_PROTEST_ALREADY_RESOLVED
    http: 409
    condition: "the named ObjectiveProtest has status != OPEN"
  - id: ERR_DELIVERY_INVALID_STATE
    http: 409
    condition: "validate or reject is called on a delivery whose status != REPORTED, or unwind is called on a delivery whose status != VALIDATED"
  - id: ERR_CLAIM_ALREADY_ADJUDICATED
    http: 409
    condition: "adjudicate is called on a claim whose validation_status != SUBMITTED"
  - id: ERR_CLAIM_NOT_VALIDATED
    http: 409
    condition: "a claim named in claim_ids has validation_status != VALIDATED or payment_status != UNPAID, so the parallel-dimension guard forbids attaching it to a payment batch"
  - id: ERR_BATCH_INVALID_STATE
    http: 409
    condition: "claims are scheduled into a non-OPEN batch, lock is called on a non-OPEN batch, disburse is called on a non-LOCKED batch, or cancel is called on a non-OPEN batch"
  - id: ERR_CHARGEBACK_INVALID_STATE
    http: 409
    condition: "recover or write-off is called on a Chargeback whose status != PENDING"
  - id: ERR_PROGRAM_NOT_ACTIVE
    http: 409
    condition: "the referenced program's status != ACTIVE when a claim is submitted or adjudicated, an objective is created, or a protest is filed; also recorded in rejection_error_id when the SUPERSEDED cascade auto-rejects a SUBMITTED claim"
  - id: ERR_PROGRAM_WINDOW_OVERLAP
    http: 409
    condition: "another PENDING_APPROVAL or ACTIVE program of the same incentive_type has an intersecting half-open window and an intersecting eligibility footprint, with no ALLOWED or CAPPED_TOTAL stackability edge between them"
  - id: ERR_BATCH_PERIOD_OVERLAP
    http: 409
    condition: "the new batch's closed pay period intersects an existing OPEN, LOCKED or DISBURSED batch of the same region_code"
  - id: ERR_BATCH_BUFFER_VIOLATION
    http: 409
    condition: "the new batch's period_start is not strictly more than one whole day after the nearest preceding same-region batch's period_end"
  - id: ERR_SALE_DATE_OUTSIDE_PROGRAM_WINDOW
    http: 422
    condition: "the delivery's sale_date is not inside the claimed program's half-open [effective_from, effective_to) window"
  - id: ERR_BACK_DATED_SALE_DETECTED
    http: 422
    condition: "validate is called on a delivery whose back_dated_flag is true (reporting lag strictly greater than 10 days, or a future-dated sale)"
  - id: ERR_DELIVERY_NOT_VALIDATED
    http: 409
    condition: "adjudicate is called on a claim whose delivery status != VALIDATED"
  - id: ERR_OBJECTIVE_NOT_FINAL
    http: 409
    condition: "a STAIR_STEP_BONUS claim is adjudicated while the matching DealerObjective has status != FINAL, or no matching objective exists"
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "a non-terminal Claim already exists for the same (delivery_id, program_id) pair"
  - id: ERR_NO_ELIGIBLE_PROGRAM
    http: 422
    condition: "the claimed program is not in the delivery's candidate set — not ACTIVE, window does not contain sale_date, or no EligibilityRule admits the delivery's model, trim, region, build date, MSRP or deal type"
  - id: ERR_STACK_COMBINATION_FORBIDDEN
    http: 422
    condition: "a FORBIDDEN stackability edge joins the claimed program to the program of an already-accepted claim on the same delivery"
  - id: ERR_STACK_CAP_EXCEEDED
    http: 422
    condition: "the stacked total including the new claim's gross strictly exceeds the pair cap, the claimed program's stack_cap_cents, or an accepted partner's stack_cap_cents"
  - id: ERR_PROTEST_LIMIT_REACHED
    http: 409
    condition: "a third protest is filed against an objective whose protest_round is already 2"
  - id: ERR_ELIGIBILITY_RULE_CONFLICT
    http: 409
    condition: "the new EligibilityRule duplicates an existing rule of the same program on (model_code, trim_code, region_code) with an intersecting closed build-date interval"
  - id: ERR_INVALID_STACK_EDGE
    http: 409
    condition: "program_b_id equals the path program id, or an edge already joins the unordered pair"
  - id: ERR_REPRICING_WINDOW_CLOSED
    http: 422
    condition: "a repricing is applied to a non-ACTIVE program, or the logical clock is outside the program's half-open effective window"
  - id: ERR_ACCRUAL_PERIOD_ALREADY_RUN
    http: 409
    condition: "an ACCRUAL row already exists for this (program_id, period_month)"
  - id: ERR_CHARGEBACK_NOT_APPLICABLE
    http: 409
    condition: "a chargeback is raised on a claim whose payment_status is UNPAID or already CHARGED_BACK"
  - id: ERR_PAY_DATE_NOT_REACHED
    http: 422
    condition: "disburse is called while the logical clock is strictly before batch.scheduled_pay_date"
  - id: ERR_PROGRAM_BUDGET_EXHAUSTED
    http: 402
    condition: "approving the claim would push program.committed_cents above program.budget_cents"

roles:
  - name: ProgramDesigner
    description: "Designs incentive programs, their eligibility footprints and stackability edges, submits them for approval and applies mid-month repricings. Never approves anything."
    identity: opaque
    exclusive_operations:
      - "POST /incentives/programs"
      - "POST /incentives/programs/{id}/eligibility-rules"
      - "POST /incentives/programs/{id}/stackability-constraints"
      - "POST /incentives/programs/{id}/submit"
      - "POST /incentives/programs/{id}/revise"
      - "POST /incentives/programs/{id}/repricings"
    shared_operations:
      - "GET /incentives/programs"
      - "GET /incentives/programs/{id}"
      - "GET /incentives/programs/{id}/eligibility-rules"
      - "GET /incentives/programs/{id}/stackability-constraints"
      - "GET /incentives/programs/{id}/repricings"
      - "GET /incentives/programs/{id}/accruals"
      - "GET /incentives/programs/{id}/spend-summary"
      - "GET /incentives/programs/{id}/objectives"
      - "GET /incentives/objectives"
      - "GET /incentives/objectives/{id}"
      - "GET /incentives/dealers/{id}"
      - "GET /incentives/claims"
      - "GET /incentives/claims/{id}"
      - "GET /incentives/payment-batches/{id}"
  - name: IncentiveController
    description: "Owns the money: approves and closes programs, registers dealers and sets their standing, runs budget accruals, builds and disburses payment batches, resolves chargebacks, and drives the logical clock in tests."
    identity: opaque
    exclusive_operations:
      - "POST /incentives/programs/{id}/approve"
      - "POST /incentives/programs/{id}/close"
      - "POST /incentives/programs/{id}/accruals"
      - "POST /incentives/dealers"
      - "POST /incentives/dealers/{id}/status"
      - "POST /incentives/payment-batches"
      - "POST /incentives/payment-batches/{id}/schedule-claims"
      - "POST /incentives/payment-batches/{id}/lock"
      - "POST /incentives/payment-batches/{id}/disburse"
      - "POST /incentives/payment-batches/{id}/cancel"
      - "POST /incentives/chargebacks/{id}/recover"
      - "POST /incentives/chargebacks/{id}/write-off"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /incentives/programs"
      - "GET /incentives/programs/{id}"
      - "GET /incentives/programs/{id}/eligibility-rules"
      - "GET /incentives/programs/{id}/stackability-constraints"
      - "GET /incentives/programs/{id}/repricings"
      - "GET /incentives/programs/{id}/accruals"
      - "GET /incentives/programs/{id}/spend-summary"
      - "GET /incentives/programs/{id}/objectives"
      - "GET /incentives/objectives"
      - "GET /incentives/objectives/{id}"
      - "GET /incentives/objectives/{id}/protests"
      - "GET /incentives/dealers/{id}"
      - "GET /incentives/deliveries"
      - "GET /incentives/deliveries/{id}"
      - "GET /incentives/deliveries/{id}/eligible-programs"
      - "GET /incentives/claims"
      - "GET /incentives/claims/{id}"
      - "GET /incentives/claims/{id}/chargebacks"
      - "GET /incentives/payment-batches/{id}"
  - name: FieldSalesManager
    description: "Sets dealer stair-step objectives from historical volume and market opportunity, resolves dealer protests and finalizes objectives. Cannot approve programs and cannot adjudicate claims."
    identity: opaque
    exclusive_operations:
      - "POST /incentives/programs/{id}/objectives"
      - "POST /incentives/objectives/{id}/protests/{protest_id}/resolve"
      - "POST /incentives/objectives/{id}/finalize"
    shared_operations:
      - "GET /incentives/programs"
      - "GET /incentives/programs/{id}"
      - "GET /incentives/programs/{id}/eligibility-rules"
      - "GET /incentives/programs/{id}/objectives"
      - "GET /incentives/objectives"
      - "GET /incentives/objectives/{id}"
      - "GET /incentives/objectives/{id}/protests"
      - "GET /incentives/dealers/{id}"
      - "GET /incentives/deliveries"
      - "GET /incentives/deliveries/{id}"
  - name: ClaimsAuditor
    description: "Validates or rejects reported retail deliveries, unwinds deals, adjudicates claims and raises chargebacks. The same auditor id may not both validate a delivery and adjudicate a claim built on it."
    identity: opaque
    exclusive_operations:
      - "POST /incentives/deliveries/{id}/validate"
      - "POST /incentives/deliveries/{id}/reject"
      - "POST /incentives/deliveries/{id}/unwind"
      - "POST /incentives/claims/{id}/adjudicate"
      - "POST /incentives/claims/{id}/chargebacks"
    shared_operations:
