  # ===========================================================================
  # RULE 8 — resource/temporal overlap (different interval semantics, different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crush_pad_lane_buffered_adjacency_one_minute_either_side
        resource_entity: CrushPadLane
        interval_semantics: "single-occupancy exclusivity over intervals DILATED by turnaround_buffer_minutes on both ends; windows that merely touch after dilation are accepted"
        grounds:
          - validations.priority_33
          - entities.CrushPadLane.fields.turnaround_buffer_minutes
          - entities.DeliveryAppointment.fields.window_start
        distinguishing_aspect: |
          Resource: the crush-pad LANE, and the interval semantics are DILATED-EXCLUSIVE — one
          appointment at a time, with the occupied region grown by 30 minutes at each end, so an
          existing 14:00-16:00 slot blocks [13:30, 16:30). A request starting at 16:29 is refused
          and the identical-length request starting at 16:30 is accepted: the boundary is tested
          one minute either side of the dilated edge, and touching is legal.
