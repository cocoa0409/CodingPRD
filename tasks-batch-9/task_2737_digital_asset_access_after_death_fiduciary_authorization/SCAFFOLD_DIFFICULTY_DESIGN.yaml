          assert:
            - "before the PATCH: DigitalAsset.${a_sub_id}.transferability == LICENSE_TERMINATES_AT_DEATH"
            - "before the PATCH: DigitalAsset.${a_sub_id}.transferability_reason == CATEGORY_SUBSCRIPTION_LICENCE"
            - "before the PATCH: DigitalAsset.${a_cloud_id}.transferability == NON_TRANSFERABLE"
            - "before the PATCH: DigitalAsset.${a_cloud_id}.transferability_reason == PROVIDER_NO_TRANSFER"
            - "DigitalAsset.${a_mail_id}.transferability == NON_TRANSFERABLE"
            - "DigitalAsset.${a_mail_id}.transferability_reason == CATEGORY_PERSONAL"
            - "DigitalAsset.${a_loyal_id}.transferability == LICENSE_TERMINATES_AT_DEATH"
            - "DigitalAsset.${a_loyal_id}.transferability_reason == PROVIDER_LICENCE_TERMINATES"
            - "after the transferability review: DigitalAsset.${a_cloud_id}.transferability == LICENSE_TERMINATES_AT_DEATH"
            - "after the transferability review: DigitalAsset.${a_cloud_id}.transferability_reason == PROVIDER_LICENCE_TERMINATES"
            - "DigitalAsset.${a_sub_id}.subscription_billing_state == ACTIVE"
            - "DigitalAsset.${a_cloud_id}.subscription_billing_state == NOT_APPLICABLE"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: platform_request_info_cycle_loops_back_three_times_then_caps
        grounds:
          - state_machines.PlatformRequest.transitions[UNDER_REVIEW->INFO_REQUESTED]
          - state_machines.PlatformRequest.transitions[INFO_REQUESTED->SUBMITTED]
          - entities.PlatformRequest.fields.info_cycle_count
          - entities.PlatformRequest.fields.review_window_start
          - validations[priority=70]
          - validations[priority=31]
        distinguishing_aspect: |
          The request re-enters UNDER_REVIEW three separate times through the
          UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED -> UNDER_REVIEW cycle; the loop is not a
          simple retry because each pass clears the review window on the way out and re-opens it at
          the new clock position on the way back, and the fourth RESUBMIT is refused by
          ERR_INFO_CYCLE_LIMIT while the request stays parked in INFO_REQUESTED rather than
          advancing or terminating.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one platform CloudVault with review_window_days 14"
            - "one estate with a VERIFIED death certificate and VERIFIED letters naming an EXECUTOR"
            - "a DRAFT CATALOG_ACCESS request that has already run the info cycle three times and sits in INFO_REQUESTED with info_cycle_count == 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
