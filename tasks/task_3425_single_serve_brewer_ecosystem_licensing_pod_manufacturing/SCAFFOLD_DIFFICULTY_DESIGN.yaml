            - "RoyaltyStatement.${bp1_s2}.final_royalty_cents == 1 (the 1,000,001st unit starts at cumulative position 1000000 -> 1*900/1000 = 0.9 rounds to 1)"

      - name: descale_exact_interval_boundary
        grounds:
