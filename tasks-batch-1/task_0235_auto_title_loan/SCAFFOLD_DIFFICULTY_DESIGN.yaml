            - "overlapping assignment [10:00,14:00) returns ERR_ASSIGNMENT_WINDOW_OVERLAP (409)"

  # ===================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: principal_ledger_conserved_across_payment
        grounds:
          - calculations.payment_allocation
          - entities.Loan.fields.principal_balance_cents
          - entities.Payment.fields.principal_applied_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = principal money: for any REGULAR payment,
          (sum of Payment.principal_applied_cents over the loan) + Loan.principal_balance_cents
          == Loan.original_principal_cents (600000) exactly, before and after the payment — no cents drift.
        test_recipe:
          setup:
            - "CA loan originated principal 600000, no delinquency; original_principal_cents=600000, principal_balance_cents=600000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "ca17@x.com", full_name: "CA Seventeen", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
