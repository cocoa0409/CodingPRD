  # =========================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: warranty_period_boundary_exact_day_inclusive
        grounds:
          - validations[priority=9]
          - errors[ERR_WARRANTY_EXPIRED]
          - entities.Plant.fields.warranty_days
        distinguishing_aspect: |
          Numeric threshold boundary: warranty period is inclusive at the
          last day and exclusive at day+1. Delivered at 2026-04-05T10:00Z with
          warranty_days=30, a claim at 2026-05-05T10:00Z (exactly 30 days,
          floor bucket) is ACCEPTED; a claim at 2026-05-05T10:00:01Z is still
          within the same day (day=30) and accepted; but a claim at 2026-05-
          06T10:00Z (day=31) is REJECTED with ERR_WARRANTY_EXPIRED.
        test_recipe:
          setup:
            - "Delivered order with orderline on 2026-04-05T10:00Z; warranty_days=30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "oli@example.com", full_name: "Oli", delivery_zone: "ZONE_A", address_line: "12 Palm" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /delivery-drivers"
              payload: { name: "Pat" }
              as: Manager
              captures: { driver_id: "$.data.id" }
