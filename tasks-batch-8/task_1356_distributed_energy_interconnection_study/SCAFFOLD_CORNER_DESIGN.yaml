  - section: endpoints
    instances:
      - name: response_envelope_success_shape
        claim_type: computed_read
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every success response wraps data in the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type 'object', data payload."
        test_recipe:
          setup: ["Empty system"]
          setup_api_calls: []
          trigger:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
          assert:
            - "Response has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == 'object' and data.id == ${dev_id}"

      - name: response_envelope_error_shape
        claim_type: computed_read
        grounds: ["response_envelope", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Every error response wraps the failure: response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["Empty system"]
          setup_api_calls: []
          trigger:
            - call: "POST /interconnection/developers"
              payload: { contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == 'error'"
            - "${err} == ERR_INVALID_REQUEST and data.message is a non-empty string"

  - section: errors
    instances:
      - name: not_found_errors_across_resources
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLUSTER_GROUP_NOT_FOUND]", "errors[ERR_STUDY_NOT_FOUND]", "errors[ERR_AGREEMENT_NOT_FOUND]", "errors[ERR_MILESTONE_SUBMISSION_NOT_FOUND]", "errors[ERR_TRANSPARENCY_REPORT_NOT_FOUND]", "errors[ERR_DEVELOPER_NOT_FOUND]"]
        distinguishing_aspect: "Each resource-specific 404 is triggerable: unknown ids on cluster, study, agreement, milestone, report paths and a bogus developer_id in the project-creation body."
        test_recipe:
          setup: ["One FORMING cluster exists (for the developer_id body-FK check)"]
          setup_api_calls:
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
          trigger:
            - call: "GET /interconnection/cluster-groups/00000000-0000-0000-0000-000000000000"
              as: QueueAdministrator
              captures: { err_cg: $.data.error_id }
            - call: "GET /interconnection/studies/00000000-0000-0000-0000-000000000000"
              as: QueueAdministrator
              captures: { err_st: $.data.error_id }
            - call: "POST /interconnection/agreements/00000000-0000-0000-0000-000000000000/execute"
              as: Developer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { err_ag: $.data.error_id }
            - call: "POST /interconnection/milestone-submissions/00000000-0000-0000-0000-000000000000/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
              captures: { err_ms: $.data.error_id }
            - call: "GET /interconnection/transparency-reports/00000000-0000-0000-0000-000000000000"
              as: Regulator
              captures: { err_tr: $.data.error_id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "11111111-1111-1111-1111-111111111111", cluster_group_id: "${cg_id}", project_name: "Ghost", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { err_dev: $.data.error_id }
          assert:
            - "${err_cg} == ERR_CLUSTER_GROUP_NOT_FOUND and ${err_st} == ERR_STUDY_NOT_FOUND"
            - "${err_ag} == ERR_AGREEMENT_NOT_FOUND and ${err_ms} == ERR_MILESTONE_SUBMISSION_NOT_FOUND"
            - "${err_tr} == ERR_TRANSPARENCY_REPORT_NOT_FOUND and ${err_dev} == ERR_DEVELOPER_NOT_FOUND"

