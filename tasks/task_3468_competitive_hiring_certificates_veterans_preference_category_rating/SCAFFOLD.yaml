scenario: "Competitive Hiring Certificates, Veterans Preference & Category Rating (Office of Personnel Management): position classification and grade determination from duties with qualification standards published by occupational series, job announcement construction with open periods, area of consideration and assessment method selection, applicant assessment producing quality categories rather than numeric ranking with subject matter expert involvement, veterans preference application placing preference eligibles ahead within categories with pass-over procedures requiring approval, certificate issuance to selecting officials with rule-of-many-candidates selection rules and certificate expiration, direct hire and special hiring authorities bypassing competitive procedures with eligibility documentation, tentative offer, suitability and security clearance sequencing before entry on duty, complaint and appeal rights for applicants"

domain_name: competitive-hiring-certificates
api_prefix: /hiring

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: OccupationalSeries
    parent: null
    common_fields: true
    fields:
      - name: series_code
        type: string
        source: input
        description: "OPM occupational series code, unique across all series (e.g. '0343')."
        constraints: "unique; 4-digit string"
      - name: title
        type: string
        source: input
        description: "Official series title."
      - name: min_grade
        type: integer
        source: input
        description: "Lowest GS grade classifiable in this series (5..15)."
        constraints: "5 <= min_grade <= max_grade"
      - name: max_grade
        type: integer
        source: input
        description: "Highest GS grade classifiable in this series (5..15)."
        constraints: "min_grade <= max_grade <= 15"
      - name: quals_base_months
        type: integer
        source: input
        description: "Specialized experience months required at min_grade."
        constraints: ">= 0"
      - name: quals_months_per_grade_step
        type: integer
        source: input
        description: "Additional required months per grade above min_grade."
        constraints: ">= 0"
      - name: allows_education_substitution
        type: boolean
        source: input
        description: "Whether education months may substitute for specialized experience."
      - name: education_substitution_cap_months
        type: integer
        source: input
        description: "Maximum education months creditable toward experience when substitution allowed."
        constraints: ">= 0"
      - name: positive_education_required
        type: boolean
        source: input
        description: "When true, applicant must claim > 0 education months to be qualified at all."

  - name: Position
    parent: null
    common_fields: true
    fields:
      - name: series_id
        type: string
        source: input
        description: "FK -> OccupationalSeries.id; the series this position is classified under."
      - name: title
        type: string
        source: input
        description: "Position title."
      - name: org_code
        type: string
        source: input
        description: "Hiring organization code."
      - name: factor_knowledge_level
        type: integer
        source: input
        description: "Factor evaluation level for knowledge required (1..5)."
        constraints: "1 <= level <= 5"
      - name: factor_supervision_level
        type: integer
        source: input
        description: "Factor evaluation level for supervisory controls (1..5)."
        constraints: "1 <= level <= 5"
      - name: factor_complexity_level
        type: integer
        source: input
        description: "Factor evaluation level for assignment complexity (1..5)."
        constraints: "1 <= level <= 5"
      - name: factor_impact_level
        type: integer
        source: input
        description: "Factor evaluation level for scope and effect (1..5)."
        constraints: "1 <= level <= 5"
      - name: total_points
        type: integer
        source: computed
        description: "Point-factor total: 300*K + 200*S + 250*C + 250*I over factor levels."
      - name: provisional_grade
        type: integer
        source: computed
        description: "Narrative-method grade preview at DRAFT: min over factors of LEVEL_GRADE_CAP[level]; identical inputs can yield a different grade than official_grade."
      - name: official_grade
        type: integer
        source: computed
        description: "Point-factor-method grade set on classify/reclassify; null while DRAFT."
        constraints: "null until status == CLASSIFIED"
      - name: sensitivity_level
        type: enum
        source: input
        description: "Position sensitivity driving the security clearance gate."
        constraints: "one of NONE | SECRET | TOP_SECRET"
      - name: status
        type: enum
        source: system
        description: "State machine: DRAFT | CLASSIFIED."

  - name: JobAnnouncement
    parent: null
    common_fields: true
    fields:
      - name: position_id
        type: string
        source: input
        description: "FK -> Position.id; position being announced."
      - name: announcement_number
        type: string
        source: input
        description: "Public announcement identifier, unique."
        constraints: "unique"
      - name: area_of_consideration
        type: enum
        source: input
        description: "Who may apply."
        constraints: "one of ALL_US_CITIZENS | STATUS_CANDIDATES | AGENCY_ONLY"
      - name: hiring_authority
        type: enum
        source: input
        description: "Legal hiring authority; non-COMPETITIVE authorities bypass competitive procedures and demand eligibility documentation."
        constraints: "one of COMPETITIVE | DIRECT_HIRE | VEOA | SCHEDULE_A | NONCOMPETITIVE_SPOUSE"
      - name: assessment_method
        type: enum
        source: input
        description: "Assessment method: CATEGORY_RATING for competitive, UNRANKED for direct-hire style."
        constraints: "one of CATEGORY_RATING | UNRANKED; DIRECT_HIRE requires UNRANKED; COMPETITIVE requires CATEGORY_RATING"
      - name: open_at
        type: datetime
        source: input
        description: "Start of the open period; half-open interval [open_at, close_at)."
      - name: close_at
        type: datetime
        source: input
        description: "End of the open period; applications accepted while clock < close_at and >= open_at."
        constraints: "close_at > open_at"
      - name: vacancies_count
        type: integer
        source: input
        description: "Number of positions to fill from this announcement."
        constraints: ">= 1"
      - name: bq_cut
        type: integer
        source: input
        description: "technical_score >= bq_cut maps to BEST_QUALIFIED."
        default: 95
      - name: wq_cut
        type: integer
        source: input
        description: "technical_score >= wq_cut (and < bq_cut) maps to WELL_QUALIFIED; else QUALIFIED."
        default: 85
        constraints: "wq_cut < bq_cut; both in [70, 100]"
      - name: certificate_validity_days
        type: integer
        source: input
        description: "Days a certificate stays ACTIVE from issued_at."
        default: 60
        constraints: "30 <= certificate_validity_days <= 90"
      - name: remaining_vacancies
        type: integer
        source: computed
        description: "vacancies_count minus count of certificate entries (on this announcement) with status SELECTED whose offer is in {TENTATIVE, ACCEPTED, EOD_SCHEDULED, ENTERED_ON_DUTY}."
      - name: status
        type: enum
        source: system
        description: "State machine: DRAFT | OPEN | CLOSED | CERT_ISSUED | FILLED | CANCELLED."

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Applicant legal name."
      - name: email
        type: string
        source: input
        description: "Contact email, unique."
        constraints: "unique"
      - name: is_us_citizen
        type: boolean
        source: input
        description: "US citizenship; required for all applications."
      - name: is_current_federal_employee
        type: boolean
        source: input
        description: "Current competitive-service federal employee (status candidate)."
      - name: agency_code
        type: string
        source: input
        description: "Employing agency code; required when area_of_consideration == AGENCY_ONLY checks it against the announcement org."
        constraints: "optional"
      - name: veteran_preference_claim
        type: enum
        source: input
        description: "Claimed veterans preference; only counts when verified documents exist."
        constraints: "one of NONE | FIVE_POINT | TEN_POINT_CP | TEN_POINT_CPS"
      - name: preference_verified
        type: boolean
        source: computed
        description: "True iff required verified EligibilityDocuments exist for the claim: FIVE_POINT needs verified DD214; TEN_POINT_CP needs verified DD214 + VA_LETTER; TEN_POINT_CPS needs verified DD214 + VA_LETTER; NONE always true."
      - name: preference_points
        type: integer
        source: computed
        description: "0 when claim NONE or unverified; 5 for verified FIVE_POINT; 10 for verified TEN_POINT_CP or TEN_POINT_CPS."

  - name: EligibilityDocument
    parent: Applicant
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; owner of the document."
      - name: doc_type
        type: enum
        source: input
        description: "Document type establishing preference or special-authority eligibility."
        constraints: "one of DD214 | SF50 | VA_LETTER | SCHEDULE_A_CERT | MILITARY_SPOUSE_ORDERS"
      - name: verified
        type: boolean
        source: system
        description: "Set true by OPMDelegate verification."
        default: false
      - name: verified_by
        type: string
        source: system
        description: "X-User-ID of verifying OPMDelegate; null until verified."
      - name: verified_at
        type: datetime
        source: system
        description: "Verification timestamp; null until verified."

  - name: Application
    parent: JobAnnouncement
    common_fields: true
    fields:
      - name: announcement_id
        type: string
        source: input
        description: "FK -> JobAnnouncement.id; announcement applied to."
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the applicant."
      - name: submitted_at
        type: datetime
        source: system
        description: "Server logical-clock timestamp of submission; used for ranking tie-breaks (never id)."
      - name: claimed_experience_months
        type: integer
        source: input
        description: "Self-reported specialized experience months."
        constraints: ">= 0"
      - name: claimed_education_months
        type: integer
        source: input
        description: "Self-reported education months for substitution."
        constraints: ">= 0"
      - name: self_rating_knowledge
        type: integer
        source: input
        description: "Applicant self-assessment rating 1..5 (knowledge); feeds provisional score."
        constraints: "1 <= r <= 5"
      - name: self_rating_skill
        type: integer
        source: input
        description: "Applicant self-assessment rating 1..5 (skill)."
        constraints: "1 <= r <= 5"
      - name: self_rating_ability
        type: integer
        source: input
        description: "Applicant self-assessment rating 1..5 (ability)."
        constraints: "1 <= r <= 5"
      - name: provisional_score
        type: integer
        source: computed
        description: "SME-score formula applied to self ratings at submission; provisional variant, later superseded by SME technical_score."
      - name: provisional_category
        type: enum
        source: computed
        description: "Category from provisional_score and announcement cut points: BEST_QUALIFIED | WELL_QUALIFIED | QUALIFIED."
      - name: required_experience_months
        type: integer
        source: computed
        description: "quals_base_months + (official_grade - min_grade) * quals_months_per_grade_step, computed at screening."
      - name: creditable_experience_months
        type: integer
        source: computed
        description: "claimed_experience_months + (allows_education_substitution ? min(claimed_education_months, education_substitution_cap_months) : 0), computed at screening."
      - name: technical_score
        type: integer
        source: computed
        description: "Score from the ACCEPTED SME assessment; null until RATED."
      - name: quality_category
        type: enum
        source: computed
        description: "Category from technical_score and announcement cut points; null until RATED. UNRANKED announcements leave this null."
      - name: notified_at
        type: datetime
        source: system
        description: "Timestamp of the most recent determination notification (screen result or rating acceptance); appeal window anchor."
      - name: status
        type: enum
        source: system
        description: "State machine: RECEIVED | QUALIFIED | INELIGIBLE | RATED | REFERRED | SELECTED | NOT_SELECTED | HIRED | WITHDRAWN."

  - name: Assessment
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; application under SME review."
      - name: sme_user_id
        type: string
        source: system
        description: "X-User-ID of the SME author (opaque role id)."
      - name: rating_knowledge
        type: integer
        source: input
        description: "SME rating 1..5 for knowledge."
        constraints: "1 <= r <= 5"
      - name: rating_skill
        type: integer
        source: input
        description: "SME rating 1..5 for skill."
        constraints: "1 <= r <= 5"
      - name: rating_ability
        type: integer
        source: input
        description: "SME rating 1..5 for ability."
        constraints: "1 <= r <= 5"
      - name: technical_score
        type: integer
        source: computed
        description: "Computed at submit: 70 + sum of per-component round_half_up(w_i * r_i * 6, 0) with weights K=0.30, S=0.20, A=0.50."
      - name: quality_category
        type: enum
        source: computed
        description: "Category mapped from technical_score at submit using the announcement cut points."
      - name: return_reason
        type: string
        source: input
        description: "Reason supplied when HR returns the assessment."
        constraints: "optional"
      - name: status
        type: enum
        source: system
        description: "State machine: DRAFT | SUBMITTED | ACCEPTED | RETURNED (cyclic)."

  - name: Certificate
    parent: JobAnnouncement
    common_fields: true
    fields:
      - name: announcement_id
        type: string
        source: input
        description: "FK -> JobAnnouncement.id; announcement this certificate refers from."
      - name: issued_at
        type: datetime
        source: system
        description: "Issuance timestamp from the logical clock."
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + announcement.certificate_validity_days at issuance; increased by extensions. Certificate windows are CLOSED intervals [issued_at, expires_at] inclusive of both ends."
      - name: extension_count
        type: integer
        source: system
        description: "Number of extensions applied; max 2."
        default: 0
      - name: status
        type: enum
        source: system
        description: "State machine: ACTIVE | EXPIRED | RETURNED | CLOSED | CANCELLED."

  - name: CertificateEntry
    parent: Certificate
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: system
        description: "FK -> Certificate.id; owning certificate."
      - name: application_id
        type: string
        source: system
        description: "FK -> Application.id; referred application."
      - name: quality_category
        type: enum
        source: computed
        description: "Snapshot of application category at issuance: BEST_QUALIFIED | WELL_QUALIFIED | QUALIFIED; null for UNRANKED certificates."
      - name: preference_eligible
        type: boolean
        source: computed
        description: "Snapshot of applicant preference_verified at issuance."
      - name: preference_points
        type: integer
        source: computed
        description: "Snapshot of applicant preference_points at issuance (0, 5, or 10)."
      - name: augmented_score
        type: integer
        source: computed
        description: "technical_score + preference_points at issuance (CATEGORY_RATING); null for UNRANKED."
      - name: rank_position
        type: integer
        source: computed
        description: "1-based position on the certificate per certificate_ranking; fixed snapshot at issuance."
      - name: status
        type: enum
        source: system
        description: "State machine: REFERRED | SELECTED | PASSED_OVER | NOT_SELECTED."

  - name: PassOverRequest
    parent: CertificateEntry
    common_fields: true
    fields:
      - name: certificate_entry_id
        type: string
        source: input
        description: "FK -> CertificateEntry.id; the preference-eligible entry the official wants to pass over."
      - name: desired_entry_id
        type: string
        source: input
        description: "FK -> CertificateEntry.id; the lower-ranked entry the official wants to select instead."
      - name: reason_code
        type: enum
        source: input
        description: "Objection ground against the preference eligible."
        constraints: "one of INADEQUATE_EXPERIENCE | MISCONDUCT | OTHER"
      - name: justification
        type: string
        source: input
        description: "Free-text justification."
      - name: adjudicated_by
        type: string
        source: system
        description: "X-User-ID of adjudicating OPMDelegate."
      - name: status
        type: enum
        source: system
        description: "State machine: PENDING | APPROVED | DENIED."

  - name: Offer
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> Application.id; selected application."
      - name: certificate_entry_id
        type: string
        source: system
        description: "FK -> CertificateEntry.id; entry whose selection created this offer."
      - name: tentative_offered_at
        type: datetime
        source: system
        description: "Timestamp of tentative offer (selection time)."
      - name: response_due_at
        type: datetime
        source: computed
        description: "tentative_offered_at + OFFER_RESPONSE_DAYS (5); un-responded TENTATIVE offers expire at this instant."
      - name: responded_at
        type: datetime
        source: system
        description: "Timestamp of applicant response; null while TENTATIVE."
      - name: suitability_reviewer_id
        type: string
        source: system
        description: "X-User-ID of the SuitabilityReviewer who recorded the review; segregation-of-duties anchor."
      - name: eod_date
        type: datetime
        source: input
        description: "Scheduled entry-on-duty date; set by schedule-eod."
      - name: status
        type: enum
        source: system
        description: "State machine: TENTATIVE | ACCEPTED | DECLINED | OFFER_EXPIRED | EOD_SCHEDULED | ENTERED_ON_DUTY | RESCINDED."

  - name: SuitabilityReview
    parent: Offer
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; offer under suitability review."
      - name: reviewer_id
        type: string
        source: system
        description: "X-User-ID of the SuitabilityReviewer."
      - name: outcome
        type: enum
        source: input
        description: "Suitability determination."
        constraints: "one of FAVORABLE | UNFAVORABLE"
      - name: notes
        type: string
        source: input
        description: "Adjudication notes."
        constraints: "optional"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the determination."

  - name: SecurityClearance
    parent: Offer
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; offer under clearance adjudication."
      - name: adjudicator_id
        type: string
        source: system
        description: "X-User-ID of the SecurityAdjudicator; must differ from the offer's suitability_reviewer_id."
      - name: level_required
        type: enum
        source: system
        description: "Copied from position.sensitivity_level at creation."
        constraints: "one of NONE | SECRET | TOP_SECRET"
      - name: outcome
        type: enum
        source: input
        description: "Clearance adjudication result."
        constraints: "one of FAVORABLE_INTERIM | FAVORABLE_FINAL | UNFAVORABLE"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of adjudication."

  - name: Appeal
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; appealed application."
      - name: grounds
        type: enum
        source: input
        description: "Appeal ground; must match the application's current posture (QUALIFICATION only from INELIGIBLE, RATING only from RATED, PREFERENCE from RATED or INELIGIBLE)."
        constraints: "one of QUALIFICATION | RATING | PREFERENCE"
      - name: corrected_experience_months
        type: integer
        source: input
        description: "Corrected claimed experience months; required for QUALIFICATION appeals, used by re-screening on sustain."
        constraints: ">= 0; required iff grounds == QUALIFICATION"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock filing timestamp."
      - name: deadline_at
        type: datetime
        source: computed
        description: "application.notified_at + APPEAL_WINDOW_DAYS (14); filing at or after this instant is rejected."
      - name: adjudication_note
        type: string
        source: input
        description: "HR note recorded at adjudication."
        constraints: "optional"
      - name: status
        type: enum
        source: system
        description: "State machine: FILED | SUSTAINED | DENIED."

  - name: Appointment
    parent: Offer
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; offer consummated by this appointment."
      - name: appointment_type
        type: enum
        source: system
        description: "COMPETITIVE when announcement.hiring_authority == COMPETITIVE; DIRECT_HIRE for DIRECT_HIRE; SPECIAL_AUTHORITY otherwise."
        constraints: "one of COMPETITIVE | DIRECT_HIRE | SPECIAL_AUTHORITY"
      - name: eod_date
        type: datetime
        source: system
        description: "Copied from offer.eod_date at confirmation."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Position
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: CLASSIFIED
        trigger: "POST /hiring/positions/{id}/classify"
        actor: HRSpecialist
        preconditions:
          - "position.status == DRAFT"
        side_effects:
          - "run position_grade_determination (official variant = point_factor); set official_grade and total_points"
          - "fail with ERR_SERIES_GRADE_RANGE when official_grade is outside [series.min_grade, series.max_grade]"
        note: "provisional_grade (narrative variant) remains stored unchanged for comparison."
      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: "POST /hiring/positions/{id}/reclassifications"
        actor: HRSpecialist
        preconditions:
          - "position.status == CLASSIFIED"
          - "expected_position_version == position.version (OCC)"
        side_effects:
          - "run position_grade_determination (official variant) over the NEW factor levels in the payload; set official_grade, total_points, and the four factor_*_level fields"
          - "increments Position.version by 1"
          - "applications already screened are NOT re-screened; new required_experience_months applies only to screenings after this reclassification"
        note: "Self-loop re-grade; guarded by OCC so a stale factor view is rejected with ERR_STALE_VERSION."

  - entity: JobAnnouncement
    initial_state: DRAFT
    terminal_states: [FILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /hiring/announcements/{id}/open"
        actor: HiringManager
        preconditions:
          - "announcement.status == DRAFT"
          - "logical clock < announcement.close_at"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /hiring/announcements/{id}/close"
        actor: HiringManager
        preconditions:
          - "announcement.status == OPEN"
        side_effects: []
        note: "Applications are additionally gated by the clock at submission time; close() only flips the status."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /hiring/announcements/{id}/cancel"
        actor: HiringManager
        preconditions:
          - "announcement.status == DRAFT"
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /hiring/announcements/{id}/cancel"
        actor: HiringManager
        preconditions:
          - "announcement.status == OPEN"
        side_effects:
          - "every Application of this announcement in {RECEIVED, QUALIFIED, INELIGIBLE, RATED} transitions to WITHDRAWN"
      - from: CLOSED
        to: CANCELLED
        trigger: "POST /hiring/announcements/{id}/cancel"
        actor: HiringManager
        preconditions:
          - "announcement.status == CLOSED"
        side_effects:
          - "every Application of this announcement in {RECEIVED, QUALIFIED, RATED, REFERRED} transitions to WITHDRAWN"
          - "every Certificate of this announcement in ACTIVE transitions to CANCELLED"
          - "each cancelled Certificate cascades: every Offer created from its entries in {TENTATIVE, ACCEPTED, EOD_SCHEDULED} transitions to RESCINDED"
          - "each rescinded Offer cascades: its CertificateEntry transitions SELECTED -> NOT_SELECTED and JobAnnouncement.remaining_vacancies is recomputed (increases by 1 per rescinded offer)"
      - from: CERT_ISSUED
        to: CANCELLED
        trigger: "POST /hiring/announcements/{id}/cancel"
        actor: HiringManager
        preconditions:
          - "announcement.status == CERT_ISSUED"
        side_effects:
          - "same cascade as CLOSED -> CANCELLED"
      - from: CLOSED
        to: CERT_ISSUED
        trigger: "POST /hiring/announcements/{id}/certificates (first certificate issuance)"
        actor: system
        preconditions:
          - "announcement.status == CLOSED"
        side_effects:
          - "announcement.status becomes CERT_ISSUED"
      - from: CERT_ISSUED
        to: CERT_ISSUED
        trigger: "POST /hiring/announcements/{id}/certificates (re-issuance after prior certificate terminated)"
        actor: system
        preconditions:
          - "announcement.status == CERT_ISSUED"
        side_effects: []
      - from: CERT_ISSUED
        to: FILLED
        trigger: "system auto-transition when remaining_vacancies reaches 0"
        actor: system
        preconditions:
          - "announcement.status == CERT_ISSUED"
          - "remaining_vacancies == 0"
        side_effects: []
        note: "FILLED is terminal and does NOT recall or close an ACTIVE certificate: if remaining_vacancies later rises (offer declined/rescinded), the still-ACTIVE certificate remains selectable; new announcements are only needed once no ACTIVE certificate with REFERRED entries exists."

  - entity: Application
    initial_state: RECEIVED
    terminal_states: [HIRED, NOT_SELECTED, WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: QUALIFIED
        trigger: "POST /hiring/applications/{id}/screen"
        actor: HRSpecialist
        preconditions:
          - "application.status == RECEIVED"
          - "announcement.status in {OPEN, CLOSED, CERT_ISSUED}"
          - "qualification_determination yields creditable >= required AND (NOT series.positive_education_required OR claimed_education_months > 0)"
        side_effects:
          - "run qualification_determination; set required_experience_months and creditable_experience_months"
          - "set notified_at to logical clock"
      - from: RECEIVED
        to: INELIGIBLE
        trigger: "POST /hiring/applications/{id}/screen"
        actor: HRSpecialist
        preconditions:
          - "application.status == RECEIVED"
          - "qualification_determination yields creditable < required OR (series.positive_education_required AND claimed_education_months == 0)"
        side_effects:
          - "run qualification_determination; set required_experience_months and creditable_experience_months"
          - "set notified_at to logical clock"
      - from: QUALIFIED
        to: RATED
        trigger: "POST /hiring/assessments/{id}/accept (cascade from assessment acceptance)"
        actor: system
        preconditions:
          - "application.status == QUALIFIED"
          - "announcement.assessment_method == CATEGORY_RATING"
        side_effects:
          - "copy assessment.technical_score and assessment.quality_category onto the application"
          - "set notified_at to logical clock"
      - from: QUALIFIED
        to: REFERRED
        trigger: "POST /hiring/announcements/{id}/certificates (UNRANKED issuance cascade)"
        actor: system
        preconditions:
          - "application.status == QUALIFIED"
          - "announcement.assessment_method == UNRANKED"
          - "application is selected into the certificate roster"
        side_effects:
          - "create CertificateEntry for this application"
      - from: RATED
        to: REFERRED
        trigger: "POST /hiring/announcements/{id}/certificates (CATEGORY_RATING issuance cascade)"
        actor: system
        preconditions:
          - "application.status == RATED"
          - "application is selected into the certificate roster per certificate_roster_selection"
        side_effects:
          - "create CertificateEntry for this application"
      - from: REFERRED
        to: RATED
        trigger: "certificate RETURNED or EXPIRED (pool-return cascade)"
        actor: system
        preconditions:
          - "application.status == REFERRED"
          - "the certificate carrying this application transitioned to RETURNED or EXPIRED"
          - "announcement.assessment_method == CATEGORY_RATING"
        side_effects: []
        note: "Application returns to the rated pool and may be referred by a later certificate."
      - from: REFERRED
        to: QUALIFIED
        trigger: "certificate RETURNED or EXPIRED (pool-return cascade, UNRANKED)"
        actor: system
        preconditions:
          - "application.status == REFERRED"
          - "the certificate carrying this application transitioned to RETURNED or EXPIRED"
          - "announcement.assessment_method == UNRANKED"
        side_effects: []
      - from: REFERRED
        to: SELECTED
        trigger: "POST /hiring/certificates/{id}/selections"
        actor: SelectingOfficial
        preconditions:
          - "application.status == REFERRED"
          - "entry.status == REFERRED on an ACTIVE certificate"
          - "selection gates pass (no category bypass; pass-over approval present when required)"
        side_effects:
          - "entry.status becomes SELECTED"
          - "create Offer in TENTATIVE with tentative_offered_at = clock and response_due_at = clock + 5 days"
          - "JobAnnouncement.remaining_vacancies recomputed (decreases by 1)"
      - from: SELECTED
        to: NOT_SELECTED
        trigger: "offer DECLINED, OFFER_EXPIRED, or RESCINDED (cascade)"
        actor: system
        preconditions:
          - "application.status == SELECTED"
        side_effects:
          - "entry.status becomes NOT_SELECTED"
          - "JobAnnouncement.remaining_vacancies recomputed (increases by 1)"
      - from: SELECTED
        to: HIRED
        trigger: "POST /hiring/offers/{id}/confirm-eod (cascade)"
        actor: system
        preconditions:
          - "application.status == SELECTED"
          - "offer reached ENTERED_ON_DUTY"
        side_effects:
          - "create Appointment for the offer"
      - from: INELIGIBLE
        to: QUALIFIED
        trigger: "POST /hiring/appeals/{id}/adjudicate with outcome SUSTAINED on QUALIFICATION or PREFERENCE grounds (cascade re-screen)"
        actor: system
        preconditions:
          - "application.status == INELIGIBLE"
          - "re-run of qualification_determination with appeal.corrected_experience_months yields qualified"
        side_effects:
          - "claimed_experience_months replaced by appeal.corrected_experience_months"
          - "re-run qualification_determination; refresh required/creditable months and notified_at"
        note: "Cycle: an applicant can return from INELIGIBLE exactly once per sustained appeal."
      - from: INELIGIBLE
        to: INELIGIBLE
        trigger: "POST /hiring/appeals/{id}/adjudicate with outcome SUSTAINED on QUALIFICATION but re-screen still fails (cascade)"
        actor: system
        preconditions:
          - "application.status == INELIGIBLE"
          - "re-run of qualification_determination with corrected months still yields not qualified"
        side_effects:
          - "claimed_experience_months replaced by appeal.corrected_experience_months; re-run determination; refresh notified_at"
      - from: RATED
        to: QUALIFIED
        trigger: "POST /hiring/appeals/{id}/adjudicate with outcome SUSTAINED on RATING grounds (cascade)"
        actor: system
        preconditions:
          - "application.status == RATED"
          - "application is NOT referenced by any entry on an ACTIVE certificate"
        side_effects:
          - "the application's ACCEPTED assessment transitions to RETURNED with return_reason 'APPEAL_SUSTAINED'"
          - "application.technical_score and quality_category cleared to null"
          - "set notified_at to logical clock"
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "announcement CANCELLED (cascade)"
        actor: system
        preconditions: ["application.status == RECEIVED"]
        side_effects: []
      - from: QUALIFIED
        to: WITHDRAWN
        trigger: "announcement CANCELLED (cascade)"
        actor: system
        preconditions: ["application.status == QUALIFIED"]
        side_effects: []
      - from: INELIGIBLE
        to: WITHDRAWN
        trigger: "announcement CANCELLED from OPEN (cascade)"
        actor: system
        preconditions:
          - "application.status == INELIGIBLE"
          - "announcement transitioned OPEN -> CANCELLED"
        side_effects: []
      - from: RATED
        to: WITHDRAWN
        trigger: "announcement CANCELLED (cascade)"
        actor: system
        preconditions: ["application.status == RATED"]
        side_effects: []
      - from: REFERRED
        to: WITHDRAWN
        trigger: "announcement CANCELLED (cascade)"
        actor: system
        preconditions: ["application.status == REFERRED"]
        side_effects: []

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /hiring/assessments/{id}/submit"
        actor: SME
        preconditions:
          - "assessment.status == DRAFT"
          - "acting X-User-ID == assessment.sme_user_id"
        side_effects:
          - "run sme_technical_score; set technical_score and quality_category"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /hiring/assessments/{id}/accept"
        actor: HRSpecialist
        preconditions:
          - "assessment.status == SUBMITTED"
          - "application.status == QUALIFIED"
          - "no other ACCEPTED assessment exists for this application"
        side_effects:
          - "application transitions QUALIFIED -> RATED (cascade sets score/category/notified_at)"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /hiring/assessments/{id}/return"
        actor: HRSpecialist
        preconditions:
          - "assessment.status == SUBMITTED"
        side_effects:
          - "set return_reason from payload"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /hiring/assessments/{id}/submit (resubmission with updated ratings)"
        actor: SME
        preconditions:
          - "assessment.status == RETURNED"
          - "acting X-User-ID == assessment.sme_user_id"
        side_effects:
          - "replace the three rating fields with payload values"
          - "run sme_technical_score; refresh technical_score and quality_category"
        note: "Revision cycle: RETURNED -> SUBMITTED may repeat without bound; each resubmit recomputes the score."
      - from: ACCEPTED
        to: RETURNED
        trigger: "sustained RATING appeal (cascade)"
        actor: system
        preconditions:
          - "assessment.status == ACCEPTED"
        side_effects:
          - "set return_reason = 'APPEAL_SUSTAINED'"
          - "application cascades RATED -> QUALIFIED"

  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [EXPIRED, RETURNED, CLOSED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock >= expires_at (evaluated on any certificate read or certificate-scoped action)"
        actor: system
        preconditions:
          - "certificate.status == ACTIVE"
          - "logical clock >= certificate.expires_at"
        side_effects:
          - "every referenced application in REFERRED (via this certificate's entries with status REFERRED) returns to the pool: RATED pool for CATEGORY_RATING, QUALIFIED pool for UNRANKED"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /hiring/certificates/{id}/return"
        actor: SelectingOfficial
        preconditions:
          - "certificate.status == ACTIVE"
          - "no entry on this certificate has status SELECTED with an offer in {TENTATIVE, ACCEPTED, EOD_SCHEDULED}"
        side_effects:
          - "every entry with status REFERRED keeps its historical row; its application returns to the pool (REFERRED -> RATED for CATEGORY_RATING, -> QUALIFIED for UNRANKED)"
      - from: ACTIVE
        to: CLOSED
        trigger: "system auto-transition when the roster is exhausted"
        actor: system
        preconditions:
          - "certificate.status == ACTIVE"
          - "no entry of this certificate remains in REFERRED (every entry is SELECTED, PASSED_OVER, or NOT_SELECTED)"
        side_effects: []
        note: "Vacancy consumption alone does NOT close a certificate; an ACTIVE certificate with REFERRED entries stays selectable while remaining_vacancies > 0."
      - from: ACTIVE
        to: CANCELLED
        trigger: "announcement CANCELLED (cascade)"
        actor: system
        preconditions:
          - "certificate.status == ACTIVE"
        side_effects:
          - "offers in {TENTATIVE, ACCEPTED, EOD_SCHEDULED} created from this certificate's entries cascade to RESCINDED; those entries cascade SELECTED -> NOT_SELECTED; remaining_vacancies recomputed"

  - entity: CertificateEntry
    initial_state: REFERRED
    terminal_states: [PASSED_OVER, NOT_SELECTED]
    transitions:
      - from: REFERRED
        to: SELECTED
        trigger: "POST /hiring/certificates/{id}/selections"
        actor: SelectingOfficial
        preconditions:
          - "entry.status == REFERRED"
          - "certificate.status == ACTIVE"
        side_effects:
          - "application REFERRED -> SELECTED; Offer created in TENTATIVE; remaining_vacancies recomputed"
      - from: REFERRED
        to: PASSED_OVER
        trigger: "POST /hiring/pass-over-requests/{id}/adjudicate with outcome APPROVED (cascade)"
        actor: system
        preconditions:
          - "entry.status == REFERRED"
          - "an APPROVED PassOverRequest names this entry as certificate_entry_id"
        side_effects: []
      - from: SELECTED
        to: NOT_SELECTED
        trigger: "offer DECLINED / OFFER_EXPIRED / RESCINDED (cascade)"
        actor: system
        preconditions:
          - "entry.status == SELECTED"
        side_effects:
          - "JobAnnouncement.remaining_vacancies recomputed (increases by 1)"

  - entity: PassOverRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /hiring/pass-over-requests/{id}/adjudicate"
        actor: OPMDelegate
        preconditions:
          - "request.status == PENDING"
          - "payload outcome == APPROVED"
        side_effects:
          - "target entry (certificate_entry_id) transitions REFERRED -> PASSED_OVER"
          - "set adjudicated_by"
      - from: PENDING
        to: DENIED
        trigger: "POST /hiring/pass-over-requests/{id}/adjudicate"
        actor: OPMDelegate
        preconditions:
          - "request.status == PENDING"
          - "payload outcome == DENIED"
        side_effects:
          - "set adjudicated_by"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [SUSTAINED, DENIED]
    transitions:
      - from: FILED
        to: SUSTAINED
        trigger: "POST /hiring/appeals/{id}/adjudicate"
        actor: HRSpecialist
        preconditions:
          - "appeal.status == FILED"
          - "payload outcome == SUSTAINED"
        side_effects:
          - "QUALIFICATION or PREFERENCE grounds: replace application.claimed_experience_months with corrected_experience_months and re-run qualification_determination (INELIGIBLE -> QUALIFIED when the re-screen passes)"
          - "RATING grounds: the application's ACCEPTED assessment transitions ACCEPTED -> RETURNED (return_reason 'APPEAL_SUSTAINED') and the application RATED -> QUALIFIED"
          - "set adjudication fields"
      - from: FILED
        to: DENIED
        trigger: "POST /hiring/appeals/{id}/adjudicate"
        actor: HRSpecialist
        preconditions:
          - "appeal.status == FILED"
          - "payload outcome == DENIED"
        side_effects:
          - "no cascade: the application is left untouched"

  - entity: Offer
    initial_state: TENTATIVE
    terminal_states: [DECLINED, OFFER_EXPIRED, RESCINDED, ENTERED_ON_DUTY]
    transitions:
      - from: TENTATIVE
        to: ACCEPTED
        trigger: "POST /hiring/offers/{id}/respond"
        actor: Applicant
        preconditions:
          - "offer.status == TENTATIVE"
          - "acting X-User-ID == offer.application.applicant_id"
          - "logical clock < offer.response_due_at"
          - "payload response == ACCEPT"
        side_effects:
          - "set responded_at"
      - from: TENTATIVE
        to: DECLINED
        trigger: "POST /hiring/offers/{id}/respond"
        actor: Applicant
        preconditions:
          - "offer.status == TENTATIVE"
          - "acting X-User-ID == offer.application.applicant_id"
          - "logical clock < offer.response_due_at"
          - "payload response == DECLINE"
        side_effects:
          - "set responded_at"
          - "application SELECTED -> NOT_SELECTED; entry SELECTED -> NOT_SELECTED; remaining_vacancies +1 (cascade chain)"
      - from: TENTATIVE
        to: OFFER_EXPIRED
        trigger: "system: logical clock >= response_due_at (evaluated on any offer read or offer-scoped action)"
        actor: system
        preconditions:
          - "offer.status == TENTATIVE"
          - "logical clock >= offer.response_due_at"
        side_effects:
          - "application SELECTED -> NOT_SELECTED; entry SELECTED -> NOT_SELECTED; remaining_vacancies +1 (cascade chain)"
      - from: ACCEPTED
        to: EOD_SCHEDULED
        trigger: "POST /hiring/offers/{id}/schedule-eod"
        actor: SelectingOfficial
        preconditions:
          - "offer.status == ACCEPTED"
          - "a SuitabilityReview with outcome FAVORABLE exists for this offer"
          - "clearance gate: position.sensitivity_level == NONE, OR (== SECRET AND a SecurityClearance with outcome in {FAVORABLE_INTERIM, FAVORABLE_FINAL} exists), OR (== TOP_SECRET AND a SecurityClearance with outcome == FAVORABLE_FINAL exists)"
          - "payload eod_date >= current logical clock date"
        side_effects:
          - "set eod_date"
      - from: EOD_SCHEDULED
        to: ENTERED_ON_DUTY
        trigger: "POST /hiring/offers/{id}/confirm-eod"
        actor: HRSpecialist
        preconditions:
          - "offer.status == EOD_SCHEDULED"
          - "logical clock >= offer.eod_date"
          - "suitability and clearance gates re-validated (same rule as schedule-eod)"
        side_effects:
          - "application SELECTED -> HIRED"
          - "create Appointment (appointment_type derived from announcement.hiring_authority); Appointment.eod_date = offer.eod_date"
      - from: ACCEPTED
        to: RESCINDED
        trigger: "SuitabilityReview recorded with outcome UNFAVORABLE (cascade) OR SecurityClearance recorded with outcome UNFAVORABLE (cascade)"
        actor: system
        preconditions:
          - "offer.status == ACCEPTED"
        side_effects:
          - "application SELECTED -> NOT_SELECTED; entry SELECTED -> NOT_SELECTED; remaining_vacancies +1 (cascade chain)"
      - from: EOD_SCHEDULED
        to: RESCINDED
        trigger: "announcement CANCELLED (cascade)"
        actor: system
        preconditions:
          - "offer.status == EOD_SCHEDULED"
        side_effects:
          - "application SELECTED -> NOT_SELECTED; entry SELECTED -> NOT_SELECTED; remaining_vacancies +1 (cascade chain)"
      - from: TENTATIVE
        to: RESCINDED
        trigger: "announcement CANCELLED (cascade)"
        actor: system
        preconditions:
          - "offer.status == TENTATIVE"
        side_effects:
          - "application SELECTED -> NOT_SELECTED; entry SELECTED -> NOT_SELECTED; remaining_vacancies +1 (cascade chain)"
      - from: ACCEPTED
        to: RESCINDED
        trigger: "announcement CANCELLED (cascade)"
        actor: system
        preconditions:
          - "offer.status == ACCEPTED"
        side_effects:
          - "application SELECTED -> NOT_SELECTED; entry SELECTED -> NOT_SELECTED; remaining_vacancies +1 (cascade chain)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: reclassify-stale-position
    parent_entity: Position
    write_endpoint: "POST /hiring/positions/{id}/reclassifications"
    occ_field: expected_position_version
    description: |
      Reclassifying a Position whose version has advanced since the client last
      observed it is rejected. A reclassification legitimately supersedes the
      prior classification under the point-factor rule, so a client holding a
      stale factor view must refresh before re-grading.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: certificate-extend-stale-certificate
    parent_entity: Certificate
    write_endpoint: "POST /hiring/certificates/{id}/extend"
    occ_field: expected_certificate_version
    description: |
      Extending a Certificate whose version has advanced since the client last
      observed it is rejected. Extensions legitimately stack (each moves
      expires_at later), so a client extending from a stale expires_at view
      must refresh before extending again.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: position_grade_determination
    trigger: "position creation (provisional variant); POST classify and POST reclassifications (official variant)"
    algorithm: threshold
    formula: |
      FACTOR_WEIGHTS = { knowledge: 300, supervision: 200, complexity: 250, impact: 250 }
      total_points = 300*K + 200*S + 250*C + 250*I   (K,S,C,I = the four factor levels, each 1..5)
      GRADE_BANDS (inclusive both ends):
        5:  [1000,1599]   7:  [1600,2199]   9:  [2200,2799]   11: [2800,3399]
        12: [3400,3899]   13: [3900,4299]   14: [4300,4699]   15: [4700,5000]
      official_grade = band containing total_points (bands partition [1000,5000]; total always >= 1000)
      official variant fails with ERR_SERIES_GRADE_RANGE when official_grade not in [series.min_grade, series.max_grade]
    input_set: "the four factor_*_level fields of the Position"
    constants:
      WEIGHT_KNOWLEDGE: 300
      WEIGHT_SUPERVISION: 200
      WEIGHT_COMPLEXITY: 250
      WEIGHT_IMPACT: 250
    precision: "integers only; no rounding"
    variants:
      - name: narrative_provisional
        when: "always computed at DRAFT (and recomputed on reclassification preview); exposed as provisional_grade"
        difference: "LEVEL_GRADE_CAP = {1:5, 2:7, 3:9, 4:11, 5:13}; provisional_grade = min over the four factors of LEVEL_GRADE_CAP[level]; identical factor inputs can yield a different grade than the point-factor official variant (e.g. levels (3,3,3,3) -> provisional 9 but official 11; (5,1,1,1) -> provisional 5 but official 9)"
      - name: point_factor_official
        when: "on classify / reclassify; exposed as official_grade"
        difference: "band lookup over total_points; authoritative for announcements and qualification screening"

  - name: qualification_determination
    trigger: "POST /hiring/applications/{id}/screen; appeal-sustained re-screen"
    algorithm: threshold
    formula: |
      grade = position.official_grade
      required = series.quals_base_months + (grade - series.min_grade) * series.quals_months_per_grade_step
      education_credit = min(application.claimed_education_months, series.education_substitution_cap_months)
                         if series.allows_education_substitution else 0
      creditable = application.claimed_experience_months + education_credit
      QUALIFIED iff creditable >= required
                   AND (NOT series.positive_education_required OR application.claimed_education_months > 0)
      else INELIGIBLE
      Evaluation order is pinned: official_grade FIRST (position must be CLASSIFIED),
      then required, then education_credit, then creditable, then the two conjuncts.
    input_set: "the screened Application; its JobAnnouncement's Position (must be CLASSIFIED); the Position's OccupationalSeries"
    constants:
      BOUNDARY_RULE: "creditable == required is QUALIFIED (>=, not >)"
    precision: "integer months; no rounding"
    variants: []

  - name: sme_technical_score
    trigger: "POST /hiring/assessments/{id}/submit (create-resubmit included); application provisional_score uses the same formula over self ratings at submission"
    algorithm: weighted_scoring
    formula: |
      WEIGHTS = { knowledge: 0.30, skill: 0.20, ability: 0.50 }; SCALE = 6
      comp_k = round_half_up(0.30 * r_k * 6, 0)   # per-component round to integer FIRST
      comp_s = round_half_up(0.20 * r_s * 6, 0)
      comp_a = round_half_up(0.50 * r_a * 6, 0)
      technical_score = 70 + comp_k + comp_s + comp_a    # sum of rounded components
      RANGE: r in 1..5 each -> score in [76, 100]
      PINNED ORDER: round per component, THEN sum, THEN add 70.
      Sum-then-round is a DIFFERENT result for some inputs (e.g. (3,1,1): pinned 79 vs sum-then-round 80;
      (1,3,1): pinned 79 vs sum-then-round 78) — only the pinned order is correct.
    input_set: "one assessment's three rating fields (or an application's three self_rating fields for the provisional variant)"
    constants:
      WEIGHT_KNOWLEDGE: 0.30
      WEIGHT_SKILL: 0.20
      WEIGHT_ABILITY: 0.50
      SCALE: 6
      BASE: 70
    precision: "round_half_up to integer per component; final score integer"
    variants:
      - name: provisional_self_assessed
        when: "at application submission; stored as application.provisional_score"
        difference: "same formula over self_rating_* fields; identical weighting but self-reported inputs, so the provisional score routinely differs from the later SME technical_score for the same application"
      - name: certified_sme
        when: "at assessment submit; stored as assessment.technical_score and copied to the application on accept"
        difference: "same formula over SME rating_* fields; authoritative for category assignment and certificate ranking"

  - name: category_assignment
    trigger: "assessment submit (assessment.quality_category); application submission (provisional_category); application accept cascade (application.quality_category)"
    algorithm: threshold
    formula: |
      score >= announcement.bq_cut  -> BEST_QUALIFIED
      announcement.wq_cut <= score < announcement.bq_cut -> WELL_QUALIFIED
      score < announcement.wq_cut -> QUALIFIED
      Boundaries are >= inclusive at both cut points.
      Category uses the RAW technical_score; veterans preference points NEVER affect the category.
    input_set: "a score and the announcement's bq_cut / wq_cut"
    constants:
      DEFAULT_BQ_CUT: 95
      DEFAULT_WQ_CUT: 85
    precision: "integer scores; no rounding"
    variants: []

  - name: certificate_roster_selection
    trigger: "POST /hiring/announcements/{id}/certificates"
    algorithm: threshold
    formula: |
      CATEGORY_RATING announcements:
        candidates = applications of the announcement with status == RATED
        category_rank = { BEST_QUALIFIED: 3, WELL_QUALIFIED: 2, QUALIFIED: 1 }
        H = highest category_rank present among candidates
        roster = all candidates with category_rank == H
        while |roster| < RULE_OF_MANY_MIN and a lower non-empty category exists:
            merge the next lower category into roster (whole category, never a partial category)
        if final |roster| < RULE_OF_MANY_MIN -> fail issuance with ERR_INSUFFICIENT_ELIGIBLES
      UNRANKED announcements (DIRECT_HIRE etc.):
        roster = ALL applications with status == QUALIFIED; no categories, no scores;
        RULE_OF_MANY_MIN does not apply (empty roster fails with ERR_INSUFFICIENT_ELIGIBLES)
      Every roster application transitions to REFERRED and gains a CertificateEntry.
    input_set: "applications of the announcement filtered by status; categories from category_assignment"
    constants:
      RULE_OF_MANY_MIN: 3
    precision: "integer counts; no rounding"
    variants: []

  - name: certificate_ranking
    trigger: "certificate issuance (rank_position snapshot on each CertificateEntry)"
    algorithm: chronological
    formula: |
      CATEGORY_RATING entries, ordered by this lexicographic key (all comparisons DESC unless noted):
        1. category_rank (BEST_QUALIFIED=3 > WELL_QUALIFIED=2 > QUALIFIED=1)
        2. CPS_FLOAT: entry is TEN_POINT_CPS AND preference_eligible -> floats to top of its category
        3. preference group: preference_eligible == true ranks before false within the category
        4. augmented_score = technical_score + preference_points
        5. application.submitted_at ASC (earlier submission wins; NEVER id)
      rank_position = 1-based position in this ordering.
      UNRANKED entries: order by application.submitted_at ASC only; rank_position assigned accordingly.
    input_set: "the roster entries created by certificate_roster_selection"
    constants:
      CPS_FLOAT: "verified TEN_POINT_CPS entries precede all others within their category"
    precision: "integer positions; deterministic total order (ties broken by submitted_at, then never needed further)"
    variants: []

  - name: certificate_expiry
    trigger: "any certificate read or certificate-scoped action; certificate extend"
    algorithm: threshold
    formula: |
      base expiry at issuance: expires_at = issued_at + announcement.certificate_validity_days (days)
      extension: expires_at += additional_days; extension_count += 1; extension_count must stay <= MAX_EXTENSIONS
      certificate is EXPIRED when logical clock >= expires_at (>= inclusive: at exactly expires_at it is expired)
    input_set: "the Certificate row and the logical clock"
    constants:
      MAX_EXTENSIONS: 2
      EXTENSION_MAX_DAYS: 30
    precision: "datetime; no rounding"
    variants: []

  - name: appeal_window
    trigger: "POST /hiring/applications/{id}/appeals"
    algorithm: threshold
    formula: |
      deadline_at = application.notified_at + APPEAL_WINDOW_DAYS (14 days)
      filing is timely iff logical clock < deadline_at (STRICTLY less: filing at exactly deadline_at is late)
    input_set: "the Application row and the logical clock"
    constants:
      APPEAL_WINDOW_DAYS: 14
    precision: "datetime; no rounding"
    variants: []

  - name: offer_response_window
    trigger: "any offer read or offer-scoped action"
    algorithm: threshold
    formula: |
      response_due_at = tentative_offered_at + OFFER_RESPONSE_DAYS (5 days)
      offer is OFFER_EXPIRED when logical clock >= response_due_at (>= inclusive)
    input_set: "the Offer row and the logical clock"
    constants:
      OFFER_RESPONSE_DAYS: 5
    precision: "datetime; no rounding"
    variants: []

  - name: remaining_vacancies_recompute
    trigger: "selection; offer DECLINED / OFFER_EXPIRED / RESCINDED; any vacancy-consuming cascade"
    algorithm: aggregation
    formula: |
      remaining_vacancies = announcement.vacancies_count
        - count(CertificateEntry ce
                JOIN Offer o ON o.certificate_entry_id = ce.id
                JOIN Application ap ON ap.id = ce.application_id
                WHERE ap.announcement_id == announcement.id
                  AND ce.status == SELECTED
                  AND o.status IN {TENTATIVE, ACCEPTED, EOD_SCHEDULED, ENTERED_ON_DUTY})
      Recomputed immediately on every contributing mutation (consistency_model: immediate).
    input_set: "all certificate entries whose application belongs to the announcement, with their offers"
    constants: {}
    precision: "integer count"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins when a
#     request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles; entity-backed ownership rules (Applicant acts only on own applications/offers/appeals/documents; SME acts only on own assessments)."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request body shape: required fields present, types correct, enum values in range, numeric ranges honored (e.g. 1<=rating<=5, close_at>open_at, 30<=certificate_validity_days<=90, wq_cut<bq_cut)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every id in the path and every FK id in the body resolves to an existing entity, validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Generic state-machine precondition: the target resource is in a state from which the requested transition exists."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: state
    check: "Application submission requires announcement.status == OPEN."
    error_id: ERR_ANNOUNCEMENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /hiring/announcements/{id}/applications"
  - priority: 5
    category: state
    check: "Certificate issuance requires announcement.status in {CLOSED, CERT_ISSUED}."
    error_id: ERR_ANNOUNCEMENT_NOT_CLOSED
    http_status: 409
    applies_to: "POST /hiring/announcements/{id}/certificates"
  - priority: 5
    category: state
    check: "Certificate-scoped actions (selections, return, extend, pass-over on its entries) require certificate.status == ACTIVE."
    error_id: ERR_CERTIFICATE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /hiring/certificates/{id}/selections; POST /hiring/certificates/{id}/return; POST /hiring/certificates/{id}/extend; POST /hiring/entries/{id}/pass-over-requests"
  - priority: 5
    category: state
    check: "Offer-scoped actions require the specific from-state: respond needs TENTATIVE; schedule-eod needs ACCEPTED; confirm-eod needs EOD_SCHEDULED; suitability review needs ACCEPTED; clearance needs ACCEPTED with favorable suitability."
    error_id: ERR_OFFER_NOT_ACTIONABLE
    http_status: 409
    applies_to: "POST /hiring/offers/{id}/respond; POST /hiring/offers/{id}/schedule-eod; POST /hiring/offers/{id}/confirm-eod; POST /hiring/offers/{id}/suitability-reviews; POST /hiring/offers/{id}/security-clearances"
  - priority: 5
    category: state
    check: "Assessment accept/return require SUBMITTED; submit requires DRAFT or RETURNED."
    error_id: ERR_ASSESSMENT_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /hiring/assessments/{id}/accept; POST /hiring/assessments/{id}/return; POST /hiring/assessments/{id}/submit"
  - priority: 5
    category: state
    check: "Pass-over adjudication requires PENDING."
    error_id: ERR_PASS_OVER_NOT_PENDING
    http_status: 409
    applies_to: "POST /hiring/pass-over-requests/{id}/adjudicate"
  - priority: 5
    category: state
    check: "Appeal adjudication requires FILED; appeal filing requires application.status in {INELIGIBLE, RATED} and (for RATING grounds) not referenced by an ACTIVE certificate."
    error_id: ERR_APPEAL_NOT_ALLOWED_STATE
    http_status: 409
    applies_to: "POST /hiring/applications/{id}/appeals; POST /hiring/appeals/{id}/adjudicate"
  - priority: 5
    category: state
    check: "Screening requires application.status == RECEIVED; assessment creation requires application.status == QUALIFIED."
    error_id: ERR_APPLICATION_WRONG_STATE
    http_status: 409
    applies_to: "POST /hiring/applications/{id}/screen; POST /hiring/applications/{id}/assessments"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: the SecurityAdjudicator X-User-ID must differ from the offer's suitability_reviewer_id; also the SuitabilityReviewer must differ from any prior clearance adjudicator on the same offer."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /hiring/offers/{id}/suitability-reviews; POST /hiring/offers/{id}/security-clearances"
  - priority: 6
    category: business_safety
    check: "Schedule-eod and confirm-eod require a FAVORABLE suitability review on file; security clearance creation requires a FAVORABLE suitability review already on file (suitability precedes clearance)."
    error_id: ERR_SUITABILITY_NOT_FAVORABLE
    http_status: 422
    applies_to: "POST /hiring/offers/{id}/schedule-eod; POST /hiring/offers/{id}/confirm-eod; POST /hiring/offers/{id}/security-clearances"
  - priority: 6
    category: business_safety
    check: "Schedule-eod and confirm-eod require the clearance gate: NONE -> no record needed; SECRET -> FAVORABLE_INTERIM or FAVORABLE_FINAL; TOP_SECRET -> FAVORABLE_FINAL only."
    error_id: ERR_CLEARANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /hiring/offers/{id}/schedule-eod; POST /hiring/offers/{id}/confirm-eod"
  - priority: 7
    category: business_constraint
    check: "One application per applicant per announcement (unique on (announcement_id, applicant_id))."
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /hiring/announcements/{id}/applications"
  - priority: 7
    category: business_constraint
    check: "At most one assessment in {DRAFT, SUBMITTED} per application; at most one ACCEPTED assessment per application."
    error_id: ERR_ACTIVE_ASSESSMENT_EXISTS
    http_status: 409
    applies_to: "POST /hiring/applications/{id}/assessments; POST /hiring/assessments/{id}/accept"
  - priority: 7
    category: business_constraint
    check: "Open periods of announcements of the SAME position must not overlap under HALF-OPEN semantics [open_at, close_at): adjacency is allowed (new open_at == existing close_at is NOT a conflict)."
    error_id: ERR_ANNOUNCEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /hiring/positions/{id}/announcements"
  - priority: 7
    category: business_constraint
    check: "Certificate windows of the SAME announcement must be strictly disjoint under CLOSED-interval semantics [issued_at, expires_at] inclusive: a new issuance whose issued_at <= any prior certificate's expires_at conflicts (adjacency IS a conflict, unlike announcement periods). Cancelled certificates' windows still count."
    error_id: ERR_CERTIFICATE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /hiring/announcements/{id}/certificates"
  - priority: 7
    category: business_constraint
    check: "No certificate issuance while another certificate of the same announcement is ACTIVE. When this and the window-overlap rule both fail (an ACTIVE certificate always overlaps its own window), ERR_ACTIVE_CERTIFICATE_EXISTS takes precedence."
    error_id: ERR_ACTIVE_CERTIFICATE_EXISTS
    http_status: 409
    applies_to: "POST /hiring/announcements/{id}/certificates"
  - priority: 7
    category: business_constraint
    check: "Roster must satisfy certificate_roster_selection: CATEGORY_RATING needs >= RULE_OF_MANY_MIN (3) after category merging; UNRANKED needs >= 1 QUALIFIED application."
    error_id: ERR_INSUFFICIENT_ELIGIBLES
    http_status: 422
    applies_to: "POST /hiring/announcements/{id}/certificates"
  - priority: 7
    category: business_constraint
    check: "Selection category gate (CATEGORY_RATING certificates only; UNRANKED certificates carry no categories and bypass this gate entirely): may not select an entry while a REFERRED entry in a strictly higher category exists on the same certificate (pass-over cannot cure a category bypass)."
    error_id: ERR_CATEGORY_BYPASS
    http_status: 422
    applies_to: "POST /hiring/certificates/{id}/selections"
  - priority: 7
    category: business_constraint
    check: "Selection preference gate (CATEGORY_RATING certificates only; UNRANKED selection has no preference ordering gate): may not select a non-preference-eligible entry while a REFERRED preference-eligible entry with a smaller rank_position exists in the SAME category, unless an APPROVED PassOverRequest covers that (target, desired) pair."
    error_id: ERR_PASS_OVER_REQUIRED
    http_status: 422
    applies_to: "POST /hiring/certificates/{id}/selections"
  - priority: 7
    category: business_constraint
    check: "At most one SuitabilityReview per offer and at most one SecurityClearance per offer."
    error_id: ERR_REVIEW_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /hiring/offers/{id}/suitability-reviews; POST /hiring/offers/{id}/security-clearances"
  - priority: 7
    category: business_constraint
    check: "Assessments exist only for CATEGORY_RATING announcements; creating an assessment for an application of an UNRANKED announcement is rejected."
    error_id: ERR_ASSESSMENT_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /hiring/applications/{id}/assessments"
  - priority: 7
    category: business_constraint
    check: "Pass-over request target must be preference_eligible with rank_position < desired entry's rank_position; desired entry must not be preference_eligible."
    error_id: ERR_NOT_PREFERENCE_ELIGIBLE
    http_status: 422
    applies_to: "POST /hiring/entries/{id}/pass-over-requests"
  - priority: 7
    category: business_constraint
    check: "Certificate extension_count must stay <= 2 and additional_days in 1..30."
    error_id: ERR_EXTENSION_LIMIT
    http_status: 422
    applies_to: "POST /hiring/certificates/{id}/extend"
  - priority: 7
    category: business_constraint
    check: "Selection requires announcement.remaining_vacancies > 0."
    error_id: ERR_NO_REMAINING_VACANCIES
    http_status: 409
    applies_to: "POST /hiring/certificates/{id}/selections"
  - priority: 7
    category: business_constraint
    check: "Uniqueness of natural keys: OccupationalSeries.series_code, JobAnnouncement.announcement_number, Applicant.email."
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /hiring/series; POST /hiring/positions/{id}/announcements; POST /hiring/applicants"
  - priority: 7
    category: business_constraint
    check: "Appeal grounds must match posture: QUALIFICATION only from INELIGIBLE; RATING only from RATED; PREFERENCE from INELIGIBLE or RATED."
    error_id: ERR_APPEAL_GROUND_MISMATCH
    http_status: 422
    applies_to: "POST /hiring/applications/{id}/appeals"
  - priority: 7
    category: business_constraint
    check: "Classify/reclassify grade must fall inside [series.min_grade, series.max_grade]."
    error_id: ERR_SERIES_GRADE_RANGE
    http_status: 422
    applies_to: "POST /hiring/positions/{id}/classify; POST /hiring/positions/{id}/reclassifications"
  - priority: 7
    category: business_constraint
    check: "Announcement authority/method coherence: COMPETITIVE requires CATEGORY_RATING; DIRECT_HIRE requires UNRANKED; VEOA/SCHEDULE_A/NONCOMPETITIVE_SPOUSE may use either."
    error_id: ERR_AUTHORITY_METHOD_MISMATCH
    http_status: 422
    applies_to: "POST /hiring/positions/{id}/announcements"
  - priority: 8
    category: business_temporal
    check: "Application submission requires logical clock in [open_at, close_at): at exactly open_at accepted; at exactly close_at rejected."
    error_id: ERR_OUTSIDE_OPEN_PERIOD
    http_status: 422
    applies_to: "POST /hiring/announcements/{id}/applications"
  - priority: 8
    category: business_temporal
    check: "Appeal filing requires logical clock < appeal deadline_at (notified_at + 14 days); filing at exactly deadline_at is late."
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /hiring/applications/{id}/appeals"
  - priority: 8
    category: business_temporal
    check: "Offer response requires logical clock < response_due_at. On POST respond the temporal check evaluates the stored TENTATIVE offer against the clock BEFORE any state evaluation: TENTATIVE + clock >= response_due_at -> ERR_OFFER_RESPONSE_EXPIRED (and the offer flips to OFFER_EXPIRED with its cascade); an already non-TENTATIVE offer instead fails the priority-5 state check with ERR_OFFER_NOT_ACTIONABLE regardless of the clock."
    error_id: ERR_OFFER_RESPONSE_EXPIRED
    http_status: 409
    applies_to: "POST /hiring/offers/{id}/respond"
  - priority: 8
    category: business_temporal
    check: "Schedule-eod eod_date must be >= current logical clock date; confirm-eod requires logical clock >= eod_date."
    error_id: ERR_EOD_DATE_INVALID
    http_status: 422
    applies_to: "POST /hiring/offers/{id}/schedule-eod; POST /hiring/offers/{id}/confirm-eod"
  - priority: 9
    category: business_referential
    check: "Announcement creation requires position.status == CLASSIFIED."
    error_id: ERR_POSITION_NOT_CLASSIFIED
    http_status: 422
    applies_to: "POST /hiring/positions/{id}/announcements"
  - priority: 9
    category: business_referential
    check: "Area of consideration: ALL_US_CITIZENS needs is_us_citizen; STATUS_CANDIDATES additionally needs is_current_federal_employee or a verified preference; AGENCY_ONLY additionally needs applicant.agency_code == position.org_code."
    error_id: ERR_OUTSIDE_AREA_OF_CONSIDERATION
    http_status: 422
    applies_to: "POST /hiring/announcements/{id}/applications"
  - priority: 9
    category: business_referential
    check: "Non-COMPETITIVE authorities require a verified eligibility document of the mapped type at application time: DIRECT_HIRE -> none beyond preference rules (DD214/VA_LETTER as claimed); VEOA -> DD214; SCHEDULE_A -> SCHEDULE_A_CERT; NONCOMPETITIVE_SPOUSE -> MILITARY_SPOUSE_ORDERS."
    error_id: ERR_ELIGIBILITY_DOC_REQUIRED
    http_status: 422
    applies_to: "POST /hiring/announcements/{id}/applications"
  - priority: 5
    category: state
    check: "Roster-pending posture: a PENDING PassOverRequest naming a higher-ranked REFERRED preference-eligible entry blocks selections of lower-ranked entries on the same certificate until adjudicated (adjudication to APPROVED or DENIED clears the block)."
    error_id: ERR_PASS_OVER_PENDING
    http_status: 409
    applies_to: "POST /hiring/certificates/{id}/selections"
  - priority: 10
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /hiring/positions/{id}/reclassifications; POST /hiring/certificates/{id}/extend"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/hiring/series"
    description: "Create an occupational series with its qualification standard."
    roles: [HRSpecialist]
    code: 201
    input: [series_code, title, min_grade, max_grade, quals_base_months, quals_months_per_grade_step, allows_education_substitution, education_substitution_cap_months, positive_education_required]
    output: OccupationalSeries
    side_effects: []
  - method: GET
    path: "/hiring/series/{id}"
    description: "Read one occupational series."
    roles: [HRSpecialist, HiringManager]
    code: 200
    input: []
    output: OccupationalSeries
    side_effects: []
  - method: GET
    path: "/hiring/series/{id}/positions"
    description: "List positions classified under a series (FK reverse for Position.series_id)."
    roles: [HRSpecialist, HiringManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Position[]
    side_effects: []
  - method: POST
    path: "/hiring/positions"
    description: "Create a position in DRAFT with factor levels; provisional_grade (narrative variant) computed immediately."
    roles: [HiringManager]
    code: 201
    input: [series_id, title, org_code, factor_knowledge_level, factor_supervision_level, factor_complexity_level, factor_impact_level, sensitivity_level]
    output: Position
    side_effects: ["compute provisional_grade and total_points (position_grade_determination)"]
  - method: GET
    path: "/hiring/positions/{id}"
    description: "Read one position."
    roles: [HRSpecialist, HiringManager, SelectingOfficial]
    code: 200
    input: []
    output: Position
    side_effects: []
  - method: POST
    path: "/hiring/positions/{id}/classify"
    description: "DRAFT -> CLASSIFIED; computes official_grade via point-factor variant; fails when the grade falls outside the series range."
    roles: [HRSpecialist]
    code: 200
    input: []
    output: Position
    side_effects: ["run position_grade_determination (official); increments Position.version by 1"]
  - method: POST
    path: "/hiring/positions/{id}/reclassifications"
    description: "CLASSIFIED -> CLASSIFIED re-grade with new factor levels; OCC-guarded on Position.version."
    roles: [HRSpecialist]
    code: 200
    input: [factor_knowledge_level, factor_supervision_level, factor_complexity_level, factor_impact_level, expected_position_version]
    output: Position
    side_effects: ["run position_grade_determination (official) over new levels", "increments Position.version by 1"]
  - method: POST
    path: "/hiring/positions/{id}/announcements"
    description: "Create a job announcement for a CLASSIFIED position; open period must not overlap sibling announcements (half-open semantics)."
    roles: [HiringManager]
    code: 201
    input: [announcement_number, area_of_consideration, hiring_authority, assessment_method, open_at, close_at, vacancies_count, "bq_cut?", "wq_cut?", "certificate_validity_days?"]
    output: JobAnnouncement
    side_effects: []
  - method: GET
    path: "/hiring/announcements/{id}"
    description: "Read one announcement (includes computed remaining_vacancies)."
    roles: [HRSpecialist, HiringManager, SelectingOfficial, OPMDelegate, Applicant, SME]
    code: 200
    input: []
    output: JobAnnouncement
    side_effects: []
  - method: GET
    path: "/hiring/positions/{id}/announcements"
    description: "List announcements of a position (FK reverse for JobAnnouncement.position_id)."
    roles: [HRSpecialist, HiringManager, SelectingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: JobAnnouncement[]
    side_effects: []
  - method: POST
    path: "/hiring/announcements/{id}/open"
    description: "DRAFT -> OPEN."
    roles: [HiringManager]
    code: 200
    input: []
    output: JobAnnouncement
    side_effects: ["increments JobAnnouncement.version by 1"]
  - method: POST
    path: "/hiring/announcements/{id}/close"
    description: "OPEN -> CLOSED."
    roles: [HiringManager]
    code: 200
    input: []
    output: JobAnnouncement
    side_effects: ["increments JobAnnouncement.version by 1"]
  - method: POST
    path: "/hiring/announcements/{id}/cancel"
    description: "DRAFT|OPEN|CLOSED|CERT_ISSUED -> CANCELLED with the full cancellation cascade (applications WITHDRAWN, certificates CANCELLED, offers RESCINDED, entries NOT_SELECTED, remaining_vacancies recomputed)."
    roles: [HiringManager]
    code: 200
    input: []
    output: JobAnnouncement
    side_effects: ["announcement cancellation cascade per state machine", "increments JobAnnouncement.version by 1"]
  - method: GET
    path: "/hiring/announcements/{id}/applications"
    description: "List applications to an announcement (FK reverse for Application.announcement_id)."
    roles: [HRSpecialist, SelectingOfficial]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/hiring/announcements/{id}/certificates"
    description: "List certificates issued from an announcement (FK reverse for Certificate.announcement_id)."
    roles: [HRSpecialist, SelectingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: POST
    path: "/hiring/applicants"
    description: "Register an applicant. When called with role Applicant, X-User-ID is ignored and the response id becomes that applicant's identity."
    roles: [Applicant, HRSpecialist]
    code: 201
    input: [full_name, email, is_us_citizen, is_current_federal_employee, "agency_code?", veteran_preference_claim]
    output: Applicant
    side_effects: ["compute preference_verified and preference_points"]
  - method: GET
    path: "/hiring/applicants/{id}"
    description: "Read one applicant. Role Applicant may only read its own id."
    roles: [Applicant, HRSpecialist, OPMDelegate]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: "/hiring/applicants/{id}/applications"
    description: "List an applicant's applications (FK reverse for Application.applicant_id)."
    roles: [Applicant, HRSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/hiring/applicants/{id}/documents"
    description: "Upload an eligibility document (unverified)."
    roles: [Applicant, OPMDelegate]
    code: 201
    input: [doc_type]
    output: EligibilityDocument
    side_effects: []
  - method: GET
    path: "/hiring/applicants/{id}/documents"
    description: "List an applicant's eligibility documents (FK reverse for EligibilityDocument.applicant_id)."
    roles: [Applicant, HRSpecialist, OPMDelegate]
    code: 200
    input: ["limit?", "offset?"]
    output: EligibilityDocument[]
    side_effects: []
  - method: POST
    path: "/hiring/documents/{id}/verify"
    description: "Mark a document verified; recomputes the applicant's preference_verified and preference_points."
    roles: [OPMDelegate]
    code: 200
    input: []
    output: EligibilityDocument
    side_effects: ["set verified, verified_by, verified_at", "recompute applicant preference_verified/preference_points", "increments EligibilityDocument.version by 1"]
  - method: POST
    path: "/hiring/announcements/{id}/applications"
    description: "Submit an application; gates on announcement OPEN, open-period window, area of consideration, authority eligibility documents, and duplicate rule. Computes provisional_score/provisional_category."
    roles: [Applicant]
    code: 201
    input: [applicant_id, claimed_experience_months, claimed_education_months, self_rating_knowledge, self_rating_skill, self_rating_ability]
    output: Application
    side_effects: ["compute provisional_score and provisional_category (sme_technical_score provisional variant + category_assignment)", "set submitted_at and notified_at"]
  - method: GET
    path: "/hiring/applications/{id}"
    description: "Read one application. Role Applicant may only read its own."
    roles: [Applicant, HRSpecialist, SelectingOfficial, SME]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/hiring/applications/{id}/screen"
    description: "RECEIVED -> QUALIFIED or INELIGIBLE via qualification_determination."
    roles: [HRSpecialist]
    code: 200
    input: []
    output: Application
    side_effects: ["run qualification_determination", "set notified_at", "increments Application.version by 1"]
  - method: GET
    path: "/hiring/applications/{id}/assessments"
    description: "List assessments of an application (FK reverse for Assessment.application_id)."
    roles: [HRSpecialist, SME]
    code: 200
    input: ["limit?", "offset?"]
    output: Assessment[]
    side_effects: []
  - method: GET
    path: "/hiring/applications/{id}/appeals"
    description: "List appeals of an application (FK reverse for Appeal.application_id)."
    roles: [Applicant, HRSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: GET
    path: "/hiring/applications/{id}/certificate-entries"
    description: "List certificate entries referencing an application (FK reverse for CertificateEntry.application_id; 0..N across certificates)."
    roles: [HRSpecialist, SelectingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: CertificateEntry[]
    side_effects: []
  - method: POST
    path: "/hiring/applications/{id}/appeals"
    description: "File an appeal; posture/grounds match and 14-day window enforced."
    roles: [Applicant]
    code: 201
    input: [grounds, "corrected_experience_months?"]
    output: Appeal
    side_effects: ["compute deadline_at from application.notified_at + 14 days"]
  - method: POST
    path: "/hiring/applications/{id}/assessments"
    description: "SME creates a DRAFT assessment for a QUALIFIED application (CATEGORY_RATING announcements only)."
    roles: [SME]
    code: 201
    input: [rating_knowledge, rating_skill, rating_ability]
    output: Assessment
    side_effects: ["record sme_user_id from X-User-ID"]
  - method: GET
    path: "/hiring/assessments/{id}"
    description: "Read one assessment."
    roles: [SME, HRSpecialist]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: POST
    path: "/hiring/assessments/{id}/submit"
    description: "DRAFT -> SUBMITTED or RETURNED -> SUBMITTED (resubmission optionally replaces ratings); computes technical_score and quality_category."
    roles: [SME]
    code: 200
    input: ["rating_knowledge?", "rating_skill?", "rating_ability?"]
    output: Assessment
    side_effects: ["run sme_technical_score (certified variant)", "run category_assignment", "increments Assessment.version by 1"]
  - method: POST
    path: "/hiring/assessments/{id}/accept"
    description: "SUBMITTED -> ACCEPTED; cascades application QUALIFIED -> RATED."
    roles: [HRSpecialist]
    code: 200
    input: []
    output: Assessment
    side_effects: ["application QUALIFIED -> RATED with score/category copied", "set application.notified_at", "increments Assessment.version by 1"]
  - method: POST
    path: "/hiring/assessments/{id}/return"
    description: "SUBMITTED -> RETURNED with a reason."
    roles: [HRSpecialist]
    code: 200
    input: ["return_reason?"]
    output: Assessment
    side_effects: ["increments Assessment.version by 1"]
  - method: POST
    path: "/hiring/announcements/{id}/certificates"
    description: "Issue a certificate of eligibles to the selecting official; builds the roster (certificate_roster_selection), ranks it (certificate_ranking), flips roster applications to REFERRED, and flips the announcement CLOSED -> CERT_ISSUED. Blocked while another certificate of the announcement is ACTIVE and by closed-interval window overlap with prior certificates."
    roles: [HRSpecialist]
    code: 201
    input: []
    output: Certificate
    side_effects: ["run certificate_roster_selection", "run certificate_ranking", "create CertificateEntry rows", "roster applications -> REFERRED", "announcement CLOSED -> CERT_ISSUED", "set issued_at and expires_at"]
  - method: GET
    path: "/hiring/certificates/{id}"
    description: "Read one certificate; lazy EXPIRED evaluation against the logical clock."
    roles: [HRSpecialist, SelectingOfficial]
    code: 200
    input: []
    output: Certificate
    side_effects: ["evaluate EXPIRED transition"]
  - method: POST
    path: "/hiring/certificates/{id}/extend"
    description: "Extend expires_at by additional_days (1..30, at most 2 extensions); OCC-guarded on Certificate.version."
    roles: [HRSpecialist]
    code: 200
    input: [additional_days, expected_certificate_version]
    output: Certificate
    side_effects: ["run certificate_expiry (extension)", "increments Certificate.version by 1"]
  - method: POST
    path: "/hiring/certificates/{id}/return"
    description: "ACTIVE -> RETURNED; referred applications return to the rated/qualified pool."
    roles: [SelectingOfficial]
    code: 200
    input: ["reason?"]
    output: Certificate
    side_effects: ["pool-return cascade per state machine", "increments Certificate.version by 1"]
  - method: GET
    path: "/hiring/certificates/{id}/entries"
    description: "List a certificate's entries in rank_position order (FK reverse for CertificateEntry.certificate_id)."
    roles: [HRSpecialist, SelectingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: CertificateEntry[]
    side_effects: []
  - method: POST
    path: "/hiring/certificates/{id}/selections"
    description: "Select a REFERRED entry: entry -> SELECTED, application -> SELECTED, Offer created in TENTATIVE (tentative_offered_at = clock, response_due_at = clock + 5 days), remaining_vacancies recomputed; category-bypass, pass-over, and vacancy gates enforced."
    roles: [SelectingOfficial]
    code: 201
    input: [certificate_entry_id]
    output: Offer
    side_effects: ["entry REFERRED -> SELECTED", "application REFERRED -> SELECTED", "create Offer TENTATIVE", "run remaining_vacancies_recompute", "certificate may auto-CLOSE; announcement may auto-FILL"]
  - method: GET
    path: "/hiring/entries/{id}"
    description: "Read one certificate entry."
    roles: [HRSpecialist, SelectingOfficial]
    code: 200
    input: []
    output: CertificateEntry
    side_effects: []
  - method: GET
    path: "/hiring/entries/{id}/pass-over-requests"
    description: "List pass-over requests targeting an entry (FK reverse for PassOverRequest.certificate_entry_id and PassOverRequest.desired_entry_id)."
    roles: [HRSpecialist, SelectingOfficial, OPMDelegate]
    code: 200
    input: ["limit?", "offset?"]
    output: PassOverRequest[]
    side_effects: []
  - method: POST
    path: "/hiring/entries/{id}/pass-over-requests"
    description: "Request approval to pass over the path's preference-eligible entry in favor of desired_entry_id."
    roles: [SelectingOfficial]
    code: 201
    input: [desired_entry_id, reason_code, justification]
    output: PassOverRequest
    side_effects: []
  - method: POST
    path: "/hiring/pass-over-requests/{id}/adjudicate"
    description: "PENDING -> APPROVED (entry cascades to PASSED_OVER) or DENIED."
    roles: [OPMDelegate]
    code: 200
    input: [outcome, "adjudication_note?"]
    output: PassOverRequest
    side_effects: ["on APPROVED: target entry REFERRED -> PASSED_OVER", "set adjudicated_by", "increments PassOverRequest.version by 1"]
  - method: GET
    path: "/hiring/offers"
    description: "Filtered offer list (FK reverse for Offer.application_id and Offer.certificate_entry_id)."
    roles: [HRSpecialist, SelectingOfficial]
    code: 200
    input: ["application_id?", "certificate_entry_id?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: ["evaluate OFFER_EXPIRED transitions on listed offers"]
  - method: GET
    path: "/hiring/offers/{id}"
    description: "Read one offer; lazy OFFER_EXPIRED evaluation. Role Applicant may only read offers on own applications."
    roles: [HRSpecialist, SelectingOfficial, Applicant]
    code: 200
    input: []
    output: Offer
    side_effects: ["evaluate OFFER_EXPIRED transition"]
  - method: POST
    path: "/hiring/offers/{id}/respond"
    description: "TENTATIVE -> ACCEPTED or DECLINED by the applicant; 5-day response window enforced (on a stored-TENTATIVE offer at/past response_due_at the rejection is ERR_OFFER_RESPONSE_EXPIRED; on any other state it is ERR_OFFER_NOT_ACTIONABLE)."
    roles: [Applicant]
    code: 200
    input: [response]
    output: Offer
    side_effects: ["set responded_at", "on DECLINE: application/entry -> NOT_SELECTED cascade with remaining_vacancies recompute", "increments Offer.version by 1"]
  - method: POST
    path: "/hiring/offers/{id}/suitability-reviews"
    description: "Record the suitability determination (FAVORABLE/UNFAVORABLE) for an ACCEPTED offer; UNFAVORABLE rescinds the offer (cascade). One review per offer."
    roles: [SuitabilityReviewer]
    code: 201
    input: [outcome, "notes?"]
    output: SuitabilityReview
    side_effects: ["set offer.suitability_reviewer_id from X-User-ID", "on UNFAVORABLE: offer ACCEPTED -> RESCINDED with NOT_SELECTED cascade", "segregation-of-duties check against clearance adjudicator"]
  - method: GET
    path: "/hiring/offers/{id}/suitability-reviews"
    description: "List suitability reviews of an offer (FK reverse for SuitabilityReview.offer_id; 0..1)."
    roles: [HRSpecialist, SelectingOfficial, SuitabilityReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: SuitabilityReview[]
    side_effects: []
  - method: POST
    path: "/hiring/offers/{id}/security-clearances"
    description: "Record the clearance adjudication for an ACCEPTED offer that already has a FAVORABLE suitability review; UNFAVORABLE rescinds the offer (cascade). One clearance per offer; adjudicator must differ from the suitability reviewer."
    roles: [SecurityAdjudicator]
    code: 201
    input: [outcome]
    output: SecurityClearance
    side_effects: ["copy level_required from position.sensitivity_level", "on UNFAVORABLE: offer ACCEPTED -> RESCINDED with NOT_SELECTED cascade", "segregation-of-duties check against suitability reviewer"]
  - method: GET
    path: "/hiring/offers/{id}/security-clearances"
    description: "List security clearances of an offer (FK reverse for SecurityClearance.offer_id; 0..1)."
    roles: [HRSpecialist, SelectingOfficial, SecurityAdjudicator]
    code: 200
    input: ["limit?", "offset?"]
    output: SecurityClearance[]
    side_effects: []
  - method: POST
    path: "/hiring/offers/{id}/schedule-eod"
    description: "ACCEPTED -> EOD_SCHEDULED; requires favorable suitability, the sensitivity-level clearance gate, and eod_date not in the past."
    roles: [SelectingOfficial]
    code: 200
    input: [eod_date]
    output: Offer
    side_effects: ["set eod_date", "increments Offer.version by 1"]
  - method: POST
    path: "/hiring/offers/{id}/confirm-eod"
    description: "EOD_SCHEDULED -> ENTERED_ON_DUTY at/after eod_date; re-validates suitability and clearance; creates the Appointment and flips the application to HIRED."
    roles: [HRSpecialist]
    code: 200
    input: []
    output: Offer
    side_effects: ["create Appointment", "application SELECTED -> HIRED", "increments Offer.version by 1"]
  - method: GET
    path: "/hiring/offers/{id}/appointments"
    description: "List appointments of an offer (FK reverse for Appointment.offer_id; 0..1)."
    roles: [HRSpecialist, SelectingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: "/hiring/appeals/{id}/adjudicate"
    description: "FILED -> SUSTAINED or DENIED; SUSTAINED cascades per grounds (re-screen with corrected months, or assessment return + RATED -> QUALIFIED)."
    roles: [HRSpecialist]
    code: 200
    input: [outcome, "adjudication_note?"]
    output: Appeal
    side_effects: ["appeal sustain cascades per Application/Assessment state machines", "increments Appeal.version by 1"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["lazy EXPIRED / OFFER_EXPIRED transitions evaluate against this clock on subsequent reads and actions"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers, or undeclared role." }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on the endpoint, or entity-backed ownership violated (Applicant acting on another applicant's resources; SME submitting another SME's assessment)." }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, out-of-range number, or invalid enum value in the request body." }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK id does not resolve to an existing entity." }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine violation: no such transition from the resource's current state." }
  - { id: ERR_ANNOUNCEMENT_NOT_OPEN, http: 409, condition: "Application submitted while announcement.status != OPEN." }
  - { id: ERR_ANNOUNCEMENT_NOT_CLOSED, http: 409, condition: "Certificate issuance while announcement.status not in {CLOSED, CERT_ISSUED}." }
  - { id: ERR_CERTIFICATE_NOT_ACTIVE, http: 409, condition: "Certificate-scoped action while certificate.status != ACTIVE (includes expired certificates after lazy evaluation)." }
  - { id: ERR_OFFER_NOT_ACTIONABLE, http: 409, condition: "Offer action attempted from the wrong offer state." }
  - { id: ERR_ASSESSMENT_NOT_SUBMITTED, http: 409, condition: "Assessment accept/return from a non-SUBMITTED state, or submit from a state other than DRAFT/RETURNED." }
  - { id: ERR_PASS_OVER_NOT_PENDING, http: 409, condition: "Pass-over adjudication on a request not in PENDING." }
  - { id: ERR_APPEAL_NOT_ALLOWED_STATE, http: 409, condition: "Appeal filed from a non-appealable application state or on an application referenced by an ACTIVE certificate (RATING grounds); adjudication on a non-FILED appeal." }
  - { id: ERR_APPLICATION_WRONG_STATE, http: 409, condition: "Screening a non-RECEIVED application or creating an assessment for a non-QUALIFIED application." }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same X-User-ID records both the suitability review and the security clearance for one offer." }
  - { id: ERR_SUITABILITY_NOT_FAVORABLE, http: 422, condition: "Schedule-eod or confirm-eod without a FAVORABLE suitability review on the offer." }
  - { id: ERR_CLEARANCE_INSUFFICIENT, http: 422, condition: "Schedule-eod or confirm-eod without the clearance outcome required by position sensitivity (SECRET: interim+; TOP_SECRET: final only)." }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Second application by the same applicant to the same announcement." }
  - { id: ERR_ACTIVE_ASSESSMENT_EXISTS, http: 409, condition: "Creating an assessment while one is DRAFT/SUBMITTED, or accepting while another is ACCEPTED, for the same application." }
  - { id: ERR_ANNOUNCEMENT_PERIOD_OVERLAP, http: 409, condition: "New announcement's half-open [open_at, close_at) intersects a sibling announcement's period on the same position." }
  - { id: ERR_CERTIFICATE_WINDOW_OVERLAP, http: 409, condition: "New certificate's issued_at <= a prior certificate's expires_at on the same announcement (closed-interval semantics; adjacency conflicts)." }
  - { id: ERR_ACTIVE_CERTIFICATE_EXISTS, http: 409, condition: "Issuing a certificate while another of the same announcement is ACTIVE." }
  - { id: ERR_INSUFFICIENT_ELIGIBLES, http: 422, condition: "Roster after category merging has fewer than RULE_OF_MANY_MIN (3) candidates (CATEGORY_RATING), or zero QUALIFIED applications (UNRANKED)." }
  - { id: ERR_CATEGORY_BYPASS, http: 422, condition: "Selecting an entry while a REFERRED entry in a strictly higher category exists on the certificate." }
  - { id: ERR_PASS_OVER_REQUIRED, http: 422, condition: "Selecting a non-preference entry while a REFERRED preference-eligible entry ranks higher in the same category without an APPROVED pass-over." }
  - { id: ERR_NOT_PREFERENCE_ELIGIBLE, http: 422, condition: "Pass-over target is not preference-eligible, or desired entry is preference-eligible, or desired does not rank below target." }
  - { id: ERR_EXTENSION_LIMIT, http: 422, condition: "Certificate extension beyond 2 extensions or additional_days outside 1..30." }
  - { id: ERR_NO_REMAINING_VACANCIES, http: 409, condition: "Selection when announcement.remaining_vacancies == 0." }
  - { id: ERR_APPEAL_GROUND_MISMATCH, http: 422, condition: "Appeal grounds inconsistent with application posture (QUALIFICATION not from INELIGIBLE; RATING not from RATED)." }
  - { id: ERR_SERIES_GRADE_RANGE, http: 422, condition: "Classified grade outside [series.min_grade, series.max_grade]." }
  - { id: ERR_AUTHORITY_METHOD_MISMATCH, http: 422, condition: "hiring_authority/assessment_method incoherence (COMPETITIVE requires CATEGORY_RATING; DIRECT_HIRE requires UNRANKED)." }
  - { id: ERR_OUTSIDE_OPEN_PERIOD, http: 422, condition: "Application submitted outside [open_at, close_at) — at exactly close_at it is rejected." }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Appeal filed at or after notified_at + 14 days." }
  - { id: ERR_OFFER_RESPONSE_EXPIRED, http: 409, condition: "Applicant responds at or after response_due_at; offer is OFFER_EXPIRED." }
  - { id: ERR_EOD_DATE_INVALID, http: 422, condition: "schedule-eod eod_date in the past, or confirm-eod before eod_date." }
  - { id: ERR_POSITION_NOT_CLASSIFIED, http: 422, condition: "Announcement creation against a DRAFT position." }
  - { id: ERR_OUTSIDE_AREA_OF_CONSIDERATION, http: 422, condition: "Applicant fails the announcement's area-of-consideration rule." }
  - { id: ERR_ELIGIBILITY_DOC_REQUIRED, http: 422, condition: "Non-COMPETITIVE authority application without the mapped verified eligibility document." }
  - { id: ERR_PASS_OVER_PENDING, http: 409, condition: "Selection of a lower-ranked entry while a PENDING pass-over names a higher-ranked preference-eligible entry on the certificate." }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version differs from the parent's current version (OCC)." }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "Natural-key collision: series_code, announcement_number, or applicant email already exists." }
  - { id: ERR_REVIEW_ALREADY_RECORDED, http: 409, condition: "Second suitability review or second security clearance recorded for the same offer." }
  - { id: ERR_ASSESSMENT_NOT_APPLICABLE, http: 422, condition: "Assessment created for an application of an UNRANKED (non-competitive) announcement." }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HRSpecialist
    description: "HR staffing specialist: series/qualification standards, classification, screening, assessment acceptance, certificate issuance/extension, appeal adjudication, EOD confirmation."
    identity: opaque
    exclusive_operations: [classify_position, reclassify_position, screen_application, accept_assessment, return_assessment, issue_certificate, extend_certificate, adjudicate_appeal, confirm_eod]
    shared_operations: [read_positions, read_announcements, read_applications, read_certificates, read_entries, read_offers, read_appeals, create_applicants]
  - name: HiringManager
    description: "Hiring organization manager: drafts positions, builds and opens/closes/cancels announcements."
    identity: opaque
    exclusive_operations: [create_position, create_announcement, open_announcement, close_announcement, cancel_announcement]
    shared_operations: [read_positions, read_announcements, read_series]
  - name: SME
    description: "Subject matter expert: writes and submits assessments for applications under review."
    identity: opaque
    exclusive_operations: [create_assessment, submit_assessment]
    shared_operations: [read_applications, read_assessments, read_announcements]
  - name: Applicant
    description: "Job applicant: registers, uploads documents, applies, files appeals, responds to offers. X-User-ID equals the Applicant id for all self-service operations."
    identity: entity_backed:Applicant
    exclusive_operations: [register, upload_document, apply, file_appeal, respond_offer]
    shared_operations: [read_own_applicant, read_own_applications, read_own_documents, read_own_appeals, read_own_offers, read_announcements]
  - name: SelectingOfficial
    description: "Selecting official: reads certificates, makes selections, files pass-over requests, returns certificates, schedules EOD."
    identity: opaque
    exclusive_operations: [select_entry, request_pass_over, return_certificate, schedule_eod]
    shared_operations: [read_certificates, read_entries, read_applications, read_offers, read_announcements, read_appointments]
  - name: OPMDelegate
    description: "OPM delegated-examining authority: verifies eligibility documents and adjudicates pass-over requests."
    identity: opaque
    exclusive_operations: [verify_document, adjudicate_pass_over]
    shared_operations: [read_applicants, read_documents, read_pass_over_requests, read_announcements]
  - name: SuitabilityReviewer
    description: "Suitability adjudicator: records suitability determinations. Segregated from SecurityAdjudicator per offer."
    identity: opaque
    exclusive_operations: [record_suitability_review]
    shared_operations: [read_suitability_reviews]
  - name: SecurityAdjudicator
    description: "Personnel security adjudicator: records clearance determinations. Segregated from SuitabilityReviewer per offer."
    identity: opaque
    exclusive_operations: [record_security_clearance]
    shared_operations: [read_security_clearances]
  - name: PlatformAdmin
    description: "Operator of test-driving facilities (logical clock); no business operations."
    identity: opaque
    exclusive_operations: [set_clock]
    shared_operations: []
