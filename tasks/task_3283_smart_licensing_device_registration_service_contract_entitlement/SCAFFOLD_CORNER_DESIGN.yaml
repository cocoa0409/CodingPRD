  - section: cross_cutting_layers
    instances:
      - name: occ_stale_pool_version_rejected
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[pool-purchase-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Two sequential purchase adjustments: first succeeds (version 1->2), second replaying expected_pool_version 1 -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Pool purchased 5, version 1 captured"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C25", display_name: "Corner 25" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va_id}", sku: "LIC-C25", license_model: "PERPETUAL", feature_tier: "ESSENTIALS", purchased_quantity: 5 }
              as: PlatformAdmin
              captures: { pool_id: $.data.id, pool_ver: $.data.version }
          trigger:
            - call: "POST /api/license-pools/${pool_id}/purchase-adjustment"
              payload: { delta: 1, expected_pool_version: "${pool_ver}" }
              as: PlatformAdmin
              captures: { ok_qty: $.data.purchased_quantity, ok_ver: $.data.version }
            - call: "POST /api/license-pools/${pool_id}/purchase-adjustment"
              payload: { delta: 1, expected_pool_version: "${pool_ver}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "ok_qty == 6 and ok_ver == 2"
            - "second adjustment -> HTTP 412 ERR_STALE_VERSION"
            - "LicensePool.${pool_id}.purchased_quantity == 6 (stale write did not apply)"
