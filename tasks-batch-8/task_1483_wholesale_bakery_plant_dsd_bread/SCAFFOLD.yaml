# =============================================================================
# task_1483_wholesale_bakery_plant_dsd_bread — Seed Tables (SCAFFOLD.yaml)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Wholesale Bakery Plant & DSD Bread Distribution (Bimbo Bakeries style plant): production plan from store orders & lead time, dough mixing/proof/bake line scheduling, staling clock & delivery frequency, route driver load & shelf stocking, stale return credit & shrink control, thrift-store outlet channel, allergen segregation & sanitation, ingredient (flour/butter) cost pass-through

domain_name: wholesale-bakery-dsd
api_prefix: /bakery

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plant display name" }
      - { name: baseline_flour_index, type: number, source: input, description: "Baseline flour cost index for pass-through deltas" }
      - { name: baseline_butter_index, type: number, source: input, description: "Baseline butter cost index for pass-through deltas" }
      - { name: day_index, type: integer, source: system, default: 0, description: "Ops-run day counter; increments on close_day" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: sku, type: string, source: input, description: "SKU code; unique per plant" , constraints: "unique within plant_id"}
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: allergen_class, type: enum, source: input, description: "NONE | SESAME | TREE_NUT | PEANUT — segregation class" }
      - { name: unit_weight_g, type: integer, source: input, description: "Baked unit weight in grams; > 0" }
      - { name: shelf_life_hours, type: integer, source: input, description: "Staling clock length; > 0" }
      - { name: base_price_cents, type: integer, source: input, description: "Wholesale unit price before surcharge; > 0" }
      - { name: flour_share_pct, type: number, source: input, description: "Fraction of unit cost exposed to flour index; 0..1" }
      - { name: butter_share_pct, type: number, source: input, description: "Fraction of unit cost exposed to butter index; 0..1" }
      - { name: batch_capacity_units, type: integer, source: input, description: "Max units per batch of this product on any line; > 0" }
      - { name: current_surcharge_cents, type: integer, source: computed, default: 0, description: "Active pass-through surcharge from latest FINALIZED SurchargeSchedule; 0 when none" }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: name, type: string, source: input, description: "Store name" }
      - { name: lead_time_hours, type: integer, source: input, description: "Order cutoff lead time before delivery instant; > 0" }
      - { name: min_remaining_life_hours_on_delivery, type: integer, source: input, description: "Minimum remaining shelf life required at delivery; >= 0" }
      - { name: shelf_capacity_units, type: integer, source: input, description: "Bread shelf capacity in units; > 0" }
      - { name: stale_credit_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | LIMITED; LIMITED caps credit rate at 0.50" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Outstanding stale-credit balance owed to store" }
      - { name: lifetime_delivered_units, type: integer, source: computed, default: 0, description: "Cumulative delivered units across settled routes" }
      - { name: lifetime_stale_units, type: integer, source: computed, default: 0, description: "Cumulative verified stale returned units" }
      - { name: stale_ratio, type: number, source: computed, default: 0, description: "lifetime_stale_units / max(1, lifetime_delivered_units)" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: name, type: string, source: input, description: "Driver name" }
      - { name: max_daily_drive_minutes, type: integer, source: input, default: 600, description: "Daily driving cap" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }
      - { name: shrink_liability_cents, type: integer, source: computed, default: 0, description: "Accumulated shrink liability" }

  - name: Line
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: line_code, type: string, source: input, description: "Line code; unique per plant", constraints: "unique within plant_id" }
      - { name: hourly_capacity_units, type: integer, source: input, description: "Nominal hourly throughput; > 0" }
      - { name: cleanliness, type: enum, source: system, description: "CLEAN | DIRTY | SANITIZING" }
      - { name: allergen_class_current, type: enum, source: system, description: "NONE | SESAME | TREE_NUT | PEANUT — residue class currently on the line" }

  - name: StoreOrder
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; ordering store" }
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; copied from Store at creation" }
      - { name: delivery_date, type: string, source: input, description: "ISO date YYYY-MM-DD; delivery instant fixed at 08:00:00Z that day" }
      - { name: lines, type: array, source: input, description: "[{ product_id, qty }] each qty > 0; product must belong to same plant" }
      - { name: pending_lines, type: array, source: system, description: "Amended lines awaiting planner decision while AMENDMENT_PENDING; null otherwise" }
      - { name: status, type: enum, source: system, description: "PLACED | CONFIRMED | AMENDMENT_PENDING | LOCKED | SHORTED | FULFILLED | PARTIALLY_FULFILLED | CANCELLED" }
      - { name: total_units, type: integer, source: computed, description: "Sum of qty over active lines" }
      - { name: placed_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical clock at confirm" }

  - name: ProductionPlan
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: bake_date, type: string, source: input, description: "ISO date YYYY-MM-DD the plan bakes for" }
      - { name: status, type: enum, source: system, description: "DRAFT | LOCKED | RELEASED | RECONCILED | SUPERSEDED" }
      - { name: planned_units_by_product, type: object, source: computed, description: "product_id -> planned units incl. buffer; computed at lock" }
      - { name: batches_required_by_product, type: object, source: computed, description: "product_id -> ceil(planned / batch_capacity_units); computed at lock" }
      - { name: total_planned_units, type: integer, source: computed, default: 0, description: "Sum of planned_units_by_product" }
      - { name: flour_required_kg, type: number, source: computed, default: 0, description: "Total flour requirement in kg (1 decimal)" }
      - { name: shortfall_units, type: integer, source: computed, default: 0, description: "Cumulative units lost to REJECTED batches after release" }

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - { name: production_plan_id, type: string, source: input, description: "FK -> ProductionPlan.id" }
      - { name: line_id, type: string, source: input, description: "FK -> Line.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: qty_units, type: integer, source: input, description: "Planned units; 1..product.batch_capacity_units" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Line occupation start (ISO8601)" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Line occupation end (ISO8601); half-open interval [start, end)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | MIXING | PROOFING | BAKING | COOLING | OVERPROOFED | RELEASED | REJECTED | ABORTED" }
      - { name: mix_started_at, type: datetime, source: system, description: "Clock at start-mix" }
      - { name: proof_started_at, type: datetime, source: system, description: "Clock at start-proof" }
      - { name: bake_completed_at, type: datetime, source: system, description: "Clock at complete-bake; staling clock origin" }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID of operator who ran complete-bake" }
      - { name: fresh_until, type: datetime, source: computed, description: "bake_completed_at + product.shelf_life_hours; null until baked" }

  - name: SanitationCycle
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> Line.id" }
      - { name: from_allergen_class, type: enum, source: system, description: "Line allergen_class_current at request time" }
      - { name: to_allergen_class, type: enum, source: input, description: "NONE | SESAME | TREE_NUT | PEANUT — target residue class" }
      - { name: required_minutes, type: integer, source: computed, description: "From sanitation_changeover_minutes matrix" }
      - { name: status, type: enum, source: system, description: "REQUESTED | IN_PROGRESS | VERIFIED | FAILED" }
      - { name: started_at, type: datetime, source: system, description: "Clock at start" }
      - { name: started_by_user_id, type: string, source: system, description: "X-User-ID of operator who started the cycle" }
      - { name: verified_at, type: datetime, source: system, description: "Clock at verify" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id" }
      - { name: route_date, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: window_start_at, type: datetime, source: input, description: "Driver window start" }
      - { name: window_end_at, type: datetime, source: input, description: "Driver window end; must be after start" }
      - { name: truck_capacity_units, type: integer, source: input, description: "Truck capacity in units; > 0" }
      - { name: status, type: enum, source: system, description: "PLANNED | LOADING | DISPATCHED | COMPLETED | SETTLED | CANCELLED" }
      - { name: loaded_units, type: integer, source: computed, default: 0, description: "Sum of stop planned_units, fixed at start-loading" }
      - { name: delivered_units, type: integer, source: computed, default: 0, description: "Sum of stop delivered_units" }
      - { name: refused_units, type: integer, source: computed, default: 0, description: "Sum of stop refused_units" }
      - { name: returned_stale_units, type: integer, source: computed, default: 0, description: "Sum of stale-return line qty picked up on this route's stops (informational; not part of shrink)" }
      - { name: shrink_units, type: integer, source: computed, description: "loaded - delivered; computed at settle" }
      - { name: shrink_liability_cents, type: integer, source: computed, description: "Driver liability computed at settle" }

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: store_order_id, type: string, source: input, description: "FK -> StoreOrder.id" }
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; copied from StoreOrder" }
      - { name: planned_units, type: integer, source: input, description: "Must equal StoreOrder.total_units" }
      - { name: batch_ids, type: array, source: input, description: "RELEASED Batch ids covering every order-line product" }
      - { name: status, type: enum, source: system, description: "PENDING | DELIVERED | SKIPPED | RECONCILED" }
      - { name: delivered_units, type: integer, source: system, description: "Driver-declared delivered units at deliver" }
      - { name: on_shelf_units_observed, type: integer, source: system, description: "Driver-observed units already on shelf at deliver" }
      - { name: stocked_units, type: integer, source: computed, description: "Units that fit on shelf (stocking_allocation)" }
      - { name: refused_units, type: integer, source: computed, description: "delivered_units - stocked_units" }
      - { name: shortfall_flag, type: boolean, source: system, default: false, description: "Set when an assigned batch is REJECTED before delivery" }

  - name: StaleReturn
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: route_stop_id, type: string, source: input, description: "FK -> RouteStop.id; pickup event stop" }
      - { name: lines, type: array, source: input, description: "[{ batch_id, qty }] driver-declared pickup; qty > 0" }
      - { name: verified_lines, type: array, source: system, description: "[{ batch_id, qty }] QA-verified quantities; set at verify/resolve" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "Credit from declared lines at creation (provisional variant)" }
      - { name: final_credit_cents, type: integer, source: computed, description: "Credit from verified lines (verified variant); null until verified" }
      - { name: credited_amount_cents, type: integer, source: system, description: "Amount actually applied to store credit at credit transition" }
      - { name: dispute_round, type: integer, source: system, default: 0, description: "Increments on each DISPUTED -> VERIFIED resolution" }
      - { name: recorded_by_driver_id, type: string, source: system, description: "X-User-ID of driver who created the return" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | DISPUTED | CREDITED | REVERSED | REJECTED" }

  - name: ThriftSale
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; copied from Product at creation" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: units, type: integer, source: input, description: "Units sold; > 0" }
      - { name: unit_price_cents, type: integer, source: input, description: "Sale price; must be >= thrift floor" }
      - { name: total_cents, type: integer, source: computed, description: "units * unit_price_cents" }
      - { name: status, type: enum, source: system, description: "RECORDED | VOIDED" }

  - name: IngredientIndex
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id" }
      - { name: ingredient, type: enum, source: input, description: "FLOUR | BUTTER" }
      - { name: period, type: string, source: input, description: "YYYY-MM; one index per (plant, ingredient, period)", constraints: "unique within (plant_id, ingredient, period)" }
      - { name: forecast_value, type: number, source: input, description: "Forecast index value; > 0" }
      - { name: published_value, type: number, source: system, description: "Published index value; null until publish" }
      - { name: status, type: enum, source: system, description: "FORECAST | PUBLISHED" }

  - name: SurchargeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: period, type: string, source: input, description: "YYYY-MM the surcharge applies to; one schedule per (product, period)", constraints: "unique within (product_id, period)" }
      - { name: provisional_surcharge_cents, type: integer, source: computed, description: "Computed at creation from FORECAST index values" }
      - { name: final_surcharge_cents, type: integer, source: computed, description: "Computed from PUBLISHED index values; null until FINALIZED" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Store
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /bakery/stores/{id}/suspend OR system (close_day: stale_ratio > 0.15)"
        actor: PlantAdmin | system
        preconditions: []
        side_effects:
          - "Increments Store.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /bakery/stores/{id}/reinstate"
        actor: PlantAdmin
        preconditions: []
        side_effects:
          - "Increments Store.version by 1"

  - entity: StoreOrder
    field: status
    initial_state: PLACED
    terminal_states: [FULFILLED, PARTIALLY_FULFILLED, CANCELLED]
    transitions:
      - from: PLACED
        to: CONFIRMED
        trigger: "POST /bakery/store-orders/{id}/confirm"
        actor: Planner
        preconditions:
          - "Store.status == ACTIVE (else ERR_STORE_SUSPENDED)"
          - "clock <= delivery_instant - store.lead_time_hours (else ERR_ORDER_CUTOFF_PASSED); delivery_instant = delivery_date T08:00:00Z"
        side_effects:
          - "confirmed_at = clock; increments StoreOrder.version by 1"
      - from: CONFIRMED
        to: AMENDMENT_PENDING
        trigger: "POST /bakery/store-orders/{id}/request-amendment"
        actor: StoreReceiver
        preconditions:
          - "X-User-ID == order.store_id (else ERR_FORBIDDEN_FOR_ROLE)"
          - "OCC: expected_store_order_version == StoreOrder.version (else ERR_STALE_VERSION)"
          - "clock <= cutoff (else ERR_ORDER_CUTOFF_PASSED)"
        side_effects:
          - "pending_lines = request lines; increments StoreOrder.version by 1"
      - from: AMENDMENT_PENDING
        to: CONFIRMED
        trigger: "POST /bakery/store-orders/{id}/accept-amendment"
        actor: Planner
        preconditions: []
        side_effects:
          - "lines = pending_lines; pending_lines = null; total_units recomputed; increments StoreOrder.version by 1"
      - from: AMENDMENT_PENDING
        to: CONFIRMED
        trigger: "POST /bakery/store-orders/{id}/reject-amendment"
        actor: Planner
        preconditions: []
        side_effects:
          - "pending_lines = null; lines unchanged; increments StoreOrder.version by 1"
      - from: CONFIRMED
        to: LOCKED
        trigger: "POST /bakery/store-orders/{id}/lock OR system (close_day when clock past cutoff)"
        actor: Planner | system
        preconditions:
          - "clock <= cutoff (else ERR_ORDER_CUTOFF_PASSED) for manual lock"
        side_effects:
          - "Increments StoreOrder.version by 1"
      - from: LOCKED
        to: SHORTED
        trigger: "system (cascade: an assigned batch on a linked PENDING stop is REJECTED)"
        actor: system
        preconditions:
          - "A RouteStop referencing this order has shortfall_flag set true by the batch-reject cascade"
        side_effects:
          - "Increments StoreOrder.version by 1"
      - from: LOCKED
        to: FULFILLED
        trigger: "system (cascade from stop reconcile: delivered_units == total_units)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments StoreOrder.version by 1"
      - from: LOCKED
        to: PARTIALLY_FULFILLED
        trigger: "system (cascade from stop reconcile: delivered_units < total_units)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHORTED
        to: PARTIALLY_FULFILLED
        trigger: "system (cascade from stop reconcile)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLACED
        to: CANCELLED
        trigger: "POST /bakery/store-orders/{id}/cancel"
        actor: Planner
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bakery/store-orders/{id}/cancel"
        actor: Planner
        preconditions: []
        side_effects: []

  - entity: ProductionPlan
    field: status
    initial_state: DRAFT
    terminal_states: [RECONCILED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /bakery/production-plans/{id}/lock"
        actor: Planner
        preconditions: []
        side_effects:
          - "Runs production_requirement: planned_units_by_product, batches_required_by_product, total_planned_units, flour_required_kg"
          - "Increments ProductionPlan.version by 1"
      - from: LOCKED
        to: DRAFT
        trigger: "POST /bakery/production-plans/{id}/unlock"
        actor: Planner
        preconditions:
          - "No Batch of this plan has left SCHEDULED (else ERR_PLAN_NOT_RELEASABLE)"
        side_effects:
          - "Computed requirement fields reset to empty/0; increments ProductionPlan.version by 1"
      - from: LOCKED
        to: RELEASED
        trigger: "POST /bakery/production-plans/{id}/release"
        actor: Planner
        preconditions:
          - "At least one Batch in SCHEDULED exists for this plan (else ERR_PLAN_NOT_RELEASABLE)"
          - "No SanitationCycle on a line used by this plan is in REQUESTED or IN_PROGRESS (else ERR_SANITATION_REQUIRED)"
        side_effects:
          - "Increments ProductionPlan.version by 1"
      - from: RELEASED
        to: RECONCILED
        trigger: "POST /bakery/production-plans/{id}/reconcile"
        actor: Planner
        preconditions:
          - "Every Batch of this plan is in {RELEASED, REJECTED, ABORTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Increments ProductionPlan.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new ProductionPlan for the same plant+bake_date is created)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments ProductionPlan.version by 1"

  - entity: Batch
    field: status
    initial_state: SCHEDULED
    terminal_states: [REJECTED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: MIXING
        trigger: "POST /bakery/batches/{id}/start-mix"
        actor: LineOperator
        preconditions:
          - "ProductionPlan.status == RELEASED (else ERR_INVALID_STATE)"
        side_effects:
          - "mix_started_at = clock"
      - from: MIXING
        to: PROOFING
        trigger: "POST /bakery/batches/{id}/start-proof"
        actor: LineOperator
        preconditions: []
        side_effects:
          - "proof_started_at = clock"
      - from: PROOFING
        to: BAKING
        trigger: "POST /bakery/batches/{id}/start-bake"
        actor: LineOperator
        preconditions:
          - "60 <= (clock - proof_started_at) minutes <= 120 (else ERR_PROOF_WINDOW_VIOLATION)"
        side_effects: []
      - from: PROOFING
        to: OVERPROOFED
        trigger: "system (close_day: clock - proof_started_at > 120 minutes)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BAKING
        to: COOLING
        trigger: "POST /bakery/batches/{id}/complete-bake"
        actor: LineOperator
        preconditions: []
        side_effects:
          - "bake_completed_at = clock; completed_by_user_id = X-User-ID"
          - "fresh_until = bake_completed_at + product.shelf_life_hours"
          - "Line.allergen_class_current = product.allergen_class"
          - "If product.allergen_class != NONE: Line.cleanliness = DIRTY"
      - from: COOLING
        to: RELEASED
        trigger: "POST /bakery/batches/{id}/release"
        actor: QALead
        preconditions:
          - "X-User-ID != batch.completed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: MIXING
        to: REJECTED
        trigger: "POST /bakery/batches/{id}/reject"
        actor: QALead
        preconditions: []
        side_effects:
          - "Cascade hop 1: ProductionPlan.shortfall_units += batch.qty_units; increments ProductionPlan.version by 1"
          - "Cascade hop 2: every PENDING RouteStop whose batch_ids contain this batch gets shortfall_flag = true"
          - "Cascade hop 3: StoreOrder of each flagged stop transitions LOCKED -> SHORTED"
      - from: PROOFING
        to: REJECTED
        trigger: "POST /bakery/batches/{id}/reject"
        actor: QALead
        preconditions: []
        side_effects:
          - "Cascade hops 1-3 as MIXING -> REJECTED"
      - from: BAKING
        to: REJECTED
        trigger: "POST /bakery/batches/{id}/reject"
        actor: QALead
        preconditions: []
        side_effects:
          - "Cascade hops 1-3 as MIXING -> REJECTED"
      - from: COOLING
        to: REJECTED
        trigger: "POST /bakery/batches/{id}/reject"
        actor: QALead
        preconditions: []
        side_effects:
          - "Cascade hops 1-3 as MIXING -> REJECTED"
      - from: OVERPROOFED
        to: REJECTED
        trigger: "POST /bakery/batches/{id}/reject"
        actor: QALead
        preconditions: []
        side_effects:
          - "Cascade hops 1-3 as MIXING -> REJECTED"
      - from: RELEASED
        to: REJECTED
        trigger: "POST /bakery/batches/{id}/reject (QA recall of released product)"
        actor: QALead
        preconditions: []
        side_effects:
          - "Cascade hops 1-3 as MIXING -> REJECTED (released stock recall hits plan, stops, orders)"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /bakery/batches/{id}/abort"
        actor: Planner
        preconditions: []
        side_effects: []

  - entity: Line
    field: cleanliness
    initial_state: CLEAN
    terminal_states: []
    transitions:
      - from: CLEAN
        to: DIRTY
        trigger: "system (a batch with allergen_class != NONE completes bake on this line)"
        actor: system
        preconditions: []
        side_effects:
          - "Line.allergen_class_current set to that product's allergen_class; increments Line.version by 1"
      - from: DIRTY
        to: SANITIZING
        trigger: "POST /bakery/sanitation-cycles/{id}/start"
        actor: LineOperator
        preconditions: []
        side_effects:
          - "Increments Line.version by 1"
      - from: SANITIZING
        to: CLEAN
        trigger: "POST /bakery/sanitation-cycles/{id}/verify (QA pass)"
        actor: QALead
        preconditions: []
        side_effects:
          - "Line.allergen_class_current = cycle.to_allergen_class; increments Line.version by 1"
      - from: SANITIZING
        to: DIRTY
        trigger: "POST /bakery/sanitation-cycles/{id}/fail (QA fail)"
        actor: QALead
        preconditions: []
        side_effects:
          - "Line.allergen_class_current unchanged; increments Line.version by 1"

  - entity: SanitationCycle
    field: status
    initial_state: REQUESTED
    terminal_states: [VERIFIED]
    transitions:
      - from: REQUESTED
        to: IN_PROGRESS
        trigger: "POST /bakery/sanitation-cycles/{id}/start"
        actor: LineOperator
        preconditions: []
        side_effects:
          - "started_at = clock; started_by_user_id = X-User-ID; Line.cleanliness -> SANITIZING"
      - from: IN_PROGRESS
        to: VERIFIED
        trigger: "POST /bakery/sanitation-cycles/{id}/verify"
        actor: QALead
        preconditions:
          - "clock - started_at >= required_minutes (else ERR_SANITATION_NOT_COMPLETE)"
          - "X-User-ID != cycle.started_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_at = clock; Line.cleanliness -> CLEAN; Line.allergen_class_current = to_allergen_class"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /bakery/sanitation-cycles/{id}/fail"
        actor: QALead
        preconditions: []
        side_effects:
          - "Line.cleanliness -> DIRTY (allergen_class_current unchanged)"
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /bakery/sanitation-cycles/{id}/start (retry loop)"
        actor: LineOperator
        preconditions: []
        side_effects:
          - "started_at = clock (reset); started_by_user_id = X-User-ID; Line.cleanliness -> SANITIZING"

  - entity: Route
    field: status
    initial_state: PLANNED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOADING
        trigger: "POST /bakery/routes/{id}/start-loading"
        actor: Driver
        preconditions:
          - "X-User-ID == route.driver_id (else ERR_FORBIDDEN_FOR_ROLE)"
          - "Route has >= 1 stop (else ERR_INVALID_STATE)"
          - "Every stop's StoreOrder.status == LOCKED or SHORTED (else ERR_STOPS_NOT_LOCKED)"
        side_effects:
          - "loaded_units = sum(stop.planned_units); increments Route.version by 1"
      - from: LOADING
        to: DISPATCHED
        trigger: "POST /bakery/routes/{id}/dispatch"
        actor: Driver
        preconditions:
          - "loaded_units <= truck_capacity_units (else ERR_ROUTE_CAPACITY_EXCEEDED)"
        side_effects: []
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /bakery/routes/{id}/complete"
        actor: Driver
        preconditions:
          - "Every stop in {DELIVERED, SKIPPED, RECONCILED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: COMPLETED
        to: SETTLED
        trigger: "POST /bakery/routes/{id}/settle"
        actor: Planner
        preconditions:
          - "shrink_units / max(1, loaded_units) <= 0.10 unless override_shrink_limit=true (else ERR_SHRINK_LIMIT_EXCEEDED)"
        side_effects:
          - "Runs route_settlement_shrink: shrink_units, shrink_liability_cents"
          - "Driver.shrink_liability_cents += route.shrink_liability_cents"
          - "Store.lifetime_delivered_units += stop.delivered_units for each stop"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /bakery/routes/{id}/cancel"
        actor: Planner
        preconditions:
          - "No stops exist for this route (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: RouteStop
    field: status
    initial_state: PENDING
    terminal_states: [RECONCILED, SKIPPED]
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "POST /bakery/route-stops/{id}/deliver"
        actor: Driver
        preconditions:
          - "Route.status == DISPATCHED (else ERR_INVALID_STATE)"
          - "X-User-ID == route.driver_id (else ERR_FORBIDDEN_FOR_ROLE)"
          - "Every batch in batch_ids is RELEASED (else ERR_INVALID_STATE)"
          - "Freshness: clock <= min(batch.fresh_until) - store.min_remaining_life_hours_on_delivery (else ERR_FRESHNESS_WINDOW_VIOLATION)"
          - "delivered_units <= planned_units (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Runs stocking_allocation: stocked_units, refused_units"
          - "Route.delivered_units += delivered_units; Route.refused_units += refused_units"
      - from: PENDING
        to: SKIPPED
        trigger: "POST /bakery/route-stops/{id}/skip"
        actor: Driver
        preconditions:
          - "Route.status == DISPATCHED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: DELIVERED
        to: RECONCILED
        trigger: "POST /bakery/route-stops/{id}/reconcile"
        actor: Planner
        preconditions: []
        side_effects:
          - "Order cascade: delivered_units == order.total_units -> order LOCKED->FULFILLED else LOCKED/SHORTED->PARTIALLY_FULFILLED"

  - entity: StaleReturn
    field: status
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /bakery/stale-returns/{id}/verify"
        actor: QALead
        preconditions:
          - "X-User-ID != return.recorded_by_driver_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_lines = request verified_lines; runs stale_credit verified variant -> final_credit_cents"
          - "Store.lifetime_stale_units += sum(verified_lines qty)"
      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /bakery/stale-returns/{id}/dispute"
        actor: StoreReceiver
        preconditions:
          - "X-User-ID == return.store_id (else ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: DISPUTED
        to: VERIFIED
        trigger: "POST /bakery/stale-returns/{id}/resolve-dispute"
        actor: QALead
        preconditions: []
        side_effects:
          - "verified_lines = request verified_lines; final_credit_cents recomputed; dispute_round += 1"
      - from: VERIFIED
        to: CREDITED
        trigger: "POST /bakery/stale-returns/{id}/credit"
        actor: Planner
        preconditions:
          - "Store.status == ACTIVE (else ERR_STORE_SUSPENDED)"
          - "final_credit_cents <= 50000 (else ERR_STALE_CREDIT_CAP_EXCEEDED)"
        side_effects:
          - "credited_amount_cents = final_credit_cents"
          - "Store.credit_balance_cents += credited_amount_cents; increments Store.version by 1"
      - from: CREDITED
        to: REVERSED
        trigger: "POST /bakery/stale-returns/{id}/reverse-credit"
        actor: PlantAdmin
        preconditions: []
        side_effects:
          - "Store.credit_balance_cents -= credited_amount_cents; increments Store.version by 1"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /bakery/stale-returns/{id}/reject"
        actor: QALead
        preconditions: []
        side_effects: []

  - entity: IngredientIndex
    field: status
    initial_state: FORECAST
    terminal_states: [PUBLISHED]
    transitions:
      - from: FORECAST
        to: PUBLISHED
        trigger: "POST /bakery/ingredient-indices/{id}/publish"
        actor: PricingAnalyst
        preconditions: []
        side_effects:
          - "published_value = request value"
          - "Cascade hop 1: every PROVISIONAL SurchargeSchedule for this plant+period whose required indices (FLOUR and BUTTER) are all PUBLISHED -> FINALIZED, final_surcharge_cents computed via surcharge_passthrough final variant"
          - "Cascade hop 2: each such Product.current_surcharge_cents = final_surcharge_cents; increments Product.version by 1"

  - entity: SurchargeSchedule
    field: status
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "system (cascade from IngredientIndex publish when both FLOUR and BUTTER indices for the period are PUBLISHED)"
        actor: system
        preconditions: []
        side_effects:
          - "final_surcharge_cents computed; Product.current_surcharge_cents updated"

  - entity: ThriftSale
    field: status
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /bakery/thrift-sales/{id}/void"
        actor: PlantAdmin
        preconditions: []
        side_effects:
          - "Thrift stock pool for the product increases by sale.units (compensating action)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: order-amend-stale-version
    parent_entity: StoreOrder
    write_endpoint: "POST /bakery/store-orders/{id}/request-amendment"
    occ_field: "expected_store_order_version"
    description: |
      Requesting an amendment against a StoreOrder whose version has advanced
      since the client last observed it is rejected. A prior accepted/rejected
      amendment (or any other mutation) legitimately moved the order forward,
      so the staler writer's base is no longer current.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-create-stale-plant
    parent_entity: Plant
    write_endpoint: "POST /bakery/production-plans"
    occ_field: "expected_plant_version"
    description: |
      Creating a ProductionPlan for a bake_date supersedes any existing DRAFT
      plan for the same plant+bake_date; doing so against a Plant whose version
      has advanced since the client last observed it is rejected because the
      client's view of which plan is current is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: batch-schedule-stale-plan
    parent_entity: ProductionPlan
    write_endpoint: "POST /bakery/batches"
    occ_field: "expected_production_plan_version"
    description: |
      Scheduling a Batch appends to a ProductionPlan's line occupation and
      mutates the plan; doing so with a plan version the client read before
      another batch was scheduled is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_cutoff_window
    trigger: "StoreOrder confirm / request-amendment / lock"
    algorithm: threshold
    formula: |
      delivery_instant = parse(delivery_date) at 08:00:00Z  (DELIVERY_DAY_START_HOUR_UTC)
      cutoff = delivery_instant - store.lead_time_hours
      Allowed iff clock <= cutoff (equality allowed).
    input_set: "The target StoreOrder and its Store"
    constants:
      DELIVERY_DAY_START_HOUR_UTC: 8
    precision: "second precision on clock comparisons"

  - name: production_requirement
    trigger: "ProductionPlan lock"
    algorithm: constraint_propagation
    formula: |
      Pinned evaluation order (circular-looking dependency made explicit):
      1. gross_units[p] = sum of qty over lines of StoreOrders with
         status == LOCKED, store.plant_id == plan.plant_id,
         delivery_date == plan.bake_date, grouped by product p.
         (Tiers key on GROSS, never on planned — this pins the order.)
      2. buffer_pct[p] = 0.10 if gross < 1000; 0.07 if 1000 <= gross < 5000;
         0.05 if gross >= 5000.
      3. planned_units[p] = ceil(gross_units[p] * (1 + buffer_pct[p])).
      4. batches_required[p] = ceil(planned_units[p] / product.batch_capacity_units).
      5. flour_required_kg = round_half_up(
           sum_p( batches_required[p] * product.batch_capacity_units
                  * product.unit_weight_g * FLOUR_FRACTION ) / 1000, 1 decimal).
      total_planned_units = sum_p(planned_units[p]).
    input_set: "StoreOrders status LOCKED for the plant with delivery_date == bake_date"
    constants:
      FLOUR_FRACTION: 0.60
      TIER1_MAX_UNITS: 1000
      TIER2_MAX_UNITS: 5000
      TIER1_BUFFER_PCT: 0.10
      TIER2_BUFFER_PCT: 0.07
      TIER3_BUFFER_PCT: 0.05
    precision: "units integer (ceil); flour 1 decimal, round_half_up"

  - name: sanitation_changeover_minutes
    trigger: "SanitationCycle creation"
    algorithm: threshold
    formula: |
      matrix[from][to] minutes:
        same class (from == to): 0
        from == NONE, to != NONE: 30
        from != NONE, to == NONE: 120
        from != NONE, to != NONE, from != to: 90
      required_minutes = matrix[cycle.from_allergen_class][cycle.to_allergen_class]
    input_set: "The cycle's from/to allergen classes"
    constants:
      SAME_CLASS_MIN: 0
      NONE_TO_ALLERGEN_MIN: 30
      ALLERGEN_TO_NONE_MIN: 120
      ALLERGEN_TO_ALLERGEN_MIN: 90
    precision: "integer minutes"

  - name: batch_freshness_window
    trigger: "Batch complete-bake; RouteStop deliver"
    algorithm: decay_function
    formula: |
      fresh_until = batch.bake_completed_at + product.shelf_life_hours (hours)
      Deliverable at clock t iff t <= fresh_until - store.min_remaining_life_hours_on_delivery
      (equality allowed). For a stop, evaluate against min(fresh_until) over batch_ids.
      Thrift eligibility of a verified stale line: age_hours <= 48.
    input_set: "Batch + Product + Store for the stop"
    constants: {}
    precision: "second precision"

  - name: stocking_allocation
    trigger: "RouteStop deliver"
    algorithm: constraint_propagation
    formula: |
      stocked_units = min(delivered_units, max(0, store.shelf_capacity_units - on_shelf_units_observed))
      refused_units = delivered_units - stocked_units
      Conditional branch: if refused_units > 0, refused units are recorded at
      zero credit (immediate shrink against the route, no stale return created).
    input_set: "delivered_units, on_shelf_units_observed, store.shelf_capacity_units"
    constants: {}
    precision: "integer units"

  - name: stale_credit
    trigger: "StaleReturn creation (provisional) and verify/resolve-dispute (verified)"
    algorithm: tiered_pricing
    formula: |
      age_hours(line) = floor((pickup_clock - batch.bake_completed_at) / 3600)
      base_rate(age) = 1.00 if age <= 24; 0.50 if 25..48; 0.00 if > 48
      rate(line) = min(base_rate, 0.50) if store.stale_credit_tier == LIMITED else base_rate
      PINNED ROUNDING ORDER: round per line, THEN sum:
        line_credit = round_half_up(qty * product.base_price_cents * rate)
        credit_total = sum(line_credit)
      provisional variant: qty and batch from driver-declared `lines` at creation clock.
      verified variant: qty from QA `verified_lines`; age recomputed from batch at
        the ORIGINAL creation clock (pickup time is fixed at creation).
    input_set: "Return lines joined to Batch (bake_completed_at) and Product (base_price_cents)"
    constants:
      TIER1_MAX_AGE_HOURS: 24
      TIER2_MAX_AGE_HOURS: 48
      TIER1_RATE: 1.00
      TIER2_RATE: 0.50
      TIER3_RATE: 0.00
      LIMITED_TIER_RATE_CAP: 0.50
      CREDIT_CAP_CENTS: 50000
    precision: "2 decimal places (integer cents), round_half_up, per line then sum"
    variants:
      - name: provisional
        when: "At StaleReturn creation (driver at pickup)"
        difference: "Uses driver-declared line quantities"
      - name: verified
        when: "At QA verify / resolve-dispute"
        difference: "Uses QA-verified quantities; same rate table and rounding order"

  - name: surcharge_passthrough
    trigger: "SurchargeSchedule creation (provisional); IngredientIndex publish (final)"
    algorithm: tiered_pricing
    formula: |
      delta_pct(ing) = (index_value(ing) - plant.baseline(ing)) / plant.baseline(ing)
      surcharge_pct = product.flour_share_pct * delta_pct(FLOUR)
                    + product.butter_share_pct * delta_pct(BUTTER)
      surcharge_pct = clamp(surcharge_pct, 0.0, MAX_SURCHARGE_PCT)
      surcharge_cents = round_half_up(product.base_price_cents * surcharge_pct)
      provisional variant: index_value = IngredientIndex.forecast_value
      final variant:       index_value = IngredientIndex.published_value
    input_set: "Product, Plant baselines, FLOUR+BUTTER IngredientIndex for the period"
    constants:
      MAX_SURCHARGE_PCT: 0.15
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "Schedule creation; indices in FORECAST"
        difference: "Uses forecast_value"
      - name: final
        when: "Publish cascade finalizes the schedule"
        difference: "Uses published_value; Product.current_surcharge_cents is set to this value"

  - name: route_settlement_shrink
    trigger: "Route settle"
    algorithm: chronological
    formula: |
      Process stops in stop.created_at ASC order (tie-break only; sums are order-independent):
        delivered = sum(stop.delivered_units over DELIVERED/RECONCILED stops)
        refused   = sum(stop.refused_units)
        returned_stale = sum(qty over StaleReturn.lines of returns whose route_stop
                        belongs to this route and status != REJECTED)
      (returned_stale is OLD stock picked up at stops; it is tracked for the
       store stale ratio and is NOT part of this route's fresh load accounting.
       refused_units are a subset of delivered_units that bounced back to the
       plant, so they are not subtracted again.)
      shrink_units = loaded_units - delivered
      shrink_pct = shrink_units / max(1, loaded_units)
      If shrink_pct > SHRINK_HARD_LIMIT_PCT and no override: reject (ERR_SHRINK_LIMIT_EXCEEDED)
      liability_units = max(0, shrink_units - ceil(loaded_units * SHRINK_TOLERANCE_PCT))
        applicable only when shrink_pct > SHRINK_TOLERANCE_PCT, else 0
      shrink_liability_cents = liability_units * SHRINK_PENALTY_CENTS_PER_UNIT
    input_set: "Route stops in DELIVERED/RECONCILED/SKIPPED and non-REJECTED StaleReturns on those stops"
    constants:
      SHRINK_TOLERANCE_PCT: 0.02
      SHRINK_HARD_LIMIT_PCT: 0.10
      SHRINK_PENALTY_CENTS_PER_UNIT: 150
    precision: "integer units and cents"

  - name: thrift_stock_pool
    trigger: "StaleReturn verify / ThriftSale create / ThriftSale void"
    algorithm: aggregation
    formula: |
      inflow[p]  = sum(qty over verified_lines of StaleReturns with
                   status IN {VERIFIED, DISPUTED, CREDITED, REVERSED}
                   whose line batch is product p and rate(line) > 0)
      outflow[p] = sum(units over ThriftSales of product p with status == RECORDED)
      available[p] = inflow[p] - outflow[p]
      Conservation invariant: a RECORDED sale of u units followed by its void
      leaves available[p] unchanged (outflow cancels).
    input_set: "StaleReturns by store's plant and ThriftSales by product"
    constants: {}
    precision: "integer units"

  - name: store_stale_ratio_suspension
    trigger: "StaleReturn verify; Route settle; Plant close_day"
    algorithm: threshold
    formula: |
      stale_ratio = store.lifetime_stale_units / max(1, store.lifetime_delivered_units)
      At close_day: if stale_ratio > 0.15 and store.status == ACTIVE -> SUSPENDED
      (strictly greater than; ratio exactly 0.15 does NOT suspend)
    input_set: "Store lifetime counters"
    constants:
      SUSPENSION_STALE_RATIO: 0.15
    precision: "ratio compared as exact rational (no rounding)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for endpoint; entity-backed ownership (Driver X-User-ID == route.driver_id; StoreReceiver X-User-ID == order/return store_id)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every id in path and body exists (plant, product, store, driver, line, order, plan, batch, cycle, route, stop, return, sale, index, schedule)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "Request shape: required fields present, enums valid, qty/price/capacity positive, dates parseable, batch_ids non-empty when required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: state
    check: "OCC: on endpoints declaring expected_<parent>_version, the supplied version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bakery/store-orders/{id}/request-amendment, POST /bakery/production-plans, POST /bakery/batches"
  - priority: 6
    category: state
    check: "Target resource in a valid from-state for the transition (incl. plan released before batch start-mix, stop DELIVERED before stale return credit-chain, batches RELEASED before deliver)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints
  - priority: 7
    category: business_safety
    check: "Allergen segregation & sanitation & segregation-of-duties: batch allergen class vs DIRTY line residue class without VERIFIED cycle; pending cycle blocks plan release; verifier != starter / releaser != baker / verifier != recording driver"
    error_id: "ERR_ALLERGEN_SEGREGATION_VIOLATION | ERR_SANITATION_REQUIRED | ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "POST /bakery/batches, plan release, sanitation verify, batch release, stale verify"
  - priority: 8
    category: business_temporal
    check: "Clock windows: order cutoff, proof window, freshness window, return window (age <= 72h), line half-open overlap, driver 30-min rest buffer"
    error_id: "ERR_ORDER_CUTOFF_PASSED | ERR_PROOF_WINDOW_VIOLATION | ERR_FRESHNESS_WINDOW_VIOLATION | ERR_RETURN_WINDOW_CLOSED | ERR_LINE_SCHEDULE_OVERLAP | ERR_DRIVER_WINDOW_OVERLAP | ERR_SANITATION_NOT_COMPLETE"
    http_status: 409
    applies_to: "order confirm/amend/lock, batch start-bake, stop deliver, stale create, batch create, route create"
  - priority: 9
    category: business_referential
    check: "Referenced-entity state and uniqueness: store ACTIVE, stop planned == order total, one non-SUPERSEDED plan per plant+bake_date, driver window registration, route settleable, indices present for schedule"
    error_id: "ERR_STORE_SUSPENDED | ERR_PLANNED_QTY_MISMATCH | ERR_DUPLICATE_PLAN_DATE | ERR_STOPS_NOT_LOCKED | ERR_INDEX_NOT_PUBLISHED | ERR_LINE_NOT_AVAILABLE | ERR_THRIFT_STOCK_UNAVAILABLE"
    http_status: 409
    applies_to: "order create/confirm, stop create, plan create, route create/settle, surcharge create"
  - priority: 10
    category: business_fiscal
    check: "Caps and floors: credit cap 50000, thrift floor, truck capacity, shrink hard limit, batch qty <= product batch capacity"
    error_id: "ERR_STALE_CREDIT_CAP_EXCEEDED | ERR_THRIFT_PRICE_BELOW_FLOOR | ERR_ROUTE_CAPACITY_EXCEEDED | ERR_SHRINK_LIMIT_EXCEEDED | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "stale credit, thrift create, route dispatch/settle, batch create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced"]

  # --- Plant ---
  - method: POST
    path: "/bakery/plants"
    description: "Create a plant"
    roles: [PlantAdmin]
    code: 201
    input: [name, baseline_flour_index, baseline_butter_index]
    output: Plant
    side_effects: ["day_index=0"]
  - method: GET
    path: "/bakery/plants/{id}"
    description: "Get a plant"
    roles: [Any]
    code: 200
    input: []
    output: Plant
    side_effects: []
  - method: GET
    path: "/bakery/plants"
    description: "List plants"
    roles: [Any]
    code: 200
    input: []
    output: Plant[]
    side_effects: []
  - method: POST
    path: "/bakery/plants/{id}/close_day"
    description: "Ops-run checkpoint: advance day, auto-overproof stale batches, auto-suspend high-stale stores"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: Plant
    side_effects:
      - "day_index += 1; increments Plant.version by 1"
      - "Batches in PROOFING past 120 min -> OVERPROOFED"
      - "Stores with stale_ratio > 0.15 -> SUSPENDED"

  # --- Product ---
  - method: POST
    path: "/bakery/products"
    description: "Create a product"
    roles: [PlantAdmin]
    code: 201
    input: [plant_id, sku, name, allergen_class, unit_weight_g, shelf_life_hours, base_price_cents, flour_share_pct, butter_share_pct, batch_capacity_units]
    output: Product
    side_effects: ["current_surcharge_cents=0"]
  - method: GET
    path: "/bakery/products/{id}"
    description: "Get a product"
    roles: [Any]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/bakery/products"
    description: "List products"
    roles: [Any]
    code: 200
    input: ["plant_id?"]
    output: Product[]
    side_effects: []

  # --- Store ---
  - method: POST
    path: "/bakery/stores"
    description: "Create a store"
    roles: [PlantAdmin]
    code: 201
    input: [plant_id, name, lead_time_hours, min_remaining_life_hours_on_delivery, shelf_capacity_units, "stale_credit_tier?"]
    output: Store
    side_effects: ["status=ACTIVE; credit_balance_cents=0"]
  - method: GET
    path: "/bakery/stores/{id}"
    description: "Get a store"
    roles: [Any]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: GET
    path: "/bakery/stores"
    description: "List stores"
    roles: [Any]
    code: 200
    input: ["plant_id?", "status?"]
    output: Store[]
    side_effects: []
  - method: POST
    path: "/bakery/stores/{id}/suspend"
    description: "Suspend a store (credit hold)"
    roles: [PlantAdmin]
    code: 200
    input: [reason]
    output: Store
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/bakery/stores/{id}/reinstate"
    description: "Reinstate a suspended store"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: Store
    side_effects: ["status -> ACTIVE"]

  # --- Driver ---
  - method: POST
    path: "/bakery/drivers"
    description: "Create a driver"
    roles: [PlantAdmin]
    code: 201
    input: [plant_id, name, "max_daily_drive_minutes?"]
    output: Driver
    side_effects: ["status=ACTIVE; shrink_liability_cents=0"]
  - method: GET
    path: "/bakery/drivers/{id}"
    description: "Get a driver"
    roles: [Any]
    code: 200
    input: []
    output: Driver
    side_effects: []
  - method: GET
    path: "/bakery/drivers"
    description: "List drivers"
    roles: [Any]
    code: 200
    input: ["plant_id?"]
    output: Driver[]
    side_effects: []

  # --- Line ---
  - method: POST
    path: "/bakery/lines"
    description: "Create a production line"
    roles: [PlantAdmin]
    code: 201
    input: [plant_id, line_code, hourly_capacity_units]
    output: Line
    side_effects: ["cleanliness=CLEAN; allergen_class_current=NONE"]
  - method: GET
    path: "/bakery/lines/{id}"
    description: "Get a line"
    roles: [Any]
    code: 200
    input: []
    output: Line
    side_effects: []
  - method: GET
    path: "/bakery/lines"
    description: "List lines"
    roles: [Any]
    code: 200
    input: ["plant_id?"]
    output: Line[]
    side_effects: []

  # --- StoreOrder ---
  - method: POST
    path: "/bakery/store-orders"
    description: "Place a store order"
    roles: [Planner, PlantAdmin]
    code: 201
    input: [store_id, delivery_date, lines]
    output: StoreOrder
    side_effects: ["status=PLACED; placed_at=clock"]
  - method: GET
    path: "/bakery/store-orders/{id}"
    description: "Get a store order"
    roles: [Any]
    code: 200
    input: []
    output: StoreOrder
    side_effects: []
  - method: GET
    path: "/bakery/store-orders"
    description: "List store orders"
    roles: [Any]
    code: 200
    input: ["store_id?", "plant_id?", "status?"]
    output: StoreOrder[]
    side_effects: []
  - method: POST
    path: "/bakery/store-orders/{id}/confirm"
    description: "Confirm an order (cutoff + store checks)"
    roles: [Planner]
    code: 200
    input: []
    output: StoreOrder
    side_effects: ["PLACED -> CONFIRMED; confirmed_at=clock"]
  - method: POST
    path: "/bakery/store-orders/{id}/request-amendment"
    description: "Store requests line amendment (OCC on order version)"
    roles: [StoreReceiver]
    code: 200
    input: [lines, expected_store_order_version]
    output: StoreOrder
    side_effects: ["CONFIRMED -> AMENDMENT_PENDING; pending_lines set; increments StoreOrder.version by 1"]
  - method: POST
    path: "/bakery/store-orders/{id}/accept-amendment"
    description: "Planner accepts amended lines"
    roles: [Planner]
    code: 200
    input: []
    output: StoreOrder
    side_effects: ["AMENDMENT_PENDING -> CONFIRMED with pending_lines; total_units recomputed"]
  - method: POST
    path: "/bakery/store-orders/{id}/reject-amendment"
    description: "Planner rejects amended lines"
    roles: [Planner]
    code: 200
    input: []
    output: StoreOrder
    side_effects: ["AMENDMENT_PENDING -> CONFIRMED with original lines"]
  - method: POST
    path: "/bakery/store-orders/{id}/lock"
    description: "Lock an order for production planning"
    roles: [Planner]
    code: 200
    input: []
    output: StoreOrder
    side_effects: ["CONFIRMED -> LOCKED"]
  - method: POST
    path: "/bakery/store-orders/{id}/cancel"
    description: "Cancel an order"
    roles: [Planner]
    code: 200
    input: []
    output: StoreOrder
    side_effects: ["PLACED/CONFIRMED -> CANCELLED"]

  # --- ProductionPlan ---
  - method: POST
    path: "/bakery/production-plans"
    description: "Create a production plan (supersedes existing DRAFT for same plant+bake_date; OCC on plant version)"
    roles: [Planner]
    code: 201
    input: [plant_id, bake_date, expected_plant_version]
    output: ProductionPlan
    side_effects:
      - "Existing DRAFT plan for same plant+bake_date -> SUPERSEDED"
      - "Increments Plant.version by 1"
  - method: GET
    path: "/bakery/production-plans/{id}"
    description: "Get a production plan"
    roles: [Any]
    code: 200
    input: []
    output: ProductionPlan
    side_effects: []
  - method: GET
    path: "/bakery/production-plans"
    description: "List production plans"
    roles: [Any]
    code: 200
    input: ["plant_id?", "status?"]
    output: ProductionPlan[]
    side_effects: []
  - method: POST
    path: "/bakery/production-plans/{id}/lock"
    description: "Lock plan and compute requirements"
    roles: [Planner]
    code: 200
    input: []
    output: ProductionPlan
    side_effects: ["DRAFT -> LOCKED; runs production_requirement"]
  - method: POST
    path: "/bakery/production-plans/{id}/unlock"
    description: "Revert a locked plan to draft"
    roles: [Planner]
    code: 200
    input: [reason]
    output: ProductionPlan
    side_effects: ["LOCKED -> DRAFT; requirement fields cleared"]
  - method: POST
    path: "/bakery/production-plans/{id}/release"
    description: "Release plan to the floor"
    roles: [Planner]
    code: 200
    input: []
    output: ProductionPlan
    side_effects: ["LOCKED -> RELEASED"]
  - method: POST
    path: "/bakery/production-plans/{id}/reconcile"
    description: "Reconcile a fully-terminal plan"
    roles: [Planner]
    code: 200
    input: []
    output: ProductionPlan
    side_effects: ["RELEASED -> RECONCILED"]

  # --- Batch ---
  - method: POST
    path: "/bakery/batches"
    description: "Schedule a batch on a line (OCC on plan version)"
    roles: [Planner]
    code: 201
    input: [production_plan_id, line_id, product_id, qty_units, scheduled_start_at, scheduled_end_at, expected_production_plan_version]
    output: Batch
    side_effects:
      - "status=SCHEDULED; increments ProductionPlan.version by 1"
      - "Checks: plan LOCKED/RELEASED, qty <= batch_capacity, line half-open overlap, allergen segregation"
  - method: GET
    path: "/bakery/batches/{id}"
    description: "Get a batch"
    roles: [Any]
    code: 200
    input: []
    output: Batch
    side_effects: []
  - method: GET
    path: "/bakery/batches"
    description: "List batches"
    roles: [Any]
    code: 200
    input: ["production_plan_id?", "line_id?", "product_id?", "status?"]
    output: Batch[]
    side_effects: []
  - method: POST
    path: "/bakery/batches/{id}/start-mix"
    description: "Start mixing"
    roles: [LineOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["SCHEDULED -> MIXING; mix_started_at=clock"]
  - method: POST
    path: "/bakery/batches/{id}/start-proof"
    description: "Start proofing"
    roles: [LineOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["MIXING -> PROOFING; proof_started_at=clock"]
  - method: POST
    path: "/bakery/batches/{id}/start-bake"
    description: "Start baking (proof window enforced)"
    roles: [LineOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["PROOFING -> BAKING"]
  - method: POST
    path: "/bakery/batches/{id}/complete-bake"
    description: "Complete baking (starts staling clock)"
    roles: [LineOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["BAKING -> COOLING; bake_completed_at=clock; line allergen/dirty update"]
  - method: POST
    path: "/bakery/batches/{id}/release"
    description: "QA release (segregation of duties vs baker)"
    roles: [QALead]
    code: 200
    input: []
    output: Batch
    side_effects: ["COOLING -> RELEASED"]
  - method: POST
    path: "/bakery/batches/{id}/reject"
    description: "QA reject (cascades to plan, stops, orders)"
    roles: [QALead]
    code: 200
    input: [reason]
    output: Batch
    side_effects: ["-> REJECTED; plan shortfall; stop shortfall_flag; order SHORTED"]
  - method: POST
    path: "/bakery/batches/{id}/abort"
    description: "Abort a scheduled batch"
    roles: [Planner]
    code: 200
    input: []
    output: Batch
    side_effects: ["SCHEDULED -> ABORTED"]

  # --- SanitationCycle ---
  - method: POST
    path: "/bakery/sanitation-cycles"
    description: "Request a sanitation changeover cycle"
    roles: [LineOperator]
    code: 201
    input: [line_id, to_allergen_class]
    output: SanitationCycle
    side_effects: ["status=REQUESTED; from_allergen_class=line current; required_minutes computed"]
  - method: GET
    path: "/bakery/sanitation-cycles/{id}"
    description: "Get a sanitation cycle"
    roles: [Any]
    code: 200
    input: []
    output: SanitationCycle
    side_effects: []
  - method: GET
    path: "/bakery/sanitation-cycles"
    description: "List sanitation cycles"
    roles: [Any]
    code: 200
    input: ["line_id?", "status?"]
    output: SanitationCycle[]
    side_effects: []
  - method: POST
    path: "/bakery/sanitation-cycles/{id}/start"
    description: "Start (or restart after FAIL) a cycle"
    roles: [LineOperator]
    code: 200
    input: []
    output: SanitationCycle
    side_effects: ["REQUESTED/FAILED -> IN_PROGRESS; line SANITIZING"]
  - method: POST
    path: "/bakery/sanitation-cycles/{id}/verify"
    description: "QA verify a completed cycle"
    roles: [QALead]
    code: 200
    input: []
    output: SanitationCycle
    side_effects: ["IN_PROGRESS -> VERIFIED; line CLEAN with new allergen class"]
  - method: POST
    path: "/bakery/sanitation-cycles/{id}/fail"
    description: "QA fail a cycle"
    roles: [QALead]
    code: 200
    input: []
    output: SanitationCycle
    side_effects: ["IN_PROGRESS -> FAILED; line back to DIRTY"]

  # --- Route ---
  - method: POST
    path: "/bakery/routes"
    description: "Create a route (driver rest-buffer overlap enforced)"
    roles: [Planner]
    code: 201
    input: [plant_id, driver_id, route_date, window_start_at, window_end_at, truck_capacity_units]
    output: Route
    side_effects: ["status=PLANNED"]
  - method: GET
    path: "/bakery/routes/{id}"
    description: "Get a route"
    roles: [Any]
    code: 200
    input: []
    output: Route
    side_effects: []
  - method: GET
    path: "/bakery/routes"
    description: "List routes"
    roles: [Any]
    code: 200
    input: ["plant_id?", "driver_id?", "route_date?"]
    output: Route[]
    side_effects: []
  - method: POST
    path: "/bakery/routes/{id}/start-loading"
    description: "Begin loading; freezes loaded_units"
    roles: [Driver]
    code: 200
    input: []
    output: Route
    side_effects: ["PLANNED -> LOADING; loaded_units = sum planned"]
  - method: POST
    path: "/bakery/routes/{id}/dispatch"
    description: "Dispatch the truck (capacity enforced)"
    roles: [Driver]
    code: 200
    input: []
    output: Route
    side_effects: ["LOADING -> DISPATCHED"]
  - method: POST
    path: "/bakery/routes/{id}/complete"
    description: "Complete the route"
    roles: [Driver]
    code: 200
    input: []
    output: Route
    side_effects: ["DISPATCHED -> COMPLETED"]
  - method: POST
    path: "/bakery/routes/{id}/settle"
    description: "Settle route: shrink + driver liability"
    roles: [Planner]
    code: 200
    input: ["override_shrink_limit?"]
    output: Route
    side_effects: ["COMPLETED -> SETTLED; runs route_settlement_shrink; driver liability accrued; store lifetime delivered accrued"]
  - method: POST
    path: "/bakery/routes/{id}/cancel"
    description: "Cancel a planned route"
    roles: [Planner]
    code: 200
    input: []
    output: Route
    side_effects: ["PLANNED -> CANCELLED"]

  # --- RouteStop ---
  - method: POST
    path: "/bakery/route-stops"
    description: "Add a stop to a route"
    roles: [Planner]
    code: 201
    input: [route_id, store_order_id, planned_units, batch_ids]
    output: RouteStop
    side_effects:
      - "status=PENDING; store_id copied from order"
      - "Requires Route.status == PLANNED and StoreOrder.status IN {CONFIRMED, LOCKED, SHORTED} (else ERR_INVALID_STATE)"
      - "Requires planned_units == StoreOrder.total_units (else ERR_PLANNED_QTY_MISMATCH)"
      - "Requires every batch in batch_ids RELEASED and covering all order-line products (else ERR_INVALID_REQUEST)"
  - method: GET
    path: "/bakery/route-stops/{id}"
    description: "Get a stop"
    roles: [Any]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: GET
    path: "/bakery/route-stops"
    description: "List stops"
    roles: [Any]
    code: 200
    input: ["route_id?", "store_id?", "store_order_id?", "status?"]
    output: RouteStop[]
    side_effects: []
  - method: POST
    path: "/bakery/route-stops/{id}/deliver"
    description: "Driver delivers and stocks shelf"
    roles: [Driver]
    code: 200
    input: [delivered_units, on_shelf_units_observed]
    output: RouteStop
    side_effects: ["PENDING -> DELIVERED; runs stocking_allocation; route delivered/refused accrued"]
  - method: POST
    path: "/bakery/route-stops/{id}/skip"
    description: "Skip a stop (store closed)"
    roles: [Driver]
    code: 200
    input: [reason]
    output: RouteStop
    side_effects: ["PENDING -> SKIPPED"]
  - method: POST
    path: "/bakery/route-stops/{id}/reconcile"
    description: "Reconcile a delivered stop"
    roles: [Planner]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["DELIVERED -> RECONCILED; order -> FULFILLED/PARTIALLY_FULFILLED"]

  # --- StaleReturn ---
  - method: POST
    path: "/bakery/stale-returns"
    description: "Driver records a stale pickup (provisional credit)"
    roles: [Driver]
    code: 201
    input: [store_id, route_stop_id, lines]
    output: StaleReturn
    side_effects: ["status=PENDING_VERIFICATION; provisional_credit_cents computed; recorded_by_driver_id=X-User-ID; route returned_stale_units accrued"]
  - method: GET
    path: "/bakery/stale-returns/{id}"
    description: "Get a stale return"
    roles: [Any]
    code: 200
    input: []
    output: StaleReturn
    side_effects: []
  - method: GET
    path: "/bakery/stale-returns"
    description: "List stale returns"
    roles: [Any]
    code: 200
    input: ["store_id?", "route_stop_id?", "status?"]
    output: StaleReturn[]
    side_effects: []
  - method: POST
    path: "/bakery/stale-returns/{id}/verify"
    description: "QA verifies quantities (final credit)"
    roles: [QALead]
    code: 200
    input: [verified_lines]
    output: StaleReturn
    side_effects: ["PENDING_VERIFICATION -> VERIFIED; final_credit_cents; store lifetime_stale_units accrued"]
  - method: POST
    path: "/bakery/stale-returns/{id}/dispute"
    description: "Store disputes a verified return"
    roles: [StoreReceiver]
    code: 200
    input: []
    output: StaleReturn
    side_effects: ["VERIFIED -> DISPUTED"]
  - method: POST
    path: "/bakery/stale-returns/{id}/resolve-dispute"
    description: "QA re-verifies after dispute (negotiation round)"
    roles: [QALead]
    code: 200
    input: [verified_lines]
    output: StaleReturn
    side_effects: ["DISPUTED -> VERIFIED; dispute_round += 1; final_credit_cents recomputed"]
  - method: POST
    path: "/bakery/stale-returns/{id}/credit"
    description: "Apply credit to store balance"
    roles: [Planner]
    code: 200
    input: []
    output: StaleReturn
    side_effects: ["VERIFIED -> CREDITED; store.credit_balance_cents += final_credit_cents"]
  - method: POST
    path: "/bakery/stale-returns/{id}/reverse-credit"
    description: "Reverse an applied credit (compensating action)"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: StaleReturn
    side_effects: ["CREDITED -> REVERSED; store.credit_balance_cents -= credited_amount_cents"]
  - method: POST
    path: "/bakery/stale-returns/{id}/reject"
    description: "QA rejects a pending return"
    roles: [QALead]
    code: 200
    input: [reason]
    output: StaleReturn
    side_effects: ["PENDING_VERIFICATION -> REJECTED"]

  # --- ThriftSale ---
  - method: POST
    path: "/bakery/thrift-sales"
    description: "Record a thrift-outlet sale of distressed stock"
    roles: [ThriftClerk]
    code: 201
    input: [product_id, units, unit_price_cents]
    output: ThriftSale
    side_effects: ["status=RECORDED; total_cents computed; stock pool debited"]
  - method: GET
    path: "/bakery/thrift-sales/{id}"
    description: "Get a thrift sale"
    roles: [Any]
    code: 200
    input: []
    output: ThriftSale
    side_effects: []
  - method: GET
    path: "/bakery/thrift-sales"
    description: "List thrift sales"
    roles: [Any]
    code: 200
    input: ["plant_id?", "product_id?", "status?"]
    output: ThriftSale[]
    side_effects: []
  - method: POST
    path: "/bakery/thrift-sales/{id}/void"
    description: "Void a thrift sale (restores pool)"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: ThriftSale
    side_effects: ["RECORDED -> VOIDED; stock pool credited back"]

  # --- IngredientIndex ---
  - method: POST
    path: "/bakery/ingredient-indices"
    description: "Create a forecast ingredient index"
    roles: [PricingAnalyst]
    code: 201
    input: [plant_id, ingredient, period, forecast_value]
    output: IngredientIndex
    side_effects: ["status=FORECAST"]
  - method: GET
    path: "/bakery/ingredient-indices/{id}"
    description: "Get an ingredient index"
    roles: [Any]
    code: 200
    input: []
    output: IngredientIndex
    side_effects: []
  - method: GET
    path: "/bakery/ingredient-indices"
    description: "List ingredient indices"
    roles: [Any]
    code: 200
    input: ["plant_id?", "ingredient?", "period?"]
    output: IngredientIndex[]
    side_effects: []
  - method: POST
    path: "/bakery/ingredient-indices/{id}/publish"
    description: "Publish an index (finalizes schedules, updates product surcharges)"
    roles: [PricingAnalyst]
    code: 200
    input: [published_value]
    output: IngredientIndex
    side_effects: ["FORECAST -> PUBLISHED; surcharge finalize cascade"]

  # --- SurchargeSchedule ---
  - method: POST
    path: "/bakery/surcharge-schedules"
    description: "Create a provisional surcharge schedule from forecast indices"
    roles: [PricingAnalyst]
    code: 201
    input: [product_id, period]
    output: SurchargeSchedule
    side_effects: ["status=PROVISIONAL; provisional_surcharge_cents computed"]
  - method: GET
    path: "/bakery/surcharge-schedules/{id}"
    description: "Get a surcharge schedule"
    roles: [Any]
    code: 200
    input: []
    output: SurchargeSchedule
    side_effects: []
  - method: GET
    path: "/bakery/surcharge-schedules"
    description: "List surcharge schedules"
    roles: [Any]
    code: 200
    input: ["product_id?", "period?", "status?"]
    output: SurchargeSchedule[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not allowed for endpoint, or entity-backed ownership mismatch (wrong driver/store)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, non-positive qty/price/capacity, unparseable datetime, batch qty exceeds product batch_capacity_units" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition (incl. terminal-state lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_ORDER_CUTOFF_PASSED, http: 409, condition: "Clock is past delivery_instant - store.lead_time_hours" }
  - { id: ERR_DUPLICATE_PLAN_DATE, http: 409, condition: "A non-DRAFT plan already exists for this plant+bake_date" }
  - { id: ERR_PLAN_NOT_RELEASABLE, http: 409, condition: "Plan has no SCHEDULED batch at release, or batches already started at unlock" }
  - { id: ERR_SANITATION_REQUIRED, http: 409, condition: "A required sanitation cycle is REQUESTED/IN_PROGRESS (plan release or allergen changeover in flight)" }
  - { id: ERR_ALLERGEN_SEGREGATION_VIOLATION, http: 409, condition: "Scheduling a batch whose allergen class differs from a DIRTY line's residue class with no VERIFIED changeover" }
  - { id: ERR_SANITATION_NOT_COMPLETE, http: 409, condition: "Verify attempted before required_minutes elapsed" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user may not perform both sides of a controlled step (bake/release, start/verify sanitation, record/verify return)" }
  - { id: ERR_PROOF_WINDOW_VIOLATION, http: 409, condition: "start-bake outside 60..120 minutes after proof start" }
  - { id: ERR_LINE_SCHEDULE_OVERLAP, http: 409, condition: "Batch half-open interval [start,end) collides with another SCHEDULED/active batch on the same line" }
  - { id: ERR_LINE_NOT_AVAILABLE, http: 409, condition: "Line is SANITIZING when a batch is scheduled against it" }
  - { id: ERR_DRIVER_WINDOW_OVERLAP, http: 409, condition: "Driver already has a route whose window is within 30 minutes of the requested window" }
  - { id: ERR_STORE_SUSPENDED, http: 409, condition: "Store SUSPENDED blocks order confirm and credit application" }
  - { id: ERR_STOPS_NOT_LOCKED, http: 409, condition: "start-loading requires every stop's order LOCKED or SHORTED" }
  - { id: ERR_PLANNED_QTY_MISMATCH, http: 409, condition: "Stop planned_units != StoreOrder.total_units" }
  - { id: ERR_FRESHNESS_WINDOW_VIOLATION, http: 409, condition: "Delivery would occur after min(batch.fresh_until) - store.min_remaining_life_hours_on_delivery" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 409, condition: "Stale pickup more than 72h after bake_completed_at" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 409, condition: "loaded_units > truck_capacity_units at dispatch" }
  - { id: ERR_SHRINK_LIMIT_EXCEEDED, http: 409, condition: "shrink_pct > 0.10 at settle without override_shrink_limit" }
  - { id: ERR_STALE_CREDIT_CAP_EXCEEDED, http: 409, condition: "final_credit_cents > 50000" }
  - { id: ERR_THRIFT_PRICE_BELOW_FLOOR, http: 409, condition: "unit_price_cents < ceil(base_price_cents * 0.50)" }
  - { id: ERR_THRIFT_STOCK_UNAVAILABLE, http: 409, condition: "Requested units exceed thrift_stock_pool available for the product" }
  - { id: ERR_INDEX_NOT_PUBLISHED, http: 409, condition: "Required FLOUR/BUTTER index for the period missing or not in the required status" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant superuser: master data, clock, close_day, suspensions, voids, credit reversals"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /bakery/plants, /bakery/products, /bakery/stores, /bakery/drivers, /bakery/lines"
      - "POST /bakery/plants/{id}/close_day"
      - "POST /bakery/stores/{id}/suspend and /reinstate"
      - "POST /bakery/thrift-sales/{id}/void"
      - "POST /bakery/stale-returns/{id}/reverse-credit"
    shared_operations:
      - "POST /bakery/store-orders (with Planner)"
      - "All GET endpoints"
  - name: Planner
    description: "Production/distribution planner: orders, plans, batch scheduling, routes, stops, settlement, credit application"
    identity: opaque
    exclusive_operations:
      - "POST /bakery/store-orders/{id}/confirm, /lock, /cancel, /accept-amendment, /reject-amendment"
      - "POST /bakery/production-plans and /lock, /unlock, /release, /reconcile"
      - "POST /bakery/batches and /abort"
      - "POST /bakery/routes and /cancel; POST /bakery/route-stops and /reconcile; POST /bakery/routes/{id}/settle"
      - "POST /bakery/stale-returns/{id}/credit"
    shared_operations:
      - "POST /bakery/store-orders (with PlantAdmin)"
      - "All GET endpoints"
  - name: LineOperator
    description: "Runs the mix/proof/bake line and executes sanitation"
    identity: opaque
    exclusive_operations:
      - "POST /bakery/batches/{id}/start-mix, /start-proof, /start-bake, /complete-bake"
      - "POST /bakery/sanitation-cycles and /start"
    shared_operations: ["All GET endpoints"]
  - name: QALead
    description: "Quality assurance: releases/rejects batches, verifies/fails sanitation, verifies stale returns. Must differ from the executing operator/driver (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /bakery/batches/{id}/release, /reject"
      - "POST /bakery/sanitation-cycles/{id}/verify, /fail"
      - "POST /bakery/stale-returns/{id}/verify, /resolve-dispute, /reject"
    shared_operations: ["All GET endpoints"]
  - name: Driver
    description: "Route driver: loads, dispatches, delivers, stocks shelves, records stale pickups"
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /bakery/routes/{id}/start-loading, /dispatch, /complete"
      - "POST /bakery/route-stops/{id}/deliver, /skip"
      - "POST /bakery/stale-returns"
    shared_operations: ["All GET endpoints"]
  - name: StoreReceiver
    description: "Store-side receiver: requests order amendments, disputes stale credits"
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /bakery/store-orders/{id}/request-amendment"
      - "POST /bakery/stale-returns/{id}/dispute"
    shared_operations: ["All GET endpoints"]
  - name: ThriftClerk
    description: "Thrift outlet clerk: records outlet sales"
    identity: opaque
    exclusive_operations:
      - "POST /bakery/thrift-sales"
    shared_operations: ["All GET endpoints"]
  - name: PricingAnalyst
    description: "Pricing: ingredient indices and surcharge schedules"
    identity: opaque
    exclusive_operations:
      - "POST /bakery/ingredient-indices and /publish"
      - "POST /bakery/surcharge-schedules"
    shared_operations: ["All GET endpoints"]
  - name: Any
    description: "Shared read access across all roles"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET endpoints"]
