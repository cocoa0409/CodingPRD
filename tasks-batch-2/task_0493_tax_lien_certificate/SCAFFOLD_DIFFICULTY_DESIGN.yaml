      - name: bid_hold_release_conserves_investor_escrow
        grounds:
          - calculations.investor_escrow
          - state_machines.Bid.PLACED_to_LOST
          - state_machines.SaleListing.LISTED_to_SOLD
          - entities.Investor.fields.escrow_balance_cents
        distinguishing_aspect: "Conserved quantity = a losing investor's escrow: a PLACED bid holds 100000 then the LOST transition releases exactly that hold, restoring escrow to the pre-bid 150000 (deposit_total 150000 unchanged) — a different conserved quantity (escrow cash) than deed-sale proceeds."
        test_recipe:
          setup:
            - "County, parcel, sale OPEN with one listing. I1 (escrow 200000) bids 1100bps; I2 (escrow 150000) bids 1200bps. Lower rate wins, so I1 wins and I2 LOSES."
