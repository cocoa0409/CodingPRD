            - "ChefAssignment.${chef1_id}.status == ON_STATION after ROTATE_SUPPRESS — the machine has returned to a state it already occupied"
            - "sequence_index_after == 2, i.e. 1 + the highest sequence_index among the ON_STATION chefs, and NOT the 1 the chef held before the cycle"
            - "a second ChefAssignment is refused the same station_zone while one is ON_STATION: POST /chefs/${chef2_id}/events with CLOCK_IN and station_zone ZONE_A would answer 409 ERR_STATION_OCCUPIED"
            - "ChefAssignment.${chef1_id}.completed_show_count is unchanged by the cycle — ROTATE_SUPPRESS does not post a show"

      - name: show_parallel_dessert_and_celebration_phases_same_table
        grounds:
