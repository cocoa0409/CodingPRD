      - name: per_certificate_limit_and_commodity_share_reject_at_different_moments
        claim_type: violation_to_error
        grounds:
          - validations.priority_18
          - validations.priority_20
          - errors.ERR_COMMODITY_SHARE_EXCEEDED
          - errors.ERR_CERTIFICATE_LIMIT_EXCEEDED
          - calculations.accumulation_exposure_check
        distinguishing_aspect: |
          Two limits that both look like "the line is too big" fire in different
          places: the commodity share cap (round(conveyance_limit *
          max_conveyance_share_pct, 2) = 1500000.00 on a 0.50 class) is checked
          at CREATION, so no DRAFT row is even persisted, while the
          per-certificate limit is checked at ISSUE on a row that already exists.
