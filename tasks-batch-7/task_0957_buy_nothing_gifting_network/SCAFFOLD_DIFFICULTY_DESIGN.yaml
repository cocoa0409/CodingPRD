              as: Member
              as_user_id: "${g_m_id}"
              captures: { err: $.data.error_id }
            - call: "POST /v1/pickup-plans"
              payload: { claim_id: "${c2}", window_start: "2026-05-11T11:15:00Z", window_end: "2026-05-11T12:15:00Z" }
