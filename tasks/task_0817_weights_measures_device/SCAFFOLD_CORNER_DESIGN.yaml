# =============================================================================
# task_0817_weights_measures_device — §1.9 Scaffold Corner Design
# Breadth coverage of testable claims not already probed by §1.8
# =============================================================================
scaffold_corner_design:

  # ---------------- Entities ----------------
  - section: entities
    instances:
      - name: establishment_create_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Establishment, endpoints]
        distinguishing_aspect: "POST /establishments with name + jurisdiction returns 201 and a body with status ACTIVE, balance_due_cents 0, sealed_device_count 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /establishments", payload: { name: "New Store", jurisdiction: "CA-20" }, as: ProgramAdmin, captures: { est_id: "$.data.id", est_status: "$.data.status" } }
          assert:
            - "response code 201; Establishment.${est_id}.status == ACTIVE"
            - "Establishment.${est_id}.balance_due_cents == 0 and sealed_device_count == 0"

      - name: device_create_missing_required_returns_validation
        claim_type: Required Fields
        grounds: [entities.Device.fields.device_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /devices omitting the required device_type returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One establishment."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Val Store", jurisdiction: "CA-21" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
          trigger:
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", serial_number: "SN-NO-TYPE" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_VALIDATION (400)"]

      - name: device_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Device, "errors[ERR_DEVICE_NOT_FOUND]"]
        distinguishing_aspect: "GET /devices/{unknown-uuid} returns ERR_DEVICE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /devices/00000000-0000-0000-0000-000000000000", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_DEVICE_NOT_FOUND (404)"]

      - name: device_default_class_applied
        claim_type: Defaults
        grounds: [entities.Device.fields.device_class]
        distinguishing_aspect: "Registering a device without device_class defaults it to CLASS_III."
        test_recipe:
          setup: ["One establishment."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Def Store", jurisdiction: "CA-22" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
          trigger:
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-DEF" }, as: ProgramAdmin, captures: { dev_class: "$.data.device_class" } }
          assert: ["Device.device_class == CLASS_III"]

      - name: scanner_registration_fee_full_q1
        claim_type: Computed Fields
        grounds: [calculations.registration_fee, entities.FeeInvoice.fields.amount_due_cents]
        distinguishing_aspect: "A SCANNER registered at the Q1 default clock has base 15000 and factor 1.00, so amount_due_cents == 15000 and proration_applied == false."
        test_recipe:
          setup: ["Default clock (2026-03-01, Q1); one establishment; register a SCANNER."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Scan Fee Store", jurisdiction: "CA-23" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCANNER", serial_number: "SN-SCFEE" }, as: ProgramAdmin, captures: { dev_id: "$.data.id" } }
          trigger:
            - { call: "GET /fee-invoices?device_id=${dev_id}", payload: {}, as: ProgramAdmin, captures: { amt: "$.data[0].amount_due_cents", prorated: "$.data[0].proration_applied" } }
          assert:
            - "FeeInvoice for device ${dev_id}: amount_due_cents == 15000"
            - "FeeInvoice for device ${dev_id}: proration_applied == false"

      - name: devices_list_pagination_by_establishment
        claim_type: Listing
        grounds: [entities.Device, endpoints]
        distinguishing_aspect: "GET /devices?establishment_id returns a paginated array with total_count 2 and has_more false for an establishment with 2 devices."
        test_recipe:
          setup: ["One establishment with two registered devices."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "List Store", jurisdiction: "CA-24" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-L1" }, as: ProgramAdmin }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "FUEL_PUMP", serial_number: "SN-L2" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /devices?establishment_id=${est_id}", payload: {}, as: ProgramAdmin }
          assert:
            - "meta pagination total_count == 2 and has_more == false; data array length == 2"

      - name: device_invalid_type_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Device.fields.device_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /devices with device_type not in {SCALE, FUEL_PUMP, SCANNER} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One establishment."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Enum Store", jurisdiction: "CA-25" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
          trigger:
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "THERMOMETER", serial_number: "SN-BAD" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_VALIDATION (400)"]

  # ---------------- State machines ----------------
  - section: state_machines
    instances:
      - name: finalize_from_scheduled_returns_not_in_progress
        claim_type: Invalid Transitions
        grounds: [state_machines.Inspection.IN_PROGRESS_to_PASSED, "errors[ERR_INSPECTION_NOT_IN_PROGRESS]"]
        distinguishing_aspect: "Finalizing an inspection still in SCHEDULED (never started) returns ERR_INSPECTION_NOT_IN_PROGRESS (409)."
        test_recipe:
          setup: ["A device with a SCHEDULED (unstarted) accuracy inspection."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Inv T Store", jurisdiction: "CA-26" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Kay K", badge_number: "BADGE-20" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-INVT", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-25T09:00:00Z", scheduled_end: "2026-03-25T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
          trigger:
            - { call: "POST /inspections/${ins_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_INSPECTION_NOT_IN_PROGRESS (409)"]

      - name: retire_already_retired_returns_device_retired
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Device.REGISTERED_to_RETIRED, "errors[ERR_DEVICE_RETIRED]"]
        distinguishing_aspect: "Retiring a device already in terminal RETIRED returns ERR_DEVICE_RETIRED (409); RETIRED is terminal."
        test_recipe:
          setup: ["A registered device that has been retired once."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Term Store", jurisdiction: "CA-27" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-TERM" }, as: ProgramAdmin, captures: { dev_id: "$.data.id" } }
            - { call: "POST /devices/${dev_id}/retire", payload: { reason: "first" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /devices/${dev_id}/retire", payload: { reason: "again" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_DEVICE_RETIRED (409)"]

      - name: pay_penalty_twice_returns_not_payable
        claim_type: Idempotency
        grounds: [state_machines.Penalty.ASSESSED_to_PAID, "errors[ERR_PENALTY_NOT_PAYABLE]"]
        distinguishing_aspect: "Paying an already-PAID penalty a second time returns ERR_PENALTY_NOT_PAYABLE (409)."
        test_recipe:
          setup: ["A condemned device with an ASSESSED penalty that has been paid once."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Pay2 Store", jurisdiction: "CA-28" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Liv L", badge_number: "BADGE-21" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-PAY2", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-26T09:00:00Z", scheduled_end: "2026-03-26T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3004 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "GET /penalties?device_id=${dev_id}", payload: {}, as: ProgramAdmin, captures: { pen_id: "$.data[0].id" } }
            - { call: "POST /penalties/${pen_id}/pay", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /penalties/${pen_id}/pay", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_PENALTY_NOT_PAYABLE (409)"]

      - name: resolve_uphold_requires_condemned_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Complaint.FILED_to_UPHELD, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolving a complaint UPHELD while the targeted device is not CONDEMNED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A FILED complaint on a REGISTERED (not condemned) device."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Cmp Store", jurisdiction: "CA-29" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-CMP" }, as: ProgramAdmin, captures: { dev_id: "$.data.id" } }
            - { call: "POST /complaints", payload: { device_id: "${dev_id}", complainant_name: "Ann", description: "reads high" }, as: ProgramAdmin, captures: { cmp_id: "$.data.id" } }
          trigger:
            - { call: "POST /complaints/${cmp_id}/resolve", payload: { disposition: "UPHELD" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_INVALID_STATE (409)"]

      - name: complaint_dismiss_from_filed_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.Complaint.FILED_to_DISMISSED]
        distinguishing_aspect: "Resolving a FILED complaint with disposition DISMISSED moves it to DISMISSED with no device precondition."
        test_recipe:
          setup: ["A FILED complaint on a registered device."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Dis Store", jurisdiction: "CA-30" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-DIS" }, as: ProgramAdmin, captures: { dev_id: "$.data.id" } }
            - { call: "POST /complaints", payload: { device_id: "${dev_id}", complainant_name: "Bob", description: "unfounded" }, as: ProgramAdmin, captures: { cmp_id: "$.data.id" } }
          trigger:
            - { call: "POST /complaints/${cmp_id}/resolve", payload: { disposition: "DISMISSED" }, as: ProgramAdmin, captures: { cmp_status: "$.data.status" } }
          assert: ["Complaint.${cmp_id}.status == DISMISSED"]

      - name: pay_fee_reduces_balance_side_effect
        claim_type: Side Effect Execution
        grounds: [state_machines.FeeInvoice.DUE_to_PAID, calculations.establishment_balance]
        distinguishing_aspect: "Paying the DUE registration fee moves it to PAID and drops establishment.balance_due_cents to 0."
        test_recipe:
          setup: ["Default clock Q1; a SCALE device registered so its 12000 fee is DUE (balance 12000)."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Fee Store", jurisdiction: "CA-31" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-FEE" }, as: ProgramAdmin, captures: { dev_id: "$.data.id" } }
            - { call: "GET /fee-invoices?device_id=${dev_id}", payload: {}, as: ProgramAdmin, captures: { fee_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /fee-invoices/${fee_id}/pay", payload: {}, as: ProgramAdmin, captures: { fee_status: "$.data.status" } }
            - { call: "GET /establishments/${est_id}", payload: {}, as: ProgramAdmin, captures: { bal: "$.data.balance_due_cents" } }
          assert:
            - "FeeInvoice.${fee_id}.status == PAID"
            - "Establishment.${est_id}.balance_due_cents == 0"

  # ---------------- Calculations ----------------
  - section: calculations
    instances:
      - name: penalty_repeat_multiplier_second_condemnation
        claim_type: Constants Applied
        grounds: [calculations.penalty_amount, entities.Penalty.fields.amount_cents]
        distinguishing_aspect: "For an establishment with exactly one prior condemnation, the next OUT_OF_TOLERANCE penalty applies multiplier 1.5: round(5000 * 1.5) == 7500."
        test_recipe:
          setup: ["Two SCALE devices of one establishment; device1 is condemned first (prior count becomes 1), then device2 is condemned."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Mult Store", jurisdiction: "CA-32" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Moe M", badge_number: "BADGE-22" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-M1", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev1_id: "$.data.id", dev1_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev1_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-27T09:00:00Z", scheduled_end: "2026-03-27T10:00:00Z", expected_device_version: "${dev1_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins1_id: "$.data.id" } }
            - { call: "POST /inspections/${ins1_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins1_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3004 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins1_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-M2", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev2_id: "$.data.id", dev2_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev2_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-28T09:00:00Z", scheduled_end: "2026-03-28T10:00:00Z", expected_device_version: "${dev2_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins2_id: "$.data.id" } }
            - { call: "POST /inspections/${ins2_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins2_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3004 }, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /inspections/${ins2_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "GET /penalties?device_id=${dev2_id}", payload: {}, as: ProgramAdmin, captures: { pen2_amt: "$.data[0].amount_cents" } }
          assert:
            - "Penalty for device ${dev2_id}: amount_cents == 7500 (multiplier 1.5 on base 5000)"

      - name: fuel_pump_registration_fee_full_q1
        claim_type: Correct Result
        grounds: [calculations.registration_fee]
        distinguishing_aspect: "A FUEL_PUMP registered at Q1 default clock has base 8000 * 1.00 == amount_due_cents 8000."
        test_recipe:
          setup: ["Default clock Q1; register a FUEL_PUMP."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Pump Store", jurisdiction: "CA-33" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "FUEL_PUMP", serial_number: "SN-PUMP" }, as: ProgramAdmin, captures: { dev_id: "$.data.id" } }
          trigger:
            - { call: "GET /fee-invoices?device_id=${dev_id}", payload: {}, as: ProgramAdmin, captures: { amt: "$.data[0].amount_due_cents" } }
          assert: ["FeeInvoice for device ${dev_id}: amount_due_cents == 8000"]

  # ---------------- Validations ----------------
  - section: validations
    instances:
      - name: schedule_end_before_start_returns_window_invalid
        claim_type: Violation to Error
        grounds: ["validations[priority=3]", "errors[ERR_SCHEDULE_WINDOW_INVALID]"]
        distinguishing_aspect: "POST /inspections with scheduled_end <= scheduled_start returns ERR_SCHEDULE_WINDOW_INVALID (400)."
        test_recipe:
          setup: ["An establishment, inspector, and registered device."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Win Store", jurisdiction: "CA-34" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Ned N", badge_number: "BADGE-23" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-WIN", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
          trigger:
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-29T11:00:00Z", scheduled_end: "2026-03-29T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_SCHEDULE_WINDOW_INVALID (400)"]

      - name: suspend_zero_balance_returns_requires_balance
        claim_type: Violation to Error
        grounds: ["validations[priority=13]", "errors[ERR_SUSPEND_REQUIRES_BALANCE]"]
        distinguishing_aspect: "Suspending an establishment whose balance_due_cents == 0 returns ERR_SUSPEND_REQUIRES_BALANCE (409)."
        test_recipe:
          setup: ["A fresh establishment with no devices (balance 0)."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "ZeroBal Store", jurisdiction: "CA-35" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
          trigger:
            - { call: "POST /establishments/${est_id}/suspend", payload: { reason: "test" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_SUSPEND_REQUIRES_BALANCE (409)"]

      - name: reinstate_with_balance_returns_outstanding
        claim_type: Violation to Error
        grounds: ["validations[priority=13]", "errors[ERR_OUTSTANDING_BALANCE]"]
        distinguishing_aspect: "Reinstating a SUSPENDED establishment while balance_due_cents > 0 returns ERR_OUTSTANDING_BALANCE (409)."
        test_recipe:
          setup: ["A SCALE device gives the establishment a 12000 DUE fee; the establishment is suspended (balance still 12000)."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Reinst Store", jurisdiction: "CA-36" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-RE" }, as: ProgramAdmin }
            - { call: "POST /establishments/${est_id}/suspend", payload: { reason: "nonpayment" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /establishments/${est_id}/reinstate", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_OUTSTANDING_BALANCE (409)"]

      - name: finalize_accuracy_no_readings_returns_no_readings
        claim_type: Violation to Error
        grounds: ["validations[priority=11]", "errors[ERR_NO_READINGS]"]
        distinguishing_aspect: "Finalizing an in-progress ACCURACY_TEST inspection with zero TestReadings returns ERR_NO_READINGS (422) — empty-set boundary on the reading collection."
        test_recipe:
          setup: ["A device with an IN_PROGRESS accuracy inspection and no readings recorded."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "NoRd Store", jurisdiction: "CA-37" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Ola O", badge_number: "BADGE-24" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-NORD", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-03-30T09:00:00Z", scheduled_end: "2026-03-30T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /inspections/${ins_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_NO_READINGS (422)"]

      - name: finalize_price_no_items_returns_insufficient_sample
        claim_type: Violation to Error
        grounds: ["validations[priority=11]", "errors[ERR_INSUFFICIENT_SAMPLE]", calculations.scanner_audit_evaluation]
        distinguishing_aspect: "Finalizing an in-progress PRICE_VERIFICATION inspection with zero ScannerAuditItems returns ERR_INSUFFICIENT_SAMPLE (422) — empty-set boundary on the audit sample."
        test_recipe:
          setup: ["A SCANNER device with an IN_PROGRESS price-verification inspection and no audit items."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "NoIt Store", jurisdiction: "CA-38" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Pia P", badge_number: "BADGE-25" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCANNER", serial_number: "SN-NOIT" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "PRICE_VERIFICATION", scheduled_start: "2026-03-31T09:00:00Z", scheduled_end: "2026-03-31T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /inspections/${ins_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}", captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_INSUFFICIENT_SAMPLE (422)"]

      - name: retire_with_in_progress_returns_active_inspection
        claim_type: Violation to Error
        grounds: ["validations[priority=12]", "errors[ERR_DEVICE_HAS_ACTIVE_INSPECTION]"]
        distinguishing_aspect: "Retiring a device that has an IN_PROGRESS inspection returns ERR_DEVICE_HAS_ACTIVE_INSPECTION (409)."
        test_recipe:
          setup: ["A device whose accuracy inspection has been started (IN_PROGRESS)."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Act Store", jurisdiction: "CA-39" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Ray R", badge_number: "BADGE-26" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-ACT", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-04-02T09:00:00Z", scheduled_end: "2026-04-02T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /devices/${dev_id}/retire", payload: { reason: "premature" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_DEVICE_HAS_ACTIVE_INSPECTION (409)"]

      - name: pay_penalty_wrong_establishment_returns_ownership
        claim_type: Violation to Error
        grounds: ["validations[priority=5]", "errors[ERR_OWNERSHIP_VIOLATION]"]
        distinguishing_aspect: "An Establishment paying a Penalty it does not own returns ERR_OWNERSHIP_VIOLATION (403)."
        test_recipe:
          setup: ["Establishment 1 has a condemned device with an ASSESSED penalty; a second establishment 2 exists and attempts to pay it."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Own1 Store", jurisdiction: "CA-40" }, as: ProgramAdmin, captures: { est1_id: "$.data.id" } }
            - { call: "POST /establishments", payload: { name: "Own2 Store", jurisdiction: "CA-41" }, as: ProgramAdmin, captures: { est2_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Sam S", badge_number: "BADGE-27" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
            - { call: "POST /devices", payload: { establishment_id: "${est1_id}", device_type: "SCALE", serial_number: "SN-OWN", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-04-03T09:00:00Z", scheduled_end: "2026-04-03T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3004 }, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/finalize", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "GET /penalties?device_id=${dev_id}", payload: {}, as: ProgramAdmin, captures: { pen_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /penalties/${pen_id}/pay", payload: {}, as: Establishment, as_user_id: "${est2_id}", captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_OWNERSHIP_VIOLATION (403)"]

  # ---------------- RBAC ----------------
  - section: rbac
    instances:
      - name: inspector_cannot_register_device_returns_unauthorized
        claim_type: role denial
        grounds: [roles.Inspector, roles.ProgramAdmin, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /devices is ProgramAdmin-exclusive; an Inspector calling it returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["An establishment and an inspector identity."]
          setup_api_calls:
            - { call: "POST /establishments", payload: { name: "Rbac1 Store", jurisdiction: "CA-42" }, as: ProgramAdmin, captures: { est_id: "$.data.id" } }
            - { call: "POST /inspectors", payload: { full_name: "Tia T", badge_number: "BADGE-28" }, as: ProgramAdmin, captures: { insp_id: "$.data.id" } }
          trigger:
            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-RBAC1" }, as: Inspector, as_user_id: "${insp_id}", captures: { err: "$.data.error_id" } }
          assert: ["trigger response error_id == ERR_UNAUTHORIZED (403)"]

      - name: establishment_cannot_finalize_inspection_returns_unauthorized
        claim_type: role denial
        grounds: [roles.Establishment, roles.Inspector, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /inspections/{id}/finalize is Inspector-exclusive; an Establishment calling it returns ERR_UNAUTHORIZED (403)."
