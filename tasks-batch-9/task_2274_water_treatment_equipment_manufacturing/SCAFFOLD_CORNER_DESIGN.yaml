          setup:
            - 'a two-stage train on TECH-FILT-U (requires_code_stamp ASME_U) and TECH-DIS-A (NONE)'
            - 'TestBay BAY-BIG with max_skid_footprint_sf 20000.0 and changeover_buffer_minutes 120'
