  - section: complexity_layers
    instances:
      - name: occ_sheet_patch_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[sheet-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /rate-sheets/{id} with the version observed before a prior successful edit is rejected ERR_STALE_VERSION (412); the same edit with the fresh version succeeds and increments version again."
        test_recipe:
          setup: ["P-OCC1; DRAFT sheet version 1"]
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "OCC1", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_occ: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_occ}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_occ: $.data.id, s_occ_v1: $.data.version } }
          trigger:
            - { call: "PATCH /rate-sheets/${s_occ}", payload: { expected_sheet_version: "${s_occ_v1}", margin_floor_bp: 5 }, as: PricingAnalyst, captures: { s_occ_v2: $.data.version } }
            - { call: "PATCH /rate-sheets/${s_occ}", payload: { expected_sheet_version: "${s_occ_v1}", margin_floor_bp: 9 }, as: PricingAnalyst, captures: { err_stale: $.data.error_id } }
            - { call: "PATCH /rate-sheets/${s_occ}", payload: { expected_sheet_version: "${s_occ_v2}", margin_floor_bp: 9 }, as: PricingAnalyst, captures: { s_occ_v3: $.data.version, s_occ_floor: $.data.margin_floor_bp } }
          assert:
            - "first PATCH (version 1) succeeds: version == 2"
            - "second PATCH with the stale captured version -> error_id == ERR_STALE_VERSION (412)"
            - "third PATCH with fresh version 2 succeeds: version == 3, margin_floor_bp == 9"

      - name: occ_account_version_bumped_by_cascade_goes_stale
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[account-adjust-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "The activation cascade silently bumps the account's version; a balance PATCH carrying the pre-activation version is rejected ERR_STALE_VERSION even though balance adjustment is a legitimate write — the client re-reads and retries successfully."
        test_recipe:
          setup:
            - "P-OCC2 (SAVINGS, term 0, WHOLE_BALANCE, cap 500): S1 EFFECTIVE 2026-08-01 single tier [0,unbounded)@100; account AOCC 1,000,000 (version captured)"
            - "S2 single tier [0,unbounded)@120 effective 2026-09-01 fully staged (deployed, disclosed, clock at 2026-09-01)"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "OCC2", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_occ2: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_occ2}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s1o2: $.data.id } }
            - { call: "POST /rate-sheets/${s1o2}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s1o2}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s1o2}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s1o2}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
