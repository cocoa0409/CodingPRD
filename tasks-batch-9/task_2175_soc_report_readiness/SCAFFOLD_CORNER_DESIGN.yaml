        claim_type: role_denial
        grounds: ["roles.PlatformAdmin", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "PlatformAdmin owns only the criteria catalog, the calendar-run and the clock; it is denied POST /soc/engagements and POST /soc/gaps with 403 ERR_ROLE_NOT_PERMITTED while its catalog write succeeds."
