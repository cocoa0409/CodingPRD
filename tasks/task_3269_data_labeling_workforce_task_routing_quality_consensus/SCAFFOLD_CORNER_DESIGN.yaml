  - section: errors
    instances:

      - name: appeal_case_endpoints_report_their_own_not_found
        claim_type: Violation to Error
        grounds:
          - errors[ERR_APPEAL_CASE_NOT_FOUND]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_SPEC_UNIT_NOT_FOUND]
        distinguishing_aspect: "Each path identifier family raises its own not-found id, so an unknown appeal case never reports as an unknown program."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "june-osei" }
              as: Anonymous
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "POST /api/appeal-cases/00000000-0000-4000-8000-000000000000/advance-appeal"
              payload: { appeal_action: "PROPOSE", proposed_outcome: "OUTCOME_STANDS" }
              as: PlatformReviewer
              captures: { err: "$.data.error_id" }
          assert:
            - "the appeal advance returns ERR_APPEAL_CASE_NOT_FOUND at status 404"
            - "a spec unit read with an unknown id returns ERR_SPEC_UNIT_NOT_FOUND at status 404"
            - "a program read with an unknown id returns ERR_PROGRAM_NOT_FOUND at status 404"
            - "a qualification action against an unknown worker returns ERR_WORKER_NOT_FOUND at status 404 rather than ERR_QUALIFICATION_NOT_FOUND, because the worker is validated first along the path"

      - name: cross_entity_reference_must_resolve_to_an_existing_parent
        claim_type: Violation to Error
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors[ERR_SPEC_UNIT_CYCLE]
        distinguishing_aspect: "A unit whose parent_unit_id names a unit that does not exist is refused, and a parent chain that loops back on itself is refused by a different error."
