          assert:
            - "the first hop answers 200 with ComponentModel.${m_deck_id}.lifecycle_status == LEGACY and version == ${model_ver_before} + 1"
            - "certification_status is still CERTIFIED after both lifecycle hops - the two ComponentModel state machines are independent dimensions"
            - "the placement created while the model is LEGACY succeeds: HTTP 201, ComponentPlacement.${pl_legacy_id}.status == DRAFT, use_zone_start_cm == 517, use_zone_end_cm == 883"
