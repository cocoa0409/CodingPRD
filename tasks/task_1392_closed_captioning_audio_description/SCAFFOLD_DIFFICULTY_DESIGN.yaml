  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 4 and 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: complaint_create_depth4_cascade
        grounds:
          - state_machines.CaptionTrack.DELIVERED_to_DISPUTED
          - state_machines.WorkOrder.DELIVERED_to_REMEDIATION
          - state_machines.ConversionJob.QUEUED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 chain from a single POST /complaints: complaint OPEN (hop 1)
          mutates the track DELIVERED -> DISPUTED (hop 2), which itself freezes the
          track's ArchiveItem (hop 3a) and bubbles the WorkOrder DELIVERED ->
          REMEDIATION (hop 3b), and the REMEDIATION transition cancels the track's
          QUEUED conversion job (hop 4) — each hop caused by the previous mutation,
          not by the original request.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z"
            - "FCC client with a DELIVERED CAPTIONS order: track v1 DELIVERED, ArchiveItem ACTIVE_HOLD for v1, one QUEUED ConversionJob on v1"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "FCC Client", compliance_standard: "FCC_BROADCAST" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Prog", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_29_97_DF" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_a}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "RUSH", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
            - call: "POST /caption-ad/work-orders/${wo_a}/start-production"
              payload: {}
              as: CaptionEditor
              captures: { wo_a_v: $.data.version }
            - call: "POST /caption-ad/work-orders/${wo_a}/caption-tracks"
              payload: { language: "en-US", caption_format: "SCC", speaker_id_style: "CHEVRON", expected_work_order_version: "${wo_a_v}" }
              as: CaptionEditor
              as_user_id: "editor-1"
              captures: { t_1: $.data.id }
            - call: "POST /caption-ad/caption-tracks/${t_1}/submit-review"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_1}/enqueue-qc"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_1}/qc-reviews"
              payload: { review_mode: "FULL_REVIEW", total_words: 20000, minor_errors: 100, major_errors: 0, critical_errors: 0 }
              as: QCSpecialist
              as_user_id: "qc-1"
            - call: "POST /caption-ad/caption-tracks/${t_1}/mark-conformed"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/work-orders/${wo_a}/deliver"
              payload: {}
              as: OperationsManager
            - call: "POST /caption-ad/conversion-jobs"
              payload: { source_track_id: "${t_1}", target_format: "WEBVTT" }
              as: OperationsManager
              captures: { cj: $.data.id }
            - call: "GET /caption-ad/archive-items?caption_track_id=${t_1}"
              payload: {}
              as: OperationsManager
              captures: { ai: "$.data[0].id" }
          trigger:
            - call: "POST /caption-ad/complaints"
              payload: { severity: "FCC_CRITICAL", description: "dropped caption during breaking news", caption_track_id: "${t_1}" }
              as: ClientContact
              as_user_id: "${c_id}"
              captures: { comp: $.data.id }
          assert:
            - "Complaint.${comp}.complaint_status == OPEN (hop 1)"
            - "CaptionTrack.${t_1}.track_status == DISPUTED (hop 2)"
            - "ArchiveItem.${ai}.dispute_freeze == true (hop 3a, caused by the track's DISPUTED transition)"
            - "WorkOrder.${wo_a}.order_status == REMEDIATION and active_complaint_count == 1 (hop 3b, bubble-up)"
            - "ConversionJob.${cj}.job_status == CANCELLED (hop 4, caused by the work order entering REMEDIATION)"

      - name: preemption_reoffer_cascade
        grounds:
          - state_machines.LiveAssignment.CONFIRMED_to_PREEMPTED
          - state_machines.LiveEvent.BRIEFED_to_SCHEDULED
          - calculations.auto_offer_selector
        distinguishing_aspect: |
          Depth-3 chain from POST /live-assignments/{id}/preempt (different trigger
          from the complaint cascade): the preemption mutates the assignment (hop 1),
          the loss of the last CONFIRMED assignment drops the LiveEvent BRIEFED ->
          SCHEDULED (hop 2), and that posture drop fires auto_offer_selector which
          creates a new AUTO_OFFER assignment to the next-ranked eligible
          stenographer (hop 3) — excluding the preempted stenographer and any prior
          decliner of the same event.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T08:00:00Z (Monday)"
            - "Client; live event 2026-08-10 14:00-15:00 UTC requiring CERT_CBC, prep 15 / wrap 5"
            - "Stenographers S1 (certified 2020-01-01) and S2 (certified 2021-06-01), both ACTIVE CERT_CBC, committed 0 on the day"
            - "S1 holds a CONFIRMED assignment; event is BRIEFED"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Live Client", compliance_standard: "FCC_BROADCAST" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/stenographers"
              payload: { display_name: "S1", certification: "CERT_CBC", certified_since: "2020-01-01T00:00:00Z", cert_valid_until: "2027-01-01T00:00:00Z" }
              as: Scheduler
              captures: { s_1: $.data.id }
            - call: "POST /caption-ad/stenographers"
              payload: { display_name: "S2", certification: "CERT_CBC", certified_since: "2021-06-01T00:00:00Z", cert_valid_until: "2027-01-01T00:00:00Z" }
              as: Scheduler
              captures: { s_2: $.data.id }
            - call: "POST /caption-ad/live-events"
              payload: { client_id: "${c_id}", title: "News Hour", channel_id: "CH1", start_at: "2026-08-10T14:00:00Z", end_at: "2026-08-10T15:00:00Z", required_certification: "CERT_CBC" }
              as: Scheduler
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /caption-ad/live-events/${ev}/assignments"
              payload: { stenographer_id: "${s_1}", expected_live_event_version: "${ev_v}" }
              as: Scheduler
              captures: { asg_1: $.data.id }
            - call: "POST /caption-ad/live-assignments/${asg_1}/accept"
              payload: {}
              as: Stenographer
              as_user_id: "${s_1}"
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T13:40:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/live-assignments/${asg_1}/check-in"
              payload: {}
              as: Stenographer
              as_user_id: "${s_1}"
          trigger:
            - call: "POST /caption-ad/live-assignments/${asg_1}/preempt"
              payload: { preemption_reason: "EMERGENCY_REBOOK" }
              as: Scheduler
            - call: "GET /caption-ad/live-assignments?live_event_id=${ev}&assignment_status=OFFERED"
              payload: {}
              as: Scheduler
              captures: { asg_2_steno: "$.data[0].stenographer_id", asg_2_origin: "$.data[0].origin" }
          assert:
            - "LiveAssignment.${asg_1}.assignment_status == PREEMPTED (hop 1)"
            - "Stenographer.${s_1}.make_up_minutes_credited == 80 (booked 60 + prep 15 + wrap 5)"
            - "LiveEvent.${ev}.event_status == SCHEDULED (hop 2: last CONFIRMED lost)"
            - "Hop 3: exactly one new OFFERED assignment exists for the event with stenographer_id == ${s_2} and origin == AUTO_OFFER"
            - "The re-offer excluded ${s_1} (preempted stenographer is never re-offered the same event)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_constraint_on_assignment_accept
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        distinguishing_aspect: |
          Pair state (p7) vs business_constraint (p10): accepting an assignment that
          is already DECLINED while a committed overlapping booking also exists must
          return ERR_INVALID_TRANSITION, never ERR_STENOGRAPHER_DOUBLE_BOOKED — the
          state precondition outranks the geometry check.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T08:00:00Z"
            - "Client; stenographer S1 ACTIVE CERT_CBC"
            - "Event E1 2026-08-10 14:00-15:00 (prep 15 wrap 5): S1's offer DECLINED"
            - "Event E2 2026-08-10 14:30-15:30: S1's offer ACCEPTED (so an overlap with E1's window exists)"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Live Client", compliance_standard: "FCC_BROADCAST" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/stenographers"
              payload: { display_name: "S1", certification: "CERT_CBC", certified_since: "2020-01-01T00:00:00Z", cert_valid_until: "2027-01-01T00:00:00Z" }
              as: Scheduler
              captures: { s_1: $.data.id }
            - call: "POST /caption-ad/live-events"
              payload: { client_id: "${c_id}", title: "E1", channel_id: "CH1", start_at: "2026-08-10T14:00:00Z", end_at: "2026-08-10T15:00:00Z", required_certification: "CERT_CBC" }
              as: Scheduler
              captures: { ev_1: $.data.id, ev_1_v: $.data.version }
            - call: "POST /caption-ad/live-events/${ev_1}/assignments"
              payload: { stenographer_id: "${s_1}", expected_live_event_version: "${ev_1_v}" }
              as: Scheduler
              captures: { asg_1: $.data.id }
            - call: "POST /caption-ad/live-assignments/${asg_1}/decline"
              payload: {}
              as: Stenographer
              as_user_id: "${s_1}"
            - call: "POST /caption-ad/live-events"
              payload: { client_id: "${c_id}", title: "E2", channel_id: "CH2", start_at: "2026-08-10T14:30:00Z", end_at: "2026-08-10T15:30:00Z", required_certification: "CERT_CBC" }
              as: Scheduler
              captures: { ev_2: $.data.id, ev_2_v: $.data.version }
            - call: "POST /caption-ad/live-events/${ev_2}/assignments"
              payload: { stenographer_id: "${s_1}", expected_live_event_version: "${ev_2_v}" }
              as: Scheduler
              captures: { asg_2: $.data.id }
            - call: "POST /caption-ad/live-assignments/${asg_2}/accept"
              payload: {}
              as: Stenographer
              as_user_id: "${s_1}"
          trigger:
            - call: "POST /caption-ad/live-assignments/${asg_1}/accept"
              payload: {}
              as: Stenographer
              as_user_id: "${s_1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_TRANSITION (409) — state priority 7 beats the overlapping-window constraint at priority 10"
            - "LiveAssignment.${asg_1}.assignment_status remains DECLINED; no side effects fire"

      - name: temporal_beats_referential_on_confirm
        grounds:
          - validations[priority=9]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair business_temporal (p9) vs business_referential (p11): confirming an
          order whose quote has expired AND whose media was never cleared must
          return ERR_QUOTE_EXPIRED, not ERR_MEDIA_NOT_CLEARED — the temporal check
          outranks the linked-entity state check.
        test_recipe:
          setup:
            - "Clock starts 2026-08-03T10:00:00Z; quote issued then (quote_expires_at 2026-08-06T10:00:00Z)"
            - "Media asset left in INSPECTING (never CLEARED)"
            - "Clock advanced to 2026-08-06T10:00:00Z exactly — the quote expiry edge"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "FCC Client", compliance_standard: "FCC_BROADCAST" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Prog", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T10:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_QUOTE_EXPIRED (409) — confirm at exactly quote_expires_at fails (window is now < quote_expires_at)"
            - "ERR_MEDIA_NOT_CLEARED is suppressed despite the asset sitting in INSPECTING (temporal p9 beats referential p11)"
            - "WorkOrder.${wo_a}.order_status remains QUOTED (sweep never ran, so no QUOTE_EXPIRED transition either)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: accuracy_rounding_boundary_straddle
        grounds:
          - calculations.caption_accuracy
          - entities.QCReview.fields.accuracy_pct
        distinguishing_aspect: |
          Accuracy-metric boundary on POST qc-reviews: raw 98.995 (w=20000,
          weighted errors 201) rounds HALF_UP to exactly 99.00 and PASSES the FCC
          threshold (inclusive >=), while raw 98.994 (w=50000, errors 503) rounds to
          98.99 and FAILS — one weighted error in different denominators straddles
          the rounding cliff; binary float arithmetic would mis-round 98.995.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z"
            - "FCC client, two CLEARED assets, two CAPTIONS orders IN_PRODUCTION each with a QC_QUEUED track authored by editor-1"
          setup_api_calls:
