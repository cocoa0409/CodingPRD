      - name: proctor_daily_cap_exactly_eight_hours_allowed
        metric: "projected same-day proctoring load against Proctor.daily_hour_cap 8.00 (per-UTC-date aggregate, not a running ledger)"
        endpoint: "POST /exam-sessions/{sessionId}/proctor-assignment"
        grounds:
          - calculations.proctor_daily_load
          - validations[priority=83]
          - errors[ERR_PROCTOR_DAILY_CAP_EXCEEDED]
        distinguishing_aspect: |
          A different metric (a per-calendar-date aggregate over already-assigned sessions) on a
          different endpoint. Reaching the cap exactly (6.00 + 2.00 == 8.00) is allowed because
          rejection is strict >, while the next one-hour session tips the projection to 9.00 and is
          refused - and the refusal leaves that session in DRAFT with no proctor.
        test_recipe:
          setup:
            - "FULL_AUTHORIZED center, room R1 (buffer 45), proctor with daily_hour_cap 8.00 certified to 2027-01-01."
            - "Three DRAFT sessions on 2026-08-12 in R1: 08:00-14:00 (6.00h), 14:45-16:45 (2.00h), 17:30-18:30 (1.00h) - each gap is exactly the 45-minute turnaround buffer."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Cap Center", state_code: "OH" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R1", seat_capacity: 10, turnaround_buffer_minutes: 45 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Wes Proctor", daily_hour_cap: 8.00 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p: $.data.id }
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "CERTIFY", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "MATH", starts_at: "2026-08-12T08:00:00Z", ends_at: "2026-08-12T14:00:00Z", requested_seats: 6 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { s1: $.data.id }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "RLA", starts_at: "2026-08-12T14:45:00Z", ends_at: "2026-08-12T16:45:00Z", requested_seats: 6 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { s2: $.data.id }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "SCIENCE", starts_at: "2026-08-12T17:30:00Z", ends_at: "2026-08-12T18:30:00Z", requested_seats: 6 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { s3: $.data.id }
          trigger:
            - call: "POST /exam-sessions/${s1}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
            - call: "POST /exam-sessions/${s2}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
            - call: "POST /exam-sessions/${s3}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
          assert:
            - "session ${s1} (6.00h, projected 6.00 <= 8.00) returns 200 with status == SCHEDULED and duration_hours == 6.00"
            - "session ${s2} (2.00h, projected exactly 8.00) returns 200 with status == SCHEDULED; Proctor ${p} assigned_session_count == 2"
            - "session ${s3} (1.00h, projected 9.00 > 8.00) returns 409 with data.error_id == ERR_PROCTOR_DAILY_CAP_EXCEEDED"
            - "session ${s3} remains status DRAFT with proctor_id == null and Proctor ${p} assigned_session_count stays 2"

      - name: allocation_deferred_when_line_exceeds_remaining_by_one_cent
        metric: "a rounded allocation line (12500 cents) against FundingPeriod.available_cents"
        endpoint: "POST /funding-periods/{periodId}/allocation-run"
        grounds:
          - calculations.funding_allocation
          - entities.OutcomeRecord.fields.allocation_status
          - entities.FundingPeriod.fields.available_cents
        distinguishing_aspect: |
          A monetary boundary on a third endpoint: a pool of exactly the line amount commits in full
          (line_cents <= available is inclusive) while a pool one cent smaller defers the whole line,
          because the algorithm never allocates partially. Two sibling periods differing only by one
          cent isolate the comparison.
        test_recipe:
          setup:
            - "Period EXACT: rate_cents_per_weight 10000, total_cents 12500, one CERTIFIED EMPLOYMENT_Q2 outcome (weight 1.25, line 12500)."
            - "Period SHORT: identical except total_cents 12499."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: { label: "EXACT", start_date: "2026-08-01", end_date: "2026-12-31", rate_cents_per_weight: 10000, total_cents: 12500 }
              as: StateAuthority
              captures: { fp_exact: $.data.id }
            - call: "POST /funding-periods"
              payload: { label: "SHORT", start_date: "2026-08-01", end_date: "2026-12-31", rate_cents_per_weight: 10000, total_cents: 12499 }
              as: StateAuthority
              captures: { fp_short: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Pia Learner", email: "pia@x.test", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /outcome-records"
              payload: { student_id: "${s}", funding_period_id: "${fp_exact}", measure_type: "EMPLOYMENT_Q2", evidence_ref: "WAGE-EXACT" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { o_exact: $.data.id }
            - call: "POST /outcome-records/${o_exact}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
            - call: "POST /outcome-records"
              payload: { student_id: "${s}", funding_period_id: "${fp_short}", measure_type: "EMPLOYMENT_Q2", evidence_ref: "WAGE-SHORT" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { o_short: $.data.id }
            - call: "POST /outcome-records/${o_short}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
            - call: "GET /funding-periods/${fp_exact}"
              payload: {}
              as: StateAuthority
              captures: { v_exact: $.data.version }
            - call: "GET /funding-periods/${fp_short}"
              payload: {}
              as: StateAuthority
              captures: { v_short: $.data.version }
          trigger:
            - call: "POST /funding-periods/${fp_exact}/allocation-run"
              payload: { variant: "FINAL", expected_funding_period_version: "${v_exact}" }
              as: StateAuthority
            - call: "GET /funding-periods/${fp_short}/allocation-preview"
              payload: { variant: "FINAL" }
              as: StateAuthority
            - call: "POST /funding-periods/${fp_short}/allocation-run"
              payload: { variant: "FINAL", expected_funding_period_version: "${v_short}" }
              as: StateAuthority
          assert:
            - "period EXACT returns 200 with committed_cents == 12500 and available_cents == 0; OutcomeRecord ${o_exact} allocated_cents == 12500, allocation_status == COMMITTED"
            - "the SHORT preview reports line_count == 1, deferred_line_count == 1, projected_committed_cents == 0 and projected_available_cents == 12499"
            - "period SHORT returns 200 with committed_cents == 0 and available_cents == 12499; OutcomeRecord ${o_short} allocated_cents == 0, allocation_status == DEFERRED"
            - "no partial allocation of 12499 cents occurs anywhere"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: exam_registration_requires_scheduled_session
        entity_pair: [ExamRegistration, ExamSession]
        grounds:
          - validations[priority=45]
          - errors[ERR_SESSION_NOT_OPEN_FOR_REGISTRATION]
          - state_machines[ExamSession].transitions[DRAFT->SCHEDULED]
