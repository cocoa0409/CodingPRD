              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /comm-services/contracts/${c_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/contracts/${c_id}/rate-schedules"
              payload: { local_per_minute_cents: 18, intrastate_per_minute_cents: 21, interstate_per_minute_cents: 25, international_per_minute_cents: 25, connection_fee_cents: 200, message_price_cents: 15, video_session_fee_cents: 500 }
              as: PlatformAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /comm-services/contracts/${c_id}/rate-schedules"
              payload: { local_per_minute_cents: 19, intrastate_per_minute_cents: 21, interstate_per_minute_cents: 25, international_per_minute_cents: 25, connection_fee_cents: 200, message_price_cents: 15, video_session_fee_cents: 500 }
              as: PlatformAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /comm-services/rate-schedules/${s1_id}/activate"
              payload: { expected_contract_version: "${c_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /comm-services/rate-schedules/${s2_id}/activate"
              payload: { expected_contract_version: "${c_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "GET /comm-services/contracts/${c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c_v2: $.data.version }
