            - "after the two alerting events, leg monitor_status == ALERTED and OperationalControlRecord contains exactly one DIVERT_RECOMMENDED"

      - name: payload_equals_max_accepted_boundary
        grounds:
          - calculations.max_payload_envelope
          - errors[ERR_PAYLOAD_EXCEEDS_LIMIT]
        distinguishing_aspect: |
          Boundary metric = payload kg vs max_payload_kg, endpoint = POST/PUT
          /dispatch/manifests (distinct metric and endpoint from the fuel
          margin instance): total_payload_kg == max_payload_kg exactly (19000)
          is ACCEPTED (<=), 19001 is rejected.
        test_recipe:
          setup:
            - "Standard chain to LOCKED plan (required 9077); max_payload = min(19000, 22423, 20248) = 19000"
            - "pax 150 (13125) + bags 150 (1875) leaves exactly 4000 kg of cargo headroom to reach 19000"
          setup_api_calls:
