# =============================================================================
# Coordinated Entry & Homeless Services (HMIS) — Scaffold (§1.0–§1.7)
# Difficulty: Expert
# =============================================================================

scenario: |
  802. Coordinated Entry & Homeless Services (HMIS): intake & VI-SPDAT
  vulnerability score, diversion & crisis triage, shelter-bed reservation &
  waitlist, prioritization pool & housing-navigator match,
  permanent-supportive-housing referral, release-of-information consent &
  de-duplication, HUD HMIS data & APR, exit/outcome tracking

domain_name: coordinated-entry-hmis
api_prefix: ""   # flat topology: every entity is a top-level collection; empty prefix

complexity_profile:
  primary_archetype: quota_allocation           # finite bed pool booked over date windows, waitlisted, released
  secondary_archetype: temporal_windowing        # reservations occupy half-open date windows on beds
  complexity_layers:
    - optimistic_concurrency                     # OCC on Shelter.version for concurrent bed booking
    - cascading_side_effects                     # merge -> cancel -> free bed -> promote waitlist
    - dual_variant_calculation                   # VI-SPDAT provisional/verified; APR bed-night/duration LOS
    - selector_policy                            # server bed assignment; waitlist promotion; pool ranking

  entity_topology: flat
  # flat: peer entities linked by FK fields in the body; no nesting in URL paths.
  state_machine_shape: cyclic
  # cyclic PrioritizationEntry (MATCHED->ACTIVE re-queue) + branching Referral (PENDING->{ACCEPTED,DECLINED}).
  relationship_patterns:
    - one_to_many          # Shelter->Bed, Client->Assessment
    - self_referential     # Client.master_client_id -> Client.id (de-duplication merge)
    - cross_aggregate      # BedReservation references Client + Bed across aggregates
  role_model: peer_roles
  # IntakeSpecialist / ShelterManager / HousingNavigator / HMISAdmin own disjoint surfaces.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Client legal name" }
      - { name: dob, type: string, source: input, description: "Date of birth YYYY-MM-DD" }
      - { name: ssn_last4, type: string, source: input, description: "Last 4 of SSN, used for de-duplication candidacy", constraints: "4 digits or null" }
      - { name: household_size, type: integer, source: input, default: 1, description: "Number of persons in household", constraints: ">= 1" }
      - { name: months_homeless, type: integer, source: input, default: 0, description: "Self-reported cumulative months homeless", constraints: ">= 0" }
      - { name: chronic_homeless, type: boolean, source: input, default: false, description: "HUD chronic-homelessness flag" }
      - { name: status, type: enum, source: system, description: "INTAKE | ACTIVE | HOUSED | INACTIVE | MERGED — lifecycle", constraints: "enum" }
      - { name: master_client_id, type: string, source: system, description: "FK -> Client.id; set on the duplicate when merged into a surviving master; null otherwise" }
      - { name: vulnerability_score, type: integer, source: computed, description: "Latest COMPLETED Assessment.verified_score; null until an assessment is completed" }
      - { name: acuity_tier, type: enum, source: computed, description: "LOW | MODERATE | HIGH — derived from vulnerability_score thresholds; null until scored" }

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; subject of the VI-SPDAT" }
      - { name: tool, type: enum, source: input, default: VI_SPDAT, description: "Assessment tool", constraints: "enum {VI_SPDAT}" }
      - { name: self_report_points, type: integer, source: input, description: "Sum of self-reported VI-SPDAT points at intake", constraints: "0..17" }
      - { name: verification_delta, type: integer, source: input, default: 0, description: "Points added/removed after document verification (may be negative)", constraints: "-5..5" }
      - { name: provisional_score, type: integer, source: computed, description: "Score from self_report_points only (available while DRAFT)" }
      - { name: verified_score, type: integer, source: computed, description: "clamp(self_report_points + verification_delta, 0, 17); set on COMPLETED" }
      - { name: recommended_track, type: enum, source: computed, description: "PREVENTION | RRH | PSH — derived from verified_score tier on completion" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMPLETED | EXPIRED", constraints: "enum" }

  - name: ROIConsent
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; consenting client" }
      - { name: scope, type: enum, source: input, description: "SHARE_ALL | SHARE_LIMITED — data-sharing breadth", constraints: "enum" }
      - { name: effective_date, type: string, source: input, description: "Consent effective date YYYY-MM-DD (inclusive)" }
      - { name: expiry_date, type: string, source: input, description: "Consent expiry date YYYY-MM-DD (exclusive)" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | REVOKED | EXPIRED", constraints: "enum" }

  - name: DiversionScreening
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; screened client" }
      - { name: has_safe_alternative, type: boolean, source: input, description: "Whether client has a safe temporary alternative to shelter" }
      - { name: is_fleeing_dv, type: boolean, source: input, default: false, description: "Fleeing domestic violence (crisis-triage flag)" }
      - { name: outcome, type: enum, source: system, description: "DIVERTED | PROCEED_TO_SHELTER | PROCEED_TO_PRIORITIZATION — set on resolve", constraints: "enum" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED", constraints: "enum" }

  - name: Shelter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shelter/project name" }
      - { name: project_type, type: enum, source: input, description: "ES | TH (Emergency Shelter | Transitional Housing)", constraints: "enum" }
      - { name: total_beds, type: integer, source: computed, description: "Count of Bed rows under this shelter (all statuses)" }
      - { name: available_beds, type: integer, source: computed, description: "Count of ACTIVE Bed rows with no RESERVED/CHECKED_IN reservation covering the current logical-clock date (see bed_availability calc)" }

  - name: Bed
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: input, description: "FK -> Shelter.id; owning shelter" }
      - { name: label, type: string, source: input, description: "Human bed label, unique within shelter" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OFFLINE — physical usability (not occupancy)", constraints: "enum" }
      - { name: current_reservation_id, type: string, source: system, description: "FK -> BedReservation.id; the reservation CHECKED_IN in this bed right now, null when unoccupied" }

  - name: BedReservation
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; reserving client" }
      - { name: shelter_id, type: string, source: input, description: "FK -> Shelter.id; target shelter (bed is server-assigned within it)" }
      - { name: bed_id, type: string, source: system, description: "FK -> Bed.id; the bed assigned by the server selector on creation" }
      - { name: entry_date, type: string, source: input, description: "Stay entry date YYYY-MM-DD (inclusive)" }
      - { name: expected_exit_date, type: string, source: input, description: "Planned exit date YYYY-MM-DD (exclusive; half-open occupancy [entry, expected_exit))" }
      - { name: exit_date, type: string, source: system, description: "Actual exit date YYYY-MM-DD, set on check-out; null until then" }
      - { name: status, type: enum, source: system, description: "RESERVED | CHECKED_IN | CHECKED_OUT | NO_SHOW | CANCELLED | EXPIRED", constraints: "enum" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: input, description: "FK -> Shelter.id; shelter the client is waiting for" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; waiting client" }
      - { name: entry_date, type: string, source: input, description: "Requested stay entry date YYYY-MM-DD (inclusive)" }
      - { name: expected_exit_date, type: string, source: input, description: "Requested stay exit date YYYY-MM-DD (exclusive)" }
      - { name: priority_score, type: integer, source: computed, description: "Snapshot of client ranking used to order the waitlist (see waitlist_priority calc)" }
      - { name: promoted_reservation_id, type: string, source: system, description: "FK -> BedReservation.id; reservation minted when promoted, null otherwise" }
      - { name: status, type: enum, source: system, description: "WAITING | PROMOTED | CANCELLED | EXPIRED", constraints: "enum" }

  - name: PrioritizationEntry
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client placed in the community prioritization pool" }
      - { name: rank_score, type: integer, source: computed, description: "Community prioritization score (see prioritization_rank calc)" }
      - { name: deferred_until, type: string, source: system, description: "YYYY-MM-DD; while status DEFERRED the entry is excluded from matching until the clock reaches it; null otherwise" }
      - { name: matched_referral_id, type: string, source: system, description: "FK -> Referral.id; active match, null when unmatched" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MATCHED | HOUSED | DEFERRED | REMOVED", constraints: "enum" }

  - name: HousingNavigator
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Navigator staff name" }
      - { name: max_caseload, type: integer, source: input, description: "Maximum simultaneous ACCEPTED referrals", constraints: ">= 1" }
      - { name: current_caseload, type: integer, source: computed, description: "Count of this navigator's referrals in status ACCEPTED (see navigator_caseload calc)" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; referred client" }
      - { name: prioritization_entry_id, type: string, source: input, description: "FK -> PrioritizationEntry.id; the pool entry being matched" }
      - { name: navigator_id, type: string, source: input, description: "FK -> HousingNavigator.id; assigned navigator" }
      - { name: psh_project_name, type: string, source: input, description: "Target permanent-supportive-housing project name" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | DECLINED | ENROLLED | EXPIRED", constraints: "enum" }

  - name: ExitRecord
    parent: null
    common_fields: false   # append-only outcome record: id + created_at only
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; exiting client" }
      - { name: reservation_id, type: string, source: input, description: "FK -> BedReservation.id; the shelter enrollment being exited, null for PSH exits" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; the PSH enrollment being exited, null for shelter exits" }
      - { name: destination, type: enum, source: input, description: "PERMANENT_HOUSING | RRH | TEMP_FAMILY | INSTITUTION | EMERGENCY_SHELTER | STREET | UNKNOWN", constraints: "enum" }
      - { name: outcome, type: enum, source: computed, description: "POSITIVE | NEUTRAL | NEGATIVE — derived from destination (see exit_outcome calc)" }
      - { name: bed_nights, type: integer, source: computed, description: "Length of stay in bed-nights for shelter exits (see length_of_stay calc); 0 for PSH exits" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: INTAKE
    terminal_states: [MERGED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /assessments/{id}/complete (first COMPLETED assessment for the client)"
        actor: IntakeSpecialist
        preconditions: ["Client.status == INTAKE"]
        side_effects:
          - "Client.vulnerability_score := Assessment.verified_score"
          - "Client.acuity_tier recomputed via acuity_tier calc"
      - from: ACTIVE
        to: HOUSED
        trigger: "POST /referrals/{id}/enroll (cascade L2 from PrioritizationEntry -> HOUSED)"
        actor: HousingNavigator
        preconditions: ["Client.status == ACTIVE"]
        side_effects: ["Client leaves the prioritization pool"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /clients/{id}/deactivate"
        actor: HMISAdmin
        preconditions: ["Client.status == ACTIVE", "Client has no RESERVED/CHECKED_IN BedReservation"]
        side_effects: []
      - from: ACTIVE
        to: MERGED
        trigger: "POST /clients/{id}/merge (this ACTIVE client is the duplicate absorbed into master)"
        actor: HMISAdmin
        preconditions:
          - "duplicate Client.status IN {INTAKE, ACTIVE}"
          - "duplicate != master (ERR_MERGE_INVALID)"
          - "duplicate Client has an ACTIVE ROIConsent (de-duplication requires consent)"
        side_effects:
          - "duplicate.master_client_id := master.id"
          - "CASCADE L1: duplicate's CHECKED_IN/RESERVED BedReservation -> CANCELLED"
          - "CASCADE L1: duplicate's ACTIVE PrioritizationEntry -> REMOVED"
      - from: INTAKE
        to: MERGED
        trigger: "POST /clients/{id}/merge (duplicate still in INTAKE)"
        actor: HMISAdmin
        preconditions: ["duplicate Client.status == INTAKE", "duplicate Client has an ACTIVE ROIConsent"]
        side_effects: ["duplicate.master_client_id := master.id"]

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: DRAFT
        to: COMPLETED
        trigger: "POST /assessments/{id}/complete"
        actor: IntakeSpecialist
        preconditions: ["Assessment.status == DRAFT"]
        side_effects:
          - "verified_score := clamp(self_report_points + verification_delta, 0, 17)"
          - "recommended_track derived from verified_score tier"
          - "Client.vulnerability_score := verified_score; Client.acuity_tier recomputed"
          - "If Client.status == INTAKE: Client -> ACTIVE"
      - from: DRAFT
        to: EXPIRED
        trigger: "system (logical clock >= created_at + 90 days while still DRAFT, evaluated on next read/write of the assessment)"
        actor: system
        preconditions: ["Assessment.status == DRAFT"]
        side_effects: []

  - entity: ROIConsent
    initial_state: PENDING
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /consents/{id}/activate"
        actor: IntakeSpecialist
        preconditions: ["ROIConsent.status == PENDING", "logical clock date >= effective_date"]
        side_effects: ["Client de-duplication and prioritization-pool placement now permitted"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /consents/{id}/revoke"
        actor: IntakeSpecialist
        preconditions: ["ROIConsent.status == ACTIVE"]
        side_effects: ["CASCADE: Client's ACTIVE PrioritizationEntry -> REMOVED (consent withdrawn)"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock date >= expiry_date, evaluated on next read/write of the consent)"
        actor: system
        preconditions: ["ROIConsent.status == ACTIVE"]
        side_effects: []

  - entity: DiversionScreening
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /screenings/{id}/resolve"
        actor: IntakeSpecialist
        preconditions: ["DiversionScreening.status == OPEN"]
        side_effects:
          - "outcome := PROCEED_TO_SHELTER if is_fleeing_dv"
          - "else outcome := DIVERTED if has_safe_alternative"
          - "else outcome := PROCEED_TO_PRIORITIZATION"

  - entity: Bed
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OFFLINE
        trigger: "POST /beds/{id}/offline"
        actor: ShelterManager
        preconditions: ["Bed.status == ACTIVE", "Bed.current_reservation_id == null (no active occupant)"]
        side_effects: ["Shelter.version += 1; available_beds recomputed"]
      - from: OFFLINE
        to: ACTIVE
        trigger: "POST /beds/{id}/online"
        actor: ShelterManager
        preconditions: ["Bed.status == OFFLINE"]
        side_effects: ["Shelter.version += 1; available_beds recomputed; CASCADE: waitlist promotion evaluated"]

  - entity: BedReservation
    initial_state: RESERVED
    terminal_states: [CHECKED_OUT, NO_SHOW, CANCELLED, EXPIRED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /bed-reservations/{id}/check-in"
        actor: ShelterManager
        preconditions:
          - "BedReservation.status == RESERVED"
          - "CROSS-ENTITY: reserving Client has an ACTIVE ROIConsent (ERR_CONSENT_REQUIRED)"
        side_effects: ["Bed.current_reservation_id := this reservation.id (bed now occupied)"]
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /bed-reservations/{id}/check-out"
        actor: ShelterManager
        preconditions: ["BedReservation.status == CHECKED_IN"]
        side_effects:
          - "exit_date := logical clock date"
          - "CASCADE L1: Bed.current_reservation_id := null (bed freed)"
          - "CASCADE L2: waitlist promotion evaluated; top eligible WAITING entry -> PROMOTED, new RESERVED reservation minted (server-assigned bed)"
          - "Shelter.version += 1; available_beds recomputed"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /bed-reservations/{id}/cancel"
        actor: ShelterManager
        preconditions: ["BedReservation.status == RESERVED"]
        side_effects:
          - "CASCADE L1: window freed on assigned bed"
          - "CASCADE L2: waitlist promotion evaluated"
          - "Shelter.version += 1; available_beds recomputed"
      - from: RESERVED
        to: NO_SHOW
        trigger: "POST /bed-reservations/{id}/no-show"
        actor: ShelterManager
        preconditions: ["BedReservation.status == RESERVED", "logical clock date > entry_date"]
        side_effects:
          - "CASCADE L1: window freed on assigned bed"
          - "CASCADE L2: waitlist promotion evaluated"
          - "Shelter.version += 1; available_beds recomputed"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "system (cascade L1 from Client merge: duplicate's occupying reservation cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE L2: Bed.current_reservation_id := null (bed freed)"
          - "CASCADE L3: waitlist promotion evaluated; top eligible WAITING entry -> PROMOTED, new reservation minted"
          - "Shelter.version += 1; available_beds recomputed"

  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [PROMOTED, CANCELLED, EXPIRED]
    transitions:
      - from: WAITING
        to: PROMOTED
        trigger: "system (bed freed -> highest priority_score WAITING entry whose window can be served is promoted)"
        actor: system
        preconditions: ["WaitlistEntry.status == WAITING", "an ACTIVE bed with no window-overlapping reservation exists for the entry's [entry_date, expected_exit_date)"]
        side_effects: ["promoted_reservation_id := minted RESERVED reservation.id"]
      - from: WAITING
        to: CANCELLED
        trigger: "POST /waitlist-entries/{id}/cancel"
        actor: ShelterManager
        preconditions: ["WaitlistEntry.status == WAITING"]
        side_effects: []

  - entity: PrioritizationEntry
    initial_state: ACTIVE
    terminal_states: [HOUSED, REMOVED]
    transitions:
      - from: ACTIVE
        to: MATCHED
        trigger: "POST /referrals (referral minted against this entry)"
        actor: HousingNavigator
        preconditions:
          - "PrioritizationEntry.status == ACTIVE"
          - "CROSS-ENTITY: Client has a COMPLETED Assessment (ERR_ASSESSMENT_REQUIRED)"
        side_effects: ["matched_referral_id := new referral.id"]
      - from: MATCHED
        to: ACTIVE
        trigger: "POST /referrals/{id}/decline (re-queue; CYCLE) or referral EXPIRED"
        actor: HousingNavigator
        preconditions: ["PrioritizationEntry.status == MATCHED"]
        side_effects: ["matched_referral_id := null", "rank_score recomputed (returns to pool)"]
      - from: MATCHED
        to: HOUSED
        trigger: "POST /referrals/{id}/enroll"
        actor: HousingNavigator
        preconditions: ["PrioritizationEntry.status == MATCHED"]
        side_effects: ["CASCADE L2: Client ACTIVE -> HOUSED"]
      - from: ACTIVE
        to: DEFERRED
        trigger: "POST /prioritization-entries/{id}/defer"
        actor: HousingNavigator
        preconditions: ["PrioritizationEntry.status == ACTIVE"]
        side_effects: ["deferred_until := provided date; excluded from matching until clock reaches it"]
      - from: DEFERRED
        to: ACTIVE
        trigger: "POST /prioritization-entries/{id}/reactivate"
        actor: HousingNavigator
        preconditions: ["PrioritizationEntry.status == DEFERRED"]
        side_effects: ["deferred_until := null; rank_score recomputed"]
      - from: ACTIVE
        to: REMOVED
        trigger: "system (cascade from ROIConsent revoke or Client merge)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Referral
    initial_state: PENDING
    terminal_states: [DECLINED, ENROLLED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /referrals/{id}/accept"
        actor: HousingNavigator
        preconditions:
          - "Referral.status == PENDING"
          - "navigator.current_caseload < navigator.max_caseload (ERR_CASELOAD_FULL)"
        side_effects: ["navigator.current_caseload += 1 (see navigator_caseload calc)"]
      - from: PENDING
        to: DECLINED
        trigger: "POST /referrals/{id}/decline"
        actor: HousingNavigator
        preconditions: ["Referral.status == PENDING"]
        side_effects: ["CASCADE: PrioritizationEntry MATCHED -> ACTIVE (re-queue); caseload unchanged (was never accepted)"]
      - from: ACCEPTED
        to: DECLINED
        trigger: "POST /referrals/{id}/decline"
        actor: HousingNavigator
        preconditions: ["Referral.status == ACCEPTED"]
        side_effects:
          - "navigator.current_caseload -= 1 (compensating; see navigator_caseload calc)"
          - "CASCADE: PrioritizationEntry MATCHED -> ACTIVE (re-queue)"
      - from: ACCEPTED
        to: ENROLLED
        trigger: "POST /referrals/{id}/enroll"
        actor: HousingNavigator
        preconditions: ["Referral.status == ACCEPTED"]
        side_effects:
          - "CASCADE L1: PrioritizationEntry MATCHED -> HOUSED"
          - "CASCADE L2: Client ACTIVE -> HOUSED"
          - "navigator.current_caseload -= 1 (referral leaves ACCEPTED into ENROLLED)"
      - from: PENDING
        to: EXPIRED
        trigger: "system (logical clock >= created_at + 14 days while still PENDING, evaluated on next read/write of the referral)"
        actor: system
        preconditions: ["Referral.status == PENDING"]
        side_effects: ["CASCADE: PrioritizationEntry MATCHED -> ACTIVE (re-queue)"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-shelter
    parent_entity: Shelter
    write_endpoint: "POST /bed-reservations"
    occ_field: "expected_shelter_version"
    description: |
      Creating a BedReservation against a Shelter whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just consumed capacity (booking or offlining a
      bed, which legitimately mutates the shared pool) so the current writer's
      view of available beds is stale and their reservation would occupy the
      last non-overlapping bed the other writer already took.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: vulnerability_score
    trigger: "Assessment creation (provisional) and POST /assessments/{id}/complete (verified)"
    algorithm: weighted_scoring
    formula: |
      provisional_score = self_report_points                                  # available while DRAFT
      verified_score    = clamp(self_report_points + verification_delta, 0, 17)  # set on COMPLETED
      Client.vulnerability_score := verified_score of the client's latest COMPLETED assessment
    input_set: "Single Assessment row; Client picks its latest COMPLETED assessment by created_at DESC (id never used as tie-break)"
    constants: { MIN: 0, MAX: 17 }
    precision: "integer"
    variants:
      - name: provisional
        when: "assessment still DRAFT — only self_report_points known"
        difference: "equals self_report_points; ignores verification_delta"
      - name: verified
        when: "assessment COMPLETED — document verification applied"
        difference: "adds verification_delta then clamps to [0,17]; drives Client.vulnerability_score and acuity_tier"

  - name: acuity_tier
    trigger: "recomputed whenever Client.vulnerability_score changes"
    algorithm: threshold
    formula: |
      if vulnerability_score is null: acuity_tier := null
      elif vulnerability_score >= 8:  acuity_tier := HIGH      # PSH track
      elif vulnerability_score >= 4:  acuity_tier := MODERATE  # RRH track
      else:                           acuity_tier := LOW       # prevention/diversion
      recommended_track: HIGH->PSH, MODERATE->RRH, LOW->PREVENTION
    input_set: "Client.vulnerability_score"
    constants: { HIGH_MIN: 8, MODERATE_MIN: 4 }
    precision: "integer thresholds; boundary inclusive (>=)"

  - name: prioritization_rank
    trigger: "PrioritizationEntry creation and recompute on reactivate / decline re-queue"
    algorithm: weighted_scoring
    formula: |
      # combinatorial mode (a): >=3 inputs, tiered selection + conditional branches + capped min
      tier_weight   = {HIGH:1000, MODERATE:500, LOW:100, null:0}[Client.acuity_tier]  # unscored client -> 0
      chronic_bonus = 300 if Client.chronic_homeless else 0
      if   Client.months_homeless >= 12: time_pts = 200
      elif Client.months_homeless >= 6:  time_pts = 100
      else:                              time_pts = Client.months_homeless * 10
      household_factor = min(Client.household_size, 5) * 20     # capped at 5
      rank_score = tier_weight + chronic_bonus + time_pts + household_factor
    input_set: "Client.acuity_tier, chronic_homeless, months_homeless, household_size at compute time"
    constants: { HH_CAP: 5, HH_MULT: 20, CHRONIC_BONUS: 300, TIME_12: 200, TIME_6: 100, TIME_MULT: 10 }
    precision: "integer"

  - name: waitlist_priority
    trigger: "WaitlistEntry creation (snapshot) and evaluated during promotion selection"
    algorithm: selector
    formula: |
      priority_score := prioritization_rank formula applied to the waiting Client (snapshot at creation)
      Promotion selector when capacity frees in shelter S:
        candidate_set = WaitlistEntry where status == WAITING AND shelter_id == S
                        AND an ACTIVE bed exists with no RESERVED/CHECKED_IN reservation
                        overlapping [entry_date, expected_exit_date)
        rank: priority_score DESC
        tie-break: created_at ASC     # id NEVER used
        fallback: candidate_set empty -> no promotion; capacity remains free
    input_set: "WAITING WaitlistEntry rows for the shelter"
    constants: {}
    precision: "integer"

  - name: bed_assignment
    trigger: "POST /bed-reservations and waitlist promotion"
    algorithm: selector
    formula: |
      candidate beds = Bed where shelter_id == req.shelter_id AND status == ACTIVE
                       AND no RESERVED/CHECKED_IN reservation on that bed overlaps
                       [entry_date, expected_exit_date)   # HALF-OPEN: adjacency (exit == other's entry) is NOT overlap
      rank: created_at ASC ; tie-break: label ASC  # id NEVER used
      fallback: candidate set empty -> ERR_SHELTER_AT_CAPACITY
      assigned bed_id := first candidate
    input_set: "ACTIVE Bed rows for the shelter and their live reservations' windows"
    constants: {}
    precision: "date interval arithmetic, half-open"

  - name: bed_availability
    trigger: "any capacity change (reservation create/cancel/checkout/no-show, bed offline/online)"
    algorithm: aggregation
    formula: |
      # combinatorial mode (c): circular-looking dependency, evaluation order pinned.
      # available capacity depends on live reservations; waitlist promotion CREATES a
      # reservation that re-consumes capacity. Pinned order per freeing event:
      #   step 1: apply the triggering mutation (terminalize the freed reservation / flip bed)
      #   step 2: recompute the shelter's free windows from the surviving live reservations
      #   step 3: run waitlist promotion using the step-2 result (NOT a pre-mutation snapshot)
      #   step 4: if a promotion mints a reservation, re-apply steps 1-2 for it
      Shelter.total_beds := count(all Bed under shelter)
      Shelter.available_beds := count(ACTIVE Bed with no RESERVED/CHECKED_IN reservation covering the current clock date)
    input_set: "Bed rows and live BedReservation rows for the shelter"
    constants: {}
    precision: "integer counts"

  - name: navigator_caseload
    trigger: "referral accept (+1), decline-from-ACCEPTED (-1), enroll (-1)"
    algorithm: aggregation
    formula: |
      current_caseload = count(Referral where navigator_id == N AND status == ACCEPTED)
      INVARIANT (conserved quantity = count of ACCEPTED referrals for the navigator):
        a forward accept paired with its compensating decline leaves current_caseload unchanged.
    input_set: "Referral rows for the navigator with status == ACCEPTED"
    constants: {}
    precision: "integer count"

  - name: exit_outcome
    trigger: "POST /exit-records creation"
    algorithm: threshold
    formula: |
      POSITIVE  if destination IN {PERMANENT_HOUSING, RRH}
      NEUTRAL   if destination IN {TEMP_FAMILY, INSTITUTION}
      NEGATIVE  if destination IN {EMERGENCY_SHELTER, STREET, UNKNOWN}
    input_set: "ExitRecord.destination"
    constants: {}
    precision: "enum mapping"

  - name: length_of_stay
    trigger: "POST /exit-records creation for a shelter exit (reservation_id present)"
    algorithm: aggregation
    formula: |
      # dual-variant on the ExitRecord domain
      d_entry = BedReservation.entry_date ; d_exit = BedReservation.exit_date
      variant BED_NIGHT:           days_between(d_entry, d_exit)          # exit day EXCLUDED (half-open)
      variant ENROLLMENT_DURATION: days_between(d_entry, d_exit) + 1      # both endpoints INCLUDED
      ExitRecord.bed_nights := BED_NIGHT variant ; 0 when reservation_id is null (PSH exit)
    input_set: "Single BedReservation entry_date/exit_date"
    constants: {}
    precision: "integer days"
    variants:
      - name: bed_night
        when: "HUD APR point-in-time counting"
        difference: "exit day excluded; used for ExitRecord.bed_nights and APR avg_length_of_stay"
      - name: enrollment_duration
        when: "case-management duration report"
        difference: "exit day included; equals bed_night + 1"

  - name: apr_metrics
    trigger: "GET /reports/apr"
    algorithm: aggregation
    formula: |
      # combinatorial mode (b) also lives here: rounding order is pinned.
      scope = ExitRecord rows with created_at < as_of_date (optionally filtered to a shelter
              via reservation.shelter_id when shelter_id is supplied)
      total_exited       = count(scope)
      positive_exits     = count(scope where outcome == POSITIVE)
      positive_exit_rate = round( positive_exits / total_exited * 100, 1 )     # SUM counts, ONE division, THEN round; empty -> 0.0
      avg_length_of_stay = round( sum(bed_nights over scope) / total_exited, 2 ) # SUM-THEN-ROUND (never round-per-stay-then-average); empty -> 0.0
      total_enrolled     = count(BedReservation in {RESERVED, CHECKED_IN}) + count(Referral in {ACCEPTED, ENROLLED})
    input_set: "ExitRecord rows (exit side); open BedReservation/Referral rows (enrolled side)"
    constants: { RATE_DP: 1, LOS_DP: 2 }
    precision: "rate 1 dp, avg LOS 2 dp, round_half_up; division-by-zero yields 0.0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,        check: "X-User-Role and X-User-ID headers present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2,  category: auth,        check: "Role permitted for this operation per §1.7", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: all }
  - { priority: 3,  category: existence,   check: "Referenced resources exist (path id then body FKs, left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: all }
  - { priority: 4,  category: business_constraint, check: "Request well-formed; required fields present; enums/types valid; entry_date < expected_exit_date", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: all }
  - { priority: 5,  category: state,       check: "Target resource in a valid state for this transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 6,  category: business_safety, check: "OCC: expected_shelter_version equals Shelter.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /bed-reservations" }
  - { priority: 7,  category: business_referential, check: "Referral create: Client has a COMPLETED Assessment", error_id: ERR_ASSESSMENT_REQUIRED, http_status: 409, applies_to: "POST /referrals" }
  - { priority: 8,  category: business_referential, check: "Bed check-in and Client merge require an ACTIVE ROIConsent for the client (duplicate on merge)", error_id: ERR_CONSENT_REQUIRED, http_status: 409, applies_to: "POST /bed-reservations/{id}/check-in, POST /clients/{id}/merge" }
  - { priority: 9,  category: business_constraint, check: "Merge target and duplicate must differ and duplicate must not already be MERGED", error_id: ERR_MERGE_INVALID, http_status: 409, applies_to: "POST /clients/{id}/merge" }
  - { priority: 10, category: business_temporal, check: "Client overlap: same Client may not hold two reservations occupying the same night; turnover day (one exit == other entry) IS a conflict (INCLUSIVE interval)", error_id: ERR_CLIENT_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /bed-reservations" }
  - { priority: 11, category: business_constraint, check: "Referral accept: navigator.current_caseload < navigator.max_caseload", error_id: ERR_CASELOAD_FULL, http_status: 409, applies_to: "POST /referrals/{id}/accept" }
  - { priority: 12, category: business_constraint, check: "Bed label unique within its shelter", error_id: ERR_DUPLICATE_BED_LABEL, http_status: 409, applies_to: "POST /beds" }
  - { priority: 13, category: business_constraint, check: "Client has no existing WAITING waitlist entry at this shelter", error_id: ERR_DUPLICATE_WAITLIST, http_status: 409, applies_to: "POST /waitlist-entries" }
  - { priority: 14, category: business_fiscal, check: "Bed assignment: an ACTIVE bed with no window-overlapping reservation (HALF-OPEN; adjacency allowed) must exist for [entry_date, expected_exit_date)", error_id: ERR_SHELTER_AT_CAPACITY, http_status: 409, applies_to: "POST /bed-reservations" }
  - { priority: 15, category: business_constraint, check: "Prioritization create requires an ACTIVE ROIConsent and no existing non-terminal entry for the client", error_id: ERR_POOL_INELIGIBLE, http_status: 409, applies_to: "POST /prioritization-entries" }
  - { priority: 16, category: business_constraint, check: "Exit record: the referenced enrollment is not already exited", error_id: ERR_ALREADY_EXITED, http_status: 409, applies_to: "POST /exit-records" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Client ----
  - { method: POST, path: "/clients", description: "Create a client (intake)", roles: [IntakeSpecialist, HMISAdmin], code: 201, input: [full_name, dob, "ssn_last4?", "household_size?", "months_homeless?", "chronic_homeless?"], output: Client, side_effects: ["status=INTAKE"] }
  - { method: GET,  path: "/clients/{id}", description: "Get a client", roles: [IntakeSpecialist, ShelterManager, HousingNavigator, HMISAdmin], code: 200, input: [], output: Client, side_effects: [] }
  - { method: GET,  path: "/clients", description: "List/search clients; master_client_id filter yields de-dup children (reverse-reachability for Client.master_client_id)", roles: [IntakeSpecialist, ShelterManager, HousingNavigator, HMISAdmin], code: 200, input: ["master_client_id?", "status?", "limit?", "offset?"], output: "Client[]", side_effects: [] }
  - { method: POST, path: "/clients/{id}/merge", description: "Merge a duplicate client into this master client (de-duplication)", roles: [HMISAdmin], code: 200, input: [duplicate_client_id], output: Client, side_effects: ["duplicate.status=MERGED; duplicate.master_client_id=master.id", "CASCADE: duplicate reservations CANCELLED -> beds freed -> waitlist promotion; duplicate PrioritizationEntry REMOVED"] }
  - { method: POST, path: "/clients/{id}/deactivate", description: "Deactivate a client", roles: [HMISAdmin], code: 200, input: [], output: Client, side_effects: ["status ACTIVE->INACTIVE"] }

  # ---- Assessment ----
  - { method: POST, path: "/assessments", description: "Create a VI-SPDAT assessment (DRAFT)", roles: [IntakeSpecialist], code: 201, input: [client_id, "tool?", self_report_points, "verification_delta?"], output: Assessment, side_effects: ["status=DRAFT; provisional_score computed"] }
  - { method: GET,  path: "/assessments/{id}", description: "Get an assessment", roles: [IntakeSpecialist, HousingNavigator, HMISAdmin], code: 200, input: [], output: Assessment, side_effects: [] }
  - { method: GET,  path: "/assessments", description: "List assessments; client_id filter (reverse-reachability for Assessment.client_id)", roles: [IntakeSpecialist, HousingNavigator, HMISAdmin], code: 200, input: ["client_id?", "status?", "limit?", "offset?"], output: "Assessment[]", side_effects: [] }
  - { method: POST, path: "/assessments/{id}/complete", description: "Complete assessment; compute verified_score; update client", roles: [IntakeSpecialist], code: 200, input: [], output: Assessment, side_effects: ["status DRAFT->COMPLETED", "verified_score/recommended_track computed", "Client.vulnerability_score & acuity_tier updated; INTAKE Client->ACTIVE"] }

  # ---- ROIConsent ----
  - { method: POST, path: "/consents", description: "Record an ROI consent (PENDING)", roles: [IntakeSpecialist], code: 201, input: [client_id, scope, effective_date, expiry_date], output: ROIConsent, side_effects: ["status=PENDING"] }
  - { method: GET,  path: "/consents/{id}", description: "Get a consent", roles: [IntakeSpecialist, HMISAdmin], code: 200, input: [], output: ROIConsent, side_effects: [] }
  - { method: GET,  path: "/consents", description: "List consents; client_id filter (reverse-reachability for ROIConsent.client_id)", roles: [IntakeSpecialist, HMISAdmin], code: 200, input: ["client_id?", "status?", "limit?", "offset?"], output: "ROIConsent[]", side_effects: [] }
  - { method: POST, path: "/consents/{id}/activate", description: "Activate a consent", roles: [IntakeSpecialist], code: 200, input: [], output: ROIConsent, side_effects: ["status PENDING->ACTIVE"] }
  - { method: POST, path: "/consents/{id}/revoke", description: "Revoke a consent", roles: [IntakeSpecialist], code: 200, input: [], output: ROIConsent, side_effects: ["status ACTIVE->REVOKED", "CASCADE: client's ACTIVE PrioritizationEntry REMOVED"] }

  # ---- DiversionScreening ----
  - { method: POST, path: "/screenings", description: "Create a diversion/crisis-triage screening (OPEN)", roles: [IntakeSpecialist], code: 201, input: [client_id, has_safe_alternative, "is_fleeing_dv?"], output: DiversionScreening, side_effects: ["status=OPEN"] }
  - { method: GET,  path: "/screenings/{id}", description: "Get a screening", roles: [IntakeSpecialist, HMISAdmin], code: 200, input: [], output: DiversionScreening, side_effects: [] }
  - { method: GET,  path: "/screenings", description: "List screenings; client_id filter (reverse-reachability for DiversionScreening.client_id)", roles: [IntakeSpecialist, HMISAdmin], code: 200, input: ["client_id?", "limit?", "offset?"], output: "DiversionScreening[]", side_effects: [] }
  - { method: POST, path: "/screenings/{id}/resolve", description: "Resolve a screening; derive outcome", roles: [IntakeSpecialist], code: 200, input: [], output: DiversionScreening, side_effects: ["status OPEN->RESOLVED; outcome derived"] }

  # ---- Shelter / Bed ----
  - { method: POST, path: "/shelters", description: "Create a shelter", roles: [ShelterManager, HMISAdmin], code: 201, input: [name, project_type], output: Shelter, side_effects: ["total_beds=0; available_beds=0"] }
  - { method: GET,  path: "/shelters/{id}", description: "Get a shelter (includes version for OCC)", roles: [IntakeSpecialist, ShelterManager, HousingNavigator, HMISAdmin], code: 200, input: [], output: Shelter, side_effects: [] }
  - { method: GET,  path: "/shelters", description: "List shelters", roles: [IntakeSpecialist, ShelterManager, HousingNavigator, HMISAdmin], code: 200, input: ["limit?", "offset?"], output: "Shelter[]", side_effects: [] }
  - { method: POST, path: "/beds", description: "Add a bed to a shelter", roles: [ShelterManager], code: 201, input: [shelter_id, label], output: Bed, side_effects: ["status=ACTIVE; Shelter.total_beds & available_beds recomputed; Shelter.version += 1"] }
  - { method: GET,  path: "/beds/{id}", description: "Get a bed", roles: [ShelterManager, HMISAdmin], code: 200, input: [], output: Bed, side_effects: [] }
  - { method: GET,  path: "/beds", description: "List beds; shelter_id / current_reservation_id filters (reverse-reachability for Bed.shelter_id and Bed.current_reservation_id)", roles: [ShelterManager, HMISAdmin], code: 200, input: ["shelter_id?", "current_reservation_id?", "status?", "limit?", "offset?"], output: "Bed[]", side_effects: [] }
  - { method: POST, path: "/beds/{id}/offline", description: "Take an unoccupied bed offline", roles: [ShelterManager], code: 200, input: [], output: Bed, side_effects: ["status ACTIVE->OFFLINE; Shelter.version += 1; available_beds recomputed"] }
  - { method: POST, path: "/beds/{id}/online", description: "Return a bed online", roles: [ShelterManager], code: 200, input: [], output: Bed, side_effects: ["status OFFLINE->ACTIVE; Shelter.version += 1; CASCADE: waitlist promotion"] }

  # ---- BedReservation ----
  - { method: POST, path: "/bed-reservations", description: "Reserve shelter capacity for a client over a date window; server assigns a bed (OCC on shelter)", roles: [ShelterManager], code: 201, input: [client_id, shelter_id, entry_date, expected_exit_date, expected_shelter_version], output: BedReservation, side_effects: ["bed_id assigned by selector", "status=RESERVED", "Shelter.version += 1; available_beds recomputed"] }
  - { method: GET,  path: "/bed-reservations/{id}", description: "Get a reservation", roles: [ShelterManager, HMISAdmin], code: 200, input: [], output: BedReservation, side_effects: [] }
  - { method: GET,  path: "/bed-reservations", description: "List reservations; client_id/bed_id/shelter_id filters (reverse-reachability for BedReservation FKs)", roles: [ShelterManager, HMISAdmin], code: 200, input: ["client_id?", "bed_id?", "shelter_id?", "status?", "limit?", "offset?"], output: "BedReservation[]", side_effects: [] }
  - { method: POST, path: "/bed-reservations/{id}/check-in", description: "Check a client into their reserved bed", roles: [ShelterManager], code: 200, input: [], output: BedReservation, side_effects: ["status RESERVED->CHECKED_IN; Bed.current_reservation_id set; Shelter.version += 1"] }
  - { method: POST, path: "/bed-reservations/{id}/check-out", description: "Check a client out; free the bed; promote waitlist", roles: [ShelterManager], code: 200, input: [], output: BedReservation, side_effects: ["status CHECKED_IN->CHECKED_OUT; exit_date set", "CASCADE: Bed freed; waitlist promotion", "Shelter.version += 1"] }
  - { method: POST, path: "/bed-reservations/{id}/cancel", description: "Cancel a reservation before check-in", roles: [ShelterManager], code: 200, input: [], output: BedReservation, side_effects: ["status RESERVED->CANCELLED; CASCADE: window freed; waitlist promotion; Shelter.version += 1"] }
  - { method: POST, path: "/bed-reservations/{id}/no-show", description: "Mark a reservation as no-show", roles: [ShelterManager], code: 200, input: [], output: BedReservation, side_effects: ["status RESERVED->NO_SHOW; CASCADE: window freed; waitlist promotion; Shelter.version += 1"] }

  # ---- WaitlistEntry ----
  - { method: POST, path: "/waitlist-entries", description: "Add a client to a shelter waitlist for a date window", roles: [ShelterManager], code: 201, input: [shelter_id, client_id, entry_date, expected_exit_date], output: WaitlistEntry, side_effects: ["status=WAITING; priority_score snapshotted"] }
  - { method: GET,  path: "/waitlist-entries/{id}", description: "Get a waitlist entry", roles: [ShelterManager, HMISAdmin], code: 200, input: [], output: WaitlistEntry, side_effects: [] }
  - { method: GET,  path: "/waitlist-entries", description: "List waitlist entries; shelter_id/client_id/promoted_reservation_id filters (reverse-reachability for WaitlistEntry FKs)", roles: [ShelterManager, HMISAdmin], code: 200, input: ["shelter_id?", "client_id?", "promoted_reservation_id?", "status?", "limit?", "offset?"], output: "WaitlistEntry[]", side_effects: [] }
  - { method: POST, path: "/waitlist-entries/{id}/cancel", description: "Cancel a waitlist entry", roles: [ShelterManager], code: 200, input: [], output: WaitlistEntry, side_effects: ["status WAITING->CANCELLED"] }

  # ---- PrioritizationEntry ----
  - { method: POST, path: "/prioritization-entries", description: "Place a client into the community prioritization pool", roles: [HousingNavigator, HMISAdmin], code: 201, input: [client_id], output: PrioritizationEntry, side_effects: ["status=ACTIVE; rank_score computed"] }
  - { method: GET,  path: "/prioritization-entries/{id}", description: "Get a prioritization entry", roles: [HousingNavigator, HMISAdmin], code: 200, input: [], output: PrioritizationEntry, side_effects: [] }
  - { method: GET,  path: "/prioritization-entries", description: "List pool entries; client_id / matched_referral_id filters (reverse-reachability for PrioritizationEntry.client_id and matched_referral_id)", roles: [HousingNavigator, HMISAdmin], code: 200, input: ["client_id?", "matched_referral_id?", "status?", "limit?", "offset?"], output: "PrioritizationEntry[]", side_effects: [] }
  - { method: POST, path: "/prioritization-entries/{id}/defer", description: "Defer an entry until a date", roles: [HousingNavigator], code: 200, input: [deferred_until], output: PrioritizationEntry, side_effects: ["status ACTIVE->DEFERRED"] }
  - { method: POST, path: "/prioritization-entries/{id}/reactivate", description: "Reactivate a deferred entry", roles: [HousingNavigator], code: 200, input: [], output: PrioritizationEntry, side_effects: ["status DEFERRED->ACTIVE; rank_score recomputed"] }

  # ---- HousingNavigator ----
  - { method: POST, path: "/housing-navigators", description: "Create a housing navigator", roles: [HMISAdmin], code: 201, input: [name, max_caseload], output: HousingNavigator, side_effects: ["current_caseload=0"] }
  - { method: GET,  path: "/housing-navigators/{id}", description: "Get a navigator", roles: [HousingNavigator, HMISAdmin], code: 200, input: [], output: HousingNavigator, side_effects: [] }
  - { method: GET,  path: "/housing-navigators", description: "List navigators", roles: [HousingNavigator, HMISAdmin], code: 200, input: ["limit?", "offset?"], output: "HousingNavigator[]", side_effects: [] }

  # ---- Referral ----
  - { method: POST, path: "/referrals", description: "Create a PSH referral matching a pool entry to a navigator", roles: [HousingNavigator], code: 201, input: [client_id, prioritization_entry_id, navigator_id, psh_project_name], output: Referral, side_effects: ["status=PENDING; PrioritizationEntry ACTIVE->MATCHED"] }
  - { method: GET,  path: "/referrals/{id}", description: "Get a referral", roles: [HousingNavigator, HMISAdmin], code: 200, input: [], output: Referral, side_effects: [] }
  - { method: GET,  path: "/referrals", description: "List referrals; client_id/prioritization_entry_id/navigator_id filters (reverse-reachability for Referral FKs)", roles: [HousingNavigator, HMISAdmin], code: 200, input: ["client_id?", "prioritization_entry_id?", "navigator_id?", "status?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - { method: POST, path: "/referrals/{id}/accept", description: "Navigator accepts the referral", roles: [HousingNavigator], code: 200, input: [], output: Referral, side_effects: ["status PENDING->ACCEPTED; navigator.current_caseload += 1"] }
  - { method: POST, path: "/referrals/{id}/decline", description: "Navigator declines the referral (re-queue pool entry)", roles: [HousingNavigator], code: 200, input: [], output: Referral, side_effects: ["status ->DECLINED; PrioritizationEntry MATCHED->ACTIVE; caseload decremented if was ACCEPTED"] }
  - { method: POST, path: "/referrals/{id}/enroll", description: "Enroll the client into PSH", roles: [HousingNavigator], code: 200, input: [], output: Referral, side_effects: ["status ACCEPTED->ENROLLED; CASCADE: PrioritizationEntry->HOUSED; Client->HOUSED; caseload decremented"] }

  # ---- ExitRecord ----
  - { method: POST, path: "/exit-records", description: "Record an exit & outcome for a shelter (reservation_id) or PSH (referral_id) enrollment", roles: [ShelterManager, HousingNavigator, HMISAdmin], code: 201, input: [client_id, "reservation_id?", "referral_id?", destination], output: ExitRecord, side_effects: ["outcome derived; bed_nights computed for shelter exits"] }
  - { method: GET,  path: "/exit-records/{id}", description: "Get an exit record", roles: [ShelterManager, HousingNavigator, HMISAdmin], code: 200, input: [], output: ExitRecord, side_effects: [] }
  - { method: GET,  path: "/exit-records", description: "List exit records; client_id/reservation_id/referral_id filters (reverse-reachability for ExitRecord FKs)", roles: [ShelterManager, HousingNavigator, HMISAdmin], code: 200, input: ["client_id?", "reservation_id?", "referral_id?", "limit?", "offset?"], output: "ExitRecord[]", side_effects: [] }

  # ---- Reports ----
  - { method: GET,  path: "/reports/apr", description: "HUD HMIS Annual Performance Report aggregates", roles: [HMISAdmin], code: 200, input: ["shelter_id?", "as_of_date?"], output: "{ total_enrolled: integer, total_exited: integer, positive_exit_rate: number, avg_length_of_stay: number }", side_effects: [] }

  # ---- Test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time.", roles: [HMISAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock set; drives consent/assessment/referral expiry, no-show, and defer date rules"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or body FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request, missing required field, invalid enum/type, or entry_date >= expected_exit_date" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_shelter_version does not match Shelter.version (OCC)" }
  - { id: ERR_ASSESSMENT_REQUIRED, http: 409, condition: "Referral create but client has no COMPLETED Assessment" }
  - { id: ERR_CONSENT_REQUIRED, http: 409, condition: "Operation requires an ACTIVE ROIConsent for the client (check-in, merge)" }
  - { id: ERR_MERGE_INVALID, http: 409, condition: "Merge duplicate equals master, or duplicate already MERGED" }
  - { id: ERR_CLIENT_DOUBLE_BOOKED, http: 409, condition: "Client already holds a reservation on an overlapping night (inclusive; turnover day conflicts)" }
  - { id: ERR_CASELOAD_FULL, http: 409, condition: "Navigator current_caseload has reached max_caseload" }
  - { id: ERR_DUPLICATE_BED_LABEL, http: 409, condition: "Bed label already used within the shelter" }
  - { id: ERR_DUPLICATE_WAITLIST, http: 409, condition: "Client already has a WAITING waitlist entry at this shelter" }
  - { id: ERR_SHELTER_AT_CAPACITY, http: 409, condition: "No ACTIVE bed free of window-overlapping reservations for the requested [entry, expected_exit) window" }
  - { id: ERR_POOL_INELIGIBLE, http: 409, condition: "Client lacks ACTIVE consent or already has a non-terminal prioritization entry" }
  - { id: ERR_ALREADY_EXITED, http: 409, condition: "Referenced enrollment already has an exit record / is in a terminal exited state" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeSpecialist
    description: "Runs intake, VI-SPDAT assessments, diversion screenings, and ROI consent."
    identity: "opaque"
    exclusive_operations:
      - "POST /assessments and /assessments/{id}/complete"
      - "POST /consents, /consents/{id}/activate, /consents/{id}/revoke"
      - "POST /screenings, /screenings/{id}/resolve"
    shared_operations:
      - "POST /clients (with HMISAdmin)"
      - "GET reads on clients/assessments/consents/screenings/shelters"

  - name: ShelterManager
    description: "Manages shelters, beds, bed reservations, and waitlists."
    identity: "opaque"
    exclusive_operations:
      - "POST /beds and bed offline/online"
      - "POST /bed-reservations and its check-in/check-out/cancel/no-show"
      - "POST /waitlist-entries and /waitlist-entries/{id}/cancel"
    shared_operations:
      - "POST /shelters (with HMISAdmin)"
      - "POST /exit-records (with HousingNavigator, HMISAdmin)"
      - "GET reads on shelters/beds/reservations/waitlist/clients"

  - name: HousingNavigator
    description: "Owns the prioritization pool, PSH referrals, and housing matches."
    identity: "entity_backed:HousingNavigator"
    exclusive_operations:
      - "POST /prioritization-entries defer/reactivate"
      - "POST /referrals and its accept/decline/enroll"
    shared_operations:
      - "POST /prioritization-entries (with HMISAdmin)"
      - "POST /exit-records (with ShelterManager, HMISAdmin)"
      - "GET reads on prioritization-entries/referrals/navigators/assessments/clients"

  - name: HMISAdmin
    description: "System administration: de-duplication merges, navigator provisioning, APR reporting, logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients/{id}/merge and /clients/{id}/deactivate"
      - "POST /housing-navigators"
      - "GET /reports/apr"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /clients, /shelters (with peer roles)"
      - "POST /prioritization-entries, /exit-records (with peer roles)"
      - "GET reads across all collections"
