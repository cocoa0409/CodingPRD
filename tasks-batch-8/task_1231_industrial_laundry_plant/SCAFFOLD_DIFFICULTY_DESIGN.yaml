          - errors[ERR_ROUTE_NOT_DISPATCHED]
        distinguishing_aspect: |
          Pair RouteStop→Route: a stop cannot transition SCHEDULED→ARRIVED
          while its parent Route is still PLANNED; dispatching the route
          unblocks the same call with no other change.
