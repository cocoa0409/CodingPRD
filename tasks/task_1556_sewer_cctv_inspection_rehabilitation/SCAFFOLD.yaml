scenario: |
  Sewer CCTV Inspection & Rehabilitation (sewer district / NASSCO contractor): pipe segment inventory & inspection scheduling, NASSCO defect coding & structural/O&M scoring, rehabilitation method selection (lining/spot repair/replace), bypass pumping & customer notification, lateral reinstatement & post-CIPP inspection, work-order costing & unit pricing, inflow/infiltration reduction measurement, warranty & re-inspection

domain_name: sewer-cctv-rehab
api_prefix: /sewer

# =============================================================================
# Complexity Profile (Step 0)
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration       # multi-step pipeline: inspect -> code -> plan -> bypass -> work -> post-inspect -> warranty
  secondary_archetype: compliance_audit           # NASSCO certification gates, notice lead-time rules, warranty cooling-off
  complexity_layers:
    - derived_field_reconciliation    # segment.structural_grade / om_grade recompute on DefectObservation mutation and inspection certification
    - rate_threshold_triggers         # grade-5 immediate-action flag, I/I reduction target, congestion-style notice-lead thresholds
    - cascading_side_effects          # work-order completion -> post-CIPP inspection -> lateral reinstatement -> warranty clock -> basin I/I re-measure
    - optimistic_concurrency          # OCC on RehabPlan.version for method-selection writes
    - temporal_windowing              # BypassPlan interval conflicts, CustomerNotice lead-time, FlowMonitoringPeriod windows
    - dual_variant_calculation        # quick-rating vs weighted PACP index; provisional estimate vs final invoice; dry-weather vs storm-event I/I
  entity_topology: hybrid             # SewerDistrict -> InspectionCycle/ PipeSegment tree; PipeSegment -> Lateral/CctvInspection/RehabPlan; cross-aggregate WarrantyCase
  state_machine_shape: cyclic         # QA-reject loop on CctvInspection, warranty re-open loop, plus parallel dims on WorkOrder
  relationship_patterns:
    - one_to_many                     # Segment -> Inspections, Segment -> Laterals, Plan -> LineItems
    - cross_aggregate                 # WarrantyCase references PipeSegment + CctvInspection; FlowMonitoringPeriod references SewerDistrict
    - polymorphic                     # WorkOrderLineItem.unit_price_source resolves against method-specific catalog rows
  role_model: segregation_of_duties   # Coder who coded an inspection cannot QA-review it; CrewLead cannot approve own RehabPlan
  consistency_model: immediate        # all side effects visible in the same request response

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SewerDistrict
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "District name; unique" }
      - { name: ii_reduction_target_pct, type: number, source: input, description: "Basin I/I reduction target, percent 0-100; basin completes only when measured reduction >= this" }
      - { name: notice_lead_hours, type: integer, source: input, default: 48, description: "Required customer-notice lead time in hours before bypass activation or excavation" }
      - { name: warranty_months, type: integer, source: input, default: 12, description: "Warranty window in months from WorkOrder completion" }
      - { name: budget_cents, type: integer, source: input, description: "Annual rehabilitation budget in cents" }
      - { name: budget_committed_cents, type: integer, source: computed, default: 0, description: "Sum of provisional_total_cents over RehabPlan in APPROVED/EXECUTING for this district" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: nassco_cert_number, type: string, source: input, description: "NASSCO PACP certification number; unique" }
      - { name: nassco_cert_expires_at, type: datetime, source: input, description: "PACP certification expiry; coding or QA review at/after this instant is rejected" }
      - { name: capabilities, type: array, source: input, description: "Enum list subset of [CODER, QA_REVIEWER, CREW_LEAD]; gates which roles the technician may act as" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive technicians cannot be assigned" }

  - name: InspectionCycle
    parent: SewerDistrict
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> SewerDistrict.id; owning district" }
      - { name: label, type: string, source: input, description: "Cycle label, e.g. '2026-Basin-A'" }
      - { name: window_start, type: datetime, source: input, description: "First instant inspections may be scheduled" }
      - { name: window_end, type: datetime, source: input, description: "Last instant inspections may be scheduled; must be > window_start" }
      - { name: status, type: enum, source: system, description: "DRAFT -> OPEN -> CLOSED" }

  - name: PipeSegment
    parent: SewerDistrict
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> SewerDistrict.id; owning district" }
      - { name: segment_ref, type: string, source: input, description: "Upstream->downstream manhole ref, e.g. 'MH-104->MH-105'; unique within district" }
      - { name: diameter_mm, type: integer, source: input, description: "Nominal pipe diameter in millimeters; drives unit-price tier" }
      - { name: material, type: enum, source: input, description: "VCP | RCP | PVC | HDPE | CI | BRICK" }
      - { name: length_m, type: number, source: input, description: "Segment length in meters; > 0" }
      - { name: install_year, type: integer, source: input, description: "Year installed" }
      - { name: structural_grade, type: integer, source: computed, default: 0, description: "Worst certified structural defect grade 0-5; recomputed on inspection CERTIFIED and on DefectObservation mutation" }
      - { name: om_grade, type: integer, source: computed, default: 0, description: "Worst certified O&M defect grade 0-5; recomputed on inspection CERTIFIED and on DefectObservation mutation" }
      - { name: quick_rating, type: string, source: computed, default: null, description: "PACP Quick Rating 4-char code from latest CERTIFIED inspection, e.g. '5131'; null until first certification" }
      - { name: structural_index, type: number, source: computed, default: null, description: "Weighted structural index from latest CERTIFIED inspection; null until first certification" }
      - { name: rehab_status, type: enum, source: system, default: "NONE", description: "NONE | PLANNED | IN_PROGRESS | REHABILITATED | WARRANTY" }
      - { name: last_rehab_completed_at, type: datetime, source: system, default: null, description: "Completion timestamp of latest COMPLETED WorkOrder; null if none" }

  - name: Lateral
    parent: PipeSegment
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: system, description: "FK -> PipeSegment.id; host segment" }
      - { name: address, type: string, source: input, description: "Service address; unique within segment" }
      - { name: connection_type, type: enum, source: input, description: "DIRECT | WYE | SADDLE" }
      - { name: active, type: boolean, source: input, default: true, description: "Only active laterals require reinstatement after CIPP lining" }
      - { name: reinstated, type: boolean, source: system, default: false, description: "Set true by reinstatement record on post-CIPP inspection; reset false when a new CIPP WorkOrder completes on the segment" }

  - name: CctvInspection
    parent: PipeSegment
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: system, description: "FK -> PipeSegment.id; inspected segment" }
      - { name: cycle_id, type: string, source: input, description: "FK -> InspectionCycle.id; scheduling cycle" }
      - { name: scheduled_at, type: datetime, source: input, description: "Planned inspection instant; must lie inside cycle window" }
      - { name: coder_id, type: string, source: input, description: "FK -> Technician.id; NASSCO coder who performs coding" }
      - { name: qa_reviewer_id, type: string, source: system, default: null, description: "FK -> Technician.id; QA reviewer who certified or last rejected; null until first QA action" }
      - { name: purpose, type: enum, source: input, default: "BASELINE", description: "BASELINE | PRE_REHAB | POST_CIPP | WARRANTY_RE" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_PROGRESS -> CODING -> QA_REVIEW -> CERTIFIED; QA_REVIEW -> CODING (reject loop); SCHEDULED/CODING -> VOIDED" }
      - { name: reject_count, type: integer, source: system, default: 0, description: "Number of QA rejections; inspection auto-VOIDED at 3" }
      - { name: certified_at, type: datetime, source: system, default: null, description: "Timestamp of certification" }

  - name: DefectObservation
    parent: CctvInspection
    common_fields: false
    fields:
      - { name: inspection_id, type: string, source: system, description: "FK -> CctvInspection.id; owning inspection" }
      - { name: pacp_code, type: string, source: input, description: "NASSCO PACP defect code, e.g. 'CRK', 'B', 'RTL'; uppercase 2-6 chars" }
      - { name: family, type: enum, source: input, description: "STRUCTURAL | OM" }
      - { name: grade, type: integer, source: input, description: "PACP grade 1-5; 5 = immediate attention" }
      - { name: distance_m, type: number, source: input, description: "Distance from upstream manhole, meters; 0 <= distance_m <= segment.length_m" }
      - { name: clock_position, type: integer, source: input, description: "Clock position 0-12 where applicable; 0 = not applicable" }
      - { name: extent_m, type: number, source: input, default: 0, description: "Continuous defect length in meters for longitudinal codes; 0 for point defects" }

  - name: RehabPlan
    parent: PipeSegment
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: system, description: "FK -> PipeSegment.id; target segment" }
      - { name: method, type: enum, source: input, description: "CIPP_LINING | SPOT_REPAIR | FULL_REPLACE" }
      - { name: basis_inspection_id, type: string, source: input, description: "FK -> CctvInspection.id; CERTIFIED inspection the method decision is based on" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PROPOSED -> APPROVED -> EXECUTING -> COMPLETED; APPROVED -> DRAFT (reopen); DRAFT/PROPOSED -> CANCELLED" }
      - { name: provisional_total_cents, type: integer, source: computed, default: 0, description: "Sum of provisional line totals (scheduled qty x catalog unit price, rounded per line then summed)" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Sum of final line totals (installed qty); null until WorkOrder COMPLETED" }

  - name: WorkOrder
    parent: RehabPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> RehabPlan.id; governing plan" }
      - { name: crew_lead_id, type: string, source: input, description: "FK -> Technician.id; assigned crew lead with CREW_LEAD capability" }
      - { name: execution_status, type: enum, source: system, description: "Dimension A: ISSUED -> MOBILIZED -> IN_WORK -> PUNCH_LIST -> COMPLETED; IN_WORK -> MOBILIZED (stand-down); ISSUED/MOBILIZED -> CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "Dimension B (parallel): UNBILLED -> INVOICED -> PAID; INVOICED -> UNBILLED (invoice void)" }
      - { name: mobilization_tier, type: enum, source: computed, description: "MOB_SMALL | MOB_STANDARD | MOB_LARGE derived from segment diameter and length at ISSUED" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Execution completion timestamp; starts warranty window" }
      - { name: warranty_expires_at, type: datetime, source: computed, default: null, description: "completed_at + district.warranty_months" }

  - name: WorkOrderLineItem
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; owning work order" }
      - { name: pay_item_code, type: string, source: input, description: "Unit-price catalog code, e.g. 'CIPP-8IN-LF', 'SPOT-EA', 'EXC-CY'" }
      - { name: scheduled_qty, type: number, source: input, description: "Planned quantity; > 0" }
      - { name: installed_qty, type: number, source: input, default: null, description: "Field-measured installed quantity; settable only while execution_status IN {IN_WORK, PUNCH_LIST}; null until reported" }
      - { name: unit_price_cents, type: integer, source: input, description: "Catalog unit price in cents; > 0" }
      - { name: provisional_line_cents, type: integer, source: computed, description: "round_half_up(scheduled_qty x unit_price_cents) computed per line" }
      - { name: final_line_cents, type: integer, source: computed, default: null, description: "round_half_up(installed_qty x unit_price_cents); null while installed_qty is null" }

  - name: BypassPlan
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; work order needing flow control" }
      - { name: window_start, type: datetime, source: input, description: "Bypass pumping start instant" }
      - { name: window_end, type: datetime, source: input, description: "Bypass pumping end instant; must be > window_start; interval semantics are half-open [start, end) with a 30-minute setup buffer on both sides" }
      - { name: pump_capacity_gpm, type: integer, source: input, description: "Rated pump capacity gallons/minute; must be >= segment peak flow 25 gpm per inch of diameter" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> APPROVED -> ACTIVE -> DEMOBILIZED -> CLOSED; PROPOSED -> REJECTED" }

  - name: CustomerNotice
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; originating work order" }
      - { name: address, type: string, source: input, description: "Affected address; for lining work must match an active Lateral address on the segment" }
      - { name: channel, type: enum, source: input, description: "DOOR_HANGER | MAIL | SMS | EMAIL" }
      - { name: event_start, type: datetime, source: input, description: "Start of the disruptive event being noticed (bypass start or excavation start)" }
      - { name: sent_at, type: datetime, source: system, default: null, description: "Delivery timestamp; set by /send transition" }
      - { name: status, type: enum, source: system, description: "QUEUED -> SENT -> ACKNOWLEDGED | EXPIRED; EXPIRED when logical clock reaches event_start while still QUEUED" }

  - name: WarrantyCase
    parent: PipeSegment
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: system, description: "FK -> PipeSegment.id; segment under claim" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the COMPLETED work order whose warranty covers this claim" }
      - { name: opened_at, type: datetime, source: system, description: "Claim timestamp; must be <= warranty_expires_at of the referenced work order" }
      - { name: defect_summary, type: string, source: input, description: "Claimed defect description" }
      - { name: re_inspection_id, type: string, source: system, default: null, description: "FK -> CctvInspection.id; the WARRANTY_RE inspection created for this case" }
      - { name: status, type: enum, source: system, description: "OPENED -> RE_INSPECTION -> UNDER_REPAIR -> RESOLVED | DENIED; RESOLVED -> OPENED (re-open on recurrence); OPENED/RE_INSPECTION -> WITHDRAWN" }
      - { name: resolution_note, type: string, source: input, default: null, description: "Required when closing RESOLVED or DENIED" }

  - name: FlowMonitoringPeriod
    parent: SewerDistrict
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> SewerDistrict.id; monitored district" }
      - { name: basin_label, type: string, source: input, description: "Sub-basin label within district" }
      - { name: phase, type: enum, source: input, description: "PRE_REHAB | POST_REHAB; a POST period may only start after at least one district segment reaches REHABILITATED" }
      - { name: window_start, type: datetime, source: input, description: "Monitoring start; closed interval [window_start, window_end] inclusive of both instants" }
      - { name: window_end, type: datetime, source: input, description: "Monitoring end; must be >= window_start + 168h" }
      - { name: dry_weather_avg_gpm, type: number, source: input, default: null, description: "Average dry-weather diurnal flow; recorded at close" }
      - { name: peak_storm_gpm, type: number, source: input, default: null, description: "Peak qualifying storm-event flow; recorded at close" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> CLOSED -> ANALYZED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InspectionCycle
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /sewer/inspection-cycles/{id}/open"
        actor: DistrictEngineer
        preconditions:
          - "window_start < window_end"
          - "No other InspectionCycle for the same district_id is in OPEN status (ERR_CYCLE_OVERLAP)"
        side_effects:
          - "increments InspectionCycle.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /sewer/inspection-cycles/{id}/close"
        actor: DistrictEngineer
        preconditions:
          - "Every CctvInspection with cycle_id = this.id is in a terminal-or-stable state: CERTIFIED or VOIDED (ERR_INSPECTIONS_OPEN)"
        side_effects:
          - "increments InspectionCycle.version by 1"

  - entity: CctvInspection
    initial_state: SCHEDULED
    terminal_states: [CERTIFIED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /sewer/cctv-inspections/{id}/start"
        actor: Coder
        preconditions:
          - "acting Coder's Technician.id == inspection.coder_id (ERR_NOT_ASSIGNED_CODER)"
          - "coder's nassco_cert_expires_at > current logical time (ERR_CERT_EXPIRED)"
          - "inspection cycle is OPEN (ERR_CYCLE_NOT_OPEN)"
        side_effects: ["increments CctvInspection.version by 1"]
      - from: IN_PROGRESS
        to: CODING
        trigger: "POST /sewer/cctv-inspections/{id}/begin-coding"
        actor: Coder
        preconditions:
          - "acting Coder's Technician.id == inspection.coder_id (ERR_NOT_ASSIGNED_CODER)"
        side_effects: ["increments CctvInspection.version by 1"]
      - from: CODING
        to: QA_REVIEW
        trigger: "POST /sewer/cctv-inspections/{id}/submit-qa"
        actor: Coder
        preconditions:
          - "acting Coder's Technician.id == inspection.coder_id (ERR_NOT_ASSIGNED_CODER)"
          - "inspection has >= 1 DefectObservation (ERR_NO_DEFECTS_CODED)"
        side_effects: ["increments CctvInspection.version by 1"]
      - from: QA_REVIEW
        to: CERTIFIED
        trigger: "POST /sewer/cctv-inspections/{id}/certify"
        actor: QaReviewer
        preconditions:
          - "acting QaReviewer's Technician.id != inspection.coder_id (segregation of duties) (ERR_SOD_VIOLATION)"
          - "acting QaReviewer has QA_REVIEWER capability and nassco_cert_expires_at > current logical time (ERR_CERT_EXPIRED)"
        side_effects:
          - "qa_reviewer_id := acting technician id; certified_at := current logical time"
          - "recompute pacp_scoring on PipeSegment: structural_grade, om_grade, quick_rating, structural_index from THIS inspection's observations"
          - "if segment.rehab_status == NONE and structural_grade == 5: no auto-change (flag only; rehab decision remains manual)"
          - "if purpose == POST_CIPP and a COMPLETED WorkOrder exists for the segment and all active laterals have reinstated == true: segment.rehab_status := WARRANTY (post-acceptance); otherwise rehab_status unchanged by certification"
          - "increments CctvInspection.version by 1"
      - from: QA_REVIEW
        to: CODING
        trigger: "POST /sewer/cctv-inspections/{id}/reject"
        actor: QaReviewer
        preconditions:
          - "acting QaReviewer's Technician.id != inspection.coder_id (ERR_SOD_VIOLATION)"
          - "reject_count <= 1 for the CODING loop branch; when reject_count == 2 the reject action instead routes through the QA_REVIEW -> VOIDED system transition (no error is raised — the reject call itself succeeds)"
        side_effects:
          - "reject_count += 1"
          - "increments CctvInspection.version by 1"
      - from: QA_REVIEW
        to: VOIDED
        trigger: "system (automatic when reject_count would reach 3 on a reject action)"
        actor: system
        preconditions: []
        side_effects:
          - "reject_count := 3; any WarrantyCase whose re_inspection_id == this.id and status == RE_INSPECTION moves back to OPENED"
          - "increments CctvInspection.version by 1"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /sewer/cctv-inspections/{id}/void"
        actor: DistrictEngineer
        preconditions: []
        side_effects: ["increments CctvInspection.version by 1"]
      - from: CODING
        to: VOIDED
        trigger: "POST /sewer/cctv-inspections/{id}/void"
        actor: DistrictEngineer
        preconditions: []
        side_effects: ["increments CctvInspection.version by 1"]

  - entity: RehabPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /sewer/rehab-plans/{id}/propose"
        actor: DistrictEngineer
        preconditions:
          - "basis_inspection_id inspection is CERTIFIED (ERR_BASIS_NOT_CERTIFIED)"
          - "method is compatible with the segment's certified grades: SPOT_REPAIR requires structural_grade <= 3 and exactly 1-2 grade>=3 structural observations; CIPP_LINING requires structural_grade >= 2 and segment.material != 'BRICK'; FULL_REPLACE always allowed (ERR_METHOD_INCOMPATIBLE)"
        side_effects:
          - "recompute provisional_total_cents via work_order_cost provisional variant (requires >=1 line item staged via child WorkOrder? no — provisional computed when first WorkOrder lines exist; on propose, provisional_total_cents := 0 if no WorkOrder yet)"
          - "increments RehabPlan.version by 1"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /sewer/rehab-plans/{id}/approve"
        actor: DistrictEngineer
        preconditions:
          - "segment still has no other RehabPlan in {PROPOSED, APPROVED, EXECUTING} (ERR_PLAN_CONFLICT)"
          - "provisional_total_cents of the plan's current WorkOrder (if any) + district.budget_committed_cents <= district.budget_cents (ERR_BUDGET_EXCEEDED)"
          - "payload expected_plan_version matches current version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "district.budget_committed_cents += provisional_total_cents (ledger sync)"
          - "segment.rehab_status := PLANNED"
          - "increments RehabPlan.version by 1"
      - from: APPROVED
        to: DRAFT
        trigger: "POST /sewer/rehab-plans/{id}/reopen"
        actor: DistrictEngineer
        preconditions:
          - "no WorkOrder of this plan is in execution_status beyond ISSUED (ERR_WORK_STARTED)"
        side_effects:
          - "district.budget_committed_cents -= provisional_total_cents (compensating ledger entry)"
          - "segment.rehab_status := NONE if no other APPROVED/EXECUTING plan exists for the segment"
          - "increments RehabPlan.version by 1"
      - from: APPROVED
        to: EXECUTING
        trigger: "system (automatic when a child WorkOrder transitions ISSUED -> MOBILIZED)"
        actor: system
        preconditions: []
        side_effects:
          - "segment.rehab_status := IN_PROGRESS"
          - "increments RehabPlan.version by 1"
      - from: EXECUTING
        to: COMPLETED
        trigger: "system (automatic when the last non-CANCELLED child WorkOrder reaches execution_status COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "final_total_cents := sum of final_line_cents over all line items of all child work orders (null line finals treated as provisional for that line)"
          - "district.budget_committed_cents -= provisional_total_cents (release commitment)"
          - "segment.rehab_status := REHABILITATED; segment.last_rehab_completed_at := now"
          - "if method == CIPP_LINING: every active Lateral on segment gets reinstated := false (reset for reinstatement tracking)"
          - "increments RehabPlan.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /sewer/rehab-plans/{id}/cancel"
        actor: DistrictEngineer
        preconditions: []
        side_effects: ["increments RehabPlan.version by 1"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /sewer/rehab-plans/{id}/cancel"
        actor: DistrictEngineer
        preconditions: []
        side_effects: ["increments RehabPlan.version by 1"]

  - entity: WorkOrder
    initial_state: "execution_status=ISSUED, billing_status=UNBILLED"
    terminal_states: ["execution_status=COMPLETED", "execution_status=CANCELLED"]
    transitions:
      - from: ISSUED
        to: MOBILIZED
        trigger: "POST /sewer/work-orders/{id}/mobilize"
        actor: CrewLead
        preconditions:
          - "acting technician id == work_order.crew_lead_id (ERR_NOT_ASSIGNED_CREW)"
          - "parent RehabPlan is APPROVED or EXECUTING (ERR_PLAN_NOT_APPROVED)"
          - "plan.method != FULL_REPLACE OR an APPROVED BypassPlan exists for this work order (ERR_BYPASS_REQUIRED)"
          - "all CustomerNotice rows for this work order whose event_start <= earliest bypass/excavation start are in SENT or ACKNOWLEDGED (ERR_NOTICE_LEAD_VIOLATION)"
        side_effects:
          - "parent RehabPlan APPROVED -> EXECUTING (bubble up)"
          - "increments WorkOrder.version by 1"
      - from: MOBILIZED
        to: IN_WORK
        trigger: "POST /sewer/work-orders/{id}/begin-work"
        actor: CrewLead
        preconditions:
          - "if a BypassPlan exists for this work order it must be ACTIVE (ERR_BYPASS_NOT_ACTIVE)"
        side_effects: ["increments WorkOrder.version by 1"]
      - from: IN_WORK
        to: MOBILIZED
        trigger: "POST /sewer/work-orders/{id}/stand-down"
        actor: CrewLead
        preconditions: []
        side_effects:
          - "any ACTIVE BypassPlan for this work order -> DEMOBILIZED (cascade down)"
          - "increments WorkOrder.version by 1"
      - from: IN_WORK
        to: PUNCH_LIST
        trigger: "POST /sewer/work-orders/{id}/submit-punch"
        actor: CrewLead
        preconditions:
          - "every line item has installed_qty != null (ERR_QTY_MISSING)"
        side_effects: ["increments WorkOrder.version by 1"]
      - from: PUNCH_LIST
        to: IN_WORK
        trigger: "POST /sewer/work-orders/{id}/resume-work"
        actor: CrewLead
        preconditions: []
        side_effects: ["increments WorkOrder.version by 1"]
      - from: PUNCH_LIST
        to: COMPLETED
        trigger: "POST /sewer/work-orders/{id}/complete"
        actor: CrewLead
        preconditions:
          - "any BypassPlan for this work order is DEMOBILIZED or CLOSED (ERR_BYPASS_STILL_ACTIVE)"
          - "plan.method == CIPP_LINING implies a POST_CIPP CctvInspection for the segment exists in CERTIFIED status (ERR_POST_INSPECTION_REQUIRED)"
          - "plan.method == CIPP_LINING implies every active Lateral on segment has reinstated == true (ERR_LATERALS_OPEN)"
        side_effects:
          - "completed_at := now; warranty_expires_at := completed_at + district.warranty_months"
          - "recompute final_line_cents for all line items; final_total_cents on parent plan"
          - "if last non-CANCELLED work order of plan: plan EXECUTING -> COMPLETED (bubble up cascade: WorkOrder -> RehabPlan -> PipeSegment.rehab_status + Lateral.reinstated reset)"
          - "increments WorkOrder.version by 1"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /sewer/work-orders/{id}/cancel"
        actor: DistrictEngineer
        preconditions: []
        side_effects: ["increments WorkOrder.version by 1"]
      - from: MOBILIZED
        to: CANCELLED
        trigger: "POST /sewer/work-orders/{id}/cancel"
        actor: DistrictEngineer
        preconditions: []
        side_effects:
          - "any PROPOSED/APPROVED/ACTIVE BypassPlan -> CLOSED (cascade down)"
          - "increments WorkOrder.version by 1"
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /sewer/work-orders/{id}/invoice"
        actor: DistrictEngineer
        preconditions:
          - "execution_status == COMPLETED (ERR_NOT_COMPLETED)"
        side_effects: ["increments WorkOrder.version by 1"]
      - from: INVOICED
        to: UNBILLED
        trigger: "POST /sewer/work-orders/{id}/void-invoice"
        actor: DistrictEngineer
        preconditions: []
        side_effects: ["increments WorkOrder.version by 1"]
      - from: INVOICED
        to: PAID
        trigger: "POST /sewer/work-orders/{id}/mark-paid"
        actor: DistrictEngineer
        preconditions: []
        side_effects: ["increments WorkOrder.version by 1"]

  - entity: BypassPlan
    initial_state: PROPOSED
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /sewer/bypass-plans/{id}/approve"
        actor: DistrictEngineer
        preconditions:
          - "no other BypassPlan for a WorkOrder of the SAME segment in status {APPROVED, ACTIVE} whose buffered interval overlaps this one (half-open windows expanded by +/- 30 minutes setup buffer) (ERR_BYPASS_WINDOW_CONFLICT)"
          - "pump_capacity_gpm >= 25 * (segment.diameter_mm / 25.4) rounded up (ERR_PUMP_UNDERSIZED)"
        side_effects: ["increments BypassPlan.version by 1"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /sewer/bypass-plans/{id}/reject"
        actor: DistrictEngineer
        preconditions: []
        side_effects: ["increments BypassPlan.version by 1"]
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /sewer/bypass-plans/{id}/activate"
        actor: CrewLead
        preconditions:
          - "current logical time >= window_start and < window_end (ERR_OUTSIDE_WINDOW)"
          - "parent WorkOrder execution_status in {MOBILIZED, IN_WORK} (ERR_INVALID_STATE)"
        side_effects: ["increments BypassPlan.version by 1"]
      - from: ACTIVE
        to: DEMOBILIZED
        trigger: "POST /sewer/bypass-plans/{id}/demobilize OR system cascade from WorkOrder stand-down"
        actor: CrewLead
        preconditions: []
        side_effects: ["increments BypassPlan.version by 1"]
      - from: DEMOBILIZED
        to: CLOSED
        trigger: "POST /sewer/bypass-plans/{id}/close"
        actor: DistrictEngineer
        preconditions: []
        side_effects: ["increments BypassPlan.version by 1"]

  - entity: CustomerNotice
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED, EXPIRED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /sewer/customer-notices/{id}/send"
        actor: CustomerServiceRep
        preconditions:
          - "current logical time <= event_start - district.notice_lead_hours (ERR_NOTICE_LEAD_VIOLATION)"
        side_effects:
          - "sent_at := current logical time"
          - "increments CustomerNotice.version by 1"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /sewer/customer-notices/{id}/acknowledge"
        actor: CustomerServiceRep
        preconditions: []
        side_effects: ["increments CustomerNotice.version by 1"]
      - from: QUEUED
        to: EXPIRED
        trigger: "system (automatic when logical clock reaches event_start and notice still QUEUED; evaluated on every state-changing request in the district)"
        actor: system
        preconditions: []
        side_effects: ["increments CustomerNotice.version by 1"]

  - entity: WarrantyCase
    initial_state: OPENED
    terminal_states: [RESOLVED, DENIED, WITHDRAWN]
    transitions:
      - from: OPENED
        to: RE_INSPECTION
        trigger: "system (automatic when the WARRANTY_RE CctvInspection created with the case reaches IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: ["increments WarrantyCase.version by 1"]
      - from: RE_INSPECTION
        to: OPENED
        trigger: "system (automatic when the linked re-inspection is VOIDED, including auto-void at 3 rejects)"
        actor: system
        preconditions: []
        side_effects: ["increments WarrantyCase.version by 1"]
      - from: RE_INSPECTION
        to: UNDER_REPAIR
        trigger: "POST /sewer/warranty-cases/{id}/authorize-repair"
        actor: DistrictEngineer
        preconditions:
          - "linked re-inspection is CERTIFIED with structural_grade >= 4 on the segment (ERR_DEFECT_UNCONFIRMED)"
        side_effects: ["increments WarrantyCase.version by 1"]
      - from: RE_INSPECTION
        to: DENIED
        trigger: "POST /sewer/warranty-cases/{id}/deny"
        actor: DistrictEngineer
        preconditions:
          - "linked re-inspection is CERTIFIED (ERR_BASIS_NOT_CERTIFIED)"
          - "resolution_note provided (ERR_INVALID_REQUEST)"
        side_effects: ["increments WarrantyCase.version by 1"]
      - from: UNDER_REPAIR
        to: RESOLVED
        trigger: "POST /sewer/warranty-cases/{id}/resolve"
        actor: DistrictEngineer
        preconditions:
          - "resolution_note provided (ERR_INVALID_REQUEST)"
        side_effects:
          - "if no other WarrantyCase on the segment is in {OPENED, RE_INSPECTION, UNDER_REPAIR}: segment.rehab_status stays WARRANTY (unchanged); else unchanged"
          - "increments WarrantyCase.version by 1"
      - from: RESOLVED
        to: OPENED
        trigger: "POST /sewer/warranty-cases/{id}/reopen"
        actor: DistrictEngineer
        preconditions:
          - "current logical time <= referenced work_order.warranty_expires_at (ERR_WARRANTY_EXPIRED)"
        side_effects:
          - "increments WarrantyCase.version by 1"
      - from: OPENED
        to: WITHDRAWN
        trigger: "POST /sewer/warranty-cases/{id}/withdraw"
        actor: DistrictEngineer
        preconditions: []
        side_effects: ["increments WarrantyCase.version by 1"]
      - from: RE_INSPECTION
        to: WITHDRAWN
        trigger: "POST /sewer/warranty-cases/{id}/withdraw"
        actor: DistrictEngineer
        preconditions: []
        side_effects:
          - "linked re-inspection, if still SCHEDULED or CODING, -> VOIDED"
          - "increments WarrantyCase.version by 1"

  - entity: FlowMonitoringPeriod
    initial_state: DRAFT
    terminal_states: [ANALYZED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /sewer/flow-periods/{id}/activate"
        actor: DistrictEngineer
        preconditions:
          - "window_end >= window_start + 168h (ERR_MONITORING_TOO_SHORT)"
          - "no other FlowMonitoringPeriod in same district with same basin_label in status {ACTIVE} whose closed interval [window_start, window_end] intersects this one (inclusive endpoints: sharing either endpoint counts as conflict) (ERR_FLOW_WINDOW_CONFLICT)"
          - "phase == POST_REHAB implies >= 1 segment of district has rehab_status in {REHABILITATED, WARRANTY} (ERR_NO_REHAB_YET)"
        side_effects: ["increments FlowMonitoringPeriod.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /sewer/flow-periods/{id}/close"
        actor: DistrictEngineer
        preconditions:
          - "dry_weather_avg_gpm != null and peak_storm_gpm != null in payload (ERR_FLOW_DATA_MISSING)"
        side_effects: ["increments FlowMonitoringPeriod.version by 1"]
      - from: CLOSED
        to: ANALYZED
        trigger: "POST /sewer/flow-periods/{id}/analyze"
        actor: DistrictEngineer
        preconditions:
          - "for phase == POST_REHAB: a CLOSED or ANALYZED PRE_REHAB period exists for same basin_label (ERR_NO_BASELINE)"
        side_effects:
          - "compute infiltration_reduction_pct (both variants) and persist on the response; basin target check runs via calculation"
          - "increments FlowMonitoringPeriod.version by 1"

concurrency_rules:
  - rule_id: rehab-plan-approve-stale-version
    parent_entity: RehabPlan
    write_endpoint: "POST /sewer/rehab-plans/{id}/approve"
    occ_field: "expected_plan_version"
    description: |
      Approving a RehabPlan whose version has advanced since the client last
      observed it is rejected. This captures the case where another engineer
      has just reopened or modified the plan (which legitimately changes
      provisional_total_cents and budget math) and the approving client's
      view of the plan is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: work-order-line-stale-version
    parent_entity: WorkOrder
    write_endpoint: "POST /sewer/work-orders/{id}/line-items"
    occ_field: "expected_work_order_version"
    description: |
      Adding a WorkOrderLineItem against a WorkOrder whose version has
      advanced since the client last observed it is rejected. Provisional
      totals and mobilization tier derive from line items, so a stale
      writer would otherwise commit budget against out-of-date quantities.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pacp_scoring
    trigger: "CctvInspection transitions QA_REVIEW -> CERTIFIED; also recomputed if a DefectObservation is added/edited while inspection is CODING (preview only, not persisted to segment)"
    algorithm: weighted_scoring
    formula: |
      # Persisted to PipeSegment on CERTIFY. Two variants computed from the same observation set:
      # structural_index (persisted):
      #   idx = sum(grade_i * max(extent_i, 1.0)) / sum(max(extent_i, 1.0))   over STRUCTURAL observations
      #   persisted rounded to 2 decimals, round_half_up; null when no STRUCTURAL observations
      # structural_grade (persisted): max grade over STRUCTURAL observations, 0 when none
      # om_grade (persisted): max grade over OM observations, 0 when none
      # quick_rating (persisted): 4-char PACP Quick Rating built from the two HIGHEST structural
      #   grades among observations: first char = highest grade; second char = count of
      #   observations at that grade, capped at 9; third char = second-highest grade (0 if none);
      #   fourth char = count of observations at second-highest grade capped at 9 (0 if none).
      #   e.g. grades {5,5,4,3,1} -> "5241". Ties in grade ordering broken by higher grade first,
      #   then larger count. When no STRUCTURAL observations: quick_rating = "0000".
    input_set: "DefectObservation rows of THIS CctvInspection only (regardless of family; grade/om computed per family)"
    precision: "structural_index 2 decimal places, round_half_up"
    variants:
      - name: quick_rating_variant
        when: "regulatory reporting and triage sort order"
        difference: "ordinal worst-defect encoding (ignores extent weighting); a segment with one grade-5 point defect and many grade-4 longitudinal defects reports '51XX' style severity"
      - name: weighted_index_variant
        when: "rehab prioritization ranking and method-eligibility checks that use extent"
        difference: "extent-weighted mean (longitudinal defects count more); same observation set yields a different number than quick_rating implies (e.g. grades {5(pt),4x30m} -> quick '5141' vs index 4.03)"

  - name: work_order_cost
    trigger: "provisional: on RehabPlan.propose and on any WorkOrderLineItem create/update while work order is not COMPLETED; final: on WorkOrder.complete"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round each line first, then sum the rounded line values.
      provisional_line_cents = round_half_up(scheduled_qty * unit_price_cents)     # per line
      provisional_total_cents = sum(provisional_line_cents) + mobilization_fee_cents
      final_line_cents      = round_half_up(installed_qty * unit_price_cents)      # per line, only when installed_qty set
      final_total_cents     = sum(coalesce(final_line_cents, provisional_line_cents)) + mobilization_fee_cents
      mobilization_fee_cents keyed on WorkOrder.mobilization_tier (computed at ISSUED):
        MOB_SMALL  (diameter_mm < 300):                150000  # $1,500.00
        MOB_STANDARD (300 <= diameter_mm < 600):       400000  # $4,000.00
        MOB_LARGE  (diameter_mm >= 600 OR length_m > 300): 900000  # $9,000.00
        tier evaluation order: check MOB_LARGE first, then MOB_STANDARD, else MOB_SMALL.
    input_set: "all WorkOrderLineItem rows of all WorkOrders belonging to the RehabPlan; CANCELLED work orders excluded"
    constants:
      MOB_SMALL_CENTS: 150000
      MOB_STANDARD_CENTS: 400000
      MOB_LARGE_CENTS: 900000
      MOB_LARGE_LENGTH_M: 300
      MOB_LARGE_DIAMETER_MM: 600
      MOB_STANDARD_DIAMETER_MM: 300
    precision: "integer cents; per-line round_half_up THEN sum (sum-then-round is FORBIDDEN)"
    variants:
      - name: provisional_estimate
        when: "plan proposal/approval; budget commitment"
        difference: "uses scheduled_qty"
      - name: final_invoice
        when: "work order completion; billing"
        difference: "uses installed_qty where reported, falls back to provisional per-line when installed_qty is null"

  - name: infiltration_reduction_pct
    trigger: "FlowMonitoringPeriod transitions CLOSED -> ANALYZED with phase == POST_REHAB"
    algorithm: threshold
    formula: |
      # Two variants; BOTH computed and returned; basin_target_met uses dry_weather variant ONLY.
      baseline = the PRE_REHAB period for same (district_id, basin_label) with status in {CLOSED, ANALYZED}
                 and greatest window_end (tie-break: latest created_at)
      dry_weather_reduction_pct = round_half_up(100 * (1 - post.dry_weather_avg_gpm / pre.dry_weather_avg_gpm), 1)
      storm_event_reduction_pct = round_half_up(100 * (1 - post.peak_storm_gpm / pre.peak_storm_gpm), 1)
      basin_target_met = (dry_weather_reduction_pct >= district.ii_reduction_target_pct)   # boundary: >= inclusive
    input_set: "the triggering POST_REHAB period plus its selected PRE_REHAB baseline (selector above)"
    precision: "1 decimal place, round_half_up"
    variants:
      - name: dry_weather_method
        when: "official basin-target determination"
        difference: "compares dry_weather_avg_gpm; used for basin_target_met"
      - name: storm_event_method
        when: "engineering report only"
        difference: "compares peak_storm_gpm; never gates basin_target_met even when it crosses the target"

  - name: lateral_reinstatement_progress
    trigger: "POST /sewer/segments/{id}/laterals/{lateralId}/reinstate and on WorkOrder.complete for CIPP_LINING"
    algorithm: aggregation
    formula: |
      active_laterals   = Lateral rows of segment with active == true
      reinstated_count  = active_laterals with reinstated == true
      all_reinstated    = (reinstated_count == count(active_laterals))   # vacuously TRUE when count == 0
      # On WorkOrder.complete of a CIPP_LINING plan this gate must be all_reinstated == true
      # (ERR_LATERALS_OPEN otherwise). Reset semantics: completing a CIPP work order sets every
      # active lateral reinstated := false FIRST, then reinstate actions flip them true.
    input_set: "Lateral rows of the segment, active == true only"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and in role catalog; X-User-ID present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for the endpoint per RBAC matrix", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids exist and belong to their declared parent scope, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "Target resource in a from-state that lists this transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 5, category: business_safety, check: "NASSCO certification validity and segregation-of-duties on coding/QA actions", error_id: "ERR_CERT_EXPIRED | ERR_SOD_VIOLATION | ERR_NOT_ASSIGNED_CODER", http_status: 409, applies_to: "cctv-inspection start/begin-coding/submit-qa/certify/reject" }
  - { priority: 6, category: business_safety, check: "Flow-control prerequisites: approved bypass before FULL_REPLACE mobilization; bypass ACTIVE before begin-work; pump capacity adequate", error_id: "ERR_BYPASS_REQUIRED | ERR_BYPASS_NOT_ACTIVE | ERR_PUMP_UNDERSIZED", http_status: 409, applies_to: "work-order mobilize/begin-work, bypass-plan approve" }
  - { priority: 7, category: business_constraint, check: "Method-grade compatibility, plan uniqueness per segment, cycle window membership, defect distance bounds, PACP code shape", error_id: "ERR_METHOD_INCOMPATIBLE | ERR_PLAN_CONFLICT | ERR_OUTSIDE_CYCLE_WINDOW | ERR_DEFECT_OUT_OF_RANGE | ERR_INVALID_REQUEST", http_status: 409, applies_to: "rehab-plan propose, cctv-inspection create, defect-observation create" }
  - { priority: 8, category: business_temporal, check: "Notice lead time satisfied before send/mobilize; bypass window overlap with +/-30 min buffer; flow-period window rules; warranty expiry", error_id: "ERR_NOTICE_LEAD_VIOLATION | ERR_BYPASS_WINDOW_CONFLICT | ERR_FLOW_WINDOW_CONFLICT | ERR_MONITORING_TOO_SHORT | ERR_WARRANTY_EXPIRED | ERR_OUTSIDE_WINDOW", http_status: 409, applies_to: "customer-notice send, work-order mobilize, bypass-plan approve/activate, flow-period activate, warranty-case create/reopen" }
  - { priority: 9, category: business_referential, check: "Basis inspection CERTIFIED; QA reviewer differs from coder; crew lead capability; lateral address matches for lining notices; PRE_REHAB baseline exists for POST analyze", error_id: "ERR_BASIS_NOT_CERTIFIED | ERR_NOT_ASSIGNED_CREW | ERR_ADDRESS_NOT_ON_SEGMENT | ERR_NO_BASELINE", http_status: 409, applies_to: "rehab-plan propose, warranty authorize-repair/deny, work-order create, customer-notice create, flow-period analyze" }
  - { priority: 10, category: business_fiscal, check: "Budget commitment ceiling: budget_committed_cents + provisional_total_cents <= budget_cents", error_id: ERR_BUDGET_EXCEEDED, http_status: 409, applies_to: "rehab-plan approve" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/sewer/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock."
    roles: [DistrictEngineer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "evaluate CustomerNotice QUEUED -> EXPIRED sweeps for every district (notices with event_start <= new clock)"

  # --- SewerDistrict ---
  - method: POST
    path: "/sewer/districts"
    description: "Create a SewerDistrict"
    roles: [DistrictEngineer]
    code: 201
    input: [name, ii_reduction_target_pct, "notice_lead_hours?", "warranty_months?", budget_cents]
    output: SewerDistrict
    side_effects: ["budget_committed_cents := 0"]
  - method: GET
    path: "/sewer/districts/{id}"
    description: "Get a SewerDistrict"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead, CustomerServiceRep]
    code: 200
    input: []
    output: SewerDistrict
    side_effects: []
  - method: GET
    path: "/sewer/districts"
    description: "List SewerDistricts (paginated)"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead, CustomerServiceRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "SewerDistrict[]"
    side_effects: []

  # --- Technician ---
  - method: POST
    path: "/sewer/technicians"
    description: "Register a Technician"
    roles: [DistrictEngineer]
    code: 201
    input: [full_name, nassco_cert_number, nassco_cert_expires_at, capabilities, "active?"]
    output: Technician
    side_effects: []
  - method: GET
    path: "/sewer/technicians/{id}"
    description: "Get a Technician"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead, CustomerServiceRep]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: PATCH
    path: "/sewer/technicians/{id}"
    description: "Update technician (cert renewal, capabilities, active flag)"
    roles: [DistrictEngineer]
    code: 200
    input: ["nassco_cert_expires_at?", "capabilities?", "active?"]
    output: Technician
    side_effects: ["increments Technician.version by 1"]

  # --- InspectionCycle ---
  - method: POST
    path: "/sewer/districts/{id}/inspection-cycles"
    description: "Create an InspectionCycle in DRAFT"
    roles: [DistrictEngineer]
    code: 201
    input: [label, window_start, window_end]
    output: InspectionCycle
    side_effects: ["status := DRAFT"]
  - method: GET
    path: "/sewer/inspection-cycles/{id}"
    description: "Get an InspectionCycle"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: []
    output: InspectionCycle
    side_effects: []
  - method: GET
    path: "/sewer/districts/{id}/inspection-cycles"
    description: "List cycles of a district"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "InspectionCycle[]"
    side_effects: []
  - method: POST
    path: "/sewer/inspection-cycles/{id}/open"
    description: "Open a cycle for scheduling"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: InspectionCycle
    side_effects: ["status DRAFT -> OPEN"]
  - method: POST
    path: "/sewer/inspection-cycles/{id}/close"
    description: "Close a cycle"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: InspectionCycle
    side_effects: ["status OPEN -> CLOSED"]

  # --- PipeSegment ---
  - method: POST
    path: "/sewer/districts/{id}/segments"
    description: "Create a PipeSegment"
    roles: [DistrictEngineer]
    code: 201
    input: [segment_ref, diameter_mm, material, length_m, install_year]
    output: PipeSegment
    side_effects: ["structural_grade := 0, om_grade := 0, rehab_status := NONE"]
  - method: GET
    path: "/sewer/segments/{id}"
    description: "Get a PipeSegment (includes computed grades)"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead, CustomerServiceRep]
    code: 200
    input: []
    output: PipeSegment
    side_effects: []
  - method: GET
    path: "/sewer/districts/{id}/segments"
    description: "List segments of a district"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead, CustomerServiceRep]
    code: 200
    input: ["limit?", "offset?", "rehab_status?", "min_structural_grade?"]
    output: "PipeSegment[]"
    side_effects: []

  # --- Lateral ---
  - method: POST
    path: "/sewer/segments/{id}/laterals"
    description: "Add a Lateral to a segment"
    roles: [DistrictEngineer]
    code: 201
    input: [address, connection_type, "active?"]
    output: Lateral
    side_effects: ["reinstated := false"]
  - method: GET
    path: "/sewer/segments/{id}/laterals"
    description: "List laterals of a segment"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead, CustomerServiceRep]
    code: 200
    input: ["limit?", "offset?", "active?", "reinstated?"]
    output: "Lateral[]"
    side_effects: []
  - method: POST
    path: "/sewer/segments/{id}/laterals/{lateralId}/reinstate"
    description: "Record lateral reinstatement after CIPP lining"
    roles: [CrewLead]
    code: 200
    input: []
    output: Lateral
    side_effects:
      - "reinstated := true"
      - "recompute lateral_reinstatement_progress"
      - "increments Lateral.version by 1"

  # --- CctvInspection ---
  - method: POST
    path: "/sewer/segments/{id}/cctv-inspections"
    description: "Schedule a CCTV inspection"
    roles: [DistrictEngineer]
    code: 201
    input: [cycle_id, scheduled_at, coder_id, "purpose?"]
    output: CctvInspection
    side_effects: ["status := SCHEDULED, reject_count := 0"]
  - method: GET
    path: "/sewer/cctv-inspections/{id}"
    description: "Get a CctvInspection"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: []
    output: CctvInspection
    side_effects: []
  - method: GET
    path: "/sewer/segments/{id}/cctv-inspections"
    description: "List inspections of a segment"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: ["limit?", "offset?", "status?", "purpose?"]
    output: "CctvInspection[]"
    side_effects: []
  - method: GET
    path: "/sewer/cctv-inspections"
    description: "Filtered list of inspections across segments (cycle/technician reverse lookup)"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: ["limit?", "offset?", "cycle_id?", "coder_id?", "qa_reviewer_id?", "status?"]
    output: "CctvInspection[]"
    side_effects: []
  - method: GET
    path: "/sewer/rehab-plans"
    description: "Filtered list of rehab plans (basis-inspection reverse lookup)"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: ["limit?", "offset?", "basis_inspection_id?", "status?"]
    output: "RehabPlan[]"
    side_effects: []
  - method: GET
    path: "/sewer/work-orders"
    description: "Filtered list of work orders (crew-lead reverse lookup)"
    roles: [DistrictEngineer, CrewLead]
    code: 200
    input: ["limit?", "offset?", "crew_lead_id?", "execution_status?"]
    output: "WorkOrder[]"
    side_effects: []
  - method: GET
    path: "/sewer/warranty-cases"
    description: "Filtered list of warranty cases (work-order / re-inspection reverse lookup)"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: ["limit?", "offset?", "work_order_id?", "re_inspection_id?", "status?"]
    output: "WarrantyCase[]"
    side_effects: []
  - method: POST
    path: "/sewer/cctv-inspections/{id}/start"
    description: "Begin field capture"
    roles: [Coder]
    code: 200
    input: []
    output: CctvInspection
    side_effects: ["status SCHEDULED -> IN_PROGRESS"]
  - method: POST
    path: "/sewer/cctv-inspections/{id}/begin-coding"
    description: "Enter coding phase"
    roles: [Coder]
    code: 200
    input: []
    output: CctvInspection
    side_effects: ["status IN_PROGRESS -> CODING"]
  - method: POST
    path: "/sewer/cctv-inspections/{id}/submit-qa"
    description: "Submit coded inspection for QA"
    roles: [Coder]
    code: 200
    input: []
    output: CctvInspection
    side_effects: ["status CODING -> QA_REVIEW"]
  - method: POST
    path: "/sewer/cctv-inspections/{id}/certify"
    description: "QA certify (segregation of duties enforced)"
    roles: [QaReviewer]
    code: 200
    input: []
    output: CctvInspection
    side_effects: ["status QA_REVIEW -> CERTIFIED; recompute pacp_scoring onto PipeSegment"]
  - method: POST
    path: "/sewer/cctv-inspections/{id}/reject"
    description: "QA reject back to CODING; third rejection auto-voids"
    roles: [QaReviewer]
    code: 200
    input: ["reason?"]
    output: CctvInspection
    side_effects: ["status QA_REVIEW -> CODING (reject_count < 3) or QA_REVIEW -> VOIDED (reject_count reaches 3)"]
  - method: POST
    path: "/sewer/cctv-inspections/{id}/void"
    description: "Void a SCHEDULED or CODING inspection"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: CctvInspection
    side_effects: ["status -> VOIDED"]

  # --- DefectObservation ---
  - method: POST
    path: "/sewer/cctv-inspections/{id}/defects"
    description: "Append a defect observation (inspection must be CODING)"
    roles: [Coder]
    code: 201
    input: [pacp_code, family, grade, distance_m, clock_position, "extent_m?"]
    output: DefectObservation
    side_effects: []
  - method: GET
    path: "/sewer/cctv-inspections/{id}/defects"
    description: "List defects of an inspection"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: ["limit?", "offset?", "family?"]
    output: "DefectObservation[]"
    side_effects: []
  - method: DELETE
    path: "/sewer/cctv-inspections/{id}/defects/{defectId}"
    description: "Remove a defect (only while inspection is CODING)"
    roles: [Coder]
    code: 204
    input: []
    output: null
    side_effects: []

  # --- RehabPlan ---
  - method: POST
    path: "/sewer/segments/{id}/rehab-plans"
    description: "Create a RehabPlan in DRAFT"
    roles: [DistrictEngineer]
    code: 201
    input: [method, basis_inspection_id]
    output: RehabPlan
    side_effects: ["status := DRAFT, provisional_total_cents := 0"]
  - method: GET
    path: "/sewer/rehab-plans/{id}"
    description: "Get a RehabPlan"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: []
    output: RehabPlan
    side_effects: []
  - method: GET
    path: "/sewer/segments/{id}/rehab-plans"
    description: "List plans of a segment"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "RehabPlan[]"
    side_effects: []
  - method: POST
    path: "/sewer/rehab-plans/{id}/propose"
    description: "Propose a plan (method/grade compatibility checked)"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: RehabPlan
    side_effects: ["status DRAFT -> PROPOSED"]
  - method: POST
    path: "/sewer/rehab-plans/{id}/approve"
    description: "Approve a plan (OCC-guarded; commits budget)"
    roles: [DistrictEngineer]
    code: 200
    input: [expected_plan_version]
    output: RehabPlan
    side_effects: ["status PROPOSED -> APPROVED; district.budget_committed_cents += provisional_total_cents; increments RehabPlan.version by 1"]
  - method: POST
    path: "/sewer/rehab-plans/{id}/reopen"
    description: "Reopen an APPROVED plan back to DRAFT (releases budget)"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: RehabPlan
    side_effects: ["status APPROVED -> DRAFT; district.budget_committed_cents -= provisional_total_cents"]
  - method: POST
    path: "/sewer/rehab-plans/{id}/cancel"
    description: "Cancel a DRAFT or PROPOSED plan"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: RehabPlan
    side_effects: ["status -> CANCELLED"]

  # --- WorkOrder ---
  - method: POST
    path: "/sewer/rehab-plans/{id}/work-orders"
    description: "Issue a WorkOrder under an APPROVED plan"
    roles: [DistrictEngineer]
    code: 201
    input: [crew_lead_id]
    output: WorkOrder
    side_effects:
      - "execution_status := ISSUED, billing_status := UNBILLED"
      - "mobilization_tier computed from segment diameter/length (MOB_LARGE first, then MOB_STANDARD, else MOB_SMALL)"
  - method: GET
    path: "/sewer/work-orders/{id}"
    description: "Get a WorkOrder"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/sewer/rehab-plans/{id}/work-orders"
    description: "List work orders of a plan"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: ["limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []
  - method: POST
    path: "/sewer/work-orders/{id}/mobilize"
    description: "Mobilize crew (bypass + notice gates)"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["execution_status ISSUED -> MOBILIZED; parent plan APPROVED -> EXECUTING"]
  - method: POST
    path: "/sewer/work-orders/{id}/begin-work"
    description: "Start physical work"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["execution_status MOBILIZED -> IN_WORK"]
  - method: POST
    path: "/sewer/work-orders/{id}/stand-down"
    description: "Stand down from IN_WORK to MOBILIZED (demobilizes active bypass)"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["execution_status IN_WORK -> MOBILIZED; ACTIVE bypass -> DEMOBILIZED"]
  - method: POST
    path: "/sewer/work-orders/{id}/submit-punch"
    description: "Enter punch list (requires installed quantities)"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["execution_status IN_WORK -> PUNCH_LIST"]
  - method: POST
    path: "/sewer/work-orders/{id}/resume-work"
    description: "Return from punch list to work"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["execution_status PUNCH_LIST -> IN_WORK"]
  - method: POST
    path: "/sewer/work-orders/{id}/complete"
    description: "Complete execution (post-CIPP inspection + lateral gates)"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["execution_status PUNCH_LIST -> COMPLETED; final totals computed; plan may auto-complete"]
  - method: POST
    path: "/sewer/work-orders/{id}/cancel"
    description: "Cancel an ISSUED or MOBILIZED work order"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["execution_status -> CANCELLED; non-terminal bypasses -> CLOSED"]
  - method: POST
    path: "/sewer/work-orders/{id}/invoice"
    description: "Invoice a completed work order"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["billing_status UNBILLED -> INVOICED"]
  - method: POST
    path: "/sewer/work-orders/{id}/void-invoice"
    description: "Void an invoice back to UNBILLED"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["billing_status INVOICED -> UNBILLED"]
  - method: POST
    path: "/sewer/work-orders/{id}/mark-paid"
    description: "Mark an invoice paid"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["billing_status INVOICED -> PAID"]

  # --- WorkOrderLineItem ---
  - method: POST
    path: "/sewer/work-orders/{id}/line-items"
    description: "Add a line item (OCC-guarded on the work order)"
    roles: [DistrictEngineer]
    code: 201
    input: [pay_item_code, scheduled_qty, unit_price_cents, expected_work_order_version]
    output: WorkOrderLineItem
    side_effects: ["provisional_line_cents computed; recompute plan provisional_total_cents; increments WorkOrder.version by 1"]
  - method: GET
    path: "/sewer/work-orders/{id}/line-items"
    description: "List line items of a work order"
    roles: [DistrictEngineer, CrewLead]
    code: 200
    input: ["limit?", "offset?"]
    output: "WorkOrderLineItem[]"
    side_effects: []
  - method: PATCH
    path: "/sewer/work-orders/{id}/line-items/{lineId}"
    description: "Report installed_qty (execution IN_WORK or PUNCH_LIST) or correct scheduled_qty/unit_price_cents (execution ISSUED)"
    roles: [CrewLead, DistrictEngineer]
    code: 200
    input: ["installed_qty?", "scheduled_qty?", "unit_price_cents?"]
    output: WorkOrderLineItem
    side_effects: ["recompute provisional/final line cents and plan totals; increments WorkOrderLineItem.version by 1"]

  # --- BypassPlan ---
  - method: POST
    path: "/sewer/work-orders/{id}/bypass-plans"
    description: "Propose a bypass pumping plan"
    roles: [CrewLead]
    code: 201
    input: [window_start, window_end, pump_capacity_gpm]
    output: BypassPlan
    side_effects: ["status := PROPOSED"]
  - method: GET
    path: "/sewer/bypass-plans/{id}"
    description: "Get a BypassPlan"
    roles: [DistrictEngineer, CrewLead]
    code: 200
    input: []
    output: BypassPlan
    side_effects: []
  - method: GET
    path: "/sewer/work-orders/{id}/bypass-plans"
    description: "List bypass plans of a work order"
    roles: [DistrictEngineer, CrewLead]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "BypassPlan[]"
    side_effects: []
  - method: POST
    path: "/sewer/bypass-plans/{id}/approve"
    description: "Approve bypass (window-conflict + pump-size checks)"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: BypassPlan
    side_effects: ["status PROPOSED -> APPROVED"]
  - method: POST
    path: "/sewer/bypass-plans/{id}/reject"
    description: "Reject a proposed bypass"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: BypassPlan
    side_effects: ["status PROPOSED -> REJECTED"]
  - method: POST
    path: "/sewer/bypass-plans/{id}/activate"
    description: "Activate bypass inside its window"
    roles: [CrewLead]
    code: 200
    input: []
    output: BypassPlan
    side_effects: ["status APPROVED -> ACTIVE"]
  - method: POST
    path: "/sewer/bypass-plans/{id}/demobilize"
    description: "Demobilize an active bypass"
    roles: [CrewLead]
    code: 200
    input: []
    output: BypassPlan
    side_effects: ["status ACTIVE -> DEMOBILIZED"]
  - method: POST
    path: "/sewer/bypass-plans/{id}/close"
    description: "Close a demobilized bypass"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: BypassPlan
    side_effects: ["status DEMOBILIZED -> CLOSED"]

  # --- CustomerNotice ---
  - method: POST
    path: "/sewer/work-orders/{id}/customer-notices"
    description: "Queue a customer notice"
    roles: [CustomerServiceRep]
    code: 201
    input: [address, channel, event_start]
    output: CustomerNotice
    side_effects: ["status := QUEUED"]
  - method: GET
    path: "/sewer/customer-notices/{id}"
    description: "Get a CustomerNotice"
    roles: [DistrictEngineer, CustomerServiceRep]
    code: 200
    input: []
    output: CustomerNotice
    side_effects: []
  - method: GET
    path: "/sewer/work-orders/{id}/customer-notices"
    description: "List notices of a work order"
    roles: [DistrictEngineer, CustomerServiceRep, CrewLead]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CustomerNotice[]"
    side_effects: []
  - method: POST
    path: "/sewer/customer-notices/{id}/send"
    description: "Send a queued notice (lead-time enforced)"
    roles: [CustomerServiceRep]
    code: 200
    input: []
    output: CustomerNotice
    side_effects: ["status QUEUED -> SENT; sent_at := now"]
  - method: POST
    path: "/sewer/customer-notices/{id}/acknowledge"
    description: "Acknowledge receipt"
    roles: [CustomerServiceRep]
    code: 200
    input: []
    output: CustomerNotice
    side_effects: ["status SENT -> ACKNOWLEDGED"]

  # --- WarrantyCase ---
  - method: POST
    path: "/sewer/segments/{id}/warranty-cases"
    description: "Open a warranty claim (creates linked WARRANTY_RE inspection in SCHEDULED)"
    roles: [DistrictEngineer]
    code: 201
    input: [work_order_id, defect_summary, cycle_id, scheduled_at, coder_id]
    output: WarrantyCase
    side_effects:
      - "status := OPENED; opened_at := now; requires now <= referenced work_order.warranty_expires_at (ERR_WARRANTY_EXPIRED)"
      - "create linked CctvInspection purpose=WARRANTY_RE (re_inspection_id) in SCHEDULED for the segment"
      - "segment.rehab_status := WARRANTY (if currently REHABILITATED)"
  - method: GET
    path: "/sewer/warranty-cases/{id}"
    description: "Get a WarrantyCase"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: []
    output: WarrantyCase
    side_effects: []
  - method: GET
    path: "/sewer/segments/{id}/warranty-cases"
    description: "List warranty cases of a segment"
    roles: [DistrictEngineer, Coder, QaReviewer, CrewLead]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "WarrantyCase[]"
    side_effects: []
  - method: POST
    path: "/sewer/warranty-cases/{id}/authorize-repair"
    description: "Authorize warranty repair after certified re-inspection confirms grade >= 4"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: WarrantyCase
    side_effects: ["status RE_INSPECTION -> UNDER_REPAIR"]
  - method: POST
    path: "/sewer/warranty-cases/{id}/deny"
    description: "Deny a claim after certified re-inspection"
    roles: [DistrictEngineer]
    code: 200
    input: [resolution_note]
    output: WarrantyCase
    side_effects: ["status RE_INSPECTION -> DENIED"]
  - method: POST
    path: "/sewer/warranty-cases/{id}/resolve"
    description: "Resolve a repaired claim"
    roles: [DistrictEngineer]
    code: 200
    input: [resolution_note]
    output: WarrantyCase
    side_effects: ["status UNDER_REPAIR -> RESOLVED"]
  - method: POST
    path: "/sewer/warranty-cases/{id}/reopen"
    description: "Re-open a resolved claim inside the warranty window"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: WarrantyCase
    side_effects: ["status RESOLVED -> OPENED; requires now <= work_order.warranty_expires_at"]
  - method: POST
    path: "/sewer/warranty-cases/{id}/withdraw"
    description: "Withdraw an open claim (voids pending re-inspection)"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: WarrantyCase
    side_effects: ["status -> WITHDRAWN; linked re-inspection (if SCHEDULED or CODING) -> VOIDED"]

  # --- FlowMonitoringPeriod ---
  - method: POST
    path: "/sewer/districts/{id}/flow-periods"
    description: "Create a flow monitoring period in DRAFT"
    roles: [DistrictEngineer]
    code: 201
    input: [basin_label, phase, window_start, window_end]
    output: FlowMonitoringPeriod
    side_effects: ["status := DRAFT"]
  - method: GET
    path: "/sewer/flow-periods/{id}"
    description: "Get a FlowMonitoringPeriod"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: FlowMonitoringPeriod
    side_effects: []
  - method: GET
    path: "/sewer/districts/{id}/flow-periods"
    description: "List flow periods of a district"
    roles: [DistrictEngineer]
    code: 200
    input: ["limit?", "offset?", "phase?", "status?"]
    output: "FlowMonitoringPeriod[]"
    side_effects: []
  - method: POST
    path: "/sewer/flow-periods/{id}/activate"
    description: "Activate a monitoring window (duration + overlap + phase gates)"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: FlowMonitoringPeriod
    side_effects: ["status DRAFT -> ACTIVE"]
  - method: POST
    path: "/sewer/flow-periods/{id}/close"
    description: "Close with recorded flow data"
    roles: [DistrictEngineer]
    code: 200
    input: [dry_weather_avg_gpm, peak_storm_gpm]
    output: FlowMonitoringPeriod
    side_effects: ["status ACTIVE -> CLOSED"]
  - method: POST
    path: "/sewer/flow-periods/{id}/analyze"
    description: "Analyze a closed POST_REHAB period against its PRE baseline"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: "{ dry_weather_reduction_pct: number, storm_event_reduction_pct: number, basin_target_met: boolean }"
    side_effects: ["status CLOSED -> ANALYZED; run infiltration_reduction_pct"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist or is out of parent scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, bad enum, bad PACP code shape, non-positive quantity/price, resolution_note missing where required" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a from-state that allows the requested transition" }
  - { id: ERR_CYCLE_OVERLAP, http: 409, condition: "Another InspectionCycle of the same district is already OPEN" }
  - { id: ERR_INSPECTIONS_OPEN, http: 409, condition: "Cycle close blocked: some inspections still not CERTIFIED/VOIDED" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Inspection start requires an OPEN cycle" }
  - { id: ERR_OUTSIDE_CYCLE_WINDOW, http: 409, condition: "scheduled_at lies outside the cycle window" }
  - { id: ERR_NOT_ASSIGNED_CODER, http: 409, condition: "Acting Coder is not the inspection's coder_id" }
  - { id: ERR_CERT_EXPIRED, http: 409, condition: "Technician NASSCO certification expired at or before current logical time" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Segregation of duties: QA actor equals the coding technician" }
  - { id: ERR_NO_DEFECTS_CODED, http: 409, condition: "submit-qa requires at least one DefectObservation" }
  - { id: ERR_DEFECT_OUT_OF_RANGE, http: 409, condition: "distance_m < 0 or > segment.length_m, or clock_position outside 0-12, or grade outside 1-5" }
  - { id: ERR_METHOD_INCOMPATIBLE, http: 409, condition: "Selected rehab method incompatible with certified grades/observation counts/material" }
  - { id: ERR_BASIS_NOT_CERTIFIED, http: 409, condition: "Referenced inspection is not CERTIFIED" }
  - { id: ERR_PLAN_CONFLICT, http: 409, condition: "Segment already has a RehabPlan in PROPOSED/APPROVED/EXECUTING" }
  - { id: ERR_BUDGET_EXCEEDED, http: 409, condition: "Approval would push budget_committed_cents above district budget_cents" }
  - { id: ERR_WORK_STARTED, http: 409, condition: "Reopen blocked: a child work order already progressed past ISSUED" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "Work order action requires parent plan APPROVED or EXECUTING" }
  - { id: ERR_NOT_ASSIGNED_CREW, http: 409, condition: "Acting CrewLead is not the work order's crew_lead_id" }
  - { id: ERR_BYPASS_REQUIRED, http: 409, condition: "FULL_REPLACE mobilization requires an APPROVED BypassPlan" }
  - { id: ERR_BYPASS_NOT_ACTIVE, http: 409, condition: "begin-work requires an ACTIVE bypass when one exists" }
  - { id: ERR_BYPASS_STILL_ACTIVE, http: 409, condition: "Completion blocked: bypass not yet DEMOBILIZED/CLOSED" }
  - { id: ERR_BYPASS_WINDOW_CONFLICT, http: 409, condition: "Buffered half-open bypass window (+/-30 min) overlaps another APPROVED/ACTIVE bypass on the same segment" }
  - { id: ERR_PUMP_UNDERSIZED, http: 409, condition: "pump_capacity_gpm below required 25 gpm per inch of diameter (rounded up)" }
  - { id: ERR_OUTSIDE_WINDOW, http: 409, condition: "Activation attempted outside [window_start, window_end)" }
  - { id: ERR_NOTICE_LEAD_VIOLATION, http: 409, condition: "Notice send after event_start - notice_lead_hours, or mobilize with unsent notices due" }
  - { id: ERR_ADDRESS_NOT_ON_SEGMENT, http: 409, condition: "Lining notice address does not match an active Lateral on the segment" }
  - { id: ERR_QTY_MISSING, http: 409, condition: "submit-punch requires every line item installed_qty set" }
  - { id: ERR_NOT_COMPLETED, http: 409, condition: "Invoicing requires execution_status COMPLETED" }
  - { id: ERR_POST_INSPECTION_REQUIRED, http: 409, condition: "CIPP completion requires a CERTIFIED POST_CIPP inspection" }
  - { id: ERR_LATERALS_OPEN, http: 409, condition: "CIPP completion requires every active lateral reinstated" }
  - { id: ERR_WARRANTY_EXPIRED, http: 409, condition: "Claim or reopen after work_order.warranty_expires_at" }
  - { id: ERR_DEFECT_UNCONFIRMED, http: 409, condition: "authorize-repair requires certified re-inspection structural_grade >= 4" }
  - { id: ERR_MONITORING_TOO_SHORT, http: 409, condition: "Flow window shorter than 168 hours" }
  - { id: ERR_FLOW_WINDOW_CONFLICT, http: 409, condition: "Another ACTIVE period for same basin overlaps the closed window (inclusive endpoints)" }
  - { id: ERR_NO_REHAB_YET, http: 409, condition: "POST_REHAB activation requires a REHABILITATED/WARRANTY segment in district" }
  - { id: ERR_FLOW_DATA_MISSING, http: 409, condition: "close requires dry_weather_avg_gpm and peak_storm_gpm" }
  - { id: ERR_NO_BASELINE, http: 409, condition: "POST_REHAB analyze requires a CLOSED/ANALYZED PRE_REHAB period for the basin" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistrictEngineer
    description: "Sewer district engineer / contract administrator. Owns inventory, planning, approvals, budget, warranty adjudication, flow analysis, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /sewer/districts, /sewer/technicians, PATCH /sewer/technicians/{id}"
      - "inspection-cycle create/open/close"
      - "segment + lateral create"
      - "cctv-inspection schedule + void"
      - "rehab-plan propose/approve/reopen/cancel"
      - "work-order create/cancel/invoice/void-invoice/mark-paid"
      - "bypass-plan approve/reject/close"
      - "warranty-case open/authorize-repair/deny/resolve/reopen/withdraw"
      - "flow-period create/activate/close/analyze"
      - "POST /sewer/_clock/set_current_utc"
    shared_operations:
      - "GET reads on all resources"
      - "PATCH line-items (quantity/price corrections while ISSUED)"
  - name: Coder
    description: "NASSCO PACP-certified CCTV coding technician. Drives inspections from start through QA submission and codes defect observations."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "cctv-inspection start/begin-coding/submit-qa"
      - "defect-observation create/delete"
    shared_operations:
      - "GET reads on districts, segments, cycles, inspections, defects, plans, work orders, warranty cases"
  - name: QaReviewer
    description: "NASSCO-certified QA reviewer. Certifies or rejects coded inspections; MUST differ from the coding technician (SoD)."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "cctv-inspection certify/reject"
    shared_operations:
      - "GET reads on districts, segments, cycles, inspections, defects, plans, work orders, warranty cases"
  - name: CrewLead
    description: "Rehabilitation crew supervisor. Mobilizes/executes work orders, manages bypass activation, reinstates laterals, reports installed quantities."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "work-order mobilize/begin-work/stand-down/submit-punch/resume-work/complete"
      - "bypass-plan propose/activate/demobilize"
      - "lateral reinstate"
      - "PATCH line-items installed_qty (IN_WORK/PUNCH_LIST)"
    shared_operations:
      - "GET reads on districts, segments, inspections, plans, work orders, bypass plans, notices"
  - name: CustomerServiceRep
    description: "Customer notification desk. Queues, sends, and acknowledges customer notices."
    identity: opaque
    exclusive_operations:
      - "customer-notice create/send/acknowledge"
    shared_operations:
      - "GET reads on districts, segments, laterals, notices, work orders"
