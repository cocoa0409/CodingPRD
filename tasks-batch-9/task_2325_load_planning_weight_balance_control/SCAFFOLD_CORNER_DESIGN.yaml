              payload: { flight_number: "LX1602", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f1: $.data.id, f1_ver: $.data.version }
            - call: "POST /load-plans"
              payload: { flight_id: "${f1}", expected_flight_version: "${f1_ver}" }
              as: LoadController
              captures: { lp1: $.data.id }
            - call: "POST /pax-lines"
              payload: { load_plan_id: "${lp1}", compartment_id: "${oc}", male_count: 25, female_count: 35 }
              as: LoadController
            - call: "POST /bag-allocations"
              payload: { load_plan_id: "${lp1}", compartment_id: "${h1}", bag_count: 112, bag_weight_kg: 1450 }
              as: LoadController
