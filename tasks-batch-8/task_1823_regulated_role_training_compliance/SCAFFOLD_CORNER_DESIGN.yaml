            - { call: "POST /compliance/roles", payload: { code: "R-XDM", name: "XD Mgr Role" }, as: ComplianceAdmin, captures: { role_mgr: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-XD", name: "XD Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-XD-1", full_name: "XD Mgr", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgr}" }, as: HRAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-XD-1", full_name: "XD Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${mgr}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id", av: "$.data[0].version" } }
