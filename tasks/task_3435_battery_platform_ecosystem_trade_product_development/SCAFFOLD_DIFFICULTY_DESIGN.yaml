# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3435_battery_platform_ecosystem_trade_product_development
# Nine Difficulty Rules x 2 instances each. Every setup_api_calls chain drives
# empty-DB -> the setup state using only SCAFFOLD.yaml section 1.5 endpoints.
# The logical clock defaults to 2026-09-01T00:00:00Z; chains set it explicitly
# whenever a date-sensitive computation is exercised.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: warranty_age_basis_divergence_tool_vs_battery
        grounds:
          - calculations.warranty_age_and_credit
          - entities.WarrantyClaim.fields.age_basis
          - entities.WarrantyClaim.fields.credit_cents
        distinguishing_aspect: |
          The two age-basis variants live on the SAME claim entity but are pinned by
          claim_type: a TOOL_REPAIR claim ages from first_paired_at (ACTIVATION) while a
          BATTERY_REPLACEMENT claim ages from manufactured_at (MANUFACTURE). Two units
          manufactured on the same day and paired on the same day land in different
          coverage bands (FREE vs PRORATED) with different credits — the variant
          selection rule, not the inputs, drives the divergence.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-15. One platform with one CERTIFIED gen-1 pack (price 20000, warranty 720d, free 90d) and one tool model (price 30000, warranty 360d, free 60d)."
            - "One PROFESSIONAL account holding two ACTIVE assets, both manufactured 2026-01-01 and both paired 2026-03-01: a TOOL asset and a BATTERY asset."
            - "One service center with both capabilities and capacity 10."
          setup_api_calls:
            - &d_clock_sep
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_platform
              call: "POST /battery-ecosystem/battery-platforms"
              payload: { code: "MX18", interface_key: "INTERFACE_A", chemistry_family: "LION_NMC", backward_commitment_years: 10, forward_commitment_generations: 2 }
              as: PlatformAdmin
              captures: { pf: $.data.id }
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-48-11", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
            - &d_submit_pk
              call: "POST /battery-ecosystem/battery-packs/${pk}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
            - &d_certify_pk
              call: "POST /battery-ecosystem/battery-packs/${pk}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "POST /battery-ecosystem/tool-models"
              payload: { platform_id: "${pf}", model_code: "T-2804", trade: "PLUMBING", category: "PIPE_TOOL", tier: "PROFESSIONAL", corded_conversion: false, avg_power_draw_w: 500, min_pack_generation: 1, max_pack_generation: 2, replacement_price_cents: 30000, warranty_days: 360, free_replacement_days: 60, torque_min_nm: 10, torque_max_nm: 200 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { tm: $.data.id }
            - &d_center
              call: "POST /battery-ecosystem/service-centers"
              payload: { code: "SC-1", region: "MW", capabilities: ["TOOL_REPAIR", "BATTERY_SERVICE"], daily_capacity: 10 }
              as: PlatformAdmin
              captures: { sc: $.data.id }
            - &d_account
              call: "POST /battery-ecosystem/asset-accounts"
              payload: { org_name: "Acme Mechanical", tier: "PROFESSIONAL" }
              as: PlatformAdmin
              captures: { ac: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "TOOL", tool_model_id: "${tm}", serial_number: "SN-T-1", manufactured_at: "2026-01-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { at: $.data.id }
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-B-1", manufactured_at: "2026-01-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { ab: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${at}", claim_type: "TOOL_REPAIR", fault_code: "NO_POWER", service_date: "2026-04-16" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { ct: $.data.id, ct_center: $.data.service_center_id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${ab}", claim_type: "BATTERY_REPLACEMENT", fault_code: "NO_CHARGE", service_date: "2026-04-16" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { cb: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/warranty-claims/${ct}/adjudicate"
              payload: { decision: "APPROVED" }
              as: ServiceAgent
              as_user_id: "${ct_center}"
            - call: "POST /battery-ecosystem/warranty-claims/${cb}/adjudicate"
              payload: { decision: "APPROVED" }
              as: ServiceAgent
              as_user_id: "${ct_center}"
          assert:
            - "WarrantyClaim.${ct}.age_basis == ACTIVATION and age_days == 45 (2026-03-01 pairing to 2026-04-15 clock)"
            - "WarrantyClaim.${ct}.coverage == FREE and credit_cents == 30000 (45 <= free_replacement_days 60)"
            - "WarrantyClaim.${cb}.age_basis == MANUFACTURE and age_days == 104 (2026-01-01 manufacture to 2026-04-15 clock)"
            - "WarrantyClaim.${cb}.coverage == PRORATED and credit_cents == 16660 (monthly rate round_half_up(20000/24)=833, remaining months floor(616/30)=20)"
            - "same manufacture date, same pairing date: only the claim_type-pinned variant explains 30000 != 16660"

      - name: compatibility_regulatory_vs_engineering_set_divergence
        grounds:
          - calculations.pack_compatibility_set
          - entities.ToolModel.fields.regulatory_compatible_pack_count
        distinguishing_aspect: |
          Two variants over the same pairing inputs on the pack/tool entity domain
          (distinct from the warranty claim domain of the sibling instance): REGULATORY
          counts only CERTIFIED non-held packs, ENGINEERING also counts SUBMITTED packs.
          With one CERTIFIED in-range pack, one SUBMITTED in-range pack and one REJECTED
          in-range pack, REGULATORY={P1} (size 1) and ENGINEERING={P1,P2} (size 2).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01. Platform forward_commitment 2. Pack P1 gen 1 CERTIFIED; pack P2 gen 2 SUBMITTED; pack P3 gen 2 REJECTED. Tool with pack window [1,3]."
          setup_api_calls:
            - *d_clock_sep
            - *d_platform
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-G1", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { p1: $.data.id }
            - call: "POST /battery-ecosystem/battery-packs/${p1}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/battery-packs/${p1}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-G2", pack_generation: 2, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 150, max_charge_rate_w: 300, replacement_price_cents: 26000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { p2: $.data.id }
            - call: "POST /battery-ecosystem/battery-packs/${p2}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-G2R", pack_generation: 2, cell_supplier_code: "LG", cell_format: "C21700", rated_capacity_wh: 150, max_charge_rate_w: 300, replacement_price_cents: 26000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { p3: $.data.id }
            - call: "POST /battery-ecosystem/battery-packs/${p3}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/battery-packs/${p3}/decide-certification"
              payload: { decision: "REJECTED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "POST /battery-ecosystem/tool-models"
              payload: { platform_id: "${pf}", model_code: "T-2953", trade: "ELECTRICAL", category: "SAW", tier: "PROFESSIONAL", corded_conversion: false, avg_power_draw_w: 400, min_pack_generation: 1, max_pack_generation: 3, replacement_price_cents: 25000, warranty_days: 360, free_replacement_days: 60, torque_min_nm: 5, torque_max_nm: 150 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { tm: $.data.id }
          trigger:
            - call: "GET /battery-ecosystem/tool-models/${tm}"
              payload: {}
              as: ProductEngineer
            - call: "GET /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", certification_status: "CERTIFIED" }
              as: ProductEngineer
            - call: "GET /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", certification_status: "SUBMITTED" }
              as: ProductEngineer
          assert:
            - "ToolModel.${tm}.regulatory_compatible_pack_count == 1 (only P1 is CERTIFIED, in [1,3], not held)"
            - "the CERTIFIED list contains exactly 1 pack (P1) and the SUBMITTED list exactly 1 pack (P2)"
            - "ENGINEERING set = CERTIFIED + SUBMITTED in range = {P1, P2} size 2, strictly larger than the REGULATORY size 1"
            - "P3 (REJECTED) is in neither variant"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: runtime_estimate_generation_gap_floor_and_launch_gate
        grounds:
          - calculations.runtime_estimate
          - calculations.pack_compatibility_set
          - state_machines.ToolModel.ENGINEERING_VALIDATION_to_LAUNCHED
        distinguishing_aspect: |
          Mode (a) combinatorial: three inputs (rated_capacity_wh, avg_power_draw_w,
          generation gap) interact through a capped-and-floored derate
          (min(gap,4) then max(...,0.8)) before a single final rounding. Tool A
          (window [1,3]) sees best_runtime 12.0 and launches; tool B (window [3,3])
          sees only the gap-2 pack at 10.8 min and its corded-conversion launch is
          rejected — identical packs, different eligibility window, different verdict.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Platform with three CERTIFIED 100 Wh packs of generations 1, 2, 3 (ratcheted in order)."
            - "Tool A: 500 W draw, corded_conversion, runtime_target_min 11.0, window [1,3]; fully research-gated (2 FIELD_RESEARCH + 1 JOBSITE_OBSERVATION adopted) and staged to ENGINEERING_VALIDATION."
            - "Tool B: 500 W draw, corded_conversion, runtime_target_min 11.0, window [3,3]; same research gates satisfied, staged to ENGINEERING_VALIDATION."
          setup_api_calls:
            - *d_clock_sep
            - *d_platform
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "R-G1", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pg1: $.data.id }
            - call: "POST /battery-ecosystem/battery-packs/${pg1}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/battery-packs/${pg1}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "R-G2", pack_generation: 2, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pg2: $.data.id }
            - call: "POST /battery-ecosystem/battery-packs/${pg2}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/battery-packs/${pg2}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "R-G3", pack_generation: 3, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pg3: $.data.id }
            - call: "POST /battery-ecosystem/battery-packs/${pg3}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/battery-packs/${pg3}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "POST /battery-ecosystem/tool-models"
              payload: { platform_id: "${pf}", model_code: "T-A", trade: "MASONRY", category: "SAW", tier: "TRADE_SPECIALIST", corded_conversion: true, avg_power_draw_w: 500, runtime_target_min: 11.0, min_pack_generation: 1, max_pack_generation: 3, replacement_price_cents: 40000, warranty_days: 360, free_replacement_days: 60, torque_min_nm: 5, torque_max_nm: 300 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { ta: $.data.id }
            - call: "POST /battery-ecosystem/tool-models"
              payload: { platform_id: "${pf}", model_code: "T-B", trade: "MASONRY", category: "SAW", tier: "TRADE_SPECIALIST", corded_conversion: true, avg_power_draw_w: 500, runtime_target_min: 11.0, min_pack_generation: 3, max_pack_generation: 3, replacement_price_cents: 40000, warranty_days: 360, free_replacement_days: 60, torque_min_nm: 5, torque_max_nm: 300 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { tb: $.data.id }
            - call: "POST /battery-ecosystem/insights"
              payload: { tool_model_id: "${ta}", kind: "FIELD_RESEARCH", summary: "fr1", severity: "HIGH" }
              as: FieldResearcher
              as_user_id: "fr-kim"
              captures: { ia1: $.data.id }
            - call: "POST /battery-ecosystem/insights"
              payload: { tool_model_id: "${ta}", kind: "FIELD_RESEARCH", summary: "fr2", severity: "MEDIUM" }
              as: FieldResearcher
              as_user_id: "fr-kim"
              captures: { ia2: $.data.id }
            - call: "POST /battery-ecosystem/insights"
              payload: { tool_model_id: "${ta}", kind: "JOBSITE_OBSERVATION", summary: "jo1", severity: "HIGH" }
              as: FieldResearcher
              as_user_id: "fr-kim"
              captures: { ia3: $.data.id }
            - call: "POST /battery-ecosystem/insights/${ia1}/decide"
              payload: { decision: "ADOPTED" }
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/insights/${ia2}/decide"
              payload: { decision: "ADOPTED" }
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/insights/${ia3}/decide"
              payload: { decision: "ADOPTED" }
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/insights"
              payload: { tool_model_id: "${tb}", kind: "FIELD_RESEARCH", summary: "fr1", severity: "HIGH" }
              as: FieldResearcher
              as_user_id: "fr-kim"
              captures: { ib1: $.data.id }
            - call: "POST /battery-ecosystem/insights"
              payload: { tool_model_id: "${tb}", kind: "FIELD_RESEARCH", summary: "fr2", severity: "LOW" }
              as: FieldResearcher
              as_user_id: "fr-kim"
              captures: { ib2: $.data.id }
            - call: "POST /battery-ecosystem/insights"
              payload: { tool_model_id: "${tb}", kind: "JOBSITE_OBSERVATION", summary: "jo1", severity: "MEDIUM" }
              as: FieldResearcher
              as_user_id: "fr-kim"
              captures: { ib3: $.data.id }
            - call: "POST /battery-ecosystem/insights/${ib1}/decide"
              payload: { decision: "ADOPTED" }
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/insights/${ib2}/decide"
              payload: { decision: "ADOPTED" }
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/insights/${ib3}/decide"
              payload: { decision: "ADOPTED" }
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "GET /battery-ecosystem/tool-models/${ta}"
              payload: {}
              as: ProductEngineer
              captures: { ta_v: $.data.version }
            - call: "POST /battery-ecosystem/tool-models/${ta}/transition"
              payload: { to_stage: "FIELD_RESEARCH", expected_tool_model_version: "${ta_v}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { ta_v2: $.data.version }
            - call: "POST /battery-ecosystem/tool-models/${ta}/transition"
              payload: { to_stage: "PROTOTYPE", expected_tool_model_version: "${ta_v2}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { ta_v3: $.data.version }
            - call: "POST /battery-ecosystem/tool-models/${ta}/transition"
              payload: { to_stage: "ENGINEERING_VALIDATION", expected_tool_model_version: "${ta_v3}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { ta_v4: $.data.version }
            - call: "GET /battery-ecosystem/tool-models/${tb}"
              payload: {}
              as: ProductEngineer
              captures: { tb_v: $.data.version }
            - call: "POST /battery-ecosystem/tool-models/${tb}/transition"
              payload: { to_stage: "FIELD_RESEARCH", expected_tool_model_version: "${tb_v}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { tb_v2: $.data.version }
            - call: "POST /battery-ecosystem/tool-models/${tb}/transition"
              payload: { to_stage: "PROTOTYPE", expected_tool_model_version: "${tb_v2}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { tb_v3: $.data.version }
            - call: "POST /battery-ecosystem/tool-models/${tb}/transition"
              payload: { to_stage: "ENGINEERING_VALIDATION", expected_tool_model_version: "${tb_v3}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { tb_v4: $.data.version }
          trigger:
            - call: "POST /battery-ecosystem/tool-models/${ta}/transition"
              payload: { to_stage: "LAUNCHED", expected_tool_model_version: "${ta_v4}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
            - call: "POST /battery-ecosystem/tool-models/${tb}/transition"
              payload: { to_stage: "LAUNCHED", expected_tool_model_version: "${tb_v4}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { err_b: $.data.error_id }
          assert:
            - "ToolModel.${ta}.stage == LAUNCHED: best_runtime_min == 12.0 (gen-1 pack, gap 0, efficiency 1.0: 100*1.0/500*60) >= 11.0"
            - "runtimes for tool A across the set are 12.0 (gap 0), 11.4 (gap 1, efficiency 0.95), 10.8 (gap 2, efficiency 0.90) — the min-capped derate, not a flat rate"
            - "tool B launch is rejected with error_id ERR_RUNTIME_TARGET_UNMET: its window [3,3] admits only the gap-2 pack at 10.8 < 11.0"
            - "ToolModel.${tb}.stage remains ENGINEERING_VALIDATION"

      - name: prorated_credit_monthly_rate_rounded_before_multiply
        grounds:
          - calculations.warranty_age_and_credit
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding where order is pinned — the monthly
          rate is rounded to whole cents FIRST (round_half_up(10001/12) = 833), then
          multiplied by remaining full months (9), yielding 7497. The alternative
          'round only the final product' yields round_half_up(10001*286/360) = 7946 —
          the two orders differ by 449 cents on identical inputs.
        test_recipe:
          setup:
            - "Logical clock 2026-03-16. CERTIFIED pack with replacement_price_cents 10001, warranty_days 360 (12 months), free_replacement_days 30."
            - "One account with a BATTERY asset manufactured 2026-01-01; one BATTERY_SERVICE center."
            - "A BATTERY_REPLACEMENT claim for service_date 2026-03-16, adjudicated at age_days = 74 -> PRORATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-16T00:00:00Z" }
              as: PlatformAdmin
            - *d_platform
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-PR", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 10001, warranty_days: 360, free_replacement_days: 30 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
            - *d_submit_pk
            - *d_certify_pk
            - *d_center
            - *d_account
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-PR-1", manufactured_at: "2026-01-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { ab: $.data.id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${ab}", claim_type: "BATTERY_REPLACEMENT", fault_code: "SWELL", service_date: "2026-03-16" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { cb: $.data.id, cb_center: $.data.service_center_id }
          trigger:
            - call: "POST /battery-ecosystem/warranty-claims/${cb}/adjudicate"
              payload: { decision: "APPROVED" }
              as: ServiceAgent
              as_user_id: "${cb_center}"
          assert:
            - "WarrantyClaim.${cb}.age_days == 74 and coverage == PRORATED (30 < 74 <= 360)"
            - "WarrantyClaim.${cb}.credit_cents == 7497 = round_half_up(10001/12) * floor((360-74)/30) = 833 * 9"
            - "credit_cents != 7946 (the round-half-up-only-at-the-end alternative), proving the pinned rounding order"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: pack_certification_reject_resubmit_cycle
        grounds:
          - state_machines.BatteryPack.REJECTED_to_SUBMITTED
          - state_machines.BatteryPack.DESIGN_to_SUBMITTED
          - state_machines.BatteryPack.SUBMITTED_to_CERTIFIED
          - state_machines.BatteryPack.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Cyclic machine on BatteryPack (distinct from the sibling's WarrantyClaim
          parallel dimensions): DESIGN -> SUBMITTED -> REJECTED -> SUBMITTED ->
          CERTIFIED loops back through SUBMITTED; each cycle re-stamps
          submitted_by_user_id, and segregation of duties is re-evaluated on every
          decision, not remembered from the first round.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One platform; one gen-1 pack. Round 1 submitted by pe-ana and REJECTED by ce-bob; round 2 resubmitted by pe-chen and CERTIFIED by ce-bob."
          setup_api_calls:
            - *d_clock_sep
            - *d_platform
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-CYC", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C18650", rated_capacity_wh: 80, max_charge_rate_w: 150, replacement_price_cents: 15000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
            - call: "POST /battery-ecosystem/battery-packs/${pk}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { v2: $.data.version }
            - call: "POST /battery-ecosystem/battery-packs/${pk}/decide-certification"
              payload: { decision: "REJECTED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
          trigger:
            - call: "POST /battery-ecosystem/battery-packs/${pk}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-chen"
              captures: { v4: $.data.version }
            - call: "POST /battery-ecosystem/battery-packs/${pk}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
          assert:
            - "after round 1: certification_status == REJECTED with version 3"
            - "resubmission succeeds from REJECTED (the cycle edge): certification_status == SUBMITTED, submitted_by_user_id == pe-chen (re-stamped), version == ${v4} == 4"
            - "final decision CERTIFIED from the second SUBMITTED: certification_status == CERTIFIED, version == 5"
            - "platform.current_generation == 1 after the CERTIFIED decision (bubble-up recompute)"

      - name: claim_parallel_dimensions_independent_then_joined
        grounds:
          - state_machines.WarrantyClaim
          - entities.WarrantyClaim.fields.adjudication_status
          - entities.WarrantyClaim.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel state dimensions on WarrantyClaim (distinct from the sibling's
          BatteryPack cycle): adjudication_status and fulfillment_status evolve as
          independent axes — APPROVED flips fulfillment NONE -> AWAITING_UNIT as a
          cross-dimension side effect, REJECTED flips it to CANCELLED, and the
          complete endpoint enforces the join gate (adjudication APPROVED AND
          fulfillment AWAITING_UNIT).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CERTIFIED pack (price 20000, warranty 720d, free 90d); center cap 10 with BATTERY_SERVICE; account with one BATTERY asset manufactured 2026-06-01."
            - "Claim A approved then completed (replacement asset auto-registered); claim B rejected; a complete attempt on claim B hits the join gate."
          setup_api_calls:
            - *d_clock_sep
            - *d_platform
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-PD", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
            - *d_submit_pk
            - *d_certify_pk
            - *d_center
            - *d_account
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-PD-1", manufactured_at: "2026-06-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { ab: $.data.id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${ab}", claim_type: "BATTERY_REPLACEMENT", fault_code: "NO_CHARGE", service_date: "2026-09-02" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { ca: $.data.id, ca_center: $.data.service_center_id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${ab}", claim_type: "BATTERY_REPLACEMENT", fault_code: "OVERHEAT", service_date: "2026-09-03" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { cb: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/warranty-claims/${ca}/adjudicate"
              payload: { decision: "APPROVED" }
              as: ServiceAgent
              as_user_id: "${ca_center}"
            - call: "POST /battery-ecosystem/warranty-claims/${ca}/complete"
              payload: {}
              as: ServiceAgent
              as_user_id: "${ca_center}"
            - call: "POST /battery-ecosystem/warranty-claims/${cb}/adjudicate"
              payload: { decision: "REJECTED" }
              as: ServiceAgent
              as_user_id: "${ca_center}"
            - call: "POST /battery-ecosystem/warranty-claims/${cb}/complete"
              payload: {}
              as: ServiceAgent
              as_user_id: "${ca_center}"
              captures: { err_join: $.data.error_id }
            - call: "GET /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}" }
              as: AccountManager
              as_user_id: "${ac}"
          assert:
            - "after adjudicate APPROVED on claim A: adjudication_status == APPROVED while fulfillment_status moves NONE -> AWAITING_UNIT (independent axes, one side effect)"
            - "after complete on claim A: fulfillment_status == COMPLETED and adjudication_status still APPROVED"
            - "claim A completion created a second TrackedAsset on the account with is_replacement_unit == true (battery replacement side effect)"
            - "after adjudicate REJECTED on claim B: adjudication_status == REJECTED and fulfillment_status == CANCELLED"
            - "complete on claim B is rejected with error_id ERR_INVALID_STATE (join gate: fulfillment is CANCELLED, not AWAITING_UNIT)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: counterfeit_confirm_three_hop_cascade
        grounds:
          - state_machines.CounterfeitCase.REPORTED_to_CONFIRMED
          - state_machines.DistributionListing.ACTIVE_to_SUSPENDED
          - entities.ChannelPartner.fields.has_suspended_listings
          - validations.priority_16
        distinguishing_aspect: |
          Depth-3 cascade triggered by the counterfeit resolve transition (distinct
          from the sibling's bulletin-creation trigger): CONFIRMED mutates
          BatteryPack.safety_hold (hop 1); the pack mutation forces each ACTIVE
          listing of the pack into SUSPENDED with requires_relist_ack=true (hop 2);
          each listing suspension recomputes the partner's has_suspended_listings
          to true (hop 3), which itself gates future POST /listings.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Platform with CERTIFIED pack; INDUSTRIAL partner with one ACTIVE listing of the pack."
            - "A counterfeit case reported by the partner's ChannelManager and resolved CONFIRMED with evidence_score 80 by a different user."
          setup_api_calls:
            - *d_clock_sep
            - *d_platform
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-CF", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
            - *d_submit_pk
            - *d_certify_pk
            - &d_partner_ind
              call: "POST /battery-ecosystem/channel-partners"
              payload: { name: "Midwest Industrial Supply", channel_type: "INDUSTRIAL_DISTRIBUTOR", region: "MW" }
              as: PlatformAdmin
              captures: { cp: $.data.id, cp_v: $.data.version }
            - call: "POST /battery-ecosystem/listings"
              payload: { channel_partner_id: "${cp}", battery_pack_id: "${pk}", wholesale_price_cents: 12000, allocation_qty: 50, expected_channel_partner_version: "${cp_v}" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { li: $.data.id }
            - call: "POST /battery-ecosystem/listings/${li}/transition"
              payload: { to_status: "ACTIVE" }
              as: ChannelManager
              as_user_id: "${cp}"
            - call: "POST /battery-ecosystem/counterfeit-cases"
              payload: { battery_pack_id: "${pk}", reported_serial: "FAKE-9001", detection_method: "SERIAL_MISMATCH" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { cc: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/counterfeit-cases/${cc}/resolve"
              payload: { verdict: "CONFIRMED", evidence_score: 80 }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "GET /battery-ecosystem/battery-packs/${pk}"
              payload: {}
              as: ComplianceEngineer
            - call: "GET /battery-ecosystem/listings/${li}"
              payload: {}
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { cp_v2: $.data.channel_partner_version }
            - call: "POST /battery-ecosystem/listings"
              payload: { channel_partner_id: "${cp}", battery_pack_id: "${pk}", wholesale_price_cents: 12500, allocation_qty: 10, expected_channel_partner_version: "${cp_v2}" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { err_gate: $.data.error_id }
          assert:
            - "hop 1: BatteryPack.${pk}.safety_hold == true (certification_status stays CERTIFIED — hold is orthogonal)"
            - "hop 2: DistributionListing.${li}.status == SUSPENDED and requires_relist_ack == true"
            - "hop 3: the partner gate engaged — the fresh POST /listings carries the current partner version ${cp_v2} yet still fails with error_id ERR_PARTNER_HAS_SUSPENDED_LISTINGS"
            - "CounterfeitCase.${cc}.status == CONFIRMED and resolved_by_user_id == ce-bob"

      - name: recall_bulletin_two_hop_cascade
        grounds:
          - state_machines.BatteryPack.CERTIFIED_to_RECALLED
          - state_machines.DistributionListing.ACTIVE_to_ENDED
          - endpoints.POST_/battery-ecosystem/safety-bulletins
        distinguishing_aspect: |
          Depth-2 cascade triggered by bulletin CREATION (distinct trigger from the
          sibling's counterfeit resolve): a RECALL-severity bulletin targeting the
          pack forces CERTIFIED -> RECALLED (hop 1); the pack's own recall
          transition then forces every ACTIVE listing of the pack to ENDED (hop 2) —
          terminal for the listing, unlike the SUSPENDED hop of the counterfeit path.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Platform with CERTIFIED pack; INDUSTRIAL partner with one ACTIVE listing of the pack."
          setup_api_calls:
            - *d_clock_sep
            - *d_platform
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-RC", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
            - *d_submit_pk
            - *d_certify_pk
            - *d_partner_ind
            - call: "POST /battery-ecosystem/listings"
              payload: { channel_partner_id: "${cp}", battery_pack_id: "${pk}", wholesale_price_cents: 12000, allocation_qty: 25, expected_channel_partner_version: "${cp_v}" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { li: $.data.id }
            - call: "POST /battery-ecosystem/listings/${li}/transition"
              payload: { to_status: "ACTIVE" }
              as: ChannelManager
              as_user_id: "${cp}"
          trigger:
            - call: "POST /battery-ecosystem/safety-bulletins"
              payload: { platform_id: "${pf}", battery_pack_ids: ["${pk}"], severity: "RECALL", title: "Thermal runaway risk in P-RC", effective_from: "2026-09-01T00:00:00Z" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
              captures: { sb: $.data.id }
            - call: "GET /battery-ecosystem/battery-packs/${pk}"
              payload: {}
              as: ComplianceEngineer
            - call: "GET /battery-ecosystem/listings/${li}"
              payload: {}
              as: ChannelManager
              as_user_id: "${cp}"
          assert:
            - "hop 1: BatteryPack.${pk}.certification_status == RECALLED"
            - "hop 2: DistributionListing.${li}.status == ENDED (recall end is terminal, not a suspension)"
            - "SafetyBulletin.${sb}.status == ISSUED and severity == RECALL"
            - "the cascade is observable end-to-end from the bulletin-creation response alone plus one read per affected entity; no intermediate endpoint was invoked between hops"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: claim_create_state_error_beats_capacity_fiscal_error
        grounds:
          - validations.priority_6
          - validations.priority_21
          - errors.ERR_INVALID_STATE
          - errors.ERR_NO_SERVICE_CAPACITY
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the claim targets a
          DECOMMISSIONED asset (state violation, priority 6) AND the only eligible
          center is fully booked on the requested date (fiscal violation,
          priority 21). The lower priority number wins: ERR_INVALID_STATE, not
          ERR_NO_SERVICE_CAPACITY.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CERTIFIED pack; one center cap 1 with BATTERY_SERVICE; one account with battery assets A1 (ACTIVE) and A2 (DECOMMISSIONED)."
