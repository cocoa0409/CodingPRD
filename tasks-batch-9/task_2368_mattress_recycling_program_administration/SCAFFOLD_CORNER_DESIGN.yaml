  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: stale_program_version_rejects_a_rate_proposal
        layer: optimistic_concurrency
        claim_type: OCC conflict rejected
        grounds:
          - concurrency_rules[rate-schedule-create-stale-program]
          - errors[ERR_STALE_PROGRAM_VERSION]
        distinguishing_aspect: "A proposal carrying the version observed before an unrelated forecast PATCH is 412 ERR_STALE_PROGRAM_VERSION, and the identical proposal with the refreshed version succeeds."
        test_recipe:
          setup:
            - "One CA program; its version is captured at creation, then a forecast PATCH advances it."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id, v1: $.data.version }
            - call: "PATCH /state-programs/${prog_ca_id}/cost-forecast"
              payload: { forecast_other_revenue_cents: 3000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "MATTRESS", fee_cents_per_unit: 1100, effective_from: "2026-01-01T00:00:00Z", expected_state_program_version: "${v1}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "MATTRESS", fee_cents_per_unit: 1100, effective_from: "2026-01-01T00:00:00Z", expected_state_program_version: "${v2}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sch_id: $.data.id }
          assert:
            - "Stale proposal: HTTP 412 with data.error_id == ERR_STALE_PROGRAM_VERSION and no FeeRateSchedule row is created"
            - "Refreshed proposal: HTTP 201 with data.status == PROPOSED and data.recommended_rate_cents_at_proposal == 1075"
            - "StateProgram.${prog_ca_id}.version == 3 after the accepted proposal (the rejected one did not consume a version)"

      - name: stale_program_version_precedes_the_band_check
        layer: optimistic_concurrency
        claim_type: OCC precedes business validation
        grounds:
          - concurrency_rules[rate-schedule-create-stale-program]
          - validations[priority=90]
          - errors[ERR_STALE_PROGRAM_VERSION]
        distinguishing_aspect: "A proposal that is both stale and outside the new band returns 412 ERR_STALE_PROGRAM_VERSION rather than 422 ERR_RATE_OUTSIDE_RECOMMENDED_BAND, so the OCC gate is evaluated before the band arithmetic."
        test_recipe:
          setup:
            - "CA program whose forecast cost is PATCHed to 72000000, moving the band from [860, 1290] to [1047, 1571]."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id, v1: $.data.version }
            - call: "PATCH /state-programs/${prog_ca_id}/cost-forecast"
              payload: { forecast_annual_cost_cents: 72000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "MATTRESS", fee_cents_per_unit: 900, effective_from: "2026-01-01T00:00:00Z", expected_state_program_version: "${v1}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "MATTRESS", fee_cents_per_unit: 900, effective_from: "2026-01-01T00:00:00Z", expected_state_program_version: "${v2}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "MATTRESS", fee_cents_per_unit: 1047, effective_from: "2026-01-01T00:00:00Z", expected_state_program_version: "${v2}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sch_id: $.data.id }
          assert:
            - "Stale + out-of-band: HTTP 412 with data.error_id == ERR_STALE_PROGRAM_VERSION"
            - "Fresh + out-of-band: HTTP 422 with data.error_id == ERR_RATE_OUTSIDE_RECOMMENDED_BAND (900 < 1047)"
            - "Fresh + at band_low: HTTP 201 with data.recommended_rate_cents_at_proposal == 1309 and data.band_low_cents == 1047"

