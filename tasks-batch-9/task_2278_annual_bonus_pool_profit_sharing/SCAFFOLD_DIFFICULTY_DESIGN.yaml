        distinguishing_aspect: |
          Depth 4 from a single APPROVE: adjustment -> award
          (adjustment_total_cents 225,206 / final_award_cents 2,225,206) ->
          pool (allocated 2,477,261, available -225,206, distribution_status
          flips WITHIN_GUIDELINES -> OVER_ALLOCATED) -> plan
