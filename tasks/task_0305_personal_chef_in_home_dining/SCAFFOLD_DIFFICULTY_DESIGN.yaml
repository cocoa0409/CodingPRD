            - call: "POST /grocery-runs"
              payload: { booking_id: "${booking_id}", line_items: [{ label: "x", actual_cost_cents: 5000 }] }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BOOKING_NOT_CONFIRMED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- Instance 1: buffer-widened half-open overlap vs HELD block (Chef availability) ----
      - name: confirm_buffer_widened_overlap_with_held_blackout
        grounds:
          - validations[priority=10]
          - errors[ERR_CHEF_TIME_CONFLICT]
          - entities.Chef.fields.prep_buffer_minutes
          - entities.AvailabilityBlock.fields.window_start_utc
          - state_machines.Booking.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Interval semantics #1: the occupied window is widened by prep_buffer_minutes (90) and
          compared half-open [start-buffer, end). A booking whose event starts 17:00 has occupied
          start 15:30, which collides with a BLACKOUT [15:45,16:30) even though the event itself
          (17:00+) does not — the BUFFER is what creates the overlap. Resource = Chef availability.
        test_recipe:
          setup:
            - "Active chef (prep_buffer 90) with a BLACKOUT 15:45-16:30 on 2026-09-18; booking event 17:00-20:00 same day."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef TO1", home_base_zip: "94101", prep_buffer_minutes: 90 }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "Tasting A", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000, min_party_size: 2, max_party_size: 12 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /availability-blocks"
              payload: { chef_id: "${chef_id}", window_start_utc: "2026-09-18T15:45:00Z", window_end_utc: "2026-09-18T16:30:00Z" }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v1: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Client TO1", email: "to1@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94170", event_start_utc: "2026-09-18T17:00:00Z", event_end_utc: "2026-09-18T20:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_chef_version: "${chef_v1}" }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CHEF_TIME_CONFLICT"

      # ---- Instance 2: per-day aggregate capacity (closed-day count semantics) ----
      - name: daily_capacity_aggregate_overlap_same_event_date
        grounds:
          - validations[priority=11]
          - errors[ERR_DAILY_CAPACITY_EXCEEDED]
          - entities.Chef.fields.max_bookings_per_day
          - entities.Booking.fields.event_date
          - state_machines.Booking.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Interval semantics #2 (distinct from buffer half-open): aggregate per-calendar-day
          capacity, NOT geometric overlap. With max_bookings_per_day==1, a second non-overlapping
          booking on the SAME event_date (different clock times that do not collide geometrically)
          is still rejected ERR_DAILY_CAPACITY_EXCEEDED because the count of CONFIRMED bookings
          sharing event_date reaches the cap. Resource = chef daily-capacity counter.
        test_recipe:
          setup:
            - "Active chef with max_bookings_per_day 1; one CONFIRMED booking on 2026-09-20 morning; a second REQUESTED booking same date evening (no geometric overlap)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef TO2", home_base_zip: "94101", prep_buffer_minutes: 30, max_bookings_per_day: 1 }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "Tasting A", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000, min_party_size: 2, max_party_size: 12 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v1: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Client TO2", email: "to2@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94175", event_start_utc: "2026-09-20T09:00:00Z", event_end_utc: "2026-09-20T12:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_a: $.data.id }
            - call: "POST /bookings/${booking_a}/confirm"
              payload: { expected_chef_version: "${chef_v1}" }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v2: $.data.version }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94175", event_start_utc: "2026-09-20T19:00:00Z", event_end_utc: "2026-09-20T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_b: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_b}/confirm"
              payload: { expected_chef_version: "${chef_v2}" }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DAILY_CAPACITY_EXCEEDED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- Instance 1: money conserved — cancel+refund vs chef payout ----
      - name: cancel_refund_preserves_chef_payout_money_invariant
        grounds:
          - calculations.chef_payout_invariant
          - calculations.cancellation_refund
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Chef.fields.payout_accrued_cents
          - entities.Chef.fields.captured_payments_cents
          - entities.Chef.fields.refunded_payments_cents
        distinguishing_aspect: |
          Conserved quantity #1 = money: after capturing a 26196 deposit then cancelling at a
          half-refund lead time (rate 0.5 -> refund 13098), the chef's payout_accrued_cents
          (=13098) MUST equal captured_payments_cents(26196) - refunded_payments_cents(13098);
          the forward capture + compensating refund leave the named invariant intact, no drift.
        test_recipe:
          setup:
            - "Confirmed party-6 booking with deposit 26196 paid; event 13 days out (half refund tier)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef CI1", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "Tasting A", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000, min_party_size: 2, max_party_size: 12 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v1: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Client CI1", email: "ci1@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94180", event_start_utc: "2026-07-14T00:00:00Z", event_end_utc: "2026-07-14T04:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_chef_version: "${chef_v1}" }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /payments"
              payload: { booking_id: "${booking_id}", kind: "DEPOSIT", amount_cents: 26196 }
              as: Client
              as_user_id: "${client_id}"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { rate: $.data.cancellation_refund_rate }
          assert:
            - "Booking.${booking_id}.cancellation_refund_rate == 0.5"
            - "Chef.${chef_id}.captured_payments_cents == 26196"
            - "Chef.${chef_id}.refunded_payments_cents == 13098"
            - "Chef.${chef_id}.payout_accrued_cents == 13098"

      # ---- Instance 2: capacity conserved — cancel restores active_booking_count ----
      - name: cancel_restores_chef_active_booking_count_capacity_invariant
        grounds:
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Chef.fields.active_booking_count
          - entities.AvailabilityBlock.fields.status
        distinguishing_aspect: |
          Conserved quantity #2 = capacity count (a DIFFERENT conserved quantity than money):
          confirming a booking increments Chef.active_booking_count 0->1 and mints a HELD hold;
          cancelling it (compensating action) decrements back to 0 and RELEASES the hold, so the
          chef's active_booking_count returns to its pre-booking value with zero drift.
        test_recipe:
          setup:
            - "Active chef with one CONFIRMED booking (active_booking_count 1, one HELD hold)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef CI2", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "Tasting A", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000, min_party_size: 2, max_party_size: 12 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v1: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Client CI2", email: "ci2@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94185", event_start_utc: "2026-09-25T18:00:00Z", event_end_utc: "2026-09-25T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_chef_version: "${chef_v1}" }
              as: Chef
              as_user_id: "${chef_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { lc: $.data.lifecycle_status }
          assert:
            - "Booking.${booking_id}.lifecycle_status == CANCELLED"
            - "Chef.${chef_id}.active_booking_count == 0"
            - "AvailabilityBlock filtered by booking_id=${booking_id} has its single block status == RELEASED"
