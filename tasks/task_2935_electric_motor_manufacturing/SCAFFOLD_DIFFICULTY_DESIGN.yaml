          overhead_band is chosen from direct_cost_cents alone, never from standard_cost_cents.
          An 11-unit work order on design D3 has direct_cost_cents 1375000 -> STANDARD (0.22),
          overhead 302500, standard_cost_cents 1677500 — a standard cost that is itself above the
