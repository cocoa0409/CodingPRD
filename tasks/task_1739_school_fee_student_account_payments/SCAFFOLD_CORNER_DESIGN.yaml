  # ---------------------------------------------------------------------------
  # Section 8 — Cross-Cutting Complexity Layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_plan_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[payment-plan-create-stale-account]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Plan creation carrying the pre-mutation account version is rejected 412; replaying with the fresh version succeeds — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["OPEN year (plan min 1000); account with a 6000-cent assessment; client has observed version v1"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 6000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f_id}", assessed_amount_cents: 6000 }
              as: Bookkeeper
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { a_v1: $.data.version }
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f_id}", assessed_amount_cents: 1000 }
              as: Bookkeeper
          trigger:
            - call: "POST /student-accounts/${a_id}/payment-plans"
              payload: { installment_count: 2, first_due_date: "2026-09-05", interval_days: 30, expected_account_version: "${a_v1}" }
              as: Bookkeeper
              captures: { err: $.data.error_id }
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { a_v2: $.data.version }
            - call: "POST /student-accounts/${a_id}/payment-plans"
              payload: { installment_count: 2, first_due_date: "2026-09-05", interval_days: 30, expected_account_version: "${a_v2}" }
              as: Bookkeeper
              captures: { plan_id: $.data.id }
          assert:
            - "Stale create rejected: ${err} == ERR_STALE_VERSION (HTTP 412) — the second ad-hoc assessment bumped the version after the client read it"
            - "Fresh version succeeds: PaymentPlan.${plan_id} created (201)"
      - name: occ_stale_version_on_waiver_approve
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[waiver-approve-stale-account]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Waiver approval carrying a stale account version is rejected 412 even when every other precondition (SoD, eligibility, ACTIVE program) passes."
        test_recipe:
          setup: ["OPEN year; program (grades 9-12); PENDING application from fam-1; account version observed, then bumped by an ad-hoc assessment"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 1000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /school-years/${y_id}/waiver-programs"
              payload: { name: "P", waiver_pct_bp: 5000, stacking_priority: 1, max_waived_per_student_cents: 100000, eligibility_grade_min: 9, eligibility_grade_max: 12 }
              as: Bookkeeper
              captures: { prog_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/waiver-applications"
              payload: { waiver_program_id: "${prog_id}" }
              as: FamilyMember
              as_user_id: "fam-1"
              captures: { app_id: $.data.id }
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { a_v1: $.data.version }
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f_id}", assessed_amount_cents: 1000 }
              as: Bookkeeper
          trigger:
            - call: "POST /student-accounts/${a_id}/waiver-applications/${app_id}/approve"
              payload: { expected_account_version: "${a_v1}" }
              as: Bookkeeper
              as_user_id: "bk-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_VERSION (HTTP 412)"
            - "WaiverApplication.${app_id}.status remains PENDING"
      - name: occ_stale_version_on_year_close
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[year-close-stale-year]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Closing a year with the version observed before open (which bumped it) is rejected 412; the close preconditions otherwise hold (no cases, no plans)."
        test_recipe:
          setup: ["Year created (version 1 captured), then opened (version bumps to 2); no accounts at all, so close preconditions are clean"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id, y_v1: $.data.version }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
          trigger:
            - call: "POST /school-years/${y_id}/close"
              payload: { expected_year_version: "${y_v1}" }
              as: Bookkeeper
              captures: { err: $.data.error_id }
            - call: "GET /school-years/${y_id}"
              as: Bookkeeper
              captures: { y_v2: $.data.version }
            - call: "POST /school-years/${y_id}/close"
              payload: { expected_year_version: "${y_v2}" }
              as: Bookkeeper
              captures: { y_status: $.data.status }
          assert:
            - "Stale close rejected: ${err} == ERR_STALE_VERSION (HTTP 412)"
            - "Fresh close succeeds: ${y_status} == CLOSED"
      - name: plan_cancel_returns_assessments_and_waives_installments
        claim_type: scheduled_actions
        grounds: [state_machines.PaymentPlan.ACTIVE_to_CANCELLED, state_machines.PaymentPlanInstallment.SCHEDULED_to_WAIVED_BY_DEFAULT]
        distinguishing_aspect: "Cancelling an untouched ACTIVE plan waives all SCHEDULED installments and returns covered assessments to ASSESSED with the full obligation restored to the normal waterfall."
        test_recipe:
          setup: ["OPEN year (plan min 1000); account with a 4000-cent assessment covered by an ACTIVE plan (2 x 2000); no payments"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 4000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f_id}", assessed_amount_cents: 4000 }
              as: Bookkeeper
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { a_v: $.data.version }
            - call: "POST /student-accounts/${a_id}/payment-plans"
              payload: { installment_count: 2, first_due_date: "2026-09-05", interval_days: 30, expected_account_version: "${a_v}" }
              as: Bookkeeper
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /student-accounts/${a_id}/payment-plans/${plan_id}/cancel"
              as: Bookkeeper
              captures: { plan_status: $.data.status }
            - call: "GET /student-accounts/${a_id}/payment-plans/${plan_id}/installments"
              as: Bookkeeper
              captures: { i1: "$.data[0].status", i2: "$.data[1].status" }
            - call: "GET /student-accounts/${a_id}/fee-assessments"
              as: Bookkeeper
              captures: { fa_status: "$.data[0].status", fa_outstanding: "$.data[0].outstanding_cents" }
          assert:
            - "${plan_status} == CANCELLED"
            - "${i1} == WAIVED_BY_DEFAULT and ${i2} == WAIVED_BY_DEFAULT"
            - "${fa_status} == ASSESSED and ${fa_outstanding} == 4000 (obligation fully restored)"
      - name: layer_cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: student_withdraw_cascade_to_department_ledger
          rationale: "N-level cascade verified end-to-end in the named §1.8 instance (depth 4)."
      - name: layer_dual_variant_covered
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: waiver_stacking_provisional_vs_final_diverge
          rationale: "Both variants and their delta asserted in the named §1.8 instance (and its refund counterpart)."
      - name: layer_ops_run_checkpoint_covered
        claim_type: ops_run_checkpoint
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: ops_run_plan_default_cascade_to_collections
          rationale: "Sweep-driven epoch advance and its cascades asserted in the named §1.8 instance."
      - name: layer_rate_threshold_covered
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: graduation_hold_threshold_strict_greater
          rationale: "Threshold boundary (strict >) asserted at both sides in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  # Section 9 — Consistency Model (immediate)
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: settle_immediately_visible_on_read
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, calculations.allocation_waterfall]
        distinguishing_aspect: "A settle followed by an immediate GET (same logical instant, no ops-run) already reflects the new balance and assessment status — no eventual-consistency lag."
        test_recipe:
          setup: ["OPEN year; account with a 3000-cent assessment"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 3000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f_id}", assessed_amount_cents: 3000 }
              as: Bookkeeper
              captures: { fa_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/payments"
              payload: { amount_cents: 3000, method: "CARD", idempotency_key: "k1" }
              as: FamilyMember
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /student-accounts/${a_id}/payments/${p_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: FamilyMember
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { bal: $.data.balance_cents, paid: $.data.paid_cents }
            - call: "GET /student-accounts/${a_id}/fee-assessments/${fa_id}"
              as: Bookkeeper
              captures: { fa_status: $.data.status }
          assert:
            - "Immediately after settle: ${bal} == 0 and ${paid} == 3000"
            - "${fa_status} == PAID in the same instant (immediate consistency, no batch delay)"
