              captures: { sup: "$.data.id" }
            - call: POST /grain-inspection/inspectors/${sup}/training-records
              as: ServiceAdmin
              payload: { course_code: "SUPERVISION-201", hours: 24 }
            - call: POST /grain-inspection/inspectors/${sup}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "SOYBEANS", point_of_service: "LOADING", lot_identifier: "LOT-WATCH", declared_quantity_bushels: 60000, requested_services: ["GRADING", "EXPORT_SUPERVISION"] }
              captures: { req: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/vessel-watches
              as: SupervisingInspector
              payload: { inspection_request_id: "${req}", supervisor_inspector_id: "${sup}", vessel_name: "MV Corn Runner", window_start_at: "2026-08-04T08:00:00Z", window_end_at: "2026-08-04T08:00:00Z", holds_declared: 3 }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_WATCH_WINDOW_INVALID: window_end_at must be strictly after window_start_at"
            - "GET /grain-inspection/vessel-watches?inspection_request_id=${req} -> total_count 0 and GET /grain-inspection/service-areas/${area} -> open_watch_count 0"
            - "A window of 2026-08-04T16:00:00Z to 2026-08-04T08:00:00Z -> 422 ERR_WATCH_WINDOW_INVALID; a window of 2026-08-04T08:00:00Z to 2026-08-04T16:00:00Z -> 201 SCHEDULED with open_watch_count 1"
            - "Starting that watch while the clock still reads 2026-08-03T09:00:00Z -> 422 ERR_WATCH_WINDOW_INVALID (now < window_start_at)"
            - "After the clock moves to exactly 2026-08-04T08:00:00Z the start -> 200 IN_PROGRESS with started_at equal to the clock (the lower bound is inclusive)"
            - "A second watch for 2026-08-04T10:00:00Z to 2026-08-04T16:00:00Z started after the clock reaches exactly 2026-08-04T16:00:00Z -> 422 ERR_WATCH_WINDOW_INVALID (the upper bound is exclusive)"

      - name: board_appeal_needs_an_upheld_predecessor_and_an_outside_panel
        claim_type: cascading_validation
        grounds:
          - "validations[priority=11]"
          - "validations[priority=12]"
          - "errors[ERR_APPEAL_ESCALATION_INVALID]"
          - "errors[ERR_BOARD_PANEL_COMPOSITION_INVALID]"
          - "calculations.appeal_panel_tally"
        distinguishing_aspect: "Escalation is a two-stage gate whose second stage only becomes reachable after the first appeal has been fully tallied and upheld: the same BOARD_APPEAL filing is refused before the predecessor exists, and once accepted its panel must come from a different service area, so an inspector who legally voted in round 1 is illegal in round 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "Area A1 (DELEGATED, supervision_required false) with an ACTIVE GRADING fee schedule, a certified probe, grader I0 (SAMPLING + GRADING), ACTIVE regrader RA (GRADING) and three ACTIVE SUPERVISION voters V1, V2, V3; area A2 with one ACTIVE SUPERVISION voter B1."
            - "A CORN request in A1 with an 8-portion sample, a FINAL grading result by I0 and a GRADE certificate."
            - "A BOARD_APPEAL attempted immediately after issuance is refused, then a round-1 APPEAL is filed, sample-assigned, regraded by RA and upheld by three UPHOLD votes, returning the certificate to ISSUED."
            - "The BOARD_APPEAL is then filed against the certificate's newest version, sample-assigned and regraded by RA, so it sits in UNDER_REVIEW with required_panel_size 5."
