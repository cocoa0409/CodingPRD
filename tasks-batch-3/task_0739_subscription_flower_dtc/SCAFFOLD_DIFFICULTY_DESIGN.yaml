              captures: { sh0_id: "$.data[0].id" }
            - call: "POST /stem-lots"
              payload: { variety: "ROSE", grade: "A", quantity_total: 100, unit_cost_cents: 40, sourced_at: "2026-03-04T00:00:00Z", shelf_life_hours: 240 }
              as: FulfillmentOps
              captures: { lot_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${sh0_id}/source"
              payload: {}
              as: FulfillmentOps
            - call: "POST /shipments/${sh0_id}/allocations"
              payload: { lot_id: "${lot_id}", quantity_reserved: 5, hold_start: "2026-03-05T08:00:00Z", hold_end: "2026-03-05T10:00:00Z" }
              as: FulfillmentOps
              captures: { pid: "$.data.id" }
          trigger:
            - call: "POST /shipments/${sh0_id}/allocations"
              payload: { lot_id: "${lot_id}", quantity_reserved: 5, hold_start: "2026-03-05T10:15:00Z", hold_end: "2026-03-05T11:00:00Z" }
              as: FulfillmentOps
              captures: { err: "$.data.error_id" }
            - call: "POST /shipments/${sh0_id}/allocations"
              payload: { lot_id: "${lot_id}", quantity_reserved: 5, hold_start: "2026-03-05T10:30:00Z", hold_end: "2026-03-05T11:00:00Z" }
              as: FulfillmentOps
              captures: { rid: "$.data.id" }
          assert:
            - "second hold [10:15,11:00] returns error_id == ERR_LOT_HOLD_CONFLICT (gap 15 min < CLEAN_BUFFER_MINUTES 30)"
            - "third hold [10:30,11:00] is reserved (gap == 30 min meets the buffer; closed-interval + buffer semantics)"

  # =================================================================
  # Rule 9 — compensating-action invariants (different conserved qty)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: stem_conservation_reserve_then_release
        grounds:
          - calculations.stem_availability
          - state_machines.StemAllocation.RESERVED_to_RELEASED
          - entities.StemLot.fields.quantity_available
        distinguishing_aspect: |
          Conserved quantity = STEMS: while 25 are RESERVED the invariant quantity_total(60) ==
          quantity_available(35) + reserved(25) holds; after cancel releases the allocation, quantity_available
          returns to 60 == quantity_total with zero drift.
        test_recipe:
          setup:
            - "Lot L total 60 (fresh); shipment sh0 in SOURCING with a 25-stem RESERVED allocation (available 35)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c17@x.com", full_name: "C Seventeen" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/shipments"
              as: PlatformAdmin
              captures: { sh0_id: "$.data[0].id" }
            - call: "POST /stem-lots"
              payload: { variety: "ROSE", grade: "A", quantity_total: 60, unit_cost_cents: 40, sourced_at: "2026-03-04T00:00:00Z", shelf_life_hours: 240 }
              as: FulfillmentOps
              captures: { lot_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${sh0_id}/source"
              payload: {}
              as: FulfillmentOps
            - call: "POST /shipments/${sh0_id}/allocations"
              payload: { lot_id: "${lot_id}", quantity_reserved: 25, hold_start: "2026-03-05T08:00:00Z", hold_end: "2026-03-05T10:00:00Z" }
              as: FulfillmentOps
              captures: { alloc_id: "$.data.id" }
          trigger:
            - call: "GET /stem-lots/${lot_id}"
              as: FulfillmentOps
              captures: { avail_before: "$.data.quantity_available" }
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /stem-lots/${lot_id}"
              as: FulfillmentOps
              captures: { avail_after: "$.data.quantity_available" }
            - call: "GET /shipments/${sh0_id}/allocations"
              as: FulfillmentOps
              captures: { ast: "$.data[0].status" }
          assert:
            - "before release: StemLot.${lot_id}.quantity_available == 35 (60 total - 25 reserved)"
            - "after cancel release: StemLot.${lot_id}.quantity_available == 60 == quantity_total (no stem drift)"
            - "StemAllocation.${alloc_id}.status == RELEASED"

      - name: money_conservation_capture_then_refund
        grounds:
          - calculations.wallet_balance
          - state_machines.Charge.CAPTURED_to_REFUNDED
          - entities.Charge.fields.refunded_cents
          - entities.WalletEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY: a partial refund of 6525 against a CAPTURED 8700 charge sets
          refunded_cents=6525 (status stays CAPTURED), creates a WalletEntry(+6525), so wallet_credit_cents ==
          sum(WalletEntry.amount_cents) == 6525 and captured 8700 - refunded 6525 == 2175 >= 0.
        test_recipe:
          setup:
            - "DELUXE + vase subscription (renewal 8700); its cycle-1 charge CAPTURED for 8700."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c18@x.com", full_name: "C Eighteen" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "DELUXE", vase_addon: true, start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/charges"
              as: BillingAdmin
              captures: { charge1_id: "$.data[0].id" }
            - call: "POST /charges/${charge1_id}/simulate-payment"
              payload: { outcome: "SUCCEEDED" }
              as: BillingAdmin
          trigger:
            - call: "POST /charges/${charge1_id}/refund"
              payload: { amount_cents: 6525 }
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}/charges"
              as: BillingAdmin
              captures: { rc: "$.data[0].refunded_cents", cs: "$.data[0].status" }
            - call: "GET /customers/${cust_id}"
              as: BillingAdmin
              captures: { wallet: "$.data.wallet_credit_cents" }
            - call: "GET /customers/${cust_id}/wallet-entries"
              as: BillingAdmin
              captures: { amt: "$.data[0].amount_cents" }
          assert:
            - "Charge.${charge1_id}.refunded_cents == 6525 and status == CAPTURED (partial refund < amount 8700)"
            - "Customer.${cust_id}.wallet_credit_cents == 6525 == sum(WalletEntry.amount_cents)"
            - "captured 8700 - refunded 6525 == 2175 (>= 0; money conserved, refund never exceeds captured)"
