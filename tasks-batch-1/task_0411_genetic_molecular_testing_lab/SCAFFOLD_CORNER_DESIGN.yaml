  # ===========================================================================
  # SECTION 8 — CROSS-CUTTING COMPLEXITY LAYERS (OCC / cascade ordering /
  #             derived-field reconciliation / dual-variant)
  # ===========================================================================
  - section: cross_cutting
    instances:

      - name: occ_correct_version_on_amend_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-amend-stale-order]
          - state_machines.Report.SIGNED_OUT_to_AMENDED
          - entities.TestOrder.fields.version
        distinguishing_aspect: "Amend with the freshly-read expected_test_order_version succeeds (201), the prior report becomes AMENDED, and TestOrder.version increments by exactly 1."
        test_recipe:
          setup:
            - "SIGNED_OUT SELF_PAY order with one BENIGN variant; order version read just before amend."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "GCC1" }
              as: LabDirector
              captures: { g1: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "CC1", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${g1}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "7001001001", full_name: "Dr CC1" }
              as: LabIntake
              captures: { prov_id: $.data.id }
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-CC1", patient_dob: "1990-01-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { order_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/requisition"
              payload: { clinical_indication: "dx", insurance_payer: "SELF_PAY" }
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/requisition/submit"
              payload: {}
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/specimens"
              payload: { specimen_type: "BLOOD", collected_at: "2026-06-18T00:00:00.000Z", quantity_ng: 80 }
              as: AccessioningTech
              captures: { spec_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/specimens/${spec_id}/accession"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${order_id}/sequencing/start"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${order_id}/variants"
              payload: { gene_id: "${g1}", hgvs: "c.90A>T" }
              as: MolecularTechnologist
              captures: { var_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/variants/${var_id}/classify"
              payload: { classification: "BENIGN" }
              as: MolecularTechnologist
              as_user_id: "tech-1"
            - call: "POST /lab/test-orders/${order_id}/classification/complete"
              payload: {}
              as: MolecularTechnologist
            - call: "POST /lab/test-orders/${order_id}/reports"
              payload: {}
              as: MolecularTechnologist
              captures: { report_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/reports/${report_id}/sign-out"
              payload: {}
              as: LabDirector
              as_user_id: "director-1"
            - call: "GET /lab/test-orders/${order_id}"
              payload: {}
              as: LabDirector
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /lab/test-orders/${order_id}/reports/${report_id}/amend"
              payload: { expected_test_order_version: "${ord_v}" }
              as: LabDirector
              as_user_id: "director-1"
