scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: forecast_weather_normal_vs_actual_weighted_variant_divergence
        grounds:
          - calculations.forecast_load_projection
          - state_machines.LoadForecast.DRAFT_to_PUBLISHED
          - state_machines.LoadForecast.PUBLISHED_to_SUPERSEDED
          - entities.LoadForecast.fields.variant_applied
          - entities.LoadForecast.fields.coincident_demand_kw
        distinguishing_aspect: |
          This instance is dual-variant load forecasting on the LoadForecast entity domain: the
          WEATHER_NORMAL_PROVISIONAL variant consumes heating_degree_hours/cooling_degree_hours
          unchanged while ACTUAL_WEIGHTED_FINAL first blends the actual degree hours at
          ACTUAL_WEIGHT=0.7 and rounds the blend to 2 decimals, so the identical agreement set
          yields coincident_demand_kw 7475.76 versus 7470.47 (delta 5.29 kW).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "NetworkLoop LOOP-A (DUAL, rated_capacity_kw 9000.0) in posture NORMAL."
            - "RateSchedule RS-H (HOSPITAL) and RS-C (COMMERCIAL_OFFICE) exist."
            - "ConnectionAgreement CA1 (HOSPITAL, reserved 4000.0) and CA2 (COMMERCIAL_OFFICE, reserved 2500.0) are both ACTIVE on LOOP-A with service window 2026-01-01 to 2027-01-01, CA1 created before CA2."
            - "Two DRAFT LoadForecasts for LOOP-A on service_date 2026-08-05, both carrying heating_degree_hours 120.0 and cooling_degree_hours 340.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-A", name: "Downtown Loop A", service_mode: "DUAL", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 9000.0 }
              as: SystemController
              captures: { loop_a_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-H", customer_class: "HOSPITAL", fixed_service_charge: 1200.00, demand_charge_per_kw: 14.50, minimum_bill_amount: 5000.00, tiers: [{ load_factor_max: 30.0, energy_rate_per_mwh: 92.00 }, { load_factor_max: 60.0, energy_rate_per_mwh: 78.50 }, { load_factor_max: 100.0, energy_rate_per_mwh: 64.00 }] }
              as: BillingAnalyst
              captures: { rs_h_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 30.0, energy_rate_per_mwh: 88.00 }, { load_factor_max: 65.0, energy_rate_per_mwh: 74.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_a_id}", rate_schedule_id: "${rs_h_id}", customer_name: "City Hospital", customer_class: "HOSPITAL", reserved_capacity_kw: 4000.0, service_mode: "DUAL", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ca1_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${ca1_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_a_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Harbor Tower", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 2500.0, service_mode: "DUAL", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ca2_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${ca2_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/load-forecasts"
              payload: { loop_id: "${loop_a_id}", service_date: "2026-08-05T00:00:00Z", occupancy_profile: "WEEKDAY_FULL", heating_degree_hours: 120.0, cooling_degree_hours: 340.0 }
              as: DispatchOperator
              captures: { f1_id: $.data.id }
            - call: "POST /district-energy/load-forecasts"
              payload: { loop_id: "${loop_a_id}", service_date: "2026-08-05T00:00:00Z", occupancy_profile: "WEEKDAY_FULL", heating_degree_hours: 120.0, cooling_degree_hours: 340.0 }
              as: DispatchOperator
              captures: { f1b_id: $.data.id }
          trigger:
            - call: "POST /district-energy/load-forecasts/${f1_id}/publish"
              payload: { variant: "WEATHER_NORMAL_PROVISIONAL" }
              as: DispatchOperator
            - call: "POST /district-energy/load-forecasts/${f1b_id}/publish"
              payload: { variant: "ACTUAL_WEIGHTED_FINAL", actual_heating_degree_hours: 150.0, actual_cooling_degree_hours: 300.0 }
              as: DispatchOperator
            - call: "GET /district-energy/load-forecasts/${f1_id}"
              payload: {}
              as: DispatchOperator
          assert:
            - "LoadForecast.${f1_id}.variant_applied == WEATHER_NORMAL_PROVISIONAL"
            - "LoadForecast.${f1_id}.coincident_demand_kw == 7475.76"
            - "LoadForecast.${f1_id}.projected_energy_mwh == 111.239"
            - "LoadForecast.${f1_id}.contributing_agreement_count == 2"
            - "LoadForecast.${f1b_id}.variant_applied == ACTUAL_WEIGHTED_FINAL"
            - "LoadForecast.${f1b_id}.coincident_demand_kw == 7470.47"
            - "LoadForecast.${f1b_id}.projected_energy_mwh == 111.161"
            - "LoadForecast.${f1b_id}.contributing_agreement_count == 2"
            - "LoadForecast.${f1_id}.coincident_demand_kw - LoadForecast.${f1b_id}.coincident_demand_kw == 5.29"
            - "LoadForecast.${f1_id}.forecast_state == SUPERSEDED"
            - "LoadForecast.${f1b_id}.forecast_state == PUBLISHED"

      - name: invoice_estimated_vs_actual_true_up_variant_reconciliation
        grounds:
          - calculations.invoice_billing_determinants
          - calculations.agreement_balance_ledger
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_ADJUSTED
          - entities.Invoice.fields.variant_applied
          - entities.ConnectionAgreement.fields.billed_demand_ratchet_kw
        distinguishing_aspect: |
          This instance is dual-variant billing determinant calculation on the Invoice entity
          domain, not load forecasting: ESTIMATED admits the ESTIMATED register read and ignores
          the agreement ratchet (billed_energy_mwh 900.250, total_amount 116819.63), while
          ACTUAL_TRUE_UP restricts the input set to ACTUAL reads and applies
          billed_demand_ratchet_kw as a third demand floor (billed_energy_mwh 420.500,
          total_amount 84836.00), and the ADJUSTED total is reconciled into
          ConnectionAgreement.balance_due.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "NetworkLoop LOOP-A (DUAL, rated 9000.0), RateSchedule RS-H (HOSPITAL), ACTIVE ConnectionAgreement CA1 (HOSPITAL, reserved 4000.0, billed_demand_ratchet_kw 0.0, billing_state CURRENT)."
            - "PipeSegment SEG-A1 on LOOP-A and MeteringPoint MP1 (multiplier 1.0) COMMISSIONED under CA1."
            - "Three MeterReadings on MP1: 2026-06-01 cum 1000.000 peak 2600.0 ACTUAL, 2026-06-15 cum 1420.500 peak 3100.0 ACTUAL, 2026-06-30 cum 1900.250 peak 2900.0 ESTIMATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-A", name: "Downtown Loop A", service_mode: "DUAL", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 9000.0 }
              as: SystemController
              captures: { loop_a_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_a_id}", code: "SEG-A1", length_m: 400.0, diameter_mm: 200, install_year: 2016, insulation_class: "A", buried_depth_m: 1.2 }
              as: NetworkEngineer
              captures: { seg_a1_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-H", customer_class: "HOSPITAL", fixed_service_charge: 1200.00, demand_charge_per_kw: 14.50, minimum_bill_amount: 5000.00, tiers: [{ load_factor_max: 30.0, energy_rate_per_mwh: 92.00 }, { load_factor_max: 60.0, energy_rate_per_mwh: 78.50 }, { load_factor_max: 100.0, energy_rate_per_mwh: 64.00 }] }
              as: BillingAnalyst
              captures: { rs_h_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_a_id}", rate_schedule_id: "${rs_h_id}", customer_name: "City Hospital", customer_class: "HOSPITAL", reserved_capacity_kw: 4000.0, service_mode: "DUAL", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ca1_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${ca1_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/metering-points"
              payload: { agreement_id: "${ca1_id}", segment_id: "${seg_a1_id}", code: "MP1", multiplier: 1.0 }
              as: FieldTechnician
              captures: { mp1_id: $.data.id }
            - call: "POST /district-energy/metering-points/${mp1_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "POST /district-energy/metering-points/${mp1_id}/readings"
              payload: { read_at: "2026-06-01T00:00:00Z", cumulative_energy_mwh: 1000.000, peak_demand_kw: 2600.0, read_type: "ACTUAL" }
              as: FieldTechnician
            - call: "POST /district-energy/metering-points/${mp1_id}/readings"
              payload: { read_at: "2026-06-15T00:00:00Z", cumulative_energy_mwh: 1420.500, peak_demand_kw: 3100.0, read_type: "ACTUAL" }
              as: FieldTechnician
            - call: "POST /district-energy/metering-points/${mp1_id}/readings"
              payload: { read_at: "2026-06-30T00:00:00Z", cumulative_energy_mwh: 1900.250, peak_demand_kw: 2900.0, read_type: "ESTIMATED" }
              as: FieldTechnician
            - call: "GET /district-energy/connection-agreements/${ca1_id}"
              payload: {}
              as: BillingAnalyst
              captures: { ca1_v: $.data.version }
          trigger:
            - call: "POST /district-energy/invoices"
              payload: { agreement_id: "${ca1_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", variant: "ESTIMATED", expected_agreement_version: "${ca1_v}" }
              as: BillingAnalyst
              captures: { inv1_id: $.data.id }
            - call: "POST /district-energy/invoices/${inv1_id}/issue"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/invoices/${inv1_id}/adjust"
              payload: { variant: "ACTUAL_TRUE_UP", adjustment_note: "actual register read landed" }
              as: BillingAnalyst
            - call: "GET /district-energy/connection-agreements/${ca1_id}"
              payload: {}
              as: BillingAnalyst
          assert:
            - "POST /district-energy/invoices (variant ESTIMATED) response: Invoice.${inv1_id}.billed_energy_mwh == 900.250"
            - "POST /district-energy/invoices (variant ESTIMATED) response: Invoice.${inv1_id}.billed_demand_kw == 3100.00"
            - "POST /district-energy/invoices (variant ESTIMATED) response: Invoice.${inv1_id}.load_factor_pct == 40.33"
            - "POST /district-energy/invoices (variant ESTIMATED) response: Invoice.${inv1_id}.energy_charge == 70669.63"
            - "POST /district-energy/invoices (variant ESTIMATED) response: Invoice.${inv1_id}.total_amount == 116819.63"
            - "POST /district-energy/invoices/${inv1_id}/issue response: Invoice.${inv1_id}.invoice_state == ISSUED"
            - "ConnectionAgreement.${ca1_id}.billed_demand_ratchet_kw == 3100.00"
            - "Invoice.${inv1_id}.variant_applied == ACTUAL_TRUE_UP"
            - "Invoice.${inv1_id}.billed_energy_mwh == 420.500"
            - "Invoice.${inv1_id}.billed_demand_kw == 3100.00"
            - "Invoice.${inv1_id}.load_factor_pct == 18.84"
            - "Invoice.${inv1_id}.energy_charge == 38686.00"
            - "Invoice.${inv1_id}.demand_charge == 44950.00"
            - "Invoice.${inv1_id}.fixed_charge == 1200.00"
            - "Invoice.${inv1_id}.total_amount == 84836.00"
            - "Invoice.${inv1_id}.minimum_bill_applied == false"
            - "Invoice.${inv1_id}.invoice_state == ADJUSTED"
            - "ConnectionAgreement.${ca1_id}.balance_due == 84836.00"
            - "ConnectionAgreement.${ca1_id}.billing_state == IN_ARREARS"

  - rule_id: combinatorial_formula
    instances:
      - name: merit_order_nested_min_max_with_storage_nameplate_sizing
        grounds:
          - calculations.merit_order_dispatch
          - calculations.plan_reliability_metrics
          - state_machines.DispatchPlan.DRAFT_to_DRAFT
          - entities.ProductionAsset.fields.min_stable_output_kw
          - entities.ProductionAsset.fields.storage_capacity_kwh
          - entities.DispatchOrder.fields.merit_rank
        distinguishing_aspect: |
          Mode (a) of Rule 2: the effective-capacity expression is a nested min/max whose branch is
          selected by asset_type and availability_state (THERMAL_STORAGE uses
          min(rated_capacity_kw, storage_capacity_kwh / 4), DERATED uses derated_capacity_kw,
          otherwise rated_capacity_kw), then block_kw = min(effective_kw, remaining_kw) is gated by
          a strict min_stable_output_kw comparison, so four assets on LOOP-C produce exactly three
          DispatchOrders with the 2000 kW oil boiler receiving none despite having spare capacity.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "NetworkLoop LOOP-C (DUAL, rated_capacity_kw 8000.0) in posture NORMAL."
            - "One ACTIVE ConnectionAgreement CA3 (COMMERCIAL_OFFICE, reserved 3000.0) on LOOP-C."
            - "PUBLISHED LoadForecast F3 for LOOP-C on 2026-08-05 with coincident_demand_kw 2527.20."
            - "Four AVAILABLE ProductionAssets on LOOP-C: C_STO (THERMAL_STORAGE rated 1000.0, storage 4000.0, soc 4000.0, cost 6.00), C_CHP (CHP rated 1200.0, min_stable 400.0, cost 40.00, NATURAL_GAS), C_BIO (BIOMASS_BOILER rated 1500.0, min_stable 300.0, cost 52.00, BIOMASS), C_OIL (BOILER rated 2000.0, min_stable 200.0, cost 90.00, FUEL_OIL)."
            - "A DRAFT DispatchPlan on LOOP-C bound to F3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-C", name: "Campus Loop C", service_mode: "DUAL", design_supply_temp_c: 90.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 8000.0 }
              as: SystemController
              captures: { loop_c_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 30.0, energy_rate_per_mwh: 88.00 }, { load_factor_max: 65.0, energy_rate_per_mwh: 74.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_c_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Campus Facilities", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 3000.0, service_mode: "DUAL", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ca3_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${ca3_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/fuel-supply-contracts"
              payload: { supplier_code: "FCG-C", fuel_type: "NATURAL_GAS", contracted_energy_mwh_per_year: 40000.0, price_per_mwh: 30.00, delivery_firmness: "FIRM" }
              as: SystemController
              captures: { fcg_c_id: $.data.id }
            - call: "POST /district-energy/fuel-supply-contracts"
              payload: { supplier_code: "FCB-C", fuel_type: "BIOMASS", contracted_energy_mwh_per_year: 20000.0, price_per_mwh: 42.00, delivery_firmness: "INTERRUPTIBLE" }
              as: SystemController
              captures: { fcb_c_id: $.data.id }
            - call: "POST /district-energy/fuel-supply-contracts"
              payload: { supplier_code: "FCO-C", fuel_type: "FUEL_OIL", contracted_energy_mwh_per_year: 8000.0, price_per_mwh: 80.00, delivery_firmness: "FIRM" }
              as: SystemController
              captures: { fco_c_id: $.data.id }
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_c_id}", code: "C_STO", asset_type: "THERMAL_STORAGE", rated_capacity_kw: 1000.0, marginal_cost_per_mwh: 6.00, emission_factor_kg_per_mwh: 0.0, storage_capacity_kwh: 4000.0, state_of_charge_kwh: 4000.0 }
              as: SystemController
              captures: { c_sto_id: $.data.id }
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_c_id}", code: "C_CHP", asset_type: "CHP", rated_capacity_kw: 1200.0, marginal_cost_per_mwh: 40.00, emission_factor_kg_per_mwh: 205.0, fuel_contract_id: "${fcg_c_id}", derated_capacity_kw: 600.0, min_stable_output_kw: 400.0 }
              as: SystemController
              captures: { c_chp_id: $.data.id }
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_c_id}", code: "C_BIO", asset_type: "BIOMASS_BOILER", rated_capacity_kw: 1500.0, marginal_cost_per_mwh: 52.00, emission_factor_kg_per_mwh: 28.0, fuel_contract_id: "${fcb_c_id}", derated_capacity_kw: 750.0, min_stable_output_kw: 300.0 }
              as: SystemController
              captures: { c_bio_id: $.data.id }
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_c_id}", code: "C_OIL", asset_type: "BOILER", rated_capacity_kw: 2000.0, marginal_cost_per_mwh: 90.00, emission_factor_kg_per_mwh: 260.0, fuel_contract_id: "${fco_c_id}", derated_capacity_kw: 1000.0, min_stable_output_kw: 200.0 }
              as: SystemController
              captures: { c_oil_id: $.data.id }
            - call: "POST /district-energy/load-forecasts"
              payload: { loop_id: "${loop_c_id}", service_date: "2026-08-05T00:00:00Z", occupancy_profile: "WEEKDAY_FULL", heating_degree_hours: 0.0, cooling_degree_hours: 0.0 }
              as: DispatchOperator
              captures: { f3_id: $.data.id }
            - call: "POST /district-energy/load-forecasts/${f3_id}/publish"
              payload: { variant: "WEATHER_NORMAL_PROVISIONAL" }
              as: DispatchOperator
            - call: "GET /district-energy/network-loops/${loop_c_id}"
              payload: {}
              as: DispatchOperator
              captures: { loop_c_v: $.data.version }
            - call: "POST /district-energy/dispatch-plans"
              payload: { loop_id: "${loop_c_id}", forecast_id: "${f3_id}", expected_loop_version: "${loop_c_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { plan_c_id: $.data.id }
          trigger:
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/optimize"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "GET /district-energy/dispatch-orders"
              payload: { plan_id: "${plan_c_id}" }
              as: DispatchOperator
          assert:
            - "LoadForecast.${f3_id}.coincident_demand_kw == 2527.20"
            - "GET /district-energy/dispatch-orders?plan_id=${plan_c_id} returns exactly 3 DispatchOrder rows"
            - "DispatchOrder for plan ${plan_c_id} and asset ${c_sto_id}: merit_rank == 1, allocated_kw == 1000.00, block_energy_mwh == 4.000, discharged_kwh == 4000.00, order_cost == 24.00, order_emissions_kg == 0.00"
            - "DispatchOrder for plan ${plan_c_id} and asset ${c_chp_id}: merit_rank == 2, allocated_kw == 1200.00, block_energy_mwh == 28.800, discharged_kwh == 0.00, order_cost == 1152.00, order_emissions_kg == 5904.00"
            - "DispatchOrder for plan ${plan_c_id} and asset ${c_bio_id}: merit_rank == 3, allocated_kw == 327.20, block_energy_mwh == 7.853, discharged_kwh == 0.00, order_cost == 408.36, order_emissions_kg == 219.88"
            - "no DispatchOrder exists for plan ${plan_c_id} and asset ${c_oil_id}"
            - "DispatchPlan.${plan_c_id}.allocated_capacity_kw == 2527.20"
            - "DispatchPlan.${plan_c_id}.unserved_demand_kw == 0.00"
            - "DispatchPlan.${plan_c_id}.total_dispatch_cost == 1584.36"
            - "DispatchPlan.${plan_c_id}.total_emissions_kg == 6123.88"
            - "DispatchPlan.${plan_c_id}.reserve_margin_pct == 46.41"
            - "DispatchPlan.${plan_c_id}.fuel_diversity_hhi == 0.5489"
            - "DispatchPlan.${plan_c_id}.plan_state == DRAFT"
            - "ProductionAsset.${c_sto_id}.state_of_charge_kwh == 4000.0"

      - name: per_agreement_contribution_rounded_before_summation_in_forecast
        grounds:
          - calculations.forecast_load_projection
          - state_machines.LoadForecast.DRAFT_to_PUBLISHED
          - entities.ConnectionAgreement.fields.reserved_capacity_kw
          - entities.LoadForecast.fields.coincident_demand_kw
        distinguishing_aspect: |
          Mode (b) of Rule 2 — pinned rounding order, not a nested min/max: the three
          RESIDENTIAL_MULTIFAMILY contributions 450.86 + 908.42 + 1365.98 sum to 2725.26 and yield
          coincident_demand_kw 2943.28, whereas summing the unrounded products to 2725.2720 and
          rounding once yields 2725.27 and coincident_demand_kw 2943.29, so the observed value
          falsifies the sum-then-round order by one cent-equivalent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "NetworkLoop LOOP-B (HEATING, rated_capacity_kw 6000.0) in posture NORMAL."
            - "RateSchedule RS-R (RESIDENTIAL_MULTIFAMILY)."
            - "Three ACTIVE ConnectionAgreements on LOOP-B created in this order: CB1 reserved 1010.0, CB2 reserved 2035.0, CB3 reserved 3060.0, all RESIDENTIAL_MULTIFAMILY and HEATING, service window 2026-01-01 to 2027-01-01."
            - "A DRAFT LoadForecast for LOOP-B on 2026-08-08 with occupancy_profile WEEKEND_REDUCED and both degree-hour inputs 0.0, so the weather adder is exactly 0.00 and only the per-agreement rounding order can move the result."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
