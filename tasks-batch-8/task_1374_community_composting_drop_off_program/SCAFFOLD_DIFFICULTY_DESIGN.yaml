        grounds:
          - state_machines.Site.ONBOARDING_to_OPERATIONAL
          - entities.Site.fields.host_agreement_id
          - errors[ERR_SITE_NO_ACTIVE_AGREEMENT]
        distinguishing_aspect: |
          Entity pair Site → SiteHostAgreement: Site commission requires a
          DIFFERENT entity (agreement) in ACTIVE state; commissioning with the
          agreement still DRAFT fails ERR_SITE_NO_ACTIVE_AGREEMENT.
        test_recipe:
          setup:
            - "Program created; site ONBOARDING; agreement DRAFT; material created"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P13", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
