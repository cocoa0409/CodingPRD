            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 470000, expected_license_version: "${v3}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
              captures: { v4: $.data.license_version_after }
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "PRODUCER", proposed_fee_cents: 400000, expected_license_version: "${v4}" }
              as: ClearanceSupervisor
              captures: { v5: $.data.license_version_after }
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 440000, expected_license_version: "${v5}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
              captures: { v6: $.data.license_version_after }
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "PRODUCER", proposed_fee_cents: 420000, expected_license_version: "${v6}" }
