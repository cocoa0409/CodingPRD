  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_unit_occupancy_closed_interval_rejected
        grounds:
          - validations[priority=9]
          - entities.Lease.fields.start_date
          - entities.Lease.fields.end_date
          - endpoints["POST /leases"]
        distinguishing_aspect: |
          Resource = Unit; interval semantics = CLOSED [start_date, end_date] with NO buffer. A new lease
          whose closed occupancy interval intersects an existing lease on the same unit is rejected
          ERR_UNIT_OCCUPANCY_OVERLAP. Two leases sharing a boundary day DO collide (closed-closed).
        test_recipe:
          setup:
            - "Unit U1 with an existing ACTIVE lease L1 occupying [2026-04-01, open). A second lease starting 2026-05-01 (inside the open-ended occupancy) overlaps."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F15", state_code: "TX", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
