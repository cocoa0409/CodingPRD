          - entities.ChargingSession.fields.billing_status
        distinguishing_aspect: |
          Entity pair SettlementLineItem->ChargingSession (distinct from Session->Stall):
          a line item may only be added for a session whose billing_status == RATED; an
          UNBILLED session (started but never stopped) is rejected ERR_SESSION_NOT_SETTLEABLE.
        test_recipe:
          setup:
            - "A roaming session that has been started (charging_status PREPARING, billing_status UNBILLED) but NOT stopped; an OPEN batch for the driver's eMSP."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
