            - { call: "POST /pilot-training/training-events/${iom}/complete", payload: { score: 90 }, as: TrainingCoordinator, captures: { st: $.data.status } }
          assert:
            - "first milestone complete returns 422 error_id == ERR_PHASE_PREREQUISITE_NOT_MET (9.5 < 10 hours)"
            - "after the 0.5h top-up (exactly 10.0 >= 10), milestone completes: TrainingEvent.${iom}.status == COMPLETED"
            - "Enrollment.${en}.current_phase == DONE"

