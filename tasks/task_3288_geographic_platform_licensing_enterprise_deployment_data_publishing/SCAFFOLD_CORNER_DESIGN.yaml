      - name: every_error_triggerable_spot_check
        claim_type: violation_to_error
        grounds: [errors.ERR_STALE_EVIDENCE, errors.ERR_INVALID_EV_DECISION, errors.ERR_EV_NOT_RENEWAL_REQUIRED]
        distinguishing_aspect: "Three EV error codes not covered elsewhere: resubmit on a non-RENEWAL_REQUIRED EV (ERR_EV_NOT_RENEWAL_REQUIRED), resubmit with identical evidence (ERR_STALE_EVIDENCE), decide without rationale (ERR_INVALID_EV_DECISION)."
        test_recipe:
          setup: ["Base chain; EV submitted by ada."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
