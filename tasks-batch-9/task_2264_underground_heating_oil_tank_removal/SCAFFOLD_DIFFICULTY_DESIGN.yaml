          Branching fork on Permit, a third entity: the DENIED branch mutates only the permit row and leaves
          the project at DISCLOSED, the ISSUED branch advances the project to PERMITTED and stamps
          notice_effective_at / expires_at, and the REVOKED branch aborts the project's live work order,
          writes off its billing dimension and adds PERMIT_REVOKED to nfa_blockers — three disjoint
          side-effect sets from one endpoint.
