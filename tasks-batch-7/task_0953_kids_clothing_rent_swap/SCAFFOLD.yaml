  # ---------------- LostShipmentClaim ----------------
  - method: POST
    path: "/kidswear/lost-shipment-claims"
    description: "File a claim against a LOST shipment inside the filing window. Claims are NEVER auto-created; this endpoint is the only producer of a LostShipmentClaim."
    roles: [Member, LogisticsCoordinator]
    code: 201
    input: ["shipment_id"]
    output: LostShipmentClaim
    side_effects: ["LostShipmentClaim created with status OPENED"]
    gates: [G1_AUTH, G2_ROLE, G3_EXISTENCE, G4_STANDING, G7_STATE, G8_WINDOW]
  - method: GET
    path: "/kidswear/lost-shipment-claims"
    description: "List lost-shipment claims, optionally filtered by shipment or member."
    roles: [LogisticsCoordinator, Member, PlatformAdmin, BillingAgent]
    code: 200
    input: ["shipment_id?", "member_id?", "status?", "limit?", "offset?"]
    output: LostShipmentClaim[]
    side_effects: []
    gates: [G1_AUTH, G2_ROLE]
  - method: GET
    path: "/kidswear/lost-shipment-claims/{claim_id}"
    description: "Read a lost-shipment claim including its liability split."
    roles: [LogisticsCoordinator, Member, PlatformAdmin, BillingAgent]
    code: 200
    input: []
    output: LostShipmentClaim
    side_effects: []
    gates: [G1_AUTH, G2_ROLE, G3_EXISTENCE]
  - method: POST
    path: "/kidswear/lost-shipment-claims/{claim_id}/investigate"
    description: "Begin investigating a claim and resolve its liability variant."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: LostShipmentClaim
    side_effects: ["LostShipmentClaim OPENED -> INVESTIGATING", "variant resolved from Shipment.ever_scanned", "assessed_value_cents, member_liability_pct and member_liability_cents computed", "LostShipmentClaim.version increments by 1"]
    gates: [G1_AUTH, G2_ROLE, G3_EXISTENCE, G7_STATE]
  - method: POST
    path: "/kidswear/lost-shipment-claims/{claim_id}/request-info"
    description: "Ask the member for more information."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: LostShipmentClaim
    side_effects: ["LostShipmentClaim INVESTIGATING -> AWAITING_MEMBER_INFO", "LostShipmentClaim.version increments by 1"]
    gates: [G1_AUTH, G2_ROLE, G3_EXISTENCE, G7_STATE]
  - method: POST
    path: "/kidswear/lost-shipment-claims/{claim_id}/provide-info"
    description: "Member supplies the requested information, returning the claim to investigation."
    roles: [Member]
    code: 200
    input: ["info_note"]
    output: LostShipmentClaim
    side_effects: ["LostShipmentClaim AWAITING_MEMBER_INFO -> INVESTIGATING", "LostShipmentClaim.version increments by 1"]
    gates: [G1_AUTH, G2_ROLE, G3_EXISTENCE, G7_STATE]
  - method: POST
    path: "/kidswear/lost-shipment-claims/{claim_id}/approve"
    description: "Approve a claim and finalise the member's liability share."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: LostShipmentClaim
    side_effects: ["LostShipmentClaim INVESTIGATING -> APPROVED", "member_liability_cents finalised", "LostShipmentClaim.version increments by 1"]
    gates: [G1_AUTH, G2_ROLE, G3_EXISTENCE, G7_STATE]
  - method: POST
    path: "/kidswear/lost-shipment-claims/{claim_id}/deny"
    description: "Deny a claim; the member stays liable for the full assessed value."
    roles: [LogisticsCoordinator]
    code: 200
    input: ["denial_reason"]
    output: LostShipmentClaim
    side_effects: ["LostShipmentClaim INVESTIGATING -> DENIED", "the LOST_LIABILITY charge is not reduced", "LostShipmentClaim.version increments by 1"]
    gates: [G1_AUTH, G2_ROLE, G3_EXISTENCE, G7_STATE]
  - method: POST
    path: "/kidswear/lost-shipment-claims/{claim_id}/settle"
    description: "Settle an approved claim, reduce the liability charge and write off the lost units."
    roles: [BillingAgent]
    code: 200
    input: []
    output: LostShipmentClaim
    side_effects: ["LostShipmentClaim APPROVED -> SETTLED", "the LOST_LIABILITY ChargeLedgerEntry amount is reduced to member_liability_cents", "every LOST_IN_TRANSIT GarmentUnit -> RETIRED with retired_reason LOST_WRITE_OFF", "Member.outstanding_balance_cents recomputed", "Member may transition DELINQUENT -> ACTIVE", "LostShipmentClaim.version increments by 1"]
    gates: [G1_AUTH, G2_ROLE, G3_EXISTENCE, G7_STATE, G11_MONEY, G12_CONSERVATION]

# ===========================================================================
# §1.6 ERROR CODE CATALOG (90 codes)
# ===========================================================================
errors:

  # --- request shape (evaluated inside G1/G2 before the ladder proper) ---
  - id: ERR_VALIDATION
    http: 422
    condition: "A required body field is missing, is null, has the wrong JSON type, or violates a declared numeric bound. This is the DEFAULT route for every field-shape failure."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "A supplied value is outside the declared member set of one of EXACTLY these fields, and no others: Plan.tier, Plan.proration_basis, Plan.late_fee_mode, Member.child_size_code, GarmentStyle.brand_tier, GarmentStyle.size_code, GarmentStyle.season, GarmentStyle.demand_band, Shipment.direction, ShippingLabel.direction, ConditionAssessment.pipeline, ConditionAssessment.grade, ProcessingJob.post_repair_grade, TradeInItem.declared_brand_tier, TradeInItem.declared_size_code, the `disposition` body field, the `quote_variant` body field, Capsule.season, GarmentUnit.retired_reason on the retire endpoint, SwapRequest.rejection_reason, PauseRequest.denial_reason. Every OTHER field with a constrained value set routes to ERR_VALIDATION."
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "A member is created with an email that already exists."
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "A garment style is created with a sku that already exists."

  # --- G1_AUTH (rungs 1-2) ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is missing or empty."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the eight declared roles."

  # --- G2_ROLE (rungs 3-5) ---
  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "The acting role is not listed for the endpoint."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource owned by a different Member."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The confirming X-User-ID equals ConditionAssessment.graded_by_user_id."

  # --- G3_EXISTENCE (rungs 6-13) ---
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "A member id in the path or body does not resolve."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "A plan id in the path or body does not resolve."
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "A cycle, box or box-item id in the path does not resolve."
  - id: ERR_STYLE_NOT_FOUND
    http: 404
    condition: "A garment style or garment unit id in the path or body does not resolve."
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "A shipment or shipping-label id in the path or body does not resolve."
  - id: ERR_TRADE_IN_NOT_FOUND
    http: 404
    condition: "A trade-in submission or trade-in item id in the path does not resolve."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "A condition-assessment or processing-job id in the path does not resolve."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A capsule, capsule-allocation, buy-out order, pause request, lost-shipment claim, credit entry or charge entry id in the path does not resolve."
  - id: ERR_REFERENCE_NOT_OWNED
    http: 422
    condition: "An id inside return_box_item_ids or requested_style_ids does not resolve, or resolves to a resource belonging to another member."

  # --- G4_STANDING (rungs 14-16) ---
  - id: ERR_MEMBER_CANCELLED
    http: 409
    condition: "A member-scoped write is attempted on a CANCELLED member."
  - id: ERR_MEMBER_NOT_ACTIVATED
    http: 409
    condition: "A circulation or intake write is attempted on a PENDING member."
  - id: ERR_MEMBER_DELINQUENT
    http: 409
    condition: "Allocation, swap creation, buy-out quoting, capsule allocation or trade-in label issuance is attempted on a DELINQUENT member."
  - id: ERR_PLAN_RETIRED
    http: 409
    condition: "A member is created against or activated on a Plan with status RETIRED."

  # --- G5_PAUSE (rungs 17-18) ---
  - id: ERR_MEMBER_PAUSED
    http: 409
    condition: "A Pipeline R circulation write is attempted while the member is PAUSED."
  - id: ERR_INTAKE_BLOCKED_WHILE_PAUSED
    http: 409
    condition: "A Pipeline T intake write is attempted while the member is PAUSED."

  # --- G6_OCC (rungs 19-21) ---
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version does not equal Cycle.version on swap creation."
  - id: ERR_STALE_BOX_ITEM_VERSION
    http: 412
    condition: "expected_box_item_version does not equal BoxItem.version on buy-out quoting. Because G6_OCC precedes G7_STATE, this fires even when the item is already BOUGHT_OUT."
  - id: ERR_STALE_MEMBER_VERSION
    http: 412
    condition: "expected_member_version does not equal Member.version on credit application."

  # --- G7_STATE (rungs 22-32) ---
  - id: ERR_CYCLE_INVALID_STATE
    http: 409
    condition: "The cycle is not in a declared from-state for the requested transition."
  - id: ERR_CYCLE_NOT_OPEN
    http: 409
    condition: "Swap creation, swap submission or box allocation is attempted while Cycle.status is not OPEN."
  - id: ERR_BOX_INVALID_STATE
    http: 409
    condition: "The box is not in a declared from-state for the requested transition."
  - id: ERR_BOX_NOT_FULL
    http: 409
    condition: "Packing is attempted while the count of ALLOCATED box items is below Box.slot_capacity."
  - id: ERR_BOX_ITEM_INVALID_FULFILLMENT_STATE
    http: 409
    condition: "The box item's fulfillment_status is not a declared from-state for the requested fulfillment-axis transition."
  - id: ERR_BOX_ITEM_ALREADY_SETTLED
    http: 409
    condition: "Buy-out quoting or damage settlement is attempted on a box item whose settlement_status is not OPEN."
  - id: ERR_UNIT_INVALID_STATE
    http: 409
    condition: "The garment unit is not in a declared from-state for the requested circulation transition."
  - id: ERR_SHIPMENT_INVALID_STATE
    http: 409
    condition: "The shipment is not in a declared from-state for the requested transition."
  - id: ERR_SHIPMENT_DIRECTION_MISMATCH
    http: 409
    condition: "A shipment's direction does not match the operation, e.g. return-to-sender on a shipment whose direction is not REJECT_RETURN, or box shipping under a non-OUTBOUND label."
  - id: ERR_LABEL_INVALID_STATE
    http: 409
    condition: "The shipping label is not in a declared from-state for the requested transition."
  - id: ERR_LABEL_DIRECTION_MISMATCH
    http: 409
    condition: "A label's direction does not match the shipment or box operation it is supplied for."
  - id: ERR_ASSESSMENT_INVALID_STATE
    http: 409
    condition: "The condition assessment or processing job is not in a declared from-state for the requested transition."
  - id: ERR_ASSESSMENT_TARGET_MISMATCH
    http: 422
    condition: "An assessment supplies both unit_id and trade_in_item_id, supplies neither, or supplies the one that contradicts its pipeline."
  - id: ERR_PIPELINE_MISMATCH
    http: 409
    condition: "A RENTAL assessment is confirmed against a trade-in item, or a TRADE_IN assessment is confirmed against a rental unit."
  - id: ERR_TRADE_IN_INVALID_STATE
    http: 409
    condition: "The trade-in submission or item is not in a declared from-state on the addressed axis."
  - id: ERR_TRADE_IN_ITEM_NOT_REJECTED
    http: 409
    condition: "A disposition election is attempted on an item whose disposition_status is not AWAITING_ELECTION."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "A member, capsule, capsule allocation, buy-out order, pause request or lost-shipment claim is not in a declared from-state for the requested transition."
  - id: ERR_CLAIM_SHIPMENT_NOT_LOST
    http: 409
    condition: "A lost-shipment claim is filed against a shipment whose status is not LOST."
  - id: ERR_BUYOUT_ALREADY_EXISTS
    http: 409
    condition: "A second buy-out quote is minted for a box item that already has a QUOTED, ACCEPTED, PAID or COMPLETED order."
  - id: ERR_RETURN_ITEM_NOT_RECEIVED
    http: 409
    condition: "Swap fulfilment is attempted while at least one return_box_item_id is not yet RECEIVED."
  - id: ERR_CAPSULE_NOT_OPEN
    http: 409
    condition: "A capsule allocation is attempted while Capsule.status is not OPEN."

  # --- G8_WINDOW (rungs 33-43) ---
  - id: ERR_SWAP_WINDOW_CLOSED
    http: 409
    condition: "A swap is created or submitted strictly after Cycle.swap_by_at. Submission exactly AT swap_by_at is accepted."
  - id: ERR_CYCLE_NOT_STARTED
    http: 409
    condition: "A cycle is opened before Cycle.start_at."
  - id: ERR_SWAP_WINDOW_STILL_OPEN
    http: 409
    condition: "The swap window is closed at or before Cycle.swap_by_at."
  - id: ERR_GRACE_NOT_EXPIRED
    http: 409
    condition: "Late assessment into GRACE is attempted at or before Cycle.grace_ends_at. Assessment exactly AT grace_ends_at accrues zero late days."
  - id: ERR_LABEL_EXPIRED
    http: 409
    condition: "A departure, box shipment or return start is attempted strictly after the label's expires_at."
  - id: ERR_CAPSULE_EMBARGOED
    http: 409
    condition: "A capsule box item is swapped or bought out strictly before BoxItem.embargo_until."
  - id: ERR_CAPSULE_WINDOW_CLOSED
    http: 409
    condition: "A capsule allocation is attempted before release_at or at/after close_at."
  - id: ERR_CAPSULE_ELIGIBILITY_NOT_MET
    http: 409
    condition: "A capsule allocation is attempted by a member with fewer than CAPSULE_ELIGIBILITY_MIN_COMPLETED_CYCLES completed cycles."
  - id: ERR_BUYOUT_QUOTE_EXPIRED
    http: 409
    condition: "A buy-out quote is accepted at or after quote_expires_at."
  - id: ERR_ELECTION_DEADLINE_PASSED
    http: 409
    condition: "A disposition election is attempted strictly after election_deadline_at."
  - id: ERR_ELECTION_NOT_DUE
    http: 409
    condition: "The default disposition is applied at or before election_deadline_at."
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 409
    condition: "A lost-shipment claim is filed strictly after shipped_at + LOST_CLAIM_FILING_WINDOW_DAYS."
  - id: ERR_SIZE_UP_TOO_SOON
    http: 409
    condition: "A size-up is attempted fewer than SIZE_UP_MIN_DAYS_BETWEEN_EVENTS days after size_effective_at."
  - id: ERR_SIZE_UP_INVALID_STEP
    http: 422
    condition: "A size-up moves down the ladder, moves zero rungs, or moves more than SIZE_UP_MAX_STEPS_PER_EVENT rungs."
  - id: ERR_CAPSULE_EMBARGO_NOT_REACHED
    http: 409
    condition: "The capsule embargo is lifted before Capsule.embargo_until."
  - id: ERR_CAPSULE_CLOSE_NOT_DUE
    http: 409
    condition: "A capsule is closed before Capsule.close_at."
  - id: ERR_LABEL_NOT_EXPIRED
    http: 409
    condition: "A label is expired at or before its expires_at."

  # --- G9_ENTITLEMENT (rungs 44-52) ---
  - id: ERR_BOX_SLOTS_EXHAUSTED
    http: 409
    condition: "Allocation would push occupied slots above Box.slot_capacity."
  - id: ERR_SWAP_ENTITLEMENT_EXHAUSTED
    http: 409
    condition: "No swap entitlement remains for the cycle."
  - id: ERR_SWAP_SHAPE_INVALID
    http: 422
    condition: "return_box_item_ids and requested_style_ids differ in length, either is empty, or either exceeds Plan.slots_per_box."
  - id: ERR_CAPSULE_QUOTA_EXCEEDED
    http: 409
    condition: "A capsule allocation would exceed min(Capsule.quota_per_member, Plan.capsule_quota_per_wave)."
  - id: ERR_PAUSE_PERIOD_CAP_EXCEEDED
    http: 409
    condition: "A pause activation would push pause days in the trailing PAUSE_PERIOD_LENGTH_DAYS window above PAUSE_MAX_DAYS_PER_PERIOD."
  - id: ERR_PAUSE_LIFETIME_CAP_EXCEEDED
    http: 409
    condition: "A pause activation would push lifetime pause days above PAUSE_MAX_DAYS_LIFETIME."
  - id: ERR_PAUSE_DAYS_OUT_OF_RANGE
    http: 422
    condition: "days_requested is below PAUSE_MIN_DAYS or above PAUSE_MAX_DAYS_PER_PERIOD."
  - id: ERR_SHIPMENT_IN_TRANSIT_BLOCKS_PAUSE
    http: 409
    condition: "A pause activation is attempted while any shipment of the member has status IN_TRANSIT."
  - id: ERR_UNIT_PAST_DUE_BLOCKS_PAUSE
    http: 409
    condition: "A pause activation is attempted while any box item of the member has days_late greater than 0."
  - id: ERR_LABEL_REISSUE_CAP_REACHED
    http: 409
    condition: "A reissue is attempted on a label whose reissue_count already equals LABEL_REISSUE_CAP."
  - id: ERR_RETRY_CAP_REACHED
    http: 409
    condition: "A regrade, dispute or rework start is attempted at or above its declared cap."
  - id: ERR_TRADE_IN_ITEM_COUNT_INVALID
    http: 422
    condition: "declared_item_count is outside the declared bounds, more items are added than declared, or a label is issued while the item count does not match."

  # --- G10_STOCK (rungs 53-57) ---
  - id: ERR_SIZE_INCOMPATIBLE
    http: 409
    condition: "The unit's size ordinal minus the member's size ordinal lies outside the closed interval [0, SIZE_COMPAT_STEPS_ABOVE_MAX]."
  - id: ERR_NO_ELIGIBLE_STOCK
    http: 409
    condition: "The selector's eligibility filter yields an empty candidate pool for a requested style."
  - id: ERR_UNIT_RETIRE_GRADED
    http: 409
    condition: "A unit whose current_grade is RETIRE or whose retirement_eligible is true is allocated, swapped in or bought out."
  - id: ERR_CAPSULE_ALLOCATION_MISSING
    http: 409
    condition: "A capsule unit is allocated without an ACTIVE CapsuleAllocation for that capsule, or while the capsule is not OPEN or EMBARGO_LIFTED."
  - id: ERR_ABSORB_STYLE_MISMATCH
    http: 409
    condition: "Absorption supplies a style that is DISCONTINUED or whose size_code differs from the item's declared_size_code."
  - id: ERR_STYLE_DISCONTINUED
    http: 409
    condition: "A unit is acquired against a GarmentStyle with status DISCONTINUED."
  - id: ERR_REPAIR_UPLIFT_EXCEEDED
    http: 422
    condition: "A PASSED repair job supplies a post_repair_grade whose uplift exceeds REPAIR_UPLIFT_MAX_STEPS ordinals, or supplies a post_repair_grade on a non-REPAIR route."

  # --- G11_MONEY (rungs 58-63) ---
  - id: ERR_CREDIT_EXPIRED
    http: 409
    condition: "A credit application targets an entry whose expires_at is at or before the logical clock, or whose status is APPLIED, EXPIRED or REVOKED."
  - id: ERR_INSUFFICIENT_CREDIT
    http: 409
    condition: "A credit application is attempted while Member.credit_balance_cents is 0."
  - id: ERR_CHARGE_NOT_OPEN
    http: 409
    condition: "A credit application or waiver targets a charge whose status is SETTLED or WAIVED."
  - id: ERR_BUYOUT_BELOW_FLOOR
    http: 422
    condition: "A buy-out is quoted for a unit whose style retail_price_cents is below BUYOUT_MIN_PRICE_CENTS, so the floor would exceed the garment's retail value."
  - id: ERR_WAIVER_NOT_AVAILABLE
    http: 409
    condition: "An assessment confirmation would draw on the damage waiver while the cycle's PROTECTION_FEE charge has status WAIVED, so the member paid nothing for the protection the waiver is priced against."
  - id: ERR_CYCLE_CLOSE_BLOCKED_BY_DELINQUENCY
    http: 409
    condition: "A cycle close to CLOSED is attempted while the owning member is DELINQUENT."

  # --- G12_CONSERVATION (rungs 64-68) ---
  - id: ERR_UNIT_CONSERVATION_VIOLATION
    http: 409
    condition: "A write would leave GarmentStyle.units_ever_acquired unequal to the sum of units across the eight unit states. DEFENSIVE INVARIANT GUARD: every ordinary API sequence is refused by an earlier gate, so this code is expected to be unreachable through the public surface and exists to make the invariant explicit and auditable."
  - id: ERR_SLOT_CONSERVATION_VIOLATION
    http: 409
    condition: "A write would leave Box.slot_capacity unequal to slots_free plus occupied plus permanently consumed slots. DEFENSIVE INVARIANT GUARD: every ordinary API sequence is refused by an earlier gate, so this code is expected to be unreachable through the public surface and exists to make the invariant explicit and auditable."
  - id: ERR_CREDIT_CONSERVATION_VIOLATION
    http: 409
    condition: "A write would leave granted credit unequal to remaining plus applied plus expired-or-revoked credit. DEFENSIVE INVARIANT GUARD: every ordinary API sequence is refused by an earlier gate, so this code is expected to be unreachable through the public surface and exists to make the invariant explicit and auditable."
  - id: ERR_SWAP_CONSERVATION_VIOLATION
    http: 409
    condition: "A fulfilled swap would produce a non-zero slot_delta or break the cycle's swap-entitlement identity. DEFENSIVE INVARIANT GUARD: every ordinary API sequence is refused by an earlier gate, so this code is expected to be unreachable through the public surface and exists to make the invariant explicit and auditable."
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "A pause window overlaps another ACTIVE or ENDED pause of the member under half-open semantics, or a capsule window overlaps another capsule of the same season under closed semantics (touching endpoints DO collide)."

# ===========================================================================
# §1.7 RBAC MATRIX (8 roles; segregation_of_duties)
# ===========================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the platform: plans, member lifecycle, cycle scheduling, default dispositions, logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /kidswear/plans"
      - "PATCH /kidswear/plans/{plan_id}"
      - "POST /kidswear/members"
      - "POST /kidswear/members/{member_id}/activate"
      - "POST /kidswear/cycles/{cycle_id}/open"
      - "POST /kidswear/cycles/{cycle_id}/close-swap-window"
      - "POST /kidswear/trade-in-items/{trade_in_item_id}/apply-default-disposition"
      - "POST /kidswear/pause-requests/{pause_request_id}/deny"
      - "POST /kidswear/_clock/set_current_utc"
    shared_operations:
      - "POST /kidswear/cycles"
      - "POST /kidswear/cycles/{cycle_id}/close"
      - "POST /kidswear/members/{member_id}/size-up"
      - "POST /kidswear/members/{member_id}/cancel"
      - "POST /kidswear/boxes"
      - "POST /kidswear/pause-requests/{pause_request_id}/activate"
      - "POST /kidswear/pause-requests/{pause_request_id}/end"
      - "all GET reads"

  - name: Member
    description: "The subscribing household. Owns its cycles, boxes, swaps, trade-ins, pauses and claims."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /kidswear/cycles/{cycle_id}/swap-requests"
      - "POST /kidswear/swap-requests/{swap_request_id}/submit"
      - "POST /kidswear/box-items/{box_item_id}/start-return"
      - "POST /kidswear/box-items/{box_item_id}/buy-out"
      - "POST /kidswear/buy-out-orders/{buy_out_order_id}/accept"
      - "POST /kidswear/buy-out-orders/{buy_out_order_id}/cancel"
      - "POST /kidswear/trade-in-submissions"
      - "POST /kidswear/trade-in-submissions/{submission_id}/items"
      - "POST /kidswear/trade-in-items/{trade_in_item_id}/elect-disposition"
      - "POST /kidswear/capsules/{capsule_id}/allocations"
      - "POST /kidswear/members/{member_id}/pause-requests"
      - "POST /kidswear/pause-requests/{pause_request_id}/cancel"
      - "POST /kidswear/lost-shipment-claims/{claim_id}/provide-info"
    shared_operations:
      - "POST /kidswear/members/{member_id}/size-up"
      - "POST /kidswear/members/{member_id}/protection"
      - "POST /kidswear/members/{member_id}/cancel"
      - "POST /kidswear/members/{member_id}/credit-applications"
      - "POST /kidswear/condition-assessments/{assessment_id}/dispute"
      - "POST /kidswear/pause-requests/{pause_request_id}/end"
      - "POST /kidswear/lost-shipment-claims"
      - "GET reads scoped to the member's own resources"

  - name: WarehouseOperator
    description: "Physical intake and outbound handling: box building, packing, receiving, swap approval and fulfilment."
    identity: "opaque"
    exclusive_operations:
      - "POST /kidswear/boxes/{box_id}/allocate"
      - "POST /kidswear/boxes/{box_id}/pack"
      - "POST /kidswear/swap-requests/{swap_request_id}/approve"
      - "POST /kidswear/swap-requests/{swap_request_id}/reject"
      - "POST /kidswear/swap-requests/{swap_request_id}/fulfill"
      - "POST /kidswear/shipments/{shipment_id}/receive"
    shared_operations:
      - "POST /kidswear/boxes"
      - "all GET reads on stock, boxes, shipments and trade-ins"

  - name: GradingTechnician
    description: "Applies the shared condition rubric to rental units and trade-in items. May never confirm its own grade."
    identity: "opaque"
    exclusive_operations:
      - "POST /kidswear/condition-assessments"
      - "POST /kidswear/condition-assessments/{assessment_id}/submit"
      - "POST /kidswear/condition-assessments/{assessment_id}/regrade"
    shared_operations:
      - "GET reads on assessments, units, styles and trade-in items"

  - name: CleaningVendor
    description: "Executes the routed cleaning and repair jobs and reports pass, fail or rework."
    identity: "opaque"
    exclusive_operations:
      - "POST /kidswear/processing-jobs/{job_id}/start"
      - "POST /kidswear/processing-jobs/{job_id}/pass"
      - "POST /kidswear/processing-jobs/{job_id}/fail"
    shared_operations:
      - "GET reads on processing jobs, units and assessments"

  - name: LogisticsCoordinator
    description: "Mints, voids, expires and reissues labels; creates, departs, receives-as-lost and returns shipments; runs lost-shipment claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /kidswear/shipping-labels"
      - "POST /kidswear/shipping-labels/{label_id}/void"
      - "POST /kidswear/shipping-labels/{label_id}/expire"
      - "POST /kidswear/shipping-labels/{label_id}/reissue"
      - "POST /kidswear/shipments"
      - "POST /kidswear/shipments/{shipment_id}/depart"
      - "POST /kidswear/shipments/{shipment_id}/mark-lost"
      - "POST /kidswear/shipments/{shipment_id}/return-to-sender"
      - "POST /kidswear/boxes/{box_id}/ship"
      - "POST /kidswear/trade-in-submissions/{submission_id}/issue-label"
      - "POST /kidswear/lost-shipment-claims/{claim_id}/investigate"
      - "POST /kidswear/lost-shipment-claims/{claim_id}/request-info"
      - "POST /kidswear/lost-shipment-claims/{claim_id}/approve"
      - "POST /kidswear/lost-shipment-claims/{claim_id}/deny"
    shared_operations:
      - "POST /kidswear/lost-shipment-claims"
      - "GET reads on labels, shipments, boxes and claims"

  - name: BillingAgent
    description: "Runs the money side: cycle charges, late assessment, credit and charge ledgers, buy-out payment, pause activation, claim settlement."
    identity: "opaque"
    exclusive_operations:
      - "POST /kidswear/cycles/{cycle_id}/assess-late"
      - "POST /kidswear/trade-in-submissions/{submission_id}/finalize"
      - "POST /kidswear/credit-entries/{credit_entry_id}/expire"
      - "POST /kidswear/credit-entries/{credit_entry_id}/revoke"
      - "POST /kidswear/charge-entries/{charge_entry_id}/waive"
      - "POST /kidswear/buy-out-orders/{buy_out_order_id}/pay"
      - "POST /kidswear/buy-out-orders/{buy_out_order_id}/expire"
      - "POST /kidswear/lost-shipment-claims/{claim_id}/settle"
    shared_operations:
      - "POST /kidswear/cycles"
      - "POST /kidswear/cycles/{cycle_id}/close"
      - "POST /kidswear/members/{member_id}/protection"
      - "POST /kidswear/members/{member_id}/credit-applications"
      - "POST /kidswear/pause-requests/{pause_request_id}/activate"
      - "GET reads on ledgers, cycles, members and buy-outs"

  - name: MerchandisePlanner
    description: "Owns the catalog, stock acquisition, capsule waves, absorption of trade-ins, grade confirmation and scrapping. Confirms grades it did not author."
    identity: "opaque"
    exclusive_operations:
      - "POST /kidswear/garment-styles"
      - "PATCH /kidswear/garment-styles/{style_id}"
      - "POST /kidswear/garment-units"
      - "POST /kidswear/garment-units/{unit_id}/retire"
      - "POST /kidswear/condition-assessments/{assessment_id}/confirm"
      - "POST /kidswear/processing-jobs/{job_id}/scrap"
      - "POST /kidswear/trade-in-items/{trade_in_item_id}/absorb"
      - "POST /kidswear/capsules"
      - "POST /kidswear/capsules/{capsule_id}/announce"
      - "POST /kidswear/capsules/{capsule_id}/open"
      - "POST /kidswear/capsules/{capsule_id}/lift-embargo"
      - "POST /kidswear/capsules/{capsule_id}/close"
      - "POST /kidswear/capsule-allocations/{allocation_id}/release"
    shared_operations:
      - "POST /kidswear/condition-assessments/{assessment_id}/dispute"
      - "GET reads on catalog, stock, capsules, assessments and trade-in items"

