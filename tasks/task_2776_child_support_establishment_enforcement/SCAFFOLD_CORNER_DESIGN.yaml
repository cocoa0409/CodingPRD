              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_a}", noncustodial_party_id: "${ncp_a}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
