# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0761_meal_prep_subscription — 9 rule_ids x 2 instances = 18 instances
# Common fixture literals:
#   Zone WEST: base_shipping_fee_cents=1000, cold_pack_fee_cents=500, requires_cold_pack=true, order_lead_days=4, cutoff_time_utc="18:00"
#   Plan PRO: meals_per_week=12, price_per_meal_cents=1099   |   Plan STARTER: meals_per_week=6, price_per_meal_cents=1299
#   Constants: FREE_SHIP_MIN_MEALS=12, REFEREE_DISCOUNT_PCT=0.15, REFERRAL_BASE_CENTS=2000, PREMIUM_BONUS_CENTS=1500, PREMIUM_MIN_MEALS=12, LINE_BUFFER_MINUTES=60
#   Delivery 2026-03-16 -> cutoff_at 2026-03-12T18:00:00Z ; Delivery 2026-03-23 -> cutoff_at 2026-03-19T18:00:00Z
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: box_refund_pre_vs_post_ship_on_box_domain
        grounds:
          - calculations.box_refund
          - state_machines.Box.LOCKED_to_CANCELLED
          - state_machines.Box.SHIPPED_to_CANCELLED
          - entities.Box.fields.refund_destination
        distinguishing_aspect: |
          box_refund is a dual-variant calc on the Box entity domain: the SAME charged box (total 13688c)
          refunds 13688c to ORIGINAL_PAYMENT when cancelled pre-ship (LOCKED) but only the meal value 13188c
          to WALLET_CREDIT when cancelled post-ship (SHIPPED) — a different entity domain than referral_reward (Customer/Referral).
        test_recipe:
          setup:
            - "One PRO customer with wallet 0; two boxes for delivery 2026-03-16 (box_a) and 2026-03-23 (box_b), each with 12 meals, each locked and charged to total 13688c; box_b additionally shipped."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /meals"
              payload: { meal_code: "M1", name: "Grilled Chicken", protein_g: 40, carb_g: 30, fat_g: 10, calories: 400, allergens: [], dietary_tags: ["HIGH_PROTEIN"] }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run_a_id: $.data.id }
            - call: "POST /production-runs/${run_a_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-23", line_code: "L2", window_start: "2026-03-21T06:00:00Z", window_end: "2026-03-21T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run_b_id: $.data.id }
            - call: "POST /production-runs/${run_b_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { box_a_id: $.data.id }
            - call: "POST /boxes/${box_a_id}/items"
              payload: { meal_id: "${m1_id}", quantity: 12 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-23" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { box_b_id: $.data.id }
            - call: "POST /boxes/${box_b_id}/items"
              payload: { meal_id: "${m1_id}", quantity: 12 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-19T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /boxes/${box_a_id}/lock"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_payments/simulate"
              payload: { box_id: "${box_a_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /boxes/${box_b_id}/lock"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_payments/simulate"
              payload: { box_id: "${box_b_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /boxes/${box_b_id}/ship"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /boxes/${box_a_id}/cancel"
              payload: {}
              as: PlatformAdmin
            - call: "POST /boxes/${box_b_id}/cancel"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Box.${box_a_id}.refund_cents == 13688"
            - "Box.${box_a_id}.refund_destination == ORIGINAL_PAYMENT"
            - "Box.${box_b_id}.refund_cents == 13188"
            - "Box.${box_b_id}.refund_destination == WALLET_CREDIT"

      - name: referral_reward_standard_vs_premium_on_customer_domain
        grounds:
          - calculations.referral_reward
          - state_machines.Referral.PENDING_to_REWARDED
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: |
          referral_reward is a dual-variant calc on the Referral/Customer domain: a PRO referee (meals_per_week 12 >= PREMIUM_MIN)
          yields premium_bonus reward 3500c while a STARTER referee (6 < 12) yields standard 2000c — a different entity domain than box_refund (Box).
        test_recipe:
          setup:
            - "One referrer R; two referees signed up with R's code: referee P on PRO, referee S on STARTER; each ships their first box for delivery 2026-03-16."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "STARTER", name: "Starter", meals_per_week: 6, price_per_meal_cents: 1299 }
              as: PlatformAdmin
              captures: { starter_plan_id: $.data.id }
            - call: "POST /meals"
              payload: { meal_code: "M1", name: "Grilled Chicken", protein_g: 40, carb_g: 30, fat_g: 10, calories: 400, allergens: [], dietary_tags: ["HIGH_PROTEIN"] }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "r@x.com", full_name: "Ref R", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { r_id: $.data.id, ref_code: $.data.referral_code }
            - call: "POST /customers"
              payload: { email: "p@x.com", full_name: "Referee P", shipping_zone_id: "${zone_id}", referred_by_code: "${ref_code}" }
              as: Anonymous
              captures: { p_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "s@x.com", full_name: "Referee S", shipping_zone_id: "${zone_id}", referred_by_code: "${ref_code}" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${p_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${p_id}"
              captures: { sub_p_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${s_id}", plan_id: "${starter_plan_id}" }
              as: Customer
              as_user_id: "${s_id}"
              captures: { sub_s_id: $.data.id }
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_p_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${p_id}"
              captures: { box_p_id: $.data.id }
            - call: "POST /boxes/${box_p_id}/items"
              payload: { meal_id: "${m1_id}", quantity: 12 }
              as: Customer
              as_user_id: "${p_id}"
            - call: "POST /subscriptions/${sub_s_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${s_id}"
              captures: { box_s_id: $.data.id }
            - call: "POST /boxes/${box_s_id}/items"
              payload: { meal_id: "${m1_id}", quantity: 6 }
              as: Customer
              as_user_id: "${s_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-12T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /boxes/${box_p_id}/lock"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_payments/simulate"
              payload: { box_id: "${box_p_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /boxes/${box_s_id}/lock"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_payments/simulate"
              payload: { box_id: "${box_s_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /boxes/${box_p_id}/ship"
              payload: {}
              as: PlatformAdmin
            - call: "POST /boxes/${box_s_id}/ship"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Referral(referee_customer_id=${p_id}).reward_cents == 3500"
            - "Referral(referee_customer_id=${s_id}).reward_cents == 2000"
            - "Customer.${r_id}.wallet_credit_cents == 5500"

  - rule_id: combinatorial_formula
    instances:
      - name: box_charge_nested_min_credit_and_shipping_branch_mode_a
        grounds:
          - calculations.box_charge
          - entities.Box.fields.total_charged_cents
          - entities.Box.fields.credit_applied_cents
        distinguishing_aspect: |
          box_charge is combinatorial mode (a): >=3 inputs (meals_count=12, zone fees, wallet=2000) with a conditional
          shipping branch (12 >= FREE_SHIP_MIN_MEALS -> shipping 0) and a nested min for credit (min(gross 13688, wallet 2000)=2000),
          producing total_charged 11688 — a different combinatorial mode than the per-line rounding-order instance.
        test_recipe:
          setup:
            - "PRO customer seeded with 2000c wallet credit; one box for 2026-03-16 with 12 meals; locked and charged."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /meals"
              payload: { meal_code: "M1", name: "Grilled Chicken", protein_g: 40, carb_g: 30, fat_g: 10, calories: 400, allergens: [], dietary_tags: [] }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/credits"
              payload: { amount_cents: 2000, reason: "SWAP_CREDIT" }
              as: PlatformAdmin
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { box_id: $.data.id }
            - call: "POST /boxes/${box_id}/items"
              payload: { meal_id: "${m1_id}", quantity: 12 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-12T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /boxes/${box_id}/lock"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /_payments/simulate"
              payload: { box_id: "${box_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          assert:
            - "Box.${box_id}.subtotal_cents == 13188"
            - "Box.${box_id}.shipping_fee_cents == 0"
            - "Box.${box_id}.cold_pack_fee_cents == 500"
            - "Box.${box_id}.credit_applied_cents == 2000"
            - "Box.${box_id}.total_charged_cents == 11688"
            - "Customer.${cust_id}.wallet_credit_cents == 0"

      - name: referee_first_box_discount_round_per_line_then_sum_mode_b
        grounds:
          - calculations.referee_first_box_discount
          - entities.Box.fields.discount_cents
        distinguishing_aspect: |
          referee_first_box_discount is combinatorial mode (b): rounding order is pinned to round-per-line-then-sum.
          Two lines of 3297c (1099c*3) -> 3297*0.15=494.55 -> 495c each -> sum 990c; sum-then-round would give round(6594*0.15)=989c.
          The pinned order yields discount_cents 990 (and total 7104), a different combinatorial mode than box_charge's nested-min.
        test_recipe:
          setup:
            - "Referee customer (referred_by_code set) on PRO; first box for 2026-03-16 with 6 meals (quantity 1 x 6 lines); locked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /meals"
              payload: { meal_code: "M1", name: "Meal 1", protein_g: 40, carb_g: 30, fat_g: 10, calories: 400, allergens: [], dietary_tags: [] }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /meals"
              payload: { meal_code: "M2", name: "Meal 2", protein_g: 35, carb_g: 40, fat_g: 12, calories: 450, allergens: [], dietary_tags: [] }
              as: PlatformAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "r@x.com", full_name: "Ref R", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { r_id: $.data.id, ref_code: $.data.referral_code }
            - call: "POST /customers"
              payload: { email: "e@x.com", full_name: "Referee E", shipping_zone_id: "${zone_id}", referred_by_code: "${ref_code}" }
              as: Anonymous
              captures: { e_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${e_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${e_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run1_id: $.data.id }
            - call: "POST /production-runs/${run1_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /production-runs"
              payload: { meal_id: "${m2_id}", delivery_date: "2026-03-16", line_code: "L2", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run2_id: $.data.id }
            - call: "POST /production-runs/${run2_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${e_id}"
              captures: { box_id: $.data.id }
            - call: "POST /boxes/${box_id}/items"
              payload: { meal_id: "${m1_id}", quantity: 3 }
              as: Customer
              as_user_id: "${e_id}"
            - call: "POST /boxes/${box_id}/items"
              payload: { meal_id: "${m2_id}", quantity: 3 }
              as: Customer
              as_user_id: "${e_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-12T18:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /boxes/${box_id}/lock"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Box.${box_id}.subtotal_cents == 6594"
            - "Box.${box_id}.discount_cents == 990"
            - "Box.${box_id}.shipping_fee_cents == 1000"
            - "Box.${box_id}.total_charged_cents == 7104"

  - rule_id: non_linear_state_machine
    instances:
      - name: box_parallel_fulfillment_and_billing_dimensions
        grounds:
          - state_machines.Box.OPEN_to_LOCKED
          - state_machines.Box.PENDING_to_CHARGE_FAILED
          - entities.Box.fields.billing_status
        distinguishing_aspect: |
          Box carries two INDEPENDENT state dimensions: after lock the fulfillment_status is LOCKED while the billing_status
          moves PENDING->CHARGE_FAILED on a declined charge — fulfillment stays LOCKED, proving the two axes evolve independently
          on the same row (parallel-dimension non-linearity), a different entity than the cyclic ProductionRun instance.
        test_recipe:
          setup:
            - "PRO customer, one box for 2026-03-16 with 12 meals, locked; charge then declined."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /meals"
              payload: { meal_code: "M1", name: "Meal 1", protein_g: 40, carb_g: 30, fat_g: 10, calories: 400, allergens: [], dietary_tags: [] }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { box_id: $.data.id }
            - call: "POST /boxes/${box_id}/items"
              payload: { meal_id: "${m1_id}", quantity: 12 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-12T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /boxes/${box_id}/lock"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /_payments/simulate"
              payload: { box_id: "${box_id}", outcome: "DECLINED" }
              as: PlatformAdmin
          assert:
            - "Box.${box_id}.fulfillment_status == LOCKED"
            - "Box.${box_id}.billing_status == CHARGE_FAILED"

      - name: production_run_cyclic_sold_out_to_available
        grounds:
          - state_machines.ProductionRun.AVAILABLE_to_SOLD_OUT
          - state_machines.ProductionRun.SOLD_OUT_to_AVAILABLE
          - entities.ProductionRun.fields.par_remaining
        distinguishing_aspect: |
          ProductionRun cycles AVAILABLE->SOLD_OUT->AVAILABLE: selecting the last 5 servings drives it SOLD_OUT,
