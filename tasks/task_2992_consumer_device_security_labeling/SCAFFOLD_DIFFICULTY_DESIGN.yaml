            - call: "POST /labeling/label-grants/${grant_pub_id}/registry-publication"
              payload: { publication_decision: "PUBLISHED", publication_note: "Disclosure page restored." }
              as: ConformityReviewer
              as_user_id: "reviewer-2"
            - call: "POST /labeling/display-authorizations"
              payload: { retailer_id: "${retailer_id}", label_grant_id: "${grant_pub_id}", channel: "ONLINE", display_from: "2026-08-10T00:00:00Z", display_until: "2026-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${retailer_id}"
          assert:
            - "probe 1 (grant PENDING_REGISTRY / DRAFT) -> ERR_GRANT_NOT_PUBLISHED (409)"
            - "probe 2 (grant ACTIVE / WITHHELD) -> ERR_GRANT_NOT_PUBLISHED (409), proving grant_status == ACTIVE alone is not sufficient"
            - "probe 3 (grant ACTIVE / PUBLISHED) returns 201 with RetailerDisplayAuthorization.status == AUTHORIZED"
            - "Retailer.${retailer_id}.active_display_count == 1 and participation_tier == BASELINE after probe 3"
            - "exactly one RetailerDisplayAuthorization row exists for (${retailer_id}, ${grant_pub_id}, ONLINE): the two rejected probes persisted nothing"
            - "the identical payload was used for all three probes, so only the grant's state explains the different outcomes"

  # =========================================================================
  # RULE 8 — resource/temporal overlap with DIFFERENT interval semantics
  #   instance 1: TestLab bench windows, HALF-OPEN [start, end), aggregate
  #               capacity 2 plus an aggregate hours ceiling
  #   instance 2: Retailer display windows, CLOSED [from, until] widened
  #               backwards by an inclusive 7-day changeover buffer
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: lab_bench_aggregate_capacity_halfopen_overlap
        resource_entity: TestLab
        interval_semantics: "half-open [window_start, window_end); adjacency at a shared instant does NOT intersect; capacity is an aggregate count of concurrent reserving engagements (SCHEDULED or IN_PROGRESS)"
        grounds:
          - validations.priority_60_ERR_LAB_BENCH_CAPACITY_CONFLICT
          - validations.priority_61_ERR_LAB_BENCH_HOURS_EXCEEDED
          - calculations.lab_bench_hour_ledger
          - entities.TestLab.fields.concurrent_bench_capacity
        distinguishing_aspect: |
          Two independent limits guard the same resource: a half-open interval overlap COUNT against
          concurrent_bench_capacity 2, and an aggregate bench-hour ceiling. A third window that touches
          both existing windows is rejected for capacity, while a window that starts exactly when
          another ends is accepted — the adjacency case an inclusive-interval implementation rejects —
          and a later non-overlapping window is still rejected for hours.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "TIER_2 third-party-test tier, ELIGIBLE HOME_ROUTER category, five-criterion catalogue."
            - "Cascade Security Labs: ACCREDITED, total_bench_hours 240, concurrent_bench_capacity 2, reserved 0 / available 240."
            - "One SMALL manufacturer with an ELIGIBLE router product carrying one UNDER_REVIEW third-party-route assessment (several test windows may be booked against one assessment)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_2", required_route: "THIRD_PARTY_TEST", label_validity_days: 730, min_overall_score: 80.80, unverified_weight_factor: 0.60, issuance_base_fee_cents: 145000, max_deficiency_rounds: 1 }
              as: ProgramAdministrator
              captures: { tier2_id: $.data.id }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "HOME_ROUTER", display_name: "Home Router", eligibility_status: "ELIGIBLE", program_tier_id: "${tier2_id}", min_support_period_days: 1095 }
              as: ProgramAdministrator
