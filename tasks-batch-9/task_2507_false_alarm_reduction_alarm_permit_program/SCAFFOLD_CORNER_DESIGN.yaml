        distinguishing_aspect: "A correction must actually change something: resubmitting the identical 3 / 0 / 0 counts on the VARIANCE_FLAGGED August report is refused with 409, so correction_count cannot be burned on a no-op and the VARIANCE_FLAGGED -> CORRECTED -> SUBMITTED cycle does not run."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; Guardian's August report (3 dispatches reported, 0 on record) has been reviewed FLAG_VARIANCE and sits in VARIANCE_FLAGGED with correction_count 0."
