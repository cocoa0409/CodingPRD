              payload: { petition_id: "${pet_id}", circulator_id: "${circ_id}", effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z", assigned_county_codes: ["ALPHA"], expected_circulator_version: "${circ_v2}" }
