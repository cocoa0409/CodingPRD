            - call: "POST /tprm/due-diligence-packages/${p_acap}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_acap}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_acap}"
              payload: {}
              as: RiskOfficer
              captures: { e_acap_v: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_acap}/approve"
              payload: { expected_engagement_version: "${e_acap_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_acap}/contracts"
              payload: { contract_reference: "ACAP-C1", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: true, has_sla_terms: true, has_exit_plan_section: false, sla_uptime_pct: 99.5, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_acap: $.data.id }
            - call: "GET /tprm/engagements/${e_acap}"
              payload: {}
              as: RiskOfficer
              captures: { e_acap_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_acap}/execute"
              payload: { expected_engagement_version: "${e_acap_v2}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_acap}/audits"
              payload: { scope: "SECURITY" }
              as: InternalAuditor
              captures: { au_a: $.data.id }
            - call: "POST /tprm/audits/${au_a}/begin-fieldwork"
              payload: {}
              as: InternalAuditor
          trigger:
            - call: "POST /tprm/engagements/${e_acap}/audits"
              payload: { scope: "FINANCIAL" }
              as: InternalAuditor
              captures: { err7: $.data.error_id }
          assert:
            - "error_id == ERR_AUDIT_ALREADY_ACTIVE  # capacity-1 semaphore"

  # =========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: incident_open_close_reopen_close_restores_composite_risk_score
        grounds:
          - calculations.composite_risk_score
          - state_machines.Incident.transitions
        distinguishing_aspect: |
          Conserved quantity = vendor.composite_risk_score. Forward action:
          file + triage SEV_3 incident (score rises by 8 * tier_mult).
          Compensating action: close via full remediation cycle. Then forward
          again: reopen (score rises again). Then compensate: close again.
          Invariant: after each close, score returns to its pre-incident
          baseline (0 here). Test asserts score == 0 after first close, score
          == 8 after reopen, score == 0 after second close.
        test_recipe:
          setup:
            - "Vendor ACTIVE, tier TIER_3 (mult 1.0); engagement ACTIVE. No overdue cycles, no failed BCPs → baseline score 0."
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
