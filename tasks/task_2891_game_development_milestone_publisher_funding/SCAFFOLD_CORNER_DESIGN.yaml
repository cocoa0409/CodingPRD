            - "after trigger call 2: committed_cents == 9000000 and available_funding_cents == 3000000"
            - "after trigger call 3: committed_cents == 12000000 and available_funding_cents == 0, funding_pool_cents == 12000000, uplift_funded_cents == 0"
            - "trigger call 4 -> HTTP 200 with status == ACTIVE (priority 27 satisfied only once the schedule exhausts the advance)"
            - "GET /development-agreements/${agreement_id}/recoupment-summary reports funding_pool_cents == 12000000 and advance_disbursed_cents == 0"

      - name: corner_cyclic_shape_milestone_returns_to_under_review
        claim_type: cyclic
        excluded_because:
          difficulty_instance: milestone_cure_cycle_returns_to_under_review_and_prices_the_cure_penalty
          rationale: "That §1.8 non_linear_state_machine instance drives UNDER_REVIEW -> CURE_PENDING -> UNDER_REVIEW -> ACCEPTED on one milestone, asserts cure_count is never decremented and prices the resulting cure penalty into the payment, which is exactly the cyclic-shape claim (loop back plus loop-count respected)."

      - name: corner_guarded_transition_requires_predecessor_acceptance
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: beta_build_blocked_until_predecessor_milestone_is_accepted
          rationale: "That §1.8 cross_entity_state_dependency instance is the guarded-transition claim in full: the same BETA build call is refused with ERR_DEPENDENCY_NOT_ACCEPTED while the predecessor is UNDER_REVIEW and succeeds unchanged once the predecessor reaches ACCEPTED."

      - name: corner_cascade_down_from_agreement_to_children
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: termination_cascade_cancels_milestones_withholds_payment_and_voids_contractor_invoice
          rationale: "That §1.8 transitive_cascade instance verifies the four-step downward cascade end-to-end (agreement -> milestones -> payments and engagements -> invoices), including that terminal children are left untouched, so a separate cascade-down corner would duplicate it."

      - name: corner_cross_entity_side_effect_on_acceptance
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: acceptance_cascade_unlocks_dependent_milestone_then_restricted_posture_resuspends_its_engagement
          rationale: "That §1.8 transitive_cascade instance asserts the cross-entity chain of one acceptance (milestone -> payment, dependent milestone, funding posture, engagements) with the ordering that makes step 2 promote an engagement that step 4 then suspends."

      - name: corner_compensation_reverses_suspension_side_effects
        claim_type: compensation
        excluded_because:
          difficulty_instance: suspend_then_reinstate_restores_payment_withholding_posture_and_engagement_exactly
          rationale: "That §1.8 compensating_invariant instance is the compensation claim: it reconciles withheld_payment_cents, funding_posture and every engagement status before and after the suspend/reinstate pair and asserts payment_obligation_conservation with no drift."

