            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03 }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v1: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v1}" }, as: TenantRep, as_user_id: rep-001, captures: { loi_v2: $.data.version } }
          trigger:
            - { call: "POST /api/lois/${loi_id}/counter", payload: { expected_loi_version: "${loi_v1}", base_rate_psf: 7.50, ti_allowance_psf: 12.00, free_rent_months: 6, escalation_pct: 0.03 }, as: LeasingManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/lois/${loi_id}/counter", payload: { expected_loi_version: "${loi_v2}", base_rate_psf: 7.50, ti_allowance_psf: 12.00, free_rent_months: 6, escalation_pct: 0.03 }, as: LeasingManager, captures: { ok_status: $.data.status } }
          assert:
            - "stale counter (expected 1 vs current 2): err == ERR_STALE_VERSION, HTTP 412"
            - "fresh counter (expected 2): ok_status == COUNTERED and negotiation_round == 2"

  - section: endpoints
    instances:
      - name: match_eval_persists_nothing
        claim_type: computed_read
        grounds: [endpoints.POST_/api/match-evaluations, entities.Site.fields.version]
        distinguishing_aspect: "The market-survey match read is side-effect free: evaluating a match twice leaves Site.version == 1 and TenantRequirement.version == 1 (no hidden writes)."
        test_recipe:
          setup: ["REQ_A and SITE_A exist"]
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
          trigger:
            - { call: "POST /api/match-evaluations", payload: { requirement_id: "${req_id}", site_id: "${site_id}" }, as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/match-evaluations", payload: { requirement_id: "${req_id}", site_id: "${site_id}" }, as: LeasingManager }
            - { call: "GET /api/sites/${site_id}", as: LeasingManager, captures: { site_v: $.data.version } }
            - { call: "GET /api/tenant-requirements/${req_id}", as: TenantRep, as_user_id: rep-001, captures: { req_v: $.data.version } }
          assert:
            - "site_v == 1 and req_v == 1 (two evaluations, zero mutations)"

      - name: accept_side_effect_execution
        claim_type: side_effect_execution
        grounds: ["endpoints.POST_/api/lois/{id}/accept", state_machines.Site.LISTED_to_RESERVED]
        excluded_because:
          difficulty_instance: accept_reservation_rejects_competing_lois
          rationale: "Accept's side effects (site reservation + competing-LOI auto-reject) are asserted end-to-end in the named §1.8 instance."

      - name: execute_side_effect_execution
        claim_type: side_effect_execution
        grounds: ["endpoints.POST_/api/lois/{id}/execute"]
        excluded_because:
          difficulty_instance: delivery_completion_three_hop
          rationale: "Execution-spawned plan and invoices are exercised by the named §1.8 cascade instance; see also execute_side_effects_immediately_visible for the read-back shape."

