              as: Official
              as_user_id: "${off}"
            - call: "POST /availabilities"
              payload: { official_id: "${off}", window_start_utc: "2026-06-20T19:30:00Z", window_end_utc: "2026-06-20T19:45:00Z", kind: "BLACKOUT" }
              as: Official
              as_user_id: "${off}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1, duration_minutes: 120 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "ASSISTANT" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
          trigger:
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${off}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_OUTSIDE_AVAILABILITY"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: decline_then_reoffer_accept_conserves_crew_count
        grounds:
          - state_machines.Assignment.OFFERED_to_DECLINED
          - state_machines.CrewSlot.VACANT_to_OFFERED
          - state_machines.Assignment.OFFERED_to_ACCEPTED
          - entities.Game.fields.crew_filled_count
        distinguishing_aspect: "Conserved quantity = filled crew capacity: forward (offer A) + compensating (A declines, releasing the slot) leaves crew_filled_count at 0; a subsequent B accept brings it to exactly required_crew_size with no drift. Invariant: crew_filled_count == count(CrewSlot in FILLED)."
        test_recipe:
          setup:
            - "League OPEN; 1-slot OPEN game; A offered then declines (slot back to VACANT); B offered then accepts."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "A", rank: "ROOKIE", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { oa: $.data.id }
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "B", rank: "ROOKIE", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { ob: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${oa}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${oa}"
            - call: "POST /availabilities"
              payload: { official_id: "${ob}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${ob}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "ASSISTANT" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${oa}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { a1: $.data.id }
            - call: "POST /assignments/${a1}/decline"
              payload: {}
              as: Official
              as_user_id: "${oa}"
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv2: $.data.version }
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${ob}", expected_game_version: "${gv2}" }
              as: Assignor
              captures: { a2: $.data.id }
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv3: $.data.version }
          trigger:
            - call: "POST /assignments/${a2}/accept"
              payload: { expected_game_version: "${gv3}" }
              as: Official
              as_user_id: "${ob}"
          assert:
            - "Game.${gm}.crew_filled_count == 1"
            - "Game.${gm}.status == STAFFED"
            - "CrewSlot.${slot}.status == FILLED"

      - name: settle_conserves_pay_ledger_equals_sum_of_final_pay
        grounds:
          - state_machines.Game.LOCKED_to_COMPLETED
          - calculations.finalized_settlement_pay
          - entities.SeasonLedger.fields.total_pay_accrued_cents
          - entities.Game.fields.settlement_total_cents
        distinguishing_aspect: "Conserved quantity = money (distinct from crew count): settlement debits each completed assignment's final_pay_cents and credits the ledger by exactly the same sum — SeasonLedger.total_pay_accrued_cents == Game.settlement_total_cents == sum(final_pay_cents) == 15000, no drift."
        test_recipe:
          setup:
            - "League OPEN, base_game_fee_cents=10000, mileage_rate=0; SENIOR official dist 0; 1-slot game accepted, locked, settled after start."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "HOCKEY", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", rank: "SENIOR", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${off}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${off}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "REFEREE" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${off}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { asg: $.data.id }
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv2: $.data.version }
            - call: "POST /assignments/${asg}/accept"
              payload: { expected_game_version: "${gv2}" }
              as: Official
              as_user_id: "${off}"
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv3: $.data.version }
            - call: "POST /games/${gm}/lock"
              payload: { expected_game_version: "${gv3}" }
              as: Assignor
              captures: { gv4: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T19:00:00Z" }
              as: LeagueAdmin
          trigger:
            - call: "POST /games/${gm}/settle"
              payload: { expected_game_version: "${gv4}" }
              as: Assignor
          assert:
            - "Assignment.${asg}.final_pay_cents == 15000"
            - "Game.${gm}.settlement_total_cents == 15000"
            - "SeasonLedger for (${lg},${off}).total_pay_accrued_cents == 15000"

      - name: appeal_upheld_conserves_penalty_points_ledger
        grounds:
          - state_machines.Assignment.OFFERED_to_DECLINED
          - state_machines.PenaltyAppeal.PENDING_to_UPHELD
          - entities.SeasonLedger.fields.penalty_points
          - entities.PenaltyAppeal.fields.reversed_points
        distinguishing_aspect: "Conserved quantity = penalty points (distinct from crew count and money): a late decline assesses 8 points (ledger 8); upholding the appeal reverses exactly 8, returning SeasonLedger.penalty_points to 0 and reliability_score to 100 — no drift. Invariant: ledger.penalty_points == sum(penalty_assessed_points over terminal assignments) - sum(reversed_points over UPHELD appeals)."
        test_recipe:
          setup:
            - "League OPEN; ROOKIE official, dist 0, wide availability."
            - "Clock 2026-06-20T16:00:00Z; regular game starts 2026-06-20T18:00:00Z (2h => late tier); slot offered then declined (penalty 8); official files an appeal."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", rank: "ROOKIE", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${off}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${off}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T16:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "ASSISTANT" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${off}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { asg: $.data.id }
            - call: "POST /assignments/${asg}/decline"
              payload: {}
              as: Official
              as_user_id: "${off}"
            - call: "POST /assignments/${asg}/appeals"
              payload: { reason: "venue double-booked by league error" }
              as: Official
              as_user_id: "${off}"
