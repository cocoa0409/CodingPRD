# =============================================================================
# Custom Apparel & Embroidery / Screen-Print Shop — Seed Tables (SCAFFOLD.yaml)
# §1.0–§1.7. Difficulty band: EXPERT (§0.4).
# =============================================================================

scenario: "Custom Apparel & Embroidery / Screen-Print Shop: garment catalog & decoration method, art proof & approval, size run & quantity-tier pricing, screen/stitch setup charge, rush turnaround, reorder, blank sourcing, misprint/spoilage allowance"

domain_name: custom-apparel-screen-print
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation        # quote estimate vs production-run final; reservation vs consumption
    - rate_threshold_triggers         # quantity tiers, rush-window threshold, spoilage allowance
    - cascading_side_effects          # confirm→reserve→stock; complete→fulfill→release→stock; cancel→void→release
    - optimistic_concurrency          # OCC on Order.version for proof re-approval supersede

  entity_topology: hybrid
  # Hierarchy under Shop (catalog/config + Order tree) plus cross-aggregate FK
  # references: BlankReservation -> BlankSku, ProductionRun -> Press|EmbroideryStation,
  # OrderLine -> GarmentStyle|DecorationMethod, Order -> Customer, Order -> Order (reorder).

  state_machine_shape: parallel
  # ArtProof is cyclic (revision loop); Order carries two independent dimensions
  # (fulfillment_status × billing_status); ProductionRun is branching (good vs scrap).

  relationship_patterns:
    - one_to_many                     # Order -> OrderLine, Order -> ArtProof, Order -> BlankReservation
    - cross_aggregate                 # BlankReservation -> BlankSku, ProductionRun -> Press
    - self_referential                # Order.reorder_of_order_id -> Order

  role_model: peer_roles
  # ShopManager (config + catalog + production), ArtStaff (proofs), Customer
  # (own orders + proof approval), plus System for automatic transitions.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Shop
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shop display name" }
      - { name: current_utc, type: datetime, source: system, default: "1970-01-01T00:00:00.000Z", description: "Server clock used for rush-window and lead-time math; advanced only via POST /_clock/set_current_utc" }
      - { name: spoilage_pct, type: number, source: input, default: 0.05, description: "Fraction of ordered units added as misprint/spoilage allowance; allowance = ceil(ordered_qty * spoilage_pct)" }
      - { name: rush_threshold_days, type: integer, source: input, default: 7, description: "An order is RUSH when whole days from current_utc to requested_ship_date is strictly less than this value" }
      - { name: rush_surcharge_pct, type: number, source: input, default: 0.25, description: "Rush surcharge as a fraction of the decoration subtotal" }

  - name: Customer
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: name, type: string, source: input, description: "Customer / brand name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per shop among non-archived customers" }
      - { name: outstanding_deposit_cents, type: integer, source: computed, default: 0, description: "Sum of deposit_paid_cents over this customer's Orders whose fulfillment_status is in {CONFIRMED, IN_PRODUCTION, FULFILLED}; conserved quantity for Rule 9" }
      - { name: archived, type: boolean, source: system, default: false, description: "Soft-delete flag; archived customers are excluded from default list results" }

  - name: DecorationMethod
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: method_type, type: enum, source: input, description: "SCREEN_PRINT | EMBROIDERY", constraints: "method_type IN {SCREEN_PRINT, EMBROIDERY}" }
      - { name: name, type: string, source: input, description: "Method display name" }
      - { name: screen_fee_cents, type: integer, source: input, default: 2500, description: "Per-screen setup fee (SCREEN_PRINT: one screen per ink color per location)" }
      - { name: digitizing_fee_cents, type: integer, source: input, default: 5000, description: "Per-design digitizing setup fee (EMBROIDERY: one design per location)" }
      - { name: extra_color_run_cents, type: integer, source: input, default: 75, description: "Per-unit per-location run uplift for each ink color beyond the first (SCREEN_PRINT only)" }
      - { name: stitch_run_per_1k_cents, type: integer, source: input, default: 90, description: "Per-unit per-location run cost per 1000 stitches, rounded up to whole thousands (EMBROIDERY only)" }
      - { name: resource_kind, type: enum, source: computed, description: "PRESS for SCREEN_PRINT, EMBROIDERY_STATION for EMBROIDERY; selects which machine a ProductionRun books", constraints: "resource_kind IN {PRESS, EMBROIDERY_STATION}" }

  - name: GarmentStyle
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: sku_code, type: string, source: input, description: "Catalog style code, e.g., GIL-5000; unique per shop" }
      - { name: name, type: string, source: input, description: "Style name" }
      - { name: blank_cost_cents, type: integer, source: input, description: "Per-unit blank garment cost charged to the customer" }
      - { name: available_colors, type: array, source: input, description: "Allowed color names for this style, e.g., [BLACK, WHITE, NAVY]" }
      - { name: available_sizes, type: array, source: input, description: "Allowed sizes, e.g., [S, M, L, XL, 2XL]" }

  - name: BlankSku
    parent: GarmentStyle
    common_fields: true
    fields:
      - { name: garment_style_id, type: string, source: system, description: "FK -> GarmentStyle.id" }
      - { name: color, type: string, source: input, description: "Must be one of the parent style's available_colors" }
      - { name: size, type: string, source: input, description: "Must be one of the parent style's available_sizes" }
      - { name: total_stock_qty, type: integer, source: system, description: "Immutable conserved total = on_hand_qty + reserved_qty; set at creation, restocked via POST .../restock" }
      - { name: on_hand_qty, type: integer, source: computed, description: "Unreserved units available to source new reservations" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Units held by ACTIVE BlankReservations across all Orders" }

  - name: Press
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: name, type: string, source: input, description: "Press identifier" }
      - { name: teardown_buffer_min, type: integer, source: input, default: 30, description: "Mandatory idle minutes a press needs between two runs; a new run's [start,end) must not start within this buffer after a prior run's end nor end within this buffer before a prior run's start" }

  - name: EmbroideryStation
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: name, type: string, source: input, description: "Embroidery station identifier" }
      - { name: head_count, type: integer, source: input, default: 1, description: "Number of concurrent runs the station can host on the same half-open [start,end) window before overlap is rejected" }

  - name: Order
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: reorder_of_order_id, type: string, source: input, description: "FK -> Order.id; set when this Order is a reorder of a prior FULFILLED Order, enabling screen-setup waiver", default: null }
      - { name: requested_ship_date, type: datetime, source: input, description: "Customer-requested ship date; drives the rush-window check against Shop.current_utc" }
      - { name: is_rush, type: boolean, source: computed, description: "True when whole days from Shop.current_utc to requested_ship_date < Shop.rush_threshold_days at confirmation time" }
      - { name: fulfillment_status, type: enum, source: system, default: "DRAFT", description: "Production dimension: DRAFT | CONFIRMED | IN_PRODUCTION | FULFILLED | CANCELLED", constraints: "fulfillment_status IN {DRAFT, CONFIRMED, IN_PRODUCTION, FULFILLED, CANCELLED}" }
      - { name: billing_status, type: enum, source: system, default: "UNBILLED", description: "Billing dimension evolving independently of fulfillment: UNBILLED | INVOICED | PAID", constraints: "billing_status IN {UNBILLED, INVOICED, PAID}" }
      - { name: deposit_paid_cents, type: integer, source: computed, default: 0, description: "Deposit charged at confirmation (= ceil(quote.grand_total_cents * 0.5)); restored to 0 on cancellation" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Final billed total set when billing_status becomes INVOICED; null until then" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: garment_style_id, type: string, source: input, description: "FK -> GarmentStyle.id" }
      - { name: decoration_method_id, type: string, source: input, description: "FK -> DecorationMethod.id" }
      - { name: color, type: string, source: input, description: "Garment color; must be in the style's available_colors" }
      - { name: num_locations, type: integer, source: input, description: "Number of imprint locations decorated on each garment (>= 1)" }
      - { name: num_colors, type: integer, source: input, description: "Ink colors per location (SCREEN_PRINT); ignored for EMBROIDERY", default: 1 }
      - { name: stitch_count, type: integer, source: input, description: "Stitches per location (EMBROIDERY); ignored for SCREEN_PRINT", default: 0 }
      - { name: size_run, type: object, source: input, description: "Map of size -> quantity, e.g., {S: 10, M: 30, L: 20}; every size must be in the style's available_sizes and every quantity must be a positive integer" }
      - { name: line_qty, type: integer, source: computed, description: "Sum of size_run quantities; the imprint quantity that selects the pricing tier" }

  - name: ArtProof
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: title, type: string, source: input, description: "Proof title / artwork reference" }
      - { name: art_hash, type: string, source: input, description: "Stable fingerprint of the artwork; reorders reuse screens when art_hash matches a prior FULFILLED order's approved proof" }
      - { name: revision_round, type: integer, source: computed, default: 0, description: "Increments by 1 each time the proof returns to SUBMITTED after CHANGES_REQUESTED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | CHANGES_REQUESTED | APPROVED | VOID", constraints: "status IN {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED, VOID}" }

  - name: BlankReservation
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: blank_sku_id, type: string, source: input, description: "FK -> BlankSku.id" }
      - { name: ordered_qty, type: integer, source: input, description: "Good units the customer ordered for this SKU" }
      - { name: allowance_qty, type: integer, source: computed, description: "Misprint allowance = ceil(ordered_qty * Shop.spoilage_pct)" }
      - { name: reserved_qty, type: integer, source: computed, description: "Units held against the BlankSku while ACTIVE = ordered_qty + allowance_qty" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (holding blanks) | CONSUMED (order produced; leftover allowance returned) | RELEASED (order cancelled; full reserved_qty returned)", constraints: "status IN {ACTIVE, RELEASED, CONSUMED}" }

  - name: Quote
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: blank_subtotal_cents, type: integer, source: computed, description: "Sum over lines of blank_cost_cents * line_qty" }
      - { name: setup_subtotal_cents, type: integer, source: computed, description: "Screen/digitizing setup charges; waived per-line when the reorder reuses matching screens" }
      - { name: decoration_subtotal_cents, type: integer, source: computed, description: "Sum over lines of per-unit run cost (rounded per line) * line_qty" }
      - { name: rush_surcharge_cents, type: integer, source: computed, description: "ceil(decoration_subtotal_cents * Shop.rush_surcharge_pct) when is_rush, else 0" }
      - { name: grand_total_cents, type: integer, source: computed, description: "blank_subtotal + setup_subtotal + decoration_subtotal + rush_surcharge" }
      - { name: variant, type: enum, source: system, default: "ESTIMATE", description: "Always ESTIMATE; the forward-looking variant priced on ordered quantities", constraints: "variant IN {ESTIMATE}" }

  - name: ProductionRun
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: press_id, type: string, source: input, description: "FK -> Press.id; required when the order's method is SCREEN_PRINT, else omitted", default: null }
      - { name: embroidery_station_id, type: string, source: input, description: "FK -> EmbroideryStation.id; required when the order's method is EMBROIDERY, else omitted", default: null }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the machine booking window [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the machine booking window" }
      - { name: good_units, type: integer, source: input, description: "Units that passed QC at completion; supplied to POST .../complete", default: null }
      - { name: spoiled_units, type: integer, source: input, description: "Misprinted units scrapped at completion, supplied to POST .../complete; good_units + spoiled_units must be <= blanks_pulled", default: null }
      - { name: consumed_units, type: integer, source: computed, description: "good_units + spoiled_units; the blanks actually drawn from stock for keeps", default: null }
      - { name: released_units, type: integer, source: computed, description: "blanks_pulled - consumed_units; unused allowance returned to BlankSku on_hand at fulfillment", default: null }
      - { name: blanks_pulled, type: integer, source: computed, description: "Total reserved units drawn for the run = sum of the order's ACTIVE reservations.reserved_qty at start" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | RUNNING | COMPLETED | ABORTED", constraints: "status IN {SCHEDULED, RUNNING, COMPLETED, ABORTED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ArtProof
    initial_state: DRAFT
    terminal_states: [APPROVED, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /orders/{orderId}/art-proofs/{proofId}/submit"
        actor: ArtStaff
        preconditions:
          - "Order.fulfillment_status == DRAFT (ERR_ORDER_NOT_DRAFT)"
        side_effects: []

      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /orders/{orderId}/art-proofs/{proofId}/request-changes"
        actor: Customer
        preconditions:
          - "Acting Customer owns the Order (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
        note: "Revision loop: customer asks for edits."

      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /orders/{orderId}/art-proofs/{proofId}/submit"
        actor: ArtStaff
        preconditions:
          - "Order.fulfillment_status == DRAFT (ERR_ORDER_NOT_DRAFT)"
        side_effects:
          - "increment ArtProof.revision_round by 1"
        note: "Cyclic edge — closes the SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED revision loop."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /orders/{orderId}/art-proofs/{proofId}/approve"
        actor: Customer
        preconditions:
          - "Acting Customer owns the Order (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "increments Order.version by 1"
        note: "Approval bumps the parent Order.version so a stale re-approval supersede is detectable (see concurrency_rules)."

      - from: DRAFT
        to: VOID
        trigger: "system (cascade from Order cancel)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: VOID
        trigger: "system (cascade from Order cancel)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CHANGES_REQUESTED
        to: VOID
        trigger: "system (cascade from Order cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Order
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      # ---- fulfillment_status dimension ----
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /orders/{orderId}/confirm"
        actor: ShopManager
        preconditions:
          - "Order has >= 1 OrderLine (ERR_ORDER_EMPTY)"
          - "The Order's ArtProof is APPROVED (cross-entity: ERR_PROOF_NOT_APPROVED)"
          - "For every line, the BlankSku for (style,color,size) has on_hand_qty >= ordered_qty + ceil(ordered_qty * spoilage_pct) (ERR_BLANK_INSUFFICIENT)"
        side_effects:
          - "compute Quote (ESTIMATE variant): blank_subtotal, setup_subtotal, decoration_subtotal, rush_surcharge, grand_total"
          - "set Order.is_rush from the rush-window check"
          - "create one ACTIVE BlankReservation per line; each BlankReservation reserve mutates its BlankSku (reserved_qty += reserved_qty, on_hand_qty -= reserved_qty)"
          - "set Order.deposit_paid_cents = ceil(quote.grand_total_cents * 0.5)"
          - "increment Customer.outstanding_deposit_cents by Order.deposit_paid_cents"
          - "increments Order.version by 1"
        note: "Confirm fans out into reservations; cascade depth-2 (Order -> BlankReservation -> BlankSku)."

      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "POST /orders/{orderId}/production-runs (first run starts)"
        actor: ShopManager
        preconditions:
          - "Order.fulfillment_status == CONFIRMED (ERR_ORDER_NOT_CONFIRMED)"
        side_effects: []
        note: "Driven by creating the first ProductionRun for the order."

      - from: IN_PRODUCTION
        to: FULFILLED
        trigger: "system (cascade when a ProductionRun is COMPLETED and all line good_units satisfied)"
        actor: system
        preconditions:
          - "The completing ProductionRun delivered good_units >= total ordered_qty across the order's reservations (ERR_RUN_SHORT)"
        side_effects:
          - "for each ACTIVE BlankReservation: set status CONSUMED (the order was produced). Each CONSUMED transition mutates the BlankSku: on_hand_qty += released_units (the leftover allowance not used by the run = blanks_pulled - good_units - spoiled_units), reserved_qty -= reserved_qty (the hold clears). RELEASED is reserved for the cancel path."
          - "set Order.billing_status path independent; final billing handled separately"
        note: "Depth-3 cascade origin: ProductionRun.complete -> Order.FULFILLED -> BlankReservation.RELEASED/CONSUMED -> BlankSku stock."

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: ShopManager | Customer
        preconditions:
          - "Order.fulfillment_status IN {DRAFT, CONFIRMED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "cascade: every non-terminal ArtProof on the Order -> VOID"
        note: "From DRAFT there are no reservations yet; only proofs are voided."

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: ShopManager | Customer
        preconditions:
          - "Order.fulfillment_status IN {DRAFT, CONFIRMED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "cascade: every ACTIVE BlankReservation -> RELEASED; each release mutates its BlankSku (reserved_qty -= reserved_qty, on_hand_qty += reserved_qty)"
          - "cascade: every non-terminal ArtProof on the Order -> VOID"
          - "decrement Customer.outstanding_deposit_cents by Order.deposit_paid_cents (compensating action restoring the conserved deposit total)"
          - "set Order.deposit_paid_cents = 0"
        note: "Depth-2 cascade origin (different trigger than complete): Order.cancel -> BlankReservation.RELEASED -> BlankSku stock."

      # ---- billing_status dimension (independent of fulfillment) ----
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /orders/{orderId}/invoice"
        actor: ShopManager
        preconditions:
          - "Order.fulfillment_status == FULFILLED (cross-entity-to-own-dimension: ERR_ORDER_NOT_FULFILLED)"
          - "Order.billing_status == UNBILLED (ERR_ALREADY_INVOICED)"
        side_effects:
          - "compute ProductionRun-final total: set Order.final_total_cents from the consumption-based pricing variant"
        note: "billing_status axis advances independently of fulfillment beyond its FULFILLED gate."

      - from: INVOICED
        to: PAID
        trigger: "POST /orders/{orderId}/pay"
        actor: Customer
        preconditions:
          - "Order.billing_status == INVOICED (ERR_NOT_INVOICED)"
          - "Acting Customer owns the Order (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /orders/{orderId}/production-runs/{runId}/start"
        actor: ShopManager
        preconditions:
          - "Order.fulfillment_status IN {CONFIRMED, IN_PRODUCTION} (cross-entity: ERR_ORDER_NOT_CONFIRMED)"
        side_effects:
          - "record blanks_pulled = sum of the order's ACTIVE reservations.reserved_qty"
          - "if Order.fulfillment_status == CONFIRMED, advance it to IN_PRODUCTION"

      - from: RUNNING
        to: COMPLETED
        trigger: "POST /orders/{orderId}/production-runs/{runId}/complete"
        actor: ShopManager
        preconditions:
          - "good_units >= 0, spoiled_units >= 0, and good_units + spoiled_units <= blanks_pulled (ERR_INVALID_GOOD_UNITS)"
        side_effects:
          - "set consumed_units = good_units + spoiled_units; set released_units = blanks_pulled - consumed_units"
          - "if good_units >= total ordered_qty across reservations: cascade Order.fulfillment_status -> FULFILLED (which releases/consumes reservations)"
          - "if good_units < total ordered_qty: ERR_RUN_SHORT and no state change"

      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /orders/{orderId}/production-runs/{runId}/abort"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "free the booked machine window for that Press/EmbroideryStation"

      - from: RUNNING
        to: ABORTED
        trigger: "POST /orders/{orderId}/production-runs/{runId}/abort"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "free the booked machine window"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: proof-approve-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/art-proofs/{id}/approve"
    occ_field: "expected_order_version"
    description: |
      Approving an ArtProof against an Order whose version has advanced since the
      client last read it is rejected with a stale-version error. A prior approve
      (or a competing proof's approve that legitimately supersedes the earlier
      submission) already bumped Order.version, so the current approver's view of
      the Order is stale. OCC on Order.version reduces this to a deterministic
      precondition: the body's expected_order_version must equal the live
      Order.version.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_qty
    trigger: "OrderLine creation"
    algorithm: aggregation
    formula: |
      line_qty = sum(qty for qty in size_run.values())
      # Every value in size_run must be a positive integer; an empty size_run
      # (no sizes) or any non-positive quantity is rejected before this runs.
    input_set: "All entries of this OrderLine's size_run map."
    precision: "integer"

  - name: decoration_run_cost
    trigger: "Order confirm (Quote ESTIMATE) and Order invoice (final)"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): >=3 inputs with non-linear tier selection and per-method branch.
      # The pricing tier is chosen by the LINE's line_qty (NOT marginal across
      # tiers): one flat per-unit rate applies to every unit on the line.
      def tier_rate(line_qty):
        if line_qty <= 23:   return 800
        if line_qty <= 71:   return 550
        if line_qty <= 143:  return 400
        return 300                       # line_qty >= 144
      if method.method_type == SCREEN_PRINT:
        per_unit_per_location = tier_rate(line_qty) + (num_colors - 1) * method.extra_color_run_cents
      else:  # EMBROIDERY
        thousands = ceil(stitch_count / 1000)
        per_unit_per_location = thousands * method.stitch_run_per_1k_cents
      per_unit_line = per_unit_per_location * num_locations        # rounded already in cents (integers)
    input_set: "A single OrderLine plus its DecorationMethod."
    constants:
      TIER1_MAX: 23
      TIER2_MAX: 71
      TIER3_MAX: 143
      TIER1_RATE_CENTS: 800
      TIER2_RATE_CENTS: 550
      TIER3_RATE_CENTS: 400
      TIER4_RATE_CENTS: 300
    precision: "integer cents; tier selected by line_qty, flat rate across all units on the line"

  - name: decoration_subtotal
    trigger: "Order confirm (Quote ESTIMATE)"
    algorithm: aggregation
    formula: |
      # Mode (b): rounding order is PINNED. Compute each line's per-unit run cost,
      # multiply by line_qty to get the line's integer-cent decoration cost
      # (per-line rounding happens here, before summation), THEN sum across lines.
      # "round per line then sum", NOT "sum fractional then round once".
      decoration_subtotal_cents = sum(
          (decoration_run_cost.per_unit_line for that line) * line.line_qty
          for line in order.lines
      )
    input_set: "All OrderLines of the Order."
    precision: "integer cents; per-line product taken first, then summed (per-line-then-sum pinned)"

  - name: setup_subtotal
    trigger: "Order confirm (Quote ESTIMATE)"
    algorithm: aggregation
    formula: |
      setup = 0
      for line in order.lines:
        if method.method_type == SCREEN_PRINT:
          line_setup = num_colors * num_locations * method.screen_fee_cents
        else:  # EMBROIDERY
          line_setup = num_locations * method.digitizing_fee_cents
        # Reorder waiver: if order.reorder_of_order_id is set AND the order's
        # APPROVED ArtProof.art_hash equals the referenced order's approved
        # ArtProof.art_hash, the screens/design already exist -> waive: line_setup = 0
        if order.reorder_of_order_id != null and art_hash_matches(order, referenced_order):
          line_setup = 0
        setup += line_setup
      setup_subtotal_cents = setup
    input_set: "All OrderLines; the Order's reorder linkage and approved ArtProof.art_hash."
    precision: "integer cents"

  - name: order_price
    trigger: "Order confirm (ESTIMATE) vs Order invoice (FINAL)"
    algorithm: forward_looking
    formula: |
      blank_subtotal_cents = sum(style.blank_cost_cents * line.line_qty for line in lines)
      grand_total_cents = blank_subtotal_cents + setup_subtotal_cents
                          + decoration_subtotal_cents + rush_surcharge_cents
      rush_surcharge_cents = ceil(decoration_subtotal_cents * shop.rush_surcharge_pct) if order.is_rush else 0
    input_set: "All OrderLines, the Order's rush flag, the Quote subtotals."
    constants:
      DEPOSIT_PCT: 0.5
    precision: "integer cents; ceil for rush_surcharge"
    variants:
      - name: ESTIMATE
        when: "Quote computed at Order confirm"
        difference: "Prices on ordered quantities (line_qty); charges full setup unless reorder waiver applies; sets deposit = ceil(grand_total * 0.5)."
      - name: FINAL
        when: "Order invoice after FULFILLED"
        difference: "Bills blank_subtotal on the units actually CONSUMED (good_units + spoiled_units up to allowance) rather than reserved units; decoration_subtotal and setup unchanged from estimate; rush surcharge re-evaluated against the SAME is_rush captured at confirm. Final can differ from estimate whenever spoilage < allowance (fewer blanks consumed than reserved)."

  - name: blank_consumption_cost
    trigger: "Order confirm (reserved) vs ProductionRun complete (consumed)"
    algorithm: chronological
    formula: |
      # Dual-variant on the BlankSku/BlankReservation domain (distinct from
      # order_price's Order domain).
      reserved_cost_cents  = sum(res.reserved_qty * style.blank_cost_cents for res in active_reservations)
      consumed_cost_cents  = sum((run.good_units + run.spoiled_units capped at res.reserved_qty)
                                 * style.blank_cost_cents for res in reservations)
    input_set: "BlankReservations of the Order and the completing ProductionRun's good_units/spoiled_units."
    precision: "integer cents"
    variants:
      - name: RESERVED
        when: "At Order confirm; blanks held but not yet pulled."
        difference: "Counts ordered_qty + allowance_qty per reservation (the full ACTIVE reserved_qty)."
      - name: CONSUMED
        when: "At ProductionRun complete; only blanks actually drawn."
        difference: "Counts good_units + spoiled_units (<= reserved_qty); the unused allowance is RELEASED and never billed, so CONSUMED < RESERVED whenever spoilage is below allowance."

  - name: spoilage_allowance
    trigger: "Order confirm (per BlankReservation)"
    algorithm: threshold
    formula: |
      allowance_qty = ceil(ordered_qty * shop.spoilage_pct)
      reserved_qty  = ordered_qty + allowance_qty
    input_set: "A single BlankReservation's ordered_qty and Shop.spoilage_pct."
    constants:
      DEFAULT_SPOILAGE_PCT: 0.05
    precision: "integer units; ceil"

  - name: rush_window
    trigger: "Order confirm"
    algorithm: threshold
    formula: |
      whole_days = floor((requested_ship_date - shop.current_utc) / 86400 seconds)
      is_rush = whole_days < shop.rush_threshold_days     # strict '<'; exactly == threshold is NOT rush
    input_set: "Order.requested_ship_date, Shop.current_utc, Shop.rush_threshold_days."
    constants:
      DEFAULT_RUSH_THRESHOLD_DAYS: 7
    precision: "integer days, floored; boundary is strict '<' (Rule 6)"

  - name: blank_conservation_invariant
    trigger: "BlankReservation reserve (confirm) and release (cancel)"
    algorithm: aggregation
    formula: |
      # Rule 9 invariant (conserved quantity = blank units), scoped to the
      # reserve(confirm) -> release(cancel) compensating pair:
      #   for every BlankSku: on_hand_qty + reserved_qty == total_stock_qty
      #   reserved_qty = sum(res.reserved_qty for res in reservations where res.status == ACTIVE)
      # A confirm (forward) moves units on_hand -> reserved; a cancel (compensating)
      # moves them back. The equality holds before confirm, after confirm, and after
      # cancel — zero drift in blank units across the pair.
      # NOTE: CONSUMED is a terminal sink (printed garments leave the shop), not a
      # compensating action, so it is intentionally outside this invariant's scope.
      invariant: on_hand_qty + sum(ACTIVE reservations.reserved_qty) == total_stock_qty
    input_set: "A BlankSku and all its ACTIVE BlankReservations (excludes CONSUMED)."
    precision: "integer units; exact equality must hold across the reserve/release compensating pair"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint (and, for owned resources, X-User-ID matches the resource's Customer)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist within the shop, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body is well-formed: enum members valid, quantities positive integers, size_run non-empty, color/size in the style's catalog lists"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST/PATCH bodies"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Order must be DRAFT to attach/submit proofs and lines"
    error_id: ERR_ORDER_NOT_DRAFT
    http_status: 409
    applies_to: "POST .../art-proofs/{id}/submit, POST .../lines"

  - priority: 7
    category: business_referential
    check: "Order confirm: the Order's ArtProof must be APPROVED (cross-entity Order->ArtProof)"
    error_id: ERR_PROOF_NOT_APPROVED
    http_status: 409
    applies_to: "POST .../orders/{id}/confirm"

  - priority: 8
    category: business_constraint
    check: "Order confirm: the Order must have at least one OrderLine"
    error_id: ERR_ORDER_EMPTY
    http_status: 409
    applies_to: "POST .../orders/{id}/confirm"

  - priority: 9
    category: business_fiscal
    check: "Order confirm: every line's BlankSku must have on_hand_qty >= ordered_qty + ceil(ordered_qty * spoilage_pct)"
    error_id: ERR_BLANK_INSUFFICIENT
    http_status: 409
    applies_to: "POST .../orders/{id}/confirm"

  - priority: 10
    category: state
    check: "ProductionRun create/start requires Order.fulfillment_status in {CONFIRMED, IN_PRODUCTION} (cross-entity ProductionRun->Order)"
    error_id: ERR_ORDER_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST .../production-runs, POST .../production-runs/{id}/start"

  - priority: 11
    category: business_temporal
    check: "ProductionRun window must not collide with another non-terminal run on the SAME Press within its teardown_buffer_min (buffered adjacency)"
    error_id: ERR_PRESS_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST .../production-runs (SCREEN_PRINT orders)"

  - priority: 12
    category: business_temporal
    check: "ProductionRun window must not exceed an EmbroideryStation's head_count of concurrent half-open [start,end) overlaps; touching adjacency (gap=0) is allowed"
    error_id: ERR_STATION_OVERSUBSCRIBED
    http_status: 409
    applies_to: "POST .../production-runs (EMBROIDERY orders)"

  - priority: 13
    category: business_constraint
    check: "ProductionRun complete: good_units >= 0, spoiled_units >= 0, and good_units + spoiled_units <= blanks_pulled"
    error_id: ERR_INVALID_GOOD_UNITS
    http_status: 400
    applies_to: "POST .../production-runs/{id}/complete"

  - priority: 14
    category: business_constraint
    check: "ProductionRun complete: good_units must reach the total ordered_qty across reservations"
    error_id: ERR_RUN_SHORT
    http_status: 409
    applies_to: "POST .../production-runs/{id}/complete"

  - priority: 15
    category: state
    check: "Order invoice requires Order.fulfillment_status == FULFILLED"
    error_id: ERR_ORDER_NOT_FULFILLED
    http_status: 409
    applies_to: "POST .../orders/{id}/invoice"

  - priority: 16
    category: business_referential
    check: "Reorder: reorder_of_order_id must reference a FULFILLED Order of the same Customer"
    error_id: ERR_INVALID_REORDER_SOURCE
    http_status: 409
    applies_to: "POST .../orders (with reorder_of_order_id)"

  - priority: 17
    category: business_referential
    check: "OCC: expected_order_version must equal the live Order.version on proof approve"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST .../art-proofs/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server clock (test-driving endpoint)"
    roles: [ShopManager]
    code: 200
    input: [shop_id, to_iso8601]
    output: Shop
    side_effects: ["Shop.current_utc = to_iso8601"]

  # ---- Shop ----
  - method: POST
    path: "/shops"
    description: "Create a Shop"
    roles: [ShopManager]
    code: 201
    input: ["name", "spoilage_pct?", "rush_threshold_days?", "rush_surcharge_pct?"]
    output: Shop
    side_effects: ["current_utc defaults to epoch until set"]

  - method: GET
    path: "/shops/{id}"
    description: "Get a Shop"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: []
    output: Shop
    side_effects: []

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a Customer"
    roles: [ShopManager]
    code: 201
    input: ["shop_id", "name", "email"]
    output: Customer
    side_effects: ["archived=false; outstanding_deposit_cents=0"]

  - method: GET
    path: "/customers/{id}"
    description: "Get a Customer"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{id}/archive"
    description: "Soft-delete (archive) a Customer; excluded from default lists thereafter"
    roles: [ShopManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["archived = true"]

  - method: GET
    path: "/customers"
    description: "List Customers (filter by shop_id; archived excluded unless include_archived=true) — FK reverse-reachability for Customer.shop_id"
    roles: [ShopManager, ArtStaff]
    code: 200
    input: ["shop_id?", "include_archived?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  # ---- DecorationMethod ----
  - method: POST
    path: "/decoration-methods"
    description: "Create a DecorationMethod"
    roles: [ShopManager]
    code: 201
    input: ["shop_id", "method_type", "name", "screen_fee_cents?", "digitizing_fee_cents?", "extra_color_run_cents?", "stitch_run_per_1k_cents?"]
    output: DecorationMethod
    side_effects: ["resource_kind derived from method_type"]

  - method: GET
    path: "/decoration-methods/{id}"
    description: "Get a DecorationMethod"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: []
    output: DecorationMethod
    side_effects: []

  - method: GET
    path: "/decoration-methods"
    description: "List DecorationMethods (filter by shop_id) — FK reverse-reachability for DecorationMethod.shop_id"
    roles: [ShopManager, ArtStaff]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "DecorationMethod[]"
    side_effects: []

  # ---- GarmentStyle ----
  - method: POST
    path: "/garment-styles"
    description: "Create a GarmentStyle"
    roles: [ShopManager]
    code: 201
    input: ["shop_id", "sku_code", "name", "blank_cost_cents", "available_colors", "available_sizes"]
    output: GarmentStyle
    side_effects: []

  - method: GET
    path: "/garment-styles/{id}"
    description: "Get a GarmentStyle"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: []
    output: GarmentStyle
    side_effects: []

  - method: GET
    path: "/garment-styles"
    description: "List GarmentStyles (filter by shop_id) — FK reverse-reachability for GarmentStyle.shop_id"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "GarmentStyle[]"
    side_effects: []

  # ---- BlankSku (sub-resource of GarmentStyle) ----
  - method: POST
    path: "/garment-styles/{id}/blank-skus"
    description: "Create a BlankSku (initial stock)"
    roles: [ShopManager]
    code: 201
    input: ["color", "size", "total_stock_qty"]
    output: BlankSku
    side_effects: ["on_hand_qty = total_stock_qty; reserved_qty = 0"]

  - method: POST
    path: "/garment-styles/{id}/blank-skus/{id}/restock"
    description: "Add stock to a BlankSku"
    roles: [ShopManager]
    code: 200
    input: ["add_qty"]
    output: BlankSku
    side_effects: ["total_stock_qty += add_qty; on_hand_qty += add_qty"]

  - method: GET
    path: "/garment-styles/{id}/blank-skus"
    description: "List BlankSkus for a GarmentStyle — FK reverse-reachability for BlankSku.garment_style_id"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: ["color?", "size?", "limit?", "offset?"]
    output: "BlankSku[]"
    side_effects: []

  - method: GET
    path: "/garment-styles/{id}/blank-skus/{id}"
    description: "Get a BlankSku"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: []
    output: BlankSku
    side_effects: []

  # ---- Press ----
  - method: POST
    path: "/presses"
