              payload: { booking_number: "C-2120", full_name: "Dee Flores", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
