          - validations[priority=15]
          - state_machines.Registration.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          A second cancel on an already-CANCELLED registration fails the state
          check (priority 6, ERR_INVALID_STATE) rather than the fiscal
          refund-window check (priority 15); category pair = state vs business_fiscal.
