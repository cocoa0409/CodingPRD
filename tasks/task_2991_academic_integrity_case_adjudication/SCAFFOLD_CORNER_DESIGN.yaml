            - "Case.${case_id}.adjudication_status == INTAKE_REVIEW AND Case.${case_id}.notation_status == NOT_APPLICABLE - both dimensions start at their own initial state"
            - "Case.${case_id}.pathway == UNASSIGNED, responsibility_finding == UNDETERMINED, finding_basis == NONE, hearing_round == 0, overturned == false, decided_at == null, version == 1"
            - "Case.${case_id}.panel_severity_recommendation == null and pre_appeal_adjudication_status == null"
            - "AdvisorEngagement.${advisor_id}.status == REQUESTED with speaking_rights == false and reconfirmation_required == false"
            - "Department.${dept_engl_id}.open_case_count == 1 - the only ledger the create touched"

      - name: sending_the_allegation_notice_advances_the_case_and_writes_every_declared_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Case.INTAKE_REVIEW_to_NOTIFIED
          - endpoints[POST /integrity/cases/{id}/notifications]
          - entities.Notification.fields.response_deadline_at
          - endpoints[POST /integrity/cases/{id}/pathway]
        distinguishing_aspect: |
          One call must produce three observable effects: the Notification row with sent_at from the
          logical clock and response_deadline_at at sent_at + response_window_days, the Case moving
          INTAKE_REVIEW -> NOTIFIED, and Case.version advancing. The pathway call is a separate
          transition on a separate field that must NOT move adjudication_status, which is what makes
          the two effects independently falsifiable.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one Case in INTAKE_REVIEW with pathway UNASSIGNED (the initial-state fixture above)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
