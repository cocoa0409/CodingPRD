            - call: "POST /penalty-assessments/${pen_1}/pay"
              payload: { paid_amount_cents: 999999 }
              as: PenaltyOfficer
              as_user_id: "officer-1"
              captures: { e_partial: $.data.error_id }
            - call: "POST /penalty-assessments/${pen_1}/pay"
              payload: { paid_amount_cents: 1000000 }
              as: PenaltyOfficer
              as_user_id: "officer-1"
            - call: "POST /penalty-assessments/${pen_1}/pay"
