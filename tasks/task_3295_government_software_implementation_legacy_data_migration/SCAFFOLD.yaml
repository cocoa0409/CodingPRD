- method: POST
  path: /programs/training-sessions/{id}/mark-delivered
  description: SCHEDULED -> DELIVERED
  roles:
  - ImplementationManager
  code: 200
  input: []
  output: TrainingSession
  side_effects: []
- method: POST
  path: /programs/training-sessions/{id}/cancel
  description: SCHEDULED -> CANCELLED; enrollments -> WITHDRAWN
  roles:
  - ImplementationManager
  code: 200
  input: []
