              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r5b-1", requested_assurance_tier: "BASIC", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s1_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "SUSPENDED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r5b-2", requested_assurance_tier: "BASIC", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 409 and $.data.error_id == ERR_CLIENT_NOT_LIVE"
            - "$.data.error_id != ERR_CLIENT_DAILY_QUOTA_EXCEEDED"
            - "GET /idv/verification-sessions?client_id=${client_id} still returns total_count == 1 with data[0].id == ${s1_id}"

      - name: session_expiry_error_outranks_step_up_limit_error
        grounds:
          - validations[priority=38]
          - validations[priority=42]
          - calculations.session_expiry_schedule
          - state_machines.VerificationSession.identity_state.AWAITING_EVIDENCE_to_IN_PROGRESS
        distinguishing_aspect: |
          Category pair business_temporal (priority 38) vs business_constraint (priority 42): the
          session is AWAITING_EVIDENCE with step_up_round 0 against step_up_max_rounds 0 AND the clock
          has passed expires_at, and the response must be ERR_SESSION_EXPIRED, never
          ERR_STEP_UP_LIMIT_REACHED.
        test_recipe:
          setup:
            - "Clock is set to 2026-08-10T09:00:00Z, so the session opened at that instant expires at 2026-08-10T10:00:00Z."
            - "Client Acme P3 is LIVE, DELETE_ON_COMPLETE, quota 50, 1 review credit."
            - "Policy v1 allows DOCUMENT_SCAN with step_up_max_rounds 0, min_assurance_score 60, doc floor 8000, no age gate; PUBLISHED."
            - "Session subj-r5c has a SCORED DOCUMENT_SCAN attempt; a bias audit on that profile is then evaluated with gating ratio 12500, which cascades the session to AWAITING_EVIDENCE even though its step-up budget is 0."
            - "The clock is then advanced to 2026-08-10T10:00:01Z, one second past expires_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
