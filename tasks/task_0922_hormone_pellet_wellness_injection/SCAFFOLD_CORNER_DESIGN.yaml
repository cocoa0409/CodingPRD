              captures: { occ_err: $.data.error_id }
          assert:
            - "${occ_err} == ERR_STALE_PROCEDURE_VERSION with HTTP 412"
            - "PelletLot.${lot_a}.qty_reserved == 5"
            - "PelletLot.${lot_a}.qty_on_hand == 15"
            - "Procedure.${pr42}.pellets_allocated == 5"

      - name: occ_stale_patient_version_rejected_on_perform
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[perform-stale-patient]", "validations[priority=12]", "errors[ERR_STALE_PATIENT_VERSION]"]
        distinguishing_aspect: "Two eligibility-hold writes bump Patient.version between the client's read and its perform, so the perform is refused at 412 even though every clinical rung below it would have passed."
        test_recipe:
          setup:
            - "A testosterone procedure in SUPPLY_OPENED."
            - "The client's observed Patient.version captured BEFORE a set-then-clear pair of clinical-hold writes."
            - "Clock at 2026-05-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner FortyThree", date_of_birth: "1980-01-01", email: "c43@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { c43: $.data.id }
            - call: "POST /clinic/protocols"
              payload: { hormone_type: "TESTOSTERONE", title: "T v1", published_by_provider_id: "${dr1}" }
              as: Physician
              as_user_id: "${dr1}"
            - call: "POST /clinic/consents"
              payload: { patient_id: "${c43}", hormone_type: "TESTOSTERONE", protocol_version: 1, consented_max_dose_mg: 2000 }
              as: FrontDesk
              captures: { con43: $.data.id }
            - call: "POST /clinic/consults"
              payload: { patient_id: "${c43}", physician_id: "${dr1}", hormone_type: "TESTOSTERONE", prescribed_dose_mg: 1000, symptom_score: 55, indication: "Hypogonadism" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { cs43: $.data.id }
            - call: "POST /clinic/standing-orders"
              payload: { physician_id: "${dr1}", scope_hormone_types: ["TESTOSTERONE"], scope_injection_types: ["B12"], max_dose_mg: 1500, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { so43: $.data.id }
            - call: "POST /clinic/pellet-lots"
              payload: { lot_code: "T200-A", hormone_type: "TESTOSTERONE", strength_mg: 200, expiry_date: "2026-12-01T00:00:00Z", qty_received: 10 }
              as: InventoryManager
              captures: { lot_a: $.data.id }
            - call: "POST /clinic/pellet-lots/${lot_a}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /clinic/procedures"
              payload: { patient_id: "${c43}", provider_id: "${dr1}", consult_id: "${cs43}", standing_order_id: "${so43}", procedure_type: "INITIAL", room_code: "RM64", scheduled_start: "2026-05-10T09:00:00Z" }
              as: FrontDesk
              captures: { pr43: $.data.id }
            - call: "POST /clinic/procedures/${pr43}/consent-attach"
              payload: { consent_record_id: "${con43}" }
              as: FrontDesk
            - call: "GET /clinic/procedures/${pr43}"
              payload: {}
              as: Physician
              as_user_id: "${dr1}"
              captures: { pr43_v: $.data.version }
            - call: "POST /clinic/procedures/${pr43}/allocations"
              payload: { expected_procedure_version: "${pr43_v}" }
              as: InventoryManager
            - call: "POST /clinic/procedures/${pr43}/open-supply"
              payload: {}
              as: Physician
              as_user_id: "${dr1}"
            - call: "GET /clinic/patients/${c43}"
              payload: {}
              as: Physician
              as_user_id: "${dr1}"
              captures: { c43_v_stale: $.data.version }
            - call: "POST /clinic/patients/${c43}/eligibility-hold"
              payload: { hold_kind: "CLINICAL", hold_action: "SET", reason: "Pending clearance" }
              as: Physician
              as_user_id: "${dr1}"
            - call: "POST /clinic/patients/${c43}/eligibility-hold"
              payload: { hold_kind: "CLINICAL", hold_action: "CLEAR", reason: "Cleared" }
              as: Physician
              as_user_id: "${dr1}"
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ClinicAdmin
          trigger:
            - call: "POST /clinic/procedures/${pr43}/perform"
              payload: { expected_patient_version: "${c43_v_stale}", pellets_wasted: 0 }
              as: Physician
              as_user_id: "${dr1}"
              captures: { occ2_err: $.data.error_id }
          assert:
            - "${occ2_err} == ERR_STALE_PATIENT_VERSION with HTTP 412"
            - "Patient.${c43}.clinical_hold == false"
            - "Patient.${c43}.eligibility_status == CLEAR"
            - "Procedure.${pr43}.status == SUPPLY_OPENED"
            - "Procedure.${pr43}.delivered_total_mg == 0"
            - "PelletLot.${lot_a}.qty_consumed == 0"
            - "PelletLot.${lot_a}.qty_reserved == 5"

      - name: occ_stale_membership_version_rejected_on_tier_change
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tier-change-stale-membership]", "errors[ERR_STALE_MEMBERSHIP_VERSION]"]
        distinguishing_aspect: "The first tier change succeeds and advances Membership.version; a second change carrying the same observed version is refused at 412 and the tier stays ELITE."
        test_recipe:
          setup: ["One ACTIVE BASIC membership whose version has been read once."]
          setup_api_calls:
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner FortyFour", date_of_birth: "1980-01-01", email: "c44@example.com", sex_at_birth: "FEMALE" }
              as: ClinicAdmin
              captures: { c44: $.data.id }
            - call: "POST /clinic/memberships"
              payload: { patient_id: "${c44}", tier: "BASIC" }
              as: FrontDesk
              captures: { mem44: $.data.id }
            - call: "GET /clinic/memberships/${mem44}"
              payload: {}
              as: FrontDesk
              captures: { mem44_v: $.data.version }
            - call: "POST /clinic/memberships/${mem44}/tier-change"
              payload: { tier: "ELITE", expected_membership_version: "${mem44_v}" }
              as: FrontDesk
          trigger:
            - call: "POST /clinic/memberships/${mem44}/tier-change"
              payload: { tier: "PLUS", expected_membership_version: "${mem44_v}" }
              as: FrontDesk
              captures: { occ3_err: $.data.error_id }
          assert:
            - "${occ3_err} == ERR_STALE_MEMBERSHIP_VERSION with HTTP 412"
            - "Membership.${mem44}.tier == ELITE"
            - "Membership.${mem44}.monthly_fee_cents == 19900"
            - "Membership.${mem44}.discount_pct == 0.20"
            - "Membership.${mem44}.included_visits_allowance == 4"
            - "Membership.${mem44}.included_visits_used == 0"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: "Auth denial"
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Rung 1 sits above everything, so a request with no X-User-Role and no X-User-ID returns 401 even when the body is perfectly valid."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner FortyFive", date_of_birth: "1980-01-01", email: "c45@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { auth_err: $.data.error_id }
          assert:
            - "the request is sent with BOTH the X-User-Role and X-User-ID headers omitted"
            - "${auth_err} == ERR_UNAUTHENTICATED with HTTP 401"
            - "no Patient row exists with email c45@example.com"

      - name: unknown_role_header_returns_unauthenticated
        claim_type: "Auth denial"
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A role string outside the seven declared roles is rejected at rung 2 with 401, NOT at rung 3 with 403 - an unrecognised role is an authentication failure, not an authorisation one."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner FortySix", date_of_birth: "1980-01-01", email: "c46@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { role_unknown_err: $.data.error_id }
          assert:
            - "the request is sent with X-User-Role set to the literal string BILLING_BOT, which is not a declared role"
            - "${role_unknown_err} == ERR_UNAUTHENTICATED with HTTP 401"
            - "no Patient row exists with email c46@example.com"

  - section: consistency_model
    instances:
      - name: severe_adverse_event_cascade_is_visible_in_the_same_request
        claim_type: immediate
        grounds: [state_machines.StandingOrder.ACTIVE_to_SUSPENDED, state_machines.Procedure.CONSENTED_to_SUPPLY_HOLD]
        excluded_because:
          difficulty_instance: "transitive_cascade / severe_adverse_event_four_hop_cascade_reaches_other_patients"
          rationale: "That instance asserts the order, the two procedures, both lots and both patients immediately after the single POST that fired the cascade, which is exactly the immediate-consistency claim."

      - name: lot_recall_cascade_is_visible_in_the_same_request
        claim_type: immediate
        grounds: [state_machines.PelletLot.RELEASED_to_RECALLED]
        excluded_because:
          difficulty_instance: "transitive_cascade / lot_recall_five_hop_cascade_with_excluded_legs"
          rationale: "All five hops, including the minted notification and surveillance event, are asserted straight after the single recall call."
