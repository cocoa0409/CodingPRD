              as: Broker
              as_user_id: "${brk_x}"
            - call: "POST /bpo/valuation-orders/${ord_x1}/comparables/${cmp_x13}/select"
              payload: {}
              as: Broker
              as_user_id: "${brk_x}"
            - call: "POST /bpo/valuation-orders/${ord_x1}/photos"
              payload: { photo_kind: "FRONT", file_url: "https://x/f.jpg", captured_at: "2026-08-01T01:00:00Z" }
              as: Broker
              as_user_id: "${brk_x}"
            - call: "POST /bpo/valuation-orders/${ord_x1}/photos"
              payload: { photo_kind: "STREET", file_url: "https://x/s.jpg", captured_at: "2026-08-01T01:01:00Z" }
              as: Broker
              as_user_id: "${brk_x}"
            - call: "POST /bpo/valuation-orders/${ord_x1}/fee-lines"
