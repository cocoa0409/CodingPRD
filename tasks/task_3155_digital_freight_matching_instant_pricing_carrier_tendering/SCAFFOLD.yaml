# =============================================================================
# PRD Benchmark Seed Tables — task_3155
# Digital Freight Matching with Instant Pricing & Carrier Tendering
# Difficulty target: far beyond §0.4 "Expert" (density-first, 14 entities,
# 20 calculations, 9 layered complexity dimensions)
# =============================================================================

scenario: |
  Digital Freight Matching with Instant Pricing & Carrier Tendering (Uber Freight): shipper load posting with instant price quotes derived from lane, equipment, timing and market conditions, carrier app browsing with booked-price certainty rather than negotiation, carrier onboarding with operating authority, insurance and safety score verification, appointment scheduling at facilities with dwell time tracking and detention accessorial computation, tracking through driver app location with automated status updates to the shipper, dedicated and contract lane commitments alongside spot pricing, claims handling for damaged freight with carrier liability limits, carrier payment terms including quick pay discounts

domain_name: digital-freight-matching
api_prefix: /v1

complexity_profile:
  primary_archetype: Pricing engine
  secondary_archetype: Temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - contagion_risk_propagation
    - selector_policy
    - scheduled_deferred_actions
    - bulk_operations
    - idempotency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Shipper
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the shipper of record" }
      - { name: billing_state_code, type: string, source: input, description: "Two-letter US state code used for settlement tax routing" }
      - { name: payment_terms_days, type: integer, source: input, description: "Net payment terms in calendar days applied to carrier settlements" }
      - { name: quick_pay_discount_pct, type: number, source: input, description: "Maximum early-payout discount offered to carriers at a 100% payout rate" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding booked-rate exposure the platform will carry" }
      - { name: credit_used_cents, type: integer, source: computed, default: 0, description: "Booked-rate exposure currently reserved plus invoiced but unpaid; debited on booking, debited further on settlement, credited on settlement payment or reversal" }
      - { name: credit_available_cents, type: integer, source: computed, description: "= credit_limit_cents - credit_used_cents" }
      - { name: load_credit_limit, type: integer, source: input, description: "Count of loads the shipper may have in POSTED status concurrently" }
      - { name: load_credits_committed, type: integer, source: computed, default: 0, description: "Count of loads currently holding a posting credit (POSTED, BOOKED, or UNCOVERED) — incremented on post, decremented on cancel or void" }
      - { name: load_credits_available, type: integer, source: computed, description: "= load_credit_limit - load_credits_committed" }
      - { name: blocked_carrier_ids, type: array, source: system, default: [], description: "Carriers the shipper has barred from tendering on its loads" }
      - { name: breached_pickup_count, type: integer, source: computed, default: 0, description: "Count of this shipper's loads whose actual pickup breached the pickup window" }
      - { name: last_repriced_lane, type: string, source: system, description: "Lane key (ORIGIN_STATE>DEST_STATE) of the most recently repriced quote, or null when none has been repriced" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Carrier legal name as filed with the FMCSA" }
      - { name: mc_number, type: string, source: input, description: "Motor carrier docket number; unique across carriers" }
      - { name: dot_number, type: string, source: input, description: "USDOT number" }
      - { name: operating_authority_status, type: enum, source: system, default: NONE, description: "NONE | PENDING | ACTIVE | REVOKED" }
      - { name: authority_verified_at, type: datetime, source: system, description: "When operating authority was verified" }
      - { name: insurance_expires_at, type: datetime, source: input, description: "Expiry of the liability certificate on file" }
      - { name: insurance_liability_limit_cents, type: integer, source: input, description: "Auto liability limit on file" }
      - { name: cargo_coverage_limit_cents, type: integer, source: input, description: "Cargo coverage limit on file" }
      - { name: insurance_attested_at, type: datetime, source: system, description: "When the current certificate was attested" }
      - { name: certificate_reference, type: string, source: input, default: null, description: "Certificate of insurance reference supplied at attestation" }
      - { name: safety_score, type: number, source: input, description: "FMCSA-style safety score supplied at onboarding" }
      - { name: equipment_types, type: array, source: input, description: "Equipment classes the carrier operates" }
      - { name: claims_clawback_count, type: integer, source: computed, default: 0, description: "Count of approved claims clawed back against this carrier's settlements" }
      - { name: operational_risk_score, type: number, source: computed, default: 100.0, description: "= 100 minus 8 per breached pickup load, 12 per approved-or-settled claim, 5 per clawback; clamped to [0, 100]" }
      - { name: suspension_reason, type: string, source: system, default: null, description: "Reason code recorded on suspension" }
      - { name: status, type: enum, source: system, description: "PENDING | AUTHORITY_VERIFIED | INSURANCE_ON_FILE | VERIFIED | SUSPENDED" }

  - name: CarrierEquipment
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; owning carrier of this unit" }
      - { name: equipment_type, type: enum, source: input, description: "DRY_VAN | REEFER | FLATBED" }
      - { name: unit_number, type: string, source: input, description: "Carrier-assigned tractor or trailer unit number; unique within a carrier" }
      - { name: driver_name, type: string, source: input, description: "Assigned driver of record" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED | IN_SHOP" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code; lane keys derive from origin and destination state codes" }
      - { name: dock_capacity, type: integer, source: input, description: "Number of dock positions bookable per calendar day" }
      - { name: default_appointment_minutes, type: integer, source: input, default: 60, description: "Default scheduled dwell for an appointment slot" }
      - { name: free_dwell_minutes, type: integer, source: input, default: 120, description: "Dwell minutes absorbed by the facility before detention accrues" }
      - { name: detention_rate_per_hour_cents, type: integer, source: input, description: "Detention rate applied per started billable hour" }
      - { name: docks_committed_today, type: integer, source: computed, default: 0, description: "Count of SCHEDULED or IN_PROGRESS appointment slots on the facility's current logical date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED" }

  - name: LaneContract
    parent: null
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: input, description: "FK -> Shipper.id; shipper holding the dedicated commitment" }
      - { name: origin_facility_id, type: string, source: input, description: "FK -> Facility.id; contracted origin" }
      - { name: destination_facility_id, type: string, source: input, description: "FK -> Facility.id; contracted destination" }
      - { name: equipment_type, type: enum, source: input, description: "DRY_VAN | REEFER | FLATBED" }
      - { name: committed_weekly_volume, type: integer, source: input, description: "Loads per ISO week the carrier committed to haul at the contract rate" }
      - { name: committed_rate_cents, type: integer, source: input, description: "All-in contract rate per load, independent of mileage" }
      - { name: accessorial_allowance_cents, type: integer, source: input, description: "Accessorial spend the contract absorbs per load before the carrier bills overage" }
      - { name: start_date, type: datetime, source: input, description: "Contract term start" }
      - { name: end_date, type: datetime, source: input, description: "Contract term end" }
      - { name: loads_committed_this_period, type: integer, source: computed, default: 0, description: "Count of contract draws in the ISO week containing the most recent draw, tie-broken by created_at ASC" }
      - { name: period_start, type: datetime, source: system, description: "Monday 00:00:00Z of the ISO week whose draws loads_committed_this_period counts" }
      - { name: contract_carrier_ids, type: array, source: input, description: "Carriers eligible to draw against this commitment" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED" }

  - name: Load
    parent: null
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: input, description: "FK -> Shipper.id; shipper offering the load" }
      - { name: origin_facility_id, type: string, source: input, description: "FK -> Facility.id; pickup facility" }
      - { name: destination_facility_id, type: string, source: input, description: "FK -> Facility.id; delivery facility" }
      - { name: lane_contract_id, type: string, source: input, default: null, description: "FK -> LaneContract.id; set only for CONTRACT pricing mode" }
      - { name: lane_key, type: string, source: computed, description: "= '<origin_state_code>>_<destination_state_code>' resolved from both facilities" }
      - { name: pricing_mode, type: enum, source: input, description: "SPOT | CONTRACT" }
      - { name: market_band, type: enum, source: input, default: BALANCED, description: "OPEN | BALANCED | TIGHT — prevailing market band for this load's equipment class; drives the market-level lookup in every pricing calculation" }
      - { name: equipment_type, type: enum, source: input, description: "DRY_VAN | REEFER | FLATBED" }
      - { name: commodity, type: enum, source: input, description: "GENERAL | TEMPERATURE_CONTROLLED | HAZMAT | HIGH_VALUE" }
      - { name: weight_lbs, type: integer, source: input, description: "Gross weight in pounds; prorates the final claim liability on a 44000-lb truckload basis" }
      - { name: declared_cargo_value_cents, type: integer, source: input, description: "Value the shipper declared for the cargo on this load; the claim price cap is 1.5x this figure" }
      - { name: distance_miles, type: number, source: input, description: "Lane mileage; floored at MIN_MILES for pricing" }
      - { name: pickup_window_start, type: datetime, source: input, description: "Start of the pickup window" }
      - { name: pickup_window_end, type: datetime, source: input, description: "End of the pickup window; actual pickup beyond TOLERANCE_MINUTES past this instant is a compliance breach" }
      - { name: delivery_deadline, type: datetime, source: input, description: "Contractual delivery deadline used for the tracking ETA projection" }
      - { name: posted_rate_cents, type: integer, source: computed, default: null, description: "Locked instant quote in cents; written once when the load is posted and never recomputed" }
      - { name: booked_rate_cents, type: integer, source: computed, default: null, description: "Final booked price in cents; equals posted_rate_cents whenever no reprice fires" }
      - { name: reprice_count, type: integer, source: system, default: 0, description: "Number of times a quote for this load was superseded by a reprice" }
      - { name: repost_count, type: integer, source: system, default: 0, description: "Number of times an uncovered load was reposted" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; Carrier of record once booked; null while unbooked" }
      - { name: equipment_id, type: string, source: system, description: "FK -> CarrierEquipment.id; Equipment unit of record once booked; null while unbooked" }
      - { name: accessorial_total_cents, type: integer, source: computed, default: 0, description: "= sum of detention_charge_cents over the load's OPEN and CLOSED detention events; WAIVED events are excluded" }
      - { name: actual_pickup_at, type: datetime, source: system, default: null, description: "Server-stamped instant of the first AT_PICKUP tracking ping; null until the driver arrives" }
      - { name: pickup_breach_flag, type: boolean, source: computed, default: false, description: "True when actual_pickup_at exceeds pickup_window_end by more than TOLERANCE_MINUTES" }
      - { name: tracking_status_rank, type: integer, source: computed, default: 0, description: "Greatest status rank observed across this load's tracking pings" }
      - { name: shipper_version, type: integer, source: computed, description: "Mirror of the owning Shipper's version, refreshed whenever this load is read or written; the client-facing value for expected_shipper_version on guarded writes" }
      - { name: projected_delay_minutes, type: integer, source: computed, default: 0, description: "Non-negative minutes by which the projected ETA exceeds delivery_deadline" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | UNCOVERED | BOOKED | IN_TRANSIT | DELIVERED | INVOICED | PAID | CANCELLED | VOIDED" }

  - name: RateQuote
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: input, description: "FK -> Load.id; the load this quote prices" }
      - { name: quote_kind, type: enum, source: system, description: "INITIAL | REPRICED" }
      - { name: base_rate_cents, type: integer, source: computed, description: "Line-haul plus fuel in cents at the market level in force when the quote was created" }
      - { name: repriced_rate_cents, type: integer, source: computed, default: null, description: "Recomputed line-haul plus fuel at the market level in force at the booking instant; null until a reprice fires" }
      - { name: effective_miles, type: number, source: computed, description: "= max(load.distance_miles, MIN_MILES)" }
      - { name: quoted_cents_per_mile, type: number, source: computed, description: "= base_rate_cents / effective_miles, rounded to 4 decimals" }
      - { name: market_level_cents_per_mile, type: integer, source: computed, description: "Market price level in force when the quote was created" }
      - { name: acceptance_deadline, type: datetime, source: system, description: "Created_at plus QUOTE_TTL_HOURS; a quote becomes expirable once the logical clock reaches this instant" }
      - { name: viewed_carrier_ids, type: array, source: system, default: [], description: "Carriers that have opened this quote in the carrier app" }
      - { name: declined_carrier_ids, type: array, source: system, default: [], description: "Carriers that have declined this quote" }
      - { name: min_rate_cents, type: integer, source: computed, description: "Floor below which the platform will not tender; the acceptance path never books below it" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VIEWED | DECLINED | ACCEPTED | SUPERSEDED | EXPIRED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: input, description: "FK -> Load.id; load being tendered" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; tendering carrier" }
      - { name: rate_quote_id, type: string, source: input, description: "FK -> RateQuote.id; the quote whose price is locked" }
      - { name: equipment_id, type: string, source: input, description: "FK -> CarrierEquipment.id; committed equipment unit" }
      - { name: agreed_rate_cents, type: integer, source: system, description: "Final booked price; equals the quote's locked price unless a reprice or contract draw changed it" }
      - { name: booked_at, type: datetime, source: system, description: "Server-stamped booking instant; drives the late-booking reprice window and the settlement accrual clock" }
      - { name: booking_window_start, type: datetime, source: system, description: "Start of the buffered equipment window; equals load.pickup_window_start" }
      - { name: booking_window_end, type: datetime, source: system, description: "End of the buffered equipment window; equals load.pickup_window_end" }
      - { name: appointment_id, type: string, source: system, description: "FK -> AppointmentSlot.id; PICKUP appointment synthesized at booking" }
      - { name: contract_lane_draw, type: boolean, source: computed, default: false, description: "True when this booking drew against a LaneContract commitment" }
      - { name: quick_pay_elected, type: boolean, source: computed, default: false, description: "True once the carrier elects accelerated payout" }
      - { name: quick_pay_discount_cents, type: integer, source: computed, default: 0, description: "Discount withheld from the carrier's settlement when quick pay is elected" }
      - { name: settled_at, type: datetime, source: system, default: null, description: "When the carrier settlement for this booking was paid" }
      - { name: status, type: enum, source: system, description: "PENDING_APPOINTMENT | IN_TRANSIT | DELIVERED | SETTLED | CANCELLED" }

  - name: AppointmentSlot
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility whose dock this slot occupies" }
      - { name: load_id, type: string, source: input, default: null, description: "FK -> Load.id; the load served, or null for a capacity-only hold" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrier that will service the slot" }
      - { name: slot_kind, type: enum, source: input, description: "PICKUP | DELIVERY" }
      - { name: dock_position, type: integer, source: input, description: "Dock position 1..facility.dock_capacity" }
      - { name: window_start, type: datetime, source: input, description: "Start of the scheduled window" }
      - { name: window_end, type: datetime, source: input, description: "End of the scheduled window; must be strictly after window_start" }
      - { name: scheduled_date, type: datetime, source: input, description: "Calendar date at 00:00:00Z that the daily dock capacity counts against" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | MISSED | CANCELLED" }

  - name: DetentionEvent
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> AppointmentSlot.id; appointment during which dwell accrued" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility that owes the detention" }
      - { name: load_id, type: string, source: input, description: "FK -> Load.id; load whose accessorial total absorbs the charge" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrier owed the detention" }
      - { name: arrived_at, type: datetime, source: input, description: "Gate-in instant" }
      - { name: departed_at, type: datetime, source: input, default: null, description: "Gate-out instant; null while the unit is still on site" }
      - { name: dwell_minutes, type: integer, source: computed, default: 0, description: "= floor((departed_at - arrived_at) in minutes); 0 while departed_at is null" }
      - { name: billable_detention_minutes, type: integer, source: computed, default: 0, description: "= max(0, dwell_minutes - facility.free_dwell_minutes)" }
      - { name: detention_charge_cents, type: integer, source: computed, default: 0, description: "= ceil(billable_detention_minutes / 60) * facility.detention_rate_per_hour_cents; 0 when billable minutes are 0" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | WAIVED" }

  - name: TrackingPing
    parent: null
    common_fields: false
    fields:
      - { name: load_id, type: string, source: input, description: "FK -> Load.id; load being tracked" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrier whose driver app reported" }
      - { name: sequence, type: integer, source: system, description: "Server-assigned monotone per-load counter starting at 1; the only ordering key for pings" }
      - { name: reported_status, type: enum, source: input, description: "EN_ROUTE_PICKUP | AT_PICKUP | IN_TRANSIT | AT_DELIVERY | DELIVERED" }
      - { name: status_rank, type: integer, source: computed, description: "1 for EN_ROUTE_PICKUP, 2 AT_PICKUP, 3 IN_TRANSIT, 4 AT_DELIVERY, 5 DELIVERED" }
      - { name: location_code, type: string, source: input, description: "Geohash-style coarse location code" }
      - { name: eta_utc, type: datetime, source: input, default: null, description: "Driver-reported projected delivery instant" }
      - { name: recorded_at, type: datetime, source: system, description: "Server-stamped logical-clock instant of receipt" }

  - name: StatusEvent
    parent: null
    common_fields: false
    fields:
      - { name: load_id, type: string, source: input, description: "FK -> Load.id; load the event belongs to" }
      - { name: event_type, type: enum, source: input, description: "BOOKED | POSTED | UNCOVERED | DISPATCHED | ARRIVED_PICKUP | DEPARTED_PICKUP | ARRIVED_DELIVERY | DELIVERED | EXCEPTION" }
      - { name: source, type: enum, source: system, description: "DRIVER_APP | SHIPPER_PORTAL | PLATFORM" }
      - { name: occurred_at, type: datetime, source: system, description: "Server-stamped occurrence instant" }
      - { name: note, type: string, source: input, default: null, description: "Free-text annotation" }

  - name: ClaimsCase
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: input, description: "FK -> Load.id; load on which damage occurred" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrier whose liability is asserted" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Cargo value claimed by the shipper" }
      - { name: damage_description, type: string, source: input, description: "Damage narrative" }
      - { name: filed_by_role, type: enum, source: input, description: "SHIPPER | CARRIER" }
      - { name: liability_limit_cents, type: integer, source: computed, description: "Carrier liability limit captured at filing: min(cargo_coverage_limit_cents, commodity cap)" }
      - { name: price_cap_cents, type: integer, source: computed, description: "= round_half_up(load.declared_cargo_value_cents * PRICE_CAP_MULTIPLIER)" }
      - { name: provisional_liability_cents, type: integer, source: computed, default: 0, description: "= min(claimed, liability_limit, price_cap); written at review" }
      - { name: approved_amount_cents, type: integer, source: computed, default: 0, description: "= round_half_up(provisional_liability_cents * min(1, weight_lbs / TRUCKLOAD_WEIGHT_LBS)); written at approval" }
      - { name: review_rounds, type: integer, source: system, default: 0, description: "Count of completed review rounds; increments on each return to UNDER_REVIEW" }
      - { name: escalated, type: boolean, source: system, default: false, description: "True when the case was escalated instead of decided" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED | ESCALATED | SETTLED" }

  - name: CarrierSettlement
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; payee carrier" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking being paid for" }
      - { name: load_id, type: string, source: input, description: "FK -> Load.id; load being paid for" }
      - { name: line_haul_cents, type: integer, source: computed, default: 0, description: "Agreed rate for the move" }
      - { name: accessorial_cents, type: integer, source: computed, default: 0, description: "Load's accessorial total at the moment the settlement is written or recomputed" }
      - { name: claims_deduction_cents, type: integer, source: computed, default: 0, description: "Cargo liability withheld from the carrier; grows as claims are approved against this booking" }
      - { name: gross_payable_cents, type: integer, source: computed, default: 0, description: "= line_haul_cents + accessorial_cents - claims_deduction_cents" }
      - { name: quick_pay_discount_cents, type: integer, source: computed, default: 0, description: "= round_half_up(gross_payable_cents * quick-pay tier rate); subtracted after the gross is struck" }
      - { name: net_payable_cents, type: integer, source: computed, default: 0, description: "= gross_payable_cents - quick_pay_discount_cents" }
      - { name: payout_due_at, type: datetime, source: computed, default: null, description: "= settlement basis instant plus shipper payment_terms_days; basis is delivered_at, or settlement created_at while undelivered" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "When payout was executed" }
      - { name: reversal_of_settlement_id, type: string, source: system, default: null, description: "FK -> CarrierSettlement.id; the settlement this row reverses, null for forward rows" }
      - { name: settlement_status, type: enum, source: system, description: "ACCRUED | READY | PAID | CLAWED_BACK | REVERSED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Carrier
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: AUTHORITY_VERIFIED
        trigger: POST /v1/carriers/{carrierId}/verify-authority
        actor: ComplianceReviewer
        preconditions:
          - "mc_number is non-empty and unique across carriers (ERR_DUPLICATE_MC_NUMBER)"
          - "operating_authority_status must not already be REVOKED (ERR_AUTHORITY_REVOKED)"
        side_effects:
          - "operating_authority_status=ACTIVE; authority_verified_at=clock now"

      - from: AUTHORITY_VERIFIED
        to: INSURANCE_ON_FILE
        trigger: POST /v1/carriers/{carrierId}/attest-insurance
        actor: ComplianceReviewer
        preconditions:
          - "insurance_expires_at must be strictly after the logical clock (ERR_INSURANCE_EXPIRED)"
          - "insurance_liability_limit_cents >= 75000000 (ERR_INSURANCE_LIMIT_BELOW_MINIMUM)"
          - "cargo_coverage_limit_cents >= 100000000 (ERR_CARGO_COVERAGE_BELOW_MINIMUM)"
        side_effects:
          - "insurance_attested_at=clock now"
          - "cargo_coverage_limit_cents becomes the default liability limit for claims filed against this carrier"

      - from: INSURANCE_ON_FILE
        to: VERIFIED
        trigger: POST /v1/carriers/{carrierId}/verify-safety
        actor: ComplianceReviewer
        preconditions:
          - "safety_score <= 80.0 (ERR_SAFETY_SCORE_TOO_LOW)"
          - "At least one CarrierEquipment row exists for this carrier in status AVAILABLE (ERR_NO_EQUIPMENT_ON_FILE)"
        side_effects:
          - "calculation carrier_eligibility_gate now admits this carrier on the 40.0 risk floor and the VERIFIED status clause"
          - "status=VERIFIED; the carrier becomes eligible to have quotes placed in its bid board"

      - from: VERIFIED
        to: SUSPENDED
        trigger: "system (automatic when insurance_expires_at <= clock now on any read or write touching this carrier)"
        actor: system
        preconditions: []
        side_effects:
          - "calculation insurance_expiry_sweep drives this transition"
          - "suspension_reason=INSURANCE_EXPIRED"
          - "Every Booking of status PENDING_APPOINTMENT or IN_TRANSIT whose carrier_id is this carrier transitions to CANCELLED, releasing its equipment unit and its load to UNCOVERED"

      - from: VERIFIED
        to: SUSPENDED
        trigger: POST /v1/carriers/{carrierId}/suspend
        actor: PlatformAdmin
        preconditions:
          - "suspension_reason supplied in the request body"
        side_effects:
          - "Every Booking of status PENDING_APPOINTMENT or IN_TRANSIT whose carrier_id is this carrier transitions to CANCELLED, releasing its equipment unit and its load to UNCOVERED"

      - from: SUSPENDED
        to: INSURANCE_ON_FILE
        trigger: POST /v1/carriers/{carrierId}/reinstate
        actor: PlatformAdmin
        preconditions:
          - "insurance_expires_at must be strictly after the logical clock (ERR_INSURANCE_EXPIRED)"
          - "insurance_liability_limit_cents >= 75000000 and cargo_coverage_limit_cents >= 100000000"
        side_effects:
          - "suspension_reason=null; insurance_attested_at=clock now"

  - entity: Load
    initial_state: DRAFT
    terminal_states: [PAID, CANCELLED, VOIDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: POST /v1/loads/{loadId}/post
        actor: Shipper
        preconditions:
          - "shipper.load_credits_available >= 1 (ERR_LOAD_CREDIT_EXHAUSTED)"
          - "lane_contract_id is non-null whenever pricing_mode=CONTRACT, and that contract's status is ACTIVE and its start_date <= clock now < end_date (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "calculation quote_price_spot_vs_contract computes the quote's base_rate_cents: a RateQuote is synthesized with quote_kind=INITIAL and status=ACTIVE"
          - "load.posted_rate_cents and load.booked_rate_cents are locked to the quote's base_rate_cents"
          - "shipper.load_credits_committed += 1"
          - "shipper.credit_used_cents is NOT debited at post; the debit happens at booking"

      - from: POSTED
        to: BOOKED
        trigger: POST /v1/bookings
        actor: Carrier / PlatformAdmin broker
        preconditions:
          - "carrier.status == VERIFIED (ERR_CARRIER_NOT_VERIFIED)"
          - "shipper.credit_available_cents >= quote.min_rate_cents (ERR_SHIPPER_CREDIT_EXHAUSTED)"
          - "carrier_id not present in shipper.blocked_carrier_ids (ERR_CARRIER_BLOCKED)"
          - "carrier.operational_risk_score >= 40.0 (ERR_CARRIER_RISK_BLOCKED)"
          - "the chosen CarrierEquipment is not in status IN_SHOP and its equipment_type equals load.equipment_type; a unit already ASSIGNED to a disjoint window is permitted (ERR_EQUIPMENT_UNAVAILABLE)"
          - "quote.acceptance_deadline > clock now (ERR_QUOTE_EXPIRED)"
          - "no other Booking for the same CarrierEquipment with status IN {PENDING_APPOINTMENT, IN_TRANSIT} whose booking_window overlaps the requested window under zero-buffer half-open semantics (ERR_EQUIPMENT_WINDOW_CONFLICT) — evaluated BEFORE the dock check"
          - "after the equipment check passes, the dock selector finds a free dock_position whose buffered window does not overlap any SCHEDULED or IN_PROGRESS slot (ERR_APPOINTMENT_OVERLAP)"
        side_effects:
          - "carrier_id and equipment_id are written on the load"
          - "equipment.status=ASSIGNED"
          - "A PICKUP AppointmentSlot is synthesized with status=SCHEDULED, dock_position chosen by the facility selector, window_start=load.pickup_window_start, window_end=load.pickup_window_end; facility.docks_committed_today += 1"
          - "calculation booked_price_with_late_reprice fixes agreed_rate_cents on the Booking from the quote's locked price"
          - "calculation equipment_window_conflict and calculation appointment_dock_selector gate the booking and choose the dock position"
          - "calculation carrier_eligibility_gate gates the carrier before any price work"
          - "calculation dock_capacity_guard gates the synthesized appointment"
          - "calculation contract_committed_volume counts the draw when lane_contract_id is non-null"
          - "quote.status=ACCEPTED; all other ACTIVE or VIEWED quotes for this load become SUPERSEDED"
          - "shipper.credit_used_cents += agreed_rate_cents"
          - "A StatusEvent of type BOOKED with source PLATFORM is appended"

      - from: POSTED
        to: UNCOVERED
        trigger: "system (automatic when a posted load has zero quotes of status IN {ACTIVE, VIEWED} and the logical clock is at or past pickup_window_start minus 24 hours)"
        actor: system
        preconditions: []
        side_effects:
          - "calculation uncovered_load_sweep drives this transition"
          - "shipper.load_credits_committed is unchanged; the load still holds its credit"
          - "A StatusEvent of type UNCOVERED with source PLATFORM is appended"

      - from: UNCOVERED
        to: POSTED
        trigger: POST /v1/loads/{loadId}/repost
        actor: Shipper
        preconditions:
          - "repost_count < 3 (ERR_REPOST_LIMIT_REACHED)"
        side_effects:
          - "calculation repost_limit guards this transition"
          - "load.repost_count += 1"
          - "calculation quote_price_spot_vs_contract re-prices the fresh quote at the market level in force at the repost instant, with quote_kind=INITIAL"
          - "load.posted_rate_cents and load.booked_rate_cents are re-locked to the new quote's base_rate_cents; any prior quote becomes SUPERSEDED"

      - from: BOOKED
        to: IN_TRANSIT
        trigger: POST /v1/loads/{loadId}/tracking-pings with reported_status=IN_TRANSIT
        actor: Carrier
        preconditions:
          - "a tracking ping with status_rank >= 2 (AT_PICKUP) has already been recorded for this load (ERR_TRACKING_SEQUENCE_GAP)"
          - "request body carries sequence equal to load's current ping count + 1 (ERR_TRACKING_SEQUENCE_OUT_OF_ORDER)"
        side_effects:
          - "The load's PICKUP AppointmentSlot, currently IN_PROGRESS, becomes COMPLETED and its open DetentionEvent is CLOSED with departed_at=clock now; the load's accessorial_total_cents is recomputed"
          - "A StatusEvent of type DEPARTED_PICKUP with source DRIVER_APP is appended"
          - "A DELIVERY AppointmentSlot is synthesized for the destination facility with dock_position chosen by the facility selector, window_start = tracking ping eta_utc minus facility.default_appointment_minutes, window_end = eta_utc; if the eta_utc falls within the buffered window of an existing SCHEDULED or IN_PROGRESS slot on the chosen dock_position, the slot is placed on the first dock_position of the facility with a free buffered window, else with dock_position = facility.dock_capacity + 1 and status SCHEDULED is refused (ERR_APPOINTMENT_OVERLAP)"

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: POST /v1/loads/{loadId}/tracking-pings with reported_status=DELIVERED
        actor: Carrier
        preconditions:
          - "a tracking ping with status_rank >= 4 (AT_DELIVERY) has already been recorded for this load (ERR_TRACKING_SEQUENCE_GAP)"
        side_effects:
          - "The load's newest open DetentionEvent (status OPEN) is CLOSED with departed_at=clock now"
          - "calculation detention_charge computes the closed event; calculation load_accessorial_total recomputes the load's accessorial_total_cents over OPEN and CLOSED events"
          - "A CarrierSettlement is synthesized with settlement_status=ACCRUED, line_haul_cents=booking.agreed_rate_cents, accessorial_cents=load.accessorial_total_cents, and calculation settlement_net_payable strikes its gross and net"
          - "A StatusEvent of type DELIVERED with source DRIVER_APP is appended"

      - from: DELIVERED
        to: INVOICED
        trigger: POST /v1/bookings/{bookingId}/invoice
        actor: Shipper
        preconditions:
          - "load.status == DELIVERED (ERR_INVALID_STATE)"
          - "the load has no ClaimsCase of status FILED or UNDER_REVIEW or INFO_REQUESTED (ERR_OPEN_CLAIMS_BLOCK_SETTLEMENT)"
        side_effects:
          - "The booking's CarrierSettlement transitions ACCRUED → READY and its payout_due_at is mustered from delivered_at plus shipper.payment_terms_days"

      - from: INVOICED
        to: PAID
        trigger: POST /v1/carrier-settlements/{settlementId}/payout
        actor: PlatformAdmin
        preconditions:
          - "settlement.settlement_status == READY (ERR_INVALID_STATE)"
          - "retry_idempotency_key already used for this settlement returns the stored outcome instead of paying twice"
        side_effects:
          - "settlement.paid_at=clock now; settlement_status=PAID; booking.settled_at=clock now"
          - "shipper.credit_used_cents -= booking.agreed_rate_cents (the invoiced exposure is discharged)"

      - from: POSTED
        to: CANCELLED
        trigger: POST /v1/loads/{loadId}/cancel
        actor: Shipper
        preconditions: []
        side_effects:
          - "shipper.load_credits_committed -= 1"
          - "All RateQuotes for this load in status IN {ACTIVE, VIEWED} become SUPERSEDED"

      - from: UNCOVERED
        to: CANCELLED
        trigger: POST /v1/loads/{loadId}/cancel
        actor: Shipper
        preconditions: []
        side_effects:
          - "shipper.load_credits_committed -= 1"

      - from: BOOKED
        to: CANCELLED
        trigger: POST /v1/loads/{loadId}/cancel
        actor: Shipper
        preconditions:
          - "no tracking ping has been recorded for this load (ERR_INVALID_STATE)"
        side_effects:
          - "shipper.load_credits_committed -= 1"
          - "equipment.status=AVAILABLE"
          - "The synthesized PICKUP AppointmentSlot becomes CANCELLED"
          - "shipper.credit_used_cents -= booking.agreed_rate_cents; the booking transitions to CANCELLED"

      - from: IN_TRANSIT
        to: UNCOVERED
        trigger: POST /v1/bookings/{bookingId}/cancel-in-transit
        actor: PlatformAdmin
        preconditions:
          - "the booking's CarrierSettlement is not in status PAID (ERR_SETTLEMENT_ALREADY_PAID)"
        side_effects:
          - "booking.status=CANCELLED"
          - "equipment.status=AVAILABLE"
          - "shipper.credit_used_cents -= booking.agreed_rate_cents"
          - "the load returns to UNCOVERED so the shipper may repost it, and its posting credit remains committed"

      - from: INVOICED
        to: VOIDED
        trigger: POST /v1/loads/{loadId}/void
        actor: PlatformAdmin
        preconditions:
          - "retry_idempotency_key already used for this load returns the stored void instead of voiding twice"
        side_effects:
          - "The load's ACCRUED or READY CarrierSettlement becomes REVERSED and a compensating CarrierSettlement is synthesized with settlement_status=ACCRUED, reversal_of_settlement_id set to the reversed row, and the exact negated line_haul_cents, accessorial_cents, claims_deduction_cents, quick_pay_discount_cents, gross_payable_cents and net_payable_cents"
          - "shipper.load_credits_committed -= 1"
          - "load.status=VOIDED"

      - from: PAID
        to: VOIDED
        trigger: POST /v1/loads/{loadId}/void
        actor: PlatformAdmin
        preconditions:
          - "retry_idempotency_key already used for this load returns the stored void instead of voiding twice"
        side_effects:
          - "A compensating CarrierSettlement is synthesized with settlement_status=ACCRUED, reversal_of_settlement_id set to the paid row, exactly negating its line_haul_cents, accessorial_cents, claims_deduction_cents, quick_pay_discount_cents, gross_payable_cents and net_payable_cents; the forward row becomes REVERSED"
          - "shipper.load_credits_committed -= 1; load.status=VOIDED"

  - entity: RateQuote
    initial_state: ACTIVE
    terminal_states: [ACCEPTED, SUPERSEDED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: VIEWED
        trigger: POST /v1/rate-quotes/{quoteId}/view
        actor: Carrier
        preconditions:
          - "quote.acceptance_deadline > clock now (ERR_QUOTE_EXPIRED)"
          - "quote.load.status == POSTED (ERR_QUOTE_NOT_VIEWABLE)"
        side_effects:
          - "viewed_carrier_ids gains the acting carrier; quote.status=VIEWED"

      - from: ACTIVE
        to: ACCEPTED
        trigger: POST /v1/bookings
        actor: Carrier / PlatformAdmin broker
        preconditions:
          - "quote.load.status == POSTED (ERR_QUOTE_NOT_VIEWABLE)"
        side_effects:
          - "The load transitions POSTED → BOOKED"

      - from: VIEWED
        to: ACCEPTED
        trigger: POST /v1/bookings
        actor: Carrier / PlatformAdmin broker
        preconditions:
          - "quote.load.status == POSTED (ERR_QUOTE_NOT_VIEWABLE)"
        side_effects:
          - "The load transitions POSTED → BOOKED"

      - from: VIEWED
        to: VIEWED
        trigger: POST /v1/rate-quotes/{quoteId}/view
        actor: Carrier
        preconditions:
          - "quote.acceptance_deadline > clock now (ERR_QUOTE_EXPIRED)"
          - "quote.load.status == POSTED (ERR_QUOTE_NOT_VIEWABLE)"
        side_effects:
          - "viewed_carrier_ids gains the acting carrier; the status is unchanged"
        note: "Re-opening an already-seen quote is idempotent, so a rejected repeat open can only be blocked by the cross-entity load-status precondition."

      - from: VIEWED
        to: DECLINED
        trigger: POST /v1/rate-quotes/{quoteId}/decline
        actor: Carrier
        actor: Carrier
        preconditions:
          - "the acting carrier is not already present in declined_carrier_ids"
        side_effects:
          - "declined_carrier_ids gains the acting carrier; quote.status=DECLINED; the quote disappears from the carrier's cache board"

      - from: DECLINED
        to: VIEWED
        trigger: "system (automatic when any carrier that had not yet declined or viewed opens the quote again after the shipper reposts the load)"
        actor: system
        preconditions: []
        side_effects:
          - "declined_carrier_ids is reset to the empty list; quote.status returns to ACTIVE"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when the load is booked, reposted, or a reprice fires)"
        actor: system
        preconditions: []
        side_effects: []

      - from: VIEWED
        to: SUPERSEDED
        trigger: "system (automatic when the load is booked, reposted, or a reprice fires)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUPERSEDED
        to: ACTIVE
        trigger: POST /v1/loads/{loadId}/repost
        actor: Shipper
        preconditions:
          - "repost_count < 3 (ERR_REPOST_LIMIT_REACHED)"
        side_effects:
          - "The load's newest non-ACCEPTED quote becomes ACTIVE again, its declined_carrier_ids is cleared, and its acceptance_deadline is reset to clock now plus QUOTE_TTL_HOURS"

      - from: DECLINED
        to: ACTIVE
        trigger: POST /v1/loads/{loadId}/repost
        actor: Shipper
        preconditions:
          - "repost_count < 3 (ERR_REPOST_LIMIT_REACHED)"
        side_effects:
          - "The declined quote becomes ACTIVE again, its declined_carrier_ids is cleared, and its acceptance_deadline is reset to clock now plus QUOTE_TTL_HOURS"
        note: "DECLINED is therefore not terminal: a repost returns the same quote row to the board."

      - from: EXPIRED
        to: ACTIVE
        trigger: POST /v1/loads/{loadId}/repost
        actor: Shipper
        preconditions:
          - "repost_count < 3 (ERR_REPOST_LIMIT_REACHED)"
        side_effects:
          - "The expired quote becomes ACTIVE again with a fresh acceptance_deadline of clock now plus QUOTE_TTL_HOURS"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when the logical clock reaches acceptance_deadline and the quote has not been accepted)"
        actor: system
        preconditions: []
        side_effects:
          - "The quote is no longer placeable on any carrier's bid board"

      - from: VIEWED
        to: EXPIRED
        trigger: "system (automatic when the logical clock reaches acceptance_deadline and the quote has not been accepted)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AppointmentSlot
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: POST /v1/appointments/{appointmentId}/reschedule
        actor: Carrier
        preconditions:
          - "The requested window_start is strictly before the slot's current window_start (ERR_RESCHEDULE_ONLY_EARLIER)"
          - "The chosen dock_position has no SCHEDULED or IN_PROGRESS slot whose window overlaps the requested window expanded by 120 minutes on both sides, excluding this slot itself (ERR_APPOINTMENT_OVERLAP)"
          - "facility.docks_committed_today < facility.dock_capacity on the requested scheduled_date (ERR_DOCK_CAPACITY_EXCEEDED)"
        side_effects:
          - "window_start and window_end are rewritten; dock_position may change; status=IN_PROGRESS"
          - "An OPEN DetentionEvent is synthesized with arrived_at=clock now"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: POST /v1/loads/{loadId}/tracking-pings with reported_status=AT_PICKUP or AT_DELIVERY
        actor: Carrier
        preconditions:
          - "request body carries sequence equal to load's current ping count + 1 (ERR_TRACKING_SEQUENCE_OUT_OF_ORDER)"
        side_effects:
          - "An OPEN DetentionEvent is synthesized with arrived_at=clock now"
          - "A StatusEvent of type ARRIVED_PICKUP or ARRIVED_DELIVERY with source DRIVER_APP is appended"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (automatic when the load is delivered, or when POST /v1/appointments/{appointmentId}/complete is called)"
        actor: system
        preconditions: []
        side_effects:
          - "The slot's open DetentionEvent is CLOSED with departed_at=clock now"
          - "The load's accessorial_total_cents is recomputed from the sum of OPEN and CLOSED detention charges"

      - from: IN_PROGRESS
        to: MISSED
        trigger: "system (automatic when the logical clock is strictly after window_end plus 60 minutes and the slot is still IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects:
          - "calculation pickup_breach_detection sets load.pickup_breach_flag when slot_kind=PICKUP and load.actual_pickup_at exceeds pickup_window_end by more than TOLERANCE_MINUTES"
          - "calculation overdue_appointment_sweep drives this transition"
          - "shipper.breached_pickup_count += 1 ONLY when that flag was actually written by this transition, so a missed slot on a load with no AT_PICKUP ping adds nothing"
          - "calculation carrier_operational_risk_score is recomputed; the carrier's 8-point breach penalty applies once per breached load"

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /v1/appointments/{appointmentId}/cancel
        actor: Carrier
        preconditions: []
        side_effects:
          - "facility.docks_committed_today -= 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (automatic when the delayed driver's load is cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "facility.docks_committed_today -= 1"

      - from: CANCELLED
        to: SCHEDULED
        trigger: POST /v1/appointments/{appointmentId}/restore
        actor: Carrier
        preconditions:
          - "facility.docks_committed_today < facility.dock_capacity on the slot's scheduled_date (ERR_DOCK_CAPACITY_EXCEEDED)"
        side_effects:
          - "status=SCHEDULED; facility.docks_committed_today += 1"

  - entity: ClaimsCase
    initial_state: FILED
    terminal_states: [APPROVED, DENIED, SETTLED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: POST /v1/claims/{claimId}/review
        actor: ClaimsAdjuster
        preconditions:
          - "review_rounds == 0 (ERR_CLAIM_ALREADY_REVIEWED)"
          - "the load has a DELIVERED, INVOICED or PAID status (ERR_CLAIM_BEFORE_DELIVERY)"
        note: "Filing itself only requires the load to have left DRAFT; it is the REVIEW transition that requires a delivered load, which is the cross-entity gate."
        side_effects:
          - "calculation claim_provisional_liability writes liability_limit_cents, price_cap_cents and provisional_liability_cents"
          - "review_rounds += 1"

      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: POST /v1/claims/{claimId}/request-info
        actor: ClaimsAdjuster
        preconditions:
          - "review_rounds <= MAX_REVIEW_ROUNDS (ERR_CLAIM_REVIEW_ROUNDS_EXHAUSTED)"
        side_effects:
          - "review_rounds += 1; the case re-enters UNDER_REVIEW when new information is attached"

      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: POST /v1/claims/{claimId}/review
        actor: ClaimsAdjuster
        preconditions:
          - "review_rounds <= MAX_REVIEW_ROUNDS (ERR_CLAIM_REVIEW_ROUNDS_EXHAUSTED)"
        side_effects:
          - "review_rounds += 1; provisional_liability_cents is recomputed against the freshly captured liability_line_cents_limit_cents"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /v1/claims/{claimId}/approve
        actor: ClaimsAdjuster
        preconditions:
          - "review_rounds >= 1 (ERR_CLAIM_NOT_REVIEWED)"
          - "carrier.status is VERIFIED or SUSPENDED (ERR_CARRIER_NOT_FOUND otherwise); an APPROVED case against a suspended carrier is permitted and continues to claw back"
        side_effects:
          - "calculation claim_approved_amount writes approved_amount_cents"
          - "If the load's CarrierSettlement is ACCRUED or READY: claims_deduction_cents += approved_amount_cents and calculation settlement_net_payable restrikes gross_payable_cents, quick_pay_discount_cents and net_payable_cents"
          - "calculation carrier_operational_risk_score is recomputed with a 12-point penalty"
          - "carrier.claims_clawback_count += 1 whenever a deduction was actually taken against a settlement"

      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: POST /v1/claims/{claimId}/escalate
        actor: ClaimsAdjuster
        preconditions:
          - "provisional_liability_cents > 2500000 (ERR_ESCALATION_THRESHOLD_NOT_MET)"
        side_effects:
          - "escalated=true; the case leaves the adjuster queue"

      - from: INFO_REQUESTED
        to: DENIED
        trigger: POST /v1/claims/{claimId}/deny
        actor: ClaimsAdjuster
        preconditions:
          - "review_rounds >= 1 (ERR_CLAIM_NOT_REVIEWED)"
        side_effects:
          - "approved_amount_cents stays 0; no deduction is taken"

      - from: APPROVED
        to: SETTLED
        trigger: POST /v1/claims/{claimId}/settle
        actor: PlatformAdmin
        preconditions:
          - "carrier.status == VERIFIED (ERR_CARRIER_NOT_COMPLIANT)"
        side_effects:
          - "The approved_amount_cents is confirmed against the carrier's settlement; claims_clawback_count is NOT incremented a second time"

      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "system (automatic when the logical clock advances 14 days past the info request without new information, the case returns to review with review_rounds unchanged)"
        actor: system
        preconditions: []
        side_effects:
          - "review_rounds += 1"

  - entity: DetentionEvent
    initial_state: OPEN
    terminal_states: [CLOSED, WAIVED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system (automatic when the appointment completes or the load is delivered)"
        actor: system
        preconditions: []
        side_effects:
          - "calculation detention_charge sets departed_at, dwell_minutes, billable_detention_minutes and detention_charge_cents"
          - "calculation load_accessorial_total recomputes load.accessorial_total_cents over the load's OPEN and CLOSED events"
          - "If a CarrierSettlement for the load exists with settlement_status IN {ACCRUED, READY}: accessorial_cents is refreshed and gross_payable_cents, quick_pay_discount_cents and net_payable_cents are recomputed"

      - from: OPEN
        to: WAIVED
        trigger: POST /v1/detention-events/{detentionId}/waive
        actor: PlatformAdmin
        preconditions:
          - "reason_code must be one of FACILITY_FAULT, FORCE_MAJEURE, GOODWILL (ERR_WAIVE_REASON_REQUIRED)"
        side_effects:
          - "detention_charge_cents is set to 0 and the event is excluded from load.accessorial_total_cents, which is recomputed"
          - "If the load's CarrierSettlement is ACCRUED or READY, accessorial_cents, gross_payable_cents, quick_pay_discount_cents and net_payable_cents are recomputed"

  - entity: CarrierSettlement
    initial_state: ACCRUED
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: ACCRUED
        to: READY
        trigger: POST /v1/bookings/{bookingId}/invoice
        actor: Shipper
        preconditions:
          - "load.status == DELIVERED (ERR_INVALID_STATE)"
          - "the load has no open claims (ERR_OPEN_CLAIMS_BLOCK_SETTLEMENT)"
        side_effects:
          - "calculation settlement_payout_due_at sets payout_due_at = delivered_at + shipper.payment_terms_days"
          - "settlement_status=READY"

      - from: READY
        to: ACCRUED
        trigger: POST /v1/carrier-settlements/{settlementId}/unready
        actor: PlatformAdmin
        preconditions:
          - "the settlement has not been paid (ERR_INVALID_STATE)"
        side_effects:
          - "settlement_status=ACCRUED; payout_due_at is cleared"

      - from: READY
        to: PAID
        trigger: POST /v1/carrier-settlements/{settlementId}/payout
        actor: PlatformAdmin
        preconditions:
          - "clock now >= payout_due_at whenever the payout mode is TERMS; the QUICK_PAY mode is permitted strictly before payout_due_at (ERR_SETTLEMENT_NOT_DUE)"
          - "retry_idempotency_key already used for this settlement returns the stored outcome instead of paying twice"
        side_effects:
          - "paid_at=clock now; settlement_status=PAID"
          - "If the payout mode is QUICK_PAY: calculation quick_pay_discount_tier selects the tier rate from the carrier's preceding PAID settlements, and calculation settlement_net_payable restrikes quick_pay_discount_cents and net_payable_cents"
          - "booking.settled_at=clock now; shipper.credit_used_cents -= booking.agreed_rate_cents"

      - from: READY
        to: REVERSED
        trigger: POST /v1/carrier-settlements/{settlementId}/clawback
        actor: PlatformAdmin
        preconditions:
          - "an APPROVED ClaimsCase exists for the settlement's booking or load (ERR_NO_APPROVED_CLAIM)"
        side_effects:
          - "the approved amount is applied: claims_deduction_cents += approved_amount_cents and net_payable_cents is recomputed; claims_clawback_count += 1 on the carrier; carrier.operational_risk_score is recomputed with 5 points per clawback"
          - "settlement_status stays READY when the clawback is absorbed, and becomes REVERSED when the whole settlement is undone"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-load
    parent_entity: Load
    write_endpoint: "POST /v1/bookings"
    occ_field: "expected_load_version"
    description: |
      Creating a Booking against a Load whose version has advanced since the
      tendering carrier last read it is rejected. This captures the case where
      the shipper has just cancelled the load or another carrier has already
      booked it, so the tendering carrier's view of the load is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: load-repost-stale-shipper
    parent_entity: Shipper
    write_endpoint: "POST /v1/loads/{loadId}/repost"
    occ_field: "expected_shipper_version"
    description: |
      Reposting an uncovered Load against a Shipper whose version has advanced
      since the shipper last read it is rejected. Reposting legitimately
      supersedes the prior quote, so the check is against the shipper's own
      posting-credit state rather than the load's lifecycle.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-file-stale-carrier
    parent_entity: Carrier
    write_endpoint: "POST /v1/claims"
    occ_field: "expected_carrier_version"
    description: |
      Filing a ClaimsCase against a Carrier whose version has advanced since
      the filing party last read it is rejected. A cascade from an automatic
      suspension or an operational-risk recompute bumps the carrier's version,
      so any previously observed version is stale at filing time.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payout-stale-settlement
    parent_entity: CarrierSettlement
    write_endpoint: "POST /v1/carrier-settlements/{settlementId}/payout"
    occ_field: "expected_settlement_version"
    description: |
      Paying a CarrierSettlement whose version has advanced since the payer
      last read it is rejected. A claim approval or a detention close legitimately
      recomputes the settlement's deduction and accessorial lines in place, so a
      stale expected version must not be able to pay the pre-recompute amount.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: lane_key_derivation
    trigger: "Load creation and every read that resolves Load.lane_key"
    algorithm: aggregation
    formula: |
      lane_key = origin_state_code + ">" + destination_state_code
      where origin_state_code = Facility[load.origin_facility_id].state_code
            destination_state_code = Facility[load.destination_facility_id].state_code
    input_set: "Exactly one origin Facility and one destination Facility per Load; both must exist."
    precision: "string, no rounding"
    note: "lane_key is a five-character key of the form 'TX>CA'. Every lane-index and market-level lookup keys off this string."

  - name: lane_index
    trigger: "quote pricing"
    algorithm: threshold
    formula: |
      a1z26(code) = sum over characters c of (ord(c) - ord('A') + 1)
      raw = a1z26(origin_state_code) + a1z26(destination_state_code)
      lane_index = 1 + ((raw mod 11) / 20)
    input_set: "Derived from Load.lane_key only. No entity, id, or timestamp participates."
    constants:
      LANE_INDEX_MODULUS: 11
      LANE_INDEX_STEP: 20
    precision: "4 decimal places, round_half_up"
    note: "Deterministic pure function of the two state codes; 'TX>CA' yields raw=48, lane_index=1.2000."

  - name: quote_price_spot_vs_contract
    trigger: "POST /v1/loads/{loadId}/post and POST /v1/loads/{loadId}/repost"
    algorithm: tiered_pricing
    formula: |
      effective_miles = max(load.distance_miles, MIN_MILES)
      pickup_hour = UTC hour-of-day of load.pickup_window_start
      timing_band_multiple = TIMING_BAND_MULTIPLE(pickup_hour)     # bands are half-open
      weight_adjustment_multiple = 1.00 + WEIGHT_ADJUSTMENT(load.equipment_type, load.weight_lbs)
      commodity_multiple = COMMODITY_MULTIPLE(load.commodity)
      market_level = MARKET_LEVEL_CENTS_PER_MILE[load.equipment_type][load.market_band]

      SPOT variant:
        implied_cents_per_mile = market_level * lane_index * timing_band_multiple
                                 * weight_adjustment_multiple * commodity_multiple
        line_haul_and_fuel_cents = round_half_up(implied_cents_per_mile * effective_miles)
        base_rate_cents = max(line_haul_and_fuel_cents, MIN_RATE_FLOOR_CENTS)

      CONTRACT variant:
        base_rate_cents = max(load.lane_contract.committed_rate_cents, MIN_RATE_FLOOR_CENTS)
        # Flat per-load contract rate; lane_index, mileage, timing and commodity do NOT scale it.

      min_rate_cents = round_half_up(base_rate_cents * MIN_RATE_FLOOR_MULTIPLE)
    input_set: "Only Load fields plus the two Facility state codes. market_band is whatever band is in force on the Load at the quote instant."
    constants:
      MIN_MILES: 50
      MIN_RATE_FLOOR_CENTS: 50000
      MIN_RATE_FLOOR_MULTIPLE: 0.85
      MARKET_LEVEL_CENTS_PER_MILE:
        DRY_VAN: { OPEN: 210, BALANCED: 235, TIGHT: 275 }
        REEFER:  { OPEN: 250, BALANCED: 285, TIGHT: 330 }
        FLATBED: { OPEN: 230, BALANCED: 260, TIGHT: 305 }
      TIMING_BAND_MULTIPLE:
        "00:00-05:59": 0.95
        "06:00-14:59": 1.10
        "15:00-21:59": 1.00
        "22:00-23:59": 1.05
      WEIGHT_ADJUSTMENT:
        DRY_VAN: { THRESHOLD_LBS: 40000, MULTIPLE_ABOVE: 0.02 }
        REEFER:  { THRESHOLD_LBS: 40000, MULTIPLE_ABOVE: 0.03 }
        FLATBED: { THRESHOLD_LBS: null,   MULTIPLE_ABOVE: 0.00 }
      COMMODITY_MULTIPLE:
        GENERAL: 1.00
        TEMPERATURE_CONTROLLED: 1.15
        HAZMAT: 1.25
        HIGH_VALUE: 1.20
    precision: "cents are integers, round_half_up; lane_index keeps 4 decimals and is multiplied in at full precision"
    variants:
      - name: spot_market_rate
        when: "load.pricing_mode == SPOT"
        difference: "Mileage-scaled: market level per mile is multiplied by lane_index, the timing band, the weight adjustment and the commodity multiple, then by effective_miles."
      - name: contract_committed_rate
        when: "load.pricing_mode == CONTRACT"
        difference: "Flat: the LaneContract.committed_rate_cents is the base unchanged. On a 1200-mile TIGHT REEFER HAZMAT lane the spot variant prices far above the flat contract rate for identical load data."

  - name: reprice_booked_rate
    trigger: "POST /v1/loads/{loadId}/reprice"
    algorithm: tiered_pricing
    formula: |
      new_market_level = MARKET_LEVEL_CENTS_PER_MILE[load.equipment_type][request.new_market_band]
      implied_cents_per_mile = new_market_level * lane_index * timing_band_multiple
                               * weight_adjustment_multiple * commodity_multiple
      recomputed = round_half_up(implied_cents_per_mile * effective_miles)
      quote.repriced_rate_cents = max(recomputed, quote.min_rate_cents)
      quote.quote_kind = REPRICED
      load.booked_rate_cents = quote.repriced_rate_cents
      load.market_band = request.new_market_band
      load.reprice_count += 1
    input_set: "Applies only while load.status == POSTED. load.posted_rate_cents is NEVER recomputed."
    precision: "cents are integers, round_half_up"
    note: "posted_rate_cents is the immutable locked quote; booked_rate_cents is the live price. After one reprice they diverge, which is the entire point of the pair."

  - name: booked_price_with_late_reprice
    trigger: "POST /v1/bookings"
    algorithm: forward_looking
    formula: |
      quote_price_cents = quote.repriced_rate_cents if quote.quote_kind == REPRICED
                          else quote.base_rate_cents
      age_minutes = floor((clock now - quote.created_at) / 60s)

      LOCKED variant (age_minutes <= LOCK_WINDOW_MINUTES):
        agreed_rate_cents = quote_price_cents

      LIVE variant (age_minutes > LOCK_WINDOW_MINUTES):
        live_level = MARKET_LEVEL_CENTS_PER_MILE[load.equipment_type][load.market_band]
        implied = live_level * lane_index * timing_band_multiple
                  * weight_adjustment_multiple * commodity_multiple
        live_base = round_half_up(implied * effective_miles)
        agreed_rate_cents = max(round_half_up(live_base * (1 + LATE_BOOKING_SURCHARGE_PCT)),
                                quote.min_rate_cents)
    input_set: "The quote's own created_at plus the load's current market_band. Under LOCKED the load's band is irrelevant; under LIVE it is the only band that counts."
    constants:
      LOCK_WINDOW_MINUTES: 60
      LATE_BOOKING_SURCHARGE_PCT: 0.05
    precision: "cents are integers, round_half_up"
    variants:
      - name: locked_quote_price
        when: "booking arrives at most LOCK_WINDOW_MINUTES after the quote was created"
        difference: "agreed_rate_cents equals the quote price exactly, so a later reprice of the load's market_band has no effect on this booking."
      - name: live_surcharged_price
        when: "booking arrives strictly more than LOCK_WINDOW_MINUTES after the quote was created"
        difference: "The price is re-derived from the load's band at the booking instant and then grossed up by LATE_BOOKING_SURCHARGE_PCT, so the same quote on the same load books at a strictly higher price once the lock window lapses."

  - name: carrier_operational_risk_score
    trigger: "any Carrier mutation, pickup-breach detection, claim approval, settlement clawback, and every read that resolves Carrier.operational_risk_score"
    algorithm: weighted_scoring
    formula: |
      breached_load_count = count of Load rows with carrier_id == carrier.id
                            and pickup_breach_flag == true
      approved_claim_count = count of ClaimsCase rows with carrier_id == carrier.id
                            and status IN {APPROVED, SETTLED}
      raw = 100
            - (RISK_BREACH_PENALTY * breached_load_count)
            - (RISK_CLAIM_PENALTY * approved_claim_count)
            - (RISK_CLAWBACK_PENALTY * carrier.claims_clawback_count)
      operational_risk_score = clamp(raw, 0, 100)
    input_set: "Only loads whose carrier_id equals this carrier, and only claims in APPROVED or SETTLED. FILED, UNDER_REVIEW, INFO_REQUESTED, DENIED and ESCALATED claims score nothing."
    constants:
      RISK_BREACH_PENALTY: 8
      RISK_CLAIM_PENALTY: 12
      RISK_CLAWBACK_PENALTY: 5
      RISK_FLOOR: 0
      RISK_CEILING: 100
    precision: "1 decimal place, round_half_up"
    note: "The floor is 0, not a negative number: a carrier with 20 breaches scores exactly 0.0 and is then barred from booking by the 40.0 eligibility floor."

  - name: load_accessorial_total
    trigger: "any DetentionEvent transition on the load, and any read that resolves Load.accessorial_total_cents"
    algorithm: aggregation
    formula: |
      accessorial_total_cents = sum(
          detention_charge_cents
          for each DetentionEvent d
          where d.load_id == load.id
            and d.status IN {OPEN, CLOSED}
      )
    input_set: "DetentionEvent rows whose status is OPEN or CLOSED. WAIVED events are EXCLUDED and contribute 0 even though their pre-waive charge is still visible on the row."
    precision: "integer cents, exact sum, no intermediate rounding"
    note: "Order-insensitive: the sum is over a set, so no tie-break is required."

  - name: detention_charge
    trigger: "DetentionEvent OPEN → CLOSED, and every read that resolves a DetentionEvent"
    algorithm: threshold
    formula: |
      if departed_at is null: dwell_minutes = 0
      else: dwell_minutes = floor((departed_at - arrived_at) in whole minutes)
      billable_detention_minutes = max(0, dwell_minutes - facility.free_dwell_minutes)
      detention_hours = ceil(billable_detention_minutes / 60)
      detention_charge_cents = detention_hours * facility.detention_rate_per_hour_cents
    input_set: "The DetentionEvent row and its Facility's free_dwell_minutes and detention_rate_per_hour_cents as of the CLOSE instant."
    constants:
      MINUTES_PER_HOUR: 60
    precision: |
      ROUNDING ORDER IS PINNED: (1) floor the elapsed seconds to whole minutes,
      (2) subtract free_dwell_minutes, (3) clamp at 0, (4) ceil the billable
      minutes to whole hours, (5) multiply by the hourly rate. The rejected order —
      multiply per-minute then round the money — produces different cents and is WRONG.
    note: "dwell of exactly free_dwell_minutes bills 0. dwell of free_dwell_minutes + 1 bills one whole hour."

  - name: quick_pay_discount_tier
    trigger: "POST /v1/carrier-settlements/{settlementId}/payout with payout_mode=QUICK_PAY"
    algorithm: tiered_pricing
    formula: |
      prior_paid_count = count of CarrierSettlement rows
          where carrier_id == carrier.id
            and settlement_status == PAID
            and paid_at < clock now
          ordered by paid_at ASC, tie-broken by created_at ASC
      tier_rate = QUICK_PAY_TIER_RATE(prior_paid_count)
      quick_pay_discount_cents = round_half_up(gross_payable_cents * tier_rate)
    input_set: "Settlements already in status PAID for this carrier strictly before the payout instant. The settlement being paid is not counted."
    constants:
      QUICK_PAY_TIER_RATE:
        "0-4": 0.0300
        "5-19": 0.0250
        "20-49": 0.0200
        "50+": 0.0150
    precision: "4 decimal places on the rate; cents round_half_up"
    note: "The tier key is a COUNT, not a money amount. A carrier's 5th paid settlement crosses from the 0.0300 tier to the 0.0250 tier and therefore discounts a LARGER gross by a SMALLER rate."

  - name: settlement_net_payable
    trigger: "CarrierSettlement creation, accessorial recompute, claim approval, clawback, and payout"
    algorithm: aggregation
    evaluation_order: |
      Step 1: gross_payable_cents = line_haul_cents + accessorial_cents - claims_deduction_cents
      Step 2: quick_pay_discount_cents = round_half_up(gross_payable_cents * tier_rate)
              when booking.quick_pay_elected is true, else 0
      Step 3: net_payable_cents = gross_payable_cents - quick_pay_discount_cents
    formula: |
      line_haul_cents = booking.agreed_rate_cents
      accessorial_cents = load.accessorial_total_cents
      claims_deduction_cents = sum of approved_amount_cents over ClaimsCase rows
                              with load_id == load.id and status IN {APPROVED, SETTLED}
      gross_payable_cents = line_haul_cents + accessorial_cents - claims_deduction_cents
      quick_pay_discount_cents = 0 until booking.quick_pay_elected is true
      net_payable_cents = gross_payable_cents - quick_pay_discount_cents
    input_set: "Only claims in APPROVED or SETTLED. An ESCALATED or INFO_REQUESTED claim deducts nothing."
    precision: "integer cents, round_half_up at the single discount step"
    note: |
      Circular-looking but well-defined because the order is PINNED: gross is struck
      BEFORE the discount, the discount is taken on that gross (not on line haul alone),
      and net is struck last. The tier rate is chosen from the carrier's PRIOR paid
      settlements only, so net_payable_cents never feeds back into its own discount.

  - name: settlement_payout_due_at
    trigger: "POST /v1/bookings/{bookingId}/invoice"
    algorithm: forward_looking
    formula: |
      basis = load.actual_delivery_at if load.status IN {DELIVERED, INVOICED, PAID}
              else settlement.created_at
      payout_due_at = basis + shipper.payment_terms_days (calendar days)
    input_set: "The Shipper's payment_terms_days at the invoice instant, frozen onto the settlement."
    precision: "ISO 8601 UTC, three fractional digits"
    note: "TERMS payout is rejected strictly before payout_due_at; QUICK_PAY payout is permitted strictly before it. At exactly payout_due_at both are permitted."

  - name: claim_provisional_liability
    trigger: "POST /v1/claims/{claimId}/review"
    algorithm: threshold
    formula: |
      commodity_cap_cents = COMMODITY_LIABILITY_CAP[load.commodity]
      liability_limit_cents = min(carrier.cargo_coverage_limit_cents, commodity_cap_cents)
      price_cap_cents = round_half_up(load.declared_cargo_value_cents * PRICE_CAP_MULTIPLIER)
      provisional_liability_cents = min(claimed_amount_cents,
                                       liability_limit_cents,
                                       price_cap_cents)
    input_set: "The carrier's cargo_coverage_limit_cents frozen at the review instant; the load's commodity."
    constants:
      PRICE_CAP_MULTIPLIER: 1.5
      COMMODITY_LIABILITY_CAP:
        GENERAL: 100000000
        TEMPERATURE_CONTROLLED: 100000000
        HAZMAT: 100000000
        HIGH_VALUE: 250000000
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_liability
        when: "written at UNDER_REVIEW; not yet weight-prorated"
        difference: "Capped by the carrier's coverage limit and by 1.5x the load's declared cargo value, but NOT by the weight basis."
      - name: approved_liability
        when: "written at UNDER_REVIEW → APPROVED"
        difference: "The provisional figure is multiplied by min(1, weight_lbs / 44000) and rounded, so a 22000-lb partial truckload approves at exactly half the provisional liability while the provisional figure stays visible and unchanged."

  - name: claim_approved_amount
    trigger: "POST /v1/claims/{claimId}/approve"
    algorithm: threshold
    formula: |
      weight_basis = min(1.0, load.weight_lbs / TRUCKLOAD_WEIGHT_LBS)
      approved_amount_cents = round_half_up(provisional_liability_cents * weight_basis)
    input_set: "provisional_liability_cents written at the most recent review round, and load.weight_lbs."
    constants:
      TRUCKLOAD_WEIGHT_LBS: 44000
    precision: "cents round_half_up; weight_basis keeps full precision"
    note: "At weight_lbs exactly 44000 approved_amount_cents equals provisional_liability_cents; at 45000 the basis clamps to 1.0 rather than exceeding it."

  - name: pickup_breach_detection
    trigger: "first TrackingPing with reported_status=AT_PICKUP, and AppointmentSlot IN_PROGRESS → MISSED"
    algorithm: threshold
    formula: |
      if load.actual_pickup_at is null:  breach = false
      else:
        breach = (load.actual_pickup_at - load.pickup_window_end) > TOLERANCE_MINUTES
    input_set: "The AT_PICKUP ping instant stamped as load.actual_pickup_at, compared against the load's own pickup_window_end."
    constants:
      TOLERANCE_MINUTES: 30
    precision: "whole minutes; the comparison is strictly greater-than, so a pickup exactly 30 minutes past the window end is NOT a breach"
    note: "A pickup at exactly pickup_window_end + 30 minutes is on time; at +31 minutes it breaches, flags the load, increments Shipper.breached_pickup_count and applies the 8-point carrier penalty."

  - name: projected_delay_minutes
    trigger: "every TrackingPing creation and every read that resolves Load.projected_delay_minutes"
    algorithm: forward_looking
    formula: |
      newest_ping = the ping with the greatest sequence for this load
      if newest_ping.eta_utc is null:  projected_delay_minutes = 0
      else:
        slack_risk = clamp(carrier.operational_risk_score, 0, 100)
        slack_minutes = round_half_up((100 - slack_risk) * RISK_SLACK_MINUTES_PER_POINT)
        projected_eta = newest_ping.eta_utc + slack_minutes
        projected_delay_minutes = max(0, floor((projected_eta - load.delivery_deadline) / 60s))
    input_set: "Only the ping with the greatest sequence. Lower-sequence pings never contribute, even when they carry a later eta_utc."
    constants:
      RISK_SLACK_MINUTES_PER_POINT: 2.4
    precision: "minutes are integers; floor on the final division"
    note: "A perfect-risk carrier (100.0) adds zero slack, so its posted ETA stands. A carrier at 88.0 adds round_half_up(12 * 2.4) = 29 minutes of slack before the deadline comparison."

  - name: tracking_status_progression
    trigger: "POST /v1/loads/{loadId}/tracking-pings"
    algorithm: projection
    formula: |
      status_rank of EN_ROUTE_PICKUP, AT_PICKUP, IN_TRANSIT, AT_DELIVERY, DELIVERED
        = 1, 2, 3, 4, 5 respectively
      accepted = ping.sequence == count_of_existing_pings_for_load + 1
      AND ping.status_rank <= greatest_status_rank_of_existing_pings + 1
      load.tracking_status_rank = max(load.tracking_status_rank, ping.status_rank)
    input_set: "Every TrackingPing already recorded for the load. A rejected ping is stored nowhere."
    precision: "integers, no rounding"
    note: "The rank may only advance by one step at a time, so EN_ROUTE_PICKUP then IN_TRANSIT is rejected with ERR_TRACKING_SEQUENCE_GAP even though the sequence number is correct."

  - name: appointment_dock_selector
    trigger: "POST /v1/bookings, POST /v1/bookings/{bookingId}/appointments, POST /v1/appointments/{appointmentId}/reschedule"
    algorithm: waterfall_allocation
    formula: |
      requested = [requested_window_start, requested_window_end)
      buffered = [requested.start - BUFFER_MINUTES, requested.end + BUFFER_MINUTES)
      candidate_positions = [p for p in 1..facility.dock_capacity
                             where no AppointmentSlot exists with
                               facility_id == facility.id
                               and dock_position == p
                               and status IN {SCHEDULED, IN_PROGRESS}
                               and slot.window overlaps buffered]
      if candidate_positions is empty:
          reject with ERR_APPOINTMENT_OVERLAP
      chosen_position = min(candidate_positions)      # ascending position, unique by construction
    input_set: "Only SCHEDULED and IN_PROGRESS slots block. COMPLETED, MISSED and CANCELLED slots free their position."
    constants:
      BUFFER_MINUTES: 120
    precision: "integers"
    note: "Ranking expression is dock_position ASC; positions are unique so no tie-break key is needed. Empty candidate set has a pinned fallback: ERR_APPOINTMENT_OVERLAP."

  - name: equipment_window_conflict
    trigger: "POST /v1/bookings"
    algorithm: interval_merge
    formula: |
      conflict = exists Booking b
                 where b.equipment_id == requested_equipment_id
                   and b.status IN {PENDING_APPOINTMENT, IN_TRANSIT}
                   and b.booking_window_start < requested_window_end
                   and requested_window_start < b.booking_window_end
    input_set: "Only the SAME equipment unit, and only non-terminal bookings."
    constants:
      BUFFER_MINUTES: 0
    precision: "instants compared at whole-minute resolution"
    note: |
      ZERO BUFFER and half-open semantics: a new window that begins at exactly the
      previous window's end is ADJACENT and ACCEPTED. This differs from the dock rule,
      which expands both sides by 120 minutes, so the same two instants that clear the
      equipment test can still fail the dock test.

  - name: carrier_eligibility_gate
    trigger: "POST /v1/bookings"
    algorithm: constraint_propagation
    formula: |
      eligible = carrier.status == VERIFIED
                 AND carrier.operational_risk_score >= RISK_ELIGIBILITY_FLOOR
                 AND carrier.insurance_expires_at > clock now
                 AND carrier_id NOT IN shipper.blocked_carrier_ids
                 AND load.equipment_type IN carrier.equipment_types
    input_set: "Evaluated in this stated order; the first failing clause determines the error."
    constants:
      RISK_ELIGIBILITY_FLOOR: 40.0
    precision: "score compared at 1 decimal place"
    note: "At exactly 40.0 the carrier is eligible; at 39.9 it is not."

  - name: contract_committed_volume
    trigger: "every contract draw and every read that resolves LaneContract.loads_committed_this_period"
    algorithm: aggregation
    formula: |
      current_period_start = Monday 00:00:00Z of the ISO week containing the most recent draw
      loads_committed_this_period = count of Load rows
          where lane_contract_id == contract.id
            and status IN {BOOKED, IN_TRANSIT, DELIVERED, INVOICED, PAID}
          ordered by created_at ASC
          and created_at >= current_period_start
          and created_at <  current_period_start + 7 days
    input_set: "Loads still on the contract. CANCELLED, VOIDED, UNCOVERED and DRAFT loads are excluded."
    precision: "integer count"
    note: "The window is half-open [start, start+7d). A load created at exactly Monday 00:00:00Z falls in the NEW week."

  - name: dock_capacity_guard
    trigger: "POST /v1/bookings, POST /v1/appointments/{appointmentId}/restore, POST /v1/appointments/{appointmentId}/reschedule"
    algorithm: threshold
    formula: |
      committed = facility.docks_committed_today   # SCHEDULED + IN_PROGRESS slots on the current logical date
      reject with ERR_DOCK_CAPACITY_EXCEEDED when committed >= facility.dock_capacity
    input_set: "Only the facility's CURRENT logical date. Slots on other dates do not count."
    precision: "integers"
    note: "committed == dock_capacity is already full; the guard is >=, not >."

  - name: repost_limit
    trigger: "POST /v1/loads/{loadId}/repost"
    algorithm: threshold
    formula: |
      reject with ERR_REPOST_LIMIT_REACHED when load.repost_count >= MAX_REPOSTS
    input_set: "load.repost_count as incremented by prior reposts."
    constants:
      MAX_REPOSTS: 3
    precision: "integers"
    note: "The third repost succeeds (count 2 → 3); the fourth is rejected. The guard is >= on the pre-increment value."

  - name: overdue_appointment_sweep
    trigger: "POST /v1/_ops/sweep"
    algorithm: chronological
    formula: |
      for each AppointmentSlot a with status == IN_PROGRESS
          ordered by window_end ASC, tie-broken by created_at ASC:
        if clock now > a.window_end + MISSED_GRACE_MINUTES:
          a.status = MISSED
      then, for each AppointmentSlot a with status == SCHEDULED
          ordered by window_end ASC, tie-broken by created_at ASC:
        if clock now > a.window_end + MISSED_GRACE_MINUTES:
          a.status = MISSED; facility.docks_committed_today -= 1
    input_set: "Only slots whose window has closed by more than the grace period."
    constants:
      MISSED_GRACE_MINUTES: 60
    precision: "whole minutes; strictly greater-than at the boundary"
    note: "At exactly window_end + 60 minutes the slot is NOT yet missed."

  - name: uncovered_load_sweep
    trigger: "POST /v1/_ops/sweep"
    algorithm: chronological
    formula: |
      for each Load l with status == POSTED
          ordered by pickup_window_start ASC, tie-broken by created_at ASC:
        live_quotes = count of RateQuote rows with load_id == l.id
                      and status IN {ACTIVE, VIEWED}
                      and acceptance_deadline > clock now
        if live_quotes == 0 and clock now >= l.pickup_window_start - COVERAGE_HORIZON_HOURS:
          l.status = UNCOVERED
    input_set: "Only POSTED loads with zero live quotes entering the coverage horizon."
    constants:
      COVERAGE_HORIZON_HOURS: 24
    precision: "whole hours; the comparison is >= so a load exactly 24 hours out is swept"
    note: "l.load_credits_committed is NOT decremented; the shipper keeps paying for the credit until the load is cancelled or reposted."

  - name: insurance_expiry_sweep
    trigger: "POST /v1/_ops/sweep and any read or write touching a Carrier"
    algorithm: chronological
    formula: |
      for each Carrier c with status == VERIFIED:
        if c.insurance_expires_at <= clock now:
          c.status = SUSPENDED; c.suspension_reason = INSURANCE_EXPIRED
          for each Booking b of c with status IN {PENDING_APPOINTMENT, IN_TRANSIT}:
            b.status = CANCELLED
            CarrierEquipment[b.equipment_id].status = AVAILABLE
            Load[b.load_id].status = UNCOVERED
    input_set: "Only carriers currently VERIFIED. An already SUSPENDED carrier is not swept again."
    precision: "instant comparison; `<=` so a certificate expiring at exactly the clock instant suspends"
    note: "This sweep is one hop of the depth-4 insurance cascade; the booking, equipment and load mutations after it are the remaining three."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to a role declared in §1.7; X-User-ID present. Anonymous is accepted only on explicitly public endpoints."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Runs before every other check, including existence. A request with no role header to a path whose resource does not exist still answers 401."

  - priority: 2
    category: auth
    check: "The acting role is listed in the endpoint's roles, and for entity_backed roles the acting identity owns the resource it is mutating (Shipper acts only on its own loads and contracts, Carrier only on its own bookings, equipment and quotes, CarrierEquipment only when carrier_id == X-User-ID)."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every endpoint with a restricted roles list"

  - priority: 3
    category: existence
    check: "Every referenced resource exists. Ids are validated LEFT TO RIGHT in the order the endpoint's input list declares them, so the FIRST unknown id determines the error."
    error_id: "ERR_LOAD_NOT_FOUND / ERR_CARRIER_NOT_FOUND / ERR_SHIPPER_NOT_FOUND / ERR_FACILITY_NOT_FOUND / ERR_EQUIPMENT_NOT_FOUND / ERR_QUOTE_NOT_FOUND / ERR_BOOKING_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND / ERR_DETENTION_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_SETTLEMENT_NOT_FOUND / ERR_CONTRACT_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2. An undeclared (from, to) pair is rejected here, not at a business rule."
    error_id: "ERR_INVALID_STATE / ERR_ALREADY_TERMINAL / ERR_QUOTE_EXPIRED / ERR_QUOTE_NOT_VIEWABLE"
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 5
    category: business_safety
    check: "Carrier compliance gates: status must be VERIFIED; operating_authority_status must be ACTIVE; insurance_expires_at must be strictly after the logical clock; safety_score must be at or below 80.0; the carrier must not appear in the shipper's blocked_carrier_ids."
    error_id: "ERR_CARRIER_NOT_VERIFIED / ERR_AUTHORITY_REVOKED / ERR_INSURANCE_EXPIRED / ERR_SAFETY_SCORE_TOO_LOW / ERR_CARRIER_BLOCKED / ERR_CARRIER_NOT_COMPLIANT"
    http_status: 409
    applies_to: "POST /v1/bookings, POST /v1/claims/{claimId}/settle, POST /v1/carriers/{carrierId}/verify-safety, POST /v1/carriers/{carrierId}/attest-insurance"

  - priority: 6
    category: business_safety
    check: "Insurance and coverage minima: liability limit at least 75,000,000 cents; cargo coverage at least 100,000,000 cents; at least one AVAILABLE equipment unit on file before safety verification."
    error_id: "ERR_INSURANCE_LIMIT_BELOW_MINIMUM / ERR_CARGO_COVERAGE_BELOW_MINIMUM / ERR_NO_EQUIPMENT_ON_FILE"
    http_status: 409
    applies_to: "POST /v1/carriers/{carrierId}/attest-insurance, POST /v1/carriers/{carrierId}/verify-safety"

  - priority: 7
    category: business_temporal
    check: "Interval conflicts, evaluated in this order: (1) the requested equipment window must not overlap an existing non-terminal booking on the same equipment unit (zero buffer, half-open); (2) the requested dock window must not overlap an existing SCHEDULED or IN_PROGRESS slot on the same dock position once both sides are expanded by 120 minutes."
    error_id: "ERR_EQUIPMENT_WINDOW_CONFLICT / ERR_APPOINTMENT_OVERLAP"
    http_status: 409
    applies_to: "POST /v1/bookings, POST /v1/bookings/{bookingId}/appointments, POST /v1/appointments/{appointmentId}/reschedule"

  - priority: 8
    category: business_temporal
    check: "Deadline and window ordering: pickup window start strictly before end; tracking ping sequence must equal existing count + 1 and its status rank must not skip a step; the settlement must be at or past payout_due_at for a TERMS payout."
    error_id: "ERR_WINDOW_ORDER / ERR_TRACKING_SEQUENCE_OUT_OF_ORDER / ERR_TRACKING_SEQUENCE_GAP / ERR_SETTLEMENT_NOT_DUE"
    http_status: 409
    applies_to: "POST /v1/loads, POST /v1/loads/{loadId}/tracking-pings, POST /v1/carrier-settlements/{settlementId}/payout"

  - priority: 9
    category: business_constraint
    check: "Aggregate and inventory constraints: facility docks_committed_today must be strictly below dock_capacity; shipper load_credits_committed must be strictly below load_credit_limit; repost_count must be strictly below 3; claim review_rounds must not exceed 3; equipment unit must not be IN_SHOP and its type must equal the load's."
    error_id: "ERR_DOCK_CAPACITY_EXCEEDED / ERR_LOAD_CREDIT_EXHAUSTED / ERR_REPOST_LIMIT_REACHED / ERR_CLAIM_REVIEW_ROUNDS_EXHAUSTED / ERR_EQUIPMENT_UNAVAILABLE"
    http_status: 409
    applies_to: "POST /v1/bookings, POST /v1/loads/{loadId}/post, POST /v1/loads/{loadId}/repost, POST /v1/claims/{claimId}/request-info, POST /v1/appointments/{appointmentId}/restore"

  - priority: 10
    category: business_fiscal
    check: "Shipper credit: credit_available_cents must be at least the locked price of the quote being accepted."
    error_id: ERR_SHIPPER_CREDIT_EXHAUSTED
    http_status: 409
    applies_to: "POST /v1/bookings"

  - priority: 11
    category: business_referential
    check: "Cross-reference integrity: pricing_mode CONTRACT requires an ACTIVE LaneContract covering the lane and equipment, with start_date <= clock now < end_date; the booking's quote must belong to the booking's load; the booking's equipment must belong to the booking's carrier."
    error_id: "ERR_CONTRACT_NOT_ACTIVE / ERR_QUOTE_LOAD_MISMATCH / ERR_EQUIPMENT_CARRIER_MISMATCH"
    http_status: 409
    applies_to: "POST /v1/loads/{loadId}/post, POST /v1/bookings"

  - priority: 12
    category: business_fiscal
    check: "Settlement blockers: a load with any claim in FILED, UNDER_REVIEW or INFO_REQUESTED cannot be invoiced; a settlement with no APPROVED claim cannot be clawed back; a claim cannot be filed before the load is DELIVERED."
    error_id: "ERR_OPEN_CLAIMS_BLOCK_SETTLEMENT / ERR_NO_APPROVED_CLAIM / ERR_CLAIM_BEFORE_DELIVERY"
    http_status: 409
    applies_to: "POST /v1/bookings/{bookingId}/invoice, POST /v1/carrier-settlements/{settlementId}/clawback, POST /v1/claims"

  - priority: 13
    category: business_constraint
    check: "Request-shape constraints: MC number unique across carriers; pickup window ordering; claimed_amount_cents strictly positive; weight_lbs at least 1."
    error_id: "ERR_DUPLICATE_MC_NUMBER / ERR_INVALID_REQUEST"
    http_status: 400
    applies_to: "POST /v1/carriers, POST /v1/loads, POST /v1/claims"

  - priority: 14
    category: state
    check: "Optimistic concurrency: the expected_<parent>_version supplied with a guarded write must equal the parent's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/bookings, POST /v1/loads/{loadId}/repost, POST /v1/claims, POST /v1/carrier-settlements/{settlementId}/payout"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Platform / test-driving ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Advance the logical clock to an absolute instant. The server's startup default is exactly 2026-09-01T00:00:00Z and it MUST NOT fall back to real wall-clock time before the first call."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["Every clock-relative sweep condition is re-evaluated against the new instant."]

  - method: POST
    path: "/v1/_ops/sweep"
    description: "Run the periodic operations sweep: overdue appointments to MISSED, uncovered loads to UNCOVERED, expired insurance to SUSPENDED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { swept_appointment_ids: array, uncovered_load_ids: array, suspended_carrier_ids: array, processed_at: datetime }
    side_effects:
      - "AppointmentSlot IN_PROGRESS or SCHEDULED past window_end + 60 minutes → MISSED"
      - "POSTED loads with no live quote inside the 24-hour coverage horizon → UNCOVERED"
      - "VERIFIED carriers past insurance_expires_at → SUSPENDED, cascading to bookings, equipment and loads"

  # --- Shipper ---
  - method: POST
    path: "/v1/shippers"
    description: "Register a shipper of record."
    roles: [PlatformAdmin]
    code: 201
    input: [name, billing_state_code, payment_terms_days, quick_pay_discount_pct, credit_limit_cents, load_credit_limit]
    output: Shipper
    side_effects: ["status=ACTIVE, credit_used_cents=0, load_credits_committed=0, breached_pickup_count=0"]

  - method: GET
    path: "/v1/shippers/{shipperId}"
    description: "Get a shipper."
    roles: [Shipper, PlatformAdmin, ComplianceReviewer, ClaimsAdjuster]
    code: 200
    input: []
    output: Shipper
    side_effects: []

  - method: POST
    path: "/v1/shippers/{shipperId}/suspend"
    description: "Suspend a shipper; its posted loads stop accepting bookings."
    roles: [PlatformAdmin]
    code: 200
    input: [reason_code]
    output: Shipper
    side_effects: ["status=SUSPENDED", "increments Shipper.version by 1"]

  - method: GET
    path: "/v1/shippers/{shipperId}/loads"
    description: "List a shipper's loads."
    roles: [Shipper, PlatformAdmin, Carrier, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Load[]
    side_effects: []

  - method: GET
    path: "/v1/shippers/{shipperId}/lane-contracts"
    description: "List a shipper's lane contracts."
    roles: [Shipper, PlatformAdmin, Carrier]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LaneContract[]
    side_effects: []

  # --- Carrier ---
  - method: POST
    path: "/v1/carriers"
    description: "Onboard a carrier; authority, insurance and safety are verified in three later steps."
    roles: [ComplianceReviewer, PlatformAdmin]
    code: 201
    input: [legal_name, mc_number, dot_number, insurance_expires_at, insurance_liability_limit_cents, cargo_coverage_limit_cents, safety_score, equipment_types]
    output: Carrier
    side_effects: ["status=PENDING, operating_authority_status=NONE, operational_risk_score=100.0, claims_clawback_count=0"]

  - method: GET
    path: "/v1/carriers/{carrierId}"
    description: "Get a carrier."
    roles: [Carrier, ComplianceReviewer, ClaimsAdjuster, PlatformAdmin, Shipper]
    code: 200
    input: []
    output: Carrier
    side_effects: ["Insurance expiry is re-evaluated on read; an expired certificate suspends the carrier"]

  - method: GET
    path: "/v1/carriers"
    description: "List carriers with filters."
    roles: [Carrier, ComplianceReviewer, PlatformAdmin, Shipper]
    code: 200
    input: ["status?", "equipment_type?", "min_operational_risk_score?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []

  - method: POST
    path: "/v1/carriers/{carrierId}/verify-authority"
    description: "Verify operating authority from the FMCSA docket."
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: Carrier
    side_effects: ["status=AUTHORITY_VERIFIED, operating_authority_status=ACTIVE, authority_verified_at=clock now", "increments Carrier.version by 1"]

  - method: POST
    path: "/v1/carriers/{carrierId}/attest-insurance"
    description: "Attest the certificate of insurance on file."
    roles: [ComplianceReviewer]
    code: 200
    input: [insurance_expires_at, insurance_liability_limit_cents, cargo_coverage_limit_cents, "certificate_reference?"]
    output: Carrier
    side_effects: ["status=INSURANCE_ON_FILE, insurance_attested_at=clock now", "increments Carrier.version by 1"]

  - method: POST
    path: "/v1/carriers/{carrierId}/verify-safety"
    description: "Verify the safety score and require at least one available equipment unit."
    roles: [ComplianceReviewer]
    code: 200
    input: ["safety_score?"]
    output: Carrier
    side_effects: ["status=VERIFIED when safety_score <= 80.0 and at least one AVAILABLE equipment unit exists", "increments Carrier.version by 1"]

  - method: POST
    path: "/v1/carriers/{carrierId}/suspend"
    description: "Suspend a carrier and unwind its live bookings."
    roles: [PlatformAdmin]
    code: 200
    input: [reason_code]
    output: Carrier
    side_effects:
      - "status=SUSPENDED, suspension_reason=reason_code"
      - "Every PENDING_APPOINTMENT or IN_TRANSIT booking of this carrier → CANCELLED; each booking's equipment → AVAILABLE and each booking's load → UNCOVERED"
      - "increments Carrier.version by 1"

  - method: POST
    path: "/v1/carriers/{carrierId}/reinstate"
    description: "Reinstate a suspended carrier once insurance is valid again."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Carrier
    side_effects: ["status=INSURANCE_ON_FILE, suspension_reason=null", "increments Carrier.version by 1"]

  - method: GET
    path: "/v1/carriers/{carrierId}/equipment"
    description: "List a carrier's equipment units."
    roles: [Carrier, PlatformAdmin, ComplianceReviewer]
    code: 200
    input: ["status?", "equipment_type?", "limit?", "offset?"]
    output: CarrierEquipment[]
    side_effects: []

  - method: GET
    path: "/v1/carriers/{carrierId}/bookings"
    description: "List a carrier's bookings."
    roles: [Carrier, PlatformAdmin, Shipper]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/v1/carriers/{carrierId}/claims"
    description: "List claims asserted against a carrier."
    roles: [Carrier, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClaimsCase[]
    side_effects: []

  # --- CarrierEquipment ---
  - method: POST
    path: "/v1/carrier-equipment"
    description: "Register a carrier equipment unit and its assigned driver."
    roles: [Carrier, ComplianceReviewer, PlatformAdmin]
    code: 201
    input: [carrier_id, equipment_type, unit_number, driver_name]
    output: CarrierEquipment
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/v1/carrier-equipment/{equipmentId}"
    description: "Get an equipment unit."
    roles: [Carrier, PlatformAdmin, ComplianceReviewer]
    code: 200
    input: []
    output: CarrierEquipment
    side_effects: []

  - method: GET
    path: "/v1/carrier-equipment"
    description: "List equipment units with filters."
    roles: [Carrier, PlatformAdmin, ComplianceReviewer]
    code: 200
    input: ["carrier_id?", "equipment_type?", "unit_number?", "status?", "limit?", "offset?"]
    output: CarrierEquipment[]
    side_effects: []

  - method: POST
    path: "/v1/carrier-equipment/{equipmentId}/status"
    description: "Move a unit between AVAILABLE and IN_SHOP."
    roles: [Carrier, PlatformAdmin]
    code: 200
    input: [status]
    output: CarrierEquipment
    side_effects: ["status=requested status; IN_SHOP is refused while the unit carries a non-terminal booking"]

  # --- Facility ---
  - method: POST
    path: "/v1/facilities"
    description: "Register a facility with its dock capacity and detention terms."
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, dock_capacity, "default_appointment_minutes?", "free_dwell_minutes?", detention_rate_per_hour_cents]
    output: Facility
    side_effects: ["status=ACTIVE, docks_committed_today=0"]

  - method: GET
    path: "/v1/facilities/{facilityId}"
    description: "Get a facility."
    roles: [Shipper, Carrier, PlatformAdmin, ComplianceReviewer, ClaimsAdjuster]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: GET
    path: "/v1/facilities"
    description: "List facilities with filters."
    roles: [Shipper, Carrier, PlatformAdmin, ComplianceReviewer]
    code: 200
    input: ["state_code?", "status?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []

  - method: GET
    path: "/v1/facilities/{facilityId}/appointments"
    description: "List appointments at a facility."
    roles: [Carrier, Shipper, PlatformAdmin]
    code: 200
    input: ["scheduled_date?", "status?", "limit?", "offset?"]
    output: AppointmentSlot[]
    side_effects: []

  - method: GET
    path: "/v1/facilities/{facilityId}/detention-events"
    description: "List detention events at a facility."
    roles: [Carrier, Shipper, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DetentionEvent[]
    side_effects: []

  - method: GET
    path: "/v1/facilities/{facilityId}/lane-contracts"
    description: "List contracts that use a facility as origin or destination."
    roles: [Shipper, PlatformAdmin, Carrier]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LaneContract[]
    side_effects: []

  # --- LaneContract ---
  - method: POST
    path: "/v1/lane-contracts"
    description: "Create a dedicated-lane commitment in DRAFT."
    roles: [Shipper, PlatformAdmin]
    code: 201
    input: [shipper_id, origin_facility_id, destination_facility_id, equipment_type, committed_weekly_volume, committed_rate_cents, accessorial_allowance_cents, start_date, end_date, contract_carrier_ids]
    output: LaneContract
    side_effects: ["status=DRAFT, loads_committed_this_period=0, period_start=null"]

  - method: GET
    path: "/v1/lane-contracts/{contractId}"
    description: "Get a lane contract."
    roles: [Shipper, Carrier, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: LaneContract
    side_effects: []

  - method: GET
    path: "/v1/lane-contracts"
    description: "List lane contracts with filters."
    roles: [Shipper, Carrier, PlatformAdmin]
    code: 200
    input: ["shipper_id?", "origin_facility_id?", "destination_facility_id?", "equipment_type?", "status?", "limit?", "offset?"]
    output: LaneContract[]
    side_effects: []

  - method: POST
    path: "/v1/lane-contracts/{contractId}/activate"
    description: "Activate a draft contract so it can be drawn against."
    roles: [Shipper, PlatformAdmin]
    code: 200
    input: []
    output: LaneContract
    side_effects: ["status=ACTIVE", "increments LaneContract.version by 1"]

  - method: GET
    path: "/v1/lane-contracts/{contractId}/loads"
    description: "List loads drawing against a contract."
    roles: [Shipper, Carrier, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Load[]
    side_effects: []

  # --- Load ---
  - method: POST
    path: "/v1/loads"
    description: "Create a load in DRAFT. No price exists until the load is posted."
    roles: [Shipper]
    code: 201
    input: [shipper_id, origin_facility_id, destination_facility_id, pricing_mode, equipment_type, commodity, weight_lbs, declared_cargo_value_cents, distance_miles, pickup_window_start, pickup_window_end, delivery_deadline, "lane_contract_id?", "market_band?"]
    output: Load
    side_effects:
      - "calculation lane_key_derivation derives lane_key from both facilities' state codes"
      - "status=DRAFT, repost_count=0, reprice_count=0, accessorial_total_cents=0, pickup_breach_flag=false"

  - method: GET
    path: "/v1/loads/{loadId}"
    description: "Get a load."
    roles: [Shipper, Carrier, PlatformAdmin, ClaimsAdjuster, ComplianceReviewer]
    code: 200
    input: []
    output: Load
    side_effects: ["projected_delay_minutes is re-derived on read from the newest tracking ping"]

  - method: GET
    path: "/v1/loads"
    description: "List loads with filters; this is the carrier app's load board."
    roles: [Shipper, Carrier, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["shipper_id?", "carrier_id?", "origin_facility_id?", "destination_facility_id?", "lane_contract_id?", "equipment_id?", "status?", "equipment_type?", "lane_key?", "limit?", "offset?"]
    output: Load[]
    side_effects: []

  - method: POST
    path: "/v1/loads/{loadId}/post"
    description: "Post a load and lock its instant quote."
    roles: [Shipper]
    code: 200
    input: []
    output: Load
    side_effects:
      - "A RateQuote with quote_kind=INITIAL and status=ACTIVE is synthesized"
      - "load.posted_rate_cents and load.booked_rate_cents are locked to the quote's base_rate_cents"
      - "shipper.load_credits_committed += 1"
      - "status=POSTED; increments Load.version by 1"

  - method: POST
    path: "/v1/loads/{loadId}/reprice"
    description: "Re-price a posted load from a new market band, updating the live booked rate only."
    roles: [PlatformAdmin]
    code: 200
    input: [new_market_band]
    output: Load
    side_effects:
      - "calculation reprice_booked_rate recomputes quote.repriced_rate_cents, clamps it at quote.min_rate_cents, and sets quote.quote_kind=REPRICED"
      - "load.booked_rate_cents updated; load.market_band=new_market_band; reprice_count += 1"
      - "load.posted_rate_cents is NOT recomputed"
      - "increments Load.version by 1"

  - method: POST
    path: "/v1/loads/{loadId}/repost"
    description: "Repost an uncovered load with a fresh quote."
    roles: [Shipper]
    code: 200
    input: [expected_shipper_version]
    output: Load
    side_effects:
      - "repost_count += 1; a fresh INITIAL quote is synthesized; prior quotes become SUPERSEDED"
      - "load.posted_rate_cents and load.booked_rate_cents are re-locked"
      - "status=POSTED; increments Shipper.version by 1"

  - method: POST
    path: "/v1/loads/{loadId}/cancel"
    description: "Cancel a load that has not started moving."
    roles: [Shipper]
    code: 200
    input: []
    output: Load
    side_effects:
      - "status=CANCELLED; shipper.load_credits_committed -= 1"
      - "Any live quotes become SUPERSEDED; a BOOKED load releases its equipment and its PICKUP appointment"
      - "shipper.credit_used_cents -= booking.agreed_rate_cents when the load was BOOKED"
      - "increments Load.version by 1"

  - method: POST
    path: "/v1/loads/{loadId}/void"
    description: "Void a delivered, invoiced or paid load and compensate its settlement."
    roles: [PlatformAdmin]
    code: 200
    input: [retry_idempotency_key]
    output: Load
    side_effects:
      - "A compensating CarrierSettlement exactly negating the forward settlement is synthesized; the forward row becomes REVERSED"
      - "shipper.load_credits_committed -= 1; status=VOIDED"
      - "A repeat call with the same retry_idempotency_key returns the stored outcome without a second compensation"
      - "increments Load.version by 1"

  - method: POST
    path: "/v1/loads/{loadId}/tracking-pings"
    description: "Driver app location and status report."
    roles: [Carrier, PlatformAdmin]
    code: 201
    input: [carrier_id, sequence, reported_status, location_code, "eta_utc?"]
    output: TrackingPing
    side_effects:
      - "calculation tracking_status_progression gates the sequence and rank; calculation projected_delay_minutes re-derives the load's delay from the newest ping"
      - "AT_PICKUP stamps load.actual_pickup_at on first arrival and opens a DetentionEvent; the load moves BOOKED → IN_TRANSIT only on the IN_TRANSIT ping"
      - "DELIVERED closes the open DetentionEvent, recomputes accessorial_total_cents, and synthesizes an ACCRUED CarrierSettlement"

  - method: GET
    path: "/v1/loads/{loadId}/tracking-pings"
    description: "List a load's tracking pings in sequence order."
    roles: [Carrier, Shipper, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: TrackingPing[]
    side_effects: []

  - method: GET
    path: "/v1/loads/{loadId}/status-events"
    description: "List the shipper-visible status timeline for a load."
    roles: [Shipper, Carrier, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: StatusEvent[]
    side_effects: []

  - method: GET
    path: "/v1/loads/{loadId}/rate-quotes"
    description: "List every quote ever produced for a load."
    roles: [Shipper, Carrier, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RateQuote[]
    side_effects: []

  - method: GET
    path: "/v1/loads/{loadId}/appointments"
    description: "List a load's appointments."
    roles: [Shipper, Carrier, PlatformAdmin]
    code: 200
    input: ["slot_kind?", "status?", "limit?", "offset?"]
    output: AppointmentSlot[]
    side_effects: []

  - method: GET
    path: "/v1/loads/{loadId}/detention-events"
    description: "List a load's detention events."
    roles: [Shipper, Carrier, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DetentionEvent[]
    side_effects: []

  - method: GET
    path: "/v1/loads/{loadId}/claims"
    description: "List claims on a load."
    roles: [Shipper, Carrier, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClaimsCase[]
    side_effects: []

  - method: GET
    path: "/v1/loads/{loadId}/carrier-settlements"
    description: "List carrier settlements for a load."
    roles: [Shipper, PlatformAdmin, Carrier]
    code: 200
    input: ["settlement_status?", "limit?", "offset?"]
    output: CarrierSettlement[]
    side_effects: []

  # --- RateQuote ---
  - method: GET
    path: "/v1/rate-quotes/{quoteId}"
    description: "Get a quote."
    roles: [Shipper, Carrier, PlatformAdmin]
    code: 200
    input: []
    output: RateQuote
    side_effects: []

  - method: GET
    path: "/v1/rate-quotes"
    description: "List quotes with filters."
    roles: [Shipper, Carrier, PlatformAdmin]
    code: 200
    input: ["load_id?", "status?", "quote_kind?", "limit?", "offset?"]
    output: RateQuote[]
    side_effects: []

  - method: POST
    path: "/v1/rate-quotes/{quoteId}/view"
    description: "Record that a carrier opened a quote in the app; moves it to VIEWED."
    roles: [Carrier]
    code: 200
    input: []
    output: RateQuote
    side_effects: ["viewed_carrier_ids gains the acting carrier; status=VIEWED", "increments RateQuote.version by 1"]

  - method: POST
    path: "/v1/rate-quotes/{quoteId}/decline"
    description: "A carrier declines a quote; it leaves that carrier's board."
    roles: [Carrier]
    code: 200
    input: []
    output: RateQuote
    side_effects: ["declined_carrier_ids gains the acting carrier; status=DECLINED", "increments RateQuote.version by 1"]

  # --- Booking ---
  - method: POST
    path: "/v1/bookings"
    description: "Tender a booked price. The carrier never negotiates: the price is whatever the quote locks."
    roles: [Carrier, PlatformAdmin]
    code: 201
    input: [load_id, carrier_id, rate_quote_id, equipment_id, expected_load_version]
    output: Booking
    side_effects:
      - "agreed_rate_cents is fixed from the quote; status=PENDING_APPOINTMENT"
      - "load.carrier_id and load.equipment_id are written; equipment.status=ASSIGNED"
      - "A PICKUP AppointmentSlot is synthesized; facility.docks_committed_today += 1"
      - "quote becomes ACCEPTED and sibling quotes become SUPERSEDED; shipper.credit_used_cents += agreed_rate_cents"
      - "A StatusEvent of type BOOKED is appended; the load transitions POSTED → BOOKED"
      - "increments Load.version by 1"

  - method: GET
    path: "/v1/bookings/{bookingId}"
    description: "Get a booking."
    roles: [Carrier, Shipper, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/v1/bookings"
    description: "List bookings with filters."
    roles: [Carrier, Shipper, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["load_id?", "carrier_id?", "rate_quote_id?", "equipment_id?", "appointment_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/v1/bookings/{bookingId}/appointments"
    description: "Book an additional appointment against a booking's load."
    roles: [Carrier, PlatformAdmin]
    code: 201
    input: [slot_kind, window_start, window_end, "dock_position?"]
    output: AppointmentSlot
    side_effects: ["facility.docks_committed_today += 1; the slot's dock_position is chosen by the facility selector when omitted"]

  - method: POST
    path: "/v1/bookings/{bookingId}/invoice"
    description: "Invoice a delivered booking, moving its settlement to READY."
    roles: [Shipper, PlatformAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: ["The load's CarrierSettlement becomes READY with payout_due_at = delivered_at + payment_terms_days", "increments Booking.version by 1"]

  - method: POST
    path: "/v1/bookings/{bookingId}/cancel-in-transit"
    description: "Cancel an in-transit booking and return the load to the board."
    roles: [PlatformAdmin]
    code: 200
    input: [reason_code]
    output: Booking
    side_effects: ["status=CANCELLED, equipment AVAILABLE, load returns to UNCOVERED, shipper.credit_used_cents -= agreed_rate_cents", "increments Booking.version by 1"]

  # --- AppointmentSlot ---
  - method: GET
    path: "/v1/appointments/{appointmentId}"
    description: "Get an appointment."
    roles: [Carrier, Shipper, PlatformAdmin]
    code: 200
    input: []
    output: AppointmentSlot
    side_effects: []

  - method: GET
    path: "/v1/appointments"
    description: "List appointments with filters."
    roles: [Carrier, Shipper, PlatformAdmin]
    code: 200
    input: ["facility_id?", "load_id?", "carrier_id?", "status?", "scheduled_date?", "limit?", "offset?"]
    output: AppointmentSlot[]
    side_effects: []

  - method: POST
    path: "/v1/appointments/{appointmentId}/reschedule"
    description: "Pull an appointment earlier onto a free dock position."
    roles: [Carrier, PlatformAdmin]
    code: 200
    input: [window_start, window_end, "dock_position?"]
    output: AppointmentSlot
    side_effects: ["The slot's window is rewritten and status becomes IN_PROGRESS; an OPEN DetentionEvent is synthesized with arrived_at=clock now", "increments AppointmentSlot.version by 1"]

  - method: POST
    path: "/v1/appointments/{appointmentId}/complete"
    description: "Complete an in-progress appointment."
    roles: [Carrier, PlatformAdmin]
    code: 200
    input: []
    output: AppointmentSlot
    side_effects: ["status=COMPLETED; the open DetentionEvent is CLOSED with departed_at=clock now and the load's accessorial_total_cents is recomputed", "increments AppointmentSlot.version by 1"]

  - method: POST
    path: "/v1/appointments/{appointmentId}/cancel"
    description: "Cancel a scheduled appointment."
    roles: [Carrier, Shipper, PlatformAdmin]
    code: 200
    input: []
    output: AppointmentSlot
    side_effects: ["status=CANCELLED; facility.docks_committed_today -= 1", "increments AppointmentSlot.version by 1"]

  - method: POST
    path: "/v1/appointments/{appointmentId}/restore"
    description: "Restore a cancelled appointment if capacity remains."
    roles: [Carrier, PlatformAdmin]
    code: 200
    input: []
    output: AppointmentSlot
    side_effects: ["status=SCHEDULED; facility.docks_committed_today += 1", "increments AppointmentSlot.version by 1"]

  # --- DetentionEvent ---
  - method: GET
    path: "/v1/detention-events/{detentionId}"
    description: "Get a detention event."
    roles: [Carrier, Shipper, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: DetentionEvent
    side_effects: []

  - method: GET
    path: "/v1/detention-events"
    description: "List detention events with filters."
    roles: [Carrier, Shipper, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["load_id?", "facility_id?", "carrier_id?", "appointment_id?", "status?", "limit?", "offset?"]
    output: DetentionEvent[]
    side_effects: []

  - method: POST
    path: "/v1/detention-events/{detentionId}/waive"
    description: "Waive a detention charge and drop it out of the load's accessorial total."
    roles: [PlatformAdmin]
    code: 200
    input: [reason_code]
    output: DetentionEvent
    side_effects: ["detention_charge_cents=0, status=WAIVED, load.accessorial_total_cents recomputed, and any ACCRUED or READY settlement recomputed", "increments DetentionEvent.version by 1"]

  # --- TrackingPing ---
  - method: GET
    path: "/v1/tracking-pings/{pingId}"
    description: "Get a tracking ping."
    roles: [Carrier, Shipper, PlatformAdmin]
    code: 200
    input: []
    output: TrackingPing
    side_effects: []

  - method: GET
    path: "/v1/tracking-pings"
    description: "List tracking pings with filters."
    roles: [Carrier, Shipper, PlatformAdmin]
    code: 200
    input: ["load_id?", "carrier_id?", "limit?", "offset?"]
    output: TrackingPing[]
    side_effects: []

  # --- StatusEvent ---
  - method: GET
    path: "/v1/status-events/{eventId}"
    description: "Get a status event."
    roles: [Shipper, Carrier, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: StatusEvent
    side_effects: []

  - method: GET
    path: "/v1/status-events"
    description: "List status events with filters."
    roles: [Shipper, Carrier, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["load_id?", "event_type?", "limit?", "offset?"]
    output: StatusEvent[]
    side_effects: []

  - method: POST
    path: "/v1/status-events"
    description: "Append a shipper- or carrier-authored status note to a load's timeline."
    roles: [Shipper, Carrier]
    code: 201
    input: [load_id, event_type, "note?"]
    output: StatusEvent
    side_effects: ["source is stamped from the acting role: SHIPPER_PORTAL for Shipper, DRIVER_APP for Carrier"]

  # --- ClaimsCase ---
  - method: POST
    path: "/v1/claims"
    description: "File a cargo claim against the carrier whose liability is asserted."
    roles: [Shipper, Carrier]
    code: 201
    input: [load_id, carrier_id, claimed_amount_cents, damage_description, filed_by_role, expected_carrier_version]
    output: ClaimsCase
    side_effects:
      - "status=FILED, review_rounds=0, escalated=false"
      - "liability_limit_cents is captured as min(carrier.cargo_coverage_limit_cents, commodity cap)"
      - "increments Carrier.version by 1"

  - method: GET
    path: "/v1/claims/{claimId}"
    description: "Get a claim."
    roles: [Shipper, Carrier, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: ClaimsCase
    side_effects: []

  - method: GET
    path: "/v1/claims"
    description: "List claims with filters."
    roles: [Shipper, Carrier, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["load_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: ClaimsCase[]
    side_effects: []

  - method: POST
    path: "/v1/claims/{claimId}/review"
    description: "Open a review round and write the provisional liability."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ClaimsCase
    side_effects: ["provisional_liability_cents written; review_rounds += 1; status=UNDER_REVIEW", "increments ClaimsCase.version by 1"]

  - method: POST
    path: "/v1/claims/{claimId}/request-info"
    description: "Ask the filing party for more information."
    roles: [ClaimsAdjuster]
    code: 200
    input: [note]
    output: ClaimsCase
    side_effects: ["review_rounds += 1; status=INFO_REQUESTED", "increments ClaimsCase.version by 1"]

  - method: POST
    path: "/v1/claims/{claimId}/approve"
    description: "Approve the claim, applying the weight basis and clawing the amount back."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ClaimsCase
    side_effects:
      - "approved_amount_cents = round_half_up(provisional_liability_cents * min(1, weight_lbs / 44000))"
      - "Any ACCRUED or READY settlement for the load gains the deduction and recomputes gross, discount and net"
      - "carrier.claims_clawback_count += 1 whenever a deduction was taken; carrier.operational_risk_score recomputed"
      - "status=APPROVED; increments ClaimsCase.version by 1"

  - method: POST
    path: "/v1/claims/{claimId}/deny"
    description: "Deny a claim."
    roles: [ClaimsAdjuster]
    code: 200
    input: [reason_code]
    output: ClaimsCase
    side_effects: ["status=DENIED, approved_amount_cents stays 0, no deduction is taken", "increments ClaimsCase.version by 1"]

  - method: POST
    path: "/v1/claims/{claimId}/escalate"
    description: "Escalate a large claim out of the adjuster queue."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ClaimsCase
    side_effects: ["escalated=true; status=ESCALATED", "increments ClaimsCase.version by 1"]

  - method: POST
    path: "/v1/claims/{claimId}/settle"
    description: "Confirm an approved claim against a compliant carrier."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ClaimsCase
    side_effects: ["status=SETTLED; claims_clawback_count is NOT incremented a second time", "increments ClaimsCase.version by 1"]

  # --- CarrierSettlement ---
  - method: GET
    path: "/v1/carrier-settlements/{settlementId}"
    description: "Get a settlement."
    roles: [Carrier, Shipper, PlatformAdmin]
    code: 200
    input: []
    output: CarrierSettlement
    side_effects: []

  - method: GET
    path: "/v1/carrier-settlements"
    description: "List settlements with filters."
    roles: [Carrier, Shipper, PlatformAdmin]
    code: 200
    input: ["carrier_id?", "booking_id?", "load_id?", "reversal_of_settlement_id?", "settlement_status?", "limit?", "offset?"]
    output: CarrierSettlement[]
    side_effects: []

  - method: POST
    path: "/v1/carrier-settlements/{settlementId}/unready"
    description: "Pull a settlement back from READY to ACCRUED while a claim is open."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CarrierSettlement
    side_effects: ["settlement_status=ACCRUED, payout_due_at cleared", "increments CarrierSettlement.version by 1"]

  - method: POST
    path: "/v1/carrier-settlements/{settlementId}/payout"
    description: "Pay a carrier settlement on terms or through quick pay."
    roles: [PlatformAdmin]
    code: 200
    input: [payout_mode, expected_settlement_version]
    output: CarrierSettlement
    side_effects:
      - "SETTLEMENT status becomes PAID and paid_at=clock now; booking.settled_at=clock now"
      - "QUICK_PAY sets booking.quick_pay_elected=true and quick_pay_discount_cents from the carrier's quick-pay tier; net_payable_cents is restruck"
      - "shipper.credit_used_cents -= booking.agreed_rate_cents"
      - "A repeat call with the same retry_idempotency_key returns the stored outcome without a second payment"
      - "increments CarrierSettlement.version by 1"

  - method: POST
    path: "/v1/carrier-settlements/{settlementId}/clawback"
    description: "Apply an approved claim's deduction to a settlement."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CarrierSettlement
    side_effects: ["claims_deduction_cents += approved_amount_cents; gross, discount and net recomputed; carrier.claims_clawback_count += 1; carrier.operational_risk_score recomputed", "increments CarrierSettlement.version by 1"]

# =============================================================================
# Table 6: Error Code Catalogue
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not a declared role."

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not permitted on this endpoint, or an entity_backed actor is not the owner of the resource."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, unknown enum member, a required field missing, non-positive claimed_amount_cents or weight_lbs below 1."

  - id: ERR_WINDOW_ORDER
    http: 400
    condition: "pickup_window_end is not strictly after pickup_window_start, or an appointment window_end is not strictly after its window_start."

  - id: ERR_DUPLICATE_MC_NUMBER
    http: 400
    condition: "mc_number already exists on another carrier."

  - id: ERR_LOAD_NOT_FOUND
    http: 404
    condition: "load_id does not resolve."

  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "carrier_id does not resolve."

  - id: ERR_SHIPPER_NOT_FOUND
    http: 404
    condition: "shipper_id does not resolve."

  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "facility_id does not resolve."

  - id: ERR_EQUIPMENT_NOT_FOUND
    http: 404
    condition: "equipment_id does not resolve."

  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "rate_quote_id does not resolve."

  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "booking_id does not resolve."

  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "appointment_id does not resolve."

  - id: ERR_DETENTION_NOT_FOUND
    http: 404
    condition: "detention_id does not resolve."

  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim_id does not resolve."

  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "settlement_id does not resolve."

  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "lane_contract_id does not resolve."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "The resource is not in a state from which the requested transition is declared."

  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "A transition was attempted from a terminal state."

  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "The logical clock has reached the quote's acceptance_deadline."

  - id: ERR_QUOTE_NOT_VIEWABLE
    http: 409
    condition: "The quote's load is no longer POSTED, so the quote is not on any board."

  - id: ERR_CARRIER_NOT_VERIFIED
    http: 409
    condition: "carrier.status is not VERIFIED when a booking or a claim settlement requires it."

  - id: ERR_AUTHORITY_REVOKED
    http: 409
    condition: "operating_authority_status is REVOKED; verification and booking are both blocked."

  - id: ERR_INSURANCE_EXPIRED
    http: 409
    condition: "insurance_expires_at is at or before the logical clock."

  - id: ERR_SAFETY_SCORE_TOO_LOW
    http: 409
    condition: "safety_score exceeds 80.0 at safety verification."

  - id: ERR_CARRIER_BLOCKED
    http: 409
    condition: "carrier_id appears in the shipper's blocked_carrier_ids."

  - id: ERR_CARRIER_NOT_COMPLIANT
    http: 409
    condition: "A claim settlement was attempted against a carrier that is not VERIFIED."

  - id: ERR_INSURANCE_LIMIT_BELOW_MINIMUM
    http: 409
    condition: "insurance_liability_limit_cents is below 75,000,000 cents."

  - id: ERR_CARGO_COVERAGE_BELOW_MINIMUM
    http: 409
    condition: "cargo_coverage_limit_cents is below 100,000,000 cents."

  - id: ERR_NO_EQUIPMENT_ON_FILE
    http: 409
    condition: "Safety verification was attempted with no AVAILABLE CarrierEquipment row for the carrier."

  - id: ERR_APPOINTMENT_OVERLAP
    http: 409
    condition: "The requested dock window collides with an existing SCHEDULED or IN_PROGRESS slot on the same dock position once both sides are expanded by 120 minutes, and no other position is free."

  - id: ERR_EQUIPMENT_WINDOW_CONFLICT
    http: 409
    condition: "The requested booking window overlaps an existing non-terminal booking on the same equipment unit under zero-buffer half-open semantics."

  - id: ERR_TRACKING_SEQUENCE_OUT_OF_ORDER
    http: 409
    condition: "The ping's sequence is not exactly one greater than the load's existing ping count."

  - id: ERR_TRACKING_SEQUENCE_GAP
    http: 409
    condition: "The ping's status_rank skips a step beyond the load's greatest observed rank plus one."

  - id: ERR_SETTLEMENT_NOT_DUE
    http: 409
    condition: "A TERMS payout was attempted strictly before payout_due_at."

  - id: ERR_SETTLEMENT_ALREADY_PAID
    http: 409
    condition: "An operation requiring an unpaid settlement touched a settlement already in PAID status."

  - id: ERR_DOCK_CAPACITY_EXCEEDED
    http: 409
    condition: "facility.docks_committed_today is already at or above dock_capacity on the target date."

  - id: ERR_LOAD_CREDIT_EXHAUSTED
    http: 409
    condition: "shipper.load_credits_committed is already at load_credit_limit."

  - id: ERR_REPOST_LIMIT_REACHED
    http: 409
    condition: "load.repost_count is already 3 or more."

  - id: ERR_CLAIM_REVIEW_ROUNDS_EXHAUSTED
    http: 409
    condition: "review_rounds already exceeds 3."

  - id: ERR_CLAIM_ALREADY_REVIEWED
    http: 409
    condition: "A second first-round review was attempted on a case whose review_rounds is already 1 or more."

  - id: ERR_CLAIM_NOT_REVIEWED
    http: 409
    condition: "Approve or deny was attempted before any review round."

  - id: ERR_ESCALATION_THRESHOLD_NOT_MET
    http: 409
    condition: "provisional_liability_cents is 2,500,000 cents or less when escalation was requested."

  - id: ERR_EQUIPMENT_UNAVAILABLE
    http: 409
    condition: "The chosen equipment unit is IN_SHOP, or its equipment_type differs from the load's."

  - id: ERR_EQUIPMENT_CARRIER_MISMATCH
    http: 409
    condition: "The chosen equipment unit's carrier_id differs from the booking's carrier_id."

  - id: ERR_QUOTE_LOAD_MISMATCH
    http: 409
    condition: "The quote's load_id differs from the booking's load_id."

  - id: ERR_SHIPPER_CREDIT_EXHAUSTED
    http: 409
    condition: "shipper.credit_available_cents is below the locked price being accepted."

  - id: ERR_CARRIER_RISK_BLOCKED
    http: 409
    condition: "carrier.operational_risk_score is below 40.0."

  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "pricing_mode is CONTRACT but the referenced contract is not ACTIVE, or the clock is outside its term."

  - id: ERR_OPEN_CLAIMS_BLOCK_SETTLEMENT
    http: 409
    condition: "Invoicing was attempted while the load has a claim in FILED, UNDER_REVIEW or INFO_REQUESTED."

  - id: ERR_NO_APPROVED_CLAIM
    http: 409
    condition: "A clawback was attempted with no APPROVED claim on the booking or load."

  - id: ERR_CLAIM_BEFORE_DELIVERY
    http: 409
    condition: "A claim was filed or reviewed before the load reached DELIVERED."

  - id: ERR_WAIVE_REASON_REQUIRED
    http: 409
    condition: "A detention waiver was requested with reason_code outside FACILITY_FAULT, FORCE_MAJEURE, GOODWILL."

  - id: ERR_RESCHEDULE_ONLY_EARLIER
    http: 409
    condition: "An appointment reschedule requested a window_start at or after the slot's current window_start."

  - id: ERR_STALE_VERSION
    http: 412
    condition: "The expected_<parent>_version supplied with a guarded write does not equal the parent's current version."

# =============================================================================
# Table 7: RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller. Used only for public tracking lookups; cannot read prices, credit or claims."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /v1/loads/{loadId}/status-events — read the customer-facing timeline"

  - name: Shipper
    description: "Shipper of record. Owns loads, lane contracts, invoices and cargo claims; sees only its own loads."
    identity: entity_backed:Shipper
    exclusive_operations:
      - "POST /v1/loads — create a load"
      - "POST /v1/loads/{loadId}/post — post a load and lock its quote"
      - "POST /v1/loads/{loadId}/repost — repost an uncovered load"
      - "POST /v1/loads/{loadId}/cancel — cancel a load"
      - "POST /v1/lane-contracts — create a lane contract"
      - "POST /v1/lane-contracts/{contractId}/activate — activate a lane contract"
      - "POST /v1/bookings/{bookingId}/invoice — invoice a delivered booking"
    shared_operations:
      - "GET /v1/loads, GET /v1/loads/{loadId} — read own loads"
      - "GET /v1/lane-contracts/{contractId} — read own contracts"
      - "POST /v1/claims — file a cargo claim"
      - "GET /v1/carrier-settlements/{settlementId} — read own settlements"
      - "POST /v1/bookings/{bookingId}/appointments — request an appointment"

  - name: Carrier
    description: "Motor carrier. Browses the load board, views and declines quotes, tenders at the locked price, reports tracking pings and elects quick pay."
    identity: entity_backed:Carrier
    exclusive_operations:
      - "POST /v1/rate-quotes/{quoteId}/view — open a quote"
      - "POST /v1/rate-quotes/{quoteId}/decline — decline a quote"
      - "POST /v1/bookings — tender on a load"
      - "POST /v1/loads/{loadId}/tracking-pings — report driver location and status"
      - "POST /v1/carrier-equipment — register an equipment unit"
      - "POST /v1/appointments/{appointmentId}/reschedule — pull an appointment earlier"
    shared_operations:
      - "GET /v1/loads — browse the board"
      - "GET /v1/rate-quotes/{quoteId} — read a quote"
      - "GET /v1/bookings/{bookingId} — read own bookings"

  - name: ComplianceReviewer
    description: "Onboarding and compliance operator. Only this role can advance a carrier through authority, insurance and safety verification."
    identity: opaque
    exclusive_operations:
      - "POST /v1/carriers/{carrierId}/verify-authority"
      - "POST /v1/carriers/{carrierId}/attest-insurance"
      - "POST /v1/carriers/{carrierId}/verify-safety"
    shared_operations:
      - "POST /v1/carriers — onboard a carrier"
      - "GET /v1/carriers/{carrierId} — read a carrier file"

  - name: ClaimsAdjuster
    description: "Cargo claims adjudicator. Runs review rounds, computes provisional liability and approves, denies, escalates or requests information."
    identity: opaque
    exclusive_operations:
      - "POST /v1/claims/{claimId}/review"
      - "POST /v1/claims/{claimId}/request-info"
      - "POST /v1/claims/{claimId}/approve"
      - "POST /v1/claims/{claimId}/deny"
      - "POST /v1/claims/{claimId}/escalate"
    shared_operations:
      - "GET /v1/claims/{claimId} — read a claim file"

  - name: PlatformAdmin
    description: "Platform operator with override power: market repricing, suspension, settlement payout, void compensation, detention waiver and the operations sweep."
    identity: opaque
    exclusive_operations:
      - "POST /v1/loads/{loadId}/reprice — re-price a posted load"
      - "POST /v1/loads/{loadId}/void — void and compensate"
      - "POST /v1/carriers/{carrierId}/suspend"
      - "POST /v1/carriers/{carrierId}/reinstate"
      - "POST /v1/shippers/{shipperId}/suspend"
      - "POST /v1/carrier-settlements/{settlementId}/payout"
      - "POST /v1/carrier-settlements/{settlementId}/unready"
      - "POST /v1/carrier-settlements/{settlementId}/clawback"
      - "POST /v1/detention-events/{detentionId}/waive"
      - "POST /v1/claims/{claimId}/settle"
      - "POST /v1/_ops/sweep"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "POST /v1/loads — create a load"
      - "POST /v1/carriers — onboard a carrier"
      - "POST /v1/bookings — broker a booking on a carrier's behalf"
      - "GET /v1/carrier-settlements/{settlementId} — read any settlement"