        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "concurrency_rules[store-config-stale-store]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Store.version: a PATCH carrying the version observed before another PATCH landed is rejected with ERR_STALE_VERSION (412); the store config reflects only the first writer's change."
        test_recipe:
          setup: ["Store S created (version 1); version captured once; first PATCH bumps it to 2."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "S-VAL9", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
