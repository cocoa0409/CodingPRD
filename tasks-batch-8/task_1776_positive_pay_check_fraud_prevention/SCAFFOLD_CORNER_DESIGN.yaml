            - { call: "POST /treasury/enrollments/${enr}/change-tier", payload: { new_tier: "REVERSE_POSITIVE_PAY", expected_enrollment_version: "${v3}" }, as: BankTreasuryManager, captures: { t: $.data.tier } }
