        distinguishing_aspect: "Bubble-up side effect: completing the walk flips the trade's has_completed_walk from false to true."
        test_recipe:
          setup: ["PUNCH_ACTIVE project, walk scheduled and window reached"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
