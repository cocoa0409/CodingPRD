              captures: { p52_a_id: "$.data.id" }
            - call: "POST /postdocs"
              payload: { full_name: "Second Load Scholar", email: "second.load@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-05-26" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_52"
              captures: { p52_b_id: "$.data.id" }
            - call: "POST /appointments"
              payload: { postdoc_id: "${p52_a_id}", mentor_id: "${m52_id}", funding_source_id: "${f52_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 62000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_52"
              captures: { a52_a_id: "$.data.id" }
            - call: "POST /appointments/${a52_a_id}/issue-offer"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_52"
