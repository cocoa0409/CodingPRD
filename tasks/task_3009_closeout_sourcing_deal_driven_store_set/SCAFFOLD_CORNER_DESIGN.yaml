# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3009_closeout_sourcing_deal_driven_store_set
# Breadth walk over SCAFFOLD.yaml §1.1-§1.7 per the claim-extraction guide.
# Logical clock default before any set call: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_vendor_missing_required_vendor_code
        claim_type: required_fields
        grounds: [entities.Vendor.fields.vendor_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /vendors without vendor_code (a required input field with no default) fails with ERR_INVALID_REQUEST; no vendor is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { name: "No Code Vendor" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "no Vendor row exists afterwards"

      - name: create_lot_system_defaults_and_provisional_cost
        claim_type: defaults_and_computed
        grounds: [entities.BuyLot.fields.commercial_status, entities.BuyLot.fields.qty_pool, calculations.landed_unit_cost]
        distinguishing_aspect: "A fresh lot starts SOURCED with safety PENDING_SCREEN, markdown_rounds 0, qty_pool == quantity_total, and landed_unit_cost_cents computed provisionally (input for computed fields would be ignored/rejected)."
        test_recipe:
          setup: ["vendor and jurisdiction exist"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Widget Lot", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 80, total_cost_cents: 80000, est_sellable_qty: 40, comparison_price_cents: 10000, vendor_msrp_cents: 10000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lot1: $.data.id, cs: $.data.commercial_status, ss: $.data.safety_status, pool: $.data.qty_pool, mr: $.data.markdown_rounds, luc: $.data.landed_unit_cost_cents, v: $.data.version }
          assert:
            - "${cs} == SOURCED and ${ss} == PENDING_SCREEN"
            - "${pool} == 80 and ${mr} == 0 and ${v} == 1"
            - "${luc} == 2000 (provisional: round_half_up(80000/40))"
            - "BuyLot.${lot1}.created_by_user_id == buyer-1"

      - name: create_lot_extra_field_rejected
        claim_type: unknown_input_rejection
        grounds: ["validations[priority=25]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Supplying an undeclared field (qty_pool) in the create payload is rejected; computed fields are never client-settable."
        test_recipe:
          setup: ["vendor and jurisdiction exist"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Widget Lot", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 80, total_cost_cents: 80000, est_sellable_qty: 40, comparison_price_cents: 10000, vendor_msrp_cents: 10000, pace_target_units_per_week: 10, qty_pool: 999 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: get_lot_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns the error envelope with ERR_NOT_FOUND, response_type error, and meta fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /lots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "HTTP status == 404 and envelope.response_type == error and meta.api_request_id is present"

      - name: create_member_invalid_tier_enum
        claim_type: type_constraints
        grounds: [entities.LoyaltyMember.fields.tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "tier is an enum; PLATINUM is not a member and must be rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["store exists"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /stores"
              payload: { name: "Store One", store_code: "S1", jurisdiction_id: "${jur_ca}", performance_tier: "TIER_1" }
              as: Admin
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { member_code: "M-X", tier: "PLATINUM", home_store_id: "${st1}" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: create_store_with_missing_jurisdiction_not_found
        claim_type: parent_relationships
        grounds: [entities.Store.fields.jurisdiction_id, "validations[priority=3]"]
        distinguishing_aspect: "A body FK reference to a nonexistent jurisdiction is an existence failure (ERR_NOT_FOUND 404), not a request-shape error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "Store X", store_code: "SX", jurisdiction_id: "00000000-0000-0000-0000-000000000000", performance_tier: "TIER_1" }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: lots_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /lots]"]
        distinguishing_aspect: "Default pagination (limit 10, offset 0) returns the first 10 of 11 lots with has_more true and total_count 11; offset 10 returns the last one with has_more false."
        test_recipe:
          setup: ["vendor, jurisdiction, and 11 lots exist"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Lot 01", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Lot 02", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Lot 03", source_type: "PACKAGE_CHANGE", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Lot 04", source_type: "PACKAGE_CHANGE", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Lot 05", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Lot 06", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Lot 07", source_type: "PACKAGE_CHANGE", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Lot 08", source_type: "PACKAGE_CHANGE", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Lot 09", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Lot 10", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Lot 11", source_type: "INSURANCE_SALVAGE", condition_grade: "B", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
          trigger:
            - call: "GET /lots"
              payload: {}
              as: Admin
            - call: "GET /lots?offset=10"
              payload: {}
              as: Admin
          assert:
            - "page 1 returns 10 items with total_count == 11 and has_more == true"
            - "GET /lots?offset=10 returns 1 item with has_more == false"

      - name: fk_reverse_vendor_lots_listing
        claim_type: parent_relationships
        grounds: [entities.BuyLot.fields.vendor_id, "endpoints[GET /vendors/{id}/lots]"]
        distinguishing_aspect: "The reverse-reachability GET lists exactly the lots created under a vendor; a second vendor's list is empty."
        test_recipe:
          setup: ["two vendors, one jurisdiction, one lot under vendor 1"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Beta Salvage", vendor_code: "BETA" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven2: $.data.id }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Widget Lot", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lot1: $.data.id }
          trigger:
            - call: "GET /vendors/${ven1}/lots"
              payload: {}
              as: Admin
            - call: "GET /vendors/${ven2}/lots"
              payload: {}
              as: Admin
          assert:
            - "GET /vendors/${ven1}/lots returns exactly 1 row whose id == ${lot1}"
            - "GET /vendors/${ven2}/lots returns 0 rows with total_count == 0"

      - name: complete_screening_twice_rejected
        claim_type: immutability
        grounds: [state_machines.SafetyScreening, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED screening is terminal: a second complete call fails with ERR_INVALID_STATE and does not change the stored result."
        test_recipe:
          setup: ["lot in SCREENING with round 1 PENDING"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Widget Lot", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 1000, vendor_msrp_cents: 1000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lot1: $.data.id }
            - call: "POST /lots/${lot1}/screenings"
              payload: {}
              as: SafetyOfficer
              as_user_id: so-1
              captures: { scr1: $.data.id }
            - call: "POST /lots/${lot1}/screenings/${scr1}/complete"
              payload: { recall_check: "PASS", expiration_check: "PASS", condition_verified: true, qty_grade_a: 10, qty_grade_b: 0, qty_grade_c: 0 }
              as: SafetyOfficer
              as_user_id: so-1
          trigger:
            - call: "POST /lots/${lot1}/screenings/${scr1}/complete"
              payload: { recall_check: "FAIL", expiration_check: "FAIL", condition_verified: false, qty_grade_a: 10, qty_grade_b: 0, qty_grade_c: 0 }
              as: SafetyOfficer
              as_user_id: so-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "SafetyScreening.${scr1}.result remains PASSED and BuyLot.${lot1}.commercial_status remains CLEARED"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: price_lot_before_screening_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BuyLot, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLEARED -> PRICED is the only pricing entry: pricing a SOURCED lot (screening never opened) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["lot in SOURCED"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Widget Lot", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 10, total_cost_cents: 1000, est_sellable_qty: 10, comparison_price_cents: 10000, vendor_msrp_cents: 10000, pace_target_units_per_week: 10 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lot1: $.data.id }
          trigger:
            - call: "POST /lots/${lot1}/price"
              payload: { retail_price_cents: 4000, advertises_comparison: true }
              as: PricingLead
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "BuyLot.${lot1}.retail_price_cents remains null"

      - name: refund_refunded_purchase_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Purchase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REFUNDED is terminal: a second refund fails with ERR_INVALID_STATE and the restoration side effects do not fire twice."
        test_recipe:
          setup: ["lot ON_SALE at S1 with 60 on hand; purchase of 2 refunded once"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /stores"
              payload: { name: "Store One", store_code: "S1", jurisdiction_id: "${jur_ca}", performance_tier: "TIER_1" }
              as: Admin
              captures: { st1: $.data.id, st1_v: $.data.version }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Widget Lot", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 100, total_cost_cents: 100000, est_sellable_qty: 100, comparison_price_cents: 10000, vendor_msrp_cents: 10000, pace_target_units_per_week: 1000 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lot1: $.data.id }
            - call: "POST /lots/${lot1}/screenings"
              payload: {}
              as: SafetyOfficer
              as_user_id: so-1
              captures: { scr1: $.data.id }
            - call: "POST /lots/${lot1}/screenings/${scr1}/complete"
              payload: { recall_check: "PASS", expiration_check: "PASS", condition_verified: true, qty_grade_a: 100, qty_grade_b: 0, qty_grade_c: 0 }
              as: SafetyOfficer
              as_user_id: so-1
            - call: "POST /lots/${lot1}/price"
              payload: { retail_price_cents: 4000, advertises_comparison: true }
              as: PricingLead
            - call: "POST /lots/${lot1}/allocations"
              payload: { store_id: "${st1}", qty_requested: 60 }
              as: AllocationManager
              captures: { al1: $.data.id }
            - call: "POST /lots/${lot1}/allocations/commit"
              payload: {}
              as: AllocationManager
            - call: "POST /lots/${lot1}/allocations/${al1}/ship"
              payload: {}
              as: AllocationManager
            - call: "POST /lots/${lot1}/allocations/${al1}/receive"
              payload: {}
              as: AllocationManager
            - call: "POST /stores/${st1}/aisle-assignments"
              payload: { lot_id: "${lot1}", aisle_code: "A1", daily_unit_limit: 10, expected_store_version: "${st1_v}" }
              as: StoreManager
            - call: "POST /stores/${st1}/purchases"
              payload: { lot_id: "${lot1}", qty: 2 }
              as: Anonymous
              captures: { pur1: $.data.id }
            - call: "POST /purchases/${pur1}/refund"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /purchases/${pur1}/refund"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
            - call: "GET /stores/${st1}/allocations"
              payload: {}
              as: Admin
              captures: { onhand: "$.data[0].store_on_hand_qty" }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "${onhand} == 60 (restoration did not double-fire)"
            - "BuyLot.${lot1}.qty_sold == 0"

      - name: waterfall_zero_grant_stays_proposed
        grounds: [calculations.allocation_waterfall, state_machines.Allocation]
        claim_type: valid_transition
        distinguishing_aspect: "An allocation whose waterfall turn finds an empty pool keeps status PROPOSED with qty_granted 0 while earlier-tier allocations confirm; a later commit after a release can still confirm it."
        test_recipe:
          setup:
            - "Lot PRICED, qty_pool 100; TIER_1 store S1 requests 100; TIER_3 store S3 requests 20"
            - "first commit: S1 granted 100, S3 granted 0"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /stores"
              payload: { name: "Store One", store_code: "S1", jurisdiction_id: "${jur_ca}", performance_tier: "TIER_1" }
              as: Admin
              captures: { st1: $.data.id }
            - call: "POST /stores"
              payload: { name: "Store Three", store_code: "S3", jurisdiction_id: "${jur_ca}", performance_tier: "TIER_3" }
              as: Admin
              captures: { st3: $.data.id }
            - call: "POST /lots"
