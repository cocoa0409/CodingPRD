              captures: { uncommitted_after: $.data.uncommitted_amount, posture_after: $.data.posture }
          assert:
            - "${posture_initial} == OPEN and ${cap_one} == 11086.88"
            - "${fee_one} == 450.00, ${charge_one} == 9450.00, ${payback_one} == 6.26"
            - "${uncommitted_boundary} == 1050.00 - exactly FUND_CONSTRAINED_PCT (10.00%) of 10500.00"
            - "${posture_boundary} == OPEN - the CONSTRAINED band is a strict inequality, so the boundary value stays OPEN"
            - "${cap_two_at_request} == 1125.00 - at request time no fund is named, so the residual clamp is skipped"
            - "the decision-time cap recomputed for ${bid_two_id} is min(1125.00, 1050.00) == 1050.00, which still admits the 100.00 approval"
            - "${fee_two} == 5.00, ${charge_two} == 105.00, ${payback_two} == 57.14"
            - "${uncommitted_after} == 945.00 and ${posture_after} == CONSTRAINED"
            - "IncentiveFund.${fund_id}.committed_amount == 9555.00"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: bid_submission_depends_on_a_live_space_hold_on_another_entity
        grounds:
          - validations[priority 29 ERR_NO_ACTIVE_SPACE_HOLD]
          - state_machines.BidPackage.APPROVED_to_SUBMITTED
          - state_machines.SpaceHold.HELD_to_RELEASED
