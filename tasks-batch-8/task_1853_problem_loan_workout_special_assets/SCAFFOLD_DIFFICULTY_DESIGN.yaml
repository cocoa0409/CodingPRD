# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Task 1853: Problem Loan Workout
# §1.8 Test Targeting Index — 9 Difficulty Rules × >= 2 instances.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: reserve_measurement_cecl_vs_tdr_dcf_divergence
        grounds:
          - calculations.cecl_reserve
          - calculations.tdr_dcf_reserve
          - state_machines.ImpairmentAssessment.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Same case and same loan principal: a FINALIZED CECL assessment
          (PD×LGD probability weighting) and a FINALIZED TDR_DCF assessment
          (cash flows discounted at the loan's ORIGINAL contractual rate)
          produce different reserves, and the case reserve always reflects
          the LATEST finalization — this is the reserve-accounting entity
          domain, distinct from the recovery-allocation ledger domain.
        test_recipe:
          setup:
            - "Borrower with risk rating 8; loan L1 original=current principal 100,000,000 cents, rate 1200 bps, 75 days past due"
            - "Case C1 on L1 driven to IMPAIRMENT_REVIEW via plan approval + proposal consummation WITH a concession (concession_rate_bps 600 < 1200) so tdr_status == TDR_CONFIRMED"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Acme Properties LLC", tax_id: "12-3456789", naics_code: "531120", internal_risk_rating: 8, guarantor_name: "G Smith", guarantor_net_worth_cents: 50000000 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-1001", original_principal_cents: 100000000, contractual_rate_bps: 1200, days_past_due: 75 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 8, case_officer_id: "officer-1" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Negotiate then consummate", target_resolution_date: "2027-02-01T00:00:00Z", milestone_count: 3, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-1"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-1"
            - call: "GET /loans/${loan_id}/workout-cases/${case_id}"
              payload: {}
              as: WorkoutOfficer
              captures: { case_v_cur: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals"
              payload: { proposal_kind: "MODIFICATION", concession_rate_bps: 600, term_extension_months: 24, principal_forgiveness_cents: 0, borrower_concession_cents: 0, expected_case_version: "${case_v_cur}" }
              as: WorkoutOfficer
              as_user_id: "officer-1"
              captures: { prop_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-1"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/escalate-to-committee"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-1"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/committee-approve"
              payload: {}
              as: CreditCommittee
              as_user_id: "cc-1"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/consummate"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/impairments"
              payload: { method: "CECL", probability_of_default_bps: 2500, loss_given_default_bps: 4000 }
              as: LoanAccounting
              as_user_id: "acct-1"
              captures: { cecl_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/impairments/${cecl_id}/finalize"
              payload: {}
              as: LoanAccounting
              as_user_id: "acct-1"
              captures: { cecl_reserve: $.data.computed_reserve_cents }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/impairments"
              payload: { method: "TDR_DCF", probability_of_default_bps: 2500, loss_given_default_bps: 4000, expected_cash_flows: [ { period_index: 1, amount_cents: 5000000 }, { period_index: 12, amount_cents: 40000000 }, { period_index: 24, amount_cents: 50000000 } ] }
              as: LoanAccounting
              as_user_id: "acct-1"
              captures: { dcf_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/impairments/${dcf_id}/finalize"
              payload: {}
              as: LoanAccounting
              as_user_id: "acct-1"
              captures: { dcf_reserve: $.data.computed_reserve_cents }
          assert:
            - "ImpairmentAssessment.${cecl_id}.computed_reserve_cents == 10000000"
            - "ImpairmentAssessment.${dcf_id}.computed_reserve_cents == 20173230"
            - "ImpairmentAssessment.${cecl_id}.computed_reserve_cents != ImpairmentAssessment.${dcf_id}.computed_reserve_cents"
            - "After second finalize: ImpairmentAssessment.${cecl_id}.is_active == false and ImpairmentAssessment.${cecl_id}.status == SUPERSEDED"
            - "WorkoutCase.${case_id}.impairment_reserve_cents == 20173230 (latest finalization wins)"

      - name: recovery_allocation_chronological_vs_waterfall_divergence
        grounds:
          - calculations.recovery_allocation
          - state_machines.WorkoutCase.NEGOTIATION_to_IMPAIRMENT_REVIEW
        distinguishing_aspect: |
          Same loan state (charged_off=20,000,000, current=50,000,000) and
          same recovery amount 30,000,000 cents: CHRONOLOGICAL allocation
          fills charged-off first (current falls to 40,000,000) while
          WATERFALL diverts a 10% costs tier first (current falls only to
          43,000,000) — the ledger-domain dual variant, distinct from the
          reserve-measurement domain.
        test_recipe:
          setup:
            - "Loan L1 principal 100,000,000 with a case in LEGAL; one 20,000,000 charge-off booked so charged_off=20,000,000 and current=80,000,000 at the moment the two variant recoveries run"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Beacon Retail Inc", tax_id: "98-7654321", naics_code: "452210", internal_risk_rating: 9, guarantor_name: "", guarantor_net_worth_cents: 0 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-2002", original_principal_cents: 100000000, contractual_rate_bps: 900, days_past_due: 120 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 9, case_officer_id: "officer-9" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Legal track", target_resolution_date: "2027-01-01T00:00:00Z", milestone_count: 2, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-9"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-9"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-9"
              captures: {}
            - call: "GET /loans/${loan_id}/workout-cases/${case_id}"
              payload: {}
              as: WorkoutOfficer
              captures: { case_v2: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/legal-referrals"
              payload: { referral_kind: "FORECLOSURE", demand_amount_cents: 0, statute_deadline: "2028-01-01T00:00:00Z", decision_rationale: "Value-maximizing path" }
              as: WorkoutOfficer
              as_user_id: "officer-9"
              captures: { ref_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/legal-referrals/${ref_id}/accept"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-9"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/charge-offs"
              payload: { amount_cents: 20000000, reason_code: "CONFIRMED_LOSS" }
              as: LoanAccounting
              as_user_id: "acct-9"
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/recoveries"
              payload: { amount_cents: 30000000, recovery_source: "NOTE_SALE_PROCEEDS", allocation_mode: "CHRONOLOGICAL" }
              as: LoanAccounting
              as_user_id: "acct-9"
              captures: { loan_after_chrono: $.data }
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: LoanAccounting
              captures: { co_a: $.data.charged_off_principal_cents, cur_a: $.data.current_principal_cents }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/recoveries"
              payload: { amount_cents: 30000000, recovery_source: "NOTE_SALE_PROCEEDS", allocation_mode: "WATERFALL" }
              as: LoanAccounting
              as_user_id: "acct-9"
          assert:
            - "After CHRONOLOGICAL recovery of 30,000,000: Loan.charged_off_principal_cents == 0 (20,000,000 bucket filled first) and Loan.current_principal_cents == 70000000 (10,000,000 spilled to current)"
            - "After the subsequent WATERFALL recovery of 30,000,000 on the post-chrono state (charged_off=0, current=70,000,000): costs tier == 3,000,000 and Loan.current_principal_cents == 43000000 (27,000,000 applied to current after the 3,000,000 costs tier, charged_off empty)"
            - "CHRONOLOGICAL first-fill target (charged_off) differs from WATERFALL first-fill target (costs tier) for identical amounts — the two variants disagree on bucket order"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: forgiveness_cap_state_dependent_threshold
        grounds:
          - calculations.forgiveness_cap_check
          - state_machines.RestructureProposal.COMMITTEE_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Mode (a): >=3 inputs with state-dependent branching — the cap result
          depends on loan.charged_off_principal_cents (mutable state),
          loan.original_principal_cents (immutable), and
          proposal.principal_forgiveness_cents (input), with an inclusive
          boundary (== cap passes, > cap fails).
        test_recipe:
          setup:
            - "Loan original 100,000,000; case in NEGOTIATION; a prior 20,000,000 charge-off already booked so the forgiveness headroom is exactly 5,000,000 (cap 25% of original = 25,000,000, inclusive)"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Capstone Holdings", tax_id: "11-1111111", naics_code: "237110", internal_risk_rating: 7, guarantor_name: "", guarantor_net_worth_cents: 0 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-3003", original_principal_cents: 100000000, contractual_rate_bps: 800, days_past_due: 95 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 7, case_officer_id: "officer-3" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Restructure with forgiveness", target_resolution_date: "2027-03-01T00:00:00Z", milestone_count: 1, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-3"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-3"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-3"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/charge-offs"
              payload: { amount_cents: 20000000, reason_code: "PARTIAL_IMPAIRMENT" }
              as: LoanAccounting
              as_user_id: "acct-3"
            - call: "GET /loans/${loan_id}/workout-cases/${case_id}"
              payload: {}
              as: WorkoutOfficer
              captures: { case_v3: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals"
              payload: { proposal_kind: "RESTRUCTURE", concession_rate_bps: 500, term_extension_months: 12, principal_forgiveness_cents: 5000000, borrower_concession_cents: 0, expected_case_version: "${case_v3}" }
              as: WorkoutOfficer
              as_user_id: "officer-3"
              captures: { prop_ok: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_ok}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-3"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_ok}/escalate-to-committee"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-3"
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_ok}/committee-approve"
              payload: {}
              as: CreditCommittee
              as_user_id: "cc-3"
          assert:
            - "Approval succeeds: cumulative_after == 20,000,000 + 5,000,000 == 25,000,000 == cap (inclusive boundary passes)"
            - "RestructureProposal.${prop_ok}.status == APPROVED"

      - name: recovery_waterfall_costs_tier_nested_rounding
        grounds:
          - calculations.recovery_allocation
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the costs tier is
          ceil(10% of the recovery amount) computed BEFORE bucket allocation;
          applying percentage to the amount vs to each bucket separately
          produces different cents (pinned: ceil on the total, once).
        test_recipe:
          setup:
            - "Loan with case in LEGAL; charged_off=0 and current=10,000,001 so a 10,000,001 recovery under WATERFALL produces costs tier ceil(1,000,000.1)=1,000,001 and current reduction of 9,000,000"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Delta Manufacturing", tax_id: "22-2222222", naics_code: "332710", internal_risk_rating: 8, guarantor_name: "", guarantor_net_worth_cents: 0 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-4004", original_principal_cents: 10000001, contractual_rate_bps: 1100, days_past_due: 100 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 8, case_officer_id: "officer-4" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Liquidate", target_resolution_date: "2027-01-15T00:00:00Z", milestone_count: 1, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-4"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-4"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-4"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/legal-referrals"
              payload: { referral_kind: "NOTE_SALE_PREP", demand_amount_cents: 0, statute_deadline: "2028-06-01T00:00:00Z", decision_rationale: "Note sale prep" }
              as: WorkoutOfficer
              as_user_id: "officer-4"
              captures: { ref_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/legal-referrals/${ref_id}/accept"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-4"
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/recoveries"
              payload: { amount_cents: 10000001, recovery_source: "NOTE_SALE_PROCEEDS", allocation_mode: "WATERFALL" }
              as: LoanAccounting
              as_user_id: "acct-4"
          assert:
            - "Costs tier == ceil(10,000,001 * 0.10) == 1,000,001 cents (nested rounding: ceil applied once to the whole amount, not per bucket)"
            - "Loan.current_principal_cents == 0 (10,000,001 - 1,000,001 costs - 9,000,000 to current)"
            - "WorkoutCase.${case_id}.unapplied_cash_cents == 0"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_negotiation_cycle_round_increment
        grounds:
          - state_machines.RestructureProposal.UNDER_BORROWER_REVIEW_to_COUNTERED
          - state_machines.RestructureProposal.COUNTERED_to_RESUBMITTED
          - state_machines.RestructureProposal.RESUBMITTED_to_UNDER_BORROWER_REVIEW
        distinguishing_aspect: |
          Cyclic shape on RestructureProposal: UNDER_BORROWER_REVIEW →
          COUNTERED → RESUBMITTED → UNDER_BORROWER_REVIEW may repeat, and
          negotiation_round increments exactly once per completed cycle.
        test_recipe:
          setup:
            - "Case in NEGOTIATION with one proposal at UNDER_BORROWER_REVIEW (negotiation_round == 1)"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Everett Logistics", tax_id: "33-3333333", naics_code: "484110", internal_risk_rating: 6, guarantor_name: "", guarantor_net_worth_cents: 0 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-5005", original_principal_cents: 50000000, contractual_rate_bps: 1000, days_past_due: 65 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "RISK_RATING_DOWNGRADE", risk_rating_at_entry: 6, case_officer_id: "officer-5" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Negotiate", target_resolution_date: "2027-04-01T00:00:00Z", milestone_count: 2, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-5"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-5"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-5"
            - call: "GET /loans/${loan_id}/workout-cases/${case_id}"
              payload: {}
              as: WorkoutOfficer
              captures: { case_v2: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals"
              payload: { proposal_kind: "FORBEARANCE", concession_rate_bps: 900, term_extension_months: 6, principal_forgiveness_cents: 0, borrower_concession_cents: 1000000, expected_case_version: "${case_v2}" }
              as: WorkoutOfficer
              as_user_id: "officer-5"
              captures: { prop_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-5"
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/counter"
              payload: { concession_rate_bps: 850, term_extension_months: 6, principal_forgiveness_cents: 0, borrower_concession_cents: 1000000 }
              as: WorkoutOfficer
              as_user_id: "officer-5"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/resubmit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-5"
              captures: { after_round1: $.data.negotiation_round }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/counter"
              payload: { concession_rate_bps: 800, term_extension_months: 9, principal_forgiveness_cents: 0, borrower_concession_cents: 1500000 }
              as: WorkoutOfficer
              as_user_id: "officer-5"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/resubmit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-5"
              captures: { after_round2: $.data.negotiation_round }
          assert:
            - "After first cycle: negotiation_round == 2 and status == UNDER_BORROWER_REVIEW"
            - "After second cycle: negotiation_round == 3 and status == UNDER_BORROWER_REVIEW"
            - "The cycle UNDER_BORROWER_REVIEW → COUNTERED → RESUBMITTED → UNDER_BORROWER_REVIEW is repeatable (non-linear)"

      - name: action_plan_revision_loop_and_supersede
        grounds:
          - state_machines.ActionPlan.SUBMITTED_to_REJECTED
          - state_machines.ActionPlan.REJECTED_to_DRAFT
          - state_machines.ActionPlan.APPROVED_to_SUPERSEDED
        distinguishing_aspect: |
          Branching-with-revert shape on ActionPlan (different entity than
          the proposal cycle): DRAFT → SUBMITTED → REJECTED → DRAFT loops,
          and a later APPROVED plan supersedes an earlier APPROVED plan.
        test_recipe:
          setup:
            - "Case in ACTION_PLAN with plan P1 that has been through one reject-revise loop and is APPROVED; a second plan P2 naming supersedes_plan_id=P1 approved afterwards"
          setup_api_calls:
            - call: "POST /borrowers"
