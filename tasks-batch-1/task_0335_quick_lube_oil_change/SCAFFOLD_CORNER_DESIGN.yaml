  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_bay_version_excluded
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[queue-assign-stale-bay]"
          - "errors[ERR_STALE_BAY_VERSION]"
        excluded_because:
          difficulty_instance: non_linear_state_machine / queue_ticket_cyclic_assign_requeue_reassign
          rationale: "The bay-version OCC field is captured and re-used across the cyclic assign/re-assign chain in the named §1.8 instance; the stale-version negative is enumerated below."

      - name: occ_stale_work_order_version_on_add_line
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[add-line-stale-work-order]"
          - "errors[ERR_STALE_WORK_ORDER_VERSION]"
        distinguishing_aspect: "Adding a second line with a stale expected_work_order_version (the version observed before the first line bumped it) returns ERR_STALE_WORK_ORDER_VERSION 412."
        test_recipe:
          setup: ["An order in INSPECTION; one line already added (version advanced); a second add reuses the pre-add version."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
