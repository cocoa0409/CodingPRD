          - calculations.field_posture_derivation
          - errors.ERR_FIELD_FROZEN
        distinguishing_aspect: |
          A field with no wells is FROZEN purely by derivation — no emergency, no failed test — and
          that derived posture is enough to block BOTH commercial commitment (contract activation)
          and physical commitment (booking a compressor run) with the same 422. Registering a single
          well flips the posture to OPEN and both calls then succeed unchanged, proving the gate
          reads the live posture rather than a stored flag.
        test_recipe:
          setup:
            - "Field F_MINI with NO wells, so its derived posture is FROZEN and both rates are 0."
            - "Compressor unit U-1 (rated 6000 hp) is registered on the field — unit registration is not posture-gated."
            - "Shipper NORTHLINE holds a DRAFT FIRM contract CN-1 on that field."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
