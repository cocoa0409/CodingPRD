        grounds:
          - validations.public-notice-lead-sufficient
          - entities.LATestSession.fields.notice_lead_minutes
          - entities.Election.fields.la_notice_hours
          - errors.ERR_PUBLIC_NOTICE_TOO_LATE
        distinguishing_aspect: |
          The notice requirement is la_notice_hours * 60 == 2880 whole minutes and the comparison is
          `notice_lead_minutes < 2880`, i.e. a lead of exactly 2880 is SUFFICIENT. Three sessions on
          three separate units differ only in the minute their notice was posted - 2881, 2880 and
          2879 minutes of lead - and only the 2879 one is rejected. An off-by-one implementation
          (using > instead of >=, or truncating the lead to whole hours, which would map all three to
          48 hours and admit every session) is caught by the middle and last cells together.
