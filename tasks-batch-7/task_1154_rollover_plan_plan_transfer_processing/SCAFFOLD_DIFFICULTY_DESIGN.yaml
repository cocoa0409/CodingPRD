            - "resubmission: status == SUBMITTED (${st_sub2}) and reviewed_by cleared to null (${rev_by_after})"
            - "final review: status == ACCEPTED (${st_acc}) — full cycle SUBMITTED -> REJECTED -> SUBMITTED -> ACCEPTED"
            - "owning case remained DOCS_PENDING while a sibling doc was still REQUIRED (${case_st} in {DOCS_PENDING, ELIGIBILITY_REVIEW})"

