              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_THERAPIST_DOUBLE_BOOKED (10-min gap < 15-min buffer)"

      - name: overlap_auth_window_closed_touching
        grounds:
          - validations[priority=8]
          - entities.Authorization.fields.effective_start_date
          - entities.Authorization.fields.effective_end_date
        distinguishing_aspect: "A second authorization for the same patient+region whose window starts exactly on the first window's end date (2026-06-30) is rejected with ERR_AUTH_WINDOW_OVERLAP — closed-inclusive date intervals where touching endpoints overlap and there is no buffer, a different interval semantics and resource than the therapist rule."
        test_recipe:
          setup:
            - "Patient with an existing LEFT_ARM authorization window 2026-05-01..2026-06-30 (status DRAFT counts)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Ov Two", mrn: "MRN-1" }
