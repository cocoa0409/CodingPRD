  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: print_market_transfer_cycle_reenters_in_progress
        grounds:
          - state_machines.PrintMarket.transitions.consolidation_planned_to_transfer_in_progress
          - state_machines.PrintMarket.transitions.transfer_in_progress_to_active
          - state_machines.PrintMarket.transitions.transfer_in_progress_to_withdrawn
          - endpoints.POST_/regional-news-ops/print-markets/{id}/redispatch
        distinguishing_aspect: "The PrintMarket consolidation machine is a cycle rather than a pipeline: a redispatch returns the market to active, so a second plan-transfer legitimately drives consolidation_planned -> transfer_in_progress again and the same row visits transfer_in_progress twice before the cycle can terminate at withdrawn."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub, sites KOT and CED, region North, market Riverton, route KOT->Riverton, contractor Cedar Hill with route R1 and one stop in Riverton, and a second route CED->Riverton created before the cycle opens."
          setup_api_calls:
            - *t_clock
            - *t_hub
            - *t_site_kot
            - *t_site_ced
            - *t_region_n
            - *t_mkt_riv
            - *t_route_kot
            - *t_contractor_cedar
            - *t_droute_riv
            - call: "POST /regional-news-ops/delivery-routes/${droute_riv_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S1", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
              captures: { stop_riv_id: $.data.id }
            - call: "POST /regional-news-ops/print-sites/${site_ced_id}/routes"
              payload: { destination_market_id: "${mkt_riv_id}", transit_minutes: 205, dispatch_cutoff_utc: "01:00", is_direct_hop: true, buffer_minutes: 45 }
              as: PrintOperationsDirector
              captures: { route_ced_id: $.data.id }
            - call: "GET /regional-news-ops/region-hubs/${hub_id}"
              payload: {}
              as: PrintOperationsDirector
              captures: { hub_v1: $.data.version }
            - *t_plan_riv
          trigger:
            - call: "POST /regional-news-ops/print-sites/${site_kot_id}/plan-closure"
              payload: {}
              as: PrintOperationsDirector
              captures: { site_status: $.data.status }
            - call: "GET /regional-news-ops/print-markets/${mkt_riv_id}"
              payload: {}
              as: PrintOperationsDirector
              captures: { riv_cycle1: $.data.status, riv_needs: $.data.route_selection_status }
            - call: "POST /regional-news-ops/print-markets/${mkt_riv_id}/redispatch"
              payload: { receiving_print_site_id: "${site_ced_id}" }
              as: PrintOperationsDirector
              captures: { riv_back_active: $.data.status, riv_route2: $.data.selected_print_route_id }
            - call: "GET /regional-news-ops/region-hubs/${hub_id}"
              payload: {}
              as: PrintOperationsDirector
              captures: { hub_v2: $.data.version }
            - call: "POST /regional-news-ops/print-markets/${mkt_riv_id}/plan-transfer"
              payload: { receiving_print_site_id: "${site_ced_id}", expected_hub_version: "${hub_v2}" }
              as: PrintOperationsDirector
              captures: { riv_cycle2: $.data.status }
          assert:
            - "PrintMarket Riverton status is transfer_in_progress after its selected route is orphaned, and route_selection_status == needs_reassignment"
            - "PrintMarket Riverton status == active after the redispatch, proving the cycle returns to its entry state rather than advancing"
            - "PrintMarket Riverton status == consolidation_planned after a second plan-transfer, proving transfer_in_progress is reachable twice on the same row"
            - "PrintSite KOT status == closing and PrintSite CED status == active at the point of the second plan-transfer"

      - name: subscriber_retention_fork_loops_back_to_active
        grounds:
          - state_machines.SubscriberContract.transitions.active_to_churned_pending_retention
          - state_machines.SubscriberContract.transitions.churned_pending_retention_to_active
          - state_machines.SubscriberContract.transitions.churned_pending_retention_to_churned
          - state_machines.SubscriberContract.transitions.active_to_churned
          - endpoints.POST_/regional-news-ops/subscribers/{id}/accept-retention-offer
        distinguishing_aspect: "The SubscriberContract machine is a fork-join cycle on a different entity from PrintMarket: active forks into a retention branch that loops back to active and an exit branch that terminates at churned, so a churned_pending_retention subscriber is observed returning to active and then exiting later through a different edge."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub, site KOT, region North, market Riverton, route, contractor Cedar Hill, delivery route R1 with one stop, and one subscriber SUB-LOOP carried on that stop with 40 remaining issues."
          setup_api_calls:
            - *t_clock
            - *t_hub
            - *t_site_kot
            - *t_region_n
            - *t_mkt_riv
            - *t_route_kot
            - *t_contractor_cedar
            - *t_droute_riv
            - call: "POST /regional-news-ops/delivery-routes/${droute_riv_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S1", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
              captures: { stop_riv_id: $.data.id }
            - call: "POST /regional-news-ops/delivery-stops/${stop_riv_id}/subscribers"
              payload: { subscriber_ref: "SUB-LOOP", remaining_print_issues: 40, paid_through_utc: "2027-06-01T00:00:00Z", print_issue_value_cents: 1200 }
              as: CustomerService
              captures: { sub_loop_id: $.data.id }
            - call: "POST /regional-news-ops/delivery-stops/${stop_riv_id}/terminate"
              payload: {}
              as: DeliveryNetworkManager
          trigger:
            - call: "GET /regional-news-ops/subscribers/${sub_loop_id}"
              payload: {}
              as: CustomerService
              captures: { sub_status1: $.data.status, sub_delivery: $.data.delivery_status }
            - call: "POST /regional-news-ops/delivery-contractors/${con_cedar_id}/reinstate"
              payload: {}
              as: DeliveryNetworkManager
              captures: { con_back: $.data.status }
            - call: "POST /regional-news-ops/delivery-stops/${stop_riv_id}/resume"
              payload: {}
              as: DeliveryNetworkManager
              captures: { stop_back: $.data.status }
            - call: "POST /regional-news-ops/subscribers/${sub_loop_id}/cancel"
              payload: {}
              as: CustomerService
              captures: { sub_exit: $.data.status, sub_exit_credit: $.data.churn_retention_credit_cents }
          assert:
            - "SubscriberContract SUB-LOOP status == churned_pending_retention and delivery_status == terminated after its stop is terminated"
            - "SubscriberContract SUB-LOOP status == churned after the exit edge fires, i.e. the retention branch's sibling edge is reachable from the same fork point"
            - "SubscriberContract SUB-LOOP churn_retention_credit_cents == 5000 at exit"
            - "DeliveryStop S1 status == terminated remains terminal, so resume is refused and the stop does not re-enter active"

      - name: newsroom_change_settlement_reopens_to_proposed
        grounds:
          - state_machines.NewsroomChange.transitions.proposed_to_approved
          - state_machines.NewsroomChange.transitions.approved_to_proposed
          - state_machines.NewsroomChange.transitions.approved_to_applied
          - state_machines.NewsroomChange.transitions.proposed_to_rejected
          - concurrency_rules[newsroom-residual-stale-hub]
        distinguishing_aspect: "The NewsroomChange settlement machine is a revision cycle on a third entity: an approved change can be reopened to proposed, re-approved, and reopened again as often as revisions are demanded, so approval is not a one-way gate and only applied or rejected ends the loop."
