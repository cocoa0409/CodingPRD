  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_case_schedule_both_violated
        grounds:
          - validations.priority_6_state (ERR_TRUCK_DECOMMISSIONED is not triggered here — used to differentiate)
          - validations.priority_7_state (ERR_INVALID_STATE_TRANSITION)
          - validations.priority_9_business_safety (ERR_BAY_TIME_CONFLICT)
          - validations.priority_10_business_safety (ERR_DEALER_NOT_AVAILABLE)
        distinguishing_aspect: |
          Pair: state (priority 7, ERR_INVALID_STATE_TRANSITION) vs business_safety
          (priority 9, ERR_BAY_TIME_CONFLICT). A Case still in OPEN (never TRIAGED)
          AND a bay that already has an AUTHORIZED work order overlapping the
          requested window — both fail. Priority 7 must win: the response is
          ERR_INVALID_STATE_TRANSITION, NOT ERR_BAY_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fleet/Truck/Dealer/Bay."
            - "Case A is fully scheduled onto Bay B1 with window 2026-09-01T13:00-17:00 (work order AUTHORIZED, bay RESERVED)."
            - "Case B is in OPEN state (never TRIAGED)."
            - "Request: schedule Case B onto Bay B1 with window 2026-09-01T14:00-16:00 (overlaps Case A)."
