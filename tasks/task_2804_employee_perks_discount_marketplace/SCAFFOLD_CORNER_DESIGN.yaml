        grounds:
          - calculations.employer_program_posture
          - state_machines.Employer.storefront_status
          - state_machines.Employer.integration_status
          - entities.Employer.fields.program_posture
          - endpoints[POST /_ops/run-epoch]
        distinguishing_aspect: |
          One employer walks every row of the ordered posture table in order: DRAFT and BRANDED
          give SETUP, PUBLISHED with NOT_CONFIGURED and then with VALIDATED still give SETUP,
          SYNCED gives LIVE, SUSPENDED gives FROZEN even though the integration is healthy, and
          after the 45-day staleness sweep PUBLISHED with STALE gives RESTRICTED.
