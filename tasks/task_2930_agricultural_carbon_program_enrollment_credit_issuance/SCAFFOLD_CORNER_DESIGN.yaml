  - section: errors
    instances:
      - name: baseline_from_another_enrollment_is_refused_before_data_sufficiency_is_checked
        claim_type: priority_ordering
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - errors[ERR_BASELINE_ENROLLMENT_MISMATCH]
          - errors[ERR_NO_QUALIFYING_DATA]
          - endpoints[POST /quantification-runs]
        distinguishing_aspect: "One enrollment with no PASSED packet at all violates BOTH the priority-20 cross-reference rule and the priority-21 sufficiency rule; naming the sibling enrollment's approved baseline returns ERR_BASELINE_ENROLLMENT_MISMATCH, and only after the baseline is corrected does the same call surface ERR_NO_QUALIFYING_DATA."
        test_recipe:
          setup:
            - "one grower with two non-overlapping fields and two ACCEPTED enrollments A and B, each with its own APPROVED HISTORICAL_DATA baseline"
            - "no data packet exists for either enrollment, so neither has qualifying data"
