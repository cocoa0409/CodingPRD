    instances:

      - name: transport_approve_then_cancel_conserves_school_release_minutes
        grounds:
          - invariants.release_minutes_conservation
          - state_machines.TransportRequest.REQUESTED_to_APPROVED
          - state_machines.TransportRequest.APPROVED_to_CANCELLED
          - entities.School.fields.release_minutes_used
          - entities.TransportRequest.fields.release_minutes
          - calculations.transport_release_window
        distinguishing_aspect: |
          The conserved quantity is instructional release MINUTES: School.release_minutes_used must
          equal the sum of release_minutes over the school's APPROVED and COMPLETED trips at every
          instant, so approving a 60-minute trip moves it 0 -> 60 and cancelling that same trip must
          move it 60 -> 0 exactly, with the trip row still reporting release_minutes 60.
        test_recipe:
          setup:
            - "North High with school_day_end_utc_hhmm 17:00 and bus_fleet_size 2; South High as opponent."
            - "A FOOTBALL C3A season in REGULAR_SEASON with required_officials 1 and one staffed contest in OFFICIALS_ASSIGNED."
            - "One REQUESTED trip by North High with travel_minutes 45 and release_minutes 60, and School.release_minutes_used still 0."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: AssociationAdmin
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH", school_day_end_utc_hhmm: "17:00", bus_fleet_size: 2, max_release_minutes_per_request: 240 }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /athletics/schools"
              payload: { name: "South High", classification: "C3A", region_code: "R-SOUTH" }
              as: AssociationAdmin
              captures: { sch_b: $.data.id }
            - call: "POST /athletics/sport-seasons"
              payload: { sport: "FOOTBALL", classification: "C3A", school_year: "2026-2027", sport_tier: "TIER_A", practice_start_date: "2026-08-05", first_contest_date: "2026-09-01", season_end_date: "2026-11-15", age_cutoff_date: "2026-09-01", residency_deadline: "2026-08-20", grading_lock_date: "2026-10-01", contest_limit: 10, required_officials: 1 }
              as: AssociationAdmin
              captures: { seas_f: $.data.id }
            - call: "POST /athletics/sport-seasons/${seas_f}/advance"
              payload: { to_status: "PRACTICE_OPEN" }
              as: AssociationAdmin
            - call: "POST /athletics/sport-seasons/${seas_f}/advance"
              payload: { to_status: "REGULAR_SEASON" }
              as: AssociationAdmin
            - call: "POST /athletics/officials"
              payload: { full_name: "Ola Nkemdi", certification_level: "LEVEL_2", home_region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { off_1: $.data.id }
            - call: "GET /athletics/sport-seasons/${seas_f}"
              payload: {}
              as: AssociationAdmin
              captures: { sv1: $.data.version }
            - call: "POST /athletics/contests"
              payload: { sport_season_id: "${seas_f}", home_school_id: "${sch_a}", away_school_id: "${sch_b}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T20:00:00Z", travel_miles: 40, expected_sport_season_version: "${sv1}" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { con_x: $.data.id, con_x_v1: $.data.version }
            - call: "POST /athletics/contests/${con_x}/officials"
              payload: { official_id: "${off_1}", expected_contest_version: "${con_x_v1}" }
              as: OfficialsCoordinator
              as_user_id: "coord-001"
              captures: { asg_1: $.data.id }
            - call: "POST /athletics/official-assignments/${asg_1}/respond"
              payload: { response: "ACCEPT" }
              as: Official
              as_user_id: "${off_1}"
            - call: "POST /athletics/transport-requests"
              payload: { contest_id: "${con_x}", requesting_school_id: "${sch_a}", travel_minutes: 45, bus_count: 1 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { trip_1: $.data.id }
          trigger:
            - call: "POST /athletics/transport-requests/${trip_1}/approve"
              payload: {}
              as: AssociationAdmin
            - call: "GET /athletics/schools/${sch_a}"
              payload: {}
              as: AssociationAdmin
              captures: { rmu_after_approve: $.data.release_minutes_used }
            - call: "POST /athletics/transport-requests/${trip_1}/cancel"
              payload: { cancel_note: "opponent withdrew" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
          assert:
            - "${rmu_after_approve} == 60"
            - "School.${sch_a}.release_minutes_used == 0 after the cancel"
            - "TransportRequest.${trip_1}.status == CANCELLED"
            - "TransportRequest.${trip_1}.cancelled_reason == SCHOOL_REQUEST"
            - "TransportRequest.${trip_1}.release_minutes == 60"
            - "GET /athletics/transport-requests?requesting_school_id=${sch_a} shows no APPROVED or COMPLETED trip, matching release_minutes_used 0"

      - name: fee_payment_then_refund_conserves_school_collected_cents
        grounds:
          - invariants.fee_ledger_conservation
          - state_machines.EligibilityCase.ASSESSED_to_PAID
          - state_machines.EligibilityCase.PAID_to_REFUNDED
          - entities.School.fields.fee_collected_cents
          - entities.EligibilityCase.fields.fee_refunded_cents
          - entities.EligibilityCase.fields.fee_outstanding_cents
        distinguishing_aspect: |
          A different conserved quantity from the release-minute ledger: participation-fee CENTS.
          School.fee_collected_cents must equal the sum of (fee_paid_cents - fee_refunded_cents)
          over the school's cases, so paying 12345 and then refunding must return it to exactly 0
          while fee_outstanding_cents climbs back to the full 12345 and fee_paid_cents stays 12345.
        test_recipe:
          setup:
            - "North High with fee_cap_cents 20000 and fee_collected_cents 0."
            - "A FOOTBALL C3A TIER_A season and student Iris with one eligibility case whose fee_amount_cents is 12345."
          setup_api_calls:
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH", fee_cap_cents: 20000 }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /athletics/sport-seasons"
              payload: { sport: "FOOTBALL", classification: "C3A", school_year: "2026-2027", sport_tier: "TIER_A", practice_start_date: "2026-08-05", first_contest_date: "2026-09-01", season_end_date: "2026-11-15", age_cutoff_date: "2026-09-01", residency_deadline: "2026-08-20", grading_lock_date: "2026-10-01", contest_limit: 10, required_officials: 1 }
              as: AssociationAdmin
              captures: { seas_f: $.data.id }
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "Iris Pham", birth_date: "2009-11-02", grade_level: 10, residency_verified: true, residency_verified_on: "2026-08-10", free_reduced_lunch: false }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { stu_iris: $.data.id }
            - call: "POST /athletics/eligibility-cases"
              payload: { student_id: "${stu_iris}", sport_season_id: "${seas_f}" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { case_iris: $.data.id }
          trigger:
            - call: "POST /athletics/eligibility-cases/${case_iris}/fee-payments"
              payload: { amount_cents: 12345 }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
            - call: "GET /athletics/schools/${sch_a}"
              payload: {}
              as: AssociationAdmin
              captures: { collected_after_pay: $.data.fee_collected_cents }
            - call: "POST /athletics/eligibility-cases/${case_iris}/fee-refunds"
              payload: { refund_reason: "season cancelled" }
              as: AssociationAdmin
          assert:
            - "${collected_after_pay} == 12345"
            - "School.${sch_a}.fee_collected_cents == 0 after the refund"
            - "EligibilityCase.${case_iris}.fee_amount_cents == 12345"
            - "EligibilityCase.${case_iris}.fee_paid_cents == 12345"
            - "EligibilityCase.${case_iris}.fee_refunded_cents == 12345"
            - "EligibilityCase.${case_iris}.fee_waived_cents == 0"
            - "EligibilityCase.${case_iris}.fee_outstanding_cents == 12345"
            - "EligibilityCase.${case_iris}.fee_status == REFUNDED"
