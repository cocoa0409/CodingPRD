      - name: no_role_can_reach_another_roles_exclusive_operation
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds:
          - roles[ShowDirector].exclusive_operations
          - roles[Exhibitor].exclusive_operations
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_IDENTITY_REQUIRED]
          - errors[ERR_EXHIBITOR_SCOPE_VIOLATION]
        distinguishing_aspect: "The four auth gates fire in their declared order on the SAME request shape: an undeclared or absent X-Role is 401, a declared but unlisted role is 403 ERR_ROLE_NOT_PERMITTED, an Exhibitor without a resolvable X-Role-Id is 403 ERR_IDENTITY_REQUIRED, and a resolvable Exhibitor reaching another exhibitor's contract is 403 ERR_EXHIBITOR_SCOPE_VIOLATION."
