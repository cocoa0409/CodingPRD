          trigger:
            - { call: "POST /burn-plans/${plan}/submit", payload: {}, as: BurnBoss, as_user_id: "${bossA}", captures: {s1: $.data.status} }
            - { call: "POST /burn-plans/${plan}/request-revision", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}", captures: {s2: $.data.status} }
