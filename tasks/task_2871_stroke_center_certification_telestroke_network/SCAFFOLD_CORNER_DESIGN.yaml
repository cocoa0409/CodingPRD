  - name: a_readiness_attestation_must_name_a_declared_component_and_result
    claim_type: violation_to_error
    grounds:
    - validations priority 80 -> ERR_INVALID_ENUM_VALUE (422)
    - validations priority 12 -> ERR_INVALID_ENUM_VALUE (422)
    - calculations.equipment_readiness_posture
    distinguishing_aspect: 'Two enum clauses share ONE error id with the generic body check, so the interesting part is what survives a rejection: the centre''s readiness flags and posture must be exactly as before, and a REPEATED valid FAIL must be accepted while changing nothing — an attestation endpoint that toggles rather than sets would flip the flag back on the second call.'
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; one SPOKE centre with both readiness flags at their true defaults, so equipment_readiness_posture is READY.
