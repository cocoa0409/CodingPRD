          - errors[ERR_PORTFOLIO_THRESHOLD_NOT_MET]
          - errors[ERR_DEMO_ATTEMPT_LIMIT_REACHED]
        distinguishing_aspect: "The three advancement gates fire in their declared order on the SAME transition: too few reviews first, then the mean-composite floor, then the bounded demonstration counter once two attempts have been consumed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; artist Ben Ortiz in PORTFOLIO_REVIEW with exactly one review scoring composite 3.40."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
