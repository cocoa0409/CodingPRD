        distinguishing_aspect: "With equal balances the largest-balance selector ties, so the 1-cent remainder lands on the earliest-created participant (created_at tie-break) — never on a random id."
        test_recipe:
          setup: ["Case in TERMINATION_EFFECTIVE with three participants, each 100000 vested 100%, created in order P1, P2, P3."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Tie Co 401k", sponsor_ein: "123456789", plan_number: "134", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_ti: "$.data.id", c_ti_v: "$.data.version" } }
