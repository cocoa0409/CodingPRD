scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: consult_charge_self_pay_vs_insurance
        grounds:
          - calculations.consult_charge_calculation
          - entities.Consult.fields.billing_mode
          - entities.Consult.fields.final_charge_cents
          - state_machines.Consult.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Operates on the Consult entity (billing/cost domain): for the SAME visit_tier=STANDARD
          (base=10000 cents), billing_mode=SELF_PAY yields final_charge_cents=8500 while
          billing_mode=INSURANCE with deductible_remaining=2000, copay=2000, coinsurance_bps=2000
          yields final_charge_cents=5200 — two valid variants on the same Consult inputs.
        test_recipe:
          setup:
            - "POST /telemed/patients → patient_a (insurance_deductible_remaining_cents=2000, insurance_copay_cents=2000, insurance_coinsurance_bps=2000, insurance_payer_id='PAYER1', insurance_member_id='M1')"
            - "POST /telemed/patients → patient_b (no insurance fields — self-pay only)"
            - "POST /telemed/physicians + POST /licenses for state CA (FULL)"
            - "POST /telemed/consults for patient_a with billing_mode=INSURANCE, visit_tier=STANDARD, present_state_code=CA"
            - "POST /telemed/consults for patient_b with billing_mode=SELF_PAY, visit_tier=STANDARD, present_state_code=CA"
            - "Route, start, complete each consult"
          trigger:
            - "POST /telemed/consults/{insurance_consult_id}/complete"
            - "POST /telemed/consults/{self_pay_consult_id}/complete"
          assert:
            - "insurance_consult.base_charge_cents == 10000"
            - "insurance_consult.final_charge_cents == 5200"
            - "self_pay_consult.base_charge_cents == 10000"
            - "self_pay_consult.final_charge_cents == 8500"
            - "self_pay_consult.final_charge_cents != insurance_consult.final_charge_cents"

      - name: compliance_score_per_rx_vs_physician_aggregate
        grounds:
          - calculations.prescription_compliance_score
          - endpoints[POST /telemed/prescriptions/{id}/issue]
          - endpoints[GET /telemed/physicians/{id}/compliance]
        distinguishing_aspect: |
          Operates on the Prescription / Physician domain (clinical compliance), structurally
          different from the Consult cost domain in instance 1. Per-prescription variant is a
          hard PASS/FAIL threshold (>=80 required at issue time); physician_aggregate variant
          is an observational average across qualifying prescriptions with no threshold.
        test_recipe:
          setup:
            - "Create physician_x with FULL CA license, no DEA"
            - "Create patient + 2 consults; route & start each"
            - "Under consult_1: POST DRAFT Rx (drug_name='AmoxNone', dea_schedule=NONE, days_supply=15, refills=0); issue it (score=40+30+20+10=100)"
            - "Under consult_2: POST DRAFT Rx (drug_name='AmoxLow', dea_schedule=NONE, days_supply=61, refills=0); issue it (score=40+30+20+0=90)"
          trigger:
            - "GET /telemed/physicians/{physician_x.id}/compliance"
          assert:
            - "first prescription was issued (per-prescription variant: 100 >= 80, succeeds)"
            - "second prescription was issued (per-prescription variant: 90 >= 80, succeeds)"
            - "physician aggregate response.data.average_score == 95.0 (mean of 100 and 90, HALF_UP to one decimal)"
            - "physician_aggregate variant does not reject the lower-scoring 90 — confirming it is observational only"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a)/(b)/(c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rx_compliance_score_multi_input_non_linear
        grounds:
          - calculations.prescription_compliance_score
          - entities.Prescription.fields.dea_schedule
          - entities.Prescription.fields.refills
          - entities.Prescription.fields.days_supply
          - entities.Consult.fields.routing_basis
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction. The score combines four legs —
          licensure (FULL=40 / IMLC=30), DEA validity (gated on schedule + DEA number + EPCS),
          refill compliance (non-linear branch by schedule: Schedule II disqualifies any
          refill > 0; III/IV stays at 20 only if refills <= 5), and days_supply
          (10 for <=30, 5 for 31-60, 0 for 61+). Same prescription mutated across these axes
          produces non-monotonic score changes.
        test_recipe:
          setup:
            - "Physician with IMLC_EXPEDITED CA license, DEA registered, has EPCS token capability"
            - "Patient in CA, consult routed (routing_basis=IMLC_EXPEDITED), started"
            - "Create DRAFT Rx (drug_name='Adderall', dea_schedule=II, refills=0, days_supply=90, epcs_two_factor_token='T1')"
          trigger:
            - "POST /telemed/prescriptions/{id}/issue"
          assert:
            - "score = 30(IMLC) + 30(DEA OK) + 20(II refill=0) + 0(days=90) = 80; issue SUCCEEDS at exactly the threshold"
            - "PATCH the prescription back to DRAFT not allowed (terminal); create a fresh Rx with same fields but refills=1 → issue FAILS with ERR_SCHEDULE_II_REFILLS_FORBIDDEN (priority 8 fires before the score check at priority 9)"

      - name: insurance_waterfall_rounding_order_pin
        grounds:
          - calculations.consult_charge_calculation
          - entities.InsuranceClaim.fields.deductible_applied_cents
          - entities.InsuranceClaim.fields.copay_applied_cents
          - entities.InsuranceClaim.fields.coinsurance_applied_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. Scaffold pins
          'compute each waterfall step in declared order, round HALF_UP to nearest cent
          after coinsurance multiplication, then sum'. Alternative orderings (e.g., compute
          patient_responsibility = (base - deductible - copay) * coinsurance_bps/10000 with a
          single end rounding vs per-step rounding) produce different cents on uneven inputs.
          For base=3333, deductible_remaining=333, copay=333, coinsurance_bps=1250, the
          declared order yields deductible=333, copay=333, then coinsurance=round_half_up
          ((3333-333-333)*0.1250)=round_half_up(333.375)=333, total=999; a sum-then-round
          alternative on the unrounded chain would give round_half_up(999.375)=999 (identical
          here) or different cents on other inputs — the scaffold pins the per-step order so
          the result is well-defined.
        test_recipe:
          setup:
            - "Patient with insurance_payer_id='P1', insurance_member_id='M1', insurance_deductible_remaining_cents=333, insurance_copay_cents=333, insurance_coinsurance_bps=1250"
            - "Physician with FULL CA license"
            - "Custom visit_tier base via subsequent CHARGE — but base depends on visit_tier; use BRIEF: 5000"
            - "Re-pin: with base=5000, deductible_remaining=333, copay=333, coinsurance_bps=1250 → deductible=333; copay=333; remaining=5000-666=4334; coinsurance=round_half_up(4334*0.1250)=round_half_up(541.75)=542; final=333+333+542=1208"
            - "Consult: patient, billing_mode=INSURANCE, visit_tier=BRIEF; route, start"
          trigger:
            - "POST /telemed/consults/{id}/complete"
          assert:
            - "consult.base_charge_cents == 5000"
            - "claim.deductible_applied_cents == 333"
            - "claim.copay_applied_cents == 333"
            - "claim.coinsurance_applied_cents == 542  # round_half_up(541.75)"
            - "consult.final_charge_cents == 1208"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: consult_route_unroute_revert_cycle
        grounds:
          - state_machines.Consult.REQUESTED_to_ROUTED
          - state_machines.Consult.ROUTED_to_REQUESTED
          - endpoints[POST /telemed/consults/{id}/route]
          - endpoints[POST /telemed/consults/{id}/unroute]
        distinguishing_aspect: |
          Consult entity. Non-linear shape: ROUTED→REQUESTED revert edge creates a cycle
          REQUESTED→ROUTED→REQUESTED, distinct from the forward IN_PROGRESS→COMPLETED→CLOSED
          spine. Routing basis and physician_id are written on the forward edge and cleared
          on the revert edge — not a linear pipeline.
        test_recipe:
          setup:
            - "Physician with FULL CA license; second physician with FULL NY license"
            - "Patient in CA; create consult"
          trigger:
            - "POST /telemed/consults/{id}/route (physician=first)"
            - "POST /telemed/consults/{id}/unroute"
            - "POST /telemed/consults/{id}/route (physician=first again)"
          assert:
            - "after first route: status=ROUTED, physician_id=first.id, routing_basis=FULL_LICENSE"
            - "after unroute: status=REQUESTED, physician_id=null, routing_basis=null"
            - "after second route: status=ROUTED, physician_id=first.id again"
            - "version field incremented monotonically across all three transitions"

      - name: claim_denial_appeal_cycle
        grounds:
          - state_machines.InsuranceClaim.SUBMITTED_to_DENIED
          - state_machines.InsuranceClaim.DENIED_to_APPEALED
          - state_machines.InsuranceClaim.APPEALED_to_APPROVED
        distinguishing_aspect: |
          InsuranceClaim entity — different from Consult in instance above. Non-linear shape:
          DENIED→APPEALED→APPROVED forms a revision loop where the same APPROVED state can
          be re-entered through two different in-edges (SUBMITTED→APPROVED or
          APPEALED→APPROVED). A purely linear SUBMITTED→APPROVED→PAID pipeline would not
          permit re-entry to APPROVED from DENIED.
        test_recipe:
          setup:
            - "Complete an INSURANCE consult so InsuranceClaim row exists in SUBMITTED"
          trigger:
            - "POST /telemed/claims/{id}/deny (denial_reason='missing pre-auth')"
            - "POST /telemed/claims/{id}/appeal"
            - "POST /telemed/claims/{id}/approve"
            - "POST /telemed/claims/{id}/mark-paid"
          assert:
            - "after deny: status=DENIED, denial_reason='missing pre-auth'"
            - "after appeal: status=APPEALED, denial_reason STILL='missing pre-auth' (preserved through cycle)"
            - "after approve: status=APPROVED"
            - "after mark-paid: status=PAID, payer_paid_cents > 0"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: license_revoke_to_consult_to_rx_void_depth_3
        grounds:
          - endpoints[POST /telemed/physicians/{pid}/licenses/{lid}/revoke]
          - state_machines.Consult.ROUTED_to_REQUESTED  # system-triggered variant
          - state_machines.Prescription.DRAFT_to_VOIDED  # system-triggered variant
          - entities.StateLicense.fields.status
          - entities.Consult.fields.routing_basis
          - entities.Prescription.fields.void_reason
        distinguishing_aspect: |
          Depth-3 cascade from license-revoke trigger. Each hop is caused by the previous,
          not by the originating action: revoke (mutates StateLicense) → which itself causes
          Consult unrouting (REQUESTED state, null physician_id) → which itself causes every
          DRAFT Prescription under those consults to be VOIDED. Removing the Consult mutation
          step would not void the prescriptions; the chain is sequential, not fan-out.
        test_recipe:
          setup:
            - "Physician with single FULL CA license_x, DEA registered"
            - "Patient in CA; create + route consult_a using license_x"
            - "Start consult_a; create DRAFT Rx_a under it (dea_schedule=NONE, days_supply=15, refills=0)"
          trigger:
            - "POST /telemed/physicians/{physician.id}/licenses/{license_x.id}/revoke"
          assert:
            - "license_x.status == 'REVOKED'"
            - "consult_a.status == 'REQUESTED' (was IN_PROGRESS — cascaded back)"
            - "consult_a.physician_id is null"
            - "consult_a.routing_basis is null"
            - "Rx_a.status == 'VOIDED'"
            - "Rx_a.void_reason == 'LICENSE_REVOKED'"
            - "AuditEvent rows: LICENSE_REVOKED for license_x AND RX_VOIDED for Rx_a both present"

      - name: claim_paid_decrements_patient_deductible_depth_2
        grounds:
          - state_machines.InsuranceClaim.APPROVED_to_PAID
          - entities.Patient.fields.insurance_deductible_remaining_cents
          - entities.InsuranceClaim.fields.deductible_applied_cents
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger than instance 1 (mark-paid on
          InsuranceClaim rather than revoke on StateLicense). Link 1: mark-paid mutates
          InsuranceClaim.status and InsuranceClaim.payer_paid_cents. Link 2: that mutation
          itself triggers Patient.insurance_deductible_remaining_cents -= deductible_applied
          — caused by the claim's mutation, not by the original API call directly mutating
          Patient.
        test_recipe:
          setup:
            - "Patient with insurance_deductible_remaining_cents=2000, copay=2000, coinsurance_bps=2000"
            - "Complete STANDARD insurance consult — InsuranceClaim auto-created with deductible_applied=2000"
            - "Approve the claim"
          trigger:
            - "POST /telemed/claims/{id}/mark-paid"
          assert:
            - "before: patient.insurance_deductible_remaining_cents == 2000"
            - "after: patient.insurance_deductible_remaining_cents == 0"
            - "claim.status == 'PAID'"
            - "claim.payer_paid_cents == 4800  # billed 10000 - patient_responsibility 5200"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_pair
        grounds:
          - validations[priority=4]   # ERR_INVALID_STATE (state)
          - validations[priority=6]   # ERR_NO_VALID_LICENSE (business_safety)
        distinguishing_aspect: |
          Pair: state vs business_safety. Two simultaneous failures — (a) consult is already
          ROUTED (state precondition fails) AND (b) the targeted physician has no valid
          license for the present_state_code (business_safety fails). Priority 4 must win.
        test_recipe:
          setup:
            - "Patient in CA; create consult; route it to physician_a (who has FULL CA)"
            - "physician_b has NO licenses anywhere"
          trigger:
            - "POST /telemed/consults/{id}/route (physician_id=physician_b.id) — both state and business_safety would fail"
          assert:
            - "response error_id == 'ERR_INVALID_STATE' (priority 4 wins over priority 6)"
            - "http status == 409"
            - "consult.status unchanged: still ROUTED with physician_a"

      - name: business_referential_vs_business_safety_pair
        grounds:
          - validations[priority=5]   # ERR_PHYSICIAN_MISMATCH (business_referential)
          - validations[priority=7]   # ERR_DEA_REQUIREMENTS_NOT_MET (business_safety)
        distinguishing_aspect: |
          Pair: business_referential vs business_safety — DIFFERENT pair from instance 1.
          Setup forces both: (a) the acting physician differs from consult.physician_id and
          (b) the prescription is dea_schedule=III with no DEA on the prescribing physician
          (DEA req would also fail). business_referential at priority 5 wins.
        test_recipe:
          setup:
            - "physician_a: FULL CA license, no DEA"
            - "physician_b: FULL CA license, no DEA"
            - "Patient in CA; consult routed to physician_a, started"
            - "physician_a creates DRAFT Rx with dea_schedule=III, days_supply=15, refills=2 (with prescribing_physician_id mistakenly set to physician_b in subsequent PATCH-then-issue or via direct create with wrong id)"
          trigger:
            - "POST /telemed/prescriptions/{id}/issue acting as physician_a where the Rx has prescribing_physician_id=physician_b.id"
          assert:
            - "response error_id == 'ERR_PHYSICIAN_MISMATCH' (priority 5 wins)"
            - "http status == 422"
            - "the lower-priority ERR_DEA_REQUIREMENTS_NOT_MET (priority 7) is NOT returned"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: compliance_score_at_80_exact_threshold
        grounds:
          - calculations.prescription_compliance_score
          - validations[priority=9]    # score >= 80
          - endpoints[POST /telemed/prescriptions/{id}/issue]
        distinguishing_aspect: |
          Numeric threshold metric (score), tested on the issue endpoint. Boundary at >= 80
          (inclusive): score==80 passes; score==75 (the next reachable value below) fails.
          Different from instance 2 which is an empty-set/zero-count boundary on a different
          endpoint.
        test_recipe:
          setup:
            - "physician_pass: IMLC CA license, has DEA + EPCS"
            - "physician_fail: IMLC CA license, has DEA + EPCS"
            - "consult_pass routed to physician_pass, started; consult_fail routed to physician_fail, started"
            - "Under consult_pass: DRAFT Rx (drug_name='AddIIp', dea_schedule=II, refills=0, days_supply=90, epcs_two_factor_token='T1') → score 30+30+20+0 = 80"
            - "Under consult_fail: DRAFT Rx (drug_name='OxyIVf', dea_schedule=IV, refills=6, days_supply=45, epcs_two_factor_token='T2') → score 30+30+10+5 = 75"
          trigger:
            - "POST /telemed/prescriptions/{rx_pass.id}/issue"
            - "POST /telemed/prescriptions/{rx_fail.id}/issue"
          assert:
            - "rx_pass response: status 200, prescription.status == 'ISSUED'"
            - "rx_fail response: status 422, error_id == 'ERR_COMPLIANCE_SCORE_TOO_LOW'"

      - name: followup_window_empty_prescription_set
        grounds:
          - calculations.followup_due_date
          - endpoints[POST /telemed/consults/{id}/complete]
          - entities.FollowUp.fields.due_by
        distinguishing_aspect: |
          Empty-collection / zero-count metric, tested on the complete-consult endpoint.
          Different metric (collection emptiness) and different endpoint than instance 1's
          numeric score threshold. When the set of non-VOIDED prescriptions under the consult
          is empty, the calculation falls into the non_controlled_only variant and assigns
          a 90-day window — exercising the empty-set branch.
        test_recipe:
          setup:
            - "Complete consult prerequisites with requires_followup=true"
            - "Do NOT create any prescription (empty set), OR create one and void it before complete (set still empty under the 'non-VOIDED' filter)"
            - "Record clock_before = current simulated clock time"
          trigger:
            - "POST /telemed/consults/{id}/complete"
          assert:
            - "FollowUp row exists for this consult"
            - "FollowUp.due_by == clock_before + 90 days  (non_controlled_only variant)"
            - "FollowUp.due_by != clock_before + 30 days (would be Schedule II window — confirms empty-set branch was taken)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: consult_start_depends_on_state_license_status
        grounds:
          - state_machines.Consult.ROUTED_to_IN_PROGRESS
          - entities.StateLicense.fields.status
          - calculations.state_license_status_projection
          - endpoints[POST /telemed/_clock/advance]
        distinguishing_aspect: |
          Entity pair: Consult ↔ StateLicense (cross-aggregate). Consult.start
          (ROUTED→IN_PROGRESS) re-checks the matched StateLicense.status at trigger time.
          If the clock has advanced past expires_at since the original route, the
          projection yields EXPIRED and the transition rejects — even though routing
          succeeded earlier.
        test_recipe:
          setup:
            - "Physician with FULL CA license expiring at 2026-06-01T00:00:00Z"
            - "Patient in CA; create consult, route at clock=2026-05-15 (license ACTIVE)"
            - "POST /telemed/_clock/advance to 2026-06-02T00:00:00Z"
          trigger:
            - "POST /telemed/consults/{id}/start"
          assert:
            - "response error_id == 'ERR_NO_VALID_LICENSE' OR 'ERR_INVALID_STATE' per the cross-entity precondition (the precondition explicitly references StateLicense.status)"
            - "consult.status remains 'ROUTED' — IN_PROGRESS never entered"

      - name: consult_close_depends_on_claim_followup_terminal
        grounds:
          - state_machines.Consult.COMPLETED_to_CLOSED
          - entities.InsuranceClaim.fields.status
          - entities.FollowUp.fields.status
          - validations[priority=13]   # ERR_BILLING_NOT_TERMINAL
        distinguishing_aspect: |
          Different entity pair than instance 1: Consult ↔ InsuranceClaim and Consult ↔
          FollowUp (both cross-aggregate). Consult.close requires the dependent
          InsuranceClaim to be in {PAID, DENIED} AND any FollowUp to be in
          {COMPLETED, MISSED, CANCELLED}. Two distinct cross-entity dependencies pinning
          the same close action.
        test_recipe:
          setup:
            - "Complete a STANDARD INSURANCE consult with requires_followup=true so both InsuranceClaim (SUBMITTED) and FollowUp (SCHEDULED) exist"
          trigger:
            - "POST /telemed/consults/{id}/close (claim still SUBMITTED, followup still SCHEDULED)"
          assert:
            - "response error_id == 'ERR_BILLING_NOT_TERMINAL'"
            - "http status == 409"
            - "consult.status == 'COMPLETED' (close did not advance)"
            - "after approving+paying claim AND completing followup: POST /close succeeds and consult.status == 'CLOSED'"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: patient_active_consult_status_window_overlap
        grounds:
          - validations[priority=14]   # ERR_PATIENT_HAS_ACTIVE_CONSULT
          - entities.Consult.fields.patient_id
          - entities.Consult.fields.status
        distinguishing_aspect: |
          Resource: Patient. Interval semantics: status-enum-based "active window" — a
          Consult occupies its patient as long as status IN {REQUESTED, ROUTED, IN_PROGRESS,
          COMPLETED} (CLOSED and DECLINED release the patient). Two consults conflict iff
          both windows are simultaneously open in that enum set. This is fundamentally
          different from instance 2's clock-time half-open arithmetic — no datetime
          comparison is involved, only set membership on a status enum.
        test_recipe:
          setup:
            - "Patient_p; physician with FULL CA license"
            - "Create consult_1 for patient_p, route it (status=ROUTED — patient occupied)"
          trigger:
            - "POST /telemed/consults (patient_id=patient_p.id, present_state_code=CA, billing_mode=SELF_PAY, visit_tier=BRIEF)"
          assert:
            - "response error_id == 'ERR_PATIENT_HAS_ACTIVE_CONSULT'"
            - "http status == 409"
            - "after closing consult_1: re-issuing the same POST succeeds (patient released — overlap resolved)"

      - name: state_license_period_half_open_interval_overlap
        grounds:
          - validations[priority=15]   # ERR_LICENSE_PERIOD_OVERLAP
          - entities.StateLicense.fields.issued_at
          - entities.StateLicense.fields.expires_at
        distinguishing_aspect: |
          Resource: StateLicense scoped by (physician_id, state_code). Interval semantics:
          half-open clock-time arithmetic [issued_at, expires_at) — two intervals overlap iff
          a1 < e2 AND a2 < e1; back-to-back where e1 == a2 is NOT an overlap. This is
          geometrically different from instance 1's enum-set occupation: real datetime
          comparison with inclusive/exclusive boundary distinction.
        test_recipe:
          setup:
            - "Physician_q; register license L1 (state=CA, issued_at=2026-01-01, expires_at=2026-12-31, license_type=FULL)"
          trigger:
            - "POST /telemed/physicians/{physician_q.id}/licenses (state=CA, issued_at=2026-06-01, expires_at=2027-06-01) — overlaps L1"
            - "POST /telemed/physicians/{physician_q.id}/licenses (state=CA, issued_at=2026-12-31, expires_at=2027-12-31) — back-to-back, half-open says non-overlap"
          assert:
            - "first POST: error_id == 'ERR_LICENSE_PERIOD_OVERLAP', http 409"
            - "second POST: succeeds (201) — confirms boundary is half-open at expires_at (e1==a2 means non-overlap)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_money_conservation_billed_equals_allocation
        grounds:
          - calculations.consult_charge_calculation
          - state_machines.InsuranceClaim.APPROVED_to_PAID
          - entities.InsuranceClaim.fields.billed_cents
          - entities.InsuranceClaim.fields.deductible_applied_cents
          - entities.InsuranceClaim.fields.copay_applied_cents
          - entities.InsuranceClaim.fields.coinsurance_applied_cents
          - entities.InsuranceClaim.fields.payer_paid_cents
        distinguishing_aspect: |
          Conserved quantity: InsuranceClaim.billed_cents per individual claim. The
          forward+compensating loop is deny → appeal → approve → pay (the appeal/approve
          revision cycle is the 'compensation' for an initial denial). The invariant
          deductible_applied + copay_applied + coinsurance_applied + payer_paid_cents ==
          billed_cents MUST hold after PAID — even when the path went through DENIED first.
          Allocation fields are written once at SUBMISSION and not recomputed by the
          denial/appeal cycle, so the invariant is preserved through compensation.
        test_recipe:
          setup:
            - "Patient with deductible_remaining=2000, copay=2000, coinsurance_bps=2000"
            - "Complete STANDARD INSURANCE consult — claim SUBMITTED with billed=10000, deductible_applied=2000, copay=2000, coinsurance=1200, patient_resp=5200"
          trigger:
            - "POST /claims/{id}/deny → POST /claims/{id}/appeal → POST /claims/{id}/approve → POST /claims/{id}/mark-paid"
          assert:
            - "after deny: deductible_applied=2000 AND copay_applied=2000 AND coinsurance_applied=1200 (unchanged by denial)"
            - "after appeal: same allocation fields unchanged"
            - "after approve: same"
            - "after mark-paid: payer_paid_cents == 4800 AND deductible_applied + copay_applied + coinsurance_applied + payer_paid_cents == 10000 == billed_cents"

      - name: patient_deductible_lifetime_conservation
        grounds:
          - entities.Patient.fields.insurance_deductible_remaining_cents
          - entities.InsuranceClaim.fields.deductible_applied_cents
          - state_machines.InsuranceClaim.APPROVED_to_PAID
        distinguishing_aspect: |
          Different conserved quantity than instance 1: Patient.insurance_deductible_
          remaining_cents (lifetime patient deductible across MANY claims) rather than a
          single claim's billed amount. Invariant: Patient.insurance_deductible_remaining_
          cents(initial) == Patient.insurance_deductible_remaining_cents(now) +
          Σ(InsuranceClaim.deductible_applied_cents over all PAID claims for this patient).
          The compensating-action pair here is the mark-paid forward action versus the
          'never paid' counterfactual — if a claim is denied (not appealed) and never
          mark-paid, deductible_applied was written but Patient.deductible_remaining was
          NOT decremented, so the invariant still holds.
        test_recipe:
          setup:
            - "Patient with insurance_deductible_remaining_cents=3000, copay=1000, coinsurance_bps=2000"
            - "Complete two STANDARD INSURANCE consults A and B (each base=10000; A's claim_a has deductible_applied=3000; B's claim_b created after A pays so deductible_remaining=0 by that point → claim_b.deductible_applied=0)"
            - "Snapshot initial_deductible = 3000"
          trigger:
            - "Approve + mark-paid claim_a (decrements patient deductible by 3000)"
            - "Approve claim_b but DENY-then-do-NOT-pay (denial_reason='test'); claim_b never reaches PAID"
          assert:
            - "after claim_a paid: patient.insurance_deductible_remaining_cents == 0"
            - "Σ(deductible_applied for PAID claims) == 3000  (only claim_a)"
            - "patient.insurance_deductible_remaining_cents (now=0) + 3000 == 3000 == initial_deductible  (invariant holds)"
            - "claim_b.deductible_applied_cents == 0 (no contribution to the sum because deductible already exhausted at submission time)"
