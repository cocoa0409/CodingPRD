              payload: {}
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_NO_CURRENT_PRICE"
            - "Contract.${con}.status == OPEN (unchanged)"

      - name: fix_price_basis_leg_already_fixed_returns_leg_already_fixed
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_LEG_ALREADY_FIXED]", state_machines.Contract.OPEN_to_PRICED]
        distinguishing_aspect: "Fixing a BASIS contract a second time (its futures_leg already set by the first fix-price -> PRICED) is rejected; from PRICED the state check fires ERR_INVALID_STATE, but a fix attempt that double-sets a leg on an OPEN contract surfaces ERR_LEG_ALREADY_FIXED. Here we provoke the leg double-fix on an HTA whose basis_leg was set at create then re-supplied — covered by attempting fix on a contract whose target leg is occupied."
        test_recipe:
          setup: ["CORN commodity with a current board; a FORWARD contract with both legs fixed at create (so any fix-price would touch an occupied leg)."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${cid}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/members"
              payload: { name: "II Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${mid}", commodity_id: "${cid}", contract_type: "FORWARD", contracted_bushels: 1000, futures_leg: 4.55, basis_leg: -0.20 }
              as: Merchandiser
              captures: { con: $.data.id }
          trigger:
            - call: "POST /commodities/contracts/${con}/fix-price"
              payload: {}
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_LEG_ALREADY_FIXED (FORWARD has both legs already fixed; no open leg to fix)"

      - name: cancel_contract_with_settled_bushels_returns_has_settlements
        claim_type: Violation → Error
