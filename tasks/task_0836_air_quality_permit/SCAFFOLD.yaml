scenario: "836. Air Quality Permit & Emissions Inventory: source registration & permit-by-rule vs Title V, emissions calculation & fee, stack-test & CEM data, exceedance & deviation report, complaint & inspection, variance/enforcement, annual inventory, public notice"
domain_name: air-quality-permit
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - derived_field_reconciliation
  entity_topology: hybrid
  # Facility is the aggregate root; sources/permits/inventories/complaints hang off it via FK,
  # and line-items / public-notices / stack-tests / cem-data / exceedances sit one level deeper.
  state_machine_shape: branching
  # Permit is cyclic (revision + renewal loops); ExceedanceEvent and EnforcementAction fork on
  # deadline/decision; EmissionSource carries two independent (parallel) status dimensions.
  relationship_patterns:
    - one_to_many        # Facility -> {EmissionSource, Permit, EmissionsInventory, Complaint, Inspection, EnforcementAction}
    - cross_aggregate    # InventoryLineItem references both EmissionsInventory and EmissionSource
  role_model: peer_roles
  # FacilityOperator owns its Facility's registration/inventory; PermitReviewer owns permits/notices;
  # Inspector owns stack-test verification/CEM/exceedances/inspections; EnforcementOfficer owns enforcement.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal facility name
        constraints: non-empty
      - name: operator_name
        type: string
        source: input
        description: Operating company name
      - name: county
        type: string
        source: input
        description: County of record for jurisdiction
      - name: permit_track
        type: enum
        source: computed
        description: >-
          Regulatory track derived from uncontrolled potential-to-emit.
          UNPERMITTED before any source registered; PERMIT_BY_RULE when
          uncontrolled PTE < TITLE_V_PTE_THRESHOLD_TPY; TITLE_V when >=.
        default: UNPERMITTED
        constraints: "one of {UNPERMITTED, PERMIT_BY_RULE, TITLE_V}"
      - name: potential_to_emit_tpy
        type: number
        source: computed
        description: >-
          Sum over non-SHUTDOWN EmissionSource of uncontrolled PTE (tons/yr),
          recomputed on every source register/shutdown. See calc facility_pte.
        default: 0
      - name: compliance_status
        type: enum
        source: computed
        description: >-
          Derived posture gating child ops. COMPLIANT initial; DEVIATION when
          >=1 ExceedanceEvent is OPEN/REPORTED_LATE; ENFORCEMENT when an
          EnforcementAction is INITIATED/PENALTY_ASSESSED; SUSPENDED when a
          penalty is assessed. See state machine Facility and cascades.
        default: COMPLIANT
        constraints: "one of {COMPLIANT, DEVIATION, ENFORCEMENT, SUSPENDED}"
      - name: open_exceedance_count
        type: integer
        source: computed
        description: Count of this facility's sources' ExceedanceEvent in {OPEN, REPORTED_LATE}
        default: 0
      - name: fee_balance_cents
        type: integer
        source: computed
        description: >-
          Running ledger of assessed emissions fees. Debited by assessed_fee on
          inventory certification; credited back (reversed) on inventory amend.
          Invariant: equals sum of assessed_fee_cents over CERTIFIED inventories.
        default: 0
  - name: EmissionSource
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id
      - name: source_type
        type: enum
        source: input
        description: Kind of emitting unit
        constraints: "one of {BOILER, GENERATOR, FLARE, PROCESS_VENT, STORAGE_TANK}"
      - name: pollutant
        type: enum
        source: input
        description: Primary regulated pollutant
        constraints: "one of {NOX, SO2, CO, PM, VOC}"
      - name: max_hourly_rate_lbs
        type: number
        source: input
        description: Maximum uncontrolled emission rate in lbs/hour
        constraints: "> 0"
      - name: operating_hours_per_year
        type: integer
        source: input
        description: Permitted annual operating hours
        constraints: "1..8760"
      - name: control_efficiency
        type: number
        source: input
        description: Fractional control-device removal efficiency (0 = uncontrolled)
        default: 0
        constraints: "0 <= x < 1"
      - name: permit_limit_ppm
        type: number
        source: input
        description: Permitted concentration limit used for CEM exceedance detection
        constraints: "> 0"
      - name: uncontrolled_pte_tpy
        type: number
        source: computed
        description: "max_hourly_rate_lbs * operating_hours_per_year / 2000 (tons/yr); see calc source_pte"
        default: 0
      - name: controlled_pte_tpy
        type: number
        source: computed
        description: "uncontrolled_pte_tpy * (1 - control_efficiency); see calc source_pte"
        default: 0
      - name: lifecycle_status
        type: enum
        source: computed
        description: >-
          Independent operational dimension. REGISTERED -> PERMITTED -> OPERATING
          -> SHUTDOWN; SUSPENDED when facility penalty cascade halts it.
        default: REGISTERED
        constraints: "one of {REGISTERED, PERMITTED, OPERATING, SUSPENDED, SHUTDOWN}"
      - name: monitoring_status
        type: enum
        source: computed
        description: >-
          Independent monitoring dimension, evolves separately from lifecycle_status.
          UNMONITORED -> STACK_TESTED (on passing stack test) and/or CEM_ACTIVE.
        default: UNMONITORED
        constraints: "one of {UNMONITORED, STACK_TESTED, CEM_ACTIVE}"
  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id
      - name: permit_type
        type: enum
        source: input
        description: Permit vehicle requested
        constraints: "one of {PERMIT_BY_RULE, TITLE_V}"
      - name: status
        type: enum
        source: computed
        description: See state machine Permit (cyclic - revision + renewal loops)
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, PUBLIC_NOTICE, ISSUED, RENEWAL_PENDING, REVOKED}"
      - name: issued_at
        type: datetime
        source: computed
        description: Logical-clock timestamp when status entered ISSUED (null until issued)
      - name: renewal_count
        type: integer
        source: computed
        description: Number of completed renewal loops (ISSUED->RENEWAL_PENDING->ISSUED)
        default: 0
  - name: PublicNotice
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id
      - name: comment_open_at
        type: datetime
        source: input
        description: Inclusive start of the public comment window (ISO8601 UTC)
      - name: comment_close_at
        type: datetime
        source: input
        description: Exclusive end of the public comment window (ISO8601 UTC)
      - name: comment_count
        type: integer
        source: computed
        description: Number of public comments recorded during the window
        default: 0
      - name: status
        type: enum
        source: computed
        description: OPEN while clock < comment_close_at; CLOSED once closed by reviewer after window
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"
  - name: EmissionsInventory
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id
      - name: reporting_year
        type: integer
        source: input
        description: Calendar year the inventory covers
        constraints: "2000..2100"
      - name: status
        type: enum
        source: computed
        description: See state machine EmissionsInventory (DRAFT<->SUBMITTED->CERTIFIED, AMENDED)
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, CERTIFIED, AMENDED}"
      - name: total_emissions_tons
        type: number
        source: computed
        description: >-
          Sum of InventoryLineItem.reported_tons (each at 3 decimals), summed
          first then rounded to 2 decimals ROUND_HALF_UP. See calc inventory_total.
        default: 0
      - name: estimated_fee_cents
        type: integer
        source: computed
        description: Provisional fee from DRAFT line items; see calc emissions_fee variant estimated
        default: 0
      - name: assessed_fee_cents
        type: integer
        source: computed
        description: Final fee locked at CERTIFIED; see calc emissions_fee variant assessed
        default: 0
      - name: certified_at
        type: datetime
        source: computed
        description: Logical-clock timestamp when inventory entered CERTIFIED (null until then)
      - name: due_at
        type: datetime
        source: input
        description: Statutory certification deadline; late certification adds surcharge
  - name: InventoryLineItem
    parent: null
    common_fields: true
    fields:
      - name: inventory_id
        type: string
        source: input
        description: FK -> EmissionsInventory.id
      - name: source_id
        type: string
        source: input
        description: FK -> EmissionSource.id
      - name: method
        type: enum
        source: input
        description: Basis for the reported tonnage
        constraints: "one of {ESTIMATED, STACK_TEST, CEM}"
      - name: reported_tons
        type: number
        source: input
        description: Emissions for this source-year in tons, stored at 3 decimals
        constraints: ">= 0"
  - name: StackTest
    parent: null
    common_fields: true
    fields:
      - name: source_id
        type: string
        source: input
        description: FK -> EmissionSource.id
      - name: scheduled_start
        type: datetime
        source: input
        description: Inclusive start of the on-site test window (ISO8601 UTC)
      - name: scheduled_end
        type: datetime
        source: input
        description: Inclusive end of the on-site test window (ISO8601 UTC)
      - name: measured_rate_lbs
        type: number
        source: input
        description: Measured emission rate in lbs/hr, supplied when the test is conducted
      - name: status
        type: enum
        source: computed
        description: See state machine StackTest (SCHEDULED -> CONDUCTED -> {PASSED, FAILED})
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CONDUCTED, PASSED, FAILED}"
  - name: CEMDataBlock
    parent: null
    common_fields: true
    fields:
      - name: source_id
        type: string
        source: input
        description: FK -> EmissionSource.id
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the monitored averaging period
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the monitored averaging period
      - name: avg_concentration_ppm
        type: number
        source: input
        description: Averaged measured concentration for the block, in ppm
        constraints: ">= 0"
      - name: is_exceedance
        type: boolean
        source: computed
        description: "True iff avg_concentration_ppm > source.permit_limit_ppm (strict); see calc cem_exceedance"
        default: false
  - name: ExceedanceEvent
    parent: null
    common_fields: true
    fields:
      - name: source_id
        type: string
        source: input
        description: FK -> EmissionSource.id
      - name: event_type
        type: enum
        source: input
        description: EXCEEDANCE (limit breach) or DEVIATION (operational non-conformance)
        constraints: "one of {EXCEEDANCE, DEVIATION}"
      - name: detected_at
        type: datetime
        source: input
        description: Logical-clock instant the exceedance/deviation was detected
      - name: magnitude_pct
        type: number
        source: input
        description: Percent over limit, drives severity tier in penalty calc
        default: 0
        constraints: ">= 0"
      - name: reported_at
        type: datetime
        source: computed
        description: Logical-clock instant the report was filed (null while OPEN)
      - name: status
        type: enum
        source: computed
        description: See state machine ExceedanceEvent (OPEN -> {REPORTED, REPORTED_LATE} -> RESOLVED)
        default: OPEN
        constraints: "one of {OPEN, REPORTED, REPORTED_LATE, RESOLVED}"
  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id
      - name: description
        type: string
        source: input
        description: Public complaint narrative
        constraints: non-empty
      - name: severity
        type: enum
        source: input
        description: Reported severity
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: status
        type: enum
        source: computed
        description: See state machine Complaint (RECEIVED -> INSPECTION_SCHEDULED -> CLOSED / DISMISSED)
        default: RECEIVED
        constraints: "one of {RECEIVED, INSPECTION_SCHEDULED, CLOSED, DISMISSED}"
  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id
      - name: complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; null for routine (non-complaint-driven) inspections"
        default: null
      - name: scheduled_start
        type: datetime
        source: input
        description: Inclusive start of the inspection window (ISO8601 UTC), half-open [start,end)
      - name: scheduled_end
        type: datetime
        source: input
        description: Exclusive end of the inspection window (ISO8601 UTC), half-open [start,end)
      - name: outcome
        type: enum
        source: computed
        description: Result recorded when inspection completed
        default: PENDING
        constraints: "one of {PENDING, PASS, FAIL}"
      - name: status
        type: enum
        source: computed
        description: See state machine Inspection (SCHEDULED -> COMPLETED)
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED}"
  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id
      - name: action_type
        type: enum
        source: input
        description: Enforcement vehicle
        constraints: "one of {NOTICE_OF_VIOLATION, VARIANCE, PENALTY}"
      - name: origin
        type: enum
        source: input
        description: What prompted the action
        default: MANUAL
        constraints: "one of {MANUAL, LATE_EXCEEDANCE, INSPECTION_FAIL}"
      - name: penalty_cents
        type: integer
        source: computed
        description: Assessed monetary penalty; see calc enforcement_penalty (0 for VARIANCE/NOV)
        default: 0
      - name: variance_start
        type: datetime
        source: input
        description: Inclusive start of a granted variance relief window (VARIANCE only)
        default: null
      - name: variance_end
        type: datetime
        source: input
        description: Exclusive end of a granted variance relief window (VARIANCE only)
        default: null
      - name: status
        type: enum
        source: computed
        description: See state machine EnforcementAction (INITIATED -> {PENALTY_ASSESSED,VARIANCE_GRANTED,DISMISSED} ...)
        default: INITIATED
        constraints: "one of {INITIATED, PENALTY_ASSESSED, VARIANCE_GRANTED, DISMISSED, PAID, CLOSED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Permit
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permits/{id}/submit"
        actor: FacilityOperator
        preconditions:
          - "permit.status == DRAFT"
          - "permit.permit_type matches facility.permit_track (TITLE_V permit only when facility.permit_track == TITLE_V)"
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /permits/{id}/begin-review"
        actor: PermitReviewer
        preconditions: ["permit.status == SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /permits/{id}/return-for-revision"
        actor: PermitReviewer
        preconditions: ["permit.status == UNDER_REVIEW"]
        side_effects: []
        note: "Revision loop (cycle) — reviewer sends the application back for edits."
      - from: UNDER_REVIEW
        to: PUBLIC_NOTICE
        trigger: "POST /permits/{id}/open-public-notice"
        actor: PermitReviewer
        preconditions:
          - "permit.status == UNDER_REVIEW"
          - "a PublicNotice for this permit exists with comment_open_at/comment_close_at set"
        side_effects: ["PublicNotice.status = OPEN for the linked notice"]
      - from: PUBLIC_NOTICE
        to: ISSUED
        trigger: "POST /permits/{id}/issue"
        actor: PermitReviewer
        preconditions:
          - "permit.status == PUBLIC_NOTICE"
          - "the linked PublicNotice.status == CLOSED (cross-entity: comment window ended and reviewer closed it)"
        side_effects:
          - "sets permit.issued_at = current logical clock"
          - "if facility.permit_track == TITLE_V, all facility EmissionSource with lifecycle_status==REGISTERED advance to PERMITTED"
      - from: ISSUED
        to: RENEWAL_PENDING
        trigger: "POST /permits/{id}/start-renewal"
        actor: FacilityOperator
        preconditions: ["permit.status == ISSUED"]
        side_effects: []
        note: "Renewal loop (cycle) back to ISSUED."
      - from: RENEWAL_PENDING
        to: ISSUED
        trigger: "POST /permits/{id}/complete-renewal"
        actor: PermitReviewer
        preconditions: ["permit.status == RENEWAL_PENDING"]
        side_effects: ["increments permit.renewal_count by 1", "refreshes permit.issued_at"]
      - from: ISSUED
        to: REVOKED
        trigger: "system: cascade from EnforcementAction PENALTY_ASSESSED"
        actor: system
        preconditions: ["permit.status == ISSUED", "an EnforcementAction on the facility entered PENALTY_ASSESSED"]
        side_effects: []
        note: "Terminal; revoked permits cannot be renewed."

  - entity: EmissionSource
    initial_state: REGISTERED
    terminal_states: [SHUTDOWN]
    transitions:
      - from: REGISTERED
        to: PERMITTED
        trigger: "system: Permit issue side-effect (Title V) OR POST /sources/{id}/permit"
        actor: PermitReviewer
        preconditions: ["source.lifecycle_status == REGISTERED"]
        side_effects: []
      - from: PERMITTED
        to: OPERATING
        trigger: "POST /sources/{id}/start-operating"
        actor: FacilityOperator
        preconditions: ["source.lifecycle_status == PERMITTED", "facility.compliance_status != SUSPENDED (cross-entity)"]
        side_effects: []
      - from: OPERATING
        to: SUSPENDED
        trigger: "system: cascade from facility SUSPENDED (penalty)"
        actor: system
        preconditions: ["source.lifecycle_status == OPERATING"]
        side_effects: []
      - from: SUSPENDED
        to: OPERATING
        trigger: "system: cascade from EnforcementAction PAID (facility returns to ENFORCEMENT/COMPLIANT)"
        actor: system
        preconditions: ["source.lifecycle_status == SUSPENDED"]
        side_effects: []
      - from: OPERATING
        to: SHUTDOWN
        trigger: "POST /sources/{id}/shutdown"
        actor: FacilityOperator
        preconditions: ["source.lifecycle_status in {PERMITTED, OPERATING, SUSPENDED}"]
        side_effects:
          - "facility.potential_to_emit_tpy decreases by exactly this source.uncontrolled_pte_tpy"
          - "facility.permit_track recomputed from new potential_to_emit_tpy"
      # parallel monitoring dimension (independent of lifecycle_status)
      - from: "monitoring:UNMONITORED"
        to: "monitoring:STACK_TESTED"
        trigger: "system: StackTest PASSED side-effect"
        actor: system
        preconditions: ["a StackTest for this source entered PASSED"]
        side_effects: []
      - from: "monitoring:UNMONITORED"
        to: "monitoring:CEM_ACTIVE"
        trigger: "POST /sources/{id}/cem-data (first accepted block)"
        actor: Inspector
        preconditions: []
        side_effects: []

  - entity: EmissionsInventory
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /inventories/{id}/submit"
        actor: FacilityOperator
        preconditions:
          - "inventory.status == DRAFT"
          - "at least one InventoryLineItem exists for this inventory"
        side_effects: ["recomputes inventory.total_emissions_tons and inventory.estimated_fee_cents"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /inventories/{id}/reject"
        actor: PermitReviewer
        preconditions: ["inventory.status == SUBMITTED"]
        side_effects: []
        note: "Revision loop (cycle) — reviewer returns inventory for correction."
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /inventories/{id}/certify"
        actor: PermitReviewer
        preconditions:
          - "inventory.status == SUBMITTED"
          - "facility.compliance_status != SUSPENDED (cross-entity)"
          - "no EmissionSource referenced by this inventory has an OPEN or REPORTED_LATE ExceedanceEvent (cross-entity)"
        side_effects:
          - "recomputes inventory.assessed_fee_cents (calc emissions_fee variant assessed, includes late surcharge if certified_at >= due_at)"
          - "sets inventory.certified_at = current logical clock"
          - "facility.fee_balance_cents increases by inventory.assessed_fee_cents"
      - from: CERTIFIED
        to: AMENDED
        trigger: "POST /inventories/{id}/amend"
        actor: FacilityOperator
        preconditions: ["inventory.status == CERTIFIED", "facility.compliance_status != SUSPENDED (cross-entity)"]
        side_effects:
          - "facility.fee_balance_cents decreases by exactly this inventory.assessed_fee_cents (compensation, reverses the certify debit)"
          - "inventory.assessed_fee_cents reset to 0"
        note: "Compensating action for certify — restores fee_balance invariant."

  - entity: StackTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /stack-tests/{id}/conduct"
        actor: Inspector
        preconditions:
          - "stacktest.status == SCHEDULED"
          - "current logical clock >= stacktest.scheduled_start"
          - "measured_rate_lbs supplied in body"
        side_effects: ["stores measured_rate_lbs"]
      - from: CONDUCTED
        to: PASSED
        trigger: "system: on conduct when measured_rate_lbs <= source.max_hourly_rate_lbs"
        actor: system
        preconditions: ["stacktest.status == CONDUCTED", "measured_rate_lbs <= source.max_hourly_rate_lbs"]
        side_effects: ["source.monitoring_status = STACK_TESTED"]
      - from: CONDUCTED
        to: FAILED
        trigger: "system: on conduct when measured_rate_lbs > source.max_hourly_rate_lbs"
        actor: system
        preconditions: ["stacktest.status == CONDUCTED", "measured_rate_lbs > source.max_hourly_rate_lbs"]
        side_effects:
          - "creates an ExceedanceEvent(event_type=EXCEEDANCE, status=OPEN) on the source with magnitude_pct = round((measured_rate_lbs - max_hourly_rate_lbs)/max_hourly_rate_lbs*100, 2)"
        note: "CASCADE ORIGIN: StackTest FAILED -> new ExceedanceEvent OPEN -> facility DEVIATION -> auto-enforcement."

  - entity: ExceedanceEvent
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: REPORTED
        trigger: "POST /exceedances/{id}/report"
        actor: FacilityOperator
        preconditions:
          - "exceedance.status == OPEN"
          - "current logical clock <= detected_at + REPORT_DEADLINE_HOURS (72 hours)"
        side_effects:
          - "sets reported_at = current logical clock"
          - "facility.open_exceedance_count decreases by 1; if it reaches 0 and no enforcement pending, facility.compliance_status recomputed toward COMPLIANT"
      - from: OPEN
        to: REPORTED_LATE
        trigger: "POST /exceedances/{id}/report"
        actor: FacilityOperator
        preconditions:
          - "exceedance.status == OPEN"
          - "current logical clock > detected_at + REPORT_DEADLINE_HOURS (72 hours)"
        side_effects:
          - "sets reported_at = current logical clock"
          - "creates an EnforcementAction(origin=LATE_EXCEEDANCE, action_type=NOTICE_OF_VIOLATION, status=INITIATED) on the facility"
          - "facility.compliance_status -> ENFORCEMENT"
        note: "Branch fork: same trigger, divergent side effects keyed on the deadline boundary."
      - from: REPORTED
        to: RESOLVED
        trigger: "POST /exceedances/{id}/resolve"
        actor: Inspector
        preconditions: ["exceedance.status == REPORTED"]
        side_effects: ["facility.open_exceedance_count / compliance_status recomputed"]
      - from: REPORTED_LATE
        to: RESOLVED
        trigger: "POST /exceedances/{id}/resolve"
        actor: Inspector
        preconditions: ["exceedance.status == REPORTED_LATE", "the linked EnforcementAction is in {DISMISSED, CLOSED, PAID}"]
        side_effects: ["facility.open_exceedance_count / compliance_status recomputed"]

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [CLOSED, DISMISSED]
    transitions:
      - from: RECEIVED
        to: INSPECTION_SCHEDULED
        trigger: "system: Inspection created with this complaint_id"
        actor: Inspector
        preconditions: ["complaint.status == RECEIVED"]
        side_effects: []
      - from: RECEIVED
        to: DISMISSED
        trigger: "POST /complaints/{id}/dismiss"
        actor: Inspector
        preconditions: ["complaint.status == RECEIVED"]
        side_effects: []
      - from: INSPECTION_SCHEDULED
        to: CLOSED
        trigger: "system: linked Inspection COMPLETED"
        actor: system
        preconditions: ["complaint.status == INSPECTION_SCHEDULED"]
        side_effects: []

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /inspections/{id}/complete"
        actor: Inspector
        preconditions: ["inspection.status == SCHEDULED", "outcome supplied in body (PASS|FAIL)"]
        side_effects:
          - "if complaint_id set, linked Complaint -> CLOSED"
          - "if outcome == FAIL, creates EnforcementAction(origin=INSPECTION_FAIL, action_type=NOTICE_OF_VIOLATION, status=INITIATED) on the facility and facility.compliance_status -> ENFORCEMENT"

  - entity: EnforcementAction
    initial_state: INITIATED
    terminal_states: [DISMISSED, CLOSED]
    transitions:
      - from: INITIATED
        to: PENALTY_ASSESSED
        trigger: "POST /enforcement-actions/{id}/assess-penalty"
        actor: EnforcementOfficer
        preconditions: ["action.status == INITIATED", "action.action_type in {NOTICE_OF_VIOLATION, PENALTY}"]
        side_effects:
          - "computes penalty_cents (calc enforcement_penalty)"
          - "facility.compliance_status -> SUSPENDED"
          - "all facility EmissionSource with lifecycle_status==OPERATING -> SUSPENDED (cascade)"
          - "any ISSUED Permit on the facility -> REVOKED (cascade)"
        note: "CASCADE ORIGIN: penalty -> facility SUSPENDED -> sources SUSPENDED + permit REVOKED."
      - from: INITIATED
        to: VARIANCE_GRANTED
        trigger: "POST /enforcement-actions/{id}/grant-variance"
        actor: EnforcementOfficer
        preconditions:
          - "action.status == INITIATED"
          - "action.action_type == VARIANCE"
          - "variance_start/variance_end supplied and variance_start < variance_end"
        side_effects: ["facility.compliance_status recomputed (variance relief)"]
      - from: INITIATED
        to: DISMISSED
        trigger: "POST /enforcement-actions/{id}/dismiss"
        actor: EnforcementOfficer
        preconditions: ["action.status == INITIATED"]
        side_effects: ["facility.compliance_status recomputed"]
      - from: PENALTY_ASSESSED
        to: PAID
        trigger: "POST /enforcement-actions/{id}/pay"
        actor: FacilityOperator
        preconditions: ["action.status == PENALTY_ASSESSED"]
        side_effects:
          - "facility.compliance_status -> ENFORCEMENT (lifts SUSPENDED)"
          - "all facility EmissionSource with lifecycle_status==SUSPENDED -> OPERATING (cascade)"
      - from: PAID
        to: CLOSED
        trigger: "POST /enforcement-actions/{id}/close"
        actor: EnforcementOfficer
        preconditions: ["action.status == PAID"]
        side_effects: ["facility.compliance_status recomputed toward COMPLIANT if no other open enforcement/exceedance"]

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: inventory-certify-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /inventories/{id}/certify"
    occ_field: "expected_facility_version"
    description: |
      Certifying an EmissionsInventory debits facility.fee_balance_cents and reads
      facility.compliance_status. If the facility.version has advanced since the
      client last observed it (e.g. another certify already debited the ledger, or
      an exceedance cascade flipped compliance_status), the certify is rejected as
      stale so the ledger cannot double-count against an outdated facility view.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
  - rule_id: source-register-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /sources"
    occ_field: "expected_facility_version"
    description: |
      Registering an EmissionSource recomputes facility.potential_to_emit_tpy and
      may flip facility.permit_track across the Title V threshold. If facility.version
      has advanced since the client last read it (another source already registered
      and moved the PTE), the registration is rejected as stale so the operator
      re-reads the track before adding capacity.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: source_pte
    trigger: "On POST /sources (register) and whenever control_efficiency/rate/hours change"
    algorithm: dual_variant
    formula: |
      uncontrolled_pte_tpy = round(max_hourly_rate_lbs * operating_hours_per_year / LBS_PER_TON, 3)
      controlled_pte_tpy   = round(uncontrolled_pte_tpy * (1 - control_efficiency), 3)
    input_set: "single EmissionSource row"
    constants:
      LBS_PER_TON: 2000
    precision: "3 decimal places, round_half_up"
    variants:
      - name: uncontrolled
        when: "Title V applicability determination (facility_pte, permit_track gating)"
        difference: "ignores control_efficiency entirely — worst-case potential"
      - name: controlled
        when: "operational / informational reporting"
        difference: "multiplies by (1 - control_efficiency)"
  - name: facility_pte
    trigger: "On source register, source shutdown; recomputes facility.potential_to_emit_tpy and permit_track"
    algorithm: aggregation
    formula: |
      potential_to_emit_tpy = round(sum(s.uncontrolled_pte_tpy
                                        for s in EmissionSource
                                        where s.facility_id == facility.id
                                        and s.lifecycle_status != 'SHUTDOWN'), 3)
      permit_track = 'TITLE_V' if potential_to_emit_tpy >= TITLE_V_PTE_THRESHOLD_TPY
                     else ('PERMIT_BY_RULE' if potential_to_emit_tpy > 0 else 'UNPERMITTED')
    input_set: "all non-SHUTDOWN EmissionSource of the facility"
    constants:
      TITLE_V_PTE_THRESHOLD_TPY: 100
    precision: "3 decimal places; threshold comparison is >= (100.000 tpy IS Title V)"
  - name: inventory_total
    trigger: "On inventory submit and certify"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: sum first (each reported_tons already at 3 decimals),
      # then round the sum to 2 decimals. Do NOT round each line item to 2 first.
      total_emissions_tons = round(sum(li.reported_tons for li in InventoryLineItem
                                       where li.inventory_id == inventory.id), 2)
    input_set: "all InventoryLineItem of the inventory (no status filter — line items have no status)"
    precision: "2 decimal places, round_half_up, sum-then-round"
  - name: emissions_fee
    trigger: "estimated: on inventory submit; assessed: on inventory certify"
    algorithm: tiered_pricing
    formula: |
      # billable = total_emissions_tons. Marginal tiered rate (cents per ton):
      #   first 25 tons                 @ TIER1_RATE_CENTS
      #   next  75 tons (25 < t <= 100) @ TIER2_RATE_CENTS
      #   above 100 tons                @ TIER3_RATE_CENTS
      def gross(t):
        c = 0
        c += min(t, 25) * TIER1_RATE_CENTS
        if t > 25:  c += (min(t,100) - 25) * TIER2_RATE_CENTS
        if t > 100: c += (t - 100) * TIER3_RATE_CENTS
        return c
      gross_cents = round(gross(total_emissions_tons))           # round to whole cents
      gross_cents = max(gross_cents, MIN_FEE_CENTS)              # floor
      if gross_cents < SMALL_EMITTER_CEILING_CENTS:              # small-emitter discount
          gross_cents = round(gross_cents * (1 - SMALL_EMITTER_DISCOUNT))
      # assessed variant only: late surcharge when certified_at >= due_at
      if variant == 'assessed' and certified_at >= due_at:
          gross_cents = round(gross_cents * (1 + LATE_SURCHARGE_PCT))
      fee_cents = gross_cents
    input_set: "estimated uses DRAFT line items at submit; assessed uses the line items present at certify"
    constants:
      TIER1_RATE_CENTS: 4500
      TIER2_RATE_CENTS: 4000
      TIER3_RATE_CENTS: 3500
      MIN_FEE_CENTS: 50000
      SMALL_EMITTER_CEILING_CENTS: 100000
      SMALL_EMITTER_DISCOUNT: 0.10
      LATE_SURCHARGE_PCT: 0.15
    precision: "integer cents, round_half_up; discount then surcharge applied in that order"
    variants:
      - name: estimated
        when: "inventory submit (provisional)"
        difference: "no late surcharge branch; stored in estimated_fee_cents"
      - name: assessed
        when: "inventory certify (final)"
        difference: "adds LATE_SURCHARGE_PCT when certified_at >= due_at; stored in assessed_fee_cents and debited to fee_balance_cents"
  - name: cem_exceedance
    trigger: "On POST /sources/{id}/cem-data"
    algorithm: threshold
    formula: |
      is_exceedance = (avg_concentration_ppm > source.permit_limit_ppm)   # STRICT greater-than
    input_set: "single CEMDataBlock vs its source's permit_limit_ppm"
    precision: "exact numeric compare; equality is NOT an exceedance"
  - name: enforcement_penalty
    trigger: "On EnforcementAction assess-penalty"
    algorithm: weighted_scoring
    formula: |
      # severity tier from the triggering exceedance magnitude (0 when none):
      sev = 1
      if magnitude_pct > 10:  sev = 2
      if magnitude_pct > 50:  sev = 3
      # days_late = clock-days between detected_at and reported_at for a LATE_EXCEEDANCE origin, else 0
      penalty = BASE_PENALTY_CENTS * sev + DAILY_ESCALATION_CENTS * days_late
      penalty_cents = min(penalty, PENALTY_CAP_CENTS)
    input_set: "the EnforcementAction plus, for LATE_EXCEEDANCE origin, its triggering ExceedanceEvent (latest OPEN/REPORTED_LATE on the facility's sources by detected_at ASC, created_at ASC tie-break)"
    constants:
      BASE_PENALTY_CENTS: 250000
      DAILY_ESCALATION_CENTS: 50000
      PENALTY_CAP_CENTS: 2500000
    precision: "integer cents; days_late = floor((reported_at - detected_at)/24h)"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "role permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for entity_backed FacilityOperator acting on a facility-owned resource, X-User-ID equals the resource's facility_id (ownership)"
    error_id: ERR_NOT_FACILITY_OWNER
    http_status: 403
    applies_to: "operator-owned writes (source register, inventory submit/amend, permit submit, exceedance report, enforcement pay)"
  - priority: 4
    category: existence
    check: "all path/body referenced resources exist (validated left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "certify requires facility not SUSPENDED (cross-entity state precondition)"
    error_id: ERR_FACILITY_SUSPENDED
    http_status: 409
    applies_to: "POST /inventories/{id}/certify, POST /sources/{id}/start-operating"
  - priority: 7
    category: business_referential
    check: "issuing a permit requires its linked PublicNotice.status == CLOSED"
    error_id: ERR_NOTICE_NOT_CLOSED
    http_status: 409
    applies_to: "POST /permits/{id}/issue"
  - priority: 8
    category: business_safety
    check: "certify rejected if any source on the inventory has an OPEN or REPORTED_LATE ExceedanceEvent"
    error_id: ERR_UNRESOLVED_EXCEEDANCE
    http_status: 409
    applies_to: "POST /inventories/{id}/certify"
  - priority: 9
    category: business_temporal
    check: "PublicNotice comment window must not overlap another notice on permits of the same facility (closed intervals)"
    error_id: ERR_NOTICE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /public-notices"
  - priority: 10
    category: business_temporal
    check: "StackTest window must not overlap, and must be >= STACK_TEST_BUFFER_DAYS (7) days apart from, any other StackTest on the same source (closed intervals + 7-day buffer between windows)"
    error_id: ERR_STACK_TEST_CONFLICT
    http_status: 409
    applies_to: "POST /stack-tests"
  - priority: 11
    category: business_temporal
    check: "Inspection window must not overlap another Inspection on the same facility; back-to-back adjacency is allowed (half-open [start,end))"
    error_id: ERR_INSPECTION_OVERLAP
    http_status: 409
    applies_to: "POST /inspections"
  - priority: 12
    category: business_constraint
    check: "permit_type must match facility.permit_track on submit (TITLE_V permit only for TITLE_V facility)"
    error_id: ERR_PERMIT_TRACK_MISMATCH
    http_status: 422
    applies_to: "POST /permits/{id}/submit"
  - priority: 13
    category: business_constraint
    check: "comment_close_at > comment_open_at; variance_end > variance_start; scheduled_end >= scheduled_start"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /public-notices, grant-variance, POST /stack-tests, POST /inspections"
  - priority: 14
    category: business_referential
    check: "reporting_year must be unique per facility"
    error_id: ERR_DUPLICATE_INVENTORY_YEAR
    http_status: 409
    applies_to: "POST /inventories"
  - priority: 15
    category: state
    check: "inventory must have at least one InventoryLineItem before submit"
    error_id: ERR_NO_LINE_ITEMS
    http_status: 409
    applies_to: "POST /inventories/{id}/submit"
  - priority: 16
    category: business_temporal
    check: "public comment only accepted while notice.status == OPEN and clock < comment_close_at"
    error_id: ERR_COMMENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /public-notices/{id}/comment"
  - priority: 17
    category: business_fiscal
    check: "OCC expected_facility_version must equal facility.version"
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    applies_to: "POST /sources, POST /inventories/{id}/certify"
  - priority: 18
    category: business_constraint
    check: "request body well-formed: required fields present, enums valid, numbers in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Facilities ----
  - method: POST
    path: "/facilities"
    description: "Register a facility"
    roles: [FacilityOperator]
    code: 201
    input: [name, operator_name, county]
    output: Facility
    side_effects: []
  - method: GET
    path: "/facilities/{id}"
    description: "Fetch a facility (includes computed PTE, permit_track, compliance_status, fee_balance)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: GET
    path: "/facilities"
    description: "List facilities"
    roles: [PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["county?", "compliance_status?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []
  # ---- Sources ----
  - method: POST
    path: "/sources"
    description: "Register an emission source under a facility; recomputes facility PTE & track"
    roles: [FacilityOperator]
    code: 201
    input: ["facility_id", "source_type", "pollutant", "max_hourly_rate_lbs", "operating_hours_per_year", "control_efficiency?", "permit_limit_ppm", "expected_facility_version"]
    output: EmissionSource
    side_effects: ["computes source_pte", "recomputes facility.potential_to_emit_tpy & permit_track", "increments Facility.version by 1"]
  - method: GET
    path: "/sources/{id}"
    description: "Fetch a source"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: EmissionSource
    side_effects: []
  - method: GET
    path: "/facilities/{id}/sources"
    description: "List a facility's sources (FK reverse-reachability for EmissionSource.facility_id)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: EmissionSource[]
    side_effects: []
  - method: POST
    path: "/sources/{id}/permit"
    description: "Mark a source PERMITTED (permit engineer)"
    roles: [PermitReviewer]
    code: 200
    input: []
    output: EmissionSource
    side_effects: ["lifecycle_status REGISTERED -> PERMITTED"]
  - method: POST
    path: "/sources/{id}/start-operating"
    description: "Move a permitted source into OPERATING"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: EmissionSource
    side_effects: ["lifecycle_status PERMITTED -> OPERATING"]
  - method: POST
    path: "/sources/{id}/shutdown"
    description: "Permanently shut down a source; reduces facility PTE"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: EmissionSource
    side_effects: ["lifecycle_status -> SHUTDOWN", "facility.potential_to_emit_tpy -= source.uncontrolled_pte_tpy", "recompute permit_track"]
  - method: POST
    path: "/sources/{id}/cem-data"
    description: "Submit a CEM data block; computes exceedance, sets monitoring CEM_ACTIVE"
    roles: [Inspector]
    code: 201
    input: [period_start, period_end, avg_concentration_ppm]
    output: CEMDataBlock
    side_effects: ["computes cem_exceedance", "monitoring_status -> CEM_ACTIVE"]
  - method: GET
    path: "/sources/{id}/cem-data"
    description: "List CEM blocks for a source (FK reverse-reachability for CEMDataBlock.source_id)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CEMDataBlock[]
    side_effects: []
  - method: GET
    path: "/sources/{id}/exceedances"
    description: "List exceedances for a source (FK reverse-reachability for ExceedanceEvent.source_id)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ExceedanceEvent[]
    side_effects: []
  # ---- Permits ----
  - method: POST
    path: "/permits"
    description: "Create a draft permit for a facility"
    roles: [FacilityOperator]
    code: 201
    input: [facility_id, permit_type]
    output: Permit
    side_effects: []
  - method: GET
    path: "/permits/{id}"
    description: "Fetch a permit"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/facilities/{id}/permits"
    description: "List a facility's permits (FK reverse-reachability for Permit.facility_id)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/permits/{id}/submit"
    description: "Submit a draft permit (operator)"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: Permit
    side_effects: ["DRAFT -> SUBMITTED"]
  - method: POST
    path: "/permits/{id}/begin-review"
    description: "Begin review"
    roles: [PermitReviewer]
    code: 200
    input: []
    output: Permit
    side_effects: ["SUBMITTED -> UNDER_REVIEW"]
  - method: POST
    path: "/permits/{id}/return-for-revision"
    description: "Return permit to DRAFT (revision loop)"
    roles: [PermitReviewer]
    code: 200
    input: []
    output: Permit
    side_effects: ["UNDER_REVIEW -> DRAFT"]
  - method: POST
    path: "/permits/{id}/open-public-notice"
    description: "Open the public comment period"
    roles: [PermitReviewer]
    code: 200
    input: []
    output: Permit
    side_effects: ["UNDER_REVIEW -> PUBLIC_NOTICE", "linked PublicNotice.status = OPEN"]
  - method: POST
    path: "/permits/{id}/issue"
    description: "Issue the permit (requires closed notice)"
    roles: [PermitReviewer]
    code: 200
    input: []
    output: Permit
    side_effects: ["PUBLIC_NOTICE -> ISSUED", "sets issued_at", "Title V: REGISTERED sources -> PERMITTED"]
  - method: POST
    path: "/permits/{id}/start-renewal"
    description: "Begin a renewal cycle"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: Permit
    side_effects: ["ISSUED -> RENEWAL_PENDING"]
  - method: POST
    path: "/permits/{id}/complete-renewal"
    description: "Complete a renewal cycle"
    roles: [PermitReviewer]
    code: 200
    input: []
    output: Permit
    side_effects: ["RENEWAL_PENDING -> ISSUED", "renewal_count += 1"]
  # ---- Public notices ----
  - method: POST
    path: "/public-notices"
    description: "Create a public notice window for a permit"
    roles: [PermitReviewer]
    code: 201
    input: [permit_id, comment_open_at, comment_close_at]
    output: PublicNotice
    side_effects: []
  - method: GET
    path: "/public-notices/{id}"
    description: "Fetch a public notice"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: PublicNotice
    side_effects: []
  - method: GET
    path: "/permits/{id}/public-notices"
    description: "List a permit's notices (FK reverse-reachability for PublicNotice.permit_id)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PublicNotice[]
    side_effects: []
  - method: POST
    path: "/public-notices/{id}/comment"
    description: "Record a public comment (anonymous public); only while OPEN and within window"
    roles: [Anonymous]
    code: 201
    input: [comment_text]
    output: PublicNotice
    side_effects: ["comment_count += 1"]
  - method: POST
    path: "/public-notices/{id}/close"
    description: "Close the comment window (reviewer, after comment_close_at)"
    roles: [PermitReviewer]
    code: 200
    input: []
    output: PublicNotice
    side_effects: ["status OPEN -> CLOSED"]
  # ---- Inventories ----
  - method: POST
    path: "/inventories"
    description: "Create a draft annual inventory for a facility-year"
    roles: [FacilityOperator]
    code: 201
    input: [facility_id, reporting_year, due_at]
    output: EmissionsInventory
    side_effects: []
  - method: GET
    path: "/inventories/{id}"
    description: "Fetch an inventory (computed totals & fees)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: EmissionsInventory
    side_effects: []
  - method: GET
    path: "/facilities/{id}/inventories"
    description: "List a facility's inventories (FK reverse-reachability for EmissionsInventory.facility_id)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["reporting_year?", "limit?", "offset?"]
    output: EmissionsInventory[]
    side_effects: []
  - method: POST
    path: "/line-items"
    description: "Add a line item to a DRAFT inventory"
    roles: [FacilityOperator]
    code: 201
    input: [inventory_id, source_id, method, reported_tons]
    output: InventoryLineItem
    side_effects: []
  - method: GET
    path: "/line-items/{id}"
    description: "Fetch a line item"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: InventoryLineItem
    side_effects: []
  - method: GET
    path: "/line-items"
    description: "List/filter line items (FK reverse-reachability for inventory_id and source_id)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["inventory_id?", "source_id?", "limit?", "offset?"]
    output: InventoryLineItem[]
    side_effects: []
  - method: POST
    path: "/inventories/{id}/submit"
    description: "Submit an inventory; computes total & estimated fee"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: EmissionsInventory
    side_effects: ["DRAFT -> SUBMITTED", "computes inventory_total & emissions_fee(estimated)"]
  - method: POST
    path: "/inventories/{id}/reject"
    description: "Return a submitted inventory to DRAFT"
    roles: [PermitReviewer]
    code: 200
    input: []
    output: EmissionsInventory
    side_effects: ["SUBMITTED -> DRAFT"]
  - method: POST
    path: "/inventories/{id}/certify"
    description: "Certify an inventory; assesses final fee, debits fee_balance"
    roles: [PermitReviewer]
    code: 200
    input: [expected_facility_version]
    output: EmissionsInventory
    side_effects: ["SUBMITTED -> CERTIFIED", "computes emissions_fee(assessed)", "facility.fee_balance_cents += assessed_fee_cents", "increments Facility.version by 1"]
  - method: POST
    path: "/inventories/{id}/amend"
    description: "Amend a certified inventory; reverses the fee debit (compensation)"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: EmissionsInventory
    side_effects: ["CERTIFIED -> AMENDED", "facility.fee_balance_cents -= assessed_fee_cents", "assessed_fee_cents = 0"]
  # ---- Stack tests ----
  - method: POST
    path: "/stack-tests"
    description: "Schedule a stack test on a source (overlap + buffer checked)"
    roles: [Inspector]
    code: 201
    input: [source_id, scheduled_start, scheduled_end]
    output: StackTest
    side_effects: []
  - method: GET
    path: "/stack-tests/{id}"
    description: "Fetch a stack test"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: StackTest
    side_effects: []
  - method: GET
    path: "/sources/{id}/stack-tests"
    description: "List a source's stack tests (FK reverse-reachability for StackTest.source_id)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: StackTest[]
    side_effects: []
  - method: POST
    path: "/stack-tests/{id}/conduct"
    description: "Record test results; auto-transitions PASSED/FAILED"
    roles: [Inspector]
    code: 200
    input: [measured_rate_lbs]
    output: StackTest
    side_effects: ["SCHEDULED -> CONDUCTED -> PASSED|FAILED", "PASSED: monitoring STACK_TESTED", "FAILED: create ExceedanceEvent(OPEN) -> facility DEVIATION cascade"]
  # ---- Exceedances ----
  - method: POST
    path: "/exceedances"
    description: "File an exceedance/deviation on a source (inspector)"
    roles: [Inspector]
    code: 201
    input: ["source_id", "event_type", "detected_at", "magnitude_pct?"]
    output: ExceedanceEvent
    side_effects: ["facility.open_exceedance_count += 1", "facility.compliance_status -> DEVIATION"]
  - method: GET
    path: "/exceedances/{id}"
    description: "Fetch an exceedance"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: ExceedanceEvent
    side_effects: []
  - method: POST
    path: "/exceedances/{id}/report"
    description: "Report/deviation report; branches REPORTED vs REPORTED_LATE on deadline"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: ExceedanceEvent
    side_effects: ["OPEN -> REPORTED | REPORTED_LATE", "LATE: create EnforcementAction(LATE_EXCEEDANCE)"]
  - method: POST
    path: "/exceedances/{id}/resolve"
    description: "Resolve a reported exceedance"
    roles: [Inspector]
    code: 200
    input: []
    output: ExceedanceEvent
    side_effects: ["REPORTED|REPORTED_LATE -> RESOLVED", "recompute facility posture"]
  # ---- Complaints & inspections ----
  - method: POST
    path: "/complaints"
    description: "File a public complaint against a facility (anonymous)"
    roles: [Anonymous]
    code: 201
    input: [facility_id, description, severity]
    output: Complaint
    side_effects: []
  - method: GET
    path: "/complaints/{id}"
    description: "Fetch a complaint"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: GET
    path: "/facilities/{id}/complaints"
    description: "List a facility's complaints (FK reverse-reachability for Complaint.facility_id)"
    roles: [PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: POST
    path: "/complaints/{id}/dismiss"
    description: "Dismiss a complaint without inspection"
    roles: [Inspector]
    code: 200
    input: []
    output: Complaint
    side_effects: ["RECEIVED -> DISMISSED"]
  - method: POST
    path: "/inspections"
    description: "Schedule an inspection (routine or complaint-driven; overlap checked)"
    roles: [Inspector]
    code: 201
    input: ["facility_id", "scheduled_start", "scheduled_end", "complaint_id?"]
    output: Inspection
    side_effects: ["if complaint_id: Complaint -> INSPECTION_SCHEDULED"]
  - method: GET
    path: "/inspections/{id}"
    description: "Fetch an inspection"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/facilities/{id}/inspections"
    description: "List a facility's inspections (FK reverse-reachability for Inspection.facility_id)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/complaints/{id}/inspections"
    description: "List inspections for a complaint (FK reverse-reachability for Inspection.complaint_id)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/inspections/{id}/complete"
    description: "Complete an inspection with outcome; FAIL creates enforcement"
    roles: [Inspector]
    code: 200
    input: [outcome]
    output: Inspection
    side_effects: ["SCHEDULED -> COMPLETED", "complaint (if any) -> CLOSED", "FAIL: EnforcementAction(INSPECTION_FAIL)"]
  # ---- Enforcement ----
  - method: POST
    path: "/enforcement-actions"
    description: "Open an enforcement action / variance request on a facility"
    roles: [EnforcementOfficer]
    code: 201
    input: ["facility_id", "action_type", "origin?", "variance_start?", "variance_end?"]
    output: EnforcementAction
    side_effects: []
  - method: GET
    path: "/enforcement-actions/{id}"
    description: "Fetch an enforcement action"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: []
  - method: GET
    path: "/facilities/{id}/enforcement-actions"
    description: "List a facility's enforcement actions (FK reverse-reachability for EnforcementAction.facility_id)"
    roles: [FacilityOperator, PermitReviewer, Inspector, EnforcementOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EnforcementAction[]
    side_effects: []
  - method: POST
    path: "/enforcement-actions/{id}/assess-penalty"
    description: "Assess a penalty; suspends facility & cascades"
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: ["INITIATED -> PENALTY_ASSESSED", "computes enforcement_penalty", "facility SUSPENDED cascade: sources SUSPENDED, ISSUED permits REVOKED"]
  - method: POST
    path: "/enforcement-actions/{id}/grant-variance"
    description: "Grant a variance relief window"
    roles: [EnforcementOfficer]
    code: 200
    input: [variance_start, variance_end]
    output: EnforcementAction
    side_effects: ["INITIATED -> VARIANCE_GRANTED"]
  - method: POST
    path: "/enforcement-actions/{id}/dismiss"
    description: "Dismiss an enforcement action"
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: ["INITIATED -> DISMISSED"]
  - method: POST
    path: "/enforcement-actions/{id}/pay"
    description: "Pay an assessed penalty; lifts suspension"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: ["PENALTY_ASSESSED -> PAID", "facility ENFORCEMENT, suspended sources -> OPERATING"]
  - method: POST
    path: "/enforcement-actions/{id}/close"
    description: "Close a paid enforcement action"
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: ["PAID -> CLOSED", "recompute facility posture"]
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default (never wall-clock)."
    roles: [PermitReviewer, Inspector, EnforcementOfficer, FacilityOperator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances the logical clock used by all deadline/window/overlap rules"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unrecognized X-User-Role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_NOT_FACILITY_OWNER
    http: 403
    condition: "FacilityOperator X-User-ID does not match the resource's facility_id"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a state allowing this transition"
  - id: ERR_FACILITY_SUSPENDED
    http: 409
    condition: "operation blocked because facility.compliance_status == SUSPENDED"
  - id: ERR_NOTICE_NOT_CLOSED
    http: 409
    condition: "issuing a permit whose PublicNotice is not CLOSED"
  - id: ERR_UNRESOLVED_EXCEEDANCE
    http: 409
    condition: "certify blocked by an OPEN/REPORTED_LATE exceedance on an inventory source"
  - id: ERR_NOTICE_WINDOW_OVERLAP
    http: 409
    condition: "public notice window overlaps another notice for the same facility"
  - id: ERR_STACK_TEST_CONFLICT
    http: 409
    condition: "stack test window overlaps or is within buffer of another on the same source"
  - id: ERR_INSPECTION_OVERLAP
    http: 409
    condition: "inspection window overlaps another on the same facility (adjacency allowed)"
  - id: ERR_PERMIT_TRACK_MISMATCH
    http: 422
    condition: "permit_type does not match facility.permit_track on submit"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "end <= start, duplicate reporting_year, or invalid variance window"
  - id: ERR_STALE_FACILITY_VERSION
    http: 412
    condition: "expected_facility_version != facility.version (OCC)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body: missing required field, bad enum, out-of-range number"
  - id: ERR_COMMENT_WINDOW_CLOSED
    http: 409
    condition: "public comment posted when the notice is CLOSED or the logical clock is >= comment_close_at"
  - id: ERR_NO_LINE_ITEMS
    http: 409
    condition: "inventory submit attempted with zero InventoryLineItem rows"
  - id: ERR_DUPLICATE_INVENTORY_YEAR
    http: 409
    condition: "an inventory already exists for this facility/reporting_year"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: FacilityOperator
    description: "Regulated entity operator; registers sources, files inventories, reports exceedances, pays penalties"
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /facilities"
      - "POST /sources"
      - "POST /sources/{id}/start-operating"
      - "POST /sources/{id}/shutdown"
      - "POST /permits"
      - "POST /permits/{id}/submit"
      - "POST /permits/{id}/start-renewal"
      - "POST /inventories"
      - "POST /line-items"
      - "POST /inventories/{id}/submit"
      - "POST /inventories/{id}/amend"
      - "POST /exceedances/{id}/report"
      - "POST /enforcement-actions/{id}/pay"
    shared_operations: ["GET reads", "POST /_clock/set_current_utc"]
  - name: PermitReviewer
    description: "Agency permit engineer; reviews/issues permits, manages public notice, certifies inventories"
    identity: opaque
    exclusive_operations:
      - "POST /sources/{id}/permit"
      - "POST /permits/{id}/begin-review"
      - "POST /permits/{id}/return-for-revision"
      - "POST /permits/{id}/open-public-notice"
      - "POST /permits/{id}/issue"
      - "POST /permits/{id}/complete-renewal"
      - "POST /public-notices"
      - "POST /public-notices/{id}/close"
      - "POST /inventories/{id}/reject"
      - "POST /inventories/{id}/certify"
    shared_operations: ["GET reads", "POST /_clock/set_current_utc"]
  - name: Inspector
    description: "Field inspector; runs stack tests, submits CEM data, files/resolves exceedances, conducts inspections"
    identity: opaque
    exclusive_operations:
      - "POST /sources/{id}/cem-data"
      - "POST /stack-tests"
      - "POST /stack-tests/{id}/conduct"
      - "POST /exceedances"
      - "POST /exceedances/{id}/resolve"
      - "POST /complaints/{id}/dismiss"
      - "POST /inspections"
      - "POST /inspections/{id}/complete"
    shared_operations: ["GET reads", "POST /_clock/set_current_utc"]
  - name: EnforcementOfficer
    description: "Enforcement/variance authority; opens enforcement, assesses penalties, grants variances"
    identity: opaque
    exclusive_operations:
      - "POST /enforcement-actions"
      - "POST /enforcement-actions/{id}/assess-penalty"
      - "POST /enforcement-actions/{id}/grant-variance"
      - "POST /enforcement-actions/{id}/dismiss"
      - "POST /enforcement-actions/{id}/close"
    shared_operations: ["GET reads", "POST /_clock/set_current_utc"]
  - name: Anonymous
    description: "Unauthenticated public; files complaints and public comments"
    identity: opaque
    exclusive_operations:
      - "POST /complaints"
      - "POST /public-notices/{id}/comment"
    shared_operations: []


