          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Immediate Co", contact_email: "im@example.com" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-9907", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 20000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /terminal-resources", payload: { resource_code: "DOCK-108", resource_type: "DOCK" }, as: TerminalOperator, captures: { r_id: $.data.id } }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 100, window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-11T06:00:00Z" }, as: Scheduler, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /movements/${m_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler, captures: { est: $.data.demurrage_estimated_amount, st: $.data.status } }
          assert:
            - "est == 7200.00 (visible in the mutating response itself)"
            - "st == SCHEDULED"

