              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/benches"
              payload: { bench_code: "B-6", parallel_slots: 1, cleanroom: false }
              as: ShopAdmin
              captures: { bench_id: $.data.id }
