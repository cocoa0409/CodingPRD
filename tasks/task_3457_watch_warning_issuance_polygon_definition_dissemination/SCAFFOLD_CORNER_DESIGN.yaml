      - name: issue_draft_with_satisfiable_coordination_returns_not_acked
        claim_type: Invalid Transitions
        grounds: [state_machines.Product.DRAFT_to_ISSUED, errors.ERR_COORDINATION_NOT_ACKED]
        distinguishing_aspect: "Skipping submit-coordination does not bypass the gate: issuing straight from DRAFT when coordination is required (and satisfiable) is 409 ERR_COORDINATION_NOT_ACKED — the DRAFT -> ISSUED transition's coordination_required == false precondition."
