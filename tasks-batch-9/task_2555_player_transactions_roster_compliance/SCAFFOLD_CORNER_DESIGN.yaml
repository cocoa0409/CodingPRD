              as: TeamMedicalOfficer
              as_user_id: "${df_team_id}"
              captures: { df_expires: $.data.expires_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /compliance-checks/run"
              payload: { team_id: "${df_team_id}" }
              as: LeagueOfficer
            - call: "GET /physical-exams/${df_ex_id}"
