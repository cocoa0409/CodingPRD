          o3_l1: $.data.last_consult_completed_at
      - call: GET /stroke-network/neurologists/${n2_id}
        as: ProgramCoordinator
        captures:
          o3_a2: $.data.active_consult_count
          o3_s2: $.data.on_call_state
          o3_d2: $.data.completed_consult_count
          o3_l2: $.data.last_consult_completed_at
      - call: GET /stroke-network/spoke-agreements/${agr_id}
        payload: {}
