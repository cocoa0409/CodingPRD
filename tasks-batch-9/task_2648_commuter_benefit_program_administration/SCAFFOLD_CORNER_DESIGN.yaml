      - name: undelivered_after_reconciled_batch_propagates_to_election_but_stops_at_terminal_batch
        claim_type: constraint_propagation
        grounds:
          - calculations.election_fulfillment_rollup
          - state_machines.MediaOrder.DELIVERED_to_UNDELIVERED
          - state_machines.OrderBatch.terminal_states
        distinguishing_aspect: "A late loss report re-runs the rollup on an already-settled chain: the change must propagate UP one level (election DELIVERED -> REPLACEMENT_PENDING) and then stop, because RECONCILED is terminal for OrderBatch - the propagation reaches a fixed point instead of dragging the batch backwards to RELEASED."
