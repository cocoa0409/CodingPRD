              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "605", full_name: "R Rbac5", email: "rrbac5@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T A", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_a: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T B", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_b: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "A's job" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_a}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_b}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_RESOURCE_OWNER, HTTP 403"
            - "WorkOrder.${wo_id}.status remains ASSIGNED"

      - name: manager_cannot_file_work_order
        claim_type: role_denial
        grounds: ["roles[PropertyManager]", "endpoints[POST /work-orders]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Intake is exclusive to the Resident role: PropertyManager filing a work order gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["property and resident exist"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Rbac6 Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "606", full_name: "R Rbac6", email: "rrbac6@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Manager filing" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403"

  # ===========================================================================
  # Section: complexity_layers (from cross-cutting complexity layers)
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: patch_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[wo-triage-stale-version]", "validations[priority=5]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a successful PATCH bumps WorkOrder.version 1 -> 2, a second PATCH still carrying expected_work_order_version 1 is rejected with ERR_STALE_VERSION (412); the work order is unchanged."
        test_recipe:
          setup: ["TRIAGED work order, version 1 observed"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Occ1 Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "701", full_name: "R Occ1", email: "rocc1@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Stale edit" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id, wo_v1: $.data.version }
            - call: "PATCH /work-orders/${wo_id}"
              payload: { expected_work_order_version: "${wo_v1}", description: "first edit" }
              as: Dispatcher
              captures: { wo_v2: $.data.version }
          trigger:
            - call: "PATCH /work-orders/${wo_id}"
              payload: { expected_work_order_version: "${wo_v1}", description: "stale edit" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH succeeded: version == 2"
            - "Stale PATCH: error_id == ERR_STALE_VERSION, HTTP 412"
            - "WorkOrder.${wo_id}.description remains \"first edit\" and version remains 2"

      - name: purchase_create_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pr-create-stale-work-order]", "validations[priority=5]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Purchase-request creation bumps WorkOrder.version; a second create carrying the pre-first-create version is rejected with ERR_STALE_VERSION (412) even though it would otherwise legitimately supersede."
        test_recipe:
          setup: ["work order ASSIGNED to technician (version 2 observed); part stocked"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Occ2 Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "702", full_name: "R Occ2", email: "rocc2@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "SEAL-1", name: "Seal", unit_cost_cents: 100, reorder_level: 0, initial_stock: 0 }
              as: PropertyManager
              captures: { part_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Seal job" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { wo_v2: $.data.version }
            - call: "POST /work-orders/${wo_id}/purchase-requests"
              payload: { part_id: "${part_id}", quantity: 1, quoted_unit_cost_cents: 100, shipping_fee_cents: 0, expected_work_order_version: "${wo_v2}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pr1: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/purchase-requests"
              payload: { part_id: "${part_id}", quantity: 2, quoted_unit_cost_cents: 100, shipping_fee_cents: 0, expected_work_order_version: "${wo_v2}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First create succeeded (WorkOrder.version now 3)"
            - "Stale create: error_id == ERR_STALE_VERSION, HTTP 412"
            - "PurchaseRequest.${pr1} remains the only request for the pair and is NOT superseded"

      - name: restock_status_reconciles_on_reserve
        claim_type: derived_field_reconciliation
        grounds: [entities.Part.fields.restock_status, calculations.part_stock_ledger]
        distinguishing_aspect: "Reserve alone flips the derived flag: part (initial_stock 5, reorder_level 2) is IN_STOCK at creation and LOW_STOCK after reserving 4 (on_hand 1 <= 2), with no completion involved."
        test_recipe:
          setup: ["part initial_stock 5, reorder_level 2; work order ASSIGNED to technician"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Restock Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "703", full_name: "R Restock", email: "rrestock@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "VLV-2", name: "Valve", unit_cost_cents: 500, reorder_level: 2, initial_stock: 5 }
              as: PropertyManager
              captures: { part_id: $.data.id, rs0: $.data.restock_status }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Valve job" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { part_id: "${part_id}", quantity: 4 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /parts/${part_id}"
              payload: {}
              as: PropertyManager
              captures: { onhand: $.data.quantity_on_hand, resv: $.data.reserved_quantity, rs1: $.data.restock_status }
          assert:
            - "At creation: restock_status == IN_STOCK (5 > 2)"
            - "After reserving 4: quantity_on_hand == 1, reserved_quantity == 4, restock_status == LOW_STOCK (1 <= 2)"

      - name: threshold_triggers_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: ["complexity_profile.complexity_layers[rate_threshold_triggers]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / purchase_threshold_exact_boundary
          rationale: "Threshold boundaries are asserted by §1.8 boundary_precision_check instances (purchase_threshold_exact_boundary, reopen_window_exact_boundary)."

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers[cascading_side_effects]"]
        excluded_because:
          difficulty_instance: transitive_cascade / vendor_suspend_cascade_depth3
          rationale: "Both cascade chains are asserted end-to-end by the two §1.8 transitive_cascade instances."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_completion_side_effects
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, "endpoints[POST /work-orders/{id}/complete]", "endpoints[GET /chargebacks]"]
        distinguishing_aspect: "Immediate consistency: the complete response itself carries the mutated state (COMPLETED, completed_at set, breach flag), and the very next read already sees the cascade-created PENDING chargeback — no delay or reindex."
        test_recipe:
          setup: ["work order IN_PROGRESS with sign-off"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Imm Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "801", full_name: "R Imm", email: "rimm@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Immediate job" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/i1.jpg"], damage_reported: true, estimated_damage_cost_cents: 2500 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { st: $.data.status, ca: $.data.completed_at, cb: $.data.completion_sla_breached }
            - call: "GET /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: Dispatcher
              captures: {cb_status: "$.data[0].status"}
          assert:
            - "Complete response: status == COMPLETED, completed_at == 2026-08-01T00:00:00Z (default clock), completion_sla_breached == false"
            - "Immediate follow-up GET /chargebacks?work_order_id returns the PENDING chargeback (total_count == 1, status == PENDING)"
