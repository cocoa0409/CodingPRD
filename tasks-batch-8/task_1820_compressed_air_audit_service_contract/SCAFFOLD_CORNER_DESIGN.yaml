# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests (task 1820)
# Sections/claim_types follow references/claim-extraction-guide.md
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------
  - section: entities
    instances:
      - name: corner_facility_create_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Facility]
        distinguishing_aspect: "POST /facilities with the four required inputs returns 201 with system-stamped id/created_at/version=1, status ONBOARDING, posture NORMAL, and zeroed computed aggregates."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /facilities", payload: { name: "F-ENT", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
          assert:
            - "Facility.${fac}.status == ONBOARDING (initial state)"
            - "Facility.${fac}.posture == NORMAL"
            - "Facility.${fac}.repair_committed_cents == 0 and rental_escrow_cents == 0"
            - "Facility.${fac}.version == 1; id is a bare UUID; created_at has 3 fractional digits"

      - name: corner_compressor_duplicate_asset_tag_rejected
        claim_type: type_constraints
        grounds: [entities.Compressor.fields.asset_tag, "errors[ERR_DUPLICATE_ASSET_TAG]"]
        distinguishing_aspect: "Second compressor with asset_tag C1 in the same facility is rejected; the same tag in a DIFFERENT facility is accepted (uniqueness scope is per facility, non-DECOMMISSIONED)."
        test_recipe:
          setup: ["Facility ACTIVE with compressor C1"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-DUP", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 30, rated_cfm: 150 }, as: ServiceTech, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_DUPLICATE_ASSET_TAG (409)"
            - "GET /compressors?facility_id=${fac} still returns exactly 1 row"

      - name: corner_get_nonexistent_compressor_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields 404 ERR_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /compressors/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ServiceTech, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NOT_FOUND, http 404, response_type == error"

      - name: corner_profile_window_end_before_start_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.DemandProfile.fields.window_end_date, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "window_end_date < window_start_date is a schema-level rejection (400), independent of the overlap rule."
        test_recipe:
          setup: ["Facility ACTIVE"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-WIN", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
          trigger:
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-31", window_end_date: "2026-03-01", measured_kwh: 1000, measured_avg_cfm: 10.0, measured_peak_cfm: 20.0 }, as: EnergyEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: corner_retrofit_target_pressure_must_be_lower
        claim_type: type_constraints
        grounds: [entities.RetrofitProject.fields.target_pressure_psi, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "target_pressure_psi >= baseline_pressure_psi rejected at creation (a zero/negative pressure drop makes no sequencing sense)."
        test_recipe:
          setup: ["Facility ACTIVE with compressor C1"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-PSI", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 110, target_pressure_psi: 110, sequence_compressor_ids: ["${c1}"], project_cost_cents: 1000000 }, as: EnergyEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: corner_baseline_annualization_computed
        claim_type: computed_fields
        grounds: [calculations.baseline_annualization, entities.DemandProfile.fields.baseline_annual_kwh]
        distinguishing_aspect: "baseline_annual_kwh is server-computed: 31-day inclusive window of 248000 kWh annualizes to exactly 2920000; any client-supplied value is ignored."
        test_recipe:
          setup: ["Facility ACTIVE"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-ANN", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
          trigger:
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof: "$.data.id", ann: "$.data.baseline_annual_kwh" } }
          assert:
            - "DemandProfile.${prof}.baseline_annual_kwh == 2920000 (248000 * 365 / 31, round_half_up)"
            - "DemandProfile.${prof}.status == COLLECTING (initial state)"

      - name: corner_duplicate_fleet_tag_rejected
        claim_type: type_constraints
        grounds: [entities.RentalAsset.fields.fleet_tag, "errors[ERR_DUPLICATE_FLEET_TAG]"]
        distinguishing_aspect: "fleet_tag is globally unique across the dealer fleet."
        test_recipe:
          setup: ["RentalAsset A1 exists"]
          setup_api_calls:
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 300, daily_rate_cents: 20000, deposit_cents: 60000 }, as: DealerAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_DUPLICATE_FLEET_TAG (409)"

      - name: corner_duplicate_schedule_component_rejected
        claim_type: type_constraints
        grounds: [entities.MaintenanceSchedule.fields.component, "errors[ERR_DUPLICATE_SCHEDULE_COMPONENT]"]
        distinguishing_aspect: "A second ACTIVE DRYER schedule for the same facility is rejected; a FILTER schedule for the same facility is accepted (uniqueness over the facility+component pair among ACTIVE)."
        test_recipe:
          setup: ["Facility ACTIVE with ACTIVE DRYER schedule"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-DS", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /maintenance-schedules", payload: { facility_id: "${fac}", component: "DRYER", interval_hours: 2000 }, as: ContractManager, captures: { s1: "$.data.id" } }
          trigger:
            - { call: "POST /maintenance-schedules", payload: { facility_id: "${fac}", component: "DRYER", interval_hours: 1000 }, as: ContractManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /maintenance-schedules", payload: { facility_id: "${fac}", component: "FILTER", interval_hours: 1000 }, as: ContractManager, captures: { s2: "$.data.id" } }
          assert:
            - "second DRYER rejected with ERR_DUPLICATE_SCHEDULE_COMPONENT (409)"
            - "FILTER schedule created (201), status ACTIVE"

  # ---------------------------------------------------------------
  - section: state_machines
    instances:
      - name: corner_survey_verify_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LeakSurvey, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "verify is only declared from SUBMITTED; from DRAFT it fails with ERR_INVALID_STATE_TRANSITION and no fields mutate."
        test_recipe:
          setup: ["Facility ACTIVE; DRAFT survey with one tag"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-SM1", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /leak-surveys", payload: { facility_id: "${fac}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "x", cfm_loss: 3.0, repair_quote_cents: 100000 }, as: EnergyEngineer, captures: { tag: "$.data.id" } }
          trigger:
            - { call: "POST /leak-surveys/${surv}/verify", as: EnergyEngineer, as_user_id: eng-9, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION (409)"
            - "LeakSurvey.${surv}.status == DRAFT; verified_by_user_id still null"

      - name: corner_offboarded_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Facility]
        distinguishing_aspect: "OFFBOARDED is terminal: suspend/reinstate/activate on an OFFBOARDED facility all fail with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Facility ONBOARDING -> ACTIVE -> OFFBOARDED (no obligations)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-TERM", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /facilities/${fac}/offboard", as: DealerAdmin }
          trigger:
            - { call: "POST /facilities/${fac}/suspend", as: DealerAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION"
            - "Facility.${fac}.status == OFFBOARDED (unchanged)"

      - name: corner_credit_apply_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ServiceCredit, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "APPLIED is terminal for a credit; a second apply fails — apply is not idempotent."
        test_recipe:
          setup: ["One SLA_BREACH credit, already APPLIED"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-CR2", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: DealerAdmin }
            - { call: "POST /service-tickets", payload: { facility_id: "${fac}", compressor_id: "${c1}", severity: "EMERGENCY" }, as: FacilityManager, as_user_id: "${fac}", captures: { t1: "$.data.id" } }
            - { call: "POST /service-tickets/${t1}/dispatch", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T09:00:01Z" }, as: DealerAdmin }
            - { call: "POST /service-tickets/${t1}/record-response", as: ServiceTech }
            - { call: "GET /service-credits?contract_id=${sc}", as: ContractManager, captures: { cr1: "$.data[0].id" } }
            - { call: "POST /service-credits/${cr1}/apply", as: ContractManager }
          trigger:
            - { call: "POST /service-credits/${cr1}/apply", as: ContractManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION (409)"
            - "ServiceCredit.${cr1}.status == APPLIED (unchanged)"

      - name: corner_survey_submit_cascades_tags_to_quoted
        claim_type: side_effect_execution
        grounds: [state_machines.LeakSurvey.DRAFT_to_SUBMITTED, state_machines.LeakTag.TAGGED_to_QUOTED]
        distinguishing_aspect: "Submitting the survey moves every contained tag TAGGED -> QUOTED in the same request (cascade down)."
        test_recipe:
          setup: ["Facility ACTIVE; DRAFT survey with two tags"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-SM2", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /leak-surveys", payload: { facility_id: "${fac}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "a", cfm_loss: 3.0, repair_quote_cents: 100000 }, as: EnergyEngineer, captures: { t1: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "b", cfm_loss: 4.0, repair_quote_cents: 120000 }, as: EnergyEngineer, captures: { t2: "$.data.id" } }
          trigger:
            - { call: "POST /leak-surveys/${surv}/submit", as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "GET /leak-tags?survey_id=${surv}", as: EnergyEngineer }
          assert:
            - "LeakSurvey.${surv}.status == SUBMITTED; submitted_by_user_id == eng-1"
            - "LeakTag.${t1}.status == QUOTED and LeakTag.${t2}.status == QUOTED"

      - name: corner_verify_assigns_severity_and_priority_rank
        claim_type: side_effect_execution
        grounds: [calculations.leak_priority_ranking, entities.LeakTag.fields.severity, entities.LeakTag.fields.priority_rank]
        distinguishing_aspect: "Verify computes severity bands with inclusive MEDIUM bounds (2.0 and 10.0 are MEDIUM) and ranks by cfm_loss DESC with repair_quote_cents ASC tie-break: 12.5 > 10.0(q90000) > 10.0(q100000) > 2.0 > 1.9."
        test_recipe:
          setup: ["Facility ACTIVE; survey SUBMITTED with five tags: 12.5/400000, 10.0/90000, 10.0/100000, 2.0/300000, 1.9/50000"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-RANK", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /leak-surveys", payload: { facility_id: "${fac}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "L1", cfm_loss: 12.5, repair_quote_cents: 400000 }, as: EnergyEngineer, captures: { t1: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "L2", cfm_loss: 10.0, repair_quote_cents: 90000 }, as: EnergyEngineer, captures: { t2: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "L3", cfm_loss: 10.0, repair_quote_cents: 100000 }, as: EnergyEngineer, captures: { t3: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "L4", cfm_loss: 2.0, repair_quote_cents: 300000 }, as: EnergyEngineer, captures: { t4: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "L5", cfm_loss: 1.9, repair_quote_cents: 50000 }, as: EnergyEngineer, captures: { t5: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/submit", as: EnergyEngineer, as_user_id: eng-1 }
          trigger:
            - { call: "POST /leak-surveys/${surv}/verify", as: EnergyEngineer, as_user_id: eng-2, captures: { tot: "$.data.total_leak_cfm", cnt: "$.data.tag_count" } }
          assert:
            - "LeakTag.${t1}: severity HIGH, priority_rank 1"
            - "LeakTag.${t2}: severity MEDIUM (10.0 inclusive upper bound), priority_rank 2 (tie on cfm broken by lower quote)"
            - "LeakTag.${t3}: severity MEDIUM, priority_rank 3"
            - "LeakTag.${t4}: severity MEDIUM (2.0 inclusive lower bound), priority_rank 4"
            - "LeakTag.${t5}: severity LOW, priority_rank 5"
            - "LeakSurvey.${surv}.total_leak_cfm == 36.4 and tag_count == 5"

      - name: corner_wont_fix_releases_budget_commitment
        claim_type: compensation
        grounds: [state_machines.LeakTag.REPAIR_AUTHORIZED_to_WONT_FIX, entities.Facility.fields.repair_committed_cents]
        distinguishing_aspect: "Authorizing then wont-fix-ing a tag returns facility.repair_committed_cents to its pre-authorization value — the compensating transition undoes the side effect exactly."
        test_recipe:
          setup: ["Facility ACTIVE budget 5000000; VERIFIED survey; tag QUOTED quote 400000"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-WF", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /leak-surveys", payload: { facility_id: "${fac}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "L1", cfm_loss: 12.5, repair_quote_cents: 400000 }, as: EnergyEngineer, captures: { t1: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/submit", as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys/${surv}/verify", as: EnergyEngineer, as_user_id: eng-2 }
            - { call: "POST /leak-tags/${t1}/authorize-repair", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "GET /facilities/${fac}", as: ContractManager, captures: { com1: "$.data.repair_committed_cents" } }
          trigger:
            - { call: "POST /leak-tags/${t1}/mark-wont-fix", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "GET /facilities/${fac}", as: ContractManager, captures: { com2: "$.data.repair_committed_cents" } }
          assert:
            - "after authorize: repair_committed_cents == 400000"
            - "after mark-wont-fix: repair_committed_cents == 0 (compensation exact)"
            - "LeakTag.${t1}.status == WONT_FIX (terminal)"

  # ---------------------------------------------------------------
  - section: calculations
    instances:
      - name: corner_rebate_cost_cap_binding
        claim_type: constants_applied
        grounds: [calculations.utility_rebate]
        distinguishing_aspect: "With project_cost_cents 1000000 the 50% cost cap (500000c) binds below the tiered amount (1889200c over deemed 496400 kWh with zero verified leaks): provisional rebate is exactly 500000c."
        test_recipe:
          setup:
            - "Facility ACTIVE; baseline 31-day window 248000 kWh LOCKED (annual 2920000); no leak tags at all (leak component 0)"
            - "Retrofit 125->100 psi APPROVED, cost 1000000c; case MODELED (deemed 496400 = sequencing only)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-CAP", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}"], project_cost_cents: 1000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer, captures: { deemed: "$.data.deemed_annual_savings_kwh" } }
          trigger:
            - { call: "POST /savings-cases/${case}/file-rebate", as: EnergyEngineer, captures: { prov: "$.data.provisional_rebate_cents" } }
          assert:
            - "SavingsCase.${case}.deemed_annual_savings_kwh == 496400 (sequencing only; leak component 0)"
            - "SavingsCase.${case}.provisional_rebate_cents == 500000 (min(1889200 tiered, 500000 cost cap, 20000000 program cap))"

      - name: corner_rental_min_days_floor
        claim_type: boundary_edge
        grounds: [calculations.rental_billing]
        distinguishing_aspect: "A 2-calendar-day rental bills the 3-day minimum: actual_bill_cents == 105000 while the quote variant (no floor) on the same dates was 70000c."
        test_recipe:
          setup: ["Facility ACTIVE, STANDARD contract ACTIVE, C1 DOWN; A1 500 CFM @ 35000c/day"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-MIN", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-02", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac}", captures: { res: "$.data.id", q: "$.data.quoted_cents" } }
            - { call: "POST /rental-reservations/${res}/deliver", as: ServiceTech }
          trigger:
            - { call: "POST /rental-reservations/${res}/return", payload: { actual_return_date: "2026-09-02" }, as: ServiceTech, captures: { bill: "$.data.actual_bill_cents" } }
          assert:
            - "RentalReservation.${res}.quoted_cents == 70000 (2 planned days, no floor on quote variant)"
            - "RentalReservation.${res}.actual_bill_cents == 105000 (3-day minimum applied: max(2, 3) * 35000)"

      - name: corner_rental_long_term_discount_boundary
        claim_type: boundary_edge
        grounds: [calculations.rental_billing]
        distinguishing_aspect: "The 0.85 factor applies only from day 28: a 27-day rental bills 945000c (pure full rate) and a 28-day rental bills 974750c (27 full days + 1 day at 29750c) — the boundary sits between day 27 and 28."
        test_recipe:
          setup: ["Facility ACTIVE, STANDARD contract ACTIVE, C1 DOWN; assets A1 and A2 both 500 CFM @ 35000c/day"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-LT", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A2", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a2: "$.data.id" } }
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-27", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac}", captures: { r27: "$.data.id" } }
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-28", rental_asset_id: "${a2}" }, as: FacilityManager, as_user_id: "${fac}", captures: { r28: "$.data.id" } }
            - { call: "POST /rental-reservations/${r27}/deliver", as: ServiceTech }
            - { call: "POST /rental-reservations/${r28}/deliver", as: ServiceTech }
          trigger:
            - { call: "POST /rental-reservations/${r27}/return", payload: { actual_return_date: "2026-09-27" }, as: ServiceTech, captures: { b27: "$.data.actual_bill_cents" } }
            - { call: "POST /rental-reservations/${r28}/return", payload: { actual_return_date: "2026-09-28" }, as: ServiceTech, captures: { b28: "$.data.actual_bill_cents" } }
          assert:
            - "RentalReservation.${r27}.actual_bill_cents == 945000 (27 days, all full rate)"
            - "RentalReservation.${r28}.actual_bill_cents == 974750 (27 * 35000 + 1 * round(0.85*35000)=29750)"

      - name: corner_deemed_input_set_excludes_unclosed_leaks
        claim_type: input_set_filtering
        grounds: [calculations.deemed_annual_savings]
        distinguishing_aspect: "Only VERIFIED_CLOSED tags enter the leak rollup: with tag1 (12.5 CFM -> 15000 kWh) closed and tag2 (8.0 CFM) still QUOTED, deemed is 511400 kWh, not 521000."
        test_recipe:
          setup: ["Facility ACTIVE hours 6000; baseline LOCKED; VERIFIED survey with tag1 VERIFIED_CLOSED and tag2 QUOTED; project APPROVED 125->100; case DRAFT"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-ISF", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys", payload: { facility_id: "${fac}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "L1", cfm_loss: 12.5, repair_quote_cents: 400000 }, as: EnergyEngineer, captures: { t1: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "L2", cfm_loss: 8.0, repair_quote_cents: 250000 }, as: EnergyEngineer, captures: { t2: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/submit", as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys/${surv}/verify", as: EnergyEngineer, as_user_id: eng-2 }
            - { call: "POST /leak-tags/${t1}/authorize-repair", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /leak-tags/${t1}/mark-repaired", as: ServiceTech }
            - { call: "POST /leak-tags/${t1}/verify-closure", as: EnergyEngineer }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
          trigger:
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer, captures: { deemed: "$.data.deemed_annual_savings_kwh" } }
          assert:
            - "SavingsCase.${case}.deemed_annual_savings_kwh == 511400 (15000 leak + 496400 sequencing; QUOTED tag2 contributes 0)"

      - name: corner_guarantee_payout_fee_cap_and_dispute_freeze
        claim_type: correct_result
        grounds: [calculations.guarantee_settlement, state_machines.GuaranteeCertificate]
        distinguishing_aspect: "Payout is capped at 12x monthly fee: guaranteed 446760 kWh (deemed 496400 x 0.9), deadband 8935, measured 0 -> shortfall 437825 -> raw 5253900c clamped to 1200000c; while the dispute is OPEN, pay is rejected (ERR_DISPUTE_OPEN_PAYOUT_FROZEN), and RESOLVED_OVERRULED releases the unchanged payout."
        test_recipe:
          setup:
            - "Facility ACTIVE rate 12; baseline 2920000 LOCKED; no leaks; project 125->100 ACCEPTED 2026-05-15, cost 50000000c"
            - "Case MEASURED with post profile 240000 kWh over 30 days -> post annual 2920000 -> measured savings exactly 0"
            - "PREMIUM contract ACTIVE with monthly_fee_cents 100000 (annual cap 1200000); certificate at 0.90"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-GCAP", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /retrofit-projects/${proj}/mark-installed", as: ServiceTech }
            - { call: "POST /retrofit-projects/${proj}/commission", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DealerAdmin }
            - { call: "POST /retrofit-projects/${proj}/accept", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer }
            - { call: "POST /savings-cases/${case}/open-measurement", as: EnergyEngineer }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-06-01", window_end_date: "2026-06-30", measured_kwh: 240000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof1: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v2: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof1}/lock", payload: { expected_facility_version: "${fac_v2}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /savings-cases/${case}/close-measurement", payload: { post_profile_id: "${prof1}" }, as: EnergyEngineer, as_user_id: eng-2, captures: { meas: "$.data.measured_annual_savings_kwh" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "PREMIUM", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 100000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v3: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v3}" }, as: ContractManager }
            - { call: "POST /guarantee-certificates", payload: { facility_id: "${fac}", contract_id: "${sc}", savings_case_id: "${case}", guaranteed_pct: 0.90 }, as: ContractManager, captures: { cert: "$.data.id" } }
          trigger:
            - { call: "POST /guarantee-certificates/${cert}/settle", as: ContractManager, captures: { st: "$.data.settlement_status", sf: "$.data.shortfall_kwh", po: "$.data.payout_cents" } }
            - { call: "POST /guarantee-certificates/${cert}/dispute", payload: { reason: "baseline meters miscalibrated" }, as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /guarantee-certificates/${cert}/pay", as: ContractManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /guarantee-certificates/${cert}/resolve-dispute", payload: { outcome: "OVERRULED" }, as: ContractManager }
            - { call: "POST /guarantee-certificates/${cert}/pay", as: ContractManager, captures: { st2: "$.data.settlement_status" } }
          assert:
            - "SavingsCase.${case}.measured_annual_savings_kwh == 0 (signed; no clamp)"
            - "GuaranteeCertificate.${cert}.guaranteed_kwh == 446760 and deadband_kwh == 8935"
            - "settle: shortfall_kwh == 437825; payout_cents == 1200000 (annual-fee cap binds below raw 5253900c)"
            - "settlement_status == SETTLED_PAYOUT_DUE"
            - "pay while dispute OPEN rejected with ERR_DISPUTE_OPEN_PAYOUT_FROZEN"
            - "after RESOLVED_OVERRULED: pay succeeds, settlement_status == PAID, payout_cents unchanged 1200000"

  # ---------------------------------------------------------------
  - section: validations
    instances:
      - name: corner_missing_required_field_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /facilities without repair_budget_cents fails schema validation with 400 ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /facilities", payload: { name: "F-X", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000 }, as: DealerAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, http 400"

      - name: corner_missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected at priority 1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            # deliberately no `as:` — the request carries no identity headers
            - { call: "GET /facilities", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400"

      - name: corner_run_hours_regression_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_RUN_HOURS_REGRESSION]"]
        distinguishing_aspect: "log-run-hours is monotonic: logging 3000 after 4000 is rejected; logging exactly 4000 again is allowed (>= is inclusive)."
        test_recipe:
          setup: ["Facility ACTIVE; compressor C1 at 4000 run-hours"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-RH", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /compressors/${c1}/log-run-hours", payload: { run_hours_total: 4000 }, as: ServiceTech }
          trigger:
            - { call: "POST /compressors/${c1}/log-run-hours", payload: { run_hours_total: 3000 }, as: ServiceTech, captures: { err: "$.data.error_id" } }
            - { call: "POST /compressors/${c1}/log-run-hours", payload: { run_hours_total: 4000 }, as: ServiceTech, captures: { rh: "$.data.run_hours_total" } }
          assert:
            - "regression rejected: error_id == ERR_RUN_HOURS_REGRESSION (422)"
            - "equal re-log accepted: run_hours_total == 4000"

      - name: corner_record_service_reading_bounds
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_READING_EXCEEDS_LOGGED]", "errors[ERR_RUN_HOURS_REGRESSION]"]
        distinguishing_aspect: "record-service reading is bounded both ways: below the schedule anchor (4000) -> ERR_RUN_HOURS_REGRESSION; above the facility max logged run-hours (4000) -> ERR_READING_EXCEEDS_LOGGED."
        test_recipe:
          setup: ["Facility ACTIVE; C1 at 4000; DRYER schedule interval 2000 (anchor 4000)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-RS", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /compressors/${c1}/log-run-hours", payload: { run_hours_total: 4000 }, as: ServiceTech }
            - { call: "POST /maintenance-schedules", payload: { facility_id: "${fac}", component: "DRYER", interval_hours: 2000 }, as: ContractManager, captures: { sched: "$.data.id" } }
          trigger:
            - { call: "POST /maintenance-schedules/${sched}/record-service", payload: { service_date: "2026-08-05", run_hours_reading: 4500 }, as: ServiceTech, captures: { err1: "$.data.error_id" } }
            - { call: "POST /maintenance-schedules/${sched}/record-service", payload: { service_date: "2026-08-05", run_hours_reading: 3000 }, as: ServiceTech, captures: { err2: "$.data.error_id" } }
            - { call: "POST /maintenance-schedules/${sched}/record-service", payload: { service_date: "2026-08-05", run_hours_reading: 4000 }, as: ServiceTech, captures: { anchor: "$.data.anchor_run_hours" } }
          assert:
            - "reading 4500 (> max logged 4000) rejected: ERR_READING_EXCEEDS_LOGGED (422)"
            - "reading 3000 (< anchor 4000) rejected: ERR_RUN_HOURS_REGRESSION (422)"
            - "reading exactly 4000 accepted (both bounds inclusive); anchor_run_hours == 4000"

      - name: corner_repair_budget_exceeded_and_exact_fit
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_REPAIR_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "The budget check is inclusive: quote 400001c against a 400000c budget is rejected while exactly 400000c commits (boundary == allowed)."
        test_recipe:
          setup: ["Two facilities ACTIVE: FA budget 400000 with VERIFIED survey and QUOTED tag QA (quote 400001); FB budget 400000 with QUOTED tag QB (quote 400000)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "FA-BUD", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 400000 }, as: DealerAdmin, captures: { facA: "$.data.id" } }
            - { call: "POST /facilities/${facA}/activate", as: DealerAdmin }
            - { call: "POST /leak-surveys", payload: { facility_id: "${facA}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { survA: "$.data.id" } }
            - { call: "POST /leak-surveys/${survA}/leak-tags", payload: { location_description: "a", cfm_loss: 5.0, repair_quote_cents: 400001 }, as: EnergyEngineer, captures: { tagA: "$.data.id" } }
            - { call: "POST /leak-surveys/${survA}/submit", as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys/${survA}/verify", as: EnergyEngineer, as_user_id: eng-2 }
            - { call: "POST /facilities", payload: { name: "FB-BUD", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 400000 }, as: DealerAdmin, captures: { facB: "$.data.id" } }
            - { call: "POST /facilities/${facB}/activate", as: DealerAdmin }
            - { call: "POST /leak-surveys", payload: { facility_id: "${facB}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { survB: "$.data.id" } }
            - { call: "POST /leak-surveys/${survB}/leak-tags", payload: { location_description: "b", cfm_loss: 5.0, repair_quote_cents: 400000 }, as: EnergyEngineer, captures: { tagB: "$.data.id" } }
            - { call: "POST /leak-surveys/${survB}/submit", as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys/${survB}/verify", as: EnergyEngineer, as_user_id: eng-2 }
          trigger:
            - { call: "POST /leak-tags/${tagA}/authorize-repair", as: FacilityManager, as_user_id: "${facA}", captures: { err: "$.data.error_id" } }
            - { call: "POST /leak-tags/${tagB}/authorize-repair", as: FacilityManager, as_user_id: "${facB}", captures: { stB: "$.data.status" } }
          assert:
            - "FA: error_id == ERR_REPAIR_BUDGET_EXCEEDED (400001 > 400000 budget)"
            - "FB: tag status == REPAIR_AUTHORIZED (exact-budget 400000 <= 400000 allowed)"
            - "GET /facilities/${facB} repair_committed_cents == 400000"

      - name: corner_empty_survey_submit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_EMPTY_SURVEY]"]
        distinguishing_aspect: "Submitting a survey with zero tags is rejected (empty-set edge); adding one tag then submitting succeeds."
        test_recipe:
          setup: ["Facility ACTIVE; DRAFT survey with no tags"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-ES", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /leak-surveys", payload: { facility_id: "${fac}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
          trigger:
            - { call: "POST /leak-surveys/${surv}/submit", as: EnergyEngineer, as_user_id: eng-1, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_EMPTY_SURVEY (422)"
            - "LeakSurvey.${surv}.status == DRAFT (unchanged)"

      - name: corner_authorize_before_survey_verify_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SURVEY_NOT_VERIFIED]"]
        distinguishing_aspect: "A QUOTED tag under a merely SUBMITTED survey cannot be authorized: cross-entity gate on LeakSurvey.status == VERIFIED."
        test_recipe:
          setup: ["Facility ACTIVE; survey SUBMITTED (tag QUOTED), never verified"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-SNV", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
