scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: demand_score_screening_vs_confirmed_diverge_on_one_program
        grounds:
          - calculations.program_demand_score
          - entities.Program.fields.demand_score_screening
          - entities.Program.fields.demand_score_confirmed
          - entities.Program.fields.prior_year_inquiry_volume
        distinguishing_aspect: |
          This dual-variant pair lives in the market-demand domain on Program: the
          SCREENING variant trusts projected_annual_enrollments (300) while the
          CONFIRMED variant caps it at prior_year_inquiry_volume * 0.10 (175), so the
          identical Program row carries demand_score_screening 74.50 and
          demand_score_confirmed 62.00 at the same instant.
        test_recipe:
          setup:
            - "Logical clock at the fixed default 2026-08-01T00:00:00Z."
            - "One Partnership 'Riverbend State University' / 'Cadence Online Partners', REVENUE_SHARE, term 84 months from 2026-08-01, PERIOD_STRAIGHT_LINE recognition, marketing budget 4000000 cents, exclusive on CIP 52.0201, bundled-services exception claimed, driven to status EXECUTED."
            - "No Program exists yet."
          setup_api_calls:
            - &c_clock_aug1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_ps_create
              call: "POST /partnerships"
              payload:
                university_name: "Riverbend State University"
                university_ipeds_id: "224554"
                partner_org_name: "Cadence Online Partners"
                contract_structure: "REVENUE_SHARE"
                term_months: 84
                effective_date: "2026-08-01"
                revenue_recognition_method: "PERIOD_STRAIGHT_LINE"
                marketing_budget_cents: 4000000
                exclusivity_cip_codes: ["52.0201"]
                bundled_services_exception_claimed: true
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ps_id: $.data.id }
            - &c_ps_submit
              call: "POST /partnerships/${ps_id}/contract-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_ps_execute
              call: "POST /partnerships/${ps_id}/contract-actions"
              payload: { action: "EXECUTE", executed_date: "2026-08-01" }
              as: UniversityProvost
              as_user_id: "provost-1"
          trigger:
            - &c_pg_create
              call: "POST /programs"
              payload:
                partnership_id: "${ps_id}"
                program_name: "MBA Online"
                cip_code: "52.0201"
                delivery_modality: "ASYNCHRONOUS"
                credential_level: "MASTERS"
                tuition_per_credit_cents: 62500
                credits_to_complete: 36
                enrollment_cap: 40
                projected_annual_enrollments: 300
                competitor_program_count: 3
                regional_wage_premium_pct: 25.0
                employer_partner_count: 2
                prior_year_inquiry_volume: 1750
                launch_window_start: "2026-08-01"
                launch_window_end: "2026-12-31"
                required_service_domains: ["MARKETING"]
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { pg_id: $.data.id }
          assert:
            - "Program.${pg_id}.demand_score_screening == 74.50"
            - "Program.${pg_id}.demand_score_confirmed == 62.00"
            - "Program.${pg_id}.demand_score_screening != Program.${pg_id}.demand_score_confirmed"
            - "Program.${pg_id}.status == DRAFT"
            - "Program.${pg_id}.blended_cac_cents == null"

      - name: recognition_variant_switch_restates_september_settlement
        grounds:
          - calculations.recognized_tuition_revenue
          - calculations.net_remittance_payable
          - entities.RemittanceStatement.fields.recognition_method_applied
          - entities.RemittanceStatement.fields.adjustment_delta_cents
          - state_machines.RemittanceStatement.DISPUTED_to_RESOLVED_ADJUSTED
        distinguishing_aspect: |
          This dual-variant pair lives in the revenue-accounting domain on
          RemittanceStatement / Enrollment, not on Program: the identical September
          period recognises 159198 cents under PERIOD_STRAIGHT_LINE (30 of 106 term
          days) and 187500 cents under MILESTONE_CHRONOLOGICAL (3 of 9 credits),
          moving net_payable_cents from 73919 to 87060 for an adjustment_delta_cents
          of exactly 13141.
        test_recipe:
          setup:
            - "The EXECUTED Partnership of the previous instance, PERIOD_STRAIGHT_LINE by default."
            - "Program 'MBA Online' LAUNCHED on 2026-08-01 with one APPROVED course and the MARKETING service domain assigned."
            - "One EnrollmentCounselor with an approved SALARY_PLUS_QUALITATIVE plan (annual base 6000000, variable 100000) and incentive_eligibility ELIGIBLE."
            - "One Enrollment of 9 credits at 62500 cents/credit (tuition_charged_cents 562500) for term 2026-09-01..2026-12-15, fully paid on 2026-09-05, ACTIVE, with credits_completed recorded as 3."
            - "One marketing SPEND of 300000 cents posted 2026-09-05, so Partnership.unrecouped_marketing_spend_cents == 300000."
            - "Logical clock advanced to 2026-10-01T00:00:00Z and a September statement cut in status CALCULATED under PERIOD_STRAIGHT_LINE."
          setup_api_calls:
            - *c_clock_aug1
            - *c_ps_create
            - *c_ps_submit
            - *c_ps_execute
            - *c_pg_create
            - &c_course_create
              call: "POST /programs/${pg_id}/courses"
              payload:
                course_code: "MBA-501"
                title: "Foundations of Analytics"
                credits: 3
                content_owner: "UNIVERSITY"
                design_cost_cents: 1500000
                required_for_launch: true
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { c1_id: $.data.id }
            - &c_course_start
              call: "POST /courses/${c1_id}/design-actions"
              payload: { action: "START_DESIGN" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_course_submit
              call: "POST /courses/${c1_id}/design-actions"
              payload: { action: "SUBMIT_FOR_FACULTY_REVIEW" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_course_approve
              call: "POST /courses/${c1_id}/design-actions"
              payload: { action: "APPROVE", faculty_approver_name: "Dr. Imani Osei" }
              as: FacultyChair
              as_user_id: "faculty-1"
            - &c_scope_marketing
              call: "POST /programs/${pg_id}/service-scope-assignments"
              payload: { service_domain: "MARKETING", responsible_party: "PARTNER", sla_response_hours: 24, cost_bearer: "PARTNER" }
              as: UniversityProvost
              as_user_id: "provost-1"
            - &c_scope_counseling
              call: "POST /programs/${pg_id}/service-scope-assignments"
              payload: { service_domain: "ENROLLMENT_COUNSELING", responsible_party: "PARTNER", sla_response_hours: 24, cost_bearer: "PARTNER" }
              as: UniversityProvost
              as_user_id: "provost-1"
            - &c_pg_submit
              call: "POST /programs/${pg_id}/lifecycle-actions"
              payload: { action: "SUBMIT" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_pg_approve
              call: "POST /programs/${pg_id}/lifecycle-actions"
              payload: { action: "APPROVE" }
              as: UniversityProvost
              as_user_id: "provost-1"
            - &c_pg_launch
              call: "POST /programs/${pg_id}/lifecycle-actions"
              payload: { action: "LAUNCH" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_co_create
              call: "POST /enrollment-counselors"
              payload: { partnership_id: "${ps_id}", full_name: "Rosa Vento", employer: "PARTNER", monthly_base_salary_cents: 500000 }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { co_id: $.data.id }
            - &c_co_plan
              call: "POST /enrollment-counselors/${co_id}/compensation-plan"
              payload: { comp_plan_type: "SALARY_PLUS_QUALITATIVE", annual_base_cents: 6000000, variable_component_cents: 100000, variable_basis: "QUALITATIVE_MULTI_FACTOR" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_co_review_approve
              call: "POST /enrollment-counselors/${co_id}/compliance-review"
              payload: { decision: "APPROVE", reviewer_note: "Qualitative multi-factor plan under the bundled-services exception." }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - &c_lead_create
              call: "POST /leads"
              payload: { program_id: "${pg_id}", counselor_id: "${co_id}", source_channel: "PAID_SEARCH", prospect_external_id: "P-1001" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { ld_id: $.data.id }
            - &c_lead_contact
              call: "POST /leads/${ld_id}/advance"
              payload: { action: "CONTACT", hours_to_first_contact: 6 }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_lead_apply
              call: "POST /leads/${ld_id}/advance"
              payload: { action: "APPLY" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_enroll
              call: "POST /leads/${ld_id}/enroll"
              payload: { student_external_id: "S-2001", credits_enrolled: 9, term_start_date: "2026-09-01", term_end_date: "2026-12-15" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { en_id: $.data.id }
            - &c_clock_sep5
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - &c_pay_full
              call: "POST /enrollments/${en_id}/tuition-payments"
              payload: { entry_type: "PAYMENT", amount_cents: 562500, posted_date: "2026-09-05", reference_note: "Fall 2026 term payment in full" }
              as: UniversityBursar
              as_user_id: "bursar-1"
            - &c_progress_3
              call: "POST /enrollments/${en_id}/academic-actions"
              payload: { action: "RECORD_PROGRESS", credits_completed: 3 }
              as: UniversityProvost
              as_user_id: "provost-1"
            - &c_spend_300k
              call: "POST /programs/${pg_id}/marketing-spend-entries"
              payload: { entry_type: "SPEND", channel: "PAID_SEARCH", amount_cents: 300000, spend_date: "2026-09-05" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_clock_oct1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_get_ps_v
              call: "GET /partnerships/${ps_id}"
              payload: {}
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { ps_v: $.data.version }
            - &c_stmt_sept
              call: "POST /partnerships/${ps_id}/remittance-statements"
              payload: { period_start: "2026-09-01", period_end: "2026-09-30", expected_partnership_version: "${ps_v}" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /remittance-statements/${st_id}/actions"
              payload: { action: "DISPUTE", dispute_reason: "Straight-line accrual overstates the partner's earned share for a term that is only three credits complete." }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - call: "POST /remittance-statements/${st_id}/actions"
              payload: { action: "RESOLVE", recognition_method_override: "MILESTONE_CHRONOLOGICAL", adjustment_note: "Restated on the milestone basis for the September period." }
              as: UniversityBursar
              as_user_id: "bursar-1"
          assert:
            - "RemittanceStatement.${st_id}.recognition_method_applied == MILESTONE_CHRONOLOGICAL"
            - "RemittanceStatement.${st_id}.recognized_revenue_cents == 187500"
            - "RemittanceStatement.${st_id}.share_gross_cents == 107813"
            - "RemittanceStatement.${st_id}.marketing_recoupment_cents == 16171"
            - "RemittanceStatement.${st_id}.subtotal_cents == 91642"
            - "RemittanceStatement.${st_id}.holdback_cents == 4582"
            - "RemittanceStatement.${st_id}.net_payable_cents == 87060"
            - "RemittanceStatement.${st_id}.adjustment_delta_cents == 13141"
            - "RemittanceStatement.${st_id}.status == RESOLVED_ADJUSTED"

  - rule_id: combinatorial_formula
    instances:
      - name: partner_share_rounds_each_recognition_line_before_summing
        grounds:
          - calculations.partner_share_gross
          - calculations.recognized_tuition_revenue
          - entities.RemittanceStatement.fields.share_gross_cents
          - entities.RemittanceStatement.fields.line_count
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the cents: two milestone
          recognition lines of 187500 and 62500 at the 0.575 marginal rate round per
          line to 107813 + 35938 = 143751, whereas the forbidden sum-then-round order
          yields 143750; the scaffold pins per-line rounding and the assertion
          discriminates the two orders by exactly one cent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, then advanced as noted."
            - "One EXECUTED Partnership configured MILESTONE_CHRONOLOGICAL, marketing budget 4000000 cents, exclusive on CIP 52.0201, bundled-services exception claimed."
            - "One LAUNCHED Program 'MBA Online' with one APPROVED course, MARKETING scope assigned, tuition 62500 cents/credit, cap 40."
            - "One counselor with an APPROVED qualitative plan and incentive_eligibility ELIGIBLE."
            - "Two Enrollments created in this order, both 9 credits for term 2026-09-01..2026-12-15 and both fully paid on 2026-09-05: S-2001 with credits_completed 3 (milestone base 187500) and S-2002 with credits_completed 1 (milestone base 62500)."
            - "One marketing SPEND of 300000 cents so unrecouped_marketing_spend_cents == 300000."
            - "Logical clock advanced to 2026-10-01T00:00:00Z; no statement exists yet."
          setup_api_calls:
            - *c_clock_aug1
            - &c_ps_create_milestone
              call: "POST /partnerships"
              payload:
                university_name: "Riverbend State University"
                university_ipeds_id: "224554"
                partner_org_name: "Cadence Online Partners"
                contract_structure: "REVENUE_SHARE"
                term_months: 84
                effective_date: "2026-08-01"
                revenue_recognition_method: "MILESTONE_CHRONOLOGICAL"
                marketing_budget_cents: 4000000
                exclusivity_cip_codes: ["52.0201"]
                bundled_services_exception_claimed: true
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ps_id: $.data.id }
            - *c_ps_submit
            - *c_ps_execute
            - *c_pg_create
            - *c_course_create
            - *c_course_start
            - *c_course_submit
            - *c_course_approve
            - *c_scope_marketing
            - *c_pg_submit
            - *c_pg_approve
            - *c_pg_launch
            - *c_co_create
            - *c_co_plan
            - *c_co_review_approve
            - *c_lead_create
            - *c_lead_contact
            - *c_lead_apply
            - *c_enroll
            - &c_lead2_create
              call: "POST /leads"
              payload: { program_id: "${pg_id}", counselor_id: "${co_id}", source_channel: "PAID_SOCIAL", prospect_external_id: "P-1002" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { ld2_id: $.data.id }
            - &c_lead2_contact
              call: "POST /leads/${ld2_id}/advance"
              payload: { action: "CONTACT", hours_to_first_contact: 9 }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_lead2_apply
              call: "POST /leads/${ld2_id}/advance"
              payload: { action: "APPLY" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_enroll2
              call: "POST /leads/${ld2_id}/enroll"
              payload: { student_external_id: "S-2002", credits_enrolled: 9, term_start_date: "2026-09-01", term_end_date: "2026-12-15" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { en2_id: $.data.id }
            - *c_clock_sep5
            - *c_pay_full
            - *c_progress_3
            - &c_pay2_full
              call: "POST /enrollments/${en2_id}/tuition-payments"
              payload: { entry_type: "PAYMENT", amount_cents: 562500, posted_date: "2026-09-05", reference_note: "Fall 2026 term payment in full" }
              as: UniversityBursar
              as_user_id: "bursar-1"
            - &c_progress2_1
              call: "POST /enrollments/${en2_id}/academic-actions"
              payload: { action: "RECORD_PROGRESS", credits_completed: 1 }
              as: UniversityProvost
              as_user_id: "provost-1"
            - *c_spend_300k
            - *c_clock_oct1
            - *c_get_ps_v
          trigger:
            - call: "POST /partnerships/${ps_id}/remittance-statements"
              payload: { period_start: "2026-09-01", period_end: "2026-09-30", expected_partnership_version: "${ps_v}" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { st2_id: $.data.id }
          assert:
            - "RemittanceStatement.${st2_id}.line_count == 2"
            - "RemittanceStatement.${st2_id}.recognized_revenue_cents == 250000"
            - "RemittanceStatement.${st2_id}.share_gross_cents == 143751"
            - "RemittanceStatement.${st2_id}.share_gross_cents != 143750"
            - "RemittanceStatement.${st2_id}.marketing_recoupment_cents == 21562"
            - "RemittanceStatement.${st2_id}.subtotal_cents == 122189"
            - "RemittanceStatement.${st2_id}.holdback_cents == 6109"
            - "RemittanceStatement.${st2_id}.net_payable_cents == 116080"

      - name: net_payable_order_caps_recoupment_on_gross_then_tiers_holdback_on_subtotal
        grounds:
          - calculations.net_remittance_payable
          - entities.RemittanceStatement.fields.marketing_recoupment_cents
          - entities.RemittanceStatement.fields.holdback_pct
          - entities.Partnership.fields.unrecouped_marketing_spend_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency whose evaluation order is pinned:
          the recoupment cap is floor(share_gross_cents * 0.15) = 13730 computed on
          gross (not the 11671 that capping on subtotal would give), while the holdback
          tier is selected from subtotal_cents AFTER recoupment, so the September
          statement lands on marketing_recoupment_cents 13730, holdback_pct 0.05 and
          net_payable_cents 73919.
        test_recipe:
          setup:
            - "Exactly the state of recognition_variant_switch_restates_september_settlement immediately before its trigger: PERIOD_STRAIGHT_LINE Partnership, one fully paid 9-credit Enrollment, 300000 cents of unrecouped marketing spend, clock at 2026-10-01T00:00:00Z."
            - "No statement exists yet for September 2026."
          setup_api_calls:
            - *c_clock_aug1
            - *c_ps_create
            - *c_ps_submit
            - *c_ps_execute
            - *c_pg_create
            - *c_course_create
            - *c_course_start
            - *c_course_submit
            - *c_course_approve
            - *c_scope_marketing
            - *c_pg_submit
            - *c_pg_approve
            - *c_pg_launch
            - *c_co_create
            - *c_co_plan
            - *c_co_review_approve
            - *c_lead_create
            - *c_lead_contact
            - *c_lead_apply
            - *c_enroll
            - *c_clock_sep5
            - *c_pay_full
            - *c_spend_300k
            - *c_clock_oct1
            - *c_get_ps_v
          trigger:
            - call: "POST /partnerships/${ps_id}/remittance-statements"
              payload: { period_start: "2026-09-01", period_end: "2026-09-30", expected_partnership_version: "${ps_v}" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { st3_id: $.data.id }
          assert:
            - "RemittanceStatement.${st3_id}.recognition_method_applied == PERIOD_STRAIGHT_LINE"
            - "RemittanceStatement.${st3_id}.recognized_revenue_cents == 159198"
            - "RemittanceStatement.${st3_id}.share_gross_cents == 91539"
            - "RemittanceStatement.${st3_id}.marketing_recoupment_cents == 13730"
            - "RemittanceStatement.${st3_id}.marketing_recoupment_cents != 11671"
            - "RemittanceStatement.${st3_id}.subtotal_cents == 77809"
            - "RemittanceStatement.${st3_id}.holdback_pct == 0.05"
            - "RemittanceStatement.${st3_id}.holdback_cents == 3890"
            - "RemittanceStatement.${st3_id}.net_payable_cents == 73919"
            - "RemittanceStatement.${st3_id}.status == CALCULATED"

  - rule_id: non_linear_state_machine
    instances:
      - name: counselor_parallel_dimensions_advance_independently
        grounds:
          - state_machines.EnrollmentCounselor.performance:MEETS_STANDARD_to_performance:WATCH|PROBATION
          - state_machines.EnrollmentCounselor.incentive:PENDING_COMPLIANCE_REVIEW|ELIGIBLE_to_incentive:SUSPENDED
          - calculations.counselor_conversion_performance
          - entities.EnrollmentCounselor.fields.performance_status
          - entities.EnrollmentCounselor.fields.incentive_eligibility
        distinguishing_aspect: |
          The non-linear shape here is PARALLEL STATE DIMENSIONS on EnrollmentCounselor:
          a performance run moves performance_status NOT_RATED -> WATCH while
          incentive_eligibility stays ELIGIBLE, and a subsequent compliance SUSPEND moves
          incentive_eligibility ELIGIBLE -> SUSPENDED while performance_status stays WATCH
          — neither dimension reads or writes the other.
        test_recipe:
          setup:
            - "EXECUTED Partnership, LAUNCHED Program 'MBA Online' with MARKETING and ENROLLMENT_COUNSELING scope (SLA 24 hours)."
            - "One counselor Rosa Vento with an APPROVED qualitative plan; performance_status NOT_RATED, incentive_eligibility ELIGIBLE, last_review_user_id 'auditor-1'."
            - "Four Leads created on 2026-08-01 for that counselor: P-1001 contacted at 6 hours then APPLIED then ENROLLED; P-1002 contacted at 30 hours; P-1003 contacted at 40 hours; P-1004 contacted at 9 hours. rated_lead_count 4, enrolled_lead_count 1, sla_breach_count 2."
          setup_api_calls:
            - *c_clock_aug1
            - *c_ps_create
            - *c_ps_submit
            - *c_ps_execute
            - *c_pg_create
            - *c_course_create
            - *c_course_start
            - *c_course_submit
            - *c_course_approve
            - *c_scope_marketing
            - *c_scope_counseling
            - *c_pg_submit
            - *c_pg_approve
            - *c_pg_launch
            - *c_co_create
            - *c_co_plan
            - *c_co_review_approve
            - *c_lead_create
            - *c_lead_contact
            - *c_lead_apply
            - *c_enroll
            - *c_lead2_create
            - &c_lead2_contact_late
              call: "POST /leads/${ld2_id}/advance"
              payload: { action: "CONTACT", hours_to_first_contact: 30 }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_lead3_create
              call: "POST /leads"
              payload: { program_id: "${pg_id}", counselor_id: "${co_id}", source_channel: "ORGANIC", prospect_external_id: "P-1003" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { ld3_id: $.data.id }
            - &c_lead3_contact_late
              call: "POST /leads/${ld3_id}/advance"
              payload: { action: "CONTACT", hours_to_first_contact: 40 }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &c_lead4_create
              call: "POST /leads"
