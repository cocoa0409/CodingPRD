  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: adoption_confirm_gated_by_family_state
        grounds:
          - state_machines.Adoption.PLEDGED_to_CONFIRMED
          - entities.Family.fields.status
        distinguishing_aspect: |
          Entity pair = Adoption -> Family. Adoption confirm is rejected when
          the linked family has left VERIFIED (e.g. moved to WITHDRAWN between
          pledge and confirm), even though the adoption row itself is still
          PLEDGED and otherwise valid.
        test_recipe:
          setup:
            - "adoption AD in PLEDGED for family F"
            - "before confirm, caseworker withdraws F (VERIFIED -> WITHDRAWN) — but AD pledge exists, so withdraw precondition fails"
            - "use a different route: reject F via duplicate-flag confirm (UNDER_REVIEW -> REJECTED not applicable since F is VERIFIED)"
            - "instead: create adoption against F, then admin-cancel the campaign's other dependencies; simpler path: attempt confirm after family has been auto-transitioned out of VERIFIED by campaign intake close (but F is already VERIFIED so it survives close)"
            - "final chosen path: F is VERIFIED, AD is PLEDGED; F is then matched by a different concurrent adoption AD2 confirmed first -> F moves to MATCHED; now AD confirm against F (no longer VERIFIED) must fail"
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0, privacy_mode: "STRICT" }
              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/agencies"
              payload: { agency_code: "AG13", legal_name: "Agency Thirteen", referral_quota: 50, contact_email: "a13@x.org" }
              as: PlatformAdmin
              captures:
                ag_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "P", caregiver_dob: "1988-01-01", household_size: 2, address_text: "1 X", phone_last4: "8001" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                fam_id: "$.data.id"
            - call: "POST /toy-drive/families/${fam_id}/children"
              payload: { first_name: "c", dob: "2020-01-01", gender: "X", clothing_size: "5T", interest_tags: [] }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
            - call: "POST /toy-drive/families/${fam_id}/begin-review"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
            - call: "POST /toy-drive/families/${fam_id}/verify"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_2"
            - call: "POST /toy-drive/donors"
              payload: { email: "dA@x.com", display_name: "DA", max_adoptions_per_season: 5, thank_you_opt_in: false }
              as: PlatformAdmin
              captures:
                donor_a: "$.data.id"
            - call: "POST /toy-drive/donors"
              payload: { email: "dB@x.com", display_name: "DB", max_adoptions_per_season: 5, thank_you_opt_in: false }
              as: PlatformAdmin
              captures:
                donor_b: "$.data.id"
            - call: "GET /toy-drive/families/${fam_id}"
              payload: {}
              as: PlatformAdmin
              captures:
                fam_v1: "$.data.version"
            # Donor A pledges first (this bumps family.version)
            - call: "POST /toy-drive/adoptions"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_a}", family_id: "${fam_id}", scope: "WHOLE_FAMILY", expected_family_version: "${fam_v1}" }
              as: Donor
              as_user_id: "${donor_a}"
              captures:
                ad_a: "$.data.id"
            # Donor B pledges against the now-stale version — must fail OCC
            # (we instead re-fetch to keep this setup chain passing lint)
            - call: "GET /toy-drive/families/${fam_id}"
              payload: {}
              as: PlatformAdmin
              captures:
                fam_v2: "$.data.version"
            - call: "POST /toy-drive/adoptions"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_b}", family_id: "${fam_id}", scope: "WHOLE_FAMILY", expected_family_version: "${fam_v2}" }
              as: Donor
              as_user_id: "${donor_b}"
              captures:
                ad_b: "$.data.id"
            # Donor A confirms first -> family -> MATCHED
            - call: "POST /toy-drive/adoptions/${ad_a}/confirm"
              payload: {}
              as: Donor
              as_user_id: "${donor_a}"
          trigger:
