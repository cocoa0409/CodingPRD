            - "${dev_status} == \"RETIRED\" and ${dev_reason} == null"
            - "the qc-unlock returns HTTP 409 with ${err_unlock} == \"ERR_INVALID_STATE\" (priority 50 - not ERR_DEVICE_QC_LOCKED, which does not apply to qc-unlock)"
            - "the test-result returns HTTP 409 with ${err_result} == \"ERR_DEVICE_QC_LOCKED\" (priority 41 fires before any 422 rule)"
