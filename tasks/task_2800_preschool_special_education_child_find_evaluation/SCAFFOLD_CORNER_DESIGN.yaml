              payload: { notice_language_code: "en", notice_delivery_method: "EMAIL" }
              as: ChildFindCoordinator
          assert:
            - "first response.status_code == 409"
            - "first response.data.error_id == \"ERR_CONSENT_ALREADY_REQUESTED\""
            - "second response.status_code == 409"
            - "second response.data.error_id == \"ERR_CONSENT_ALREADY_REQUESTED\""
            - "third response.status_code == 409"
            - "third response.data.error_id == \"ERR_INVALID_REFERRAL_STATE\""
            - "Referral.${referralA_id}.intake_status == \"CONSENT_PENDING\""
            - "Referral.${referralB_id}.intake_status == \"EVALUATION_AUTHORIZED\""
            - "Referral.${referralC_id}.intake_status == \"DECLINED\""
