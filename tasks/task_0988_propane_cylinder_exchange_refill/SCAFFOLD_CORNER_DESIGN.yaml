              captures: { t2: $.data.id }
            - call: "POST /certification-records"
              payload: { cylinder_id: "${c_id}", method: VISUAL, outcome: CONDEMN }
              as: Technician
              as_user_id: "${t1}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /certification-records/${r_id}/confirm"
              payload: {}
              as: Technician
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
            - call: "POST /certification-records/${r_id}/confirm"
              payload: {}
              as: Technician
              as_user_id: "${t2}"
              captures: { r_st: $.data.status, r_conf: $.data.confirmer_technician_id }
          assert:
            - "same-technician confirm: error_id == ERR_SEGREGATION_OF_DUTIES; http status 403"
            - "second-technician confirm: status == CONFIRMED; confirmer_technician_id == ${t2}"

      - name: resolve_session_by_shift_clerk_segregation
        claim_type: rbac_denial
        grounds:
          - state_machines.ReconciliationSession.ESCALATED_to_RESOLVED
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The resolver's X-User-ID must differ from session.clerk_id: resolving with the shift clerk's id gets 403 ERR_SEGREGATION_OF_DUTIES even under the PlatformAdmin role."
        test_recipe:
          setup: ["site S; session by clerk-1 VARIANCE_FLAGGED (cash over 600) then ESCALATED by PlatformAdmin"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${s_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { rs_id: $.data.id }
            - call: "POST /reconciliation-sessions/${rs_id}/count"
              payload: { counted_cash_cents: 20600, counted_full_cylinders: 0, counted_empty_cylinders: 0 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /reconciliation-sessions/${rs_id}/escalate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /reconciliation-sessions/${rs_id}/resolve"
              payload: { resolution_note: "counted twice" }
              as: PlatformAdmin
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
            - call: "POST /reconciliation-sessions/${rs_id}/resolve"
              payload: { resolution_note: "recount accepted, training logged" }
              as: PlatformAdmin
              as_user_id: "admin-9"
              captures: { rs_st: $.data.status, rs_by: $.data.resolved_by }
          assert:
            - "resolver == clerk_id: error_id == ERR_SEGREGATION_OF_DUTIES; http status 403"
            - "different resolver: status == RESOLVED; resolved_by == admin-9"

      - name: host_manager_disputes_own_finalized_statement
        claim_type: rbac_positive
        grounds:
          - state_machines.CommissionStatement.FINALIZED_to_DISPUTED
          - roles
        distinguishing_aspect: "HostSiteManager with X-User-ID equal to the site id may dispute its own FINALIZED statement (loop back for re-finalization)."
        test_recipe:
          setup: ["site S with policy; no sales; session BALANCED for 2026-05-01; clock 2026-05-02; statement FINALIZED"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${s_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { rs_id: $.data.id }
            - call: "POST /reconciliation-sessions/${rs_id}/count"
              payload: { counted_cash_cents: 20000, counted_full_cylinders: 0, counted_empty_cylinders: 0 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /commission-statements"
              payload: { site_id: "${s_id}", period_start: "2026-05-01", period_end: "2026-05-01" }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /commission-statements/${st_id}/finalize"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /commission-statements/${st_id}/dispute"
              payload: { note: "leak day should be excluded" }
              as: HostSiteManager
              as_user_id: "${s_id}"
              captures: { st_st: $.data.status, st_note: $.data.dispute_note }
          assert:
            - "status == DISPUTED; dispute_note == 'leak day should be excluded'"

  # ================================================== Cross-Cutting Complexity Layers
  - section: cross_cutting_layers
    instances:
      - name: occ_restock_run_create_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[restock-run-create-stale-site]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a first run create bumps the site version, a second create carrying the pre-create version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["site S; driver D; run1 created against version ${s_v}"]
          setup_api_calls:
            - call: "POST /drivers"
              payload: { name: "D", license_number: "CDL-O1", dot_medical_expires_on: "2027-01-01", vehicle_max_payload_lbs: 2000 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /restock-runs"
              payload: { site_id: "${s_id}", driver_id: "${d_id}", planned_date: "2026-05-20", expected_site_version: "${s_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /restock-runs"
              payload: { site_id: "${s_id}", driver_id: "${d_id}", planned_date: "2026-05-21", expected_site_version: "${s_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION; http status 412 (site version advanced to 2 by the first create)"

      - name: occ_pricing_policy_create_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pricing-policy-create-stale-site]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a first policy create bumps the site version, a second policy create carrying the stale version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["site S; policy P1 created against version ${s_v}"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2599, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-06-01", supersede_current: true }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION; http status 412"

      - name: occ_site_patch_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[site-config-patch-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A PATCH with an expected_site_version that no longer matches (an earlier PATCH already advanced it) is rejected 412 ERR_STALE_VERSION; the version increments on every accepted write."
        test_recipe:
          setup: ["site S at version 1; one accepted PATCH (par change) moves it to 2"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "PATCH /sites/${s_id}"
              payload: { expected_site_version: "${s_v}", par_level_full: 10 }
              as: PlatformAdmin
              captures: { s_v2: $.data.version }
          trigger:
            - call: "PATCH /sites/${s_id}"
              payload: { expected_site_version: "${s_v}", par_level_full: 8 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH: version == 2"
            - "stale PATCH: error_id == ERR_STALE_VERSION; http status 412"

      - name: idempotent_exchange_create_replay
        claim_type: idempotency
        grounds:
          - entities.ExchangeOrder.fields.idempotency_key
          - errors[ERR_IDEMPOTENCY_CONFLICT]
        distinguishing_aspect: "Same clerk + same key + same payload returns the ORIGINAL order (no duplicate, no new sale_seq); same key with a different payload fails ERR_IDEMPOTENCY_CONFLICT."
        test_recipe:
          setup: ["site S with policy and 2 FULL fleet cylinders; 1 EMPTY customer cylinder"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-I1", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-I2", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { cc_id: $.data.id }
          trigger:
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}", idempotency_key: "K-1" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o1_id: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}", idempotency_key: "K-1" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o2_id: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}", returned_cylinder_id: "${cc_id}", idempotency_key: "K-1" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "replay: second response id == first response id (same order returned, exactly one row exists)"
            - "different payload with same key: error_id == ERR_IDEMPOTENCY_CONFLICT; http status 409"

      - name: restock_alert_floor_threshold_inclusive
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.site_sales_posture
          - entities.HostSite.fields.restock_alert
        distinguishing_aspect: "restock_alert uses an inclusive floor: full_on_hand 7 with floor 6 -> false; after one quarantine 6 -> true."
        test_recipe:
          setup: ["site S (par 12, floor 6) with 7 FULL fleet cylinders"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /cylinders"
              payload: { serial_number: "SN-T1", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { serial_number: "SN-T2", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-T3", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-T4", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-T5", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-T6", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-T7", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "GET /sites/${s_id}"
              as: PlatformAdmin
              captures: { al_pre: $.data.restock_alert }
          trigger:
            - call: "POST /cylinders/${c1_id}/quarantine"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /sites/${s_id}"
              as: PlatformAdmin
              captures: { al_post: $.data.restock_alert, full_post: $.data.full_on_hand }
          assert:
            - "before: restock_alert == false (7 > 6)"
            - "after quarantine: full_on_hand == 6 and restock_alert == true (6 <= 6 inclusive)"

      - name: leak_cascade_side_effects_stub
        claim_type: cascading_side_effects
        grounds:
          - state_machines.LeakReport.REPORTED_to_CONFIRMED
        excluded_because:
          difficulty_instance: leak_confirm_quarantine_chain
          rationale: "N-level cascade verified end-to-end by the named §1.8 instance."
      - name: dual_variant_calculations_stub
        claim_type: dual_variant_calculation
        grounds:
          - calculations.reconciliation_expected_cash
          - calculations.commission_settlement
        excluded_because:
          difficulty_instance: reconciliation_opening_baseline_book_vs_physical
          rationale: "Both variants asserted with divergence (also commission_base_gross_vs_net for the commission variant pair)."

  # ================================================== Consistency Model
  - section: consistency_model
    instances:
      - name: refund_side_effects_immediately_visible
        claim_type: immediate_consistency
        grounds:
          - state_machines.ExchangeOrder.COMPLETED_to_REFUNDED
          - calculations.site_cage_counts
        distinguishing_aspect: "Immediate consistency: the refund response shows REFUNDED, and the very next reads show the issued cylinder QUARANTINED at the site and quarantined_on_hand incremented — no eventual lag."
        test_recipe:
          setup: ["site S with policy, 1 FULL fleet, order completed same day (no session)"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "SN-RV", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_id: $.data.id }
            - call: "POST /exchange-orders/${o_id}/complete"
              payload: { payment_cash_cents: 6494 }
              as: SiteClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /exchange-orders/${o_id}/refund"
              payload: {}
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_st: $.data.status, o_ron: $.data.refunded_on }
            - call: "GET /cylinders/${c_id}"
              as: PlatformAdmin
              captures: { c_fill: $.data.fill_status, c_site: $.data.current_site_id }
            - call: "GET /sites/${s_id}"
              as: PlatformAdmin
              captures: { s_q: $.data.quarantined_on_hand }
          assert:
            - "refund response: status == REFUNDED; refunded_on == 2026-05-01"
            - "cylinder immediately: fill_status == QUARANTINED; current_site_id == ${s_id}"
            - "site immediately: quarantined_on_hand == 1"
