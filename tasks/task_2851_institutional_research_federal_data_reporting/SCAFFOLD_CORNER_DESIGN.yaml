      - name: corner_err_data_request_lifecycle_rejects_every_out_of_order_step
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_INVALID_DATA_REQUEST_STATE]
          - state_machines.DataRequest.RECEIVED_to_SCREENED
          - state_machines.DataRequest.SCREENED_to_RELEASED
