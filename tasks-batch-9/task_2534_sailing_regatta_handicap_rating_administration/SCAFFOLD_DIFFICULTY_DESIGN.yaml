      - name: accept_with_expired_safety_and_band_mismatch_returns_safety_first
        higher_priority_rule: "validations priority 18, ERR_CREW_SAFETY_COURSE_EXPIRED, category business_safety, 422"
        lower_priority_rule: "validations priority 28, ERR_DIVISION_BAND_MISMATCH, category business_constraint, 422"
        grounds:
          - validations.priority_18_ERR_CREW_SAFETY_COURSE_EXPIRED
          - validations.priority_28_ERR_DIVISION_BAND_MISMATCH
          - endpoints.POST_entries_id_accept
          - state_machines.Division.status.PROVISIONAL_to_MERGED
          - calculations.division_merge_target_selection
        distinguishing_aspect: |
          A different error-category pair from the first instance: business_safety over
          business_constraint, and both members carry the SAME HTTP status 422, so an implementation
          cannot get the ordering right by accident from the status code alone. The band mismatch is
          manufactured without ever editing a band: the entry is legitimately assigned to the NARROW
          division, then NARROW is merged into WIDE, and division_merge_target_selection never checks
          that the migrating entry fits the target band. The two triggers differ only in the safety
          expiry of one crew member, so the same accept call flips from ERR_CREW_SAFETY_COURSE_EXPIRED to
          ERR_DIVISION_BAND_MISMATCH, proving both rules were live on the same request.
