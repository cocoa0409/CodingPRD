              as: PlatformAdmin
            - call: "POST /return-cases"
              payload: { order_id: "${order_id}", reason_code: "COMFORT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rc_id: $.data.id }
            - call: "POST /pickup-routes"
              payload: { region_code: "CA", route_date: "2026-09-15", window_start_at: "2026-09-15T08:00:00Z", window_end_at: "2026-09-15T18:00:00Z", capacity_units: 6 }
              as: LogisticsCoordinator
              captures: { route_id: $.data.id, route_v_draft: $.data.version }
          trigger:
            - call: "POST /pickup-appointments"
              payload: { route_id: "${route_id}", return_case_id: "${rc_id}", slot_start_at: "2026-09-15T09:00:00Z", slot_end_at: "2026-09-15T11:00:00Z", expected_pickup_route_version: "${route_v_draft}" }
