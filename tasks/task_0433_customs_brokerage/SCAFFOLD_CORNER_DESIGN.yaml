              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-CORNER-VA02", vessel_eta: "2026-06-11T00:00:00Z", data_element_count: 10 }
              as: LicensedBroker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE"
            - "http status == 409"

      - name: bond_importer_mismatch_on_entry_create_rejected
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=7]
          - errors[ERR_BOND_IMPORTER_MISMATCH]
          - entities.CustomsEntry.fields.bond_id
        distinguishing_aspect: "Creating an entry whose bond_id belongs to a DIFFERENT importer than importer_id is rejected ERR_BOND_IMPORTER_MISMATCH (422)."
        test_recipe:
          setup:
            - "Importer A with bond A; Importer B (entry importer) with no bond of its own."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Importer A", ior_number: "IOR-CORNER-VA03A", owner_user_id: "imp-user-a" }
              as: AccountAdmin
              captures: { imp_a: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_a}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_a: $.data.id }
            - call: "POST /importers"
              payload: { name: "Importer B", ior_number: "IOR-CORNER-VA03B", owner_user_id: "imp-user-b" }
              as: AccountAdmin
              captures: { imp_b: $.data.id }
          trigger:
            - call: "POST /entries"
              payload: { importer_id: "${imp_b}", bond_id: "${bond_a}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BOND_IMPORTER_MISMATCH"
            - "http status == 422"

      - name: entry_date_precedes_manifest_cutoff_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=11]
          - errors[ERR_ENTRY_PRECEDES_MANIFEST]
          - calculations.compute_entry_charges
        distinguishing_aspect: "Filing an entry whose entry_date (2026-06-08T00:00:00Z) is earlier than vessel_eta(2026-06-10T00:00:00Z) - ISF_CUTOFF_HOURS(24h) = 2026-06-09T00:00:00Z is rejected ERR_ENTRY_PRECEDES_MANIFEST (422)."
        test_recipe:
          setup:
