            - "ParticipationReport.${rep_id}.status == VERIFIED"
            - "ParticipationReport.${rep_id}.verified_hours == 20"
            - "ParticipationReport.${rep_id}.core_hours_credited == 20"
            - "ParticipationReport.${rep_id}.non_core_hours_credited == 0"
            - "WorkAssignment.${wa_id}.cumulative_verified_hours == 20"
            - "WorkAssignment.${wa_id}.compliance_flag == SHORTFALL"

      - name: unverified_recurring_income_is_excluded_from_prospective_budgeting
        claim_type: input_set_filtering
        grounds:
          - calculations.countable_income_determination
          - entities.IncomeSource.fields.verification_status
          - endpoints[POST /applications/{id}/determine]
        distinguishing_aspect: |
          The PROSPECTIVE pipeline includes only VERIFIED recurring rows, so a
          30000 UNVERIFIED row is dropped entirely and countable_income_cents is
          14000 rather than 29000; the resulting benefit is 29750.
        test_recipe:
          setup:
            - "A SINGLE_PARENT household of size 3 has a RECEIVED PROSPECTIVE 2026-08 application."
            - "It has one VERIFIED recurring EARNED source of 40000 and one UNVERIFIED recurring EARNED source of 30000."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Filtering Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 40000, month_1_cents: 40000, month_2_cents: 40000, month_3_cents: 40000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_v_id: $.data.id }
            - call: "POST /income-sources/${inc_v_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 30000, month_1_cents: 30000, month_2_cents: 30000, month_3_cents: 30000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_u_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "HTTP status == 200"
            - "IncomeSource.${inc_u_id}.verification_status == UNVERIFIED"
            - "Application.${app_id}.countable_income_cents == 14000"
            - "Application.${app_id}.determined_benefit_cents == 29750"
            - "Application.${app_id}.status == DETERMINED"
            - "GET /applications/${app_id}/income-sources?verification_status=VERIFIED returns total_count 1"

      - name: payment_standard_extends_by_the_additional_person_amount_above_size_six
        claim_type: constants_applied
        grounds:
          - calculations.payment_standard
          - constants.ADDL_PERSON_CENTS
          - constants.MAX_GRANT_CENTS
        distinguishing_aspect: |
          Size 8 is not in the PAYMENT_STANDARD_CENTS table, so the standard is
          76000 + 2 * 7000 == 90000; the ratable reduction then gives 76500, which
          is below MAX_GRANT_CENTS, so the cap does not bind and the benefit is
          76500 rather than 90000.
        test_recipe:
          setup:
            - "A SINGLE_PARENT household of size 8 with one adult and no income has a RECEIVED PROSPECTIVE 2026-08 application."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Large Household", county_code: "ADA", household_size: 8, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "HTTP status == 200"
            - "Application.${app_id}.countable_income_cents == 0"
            - "Application.${app_id}.determined_benefit_cents == 76500"
            - "Application.${app_id}.snapshot_family_type == SINGLE_PARENT"

      - name: child_only_case_requires_no_hours_and_consumes_no_clock_months
        claim_type: correct_result
        grounds:
          - calculations.family_type_derivation
          - calculations.time_limit_clock
          - calculations.required_hours_by_family_type
        distinguishing_aspect: |
          A CHILD_ONLY case is excluded from BOTH clocks, so an issued month has
          assistance_issued true while state_clock_countable and
          federal_clock_countable are both false with non_countable_reason
          CHILD_ONLY_CASE, and issued_countable_months stays 0 — unlike an
          extension-covered month, which is federal-countable.
        test_recipe:
          setup:
            - "A household of size 3 with adult_count 0 exists, so family_type is CHILD_ONLY."
            - "Its PROSPECTIVE 2026-08 application has no income and is DETERMINED with determined_benefit_cents 41650."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Child Only Household", county_code: "ADA", household_size: 3, adult_count: 0, youngest_child_age_months: 60, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { tlm_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Household.${hh_id}.family_type == CHILD_ONLY"
            - "AssistanceCase.${case_id}.compliance_status == NOT_REQUIRED"
            - "AssistanceCase.${case_id}.required_weekly_hours == 0"
            - "AssistanceCase.${case_id}.required_core_monthly_hours == 0"
            - "AssistanceCase.${case_id}.benefit_amount_cents == 41650"
            - "AssistanceCase.${case_id}.benefit_status == ACTIVE"
            - "TimeLimitMonth.${tlm_id}.assistance_issued == true"
            - "TimeLimitMonth.${tlm_id}.state_clock_countable == false"
            - "TimeLimitMonth.${tlm_id}.federal_clock_countable == false"
            - "TimeLimitMonth.${tlm_id}.non_countable_reason == CHILD_ONLY_CASE"
            - "Household.${hh_id}.issued_countable_months == 0"
            - "Household.${hh_id}.state_clock_months_used == 0"
            - "Household.${hh_id}.federal_clock_months_used == 0"

      - name: minimum_issuance_threshold_covered_by_difficulty_design
        claim_type: threshold
        grounds:
          - calculations.benefit_amount_calculation
          - constants.MINIMUM_ISSUANCE_CENTS
        excluded_because:
          difficulty_instance: boundary_precision_check / minimum_issuance_floor_at_exactly_one_thousand_cents_versus_one_cent_below
          rationale: "That instance tests the threshold from both sides with pre-computed literals 1000 and 0 and the ERR_INELIGIBLE_ZERO_BENEFIT rejection."

      - name: supportive_cap_waterfall_covered_by_difficulty_design
        claim_type: waterfall_allocation
        grounds:
          - calculations.supportive_service_waterfall
          - constants.SUPPORTIVE_CAPS_CENTS
        excluded_because:
          difficulty_instance: compensating_invariant / voiding_a_partial_authorization_restores_the_transportation_fiscal_year_headroom
          rationale: "That instance fills the TRANSPORTATION bucket first (45000), takes the partial remainder (15000) and asserts the conserved headroom after the void."

      - name: recovery_ledger_aggregation_covered_by_difficulty_design
        claim_type: aggregation
        grounds:
          - calculations.overpayment_establishment
          - entities.RecoveryTransaction.fields.signed_amount_cents
        excluded_because:
          difficulty_instance: compensating_invariant / recoupment_reversal_returns_the_overpayment_ledger_to_its_established_balance
          rationale: "That instance asserts the running total after an add and after a reversal, including the signed -12000 row."

      - name: authorization_interval_adjacency_covered_by_difficulty_design
        claim_type: interval_merge
        grounds:
          - calculations.supportive_service_waterfall
          - calculations.work_assignment_hour_capacity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / supportive_service_periods_are_closed_inclusive_so_shared_endpoints_collide
          rationale: "That instance tests the shared-endpoint collision, the disjoint next-month period and a different service_type in one recipe."

      - name: sanction_disregard_chronology_covered_by_difficulty_design
        claim_type: chronological
        grounds:
          - calculations.work_participation_rate
          - constants.SANCTION_DISREGARD_MAX_MONTHS
        excluded_because:
          difficulty_instance: combinatorial_formula / wpr_five_stage_pipeline_with_unadjusted_caseload_for_the_credit
          rationale: "That instance pins the five-stage order in which the chronological sanction walk feeds the adjusted denominators while the credit uses the unadjusted caseload."

