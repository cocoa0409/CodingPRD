scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: production_forecast_variant_divergence
        grounds:
          - calculations.production_forecast
          - entities.MenuDay.fields.forecast_servings
          - state_machines.MenuDay.DRAFT_to_FORECAST_LOCKED
        distinguishing_aspect: |
          MenuDay production-plan domain: for identical reconciled history the
          TRAILING_AVERAGE and DOW_WEIGHTED variants produce different pinned
          forecast_servings. Pinned history (per site, within 28 days of target
          service_date 2026-08-28, a Friday): one reconciled Friday MenuDay
          2026-08-21 with served_count 100, and one reconciled Monday MenuDay
          2026-08-24 with served_count 10. Overall mean = (100 + 10)/2 = 55;
          same-weekday (Friday) mean = 100. TRAILING_AVERAGE:
          ceil(55 * 1.05) = ceil(57.75) = 58. DOW_WEIGHTED:
          ceil((0.6*100 + 0.4*55) * 1.05) = ceil(82 * 1.05) = ceil(86.1) = 87.
          Uniqueness forbids two MenuDays for one (site_id, service_date), so the
          two variants run on two sites (S1 TRAILING, S2 DOW) with identical
          history built on each.
        test_recipe:
          setup:
            - "Sites S1 and S2; guest GH household_size 120; volunteer V BASIC cert valid to 2027."
            - "On each site, two reconciled history MenuDays (Friday 2026-08-21 served 100 via one order of quantity 100; Monday 2026-08-24 served 10 via one order of quantity 10), each driven create -> item -> batch PASSED -> allocate -> confirm -> lock-forecast -> start-production -> service create -> open -> order -> prep -> ready -> serve -> close -> reconcile."
            - "Fresh DRAFT MenuDay F1 on S1 (service_date 2026-08-28, TRAILING_AVERAGE) with one CONFIRMED item planned 5 covered by allocation; fresh DRAFT MenuDay F2 on S2 (2026-08-28, DOW_WEIGHTED) likewise."
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Site One", dine_in_capacity: 200, togo_capacity_per_window: 100, delivery_radius_km: 10 }
              as: ProgramAdmin
              captures: { s1: $.data.id }
            - call: "POST /kitchen/sites"
              payload: { name: "Site Two", dine_in_capacity: 200, togo_capacity_per_window: 100, delivery_radius_km: 10 }
              as: ProgramAdmin
              captures: { s2: $.data.id }
            - call: "POST /kitchen/guests"
              payload: { full_name: "Big Household", household_size: 120 }
              as: KitchenManager
              captures: { guest_id: $.data.id }
            - call: "POST /kitchen/volunteers"
              payload: { full_name: "Vol One", email: "v1@x.org", certification_level: "BASIC", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: KitchenManager
              captures: { vol_id: $.data.id }
            - call: "POST /kitchen/volunteers"
              payload: { full_name: "Vol Two", email: "v2@x.org", certification_level: "BASIC", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: KitchenManager
              captures: { vol2_id: $.data.id }
            # ===== S1 history Friday 2026-08-21 served 100 =====
            - call: "POST /kitchen/food-batches"
              payload: { site_id: "${s1}", source_type: "PURCHASE", item_description: "s1fri staples", quantity_servings: 120, received_at: "2026-08-20T07:00:00Z", use_by: "2026-09-01T00:00:00Z", unit_cost_cents_per_serving: 50 }
              as: KitchenManager
              captures: { b1f: $.data.id }
            - call: "POST /kitchen/food-batches/${b1f}/begin-inspection"
              payload: {}
              as: FoodSafetyOfficer
            - call: "POST /kitchen/food-batches/${b1f}/record-inspection"
              payload: { result: "PASSED" }
              as: FoodSafetyOfficer
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${s1}", service_date: "2026-08-21" }
              as: KitchenManager
              captures: { d1f: $.data.id }
            - call: "POST /kitchen/menu-days/${d1f}/menu-items"
              payload: { name: "Fri Meal", planned_servings: 100 }
              as: KitchenManager
              captures: { i1f: $.data.id }
            - call: "POST /kitchen/menu-items/${i1f}/allocations"
              payload: { food_batch_id: "${b1f}", servings: 100 }
              as: KitchenManager
            - call: "POST /kitchen/menu-items/${i1f}/confirm"
              payload: {}
              as: KitchenManager
            - call: "GET /kitchen/menu-days/${d1f}"
              payload: {}
              as: KitchenManager
              captures: { v1f: $.data.version }
            - call: "POST /kitchen/menu-days/${d1f}/lock-forecast"
              payload: { expected_menu_day_version: "${v1f}" }
              as: KitchenManager
            - call: "POST /kitchen/menu-days/${d1f}/start-production"
              payload: {}
              as: KitchenManager
            - call: "POST /kitchen/meal-services"
