  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: filing_withdraw_refile_cycle_restores_verified
        grounds:
          - state_machines.CandidateFiling.VERIFIED_to_WITHDRAWN
          - state_machines.CandidateFiling.WITHDRAWN_to_FILED
          - entities.CandidateFiling.fields.withdrawal_count
        distinguishing_aspect: |
          Cyclic machine on CandidateFiling: FILED -> VERIFIED -> WITHDRAWN -> FILED -> VERIFIED
          is legal while the filing window is open; withdrawal_count accumulates (== 1) and
          filed_at is refreshed by the refile while withdrawal_count is not reset.
        test_recipe:
          setup:
            - "Clock 2026-09-01. OPEN cycle, one jurisdiction, one CANDIDATE_RACE contest still in FILING_OPEN with filing_deadline 2026-09-15T17:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "City of Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Mayor", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_id: "$.data.id" } }
            - { call: "POST /contests/${ct_id}/filings", payload: { candidate_name: "Wendy Cycle", party_label: "Nonpartisan", filing_reference: "F-9" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { f_id: "$.data.id" } }
            - { call: "POST /filings/${f_id}/verify", as: ChapterCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "POST /filings/${f_id}/withdraw", as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-02T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /filings/${f_id}/refile", as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-03T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /filings/${f_id}/verify", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { f_status: "$.data.status", f_wd: "$.data.withdrawal_count", f_filed: "$.data.filed_at", f_verified: "$.data.verified_at" } }
          assert:
            - "CandidateFiling.${f_id}.status == VERIFIED after the full cycle"
            - "CandidateFiling.${f_id}.withdrawal_count == 1 (refile does not reset the counter)"
            - "CandidateFiling.${f_id}.filed_at == 2026-09-02T00:00:00Z (refreshed by refile) and verified_at == 2026-09-03T00:00:00Z"

      - name: measure_remand_revise_resubmit_second_round
        grounds:
          - state_machines.BallotMeasure.IN_NEUTRALITY_REVIEW_to_REMANDED
          - state_machines.BallotMeasure.REMANDED_to_DRAFTING
          - entities.BallotMeasure.fields.review_round_count
        distinguishing_aspect: |
          Cyclic machine on BallotMeasure (different entity than CandidateFiling): a UNBALANCED
          verdict remands, the drafter revises back to DRAFTING, resubmission starts review
          round 2, and the same reviewer who remanded round 1 may legally review round 2
          (duplicate-review guard is scoped per round).
        test_recipe:
          setup:
            - "OPEN cycle, one jurisdiction, one BALLOT_MEASURE contest in QUESTIONNAIRE_PHASE; measure with one ACCEPTED PRO and one ACCEPTED CON argument submitted for review (round 1)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Edna Editor", chapter_code: "CH1", roles: ["EDITOR"] }, as: LeagueAdmin, captures: { ed_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Rhea Reviewer", chapter_code: "CH2", roles: ["REVIEWER"] }, as: LeagueAdmin, captures: { rev_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Ray ReviewerTwo", chapter_code: "CH3", roles: ["REVIEWER"] }, as: LeagueAdmin, captures: { rev2_id: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "City of Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
            - { call: "POST /jurisdictions/${jur_id}/contests", payload: { kind: "BALLOT_MEASURE", filing_deadline: "2026-09-15T17:00:00Z" }, as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-16T00:00:00Z" }, as: LeagueAdmin }
            - { call: "GET /contests/${ct_id}", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { ct_ver: "$.data.version" } }
            - { call: "POST /contests/${ct_id}/transitions", payload: { to: "QUESTIONNAIRE_PHASE", expected_contest_version: "${ct_ver}" }, as: ChapterCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /contests/${ct_id}/measure", payload: { measure_title: "Measure Z", official_text: "Official text Z", explanation_text: "Cats run fast with dogs on soft brown mats near banana." }, as: QuestionnaireEditor, as_user_id: "${ed_id}", captures: { m_id: "$.data.id" } }
            - { call: "POST /measures/${m_id}/arguments", payload: { side: "PRO", argument_text: "one two three four five six seven eight nine ten", author_credit: "Yes on Z" }, as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /measures/${m_id}/arguments", payload: { side: "CON", argument_text: "one two three four five six seven eight nine ten", author_credit: "No on Z" }, as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /measures/${m_id}/submit-for-review", as: QuestionnaireEditor, as_user_id: "${ed_id}" }
          trigger:
            - { call: "POST /measures/${m_id}/reviews", payload: { verdict: "UNBALANCED", notes: "Con side is thinner than pro." }, as: NeutralityReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /measures/${m_id}/revise", payload: { explanation_text: "Cats run fast with dogs on soft brown mats near cedar." }, as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /measures/${m_id}/submit-for-review", as: QuestionnaireEditor, as_user_id: "${ed_id}" }
            - { call: "POST /measures/${m_id}/reviews", payload: { verdict: "NEUTRAL", notes: "Now balanced." }, as: NeutralityReviewer, as_user_id: "${rev_id}", captures: { r2_round: "$.data.round_index" } }
            - { call: "POST /measures/${m_id}/reviews", payload: { verdict: "NEUTRAL", notes: "Second approval completes round 2." }, as: NeutralityReviewer, as_user_id: "${rev2_id}" }
          assert:
            - "After UNBALANCED verdict: BallotMeasure.${m_id}.status == REMANDED"
            - "After revise: BallotMeasure.${m_id}.status == DRAFTING"
            - "After second submit-for-review: status == IN_NEUTRALITY_REVIEW and review_round_count == 2"
            - "The same reviewer may review round 2 (per-round guard): rev_id's second NEUTRAL lands with round_index == 2 and the measure is still IN_NEUTRALITY_REVIEW (one approval)"
            - "After rev2_id's distinct NEUTRAL in round 2: status == APPROVED_FOR_GUIDE and approvals_this_round == 2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: incident_substantiation_suspends_remands_reverts
        grounds:
          - state_machines.PolicyIncident.REPORTED_to_SUBSTANTIATED
          - state_machines.Volunteer.ACTIVE_to_SUSPENDED
          - state_machines.BallotMeasure.APPROVED_FOR_GUIDE_to_REMANDED
          - state_machines.Contest.GUIDE_READY_to_QUESTIONNAIRE_PHASE
        distinguishing_aspect: |
          Depth-3 cascade triggered by incident substantiation: SUBSTANTIATED suspends the
          drafter (link 1); the suspension quarantines their APPROVED_FOR_GUIDE measure to
          REMANDED (link 2); the quarantine reverts the measure's GUIDE_READY contest to
          QUESTIONNAIRE_PHASE (link 3). Each link is caused by the previous link, not by the
          original resolve call.
        test_recipe:
          setup:
            - "OPEN cycle; one BALLOT_MEASURE contest whose measure (drafted by editor Edna) has passed NEUTRAL review (by Rhea) and whose contest has reached GUIDE_READY. Edna is ACTIVE with CURRENT attestation. An unrelated moderator-hosted forum does not exist."
