scaffold_corner_design:
  - section: entities
    instances:
      - name: student_creation_returns_intake_defaults
        claim_type: creation
        grounds:
          - entities.Student
          - endpoints[POST /students]
        distinguishing_aspect: |
          Intake creation must seed every system and computed field in one response: intake_status
          INTAKE_STARTED, placement_efl_level null, total_instructional_hours 0, all three voucher
          counters 0, exam_fee_owed_cents 0, credential_status NONE, active_enrollment_count 0.
          Falsified if any counter is absent or non-zero on the 201 body.
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /_clock/current_utc"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /students"
              payload: { full_name: "Amara Vidal", email: "amara.vidal@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
          assert:
            - "POST /students returns 201"
            - "data.full_name == 'Amara Vidal', data.email == 'amara.vidal@example.org', data.primary_track == 'HSE_PREP'"
            - "data.intake_status == 'INTAKE_STARTED' and data.orientation_completed_at == null"
            - "data.placement_efl_level == null and data.total_instructional_hours == 0"
            - "data.voucher_granted_cents == 0, data.voucher_balance_cents == 0, data.voucher_spent_cents == 0"
            - "data.exam_fee_owed_cents == 0, data.credential_status == 'NONE', data.active_enrollment_count == 0"
            - "data.id is a non-empty server-minted string and data.created_at, data.updated_at, data.version are present"

      - name: student_retrieval_returns_stored_intake_fields
        claim_type: retrieval
        grounds:
          - entities.Student
          - endpoints[GET /students/{studentId}]
        distinguishing_aspect: |
          GET /students/{studentId} must echo the stored row, including the orientation timestamp
          written by a prior transition, not a freshly defaulted one. Falsified if
          orientation_completed_at reads null after orientation was recorded.
        test_recipe:
          setup:
            - "One student intaked at clock 2026-08-01T00:00:00Z, then oriented at clock 2026-08-02T08:00:00Z."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Bea Rowan", email: "bea.rowan@example.org", primary_track: "ESL" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T08:00:00Z" }
              as: Registrar
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
          trigger:
            - call: "GET /students/${s}"
              payload: {}
              as: Registrar
          assert:
            - "GET /students/${s} returns 200"
            - "data.id == ${s} and data.primary_track == 'ESL'"
            - "data.intake_status == 'ORIENTED'"
            - "data.orientation_completed_at == '2026-08-02T08:00:00Z' (logical clock, not wall clock)"

      - name: student_listing_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /students]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The list endpoint must report total_count over the whole filtered set (3) while returning
          only the page (2) and has_more true; the intake_status filter must narrow the set to the
          single ORIENTED student. Falsified if total_count mirrors the page length.
        test_recipe:
          setup:
            - "Three students exist; exactly one of them has been oriented."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Cal Otieno", email: "cal.otieno@example.org", primary_track: "LITERACY" }
              as: ProgramCoordinator
              captures: { s1: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Dara Nkemi", email: "dara.nkemi@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s2: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Emil Torres", email: "emil.torres@example.org", primary_track: "ESL" }
              as: ProgramCoordinator
              captures: { s3: $.data.id }
            - call: "POST /students/${s2}/orientation-completion"
              payload: {}
              as: Registrar
          trigger:
            - call: "GET /students"
              payload: { limit: 2, offset: 0 }
              as: Registrar
            - call: "GET /students"
              payload: { intake_status: "ORIENTED" }
              as: Registrar
          assert:
            - "GET /students?limit=2&offset=0 returns 200 with response_type 'array', exactly 2 items, total_count == 3, has_more == true"
            - "GET /students?intake_status=ORIENTED returns 200 with exactly 1 item whose id == ${s2}, total_count == 1, has_more == false"

      - name: student_path_id_unresolvable_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_STUDENT_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid but unknown student id in the path is a 404 ERR_STUDENT_NOT_FOUND on
          both a read and a write action, not a 400 or a 200 with an empty body.
        test_recipe:
          setup:
            - "Empty database; no Student row exists."
          setup_api_calls:
            - call: "GET /_clock/current_utc"
              payload: {}
              as: Registrar
          trigger:
            - call: "GET /students/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e1: $.data.error_id }
            - call: "POST /students/00000000-0000-4000-8000-000000000000/orientation-completion"
              payload: {}
              as: Registrar
              captures: { e2: $.data.error_id }
          assert:
            - "GET /students/00000000-0000-4000-8000-000000000000 returns 404 with data.error_id == 'ERR_STUDENT_NOT_FOUND'"
            - "POST /students/00000000-0000-4000-8000-000000000000/orientation-completion returns 404 with data.error_id == 'ERR_STUDENT_NOT_FOUND'"
            - "response_type == 'error' and data.message is a non-empty string on both calls"

      - name: student_creation_missing_required_primary_track_rejected
        claim_type: required_fields
        grounds:
          - entities.Student.fields.primary_track
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          primary_track has source input and no default, so omitting it is ERR_INVALID_REQUEST (400)
          and no Student row is created - distinct from self_pay_authorized, which is optional.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /students"
              payload: { limit: 10, offset: 0 }
              as: ProgramCoordinator
          trigger:
            - call: "POST /students"
              payload: { full_name: "Fen Alvi", email: "fen.alvi@example.org" }
              as: ProgramCoordinator
              captures: { e1: $.data.error_id }
            - call: "GET /students"
              payload: { limit: 10, offset: 0 }
              as: ProgramCoordinator
          assert:
            - "POST /students without primary_track returns 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "the follow-up GET /students still returns total_count == 0 - no partial row was persisted"

      - name: student_self_pay_authorized_defaults_to_false
        claim_type: defaults
        grounds:
          - entities.Student.fields.self_pay_authorized
          - endpoints[POST /students]
        distinguishing_aspect: |
          Omitting the optional self_pay_authorized input yields false (not null, not true), which is
          the posture that later makes ERR_VOUCHER_INSUFFICIENT reachable for this student.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /_clock/current_utc"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /students"
              payload: { full_name: "Gita Roy", email: "gita.roy@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "GET /students/${s}"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "POST /students returns 201 with data.self_pay_authorized == false"
            - "GET /students/${s} returns 200 with data.self_pay_authorized == false"

      - name: testing_room_turnaround_buffer_defaults_to_forty_five
        claim_type: defaults
        grounds:
          - entities.TestingRoom.fields.turnaround_buffer_minutes
          - entities.TestingRoom.fields.status
          - endpoints[POST /testing-centers/{centerId}/rooms]
        distinguishing_aspect: |
          A room created without turnaround_buffer_minutes takes the declared default 45 (the value
          the room_occupation_conflict calculation then reads) and status ACTIVE, and its
          testing_center_id is taken from the path rather than the body.
        test_recipe:
          setup:
            - "A FULL_AUTHORIZED testing center."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Riverbend HSE Center", state_code: "OR" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
          trigger:
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R-101", seat_capacity: 20 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
          assert:
            - "POST /testing-centers/${c}/rooms returns 201"
            - "data.turnaround_buffer_minutes == 45"
            - "data.status == 'ACTIVE' and data.seat_capacity == 20"
            - "data.testing_center_id == ${c} (taken from the path)"

      - name: exam_session_defaults_draft_without_proctor_and_standard_formats
        claim_type: defaults
        grounds:
          - entities.ExamSession.fields.status
          - entities.ExamSession.fields.proctor_id
          - entities.ExamSession.fields.supported_formats
          - endpoints[POST /exam-sessions]
        distinguishing_aspect: |
          A session created without supported_formats takes exactly ["STANDARD", "EXTRA_TIME"] - not
          the full five-member set - and starts DRAFT with proctor_id null, seats_taken 0 and
          cancel_reason null. Falsified if LARGE_PRINT/BRAILLE/AUDIO appear by default.
        test_recipe:
          setup:
            - "A FULL_AUTHORIZED center with one ACTIVE room of 20 seats; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Lakeside HSE Center", state_code: "WA" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R-201", seat_capacity: 20, turnaround_buffer_minutes: 45 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
          trigger:
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "MATH", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T12:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess: $.data.id }
          assert:
            - "POST /exam-sessions returns 201"
            - "data.status == 'DRAFT', data.proctor_id == null, data.seats_taken == 0, data.cancel_reason == null"
            - "data.supported_formats == ['STANDARD', 'EXTRA_TIME'] exactly"
            - "data.seat_capacity == 5 and data.duration_hours == 3.00"

      - name: proctor_daily_hour_cap_defaults_to_eight_hours
        claim_type: defaults
        grounds:
          - entities.Proctor.fields.daily_hour_cap
          - entities.Proctor.fields.certification_status
          - endpoints[POST /testing-centers/{centerId}/proctors]
        distinguishing_aspect: |
          A proctor registered without daily_hour_cap takes 8.00 (the DEFAULT_DAILY_HOUR_CAP the
          proctor_daily_load calculation reads) and starts PENDING with certification_expires_at null
          and assigned_session_count 0.
        test_recipe:
          setup:
            - "A FULL_AUTHORIZED testing center."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Northgate HSE Center", state_code: "ID" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
          trigger:
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Hana Ipsen" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p: $.data.id }
          assert:
            - "POST /testing-centers/${c}/proctors returns 201"
            - "data.daily_hour_cap == 8.00"
            - "data.certification_status == 'PENDING', data.certification_expires_at == null, data.assigned_session_count == 0"
            - "data.testing_center_id == ${c}"

      - name: exam_session_seat_capacity_and_duration_computed
        claim_type: computed_fields
        grounds:
          - entities.ExamSession.fields.seat_capacity
          - entities.ExamSession.fields.duration_hours
          - endpoints[POST /exam-sessions]
        distinguishing_aspect: |
          seat_capacity is min(requested_seats, TestingRoom.seat_capacity), so a request for 30 seats
          in a 20-seat room stores 20, and duration_hours is derived from the window (09:00 to 12:30
          is 3.50), not from any input field. Falsified if requested_seats is stored verbatim.
        test_recipe:
          setup:
            - "A FULL_AUTHORIZED center with one ACTIVE room of exactly 20 seats."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Cedar Vale HSE Center", state_code: "MT" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R-301", seat_capacity: 20, turnaround_buffer_minutes: 45 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
          trigger:
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "RLA", starts_at: "2026-08-06T09:00:00Z", ends_at: "2026-08-06T12:30:00Z", requested_seats: 30 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess: $.data.id }
            - call: "GET /exam-sessions/${sess}"
              payload: {}
              as: CenterAdministrator
              as_user_id: "${c}"
          assert:
            - "POST /exam-sessions returns 201 with data.requested_seats == 30 and data.seat_capacity == 20"
            - "data.duration_hours == 3.50"
            - "GET /exam-sessions/${sess} returns 200 with the same seat_capacity 20 and duration_hours 3.50"

      - name: enrollment_entry_efl_level_frozen_from_placement
        claim_type: computed_fields
        grounds:
          - entities.Enrollment.fields.entry_efl_level
          - entities.ClassSection.fields.seats_taken
          - entities.ClassSection.fields.seats_available
          - endpoints[POST /enrollments]
        distinguishing_aspect: |
          entry_efl_level is copied from Student.placement_efl_level (2, from a CASAS_R_900 score of
          205) at creation and is not an input; the same call moves the student to ENROLLED and turns
          one section seat, so seats_taken 1 / seats_available 19.
        test_recipe:
          setup:
            - "Student oriented and PLACED at EFL level 2 by a scored PRE_TEST (CASAS_R_900, 205)."
            - "An OPEN HSE_PREP section with 20 seats accepting levels 1..6."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Ines Kalu", email: "ines.kalu@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-02T09:00:00Z" }
              as: Registrar
              captures: { te: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: Registrar
            - call: "POST /test-events/${te}/score"
              payload: { scale_score: 205 }
              as: Instructor
            - call: "POST /class-sections"
              payload: { program_track: "HSE_PREP", title: "HSE Morning", instructor_user_id: "instructor-1", min_efl_level: 1, max_efl_level: 6, seats_total: 20, weekly_hours: 6.00 }
              as: ProgramCoordinator
              captures: { sec: $.data.id }
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${s}", class_section_id: "${sec}" }
              as: ProgramCoordinator
              captures: { e: $.data.id }
            - call: "GET /class-sections/${sec}"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /students/${s}"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "POST /enrollments returns 201 with data.entry_efl_level == 2, data.status == 'ACTIVE', data.posted_hours == 0, data.post_test_eligible == false, data.withdrawn_at == null, data.exit_reason == null"
            - "GET /class-sections/${sec} returns 200 with data.seats_taken == 1 and data.seats_available == 19"
            - "GET /students/${s} returns 200 with data.intake_status == 'ENROLLED' and data.active_enrollment_count == 1"

      - name: attendance_entry_posted_by_user_id_stamped_from_header
        claim_type: system_fields
        grounds:
          - entities.AttendanceEntry.fields.posted_by_user_id
          - entities.AttendanceEntry.fields.status
          - endpoints[POST /enrollments/{enrollmentId}/attendance-entries]
        distinguishing_aspect: |
          posted_by_user_id is stamped from the acting X-User-ID (instructor-7) and is not a body
          field; status is POSTED, void_reason null, and enrollment_id comes from the path.
        test_recipe:
          setup:
            - "Student PLACED at EFL 2 and ACTIVE on an OPEN HSE_PREP section; clock 2026-08-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Jonas Meier", email: "jonas.meier@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-02T09:00:00Z" }
              as: Registrar
              captures: { te: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: Registrar
            - call: "POST /test-events/${te}/score"
              payload: { scale_score: 205 }
              as: Instructor
            - call: "POST /class-sections"
              payload: { program_track: "HSE_PREP", title: "HSE Afternoon", instructor_user_id: "instructor-7", min_efl_level: 1, max_efl_level: 6, seats_total: 10, weekly_hours: 6.00 }
              as: ProgramCoordinator
              captures: { sec: $.data.id }
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
            - call: "POST /enrollments"
              payload: { student_id: "${s}", class_section_id: "${sec}" }
              as: ProgramCoordinator
              captures: { e: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: Instructor
          trigger:
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-03", hours: 2.50 }
              as: Instructor
              as_user_id: "instructor-7"
              captures: { ae: $.data.id }
            - call: "GET /enrollments/${e}"
              payload: {}
              as: Instructor
          assert:
            - "POST /enrollments/${e}/attendance-entries returns 201"
            - "data.posted_by_user_id == 'instructor-7' and data.enrollment_id == ${e}"
            - "data.status == 'POSTED', data.void_reason == null, data.hours == 2.50, data.attendance_date == '2026-08-03'"
            - "GET /enrollments/${e} returns 200 with data.posted_hours == 2.50 and data.post_test_eligible == false"

      - name: student_primary_track_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Student.fields.primary_track
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          primary_track accepts only LITERACY, HSE_PREP, ESL; a plausible-but-undeclared member
          (GED_PREP) is ERR_INVALID_REQUEST (400), not silently coerced.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /_clock/current_utc"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /students"
              payload: { full_name: "Kori Bell", email: "kori.bell@example.org", primary_track: "GED_PREP" }
              as: ProgramCoordinator
              captures: { e1: $.data.error_id }
          assert:
            - "POST /students returns 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "no Student row is created: GET /students returns total_count == 0"

      - name: attendance_hours_not_multiple_of_quarter_rejected
        claim_type: type_constraints
        grounds:
          - entities.AttendanceEntry.fields.hours
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          hours must be a multiple of HOURS_INCREMENT 0.25; 1.10 is in range (>0, <=8) yet still
          ERR_INVALID_REQUEST, and Enrollment.posted_hours stays 0.
        test_recipe:
          setup:
            - "Student PLACED and ACTIVE on an OPEN section with 0 posted hours; clock 2026-08-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Lena Fox", email: "lena.fox@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-02T09:00:00Z" }
              as: Registrar
              captures: { te: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: Registrar
            - call: "POST /test-events/${te}/score"
              payload: { scale_score: 205 }
              as: Instructor
            - call: "POST /class-sections"
              payload: { program_track: "HSE_PREP", title: "HSE Quarter Hours", instructor_user_id: "instructor-2", min_efl_level: 1, max_efl_level: 6, seats_total: 10, weekly_hours: 6.00 }
              as: ProgramCoordinator
              captures: { sec: $.data.id }
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
            - call: "POST /enrollments"
              payload: { student_id: "${s}", class_section_id: "${sec}" }
              as: ProgramCoordinator
              captures: { e: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: Instructor
          trigger:
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-03", hours: 1.10 }
              as: Instructor
              captures: { e1: $.data.error_id }
            - call: "GET /enrollments/${e}"
              payload: {}
              as: Instructor
          assert:
            - "POST /enrollments/${e}/attendance-entries with hours 1.10 returns 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /enrollments/${e} returns 200 with data.posted_hours == 0 - the rejected entry did not touch the ledger"

      - name: class_section_max_efl_below_min_rejected
        claim_type: type_constraints
        grounds:
          - entities.ClassSection.fields.max_efl_level
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          max_efl_level must be >= min_efl_level; an inverted band (min 4, max 2) is a body-schema
          rejection at priority 5, not a business 409 discovered later at enrollment time.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /class-sections"
              payload: { limit: 10, offset: 0 }
              as: ProgramCoordinator
          trigger:
            - call: "POST /class-sections"
              payload: { program_track: "LITERACY", title: "Inverted Band", instructor_user_id: "instructor-3", min_efl_level: 4, max_efl_level: 2, seats_total: 10, weekly_hours: 6.00 }
              as: ProgramCoordinator
              captures: { e1: $.data.error_id }
            - call: "GET /class-sections"
              payload: { limit: 10, offset: 0 }
              as: ProgramCoordinator
          assert:
            - "POST /class-sections returns 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /class-sections still returns total_count == 0"

      - name: funding_period_end_date_not_after_start_rejected
        claim_type: type_constraints
        grounds:
          - entities.FundingPeriod.fields.end_date
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          end_date must be strictly greater than start_date; equal dates (an empty half-open window)
          are rejected with 400 before any pool arithmetic happens.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /funding-periods"
              payload: { limit: 10, offset: 0 }
              as: StateAuthority
          trigger:
