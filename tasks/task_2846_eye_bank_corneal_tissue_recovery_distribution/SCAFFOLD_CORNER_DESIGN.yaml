              as: LabTechnician
              captures: { panel_id: $.data.id }
            - call: "POST /eye-bank/serology-panels/${panel_id}/results"
              payload: { hiv_result: "REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
