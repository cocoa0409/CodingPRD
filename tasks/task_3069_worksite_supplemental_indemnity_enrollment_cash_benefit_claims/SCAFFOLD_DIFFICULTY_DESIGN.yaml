            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${s18}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "W", benefit_amount_cents: 100, max_occurrences_per_year: 12, lifetime_max_cents: 100000 }], monthly_premium_cents: 3000, wellness_benefit_cents: 1000, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { sch18: $.data.id } }
            - { call: "POST /benefit-schedules/${sch18}/publish", payload: { expected_series_version: "${s18_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${s18}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${g18}", counselor_id: "${c18}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam18: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cam18}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${g18}", employee_ref: "E18A", full_name: "Emp 18A", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { e18a: $.data.id } }
            - { call: "POST /employees", payload: { employer_group_id: "${g18}", employee_ref: "E18B", full_name: "Emp 18B", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { e18b: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${cam18}", employee_id: "${e18a}", policy_series_id: "${s18}", premium_mode: "POST_TAX" }, as: BenefitCounselor, captures: { p18a: $.data.id } }
            - { call: "POST /policies/${p18a}/issue", payload: {}, as: BenefitCounselor }
            - { call: "POST /policies", payload: { campaign_id: "${cam18}", employee_id: "${e18b}", policy_series_id: "${s18}", premium_mode: "POST_TAX" }, as: BenefitCounselor, captures: { p18b: $.data.id } }
            - { call: "POST /policies/${p18b}/issue", payload: {}, as: BenefitCounselor }
            - { call: "POST /payroll-cycles", payload: { employer_group_id: "${g18}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }, as: GroupAdmin, captures: { cyc18: $.data.id } }
            - { call: "POST /payroll-cycles/${cyc18}/finalize", payload: {}, as: GroupAdmin }
            - { call: "GET /payroll-cycles/${cyc18}/deduction-lines", payload: {}, as: GroupAdmin, captures: { line18a: "$.data[0].id" } }
          trigger:
