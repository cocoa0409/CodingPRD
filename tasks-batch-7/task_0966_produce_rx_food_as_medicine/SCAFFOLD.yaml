# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or entity_backed ownership check failed (wrong clinic/retailer/funder/patient)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, invalid enum value, out-of-range integer, duplicate npi_number or period_index" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic wrong-state rejection for a transition not covered by a more specific error" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Transition attempted from a terminal state" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Operation requires Program.status == ACTIVE (or DRAFT where stated) but it is not" }
  - { id: ERR_PROGRAM_FROZEN, http: 409, condition: "Enrollment reinstate attempted while program is FROZEN" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Operation requires Enrollment.status == ACTIVE (redemption, education completion)" }
  - { id: ERR_REFERRAL_NOT_REVIEWABLE, http: 409, condition: "start-review/approve/decline attempted on a referral not in the required state" }
  - { id: ERR_VOUCHER_NOT_REDEEMABLE, http: 409, condition: "Voucher operation attempted on a non-ISSUED voucher" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Issue or close attempted on a cycle not in the required state" }
  - { id: ERR_CYCLE_ALREADY_OPEN, http: 409, condition: "Another cycle of the program is already OPEN" }
  - { id: ERR_PRIOR_CYCLE_UNCLOSED, http: 409, condition: "A cycle with lower period_index is not CLOSED" }
  - { id: ERR_REPORT_NOT_EDITABLE, http: 409, condition: "submit/accept/return attempted on a report in the wrong state" }
  - { id: ERR_RENEWAL_NOT_ACTIONABLE, http: 409, condition: "Renewal transition attempted from the wrong state or on an ineligible enrollment status" }
  - { id: ERR_SESSION_NOT_SCHEDULED, http: 409, condition: "complete/cancel attempted on a non-SCHEDULED session, or completion recorded for a non-COMPLETED session" }
  - { id: ERR_CONSENT_REVOKED, http: 422, condition: "Patient consent is not GRANTED (PENDING or REVOKED) for referral/approval/biometric write" }
  - { id: ERR_A1C_OUT_OF_RANGE, http: 422, condition: "A1C value outside [3.0, 20.0]" }
  - { id: ERR_CLINIC_SUSPENDED, http: 409, condition: "Clinic is SUSPENDED; referral/patient/biometric writes and renewal approval blocked" }
  - { id: ERR_RETAILER_SUSPENDED, http: 409, condition: "Retailer is SUSPENDED; redemptions blocked" }
  - { id: ERR_POOL_NOT_FUNDED, http: 409, condition: "Issuance requires a FUNDED pool" }
  - { id: ERR_NO_FUNDED_POOL, http: 409, condition: "Program activation requires at least one FUNDED pool" }
  - { id: ERR_COMMITMENT_EXCEEDED, http: 422, condition: "Sum of pool committed_cents for a funder would exceed total_commitment_cents" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "Benefit cycle period overlaps an existing cycle of the program (half-open; exact adjacency allowed)" }
  - { id: ERR_VENUE_CONFLICT, http: 409, condition: "Education session venue occupied within the 30-minute buffer window" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "start >= end, or cycle outside program window, or report period_start >= period_end" }
  - { id: ERR_OUTSIDE_RENEWAL_WINDOW, http: 422, condition: "Renewal for a LAPSED enrollment after lapsed_at + renewal_window_days" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "Completion count for the session already equals capacity" }
  - { id: ERR_DUPLICATE_COMPLETION, http: 409, condition: "Completion already exists for (enrollment, session)" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "An ACTIVE/SUSPENDED/LAPSED enrollment already exists for (patient, program)" }
  - { id: ERR_DUPLICATE_REFERRAL, http: 409, condition: "A non-terminal referral already exists for (patient, program)" }
  - { id: ERR_CLINIC_REFERRAL_CAP, http: 409, condition: "Clinic already has max_active_referrals referrals in SUBMITTED or UNDER_REVIEW" }
  - { id: ERR_INVALID_TENDER, http: 422, condition: "Redemption lines empty, amount_cents <= 0, or unknown category" }
  - { id: ERR_VOID_NOT_ALLOWED, http: 409, condition: "Redemption void attempted after the voucher's cycle was CLOSED or on a VOIDED redemption" }
  - { id: ERR_OPEN_CYCLES_EXIST, http: 409, condition: "Program close attempted while a cycle is OPEN" }
  - { id: ERR_POOL_BUSY, http: 409, condition: "Pool close attempted while reserved_cents > 0" }
  - { id: ERR_PATIENT_CLINIC_MISMATCH, http: 422, condition: "referral.clinic_id differs from patient.clinic_id" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Program operator; configures programs, funders, pools, clinics, retailers; reviews referrals; runs cycles, ops, reports; approves renewals"
    identity: opaque
    exclusive_operations:
      - "POST /programs, /programs/{id}/activate|close|run-ops"
      - "POST /funders, /funders/{id}/suspend|reinstate"
      - "POST /funding-pools, /funding-pools/{id}/close"
      - "POST /clinics, /clinics/{id}/suspend|reinstate"
      - "POST /retailers, /retailers/{id}/suspend|reinstate"
      - "POST /referrals/{id}/start-review|approve|decline"
      - "POST /enrollments/{id}/suspend|reinstate|terminate"
      - "POST /programs/{id}/cycles, /cycles/{id}/open|issue|close"
      - "POST /vouchers/{id}/void"
      - "POST /programs/{id}/funder-reports, /funder-reports/{id}/submit"
      - "POST /renewals/{id}/approve|deny"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
      - "POST /programs/{id}/education-sessions (shared with Educator)"
      - "POST /redemptions/{id}/void (shared with owning RetailerStaff)"
  - name: FunderAnalyst
    description: "Funder representative; funds own pools and adjudicates reports for own funder (segregation of duties vs ProgramAdmin who creates/submits)"
    identity: "entity_backed:Funder"
    exclusive_operations:
      - "POST /funding-pools/{id}/fund (only when pool.funder_id == X-User-ID)"
      - "POST /funder-reports/{id}/accept|return (only when report pool's funder_id == X-User-ID)"
    shared_operations:
      - "GET /programs/{id}, /programs/{id}/summary, pools, cycles, redemptions, reports"
  - name: ClinicStaff
    description: "Clinic operator; registers patients, manages consent, submits/appeals/withdraws referrals, records biometrics, files renewals"
    identity: "entity_backed:Clinic"
    exclusive_operations:
      - "POST /patients, /patients/{id}/grant-consent|revoke-consent (own clinic only)"
      - "POST /referrals, /referrals/{id}/appeal|withdraw (own clinic only)"
      - "POST /enrollments/{id}/biometric-readings (own clinic's enrollments only)"
      - "POST /enrollments/{id}/renewals, /renewals/{id}/submit|resubmit (own clinic only)"
    shared_operations:
      - "GET /patients, /referrals, /enrollments, /vouchers, /cycles, /education-sessions, /education-completions, /biometric-readings, /renewals"
  - name: Participant
    description: "Enrolled patient; read-only access to own records"
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "GET /patients/{id}, /enrollments (own), /vouchers (own)"
  - name: RetailerStaff
    description: "Retailer/market cashier; settles redemptions at own retailer and voids own redemptions"
    identity: "entity_backed:Retailer"
    exclusive_operations:
      - "POST /redemptions (retailer_id must equal X-User-ID)"
    shared_operations:
      - "GET /retailers/{id}, /redemptions (own retailer)"
      - "POST /redemptions/{id}/void (own retailer's redemptions; shared with ProgramAdmin)"
  - name: Educator
    description: "Nutrition educator; schedules and completes sessions, records completions"
    identity: opaque
    exclusive_operations:
      - "POST /education-sessions/{id}/complete|cancel"
      - "POST /education-sessions/{id}/completions"
    shared_operations:
      - "POST /programs/{id}/education-sessions (shared with ProgramAdmin)"
      - "GET /education-sessions, /education-completions"
