        claim_type: Variant Divergence
        grounds:
          - "calculations.statement_net_cents"
        excluded_because:
          difficulty_instance: statement_provisional_vs_final_commission_divergence
          rationale: "The 425000-versus-412000 divergence and its 13000-cent delta are the core assertion of that §1.8 instance."

