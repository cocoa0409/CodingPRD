            - "the task listing reports total_count == 2"
            - "PropagationTask.${task_a_id}.target_kind == ACTIVE_DATABASE with weight == 40, sla_days == 5, due_at == 2026-09-06T00:00:00.000Z, status == PENDING and recipient_id == null"
            - "PropagationTask.${task_b_id}.target_kind == BACKUP_ARCHIVE with weight == 20, sla_days == 45, due_at == 2026-10-16T00:00:00.000Z, status == PENDING and recipient_id == null"
