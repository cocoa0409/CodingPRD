            - "MarginCall.${mc1_id}.cured_amount_cents == 40000000 and status == PARTIALLY_CURED"
            - "Advance.${a1_id}.outstanding_balance_cents == 1920000000"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint for CurePayment or LedgerEntry"

      - name: corner_entity_enum_and_range_constraints_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=7]
          - errors.ERR_VALIDATION
          - entities.Advance.fields.product_code
          - entities.Advance.fields.funding_type
          - entities.InvestorCommitment.fields.price_pct
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Four distinct constraint families all collapse to 422 ERR_VALIDATION: an
          off-vocabulary enum member (product_code SUPER_JUMBO), a numeric range violation
          (price_pct 1.5 against "<= 1.2"), a non-positive money amount
          (committed_amount_cents 0 against "> 0"), and a pagination bound (limit 101
          against the max of 100).
        test_recipe:
          setup:
            - "Canonical ACTIVE facility with an APPROVED custodian and an APPROVED investor."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_get_fac_v1
          trigger:
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                product_code: "SUPER_JUMBO"
                loan_amount_cents: 2000000000
                note_rate: 0.0650
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v1}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /facilities/${fac_id}/commitments"
              payload:
                investor_id: "${inv_a_id}"
                product_code: "CONFORMING"
                committed_amount_cents: 5000000000
                price_pct: 1.5
                effective_on: "2026-08-01"
                expires_on: "2026-12-31"
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/commitments"
              payload:
                investor_id: "${inv_a_id}"
                product_code: "CONFORMING"
                committed_amount_cents: 0
                price_pct: 1.0125
                effective_on: "2026-08-01"
                expires_on: "2026-12-31"
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "GET /advances"
              payload: { facility_id: "${fac_id}", limit: 101 }
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "the SUPER_JUMBO advance returns HTTP 422 with data.error_id == ERR_VALIDATION, not ERR_ADVANCE_RATE_NOT_CONFIGURED — schema validation at priority 7 precedes nothing lower, and an unknown enum member never reaches the rate lookup"
            - "the price_pct 1.5 commitment returns HTTP 422 with data.error_id == ERR_VALIDATION"
            - "the committed_amount_cents 0 commitment returns HTTP 422 with data.error_id == ERR_VALIDATION"
            - "limit=101 returns HTTP 422 with data.error_id == ERR_VALIDATION"
            - "GET /facilities/${fac_id}/commitments returns total_count == 0"
            - "GET /advances with facility_id only returns total_count == 0"

      - name: corner_entity_body_fk_must_resolve_within_addressed_facility
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors.ERR_CUSTODIAN_NOT_FOUND
          - entities.Advance.fields.custodian_id
          - entities.Advance.fields.facility_id
          - endpoints["POST /advances"]
        distinguishing_aspect: |
          Flat topology means every body FK is checked twice — existence AND facility
          scoping. A custodian id that exists but belongs to facility F2 fails an advance
          booked on facility F1 with ERR_CUSTODIAN_NOT_FOUND (404), even though the row is
          perfectly readable via GET /custodians/{id}.
        test_recipe:
          setup:
            - "Two ACTIVE facilities F1 and F2, each with a CONFORMING rate row."
            - "F1 has custodian CUST1; F2 has custodian CUST2."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - call: "POST /facilities"
              payload:
                borrower_legal_name: "Keystone Home Loans Inc"
                committed_amount_cents: 20000000000
                wet_sublimit_cents: 20000000000
                aged_sublimit_cents: 2000000000
                scratch_and_dent_sublimit_cents: 1000000000
                min_tangible_net_worth_cents: 1500000000
                min_liquidity_cents: 500000000
                min_ttm_net_income_cents: 100000000
                max_investor_concentration_pct: 0.35
                bailee_period_days: 30
                unused_line_fee_rate: 0.0025
                settlement_account_last4: "8802"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac2_id: "$.data.id" }
            - call: "POST /facilities/${fac2_id}/product-advance-rates"
