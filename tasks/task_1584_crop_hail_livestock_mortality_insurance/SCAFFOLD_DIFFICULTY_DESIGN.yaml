              as: Policyholder
              as_user_id: "${g2}"
            - call: "POST /carriers/${carrier_id}/policies/${g2p}/coverage-units/${g2cu2}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 1 }
              as: Policyholder
              as_user_id: "${g2}"
            - call: "POST /carriers/${carrier_id}/policies/${g2p}/claims"
              payload: { coverage_unit_id: "${g2cu1}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
