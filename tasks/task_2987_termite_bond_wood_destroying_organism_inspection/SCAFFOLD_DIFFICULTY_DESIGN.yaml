  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: station_interval_grading_whole_days_floor_both_edges_inclusive
        grounds:
          - calculations.station_interval_and_escalation
          - entities.StationService.days_since_last_service
          - entities.StationService.interval_compliance
          - endpoints[POST /bait-stations/{id}/services]
        distinguishing_aspect: |
          Metric: an INTEGER count of whole days produced by floor() over a second-resolution
          instant difference, graded on two inclusive edges (<= 90 is ON_TIME, <= 97 is LATE).
          Endpoint: POST /bait-stations/{id}/services. Five sibling stations on one plan share an
          identical last_serviced_at, so the only variable is the clock at the visit: 90 days,
          90 days + 86399 s, 91 days, 97 days, 98 days.
        test_recipe:
          setup:
            - "One FL SLAB property with linear_footage 180, so a BAIT_STATION plan sizes to ceil(180/10) + 0 = 18 stations."
            - "The plan is completed at exactly 2026-08-10T00:00:00Z, so all 18 stations are installed with last_serviced_at = 2026-08-10T00:00:00Z and next_due_at 2026-11-08T00:00:00Z."
            - "Stations 1..5 (station_index 1..5) are each serviced exactly once with activity_level NONE, so status stays INSTALLED and limit_days stays 90 for every one of them."
            - "The clock advances monotonically across the five visits, and each station's own chronological chain has exactly one link."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "22 Bay Laurel Ct", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 2001, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p2: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Iris Kelso", license_number: "FL-10007", license_state: "FL", license_categories: ["WDO_INSPECTOR", "TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insf: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p2}", inspector_id: "${insf}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insf}"
              captures: { ins2: $.data.id }
            - call: "POST /inspections/${ins2}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insf}"
            - call: "POST /treatment-plans"
              payload: { property_id: "${p2}", inspection_id: "${ins2}", applicator_id: "${insf}", method: "BAIT_STATION", chemical_product_code: "HEXA_BAIT_2" }
              as: BranchManager
              captures: { plan2: $.data.id }
            - call: "POST /treatment-plans/${plan2}/approve"
              payload: {}
              as: BranchManager
            - call: "GET /treatment-plans/${plan2}"
              payload: {}
              as: BranchManager
              captures: { pv2: $.data.version }
            - call: "POST /treatment-plans/${plan2}/applications"
              payload: { product_epa_number: "432-9988", gallons_applied: 0.50, concentration_pct: 0.05, expected_treatment_plan_version: "${pv2}" }
              as: Applicator
              as_user_id: "${insf}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plans/${plan2}/complete"
              payload: {}
              as: Applicator
              as_user_id: "${insf}"
            - call: "GET /treatment-plans/${plan2}/bait-stations"
              payload: {}
              as: BranchManager
              captures: { st1: "$.data[0].id", st2: "$.data[1].id", st3: "$.data[2].id", st4: "$.data[3].id", st5: "$.data[4].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-08T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${st1}/services"
              payload: { activity_level: "NONE", matrix_replaced: false }
              as: FieldInspector
              as_user_id: "${insf}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-08T23:59:59Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${st2}/services"
              payload: { activity_level: "NONE", matrix_replaced: false }
              as: FieldInspector
              as_user_id: "${insf}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-09T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${st3}/services"
              payload: { activity_level: "NONE", matrix_replaced: false }
              as: FieldInspector
              as_user_id: "${insf}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${st4}/services"
              payload: { activity_level: "NONE", matrix_replaced: false }
              as: FieldInspector
              as_user_id: "${insf}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-16T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${st5}/services"
              payload: { activity_level: "NONE", matrix_replaced: false }
              as: FieldInspector
              as_user_id: "${insf}"
          assert:
            - "station 1 at exactly the limit: days_since_last_service == 90 and interval_compliance == ON_TIME (NOT LATE) — the <= 90 edge is inclusive"
            - "station 2 at 90 days plus 86399 seconds: floor() still yields days_since_last_service == 90 and interval_compliance == ON_TIME, proving whole-day truncation rather than rounding or ceiling"
            - "station 3 one day past the limit: days_since_last_service == 91 and interval_compliance == LATE"
            - "station 4 at exactly limit_days + LATE_GRACE_DAYS: days_since_last_service == 97 and interval_compliance == LATE (NOT MISSED) — the <= 97 edge is inclusive too"
            - "station 5 one day past the grace edge: days_since_last_service == 98 and interval_compliance == MISSED"
            - "every one of the five was graded against limit_days 90 because prior_status was INSTALLED for all of them"
            - "activity_level NONE leaves all five in status INSTALLED with consecutive_activity_count 0, so no grading difference can be attributed to a status change"
            - "each station's next_due_at == its own serviced_at + 90 days (station 1: 2027-02-06T00:00:00Z; station 2: 2027-02-06T23:59:59Z)"
            - "TreatmentPlan.escalated_station_count is still 0 and retreat_required is still false"

      - name: wdo_sla_breach_ceil_hours_strict_greater_than
        grounds:
          - calculations.wdo_turnaround_and_form_compliance
          - entities.WdoReport.turnaround_hours
          - entities.WdoReport.sla_breached
          - endpoints[POST /wdo-reports/{id}/issue]
        distinguishing_aspect: |
          A different metric from the station instance in three ways: the unit is HOURS not days, the
          rounding direction is ceil() not floor(), and the graded comparison is STRICTLY greater
          than (sla_breached = turnaround_hours > 72) rather than an inclusive <=. The endpoint is
          also different: POST /wdo-reports/{id}/issue. Three reports share one requested_at, so the
          only variable is the issuance instant, moved by a single second across the 72-hour edge.
        test_recipe:
          setup:
            - "One FL property with a GRAPHED REAL_ESTATE inspection whose closing_date is 2026-09-30, so the 24-hour pre-closing deadline 2026-09-29T00:00:00Z is far in the future and cannot interfere."
            - "Three WdoReport rows are opened on that same inspection at the same clock instant 2026-08-03T09:00:00Z, all on FL's mandatory form FL_DACS_13645."
            - "STATE_TURNAROUND_HOURS[FL] is 72, so all three share due_at 2026-08-06T09:00:00Z."
            - "The three reports are then issued one second either side of the 72-hour mark."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "9 Marlin Way", state_code: "FL", construction_type: "SLAB", square_footage: 1800, linear_footage: 160, year_built: 1999, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p3: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Hugo Naim", license_number: "FL-10011", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insh: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p3}", inspector_id: "${insh}", purpose: "REAL_ESTATE", closing_date: "2026-09-30", scheduled_start_at: "2026-08-02T13:00:00Z", scheduled_end_at: "2026-08-02T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insh}"
              captures: { ins3: $.data.id }
            - call: "POST /inspections/${ins3}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insh}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wdo-reports"
              payload: { inspection_id: "${ins3}", form_code: "FL_DACS_13645" }
              as: ComplianceOfficer
              captures: { rptA: $.data.id }
            - call: "POST /wdo-reports"
              payload: { inspection_id: "${ins3}", form_code: "FL_DACS_13645" }
              as: ComplianceOfficer
              captures: { rptB: $.data.id }
            - call: "POST /wdo-reports"
              payload: { inspection_id: "${ins3}", form_code: "FL_DACS_13645" }
              as: ComplianceOfficer
              captures: { rptC: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T08:00:01Z" }
              as: ComplianceOfficer
            - call: "POST /wdo-reports/${rptA}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wdo-reports/${rptB}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T09:00:01Z" }
              as: ComplianceOfficer
            - call: "POST /wdo-reports/${rptC}/issue"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "all three reports carry requested_at 2026-08-03T09:00:00Z and due_at 2026-08-06T09:00:00Z"
            - "report A elapsed 71 h 0 m 1 s: turnaround_hours == 72 (ceil rounds the partial hour UP) yet sla_breached == false, because 72 > 72 is false"
            - "report B at exactly the limit: turnaround_hours == 72 and sla_breached == false — the report delivered on the 72-hour mark is compliant"
            - "report C elapsed 72 h 0 m 1 s: turnaround_hours == 73 and sla_breached == true — one second past the mark costs a whole hour and flips the verdict"
            - "the pair (A, B) proves ceil() is applied and the pair (B, C) proves the comparison is strict, so neither floor() nor >= can reproduce all three rows"
            - "each report's status == ISSUED and issued_at equals its own issuance instant"
            - "GET /wdo-reports?inspection_id=${ins3}&sla_breached=true returns exactly one row, ${rptC}, with total_count 1"
            - "no report is rejected by the closing-lead gate: every issued_at is far below the 2026-09-29T00:00:00Z deadline"
