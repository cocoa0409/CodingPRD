# =============================================================================
# SCAFFOLD — Community Health Needs Assessment & Implementation
# Nonprofit hospital community benefit office
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#            §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Community Health Needs Assessment & Implementation (nonprofit hospital
  community benefit office): assessment cycle with data collection across
  health indicators, community input and stakeholder interviews, priority
  selection with criteria including severity, disparities, community concern
  and hospital capacity to address, implementation strategy development with
  measurable objectives, responsible parties and resource commitments,
  community benefit expense tracking across categories including financial
  assistance, subsidized services and community health improvement,
  partnership agreements with community organizations including funding and
  shared accountability, progress evaluation with annual reporting and
  mid-cycle adjustments, public availability requirements for the assessment
  and strategy, board adoption and regulatory filing with the annual return

domain_name: community-health-needs-assessment
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  difficulty_band: expert
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: graph
  # 13 peer entities linked by explicit foreign keys (no nesting beyond one
  # level in URL paths), plus a self-referential supersede edge on
  # ImplementationStrategy and a many-to-many funding edge
  # (ResourceCommitment) joining ImplementationStrategy, ResponsibleParty and
  # PartnershipAgreement.

  state_machine_shape: posture_driven
  # AssessmentCycle.posture (OPEN | RESTRICTED | FROZEN) is derived from the
  # cycle's own status plus its children's states and gates every child
  # mutation. Layered on top: a cycle (BOARD_REVIEW <-> STRATEGY_DEVELOPMENT),
  # parallel dimensions (ImplementationStrategy.approval_state x
  # execution_state), and a fork-join (PartnershipAgreement signatures).

  relationship_patterns:
    - one_to_many          # AssessmentCycle -> indicators / interviews / candidates / reports / evaluations
    - many_to_many         # ResourceCommitment joins strategy x party x partnership
    - self_referential     # ImplementationStrategy.superseded_by_strategy_id -> ImplementationStrategy.id
    - cross_aggregate      # ExpensePosting.strategy_id crosses the report aggregate into the strategy aggregate

  role_model: segregation_of_duties
  # The officer who assembles the assessment cannot certify its data
  # (DataSteward), cannot adopt it (BoardChair), and cannot lock or file the
  # community benefit report (ComplianceOfficer). Two rules go further and
  # compare X-User-ID values inside a single role.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AssessmentCycle
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the assessment cycle reports on.
        constraints: "2000 <= fiscal_year <= 2100; unique across AssessmentCycle rows"
      - name: service_area_name
        type: string
        source: input
        description: Name of the community served by the assessment.
        constraints: "1..120 chars"
      - name: prior_year_cost_to_charge_ratio
        type: number
        source: input
        description: Unaudited cost-to-charge ratio used to value charge-based community benefit until the report is finalized.
        constraints: "0 < ratio <= 1, exactly 4 decimal places"
      - name: total_operating_expense_cents
        type: integer
        source: input
        description: Total hospital operating expense for the fiscal year; denominator of benefit_pct_of_expense.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Assessment phase.
        default: DRAFT
        constraints: "DRAFT | DATA_COLLECTION | INPUT_GATHERING | PRIORITIZATION | STRATEGY_DEVELOPMENT | BOARD_REVIEW | ADOPTED | PUBLISHED | FILED | CLOSED"
      - name: posture
        type: enum
        source: computed
        description: Derived gate over all child mutations; see calculations.cycle_posture.
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: completed_interview_count
        type: integer
        source: computed
        description: Count of StakeholderInterview rows on this cycle with status == COMPLETED.
        default: 0
      - name: sufficient_indicator_count
        type: integer
        source: computed
        description: Count of HealthIndicator rows on this cycle with data_state == SUFFICIENT.
        default: 0
      - name: selected_priority_count
        type: integer
        source: computed
        description: Count of PriorityCandidate rows on this cycle with status == SELECTED.
        default: 0
      - name: review_flag_count
        type: integer
        source: computed
        description: Count of ImplementationStrategy rows reachable from this cycle whose execution_state == SUSPENDED_PENDING_REVIEW.
        default: 0
      - name: board_deferral_count
        type: integer
        source: system
        description: Number of times a BoardChair DEFER action sent the cycle back to STRATEGY_DEVELOPMENT.
        default: 0
      - name: mid_cycle_adjustment_count
        type: integer
        source: system
        description: Number of published MID_CYCLE ProgressEvaluation rows on this cycle.
        default: 0
      - name: annual_report_count
        type: integer
        source: system
        description: Number of published ANNUAL ProgressEvaluation rows on this cycle.
        default: 0
      - name: adopted_at
        type: datetime
        source: system
        description: Logical-clock instant of the ADOPT board action; null before adoption.
      - name: adoption_board_user_id
        type: string
        source: system
        description: X-User-ID of the BoardChair whose ADOPT action carried the cycle to ADOPTED; null before adoption.
      - name: votes_for_at_adoption
        type: integer
        source: system
        description: votes_for recorded on the ADOPT action; null before adoption.
      - name: votes_against_at_adoption
        type: integer
        source: system
        description: votes_against recorded on the ADOPT action; null before adoption.
      - name: public_url
        type: string
        source: system
        description: Public location of the adopted assessment and implementation strategy; null before publication.
      - name: public_comment_channel
        type: string
        source: system
        description: Channel through which the public may comment on the published assessment.
      - name: public_availability_met
        type: boolean
        source: computed
        description: True once status has reached PUBLISHED with a non-empty public_url; the compliance gate on filing.
        default: false
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of publication; null before publication.
      - name: return_form_id
        type: string
        source: system
        description: Identifier of the annual return the assessment was filed with.
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant of the regulatory filing; null before filing.

  - name: HealthIndicator
    parent: AssessmentCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> AssessmentCycle.id; the cycle collecting this indicator.
      - name: domain
        type: enum
        source: input
        description: Health domain the indicator belongs to; joins to StakeholderInterview.concern_ratings keys.
        constraints: "BEHAVIORAL_HEALTH | CHRONIC_DISEASE | MATERNAL_CHILD_HEALTH | ACCESS_TO_CARE | HOUSING_AND_FOOD"
      - name: name
        type: string
        source: input
        description: Indicator label.
        constraints: "1..160 chars; unique per (cycle_id, name)"
      - name: benchmark_value
        type: number
        source: input
        description: Comparison benchmark (state or national rate) the community rate is measured against.
        constraints: "> 0, at most 4 decimal places"
      - name: latest_overall_value
        type: number
        source: computed
        description: Value of the newest ACTIVE IndicatorDataPoint whose population_subgroup == "OVERALL"; null when none exists.
      - name: severity_score
        type: number
        source: computed
        description: See calculations.indicator_severity_score; null when latest_overall_value is null.
      - name: disparity_ratio
        type: number
        source: computed
        description: See calculations.indicator_disparity_ratio; null when fewer than 2 non-OVERALL subgroups have ACTIVE data.
      - name: subgroup_count
        type: integer
        source: computed
        description: Number of distinct population_subgroup values other than "OVERALL" with at least one ACTIVE IndicatorDataPoint.
        default: 0
      - name: evidence_count
        type: integer
        source: computed
        description: Number of ACTIVE IndicatorDataPoint rows on this indicator.
        default: 0
      - name: data_state
        type: enum
        source: computed
        description: SUFFICIENT iff latest_overall_value is not null AND subgroup_count >= 2; otherwise INSUFFICIENT.
        default: INSUFFICIENT
        constraints: "SUFFICIENT | INSUFFICIENT"

  - name: IndicatorDataPoint
    parent: HealthIndicator
    common_fields: true
    fields:
      - name: indicator_id
        type: string
        source: input
        description: FK -> HealthIndicator.id; the indicator this observation measures.
      - name: population_subgroup
        type: string
        source: input
        description: Population stratum the value describes; the literal "OVERALL" denotes the whole service area.
        constraints: "1..60 chars, upper snake case"
      - name: source_type
        type: enum
        source: input
        description: Provenance of the observation.
        constraints: "PUBLIC_DATASET | HOSPITAL_EHR | COMMUNITY_SURVEY | VITAL_STATISTICS"
      - name: value
        type: number
        source: input
        description: Observed rate for this subgroup.
        constraints: "> 0, at most 4 decimal places"
      - name: collected_on
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the observation was collected.
      - name: status
        type: enum
        source: system
        description: ACTIVE observations feed indicator computations; VOID observations are excluded but retained.
        default: ACTIVE
        constraints: "ACTIVE | VOID"
      - name: void_reason
        type: string
        source: input
        description: Reason recorded when the observation was voided; null while ACTIVE.
      - name: voided_by_user_id
        type: string
        source: system
        description: X-User-ID of the DataSteward who voided the observation; null while ACTIVE.

  - name: ResponsibleParty
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Organization or internal department accountable for work.
        constraints: "1..120 chars"
      - name: party_type
        type: enum
        source: input
        description: INTERNAL parties may facilitate stakeholder interviews; PARTNER parties may hold partnership agreements.
        constraints: "INTERNAL | PARTNER"
      - name: fte_capacity_bp
        type: integer
        source: input
        description: Effort capacity in basis points of one FTE (10000 bp == 1.00 FTE) available for commitments.
        constraints: ">= 0, <= 100000"
      - name: committed_fte_bp
        type: integer
        source: computed
        description: See calculations.party_committed_fte; conserved quantity of the effort-capacity invariant.
        default: 0

  - name: StakeholderInterview
    parent: AssessmentCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> AssessmentCycle.id; the cycle gathering this input.
      - name: facilitator_party_id
        type: string
        source: input
        description: FK -> ResponsibleParty.id; the INTERNAL party facilitating the session, whose window occupancy is checked.
      - name: organization_name
        type: string
        source: input
        description: Community organization interviewed.
        constraints: "1..120 chars; unique per (cycle_id, organization_name) among rows with status IN {SCHEDULED, COMPLETED}"
      - name: sector
        type: enum
        source: input
        description: Sector the interviewed organization represents.
        constraints: "SAFETY_NET_PROVIDER | PUBLIC_HEALTH_AGENCY | SCHOOL_DISTRICT | FAITH_BASED | RESIDENT_COALITION | PAYER"
      - name: starts_at
        type: datetime
        source: input
        description: Inclusive start of the session window (ISO 8601 UTC).
      - name: ends_at
        type: datetime
        source: input
        description: Exclusive end of the session window (ISO 8601 UTC).
        constraints: "ends_at > starts_at; (ends_at - starts_at) <= 240 minutes"
      - name: status
        type: enum
        source: system
        description: Session lifecycle.
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | CANCELLED"
      - name: concern_ratings
        type: object
        source: input
        description: Map of HealthIndicator.domain enum member -> integer community-concern rating 1..5 recorded at completion; null while SCHEDULED.
      - name: attendee_count
        type: integer
        source: input
        description: Number of community attendees; the weight in calculations.community_concern_index.
        constraints: ">= 1 when supplied at completion"
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the session was completed; null unless status == COMPLETED.
      - name: cancel_reason
        type: string
        source: input
        description: Reason recorded when the session was cancelled; null unless status == CANCELLED.

  - name: PriorityCandidate
    parent: AssessmentCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> AssessmentCycle.id; the cycle prioritizing this need.
      - name: indicator_id
        type: string
        source: input
        description: FK -> HealthIndicator.id; the indicator supplying severity and disparity inputs.
      - name: hospital_capacity_score
        type: number
        source: input
        description: Assessed hospital capacity to address the need, 0..100.
        constraints: "0 <= score <= 100, at most 2 decimal places"
      - name: scoring_variant
        type: enum
        source: system
        description: Weighting variant applied by the most recent scoring run; null before first scoring.
        constraints: "EQUAL_WEIGHT | COMMUNITY_WEIGHTED"
      - name: severity_input
        type: number
        source: computed
        description: Snapshot of HealthIndicator.severity_score taken by the most recent scoring run; null before first scoring.
      - name: disparity_points
        type: number
        source: computed
        description: Snapshot of the disparity term from the most recent scoring run; see calculations.candidate_composite_score.
      - name: community_concern_index
        type: number
        source: computed
        description: See calculations.community_concern_index; snapshot taken by the most recent scoring run.
      - name: composite_score
        type: number
        source: computed
        description: See calculations.candidate_composite_score; null before first scoring and null again after score invalidation.
      - name: status
        type: enum
        source: system
        description: Prioritization lifecycle.
        default: DRAFT
        constraints: "DRAFT | SCORED | SELECTED | DEFERRED | SCORE_INVALIDATED"
      - name: concern_input_dirty
        type: boolean
        source: system
        description: Set true when a StakeholderInterview completing after this candidate was scored carries a concern rating for the candidate's indicator domain; cleared by re-scoring.
        default: false
      - name: selection_rationale
        type: string
        source: input
        description: Rationale recorded at selection; null unless the candidate has been SELECTED.
      - name: defer_reason
        type: string
        source: input
        description: Reason recorded at deferral; null unless the candidate has been DEFERRED.
      - name: strategy_count
        type: integer
        source: system
        description: Number of ImplementationStrategy rows created against this candidate, including superseded ones.
        default: 0

  - name: ImplementationStrategy
    parent: PriorityCandidate
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: FK -> PriorityCandidate.id; the selected priority this strategy addresses.
      - name: title
        type: string
        source: input
        description: Strategy title.
        constraints: "1..160 chars"
      - name: authorized_budget_cents
        type: integer
        source: input
        description: Total resource envelope the officer authorizes for commitments under this strategy.
        constraints: ">= 0"
      - name: budget_available_cents
        type: integer
        source: computed
        description: See calculations.strategy_budget_available; conserved quantity of the funding invariant.
      - name: approval_state
        type: enum
        source: system
        description: Governance axis, independent of execution_state.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | RETURNED | SUPERSEDED"
      - name: execution_state
        type: enum
        source: system
        description: Delivery axis, independent of approval_state.
        default: NOT_STARTED
        constraints: "NOT_STARTED | ON_TRACK | AT_RISK | BEHIND | SUSPENDED_PENDING_REVIEW | COMPLETED | DISCONTINUED | CLOSED_OUT"
      - name: superseded_by_strategy_id
        type: string
        source: system
        description: FK -> ImplementationStrategy.id; set on the older strategy when a newer strategy for the same candidate supersedes it; null otherwise.
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submission; null while never submitted.
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant approval was granted by board adoption; null before approval.
      - name: active_objective_count
        type: integer
        source: computed
        description: Number of StrategyObjective rows on this strategy with status == ACTIVE.
        default: 0
      - name: execution_note
        type: string
        source: input
        description: Note recorded with the most recent execution-status change; null before the first change.

  - name: StrategyObjective
    parent: ImplementationStrategy
    common_fields: true
    fields:
      - name: strategy_id
        type: string
        source: input
        description: FK -> ImplementationStrategy.id; the strategy this measurable objective belongs to.
      - name: metric_name
        type: string
        source: input
        description: Measure being moved.
        constraints: "1..160 chars"
      - name: baseline_value
        type: number
        source: input
        description: Measure value at the start of the cycle.
        constraints: ">= 0, at most 4 decimal places"
      - name: target_value
        type: number
        source: input
        description: Measure value the strategy commits to reach.
        constraints: ">= 0, at most 4 decimal places"
      - name: target_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) by which target_value is to be reached.
      - name: actual_value
        type: number
        source: input
        description: Most recently reported measure value; null before the first progress report.
      - name: as_of_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the reported actual_value was measured; null before the first progress report.
      - name: attainment_pct
        type: number
        source: computed
        description: See calculations.objective_attainment; null before the first progress report.
      - name: attainment_status
        type: enum
        source: computed
        description: PENDING before any progress report, else derived from attainment_pct by calculations.objective_attainment.
        default: PENDING
        constraints: "PENDING | NOT_MET | PARTIAL | MET"
      - name: status
        type: enum
        source: system
        description: Objective lifecycle; ACTIVE objectives have locked baselines.
        default: DRAFT
        constraints: "DRAFT | ACTIVE | REVISED | FINALIZED_MET | FINALIZED_NOT_MET"
      - name: baseline_locked_at
        type: datetime
        source: system
        description: Logical-clock instant baseline_value became immutable through strategy approval; null while DRAFT.

  - name: PartnershipAgreement
    parent: AssessmentCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> AssessmentCycle.id; the cycle the agreement supports.
      - name: party_id
        type: string
        source: input
        description: FK -> ResponsibleParty.id; the PARTNER organization signing the agreement.
      - name: pledged_cents
        type: integer
        source: input
        description: Funding the agreement pledges; the aggregate cap over any overlapping commitment window.
        constraints: ">= 1"
      - name: funded_cents
        type: integer
        source: computed
        description: Sum of funding_cents over ResourceCommitment rows referencing this agreement with status == COMMITTED.
        default: 0
      - name: accountability_metric
        type: string
        source: input
        description: Shared metric both parties are held to.
        constraints: "1..160 chars"
      - name: shared_accountability_pct
        type: number
        source: input
        description: Share of accountability for accountability_metric borne by the partner, 0..100.
        constraints: "0 <= pct <= 100, at most 2 decimal places"
      - name: term_start
        type: string
        source: input
        description: Inclusive first calendar date (YYYY-MM-DD) of the agreement term.
      - name: term_end
        type: string
        source: input
        description: Inclusive last calendar date (YYYY-MM-DD) of the agreement term.
        constraints: "term_end >= term_start"
      - name: signature_state
        type: enum
        source: system
        description: Fork-join signature axis; EXECUTED requires both sides signed.
        default: NEGOTIATING
        constraints: "NEGOTIATING | HOSPITAL_SIGNED | PARTNER_SIGNED | EXECUTED | TERMINATED"
      - name: funding_state
        type: enum
        source: system
        description: Funding axis, advanced by commitment activation and release.
        default: UNFUNDED
        constraints: "UNFUNDED | PLEDGED | FUNDED | RELEASED"
      - name: hospital_signed_at
        type: datetime
        source: system
        description: Logical-clock instant the hospital side signed; null until signed.
      - name: partner_signed_at
        type: datetime
        source: system
        description: Logical-clock instant the partner side signed; null until signed.
      - name: hospital_signatory_user_id
        type: string
        source: system
        description: X-User-ID of the CommunityBenefitOfficer who signed for the hospital; null until signed.
      - name: partner_signatory_user_id
        type: string
        source: system
        description: X-User-ID of the PartnerRepresentative who signed for the partner; equals party_id.
      - name: terminate_reason
        type: string
        source: input
        description: Reason recorded at termination; null unless signature_state == TERMINATED.

  - name: ResourceCommitment
    parent: ImplementationStrategy
    common_fields: true
    fields:
      - name: strategy_id
        type: string
        source: input
        description: FK -> ImplementationStrategy.id; the strategy the resources are committed to.
      - name: party_id
        type: string
        source: input
        description: FK -> ResponsibleParty.id; the party contributing effort and funding.
      - name: partnership_id
        type: string
        source: input
        description: FK -> PartnershipAgreement.id; the agreement funding this commitment, or null for unfunded internal effort.
      - name: fte_bp
        type: integer
        source: input
        description: Effort committed in basis points of one FTE.
        constraints: ">= 0, <= 100000"
      - name: funding_cents
        type: integer
        source: input
        description: Funding committed from the strategy's authorized envelope.
        constraints: ">= 0"
      - name: effective_from
        type: string
        source: input
        description: Inclusive first calendar date (YYYY-MM-DD) the commitment covers.
      - name: effective_to
        type: string
        source: input
        description: Exclusive last calendar date (YYYY-MM-DD) the commitment covers; the final covered day is effective_to minus one day.
        constraints: "effective_to > effective_from"
      - name: status
        type: enum
        source: system
        description: Commitment lifecycle; PENDING and COMMITTED both encumber budget and effort.
        default: PENDING
        constraints: "PENDING | COMMITTED | RELEASED"
      - name: committed_at
        type: datetime
        source: system
        description: Logical-clock instant the commitment was activated by board adoption; null while PENDING.
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant the commitment was released; null unless status == RELEASED.
      - name: release_reason
        type: string
        source: input
        description: Reason recorded at release; null unless status == RELEASED.

  - name: CommunityBenefitReport
    parent: AssessmentCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> AssessmentCycle.id; the cycle whose community benefit is being tallied.
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the expense tally covers.
        constraints: "2000 <= fiscal_year <= 2100; unique per (cycle_id, fiscal_year)"
      - name: valuation_basis
        type: enum
        source: system
        description: PROVISIONAL while the unaudited ratio applies; FINAL once an audited ratio has been supplied.
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL"
      - name: cost_to_charge_ratio
        type: number
        source: system
        description: Ratio currently applied to charge-based categories; copied from AssessmentCycle.prior_year_cost_to_charge_ratio at creation and replaced by audited_cost_to_charge_ratio when the report is finalized.
      - name: audited_cost_to_charge_ratio
        type: number
        source: input
        description: Audited ratio supplied at finalization; null while the report is OPEN.
        constraints: "0 < ratio <= 1, exactly 4 decimal places"
      - name: status
        type: enum
        source: system
        description: Report lifecycle.
        default: OPEN
        constraints: "OPEN | LOCKED | FILED"
      - name: financial_assistance_cents
        type: integer
        source: computed
        description: Sum of valued_cents over POSTED postings with category == FINANCIAL_ASSISTANCE.
        default: 0
      - name: subsidized_services_cents
        type: integer
        source: computed
        description: Sum of valued_cents over POSTED postings with category == SUBSIDIZED_SERVICES.
        default: 0
      - name: community_health_improvement_cents
        type: integer
        source: computed
        description: Sum of valued_cents over POSTED postings with category == COMMUNITY_HEALTH_IMPROVEMENT.
        default: 0
      - name: cash_and_inkind_cents
        type: integer
        source: computed
        description: Sum of valued_cents over POSTED postings with category == CASH_AND_INKIND.
        default: 0
      - name: community_building_cents
        type: integer
        source: computed
        description: Sum of valued_cents over POSTED postings with category == COMMUNITY_BUILDING.
        default: 0
      - name: total_valued_cents
        type: integer
        source: computed
        description: See calculations.report_category_totals; the direct benefit base.
        default: 0
      - name: overhead_rate
        type: number
        source: computed
        description: Indirect-cost rate selected by calculations.report_indirect_and_grand_total from total_valued_cents.
        default: 0.05
      - name: indirect_allocation_cents
        type: integer
        source: computed
        description: See calculations.report_indirect_and_grand_total.
        default: 0
      - name: grand_total_cents
        type: integer
        source: computed
        description: total_valued_cents + indirect_allocation_cents.
        default: 0
      - name: benefit_pct_of_expense
        type: number
        source: computed
        description: grand_total_cents as a percentage of AssessmentCycle.total_operating_expense_cents, 2 decimal places.
        default: 0.00
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the CommunityBenefitOfficer who opened the report.
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who locked the report; null while OPEN.
      - name: locked_at
        type: datetime
        source: system
        description: Logical-clock instant the report was locked; null while OPEN.
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant the report was filed with the annual return; null before filing.

  - name: ExpensePosting
    parent: CommunityBenefitReport
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: input
        description: FK -> CommunityBenefitReport.id; the report this expense posts to.
      - name: strategy_id
        type: string
        source: input
        description: FK -> ImplementationStrategy.id; the approved strategy the expense implements, or null for expenses outside the implementation strategy.
      - name: category
        type: enum
        source: input
        description: Community benefit category; FINANCIAL_ASSISTANCE and SUBSIDIZED_SERVICES are charge-based, the rest are cost-based.
        constraints: "FINANCIAL_ASSISTANCE | SUBSIDIZED_SERVICES | COMMUNITY_HEALTH_IMPROVEMENT | CASH_AND_INKIND | COMMUNITY_BUILDING"
      - name: charges_cents
        type: integer
        source: input
        description: Gross charges for charge-based categories; must be 0 for cost-based categories.
        constraints: ">= 0"
      - name: direct_cost_cents
        type: integer
        source: input
        description: Direct cost for cost-based categories; must be 0 for charge-based categories.
        constraints: ">= 0"
      - name: valued_cents
        type: integer
        source: computed
        description: See calculations.posting_valued_amount.
      - name: valuation_basis_at_posting
        type: enum
        source: system
        description: The report's valuation_basis in force when valued_cents was last computed.
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL"
      - name: ratio_applied
        type: number
        source: system
        description: Cost-to-charge ratio used by the most recent valuation; null for cost-based categories.
      - name: status
        type: enum
        source: system
        description: POSTED entries feed report totals; VOID entries are excluded but retained.
        default: POSTED
        constraints: "POSTED | VOID"
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID of the user who created the posting; compared against the voiding user for segregation of duties.
      - name: void_reason
        type: string
        source: input
        description: Reason recorded at voiding; null while POSTED.
      - name: voided_by_user_id
        type: string
        source: system
        description: X-User-ID of the user who voided the posting; null while POSTED.

  - name: ProgressEvaluation
    parent: AssessmentCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> AssessmentCycle.id; the cycle being evaluated.
      - name: eval_type
        type: enum
        source: input
        description: ANNUAL evaluations satisfy the annual reporting requirement; MID_CYCLE evaluations trigger objective revision.
        constraints: "ANNUAL | MID_CYCLE"
      - name: period_year
        type: integer
        source: input
        description: Calendar year the evaluation reports on.
        constraints: "2000 <= period_year <= 2100; unique per (cycle_id, eval_type, period_year)"
      - name: findings_summary
        type: string
        source: input
        description: Narrative findings; optional at creation.
      - name: status
        type: enum
        source: system
        description: Evaluation lifecycle; publication is what makes the evaluation count.
        default: DRAFT
        constraints: "DRAFT | PUBLISHED"
      - name: public_url
        type: string
        source: input
        description: Public location of the evaluation; null while DRAFT.
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of publication; null while DRAFT.
      - name: objectives_revised_count
        type: integer
        source: computed
        description: Number of StrategyObjective rows this evaluation moved to REVISED at publication.
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- AssessmentCycle: linear phase chain with one governance cycle -------
  - entity: AssessmentCycle
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: DATA_COLLECTION
        trigger: "POST /assessment-cycles/{cycle_id}/advance with to_status = DATA_COLLECTION"
        actor: CommunityBenefitOfficer
        preconditions:
          - "cycle.status == DRAFT"
        side_effects:
          - "recompute AssessmentCycle.posture (DATA_COLLECTION yields OPEN)"
          - "increments AssessmentCycle.version by 1"

      - from: DATA_COLLECTION
        to: INPUT_GATHERING
        trigger: "POST /assessment-cycles/{cycle_id}/advance with to_status = INPUT_GATHERING"
        actor: CommunityBenefitOfficer
        preconditions:
          - "cycle.status == DATA_COLLECTION"
          - "cycle.sufficient_indicator_count >= 1, else ERR_INSUFFICIENT_INDICATOR_COVERAGE"
        side_effects:
          - "increments AssessmentCycle.version by 1"

      - from: INPUT_GATHERING
        to: PRIORITIZATION
        trigger: "POST /assessment-cycles/{cycle_id}/advance with to_status = PRIORITIZATION"
        actor: CommunityBenefitOfficer
        preconditions:
          - "cycle.status == INPUT_GATHERING"
          - "cycle.completed_interview_count >= 1, else ERR_NO_COMMUNITY_INPUT"
        side_effects:
          - "closes the interview scheduling window: further POST /stakeholder-interviews on this cycle is rejected with ERR_INPUT_WINDOW_CLOSED, while completing or cancelling already-SCHEDULED interviews stays permitted"
          - "increments AssessmentCycle.version by 1"
        note: "Interviews already SCHEDULED may still complete during PRIORITIZATION; that is what makes PriorityCandidate.concern_input_dirty reachable."

      - from: PRIORITIZATION
        to: STRATEGY_DEVELOPMENT
        trigger: "POST /assessment-cycles/{cycle_id}/advance with to_status = STRATEGY_DEVELOPMENT"
        actor: CommunityBenefitOfficer
        preconditions:
          - "cycle.status == PRIORITIZATION"
          - "cycle.selected_priority_count >= 1, else ERR_NO_SELECTED_PRIORITY"
        side_effects:
          - "conditional cascade down: every PriorityCandidate on this cycle whose status IN {DRAFT, SCORED, SCORE_INVALIDATED} moves to DEFERRED with defer_reason = 'NOT_SELECTED_AT_PRIORITY_LOCK'; candidates already SELECTED or DEFERRED are untouched"
          - "recompute AssessmentCycle.selected_priority_count"
          - "increments AssessmentCycle.version by 1"

      - from: STRATEGY_DEVELOPMENT
        to: BOARD_REVIEW
        trigger: "POST /assessment-cycles/{cycle_id}/advance with to_status = BOARD_REVIEW"
        actor: CommunityBenefitOfficer
        preconditions:
          - "cycle.status == STRATEGY_DEVELOPMENT"
          - "every PriorityCandidate on this cycle with status == SELECTED has at least one ImplementationStrategy whose approval_state == SUBMITTED and whose active-or-draft objective count (StrategyObjective rows with status IN {DRAFT, ACTIVE}) is >= 1, else ERR_STRATEGY_SET_INCOMPLETE"
        side_effects:
          - "recompute AssessmentCycle.posture -> RESTRICTED (assessment-side child mutations are frozen while the board deliberates)"
          - "increments AssessmentCycle.version by 1"

      - from: BOARD_REVIEW
        to: STRATEGY_DEVELOPMENT
        trigger: "POST /assessment-cycles/{cycle_id}/board-action with action_type = DEFER"
        actor: BoardChair
        preconditions:
          - "cycle.status == BOARD_REVIEW"
          - "quorum_present == true, else ERR_QUORUM_NOT_MET"
        side_effects:
          - "every ImplementationStrategy reachable from this cycle whose approval_state == SUBMITTED moves to RETURNED; submitted_at is retained"
          - "AssessmentCycle.board_deferral_count += 1"
          - "recompute AssessmentCycle.posture (returns to OPEN when review_flag_count == 0)"
          - "increments AssessmentCycle.version by 1"
        note: "Governance cycle: BOARD_REVIEW -> STRATEGY_DEVELOPMENT -> BOARD_REVIEW is repeatable without bound."

      - from: BOARD_REVIEW
        to: ADOPTED
        trigger: "POST /assessment-cycles/{cycle_id}/board-action with action_type = ADOPT"
        actor: BoardChair
        preconditions:
          - "cycle.status == BOARD_REVIEW"
          - "quorum_present == true, else ERR_QUORUM_NOT_MET"
          - "votes_for > votes_against, else ERR_ADOPTION_VOTE_FAILED"
        side_effects:
          - "CASCADE LINK 1: every ImplementationStrategy reachable from this cycle whose approval_state == SUBMITTED moves to APPROVED and stamps approved_at from the logical clock"
          - "CASCADE LINK 2 (caused by link 1): for each strategy that just became APPROVED, every StrategyObjective of that strategy with status == DRAFT moves to ACTIVE and stamps baseline_locked_at; that strategy's execution_state moves NOT_STARTED -> ON_TRACK"
          - "CASCADE LINK 3 (caused by link 2): for each strategy whose active_objective_count rose from 0 to >= 1 in link 2, every ResourceCommitment of that strategy with status == PENDING moves to COMMITTED, stamps committed_at, adds fte_bp to ResponsibleParty.committed_fte_bp, and — when partnership_id is non-null — adds funding_cents to PartnershipAgreement.funded_cents and moves that agreement's funding_state PLEDGED -> FUNDED"
          - "AssessmentCycle.adopted_at, adoption_board_user_id, votes_for_at_adoption and votes_against_at_adoption are stamped"
          - "recompute AssessmentCycle.posture -> OPEN when review_flag_count == 0"
          - "increments AssessmentCycle.version by 1"

      - from: ADOPTED
        to: PUBLISHED
        trigger: "POST /assessment-cycles/{cycle_id}/publish"
        actor: CommunityBenefitOfficer
        preconditions:
          - "cycle.status == ADOPTED"
          - "cycle.adopted_at is not null"
        side_effects:
          - "stores public_url and public_comment_channel, stamps published_at from the logical clock"
          - "sets AssessmentCycle.public_availability_met = true"
          - "increments AssessmentCycle.version by 1"

      - from: PUBLISHED
        to: FILED
        trigger: "POST /assessment-cycles/{cycle_id}/file-return"
        actor: ComplianceOfficer
        preconditions:
          - "cycle.status IN {ADOPTED, PUBLISHED}"
          - "cycle.public_availability_met == true, else ERR_PUBLIC_AVAILABILITY_NOT_MET"
          - "exactly one CommunityBenefitReport with cycle_id == cycle.id exists and its status == LOCKED, else ERR_REPORT_NOT_LOCKED"
        side_effects:
          - "stores return_form_id, stamps filed_at from the logical clock"
          - "the cycle's CommunityBenefitReport moves LOCKED -> FILED and stamps its filed_at"
          - "recompute AssessmentCycle.posture -> FROZEN"
          - "increments AssessmentCycle.version by 1"
        note: "The from-state set deliberately admits ADOPTED so that the compliance check, not the phase check, is the rule that rejects an unpublished filing."

      - from: FILED
        to: CLOSED
        trigger: "POST /assessment-cycles/{cycle_id}/advance with to_status = CLOSED"
        actor: ComplianceOfficer
        preconditions:
          - "cycle.status == FILED"
          - "at least one ProgressEvaluation with cycle_id == cycle.id, eval_type == ANNUAL and status == PUBLISHED exists, else ERR_ANNUAL_REPORT_MISSING"
        side_effects:
          - "conditional cascade: every ImplementationStrategy reachable from this cycle whose execution_state IN {ON_TRACK, AT_RISK, BEHIND, SUSPENDED_PENDING_REVIEW} moves to CLOSED_OUT"
          - "conditional cascade (caused by the strategy close-out): every StrategyObjective of those strategies with status IN {ACTIVE, REVISED} moves to FINALIZED_MET when attainment_pct is not null and attainment_pct >= 100.00, otherwise to FINALIZED_NOT_MET"
          - "AssessmentCycle.posture stays FROZEN"
          - "increments AssessmentCycle.version by 1"

  # ---- HealthIndicator: compound state derived from its data points --------
  - entity: HealthIndicator
    initial_state: INSUFFICIENT
    terminal_states: []
    transitions:
      - from: INSUFFICIENT
        to: SUFFICIENT
        trigger: "POST /health-indicators/{indicator_id}/data-points (system re-derivation after the observation is stored)"
        actor: system
        preconditions:
          - "after storing the new ACTIVE IndicatorDataPoint: latest_overall_value is not null AND subgroup_count >= 2"
        side_effects:
          - "recompute latest_overall_value, severity_score, disparity_ratio, subgroup_count, evidence_count"
          - "AssessmentCycle.sufficient_indicator_count += 1"
          - "increments HealthIndicator.version by 1"

      - from: SUFFICIENT
        to: SUFFICIENT
        trigger: "POST /health-indicators/{indicator_id}/data-points on an indicator that already qualifies"
        actor: system
        preconditions:
          - "after storing the new ACTIVE IndicatorDataPoint the qualification criteria still hold"
        side_effects:
          - "recompute latest_overall_value, severity_score, disparity_ratio, subgroup_count, evidence_count"
          - "increments HealthIndicator.version by 1"
        note: "Re-derivation on an already-SUFFICIENT indicator does NOT invalidate candidate scores; only a void does."

      - from: SUFFICIENT
        to: INSUFFICIENT
        trigger: "POST /indicator-data-points/{data_point_id}/void (system re-derivation after the observation is voided)"
        actor: system
        preconditions:
          - "after voiding: latest_overall_value is null OR subgroup_count < 2"
        side_effects:
          - "recompute latest_overall_value, severity_score, disparity_ratio, subgroup_count, evidence_count; severity_score and disparity_ratio become null when their inputs disappear"
          - "AssessmentCycle.sufficient_indicator_count -= 1"
          - "CASCADE LINK 2 (caused by this indicator losing sufficiency): every PriorityCandidate with indicator_id == this indicator whose status IN {SCORED, SELECTED} moves to SCORE_INVALIDATED and its composite_score, severity_input, disparity_points and community_concern_index are set to null"
          - "CASCADE LINK 3 (caused by link 2): for every candidate that was SELECTED before link 2, each ImplementationStrategy with candidate_id == that candidate whose execution_state NOT IN {COMPLETED, DISCONTINUED, CLOSED_OUT} moves to SUSPENDED_PENDING_REVIEW; AssessmentCycle.review_flag_count is recomputed and AssessmentCycle.posture becomes RESTRICTED while review_flag_count >= 1"
          - "increments HealthIndicator.version by 1"

  # ---- IndicatorDataPoint --------------------------------------------------
  - entity: IndicatorDataPoint
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: VOID
        trigger: "POST /indicator-data-points/{data_point_id}/void"
        actor: DataSteward
        preconditions:
          - "data_point.status == ACTIVE, else ERR_INVALID_STATE"
          - "the owning cycle's posture != FROZEN, else ERR_CYCLE_FROZEN"
        side_effects:
          - "stores void_reason and voided_by_user_id"
          - "CASCADE LINK 1: the owning HealthIndicator re-derives its computed fields and may transition SUFFICIENT -> INSUFFICIENT, which starts links 2 and 3 above"
          - "increments IndicatorDataPoint.version by 1"
        note: "Voiding is exempt from the RESTRICTED posture gate: a data-quality retraction must remain possible while the board deliberates."

  # ---- StakeholderInterview: branching to two terminal outcomes ------------
  - entity: StakeholderInterview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /stakeholder-interviews/{interview_id}/complete"
        actor: CommunityBenefitOfficer
        preconditions:
          - "interview.status == SCHEDULED, else ERR_INVALID_STATE"
          - "owning cycle.status IN {INPUT_GATHERING, PRIORITIZATION}, else ERR_INVALID_STATE"
          - "every key of concern_ratings is a HealthIndicator.domain enum member and every value is an integer in 1..5, else ERR_VALIDATION"
        side_effects:
          - "stores concern_ratings and attendee_count, stamps completed_at from the logical clock"
          - "AssessmentCycle.completed_interview_count += 1"
          - "derived-field reconciliation: every PriorityCandidate on the same cycle whose status == SCORED and whose indicator's domain is a key of concern_ratings has concern_input_dirty set to true"
          - "increments StakeholderInterview.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /stakeholder-interviews/{interview_id}/cancel"
        actor: CommunityBenefitOfficer
        preconditions:
          - "interview.status == SCHEDULED, else ERR_INVALID_STATE"
          - "owning cycle.status IN {INPUT_GATHERING, PRIORITIZATION}, else ERR_INVALID_STATE"
        side_effects:
          - "stores cancel_reason"
          - "releases the facilitator window: the row leaves the occupancy set used by validations[priority=15] so a later session may reuse the slot"
          - "increments StakeholderInterview.version by 1"

  # ---- PriorityCandidate: cyclic through score invalidation ----------------
  - entity: PriorityCandidate
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SCORED
        trigger: "POST /priority-candidates/{candidate_id}/score"
        actor: CommunityBenefitOfficer
        preconditions:
          - "candidate.status IN {DRAFT, SCORED, SCORE_INVALIDATED}, else ERR_INVALID_STATE"
          - "owning cycle.status == PRIORITIZATION, else ERR_INVALID_STATE"
          - "the candidate's HealthIndicator.data_state == SUFFICIENT, else ERR_INDICATOR_DATA_INSUFFICIENT"
          - "at least one COMPLETED StakeholderInterview on the cycle carries a concern_ratings key equal to the indicator's domain, else ERR_NO_DOMAIN_INPUT"
        side_effects:
          - "runs calculations.community_concern_index and calculations.candidate_composite_score; stores scoring_variant, severity_input, disparity_points, community_concern_index and composite_score"
          - "sets concern_input_dirty = false"
          - "increments PriorityCandidate.version by 1"

      - from: SCORED
        to: SCORED
        trigger: "POST /priority-candidates/{candidate_id}/score (re-score, e.g. with the other weighting variant or after new community input)"
        actor: CommunityBenefitOfficer
        preconditions:
          - "same preconditions as DRAFT -> SCORED"
        side_effects:
          - "same side effects as DRAFT -> SCORED; the previous composite_score is overwritten"
          - "increments PriorityCandidate.version by 1"

      - from: SCORED
        to: SELECTED
        trigger: "POST /priority-candidates/{candidate_id}/select"
        actor: CommunityBenefitOfficer
        preconditions:
          - "candidate.status == SCORED, else ERR_INVALID_STATE"
          - "owning cycle.status == PRIORITIZATION, else ERR_INVALID_STATE"
          - "candidate.concern_input_dirty == false, else ERR_STALE_CONCERN_INPUT"
          - "candidate.composite_score >= 60.00, else ERR_PRIORITY_SCORE_BELOW_THRESHOLD"
        side_effects:
          - "stores selection_rationale"
          - "AssessmentCycle.selected_priority_count += 1"
          - "increments PriorityCandidate.version by 1"

      - from: SCORED
        to: DEFERRED
        trigger: "POST /priority-candidates/{candidate_id}/defer"
        actor: CommunityBenefitOfficer
        preconditions:
          - "candidate.status IN {DRAFT, SCORED, SELECTED, SCORE_INVALIDATED}, else ERR_INVALID_STATE"
          - "owning cycle.status == PRIORITIZATION, else ERR_INVALID_STATE"
        side_effects:
          - "stores defer_reason"
          - "when the candidate was SELECTED: AssessmentCycle.selected_priority_count -= 1 and every ImplementationStrategy with candidate_id == this candidate whose approval_state IN {DRAFT, RETURNED} moves to SUPERSEDED"
          - "increments PriorityCandidate.version by 1"

      - from: SELECTED
        to: SCORE_INVALIDATED
        trigger: "system re-derivation when the candidate's HealthIndicator transitions SUFFICIENT -> INSUFFICIENT"
        actor: system
        preconditions:
          - "candidate.status IN {SCORED, SELECTED}"
        side_effects:
          - "composite_score, severity_input, disparity_points and community_concern_index are set to null"
          - "when the candidate was SELECTED: AssessmentCycle.selected_priority_count -= 1 and cascade link 3 suspends the candidate's strategies"
          - "increments PriorityCandidate.version by 1"

      - from: SCORE_INVALIDATED
        to: SCORED
        trigger: "POST /priority-candidates/{candidate_id}/score after the indicator regains SUFFICIENT data_state"
        actor: CommunityBenefitOfficer
        preconditions:
          - "the candidate's HealthIndicator.data_state == SUFFICIENT, else ERR_INDICATOR_DATA_INSUFFICIENT"
          - "owning cycle.status == PRIORITIZATION, else ERR_INVALID_STATE"
        side_effects:
          - "recomputes and stores the score fields; the candidate must be re-selected explicitly"
          - "increments PriorityCandidate.version by 1"
        note: "Closes the cycle SCORED -> SELECTED -> SCORE_INVALIDATED -> SCORED."

  # ---- ImplementationStrategy: parallel axes (approval x execution) --------
  - entity: ImplementationStrategy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /implementation-strategies/{strategy_id}/submit"
        actor: CommunityBenefitOfficer
        preconditions:
          - "strategy.approval_state IN {DRAFT, RETURNED}, else ERR_INVALID_STATE"
          - "owning cycle.status == STRATEGY_DEVELOPMENT, else ERR_INVALID_STATE"
          - "the strategy has at least one StrategyObjective with status == DRAFT, else ERR_STRATEGY_SET_INCOMPLETE"
        side_effects:
          - "stamps submitted_at from the logical clock"
          - "execution_state is untouched (approval axis moves alone)"
          - "increments ImplementationStrategy.version by 1"

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /implementation-strategies/{strategy_id}/submit after a board DEFER"
        actor: CommunityBenefitOfficer
        preconditions:
          - "strategy.approval_state == RETURNED"
          - "owning cycle.status == STRATEGY_DEVELOPMENT, else ERR_INVALID_STATE"
        side_effects:
          - "re-stamps submitted_at from the logical clock"
          - "increments ImplementationStrategy.version by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "cascade link 1 of the ADOPT board action on the owning AssessmentCycle"
        actor: system
        preconditions:
          - "strategy.approval_state == SUBMITTED"
        side_effects:
          - "stamps approved_at from the logical clock"
          - "starts cascade link 2 on this strategy's DRAFT objectives"
          - "increments ImplementationStrategy.version by 1"

      - from: SUBMITTED
        to: RETURNED
        trigger: "the DEFER board action on the owning AssessmentCycle"
        actor: system
        preconditions:
          - "strategy.approval_state == SUBMITTED"
        side_effects:
          - "execution_state is untouched"
          - "increments ImplementationStrategy.version by 1"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /implementation-strategies creating a newer strategy for the same PriorityCandidate"
        actor: system
        preconditions:
          - "the older strategy's approval_state IN {DRAFT, RETURNED}"
        side_effects:
          - "sets superseded_by_strategy_id to the new strategy's id"
          - "every ResourceCommitment of the superseded strategy with status == PENDING moves to RELEASED with release_reason = 'STRATEGY_SUPERSEDED', restoring ResponsibleParty.committed_fte_bp and the superseded strategy's budget_available_cents"
          - "increments ImplementationStrategy.version by 1"

      - from: NOT_STARTED
        to: ON_TRACK
        trigger: "cascade link 2 of the ADOPT board action (execution axis)"
        actor: system
        preconditions:
          - "strategy.execution_state == NOT_STARTED"
          - "at least one StrategyObjective of the strategy moved DRAFT -> ACTIVE in link 2"
        side_effects:
          - "starts cascade link 3 on this strategy's PENDING commitments"
          - "approval_state is untouched (execution axis moves alone)"
          - "increments ImplementationStrategy.version by 1"

      - from: ON_TRACK
        to: AT_RISK
        trigger: "POST /implementation-strategies/{strategy_id}/execution-status with to_execution_state = AT_RISK"
        actor: CommunityBenefitOfficer
        preconditions:
          - "strategy.approval_state == APPROVED, else ERR_STRATEGY_NOT_APPROVED"
          - "strategy.execution_state IN {ON_TRACK, AT_RISK, BEHIND}, else ERR_INVALID_STATE"
          - "owning cycle.posture != FROZEN, else ERR_CYCLE_FROZEN"
        side_effects:
          - "stores execution_note; approval_state stays APPROVED"
          - "increments ImplementationStrategy.version by 1"
        note: "AT_RISK <-> BEHIND and BEHIND -> ON_TRACK are all permitted through the same endpoint; the axis is free to move in both directions while approved."

      - from: BEHIND
        to: COMPLETED
        trigger: "POST /implementation-strategies/{strategy_id}/execution-status with to_execution_state = COMPLETED"
        actor: CommunityBenefitOfficer
        preconditions:
          - "strategy.approval_state == APPROVED, else ERR_STRATEGY_NOT_APPROVED"
          - "strategy.execution_state IN {ON_TRACK, AT_RISK, BEHIND}, else ERR_INVALID_STATE"
          - "every StrategyObjective of the strategy has status IN {ACTIVE, REVISED} and attainment_status != PENDING, else ERR_OBJECTIVE_PROGRESS_MISSING"
        side_effects:
          - "stores execution_note"
          - "increments ImplementationStrategy.version by 1"

      - from: ON_TRACK
        to: DISCONTINUED
        trigger: "POST /implementation-strategies/{strategy_id}/execution-status with to_execution_state = DISCONTINUED"
        actor: CommunityBenefitOfficer
        preconditions:
          - "strategy.approval_state == APPROVED, else ERR_STRATEGY_NOT_APPROVED"
          - "strategy.execution_state IN {ON_TRACK, AT_RISK, BEHIND, SUSPENDED_PENDING_REVIEW}, else ERR_INVALID_STATE"
        side_effects:
          - "every ResourceCommitment of the strategy with status IN {PENDING, COMMITTED} moves to RELEASED with release_reason = 'STRATEGY_DISCONTINUED', restoring ResponsibleParty.committed_fte_bp, the strategy's budget_available_cents and (for partnership-funded rows) PartnershipAgreement.funded_cents"
          - "increments ImplementationStrategy.version by 1"

      - from: ON_TRACK
        to: SUSPENDED_PENDING_REVIEW
        trigger: "cascade link 3 of a data-point void that invalidated the strategy's PriorityCandidate score"
        actor: system
        preconditions:
          - "strategy.execution_state NOT IN {COMPLETED, DISCONTINUED, CLOSED_OUT}"
        side_effects:
          - "AssessmentCycle.review_flag_count is recomputed and the cycle posture becomes RESTRICTED"
          - "increments ImplementationStrategy.version by 1"

      - from: SUSPENDED_PENDING_REVIEW
        to: ON_TRACK
        trigger: "POST /implementation-strategies/{strategy_id}/execution-status with to_execution_state = ON_TRACK"
        actor: CommunityBenefitOfficer
        preconditions:
          - "strategy.approval_state == APPROVED, else ERR_STRATEGY_NOT_APPROVED"
          - "the strategy's PriorityCandidate.status != SCORE_INVALIDATED, else ERR_INVALID_STATE"
        side_effects:
          - "AssessmentCycle.review_flag_count is recomputed and the posture returns to OPEN when it reaches 0"
          - "increments ImplementationStrategy.version by 1"

      - from: ON_TRACK
        to: CLOSED_OUT
        trigger: "cascade of the FILED -> CLOSED cycle transition"
        actor: system
        preconditions:
          - "strategy.execution_state IN {ON_TRACK, AT_RISK, BEHIND, SUSPENDED_PENDING_REVIEW}"
        side_effects:
          - "finalizes the strategy's ACTIVE and REVISED objectives (FINALIZED_MET / FINALIZED_NOT_MET)"
          - "increments ImplementationStrategy.version by 1"

  # ---- StrategyObjective ---------------------------------------------------
  - entity: StrategyObjective
    initial_state: DRAFT
    terminal_states: [FINALIZED_MET, FINALIZED_NOT_MET]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "cascade link 2 of the ADOPT board action on the owning AssessmentCycle"
        actor: system
        preconditions:
          - "objective.status == DRAFT"
          - "the owning ImplementationStrategy just moved to approval_state == APPROVED"
        side_effects:
          - "stamps baseline_locked_at from the logical clock; baseline_value becomes immutable"
          - "ImplementationStrategy.active_objective_count += 1, which starts cascade link 3"
          - "increments StrategyObjective.version by 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /strategy-objectives/{objective_id}/report-progress"
        actor: CommunityBenefitOfficer
        preconditions:
          - "objective.status IN {ACTIVE, REVISED}, else ERR_INVALID_STATE"
          - "owning cycle.posture != FROZEN, else ERR_CYCLE_FROZEN"
        side_effects:
          - "stores actual_value and as_of_date; runs calculations.objective_attainment to set attainment_pct and attainment_status"
          - "increments StrategyObjective.version by 1"

      - from: ACTIVE
        to: REVISED
        trigger: "cascade of publishing a MID_CYCLE ProgressEvaluation on the owning cycle"
        actor: system
        preconditions:
          - "objective.status == ACTIVE"
          - "objective.attainment_pct is not null AND objective.attainment_pct < 50.00"
        side_effects:
          - "the owning ImplementationStrategy's execution_state moves ON_TRACK -> BEHIND (caused by this revision)"
          - "ProgressEvaluation.objectives_revised_count += 1"
          - "increments StrategyObjective.version by 1"

      - from: REVISED
        to: FINALIZED_NOT_MET
        trigger: "cascade of the FILED -> CLOSED cycle transition"
        actor: system
        preconditions:
          - "objective.status IN {ACTIVE, REVISED}"
          - "attainment_pct is null OR attainment_pct < 100.00"
        side_effects:
          - "increments StrategyObjective.version by 1"

      - from: ACTIVE
        to: FINALIZED_MET
        trigger: "cascade of the FILED -> CLOSED cycle transition"
        actor: system
        preconditions:
          - "objective.status IN {ACTIVE, REVISED}"
          - "attainment_pct is not null AND attainment_pct >= 100.00"
        side_effects:
          - "increments StrategyObjective.version by 1"

  # ---- PartnershipAgreement: fork-join signatures + funding axis -----------
  - entity: PartnershipAgreement
    initial_state: NEGOTIATING
    terminal_states: [TERMINATED]
    transitions:
      - from: NEGOTIATING
        to: HOSPITAL_SIGNED
        trigger: "POST /partnership-agreements/{agreement_id}/sign with signatory_side = HOSPITAL"
        actor: CommunityBenefitOfficer
        preconditions:
          - "agreement.signature_state == NEGOTIATING, else ERR_INVALID_STATE"
          - "owning cycle.posture != FROZEN, else ERR_CYCLE_FROZEN"
        side_effects:
          - "stamps hospital_signed_at from the logical clock and stores hospital_signatory_user_id = X-User-ID"
          - "partner_signed_at stays null; funding_state stays UNFUNDED"
          - "increments PartnershipAgreement.version by 1"

      - from: NEGOTIATING
        to: PARTNER_SIGNED
        trigger: "POST /partnership-agreements/{agreement_id}/sign with signatory_side = PARTNER"
        actor: PartnerRepresentative
        preconditions:
          - "agreement.signature_state == NEGOTIATING, else ERR_INVALID_STATE"
          - "X-User-ID == agreement.party_id, else ERR_NOT_AGREEMENT_PARTY"
        side_effects:
          - "stamps partner_signed_at from the logical clock and stores partner_signatory_user_id = X-User-ID"
          - "hospital_signed_at stays null; funding_state stays UNFUNDED"
          - "increments PartnershipAgreement.version by 1"
        note: "The two branch side-effect sets are disjoint: each branch stamps only its own side's timestamp and signatory id."

      - from: HOSPITAL_SIGNED
        to: EXECUTED
        trigger: "POST /partnership-agreements/{agreement_id}/sign with signatory_side = PARTNER"
        actor: PartnerRepresentative
        preconditions:
          - "agreement.signature_state == HOSPITAL_SIGNED"
          - "X-User-ID == agreement.party_id, else ERR_NOT_AGREEMENT_PARTY"
        side_effects:
          - "stamps partner_signed_at and partner_signatory_user_id"
          - "join reached: funding_state moves UNFUNDED -> PLEDGED; the agreement may now fund ResourceCommitment rows"
          - "increments PartnershipAgreement.version by 1"

      - from: PARTNER_SIGNED
        to: EXECUTED
        trigger: "POST /partnership-agreements/{agreement_id}/sign with signatory_side = HOSPITAL"
        actor: CommunityBenefitOfficer
        preconditions:
          - "agreement.signature_state == PARTNER_SIGNED"
        side_effects:
          - "stamps hospital_signed_at and hospital_signatory_user_id"
          - "join reached: funding_state moves UNFUNDED -> PLEDGED"
          - "increments PartnershipAgreement.version by 1"

      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /partnership-agreements/{agreement_id}/terminate"
        actor: CommunityBenefitOfficer
        preconditions:
          - "agreement.signature_state IN {NEGOTIATING, HOSPITAL_SIGNED, PARTNER_SIGNED, EXECUTED}, else ERR_INVALID_STATE"
          - "owning cycle.posture != FROZEN, else ERR_CYCLE_FROZEN"
        side_effects:
          - "stores terminate_reason"
          - "every ResourceCommitment referencing this agreement with status IN {PENDING, COMMITTED} moves to RELEASED with release_reason = 'PARTNERSHIP_TERMINATED', restoring ResponsibleParty.committed_fte_bp and each strategy's budget_available_cents"
          - "funded_cents returns to 0 and funding_state moves to RELEASED"
          - "increments PartnershipAgreement.version by 1"

  # ---- ResourceCommitment --------------------------------------------------
  - entity: ResourceCommitment
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: COMMITTED
        trigger: "cascade link 3 of the ADOPT board action on the owning AssessmentCycle"
        actor: system
        preconditions:
          - "commitment.status == PENDING"
          - "the owning strategy's active_objective_count rose from 0 to >= 1 in cascade link 2"
        side_effects:
          - "stamps committed_at from the logical clock"
          - "ResponsibleParty.committed_fte_bp += fte_bp"
          - "when partnership_id is non-null: PartnershipAgreement.funded_cents += funding_cents and that agreement's funding_state moves PLEDGED -> FUNDED"
          - "increments ResourceCommitment.version by 1"

      - from: COMMITTED
        to: RELEASED
        trigger: "POST /resource-commitments/{commitment_id}/release"
        actor: CommunityBenefitOfficer
        preconditions:
          - "commitment.status IN {PENDING, COMMITTED}, else ERR_INVALID_STATE"
          - "owning cycle.posture != FROZEN, else ERR_CYCLE_FROZEN"
        side_effects:
          - "stores release_reason and stamps released_at from the logical clock"
          - "compensation: ResponsibleParty.committed_fte_bp -= fte_bp"
          - "compensation: the owning ImplementationStrategy.budget_available_cents is recomputed, restoring funding_cents to the envelope"
          - "compensation: when partnership_id is non-null, PartnershipAgreement.funded_cents -= funding_cents and, once funded_cents reaches 0, funding_state moves FUNDED -> RELEASED"
          - "increments ResourceCommitment.version by 1"

      - from: PENDING
        to: RELEASED
        trigger: "POST /resource-commitments/{commitment_id}/release before board adoption, or cascade from strategy supersede / discontinue / partnership terminate"
        actor: CommunityBenefitOfficer
        preconditions:
          - "commitment.status == PENDING"
        side_effects:
          - "compensation: ResponsibleParty.committed_fte_bp -= fte_bp and the strategy's budget_available_cents is recomputed"
          - "funded_cents is untouched (a PENDING commitment never added to it)"
          - "increments ResourceCommitment.version by 1"

  # ---- CommunityBenefitReport ---------------------------------------------
  - entity: CommunityBenefitReport
    initial_state: OPEN
    terminal_states: [FILED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /community-benefit-reports/{report_id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == OPEN, else ERR_INVALID_STATE"
          - "X-User-ID != report.created_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "at least one ExpensePosting on the report has status == POSTED, else ERR_REPORT_EMPTY"
        side_effects:
          - "sets audited_cost_to_charge_ratio, replaces cost_to_charge_ratio with it, and moves valuation_basis PROVISIONAL -> FINAL"
          - "re-runs calculations.posting_valued_amount for every POSTED posting under the FINAL variant, rewriting valued_cents, ratio_applied and valuation_basis_at_posting"
          - "re-runs calculations.report_category_totals and calculations.report_indirect_and_grand_total"
          - "stamps locked_at and finalized_by_user_id"
          - "increments CommunityBenefitReport.version by 1"

      - from: LOCKED
        to: FILED
        trigger: "cascade of the PUBLISHED -> FILED cycle transition"
        actor: system
        preconditions:
          - "report.status == LOCKED"
        side_effects:
          - "stamps the report's filed_at from the logical clock"
          - "increments CommunityBenefitReport.version by 1"

  # ---- ExpensePosting ------------------------------------------------------
  - entity: ExpensePosting
    initial_state: POSTED
    terminal_states: [VOID]
    transitions:
      - from: POSTED
        to: VOID
        trigger: "POST /expense-postings/{posting_id}/void"
        actor: CommunityBenefitOfficer
        preconditions:
          - "posting.status == POSTED, else ERR_INVALID_STATE"
          - "the owning report.status == OPEN, else ERR_INVALID_STATE"
          - "X-User-ID != posting.posted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "stores void_reason and voided_by_user_id"
          - "ledger sync: the owning CommunityBenefitReport re-runs calculations.report_category_totals and calculations.report_indirect_and_grand_total, so every category total, total_valued_cents, overhead_rate, indirect_allocation_cents, grand_total_cents and benefit_pct_of_expense return to the values they held before the posting existed"
          - "increments ExpensePosting.version by 1 and increments CommunityBenefitReport.version by 1"

  # ---- ProgressEvaluation --------------------------------------------------
  - entity: ProgressEvaluation
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /progress-evaluations/{evaluation_id}/publish"
        actor: CommunityBenefitOfficer
        preconditions:
          - "evaluation.status == DRAFT, else ERR_INVALID_STATE"
          - "owning cycle.status IN {ADOPTED, PUBLISHED, FILED}, else ERR_INVALID_STATE"
        side_effects:
          - "stores public_url and stamps published_at from the logical clock"
          - "when eval_type == ANNUAL: AssessmentCycle.annual_report_count += 1"
          - "when eval_type == MID_CYCLE: AssessmentCycle.mid_cycle_adjustment_count += 1 and every ACTIVE StrategyObjective reachable from the cycle whose attainment_pct is not null and < 50.00 moves to REVISED; each such revision moves its ImplementationStrategy execution_state ON_TRACK -> BEHIND and increments this evaluation's objectives_revised_count"
          - "increments ProgressEvaluation.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's version — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: strategy-create-stale-candidate
    parent_entity: PriorityCandidate
    write_endpoint: "POST /implementation-strategies"
    occ_field: "expected_candidate_version"
    description: |
      Creating an ImplementationStrategy against a PriorityCandidate whose
      version has advanced since the client last observed it is rejected. A
      newer strategy legitimately supersedes an older DRAFT or RETURNED
      strategy for the same candidate (and releases that strategy's PENDING
      commitments), so the create itself is a valid operation on a stale view;
      OCC is what forces the client to re-read the candidate — including its
      strategy_count and current score fields — before superseding.
    error_id: ERR_STALE_CANDIDATE_VERSION
    http_status: 412

  - rule_id: posting-create-stale-report
    parent_entity: CommunityBenefitReport
    write_endpoint: "POST /expense-postings"
    occ_field: "expected_report_version"
    description: |
      Creating an ExpensePosting against a CommunityBenefitReport whose
      version has advanced since the client last observed it is rejected. The
      posting's valued_cents is derived from the report's current
      cost_to_charge_ratio and valuation_basis, both of which the finalize
      transition rewrites; a posting computed against a stale view of the
      report would enter the ledger on the wrong valuation basis.
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: indicator_severity_score
    trigger: "on POST /health-indicators/{indicator_id}/data-points and on POST /indicator-data-points/{data_point_id}/void, as part of the HealthIndicator re-derivation named in both transitions' side_effects"
    algorithm: weighted_scoring
    formula: |
      # (a) source entity + status filter: IndicatorDataPoint rows with
      #     indicator_id == indicator.id AND status == ACTIVE
      # (b) window: no time window; every ACTIVE row is eligible
      # (c) tie-break: order candidates by collected_on DESC, then created_at
      #     DESC; take the first row (never by id)
      overall_rows = [p for p in ACTIVE data points if p.population_subgroup == "OVERALL"]
      if overall_rows is empty:
          latest_overall_value = null
          severity_score      = null
      else:
          newest = sort(overall_rows, key=(collected_on DESC, created_at DESC))[0]
          latest_overall_value = newest.value
          severity_score = min(100.00,
                               round_half_up((latest_overall_value / indicator.benchmark_value) * 50, 2))
    input_set: "ACTIVE IndicatorDataPoint rows whose population_subgroup == \"OVERALL\"; VOID rows are excluded"
    constants:
      BENCHMARK_PARITY_SCORE: 50
      SEVERITY_SCORE_CEILING: 100.00
    precision: "2 decimal places, round_half_up; the ceiling is applied after rounding"

  - name: indicator_disparity_ratio
    trigger: "on POST /health-indicators/{indicator_id}/data-points and on POST /indicator-data-points/{data_point_id}/void, as part of the same HealthIndicator re-derivation"
    algorithm: aggregation
    formula: |
      # (a) source entity + status filter: ACTIVE IndicatorDataPoint rows with
      #     population_subgroup != "OVERALL"
      # (b) window: per subgroup, only the newest row participates
      # (c) tie-break inside a subgroup: collected_on DESC, then created_at DESC
      per_subgroup = {}
      for s in distinct population_subgroup values (excluding "OVERALL") having >= 1 ACTIVE row:
          per_subgroup[s] = sort(ACTIVE rows of s, key=(collected_on DESC, created_at DESC))[0].value
      subgroup_count = len(per_subgroup)
      evidence_count = count(ACTIVE rows on the indicator, including OVERALL)
      if subgroup_count < 2:
          disparity_ratio = null
      else:
          disparity_ratio = round_half_up(max(per_subgroup.values()) / min(per_subgroup.values()), 2)
      data_state = SUFFICIENT if (latest_overall_value is not null and subgroup_count >= 2) else INSUFFICIENT
    input_set: "ACTIVE IndicatorDataPoint rows with population_subgroup != \"OVERALL\", newest row per subgroup"
    constants:
      MIN_SUBGROUPS_FOR_DISPARITY: 2
    precision: "disparity_ratio: 2 decimal places, round_half_up"

  - name: community_concern_index
    trigger: "on POST /priority-candidates/{candidate_id}/score, before calculations.candidate_composite_score"
    algorithm: aggregation
    formula: |
      # (a) source entity + status filter: StakeholderInterview rows with
      #     cycle_id == candidate.cycle_id AND status == COMPLETED whose
      #     concern_ratings object contains the key
      #     HealthIndicator(candidate.indicator_id).domain
      # (b) window: no time window; every COMPLETED interview qualifies,
      #     including those completed during PRIORITIZATION
      # (c) order-independent: the result is a weighted mean, so no tie-break
      #     is required; rounding happens exactly once, at the end
      rows = qualifying interviews
      if rows is empty:
          community_concern_index = 0.00        # and validations[priority=23] rejects the scoring
      else:
          numerator   = sum(r.concern_ratings[domain] * r.attendee_count for r in rows)
          denominator = sum(r.attendee_count for r in rows)
          community_concern_index = round_half_up((numerator / denominator) * RATING_TO_INDEX_FACTOR, 2)
    input_set: "COMPLETED StakeholderInterview rows on the candidate's cycle carrying a rating for the candidate's indicator domain; SCHEDULED and CANCELLED interviews are excluded"
    constants:
      RATING_TO_INDEX_FACTOR: 20
      RATING_MIN: 1
      RATING_MAX: 5
    precision: "2 decimal places, round_half_up, applied once to the final product (never per interview)"

  - name: candidate_composite_score
    trigger: "on POST /priority-candidates/{candidate_id}/score"
    algorithm: weighted_scoring
    formula: |
      S  = HealthIndicator(candidate.indicator_id).severity_score           # 0.00..100.00
      D  = HealthIndicator(candidate.indicator_id).disparity_ratio          # >= 1.00 or null
      dp = 0.00 if D is null else min(100.00, round_half_up((D - 1) * 100, 2))
      C  = calculations.community_concern_index
      H  = candidate.hospital_capacity_score
      # variant weights below; a single round_half_up is applied to the
      # weighted sum, never to the individual terms
    input_set: "the candidate's own indicator snapshot plus the cycle's completed community input; the candidate's status is irrelevant to the arithmetic"
    constants:
      DISPARITY_POINTS_CEILING: 100.00
      SELECTION_THRESHOLD: 60.00
    precision: "2 decimal places, round_half_up, applied once to the weighted sum"
    variants:
      - name: EQUAL_WEIGHT
        when: "scoring_variant == EQUAL_WEIGHT — the statutory reading in which severity, disparities, community concern and hospital capacity carry equal weight"
        difference: "composite_score = round_half_up(0.25*S + 0.25*dp + 0.25*C + 0.25*H, 2)"
      - name: COMMUNITY_WEIGHTED
        when: "scoring_variant == COMMUNITY_WEIGHTED — the equity reading in which community concern and disparities outrank hospital capacity"
        difference: "composite_score = round_half_up(0.20*S + 0.30*dp + 0.35*C + 0.15*H, 2); identical inputs therefore yield a different composite than EQUAL_WEIGHT whenever the four terms are not all equal"

  - name: posting_valued_amount
    trigger: "on POST /expense-postings and again for every POSTED posting on POST /community-benefit-reports/{report_id}/finalize"
    algorithm: tiered_pricing
    formula: |
      charge_based = category IN {FINANCIAL_ASSISTANCE, SUBSIDIZED_SERVICES}
      if charge_based:
          ratio        = report.cost_to_charge_ratio      # exact field, not "the ratio"
          valued_cents = round_half_up(posting.charges_cents * ratio)     # integer cents
          ratio_applied = ratio
      else:
          valued_cents  = posting.direct_cost_cents
          ratio_applied = null
      valuation_basis_at_posting = report.valuation_basis
    input_set: "the single posting being valued together with the owning report's cost_to_charge_ratio field as it stands at valuation time"
    constants:
      CHARGE_BASED_CATEGORIES: "FINANCIAL_ASSISTANCE, SUBSIDIZED_SERVICES"
      COST_BASED_CATEGORIES: "COMMUNITY_HEALTH_IMPROVEMENT, CASH_AND_INKIND, COMMUNITY_BUILDING"
    precision: "integer cents, round_half_up on the charge-based product"
    variants:
      - name: PROVISIONAL
        when: "report.valuation_basis == PROVISIONAL, i.e. report.cost_to_charge_ratio still equals AssessmentCycle.prior_year_cost_to_charge_ratio"
        difference: "charge-based postings are valued with the unaudited prior-year ratio; cost-based postings are unaffected"
      - name: FINAL
        when: "report.valuation_basis == FINAL, i.e. the finalize transition replaced cost_to_charge_ratio with audited_cost_to_charge_ratio"
        difference: "the same charges_cents is revalued with the audited ratio, so identical posting inputs produce a different valued_cents than the PROVISIONAL variant; the delta propagates into every category total and into the grand total"

  - name: report_category_totals
    trigger: "on POST /expense-postings, on POST /expense-postings/{posting_id}/void, and on POST /community-benefit-reports/{report_id}/finalize (listed in each of those transitions' side_effects)"
    algorithm: aggregation
    formula: |
      # (a) source entity + status filter: ExpensePosting rows with
      #     report_id == report.id AND status == POSTED (VOID rows excluded)
      # (b) window: whole report, no time window
      # (c) order-insensitive sum, so no tie-break is needed
      #
      # ROUNDING ORDER IS PINNED: each posting's valued_cents is rounded to
      # whole cents FIRST (by calculations.posting_valued_amount), and the
      # already-rounded integers are THEN summed. The alternative reading —
      # sum charges_cents across a category first and round the single product
      # once — is REJECTED and can differ by one or more cents.
      financial_assistance_cents         = sum(valued_cents where category == FINANCIAL_ASSISTANCE)
      subsidized_services_cents          = sum(valued_cents where category == SUBSIDIZED_SERVICES)
      community_health_improvement_cents = sum(valued_cents where category == COMMUNITY_HEALTH_IMPROVEMENT)
      cash_and_inkind_cents              = sum(valued_cents where category == CASH_AND_INKIND)
      community_building_cents           = sum(valued_cents where category == COMMUNITY_BUILDING)
      total_valued_cents                 = sum of the five category totals
    input_set: "POSTED ExpensePosting rows on the report; VOID rows are retained but excluded from every total"
    constants:
      ROUNDING_ORDER: "round_per_posting_then_sum"
    precision: "integer cents; no rounding occurs at the summation step because every input is already an integer"

  - name: report_indirect_and_grand_total
    trigger: "immediately after calculations.report_category_totals, on the same three endpoints"
    algorithm: threshold
    formula: |
      # EVALUATION ORDER IS PINNED. The overhead tier is selected from
      # total_valued_cents (the direct benefit base) and NOT from
      # grand_total_cents, even though grand_total_cents is the figure the
      # tier table appears to describe. Because grand_total_cents is itself
      # derived from the rate, keying the tier on it would be circular; the
      # base is therefore fixed as total_valued_cents.
      base = report.total_valued_cents
      if   base <  TIER_1_CEILING_CENTS:  overhead_rate = 0.05
      elif base <  TIER_2_CEILING_CENTS:  overhead_rate = 0.08
      else:                               overhead_rate = 0.11
      indirect_allocation_cents = round_half_up(base * overhead_rate)     # integer cents
      grand_total_cents         = base + indirect_allocation_cents
      benefit_pct_of_expense    = round_half_up(
                                    grand_total_cents
                                    / AssessmentCycle(report.cycle_id).total_operating_expense_cents
                                    * 100, 2)
    input_set: "the report's own total_valued_cents plus the owning cycle's total_operating_expense_cents"
    constants:
      TIER_1_CEILING_CENTS: 5000000
      TIER_2_CEILING_CENTS: 25000000
      TIER_1_RATE: 0.05
      TIER_2_RATE: 0.08
      TIER_3_RATE: 0.11
    precision: "indirect_allocation_cents: integer cents, round_half_up; benefit_pct_of_expense: 2 decimal places, round_half_up. Tier boundaries are inclusive on the lower edge: base == 5000000 selects 0.08, base == 4999999 selects 0.05"

  - name: strategy_budget_available
    trigger: "on POST /resource-commitments, on POST /resource-commitments/{commitment_id}/release, and on every cascade that releases a commitment (strategy supersede, strategy discontinue, partnership terminate, board adoption)"
    algorithm: aggregation
    formula: |
      # (a) source entity + status filter: ResourceCommitment rows with
      #     strategy_id == strategy.id AND status IN {PENDING, COMMITTED}
      #     (RELEASED rows are excluded)
      # (b) window: whole strategy
      # (c) order-insensitive sum
      encumbered_cents        = sum(funding_cents of those rows)
      budget_available_cents  = strategy.authorized_budget_cents - encumbered_cents
      # CONSERVED QUANTITY (invariant, must hold after every forward action and
      # after its compensating release):
      #   strategy.budget_available_cents + encumbered_cents
      #     == strategy.authorized_budget_cents
    input_set: "PENDING and COMMITTED ResourceCommitment rows of the strategy"
    constants:
      CONSERVED_QUANTITY: "ImplementationStrategy.authorized_budget_cents"
    precision: "integer cents, exact (no rounding)"

  - name: party_committed_fte
    trigger: "on POST /resource-commitments, on commitment activation (board adoption cascade link 3), on POST /resource-commitments/{commitment_id}/release, and on every cascade that releases a commitment"
    algorithm: aggregation
    formula: |
      # (a) source entity + status filter: ResourceCommitment rows with
      #     party_id == party.id AND status IN {PENDING, COMMITTED}
      # (b) window: whole party, all dates (this figure is date-independent by
      #     construction; the date-aware rule is the partnership pledge load)
      # (c) order-insensitive sum
      committed_fte_bp = sum(fte_bp of those rows)
      # CONSERVED QUANTITY (invariant): for a party that starts at 0, the
      # sequence create-commitment -> activate -> release must return
      # committed_fte_bp to exactly its pre-create value, and
      #   party.fte_capacity_bp - party.committed_fte_bp
      # is the free effort capacity enforced by validations[priority=20].
    input_set: "PENDING and COMMITTED ResourceCommitment rows of the party across all strategies"
    constants:
      CONSERVED_QUANTITY: "ResponsibleParty effort capacity in basis points"
      BP_PER_FTE: 10000
    precision: "integer basis points, exact (no rounding)"

  - name: objective_attainment
    trigger: "on POST /strategy-objectives/{objective_id}/report-progress"
    algorithm: threshold
    formula: |
      if objective.target_value == objective.baseline_value:
          attainment_pct = 100.00 if objective.actual_value >= objective.target_value else 0.00
      else:
          raw = (objective.actual_value - objective.baseline_value)
                / (objective.target_value - objective.baseline_value) * 100
          attainment_pct = max(0.00, min(ATTAINMENT_CEILING,
                                        round_half_up(raw, 2)))
      if   attainment_pct >= MET_THRESHOLD:     attainment_status = MET
      elif attainment_pct >= PARTIAL_THRESHOLD: attainment_status = PARTIAL
      else:                                     attainment_status = NOT_MET
    input_set: "the single objective's baseline_value, target_value and most recently reported actual_value"
    constants:
      MET_THRESHOLD: 100.00
      PARTIAL_THRESHOLD: 50.00
      ATTAINMENT_CEILING: 150.00
      MID_CYCLE_REVISION_THRESHOLD: 50.00
    precision: "2 decimal places, round_half_up; clamping is applied after rounding. Thresholds are inclusive on the lower edge: exactly 100.00 is MET, exactly 50.00 is PARTIAL, and MID_CYCLE revision applies only when attainment_pct < 50.00"

  - name: cycle_posture
    trigger: "on every AssessmentCycle status transition and on every cascade that changes review_flag_count"
    algorithm: constraint_propagation
    formula: |
      review_flag_count = count(ImplementationStrategy rows reachable through
                                PriorityCandidate.cycle_id == cycle.id whose
                                execution_state == SUSPENDED_PENDING_REVIEW)
      if   cycle.status IN {FILED, CLOSED}:   posture = FROZEN
      elif cycle.status == BOARD_REVIEW:      posture = RESTRICTED
      elif review_flag_count >= 1:            posture = RESTRICTED
      else:                                   posture = OPEN
    input_set: "the cycle's own status plus the execution_state of every strategy reachable from its selected priorities"
    constants:
      RESTRICTED_GATED_ENTITIES: "HealthIndicator, IndicatorDataPoint (create only), StakeholderInterview, PriorityCandidate, ImplementationStrategy, StrategyObjective, ResourceCommitment"
      FROZEN_GATED_ENTITIES: "all child entities of the cycle"
    precision: "exact enum, recomputed synchronously within the same request"

  - name: facilitator_buffer_overlap
    trigger: "on POST /stakeholder-interviews, as validations[priority=15]"
    algorithm: interval_merge
    formula: |
      # Interval semantics: PAIRWISE collision on a single facilitator with a
      # symmetric buffer. Each existing session is inflated by
      # FACILITATOR_BUFFER_MINUTES on BOTH sides before the comparison, and
      # the comparison uses STRICT inequalities, so a candidate session that
      # begins exactly FACILITATOR_BUFFER_MINUTES after an existing session
      # ends is accepted while an exactly adjacent one is rejected.
      occupancy = StakeholderInterview rows with
                    facilitator_party_id == request.facilitator_party_id AND
                    status IN {SCHEDULED, COMPLETED}
                  (CANCELLED rows are excluded, freeing the slot)
      buffer = FACILITATOR_BUFFER_MINUTES minutes
      conflict = any(e in occupancy where
                       request.starts_at < e.ends_at   + buffer AND
                       e.starts_at       < request.ends_at + buffer)
      if conflict: reject with ERR_FACILITATOR_WINDOW_CONFLICT
    input_set: "SCHEDULED and COMPLETED StakeholderInterview rows of the same facilitator across every cycle"
    constants:
      FACILITATOR_BUFFER_MINUTES: 30
    precision: "minute-exact instant comparison; both comparisons are strict (<), never <="

  - name: partnership_pledge_window_load
    trigger: "on POST /resource-commitments when partnership_id is non-null, as validations[priority=21]"
    algorithm: interval_merge
    formula: |
      # Interval semantics: AGGREGATE CAPACITY over HALF-OPEN day ranges
      # [effective_from, effective_to). There is no buffer and adjacency is
      # allowed: a commitment starting exactly on another's effective_to does
      # not overlap it, so the same pledge may be spent again in a later,
      # disjoint window. Only the total load inside a shared instant is capped.
      peers = ResourceCommitment rows with
                partnership_id == request.partnership_id AND
                status IN {PENDING, COMMITTED}
      overlapping = [p for p in peers where
                       request.effective_from < p.effective_to AND
                       p.effective_from      < request.effective_to]
      peak_load = request.funding_cents + sum(p.funding_cents for p in overlapping)
      if peak_load > PartnershipAgreement(request.partnership_id).pledged_cents:
          reject with ERR_PARTNERSHIP_PLEDGE_WINDOW_EXCEEDED
      # Containment (validations[priority=17], checked first): the commitment
      # must sit inside the agreement term, where term_end is INCLUSIVE while
      # effective_to is EXCLUSIVE:
      #   effective_from >= term_start AND effective_to <= (term_end + 1 day)
    input_set: "PENDING and COMMITTED ResourceCommitment rows referencing the same PartnershipAgreement"
    constants:
      CAP_FIELD: "PartnershipAgreement.pledged_cents"
    precision: "integer cents, exact; day-granular half-open interval arithmetic"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# Lower priority number wins when a single request violates several rules.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: |
      every path id resolves to an existing row, validated left-to-right.
      Mapping: {cycle_id} -> ERR_CYCLE_NOT_FOUND, {indicator_id} ->
      ERR_INDICATOR_NOT_FOUND, {data_point_id} -> ERR_DATA_POINT_NOT_FOUND,
      {party_id} -> ERR_PARTY_NOT_FOUND, {interview_id} ->
      ERR_INTERVIEW_NOT_FOUND, {candidate_id} -> ERR_CANDIDATE_NOT_FOUND,
      {strategy_id} -> ERR_STRATEGY_NOT_FOUND, {objective_id} ->
      ERR_OBJECTIVE_NOT_FOUND, {agreement_id} -> ERR_PARTNERSHIP_NOT_FOUND,
      {commitment_id} -> ERR_COMMITMENT_NOT_FOUND, {report_id} ->
      ERR_REPORT_NOT_FOUND, {posting_id} -> ERR_POSTING_NOT_FOUND,
      {evaluation_id} -> ERR_EVALUATION_NOT_FOUND.
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 4
    category: business_constraint
    check: "request body shape: required fields present, JSON types correct, enum members valid, numeric ranges and decimal-place limits from §1.1 constraints honoured, ends_at > starts_at, effective_to > effective_from, term_end >= term_start, concern_ratings keys are HealthIndicator.domain members with integer values 1..5"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 5
    category: existence
    check: |
      every foreign key supplied in the request body resolves to an existing
      row, validated in body-field declaration order. Mapping: cycle_id ->
      ERR_CYCLE_NOT_FOUND, indicator_id -> ERR_INDICATOR_NOT_FOUND,
      facilitator_party_id / party_id -> ERR_PARTY_NOT_FOUND, candidate_id ->
      ERR_CANDIDATE_NOT_FOUND, strategy_id -> ERR_STRATEGY_NOT_FOUND,
      partnership_id -> ERR_PARTNERSHIP_NOT_FOUND, report_id ->
      ERR_REPORT_NOT_FOUND.
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "POST /health-indicators, POST /stakeholder-interviews, POST /priority-candidates, POST /implementation-strategies, POST /partnership-agreements, POST /resource-commitments, POST /community-benefit-reports, POST /expense-postings, POST /progress-evaluations"

  - priority: 6
    category: auth
    check: "when the acting role is PartnerRepresentative, X-User-ID equals the target PartnershipAgreement.party_id"
    error_id: ERR_NOT_AGREEMENT_PARTY
    http_status: 403
    applies_to: "POST /partnership-agreements/{agreement_id}/sign"

  - priority: 6
    category: business_referential
    check: "the referenced ResponsibleParty carries the party_type the role of the reference demands: StakeholderInterview.facilitator_party_id must point at an INTERNAL party, and PartnershipAgreement.party_id must point at a PARTNER party"
    error_id: ERR_PARTY_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /stakeholder-interviews, POST /partnership-agreements"

  - priority: 7
    category: business_safety
    check: "the acting X-User-ID differs from the X-User-ID that performed the paired earlier step: finalizing a report requires X-User-ID != report.created_by_user_id, and voiding a posting requires X-User-ID != posting.posted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /community-benefit-reports/{report_id}/finalize, POST /expense-postings/{posting_id}/void"

  - priority: 8
    category: state
    check: |
      the supplied expected_<parent>_version equals the parent row's current
      version, per §1.2.1. Mapping: POST /implementation-strategies checks
      expected_candidate_version against PriorityCandidate.version ->
      ERR_STALE_CANDIDATE_VERSION; POST /expense-postings checks
      expected_report_version against CommunityBenefitReport.version ->
      ERR_STALE_REPORT_VERSION.
    error_id: "ERR_STALE_{PARENT}_VERSION"
    http_status: 412
    applies_to: "POST /implementation-strategies, POST /expense-postings"

  - priority: 9
    category: state
    check: "the owning AssessmentCycle.posture != FROZEN. FROZEN blocks every child mutation on the cycle, including expense postings, commitment release, execution-status changes, progress reports and evaluation publication; the sole exemptions are POST /assessment-cycles/{cycle_id}/advance with to_status = CLOSED and POST /indicator-data-points/{data_point_id}/void"
    error_id: ERR_CYCLE_FROZEN
    http_status: 409
    applies_to: "every child-entity mutation whose owning cycle is resolvable, except POST /assessment-cycles/{cycle_id}/advance and POST /indicator-data-points/{data_point_id}/void"

  - priority: 10
    category: state
    check: "the owning AssessmentCycle.posture != RESTRICTED for assessment-side mutations. RESTRICTED (cycle in BOARD_REVIEW, or review_flag_count >= 1) blocks creating or mutating HealthIndicator, IndicatorDataPoint (create only), StakeholderInterview, PriorityCandidate, ImplementationStrategy, StrategyObjective and ResourceCommitment rows; report-side and evaluation-side endpoints stay open, as does POST /implementation-strategies/{strategy_id}/execution-status, which is how a suspended strategy is cleared"
    error_id: ERR_CYCLE_RESTRICTED
    http_status: 409
    applies_to: "POST /health-indicators, POST /health-indicators/{indicator_id}/data-points, POST /stakeholder-interviews, POST /stakeholder-interviews/{interview_id}/complete, POST /stakeholder-interviews/{interview_id}/cancel, POST /priority-candidates, POST /priority-candidates/{candidate_id}/score, POST /priority-candidates/{candidate_id}/select, POST /priority-candidates/{candidate_id}/defer, POST /implementation-strategies, POST /implementation-strategies/{strategy_id}/submit, POST /implementation-strategies/{strategy_id}/objectives, POST /resource-commitments"

  - priority: 11
    category: state
    check: "the target row is in a state from which the requested transition is declared in §1.2 (interview SCHEDULED to complete or cancel, candidate SCORED to select, agreement NEGOTIATING or single-signed to sign, commitment PENDING or COMMITTED to release, posting POSTED to void, report OPEN to finalize, evaluation DRAFT to publish, data point ACTIVE to void, strategy execution_state in the declared from-set)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state transition"

  - priority: 11
    category: state
    check: "the requested to_status is the declared successor of the cycle's current status: DRAFT->DATA_COLLECTION, DATA_COLLECTION->INPUT_GATHERING, INPUT_GATHERING->PRIORITIZATION, PRIORITIZATION->STRATEGY_DEVELOPMENT, STRATEGY_DEVELOPMENT->BOARD_REVIEW, FILED->CLOSED. Any other (from_status, to_status) pair, including every backward pair, is rejected"
    error_id: ERR_INVALID_PHASE_TRANSITION
    http_status: 409
    applies_to: "POST /assessment-cycles/{cycle_id}/advance"

  - priority: 11
    category: state
    check: "the target ImplementationStrategy.approval_state IN {DRAFT, RETURNED} — an APPROVED, SUBMITTED or SUPERSEDED strategy no longer accepts new objectives or new resource commitments"
    error_id: ERR_STRATEGY_LOCKED
    http_status: 409
    applies_to: "POST /implementation-strategies/{strategy_id}/objectives, POST /resource-commitments"

  - priority: 11
    category: state
    check: "the owning AssessmentCycle.status == INPUT_GATHERING when scheduling a new stakeholder interview; the scheduling window closes when the cycle advances to PRIORITIZATION even though already-SCHEDULED interviews may still be completed or cancelled"
    error_id: ERR_INPUT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /stakeholder-interviews"

  - priority: 12
    category: business_referential
    check: "the PriorityCandidate's HealthIndicator.data_state == SUFFICIENT (latest_overall_value is not null AND subgroup_count >= 2) before the candidate may be scored"
    error_id: ERR_INDICATOR_DATA_INSUFFICIENT
    http_status: 409
    applies_to: "POST /priority-candidates/{candidate_id}/score"

  - priority: 12
    category: business_referential
    check: "the referenced ImplementationStrategy.approval_state == APPROVED — execution status may only move on an approved strategy, and an ExpensePosting may only name an approved strategy"
    error_id: ERR_STRATEGY_NOT_APPROVED
    http_status: 409
    applies_to: "POST /implementation-strategies/{strategy_id}/execution-status, POST /expense-postings (when strategy_id is non-null)"

  - priority: 12
    category: business_referential
    check: "the referenced PartnershipAgreement.signature_state == EXECUTED — a commitment may only draw funding from an agreement both sides have signed"
    error_id: ERR_PARTNERSHIP_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /resource-commitments (when partnership_id is non-null)"

  - priority: 13
    category: business_safety
    check: "AssessmentCycle.public_availability_met == true — the assessment and its implementation strategy must be publicly available before the cycle may be filed with the annual return"
    error_id: ERR_PUBLIC_AVAILABILITY_NOT_MET
    http_status: 409
    applies_to: "POST /assessment-cycles/{cycle_id}/file-return"

  - priority: 14
    category: business_referential
    check: "exactly one CommunityBenefitReport exists for the cycle and its status == LOCKED"
    error_id: ERR_REPORT_NOT_LOCKED
    http_status: 409
    applies_to: "POST /assessment-cycles/{cycle_id}/file-return"

  - priority: 14
    category: business_referential
    check: "on advance to BOARD_REVIEW: every SELECTED PriorityCandidate on the cycle has at least one ImplementationStrategy with approval_state == SUBMITTED carrying at least one StrategyObjective with status IN {DRAFT, ACTIVE}. On strategy submit: the strategy itself has at least one StrategyObjective with status == DRAFT"
    error_id: ERR_STRATEGY_SET_INCOMPLETE
    http_status: 409
    applies_to: "POST /assessment-cycles/{cycle_id}/advance (to_status = BOARD_REVIEW), POST /implementation-strategies/{strategy_id}/submit"

  - priority: 14
    category: business_referential
    check: "at least one ProgressEvaluation on the cycle has eval_type == ANNUAL and status == PUBLISHED before the cycle may close"
    error_id: ERR_ANNUAL_REPORT_MISSING
    http_status: 409
    applies_to: "POST /assessment-cycles/{cycle_id}/advance (to_status = CLOSED)"

  - priority: 15
    category: business_temporal
    check: "per calculations.facilitator_buffer_overlap: no StakeholderInterview with the same facilitator_party_id and status IN {SCHEDULED, COMPLETED} satisfies (new.starts_at < existing.ends_at + 30 minutes AND existing.starts_at < new.ends_at + 30 minutes). Exactly adjacent sessions therefore conflict; a session starting exactly 30 minutes after another ends does not"
    error_id: ERR_FACILITATOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /stakeholder-interviews"

  - priority: 16
    category: business_temporal
    check: "IndicatorDataPoint.collected_on falls inside the cycle's evidence window: collected_on >= (AssessmentCycle.fiscal_year - 3)-01-01 AND collected_on <= the logical clock's current calendar date"
    error_id: ERR_DATA_POINT_OUT_OF_WINDOW
    http_status: 409
    applies_to: "POST /health-indicators/{indicator_id}/data-points"

  - priority: 17
    category: business_temporal
    check: "when partnership_id is non-null, the commitment window sits inside the agreement term, where term_end is an inclusive date and effective_to is exclusive: effective_from >= agreement.term_start AND effective_to <= agreement.term_end + 1 day"
    error_id: ERR_COMMITMENT_OUTSIDE_TERM
    http_status: 409
    applies_to: "POST /resource-commitments"

  - priority: 18
    category: business_constraint
    check: "AssessmentCycle.fiscal_year is unique across all cycles"
    error_id: ERR_DUPLICATE_FISCAL_YEAR
    http_status: 409
    applies_to: "POST /assessment-cycles"

  - priority: 18
    category: business_constraint
    check: "HealthIndicator.name is unique per cycle_id"
    error_id: ERR_DUPLICATE_INDICATOR_NAME
    http_status: 409
    applies_to: "POST /health-indicators"

  - priority: 18
    category: business_constraint
    check: "StakeholderInterview.organization_name is unique per cycle_id among rows with status IN {SCHEDULED, COMPLETED}; a CANCELLED session frees the name"
    error_id: ERR_DUPLICATE_ORGANIZATION
    http_status: 409
    applies_to: "POST /stakeholder-interviews"

  - priority: 18
    category: business_constraint
    check: "at most one CommunityBenefitReport per (cycle_id, fiscal_year)"
    error_id: ERR_DUPLICATE_REPORT
    http_status: 409
    applies_to: "POST /community-benefit-reports"

  - priority: 18
    category: business_constraint
    check: "at most one ProgressEvaluation per (cycle_id, eval_type, period_year)"
    error_id: ERR_DUPLICATE_EVALUATION_PERIOD
    http_status: 409
    applies_to: "POST /progress-evaluations"

  - priority: 19
    category: business_constraint
    check: "the posting's amount fields match its category basis: FINANCIAL_ASSISTANCE and SUBSIDIZED_SERVICES require charges_cents >= 1 AND direct_cost_cents == 0; COMMUNITY_HEALTH_IMPROVEMENT, CASH_AND_INKIND and COMMUNITY_BUILDING require direct_cost_cents >= 1 AND charges_cents == 0"
    error_id: ERR_POSTING_BASIS_MISMATCH
    http_status: 409
    applies_to: "POST /expense-postings"

  - priority: 20
    category: business_constraint
    check: "per calculations.party_committed_fte: ResponsibleParty.committed_fte_bp + new.fte_bp <= ResponsibleParty.fte_capacity_bp"
    error_id: ERR_PARTY_FTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /resource-commitments"

  - priority: 21
    category: business_fiscal
    check: "per calculations.partnership_pledge_window_load: when partnership_id is non-null, new.funding_cents plus the funding_cents of every PENDING or COMMITTED sibling commitment on the same agreement whose half-open window overlaps [new.effective_from, new.effective_to) must not exceed PartnershipAgreement.pledged_cents. Disjoint and exactly adjacent windows do not accumulate"
    error_id: ERR_PARTNERSHIP_PLEDGE_WINDOW_EXCEEDED
    http_status: 409
    applies_to: "POST /resource-commitments"

  - priority: 22
    category: business_fiscal
    check: "per calculations.strategy_budget_available: new.funding_cents <= ImplementationStrategy.budget_available_cents"
    error_id: ERR_STRATEGY_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /resource-commitments"

  - priority: 23
    category: business_constraint
    check: "AssessmentCycle.sufficient_indicator_count >= 1 before leaving DATA_COLLECTION"
    error_id: ERR_INSUFFICIENT_INDICATOR_COVERAGE
    http_status: 409
    applies_to: "POST /assessment-cycles/{cycle_id}/advance (to_status = INPUT_GATHERING)"

  - priority: 23
    category: business_constraint
    check: "AssessmentCycle.completed_interview_count >= 1 before leaving INPUT_GATHERING"
    error_id: ERR_NO_COMMUNITY_INPUT
    http_status: 409
    applies_to: "POST /assessment-cycles/{cycle_id}/advance (to_status = PRIORITIZATION)"

  - priority: 23
    category: business_constraint
    check: "AssessmentCycle.selected_priority_count >= 1 before leaving PRIORITIZATION"
    error_id: ERR_NO_SELECTED_PRIORITY
    http_status: 409
    applies_to: "POST /assessment-cycles/{cycle_id}/advance (to_status = STRATEGY_DEVELOPMENT)"

  - priority: 23
    category: business_constraint
    check: "quorum_present == true on the board action"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /assessment-cycles/{cycle_id}/board-action"

  - priority: 23
    category: business_constraint
    check: "at least one COMPLETED StakeholderInterview on the cycle carries a concern_ratings key equal to the candidate's HealthIndicator.domain, so calculations.community_concern_index has a non-empty input set"
    error_id: ERR_NO_DOMAIN_INPUT
    http_status: 409
    applies_to: "POST /priority-candidates/{candidate_id}/score"

  - priority: 23
    category: business_constraint
    check: "PriorityCandidate.concern_input_dirty == false — a stakeholder interview completed after the candidate was scored has added community input for the candidate's domain, so the candidate must be re-scored before it may be selected"
    error_id: ERR_STALE_CONCERN_INPUT
    http_status: 409
    applies_to: "POST /priority-candidates/{candidate_id}/select"

  - priority: 23
    category: business_constraint
    check: "the report has at least one ExpensePosting with status == POSTED"
    error_id: ERR_REPORT_EMPTY
    http_status: 409
    applies_to: "POST /community-benefit-reports/{report_id}/finalize"

  - priority: 23
    category: business_constraint
    check: "when to_execution_state == COMPLETED: every StrategyObjective of the strategy has status IN {ACTIVE, REVISED} and attainment_status != PENDING"
    error_id: ERR_OBJECTIVE_PROGRESS_MISSING
    http_status: 409
    applies_to: "POST /implementation-strategies/{strategy_id}/execution-status"

  - priority: 24
    category: business_constraint
    check: "when action_type == ADOPT: votes_for > votes_against. Checked only after the quorum rule at priority 23 has passed"
    error_id: ERR_ADOPTION_VOTE_FAILED
    http_status: 409
    applies_to: "POST /assessment-cycles/{cycle_id}/board-action"

  - priority: 24
    category: business_constraint
    check: "PriorityCandidate.composite_score >= 60.00. Checked only after the stale-input rule at priority 23 has passed; exactly 60.00 passes"
    error_id: ERR_PRIORITY_SCORE_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /priority-candidates/{candidate_id}/select"

  - priority: 11
    category: state
    check: |
      creation-time parent-state gates (the created row has no state of its
      own yet, so the check is on its parent):
        - POST /health-indicators and POST /health-indicators/{indicator_id}/data-points
          require the owning cycle.status == DATA_COLLECTION;
        - POST /priority-candidates requires cycle.status == PRIORITIZATION;
        - POST /implementation-strategies requires cycle.status ==
          STRATEGY_DEVELOPMENT AND PriorityCandidate.status == SELECTED;
        - POST /implementation-strategies/{strategy_id}/objectives and
          POST /resource-commitments require cycle.status == STRATEGY_DEVELOPMENT;
        - POST /expense-postings requires the owning report.status == OPEN.
      POST /responsible-parties, POST /partnership-agreements,
      POST /community-benefit-reports and POST /progress-evaluations carry no
      phase gate; they are constrained only by the posture rules at
      priorities 9 and 10.
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /health-indicators, POST /health-indicators/{indicator_id}/data-points, POST /priority-candidates, POST /implementation-strategies, POST /implementation-strategies/{strategy_id}/objectives, POST /resource-commitments, POST /expense-postings"

  # ---- actor-specific role refinements (evaluated inside priority 2) -------
  - priority: 2
    category: auth
    check: "on POST /assessment-cycles/{cycle_id}/advance the acting role must equal the declared actor of the requested transition: to_status = CLOSED requires ComplianceOfficer, every other to_status requires CommunityBenefitOfficer"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /assessment-cycles/{cycle_id}/advance"

  - priority: 2
    category: auth
    check: "on POST /partnership-agreements/{agreement_id}/sign the acting role must match the signatory_side: HOSPITAL requires CommunityBenefitOfficer, PARTNER requires PartnerRepresentative"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /partnership-agreements/{agreement_id}/sign"

# =============================================================================
# §1.5 API Endpoint Table   (api_prefix is "/", so every path below is rooted)
# =============================================================================
endpoints:

  # ---- AssessmentCycle -----------------------------------------------------
  - method: POST
    path: "/assessment-cycles"
    description: "Opens a new assessment cycle in DRAFT. prior_year_cost_to_charge_ratio is the unaudited ratio every charge-based expense posting is valued with until the community benefit report is finalized."
    roles: [CommunityBenefitOfficer]
    code: 201
    input: [fiscal_year, service_area_name, prior_year_cost_to_charge_ratio, total_operating_expense_cents]
    output: AssessmentCycle
    side_effects: ["status = DRAFT, posture = OPEN, all counters 0, version = 1"]

  - method: GET
    path: "/assessment-cycles"
    description: "Lists assessment cycles, newest first by created_at DESC."
    roles: [CommunityBenefitOfficer, DataSteward, BoardChair, ComplianceOfficer, PartnerRepresentative, PublicViewer]
    code: 200
    input: ["fiscal_year?", "status?", "limit?", "offset?"]
    output: AssessmentCycle[]
    side_effects: []

  - method: GET
    path: "/assessment-cycles/{cycle_id}"
    description: "Returns one assessment cycle with its derived posture and counters."
    roles: [CommunityBenefitOfficer, DataSteward, BoardChair, ComplianceOfficer, PartnerRepresentative, PublicViewer]
    code: 200
    input: []
    output: AssessmentCycle
    side_effects: []

  - method: POST
    path: "/assessment-cycles/{cycle_id}/advance"
    description: "Advances the cycle to the next declared phase. to_status is one of DATA_COLLECTION, INPUT_GATHERING, PRIORITIZATION, STRATEGY_DEVELOPMENT, BOARD_REVIEW, CLOSED; every other pair is rejected with ERR_INVALID_PHASE_TRANSITION."
    roles: [CommunityBenefitOfficer, ComplianceOfficer]
    code: 200
    input: [to_status]
    output: AssessmentCycle
    side_effects:
      - "runs calculations.cycle_posture"
      - "on to_status = PRIORITIZATION: closes the interview scheduling window"
      - "on to_status = STRATEGY_DEVELOPMENT: defers every unselected PriorityCandidate on the cycle"
      - "on to_status = BOARD_REVIEW: posture becomes RESTRICTED"
      - "on to_status = CLOSED: closes out live strategies and finalizes their objectives"
      - "increments AssessmentCycle.version by 1"

  - method: POST
    path: "/assessment-cycles/{cycle_id}/board-action"
    description: "Records the board's decision on the assessment and its implementation strategies. action_type is ADOPT or DEFER. ADOPT drives the three-link adoption cascade (strategies approved -> objectives activated -> commitments committed); DEFER returns submitted strategies and sends the cycle back to STRATEGY_DEVELOPMENT."
    roles: [BoardChair]
    code: 200
    input: [action_type, quorum_present, votes_for, votes_against, "note?"]
    output: AssessmentCycle
    side_effects:
      - "on ADOPT: cascade links 1-3 per §1.2; stamps adopted_at, adoption_board_user_id, votes_for_at_adoption, votes_against_at_adoption"
      - "on DEFER: submitted strategies move to RETURNED and board_deferral_count += 1"
      - "runs calculations.cycle_posture"
      - "increments AssessmentCycle.version by 1"

  - method: POST
    path: "/assessment-cycles/{cycle_id}/publish"
    description: "Makes the adopted assessment and implementation strategy publicly available, satisfying the public availability requirement that filing depends on."
    roles: [CommunityBenefitOfficer]
    code: 200
    input: [public_url, public_comment_channel]
    output: AssessmentCycle
    side_effects:
      - "status ADOPTED -> PUBLISHED, stamps published_at, sets public_availability_met = true"
      - "increments AssessmentCycle.version by 1"

  - method: POST
    path: "/assessment-cycles/{cycle_id}/file-return"
    description: "Files the assessment with the annual return. Requires public availability and a LOCKED community benefit report."
    roles: [ComplianceOfficer]
    code: 200
    input: [return_form_id]
    output: AssessmentCycle
    side_effects:
      - "status -> FILED, stamps filed_at and return_form_id"
      - "the cycle's CommunityBenefitReport moves LOCKED -> FILED"
      - "posture becomes FROZEN"
      - "increments AssessmentCycle.version by 1"

  - method: GET
    path: "/assessment-cycles/{cycle_id}/progress-evaluations"
    description: "Lists the cycle's progress evaluations (reverse lookup for ProgressEvaluation.cycle_id)."
    roles: [CommunityBenefitOfficer, BoardChair, ComplianceOfficer, PublicViewer]
    code: 200
    input: ["eval_type?", "status?", "limit?", "offset?"]
    output: ProgressEvaluation[]
    side_effects: []

  # ---- HealthIndicator / IndicatorDataPoint --------------------------------
  - method: POST
    path: "/health-indicators"
    description: "Registers a health indicator on a cycle in DATA_COLLECTION with the benchmark its community rate is measured against."
    roles: [CommunityBenefitOfficer, DataSteward]
    code: 201
    input: [cycle_id, domain, name, benchmark_value]
    output: HealthIndicator
    side_effects: ["data_state = INSUFFICIENT, subgroup_count = 0, evidence_count = 0"]

  - method: GET
    path: "/health-indicators"
    description: "Lists health indicators, optionally filtered by cycle (reverse lookup for HealthIndicator.cycle_id)."
    roles: [CommunityBenefitOfficer, DataSteward, BoardChair, ComplianceOfficer]
    code: 200
    input: ["cycle_id?", "domain?", "data_state?", "limit?", "offset?"]
    output: HealthIndicator[]
    side_effects: []

  - method: GET
    path: "/health-indicators/{indicator_id}"
    description: "Returns one health indicator with its derived severity_score, disparity_ratio and data_state."
    roles: [CommunityBenefitOfficer, DataSteward, BoardChair, ComplianceOfficer]
    code: 200
    input: []
    output: HealthIndicator
    side_effects: []

  - method: POST
    path: "/health-indicators/{indicator_id}/data-points"
    description: "Records one observation for a population subgroup. The literal population_subgroup \"OVERALL\" supplies the severity numerator; two or more other subgroups are required before the indicator becomes SUFFICIENT."
    roles: [DataSteward]
    code: 201
    input: [population_subgroup, source_type, value, collected_on]
    output: IndicatorDataPoint
    side_effects:
      - "runs calculations.indicator_severity_score and calculations.indicator_disparity_ratio on the owning indicator"
      - "may transition HealthIndicator INSUFFICIENT -> SUFFICIENT and increment AssessmentCycle.sufficient_indicator_count"
      - "increments HealthIndicator.version by 1"

  - method: GET
    path: "/health-indicators/{indicator_id}/data-points"
    description: "Lists the indicator's observations, ACTIVE and VOID (reverse lookup for IndicatorDataPoint.indicator_id)."
    roles: [CommunityBenefitOfficer, DataSteward, ComplianceOfficer]
    code: 200
    input: ["status?", "population_subgroup?", "limit?", "offset?"]
    output: IndicatorDataPoint[]
    side_effects: []

  - method: GET
    path: "/indicator-data-points"
    description: "Lists observations across indicators (reverse lookup for IndicatorDataPoint.indicator_id), which is how a void cascade is audited without walking each indicator in turn."
    roles: [CommunityBenefitOfficer, DataSteward, ComplianceOfficer]
    code: 200
    input: ["indicator_id?", "status?", "population_subgroup?", "limit?", "offset?"]
    output: IndicatorDataPoint[]
    side_effects: []

  - method: GET
    path: "/indicator-data-points/{data_point_id}"
    description: "Returns one observation."
    roles: [CommunityBenefitOfficer, DataSteward, ComplianceOfficer]
    code: 200
    input: []
    output: IndicatorDataPoint
    side_effects: []

  - method: POST
    path: "/indicator-data-points/{data_point_id}/void"
    description: "Retracts an observation for data-quality reasons. Permitted even while the cycle posture is RESTRICTED, and the entry point of the void cascade (indicator loses sufficiency -> candidate scores invalidated -> strategies suspended)."
    roles: [DataSteward]
    code: 200
    input: [reason]
    output: IndicatorDataPoint
    side_effects:
      - "status -> VOID, stores void_reason = reason and voided_by_user_id"
      - "re-runs calculations.indicator_severity_score and calculations.indicator_disparity_ratio"
      - "may drive the three-link void cascade per §1.2"
      - "increments IndicatorDataPoint.version by 1"

  # ---- ResponsibleParty ----------------------------------------------------
  - method: POST
    path: "/responsible-parties"
    description: "Registers a responsible party. INTERNAL parties facilitate stakeholder interviews; PARTNER parties hold partnership agreements and, acting as PartnerRepresentative, sign them with X-User-ID equal to the party id."
    roles: [CommunityBenefitOfficer]
    code: 201
    input: [name, party_type, fte_capacity_bp]
    output: ResponsibleParty
    side_effects: ["committed_fte_bp = 0"]

  - method: GET
    path: "/responsible-parties"
    description: "Lists responsible parties with their committed effort."
    roles: [CommunityBenefitOfficer, ComplianceOfficer]
    code: 200
    input: ["party_type?", "limit?", "offset?"]
    output: ResponsibleParty[]
    side_effects: []

  - method: GET
    path: "/responsible-parties/{party_id}"
    description: "Returns one responsible party, including committed_fte_bp — the conserved quantity of the effort-capacity invariant."
    roles: [CommunityBenefitOfficer, ComplianceOfficer, PartnerRepresentative]
    code: 200
    input: []
    output: ResponsibleParty
    side_effects: []

  # ---- StakeholderInterview ------------------------------------------------
  - method: POST
    path: "/stakeholder-interviews"
    description: "Schedules a community input session with an organization, facilitated by an INTERNAL responsible party. The facilitator's window occupancy is checked with a 30-minute buffer on both sides."
    roles: [CommunityBenefitOfficer]
    code: 201
    input: [cycle_id, facilitator_party_id, organization_name, sector, starts_at, ends_at]
    output: StakeholderInterview
    side_effects: ["status = SCHEDULED", "runs calculations.facilitator_buffer_overlap as validations[priority=15]"]

  - method: GET
    path: "/stakeholder-interviews"
    description: "Lists stakeholder interviews (reverse lookup for both StakeholderInterview.cycle_id and StakeholderInterview.facilitator_party_id)."
    roles: [CommunityBenefitOfficer, BoardChair, ComplianceOfficer]
    code: 200
    input: ["cycle_id?", "facilitator_party_id?", "status?", "limit?", "offset?"]
    output: StakeholderInterview[]
    side_effects: []

  - method: GET
    path: "/stakeholder-interviews/{interview_id}"
    description: "Returns one stakeholder interview with its recorded concern_ratings."
    roles: [CommunityBenefitOfficer, BoardChair, ComplianceOfficer]
    code: 200
    input: []
    output: StakeholderInterview
    side_effects: []

  - method: POST
    path: "/stakeholder-interviews/{interview_id}/complete"
    description: "Records the session outcome. concern_ratings maps HealthIndicator.domain members to integer community-concern ratings 1..5; attendee_count is the weight those ratings carry in calculations.community_concern_index. Permitted while the cycle is in INPUT_GATHERING or PRIORITIZATION."
    roles: [CommunityBenefitOfficer]
    code: 200
    input: [concern_ratings, attendee_count]
    output: StakeholderInterview
    side_effects:
      - "status -> COMPLETED, stamps completed_at, AssessmentCycle.completed_interview_count += 1"
      - "sets concern_input_dirty = true on every already-SCORED PriorityCandidate of the cycle whose indicator domain is a key of concern_ratings"
      - "increments StakeholderInterview.version by 1"

  - method: POST
    path: "/stakeholder-interviews/{interview_id}/cancel"
    description: "Cancels a scheduled session, freeing both the facilitator window and the organization-name uniqueness slot for the cycle."
    roles: [CommunityBenefitOfficer]
    code: 200
    input: [reason]
    output: StakeholderInterview
    side_effects:
      - "status -> CANCELLED, stores cancel_reason = reason"
      - "the row leaves the facilitator occupancy set and the organization-name uniqueness set"
      - "increments StakeholderInterview.version by 1"

  # ---- PriorityCandidate ---------------------------------------------------
  - method: POST
    path: "/priority-candidates"
    description: "Nominates an assessed need for prioritization, pairing a health indicator with the hospital's assessed capacity to address it."
    roles: [CommunityBenefitOfficer]
    code: 201
    input: [cycle_id, indicator_id, hospital_capacity_score]
    output: PriorityCandidate
    side_effects: ["status = DRAFT, composite_score = null, concern_input_dirty = false"]

  - method: GET
    path: "/priority-candidates"
    description: "Lists priority candidates (reverse lookup for both PriorityCandidate.cycle_id and PriorityCandidate.indicator_id)."
    roles: [CommunityBenefitOfficer, BoardChair, ComplianceOfficer]
    code: 200
    input: ["cycle_id?", "indicator_id?", "status?", "limit?", "offset?"]
    output: PriorityCandidate[]
    side_effects: []

  - method: GET
    path: "/priority-candidates/{candidate_id}"
    description: "Returns one priority candidate with its score snapshot and version — the value an OCC strategy create must carry as expected_candidate_version."
    roles: [CommunityBenefitOfficer, BoardChair, ComplianceOfficer]
    code: 200
    input: []
    output: PriorityCandidate
    side_effects: []

  - method: POST
    path: "/priority-candidates/{candidate_id}/score"
    description: "Scores the candidate against severity, disparities, community concern and hospital capacity. scoring_variant selects the weighting: EQUAL_WEIGHT or COMMUNITY_WEIGHTED."
    roles: [CommunityBenefitOfficer]
    code: 200
    input: [scoring_variant]
    output: PriorityCandidate
    side_effects:
      - "runs calculations.community_concern_index then calculations.candidate_composite_score"
      - "stores scoring_variant, severity_input, disparity_points, community_concern_index, composite_score; status -> SCORED; concern_input_dirty = false"
      - "increments PriorityCandidate.version by 1"

  - method: POST
    path: "/priority-candidates/{candidate_id}/select"
    description: "Selects the candidate as a prioritized community health need. Requires a composite_score of at least 60.00 and community input no newer than the score."
    roles: [CommunityBenefitOfficer]
    code: 200
    input: [selection_rationale]
    output: PriorityCandidate
    side_effects:
      - "status -> SELECTED, stores selection_rationale, AssessmentCycle.selected_priority_count += 1"
      - "increments PriorityCandidate.version by 1"

  - method: POST
    path: "/priority-candidates/{candidate_id}/defer"
    description: "Defers the candidate out of this cycle's priorities, releasing any draft strategy work built on it."
    roles: [CommunityBenefitOfficer]
    code: 200
    input: [reason]
    output: PriorityCandidate
    side_effects:
      - "status -> DEFERRED, stores defer_reason = reason"
      - "when the candidate was SELECTED: AssessmentCycle.selected_priority_count -= 1 and its DRAFT or RETURNED strategies move to SUPERSEDED"
      - "increments PriorityCandidate.version by 1"

  # ---- ImplementationStrategy / StrategyObjective --------------------------
  - method: POST
    path: "/implementation-strategies"
    description: "Drafts an implementation strategy for a selected priority with an authorized resource envelope. expected_candidate_version is the PriorityCandidate.version the client last observed (§1.2.1); a newer strategy supersedes the candidate's existing DRAFT or RETURNED strategy."
    roles: [CommunityBenefitOfficer]
    code: 201
    input: [candidate_id, title, authorized_budget_cents, expected_candidate_version]
    output: ImplementationStrategy
    side_effects:
      - "approval_state = DRAFT, execution_state = NOT_STARTED, budget_available_cents = authorized_budget_cents"
      - "any existing strategy on the same candidate with approval_state IN {DRAFT, RETURNED} moves to SUPERSEDED, its superseded_by_strategy_id is set to the new strategy, and its PENDING commitments are released"
      - "PriorityCandidate.strategy_count += 1"
      - "increments PriorityCandidate.version by 1"

  - method: GET
    path: "/implementation-strategies"
    description: "Lists implementation strategies (reverse lookup for both ImplementationStrategy.candidate_id and the self-referential ImplementationStrategy.superseded_by_strategy_id)."
    roles: [CommunityBenefitOfficer, BoardChair, ComplianceOfficer]
    code: 200
    input: ["candidate_id?", "superseded_by_strategy_id?", "approval_state?", "execution_state?", "limit?", "offset?"]
    output: ImplementationStrategy[]
    side_effects: []

  - method: GET
    path: "/implementation-strategies/{strategy_id}"
    description: "Returns one implementation strategy with both state axes and budget_available_cents."
    roles: [CommunityBenefitOfficer, BoardChair, ComplianceOfficer]
    code: 200
    input: []
    output: ImplementationStrategy
    side_effects: []

  - method: POST
    path: "/implementation-strategies/{strategy_id}/submit"
    description: "Submits the strategy for board review. Moves the approval axis only; execution_state is untouched."
    roles: [CommunityBenefitOfficer]
    code: 200
    input: []
    output: ImplementationStrategy
    side_effects:
      - "approval_state DRAFT|RETURNED -> SUBMITTED, stamps submitted_at"
      - "increments ImplementationStrategy.version by 1"

  - method: POST
    path: "/implementation-strategies/{strategy_id}/objectives"
    description: "Adds a measurable objective with a baseline, a target and a target date. Baselines lock when board adoption activates the objective."
    roles: [CommunityBenefitOfficer]
    code: 201
    input: [metric_name, baseline_value, target_value, target_date]
    output: StrategyObjective
    side_effects: ["status = DRAFT, attainment_status = PENDING, attainment_pct = null"]

  - method: GET
    path: "/implementation-strategies/{strategy_id}/objectives"
    description: "Lists the strategy's objectives (reverse lookup for StrategyObjective.strategy_id)."
    roles: [CommunityBenefitOfficer, BoardChair, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StrategyObjective[]
    side_effects: []

  - method: GET
    path: "/strategy-objectives"
    description: "Lists measurable objectives across strategies (reverse lookup for StrategyObjective.strategy_id), the working list for annual progress reporting."
    roles: [CommunityBenefitOfficer, BoardChair, ComplianceOfficer]
    code: 200
    input: ["strategy_id?", "status?", "limit?", "offset?"]
    output: StrategyObjective[]
    side_effects: []

  - method: GET
    path: "/strategy-objectives/{objective_id}"
    description: "Returns one objective with its attainment_pct and attainment_status."
    roles: [CommunityBenefitOfficer, BoardChair, ComplianceOfficer]
    code: 200
    input: []
    output: StrategyObjective
    side_effects: []

  - method: POST
    path: "/strategy-objectives/{objective_id}/report-progress"
    description: "Reports the measure's current value against the locked baseline, driving calculations.objective_attainment."
    roles: [CommunityBenefitOfficer]
    code: 200
    input: [actual_value, as_of_date]
    output: StrategyObjective
    side_effects:
      - "stores actual_value and as_of_date; runs calculations.objective_attainment to set attainment_pct and attainment_status"
      - "increments StrategyObjective.version by 1"

  - method: POST
    path: "/implementation-strategies/{strategy_id}/execution-status"
    description: "Moves the strategy's execution axis (ON_TRACK, AT_RISK, BEHIND, COMPLETED, DISCONTINUED, or back to ON_TRACK out of SUSPENDED_PENDING_REVIEW) without touching the approval axis."
    roles: [CommunityBenefitOfficer]
    code: 200
    input: [to_execution_state, "execution_note?"]
    output: ImplementationStrategy
    side_effects:
      - "execution_state -> to_execution_state, stores execution_note; approval_state stays APPROVED"
      - "on DISCONTINUED: every PENDING or COMMITTED ResourceCommitment of the strategy is released and its effort, budget and partnership funding are restored"
      - "on leaving SUSPENDED_PENDING_REVIEW: AssessmentCycle.review_flag_count is recomputed and the posture may return to OPEN"
      - "increments ImplementationStrategy.version by 1"

  # ---- PartnershipAgreement / ResourceCommitment ---------------------------
  - method: POST
    path: "/partnership-agreements"
    description: "Drafts a partnership agreement with a PARTNER organization: pledged funding, a shared accountability metric, the partner's share of that metric, and an inclusive term."
    roles: [CommunityBenefitOfficer]
    code: 201
    input: [cycle_id, party_id, pledged_cents, accountability_metric, shared_accountability_pct, term_start, term_end]
    output: PartnershipAgreement
    side_effects: ["signature_state = NEGOTIATING, funding_state = UNFUNDED, funded_cents = 0"]

  - method: GET
    path: "/partnership-agreements"
    description: "Lists partnership agreements (reverse lookup for both PartnershipAgreement.cycle_id and PartnershipAgreement.party_id)."
    roles: [CommunityBenefitOfficer, ComplianceOfficer, PartnerRepresentative]
    code: 200
    input: ["cycle_id?", "party_id?", "signature_state?", "funding_state?", "limit?", "offset?"]
    output: PartnershipAgreement[]
    side_effects: []

  - method: GET
    path: "/partnership-agreements/{agreement_id}"
    description: "Returns one partnership agreement with both signature and funding axes."
    roles: [CommunityBenefitOfficer, ComplianceOfficer, PartnerRepresentative]
    code: 200
    input: []
    output: PartnershipAgreement
    side_effects: []

  - method: POST
    path: "/partnership-agreements/{agreement_id}/sign"
    description: "Records one side's signature. signatory_side is HOSPITAL (CommunityBenefitOfficer) or PARTNER (PartnerRepresentative, whose X-User-ID must equal the agreement's party_id). The agreement reaches EXECUTED and funding_state PLEDGED only once both sides have signed, in either order."
    roles: [CommunityBenefitOfficer, PartnerRepresentative]
    code: 200
    input: [signatory_side]
    output: PartnershipAgreement
    side_effects:
      - "stamps only the signing side's timestamp and signatory user id"
      - "join: when both sides are signed, signature_state -> EXECUTED and funding_state UNFUNDED -> PLEDGED"
      - "increments PartnershipAgreement.version by 1"

  - method: POST
    path: "/partnership-agreements/{agreement_id}/terminate"
    description: "Terminates the agreement, releasing every commitment it funds."
    roles: [CommunityBenefitOfficer]
    code: 200
    input: [reason]
    output: PartnershipAgreement
    side_effects:
      - "signature_state -> TERMINATED, stores terminate_reason = reason"
      - "every PENDING or COMMITTED ResourceCommitment on the agreement is released; funded_cents returns to 0 and funding_state -> RELEASED"
      - "increments PartnershipAgreement.version by 1"

  - method: POST
    path: "/resource-commitments"
    description: "Commits effort and funding from a responsible party to a strategy over a half-open date window [effective_from, effective_to). partnership_id is optional: supplying it draws the funding from an EXECUTED partnership agreement's pledge and requires the window to sit inside the agreement term."
    roles: [CommunityBenefitOfficer]
    code: 201
    input: [strategy_id, party_id, "partnership_id?", fte_bp, funding_cents, effective_from, effective_to]
    output: ResourceCommitment
    side_effects:
      - "status = PENDING; the strategy's budget_available_cents and the party's committed_fte_bp are recomputed, so a PENDING commitment already encumbers both"
      - "runs calculations.strategy_budget_available, calculations.party_committed_fte and calculations.partnership_pledge_window_load as validations[priority=20..22]"

  - method: GET
    path: "/resource-commitments"
    description: "Lists resource commitments (reverse lookup for ResourceCommitment.strategy_id, ResourceCommitment.party_id and ResourceCommitment.partnership_id)."
    roles: [CommunityBenefitOfficer, ComplianceOfficer, PartnerRepresentative]
    code: 200
    input: ["strategy_id?", "party_id?", "partnership_id?", "status?", "limit?", "offset?"]
    output: ResourceCommitment[]
    side_effects: []

  - method: GET
    path: "/resource-commitments/{commitment_id}"
    description: "Returns one resource commitment."
    roles: [CommunityBenefitOfficer, ComplianceOfficer, PartnerRepresentative]
    code: 200
    input: []
    output: ResourceCommitment
    side_effects: []

  - method: POST
    path: "/resource-commitments/{commitment_id}/release"
    description: "Releases the commitment, the compensating action for both conserved quantities: the strategy's budget envelope and the party's effort capacity return to their pre-commitment values."
    roles: [CommunityBenefitOfficer]
    code: 200
    input: [reason]
    output: ResourceCommitment
    side_effects:
      - "status -> RELEASED, stamps released_at, stores release_reason = reason"
      - "ResponsibleParty.committed_fte_bp -= fte_bp and ImplementationStrategy.budget_available_cents is recomputed"
      - "when partnership_id is non-null and the row was COMMITTED: PartnershipAgreement.funded_cents -= funding_cents, and funding_state FUNDED -> RELEASED once funded_cents reaches 0"
      - "increments ResourceCommitment.version by 1"

  # ---- CommunityBenefitReport / ExpensePosting -----------------------------
  - method: POST
    path: "/community-benefit-reports"
    description: "Opens the community benefit expense report for the cycle's fiscal year. cost_to_charge_ratio is copied from the cycle's prior_year_cost_to_charge_ratio and valuation_basis starts PROVISIONAL."
    roles: [CommunityBenefitOfficer]
    code: 201
    input: [cycle_id, fiscal_year]
    output: CommunityBenefitReport
    side_effects:
      - "status = OPEN, valuation_basis = PROVISIONAL, cost_to_charge_ratio = AssessmentCycle.prior_year_cost_to_charge_ratio, all totals 0, overhead_rate = 0.05"
      - "stores created_by_user_id = X-User-ID (the segregation-of-duties counterparty for finalize)"

  - method: GET
    path: "/community-benefit-reports"
    description: "Lists community benefit reports (reverse lookup for CommunityBenefitReport.cycle_id)."
    roles: [CommunityBenefitOfficer, ComplianceOfficer]
    code: 200
    input: ["cycle_id?", "status?", "limit?", "offset?"]
    output: CommunityBenefitReport[]
    side_effects: []

  - method: GET
    path: "/community-benefit-reports/{report_id}"
    description: "Returns one report with every category total, the overhead tier, the grand total, benefit_pct_of_expense and the version an OCC posting create must carry as expected_report_version."
    roles: [CommunityBenefitOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: CommunityBenefitReport
    side_effects: []

  - method: POST
    path: "/community-benefit-reports/{report_id}/finalize"
    description: "Locks the report against the audited cost-to-charge ratio. Must be performed by a ComplianceOfficer whose X-User-ID differs from the report's created_by_user_id."
    roles: [ComplianceOfficer]
    code: 200
    input: [audited_cost_to_charge_ratio]
    output: CommunityBenefitReport
    side_effects:
      - "status -> LOCKED, valuation_basis PROVISIONAL -> FINAL, cost_to_charge_ratio = audited_cost_to_charge_ratio, stamps locked_at and finalized_by_user_id"
      - "re-runs calculations.posting_valued_amount under the FINAL variant for every POSTED posting, then calculations.report_category_totals and calculations.report_indirect_and_grand_total"
      - "increments CommunityBenefitReport.version by 1"

  - method: POST
    path: "/expense-postings"
    description: "Posts one community benefit expense. Charge-based categories (FINANCIAL_ASSISTANCE, SUBSIDIZED_SERVICES) carry charges_cents and are valued with the report's current cost-to-charge ratio; cost-based categories carry direct_cost_cents. expected_report_version is the CommunityBenefitReport.version the client last observed (§1.2.1). strategy_id is optional and, when supplied, must name an APPROVED strategy."
    roles: [CommunityBenefitOfficer]
    code: 201
    input: [report_id, category, charges_cents, direct_cost_cents, "strategy_id?", expected_report_version]
    output: ExpensePosting
    side_effects:
      - "status = POSTED, stores posted_by_user_id = X-User-ID"
      - "runs calculations.posting_valued_amount, then calculations.report_category_totals and calculations.report_indirect_and_grand_total on the owning report"
      - "increments CommunityBenefitReport.version by 1"

  - method: GET
    path: "/expense-postings"
    description: "Lists expense postings (reverse lookup for both ExpensePosting.report_id and ExpensePosting.strategy_id)."
    roles: [CommunityBenefitOfficer, ComplianceOfficer]
    code: 200
    input: ["report_id?", "strategy_id?", "category?", "status?", "limit?", "offset?"]
    output: ExpensePosting[]
    side_effects: []

  - method: GET
    path: "/expense-postings/{posting_id}"
    description: "Returns one expense posting with its valued_cents, ratio_applied and valuation_basis_at_posting."
    roles: [CommunityBenefitOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: ExpensePosting
    side_effects: []

  - method: POST
    path: "/expense-postings/{posting_id}/void"
    description: "Voids a posting on an OPEN report. Must be performed by a user whose X-User-ID differs from the posting's posted_by_user_id. Every report total returns to the value it held before the posting existed."
    roles: [CommunityBenefitOfficer, ComplianceOfficer]
    code: 200
    input: [reason]
    output: ExpensePosting
    side_effects:
      - "status -> VOID, stores void_reason = reason and voided_by_user_id"
      - "re-runs calculations.report_category_totals and calculations.report_indirect_and_grand_total on the owning report"
      - "increments ExpensePosting.version by 1 and CommunityBenefitReport.version by 1"

  # ---- ProgressEvaluation --------------------------------------------------
  - method: POST
    path: "/progress-evaluations"
    description: "Drafts a progress evaluation. eval_type ANNUAL satisfies the annual reporting requirement the cycle must meet before closing; MID_CYCLE drives objective revision at publication."
    roles: [CommunityBenefitOfficer]
    code: 201
    input: [cycle_id, eval_type, period_year, "findings_summary?"]
    output: ProgressEvaluation
    side_effects: ["status = DRAFT, objectives_revised_count = 0"]

  - method: GET
    path: "/progress-evaluations"
    description: "Lists progress evaluations across cycles (reverse lookup for ProgressEvaluation.cycle_id). PublicViewer is deliberately absent: the public surface reaches evaluations only through GET /assessment-cycles/{cycle_id}/progress-evaluations."
    roles: [CommunityBenefitOfficer, BoardChair, ComplianceOfficer]
    code: 200
    input: ["cycle_id?", "eval_type?", "status?", "limit?", "offset?"]
    output: ProgressEvaluation[]
    side_effects: []

  - method: GET
    path: "/progress-evaluations/{evaluation_id}"
    description: "Returns one progress evaluation."
    roles: [CommunityBenefitOfficer, BoardChair, ComplianceOfficer, PublicViewer]
    code: 200
    input: []
    output: ProgressEvaluation
    side_effects: []

  - method: POST
    path: "/progress-evaluations/{evaluation_id}/publish"
    description: "Publishes the evaluation. A MID_CYCLE publication revises every ACTIVE objective whose attainment_pct is below 50.00 and moves its strategy's execution axis to BEHIND."
    roles: [CommunityBenefitOfficer]
    code: 200
    input: [public_url]
    output: ProgressEvaluation
    side_effects:
      - "status -> PUBLISHED, stores public_url, stamps published_at"
      - "on ANNUAL: AssessmentCycle.annual_report_count += 1"
      - "on MID_CYCLE: AssessmentCycle.mid_cycle_adjustment_count += 1, under-performing ACTIVE objectives move to REVISED, their strategies move ON_TRACK -> BEHIND, and objectives_revised_count is set"
      - "increments ProgressEvaluation.version by 1"

  # ---- test-driving endpoint (§1.5 priority ladder rung 3) -----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every timestamp field and every date-window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [CommunityBenefitOfficer, DataSteward, BoardChair, ComplianceOfficer]
    code: 204
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock used by all completed_at / signed_at / locked_at / filed_at stamps and by validations[priority=16] moves to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth ----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted on this endpoint, or does not match the requested transition's declared actor (advance to CLOSED, sign side)"
  - id: ERR_NOT_AGREEMENT_PARTY
    http: 403
    condition: "a PartnerRepresentative signs an agreement whose party_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID that opened a report tries to finalize it, or the same X-User-ID that posted an expense tries to void it"

  # ---- request shape -------------------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, wrong type, unknown enum member, out-of-range number, too many decimal places, ends_at <= starts_at, effective_to <= effective_from, term_end < term_start, or a concern_ratings entry outside 1..5"

  # ---- existence -----------------------------------------------------------
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "{cycle_id} or body cycle_id does not resolve to an AssessmentCycle"
  - id: ERR_INDICATOR_NOT_FOUND
    http: 404
    condition: "{indicator_id} or body indicator_id does not resolve to a HealthIndicator"
  - id: ERR_DATA_POINT_NOT_FOUND
    http: 404
    condition: "{data_point_id} does not resolve to an IndicatorDataPoint"
  - id: ERR_PARTY_NOT_FOUND
    http: 404
    condition: "{party_id}, facilitator_party_id or party_id does not resolve to a ResponsibleParty"
  - id: ERR_INTERVIEW_NOT_FOUND
    http: 404
    condition: "{interview_id} does not resolve to a StakeholderInterview"
  - id: ERR_CANDIDATE_NOT_FOUND
    http: 404
    condition: "{candidate_id} or body candidate_id does not resolve to a PriorityCandidate"
  - id: ERR_STRATEGY_NOT_FOUND
    http: 404
    condition: "{strategy_id} or body strategy_id does not resolve to an ImplementationStrategy"
  - id: ERR_OBJECTIVE_NOT_FOUND
    http: 404
    condition: "{objective_id} does not resolve to a StrategyObjective"
  - id: ERR_PARTNERSHIP_NOT_FOUND
    http: 404
    condition: "{agreement_id} or body partnership_id does not resolve to a PartnershipAgreement"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "{commitment_id} does not resolve to a ResourceCommitment"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "{report_id} or body report_id does not resolve to a CommunityBenefitReport"
  - id: ERR_POSTING_NOT_FOUND
    http: 404
    condition: "{posting_id} does not resolve to an ExpensePosting"
  - id: ERR_EVALUATION_NOT_FOUND
    http: 404
    condition: "{evaluation_id} does not resolve to a ProgressEvaluation"

  # ---- optimistic concurrency (§1.2.1) -------------------------------------
  - id: ERR_STALE_CANDIDATE_VERSION
    http: 412
    condition: "expected_candidate_version on POST /implementation-strategies does not equal the PriorityCandidate's current version"
  - id: ERR_STALE_REPORT_VERSION
    http: 412
    condition: "expected_report_version on POST /expense-postings does not equal the CommunityBenefitReport's current version"

  # ---- posture and state ---------------------------------------------------
  - id: ERR_CYCLE_FROZEN
    http: 409
    condition: "a child mutation is attempted while the owning AssessmentCycle.posture == FROZEN (cycle FILED or CLOSED)"
  - id: ERR_CYCLE_RESTRICTED
    http: 409
    condition: "an assessment-side mutation is attempted while the owning AssessmentCycle.posture == RESTRICTED (cycle in BOARD_REVIEW, or review_flag_count >= 1)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row is not in a state from which the requested transition is declared in §1.2"
  - id: ERR_INVALID_PHASE_TRANSITION
    http: 409
    condition: "the requested to_status is not the declared successor of the cycle's current status"
  - id: ERR_STRATEGY_LOCKED
    http: 409
    condition: "a new objective or resource commitment is attached to a strategy whose approval_state is not DRAFT or RETURNED"
  - id: ERR_INPUT_WINDOW_CLOSED
    http: 409
    condition: "a new stakeholder interview is scheduled after the cycle has left INPUT_GATHERING"

  # ---- cross-entity state --------------------------------------------------
  - id: ERR_INDICATOR_DATA_INSUFFICIENT
    http: 409
    condition: "a candidate is scored while its HealthIndicator.data_state == INSUFFICIENT"
  - id: ERR_STRATEGY_NOT_APPROVED
    http: 409
    condition: "an execution-status change or an expense posting references a strategy whose approval_state != APPROVED"
  - id: ERR_PARTNERSHIP_NOT_EXECUTED
    http: 409
    condition: "a resource commitment draws funding from a partnership agreement whose signature_state != EXECUTED"
  - id: ERR_PARTY_TYPE_MISMATCH
    http: 409
    condition: "an interview facilitator is not an INTERNAL party, or a partnership counterparty is not a PARTNER party"

  # ---- compliance and referential completeness -----------------------------
  - id: ERR_PUBLIC_AVAILABILITY_NOT_MET
    http: 409
    condition: "the cycle is filed before its assessment and strategy are publicly available"
  - id: ERR_REPORT_NOT_LOCKED
    http: 409
    condition: "the cycle is filed while its CommunityBenefitReport is missing or still OPEN"
  - id: ERR_STRATEGY_SET_INCOMPLETE
    http: 409
    condition: "a selected priority lacks a submitted strategy with at least one objective, or a strategy is submitted with no objectives"
  - id: ERR_ANNUAL_REPORT_MISSING
    http: 409
    condition: "the cycle is closed with no published ANNUAL progress evaluation"

  # ---- temporal ------------------------------------------------------------
  - id: ERR_FACILITATOR_WINDOW_CONFLICT
    http: 409
    condition: "the requested session falls within 30 minutes of an existing SCHEDULED or COMPLETED session of the same facilitator"
  - id: ERR_DATA_POINT_OUT_OF_WINDOW
    http: 409
    condition: "collected_on is earlier than (fiscal_year - 3)-01-01 or later than the logical clock's current date"
  - id: ERR_COMMITMENT_OUTSIDE_TERM
    http: 409
    condition: "a partnership-funded commitment window is not contained in the agreement term"

  # ---- uniqueness ----------------------------------------------------------
  - id: ERR_DUPLICATE_FISCAL_YEAR
    http: 409
    condition: "an assessment cycle already exists for that fiscal_year"
  - id: ERR_DUPLICATE_INDICATOR_NAME
    http: 409
    condition: "the cycle already has a health indicator with that name"
  - id: ERR_DUPLICATE_ORGANIZATION
    http: 409
    condition: "the cycle already has a SCHEDULED or COMPLETED interview with that organization_name"
  - id: ERR_DUPLICATE_REPORT
    http: 409
    condition: "the cycle already has a community benefit report for that fiscal_year"
  - id: ERR_DUPLICATE_EVALUATION_PERIOD
    http: 409
    condition: "the cycle already has an evaluation of that eval_type for that period_year"

  # ---- constraint and fiscal ----------------------------------------------
  - id: ERR_POSTING_BASIS_MISMATCH
    http: 409
    condition: "a charge-based category carries direct_cost_cents (or no charges), or a cost-based category carries charges_cents (or no direct cost)"
  - id: ERR_PARTY_FTE_CAPACITY_EXCEEDED
    http: 409
    condition: "committed_fte_bp + fte_bp would exceed the party's fte_capacity_bp"
  - id: ERR_PARTNERSHIP_PLEDGE_WINDOW_EXCEEDED
    http: 409
    condition: "the funding of overlapping commitments on one agreement would exceed pledged_cents"
  - id: ERR_STRATEGY_BUDGET_EXCEEDED
    http: 409
    condition: "funding_cents exceeds the strategy's budget_available_cents"

  # ---- thresholds and completeness gates ----------------------------------
  - id: ERR_INSUFFICIENT_INDICATOR_COVERAGE
    http: 409
    condition: "the cycle leaves DATA_COLLECTION with no SUFFICIENT health indicator"
  - id: ERR_NO_COMMUNITY_INPUT
    http: 409
    condition: "the cycle leaves INPUT_GATHERING with no COMPLETED stakeholder interview"
  - id: ERR_NO_SELECTED_PRIORITY
    http: 409
    condition: "the cycle leaves PRIORITIZATION with no SELECTED priority candidate"
  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "a board action is recorded with quorum_present == false"
  - id: ERR_ADOPTION_VOTE_FAILED
    http: 409
    condition: "an ADOPT board action carries votes_for <= votes_against"
  - id: ERR_NO_DOMAIN_INPUT
    http: 409
    condition: "a candidate is scored with no completed interview rating its indicator's domain"
  - id: ERR_STALE_CONCERN_INPUT
    http: 409
    condition: "a candidate whose concern_input_dirty == true is selected without re-scoring"
  - id: ERR_PRIORITY_SCORE_BELOW_THRESHOLD
    http: 409
    condition: "a candidate whose composite_score is below 60.00 is selected"
  - id: ERR_REPORT_EMPTY
    http: 409
    condition: "a report with no POSTED expense posting is finalized"
  - id: ERR_OBJECTIVE_PROGRESS_MISSING
    http: 409
    condition: "a strategy is moved to execution_state COMPLETED while an objective has never had progress reported"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CommunityBenefitOfficer
    description: "Runs the assessment cycle end to end: indicators, community input, prioritization, strategies, partnerships, commitments, expense postings and evaluations. Cannot certify indicator data, cannot adopt the assessment, and cannot lock or file the community benefit report."
    identity: opaque
    exclusive_operations:
      - "POST /assessment-cycles"
      - "POST /assessment-cycles/{cycle_id}/publish"
      - "POST /stakeholder-interviews"
      - "POST /stakeholder-interviews/{interview_id}/complete"
      - "POST /stakeholder-interviews/{interview_id}/cancel"
      - "POST /priority-candidates"
      - "POST /priority-candidates/{candidate_id}/score"
      - "POST /priority-candidates/{candidate_id}/select"
      - "POST /priority-candidates/{candidate_id}/defer"
      - "POST /implementation-strategies"
      - "POST /implementation-strategies/{strategy_id}/submit"
      - "POST /implementation-strategies/{strategy_id}/objectives"
      - "POST /implementation-strategies/{strategy_id}/execution-status"
      - "POST /strategy-objectives/{objective_id}/report-progress"
      - "POST /responsible-parties"
      - "POST /partnership-agreements"
      - "POST /partnership-agreements/{agreement_id}/terminate"
      - "POST /resource-commitments"
      - "POST /resource-commitments/{commitment_id}/release"
      - "POST /community-benefit-reports"
      - "POST /expense-postings"
      - "POST /progress-evaluations"
      - "POST /progress-evaluations/{evaluation_id}/publish"
      - "POST /partnership-agreements/{agreement_id}/sign with signatory_side = HOSPITAL"
      - "POST /assessment-cycles/{cycle_id}/advance for every to_status except CLOSED"
    shared_operations:
      - "POST /health-indicators (with DataSteward)"
      - "POST /expense-postings/{posting_id}/void (with ComplianceOfficer, subject to segregation of duties)"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"

  - name: DataSteward
    description: "Certifies the epidemiological evidence base. Sole author and sole retractor of indicator observations, which is what makes the void cascade a segregated action."
    identity: opaque
    exclusive_operations:
      - "POST /health-indicators/{indicator_id}/data-points"
      - "POST /indicator-data-points/{data_point_id}/void"
    shared_operations:
      - "POST /health-indicators (with CommunityBenefitOfficer)"
      - "POST /_clock/set_current_utc"
      - "GET /assessment-cycles, GET /assessment-cycles/{cycle_id}, GET /health-indicators, GET /health-indicators/{indicator_id}, GET /health-indicators/{indicator_id}/data-points, GET /indicator-data-points, GET /indicator-data-points/{data_point_id}"

  - name: BoardChair
    description: "Records the board's decision on the assessment and its implementation strategies. The only role that can adopt or defer, and the trigger of the three-link adoption cascade."
    identity: opaque
    exclusive_operations:
      - "POST /assessment-cycles/{cycle_id}/board-action"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "read access to cycles, indicators, interviews, candidates, strategies, objectives and progress evaluations"

  - name: PartnerRepresentative
    description: "Acts for a community partner organization. X-User-ID is the id of the ResponsibleParty the representative acts for, so the partner signature is bound to the agreement's counterparty."
    identity: "entity_backed:ResponsibleParty"
    exclusive_operations:
      - "POST /partnership-agreements/{agreement_id}/sign with signatory_side = PARTNER (requires X-User-ID == agreement.party_id)"
    shared_operations:
      - "GET /assessment-cycles, GET /assessment-cycles/{cycle_id}, GET /partnership-agreements, GET /partnership-agreements/{agreement_id}, GET /resource-commitments, GET /resource-commitments/{commitment_id}, GET /responsible-parties/{party_id}"

  - name: ComplianceOfficer
    description: "Owns the regulatory end of the cycle: locks the community benefit report against the audited ratio, files the assessment with the annual return, and closes the cycle. Cannot open the report it locks."
    identity: opaque
    exclusive_operations:
      - "POST /community-benefit-reports/{report_id}/finalize"
      - "POST /assessment-cycles/{cycle_id}/file-return"
      - "POST /assessment-cycles/{cycle_id}/advance with to_status = CLOSED"
    shared_operations:
      - "POST /expense-postings/{posting_id}/void (with CommunityBenefitOfficer, subject to segregation of duties)"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint except GET /assessment-cycles/{cycle_id}/progress-evaluations filters"

  - name: PublicViewer
    description: "The public availability surface. Read-only access to the cycle itself and to published progress evaluations; every other read and every write is denied."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /assessment-cycles"
      - "GET /assessment-cycles/{cycle_id}"
      - "GET /assessment-cycles/{cycle_id}/progress-evaluations"
      - "GET /progress-evaluations/{evaluation_id}"
