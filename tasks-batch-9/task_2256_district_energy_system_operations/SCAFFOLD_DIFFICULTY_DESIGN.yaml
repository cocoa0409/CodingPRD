  - rule_id: resource_temporal_overlap
    instances:
      - name: loop_capacity_ceiling_sweep_over_half_open_reservation_windows
        grounds:
          - calculations.loop_capacity_reservation_sweep
          - validations[priority=17]
          - errors[ERR_LOOP_CAPACITY_EXCEEDED]
          - entities.NetworkLoop.fields.committed_reserved_kw
          - entities.ConnectionAgreement.fields.reserved_capacity_kw
        distinguishing_aspect: |
          Contended resource is the NetworkLoop's oversubscription ceiling and the interval semantics
          are HALF-OPEN [service_start_date, service_end_date) evaluated only at start-date
          boundaries, so a peer whose window ends exactly at the candidate's start date does not
          count against it. The ceiling comparison is a strict >, so a candidate landing on exactly
          23000.00 at the 2026-06-01 boundary activates while one landing on 23000.01 is rejected.
        test_recipe:
          setup:
            - "NetworkLoop LOOP-K (HEATING, rated_capacity_kw 20000.0), so ceiling_kw is round(20000.0 * 1.15, 2) == 23000.00."
            - "Three ACTIVE peer agreements on LOOP-K: K1 9000.0 (2026-01-01 to 2026-07-01), K2 9000.0 (2026-04-01 to 2026-10-01), K4 4000.0 (2026-05-01 to 2026-06-01)."
            - "Two PENDING_CAPACITY candidates on the 2026-06-01 to 2026-12-01 window: K5 reserved 5000.01 and K3 reserved 5000.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-K", name: "Campus Loop K", service_mode: "HEATING", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 20000.0 }
              as: SystemController
              captures: { loop_k_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 30.0, energy_rate_per_mwh: 88.00 }, { load_factor_max: 65.0, energy_rate_per_mwh: 74.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_k_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Peer K1", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 9000.0, service_mode: "HEATING", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-07-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { k1_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${k1_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_k_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Peer K2", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 9000.0, service_mode: "HEATING", service_start_date: "2026-04-01T00:00:00Z", service_end_date: "2026-10-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { k2_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${k2_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_k_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Peer K4", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 4000.0, service_mode: "HEATING", service_start_date: "2026-05-01T00:00:00Z", service_end_date: "2026-06-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { k4_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${k4_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_k_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Candidate K5", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 5000.01, service_mode: "HEATING", service_start_date: "2026-06-01T00:00:00Z", service_end_date: "2026-12-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { k5_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_k_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Candidate K3", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 5000.0, service_mode: "HEATING", service_start_date: "2026-06-01T00:00:00Z", service_end_date: "2026-12-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { k3_id: $.data.id }
          trigger:
            - call: "POST /district-energy/connection-agreements/${k5_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/connection-agreements/${k3_id}/activate"
              payload: {}
              as: BillingAnalyst
          assert:
            - "NetworkLoop.${loop_k_id}.committed_reserved_kw == 22000.0 before either trigger call"
            - "POST /district-energy/connection-agreements/${k5_id}/activate returns HTTP 409 with error_id ERR_LOOP_CAPACITY_EXCEEDED because concurrent reserved capacity at the 2026-06-01 boundary would be 23000.01 against a ceiling of 23000.00"
            - "ConnectionAgreement.${k5_id}.contract_state == PENDING_CAPACITY"
            - "NetworkLoop.${loop_k_id}.committed_reserved_kw == 22000.0 after the rejected activate"
            - "POST /district-energy/connection-agreements/${k3_id}/activate returns HTTP 200 and ConnectionAgreement.${k3_id}.contract_state == ACTIVE because the 2026-06-01 boundary total is exactly 23000.00 and the ceiling test is a strict greater-than"
            - "the 2026-06-01 boundary total excludes ConnectionAgreement.${k4_id} (reserved 4000.0) because its service_end_date is exactly 2026-06-01T00:00:00Z and the window is half-open"
            - "NetworkLoop.${loop_k_id}.committed_reserved_kw == 27000.0"

      - name: work_window_single_occupancy_with_six_hour_refill_buffer
        grounds:
          - calculations.work_window_conflict_detection
          - validations[priority=13]
          - errors[ERR_WORK_WINDOW_CONFLICT]
          - state_machines.WorkOrder.DRAFT_to_PERMIT_PENDING
          - entities.WorkOrder.fields.window_start
        distinguishing_aspect: |
          A different resource entity (PipeSegment, single-occupancy excavation) with different
          interval semantics from the loop sweep: windows are CLOSED on both ends and each peer's
          window_end is first extended by REFILL_BUFFER_HOURS = 6 whole hours, so the exclusion zone
          runs to 2026-09-01T22:00:00Z. A candidate starting exactly at that buffered end conflicts
          (touching endpoints of closed intervals overlap), while one starting one minute later does
          not — the opposite endpoint convention to the half-open capacity sweep.
        test_recipe:
          setup:
            - "PipeSegment SEG-K1 on NetworkLoop LOOP-K."
            - "Peer WorkOrder WOP on SEG-K1 with window 2026-09-01T08:00:00Z to 2026-09-01T16:00:00Z, driven to PERMIT_PENDING so it is in the conflict input set."
            - "Candidate WOC1 on SEG-K1 with window_start exactly 2026-09-01T22:00:00Z, and candidate WOC2 with window_start 2026-09-01T22:01:00Z; both still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-K", name: "Campus Loop K", service_mode: "HEATING", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 20000.0 }
              as: SystemController
              captures: { loop_k_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_k_id}", code: "SEG-K1", length_m: 700.0, diameter_mm: 200, install_year: 2004, insulation_class: "B", buried_depth_m: 1.5 }
              as: NetworkEngineer
              captures: { seg_k1_id: $.data.id }
            - call: "POST /district-energy/work-orders"
              payload: { segment_id: "${seg_k1_id}", loop_id: "${loop_k_id}", work_type: "VALVE_REPLACEMENT", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T16:00:00Z", requires_isolation: false }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { wop_id: $.data.id }
            - call: "POST /district-energy/work-orders/${wop_id}/submit-permit"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/work-orders"
              payload: { segment_id: "${seg_k1_id}", loop_id: "${loop_k_id}", work_type: "INSPECTION", window_start: "2026-09-01T22:00:00Z", window_end: "2026-09-02T02:00:00Z", requires_isolation: false }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { woc1_id: $.data.id }
            - call: "POST /district-energy/work-orders"
              payload: { segment_id: "${seg_k1_id}", loop_id: "${loop_k_id}", work_type: "INSPECTION", window_start: "2026-09-01T22:01:00Z", window_end: "2026-09-02T02:00:00Z", requires_isolation: false }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { woc2_id: $.data.id }
          trigger:
            - call: "POST /district-energy/work-orders/${woc1_id}/submit-permit"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/work-orders/${woc2_id}/submit-permit"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
          assert:
            - "WorkOrder.${wop_id}.work_state == PERMIT_PENDING"
            - "POST /district-energy/work-orders/${woc1_id}/submit-permit returns HTTP 409 with error_id ERR_WORK_WINDOW_CONFLICT because the peer's buffered end is 2026-09-01T22:00:00Z and the candidate starts at exactly that instant"
            - "WorkOrder.${woc1_id}.work_state == DRAFT"
            - "WorkOrder.${woc1_id}.permit_decision == PENDING"
            - "POST /district-energy/work-orders/${woc2_id}/submit-permit returns HTTP 200 and WorkOrder.${woc2_id}.work_state == PERMIT_PENDING because its window_start 2026-09-01T22:01:00Z is after the peer's buffered end"
            - "WorkOrder.${woc1_id} remains excluded from the conflict input set for ${woc2_id} because it never left DRAFT"

  - rule_id: compensating_invariant
    instances:
      - name: loop_reserved_capacity_kw_conserved_across_activate_suspend_terminate
        grounds:
          - state_machines.ConnectionAgreement.PENDING_CAPACITY_to_ACTIVE
          - state_machines.ConnectionAgreement.ACTIVE_to_SUSPENDED
          - state_machines.ConnectionAgreement.SUSPENDED_to_TERMINATED
          - entities.NetworkLoop.fields.committed_reserved_kw
          - endpoints[POST /district-energy/connection-agreements/{agreement_id}/status]
        distinguishing_aspect: |
          The conserved quantity is reserved CAPACITY in kW: NetworkLoop.committed_reserved_kw must
          at all times equal the sum of reserved_capacity_kw over that loop's agreements in
          {ACTIVE, SUSPENDED}. Suspension is deliberately NOT a release, so the running total must
          not move on ACTIVE to SUSPENDED, and termination must give back exactly the amount the
          activation took — 5000.0 back down to 2000.0, never 0.0 and never a residual — while the
          agreement's meters cascade to REMOVED.
        test_recipe:
          setup:
            - "NetworkLoop LOOP-M (HEATING, rated_capacity_kw 10000.0) with committed_reserved_kw 0.0."
            - "PipeSegment SEG-M1 on LOOP-M."
            - "Two PENDING_CAPACITY agreements on LOOP-M: M1 reserved 3000.0 and M2 reserved 2000.0, both COMMERCIAL_OFFICE on RS-C for 2026-01-01 to 2027-01-01."
            - "MeteringPoint MP-M1 installed for M1 on SEG-M1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-M", name: "Midtown Loop M", service_mode: "HEATING", design_supply_temp_c: 98.0, max_pressure_kpa: 1450.0, rated_capacity_kw: 10000.0 }
              as: SystemController
              captures: { loop_m_id: $.data.id, loop_m_reserved_initial: $.data.committed_reserved_kw }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_m_id}", code: "SEG-M1", length_m: 500.0, diameter_mm: 150, install_year: 2012, insulation_class: "A", buried_depth_m: 1.2 }
              as: NetworkEngineer
              captures: { seg_m1_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 30.0, energy_rate_per_mwh: 88.00 }, { load_factor_max: 65.0, energy_rate_per_mwh: 74.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_m_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Midtown Plaza", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 3000.0, service_mode: "HEATING", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { m1_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_m_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Midtown Annex", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 2000.0, service_mode: "HEATING", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { m2_id: $.data.id }
            - call: "POST /district-energy/metering-points"
              payload: { agreement_id: "${m1_id}", segment_id: "${seg_m1_id}", code: "MP-M1", multiplier: 1.0 }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { mp_m1_id: $.data.id }
          trigger:
            - call: "POST /district-energy/connection-agreements/${m2_id}/activate"
              payload: {}
              as: BillingAnalyst
              captures: { reserved_after_m2: $.data.reserved_capacity_kw }
            - call: "POST /district-energy/connection-agreements/${m1_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "GET /district-energy/network-loops/${loop_m_id}"
              payload: {}
              as: BillingAnalyst
              captures: { loop_m_reserved_peak: $.data.committed_reserved_kw }
            - call: "POST /district-energy/connection-agreements/${m1_id}/status"
              payload: { contract_state: "SUSPENDED", reason: "billing hold" }
              as: BillingAnalyst
            - call: "GET /district-energy/network-loops/${loop_m_id}"
              payload: {}
              as: BillingAnalyst
              captures: { loop_m_reserved_suspended: $.data.committed_reserved_kw }
            - call: "POST /district-energy/connection-agreements/${m1_id}/status"
              payload: { contract_state: "TERMINATED", reason: "customer exit" }
              as: BillingAnalyst
            - call: "GET /district-energy/network-loops/${loop_m_id}"
              payload: {}
              as: BillingAnalyst
              captures: { loop_m_reserved_final: $.data.committed_reserved_kw }
          assert:
            - "${loop_m_reserved_initial} == 0.0"
            - "${reserved_after_m2} == 2000.0"
            - "${loop_m_reserved_peak} == 5000.0"
            - "${loop_m_reserved_suspended} == 5000.0 because SUSPENDED agreements still hold their reservation"
            - "ConnectionAgreement.${m1_id}.contract_state == TERMINATED"
            - "${loop_m_reserved_final} == 2000.0"
            - "${loop_m_reserved_final} == ${loop_m_reserved_peak} - 3000.0"
            - "${loop_m_reserved_final} == ${loop_m_reserved_initial} + 2000.0"
            - "MeteringPoint.${mp_m1_id}.meter_state == REMOVED"
            - "ConnectionAgreement.${m2_id}.contract_state == ACTIVE"

      - name: storage_energy_kwh_ledger_returns_to_zero_drift_over_two_commit_cycles
        grounds:
          - state_machines.DispatchPlan.APPROVED_to_COMMITTED
          - state_machines.DispatchPlan.COMMITTED_to_DRAFT
          - entities.ProductionAsset.fields.state_of_charge_kwh
          - entities.DispatchOrder.fields.discharged_kwh
          - endpoints[POST /district-energy/dispatch-plans/{plan_id}/decommit]
        distinguishing_aspect: |
          A different conserved quantity in different units: thermal storage ENERGY in kWh on
          ProductionAsset.state_of_charge_kwh, drawn down by DispatchOrder.discharged_kwh on commit
          and pushed back by exactly the same figure on decommit. Two full commit-decommit cycles are
          run so any accumulated drift (double-credit, rounding residue, or crediting the recomputed
          rather than the recorded discharged_kwh) is visible: the ledger must read 4000.0, 0.0,
          4000.0, 0.0, 4000.0 while the asset version rises monotonically by one per write.
        test_recipe:
          setup:
            - "NetworkLoop LOOP-C (DUAL, rated 8000.0) in posture NORMAL with ACTIVE ConnectionAgreement CA3 (COMMERCIAL_OFFICE, reserved 3000.0)."
            - "PUBLISHED LoadForecast F3 for LOOP-C on 2026-08-05 with coincident_demand_kw 2527.20."
            - "Four AVAILABLE ProductionAssets on LOOP-C: C_STO (THERMAL_STORAGE rated 1000.0, storage_capacity_kwh 4000.0, state_of_charge_kwh 4000.0, cost 6.00), C_CHP (CHP 1200.0, min_stable 400.0, cost 40.00), C_BIO (BIOMASS_BOILER 1500.0, min_stable 300.0, cost 52.00), C_OIL (BOILER 2000.0, min_stable 200.0, cost 90.00)."
            - "A DispatchPlan on LOOP-C bound to F3, optimized, submitted and APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-C", name: "Campus Loop C", service_mode: "DUAL", design_supply_temp_c: 90.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 8000.0 }
              as: SystemController
              captures: { loop_c_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 30.0, energy_rate_per_mwh: 88.00 }, { load_factor_max: 65.0, energy_rate_per_mwh: 74.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_c_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Campus Facilities", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 3000.0, service_mode: "DUAL", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ca3_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${ca3_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/fuel-supply-contracts"
              payload: { supplier_code: "FCG-C", fuel_type: "NATURAL_GAS", contracted_energy_mwh_per_year: 40000.0, price_per_mwh: 30.00, delivery_firmness: "FIRM" }
              as: SystemController
              captures: { fcg_c_id: $.data.id }
            - call: "POST /district-energy/fuel-supply-contracts"
              payload: { supplier_code: "FCB-C", fuel_type: "BIOMASS", contracted_energy_mwh_per_year: 20000.0, price_per_mwh: 42.00, delivery_firmness: "INTERRUPTIBLE" }
              as: SystemController
              captures: { fcb_c_id: $.data.id }
            - call: "POST /district-energy/fuel-supply-contracts"
              payload: { supplier_code: "FCO-C", fuel_type: "FUEL_OIL", contracted_energy_mwh_per_year: 8000.0, price_per_mwh: 80.00, delivery_firmness: "FIRM" }
              as: SystemController
              captures: { fco_c_id: $.data.id }
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_c_id}", code: "C_STO", asset_type: "THERMAL_STORAGE", rated_capacity_kw: 1000.0, marginal_cost_per_mwh: 6.00, emission_factor_kg_per_mwh: 0.0, storage_capacity_kwh: 4000.0, state_of_charge_kwh: 4000.0 }
              as: SystemController
              captures: { c_sto_id: $.data.id, sto_soc_initial: $.data.state_of_charge_kwh, sto_v0: $.data.version }
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_c_id}", code: "C_CHP", asset_type: "CHP", rated_capacity_kw: 1200.0, marginal_cost_per_mwh: 40.00, emission_factor_kg_per_mwh: 205.0, fuel_contract_id: "${fcg_c_id}", derated_capacity_kw: 600.0, min_stable_output_kw: 400.0 }
              as: SystemController
              captures: { c_chp_id: $.data.id }
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_c_id}", code: "C_BIO", asset_type: "BIOMASS_BOILER", rated_capacity_kw: 1500.0, marginal_cost_per_mwh: 52.00, emission_factor_kg_per_mwh: 28.0, fuel_contract_id: "${fcb_c_id}", derated_capacity_kw: 750.0, min_stable_output_kw: 300.0 }
              as: SystemController
              captures: { c_bio_id: $.data.id }
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_c_id}", code: "C_OIL", asset_type: "BOILER", rated_capacity_kw: 2000.0, marginal_cost_per_mwh: 90.00, emission_factor_kg_per_mwh: 260.0, fuel_contract_id: "${fco_c_id}", derated_capacity_kw: 1000.0, min_stable_output_kw: 200.0 }
              as: SystemController
              captures: { c_oil_id: $.data.id }
            - call: "POST /district-energy/load-forecasts"
              payload: { loop_id: "${loop_c_id}", service_date: "2026-08-05T00:00:00Z", occupancy_profile: "WEEKDAY_FULL", heating_degree_hours: 0.0, cooling_degree_hours: 0.0 }
              as: DispatchOperator
              captures: { f3_id: $.data.id }
            - call: "POST /district-energy/load-forecasts/${f3_id}/publish"
              payload: { variant: "WEATHER_NORMAL_PROVISIONAL" }
              as: DispatchOperator
            - call: "GET /district-energy/network-loops/${loop_c_id}"
              payload: {}
              as: DispatchOperator
              captures: { loop_c_v: $.data.version }
            - call: "POST /district-energy/dispatch-plans"
              payload: { loop_id: "${loop_c_id}", forecast_id: "${f3_id}", expected_loop_version: "${loop_c_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { plan_c_id: $.data.id }
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/optimize"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/submit"
              payload: { submission_note: "cycle one" }
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/review"
              payload: { decision: "APPROVE", review_note: "cleared" }
              as: SystemController
              as_user_id: "ctrl-1"
          trigger:
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/commit"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "GET /district-energy/production-assets/${c_sto_id}"
              payload: {}
              as: DispatchOperator
              captures: { sto_soc_commit_1: $.data.state_of_charge_kwh, sto_v1: $.data.version }
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/decommit"
              payload: { reason: "cycle one withdrawn" }
              as: SystemController
              as_user_id: "ctrl-1"
            - call: "GET /district-energy/production-assets/${c_sto_id}"
              payload: {}
              as: DispatchOperator
              captures: { sto_soc_decommit_1: $.data.state_of_charge_kwh, sto_v2: $.data.version }
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/submit"
              payload: { submission_note: "cycle two" }
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/review"
              payload: { decision: "APPROVE", review_note: "cleared again" }
              as: SystemController
              as_user_id: "ctrl-1"
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/commit"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "GET /district-energy/production-assets/${c_sto_id}"
              payload: {}
              as: DispatchOperator
              captures: { sto_soc_commit_2: $.data.state_of_charge_kwh, sto_v3: $.data.version }
            - call: "POST /district-energy/dispatch-plans/${plan_c_id}/decommit"
              payload: { reason: "cycle two withdrawn" }
              as: SystemController
              as_user_id: "ctrl-1"
            - call: "GET /district-energy/production-assets/${c_sto_id}"
              payload: {}
              as: DispatchOperator
              captures: { sto_soc_decommit_2: $.data.state_of_charge_kwh, sto_v4: $.data.version }
          assert:
            - "${sto_soc_initial} == 4000.0"
            - "the DispatchOrder for plan ${plan_c_id} and asset ${c_sto_id} has merit_rank == 1, allocated_kw == 1000.00 and discharged_kwh == 4000.00"
            - "${sto_soc_commit_1} == 0.0"
            - "${sto_soc_decommit_1} == 4000.0"
            - "${sto_soc_commit_2} == 0.0"
            - "${sto_soc_decommit_2} == 4000.0"
            - "${sto_soc_decommit_2} == ${sto_soc_initial}"
            - "${sto_v1} == ${sto_v0} + 1"
            - "${sto_v2} == ${sto_v0} + 2"
            - "${sto_v3} == ${sto_v0} + 3"
            - "${sto_v4} == ${sto_v0} + 4"
            - "the non-storage DispatchOrder rows for ${c_chp_id} and ${c_bio_id} carry discharged_kwh == 0.00 so ProductionAsset.${c_chp_id}.state_of_charge_kwh and ProductionAsset.${c_bio_id}.state_of_charge_kwh stay 0.0 across both cycles"
            - "DispatchPlan.${plan_c_id}.plan_state == DRAFT"
