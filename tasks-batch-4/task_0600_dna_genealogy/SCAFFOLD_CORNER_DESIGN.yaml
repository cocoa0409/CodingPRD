              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 402"
            - "${err} == ERR_INSUFFICIENT_CREDIT"
            - "Subscription.${sub}.tier == PLUS"
            - "Subscription.${sub}.lifetime_charged_cents == 0"
            - "Customer.${c}.wallet_credit_cents == 1000"

      - name: existence_check_precedes_state_check_on_unknown_customer_report
        claim_type: Priority Ordering
        grounds: ["validations[priority=3]", "validations[priority=11]", "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "A report request against a non-existent customer id returns ERR_CUSTOMER_NOT_FOUND (404) — the priority-3 existence check fires before the priority-11 dna_status check and before the priority-7 OCC check."
        test_recipe:
          setup: ["One real Customer exists (so a real version value can be read); the report call targets a DIFFERENT, non-existent customer id."]
          setup_api_calls:
            - call: "POST /dna/customers"
