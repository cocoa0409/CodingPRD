        distinguishing_aspect: "Role exclusivity: FieldAuditor cannot approve plans, ManagementOwner cannot sign off workpapers, AuditCommittee cannot create engagements — each denied with 403 ERR_FORBIDDEN_ROLE before any existence or state check."
        test_recipe:
          setup: ["A STAFF auditor exists (for a valid FieldAuditor identity); no target resources needed since role checks fire first"]
          setup_api_calls:
            - { call: "POST /audit/auditors", payload: { full_name: "Sam Staff", grade: "STAFF" }, as: AuditAdmin, captures: { staff1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
          trigger:
            - { call: "POST /audit/audit-plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/approve", payload: {}, as: FieldAuditor, as_user_id: "${staff1}", captures: { e1: "$.data.error_id" } }
            - { call: "POST /audit/workpapers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/sign-off", payload: {}, as: ManagementOwner, as_user_id: "mgmt-1", captures: { e2: "$.data.error_id" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", title: "G", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditCommittee, as_user_id: "ac-1", captures: { e3: "$.data.error_id" } }
          assert:
            - "e1 == ERR_FORBIDDEN_ROLE (FieldAuditor on committee-only approve)"
            - "e2 == ERR_FORBIDDEN_ROLE (ManagementOwner on manager-only sign-off)"
