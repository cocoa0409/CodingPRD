      - name: corner_agent_authority_limit_blocks_the_bind
        claim_type: triggerability
        grounds: ["errors.ERR_AGENT_AUTHORITY_EXCEEDED", "validations[priority=15]", "entities.Agent.fields.authority_limit_cents"]
        distinguishing_aspect: "The authority check reads the producer's live limit at bind time, not at rating time: lowering the limit to 100000 after the 269200 rating turns the bind into ERR_AGENT_AUTHORITY_EXCEEDED (422), and restoring it lets the identical call through."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with an RC DWELLING and an all-zero labor profile, rated to 269200 under an authority limit of 5000000"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_labor_zero
            - *k_rate_get
            - *k_rate
            - *k_bind_get
          trigger:
            - call: "PATCH /agents/${ag_id}"
              payload: { authority_limit_cents: 100000 }
              as: PlatformAdmin
              captures: { low_limit: $.data.authority_limit_cents }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v_bind}" }
              as: Underwriter
              captures: { e_auth: $.data.error_id }
            - call: "PATCH /agents/${ag_id}"
              payload: { authority_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { high_limit: $.data.authority_limit_cents }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v_bind}" }
              as: Underwriter
              captures: { auth_bound: $.data.uw_status }
          assert:
            - "the first bind returns HTTP 422 ERR_AGENT_AUTHORITY_EXCEEDED because total_premium_cents 269200 exceeds the producer limit of 100000"
            - "the policy stays RATED with its three reservations RESERVED and its version unchanged, so the same expected_policy_version binds on the retry"
            - "after the limit is restored the bind succeeds: uw_status BOUND, the reservations become COMMITTED and total_premium_cents is still 269200"
            - "lowering the limit did not re-rate or re-price anything — only the bind gate reads it"

      - name: corner_error_wc_state_invalid_covered_by_difficulty
        claim_type: triggerability
        grounds: ["errors.ERR_WC_STATE_INVALID"]
        excluded_because:
          difficulty_instance: labor_profile_pending_verified_lapsed_cycle
          rationale: "The §1.8 cyclic_state_revisit instance already drives the verification endpoint from every wrong state (NOT_REQUIRED and VERIFIED) and pins ERR_WC_STATE_INVALID."

