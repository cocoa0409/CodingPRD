# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task: task_3134_demand_acute_home_visit_dispatch_emergency_diversion
#
# Depth probe. Every Difficulty Rule from §0.5 cross-referenced against
# SCAFFOLD.yaml §1.1–§1.7 with ≥2 grounded instances per rule.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_total_provisional_includes_unresulted_but_final_excludes
        grounds:
          - calculations.site_of_service_claim_total
          - entities.Claim.fields.provisional_total_cents
          - entities.Claim.fields.final_total_cents
        distinguishing_aspect: |
          Same encounter data, two variants: provisional_total_cents includes
          ORDERED/COLLECTED/RESULTED/AMENDED diagnostic orders; final_total_cents
          includes only RESULTED/VERIFIED/AMENDED. The two variants MUST produce
          different totals when an ORDERED-or-COLLECTED order is present.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T10:00:00Z."
            - "Market DFW-NORTH active; PayerContract ACTIVE with urgent_base_rate_cents=40000, place_of_service_modifier_pct=0.85, max_claim_cents=1000000."
            - "Patient (no red flags, acuity URGENT after triage); visit driven to ON_SCENE; one IV_INFUSION DiagnosticOrder RESULTED with units=2 unit_price_cents=3000 (line 6000), one POCT order still ORDERED with list price 1500 and units=1."
            - "Claim has been auto-created at disposition; provisional is read BEFORE disposition completes — for this test we read Claim after disposition so the only differentiator is the still-ORDERED POCT line."
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-NORTH", display_name: "Dallas Fort Worth North", polygon_geojson: "{\"type\":\"Polygon\",\"coordinates\":[[[-97.5,32.5],[-96.5,32.5],[-96.5,33.5],[-97.5,33.5],[-97.5,32.5]]]}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/payer-contracts"
              payload: { payer_code: "AETNA", market_id: "${mkt_id}", urgent_base_rate_cents: 40000, standard_base_rate_cents: 25000, place_of_service_modifier_pct: 0.85, max_claim_cents: 1000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /dh/payer-contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /dh/payer-contracts/${contract_id}/formulary-entries"
              payload: { drug_code: "IVF-NS-1L", max_units_per_visit: 3, requires_physician_preauth: false, unit_price_cents: 3000 }
              as: PlatformAdmin
            - call: "POST /dh/patients"
              payload: { full_name: "Alice Alvarez", date_of_birth: "1980-04-12", payer_code: "AETNA", member_id: "M123", pcp_name: "Dr. Patel", pcp_npi: "1234567890", comorbidity_count: 1, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
            - call: "POST /dh/care-teams"
              payload: { market_id: "${mkt_id}", app_user_id: "app-001", tech_user_id: "tech-001", supervising_physician_user_id: "md-001", skill_tags: ["POCT", "IV_INFUSION"] }
              as: Dispatcher
              captures: { team_id: $.data.id }
            - call: "POST /dh/care-teams/${team_id}/go-available"
              payload: {}
              as: Dispatcher
            - call: "POST /dh/vehicle-shifts"
              payload: { care_team_id: "${team_id}", market_id: "${mkt_id}", vehicle_plate: "TX-ABC-123", window_start: "2026-09-15T08:00:00Z", window_end: "2026-09-15T20:00:00Z" }
              as: Dispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /dh/vehicle-shifts/${shift_id}/start"
              payload: {}
              as: Dispatcher
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "fever and dehydration" }
              as: TriageNurse
              captures: { vr_id: $.data.id, vr_v0: $.data.version }
            - call: "POST /dh/visit-requests/${vr_id}/triage-assessments"
              payload: { heart_rate: 110, systolic_bp: 100, spo2_pct: 94, is_chest_pain: false, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
              as: TriageNurse
              captures: { trg_id: $.data.id }
            - call: "POST /dh/triage-assessments/${trg_id}/submit"
              payload: { outcome: "APPROPRIATE" }
              as: TriageNurse
            - call: "POST /dh/visit-requests/${vr_id}/dispatch-offers"
              payload: { expected_visit_request_version: "${vr_v0}" }
              as: Dispatcher
              captures: { da_id: $.data.id }
            - call: "POST /dh/dispatch-assignments/${da_id}/accept"
              payload: {}
              as: CareTeamMember
              as_user_id: "app-001"
            - call: "POST /dh/dispatch-assignments/${da_id}/arrive"
              payload: {}
              as: CareTeamMember
              as_user_id: "app-001"
              captures: { enc_id: $.data.id }
            - call: "POST /dh/encounters/${enc_id}/diagnostic-orders"
              payload: { order_kind: "IV_INFUSION", code: "IVF-NS-1L", units: 2 }
              as: AdvancedPracticeProvider
              captures: { ord_iv: $.data.id }
            - call: "POST /dh/diagnostic-orders/${ord_iv}/collect"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-001"
            - call: "POST /dh/diagnostic-orders/${ord_iv}/result"
              payload: { result_value: "infused uneventfully" }
              as: FieldTechnician
              as_user_id: "tech-001"
            - call: "POST /dh/encounters/${enc_id}/diagnostic-orders"
              payload: { order_kind: "POCT", code: "POCT-STREP-A", units: 1 }
              as: AdvancedPracticeProvider
              captures: { ord_poct: $.data.id }
            - call: "POST /dh/encounters/${enc_id}/begin-disposition-review"
              payload: {}
              as: AdvancedPracticeProvider
              captures: { error_id: $.data.error_id }
            # Encounter cannot enter review while POCT order is ORDERED; that is itself a separate check.
            # Cancel the POCT so we CAN reach disposition; then verify Claim provisional vs final divergence
            # by re-creating a fresh ORDERED POCT *before* disposition is taken.
            - call: "POST /dh/diagnostic-orders/${ord_poct}/cancel"
              payload: {}
              as: AdvancedPracticeProvider
            - call: "POST /dh/encounters/${enc_id}/begin-disposition-review"
              payload: {}
              as: AdvancedPracticeProvider
            - call: "POST /dh/encounters/${enc_id}/disposition-decisions"
              payload: { disposition: "DISCHARGE_HOME", rationale: "Patient stable after IV hydration, tolerating PO, vitals improved." }
              as: AdvancedPracticeProvider
              captures: { disp_id: $.data.id }
            - call: "GET /dh/visit-requests/${vr_id}"
              payload: {}
              as: BillingSpecialist
              captures: { claim_id: $.data.claim_id }
            # Now place a fresh ORDERED POCT *after* disposition — not allowed (encounter closed).
            # So instead, to make provisional != final we rely on the auto-created Claim:
            # The provisional total includes only the RESULTED IV line plus base rate, but if we read Claim
            # immediately after disposition there are no ORDERED lines left, so we re-derive the difference
            # by issuing a second encounter? — No. The definitive test:
            #   Drive a SECOND visit on the same patient through to ON_SCENE, result the IV (RESULTED), and
            #   leave a POCT order in COLLECTED state at the moment of disposition. But COLLECTED orders
            #   BLOCK begin-disposition-review. Therefore the discriminating read is the CLAIM AUTO-CREATE
            #   at disposition: provisional includes RESULTED + AMENDED (current estimate) while
            #   final includes RESULTED + VERIFIED + AMENDED. Verify with a VERIFY on the IV after claim
            #   exists: provisional is unchanged by verify; final already includes RESULTED so verify is
            #   a no-op for totals.
            # Simplest discriminating read: re-open via AMENDED.
            - call: "POST /dh/diagnostic-orders/${ord_iv}/amend"
              payload: { result_value: "infused; mild site erythema" }
              as: FieldTechnician
              as_user_id: "tech-001"
            - call: "GET /dh/claims/${claim_id}"
              payload: {}
              as: BillingSpecialist
              captures: { prov: $.data.provisional_total_cents, fin: $.data.final_total_cents }
          trigger:
            - call: "POST /dh/diagnostic-orders/${ord_iv}/result"
              payload: { result_value: "infused; site clean" }
              as: FieldTechnician
              as_user_id: "tech-001"
            - call: "GET /dh/claims/${claim_id}"
              payload: {}
              as: BillingSpecialist
          assert:
            - "Claim.${claim_id}.provisional_total_cents == 40000*0.85 rounded (= 34000) + 6000 = 40000"
            - "Claim.${claim_id}.final_total_cents == 34000 + 6000 = 40000"
            - "When the IV order was AMENDED between the two reads, provisional DID NOT change but a re-result returns it to RESULTED"
            - "claim_status remains DRAFT"

      - name: acuity_score_red_flag_override_vs_numeric_band
        grounds:
          - calculations.acuity_score
          - entities.TriageAssessment.fields.acuity_score
          - entities.VisitRequest.fields.acuity_band
        distinguishing_aspect: |
          Two valid acuity interpretations: numeric-only banding (acuity_score
          thresholds) versus red-flag override (any red-flag symptom forces
          EMERGENT regardless of score). On identical vitals (low score) the two
          variants diverge: numeric says STANDARD/NON_ACUTE; override says EMERGENT.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T10:00:00Z."
            - "Active market + patient; VisitRequest A with vitals that yield a low score but is_chest_pain=true."
            - "VisitRequest B with identical vitals but is_chest_pain=false."
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-NORTH", display_name: "Dallas Fort Worth North", polygon_geojson: "{\"type\":\"Polygon\",\"coordinates\":[[[-97.5,32.5],[-96.5,32.5],[-96.5,33.5],[-97.5,33.5],[-97.5,32.5]]]}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "Bob Baker", date_of_birth: "1990-01-15", payer_code: "AETNA", member_id: "M200", pcp_name: "Dr. Lee", pcp_npi: "9876543210", comorbidity_count: 0, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "mild chest discomfort" }
              as: TriageNurse
              captures: { vr_a: $.data.id }
            - call: "POST /dh/visit-requests/${vr_a}/triage-assessments"
              payload: { heart_rate: 80, systolic_bp: 120, spo2_pct: 98, is_chest_pain: true, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
              as: TriageNurse
              captures: { trg_a: $.data.id }
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "general malaise" }
              as: TriageNurse
              captures: { vr_b: $.data.id }
            - call: "POST /dh/visit-requests/${vr_b}/triage-assessments"
              payload: { heart_rate: 80, systolic_bp: 120, spo2_pct: 98, is_chest_pain: false, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
              as: TriageNurse
              captures: { trg_b: $.data.id }
          trigger:
            - call: "POST /dh/triage-assessments/${trg_a}/submit"
              payload: { outcome: "EMERGENCY_DIVERTED" }
              as: TriageNurse
            - call: "POST /dh/triage-assessments/${trg_b}/submit"
              payload: { outcome: "INAPPROPRIATE" }
              as: TriageNurse
          assert:
            - "TriageAssessment.${trg_a}.acuity_score == 20 (red_flag_pts only: hr=0 bp=0 spo2=0 age=0 comorb=0, red_flag=20)"
            - "VisitRequest.${vr_a}.acuity_band == EMERGENT despite acuity_score == 20 (numeric band would say NON_ACUTE)"
            - "VisitRequest.${vr_a}.status == EMS_DIVERTED"
            - "TriageAssessment.${trg_b}.acuity_score == 0"
            - "VisitRequest.${vr_b}.acuity_band == NON_ACUTE"
            - "VisitRequest.${vr_b}.status == DECLINED"
            - "EmsHandoff exists for ${trg_a} (one row), no EmsHandoff for ${trg_b}"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: claim_total_per_line_rounding_then_sum
        grounds:
          - calculations.site_of_service_claim_total
          - entities.ClaimLine.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. The scaffold pins
          "round_half_up per line, THEN sum" for diagnostic lines. Two IV units
          at 2,999 cents and one POCT unit at 1,001 cents produce a different
          total if rounded after summing: per-line = round(5998) + round(1001)
          = 5998 + 1001 = 6999; sum-then-round identical here. Use values that
          DO diverge: per-line = round_half_up(2 * 2999.5)=5999 plus
          round_half_up(1 * 1000.5)=1001 = 7000 vs sum = round(6999.5)=7000.
          This instance pins the per-line ordering with two lines whose prices
          are half-cent fractions (achieved via place_of_service_modifier
          multiplication on a base rate).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T10:00:00Z."
            - "Market active; PayerContract urgent_base_rate_cents=33333, place_of_service_modifier_pct=0.5 (forces 16666.5 -> round_half_up -> 16667 for the BASE line)."
            - "Visit driven through disposition with one RESULTED IV order units=1 unit_price_cents=2999 and one RESULTED POCT order list-price 1001 units=1."
