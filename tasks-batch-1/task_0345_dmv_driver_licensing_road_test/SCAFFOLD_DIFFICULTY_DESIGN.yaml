              as_user_id: "clerk-1"
          trigger:
            - call: "POST /road-test-appointments"
              payload: { driver_record_id: "${dr2}", examiner_id: "${ex_id}", license_class: "D", slot_start_period: 15, slot_end_period: 25 }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_EXAMINER_SLOT_CONFLICT"

      - name: knowledge_sitting_same_period_rejected_point_occupancy
        grounds:
          - validations[priority=11]
          - entities.KnowledgeTest.fields.scheduled_period
          - entities.KnowledgeTest.fields.status
        distinguishing_aspect: |
          On the DriverRecord/knowledge-sitting resource, a second SCHEDULED knowledge test in the
          SAME scheduled_period is rejected with ERR_KNOWLEDGE_SITTING_CONFLICT. Interval semantics:
          single-period POINT-occupancy (granularity 1 period), which differs geometrically from the
          examiner range-overlap.
        test_recipe:
          setup:
            - "A DriverRecord with one SCHEDULED knowledge test at period 5; clock at 0."
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Rae Sit", date_of_birth: "1990-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 5 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt1: $.data.id }
          trigger:
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 5 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_KNOWLEDGE_SITTING_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dismiss_suspension_conserves_prior_suspension_count
        grounds:
          - state_machines.Suspension.ACTIVE_to_LIFTED_BY_DISMISSAL
          - state_machines.DriverRecord.ACTIVE_to_SUSPENDED
          - entities.DriverRecord.fields.prior_suspension_count
        distinguishing_aspect: |
          Conserved quantity = prior_suspension_count. Forward action (violation -> open suspension)
          paired with its compensating action (dismiss violation -> dismiss suspension) leaves
          prior_suspension_count == 0: a dismissed suspension is never SERVED/LIFTED_BY_REINSTATEMENT,
          so it must NOT count. Invariant pinned: prior_suspension_count = count(Suspensions with
          status IN {SERVED, LIFTED_BY_REINSTATEMENT}).
        test_recipe:
          setup:
            - "An ACTIVE licensed DriverRecord; a 12-point violation opens a suspension (record SUSPENDED, prior_suspension_count still 0); the triggering violation is then dismissed."
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Sam Comp", date_of_birth: "1986-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
            - call: "POST /examiners"
              payload: { full_name: "Ex Thirteen", certified_classes: ["D"], opaque_user_id: "exu-13" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { ex_id: $.data.id }
            - call: "POST /road-test-appointments"
              payload: { driver_record_id: "${dr_id}", examiner_id: "${ex_id}", license_class: "D", slot_start_period: 0, slot_end_period: 1 }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { appt_id: $.data.id }
            - call: "POST /road-test-appointments/${appt_id}/proctor"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, auto_score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /road-test-appointments/${appt_id}/score"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /fee-payments"
              payload: { driver_record_id: "${dr_id}", purpose: "RENEWAL", amount_cents: 4000 }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /licenses"
              payload: { driver_record_id: "${dr_id}", road_test_appointment_id: "${appt_id}", license_class: "D" }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /violations"
              payload: { driver_record_id: "${dr_id}", code: "RECKLESS", points: 12, occurred_period: 0 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { v_id: $.data.id }
            - call: "GET /driver-records/${dr_id}/suspensions"
              payload: {}
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { susp_id: "$.data[0].id" }
            - call: "POST /violations/${v_id}/dismiss"
              payload: {}
              as: AdjudicationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /suspensions/${susp_id}/dismiss"
              payload: {}
              as: AdjudicationOfficer
              as_user_id: "officer-2"
          assert:
            - "Suspension.${susp_id}.status == LIFTED_BY_DISMISSAL"
            - "DriverRecord.${dr_id}.licensing_status == ACTIVE"
            - "DriverRecord.${dr_id}.prior_suspension_count == 0"

      - name: dismiss_violation_conserves_point_balance
        grounds:
          - state_machines.Violation.ACTIVE_to_DISMISSED
          - calculations.point_balance
          - entities.DriverRecord.fields.point_balance
        distinguishing_aspect: |
          Conserved quantity = point_balance. Forward action (post a 4-point violation -> balance 4)
          paired with its compensating action (dismiss that violation -> balance back to 0) returns
          point_balance to its pre-action value exactly. Different conserved quantity (numeric point
          ledger) than instance 1's prior_suspension_count counter. Invariant pinned: point_balance
          = sum(points of ACTIVE in-window violations).
        test_recipe:
          setup:
            - "A DriverRecord at clock 0 with point_balance 0; one ACTIVE 4-point violation posted (balance 4)."
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Tom Pts", date_of_birth: "1986-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /violations"
              payload: { driver_record_id: "${dr_id}", code: "SPEEDING_10_OVER", points: 4, occurred_period: 0 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { v_id: $.data.id }
            - call: "GET /driver-records/${dr_id}"
              payload: {}
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { pb_before: $.data.point_balance }
          trigger:
            - call: "POST /violations/${v_id}/dismiss"
              payload: {}
              as: AdjudicationOfficer
              as_user_id: "officer-1"
          assert:
            - "DriverRecord.${dr_id}.point_balance before dismiss == 4"
            - "DriverRecord.${dr_id}.point_balance after dismiss == 0"
            - "Violation.${v_id}.status == DISMISSED"
