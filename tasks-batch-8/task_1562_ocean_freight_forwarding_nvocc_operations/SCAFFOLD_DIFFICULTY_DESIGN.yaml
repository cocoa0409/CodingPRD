            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "FCL", container_type: "40HC", container_count: 1, commodity_type: "GENERAL", gross_weight_kg: 18000, volume_cbm: 50.0, terms: "COLLECT" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
