              as_user_id: "chair-001"
            - call: "POST /exec-comp/pay-programs"
              payload: { issuer_company_id: "${acme_id}", peer_group_id: "${pg_id}", ceo_executive_id: "${ceo_id}", fiscal_year: 2026, salary_pct: 15.00, sti_pct: 25.00, lti_pct: 60.00, lti_performance_share_pct: 60.00, sti_max_multiple: 2.0, tsr_percentile_rank: 30.00, meeting_date: "2027-05-12T00:00:00Z" }
              as: CompConsultant
              captures: { pp_id: $.data.id, pp_v0: $.data.version }
            - call: "POST /exec-comp/pay-programs/${pp_id}/payout-awards"
              payload: { executive_id: "${ceo_id}", vehicle: "ANNUAL_INCENTIVE" }
              as: CompConsultant
              captures: { ai_id: $.data.id }
            - call: "POST /exec-comp/pay-programs/${pp_id}/payout-awards"
              payload: { executive_id: "${ceo_id}", vehicle: "LONG_TERM_PSU", units_granted: 100000, grant_price_usd: 50.00 }
              as: CompConsultant
              captures: { psu_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: CompConsultant
          trigger:
            - call: "POST /exec-comp/payout-awards/${psu_id}/settlement"
              payload: { disposition: "FORFEIT", settlement_date: "2026-09-30T00:00:00Z" }
              as: CompConsultant
          assert:
            - "before the trigger PayProgram.${pp_id}.realizable_pay_total_usd == 6800000.00"
            - "HTTP status == 200 and PayoutAward.${psu_id}.status == FORFEITED"
            - "PayoutAward.${psu_id}.realizable_value_usd == 0.00 and realized_value_usd == 0.00"
            - "PayoutAward.${ai_id}.realizable_value_usd == 1800000.00 — unchanged"
            - "PayProgram.${pp_id}.realizable_pay_total_usd == 1800000.00 and realized_pay_total_usd == 0.00"
            - "PayProgram.${pp_id}.alignment_status == ALIGNED with degree_of_alignment == 30.00"

      - name: a_stale_expected_pay_program_version_is_rejected_with_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.mix-reallocation-stale-program
          - errors[ERR_STALE_PAY_PROGRAM_VERSION]
        excluded_because:
          difficulty_instance: compensating_invariant / mix_reallocation_round_trip_conserves_hundred_points_and_restores_every_derived_field
          rationale: "That instance drives two sequential mix reallocations through the OCC field, so it already asserts the 412 on the stale token and the success on the refreshed one."

      - name: a_five_level_side_effect_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.IncentiveMetric.RESULT_SUBMITTED_to_CERTIFIED
        excluded_because:
          difficulty_instance: transitive_cascade / certify_last_metric_cascades_five_levels_to_screen_staleness
          rationale: "That instance asserts each of the five levels of the certification cascade in order, which is the layer's end-to-end claim."

      - name: both_valuation_variants_are_produced_from_the_same_awards
        claim_type: dual_variant_calculation
        grounds:
          - calculations.realized_and_realizable_pay.variants
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / realized_versus_realizable_pay_diverge_on_identical_awards
          rationale: "That instance asserts both legs and their delta on one award set, which is the layer's divergence claim."

  # =========================================================================
  - section: consistency_model
    instances:

      - name: the_screen_response_already_carries_every_derived_benchmark_field
        claim_type: immediate
        grounds:
          - consistency_model
          - state_machines.PeerGroup.DRAFT_to_SCREENED
          - calculations.peer_group_medians
          - calculations.benchmark_target_tdc
        distinguishing_aspect: |
          Under the declared immediate model no follow-up read is needed to see derived state: the screen call's own
          201/200 body already contains median_revenue_usd 8,000,000,000.00, size_fit_score 80.00 and both benchmark
          legs (12,000,000.00 raw and 15,000,000.00 adjusted), and an immediate re-read returns byte-identical values
          with no version drift.
        test_recipe:
          setup:
            - "ACME issuer (revenue 10,000,000,000) and BRVO peer (revenue 8,000,000,000, market cap 16,000,000,000, ceo_tdc 12,000,000)."
            - "A DRAFT RAW_MEDIAN peer group holding BRVO as its only ACCEPTED member."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
          trigger:
            - call: "POST /exec-comp/peer-groups/${pg_id}/screen"
              payload: {}
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pg_id}"
              as: CompConsultant
              captures: { pg_v_after: $.data.version }
          assert:
            - "the screen response body carries status SCREENED, median_revenue_usd 8000000000.00 and median_market_cap_usd 16000000000.00"
            - "the screen response body carries size_fit_score 80.00, benchmark_target_tdc_raw_usd 12000000.00 and benchmark_target_tdc_adjusted_usd 15000000.00"
            - "the screen response body carries benchmark_target_tdc_usd 12000000.00 and screened_at '2026-08-01T00:00:00Z'"
            - "the immediate GET returns exactly the same values for all of those fields"
            - "${pg_v_after} == 3 — create, member add, screen; the read itself does not bump it"
