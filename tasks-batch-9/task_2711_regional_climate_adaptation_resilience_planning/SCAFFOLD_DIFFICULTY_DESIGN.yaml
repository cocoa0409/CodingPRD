              payload: {}
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { pact_v4: $.data.version }
            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a1_id}", committed_units: 10, window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-18T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v4}" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { c4_id: $.data.id }
          assert:
            - "the first trigger call returns 409 with error_id ERR_AID_CAPACITY_EXCEEDED, because load at 2026-09-12T00:00:00Z would be 4 + 4 + 3 == 11 > pledged_units 10"
            - "the rejection is NOT ERR_AID_CONCURRENCY_LIMIT, because the overlap count 3 is below max_concurrent_commitments 4"
            - "MutualAidPact.${pact_id}.reserved_units == 8 and free_units == 2 are unchanged by the rejection, and version stays 3"
            - "after the release: MutualAidCommitment.${c2_id}.status == RELEASED, released_at != null, and MutualAidPact.${pact_id}.reserved_units == 4 with free_units == 6"
            - "the fourth trigger call returns 201: at 2026-09-15T00:00:00Z the 4-unit window [2026-09-05, 2026-09-15) has already ended under half-open semantics, so peak load is exactly 10 == pledged_units"
            - "MutualAidCommitment.${c4_id}.committed_units == 10 and status == COMMITTED"
            - "MutualAidPact.${pact_id}.reserved_units == 10, free_units == 0 and status == EXHAUSTED"

  - rule_id: compensating_invariant
    instances:
      - name: program_authorized_cents_conserved_across_allocate_and_withdraw
        grounds:
          - calculations.program_funding_ledger
          - entities.CapitalProgram.fields.available_cents
          - entities.CapitalProgram.fields.committed_cents
          - state_machines.AdaptationProject.PROGRAMMED_to_WITHDRAWN
          - endpoints.post_capital_program_allocations
        distinguishing_aspect: |
          The identity committed_cents + available_cents == authorized_cents == 60000000 is asserted at
          four successive observation points, and the withdrawal must return the ledger to the exact
          pre-allocation numbers 20000000 / 40000000 rather than to an approximately equal pair. The
          program never reaches CLOSED and no grant hold is ever set, which is what separates this
          instance from the withdraw cascade — here nothing downstream changes, only the arithmetic.
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction, one DRAFT PlanCycle, one PUBLISHED HazardProfile and one RANKED LifelineAsset."
            - "Two SCREENED_IN AdaptationProjects with total_program_cost_cents 35316000 each, each with one disadvantaged-reaching ProjectAssetLink and a CERTIFIED BenefitCostAnalysis."
            - "One CapitalProgram with authorized_cents 60000000, equity_target_bps 4000, committed_cents 0, available_cents 60000000 and funding_posture OPEN."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 1 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/hazard-profiles"
              payload: { jurisdiction_id: "${j_harbor_id}", hazard_type: "FLOOD", scenario: "RCP85", horizon_year: 2060, exposure_index: 0.80, annual_event_probability: 0.02, projected_annual_loss_cents: 250000000 }
              as: HazardAnalyst
              captures: { hp1_id: $.data.id }
            - call: "POST /resilience/hazard-profiles/${hp1_id}/publish"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "WATER", name: "Harbor Water Treatment Plant", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true }
              as: RegionalAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments"
              payload: { hazard_profile_id: "${hp1_id}", asset_id: "${a1_id}", subject_type: "INFRASTRUCTURE", sensitivity_score: 0.60, adaptive_capacity_score: 0.50, method: "ADDITIVE_WEIGHTED", svi_overlay_applied: true }
              as: HazardAnalyst
              captures: { va1_id: $.data.id }
            - call: "POST /resilience/vulnerability-assessments/${va1_id}/assess"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/assets/${a1_id}/criticality-ranking"
              payload: {}
              as: HazardAnalyst
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Harbor Pump Retrofit A", hazard_type: "FLOOD", strategy_type: "ACCOMMODATE", base_cost_cents: 30000000, service_life_years: 25, cobenefit_points: 10, feasibility_score: 0.65 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p_a_id: $.data.id }
            - call: "POST /resilience/projects/${p_a_id}/screen"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/projects/${p_a_id}/asset-links"
              payload: { asset_id: "${a1_id}", avoided_loss_annual_cents: 2118960, benefit_reaches_disadvantaged: true }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { link_a_id: $.data.id }
            - call: "POST /resilience/projects/${p_a_id}/analyses"
              payload: { method: "ANNUALIZED_EQUIVALENT", discount_rate_bps: 700 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { bca_a_id: $.data.id }
            - call: "POST /resilience/analyses/${bca_a_id}/certify"
              payload: {}
              as: BCAReviewer
              as_user_id: "reviewer-01"
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Harbor Pump Retrofit B", hazard_type: "FLOOD", strategy_type: "ACCOMMODATE", base_cost_cents: 30000000, service_life_years: 25, cobenefit_points: 10, feasibility_score: 0.65 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p_b_id: $.data.id }
            - call: "POST /resilience/projects/${p_b_id}/screen"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/projects/${p_b_id}/asset-links"
              payload: { asset_id: "${a1_id}", avoided_loss_annual_cents: 2118960, benefit_reaches_disadvantaged: true }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { link_b_id: $.data.id }
            - call: "POST /resilience/projects/${p_b_id}/analyses"
              payload: { method: "ANNUALIZED_EQUIVALENT", discount_rate_bps: 700 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { bca_b_id: $.data.id }
            - call: "POST /resilience/analyses/${bca_b_id}/certify"
              payload: {}
              as: BCAReviewer
              as_user_id: "reviewer-01"
            - call: "POST /resilience/capital-programs"
              payload: { fiscal_year: 2027, authorized_cents: 60000000, equity_target_bps: 4000 }
              as: RegionalAdministrator
              captures: { program_id: $.data.id, prog_v1: $.data.version }
          trigger:
            - call: "POST /resilience/capital-programs/${program_id}/allocations"
              payload: { project_id: "${p_a_id}", allocated_cents: 20000000, expected_capital_program_version: "${prog_v1}" }
              as: RegionalAdministrator
            - call: "GET /resilience/capital-programs/${program_id}"
              payload: {}
              as: RegionalAdministrator
              captures: { prog_v2: $.data.version }
            - call: "POST /resilience/capital-programs/${program_id}/allocations"
              payload: { project_id: "${p_b_id}", allocated_cents: 30000000, expected_capital_program_version: "${prog_v2}" }
              as: RegionalAdministrator
            - call: "POST /resilience/projects/${p_b_id}/withdraw"
              payload: {}
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
          assert:
            - "point 0, before any allocation: CapitalProgram.${program_id}.committed_cents == 0, available_cents == 60000000, equity_achieved_bps == 0, funding_posture == OPEN"
            - "point 1, after allocating 20000000: committed_cents == 20000000, available_cents == 40000000, and 20000000 + 40000000 == 60000000"
            - "point 2, after allocating 30000000: committed_cents == 50000000, available_cents == 10000000, and 50000000 + 10000000 == 60000000"
            - "point 2: funding_posture == OPEN, because floor(10000 * 10000000 / 60000000) == 1666 bps of headroom is not below OVERSUBSCRIBED_BPS_FLOOR 1000"
            - "point 3, after withdrawing the 30000000 project: committed_cents == 20000000 and available_cents == 40000000, byte-for-byte the point-1 pair with no drift"
            - "point 3: 20000000 + 40000000 == 60000000 and authorized_cents is still 60000000, never mutated by any call"
            - "point 3: equity_achieved_bps == 10000 and equity_committed_cents == 20000000"
            - "AdaptationProject.${p_b_id}.program_status == WITHDRAWN and allocated_cents == 0, while AdaptationProject.${p_a_id}.allocated_cents == 20000000"
            - "AdaptationProject.${p_a_id}.grant_hold_flag == false and AdaptationProject.${p_b_id}.grant_hold_flag == false at every point, because funding_posture never became CLOSED"
            - "CapitalProgram.${program_id}.version == 4 after the two allocations and the withdrawal"

      - name: pact_pledged_units_conserved_across_commit_fulfil_and_release
        grounds:
          - calculations.aid_unit_ledger
          - entities.MutualAidPact.fields.reserved_units
          - entities.MutualAidPact.fields.free_units
          - state_machines.MutualAidCommitment.COMMITTED_to_RELEASED
          - state_machines.MutualAidCommitment.COMMITTED_to_FULFILLED
        distinguishing_aspect: |
          The conserved quantity is a unit count whose reserved side is a temporal PEAK rather than a
          sum, so the compensation is only correct if the release recomputes the peak over the
          survivors. The instance also pins the non-compensating transition: fulfilling a commitment
          leaves reserved_units at 8 and free_units at 2 because FULFILLED stays inside the reserved
          set, so exactly one of the two terminal transitions releases capacity.
        test_recipe:
          setup:
            - "Two ACTIVE Jurisdictions and one LifelineAsset with is_shared true."
            - "One OPEN MutualAidPact with pledged_units 10, max_concurrent_commitments 4 and window [2026-09-01, 2026-10-01), reserved_units 0 and free_units 10."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Ridge Town", jurisdiction_code: "TOWN-RIDGE", population: 40000, svi_score: 0.18, endorsement_weight: 3 }
              as: RegionalAdministrator
              captures: { j_ridge_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "WATER", name: "Harbor Water Treatment Plant", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true }
              as: RegionalAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /resilience/mutual-aid-pacts"
              payload: { host_jurisdiction_id: "${j_harbor_id}", resource_class: "GENERATORS", pledged_units: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", max_concurrent_commitments: 4 }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
              captures: { pact_id: $.data.id, pact_v1: $.data.version }
          trigger:
            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a1_id}", committed_units: 4, window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-15T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v1}" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { c1_id: $.data.id }
            - call: "GET /resilience/mutual-aid-pacts/${pact_id}"
              payload: {}
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { pact_v2: $.data.version }
            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a1_id}", committed_units: 4, window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v2}" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /resilience/mutual-aid-commitments/${c1_id}/fulfill"
              payload: {}
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
            - call: "POST /resilience/mutual-aid-commitments/${c2_id}/release"
              payload: {}
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
          assert:
            - "point 1, after the first commitment: MutualAidPact.${pact_id}.reserved_units == 4, free_units == 6, and 4 + 6 == pledged_units 10, status OPEN"
            - "point 2, after the second overlapping commitment: reserved_units == 8, free_units == 2, and 8 + 2 == 10"
            - "point 3, after fulfilling the first commitment: MutualAidCommitment.${c1_id}.status == FULFILLED with fulfilled_at != null, yet reserved_units is still 8 and free_units still 2, because FULFILLED remains inside the reserved input set"
            - "point 3: MutualAidPact.${pact_id}.version is still 3, because fulfil bumps only the commitment's version"
            - "point 4, after releasing the second commitment: reserved_units == 4 and free_units == 6, exactly the point-1 pair, with 4 + 6 == 10"
            - "point 4: MutualAidCommitment.${c2_id}.status == RELEASED and released_at != null, while MutualAidCommitment.${c1_id}.status stays FULFILLED"
            - "point 4: MutualAidPact.${pact_id}.status == OPEN and pledged_units == 10, never mutated by any commitment or release"
