  # =====================================================================
  # Rule 8: resource temporal overlap with DIFFERENT interval semantics.
  # Instance A — Contract coverage window: single half-open interval
  #   [coverage_start_utc, coverage_end_utc) point-in-interval semantics on
  #   Contract entity for /claims creation.
  # Instance B — Technician dispatch buffer: ±60 minute exclusion buffer
  #   around any existing SCHEDULED/IN_PROGRESS Dispatch on the same
  #   technician_id — adjacency-with-buffer semantics on Dispatch entity.
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: contract_coverage_window_half_open_membership
        grounds:
          - validations[priority=8]
          - errors[ERR_OUT_OF_COVERAGE]
          - entities.Contract.fields.coverage_start_utc
          - entities.Contract.fields.coverage_end_utc
        distinguishing_aspect: |
          Interval semantics: single half-open interval
          [coverage_start_utc, coverage_end_utc) — point-in-interval
          membership. Resource entity: Contract. /claims requires
          clock_now ∈ [start, end). Boundary: clock_now == end (exactly)
          is REJECTED (interval is half-open, end is exclusive).
        test_recipe:
          setup:
            - "An ACTIVE Contract activated at 2026-01-01T00:00:00Z (coverage_end_utc = 2027-01-01T00:00:00Z). One CoveredItem registered."
            - "Clock advanced to exactly 2027-01-01T00:00:00Z (== coverage_end_utc); /_clock/tick fires the ACTIVE → EXPIRED auto-transition."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "p@example.com", full_name: "P", home_address: "3 Willow" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "HVAC", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/tick"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "At the exact boundary" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_OUT_OF_COVERAGE' (clock_now == coverage_end_utc → half-open interval excludes the right endpoint)"
            - "Response HTTP status == 422"

      - name: technician_dispatch_buffer_collision_within_60min
        grounds:
          - validations[priority=11]
          - errors[ERR_TECHNICIAN_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Interval semantics: ±60-minute symmetric buffer around each
          existing Dispatch's scheduled_utc — different geometry from
          instance A (single-interval membership). Resource entity:
          Dispatch (per technician_id). The new scheduled_utc must satisfy
          |existing.scheduled_utc - new.scheduled_utc| >= 3600 seconds for
          every existing SCHEDULED or IN_PROGRESS Dispatch on the same
          technician_id. Strict less-than triggers rejection; equality is
          permitted (boundary CLOSED at 3600 s).
        test_recipe:
          setup:
            - "Two ACTIVE Contracts each with one CoveredItem; two ClaimTickets, each ASSESSED, both ready to dispatch."
            - "An existing Dispatch already created for the first claim with technician_id 'tech-X' scheduled at 2026-02-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "q@example.com", full_name: "Q", home_address: "1 Oak" }
              as: Anonymous
              captures: { qid: $.data.id }
            - call: "POST /customers"
              payload: { email: "r@example.com", full_name: "R", home_address: "2 Oak" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${qid}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${qid}"
              captures: { c_q: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${rid}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${rid}"
              captures: { c_r: $.data.id }
            - call: "POST /contracts/${c_q}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /contracts/${c_r}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${c_q}", category: "HVAC", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${qid}"
              captures: { itm_q: $.data.id }
            - call: "POST /covered-items"
              payload: { contract_id: "${c_r}", category: "HVAC", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${rid}"
              captures: { itm_r: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${c_q}", covered_item_id: "${itm_q}", issue_summary: "First" }
              as: Customer
              as_user_id: "${qid}"
              captures: { cl_q: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${c_r}", covered_item_id: "${itm_r}", issue_summary: "Second" }
              as: Customer
              as_user_id: "${rid}"
              captures: { cl_r: $.data.id }
            - call: "POST /claims/${cl_q}/assess"
              payload: { estimated_repair_cost_cents: 10000 }
              as: Dispatcher
            - call: "POST /claims/${cl_r}/assess"
              payload: { estimated_repair_cost_cents: 10000 }
              as: Dispatcher
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims/${cl_q}/dispatch"
              payload: { technician_id: "tech-X", scheduled_utc: "2026-02-01T10:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /claims/${cl_r}/dispatch"
              payload: { technician_id: "tech-X", scheduled_utc: "2026-02-01T10:30:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_TECHNICIAN_DOUBLE_BOOKED' (|10:30 - 10:00| = 1800s < 3600s buffer)"
            - "Response HTTP status == 422"

  # =====================================================================
  # Rule 9: compensating-action invariants on DIFFERENT conserved quantities.
  # Invariant A: Contract.total_paid_out_cents — submit+reject leaves it
  #   unchanged.
  # Invariant B: Contract.claims_in_period_count — reopen→re-dispatch on the
  #   same claim leaves it unchanged (no double-counting).
  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: total_paid_out_invariant_under_submit_reject_pair
        grounds:
          - calculations.contract_payout_aggregate
          - state_machines.ClaimTicket.SUBMITTED_to_REJECTED
          - entities.Contract.fields.total_paid_out_cents
        distinguishing_aspect: |
          Conserved quantity: Contract.total_paid_out_cents. Invariant
          formula (over Contract C):
              total_paid_out_cents(C) ==
                  sum_{ct in ClaimTickets where ct.contract_id == C.id AND
                       ct.status == RESOLVED AND
                       ct.created_at in [C.coverage_start_utc, C.coverage_end_utc)}
                      (ct.repair_cost_cents - ct.final_copay_cents)
          The pair (POST /claims → status SUBMITTED) + (POST /claims/{id}/reject
          → status REJECTED) leaves the qualifying set empty, so
          total_paid_out_cents remains zero. Forward+compensating, no drift.
        test_recipe:
          setup:
            - "An ACTIVE Contract with zero claims; total_paid_out_cents = 0 in the snapshot before the trigger."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "s@example.com", full_name: "S", home_address: "1 Cypress" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "HVAC", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pre_total: $.data.total_paid_out_cents }
          trigger:
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "Will be rejected" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/reject"
              payload: { rejection_reason: "NOT_COVERED_CATEGORY" }
              as: Dispatcher
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: PlatformAdmin
              captures: { post_total: $.data.total_paid_out_cents }
          assert:
            - "Contract.${contract_id}.total_paid_out_cents == 0 BEFORE the submit+reject pair"
            - "Contract.${contract_id}.total_paid_out_cents == 0 AFTER the submit+reject pair (invariant held; no drift)"

      - name: claims_in_period_count_invariant_under_reopen_cycle
        grounds:
          - calculations.contract_payout_aggregate
          - state_machines.ClaimTicket.DISPATCHED_to_ASSESSED
          - state_machines.ClaimTicket.ASSESSED_to_DISPATCHED
          - entities.Contract.fields.claims_in_period_count
        distinguishing_aspect: |
          Conserved quantity: Contract.claims_in_period_count. Different
          quantity (count, not cents) from invariant A. The reopen-cycle
          (DISPATCHED → ASSESSED via /reopen → DISPATCHED via /dispatch on
          the SAME ClaimTicket.id) MUST NOT increment the count, because
          claims_in_period_count counts UNIQUE ClaimTicket rows by id, not
          transitions. Invariant formula: count(distinct ClaimTicket.id
          where contract_id == C.id and status ∈ {SUBMITTED, ASSESSED,
          DISPATCHED, RESOLVED, REJECTED} and created_at in coverage
          window) is preserved across reopen+redispatch.
        test_recipe:
          setup:
            - "An ACTIVE Contract with one ClaimTicket in DISPATCHED whose linked Dispatch is RETURN_NEEDED, ready for /reopen."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "t@example.com", full_name: "T", home_address: "2 Cypress" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "HVAC", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "First try" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/assess"
              payload: { estimated_repair_cost_cents: 15000 }
              as: Dispatcher
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/dispatch"
              payload: { technician_id: "tech-K", scheduled_utc: "2026-02-01T09:00:00Z" }
              as: Dispatcher
            - call: "GET /dispatches"
              payload: { claim_id: "${claim_id}" }
              as: Dispatcher
              captures: { d_id: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /dispatches/${d_id}/start"
              payload: {}
              as: Technician
            - call: "POST /dispatches/${d_id}/mark-return-needed"
              payload: {}
              as: Technician
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pre_count: $.data.claims_in_period_count }
          trigger:
            - call: "POST /claims/${claim_id}/reopen"
              payload: {}
              as: Dispatcher
            - call: "POST /claims/${claim_id}/assess"
              payload: { estimated_repair_cost_cents: 15000 }
              as: Dispatcher
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-02T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/dispatch"
              payload: { technician_id: "tech-K", scheduled_utc: "2026-02-02T09:00:00Z" }
              as: Dispatcher
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: PlatformAdmin
              captures: { post_count: $.data.claims_in_period_count }
          assert:
            - "Contract.${contract_id}.claims_in_period_count == 1 BEFORE the reopen+redispatch pair"
            - "Contract.${contract_id}.claims_in_period_count == 1 AFTER the reopen+redispatch pair (invariant: count by distinct ClaimTicket.id is unchanged)"
