            # plan B supersedes A
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p}", supersedes_care_plan_id: "${cpa}" }
              as: IntakeCoordinator
              captures: { cpb: $.data.id }
            - call: "POST /pace/care-plans/${cpb}/goals"
