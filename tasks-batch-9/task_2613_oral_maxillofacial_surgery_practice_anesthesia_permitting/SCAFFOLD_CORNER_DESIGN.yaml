              as: SchedulingCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /implant-lots"
              payload: { practice_id: "${prac_id}", manufacturer_code: "NOBEL", catalog_reference: "NB-4310", diameter_mm: 4.3, length_mm: 10.0, unit_cost_cents: 30000, quantity_on_hand: 5, expiry_date: "2027-01-31T00:00:00Z" }
              as: InventoryManager
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /implant-reservations"
              payload: { case_id: "${case_id}", lot_id: "${lot_id}", quantity: 2, expected_lot_version: "${lot_v}" }
              as: InventoryManager
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /implant-lots/${lot_id}/quarantine"
