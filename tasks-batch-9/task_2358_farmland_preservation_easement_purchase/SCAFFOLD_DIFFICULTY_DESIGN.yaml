      - name: visit_completion_cascades_five_levels_and_suspends_a_pending_amendment
        grounds:
          - state_machines.MonitoringVisit.SCHEDULED_to_COMPLETED
          - state_machines.Violation.initial_state_OPEN
          - state_machines.Amendment.UNDER_REVIEW_to_SUSPENDED
