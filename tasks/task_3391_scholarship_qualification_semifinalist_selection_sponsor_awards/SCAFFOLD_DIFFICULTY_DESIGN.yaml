scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: state_slot_provisional_vs_final_apportionment
        grounds:
          - calculations.state_slot_allocation
          - entities.StateAllocation.fields.slots_provisional
          - entities.StateAllocation.fields.slots_final
          - state_machines.StateAllocation.PENDING_to_PROVISIONAL
          - state_machines.StateAllocation.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          Same population inputs yield two different allocations because the two variants
          are different algorithms on the StateAllocation domain: provisional is per-state
          round_half_up(quota) and its sum (11) overshoots total_semifinalist_slots (10),
          while final is largest-remainder apportionment with the MIN_STATE_SLOTS=1
          guarantee and sums to exactly 10. State BB receives 3 provisionally but only 2 finally.
        test_recipe:
          setup:
            - "A 3-state cycle (AA pop 4500, BB pop 2500, CC pop 3000; total_semifinalist_slots 10) in posture ENTRY_CLOSED with zero entries; provisional allocation already computed by close-entries."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC3", target_graduation_year: 2028, total_semifinalist_slots: 10, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "AA", graduating_population: 4500 }, { state_code: "BB", graduating_population: 2500 }, { state_code: "CC", graduating_population: 3000 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/open-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/close-entries"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /api/program-cycles/${cyc}/run-semifinalist-selection"
              payload: {}
              as: ProgramAdmin
              captures: { sel_total: $.data.selected_total }
          assert:
            - "StateAllocation[AA]: slots_provisional == 5 and slots_final == 5"
            - "StateAllocation[BB]: slots_provisional == 3 and slots_final == 2 (loses a seat: remainder tie .5 vs AA broken by larger population 4500 > 2500)"
            - "StateAllocation[CC]: slots_provisional == 3 and slots_final == 3"
            - "sum of slots_provisional over the three states == 11, which exceeds total_semifinalist_slots == 10"
            - "sum of slots_final over the three states == 10 == total_semifinalist_slots"
            - "every StateAllocation.status == FINAL and threshold_selection_index is null and selected_count == 0 (zero SCORED entries)"
            - "${sel_total} == 0"

      - name: sponsor_pool_reserved_vs_cash_availability
        grounds:
          - calculations.sponsor_pool_availability
          - entities.SponsorAgreement.fields.pool_available_reserved_cents
          - entities.SponsorAgreement.fields.pool_available_cash_cents
          - calculations.award_matching_waterfall
        distinguishing_aspect: |
          On the SponsorAgreement ledger domain, two availability algorithms diverge for
          identical data while an offer is outstanding: the reservation variant reports
          250000 (total minus committed minus paid) while the cash variant reports 500000
          (total minus paid); the delta equals the outstanding OFFERED commitment exactly,
          and only the reservation variant is allowed to gate matching.
        test_recipe:
          setup:
            - "Single-state cycle (ZZ pop 10000, 5 slots, national_award_slots 0) advanced to FINALISTS_SELECTED with one FINALIST_CONFIRMED applicant whose parent_sponsor_id is the sponsor."
            - "Sponsor agreement for this cycle: award_amount_cents 250000, max_awards 2, pool_total_cents 500000, window [2027-01-01, 2027-12-31]."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-POOL", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/open-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/schools"
              payload: { name: "ZZ High", school_code: "ZZ-1", state_code: "ZZ" }
              as: ProgramAdmin
              captures: { sch: $.data.id }
            - call: "POST /api/corporate-sponsors"
              payload: { legal_name: "Acme Corp", sponsor_code: "ACME" }
              as: ProgramAdmin
              captures: { sp: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "F One", school_id: "${sch}", state_code: "ZZ", graduation_year: 2028, citizenship_status: "US_CITIZEN", enrollment_status: "ENROLLED_FULL_TIME", parent_sponsor_id: "${sp}" }
              as: ProgramAdmin
              captures: { stu: $.data.id }
            - call: "POST /api/entries"
              payload: { student_id: "${stu}", cycle_id: "${cyc}", exam_year_of_hs: "THIRD_YEAR" }
              as: Student
              as_user_id: "${stu}"
              captures: { ent: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/close-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/entries/${ent}/score"
              payload: { reading_score: 37, writing_score: 37, math_score: 38 }
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/run-semifinalist-selection"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/finalist-applications"
              payload: { entry_id: "${ent}", gpa_scaled: 3.9, course_rigor: "MOST_RIGOROUS", confirming_selection_index: 210 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
            - call: "POST /api/finalist-applications/${app}/endorse"
              payload: {}
              as: SchoolOfficial
              as_user_id: "${sch}"
            - call: "POST /api/finalist-applications/${app}/submit"
              payload: {}
              as: Student
              as_user_id: "${stu}"
              captures: { app_v: $.data.version }
            - call: "POST /api/finalist-applications/${app}/review"
              payload: { decision: "CONFIRM", expected_finalist_application_version: "${app_v}" }
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/publish-finalists"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/corporate-sponsors/${sp}/agreements"
              payload: { cycle_id: "${cyc}", award_amount_cents: 250000, max_awards: 2, pool_total_cents: 500000, effective_start_date: "2027-01-01", effective_end_date: "2027-12-31" }
              as: SponsorAdmin
              as_user_id: "${sp}"
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /api/program-cycles/${cyc}/run-award-matching"
              payload: {}
              as: ProgramAdmin
              captures: { n_corp: $.data.corporate_granted }
            - call: "GET /api/sponsor-agreements/${ag}"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp}"
          assert:
            - "${n_corp} == 1 and exactly one Award with agreement_id == ${ag} exists (OFFERED/PLEDGED, amount_cents 250000)"
            - "SponsorAgreement.${ag}.pool_committed_cents == 250000 and pool_paid_cents == 0"
            - "SponsorAgreement.${ag}.pool_available_reserved_cents == 250000 (500000 - 250000 - 0)"
            - "SponsorAgreement.${ag}.pool_available_cash_cents == 500000 (500000 - 0)"
            - "the two availability fields differ by exactly 250000, the outstanding OFFERED commitment"

  - rule_id: combinatorial_formula
    instances:
      - name: largest_remainder_min_guarantee_redistribution
        grounds:
          - calculations.state_slot_allocation
          - entities.StateAllocation.fields.quota_raw
          - entities.StateAllocation.fields.slots_final
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >= 3 inputs (populations, total slots, MIN_STATE_SLOTS
          guarantee) interacting non-linearly (floor, fractional-remainder ranking, guarantee).
          With quotas 4.6 / 4.4 / 0.6 / 0.4 the guarantee forces DD 0 -> 1 and the remainder
          redistribution then costs AA its provisional 5th seat (final 4), an interaction no
          per-state rounding can reproduce.
        test_recipe:
          setup:
            - "A 4-state cycle (AA 4600, BB 4400, CC 600, DD 400; total 10000; total_semifinalist_slots 10) driven to ENTRY_CLOSED with zero entries, then semifinalist selection executed."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC4", target_graduation_year: 2028, total_semifinalist_slots: 10, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "AA", graduating_population: 4600 }, { state_code: "BB", graduating_population: 4400 }, { state_code: "CC", graduating_population: 600 }, { state_code: "DD", graduating_population: 400 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/open-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/close-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/run-semifinalist-selection"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "GET /api/program-cycles/${cyc}/state-allocations"
              payload: {}
              as: ProgramAdmin
          assert:
            - "StateAllocation[AA]: quota_raw == 4.6000, slots_provisional == 5, slots_final == 4"
            - "StateAllocation[BB]: quota_raw == 4.4000, slots_provisional == 4, slots_final == 4"
            - "StateAllocation[CC]: quota_raw == 0.6000, slots_provisional == 1, slots_final == 1"
            - "StateAllocation[DD]: quota_raw == 0.4000, slots_provisional == 0, slots_final == 1 (MIN_STATE_SLOTS guarantee)"
            - "sum(slots_final) == 10 == total_semifinalist_slots; AA loses exactly the seat DD gains"

      - name: disbursement_per_term_rounding_remainder_absorption
        grounds:
          - calculations.disbursement_schedule
          - entities.Disbursement.fields.amount_cents
          - entities.Disbursement.fields.scheduled_date
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: rounding every term of a 250005-cent,
          6-term college award would yield 6 * 41668 = 250008 (3 cents of drift), while the pinned
          order (round_half_up each non-final term, final term absorbs the remainder) yields
          [41668 x5, 41665] summing to exactly 250005. Different mode than instance
          largest_remainder_min_guarantee_redistribution (mode a).
        test_recipe:
          setup:
            - "Single-state cycle advanced to FINALISTS_SELECTED with one FINALIST_CONFIRMED applicant whose first_choice_college_id is the college below."
            - "College: award_amount_cents 83335 per year, renewable_years_total 3, terms_per_year 2 (award total 250005 over 6 terms), pool 1000000, max_awards 5."
            - "Award matched and accepted at the default logical clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-ROUND", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/open-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/schools"
              payload: { name: "ZZ High", school_code: "ZZ-1", state_code: "ZZ" }
              as: ProgramAdmin
              captures: { sch: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "F One", school_id: "${sch}", state_code: "ZZ", graduation_year: 2028, citizenship_status: "US_CITIZEN", enrollment_status: "ENROLLED_FULL_TIME" }
              as: ProgramAdmin
              captures: { stu: $.data.id }
            - call: "POST /api/entries"
              payload: { student_id: "${stu}", cycle_id: "${cyc}", exam_year_of_hs: "THIRD_YEAR" }
              as: Student
              as_user_id: "${stu}"
              captures: { ent: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/close-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/entries/${ent}/score"
              payload: { reading_score: 37, writing_score: 37, math_score: 38 }
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/run-semifinalist-selection"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/college-institutions"
              payload: { legal_name: "State University", college_code: "SU", award_amount_cents: 83335, renewable_years_total: 3, terms_per_year: 2, pool_total_cents: 1000000, max_awards: 5 }
              as: ProgramAdmin
              captures: { col: $.data.id }
            - call: "POST /api/finalist-applications"
              payload: { entry_id: "${ent}", first_choice_college_id: "${col}", gpa_scaled: 3.9, course_rigor: "MOST_RIGOROUS", confirming_selection_index: 210 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
            - call: "POST /api/finalist-applications/${app}/endorse"
              payload: {}
              as: SchoolOfficial
              as_user_id: "${sch}"
            - call: "POST /api/finalist-applications/${app}/submit"
              payload: {}
              as: Student
              as_user_id: "${stu}"
              captures: { app_v: $.data.version }
            - call: "POST /api/finalist-applications/${app}/review"
              payload: { decision: "CONFIRM", expected_finalist_application_version: "${app_v}" }
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/publish-finalists"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/run-award-matching"
              payload: {}
              as: ProgramAdmin
            - call: "GET /api/awards"
              payload: { student_id: "${stu}", cycle_id: "${cyc}" }
              as: ProgramAdmin
              captures: { aw: "$.data[0].id" }
            - call: "POST /api/awards/${aw}/accept"
              payload: {}
              as: Student
              as_user_id: "${stu}"
          trigger:
            - call: "GET /api/awards/${aw}/disbursements"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Award.${aw}.category == COLLEGE_SPONSORED, amount_cents == 250005 (83335 * 3), terms_total == 6 (3 * 2), renewable_years_total == 3"
            - "exactly 6 Disbursements exist, sorted term_index ASC with amounts [41668, 41668, 41668, 41668, 41668, 41665]"
            - "sum of disbursement amounts == 250005 == Award.amount_cents (the pinned order; rounding all six terms would give 250008)"
            - "Disbursement term 6 amount_cents == 41665, differing from terms 1-5 (41668): the final term absorbs the remainder"
            - "scheduled dates: term1 2026-09-01, term2 2027-02-28, term3 2027-08-27, term4 2028-02-23, term5 2028-08-21, term6 2029-02-17 (180-day spacing from acceptance)"
            - "term1 and term2 status == SCHEDULED (year 1); terms 3-6 status == HELD (years 2-3 pending renewal)"

  - rule_id: non_linear_state_machine
    instances:
      - name: finalist_application_return_resubmit_cycle
        grounds:
          - state_machines.FinalistApplication.UNDER_REVIEW_to_RETURNED_FOR_CORRECTION
          - state_machines.FinalistApplication.RETURNED_FOR_CORRECTION_to_UNDER_REVIEW
          - state_machines.FinalistApplication.UNDER_REVIEW_to_FINALIST_CONFIRMED
        distinguishing_aspect: |
          Cyclic machine on FinalistApplication: UNDER_REVIEW -> RETURNED_FOR_CORRECTION ->
          UNDER_REVIEW -> FINALIST_CONFIRMED traverses the correction loop; return_reason is
          set on RETURN and cleared on resubmission, and version increments exactly once per edge.
          (The second non-linear machine, on Award, uses parallel dimensions instead of a cycle.)
        test_recipe:
          setup:
            - "Single-state cycle in SEMIFINALISTS_SELECTED with one selected student whose application is endorsed, submitted, and UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-LOOP", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/open-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/schools"
              payload: { name: "ZZ High", school_code: "ZZ-1", state_code: "ZZ" }
              as: ProgramAdmin
              captures: { sch: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "F One", school_id: "${sch}", state_code: "ZZ", graduation_year: 2028, citizenship_status: "US_CITIZEN", enrollment_status: "ENROLLED_FULL_TIME" }
              as: ProgramAdmin
              captures: { stu: $.data.id }
            - call: "POST /api/entries"
              payload: { student_id: "${stu}", cycle_id: "${cyc}", exam_year_of_hs: "THIRD_YEAR" }
              as: Student
              as_user_id: "${stu}"
              captures: { ent: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/close-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/entries/${ent}/score"
              payload: { reading_score: 37, writing_score: 37, math_score: 38 }
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/run-semifinalist-selection"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/finalist-applications"
              payload: { entry_id: "${ent}", gpa_scaled: 3.9, course_rigor: "MOST_RIGOROUS", confirming_selection_index: 210 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
            - call: "POST /api/finalist-applications/${app}/endorse"
              payload: {}
              as: SchoolOfficial
              as_user_id: "${sch}"
            - call: "POST /api/finalist-applications/${app}/submit"
              payload: {}
              as: Student
              as_user_id: "${stu}"
              captures: { app_v1: $.data.version }
          trigger:
            - call: "POST /api/finalist-applications/${app}/review"
              payload: { decision: "RETURN", expected_finalist_application_version: "${app_v1}", return_reason: "Add honors coursework detail" }
              as: ProgramAdmin
              captures: { st_returned: $.data.status }
            - call: "POST /api/finalist-applications/${app}/submit"
              payload: {}
              as: Student
              as_user_id: "${stu}"
              captures: { app_v2: $.data.version, st_resub: $.data.status, rr_resub: $.data.return_reason }
            - call: "POST /api/finalist-applications/${app}/review"
              payload: { decision: "CONFIRM", expected_finalist_application_version: "${app_v2}" }
              as: ProgramAdmin
              captures: { st_final: $.data.status, app_v3: $.data.version }
          assert:
            - "${st_returned} == RETURNED_FOR_CORRECTION and return_reason == 'Add honors coursework detail' after the RETURN decision"
            - "${st_resub} == UNDER_REVIEW and ${rr_resub} is null (resubmission clears return_reason and closes the loop edge)"
            - "${st_final} == FINALIST_CONFIRMED"
            - "${app_v3} == 6: create(1) -> endorse(2) -> submit(3) -> RETURN(4) -> resubmit(5) -> CONFIRM(6), exactly +1 per edge"

      - name: award_parallel_dimensions_independent
        grounds:
          - state_machines.Award
          - entities.Award.fields.recipient_status
          - entities.Award.fields.funding_status
          - state_machines.Disbursement.HELD_to_SCHEDULED
        distinguishing_aspect: |
          Parallel state dimensions on Award (not a cycle like FinalistApplication):
          recipient_status and funding_status evolve independently — after the year-2 renewal
          is APPROVED the award is recipient_status RENEWED while funding_status is still
          PARTIALLY_DISBURSED, and only the final term release drives funding to
          FULLY_DISBURSED which then flips recipient to COMPLETED and bubbles the cycle to
          AWARDS_COMPLETED.
