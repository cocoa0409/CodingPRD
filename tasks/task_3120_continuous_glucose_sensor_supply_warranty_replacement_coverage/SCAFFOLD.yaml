      - "POST /cgm/sensor-orders/{id}/ship"
      - "POST /cgm/sensor-orders/{id}/deliver"
      - "POST /cgm/sensor-orders/{id}/cancel"
      - "POST /cgm/replacement-shipments/{id}/ship"
