        claim_type: exclusive_op_denied
        grounds: [roles.Parent, roles.StudioAdmin, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A Parent calling POST /invoices/generate (StudioAdmin-exclusive) -> ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A family exists; acting as Parent of that family."]
          setup_api_calls:
            - call: "POST /families"
              payload: { email: "pcfam@x.com", family_name: "PC" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /terms"
              payload: { name: "PC T", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
