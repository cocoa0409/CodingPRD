        grounds:
          - calculations.lab_window_overlap_check
          - entities.CertificationTestRun.fields.lab_code
          - errors.ERR_LAB_WINDOW_OVERLAP
        distinguishing_aspect: |
          Interval semantics: strict pairwise half-open overlap scoped by
          lab_code — touching windows (end == start) are allowed, a one-day
          interior overlap is rejected, and the same window in a different lab
          is fine. Different resource (test lab) and different semantics from
          the day-bucket aggregate bay-capacity instance.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; family in TESTING (spec ACTIVE, no runs yet)."
          setup_api_calls:
            - *c_clock0
            - *c_std
            - *c_std_pub
            - *c_fam
            - *c_spec
            - *c_cal
            - *c_act
            - *c_bt
          trigger:
