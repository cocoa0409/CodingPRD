# =============================================================================
# Botanical Garden / Arboretum — Membership & Admission Platform (Expert)
# SCAFFOLD.yaml  (§1.0–§1.7)
# =============================================================================

scenario: |
  Botanical Garden / Arboretum Membership & Admission: timed-entry & capacity,
  member tier/household & reciprocal network, special-exhibit/event ticketing,
  education program & camp registration, donation/conservancy add-on,
  facility/event rental, renewal/auto-renew, guest passes

domain_name: botanical-garden-arboretum
api_prefix: /v1

# -----------------------------------------------------------------------------
# Complexity Profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation        # timed-entry slot capacity competed for, held, committed, released
  secondary_archetype: pricing_engine        # tiered membership pricing, reciprocal/household discounts, proration
  complexity_layers:
    - rate_threshold_triggers                 # capacity breakpoints, household-size caps, guest-pass allotments
    - cascading_side_effects                  # membership lapse -> reservations/registrations cascade
    - dual_variant_calculation                # join-fee proration vs renewal credit; provisional vs final event price
    - optimistic_concurrency                  # OCC on Membership.version for reservation create-with-supersede

  entity_topology: flat
  # Garden is the tenant root; every other entity is a flat top-level collection
  # under /v1 that FKs back to Garden via garden_id in the body and cross-references
  # peers (Reservation->TimeSlot + Membership, Registration->ProgramSession,
  # Rental->Venue, Donation->Membership). No nesting in URL paths — FK in body.

  state_machine_shape: branching
  # Membership has a revision/renewal cycle (cyclic), Reservation has fork-join
  # (HELD -> {CHECKED_IN, EXPIRED, CANCELLED}), Rental has approve/reject branching.

  relationship_patterns:
    - one_to_many        # Garden -> TimeSlot, ProgramSession, Venue; Membership -> Reservation
    - many_to_many       # GuestPass links a Reservation party to a Membership allotment
    - cross_aggregate    # Reservation references Membership AND TimeSlot across aggregates

  role_model: peer_roles
  # Visitor (member/guest acting on own resources), GardenStaff (gate/registrar),
  # RentalCoordinator (venue rentals), DevelopmentOfficer (donations/conservancy),
  # GardenAdmin (catalog + overrides).

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Garden
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Garden / arboretum display name" }
      - { name: timezone, type: string, source: input, description: "IANA timezone for slot/session local-day math", default: "America/New_York" }
      - { name: reciprocal_network_code, type: string, source: input, description: "Reciprocal-garden network this garden belongs to (e.g. AHS, APGA); empty string = not in any network", default: "" }
      - { name: reciprocal_discount_pct, type: number, source: input, description: "Fraction (0..1) off general-admission ticket price honored for reciprocal members from OTHER gardens in the same network", default: 0.5 }
      - { name: household_member_cap, type: integer, source: input, description: "Max named household members on a HOUSEHOLD-tier membership (primary excluded from this cap)", default: 2 }
      - { name: guest_pass_grant_household, type: integer, source: input, description: "Guest passes granted at activation for HOUSEHOLD tier", default: 4 }
      - { name: guest_pass_grant_patron, type: integer, source: input, description: "Guest passes granted at activation for PATRON tier", default: 8 }

  # ---------------------------------------------------------------------------
  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - { name: garden_id, type: string, source: input, description: "FK -> Garden.id" }
      - { name: tier, type: enum, source: input, description: "Membership tier", constraints: "INDIVIDUAL | HOUSEHOLD | PATRON" }
      - { name: annual_fee_cents, type: integer, source: input, description: "Annual membership fee in cents", constraints: ">= 0" }
      - { name: admission_included, type: boolean, source: input, description: "True if free general admission for the named members", default: true }
      - { name: event_discount_pct, type: number, source: input, description: "Fraction (0..1) members get off special-exhibit/event ticket price for this tier", default: 0.2 }
      - { name: program_discount_pct, type: number, source: input, description: "Fraction (0..1) members get off education program/camp tuition for this tier", default: 0.1 }
      - { name: active, type: boolean, source: input, description: "Whether new memberships may be created against this plan", default: true }

  # ---------------------------------------------------------------------------
  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: garden_id, type: string, source: input, description: "FK -> Garden.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> MembershipPlan.id" }
      - { name: primary_member_name, type: string, source: input, description: "Name of the primary member (the account holder)" }
      - { name: household_member_names, type: array, source: input, description: "Named household members (strings); each consumes one household_member_cap slot", default: [] }
      - { name: status, type: enum, source: system, description: "Lifecycle status", constraints: "PENDING | ACTIVE | LAPSED | CANCELLED" }
      - { name: auto_renew, type: boolean, source: input, description: "If true, /renew at expiry charges and extends; if false, membership LAPSES at expiry", default: false }
      - { name: term_start, type: datetime, source: computed, description: "Activation instant; set when status -> ACTIVE" }
      - { name: term_end, type: datetime, source: computed, description: "term_start + 365 days; the expiry instant" }
      - { name: paid_total_cents, type: integer, source: computed, description: "Cumulative cents charged to this membership across activation + renewals" }
      - { name: guest_passes_remaining, type: integer, source: computed, description: "Unspent guest-pass allotment for the current term; reset on activation/renewal" }
      - { name: renewal_count, type: integer, source: computed, description: "Number of completed renewals; starts 0", default: 0 }

  # ---------------------------------------------------------------------------
  - name: TimeSlot
    parent: null
    common_fields: true
    fields:
      - { name: garden_id, type: string, source: input, description: "FK -> Garden.id" }
      - { name: starts_at, type: datetime, source: input, description: "Slot window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Slot window end (exclusive); must be > starts_at" }
      - { name: capacity, type: integer, source: input, description: "Total admission capacity (party heads) for this slot", constraints: ">= 1" }
      - { name: ga_price_cents, type: integer, source: input, description: "General-admission per-head price in cents for non-members", constraints: ">= 0" }
      - { name: held_count, type: integer, source: computed, description: "Heads currently held by non-terminal reservations (HELD + CHECKED_IN)" }
      - { name: status, type: enum, source: system, description: "Slot availability", constraints: "OPEN | CLOSED" }

  # ---------------------------------------------------------------------------
  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: garden_id, type: string, source: input, description: "FK -> Garden.id" }
      - { name: time_slot_id, type: string, source: input, description: "FK -> TimeSlot.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; empty string for a non-member (paid GA) reservation", default: "" }
      - { name: member_heads, type: integer, source: input, description: "Heads covered free by an included-admission membership (primary + household)", default: 0 }
      - { name: guest_heads, type: integer, source: input, description: "Heads covered by spending guest passes from the membership", default: 0 }
      - { name: paid_heads, type: integer, source: input, description: "Heads paying general admission (members over allotment, or non-members)", default: 0 }
      - { name: reciprocal, type: boolean, source: input, description: "If true, paid_heads are priced with the reciprocal network discount instead of full GA", default: false }
      - { name: party_size, type: integer, source: computed, description: "member_heads + guest_heads + paid_heads; the heads charged against TimeSlot.capacity" }
      - { name: admission_cents, type: integer, source: computed, description: "Total admission charge in cents for this reservation" }
      - { name: status, type: enum, source: system, description: "Reservation lifecycle", constraints: "HELD | CHECKED_IN | EXPIRED | CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: EventTicket
    parent: null
    common_fields: true
    fields:
      - { name: garden_id, type: string, source: input, description: "FK -> Garden.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; empty string = non-member buyer", default: "" }
      - { name: exhibit_name, type: string, source: input, description: "Special exhibit / ticketed event name" }
      - { name: list_price_cents, type: integer, source: input, description: "Per-ticket list (non-member) price in cents", constraints: ">= 0" }
      - { name: quantity, type: integer, source: input, description: "Number of tickets purchased", constraints: ">= 1" }
      - { name: charged_cents, type: integer, source: computed, description: "Total charged (member discount applied per applicable plan tier)" }
      - { name: status, type: enum, source: system, description: "Ticket lifecycle", constraints: "PURCHASED | REFUNDED" }

  # ---------------------------------------------------------------------------
  - name: ProgramSession
    parent: null
    common_fields: true
    fields:
      - { name: garden_id, type: string, source: input, description: "FK -> Garden.id" }
      - { name: title, type: string, source: input, description: "Education program / camp session title" }
      - { name: starts_at, type: datetime, source: input, description: "Session start instant" }
      - { name: capacity, type: integer, source: input, description: "Max enrolled registrations", constraints: ">= 1" }
      - { name: tuition_cents, type: integer, source: input, description: "Per-registration list tuition in cents", constraints: ">= 0" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of ENROLLED registrations" }
      - { name: status, type: enum, source: system, description: "Session availability", constraints: "OPEN | CLOSED" }

  # ---------------------------------------------------------------------------
  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: garden_id, type: string, source: input, description: "FK -> Garden.id" }
      - { name: program_session_id, type: string, source: input, description: "FK -> ProgramSession.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; empty string = non-member registrant", default: "" }
      - { name: participant_name, type: string, source: input, description: "Camper / participant name" }
      - { name: charged_cents, type: integer, source: computed, description: "Tuition charged (member program discount applied when membership is ACTIVE)" }
      - { name: status, type: enum, source: system, description: "Registration lifecycle", constraints: "ENROLLED | WAITLISTED | WITHDRAWN" }
      - { name: waitlist_rank, type: integer, source: computed, description: "1-based position in the session waitlist; 0 when ENROLLED" }

  # ---------------------------------------------------------------------------
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: garden_id, type: string, source: input, description: "FK -> Garden.id" }
      - { name: name, type: string, source: input, description: "Rentable facility name (e.g. Conservatory Hall)" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Rental rate in cents per booked hour", constraints: ">= 0" }
      - { name: buffer_minutes, type: integer, source: input, description: "Mandatory turnover buffer (minutes) that must separate two bookings on this venue", default: 60 }
      - { name: member_rental_discount_pct, type: number, source: input, description: "Fraction (0..1) off rental subtotal for PATRON-tier members", default: 0.15 }

  # ---------------------------------------------------------------------------
  - name: Rental
    parent: null
    common_fields: true
    fields:
      - { name: garden_id, type: string, source: input, description: "FK -> Garden.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; empty string = non-member renter", default: "" }
      - { name: starts_at, type: datetime, source: input, description: "Rental window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Rental window end (exclusive); must be > starts_at" }
      - { name: quoted_cents, type: integer, source: computed, description: "Quoted rental price at REQUESTED (provisional, before deposit lock)" }
      - { name: final_cents, type: integer, source: computed, description: "Final confirmed rental price locked at CONFIRMED" }
      - { name: status, type: enum, source: system, description: "Rental lifecycle", constraints: "REQUESTED | CONFIRMED | REJECTED | CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: garden_id, type: string, source: input, description: "FK -> Garden.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; empty string = anonymous / non-member gift", default: "" }
      - { name: amount_cents, type: integer, source: input, description: "Gift amount in cents", constraints: ">= 1" }
      - { name: designation, type: enum, source: input, description: "Where the gift is directed", constraints: "GENERAL | CONSERVANCY | CAPITAL", default: "GENERAL" }
      - { name: tax_deductible_cents, type: integer, source: computed, description: "Deductible portion after subtracting fair-market value of any benefit received" }
      - { name: status, type: enum, source: system, description: "Donation lifecycle", constraints: "RECORDED | VOIDED" }

  # ---------------------------------------------------------------------------
  - name: ConservancyFund
    parent: null
    common_fields: true
    fields:
      - { name: garden_id, type: string, source: input, description: "FK -> Garden.id" }
      - { name: pledged_total_cents, type: integer, source: computed, description: "Cumulative CONSERVANCY-designated donation cents pledged (RECORDED minus VOIDED)" }
      - { name: matched_total_cents, type: integer, source: computed, description: "Cumulative match applied from the active match campaign" }
      - { name: match_ratio, type: number, source: input, description: "Match multiplier applied to each CONSERVANCY gift while the campaign is OPEN (e.g. 0.5 = 50% match)", default: 0.0 }
      - { name: match_cap_cents, type: integer, source: input, description: "Maximum total match the campaign will pay out", default: 0 }
      - { name: campaign_status, type: enum, source: system, description: "Match campaign status", constraints: "OPEN | CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Membership
    field: status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    note: "Cyclic renewal: ACTIVE -> ACTIVE via /renew. LAPSED is a non-terminal recoverable state (reinstatement re-activates)."
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /v1/memberships/{membership_id}/activate"
        actor: Visitor
        preconditions:
          - "membership.status == PENDING"
          - "referenced MembershipPlan.active == true"
          - "len(household_member_names) <= Garden.household_member_cap when plan.tier == HOUSEHOLD; household_member_names MUST be empty when plan.tier == INDIVIDUAL"
        side_effects:
          - "Run join_fee_proration -> charge annual_fee_cents; set paid_total_cents = annual_fee_cents"
          - "Set term_start = clock now; term_end = term_start + 365 days"
          - "Set guest_passes_remaining via guest_pass_grant calc (0 for INDIVIDUAL, Garden.guest_pass_grant_household for HOUSEHOLD, Garden.guest_pass_grant_patron for PATRON)"
          - "renewal_count stays 0"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /v1/memberships/{membership_id}/renew"
        actor: Visitor
        preconditions:
          - "membership.status == ACTIVE"
          - "clock now >= term_end - 30 days (renewal window open) OR auto_renew == true"
        side_effects:
          - "Run renewal_credit calc -> charge plan.annual_fee_cents minus unused-term credit; add charge to paid_total_cents"
          - "term_start = old term_end; term_end = old term_end + 365 days (extension, not reset to now)"
          - "guest_passes_remaining reset to the tier grant for the new term"
          - "renewal_count += 1"

      - from: ACTIVE
        to: LAPSED
        trigger: "POST /_clock/set_current_utc (advancing clock past term_end with auto_renew == false) OR POST /v1/memberships/{membership_id}/lapse"
        actor: system
        preconditions:
          - "membership.status == ACTIVE"
          - "clock now >= term_end"
          - "auto_renew == false"
        side_effects:
          - "CASCADE: every HELD Reservation owned by this membership whose slot start is >= now -> CANCELLED, releasing TimeSlot.held_count (which itself may flip TimeSlot.status CLOSED->OPEN)"
          - "CASCADE: every ENROLLED future Registration owned by this membership -> WITHDRAWN, decrementing ProgramSession.enrolled_count, which itself promotes the head WAITLISTED registration of that session to ENROLLED"
          - "guest_passes_remaining set to 0"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /v1/memberships/{membership_id}/reinstate"
        actor: Visitor
        preconditions:
          - "membership.status == LAPSED"
          - "referenced MembershipPlan.active == true"
        side_effects:
          - "Charge plan.annual_fee_cents; add to paid_total_cents"
          - "term_start = clock now; term_end = now + 365 days"
          - "guest_passes_remaining reset to tier grant; renewal_count += 1"

      - from: [PENDING, ACTIVE, LAPSED]
        to: CANCELLED
        trigger: "POST /v1/memberships/{membership_id}/cancel"
        actor: Visitor
        preconditions:
          - "membership.status in {PENDING, ACTIVE, LAPSED}"
        side_effects:
          - "CASCADE: every HELD Reservation owned by this membership -> CANCELLED, releasing TimeSlot.held_count"
          - "guest_passes_remaining set to 0"

  # ---------------------------------------------------------------------------
  - entity: Reservation
    field: status
    initial_state: HELD
    terminal_states: [CHECKED_IN, EXPIRED, CANCELLED]
    note: "Fork-join: HELD branches into one of three terminals with divergent side-effect sets."
    transitions:
      - from: HELD
        to: CHECKED_IN
        trigger: "POST /v1/reservations/{reservation_id}/check-in"
        actor: GardenStaff
        preconditions:
          - "reservation.status == HELD"
          - "referenced TimeSlot exists and TimeSlot.starts_at <= clock now < TimeSlot.ends_at"
          - "if membership_id != '': referenced Membership.status == ACTIVE (cross-entity gate)"
        side_effects:
          - "Heads remain counted in TimeSlot.held_count (check-in does not release capacity)"

      - from: HELD
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing now >= TimeSlot.ends_at while reservation still HELD; swept on next clock set"
        actor: system
        preconditions:
          - "reservation.status == HELD"
          - "clock now >= referenced TimeSlot.ends_at"
        side_effects:
          - "Release party_size from TimeSlot.held_count; if held_count < capacity and slot was CLOSED -> TimeSlot.status = OPEN"

      - from: HELD
        to: CANCELLED
        trigger: "POST /v1/reservations/{reservation_id}/cancel"
        actor: Visitor
        preconditions:
          - "reservation.status == HELD"
        side_effects:
          - "Release party_size from TimeSlot.held_count; if held_count < capacity and slot was CLOSED -> TimeSlot.status = OPEN"
          - "Refund spent guest passes: Membership.guest_passes_remaining += guest_heads"

  # ---------------------------------------------------------------------------
  - entity: Registration
    field: status
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN]
    note: "Compound: created ENROLLED if session has room else WAITLISTED; withdrawal of an ENROLLED promotes the head waitlister (bubble-up)."
    transitions:
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system (promotion when an ENROLLED registration of the same session withdraws)"
        actor: system
        preconditions:
          - "registration.status == WAITLISTED"
          - "registration has the lowest waitlist_rank (rank == 1) among WAITLISTED of its session"
          - "ProgramSession.enrolled_count < ProgramSession.capacity after the vacating withdrawal"
        side_effects:
          - "Set status ENROLLED, waitlist_rank = 0; ProgramSession.enrolled_count += 1"
          - "Re-rank remaining WAITLISTED registrations of the session (each rank -= 1)"
          - "Charge tuition via program_tuition calc at promotion time"

      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /v1/registrations/{registration_id}/withdraw"
        actor: Visitor
        preconditions:
          - "registration.status == ENROLLED"
        side_effects:
          - "ProgramSession.enrolled_count -= 1"
          - "Promote the WAITLISTED registration with waitlist_rank == 1 of the same session to ENROLLED (bubble-up promotion side effect chain)"

      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /v1/registrations/{registration_id}/withdraw"
        actor: Visitor
        preconditions:
          - "registration.status == WAITLISTED"
        side_effects:
          - "Re-rank remaining WAITLISTED of the session below the withdrawn rank (each rank -= 1)"

  # ---------------------------------------------------------------------------
  - entity: Rental
    field: status
    initial_state: REQUESTED
    terminal_states: [REJECTED, CANCELLED]
    note: "Branching approve/reject. CONFIRMED locks final_cents; only CONFIRMED occupies the venue against future overlap checks; REQUESTED is provisional."
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /v1/rentals/{rental_id}/confirm"
        actor: RentalCoordinator
        preconditions:
          - "rental.status == REQUESTED"
          - "No CONFIRMED Rental on the same venue whose [starts_at - buffer, ends_at + buffer] window overlaps this rental's [starts_at, ends_at) (venue temporal-overlap with buffer)"
        side_effects:
          - "Run rental_pricing final variant -> set final_cents (locked); quoted_cents preserved for audit"
          - "Venue is now occupied for overlap purposes for [starts_at, ends_at)"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /v1/rentals/{rental_id}/reject"
        actor: RentalCoordinator
        preconditions:
          - "rental.status == REQUESTED"
        side_effects:
          - "final_cents stays 0; rental does not occupy the venue"

      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /v1/rentals/{rental_id}/cancel"
        actor: Visitor
        preconditions:
          - "rental.status in {REQUESTED, CONFIRMED}"
        side_effects:
          - "Venue freed for overlap purposes (a CANCELLED rental no longer occupies the venue)"

  # ---------------------------------------------------------------------------
  - entity: ConservancyFund
    field: campaign_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "Match campaign gate. While OPEN, CONSERVANCY donations accrue match up to match_cap_cents; CLOSED stops new match."
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /v1/conservancy-funds/{fund_id}/close-campaign"
        actor: DevelopmentOfficer
        preconditions:
          - "campaign_status == OPEN"
        side_effects:
          - "No further match accrues to CONSERVANCY donations recorded after this point"

  # ---------------------------------------------------------------------------
  - entity: ProgramSession
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "Catalog gate. OPEN sessions accept registrations (ENROLLED while room, else WAITLISTED); CLOSED rejects new registrations."
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /v1/program-sessions/{session_id}/close"
        actor: GardenStaff
        preconditions:
          - "session.status == OPEN"
        side_effects:
          - "New registrations rejected with ERR_SESSION_CLOSED; existing ENROLLED/WAITLISTED unaffected"

  # ---------------------------------------------------------------------------
  - entity: EventTicket
    field: status
    initial_state: PURCHASED
    terminal_states: [REFUNDED]
    note: "Linear: a purchased ticket can be refunded once."
    transitions:
      - from: PURCHASED
        to: REFUNDED
        trigger: "POST /v1/event-tickets/{ticket_id}/refund"
        actor: GardenStaff
        preconditions:
          - "ticket.status == PURCHASED"
        side_effects:
          - "Ticket marked REFUNDED; a second refund yields ERR_REFUND_NOT_ALLOWED"

  # ---------------------------------------------------------------------------
  - entity: Donation
    field: status
    initial_state: RECORDED
    terminal_states: [VOIDED]
    note: "Linear with compensation: voiding reverses the conservancy pledge/match side effects."
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /v1/donations/{donation_id}/void"
        actor: DevelopmentOfficer
        preconditions:
          - "donation.status == RECORDED"
        side_effects:
          - "If designation == CONSERVANCY: ConservancyFund.pledged_total_cents -= amount_cents AND matched_total_cents -= the match this donation contributed (compensating reversal, conserves both totals)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reservation-create-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /v1/reservations"
    occ_field: "expected_membership_version"
    description: |
      Creating a Reservation that spends guest passes or claims free member
      heads against a Membership whose version has advanced since the client
      last read it is rejected. A guest-pass-spending reservation just created
      against the same membership (or a renewal that reset guest_passes_remaining)
      bumps Membership.version; a creation still carrying the prior version is
      stale and rejected, preventing two reservations from each believing they
      hold the same guest-pass balance.
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- (dual_variant #1: membership join vs renewal) ---------------------------
  - name: join_fee_proration
    trigger: "Membership PENDING->ACTIVE (activate) and LAPSED->ACTIVE (reinstate)"
    algorithm: forward_looking
    formula: |
      # New term begins NOW; member pays the full annual fee for a fresh 365-day term.
      charge_cents = plan.annual_fee_cents
      paid_total_cents += charge_cents
      term_start = now ; term_end = now + 365 days
    input_set: "Single MembershipPlan.annual_fee_cents; no proration of prior term (fresh term starts now)."
    constants:
      TERM_DAYS: 365
    precision: "integer cents; no rounding needed (fee is already integer cents)"
    variants:
      - name: activate_full_term
        when: "PENDING->ACTIVE"
        difference: "Always full annual_fee_cents for a brand-new term."
      - name: reinstate_full_term
        when: "LAPSED->ACTIVE"
        difference: "Same full-fee, fresh-term basis; lapsed time is forfeited (no credit)."

  - name: renewal_credit
    trigger: "Membership ACTIVE->ACTIVE (renew)"
    algorithm: chronological
    formula: |
      # Renewal EXTENDS the existing term rather than starting fresh, and credits
      # the unused remainder of the current term against the new annual fee.
      # Evaluation order is pinned: compute unused_days FIRST from the OLD term_end,
      # THEN derive credit, THEN the net charge.
      unused_days = max(0, ceil((term_end - now) / 1 day))      # whole days remaining
      daily_value_cents = plan.annual_fee_cents / TERM_DAYS      # real number, not yet rounded
      credit_cents = round_half_up(daily_value_cents * unused_days)   # round ONCE, after multiply
      charge_cents = max(0, plan.annual_fee_cents - credit_cents)
      paid_total_cents += charge_cents
      new_term_start = old_term_end ; new_term_end = old_term_end + 365 days
    input_set: "plan.annual_fee_cents, current term_end, clock now."
    constants:
      TERM_DAYS: 365
    precision: "round_half_up to whole cents; multiply daily_value * unused_days BEFORE rounding (pinned order)"
    variants:
      - name: early_renewal_with_credit
        when: "now < term_end (renewing inside the 30-day window)"
        difference: "credit_cents > 0; net charge below annual_fee_cents — diverges from join_fee_proration which never credits."
      - name: at_expiry_no_credit
        when: "now == term_end"
        difference: "unused_days == 0, credit 0, charge == full fee (boundary)."

  # --- (combinatorial #1, mode (a): non-linear branched admission pricing) -----
  - name: reservation_admission
    trigger: "Reservation create (POST /reservations); pins admission_cents and party_size"
    algorithm: tiered_pricing
    formula: |
      party_size = member_heads + guest_heads + paid_heads
      # member_heads ride free ONLY if a membership is attached AND its plan.admission_included.
      # guest_heads consume guest passes (priced at 0) ONLY if the membership has enough remaining.
      # paid_heads price depends on reciprocal flag (non-linear branch on a non-numeric input):
      if reciprocal == true:
        per_head = round_half_up(slot.ga_price_cents * (1 - garden.reciprocal_discount_pct))
      else:
        per_head = slot.ga_price_cents
      admission_cents = paid_heads * per_head
      # member_heads and guest_heads contribute 0 to admission_cents.
    input_set: "TimeSlot.ga_price_cents, Garden.reciprocal_discount_pct, reservation head split, membership plan."
    constants: {}
    precision: "round_half_up per-head FIRST, then multiply by paid_heads (pinned: round the per-head rate before multiplying)"
    variants:
      - name: member_free_plus_guest_passes
        when: "membership ACTIVE with admission_included and guest_passes_remaining >= guest_heads"
        difference: "member_heads + guest_heads cost 0; only paid_heads charged."
      - name: reciprocal_visitor
        when: "reciprocal == true (visiting member from another network garden)"
        difference: "paid_heads charged at discounted reciprocal per-head rate."

  # --- (combinatorial #2, mode (b): order-sensitive rounding on event tickets) -
  - name: event_ticket_pricing
    trigger: "EventTicket create (POST /event-tickets); pins charged_cents"
    algorithm: tiered_pricing
    formula: |
      # Member discount applies only if membership_id != '' AND that Membership.status == ACTIVE.
      # Rounding order is PINNED: discount and round the PER-TICKET price FIRST, then multiply by
      # quantity. (round-per-ticket-then-sum, NOT sum-then-round — they differ in cents.)
      if membership_id != '' and membership.status == ACTIVE:
        per_ticket = round_half_up(list_price_cents * (1 - plan.event_discount_pct))
      else:
        per_ticket = list_price_cents
      charged_cents = per_ticket * quantity
    input_set: "EventTicket.list_price_cents, quantity, membership plan.event_discount_pct, membership status."
    constants: {}
    precision: "round_half_up the per-ticket discounted price BEFORE multiplying by quantity (pinned order; differs from sum-then-round)"
    variants:
      - name: member_discounted
        when: "membership ACTIVE"
        difference: "per-ticket discounted then rounded, then * quantity."
      - name: non_member_list
        when: "no membership or membership not ACTIVE"
        difference: "full list_price_cents * quantity, no rounding artifact."

  # --- (combinatorial #3, mode (c): circular-looking rental quote/discount) ----
  - name: rental_pricing
    trigger: "Rental create sets quoted_cents (REQUESTED); Rental confirm sets final_cents (CONFIRMED)"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency, order PINNED:
      #   subtotal -> depends on hours
      #   member_discount -> keyed on subtotal tier (>= MEMBER_DISCOUNT_FLOOR_CENTS)
      #   final = subtotal - discount
      # Evaluation order: (1) hours, (2) subtotal, (3) eligibility check on subtotal, (4) discount, (5) final.
      hours = ceil((ends_at - starts_at) / 1 hour)        # partial hour rounds UP
      subtotal_cents = hours * venue.hourly_rate_cents
      eligible = (membership_id != '' and membership.status == ACTIVE
                  and membership.plan.tier == 'PATRON'
                  and subtotal_cents >= MEMBER_DISCOUNT_FLOOR_CENTS)
      discount_cents = round_half_up(subtotal_cents * venue.member_rental_discount_pct) if eligible else 0
      price_cents = subtotal_cents - discount_cents
    input_set: "Venue.hourly_rate_cents, Venue.member_rental_discount_pct, rental window, membership tier/status."
    constants:
      MEMBER_DISCOUNT_FLOOR_CENTS: 50000
    precision: "round_half_up on the discount; ceil hours; evaluation order pinned (subtotal before discount-eligibility)"
    variants:
      - name: quoted_provisional
        when: "Rental create (REQUESTED)"
        difference: "quoted_cents computed with the membership's tier/status AT REQUEST time."
      - name: final_locked
        when: "Rental confirm (CONFIRMED)"
        difference: "final_cents recomputed with tier/status AT CONFIRM time; if membership lapsed between request and confirm, the PATRON discount is lost and final_cents > quoted_cents (provisional vs final divergence)."

  # --- (dual_variant #2: donation deductible vs conservancy match — diff domain)-
  - name: donation_deductible
    trigger: "Donation create (POST /donations); pins tax_deductible_cents"
    algorithm: threshold
    formula: |
      # Deductible amount = gift minus fair-market value of any benefit. For this system,
      # a benefit is recognized only when designation == GENERAL and amount >= BENEFIT_THRESHOLD_CENTS
      # (a token-gift premium worth BENEFIT_FMV_CENTS). CONSERVANCY and CAPITAL gifts are fully deductible.
      if designation == 'GENERAL' and amount_cents >= BENEFIT_THRESHOLD_CENTS:
        tax_deductible_cents = amount_cents - BENEFIT_FMV_CENTS
      else:
        tax_deductible_cents = amount_cents
    input_set: "Donation.amount_cents, designation."
    constants:
      BENEFIT_THRESHOLD_CENTS: 25000
      BENEFIT_FMV_CENTS: 2000
    precision: "integer cents"

  - name: conservancy_match
    trigger: "Donation create where designation == CONSERVANCY (side effect updates ConservancyFund)"
    algorithm: aggregation
    formula: |
      # Aggregation with a cap. Match accrues ONLY while ConservancyFund.campaign_status == OPEN.
      # Pinned: compute the would-be match, then clamp by remaining cap.
      if fund.campaign_status == 'OPEN':
        raw_match = round_half_up(donation.amount_cents * fund.match_ratio)
        remaining_cap = max(0, fund.match_cap_cents - fund.matched_total_cents)
        applied_match = min(raw_match, remaining_cap)
      else:
        applied_match = 0
      fund.pledged_total_cents += donation.amount_cents
      fund.matched_total_cents += applied_match
    input_set: "CONSERVANCY donations (RECORDED), fund.match_ratio, fund.match_cap_cents, fund.matched_total_cents, campaign_status."
    constants: {}
    precision: "round_half_up on raw_match, then min-clamp by remaining cap (pinned order)"

  # --- program tuition (member program discount) -------------------------------
  - name: program_tuition
    trigger: "Registration create (ENROLLED) and WAITLISTED->ENROLLED promotion; pins charged_cents"
    algorithm: threshold
    formula: |
      # Member program discount applies only when membership_id != '' AND that
      # Membership.status == ACTIVE at the moment tuition is charged (create OR promotion).
      if membership_id != '' and membership.status == ACTIVE:
        charged_cents = round_half_up(session.tuition_cents * (1 - plan.program_discount_pct))
      else:
        charged_cents = session.tuition_cents
      # WAITLISTED registrations charge 0 until promoted; charged_cents is set at the
      # moment status becomes ENROLLED (create-time enroll OR promotion-time enroll).
    input_set: "ProgramSession.tuition_cents, plan.program_discount_pct, membership status at charge time."
    constants: {}
    precision: "round_half_up the discounted tuition to whole cents"

  # --- guest-pass grant (referenced by activation/renewal) ----------------------
  - name: guest_pass_grant
    trigger: "Membership activation/renewal/reinstatement"
    algorithm: threshold
    formula: |
      if plan.tier == 'INDIVIDUAL': grant = 0
      elif plan.tier == 'HOUSEHOLD': grant = garden.guest_pass_grant_household
      elif plan.tier == 'PATRON':    grant = garden.guest_pass_grant_patron
      guest_passes_remaining = grant
    input_set: "plan.tier, Garden.guest_pass_grant_household, Garden.guest_pass_grant_patron."
    constants: {}
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed Visitor acting on a membership-owned resource, X-User-ID must equal the resource's membership's primary owner id (ownership)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "member-owned mutations (reservation cancel, membership renew/cancel/reinstate, registration withdraw, rental cancel)"

  - priority: 4
    category: existence
    check: "All path/body-referenced resources exist, validated left-to-right (garden, then nested/FK resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_referential
    check: "Body FK targets belong to the same Garden as the path garden (cross-garden references rejected)"
    error_id: ERR_CROSS_GARDEN_REFERENCE
    http_status: 422
    applies_to: "all create endpoints with body FKs"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_constraint
    check: "OCC: expected_membership_version matches Membership.version on reservation create"
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412
    applies_to: "POST /reservations"

  - priority: 8
    category: business_constraint
    check: "Membership cross-entity gate: a membership-attached reservation/registration/event requires the Membership in the required status (ACTIVE for free admission / member pricing; check-in requires ACTIVE)"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "reservation check-in; reservation create claiming member_heads/guest_heads"

  - priority: 9
    category: business_temporal
    check: "Time window well-formed: ends_at > starts_at for TimeSlot, Venue rental window"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /time-slots, POST /rentals"

  - priority: 10
    category: business_safety
    check: "Household member cap: household_member_names length must not exceed Garden.household_member_cap for HOUSEHOLD tier; must be empty for INDIVIDUAL/PATRON"
    error_id: ERR_HOUSEHOLD_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /memberships, POST /memberships/{id}/activate"

  - priority: 11
    category: business_constraint
    check: "Guest-pass sufficiency: reservation guest_heads must not exceed Membership.guest_passes_remaining"
    error_id: ERR_INSUFFICIENT_GUEST_PASSES
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 12
    category: business_constraint
    check: "Reciprocal eligibility: reservation.reciprocal == true requires Garden.reciprocal_network_code != '' AND (membership_id == '' OR the attached membership belongs to a DIFFERENT garden in the same network)"
    error_id: ERR_RECIPROCAL_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 13
    category: business_temporal
    check: "Venue overlap: a Rental confirm collides with an existing CONFIRMED Rental on the same venue within the buffer window"
    error_id: ERR_VENUE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /rentals/{id}/confirm"

  - priority: 14
    category: business_fiscal
    check: "TimeSlot capacity: held_count + reservation.party_size must not exceed TimeSlot.capacity"
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 15
    category: business_fiscal
    check: "ProgramSession is OPEN and not full for an ENROLLED registration; a full OPEN session yields WAITLISTED (not an error), a CLOSED session is rejected"
    error_id: ERR_SESSION_CLOSED
    http_status: 409
    applies_to: "POST /registrations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving clock ----------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set logical clock to an ISO8601 UTC instant. Server startup default is 2026-04-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock. Setting the clock sweeps: HELD reservations whose slot has ended -> EXPIRED; ACTIVE non-auto-renew memberships past term_end -> LAPSED (with cascades)."
    roles: [GardenAdmin]
    code: 200
    input: [to_iso8601]
    output: { now: datetime, lapsed_membership_ids: array, expired_reservation_ids: array }
    side_effects:
      - "Reservation HELD->EXPIRED sweep (release held_count)"
      - "Membership ACTIVE->LAPSED sweep with reservation/registration cascades"

  # ---- Garden ----------------------------------------------------------------
  - method: POST
    path: "/v1/gardens"
    description: "Create a garden (tenant root)"
    roles: [GardenAdmin]
    code: 201
    input: [name, "timezone?", "reciprocal_network_code?", "reciprocal_discount_pct?", "household_member_cap?", "guest_pass_grant_household?", "guest_pass_grant_patron?"]
    output: Garden
    side_effects: []

  - method: GET
    path: "/v1/gardens/{garden_id}"
    description: "Read a garden"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: []
    output: Garden
    side_effects: []

  # ---- MembershipPlan --------------------------------------------------------
  - method: POST
    path: "/v1/membership-plans"
    description: "Create a membership plan for a tier"
    roles: [GardenAdmin]
    code: 201
    input: [garden_id, tier, annual_fee_cents, "admission_included?", "event_discount_pct?", "program_discount_pct?", "active?"]
    output: MembershipPlan
    side_effects: []

  - method: GET
    path: "/v1/membership-plans/{plan_id}"
    description: "Read a membership plan"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: []
    output: MembershipPlan
    side_effects: []

  - method: GET
    path: "/v1/membership-plans"
    description: "List/filter membership plans by garden and/or tier"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: ["garden_id?", "tier?"]
    output: MembershipPlan[]
    side_effects: []

  # ---- Membership ------------------------------------------------------------
  - method: POST
    path: "/v1/memberships"
    description: "Create a membership in PENDING status"
    roles: [Visitor, GardenStaff]
    code: 201
    input: [garden_id, plan_id, primary_member_name, "household_member_names?", "auto_renew?"]
    output: Membership
    side_effects: ["status=PENDING; guest_passes_remaining=0; paid_total_cents=0; renewal_count=0"]

  - method: GET
    path: "/v1/memberships/{membership_id}"
    description: "Read a membership"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: []
    output: Membership
    side_effects: []

  - method: GET
    path: "/v1/memberships"
    description: "List/filter memberships by garden, plan, and/or status"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: ["garden_id?", "plan_id?", "status?"]
    output: Membership[]
    side_effects: []

  - method: POST
    path: "/v1/memberships/{membership_id}/activate"
    description: "Activate a PENDING membership (charge join fee, start term, grant guest passes)"
    roles: [Visitor, GardenStaff]
    code: 200
    input: []
    output: Membership
    side_effects: ["status PENDING->ACTIVE", "join_fee_proration", "guest_pass_grant", "set term_start/term_end"]

  - method: POST
    path: "/v1/memberships/{membership_id}/renew"
    description: "Renew an ACTIVE membership (extend term, credit unused remainder)"
    roles: [Visitor, GardenStaff]
    code: 200
    input: []
    output: Membership
    side_effects: ["renewal_credit", "extend term_end", "reset guest_passes_remaining", "renewal_count += 1"]

  - method: POST
    path: "/v1/memberships/{membership_id}/reinstate"
    description: "Reinstate a LAPSED membership (fresh term, full fee)"
    roles: [Visitor, GardenStaff]
    code: 200
    input: []
    output: Membership
    side_effects: ["status LAPSED->ACTIVE", "charge full fee", "reset term + guest passes"]

  - method: POST
    path: "/v1/memberships/{membership_id}/lapse"
    description: "Force an ACTIVE membership to LAPSED (administrative; same cascades as clock-driven lapse)"
    roles: [GardenAdmin, GardenStaff]
    code: 200
    input: []
    output: Membership
    side_effects: ["status ACTIVE->LAPSED", "cascade reservation cancel + registration withdraw + waitlist promotion"]

  - method: POST
    path: "/v1/memberships/{membership_id}/cancel"
    description: "Cancel a membership (terminal)"
    roles: [Visitor, GardenStaff]
    code: 200
    input: []
    output: Membership
    side_effects: ["status -> CANCELLED", "cascade cancel HELD reservations"]

  # ---- TimeSlot --------------------------------------------------------------
  - method: POST
    path: "/v1/time-slots"
    description: "Create a timed-entry slot"
    roles: [GardenAdmin, GardenStaff]
    code: 201
    input: [garden_id, starts_at, ends_at, capacity, ga_price_cents]
    output: TimeSlot
    side_effects: ["status=OPEN; held_count=0"]

  - method: GET
    path: "/v1/time-slots/{slot_id}"
    description: "Read a time slot (includes held_count, status)"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: []
    output: TimeSlot
    side_effects: []

  - method: GET
    path: "/v1/time-slots"
    description: "List/filter time slots by garden and/or status"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: ["garden_id?", "status?"]
    output: TimeSlot[]
    side_effects: []

  # ---- Reservation -----------------------------------------------------------
  - method: POST
    path: "/v1/reservations"
    description: "Create a timed-entry reservation (holds slot capacity, spends guest passes, prices paid heads). OCC on attached membership."
    roles: [Visitor, GardenStaff]
    code: 201
    input: [garden_id, time_slot_id, "membership_id?", "member_heads?", "guest_heads?", "paid_heads?", "reciprocal?", "expected_membership_version?"]
    output: Reservation
    side_effects: ["reservation_admission calc", "TimeSlot.held_count += party_size; flip slot CLOSED if full", "Membership.guest_passes_remaining -= guest_heads; increments Membership.version by 1 when membership attached"]

  - method: GET
    path: "/v1/reservations/{reservation_id}"
    description: "Read a reservation"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/v1/reservations"
    description: "List/filter reservations by garden, slot, membership, and/or status"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: ["garden_id?", "time_slot_id?", "membership_id?", "status?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/v1/reservations/{reservation_id}/check-in"
    description: "Check in a HELD reservation at the gate (requires active membership if attached)"
    roles: [GardenStaff]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status HELD->CHECKED_IN"]

  - method: POST
    path: "/v1/reservations/{reservation_id}/cancel"
    description: "Cancel a HELD reservation (release capacity, refund guest passes)"
    roles: [Visitor, GardenStaff]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status HELD->CANCELLED", "release held_count", "refund guest passes to membership"]

  # ---- EventTicket -----------------------------------------------------------
  - method: POST
    path: "/v1/event-tickets"
    description: "Purchase special-exhibit/event tickets (member discount if attached membership ACTIVE)"
    roles: [Visitor, GardenStaff]
    code: 201
    input: [garden_id, exhibit_name, list_price_cents, quantity, "membership_id?"]
    output: EventTicket
    side_effects: ["event_ticket_pricing calc -> charged_cents; status=PURCHASED"]

  - method: GET
    path: "/v1/event-tickets/{ticket_id}"
    description: "Read an event ticket"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: []
    output: EventTicket
    side_effects: []

  - method: GET
    path: "/v1/event-tickets"
    description: "List/filter event tickets by garden, membership, and/or status"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: ["garden_id?", "membership_id?", "status?"]
    output: EventTicket[]
    side_effects: []

  - method: POST
    path: "/v1/event-tickets/{ticket_id}/refund"
    description: "Refund a purchased event ticket"
    roles: [GardenStaff, GardenAdmin]
    code: 200
    input: []
    output: EventTicket
    side_effects: ["status PURCHASED->REFUNDED"]

  # ---- ProgramSession --------------------------------------------------------
  - method: POST
    path: "/v1/program-sessions"
    description: "Create an education program / camp session"
    roles: [GardenAdmin, GardenStaff]
    code: 201
    input: [garden_id, title, starts_at, capacity, tuition_cents]
    output: ProgramSession
    side_effects: ["status=OPEN; enrolled_count=0"]

  - method: GET
    path: "/v1/program-sessions/{session_id}"
    description: "Read a program session (includes enrolled_count)"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: []
    output: ProgramSession
    side_effects: []

  - method: GET
    path: "/v1/program-sessions"
    description: "List/filter program sessions by garden and/or status"
    roles: [GardenAdmin, GardenStaff, RentalCoordinator, DevelopmentOfficer, Visitor]
    code: 200
    input: ["garden_id?", "status?"]
