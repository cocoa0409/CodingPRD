              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_dsl_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "TX", school_year: "2026-2027", min_seat_capacity: 71, min_emergency_exit_count: 5, min_joint_strength_kn: 55.0, required_route_range_mi: 400.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW", terrain_class: "FLAT" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { tx_id: $.data.id }
            - call: "POST /state-spec-profiles/${tx_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /dealers"
              payload: { dealer_code: "D-TX-01", dealer_name: "Lone Star Bus Sales", licensed_state_codes: ["TX", "OK"], training_capacity_per_month: 20 }
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { dealer_tx_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
            - call: "POST /dealers/${dealer_tx_id}/legacy-fleet-records"
              payload: { bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", spec_profile_id: "${tx_id}", vin: "1TXDSL0000009001", delivered_at: "2026-05-10T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { legacy_1_id: $.data.id }
            - call: "POST /dealers/${dealer_tx_id}/legacy-fleet-records"
              payload: { bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", spec_profile_id: "${tx_id}", vin: "1TXDSL0000009002", delivered_at: "2026-06-02T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { legacy_2_id: $.data.id }
            - call: "POST /recall-campaigns"
              payload: { campaign_code: "RC-DSL-01", affected_bus_model_id: "${model_c_id}", affected_propulsion_type: "DIESEL", defect_category: "BRAKE_LINE_CORROSION", build_window_start: "2026-01-01", build_window_end: "2026-07-31", kits_per_unit: 1, total_kits: 5 }
              as: ComplianceOfficer
