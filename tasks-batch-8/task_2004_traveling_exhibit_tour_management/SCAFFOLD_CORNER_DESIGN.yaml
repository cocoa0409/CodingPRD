# =============================================================================
# §1.9 Scaffold Corner Design — task_2004_traveling_exhibit_tour_management
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: tour_creation_defaults_and_system_fields
        claim_type: creation_defaults
        grounds: [entities.Tour]
        distinguishing_aspect: "POST /tours with all required inputs returns 201, status=DRAFT, totals zeroed, version=1, server-minted id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tours"
              payload: { title: "Origami", exhibit_code: "ORIG-2026", crate_count: 3, declared_value_cents: 1000000, refurbishment_gap_days: 4 }
              as: TourManager
              captures: { tour_id: $.data.id }
          assert:
            - "Tour.status == DRAFT"
            - "Tour.total_billed_cents == 0 and total_collected_cents == 0 and total_waived_cents == 0"
            - "Tour.version == 1"
            - "Tour.id is a bare UUID (no type prefix)"

      - name: tour_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Tour.fields.exhibit_code]
        distinguishing_aspect: "Omitting exhibit_code yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tours"
              payload: { title: "Origami", crate_count: 3, declared_value_cents: 1000000, refurbishment_gap_days: 4 }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: stop_supervision_required_computed_field
        claim_type: computed_fields
        grounds: [entities.TourStop.fields.supervision_required]
        distinguishing_aspect: "Stop at a non-climate-controlled venue computes supervision_required=true regardless of any client-supplied value."
        test_recipe:
          setup:
            - "Tour in BOOKING, venue V climate_controlled=false"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Feathers", exhibit_code: "FEAT-2026", crate_count: 1, declared_value_cents: 500000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 500000 }
              as: TourManager
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Open Barn", city: "Marfa", climate_controlled: false, max_gallery_sqm: 300, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-03T00:00:00Z", close_date: "2026-10-03T00:00:00Z", teardown_end: "2026-10-06T00:00:00Z", projected_attendance: 500, expected_tour_version: "${tv}" }
              as: TourManager
              captures: { stop_id: $.data.id }
          assert:
            - "TourStop.${stop_id}.supervision_required == true  # climate_controlled=false forces it"

      - name: get_nonexistent_tour_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a random UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /tours/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: stop_window_malformed_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=10]"]
        distinguishing_aspect: "open_date before install_start violates install_start < open_date < close_date < teardown_end."
        test_recipe:
          setup: ["Tour BOOKING, venue created"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Clocks", exhibit_code: "CLK-2026", crate_count: 1, declared_value_cents: 100000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 100000 }
              as: TourManager
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Clock Hall", city: "A", climate_controlled: true, max_gallery_sqm: 100, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-10T00:00:00Z", open_date: "2026-09-05T00:00:00Z", close_date: "2026-10-03T00:00:00Z", teardown_end: "2026-10-06T00:00:00Z", projected_attendance: 100, expected_tour_version: "${tv}" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WINDOW_MALFORMED"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: tour_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.Tour]
        distinguishing_aspect: "Newly created tour starts in DRAFT; transitions requiring BOOKING are rejected until OPEN_BOOKING."
        test_recipe:
          setup: ["one tour created, no OPEN_BOOKING"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Quilts", exhibit_code: "QLT-2026", crate_count: 1, declared_value_cents: 100000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
          trigger:
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
          assert:
            - "Tour.${tour_id}.status == DRAFT"

      - name: closed_stop_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TourStop]
        distinguishing_aspect: "From CLOSED every further transition action is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Stop S fully closed via full lifecycle"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Bikes", exhibit_code: "BIKE-2026", crate_count: 1, declared_value_cents: 1000000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 1000000 }
              as: TourManager
              captures: { crate_id: $.data.id }
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Cycle Hall", city: "A", climate_controlled: true, max_gallery_sqm: 800, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-03T00:00:00Z", close_date: "2026-10-03T00:00:00Z", teardown_end: "2026-10-06T00:00:00Z", projected_attendance: 100, expected_tour_version: "${tv}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract"
              payload: { base_fee_cents: 100000, sponsorship_credit_cents: 0 }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SEND" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SIGN" }
              as: VenueRegistrar
            - call: "POST /tours/${tour_id}/certificates"
              payload: { tour_stop_id: "${stop_id}", insurer_name: "Axis", coverage_cents: 1000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: Insurer
            - call: "POST /tours/${tour_id}/shipments"
              payload: { origin_stop_id: null, destination_stop_id: "${stop_id}", depart_at: "2026-08-20T00:00:00Z", arrive_at: "2026-08-28T00:00:00Z", carrier_name: "Carrier X", crate_ids: ["${crate_id}"] }
              as: TourManager
              captures: { ship_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DISPATCH" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DEPART" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "RECEIVE" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports"
              payload: { crate_id: "${crate_id}", inspector_name: "Reg", phase: "UNPACK", surface_score: 95, structural_score: 95, seal_intact: true }
              as: Registrar
              captures: { rep_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${rep_id}/transition"
              payload: { action: "SUBMIT" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${rep_id}/transition"
              payload: { action: "ACCEPT" }
              as: TourManager
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "CLEAR" }
              as: Registrar
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "BEGIN_INSTALL" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "OPEN_TO_PUBLIC" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "BEGIN_TEARDOWN" }
              as: TourManager
            - call: "PATCH /tours/${tour_id}/stops/${stop_id}"
              payload: { actual_attendance: 100 }
              as: VenueRegistrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports"
              payload: { crate_id: "${crate_id}", inspector_name: "Reg", phase: "PACK", surface_score: 95, structural_score: 95, seal_intact: true }
              as: Registrar
              captures: { pack_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${pack_id}/transition"
              payload: { action: "SUBMIT" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${pack_id}/transition"
              payload: { action: "ACCEPT" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "CLOSE_STOP" }
              as: TourManager
          trigger:
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "REOPEN" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # CLOSED is terminal"

      - name: tentative_stop_cannot_begin_install
        claim_type: invalid_transition
        grounds: [state_machines.TourStop]
        distinguishing_aspect: "BEGIN_INSTALL from TENTATIVE (contract never signed) is rejected; only CONTRACTED permits it."
        test_recipe:
          setup: ["Stop TENTATIVE with no signed contract"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Kites", exhibit_code: "KITE-2026", crate_count: 1, declared_value_cents: 100000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 100000 }
              as: TourManager
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Kite Field", city: "A", climate_controlled: true, max_gallery_sqm: 100, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-03T00:00:00Z", close_date: "2026-10-03T00:00:00Z", teardown_end: "2026-10-06T00:00:00Z", projected_attendance: 100, expected_tour_version: "${tv}" }
              as: TourManager
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "BEGIN_INSTALL" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: close_stop_without_attendance_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=17]"]
        distinguishing_aspect: "CLOSE_STOP while actual_attendance is unset returns ERR_ATTENDANCE_MISSING."
        test_recipe:
          setup: ["Stop in TEARDOWN, PACK reports accepted, actual_attendance not reported"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Dolls", exhibit_code: "DOLL-2026", crate_count: 1, declared_value_cents: 1000000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 1000000 }
              as: TourManager
              captures: { crate_id: $.data.id }
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Doll House", city: "A", climate_controlled: true, max_gallery_sqm: 300, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-03T00:00:00Z", close_date: "2026-10-03T00:00:00Z", teardown_end: "2026-10-06T00:00:00Z", projected_attendance: 100, expected_tour_version: "${tv}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract"
              payload: { base_fee_cents: 100000, sponsorship_credit_cents: 0 }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SEND" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SIGN" }
              as: VenueRegistrar
            - call: "POST /tours/${tour_id}/certificates"
              payload: { tour_stop_id: "${stop_id}", insurer_name: "Axis", coverage_cents: 1000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: Insurer
            - call: "POST /tours/${tour_id}/shipments"
              payload: { origin_stop_id: null, destination_stop_id: "${stop_id}", depart_at: "2026-08-20T00:00:00Z", arrive_at: "2026-08-28T00:00:00Z", carrier_name: "Carrier X", crate_ids: ["${crate_id}"] }
              as: TourManager
              captures: { ship_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DISPATCH" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DEPART" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "RECEIVE" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports"
              payload: { crate_id: "${crate_id}", inspector_name: "Reg", phase: "UNPACK", surface_score: 95, structural_score: 95, seal_intact: true }
              as: Registrar
              captures: { rep_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${rep_id}/transition"
              payload: { action: "SUBMIT" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${rep_id}/transition"
              payload: { action: "ACCEPT" }
              as: TourManager
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "CLEAR" }
              as: Registrar
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "BEGIN_INSTALL" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "OPEN_TO_PUBLIC" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "BEGIN_TEARDOWN" }
              as: TourManager
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports"
              payload: { crate_id: "${crate_id}", inspector_name: "Reg", phase: "PACK", surface_score: 95, structural_score: 95, seal_intact: true }
              as: Registrar
              captures: { pack_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${pack_id}/transition"
              payload: { action: "SUBMIT" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${pack_id}/transition"
              payload: { action: "ACCEPT" }
              as: TourManager
          trigger:
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "CLOSE_STOP" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ATTENDANCE_MISSING"

      - name: retired_tour_is_terminal_for_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Tour]
        distinguishing_aspect: "OPEN_BOOKING on a RETIRED tour is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Tour retired from BOOKING with no stops"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Stamps", exhibit_code: "STMP-2026", crate_count: 1, declared_value_cents: 100000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 100000 }
              as: TourManager
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "RETIRE" }
              as: TourManager
          trigger:
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: route_sequence_assigned_by_install_start_then_created_at
        claim_type: correct_result
        grounds: [calculations.route_sequence]
        distinguishing_aspect: "Three stops booked out of chronological order receive seq values ordered by install_start, not by creation order."
        test_recipe:
          setup: ["Tour BOOKING; three venues"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Type", exhibit_code: "TYPE-2026", crate_count: 1, declared_value_cents: 100000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 100000 }
              as: TourManager
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "VA", city: "A", climate_controlled: true, max_gallery_sqm: 100, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { va: $.data.id }
            - call: "POST /venues"
              payload: { name: "VB", city: "B", climate_controlled: true, max_gallery_sqm: 100, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { vb: $.data.id }
            - call: "POST /venues"
              payload: { name: "VC", city: "C", climate_controlled: true, max_gallery_sqm: 100, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { vc: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv1: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${vc}", install_start: "2026-12-01T00:00:00Z", open_date: "2026-12-03T00:00:00Z", close_date: "2026-12-20T00:00:00Z", teardown_end: "2026-12-23T00:00:00Z", projected_attendance: 100, expected_tour_version: "${tv1}" }
              as: TourManager
              captures: { s_dec: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv2: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${va}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-03T00:00:00Z", close_date: "2026-09-20T00:00:00Z", teardown_end: "2026-09-23T00:00:00Z", projected_attendance: 100, expected_tour_version: "${tv2}" }
              as: TourManager
              captures: { s_sep: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv3: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${vb}", install_start: "2026-10-01T00:00:00Z", open_date: "2026-10-03T00:00:00Z", close_date: "2026-10-20T00:00:00Z", teardown_end: "2026-10-23T00:00:00Z", projected_attendance: 100, expected_tour_version: "${tv3}" }
              as: TourManager
              captures: { s_oct: $.data.id }
          trigger:
            - call: "GET /tours/${tour_id}/stops"
