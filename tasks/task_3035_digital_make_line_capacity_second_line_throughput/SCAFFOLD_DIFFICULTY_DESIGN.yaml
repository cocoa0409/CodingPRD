            - "after re-verify, Order.${order_a}.accuracy_status == VERIFIED (MISMATCHED -> VERIFIED cycle completed)"
            - "mark-ready now succeeds because accuracy_status == VERIFIED"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: ingredient_depletion_cascades_to_marketplace_suppression
        grounds:
          - calculations.suppression_cascade
          - state_machines.IngredientBatch
          - entities.MenuItem.fields.suppression_state
        distinguishing_aspect: |
          Depth-3 chain originating from ORDER ACCEPTANCE: accept consumes
          grams (link 1) -> Ingredient.on_hand_grams crosses below 0.5x par
          (link 2, caused by consumption) -> SuppressionEvent(scope=MARKETPLACE)
          created and MenuItem.suppression_state flips (link 3, caused by the
          threshold crossing). A subsequent MARKETPLACE order is then rejected.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z."
            - "Store S7, BOWL with chicken 120g @ par 5000. Chicken batch cooked with exactly 2560g (just above the 0.5x=2500 LOW line)."
            - "DASH channel active. One window."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "S7", name: "Store Seven", digital_line_capacity_per_interval: 50, instore_line_capacity_per_interval: 50, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 240, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 2560 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Chicken Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_bowl: $.data.id }
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
            - call: "POST /api/v1/marketplace-channels"
              payload: { channel_code: "DASH", markup_pct: 0.18, commission_pct: 0.22, active: true }
              as: PlatformAdmin
              captures: { chan_dash: $.data.id }
          trigger:
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "FIRST_PARTY_DIGITAL", lines: [{ menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: StoreManager
              captures: { order_first: $.data.id }
            - call: "GET /api/v1/menu-items/${item_bowl}"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "MARKETPLACE", marketplace_channel_id: "${chan_dash}", external_order_ref: "DASH-3001", lines: [{ menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: MarketplaceChannel
              as_user_id: "${chan_dash}"
              captures: { err_supp: $.data.error_id }
          assert:
            - "after the FIRST_PARTY order consumes 120g, Ingredient.${ing_chicken}.on_hand_grams == 2440 (< 2500 = 0.5x par)"
            - "Ingredient.${ing_chicken}.shortage_state == LOW"
            - "MenuItem.${item_bowl}.suppression_state == SUPPRESSED_MARKETPLACE"
            - "an ACTIVE SuppressionEvent with scope MARKETPLACE and cause SHORTAGE exists for item ${item_bowl}"
            - "the MARKETPLACE order is rejected 409 with error_id == ERR_ITEM_SUPPRESSED"
            - "a FIRST_PARTY_DIGITAL order for the same item is still accepted (suppression is channel-scoped)"

      - name: hold_time_expiry_cascades_through_waste_to_suppression
        grounds:
          - state_machines.IngredientBatch
          - calculations.suppression_cascade
          - entities.WasteEvent
        distinguishing_aspect: |
          Depth-3 chain originating from CLOCK ADVANCE (different trigger from
          order acceptance): clock crosses discard_at -> batch ACTIVE->EXPIRED
          and a HOLD_TIME_EXPIRED WasteEvent posts (link 1->2) ->
          Ingredient.on_hand_grams drops below 0.25x par (link 2->3) ->
          SuppressionEvent escalates to scope=ALL and MenuItem is SUPPRESSED_ALL,
          blocking even IN_STORE orders.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z."
            - "Store S8, BOWL with chicken par 5000, hold_time 60min."
            - "Chicken batch 1300g cooked at 09:00 (discard_at 10:00). After an order consumes 120g, 1180g remains; on expiry at 10:00 the on_hand collapses to 0 (< 1250 = 0.25x par) -> DEPLETED."
            - "One window."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "S8", name: "Store Eight", digital_line_capacity_per_interval: 50, instore_line_capacity_per_interval: 50, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 60, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 1300 }
              as: StoreManager
              captures: { batch_id: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Chicken Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_bowl: $.data.id }
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "IN_STORE", lines: [{ menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: LineWorker
              as_user_id: "lw-1"
              captures: { order_a: $.data.id }
          trigger:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:01:00Z" }
              as: PlatformAdmin
            - call: "GET /api/v1/batches/${batch_id}"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
            - call: "GET /api/v1/ingredients/${ing_chicken}"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
            - call: "GET /api/v1/menu-items/${item_bowl}"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "IN_STORE", lines: [{ menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: LineWorker
              as_user_id: "lw-1"
              captures: { err_all: $.data.error_id }
          assert:
            - "IngredientBatch.${batch_id}.status == EXPIRED"
            - "IngredientBatch.${batch_id}.discarded_grams == 1180"
            - "a WasteEvent with reason HOLD_TIME_EXPIRED and grams == 1180 exists"
            - "Ingredient.${ing_chicken}.on_hand_grams == 0 and shortage_state == DEPLETED"
            - "MenuItem.${item_bowl}.suppression_state == SUPPRESSED_ALL"
            - "the IN_STORE order is rejected 409 ERR_ITEM_SUPPRESSED (ALL scope blocks every channel)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety_on_mark_ready
        grounds:
          - validations.priority_5_state
          - validations.priority_6_business_safety
          - errors.ERR_INVALID_STATE
          - errors.ERR_ACCURACY_UNVERIFIED
        distinguishing_aspect: |
          Category pair state vs business_safety: a mark-ready on an order that
          is BOTH in the wrong fulfillment state (PLACED, never started) AND
          accuracy-unverified must surface the priority-5 state error
          ERR_INVALID_STATE, not the priority-6 safety error
          ERR_ACCURACY_UNVERIFIED.
