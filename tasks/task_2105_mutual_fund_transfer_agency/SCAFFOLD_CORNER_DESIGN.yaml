            - "GET /systematic-plans with account_id ${acc_oc} returns total_count 1"
            - "ShareholderAccount.${acc_oc}.version == ${acc_oc_v} + 1"

      - name: fresh_account_version_lets_the_new_plan_supersede_the_prior_one
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[plan-create-stale-account]"
          - state_machines.SystematicPlan.ACTIVE_to_TERMINATED
          - "endpoints[POST /systematic-plans]"
        distinguishing_aspect: "Re-reading the account and presenting the current version lets the create succeed, and the supersede side effect drives the prior plan of the same plan_type and source class from ACTIVE to TERMINATED while the new plan is ACTIVE."
        test_recipe:
          setup:
            - "One share class and one ACTIVE DIRECT/CA account carrying one ACTIVE SYSTEMATIC_INVESTMENT plan of 300.00."
            - "The account has been re-read so the caller holds its current version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
