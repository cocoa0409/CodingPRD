            - { call: "POST /health-documents/${doc2}/start-review", payload: {}, as: VeterinaryReviewer, as_user_id: "vet-01" }
          trigger:
            - { call: "POST /health-documents/${doc2}/reject", payload: { rejection_reason: "issuing laboratory not accredited" }, as: VeterinaryReviewer, as_user_id: "vet-02" }
          assert:
            - "HealthDocument.${doc2}.status == REJECTED"
            - "HealthDocument.${doc1}.status == VERIFIED"
            - "Reservation.${res1}.compliance_status == DEFICIENT"
            - "Reservation.${res1}.booking_status == CONFIRMED"
            - "AnimalRecord.${an1}.status == SCREENED"
            - "SegmentAssignment.${seg1}.status == RESERVED"

      - name: health_document_fourth_resubmission_rejected_at_revision_cap
        grounds:
          - state_machines.HealthDocument.REJECTED_to_SUBMITTED
          - entities.HealthDocument.fields.revision_count
          - validations.priority_18
          - errors.ERR_DOC_REVISION_LIMIT_REACHED
        distinguishing_aspect: |
          CYCLIC shape on HealthDocument, a different entity from the parallel Reservation dimensions: the
          SUBMITTED -> UNDER_REVIEW -> REJECTED -> SUBMITTED loop is traversed three times and the termination
          condition MAX_DOCUMENT_REVISIONS = 3 blocks the fourth entry into the loop.
        test_recipe:
          setup:
            - "SpeciesProfile DOG, ContainerModel K9-L, CHECKED reservation with one DRAFT AnimalRecord"
            - "One HEALTH_CERTIFICATE cycled through review and rejection three times, so revision_count is 3 and status is REJECTED"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Ito", contact_email: "ito@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "POST /health-documents", payload: { animal_record_id: "${an1}", document_type: "HEALTH_CERTIFICATE", issuing_country_code: "HK", issued_at: "2026-07-20T00:00:00Z", expires_at: "2026-10-01T00:00:00Z" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { doc1: $.data.id } }
            - { call: "POST /health-documents/${doc1}/start-review", payload: {}, as: VeterinaryReviewer, as_user_id: "vet-01" }
            - { call: "POST /health-documents/${doc1}/reject", payload: { rejection_reason: "missing veterinarian signature" }, as: VeterinaryReviewer, as_user_id: "vet-01" }
