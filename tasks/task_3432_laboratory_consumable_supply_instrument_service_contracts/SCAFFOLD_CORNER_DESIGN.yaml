        distinguishing_aspect: "The logical clock is PlatformAdmin-only: SupplyOps gets 403 ERR_FORBIDDEN and the clock does not move."
        test_recipe:
          setup: ["Empty database; clock at default 2026-09-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
