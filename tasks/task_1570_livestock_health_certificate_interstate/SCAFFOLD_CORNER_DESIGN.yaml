  # ===========================================================================
  # Section: state_machines (guide table 2)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: certificate_issue_transmit_acknowledge_happy_path
        claim_type: valid_transition
        grounds:
          - state_machines.Certificate.PENDING_REVIEW_to_ISSUED
          - state_machines.Certificate.ISSUED_to_TRANSMITTED
          - state_machines.TransmissionAudit.QUEUED_to_ACKNOWLEDGED
          - entities.TransmissionAudit.fields.payload_digest
        distinguishing_aspect: |
          Forward happy path: ISSUED stamps issued_at at the logical clock and
          valid_until exactly 30 days later; transmit appends a QUEUED audit
          WITHOUT changing certificate status; only the acknowledge bubbles the
          certificate to TRANSMITTED and stamps acknowledged_at.
        test_recipe:
          setup:
            - "Issued certificate (10 head CATTLE, NONE matrix) at clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch S1", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
              captures: { cvi: $.data.cvi_number, issued_at: $.data.issued_at, valid_until: $.data.valid_until }
          trigger:
            - call: "POST /api/certificates/${cert_id}/transmit"
              payload: { channel: "XML_GATEWAY" }
              as: StateVetOfficer
              captures: { audit_id: $.data.id, a_status: $.data.status, digest: $.data.payload_digest }
            - call: "GET /api/certificates/${cert_id}"
              as: StateAuditor
              captures: { mid_status: $.data.status }
            - call: "POST /api/transmission-audits/${audit_id}/acknowledge"
              as: StateVetOfficer
              captures: { ack_status: $.data.status, ack_at: $.data.acknowledged_at }
            - call: "GET /api/certificates/${cert_id}"
              as: StateAuditor
              captures: { end_status: $.data.status }
          assert:
            - "Certificate.${cert_id}.cvi_number == 'CVI-CA-000001' and issued_at == '2026-08-10T00:00:00Z'"
            - "Certificate.${cert_id}.valid_until == '2026-09-09T00:00:00Z' (issued_at + 30 days)"
            - "After transmit: TransmissionAudit.${audit_id}.status == 'QUEUED' with 64-char lowercase hex payload_digest, and certificate still 'ISSUED' (transmit is not a transition)"
            - "After acknowledge: audit status == 'ACKNOWLEDGED', acknowledged_at == '2026-08-10T00:00:00Z'"
            - "Certificate.${cert_id}.status == 'TRANSMITTED' (bubble-up from audit acknowledgement)"

      - name: certificate_submit_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Certificate.DRAFT_to_PENDING_REVIEW
          - errors[ERR_CERTIFICATE_NOT_SUBMITTABLE]
        distinguishing_aspect: |
          The same trigger twice: the second submit observes status
          PENDING_REVIEW (not DRAFT) and fails with
          ERR_CERTIFICATE_NOT_SUBMITTABLE; no duplicate review state is created.
        test_recipe:
          setup:
            - "DRAFT certificate (NONE matrix) at clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch S2", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { st1: $.data.status, fee1: $.data.provisional_fee_cents }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First submit: status == 'PENDING_REVIEW', provisional_fee_cents == 5000 (2500 + 150*10 + 1000 MONITORED surcharge)"
            - "Second submit: error_id == 'ERR_CERTIFICATE_NOT_SUBMITTABLE' (409); status remains 'PENDING_REVIEW'"

      - name: certificate_issue_reject_require_pending_review
        claim_type: invalid_transition
        grounds:
          - state_machines.Certificate.PENDING_REVIEW_to_ISSUED
          - state_machines.Certificate.PENDING_REVIEW_to_REJECTED
          - errors[ERR_CERTIFICATE_NOT_PENDING_REVIEW]
        distinguishing_aspect: |
          From DRAFT there is no issue or reject arc: both return
          ERR_CERTIFICATE_NOT_PENDING_REVIEW and the certificate stays DRAFT.
        test_recipe:
          setup:
            - "DRAFT certificate (NONE matrix) at clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch S3", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
              captures: { err_i: $.data.error_id }
            - call: "POST /api/certificates/${cert_id}/reject"
              payload: { reason_code: "INCOMPLETE" }
              as: StateVetOfficer
              captures: { err_r: $.data.error_id }
          assert:
            - "issue from DRAFT -> error_id == 'ERR_CERTIFICATE_NOT_PENDING_REVIEW' (409)"
            - "reject from DRAFT -> error_id == 'ERR_CERTIFICATE_NOT_PENDING_REVIEW' (409)"
            - "Certificate.${cert_id}.status remains 'DRAFT'; reject_reason remains null"

      - name: certificate_revise_requires_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Certificate.REJECTED_to_DRAFT
          - errors[ERR_CERTIFICATE_NOT_REVISABLE]
        distinguishing_aspect: |
          Revise exists only on the REJECTED arc: from DRAFT and from
          PENDING_REVIEW it returns ERR_CERTIFICATE_NOT_REVISABLE.
        test_recipe:
          setup:
            - "Two certificates (NONE matrix) at clock 2026-08-10: certA DRAFT, certB PENDING_REVIEW"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch S4", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 5, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_a: $.data.id }
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 5, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_b: $.data.id }
            - call: "POST /api/certificates/${cert_b}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
          trigger:
            - call: "POST /api/certificates/${cert_a}/revise"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err_a: $.data.error_id }
            - call: "POST /api/certificates/${cert_b}/revise"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err_b: $.data.error_id }
          assert:
            - "revise from DRAFT -> error_id == 'ERR_CERTIFICATE_NOT_REVISABLE' (409)"
            - "revise from PENDING_REVIEW -> error_id == 'ERR_CERTIFICATE_NOT_REVISABLE' (409)"

      - name: certificate_void_requires_issued_family
        claim_type: invalid_transition
        grounds:
