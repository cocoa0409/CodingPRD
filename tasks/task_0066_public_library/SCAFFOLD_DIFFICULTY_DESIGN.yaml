scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fine_provisional_vs_final_diverges_on_reference_category
        grounds:
          - calculations.fine_accrual_provisional
          - calculations.fine_accrual_final
          - state_machines.Loan.BORROWED_to_OVERDUE_CLOSED
          - entities.Fine.fields.accrued_cents
        distinguishing_aspect: |
          Calculation operates on the Fine/Loan entity domain (overdue-fine accounting). Provisional uses live
          now() against effective_due_at, while final uses the fixed returned_at. For the same loan read at
          T0+33d (provisional) and returned at T0+35d (final), the two algorithms return different cent values
          on identical inputs.
        test_recipe:
          setup:
            - "Create BookTitle with subject_category=REFERENCE (daily_rate=50 cents, cap=10000 cents)"
            - "Add one AVAILABLE Copy; register verified Reader; issue REGULAR Card (loan_duration_days=30)"
            - "POST /library/loans creating Loan with borrowed_at=T0, due_at=T0+30d"
          trigger:
            - "POST /library/_clock/advance to T0+33d"
            - "GET /library/loans/{id} (reads provisional)"
            - "POST /library/_clock/advance to T0+35d"
            - "POST /library/loans/{id}/return with returned_at=T0+35d (finalizes)"
          assert:
            - "GET at T0+33d returned provisional accrued_cents == 150 (3 days * 50)"
            - "After return, Fine.accrued_cents == 250 (5 days * 50)"
            - "Fine.accrued_cents != provisional snapshot value 150"

      - name: quota_strict_vs_chronological_diverges_on_card
        grounds:
          - calculations.borrowing_quota_remaining_strict
          - endpoints["GET /library/cards/{id}/quota"]
          - entities.Card.fields.max_loans
        distinguishing_aspect: |
          Calculation operates on the Card entity domain (borrowing-quota accounting, distinct from the
          Fine-domain dual variant above). Strict (forward-looking) subtracts active reservations; chronological
          subtracts only committed loans. For a REGULAR card (max_loans=5) with 3 active loans and 1 active
          reservation, strict=1 and chronological=2 from identical inputs.
        test_recipe:
          setup:
            - "Issue REGULAR Card (max_loans=5)"
            - "Create 3 active Loans (BORROWED) on this card via POST /library/loans (3 different AVAILABLE copies)"
            - "Create 1 active Reservation (QUEUED) on a fourth BookTitle that has no AVAILABLE copy"
          trigger:
            - "GET /library/cards/{id}/quota?mode=strict"
            - "GET /library/cards/{id}/quota?mode=chronological"
          assert:
            - "strict remaining == 1"
            - "chronological remaining == 2"
            - "strict remaining != chronological remaining on identical Card state"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fine_three_input_tiered_with_cap_mode_a
        grounds:
          - calculations.fine_accrual_final
          - entities.Fine.fields.daily_rate_cents
          - entities.Fine.fields.fine_cap_cents
          - entities.BookTitle.fields.subject_category
        distinguishing_aspect: |
          Mode (a) — formula with 3 inputs (days_overdue, daily_rate_cents derived from category, fine_cap_cents
          derived from category) and a non-linear interaction: the cap clamps the linear product. The cap branch
          depends on subject_category tier selection.
        test_recipe:
          setup:
            - "BookTitle subject_category=GENERAL (daily_rate=20 cents, cap=5000 cents)"
            - "Borrow a Copy; due_at=T0+30d"
          trigger:
            - "POST /library/_clock/advance by 280 days (well beyond cap point 5000/20=250 days)"
            - "POST /library/loans/{id}/return"
          assert:
            - "Fine.accrued_cents == 5000 (capped, NOT 280*20=5600)"
            - "min(280*20, 5000) == 5000 confirms cap branch was taken"

      - name: ill_settlement_round_per_leg_then_sum_mode_b
        grounds:
          - calculations.ill_settlement_total
          - entities.ILLRequest.fields.settlement_total_cents
          - entities.ILLRequest.fields.shipping_cost_cents
          - entities.ILLRequest.fields.handling_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold PINS: round per-leg then sum, NOT
          sum-then-round. With shipping=20, insurance fraction = 0.5 cents per leg; per-leg rounding produces
          2*ceil(321) = 642, while sum-then-round would produce 641. The two orders diverge by 1 cent at the
          .5 boundary.
        test_recipe:
          setup:
            - "Submit ILL request with shipping_cost_cents=20, handling_fee_cents=300 (constant)"
            - "Approve via availability event"
            - "Dispatch (Copy AVAILABLE -> IN_TRANSIT_ILL) and advance clock to satisfy agreed_loan_days"
            - "Emit ILL_DELIVERED then ILL_RETURN_INITIATED events"
          trigger:
            - "POST /library/ill-requests/{id}/return-received"
          assert:
            - "ILLRequest.settlement_total_cents == 642"
            - "ILLRequest.settlement_total_cents != 641 (sum-then-round would yield 641)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_renewal_cycle_borrowed_renewed_borrowed
        grounds:
          - state_machines.Loan.BORROWED_to_RENEWED
          - state_machines.Loan.RENEWED_to_BORROWED
          - entities.Loan.fields.renewals_used
          - entities.Card.fields.max_renewals
        distinguishing_aspect: |
          The Loan state machine contains a cycle BORROWED -> RENEWED -> BORROWED (renewals_used increments
          each cycle). This is a cyclic shape on the Loan entity — not a linear pipeline.
        test_recipe:
          setup:
            - "Issue STUDENT Card (max_renewals=3)"
            - "Borrow a Copy creating Loan in BORROWED"
          trigger:
            - "POST /library/loans/{id}/renew (cycle 1)"
            - "POST /library/loans/{id}/renew (cycle 2)"
          assert:
            - "After cycle 1: Loan.status normalizes to BORROWED, renewals_used == 1"
            - "After cycle 2: Loan.status normalizes to BORROWED, renewals_used == 2"
            - "Two distinct passes through RENEWED occurred (cycle present)"

      - name: acquisition_suggestion_branching_under_review_three_outcomes
        grounds:
          - state_machines.AcquisitionSuggestion.UNDER_REVIEW_to_ACQUIRED
          - state_machines.AcquisitionSuggestion.UNDER_REVIEW_to_DECLINED
          - state_machines.AcquisitionSuggestion.UNDER_REVIEW_to_DEFERRED
          - state_machines.AcquisitionSuggestion.DEFERRED_to_UNDER_REVIEW
        distinguishing_aspect: |
          The AcquisitionSuggestion state machine branches three ways from UNDER_REVIEW with divergent
          side-effect sets (ACQUIRED creates a BookTitle; DECLINED is terminal-no-create; DEFERRED loops
          back), making it a branching+cyclic shape on a different entity than Loan.
        test_recipe:
          setup:
            - "Create three identical AcquisitionSuggestions A, B, C; start-review each"
          trigger:
            - "POST /decide on A with decision=ACQUIRE plus new_book_title body"
            - "POST /decide on B with decision=DECLINE"
            - "POST /decide on C with decision=DEFER, then POST /start-review on C again"
          assert:
            - "A.status == ACQUIRED and A.decision_book_title_id resolves to a created BookTitle"
            - "B.status == DECLINED with no BookTitle created"
            - "C.status == UNDER_REVIEW again after deferred -> review cycle"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: loan_return_promotes_reservation_changes_copy_then_reader
        grounds:
          - state_machines.Loan.BORROWED_to_OVERDUE_CLOSED
          - state_machines.Copy.ON_LOAN_to_AVAILABLE
          - state_machines.Reservation.QUEUED_to_READY_FOR_PICKUP
          - calculations.reader_status_recompute
        distinguishing_aspect: |
          Depth-4 cascade originating from POST /library/loans/{id}/return (late return):
          (1) Loan -> OVERDUE_CLOSED, which itself causes (2) Fine creation/finalization, which itself causes
          (3) Reader.unpaid_fine_cents recompute via reader_status_recompute, which itself causes
          (4) Reader.status -> OVERDUE. Concurrently, the same Loan transition causes Copy -> AVAILABLE which
          (per cascade) promotes a QUEUED Reservation -> READY_FOR_PICKUP and Copy -> RESERVED. Each link is
          caused by the previous link, not by the original action directly. Trigger: late return.
        test_recipe:
          setup:
            - "Create Loan that is now overdue; create one QUEUED Reservation by another reader on the same BookTitle"
            - "Advance clock past due_at by 2 days"
          trigger:
            - "POST /library/loans/{id}/return with returned_at=now"
          assert:
            - "Loan.status == OVERDUE_CLOSED"
            - "Fine row exists with accrued_cents == 2 * daily_rate_cents and settlement_status == PENDING"
            - "Reader.unpaid_fine_cents == Fine.outstanding_cents (> 0)"
            - "Reader.status == OVERDUE (cascaded from non-zero unpaid_fine_cents)"
            - "Reservation.status == READY_FOR_PICKUP and its held_copy_id == this Copy.id"
            - "Copy.status == RESERVED (not AVAILABLE) because cascade promoted the reservation"

      - name: fine_payment_clears_reader_then_unblocks_new_loan
        grounds:
          - state_machines.Fine.PENDING_to_SETTLED
          - calculations.reader_status_recompute
          - validations[priority=12]
          - entities.Reader.fields.unpaid_fine_cents
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /library/fines/{id}/pay that fully clears the fine:
          (1) Fine.outstanding_cents reaches 0 which itself causes (2) Reader.unpaid_fine_cents recompute
          which itself causes (3) Reader.status -> NORMAL, which then allows a subsequent POST /library/loans
          that was previously rejected by ERR_UNPAID_FINE. Different trigger entity (Fine) than the loan-
          return cascade above, so the propagation pattern differs.
        test_recipe:
          setup:
            - "Reader has one outstanding Fine with outstanding_cents = 100 and Reader.status == OVERDUE"
            - "Attempt POST /library/loans on this reader's card -> expect ERR_UNPAID_FINE"
            - "Emit PAYMENT_CONFIRMED event for the fine with idempotency_key=K"
          trigger:
            - "POST /library/fines/{id}/pay with pay_cents=100 and idempotency_key=K"
            - "POST /library/loans (same card) again"
          assert:
            - "Fine.settlement_status == SETTLED"
            - "Reader.unpaid_fine_cents == 0"
            - "Reader.status == NORMAL"
            - "Second POST /library/loans succeeds with 201 (was blocked before)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_borrow_blocked
        grounds:
          - validations[priority=8]
          - validations[priority=12]
        distinguishing_aspect: |
          Error-category pair (state: ERR_COPY_NOT_AVAILABLE vs business_fiscal: ERR_UNPAID_FINE) tested by
          a single request that fails BOTH conditions simultaneously. Priority 8 (state) must win over
          priority 12 (business_fiscal) per the ordered list.
        test_recipe:
          setup:
            - "Reader has outstanding Fine (unpaid_fine_cents > 0)"
            - "Target Copy is currently ON_LOAN (status != AVAILABLE)"
          trigger:
            - "POST /library/loans with this reader's card and the ON_LOAN copy"
          assert:
            - "Response status == 409"
            - "data.error_id == 'ERR_COPY_NOT_AVAILABLE' (state wins over business_fiscal)"
            - "Response is NOT 'ERR_UNPAID_FINE'"

      - name: existence_vs_business_constraint_reservation_missing_copy_quota_exceeded
        grounds:
          - validations[priority=5]
          - validations[priority=13]
        distinguishing_aspect: |
          Different error-category pair from the first instance: existence (ERR_NOT_FOUND priority 5) vs
          business_constraint (ERR_QUOTA_EXCEEDED priority 13). When a non-existent book_title_id is supplied
          AND the card has already exhausted its quota, existence must win.
        test_recipe:
          setup:
            - "Issue TEMPORARY Card (max_loans=2); create 2 active Loans -> quota fully consumed"
          trigger:
            - "POST /library/reservations with book_title_id='non-existent-uuid' and this card_id"
          assert:
            - "Response status == 404"
            - "data.error_id == 'ERR_NOT_FOUND' (existence wins over business_constraint)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fine_cap_exact_equality_then_strictly_greater
        grounds:
          - calculations.fine_accrual_final
          - entities.Fine.fields.fine_cap_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on Fine.accrued_cents at the cap. Metric: cents. At exactly the cap-day
          count (days_overdue * rate == cap), the cap clamp produces the same value as the raw product; one
          day later, raw exceeds cap and clamp activates. Endpoint: POST /library/loans/{id}/return.
        test_recipe:
          setup:
            - "BookTitle subject_category=GENERAL (rate=20, cap=5000); 5000/20 = 250 cap-days"
            - "Borrow Copy; due_at = T0+30d"
          trigger:
            - "Case A: advance to T0+30d+250d, POST return -> read accrued"
            - "Case B (fresh loan): advance to T0+30d+251d, POST return -> read accrued"
          assert:
            - "Case A: Fine.accrued_cents == 5000 (exactly cap, raw==cap path)"
            - "Case B: Fine.accrued_cents == 5000 (clamped from 5020, > cap path)"
            - "Both values are equal to the cap but reach it via different branches (>= vs ==)"

      - name: renewal_limit_zero_count_to_limit_boundary
        grounds:
          - validations[priority=14]
          - entities.Card.fields.max_renewals
          - entities.Loan.fields.renewals_used
        distinguishing_aspect: |
          Different metric (renewal-count) on a different endpoint (POST /library/loans/{id}/renew). Tests
          the strict-less-than boundary: at renewals_used == max_renewals-1 a renew succeeds; at
          renewals_used == max_renewals a renew is rejected.
        test_recipe:
          setup:
            - "Issue TEMPORARY Card (max_renewals=0); borrow a Copy -> Loan.renewals_used == 0"
          trigger:
            - "POST /library/loans/{id}/renew on the TEMPORARY-card loan"
          assert:
            - "Response status == 409, data.error_id == 'ERR_RENEWAL_LIMIT_REACHED'"
            - "Loan.renewals_used remains 0 (the boundary 0 == max_renewals 0 rejected at the equality)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: loan_creation_blocked_by_reader_blacklisted
        grounds:
          - state_machines.Reader.NORMAL_to_BLACKLISTED
          - validations[priority=11]
          - state_machines.Loan
        distinguishing_aspect: |
          Loan transition (AVAILABLE -> ON_LOAN) depends on the Reader entity's state being NORMAL (not
          BLACKLISTED). Entity pair: Loan -> Reader.
        test_recipe:
          setup:
            - "Reader exists; POST /library/readers/{id}/blacklist -> Reader.status == BLACKLISTED, all cards FROZEN"
          trigger:
            - "POST /library/loans with the now-blacklisted reader's (originally active) card"
          assert:
            - "Response status == 409"
            - "data.error_id is one of 'ERR_READER_BLACKLISTED' or 'ERR_CARD_NOT_ACTIVE' depending on which check fires first"
            - "No Loan row was created (verified via subsequent GET listing)"

      - name: reservation_promotion_depends_on_copy_state
        grounds:
          - state_machines.Reservation.QUEUED_to_READY_FOR_PICKUP
          - state_machines.Copy.ON_LOAN_to_AVAILABLE
          - state_machines.Copy.AVAILABLE_to_RESERVED
        distinguishing_aspect: |
          Reservation.status transition QUEUED -> READY_FOR_PICKUP is gated by a Copy of the same BookTitle
          reaching AVAILABLE. Different entity pair from the first instance (Reservation -> Copy, not
          Loan -> Reader).
        test_recipe:
          setup:
            - "BookTitle with one Copy currently ON_LOAN; one QUEUED Reservation by another reader"
          trigger:
            - "POST /library/loans/{loan_id}/return for the on-loan copy"
          assert:
            - "Reservation.status == READY_FOR_PICKUP"
            - "Reservation.held_copy_id == that Copy.id"
            - "Copy.status == RESERVED (not AVAILABLE)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_hold_half_open_interval_on_copy
        grounds:
          - state_machines.Reservation.READY_FOR_PICKUP_to_FULFILLED
          - validations[priority=17]
          - entities.Reservation.fields.hold_expires_at
        distinguishing_aspect: |
          Half-open interval semantics on Copy occupation: [hold_starts_at, hold_expires_at). A pickup at
          exactly hold_expires_at is REJECTED with ERR_HOLD_EXPIRED (right boundary exclusive). Resource
          entity: Copy (via Reservation hold).
        test_recipe:
          setup:
            - "Reservation in READY_FOR_PICKUP with hold_expires_at = T0 + HOLD_PERIOD_HOURS"
            - "Advance clock to exactly hold_expires_at"
          trigger:
            - "POST /library/loans with reservation_id"
          assert:
            - "Response status == 409, data.error_id == 'ERR_HOLD_EXPIRED'"
            - "Confirms hold_expires_at is exclusive (>= now)"

      - name: ill_loan_period_closed_start_exclusive_end_on_ill_request
        grounds:
          - state_machines.ILLRequest.AT_PARTNER_to_RETURNED_TRANSIT
          - validations[priority=21]
          - entities.ILLRequest.fields.agreed_loan_days
        distinguishing_aspect: |
          Closed-start, exclusive-end interval semantics on the ILL loan-period window
          [in_transit_from + agreed_loan_days, +inf). A return-received called BEFORE in_transit_from +
          agreed_loan_days is rejected with ERR_ILL_LOAN_PERIOD_NOT_MET. Different geometric treatment from
          the half-open hold above, on a different resource entity (ILLRequest).
        test_recipe:
          setup:
            - "ILLRequest in AT_PARTNER state with agreed_loan_days=14; in_transit_from = T0"
            - "Advance clock to T0 + 13 days (less than agreed_loan_days)"
            - "Emit ILL_RETURN_INITIATED event"
          trigger:
            - "POST /library/ill-requests/{id}/return-received"
          assert:
            - "Response status == 409, data.error_id == 'ERR_ILL_LOAN_PERIOD_NOT_MET'"
            - "Confirms the period is left-inclusive (>=) at start: must reach in_transit_from + 14d"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fine_accrued_equals_waived_plus_paid_invariant_in_cents
        grounds:
          - state_machines.Fine.PENDING_to_SETTLED
          - entities.Fine.fields.accrued_cents
          - entities.Fine.fields.waived_cents
          - entities.Fine.fields.paid_cents
          - entities.Fine.fields.outstanding_cents
        distinguishing_aspect: |
          Conserved quantity #1: monetary cents on the Fine. Forward action = accrual (raises accrued_cents);
          compensating actions = waive + pay (raise waived_cents and paid_cents). Invariant:
          accrued_cents == waived_cents + paid_cents + outstanding_cents at every observable state, AND on
          SETTLED, outstanding_cents == 0 and accrued_cents == waived_cents + paid_cents EXACTLY.
        test_recipe:
          setup:
            - "Create overdue Loan; return it 10 days late on a REFERENCE-category copy (rate=50)"
            - "Fine.accrued_cents == 500 cents at PENDING"
            - "Emit PAYMENT_CONFIRMED event with idempotency_key=K1 for 300 cents"
          trigger:
            - "POST /library/fines/{id}/pay with pay_cents=300, idempotency_key=K1"
            - "POST /library/fines/{id}/waive with waive_cents=200, reason=HOLIDAY"
          assert:
            - "Final Fine.accrued_cents == 500"
            - "Final Fine.paid_cents == 300 and Final Fine.waived_cents == 200"
            - "Final Fine.outstanding_cents == 0"
            - "Invariant: 500 == 300 + 200 + 0 holds (settle leaves the conserved cents balanced)"
            - "settlement_status == SETTLED"

      - name: loan_count_history_invariant_on_reader
        grounds:
          - calculations.reader_status_recompute
          - entities.Reader.fields.active_loan_count
          - state_machines.Loan.BORROWED_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity #2 (different type from cents): integer LOAN-COUNT history. Invariant: for any
          Reader at any time, active_loan_count == count(Loans on this reader in non-terminal status). Forward
          action = POST /library/loans (increment); compensating action = POST /library/loans/{id}/return
          (decrement). After a borrow paired with a return, active_loan_count returns to its original value
          AND the total number of created Loan rows for the reader increases by exactly 1 (history conservation).
        test_recipe:
          setup:
            - "Reader in NORMAL with active_loan_count == 0 and 0 total historical Loans"
          trigger:
            - "POST /library/loans (creates Loan L1)"
            - "POST /library/loans/{L1}/return"
          assert:
            - "After borrow: Reader.active_loan_count == 1"
            - "After return: Reader.active_loan_count == 0 (back to original)"
            - "Total Loan rows for reader (via filter on reader_id) == 1 (history increased by exactly 1)"
            - "Invariant: net change in active_loan_count after forward+compensating pair == 0"
