            - { call: "POST /f2s/planting-agreements", payload: { program_year_id: "${yr}", offering_id: "${off}", committed_quantity: 200, harvest_start_week: 5, harvest_end_week: 10 }, as: DistrictProgramAdmin, captures: { agr: $.data.id } }
            - { call: "POST /f2s/planting-agreements/${agr}/sign", payload: {}, as: FarmManager, as_user_id: "${farm}", captures: { agr_v: $.data.version } }
          trigger:
            - { call: "POST /f2s/planting-agreements/${agr}/amendments", payload: { new_committed_quantity: 180, expected_agreement_version: "${agr_v}" }, as: FarmManager, as_user_id: "${farm}", captures: { amd: $.data.id } }
            - { call: "POST /f2s/agreement-amendments/${amd}/reject", payload: {}, as: DistrictProgramAdmin, as_user_id: "admin-1" }
