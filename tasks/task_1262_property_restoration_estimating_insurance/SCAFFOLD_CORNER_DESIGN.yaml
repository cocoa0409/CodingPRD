# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Property Restoration Estimating & Insurance Repair
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: claim_creation_snapshots_deductible_and_initial_state
        claim_type: creation_and_computed
        grounds: ["entities.Claim", "calculations.deductible_amount"]
        distinguishing_aspect: "POST /v1/claims returns 201 with status INTAKE, version 1, customer_id copied from the policy, and deductible_cents snapshotted (FLAT 100,000) at creation."
        test_recipe:
          setup: ["Carrier, customer, policy (FLAT deductible 100,000) exist"]
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-1", coverage_a_limit_cents: 100000000, deductible_type: "FLAT", flat_deductible_cents: 100000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
          trigger:
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id, cl_status: $.data.status, cl_ded: $.data.deductible_cents, cl_cust: $.data.customer_id, cl_v: $.data.version, cl_rcv: $.data.rcv_total_cents } }
          assert:
            - "captured cl_status == INTAKE and cl_v == 1"
            - "captured cl_ded == 100000  # FLAT snapshot"
            - "captured cl_cust == ${cust_id}  # copied from policy"
            - "captured cl_rcv == 0  # no APPROVED estimates yet"
      - name: claim_missing_policy_id_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required policy_id on claim creation yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["nothing needed"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/claims", payload: { cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"
      - name: invalid_enum_cause_of_loss_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "entities.Claim.fields.cause_of_loss"]
        distinguishing_aspect: "cause_of_loss outside {WATER, FIRE, WIND, MOLD, HAIL} is rejected with 400."
        test_recipe:
          setup: ["Carrier, customer, policy exist"]
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-1", coverage_a_limit_cents: 100000000, deductible_type: "FLAT", flat_deductible_cents: 100000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
          trigger:
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "ALIEN", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"
      - name: claim_get_with_unknown_id_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["nothing needed"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ContractorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_RESOURCE_NOT_FOUND"
      - name: system_fields_input_ignored_on_create
        claim_type: system_fields
        grounds: ["entities.Customer"]
        distinguishing_aspect: "Client-supplied id/version in a create body are ignored; the server mints its own id and version 1."
        test_recipe:
          setup: ["nothing needed"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com", id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version: 99 }, as: ContractorAdmin, captures: { got_id: $.data.id, got_v: $.data.version } }
          assert:
            - "captured got_id != 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2  # server-minted UUID"
            - "captured got_v == 1"
      - name: line_defaults_inherit_price_entry_depreciation
        claim_type: defaults
        grounds: ["entities.EstimateLine.fields.depreciation_pct", "entities.PriceListEntry.fields.default_depreciation_pct"]
        distinguishing_aspect: "A line created without depreciation_pct inherits the entry's default (0.20); extended_cents is computed server-side."
        test_recipe:
          setup: ["Claim FIRE in ASSESSING with DRAFT estimate; entry default_depreciation_pct 0.20 price 200c (estimate creation is legal in ASSESSING; submit is what requires ESTIMATING/NEGOTIATING)"]
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "ZeroTax Mutual", tax_rate: 0 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "GEN-1", trade: "GENERAL", kind: "LABOR", unit: "EA", unit_price_cents: 200, default_depreciation_pct: 0.20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Sam Owner", email: "sam@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-D2", coverage_a_limit_cents: 5000000, deductible_type: "FLAT", flat_deductible_cents: 50000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "FIRE", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin, captures: { cl_v: $.data.version } }
            - { call: "POST /v1/claims/${cl_id}/estimates", payload: { expected_claim_version: "${cl_v}" }, as: Estimator, captures: { est_id: $.data.id } }
          trigger:
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p1}", qty: 100 }, as: Estimator, captures: { l_dep: $.data.depreciation_pct, l_ext: $.data.extended_cents, l_ns: $.data.negotiation_status } }
          assert:
            - "captured l_dep == 0.20  # inherited from the entry default"
            - "captured l_ext == 20000  # round_half_up(100 * 200)"
            - "captured l_ns == PENDING  # initial line state"
      - name: photo_requires_exactly_one_parent_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "entities.Photo"]
        distinguishing_aspect: "A photo with neither inspection_id nor supplement_id — or with both — is rejected 400; tag SUPPLEMENT_EVIDENCE under an inspection parent is likewise rejected."
        test_recipe:
          setup: ["Claim WATER in ASSESSING with one SCHEDULED inspection"]
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-P1", coverage_a_limit_cents: 100000000, deductible_type: "FLAT", flat_deductible_cents: 100000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "INITIAL", assignee_id: "tech-1", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: FieldTechnician, captures: { insp_id: $.data.id } }
          trigger:
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", tag: "AREA", file_ref: "x.jpg", captured_at: "2026-05-02T09:05:00Z" }, as: FieldTechnician, captures: { err_none: $.data.error_id } }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", supplement_id: "${insp_id}", tag: "AREA", file_ref: "y.jpg", captured_at: "2026-05-02T09:06:00Z" }, as: FieldTechnician, captures: { err_both: $.data.error_id } }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "SUPPLEMENT_EVIDENCE", file_ref: "z.jpg", captured_at: "2026-05-02T09:07:00Z" }, as: FieldTechnician, captures: { err_tag: $.data.error_id } }
          assert:
            - "captured err_none == ERR_INVALID_REQUEST  # exactly one parent required"
            - "captured err_both == ERR_INVALID_REQUEST  # both parents set"
            - "captured err_tag == ERR_INVALID_REQUEST  # SUPPLEMENT_EVIDENCE requires a supplement parent"
      - name: ordinance_limit_min_of_pct_and_cap
        claim_type: computed_fields
        grounds: ["entities.Policy.fields.ordinance_limit_cents", "calculations.ordinance_law_waterfall"]
        distinguishing_aspect: "ordinance_limit_cents = min(round(pct x coverage_a), flat_cap): 250,000 when the percentage governs (cap 300,000); 100,000 when the cap governs."
        test_recipe:
          setup: ["Carrier and customer exist"]
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Sam Owner", email: "sam@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-M1", coverage_a_limit_cents: 2500000, deductible_type: "FLAT", flat_deductible_cents: 50000, recoverable_depreciation: true, ordinance_coverage_pct: 0.10, ordinance_flat_cap_cents: 300000, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { lim_pct: $.data.ordinance_limit_cents } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-M2", coverage_a_limit_cents: 2500000, deductible_type: "FLAT", flat_deductible_cents: 50000, recoverable_depreciation: true, ordinance_coverage_pct: 0.10, ordinance_flat_cap_cents: 100000, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { lim_cap: $.data.ordinance_limit_cents } }
          assert:
            - "captured lim_pct == 250000  # min(250,000, 300,000)"
            - "captured lim_cap == 100000  # min(250,000, 100,000): cap governs"

  - section: state_machines
    instances:
      - name: claim_skip_state_transition_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Claim.INTAKE_to_ASSESSING", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "INTAKE -> ESTIMATING is not a declared edge; the transition endpoint rejects with 409 ERR_INVALID_STATE_TRANSITION and the claim stays INTAKE."
        test_recipe:
          setup: ["Claim WATER exists in INTAKE"]
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-1", coverage_a_limit_cents: 100000000, deductible_type: "FLAT", flat_deductible_cents: 100000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
          trigger:
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ESTIMATING" }, as: ContractorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE_TRANSITION"
            - "Claim.${cl_id}.status still INTAKE on re-read"
      - name: withdrawn_claim_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Claim"]
        distinguishing_aspect: "After WITHDRAWN, every further transition is rejected; terminal states have no outgoing edges."
        test_recipe:
          setup: ["Claim WATER in INTAKE, then WITHDRAWN"]
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-1", coverage_a_limit_cents: 100000000, deductible_type: "FLAT", flat_deductible_cents: 100000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "WITHDRAWN" }, as: ContractorAdmin, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured st == WITHDRAWN"
            - "captured err == ERR_INVALID_STATE_TRANSITION"
      - name: estimate_approve_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Estimate.SUBMITTED_to_APPROVED"]
        distinguishing_aspect: "Adjuster approve against a DRAFT estimate (never submitted) fails with 409; approval requires SUBMITTED."
        test_recipe:
          setup: ["Claim WATER in ESTIMATING with DRAFT estimate holding one line"]
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "WTR-DEMO", trade: "DEMOLITION", kind: "LABOR", unit: "SF", unit_price_cents: 200, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-1", coverage_a_limit_cents: 100000000, deductible_type: "FLAT", flat_deductible_cents: 100000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ESTIMATING" }, as: ContractorAdmin, captures: { cl_v: $.data.version } }
            - { call: "POST /v1/claims/${cl_id}/estimates", payload: { expected_claim_version: "${cl_v}" }, as: Estimator, captures: { est_id: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p1}", qty: 100 }, as: Estimator }
          trigger:
            - { call: "POST /v1/estimates/${est_id}/approve", payload: {}, as: Adjuster, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE_TRANSITION"
            - "Estimate.${est_id}.status still DRAFT on re-read"
      - name: disposition_double_respond_returns_invalid_state
        claim_type: idempotency_rejection
        grounds: ["state_machines.LineDisposition.PENDING_to_ACCEPTED"]
        distinguishing_aspect: "Responding twice to the same disposition: the first ACCEPT succeeds (round auto-resolves, estimate auto-approves since all accepted), the second respond hits a terminal disposition and fails 409."
        test_recipe:
          setup: ["Claim FIRE NEGOTIATING: estimate submitted (line qty 1000 @ 200c), round with one disposition proposed_qty 900 OPEN"]
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "ZeroTax Mutual", tax_rate: 0 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "GEN-1", trade: "GENERAL", kind: "LABOR", unit: "EA", unit_price_cents: 200, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Sam Owner", email: "sam@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-1", coverage_a_limit_cents: 5000000, deductible_type: "FLAT", flat_deductible_cents: 50000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "FIRE", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "INITIAL", assignee_id: "tech-1", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: FieldTechnician, captures: { insp_id: $.data.id } }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "a.jpg", captured_at: "2026-05-02T09:05:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "b.jpg", captured_at: "2026-05-02T09:06:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "LOSS_OVERVIEW", file_ref: "c.jpg", captured_at: "2026-05-02T09:07:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/complete", payload: {}, as: FieldTechnician }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ESTIMATING" }, as: ContractorAdmin, captures: { cl_v: $.data.version } }
            - { call: "POST /v1/claims/${cl_id}/estimates", payload: { expected_claim_version: "${cl_v}" }, as: Estimator, captures: { est_id: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p1}", qty: 1000 }, as: Estimator, captures: { l1: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /v1/estimates/${est_id}/negotiation-rounds", payload: { dispositions: [ { estimate_line_id: "${l1}", proposed_qty: 900 } ] }, as: Adjuster, captures: { rd_id: $.data.id } }
            - { call: "GET /v1/negotiation-rounds/${rd_id}/dispositions", payload: {}, as: Adjuster, captures: { disp_id: $.data.0.id } }
          trigger:
            - { call: "POST /v1/dispositions/${disp_id}/respond", payload: { outcome: "ACCEPT" }, as: Estimator, captures: { d_st: $.data.status } }
            - { call: "POST /v1/dispositions/${disp_id}/respond", payload: { outcome: "ACCEPT" }, as: Estimator, captures: { err: $.data.error_id } }
            - { call: "GET /v1/estimates/${est_id}", payload: {}, as: Estimator, captures: { est_st: $.data.status, est_rcv: $.data.rcv_total_cents } }
          assert:
            - "captured d_st == ACCEPTED"
            - "captured err == ERR_INVALID_STATE_TRANSITION  # disposition already terminal"
            - "captured est_st == APPROVED and est_rcv == 180000  # all-accept auto-approval applied proposed qty 900"
      - name: inspection_complete_twice_returns_invalid_state
