scenario: "915. Correctional Healthcare (jail/prison): intake screening & chronic-care enrollment, sick-call & triage, medication (MAR/DOT) administration, off-site & specialty scheduling/transport, co-pay & grievance, continuity & release planning, utilization & audit, mortality/review"
domain_name: "correctional-healthcare"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Peer clinical entities (SickCallRequest, MedicationOrder, SpecialtyReferral, Grievance,
  # CopayCharge, LedgerEntry) all reference Inmate by FK and reference each other across
  # aggregate boundaries (Grievance -> CopayCharge -> SickCallRequest -> Inmate), so the
  # reference structure is a directed graph, not a containment tree.

  state_machine_shape: parallel
  # Inmate carries two independent status axes (custody_status x records_state); other
  # machines add cyclic (ChronicCareEnrollment, SpecialtyReferral, Grievance) and
  # branching fan-out (UtilizationReview, MedicationOrder) shapes.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
    - self_referential

  role_model: segregation_of_duties
  # The UtilizationReviewer who issued a DENY may not act as the PeerReviewer on the same
  # review; the Provider who wrote a MedicationOrder may not be the Nurse who records its
  # administration.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:

  - name: Inmate
    parent: null
    common_fields: true
    fields:
      - name: booking_number
        type: string
        source: input
        description: "Facility booking identifier, unique across all Inmate rows"
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Legal name of the patient"
      - name: facility_code
        type: string
        source: input
        description: "Code of the facility currently holding the inmate"
      - name: custody_level
        type: enum
        source: input
        description: "Security classification driving transport escort requirements"
        constraints: "one of MINIMUM, MEDIUM, MAXIMUM"
      - name: booked_at
        type: datetime
        source: input
        description: "Instant the inmate was booked into the current facility; anchors the receiving-screening clock"
      - name: admission_type
        type: enum
        source: input
        description: "How the inmate entered this facility; forks the intake clock calculation"
        default: "NEW_BOOKING"
        constraints: "one of NEW_BOOKING, INTER_FACILITY_TRANSFER"
      - name: prior_full_assessment_at
        type: datetime
        source: input
        description: "Completion instant of the full health assessment at the sending facility; null for NEW_BOOKING"
        default: null
      - name: custody_status
        type: enum
        source: system
        description: "Custody axis of the Inmate parallel state machine"
        default: "IN_CUSTODY"
        constraints: "one of IN_CUSTODY, RELEASED, DECEASED"
      - name: records_state
        type: enum
        source: system
        description: "Clinical-records axis of the Inmate parallel state machine; FROZEN blocks all clinical writes"
        default: "OPEN"
        constraints: "one of OPEN, FROZEN"
      - name: scheduled_release_date
        type: datetime
        source: input
        description: "Projected release instant used for release-planning lead-time checks"
        default: null
      - name: account_balance_cents
        type: integer
        source: computed
        description: "Signed trust-account balance; equals the sum of all LedgerEntry.amount_cents for this inmate (calculations.inmate_account_balance)"
        default: 0
      - name: indigent_flag
        type: boolean
        source: computed
        description: "Evaluated at READ time on every response that carries an Inmate: true when calculations.indigency_determination classifies the inmate INDIGENT against the ledger and the logical clock as they stand at that moment. Never persisted as an input."
        default: true
      - name: open_sick_call_count
        type: integer
        source: computed
        description: "READ-time projection: count of SickCallRequest rows for this inmate whose status is in {SUBMITTED, TRIAGED, SCHEDULED}. Never persisted, so it never advances Inmate.version"
        default: 0
      - name: no_show_count
        type: integer
        source: computed
        description: "READ-time projection: count of TransportOrder rows across all referrals of this inmate whose status is NO_SHOW. Never persisted, so it never advances Inmate.version"
        default: 0

  - name: IntakeScreening
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the screened patient"
      - name: screening_type
        type: enum
        source: input
        description: "Which intake instrument this row records"
        constraints: "one of RECEIVING, FULL_ASSESSMENT"
      - name: due_at
        type: datetime
        source: computed
        description: "Deadline computed by calculations.intake_screening_due_at at creation time; never recomputed afterwards"
      - name: completed_at
        type: datetime
        source: system
        description: "Instant the screening reached COMPLETED; null while PENDING/OVERDUE/REFUSED"
        default: null
      - name: status
        type: enum
        source: system
        description: "IntakeScreening state-machine state"
        default: "PENDING"
        constraints: "one of PENDING, COMPLETED, OVERDUE, REFUSED"
      - name: findings_code
        type: enum
        source: input
        description: "Screening disposition recorded at completion"
        default: null
        constraints: "one of NO_FINDINGS, CHRONIC_CONDITION, ACUTE_NEED, MENTAL_HEALTH_REFERRAL"
      - name: completed_late
        type: boolean
        source: computed
        description: "True when completed_at is strictly after due_at; false when completed_at <= due_at; null while not COMPLETED"
        default: false

  - name: ChronicCareEnrollment
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the enrolled patient"
      - name: condition_code
        type: enum
        source: input
        description: "Chronic disease being managed"
        constraints: "one of DIABETES, HYPERTENSION, ASTHMA, SEIZURE_DISORDER, HIV"
      - name: severity
        type: enum
        source: input
        description: "Clinical severity; maps to tier via calculations.chronic_tier_assignment"
        constraints: "one of MILD, MODERATE, SEVERE"
      - name: tier
        type: enum
        source: computed
        description: "Chronic-care tier derived from severity by calculations.chronic_tier_assignment"
        constraints: "one of TIER_1, TIER_2, TIER_3"
      - name: periodicity_days
        type: integer
        source: computed
        description: "Visit interval in days derived from tier by calculations.chronic_tier_assignment"
      - name: enrolled_at
        type: datetime
        source: system
        description: "Clock instant at which the enrollment last entered ACTIVE (set on create and on re-enrollment)"
      - name: last_visit_at
        type: datetime
        source: system
        description: "Clock instant of the most recent ChronicCareVisit with outcome COMPLETED; null until the first completed visit"
        default: null
      - name: next_due_date
        type: datetime
        source: computed
        description: "Next chronic visit deadline from calculations.chronic_care_next_due_date"
      - name: missed_visit_count
        type: integer
        source: computed
        description: "Count of ChronicCareVisit rows for this enrollment with outcome MISSED since the last COMPLETED visit; reset to 0 by a COMPLETED visit"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ChronicCareEnrollment state-machine state"
        default: "ACTIVE"
        constraints: "one of ACTIVE, LAPSED, RESOLVED"
      - name: escalated
        type: boolean
        source: computed
        description: "True once missed_visit_count reaches CHRONIC_MISSED_ESCALATION_COUNT and the tier has been escalated"
        default: false

  - name: ChronicCareVisit
    parent: ChronicCareEnrollment
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> ChronicCareEnrollment.id; the enrollment this visit belongs to"
      - name: recorded_at
        type: datetime
        source: system
        description: "Clock instant at which the visit outcome was recorded"
      - name: outcome
        type: enum
        source: input
        description: "Result of the scheduled chronic visit"
        constraints: "one of COMPLETED, MISSED, REFUSED"
      - name: due_at_snapshot
        type: datetime
        source: system
        description: "Copy of the enrollment's next_due_date at the instant the visit was recorded; immutable audit trail"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Nurse who recorded the visit"

  - name: SickCallRequest
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the requesting patient"
      - name: complaint_text
        type: string
        source: input
        description: "Free-text complaint written on the sick-call slip"
      - name: submitted_at
        type: datetime
        source: system
        description: "Clock instant the request was submitted; anchors the ORIGINAL SLA clock"
      - name: acuity
        type: enum
        source: system
        description: "Current triage acuity; null until first triage"
        default: null
        constraints: "one of EMERGENT, URGENT, ROUTINE"
      - name: triaged_at
        type: datetime
        source: system
        description: "Clock instant of the most recent triage or re-triage action"
        default: null
      - name: deadline_anchor_at
        type: datetime
        source: computed
        description: "Instant the current response deadline is measured from, pinned by calculations.sick_call_response_deadline"
        default: null
      - name: response_deadline_at
        type: datetime
        source: computed
        description: "Response deadline from calculations.sick_call_response_deadline; recomputed on every triage action"
        default: null
      - name: seen_at
        type: datetime
        source: system
        description: "Clock instant at which the request reached SEEN; frozen thereafter and used as the SLA resolution instant"
        default: null
      - name: sla_breached
        type: boolean
        source: computed
        description: "Read-time boolean from calculations.sick_call_sla_breach; never persisted as an input"
        default: false
      - name: retriage_count
        type: integer
        source: computed
        description: "Number of triage actions after the first one; capped by MAX_RETRIAGE_COUNT"
        default: 0
      - name: encounter_type
        type: enum
        source: input
        description: "Co-pay encounter classification requested for this sick call"
        default: "SICK_CALL"
        constraints: "one of SICK_CALL, NURSE_TRIAGE, PROVIDER_VISIT, DENTAL, MENTAL_HEALTH, EMERGENCY, COMMUNICABLE_DISEASE, CHRONIC_FOLLOWUP, INTAKE_SCREENING, STAFF_INITIATED"
      - name: status
        type: enum
        source: system
        description: "SickCallRequest state-machine state"
        default: "SUBMITTED"
        constraints: "one of SUBMITTED, TRIAGED, SCHEDULED, SEEN, CLOSED, CANCELLED"
      - name: copay_charge_id
        type: string
        source: system
        description: "FK -> CopayCharge.id; the charge posted when the encounter reached SEEN; null before that"
        default: null

  - name: MedicationOrder
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the patient the order is written for"
      - name: drug_name
        type: string
        source: input
        description: "Product name of the ordered medication"
      - name: drug_class
        type: enum
        source: input
        description: "Formulary class; drives bridge-supply sizing and KOP eligibility"
        constraints: "one of PSYCHOTROPIC, CONTROLLED, CHRONIC_MAINTENANCE, ACUTE_SHORT_COURSE"
      - name: route_mode
        type: enum
        source: input
        description: "Directly-Observed-Therapy vs Keep-On-Person administration routing"
        constraints: "one of DOT, KOP"
      - name: doses_per_day
        type: integer
        source: input
        description: "Scheduled administrations per day; used as the KOP expected-units multiplier"
        constraints: "integer between 1 and 4 inclusive"
      - name: start_date
        type: datetime
        source: input
        description: "First day the order is active, inclusive"
      - name: end_date
        type: datetime
        source: input
        description: "Last day the order is active, inclusive; must be >= start_date"
      - name: units_dispensed
        type: integer
        source: system
        description: "Total units handed to the inmate across KOP pill-count events; always 0 for DOT orders"
        default: 0
      - name: units_returned
        type: integer
        source: system
        description: "Total units recovered at KOP pill counts; always 0 for DOT orders"
        default: 0
      - name: consecutive_missed_count
        type: integer
        source: computed
        description: "Length of the current unbroken run of MedicationAdministration rows with outcome MISSED; reset to 0 by an ADMINISTERED outcome"
        default: 0
      - name: consecutive_refused_count
        type: integer
        source: computed
        description: "Length of the current unbroken run of MedicationAdministration rows with outcome REFUSED; reset to 0 by an ADMINISTERED outcome"
        default: 0
      - name: adherence_pct
        type: number
        source: computed
        description: "Adherence percentage from calculations.medication_adherence_pct; the DOT and KOP variants use different formulas"
        default: 0
      - name: escalated_to_prescriber
        type: boolean
        source: computed
        description: "True once either consecutive counter reached its escalation constant"
        default: false
      - name: forced_dot
        type: boolean
        source: computed
        description: "True when a diversion observation downgraded this order from KOP to DOT"
        default: false
      - name: status
        type: enum
        source: system
        description: "MedicationOrder state-machine state"
        default: "ACTIVE"
        constraints: "one of ACTIVE, HELD, DISCONTINUED, COMPLETED"
      - name: prescriber_user_id
        type: string
        source: system
        description: "X-User-ID of the Provider who created the order; segregation-of-duties comparison target"

  - name: MedicationAdministration
    parent: MedicationOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> MedicationOrder.id; the order this dose belongs to"
      - name: scheduled_at
        type: datetime
        source: input
        description: "Planned administration instant for this dose"
      - name: acted_at
        type: datetime
        source: system
        description: "Clock instant at which the nurse recorded the outcome; null while SCHEDULED"
        default: null
      - name: outcome
        type: enum
        source: system
        description: "MedicationAdministration state-machine state; SCHEDULED is the pre-action state"
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, ADMINISTERED, REFUSED, MISSED, VOIDED"
      - name: observed_swallow
        type: boolean
        source: input
        description: "Mouth-check result; required (non-null) when the parent order route_mode is DOT, forbidden when KOP"
        default: null
      - name: diversion_observed
        type: boolean
        source: input
        description: "Cheeking/diversion witnessed at this administration"
        default: false
      - name: timing_class
        type: enum
        source: computed
        description: "Dose-window classification from calculations.medication_dose_timing_class; null while SCHEDULED or when VOIDED"
        default: null
        constraints: "one of ON_TIME, LATE, MISSED_WINDOW"
      - name: administered_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Nurse who recorded the outcome"
        default: null

  - name: SpecialtyReferral
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the referred patient"
      - name: specialty
        type: enum
        source: input
        description: "Off-site specialty requested"
        constraints: "one of CARDIOLOGY, ONCOLOGY, ORTHOPEDICS, OPHTHALMOLOGY, DIALYSIS"
      - name: urgency
        type: enum
        source: input
        description: "Clinical urgency; drives UR turnaround and transport lead-time minimums"
        constraints: "one of EMERGENT, ROUTINE"
      - name: requested_at
        type: datetime
        source: system
        description: "Clock instant the referral was created"
      - name: status
        type: enum
        source: system
        description: "SpecialtyReferral state-machine state"
        default: "REQUESTED"
        constraints: "one of REQUESTED, PENDING_UR, AUTHORIZED, DENIED, SCHEDULED, COMPLETED, CANCELLED"
      - name: no_show_count
        type: integer
        source: computed
        description: "Count of TransportOrder rows for this referral whose status is NO_SHOW"
        default: 0
      - name: authorized_at
        type: datetime
        source: system
        description: "Clock instant the referral entered AUTHORIZED, set on the most recent authorization"
        default: null

  - name: UtilizationReview
    parent: SpecialtyReferral
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> SpecialtyReferral.id; the referral under review"
      - name: opened_at
        type: datetime
        source: system
        description: "Clock instant the review opened; anchors the turnaround SLA"
      - name: turnaround_deadline_at
        type: datetime
        source: computed
        description: "Decision deadline from calculations.ur_turnaround_deadline"
      - name: decision
        type: enum
        source: system
        description: "Most recent decision recorded on this review"
        default: null
        constraints: "one of APPROVE, DENY, DEFER"
      - name: decided_at
        type: datetime
        source: system
        description: "Clock instant of the most recent decision"
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the UtilizationReviewer who recorded the most recent decision"
        default: null
      - name: peer_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the PeerReviewer who resolved the denial; must differ from decided_by_user_id"
        default: null
      - name: defer_count
        type: integer
        source: computed
        description: "Number of DEFER decisions recorded on this review; capped by UR_MAX_DEFERRALS"
        default: 0
      - name: turnaround_breached
        type: boolean
        source: computed
        description: "Read-time boolean from calculations.ur_turnaround_breach"
        default: false
      - name: retrospective
        type: boolean
        source: input
        description: "True when the review is opened after the care was already delivered"
        default: false
      - name: status
        type: enum
        source: system
        description: "UtilizationReview state-machine state"
        default: "OPEN"
        constraints: "one of OPEN, APPROVED, DENIED, DEFERRED, PEER_REVIEW, OVERTURNED, UPHELD"

  - name: TransportOrder
    parent: SpecialtyReferral
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> SpecialtyReferral.id; the authorized referral this trip serves"
      - name: appointment_at
        type: datetime
        source: input
        description: "Off-site appointment instant; lead-time minimum is measured from the clock at creation to this instant"
      - name: required_escort_level
        type: enum
        source: computed
        description: "Escort level derived from the inmate custody_level by calculations.transport_escort_requirement"
        constraints: "one of ESCORT_1, ESCORT_2, ESCORT_2_ARMED"
      - name: assigned_escort_level
        type: enum
        source: system
        description: "Escort level actually assigned by the CustodyOfficer"
        default: null
        constraints: "one of ESCORT_1, ESCORT_2, ESCORT_2_ARMED"
      - name: lead_minutes
        type: integer
        source: computed
        description: "Whole minutes between the clock instant at creation and appointment_at, floor-truncated"
      - name: status
        type: enum
        source: system
        description: "TransportOrder state-machine state"
        default: "DRAFT"
        constraints: "one of DRAFT, ESCORT_ASSIGNED, DISPATCHED, COMPLETED, NO_SHOW, CANCELLED"
      - name: cancel_reason
        type: enum
        source: input
        description: "Reason recorded when the trip is cancelled"
        default: null
        constraints: "one of FACILITY_LOCKDOWN, VENDOR_CANCELLED, ESCORT_UNAVAILABLE, CLINICAL_CHANGE"

  - name: CopayCharge
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the charged patient"
      - name: encounter_type
        type: enum
        source: input
        description: "Encounter classification driving the co-pay schedule and the exemption test"
        constraints: "one of SICK_CALL, NURSE_TRIAGE, PROVIDER_VISIT, DENTAL, SPECIALTY_OFFSITE, MENTAL_HEALTH, EMERGENCY, COMMUNICABLE_DISEASE, CHRONIC_FOLLOWUP, INTAKE_SCREENING, STAFF_INITIATED"
      - name: source_sick_call_id
        type: string
        source: input
        description: "FK -> SickCallRequest.id; the encounter that generated the charge, null for charges posted outside sick call"
        default: null
      - name: scheduled_amount_cents
        type: integer
        source: computed
        description: "Undiscounted schedule amount for encounter_type before the exemption and indigency forks"
      - name: amount_cents
        type: integer
        source: computed
        description: "Amount actually posted, from calculations.copay_amount (FUNDED and INDIGENT variants)"
      - name: charge_variant
        type: enum
        source: computed
        description: "Which branch of calculations.copay_amount produced amount_cents"
        constraints: "one of EXEMPT, FUNDED, INDIGENT"
      - name: indigency_snapshot
        type: boolean
        source: computed
        description: "Value of calculations.indigency_determination evaluated on the balance as it stood immediately BEFORE this charge posted"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the charge"
        default: "POSTED"
        constraints: "one of POSTED, WAIVED, REVERSED, DEBT_LIEN"
      - name: reversal_grievance_id
        type: string
        source: system
        description: "FK -> Grievance.id; the grievance whose remedy reversed this charge, null otherwise"
        default: null

  - name: LedgerEntry
    parent: Inmate
    common_fields: false
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the account this entry posts against"
      - name: entry_type
        type: enum
        source: input
        description: "Kind of money movement"
        constraints: "one of DEPOSIT, CHARGE, LIEN, REVERSAL"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed amount; DEPOSIT is positive, CHARGE and LIEN are negative, REVERSAL carries the sign that undoes its source entry"
      - name: balance_after_cents
        type: integer
        source: computed
        description: "Running balance immediately after this entry posted; equals the previous entry balance_after_cents plus amount_cents, or amount_cents for the first entry"
      - name: source_copay_charge_id
        type: string
        source: system
        description: "FK -> CopayCharge.id; the charge that produced this entry, null for operator deposits"
        default: null
      - name: memo
        type: string
        source: input
        description: "Free-text audit note"
        default: ""

  - name: Grievance
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the grievant"
      - name: subject_copay_charge_id
        type: string
        source: input
        description: "FK -> CopayCharge.id; the billing item under grievance, null for non-billing grievances"
        default: null
      - name: grievance_text
        type: string
        source: input
        description: "Statement of the grievance"
      - name: grieved_event_at
        type: datetime
        source: input
        description: "Instant of the event being grieved; anchors the INFORMAL filing window"
      - name: stage
        type: enum
        source: system
        description: "Current rung of the grievance ladder"
        default: "INFORMAL"
        constraints: "one of INFORMAL, FORMAL, APPEAL"
      - name: stage_entered_at
        type: datetime
        source: system
        description: "Clock instant the grievance entered its current stage; anchors the response window"
      - name: response_due_at
        type: datetime
        source: computed
        description: "Response deadline from calculations.grievance_response_due"
      - name: response_breached
        type: boolean
        source: computed
        description: "True when the current clock instant is strictly after response_due_at and the stage is still awaiting a decision"
        default: false
      - name: remand_count
        type: integer
        source: computed
        description: "Number of APPEAL to FORMAL remands recorded; capped by GRIEVANCE_MAX_REMANDS"
        default: 0
      - name: outcome
        type: enum
        source: system
        description: "Terminal disposition of the grievance"
        default: null
        constraints: "one of GRANTED, DENIED, WITHDRAWN"
      - name: status
        type: enum
        source: system
        description: "Grievance state-machine state"
        default: "FILED"
        constraints: "one of FILED, UNDER_REVIEW, DECIDED, REMANDED, CLOSED, WITHDRAWN"

  - name: ReleasePlan
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the releasing patient"
      - name: release_type
        type: enum
        source: input
        description: "Forks bridge-supply sizing in calculations.bridge_supply_days"
        constraints: "one of SCHEDULED, UNEXPECTED"
      - name: planned_release_at
        type: datetime
        source: input
        description: "Instant the inmate is expected to leave custody"
      - name: bridge_supply_total_days
        type: integer
        source: computed
        description: "Sum over eligible MedicationOrder rows of the per-order bridge days from calculations.bridge_supply_days"
        default: 0
      - name: bridge_supply_lines
        type: array
        source: computed
        description: "One object per eligible MedicationOrder: order_id, drug_class, days. Ordered by MedicationOrder.created_at ascending"
        default: []
      - name: reentry_referral_required
        type: boolean
        source: computed
        description: "True when the inmate has at least one ACTIVE ChronicCareEnrollment whose tier is in REENTRY_REFERRAL_REQUIRED_TIERS"
        default: false
      - name: records_packet_ready
        type: boolean
        source: system
        description: "True once the records-transfer packet has been generated"
        default: false
      - name: status
        type: enum
        source: system
        description: "ReleasePlan lifecycle"
        default: "DRAFT"
        constraints: "one of DRAFT, FINALIZED, EXECUTED, VOIDED"

  - name: MortalityReview
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the decedent"
      - name: death_at
        type: datetime
        source: input
        description: "Recorded instant of death; anchors the statutory review deadline"
      - name: manner
        type: enum
        source: input
        description: "Manner of death recorded at the death event"
        constraints: "one of NATURAL, ACCIDENT, SUICIDE, HOMICIDE, UNDETERMINED"
      - name: due_at
        type: datetime
        source: computed
        description: "Statutory completion deadline from calculations.mortality_review_due_at"
      - name: corrective_action_count
        type: integer
        source: computed
        description: "Number of corrective actions attached to this review"
        default: 0
      - name: corrective_actions
        type: array
        source: system
        description: "Ordered list of corrective-action objects with action_text and recorded_at, sorted by recorded_at ascending"
        default: []
      - name: closed_at
        type: datetime
        source: system
        description: "Clock instant the review closed"
        default: null
      - name: closed_late
        type: boolean
        source: computed
        description: "True when closed_at is strictly after due_at; false when closed_at <= due_at"
        default: false
      - name: status
        type: enum
        source: system
        description: "MortalityReview state-machine state"
        default: "OPEN"
        constraints: "one of OPEN, CORRECTIVE_ACTIONS_ISSUED, CLOSED"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
#
# Ten machines. Non-linear shapes:
#   * Inmate                 - PARALLEL: custody_status and records_state are two
#                              independent axes on the same row.
#   * ChronicCareEnrollment  - CYCLIC: ACTIVE -> LAPSED -> ACTIVE re-enrollment loop.
#   * SickCallRequest        - CYCLIC: TRIAGED -> TRIAGED re-triage self-loop.
#   * MedicationOrder        - BRANCHING with revert: ACTIVE -> {HELD, DISCONTINUED,
#                              COMPLETED} and HELD -> ACTIVE.
#   * MedicationAdministration - BRANCHING 4-way terminal fan-out with divergent
#                              side-effect sets per branch.
#   * SpecialtyReferral      - CYCLIC: SCHEDULED -> AUTHORIZED on transport cancellation.
#   * UtilizationReview      - BRANCHING 3-way fan-out {APPROVED, DENIED, DEFERRED}
#                              plus DEFERRED -> OPEN cycle and DENIED -> PEER_REVIEW
#                              -> {OVERTURNED, UPHELD} second fan-out.
#   * Grievance              - CYCLIC: DECIDED -> FILED stage escalation and
#                              REMANDED -> UNDER_REVIEW remand loop.
# ---------------------------------------------------------------------------

state_machines:

  - entity: Inmate
    initial_state: IN_CUSTODY
    terminal_states: [RELEASED, DECEASED]
    note: |
      PARALLEL machine. Axis A is `custody_status` (IN_CUSTODY -> RELEASED | DECEASED).
      Axis B is `records_state` (OPEN <-> FROZEN). The two axes
      advance independently: a litigation hold can FREEZE records while custody_status
      is still IN_CUSTODY, and an inmate can be RELEASED while records_state stays OPEN.
      The only coupling is one-directional: entering custody_status DECEASED forces
      records_state FROZEN, and while records_state is FROZEN the unfreeze transition is
      refused for a DECEASED inmate.
    transitions:
      - from: IN_CUSTODY
        to: RELEASED
        trigger: "POST /inmates/{id}/release"
        actor: HealthServicesAdmin
        preconditions:
          - "custody_status == IN_CUSTODY"
          - "There exists a ReleasePlan for this inmate with status == FINALIZED"
        side_effects:
          - "CASCADE-B L1: that FINALIZED ReleasePlan transitions to EXECUTED and records_packet_ready is set true."
          - "CASCADE-B L2: because the plan became EXECUTED, every MedicationOrder for this inmate with status in {ACTIVE, HELD} transitions to COMPLETED."
          - "CASCADE-B L3: because those orders became COMPLETED, every MedicationAdministration under them whose outcome is SCHEDULED transitions to VOIDED."
          - "Every ChronicCareEnrollment for this inmate with status == ACTIVE transitions to RESOLVED."
          - "Every SickCallRequest for this inmate with status in {SUBMITTED, TRIAGED, SCHEDULED} transitions to CANCELLED."
          - "increments Inmate.version by 1"

      - from: IN_CUSTODY
        to: DECEASED
        trigger: "POST /inmates/{id}/death-event"
        actor: HealthServicesAdmin
        preconditions:
          - "custody_status == IN_CUSTODY"
          - "No MortalityReview row already exists for this inmate"
        side_effects:
          - "CASCADE-A L1: custody_status becomes DECEASED."
          - "CASCADE-A L2: because custody_status became DECEASED, records_state flips OPEN -> FROZEN on the same row."
          - "CASCADE-A L3: because records_state became FROZEN, every MedicationOrder for this inmate with status in {ACTIVE, HELD} transitions to DISCONTINUED."
          - "CASCADE-A L4: because each of those orders became DISCONTINUED, every MedicationAdministration under it whose outcome is SCHEDULED transitions to VOIDED."
          - "CASCADE-A L5: because those administrations became VOIDED, each affected MedicationOrder has consecutive_missed_count and consecutive_refused_count reset to 0, escalated_to_prescriber set false, and adherence_pct recomputed over the surviving denominator (VOIDED rows excluded)."
          - "Creates one MortalityReview with status OPEN, death_at and manner from the request body, and due_at from calculations.mortality_review_due_at."
          - "Every SickCallRequest for this inmate with status in {SUBMITTED, TRIAGED, SCHEDULED} transitions to CANCELLED."
          - "Every SpecialtyReferral for this inmate with status in {REQUESTED, PENDING_UR, AUTHORIZED, SCHEDULED} transitions to CANCELLED, and every TransportOrder under each of those referrals with status in {DRAFT, ESCORT_ASSIGNED, DISPATCHED} transitions to CANCELLED with cancel_reason CLINICAL_CHANGE."
          - "Every ChronicCareEnrollment for this inmate with status in {ACTIVE, LAPSED} transitions to RESOLVED."
          - "Every ReleasePlan for this inmate with status in {DRAFT, FINALIZED} transitions to VOIDED."
          - "increments Inmate.version by 1"

      - from: OPEN
        to: FROZEN
        trigger: "POST /inmates/{id}/records-freeze"
        actor: HealthServicesAdmin
        preconditions:
          - "records_state == OPEN"
        side_effects:
          - "Sets records_state to FROZEN. custody_status is NOT changed by this transition - this is the axis-independence proof."
          - "increments Inmate.version by 1"
        note: "Litigation-hold freeze. Legal on an IN_CUSTODY inmate."

      - from: FROZEN
        to: OPEN
        trigger: "POST /inmates/{id}/records-unfreeze"
        actor: HealthServicesAdmin
        preconditions:
          - "records_state == FROZEN"
          - "custody_status != DECEASED"
        side_effects:
          - "Sets records_state to OPEN. custody_status is NOT changed by this transition."
          - "increments Inmate.version by 1"
        note: "A death-induced freeze is permanent: the custody_status != DECEASED precondition makes it unrecoverable."

  - entity: IntakeScreening
    initial_state: PENDING
    terminal_states: [COMPLETED, REFUSED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /intake-screenings/{id}/disposition with disposition COMPLETED"
        actor: Nurse
        preconditions:
          - "status == PENDING or status == OVERDUE"
          - "Inmate.records_state == OPEN"
          - "findings_code is present in the request body"
        side_effects:
          - "Sets completed_at to the current clock instant."
          - "Sets completed_late true when completed_at is strictly after due_at, false when completed_at <= due_at."
          - "When screening_type == FULL_ASSESSMENT, sets Inmate.prior_full_assessment_at to completed_at."
          - "increments IntakeScreening.version by 1"

      - from: PENDING
        to: REFUSED
        trigger: "POST /intake-screenings/{id}/disposition with disposition REFUSED"
        actor: Nurse
        preconditions:
          - "status == PENDING or status == OVERDUE"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Sets completed_at to null and completed_late to false."
          - "increments IntakeScreening.version by 1"

      - from: PENDING
        to: OVERDUE
        trigger: "system sweep on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "status == PENDING"
          - "due_at is strictly before the new clock instant (due_at == clock is NOT overdue)"
        side_effects:
          - "Sets status to OVERDUE. due_at is never recomputed."
          - "increments IntakeScreening.version by 1"

  - entity: ChronicCareEnrollment
    initial_state: ACTIVE
    terminal_states: [RESOLVED]
    note: "CYCLIC: ACTIVE -> LAPSED -> ACTIVE. Re-enrollment re-anchors the periodicity clock."
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system sweep on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "next_due_date plus CHRONIC_LAPSE_GRACE_DAYS days is strictly before the new clock instant (equality is NOT lapsed)"
        side_effects:
          - "Sets status to LAPSED."
          - "increments ChronicCareEnrollment.version by 1"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /chronic-care-enrollments/{id}/re-enroll"
        actor: Provider
        preconditions:
          - "status == LAPSED"
          - "Inmate.custody_status == IN_CUSTODY"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Sets enrolled_at to the current clock instant and last_visit_at to null."
          - "Sets missed_visit_count to 0 and escalated to false."
          - "Recomputes tier and periodicity_days from the request body severity via calculations.chronic_tier_assignment."
          - "Recomputes next_due_date via calculations.chronic_care_next_due_date."
          - "increments ChronicCareEnrollment.version by 1"

      - from: ACTIVE
        to: RESOLVED
        trigger: "system cascade from POST /inmates/{id}/release or POST /inmates/{id}/death-event"
        actor: system
        preconditions:
          - "status in {ACTIVE, LAPSED}"
          - "The owning Inmate just transitioned to RELEASED or DECEASED"
        side_effects:
          - "Sets next_due_date to null."
          - "increments ChronicCareEnrollment.version by 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /chronic-care-enrollments/{id}/visits"
        actor: Nurse
        preconditions:
          - "status == ACTIVE"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Creates one ChronicCareVisit with due_at_snapshot copied from the enrollment's current next_due_date."
          - "When outcome == COMPLETED: sets last_visit_at to the current clock instant, sets missed_visit_count to 0, and recomputes next_due_date via calculations.chronic_care_next_due_date."
          - "When outcome == MISSED: increments missed_visit_count by 1; next_due_date is NOT moved."
          - "When outcome == MISSED and the incremented missed_visit_count is >= CHRONIC_MISSED_ESCALATION_COUNT and escalated is false: escalates tier one step toward TIER_1 (TIER_3 -> TIER_2 -> TIER_1, TIER_1 stays TIER_1), sets periodicity_days from the new tier, sets escalated true, and recomputes next_due_date from last_visit_at (or enrolled_at when last_visit_at is null) plus the new periodicity_days."
          - "When outcome == REFUSED: no counter changes and next_due_date is NOT moved."
          - "increments ChronicCareEnrollment.version by 1"

  - entity: SickCallRequest
    initial_state: SUBMITTED
    terminal_states: [CLOSED, CANCELLED]
    note: "CYCLIC: TRIAGED -> TRIAGED self-loop for re-triage, bounded by MAX_RETRIAGE_COUNT."
    transitions:
      - from: SUBMITTED
        to: TRIAGED
        trigger: "POST /sick-call-requests/{id}/triage"
        actor: Nurse
        preconditions:
          - "status == SUBMITTED"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Sets acuity from the request body and triaged_at to the current clock instant."
          - "Sets deadline_anchor_at to submitted_at and response_deadline_at via calculations.sick_call_response_deadline (INITIAL variant)."
          - "retriage_count stays 0."
          - "increments SickCallRequest.version by 1"

      - from: TRIAGED
        to: TRIAGED
        trigger: "POST /sick-call-requests/{id}/triage"
        actor: Nurse
        preconditions:
          - "status == TRIAGED"
          - "Inmate.records_state == OPEN"
          - "retriage_count is strictly less than MAX_RETRIAGE_COUNT"
          - "The request body acuity differs from the stored acuity"
        side_effects:
          - "Increments retriage_count by 1 and sets triaged_at to the current clock instant."
          - "Sets acuity to the request body value."
          - "Recomputes deadline_anchor_at and response_deadline_at via calculations.sick_call_response_deadline (UPGRADE or DOWNGRADE variant, selected by the direction of the acuity change)."
          - "increments SickCallRequest.version by 1"

      - from: TRIAGED
        to: SCHEDULED
        trigger: "POST /sick-call-requests/{id}/schedule"
        actor: Nurse
        preconditions:
          - "status == TRIAGED"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Records the encounter slot; response_deadline_at is NOT recomputed."
          - "increments SickCallRequest.version by 1"

      - from: SCHEDULED
        to: SEEN
        trigger: "POST /sick-call-requests/{id}/see"
        actor: Provider
        preconditions:
          - "status == SCHEDULED"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Creates one CopayCharge with encounter_type copied from the SickCallRequest, source_sick_call_id set to this request, amount_cents and charge_variant from calculations.copay_amount, and indigency_snapshot from calculations.indigency_determination evaluated BEFORE this charge posts."
          - "Sets copay_charge_id to the new charge id."
          - "When charge_variant == FUNDED: appends one LedgerEntry with entry_type CHARGE and amount_cents equal to the negated charge amount, then recomputes Inmate.account_balance_cents and re-derives Inmate.indigent_flag."
          - "When charge_variant == INDIGENT: appends one LedgerEntry with entry_type LIEN and amount_cents equal to the negated charge amount, then recomputes Inmate.account_balance_cents and re-derives Inmate.indigent_flag."
          - "When charge_variant == EXEMPT: the CopayCharge is created with status WAIVED and amount_cents 0 and NO LedgerEntry is appended."
          - "increments SickCallRequest.version by 1"

      - from: SEEN
        to: CLOSED
        trigger: "POST /sick-call-requests/{id}/close"
        actor: Provider
        preconditions:
          - "status == SEEN"
        side_effects:
          - "increments SickCallRequest.version by 1"

      - from: SUBMITTED
        to: CANCELLED
        trigger: "system cascade from POST /inmates/{id}/release or POST /inmates/{id}/death-event"
        actor: system
        preconditions:
          - "status in {SUBMITTED, TRIAGED, SCHEDULED}"
        side_effects:
          - "No CopayCharge is created."
          - "increments SickCallRequest.version by 1"
        note: "Same transition definition applies from TRIAGED and from SCHEDULED."

  - entity: MedicationOrder
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED, COMPLETED]
    note: "BRANCHING with revert: ACTIVE fans out to HELD, DISCONTINUED and COMPLETED with different side-effect sets, and HELD returns to ACTIVE."
    transitions:
      - from: ACTIVE
        to: HELD
        trigger: "POST /medication-orders/{id}/hold-status with held true"
        actor: Provider
        preconditions:
          - "status == ACTIVE"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Every MedicationAdministration under this order whose outcome is SCHEDULED and whose scheduled_at is strictly after the current clock instant stays SCHEDULED but is blocked from being acted on while the order is HELD."
          - "adherence_pct is NOT recomputed."
          - "increments MedicationOrder.version by 1"

      - from: HELD
        to: ACTIVE
        trigger: "POST /medication-orders/{id}/hold-status with held false"
        actor: Provider
        preconditions:
          - "status == HELD"
          - "Inmate.records_state == OPEN"
          - "Inmate.custody_status == IN_CUSTODY"
        side_effects:
          - "consecutive_missed_count and consecutive_refused_count are preserved across the hold (no reset)."
          - "increments MedicationOrder.version by 1"

      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /medication-orders/{id}/discontinue, or CASCADE-A L3 from the Inmate death event"
        actor: Provider
        preconditions:
          - "status in {ACTIVE, HELD}"
        side_effects:
          - "CASCADE-A L4: every MedicationAdministration under this order whose outcome is SCHEDULED transitions to VOIDED."
          - "CASCADE-A L5: because those doses were VOIDED, consecutive_missed_count and consecutive_refused_count are reset to 0, escalated_to_prescriber is set false, and adherence_pct is recomputed over the reduced denominator."
          - "increments MedicationOrder.version by 1"

      - from: ACTIVE
        to: COMPLETED
        trigger: "CASCADE-B L2 from the Inmate release event"
        actor: system
        preconditions:
          - "status in {ACTIVE, HELD}"
          - "The owning Inmate just transitioned to RELEASED"
        side_effects:
          - "CASCADE-B L3: every MedicationAdministration under this order whose outcome is SCHEDULED transitions to VOIDED."
          - "CASCADE-B L4: because those doses were VOIDED, consecutive_missed_count and consecutive_refused_count are reset to 0, escalated_to_prescriber is set false, and adherence_pct is recomputed."
          - "increments MedicationOrder.version by 1"

  - entity: MedicationAdministration
    initial_state: SCHEDULED
    terminal_states: [ADMINISTERED, REFUSED, MISSED, VOIDED]
    note: |
      BRANCHING 4-way terminal fan-out. Each branch carries a distinct side-effect set:
      ADMINISTERED resets both counters, REFUSED increments only the refusal counter,
      MISSED increments only the missed counter, VOIDED touches neither counter and is
      excluded from every adherence denominator.
    transitions:
      - from: SCHEDULED
        to: ADMINISTERED
        trigger: "POST /medication-administrations/{id}/record with outcome ADMINISTERED"
        actor: Nurse
        preconditions:
          - "outcome == SCHEDULED"
          - "MedicationOrder.status == ACTIVE"
          - "Inmate.records_state == OPEN"
          - "When MedicationOrder.route_mode == DOT: observed_swallow is present in the request body"
          - "When MedicationOrder.route_mode == KOP: observed_swallow is absent from the request body"
          - "X-User-ID differs from MedicationOrder.prescriber_user_id"
        side_effects:
          - "Sets acted_at to the current clock instant and timing_class via calculations.medication_dose_timing_class."
          - "Sets MedicationOrder.consecutive_missed_count to 0 and MedicationOrder.consecutive_refused_count to 0."
          - "CASCADE-C L2: when diversion_observed is true and MedicationOrder.route_mode == KOP, the order route_mode is forced to DOT and forced_dot is set true."
          - "CASCADE-C L3: because route_mode changed to DOT, MedicationOrder.adherence_pct is recomputed using the DOT variant of calculations.medication_adherence_pct instead of the KOP variant."
          - "Recomputes MedicationOrder.adherence_pct."
          - "increments MedicationOrder.version by 1"

      - from: SCHEDULED
        to: REFUSED
        trigger: "POST /medication-administrations/{id}/record with outcome REFUSED"
        actor: Nurse
        preconditions:
          - "outcome == SCHEDULED"
          - "MedicationOrder.status == ACTIVE"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Sets acted_at to the current clock instant and timing_class to null."
          - "Increments MedicationOrder.consecutive_refused_count by 1; consecutive_missed_count is left unchanged."
          - "When the incremented consecutive_refused_count is >= CONSECUTIVE_REFUSED_ESCALATION, sets MedicationOrder.escalated_to_prescriber true."
          - "Recomputes MedicationOrder.adherence_pct."
          - "increments MedicationOrder.version by 1"

      - from: SCHEDULED
        to: MISSED
        trigger: "POST /medication-administrations/{id}/record with outcome MISSED"
        actor: Nurse
        preconditions:
          - "outcome == SCHEDULED"
          - "MedicationOrder.status == ACTIVE"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Sets acted_at to the current clock instant and timing_class to MISSED_WINDOW."
          - "Increments MedicationOrder.consecutive_missed_count by 1; consecutive_refused_count is left unchanged."
          - "When the incremented consecutive_missed_count is >= CONSECUTIVE_MISSED_ESCALATION, sets MedicationOrder.escalated_to_prescriber true."
          - "Recomputes MedicationOrder.adherence_pct."
          - "increments MedicationOrder.version by 1"

      - from: SCHEDULED
        to: VOIDED
        trigger: "CASCADE-A L4 from MedicationOrder DISCONTINUED, or CASCADE-B L3 from MedicationOrder COMPLETED"
        actor: system
        preconditions:
          - "outcome == SCHEDULED"
          - "The parent MedicationOrder just transitioned to DISCONTINUED or COMPLETED"
        side_effects:
          - "Sets acted_at to the current clock instant and timing_class to null."
          - "The row is excluded from every adherence denominator."
          - "CASCADE-A L5 / CASCADE-B L4: because this dose was VOIDED there is no remaining dose for the prescriber to act on, so the parent MedicationOrder's consecutive_missed_count and consecutive_refused_count are reset to 0 and escalated_to_prescriber is set false; adherence_pct is then recomputed over the surviving denominator."
          - "increments MedicationAdministration.version by 1"

  - entity: SpecialtyReferral
    initial_state: REQUESTED
    terminal_states: [DENIED, COMPLETED, CANCELLED]
    note: "CYCLIC: SCHEDULED -> AUTHORIZED whenever the transport leg is cancelled or no-showed, so the referral can be re-scheduled."
    transitions:
      - from: REQUESTED
        to: PENDING_UR
        trigger: "POST /specialty-referrals/{id}/submit-for-review"
        actor: Provider
        preconditions:
          - "status == REQUESTED"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Creates one UtilizationReview with status OPEN, opened_at at the current clock instant, and turnaround_deadline_at from calculations.ur_turnaround_deadline."
          - "increments SpecialtyReferral.version by 1"

      - from: PENDING_UR
        to: AUTHORIZED
        trigger: "system side effect of UtilizationReview reaching APPROVED or OVERTURNED"
        actor: system
        preconditions:
          - "status == PENDING_UR"
        side_effects:
          - "Sets authorized_at to the current clock instant."
          - "increments SpecialtyReferral.version by 1"

      - from: PENDING_UR
        to: DENIED
        trigger: "system side effect of UtilizationReview reaching UPHELD"
        actor: system
        preconditions:
          - "status == PENDING_UR"
        side_effects:
          - "increments SpecialtyReferral.version by 1"

      - from: AUTHORIZED
        to: SCHEDULED
        trigger: "system side effect of a TransportOrder for this referral reaching ESCORT_ASSIGNED"
        actor: system
        preconditions:
          - "status == AUTHORIZED"
        side_effects:
          - "increments SpecialtyReferral.version by 1"

      - from: SCHEDULED
        to: AUTHORIZED
        trigger: "system side effect of a TransportOrder for this referral reaching CANCELLED or NO_SHOW"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "CASCADE-D L2: when the trigger was NO_SHOW, no_show_count is recomputed as the count of NO_SHOW TransportOrder rows for this referral."
          - "increments SpecialtyReferral.version by 1"
        note: "This is the cycle edge: AUTHORIZED -> SCHEDULED -> AUTHORIZED can repeat until the no-show cap fires."

      - from: AUTHORIZED
        to: CANCELLED
        trigger: "CASCADE-D L3 when no_show_count reaches MAX_NO_SHOW_COUNT, or system cascade from POST /inmates/{id}/death-event"
        actor: system
        preconditions:
          - "status in {REQUESTED, PENDING_UR, AUTHORIZED, SCHEDULED}"
        side_effects:
          - "Every TransportOrder under this referral with status in {DRAFT, ESCORT_ASSIGNED, DISPATCHED} transitions to CANCELLED with cancel_reason CLINICAL_CHANGE."
          - "increments SpecialtyReferral.version by 1"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "system side effect of a TransportOrder for this referral reaching COMPLETED"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "Creates one CopayCharge with encounter_type SPECIALTY_OFFSITE for the inmate, following the same three-variant posting rules as the sick-call SEEN transition."
          - "increments SpecialtyReferral.version by 1"

  - entity: UtilizationReview
    initial_state: OPEN
    terminal_states: [APPROVED, OVERTURNED, UPHELD]
    note: |
      BRANCHING 3-way fan-out from OPEN into APPROVED, DENIED and DEFERRED with divergent
      side-effect sets, plus a DEFERRED -> OPEN cycle and a second fan-out DENIED ->
      PEER_REVIEW -> {OVERTURNED, UPHELD}.
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /utilization-reviews/{id}/decide with decision APPROVE"
        actor: UtilizationReviewer
        preconditions:
          - "status == OPEN"
          - "SpecialtyReferral.status == PENDING_UR"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Sets decision APPROVE, decided_at to the current clock instant, decided_by_user_id to X-User-ID."
          - "The parent SpecialtyReferral transitions PENDING_UR -> AUTHORIZED."
          - "increments UtilizationReview.version by 1"

      - from: OPEN
        to: DENIED
        trigger: "POST /utilization-reviews/{id}/decide with decision DENY"
        actor: UtilizationReviewer
        preconditions:
          - "status == OPEN"
          - "SpecialtyReferral.status == PENDING_UR"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Sets decision DENY, decided_at to the current clock instant, decided_by_user_id to X-User-ID."
          - "The parent SpecialtyReferral stays PENDING_UR - a denial is not final until peer review resolves it."
          - "increments UtilizationReview.version by 1"

      - from: OPEN
        to: DEFERRED
        trigger: "POST /utilization-reviews/{id}/decide with decision DEFER"
        actor: UtilizationReviewer
        preconditions:
          - "status == OPEN"
          - "SpecialtyReferral.status == PENDING_UR"
          - "defer_count is strictly less than UR_MAX_DEFERRALS"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Sets decision DEFER, decided_at to the current clock instant, decided_by_user_id to X-User-ID."
          - "Increments defer_count by 1."
          - "Extends turnaround_deadline_at by UR_DEFER_EXTENSION_HOURS hours from its previous value."
          - "The parent SpecialtyReferral stays PENDING_UR."
          - "increments UtilizationReview.version by 1"

      - from: DEFERRED
        to: OPEN
        trigger: "POST /utilization-reviews/{id}/supply-information"
        actor: Provider
        preconditions:
          - "status == DEFERRED"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Clears decision and decided_at back to null; decided_by_user_id is retained for the segregation-of-duties check."
          - "turnaround_deadline_at keeps the extended value set by the DEFER transition."
          - "increments UtilizationReview.version by 1"
        note: "Cycle edge - a review can be deferred and reopened UR_MAX_DEFERRALS times."

      - from: DENIED
        to: PEER_REVIEW
        trigger: "POST /utilization-reviews/{id}/escalate-peer-review"
        actor: Provider
        preconditions:
          - "status == DENIED"
          - "The current clock instant is at or before decided_at plus UR_PEER_REVIEW_WINDOW_HOURS hours (equality is still inside the window)"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "increments UtilizationReview.version by 1"

      - from: PEER_REVIEW
        to: OVERTURNED
        trigger: "POST /utilization-reviews/{id}/peer-decide with peer_decision OVERTURN"
        actor: PeerReviewer
        preconditions:
          - "status == PEER_REVIEW"
          - "X-User-ID differs from decided_by_user_id"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Sets peer_reviewer_user_id to X-User-ID."
          - "The parent SpecialtyReferral transitions PENDING_UR -> AUTHORIZED."
          - "increments UtilizationReview.version by 1"

      - from: PEER_REVIEW
        to: UPHELD
        trigger: "POST /utilization-reviews/{id}/peer-decide with peer_decision UPHOLD"
        actor: PeerReviewer
        preconditions:
          - "status == PEER_REVIEW"
          - "X-User-ID differs from decided_by_user_id"
          - "Inmate.records_state == OPEN"
        side_effects:
          - "Sets peer_reviewer_user_id to X-User-ID."
          - "The parent SpecialtyReferral transitions PENDING_UR -> DENIED."
          - "increments UtilizationReview.version by 1"

  - entity: TransportOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: DRAFT
        to: ESCORT_ASSIGNED
        trigger: "POST /transport-orders/{id}/assign-escort"
        actor: CustodyOfficer
        preconditions:
          - "status == DRAFT"
          - "The request body escort_level equals required_escort_level exactly"
          - "SpecialtyReferral.status == AUTHORIZED"
        side_effects:
          - "Sets assigned_escort_level from the request body."
          - "The parent SpecialtyReferral transitions AUTHORIZED -> SCHEDULED."
          - "increments TransportOrder.version by 1"

      - from: ESCORT_ASSIGNED
        to: DISPATCHED
        trigger: "POST /transport-orders/{id}/dispatch"
        actor: CustodyOfficer
        preconditions:
          - "status == ESCORT_ASSIGNED"
          - "Inmate.custody_status == IN_CUSTODY"
        side_effects:
          - "increments TransportOrder.version by 1"

      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /transport-orders/{id}/outcome with outcome COMPLETED"
        actor: CustodyOfficer
        preconditions:
          - "status == DISPATCHED"
        side_effects:
          - "The parent SpecialtyReferral transitions SCHEDULED -> COMPLETED, which posts a SPECIALTY_OFFSITE CopayCharge."
          - "increments TransportOrder.version by 1"

      - from: DISPATCHED
        to: NO_SHOW
        trigger: "POST /transport-orders/{id}/outcome with outcome NO_SHOW"
        actor: CustodyOfficer
        preconditions:
          - "status == DISPATCHED"
        side_effects:
          - "CASCADE-D L1: sets status NO_SHOW."
          - "CASCADE-D L2: because a NO_SHOW was recorded, the parent SpecialtyReferral transitions SCHEDULED -> AUTHORIZED and its no_show_count is recomputed."
          - "CASCADE-D L3: because no_show_count reached MAX_NO_SHOW_COUNT, the parent SpecialtyReferral transitions AUTHORIZED -> CANCELLED."
          - "increments TransportOrder.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /transport-orders/{id}/cancel"
        actor: CustodyOfficer
        preconditions:
          - "status in {DRAFT, ESCORT_ASSIGNED, DISPATCHED}"
          - "The current clock instant is at or before appointment_at minus TRANSPORT_CANCEL_CUTOFF_MINUTES minutes (equality is still cancellable)"
        side_effects:
          - "Sets cancel_reason from the request body."
          - "When the referral was SCHEDULED, the parent SpecialtyReferral transitions SCHEDULED -> AUTHORIZED; no_show_count is NOT incremented."
          - "increments TransportOrder.version by 1"
        note: "Same transition definition applies from ESCORT_ASSIGNED and from DISPATCHED."

  - entity: Grievance
    initial_state: FILED
    terminal_states: [CLOSED, WITHDRAWN]
    note: |
      CYCLIC on two edges. (1) DECIDED -> FILED re-entry when the grievant escalates to the
      next stage (INFORMAL -> FORMAL -> APPEAL). (2) REMANDED -> UNDER_REVIEW when an APPEAL
      is remanded back to FORMAL for re-hearing.
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /grievances/{id}/accept"
        actor: GrievanceCoordinator
        preconditions:
          - "status == FILED"
        side_effects:
          - "Sets stage_entered_at to the current clock instant and response_due_at via calculations.grievance_response_due."
          - "increments Grievance.version by 1"

      - from: UNDER_REVIEW
        to: DECIDED
        trigger: "POST /grievances/{id}/decide"
        actor: GrievanceCoordinator
        preconditions:
          - "status == UNDER_REVIEW"
          - "The request body outcome is GRANTED or DENIED"
        side_effects:
          - "CASCADE-E L1: sets outcome from the request body."
          - "CASCADE-E L2: when outcome == GRANTED and subject_copay_charge_id is not null and that CopayCharge.status is POSTED or DEBT_LIEN, the CopayCharge transitions to REVERSED and its reversal_grievance_id is set to this grievance."
          - "CASCADE-E L3: because the charge became REVERSED, one LedgerEntry with entry_type REVERSAL is appended whose amount_cents is the negation of the amount_cents of the ledger entry that originally posted the charge."
          - "CASCADE-E L4: because a LedgerEntry was appended, Inmate.account_balance_cents is recomputed by calculations.inmate_account_balance."
          - "CASCADE-E L5: because account_balance_cents changed, Inmate.indigent_flag is re-derived by calculations.indigency_determination."
          - "increments Grievance.version by 1"

      - from: DECIDED
        to: FILED
        trigger: "POST /grievances/{id}/escalate"
        actor: Inmate
        preconditions:
          - "status == DECIDED"
          - "outcome == DENIED"
          - "stage is INFORMAL or FORMAL"
          - "The current clock instant is at or before the prior decision instant plus the GRIEVANCE_FILING_WINDOW_DAYS entry for the NEXT stage (equality is still inside the window)"
        side_effects:
          - "Advances stage one rung: INFORMAL -> FORMAL, FORMAL -> APPEAL."
          - "Clears outcome back to null and sets stage_entered_at to the current clock instant."
          - "Recomputes response_due_at via calculations.grievance_response_due for the new stage."
          - "increments Grievance.version by 1"
        note: "Cycle edge - the grievance re-enters FILED at a higher stage."

      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /grievances/{id}/remand"
        actor: GrievanceCoordinator
        preconditions:
          - "status == UNDER_REVIEW"
          - "stage == APPEAL"
          - "remand_count is strictly less than GRIEVANCE_MAX_REMANDS"
        side_effects:
          - "Increments remand_count by 1 and sets stage back to FORMAL."
          - "increments Grievance.version by 1"

      - from: REMANDED
        to: UNDER_REVIEW
        trigger: "POST /grievances/{id}/accept"
        actor: GrievanceCoordinator
        preconditions:
          - "status == REMANDED"
        side_effects:
          - "Sets stage_entered_at to the current clock instant and recomputes response_due_at for stage FORMAL."
          - "increments Grievance.version by 1"
        note: "Cycle edge - the remanded appeal is re-heard at the FORMAL rung."

      - from: DECIDED
        to: CLOSED
        trigger: "POST /grievances/{id}/close"
        actor: GrievanceCoordinator
        preconditions:
          - "status == DECIDED"
        side_effects:
          - "increments Grievance.version by 1"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /grievances/{id}/withdraw"
        actor: Inmate
        preconditions:
          - "status in {FILED, UNDER_REVIEW, REMANDED}"
          - "X-User-ID == Grievance.inmate_id"
        side_effects:
          - "Sets outcome to WITHDRAWN."
          - "increments Grievance.version by 1"
        note: "Same transition definition applies from UNDER_REVIEW and from REMANDED."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: med-order-create-stale-inmate
    parent_entity: Inmate
    write_endpoint: "POST /medication-orders"
    occ_field: "expected_inmate_version"
    description: |
      Creating a MedicationOrder against an Inmate whose version has advanced since the
      client last observed it is rejected. A new order for the same drug_name legitimately
      supersedes the prior ACTIVE order for that drug (the prior order is auto-DISCONTINUED),
      so a writer holding a stale view of the inmate would silently supersede an order it
      never saw. The stale-version check makes that rejection deterministic.
    error_id: ERR_STALE_INMATE_VERSION
    http_status: 412

  - rule_id: transport-order-create-stale-referral
    parent_entity: SpecialtyReferral
    write_endpoint: "POST /transport-orders"
    occ_field: "expected_referral_version"
    description: |
      Creating a TransportOrder against a SpecialtyReferral whose version has advanced since
      the client last observed it is rejected. Creating a trip legitimately supersedes any
      DRAFT trip already attached to the referral (the prior DRAFT is auto-CANCELLED), so a
      writer with a stale referral view would discard a trip it never saw.
    error_id: ERR_STALE_REFERRAL_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
#
# Every named constant used anywhere in this scaffold is assigned a value in one of
# the `constants:` blocks below. There are no undeclared constants.
# All date/time arithmetic is on UTC instants unless a formula explicitly says
# "calendar date", in which case the UTC calendar date of the instant is used.
# ---------------------------------------------------------------------------

calculations:

  - name: intake_screening_due_at
    trigger: "On POST /inmates (auto-created RECEIVING screening) and on POST /inmates/{id}/intake-screenings; the value is frozen at creation and never recomputed"
    algorithm: threshold
    formula: |
      if screening_type == "RECEIVING":
          if inmate.admission_type == "NEW_BOOKING":
              due_at = inmate.booked_at + RECEIVING_SCREENING_DUE_HOURS hours
          else:  # INTER_FACILITY_TRANSFER -- clock RESTARTS, and on a shorter fuse
              due_at = inmate.booked_at + TRANSFER_RECEIVING_DUE_HOURS hours
      else:  # screening_type == "FULL_ASSESSMENT"
          if inmate.admission_type == "NEW_BOOKING" or inmate.prior_full_assessment_at is null:
              due_at = inmate.booked_at + FULL_ASSESSMENT_DUE_DAYS days
          else:  # INTER_FACILITY_TRANSFER with a documented prior assessment -- clock PRESERVED
              due_at = inmate.prior_full_assessment_at + FULL_ASSESSMENT_DUE_DAYS days
    input_set: "Exactly one Inmate row (the parent) plus the screening_type of the row being created. No other rows participate."
    constants:
      RECEIVING_SCREENING_DUE_HOURS: 12
      TRANSFER_RECEIVING_DUE_HOURS: 4
      FULL_ASSESSMENT_DUE_DAYS: 14
    precision: "Whole seconds; the result is an ISO 8601 UTC instant with three fractional digits, always .000"
    boundary_semantics: "A screening is OVERDUE only when the clock is STRICTLY after due_at. clock == due_at is still on time."
    variants:
      - name: NEW_BOOKING_CLOCK_RESTART
        when: "inmate.admission_type == NEW_BOOKING"
        difference: "Both clocks are anchored on booked_at: RECEIVING gets 12 hours, FULL_ASSESSMENT gets 14 days."
      - name: TRANSFER_CLOCK_PRESERVED
        when: "inmate.admission_type == INTER_FACILITY_TRANSFER and prior_full_assessment_at is not null"
        difference: "The RECEIVING clock restarts on a SHORTER 4-hour fuse, while the FULL_ASSESSMENT clock is PRESERVED - anchored on prior_full_assessment_at, not on booked_at. Same booked_at therefore yields a different FULL_ASSESSMENT due_at than the NEW_BOOKING variant."

  - name: chronic_tier_assignment
    trigger: "On POST /inmates/{id}/chronic-care-enrollments and on POST /chronic-care-enrollments/{id}/re-enroll"
    algorithm: threshold
    formula: |
      tier = SEVERITY_TO_TIER[severity]
      periodicity_days = TIER_PERIODICITY_DAYS[tier]
    input_set: "The severity value supplied on the request body of the creating or re-enrolling call."
    constants:
      SEVERITY_TO_TIER: { SEVERE: "TIER_1", MODERATE: "TIER_2", MILD: "TIER_3" }
      TIER_PERIODICITY_DAYS: { TIER_1: 30, TIER_2: 90, TIER_3: 180 }
    precision: "Integer days"

  - name: chronic_care_next_due_date
    trigger: "On enrollment creation, on re-enrollment, on a ChronicCareVisit with outcome COMPLETED, and on a missed-visit tier escalation"
    algorithm: threshold
    formula: |
      anchor = enrollment.last_visit_at if enrollment.last_visit_at is not null else enrollment.enrolled_at
      next_due_date = anchor + enrollment.periodicity_days days
    input_set: "The single ChronicCareEnrollment row. A visit with outcome MISSED or REFUSED does NOT move the anchor."
    constants:
      CHRONIC_LAPSE_GRACE_DAYS: 15
      CHRONIC_MISSED_ESCALATION_COUNT: 2
    precision: "Whole seconds"
    boundary_semantics: "An enrollment LAPSES only when the clock is STRICTLY after next_due_date + CHRONIC_LAPSE_GRACE_DAYS days. Equality is still ACTIVE. Tier escalation fires when missed_visit_count is >= CHRONIC_MISSED_ESCALATION_COUNT (2 exactly does fire)."

  - name: sick_call_response_deadline
    trigger: "On every POST /sick-call-requests/{id}/triage, including re-triage"
    algorithm: threshold
    formula: |
      # Acuity ordering, most urgent first: EMERGENT > URGENT > ROUTINE
      if this is the FIRST triage (retriage_count was 0 and status was SUBMITTED):
          deadline_anchor_at = request.submitted_at
      elif ACUITY_RANK[new_acuity] < ACUITY_RANK[old_acuity]:   # UPGRADE (more urgent)
          deadline_anchor_at = request.submitted_at             # ORIGINAL submission instant
      else:                                                     # DOWNGRADE (less urgent)
          deadline_anchor_at = the current clock instant         # the RE-TRIAGE instant
      response_deadline_at = deadline_anchor_at + ACUITY_SLA_HOURS[new_acuity] hours
    input_set: "The single SickCallRequest row plus the acuity supplied on this triage call."
    constants:
      ACUITY_SLA_HOURS: { EMERGENT: 1, URGENT: 24, ROUTINE: 72 }
      ACUITY_RANK: { EMERGENT: 1, URGENT: 2, ROUTINE: 3 }
      MAX_RETRIAGE_COUNT: 2
    precision: "Whole seconds"
    boundary_semantics: "A re-triage to the SAME acuity is rejected (see validations); only strict upgrades and strict downgrades are legal re-triages."
    variants:
      - name: UPGRADE_FROM_ORIGINAL_SUBMISSION
        when: "A re-triage moves the acuity to a strictly more urgent level"
        difference: "The deadline is re-measured from submitted_at, so time already elapsed is NOT forgiven and the deadline can land in the past."
      - name: DOWNGRADE_FROM_RETRIAGE_INSTANT
        when: "A re-triage moves the acuity to a strictly less urgent level"
        difference: "The deadline is re-measured from the re-triage instant, so the elapsed time IS forgiven. Identical inputs under the two variants produce different response_deadline_at values."

  - name: sick_call_sla_breach
    trigger: "Evaluated at read time on every GET that returns a SickCallRequest"
    algorithm: threshold
    formula: |
      if request.status == "CANCELLED" or request.response_deadline_at is null:
          sla_breached = false
      else:
          resolution_instant = request.seen_at if request.seen_at is not null else current_clock
          sla_breached = (resolution_instant > request.response_deadline_at)
    input_set: "The single SickCallRequest row and the logical clock."
    constants:
      SLA_BREACH_REQUIRES_STRICT_EXCESS: true
    precision: "Boolean"
    boundary_semantics: "Strictly after. resolution_instant == response_deadline_at is NOT a breach."

  - name: medication_dose_timing_class
    trigger: "On POST /medication-administrations/{id}/record when the recorded outcome is ADMINISTERED. A MISSED outcome bypasses this formula and always stamps timing_class MISSED_WINDOW; a REFUSED or VOIDED outcome leaves timing_class null."
    algorithm: threshold
    formula: |
      delta_minutes = floor((acted_at - scheduled_at) / 60 seconds)   # signed whole minutes
      if delta_minutes < (0 - DOSE_EARLY_TOLERANCE_MINUTES):
          timing_class = "MISSED_WINDOW"
      elif delta_minutes <= DOSE_LATE_TOLERANCE_MINUTES:
          timing_class = "ON_TIME"
      elif delta_minutes <= DOSE_MISSED_AFTER_MINUTES:
          timing_class = "LATE"
      else:
          timing_class = "MISSED_WINDOW"
    input_set: "The single MedicationAdministration row plus the logical clock at the moment of recording."
    constants:
      DOSE_EARLY_TOLERANCE_MINUTES: 30
      DOSE_LATE_TOLERANCE_MINUTES: 60
      DOSE_MISSED_AFTER_MINUTES: 120
      CONSECUTIVE_MISSED_ESCALATION: 3
      CONSECUTIVE_REFUSED_ESCALATION: 3
    precision: "Integer minutes, floor-truncated toward negative infinity"
    boundary_semantics: "delta == -30 is ON_TIME; delta == -31 is MISSED_WINDOW. delta == 60 is ON_TIME; delta == 61 is LATE. delta == 120 is LATE; delta == 121 is MISSED_WINDOW. Escalation fires when a counter reaches exactly 3."

  - name: medication_adherence_pct
    trigger: "Recomputed on every MedicationAdministration outcome record, on every KOP pill count, on order DISCONTINUED and on order COMPLETED"
    algorithm: aggregation
    formula: |
      if order.route_mode == "DOT":
          scored = count of MedicationAdministration rows under this order whose
                   outcome is in {ADMINISTERED, REFUSED, MISSED}
                   (SCHEDULED and VOIDED rows are excluded from BOTH numerator and denominator)
          if scored == 0:
              adherence_pct = 0.00
          else:
              numerator = count of those rows whose outcome == ADMINISTERED
                          AND whose timing_class is in {ON_TIME, LATE}
              adherence_pct = round_half_up(100 * numerator / scored, 2)
      else:  # order.route_mode == "KOP"
          last_day = min(current_clock calendar date, order.end_date calendar date)
          if last_day < order.start_date calendar date:
              expected_units = 0
          else:
              expected_units = order.doses_per_day * ((last_day - order.start_date calendar date) in whole days + 1)
          if expected_units == 0:
              adherence_pct = 0.00
          else:
              consumed = order.units_dispensed - order.units_returned
              raw = 100 * consumed / expected_units
              adherence_pct = round_half_up(min(KOP_ADHERENCE_MAX_PCT, max(KOP_ADHERENCE_MIN_PCT, raw)), 2)
    input_set: "DOT: all MedicationAdministration rows under the order with outcome in {ADMINISTERED, REFUSED, MISSED}. KOP: the order's units_dispensed and units_returned totals and the inclusive day span from start_date to min(clock, end_date)."
    constants:
      KOP_ADHERENCE_MIN_PCT: 0
      KOP_ADHERENCE_MAX_PCT: 100
    precision: "2 decimal places, round_half_up"
    boundary_semantics: "The day span is INCLUSIVE of both start_date and last_day, so a one-day order at 2 doses/day expects 2 units, not 0."
    variants:
      - name: DOT_OBSERVED_DOSE_RATIO
        when: "order.route_mode == DOT"
        difference: "Denominator is the count of scored administration events; an ADMINISTERED dose whose timing_class is MISSED_WINDOW is in the denominator but NOT the numerator."
      - name: KOP_PILL_COUNT_RATIO
        when: "order.route_mode == KOP"
        difference: "Denominator is a time-derived expected-unit count, not an event count, and the result is clamped into [0, 100]. Identical administration histories therefore yield different adherence_pct under the two variants."

  - name: facility_adherence_index
    trigger: "On GET /reports/facility-adherence"
    algorithm: aggregation
    formula: |
      orders = MedicationOrder rows whose inmate.facility_code == the requested facility_code
               and whose status is in {ACTIVE, HELD}
               sorted by MedicationOrder.created_at ascending
      n = count(orders)
      if n < ADHERENCE_INDEX_MIN_ORDERS:
          index = 0.00
      else:
          # PINNED ROUNDING ORDER: each order's adherence_pct is ALREADY rounded to 2 dp
          # by calculations.medication_adherence_pct. Sum those ALREADY-ROUNDED values,
          # divide by n, then round the quotient once more to 2 dp.
          # The forbidden alternative -- pooling raw numerators and denominators across
          # orders and rounding only at the very end -- produces a different number.
          index = round_half_up(sum(order.adherence_pct for order in orders) / n, 2)
    input_set: "MedicationOrder rows with status in {ACTIVE, HELD} for inmates whose facility_code matches the query parameter. DISCONTINUED and COMPLETED orders are excluded."
    constants:
      ADHERENCE_INDEX_MIN_ORDERS: 1
    precision: "2 decimal places, round_half_up, applied twice: once per order, once on the mean"
    boundary_semantics: "Empty candidate set (n == 0) yields exactly 0.00, not an error."

  - name: indigency_determination
    trigger: "Evaluated before every CopayCharge posting and re-derived after every LedgerEntry append"
    algorithm: threshold
    formula: |
      window_start = current_clock - INDIGENCY_LOOKBACK_DAYS days
      observed = [ e.balance_after_cents for e in LedgerEntry rows of this inmate
                   where e.created_at >= window_start and e.created_at <= current_clock ]
      peak = max(observed) if observed is non-empty else inmate.account_balance_cents
      indigent = (inmate.account_balance_cents < INDIGENCY_THRESHOLD_CENTS)
                 and (peak < INDIGENCY_THRESHOLD_CENTS)
    input_set: "All LedgerEntry rows for the inmate whose created_at falls in the closed interval [window_start, current_clock]. When that set is empty the inmate's current account_balance_cents stands in as the peak. Entry types are NOT filtered."
    constants:
      INDIGENCY_LOOKBACK_DAYS: 30
      INDIGENCY_THRESHOLD_CENTS: 200
    precision: "Boolean over integer cents"
    boundary_semantics: "Both comparisons are STRICTLY less than. A current balance of exactly 200 cents is NOT indigent; 199 cents IS indigent. The window is CLOSED at both ends: an entry created exactly INDIGENCY_LOOKBACK_DAYS days before the clock is still inside it."

  - name: copay_amount
    trigger: "On SickCallRequest SCHEDULED -> SEEN, on SpecialtyReferral SCHEDULED -> COMPLETED, and on POST /inmates/{id}/copay-charges"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER. The amount depends on indigency, indigency depends on the
      # account balance, and this very charge changes the account balance. The cycle is cut
      # by evaluating indigency on the ledger AS IT STANDS BEFORE this charge posts.
      # Step 1 -- exemption test (runs FIRST, before any balance is read):
      if encounter_type in EXEMPT_ENCOUNTER_TYPES:
          scheduled_amount_cents = 0
          amount_cents = 0
          charge_variant = "EXEMPT"
          status = "WAIVED"
          indigency_snapshot = false     # indigency is NOT evaluated for exempt encounters
          # NO LedgerEntry is appended.  STOP.
      else:
          # Step 2 -- schedule lookup:
          scheduled_amount_cents = COPAY_SCHEDULE_CENTS[encounter_type]
          # Step 3 -- indigency evaluated on the PRE-CHARGE ledger:
          indigency_snapshot = calculations.indigency_determination(inmate, current_clock)
          if indigency_snapshot == false:
              # Step 4 -- FUNDED variant:
              amount_cents = scheduled_amount_cents
              charge_variant = "FUNDED"
              status = "POSTED"
              append LedgerEntry(entry_type="CHARGE", amount_cents = 0 - amount_cents)
          else:
              # Step 5 -- INDIGENT variant:
              amount_cents = round_half_up(scheduled_amount_cents * INDIGENT_LIEN_RATE_PCT / 100)
              charge_variant = "INDIGENT"
              status = "DEBT_LIEN"
              append LedgerEntry(entry_type="LIEN", amount_cents = 0 - amount_cents)
      # Step 6 -- only now is Inmate.account_balance_cents recomputed and indigent_flag re-derived.
    input_set: "The encounter_type of the charge, the exemption set, and the inmate's ledger state at the instant immediately BEFORE this charge's own entry is appended."
    constants:
      COPAY_SCHEDULE_CENTS: { SICK_CALL: 500, NURSE_TRIAGE: 300, PROVIDER_VISIT: 800, DENTAL: 1000, SPECIALTY_OFFSITE: 1500 }
      EXEMPT_ENCOUNTER_TYPES: ["MENTAL_HEALTH", "EMERGENCY", "COMMUNICABLE_DISEASE", "CHRONIC_FOLLOWUP", "INTAKE_SCREENING", "STAFF_INITIATED"]
      INDIGENT_LIEN_RATE_PCT: 50
    precision: "Whole cents, round_half_up on the lien percentage"
    boundary_semantics: "The exemption test short-circuits before the balance is read, so an indigent inmate at a MENTAL_HEALTH encounter yields charge_variant EXEMPT, never INDIGENT."
    variants:
      - name: FUNDED_FULL_SCHEDULE
        when: "encounter_type is not exempt and indigency_snapshot == false"
        difference: "Full schedule amount is posted as a CHARGE entry that reduces a positive balance."
      - name: INDIGENT_DEBT_LIEN
        when: "encounter_type is not exempt and indigency_snapshot == true"
        difference: "Half the schedule amount is posted as a LIEN entry that is allowed to drive the balance negative; the encounter is never refused for insufficient funds. Same encounter_type therefore produces a different amount_cents, a different entry_type and a different CopayCharge.status than the FUNDED variant."

  - name: inmate_account_balance
    trigger: "Recomputed after every LedgerEntry append"
    algorithm: chronological
    formula: |
      entries = LedgerEntry rows for this inmate sorted by created_at ascending;
                when two entries share the same created_at, the server's append order
                within the request is preserved (earlier append sorts first).
      running = 0
      for e in entries:
          running = running + e.amount_cents
          e.balance_after_cents = running
      inmate.account_balance_cents = running
    input_set: "ALL LedgerEntry rows for the inmate with no status or type filter and no time window."
    constants:
      LEDGER_OPENING_BALANCE_CENTS: 0
    precision: "Integer cents"
    boundary_semantics: "An inmate with zero LedgerEntry rows has account_balance_cents exactly 0."
    conservation_invariant: |
      INVARIANT-1 (money): for every Inmate,
        sum(LedgerEntry.amount_cents where inmate_id == Inmate.id) == Inmate.account_balance_cents
      and the balance_after_cents of the chronologically last entry equals account_balance_cents.
      The compensating pair is CopayCharge posting (CHARGE or LIEN entry) followed by the
      grievance-granted reversal (REVERSAL entry): after both, account_balance_cents MUST equal
      its exact pre-charge value with zero drift.

  - name: grievance_response_due
    trigger: "On grievance FILED -> UNDER_REVIEW, on DECIDED -> FILED escalation, and on REMANDED -> UNDER_REVIEW"
    algorithm: threshold
    formula: |
      response_due_at = grievance.stage_entered_at + GRIEVANCE_RESPONSE_WINDOW_DAYS[grievance.stage] days
      response_breached = (grievance.status in {FILED, UNDER_REVIEW, REMANDED})
                          and (current_clock > response_due_at)
    input_set: "The single Grievance row, its current stage, and the logical clock."
    constants:
      GRIEVANCE_RESPONSE_WINDOW_DAYS: { INFORMAL: 5, FORMAL: 15, APPEAL: 30 }
      GRIEVANCE_FILING_WINDOW_DAYS: { INFORMAL: 15, FORMAL: 10, APPEAL: 5 }
      GRIEVANCE_MAX_REMANDS: 1
    precision: "Whole seconds"
    boundary_semantics: |
      Filing: a new Grievance is accepted only when current_clock <= grieved_event_at +
      GRIEVANCE_FILING_WINDOW_DAYS[INFORMAL] days; equality is INSIDE the window.
      Escalation to the next stage S: accepted only when current_clock <= decided_at +
      GRIEVANCE_FILING_WINDOW_DAYS[S] days; equality is INSIDE the window.
      Response breach: STRICTLY after response_due_at; equality is NOT a breach.

  - name: ur_turnaround_deadline
    trigger: "On UtilizationReview creation (SpecialtyReferral REQUESTED -> PENDING_UR) and extended on each DEFER decision"
    algorithm: threshold
    formula: |
      if review.retrospective == true:
          turnaround_deadline_at = review.opened_at + UR_RETROSPECTIVE_TURNAROUND_HOURS hours
      else:
          turnaround_deadline_at = review.opened_at + UR_TURNAROUND_HOURS[referral.urgency] hours
      # each DEFER decision then does:
      #   turnaround_deadline_at = turnaround_deadline_at + UR_DEFER_EXTENSION_HOURS hours
    input_set: "The UtilizationReview row, its retrospective flag, and the parent SpecialtyReferral.urgency."
    constants:
      UR_TURNAROUND_HOURS: { EMERGENT: 4, ROUTINE: 120 }
      UR_RETROSPECTIVE_TURNAROUND_HOURS: 720
      UR_DEFER_EXTENSION_HOURS: 72
      UR_PEER_REVIEW_WINDOW_HOURS: 48
      UR_MAX_DEFERRALS: 1
    precision: "Whole seconds"
    boundary_semantics: "The peer-review escalation window is CLOSED: current_clock == decided_at + 48 hours is still inside the window; one second later is outside."
    variants:
      - name: PROSPECTIVE_BY_URGENCY
        when: "review.retrospective == false"
        difference: "Deadline is urgency-driven: 4 hours for EMERGENT, 120 hours for ROUTINE."
      - name: RETROSPECTIVE_FLAT
        when: "review.retrospective == true"
        difference: "Deadline is a flat 720 hours regardless of urgency, so an EMERGENT retrospective review has a deadline 716 hours later than the identical prospective review."

  - name: ur_turnaround_breach
    trigger: "Evaluated at read time on every GET that returns a UtilizationReview"
    algorithm: threshold
    formula: |
      reference = review.decided_at if review.decided_at is not null else current_clock
      turnaround_breached = (reference > review.turnaround_deadline_at)
    input_set: "The single UtilizationReview row and the logical clock."
    constants:
      UR_BREACH_REQUIRES_STRICT_EXCESS: true
    precision: "Boolean"
    boundary_semantics: "Strictly after. reference == turnaround_deadline_at is NOT a breach."

  - name: transport_escort_requirement
    trigger: "On POST /transport-orders, frozen on the row at creation"
    algorithm: threshold
    formula: |
      required_escort_level = CUSTODY_ESCORT_LEVEL[inmate.custody_level]
    input_set: "The custody_level of the Inmate that owns the parent SpecialtyReferral, read at TransportOrder creation time."
    constants:
      CUSTODY_ESCORT_LEVEL: { MINIMUM: "ESCORT_1", MEDIUM: "ESCORT_2", MAXIMUM: "ESCORT_2_ARMED" }
    precision: "Enum"

  - name: transport_lead_time_requirement
    trigger: "On POST /transport-orders, evaluated against the appointment_at supplied in the request body"
    algorithm: threshold
    formula: |
      required_lead_minutes = max(
          TRANSPORT_MIN_LEAD_MINUTES[referral.urgency],
          min(
              TRANSPORT_MIN_LEAD_MINUTES["ROUTINE"],
              ESCORT_LEAD_SURCHARGE_MINUTES[required_escort_level]
                + NO_SHOW_LEAD_PENALTY_MINUTES * referral.no_show_count
          )
      )
      lead_minutes = floor((appointment_at - current_clock) / 60 seconds)
      accepted = (lead_minutes >= required_lead_minutes)
    input_set: "Three independent inputs: the parent referral's urgency, the required_escort_level derived from the inmate's custody_level, and the parent referral's no_show_count."
    constants:
      TRANSPORT_MIN_LEAD_MINUTES: { EMERGENT: 60, ROUTINE: 2880 }
      ESCORT_LEAD_SURCHARGE_MINUTES: { ESCORT_1: 0, ESCORT_2: 120, ESCORT_2_ARMED: 480 }
      NO_SHOW_LEAD_PENALTY_MINUTES: 720
      MAX_NO_SHOW_COUNT: 2
      TRANSPORT_CANCEL_CUTOFF_MINUTES: 120
      TRANSPORT_SLOT_MINUTES: 240
    precision: "Integer minutes, floor-truncated"
    boundary_semantics: "Acceptance is lead_minutes >= required_lead_minutes; exact equality is ACCEPTED. Cancellation is allowed while current_clock <= appointment_at - TRANSPORT_CANCEL_CUTOFF_MINUTES minutes; exact equality is still CANCELLABLE. The referral is auto-CANCELLED when no_show_count reaches exactly MAX_NO_SHOW_COUNT."

  - name: transport_slot_overlap
    trigger: "On POST /transport-orders, after the lead-time check"
    algorithm: interval_merge
    formula: |
      # A trip occupies a HALF-OPEN minute interval on the inmate:
      #     slot(t) = [ t.appointment_at , t.appointment_at + TRANSPORT_SLOT_MINUTES minutes )
      occupied = TransportOrder rows whose parent referral's inmate_id equals this inmate
                 and whose status is in {DRAFT, ESCORT_ASSIGNED, DISPATCHED}
      conflict = any o in occupied such that
                 new.appointment_at < (o.appointment_at + TRANSPORT_SLOT_MINUTES minutes)
                 and o.appointment_at < (new.appointment_at + TRANSPORT_SLOT_MINUTES minutes)
    input_set: "TransportOrder rows across ALL referrals of the same inmate whose status is in {DRAFT, ESCORT_ASSIGNED, DISPATCHED}. COMPLETED, NO_SHOW and CANCELLED trips free their slot."
    constants:
      TRANSPORT_SLOT_OCCUPANCY_STATES: ["DRAFT", "ESCORT_ASSIGNED", "DISPATCHED"]
    precision: "Whole minutes"
    boundary_semantics: "HALF-OPEN interval: a trip starting exactly TRANSPORT_SLOT_MINUTES minutes after another starts does NOT conflict (adjacency is legal); one minute earlier DOES conflict."

  - name: medication_schedule_overlap
    trigger: "On POST /medication-orders, after the OCC check and the supersede step"
    algorithm: interval_merge
    formula: |
      # An order occupies a CLOSED calendar-date interval on the (inmate, drug_class) pair:
      #     span(o) = [ o.start_date calendar date , o.end_date calendar date ]
      occupied = MedicationOrder rows for this inmate with status == "ACTIVE",
                 the same drug_class, and a DIFFERENT drug_name
      conflict = any o in occupied such that
                 new.start_date calendar date <= o.end_date calendar date
                 and o.start_date calendar date <= new.end_date calendar date
    input_set: "ACTIVE MedicationOrder rows of the same inmate and drug_class with a different drug_name. Same-drug_name orders are handled by the supersede rule instead and never conflict."
    constants:
      MEDICATION_OVERLAP_STATES: ["ACTIVE"]
    precision: "Whole calendar days"
    boundary_semantics: "CLOSED interval: two orders that share exactly one endpoint date (new.start_date == existing.end_date) DO conflict. Starting one day later does NOT conflict."

  - name: bridge_supply_days
    trigger: "On POST /inmates/{id}/release-plans and recomputed on POST /release-plans/{id}/finalize"
    algorithm: waterfall_allocation
    formula: |
      eligible = MedicationOrder rows for this inmate with status in {ACTIVE, HELD},
                 sorted by MedicationOrder.created_at ascending
      if plan.release_type == "SCHEDULED":
          table = BRIDGE_SUPPLY_DAYS_SCHEDULED
      else:
          table = BRIDGE_SUPPLY_DAYS_UNEXPECTED
      lines = []
      for order in eligible:
          days_left_on_order = max(0,
              (order.end_date calendar date - plan.planned_release_at calendar date) in whole days + 1)
          days = min(table[order.drug_class], days_left_on_order)
          lines.append({ order_id: order.id, drug_class: order.drug_class, days: days })
      bridge_supply_total_days = sum(line.days for line in lines)
      bridge_supply_lines = lines
      reentry_referral_required = any ChronicCareEnrollment for this inmate with
                                  status == "ACTIVE" and tier in REENTRY_REFERRAL_REQUIRED_TIERS
    input_set: "MedicationOrder rows with status in {ACTIVE, HELD} only; DISCONTINUED and COMPLETED orders are excluded. ChronicCareEnrollment rows with status ACTIVE only."
    constants:
      BRIDGE_SUPPLY_DAYS_SCHEDULED: { PSYCHOTROPIC: 30, CONTROLLED: 7, CHRONIC_MAINTENANCE: 30, ACUTE_SHORT_COURSE: 10 }
      BRIDGE_SUPPLY_DAYS_UNEXPECTED: { PSYCHOTROPIC: 7, CONTROLLED: 0, CHRONIC_MAINTENANCE: 7, ACUTE_SHORT_COURSE: 3 }
      BRIDGE_SUPPLY_LEAD_DAYS: 7
      REENTRY_REFERRAL_REQUIRED_TIERS: ["TIER_1", "TIER_2"]
    precision: "Integer days"
    boundary_semantics: "days_left_on_order is INCLUSIVE of both planned_release_at's date and end_date. A SCHEDULED plan must be created at least BRIDGE_SUPPLY_LEAD_DAYS days before planned_release_at; exactly 7 days ahead is ACCEPTED. UNEXPECTED plans are exempt from the lead-time rule."
    variants:
      - name: SCHEDULED_RELEASE_FULL_BRIDGE
        when: "plan.release_type == SCHEDULED"
        difference: "Uses the generous table: 30 days for PSYCHOTROPIC and CHRONIC_MAINTENANCE, 7 for CONTROLLED, 10 for ACUTE_SHORT_COURSE."
      - name: UNEXPECTED_RELEASE_TRUNCATED_BRIDGE
        when: "plan.release_type == UNEXPECTED"
        difference: "Uses the truncated table: 7 days for PSYCHOTROPIC and CHRONIC_MAINTENANCE, ZERO for CONTROLLED, 3 for ACUTE_SHORT_COURSE. Identical medication lists therefore produce different bridge_supply_total_days."

  - name: mortality_review_due_at
    trigger: "On MortalityReview creation from the Inmate death event"
    algorithm: threshold
    formula: |
      due_at = review.death_at + MORTALITY_REVIEW_DUE_DAYS days
      closed_late = (review.closed_at is not null) and (review.closed_at > due_at)
    input_set: "The single MortalityReview row."
    constants:
      MORTALITY_REVIEW_DUE_DAYS: 30
      MORTALITY_CORRECTIVE_ACTION_MIN: 1
    precision: "Whole seconds"
    boundary_semantics: "closed_late requires STRICTLY after due_at. A review closed exactly at due_at is on time. A review may not be CLOSED until corrective_action_count >= MORTALITY_CORRECTIVE_ACTION_MIN."

  - name: dose_partition_conservation
    trigger: "Evaluated on GET /medication-orders/{id}/administrations and after every hold/resume compensating pair"
    algorithm: aggregation
    formula: |
      total_created = count of MedicationAdministration rows whose order_id == this order
      partition = count(outcome == "SCHEDULED") + count(outcome == "ADMINISTERED")
                + count(outcome == "REFUSED")   + count(outcome == "MISSED")
                + count(outcome == "VOIDED")
      # INVARIANT-2 (dose count): partition == total_created at all times.
    input_set: "All MedicationAdministration rows under the order, unfiltered."
    constants:
      DOSE_PARTITION_STATES: ["SCHEDULED", "ADMINISTERED", "REFUSED", "MISSED", "VOIDED"]
    precision: "Integer counts"
    conservation_invariant: |
      INVARIANT-2 (dose count): for every MedicationOrder, the five outcome buckets partition
      the order's administrations exactly - no row is ever double-counted or dropped. The
      compensating pair is POST /medication-orders/{id}/hold-status with held true followed by
      POST /medication-orders/{id}/hold-status with held false: after both, every bucket count is byte-identical
      to its pre-hold value, and consecutive_missed_count and consecutive_refused_count are
      likewise unchanged.

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (single explicit priority ladder, 14 rungs)
#
# Checks run in ascending `priority`. The FIRST rule that fails determines the
# response; no later rule is evaluated. The ladder below names the 14 rungs and
# the priority band each occupies.
# ---------------------------------------------------------------------------

validation_priority_ladder:
  - rung: 1
    name: authentication
    priorities: "1"
    summary: "Headers present and well formed."
  - rung: 2
    name: role_authorization
    priorities: "2"
    summary: "X-User-Role is permitted to call this endpoint at all."
  - rung: 3
    name: resource_ownership
    priorities: "3"
    summary: "An entity-backed actor may only touch its own rows."
  - rung: 4
    name: existence
    priorities: "4-6"
    summary: "Path and body references resolve, validated left-to-right."
  - rung: 5
    name: records_write_gate
    priorities: "7"
    summary: "The global clinical-records freeze. Pre-empts every rung below it."
  - rung: 6
    name: custody_gate
    priorities: "8"
    summary: "The inmate must still be IN_CUSTODY for custody-dependent operations."
  - rung: 7
    name: optimistic_concurrency
    priorities: "9"
    summary: "expected_*_version must match the parent's current version."
  - rung: 8
    name: payload_shape
    priorities: "10-12"
    summary: "Required fields, types, enum membership, numeric ranges."
  - rung: 9
    name: target_state
    priorities: "13-16"
    summary: "The target row itself is in a state that permits this transition."
  - rung: 10
    name: cross_entity_state
    priorities: "17-19"
    summary: "A DIFFERENT entity's state permits this transition."
  - rung: 11
    name: clinical_safety
    priorities: "20-22"
    summary: "DOT/KOP observation discipline and intake-screening compliance gates."
  - rung: 12
    name: segregation_of_duties
    priorities: "23-24"
    summary: "The acting user is not the same person who performed the conflicting step."
  - rung: 13
    name: temporal_windows
    priorities: "25-29"
    summary: "Filing windows, escalation windows, lead times, cancellation cutoffs."
  - rung: 14
    name: caps_uniqueness_and_interval_occupancy
    priorities: "30-36"
    summary: "Counter caps, uniqueness keys, fiscal reversibility and resource-interval collisions - checked last."

validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, and X-User-Role is one of the nine declared role names"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role named in X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "When X-User-Role is Inmate, X-User-ID equals the inmate_id of the addressed resource (directly, or transitively through its parent chain)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Inmate-role endpoints"

  - priority: 4
    category: existence
    check: "The Inmate named by the path segment or by the body inmate_id exists"
    error_id: ERR_INMATE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying an inmate id"

  - priority: 5
    category: existence
    check: "The SpecialtyReferral, UtilizationReview or TransportOrder named in the path or body exists"
    error_id: ERR_REFERRAL_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "/specialty-referrals/*, /utilization-reviews/*, /transport-orders/*"

  - priority: 6
    category: existence
    check: "The IntakeScreening, ChronicCareEnrollment, SickCallRequest, MedicationOrder, MedicationAdministration, CopayCharge, Grievance, ReleasePlan or MortalityReview named in the path or body exists"
    error_id: ERR_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "all remaining sub-resource endpoints"

  - priority: 7
    category: state
    check: "Inmate.records_state == OPEN. This is the global clinical-records write gate: it pre-empts every rung below, so a frozen inmate returns ERR_RECORDS_FROZEN even when the same request also has a malformed payload, a bad state, or an expired window."
    error_id: ERR_RECORDS_FROZEN
    http_status: 409
    applies_to: "every mutating clinical, referral, medication, sick-call, chronic-care, intake and copay endpoint; NOT applied to POST /inmates/{id}/records-unfreeze, to grievance endpoints, or to mortality-review endpoints"

  - priority: 8
    category: state
    check: "Inmate.custody_status == IN_CUSTODY"
    error_id: ERR_INMATE_NOT_IN_CUSTODY
    http_status: 409
    applies_to: "POST /sick-call-requests, POST /inmates/{id}/chronic-care-enrollments, POST /medication-orders, POST /specialty-referrals, POST /transport-orders/{id}/dispatch, POST /medication-orders/{id}/hold-status"

  - priority: 9
    category: business_constraint
    check: "The expected_inmate_version (or expected_referral_version) in the body equals the parent's current version integer"
    error_id: ERR_STALE_INMATE_VERSION
    http_status: 412
    applies_to: "POST /medication-orders (ERR_STALE_INMATE_VERSION), POST /transport-orders (ERR_STALE_REFERRAL_VERSION)"

  - priority: 10
    category: business_constraint
    check: "Every field marked required in the endpoint's input list is present and non-null"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 11
    category: business_constraint
    check: "Every supplied value matches its declared JSON type, integers fall inside their declared ranges (doses_per_day between 1 and 4 inclusive; pagination limit between 1 and 100 inclusive; offset >= 0), and end_date >= start_date on MedicationOrder"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 12
    category: business_constraint
    check: "Every supplied enum-typed value is a member of that field's declared constraint set (custody_level, admission_type, screening_type, severity, condition_code, acuity, encounter_type, drug_class, route_mode, urgency, specialty, decision, peer_decision, outcome, release_type, manner, entry_type, cancel_reason, escort_level)"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all endpoints accepting an enum-typed field"

  - priority: 13
    category: state
    check: "The addressed row's own status/outcome equals a declared `from:` state of the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 14
    category: state
    check: "A re-triage supplies an acuity different from the request's stored acuity"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /sick-call-requests/{id}/triage"

  - priority: 15
    category: state
    check: "POST /inmates/{id}/death-event is refused when a MortalityReview already exists for this inmate"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /inmates/{id}/death-event"

  - priority: 16
    category: state
    check: "MortalityReview may not be CLOSED while corrective_action_count is strictly less than MORTALITY_CORRECTIVE_ACTION_MIN"
    error_id: ERR_MORTALITY_REVIEW_INCOMPLETE
    http_status: 422
    applies_to: "POST /mortality-reviews/{id}/close"

  - priority: 17
    category: business_referential
    check: "The parent MedicationOrder.status == ACTIVE when recording an administration outcome. A HELD, DISCONTINUED or COMPLETED order refuses the record even though the administration row itself is legally SCHEDULED."
    error_id: ERR_ORDER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /medication-administrations/{id}/record"

  - priority: 18
    category: business_referential
    check: "The parent SpecialtyReferral.status == AUTHORIZED when creating a TransportOrder, and == AUTHORIZED when assigning an escort"
    error_id: ERR_REFERRAL_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /transport-orders, POST /transport-orders/{id}/assign-escort"

  - priority: 19
    category: business_referential
    check: "POST /inmates/{id}/release requires a ReleasePlan for this inmate with status == FINALIZED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /inmates/{id}/release"

  - priority: 20
    category: business_safety
    check: "When the recorded outcome is ADMINISTERED and the parent MedicationOrder.route_mode == DOT, observed_swallow must be present and boolean in the record body. REFUSED and MISSED outcomes never require it."
    error_id: ERR_DOT_OBSERVATION_REQUIRED
    http_status: 422
    applies_to: "POST /medication-administrations/{id}/record"

  - priority: 21
    category: business_safety
    check: "When the parent MedicationOrder.route_mode == KOP, observed_swallow must be absent from the record body for every outcome"
    error_id: ERR_KOP_OBSERVATION_FORBIDDEN
    http_status: 422
    applies_to: "POST /medication-administrations/{id}/record"

  - priority: 22
    category: business_safety
    check: "The inmate has no IntakeScreening row with screening_type RECEIVING and status OVERDUE. An overdue receiving screening gates all downstream clinical ordering."
    error_id: ERR_INTAKE_SCREENING_OVERDUE
    http_status: 422
    applies_to: "POST /medication-orders, POST /specialty-referrals, POST /inmates/{id}/chronic-care-enrollments"

  - priority: 23
    category: business_safety
    check: "The X-User-ID recording a medication administration differs from MedicationOrder.prescriber_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /medication-administrations/{id}/record"

  - priority: 24
    category: business_safety
    check: "The X-User-ID deciding a peer review differs from UtilizationReview.decided_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /utilization-reviews/{id}/peer-decide"

  - priority: 25
    category: business_temporal
    check: "Peer-review escalation requires current_clock <= UtilizationReview.decided_at + UR_PEER_REVIEW_WINDOW_HOURS hours (equality is inside the window)"
    error_id: ERR_PEER_REVIEW_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /utilization-reviews/{id}/escalate-peer-review"

  - priority: 26
    category: business_temporal
    check: "Filing a Grievance requires current_clock <= grieved_event_at + GRIEVANCE_FILING_WINDOW_DAYS[INFORMAL] days; escalating requires current_clock <= the prior decided instant + GRIEVANCE_FILING_WINDOW_DAYS[next stage] days. Equality is inside the window in both cases."
    error_id: ERR_GRIEVANCE_FILING_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /inmates/{id}/grievances, POST /grievances/{id}/escalate"

  - priority: 27
    category: business_temporal
    check: "TransportOrder creation requires lead_minutes >= required_lead_minutes from calculations.transport_lead_time_requirement (equality accepted)"
    error_id: ERR_TRANSPORT_LEAD_TIME_TOO_SHORT
    http_status: 422
    applies_to: "POST /transport-orders"

  - priority: 28
    category: business_temporal
    check: "TransportOrder cancellation requires current_clock <= appointment_at - TRANSPORT_CANCEL_CUTOFF_MINUTES minutes (equality still cancellable)"
    error_id: ERR_CANCEL_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /transport-orders/{id}/cancel"

  - priority: 29
    category: business_temporal
    check: "A ReleasePlan with release_type SCHEDULED requires planned_release_at >= current_clock + BRIDGE_SUPPLY_LEAD_DAYS days (equality accepted). UNEXPECTED plans are exempt."
    error_id: ERR_RELEASE_PLAN_LEAD_TIME
    http_status: 422
    applies_to: "POST /inmates/{id}/release-plans"

  - priority: 30
    category: business_constraint
    check: "retriage_count is strictly less than MAX_RETRIAGE_COUNT before a re-triage is accepted"
    error_id: ERR_MAX_RETRIAGE_EXCEEDED
    http_status: 409
    applies_to: "POST /sick-call-requests/{id}/triage"

  - priority: 31
    category: business_constraint
    check: "defer_count is strictly less than UR_MAX_DEFERRALS before a DEFER decision is accepted"
    error_id: ERR_MAX_DEFERRALS_EXCEEDED
    http_status: 409
    applies_to: "POST /utilization-reviews/{id}/decide"

  - priority: 32
    category: business_constraint
    check: "remand_count is strictly less than GRIEVANCE_MAX_REMANDS before a remand is accepted"
    error_id: ERR_MAX_REMANDS_EXCEEDED
    http_status: 409
    applies_to: "POST /grievances/{id}/remand"

  - priority: 33
    category: business_constraint
    check: "The escort_level supplied on assign-escort equals TransportOrder.required_escort_level exactly. The no-show cap needs no separate rule here: reaching MAX_NO_SHOW_COUNT CANCELS the referral through CASCADE-D L3, and priority 18 then refuses any further trip."
    error_id: ERR_ESCORT_LEVEL_MISMATCH
    http_status: 422
    applies_to: "POST /transport-orders/{id}/assign-escort"

  - priority: 34
    category: business_fiscal
    check: "booking_number is unique across Inmate rows; at most one ChronicCareEnrollment with status ACTIVE per (inmate_id, condition_code) pair; a CopayCharge is reversible only while its status is POSTED or DEBT_LIEN"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /inmates and POST /inmates/{id}/chronic-care-enrollments (ERR_DUPLICATE_KEY); POST /grievances/{id}/decide (ERR_CHARGE_NOT_REVERSIBLE when the subject charge is already WAIVED or REVERSED)"

  - priority: 35
    category: business_constraint
    check: "calculations.medication_schedule_overlap finds no ACTIVE order of the same inmate and drug_class, with a different drug_name, whose CLOSED [start_date, end_date] calendar-date span intersects the new order's span"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /medication-orders"

  - priority: 36
    category: business_constraint
    check: "calculations.transport_slot_overlap finds no DRAFT / ESCORT_ASSIGNED / DISPATCHED trip for the same inmate whose HALF-OPEN [appointment_at, appointment_at + TRANSPORT_SLOT_MINUTES) slot intersects the new trip's slot"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /transport-orders"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------

endpoints:

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [HealthServicesAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Sets the logical clock to to_iso8601."
      - "Sweep step 1: every IntakeScreening with status PENDING whose due_at is strictly before the new clock instant transitions to OVERDUE."
      - "Sweep step 2 (runs after step 1): every ChronicCareEnrollment with status ACTIVE whose next_due_date plus CHRONIC_LAPSE_GRACE_DAYS days is strictly before the new clock instant transitions to LAPSED."

  - method: POST
    path: "/inmates"
    description: "Book an inmate into the facility."
    roles: [IntakeOfficer]
    code: 201
    input: [booking_number, full_name, facility_code, custody_level, booked_at, "admission_type?", "prior_full_assessment_at?", "scheduled_release_date?"]
    output: Inmate
    side_effects:
      - "Initializes custody_status IN_CUSTODY, records_state OPEN, account_balance_cents 0, version 1. indigent_flag is read-time: with an empty ledger the peak stands in as the balance 0, so the response carries indigent_flag true."
      - "No IntakeScreening is auto-created; the screenings are created explicitly."

  - method: GET
    path: "/inmates/{id}"
    description: "Read one inmate, including the recomputed account_balance_cents, indigent_flag, open_sick_call_count, no_show_count and version."
    roles: [IntakeOfficer, Nurse, Provider, HealthServicesAdmin, GrievanceCoordinator, Inmate]
    code: 200
    input: []
    output: Inmate
    side_effects: []

  - method: POST
    path: "/inmates/{id}/release"
    description: "Release an inmate from custody. CASCADE-B origin."
    roles: [HealthServicesAdmin]
    code: 200
    input: []
    output: Inmate
    side_effects:
      - "Inmate custody_status IN_CUSTODY -> RELEASED."
      - "CASCADE-B L1: the FINALIZED ReleasePlan transitions to EXECUTED and records_packet_ready becomes true."
      - "CASCADE-B L2: every MedicationOrder with status in {ACTIVE, HELD} transitions to COMPLETED."
      - "CASCADE-B L3: every SCHEDULED MedicationAdministration under those orders transitions to VOIDED."
      - "Every ACTIVE ChronicCareEnrollment transitions to RESOLVED; every open SickCallRequest transitions to CANCELLED."
      - "increments Inmate.version by 1"

  - method: POST
    path: "/inmates/{id}/death-event"
    description: "Record an in-custody death. CASCADE-A origin; opens the statutory mortality review and freezes the clinical record."
    roles: [HealthServicesAdmin]
    code: 201
    input: [death_at, manner]
    output: MortalityReview
    side_effects:
      - "CASCADE-A L1..L5 as declared on the Inmate IN_CUSTODY -> DECEASED transition."
      - "Creates the MortalityReview returned in the response body with status OPEN and due_at from calculations.mortality_review_due_at."
      - "increments Inmate.version by 1"

  - method: POST
    path: "/inmates/{id}/records-freeze"
    description: "Place a litigation hold on the clinical record without changing custody_status."
    roles: [HealthServicesAdmin]
    code: 200
    input: []
    output: Inmate
    side_effects:
      - "records_state OPEN -> FROZEN; custody_status is unchanged."
      - "increments Inmate.version by 1"

  - method: POST
    path: "/inmates/{id}/records-unfreeze"
    description: "Lift a litigation hold. Refused for a DECEASED inmate, whose freeze is permanent."
    roles: [HealthServicesAdmin]
    code: 200
    input: []
    output: Inmate
    side_effects:
      - "records_state FROZEN -> OPEN; custody_status is unchanged."
      - "increments Inmate.version by 1"

  - method: POST
    path: "/inmates/{id}/intake-screenings"
    description: "Open a RECEIVING or FULL_ASSESSMENT intake screening. due_at is computed once by calculations.intake_screening_due_at and never recomputed."
    roles: [IntakeOfficer, Nurse]
    code: 201
    input: [screening_type]
    output: IntakeScreening
    side_effects:
      - "Computes due_at from calculations.intake_screening_due_at using the inmate's admission_type, booked_at and prior_full_assessment_at."
      - "Initializes status PENDING."

  - method: GET
    path: "/inmates/{id}/intake-screenings"
    description: "List the intake screenings of one inmate."
    roles: [IntakeOfficer, Nurse, Provider, HealthServicesAdmin]
    code: 200
    input: ["screening_type?", "status?", "limit?", "offset?"]
    output: IntakeScreening[]
    side_effects: []

  - method: POST
    path: "/intake-screenings/{id}/disposition"
    description: "Record the outcome of an intake screening: COMPLETED (with findings) or REFUSED."
    roles: [Nurse]
    code: 200
    input: [disposition, "findings_code?"]
    output: IntakeScreening
    side_effects:
      - "disposition COMPLETED: status -> COMPLETED, completed_at set to the clock, completed_late set by comparing completed_at to due_at (strictly after == late), and for FULL_ASSESSMENT the Inmate.prior_full_assessment_at is set."
      - "disposition REFUSED: status -> REFUSED, completed_at stays null."
      - "increments IntakeScreening.version by 1"

  - method: POST
    path: "/inmates/{id}/chronic-care-enrollments"
    description: "Enrol an inmate in chronic-care management. Tier, periodicity and next_due_date are derived."
    roles: [Provider]
    code: 201
    input: [condition_code, severity]
    output: ChronicCareEnrollment
    side_effects:
      - "Sets tier and periodicity_days via calculations.chronic_tier_assignment."
      - "Sets enrolled_at to the clock and next_due_date via calculations.chronic_care_next_due_date."
      - "Initializes status ACTIVE, missed_visit_count 0, escalated false."

  - method: GET
    path: "/inmates/{id}/chronic-care-enrollments"
    description: "List the chronic-care enrollments of one inmate."
    roles: [Provider, Nurse, HealthServicesAdmin]
    code: 200
    input: ["status?", "condition_code?", "limit?", "offset?"]
    output: ChronicCareEnrollment[]
    side_effects: []

  - method: GET
    path: "/chronic-care-enrollments/{id}"
    description: "Read one chronic-care enrollment with its derived tier, periodicity_days and next_due_date."
    roles: [Provider, Nurse, HealthServicesAdmin]
    code: 200
    input: []
    output: ChronicCareEnrollment
    side_effects: []

  - method: POST
    path: "/chronic-care-enrollments/{id}/re-enroll"
    description: "Re-enrol a LAPSED enrollment. Cycle edge LAPSED -> ACTIVE."
    roles: [Provider]
    code: 200
    input: [severity]
    output: ChronicCareEnrollment
    side_effects:
      - "status LAPSED -> ACTIVE; enrolled_at reset to the clock; last_visit_at reset to null."
      - "tier, periodicity_days and next_due_date recomputed; missed_visit_count and escalated reset."
      - "increments ChronicCareEnrollment.version by 1"

  - method: POST
    path: "/chronic-care-enrollments/{id}/visits"
    description: "Record a chronic-care visit outcome. A MISSED outcome can escalate the tier."
    roles: [Nurse]
    code: 201
    input: [outcome]
    output: ChronicCareVisit
    side_effects:
      - "Creates the ChronicCareVisit with due_at_snapshot copied from the enrollment's current next_due_date."
      - "Applies the per-outcome enrollment updates declared on the ChronicCareEnrollment ACTIVE -> ACTIVE transition."
      - "increments ChronicCareEnrollment.version by 1"

  - method: GET
    path: "/chronic-care-enrollments/{id}/visits"
    description: "List the visits recorded against one enrollment, ordered by recorded_at ascending."
    roles: [Nurse, Provider, HealthServicesAdmin]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: ChronicCareVisit[]
    side_effects: []

  - method: POST
    path: "/sick-call-requests"
    description: "Submit a sick-call slip. Inmates submit their own; a Nurse may submit a staff-initiated slip on an inmate's behalf."
    roles: [Inmate, Nurse]
    code: 201
    input: [inmate_id, complaint_text, "encounter_type?"]
    output: SickCallRequest
    side_effects:
      - "Sets submitted_at to the clock, status SUBMITTED, acuity null, response_deadline_at null."
      - "Inmate.open_sick_call_count is a read-time projection and therefore changes without advancing Inmate.version."

  - method: GET
    path: "/sick-call-requests"
    description: "List sick-call requests. sla_breached is evaluated at read time by calculations.sick_call_sla_breach."
    roles: [Nurse, Provider, HealthServicesAdmin, Inmate]
    code: 200
    input: ["inmate_id?", "copay_charge_id?", "status?", "acuity?", "limit?", "offset?"]
    output: SickCallRequest[]
    side_effects: []

  - method: GET
    path: "/sick-call-requests/{id}"
    description: "Read one sick-call request with its read-time sla_breached value."
    roles: [Nurse, Provider, HealthServicesAdmin, Inmate]
    code: 200
    input: []
    output: SickCallRequest
    side_effects: []

  - method: POST
    path: "/sick-call-requests/{id}/triage"
    description: "Triage or re-triage a sick-call request. Recomputes the response deadline; the anchor depends on whether the acuity moved up or down."
    roles: [Nurse]
    code: 200
    input: [acuity]
    output: SickCallRequest
    side_effects:
      - "First triage: status SUBMITTED -> TRIAGED, deadline_anchor_at = submitted_at."
      - "Re-triage: retriage_count incremented; deadline_anchor_at = submitted_at on an UPGRADE, = the current clock on a DOWNGRADE."
      - "response_deadline_at recomputed by calculations.sick_call_response_deadline."
      - "increments SickCallRequest.version by 1"

  - method: POST
    path: "/sick-call-requests/{id}/schedule"
    description: "Book the triaged request into a clinic slot. The response deadline is NOT recomputed."
    roles: [Nurse]
    code: 200
    input: []
    output: SickCallRequest
    side_effects:
      - "status TRIAGED -> SCHEDULED."
      - "increments SickCallRequest.version by 1"

  - method: POST
    path: "/sick-call-requests/{id}/see"
    description: "Record that the provider saw the patient. Posts the co-pay charge through calculations.copay_amount."
    roles: [Provider]
    code: 200
    input: []
    output: SickCallRequest
    side_effects:
      - "status SCHEDULED -> SEEN; seen_at set to the clock, freezing the SLA resolution instant."
      - "Creates one CopayCharge and sets copay_charge_id; posts the matching LedgerEntry unless the variant is EXEMPT."
      - "Recomputes Inmate.account_balance_cents."
      - "increments SickCallRequest.version by 1"
      - "increments Inmate.version by 1 when a LedgerEntry was appended (FUNDED or INDIGENT variant); an EXEMPT encounter leaves Inmate.version unchanged"

  - method: POST
    path: "/sick-call-requests/{id}/close"
    description: "Close a seen encounter."
    roles: [Provider]
    code: 200
    input: []
    output: SickCallRequest
    side_effects:
      - "status SEEN -> CLOSED."
      - "increments SickCallRequest.version by 1"

  - method: POST
    path: "/medication-orders"
    description: "Write a medication order. Guarded by OCC on Inmate.version because a new order for the same drug_name supersedes the prior ACTIVE order."
    roles: [Provider]
    code: 201
    input: [inmate_id, drug_name, drug_class, route_mode, doses_per_day, start_date, end_date, expected_inmate_version]
    output: MedicationOrder
    side_effects:
      - "Rejects with ERR_STALE_INMATE_VERSION (412) when expected_inmate_version differs from Inmate.version."
      - "Any existing MedicationOrder for the same inmate_id and drug_name with status ACTIVE transitions to DISCONTINUED, voiding its SCHEDULED administrations."
      - "Rejects with ERR_SCHEDULE_CONFLICT (409) when calculations.medication_schedule_overlap finds a colliding ACTIVE order of the same drug_class with a different drug_name."
      - "Sets prescriber_user_id to X-User-ID; initializes status ACTIVE, counters 0, adherence_pct 0.00, units_dispensed 0, units_returned 0, forced_dot false."
      - "increments Inmate.version by 1"

  - method: GET
    path: "/medication-orders"
    description: "List medication orders with filters and pagination."
    roles: [Provider, Nurse, HealthServicesAdmin]
    code: 200
    input: ["inmate_id?", "status?", "route_mode?", "drug_class?", "limit?", "offset?"]
    output: MedicationOrder[]
    side_effects: []

  - method: GET
    path: "/medication-orders/{id}"
    description: "Read one medication order with its current adherence_pct, consecutive counters and escalation flag."
    roles: [Provider, Nurse, HealthServicesAdmin]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: []

  - method: POST
    path: "/medication-orders/{id}/hold-status"
    description: "Hold or resume an order. Hold and resume form the compensating pair that INVARIANT-2 constrains."
    roles: [Provider]
    code: 200
    input: [held]
    output: MedicationOrder
    side_effects:
      - "held true: status ACTIVE -> HELD. held false: status HELD -> ACTIVE."
      - "Neither direction touches consecutive_missed_count, consecutive_refused_count, adherence_pct, or any MedicationAdministration outcome."
      - "increments MedicationOrder.version by 1"

  - method: POST
    path: "/medication-orders/{id}/discontinue"
    description: "Discontinue an order; voids its remaining scheduled doses and recomputes adherence over the reduced denominator."
    roles: [Provider]
    code: 200
    input: []
    output: MedicationOrder
    side_effects:
      - "status {ACTIVE, HELD} -> DISCONTINUED."
      - "Every SCHEDULED MedicationAdministration under the order transitions to VOIDED."
      - "adherence_pct recomputed by calculations.medication_adherence_pct."
      - "increments MedicationOrder.version by 1"

  - method: POST
    path: "/medication-orders/{id}/pill-count"
    description: "Record a KOP pill count. Only meaningful for KOP orders; drives the KOP adherence variant."
    roles: [Nurse]
    code: 200
    input: [units_dispensed_delta, units_returned_delta]
    output: MedicationOrder
    side_effects:
      - "Adds units_dispensed_delta to units_dispensed and units_returned_delta to units_returned."
      - "Recomputes adherence_pct by calculations.medication_adherence_pct."
      - "increments MedicationOrder.version by 1"

  - method: POST
    path: "/medication-orders/{id}/administrations"
    description: "Schedule one dose row on the MAR."
    roles: [Nurse]
    code: 201
    input: [scheduled_at]
    output: MedicationAdministration
    side_effects:
      - "Creates the row with outcome SCHEDULED, acted_at null, timing_class null."

  - method: GET
    path: "/medication-orders/{id}/administrations"
    description: "List the MAR rows of one order, ordered by scheduled_at ascending."
    roles: [Nurse, Provider, HealthServicesAdmin]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: MedicationAdministration[]
    side_effects: []

  - method: POST
    path: "/medication-administrations/{id}/record"
    description: "Record the outcome of a scheduled dose. Forks on DOT vs KOP for the required fields and on the outcome for the counter side effects."
    roles: [Nurse]
    code: 200
    input: [outcome, "observed_swallow?", "diversion_observed?"]
    output: MedicationAdministration
    side_effects:
      - "Sets acted_at to the clock and timing_class by calculations.medication_dose_timing_class for ADMINISTERED and MISSED."
      - "ADMINISTERED resets both consecutive counters to 0; REFUSED increments only consecutive_refused_count; MISSED increments only consecutive_missed_count."
      - "Escalation flag set when a counter reaches its escalation constant."
      - "CASCADE-C: diversion_observed true on a KOP order forces route_mode to DOT, sets forced_dot true, and switches adherence_pct to the DOT variant."
      - "increments MedicationOrder.version by 1"

  - method: POST
    path: "/specialty-referrals"
    description: "Request an off-site specialty consult."
    roles: [Provider]
    code: 201
    input: [inmate_id, specialty, urgency]
    output: SpecialtyReferral
    side_effects:
      - "Sets requested_at to the clock; initializes status REQUESTED, no_show_count 0, version 1."

  - method: GET
    path: "/specialty-referrals"
    description: "List specialty referrals with filters and pagination."
    roles: [Provider, UtilizationReviewer, PeerReviewer, CustodyOfficer, HealthServicesAdmin]
    code: 200
    input: ["inmate_id?", "status?", "urgency?", "limit?", "offset?"]
    output: SpecialtyReferral[]
    side_effects: []

  - method: GET
    path: "/specialty-referrals/{id}"
    description: "Read one referral, including the version needed for the transport-order OCC check."
    roles: [Provider, UtilizationReviewer, PeerReviewer, CustodyOfficer, HealthServicesAdmin]
    code: 200
    input: []
    output: SpecialtyReferral
    side_effects: []

  - method: POST
    path: "/specialty-referrals/{id}/submit-for-review"
    description: "Open utilization review on a referral. Returns the newly created UtilizationReview."
    roles: [Provider]
    code: 201
    input: ["retrospective?"]
    output: UtilizationReview
    side_effects:
      - "SpecialtyReferral status REQUESTED -> PENDING_UR."
      - "Creates the UtilizationReview with status OPEN, opened_at at the clock and turnaround_deadline_at from calculations.ur_turnaround_deadline."
      - "increments SpecialtyReferral.version by 1"

  - method: GET
    path: "/specialty-referrals/{id}/utilization-reviews"
    description: "List the utilization reviews attached to one referral, ordered by opened_at ascending."
    roles: [Provider, UtilizationReviewer, PeerReviewer, HealthServicesAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: UtilizationReview[]
    side_effects: []

  - method: POST
    path: "/utilization-reviews/{id}/decide"
    description: "Record an APPROVE, DENY or DEFER decision. The three branches carry different side-effect sets."
    roles: [UtilizationReviewer]
    code: 200
    input: [decision]
    output: UtilizationReview
    side_effects:
      - "APPROVE: status OPEN -> APPROVED and the parent referral PENDING_UR -> AUTHORIZED."
      - "DENY: status OPEN -> DENIED; the parent referral STAYS PENDING_UR."
      - "DEFER: status OPEN -> DEFERRED, defer_count incremented, turnaround_deadline_at extended by UR_DEFER_EXTENSION_HOURS; the parent referral STAYS PENDING_UR."
      - "Sets decision, decided_at and decided_by_user_id on all three branches."
      - "increments UtilizationReview.version by 1"

  - method: POST
    path: "/utilization-reviews/{id}/supply-information"
    description: "Supply the information a DEFERRED review asked for, reopening it. Cycle edge DEFERRED -> OPEN."
    roles: [Provider]
    code: 200
    input: [information_text]
    output: UtilizationReview
    side_effects:
      - "status DEFERRED -> OPEN; decision and decided_at cleared to null; decided_by_user_id retained."
      - "turnaround_deadline_at keeps its extended value."
      - "increments UtilizationReview.version by 1"

  - method: POST
    path: "/utilization-reviews/{id}/escalate-peer-review"
    description: "Escalate a denial to peer review inside the UR_PEER_REVIEW_WINDOW_HOURS window."
    roles: [Provider]
    code: 200
    input: []
    output: UtilizationReview
    side_effects:
      - "status DENIED -> PEER_REVIEW."
      - "increments UtilizationReview.version by 1"

  - method: POST
    path: "/utilization-reviews/{id}/peer-decide"
    description: "Resolve a peer review. The acting user may not be the reviewer who issued the denial."
    roles: [PeerReviewer]
    code: 200
    input: [peer_decision]
    output: UtilizationReview
    side_effects:
      - "OVERTURN: status PEER_REVIEW -> OVERTURNED and the parent referral PENDING_UR -> AUTHORIZED."
      - "UPHOLD: status PEER_REVIEW -> UPHELD and the parent referral PENDING_UR -> DENIED."
      - "Sets peer_reviewer_user_id to X-User-ID."
      - "increments UtilizationReview.version by 1"

  - method: POST
    path: "/transport-orders"
    description: "Create a custody transport for an AUTHORIZED referral. Guarded by OCC on SpecialtyReferral.version because a new trip supersedes any DRAFT trip already attached."
    roles: [CustodyOfficer]
    code: 201
    input: [referral_id, appointment_at, expected_referral_version]
    output: TransportOrder
    side_effects:
      - "Rejects with ERR_STALE_REFERRAL_VERSION (412) when expected_referral_version differs from SpecialtyReferral.version."
      - "Any existing TransportOrder for the same referral with status DRAFT transitions to CANCELLED with cancel_reason CLINICAL_CHANGE (freeing its slot before the overlap check runs)."
      - "Rejects with ERR_SCHEDULE_CONFLICT (409) when calculations.transport_slot_overlap finds an occupied slot for this inmate."
      - "Sets required_escort_level from calculations.transport_escort_requirement and lead_minutes from calculations.transport_lead_time_requirement; initializes status DRAFT."
      - "increments SpecialtyReferral.version by 1"

  - method: GET
    path: "/specialty-referrals/{id}/transport-orders"
    description: "List the transport orders attached to one referral, ordered by created_at ascending."
    roles: [CustodyOfficer, Provider, HealthServicesAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TransportOrder[]
    side_effects: []

  - method: POST
    path: "/transport-orders/{id}/assign-escort"
    description: "Assign the escort detail. The supplied escort_level must equal required_escort_level exactly."
    roles: [CustodyOfficer]
    code: 200
    input: [escort_level]
    output: TransportOrder
    side_effects:
      - "status DRAFT -> ESCORT_ASSIGNED; assigned_escort_level set."
      - "The parent SpecialtyReferral transitions AUTHORIZED -> SCHEDULED."
      - "increments TransportOrder.version by 1"

  - method: POST
    path: "/transport-orders/{id}/dispatch"
    description: "Dispatch the trip."
    roles: [CustodyOfficer]
    code: 200
    input: []
    output: TransportOrder
    side_effects:
      - "status ESCORT_ASSIGNED -> DISPATCHED."
      - "increments TransportOrder.version by 1"

  - method: POST
    path: "/transport-orders/{id}/outcome"
    description: "Record the trip outcome: COMPLETED or NO_SHOW. CASCADE-D origin on NO_SHOW."
    roles: [CustodyOfficer]
    code: 200
    input: [outcome]
    output: TransportOrder
    side_effects:
      - "COMPLETED: status DISPATCHED -> COMPLETED; the parent referral SCHEDULED -> COMPLETED, which posts a SPECIALTY_OFFSITE CopayCharge and its LedgerEntry and increments Inmate.version by 1."
      - "NO_SHOW: CASCADE-D L1 status DISPATCHED -> NO_SHOW; L2 the referral SCHEDULED -> AUTHORIZED with no_show_count recomputed; L3 the referral AUTHORIZED -> CANCELLED once no_show_count reaches MAX_NO_SHOW_COUNT."
      - "increments TransportOrder.version by 1"

  - method: POST
    path: "/transport-orders/{id}/cancel"
    description: "Cancel a trip before the cancellation cutoff. Does NOT increment no_show_count."
    roles: [CustodyOfficer]
    code: 200
    input: [cancel_reason]
    output: TransportOrder
    side_effects:
      - "status {DRAFT, ESCORT_ASSIGNED, DISPATCHED} -> CANCELLED."
      - "When the parent referral was SCHEDULED it returns to AUTHORIZED; no_show_count is unchanged."
      - "increments TransportOrder.version by 1"

  - method: POST
    path: "/inmates/{id}/copay-charges"
    description: "Post an ad-hoc co-pay charge outside the sick-call flow, using the same three-variant calculations.copay_amount."
    roles: [HealthServicesAdmin]
    code: 201
    input: [encounter_type, "source_sick_call_id?"]
    output: CopayCharge
    side_effects:
      - "Evaluates the exemption test, then indigency on the PRE-CHARGE ledger, then posts amount_cents, charge_variant and status."
      - "Appends the matching LedgerEntry (CHARGE for FUNDED, LIEN for INDIGENT, none for EXEMPT)."
      - "Recomputes Inmate.account_balance_cents."
      - "increments Inmate.version by 1 when a LedgerEntry was appended; an EXEMPT encounter leaves Inmate.version unchanged"

  - method: GET
    path: "/copay-charges"
    description: "List co-pay charges with filters and pagination."
    roles: [HealthServicesAdmin, GrievanceCoordinator, Inmate]
    code: 200
    input: ["inmate_id?", "source_sick_call_id?", "reversal_grievance_id?", "status?", "charge_variant?", "limit?", "offset?"]
    output: CopayCharge[]
    side_effects: []

  - method: GET
    path: "/copay-charges/{id}"
    description: "Read one co-pay charge with its computed amount_cents, charge_variant and indigency_snapshot."
    roles: [HealthServicesAdmin, GrievanceCoordinator, Inmate]
    code: 200
    input: []
    output: CopayCharge
    side_effects: []

  - method: POST
    path: "/inmates/{id}/ledger-entries"
    description: "Post an operator deposit into the inmate trust account. Only entry_type DEPOSIT is accepted here; CHARGE, LIEN and REVERSAL entries are system-generated."
    roles: [HealthServicesAdmin]
    code: 201
    input: [entry_type, amount_cents, "memo?"]
    output: LedgerEntry
    side_effects:
      - "Appends the entry, sets balance_after_cents by calculations.inmate_account_balance."
      - "Recomputes Inmate.account_balance_cents and re-derives Inmate.indigent_flag."
      - "increments Inmate.version by 1"

  - method: GET
    path: "/ledger-entries"
    description: "List ledger entries with filters and pagination, ordered by created_at ascending."
    roles: [HealthServicesAdmin, GrievanceCoordinator, Inmate]
    code: 200
    input: ["inmate_id?", "source_copay_charge_id?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/ledger-entries/{id}"
    description: "Read one ledger entry with its running balance_after_cents."
    roles: [HealthServicesAdmin, GrievanceCoordinator, Inmate]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: POST
    path: "/inmates/{id}/grievances"
    description: "File an informal grievance. Must be filed inside the INFORMAL filing window measured from grieved_event_at."
    roles: [Inmate]
    code: 201
    input: [grievance_text, grieved_event_at, "subject_copay_charge_id?"]
    output: Grievance
    side_effects:
      - "Initializes stage INFORMAL, status FILED, stage_entered_at at the clock, response_due_at via calculations.grievance_response_due, remand_count 0."

  - method: GET
    path: "/grievances"
    description: "List grievances with filters and pagination."
    roles: [GrievanceCoordinator, HealthServicesAdmin, Inmate]
    code: 200
    input: ["inmate_id?", "subject_copay_charge_id?", "stage?", "status?", "limit?", "offset?"]
    output: Grievance[]
    side_effects: []

  - method: GET
    path: "/grievances/{id}"
    description: "Read one grievance with its stage, response_due_at and read-time response_breached value."
    roles: [GrievanceCoordinator, HealthServicesAdmin, Inmate]
    code: 200
    input: []
    output: Grievance
    side_effects: []

  - method: POST
    path: "/grievances/{id}/accept"
    description: "Accept a filed or remanded grievance for review, restarting the stage response window."
    roles: [GrievanceCoordinator]
    code: 200
    input: []
    output: Grievance
    side_effects:
      - "status {FILED, REMANDED} -> UNDER_REVIEW; stage_entered_at reset to the clock; response_due_at recomputed for the current stage."
      - "increments Grievance.version by 1"

  - method: POST
    path: "/grievances/{id}/decide"
    description: "Decide the grievance. CASCADE-E origin: a GRANTED billing grievance reverses the subject co-pay charge."
    roles: [GrievanceCoordinator]
    code: 200
    input: [outcome]
    output: Grievance
    side_effects:
      - "status UNDER_REVIEW -> DECIDED; outcome set."
      - "CASCADE-E L2..L5: GRANTED with a reversible subject charge reverses the charge, appends a REVERSAL LedgerEntry, recomputes Inmate.account_balance_cents, and the read-time Inmate.indigent_flag consequently changes."
      - "increments Grievance.version by 1"
      - "increments Inmate.version by 1 when the reversal fired"

  - method: POST
    path: "/grievances/{id}/escalate"
    description: "Escalate a denied grievance to the next rung. Cycle edge DECIDED -> FILED at a higher stage."
    roles: [Inmate]
    code: 200
    input: []
    output: Grievance
    side_effects:
      - "stage INFORMAL -> FORMAL or FORMAL -> APPEAL; status DECIDED -> FILED; outcome cleared."
      - "stage_entered_at reset to the clock and response_due_at recomputed for the new stage."
      - "increments Grievance.version by 1"

  - method: POST
    path: "/grievances/{id}/remand"
    description: "Remand an appeal back to the formal rung. Cycle edge UNDER_REVIEW -> REMANDED."
    roles: [GrievanceCoordinator]
    code: 200
    input: []
    output: Grievance
    side_effects:
      - "status UNDER_REVIEW -> REMANDED; remand_count incremented; stage APPEAL -> FORMAL."
      - "increments Grievance.version by 1"

  - method: POST
    path: "/grievances/{id}/close"
    description: "Close a decided grievance."
    roles: [GrievanceCoordinator]
    code: 200
    input: []
    output: Grievance
    side_effects:
      - "status DECIDED -> CLOSED."
      - "increments Grievance.version by 1"

  - method: POST
    path: "/grievances/{id}/withdraw"
    description: "Grievant withdraws the grievance."
    roles: [Inmate]
    code: 200
    input: []
    output: Grievance
    side_effects:
      - "status {FILED, UNDER_REVIEW, REMANDED} -> WITHDRAWN; outcome set to WITHDRAWN."
      - "increments Grievance.version by 1"

  - method: POST
    path: "/inmates/{id}/release-plans"
    description: "Open a release plan. Bridge supply is sized by calculations.bridge_supply_days, forked on release_type."
    roles: [HealthServicesAdmin]
    code: 201
    input: [release_type, planned_release_at]
    output: ReleasePlan
    side_effects:
      - "Computes bridge_supply_lines, bridge_supply_total_days and reentry_referral_required."
      - "Initializes status DRAFT and records_packet_ready false."

  - method: GET
    path: "/inmates/{id}/release-plans"
    description: "List the release plans of one inmate, ordered by created_at ascending."
    roles: [HealthServicesAdmin, Inmate]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReleasePlan[]
    side_effects: []

  - method: POST
    path: "/release-plans/{id}/finalize"
    description: "Finalize the plan, recomputing the bridge supply against the medication list as it stands now."
    roles: [HealthServicesAdmin]
    code: 200
    input: []
    output: ReleasePlan
    side_effects:
      - "status DRAFT -> FINALIZED."
      - "Recomputes bridge_supply_lines, bridge_supply_total_days and reentry_referral_required."
      - "increments ReleasePlan.version by 1"

  - method: GET
    path: "/inmates/{id}/mortality-reviews"
    description: "List the mortality reviews of one inmate, ordered by created_at ascending."
    roles: [HealthServicesAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MortalityReview[]
    side_effects: []

  - method: POST
    path: "/mortality-reviews/{id}/corrective-actions"
    description: "Attach a corrective action to an open mortality review."
    roles: [HealthServicesAdmin]
    code: 200
    input: [action_text]
    output: MortalityReview
    side_effects:
      - "Appends the action to corrective_actions, increments corrective_action_count, sets status OPEN -> CORRECTIVE_ACTIONS_ISSUED."
      - "increments MortalityReview.version by 1"

  - method: POST
    path: "/mortality-reviews/{id}/close"
    description: "Close the statutory review. Refused while corrective_action_count is below MORTALITY_CORRECTIVE_ACTION_MIN."
    roles: [HealthServicesAdmin]
    code: 200
    input: []
    output: MortalityReview
    side_effects:
      - "status CORRECTIVE_ACTIONS_ISSUED -> CLOSED; closed_at set to the clock; closed_late set by comparing closed_at to due_at (strictly after == late)."
      - "increments MortalityReview.version by 1"

  - method: GET
    path: "/reports/facility-adherence"
    description: "Facility medication-adherence index from calculations.facility_adherence_index. Response data body is the object { \"facility_code\": string, \"order_count\": integer, \"adherence_index\": number }."
    roles: [HealthServicesAdmin]
    code: 200
    input: [facility_code]
    output: null
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog (32 codes)
# ---------------------------------------------------------------------------

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the nine declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An Inmate-role caller addresses a resource whose inmate_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user is the same person who performed the conflicting step - the prescriber recording their own order's administration, or the denying reviewer resolving their own peer review"
  - id: ERR_INMATE_NOT_FOUND
    http: 404
    condition: "The Inmate named in the path or in the body inmate_id does not exist"
  - id: ERR_REFERRAL_RECORD_NOT_FOUND
    http: 404
    condition: "The SpecialtyReferral, UtilizationReview or TransportOrder named in the path or body does not exist"
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "The IntakeScreening, ChronicCareEnrollment, SickCallRequest, MedicationOrder, MedicationAdministration, CopayCharge, Grievance, ReleasePlan or MortalityReview named in the path or body does not exist"
  - id: ERR_RECORDS_FROZEN
    http: 409
    condition: "A clinical write is attempted while Inmate.records_state == FROZEN"
  - id: ERR_INMATE_NOT_IN_CUSTODY
    http: 409
    condition: "A custody-dependent operation is attempted while Inmate.custody_status != IN_CUSTODY"
  - id: ERR_STALE_INMATE_VERSION
    http: 412
    condition: "expected_inmate_version on POST /medication-orders differs from the Inmate's current version"
  - id: ERR_STALE_REFERRAL_VERSION
    http: 412
    condition: "expected_referral_version on POST /transport-orders differs from the SpecialtyReferral's current version"
  - id: ERR_VALIDATION
    http: 400
    condition: "A required field is missing, a value has the wrong JSON type, a numeric value is outside its declared range, end_date precedes start_date, or a re-triage supplies the acuity the request already carries"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "An enum-typed field carries a value outside its declared constraint set"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The addressed row is not in a declared `from:` state for the requested transition, a second death-event is recorded for the same inmate, or a release is attempted without a FINALIZED ReleasePlan"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "booking_number already exists, or a second ACTIVE ChronicCareEnrollment is requested for the same (inmate_id, condition_code) pair"
  - id: ERR_INTAKE_SCREENING_OVERDUE
    http: 422
    condition: "Clinical ordering is attempted while the inmate has a RECEIVING IntakeScreening in status OVERDUE"
  - id: ERR_MAX_RETRIAGE_EXCEEDED
    http: 409
    condition: "A re-triage is attempted when retriage_count already equals MAX_RETRIAGE_COUNT"
  - id: ERR_DOT_OBSERVATION_REQUIRED
    http: 422
    condition: "observed_swallow is absent while recording an administration on a DOT order"
  - id: ERR_KOP_OBSERVATION_FORBIDDEN
    http: 422
    condition: "observed_swallow is supplied while recording an administration on a KOP order"
  - id: ERR_ORDER_NOT_ACTIVE
    http: 409
    condition: "An administration outcome is recorded while the parent MedicationOrder.status is not ACTIVE"
  - id: ERR_REFERRAL_NOT_AUTHORIZED
    http: 409
    condition: "A TransportOrder is created, or an escort assigned, while the parent SpecialtyReferral.status is not AUTHORIZED"
  - id: ERR_ESCORT_LEVEL_MISMATCH
    http: 422
    condition: "The escort_level supplied on assign-escort differs from the TransportOrder.required_escort_level"
  - id: ERR_TRANSPORT_LEAD_TIME_TOO_SHORT
    http: 422
    condition: "lead_minutes is strictly less than the required_lead_minutes from calculations.transport_lead_time_requirement"
  - id: ERR_CANCEL_CUTOFF_PASSED
    http: 422
    condition: "A transport cancellation is attempted strictly after appointment_at minus TRANSPORT_CANCEL_CUTOFF_MINUTES minutes"
  - id: ERR_MAX_DEFERRALS_EXCEEDED
    http: 409
    condition: "A DEFER decision is recorded when defer_count already equals UR_MAX_DEFERRALS"
  - id: ERR_PEER_REVIEW_WINDOW_EXPIRED
    http: 422
    condition: "Peer-review escalation is attempted strictly after decided_at plus UR_PEER_REVIEW_WINDOW_HOURS hours"
  - id: ERR_GRIEVANCE_FILING_WINDOW_EXPIRED
    http: 422
    condition: "A grievance is filed strictly after grieved_event_at plus the INFORMAL filing window, or escalated strictly after the prior decision plus the next stage's filing window"
  - id: ERR_MAX_REMANDS_EXCEEDED
    http: 409
    condition: "A remand is attempted when remand_count already equals GRIEVANCE_MAX_REMANDS"
  - id: ERR_CHARGE_NOT_REVERSIBLE
    http: 409
    condition: "A GRANTED billing grievance names a subject CopayCharge whose status is already WAIVED or REVERSED"
  - id: ERR_RELEASE_PLAN_LEAD_TIME
    http: 422
    condition: "A SCHEDULED release plan is opened with planned_release_at strictly earlier than the clock plus BRIDGE_SUPPLY_LEAD_DAYS days"
  - id: ERR_MORTALITY_REVIEW_INCOMPLETE
    http: 422
    condition: "A mortality review is closed while corrective_action_count is strictly less than MORTALITY_CORRECTIVE_ACTION_MIN"
  - id: ERR_SCHEDULE_CONFLICT
    http: 409
    condition: "A new MedicationOrder collides with an ACTIVE same-drug_class order on the CLOSED date span, or a new TransportOrder collides with an occupied HALF-OPEN transport slot of the same inmate"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------

roles:
  - name: IntakeOfficer
    description: "Booking desk staff who admit inmates and open receiving screenings"
    identity: "opaque"
    exclusive_operations: ["POST /inmates"]
    shared_operations: ["POST /inmates/{id}/intake-screenings", "GET /inmates/{id}", "GET /inmates/{id}/intake-screenings"]

  - name: Nurse
    description: "Licensed nursing staff: screening disposition, triage, MAR administration, chronic-care visits, pill counts"
    identity: "opaque"
    exclusive_operations:
      - "POST /intake-screenings/{id}/disposition"
      - "POST /sick-call-requests/{id}/triage"
      - "POST /sick-call-requests/{id}/schedule"
      - "POST /chronic-care-enrollments/{id}/visits"
      - "POST /medication-orders/{id}/pill-count"
      - "POST /medication-orders/{id}/administrations"
      - "POST /medication-administrations/{id}/record"
    shared_operations:
      - "POST /sick-call-requests"
      - "POST /inmates/{id}/intake-screenings"
      - "GET /sick-call-requests"
      - "GET /medication-orders"
      - "GET /medication-orders/{id}/administrations"
      - "GET /inmates/{id}/chronic-care-enrollments"
      - "GET /chronic-care-enrollments/{id}/visits"
      - "GET /inmates/{id}"

  - name: Provider
    description: "Physicians, NPs and PAs: prescribing, chronic-care enrollment, referrals, encounter disposition"
    identity: "opaque"
    exclusive_operations:
      - "POST /inmates/{id}/chronic-care-enrollments"
      - "POST /chronic-care-enrollments/{id}/re-enroll"
      - "POST /sick-call-requests/{id}/see"
      - "POST /sick-call-requests/{id}/close"
      - "POST /medication-orders"
      - "POST /medication-orders/{id}/hold-status"
      - "POST /medication-orders/{id}/discontinue"
      - "POST /specialty-referrals"
      - "POST /specialty-referrals/{id}/submit-for-review"
      - "POST /utilization-reviews/{id}/supply-information"
      - "POST /utilization-reviews/{id}/escalate-peer-review"
    shared_operations:
      - "GET /sick-call-requests"
      - "GET /medication-orders"
      - "GET /medication-orders/{id}/administrations"
      - "GET /specialty-referrals"
      - "GET /specialty-referrals/{id}"
      - "GET /specialty-referrals/{id}/utilization-reviews"
      - "GET /specialty-referrals/{id}/transport-orders"
      - "GET /inmates/{id}"

  - name: UtilizationReviewer
    description: "Utilization-management staff who approve, deny or defer off-site care"
    identity: "opaque"
    exclusive_operations: ["POST /utilization-reviews/{id}/decide"]
    shared_operations: ["GET /specialty-referrals", "GET /specialty-referrals/{id}", "GET /specialty-referrals/{id}/utilization-reviews"]

  - name: PeerReviewer
    description: "Independent clinical peer who resolves denials; may never be the reviewer who issued the denial"
    identity: "opaque"
    exclusive_operations: ["POST /utilization-reviews/{id}/peer-decide"]
    shared_operations: ["GET /specialty-referrals", "GET /specialty-referrals/{id}", "GET /specialty-referrals/{id}/utilization-reviews"]

  - name: CustodyOfficer
    description: "Security staff who build, escort, dispatch and close out off-site transports"
    identity: "opaque"
    exclusive_operations:
      - "POST /transport-orders"
      - "POST /transport-orders/{id}/assign-escort"
      - "POST /transport-orders/{id}/dispatch"
      - "POST /transport-orders/{id}/outcome"
      - "POST /transport-orders/{id}/cancel"
    shared_operations: ["GET /specialty-referrals", "GET /specialty-referrals/{id}", "GET /specialty-referrals/{id}/transport-orders"]

  - name: HealthServicesAdmin
    description: "Health services administrator: custody events, records freeze, trust account, release planning, mortality review, reporting, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /inmates/{id}/release"
      - "POST /inmates/{id}/death-event"
      - "POST /inmates/{id}/records-freeze"
      - "POST /inmates/{id}/records-unfreeze"
      - "POST /inmates/{id}/copay-charges"
      - "POST /inmates/{id}/ledger-entries"
      - "POST /inmates/{id}/release-plans"
      - "POST /release-plans/{id}/finalize"
      - "POST /mortality-reviews/{id}/corrective-actions"
      - "POST /mortality-reviews/{id}/close"
      - "GET /inmates/{id}/mortality-reviews"
      - "GET /reports/facility-adherence"
    shared_operations:
      - "GET /inmates/{id}"
      - "GET /inmates/{id}/intake-screenings"
      - "GET /inmates/{id}/chronic-care-enrollments"
      - "GET /chronic-care-enrollments/{id}/visits"
      - "GET /sick-call-requests"
      - "GET /medication-orders"
      - "GET /medication-orders/{id}/administrations"
      - "GET /specialty-referrals"
      - "GET /specialty-referrals/{id}"
      - "GET /specialty-referrals/{id}/utilization-reviews"
      - "GET /specialty-referrals/{id}/transport-orders"
      - "GET /copay-charges"
      - "GET /ledger-entries"
      - "GET /grievances"
      - "GET /inmates/{id}/release-plans"

  - name: GrievanceCoordinator
    description: "Grievance office staff who accept, decide, remand and close grievances"
    identity: "opaque"
    exclusive_operations:
      - "POST /grievances/{id}/accept"
      - "POST /grievances/{id}/decide"
      - "POST /grievances/{id}/remand"
      - "POST /grievances/{id}/close"
    shared_operations: ["GET /grievances", "GET /copay-charges", "GET /ledger-entries", "GET /inmates/{id}"]

  - name: Inmate
    description: "The patient. X-User-ID is the Inmate.id; may act only on their own rows."
    identity: "entity_backed:Inmate"
    exclusive_operations:
      - "POST /inmates/{id}/grievances"
      - "POST /grievances/{id}/escalate"
      - "POST /grievances/{id}/withdraw"
    shared_operations:
      - "POST /sick-call-requests"
      - "GET /sick-call-requests"
      - "GET /copay-charges"
      - "GET /ledger-entries"
      - "GET /grievances"
      - "GET /inmates/{id}"
      - "GET /inmates/{id}/release-plans"
