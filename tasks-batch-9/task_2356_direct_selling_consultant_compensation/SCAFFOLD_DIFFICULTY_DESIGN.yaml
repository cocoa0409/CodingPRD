# =============================================================================
# §1.8 Scaffold Difficulty Design — Direct Selling Consultant Compensation
# 9 rule_ids / 21 instances. Every money literal below was computed by executing
# the §1.3 formulas as code against the pinned fixture inputs.
# Fixture conventions used throughout:
#   plan PLAN-A carries every §1.1 default (point_value_cents 100,
#   payline_min_pv_points 200, pv_bonus bands 500/900/1300 bp, cap 50000,
#   min_payout_cents 2500, seventy_rule_bp 7000, buyback_rate_bp 9000,
#   restock_free_limit_cents 45000, withhold 1000/2500 bp at 20000 cents).
#   jurisdiction TX = 825 bp with facilitator_agreement_active true (tax on SRP).
#   products KIT-STD 9900/14900 (starter kit), SERUM 2000/4000 @20 pts,
#   SAMPLE 100/200 @1 pt, SACHET 100/200 @1 pt, CATALOG 100/200 @0 pts,
#   BOOST 100/200 @30 pts. Logical clock starts at 2026-08-01T00:00:00Z.
#   Genealogy G1 = A -> B -> C with net personal volume 600 / 100 / 2400,
#   A admin-adjusted to DIRECTOR before the period is locked.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: override_compression_dynamic_vs_static_divergence
        grounds:
          - calculations.multilevel_override_payout
          - entities.CommissionStatement.fields.override_total_cents
          - entities.CommissionRun.fields.forfeited_to_company_cents
          - entities.CommissionRun.fields.compression_mode_snapshot
          - state_machines.CommissionRun.CALCULATED_to_DRAFT
          - endpoints[PATCH /direct-selling/compensation-plans/{plan_id}]
        distinguishing_aspect: |
          Entity domain = genealogy override payout on CommissionStatement/CommissionRun.
          The same closed period recalculated under DYNAMIC then STATIC compression pays A
          19200 then 9600 on C's identical 2400 points, and books 0 then 800 cents of
          forfeiture, so the two variants disagree by 9600 cents of payout and 800 cents of
          forfeiture on byte-identical volume data.
        test_recipe:
          setup:
            - "PLAN-A at defaults (compression_mode DYNAMIC), TX jurisdiction, KIT-STD and SERUM catalogued."
            - "Genealogy A -> B -> C; A holds DIRECTOR by admin adjustment, B and C hold CONSULTANT."
            - "Period 2026-08 CLOSED with net personal volume A 600, B 100 (below the 200-point payline), C 2400."
            - "A DRAFT CommissionRun exists for 2026-08 and no statement has been calculated yet."
          setup_api_calls:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /direct-selling/tax-jurisdictions"
              payload: { state_code: "TX", tax_rate_bp: 825, facilitator_agreement_active: true }
              as: PlatformAdmin
            - call: "POST /direct-selling/products"
              payload: { sku: "KIT-STD", name: "Starter Kit", wholesale_price_cents: 9900, srp_cents: 14900, volume_points_per_unit: 0, is_starter_kit: true }
              as: PlatformAdmin
              captures: { kit_id: "$.data.id" }
            - call: "POST /direct-selling/products"
              payload: { sku: "SERUM", name: "Renewal Serum", wholesale_price_cents: 2000, srp_cents: 4000, volume_points_per_unit: 20 }
              as: PlatformAdmin
              captures: { serum_id: "$.data.id" }
            - call: "POST /direct-selling/qualification-periods"
              payload: { compensation_plan_id: "${plan_id}", period_code: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: CommissionAnalyst
              captures: { p8_id: "$.data.id" }
            - call: "POST /direct-selling/enrollment-applications"
              payload: { applicant_email: "ann@ex.test", applicant_full_name: "Ann Root", applicant_state_code: "TX", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}", identity_document_reference: "DOC-ANN" }
              as: PlatformAdmin
              captures: { app_a_id: "$.data.id" }
            - call: "POST /direct-selling/enrollment-applications/${app_a_id}/accept-agreement"
              payload: { agreement_version: "AGR-2026-01" }
              as: Applicant
              as_user_id: "${app_a_id}"
            - call: "POST /direct-selling/enrollment-applications/${app_a_id}/identity-decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /direct-selling/enrollment-applications/${app_a_id}/pay-starter-kit"
              payload: { amount_cents: 11129, payment_reference: "KIT-PAY-ANN" }
              as: PlatformAdmin
            - call: "POST /direct-selling/enrollment-applications/${app_a_id}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { cons_a_id: "$.data.id" }
            - call: "POST /direct-selling/enrollment-applications"
              payload: { applicant_email: "bob@ex.test", applicant_full_name: "Bob Mid", applicant_state_code: "TX", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}", sponsor_consultant_id: "${cons_a_id}", identity_document_reference: "DOC-BOB" }
