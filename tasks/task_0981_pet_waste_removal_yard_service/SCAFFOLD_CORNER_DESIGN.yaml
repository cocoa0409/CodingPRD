scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: customer_creation_required_fields
        claim_type: creation
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /api/customers with full_name+email+phone returns 201 with system-minted id, created_at, updated_at, version=1, account_status=ACTIVE, credit_balance_cents=0"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/customers"
              payload: { full_name: "Z", email: "z@x.com", phone: "+14155550200" }
              as: OperationsManager
              captures: { cu_z: $.data.id, status: $.data.account_status, version: $.data.version }
          assert:
            - "Customer.${cu_z}.account_status == ACTIVE (default applied)"
            - "Customer.${cu_z}.credit_balance_cents == 0"
            - "Customer.${cu_z}.lifetime_visits_completed == 0"
            - "Customer.${cu_z}.version == 1"
            - "Customer.${cu_z}.id matches UUID format"

      - name: customer_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Customer
          - errors[ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /api/customers without email -> 400 ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/customers"
              payload: { full_name: "Z" }
              as: OperationsManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: customer_get_by_id_not_found
        claim_type: not_found
        grounds:
          - entities.Customer
          - errors[ERR_NOT_FOUND
        distinguishing_aspect: "GET /api/customers/<random-uuid> -> 404 ERR_NOT_FOUND"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: OperationsManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: customer_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Customer]
        distinguishing_aspect: "GET /api/customers respects limit/offset and exposes total_count, has_more per envelope contract"
        test_recipe:
          setup: ["Three customers created"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "P1", email: "p1@x.com", phone: "+14155550210" }
              as: OperationsManager
            - call: "POST /api/customers"
              payload: { full_name: "P2", email: "p2@x.com", phone: "+14155550211" }
              as: OperationsManager
            - call: "POST /api/customers"
              payload: { full_name: "P3", email: "p3@x.com", phone: "+14155550212" }
              as: OperationsManager
          trigger:
            - call: "GET /api/customers"
              payload: { limit: 2, offset: 0 }
              as: OperationsManager
          assert:
            - "response has pagination fields limit, offset, total_count, has_more"
            - "total_count == 3"
            - "has_more == true when limit=2, offset=0"

      - name: yard_multifamily_hoa_code_required
        claim_type: required_fields
        grounds:
          - entities.Yard.fields.is_multifamily_common_area
          - validations[priority=9]
          - errors[ERR_HOA_CODE_REQUIRED
        distinguishing_aspect: "POST /api/yards with is_multifamily_common_area=true but missing hoa_account_code -> 422 ERR_HOA_CODE_REQUIRED"
        test_recipe:
          setup: ["Customer cu_y exists"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "Y", email: "y@x.com", phone: "+14155550220" }
              as: OperationsManager
              captures: { cu_y: $.data.id }
          trigger:
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_y}", address_line1: "5 Park", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 5000, pet_count: 0, is_multifamily_common_area: true, service_region_code: "R1" }
              as: OperationsManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_HOA_CODE_REQUIRED"

      - name: yard_computed_subscription_fee_recomputed_on_update
        claim_type: computed_fields
        grounds: [entities.Subscription.fields.monthly_fee_cents_snapshot, calculations.monthly_subscription_fee]
        distinguishing_aspect: "PUT /api/yards/{id} with new pet_count triggers cascade recompute of monthly_fee_cents_snapshot on any ACTIVE Subscription for that yard"
        test_recipe:
          setup:
            - "Customer cu_cf, Yard y_cf VERIFIED, Plan pl_cf base=10000c pet tiers [1,3] surcharges [0,2000,5000]"
            - "Subscription sub_cf ACTIVE, snapshot=12000c (10000+0+2000 for pet_count=2)"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "CF", email: "cf@x.com", phone: "+14155550230" }
              as: OperationsManager
              captures: { cu_cf: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_cf}", address_line1: "1 X", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 2, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_cf: $.data.id }
            - call: "POST /api/yards/${y_cf}/access-profile"
              payload: { gate_access_code: "1", gate_instructions: "", pet_on_premises: false, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_cf: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_cf}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "CF", display_name: "CF", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [1, 3], pet_tier_surcharges_cents: [0, 2000, 5000] }
              as: OperationsManager
              captures: { pl_cf: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_cf}", yard_id: "${y_cf}", plan_id: "${pl_cf}" }
              as: Customer
              as_user_id: "${cu_cf}"
              captures: { sub_cf: $.data.id }
            - call: "POST /api/subscriptions/${sub_cf}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_cf}"
          trigger:
            - call: "PUT /api/yards/${y_cf}"
              payload: { pet_count: 5 }
              as: OperationsManager
            - call: "GET /api/subscriptions/${sub_cf}"
              payload: {}
              as: OperationsManager
              captures: { new_fee: $.data.monthly_fee_cents_snapshot }
          assert:
            - "Subscription.${sub_cf}.monthly_fee_cents_snapshot == 15000 (10000 + 0 + 5000; recomputed after pet_count=5)"

      - name: invoice_line_item_immutable_common_fields
        claim_type: immutability
        grounds: [entities.InvoiceLineItem]
        distinguishing_aspect: "InvoiceLineItem has common_fields=false: no version, no updated_at; only id and created_at. There is no PUT/PATCH endpoint for InvoiceLineItem."
        test_recipe:
          setup: ["Customer cu_li, Invoice inv_li OPEN, Visit completed; line items posted"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "LI", email: "li@x.com", phone: "+14155550240" }
              as: OperationsManager
              captures: { cu_li: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/invoices"
              payload: { customer_id: "${cu_li}", billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
              captures: { inv_li: $.data.id }
          trigger:
            - call: "GET /api/invoices/${inv_li}/line-items"
              payload: {}
              as: BillingAdmin
          assert:
            - "InvoiceLineItem entity exposes id and created_at but NOT version or updated_at"
            - "No PUT/PATCH endpoint exists for /api/invoice-line-items/{id}"

      - name: subscription_plan_enum_visit_frequency
        claim_type: type_constraints
        grounds:
          - entities.SubscriptionPlan.fields.visit_frequency
          - errors[ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /api/subscription-plans with visit_frequency='MONTHLY' -> 400 ERR_INVALID_REQUEST (not in enum)"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "X", display_name: "X", visit_frequency: "MONTHLY", applies_to_multifamily: false, base_monthly_fee_cents: 1000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: yard_parent_relationship_wrong_customer
        claim_type: parent_relationships
        grounds:
          - entities.Subscription
          - validations[priority=11]
          - errors[ERR_YARD_OWNERSHIP_MISMATCH
        distinguishing_aspect: "POST /api/subscriptions with yard_id belonging to a different customer -> 422 ERR_YARD_OWNERSHIP_MISMATCH"
        test_recipe:
          setup:
            - "Customer cu_a1 and Customer cu_a2"
            - "Yard y_a2 owned by cu_a2"
            - "Plan pl_x"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "A1", email: "a1@x.com", phone: "+14155550250" }
              as: OperationsManager
              captures: { cu_a1: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "A2", email: "a2@x.com", phone: "+14155550251" }
              as: OperationsManager
              captures: { cu_a2: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_a2}", address_line1: "1 A", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_a2: $.data.id }
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "XX", display_name: "XX", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_x: $.data.id }
          trigger:
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_a1}", yard_id: "${y_a2}", plan_id: "${pl_x}" }
              as: OperationsManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_YARD_OWNERSHIP_MISMATCH"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: subscription_invalid_cancel_from_draft
        claim_type: invalid_transition
        grounds:
          - state_machines.Subscription
          - errors[ERR_INVALID_STATE
        distinguishing_aspect: "DRAFT -> CANCELLED is not a declared transition; only ACTIVE|PAUSED -> CANCELLED"
        test_recipe:
          setup: ["Subscription sub_bad in DRAFT"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "BAD", email: "bad@x.com", phone: "+14155550260" }
              as: OperationsManager
              captures: { cu_bad: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_bad}", address_line1: "1 B", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_bad: $.data.id }
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "BD", display_name: "BD", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_bad: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_bad}", yard_id: "${y_bad}", plan_id: "${pl_bad}" }
              as: Customer
              as_user_id: "${cu_bad}"
              captures: { sub_bad: $.data.id }
          trigger:
            - call: "POST /api/subscriptions/${sub_bad}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cu_bad}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (DRAFT -> CANCELLED not declared)"

      - name: visit_terminal_completed_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Visit
          - errors[ERR_INVALID_STATE
        distinguishing_aspect: "Once Visit reaches COMPLETED (terminal), no further transitions allowed (depart, skip, cancel all fail)"
        test_recipe:
          setup: ["Visit v_done COMPLETED"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "DONE", email: "done@x.com", phone: "+14155550270" }
              as: OperationsManager
              captures: { cu_done: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_done}", address_line1: "2 B", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_done: $.data.id }
            - call: "POST /api/yards/${y_done}/access-profile"
              payload: { gate_access_code: "1", gate_instructions: "", pet_on_premises: false, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_done: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_done}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "DN", display_name: "DN", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_done: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_done}", yard_id: "${y_done}", plan_id: "${pl_done}" }
              as: Customer
              as_user_id: "${cu_done}"
              captures: { sub_done: $.data.id }
            - call: "POST /api/subscriptions/${sub_done}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_done}"
            - call: "POST /api/technicians"
              payload: { full_name: "TD", employee_code: "T200" }
              as: OperationsManager
              captures: { t_done: $.data.id }
            - call: "POST /api/service-routes"
              payload: { route_code: "RD", service_date: "2026-05-04T00:00:00Z", service_region_code: "R1", assigned_technician_id: "${t_done}", max_visit_capacity: 5 }
              as: OperationsManager
              captures: { rt_done: $.data.id }
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_done}", scheduled_date: "2026-05-04T00:00:00Z", scheduled_window_start: "2026-05-04T09:00:00Z", scheduled_window_end: "2026-05-04T10:00:00Z", service_route_id: "${rt_done}" }
              as: OperationsManager
              captures: { v_done: $.data.id }
            - call: "POST /api/service-routes/${rt_done}/publish"
              payload: {}
              as: OperationsManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: OperationsManager
            - call: "POST /api/service-routes/${rt_done}/start"
              payload: {}
              as: Technician
              as_user_id: "${t_done}"
            - call: "POST /api/visits/${v_done}/depart"
              payload: {}
              as: Technician
              as_user_id: "${t_done}"
            - call: "POST /api/visits/${v_done}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${t_done}"
            - call: "POST /api/visits/${v_done}/complete"
              payload: {}
              as: Technician
              as_user_id: "${t_done}"
          trigger:
            - call: "POST /api/visits/${v_done}/skip"
              payload: {}
              as: Customer
              as_user_id: "${cu_done}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (COMPLETED is terminal)"

      - name: subscription_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.Subscription]
        distinguishing_aspect: "Newly created Subscription is always DRAFT"
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "IN", email: "in@x.com", phone: "+14155550280" }
              as: OperationsManager
              captures: { cu_in: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_in}", address_line1: "3 B", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_in: $.data.id }
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "IN1", display_name: "IN", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_in: $.data.id }
          trigger:
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_in}", yard_id: "${y_in}", plan_id: "${pl_in}" }
              as: Customer
              as_user_id: "${cu_in}"
              captures: { status: $.data.status }
          assert:
            - "Subscription.status == DRAFT on creation"

      - name: subscription_pause_blocked_when_visit_in_flight
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - errors[ERR_VISIT_IN_FLIGHT
        distinguishing_aspect: "Subscription.pause is rejected when any linked Visit is in EN_ROUTE or ON_SITE"
        test_recipe:
          setup: ["Subscription sub_inf ACTIVE with a Visit EN_ROUTE"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "INF", email: "inf@x.com", phone: "+14155550290" }
              as: OperationsManager
              captures: { cu_inf: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_inf}", address_line1: "4 B", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_inf: $.data.id }
            - call: "POST /api/yards/${y_inf}/access-profile"
              payload: { gate_access_code: "1", gate_instructions: "", pet_on_premises: false, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_inf: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_inf}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "INF", display_name: "INF", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_inf: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_inf}", yard_id: "${y_inf}", plan_id: "${pl_inf}" }
              as: Customer
              as_user_id: "${cu_inf}"
              captures: { sub_inf: $.data.id }
            - call: "POST /api/subscriptions/${sub_inf}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_inf}"
            - call: "POST /api/technicians"
              payload: { full_name: "TI", employee_code: "T201" }
              as: OperationsManager
              captures: { t_inf: $.data.id }
            - call: "POST /api/service-routes"
              payload: { route_code: "RI", service_date: "2026-05-04T00:00:00Z", service_region_code: "R1", assigned_technician_id: "${t_inf}", max_visit_capacity: 5 }
              as: OperationsManager
              captures: { rt_inf: $.data.id }
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_inf}", scheduled_date: "2026-05-04T00:00:00Z", scheduled_window_start: "2026-05-04T09:00:00Z", scheduled_window_end: "2026-05-04T10:00:00Z", service_route_id: "${rt_inf}" }
              as: OperationsManager
              captures: { v_inf: $.data.id }
            - call: "POST /api/service-routes/${rt_inf}/publish"
              payload: {}
              as: OperationsManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: OperationsManager
            - call: "POST /api/service-routes/${rt_inf}/start"
              payload: {}
              as: Technician
              as_user_id: "${t_inf}"
            - call: "POST /api/visits/${v_inf}/depart"
              payload: {}
              as: Technician
              as_user_id: "${t_inf}"
          trigger:
            - call: "POST /api/subscriptions/${sub_inf}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cu_inf}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_VISIT_IN_FLIGHT"

      - name: invoice_terminal_paid_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Invoice
          - errors[ERR_INVALID_STATE
        distinguishing_aspect: "PAID is terminal; dispute from PAID fails"
        test_recipe:
          setup: ["Invoice inv_pd FINALIZED then PAID"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "PD", email: "pd@x.com", phone: "+14155550300" }
              as: OperationsManager
              captures: { cu_pd: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/invoices"
              payload: { customer_id: "${cu_pd}", billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
              captures: { inv_pd: $.data.id, inv_pd_v: $.data.version }
            - call: "POST /api/invoices/${inv_pd}/finalize"
              payload: { expected_invoice_version: "${inv_pd_v}" }
              as: BillingAdmin
