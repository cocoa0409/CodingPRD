            - "before the trigger: NqdcParticipantLiability.${liab_reyes_id}.discounted_benefit_usd == 626820.93 and NqdcParticipantLiability.${liab_diaz_id}.discounted_benefit_usd == 306956.63"
            - "before the trigger: NqdcPlan.${plan_filter_id}.accrual_liability_usd == 1000000.00 and pbo_liability_usd == 933777.56"
            - "trigger call 1 returns HTTP 200 with NqdcParticipantLiability.${liab_diaz_id}.status == SETTLED"
            - "trigger call 2 returns HTTP 200 with basis == ACCRUAL, accrual_liability_usd == 600000.00, pbo_liability_usd == 626820.93, basis_liability_usd == 600000.00 and participant_count == 1"
            - "trigger call 3 returns basis == PBO with basis_liability_usd == 626820.93 and participant_count == 1"
            - "both summary calls report matched_cash_value_usd == 0.00, funded_ratio_bps == 0 and funding_posture == CRITICAL"
            - "NqdcPlan.${plan_filter_id}.accrual_liability_usd == 600000.00, pbo_liability_usd == 626820.93 and status == ACTIVE"

