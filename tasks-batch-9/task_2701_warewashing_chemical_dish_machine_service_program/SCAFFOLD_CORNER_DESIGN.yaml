  - section: state_machines
    instances:
      - name: agreement_activation_computes_term_end_and_lifts_customer_count
        claim_type: Valid Transition
        grounds:
          - state_machines.ServiceAgreement.status.DRAFT_to_ACTIVE
          - entities.ServiceAgreement.fields.term_end_date
          - entities.Customer.fields.active_agreement_count
        distinguishing_aspect: |
          Activation is the only writer of term_end_date: start_date 2026-08-01 plus 36 calendar months
          is exactly 2029-08-01 (same day-of-month, no 30-day arithmetic), and the customer's
          active_agreement_count moves 0 -> 1 in the same request while version goes 1 -> 2.
        test_recipe:
          setup:
            - "One customer and one DRAFT agreement covering DET-100; nothing else exists."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id, v1: $.data.version, st1: $.data.status }
          trigger:
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { st2: $.data.status, term_end: $.data.term_end_date, v2: $.data.version }
            - call: "GET /warewashing/customers/${cust_id}"
              payload: {}
              as: AccountManager
              captures: { agr_count: $.data.active_agreement_count }
          assert:
            - "${st1} == DRAFT and ${v1} == 1 before activation"
            - "${st2} == ACTIVE, ${term_end} == 2029-08-01 and ${v2} == 2"
            - "${agr_count} == 1"
            - "renewal_count is still 0 and early_termination_fee_cents is still null - activation touches neither"

      - name: install_of_a_pending_placement_after_termination_reports_agreement_not_active
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.MachinePlacement.placement_status.PENDING_INSTALL_to_INSTALLED
          - validations.agreement_must_be_active
          - calculations.early_termination_fee
        distinguishing_aspect: |
          The placement is still PENDING_INSTALL (its own precondition holds) but its agreement is now
          TERMINATED, so install fails with ERR_AGREEMENT_NOT_ACTIVE (409) rather than the generic
          transition error - the cross-entity precondition is the one that bites. The same terminate
          also pins the fee: remaining_months = ceil(1096/30) = 37, variant_a = 37 x 20000 x 0.6 =
          444000, variant_b = round_half_up(480000 x 37 / 36) = 493333, max = 493333.
        test_recipe:
          setup:
            - "One ACTIVE agreement (start 2026-08-01, 36 months, term_end 2029-08-01) with one PENDING_INSTALL DT-88 placement."
            - "The clock stays at 2026-08-01T00:00:00Z, so effective_date 2026-08-01 is not in the past."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
