          - entities.Inspection.fields.scheduled_index
          - entities.Inspection.fields.inspector_id
          - errors[ERR_INSPECTOR_DOUBLE_BOOKED]
        distinguishing_aspect: >
          Interval semantics = zero-width exact-point exclusion on the Inspector resource:
          a second non-terminal Inspection for the SAME inspector_id at the SAME scheduled_index
          (point collision, not a range) is rejected with ERR_INSPECTOR_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Inspector i1; two PERMITTED establishments e1,e2; one SCHEDULED ROUTINE inspection for i1 at scheduled_index=90."
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 85 }
              as: HealthDirector
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /establishments"
              payload: { name: "Diner E2", address: "2 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e2: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e2}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr2: $.data.id }
            - call: "POST /plan-reviews/${pr2}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e2}", plan_review_id: "${pr2}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 90 }
              as: PermitClerk
          trigger:
            - call: "POST /inspections"
              payload: { establishment_id: "${e2}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 90 }
              as: PermitClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INSPECTOR_DOUBLE_BOOKED"
            - "response.http_status == 409"

      - name: rto_route_day_aggregate_capacity_overflow
        grounds:
          - validations[priority=12]
          - entities.InspectionRoute.fields.planned_stop_count
          - entities.Inspector.fields.max_daily_route_stops
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
        distinguishing_aspect: >
          A different interval semantics (aggregate-capacity over a whole route-day window) on a
          different resource (InspectionRoute): the route-day can hold at most max_daily_route_stops
          occupants; the (max+1)-th aggregate occupant trips ERR_ROUTE_CAPACITY_EXCEEDED at dispatch,
          contrasting the zero-width point collision of the inspector rule.
        test_recipe:
          setup:
            - "Inspector i1 max_daily_route_stops=1; PLANNED route on route_date_index=95 holding 2 SCHEDULED inspections (aggregate over capacity); clock at 95."
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 95 }
              as: HealthDirector
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001", max_daily_route_stops: 1 }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /establishments"
              payload: { name: "Diner E2", address: "2 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e2: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e2}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr2: $.data.id }
            - call: "POST /plan-reviews/${pr2}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e2}", plan_review_id: "${pr2}" }
              as: PermitClerk
            - call: "POST /inspection-routes"
              payload: { inspector_id: "${i1}", route_date_index: 95 }
              as: PermitClerk
              captures: { rt: $.data.id }
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 95, route_id: "${rt}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e2}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 96, route_id: "${rt}" }
              as: PermitClerk
          trigger:
            - call: "POST /inspection-routes/${rt}/dispatch"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { err: $.data.error_id }
          assert:
            - "InspectionRoute.${rt}.planned_stop_count == 2"
            - "response.error_id == ERR_ROUTE_CAPACITY_EXCEEDED  # 2 > max 1"
            - "response.http_status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_closure_lift_conserves_establishment_permitted_state
        grounds:
          - state_machines.Establishment.PERMITTED_to_SUSPENDED
          - state_machines.Establishment.SUSPENDED_to_PERMITTED
          - entities.Establishment.fields.status
          - entities.Establishment.fields.active_closure_order_id
          - entities.ClosureOrder.fields.status
        distinguishing_aspect: >
          Conserved quantity #1 = the establishment's permitted/closure parity. Forward action
          (issue closure -> SUSPENDED, active_closure_order_id set) paired with its compensating
          action (lift closure -> PERMITTED) must leave the invariant
          (status==PERMITTED AND active_closure_order_id==null) restored to baseline.
        test_recipe:
          setup:
            - "Establishment e1 PERMITTED; a finalized ROUTINE inspection exists to use as triggering_inspection_id for a manual closure."
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 100 }
              as: HealthDirector
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 100 }
              as: PermitClerk
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /inspections/${insp1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { v1_pre: $.data.version }
            - call: "POST /inspections/${insp1}/finalize"
              payload: { expected_inspection_version: "${v1_pre}" }
              as: Inspector
              as_user_id: "${i1}"
          trigger:
            - call: "POST /closure-orders"
              payload: { establishment_id: "${e1}", triggering_inspection_id: "${insp1}", reason_code: "IMMINENT_HEALTH_HAZARD" }
              as: EnforcementOfficer
              captures: { co: $.data.id }
            - call: "POST /closure-orders/${co}/lift"
              payload: {}
              as: EnforcementOfficer
              captures: { co_status: $.data.status }
          assert:
            - "Establishment.${e1}.status == PERMITTED  # restored to baseline after forward+compensating"
            - "Establishment.${e1}.active_closure_order_id == null"
            - "ClosureOrder.${co}.status == LIFTED"

      - name: ci_reinspection_resolution_conserves_open_critical_count
        grounds:
          - state_machines.Inspection.COMPLETED_to_FINALIZED
          - entities.Establishment.fields.open_critical_count
          - entities.Violation.fields.resolution_status
        distinguishing_aspect: >
          Conserved quantity #2 = open_critical_count (a count, distinct from the parity quantity #1).
          Forward action (finalize routine with 2 uncorrected criticals -> open_critical_count 2)
          paired with the compensating passing reinspection (resolves them -> open_critical_count 0)
          returns the named count to its zero baseline.
        test_recipe:
          setup:
            - "Establishment e1 with a finalized ROUTINE inspection carrying 2 uncorrected CRITICAL violations (base 5 each) -> final_score 90 but grade C (2-critical cap), open_critical_count 2."
            - "A clean REINSPECTION COMPLETED with no violations."
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 110 }
              as: HealthDirector
            - call: "POST /fda-food-codes"
              payload: { code: "3-501.16", title: "Cold holding", classification: "CRITICAL", base_demerit_points: 5 }
              as: HealthDirector
              captures: { c1: $.data.id }
            - call: "POST /fda-food-codes"
              payload: { code: "3-501.17", title: "Date marking", classification: "CRITICAL", base_demerit_points: 5 }
              as: HealthDirector
              captures: { c2: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 110 }
              as: PermitClerk
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${c1}", corrected_on_site: false }
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${c2}", corrected_on_site: false }
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /inspections/${insp1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { v1_pre: $.data.version }
            - call: "POST /inspections/${insp1}/finalize"
              payload: { expected_inspection_version: "${v1_pre}" }
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "REINSPECTION", scheduled_index: 112, reinspection_of_id: "${insp1}" }
              as: PermitClerk
              captures: { insp_re: $.data.id }
            - call: "POST /inspections/${insp_re}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /inspections/${insp_re}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { vre_pre: $.data.version }
          trigger:
            - call: "POST /inspections/${insp_re}/finalize"
              payload: { expected_inspection_version: "${vre_pre}" }
              as: Inspector
              as_user_id: "${i1}"
              captures: { g: $.data.grade }
          assert:
