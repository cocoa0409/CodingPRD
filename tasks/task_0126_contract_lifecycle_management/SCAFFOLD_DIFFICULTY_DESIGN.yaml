          - endpoints.POST /_clock/set_current_utc
        distinguishing_aspect: |
          DATETIME boundary on a DIFFERENT metric (the alert clock window, not a numeric score),
          reached through a DIFFERENT endpoint (the clock sweep): setting the clock to EXACTLY
