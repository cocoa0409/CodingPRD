  - method: GET
    path: "/api/damage-claims"
    description: "List damage claims with optional filters"
    roles: [PortAdmin, VesselAgent, PortDispatcher, Pilot, TugCaptain, MarineSurveyor, ClaimsAdjuster]
    code: 200
    input: ["incident_id?", "vessel_id?", "status?"]
    output: DamageClaim[]
    side_effects: []
  - method: GET
    path: "/api/damage-claims/{id}"
    description: "Get one damage claim"
    roles: [PortAdmin, VesselAgent, PortDispatcher, Pilot, TugCaptain, MarineSurveyor, ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: POST
    path: "/api/damage-claims/{id}/review"
    description: "Claims adjuster review action: START_REVIEW, REQUEST_INFO, ACCEPT, or DENY"
    roles: [ClaimsAdjuster]
    code: 200
    input: [action, "reviewer_notes?"]
    output: DamageClaim
    side_effects: ["State transition per action", "Increments DamageClaim.version by 1"]
  - method: POST
    path: "/api/damage-claims/{id}/settle"
    description: "Settle an accepted claim; payout subtracts from the vessel's outstanding balance"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["Vessel.outstanding_billed_cents recomputed via calculation vessel_outstanding", "Increments DamageClaim.version by 1"]
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any set call) is exactly 2026-05-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [PortAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock set"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or role not recognized"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role is not in the endpoint's role list"
  - id: ERR_JOB_NOT_OWNED
    http: 403
    condition: "VesselAgent acts on behalf of a vessel whose id does not equal X-User-ID"
  - id: ERR_BOOKING_NOT_OWNED
    http: 403
    condition: "Pilot attempts confirm/board on a booking whose pilot_id does not equal X-User-ID"
  - id: ERR_ASSIGNMENT_NOT_OWNED
    http: 403
    condition: "TugCaptain attempts confirm/watch-log/incident-report for a tug whose id does not equal X-User-ID"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body FK reference does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input field missing or mistyped"
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "Enum field carries a value outside its declared set"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent entity's current version"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Attempted transition on a resource already in a terminal state"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Current state is not a valid from-state for the attempted transition"
  - id: ERR_TUG_UNAVAILABLE
    http: 409
    condition: "Tug.operational_status != AVAILABLE at assignment creation or confirmation"
  - id: ERR_GEAR_INSPECTION_OVERDUE
    http: 409
    condition: "Latest gear inspection for the tug is not PASSED with next_due_at strictly after the current logical clock, at assignment confirmation"
  - id: ERR_WEATHER_RESTRICTED
    http: 409
    condition: "An ACTIVE WeatherRestriction overlaps the job window at confirm or dispatch"
  - id: ERR_TUG_WINDOW_CONFLICT
    http: 409
    condition: "New assignment half-open-overlaps an existing non-terminal assignment of the same tug"
  - id: ERR_PILOT_WINDOW_CONFLICT
    http: 409
    condition: "New booking violates the 60-minute turnaround buffer against an existing non-terminal booking of the same pilot"
  - id: ERR_WATCH_OVERLAP
    http: 409
    condition: "New watch half-open-overlaps an existing watch of the same crew member"
  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "Job scheduled_start is strictly before the current logical clock at creation"
  - id: ERR_JOB_WINDOW_INVALID
    http: 422
    condition: "scheduled_end is not strictly after scheduled_start"
  - id: ERR_WEATHER_WINDOW_INVALID
    http: 422
    condition: "effective_end is not strictly after effective_start"
  - id: ERR_DUPLICATE_TUG_ASSIGNMENT
    http: 409
    condition: "Job already has a non-terminal assignment for the same tug"
  - id: ERR_INSUFFICIENT_BOLLARD_PULL
    http: 422
    condition: "Sum of confirmed assignments' bollard pull is strictly below required_bollard_pull_tons at dispatch"
  - id: ERR_PILOT_BOOKING_NOT_CONFIRMED
    http: 409
    condition: "No CONFIRMED pilot booking exists for the job at dispatch"
  - id: ERR_PILOT_LICENSE_INSUFFICIENT
    http: 422
    condition: "Pilot license class below the maneuver's required class"
  - id: ERR_CREW_REST_VIOLATION
    http: 422
    condition: "Crew member's rest in the 24h before watch_start is below 600 minutes"
  - id: ERR_CLAIM_ALREADY_FILED
    http: 409
    condition: "A DamageClaim already exists for the referenced incident"
  - id: ERR_INCIDENT_ALREADY_RESOLVED
    http: 409
    condition: "Damage claim filed against an incident already RESOLVED"
  - id: ERR_TARIFF_NOT_EFFECTIVE
    http: 422
    condition: "Tariff effective window does not cover the job's scheduled_start"

roles:
  - name: PortAdmin
    description: "Port authority administrator; manages reference data (tugs, vessels, pilots, crew, tariffs), weather restrictions, invoice voids, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/tugs, /api/vessels, /api/pilots, /api/crew-members, /api/tariff-rates"
      - "POST /api/weather-restrictions, POST /api/weather-restrictions/{id}/lift"
      - "POST /api/invoices/{id}/void"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: VesselAgent
    description: "Shipping-line agent acting for one vessel; places and manages job orders and files damage claims"
    identity: "entity_backed:Vessel"
    exclusive_operations:
      - "POST /api/job-orders"
      - "POST /api/job-orders/{id}/amend"
      - "POST /api/damage-claims"
    shared_operations:
      - "POST /api/job-orders/{id}/cancel (shared with PortDispatcher)"
      - "All GET endpoints"
  - name: PortDispatcher
    description: "Harbor dispatcher; confirms, assigns tugs, books pilots, dispatches, starts, completes, cancels jobs, finalizes invoices"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/job-orders/{id}/confirm, /dispatch, /start, /complete"
      - "POST /api/tug-assignments, POST /api/tug-assignments/{id}/release"
      - "POST /api/pilot-bookings"
      - "POST /api/invoices/{id}/finalize"
    shared_operations:
      - "POST /api/job-orders/{id}/cancel (shared with VesselAgent)"
      - "All GET endpoints"
  - name: Pilot
    description: "Harbor pilot; confirms and boards own bookings"
    identity: "entity_backed:Pilot"
    exclusive_operations:
      - "POST /api/pilot-bookings/{id}/confirm"
      - "POST /api/pilot-bookings/{id}/board"
    shared_operations:
      - "All GET endpoints"
  - name: TugCaptain
    description: "Tug captain; confirms assignments for own tug, logs watch rotations, reports incidents"
    identity: "entity_backed:Tug"
    exclusive_operations:
      - "POST /api/tug-assignments/{id}/confirm"
      - "POST /api/watch-rotations"
      - "POST /api/incidents"
    shared_operations:
      - "All GET endpoints"
  - name: MarineSurveyor
    description: "Independent surveyor; records gear inspections and resolves incidents"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/gear-inspections"
      - "POST /api/incidents/{id}/resolve"
    shared_operations:
      - "All GET endpoints"
  - name: ClaimsAdjuster
    description: "Claims adjuster; reviews and settles damage claims (segregated from dispatch operations)"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/damage-claims/{id}/review"
      - "POST /api/damage-claims/{id}/settle"
    shared_operations:
      - "All GET endpoints"
