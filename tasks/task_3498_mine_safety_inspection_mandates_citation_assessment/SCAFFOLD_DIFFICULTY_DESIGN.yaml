        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_SUSPENDED
          - state_machines.ImminentDangerOrder
          - entities.Mine.fields.production_status
        distinguishing_aspect: |
          Depth-3 chain from a manual IDO issuance: the new ImminentDangerOrder
          (A) mutates Mine.production_status to HALTED (B), and that halt — not
