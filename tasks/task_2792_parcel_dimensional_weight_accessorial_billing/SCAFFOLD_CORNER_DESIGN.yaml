              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-E-3001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pa: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-E-3002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pb: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-E-3003", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /shipments/${pc}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-02T03:00:00Z" }
              as: CarrierAdmin
            - call: "POST /shipments/${pa}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /shipments/${pb}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id, lc: $.data.line_count }
            - call: "POST /invoices/${inv}/issue"
              payload: {}
              as: BillingOps
          trigger:
            - call: "POST /guarantee-claims/scan"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { filed: $.data.filed_count, skipped: $.data.skipped_count }
            - call: "GET /guarantee-claims"
              payload: { shipment_id: "${pa}" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { claim_a: "$.data[0].id", late_a: "$.data[0].late_by_seconds", cand_a: "$.data[0].candidate_refund_cents" }
            - call: "GET /guarantee-claims"
              payload: { shipment_id: "${pc}" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
            - call: "POST /guarantee-claims/scan"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
