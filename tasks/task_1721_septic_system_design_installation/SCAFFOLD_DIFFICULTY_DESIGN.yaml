              captures: { pt1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/designs"
              payload: { designer_id: "${d1}", soil_evaluation_id: "${e1}", percolation_test_id: "${pt1}", bedroom_count: 3, system_type: "GRAVITY" }
              as: SystemDesigner
              as_user_id: "${d1}"
              captures: { d: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/designs/${d}/submit"
              payload: {}
