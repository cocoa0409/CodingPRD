          Every sub-resource list declares an EMPTY input list, so it accepts no
          limit and no offset and must emit a NULL pagination block — not an empty
          object and not the defaults. Their order is creation order, which is
          load-bearing because several §1.3 cascades walk commitments in
          created_at ASC.
        test_recipe:
          setup:
            - "Canonical fixture through permit issuance: the plan holds two commitments, created 45.01 units first and 14.71 units second."
