          assert:
            - "ConsentSolicitation.${sol}.status == PASSED (eligible 750000000 from positions A+B; 750000000*10000 >= 5000*750000000)"
            - "CovenantObligation.${ob}.status == WAIVED (link 1)"
            - "DefaultCase.${dc}.status == WAIVED (link 2: ALLEGED case with matching source_ref)"
            - "Indenture.${ind}.covenant_posture == CURRENT (link 3)"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_suspended_run_execute
        grounds:
          - validations[priority=5]
          - validations[priority=20]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_FUNDING_SHORTFALL]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: executing a run that is
          BOTH SUSPENDED (state, priority 5) AND underfunded (fiscal,
          priority 20) MUST return ERR_INVALID_STATE, never
          ERR_FUNDING_SHORTFALL.
        test_recipe:
          setup:
            - "Active indenture, tranche, position A 400000000 only (gross for [2026-06-15,2026-12-15) = 10166667)"
            - "INTEREST run funded with only 10000000 (PARTIALLY_FUNDED)"
            - "DefaultCase confirmed -> run SUSPENDED by cascade"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "INTEREST", period_start_date: "2026-06-15", period_end_date: "2026-12-15", scheduled_payment_date: "2026-12-15" }, as: TrustOfficer, captures: { run: $.data.id } }
            - { call: "POST /payment-runs/${run}/fund", payload: { amount_cents: 10000000 }, as: Issuer, as_user_id: "issuer-1" }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
          trigger:
            - { call: "POST /payment-runs/${run}/execute", payload: {}, as: TrustOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (state, priority 5)"
            - "error_id != ERR_FUNDING_SHORTFALL (fiscal, priority 20) even though funded 10000000 < gross 10166667"
            - "PaymentRun.${run}.distribution_status == SUSPENDED"

      - name: safety_beats_constraint_on_collateral_decide
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_DEFAULT_LOCK]
          - errors[ERR_COVERAGE_BELOW_MINIMUM]
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint: deciding a
          VERIFIED release request while BOTH a CONFIRMED default exists
          (safety, priority 7) AND post_release_coverage_bps 12445 < 12500
          (constraint, priority 13) MUST return ERR_DEFAULT_LOCK, never
          ERR_COVERAGE_BELOW_MINIMUM.
        test_recipe:
          setup:
            - "Active indenture, tranche, one position 1000000000; collateral C1 SECURITIES 800000000 and C2 REAL_ESTATE 500000000"
            - "SUBSTITUTION request on C2 with substitute 460000000 (verified -> post_release_coverage_bps 12445, below floor)"
            - "A PAYMENT DefaultCase then declared and CONFIRMED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 1000000000 }, as: PlatformAdmin }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C1", collateral_type: "SECURITIES", appraised_value_cents: 800000000, valuation_date: "2026-04-01" }, as: TrustOfficer }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C2", collateral_type: "REAL_ESTATE", appraised_value_cents: 500000000, valuation_date: "2026-04-01" }, as: TrustOfficer, captures: { c2: $.data.id, c2_v: $.data.version } }
            - { call: "POST /collateral-release-requests", payload: { collateral_item_id: "${c2}", request_type: "SUBSTITUTION", substitute_description: "sub", substitute_collateral_type: "SECURITIES", substitute_appraised_value_cents: 460000000, substitute_valuation_date: "2026-04-15", expected_collateral_item_version: "${c2_v}" }, as: Issuer, as_user_id: "issuer-1", captures: { rr: $.data.id } }
            - { call: "POST /collateral-release-requests/${rr}/verify", payload: {}, as: TrustOfficer, as_user_id: "officer-1" }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
          trigger:
            - { call: "POST /collateral-release-requests/${rr}/decide", payload: { decision: "APPROVE" }, as: TrustManager, as_user_id: "manager-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEFAULT_LOCK (business_safety, priority 7)"
            - "error_id != ERR_COVERAGE_BELOW_MINIMUM (business_constraint, priority 13) even though post_release_coverage_bps == 12445 < 12500"
            - "CollateralReleaseRequest.${rr}.status == VERIFIED (unchanged)"

      - name: temporal_beats_referential_on_expired_ballot
        grounds:
          - validations[priority=17]
          - validations[priority=23]
          - errors[ERR_SOLICITATION_EXPIRED]
          - errors[ERR_NO_ELIGIBLE_POSITION]
        distinguishing_aspect: |
          Category pair business_temporal vs business_referential: a ballot
          cast BOTH after expiry (temporal, priority 17) AND by a holder with
          zero eligible principal (referential, priority 23) MUST return
          ERR_SOLICITATION_EXPIRED, never ERR_NO_ELIGIBLE_POSITION.
        test_recipe:
          setup:
            - "Active indenture, tranche, position A 400000000; holder NHD registered with NO positions"
            - "Solicitation OPEN with expiry_date 2026-06-30; clock advanced to 2026-07-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-D", legal_name: "Holder D", contact_email: "d@x.com" }, as: PlatformAdmin, captures: { nhd: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /consent-solicitations", payload: { indenture_id: "${ind}", subject_type: "AMEND_TERMS", amendment_payload: { annual_admin_fee_cents: 2600000 }, consent_threshold_bps: 5000, tabulation_basis: "CURRENT_OUTSTANDING", record_date: "2026-06-01", expiry_date: "2026-06-30" }, as: Issuer, as_user_id: "issuer-1", captures: { sol: $.data.id } }
            - { call: "POST /consent-solicitations/${sol}/open", payload: {}, as: TrustOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /consent-solicitations/${sol}/ballots", payload: { noteholder_account_id: "${nhd}", vote: "CONSENT" }, as: Noteholder, as_user_id: "${nhd}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SOLICITATION_EXPIRED (temporal, priority 17)"
            - "error_id != ERR_NO_ELIGIBLE_POSITION (referential, priority 23) even though holder D has zero positions"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: accelerate_quorum_inclusive_quarter_boundary
        grounds:
          - calculations.quorum_tally
          - state_machines.NoteholderDirection.CIRCULATING_to_EFFECTIVE
        distinguishing_aspect: |
          Metric: quorum share; endpoint: POST /directions/{id}/endorsements.
          The ACCELERATE threshold is INCLUSIVE: support of exactly
          250000000 (25.0000% of eligible 1000000000) flips the direction to
          EFFECTIVE — 250000000*4 >= 1000000000 holds with equality.
        test_recipe:
          setup:
            - "Active indenture, tranche, positions A 400000000 / B 350000000 / C 250000000; CONFIRMED default case; ACCELERATE direction circulating"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-C", legal_name: "Holder C", contact_email: "c@x.com" }, as: PlatformAdmin, captures: { nhc: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhc}", original_principal_cents: 250000000 }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-R", legal_name: "Holder R", contact_email: "r@x.com" }, as: PlatformAdmin, captures: { nhr: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhr}", original_principal_cents: 750000000 }, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "GET /default-cases/${dc}", payload: {}, as: TrustOfficer, captures: { dc_v: $.data.version } }
            - { call: "POST /directions", payload: { default_case_id: "${dc}", instruction_type: "ACCELERATE", expires_at: "2026-12-31T00:00:00Z", expected_default_case_version: "${dc_v}" }, as: TrustOfficer, captures: { dir: $.data.id } }
          trigger:
            - { call: "POST /directions/${dir}/endorsements", payload: { noteholder_account_id: "${nhc}" }, as: Noteholder, as_user_id: "${nhc}", captures: { end: $.data.id } }
          assert:
            - "DirectionEndorsement.${end}.endorsed_principal_cents == 250000000"
            - "NoteholderDirection.${dir}.status == EFFECTIVE at exact 25% (inclusive >=)"
            - "NoteholderDirection.${dir}.eligible_principal_cents == 1000000000"

      - name: coverage_floor_inclusive_boundary_on_decide
        grounds:
          - calculations.collateral_coverage
          - validations[priority=13]
        distinguishing_aspect: |
          Metric: post-release coverage ratio; endpoint: POST
          /collateral-release-requests/{id}/decide. The floor is INCLUSIVE:
          post_release_coverage_bps == 12500 exactly approves
          (995000000 pledged * 10000 / 796000000 outstanding == 12500).
        test_recipe:
          setup:
            - "Indenture with tranche original 796000000 and a single position 796000000 (outstanding exactly 796000000)"
            - "Collateral C1 SECURITIES appraised 1000000000 (pledged value 995000000 after 500 bps haircut) and C2 EQUIPMENT appraised 300000000 (release target)"
            - "RELEASE request on C2 verified: coverage excluding C2 is 995000000 -> post_release_coverage_bps == 12500"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I3", issuer_ref: "issuer-3", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T3", original_principal_cents: 796000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t3: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-F", legal_name: "Holder F", contact_email: "f@x.com" }, as: PlatformAdmin, captures: { nhf: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t3}", noteholder_account_id: "${nhf}", original_principal_cents: 796000000 }, as: PlatformAdmin }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C1", collateral_type: "SECURITIES", appraised_value_cents: 1000000000, valuation_date: "2026-04-01" }, as: TrustOfficer }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C2", collateral_type: "EQUIPMENT", appraised_value_cents: 300000000, valuation_date: "2026-04-01" }, as: TrustOfficer, captures: { c2: $.data.id, c2_v: $.data.version } }
            - { call: "POST /collateral-release-requests", payload: { collateral_item_id: "${c2}", request_type: "RELEASE", expected_collateral_item_version: "${c2_v}" }, as: Issuer, as_user_id: "issuer-3", captures: { rr: $.data.id } }
            - { call: "POST /collateral-release-requests/${rr}/verify", payload: {}, as: TrustOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /collateral-release-requests/${rr}/decide", payload: { decision: "APPROVE" }, as: TrustManager, as_user_id: "manager-1" }
          assert:
            - "CollateralReleaseRequest.${rr}.post_release_coverage_bps == 12500 (floor(995000000*10000/796000000))"
            - "CollateralReleaseRequest.${rr}.status == APPROVED — equality with the 12500 floor is sufficient (inclusive >=)"

      - name: rescind_strict_majority_boundary
        grounds:
          - calculations.quorum_tally
          - entities.NoteholderDirection.fields.threshold_rule
        distinguishing_aspect: |
          Metric: majority share under the STRICT rule (>50%), endpoint POST
          /directions/{id}/endorsements — contrasting with the inclusive 25%
          rule: on eligible 200000000, support of exactly 100000000 (50.0000%)
          does NOT make a RESCIND_ACCELERATION direction EFFECTIVE
          (100000000*2 > 200000000 is false); adding the second 100000000
          holder does (200000000*2 > 200000000).
        test_recipe:
          setup:
            - "Indenture I2, tranche 200000000 with positions G 100000000 and H 100000000"
            - "Default case CONFIRMED, then ACCELERATED via an executed ACCELERATE direction (G alone crosses the inclusive 25% rule)"
            - "RESCIND_ACCELERATION direction circulating"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I2", issuer_ref: "issuer-2", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T4", original_principal_cents: 200000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t4: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-G", legal_name: "Holder G", contact_email: "g@x.com" }, as: PlatformAdmin, captures: { nhg: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-H", legal_name: "Holder H", contact_email: "h@x.com" }, as: PlatformAdmin, captures: { nhh: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t4}", noteholder_account_id: "${nhg}", original_principal_cents: 100000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t4}", noteholder_account_id: "${nhh}", original_principal_cents: 100000000 }, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "GET /default-cases/${dc}", payload: {}, as: TrustOfficer, captures: { dc_v1: $.data.version } }
            - { call: "POST /directions", payload: { default_case_id: "${dc}", instruction_type: "ACCELERATE", expires_at: "2026-12-31T00:00:00Z", expected_default_case_version: "${dc_v1}" }, as: TrustOfficer, captures: { dir_acc: $.data.id } }
            - { call: "POST /directions/${dir_acc}/endorsements", payload: { noteholder_account_id: "${nhg}" }, as: Noteholder, as_user_id: "${nhg}" }
            - { call: "POST /directions/${dir_acc}/execute", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "GET /default-cases/${dc}", payload: {}, as: TrustOfficer, captures: { dc_v2: $.data.version } }
            - { call: "POST /directions", payload: { default_case_id: "${dc}", instruction_type: "RESCIND_ACCELERATION", expires_at: "2026-12-31T00:00:00Z", expected_default_case_version: "${dc_v2}" }, as: TrustOfficer, captures: { dir_res: $.data.id } }
          trigger:
            - { call: "POST /directions/${dir_res}/endorsements", payload: { noteholder_account_id: "${nhg}" }, as: Noteholder, as_user_id: "${nhg}" }
            - { call: "GET /directions/${dir_res}", payload: {}, as: TrustOfficer, captures: { st_mid: $.data.status } }
            - { call: "POST /directions/${dir_res}/endorsements", payload: { noteholder_account_id: "${nhh}" }, as: Noteholder, as_user_id: "${nhh}" }
            - { call: "GET /directions/${dir_res}", payload: {}, as: TrustOfficer, captures: { st_end: $.data.status } }
          assert:
            - "after G alone (exactly 50%): NoteholderDirection.${dir_res}.status == CIRCULATING — strict > rejects equality"
            - "after G+H (100%): NoteholderDirection.${dir_res}.status == EFFECTIVE"
            - "contrast with ACCELERATE on the same case: G alone (50%) had already sufficed via the inclusive 25% rule"

      - name: zero_ballot_close_fails_with_zero_tally
        grounds:
          - calculations.consent_tabulation
          - state_machines.ConsentSolicitation.OPEN_to_FAILED
        distinguishing_aspect: |
          Metric: empty ballot set (zero-count edge, not a numeric threshold);
          endpoint: POST /consent-solicitations/{id}/close. Closing an OPEN
          solicitation with zero ballots before expiry yields FAILED with
          consenting_principal_cents == 0 — not EXPIRED, not an error.
        test_recipe:
          setup:
            - "Active indenture, tranche, position A 400000000; solicitation OPEN, threshold 5000 bps, expiry 2026-07-01; no ballots cast; clock 2026-06-15 (before expiry)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /consent-solicitations", payload: { indenture_id: "${ind}", subject_type: "AMEND_TERMS", amendment_payload: { annual_admin_fee_cents: 2600000 }, consent_threshold_bps: 5000, tabulation_basis: "CURRENT_OUTSTANDING", record_date: "2026-06-01", expiry_date: "2026-07-01" }, as: Issuer, as_user_id: "issuer-1", captures: { sol: $.data.id } }
            - { call: "POST /consent-solicitations/${sol}/open", payload: {}, as: TrustOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /consent-solicitations/${sol}/close", payload: {}, as: TrustOfficer }
          assert:
            - "ConsentSolicitation.${sol}.status == FAILED"
            - "ConsentSolicitation.${sol}.consenting_principal_cents == 0 (empty ballot set is a clean FAILED, not EXPIRED — clock 2026-06-15 <= expiry 2026-07-01)"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: payment_execute_gated_by_indenture_status
        grounds:
          - state_machines.PaymentRun
          - entities.Indenture.fields.status
          - errors[ERR_INDENTURE_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair PaymentRun -> Indenture: execute requires the parent
          Indenture in state ACTIVE. A run created and fully funded
          AFTER its indenture went DEFAULTED (so the run itself is cleanly
          SCHEDULED, isolating the cross-entity gate) is rejected with
          ERR_INDENTURE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Indenture DEFAULTED via confirmed default; tranche still ACTIVE (only ACCELERATED flips tranches)"
            - "INTEREST run created after the default, fully funded (gross 10166667 for single 400000000 position)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "INTEREST", period_start_date: "2026-06-15", period_end_date: "2026-12-15", scheduled_payment_date: "2026-12-15" }, as: TrustOfficer, captures: { run: $.data.id } }
            - { call: "POST /payment-runs/${run}/fund", payload: { amount_cents: 10166667 }, as: Issuer, as_user_id: "issuer-1" }
          trigger:
            - { call: "POST /payment-runs/${run}/execute", payload: {}, as: TrustOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INDENTURE_NOT_ACTIVE"
            - "PaymentRun.${run}.distribution_status == SCHEDULED and funding_status == FUNDED (state untouched)"
            - "Indenture.${ind}.status == DEFAULTED"

      - name: collateral_decide_gated_by_default_case_state
        grounds:
          - state_machines.CollateralReleaseRequest
          - entities.DefaultCase.fields.status
          - errors[ERR_DEFAULT_LOCK]
        distinguishing_aspect: |
          Pair CollateralReleaseRequest -> DefaultCase: with GOOD coverage
          (12542 >= 12500, so the constraint check would pass), a decide
          APPROVE is still rejected solely because a DefaultCase of the
          indenture is CONFIRMED — the gate is the other entity's state.
        test_recipe:
          setup:
            - "Active indenture, one position 1000000000; C1 SECURITIES 800000000, C2 REAL_ESTATE 500000000"
            - "SUBSTITUTION request on C2 with substitute 470000000, VERIFIED (coverage 12542)"
            - "DefaultCase CONFIRMED after verification"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 1000000000 }, as: PlatformAdmin }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C1", collateral_type: "SECURITIES", appraised_value_cents: 800000000, valuation_date: "2026-04-01" }, as: TrustOfficer }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C2", collateral_type: "REAL_ESTATE", appraised_value_cents: 500000000, valuation_date: "2026-04-01" }, as: TrustOfficer, captures: { c2: $.data.id, c2_v: $.data.version } }
            - { call: "POST /collateral-release-requests", payload: { collateral_item_id: "${c2}", request_type: "SUBSTITUTION", substitute_description: "sub", substitute_collateral_type: "SECURITIES", substitute_appraised_value_cents: 470000000, substitute_valuation_date: "2026-04-15", expected_collateral_item_version: "${c2_v}" }, as: Issuer, as_user_id: "issuer-1", captures: { rr: $.data.id } }
            - { call: "POST /collateral-release-requests/${rr}/verify", payload: {}, as: TrustOfficer, as_user_id: "officer-1" }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "CROSS_DEFAULT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
          trigger:
            - { call: "POST /collateral-release-requests/${rr}/decide", payload: { decision: "APPROVE" }, as: TrustManager, as_user_id: "manager-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEFAULT_LOCK"
            - "CollateralReleaseRequest.${rr}.post_release_coverage_bps == 12542 (coverage check would have passed — the gate is purely the DefaultCase state)"
            - "CollateralReleaseRequest.${rr}.status == VERIFIED (unchanged)"

      - name: payment_run_create_gated_by_tranche_status
        grounds:
          - state_machines.Tranche
          - endpoints: "POST /payment-runs"
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair PaymentRun -> Tranche: after a FULL_REDEMPTION run executes
          and drives the tranche to REDEEMED (and the indenture to
          SATISFIED via bubble-up), creating another payment run on the
          terminal tranche is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Active indenture, tranche 400000000 with single position 400000000"
            - "FULL_REDEMPTION run target 400000000 funded and executed (outstanding -> 0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15", notice_period_days: 30 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "FULL_REDEMPTION", scheduled_payment_date: "2026-06-15", target_amount_cents: 400000000 }, as: TrustOfficer, captures: { run: $.data.id } }
            - { call: "POST /payment-runs/${run}/fund", payload: { amount_cents: 400000000 }, as: Issuer, as_user_id: "issuer-1" }
            - { call: "POST /payment-runs/${run}/execute", payload: {}, as: TrustOfficer }
          trigger:
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "INTEREST", period_start_date: "2026-06-15", period_end_date: "2026-12-15", scheduled_payment_date: "2026-12-15" }, as: TrustOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (tranche REDEEMED is terminal)"
            - "Tranche.${t1}.status == REDEEMED and outstanding_principal_cents == 0"
            - "Position.${pa}.status == REDEEMED with principal_amount_cents == 0"
            - "Indenture.${ind}.status == SATISFIED (bubble-up: all tranches terminal)"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: interest_period_half_open_overlap_with_adjacency_allowed
        grounds:
          - validations[priority=10]
          - errors[ERR_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource: Tranche payment calendar; semantics: HALF-OPEN intervals.
          [2026-06-15, 2026-12-15) collides with [2026-09-01, 2027-03-01)
          (ERR_PERIOD_OVERLAP) but the adjacent [2026-12-15, 2027-06-15)
          sharing the boundary date is ACCEPTED — adjacency is not overlap
          for half-open windows.
        test_recipe:
          setup:
            - "Active indenture, tranche, position A 400000000; existing INTEREST run over [2026-06-15, 2026-12-15)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "INTEREST", period_start_date: "2026-06-15", period_end_date: "2026-12-15", scheduled_payment_date: "2026-12-15" }, as: TrustOfficer, captures: { run1: $.data.id } }
          trigger:
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "INTEREST", period_start_date: "2026-09-01", period_end_date: "2027-03-01", scheduled_payment_date: "2027-03-01" }, as: TrustOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "INTEREST", period_start_date: "2026-12-15", period_end_date: "2027-06-15", scheduled_payment_date: "2027-06-15" }, as: TrustOfficer, captures: { run2: $.data.id } }
          assert:
            - "overlapping [2026-09-01, 2027-03-01) rejected with error_id == ERR_PERIOD_OVERLAP"
            - "adjacent [2026-12-15, 2027-06-15) accepted: PaymentRun.${run2} created (shared boundary 2026-12-15 is exclusive in the first window)"

      - name: solicitation_window_closed_interval_adjacency_collides
        grounds:
          - validations[priority=11]
          - errors[ERR_SOLICITATION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource: Indenture solicitation calendar; semantics: CLOSED
          intervals — the OPPOSITE geometric treatment from the half-open
          payment windows. Solicitation S1 window [2026-06-01, 2026-07-01]
          collides with S2 window [2026-07-01, 2026-08-01] because the shared
          date 2026-07-01 is included in both; a window starting 2026-07-02
          is accepted.
        test_recipe:
          setup:
            - "Active indenture with tranche; solicitation S1 in DRAFT with window [2026-06-01, 2026-07-01]"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /consent-solicitations", payload: { indenture_id: "${ind}", subject_type: "AMEND_TERMS", amendment_payload: { annual_admin_fee_cents: 2600000 }, consent_threshold_bps: 5000, tabulation_basis: "CURRENT_OUTSTANDING", record_date: "2026-06-01", expiry_date: "2026-07-01" }, as: Issuer, as_user_id: "issuer-1", captures: { sol1: $.data.id } }
          trigger:
            - { call: "POST /consent-solicitations", payload: { indenture_id: "${ind}", subject_type: "AMEND_TERMS", amendment_payload: { annual_admin_fee_cents: 2700000 }, consent_threshold_bps: 5000, tabulation_basis: "CURRENT_OUTSTANDING", record_date: "2026-07-01", expiry_date: "2026-08-01" }, as: Issuer, as_user_id: "issuer-1", captures: { err: $.data.error_id } }
            - { call: "POST /consent-solicitations", payload: { indenture_id: "${ind}", subject_type: "AMEND_TERMS", amendment_payload: { annual_admin_fee_cents: 2700000 }, consent_threshold_bps: 5000, tabulation_basis: "CURRENT_OUTSTANDING", record_date: "2026-07-02", expiry_date: "2026-08-01" }, as: Issuer, as_user_id: "issuer-1", captures: { sol2: $.data.id } }
          assert:
            - "window [2026-07-01, 2026-08-01] rejected with error_id == ERR_SOLICITATION_WINDOW_OVERLAP (shared date 2026-07-01 collides under closed semantics)"
            - "window [2026-07-02, 2026-08-01] accepted: ConsentSolicitation.${sol2} created"

      - name: redemption_notice_buffer_boundary
        grounds:
          - validations[priority=14]
          - errors[ERR_NOTICE_PERIOD_SHORT]
        distinguishing_aspect: |
          Resource: Tranche redemption notice channel; semantics: MINIMUM
          BUFFER (gap) rather than interval intersection — a third geometric
          treatment. With notice_period_days 30 and creation at 2026-05-01, a
          run scheduled 2026-05-30 (29 days) is rejected
          ERR_NOTICE_PERIOD_SHORT while 2026-05-31 (exactly 30 days) is
          accepted (>= is inclusive).
        test_recipe:
          setup:
            - "Active indenture, tranche with notice_period_days 30, position A 400000000; clock 2026-05-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15", notice_period_days: 30 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "SINKING_FUND_REDEMPTION", scheduled_payment_date: "2026-05-30", target_amount_cents: 1000000 }, as: TrustOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "SINKING_FUND_REDEMPTION", scheduled_payment_date: "2026-05-31", target_amount_cents: 1000000 }, as: TrustOfficer, captures: { run_ok: $.data.id } }
          assert:
            - "scheduled 2026-05-30 (29 days) rejected with error_id == ERR_NOTICE_PERIOD_SHORT"
            - "scheduled 2026-05-31 (exactly 30 days) accepted: PaymentRun.${run_ok} created — buffer boundary is inclusive"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: redemption_execute_reverse_principal_conservation
        grounds:
          - calculations.principal_position_reconciliation
          - state_machines.PaymentRun
          - entities.Tranche.fields.outstanding_principal_cents
        distinguishing_aspect: |
          Conserved quantity: PRINCIPAL. Executing a SINKING_FUND_REDEMPTION
          (target 99999999) then reversing it MUST restore every
          Position.principal_amount_cents (400000000/350000000/250000000),
          Tranche.outstanding_principal_cents (1000000000), and
          Indenture.outstanding_principal_cents bit-identically — zero drift
          from the floor+remainder allocation and back.
        test_recipe:
          setup:
            - "Active indenture, ACT_360 tranche, positions A 400000000 / B 350000000 / C 250000000"
            - "Funded SINKING_FUND_REDEMPTION run target 99999999"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
