            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R2", station: "DELI", allergen_tags: [], dietary_flags: [], popularity_share: 0.3, unit_cost_cents: 400, allergen_reviewed: true }, as: KitchenLead, captures: { r2: $.data.id } }
