            - *k_lane_p1
            - *k_lane_p2
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - &k_pkg_s1
              call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-S-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 40000, dimension_weight_grams: 40000 }
              as: SortOperator
              captures: { pkg_s1: $.data.id }
            - &k_pkg_s2
              call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-S-0002", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_s2: $.data.id }
            - call: "POST /airhub/packages/${pkg_s1}/induct"
              payload: { dimension_weight_grams: 40000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_s2}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
            - &k_p2_closed
              call: "POST /airhub/lanes/${lane_p2_id}/close"
              payload: {}
              as: SortSupervisor
            - call: "POST /airhub/packages/${pkg_s1}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
          trigger:
            - call: "GET /airhub/lanes/${lane_p1_id}"
              payload: {}
              as: SortOperator
              captures: { status_first_available: $.data.status, load_mid: $.data.lane_load_grams }
            - call: "POST /airhub/packages/${pkg_s2}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
            - call: "GET /airhub/lanes/${lane_p1_id}"
              payload: {}
              as: SortOperator
              captures: { status_forked_saturated: $.data.status }
            - call: "POST /airhub/lanes/${lane_p1_id}/close"
              payload: {}
              as: SortSupervisor
              captures: { status_closed: $.data.status }
            - call: "GET /airhub/lanes/${lane_p1_id}"
              payload: {}
              as: SortOperator
              captures: { load_closed: $.data.lane_load_grams }
            - call: "POST /airhub/packages/${pkg_s2}/reclaim-lane"
              payload: {}
              as: SortOperator
            - call: "POST /airhub/lanes/${lane_p1_id}/reopen"
              payload: {}
              as: SortSupervisor
              captures: { status_second_available: $.data.status, load_after_reclaim: $.data.lane_load_grams }
          assert:
            - "the first visit reads ${status_first_available} == AVAILABLE with ${load_mid} == 40000"
            - "the capacity branch off AVAILABLE reads ${status_forked_saturated} == SATURATED at 60000 grams"
            - "the operator branch off the same AVAILABLE state reads ${status_closed} == CLOSED"
            - "the second visit to AVAILABLE reads ${status_second_available} == AVAILABLE with ${load_after_reclaim} == 40000"
            - "SortLane.${lane_p2_id}.status == CLOSED, so the lane-specific fork did not leak across lanes"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: clear_contingency_four_hop_stranding_cascade
        grounds:
          - state_machines.Hub.transitions.LOCKDOWN_to_OPEN
          - calculations.live_planned_package_total
          - calculations.labor_variance_and_posture
          - calculations.labor_queue_triage
          - endpoints.POST_/airhub/hubs/{hub_id}/clear-contingency
          - endpoints.GET_/airhub/hubs/{hub_id}/triage
        distinguishing_aspect: "Depth 4 with every link caused by the previous one: clearing the contingency restores a rerouted package (Hub -> Package), that restoration lifts the live planning total and flips the posture (Package -> Hub), the posture change moves the containing shift from GREEN to SATURATED (Hub -> LaborShift), and the saturated shift throttles the next induction and the triage read (LaborShift -> Package/endpoint)."
        test_recipe:
          setup:
            - "Clock 1601. SDF hub with alternate IND (sort window 1380-1560), BANK_A with N701UP and N702UP landed and unloaded, shift N-B (1380-1630, headcount 64, productivity 4200, forecast 380000), seven 50000-gram baseline packages live on N701UP and one 100000-gram package P on N702UP whose diverge has just moved it out of the live set."
