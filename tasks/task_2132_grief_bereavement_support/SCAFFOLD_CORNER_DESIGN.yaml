              payload: { grant_award_id: "${g_id}", category: "REMEMBRANCE_EVENT", event_id: "${ev2_id}", expected_grant_award_version: "${g_v_seen}" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 412"
            - "err == ERR_STALE_GRANT_VERSION"
            - "GrantAward.${g_id}.committed_cents == 11446"
            - "GrantAward.${g_id}.available_cents == 488554"
            - "GET /bereavement/funding-allocations?grant_award_id=${g_id} returns exactly 1 row"

      - name: cohort_version_increments_by_one_on_every_seat_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Cohort.fields.seats_held, state_machines.Cohort.FORMING_to_OPEN_ENROLLMENT, state_machines.Enrollment.HELD_to_CONFIRMED]
        distinguishing_aspect: "Cohort.version starts at 1 on creation and rises by exactly 1 per mutation: 2 after open-enrollment, 3 after the enrollment hold and 4 after the confirmation, with no skipped or doubled increments."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One MeetingSpace and one accepted ANTICIPATED_ILLNESS Participant with a NEEDS Assessment."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Chapel Room", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/referrals"
              payload: { source_type: "HOSPICE", source_org_name: "Riverside Hospice", decedent_name: "Ann Vance", date_of_death: "2026-06-01", relationship_to_deceased: "SPOUSE", loss_type: "ANTICIPATED_ILLNESS", contact_name: "Ben Vance", contact_email: "ben.vance@example.org" }
              as: ReferralSource
              captures: { ref_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_id}/screen"
              payload: { eligibility_note: "ok" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /bereavement/participants/${p_id}/assessments"
              payload: { kind: "NEEDS", instrument: "ICG_SF", grief_severity: 20, isolation_index: 8, functional_impairment: 8, suicidality_flag: false }
              as: IntakeCoordinator
          trigger:
            - call: "POST /bereavement/cohorts"
              payload: { name: "Version Group", loss_type: "ANTICIPATED_ILLNESS", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 100000 }
              as: ProgramDirector
              captures: { c_id: $.data.id, v_create: $.data.version }
            - call: "POST /bereavement/cohorts/${c_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
              captures: { v_open: $.data.version }
            - call: "POST /bereavement/enrollments"
              payload: { participant_id: "${p_id}", cohort_id: "${c_id}", expected_cohort_version: "${v_open}" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "GET /bereavement/cohorts/${c_id}"
              payload: {}
              as: ProgramDirector
              captures: { v_hold: $.data.version }
            - call: "POST /bereavement/enrollments/${e_id}/confirm"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /bereavement/cohorts/${c_id}"
              payload: {}
              as: ProgramDirector
              captures: { v_confirm: $.data.version }
          assert:
            - "v_create == 1"
            - "v_open == 2"
            - "v_hold == 3"
            - "v_confirm == 4"
            - "Cohort.${c_id}.seats_filled == 1"
            - "Cohort.${c_id}.seats_held == 0"
            - "Cohort.${c_id}.seats_open == 3"

      - name: ops_run_checkpoint_advances_every_clock_driven_transition_in_one_pass
        claim_type: ops_run_checkpoint
        grounds: [endpoints.POST_/bereavement/_ops/cadence-run]
        excluded_because:
          difficulty_instance: transitive_cascade / counselor_deactivation_chain_requeue_reentry_tier_outreach_channel
          rationale: "The ops-run sweeps are covered instance by instance in the state_machines section (held-enrollment expiry, companion lapse cascade, outreach due and no-response), and the cascade depth those sweeps feed is already asserted by the §1.8 cascade instances."

      - name: dual_variant_calculation_layer_divergence
        claim_type: dual_variant_calculation
        grounds: [calculations.funding_allocation_amount, calculations.participant_outcome_delta]
        excluded_because:
          difficulty_instance: dual_variant_calc / funding_provisional_projected_vs_settled_actual_on_cohort_money
          rationale: "Both declared dual-variant calculations are asserted with pre-computed literals by the two §1.8 dual_variant_calc instances."

      - name: cascading_side_effects_layer_depth_and_ordering
        claim_type: cascading_side_effects
        grounds: [state_machines.Participant.ACTIVE_to_WITHDRAWN, state_machines.Counselor.ACTIVE_to_INACTIVE]
        excluded_because:
          difficulty_instance: transitive_cascade / participant_withdraw_chain_seat_cohort_allocation_grant
          rationale: "The two deepest cascades and their ordering are asserted end-to-end by the §1.8 transitive_cascade instances."

