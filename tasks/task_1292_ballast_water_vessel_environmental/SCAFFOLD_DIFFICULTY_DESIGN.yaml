              payload: { event_kind: UPTAKE, occurred_at: "2026-07-28T07:00:00Z", tank_id: "T2", volume_m3: 200, salinity_ppt: 32.0, source_port_locode: USNYC, expected_voyage_version: "${w4}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w5: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-30T08:00:00Z", tank_id: "T2", volume_m3: 200, latitude: 35.0, longitude: -140.0, distance_from_shore_nm: 250, expected_voyage_version: "${w5}" }
