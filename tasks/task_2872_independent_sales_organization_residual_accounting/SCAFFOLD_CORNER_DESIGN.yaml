            - call: "POST /merchants/${m101}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m102}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m103}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m104}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a2}", processor_program_id: "${p1}", mid: "MID-A201", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m201: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a2}", processor_program_id: "${p1}", mid: "MID-A202", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
