  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_flight_version_rejected_on_plan_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[load-plan-create-stale-flight]
          - errors[ERR_STALE_FLIGHT_VERSION]
        distinguishing_aspect: |
          The version the caller quotes is compared against the flight's
          current version, and a conditions update in between invalidates it:
          the plan creation that quotes the pre-update version is refused with
          412 ERR_STALE_FLIGHT_VERSION, no plan row is created, and re-quoting
          the current version succeeds. This is a reader-refresh discipline, not
          a timing artefact - the update simply happened first.
        test_recipe:
          setup:
            - "AC1, R1 with the [15,30) band, STD-2026 and FLT created at 22 C; the flight version is captured before the conditions are retuned to 24 C."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
            - call: "POST /flights"
              payload: { flight_number: "LX1602", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f1: $.data.id, f1_ver_old: $.data.version }
            - call: "PATCH /flights/${f1}/conditions"
              payload: { outside_air_temp_c: 24 }
              as: LoadController
              captures: { f1_ver_new: $.data.version }
          trigger:
            - call: "POST /load-plans"
              payload: { flight_id: "${f1}", expected_flight_version: "${f1_ver_old}" }
              as: LoadController
            - call: "POST /load-plans"
              payload: { flight_id: "${f1}", expected_flight_version: "${f1_ver_new}" }
              as: LoadController
              captures: { lp1: $.data.id }
          assert:
            - "first trigger: HTTP 412 with data.error_id == \"ERR_STALE_FLIGHT_VERSION\""
            - "GET /flights/${f1}/load-plans returns total_count == 0 immediately after the first trigger"
            - "second trigger: HTTP 201"
            - "LoadPlan.${lp1}.revision_no == 1"
            - "LoadPlan.${lp1}.status == \"DRAFT\""
            - "GET /flights/${f1}/load-plans returns total_count == 1"
            - "Flight.${f1}.outside_air_temp_c == 24"
            - "Flight.${f1}.version == ${f1_ver_new}"

      - name: version_counters_advance_on_accepted_writes_and_not_on_reads
        claim_type: optimistic_concurrency
        grounds:
          - entities.Flight.fields.version
          - entities.LoadPlan.fields.version
          - concurrency_rules[load-plan-create-stale-flight]
        distinguishing_aspect: |
          The version counters that the concurrency rules compare against must
          move on every accepted write and never on a read: the flight advances
          once for the conditions update and once again when the plan's compute
          writes the flight's load posture, the plan advances for the passenger
          line and for the compute, and three interleaved detail reads leave
          both counters exactly where they were.
        test_recipe:
          setup:
            - "AC1 with OC and H1; R1 with the [15,30) band; STD-2026; FLT at 22 C."
          setup_api_calls:
