  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: certify_state_before_safety_sod
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.ReviewRound.TALLYING_to_COMPLETED
          - errors[ERR_INVALID_ROUND_STATE]
          - errors[ERR_SOD_CERTIFIER_VOTED]
        distinguishing_aspect: |
          Pair state vs business_safety: the certifying chair holds a CAST ballot
          (safety violation, p8) AND the round is still VOTING_OPEN (state
          violation, p7 — certify requires TALLYING). The state error
          ERR_INVALID_ROUND_STATE wins because priority 7 < priority 8.
        test_recipe:
          setup:
            - "Case at DEPT_COMMITTEE; dept round VOTING_OPEN; committee 3 members + chair; the CHAIR has cast a YES ballot (chairs may vote; SoD only blocks certifying with a ballot)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
