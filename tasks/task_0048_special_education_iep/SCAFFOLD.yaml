scenario: "Special Education IEP Management: eligibility evaluation, annual IEP meeting, goal progress tracking, related services (OT/PT/Speech), parental consent, least restrictive environment, triennial reevaluation cycle, transition planning"
domain_name: special-education-iep
api_prefix: ""

complexity_profile:
  primary_archetype: Compliance / audit
  secondary_archetype: Multi-party negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Student is the hub; Evaluation, IEP, ConsentRequest reference it by FK.
  # Goal/RelatedService/TransitionPlan reference IEP; ProgressReport references Goal.
  # No nesting beyond two hops; all discovery via filtered-list or sub-resource GETs.

  state_machine_shape: branching
  # ConsentRequest is branching-with-revert (PENDING -> GRANTED/DENIED, GRANTED -> REVOKED,
  # then a fresh request loops back); IEP cycles ACTIVE -> AMENDMENT_PENDING -> ACTIVE;
  # Evaluation runs an eligibility branch with divergent side effects per outcome.

  relationship_patterns:
    - one_to_many        # Student 1:N Evaluation, IEP, ConsentRequest; IEP 1:N Goal, RelatedService; Goal 1:N ProgressReport
    - cross_aggregate    # IEP.activation gated by Student.eligibility_status and a GRANTED placement ConsentRequest

  role_model: segregation_of_duties
  # The CaseManager who authors/holds an IEP meeting cannot record the parental consent
  # decision for that same IEP (consent is the Parent's act, surfaced via the Parent role);
  # the Evaluator who finalizes an eligibility determination cannot also activate the IEP.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: student legal name
      - name: date_of_birth
        type: datetime
        source: input
        description: ISO 8601 date; used to derive the student's age at the server clock for transition-plan gating
      - name: grade_level
        type: integer
        source: input
        description: current grade level (K=0), 0..12
        constraints: 0..12
      - name: eligibility_status
        type: enum
        source: computed
        description: >-
          derived from the student's most recently FINALIZED Evaluation. NOT_EVALUATED until
          the first Evaluation is finalized; ELIGIBLE or INELIGIBLE thereafter. Recomputed on
          every Evaluation finalization (latest finalized Evaluation wins, by Evaluation.finalized_at).
        default: NOT_EVALUATED
        constraints: "enum: NOT_EVALUATED, ELIGIBLE, INELIGIBLE"
      - name: disability_category
        type: enum
        source: computed
        description: >-
          copied from the proposed_category of the most recently FINALIZED Evaluation whose outcome
          was ELIGIBLE; null while NOT_EVALUATED or INELIGIBLE.
        default: null
        constraints: "enum: SLD, AUTISM, SPEECH_LANGUAGE, OHI, EMOTIONAL, INTELLECTUAL, null"
      - name: active_iep_id
        type: string
        source: computed
        description: >-
          id of the student's IEP currently in state ACTIVE (at most one); null when no IEP is ACTIVE.
          Set when an IEP transitions to ACTIVE, cleared when it leaves ACTIVE.
        default: null
      - name: next_reeval_due_date
        type: datetime
        source: computed
        description: >-
          triennial reevaluation deadline = finalized_at of the latest FINALIZED Evaluation + 3 years
          (1095 days). null while NOT_EVALUATED.
        default: null

  - name: Evaluation
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id"
      - name: eval_type
        type: enum
        source: input
        description: INITIAL for first eligibility determination, TRIENNIAL for the 3-year reevaluation
        constraints: "enum: INITIAL, TRIENNIAL"
      - name: cognitive_score
        type: number
        source: input
        description: standardized cognitive assessment standard score (40..160)
        constraints: 40..160
      - name: academic_score
        type: number
        source: input
        description: academic achievement standard score (40..160)
        constraints: 40..160
      - name: adaptive_score
        type: number
        source: input
        description: adaptive-behavior standard score (40..160)
        constraints: 40..160
      - name: proposed_category
        type: enum
        source: input
        description: >-
          the disability category the evaluation team proposes; copied to Student.disability_category
          at finalization only when outcome == ELIGIBLE
        constraints: "enum: SLD, AUTISM, SPEECH_LANGUAGE, OHI, EMOTIONAL, INTELLECTUAL"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see §1.2
        default: REQUESTED
        constraints: "enum: REQUESTED, CONSENT_PENDING, IN_PROGRESS, FINALIZED"
      - name: composite_eligibility_score
        type: number
        source: computed
        description: >-
          weighted composite computed at finalization; see calculations.eligibility_composite_score.
          Pinned to 2 decimals.
        default: null
      - name: outcome
        type: enum
        source: computed
        description: ELIGIBLE or INELIGIBLE, decided at finalization from composite_eligibility_score threshold
        default: null
        constraints: "enum: ELIGIBLE, INELIGIBLE, null"
      - name: finalized_at
        type: datetime
        source: computed
        description: server clock timestamp captured when the Evaluation transitions to FINALIZED; null before
        default: null

  - name: IEP
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id"
      - name: school_day_minutes
        type: integer
        source: input
        description: total instructional minutes in the student's school day (used as LRE denominator)
        constraints: "> 0"
      - name: annual_review_due_date
        type: datetime
        source: input
        description: ISO 8601 date the annual IEP review is due (typically activation date + 1 year)
      - name: status
        type: enum
        source: system
        description: lifecycle state; see §1.2
        default: DRAFT
        constraints: "enum: DRAFT, MEETING_HELD, ACTIVE, AMENDMENT_PENDING, ARCHIVED"
      - name: lre_general_ed_pct
        type: number
        source: computed
        description: >-
          percentage of the school day the student spends in the general-education setting; see
          calculations.lre_general_ed_pct. Recomputed whenever a RelatedService on this IEP is
          created, updated, or removed. Pinned to 2 decimals.
        default: 100.0
      - name: lre_setting
        type: enum
        source: computed
        description: >-
          LRE placement bucket derived from lre_general_ed_pct via calculations.lre_setting_bucket.
        default: FULL_INCLUSION
        constraints: "enum: FULL_INCLUSION, RESOURCE, SEPARATE_CLASS"
      - name: activated_at
        type: datetime
        source: computed
        description: server clock timestamp captured when the IEP transitions to ACTIVE; null before
        default: null

  - name: Goal
    parent: null
    common_fields: true
    fields:
      - name: iep_id
        type: string
        source: input
        description: "FK -> IEP.id"
      - name: domain
        type: enum
        source: input
        description: instructional domain of the goal
        constraints: "enum: READING, MATH, WRITING, COMMUNICATION, BEHAVIOR, MOTOR"
      - name: baseline_value
        type: number
        source: input
        description: measured starting performance level for this goal
        constraints: ">= 0"
      - name: target_value
        type: number
        source: input
        description: target performance level defining mastery
        constraints: "> baseline_value"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see §1.2
        default: ACTIVE
        constraints: "enum: ACTIVE, MET, DISCONTINUED"
      - name: latest_progress_pct
        type: number
        source: computed
        description: >-
          provisional progress from the single most recent ProgressReport; see
          calculations.goal_progress_provisional. Pinned to 2 decimals.
        default: 0.0
      - name: cumulative_progress_pct
        type: number
        source: computed
        description: >-
          final progress averaged across all ProgressReports; see
          calculations.goal_progress_cumulative. Pinned to 2 decimals.
        default: 0.0

  - name: ProgressReport
    parent: null
    common_fields: false
    fields:
      - name: goal_id
        type: string
        source: input
        description: "FK -> Goal.id"
      - name: reporting_period
        type: integer
        source: input
        description: ordinal reporting period within the IEP year (1..4 for quarterly reporting)
        constraints: 1..4
      - name: measured_value
        type: number
        source: input
        description: measured performance level for this reporting period
        constraints: ">= 0"

  - name: RelatedService
    parent: null
    common_fields: true
    fields:
      - name: iep_id
        type: string
        source: input
        description: "FK -> IEP.id"
      - name: service_type
        type: enum
        source: input
        description: related service discipline
        constraints: "enum: OT, PT, SPEECH"
      - name: minutes_per_week
        type: integer
        source: input
        description: weekly service minutes
        constraints: "> 0"
      - name: delivered_in_general_ed
        type: boolean
        source: input
        description: >-
          true when the service is push-in (delivered inside the general-ed classroom, counts toward
          general-ed time); false when pull-out (removes the student from general ed).
      - name: status
        type: enum
        source: system
        description: lifecycle state; see §1.2
        default: ACTIVE
        constraints: "enum: ACTIVE, DISCONTINUED"

  - name: ConsentRequest
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id"
      - name: iep_id
        type: string
        source: input
        description: "FK -> IEP.id; null for EVALUATION consent which precedes any IEP"
        default: null
      - name: consent_type
        type: enum
        source: input
        description: >-
          EVALUATION (gates an Evaluation leaving CONSENT_PENDING) or PLACEMENT (gates an IEP
          leaving MEETING_HELD into ACTIVE)
        constraints: "enum: EVALUATION, PLACEMENT"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see §1.2
        default: PENDING
        constraints: "enum: PENDING, GRANTED, DENIED, REVOKED"
      - name: decided_at
        type: datetime
        source: computed
        description: server clock timestamp captured when the request transitions to GRANTED or DENIED; null before
        default: null

  - name: TransitionPlan
    parent: null
    common_fields: true
    fields:
      - name: iep_id
        type: string
        source: input
        description: "FK -> IEP.id"
      - name: postsecondary_goal
        type: string
        source: input
        description: measurable postsecondary goal (employment, education, independent living)
      - name: services_summary
        type: string
        source: input
        description: summary of transition services and agency linkages
      - name: status
        type: enum
        source: system
        description: lifecycle state; see §1.2
        default: DRAFT
        constraints: "enum: DRAFT, ADOPTED"

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: Evaluation
    initial_state: REQUESTED
    terminal_states: [FINALIZED]
    transitions:
      - from: REQUESTED
        to: CONSENT_PENDING
        trigger: "POST /evaluations/{id}/request-consent"
        actor: CaseManager
        preconditions:
          - "Evaluation.status == REQUESTED"
        side_effects:
          - "creates a ConsentRequest with consent_type=EVALUATION, student_id=Evaluation.student_id, iep_id=null, status=PENDING"
          - "increments Evaluation.version by 1"
      - from: CONSENT_PENDING
        to: IN_PROGRESS
        trigger: "POST /evaluations/{id}/begin"
        actor: Evaluator
        preconditions:
          - "Evaluation.status == CONSENT_PENDING"
          - "the EVALUATION ConsentRequest for this Evaluation's student_id is in status GRANTED"
        side_effects:
          - "increments Evaluation.version by 1"
        note: "cross-entity guard on ConsentRequest.status (see validations priority 40)"
      - from: IN_PROGRESS
        to: FINALIZED
        trigger: "POST /evaluations/{id}/finalize"
        actor: Evaluator
        preconditions:
          - "Evaluation.status == IN_PROGRESS"
        side_effects:
          - "computes composite_eligibility_score (calculations.eligibility_composite_score)"
          - "sets outcome = ELIGIBLE if composite_eligibility_score >= ELIGIBILITY_THRESHOLD else INELIGIBLE"
          - "stamps finalized_at = server clock"
          - "recomputes Student.eligibility_status from the latest FINALIZED Evaluation (this one)"
          - "if outcome == ELIGIBLE sets Student.disability_category = this Evaluation's proposed_category, else leaves it null"
          - "sets Student.next_reeval_due_date = finalized_at + 1095 days"
          - "increments Evaluation.version by 1; increments Student.version by 1"

  - entity: ConsentRequest
    initial_state: PENDING
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /consent-requests/{id}/decide"
        actor: Parent
        preconditions:
          - "ConsentRequest.status == PENDING"
          - "request body decision == GRANT"
        side_effects:
          - "stamps decided_at = server clock"
          - "increments ConsentRequest.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /consent-requests/{id}/decide"
        actor: Parent
        preconditions:
          - "ConsentRequest.status == PENDING"
          - "request body decision == DENY"
        side_effects:
          - "stamps decided_at = server clock"
          - "increments ConsentRequest.version by 1"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /consent-requests/{id}/revoke"
        actor: Parent
        preconditions:
          - "ConsentRequest.status == GRANTED"
        side_effects:
          - "increments ConsentRequest.version by 1"
          - "if consent_type == PLACEMENT and the linked IEP (ConsentRequest.iep_id) is ACTIVE, cascade: IEP transitions ACTIVE -> AMENDMENT_PENDING (placement consent withdrawn), which itself clears Student.active_iep_id; see IEP machine and transitive_cascade"
        note: "branching-with-revert; a fresh ConsentRequest must be created to retry after DENIED/REVOKED"

  - entity: IEP
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: MEETING_HELD
        trigger: "POST /ieps/{id}/hold-meeting"
        actor: CaseManager
        preconditions:
          - "IEP.status == DRAFT"
          - "Student.eligibility_status == ELIGIBLE"
        side_effects:
          - "creates a ConsentRequest with consent_type=PLACEMENT, student_id=IEP.student_id, iep_id=IEP.id, status=PENDING"
          - "increments IEP.version by 1"
        note: "cross-entity guard on Student.eligibility_status (see validations priority 41)"
      - from: MEETING_HELD
        to: ACTIVE
        trigger: "POST /ieps/{id}/activate"
        actor: SpecialEdAdmin
        preconditions:
          - "IEP.status == MEETING_HELD"
          - "the PLACEMENT ConsentRequest for this IEP (ConsentRequest.iep_id == IEP.id) is in status GRANTED"
          - "the student has no other IEP in status ACTIVE"
        side_effects:
          - "stamps activated_at = server clock"
          - "sets Student.active_iep_id = IEP.id; increments Student.version by 1"
          - "increments IEP.version by 1"
        note: "segregation of duties — actor SpecialEdAdmin, not the CaseManager who held the meeting; cross-entity guard on ConsentRequest.status (validations priority 42)"
      - from: ACTIVE
        to: AMENDMENT_PENDING
        trigger: "POST /ieps/{id}/open-amendment OR cascade from PLACEMENT consent revocation"
        actor: CaseManager | system
        preconditions:
          - "IEP.status == ACTIVE"
        side_effects:
          - "clears Student.active_iep_id (set to null); increments Student.version by 1"
          - "increments IEP.version by 1"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /ieps/{id}/activate"
        actor: SpecialEdAdmin
        preconditions:
          - "IEP.status == AMENDMENT_PENDING"
          - "the PLACEMENT ConsentRequest for this IEP (ConsentRequest.iep_id == IEP.id) is in status GRANTED"
          - "the student has no other IEP in status ACTIVE"
        side_effects:
          - "sets Student.active_iep_id = IEP.id; increments Student.version by 1"
          - "increments IEP.version by 1"
        note: "cyclic loop ACTIVE -> AMENDMENT_PENDING -> ACTIVE (revision rounds)"
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /ieps/{id}/archive"
        actor: SpecialEdAdmin
        preconditions:
          - "IEP.status == ACTIVE"
        side_effects:
          - "clears Student.active_iep_id (set to null); increments Student.version by 1"
          - "cascade: every Goal on this IEP whose status == ACTIVE transitions to DISCONTINUED; each such Goal transition itself cascades to set every ProgressReport-bearing summary unaffected (Goals only); see transitive_cascade"
          - "cascade: every RelatedService on this IEP whose status == ACTIVE transitions to DISCONTINUED"
          - "increments IEP.version by 1"

  - entity: Goal
    initial_state: ACTIVE
    terminal_states: [MET, DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: MET
        trigger: "system event on ProgressReport creation when cumulative_progress_pct >= 100"
        actor: system
        preconditions:
          - "Goal.status == ACTIVE"
          - "after the new ProgressReport, calculations.goal_progress_cumulative >= 100.0"
        side_effects:
          - "increments Goal.version by 1"
        note: "bubble-up auto-transition driven by ProgressReport.create side effect"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "cascade from IEP ACTIVE -> ARCHIVED, or POST /goals/{id}/discontinue"
        actor: CaseManager | system
        preconditions:
          - "Goal.status == ACTIVE"
        side_effects:
          - "increments Goal.version by 1"

  - entity: RelatedService
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "cascade from IEP ACTIVE -> ARCHIVED, or DELETE /related-services/{id}"
        actor: CaseManager | system
        preconditions:
          - "RelatedService.status == ACTIVE"
        side_effects:
          - "recomputes parent IEP.lre_general_ed_pct and IEP.lre_setting (calculations.lre_general_ed_pct, calculations.lre_setting_bucket)"
          - "increments RelatedService.version by 1; increments IEP.version by 1"

  - entity: TransitionPlan
    initial_state: DRAFT
    terminal_states: [ADOPTED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /transition-plans/{id}/adopt"
        actor: CaseManager
        preconditions:
          - "TransitionPlan.status == DRAFT"
          - "the parent IEP is in status ACTIVE"
        side_effects:
          - "increments TransitionPlan.version by 1"
        note: "cross-entity guard on IEP.status (validations priority 43)"

# ===========================================================================
# §1.2.1 Concurrency Rules
# ===========================================================================
concurrency_rules:
  - rule_id: amendment-open-stale-iep
    parent_entity: IEP
    write_endpoint: "POST /ieps/{id}/open-amendment"
    occ_field: "expected_iep_version"
    description: |
      Opening an amendment on an IEP whose version has advanced since the client last
      observed it is rejected on a stale-version basis. This captures the case where the
      IEP's version was already bumped (for example by a PLACEMENT-consent revocation that
      cascaded the IEP out of ACTIVE) after the client read it, so the amendment request's
      view of the IEP is stale and must not apply on top of the changed state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: service-add-stale-iep
    parent_entity: IEP
    write_endpoint: "POST /related-services"
    occ_field: "expected_iep_version"
    description: |
      Adding a RelatedService against an IEP whose version has advanced since the client
      last observed it is rejected on a stale-version basis. Each service add recomputes the
      parent IEP's lre_general_ed_pct and bumps IEP.version; a client carrying an outdated
      expected_iep_version is therefore working from a stale LRE picture and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: eligibility_composite_score
    trigger: "Evaluation IN_PROGRESS -> FINALIZED (POST .../finalize)"
    algorithm: weighted_scoring
    formula: |
      # All three sub-scores are standard scores (40..160). The eligibility model
      # weights the discrepancy between cognitive ability and academic achievement,
      # combined with adaptive functioning. Evaluation order is pinned.
      discrepancy = cognitive_score - academic_score            # ability-achievement gap
      if discrepancy < 0: discrepancy = 0                       # no negative gap contribution
      # Conditional branch on eval_type: TRIENNIAL reevaluations apply a continuity factor
      # because the student already carries a history.
      gap_weight = 0.5 if eval_type == "INITIAL" else 0.6
      adaptive_deficit = max(0, 100 - adaptive_score)           # below-average adaptive functioning
      raw = (gap_weight * discrepancy)
          + (W_ADAPTIVE * adaptive_deficit)
          + (W_ACADEMIC * max(0, 100 - academic_score))
      composite_eligibility_score = round(raw, 2)               # round_half_up, 2 dp
      # outcome decided by threshold:
      # outcome = ELIGIBLE if composite_eligibility_score >= ELIGIBILITY_THRESHOLD else INELIGIBLE
    input_set: "the three standard scores on this Evaluation plus its eval_type; no cross-entity inputs"
    constants:
      W_ADAPTIVE: 0.30
      W_ACADEMIC: 0.20
      ELIGIBILITY_THRESHOLD: 15.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: initial_model
        when: "eval_type == INITIAL"
        difference: "gap_weight = 0.5"
      - name: triennial_model
        when: "eval_type == TRIENNIAL"
        difference: "gap_weight = 0.6 (continuity factor for an already-identified student)"

  - name: goal_progress_provisional
    trigger: "ProgressReport created (POST .../progress-reports); refreshes Goal.latest_progress_pct"
    algorithm: aggregation
    formula: |
      # Provisional variant: uses ONLY the single most recent ProgressReport (highest
      # reporting_period; tie-break by created_at ASC then take the last). Measures
      # distance traveled from baseline toward target.
      latest = ProgressReport with max(reporting_period) for this goal
               (tie-break: created_at ASC, take the most recent)
      progress = (latest.measured_value - baseline_value) / (target_value - baseline_value) * 100
      latest_progress_pct = round(clamp(progress, 0, 100), 2)   # round_half_up, 2 dp
    input_set: "the single most-recent ProgressReport for the goal"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Goal.latest_progress_pct read"
        difference: "single most-recent report only; ignores earlier periods"

  - name: goal_progress_cumulative
    trigger: "ProgressReport created (POST .../progress-reports); refreshes Goal.cumulative_progress_pct and may bubble-up Goal -> MET"
    algorithm: aggregation
    formula: |
      # Final variant: averages the per-report progress across ALL ProgressReports for the
      # goal. Rounding order is PINNED — compute each report's progress, round each to 2 dp,
      # THEN average the rounded per-report values, then round the average to 2 dp.
      # (round-per-report-then-average, NOT average-then-round.)
      for each report r in all ProgressReports for this goal:
          p_r = round(clamp((r.measured_value - baseline_value) / (target_value - baseline_value) * 100, 0, 100), 2)
      cumulative_progress_pct = round( sum(p_r) / count(reports), 2 )   # round_half_up, 2 dp
      # bubble-up: if cumulative_progress_pct >= 100.0 then Goal ACTIVE -> MET
    input_set: "ALL ProgressReports for the goal, regardless of reporting_period"
    constants: {}
    precision: "2 decimal places, round_half_up; round per-report then average then round"
    variants:
      - name: final
        when: "Goal.cumulative_progress_pct read"
        difference: "averages every report; diverges from provisional whenever periods differ"

  - name: lre_general_ed_pct
    trigger: "RelatedService created/updated/discontinued on an IEP; refreshes IEP.lre_general_ed_pct"
    algorithm: aggregation
    formula: |
      # Least Restrictive Environment: percentage of the school day spent in general ed.
      # Pull-out related services (delivered_in_general_ed == false) REMOVE the student
      # from general ed for their minutes_per_week, expressed as a per-school-day share.
      # Rounding order is PINNED — convert each pull-out service's weekly minutes to a daily
      # share, round each service's daily-minute contribution to 2 dp, THEN sum, THEN divide.
      # (round-per-service-then-sum, NOT sum-then-round.)
      pullout_daily_total = 0.00
      for each RelatedService s on this IEP with status == ACTIVE and delivered_in_general_ed == false:
          daily_minutes_s = round(s.minutes_per_week / DAYS_PER_WEEK, 2)   # per service, 2 dp
          pullout_daily_total += daily_minutes_s
      pullout_daily_total = round(pullout_daily_total, 2)
      pct = (IEP.school_day_minutes - pullout_daily_total) / IEP.school_day_minutes * 100
      lre_general_ed_pct = round(clamp(pct, 0, 100), 2)          # round_half_up, 2 dp
    input_set: "all ACTIVE RelatedService rows on the IEP with delivered_in_general_ed == false; IEP.school_day_minutes as denominator"
    constants:
      DAYS_PER_WEEK: 5
    precision: "2 decimal places, round_half_up; round per-service then sum then divide"
    variants: []

  - name: lre_setting_bucket
    trigger: "computed alongside lre_general_ed_pct"
    algorithm: threshold
    formula: |
      # Boundary precision is PINNED with >= on the upper edges.
      if lre_general_ed_pct >= FULL_INCLUSION_FLOOR:       # >= 80.0
          lre_setting = FULL_INCLUSION
      elif lre_general_ed_pct >= RESOURCE_FLOOR:           # >= 40.0 and < 80.0
          lre_setting = RESOURCE
      else:                                                # < 40.0
          lre_setting = SEPARATE_CLASS
    input_set: "the IEP's just-computed lre_general_ed_pct"
    constants:
      FULL_INCLUSION_FLOOR: 80.0
      RESOURCE_FLOOR: 40.0
    precision: "exact comparison on a 2-dp percentage"
    variants: []

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the role is permitted to perform this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: >-
      segregation of duties — the SpecialEdAdmin activating an IEP must not be the same
      X-User-ID as the CaseManager recorded as having held that IEP's meeting; the Evaluator
      finalizing an Evaluation must not be the X-User-ID recorded as its requesting CaseManager
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ieps/{id}/activate, POST /evaluations/{id}/finalize"
  - priority: 10
    category: existence
    check: "every resource named in the path exists, validated left-to-right (Student, then nested resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 11
    category: business_referential
    check: "FK fields in the request body reference existing resources (student_id, iep_id, goal_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK body fields"
  - priority: 20
    category: business_constraint
    check: "required body fields present and well-typed; enum values in allowed set"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create and decision endpoints"
  - priority: 21
    category: business_constraint
    check: "Goal.target_value strictly greater than Goal.baseline_value; numeric scores within declared ranges; ProgressReport.reporting_period in 1..4"
    error_id: ERR_INVALID_RANGE
    http_status: 422
    applies_to: "POST /goals, POST /evaluations, POST /progress-reports"
  - priority: 30
    category: state
    check: "target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 31
    category: state
    check: "OCC — expected_<parent>_version matches the parent's current version (§1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../open-amendment, POST .../related-services"
  - priority: 40
    category: business_referential
    check: >-
      Evaluation may leave CONSENT_PENDING into IN_PROGRESS only if the EVALUATION
      ConsentRequest for its student is GRANTED (cross-entity: ConsentRequest.status)
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 409
    applies_to: "POST /evaluations/{id}/begin"
  - priority: 41
    category: business_constraint
    check: >-
      IEP may leave DRAFT into MEETING_HELD only if Student.eligibility_status == ELIGIBLE
      (cross-entity: Student.eligibility_status)
    error_id: ERR_STUDENT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /ieps/{id}/hold-meeting"
  - priority: 42
    category: business_referential
    check: >-
      IEP may enter ACTIVE only if its PLACEMENT ConsentRequest is GRANTED
      (cross-entity: ConsentRequest.status)
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 409
    applies_to: "POST /ieps/{id}/activate"
  - priority: 43
    category: business_constraint
    check: "TransitionPlan may be adopted only if its parent IEP is ACTIVE (cross-entity: IEP.status)"
    error_id: ERR_IEP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /transition-plans/{id}/adopt"
  - priority: 44
    category: business_temporal
    check: >-
      a TransitionPlan may be created only when the student's age at the current server clock
      instant (full years between Student.date_of_birth and the server clock) is >= TRANSITION_AGE
      (16 years); younger students are rejected
    error_id: ERR_TRANSITION_AGE_NOT_MET
    http_status: 409
    applies_to: "POST /transition-plans"
  - priority: 45
    category: business_constraint
    check: >-
      only one IEP per student may be ACTIVE at a time; activating a second while another is
      ACTIVE is rejected (cross-entity: sibling IEP state on the same student)
    error_id: ERR_ACTIVE_IEP_EXISTS
    http_status: 409
    applies_to: "POST /ieps/{id}/activate"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # Flat topology: every entity has a top-level collection (`/<collection>` for
  # list+create) and single-resource GET (`/<collection>/{id}`); FKs live in
  # request bodies; reverse-reachability is via `<fk_field>?` filtered lists.

  # ---- Student ----
  - method: POST
    path: "/students"
    description: "register a student"
    roles: [SpecialEdAdmin]
    code: 201
    input: [full_name, date_of_birth, grade_level]
    output: Student
    side_effects: ["creates Student in eligibility_status=NOT_EVALUATED"]
  - method: GET
    path: "/students/{id}"
    description: "fetch a student (includes computed eligibility_status, active_iep_id, next_reeval_due_date)"
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/students"
    description: "list students (paginated)"
    roles: [SpecialEdAdmin, CaseManager, Evaluator]
    code: 200
    input: ["limit?", "offset?", "eligibility_status?"]
    output: Student[]
    side_effects: []

  # ---- Evaluation ----
  - method: POST
    path: "/evaluations"
    description: "open an eligibility evaluation for a student (student_id in body)"
    roles: [CaseManager]
    code: 201
    input: [student_id, eval_type, cognitive_score, academic_score, adaptive_score, proposed_category]
    output: Evaluation
    side_effects: ["creates Evaluation in status REQUESTED; records requesting CaseManager X-User-ID"]
  - method: GET
    path: "/evaluations"
    description: "list evaluations, filterable by student_id (reverse-reachability for Evaluation.student_id)"
    roles: [SpecialEdAdmin, CaseManager, Evaluator]
    code: 200
    input: ["limit?", "offset?", "student_id?"]
    output: Evaluation[]
    side_effects: []
  - method: GET
    path: "/evaluations/{id}"
    description: "fetch one evaluation"
    roles: [SpecialEdAdmin, CaseManager, Evaluator]
    code: 200
    input: []
    output: Evaluation
    side_effects: []
  - method: POST
    path: "/evaluations/{id}/request-consent"
    description: "request parental evaluation consent (REQUESTED -> CONSENT_PENDING)"
    roles: [CaseManager]
    code: 200
    input: []
    output: Evaluation
    side_effects: ["creates EVALUATION ConsentRequest (PENDING)", "increments Evaluation.version"]
  - method: POST
    path: "/evaluations/{id}/begin"
    description: "begin testing (CONSENT_PENDING -> IN_PROGRESS); requires GRANTED evaluation consent"
    roles: [Evaluator]
    code: 200
    input: []
    output: Evaluation
    side_effects: ["increments Evaluation.version"]
  - method: POST
    path: "/evaluations/{id}/finalize"
    description: "finalize (IN_PROGRESS -> FINALIZED); computes composite score, outcome, and updates Student"
    roles: [Evaluator]
    code: 200
    input: []
    output: Evaluation
    side_effects:
      - "computes composite_eligibility_score, outcome, finalized_at"
      - "recomputes Student.eligibility_status, disability_category, next_reeval_due_date"
      - "increments Evaluation.version and Student.version"

  # ---- ConsentRequest ----
  - method: GET
    path: "/consent-requests"
    description: >-
      list consent requests, filterable by student_id or iep_id (reverse-reachability for
      ConsentRequest.student_id and ConsentRequest.iep_id); results ordered by created_at ASC then id ASC
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: ["limit?", "offset?", "student_id?", "iep_id?", "consent_type?", "status?"]
    output: ConsentRequest[]
    side_effects: []
  - method: GET
    path: "/consent-requests/{id}"
    description: "fetch one consent request"
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: []
    output: ConsentRequest
    side_effects: []
  - method: POST
    path: "/consent-requests/{id}/decide"
    description: "parent grants or denies a pending consent request (PENDING -> GRANTED|DENIED)"
    roles: [Parent]
    code: 200
    input: [decision]
    output: ConsentRequest
    side_effects: ["stamps decided_at", "increments ConsentRequest.version"]
  - method: POST
    path: "/consent-requests/{id}/revoke"
    description: "parent revokes previously-granted consent (GRANTED -> REVOKED); may cascade IEP out of ACTIVE"
    roles: [Parent]
    code: 200
    input: []
    output: ConsentRequest
    side_effects:
      - "increments ConsentRequest.version"
      - "if PLACEMENT consent on an ACTIVE IEP: cascade IEP ACTIVE -> AMENDMENT_PENDING, clears Student.active_iep_id"

  # ---- IEP ----
  - method: POST
    path: "/ieps"
    description: "draft an IEP for a student (student_id in body)"
    roles: [CaseManager]
    code: 201
    input: [student_id, school_day_minutes, annual_review_due_date]
    output: IEP
    side_effects: ["creates IEP in status DRAFT, lre_general_ed_pct=100.0, lre_setting=FULL_INCLUSION"]
  - method: GET
    path: "/ieps"
    description: "list IEPs, filterable by student_id (reverse-reachability for IEP.student_id)"
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: ["limit?", "offset?", "student_id?", "status?"]
    output: IEP[]
    side_effects: []
  - method: GET
    path: "/ieps/{id}"
    description: "fetch one IEP (includes computed lre_general_ed_pct, lre_setting)"
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: []
    output: IEP
    side_effects: []
  - method: POST
    path: "/ieps/{id}/hold-meeting"
    description: "record the annual IEP meeting (DRAFT -> MEETING_HELD); requires student ELIGIBLE"
    roles: [CaseManager]
    code: 200
    input: []
    output: IEP
    side_effects: ["creates PLACEMENT ConsentRequest (PENDING)", "records meeting CaseManager X-User-ID", "increments IEP.version"]
  - method: POST
    path: "/ieps/{id}/activate"
    description: "activate an IEP (MEETING_HELD|AMENDMENT_PENDING -> ACTIVE); requires GRANTED placement consent and no other ACTIVE IEP"
    roles: [SpecialEdAdmin]
    code: 200
    input: []
    output: IEP
    side_effects: ["stamps activated_at", "sets Student.active_iep_id", "increments IEP.version and Student.version"]
  - method: POST
    path: "/ieps/{id}/open-amendment"
    description: "open an amendment cycle (ACTIVE -> AMENDMENT_PENDING); OCC-guarded on IEP.version"
    roles: [CaseManager]
    code: 200
    input: [expected_iep_version]
    output: IEP
    side_effects: ["clears Student.active_iep_id", "increments IEP.version and Student.version"]
  - method: POST
    path: "/ieps/{id}/archive"
    description: "archive an IEP (ACTIVE -> ARCHIVED); discontinues its ACTIVE goals and services"
    roles: [SpecialEdAdmin]
    code: 200
    input: []
    output: IEP
    side_effects:
      - "clears Student.active_iep_id"
      - "cascade: ACTIVE Goals -> DISCONTINUED; ACTIVE RelatedServices -> DISCONTINUED"
      - "increments IEP.version and Student.version"

  # ---- Goal ----
  - method: POST
    path: "/goals"
    description: "add a measurable goal to an IEP (iep_id in body)"
    roles: [CaseManager]
    code: 201
    input: [iep_id, domain, baseline_value, target_value]
    output: Goal
    side_effects: ["creates Goal in status ACTIVE, latest_progress_pct=0, cumulative_progress_pct=0"]
  - method: GET
    path: "/goals"
    description: "list goals, filterable by iep_id (reverse-reachability for Goal.iep_id)"
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: ["limit?", "offset?", "iep_id?", "status?"]
    output: Goal[]
    side_effects: []
  - method: GET
    path: "/goals/{id}"
    description: "fetch one goal (includes computed latest_progress_pct, cumulative_progress_pct)"
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: []
    output: Goal
    side_effects: []
  - method: POST
    path: "/goals/{id}/discontinue"
    description: "discontinue a goal (ACTIVE -> DISCONTINUED)"
    roles: [CaseManager]
    code: 200
    input: []
    output: Goal
    side_effects: ["increments Goal.version"]

  # ---- ProgressReport ----
  - method: POST
    path: "/progress-reports"
    description: "record a progress data point on a goal (goal_id in body); refreshes provisional and cumulative progress; may bubble-up Goal -> MET"
    roles: [CaseManager]
    code: 201
    input: [goal_id, reporting_period, measured_value]
    output: ProgressReport
    side_effects:
      - "recomputes Goal.latest_progress_pct and Goal.cumulative_progress_pct"
      - "if cumulative_progress_pct >= 100 cascades Goal ACTIVE -> MET"
      - "increments Goal.version"
  - method: GET
    path: "/progress-reports"
    description: "list progress reports, filterable by goal_id (reverse-reachability for ProgressReport.goal_id)"
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: ["limit?", "offset?", "goal_id?"]
    output: ProgressReport[]
    side_effects: []
  - method: GET
    path: "/progress-reports/{id}"
    description: "fetch one progress report"
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: []
    output: ProgressReport
    side_effects: []

  # ---- RelatedService ----
  - method: POST
    path: "/related-services"
    description: "add an OT/PT/Speech related service to an IEP (iep_id in body); recomputes LRE; OCC-guarded on IEP.version"
    roles: [CaseManager]
    code: 201
    input: [iep_id, service_type, minutes_per_week, delivered_in_general_ed, expected_iep_version]
    output: RelatedService
    side_effects:
      - "recomputes parent IEP.lre_general_ed_pct and IEP.lre_setting"
      - "increments RelatedService.version (1) and IEP.version"
  - method: GET
    path: "/related-services"
    description: "list related services, filterable by iep_id (reverse-reachability for RelatedService.iep_id)"
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: ["limit?", "offset?", "iep_id?", "status?"]
    output: RelatedService[]
    side_effects: []
  - method: GET
    path: "/related-services/{id}"
    description: "fetch one related service"
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: []
    output: RelatedService
    side_effects: []
  - method: DELETE
    path: "/related-services/{id}"
    description: "discontinue a related service (ACTIVE -> DISCONTINUED); recomputes parent IEP LRE; OCC-guarded on IEP.version"
    roles: [CaseManager]
    code: 200
    input: [expected_iep_version]
    output: RelatedService
    side_effects:
      - "recomputes parent IEP.lre_general_ed_pct and IEP.lre_setting"
      - "increments RelatedService.version and IEP.version"

  # ---- TransitionPlan ----
  - method: POST
    path: "/transition-plans"
    description: "create a transition plan on an IEP (iep_id in body); requires student age >= 16 at the server clock"
    roles: [CaseManager]
    code: 201
    input: [iep_id, postsecondary_goal, services_summary]
    output: TransitionPlan
    side_effects: ["creates TransitionPlan in status DRAFT"]
  - method: GET
    path: "/transition-plans"
    description: "list transition plans, filterable by iep_id (reverse-reachability for TransitionPlan.iep_id)"
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: ["limit?", "offset?", "iep_id?"]
    output: TransitionPlan[]
    side_effects: []
  - method: GET
    path: "/transition-plans/{id}"
    description: "fetch one transition plan"
    roles: [SpecialEdAdmin, CaseManager, Evaluator, Parent]
    code: 200
    input: []
    output: TransitionPlan
    side_effects: []
  - method: POST
    path: "/transition-plans/{id}/adopt"
    description: "adopt a transition plan (DRAFT -> ADOPTED); requires parent IEP ACTIVE"
    roles: [CaseManager]
    code: 200
    input: []
    output: TransitionPlan
    side_effects: ["increments TransitionPlan.version"]

  # ---- test-driving (clock) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving: set the server clock used for finalized_at, decided_at, activated_at, age and reeval-due derivations"
    roles: [SpecialEdAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["pins the server clock to the supplied instant"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID, or unknown role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted for this operation per §1.7"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "acting user is the same person barred from this step under segregation of duties"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a resource named in the path does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "a foreign-key field in the request body references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, malformed body, or enum value outside the allowed set"
  - id: ERR_INVALID_RANGE
    http: 422
    condition: "numeric value out of declared range, or target_value <= baseline_value, or reporting_period outside 1..4"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a state from which the requested transition is defined"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_CONSENT_NOT_GRANTED
    http: 409
    condition: "the required EVALUATION or PLACEMENT consent is not in status GRANTED"
  - id: ERR_STUDENT_NOT_ELIGIBLE
    http: 409
    condition: "the student's eligibility_status is not ELIGIBLE when holding an IEP meeting"
  - id: ERR_IEP_NOT_ACTIVE
    http: 409
    condition: "the parent IEP is not ACTIVE when adopting a transition plan"
  - id: ERR_TRANSITION_AGE_NOT_MET
    http: 409
    condition: "student age at the current server clock is below the transition-planning age (16)"
  - id: ERR_ACTIVE_IEP_EXISTS
    http: 409
    condition: "activating an IEP while the student already has another IEP in status ACTIVE"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: SpecialEdAdmin
    description: "district special-education administrator; registers students and activates/archives IEPs"
    identity: "opaque"
    exclusive_operations:
      - "POST /students"
      - "POST /ieps/{id}/activate"
      - "POST /ieps/{id}/archive"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on students, ieps, goals, evaluations, related-services, consent-requests, transition-plans, progress-reports"
  - name: CaseManager
    description: "special-education teacher who authors IEPs, opens evaluations, manages goals/services, and holds meetings"
    identity: "opaque"
    exclusive_operations:
      - "POST /evaluations"
      - "POST /evaluations/{id}/request-consent"
      - "POST /ieps"
      - "POST /ieps/{id}/hold-meeting"
      - "POST /ieps/{id}/open-amendment"
      - "POST /goals"
      - "POST /goals/{id}/discontinue"
      - "POST /progress-reports"
      - "POST /related-services"
      - "DELETE /related-services/{id}"
      - "POST /transition-plans"
      - "POST /transition-plans/{id}/adopt"
    shared_operations:
      - "GET on students, ieps, goals, evaluations, related-services, consent-requests, transition-plans, progress-reports"
  - name: Evaluator
    description: "school psychologist who begins and finalizes eligibility evaluations"
    identity: "opaque"
    exclusive_operations:
      - "POST /evaluations/{id}/begin"
      - "POST /evaluations/{id}/finalize"
    shared_operations:
      - "GET on students, ieps, goals, evaluations, related-services, consent-requests, transition-plans, progress-reports"
  - name: Parent
    description: "the student's parent/guardian; the only role that decides or revokes consent"
    identity: "opaque"
    exclusive_operations:
      - "POST /consent-requests/{id}/decide"
      - "POST /consent-requests/{id}/revoke"
    shared_operations:
      - "GET on the student, ieps, goals, consent-requests, transition-plans"
