            - "Presentation.${p1_id}.settlement_status == VOID"
            - "Presentation.${p2_id}.examination_status == REFUSED"
            - "Presentation.${p2_id}.settlement_status == VOID"
            - "${avail_t4} == 10000000"
            - "${avail_t4} == ${avail_t0}"
            - "DocumentaryCredit.${credit_id}.available_cents == 10000000"
            - "DocumentaryCredit.${credit_id}.max_drawable_cents == 10000000"
            - "DocumentaryCredit.${credit_id}.chargeable_utilisation_cents == 10025000"
