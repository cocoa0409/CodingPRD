          - entities.CertificationTestRun.fields.result
        distinguishing_aspect: "Boundary inclusivity per pollutant leg: adjusted NOx of exactly 0.3500 against a 0.35 limit still PASSes, while a second run with passing NOx but adjusted PM 0.0101 against the 0.01 limit FAILs — both legs must hold."
        test_recipe:
          setup:
            - "Logical clock 2026-10-05T00:00:00Z; family TESTING (spec ACTIVE)."
          setup_api_calls:
            - *k_clock0
            - *k_std
            - *k_std_pub
