            - call: "GET /pricing/matches?product_id=${p_id}&match_grade=WEAK"
              payload: {}
              as: PricingAnalyst
              captures: { rows_weak: $.data }
          assert:
            - "Link confidences are exactly 10000 (${l1_id}), 7000 (${l2_id}) and 4000 (${l3_id}) with grades EXACT, CLOSE and WEAK"
            - "min_confidence_bp=7000 returns total_count == 2 containing ${l1_id} and ${l2_id}"
            - "min_confidence_bp=7001 returns total_count == 1 containing only ${l1_id}"
            - "status=PROPOSED with min_confidence_bp=7000 returns total_count == 1 containing only ${l2_id} — both filters apply, not just the last one"
            - "match_grade=WEAK returns total_count == 1 containing only ${l3_id}"

