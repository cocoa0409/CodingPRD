              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Ledger", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "IMPLANT", planned_start: "2026-09-20T13:00:00Z", planned_end: "2026-09-20T14:00:00Z", total_charge_cents: 90000 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /implant-lots"
              payload: { practice_id: "${prac_id}", manufacturer_code: "NOBEL", catalog_reference: "NB-4310", diameter_mm: 4.3, length_mm: 10.0, unit_cost_cents: 30000, quantity_on_hand: 4, expiry_date: "2027-01-31T00:00:00Z", is_consignment: true }
              as: InventoryManager
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
          trigger:
            - call: "POST /implant-reservations"
              payload: { case_id: "${case_id}", lot_id: "${lot_id}", quantity: 2, expected_lot_version: "${lot_v0}" }
              as: InventoryManager
              captures: { resA_id: $.data.id }
            - call: "POST /implant-reservations/${resA_id}/consume"
              payload: {}
              as: InventoryManager
            - call: "GET /implant-lots/${lot_id}"
              as: InventoryManager
              captures: { lot_v2: $.data.version }
            - call: "POST /implant-reservations"
              payload: { case_id: "${case_id}", lot_id: "${lot_id}", quantity: 1, expected_lot_version: "${lot_v2}" }
              as: InventoryManager
              captures: { resB_id: $.data.id }
            - call: "POST /implant-reservations/${resB_id}/release"
              payload: { disposition: "RELEASED" }
              as: InventoryManager
            - call: "GET /practices/${prac_id}"
              as: InventoryManager
          assert:
            - "after trigger[0]: reservation A has line_subtotal_cents == 60000, restocking_fee_cents == 6000, consignment_credit_cents == 12000, consignment_liability_cents == 48000; the lot reads quantity_on_hand 4 / quantity_reserved 2 / available_quantity 2 and Practice.consignment_committed_cents == 48000"
            - "after trigger[1]: reservation A is CONSUMED with consignment_liability_cents still 48000 (the HELD price is pinned) and Practice.consignment_committed_cents still 48000 - a CONSUMED row stays in the exposure sum"
            - "after trigger[1]: the lot reads quantity_on_hand 2 / quantity_reserved 0 / available_quantity 2 - consuming removes the units from the cabinet"
            - "after trigger[3]: reservation B has line_subtotal_cents == 30000, restocking_fee_cents == 4500 (the 15% tier), consignment_credit_cents == 6000, consignment_liability_cents == 24000 and the exposure is 72000"
            - "after trigger[4]: reservation B is RELEASED with consignment_credit_cents == 0 and consignment_liability_cents == 4500, while the lot returns to quantity_on_hand 2 / quantity_reserved 0 / available_quantity 2"
            - "trigger[5]: Practice.consignment_committed_cents is back to 48000 - the RELEASED row drops out of the sum entirely, its 4500 fee included, and only the CONSUMED row remains"

