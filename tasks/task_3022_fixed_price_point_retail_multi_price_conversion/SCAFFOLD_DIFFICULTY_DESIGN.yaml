        distinguishing_aspect: "AllocationLine → Container: the release edge's precondition reads Container.status, not the line's own state, so a RECEIVED container permits the release and an AT_PORT container refuses the identical call with ERR_CONTAINER_NOT_RECEIVED (409) while the line stays ALLOCATED with remaining_units intact."
        test_recipe:
          setup:
