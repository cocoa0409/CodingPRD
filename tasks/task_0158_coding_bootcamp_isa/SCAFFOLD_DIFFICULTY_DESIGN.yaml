# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Coding Bootcamp & ISA — Expert. 9 rule_ids x >=2 instances = 19 instances.
# Every ${var} traces to an earlier captures:. Numeric asserts are pre-computed.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: isa_projection_vs_chronological_actual_diverge
        grounds:
          - calculations.isa_payoff_projection
          - entities.ISAContract.fields.projected_payoff_cents
          - entities.ISAContract.fields.amount_paid_cents
          - state_machines.Payment.PENDING_to_SETTLED
        distinguishing_aspect: |
          On ISAContract: forward projection (latest income repeated for the 22 remaining months,
          projected_payoff_cents=2448000) diverges from the chronological actual ledger
          (amount_paid_cents=204000 from 2 SETTLED payments) for identical data.
        test_recipe:
          setup:
            - "ACTIVE ISAContract: income_share_pct=0.17, cap_cents=3000000, term_months=24, threshold=400000."
            - "Two monthly income reports at gross 600000 each filed and both payments SETTLED (amount_paid_cents=204000, payments_made_count=2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "FS A", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "Ada", email: "ada@x.com", reported_prior_income_cents: 300000 }
              as: AdmissionsOfficer
              captures: { app: $.data.id }
            - call: "POST /applicants/${app}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${app}", financing_choice: "ISA", deposit_amount_cents: 200000, isa_income_share_pct: 0.17, isa_cap_cents: 3000000, isa_term_months: 24, isa_income_threshold_cents: 400000 }
              as: AdmissionsOfficer
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/start"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr}", session_date: "2026-02-02T00:00:00Z", present: true, cumulative_progress_pct: 100 }
              as: AdmissionsOfficer
            - call: "POST /enrollments/${enr}/graduate"
              payload: {}
              as: AdmissionsOfficer
            - call: "GET /isa-contracts?enrollment_id=${enr}"
              payload: {}
              as: ServicingOfficer
              captures: { isa: "$.data[0].id" }
            - call: "POST /income-reports"
              payload: { isa_contract_id: "${isa}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", gross_income_cents: 600000, employment_status: "EMPLOYED" }
              as: ServicingOfficer
              captures: { ir1: $.data.id, pay1: $.data.payment_id }
            - call: "POST /payments/${pay1}/settle"
              payload: {}
              as: ServicingOfficer
            - call: "POST /income-reports"
              payload: { isa_contract_id: "${isa}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", gross_income_cents: 600000, employment_status: "EMPLOYED" }
              as: ServicingOfficer
              captures: { ir2: $.data.id, pay2: $.data.payment_id }
            - call: "POST /payments/${pay2}/settle"
              payload: {}
              as: ServicingOfficer
          trigger:
            - call: "GET /isa-contracts/${isa}/projection?variant=PROJECTED"
              payload: {}
              as: ServicingOfficer
              captures: { proj: $.data.projected_payoff_cents, actual: $.data.amount_paid_cents }
          assert:
            - "ISAContract.${isa}.amount_paid_cents == 204000"
            - "ISAContract.${isa}.projected_payoff_cents == 2448000"
            - "ISAContract.${isa}.projected_payoff_cents != ISAContract.${isa}.amount_paid_cents"

      - name: cirr_rate_graduates_only_vs_all_enrolled_diverge
        grounds:
          - calculations.cirr_placement_rate
          - entities.CIRRReport.fields.placement_rate
          - entities.CIRRReport.fields.denominator_basis
        distinguishing_aspect: |
          On CIRRReport (different entity domain than the ISA projection): identical placed_count=3
          yields placement_rate=0.75 under GRADUATES_ONLY (denom 4) but 0.5 under ALL_ENROLLED (denom 6).
        test_recipe:
          setup:
            - "GRADUATED cohort with 4 GRADUATED enrollments (3 with CIRR-eligible placements) and 2 non-graduate enrollments (1 DISMISSED, 1 WITHDRAWN), so enrolled_count basis=6, graduates_count=4, placed_count=3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "FS C", track: "FULLSTACK", capacity: 10, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "G1", email: "g1@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { a1: $.data.id }
            - call: "POST /applicants/${a1}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${a1}", financing_choice: "UPFRONT", deposit_amount_cents: 200000 }
              as: AdmissionsOfficer
              captures: { e1: $.data.id }
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "G2", email: "g2@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { a2: $.data.id }
            - call: "POST /applicants/${a2}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${a2}", financing_choice: "UPFRONT", deposit_amount_cents: 200000 }
              as: AdmissionsOfficer
              captures: { e2: $.data.id }
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "G3", email: "g3@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { a3: $.data.id }
            - call: "POST /applicants/${a3}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${a3}", financing_choice: "UPFRONT", deposit_amount_cents: 200000 }
              as: AdmissionsOfficer
              captures: { e3: $.data.id }
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "G4", email: "g4@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { a4: $.data.id }
            - call: "POST /applicants/${a4}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${a4}", financing_choice: "UPFRONT", deposit_amount_cents: 200000 }
              as: AdmissionsOfficer
              captures: { e4: $.data.id }
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "D5", email: "d5@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { a5: $.data.id }
            - call: "POST /applicants/${a5}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${a5}", financing_choice: "UPFRONT", deposit_amount_cents: 200000 }
              as: AdmissionsOfficer
              captures: { e5: $.data.id }
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "W6", email: "w6@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { a6: $.data.id }
            - call: "POST /applicants/${a6}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${a6}", financing_choice: "UPFRONT", deposit_amount_cents: 200000 }
              as: AdmissionsOfficer
              captures: { e6: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/start"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${e1}", session_date: "2026-02-02T00:00:00Z", present: true, cumulative_progress_pct: 100 }
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${e2}", session_date: "2026-02-02T00:00:00Z", present: true, cumulative_progress_pct: 100 }
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${e3}", session_date: "2026-02-02T00:00:00Z", present: true, cumulative_progress_pct: 100 }
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${e4}", session_date: "2026-02-02T00:00:00Z", present: true, cumulative_progress_pct: 100 }
              as: AdmissionsOfficer
