  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: bid_renewal_after_bid_lost_revives_event
        claim_type: valid_transition
        grounds: [state_machines.Event.BID_LOST_to_BIDDING, entities.Bid.fields.cycle_number]
        distinguishing_aspect: "Renewal cycle: after the only bid is REJECTED (Event BID_LOST), a fresh bid create revives the event to BIDDING with cycle_number 2 while the rejected bid stays terminal."
        test_recipe:
          setup: ["Event E BID_LOST after its cycle-1 bid was rejected"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { b1: $.data.id } }
            - { call: "POST /api/v1/bids/${b1}/requirements", payload: { kind: INSURANCE_CERT, is_mandatory: true, weight_points: 100 }, as: CommissionAdmin, captures: { rq1: $.data.id } }
            - { call: "POST /api/v1/requirements/${rq1}/evidence", payload: { evidence_uri: "s3://ev/ins.pdf" }, as: CommissionAdmin, as_user_id: "ops-admin-1" }
            - { call: "POST /api/v1/requirements/${rq1}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${b1}/submit", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/bids/${b1}/review", payload: {}, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${b1}/decide", payload: { decision: REJECTED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "GET /api/v1/events/${ev_id}", as: Any, captures: { ev_vr: $.data.version, evp: $.data.posture } }
          trigger:
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_vr}", notes: "renewal cycle" }, as: CommissionAdmin, captures: { b2: $.data.id, cyc: $.data.cycle_number } }
          assert:
            - "pre-trigger posture == BID_LOST"
            - "Bid.${b2}.cycle_number == 2 and status == DRAFT"
            - "Event.${ev_id}.posture == BIDDING (revived) and active_bid_id == ${b2}"
            - "Bid.${b1}.status remains REJECTED"
