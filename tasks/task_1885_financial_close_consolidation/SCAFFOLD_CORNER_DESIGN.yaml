              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/periods/${per_id}/tasks"
              payload: { entity_period_id: "${ep_id}", task_key: "SL_CUTOFF", title: "Cut subledgers", assignee_user_id: "prep-1", due_offset_hours: 24 }
