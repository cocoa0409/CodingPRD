              payload: { evaluation_year: 2027, resource_protection_score: 90, client_safety_score: 90, reporting_timeliness_score: 90, fee_compliance_score: 90 }
              as: ProgramAdministrator
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MINOR", action_type: "WARNING", cited_provision: "36 CFR 251.56(c)", cure_deadline_date: "2027-07-31" }
              as: PermitSpecialist
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-09", name: "Rogue Draw", total_allocated_service_days: 100, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 8, max_clients_per_guide: 8, reserved_admin_service_days: 0, min_liability_coverage_cents: 100000000 }
              as: PermitSpecialist
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: AuthorizedOfficer
            - call: "POST /osup/_ops/run-daily-compliance-sweep"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Rogue Guides LLC", ein: "410000099", contact_email: "ops@rogue.example" }
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters/${oa_id}/guides"
              payload: { full_name: "Sam Kite", qualification_level: "ASSISTANT", first_aid_cert_type: "WFR", first_aid_expires_on: "2030-06-30" }
              as: PermitSpecialist
            - call: "POST /osup/permits/${p_id}/acknowledge-indemnification"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/permits/${p_id}/activate"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/guides/${g_rita}/qualify"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/guides/${g_nora}/qualify"
              payload: {}
              as: AuthorizedOfficer
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_b}/screen"
              payload: {}
              as: PermitSpecialist
          assert:
            - "screening as AuthorizedOfficer and as ProgramAdministrator both return HTTP 403 ERR_UNAUTHORIZED — screening is PermitSpecialist-exclusive and the administrator's stand-in powers stop at the operations §1.7 actually lists"
            - "close-submissions as ProgramAdministrator returns HTTP 403 ERR_UNAUTHORIZED although the same role may issue and award the prospectus"
            - "performance-evaluations and noncompliance-actions are AuthorizedOfficer-exclusive: the administrator is refused on the first and the specialist on the second, both HTTP 403 ERR_UNAUTHORIZED"
            - "the three ProgramAdministrator-exclusive operations (POST /osup/use-areas, the clock and the sweep) return HTTP 403 ERR_UNAUTHORIZED to the specialist and the officer, so no program role can move the logical clock"
            - "registering an outfitter as AuthorizedOfficer returns HTTP 403 ERR_UNAUTHORIZED: the officer decides, the specialist and the administrator register"
            - "adding a guide and acknowledging indemnification return HTTP 403 ERR_UNAUTHORIZED to program roles — holder-exclusive writes cannot be performed on the holder's behalf"
            - "activating as PermitSpecialist returns HTTP 403 ERR_UNAUTHORIZED, not one of the activation gate errors: authorization is decided before any business precondition is evaluated"
            - "qualify succeeds for BOTH sharers: ${g_rita} via PermitSpecialist and ${g_nora} via AuthorizedOfficer, each landing in QUALIFIED with base_client_capacity 10"
            - "the holder can GET the permit (every GET endpoint is shared with all four roles) and receives the full row"
            - "the identical screen request that four calls were refused succeeds as PermitSpecialist: ${app_b} reaches DIRECT_AWARD_PENDING, proving the earlier refusals were authorization decisions and left no state behind"

      - name: foreign_holder_and_unknown_role_calls_are_unauthorized_at_the_boundary
        claim_type: segregation_of_duties
        grounds:
          - roles.OutfitterRepresentative.identity
          - errors[ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Three different authorization outcomes on one permit: an unknown role header is 401 before
          anything is looked up, a known role acting for the WRONG entity-backed identity is 403 on a
          write, and the same wrong identity is allowed on a READ, because §1.6 scopes
          ERR_NOT_RESOURCE_OWNER to writes only. The report probe additionally shows the ownership check
          runs ahead of the business rules: the period has not elapsed either, yet the answer is the
          ownership error, not the temporal one.
        test_recipe:
          setup:
            - "Alpine holds the ISSUED permit; Beta is a second registered outfitter with no interest in it"
            - "the permit was issued without indemnification, so the owner still has that write available"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Beta River Guides LLC", ein: "410000002", contact_email: "ops@beta.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { ob_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Alpine float program." }
              as: PermitSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_id}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${app_id}/issue-permit"
              payload: { term_start_date: "2027-01-01", term_end_date: "2029-12-31" }
              as: AuthorizedOfficer
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /osup/permits/${p_id}/acknowledge-indemnification"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${ob_id}"
            - call: "POST /osup/permits/${p_id}/insurance-certificates"
              payload: { coverage_type: "GENERAL_LIABILITY", carrier_name: "Beta Mutual", coverage_amount_cents: 100000000, effective_date: "2027-01-01", expiration_date: "2029-12-31", additional_insured_endorsed: true }
              as: OutfitterRepresentative
              as_user_id: "${ob_id}"
            - call: "POST /osup/permits/${p_id}/trip-use-reports"
              payload: { period_start_date: "2027-05-15", period_end_date: "2027-06-01", service_days_used: 5, client_count: 4, gross_revenue_cents: 100000 }
              as: OutfitterRepresentative
              as_user_id: "${ob_id}"
            - call: "POST /osup/outfitters/${oa_id}/guides"
              payload: { full_name: "Beta Ringer", qualification_level: "LEAD", first_aid_cert_type: "WFR", first_aid_expires_on: "2030-06-30" }
              as: OutfitterRepresentative
              as_user_id: "${ob_id}"
            - call: "POST /osup/permits/${p_id}/acknowledge-indemnification"
              payload: {}
              as: "UNKNOWN_ROLE"
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: "UNKNOWN_ROLE"
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${ob_id}"
            - call: "POST /osup/permits/${p_id}/acknowledge-indemnification"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
          assert:
            - "Beta's acknowledge-indemnification and insurance-certificate writes against Alpine's permit both return HTTP 403 ERR_NOT_RESOURCE_OWNER, and the permit's indemnification_acknowledged stays false"
            - "Beta's use report returns HTTP 403 ERR_NOT_RESOURCE_OWNER even though the period has not elapsed at clock 2027-01-05 — the ownership check precedes the temporal rule, so ERR_PERIOD_NOT_ELAPSED is never reached"
            - "Beta adding a guide to Alpine's roster returns HTTP 403 ERR_NOT_RESOURCE_OWNER: the owning entity is resolved from the path parent, not from the body"
            - "an unrecognised X-User-Role returns HTTP 401 ERR_UNAUTHENTICATED on the write and on the read alike — the role header is validated against the four declared roles before any resource lookup, so this is 401 and not 403"
            - "Beta CAN read Alpine's permit (HTTP 200 with the full row): ERR_NOT_RESOURCE_OWNER is scoped to writes, so a read-side tenancy filter would be wrong here"
            - "the owner's identical acknowledge-indemnification request succeeds: indemnification_acknowledged true and version incremented, proving the four refusals were identity decisions"

      - name: the_same_user_id_cannot_review_and_approve_or_issue_and_decide_its_own_action
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints.POST /osup/operating-plans/{id}/approve
          - endpoints.POST /osup/noncompliance-actions/{id}/decide-appeal
        distinguishing_aspect: |
          The bar is on the USER ID, not the role, so switching to ProgramAdministrator while keeping the
          same X-User-ID is still refused — the tempting shortcut of comparing roles instead of ids fails
          here. Both duty pairs are exercised: the reviewer of a plan may neither approve nor reject it,
          and the officer who issued a noncompliance action may not decide its appeal. In each pair a
          second user id performs the very request that was refused, and the UPHELD decision leaves the
          MINOR action's points in place.
