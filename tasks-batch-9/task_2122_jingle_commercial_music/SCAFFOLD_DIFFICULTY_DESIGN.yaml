  - rule_id: compensating_invariant
    instances:

      - name: confirm_then_outside_window_cancel_conserves_every_budget_cent
        grounds:
          - calculations.project_budget_ledger
          - state_machines.SessionCall.SCHEDULED_to_CONFIRMED
          - state_machines.SessionCall.CONFIRMED_to_CANCELLED_OUTSIDE_WINDOW
          - state_machines.MusicianBooking.BOOKED_to_RELEASED
        distinguishing_aspect: |
          The conserved quantity is money: Project.budget_cents must always equal
          committed_cents + available_cents + spent_cents, and the pair
          (confirm, cancel-at-or-outside-the-24-hour-window) must return all three
          buckets to their exact pre-confirmation values 0 / 3850000 / 150000 with
          zero drift on the 235012 cents that moved.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, i.e. 216 hours before the call starts"
            - "Project budget_cents 4000000 in IN_PRODUCTION; pre-confirmation ledger committed 0, available 3850000, spent 150000"
            - "SessionCall 2026-09-10T09:00Z-13:00Z in Room A at 40000 cents/hour with three SIGNATORY_CLEARED players at 6251 cents/hour, CONFIRMED with committed_cents 235012"
